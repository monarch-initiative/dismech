    snippet: "Sequence data from 35,000 Finnish population controls indicated that the heterozygous carrier frequency of p.Q286X change was exceptionally high in Finland, 1:80, but no homozygotes were found in the population"
    explanation: Population carrier frequency of a recurrent TSFM null allele.

progression:
- phase: Fatal neonatal and infantile course
  age_range: birth to 12 months
  notes: >-
    The recurrent p.Arg333Trp allele, homozygous, has been associated with
    death in infancy in every reported case, whether the presentation was
    encephalomyopathy, hypertrophic cardiomyopathy or liver failure; both
    founding patients died at seven weeks.
  evidence:
  - reference: PMID:35071363
    reference_title: "Case Report: Whole Exome Sequencing Identifies Compound Heterozygous Variants in TSFM Gene Causing Juvenile Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Smeitink et al. reported two unrelated patients with this variant, one with mitochondrial encephalomyopathy, and another patient with concentric hypertrophic cardiomyopathy and muscular hypotonia, both of whom died at 7 weeks"
    explanation: Infantile deaths in the founding homozygous patients.
- phase: Childhood to adult-onset slowly progressive course
  age_range: 2 to 33 years
  notes: >-
    Compound heterozygous and some homozygous missense genotypes give slower
    courses that begin in childhood, adolescence or early adulthood:
    infantile cardiomyopathy that stabilises, childhood ataxia, juvenile Leigh
    syndrome with optic atrophy and neuropathy, a hyperkinetic movement
    disorder, or an adult dilated cardiomyopathy. Neurological features may
    appear after an earlier cardiac presentation.
  evidence:
  - reference: PMID:33816677
    reference_title: "Novel Mutation in the TSFM Gene Causes an Early-Onset Complex Chorea without Basal Ganglia Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disorders caused by mutations in the TSFM gene have been reported in only 16 patients so far with a wide phenotypic spectrum, ranging from fatal neonatal-onset to moderate disease courses presenting only in early adulthood."
    explanation: Describes the span from fatal neonatal to early-adult onset.
  - reference: PMID:25037205
    reference_title: "Mitochondrial EFTs defects in juvenile-onset Leigh disease, ataxia, neuropathy, and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used whole-exome sequencing to find the genetic cause of infantile-onset mitochondrial cardiomyopathy, progressing to juvenile-onset Leigh syndrome, neuropathy, and optic atrophy in 2 siblings."
    explanation: A cardiac onset in infancy followed by neurological disease in adolescence.

discussions:
- discussion_id: organ_selectivity_unexplained
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does the same homozygous p.Arg333Trp allele produce a fatal
    encephalomyopathy in one infant, a fatal cardiomyopathy in another and
    liver failure in a third?
  attaches_to:
  - pathophysiology#Cellular Energy Failure
  rationale: >-
    The founding authors proposed genetic modifiers of the mitochondrial
    translation apparatus. Work in GFM1 patient tissues showed that the
    relative amounts of EF-Tu and EF-Ts differ between tissues and that
    over-expressing either factor can be dominant negative, and an adult TSFM
    patient's fibroblasts compensated by raising EF-Tu while her heart did
    not. Tissue-specific EF-Tu to EF-Ts stoichiometry is therefore a candidate
    explanation, but no study has measured it across tissues of TSFM
    patients.
- discussion_id: genotype_severity_correlation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do compound heterozygous TSFM genotypes reliably give a milder course than
    homozygosity for p.Arg333Trp?
  attaches_to:
  - progression#Childhood to adult-onset slowly progressive course
  - genetic#TSFM
  rationale: >-
    Every reported p.Arg333Trp homozygote died in infancy, while compound
    heterozygotes have survived into adolescence or adulthood, and one report
    suggests compound heterozygosity is less severe. The cohort is under
    twenty patients across about a dozen genotypes, the homozygous null state
    appears lethal before birth, and residual EF-Ts activity has been
    measured for only one allele, so the correlation is suggested rather than
    shown.
- discussion_id: no_animal_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a whole-organism model of TSFM deficiency?
  attaches_to:
  - pathophysiology#Impaired Elongation of Mitochondrial Translation
  rationale: >-
    A PubMed search on 2026-10-30 for (Tsfm[tiab] OR "EF-Ts"[tiab]) AND
    (mouse OR mice OR zebrafish OR knockout OR drosophila) returned six
    records, none describing an animal model of TSFM deficiency. All
    mechanistic evidence for this disease comes from patient cells, patient
    tissue and reconstituted biochemistry, so the organ-level steps of the
    pathograph are inferred rather than tested in an organism.

notes: >-
  Entity identity. MONDO:0012512 (fatal mitochondrial disease due to combined
  oxidative phosphorylation defect type 3) is equivalent to OMIM:610505 and
  ORPHA:168566, and its causal gene is TSFM. The "fatal" in the MONDO and
  Orphanet labels reflects the first reported patients; later compound
  heterozygous patients have survived to adulthood, so the entry name uses
  the shorter series name, matching the sibling COXPD4 (TUFM) entry.

  Lump decision. No subtypes are declared. Cardiac, neurological and hepatic
  presentations occur with the same homozygous allele in different families,
  so they are presentations of one disease rather than separable entities.

  GeneReviews. No GeneReviews chapter covers TSFM or COXPD3 (checked with
  just check-genereviews against the Bookshelf index and an online PubMed
  title search).

  Treatment. There is no disease-specific therapy. Recorded treatments are
  supportive or single-patient reports. Dichloroacetate is mentioned in one
  review paragraph as having reduced left ventricular mass in one TSFM
  patient, but the primary report is not identified in the cited text, so it
  is not recorded as a treatment.

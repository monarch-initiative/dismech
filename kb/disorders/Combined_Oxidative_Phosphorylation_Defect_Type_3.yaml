    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These phenotypes and the translation defect were rescued by retroviral expression of either EFTs or EFTu."
    explanation: Establishes a mitochondrial translation defect in patient cells that EF-Ts re-expression corrects.
  - reference: PMID:25037205
    reference_title: "Mitochondrial EFTs defects in juvenile-onset Leigh disease, ataxia, neuropathy, and optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our molecular modeling predicted the coding-region mutations to cause protein instability, which was experimentally confirmed in cultured patient cells, with mitochondrial translation defect and lacking EFTs."
    explanation: An independent genotype giving the same mitochondrial translation defect.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      The thirteen mtDNA-encoded subunits are distributed across complexes I,
      III, IV and V, so under-supplying them makes those complexes fail
      together while complex II, wholly nuclear-encoded, is spared.

- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Complex Deficiency"
  description: >-
    Assembled complexes I, IV and V are reduced in patient fibroblasts, and
    patient myocardium shows reduced complex I and IV activity with complex II,
    III and V subunits preserved. Muscle biopsy in other patients shows
    multiple respiratory chain deficiency or a predominant complex IV defect.
    Which complex falls furthest varies with tissue and patient, as expected
    for a translation defect that touches all four mtDNA-dependent complexes.
    Complex II sparing has been shown at the subunit level in heart and by
    normal succinate dehydrogenase histochemistry in skeletal muscle.
  cell_types:

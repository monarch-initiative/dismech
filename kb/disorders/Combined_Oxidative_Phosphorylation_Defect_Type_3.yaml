name: Combined Oxidative Phosphorylation Defect Type 3
creation_date: "2026-10-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Combined oxidative phosphorylation defect type 3
  term:
    id: MONDO:0012512
    label: fatal mitochondrial disease due to combined oxidative phosphorylation defect type 3
synonyms:
- COXPD3
- combined oxidative phosphorylation deficiency 3
- combined oxidative phosphorylation deficiency type 3
- fatal mitochondrial disease due to COXPD3
- TSFM combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in TSFM
- TSFM-related mitochondrial disease
description: >-
  Combined oxidative phosphorylation defect type 3 (COXPD3) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in TSFM, which
  encodes mitochondrial translation elongation factor Ts (EF-Ts). EF-Ts is the
  guanine nucleotide exchange factor for elongation factor Tu (EF-Tu): after
  EF-Tu has delivered an aminoacyl-tRNA to the mitochondrial ribosome it is
  released bound to GDP, and EF-Ts regenerates the GTP-bound form so that the
  next round of elongation can proceed. The two factors also stabilise each
  other, so a destabilised EF-Ts lowers the steady-state level of EF-Tu as
  well.

  The lesion therefore sits in the shared elongation machinery that makes all
  thirteen mtDNA-encoded respiratory chain subunits. Their synthesis falls
  together, and complexes I, III, IV and V, which each contain mtDNA-encoded
  subunits, are under-assembled while the wholly nuclear-encoded complex II is
  spared. That combined pattern is what names the disease.

  The clinical range is unusually wide for so few patients. The recurrent
  p.Arg333Trp allele, homozygous, has produced a fatal neonatal
  encephalomyopathy, a fatal infantile hypertrophic cardiomyopathy, and
  infantile liver failure, all with death in infancy. Compound heterozygous
  genotypes have produced slower courses: infantile cardiomyopathy that
  stabilises, childhood-onset ataxia with cardiomyopathy, juvenile-onset Leigh
  syndrome with optic atrophy and peripheral neuropathy, an early-onset
  hyperkinetic movement disorder, and a dilated cardiomyopathy with
  fibro-adipose replacement that led to heart transplantation at 33.
  Hypertrophic cardiomyopathy, hypotonia, optic atrophy and lactic acidosis
  are the most frequently reported features. Fewer than twenty patients had
  been described by 2021, and there is no disease-specific treatment.
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism

      A Mendelian, mechanism-defined mitochondrial disorder, diagnosed and
      managed as an inherited disease rather than within one organ system.
  - classification_value: CARDIOVASCULAR
    notes: >-
      Cardiomyopathy is the most frequently reported manifestation and the one
      that determines survival in patients who outlive infancy.
  - classification_value: NEUROLOGIC

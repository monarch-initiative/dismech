    evidence_source: IN_VITRO
    snippet: "The steady-state levels of EFTs and EFTu in patient fibroblasts were reduced by 75% and 60%, respectively, and the amounts of assembled complexes I, IV, and V were reduced by 35%-91% compared with the amounts in controls."
    explanation: Reduced assembly of the mtDNA-dependent complexes in patient fibroblasts.
  - reference: PMID:30911037
    reference_title: "Novel compound mutations in the mitochondrial translation elongation factor (TSFM) gene cause severe cardiomyopathy with myocardial fibro-adipose replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This feature was paralleled by reduction of the steady-state levels of selected C-I and C-IV subunits, while C-II, C-III and C-V subunits were spared"
    explanation: >-
      Subunit-level measurement in patient myocardium, including the sparing of
      complex II that distinguishes a translation defect.
  - reference: PMID:21741925
    reference_title: "Mutation in the mitochondrial translation elongation factor EFTs results in severe infantile liver failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a kindred with intrauterine growth retardation, neonatal lactic acidosis, liver dysfunction and multiple respiratory chain deficiency in muscle"
    explanation: Multiple respiratory chain deficiency in skeletal muscle of the liver-failure family.
  - reference: PMID:35071363

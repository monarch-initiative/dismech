    snippet: "With remarkable improvement of ejection fraction from 10 to 30% and alleviation of heart failure symptoms, she was discharged with oral therapy of lisinopril, furosemide, chlorothiazide, spironolactone, and aspirin."
    explanation: Reports the regimen and the improvement in one patient; uncontrolled.
- name: Heart Transplantation
  description: >-
    Performed at 33 years in the woman with dilated cardiomyopathy and
    biventricular fibro-adipose replacement. The explanted heart provided the
    tissue biochemistry for the diagnosis.
  therapeutic_modality: SURGERY

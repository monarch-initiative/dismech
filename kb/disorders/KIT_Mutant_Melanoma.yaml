name: KIT Mutant Melanoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  KIT-mutant melanoma is a molecularly defined melanoma stratum occurring
  predominantly in acral, mucosal, and chronically sun-damaged (CSD) melanomas,
  characterized by somatic activating mutations (or concurrent copy-number gains)
  of the KIT proto-oncogene receptor tyrosine kinase on chromosome 4q11-12. KIT
  alterations occur in roughly 1-7% of melanomas overall, enriched to ~11-23% of
  acral melanomas, ~15-21% of mucosal melanomas, and up to ~27-28% of CSD
  cutaneous melanomas, while remaining uncommon (<5%) in non-CSD cutaneous
  melanoma and typically mutually exclusive with BRAF and NRAS driver mutations.
  Constitutive KIT activation drives RAS-RAF-MEK-ERK, PI3K-AKT, and JAK-STAT
  signaling to sustain melanocyte proliferation and survival. Patients harboring
  activating exon 11 (e.g., L576P) or exon 13 (e.g., K642E) KIT mutations achieve
  clinically meaningful responses to KIT tyrosine kinase inhibitors (imatinib,
  nilotinib, ripretinib), whereas KIT amplification alone shows minimal TKI
  sensitivity; immune checkpoint blockade (anti-PD-1 / anti-CTLA-4) provides an
  exon-independent systemic option.
synonyms:
- KIT-mutated melanoma
- KIT-altered melanoma
- KIT-driven melanoma
- c-KIT-mutant melanoma
- CD117-mutant melanoma
categories:
- Skin Cancer
- Molecularly Defined Cancer
- Oncogene-Driven Cancer

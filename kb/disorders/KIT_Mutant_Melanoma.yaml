  evidence:
  - reference: PMID:23775962
    reference_title: "Imatinib for melanomas harboring mutationally activated or amplified KIT arising on mucosal, acral, and chronically sun-damaged skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BORR was significantly greater than the hypothesized null of 5% and statistically significantly different by mutation status (7 of 13 or 54% KIT mutated v 0% KIT amplified only)."
    explanation: Directly demonstrates lack of objective imatinib response in KIT amplification-only tumors compared with 54% BORR in KIT-mutated tumors.
treatments:
- name: Imatinib
  description: >-
    First-generation tyrosine kinase inhibitor targeting KIT, ABL, and PDGFR and
    the preferred front-line KIT TKI for unresectable or metastatic melanoma
    harboring activating exon 11 (L576P, pooled ORR 52%) or exon 13 (K642E, pooled
    ORR 42%) KIT mutations, whereas amplification-only disease lacks objective
    response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  target_mechanisms:
  - target: KIT Receptor Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Competitively inhibits ATP binding in mutant KIT kinase domains (particularly
      exon 11 and exon 13 variants), suppressing downstream MAPK, PI3K-AKT, and
      JAK-STAT signaling.
  evidence:
  - reference: PMID:23775962
    reference_title: "Imatinib for melanomas harboring mutationally activated or amplified KIT arising on mucosal, acral, and chronically sun-damaged skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Best overall response rate (BORR) was 29% (21% excluding nonconfirmed responses) with a two-stage 95% CI of 13% to 51%."
    explanation: Phase II trial reporting best overall response rate to imatinib in KIT-altered melanoma.
  - reference: PMID:21642685
    reference_title: KIT as a therapeutic target in metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall durable response rate was 16%"
    explanation: Phase II trial by Carvajal et al. demonstrating a 16% durable response rate to imatinib.
  - reference: PMID:35999272
    reference_title: "Clinical and genomic correlates of imatinib response in melanomas with KIT alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the pooled analysis (N = 130), alterations in exons 11/13 had the highest response rates (38% and 33%); L576P (N = 23) and K642E (N = 12) mutations had ORR of 52% and 42%, respectively.
    explanation: >-
      Multicenter 130-patient pooled analysis establishing exon- and variant-level
      imatinib response rates.
  - reference: PMID:34562816
    reference_title: "c-Kit inhibitors for unresectable or metastatic mucosal, acral or chronically sun-damaged melanoma: a systematic review and one-arm meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled ORR for all inhibitors was 15%"
    explanation: Meta-analysis of 19 studies (601 patients) pooling objective response rates across KIT inhibitors.
- name: Nilotinib
  description: >-
    Second-generation KIT-selective tyrosine kinase inhibitor demonstrating an ORR
    of 26.2% (median OS 18.0 months, enriched in exon 11/L576P) in the global phase
    II TEAM trial, 19% 12-week ORR in the phase II NICAM trial for KIT-mutated
    mucosal and acral melanoma, and disease control after prior imatinib progression
    (though intracranial efficacy is limited).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: nilotinib
      term:
        id: CHEBI:52172
        label: nilotinib
  target_mechanisms:
  - target: KIT Receptor Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Selectively inhibits mutant KIT tyrosine kinase activity across exon 11, 13,
      and subset exon 17 alterations.
  evidence:
  - reference: PMID:28327988
    reference_title: "Efficacy and safety of nilotinib in patients with KIT-mutated metastatic or inoperable melanoma: final results from the global, single-arm, phase II TEAM trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ORR was 26.2% (n = 11/42; 95% CI, 13.9%-42.0%), sufficient to reject the null hypothesis (ORR ≤10%). All observed responses were partial responses (PRs; median response duration, 7.1 months).
    explanation: >-
      Global phase II TEAM trial establishing 26.2% ORR and 7.1-month median
      response duration with nilotinib in TKI-naive KIT-mutated advanced melanoma.
  - reference: PMID:38417447
    reference_title: "Nilotinib in KIT-driven advanced melanoma: Results from the phase II single-arm NICAM trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIT mutations are identified in 39/219 screened patients (18%); of 29/39 treated, 26 are evaluable for primary analysis. Six patients were alive and progression free at 6 months (local radiology review, 25%); 5/26 (19%) had objective response at 12 weeks; median OS was 7.7 months; ddPCR assay correctly identifies KIT alterations in circulating tumor DNA (ctDNA) in 16/17 patients.
    explanation: >-
      Phase II NICAM trial demonstrating 19% 12-week ORR and 25% 6-month PFS with
      nilotinib in KIT-mutated mucosal and acral melanoma.
  - reference: PMID:34562816
    reference_title: "c-Kit inhibitors for unresectable or metastatic mucosal, acral or chronically sun-damaged melanoma: a systematic review and one-arm meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subgroup analysis revealed the highest ORR (20%; 95% CI: 14-26%) for nilotinib."
    explanation: Meta-analysis showing nilotinib achieved a 20% pooled objective response rate among KIT inhibitors.
- name: Dasatinib
  description: >-
    Multitarget kinase inhibitor with activity against KIT, ABL, and SRC family
    kinases. Phase II ECOG-ACRIN E2607 data showed modest, short-lived responses
    (18.2% PR in stage II KIT+ cohort; median PFS 2.1 months) and substantial
    toxicity, so imatinib remains preferred over dasatinib.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: dasatinib
      term:
        id: CHEBI:49375
        label: dasatinib (anhydrous)
  target_mechanisms:
  - target: KIT Receptor Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Inhibits active-conformation KIT and SRC-family tyrosine kinases.
  evidence:
  - reference: PMID:28334439
    reference_title: "A phase 2 trial of dasatinib in patients with locally advanced or stage IV mucosal, acral, or vulvovaginal melanoma: A trial of the ECOG-ACRIN Cancer Research Group (E2607)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is recommended that imatinib remain the KIT tyrosine kinase inhibitor of choice for unresectable KIT+ melanoma"
    explanation: Phase II trial showing low dasatinib response durability in KIT+ melanoma and recommending imatinib remain the preferred TKI.
- name: Ripretinib
  description: >-
    Broad-spectrum type II switch-control KIT/PDGFRA tyrosine kinase inhibitor
    evaluated in KIT-altered metastatic melanoma, achieving a 23% confirmed
    objective response rate (44% in exon 11) and 7.3-month median progression-free
    survival in phase I expansion testing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: ripretinib
      term:
        id: NCIT:C124067
        label: Ripretinib
  target_mechanisms:
  - target: KIT Receptor Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Switch-control kinase inhibition stabilizes KIT in an inactive conformation
      across exon 11 and select exon 17 activation-loop mutations.
  evidence:
  - reference: PMID:35753087
    reference_title: Efficacy and safety of ripretinib in patients with KIT-altered metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confirmed objective response rate (ORR) was 23%"
    explanation: Phase I expansion data supporting ripretinib objective responses in KIT-altered metastatic melanoma.
  - reference: PMID:35753087
    reference_title: Efficacy and safety of ripretinib in patients with KIT-altered metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median progression-free survival (mPFS) was 7.3 months (95% CI 1.9-13.6 months)."
    explanation: Phase I expansion data supporting a median PFS of 7.3 months with ripretinib in KIT-altered metastatic melanoma.
- name: Immune Checkpoint Inhibitors
  description: >-
    Anti-PD-1 (pembrolizumab, nivolumab) and anti-CTLA-4 (ipilimumab) monoclonal
    antibodies achieve objective responses (~35% with anti-PD-1 and ~20% with
    anti-CTLA-4 in retrospective KIT-mutant cohorts) independent of KIT exon
    mutation subtype, making checkpoint blockade crucial for TKI-resistant exon 17
    variants, post-TKI progression, and central nervous system metastases.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: Pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
    - preferred_term: Nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: ipilimumab
      term:
        id: CHEBI:231679
        label: ipilimumab
  evidence:
  - reference: PMID:41301010
    reference_title: "KIT-Mutant Melanoma: Understanding the Pathway to Personalized Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Twenty patients treated with anti-PD-1 therapy demonstrated a slightly higher ORR of 35%.
    explanation: >-
      Summarizes clinical response rate to anti-PD-1 checkpoint blockade in
      advanced KIT-mutant melanoma.
  - reference: PMID:41301010
    reference_title: "KIT-Mutant Melanoma: Understanding the Pathway to Personalized Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical response to at least one ICI was observed across KIT exon mutations 2, 11, 13, and 17, but there was no clear correlation between KIT mutation subtype and clinical benefit, suggesting that immune checkpoint inhibition may be independent of KIT exon mutation.
    explanation: >-
      Demonstrates that immune checkpoint inhibitor activity spans KIT exon 2, 11,
      13, and 17 mutations, including TKI-resistant exon 17 disease.
notes: >-
  KIT-mutant melanoma spans acral, mucosal, and chronically sun-damaged cutaneous
  melanomas rather than a single anatomic subtype. Broad molecular sequencing of
  KIT exons 9, 11, 13, and 17 (supplemented by plasma ddPCR ctDNA where tissue is
  limited) is required to distinguish TKI-sensitive activating mutations (such as
  exon 11 L576P and exon 13 K642E) from amplification-only or imatinib-resistant
  exon 17 variants.

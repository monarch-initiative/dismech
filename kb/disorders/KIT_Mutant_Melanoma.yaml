has_subtypes:
- name: Acral KIT-Mutant Melanoma
  description: >-
    Melanoma arising on glabrous acral surfaces (palms, soles, fingers, toes, and
    subungual nail units) harboring an activating KIT mutation (~11-36% of acral
    melanomas). UV radiation is not a significant driver, and lesions often
    present at an advanced stage.
  evidence:
  - reference: PMID:32644539
    reference_title: "Acral Lentiginous Melanoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acral lentiginous melanoma (ALM), also sometimes referred to as, simply, acral melanoma, is melanoma occurring on the hands and feet (palms, soles, fingers, toes, and nail units).
    explanation: >-
      Defines the anatomic distribution of acral melanoma on palmar, plantar,
      digital, and subungual surfaces.
  - reference: PMID:16908931
    reference_title: Somatic activation of KIT in distinct subtypes of melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations and/or copy number increases of KIT in 39% of mucosal, 36% of acral, and 28% of melanomas on chronically sun-damaged skin, but not in any (0%) melanomas on skin without chronic sun damage"
    explanation: >-
      Establishes enrichment of KIT mutations and copy-number gains in acral
      melanoma.
- name: Mucosal KIT-Mutant Melanoma
  description: >-
    Melanoma arising from mucosal membranes (oral, sinonasal, vulvovaginal, and
    anorectal surfaces) with an activating KIT alteration (~15-39% of mucosal
    melanomas). Characterized by low UV mutational burden, high chromosomal
    complexity, and poor 5-year survival.
  evidence:
  - reference: PMID:38417447
    reference_title: "Nilotinib in KIT-driven advanced melanoma: Results from the phase II single-arm NICAM trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mucosal (MM) and acral melanomas (AM) are rare melanoma subtypes of unmet clinical need; 15%-20% harbor KIT mutations potentially targeted by small-molecule inhibitors, but none yet approved in melanoma.
    explanation: >-
      Prospective NICAM trial confirming 15-20% KIT mutation prevalence in mucosal
      and acral melanomas.
- name: Chronically Sun-Damaged KIT-Mutant Melanoma
  description: >-
    Cutaneous melanoma arising on chronically sun-damaged skin (typically head,
    neck, and non-acral extremities) harboring KIT mutation or copy-number gain
    (reported in up to ~27-28% of CSD melanomas).
  evidence:
  - reference: PMID:16908931
    reference_title: Somatic activation of KIT in distinct subtypes of melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations and/or copy number increases of KIT in 39% of mucosal, 36% of acral, and 28% of melanomas on chronically sun-damaged skin, but not in any (0%) melanomas on skin without chronic sun damage"
    explanation: >-
      Curtin et al. identified KIT mutations or copy-number increases in 28% of
      melanomas on chronically sun-damaged skin.
pathophysiology:
- name: KIT Receptor Tyrosine Kinase Activation
  biological_scale: MOLECULAR
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  description: >-
    Somatic KIT mutations, most commonly clustering in exon 11 (juxtamembrane
    autoinhibitory domain, e.g., L576P), exon 13 (kinase domain I, e.g., K642E),
    and exon 17 (activation loop, e.g., D820Y), induce ligand-independent receptor
    dimerization, loss of autoinhibition, and constitutive KIT phosphorylation
    independent of stem cell factor (SCF) binding.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exons 9, 11, 13 and 17 were evaluated by PCR amplification, followed by Capillary Electrophoresis Single-Strand Conformation Analysis (CE-SSCA) and direct Sanger sequencing for identification of the exact mutation.
    explanation: >-
      Prospective NICAM trial molecular diagnostic workflow covering KIT exons 9,
      11, 13, and 17 to identify actionable KIT mutations.
- name: Plasma Circulating Tumor DNA (ctDNA) Droplet Digital PCR KIT Assay
  markers: Plasma ctDNA KIT variant allele fraction
  description: >-
    Tumor-informed droplet digital PCR analysis of plasma circulating tumor DNA
    accurately detects somatic KIT mutations with 100% concordance against matched
    FFPE tumor tissue in evaluable metastatic acral and mucosal melanoma patients.
  diagnosis_term:
    preferred_term: Droplet Digital PCR
    term:
      id: NCIT:C166064
      label: Droplet Digital PCR
  evidence:
  - reference: PMID:38417447
    reference_title: "Nilotinib in KIT-driven advanced melanoma: Results from the phase II single-arm NICAM trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The concordance of mutations detected in ctDNA and FFPE tumor was 100%.
    explanation: >-
      Demonstrates 100% concordance between plasma ddPCR ctDNA and matched FFPE
      tumor KIT mutation calls in the NICAM trial.
  - reference: PMID:38417447
    reference_title: "Nilotinib in KIT-driven advanced melanoma: Results from the phase II single-arm NICAM trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ddPCR-based KIT analysis appears feasible and accurate for KIT testing in patients with metastatic MM and AM and could be proposed for liquid biopsies testing.
    explanation: >-
      Supports plasma ddPCR liquid biopsy testing for KIT alterations in metastatic
      mucosal and acral melanoma.
- name: KIT Copy-Number Fluorescence In Situ Hybridization (FISH)
  markers: 4q12 KIT copy number
  description: >-
    FISH or copy-number profiling assesses 4q12 KIT gene amplification and
    intratumoral copy-number heterogeneity; however, KIT amplification without an
    activating mutation does not predict clinical response to imatinib.
  diagnosis_term:
    preferred_term: Fluorescence In Situ Hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  evidence:
  - reference: PMID:23775962
    reference_title: "Imatinib for melanomas harboring mutationally activated or amplified KIT arising on mucosal, acral, and chronically sun-damaged skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BORR was significantly greater than the hypothesized null of 5% and statistically significantly different by mutation status (7 of 13 or 54% KIT mutated v 0% KIT amplified only)."
    explanation: >-
      Demonstrates that distinguishing activating KIT mutation from amplification
      alone is essential for predicting TKI benefit.
genetic:
- name: KIT Exon 11 Mutations (L576P and Juxtamembrane Variants)
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Most common somatic KIT driver class (~50-69% of KIT-mutant melanomas; L576P ~30%)
  notes: >-
    Mutations in the juxtamembrane domain encoded by exon 11 (L576P, V559A, D579H,
    W557/K558 deletions) disrupt autoinhibitory function, leading to constitutive
    receptor activation and conferring the highest sensitivity to imatinib,
    nilotinib, and ripretinib.
  evidence:
  - reference: PMID:41301010
    reference_title: "KIT-Mutant Melanoma: Understanding the Pathway to Personalized Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Exon 11 is the most frequently affected, accounting for approximately 50–60% of cases, and includes the L576P mutation, which alone represents about 30% of all reported KIT mutations.
    explanation: >-
      Quantifies exon 11 and L576P prevalence within the KIT-mutant melanoma
      mutational spectrum.
  - reference: PMID:21642685
    reference_title: KIT as a therapeutic target in metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all 6 responses occurred in tumors with L576P or K642E mutations, the most common mutations in melanoma"
    explanation: Carvajal et al. showed that responses to imatinib occurred in tumors with L576P (exon 11) and K642E (exon 13) mutations.
- name: KIT Exon 13 Mutations (K642E)
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Recurrent kinase domain I somatic driver (~10-15% of KIT-mutant melanomas)
  notes: >-
    Point mutations in kinase domain I affecting the ATP-binding pocket; K642E is
    the predominant exon 13 hotspot and confers clinical sensitivity to imatinib
    (pooled ORR ~42%).
  evidence:
  - reference: PMID:19035443
    reference_title: Pathological activation of KIT in metastatic tumors of acral and mucosal melanomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis revealed K642E and D820Y mutations in two metastases."
    explanation: Confirms K642E as a recurrent KIT mutation found in acral and mucosal melanoma metastases.
  - reference: PMID:35999272
    reference_title: "Clinical and genomic correlates of imatinib response in melanomas with KIT alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the pooled analysis (N = 130), alterations in exons 11/13 had the highest response rates (38% and 33%); L576P (N = 23) and K642E (N = 12) mutations had ORR of 52% and 42%, respectively.
    explanation: >-
      130-patient pooled analysis quantifying imatinib response rates in exon 11
      (L576P, 52% ORR) and exon 13 (K642E, 42% ORR) KIT-mutant melanoma.
- name: KIT Exon 17 Mutations (D820Y and Activation-Loop Variants)
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activation-loop somatic driver (~5-14% of KIT-mutant melanomas)
  notes: >-
    Mutations in the kinase activation loop (e.g., D820Y, D820V, Y823D, D816V)
    are associated with reduced imatinib progression-free survival (particularly
    D816V resistance), though select variants respond to nilotinib, ripretinib, or
    immune checkpoint blockade.
  evidence:
  - reference: PMID:19035443
    reference_title: Pathological activation of KIT in metastatic tumors of acral and mucosal melanomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis revealed K642E and D820Y mutations in two metastases."
    explanation: Identifies D820Y (exon 17) as a somatic KIT mutation in metastatic melanoma.
  - reference: PMID:41301010
    reference_title: "KIT-Mutant Melanoma: Understanding the Pathway to Personalized Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations that occur in exon 17 include the D820Y mutation and others that comprise roughly 5–10% of the mutational burden.
    explanation: >-
      Quantifies the exon 17 mutational share including D820Y in KIT-mutant
      melanoma.
- name: KIT 4q12 Amplification
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Somatic copy-number gain at 4q12 with or without concurrent point mutation
  notes: >-
    Gene amplification without activating point mutation occurs in a subset of
    acral and mucosal melanomas; clinical response to imatinib is absent or minimal

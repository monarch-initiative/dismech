inheritance:
- name: Autosomal Dominant
  description: >-
    Darier disease is inherited in an autosomal dominant manner with high
    penetrance but marked variability in expression, including within families.
    A substantial proportion of pathogenic ATP2A2 variants are predicted to be
    null alleles, consistent with haploinsufficiency rather than a
    dominant-negative mechanism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26945535
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Darier disease (DD) is a type of inherited keratinizing disorder that exhibits autosomal dominant inheritance.
    explanation: >-
      States the mode of inheritance.
  - reference: PMID:10080178
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen mutations were identified, including frameshift deletions, in-frame deletions or insertions, splice-site mutations and non-conservative missense mutations in functional domains.
    explanation: >-
      The predominance of frameshift and splice-site alleles among the
      disease-causing variants supports haploinsufficiency as the mechanism
      behind the dominant inheritance.
pathophysiology:
- name: ATP2A2 Haploinsufficiency and Loss of SERCA2 Pump Activity
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function variant in ATP2A2 halves the functional dose
    of SERCA2, the ATP-driven pump that moves cytosolic calcium into the
    sarco/endoplasmic reticulum. The gene is highly expressed in keratinocytes,
    and the resulting reduction in pump capacity is the proximal lesion of the
    disease.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: P-type calcium transporter activity
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
    modifier: DECREASED
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Disturbed Endoplasmic Reticulum Calcium Signalling in Keratinocytes
    description: >-
      Reduced pump capacity leaves the ER calcium store unable to support normal
      keratinocyte calcium signalling.
  evidence:
  - reference: PMID:10080178
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified mutations in the ATP2A2 gene, which encodes the sarco/endoplasmic reticulum Ca2(+)-ATPase type 2 isoform (SERCA2) and is highly expressed in keratinocytes
    explanation: >-
      Identifies ATP2A2/SERCA2 as the disease gene and establishes its high
      expression in the affected cell type.
- name: Disturbed Endoplasmic Reticulum Calcium Signalling in Keratinocytes
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  biological_scale: CELLULAR
  description: >-
    Loss of SERCA2 capacity disturbs the intracellular calcium signalling that
    keratinocyte adhesion and differentiation depend on. Because desmosomal
    proteins require calcium-dependent post-translational processing and
    trafficking through the ER and Golgi, the downstream failure is one of
    desmosome assembly rather than of any desmosomal protein itself - which is
    why Darier disease is a desmosomal disease with no primary desmosomal gene
    defect.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  - preferred_term: desmosome organization
    term:
      id: GO:0002934
      label: desmosome organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  downstream:
  - target: Suprabasal Acantholysis and Dyskeratosis
    description: >-
      Failed desmosome assembly leaves suprabasal keratinocytes unable to hold
      to one another.
  evidence:
  - reference: PMID:10080178
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrate that mutations in ATP2A2 cause DD and disclose a role for this pump in a Ca(2+)-signalling pathway regulating cell-to-cell adhesion and differentiation of the epidermis.
    explanation: >-
      Places the calcium-signalling defect between the ATP2A2 lesion and the
      adhesion/differentiation failure, which is the claim of this node.
  - reference: PMID:28329545
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Theresultant alterations in calcium homeostasis affectdesmosome assembly and lead to acantholysis andapoptosis, which creates the characteristic eruption.
    explanation: >-
      States the calcium-to-desmosome-assembly step explicitly. The quoted text
      reproduces the cached record's missing inter-word spaces verbatim.
- name: Suprabasal Acantholysis and Dyskeratosis
  conforms_to: "desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues"
  biological_scale: TISSUE
  description: >-
    Suprabasal keratinocytes separate from one another (acantholysis) while
    individual cells undergo premature and abnormal keratinization
    (dyskeratosis), producing the two diagnostic histological bodies: corps
    ronds in the granular layer and grains in the stratum corneum. The
    combination of acantholysis with dyskeratosis is what distinguishes Darier
    disease histologically from the purely acantholytic Hailey-Hailey disease
    and from pemphigus.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte

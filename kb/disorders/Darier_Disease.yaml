name: Darier Disease
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Darier disease (Darier-White disease, keratosis follicularis) is a rare
  autosomal dominant genodermatosis caused by heterozygous loss-of-function
  variants in ATP2A2, which encodes SERCA2, the sarco/endoplasmic reticulum
  calcium ATPase that pumps cytosolic calcium into the ER. SERCA2
  haploinsufficiency disturbs the ER calcium store that keratinocytes depend on
  for the post-translational processing and trafficking of desmosomal proteins,
  so desmosome assembly fails and suprabasal keratinocytes lose adhesion. The
  characteristic histology follows directly: suprabasal acantholysis together
  with dyskeratosis, seen as corps ronds and grains. Clinically it presents
  around puberty with greasy, crusted keratotic papules in seborrheic
  distribution, distinctive nail changes, and palmoplantar pits, following a
  relapsing-remitting course aggravated by heat, sweating, friction and UV.
  ATP2A2 is also highly expressed in brain, and a range of neuropsychiatric
  features - mood disorder, depression, epilepsy and cognitive impairment -
  co-occurs with the skin disease.
category: Genetic
parents:
- Genodermatosis

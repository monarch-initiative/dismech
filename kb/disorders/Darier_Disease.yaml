experimental_models:
- name: Patient-derived human epidermal organoid
  experimental_model_type: ORGANOID
  description: >-
    A three-dimensional human epidermal organoid grown from keratinocytes of
    patients with Darier disease. It was developed because the disease had no
    suitable model - notably, ATP2A2 knockout mice do not reproduce the human
    phenotype, developing skin tumours instead of the Darier rash - so the
    organoid is the first system in which the human epidermal lesion can be
    studied directly.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  cell_source: Keratinocytes from patients with Darier disease.
  publication: PMID:41466489
  modeled_mechanisms:
  - target: Suprabasal Acantholysis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The organoid reproduces the acantholytic lesion together with the
      desmosomal dysfunction and desmosomal protein mislocalisation that
      underlie it, which is the mechanism this node asserts.
    limitations: >-
      An in vitro epidermal system with no dermis, adnexal structures, immune
      compartment or vasculature, so it cannot model the seborrheic
      distribution, the secondary infection that drives clinical flares, or any
      of the extracutaneous disease. Fidelity is recorded as MODERATE on that
      basis rather than HIGH.
    readouts:
    - name: Acantholysis and desmosomal protein localisation
      target: Suprabasal Acantholysis
      direction: ALTERED
      interpretation: >-
        Loss of keratinocyte adhesion with mislocalised desmosomal proteins,
        the structural correlate of the acantholysis node.
      evidence:
      - reference: PMID:41466489
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The model recapitulates key aspects of DD pathology, including acantholysis, desmosomal dysfunction and barrier disruption, with mislocalisation of desmosomal proteins.
        explanation: >-
          Reports the measured phenotype of the organoid, naming acantholysis
          and desmosomal protein mislocalisation.
    evidence:
    - reference: PMID:41466489
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our work demonstrates that epidermal organoids derived from patients with Darier disease are a valuable model for studying DD.
      explanation: >-
        Supports treating this organoid as informative for Darier disease
        mechanism, which is the claim the link itself makes.
  evidence:
  - reference: PMID:41466489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we developed a human epidermal organoid model derived from DD patient keratinocytes to investigate the molecular and phenotypic features of the disease.
    explanation: >-
      Establishes the model system, its human patient-derived origin, and its
      purpose.
  notes: >-
    The same source reports transcriptomic perturbation of epidermal
    development, cell adhesion, cell migration and keratinocyte differentiation
    pathways. Those are consistent with the two pathophysiology nodes this entry
    curates downstream of the calcium lesion, but they are not curated as
    separate readouts because the entry does not model transcriptional
    programmes as nodes.

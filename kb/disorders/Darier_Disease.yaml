- name: Dantrolene (investigational, in vitro only)
  description: >-
    Dantrolene is an approved ryanodine receptor antagonist that raises ER
    calcium by blocking its release, and so acts directly on the axis this
    entry models. In Darier patient-derived in vitro systems it improved
    calcium retention, cell adhesion, ER stress and apoptosis. It is recorded
    here as a mechanism-linked investigational lead and NOT as a treatment:
    the evidence is in vitro only and the authors state they could find no case
    reports of its use in Darier patients. Do not curate this as effective
    therapy or infer a clinical recommendation from it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

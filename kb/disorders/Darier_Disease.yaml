      keratotic papules.
  evidence:
  - reference: PMID:10080178
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Darier disease (DD) is an autosomal-dominant skin disorder characterized by loss of adhesion between epidermal cells (acantholysis) and abnormal keratinization.
    explanation: >-
      States the paired acantholysis-plus-abnormal-keratinization lesion that
      defines this node.
  - reference: PMID:26945535
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, DD is characterized by corps ronds and grains in addition to suprabasal cleavage.
    explanation: >-
      Documents the diagnostic histological findings - the dyskeratotic bodies
      alongside the suprabasal acantholytic cleft.
- name: Keratotic Papule Formation in Seborrheic Distribution
  biological_scale: ORGANISM
  description: >-
    The clinical eruption: greasy, crusted, yellow-brown keratotic papules that
    coalesce into plaques, concentrated in seborrheic areas - face, scalp
    margins, chest and back - together with characteristic nail changes and
    palmoplantar pits. The course is relapsing and remitting, with heat,
    sweating, friction and ultraviolet exposure recognized as aggravating
    factors, and secondary bacterial and viral infection is a frequent
    complication.
  biological_processes:
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: ABNORMAL
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:26945535
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DD often develops in childhood, persists through adolescence, and causes small papules predominantly in seborrheic areas such as the face, chest and back.
    explanation: >-
      Documents the distribution and natural history of the eruption.
  - reference: PMID:34194784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperkeratotic papules, predominantly distributed in seborrheic areas, distinctive nail abnormalities, and palmar and plantar pits are the typical clinical manifestations.
    explanation: >-
      Documents the full clinical triad, including the nail changes and
      palmoplantar pits that are diagnostically distinctive.
- name: Neuropsychiatric Involvement from Brain SERCA2 Deficiency
  biological_scale: ORGANISM
  description: >-
    ATP2A2 is expressed in brain as well as skin, and a range of
    neuropsychiatric features co-occurs with the cutaneous disease, including
    mood disorder, depression, epilepsy and cognitive impairment. This is a
    genuinely extracutaneous arm of the disease rather than a reaction to
    disfigurement, and it is the reason a dermatological diagnosis of Darier
    disease carries a psychiatric obligation.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:34194784
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Darier disease (DD) is a rare genodermatosis caused by heterozygous mutations in the ATP2A2 gene highly expressed both in the skin and in the brain.
    explanation: >-
      Establishes the shared expression that underlies the extracutaneous arm.
  - reference: PMID:10441325
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A number of clinical studies have described the co-occurrence of various neurological and psychiatric symptoms with DD, including mood disorders, epilepsy, mental retardation and a slowly progressive encephalopathy.
    explanation: >-
      Documents the range of neuropsychiatric features reported with Darier
      disease.
  notes: >-
    The strength of the causal claim differs by feature. Co-occurrence is
    well documented, and shared ATP2A2 expression in brain is an established
    fact, but the entry deliberately stops short of asserting that SERCA2
    deficiency is the proven mechanism for each individual psychiatric
    diagnosis. The bipolar association in particular rests substantially on
    linkage co-segregation rather than on a demonstrated molecular route.

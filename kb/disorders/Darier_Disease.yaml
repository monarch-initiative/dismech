  notes: >-
    ATP2A2 encodes SERCA2, the sarco/endoplasmic reticulum calcium ATPase
    isoform 2. Pathogenic variants span frameshift deletions, in-frame
    deletions and insertions, splice-site changes and non-conservative missense
    substitutions in functional domains, a spectrum consistent with
    haploinsufficiency.

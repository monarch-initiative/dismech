notes: >-
  Darier disease and Hailey-Hailey disease are the paired calcium-pump
  genodermatoses and are best read together: both reach acantholysis through
  loss of a keratinocyte calcium pump rather than through a primary desmosomal
  protein defect, and both conform to `desmosomal_adhesion_failure` by that
  calcium route. They are distinguished by the pump compartment (ER SERCA2 here,
  Golgi SPCA1 in Hailey-Hailey), by distribution (seborrheic versus flexural),
  and histologically by the prominent dyskeratosis - corps ronds and grains -
  which is present here and largely absent in Hailey-Hailey.

  Direct immunofluorescence is negative, which separates Darier disease from
  pemphigus, the other major acantholytic differential.

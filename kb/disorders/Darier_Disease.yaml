- name: Dyskeratosis with Corps Ronds and Grains
  biological_scale: TISSUE
  description: >-
    Individual keratinocytes undergo premature and abnormal keratinization,
    producing the two diagnostic dyskeratotic bodies: corps ronds in the
    granular layer and grains in the stratum corneum. This is the
    differentiation half of the Darier histology, and it is what distinguishes
    the entry histologically from the purely acantholytic Hailey-Hailey disease
    and from pemphigus - both of which reach acantholysis without this degree
    of dyskeratosis.

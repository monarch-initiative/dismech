discussions:
- discussion_id: gap_ip_genotype_phenotype
  prompt: >-
    Why is the phenotypic expressivity of IP so highly variable — from
    skin-limited disease to severe ocular and CNS involvement — when most
    patients carry the same recurrent exon 4-10 IKBKG deletion, and what
    determines which organs are affected in a given individual?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#IKBKG (NEMO) Loss of Function
  - pathophysiology#Cerebral Vaso-Occlusive and Neuronal Injury
  rationale: >-
    Because the predominant lesion is a single recurrent null deletion, allele
    identity alone cannot explain why some individuals have skin-limited disease
    while others develop sight- or life-threatening ocular and neurologic
    involvement. The degree and tissue distribution of X-inactivation skewing is
    a leading candidate modifier, but the genotype-phenotype relationship
    remains unresolved and limits prognostic counseling.
  evidence:
  - reference: PMID:36147820
    reference_title: "Uncovering incontinentia pigmenti: From DNA sequence to pathophysiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the clinical genotype-phenotype correlation remains unclear due to its highly variable phenotypic expressivity."
    explanation: Directly states that the genotype-phenotype correlation is unresolved, defining the gap.
- discussion_id: interp_ip_bystander_nfkb_paradox
  prompt: >-
    How can IP — a disease of NF-kB LOSS — present with a florid, NF-kB-driven
    eosinophilic inflammation in its first stage?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Bystander NF-kB-Competent Eotaxin Secretion and Eosinophil Recruitment
  - pathophysiology#Stage I Vesiculobullous Eruption
  rationale: >-
    The apparent paradox is resolved by mosaicism: the eosinophil-recruiting
    chemokine eotaxin is NF-kB-activated and is secreted not by the NEMO-null
    cells but by the surviving NEMO-competent bystander cells that retain the
    wild-type X as the active allele. The inflammation of IP is therefore
    produced by the very NF-kB signaling the mutant cells have lost, generated
    by their normal neighbors — an interpretation important for reading the
    stage-I histology and for not mistaking IP for a primary inflammatory or
    infectious dermatosis.
  evidence:
  - reference: PMID:11966763
    reference_title: "Expression of eotaxin, an eosinophil-selective chemokine, parallels eosinophil accumulation in the vesiculobullous stage of incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are probably produced by the adjacent IKKγ+cells"
    explanation: States directly that the NF-kB-activated chemokines are produced by the adjacent IKKγ+ (NEMO-competent) bystander cells — the literal basis of the mosaic-bystander resolution of the NF-kB-loss paradox.

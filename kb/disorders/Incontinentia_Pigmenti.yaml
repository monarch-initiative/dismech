histopathology:
- name: Eosinophilic spongiosis with dyskeratotic keratinocytes
  description: >-
    The vesiculobullous stage shows acanthosis, keratinocyte necrosis,
    epidermal spongiosis, and massive intraepidermal eosinophil infiltration
    (eosinophilic spongiosis). Later stages show dermal melanophages with pigment
    incontinence (stage III), the feature that names the disease.
  evidence:
  - reference: PMID:11966763
    reference_title: "Expression of eotaxin, an eosinophil-selective chemokine, parallels eosinophil accumulation in the vesiculobullous stage of incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histopathologically by acanthosis, keratinocyte necrosis, epidermal spongiosis and massive epidermal eosinophil infiltration."
    explanation: Documents the eosinophilic spongiosis and keratinocyte necrosis of stage-I IP skin.
  - reference: PMID:2003648
    reference_title: "Hypo- and hyperpigmented areas in incontinentia pigmenti. Light and electron microscopic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in hyperpigmented areas we found a reduction of pigment in those parts of the basal layer overlying melanophages located in the upper dermis."
    explanation: Documents the stage-III dermal melanophage pigment incontinence on light/EM microscopy.
diagnosis:
- name: Clinical Diagnosis and IKBKG Molecular Testing
  description: >-
    Diagnosis is established by a characteristic skin lesion (major criterion),
    supported by identification of a heterozygous IKBKG pathogenic variant in a
    female (or hemizygous in a male). Molecular testing targets the recurrent
    exon 4-10 deletion first (long-range PCR / MLPA) followed by sequencing. A
    truncated IKBKG pseudogene copy (IKBKGP/deltaNEMO) at the same locus
    complicates sequence analysis and necessitates deletion-specific assays.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: MAXO:0000127
      label: genetic testing
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of IP is established in a proband with at least one major criterion (characteristic skin lesion). Identification of a heterozygous IKBKG pathogenic variant in a female proband or a hemizygous IKBKG pathogenic variant in a male proband confirms the diagnosis if clinical features are inconclusive."
    explanation: States the clinical major criterion plus IKBKG molecular confirmation.
  - reference: PMID:19603533
    reference_title: "Microdeletion/duplication at the Xq28 IP locus causes a de novo IKBKG/NEMO/IKKgamma exon4_10 deletion in families with Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its truncated pseudogene copy, IKBKGP/deltaNEMO"
    explanation: The IKBKG pseudogene at the IP locus complicates molecular diagnosis and requires deletion-specific testing.
treatments:
- name: Retinal Laser Photocoagulation
  description: >-
    Ablative laser photocoagulation (and cryotherapy) of peripheral avascular
    retina and retinal neovascularization is the mainstay sight-preserving
    intervention, reducing the risk of tractional retinal detachment. Anti-VEGF
    injection is a second-line adjunct without formal consensus.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laser ablation therapy
    term:
      id: MAXO:0000453
      label: laser ablation therapy
  target_phenotypes:
  - preferred_term: Peripheral retinal neovascularization
    term:
      id: HP:0030667
      label: Peripheral retinal neovascularization
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "cryotherapy and laser photocoagulation of retinal neovascularization to reduce risk of retinal detachment"
    explanation: Laser photocoagulation/cryotherapy of retinal neovascularization is the standard sight-preserving treatment.
- name: Ophthalmologic Surveillance
  description: >-
    Because retinopathy can progress rapidly in infancy, frequent eye
    examinations are recommended — monthly to age four months, then every three
    months to age one year, every six months to age three years, and annually
    thereafter.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: eye examination
    term:
      id: MAXO:0001155
      label: eye examination
  evidence:

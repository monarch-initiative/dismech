inheritance:
- name: X-linked dominant inheritance
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    IP is inherited in an X-linked dominant manner and is usually lethal in
    hemizygous males carrying a null allele. About 65% of affected individuals
    have a de novo variant. Because male conceptuses with an IKBKG
    loss-of-function variant miscarry, the expected live-birth ratio for
    offspring of an affected mother is approximately one-third unaffected
    females, one-third affected females, and one-third unaffected males.
    Surviving affected males have a 47,XXY karyotype or somatic mosaicism.
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "male conceptuses with an IKBKG loss-of-function variant miscarry."
    explanation: Documents the X-linked, male-lethal inheritance of IP.
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "About 65% of affected individuals have IP as a result of a de novo pathogenic variant."
    explanation: Quantifies the de novo rate (~65%).
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "approximately 33% unaffected females, 33% affected females, and 33% unaffected males."
    explanation: The 33/33/33 live-birth ratio is the direct transmission consequence of male lethality.
genetic:
- name: IKBKG
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: IKBKG
    term:
      id: hgnc:5961
      label: IKBKG
  notes: >-
    IP is caused by loss-of-function variants in IKBKG (NEMO). The major
    genetic defect (~65-80% of unrelated probands) is a recurrent heterozygous
    deletion of exons 4-10 (IKBKGdel), a complete-loss-of-function allele
    generated by recombination at the structurally unstable Xq28 locus; the
    remainder carry small indels, nonsense, or splice-site variants. The exon
    4-10 deletion recurs independently in unrelated families (a recurrent
    rearrangement, not a single ancestral founder allele). IKBKG is allelic with
    a distinct disorder: hypomorphic (partial-function) IKBKG variants in
    hemizygous males cause ectodermal dysplasia with immunodeficiency (EDA-ID; see
    the IKBKG_Ectodermal_Dysplasia_with_Immunodeficiency entry), whereas the
    null alleles here cause male-lethal incontinentia pigmenti in heterozygous
    females.
  evidence:
  - reference: PMID:19603533
    reference_title: "Microdeletion/duplication at the Xq28 IP locus causes a de novo IKBKG/NEMO/IKKgamma exon4_10 deletion in families with Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major genetic defect in IP is a heterozygous exon4_10 IKBKG deletion (IKBKGdel)"
    explanation: Establishes the recurrent exon 4-10 IKBKG deletion as the major genetic defect in IP.
pathophysiology:
- name: IKBKG (NEMO) Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function variants in IKBKG abolish or cripple NEMO/IKK-gamma, the
    regulatory subunit of the IKK complex. The predominant lesion is the
    recurrent exon 4-10 deletion, a complete null allele; other point and
    splice variants also occur. Without functional NEMO the IKK complex cannot
    be activated.
  genes:
  - preferred_term: IKBKG
    term:
      id: hgnc:5961
      label: IKBKG
  evidence:
  - reference: PMID:36147820
    reference_title: "Uncovering incontinentia pigmenti: From DNA sequence to pathophysiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the Inhibitor Of Nuclear Factor Kappa B Kinase Regulatory Subunit Gamma (IKBKG) gene located at the Xq28 chromosomal region, which encodes for NEMO/IKKgamma, a regulatory protein involved in the nuclear factor kappa B (NF-κB) signaling pathway."
    explanation: Identifies IKBKG/NEMO as the regulatory subunit of the NF-kB pathway disrupted in IP.
  downstream:
  - target: Impaired Canonical NF-kB Activation
    description: Loss of NEMO prevents assembly/activation of the IKK complex that drives canonical NF-kB signaling.
    causal_link_type: DIRECT
- name: Impaired Canonical NF-kB Activation
  biological_scale: MOLECULAR
  description: >-
    NEMO is required for IKK-mediated activation of canonical NF-kB signaling;
    its loss prevents NF-kB (RelA/p65) nuclear translocation and transcription
    of NF-kB target genes, including the anti-apoptotic and inflammatory
    program. A dysregulated NF-kB pathway is the proximate molecular basis of
    IP.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:36147820
    reference_title: "Uncovering incontinentia pigmenti: From DNA sequence to pathophysiology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IKBKG mutation that results in a loss-of-function or dysregulated NF-κB pathway contributes to the pathophysiology of IP."
    explanation: Links loss of NEMO to a dysregulated NF-kB pathway as the basis of IP pathophysiology.
  downstream:
  - target: Heightened Susceptibility to TNF-Induced Apoptosis
    description: Loss of NF-kB-dependent anti-apoptotic gene induction sensitizes NEMO-null cells to TNF-induced death.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36147820
      reference_title: "Uncovering incontinentia pigmenti: From DNA sequence to pathophysiology."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "NF-κB plays a prominent role in the modulation of cellular proliferation, apoptosis, and inflammation."
      explanation: NF-kB controls the anti-apoptotic program whose loss sensitizes cells to apoptosis.
- name: Heightened Susceptibility to TNF-Induced Apoptosis
  biological_scale: CELLULAR
  description: >-
    Because NF-kB normally induces anti-apoptotic genes, NEMO-deficient cells
    (keratinocytes, vascular endothelium, neurons) lose this cytoprotection and
    become hypersensitive to TNF-induced apoptosis and necrosis — a stimulus
    that is pro-survival in normal cells becomes lethal. This apoptotic
    vulnerability is the shared cellular mechanism behind the skin, ocular, and
    CNS lesions and behind the selective elimination of mutant-X cells.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:11966763
    reference_title: "Expression of eotaxin, an eosinophil-selective chemokine, parallels eosinophil accumulation in the vesiculobullous stage of incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histopathologically by acanthosis, keratinocyte necrosis, epidermal spongiosis and massive epidermal eosinophil infiltration."
    explanation: Documents keratinocyte necrosis/death in lesional IP skin, reflecting the apoptotic susceptibility of NEMO-null cells.
  - reference: PMID:16399796
    reference_title: "Skin lesion development in a mouse model of incontinentia pigmenti is triggered by NEMO deficiency in epidermal keratinocytes and requires TNF signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NEMO deletion completely inhibited NF-kappaB activation and sensitized keratinocytes to tumor necrosis factor (TNF)-induced death but did not affect epidermal development."
    explanation: Direct in vivo evidence that NEMO loss sensitizes keratinocytes specifically to TNF-induced death (the epidermis-specific NEMO-knockout mouse).
  downstream:
  - target: Male Lethality of Null Alleles
    description: Apoptotic elimination of mutant-X cells kills hemizygous null male conceptuses while permitting mosaic female survival.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Bystander NF-kB-Competent Eotaxin Secretion and Eosinophil Recruitment
    description: Inflammatory signals (TNF, DAMPs) released by dying NEMO-null keratinocytes activate NF-kB in surviving competent neighbors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Stage I Vesiculobullous Eruption
    description: Keratinocyte apoptosis/necrosis initiates the first cutaneous stage.
    causal_link_type: DIRECT
  - target: Retinal Vascular Dysgenesis and Neovascularization
    description: Retinal endothelial apoptosis causes peripheral non-perfusion and secondary neovascularization.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cerebral Vaso-Occlusive and Neuronal Injury
    description: Cerebral small-vessel vaso-occlusion and neuronal injury produce the CNS manifestations.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Male Lethality of Null Alleles
  biological_scale: ORGANISM
  description: >-
    Selective apoptotic elimination of cells expressing the mutant IKBKG allele
    has divergent organism-level outcomes by sex. In affected females the
    surviving cells preferentially express the wild-type X, producing the mosaic
    Blaschko-linear distribution and permitting survival. Hemizygous male
    conceptuses carrying a null allele have no wild-type cells to select for and
    miscarry; the rare surviving affected males have a 47,XXY karyotype or
    somatic mosaicism.
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "male conceptuses with an IKBKG loss-of-function variant miscarry."
    explanation: Documents the male lethality of IKBKG null alleles, the organism-level consequence of selective elimination of mutant-X cells.
  - reference: PMID:10911992
    reference_title: "NEMO/IKK gamma-deficient mice model incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Disruption of the X-linked gene encoding NF-kappa B essential modulator (NEMO) produces male embryonic lethality, completely blocks NF-kappa B activation by proinflammatory cytokines"
    explanation: The NEMO-knockout mouse recapitulates the male embryonic lethality of IP, direct in vivo support for this node.
  - reference: PMID:10911992
    reference_title: "NEMO/IKK gamma-deficient mice model incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Surviving mice recover almost completely, presumably through clearing the skin of NEMO-deficient keratinocytes."
    explanation: Confirms the selective-elimination mechanism — recovery occurs by clearing NEMO-deficient cells, the basis of mosaic survival.
- name: Bystander NF-kB-Competent Eotaxin Secretion and Eosinophil Recruitment
  biological_scale: CELLULAR
  description: >-
    In the mosaic epidermis the surviving NEMO-competent cells (those with the
    wild-type X active) respond to inflammatory stimuli by activating NF-kB and
    secreting the eosinophil-selective, NF-kB-activated chemokine eotaxin. This
    drives the massive epidermal eosinophil infiltration and peripheral
    eosinophilia that characterize the first (vesiculobullous) stage — the
    florid inflammation of IP thus arises from the NF-kB that the mutant cells
    have lost, produced instead by their normal neighbors.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  evidence:
  - reference: PMID:11966763
    reference_title: "Expression of eotaxin, an eosinophil-selective chemokine, parallels eosinophil accumulation in the vesiculobullous stage of incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoclonal antibody (6H9) specific for human eotaxin strongly labelled the suprabasal epidermis of IP skin, paralleling the upper epidermal accumulation of eosinophils"
    explanation: Human tissue finding — epidermal eotaxin expression co-localizes with the epidermal eosinophil accumulation in IP skin.
  - reference: PMID:11966763
    reference_title: "Expression of eotaxin, an eosinophil-selective chemokine, parallels eosinophil accumulation in the vesiculobullous stage of incontinentia pigmenti."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In normal human keratinocytes, proinflammatory cytokines either independently (IL-1alpha) or synergistically (tumour necrosis factor-alpha (TNF-alpha)/ interferon-gamma (IFN-gamma) and TNF-alpha/IL-4) up-regulated eotaxin expression."
    explanation: Cultured-keratinocyte finding that TNF/IL-1/IFN-gamma induce eotaxin, the mechanism by which NF-kB-competent bystander cells produce it.
  downstream:
  - target: Heightened Susceptibility to TNF-Induced Apoptosis
    description: Bystander-secreted TNF feeds back to selectively kill the adjacent NEMO-deficient cells, making the disease self-amplifying.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Stage I Vesiculobullous Eruption
    description: Eosinophil recruitment produces the eosinophilic spongiosis of the vesiculobullous stage.
    causal_link_type: DIRECT
- name: Stage I Vesiculobullous Eruption
  biological_scale: TISSUE
  description: >-
    Keratinocyte apoptosis/necrosis with eosinophilic spongiosis produces the
    first Blaschko-linear cutaneous stage: an inflammatory vesiculobullous
    eruption from birth to about age four months.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristic skin lesions evolve through four stages: I.. Blistering (birth to age ~4 months)."
    explanation: The vesiculobullous blistering eruption is the first cutaneous stage.
  downstream:
  - target: Stage II Verrucous Hyperkeratosis
    description: The vesiculobullous lesions evolve into wart-like hyperkeratotic plaques.
    causal_link_type: DIRECT
- name: Stage II Verrucous Hyperkeratosis
  biological_scale: TISSUE
  description: >-
    The second stage is a linear, warty, hyperkeratotic (verrucous) eruption
    with acanthosis and papillomatosis, evolving over several months.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "II.. Wart-like rash (for several months)."
    explanation: The verrucous (wart-like) plaques constitute the second cutaneous stage.
  downstream:
  - target: Stage III Dermal Melanophage Pigment Incontinence
    description: The verrucous lesions give way to the swirled hyperpigmentation of stage III.
    causal_link_type: DIRECT
- name: Stage III Dermal Melanophage Pigment Incontinence
  biological_scale: TISSUE
  description: >-
    The third stage is the eponymous lesion: melanin is 'incontinent' at the
    dermal-epidermal junction, dropping from injured basal keratinocytes and
    melanocytes into dermal macrophages (melanophages), producing swirled,
    marbled grey-brown hyperpigmentation along Blaschko lines — the finding for
    which the disease is named.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "III.. Swirling macular hyperpigmentation (age ~6 months into adulthood)."
    explanation: The swirled Blaschko-linear hyperpigmentation is the third, eponymous cutaneous stage.
  - reference: PMID:2003648
    reference_title: "Hypo- and hyperpigmented areas in incontinentia pigmenti. Light and electron microscopic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in hyperpigmented areas we found a reduction of pigment in those parts of the basal layer overlying melanophages located in the upper dermis."
    explanation: Light/EM study of IP skin documenting the pigment-incontinence mechanism — basal-layer pigment loss overlying dermal melanophages.
  downstream:
  - target: Stage IV Atrophic Hypopigmentation
    description: The hyperpigmentation fades to the atrophic hypopigmented streaks of the final stage.
    causal_link_type: DIRECT
- name: Stage IV Atrophic Hypopigmentation
  biological_scale: TISSUE
  description: >-
    The fourth, adult stage is atrophic linear hypopigmentation — pale,
    hairless, often atrophic streaks (frequently on the lower legs) along
    Blaschko lines.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:20301645
    reference_title: "Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IV.. Linear hypopigmentation."
    explanation: Atrophic linear hypopigmentation is the fourth, adult-stage cutaneous manifestation.
- name: Retinal Vascular Dysgenesis and Neovascularization
  biological_scale: TISSUE
  description: >-
    Apoptosis of retinal vascular endothelium produces peripheral retinal
    non-perfusion/avascularity; the resulting ischemia drives pathologic
    neovascularization that predisposes to tractional retinal detachment, the
    principal cause of vision loss in IP. Foveal/inner-retinal structural
    abnormalities also occur.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:26043102
    reference_title: "Structural Abnormalities of the Inner Macula in Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fluorescein angiography showed filling defects in retinal and choroidal circulations and irregularities of the foveal avascular zones."
    explanation: Documents the retinal vascular non-perfusion/dysgenesis underlying IP retinopathy.
- name: Cerebral Vaso-Occlusive and Neuronal Injury
  biological_scale: TISSUE
  description: >-
    The CNS manifestations of IP — seizures, intellectual disability, and
    developmental delay — are believed to arise from cerebral vaso-occlusive
    events (consistent with the shared endothelial vulnerability of NEMO-null
    vessels) with secondary neuronal injury. They are among the most
    prognostically important extracutaneous features, and the underlying
    mechanism remains incompletely defined.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:26043102
    reference_title: "Structural Abnormalities of the Inner Macula in Incontinentia Pigmenti."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cause of the CNS anomalies in IP patients is unknown but believed to be from vaso-occlusive events."
    explanation: Attributes the CNS anomalies of IP to vaso-occlusive events, supporting the vascular mechanism of this node.
  - reference: PMID:33655605
    reference_title: "Importance of extracutaneous organ involvement in determining the clinical severity and prognosis of incontinentia pigmenti caused by mutations in the IKBKG gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ocular manifestations (28%), neurological abnormalities (28%),"
    explanation: Quantifies neurological involvement at ~28% of patients, one of the most prognostically important extracutaneous features.

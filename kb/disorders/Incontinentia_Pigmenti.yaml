name: Incontinentia Pigmenti
category: Mendelian
creation_date: "2026-07-30T04:10:00Z"
synonyms:
- Bloch-Sulzberger syndrome
- IP
- IP2
description: >-
  Incontinentia pigmenti (IP) is a rare X-linked dominant, typically
  male-lethal, multisystem ectodermal disorder caused by loss-of-function
  variants in IKBKG (NEMO), the regulatory subunit of the IKK complex required
  for canonical NF-kB activation. Loss of NEMO removes the NF-kB-dependent
  cytoprotective program, so mutant cells become hypersensitive to
  TNF-induced apoptosis; the selective elimination of cells expressing the
  mutant X produces extremely skewed X-inactivation (allowing female survival
  and the mosaic Blaschko-linear distribution) while hemizygous null male
  conceptuses miscarry. The skin evolves through four classic stages —
  vesiculobullous, verrucous, swirled hyperpigmentation, and linear
  hypopigmentation — accompanied by dental, hair, nail, retinal, and central
  nervous system involvement. The florid eosinophilic inflammation of the first
  stage is driven by NF-kB-activated eotaxin secreted by the surviving
  NEMO-competent bystander cells.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Eye examination: monthly until age four months, then every three months from age four months to one year, every six months from age one to three years, and annually after age three years."
    explanation: Specifies the intensive ophthalmologic surveillance schedule that catches sight-threatening retinopathy early.
- name: Supportive Skin and Blister Care
  description: >-
    Stage-I blisters and any secondary skin infections are managed with standard

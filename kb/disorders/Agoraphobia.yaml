name: Agoraphobia
creation_date: "2026-09-07T15:00:00Z"
category: Psychiatric
description: >-
  Agoraphobia is a phobic anxiety disorder characterized by marked fear or
  anxiety about situations such as public transport, open spaces, enclosed
  places, crowds or queues, and being outside the home alone, arising from the
  thought that escape might be difficult or help unavailable should
  panic-like or other incapacitating symptoms occur. DSM-5 and ICD-11
  established agoraphobia as a diagnosis independent of panic disorder rather
  than a residual panic disorder specifier. Two partly separable mechanistic
  strands are described: a fear-learning strand in which heightened startle
  and fear-network reactivity support catastrophic agoraphobic cognitions, and
  a spatial-orientation strand in which vestibular dysfunction drives a
  compensatory dependence on visual and proprioceptive cues, producing
  discomfort precisely in the settings where those cues are unreliable.
disease_term:
  preferred_term: agoraphobia
  term:
    id: MONDO:0003709
    label: agoraphobia
parents:
- Anxiety Disorder
- Mental Health Disorder
prevalence:
- population: Italian adult community sample
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1500.0
  rate_denominator: POPULATION
  notes: >-
    Community survey of 2338 randomly selected adults interviewed by clinicians
    with the ANTAS schedule against ICD-10 criteria; prevalence was higher in
    women (2.0%) than men (0.9%).
  evidence:
  - reference: PMID:33849246
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One out of seventy people may suffer from agoraphobia in their lifetime.
    explanation: >-
      Clinician-administered community survey supplies a lifetime prevalence
      estimate for agoraphobia as an autonomous diagnosis.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Health-related quality of life in agoraphobia is reduced to a degree
    comparable with major depression, PTSD and obsessive-compulsive disorder,
    and the reduction is similar whether or not panic disorder is also present.
  evidence:
  - reference: PMID:33849246
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The attributable burden in terms of HR-QoL is substantial and comparable
      to the one observed for chronic mental disorders such as major
      depression, post-traumatic stress disorder, or obsessive-compulsive
      disorder.
    explanation: >-
      Quantified quality-of-life comparison establishes the burden level.
pathophysiology:
- name: GLRB Glycine Receptor Variation
  description: >-
    Non-coding variants in GLRB, encoding the glycine receptor beta subunit,
    are associated with agoraphobic cognitions at genome-wide significance in a
    dimensional phenotype based on the Agoraphobia Cognition Questionnaire, and
    replicate against dichotomous and categorical agoraphobia phenotypes. The
    same gene carries rare coding mutations causing hyperekplexia, a
    neurological startle disorder with agoraphobic behavior.
  biological_scale: MOLECULAR
  downstream:
  - target: Exaggerated Startle and Fear Network Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28167838
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analyses of intermediate PD/AG phenotypes demonstrated increased
        startle reflex and increased fear network, as well as general sensory
        activation by GLRB risk gene variants rs78726293, rs191260602,
        rs17035816 and rs7688285.
      explanation: >-
        Directly links the risk variants named by this node to the startle and
        fear-network intermediate phenotypes of the downstream node, which is
        the edge rather than either node alone.
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We followed up on this finding in a larger dimensional ACQ sample
      (N=2547) and in independent samples with a dichotomous AG phenotype based
      on the Symptoms Checklist (SCL-90; N=3845) and a case-control sample with
      the categorical phenotype PD/AG (Ncombined =1012) obtaining highly
      significant P-values also for GLRB single-nucleotide variants rs17035816
      (P=3.8 × 10-4) and rs7688285 (P=7.6 × 10-5).
    explanation: >-
      Replication across dimensional, dichotomous and categorical agoraphobia
      phenotypes supports the GLRB association.
- name: Exaggerated Startle and Fear Network Activation
  description: >-
    Carriers of GLRB risk variants show an increased startle reflex and
    increased fear-network and general sensory activation, an intermediate
    phenotype linking the genetic finding to the clinical fear response.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: startle response
    modifier: INCREASED
    term:
      id: GO:0001964
      label: startle response
  locations:
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  downstream:
  - target: Agoraphobic Cognitions
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Heightened startle and fear-network reactivity is proposed to support
      catastrophic appraisal of bodily sensations in agoraphobic situations.
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analyses of intermediate PD/AG phenotypes demonstrated increased startle
      reflex and increased fear network, as well as general sensory activation
      by GLRB risk gene variants rs78726293, rs191260602, rs17035816 and
      rs7688285.
    explanation: >-
      Reports the startle and fear-network activation phenotype this node
      describes.
- name: Vestibular Dysfunction
  description: >-
    Peripheral and central vestibular abnormalities are over-represented in
    agoraphobia and in panic disorder with agoraphobia, and are the proposed
    initiating lesion of the spatial-orientation strand of the disorder.
  biological_scale: TISSUE
  locations:
  - preferred_term: vestibular system
    term:
      id: UBERON:0004681
      label: vestibular system
  downstream:
  - target: Non-Vestibular Balance Control Strategy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:9178344
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vestibular dysfunction may lead to an information processing strategy
        focusing on spatial stimuli from two nonvestibular sensory channels,
        vision and proprioception.
      explanation: >-
        States the proposed causal step from vestibular dysfunction to the
        compensatory non-vestibular strategy, which is this edge.
  evidence:
  - reference: PMID:18653552
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of either panic attacks or fear of heights increased the
      probability of having caloric hypofunction in a non-additive fashion.
    explanation: >-
      Caloric hypofunction indicates peripheral vestibular dysfunction and is
      associated with the anxiety phenomenology relevant to agoraphobia.
- name: Non-Vestibular Balance Control Strategy
  description: >-
    Agoraphobic patients compensate by relying on proprioceptive and visual
    spatial cues rather than vestibular input for upright balance. On
    computerized dynamic posturography this shows as surface dependence,
    impaired balance specifically when proprioceptive information is degraded.
  biological_scale: ORGANISM
  downstream:
  - target: Space and Motion Discomfort
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9178344
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Agoraphobics rely on proprioceptive cues for maintenance of upright
        balance. This strategy may lead to intolerance of situations
        characterized by unstable support.
      explanation: >-
        The authors state the step from the compensatory balance strategy to
        situational intolerance, which is this edge.
  evidence:
  - reference: PMID:9178344
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The agoraphobics had impaired balance when proprioceptive balance
      information was minimized by sway-referencing the support surface (p <
      0.02).
    explanation: >-
      Posturography directly demonstrates the surface dependence this node
      describes, in an agoraphobic group specifically.
- name: Space and Motion Discomfort
  description: >-
    Discomfort in environments providing inadequate or conflicting visual and
    proprioceptive spatial reference. This is the mechanistic bridge to the
    specific situational content of agoraphobia, since open spaces, crowds and
    moving vehicles are exactly the settings in which such cues are degraded.
  biological_scale: ORGANISM
  downstream:
  - target: Situational Fear and Avoidance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:18653552
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMD and anxiety responses were independently associated with abnormal
      balance.
    explanation: >-
      Establishes space and motion discomfort as a measurable construct tied to
      objectively abnormal balance, independent of anxiety response.
  - reference: PMID:18653552
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with anxiety disorders, higher SMD is indicative of
      somatosensory dependence in the control of balance.
    explanation: >-
      Connects the discomfort construct back to the somatosensory dependence of
      the upstream node.
- name: Agoraphobic Cognitions
  description: >-
    Catastrophic beliefs that escape would be difficult or help unavailable if
    incapacitating symptoms occurred. These cognitions are the phenotype on
    which the GLRB genome-wide association was defined, via the Agoraphobia
    Cognition Questionnaire.
  biological_scale: ORGANISM
  downstream:
  - target: Situational Fear and Avoidance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore performed a genome-wide association study with a
      dimensional, PD/AG-related anxiety phenotype based on the Agoraphobia
      Cognition Questionnaire (ACQ) in a sample of 1370 healthy German
      volunteers of the CRC TRR58 MEGA study wave 1.
    explanation: >-
      Establishes agoraphobic cognitions as an operationalized, measurable
      dimensional phenotype.
- name: Situational Fear and Avoidance
  description: >-
    The convergent clinical endpoint: fear of, and active avoidance of, the
    agoraphobic situations. Avoidance is the feature that drives the disorder's
    course and functional impact, and is the primary target of treatment.
  biological_scale: ORGANISM
  downstream:
  - target: Agoraphobia
  - target: Anxiety
phenotypes:
- name: Agoraphobia
  category: Behavioral
  description: >-
    Fear and avoidance of situations where escape might be difficult or help
    unavailable, in two or more of the DSM-5 situational clusters.
  phenotype_term:
    preferred_term: Agoraphobia
    term:
      id: HP:0000756
      label: Agoraphobia
  evidence:
  - reference: PMID:20143426
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We come to the conclusion that AG should be conceptualized as an
      independent disorder with more specific criteria rather than a
      subordinate, residual form of PD as currently stipulated in DSM-IV-TR.
    explanation: >-
      Review establishing agoraphobia as an independent diagnostic entity, the
      basis for curating it as its own disease rather than a panic disorder
      specifier.
- name: Anxiety
  category: Behavioral
  description: >-
    Marked anticipatory anxiety about entering or remaining in agoraphobic
    situations.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:33849246
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current nosology redefined agoraphobia as an autonomous diagnosis
      distinct from panic disorder.
    explanation: >-
      Community survey of agoraphobia as an anxiety diagnosis in its own right;
      the anxiety phenotype itself is definitional.
- name: Exaggerated startle response
  category: Clinical Sign
  description: >-
    Increased startle reflex is an intermediate phenotype associated with GLRB
    risk variants, and generalized startle is the cardinal feature of
    hyperekplexia, caused by rare coding mutations in the same gene.
  phenotype_term:
    preferred_term: Exaggerated startle response
    term:
      id: HP:0002267
      label: Exaggerated startle response
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conjunction with the clinical observation that rare coding GLRB gene
      mutations are associated with the neurological disorder hyperekplexia
      characterized by a generalized startle reaction and agoraphobic behavior,
      our data provide evidence that non-coding, although functional GLRB gene
      polymorphisms may predispose to PD by increasing startle response and
      agoraphobic cognitions.
    explanation: >-
      Links the startle phenotype to GLRB variation and to agoraphobic
      behavior.
- name: Abnormal vestibular function
  category: Clinical Sign
  description: >-
    Balance and vestibular test abnormalities, particularly surface-dependent
    balance control, are over-represented in agoraphobia.
  phenotype_term:
    preferred_term: Abnormal vestibular function
    term:
      id: HP:0001751
      label: Abnormal vestibular function
  evidence:
  - reference: PMID:9178344
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The agoraphobics had impaired balance when proprioceptive balance
      information was minimized by sway-referencing the support surface (p <
      0.02).
    explanation: >-
      Objective posturographic abnormality measured in an agoraphobic group.
genetic:
- name: GLRB
  notes: >-
    Non-coding GLRB variants are associated with agoraphobic cognitions and
    with increased startle and fear-network activation. These are common
    susceptibility polymorphisms under a complex-trait model, not Mendelian
    causal variants.
  gene_term:
    preferred_term: GLRB
    term:
      id: hgnc:4329
      label: GLRB
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GLRB gene expression was found to be modulated by rs7688285 in brain
      tissue, as well as cell culture.
    explanation: >-
      Provides the functional basis for treating these non-coding variants as
      acting through GLRB expression.
inheritance:
- name: Polygenic susceptibility
  description: >-
    Agoraphobia is heritable but polygenic. Twin modelling of DSM-IV phobias in
    women estimated heritability between 0.43 and 0.63, with agoraphobia
    loading on a liability factor shared with social phobia rather than with
    the simple phobias.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:21211096
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the best fitting twin model, which did not include shared
      environmental factors, heritability estimates for the phobias ranged from
      0.43 to 0.63.
    explanation: >-
      Population-based twin study quantifies the heritable component across the
      phobias including agoraphobia.
  - reference: PMID:21211096
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second liability factor strongly influenced the complex phobias, but
      also loaded weak to moderate on all the other phobias.
    explanation: >-
      Supports agoraphobia grouping with social phobia on a shared complex
      phobia liability factor rather than with the simple phobias.
animal_models:
- name: Partial Glrb knockout mouse
  species: Mouse
  genotype: Partial Glrb knockout
  publication: PMID:28167838
  description: >-
    Mice with partial knockout of Glrb, the mouse orthologue of the human
    agoraphobia-associated gene, were reported to display an agoraphobic
    behavioral phenotype, supporting the translational relevance of the human
    genetic association.
  modeled_mechanisms:
  - target: GLRB Glycine Receptor Variation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reduced Glrb dosage in mouse models the direction of effect proposed for
      the human non-coding risk variants.
    limitations: >-
      The human association is with non-coding regulatory variants producing
      modest expression differences, whereas the model is a partial gene
      knockout, so the perturbation is not equivalent in kind or magnitude.
      Agoraphobia is defined by situational cognitions about escape and help
      availability, which have no faithful murine counterpart, so the reported
      agoraphobic phenotype is an avoidance-behavior analogue. The finding is
      reported as one component of a larger human genetics paper rather than as
      a dedicated behavioral study.
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Partial Glrb knockout mice demonstrated an agoraphobic phenotype.
    explanation: >-
      Reports the animal-model result supporting a causal role for reduced GLRB
      function.
diagnosis:
- name: Clinical assessment for agoraphobic fear and avoidance
  presence: >-
    Diagnosis is clinical, requiring marked fear or anxiety about two or more
    of the five DSM-5 situational clusters, arising from thoughts that escape
    might be difficult or help unavailable if incapacitating symptoms occurred,
    with active avoidance, persistence over time, and impairment. The
    Agoraphobia Cognition Questionnaire is the standard dimensional research
    instrument.
  evidence:
  - reference: PMID:28167838
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore performed a genome-wide association study with a
      dimensional, PD/AG-related anxiety phenotype based on the Agoraphobia
      Cognition Questionnaire (ACQ) in a sample of 1370 healthy German
      volunteers of the CRC TRR58 MEGA study wave 1.
    explanation: >-
      Identifies the standard dimensional instrument for agoraphobic
      cognitions.
differential_diagnoses:
- name: Panic disorder
  description: >-
    Panic disorder is defined by recurrent unexpected panic attacks and concern
    about further attacks. Agoraphobia frequently co-occurs with it but can
    exist independently, which is why current nosology separates the two.
  disease_term:
    preferred_term: panic disorder
    term:
      id: MONDO:0005383
      label: panic disorder
  evidence:
  - reference: PMID:33849246
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agoraphobia was more often seen among those with (n=26; 1.1%) than
      without (n=9; 0.4%) panic disorder: OR=8.3; 2.9-24.4.
    explanation: >-
      Quantifies the association with panic disorder while documenting cases
      occurring without it.
- name: Social anxiety disorder
  description: >-
    In social anxiety disorder the feared outcome is negative social
    evaluation, whereas in agoraphobia it is difficulty escaping or obtaining
    help if incapacitating symptoms occur.
  disease_term:
    preferred_term: social anxiety disorder
    term:
      id: MONDO:0001247
      label: social phobia
- name: Specific phobia
  description: >-
    Specific phobia is fear of a circumscribed object or situation; agoraphobia
    requires fear across two or more distinct situational clusters.
  disease_term:
    preferred_term: specific phobia
    term:
      id: MONDO:0012000
      label: specific phobia
treatments:
- name: Exposure in vivo combined with antidepressant pharmacotherapy
  description: >-
    In a meta-analysis of 106 studies of panic disorder with or without
    agoraphobia, every active treatment examined outperformed control on the
    agoraphobic avoidance outcome specifically, and the combination of
    antidepressants with exposure in vivo was superior to all other conditions
    for that outcome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral intervention with exposure in vivo
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Situational Fear and Avoidance
    description: >-
      Exposure directly targets the avoidance endpoint of the causal chain.
  target_phenotypes:
  - preferred_term: Agoraphobia
    term:
      id: HP:0000756
      label: Agoraphobia
  evidence:
  - reference: PMID:9284865
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With regard to agoraphobic avoidance, all seven treatments were superior
      to the control condition.
    explanation: >-
      Meta-analysis reports agoraphobic avoidance as a distinct outcome, so
      this supports treatment of agoraphobia specifically rather than of panic
      attacks.
  - reference: PMID:9284865
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For agoraphobic avoidance, the combination of antidepressants with
      exposure in vivo was superior to the other conditions.
    explanation: >-
      Identifies the superior combination specifically for the agoraphobic
      avoidance outcome.
  notes: >-
    The trial literature is overwhelmingly conducted in panic disorder with or
    without agoraphobia rather than in agoraphobia as an independent diagnosis.
    This meta-analysis is cited because it reports agoraphobic avoidance as a
    separate outcome variable; it is not evidence from an agoraphobia-only
    population.
- name: Antidepressant pharmacotherapy
  description: >-
    Antidepressants are effective for panic disorder with or without
    agoraphobia and improve agoraphobic avoidance, though the network
    meta-analytic evidence base is defined on panic disorder populations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: selective serotonin reuptake inhibitor
      term:
        id: NCIT:C94725
        label: Selective Serotonin Reuptake Inhibitor
  target_phenotypes:
  - preferred_term: Agoraphobia
    term:
      id: HP:0000756
      label: Agoraphobia
  evidence:
  - reference: PMID:9284865
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antidepressants, psychological panic management, high-potency
      benzodiazepines, and antidepressants combined with exposure in vivo were
      superior to the control condition for panic attacks.
    explanation: >-
      This sentence reports the panic-attack outcome rather than the
      agoraphobia outcome, so it supports pharmacotherapy for agoraphobia only
      through the inference that treating the panic component reduces
      agoraphobic avoidance; graded indirect for that reason.
notes: >-
  Curated from primary literature located through PubMed. The most important
  interpretive caution for this entry is that the great majority of agoraphobia
  research is conducted in panic disorder samples with agoraphobia as a
  modifier, even though current nosology treats agoraphobia as independent.
  Evidence has therefore been selected preferentially where the source reports
  an agoraphobia-specific outcome, phenotype or sample, and treatment evidence
  is annotated where it does not. The two mechanistic strands curated here, the
  GLRB startle/fear-network strand and the vestibular/space-and-motion
  discomfort strand, are not established as acting in the same patients; they
  are curated as parallel routes converging on situational avoidance rather
  than as a single validated pathway. The posturography studies are small and
  date from the 1990s.

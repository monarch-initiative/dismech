differential_diagnoses:
- name: SETD5 haploinsufficiency syndrome
  description: >-
    Intragenic SETD5 loss-of-function variants overlap the developmental and craniofacial
    phenotype of SETD5-containing deletions. Copy-number testing and sequence analysis distinguish
    the molecular diagnoses. Cardiac defects and polydactyly have also been reported with
    intragenic variants, so these findings do not uniquely identify a multigene deletion.
  disease_term:
    preferred_term: SETD5 haploinsufficiency syndrome
    term:
      id: MONDO:0014336
      label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
  evidence:
  - reference: PMID:25138099
    reference_title: >-
      Loss-of-function variants of SETD5 cause intellectual disability and the
      core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six patients presented with ID and certain facial dysmorphisms,
      suggesting that SETD5 sequence variants contribute substantially to the
      microdeletion 3p25.3 phenotype.
    explanation: >-
      Establishes that the single-gene disorder reproduces the core of the
      deletion phenotype, which is exactly why it is the leading differential.
  - reference: PMID:27375234
    reference_title: >-
      SETD5 loss-of-function mutation as a likely cause of a familial syndromic
      intellectual disability with variable phenotypic expression.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function de novo mutations in the SETD5 gene, encoding a putative
      methyltransferase, are an important cause of moderate/severe intellectual
      disability as evidenced by the results of sequencing large patient cohorts.
    explanation: >-
      Confirms the single-gene entity exists independently of any deletion, which
      is what makes it a differential rather than a synonym.
- name: BRPF1-related intellectual disability
  description: >-
    The other single-gene disorder inside the 3p25.3 interval. Historically most
    of the 3p25 deletion phenotype was attributed to SETD5 before BRPF1 was
    characterised, and ptosis and blepharophimosis in particular track with BRPF1
    loss. A contiguous deletion can remove both, so the question at the bedside
    is whether a microarray shows a deletion or sequencing shows an intragenic
    BRPF1 variant.
  evidence:
  - reference: PMID:27939639
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that both genes contribute to the phenotypic severity of 3p25 deletion syndrome
      but that some specific features, such as ptosis and blepharophimosis, are mostly driven
      by BRPF1 haploinsufficiency.
    explanation: >-
      Human comparison supports contributions from both genes, particularly BRPF1-associated
      eyelid features.
    reference_title: >-
      Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual
      Disability with Associated Ptosis.
- name: 3p25.3 microdeletion syndrome
  description: >-
    An overlapping ontology concept for 3p25.3 microdeletions, often interstitial and encompassing
    SETD5 and/or BRPF1. Breakpoint mapping describes overlap with the broader distal 3p deletion
    spectrum; this is not a mutually exclusive clinical alternative.
  disease_term:
    preferred_term: 3p25.3 microdeletion syndrome
    term:
      id: MONDO:0018564
      label: 3p25.3 microdeletion syndrome
- name: Unbalanced translocation producing 3p monosomy
  description: >-
    A 3p deletion can arise as one half of an unbalanced translocation carried by
    a parent, with a reciprocal gain elsewhere in the genome. The deletion
    phenotype is then overlaid on whatever the duplicated segment contributes, so
    features outside the 3p- picture should prompt a look at the other
    chromosome, and parental karyotyping changes the recurrence risk.
  evidence:
  - reference: PMID:34602958
    reference_title: >-
      Partial Trisomy 13q/Monosomy 3p Resulting from a Paternal Reciprocal
      3p;13q Translocation in a Boy with Facial Dysmorphism and Hypertrophic
      Cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A chromosomal imbalance with a partial trisomy 13q31.1q34 and monosomy
      3p26.3 of paternal origin were detected.
    explanation: >-
      A worked case of 3p monosomy arising as one half of an inherited unbalanced
      translocation, which is the mechanism this differential names.
discussions:
- discussion_id: del3p_gene_content_and_variable_expression
  kind: KNOWLEDGE_GAP
  prompt: >-
    How do gene content and genetic background jointly determine the variable phenotype of
    distal 3p deletions?
  rationale: >-
    Human sequence-variant and deletion comparisons support SETD5 and BRPF1 contributions.
    Small comparative cohorts suggest more severe developmental delay when both are lost,
    but assessments are heterogeneous. SRGAP3 and the distal adhesion genes remain additional
    candidates. Different outcomes among relatives with the same 7.4 Mb deletion show that
    deletion size alone is insufficient. The CHL1 family’s additional 1q44 duplication further
    limits single-gene attribution.
  attaches_to:
  - genetic#SETD5
  - genetic#BRPF1
  - genetic#SRGAP3
  - genetic#CHL1
  evidence:
  - reference: PMID:27939639
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals from group 3 acquired walking after 3 years of age (5/5 for group 3
      versus 2/19 for groups 1 and 2, p value = 0.0005) and presently have no language (5/5
      for group 3 versus 1/19 for groups 1 and 2, p value = 0.0001) (Table 3), suggesting
      that disruption of both BRPF1 and SETD5 contributes to the phenotype of 3p25 deletion
      syndrome.
    explanation: >-
      The comparison is five co-deleted individuals versus single-gene groups; it is not a
      population frequency estimate.
    reference_title: >-
      Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of Intellectual
      Disability with Associated Ptosis.
  - reference: PMID:33936696
    reference_title: "Familiar del3p syndrome: The uncertainty of the prognosis. A case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three members of the family had the 3p26.3-p26.1 deletion; however, only
      the son presented clinical features.
    explanation: >-
      A second, independent family in which the deletion segregates with only one
      affected carrier - non-penetrance shown in a different pedigree from the
      four-generation family cited above.
  - reference: PMID:21457564
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among them, a maternally inherited 1q44 duplication of 696 Kbs is shared by the two
      brothers and absent in the father.
    explanation: >-
      The additional CNV limits attribution of the brothers’ clinical findings to the paternally
      inherited CHL1 deletion alone.
    reference_title: >-
      Microarray based analysis of an inherited terminal 3p26.3 deletion, containing only
      the CHL1 gene, from a normal father to his two affected children.
- discussion_id: del3p_igcam_context_dependent_mouse_findings
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Which IgCAM model findings explain human deletion phenotypes, and which depend on genotype,
    neural region or behavioral assay?
  rationale: >-
    The review’s abstract broadly describes weak mouse phenotypes, but its full text reports
    structural and behavioral abnormalities. Compound Chl1/Cntn6 heterozygotes already show
    enhanced dendritic misorientation. Cntn4 deficiency lacked ASD-related behavioral effects
    in one assay battery while enhancing Barnes-maze performance and acoustic startle. Compensation
    is a proposed explanation, not a demonstrated universal rescue. These results neither
    refute all neurite effects nor prove a human ASD mechanism.
  attaches_to:
  - pathophysiology#Abnormal Neurite Development
  evidence:
  - reference: PMID:33519384
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, compound heterozygous mice for both Chl1 and Cntn6 display an additive deleterious
      phenotype – these compound heterozygous mice showed more severe misoriented dendrites
      compared to single heterozygous Chl1 or Cntn6 mice and wild-type littermates (Ye et
      al., 2008).
    explanation: >-
      The full review describes an existing compound mouse experiment with a structural endpoint;
      it is not evidence that all triple-deletion mechanisms have been tested.
    quote_role: REVIEW_SYNTHESIS
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion
      Syndrome and Autism Spectrum Disorder.
  - reference: PMID:33519384
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study also included assessments for ASD-related behaviors such as the juvenile
      social interaction test, three-chamber social interaction test, novel object investigation
      task and the Barnes maze; however, Cntn4-deficiency was not observed to affect ASD-related
      behaviors (Molenhuis et al., 2016).
    explanation: >-
      A negative result confined to the named ASD-related behavioral assessments.
    quote_role: REVIEW_SYNTHESIS
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion
      Syndrome and Autism Spectrum Disorder.
  - reference: PMID:33519384
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, Cntn4-deficient mice do demonstrate enhanced spatial learning in the Barnes
      maze and a consistently increased startle response to auditory stimuli at high amplitudes
      (Molenhuis et al., 2016).
    explanation: >-
      Other behavioral endpoints changed in the same model; absence of an ASD-like phenotype
      is not absence of every phenotype.
    quote_role: REVIEW_SYNTHESIS
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion
      Syndrome and Autism Spectrum Disorder.
- discussion_id: del3p_unresolved_cardiac_gene
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which gene or combination of genes contributes to congenital heart disease in distal 3p
    deletions?
  rationale: >-
    The approximately 200 kb mapping interval assumed complete penetrance and excludes CAV3.
    CAV3 has separately been proposed in case reports, but the 2025 hypoplastic-left-heart
    case lacked molecular breakpoint mapping. A CAV3-containing deletion without a heart defect
    argues against fully penetrant sufficiency, not against every possible susceptibility
    effect. These limitations prevent gene-level prediction of a specific cardiac lesion.
  attaches_to:
  - pathophysiology#Disrupted Cardiac Development
  - genetic#CAV3
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assuming complete penetrance, a candidate critical region for a CHD
      susceptibility gene was refined to approximately 200 kb and a candidate
      critical region for mental retardation was mapped to an approximately 1
      Mb interval containing SRGAP3
    explanation: >-
      Maps the cardiac and neurodevelopmental critical regions separately,
      which is the direct basis for splitting these two branches.
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified an indirect relation between gene CAV3 and hypoplastic left
      heart syndrome due to its strong association with cardiomyopathies and
      isolated cardiac defects.
    explanation: >-
      The authors themselves call the relation indirect, which is the reason this
      is a knowledge gap rather than a curated gene-phenotype assertion.
  - reference: PMID:33643973
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      On the other hand, some known candidate genes, such as CAV3 and SEC13R, were shown to
      be outside the target interval.
    explanation: >-
      The full-text literature discussion explicitly places CAV3 and SEC13R outside the refined
      target interval.
    reference_title: >-
      Case Report: A Case Report and Literature Review of 3p Deletion Syndrome.
  - reference: PMID:39841745
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Unfortunately, the NB died before further examinations could be conducted and there
      was not enough biological material stored of her, preventing us from running additional
      and more complete genetic tests, such as microarray-based comparative genomic hybridization
      (CGH-Array).
    explanation: >-
      The infant died before additional testing; the authors explicitly state that molecular
      confirmation of the breakpoint was not available.
    reference_title: >-
      First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate
      genes.
notes: >-
  Scope: a multigene distal 3p deletion disorder encompassing terminal and overlapping interstitial
  presentations. Intragenic SETD5 and BRPF1 disorders remain separate entries. The deep-research
  report was used as a lead list; its incorrect HPO/CL labels, untraceable phenotype-frequency
  attribution and off-entity proximal-deletion and renal-cancer references were not imported.

  Full-text review: the 2015 SETD5 study supports a 94 kb overlap in its combined case comparison,
  engineered-cell nonsense-mediated decay and directly observed deletion phenotypes. The 2017
  BRPF1 paper supports human genotype–phenotype comparison, altered complex assembly and H3K23
  acetylation in transfected cells, with a non-significant patient-fibroblast result. The
  2018 SETD5 author manuscript clarifies Pol II redistribution, unchanged Hdac3 enzymatic
  activity, and the experimental model boundaries. The IgCAM review’s body and tables identify
  existing compound mouse experiments and endpoint-specific positive and negative findings
  that its abstract alone obscures.

  Frequency audit: PMID:33643973 Table 3 has 29 columns including the index case, despite
  prose describing 29 literature cases. It gives CHD in 10/29 columns (five undescribed) and
  hearing abnormalities in 4/29 (nine undescribed), which do not reproduce the narrative 43%
  and 29%. Its motor-development row is not linear growth retardation. The hearing-negative
  index case had failed screens and incompletely resolved follow-up; its gastrointestinal-negative
  table entry coexists with diagnosed reflux. The selected literature sample mixes deletion
  intervals and ascertainment methods. Neither its narrative percentages nor recalculated
  table fractions are used as population frequencies. Qualitative descriptions such as “rare”
  and single-case observations are not converted into HPO frequency bands.

  Phenotype coverage: cleft palate is explicitly mentioned in the full SETD5 paper’s summary
  of earlier deletion reports and in the later comparative table. High palate, reflux, ventricular
  septal defect, hypoplastic left ventricle and other directly described features are curated
  separately. The inverted-duplication/terminal-deletion paper contributes only its literature
  summary of pure deletion phenotypes; its own complex-rearrangement case is not pooled with
  them. No disease-specific GeneReviews or StatPearls chapter was identified in the required
  source checks.

  Deletion-dependent tumor risk: PMID:26365017 adds a cerebellar hemangioblastoma case associated
  with a deletion spanning the VHL locus, and its authors’ repeat-imaging recommendation.
  The phenotype, genetic susceptibility and care implications are restricted to that genomic
  context. A later surveillance-report lead, PMID:35441425, had no PubMed abstract and its
  inaccessible findings were not inferred.
review_notes: >-
  Review focused on distinctions between human observations, experimental models and candidate-gene
  inference. All syndrome-wide frequency bands were removed because the cited evidence did
  not justify their numerical ranges. BRPF1 was upgraded to a supported causal contributor;
  SRGAP3 remains a susceptibility candidate. CAV3 location, conditional cardiac mapping, same-deletion
  familial variability and the additional 1q44 CNV are explicit. Mechanism nodes separate
  gene dosage, complex assembly, acetylation, transcription, Rac signaling and neurite development,
  with unknown intermediates retained where human causal steps are untested.
  Downslanting palpebral fissures, sacral dimple, syndactyly and feeding difficulties in the
  Perplexity artifact trace to aggregators or an unverified frequency table, so they are not
  promoted to additional source-verified phenotypes here. The institutional PDF is the Deliu
  et al. manuscript of "Haploinsufficiency of the intellectual disability gene SETD5 disturbs
  developmental gene expression and cognition"; its generated cache title is the repository URL.

    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 29 well-documented cases were found in the literature, of which
      19 cases had an onset within 1 year of birth, and mainly manifested with
      mental and motor development disabilities and abnormal facial features,
      with different gene deletions, depending on the size and location of the 3p
      deletion.
    explanation: >-

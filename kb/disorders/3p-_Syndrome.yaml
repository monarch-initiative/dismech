    head-control, kneeling and sitting exercises. Improvements were described after a short
    course and during subsequent follow-up, without a control group or proof of a sustained
    disease-modifying effect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: comprehensive developmental rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:33643973
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatment the patient was given consisted of a comprehensive rehabilitation program,
      which included large joint loosening training, Brunstrom training, exercise system training,
      head control and climbing strength training, four-point kneeling and one knee kneeling,
      and sitting training. After more than 12 days of rehabilitation, the responses had improved,
      and the patient could turn over, clap his hands, chase people and objects, grasp objects,
      sit up for more than half an hour, and stand for around 3 min.
    explanation: >-
      The case describes the actual motor rehabilitation program and observed gains after

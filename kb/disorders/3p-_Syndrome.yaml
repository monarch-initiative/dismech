    and Sec13R. CRELD1, the first gene implicated in isolated atrioventricular
    septal defect, also maps to 3p25 and is the candidate on functional grounds,
    but no single gene in this interval has been shown to carry the cardiac
    phenotype in a patient with 3p- syndrome.

  description: >-
    Present in essentially all patients with a full-sized deletion, and one of
    the two features that define the classic syndrome. Severity varies with
    deletion extent, from learning difficulty in small terminal deletions to
    severe impairment in multi-megabase ones.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:

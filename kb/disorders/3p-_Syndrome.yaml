  - reference: PMID:15106122
    reference_title: "Disruption of contactin 4 (CNTN4) results in developmental delay and other features of 3p deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fine mapping of this rearrangement demonstrates that the translocation
      breakpoint on chromosome 3 falls within the recently identified minimal
      candidate region for 3p deletion syndrome and disrupts the Contactin 4
      (CNTN4) mRNA transcript at 3p26.2-3p26.3.
    explanation: >-
      Disrupts this gene without a deletion, isolating its contribution.
  - reference: PMID:18837054
    reference_title: "Molecular characterization of a patient with 3p deletion syndrome and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study confirms the minimal candidate region for 3p deletion
      syndrome, provides further evidence implicating haploinsufficiency of
      CNTN4 in the disorder, and demonstrates the utility of high-resolution
      investigations of rare chromosomal rearrangements.
    explanation: >-
      Independent deletion mapping supporting haploinsufficiency of this gene.
- name: CNTN6
  notes: >-
    Contactin 6, the third member of the 3p26.3 adhesion molecule cluster,
    between CHL1 and CNTN4. Deleted alongside them in terminal deletions. Its
    individual contribution has not been isolated in a patient.
  gene_term:
    preferred_term: CNTN6
    term:
      id: hgnc:2176
      label: CNTN6
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Deleted with the rest of the 3p26.3 adhesion molecule cluster; individual
    contribution not separated.
  evidence:
  - reference: PMID:41384039
    reference_title: "Case Report: developmental delay and intellectual disability linked to a maternally inherited derivative chromosome 3 from a t(3;8) translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3p deletion involved four pathogenic genes (CHL1, CNTN6, CNTN4,
      ITPR1) associated with cognitive impairment, ataxia, and motor
      dysfunction.
    explanation: >-
      Records this gene among the deleted set in a patient with the
      neurodevelopmental phenotype.
- name: SETD5
  notes: >-
    SET domain containing 5, at 3p25.3, inside the 124 kb interval shared by the
    smallest interstitial deletions that cause intellectual disability. De novo
    truncating point variants in this gene alone reproduce the core of the
    microdeletion 3p25.3 phenotype and are curated in the KB as a separate
    entity.
  gene_term:
    preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Contributes the intellectual disability and facial dysmorphism core;
    intragenic loss-of-function variants reproduce it in isolation.
  evidence:
  - reference: PMID:25138099
    reference_title: "Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome analysis revealed de novo intragenic variants in SET
      domain-containing 5 (SETD5) in two patients.
    explanation: >-
      Identifies intragenic de novo variants in this gene as a cause of the
      shared phenotype.
- name: BRPF1
  notes: >-
    Bromodomain and PHD finger containing 1, at 3p25.3. Scaffold of the MOZ,
    MORF and HBO1 histone acetyltransferase complexes. Its deletion in
    3p- syndrome was described as a distinguishing finding because earlier
    reports of the syndrome rarely mentioned it. Point variants in this gene cause a
    separate intellectual disability and ptosis syndrome, curated separately in
    the KB.
  gene_term:
    preferred_term: BRPF1
    term:
      id: hgnc:14255
      label: BRPF1
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Contributes intellectual disability and the eyelid and craniofacial
    component through loss of histone acetyltransferase complex scaffolding.
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene microarray analysis showed a 10.095 Mb deletion in the 3p26.3-p25.3
      region, resulting in a heterozygous mutation of the BRPF1 gene; thus, the
      patient was diagnosed with 3p deletion syndrome.
    explanation: >-
      Documents heterozygous deletion of this gene in a patient with the
      syndrome.
- name: SRGAP3
  notes: >-
    SLIT-ROBO Rho GTPase activating protein 3, also known as MEGAP, at 3p25.3.
    A microarray series of 14 patients mapped the intellectual disability
    critical region to an approximately 1 Mb interval containing this gene and
    explicitly placed CHL1, CNTN4, LRRN1 and ITPR1 outside it, which is the
    principal counter-proposal to the adhesion molecule account.
  gene_term:
    preferred_term: SRGAP3
    term:
      id: hgnc:19744
      label: SRGAP3
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Proposed as the major determinant of the intellectual disability component
    by deletion mapping; contested.
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that current evidence suggests that SRGAP3 is the major
      determinant of mental retardation in distal 3p deletions.
    explanation: >-
      States the authors' conclusion that this gene carries the intellectual
      disability phenotype.
- name: ATP2B2
  notes: >-
    ATPase plasma membrane calcium transporting 2, encoding PMCA2, at 3p25.3.
    Sits inside the 1.38 Mb hearing loss locus defined by audiometry against
    deletion extent. Whether losing this gene alone accounts for the hearing
    loss is disputed between two of the cited papers.
  gene_term:
    preferred_term: ATP2B2
    term:
      id: hgnc:815
      label: ATP2B2
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Leading candidate for the sensorineural hearing loss component; necessity
    supported, sufficiency contested.
  evidence:
  - reference: PMID:17208398
    reference_title: "3p-- syndrome defines a hearing loss locus in 3p25.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the ATP2B2 gene is located in 3p25.3, and haploinsufficiency of
      the mouse homolog results in SNHL with similar severity.
    explanation: >-
      Places the gene in the mapped locus and states the dosage argument.
  - reference: PMID:17696125
    reference_title: "Distal 3p deletion syndrome: detailed molecular cytogenetic and clinical characterization of three small distal deletions and review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We can also conclude that deletion of the gene ATP2B2 alone is not enough
      to cause hearing impairment, which is frequently found in patients with 3p
      deletion.
    explanation: >-
      Contradicts the claim that loss of this gene alone accounts for the
      hearing loss, in patients whose deletions removed it without hearing
      impairment.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our findings indicate a monogenic cause of hearing impairment in cases
      with loss-of-function variants of ATP2B2.
    explanation: >-
      Evidence from outside this syndrome that one lost copy of the gene is
      sufficient for deafness in humans. Indirect because the alleles are
      truncating point variants rather than a contiguous deletion, and the
      patients do not have this syndrome.
- name: SLC6A1
  notes: >-
    Solute carrier family 6 member 1, encoding the GABA transporter GAT-1, at
    3p25.3. Adjacent to SLC6A11. Sequence variants in this gene cause a separate
    neurodevelopmental disorder curated elsewhere in the KB.
  gene_term:
    preferred_term: SLC6A1
    term:
      id: hgnc:11042
      label: SLC6A1
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Contributes the epilepsy and EEG component through reduced GABA reuptake.
  evidence:
  - reference: PMID:40517887
    reference_title: "Epileptic seizures and EEG findings in 3p deletion syndrome involving SLC6A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous reports have highlighted the significance of deletions within the
      3p25.3 region contributing to the development of Angelman-like features,
      such as stereotypic movements, a happy demeanor, epilepsy, and
      characteristic electroencephalogram (EEG) patterns.
    explanation: >-
      Ties the epilepsy and EEG signature to deletions of the band containing
      this gene.
- name: SLC6A11
  notes: >-
    Solute carrier family 6 member 11, encoding the GABA transporter GAT-3,
    immediately adjacent to SLC6A1 at 3p25.3. Deleted together with it by the
    recurring proximal microdeletion.
  gene_term:
    preferred_term: SLC6A11
    term:
      id: hgnc:11044
      label: SLC6A11
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Co-deleted with SLC6A1; both transporters show reduced GABA uptake when
    hemizygous.
  evidence:
  - reference: PMID:39923323
    reference_title: "4-Phenylbutyrate restored GABA uptake, mitigated seizures in SLC6A1 and SLC6A11 microdeletions/3p- syndrome: From cellular models to human patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional characterization was conducted using 3H-labeled GABA uptake
      assays and Western blotting in HEK293T cells, comparing haploinsufficient
      and missense variant models.
    explanation: >-
      Describes the assay by which the haploinsufficient state of both
      transporters was characterised.
- name: CRELD1
  notes: >-
    Cysteine rich with EGF like domains 1, at 3p25. The first gene implicated in
    isolated atrioventricular septal defect, and therefore the functional
    candidate for the cardiac component. Note that the later mapping study
    narrowed the cardiac critical region between D3S1263 and D3S3594 and
    excluded several previously favoured candidates, so this gene remains a
    candidate on function rather than a confirmed contributor in patients with
    the syndrome.
  gene_term:
    preferred_term: CRELD1
    term:
      id: hgnc:14630
      label: CRELD1
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Candidate for the atrioventricular septal defect component on the strength
    of its role in isolated AVSD.
  evidence:
  - reference: PMID:12632326
    reference_title: "Missense mutations in CRELD1 are associated with cardiac atrioventricular septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CRELD1 is the first human gene to be implicated in the pathogenesis of
      isolated AVSD and AVSD in the context of heterotaxy, which provides an
      important step in unraveling the pathogenesis of AVSD.
    explanation: >-
      Establishes the gene as a cause of the same cardiac lesion when disrupted
      outside this syndrome.
- name: VHL
  notes: >-
    Von Hippel-Lindau tumour suppressor, at 3p25.3. Removed by deletions that
    extend far enough proximally. The result is a constitutional first hit at
    the locus, without the germline point variants that define von Hippel-Lindau
    disease.
  gene_term:
    preferred_term: VHL
    term:
      id: hgnc:12687
      label: VHL
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  association: >-
    Confers a constitutional first hit at a tumour suppressor locus; one
    hemangioblastoma has been reported.
  evidence:
  - reference: PMID:17696125
    reference_title: "Distal 3p deletion syndrome: detailed molecular cytogenetic and clinical characterization of three small distal deletions and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletions were 10.2-11 Mb in size and encompassed 47-51 known genes,
      including the VHL gene.
    explanation: >-
      Documents inclusion of the tumour suppressor in typical deletions.
prevalence:
- population: Worldwide, published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists. Case counts in
    the recent literature are given as fewer than 60 or fewer than 100 reported
    patients worldwide; a 2021 review assembled 29 well-documented cases from
    the Chinese and international literature. These are counts of the published
    record, and they are certainly an undercount, since small distal deletions
    can be clinically silent and were invisible to conventional karyotyping.
  evidence:
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal deletion of chromosome 3p25-pter (3p- syndrome) (OMIM #613792) is a
      rare monosomal disorder with fewer than 60 reported cases worldwide.
    explanation: >-
      Gives the reported case count and confirms the OMIM identifier.
  - reference: PMID:36374187
    reference_title: "Lacrimal drainage anomalies in 3p deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are less than a hundred reported cases worldwide.
    explanation: >-
      The higher of the two published case counts, from a 2024 report.
progression:
- phase: Prenatal and neonatal
  notes: >-
    Where a deletion is large, the imbalance is often first suspected on
    amniocentesis performed for another reason, or at birth from low birth
    weight and dysmorphism. Prenatal ultrasound can be entirely unremarkable
    even with a 9.29 Mb deletion, so imaging does not exclude it.
  evidence:
  - reference: PMID:23040932
    reference_title: "Pure partial monosomy 3p (3p25.3 → pter): prenatal diagnosis and array comparative genomic hybridization characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal ultrasonography findings were unremarkable.
    explanation: >-
      Records normal prenatal imaging in a fetus with a large distal 3p
      deletion.
- phase: Infancy
  notes: >-
    Most patients present in the first year, typically with feeding difficulty,
    hypotonia, failure to gain weight, and delayed milestones. In the pooled
    review of 29 cases, 19 had onset within the first year and four died within
    three months of birth.
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As shown, 19 cases had an onset within 1 year of age, and four pediatric
      patients died within 3 months of birth.
    explanation: >-
      Gives the age at onset and the early mortality in the pooled series.
- phase: Childhood and beyond
  notes: >-
    Survival into adult life is the rule for those who survive infancy, with
    persistent intellectual disability and motor impairment. Structured
    rehabilitation produces measurable gains. The published series record
    survival for most reported patients.
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After more than 2 months of rehabilitation training, the child showed
      significant growth and progress with their physical responses.
    explanation: >-
      Documents the response to rehabilitation over the medium term in a
      followed case.
diagnosis:
- name: Chromosomal microarray analysis
  description: >-
    The primary diagnostic test. Array CGH or SNP array defines the deletion
    breakpoints to the kilobase and therefore its gene content, which is what
    determines the surveillance and counselling that follow. Resolution matters:
    deletions of a few hundred kilobases and small interstitial deletions are
    invisible to conventional cytogenetics and were missed before arrays were
    routine.
  evidence:
  - reference: PMID:41384039
    reference_title: "Case Report: developmental delay and intellectual disability linked to a maternally inherited derivative chromosome 3 from a t(3;8) translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal microarray analysis first identified a 7.12 Mb deletion in
      3p26.3-p26.1 and a 48.86 Mb duplication in 8q22.1-q24.3, and findings were
      further characterized by whole genome sequencing and manual structural
      interpretation.
    explanation: >-
      Microarray as the first-line test that made the diagnosis.
  - reference: PMID:18837054
    reference_title: "Molecular characterization of a patient with 3p deletion syndrome and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fine mapping of this rearrangement using fluorescence in situ
      hybridization (FISH) and array-based comparative genomic hybridization
      (aCGH) revealed an unbalanced abnormality including a 4.5 Mb terminal
      deletion of chromosome 3p, telomeric to ITPR1 on 3p26.2, which was not
      previously identified with routine cytogenetic analysis.
    explanation: >-
      Documents a deletion that conventional cytogenetics missed and the array
      resolved.
- name: Karyotype analysis
  description: >-
    Still informative for large deletions and, more importantly, for detecting
    a rearrangement that an array cannot see. An array reports copy number only,
    so a balanced translocation, an inversion or a complex rearrangement
    underlying the imbalance is invisible to it.
  evidence:
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis was made by karyotyping, followed by a literature
      investigation and in silico bioinformatic analysis about the possible
      candidate genes associated with congenital heart defects or hypoplastic
      left heart syndrome in 3p- syndrome.
    explanation: >-
      A case diagnosed by karyotype alone.
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of other forms of mutations, including point mutations,
      inversions, or translocations, requires other tests, such as chromosomal
      karyotyping.
    explanation: >-
      States the specific gap that karyotyping fills next to microarray.
- name: Fluorescence in situ hybridization
  description: >-
    Used to confirm an array finding, to establish whether the subtelomere is
    retained and hence whether the deletion is terminal or interstitial, and to
    test parents rapidly for the same imbalance.
  evidence:
  - reference: PMID:11977162
    reference_title: "Molecular cytogenetic characterization of a subtle interstitial del(3)(p25.3p26.2) in a patient with deletion 3p syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluorescence in situ hybridization (FISH) studies using 3p subtelomeric
      probes confirmed the terminal region of chromosome 3 was present.
    explanation: >-
      FISH distinguishing an interstitial from a terminal deletion.
- name: Parental cytogenetic testing
  description: >-
    Required, not optional. Either parent may carry a balanced rearrangement
    that will recur in future pregnancies, or the same deletion without a
    phenotype. Both situations have been documented and each changes the
    recurrence risk given at counselling.
  evidence:
  - reference: PMID:39004488
    reference_title: "Prenatal diagnosis of familial 3p26.3p25.3 deletion in a pregnancy associated with a favorable fetal outcome and asymptomatic carrier parent and family members in three generations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetic analysis of parental bloods revealed a karyotype of
      46,XX,del (3) (p25.3) in the mother and 46,XY in the father.
    explanation: >-
      Parental testing identifying an asymptomatic carrier mother.
  - reference: PMID:34056867
    reference_title: "CHL1 deletion is associated with cognitive and language disabilities - Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parental follow-up revealed the deletion as maternal in origin.
    explanation: >-
      A second instance of an inherited deletion identified only by testing the
      parents.
- name: Electroencephalography
  description: >-
    Indicated where the deletion includes the SLC6A1 and SLC6A11 interval, or
    where there are paroxysmal events. The pattern reported in that subgroup is
    generalised high-amplitude slow waves closely resembling the Angelman
    syndrome EEG, and interictal epileptiform discharges may be present without
    clinical seizures.
  evidence:
  - reference: PMID:40517887
    reference_title: "Epileptic seizures and EEG findings in 3p deletion syndrome involving SLC6A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, larger deletions beyond the sSRO were linked to
      dysmorphological features of 3p-syndrome, generalized tonic-clonic
      seizure, and non-specific EEG findings.
    explanation: >-
      Records that the EEG signature differs by deletion extent, which is what
      makes the test informative about gene content.
- name: Audiometric assessment
  description: >-
    Formal hearing testing is warranted in every patient. Newborn hearing
    screening has been failed repeatedly by patients later shown to have the
    deletion, and behavioural testing can be uninterpretable in a child with
    intellectual disability, so objective testing is the reliable route.
  evidence:
  - reference: PMID:17208398
    reference_title: "3p-- syndrome defines a hearing loss locus in 3p25.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral, sensorineural hearing loss (SNHL) has been found in some but
      not all cases, suggesting the possibility that it is due to loss of a
      critical gene in band 3p25.
    explanation: >-
      Establishes that hearing loss is present in only a subset, so testing
      cannot be inferred from the diagnosis alone.
treatments:
- name: Early Developmental Intervention and Rehabilitation
  description: >-
    The mainstay of management, since there is no treatment directed at the
    deletion. A structured programme combining gross and fine motor training,
    postural control and social skills work produces measurable gains, and
    reported children acquired turning, sitting, standing and reaching over
    weeks to months of training.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: early developmental intervention
    term:
      id: NCIT:C159524
      label: Early Intervention
  target_mechanisms:
  - target: Global developmental delay
    description: >-
      Habilitative rather than mechanistic: the intervention acts on the
      developmental outcome, not on the gene dosage that produced it.
  - target: Motor delay
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been shown that early rehabilitation therapy and other therapeutic
      interventions can improve the quality of life of children with this
      chromosome abnormality.
    explanation: >-
      States the benefit of early rehabilitation in this syndrome.
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After more than 12 days of rehabilitation, the responses had improved, and
      the patient could turn over, clap his hands, chase people and objects,
      grasp objects, sit up for more than half an hour, and stand for around 3
      min.
    explanation: >-
      Records the specific functional gains achieved in a treated case.
- name: Physical Therapy
  description: >-
    Directed at hypotonia, delayed gross motor milestones and, where present,
    spasticity. The benefit is not uniform: in a sibling pair with a 3p26.3 to
    3p26.1 deletion, diminished strength did not improve with physical therapy,
    which is recorded here rather than smoothed over.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Hypotonia
  - target: Motor delay
  evidence:
  - reference: PMID:41384039
    reference_title: "Case Report: developmental delay and intellectual disability linked to a maternally inherited derivative chromosome 3 from a t(3;8) translocation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      neither sibling’s weakness improved with physical therapy
    explanation: >-
      Two siblings in whom the motor deficit did not respond to physical
      therapy, qualifying the expected benefit. The observation is weaker than
      it reads: it is two patients, uncontrolled, and both carry a 48.86 Mb
      8q22.1-q24.3 duplication spanning 193 genes alongside the 3p26.3-p26.1
      deletion, so the non-response is not cleanly attributable to the 3p loss.
      It is recorded because a negative therapeutic result is worth carrying,
      not because it settles the question.
- name: Speech and Language Therapy
  description: >-
    Language is disproportionately affected, and is the phenotype most
    consistently present even in the smallest terminal deletions, so speech and
    language input is indicated in essentially every patient.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Delayed speech and language development
  evidence:
  - reference: PMID:34056867
    reference_title: "CHL1 deletion is associated with cognitive and language disabilities - Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHL1 microdeletion syndrome as a cause for language and cognitive delay,
      sometimes accompanied by a constellation of other neurologic issues such
      as seizures, deficits in other developmental domains, and postnatal
      microcephaly should become a more recognized entity among developmental
      pediatricians, geneticists, and child neurologists.
    explanation: >-
      Establishes language delay as the recognised target requiring
      developmental specialist input.
- name: Occupational Therapy
  description: >-
    Fine motor skills, feeding and adaptive function. Reported programmes
    combine it with physical therapy rather than running it separately.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  target_mechanisms:
  - target: Motor delay
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatment the patient was given consisted of a comprehensive
      rehabilitation program, which included large joint loosening training,
      Brunstrom training, exercise system training, head control and climbing
      strength training, four-point kneeling and one knee kneeling, and sitting
      training.
    explanation: >-
      Describes the combined functional training programme in a treated case.
- name: Surgical Repair of Congenital Heart Defect
  description: >-
    Standard cardiac surgical management applies where a septal or more complex
    lesion is present. The one detailed report in a patient with this deletion
    is at the severe end: a neonate with hypoplastic left heart syndrome
    underwent surgery on day 5 and died on day 6, which is the natural history of
    that lesion rather than a consequence of the deletion. No published series
    reports outcomes of atrioventricular septal defect repair in this syndrome
    specifically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac surgical procedure
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Atrioventricular canal defect
  evidence:
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical intervention was performed when the patient was 5 days old.
    explanation: >-
      The only detailed report of cardiac surgery in a patient with this
      deletion.
- name: Hearing Habilitation
  description: >-
    Amplification and aural habilitation for the bilateral moderate to severe
    sensorineural loss. The device term is carried as a qualifier because the
    treatment slot takes a clinical action rather than a piece of equipment; the
    action here is rehabilitation, and the device is the hearing aid. Cochlear
    implantation has not been reported in this syndrome.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: aural rehabilitation with amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Sensorineural hearing impairment
  evidence:
  - reference: PMID:17208398
    reference_title: "3p-- syndrome defines a hearing loss locus in 3p25.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compared auditory test results with fine deletion mapping in seven
      previously unreported 3p-- syndrome patients and identified a 1.38Mb
      region in 3p25.3 in which deletions were associated with moderate to
      severe, bilateral SNHL.
    explanation: >-
      Establishes the severity of the hearing loss that habilitation must
      address; no trial of amplification in this syndrome has been published.
- name: Antiseizure Pharmacotherapy
  description: >-
    Conventional antiseizure medication for the epilepsy, which in the SLC6A1
    deletion subgroup is myoclonic or absence in semiology. Levetiracetam was
    used in a reported infant with a CHL1 deletion who presented with focal
    seizures and was successfully weaned once seizure-free.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_mechanisms:
  - target: Seizure
  evidence:
  - reference: PMID:34056867
    reference_title: "CHL1 deletion is associated with cognitive and language disabilities - Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      left temporal seizures confirmed on long term video EEG monitoring
      manifesting clinically as episodes of tachycardia followed by apnea and
      desaturations that resolved with lorazepam and initiation of
      levetiracetam.
    explanation: >-
      Records the agent used and the seizure control achieved in a patient with
      a distal 3p deletion.
- name: 4-Phenylbutyrate
  description: >-
    Investigational and mechanism-directed, the only treatment in this entry
    that is aimed at a specific deleted gene product rather than at the
    resulting disability. It was developed for SLC6A1 missense variants, where
    it acts as a chemical chaperone rescuing transporter trafficking, and was
    extended to two patients whose 3p deletion removes one copy of SLC6A1 and
    SLC6A11 on the strength of the shared functional deficit. The reported
    effect is partial: epileptiform discharges fell moderately and motor
    function improved, while cognitive impairment persisted. Two patients, open
    label, no control.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-phenylbutyrate
      term:
        id: CHEBI:41500
        label: 4-phenylbutyric acid
  target_mechanisms:
  - target: Reduced GABA Transporter-Mediated Reuptake
    description: >-
      Acts on the transport deficit itself rather than downstream of it, which
      is why the reported readout is GABA uptake as well as seizure frequency.
  evidence:
  - reference: PMID:39923323
    reference_title: "4-Phenylbutyrate restored GABA uptake, mitigated seizures in SLC6A1 and SLC6A11 microdeletions/3p- syndrome: From cellular models to human patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-treatment EEGs showed a moderate reduction in epileptiform discharges
      following PBA administration, and patients exhibited improved motor
      function. However, varying degrees of cognitive impairments persisted.
    explanation: >-
      Gives the observed effect and its limits in the two treated patients.
  - reference: PMID:39923323
    reference_title: "4-Phenylbutyrate restored GABA uptake, mitigated seizures in SLC6A1 and SLC6A11 microdeletions/3p- syndrome: From cellular models to human patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment with PBA may provide therapeutic benefits, particularly for
      addressing seizures and motor deficits, though further exploration of
      PBA's long-term effects in patients with 3p- syndrome is warranted.
    explanation: >-
      The authors' own statement of how provisional the recommendation is.
- name: Lacrimal Drainage Surgery
  description: >-
    Reported once, for proximal lacrimal drainage anomalies causing epiphora in
    a patient with the syndrome. Membranotomy with punctal and canalicular
    dilatation resolved the symptom completely. Included because it is a
    documented, effective intervention for a manifestation that had not
    previously been described in this syndrome at all.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lacrimal drainage surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Epiphora
    description: >-
      Relieves the obstruction mechanically. It addresses the symptom and not
      any part of the deletion, which is true of every treatment in this entry.
  evidence:
  - reference: PMID:36374187
    reference_title: "Lacrimal drainage anomalies in 3p deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was successfully managed with membranotomy and punctal and
      canalicular dilatation, resulting in a complete resolution of epiphora.
    explanation: >-
      Records the procedure and its outcome in the one reported case.
- name: Genetic Counseling
  description: >-
    Counselling turns on two facts that cannot be assumed. First, the recurrence
    risk depends entirely on whether a parent carries a balanced rearrangement,
    so parental karyotyping is part of the counselling and not an optional
    extra. Second, the same deletion can be clinically silent, which has been
    documented across three generations of one family, so a deletion found
    prenatally does not by itself predict an affected child.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_mechanisms:
  - target: Heterozygous Distal 3p25-pter Deletion
    description: >-
      Addresses the lesion at the level of transmission risk rather than by
      modifying it.
  evidence:
  - reference: PMID:23040932
    reference_title: "Pure partial monosomy 3p (3p25.3 → pter): prenatal diagnosis and array comparative genomic hybridization characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aCGH and QF-PCR help to delineate the genomic imbalance in prenatally
      detected de novo chromosome aberration, and the information acquired is
      useful for genetic counseling.
    explanation: >-
      States the role of precise breakpoint definition in counselling.
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we reinforce the importance of cytogenetic investigation in patients
      with hypoplastic hearts and dysmorphia, assisting in diagnosis, definition
      of prognosis, and genetic counseling for the family.
    explanation: >-
      Links cytogenetic characterisation to prognosis and family counselling.
animal_models:
- name: CHL1-deficient mouse
  species: Mouse
  genotype: Chl1 null (homozygous targeted deletion)
  publication: PMID:12391163
  description: >-
    A constitutive Chl1 knockout, generated explicitly because the human gene is
    a candidate for the mental impairment of 3p- syndrome. It provides the
    cellular account of what losing this adhesion molecule does to axonal
    wiring: mossy fibre disorganisation in the hippocampus and misrouted
    olfactory sensory axons, with altered behaviour in novel environments and
    altered immediate early gene responses to novel versus familiar stimuli.
  modeled_mechanisms:
  - target: Impaired Neuronal Cell Adhesion and Axon Guidance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the axon guidance and connectivity defect that this node
      asserts, and does so in the tissue the node names.
    limitations: >-
      The mouse is homozygous null while patients are heterozygous for a
      deletion, so the model represents complete loss of the gene product rather
      than the halved dosage the human lesion produces. It also isolates one
      gene, whereas a patient's terminal deletion removes CHL1, CNTN6 and CNTN4
      together with everything else in the interval. The behavioural phenotypes
      are subtle relative to the anatomical defects; a review of the three
      paralogues proposes mutual compensation as the explanation, which if
      correct means a single knockout systematically understates what losing the
      cluster does.
    readouts:
    - name: Hippocampal mossy fibre organisation and olfactory axon projection
      target: Impaired Neuronal Cell Adhesion and Axon Guidance
      direction: ALTERED
      interpretation: >-
        Anatomical correlate of the axon guidance defect this node asserts.
      evidence:
      - reference: PMID:12391163
        reference_title: "Misguided axonal projections, neural cell adhesion molecule 180 mRNA upregulation, and altered behavior in mice deficient for the close homolog of L1."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          At the morphological level, these mice showed alterations of
          hippocampal mossy fiber organization and of olfactory axon
          projections.
        explanation: >-
          Reports the anatomical measurement in the knockout.
    - name: Immediate early gene response to novel versus familiar stimuli
      target: Impaired Neuronal Cell Adhesion and Axon Guidance
      direction: ALTERED
      interpretation: >-
        Functional readout indicating that the miswired network processes
        novelty differently.
      evidence:
      - reference: PMID:12973829
        reference_title: "Aberrant neuronal connectivity in CHL1-deficient mice is associated with altered information processing-related immediate early gene expression."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our results indicate that, in contrast to controls, CHL1-deficient
          mice might process novel and familiar information similarly and
          suggest that the altered neuronal connectivity in these mutants
          disturbs information processing at the molecular level.
        explanation: >-
          Reports the functional consequence of the connectivity defect.
    evidence:
    - reference: PMID:12391163
      reference_title: "Misguided axonal projections, neural cell adhesion molecule 180 mRNA upregulation, and altered behavior in mice deficient for the close homolog of L1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In humans, CHL1 (also referred to as CALL) is a candidate gene for
        3p- syndrome-associated mental impairment.
      explanation: >-
        The authors' own statement that the model was made for this disease
        question, which is what makes it informative for this node.
- name: Deafwaddler heterozygous mouse
  species: Mouse
  genotype: Atp2b2 dfw-2J/+ and dfw-3J/+ heterozygous functional null
  publication: PMID:15350283
  description: >-
    The single most transferable model in this entry, because its genotype
    matches the human lesion: one functional null allele of Atp2b2 against a
    normal one, on a good-hearing CBA/CaJ background. Heterozygotes for either
    functional null allele had highly significant hearing loss by auditory
    brainstem response, most marked above 24 kHz, and measurable ataxia on an
    accelerating rotarod. Heterozygotes for the partial loss-of-function dfw
    allele were indistinguishable from controls, so the effect is specific to
    complete loss of one copy.
  modeled_mechanisms:
  - target: Impaired Calcium Extrusion from Hair Cell Stereocilia
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Demonstrates that halving functional PMCA2 is by itself sufficient for
      sensorineural hearing loss, which is the dosage claim the human deletion
      makes.
    limitations: >-
      Mouse hearing extends far above the human range and the deficit was most
      marked above 24 kHz, so the affected frequency band does not map directly
      onto human audiometry. The model also isolates one gene, and the human
      hearing loss locus contains eighteen; the mouse therefore establishes
      sufficiency of this gene in mouse without settling the sufficiency
      question in patients, which is recorded separately as a controversy.
    readouts:
    - name: Auditory-evoked brainstem response hearing sensitivity
      target: Impaired Calcium Extrusion from Hair Cell Stereocilia
      direction: DECREASED
      interpretation: >-
        Elevated response thresholds in heterozygotes, that is, reduced hearing
        sensitivity, at the frequencies most dependent on the pump.
      evidence:
      - reference: PMID:15350283
        reference_title: "Haplo-insufficiency revealed in deafwaddler mice when tested for hearing loss and ataxia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Heterozygotes of either functional null allele displayed highly
          significant hearing loss by auditory-evoked brainstem responses
          relative to controls (P < 0.0001), particularly at high frequencies
          (> 24 kHz).
        explanation: >-
          Reports the measurement, its direction and its statistical support.
    evidence:
    - reference: PMID:17208398
      reference_title: "3p-- syndrome defines a hearing loss locus in 3p25.3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, the ATP2B2 gene is located in 3p25.3, and haploinsufficiency of
        the mouse homolog results in SNHL with similar severity.
      explanation: >-
        States why the mouse haploinsufficiency result is treated as informative
        for the human node.
differential_diagnoses:
- name: CHL1 microdeletion syndrome
  description: >-
    A terminal 3p26.3 deletion removing CHL1 alone, presenting with language
    delay and cognitive delay and sometimes microcephaly, seizures, dysmorphism
    and short stature. It is the same lesion class at the extreme distal end of
    the size range, and whether to call it 3p- syndrome is a size judgement
    rather than a mechanistic one. It is kept here rather than in has_subtypes
    because it lacks the growth, cardiac and craniofacial core that defines this
    entry.
  distinguishing_features:
  - >-
      Deletion under about 1 Mb confined to 3p26.3; no growth retardation, no
      cardiac defect, no hearing loss, and frequently an unaffected transmitting
      parent.
  evidence:
  - reference: PMID:34056867
    reference_title: "CHL1 deletion is associated with cognitive and language disabilities - Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All five published patients were heterozygous for this terminal deletion
      with one unaffected parent carrying the variant.
    explanation: >-
      Records the transmission pattern that separates this entity from the
      classical syndrome.
- name: SETD5 haploinsufficiency syndrome
  description: >-
    Intellectual disability with facial dysmorphism caused by intragenic
    loss-of-function variants in SETD5, curated separately in this knowledge
    base. It reproduces the core of the microdeletion 3p25.3 phenotype from a
    single gene and with no copy number change, so array testing is normal.
  disease_term:
    preferred_term: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
    term:
      id: MONDO:0014336
      label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
  distinguishing_features:
  - >-
      Normal chromosomal microarray; a sequence variant on exome or panel testing;
      no involvement of the neighbouring genes and therefore no hearing,
      cardiac or tumour-suppressor component.
  evidence:
  - reference: PMID:25138099
    reference_title: "Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present report of two SETD5 LoF variants in 301 patients demonstrates
      a prevalence of 0.7% and thus SETD5 variants as a relatively frequent
      cause of ID.
    explanation: >-
      Establishes the single-gene entity as a distinct and not uncommon cause of
      the shared phenotype.
- name: BRPF1-related intellectual disability
  description: >-
    Intellectual developmental disorder with dysmorphic facies and ptosis,
    caused by sequence variants in BRPF1 and curated separately here. It shares
    the ptosis and intellectual disability of the deletion syndrome without the
    rest.
  disease_term:
    preferred_term: intellectual developmental disorder with dysmorphic facies and ptosis
    term:
      id: MONDO:0015022
      label: intellectual developmental disorder with dysmorphic facies and ptosis
  distinguishing_features:
  - >-
      Normal microarray with a BRPF1 sequence variant; ptosis and intellectual
      disability without growth retardation, hearing loss or cardiac malformation.
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRPF1 deletion may lead to intellectual disability and abnormal facial
      features, such as ptosis
    explanation: >-
      States the phenotype attributable to this gene alone, which is the
      overlap that has to be distinguished.
- name: Hearing loss, autosomal dominant 82
  description: >-
    DFNA82, nonsyndromic dominant hearing loss caused by heterozygous
    loss-of-function variants in ATP2B2, curated separately in this knowledge
    base. It is the single-gene form of the auditory component of this
    syndrome, and it matters here for two reasons: it is what a deleted patient
    who has only hearing loss would be tested for, and it is the evidence that
    losing one copy of that gene is by itself enough to deafen a person.
  disease_term:
    preferred_term: hearing loss, autosomal dominant 82
    term:
      id: MONDO:0030719
      label: hearing loss, autosomal dominant 82
  distinguishing_features:
  - >-
      Normal microarray with a truncating or splice-site ATP2B2 sequence
      variant; hearing loss alone, with normal growth, development,
      craniofacial appearance and cardiac anatomy.
  - >-
      Newborn hearing screening is passed and the loss is detected only at
      about three to six years, whereas the hearing loss of this syndrome is
      one feature among many in a child already under investigation.
  evidence:
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After normal newborn hearing screening, a rapidly progressive
      high-frequency hearing impairment was diagnosed at the age of about 3-6
      years.
    explanation: >-
      Gives the age of detection that separates the isolated single-gene
      entity from the deletion syndrome in practice.
- name: Von Hippel-Lindau disease
  description: >-
    The classical tumour predisposition syndrome caused by germline VHL point
    variants. A patient with a 3p- deletion extending to 3p25.3 carries a
    constitutional first hit at the same locus, so the two share a genetic
    configuration without sharing a clinical course: VHL disease has no
    developmental phenotype, and 3p- syndrome only rarely produces a
    VHL-associated tumour.
  disease_term:
    preferred_term: von Hippel-Lindau disease
    term:
      id: MONDO:0008667
      label: von Hippel-Lindau disease
  distinguishing_features:
  - >-
      Normal development and normal growth; tumours as the presenting problem
      rather than an incidental late finding; a point variant rather than a
      contiguous deletion.
  evidence:
  - reference: PMID:26365017
    reference_title: "A case of 3p deletion syndrome associated with cerebellar hemangioblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She showed no other tumors associated VHL disease till 24 years old.
    explanation: >-
      Records that even where a VHL-associated tumour occurred, the wider
      tumour syndrome did not follow.
- name: Angelman syndrome
  description: >-
    Raised specifically by the SLC6A1 deletion subgroup, whose combination of
    stereotypic movements, a happy demeanour, epilepsy and generalised
    high-amplitude slow-wave EEG resembles Angelman syndrome closely enough that
    the resemblance has been proposed as a diagnostic prompt in the other
    direction.
  distinguishing_features:
  - >-
      Angelman syndrome has a 15q11-q13 imprinting lesion; the resemblance is
      phenotypic and EEG-based, and chromosomal microarray separates them
      immediately.
  evidence:
  - reference: PMID:40517887
    reference_title: "Epileptic seizures and EEG findings in 3p deletion syndrome involving SLC6A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous reports have highlighted the significance of deletions within the
      3p25.3 region contributing to the development of Angelman-like features,
      such as stereotypic movements, a happy demeanor, epilepsy, and
      characteristic electroencephalogram (EEG) patterns.
    explanation: >-
      States the phenotypic overlap that makes this the relevant differential
      for that subgroup.
discussions:
- discussion_id: vhl_tumour_surveillance_in_3p_deletion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What tumour surveillance, if any, should a patient whose 3p deletion removes
    VHL receive, given that the risk conferred by a constitutional first hit at
    that locus has never been quantified in this population?
  attaches_to:
  - pathophysiology#Latent Second-Hit Tumor Susceptibility
  - genetic#VHL
  - phenotypes#Hemangioblastoma
  rationale: >-
    The genetics make the question unavoidable. A deletion reaching 3p25.3
    leaves one VHL allele in every cell, which is the same configuration a
    person with germline von Hippel-Lindau disease carries, and the 1994
    breakpoint study explicitly framed identifying deleted patients as a
    management benefit, recommending that they be recognised as at risk.

    What is missing is a numerator and a denominator. The two 1990s series that
    identified deleted patients reported no VHL disease in any of them. A single
    cerebellar hemangioblastoma has since been reported, resected at age 16 in a
    woman with a de novo p25 deletion, with no other VHL-associated tumour by
    age 24; that report recommends repeat imaging for patients with this
    syndrome. One realised tumour across the whole reported literature is
    consistent with a risk anywhere from negligible to substantially elevated,
    because nobody has followed a defined cohort of deleted patients
    prospectively.

    Three things would have to be settled before a protocol could be written.
    Whether the risk is materially lower than in classical VHL disease, which
    would be biologically plausible if the deletion removes flanking material
    that the second-hit mechanism needs or if patients are ascertained and die
    too early to reach the tumour age range. Whether the deletion type matters,
    since a large deletion removing both VHL and its neighbours is not obviously
    equivalent to a point variant. And what the harms of imaging a child with
    severe intellectual disability under repeated sedation are, which is a real
    cost that a risk figure alone does not settle. Note also the ascertainment
    asymmetry: patients with this syndrome have severe disability and are
    followed for that, so an asymptomatic renal or retinal lesion would be
    found late or not at all, which biases the published count downward.
  evidence:
  - reference: PMID:7951234
    reference_title: "Molecular genetic analysis of the 3p- syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that molecular analysis of 3p- syndrome patients enhances
      the management of affected patients by identifying those at risk for VHL
      disease, and can be used to elucidate the critical regions for the
      3p- syndrome phenotype.
    explanation: >-
      The original recommendation that deleted patients be identified as at
      risk, made without any risk estimate attached.
  - reference: PMID:26365017
    reference_title: "A case of 3p deletion syndrome associated with cerebellar hemangioblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeat imaging studies were recommended for the patients with 3p deletion
      syndrome.
    explanation: >-
      A surveillance recommendation issued on the strength of one case, which
      is the whole of the evidence base for it.
- discussion_id: which_gene_drives_intellectual_disability
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Which deleted gene or genes account for the intellectual disability of
    3p- syndrome, when four separate mapping efforts have named four different
    candidates from overlapping patient sets?
  attaches_to:
  - pathophysiology#Impaired Neuronal Cell Adhesion and Axon Guidance
  - pathophysiology#Disrupted Chromatin-Mediated Transcriptional Regulation in Neurodevelopment
  - phenotypes#Intellectual disability
  rationale: >-
    The candidates are not variants of one proposal. The 3p26.3 adhesion
    molecule account rests on a translocation that disrupts CNTN4 without
    deleting anything and on deletions confined to CHL1; a complex-rearrangement
    analysis narrowed the critical segment to CNTN4 and CRBN with CHL1 as an
    additional contributor; a 14-patient SNP array series placed the critical
    region around SRGAP3 and explicitly put CHL1, CNTN4, LRRN1 and ITPR1 outside
    it; and the interstitial-deletion series converge on a 124 kb interval
    containing SETD5, which de novo truncating variants in that gene alone then
    confirmed. BRPF1 was later added from a case whose deletion removed it.

    Two things make this more than a dispute over which paper is right. The
    first is that the candidates are 8 Mb apart and in different functional
    classes, cell surface adhesion at one end and chromatin regulation at the
    other, so they are not competing descriptions of one lesion. The second is
    that the method itself does not distinguish "this gene causes it" from "this
    gene is in the smallest deletion anybody has reported": critical-region
    mapping over a series of deletions of differing extent identifies where the
    reported breakpoints happen to cluster, and the answer moves each time a
    smaller deletion is published, which is what the sequence of papers here
    shows.

    The likeliest resolution is that the question is malformed. Distal 3p
    contains several independently dosage-sensitive neurodevelopmental genes,
    each sufficient on its own to produce intellectual disability, and this
    entry models it that way, with separate nodes for the adhesion molecule and
    chromatin branches converging on one phenotype. That is a modelling
    decision, not a finding, and it would be settled properly by deep
    phenotyping across a cohort stratified by breakpoint rather than by another
    critical-region paper.
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assuming complete penetrance, a candidate critical region for a CHD
      susceptibility gene was refined to approximately 200 kb and a candidate
      critical region for mental retardation was mapped to an approximately 1 Mb
      interval containing SRGAP3 but other 3p neurodevelopmental genes including
      CHL1, CNTN4, LRRN1, and ITPR1 mapped outside the candidate critical
      interval.
    explanation: >-
      One of the four competing mapping results, and the one that explicitly
      excludes the adhesion molecule candidates.
  - reference: PMID:17036314
    reference_title: "FISH and array-CGH analysis of a complex chromosome 3 aberration suggests that loss of CNTN4 and CRBN contributes to mental retardation in 3pter deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that 3p- syndrome associated features are primarily caused by
      loss of CNTN4 and CRBN, with loss of CHL1 probably having an additional
      detrimental effect on the cognitive functioning of the present patient.
    explanation: >-
      A second mapping result naming a different pair of genes.
  - reference: PMID:25138099
    reference_title: "Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six patients presented with ID and certain facial dysmorphisms,
      suggesting that SETD5 sequence variants contribute substantially to the
      microdeletion 3p25.3 phenotype.
    explanation: >-
      The strongest single result, because it removes the confound of
      neighbouring genes entirely.
- discussion_id: atp2b2_sufficiency_for_hearing_loss
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is haploinsufficiency of ATP2B2 by itself sufficient to cause the
    sensorineural hearing loss of 3p- syndrome, or does the hearing loss locus
    require loss of a neighbouring gene as well?
  attaches_to:
  - pathophysiology#ATP2B2 Haploinsufficiency
  - genetic#ATP2B2
  - phenotypes#Sensorineural hearing impairment
  rationale: >-
    Two papers published in the same year reach opposite conclusions from
    patients with this syndrome, and both arguments are sound on their own
    terms.

    For sufficiency: fine deletion mapping against audiometry in seven patients
    defined a 1.38 Mb interval in 3p25.3 whose deletion tracked with moderate to
    severe bilateral loss, the gene lies inside it, the pump was localised by
    immunohistochemistry to the stereocilia of human cochlear hair cells, and a
    mouse heterozygous for a functional null allele has significant hearing loss
    on the same dosage the human deletion produces. That is necessity plus a
    mechanism plus a matched-genotype animal result.

    Against: a series of three patients with 10.2 to 11 Mb deletions
    encompassing the gene concluded that its deletion alone is not enough,
    which is a negative observation of exactly the kind that a positive
    correlation cannot absorb. Note the asymmetry between the two designs: the
    mapping study conditions on hearing loss and asks what is deleted, while the
    negative study conditions on the deletion and asks who has hearing loss.
    Only the second can detect deleted patients with normal hearing.

    A third line of evidence arrived after both papers and from outside this
    syndrome. Heterozygous truncating and splice-site variants in the gene
    alone cause a nonsyndromic dominant deafness, DFNA82, curated separately in
    this knowledge base; that is a human demonstration that one lost copy of
    this gene is sufficient to deafen a person, which is what the mapping study
    argued and the negative series denied. It does not settle the dispute,
    because a whole-gene deletion in a contiguous-gene syndrome is not the same
    allele in the same context as a truncating point variant in an otherwise
    normal genome. What it does supply is a specific reason both observations
    could stand as reported: in DFNA82 newborn screening is passed and the loss
    is picked up only at about three to six years, so a deleted patient
    audiometered early enough would be recorded as hearing normally.

    Both can be true if the gene is necessary but not sufficient, with a modifier
    elsewhere, or if the loss is age-dependent or progressive and the
    unaffected patients were tested too early, or if there is a second locus in
    the eighteen-gene interval. Resolving it needs audiometry on a cohort
    stratified by breakpoint, with age at testing recorded, and none of the
    cited papers reports that. The KB records the dispute rather than picking a
    side, and the ATP2B2 genetic entry carries the negative result as a REFUTE
    evidence item beside the positive ones.
  evidence:
  - reference: PMID:17208398
    reference_title: "3p-- syndrome defines a hearing loss locus in 3p25.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although other genes in this region remain candidates, we conclude that
      haploinsufficiency of ATP2B2 is the most likely cause of SNHL in 3p--
      syndrome.
    explanation: >-
      The sufficiency claim, hedged by its own authors on the gene content of
      the interval.
  - reference: PMID:17696125
    reference_title: "Distal 3p deletion syndrome: detailed molecular cytogenetic and clinical characterization of three small distal deletions and review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We can also conclude that deletion of the gene ATP2B2 alone is not enough
      to cause hearing impairment, which is frequently found in patients with 3p
      deletion.
    explanation: >-
      The contradicting observation, from patients whose deletions removed the
      gene without producing the phenotype.
  - reference: PMID:30535804
    reference_title: "De novo and inherited loss-of-function variants of ATP2B2 are associated with rapidly progressive hearing impairment."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects had no balance complaints and vestibular testing did not yield
      abnormalities.
    explanation: >-
      From the single-gene entity that bears on the dispute. Recorded here for
      the phenotype boundary it draws, which is that isolated loss of this gene
      produces hearing loss without the vestibular involvement the mouse null
      shows, so the mouse dosage argument does not transfer whole.
- discussion_id: penetrance_of_distal_3p_deletions
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why do some distal 3p deletions of several megabases produce no phenotype at
    all, and can the boundary between the penetrant and the silent be predicted
    from breakpoints?
  attaches_to:
  - inheritance#Autosomal dominant inheritance
  - pathophysiology#Haploinsufficiency of Dosage-Sensitive Distal 3p Genes
  rationale: >-
    An 8.59 Mb deletion of 3p26.3p25.3 removing fourteen OMIM genes including
    CHL1, CNTN6, CNTN4 and ITPR1 has been carried through three generations of
    one family with no phenotypic abnormality in any carrier, including a
    69-year-old woman and a child followed to age two and a half. That is not a
    subtle finding: it is a deletion of the same band, of a size that in other
    families produces the full syndrome, in people who are well.

    It has direct clinical force. A deletion found incidentally on prenatal
    array cannot be counselled from its coordinates alone, and the family above
    was advised to continue the pregnancy on exactly that reasoning. It also
    constrains the mechanism: whatever makes the syndrome penetrant is not
    simply the number of dosage-sensitive genes lost, since this family lost
    the genes that the adhesion molecule account holds responsible.

    Candidate explanations are unexamined in this literature. Whether the
    proximal boundary matters more than deletion size, so that these families
    stop just short of a genuinely critical segment. Whether allelic variation
    on the retained homologue determines penetrance. Whether ascertainment does
    the work, with mildly affected carriers found only when a severely affected
    relative brings the family to attention. Distinguishing these needs
    systematically phenotyped carrier families rather than reports of
    unaffected transmitting parents noted in passing, and that literature does
    not exist.
  evidence:
  - reference: PMID:39004488
    reference_title: "Prenatal diagnosis of familial 3p26.3p25.3 deletion in a pregnancy associated with a favorable fetal outcome and asymptomatic carrier parent and family members in three generations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the neonate was normal in development and showed no apparent phenotypic
      abnormality.
    explanation: >-
      Documents normal development in a child carrying a multi-megabase distal
      3p deletion.
  - reference: PMID:35306482
    reference_title: "[Genotype-phenotype correlation in a newborn with de novo 3p25 deletion syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, a few patients with normal or mild phenotype have also been
      described.
    explanation: >-
      Independent confirmation that non-penetrant and mildly affected carriers
      exist.
- discussion_id: mouse_knockout_dosage_and_paralogue_compensation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can a single-gene homozygous mouse knockout tell us what losing one copy of
    the whole 3p26.3 adhesion molecule cluster does to a child, when the mouse
    behavioural phenotypes are mild and paralogue compensation is the proposed
    reason?
  attaches_to:
  - pathophysiology#Impaired Neuronal Cell Adhesion and Axon Guidance
  - animal_models#CHL1-deficient mouse
  rationale: >-
    The mismatch runs in two directions at once, which is what makes it
    interesting rather than a routine caveat.

    On dosage, the model is more severe than the disease: the Chl1 mouse is
    homozygous null, while a patient is heterozygous for a deletion. A
    homozygous null should overstate the human lesion.

    On gene content, the model is less severe: a patient's terminal deletion
    removes CHL1, CNTN6 and CNTN4 together, three closely related
    immunoglobulin superfamily adhesion molecules with overlapping interactomes
    that act in the same axon guidance pathways. If they compensate for one
    another, then knocking out one and leaving two intact is a systematically
    weaker perturbation than deleting all three at half dosage.

    The observation that makes this concrete is the discrepancy the review
    reports: mouse models deficient for these molecules do not show strong
    axonal migration or behavioural deficits, in contrast to the pronounced
    neuritogenesis and axon guidance defects seen in vitro, and the review
    proposes exactly this compensation as the explanation. So the mouse is
    informative about what the protein does at the growth cone, and is a weak
    guide to how much of the human cognitive and language phenotype loss of the
    cluster accounts for. A compound heterozygous deletion of the three
    orthologues would be the experiment that settles it; it has not been done.
  evidence:
  - reference: PMID:33519384
    reference_title: "Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Notably, mouse models deficient for these neuronal IgCAMs do not display
      strong deficits in axonal migration or behavioral phenotypes, which is in
      contrast to the pronounced defects in neuritogenesis and axon guidance
      observed in vitro.
    explanation: >-
      States the discrepancy between the in-vivo mouse phenotype and the
      cellular defect.
  - reference: PMID:33519384
    reference_title: "Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This suggests that when CHL1, CNTN6, or CNTN4 function is disrupted by
      CNVs, other neuronal IgCAMs may suppress behavioral phenotypes by
      compensating for the loss of function.
    explanation: >-
      States the proposed compensation mechanism that would make a single
      knockout understate the effect of deleting the cluster.
notes: >-
  Lump/split. This is curated as one leaf disease entry, not a grouping. The
  reason is that there is a single initiating lesion, a heterozygous deletion of
  distal 3p, and the phenotypic variety is what that one lesion produces when
  the breakpoints fall in different places. Modelling it as a grouping would
  imply a union of distinct diseases, which would misdescribe the mechanism: the
  branches in the pathophysiology chain are not separate diseases, they are
  parallel consequences of the same lesion, and a single patient generally has
  several of them. Where a deleted gene independently causes a recognised
  single-gene disorder, that disorder is a separate KB entry and appears here in
  differential_diagnoses, not in has_subtypes. There are no subtypes. The three
  such entries are SETD5_Haploinsufficiency_Syndrome (MONDO:0014336),
  BRPF1-Related_Intellectual_Disability (MONDO:0015022) and
  Hearing_Loss_Autosomal_Dominant_82 (MONDO:0030719, ATP2B2). Each is cross
  referenced rather than restated: the mechanism of losing one of those genes
  is curated once, in its own entry, and what is recorded here is only what
  losing it contributes to this composite phenotype and how a reader tells the
  two apart. The DFNA82 entry also does work this one cannot, because it is
  the evidence that ATP2B2 haploinsufficiency alone deafens a human, which is
  the crux of the sufficiency dispute recorded in discussions.

  On relationship_type in the genetic section. Every gene is recorded as
  COOPERATING rather than CAUSATIVE. CAUSATIVE in this schema means variants in
  the gene are sufficient to cause the disease in a near-mendelian sense, and no
  single gene in this interval is sufficient for 3p- syndrome: each contributes
  one branch of a composite phenotype produced by losing them together. SETD5
  and CHL1 are the two where the case for CAUSATIVE could be made, because loss
  of either alone causes a recognised disorder; but those disorders are the
  separate entries listed in differential_diagnoses, not this one, so recording
  them as causative of this entry would blur exactly the distinction the entry
  is drawing.

  Frequencies. The percentages on phenotypes come from one 2021 literature
  review that pooled 29 well-documented published cases. They are statistics
  about the published record and not about the disease: they are subject to
  ascertainment bias in both directions, since severe cases are more likely to
  be reported and mild or silent carriers are found only incidentally. Where two
  sources disagree, both are recorded rather than averaged. The clearest case is
  congenital heart disease, given as about a third by the 1990s and 2000s
  mapping series and as 43 per cent by the 2021 review; both figures are carried
  on the atrioventricular canal defect phenotype with their own evidence items.

  A frequency source that could not be used. The Korean case series
  DOI:10.5734/JGM.2014.11.1.36, which the deep-research report cites and which a
  previous curation attempt had fetched, carries a phenotype frequency table
  (low birth weight 52.9 per cent, microcephaly 43.1 per cent, hypertelorism
  51.0 per cent, ptosis 31.4 per cent, growth and mental retardation 80.4 per
  cent, polydactyly 33.3 per cent, congenital heart disease 29.4 per cent,
  genitourinary anomalies 29.4 per cent). None of those numbers is cited here.
  The reference is DOI-keyed with no PubMed record, confirmed by querying the
  PMC ID converter, and its cached record has content_type unavailable with an
  empty body, so there is no cached text to quote exactly and nothing that
  either the fast snippet counter or the gating validator could check. Quoting
  it would have meant writing a snippet from a source this repository cannot
  verify. The comparable numbers from the 2021 review were used instead. Note
  separately that a DOI-keyed evidence item is in skip_prefixes and would not be
  snippet-checked by CI even had the body been present. Most of that ground is
  now covered from a source that can be quoted: the Orphanet record ORPHA:1620
  was cached during review and its HPO annotation table carries frequency bands
  for hypertelorism, cleft palate, cryptorchidism, sacral dimple, epicanthus,
  brachycephaly and high palate, so those phenotypes are graded against Orphanet
  rather than against the Korean series. The two sources do not always agree.
  Orphanet puts cleft palate in the 30 to 79 per cent band where the Korean
  series gives 7.8 per cent; the Orphanet band is the one carried, because it is
  the one that can be quoted, and the disagreement is recorded on the phenotype.

  The Orphanet record and how it was built. references_cache/ORPHA_1620.md was
  generated by just structured-rebuild-orphanet, never hand-written. It was not
  in the cache when this entry was first curated. Note that
  data/orphadata/MANIFEST.yaml was deliberately NOT repinned to obtain it:
  Orphanet has published a new release behind the same unversioned URL since the
  pinned 2025-12-09 snapshot, so the bulk XML this one file was built from is
  newer than the pin, while the manifest, and therefore the snapshot date the
  file prints in its Source section, still names the pinned release. Repinning
  is a repository-wide operation that rebuilds all 8,823 ORPHA cache files and
  belongs in its own change, not in a single disease curation. The next full
  rebuild will restate this file consistently with whatever release is pinned
  then.

  Phenotypes from the deep-research report that are still absent, and why.
  Synophrys and hypertrichosis were named in the report's narrative and are not
  curated here, for two different reasons.

  Synophrys is an evidence gap. Orphanet does not annotate it for this syndrome
  and it appears in none of the thirty cached references, so there is no exact
  quote to hang it on. It traces back to the same uncacheable Korean series as
  the percentages above. That is an absence of citable evidence, not a judgement
  that the finding is absent from the syndrome, and it closes as soon as a
  citable source is found.

  Hypertrichosis is a different case, and is deliberately not curated. It is
  quotable — PMID:41384039 records bilateral hypertrichosis (HP:0000990) in one
  of the two half-siblings — but the same paper attributes it to the wrong
  lesion. The sentence "Figure 3 shows that the selected genes are implicated in
  neurodevelopmental disorders, motor development delay, and hypertrichosis, all
  of which are observed in the patients" is about the 50 pathologically
  significant genes of the 48.86 Mb 8q22.1-q24.3 duplication, not about the 14
  genes of the 3p deletion. Recording hypertrichosis as a 3p- phenotype on that
  citation would assign to this syndrome a feature its only source assigns to a
  co-occurring duplication. Orphanet does not annotate it either.

  Trigonocephaly. The brief for this curation and the deep-research report both
  listed trigonocephaly among the craniofacial features, and none of the papers
  first fetched for this entry mentions it. It is retained because a 2024
  ophthalmology report on this syndrome lists it explicitly, and that paper is
  the citation carried on the phenotype. No frequency is given, because the
  literature describes it qualitatively and never counts it.

  Corrections to the deep-research report. The Perplexity sonar-deep-research
  report for this entry cites no PMIDs or DOIs at all; its citation list is
  fifteen web pages, chiefly MedlinePlus, OMIM, Orphanet, NORD, Wikipedia and
  ClinVar, and its own reference-validation section records "No PMID or DOI
  references were found in this report". Every reference in this entry was
  therefore located independently through PubMed rather than taken from the
  report, and the report was used for orientation only.

  Its term validation section flagged five problems, all of which were acted on.
  HP:0001243 and HP:0001715, offered for phenotypes, do not exist in HPO and
  were not bound. GO:0016573 (histone acetylation) and GO:0055114
  (oxidation-reduction process) are obsolete; the histone one was replaced with
  GO:0043994, histone H3K23 acetyltransferase activity, which names the specific
  mark that the BRPF1 complex places, and the redox one was not used at all
  because no cited source supports a redox claim in this disease. CL:0000203,
  which the report called "cochlear hair cell", is *gravity sensitive cell* in
  CL; the two cochlear hair cell nodes are bound to CL:0000589 and CL:0000601
  instead. CL:0002319, offered as "cranial neural crest cell", is *neural cell*;
  the craniofacial node is bound to CL:0011012, neural crest cell, with the
  cranial specificity carried in preferred_term.

  Two further report CURIEs failed only at binding time, and neither was caught
  by the report-side validator. GO:0007155 (cell adhesion) and GO:1990034
  (calcium ion export across plasma membrane) are biological processes, and the
  report offered them where a molecular function was needed; they resolve
  cleanly and are named correctly, so nothing upstream flagged them, and only
  the MolecularFunctionTerm dynamic enum rejected them. The molecular function
  slots use GO:0098631 and GO:0005388 instead, with GO:1990034 kept as a
  biological process on the same node where it belongs.

  Claims from the report that were rejected on the evidence. The report states
  that clinical expression of von Hippel-Lindau disease "has not yet been
  observed in distal 3p deletion patients". That was true of the 1990s series it
  is drawn from and is no longer true: a cerebellar hemangioblastoma was
  resected at age 16 from a woman with a de novo 3p deletion encompassing p25,
  reported in 2016. Both the older negative reports and that case are carried
  here, and the entry records the tumour as a VERY_RARE phenotype rather than as
  a purely theoretical risk. The report also proposes that ATP2B2 loss perturbs
  calcium signalling in the embryonic heart and thereby causes the septal
  defects; the mapping paper it draws that from says the opposite, having
  excluded ATP2B2, fibulin 2, TIMP4 and Sec13R from the refined cardiac critical
  interval, so the cardiac branch here is modelled as loss of an unresolved
  locus with CRELD1 named as a functional candidate. Its section on epigenetics
  concedes that no methylation, histone or chromatin accessibility study exists
  in patients; the chromatin node in this entry says so in its own description
  rather than presenting the inference as an observation.

  The report contains no mention of SETD5, which the primary literature makes
  the best-supported single contributor to the intellectual disability of the
  3p25.3 interval. That gap was filled from Kellogg 2013 (PMID:23613140), which
  defines the 124 kb critical region, and Kuechler 2015 (PMID:25138099), which
  shows de novo loss-of-function point variants in the gene alone reproducing
  the core phenotype. It likewise does not mention SLC6A1 and SLC6A11, which
  account for the epilepsy and EEG signature; that branch comes from PMID:39923323
  and PMID:40517887.

  No GeneReviews chapter exists for this syndrome. PubMed searches for the
  disease name against GeneReviews return nothing, so the top-level references
  block carries no GeneReviews tag. This is an absence, not an omission.

  No datasets block. There is no disease-specific omics resource for this
  syndrome, and a gene-keyed search of the expression repositories would return
  VHL renal cancer series and SLC6A1 epilepsy cohorts, which resolve perfectly
  and are about other diseases. That is the named entity confusion trap the
  dataset-curation guidance describes, reached through gene search, so the block
  is left out rather than filled with accessions that verify and mislead.

  No clinical_trials block. NCT04937062, the Ravicti trial of glycerol
  phenylbutyrate referenced by PMID:39923323, enrols patients with SLC6A1
  variants and not patients with this deletion; the two 3p- patients in that
  paper were treated on the strength of the shared functional deficit rather
  than as trial participants. Recording that NCT here would attribute a trial
  to a disease it does not enrol.

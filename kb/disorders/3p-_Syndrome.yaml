inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The deletion acts dominantly: a single deleted copy of the interval produces
    the phenotype, and OMIM catalogues the entity as autosomal dominant. Most
    reported deletions are de novo. A minority segregate from a phenotypically
    normal parent, either as unbalanced products of a balanced parental
    rearrangement or, for small distal deletions, as a directly transmitted
    imbalance. Penetrance is therefore not complete across the size range: an
    8.59 Mb 3p26.3p25.3 deletion has been followed through three generations of
    one family without producing any phenotypic abnormality, which is why
    parental testing is part of counselling rather than a formality.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:35306482
    reference_title: "[Genotype-phenotype correlation in a newborn with de novo 3p25 deletion syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the cases are de novo mutations, with variable
      chromosomal breakpoints.
    explanation: >-
      States that most deletions arise de novo rather than being inherited.
  - reference: PMID:39004488
    reference_title: "Prenatal diagnosis of familial 3p26.3p25.3 deletion in a pregnancy associated with a favorable fetal outcome and asymptomatic carrier parent and family members in three generations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The woman's 69-year-old mother and her 2-year-old elder son carried the
      same aberrant chromosome of 3p25.3
    explanation: >-
      Documents direct transmission of a distal 3p deletion through three
      generations, establishing that the imbalance can be inherited.
  - reference: PMID:39004488
    reference_title: "Prenatal diagnosis of familial 3p26.3p25.3 deletion in a pregnancy associated with a favorable fetal outcome and asymptomatic carrier parent and family members in three generations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal 3p deletion of 3p26.3p25.3 involving the OMIM genes from CHL1 to
      SSUH2 can be associated with no apparent phenotypic abnormality.
    explanation: >-
      Records the incomplete penetrance that qualifies the dominant
      inheritance claim.
- name: Sporadic occurrence
  description: >-
    Most probands are simplex cases with normal parental karyotypes, arising
    from a de novo terminal or interstitial deletion. Both parental origins are
    represented: a paternal-origin de novo 3p26.3p25.3 deletion was
    demonstrated by polymorphic marker analysis on uncultured amniocytes, so
    there is no evidence of a parent-of-origin effect on occurrence.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:23040932
    reference_title: "Pure partial monosomy 3p (3p25.3 → pter): prenatal diagnosis and array comparative genomic hybridization characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polymorphic DNA marker analysis on uncultured amniocytes showed a
      paternal origin of the deletion.
    explanation: >-
      A de novo deletion with normal parental karyotypes, of paternal origin.
pathophysiology:
- name: Heterozygous Distal 3p25-pter Deletion
  description: >-
    The initiating lesion. A germline structural deletion removes one copy of a
    segment of distal chromosome 3p, most often terminal from a breakpoint in
    3p25 or 3p26 to the telomere, less often interstitial with the subtelomere
    retained. Reported deletion sizes span roughly 0.6 to 12 Mb. The deletion
    arises de novo in most probands and, in a minority, as the unbalanced
    product of a parental balanced rearrangement or as a directly transmitted
    imbalance.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Haploinsufficiency of Dosage-Sensitive Distal 3p Genes
    causal_link_type: DIRECT
    description: >-
      Removing one copy of the interval halves the gene dosage of everything it
      contains; there is no intervening step.
  evidence:
  - reference: PMID:11977162
    reference_title: "Molecular cytogenetic characterization of a subtle interstitial del(3)(p25.3p26.2) in a patient with deletion 3p syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typically, individuals with deletion 3p syndrome have terminal deletions
      that result in loss of material from 3p25 to 3pter.
    explanation: >-
      Defines the classical deleted interval and its terminal configuration.
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deletion size varied from approximately 6 to 12 Mb.
    explanation: >-
      Gives the deletion size range across a 14-patient microarray series.
  - reference: PMID:18837054
    reference_title: "Molecular characterization of a patient with 3p deletion syndrome and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a child patient with characteristic features of 3p deletion
      syndrome and a de novo unbalanced translocation involving chromosomes 3
      and 13.
    explanation: >-
      Documents the unbalanced-translocation route to the same distal 3p loss.
- name: Haploinsufficiency of Dosage-Sensitive Distal 3p Genes
  description: >-
    The branch point of the entry. A single functional copy of each deleted gene
    is insufficient for normal development of several independent programmes, so
    the syndrome is the sum of separate haploinsufficiencies rather than the
    consequence of one gene. Which branches are engaged depends on where the
    breakpoints fall, which is why deletion size correlates with phenotypic
    breadth and why patients with the same syndrome name can differ so widely.
  biological_scale: MOLECULAR
  downstream:
  - target: CHL1 and Contactin Family Haploinsufficiency
    causal_link_type: DIRECT
  - target: SETD5 Haploinsufficiency
    causal_link_type: DIRECT
  - target: BRPF1 Haploinsufficiency
    causal_link_type: DIRECT
  - target: ATP2B2 Haploinsufficiency
    causal_link_type: DIRECT
  - target: SLC6A1 and SLC6A11 Haploinsufficiency
    causal_link_type: DIRECT
  - target: Loss of the 3p25 Cardiac Septation Locus
    causal_link_type: DIRECT
  - target: VHL Haploinsufficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:7951234
    reference_title: "Molecular genetic analysis of the 3p- syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All five patients displayed the classical features of 3p- syndrome
      (mental retardation, growth retardation, microcephaly, ptosis and
      micrognathia) demonstrating that loss of sequences centromeric to D3S1317
      is not required for expression of the characteristic 3p- syndrome
      phenotype.
    explanation: >-
      Establishes that the core phenotype is produced by the distal part of the
      interval, with more proximal loss adding features rather than the core.
  - reference: PMID:17696125
    reference_title: "Distal 3p deletion syndrome: detailed molecular cytogenetic and clinical characterization of three small distal deletions and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletions were 10.2-11 Mb in size and encompassed 47-51 known genes,
      including the VHL gene.
    explanation: >-
      Quantifies the gene content that a typical deletion renders
      hemizygous.
- name: CHL1 and Contactin Family Haploinsufficiency
  description: >-
    The terminal band 3p26.3 carries three consecutive genes for neuronal
    immunoglobulin superfamily cell adhesion molecules: CHL1, CNTN6 and CNTN4.
    Terminal deletions remove all three; the smallest reported deletions remove
    CHL1 alone and still produce language and cognitive delay. CNTN4 disruption
    by a balanced translocation breakpoint inside the minimal candidate region
    produces the same phenotype without any gene dosage loss elsewhere, which is
    the cleanest human evidence that this gene family carries part of the
    neurodevelopmental burden.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: neuronal cell adhesion mediator activity
    modifier: DECREASED
    term:
      id: GO:0098631
      label: cell adhesion mediator activity
  downstream:
  - target: Impaired Neuronal Cell Adhesion and Axon Guidance
    causal_link_type: DIRECT
    description: >-
      These proteins act at the growth cone and the synapse, so halving their
      dosage acts directly on axon growth and network assembly.
    evidence:
    - reference: PMID:15106122
      reference_title: "Disruption of contactin 4 (CNTN4) results in developmental delay and other features of 3p deletion syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This transcript (also known as BIG-2) is a member of the immunoglobulin
        super family of neuronal cell adhesion molecules involved in axon
        growth, guidance, and fasciculation in the central nervous system (CNS).
      explanation: >-
        States the axon guidance function that the deleted gene product serves.
  evidence:
  - reference: PMID:33519384
    reference_title: "Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The 3p26.3 region contains three consecutive genes encoding closely
      related neuronal immunoglobulin cell adhesion molecules (IgCAMs): Close
      Homolog of L1 (CHL1), Contactin-6 (CNTN6), and Contactin-4 (CNTN4).
    explanation: >-
      Identifies the three genes of this branch and their shared protein
      family.
  - reference: PMID:15106122
    reference_title: "Disruption of contactin 4 (CNTN4) results in developmental delay and other features of 3p deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrate the association of CNTN4 disruption with the 3p
      deletion syndrome phenotype and strongly suggest a causal relationship.
    explanation: >-
      Ties disruption of one member of this family to the syndrome phenotype.
  - reference: PMID:34056867
    reference_title: "CHL1 deletion is associated with cognitive and language disabilities - Case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a small, but growing number of reports of pediatric patients
      with terminal deletions at 3p26.3 involving only the cell adhesion
      molecule L1-like (CHL1) gene that has been found to have language delays
      and intellectual disability.
    explanation: >-
      Establishes that CHL1 loss alone is sufficient for the language and
      cognitive component.
- name: Impaired Neuronal Cell Adhesion and Axon Guidance
  description: >-
    Reduced dosage of CHL1 and the contactins degrades the adhesive cues that
    guide growing axons and stabilise synapses, so cortical and hippocampal
    networks are assembled imprecisely. Mouse work makes the cellular defect
    explicit: CHL1-deficient animals have disorganised hippocampal mossy fibres
    and misrouted olfactory axons. Note the translational caveat recorded in
    discussions: the mouse behavioural phenotypes are mild relative to the
    in-vitro neuritogenesis defects, and the review that surveys them proposes
    compensation among the paralogues.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: axon guidance
    modifier: DECREASED
    term:
      id: GO:0007411
      label: axon guidance
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34056867
      reference_title: "CHL1 deletion is associated with cognitive and language disabilities - Case report and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This case report adds to the limited body of literature that exists on
        this terminal deletion at 3p26.3 that involves CHL1 gene, and supports
        prior proposals of an emerging CHL1 microdeletion syndrome that results
        in language and cognitive delays.
      explanation: >-
        Links loss of this adhesion molecule specifically to the language
        outcome.
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12391163
    reference_title: "Misguided axonal projections, neural cell adhesion molecule 180 mRNA upregulation, and altered behavior in mice deficient for the close homolog of L1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data show that the permanent absence of CHL1 results in misguided
      axonal projections and aberrant axonal connectivity and alters the
      exploratory behavior in novel environments, suggesting deficits in
      information processing in CHL1-deficient mice.
    explanation: >-
      Demonstrates the axonal miswiring that follows loss of this adhesion
      molecule in vivo.
  - reference: PMID:33519384
    reference_title: "Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CHL1, CNTN6, and CNTN4 have been observed to promote neurogenesis and
      neuronal survival, and regulate neuritogenesis and synaptic function.
    explanation: >-
      Summarises the cellular processes these three deleted genes serve.
- name: SETD5 Haploinsufficiency
  description: >-
    SETD5 lies at 3p25.3 inside a 124 kb region shared by the smallest
    interstitial deletions that still cause intellectual disability, and de novo
    truncating point variants in the gene alone reproduce the core of the
    microdeletion 3p25.3 phenotype. Modelling of those point variants showed
    nonsense-mediated decay of the mutant transcript, so the intragenic and
    whole-gene-deletion routes converge on the same haploinsufficient state.
    The protein carries a SET domain and a putative PHD finger, placing it with
    the histone-modifying intellectual disability genes.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: SET domain histone methyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0042054
      label: histone methyltransferase activity
  downstream:
  - target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurodevelopment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25138099
    reference_title: "Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six patients presented with ID and certain facial dysmorphisms,
      suggesting that SETD5 sequence variants contribute substantially to the
      microdeletion 3p25.3 phenotype.
    explanation: >-
      Establishes that loss of this single gene reproduces the core of the
      3p25.3 deletion phenotype.
  - reference: PMID:25138099
    reference_title: "Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CRISPR/Cas9 mutation modelling of the two intragenic variants
      demonstrated nonsense-mediated decay of the resulting transcripts,
      pointing to a loss-of-function (LoF) and haploinsufficiency as the common
      disease-causing mechanism of intragenic SETD5 sequence variants and
      SETD5-containing microdeletions.
    explanation: >-
      Shows experimentally that haploinsufficiency is the shared mechanism of
      the point-variant and deletion routes.
  - reference: PMID:23613140
    reference_title: "Deletion of 3p25.3 in a patient with intellectual disability and dysmorphic features with further definition of a critical region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These deletions share a 124 kb overlap region including only three RefSeq
      annotated genes, THUMPD3, SETD5, and LOC440944.
    explanation: >-
      Narrows the intellectual disability critical region to a three-gene
      interval containing SETD5.
- name: BRPF1 Haploinsufficiency
  description: >-
    BRPF1, also at 3p25.3, is the scaffold subunit of the MOZ, MORF and HBO1
    histone acetyltransferase complexes. It bridges the subunit interactions,
    stimulates acetyltransferase activity and constrains substrate specificity,
    with acetylation of histone H3 at lysine 23 as the characteristic mark. Loss
    of one copy is the branch that the literature associates most specifically
    with ptosis and narrow palpebral fissures alongside intellectual disability.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: histone H3K23 acetyltransferase complex scaffold activity
    modifier: DECREASED
    term:
      id: GO:0043994
      label: histone H3K23 acetyltransferase activity
  downstream:
  - target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurodevelopment
    causal_link_type: DIRECT
  - target: Craniofacial and Palpebral Dysmorphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33643973
      reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, the BRPF1 gene plays a role in craniofacial development,
        and it has also been confirmed that a lack of BRPF1 can cause ptosis and
        (or) narrow palpebral fissure
      explanation: >-
        Attributes the eyelid and craniofacial component of the phenotype to
        loss of this gene specifically.
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRPF1 forms a complex with MOZ, MORF, and HBO1, and acts as a scaffold to
      bridge subunit interactions, stimulate acetyltransferase activity, and
      limit substrate specificity
    explanation: >-
      States the molecular role of the deleted gene product.
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lysine acetyltransferase 6A (KAT6A) and its secondary chain, KAT6B, form
      chemical complexes with BRPF1 for the acetylation and propionylation of
      histone H3 at lysine 23 (H3K23).
    explanation: >-
      Identifies the specific histone mark that the complex places, which is
      the basis for the GO binding on this node.
- name: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurodevelopment
  description: >-
    SETD5 and BRPF1 converge here. Reduced dosage of a SET-domain
    methyltransferase and of the scaffold that licenses H3K23 acetylation
    perturbs the chromatin state at neurodevelopmental promoters and enhancers,
    mis-setting the transcriptional programme of neural progenitors and
    differentiating neurons. Direct chromatin profiling in patients with distal
    3p deletions has not been reported, so this node is inferred from the
    molecular function of the deleted genes plus the human phenotype they
    produce in isolation, not from patient epigenomic data.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25138099
    reference_title: "Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype of microdeletion 3p25.3 syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico domain prediction of SETD5, a predicted SET domain-containing
      histone methyltransferase (HMT), substantiated the presence of a SET
      domain and identified a novel putative PHD domain, strengthening a
      functional link to well-known histone-modifying ID genes.
    explanation: >-
      Places the deleted gene in the histone-modifying class, which is the
      inference this node rests on.
- name: ATP2B2 Haploinsufficiency
  description: >-
    ATP2B2 encodes PMCA2, the plasma membrane calcium ATPase isoform that clears
    calcium entering hair cell stereocilia during mechanotransduction. It sits
    in a 1.38 Mb interval of 3p25.3 that fine deletion mapping against
    audiometry defined as a hearing loss locus. The locus contains eighteen
    genes, and whether losing this one is by itself enough is contested: see the
    ATP2B2 sufficiency discussion.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: PMCA2 plasma membrane calcium pump activity
    modifier: DECREASED
    term:
      id: GO:0005388
      label: P-type calcium transporter activity
  downstream:
  - target: Impaired Calcium Extrusion from Hair Cell Stereocilia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15350283
      reference_title: "Haplo-insufficiency revealed in deafwaddler mice when tested for hearing loss and ataxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The auditory and vestibular systems rely on the plasma membrane calcium
        ATPase, isoform 2 (PMCA2) to extrude calcium that enters the stereocilia
        during transduction.
      explanation: >-
        States the pump function whose loss this edge asserts.
  evidence:
  - reference: PMID:17208398
    reference_title: "3p-- syndrome defines a hearing loss locus in 3p25.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compared auditory test results with fine deletion mapping in seven
      previously unreported 3p-- syndrome patients and identified a 1.38Mb
      region in 3p25.3 in which deletions were associated with moderate to
      severe, bilateral SNHL.
    explanation: >-

inheritance:
- name: Autosomal dominant, usually de novo
  description: >-
    A heterozygous deletion behaving as an autosomal dominant lesion. Most cases
    arise de novo, but the deletion is transmissible, and small terminal
    deletions have been followed through four generations of apparently healthy
    carriers. Penetrance is therefore incomplete and expressivity variable, both
    tracking deletion size rather than anything about the family.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:25123480
    reference_title: >-
      A terminal 3p26.3 deletion is not associated with dysmorphic features and
      intellectual disability in a four-generation family.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      family members in four generations of this family are carrier of this 3p
      deletion and apparently healthy
    explanation: >-
      Demonstrates transmission with non-penetrance, which is the basis for the
      INCOMPLETE penetrance value recorded here.
  - reference: PMID:21457564

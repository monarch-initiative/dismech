prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The literature count is the only
    quantitative figure available, and it is a count of published reports rather
    than of cases, so it is a floor on occurrence and not an estimate of it. No
    rate_per_100000 is recorded for that reason.
  evidence:
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal deletion of chromosome 3p25-pter (3p- syndrome) (OMIM #613792) is a
      rare monosomal disorder with fewer than 60 reported cases worldwide.
    explanation: >-
      The published case count, which is the only quantitative occurrence figure
      the sources provide.
diagnosis:
- name: Chromosomal microarray
  description: >-
    The test that both makes the diagnosis and sizes the deletion. Sizing is not
    incidental here: deletion extent is what the entry treats as the explanatory
    variable for severity, and microarray is what defined every critical region
    the pathophysiology section uses.
  diagnosis_term:
    preferred_term: array comparative genomic hybridization
    term:
      id: NCIT:C18084
      label: Comparative Genomic Hybridization
  evidence:
  - reference: PMID:23613140
    reference_title: >-
      Deletion of 3p25.3 in a patient with intellectual disability and dysmorphic
      features with further definition of a critical region.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on an 11-year-old girl with intellectual disability,
      obsessive-compulsive tendencies, hypotonia, and dysmorphic facial features
      in whom a 684 kb interstitial 3p25.3 deletion was characterized using
      array-CGH.
    explanation: >-
      Shows array-CGH resolving a deletion far below karyotype resolution, which
      is why it is the first-line test.
- name: Karyotyping
  description: >-
    Historically the diagnostic test and still able to show large terminal
    deletions and complex rearrangements, but it can miss the deletion outright.
    The original delineation records exactly that failure, and the recent
    hypoplastic-left-heart case reached only a positional candidate gene because
    karyotype resolution could not place the breakpoint.
  diagnosis_term:
    preferred_term: Karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:3443553
    reference_title: "Terminal deletion of the short arm of chromosome 3, del(3pter-p25): a recognizable syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion was overlooked at a first routine cytogenetic examination."
    explanation: >-
      A documented false-negative karyotype in a patient who had the syndrome,
      which is the limitation this entry records.
treatments:
- name: Developmental Rehabilitation
  description: >-
    Comprehensive rehabilitation - physical, occupational and speech therapy -
    directed at the developmental and motor delay. This is the mainstay of care;
    there is no disease-modifying therapy for a chromosomal deletion, and nothing
    here alters the underlying gene dosage.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: comprehensive developmental rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of diagnosis, the child was 1 year of age and was responding to
      comprehensive rehabilitation training.
    explanation: >-
      Documents the intervention and a response to it in a diagnosed patient.
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most children are able to develop certain social skills after
      rehabilitation treatment.
    explanation: >-
      Supports rehabilitation as the standard approach. Marked INDIRECT because
      the outcome is asserted across the reviewed literature without a
      comparator.
  target_mechanisms:
  - target: Global developmental delay
    treatment_effect: MODULATES
    description: >-
      Rehabilitation acts on the developmental outcome, not on the deletion or on
      any node upstream of it.
    evidence:
    - reference: PMID:33643973
      reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical workers need to be aware of this disease when they find that
        children have special features, such as stunted growth, low muscle tone
        or ptosis, and it needs to be diagnosed through genetic testing.
      explanation: >-
        Marked INDIRECT: the authors' case for early recognition is what makes
        early developmental intervention possible, which is the link this edge
        asserts, rather than a measured effect on the delay itself.
- name: Surgical Repair of Congenital Heart Defect
  description: >-
    Where an atrioventricular septal defect or other congenital heart lesion is
    present, standard paediatric cardiac surgical repair applies. Cardiac
    severity is one of the main determinants of early outcome, so this is the
    intervention with the largest effect on survival - while doing nothing for
    the neurodevelopmental phenotype.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: congenital cardiac surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we reinforce the importance of cytogenetic investigation in patients
      with hypoplastic hearts and dysmorphia, assisting in diagnosis, definition
      of prognosis, and genetic counseling for the family.
    explanation: >-
      Marked INDIRECT: the source establishes that the cardiac lesion drives
      prognosis and management in this syndrome, from which the role of cardiac
      intervention follows, rather than reporting a surgical outcome.
  notes: >-
    No surgical outcome series exists for congenital heart disease specifically
    in 3p- syndrome; management follows the general paediatric cardiac pathway
    for the lesion found. The evidence attached here supports the prognostic
    importance of the cardiac lesion, not a measured benefit of repair.
- name: Genetic Counseling
  description: >-
    Counselling has an unusually concrete role here because the deletion is
    transmissible and small terminal deletions can be carried by clinically
    normal parents. Parental testing changes the recurrence risk given, and the
    same finding is what makes reporting these copy-number variants in prenatal
    screening difficult - in one reported family the deletion was found on
    prenatal karyotyping of an unaffected mother, and the couple continued the
    pregnancy after counselling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25123480
    reference_title: >-
      A terminal 3p26.3 deletion is not associated with dysmorphic features and
      intellectual disability in a four-generation family.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, we review the literature on terminal 3p deletions and
      discuss the importance of molecular testing and reporting of copy number
      variants to achieve accurate genetic counseling in prenatal and postnatal
      screening.
    explanation: >-
      The authors' own statement of why counselling and careful variant reporting
      matter for this deletion specifically.
  - reference: PMID:21457564
    reference_title: >-
      Microarray based analysis of an inherited terminal 3p26.3 deletion,
      containing only the CHL1 gene, from a normal father to his two affected
      children.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As already described for others recurrent syndromes with variable
      phenotype, these findings are challenging in genetic counselling because of
      an evident variable penetrance.
    explanation: >-
      Names variable penetrance as the specific counselling difficulty, which is
      what this treatment entry addresses.
  - reference: PMID:33936696
    reference_title: "Familiar del3p syndrome: The uncertainty of the prognosis. A case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No ultrasound anomalies were detected; therefore, after genetic
      counseling, the couple decided to continue the pregnancy and a
      phenotypically normal child was born.
    explanation: >-
      The worked prenatal case this entry's description points at: counselling
      on an incidentally found deletion changed a live reproductive decision, and
      the outcome bore out the non-penetrant reading.
differential_diagnoses:
- name: SETD5 haploinsufficiency syndrome
  description: >-
    The single-gene phenocopy of this entry's neurodevelopmental core, caused by
    an intragenic SETD5 sequence variant rather than a deletion. The two are
    deliberately separate entries in dismech, and the boundary is drawn the same
    way from both sides. Chromosomal microarray distinguishes them; a normal
    microarray with a SETD5 variant on sequencing is the single-gene disorder.
    Expect the deletion to add features that lie outside SETD5 - postaxial
    polydactyly, hearing impairment, and the cardiac lesion.
  disease_term:
    preferred_term: SETD5 haploinsufficiency syndrome
    term:
      id: MONDO:0014336
      label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
  evidence:
  - reference: PMID:25138099
    reference_title: >-
      Loss-of-function variants of SETD5 cause intellectual disability and the
      core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six patients presented with ID and certain facial dysmorphisms,
      suggesting that SETD5 sequence variants contribute substantially to the
      microdeletion 3p25.3 phenotype.
    explanation: >-
      Establishes that the single-gene disorder reproduces the core of the
      deletion phenotype, which is exactly why it is the leading differential.
  - reference: PMID:27375234
    reference_title: >-
      SETD5 loss-of-function mutation as a likely cause of a familial syndromic
      intellectual disability with variable phenotypic expression.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function de novo mutations in the SETD5 gene, encoding a putative
      methyltransferase, are an important cause of moderate/severe intellectual
      disability as evidenced by the results of sequencing large patient cohorts.
    explanation: >-
      Confirms the single-gene entity exists independently of any deletion, which
      is what makes it a differential rather than a synonym.
- name: BRPF1-related intellectual disability
  description: >-
    The other single-gene disorder inside the 3p25.3 interval. Historically most
    of the 3p25 deletion phenotype was attributed to SETD5 before BRPF1 was
    characterised, and ptosis and blepharophimosis in particular track with BRPF1
    loss. A contiguous deletion can remove both, so the question at the bedside
    is whether a microarray shows a deletion or sequencing shows an intragenic
    BRPF1 variant.
- name: 3p25.3 microdeletion syndrome
  description: >-
    A narrower, separately coded concept for the small interstitial 3p25.3
    deletions around SETD5 and BRPF1, as against this entry's classic terminal
    3p25-pter deletion. The two overlap and the literature does not always keep
    them apart; the practical discriminator is whether the telomeric 3p26.3
    adhesion-gene cluster is also lost.
  disease_term:
    preferred_term: 3p25.3 microdeletion syndrome
    term:
      id: MONDO:0018564
      label: 3p25.3 microdeletion syndrome
- name: Blepharophimosis-impaired intellectual development syndrome
  description: >-
    Shares the blepharophimosis-plus-intellectual-disability surface phenotype and
    is mechanistically unrelated - a SMARCA2 BAFopathy rather than a copy-number
    change. Named here because that surface resemblance is what puts it in the
    differential; chromosomal microarray settles it.
- name: Blepharophimosis intellectual disability syndrome, MKB type
  description: >-
    X-linked Ohdo syndrome, MED12-related. The same surface resemblance and the
    same resolution as the entry above: unrelated mechanism, distinguished by
    microarray and by X-linked segregation.
- name: Unbalanced translocation producing 3p monosomy
  description: >-
    A 3p deletion can arise as one half of an unbalanced translocation carried by
    a parent, with a reciprocal gain elsewhere in the genome. The deletion
    phenotype is then overlaid on whatever the duplicated segment contributes, so
    features outside the 3p- picture should prompt a look at the other
    chromosome, and parental karyotyping changes the recurrence risk.
  evidence:
  - reference: PMID:34602958
    reference_title: >-
      Partial Trisomy 13q/Monosomy 3p Resulting from a Paternal Reciprocal
      3p;13q Translocation in a Boy with Facial Dysmorphism and Hypertrophic
      Cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A chromosomal imbalance with a partial trisomy 13q31.1q34 and monosomy
      3p26.3 of paternal origin were detected.
    explanation: >-
      A worked case of 3p monosomy arising as one half of an inherited unbalanced
      translocation, which is the mechanism this differential names.
discussions:
- discussion_id: del3p_which_gene_drives_the_cognitive_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which gene in the 3p25.3 critical region carries the intellectual disability
    of 3p- syndrome - SETD5, SRGAP3, or both?
  rationale: >-
    Two well-supported assignments sit in the same band and were reached by
    different routes. Microarray mapping across 14 deletion patients put the
    cognitive critical region in a ~1 Mb interval containing SRGAP3 and concluded
    SRGAP3 was the major determinant, and the gene was independently implicated
    by a translocation that inactivated it in a patient with hypotonia and severe
    intellectual disability. Separately, the smallest interstitial deletions
    converge on a 124 kb interval containing SETD5, and intragenic SETD5
    loss-of-function variants reproduce the core phenotype with no deletion at
    all. Neither result excludes the other, and no study cited here compares
    deletions that separate the two genes. This is not a taxonomic question: it
    decides whether a deletion sparing one of them should be expected to spare
    the cognitive phenotype, which is what a family wants to know from a
    microarray report.
  attaches_to:
  - pathophysiology#Haploinsufficiency of the 3p25.3 Critical Region
  - genetic#SETD5
  - genetic#SRGAP3
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that current evidence suggests that SRGAP3 is the major
      determinant of mental retardation in distal 3p deletions.
    explanation: >-
      One of the two competing assignments, stated by its authors as a suggestion
      rather than a finding.
  - reference: PMID:24680889
    reference_title: >-
      De novo loss-of-function mutations in SETD5, encoding a methyltransferase
      in a 3p25 microdeletion syndrome critical region, cause intellectual
      disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individuals with SETD5 mutations showed phenotypic similarity to those
      previously reported with a deletion in 3p25, and thus loss of SETD5 might
      be sufficient to account for many of the clinical features observed in this
      condition.
    explanation: >-
      The competing assignment, also hedged, which is why the entry records both
      rather than choosing.
- discussion_id: del3p_igcam_mouse_models_do_not_reproduce_the_deficit
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the single-gene mouse knockouts of CHL1, CNTN6 and CNTN4 tell us anything
    about the neurodevelopmental contribution of the 3p26.3 cluster in humans,
    given that they do not reproduce the in vitro deficit?
  rationale: >-
    The cellular case for this branch rests on in vitro work: the three IgCAMs
    show pronounced defects in neuritogenesis and axon guidance when disrupted in
    culture. The corresponding single-gene mouse knockouts do not show strong
    deficits in axonal migration or behaviour. The cited review reads this as
    compensation among family members with overlapping interactomes - which, if
    right, means a single-gene knockout is structurally the wrong model for a
    contiguous deletion that removes all three at once, and the informative
    experiment is a compound knockout that nobody in these sources reports. The
    alternative reading is that the in vitro deficit does not scale to an intact
    nervous system, in which case this branch is weaker than the entry draws it.
    The two readings are not distinguished by anything cited here, and they point
    in opposite directions for how much of the human phenotype to attribute to
    3p26.3.
  attaches_to:
  - pathophysiology#Impaired Neuronal Adhesion and Neurite Outgrowth
  - pathophysiology#Haploinsufficiency of Distal 3p26.3 Neuronal Adhesion Genes
  evidence:
  - reference: PMID:33519384
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated
      in 3p-Deletion Syndrome and Autism Spectrum Disorder.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, mouse models deficient for these neuronal IgCAMs do not display
      strong deficits in axonal migration or behavioral phenotypes, which is in
      contrast to the pronounced defects in neuritogenesis and axon guidance
      observed in vitro.
    explanation: >-
      The mismatch itself, stated by the review: the model system does not
      reproduce what the in vitro system shows.
  - reference: PMID:33519384
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated
      in 3p-Deletion Syndrome and Autism Spectrum Disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that when CHL1, CNTN6, or CNTN4 function is disrupted by
      CNVs, other neuronal IgCAMs may suppress behavioral phenotypes by
      compensating for the loss of function.
    explanation: >-
      The compensation reading of the mismatch. Marked INDIRECT because it is the
      review's proposed explanation, not a tested one, and it is the proposal
      that would make a compound knockout the informative experiment.
- discussion_id: del3p_no_gene_for_the_cardiac_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which gene in the ~200 kb 3p25.3 cardiac susceptibility interval accounts for
    the atrioventricular septal defect?
  rationale: >-
    The cardiac interval has been mapped and is separate from the
    neurodevelopmental one, but no gene in it has been established. CAV3 is the
    positional candidate most often raised, and the most recent case argues for
    it from proximity plus in silico reasoning after a karyotype whose resolution
    the authors record as a limitation. That is a hypothesis, not an assignment,
    and the entry deliberately leaves the pathophysiology node's gene slot empty
    while typing CAV3 as SUSCEPTIBILITY in the genetic section. Resolving this
    matters clinically because cardiac severity is the main determinant of early
    outcome, so a gene would turn deletion boundaries into a prognostic
    statement.
  attaches_to:
  - pathophysiology#Haploinsufficiency of a 3p25.3 Cardiac Susceptibility Locus
  - phenotypes#Atrioventricular septal defect
  - genetic#CAV3
  evidence:
  - reference: PMID:39841745
    reference_title: "First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate genes."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified an indirect relation between gene CAV3 and hypoplastic left
      heart syndrome due to its strong association with cardiomyopathies and
      isolated cardiac defects.
    explanation: >-
      The authors themselves call the relation indirect, which is the reason this
      is a knowledge gap rather than a curated gene-phenotype assertion.
  - reference: PMID:22965684
    reference_title: >-
      Interstitial 3p25.3-p26.1 deletion in a patient with intellectual
      disability.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deleted region harbors 11 RefSeq genes including CAV3 and SRGAP3/MEGAP,
      which had been associated with muscle disorders and intellectual
      disability, respectively.
    explanation: >-
      This patient's deletion contains CAV3 and she has intellectual disability
      but no congenital heart defect, which cuts against the simplest version of
      the CAV3 hypothesis.
notes: >-
  Lump/split decision, recorded per the claim issue. This is curated as a single
  DISEASE entry, not a grouping. Co-deleted genes jointly producing one
  recognisable phenotype is the single-entry case; a grouping is for genuinely
  distinct diseases converging downstream. The shape follows the other
  contiguous-deletion entries in the KB (Cri-du-Chat_Syndrome,
  Chromosome_1p36_Deletion_Syndrome, 22q11.2_Deletion_Syndrome).

  Relationship to neighbouring entries. SETD5_Haploinsufficiency_Syndrome
  (MONDO:0014336) is the single-gene phenocopy of the neurodevelopmental core and
  states the same boundary from its side; BRPF1-Related_Intellectual_Disability
  covers the adjacent 3p25.3 gene. Neither is duplicated here - this entry cites
  the SETD5 literature only where it bears on the deletion. Note that
  MONDO:0018564 (3p25.3 microdeletion syndrome) is a different MONDO concept from
  this entry's MONDO:0013424 and is recorded as a differential. MONDO:0017393
  (blepharophimosis - intellectual disability syndrome), which the stub carried
  as a MONDO parent, is a phenotype-level grouping term; the two blepharophimosis
  syndromes under it are recorded as differentials, not merged.

  Sources. Curated from a single Perplexity deep-research report used as leads
  only. Its reference validation was clean (19 of 19 identifiers resolved,
  confabulation rate 0.0, 15 of 19 judged on topic) but its term validation was
  not: 8 of 55 checked CURIE labels named a different term than the report
  claimed and 14 more were flagged as worth a second look, so no CURIE was copied
  from it and every binding in this file was re-derived with OAK at the time it
  was written. Two of the report's errors would otherwise have been silent -
  HP:0000263 offered for trigonocephaly is Oxycephaly, and CL:0000182 offered for
  cardiac muscle cell is hepatocyte.

  Sources not used, with reasons. Orphanet (ORPHA:1620) and ClinGen dosage
  sensitivity were both attempted as structured sources and both failed on
  upstream release drift against the pinned manifest checksums; repinning either
  would rewrite a corpus-wide cache inside a single-disease curation PR, so both
  were left alone. PMID:18553547, which the report cited for phenotypic
  variability, has no abstract in PubMed (the cache records content_type
  unavailable), so nothing in it is quotable; PMID:25123480 makes the same point
  and is cited instead. PMID:17125947 and PMID:29928177 describe proximal 3p
  deletions (proximal 3p and 3p13-p14) rather than the distal deletion this entry
  covers; PMID:20101686 and PMID:623063 are single case reports adding nothing
  the cited series do not; and PMID:37217526 is a renal-cancer mouse model. All
  appear in the report's citation list and none was needed. PMID:31428485 is a
  partial exception: its own case is an inverted duplication with terminal
  deletion and is not curated, but its literature summary of the pure distal 3p
  deletion phenotype is cited for preauricular pits. Every other identifier in
  that list is cited somewhere in this entry.

  Features initially omitted, and what happened to them. An earlier draft of
  this entry claimed that renal and gastrointestinal anomalies, cleft palate,
  preauricular pits and seizures had no quotable source in the fetched set. That
  was wrong for four of the five, and the error was in this note rather than in
  the search: PMID:33643973, already cited elsewhere in this file, states renal
  malformation, gastrointestinal malformation and epilepsy directly, both in its
  abstract and in its introduction. All three are now curated as phenotypes from
  that source. Preauricular pits are curated from PMID:31428485, whose own case
  is a different rearrangement and is not used here, but whose literature summary
  of the pure distal 3p deletion phenotype names them; the source hedges with
  "possibly" and the evidence item is graded INDIRECT to match. Ear anomalies
  were not in that omission list and should have been - low ear position and
  deformed ears are named in both PMID:33643973 and PMID:2178418, the latter in a
  sentence this file was already quoting for hearing impairment - and are now
  curated as Low-set ears and Abnormal pinna morphology.

  Cleft palate is the one feature that genuinely has no quotable source here. No
  cached reference in this PR mentions it. The nearest statement is the
  high-arched palate in PMID:33643973's case description, which is a different
  HPO concept and is not curated as cleft palate.

  Frequency bands. The per-phenotype frequency percentages the report attributes
  to a 2004 cohort could not be traced to a real citation - the numbered
  reference resolves to a ClinVar record - so no frequency percentage from that
  list was used. PMID:33643973 does report its own incidences across a 29-case
  literature review, and those are citable and are used: 43 percent for
  congenital heart disease puts the cardiac phenotype in FREQUENT, correcting an
  earlier OCCASIONAL band, and 29 percent for hearing abnormalities is the top of
  OCCASIONAL (5-29 percent) and does not reach FREQUENT, which begins at 30
  percent, so that band is unchanged. Bands for phenotypes with no reported
  number remain coarse qualitative judgements from the cited text, and phenotypes
  whose sources give no frequency at all carry no band rather than a guessed
  one.
review_notes: >-
  Two things a reviewer should check rather than assume. First, the entry
  deliberately does not name a single driver gene, even though "3p- syndrome is
  SETD5 haploinsufficiency" is the convenient shorthand and one cited paper comes
  close to saying it. Three things block it: a separately mapped cardiac interval
  that SETD5 is not in, a distal 3p26.3 branch whose deletion produces a
  different and milder picture, and a competing SRGAP3 assignment made on
  independent evidence. All three are cited and the unresolved attribution is
  recorded as discussions.

  Second, two evidence items in this file are graded REFUTE against the claims
  they sit under - the mouse knockouts that fail to reproduce the in vitro IgCAM
  deficit, and the CAV3-containing deletion without a heart defect. Both are
  deliberate. They are the negative results behind the HUMAN_MODEL_MISMATCH and
  cardiac-gene discussions, and the honest reading is that the 3p26.3 branch is
  the weakest of the three drawn from the deletion.

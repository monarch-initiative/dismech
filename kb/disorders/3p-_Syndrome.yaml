name: 3p- Syndrome
creation_date: "2026-09-09T14:00:00Z"
category: Genetic
parents:
- Contiguous Gene Deletion Syndrome
- Neurodevelopmental Disorder
disease_term:
  preferred_term: 3p- syndrome
  term:
    id: MONDO:0013424
    label: 3p- syndrome
synonyms:
- chromosome 3pter-p25 deletion syndrome
- distal monosomy 3p
- del(3p) syndrome
- 3p deletion syndrome
- distal 3p deletion
- partial deletion of the short arm of chromosome 3
description: >-
  3p- syndrome is a contiguous-gene deletion syndrome caused by heterozygous
  deletion of the distal short arm of chromosome 3, classically terminal and
  spanning 3p25 to 3pter. The recognisable picture is low birth weight and
  postnatal growth failure, intellectual disability and developmental delay,
  hypotonia, microcephaly, and a craniofacial gestalt of ptosis, telecanthus,
  micrognathia, long philtrum and depressed nasal bridge. Postaxial polydactyly,
  hearing impairment, renal and gastrointestinal anomalies, and congenital heart
  defects - most often an atrioventricular septal defect - occur in a minority.

  The entry models the syndrome as the joint consequence of losing several
  dosage-sensitive genes rather than as one gene's haploinsufficiency under a
  cytogenetic name, because the literature supports at least three separable
  contributions: a 3p25.3 critical region containing SETD5 and SRGAP3 that
  carries the neurodevelopmental core, a distal 3p26.3 cluster of neuronal
  adhesion genes (CHL1, CNTN6, CNTN4), and a separately mapped 3p25.3 cardiac
  susceptibility interval. Deletion size varies from under 1 Mb to more than
  10 Mb, breakpoints are not recurrent, and the same literature records
  apparently healthy carriers of small terminal deletions - so deletion extent,
  not a single gene, is what the entry treats as the explanatory variable.

  Entity scope. This entry is the multi-gene deletion. The single-gene phenocopy
  of its neurodevelopmental core is curated separately as
  `SETD5_Haploinsufficiency_Syndrome` (MONDO:0014336), which covers intragenic
  SETD5 sequence variants; that entry draws the same boundary from its own side.
  `BRPF1-Related_Intellectual_Disability` covers the adjacent 3p25.3 gene whose
  loss contributes to larger deletions. See `differential_diagnoses` and
  `discussions`.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A constitutional chromosomal deletion syndrome; the primary clinical home
      is clinical genetics and dysmorphology rather than any single organ system.
    evidence:
    - reference: PMID:21457564
      reference_title: >-
        Microarray based analysis of an inherited terminal 3p26.3 deletion,
        containing only the CHL1 gene, from a normal father to his two affected
        children.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        terminal deletions of the distal portion of the short arm of chromosome 3
        cause a rare contiguous gene disorder characterized by growth
        retardation, developmental delay, mental retardation, dysmorphisms,
        microcephaly and ptosis
      explanation: >-
        Characterises the condition as a contiguous gene disorder arising from a
        chromosomal deletion, which is the basis for this Part assignment.
  - classification_value: NEUROLOGIC
    notes: >-
      The invariant components - intellectual disability, developmental delay and
      hypotonia - are neurologic, and the best-mapped critical region is defined
      by its neurodevelopmental effect.
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways
        Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Deletions occurring at chromosome 3p result in 3p-deletion syndrome
        (Del3p), a rare genetic disorder characterized by developmental delay,
        intellectual disability, facial dysmorphisms and often, ASD or
        ASD-associated behaviors.
      explanation: >-
        Names the neurodevelopmental features as the defining characteristics of
        the syndrome.
pathophysiology:
- name: Heterozygous Deletion of Distal Chromosome 3p
  description: >-
    The lesion is a heterozygous deletion of distal 3p, classically terminal with
    a breakpoint at or near 3p25 and extending to the telomere, though
    interstitial deletions lying wholly inside that interval reproduce the
    syndrome. Deletion size in cytogenetically detectable cases runs from roughly
    6 to 12 Mb, and molecularly characterised interstitial cases go down to about
    1 Mb. Breakpoints are not recurrent, which is the structural fact behind the
    entry's multi-gene model: different patients lose different combinations of
    the dosage-sensitive genes in the interval.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal deletion of chromosome 3p25-pter (3p- syndrome) produces a distinct
      clinical syndrome characterized by low birth weight, mental retardation,
      telecanthus, ptosis, and micrognathia.
    explanation: >-
      States the lesion and the syndrome it produces, which is the content of
      this initiating node.
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion size varied from approximately 6 to 12 Mb."
    explanation: >-
      Quantifies the size range across a microarray-characterised series, which
      is the variability this node records.
  - reference: PMID:11977162
    reference_title: >-
      Molecular cytogenetic characterization of a subtle interstitial
      del(3)(p25.3p26.2) in a patient with deletion 3p syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This interstitial deletion lies within all previously reported terminal
      deletions in deletion 3p syndrome individuals, and represents the smallest
      reported deletion associated with deletion 3p syndrome.
    explanation: >-
      Establishes that an interstitial deletion inside the classic terminal
      interval is sufficient, so the terminal breakpoint itself is not the cause.
  downstream:
  - target: Haploinsufficiency of the 3p25.3 Critical Region
    causal_link_type: DIRECT
    description: >-
      Every deletion large enough to produce the classic syndrome removes one
      copy of 3p25.3.
    evidence:
    - reference: PMID:2178418
      reference_title: >-
        Loss of the 3p25.3 band is critical in the manifestation of del(3p)
        syndrome: karyotype-phenotype correlation in cases with deficiency of the
        distal portion of the short arm of chromosome 3.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Karyotype-phenotype comparisons in the present cases and 16 previously
        reported cases with deficiency of the distal portion of 3p suggests that
        deficiency of the 3p25.3 band is critical to produce the main clinical
        manifestations of the del(3p) syndrome.
      explanation: >-
        The karyotype-phenotype correlation that ties the main manifestations to
        loss of this specific band, which is what this edge asserts.
  - target: Haploinsufficiency of Distal 3p26.3 Neuronal Adhesion Genes
    causal_link_type: DIRECT
    description: >-
      A terminal deletion additionally removes the 3p26.3 gene cluster; an
      interstitial deletion sparing the telomere does not.
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways
        Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observe that high frequencies of CNVs occur in the 3p26.3 region, the
        terminal cytoband of chromosome 3p.
      explanation: >-
        Establishes 3p26.3 as the region most often removed, which is what makes
        this a separate branch of the deletion's consequences.
  - target: Haploinsufficiency of a 3p25.3 Cardiac Susceptibility Locus
    causal_link_type: DIRECT
    description: >-
      Proximal extension of the deletion into a separately mapped ~200 kb
      interval is what tracks with congenital heart disease, which is why the
      cardiac branch is drawn from the deletion rather than from the
      neurodevelopmental node.
    evidence:
    - reference: PMID:19760623
      reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Assuming complete penetrance, a candidate critical region for a CHD
        susceptibility gene was refined to approximately 200 kb and a candidate
        critical region for mental retardation was mapped to an approximately 1
        Mb interval containing SRGAP3
      explanation: >-
        Maps the cardiac and neurodevelopmental critical regions separately,
        which is the direct basis for splitting these two branches.
- name: Haploinsufficiency of the 3p25.3 Critical Region
  description: >-
    Loss of one copy of the 3p25.3 interval that carries the neurodevelopmental
    core. Two genes in it have independent support. SETD5 sits inside the minimal
    124 kb region shared by the smallest interstitial deletions, and SRGAP3 sits
    inside the roughly 1 Mb interval that microarray mapping assigned to the
    cognitive phenotype. The entry keeps both rather than choosing, because the
    two claims were made on different evidence and neither displaces the other.
  role: mechanism
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  - preferred_term: SRGAP3
    term:
      id: hgnc:19744
      label: SRGAP3
  evidence:
  - reference: PMID:23613140
    reference_title: >-
      Deletion of 3p25.3 in a patient with intellectual disability and dysmorphic
      features with further definition of a critical region.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These deletions share a 124 kb overlap region including only three RefSeq
      annotated genes, THUMPD3, SETD5, and LOC440944.
    explanation: >-
      Defines the minimal shared interval and its gene content, which is what
      makes this node a named critical region rather than a generic gene list.
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that current evidence suggests that SRGAP3 is the major
      determinant of mental retardation in distal 3p deletions.
    explanation: >-
      The authors' attribution of the cognitive phenotype to SRGAP3 within this
      region. Recorded as one of two competing gene assignments, not as settled.
  downstream:
  - target: Loss of SETD5-Dependent Chromatin Regulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25138099
      reference_title: >-
        Loss-of-function variants of SETD5 cause intellectual disability and the
        core phenotype of microdeletion 3p25.3 syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CRISPR/Cas9 mutation modelling of the two intragenic variants
        demonstrated nonsense-mediated decay of the resulting transcripts,
        pointing to a loss-of-function (LoF) and haploinsufficiency as the common
        disease-causing mechanism of intragenic SETD5 sequence variants and
        SETD5-containing microdeletions.
      explanation: >-
        Establishes haploinsufficiency as the shared mechanism for deletions and
        intragenic variants, which is precisely this edge.
  - target: Loss of SRGAP3-Dependent Rac1 Regulation in Neurons
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12195014
      reference_title: >-
        The novel Rho-GTPase activating gene MEGAP/ srGAP3 has a putative role in
        severe mental retardation.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By fluorescence in situ hybridization and loss of heterozygosity
        analysis, we demonstrated that this gene resides on chromosome 3p25 and
        is deleted in 3p(-) patients that present MR.
      explanation: >-
        Places the gene inside the deleted interval in patients, which is what
        licenses drawing this edge from the region node to the gene's function.
  - target: Loss of BRPF1-Dependent Histone Acetylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33643973
      reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gene microarray analysis showed a 10.095 Mb deletion in the 3p26.3-p25.3
        region, resulting in a heterozygous mutation of the BRPF1 gene; thus, the
        patient was diagnosed with 3p deletion syndrome.
      explanation: >-
        Places BRPF1 inside the deleted interval in a molecularly characterised
        patient, which is what licenses drawing this edge from the region node to
        the gene's function.
- name: Loss of SETD5-Dependent Chromatin Regulation
  description: >-
    SETD5 encodes a predicted SET-domain methyltransferase acting on chromatin.
    Truncating alleles trigger nonsense-mediated decay, so a deletion and an
    intragenic loss-of-function variant converge on the same halved dose. The
    binding here is deliberately the broad chromatin-organization process rather
    than a specific histone-methylation term: the cited work calls SETD5 a
    predicted methyltransferase and infers the SET domain in silico, so a
    narrower catalytic term would assert more than the sources do.
  role: mechanism
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:24680889
    reference_title: >-
      De novo loss-of-function mutations in SETD5, encoding a methyltransferase
      in a 3p25 microdeletion syndrome critical region, cause intellectual
      disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings add to the growing evidence that mutations in genes encoding
      methyltransferases regulating histone modification are important causes of
      ID.
    explanation: >-
      Places SETD5 loss in the histone-modification class of intellectual
      disability genes, which is the process this node names.
  - reference: PMID:25138099
    reference_title: >-
      Loss-of-function variants of SETD5 cause intellectual disability and the
      core phenotype of microdeletion 3p25.3 syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In silico domain prediction of SETD5, a predicted SET domain-containing
      histone methyltransferase (HMT), substantiated the presence of a SET domain
      and identified a novel putative PHD domain, strengthening a functional link
      to well-known histone-modifying ID genes.
    explanation: >-
      Supports the chromatin-regulatory assignment. Marked INDIRECT because the
      domain assignment is a prediction, which is also why this node binds a
      broad chromatin process rather than a catalytic term.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The steps between halved SETD5 dose and the cognitive outcome are not
      established in human tissue.
    evidence:
    - reference: PMID:24680889
      reference_title: >-
        De novo loss-of-function mutations in SETD5, encoding a methyltransferase
        in a 3p25 microdeletion syndrome critical region, cause intellectual
        disability.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This analysis provides sufficient evidence that rare de novo LoF
        mutations in SETD5 are a relatively frequent (0.7%) cause of ID.
      explanation: >-
        Establishes SETD5 loss of function as a cause of intellectual disability
        in its own right, independent of any deletion.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25138099
      reference_title: >-
        Loss-of-function variants of SETD5 cause intellectual disability and the
        core phenotype of microdeletion 3p25.3 syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All six patients presented with ID and certain facial dysmorphisms,
        suggesting that SETD5 sequence variants contribute substantially to the
        microdeletion 3p25.3 phenotype.
      explanation: >-
        Ties SETD5 loss to the developmental phenotype of the microdeletion,
        which is the claim this edge makes.
- name: Loss of SRGAP3-Dependent Rac1 Regulation in Neurons
  description: >-
    SRGAP3 (MEGAP/srGAP3) is a Rho-family GTPase-activating protein expressed
    predominantly in fetal and adult brain, concentrated in hippocampus and
    cortex, and acting as a Rac1 GAP within the Slit-Robo pathway that guides
    neuronal migration and axonal branching. Halving its dose is proposed to
    disturb the neuronal architecture on which cognition depends.
  role: mechanism
  biological_scale: CELLULAR
  molecular_functions:
  - preferred_term: Rac1 GTPase activator activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: Rac protein signal transduction
    term:
      id: GO:0016601
      label: Rac protein signal transduction
    modifier: INCREASED
  - preferred_term: Slit-Robo axon guidance
    term:
      id: GO:0007411
      label: axon guidance
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:12195014
    reference_title: >-
      The novel Rho-GTPase activating gene MEGAP/ srGAP3 has a putative role in
      severe mental retardation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MEGAP/srGAP3 has recently been shown to be part of the Slit-Robo pathway
      regulating neuronal migration and axonal branching, highlighting the
      important role of MEGAP/srGAP3 in mental development.
    explanation: >-
      Places the protein in the axon-guidance pathway this node binds.
  - reference: PMID:12195014
    reference_title: >-
      The novel Rho-GTPase activating gene MEGAP/ srGAP3 has a putative role in
      severe mental retardation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We describe several MEGAP/srGAP3 transcript isoforms and show that
      MEGAP/srGAP3a and -b represent functional GTPase-activating proteins (GAP)
      by an in vitro GAP assay.
    explanation: >-
      The biochemical demonstration of GAP activity that grounds the molecular
      function bound on this node. Graded IN_VITRO because it is a cell-free
      enzymatic assay.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than demonstrated: the authors infer the developmental
      consequence from gene dosage plus expression pattern.
    evidence:
    - reference: PMID:12195014
      reference_title: >-
        The novel Rho-GTPase activating gene MEGAP/ srGAP3 has a putative role in
        severe mental retardation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We propose that haploinsufficiency of MEGAP/srGAP3 leads to the abnormal
        development of neuronal structures that are important for normal
        cognitive function.
      explanation: >-
        Marked INDIRECT because the authors state this as a proposal from gene
        dosage and expression rather than a demonstrated causal chain.
  - target: Generalized hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12195014
      reference_title: >-
        The novel Rho-GTPase activating gene MEGAP/ srGAP3 has a putative role in
        severe mental retardation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we report the isolation of a previously uncharacterized gene, MEGAP,
        which is disrupted and functionally inactivated by a translocation
        breakpoint in a patient who shares some characteristic clinical features,
        such as hypotonia and severe MR, with the 3p(-) syndrome
      explanation: >-
        A single patient in whom gene disruption without a deletion produced
        hypotonia. Marked INDIRECT because it is one translocation case, not a
        demonstration that halved dose causes hypotonia generally.
- name: Haploinsufficiency of Distal 3p26.3 Neuronal Adhesion Genes
  description: >-
    The terminal cytoband 3p26.3 carries three consecutive genes for closely
    related neuronal immunoglobulin cell adhesion molecules - CHL1, CNTN6 and
    CNTN4 - and is the region most frequently involved in chromosome 3p copy
    number variants. This branch is separable from the 3p25.3 core: deletions
    confined to it produce a milder, sometimes non-penetrant picture rather than
    the full syndrome.
  role: mechanism
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CHL1
    term:
      id: hgnc:1939
      label: CHL1
  - preferred_term: CNTN6
    term:
      id: hgnc:2176
      label: CNTN6
  - preferred_term: CNTN4
    term:
      id: hgnc:2174
      label: CNTN4
  evidence:
  - reference: PMID:33519384
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated
      in 3p-Deletion Syndrome and Autism Spectrum Disorder.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3p26.3 region contains three consecutive genes encoding closely related
      neuronal immunoglobulin cell adhesion molecules (IgCAMs): Close Homolog of
      L1 (CHL1), Contactin-6 (CNTN6), and Contactin-4 (CNTN4).
    explanation: >-
      Names the gene content of the region, which is what this node asserts is
      lost together.
  - reference: PMID:21457564
    reference_title: >-
      Microarray based analysis of an inherited terminal 3p26.3 deletion,
      containing only the CHL1 gene, from a normal father to his two affected
      children.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two brothers present microcephaly, light mental retardation, learning
      and language difficulties but not the typical phenotype manifestations
      described in 3p- syndrome.
    explanation: >-
      Shows that losing this region alone gives a milder, incomplete picture,
      which is why the entry keeps it as a separate branch rather than folding it
      into the 3p25.3 core.
  downstream:
  - target: Impaired Neuronal Adhesion and Neurite Outgrowth
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways
        Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CHL1, CNTN6, and CNTN4 have been observed to promote neurogenesis and
        neuronal survival, and regulate neuritogenesis and synaptic function.
      explanation: >-
        States the cellular functions whose loss this edge asserts.
- name: Impaired Neuronal Adhesion and Neurite Outgrowth
  description: >-
    Reduced dosage of the 3p26.3 IgCAMs is expected to degrade neuritogenesis,
    axon guidance and synaptic function. The in vitro evidence for this is
    considerably stronger than the in vivo evidence: single-gene mouse knockouts
    do not reproduce the defects seen in culture, which the cited review
    attributes to compensation among the family members. That mismatch is
    recorded as a discussion rather than smoothed over here.
  role: mechanism
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neuronal cell adhesion
    term:
      id: GO:0007158
      label: neuron cell-cell adhesion
    modifier: DECREASED
  - preferred_term: neurite outgrowth
    term:
      id: GO:0031175
      label: neuron projection development
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33519384
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated
      in 3p-Deletion Syndrome and Autism Spectrum Disorder.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, there is evidence that these neuronal IgCAMs possess
      overlapping interactomes and participate in common signaling pathways
      regulating axon guidance.
    explanation: >-
      Supports treating the three genes as acting on one shared cellular process
      rather than three independent ones.
  - reference: PMID:33519384
    reference_title: >-
      Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated
      in 3p-Deletion Syndrome and Autism Spectrum Disorder.
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, mouse models deficient for these neuronal IgCAMs do not display
      strong deficits in axonal migration or behavioral phenotypes, which is in
      contrast to the pronounced defects in neuritogenesis and axon guidance
      observed in vitro.
    explanation: >-
      A negative result against this node as stated: single-gene knockout mice do
      not show the deficit. Kept as a REFUTE item rather than dropped, because it
      is the substance of the human-model mismatch recorded in discussions.
  downstream:
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways
        Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CNVs disrupting these neuronal IgCAMs may contribute toward ASD
        phenotypes as they have been associated with key roles in
        neurodevelopment.
      explanation: >-
        Marked INDIRECT because the review states a possible contribution
        inferred from gene function, not a demonstrated causal link.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways
        Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This suggests that CNVs disrupting genes encoded within the 3p26.3 region
        are likely to contribute toward the neurodevelopmental phenotypes
        observed in individuals affected by Del3p.
      explanation: >-
        Marked INDIRECT because the attribution is inferred from CNV frequency in
        the region rather than measured against deletion boundaries.
- name: Loss of BRPF1-Dependent Histone Acetylation
  description: >-
    BRPF1 sits at 3p25.3 immediately adjacent to SETD5 and is lost in the larger
    deletions. It is a chromatin regulator that scaffolds the MOZ, MORF and HBO1
    acetyltransferases and is required for acetylation of histone H3 at lysine
    23. The cited source proposes this branch as a third contributor to the
    neurodevelopmental and dysmorphic phenotype, and specifically to ptosis
    through a role in craniofacial development.

    This node is deliberately weaker than the SETD5 and SRGAP3 branches beside
    it. The source hedges every causal statement it makes about BRPF1 ("may lead
    to", "can cause"), and its own patient analysis attributes only intellectual
    disability and ptosis to the BRPF1 deletion while explicitly excluding the
    hearing, renal and gastrointestinal features. The edges below are graded to
    match that hedging rather than to assert more than the source does.
  role: mechanism
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: histone H3K23 acetyltransferase activity
    term:
      id: GO:0043994
      label: histone H3K23 acetyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:33643973
    reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When missing BRPF1, variant histone H3 acetylation in H3K23 and propionyl
      defects affect chromatin modification after translation.
    explanation: >-
      States the molecular consequence of BRPF1 loss that this node represents.
  notes: >-
    Recorded as a contributing branch, not as the driver of the syndrome. BRPF1
    has its own single-gene entry (BRPF1-Related_Intellectual_Disability); this
    node covers only its contribution as a co-deleted gene.
  downstream:
  - target: Ptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33643973
      reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the BRPF1 gene plays a role in craniofacial development, and it has also
        been confirmed that a lack of BRPF1 can cause ptosis and (or) narrow
        palpebral fissure
      explanation: >-
        The source's statement of the BRPF1-ptosis link. Marked INDIRECT because
        the source hedges with "can cause" and reaches the claim through a
        craniofacial-development role rather than through a demonstrated
        mechanism in these patients; the intermediates are not identified, which
        is why the edge is INDIRECT_UNKNOWN_INTERMEDIATES.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33643973
      reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        BRPF1 deletion may lead to intellectual disability and abnormal facial
        features, such as ptosis
      explanation: >-
        Marked INDIRECT because the source hedges with "may lead to". Note the
        same paper reports SETD5 and SRGAP3 as the established critical-region
        genes for intellectual disability, so this branch is offered as an
        additional contributor rather than as a competing assignment.
    - reference: PMID:33643973
      reference_title: "Case Report: A Case Report and Literature Review of 3p Deletion Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the present case, the heterozygous deletion of BRPF1 appeared to have
        led to intellectual disability and ptosis, but not to hearing
        abnormalities or renal and gastrointestinal malformations
      explanation: >-
        The source's own per-patient attribution, which bounds this branch: it
        reaches intellectual disability and ptosis and explicitly does not reach
        the hearing, renal or gastrointestinal features. Marked INDIRECT because
        "appeared to have led to" is an inference from one patient.
- name: Haploinsufficiency of a 3p25.3 Cardiac Susceptibility Locus
  description: >-
    Congenital heart disease in 3p- syndrome tracks with how far proximally the
    deletion extends, and microarray mapping refined a candidate cardiac
    susceptibility interval to roughly 200 kb - a region distinct from the
    neurodevelopmental critical interval. The gene has not been identified. CAV3
    has been raised as a positional candidate in individual cases, but the entry
    does not assert it: the strongest such report reaches CAV3 by proximity and
    in silico reasoning after a karyotype that could not resolve the breakpoint.
  role: mechanism
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: DECREASED
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously we reported on an association between the presence of CHD and
      the proximal extent of the deletion such that a CHD susceptibility gene was
      mapped between D3S1263 and D3S3594.
    explanation: >-
      The mapping result that makes this a locus rather than a guess, and ties
      the cardiac phenotype to deletion extent.
  - reference: PMID:22965684
    reference_title: >-
      Interstitial 3p25.3-p26.1 deletion in a patient with intellectual
      disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletion overlaps with a slightly larger deletion in a girl with a more
      complex phenotype including congenital heart defect and epilepsy, which
      indicates that haploinsufficiency of one or several of the genes in the
      deleted interval causes intellectual deficits, but not heart defects or
      epilepsy.
    explanation: >-
      A boundary comparison separating the cognitive from the cardiac
      contribution, supporting a distinct cardiac locus.
  notes: >-
    CAV3 is deliberately not bound as the causal gene on this node. The report
    that argues for it does so from locus proximity after a karyotype whose
    resolution it acknowledges as a limitation, and describes the relation as
    indirect; that is a positional candidate, not an established gene-phenotype
    assertion. CAV3 is recorded in the genetic section as SUSCEPTIBILITY instead.
  downstream:
  - target: Atrioventricular septal defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19760623

      with a flat occiput, triangular face, synophrys, blepharoptosis,
      hypertelorism, broad and flat nose, long philtrum, down-turned mouth,
      micrognathia, apparently lowset and malformed ears, fingers abnormalities,
      and deafness.
    explanation: >-
      Records lowset ears in a patient with the classic 3p25.3 deletion.

name: 3p- Syndrome
creation_date: "2026-09-09T14:00:00Z"
category: Genetic
parents:
- Contiguous Gene Deletion Syndrome
- Neurodevelopmental Disorder
disease_term:
  preferred_term: 3p- syndrome
  term:
    id: MONDO:0013424
    label: 3p- syndrome
synonyms:
- chromosome 3pter-p25 deletion syndrome
- distal monosomy 3p
- del(3p) syndrome
- 3p deletion syndrome
- distal 3p deletion
- partial deletion of the short arm of chromosome 3
description: >-
  3p- syndrome results from a heterozygous terminal or interstitial deletion of distal chromosome
  3p. The classic terminal deletion spans 3p25 to 3pter. Developmental delay, intellectual
  disability, growth impairment, hypotonia and craniofacial differences are characteristic,
  with variable cardiac, renal, gastrointestinal and limb malformations. Deletion boundaries
  and gene content differ among patients, and even relatives carrying the same deletion can
  differ substantially in clinical expression.

  SETD5 and BRPF1 have direct human genetic evidence for contributions to the neurodevelopmental
  phenotype. SRGAP3 and the distal CHL1/CNTN6/CNTN4 neuronal adhesion genes remain proposed
  additional contributors. Cardiac susceptibility mapping is conditional and has not established
  a single causal gene. This entry covers the multigene deletion; intragenic SETD5 and BRPF1
  disorders are curated separately.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A constitutional chromosomal deletion syndrome; the primary clinical home
      is clinical genetics and dysmorphology rather than any single organ system.
    evidence:
    - reference: PMID:21457564
      reference_title: >-
        Microarray based analysis of an inherited terminal 3p26.3 deletion,
        containing only the CHL1 gene, from a normal father to his two affected
        children.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        terminal deletions of the distal portion of the short arm of chromosome 3
        cause a rare contiguous gene disorder characterized by growth
        retardation, developmental delay, mental retardation, dysmorphisms,
        microcephaly and ptosis
      explanation: >-
        Characterises the condition as a contiguous gene disorder arising from a
        chromosomal deletion, which is the basis for this Part assignment.
  - classification_value: NEUROLOGIC
    notes: >-
      Developmental delay, intellectual disability and hypotonia are prominent but variably
      expressed neurological manifestations.
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways
        Implicated in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Deletions occurring at chromosome 3p result in 3p-deletion syndrome
        (Del3p), a rare genetic disorder characterized by developmental delay,
        intellectual disability, facial dysmorphisms and often, ASD or
        ASD-associated behaviors.
      explanation: >-
        Names the neurodevelopmental features as the defining characteristics of
        the syndrome.
      quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Heterozygous Deletion of Distal Chromosome 3p
  description: >-
    Constitutional loss of one copy of a variable distal 3p interval initiates the disorder.
    A cytogenetically ascertained series had deletions of approximately 6–12 Mb; later molecular
    studies identified much smaller interstitial deletions, including a 148 kb SETD5-containing
    deletion. Terminal and interstitial deletions do not all remove the same genes.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:19760623
    reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletion size varied from approximately 6 to 12 Mb."
    explanation: >-
      Quantifies the size range across a microarray-characterised series, which
      is the variability this node records.
  - reference: PMID:25138099
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sizes of the interstitial deletions in 3p25.3 ranged from 148 kb in individual 3
      (containing four genes) and 371 kb (individual 4, 10 genes) to 2.45 Mb (individual 5,
      46 genes). The terminal deletion in individual 6 comprised 11.16 Mb and 71 genes.
    explanation: >-
      Direct molecular characterization of three interstitial deletions and one terminal deletion;
      the size range is specific to these four patients.
    reference_title: >-
      Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype
      of microdeletion 3p25.3 syndrome.
  downstream:
  - target: Reduced SETD5 Dosage
    causal_link_type: DIRECT
    description: >-
      Applies when the deletion encompasses the gene or genes represented by this branch.
    evidence:
    - reference: PMID:24680889
      reference_title: >-
        De novo loss-of-function mutations in SETD5, encoding a methyltransferase
        in a 3p25 microdeletion syndrome critical region, cause intellectual
        disability.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The individuals with SETD5 mutations showed phenotypic similarity to those
        previously reported with a deletion in 3p25, and thus loss of SETD5 might
        be sufficient to account for many of the clinical features observed in this
        condition.
      explanation: >-
        The comparison of intragenic variants against deletions that makes SETD5
        the principal driver, hedged by the authors as many of rather than all the
        features - which is why this entry keeps other loci.
  - target: Reduced BRPF1 Dosage
    causal_link_type: DIRECT
    description: >-
      Applies when the deletion encompasses the gene or genes represented by this branch.
    evidence:
    - reference: PMID:27939639
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We conclude that both genes contribute to the phenotypic severity of 3p25 deletion
        syndrome but that some specific features, such as ptosis and blepharophimosis, are
        mostly driven by BRPF1 haploinsufficiency.
      explanation: >-
        Human comparison supports contributions from both genes, particularly BRPF1-associated
        eyelid features.
      reference_title: >-
        Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form of
        Intellectual Disability with Associated Ptosis.
  - target: Reduced SRGAP3 Dosage
    causal_link_type: DIRECT
    description: >-
      Applies when the deletion encompasses the gene or genes represented by this branch.
    evidence:
    - reference: PMID:12195014
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By fluorescence in situ hybridization and loss of heterozygosity analysis, we demonstrated
        that this gene resides on chromosome 3p25 and is deleted in 3p(-) patients that present
        MR.
      explanation: >-
        Patient deletion mapping supports loss of one copy but does not itself demonstrate
        reduced GAP activity.
      reference_title: >-
        The novel Rho-GTPase activating gene MEGAP/ srGAP3 has a putative role in severe mental
        retardation.
  - target: Reduced Dosage of Distal 3p26.3 Neuronal Adhesion Genes
    causal_link_type: DIRECT
    description: >-
      Applies when the deletion encompasses the gene or genes represented by this branch.
    evidence:
    - reference: PMID:33519384
      reference_title: >-
        Cell Adhesion Molecules Involved in Neurodevelopmental Pathways Implicated
        in 3p-Deletion Syndrome and Autism Spectrum Disorder.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        The 3p26.3 region contains three consecutive genes encoding closely related
        neuronal immunoglobulin cell adhesion molecules (IgCAMs): Close Homolog of
        L1 (CHL1), Contactin-6 (CNTN6), and Contactin-4 (CNTN4).
      explanation: >-
        Names the gene content of the region, which is what this node asserts is
        lost together.
      quote_role: REVIEW_SYNTHESIS
  - target: Disrupted Cardiac Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Some deletions are associated with congenital heart defects; conditional mapping leaves
      the molecular intermediates unresolved.
    evidence:
    - reference: PMID:19760623
      reference_title: "Microarray based analysis of 3p25-p26 deletions (3p- syndrome)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Assuming complete penetrance, a candidate critical region for a CHD
        susceptibility gene was refined to approximately 200 kb and a candidate
        critical region for mental retardation was mapped to an approximately 1
        Mb interval containing SRGAP3
      explanation: >-
        Maps the cardiac and neurodevelopmental critical regions separately,
        which is the direct basis for splitting these two branches.
  - target: Deletion Including the VHL Locus
    causal_link_type: DIRECT
    description: >-
      This branch applies only when deletion boundaries include the VHL locus, rather than
      to every distal 3p deletion.
    evidence:
    - reference: PMID:26365017
      reference_title: A case of 3p deletion syndrome associated with cerebellar hemangioblastoma.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        We identified de novo 3p deletion encompassing p25 by using array-based comparative
        genomic hybridization, where causative gene of von Hippel-Lindau (VHL) disease located.
      explanation: >-
        Array-CGH demonstrated a deletion extending through the 3p25 region containing VHL
        in this affected individual.
- name: Reduced SETD5 Dosage
  description: >-
    Loss of one genomic copy of SETD5 reduces functional gene dosage. Human intragenic loss-of-function
    variants and SETD5-containing deletions share intellectual disability and facial features.
    CRISPR/Cas9 models in HEK293 cells supported nonsense-mediated decay for two modelled
    variants; this was not a measurement of every patient allele or of an exact 50% protein
    concentration.
  role: mechanism
  biological_scale: MOLECULAR
  genes:
  - &id001
    preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  evidence:
  - reference: PMID:24680889
    reference_title: >-
      De novo loss-of-function mutations in SETD5, encoding a methyltransferase
      in a 3p25 microdeletion syndrome critical region, cause intellectual
      disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individuals with SETD5 mutations showed phenotypic similarity to those
      previously reported with a deletion in 3p25, and thus loss of SETD5 might
      be sufficient to account for many of the clinical features observed in this
      condition.
    explanation: >-
      The comparison of intragenic variants against deletions that makes SETD5
      the principal driver, hedged by the authors as many of rather than all the
      features - which is why this entry keeps other loci.
  - reference: PMID:25138099
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      CRISPR/Cas9 mutation modelling of the two intragenic variants demonstrated nonsense-mediated
      decay of the resulting transcripts, pointing to a loss-of-function (LoF) and haploinsufficiency
      as the common disease-causing mechanism of intragenic SETD5 sequence variants and SETD5-containing
      microdeletions.
    explanation: >-
      Engineered cell models support loss of function as the shared mechanism; patient phenotypes
      independently establish the clinical association.
    reference_title: >-
      Loss-of-function variants of SETD5 cause intellectual disability and the core phenotype
      of microdeletion 3p25.3 syndrome.
  downstream:
  - target: Altered SETD5-Dependent Transcription
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced Setd5 dosage altered transcription in experimental models.
    evidence:
    - reference: PMID:30455454
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our data additionally indicate that Setd5 regulates RNA polymerase II dynamics and
        gene transcription via its interaction with the Hdac3 and Paf1 complexes, findings
        potentially explaining the gene expression defects observed in Setd5-haploinsufficient
        mice.
      explanation: >-
        Mouse and engineered-cell experiments connect Setd5 deficiency to transcriptional
        dysregulation; the recovered author manuscript supplies the assay and genotype details.
      reference_title: >-
        Haploinsufficiency of the intellectual disability gene SETD5 disturbs developmental
        gene expression and cognition.
    - reference: url:https://research-explorer.ista.ac.at/download/3/6255/2017_NatureNeuroscience_Deliu.pdf
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Immunopr ecipitation coupled with quantitative 253

        mass spectrometry in ESCs and ESC-der ived NPCs revealed that endogenous 254

        Setd5 is bound to two distinct protein complexes, Hdac3 and Paf1 (Fig. 5d,e, 255

        Supplementary Table 7 Supplementary Fig. 9g).
      explanation: >-
        Immunoprecipitation and mass spectrometry identify Hdac3/Paf1 interactions in mouse
        embryonic stem cells and derived neural progenitor cultures. This is a cellular experiment,
        distinct from the live-mouse behavioral evidence. The exact quote preserves manuscript
        extraction spacing and printed line numbers.
      reference_title: >-
        https://research-explorer.ista.ac.at/download/3/6255/2017_NatureNeuroscience_Deliu.pdf
- name: Altered SETD5-Dependent Transcription
  description: >-
    Setd5 interacts with Hdac3 and Paf1 complexes in mouse embryonic stem cells and neural
    progenitors. Setd5 deficiency redistributes RNA polymerase II and alters developmental
    gene expression. The 2018 study found both increases and decreases in transcriptional
    measures, without reduced Hdac3 enzymatic activity or a major loss of its chromatin recruitment.
    Selected patient truncations impaired complex interactions in engineered cells. These
    experiments support altered transcriptional regulation; they do not establish uniform
    chromatin repression or an intrinsic SETD5 methyltransferase mechanism in human neurons.

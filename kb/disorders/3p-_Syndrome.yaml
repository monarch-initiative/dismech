genetic:
- name: SETD5
  notes: >-
    The driver of the neurodevelopmental core. SETD5 lies inside the 124 kb
    minimal region shared by the smallest 3p25.3 interstitial deletions, and
    intragenic loss-of-function variants reproduce that core without any
    deletion - which is why the single-gene disorder is curated separately as
    SETD5_Haploinsufficiency_Syndrome (MONDO:0014336). Reproducing that entry's
    mechanism content here would duplicate it; this entry records only the part
    that bears on the deletion.
  gene_term:
    preferred_term: SETD5
    term:
      id: hgnc:25566
      label: SETD5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:24680889
    reference_title: >-
      De novo loss-of-function mutations in SETD5, encoding a methyltransferase
      in a 3p25 microdeletion syndrome critical region, cause intellectual
      disability.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individuals with SETD5 mutations showed phenotypic similarity to those
      previously reported with a deletion in 3p25, and thus loss of SETD5 might
      be sufficient to account for many of the clinical features observed in this
      condition.
    explanation: >-
      The comparison of intragenic variants against deletions that makes SETD5
      the principal driver, hedged by the authors as many of rather than all the
      features - which is why this entry keeps other loci.
  - reference: PMID:24680889
    reference_title: >-

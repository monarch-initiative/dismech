name: 3p- Syndrome
creation_date: "2026-09-09T13:20:42Z"
category: Genetic
synonyms:
- chromosome 3pter-p25 deletion syndrome
- distal 3p deletion syndrome
- distal monosomy 3p
- partial monosomy 3p
- del(3p) syndrome
- deletion 3p25
- chromosome 3, monosomy 3p25
description: >-
  3p- syndrome is a contiguous gene deletion syndrome caused by a heterozygous
  deletion of the distal short arm of chromosome 3, classically 3p25 to the
  telomere. OMIM catalogues it as 613792 and Orphanet as ORPHA:1620. Reported
  deletions run from a few hundred kilobases to roughly 12 Mb and remove
  anywhere from a handful to more than seventy genes, so the entry describes one
  initiating lesion whose downstream consequences are set by which
  dosage-sensitive genes the individual breakpoints happen to remove.

  The recurrent clinical core is pre- and postnatal growth restriction,
  developmental delay and intellectual disability, hypotonia, microcephaly, and
  a facial gestalt of ptosis, telecanthus, long philtrum, micrognathia and
  low-set ears. Beyond that core the phenotype fractionates by gene content, and
  that fractionation is what this entry models. Terminal deletions carry the
  neuronal immunoglobulin cell adhesion molecules CHL1, CNTN6 and CNTN4 at
  3p26.3; slightly more proximal ones carry the chromatin regulators SETD5 and
  BRPF1 and the SLIT-ROBO GTPase-activating protein SRGAP3 at 3p25.3; the
  calcium pump ATP2B2 sits inside a 1.38 Mb hearing loss locus in the same band;
  the GABA transporters SLC6A1 and SLC6A11 account for an epilepsy and EEG
  signature; and the proximal end of the interval carries a congenital heart
  disease locus and the VHL tumour suppressor.

  Most deletions arise de novo, but a minority segregate from a parent carrying
  a balanced rearrangement, and small distal deletions have been transmitted
  through three generations with no phenotype at all. There is no
  disease-modifying treatment; management is developmental therapy, cardiac
  surgery where indicated, hearing habilitation, seizure control, and genetic
  counselling that includes parental karyotyping.

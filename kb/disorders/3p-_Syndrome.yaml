- name: VHL Haploinsufficiency
  description: >-
    Deletions extending to 3p25.3 remove one copy of VHL, the tumour suppressor
    whose biallelic inactivation causes von Hippel-Lindau disease. A patient
    with 3p- syndrome therefore carries a constitutional first hit at the locus
    from birth, in the same configuration as a person with germline VHL disease,
    without carrying the point variants that define that entity.
  biological_scale: MOLECULAR

- name: Latent Second-Hit Tumor Susceptibility
  description: >-
    With one VHL allele already absent in every cell, a somatic hit at the
    remaining allele is sufficient for a VHL-type lesion. In practice this is
    rarely realised: the two 1990s breakpoint series that identified deleted
    patients found no VHL disease in any of them at the time of writing. It is
    not merely theoretical either. A cerebellar hemangioblastoma was resected at
    age 16 from a woman with a de novo 3p deletion encompassing p25, and no
    other VHL-associated tumour had appeared by age 24. The magnitude of the
    risk is unquantified, which is the substance of the surveillance discussion
    attached to this node.

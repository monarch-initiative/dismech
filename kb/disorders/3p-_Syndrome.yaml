    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal deletion of chromosome 3p25-pter (3p- syndrome) produces a distinct
      clinical syndrome characterized by low birth weight, mental retardation,
      telecanthus, ptosis, and micrognathia.
    explanation: >-
      Lists the cognitive impairment among the defining features of the syndrome.
- name: Global developmental delay
  category: Neurological

  - target: Impaired BRPF1 Acetyltransferase Complex Assembly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of BRPF1 is expected to compromise its scaffolding function; the cited functional
      assay tests a truncating variant.
    evidence:

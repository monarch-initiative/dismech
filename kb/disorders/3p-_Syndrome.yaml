- name: Reduced BRPF1 Dosage
  description: >-
    BRPF1-containing deletions and heterozygous intragenic loss-of-function variants support
    a contribution to intellectual disability and eyelid abnormalities. In a small genotype–phenotype
    comparison, five individuals with both BRPF1 and SETD5 deleted had more severe walking
    and speech delay than individuals with only one gene affected. The study used one index
    person per family and heterogeneous clinical assessments; it does not establish a universal
    severity rule.
  role: mechanism
  biological_scale: MOLECULAR

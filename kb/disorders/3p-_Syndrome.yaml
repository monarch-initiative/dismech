- name: Surgical Repair of Congenital Heart Defect
  description: >-
    Cardiac intervention is determined by the structural lesion and clinical condition. In
    the reported infant with hypoplastic left heart syndrome, surgery was performed at five
    days of age and the infant died at six days. This case documents treatment but does not
    establish a survival benefit or a syndrome-specific surgical standard.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: congenital cardiac surgical repair
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  evidence:
  - reference: PMID:39841745
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical intervention was performed when the patient was 5 days old.
    explanation: >-
      Direct report of surgery in the affected infant; the surrounding case history records
      death the following day.
    reference_title: >-
      First report of hypoplastic left heart syndrome in 3p- syndrome and review of candidate
      genes.
  notes: >-
    The cited report does not specify a named operation. No comparative surgical outcome estimate

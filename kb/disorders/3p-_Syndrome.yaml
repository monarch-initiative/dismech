- name: Loss of the 3p25 Cardiac Septation Locus
  description: >-
    A congenital heart disease susceptibility locus lies at the proximal end of
    the interval, so it is engaged only by the larger deletions. Successive
    mapping studies narrowed it between markers D3S1263 and D3S3594 and then to

biochemical:
- name: Serum IgM
  presence: DECREASED
  biomarker_term:
    preferred_term: Decreased serum IgM
    term:
      id: HP:0002850
      label: Decreased circulating total IgM
  notes: >-
    The defining measurement. Mean serum IgM was 33 mg/dL in a 48-patient
    pediatric cohort. IgM concentration is not static over time: longitudinal
    analysis distinguishes chronic, intermittent, progressive and resolved
    courses, so a single measurement may not describe the patient's state.
  evidence:
  - reference: PMID:37728524
    reference_title: "Clinical and immunological phenotypes of selective IgM deficiency in children: Results from a multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-eight patients with SIgMD were included (mean serum IgM: 33 mg/dL)."
    explanation: >-
      Gives the measured mean in a defined cohort.
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal analysis revealed a dynamic course of IgM concentrations over time, allowing classification into chronic, intermittent, progressive, and resolved subtypes."
    explanation: >-
      Shows the defining measurement is not stable within a patient, which bears
      directly on whether a single-timepoint criterion can define an entity.
- name: Serum IgG and IgA
  presence: NORMAL
  notes: >-
    Preservation of the other isotypes is what makes the deficiency selective,
    and is required by both definitions. Not permanently guaranteed: in a
    pediatric cohort with long-term follow-up, 87% preserved the diagnosis while
    two patients went on to develop reduced IgA as well.
  evidence:
  - reference: PMID:37728524
    reference_title: "Clinical and immunological phenotypes of selective IgM deficiency in children: Results from a multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen patients had long-term follow-up, during which 87% preserved their SIgMD diagnosis, while two patients showed a reduction in IgA in addition to low IgM."
    explanation: >-
      Quantifies diagnostic stability over follow-up and names the mode of
      transition out of the category.
- name: Isohemagglutinin titers
  presence: DECREASED
  notes: >-
    Very low in every patient tested in a 17-patient cohort and in 18 of 21
    published cases. This is a functional readout of natural-antibody capacity,
    which is IgM's characteristic role, so it is the laboratory correlate that
    sits closest to the defining deficit without asserting a mechanism for it.
  evidence:
  - reference: PMID:28730517
    reference_title: "Selective IgM Deficiency: Clinical and Laboratory Features of 17 Patients and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that some patients in our cohort (OC) and published cases (PC) had increased IgE levels (OC 7/15; PC 21/37), decreased IgG4 levels (OC 5/14), very low titers of isohemagglutinins (OC 8/8; PC 18/21), increased transitional B cell counts (OC 8/9), decreased marginal zone B cell counts (OC 8/9), and increased 21low B cell counts (OC 7/9)."
    explanation: >-
      Reports the isohemagglutinin result alongside the other laboratory
      correlates, with per-patient denominators.
- name: Marginal zone B cells
  presence: DECREASED
  notes: >-
    Decreased in 8 of 9 tested. Marginal zone B cells are a principal source of
    natural IgM, so the association is suggestive - but the source's own
    conclusion is that the pathogenic mechanism remains unclear, and this entry
    does not curate the inference as a mechanism.
  evidence:
  - reference: PMID:28730517
    reference_title: "Selective IgM Deficiency: Clinical and Laboratory Features of 17 Patients and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that some patients in our cohort (OC) and published cases (PC) had increased IgE levels (OC 7/15; PC 21/37), decreased IgG4 levels (OC 5/14), very low titers of isohemagglutinins (OC 8/8; PC 18/21), increased transitional B cell counts (OC 8/9), decreased marginal zone B cell counts (OC 8/9), and increased 21low B cell counts (OC 7/9)."
    explanation: >-
      Reports the marginal zone B cell reduction with its denominator.
- name: Transitional and CD21low B cells
  presence: INCREASED
  notes: >-
    Both increased in 7-8 of 9 tested. Recorded as reproducible laboratory
    correlates of the entity, not as steps in a pathway.
  evidence:
  - reference: PMID:28730517
    reference_title: "Selective IgM Deficiency: Clinical and Laboratory Features of 17 Patients and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that some patients in our cohort (OC) and published cases (PC) had increased IgE levels (OC 7/15; PC 21/37), decreased IgG4 levels (OC 5/14), very low titers of isohemagglutinins (OC 8/8; PC 18/21), increased transitional B cell counts (OC 8/9), decreased marginal zone B cell counts (OC 8/9), and increased 21low B cell counts (OC 7/9)."
    explanation: >-
      Reports both B cell subset increases with their denominators.
- name: Serum IgE
  presence: INCREASED
  notes: >-
    Raised in roughly half of those tested in both the cohort and the published
    cases. Consistent with the atopic manifestations that dominate the adult
    clinical picture.
  evidence:
  - reference: PMID:28730517
    reference_title: "Selective IgM Deficiency: Clinical and Laboratory Features of 17 Patients and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that some patients in our cohort (OC) and published cases (PC) had increased IgE levels (OC 7/15; PC 21/37), decreased IgG4 levels (OC 5/14), very low titers of isohemagglutinins (OC 8/8; PC 18/21), increased transitional B cell counts (OC 8/9), decreased marginal zone B cell counts (OC 8/9), and increased 21low B cell counts (OC 7/9)."
    explanation: >-
      Reports the IgE elevation in both the authors' cohort and the reviewed
      published cases.
treatments:
- name: Prophylactic Antibiotics
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Continuous or intermittent antibiotic prophylaxis in patients with recurrent
    infection. Listed by the defining review as its own intervention, separate
    from treating an acute febrile episode, and stated without the hedging it
    applies to immunoglobulin replacement. There is no treatment for the IgM
    deficiency itself.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prophylactic antibiotics and the prompt treatment of febrile illness are crucial."
    explanation: >-
      The review's unhedged statement, covering prophylaxis - the half this
      record is scoped to. The same sentence supports the separate
      prompt-treatment record below, which Table 6 lists as its own row.
    quote_role: REVIEW_SYNTHESIS
- name: Prompt Treatment of Febrile Illness
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Early antimicrobial treatment of an acute febrile episode rather than
    watchful waiting. Table 6 lists this separately from prophylaxis, and the
    distinction is real: one reduces the rate of infection, the other limits the
    consequences of an infection already under way. Its Notes cell is empty, so
    the review gives no further qualification.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prophylactic antibiotics and the prompt treatment of febrile illness are crucial."
    explanation: >-
      The same unhedged sentence, covering the prompt-treatment half.
    quote_role: REVIEW_SYNTHESIS
- name: Immunoglobulin Replacement (Restricted Indication)
  therapeutic_modality: OTHER
  description: >-
    Not routine therapy. It is recommended only for patients with significantly
    associated antibody deficiency or with recurrent or severe infections - so
    the indication is for the associated antibody defect, not for the IgM
    deficiency, which immunoglobulin products do not correct. Where it is given
    on that restricted indication, response is reported.
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "for most SIgMD patients, Ig replacement therapy (IgGRT) is not required"
    explanation: >-
      The first half of the restriction: not indicated for the majority. Quoted
      as a span rather than the whole sentence because the sentence carries an
      inline citation marker that the reference validator normalizes away.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it may be recommended for patients with significantly associated antibody deficiency or recurrent or severe infections"
    explanation: >-
      The second half: the named subgroup for whom it is recommended. This is
      what the treatment record is scoped to.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:31970029
    reference_title: "Comprehensive clinical and immunological features of 62 adult patients with selective primary IgM deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen (66%) of 27 patients with specific antibody deficiency received immunoglobulin therapy and almost all subjects responded to immunoglobulin therapy by decreased frequency of infections."
    explanation: >-
      The observed response in the restricted-indication subgroup. Uncontrolled
      and retrospective, which is why the trial-data gap discussion stands.
- name: Vaccination
  therapeutic_modality: VACCINE
  description: >-
    Listed among the interventions that may benefit SIgMD patients. Note the
    entry's own diagnostic section records impaired specific antibody responses
    in part of this population, so vaccination is offered without an assumption
    that the response will be normal.
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Vaccination | Before the administration of attenuated vaccines, an evaluation of T cell function is advised. |"
    explanation: >-
      The vaccination row itself, which also carries the safety qualification
      that matters clinically: attenuated vaccines warrant T cell assessment
      first. Graded OTHER and REVIEW_SYNTHESIS because it is a review's
      compilation rather than a trial result.
    quote_role: REVIEW_SYNTHESIS
- name: Management of Atopic Disease
  therapeutic_modality: OTHER
  description: >-
    Allergic rhinitis and asthma are the two most frequent manifestations in
    adult series, ahead of infection, so managing them is a substantial part of
    care rather than an incidental comorbidity.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Management of atopic diseases | May be helpful in reducing the incidence of complicating sinopulmonary infections. |"
    explanation: >-
      The atopy row, which gives the reason as well as the recommendation:
      managing atopic disease is expected to reduce complicating sinopulmonary
      infection, so it bears on the infection burden rather than only on
      comfort.
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: Secondary IgM deficiency
  description: >-
    Protein-losing enteropathy, nephrotic syndrome and malignancy all lower
    serum IgM and must be excluded before a primary deficiency is diagnosed.
    This exclusion holds under both diagnostic definitions.
- name: Common variable immunodeficiency
  description: >-
    Low IgM can be the first isotype abnormality in evolving CVID. Follow-up is
    advised for exactly this reason, and the 75-patient series names CVID among
    the conditions patients may develop.
- name: Another inborn error of immunity with low IgM as a feature
  description: >-
    The most consequential differential, because it is common rather than rare:
    26% of a pediatric cohort with isolated IgM deficiency received a molecular
    diagnosis of a nameable IEI on testing, several of them without recurrent
    infections. Low IgM without a molecular diagnosis may mean the testing has
    not been done.
- name: Chromosomal disorder with associated IgM deficiency
  description: >-
    Chromosomopathies accounted for 16.2% of one arm of the 75-patient series,
    prompting the authors to recommend measuring serum IgM in those patients.
discussions:
- discussion_id: sigmd_no_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Persistently Reduced Serum IgM
  prompt: >-
    What causes selective IgM deficiency?
  rationale: >-
    Nothing upstream of the reduced IgM concentration is established. No gene,
    no cellular defect in B-cell terminal differentiation, and no regulatory
    mechanism has been shown to cause it, and the reviews say so in those terms.
    This entry therefore carries a single pathophysiology node with no parent,
    which is unusual for dismech and is the honest representation. Candidate
    mechanisms appear in the literature as speculation rather than as findings,
    and are deliberately not curated as nodes here: a plausible-looking chain
    with no evidence behind it would be worse than the gap, because it would
    look like knowledge.
- discussion_id: sigmd_is_it_one_entity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - definitions#IUIS definition
  - definitions#ESID working definition
  prompt: >-
    Is selective IgM deficiency one disease, a heterogeneous phenotype, or a
    laboratory finding?
  rationale: >-
    Three findings push against treating this as a single entity. The two
    diagnostic definitions in use disagree, and the 75-patient study that
    applied both to the same population found they select measurably different
    clinical profiles. IgM concentration is dynamic within a patient — chronic,
    intermittent, progressive and resolved courses are distinguishable — so a
    single-timepoint criterion does not identify a stable group. And 26% of one
    isolated-IgM-deficiency cohort had a different, nameable IEI on molecular
    testing, several without the infections the ESID definition requires. The
    2025 study concludes directly that a redefinition is warranted. Whether
    dismech should keep this as a Disease entry, or record it as a laboratory
    finding pending redefinition, follows from how that question resolves; it is
    curated as a Disease here on the strength of its IUIS classification and its
    reproducible phenotype associations, not on a mechanism.
- discussion_id: sigmd_infection_requirement
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Allergic Rhinitis
  - phenotypes#Asthma
  - phenotypes#Recurrent Respiratory Infection
  prompt: >-
    Should infection be a diagnostic criterion when allergy is the more frequent
    manifestation?
  rationale: >-
    The ESID definition requires infections. In the 75-patient series allergic
    rhinitis and asthma were more frequent than pulmonary infection under both
    criteria sets, and the 2025 cohort found cytopenia, lymphoproliferation,
    autoimmunity, allergy and inflammation similarly distributed in patients
    with and without infections. If the non-infectious manifestations are
    equally characteristic, an infection-requiring definition selects a subset
    for reasons of history rather than of biology, and systematically hides the
    rest.
- discussion_id: sigmd_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there trial evidence for any treatment directed at selective IgM
    deficiency?
  rationale: >-
    Four interventions are now curated, all from a review's compilation of what
    may benefit these patients, and none of them from a trial. The review says
    in as many words that no conclusive data on correct therapeutic management
    are available. So what is missing is not a described intervention - the
    earlier version of this discussion claimed that, and was wrong - but a
    controlled comparison of any of them. Note also that none of the four is
    directed at the IgM deficit itself: antibiotics and vaccination address
    infection risk, immunoglobulin replacement addresses an associated antibody
    deficiency where one is present, and atopy management addresses the
    commonest manifestations. A treatment that raises IgM, or that is shown to
    change outcome in an unselected SIgMD population, does not exist.
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No conclusive data on the correct therapeutic management of SIgMD are available."
    explanation: >-
      The statement of the gap, from the same review that supplies the four
      curated interventions.
    quote_role: REVIEW_SYNTHESIS
notes: >-
  `category: Acquired` rather than `Mendelian`, which is a deliberate departure
  from the seed value. No gene is established, MONDO records no causal gene for
  MONDO:0018039, and `Mendelian` would assert an inheritance model the
  literature explicitly says is not known.

  This entry has one pathophysiology node and it has no upstream parent. That is
  the finding, not an incomplete curation. The claim issue for this disease
  (#11867) anticipated that the honest outcome might be `OUT_OF_SCOPE`. It is
  curated as a Disease instead, on two grounds: the IUIS has classified it among
  the predominantly antibody deficiencies since 2017, and the phenotype
  associations reproduce across independent cohorts. The counter-argument is
  recorded as a discussion rather than settled here, because it turns on a
  redefinition the field has called for and not yet made.

  Candidate mechanisms — defective B-cell terminal differentiation,
  regulatory-T-cell suppression of IgM synthesis, and impaired
  class-switch-independent secretion — are deliberately absent from the
  pathograph. They appear in the literature as speculation, and a node without
  evidence behind it reads as knowledge once it is in the graph.

  `quote_role` is used heavily here and carries real weight in this entry. Four
  items are `BACKGROUND` or `REVIEW_SYNTHESIS` because much of what can be said
  about this entity comes from narrative reviews rather than from primary
  series. Without the marker, `evidence_source: OTHER` alone would not
  distinguish "a review synthesising others' work" from "a study whose design
  does not fit the enum", and for a disease whose evidence base is this thin
  that distinction is most of the information.

  The two prevalence records are not comparable and are deliberately kept
  separate rather than merged into a range. One is complete IgM deficiency in
  the general population; the other is a referred immunology-clinic population
  under varying criteria, whose own quoted range spans thirtyfold.

  The 67% recurrent-infection figure from PMID:37728524 is infection at any
  site, not respiratory specifically, and the phenotype description says so. The
  phenotype it is attached to is the respiratory one because that is what the
  reviews identify as the main manifestation; a curator wanting a
  respiratory-specific denominator should use the 27.0%/21.1% pulmonary figures
  from PMID:39680289 instead.

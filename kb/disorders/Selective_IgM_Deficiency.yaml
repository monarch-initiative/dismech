name: Selective IgM Deficiency
creation_date: "2026-09-15T13:18:10Z"
category: Acquired
description: >-
  Selective IgM deficiency is an inborn error of immunity defined by persistently
  absent or reduced serum IgM with preserved IgG and IgA, and with secondary
  causes such as protein-losing enteropathy, nephrotic syndrome and malignancy
  excluded. The IUIS has classified it among the predominantly
  antibody-affecting deficiencies since 2017. Recurrent respiratory infection is
  the commonest presentation, followed by allergic and autoimmune disease.

  This entry is unusual for dismech in that it has almost no pathograph, and the
  absence is the finding rather than a curation shortfall. The entity is defined
  by a laboratory value, not by a mechanism: no genetic or molecular basis has
  been established as a cause, the diagnostic criteria in use disagree with each
  other, and in one pediatric cohort of isolated IgM deficiency 26% of patients
  turned out on molecular testing to have a different, nameable inborn error of
  immunity. Its own literature calls for the definition to be redrawn.

  What is curated here is therefore the definitional state of the concept — two
  competing criteria sets recorded as `definitions`, the phenotype associations
  that are reproducible across cohorts, and the gaps stated as discussions
  rather than papered over with a plausible mechanism. Whether this should
  remain a Disease entry or become a laboratory finding is a live question, and
  the entry says so.
disease_term:
  preferred_term: selective IgM deficiency
  term:
    id: MONDO:0018039
    label: selective IgM deficiency
synonyms:
- SIgMD
- sIgMD
- selective immunoglobulin M deficiency
- isolated IgM deficiency
- selective IgM hypogammaglobulinemia
classifications:
  iuis_category:
    classification_value: predominantly antibody deficiency
    notes: >-
      Included in the IUIS classification of inborn errors of immunity since
      2017, among the predominantly antibody-affecting deficiencies. The
      classification is what makes this a curatable entity at all; the
      mechanism does not.
definitions:
- name: IUIS definition
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Absent serum IgM with preserved IgG and IgA concentrations. The permissive
    of the two definitions in use: it requires no infectious history and no
    vaccine-response testing.
  evidence:
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The IUIS defines sIgMD as absent serum IgM with preserved IgG and IgA concentrations"
    explanation: >-
      States the IUIS criterion verbatim.
- name: ESID working definition
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Substantially more stringent than the IUIS definition: IgM more than 2
    standard deviations below the age-matched mean, preserved IgG and IgA,
    infections present, normal IgG subclasses and vaccination responses, and
    T-cell defects excluded. Requiring infection as a criterion is what makes
    the two sets select different patients, and is the specific point the 2025
    cohort study challenges.
  evidence:
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ESID working criteria for clinical diagnosis of IEIs are even more stringent, requiring, along with IgM deficiency (<2 standard deviations [SD] below age-matched mean), preserved IgG and IgA, the presence of infections, normal concentrations of IgG subclasses and vaccination responses, and exclusion of T-cell defects"
    explanation: >-
      States the ESID criteria, including the infection requirement that
      distinguishes it from the IUIS definition.
- name: Exclusion of secondary causes
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Common to both definitions and independent of which is used. Protein-losing
    enteropathy, nephrotic syndrome and malignancy must be excluded before a
    primary deficiency is diagnosed.
  evidence:
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Irrespective of the definition, secondary causes such as protein-losing enteropathies, nephrotic syndrome, or malignancy have to be excluded."
    explanation: >-
      Establishes the exclusion requirement and that it holds under both
      definitions.
pathophysiology:
- name: Persistently Reduced Serum IgM
  biological_scale: ORGANISM
  description: >-
    The defining abnormality, and the only node this entry asserts. IgM is the
    first antibody isotype produced in a humoral response and has a central role
    in early immune defence, so a persistent deficit is mechanistically
    plausible as a cause of the infection phenotype. No step upstream of this
    node is established: no gene, no cellular defect in B-cell terminal
    differentiation, and no regulatory mechanism has been shown to cause it.
    The node is deliberately left without an upstream cause rather than given a
    speculative one.
  evidence:
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IgM plays a central role in early immune responses, yet the clinical significance of its deficiency remains poorly defined."
    explanation: >-
      States both halves of what this node can claim: the biological role of the
      missing isotype, and the fact that the consequence of losing it is not
      established. The sentence is the review's framing rather than its own
      result.
    quote_role: BACKGROUND
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogenesis of SIgMD remains elusive, and thus far no genetic nor molecular basis has been clearly established as a definitive cause of this primary immunodeficiency."
    explanation: >-
      The explicit statement that no upstream mechanism is known, which is why
      this node has no parent in the pathograph.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Recurrent Respiratory Infection
    description: >-
      The commonest clinical consequence. The association is reproducible across
      cohorts; the mechanistic step from low IgM to infection susceptibility is
      assumed from IgM's role in early responses rather than demonstrated in
      these patients.
phenotypes:
- category: Immunological
  name: Recurrent Respiratory Infection
  description: >-
    The main clinical manifestation in children, and the feature the ESID
    definition requires. Reported at 67% of a 48-patient pediatric cohort as
    recurrent infections of any kind; pulmonary infections specifically were
    27.0% and 21.1% in the two arms of a 75-patient adult-predominant series.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:37685399
    reference_title: "Selective IgM Deficiency: Evidence, Controversies, and Gaps."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recurrent respiratory infections represent the main clinical manifestations in children, followed by allergic and autoimmune diseases."
    explanation: >-
      Establishes the rank order of clinical associations.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37728524
    reference_title: "Clinical and immunological phenotypes of selective IgM deficiency in children: Results from a multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical manifestations were recurrent infections (67%) and allergies (48%)."
    explanation: >-
      Quantifies the association in a 48-patient pediatric cohort. Note the
      figure is recurrent infection of any site, not respiratory specifically.
- category: Immunological
  name: Allergic Disease
  description: >-
    Allergic rhinitis and asthma are consistently the most frequent
    manifestations in adult series — more frequent than infection in the
    75-patient study — which is one reason the infection-requiring ESID
    definition is contested.
  phenotype_term:
    preferred_term: Allergic rhinitis
    term:
      id: HP:0003193
      label: Allergic rhinitis
  evidence:
  - reference: PMID:39680289
    reference_title: "Selective IgM deficiency: evaluation of 75 patients according to different diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent clinical manifestations were allergic rhinitis (G1, 45.9%; G2, 36.8%), asthma (G1, 37.8%; G2, 28.9%), and pulmonary infections (G1, 27.03%; G2, 21.05%)."
    explanation: >-
      Gives the frequencies under both diagnostic criteria, and shows allergic
      manifestations outranking infection in this series under either.
- category: Immunological
  name: Autoimmunity
  description: >-
    Reported as the third commonest association after infection and allergy. The
    75-patient series advises follow-up specifically because of the risk of
    developing autoimmunity, neoplasia and common variable immunodeficiency.
  phenotype_term:
    preferred_term: Autoimmunity
    term:
      id: HP:0002960
      label: Autoimmunity
  evidence:
  - reference: PMID:39680289
    reference_title: "Selective IgM deficiency: evaluation of 75 patients according to different diagnostic criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the possibility of developing autoimmunity, neoplasia, and common variable immunodeficiency, it is advisable to follow up patients with SIgMD."
    explanation: >-
      Records the three longer-term risks that make follow-up advisable. The
      sentence is a recommendation drawn from the series rather than an incidence
      measurement.
    directness: INDIRECT
prevalence:
- population: General population (complete IgM deficiency)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 30.0
  notes: >-
    0.03%, normalised to 30 per 100,000. This is complete IgM deficiency in the
    general population, which is a narrower phenotype than either diagnostic
    definition selects.
  evidence:
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an estimated prevalence ranging from 0.03% (complete IgM deficiency) in the general population to 0.07–2.1% in immunology clinics"
    explanation: >-
      Source of both the general-population and the clinic figures.
    quote_role: BACKGROUND
- population: Immunology clinic attenders
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 70.0
  rate_low: 70.0
  rate_high: 2100.0
  notes: >-
    0.07-2.1%, normalised to 70-2100 per 100,000. The thirtyfold spread within a
    single sentence is itself the finding: this is a referred population, and
    the range reflects differing criteria and referral patterns rather than
    differing biology. Not comparable with the general-population figure above.
  evidence:
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an estimated prevalence ranging from 0.03% (complete IgM deficiency) in the general population to 0.07–2.1% in immunology clinics"
    explanation: >-
      Source of the clinic-population range.
    quote_role: BACKGROUND
biochemical:
- name: Serum IgM
  presence: DECREASED
  notes: >-
    The defining measurement. Mean serum IgM was 33 mg/dL in a 48-patient
    pediatric cohort. IgM concentration is not static over time: longitudinal
    analysis distinguishes chronic, intermittent, progressive and resolved
    courses, so a single measurement may not describe the patient's state.
  evidence:
  - reference: PMID:37728524
    reference_title: "Clinical and immunological phenotypes of selective IgM deficiency in children: Results from a multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-eight patients with SIgMD were included (mean serum IgM: 33 mg/dL)."
    explanation: >-
      Gives the measured mean in a defined cohort.
  - reference: PMID:41009569
    reference_title: "Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune Dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal analysis revealed a dynamic course of IgM concentrations over time, allowing classification into chronic, intermittent, progressive, and resolved subtypes."
    explanation: >-
      Shows the defining measurement is not stable within a patient, which bears
      directly on whether a single-timepoint criterion can define an entity.
- name: Serum IgG and IgA
  presence: NORMAL
  notes: >-
    Preservation of the other isotypes is what makes the deficiency selective,
    and is required by both definitions. Not permanently guaranteed: in a
    pediatric cohort with long-term follow-up, 87% preserved the diagnosis while
    two patients went on to develop reduced IgA as well.
  evidence:
  - reference: PMID:37728524
    reference_title: "Clinical and immunological phenotypes of selective IgM deficiency in children: Results from a multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen patients had long-term follow-up, during which 87% preserved their SIgMD diagnosis, while two patients showed a reduction in IgA in addition to low IgM."
    explanation: >-
      Quantifies diagnostic stability over follow-up and names the mode of
      transition out of the category.
differential_diagnoses:
- name: Secondary IgM deficiency
  description: >-
    Protein-losing enteropathy, nephrotic syndrome and malignancy all lower
    serum IgM and must be excluded before a primary deficiency is diagnosed.
    This exclusion holds under both diagnostic definitions.
- name: Common variable immunodeficiency
  description: >-
    Low IgM can be the first isotype abnormality in evolving CVID. Follow-up is
    advised for exactly this reason, and the 75-patient series names CVID among
    the conditions patients may develop.
- name: Another inborn error of immunity with low IgM as a feature
  description: >-
    The most consequential differential, because it is common rather than rare:
    26% of a pediatric cohort with isolated IgM deficiency received a molecular
    diagnosis of a nameable IEI on testing, several of them without recurrent
    infections. Low IgM without a molecular diagnosis may mean the testing has
    not been done.
- name: Chromosomal disorder with associated IgM deficiency
  description: >-
    Chromosomopathies accounted for 16.2% of one arm of the 75-patient series,
    prompting the authors to recommend measuring serum IgM in those patients.
discussions:
- discussion_id: sigmd_no_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Persistently Reduced Serum IgM
  prompt: >-
    What causes selective IgM deficiency?
  rationale: >-
    Nothing upstream of the reduced IgM concentration is established. No gene,
    no cellular defect in B-cell terminal differentiation, and no regulatory
    mechanism has been shown to cause it, and the reviews say so in those terms.
    This entry therefore carries a single pathophysiology node with no parent,
    which is unusual for dismech and is the honest representation. Candidate
    mechanisms appear in the literature as speculation rather than as findings,
    and are deliberately not curated as nodes here: a plausible-looking chain
    with no evidence behind it would be worse than the gap, because it would
    look like knowledge.
- discussion_id: sigmd_is_it_one_entity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - definitions#IUIS definition
  - definitions#ESID working definition
  prompt: >-
    Is selective IgM deficiency one disease, a heterogeneous phenotype, or a
    laboratory finding?
  rationale: >-
    Three findings push against treating this as a single entity. The two
    diagnostic definitions in use disagree, and the 75-patient study that
    applied both to the same population found they select measurably different
    clinical profiles. IgM concentration is dynamic within a patient — chronic,
    intermittent, progressive and resolved courses are distinguishable — so a
    single-timepoint criterion does not identify a stable group. And 26% of one
    isolated-IgM-deficiency cohort had a different, nameable IEI on molecular
    testing, several without the infections the ESID definition requires. The
    2025 study concludes directly that a redefinition is warranted. Whether
    dismech should keep this as a Disease entry, or record it as a laboratory
    finding pending redefinition, follows from how that question resolves; it is
    curated as a Disease here on the strength of its IUIS classification and its
    reproducible phenotype associations, not on a mechanism.
- discussion_id: sigmd_infection_requirement
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Allergic Disease
  prompt: >-
    Should infection be a diagnostic criterion when allergy is the more frequent
    manifestation?
  rationale: >-
    The ESID definition requires infections. In the 75-patient series allergic
    rhinitis and asthma were more frequent than pulmonary infection under both
    criteria sets, and the 2025 cohort found cytopenia, lymphoproliferation,
    autoimmunity, allergy and inflammation similarly distributed in patients
    with and without infections. If the non-infectious manifestations are
    equally characteristic, an infection-requiring definition selects a subset
    for reasons of history rather than of biology, and systematically hides the
    rest.
- discussion_id: sigmd_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there evidence for any treatment directed at selective IgM deficiency?
  rationale: >-
    No treatments are curated. The review consulted states that no conclusive
    data on correct therapeutic management are available, that immunoglobulin
    replacement is not required for most patients, and that where it is
    considered the indication is associated antibody deficiency and severe
    infection rather than the IgM deficit itself. Curating immunoglobulin
    replacement as a treatment for this entity would assert an evidence base
    that its own literature says does not exist.
notes: >-
  `category: Acquired` rather than `Mendelian`, which is a deliberate departure
  from the seed value. No gene is established, MONDO records no causal gene for
  MONDO:0018039, and `Mendelian` would assert an inheritance model the
  literature explicitly says is not known.

  This entry has one pathophysiology node and it has no upstream parent. That is
  the finding, not an incomplete curation. The claim issue for this disease
  (#11867) anticipated that the honest outcome might be `OUT_OF_SCOPE`. It is
  curated as a Disease instead, on two grounds: the IUIS has classified it among
  the predominantly antibody deficiencies since 2017, and the phenotype
  associations reproduce across independent cohorts. The counter-argument is
  recorded as a discussion rather than settled here, because it turns on a
  redefinition the field has called for and not yet made.

  Candidate mechanisms — defective B-cell terminal differentiation,
  regulatory-T-cell suppression of IgM synthesis, and impaired
  class-switch-independent secretion — are deliberately absent from the
  pathograph. They appear in the literature as speculation, and a node without
  evidence behind it reads as knowledge once it is in the graph.

  `quote_role` is used heavily here and carries real weight in this entry. Four
  items are `BACKGROUND` or `REVIEW_SYNTHESIS` because much of what can be said
  about this entity comes from narrative reviews rather than from primary
  series. Without the marker, `evidence_source: OTHER` alone would not
  distinguish "a review synthesising others' work" from "a study whose design
  does not fit the enum", and for a disease whose evidence base is this thin
  that distinction is most of the information.

  The two prevalence records are not comparable and are deliberately kept
  separate rather than merged into a range. One is complete IgM deficiency in
  the general population; the other is a referred immunology-clinic population
  under varying criteria, whose own quoted range spans thirtyfold.

  The 67% recurrent-infection figure from PMID:37728524 is infection at any
  site, not respiratory specifically, and the phenotype description says so. The
  phenotype it is attached to is the respiratory one because that is what the
  reviews identify as the main manifestation; a curator wanting a
  respiratory-specific denominator should use the 27.0%/21.1% pulmonary figures
  from PMID:39680289 instead.

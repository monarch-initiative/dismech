- name: Genetic Counseling With Germline Mosaicism Testing
  description: >-
    Recurrence-risk counselling has a specific technical component here. Around
    one in twelve reported cases arose through germline mosaicism, and in the
    documented family the variant was undetectable in either parent's blood by
    Sanger sequencing and by deep sequencing, and was found only by droplet
    digital PCR on urine-derived cells. A negative parental blood test therefore
    does not establish a de novo event.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40011607
    reference_title: "Germline mosaicism in TCF20-associated neurodevelopmental disorders: a case study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was not detected in DNA extracted from peripheral blood in either parent by Sanger sequencing of PCR-generated amplicons, or by deep sequencing of PCR amplicons using MiSeq and MinION."
    explanation: Documents that the standard parental tests were negative, which is what makes the counselling caveat concrete.
  - reference: PMID:40011607
    reference_title: "Germline mosaicism in TCF20-associated neurodevelopmental disorders: a case study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report is only the second to confirm with physical evidence TCF20 germline mosaicism and discusses germline mosaicism as a likely under-detected mode of inheritance in neurodevelopmental conditions."
    explanation: The authors' own framing that this mode of inheritance is under-detected, which is the reason to test for it rather than assume it away.

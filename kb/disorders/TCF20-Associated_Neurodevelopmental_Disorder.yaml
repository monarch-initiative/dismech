diagnosis:
- name: Trio exome sequencing
  description: >-
    The route by which nearly all reported patients were found. Trio design
    matters because most alleles are de novo, and because the alternative,
    inheritance from a mildly affected parent, is only visible when the parents
    are sequenced.
  evidence:
  - reference: PMID:30739909
    reference_title: "Variants in TCF20 in neurodevelopmental disability: description of 27 new patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe 27 patients, 26 of whom were identified via exome sequencing"
    explanation: Exome sequencing as the ascertainment route for 26 of 27 patients.
- name: Chromosomal microarray for deletions and duplications
  description: >-
    Sequencing alone misses the copy-number half of the spectrum. Microarray
    finds the whole-gene deletions and the reciprocal duplications, and both are
    part of the TCF20-associated disease picture.
  evidence:
  - reference: PMID:30819258
    reference_title: "De novo and inherited TCF20 pathogenic variants are associated with intellectual disability, dysmorphic features, hypotonia, and neurological impairments with similarities to Smith-Magenis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide analyses by exome sequencing (ES) and chromosomal microarray analysis (CMA) identified individuals with heterozygous, likely damaging, loss-of-function alleles in TCF20."
    explanation: Names both assays as the ones that identified the patient set.
differential_diagnoses:
- name: Smith-Magenis syndrome
  description: >-
    The nearest clinical neighbour, and not by coincidence. RAI1, the
    Smith-Magenis gene, is the structural relative of TCF20, and the two
    proteins share the chromatin-binding architecture. The overlap is close
    enough that the cohort paper defining TAND describes it in Smith-Magenis
    terms.
  evidence:
  - reference: PMID:30819258
    reference_title: "De novo and inherited TCF20 pathogenic variants are associated with intellectual disability, dysmorphic features, hypotonia, and neurological impairments with similarities to Smith-Magenis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCF20 encodes a transcriptional co-regulator structurally related to RAI1, the dosage-sensitive gene responsible for Smith-Magenis syndrome (deletion/haploinsufficiency) and Potocki-Lupski syndrome (duplication/triplosensitivity)."
    explanation: The paralogy that explains the clinical resemblance.
  - reference: PMID:22081970
    reference_title: "Identification of two independent nucleosome-binding domains in the transcriptional co-activator SPBP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "RAI1 contains a region with homology to the novel nucleosome-binding region SPBP-(1551-1666) and an ePHD/ADD domain with ability to bind nucleosomes."
    explanation: Shows the two proteins share the specific chromatin-binding domains, which grounds the paralogy at the molecular level. It is indirect because the work predates the TCF20 disease association.
- name: Rett syndrome and MECP2 duplication syndrome
  description: >-
    Reached through the shared chromatin complex rather than through shared gene
    family. Rett-causing MECP2 mutations disrupt the MeCP2-TCF20 interaction, and
    reducing Tcf20 partially rescued behavioural deficits caused by MECP2
    overexpression, so the relationship is functional and bidirectional.
  evidence:
  - reference: PMID:35074918
    reference_title: "Disruption of MeCP2-TCF20 complex underlies distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, RTT-causing mutations in MECP2 disrupt this interaction."
    explanation: Places Rett syndrome mutations on the same complex as TCF20.
  - reference: PMID:35074918
    reference_title: "Disruption of MeCP2-TCF20 complex underlies distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Reducing Tcf20 partially rescued the behavioral deficits caused by MECP2 overexpression, demonstrating a functional relationship between MeCP2 and TCF20 in MECP2 duplication syndrome pathogenesis."
    explanation: A rescue experiment establishing that the two act on the same axis in opposite directions.
- name: TCF20 duplication neurodevelopmental disorder
  description: >-
    The reciprocal dosage disorder, with mirror traits. It shares the gene and
    the locus, so a microarray finding of a 22q13.2 duplication rather than a
    deletion points here instead.
  evidence:
  - reference: PMID:34904221
    reference_title: "Rare and de novo duplications containing TCF20 are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that the TCF20 duplication could be involved in a new 22q13.2 microduplication syndrome with high penetrance, enlarging the genotype-phenotype knowledge of TCF20-associated NDDs."
    explanation: The proposal of the reciprocal syndrome as a distinct entity.
discussions:
- discussion_id: tand_dendritic_phenotype_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the dendritic and synaptic phenotype measured in TCF20-knockdown rodent
    cortical cultures account for the human developmental and autistic
    phenotype?
  attaches_to:
  - pathophysiology#Impaired Dendritic Arborization and Spine Formation
  rationale: >-
    The cellular mechanism is measured in rat cortical cultures under acute
    knockdown, not in a heterozygous animal and not in human neurons. That is a
    different genetic situation from the human disease, where one allele is lost
    from conception and the other is intact. The direction of the synaptic
    changes is also mixed rather than uniform, so the step from a reshaped
    synaptic composition to intellectual disability and autism is an inference.
    The entry types both edges out of this node as having unknown intermediates
    for that reason.
  evidence:
  - reference: PMID:39801227
    reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "synaptosomal preparations of knockdown TCF20 rat cortical cultures showed significant downregulation of GluN2B and GABRA5, while GluA2 was significantly upregulated"
    explanation: The mixed-direction result, in the knockdown system whose translational reach this gap questions.
- discussion_id: tand_germline_mosaicism_detection
  kind: KNOWLEDGE_GAP
  prompt: >-
    How often is an apparently de novo TCF20 variant actually parental germline
    mosaicism, and what tissue should be tested to find out?
  attaches_to:
  - genetic#TCF20
  rationale: >-
    Around 8% of reported cases are confirmed or suspected germline mosaicism,
    but only two have physical confirmation, and in the documented family blood
    testing of both parents was negative by Sanger and by deep sequencing. The
    variant was found only by droplet digital PCR on urine-derived urothelial
    cells. The true rate is therefore a lower bound set by what people happened
    to test, and no protocol establishes which tissue to sample. This has direct
    consequences for the recurrence risk quoted to a family.
  evidence:
  - reference: PMID:40011607
    reference_title: "Germline mosaicism in TCF20-associated neurodevelopmental disorders: a case study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "discusses germline mosaicism as a likely under-detected mode of inheritance in neurodevelopmental conditions"
    explanation: The authors state the under-detection directly, which is the uncertainty this gap records.

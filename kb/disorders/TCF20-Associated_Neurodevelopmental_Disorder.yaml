name: TCF20-Associated Neurodevelopmental Disorder
creation_date: "2026-09-05T10:00:00Z"
category: Mendelian
synonyms:
- TAND
- DDVIBA
- developmental delay with variable intellectual impairment and behavioral abnormalities
- TCF20-related disorder
description: >-
  TCF20-associated neurodevelopmental disorder is an autosomal dominant
  condition caused by heterozygous loss of function in TCF20, a chromatin-binding
  transcriptional co-regulator on 22q13.2. Developmental delay and intellectual
  disability are fully penetrant, and most patients also have autistic features,
  attention and hyperactivity problems, and non-specific craniofacial
  dysmorphism, with variable movement disorder, sleep disturbance, seizures and
  structural brain anomalies.

  The disease is a dosage problem rather than a broken-protein problem. TCF20 is
  among the most loss-of-function-intolerant genes in the genome, its pathogenic
  variant spectrum is overwhelmingly truncating or whole-gene deletion, and
  duplications spanning the same gene produce a related disorder with mirror
  traits. That is the signature of haploinsufficiency rather than of a
  dominant-negative or neomorphic allele.

  The molecular context is what makes the phenotype interpretable. TCF20 is the
  structural relative of RAI1, the Smith-Magenis gene, and the clinical overlap
  between the two disorders is substantial enough that the original cohort
  papers describe TAND in those terms. TCF20 sits in a chromatin complex with
  MeCP2 and PHF14 that co-regulates neuronal genes, and Rett-causing MECP2
  mutations disrupt that same interaction. So three separately named
  neurodevelopmental disorders converge on one chromatin complex, which is a
  better account of why they resemble each other than any list of shared
  phenotypes would be.

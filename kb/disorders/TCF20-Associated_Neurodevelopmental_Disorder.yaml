inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single inactivating TCF20 allele is sufficient. Most cases are de novo,
    about a tenth are inherited from a mildly affected parent, and around one in
    twelve arise through germline mosaicism, which is the figure that matters
    for recurrence-risk counselling.
  de_novo_rate: "~67% de novo; ~10% inherited; ~8% confirmed or suspected germline mosaicism"
  evidence:
  - reference: PMID:40011607
    reference_title: "Germline mosaicism in TCF20-associated neurodevelopmental disorders: a case study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, a total of 91 individuals with TAND have been reported; ~67% of cases arose de novo, while ~10% were inherited, and, intriguingly, ~8% were either confirmed or suspected to have arisen via germline mosaicism."
    explanation: Gives the three inheritance routes and their proportions across the whole reported cohort.
genetic:
- name: TCF20
  gene_term:
    preferred_term: TCF20
    term:
      id: hgnc:11631
      label: TCF20
  association: >-
    TCF20 encodes a nuclear chromatin-binding transcriptional co-regulator.
    Heterozygous loss of function causes TAND; duplication of the same locus
    causes a distinct neurodevelopmental disorder with mirror traits.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:30819258
    reference_title: "De novo and inherited TCF20 pathogenic variants are associated with intellectual disability, dysmorphic features, hypotonia, and neurological impairments with similarities to Smith-Magenis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCF20 encodes a transcriptional co-regulator structurally related to RAI1, the dosage-sensitive gene responsible for Smith-Magenis syndrome (deletion/haploinsufficiency) and Potocki-Lupski syndrome (duplication/triplosensitivity)."
    explanation: Establishes the gene's identity and the dosage-sensitive paralogue whose disorders frame the expectations for this one.
  - reference: PMID:30819258
    reference_title: "De novo and inherited TCF20 pathogenic variants are associated with intellectual disability, dysmorphic features, hypotonia, and neurological impairments with similarities to Smith-Magenis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide analyses by exome sequencing (ES) and chromosomal microarray analysis (CMA) identified individuals with heterozygous, likely damaging, loss-of-function alleles in TCF20."
    explanation: The ascertainment that established the gene-disease relationship, and the two assays that find the two classes of allele.
  variants:
  - name: TCF20 truncating and whole-gene deletion alleles
    description: >-
      The reported spectrum is dominated by frameshift and nonsense alleles plus
      whole-gene deletions, with missense alleles a small minority. That
      distribution is itself the argument for haploinsufficiency.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30819258
      reference_title: "De novo and inherited TCF20 pathogenic variants are associated with intellectual disability, dysmorphic features, hypotonia, and neurological impairments with similarities to Smith-Magenis syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To date, a few de novo mutations potentially disrupting TCF20 function in patients with ID, ASD, and hypotonia have been reported."
      explanation: The initial variant reports from which the truncating spectrum was subsequently characterized.
  - name: TCF20 c.4737del p.Lys1579Asnfs*36
    description: >-
      A novel frameshift allele shared by two siblings and absent from both
      parents' blood, traced to paternal germline mosaicism detected in
      urothelial cells.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:40011607
      reference_title: "Germline mosaicism in TCF20-associated neurodevelopmental disorders: a case study and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "droplet digital PCR (ddPCR) of DNA derived from early morning urine detected the variation in 3.2% of the father's urothelial cells, confirming germline mosaicism"
      explanation: Physical confirmation of germline mosaicism, which is what turns an apparently de novo recurrence into a quantifiable recurrence risk.
pathophysiology:
- name: TCF20 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    One inactivated allele halves the dose of a chromatin-binding
    transcriptional co-regulator. The reciprocal duplication causing a mirror
    disorder is the strongest available argument that dose, rather than a
    property of the mutant protein, is what matters.
  gene:
    preferred_term: TCF20
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:11631
      label: TCF20
  molecular_functions:
  - preferred_term: transcription coactivator activity
    modifier: DECREASED
    term:
      id: GO:0003713
      label: transcription coactivator activity
  evidence:
  - reference: PMID:34904221
    reference_title: "Rare and de novo duplications containing TCF20 are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication including TCF20 was suspected to cause a neurodevelopmental disorder (NDD) with mirror traits compared to patients with TCF20 deletions."
    explanation: The mirror-trait duplication disorder, which is what identifies the mechanism as dosage rather than allele-specific.
  - reference: PMID:34904221
    reference_title: "Rare and de novo duplications containing TCF20 are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most pathogenic variants are loss-of-function variants."
    explanation: The allele spectrum expected under a haploinsufficiency mechanism.
  downstream:
  - target: Reduced Occupancy of the MeCP2-PHF14-TCF20 Chromatin Complex
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35074918
      reference_title: "Disruption of MeCP2-TCF20 complex underlies distinct neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using proximity-dependent biotinylation (BioID), we identified a transcription factor 20 (TCF20) complex that interacts with MeCP2 at the chromatin interface."
      explanation: Establishes that TCF20 acts as part of a defined complex at chromatin, which is the object a reduced dose acts on.
- name: Reduced Occupancy of the MeCP2-PHF14-TCF20 Chromatin Complex
  biological_scale: MOLECULAR
  description: >-
    TCF20 and MeCP2 are co-expressed in neurons and co-regulate a shared set of
    neuronal genes. The complex is the convergence point for three separately
    named disorders: Rett-causing MECP2 mutations abolish the interaction from
    one side, a PHF14 missense variant abolishes it from another, and TCF20
    haploinsufficiency reduces it from a third. TCF20 binds chromatin through
    two independent nucleosome-interaction domains, so a halved dose is
    plausibly a halved residence on chromatin rather than a qualitatively
    altered complex.
  molecular_functions:
  - preferred_term: chromatin binding
    modifier: DECREASED
    term:
      id: GO:0003682
      label: chromatin binding
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35074918
    reference_title: "Disruption of MeCP2-TCF20 complex underlies distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TCF20 and MeCP2 are highly coexpressed in neurons and coregulate the expression of key neuronal genes."
    explanation: Co-expression and co-regulation are what make the complex the functional unit rather than TCF20 alone.
  - reference: PMID:35074918
    reference_title: "Disruption of MeCP2-TCF20 complex underlies distinct neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a patient exhibiting RTT-like neurological features with a missense mutation in the PHF14 subunit of the TCF20 complex that abolishes the MeCP2-PHF14-TCF20 interaction."
    explanation: A third gene reaching a Rett-like phenotype by disrupting the same complex, which is the convergence this node asserts.
  - reference: PMID:22081970
    reference_title: "Identification of two independent nucleosome-binding domains in the transcriptional co-activator SPBP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "contains two independent chromatin-binding domains, the SPBP-(1551-1666) region and the C-terminal extended PHD"
    explanation: Characterizes how the protein engages chromatin. It is indirect because the work predates the disease association and names the protein by its former symbol, SPBP.
  downstream:
  - target: Dysregulated Neuronal Transcriptional Program
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39801227
      reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RNA sequencing analysis revealed a downregulation of pre- and postsynaptic pathways in TCF20 knockdown neurons."
      explanation: Reducing TCF20 in neurons changes the transcriptional program, measured directly by RNA sequencing.
- name: Dysregulated Neuronal Transcriptional Program
  biological_scale: CELLULAR
  description: >-
    Knockdown of TCF20 in cortical neurons downregulates pre- and postsynaptic
    pathways and reduces specific synaptic proteins, with an unexpected
    asymmetry: GABRA1, BDNF, PSD-95, c-Fos, GluN2B and GABRA5 fall while GluA2
    rises. The mixed direction matters, because it means the consequence is a
    reshaped synaptic composition rather than a uniform loss of synaptic gene
    expression.
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:39801227
    reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found decreased levels of GABRA1, BDNF, PSD-95, and c-Fos in total homogenates and in synaptosomal preparations of knockdown TCF20 rat cortical cultures."
    explanation: The specific proteins reduced by TCF20 knockdown.
  - reference: PMID:39801227
    reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "synaptosomal preparations of knockdown TCF20 rat cortical cultures showed significant downregulation of GluN2B and GABRA5, while GluA2 was significantly upregulated"
    explanation: The bidirectional change this node's description turns on.
  downstream:
  - target: Impaired Dendritic Arborization and Spine Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39801227
      reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings suggest that TCF20 plays a central role in dendritic arborization and dendritic spine formation processes."
      explanation: States the structural consequence the transcriptional changes lead to.
- name: Impaired Dendritic Arborization and Spine Formation
  biological_scale: CELLULAR
  description: >-
    The structural endpoint measurable in neurons. TCF20 expression rises
    through brain development in mice, which places its requirement in the
    period when arbors and spines are being built rather than maintained.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: dendrite development
    modifier: ABNORMAL
    term:
      id: GO:0016358
      label: dendrite development
  - preferred_term: dendritic spine development
    modifier: ABNORMAL
    term:
      id: GO:0060996
      label: dendritic spine development
  - preferred_term: synapse organization
    modifier: ABNORMAL
    term:
      id: GO:0050808
      label: synapse organization
  evidence:
  - reference: PMID:39801227
    reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrate that TCF20 is expressed in all analyzed brain regions in mice, and its expression increases during brain development but decreases in muscle tissue"
    explanation: The developmental expression profile that places the requirement in the arborization window.
  - reference: PMID:39801227
    reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our data suggest that TCF20 plays an essential role in neuronal development and function by modulating the expression of proteins involved in dendrite and synapse formation and function"
    explanation: The authors' own summary of the mechanism this node states.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30739909
      reference_title: "Variants in TCF20 in neurodevelopmental disability: description of 27 new patients and review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To define the clinical characteristics of patients with variants in TCF20, we describe 27 patients, 26 of whom were identified via exome sequencing."
      explanation: The cohort in which the clinical endpoint is characterized. The steps between altered dendritic development in culture and the human developmental phenotype are not demonstrated.
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39801227
      reference_title: "Regulation of Dendrite and Dendritic Spine Formation by TCF20."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Mutations in the Transcription Factor 20 (TCF20) have been identified in patients with autism spectrum disorders (ASDs), intellectual disabilities (IDs), and other neurological issues."
      explanation: Connects the studied molecular function to the autistic phenotype by way of the gene's clinical associations rather than by a demonstrated causal path.

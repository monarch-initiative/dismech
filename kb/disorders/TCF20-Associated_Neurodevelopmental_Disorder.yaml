notes: >-
  Deep-research provenance. Curated alongside an OpenScientist report
  (research/TCF20-Associated_Neurodevelopmental_Disorder-deep-research-openscientist.md).
  All 13 of its references resolved and all 16 quotes it checked were valid.

  Its relevance heuristic is worth recording, because it was wrong in an
  instructive way. Two references were flagged as off topic:
  PMID:10995766 and PMID:22081970. Both are papers on SPBP, which is the former
  symbol for TCF20, and both are directly on point: the first maps the protein's
  functional domains and its coactivator behaviour, the second identifies its two
  independent nucleosome-binding domains and shows that RAI1 carries homologous
  domains. Neither mentions TCF20 or the disease anywhere, because both predate
  the rename and the disease association. Relevance is scored on vocabulary
  overlap with the report, so a paper about the same protein under a different
  name scores as if it were about something else. Both are cited here, with
  directness INDIRECT recording that they predate the disease association.

  Ontology note. The report's term validation flagged one mislabelled term,
  MONDO:0032745, as being called "MONDO" rather than by its label. That is the
  identifier-table column header being read as a label, not a wrong binding.

  Frequencies. The percentages curated here (69% autism, 67% attention or
  hyperactivity, 24% structural brain anomalies, 12% seizures) all come from one
  27-patient cohort compared against 17 previously reported patients, so they
  are cohort figures rather than population frequencies, and the FrequencyEnum
  bands assigned from them inherit that limitation.

  Not curated. The report describes postnatal overgrowth (tall stature,
  macrocephaly, obesity) in a subset. The cohort sources cached here do not
  carry a quotable statement of that, so those phenotypes are omitted rather
  than evidenced from the report's prose. Craniofacial dysmorphism is likewise
  omitted despite its 67% frequency, because the same source states there is no
  recognizable facial gestalt, and a phenotype term would assert more structure
  than the finding has.

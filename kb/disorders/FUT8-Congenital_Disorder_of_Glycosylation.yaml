      label: Autosomal recessive inheritance
  description: >-
    Biallelic FUT8 variants: homozygous in patients from consanguineous
    families and compound heterozygous in patients from non-consanguineous
    families, with each parent carrying one variant.
  evidence:
  - reference: PMID:29304374
    reference_title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with Defective
      Fucosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first individual (consanguineous family) was homozygous for c.715C>T (p.Arg239∗),
      while the second (non-consanguineous family) was compound heterozygous for c.1009C>G (p.Arg337Gly)
      and a splice site variant c.1259+5G>T."
    explanation: Homozygosity in a consanguineous family and compound heterozygosity in a
      non-consanguineous one, the genotype pattern of recessive inheritance.
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients' mother was found to be heterozygous for the c.1403del variant while the
      father was heterozygous for c.1418G > A."
    explanation: Each unaffected parent of the affected twins carries one of the two variants.
prevalence:

animal_models:
- name: Fut8-null mouse
  species: Mus musculus
  genotype: Fut8 -/- (constitutive knockout)
  genes:
  - preferred_term: Fut8
    term:
      id: MGI:1858901
      label: Fut8
  publication: PMID:16236725
  description: >-
    Lacks core fucose. About 70% die within three days of birth; survivors
    show severe growth retardation, emphysema-like lungs and behavioural
    abnormalities. Embryonic fibroblasts upregulate GnT-III and bisected
    N-glycans, a possible compensatory response.
  modeled_mechanisms:
  - target: Abnormal Lung Alveolar Development
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Emphysema-like destruction driven by deficient TGF-beta1 signalling.
    limitations: >-
      Patients have recurrent pneumonia and respiratory insufficiency, but no
      lung histology or imaging has been reported in FUT8-CDG, so whether they
      have the same alveolar lesion is unknown.
    evidence:
    - reference: PMID:16236725
      reference_title: Dysregulation of TGF-beta1 receptor activation leads to abnormal lung development
        and emphysema-like phenotype in core fucose-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histopathological analysis revealed that Fut8(-/-) mice showed emphysema-like changes in
        the lung, verified by a physiological compliance analysis."
      explanation: The lung phenotype of the model.
  - target: Prenatal and Postnatal Growth Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Severe postnatal growth retardation and early death, as in the patients.
    limitations: >-
      High neonatal mortality limits study of survivors, and the mice adapt by
      inducing GnT-III and oxidative-stress genes, which may mask or modify
      phenotypes.
    evidence:
    - reference: PMID:24619415
      reference_title: "The absence of core fucose up-regulates GnT-III and Wnt target genes: a possible
        mechanism for an adaptive response in terms of glycan function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our previous studies indicated that 70% of Fut8-deficient (Fut8(-/-)) mice that lack core
        fucose structure die within 3 days after birth, but the remainder survive for up to several weeks
        although they show growth retardation as well as emphysema."
      explanation: Survival and growth of the knockout.
- name: Fut8 conditional knockout mouse (cerebellar granule neuron progenitors)
  species: Mus musculus
  genotype: Fut8 deleted in cerebellar granule neuron progenitors
  genes:
  - preferred_term: Fut8
    term:
      id: MGI:1858901
      label: Fut8
  publication: PMID:39604780
  description: >-
    Progenitor-specific deletion impairs cerebellar granule neuron progenitor
    proliferation and differentiation, synaptic physiology and motor
    coordination through reduced contactin 2; ectopic contactin 2 rescues the
    neuronal defects.
  modeled_mechanisms:
  - target: Impaired Neurogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Cerebellar arm of the neurogenesis defect.
    limitations: >-
      Cell-type-restricted deletion in one brain region; cerebellar structure
      has not been described in patients, and brain imaging is reported for
      only one patient (slight ventriculomegaly, mildly delayed myelination).
    evidence:
    - reference: PMID:39604780
      reference_title: FUT8 Regulates Cerebellar Neurogenesis and Development Through Maintaining the Level
        of Neural Cell Adhesion Molecule Cntn2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, ectopic Cntn2 can rescue the neuronal defects induced by Fut8 deficiency."
      explanation: Rescue identifies contactin 2 as the relevant client in this model.
notes: >-
  Named FUT8-Congenital Disorder of Glycosylation, the gene-prefixed CDG form
  used by the clinical literature (FUT8-CDG) and by sibling entries; MONDO's
  label is congenital disorder of glycosylation with defective fucosylation 1
  (CDGF1). FUT8-CDG is a pure N-glycan core fucosylation defect, distinct
  from SLC35C1-CDG (leukocyte adhesion deficiency II) and FCSK-CDG, in which
  GDP-fucose supply rather than the transferase is lacking. Mortality is
  recorded in the description and on the multisystem node rather than as a
  phenotype because HP:0003819 Death in childhood lies outside the
  PhenotypeTerm enum.

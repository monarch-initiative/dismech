    explanation: A further compound heterozygous FUT8 patient in a Brazilian CDG-II cohort; both
      variants are classified as uncertain significance.
genetic:
- name: FUT8
  gene_term:
    preferred_term: FUT8
    term:
      id: hgnc:4019
      label: FUT8
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Most published alleles are truncating (nonsense, frameshift or splice);
    the missense alleles p.Arg239Gln and p.Arg473Gln are accompanied by
    complete or near-complete loss of serum core fucosylation, and no allele
    with clear residual activity has been described.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN

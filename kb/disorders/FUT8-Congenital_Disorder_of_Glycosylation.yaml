      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FUT8 | HGNC:4019 | congenital disorder of glycosylation with defective fucosylation
        1 | MONDO:0020775 | AR | Definitive"
      explanation: ClinGen classifies the FUT8 relationship to this MONDO disease as Definitive
        (autosomal recessive).
  variants:
  - name: c.715C>T p.(Arg239*)
    description: Homozygous in the first patient of the founding report, from a consanguineous family.
    evidence:
    - reference: PMID:29304374
      reference_title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with
        Defective Fucosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The first individual (consanguineous family) was homozygous for c.715C>T (p.Arg239∗)"
      explanation: Genotype of the first reported patient.
  - name: c.1259+5G>T (exon 9 skipping)
    description: >-
      Splice-region variant in trans with p.Arg337Gly; patient cDNA shows a
      transcript lacking exon 9.
    evidence:
    - reference: PMID:29304374
      reference_title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with
        Defective Fucosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Splicing analysis confirmed the c.1259+5G>T resulted in expression of an abnormal FUT8
        transcript lacking exon 9."
      explanation: The splice consequence of the variant.
  - name: c.716G>A p.(Arg239Gln)
    description: >-
      Homozygous missense variant first classified as a variant of uncertain
      significance; the patient's complete loss of serum core fucosylation
      established it as pathogenic.
    evidence:
    - reference: PMID:32049367
      reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Importantly, CDG-0096, who carries the VUS c.716G > A ... was also shown to have a complete
        loss of core fucosylation (Figure 3)."
      explanation: The glycan biomarker resolves the missense variant as pathogenic.
  - name: c.1403del p.(Ser468Tyrfs*26) and c.1418G>A p.(Arg473Gln)
    description: Compound heterozygous in dizygotic twins; the frameshift truncates the protein and
      the missense variant changes a highly conserved residue.
    evidence:
    - reference: PMID:33312876
      reference_title: L-Fucose treatment of FUT8-CDG.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While the c.1403del variant leads to a premature termination of translation with a
        consequently truncated protein, the c.1418G > A variant affects a highly conserved residue and
        has not been described previously either in the literature or in variant databases."
      explanation: Genotype of the twin pair and the predicted consequence of each allele.
  evidence:
  - reference: PMID:29304374
    reference_title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with Defective
      Fucosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that loss of function mutations in FUT8 cause a congenital disorder of glycosylation
      (FUT8-CDG) characterized by defective core fucosylation"
    explanation: The founding report establishing FUT8 loss of function as the cause.
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report an additional four unrelated affected individuals homozygous for novel

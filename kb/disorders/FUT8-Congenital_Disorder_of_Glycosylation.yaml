    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All FUT8-CDG patients reported to date have profound neurologic impairment, suggesting a critical
      role for core fucosylation in the nervous system."
    explanation: The clinical authors' inference from the uniform neurological picture.
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent follow up of the original reported cases revealed that all three have passed away,
      while all four subjects described here are still alive at 3 to 16 years of age."
    explanation: Mortality in the founding patients and survival of the later ones.

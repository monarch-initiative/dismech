    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Fucosyltransferase 8 (FUT8) encodes a Golgi-localized α1,6 fucosyltransferase that is
      essential for transferring the monosaccharide fucose into N-linked glycoproteins"
    explanation: The enzyme activity and Golgi location of the gene product, stated as background.
  downstream:
  - target: Loss of Core Fucosylation of N-Glycans
    causal_link_type: DIRECT
    description: Without FUT8 no other enzyme can attach alpha-1,6-linked core fucose to N-glycans.
    evidence:
    - reference: PMID:27008861
      reference_title: Mammalian α-1,6-Fucosyltransferase (FUT8) Is the Sole Enzyme Responsible for the
        N-Acetylglucosaminyltransferase I-independent Core Fucosylation of High-mannose N-Glycans.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results provide direct evidence that FUT8, the mammalian α1,6-fucosyltransferase,
        is the sole enzyme responsible for the GnT I-independent core fucosylation pathway."
      explanation: FUT8 knockdown in HEK293S cells removes core fucose, showing there is no redundant
        enzyme for this step.
    - reference: PMID:32049367
      reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "There are an estimated 13 fucosyltransferases encoded in the human genome, but only one
        (FUT8) encodes an enzyme capable of carrying out core fucosylation."
      explanation: Background statement that FUT8 is the only core fucosyltransferase.
- name: Loss of Core Fucosylation of N-Glycans
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect"
  description: >-
    Core-fucosylated N-glycans are absent or nearly absent from serum
    glycoproteins and reduced in patient fibroblasts. The defect is specific:
    antennary fucosylation is preserved, and transferrin, which carries little
    core fucose, has a normal isoform pattern. Bisected N-glycans, most of
    which are normally also core fucosylated, fall with it. The receptor and
    tissue effects below follow from loss of core fucose on particular client
    glycoproteins.
  biological_processes:
  - preferred_term: N-glycan core fucosylation
    modifier: DECREASED
    term:
      id: GO:0006491
      label: N-glycan processing
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:29304374
    reference_title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with Defective
      Fucosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, serum samples from all three individuals showed a complete loss of core fucosylation."
    explanation: Serum glycan analysis in all three founding patients.
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to core fucosylated glycan species, antennary fucosylation, catalyzed by α-1,3-fucosyltransferases
      ... was preserved in samples from both patients when compared to healthy controls (Fig. 2C)."
    explanation: The defect is limited to core fucose; other fucose linkages are made normally.
  downstream:
  - target: Impaired TGF-beta1 Receptor Signaling
    causal_link_type: DIRECT
    description: TGF-beta receptors lacking core fucose bind TGF-beta1 poorly and signal less.
    evidence:
    - reference: PMID:16236725
      reference_title: Dysregulation of TGF-beta1 receptor activation leads to abnormal lung development
        and emphysema-like phenotype in core fucose-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In fact, Fut8(-/-) mice have a marked dysregulation of TGF-beta1 receptor activation and
        signaling, as assessed by TGF-beta1 binding assays and Smad2 phosphorylation analysis."
      explanation: Receptor binding and Smad2 activation measured in the Fut8-null mouse.
  - target: Impaired EGF Receptor Signaling
    causal_link_type: DIRECT
    description: EGF binding to its receptor requires core fucose on the receptor's N-glycans.
    evidence:
    - reference: PMID:16316986
      reference_title: Core fucosylation regulates epidermal growth factor receptor-mediated intracellular
        signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, we found that the core fucosylation of N-glycans is required for the binding of
        the EGF to its receptor, whereas no effect was observed for the expression levels of EGFR on the
        cell surface."
      explanation: Fut8-null embryonic fibroblasts; receptor expression is normal but ligand binding is
        lost.
  - target: Impaired Integrin-Mediated Signaling
    causal_link_type: DIRECT
    description: Integrins lacking core fucose mediate migration and downstream signalling poorly.
    evidence:
    - reference: PMID:17043354
      reference_title: Deletion of core fucosylation on alpha3beta1 integrin down-regulates its functions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that the core fucosylation of alpha3beta1 integrin, the major receptor for laminin
        5, was abundant in Fut8(+/+) cells but was totally abolished in Fut8(-/-) cells, which was associated
        with the deficient migration mediated by alpha3beta1 integrin in Fut8(-/-) cells."
      explanation: Integrin function depends on its core fucose in Fut8-null fibroblasts.
  - target: Reduced VEGFR-2 Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of Fut8 lowers VEGFR-2 mRNA and protein; the route from core fucose to
      transcription of the receptor gene is not known.
    evidence:
    - reference: PMID:19179362
      reference_title: "Requirement of Fut8 for the expression of vascular endothelial growth factor receptor-2:
        a new mechanism for the emphysema-like changes observed in Fut8-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results of the present study demonstrated that vascular endothelial growth factor receptor-2
        (VEGFR-2) expression was significantly suppressed in Fut8(-/-) mice, suggesting that Fut8 was required
        for VEGFR-2 expression."
      explanation: VEGFR-2 suppression in the Fut8-null mouse lung.
  - target: Multisystem Core-Fucose-Dependent Glycoprotein Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Core fucose is carried by a large share of N-glycoproteins, including in
      brain, and most clinical features have not been traced to a particular
      client protein.
    evidence:
    - reference: PMID:33312876
      reference_title: L-Fucose treatment of FUT8-CDG.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "FUT8 is expressed in brain and peripheral nerves ... and a large portion of brain N-glycans
        are core fucosylated"
      explanation: Background statement supporting a proteome-wide, multi-organ consequence of losing
        core fucose.
  - target: Decreased fucosylation of N-linked protein glycosylation
    causal_link_type: DIRECT
    description: The glycan defect itself is the diagnostic biochemical phenotype.
- name: Impaired TGF-beta1 Receptor Signaling
  biological_scale: CELLULAR
  description: >-
    Shown in the Fut8-null mouse and its fibroblasts: TGF-beta1 binding and
    Smad2 phosphorylation fall, matrix metalloproteinases such as MMP-12 and
    MMP-13 rise and elastin falls in the lung. Re-expressing Fut8 rescues the
    receptor defect, and exogenous TGF-beta1 rescues the lung phenotype.
    Not yet studied in patient cells.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:16236725
    reference_title: Dysregulation of TGF-beta1 receptor activation leads to abnormal lung development and
      emphysema-like phenotype in core fucose-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also show that these TGF-beta1 receptor defects found in Fut8(-/-) cells can be rescued
      by reintroducing Fut8 into Fut8(-/-) cells."
    explanation: Rescue ties the signalling defect to loss of Fut8.
  downstream:
  - target: Abnormal Lung Alveolar Development
    causal_link_type: DIRECT
    description: Deficient TGF-beta1 signalling raises lung MMP expression, lowers elastin and retards

- name: FUT8 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Truncating and missense FUT8 alleles leave no
    detectable FUT8 protein in patient fibroblasts, so the Golgi loses its only
    alpha-1,6-fucosyltransferase.

  notes: >-
    The 2020 twin report counts seven previously published patients; with the
    twins that makes nine. A 2026 plasma N-glycomics study adds one further
    compound heterozygous patient whose two FUT8 variants are classified as
    variants of uncertain significance.
  evidence:
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT

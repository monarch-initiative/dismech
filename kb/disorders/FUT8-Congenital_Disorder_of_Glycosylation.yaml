- name: Multisystem Core-Fucose-Dependent Glycoprotein Dysfunction
  biological_scale: ORGANISM
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  description: >-
    The patients' features beyond growth, lung and neurogenesis (seizures,
    hypotonia, feeding failure, joint and spine deformity, glaucoma,
    hypothyroidism, facial dysmorphism) and their early mortality have no
    mechanism traced to a specific core-fucosylated client protein. This node
    records that they arise from the global loss of core fucose without
    asserting a particular route. All three founding patients died in
    childhood, while the four reported next were alive at 3 to 16 years.
  evidence:
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All seven individuals presented with severe global developmental delays with cognitive impairment
      or intellectual disability, feeding problems, dysmorphic facial features, microcephaly, seizures, hypotonia,
      and various skeletal abnormalities (Figure 2, Table 1)."
    explanation: The shared multisystem picture across the first seven patients.

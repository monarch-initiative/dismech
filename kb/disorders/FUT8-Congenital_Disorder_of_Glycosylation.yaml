  description: >-
    Shown in the Fut8-null mouse lung and in Fut8-knockdown cell lines:
    VEGFR-2 mRNA and protein fall, ceramide rises and apoptotic septal
    epithelial and endothelial cells increase in the alveolar septa. The
    authors propose this as a second route, alongside TGF-beta1 receptor
    failure, to the emphysema-like lung.

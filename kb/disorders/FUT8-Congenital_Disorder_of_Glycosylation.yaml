name: FUT8-Congenital Disorder of Glycosylation
creation_date: "2026-11-12T18:20:00Z"
category: Mendelian
disease_term:
  preferred_term: congenital disorder of glycosylation with defective fucosylation 1
  term:
    id: MONDO:0020775
    label: congenital disorder of glycosylation with defective fucosylation 1
description: >-
  An autosomal recessive congenital disorder of glycosylation caused by
  biallelic loss-of-function variants in FUT8, which encodes the Golgi
  alpha-1,6-fucosyltransferase. FUT8 is the only human enzyme that adds
  fucose in alpha-1,6 linkage to the innermost N-acetylglucosamine of
  N-glycans ("core fucosylation"), so its loss removes core fucose from
  serum and cellular glycoproteins while leaving antennary fucosylation,
  which other fucosyltransferases make, intact. Serum transferrin isoelectric
  focusing, the standard CDG screen, is normal, and diagnosis rests on N-glycan
  mass spectrometry showing absent core-fucosylated species.

  Fewer than a dozen patients are published. All have severe global
  developmental delay with intellectual disability, failure to thrive with
  feeding difficulties, hypotonia, short stature with other skeletal
  abnormalities (contractures, scoliosis, hip dislocation), facial
  dysmorphism and respiratory problems, often recurrent pneumonia; seizures
  and microcephaly were present in the first seven patients, and seizures
  were absent in a later twin pair. Intrauterine growth restriction and
  polyhydramnios are common, and developmental glaucoma, hypothyroidism and
  kidney stones occur in some patients. The three patients of the founding
  report died in childhood; the four reported next were alive at 3 to 16
  years.

  How loss of core fucose produces the clinical picture is known mainly from
  the Fut8-null mouse, which has severe growth retardation, emphysema-like
  lung destruction and frequent early death. In that model and in its cells,
  core fucose is needed for ligand binding and signalling by the TGF-beta1
  and EGF receptors and for alpha3beta1 integrin function, and Fut8 deletion
  impairs neurogenesis. No disease-modifying treatment exists; oral L-fucose
  given to one twin pair produced only a limited glycan response.

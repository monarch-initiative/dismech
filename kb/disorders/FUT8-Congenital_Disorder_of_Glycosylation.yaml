biochemical:
- name: Absent core-fucosylated serum N-glycans
  biomarker_term:
    preferred_term: absent core fucosylation of serum N-glycans
    term:
      id: HP:0012353
      label: Decreased fucosylation of N-linked protein glycosylation
  presence: PRESENT
  notes: >-
    The core-fucosylated glycans at m/z 1836, 2040, 2081, 2244, 2606 and 2967
    are missing from MALDI-TOF/TOF spectra of patient serum. Bisected
    N-glycans are also sharply reduced, because most of them are normally
    core fucosylated.
  evidence:
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed a complete loss of core fucosylated N-glycans from serum proteins (Figure 3)."
    explanation: The glycan biomarker in the serum of two patients homozygous for nonsense variants.
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bisected N-glycans, most of which are core-fucosylated, were also severely reduced (Fig. 2)."
    explanation: The accompanying reduction of bisected glycans.
- name: Decreased serum IgG
  biomarker_term:
    preferred_term: decreased IgG
    term:
      id: HP:0004315
      label: Decreased circulating IgG concentration
  presence: PRESENT
  notes: Noted on serum lectin blotting in the twin pair; not quantified against reference ranges.
  evidence:
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RCA, which binds to glycans with terminal galactose, were unaltered in FUT8-CDGs (Supplementary
      Fig. 1). In addition, a decrease of IgG was noted."
    explanation: Reported decrease of IgG in the twin pair's serum studies.
diagnosis:
- name: Serum N-glycan profiling by mass spectrometry
  description: >-
    The diagnostic test. MALDI-TOF or ESI-QTOF mass spectrometry of total
    serum or plasma N-glycans shows absent core-fucosylated species with
    preserved antennary fucose, and has been used to confirm a missense
    variant of uncertain significance as pathogenic.
  evidence:
  - reference: PMID:29304374
    reference_title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with Defective
      Fucosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, identification of additional affected individuals can be easily achieved through
      analysis of core fucosylation of N-glycans."
    explanation: The founding authors' recommended diagnostic test.
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, N-glycome profiling using either MALDI-TOF MS or ESI-TOF MS of serum or plasma glycans
      is reliable in the diagnosis of FUT8-CDG"
    explanation: Both mass spectrometry methods are reliable for diagnosis.
  - reference: PMID:42511652
    reference_title: Diagnosis of Congenital Disorders of Glycosylation Type II Subtypes Through Comprehensive
      N-Glycan Profiling by Mass Spectrometry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, reduced fucosylation was observed in patients with FUT8-CDG and SLC35C1-CDG."
    explanation: Independent plasma N-glycomics study; the FUT8-CDG profile is separated from other
      CDG-II subtypes by reduced fucosylation, shared only with the GDP-fucose transporter defect.
- name: Serum transferrin isoelectric focusing
  description: >-
    Normal in FUT8-CDG, because transferrin carries little core fucose, so
    the standard CDG screen does not detect the disease.
  evidence:
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of transferrin N-glycosylation by IEF and HPLC showed no abnormalities in either child
      (data not shown)."
    explanation: Normal transferrin screen in the twins.
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, analysis of serum transferrin glycosylation in at least one individual was normal and
      did not reveal any clear abnormalities in fucosylation (Figure S1)."
    explanation: Normal transferrin glycosylation in the second series.
- name: Exome or genome sequencing
  description: >-
    Every published patient was found by exome or genome sequencing after
    clinical and laboratory work-up failed to reach a diagnosis; serum
    N-glycan analysis then confirms pathogenicity.
  evidence:
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all four cases, clinical phenotyping and laboratory testing failed to reach a definitive
      diagnosis. Therefore, next-generation sequencing was used to reach a diagnosis."
    explanation: Sequencing was the route to diagnosis.
treatments:
- name: Oral L-Fucose Supplementation
  description: >-
    Experimental. Oral L-fucose, raised to about 825 mg/kg/day with galactose
    added after five months, was given to one twin pair carrying a frameshift
    and a missense allele. Total serum N-glycan profiles did not change, but
    transferrin core fucosylation and some truncated glycans improved
    modestly, and the twins stabilised clinically, which the authors could
    not separate from the natural course. The rationale is weak where FUT8
    protein is absent: fucose did not raise fucosylation in fibroblasts with
    truncating alleles, and one family with a missense allele declined
    therapy after serum showed no residual core fucosylation.
  treatment_term:
    preferred_term: oral L-fucose supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-fucose
      term:
        id: CHEBI:18287
        label: L-fucose
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Loss of Core Fucosylation of N-Glycans
    description: Raises GDP-fucose supply through the salvage pathway, which can only help if some FUT8
      activity remains.
  evidence:
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glycosylation analysis using mass spectrometry indicated a limited response to fucose therapy
      while the clinical presentation stabilized."
    explanation: The treated twin pair.
  - reference: PMID:33312876
    reference_title: L-Fucose treatment of FUT8-CDG.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Total serum N-glycome profiling using MALDI TOF-MS did not show any increase in either core
      or antennary fucosylation after treatment."
    explanation: No change in the total serum glycome under therapy.
  - reference: PMID:32049367
    reference_title: Expanding the molecular and clinical phenotypes of FUT8-CDG.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We had previously tested the effects of supplementing tissue culture medium with L-fucose on
      FUT8-CDG fibroblasts, but we saw no increase in total fucosylation."
    explanation: No rescue of fucosylation in patient fibroblasts lacking FUT8 protein.

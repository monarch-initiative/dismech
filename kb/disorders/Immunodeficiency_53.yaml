- name: Derepressed RelA-Driven Inflammatory Gene Expression
  description: >-
    In fibroblasts from patients homozygous for the hypomorphic P364L allele,
    stimulation induces a cluster of hyper-expressed pro-inflammatory
    transcripts. The authors read this as loss of RelB's inhibitory effect on
    RelA and propose it as the main driver of the organ autoimmunity in that
    sibship. In Relb-knockout mice, RelB likewise suppresses a set of
    inflammatory response genes independently of interferon signaling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:36402602
    reference_title: NFκB pathway dysregulation due to reduced RelB expression leads to severe autoimmune disorders and declining immunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stimulation of P364L patient fibroblasts resulted in a marked rise in a cluster of pro-inflammatory hyper-expressed transcripts consistent with the removal of RelB inhibitory effect on RelA function."
    explanation: >-
      Transcriptional measurement in patient fibroblasts.
  - reference: PMID:37460023
    reference_title: "RelB-deficient autoinflammatory pathology presents as interferonopathy, but in mice is interferon-independent."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Instead, we found that RelB suppresses a different set of inflammatory response genes in a manner that is independent of interferon signaling but associated with NF-κB binding motifs."
    explanation: >-
      Mouse genetic evidence that RelB restrains NF-kappaB-motif inflammatory
      genes.
  downstream:
  - target: Organ-Infiltrating Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

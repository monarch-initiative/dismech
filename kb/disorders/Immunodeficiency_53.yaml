name: Immunodeficiency 53
creation_date: "2026-10-14T18:30:00Z"
category: Mendelian
synonyms:
- IMD53
- RelB deficiency
- RELB deficiency
- Autosomal recessive RelB deficiency
description: >-
  Immunodeficiency 53 is the autosomal recessive combined immunodeficiency caused by
  biallelic loss-of-function or severely hypomorphic variants in RELB, the
  transcription factor of the alternative (non-canonical) NF-kappaB pathway.
  RelB is required in hematopoietic cells for T cell maturation, Th17
  differentiation and B cell class switching, and in thymic stromal cells for
  the development of AIRE-expressing medullary thymic epithelial cells. Patients
  therefore combine opportunistic viral, bacterial and fungal infections
  (including chronic mucocutaneous candidiasis) with neutralizing autoantibodies
  against type I interferons, which can arise even after hematopoietic stem cell
  transplantation because the thymic stromal defect is not corrected. The three
  siblings homozygous for the amorphic Y397* allele presented in early infancy,
  but a patient with another amorphic allele was diagnosed with combined
  immunodeficiency only at 12 years. In one sibship with the hypomorphic P364L
  allele, progressive autoimmunity of the liver, gut, lung and skin dominated
  the second decade.
disease_term:
  preferred_term: immunodeficiency 53
  term:
    id: MONDO:0054696
    label: immunodeficiency 53
parents:
- Combined immunodeficiency
- Inborn error of immunity
notes: >-
  Ultra-rare. Nine patients from five kindreds have been reported. PMID:39231201
  classifies four as complete deficiency (P1 with Q72fs and the three Y397*
  siblings) and five as partial (the three P364L siblings, P2 with E145K/P364L,
  and the Q135dup infant). The 2026 review PMID:41608125 states three complete
  and five partial, which does not add up to its own count of nine. Every
  count in this entry is therefore n out of a handful of patients, and no
  `frequency` value is set. No GeneReviews chapter exists for this disease, and
  no Orphanet record maps to MONDO:0054696 in the committed Orphanet cache.
  Findings reported in a single patient and not attributed to RelB deficiency by
  the reporting authors (large B cell lymphoma, thyroid disease, osteomyelitis
  and peritonitis in one adult) are not recorded as phenotypes. The same adult
  (P2, partial deficiency) also had chronic malabsorption with cholestatic liver
  disease and portal hypertension. The reporting authors do not call it
  autoimmune, so it is not attached to the organ-autoimmunity node. Rituximab
  given to P2 and the lung lobe resected in the P364L sibship are
  single-patient interventions whose indications are not specific to RelB
  deficiency, so they are not recorded as treatments. ClinGen's RELB summary
  also cites PMID:33083013, a Pakistani diagnostic cohort. The RELB case there
  appears only in supplementary tables, which were not reviewed, so it is not
  known whether it adds a tenth patient or a further allele. A 2026 fungal
  infection review lists Pneumocystis pneumonia for RELB deficiency; no primary
  report read for this entry describes Pneumocystis infection, so it is not
  recorded. No mechanism module covers the alternative NF-kappaB pathway or
  thymic central tolerance, so no node declares conforms_to.

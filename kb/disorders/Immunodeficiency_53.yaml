- name: Failure of Central Tolerance to Type I Interferons
  description: >-
    Without AIRE-expressing mTECs, T cells reactive to type I interferons are
    not deleted in the thymus. In proteome-wide autoantibody screening, type I
    interferons were the most enriched autoantigens in RelB-deficient patients.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: central tolerance induction to self antigen
    modifier: DECREASED
    term:

      evidence_source: HUMAN_CLINICAL
      snippet: "We detected no AIRE expression in human thymuses lacking RELB or heterozygous for a p52LOF/IκBδGOF variant."
      explanation: >-
        Thymic biopsy from a patient with complete (Y397*) RELB deficiency
        shows no AIRE expression. No thymus from a partial-deficiency patient
        was examined.

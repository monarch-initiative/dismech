  description: >-
    HSCT corrected the T and B cell-related infectious susceptibility in the
    four patients with complete deficiency who were transplanted. P1 had
    normal immunoglobulins and was off IVIg three years after HSCT. It does
    not correct the thymic stromal defect: P1 developed anti-type I IFN
    autoantibodies five years after transplantation. Whether HSCT corrects
    organ autoimmunity in partial deficiency is unknown.
  therapeutic_modality: CELL_THERAPY

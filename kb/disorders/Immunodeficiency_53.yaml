    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with the critical mTEC-intrinsic role of p52/RelB heterodimers in establishing tolerance to type I IFNs, HSCT did not prevent the development of thymic stromal cell-dependent autoimmunity in P1, who developed auto-Abs against type I IFNs after transplantation."

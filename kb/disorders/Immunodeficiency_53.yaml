      snippet: "These defects are rescued by transduction with wild-type RELB complementary DNA (cDNA)."
      explanation: >-
        Wild-type RELB restores the alternative-pathway response in patient
        fibroblasts, tying the signaling defect to the RELB lesion.
- name: Impaired Alternative NF-kappaB Pathway Activation
  description: >-
    Without functional RelB, p52/RelB heterodimers cannot drive target-gene
    induction after lymphotoxin or TWEAK stimulation. NFKB2 and VCAM1 induction
    is impaired, while p100 processing to p52 and canonical NF-kappaB responses
    to TNF and IL-1beta are intact.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: non-canonical NF-kappaB signal transduction
    modifier: DECREASED
    term:
      id: GO:0038061
      label: non-canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting deficiency of functional RelB impairs the induction of NFKB2 mRNA and NF-κB2 (p100/p52) protein by lymphotoxin in the fibroblasts of the patients."
    explanation: >-
      Direct measurement of the alternative-pathway defect in patient
      fibroblasts.
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By contrast, the response of RelB-deficient fibroblasts to Tumor Necrosis Factor (TNF) or IL-1β via the canonical NF-κB pathway remains intact."
    explanation: >-
      Shows the defect is confined to the alternative pathway.

  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported alleles are Y397* and Q72fs (amorphic) and Q135dup, E145K and
    P364L (strongly hypomorphic). P364L was found homozygous in an Iranian
    Jewish sibship and, as a de novo allele in trans with a maternal E145K, in
    an unrelated patient of European descent. Two rare missense variants seen
    homozygous in gnomAD (D417N, D487Y) behaved like wild type.

mechanistic_hypotheses:
- hypothesis_group_id: mtec_central_tolerance_autoimmunity
  hypothesis_label: Organ autoimmunity from defective mTEC-dependent central tolerance
  status: ALTERNATIVE
  description: >-
    The liver, lung and skin autoimmunity of partial RelB deficiency arises
    from the same thymic stromal defect that causes anti-type I IFN
    autoantibodies: too few AIRE-expressing mTECs to delete organ-reactive T
    cells. The supporting argument is resemblance to mice lacking Relb only in
    mTECs.
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, the liver, lung, and skin-related autoimmunity reported in two patients with AR partial RelB deficiency (25) closely mimics the T cell infiltration of organs in mice with a conditional Relb-KO in mTECs (67), providing additional evidence for the mTEC-intrinsic essential role of human RelB in central tolerance."
    explanation: >-
      States this hypothesis. The patients' clinical picture is human data,
      but the causal argument rests on resemblance to an mTEC-conditional
      Relb knockout mouse, which is model-organism evidence.
- hypothesis_group_id: rela_derepression_autoimmunity
  hypothesis_label: Organ autoimmunity from loss of RelB restraint on RelA
  status: ALTERNATIVE
  description: >-
    Residual but unstable RelB in P364L patients fails to restrain RelA-driven
    pro-inflammatory transcription, and this hyper-inflammatory state drives
    the organ autoimmunity. This would explain why organ autoimmunity is seen
    in the P364L sibship but not in complete deficiency.
  evidence:
  - reference: PMID:36402602
    reference_title: NFκB pathway dysregulation due to reduced RelB expression leads to severe autoimmune disorders and declining immunity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Stimulation of P364L patient fibroblasts resulted in a marked rise in a cluster of pro-inflammatory hyper-expressed transcripts consistent with the removal of RelB inhibitory effect on RelA function."
    explanation: >-
      The fibroblast transcriptional finding the hypothesis rests on.

animal_models:
- name: Relb knockout mouse
  species: Mouse
  genotype: Relb-/- (germline targeted disruption)
  publication: PMID:7845467
  description: >-
    Relb-null mice lack thymic UEA-1+ medullary epithelial cells and have
    reduced thymic dendritic cells. Unlike human patients, they develop
    multiorgan inflammatory infiltration and myeloid hyperplasia. The
    2-to-6-week lethality is cited from PMID:39231201, not from the primary
    mouse reports.
  modeled_mechanisms:
  - target: Defective Medullary Thymic Epithelial Cell Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      The mouse shows complete absence of UEA-1+ mTECs, while the human thymus
      retains rare mTECs that fail to mature to AIRE+ cells. The mouse's lethal
      multiorgan inflammation is not seen in human complete deficiency.
    evidence:
    - reference: PMID:7845467
      reference_title: Expression of relB is required for the development of thymic medulla and dendritic cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thymic UEA-1+ medullary epithelial cells from normal mice show striking similarities to DC and, interestingly, these cells are also absent in relB mutant mice."
      explanation: The mTEC defect is present in the knockout.
  - target: Organ-Infiltrating Autoimmunity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Knockout mice die at 2 to 6 weeks from T cell-dependent inflammation of
      many organs. Human complete deficiency shows only anti-type I IFN
      autoantibodies, and organ autoimmunity is limited to partial deficiency.
    evidence:
    - reference: PMID:7834753
      reference_title: "Multiorgan inflammation and hematopoietic abnormalities in mice with a targeted disruption of RelB, a member of the NF-kappa B/Rel family."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice homozygous for the disrupted relB locus had phenotypic abnormalities including multifocal, mixed inflammatory cell infiltration in several organs, myeloid hyperplasia, splenomegaly due to extramedullary hematopoiesis, and a reduced population of thymic dendritic cells."
      explanation: Multiorgan inflammatory infiltration in the knockout.
discussions:
- discussion_id: relb_organ_autoimmunity_mechanism
  prompt: >-
    Is the organ autoimmunity of partial RelB deficiency caused by the thymic
    stromal tolerance defect, by loss of RelB restraint on RelA, or both?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Organ-Infiltrating Autoimmunity
  - mechanistic_hypotheses#mtec_central_tolerance_autoimmunity
  - mechanistic_hypotheses#rela_derepression_autoimmunity
  rationale: >-
    Sharfe et al. (2022) attribute the autoimmunity to RelA derepression
    measured in fibroblasts. Le Voyer et al. (2024) attribute it to the mTEC
    defect, by analogy with mTEC-specific Relb knockout mice. Neither was
    tested in the patients' T cells or tissues. The two hypotheses also
    leave open why complete deficiency spares the organs. A thymic account
    predicts that organ autoimmunity persists after HSCT; a hematopoietic RelA
    account predicts it resolves. No partial-deficiency patient with organ
    autoimmunity has been transplanted.
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It would therefore be interesting to determine whether this procedure can also correct organ-related autoimmunity in patients with AR partial RelB deficiency."
    explanation: The authors name the untested HSCT outcome.
- discussion_id: relb_mouse_human_autoimmunity_mismatch
  prompt: >-
    Why does germline Relb loss cause lethal multiorgan inflammation in mice
    but only anti-type I IFN autoantibodies in human complete deficiency?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Organ-Infiltrating Autoimmunity
  rationale: >-
    The mouse knockout is the main experimental basis for RelB's role in
    tolerance and inflammation, but its autoimmune phenotype is far more
    severe than the human one. Mouse findings about inflammation should not
    be transferred to patients without human data.
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autoimmune phenotype observed in P1 and P2, restricted to the development of auto-Abs against type I IFNs, sharply contrasts with that of Relb-KO mice, which die from overwhelming T lymphocyte-dependent multiple-organ inflammation at the age of 2 to 6 wk"
    explanation: States the mismatch directly.
- discussion_id: relb_thymic_stromal_defect_after_hsct
  prompt: >-
    Can the thymic stromal defect be corrected, so that transplanted patients
    stop producing anti-type I IFN autoantibodies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Medullary Thymic Epithelial Cell Maturation
  - treatments#Hematopoietic Stem Cell Transplantation
  rationale: >-
    HSCT restores lymphocyte function but leaves patients at risk of severe
    viral disease from persistent anti-type I IFN autoantibodies. Thymus
    implantation and TEC regeneration have been suggested but not tried.
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They also suggest that therapeutic options for correcting the thymic stromal defect in these patients, such as thymic implantation or stem-cell-based TEC regeneration, are worth considering"
    explanation: The authors propose untested stromal-directed therapies.

    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the thymus in this patient is dysplastic and consequently new thymus emigrants are rare and there is an accumulation of CD45 RO(+) T cells with an increase in CD62L(+) central memory cells."
    explanation: >-
      Same finding in the original complete-deficiency kindred.
  - reference: PMID:36402602

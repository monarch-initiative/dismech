- name: Defective Medullary Thymic Epithelial Cell Maturation
  description: >-
    The human thymus in RelB deficiency is hypoplastic and has a poorly formed
    medulla. mTEC specification is not fully blocked, but differentiation into
    AIRE-expressing and post-AIRE mTECs fails. This is a stromal defect, so
    hematopoietic stem cell transplantation does not correct it.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: medullary thymic epithelial cell
    term:
      id: CL:0002365
      label: medullary thymic epithelial cell
  biological_processes:

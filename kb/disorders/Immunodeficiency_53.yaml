- name: Impaired Thymopoiesis and T Cell Maturation
  description: >-
    Patients have low TRECs and few recent thymic emigrants, low naive CD4+
    and CD8+ T cells with expanded effector memory cells, skewed TCR
    repertoires with clonal expansion, and depressed T cell proliferation to
    mitogens. In partial deficiency, naive T cells decline with age. HSCT
    corrects the T cell-related infections, so part of the defect is
    hematopoietic-intrinsic.

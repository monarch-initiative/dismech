inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Patients are homozygous or compound heterozygous for RELB variants.
    Heterozygous parents and siblings are unaffected, and their plasma lacks
    autoantibodies against type I interferons.
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial segregation was, therefore, consistent with AR inheritance and complete clinical penetrance"
    explanation: >-
      Segregation of the homozygous frameshift in P1's family, with
      heterozygous parents and siblings healthy.
  - reference: PMID:37938781
    reference_title: Autoantibodies against type I IFNs in humans with alternative NF-κB pathway deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, no AAN-I-IFNs were detected in patients with autosomal-recessive BAFFR or X-linked CD40L deficiency, or in the plasma from heterozygous relatives of patients with autosomal-recessive RELB deficiency (n = 8)"
    explanation: >-
      Heterozygous carriers lack the autoantibody phenotype, consistent with
      recessive inheritance.
pathophysiology:
- name: Biallelic RELB Loss of Function
  description: >-
    Biallelic RELB variants either abolish RelB protein (the Q72fs frameshift
    and Y397* nonsense alleles are amorphic) or encode a protein with strongly
    reduced transcriptional activity (Q135dup, E145K, P364L are hypomorphic).
    The P364L protein is also unstable and expressed at very low levels.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: RelB DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  genes:
  - preferred_term: RELB
    term:
      id: hgnc:9956
      label: RELB
  evidence:
  - reference: PMID:39231201
    reference_title: Inherited human RelB deficiency impairs innate and adaptive immunity to infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that Q72fs and Y397* are amorphic, whereas Q135dup, P364L, and E145K, are strongly hypomorphic."
    explanation: >-
      Overexpression and reporter assays classify the patient alleles as null
      or strongly hypomorphic.
  - reference: PMID:36402602
    reference_title: NFκB pathway dysregulation due to reduced RelB expression leads to severe autoimmune disorders and declining immunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The P364L RelB protein was unstable, with extremely low expression, but retained some function and could be transiently and partially upregulated following Toll-like receptor stimulation."
    explanation: >-
      Shows that the P364L hypomorph acts through low protein abundance with
      residual function.
  - reference: PMID:33791233
    reference_title: Disseminated Talaromyces marneffei Infection in a Non-HIV Infant With a Homozygous Private Variant of RELB.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reverse transcription-polymerase chain reaction and Western blot analysis showed that the expression of RelB in the patient was lower than that in the healthy controls at mRNA and protein levels."
    explanation: >-
      Reduced RelB expression in the patient homozygous for the Q135dup
      in-frame insertion.
  downstream:
  - target: Impaired Alternative NF-kappaB Pathway Activation
    causal_link_type: DIRECT
    evidence:

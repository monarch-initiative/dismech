    causal_link_type: DIRECT
- name: Neutralizing Autoantibodies Against Type I Interferons
  description: >-
    Seven of eight tested patients with partial or complete RELB deficiency
    carry autoantibodies that neutralize IFN-alpha and IFN-omega. They can
    arise after hematopoietic stem cell transplantation: P1 had none before
    transplantation and developed them five years after. They are absent from
    heterozygous relatives. No HPO term exists for this finding,
    so it is recorded as a mechanism node rather than a phenotype.
  biological_scale: ORGANISM

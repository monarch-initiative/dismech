    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, these data suggest that RelB is essential for thymic T cell tolerance to type I IFNs."
    explanation: >-
      Conclusion from autoantigen profiling of two patients' plasma.
  downstream:

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Dysregulated RNA Polymerase II Transcription
  biological_scale: MOLECULAR
  description: >-
    Neuronal cells expressing the p.(Pro162del) allele show a distinct
    expression pattern, with the top 100 differentially expressed genes enriched
    for transcription factors and genes acting in RNA polymerase II
    transcription. Notably, aberrant splicing of RBMX itself was tested and
    excluded, so disturbed transcription rather than a splicing defect of the
    gene is the demonstrated downstream molecular abnormality.

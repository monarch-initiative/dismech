inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Hemizygous males are affected and the variant segregates with disease across
    the five-generation pedigree. Heterozygous carrier females are asymptomatic
    and show completely skewed X-chromosome inactivation that silences the
    pathogenic allele, so protection in carriers is molecularly explained rather
    than assumed. One affected female was described in the original report; the
    discovery authors could not investigate her further and raised uniparental
    isodisomy or an additional diagnosis as possible explanations.

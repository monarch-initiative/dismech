prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    All reported cases come from one extended Swedish family. The 1993 clinical
    report described seven affected children in two generations; by the 2023
    molecular study the pedigree contained ten affected individuals across five
    generations. No case outside this kindred has been reported, and no
    population prevalence estimate exists.
  evidence:
  - reference: PMID:8456840
    reference_title: >-
      New X-linked syndrome with severe mental retardation, severely impaired
      vision, severe hearing defect, epileptic seizures, spasticity, restricted
      joint mobility, and early death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A family with an X-linked mental retardation syndrome involving seven
      children in two generations is reported.
    explanation: >-
      Establishes the size of the index kindred at first report, the origin of
      every case in the literature.
  - reference: PMID:37277488
    reference_title: >-
      Gustavson syndrome is caused by an in-frame deletion in RBMX associated
      with potentially disturbed SH3 domain interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten individuals (III:12, III:15, III:16, IV:3, IV:5, IV:16, IV:19, IV:23,
      V:3, V:7) were affected with Gustavson syndrome.
    explanation: >-
      Gives the total affected count in the extended pedigree at the time of the
      molecular study, supporting an ultra-rare literature case count.
pathophysiology:
- name: RBMX p.(Pro162del) In-Frame Deletion
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a hemizygous in-frame deletion of a single codon in
    RBMX (NM_002139.4; c.484_486del, p.(Pro162del)), which removes one proline
    from a tri-proline region of hnRNP G. The deleted base pairs lie in an
    evolutionarily conserved locus, and the variant is absent from public
    reference genomes. Because the deletion is in frame, hnRNP G is still
    produced: expression level and nuclear localization of the protein are
    unchanged in transfected neuronal cells, so the lesion acts by altering
    protein function rather than by abolishing the protein.
  genes:
  - preferred_term: RBMX
    term:
      id: hgnc:9910
      label: RBMX
  evidence:
  - reference: PMID:37277488
    reference_title: >-
      Gustavson syndrome is caused by an in-frame deletion in RBMX associated
      with potentially disturbed SH3 domain interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive genomic analyses of the family revealed hemizygosity for a novel
      in-frame deletion in RBMX in affected individuals (NM_002139.4;
      c.484_486del, p.(Pro162del)).
    explanation: >-
      Identifies the exact causal allele in affected members of the Gustavson
      kindred.
  - reference: PMID:37277488
    reference_title: >-
      Gustavson syndrome is caused by an in-frame deletion in RBMX associated
      with potentially disturbed SH3 domain interactions.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The variant is located in an evolutionary conserved locus (phyloP score
      4.88, GERP 5.39).
    explanation: >-
      Sequence-conservation scores support functional importance of the deleted
      codon.
  downstream:
  - target: Disrupted hnRNP G SH3-Binding Motif Interaction
    description: >-
      Pro162 lies within the tri-proline region predicted to form a polyproline
      II helix; deleting it is what alters the putative SH3-binding motif.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37277488
      reference_title: >-
        Gustavson syndrome is caused by an in-frame deletion in RBMX associated
        with potentially disturbed SH3 domain interactions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Prediction tools and a fluorescence polarization assay imply a novel
        SH3-binding motif of hnRNP G, and potentially a reduced affinity to SH3
        domains caused by the deletion.
      explanation: >-
        Attributes the reduced SH3-domain affinity specifically to the deletion,
        which is this edge. The authors' hedging ("imply", "potentially") is
        carried into the node description rather than removed here.
  - target: Dysregulated RNA Polymerase II Transcription
    description: >-
      Expressing the variant allele in a neuronal cell line is what produces the
      transcriptional signature, so the deletion acts on transcription in
      parallel with its effect on SH3 binding.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37277488
      reference_title: >-
        Gustavson syndrome is caused by an in-frame deletion in RBMX associated
        with potentially disturbed SH3 domain interactions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Investigation of the variant effect in a neuronal cell line (SH-SY5Y)
        revealed differentially expressed genes enriched for transcription
        factors involved in RNA polymerase II transcription.
      explanation: >-
        The transcriptional change is measured as a consequence of introducing
        the variant, which is the causal claim this edge makes.
- name: Disrupted hnRNP G SH3-Binding Motif Interaction
  biological_scale: MOLECULAR
  description: >-
    Residues 156-169 of hnRNP G bind SH3 domains in vitro, and deleting Pro162
    weakens that binding about threefold for a short peptide against the
    BIN1-SH3 domain. The effect is context-dependent rather than absolute: a
    longer peptide spanning residues 150-170 showed no clear difference between
    wild type and mutant, and the natural cellular SH3-domain partners of hnRNP
    G are unknown. This node therefore records a credible but incompletely
    demonstrated molecular consequence, not an established pathway step.
  molecular_functions:

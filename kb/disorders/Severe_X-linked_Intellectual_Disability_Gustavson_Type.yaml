- name: Impaired Brain Development
  biological_scale: TISSUE
  description: >-
    RBMX function is required for normal brain development, and hemizygous RBMX
    variants produce neurodevelopmental disorders with variable brain
    malformations. In the Gustavson kindred the structural correlate is severe:
    neuroimaging in one affected boy showed lissencephaly with a very thick
    cortex. Zebrafish rbmx morphants lose forebrain and hindbrain marker
    expression and develop an underdeveloped head and eyes, supplying the
    developmental-biology basis for this node.
  biological_processes:
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: ABNORMAL
  locations:

    term:
      id: MONDO:0010277
      label: syndromic X-linked intellectual disability Shashi type
  description: >-
    The other RBMX-related X-linked intellectual disability, and the closest
    allelic differential. It is caused by a 23 bp frameshift deletion removing
    the C-terminal hnRNP G RGG/RG motif, whereas Gustavson syndrome is caused by
    the in-frame p.(Pro162del) affecting a putative SH3-binding motif.
  distinguishing_features:
  - >-
    Gustavson syndrome causes profound intellectual disability with early death;
    the Shashi type causes moderate intellectual disability compatible with
    survival into adulthood.
  - >-
    Structural brain abnormalities, epilepsy, severe vision defects and hearing
    loss belong to the Gustavson type and are not features of the Shashi type.
  - >-
    Obesity, macroorchidism and the coarse facial gestalt are cardinal in the
    Shashi type and are not the Gustavson presentation.
  - >-
    The two alleles disrupt different hnRNP G domains, which the discovery
    authors advance as the explanation for the difference in severity.
  evidence:
  - reference: PMID:37277488

name: Severe X-linked Intellectual Disability Gustavson Type
creation_date: "2026-09-05T02:36:43Z"
category: Mendelian
description: >-
  Gustavson syndrome (severe X-linked intellectual disability, Gustavson type;
  OMIM 309555) is an ultra-rare X-linked recessive syndromic intellectual
  disability described in a single large Swedish kindred. Affected males have
  profound intellectual disability with microcephaly, optic atrophy with
  severely impaired vision or blindness, a severe hearing defect, epileptic
  seizures, spasticity, restricted movement of the large joints, and death in
  infancy or early childhood. The locus was mapped to Xq26 by linkage in 1993,
  and the causal allele was identified thirty years later as a hemizygous
  in-frame single-codon deletion in RBMX (NM_002139.4; c.484_486del,
  p.(Pro162del)). RBMX encodes heterogeneous nuclear ribonucleoprotein G (hnRNP
  G), an RNA-binding regulator of pre-mRNA splicing; Pro162 lies in a conserved
  tri-proline region predicted to form a polyproline II helix and to act as an
  SH3-binding motif. Expressing the variant in neuronal cells dysregulates genes
  enriched for RNA polymerase II transcription, while aberrant RBMX splicing was
  specifically excluded as the mechanism.

  Gustavson syndrome is allelic with, but clinically and mechanistically
  distinct from, Shashi X-linked intellectual disability syndrome, which is
  caused by loss of the C-terminal hnRNP G RGG/RG motif and is much milder.
  Structural brain abnormalities, epilepsy, severe vision defects, hearing loss
  and early death separate the Gustavson type; the two disorders share only
  minor phenotypic overlap, which the discovery authors read as evidence that
  disruption of different hnRNP G domains produces different disease.

discussions:
- discussion_id: gustavson_lof_versus_gof_mechanism
  prompt: >-
    Does RBMX p.(Pro162del) act by loss of hnRNP G function, or is it an
    N-terminal gain-of-function allele?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#RBMX p.(Pro162del) In-Frame Deletion
  rationale: >-
    The two primary sources point in different directions. The discovery paper
    argues that early death, consistent with zebrafish knockdown and with the
    depletion of predicted loss-of-function variants in RBMX, may indicate that
    p.(Pro162del) causes loss of hnRNP G function. The later RBMX cohort study
    instead separates the spectrum by variant position, assigning partial
    loss-of-function to C-terminal variants and gain-of-function to N-terminal
    variants, the class that explicitly includes in-frame deletions. Pro162 sits
    in the N-terminal half of hnRNP G, so the two accounts conflict for this
    allele. The entry therefore does not assert a functional_impact_category,
    and the mechanism nodes describe what was measured rather than assigning a
    direction of effect.
  evidence:
  - reference: PMID:37277488
    reference_title: >-
      Gustavson syndrome is caused by an in-frame deletion in RBMX associated
      with potentially disturbed SH3 domain interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which may indicate that the p.(Pro162del) causes loss of
    explanation: >-
      The discovery authors' hedged reading of the allele as loss of function.
  - reference: PMID:42360281
    reference_title: >-
      RBMX functional retrocopy safeguards brain development in a
      species-dependent context.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RBMX pathogenic variants disrupt cortical development through both partial
      loss-of function (C-terminal variants) and gain-of-function (N-terminal
      variants) mechanisms.
    explanation: >-
      Assigns gain-of-function to N-terminal variants, the class containing
      in-frame deletions, which conflicts with a loss-of-function reading of
      p.(Pro162del).
  proposed_experiments:
  - experiment_id: gustavson_knockin_dosage_series
    name: Pro162del knock-in versus null allelic series in a human neural model
    description: >-
      Compare isogenic human neural progenitors carrying the p.(Pro162del)
      knock-in, an RBMX null, and an RBMX overexpression allele. A knock-in
      phenotype matching the null supports loss of function, while a phenotype
      absent from the null and not rescued by extra wild-type protein supports
      gain of function.
    would_support:
    - pathophysiology#RBMX p.(Pro162del) In-Frame Deletion
- discussion_id: gustavson_rodent_human_model_mismatch
  prompt: >-
    Can rodent Rbmx models be used to study Gustavson syndrome, given that
    Rbmx-deficient mice show only mild cortical abnormalities while affected
    humans have profound intellectual disability and die in early childhood?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Brain Development
  rationale: >-
    RBMX has independently arisen retrocopies in primates and rodents, and RBMX
    and RBMXL1 act redundantly in brain development, with RBMXL1 buffering RBMX
    deficiency in a context- and dosage-dependent manner. Because that buffering
    differs between species, a mild murine cortical phenotype is not evidence
    against a severe human mechanism, and rodent models may systematically
    understate the consequences of disturbed RBMX function. For this syndrome
    specifically there is a second reason for caution: no Pro162del knock-in
    model of any species exists, so every available in vivo result models loss
    of rbmx rather than the in-frame allele.
  evidence:
  - reference: PMID:42360281
    reference_title: >-
      RBMX functional retrocopy safeguards brain development in a
      species-dependent context.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite severe phenotypes in humans, Rbmx-deficient mice display only mild
      cortical abnormalities.
    explanation: States the human-model phenotype mismatch directly.
  - reference: PMID:37277488
    reference_title: >-
      Gustavson syndrome is caused by an in-frame deletion in RBMX associated
      with potentially disturbed SH3 domain interactions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene retrocopies may potentially replace or compensate hnRNP G
      function
    explanation: >-
      Raises retrocopy compensation as a candidate explanation for phenotypic
      differences, the same buffering mechanism that complicates rodent models.
  proposed_experiments:
  - experiment_id: gustavson_humanized_retrocopy_background
    name: Pro162del knock-in on RBMXL1-null and RBMXL1-intact backgrounds
    description: >-
      Introduce the Pro162del allele into mice on both Rbmxl1-competent and
      Rbmxl1-null backgrounds to test whether removing paralog buffering
      unmasks a cortical phenotype closer to the human disease.
    would_support:
    - pathophysiology#Impaired Brain Development
notes: >-
  This is a single-kindred disorder and the entry is deliberately kept thin
  rather than padded. The clinical description rests on one extended Swedish
  family reported in 1993 (seven affected children in two generations), mapped
  to Xq26 the same year, and molecularly solved in 2023 when the pedigree
  contained ten affected individuals. No case outside this family has been
  reported, so prevalence, natural history and management are not
  quantitatively described anywhere in the literature.

  No GeneReviews chapter exists for Gustavson syndrome or for RBMX-related
  intellectual disability; PubMed searches for both returned no results, so the
  GeneReviews phenotype baseline step was not applicable.

  Phenotype scope. Congenital heart defects and growth impairment are mentioned
  in the 2023 paper's summary of the historical phenotype but are not itemized
  in either 1993 abstract, and the sentence carrying them is broken across a
  page-header insertion in the cached full text. They are therefore not curated
  as phenotypes here. Only two phenotypes carry a frequency band - profound
  intellectual disability and microcephaly - because those are the cardinal
  features restated across all three primary sources; the remaining features
  come from a single list sentence that gives no per-patient counts, so under
  docs/frequency-evidence-guidelines.md the band is omitted rather than guessed.
  Lissencephaly is reported for one patient only and is banded accordingly.

  Mechanism caveat. The chain from the variant to the clinical phenotype is
  substantially inferred, and the entry says so at each step. What is
  demonstrated is the segregating allele, its conservation and absence from
  population databases, an altered transcriptional profile in transfected
  SH-SY5Y neuroblastoma cells, and a context-dependent reduction in peptide-SH3
  binding. What is not demonstrated is any of it in patient neural tissue, in a
  Pro162del animal model, or in patient-derived stem cells - none of which
  exist. Aberrant splicing of RBMX was specifically tested and excluded for this
  allele, which is why the pathophysiology runs through transcription rather
  than through the splicing function hnRNP G is best known for. The direction of
  the functional effect is itself unsettled between the two primary sources and
  is recorded as an open knowledge gap rather than resolved in the pathograph.

  Death in early childhood is modeled as an ORGANISM-scale pathophysiology
  consequence node rather than a phenotype, because the HPO death terms
  (HP:0001522, HP:0003819) are outside the phenotype dynamic enum this schema
  binds; Isolated_Sulfite_Oxidase_Deficiency uses the same convention.

  No conforms_to target was assigned. There is no splicing, hnRNP or
  RNA-binding-protein mechanism module in kb/modules/, and the epilepsy and
  neurodevelopmental modules that do exist describe mechanisms this syndrome is
  not documented to run through. The allelic Shashi entry likewise declares no
  conformance.

  Deep research: an Edison/falcon run was performed for this entry. It agreed
  with the primary literature on gene, allele, phenotype and mechanism, and
  added no citable claim of its own - it carries no PMIDs, and every reference
  it used was independently fetched and quoted from its own cached record here.

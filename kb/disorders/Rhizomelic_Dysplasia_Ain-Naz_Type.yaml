notes: >-
  Scope: this entry covers OMIM:619598 / MONDO:0859203 only. The similarly
  named "dysostosis multiplex, Ain-Naz type" (OMIM:619345, MONDO:0859156) is a
  different disorder with a different gene (LYSET/TMEM251) and a different
  skeletal pattern (dysostosis multiplex with coarse facies, resembling
  mucopolysaccharidosis). The shared eponym reflects only that Ain NU and Naz S
  are the first and last authors of both founding reports. MONDO:0859156 is
  carried here as a differential diagnosis. No claim is made about how, or
  whether, that disorder is curated elsewhere in this knowledge base: when this
  entry was written it existed only as an uncurated stub, and prose asserting
  the state of another file goes stale the moment that file changes.

  Do not confuse GNPNAT1 with GNPAT. Rhizomelic chondrodysplasia punctata
  (RCDP) is a peroxisomal plasmalogen-biosynthesis group caused by PEX7,
  GNPAT, AGPS and FAR1, is already curated in dismech under its own entries,
  and has nothing to do with the hexosamine biosynthetic pathway. GNPAT becomes
  GNPNAT1 by inserting one N and appending a 1, and the disease names both
  begin "rhizomelic"; that is the entire resemblance.

  GNPNAT1 (also GNA1) has a large cancer-metabolism literature — hexosamine
  pathway flux, O-GlcNAcylation and tumour proliferation. None of it concerns
  this disease and none of it is cited here. The one enzymology reference used
  (PMID:26935656) is cited solely for the reaction the enzyme catalyses.

  No GeneReviews chapter exists for GNPNAT1 or for this disorder. PubMed was
  searched on 2026-09-07 for "GNPNAT1 GeneReviews[All Fields]" (0 hits) and
  "rhizomelic dysplasia GeneReviews[All Fields]" (1 hit, the Achondroplasia
  chapter, unrelated), so there is no GeneReviews phenotype baseline for this
  entry.

  Three classification slots were deliberately left empty.
  isds_skeletal_category may only be assigned to disorders the ISDS Nosology of
  Genetic Skeletal Disorders itself lists, and it could not be confirmed that
  this 2021-described disorder appears in the 2023 revision (Unger et al.,
  PMID:36779427); icimd_category is left empty for the same reason relative to
  the 2021 ICIMD, which predates the gene-disease association;
  mechanistic_category has no value that fits a nucleotide-sugar supply defect.
  None of the three omissions is a claim that the disorder falls outside those
  nosologies.

  No conforms_to was declared. The nearest candidate module,
  congenital_disorder_of_glycosylation, scopes itself to defects of the
  N-glycosylation machinery converging on demonstrated protein
  hypoglycosylation; GNPNAT1 sits upstream of that machinery in
  nucleotide-sugar supply, and no hypoglycosylation has been measured in any
  reported patient. Declaring conformance would assert the mechanism this entry
  records as open (see discussion rdan_udp_glcnac_route).

  OMIM was not consulted directly: omim.org returned HTTP 403 to the fetch
  attempted for this curation, so the clinical synopsis was not read. The OMIM
  identifiers used here were still not taken on trust — OMIM:619598 was
  confirmed as an xref of MONDO:0859203, and OMIM:619345 as an xref of
  MONDO:0859156, by querying the OLS MONDO record for each. Phenotypes come from
  two sources, kept distinguishable: nine are exact quotes from PubMed-cached
  primary reports, and twelve are from the HPO Consortium disease annotation for
  OMIM:619598, which carries no quotable body and is recorded per-phenotype in
  notes with its fraction and retrieval date (discussion rdan_hpoa_provenance).

  Deep research: the committed report is a **claude_code** report
  (research/Rhizomelic_Dysplasia_Ain-Naz_Type-deep-research-claude_code.md), not
  a falcon one. The provider chain attempted was falcon (HTTP 402, Edison
  account out of credits) then openscientist by --fallback (cancelled at about
  20 minutes after sibling runs in this batch were reported timing out
  server-side at 3600 s) then claude_code, which completed in 319 s. Its
  reference validation is 4/4 resolved with 1/1 quote valid and nothing off
  topic; its term validation is 57/62 resolved with needs_review true, two
  obsolete GO terms and three mislabelled terms — of which two matter:
  UBERON:0002520 is submandibular lymph node, not "epiphyseal cartilage", and
  UBERON:0002544 is digit, not "growth plate cartilage". Neither was bound; this
  entry uses UBERON:0002516 (epiphyseal plate). The report also missed
  PMID:35427807 entirely and so counted two families rather than three, and it
  listed intellectual disability as a phenotype when the HPO annotation records
  it as an explicit 0/6 exclusion. Both errors are recorded rather than carried.

  Sections absent by fact rather than by omission. There is no progression,
  clinical_burden, stages or histopathology block because no natural-history,
  disability or tissue data have been published: the three reports give
  presentation and radiographs, and one age (8 years). There is no biochemical
  block because no biochemical measurement has been reported in any patient —
  which is itself the substance of discussion rdan_udp_glcnac_route, and is why
  that gap is recorded rather than filled. There are no clinical_trials,
  animal_models or computational_models. There is no datasets block: a dataset
  search for this disorder can only be run on the gene, and GNPNAT1 gene search
  returns hexosamine-pathway and cancer-metabolism experiments that are not
  about this disease, which is Named Entity Confusion reached through dataset
  search rather than a dataset for the entry.

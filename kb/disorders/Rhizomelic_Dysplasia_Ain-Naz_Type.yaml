name: Rhizomelic Dysplasia, Ain-Naz Type
creation_date: "2026-09-07T00:00:00Z"
description: >-
  Rhizomelic dysplasia, Ain-Naz type (OMIM 619598) is an ultra-rare autosomal
  recessive skeletal dysplasia caused by biallelic missense variants in
  GNPNAT1, which encodes glucosamine-6-phosphate N-acetyltransferase (GNA1),
  the enzyme that acetylates glucosamine-6-phosphate in the hexosamine
  biosynthetic pathway on the route to UDP-N-acetylglucosamine. The defining
  feature is short stature from extreme shortening of the proximal limb
  segments, with hip dysplasia and severe platyspondyly on radiographs; later
  reports classify it as a rhizomelic spondyloepimetaphyseal dysplasia and add
  metaphyseal flaring, brachydactyly, delayed epiphyseal ossification,
  accelerated skeletal maturation and, in one patient, immunodeficiency. Three
  families have been published, so the entry is deliberately thin and rests on
  those primary reports. How the metabolic lesion produces the skeletal
  phenotype is not established: the only functional data are siRNA knockdown of
  Gnpnat1 in cultured rat chondrocytes, and no glycosylation, O-GlcNAcylation
  or mannose-6-phosphate measurement has been reported in a patient. That
  question is recorded here as a knowledge gap, not answered.
category: Mendelian
categories:
- Skeletal Dysplasia
- Spondyloepimetaphyseal Dysplasia
- Disorder of Nucleotide-Sugar Metabolism

pathophysiology:
- name: Biallelic GNPNAT1 Missense Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous missense variants in GNPNAT1 segregate with the disease in all
    three reported families. Two unrelated families carry the same allele,
    c.226G>A p.(Glu76Lys), which the second report proposes as a potential
    mutational hotspot; the third family carries c.77T>G p.(Phe26Cys).
    Consanguinity is stated for the Pakistani index family and for the
    Egyptian family, whose parents were also confirmed heterozygous carriers;
    the report of the second patient does not state parental relationship.
  gene:
    preferred_term: GNPNAT1
    term:
      id: hgnc:19980
      label: GNPNAT1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Both reported alleles are missense. No enzyme-activity measurement has
      been published for either variant protein, so the functional consequence
      is recorded as UNKNOWN rather than assumed to be loss of function. The
      founding report used in-silico prediction and an siRNA knockdown model,
      neither of which measures what the patient allele does to the enzyme.
  chemical_entities:
  - preferred_term: alpha-D-glucosamine 6-phosphate
    term:
      id: CHEBI:15873
      label: alpha-D-glucosamine 6-phosphate
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WGS data analyses identified a homozygous missense variant c.226G>A; p.(Glu76Lys) in GNPNAT1, segregating with the disease."
    explanation: >-
      The founding report identifies the causal allele and records its
      segregation with disease in the index family.
  - reference: PMID:36097642
    reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified a novel homozygous variant in exon 3, c.77T>G, (p.Phe26Cys) in GNPNAT1, that was confirmed by Sanger sequencing and both parents were found to be heterozygous for the identified variant."
    explanation: >-
      A second, independent allele in an unrelated family, with parental carrier
      status establishing recessive segregation.
  downstream:
  - target: Reduced Glucosamine-6-Phosphate N-Acetyltransferase Activity
    causal_link_type: UNKNOWN
    description: >-
      The presumed but unmeasured first consequence. No enzyme assay has been
      performed on either patient allele, so the edge is typed UNKNOWN and
      carries no evidence rather than borrowing the knockdown result, which
      removes the transcript instead of testing the missense protein.
- name: Reduced Glucosamine-6-Phosphate N-Acetyltransferase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    GNPNAT1 encodes glucosamine-6-phosphate N-acetyltransferase (GNA1), which
    transfers an acetyl group from acetyl-CoA to glucosamine-6-phosphate to
    give N-acetylglucosamine-6-phosphate. Reduced activity of this step in
    patients is inferred from the gene-disease relationship and from the
    enzyme's known reaction; it has not been measured in patient cells.
  molecular_functions:
  - preferred_term: glucosamine 6-phosphate N-acetyltransferase activity
    term:
      id: GO:0004343
      label: glucosamine 6-phosphate N-acetyltransferase activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: N-acetyl-D-glucosamine 6-phosphate
    term:
      id: CHEBI:15784
      label: N-acetyl-D-glucosamine 6-phosphate
  evidence:
  - reference: PMID:26935656
    reference_title: "Human acetyl-CoA:glucosamine-6-phosphate N-acetyltransferase 1 has a relaxed donor specificity and transfers acyl groups up to four carbons in length."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Glucosamine-6-phosphate N-acetyltransferase1 (GNA1) catalyses the transfer of an acetyl group from acetyl coenzyme A (AcCoA) to glucosamine-6-phosphate (GlcN6P) to form N-acetylglucosamine-6-phosphate (GlcNAc6P), which is an essential intermediate in UDP-GlcNAc biosynthesis."
    explanation: >-
      Establishes the reaction the affected enzyme catalyses and its position in
      UDP-GlcNAc biosynthesis. It says nothing about the patient alleles, which
      is why the node is graded HYPOTHETICAL.
  downstream:
  - target: Diminished UDP-GlcNAc Supply
    causal_link_type: DIRECT
    description: >-
      The acetyltransferase step is obligatory for UDP-GlcNAc synthesis, so a
      reduction in it reduces flux to the nucleotide sugar.
    evidence:
    - reference: PMID:26935656
      reference_title: "Human acetyl-CoA:glucosamine-6-phosphate N-acetyltransferase 1 has a relaxed donor specificity and transfers acyl groups up to four carbons in length."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "which is an essential intermediate in UDP-GlcNAc biosynthesis"
      explanation: >-
        States that the product of this enzyme is an essential intermediate of
        UDP-GlcNAc biosynthesis, which is the causal step this edge asserts.
- name: Diminished UDP-GlcNAc Supply
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    GNPNAT1 is one of the enzymes of the hexosamine biosynthetic pathway, whose
    product UDP-N-acetylglucosamine is the donor sugar for protein
    N-glycosylation, O-GlcNAcylation, glycosaminoglycan chain extension and the
    mannose-6-phosphate tagging of lysosomal hydrolases. Reduced supply is the
    proposed link between the enzyme lesion and the skeleton. No measurement of
    UDP-GlcNAc, of protein glycosylation or of O-GlcNAcylation has been
    published in a patient with this disorder, so the node is graded
    HYPOTHETICAL and no specific downstream glycosylation route is asserted
    (see discussion rdan_udp_glcnac_route).
  biological_processes:
  - preferred_term: UDP-N-acetylglucosamine biosynthetic process
    term:
      id: GO:0006048
      label: UDP-N-acetylglucosamine biosynthetic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: UDP-N-acetylglucosamine
    term:
      id: CHEBI:16264
      label: UDP-N-acetyl-alpha-D-glucosamine
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glucosamine 6-phosphate N-acetyltransferase, encoded by the highly conserved gene GNPNAT1, is one of the enzymes required for synthesis of uridine diphosphate N-acetylglucosamine, which participates in protein glycosylation."
    explanation: >-
      The founding report's own statement of the pathway the affected enzyme
      belongs to and of the downstream process it feeds. Graded OTHER, not
      HUMAN_CLINICAL: this sentence restates established pathway biochemistry
      rather than reporting a result of the study, and the study's clinical and
      in-vitro arms are cited separately elsewhere in this entry.
  - reference: PMID:36097642
    reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resembling Desbuquois like dysplasia caused by PGM3, which is involved in the same pathway as GNPNAT1"
    explanation: >-
      Independent support for locating the lesion in this pathway: a second
      skeletal dysplasia with immunodeficiency arises from PGM3, the enzyme
      immediately downstream of GNPNAT1 in the same route to UDP-GlcNAc.
  - reference: PMID:24931394
    reference_title: "PGM3 mutations cause a congenital disorder of glycosylation with severe immunodeficiency and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Human phosphoglucomutase 3 (PGM3) catalyzes the conversion of N-acetyl-glucosamine (GlcNAc)-6-phosphate into GlcNAc-1-phosphate during the synthesis of uridine diphosphate (UDP)-GlcNAc, a sugar nucleotide critical to multiple glycosylation pathways."
    explanation: >-
      Names the reaction immediately downstream of GNPNAT1 — PGM3 acts on
      GlcNAc-6-phosphate, which is the GNPNAT1 product — and states that
      UDP-GlcNAc feeds multiple glycosylation pathways, which is why this node
      does not commit to one of them. Graded OTHER because the sentence states
      established pathway biochemistry rather than a result of the study.
  downstream:
  - target: Impaired Growth Plate Chondrocyte Proliferation and Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of Gnpnat1 impairs chondrocyte proliferation and differentiation in
      culture. Which UDP-GlcNAc-dependent process carries the effect is not
      established, so the intermediates are recorded as unknown.
    evidence:
    - reference: PMID:32591345
      reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Knockdown of Gnpnat1 by siRNAs decreased cellular proliferation and expression of chondrocyte differentiation markers collagen type 2 and alkaline phosphatase, indicating that Gnpnat1 is important for growth plate chondrocyte proliferation and differentiation."
      explanation: >-
        Removing the gene product from cultured chondrocytes impairs
        proliferation and differentiation. Graded INDIRECT because the
        experiment removes the transcript rather than lowering UDP-GlcNAc, so
        it supports the edge through an inference step.
- name: Impaired Growth Plate Chondrocyte Proliferation and Differentiation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Chondrocyte proliferation and the expression of differentiation markers
    fall when Gnpnat1 is knocked down in primary rat chondrocytes. This is the
    only functional evidence linking the gene to cartilage, and it is in
    cultured rodent cells; no human growth-plate or human chondrocyte data
    exist for this disorder.
  cell_types:

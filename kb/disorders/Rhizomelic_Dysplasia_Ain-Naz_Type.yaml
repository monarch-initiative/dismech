    reference_title: "A second individual with rhizomelic spondyloepimetaphyseal dysplasia and homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Rhizomelic SEMD is characterized by a disproportionate small stature caused by severe shortening and deformation of the limbs' proximal bones, with the cranio-facial sphere unaffected."
    explanation: >-
      Defines the skeletal distribution this node describes, including the
      craniofacial sparing that separates it from the dysostosis multiplex

diagnosis:
- name: Radiographic skeletal survey
  description: >-
    Radiography is what establishes that the short stature is a
    spondyloepimetaphyseal dysplasia with rhizomelic predominance rather than a
    non-syndromic short stature, and it carries the discriminating findings —
    severe platyspondyly, hip dysplasia, flared metaphyses and delayed
    epiphyseal ossification, with the craniofacial skeleton spared. It places
    the patient in the category that then gets sequenced; it cannot identify the
    gene.
  diagnosis_term:
    preferred_term: radiographic skeletal survey
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  results: >-
    Hip dysplasia, severe platyspondyly, wide flared metaphyses, short broad
    long bones and delayed epiphyseal ossification of the long bones.
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs of one individual showed hip dysplasia and severe platyspondyly."
    explanation: >-
      Records that radiography is how the discriminating skeletal findings were
      obtained in the index family.
- name: Molecular confirmation by genome or exome sequencing
  description: >-
    The diagnosis is established by finding a biallelic GNPNAT1 variant. Both
    routes have been used: whole genome sequencing in the two families carrying
    p.(Glu76Lys) and whole exome sequencing with Sanger confirmation in the
    family carrying p.(Phe26Cys). Because the disorder was described in 2021,
    GNPNAT1 may be absent from older skeletal-dysplasia panels, so a panel that
    predates the gene-disease association cannot exclude it.
  diagnosis_term:
    preferred_term: whole genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  results: >-
    A homozygous GNPNAT1 missense variant segregating with disease.
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing (WGS) was completed using DNA from two affected and two unaffected individuals from the family."
    explanation: The sequencing method that made the molecular diagnosis in the index family.
  - reference: PMID:35427807
    reference_title: "A second individual with rhizomelic spondyloepimetaphyseal dysplasia and homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in GNPNAT1 identified by trio genome sequencing"
    explanation: Trio genome sequencing as the diagnostic route in the second patient.
- name: Exome sequencing with Sanger confirmation and parental carrier testing
  description: >-
    The route used in the third family: exome sequencing, Sanger confirmation of
    the candidate variant, and demonstration that both parents are heterozygous
    carriers. Parental testing is what established recessive segregation for
    that allele, since the family had only one affected child.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Homozygous c.77T>G p.(Phe26Cys) in the proband, heterozygous in both parents.
  evidence:
  - reference: PMID:36097642
    reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified a novel homozygous variant in exon 3, c.77T>G, (p.Phe26Cys) in GNPNAT1, that was confirmed by Sanger sequencing and both parents were found to be heterozygous for the identified variant."
    explanation: Records all three steps of the diagnostic route used in the third family.
differential_diagnoses:
- name: Dysostosis multiplex, Ain-Naz type
  disease_term:
    preferred_term: dysostosis multiplex, Ain-Naz type
    term:
      id: MONDO:0859156
      label: dysostosis multiplex, Ain-Naz type
  description: >-
    A separate disorder that shares the Ain-Naz eponym only because Ain NU and
    Naz S are the first and last authors of both founding reports. It is caused
    by biallelic LYSET (TMEM251) variants and presents as a dysostosis multiplex
    with coarse facial features resembling mucopolysaccharidosis, not as
    rhizomelic shortening with platyspondyly. The distinction is recorded here
    against MONDO:0859156 directly, rather than by pointing at another file
    whose state this entry cannot vouch for.
  distinguishing_features:
  - >-
    Different gene (LYSET/TMEM251 versus GNPNAT1) and different OMIM entry
    (619345 versus 619598).
  - >-
    Different skeletal pattern: dysostosis multiplex with progressively coarse
    facies, protruding abdomen and a mucopolysaccharidosis-like picture, versus
    rhizomelic shortening with severe platyspondyly and an explicitly spared
    craniofacial skeleton.
  - >-
    The two are mechanistically adjacent rather than unrelated — GNPNAT1 makes
    the UDP-GlcNAc that GlcNAc-1-phosphotransferase uses as its donor, and LYSET
    is required for that phosphotransferase — but no lysosomal enzyme
    abnormality has been reported in the GNPNAT1 disorder, and adjacency is not
    identity.
  evidence:
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified two homozygous variants c.133C>T; p.(Arg45Trp) and c.215dupA; p.(Tyr72Ter), respectively, in the two families, affecting an evolutionary conserved gene TMEM251"
    explanation: >-
      Establishes that the other Ain-Naz disorder is a TMEM251 (LYSET) disorder,
      so the shared eponym does not indicate a shared gene.
  - reference: PMID:33252156
    reference_title: "Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected individuals had a dysostosis multiplex-like skeletal dysplasia and severe short stature"
    explanation: >-
      Describes the dysostosis multiplex pattern that distinguishes the LYSET
      disorder from the rhizomelic pattern curated here.
- name: PGM3 deficiency (immunodeficiency 23)
  disease_term:
    preferred_term: immunodeficiency 23
    term:
      id: MONDO:0014353
      label: immunodeficiency 23
  description: >-
    A congenital disorder of glycosylation caused by biallelic PGM3 variants.
    PGM3 catalyses the step immediately after GNPNAT1 in the route to
    UDP-GlcNAc, and its severe forms present with skeletal dysplasia and
    immunodeficiency together — which is why the third GNPNAT1 report described
    its patient as resembling PGM3-related Desbuquois-like dysplasia. This is
    the differential that matters most for the one GNPNAT1 patient reported with
    immunodeficiency.
  distinguishing_features:
  - >-
    Resolved by sequencing: PGM3 versus GNPNAT1. The clinical overlap is real
    and is the reason the two were compared in the literature.
  - >-
    PGM3 deficiency is defined by its immune phenotype, most often eczema,
    elevated IgE and infection, with skeletal features in a subset; the GNPNAT1
    disorder is defined by its skeletal phenotype, with immunodeficiency
    reported in one patient only.
  evidence:
  - reference: PMID:36097642
    reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resembling Desbuquois like dysplasia caused by PGM3, which is involved in the same pathway as GNPNAT1"
    explanation: >-
      The GNPNAT1 report itself names the PGM3 disorder as the phenotypic and
      pathway comparator.
  - reference: PMID:33534079
    reference_title: "Two Novel Homozygous Mutations in Phosphoglucomutase 3 Leading to Severe Combined Immunodeficiency, Skeletal Dysplasia, and Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A few PGM3-deficient patients suffer from a more severe disease with nearly absent T cells and severe skeletal dysplasia."
    explanation: >-
      Documents the severe PGM3 phenotype that combines skeletal dysplasia with
      immunodeficiency, the combination reported once in a GNPNAT1 patient.
  - reference: PMID:24931394
    reference_title: "PGM3 mutations cause a congenital disorder of glycosylation with severe immunodeficiency and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the three children had skeletal anomalies resembling Desbuquois dysplasia: short stature, brachydactyly, dysmorphic facial features, and intellectual disability."
    explanation: >-
      The Desbuquois-like skeletal picture the third GNPNAT1 report compared its
      patient to, in the original PGM3-CDG series. Note the difference as well
      as the resemblance: intellectual disability is part of that PGM3
      phenotype, and is an explicit 0/6 exclusion in the HPO annotation for this
      disorder.
  - reference: PMID:24931394
    reference_title: "PGM3 mutations cause a congenital disorder of glycosylation with severe immunodeficiency and skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two children received hematopoietic stem cell transplantation of cord blood and bone marrow from matched related donors; both had successful engraftment and correction of neutropenia and lymphopenia."
    explanation: >-
      The one therapeutic result anywhere in this pathway. It corrected the
      haematological phenotype of PGM3-CDG; it says nothing about a skeletal
      outcome and nothing at all about GNPNAT1, which is why it is cited on the
      differential rather than in treatments.
- name: Rhizomelic chondrodysplasia punctata
  disease_term:
    preferred_term: rhizomelic chondrodysplasia punctata
    term:
      id: MONDO:0015776
      label: rhizomelic chondrodysplasia punctata
  description: >-
    Included as an explicit exclusion rather than a close mimic. RCDP is a
    peroxisomal plasmalogen-biosynthesis group caused by PEX7, GNPAT, AGPS and
    FAR1. It shares the word "rhizomelic" and, in GNPAT, a gene symbol one
    inserted N and one appended digit away from GNPNAT1, and nothing else: the
    pathway, the
    radiographic hallmark (epiphyseal stippling) and the natural history are all
    different. dismech curates RCDP under its own entries. This record exists so
    that the near-collision is documented rather than left to be rediscovered.
  distinguishing_features:
  - >-
    Different pathway entirely: peroxisomal ether-phospholipid (plasmalogen)
    biosynthesis, not the cytosolic hexosamine biosynthetic pathway.
  - >-
    GNPAT (glyceronephosphate O-acyltransferase, dihydroxyacetone phosphate
    acyltransferase) is not GNPNAT1 (glucosamine-6-phosphate
    N-acetyltransferase). The symbols are two edits apart and the products are
    unrelated.
  - >-
    RCDP is characterised radiographically by punctate epiphyseal calcification
    (chondrodysplasia punctata), which has not been reported in this disorder.
  notes: >-
    No evidence item is attached. This is a curation guardrail recording a
    known confusion risk, not a clinical claim about either disorder, and the
    RCDP entries carry their own cited content.
experimental_models:
- name: Gnpnat1 siRNA knockdown in primary rat chondrocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    The only functional model reported for this disorder. Primary chondrocytes
    isolated from rat were transfected with small interfering RNAs against
    Gnpnat1, and proliferation and chondrocyte differentiation markers were
    measured. It is a knockdown model, so it removes the transcript rather than
    reproducing either patient missense allele, and it is rodent rather than
    human.
  organism:
    preferred_term: Norway rat
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  cell_source: Primary rat chondrocytes
  culture_system: Two-dimensional primary cell culture with siRNA transfection
  publication: PMID:32591345
  modeled_mechanisms:
  - target: Impaired Growth Plate Chondrocyte Proliferation and Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Knockdown reproduces the proposed cellular lesion — reduced chondrocyte
      proliferation and reduced expression of differentiation markers — and is
      the sole experimental support for locating this disorder's mechanism in
      the chondrocyte.
    limitations: >-
      Rodent rather than human cells; transient siRNA knockdown of the
      transcript rather than either homozygous human missense allele, so it
      models a null and cannot say what the patient proteins do; two-dimensional
      culture with no growth-plate architecture, no zonal organisation and no
      endochondral ossification, so the rhizomelic distribution and the
      platyspondyly of the human disease are outside the model entirely; and no
      measurement of UDP-GlcNAc, glycosylation or O-GlcNAcylation was made, so
      the model does not test the metabolic step the disorder is named for.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Rat primary chondrocytes stand in for human growth-plate chondrocytes.
        No human chondrocyte or growth-plate data exist for this disorder, so
        there is nothing to calibrate the substitution against.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: INVALIDATING
      description: >-
        The disease-causing lesion is a homozygous missense allele. The model
        applies siRNA knockdown, which lowers transcript abundance; a missense
        protein that is expressed and partially active is a different cause and
        is not represented.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Growth-plate zonal architecture, the perichondrium, vascular invasion
        and ossification are all outside the model boundary, so the radiographic
        phenotype the disorder is defined by cannot be observed in it.
    readouts:
    - name: Chondrocyte proliferation
      target: Impaired Growth Plate Chondrocyte Proliferation and Differentiation
      direction: DECREASED
      interpretation: >-
        Cellular proliferation fell after knockdown, the proliferative half of
        the node this link supports.
      evidence:
      - reference: PMID:32591345
        reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Knockdown of Gnpnat1 by siRNAs decreased cellular proliferation"
        explanation: Reports the proliferation measurement and its direction.
    - name: Collagen type 2 and alkaline phosphatase expression
      target: Impaired Growth Plate Chondrocyte Proliferation and Differentiation
      direction: DECREASED
      interpretation: >-
        The two chondrocyte differentiation markers measured; their fall is the
        differentiation half of the node.
      evidence:
      - reference: PMID:32591345
        reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "decreased cellular proliferation and expression of chondrocyte differentiation markers collagen type 2 and alkaline phosphatase"
        explanation: >-
          Names the two differentiation markers measured and the direction of
          the change.
    evidence:
    - reference: PMID:32591345
      reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Small interfering RNAs (siRNAs) were used to study the effect of Gnpnat1 gene knockdown in primary rat chondrocytes."
      explanation: >-
        Establishes the model system and its use as the functional arm of the
        founding report, which is what makes it informative for this node.
  notes: >-
    No animal model, organoid, iPSC line or patient-derived fibroblast culture
    has been reported for this disorder, so animal_models and computational_models
    are absent from this entry by fact rather than by omission.
treatments:
- name: Supportive and symptomatic management
  description: >-
    No disease-specific or disease-modifying treatment has been reported for
    this disorder. None of the three primary reports describes a therapeutic
    intervention or an outcome after treatment; a PubMed search of GNPNAT1 on
    2026-09-07 returned no management or trial publication, and a
    ClinicalTrials.gov query for GNPNAT1 and for rhizomelic dysplasia returned
    zero studies. Management is therefore supportive by default —
    the general orthopaedic, growth and rehabilitative care given in severe
    skeletal dysplasia — and this entry records the absence of evidence rather
    than asserting a standard of care. The specific supportive measures a
    patient might receive are not curated here because no source describes them
    for this disorder.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately uncited. There is nothing to cite: a search of the three
    primary reports found no treatment content, and quoting a management
    statement from a different skeletal dysplasia would attribute to this
    disorder a claim no source makes about it. See discussion
    rdan_no_therapy_evidence. therapeutic_modality is deliberately omitted:
    Supportive Care is a generic action term whose modality depends on the
    specific intervention, and no specific intervention is described for this
    disorder anywhere.
discussions:
- discussion_id: rdan_udp_glcnac_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which UDP-GlcNAc-dependent process carries the skeletal phenotype of
    GNPNAT1 deficiency — mannose-6-phosphate tagging of lysosomal hydrolases,
    O-GlcNAcylation, N-glycosylation, or glycosaminoglycan synthesis?
  attaches_to:
  - pathophysiology#Diminished UDP-GlcNAc Supply
  rationale: >-
    GNPNAT1 supplies UDP-GlcNAc, which is the donor for at least four distinct
    processes with plausible skeletal consequences, and the published work does
    not distinguish between them. The mannose-6-phosphate route is the most
    tempting because the sugar donated by GlcNAc-1-phosphotransferase comes from
    UDP-GlcNAc and because the similarly named LYSET disorder is a defect of
    that same phosphotransferase — but no lysosomal enzyme assay, urinary
    glycosaminoglycan measurement or M6P study has been reported in any GNPNAT1
    patient, and none of the three abstracts consulted for this entry describes
    coarse facies, organomegaly or the storage picture that a
    mannose-6-phosphate defect produces — though an abstract would not
    necessarily record their absence. The
    O-GlcNAc route is equally unmeasured. The founding report's own framing is
    the broadest one, "participates in protein glycosylation", and this entry
    goes no further than that. Resolving this needs patient fibroblasts:
    UDP-GlcNAc quantitation, a glycosylation screen (transferrin isoform
    analysis or equivalent), an O-GlcNAc immunoblot, and plasma and fibroblast
    lysosomal enzyme activities. The two evidence items below establish only
    that the donor relationship exists; neither says anything about a patient
    with this disorder.
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which participates in protein glycosylation"
    explanation: >-
      The founding report goes no further than naming protein glycosylation
      generically, which is the extent of what is established. Graded OTHER for
      the same reason as the fuller quotation of this sentence on the
      Diminished UDP-GlcNAc Supply node: it is background biochemistry, not a
      finding of the study.
  - reference: PMID:39178950
    reference_title: "Structure of a truncated human GlcNAc-1-phosphotransferase variant reveals the basis for its hyperactivity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PTase is the key enzyme of the mannose 6-phosphate (M6P) targeting system that is responsible for tagging lysosomal hydrolases with the M6P moiety for their delivery to the lysosome."
    explanation: >-
      Establishes the mannose-6-phosphate route that makes this question worth
      asking. It concerns the phosphotransferase, not GNPNAT1, and is cited only
      to show that UDP-GlcNAc feeds that pathway — not to assert that this
      disorder runs through it.
  status: OPEN
- discussion_id: rdan_immunodeficiency_single_case
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is immunodeficiency a feature of GNPNAT1 deficiency, or a feature of the one
    patient in whom it was reported?
  attaches_to:
  - phenotypes#Immunodeficiency
  rationale: >-
    Immunodeficiency is reported in exactly one patient, who is also the only
    patient carrying the p.(Phe26Cys) allele, and the record consulted gives no
    immunological detail — no immunoglobulin levels, lymphocyte subsets or
    infection history. Two readings fit equally: the phenotype includes an
    immune component that the earlier reports did not look for, or this is
    allele-specific or incidental. The question is not idle, because PGM3 — the
    next enzyme in the same pathway — causes a disorder in which skeletal
    dysplasia and immunodeficiency occur together, so a shared immune
    consequence of reduced UDP-GlcNAc supply is biologically plausible. It would
    be resolved by immunophenotyping the patients from the other two families,
    which has not been reported. No frequency band is attached to the phenotype
    for this reason.
  status: OPEN
- discussion_id: rdan_variant_function_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    What do the two reported GNPNAT1 missense alleles actually do to enzyme
    activity?
  attaches_to:
  - pathophysiology#Biallelic GNPNAT1 Missense Variants
  rationale: >-
    Both p.(Glu76Lys) and p.(Phe26Cys) are missense, and neither has been
    assayed. The functional work in the founding report is siRNA knockdown,
    which removes the transcript and therefore models a null rather than either
    patient allele; the rest is in-silico prediction. This is why the entry
    records functional_impact_category as UNKNOWN and grades the enzyme-activity
    node HYPOTHETICAL. A recombinant activity assay against
    glucosamine-6-phosphate, of the kind already published for wild-type human
    GNA1 in PMID:26935656 and cited elsewhere in this entry for that enzymology,
    would settle it, and would also say whether the two alleles behave alike —
    which matters for the immunodeficiency question above.
  status: OPEN
- discussion_id: rdan_sirna_models_a_null_not_the_alleles
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does siRNA knockdown of Gnpnat1 in rat chondrocytes tell us what the human
    missense alleles do, given that it removes the transcript rather than
    expressing a variant protein?
  attaches_to:
  - experimental_models#Gnpnat1 siRNA knockdown in primary rat chondrocytes
  - pathophysiology#Impaired Growth Plate Chondrocyte Proliferation and Differentiation
  rationale: >-
    This is the mismatch case rather than the absent-evidence case, and the two
    are separate questions. Evidence does exist here: knockdown lowers
    chondrocyte proliferation and differentiation marker expression, and it is
    the sole experimental support for locating this disorder's mechanism in the
    chondrocyte. What is open is whether it translates. Both reported alleles
    are missense and are carried homozygously, so they produce protein that is
    expressed and may retain partial activity; siRNA removes the transcript and
    therefore models a null. The link records that as a CAUSE_UNREPRESENTED divergence
    with materiality INVALIDATING for exactly this reason. The species
    substitution and the absence of growth-plate architecture compound it. The
    mismatch would be resolved by expressing the patient alleles rather than
    silencing the gene — a knock-in or a rescue of knockdown cells with variant
    cDNA — which no report has done. The companion gap
    rdan_variant_function_unmeasured asks the different question of what the
    alleles do biochemically; this one asks whether the existing cellular
    phenotype can be read as theirs.
  status: OPEN
- discussion_id: rdan_no_therapy_evidence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is any disease-modifying approach conceivable for a defect in
    nucleotide-sugar supply, and would substrate supplementation be a rational
    place to start?
  attaches_to:
  - treatments#
  rationale: >-
    Nothing is published on treatment. The mechanism raises an obvious question
    that no one has asked in print: GNPNAT1 acts on glucosamine-6-phosphate, and
    the salvage route through GlcNAc kinase enters the pathway downstream of
    GNPNAT1, so oral N-acetylglucosamine would in principle bypass the block.
    That is a hypothesis generated here from pathway topology, not a finding —
    no such experiment has been reported in this disorder, in a GNPNAT1 model
    system, or in PGM3 deficiency, and the skeletal lesion may in any case be
    developmental and therefore not correctable after presentation. It is
    recorded so the reasoning is auditable and not so that it is acted on. This
    is an absence of evidence, not evidence of futility.
  status: OPEN
- discussion_id: rdan_phenotype_breadth
  kind: CURATION_TODO
  prompt: >-
    Should the remaining 29 terms of the HPO annotation for OMIM:619598 be
    curated as phenotypes here, and can any of them be tied to a quotable
    passage in a primary report?
  attaches_to:
  - phenotypes#
  rationale: >-
    The HPO Consortium annotation for OMIM:619598 carries 41 terms with
    per-term fractions. Twelve of them are curated here, chosen because they are
    full-cohort annotations or because they carry the radiographic
    spondyloepimetaphyseal pattern; the rest are not, and they are not
    worthless. The uncurated ones include scoliosis, lumbar hyperlordosis,
    pectus excavatum, flaring of the rib cage, bowed forearm bones, proximal and
    distal humeral metaphyseal irregularity, wide distal femoral metaphysis,
    aplasia of the femoral head, hallux valgus, overlapping toe, short distal
    phalanx of finger, contracture of the proximal interphalangeal joint of the
    fifth finger, protuberant abdomen, short neck, congenital onset and
    infantile onset, and the five craniofacial terms listed in
    rdan_craniofacial_tension. Most are annotated 1/1 — a single observation in
    a single individual — which is why they were left for a curator with the
    full texts rather than imported in bulk.

    Two annotations are exclusions and must not be read as features. Intellectual
    disability (HP:0001249) is annotated 0/6 and abnormality of alkaline
    phosphatase level (HP:0004379) 0/1: the HPO records them as looked for and
    absent. The deep-research report generated for this entry listed intellectual
    disability among the phenotypes, which is exactly the error the fraction
    prevents; it is recorded here so the mistake is not made again.

    Resolving this needs the full texts of the three primary reports and the
    OMIM clinical synopsis, which could not be read for this curation because
    omim.org returned HTTP 403.
  status: OPEN
- discussion_id: rdan_hpoa_provenance
  kind: CURATION_TODO
  prompt: >-
    Twelve phenotypes and three frequency bands in this entry rest on the HPO
    disease annotation for OMIM:619598 rather than on a quoted passage. Should
    they carry evidence, and if so from where?
  attaches_to:
  - phenotypes#
  rationale: >-
    dismech evidence policy asks for an exact quote from a cited source. The HPO
    Consortium disease annotation is a structured, authoritative, versioned
    resource, but it is not a reference prefix this repository caches, so there
    is no cached body to quote and no identifier a snippet could be checked
    against. Rather than manufacture a quote or drop the content, each affected
    phenotype records its provenance in notes: the API endpoint
    (ontology.jax.org/api/network/annotation/OMIM:619598), the retrieval date
    (2026-09-07), and the exact annotated fraction. The three VERY_FREQUENT
    bands are the 6/6 and 5/5 annotations and nothing else; every other
    phenotype in the entry carries no frequency.

    The annotation is itself derived, one step removed from the primary reports
    by way of the OMIM clinical synopsis, so a curator with the full texts
    should be able to replace these notes with quoted evidence. Until then, read
    these twelve as traceable but not snippet-verified, and distinguish them
    from the nine phenotypes in this entry that do carry an exact quote from a
    cached PubMed abstract. Adding an HPOA reference source to
    references_cache/, in the way ORPHA and ClinGen were added, would close this
    gap for every disorder entry rather than only this one.
  status: OPEN
- discussion_id: rdan_craniofacial_tension
  kind: CONTROVERSY
  prompt: >-
    Is the craniofacial skeleton spared in this disorder, as the second report's
    definition of rhizomelic SEMD states, or mildly involved, as the HPO
    annotation implies?
  attaches_to:
  - pathophysiology#Disordered Endochondral Ossification
  rationale: >-
    The second report defines rhizomelic SEMD as sparing the cranio-facial
    sphere, and that sparing is one of the features that separates this disorder
    from the dysostosis multiplex pattern of the LYSET disorder it is confused
    with. The HPO annotation for OMIM:619598 nonetheless records frontal bossing,
    hypertelorism, ptosis, downslanted palpebral fissures and a wide nasal
    bridge, each in one of six individuals, and Wormian bones in one of one.

    These are reconcilable: five of the six terms are single-individual
    annotations out of six, so a category-level statement that the craniofacial
    sphere is unaffected is compatible with minor, inconsistent findings in
    individual patients — and none of the annotated terms is the progressive
    coarsening that defines dysostosis multiplex. The tension is recorded rather
    than resolved because resolving it needs the per-patient descriptions in the
    full texts, and because a reader who takes "cranio-facial sphere unaffected"
    at face value would be surprised by the annotation. Only Wormian bones is
    curated as a phenotype here, as the one craniofacial finding that is
    skeletal rather than a facial-gestalt descriptor.
  status: OPEN

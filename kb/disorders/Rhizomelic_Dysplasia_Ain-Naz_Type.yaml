genetic:
- name: GNPNAT1
  gene_term:
    preferred_term: GNPNAT1
    term:
      id: hgnc:19980
      label: GNPNAT1
  relationship_type: CAUSATIVE
  association: Biallelic missense variants cause the disorder.
  variant_origin: GERMLINE
  notes: >-
    GNPNAT1 is also known as GNA1. Two alleles have been reported, both
    homozygous missense: c.226G>A p.(Glu76Lys) in two unrelated families and
    c.77T>G p.(Phe26Cys) in a third. The recurrence of the Glu76Lys allele in two
    unrelated families led the second report to propose "a potential hotspot";
    on two families that remains a proposal. The ancestry of the second patient
    is not stated in the record consulted and is not inferred here from the
    journal.
    Neither allele has been assayed for enzyme activity, so no
    functional_impact_category is asserted. GNPNAT1 does not appear in the
    ClinGen Gene-Disease Validity table downloaded on 2026-09-07, so there is no
    expert-panel validity classification to cite alongside these three reports.
    No Orphanet record was found for the disorder either, but that check was a
    name and OMIM-crossreference query against the Orphanet API rather than an
    exhaustive one, so read it as "not found" rather than "does not exist".
  evidence:
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study describes a novel severe skeletal dysplasia associated with a biallelic, variant in GNPNAT1."
    explanation: The founding report's statement of the gene-disease relationship.
  - reference: PMID:36097642
    reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that variants in the GNPNAT1 gene cause an autosomal recessive form of SEMD resembling Desbuquois like dysplasia caused by PGM3, which is involved in the same pathway as GNPNAT1."
    explanation: >-
      Independent replication of the gene-disease relationship in a third
      family, with a second allele.
  variants:
  - name: GNPNAT1 c.226G>A p.(Glu76Lys)
    description: >-
      Homozygous missense allele in the consanguineous Pakistani index family
      and, independently, in an 8-year-old girl reported two years later. The
      second report proposes it as a potential hotspot.
    evidence:
    - reference: PMID:35427807
      reference_title: "A second individual with rhizomelic spondyloepimetaphyseal dysplasia and homozygous variant in GNPNAT1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a second individual, an 8-year-old girl, with autosomal recessive rhizomelic SEMD associated with a homozygous exonic missense variant, c.226G > A p.(Glu76Lys), in GNPNAT1 identified by trio genome sequencing."
      explanation: Reports the same allele in a second, unrelated individual.
    - reference: PMID:35427807
      reference_title: "A second individual with rhizomelic spondyloepimetaphyseal dysplasia and homozygous variant in GNPNAT1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "outlining a potential hotspot in this newly described genetic disorder"
      explanation: >-
        The authors' own hedged claim of a mutational hotspot, quoted as the
        proposal it is.
  - name: GNPNAT1 c.77T>G p.(Phe26Cys)
    description: >-
      Homozygous missense allele in exon 3 in an Egyptian patient born to
      consanguineous parents, both of whom were heterozygous carriers. This is
      the allele reported alongside immunodeficiency.
    evidence:
    - reference: PMID:36097642
      reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing identified a novel homozygous variant in exon 3, c.77T>G, (p.Phe26Cys) in GNPNAT1, that was confirmed by Sanger sequencing and both parents were found to be heterozygous for the identified variant."
      explanation: Reports the allele, its confirmation and parental carrier status.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: UNKNOWN
  description: >-
    All three reported families are homozygous for a GNPNAT1 missense allele.
    Consanguinity is stated for the Pakistani index family and for the Egyptian
    family, in which both parents were additionally confirmed to be
    heterozygous carriers; the second report does not state parental
    relationship.

    Penetrance is recorded as COMPLETE on the strength of segregation rather
    than of a measured figure: the founding report sequenced two affected and
    two unaffected members of the index family and found the variant segregating
    with disease, and no unaffected homozygote has been reported in any family.
    Across six affected individuals ascertained through affected probands, that
    is an absence of counterexamples, not an estimate.

    Expressivity is left UNKNOWN, and deliberately not called variable. The
    clinical descriptions do differ between reports — the Egyptian patient has
    immunodeficiency, advanced bone age and brachydactyly, none of which appear
    in the founding description — but that patient is also the only carrier of
    the p.(Phe26Cys) allele, so genotype and phenotype differ together. The two
    families that do share a genotype, both homozygous for p.(Glu76Lys), are
    described consistently, with the second report presenting itself as further
    delineating the same picture rather than widening it. Variable expressivity
    is therefore not what the published data show; what they show is two alleles
    with two descriptions, confounded with how deeply each was worked up.
  evidence:
  - reference: PMID:35427807
    reference_title: "A second individual with rhizomelic spondyloepimetaphyseal dysplasia and homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with autosomal recessive rhizomelic SEMD associated with a homozygous exonic missense variant"
    explanation: States the mode of inheritance directly.
  - reference: PMID:36097642
    reference_title: "A novel variant in GNPNAT1 gene causing a spondylo-epi-metaphyseal dysplasia resembling PGM3-Desbuquois like dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that variants in the GNPNAT1 gene cause an autosomal recessive form of SEMD"
    explanation: Independent statement of autosomal recessive inheritance.
prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three families have been published as of this curation: the four affected
    individuals of the consanguineous Pakistani index family, one 8-year-old
    girl, and one Egyptian patient — six affected individuals in total, on the
    counts the abstracts give. This is a literature-case count, not a population
    prevalence estimate; no population rate has been published for this disorder
    and none is asserted here. The ULTRA_RARE band is a qualitative tier used
    with a CASES_IN_LITERATURE measure and carries no numeric estimate.
  evidence:

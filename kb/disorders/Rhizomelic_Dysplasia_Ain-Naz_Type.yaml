  downstream:
  - target: Disordered Endochondral Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth plate chondrocyte proliferation and differentiation drive
      longitudinal bone growth, so their impairment is the proposed route to the
      radiographic skeletal lesion. The steps between the cultured-cell result
      and the human radiographs are not established.
- name: Disordered Endochondral Ossification
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The skeletal lesion as it presents radiographically: severe shortening and
    deformation of the proximal long bones, platyspondyly, hip dysplasia,
    metaphyseal flaring and delayed epiphyseal ossification. The distribution
    is that of a spondyloepimetaphyseal dysplasia with rhizomelic predominance.
    The second report assigns the disorder to "rhizomelic SEMD" and defines that
    category as sparing the craniofacial skeleton. That definitional sparing is
    carried here as a category definition rather than as a per-patient
    observation, and it is qualified by the HPO annotation for OMIM:619598,
    which records frontal bossing, hypertelorism, ptosis, downslanted palpebral
    fissures and a wide nasal bridge each in one of six individuals, plus
    Wormian bones. See discussion rdan_craniofacial_tension.
  biological_processes:

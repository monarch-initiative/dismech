      sentence defines the rhizomelic-SEMD category rather than describing this
      patient; it supports the node through the report's own assignment of the
      disorder to that category.
  - reference: PMID:32591345
    reference_title: "Novel form of rhizomelic skeletal dysplasia associated with a homozygous variant in GNPNAT1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs of one individual showed hip dysplasia and severe platyspondyly."
    explanation: >-
      The radiographic findings in the index family that this tissue-level node

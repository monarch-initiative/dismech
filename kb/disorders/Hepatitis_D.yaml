treatments:
- name: Bulevirtide
  description: >-
    A first-in-class HBV-HDV entry inhibitor: a lipopeptide derived from the HBV
    pre-S1 domain that blocks NTCP and so prevents virions from entering
    hepatocytes. It received conditional EMA approval in July 2020 for
    compensated chronic hepatitis delta at 2 mg/day subcutaneously. Monotherapy
    for 24 or 48 weeks produced virological response in 50-83% and ALT
    normalisation in 45-78%, with synergistic effects when combined with
    pegylated interferon, and the results held in patients with advanced
    cirrhosis and clinically significant portal hypertension. Its
    characteristic on-target effect follows directly from what NTCP normally
    does: blocking a bile acid transporter raises serum bile acids, though
    asymptomatically.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Antiviral Therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: bulevirtide
      term:
        id: NCIT:C169819
        label: Bulevirtide
  target_mechanisms:
  - target: HBsAg-Dependent Hepatocyte Entry via NTCP
    treatment_effect: INHIBITS
    description: >-
      Bulevirtide occupies NTCP and blocks receptor-mediated entry of
      HBsAg-enveloped HDV virions into hepatocytes, cutting the life cycle at
      its first step.
    evidence:
    - reference: PMID:35942695
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Administration of BLV monotherapy for 24 or 48 weeks resulted in
        50%-83% virological response (HDV RNA ≥ 2 Log decline) rates and 45%-78%
        ALT normalization.
      explanation: >-
        Quantifies the virological and biochemical effect of blocking this node
        in treated patients. Evidence source is HUMAN_CLINICAL because these are
        Phase II and Phase III trial results.
  evidence:
  - reference: PMID:35942695
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, Bulevirtide (BLV), a first-in-class HBV-HDV entry inhibitor
      blocking Na+ -taurocholate co-transporting polypeptide (NTCP), has
      provided very promising efficacy data in Phase II and Phase III (interim
      analysis) trials as well as in preliminary real-life reports.
    explanation: >-
      Establishes the drug class, its molecular target, and the evidence level.
      Evidence source is HUMAN_CLINICAL because it summarises trial and
      real-world patient data.
  - reference: PMID:35942695
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BLV treatment was optimally tolerated, resulting only in an asymptomatic
      increase of bile acids.
    explanation: >-
      Marked PARTIAL because it records the on-target consequence of blocking a
      bile acid transporter - a mechanistically predictable effect rather than an
      unrelated adverse event. Evidence source is HUMAN_CLINICAL.
- name: Pegylated Interferon Alpha
  description: >-
    For three decades the only treatment option for chronic hepatitis delta,
    given off-label for 48 weeks. Its limitations are what motivated the
    development of the entry and prenylation inhibitors: virological response
    was only 20-30%, side effects were substantial, and advanced liver disease -
    exactly the population most in need - is effectively a contraindication.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Antiviral Therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: recombinant interferon alfa
      term:
        id: NCIT:C225
        label: Recombinant Interferon Alfa
  target_mechanisms:
  - target: Host-Polymerase-Mediated HDV Replication
    treatment_effect: INHIBITS
    description: >-
      Interferon-alpha acts through a host-directed antiviral state rather than
      on any virus-encoded enzyme, which is the only route available against a
      virus replicated by host RNA polymerases.
    evidence:
    - reference: PMID:35942695
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        antiviral treatment, however, resulted in suboptimal (20-30%)
        virological response
      explanation: >-
        Marked PARTIAL because it quantifies how weakly interferon suppresses
        this node - a 20-30% virological response is the reason entry and
        assembly inhibitors were developed. Evidence source is HUMAN_CLINICAL
        because these are response rates in treated patients.
  evidence:
  - reference: PMID:35942695
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In the last 30 years, the only treatment option for CHD has been
      represented by the off-label administration of Interferon (or Pegylated
      Interferon)-alpha: antiviral treatment, however, resulted in suboptimal
      (20-30%) virological response and was burdened by several side effects, de
      facto contraindicating Interferon (IFN) administration in patients with
      more advanced liver disease.
    explanation: >-
      Marked PARTIAL because it establishes interferon as the historical
      standard while bounding its efficacy and excluding the advanced-disease
      population. Evidence source is OTHER because this is a review.
- name: Lonafarnib
  description: >-
    A prenylation (farnesyltransferase) inhibitor that blocks farnesylation of
    the large delta antigen, the rate-limiting step for anchoring the HDV
    ribonucleoprotein to HBsAg and hence for virion assembly and secretion. It
    attacks the assembly bottleneck rather than entry or replication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antiviral Therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: lonafarnib
      term:
        id: CHEBI:47097
        label: lonafarnib
  target_mechanisms:
  - target: L-HDAg Farnesylation and HBsAg-Dependent Virion Assembly
    treatment_effect: INHIBITS
    description: >-
      Inhibiting farnesyltransferase prevents prenylation of L-HDAg, so the
      ribonucleoprotein cannot be anchored to HBsAg and infectious virions
      cannot be assembled or secreted.
    evidence:
    - reference: PMID:32077603
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Farnesylation of the L-HDAg is the limiting step for anchoring this RNP
        to HBsAg, and thus for assembling, secreting and propagating virion
        particles.
      explanation: >-
        States the step lonafarnib blocks and why blocking it stops virion
        propagation. Evidence source is OTHER because this is a review of the
        HDV life cycle and drug development.
  evidence:
  - reference: PMID:32077603
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      we will present the new insights in the HDV life cycle that have led to
      the development of novel classes of drugs and discuss antiviral approaches
      in phase II and III of development: bulevirtide (entry inhibitor),
      lonafarnib, (prenylation inhibitor) and REP 2139 (HBsAg release inhibitor)
    explanation: >-
      Marked PARTIAL because at the time of this review lonafarnib was in phase
      II/III development rather than approved; conforming curation should not
      present it as established therapy. Evidence source is OTHER because this
      is a review.
- name: Hepatitis B Vaccination
  description: >-
    Because HDV cannot infect a hepatocyte or assemble a virion without
    HBV-supplied HBsAg, preventing hepatitis B prevents hepatitis D outright.
    HBV vaccination is therefore fully protective against HDV in anyone not
    already infected with HBV, and is the mainstay of HDV prevention. Its one
    limitation defines the residual burden: it does nothing for the established
    chronic HBV carrier, who remains at lifelong risk of superinfection - the
    route that actually produces chronic hepatitis delta.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Acquisition Route - Coinfection versus Superinfection
    treatment_effect: INHIBITS
    description: >-
      Preventing HBV infection removes the HBsAg on which HDV depends,
      foreclosing both acquisition routes in the previously uninfected and
      thereby preventing the entire downstream chain.
    evidence:
    - reference: PMID:37338616
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mainstay of HDV prevention is HBV vaccination alongside harm
        reduction, including safe sexual practices.
      explanation: >-
        States that HBV vaccination is the principal preventive intervention
        against HDV, which is what this mechanism link asserts. Evidence source
        is OTHER because this is an expert panel guideline.
  evidence:
  - reference: PMID:26464754
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      As a consequence, every HBV carrier is potentially at risk for HDV
      superinfection.
    explanation: >-
      Marked PARTIAL because it bounds the protection: vaccination cannot help
      the established HBV carrier, who remains at risk of the superinfection
      route. Evidence source is OTHER because this is a review.

discussions:
- discussion_id: hdv_hbsag_clearance_goal
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is HBsAg clearance achievable as the treatment goal in chronic hepatitis
    delta, and does sustained HDV RNA negativity translate into improved
    long-term liver outcomes?
  attaches_to:
  - "pathophysiology#L-HDAg Farnesylation and HBsAg-Dependent Virion Assembly"
  rationale: >-
    Because HDV cannot assemble virions without HBsAg, clearing HBsAg would cure
    hepatitis delta outright, and the review literature identifies it as the
    ideal goal while conceding that the reasonably achievable goal is a sustained
    HDV virological response instead. The endpoints on which bulevirtide was
    approved are virological and biochemical - HDV RNA decline and ALT
    normalisation - not cirrhosis, decompensation, or hepatocellular carcinoma.
    Whether suppressing this node changes the trajectory of the downstream
    progression node is therefore not established, and curators should not
    curate the entry inhibitors as preventing cirrhosis or liver cancer.
  proposed_experiments:
  - experiment_id: hdv_hard_outcome_followup
    name: Long-term hard-outcome follow-up of entry-inhibitor-treated patients
    description: >-
      Extended follow-up of bulevirtide-treated cohorts reporting incident
      decompensation, hepatocellular carcinoma, and transplant-free survival
      against untreated or interferon-treated comparators would establish
      whether virological response on this pathway translates into changed
      liver outcomes.

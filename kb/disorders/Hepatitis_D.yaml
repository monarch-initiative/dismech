name: Hepatitis D
creation_date: "2026-08-22T00:00:00Z"
category: Infectious Disease
description: >-
  Infection with hepatitis delta virus (HDV), a defective circular RNA virus
  that cannot complete its life cycle without the hepatitis B virus surface
  antigen (HBsAg) and therefore occurs only in people who are also infected with
  HBV. HDV borrows HBsAg to coat its ribonucleoprotein and uses the HBV
  receptor, the sodium taurocholate co-transporting polypeptide (NTCP), to enter
  hepatocytes; once inside, its genome is replicated by host RNA polymerases
  rather than by any virus-encoded enzyme, which is why no HDV polymerase
  inhibitor exists. Chronic hepatitis delta affects an estimated 10-20 million
  people and is the most severe form of chronic viral hepatitis, with high rates
  of progression to cirrhosis, end-stage liver disease, and hepatocellular
  carcinoma. Its therapeutic dependence on HBV is total: every approved or
  investigational agent targets an HBV-supplied step - viral entry through NTCP
  (bulevirtide), farnesylation of the large delta antigen needed to anchor the
  ribonucleoprotein to HBsAg (lonafarnib), or HBsAg release itself - rather than
  HDV replication.
disease_term:
  preferred_term: hepatitis D virus infection
  term:
    id: MONDO:0005789
    label: hepatitis D virus infection
parents:
- Liver Disease
- Viral Hepatitis
has_subtypes:
- name: Coinfection
  display_name: HBV-HDV coinfection (simultaneous acquisition)
  description: >-
    Simultaneous acquisition of hepatitis B and hepatitis D. The delta agent has
    to establish itself at the same time as its helper virus, and the outcome
    follows that of the acute HBV infection: more than 95% of coinfected
    patients clear both viruses within six months, so chronic hepatitis delta is
    an uncommon result. The acute illness can nonetheless be severe, and
    fulminant hepatitis is more common than in HBV monoinfection. This is NOT
    the route that produces the accelerated cirrhotic course modelled at the
    entry's progression node.
- name: Superinfection
  display_name: HDV superinfection of established chronic HBV
  description: >-
    Acquisition of hepatitis D by someone already chronically infected with
    hepatitis B. Because HBsAg is already abundant, the delta agent has an
    established helper from the outset, and more than 80% of these patients
    develop chronic HDV infection. This is the route responsible for the
    accelerated course: among patients with chronic HDV superinfection,
    cirrhosis and liver failure occur in 70-80% within 5-10 years. Every chronic
    HBV carrier is at risk, which is why the accelerated progression this entry
    models should be attributed to superinfection rather than to HDV generically.
infectious_agent:
- name: Hepatitis delta virus (HDV)
  description: >-
    A defective, satellite RNA virus with a circular single-stranded genome
    encoding a single protein, the hepatitis delta antigen, in a small (S-HDAg)
    and a large (L-HDAg) form. It carries no polymerase and no envelope protein
    of its own: replication is performed by host RNA polymerases and the virion
    envelope is HBsAg borrowed from a coinfecting hepatitis B virus.
  infectious_agent_term:
    preferred_term: Hepatitis delta virus
    term:
      id: NCBITaxon:12475
      label: Hepatitis delta virus
  evidence:
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hepatitis delta virus (HDV) is a defective RNA virus requiring the
      presence of the hepatitis B virus surface antigen (HBsAg) to complete its
      life cycle.
    explanation: >-
      States the defining property of the agent - obligate dependence on HBsAg -
      which is what makes hepatitis D a coinfection rather than an independent
      disease. Evidence source is OTHER because this is a review.
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The HDV genome is a circular single-stranded RNA which encodes for a
      single hepatitis delta antigen (HDAg) that exists in two forms (S-HDAg and
      L-HDAg), and its replication is mediated by the host RNA polymerases.
    explanation: >-
      Describes the genome, its single protein product in two forms, and the
      host-polymerase-dependent replication that removes any viral polymerase as
      a drug target. Evidence source is OTHER because this is a review.
pathophysiology:
- name: Acquisition Route - Coinfection versus Superinfection
  description: >-
    HDV is transmitted by the same routes as HBV, and because it cannot
    propagate without HBsAg it can be acquired in only two ways. In coinfection
    the two viruses are transmitted simultaneously, so the delta agent's
    persistence depends on whether the acute HBV infection resolves - and it
    usually does, with more than 95% of coinfected patients clearing both
    viruses within six months. In superinfection HDV is acquired by someone
    already chronically infected with HBV, so an abundant helper is present from
    the outset and more than 80% develop chronic HDV infection. The two routes
    therefore have opposite natural histories, and it is superinfection, not HDV
    as such, that feeds the accelerated cirrhotic course modelled downstream.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:26464754
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it can be acquired either by co-infection (simultaneous transmission of
      the two viruses) or super-infection (acquisition of HDV by an already
      chronic carrier of HBV)
    explanation: >-
      Defines the two acquisition routes that this node distinguishes. Evidence
      source is OTHER because this is a review.
  - reference: PMID:37338616
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 95% of patients co-infected with HBV and HDV completely clear
      both viruses within six months
    explanation: >-
      Quantifies the coinfection outcome, establishing that this route usually
      does not chronify. Evidence source is OTHER because this is an expert
      panel guideline synthesising the literature.
  - reference: PMID:37338616
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In contrast to acute HBV/HDV co-infection that rapidly resolves, more than
      80% of patients who acquire acute HDV superinfection will develop chronic
      HDV infection.
    explanation: >-
      Quantifies the superinfection outcome and states the contrast with
      coinfection directly - the discriminating claim of this node. Evidence
      source is OTHER because this is an expert panel guideline.
  - reference: PMID:26464754
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As a consequence, every HBV carrier is potentially at risk for HDV
      superinfection.
    explanation: >-
      Establishes the at-risk population for the superinfection route, which is
      what makes HBV vaccination the decisive preventive measure. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: HBsAg-Dependent Hepatocyte Entry via NTCP
    causal_link_type: DIRECT
    description: >-
      Either route delivers HDV virions, enveloped in HBV-supplied HBsAg, to the
      hepatocyte surface.

- name: HBsAg-Dependent Hepatocyte Entry via NTCP
  description: >-
    HDV virions are ribonucleoprotein cores wrapped in HBsAg supplied by a
    coinfecting hepatitis B virus. Because the envelope is HBV's, the receptor
    is HBV's too: HDV enters hepatocytes through the sodium taurocholate
    co-transporting polypeptide (NTCP), the hepatocyte bile acid uptake
    transporter that doubles as the HBV/HDV receptor. This shared entry step is
    the reason a single receptor blocker treats both viruses, and it is the
    conformance point to the entry-inhibitor drug mechanism.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "viral_entry_fusion_inhibition#Viral Attachment to the Host-Cell Receptor"
  genes:
  - preferred_term: SLC10A1
    term:
      id: hgnc:10905
      label: SLC10A1
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HDV infects hepatocytes using the hepatitis B virus (HBV) receptor, the
      sodium taurocholate cotransporting polypeptide (NTCP).
    explanation: >-
      States the receptor and the borrowed-entry mechanism this node describes.
      Evidence source is OTHER because this is a review.
  - reference: PMID:39494152
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NTCP has been identified as the receptor that HBV and its satellite virus,
      hepatitis delta virus (HDV), use to enter hepatocytes.
    explanation: >-
      Independently confirms NTCP as the shared entry receptor and frames HDV as
      a satellite of HBV. Evidence source is OTHER because this is a review.
  downstream:
  - target: Host-Polymerase-Mediated HDV Replication
    causal_link_type: DIRECT
    description: >-
      Once delivered into the hepatocyte the HDV ribonucleoprotein is replicated
      by host enzymes.

- name: Host-Polymerase-Mediated HDV Replication
  description: >-
    The HDV genome is replicated by host RNA polymerases; the virus encodes no
    polymerase of its own. This has a direct therapeutic consequence that
    separates hepatitis D from hepatitis B and C: there is no viral replication
    enzyme to inhibit, so the nucleos(t)ide analogues that suppress HBV and the
    direct-acting antivirals that cure HCV are useless against HDV. Every drug
    developed for hepatitis D therefore targets an HBV-supplied step of the
    cycle instead.
  role: central_effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      its replication is mediated by the host RNA polymerases
    explanation: >-
      States that replication is host-enzyme-dependent, the fact underlying the
      absence of any HDV polymerase inhibitor. Evidence source is OTHER because
      this is a review.
  downstream:
  - target: L-HDAg Farnesylation and HBsAg-Dependent Virion Assembly
    causal_link_type: DIRECT
    description: >-
      Replicated genomes are packaged with delta antigen into ribonucleoproteins
      that must then be enveloped in HBsAg to be exported.

- name: L-HDAg Farnesylation and HBsAg-Dependent Virion Assembly
  description: >-
    HDV ribonucleoproteins consist of the RNA genome packaged with small and
    large delta antigen. Farnesylation of the large delta antigen is the
    rate-limiting step for anchoring the ribonucleoprotein to HBsAg, and so for
    assembling, secreting, and propagating virions. This is the second
    HBV-dependent bottleneck in the life cycle and the target of the prenylation
    inhibitor lonafarnib.
  role: effector
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Farnesylation of the L-HDAg is the limiting step for anchoring this RNP to
      HBsAg, and thus for assembling, secreting and propagating virion
      particles.
    explanation: >-
      Identifies the rate-limiting assembly step and its dependence on HBsAg,
      which is the rationale for prenylation inhibition. Evidence source is
      OTHER because this is a review.
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The HBsAg-coated HDV virions contain a ribonucleoprotein (RNP) formed by
      the RNA genome packaged with small and large HDAg.
    explanation: >-
      Describes the virion composition this node produces. Evidence source is
      OTHER because this is a review.
  downstream:
  - target: Accelerated Progression to Cirrhosis and Hepatocellular Carcinoma
    causal_link_type: DIRECT
    description: >-
      Sustained HDV propagation drives the aggressive necroinflammatory course
      that distinguishes hepatitis delta from HBV monoinfection.

- name: Accelerated Progression to Cirrhosis and Hepatocellular Carcinoma
  description: >-
    Chronic hepatitis delta is the most severe form of chronic viral hepatitis,
    with high rates of progression to cirrhosis and its complications - end-stage
    liver disease and hepatocellular carcinoma. This accelerated course, on top
    of an HBV infection that would itself progress more slowly, is what makes
    HDV coinfection clinically decisive. The fibrotic and portal-hypertensive
    endpoints are those of the corresponding mechanism modules rather than
    HDV-specific processes. This node is reached predominantly by the
    SUPERINFECTION route: among patients with chronic HDV superinfection,
    cirrhosis and liver failure occur in 70-80% within 5-10 years. Simultaneous
    coinfection usually resolves and does not reach this node, so a conforming
    or citing entry should not attribute the accelerated course to HDV
    generically.
  role: consequence
  biological_scale: ORGANISM
  subtypes:
  - Superinfection
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:35942695
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chronic hepatitis delta (CHD) affects approximately 10-20 million people
      worldwide and represents the most severe form of chronic viral hepatitis,
      as it is characterized by high rates of progression to cirrhosis and its
      complications (end-stage liver disease, hepatocellular carcinoma).
    explanation: >-
      States the burden and the accelerated progression that define this
      consequence node. Evidence source is OTHER because this is a review.
  - reference: PMID:32077603
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is an important risk of morbidity and mortality caused by end-stage
      liver disease and hepatocellular carcinoma with HDV
    explanation: >-
      Independently confirms the outcomes recorded at this node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:37338616
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of patients with chronic HDV superinfection, cirrhosis, and liver failure
      occur in 70%-80% within 5-10 years and in 15% within 1-2 years,
      respectively
    explanation: >-
      Quantifies the accelerated course and attributes it specifically to the
      superinfection route, which is why this node is scoped to that subtype.
      Evidence source is OTHER because this is an expert panel guideline.
  - reference: PMID:37338616
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HDV superinfection exacerbates and accelerates the progression of chronic
      HBV infection
    explanation: >-
      States the acceleration relative to HBV monoinfection that makes this node
      the clinically decisive feature of hepatitis delta. Evidence source is
      OTHER because this is an expert panel guideline.

pathophysiology:
  - name: Loss of Ethanolamine Phosphotransferase Activity
    biological_scale: MOLECULAR
    description: >-
      Biallelic SELENOI variants reduce the activity of ethanolamine
      phosphotransferase 1, the enzyme catalysing the final step of the
      CDP-ethanolamine branch of the Kennedy pathway.
    genes:
      - preferred_term: SELENOI
        term:
          id: hgnc:29361
          label: SELENOI
    molecular_functions:
      - preferred_term: ethanolamine phosphotransferase activity
        term:
          id: GO:0004307
          label: ethanolaminephosphotransferase activity
        modifier: DECREASED
    downstream:
      - target: Depletion of Ethanolamine Phospholipids and Plasmenyl-PE
    evidence:
      - reference: PMID:28052917
        reference_title: >-
          A mutation of EPT1 (SELENOI) underlies a new disorder of Kennedy
          pathway phospholipid biosynthesis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          dramatically reduces the enzymatic activity of EPT1, thereby hindering
          the final step in phosphatidylethanolamine synthesis
        explanation: >-
          States the enzymatic consequence of the founding family's variant and
          places it at the terminal step of the pathway.
  - name: Depletion of Ethanolamine Phospholipids and Plasmenyl-PE
    biological_scale: CELLULAR
    description: >-
      Reduced EPT1 activity lowers synthesis of phosphatidylethanolamine and,
      importantly, of its ether-linked plasmenyl form. Plasmenyl-PE is not
      merely a structural lipid: its vinyl-ether bond reacts preferentially with
      oxidants, so the species that is lost is also the one that protects the
      membrane.
    cell_types:
      - preferred_term: oligodendrocyte
        term:
          id: CL:0000128
          label: oligodendrocyte
    biological_processes:
      - preferred_term: phosphatidylethanolamine biosynthetic process
        term:
          id: GO:0006646
          label: phosphatidylethanolamine biosynthetic process
        modifier: DECREASED
    downstream:
      - target: Lipid Peroxidation and Failed Oligodendrocyte Maturation
    evidence:
      - reference: PMID:38582453
        reference_title: >-
          Selenoprotein I is indispensable for ether lipid homeostasis and
          proper myelination.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          characterized by a vinyl ether bond that preferentially reacts with
          oxidants, thus serves as a sacrificial antioxidant
        explanation: >-
          Supplies the property that makes this depletion damaging rather than
          merely quantitative - the lost lipid is the antioxidant one.
  - name: Lipid Peroxidation and Failed Oligodendrocyte Maturation
    biological_scale: CELLULAR
    description: >-
      In the nervous-system-restricted mouse model, loss of the sacrificial
      antioxidant is followed by increased lipid peroxidation specifically in
      oligodendrocyte-lineage cells, and those cells fail to mature. This node
      is graded MODEL_ORGANISM throughout: the causal chain from peroxidation to
      arrested maturation has been shown in mouse and in vitro, not in human
      tissue.
    cell_types:
      - preferred_term: oligodendrocyte precursor cell
        term:
          id: CL:0002453
          label: oligodendrocyte precursor cell
    downstream:
      - target: Central Hypomyelination
    evidence:
      - reference: PMID:38582453
        reference_title: >-
          Selenoprotein I is indispensable for ether lipid homeostasis and
          proper myelination.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          increased lipid peroxidation in oligodendrocyte lineage cells and
          disrupted oligodendrocyte maturation both in vivo and in vitro
        explanation: >-
          Names both halves of this node and states the model systems, which is
          why the node is graded as model evidence rather than human.
  - name: Central Hypomyelination
    biological_scale: TISSUE
    description: >-
      Oligodendrocytes that do not mature do not myelinate. Hypomyelination is
      the imaging finding in affected patients and the neuropathological finding
      in the mouse, and it is followed by atrophy rather than accompanied by it.
    biological_processes:
      - preferred_term: myelination
        term:
          id: GO:0042552
          label: myelination
        modifier: DECREASED
    locations:
      - preferred_term: spinal cord
        term:
          id: UBERON:0002240
          label: spinal cord
    downstream:
      - target: Progressive Corticospinal Tract Dysfunction
      - target: Extramotor Neurodevelopmental Involvement
      - target: phenotypes#Cerebral Hypomyelination
      - target: phenotypes#Cerebellar Atrophy
    evidence:
      - reference: PMID:29500230
        reference_title: >-
          EPT1 (selenoprotein I) is critical for the neural development and
          maintenance of plasmalogen in humans.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Neuroimaging revealed hypomyelination, followed by brain atrophy
          mainly in the cerebellum and brainstem
        explanation: >-
          Human imaging evidence for hypomyelination, and for its temporal
          relation to the atrophy that follows it.
      - reference: PMID:38582453
        reference_title: >-
          Selenoprotein I is indispensable for ether lipid homeostasis and
          proper myelination.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          a critical role for SELENOI-derived plasmenyl-PE in myelination that
          is of paramount importance for neurodevelopment
        explanation: >-
          States the pathway-to-myelin dependency this node rests on.
  - name: Extramotor Neurodevelopmental Involvement
    biological_scale: ORGANISM
    description: >-
      The features outside the motor system - impaired intellectual development,
      speech delay, seizures, microcephaly, sensorineural deafness and visual
      loss - reported mainly at the severe end of the spectrum.

      This node is deliberately weaker than the motor arm above, and the reason
      is stated rather than hidden by the arrow: these features co-occur with
      the myelin lesion in the reported patients, but no source establishes that
      each follows from it. Sensorineural deafness in particular is a cochlear
      or eighth-nerve phenotype whose relation to central hypomyelination is not
      demonstrated in this disease. The edges below therefore assert
      co-occurrence within a single CNS disorder, not a worked-out causal path,
      and the HUMAN_MODEL_MISMATCH-style gap that would be needed to resolve it
      is recorded in the discussions section.
    downstream:
      - target: phenotypes#Intellectual Disability
      - target: phenotypes#Delayed Speech and Language Development
      - target: phenotypes#Seizure
      - target: phenotypes#Microcephaly
      - target: phenotypes#Sensorineural Hearing Impairment
      - target: phenotypes#Cerebral Visual Impairment
    evidence:
      - reference: PMID:36942482
        reference_title: >-
          A novel homozygous synonymous splicing variant in SELENOI gene causes
          spastic paraplegia 81.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          sensorineural deafness, blindness, cleft palate, delayed motor
          development, regression of motor skills, impaired intellectual
          development, poor speech and language acquisition, spasticity,
          hyperreflexia, white matter abnormalities and cerebral and cerebellar
          atrophy
        explanation: >-
          Establishes that these features occur together in the reported
          spectrum, which is what this node claims - and, read carefully, is all
          it claims.
  - name: Progressive Corticospinal Tract Dysfunction
    biological_scale: ORGANISM
    description: >-
      The clinical syndrome: infancy-onset delayed motor development followed by
      regression, with progressive lower-limb spasticity and hyperreflexia. The
      node is separated from the tissue-level hypomyelination above because the
      regression is a course, not a lesion.
    downstream:
      - target: phenotypes#Spastic Paraplegia
      - target: phenotypes#Lower Limb Spasticity
      - target: phenotypes#Hyperreflexia
      - target: phenotypes#Developmental Regression
      - target: phenotypes#Motor Delay
    evidence:
      - reference: PMID:36942482
        reference_title: >-
          A novel homozygous synonymous splicing variant in SELENOI gene causes
          spastic paraplegia 81.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          sensorineural deafness, blindness, cleft palate, delayed motor
          development, regression of motor skills, impaired intellectual
          development, poor speech and language acquisition, spasticity,
          hyperreflexia, white matter abnormalities and cerebral and cerebellar
          atrophy
        explanation: >-
          The combined phenotypic spectrum across reported families, which is
          the source for the motor features on this node and for several
          phenotypes below.

genetic:
  - name: SELENOI
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    gene_term:
      preferred_term: SELENOI
      term:
        id: hgnc:29361
        label: SELENOI
    notes: >-
      Disease alleles reported to date are private to each consanguineous
      family and act by disrupting splicing or otherwise reducing enzyme
      activity. One is a synonymous change that would be dismissed on protein
      consequence alone: it disrupts splicing and removes exon 2. That is the
      clinically material point in this section - a synonymous variant in
      SELENOI is not automatically benign.

      Constitutive knockout is embryonic lethal in mouse, which implies that
      surviving human genotypes retain partial activity. The entry does not
      claim a genotype-phenotype correlation, because with three families there
      is no basis for one.
    inheritance:
      - name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:36942482
        reference_title: >-
          A novel homozygous synonymous splicing variant in SELENOI gene causes
          spastic paraplegia 81.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          homozygous, synonymous variant in the SELENOI gene
        explanation: >-
          Establishes the allele class that motivates the note above.
      - reference: PMID:36942482
        reference_title: >-
          A novel homozygous synonymous splicing variant in SELENOI gene causes
          spastic paraplegia 81.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          disrupt normal splicing and lead to skipping of exon 2
        explanation: >-
          Gives the mechanism by which a synonymous change is pathogenic, which
          is the reason it cannot be filtered out on protein consequence.
biochemical:
  - name: Fibroblast ethanolamine phosphotransferase activity
    notes: >-
      The cellular enzyme assay is the informative biochemical readout, and the
      reason is worth recording: blood phosphatidylethanolamine is not, because
      alternate pathways compensate for EPT1 inactivity there.
    evidence:
      - reference: PMID:28052917
        reference_title: >-
          A mutation of EPT1 (SELENOI) underlies a new disorder of Kennedy
          pathway phospholipid biosynthesis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          in blood EPT1 inactivity may be compensated for, in part, via
          alternate biochemical pathways
        explanation: >-
          States why blood PE is a poor diagnostic biomarker despite a genuine
          enzymatic defect - the compensation is the finding, and it is what
          sends the assay to fibroblasts.
      - reference: PMID:28052917
        reference_title: >-
          A mutation of EPT1 (SELENOI) underlies a new disorder of Kennedy
          pathway phospholipid biosynthesis.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          alteration to levels of specific phosphatidylethanolamine fatty acyl
          species in patients
        explanation: >-
          Graded PARTIAL: it establishes that species-level changes are
          detectable in patients, but the sentence above qualifies how far a
          blood measurement can be trusted.
discussions:
  - discussion_id: spg81_extramotor_mechanism
    kind: KNOWLEDGE_GAP
    prompt: >-
      Do the extramotor features of SPG81 - deafness, visual loss, seizures and
      microcephaly - follow from the same plasmenyl-PE-dependent myelination
      defect that produces the spastic paraplegia, or from a separate
      consequence of ethanolamine-phospholipid depletion in non-myelinating cell
      types?
    attaches_to:
      - pathophysiology#Extramotor Neurodevelopmental Involvement
    rationale: >-
      The mouse model is nervous-system-restricted and was assessed for motor
      deficits, hypomyelination, gliosis and microcephaly. It is not reported to
      have been assessed for auditory or visual function, so the model that
      grounds the motor arm is silent on the arm that carries most of the
      severe-end morbidity. Meanwhile SELENOI has documented roles outside the
      nervous system entirely, which makes a myelin-only explanation for every
      feature an assumption rather than a finding.

      This matters for more than completeness: if the extramotor features are a
      separate consequence, a therapy that rescued myelination would not be
      expected to address them, and a trial powered on motor endpoints would
      miss that.

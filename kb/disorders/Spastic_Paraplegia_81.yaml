name: Spastic Paraplegia 81
creation_date: "2026-08-28T17:20:00Z"
category: Mendelian
description: >-
  Spastic paraplegia 81 is an autosomal recessive complicated hereditary spastic
  paraplegia caused by biallelic loss-of-function variants in SELENOI, which
  encodes ethanolamine phosphotransferase 1 (EPT1). SELENOI catalyses the final
  step of the CDP-ethanolamine branch of the Kennedy pathway, condensing
  CDP-ethanolamine with a diacylglycerol or alkyl-acylglycerol to make
  phosphatidylethanolamine and its ether-linked form, plasmenyl-PE. The disease
  is therefore a disorder of ether-lipid homeostasis rather than of a
  motor-neuron-specific protein, and its central lesion is in myelin: the
  ether-linked plasmenyl-PE species that SELENOI makes are required for normal
  myelination and also act as sacrificial antioxidants, so their loss produces
  hypomyelination together with lipid peroxidation in the oligodendrocyte
  lineage. Onset is in infancy, with delayed motor development, subsequent
  regression, progressive lower-limb spasticity and impaired intellectual
  development; the severe end of the reported spectrum adds sensorineural
  deafness, visual loss, seizures, microcephaly and orofacial clefting.
parents:
  - Hereditary Spastic Paraplegia
  - Inborn Error of Metabolism
synonyms:
  - SPG81
  - spastic paraplegia 81, autosomal recessive
  - autosomal recessive spastic paraplegia type 81
  - SELENOI-related hereditary spastic paraplegia
disease_term:
  preferred_term: spastic paraplegia 81, autosomal recessive
  term:
    id: MONDO:0032905
    label: spastic paraplegia 81, autosomal recessive
notes: >-
  Evidence-base caveat, stated up front because it governs the whole entry.
  Roughly three consanguineous families have been reported since 2017, plus a
  fourth carrying a homozygous missense variant of uncertain significance. There
  is no cohort and no natural-history series, so no phenotype in this entry
  carries a frequency value. The problem is the absence of a denominator, not
  the number of families, and a frequency band inferred from "reported in most
  published patients" would be a number no source states.

  Gene identifier correction. The deep-research report committed alongside this
  entry gives the causal gene as HGNC:30396. That identifier is SELENOS, a
  different selenoprotein. SELENOI is hgnc:29361, which is what this entry uses.
  The error is recorded here rather than silently fixed because it is not
  detectable by existence checking - HGNC:30396 resolves to a real gene, so the
  report's own term-validation block passed it - and the next curator reading
  that report will meet the same wrong identifier.

  Scope. Several other hereditary spastic paraplegia entries exist in this
  knowledge base. SPG81 is curated as its own Disease rather than a subtype
  because the lesion is a distinct enzymatic step in a distinct pathway
  (ether-lipid synthesis) rather than a further allele of a shared axonal-
  transport or mitochondrial mechanism, and because the phenotype is complicated
  rather than pure.

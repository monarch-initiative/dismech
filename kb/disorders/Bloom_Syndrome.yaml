- discussion_id: bloom_g4_regulatory_hypothesis
  prompt: >-
    Do unresolved G-quadruplexes and altered chromatin accessibility materially
    contribute to human Bloom syndrome manifestations beyond the established
    hyper-recombination pathway?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic BLM Loss of Function
  rationale: >-
    A 2026 preprint reports correlated G4, accessibility, and expression
    changes in cell lines, plus partial phenocopy after G4 stabilization. It is
    promising but not yet sufficient for promotion into the core clinical
    mechanism graph.
  evidence:
  - reference: PMID:41867784
    reference_title: "G-quadruplexes regulate chromatin accessibility and gene expression in Bloom Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "G4 stabilization partially recapitulated BS-associated molecular phenotypes."
    explanation: This perturbation result motivates the hypothesis while remaining preclinical and preprint evidence.
- discussion_id: bloom_heterozygote_cancer_risk
  prompt: >-
    Does heterozygous BLM carrier status materially increase cancer risk in
    defined populations or exposure contexts?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#BLM
  rationale: >-
    Bloom syndrome itself requires biallelic pathogenic variants. Carrier-risk
    claims should not be imported into the disease mechanism without
    population-specific evidence and replication.
  evidence:
  - reference: PMID:20301572
    reference_title: "Bloom Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Heterozygotes (carriers) are not at risk of developing BSyn; the cancer risk of heterozygotes as a group remains unclear."
    explanation: Current GeneReviews preserves the uncertainty while separating carriers from affected people.

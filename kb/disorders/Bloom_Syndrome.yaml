review_notes: >-
  Comprehensive re-review completed 2026-07-23. Scope is restricted to
  biallelic BLM-related Bloom syndrome; heterozygous carrier cancer-risk claims
  are not treated as disease manifestations. Sister-chromatid exchange is
  modeled as a characteristic adjunctive cytogenetic finding, not a
  pathognomonic standalone diagnostic test, because RMI1-, RMI2-, and
  TOP3A-related disorders can also elevate SCEs. The cancer mechanism is wired
  through BTRR dissolution failure, hyper-recombination, loss of heterozygosity,
  and somatic instability; growth, immune, dermatologic, metabolic,
  reproductive, pulmonary, and thyroid findings are deliberately connected
  through an unknown-intermediates node because GeneReviews states that these
  noncancer mechanisms remain unexplained. The D2P audit surfaced many
  source-candidate phenotypes, but only major features with exact
  disease-specific evidence were added. Registry percentages are kept within
  their ascertainment and age boundaries. Cancer surveillance recommendations
  are expert consensus informed by registry experience rather than proven
  component-specific outcome effects. NCT00021437 is a completed historical
  observational registry/laboratory protocol, not a therapeutic trial; unrelated
  BLOOM-acronym studies were excluded. GSE283485 and the associated 2026
  preprint are represented as an emerging G-quadruplex regulatory hypothesis,
  not as settled clinical mechanism. The earlier Asta research output was noisy,
  so final curation relied on direct review of primary PubMed records,
  GeneReviews, ClinGen, ClinicalTrials.gov, and the public dataset record.

discussions:
- discussion_id: bloom_nonmalignant_mechanism_gap
  prompt: >-
    Which molecular consequences of BLM loss cause growth restriction,
    photosensitivity, immune abnormalities, insulin resistance, infertility,
    bronchiectasis, and hypothyroidism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unresolved Nonmalignant Multisystem Consequences
  rationale: >-
    The chromosome-instability-to-cancer branch is experimentally supported,
    but assigning that same route to every nonmalignant phenotype would exceed
    current evidence.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the proportional small size – the constant feature of BSyn – remains unexplained, as do the medical complications of BSyn other than cancer."
    explanation: GeneReviews explicitly states the central mechanistic gap.
- discussion_id: bloom_surveillance_outcome_gap

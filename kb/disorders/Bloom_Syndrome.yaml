    supports: SUPPORT
    evidence_source: OTHER
    snippet: "each sib of an affected individual has at conception a 25% chance of inheriting biallelic pathogenic variants and being affected"
    explanation: GeneReviews supplies the recurrence risk when both parents are carriers.
epidemiology:
- name: Globally rare disorder with an Ashkenazi Jewish founder allele
  description: >-
    Bloom syndrome is rare in all populations. The common blmAsh founder allele
    occurs in about one in 100 people of Eastern European Jewish ancestry, but
    carrier frequency is not disease prevalence.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although rare in all populations"
    explanation: GeneReviews establishes rarity without implying a quantitative global prevalence estimate.
  - reference: PMID:28232778
    reference_title: "Bloom's Syndrome: Clinical Spectrum, Molecular Pathogenesis, and Cancer Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A common founder mutation designated blmAsh is present in about 1 in 100 persons of Eastern European Jewish ancestry, and there are additional recurrent founder mutations among other populations."
    explanation: The Bloom syndrome review supplies the ancestry-specific carrier frequency and founder-allele context.
progression:
- phase: Prenatal and persistent growth deficiency
  age_range: Prenatal onset through adulthood
  notes: >-
    Reduced fetal growth affects weight, length, and head circumference and
    persists through childhood and adult life.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most consistent clinical feature of BSyn seen throughout all stages of life is growth deficiency affecting height, weight, and head circumference."
    explanation: GeneReviews describes the lifelong growth trajectory.
- phase: Sun-triggered cutaneous disease
  age_range: Usually first or second year of life onward
  notes: >-
    Skin is generally normal at birth; a facial erythematous, telangiectatic,
    sun-sensitive eruption commonly appears after early-childhood sun exposure.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typically following sun exposure during the first or second year of life, a red, sun-sensitive rash appears on the nose and cheeks"
    explanation: GeneReviews defines the usual timing and distribution of the rash.
- phase: Early and multiple malignancies
  age_range: Across the lifespan, with high cumulative incidence by age 40
  notes: >-
    Many cancer types occur at unusually early ages, and multiple primary
    malignancies are common.
  evidence:
  - reference: PMID:20301572
    reference_title: "Bloom Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bloom syndrome (BSyn) is characterized by severe pre- and postnatal growth deficiency, immune abnormalities, sensitivity to sunlight, insulin resistance, and a high risk for many cancers that occur at an early age."
    explanation: GeneReviews supports the unusually early and broad cancer risk without asserting a specific childhood tumor sequence.
  - reference: PMID:35420546
    reference_title: "Age of first cancer diagnosis and survival in Bloom syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "100 (65%) were diagnosed with 1 malignancy, whereas the remaining 55 (35%) developed multiple malignancies."
    explanation: The registry directly documents multiple primary cancers.
- phase: Adult endocrine and pulmonary complications
  age_range: Childhood through adulthood
  notes: >-
    Insulin-resistant diabetes, hypothyroidism, and chronic pulmonary disease
    can emerge early relative to the general population and require lifelong
    surveillance.
  evidence:
  - reference: PMID:20301572
    reference_title: "Bloom Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serious medical complications that are more common than in the general population and that also appear at unusually early ages include cancer of a wide variety of types and anatomic sites, diabetes mellitus as a result of insulin resistance, chronic obstructive pulmonary disease, and hypothyroidism."
    explanation: GeneReviews describes the later multisystem burden.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Cancer is common, early, and frequently multiple; immune, metabolic, and
    pulmonary complications add morbidity, and registry median survival remains
    markedly shortened.
  evidence:
  - reference: PMID:35420546
    reference_title: "Age of first cancer diagnosis and survival in Bloom syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative incidence of any malignancy by age 40 was 83%. The median survival for all participants in the BSR was 36.2 years."
    explanation: Registry estimates support a high-burden classification.
pathophysiology:
- name: Biallelic BLM Loss of Function
  description: >-
    Biallelic pathogenic variants abolish or severely impair the BLM RecQ
    helicase. This is the initiating lesion for the chromosome-instability
    phenotype, while the routes to most nonmalignant manifestations remain
    unresolved.
  genes:
  - preferred_term: BLM
    term:
      id: hgnc:1058
      label: BLM
  evidence:
  - reference: PMID:7585968
    reference_title: "The Bloom's syndrome gene product is homologous to RecQ helicases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of chain-terminating mutations in the candidate gene in persons with BS proved that it was BLM."
    explanation: >-
      The positional-cloning study established BLM as the causal gene using
      chain-terminating variants in affected people.
  downstream:
  - target: Failure of BTRR Double-Holliday-Junction Dissolution
    description: >-
      Loss of BLM disables the BLM-TOP3A-RMI1-RMI2 dissolution complex.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14685245
      reference_title: "The Bloom's syndrome helicase suppresses crossing over during homologous recombination."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "BLM and hTOPO IIIalpha together effect the resolution of a recombination intermediate containing a double Holliday junction."
      explanation: The biochemical study directly demonstrates the BLM-dependent dissolution reaction.
  - target: Unresolved Nonmalignant Multisystem Consequences
    description: >-
      Biallelic BLM loss causes the syndrome's nonmalignant manifestations, but
      the intervening mechanisms are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
      reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "remains unexplained, as do the medical complications of BSyn other than cancer."
      explanation: GeneReviews explicitly identifies this as an unresolved mechanistic branch.
- name: Failure of BTRR Double-Holliday-Junction Dissolution
  description: >-
    BLM normally cooperates with TOP3A, RMI1, and RMI2 in the BTRR complex to
    dissolve double Holliday junctions without crossover. Loss of BLM removes
    this anti-crossover genome-maintenance activity.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: ABNORMAL
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:14685245
    reference_title: "The Bloom's syndrome helicase suppresses crossing over during homologous recombination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mechanism, which we term double-junction dissolution, is distinct from classical Holliday junction resolution and prevents exchange of flanking sequences."
    explanation: >-
      The primary biochemical study defines the non-crossover dissolution
      function lost when BLM is deficient.
  - reference: PMID:25794620
    reference_title: "TopBP1 interacts with BLM to maintain genome stability but is dispensable for preventing BLM degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we identify critical residues that mediate interactions between TopBP1 and MDC1, and between BLM and TOP3A/RMI1/RMI2."
    explanation: Cell-based interaction mapping independently supports BLM association with TOP3A, RMI1, and RMI2.
  downstream:
  - target: Mitotic Hyper-Recombination
    description: Loss of anti-crossover dissolution permits excessive mitotic crossover.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14685245
      reference_title: "The Bloom's syndrome helicase suppresses crossing over during homologous recombination."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mechanism, which we term double-junction dissolution, is distinct from classical Holliday junction resolution and prevents exchange of flanking sequences."
      explanation: The primary biochemical study shows that BLM-dependent dissolution prevents crossover exchange.
- name: Mitotic Hyper-Recombination
  description: >-
    BLM-deficient cells undergo excessive homologous recombination and mitotic
    crossover. Elevated sister-chromatid exchange is modeled as a cellular
    readout of this state rather than as a separate causal driver.
  evidence:
  - reference: PMID:28232778
    reference_title: "Bloom's Syndrome: Clinical Spectrum, Molecular Pathogenesis, and Cancer Predisposition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The absence of a functional BLM protein causes chromosome instability, excessive homologous recombination, and a greatly increased number of sister chromatid exchanges that are pathognomonic of the syndrome.
    explanation: >-
      The cellular evidence identifies excessive homologous recombination after
      loss of functional BLM; SCE is retained as its diagnostic readout.
  downstream:
  - target: Increased Loss of Heterozygosity
    description: Excessive interhomolog crossover increases loss of heterozygosity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21730139
      reference_title: "Interhomolog recombination and loss of heterozygosity in wild-type and Bloom syndrome helicase (BLM)-deficient mammalian cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "LOH is increased by fivefold or more, implying significantly increased interhomolog crossing over."
      explanation: BLM-deficient mammalian cells directly show increased crossover-associated LOH.
- name: Increased Loss of Heterozygosity
  description: >-
    Excessive interhomolog crossover recurrently removes heterozygosity across
    the genome, increasing the probability that cancer-relevant somatic variants
    become homozygous.
  evidence:
  - reference: PMID:21730139
    reference_title: "Interhomolog recombination and loss of heterozygosity in wild-type and Bloom syndrome helicase (BLM)-deficient mammalian cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LOH is increased by fivefold or more, implying significantly increased interhomolog crossing over."
    explanation: >-
      This experiment quantifies the crossover-associated loss-of-heterozygosity
      intermediate in BLM-deficient cells.
  downstream:
  - target: Early-Onset Multicancer Predisposition
    description: Increased LOH from mitotic recombination drives tumor susceptibility across tissues.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11101838
      reference_title: "Cancer predisposition caused by elevated mitotic recombination in Bloom mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the increased rate of loss of heterozygosity (LOH) resulting from mitotic recombination in vivo constitutes the underlying mechanism causing tumour susceptibility in these mice."
      explanation: The Bloom mouse provides in-vivo causal evidence connecting mitotic recombination and LOH to cancer.
- name: Early-Onset Multicancer Predisposition
  description: >-
    Accumulating somatic genome alterations produce a broad, early-onset cancer
    predisposition affecting hematologic and solid-tumor lineages, often with
    multiple primary cancers in one person.
  evidence:
  - reference: PMID:35420546
    reference_title: "Age of first cancer diagnosis and survival in Bloom syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 290 individuals in the BSR, 155 (53%) participants developed 251 malignant neoplasms; 100 (65%) were diagnosed with 1 malignancy, whereas the remaining 55 (35%) developed multiple malignancies."
    explanation: >-
      The registry study documents the broad and frequently multiple cancer
      burden in molecularly defined Bloom syndrome.
  downstream:
  - target: Neoplasm
    description: Genome instability produces the clinical phenotype of early and multiple malignancies.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35420546
      reference_title: "Age of first cancer diagnosis and survival in Bloom syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The cumulative incidence of any malignancy by age 40 was 83%."
      explanation: Registry follow-up quantifies the clinical cancer-predisposition phenotype.
- name: Unresolved Nonmalignant Multisystem Consequences
  description: >-
    Bloom syndrome has characteristic growth, craniofacial, gastrointestinal,
    dermatologic, immune, metabolic, reproductive, pulmonary, and thyroid
    manifestations, but current evidence does not establish a single downstream
    molecular route from BLM loss to these findings.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "remains unexplained, as do the medical complications of BSyn other than cancer."
    explanation: GeneReviews explicitly marks the noncancer mechanisms as unresolved.
  downstream:

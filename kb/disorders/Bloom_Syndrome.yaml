      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Bloom syndrome (BSyn) is characterized by severe pre- and postnatal growth deficiency"
      explanation: The clinical association is strong, but the intervening mechanism is unresolved.
  - target: Short stature
    description: Persistent postnatal growth deficiency produces short stature through unknown intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence: *growth_edge_evidence
  - target: Microcephaly

phenotypes:
- name: Chromosome instability
  category: Cellular
  frequency: VERY_FREQUENT
  description: >-
    Cultured cells show strikingly elevated sister-chromatid exchanges and a
    broader chromosome-instability phenotype.
  phenotype_term:
    preferred_term: Chromosome instability
    term:
      id: HP:0003220

      label: Autosomal recessive inheritance
  description: >-
    Bloom syndrome is inherited as an autosomal recessive disorder caused by
    biallelic pathogenic variants in BLM. When both parents carry a pathogenic
    variant, each pregnancy has a 25% chance of an affected child.
  evidence:
  - reference: PMID:20301572
    reference_title: "Bloom Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BSyn is inherited in an autosomal recessive manner."
    explanation: GeneReviews directly states the inheritance pattern.
  - reference: PMID:20301572

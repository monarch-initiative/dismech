differential_diagnoses:
- name: Fanconi anemia
  disease_term:
    preferred_term: Fanconi anemia
    term:
      id: MONDO:0019391
      label: Fanconi anemia
  description: >-
    Fanconi anemia overlaps with Bloom syndrome through chromosome instability,
    cancer predisposition, pigmentary change, growth deficiency, and reduced
    fertility. Skeletal malformations and progressive bone-marrow failure favor
    Fanconi anemia.
  distinguishing_features:
  - Markedly elevated sister-chromatid exchange favors Bloom syndrome.
  - Bone marrow failure and congenital radial-ray anomalies favor Fanconi anemia.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bone marrow failure"
    explanation: The GeneReviews differential table identifies bone-marrow failure as a key feature favoring Fanconi anemia.
- name: Nijmegen breakage syndrome
  disease_term:
    preferred_term: Nijmegen breakage syndrome
    term:
      id: MONDO:0009623
      label: Nijmegen breakage syndrome
  description: >-
    Nijmegen breakage syndrome is another DNA-repair disorder with
    growth deficiency, genomic instability, immunodeficiency, and lymphoid
    cancer predisposition. Declining intellectual performance and absence of
    telangiectasias distinguish it from the usual Bloom presentation.
  distinguishing_features:
  - Elevated sister-chromatid exchange and a sun-sensitive malar rash favor Bloom syndrome.
  - Declining intellectual performance and lymphoid-predominant malignancy favor Nijmegen breakage syndrome.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/
    reference_title: "Bloom Syndrome - GeneReviews® - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Decline in intellectual performance"
    explanation: GeneReviews identifies declining intellectual performance as a feature favoring Nijmegen breakage syndrome.
- name: Rothmund-Thomson syndrome
  disease_term:
    preferred_term: Rothmund-Thomson syndrome
    term:
      id: MONDO:0010002
      label: Rothmund-Thomson syndrome
  description: >-
    RECQL4-related Rothmund-Thomson syndrome overlaps through small stature and
    cancer susceptibility, but true poikiloderma, alopecia, juvenile cataracts,
    and premature-aging features favor that diagnosis.
  distinguishing_features:
  - A sun-sensitive facial rash and highly elevated sister-chromatid exchange favor Bloom syndrome.
  - True poikiloderma, juvenile cataracts, and premature aging favor Rothmund-Thomson syndrome.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1398/

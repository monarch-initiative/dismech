    mechanism graph.
  evidence:
  - reference: PMID:41867784
    reference_title: "G-quadruplexes regulate chromatin accessibility and gene expression in Bloom Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "G4 stabilization partially recapitulated BS-associated molecular phenotypes."
    explanation: This perturbation result motivates the hypothesis while remaining preclinical and preprint evidence.
- discussion_id: bloom_heterozygote_cancer_risk
  prompt: >-

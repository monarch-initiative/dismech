description: >-
  Bloom syndrome is a rare autosomal recessive chromosome-instability disorder
  caused by biallelic loss-of-function variants in BLM. BLM is a RecQ helicase
  that cooperates with TOP3A, RMI1, and RMI2 to dissolve homologous-recombination
  intermediates without crossover. Loss of this activity causes
  hyper-recombination, loss of heterozygosity, markedly increased
  sister-chromatid exchange as a cellular readout, and a striking predisposition
  to early and multiple cancers. Severe pre- and postnatal growth deficiency,
  sparse adipose tissue, feeding difficulty and reflux, a narrow facial gestalt,
  photosensitive telangiectatic skin disease, immune abnormalities, recurrent
  infections, insulin resistance or diabetes, infertility, pulmonary disease,
  and hypothyroidism also occur, but their causal links to BLM deficiency are
  substantially less resolved than the cancer mechanism.

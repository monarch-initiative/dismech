    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Heterozygotes (carriers) are not at risk of developing BSyn; the cancer risk of heterozygotes as a group remains unclear."
    explanation: Current GeneReviews preserves the uncertainty while separating carriers from affected people.

    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the presence of progressive postnatal microcephaly in most cases, these findings suggest that neurodegeneration is an important feature of this disorder."
    explanation: Imaging and progressive microcephaly support a neurodegenerative component.

      evidence_source: MODEL_ORGANISM
      snippet: "However, our Drosophila studies raise the possibility that some patient phenotypes, particularly relating to movement defects, might be treatable acutely through gene therapy approaches to restore RBL2 expression in neurons."
      explanation: Adult neuronal rescue in flies links the movement phenotype to ongoing neuronal RBL2 function.
  - target: Sleep disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39692517
      reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
      supports: SUPPORT

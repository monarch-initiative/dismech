    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, these data reveal a conserved role of RBL2/Rbf orthologues in regulating movement and sleep across diverse phyla."
    explanation: Fly Rbf mutants show movement and sleep phenotypes paralleling the patients.
  - reference: PMID:15769944
    reference_title: "Regulation of neuron survival and death by p130 and associated chromatin modifiers."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Experimental suppression of such events blocks neuron death while interference with the synthesis of E2F4 or p130, or with the interaction of E2F4-p130 with chromatin modifiers, induces neuron death."
    explanation: Depleting p130 in cultured neurons causes neuron death, the mammalian counterpart of the fly post-mitotic requirement.
  downstream:

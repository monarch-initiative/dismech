- name: Post-Mitotic Neuronal Dysfunction
  description: >-
    Neuronal dysfunction that persists after brain development. In
    Drosophila, the RBL2 orthologue Rbf is required in differentiated
    post-mitotic neurons for normal locomotion, and re-expressing it in adult
    neurons rescues the locomotor defect of Rbf hypomorphs. Rbf mutants also
    have altered sleep timing and loss of evening anticipation. In cultured
    rodent neurons, depleting p130 causes neuron death. By analogy, loss of
    RBL2 in mature human neurons may contribute to the motor and sleep
    phenotypes and may be partly reversible; there are no human neuronal
    data.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

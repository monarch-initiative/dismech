    notes: Monogenic autosomal recessive disorder caused by biallelic RBL2 loss of function.
    evidence:
    - reference: PMID:33980986
      reference_title: "RBL2 bi-allelic truncating variants cause severe motor and cognitive impairment without evidence for abnormalities in DNA methylation or telomeric function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "indicates that loss of function variants in RBL2 cause a severe autosomal recessive neurodevelopmental disorder in humans"
      explanation: Frames the disorder as a monogenic recessive genetic disease.

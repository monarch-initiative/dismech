    reference_title: "Evolutionarily conserved multisubunit RBL2/p130 and E2F4 protein complex represses human cell cycle-dependent genes in quiescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This work reveals an evolutionarily conserved multisubunit protein complex that contains p130 and E2F4, but not pRB, and mediates the repression of cell cycle-dependent genes in quiescence."
    explanation: Establishes p130 as the RB-family member of the DREAM repressor complex.
  - reference: PMID:39692517
    reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Hence, de-repression of cell-cycle genes following RBL2/Rbf LOF could plausibly perturb neuronal development, intrinsic excitability or synaptic release, leading to defects in movement, sleep and other neurological features."
    explanation: The authors propose cell-cycle gene de-repression as the link to the neurological phenotype; it is a hypothesis, not a measurement.
  downstream:
  - target: Post-Mitotic Neuronal Dysfunction
    causal_link_type: UNKNOWN
    description: >-
      Hypothesised for the patients. In cultured rodent neurons, p130-E2F4
      complexes repress pro-apoptotic genes and depleting p130 kills neurons,
      but cell-cycle or pro-apoptotic gene expression has not been measured in
      RBL2-deficient human neurons.
    evidence:
    - reference: PMID:15769944
      reference_title: "Regulation of neuron survival and death by p130 and associated chromatin modifiers."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Here we show that p130 is the predominant Rb family member associated with E2F in neurons, that its major partner for repression of pro-apoptotic genes is E2F4, and that the p130-E2F4 complex recruits the chromatin modifiers HDAC1 and Suv39H1 to promote gene silencing and neuron survival."
      explanation: >-
        In neurons, p130-E2F4 repression of pro-apoptotic genes maintains
        survival; indirect because the system is cultured neurons rather than
        patient tissue.
- name: Impaired Neurogenesis and Neural Cell Survival During Brain Development
  description: >-
    During brain development, loss of p130 reduces neuron numbers and causes
    neural apoptosis in mouse embryos, and Rbf loss in flies reduces brain
    size. In patients the head is usually of normal size at birth and
    microcephaly develops postnatally, so the human counterpart of this node
    may be a failure of postnatal brain growth rather than of embryonic
    neurogenesis. p130-null mice die in mid-gestation only on some genetic
    backgrounds, and full nulls in flies and mice are lethal, whereas human
    patients with truncating variants survive.

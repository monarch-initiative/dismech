pathophysiology:
- name: Biallelic RBL2 Loss-of-Function Variants
  description: >-
    Biallelic nonsense, frameshift, splice and exon-deletion variants in RBL2
    abolish or truncate p130, a retinoblastoma-family pocket protein that
    represses E2F target genes as a transcriptional corepressor. Most variants
    are predicted to cause complete loss of function; one truncating variant
    escapes nonsense-mediated decay, so a truncated protein may persist in some
    patients.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: RBL2
    term:
      id: hgnc:9894
      label: RBL2
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: DECREASED
    term:
      id: GO:0003714
      label: transcription corepressor activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline homozygous (31 of 35 patients) or compound heterozygous (4 of
      35) predicted loss-of-function variants.
  evidence:
  - reference: PMID:39692517
    reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants were predicted as pathogenic or likely pathogenic by in silico methods, with variants causing truncations or transcriptional frameshifts likely to cause complete LOF"
    explanation: The reported variants are predicted to abolish RBL2 function.
  - reference: PMID:32105419
    reference_title: "Biallelic loss-of-function variants in RBL2 in siblings with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing in two siblings with severe intellectual disability, stereotypies and dysmorphic features identified biallelic loss-of-function variants c.556C>T, p.(Arg186Ter) and a deletion of exon 13-17 in RBL2 (NM_005611.3), establishing RBL2 as a candidate gene for an autosomal recessive neurodevelopmental disorder."
    explanation: Founding report of biallelic RBL2 loss-of-function variants.
  - reference: PMID:32105419
    reference_title: "Biallelic loss-of-function variants in RBL2 in siblings with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In growth arrested cells, RB proteins repress transcriptional activity of E2F."
    explanation: States the corepressor function of RB-family proteins, including p130, that the variants remove.
  downstream:
  - target: Loss of p130-DREAM Repression of Cell-Cycle Genes
    causal_link_type: DIRECT
    description: >-
      Loss of p130 is expected to remove DREAM-mediated repression of E2F
      target genes. This has been shown for p130 in cultured cells, not in
      patient neurons.
    evidence:
    - reference: PMID:17531812
      reference_title: "Evolutionarily conserved multisubunit RBL2/p130 and E2F4 protein complex represses human cell cycle-dependent genes in quiescence."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "DREAM bound to more than 800 human promoters in G0 and was required for repression of E2F target genes."
      explanation: >-
        The p130-containing DREAM complex represses E2F target genes in
        quiescent cultured cells; indirect for this disease because no study
        has measured cell-cycle gene expression in patient tissue.
  - target: Impaired Neurogenesis and Neural Cell Survival During Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from p130-null mouse embryos and Rbf-mutant flies, which show
      reduced neuron numbers, neural apoptosis and reduced brain size.
    evidence:
    - reference: PMID:9806916
      reference_title: "Strain-dependent embryonic lethality in mice lacking the retinoblastoma-related p130 gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "TUNEL analysis indicated the presence of extensive apoptosis in various tissues including the neural tube, the brain, the dermomyotome, but not the heart."
      explanation: Loss of p130 in mouse embryos causes neural apoptosis.
  - target: Post-Mitotic Neuronal Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39692517
      reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, in addition to its known role in controlling tissue growth during development, we found that continued Rbf expression is also required in fully differentiated post-mitotic neurons for normal locomotion in Drosophila, and that adult-stage neuronal re-expression of Rbf is sufficient to rescue Rbf mutant locomotor defects."
      explanation: >-
        In flies the RBL2 orthologue is required in post-mitotic neurons, so
        loss of RBL2 is expected to impair neurons after development as well as
        during it.
- name: Loss of p130-DREAM Repression of Cell-Cycle Genes
  description: >-
    p130 with E2F4 and the MuvB core forms the DREAM complex, which binds
    cell-cycle gene promoters in quiescent cells and represses them. Loss of
    p130 is predicted to de-repress these genes. The authors of the largest
    series propose that such de-repression could disturb neuronal development,
    excitability or synaptic release; this has not been tested.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL

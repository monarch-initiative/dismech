name: Brunet-Wagner_Neurodevelopmental_Syndrome
creation_date: "2026-10-23T01:57:58Z"
category: Mendelian
synonyms:
- BRWANS
- RBL2-related neurodevelopmental disorder
- RBL2-associated neurodevelopmental disorder
description: >-
  Brunet-Wagner neurodevelopmental syndrome (BRWANS, OMIM:619690) is an
  autosomal recessive neurodevelopmental disorder caused by biallelic
  predicted loss-of-function variants in RBL2 (16q12.2), which encodes p130, a
  retinoblastoma-family transcriptional corepressor that, with E2F4 and the
  MuvB core (the DREAM complex), represses cell-cycle genes in quiescent
  cells. The disorder was first described in two German siblings in 2020, and
  the largest series (35 patients from 20 families, most of them
  consanguineous) defines the phenotype: global developmental delay and
  moderate to profound intellectual disability in every patient, with most
  never walking or speaking; infantile hypotonia; postnatal (secondary)
  microcephaly; stereotypies, often hand clasping and mouthing; aggressive
  behaviour; sleep disturbance; seizures in about a third; non-specific facial
  dysmorphism; and strabismus or nystagmus. Brain MRI shows cerebral atrophy
  with an anteroposterior gradient, white matter volume loss, a thin corpus
  callosum and, in about half, cerebellar atrophy; with progressive
  microcephaly and regression in some patients, this suggests a
  neurodegenerative component. How loss of p130 damages the brain is not
  established. p130-null mice die in mid-gestation with neural apoptosis and
  reduced neuron numbers, and Drosophila mutants of the orthologue Rbf show
  smaller brains, locomotor and sleep defects; the locomotor defect is rescued
  by restoring Rbf in adult post-mitotic neurons. Patient fibroblasts show no
  abnormality of DNA methylation or telomere length, two functions previously
  attributed to p130. Treatment is supportive.
disease_term:
  preferred_term: Brunet-Wagner neurodevelopmental syndrome
  term:
    id: MONDO:0859217
    label: Brunet-Wagner neurodevelopmental syndrome
parents:
- Mendelian neurodevelopmental disorder
notes: >-
  The 35-patient series (PMID:39692517) is the phenotype baseline; its cached
  file is the full text and the per-feature counts quoted here come from it.
  It includes previously reported patients, so counts from the founding sibling
  report (PMID:32105419) and the three-patient report (PMID:33980986) overlap
  with it and are not summed. A medRxiv preprint of the same series
  (PMID:38746364, 28 patients) is superseded by the peer-reviewed paper and is
  not cited. Common variation at the RBL2 locus has been associated with
  intelligence, educational attainment and age at walking in genome-wide
  studies; that population association is not this Mendelian disorder and is
  not cited. Despite RBL2 belonging to the retinoblastoma tumour-suppressor
  family, no malignancy was reported in patients or carriers in the
  three-patient report (PMID:33980986). One child with a biallelic RBL2
  frameshift developed a benign orbital mesenchymal tumour (nodular
  fasciitis) at age 6 (PMID:35487417), and the largest series lists an
  orbital mass in 2 of 33 patients, so a link to orbital tumours is possible
  but unproven. The same report found no abnormality of
  DNMT expression, global or regional DNA methylation, telomere length or
  senescence onset in RBL2-null patient fibroblasts, so those mechanisms are
  not modelled as pathophysiology nodes. No GeneReviews chapter covers this
  disorder.

- name: Progressive Neurodegeneration
  description: >-
    Cerebral atrophy with an anteroposterior gradient, white matter volume loss,
    thinning of the corpus callosum and cerebellar atrophy, together with
    postnatal and progressive microcephaly and regression in some patients,
    indicate ongoing neuronal loss after birth. Cerebellar atrophy progressed on
    follow-up imaging in one patient. The cellular cause of the degeneration is
    unknown.

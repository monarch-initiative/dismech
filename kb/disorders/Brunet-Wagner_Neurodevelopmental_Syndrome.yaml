      The clinical burden is neurodevelopmental and neurological: global
      developmental delay, intellectual disability, hypotonia, microcephaly,
      stereotypies, seizures and progressive brain atrophy.
    evidence:
    - reference: PMID:39692517
      reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
      supports: SUPPORT

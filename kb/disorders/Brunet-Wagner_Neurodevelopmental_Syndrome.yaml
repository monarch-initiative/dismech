animal_models:
- name: Drosophila Rbf hypomorph
  species: Drosophila melanogaster
  genotype: Rbf120a hypomorphic allele (hemizygous males, homozygous females)
  description: >-
    Partial loss of the single fly RB-family orthologue Rbf causes
    developmental delay, altered head and brain morphology, reduced locomotion
    and altered sleep timing. Adult-stage neuronal re-expression of Rbf rescues
    the locomotor defect.
  publication: PMID:39692517
  modeled_mechanisms:
  - target: Post-Mitotic Neuronal Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Locomotor and sleep defects that depend on Rbf in adult post-mitotic neurons.
    limitations: >-
      Flies have two RB genes against three in humans and fewer E2F partners,
      so the fly phenotype may not isolate the p130-specific function.
    evidence:
    - reference: PMID:39692517
      reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that Drosophila Rbf LOF mutants recapitulate several features of patients harbouring RBL2 variants, including developmental delay, alterations in head and brain morphology, locomotor defects and perturbed sleep."
      explanation: The fly hypomorph reproduces several patient features.
  - target: Impaired Neurogenesis and Neural Cell Survival During Brain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Reduced head and brain size.
    limitations: >-
      An invertebrate brain without a cortex; the cellular basis of the
      reduced brain size was not determined.
    evidence:
    - reference: PMID:39692517
      reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In concert with the microcephaly seen in RBL2 patients, these data reveal a conserved function of the RBL2 and Rbf proteins in controlling head and brain morphology during development."
      explanation: Head and brain morphology are altered in Rbf mutants.
- name: p130-null mouse (Balb/cJ background)
  species: Mouse
  genotype: Rbl2 (p130) targeted null allele, homozygous
  description: >-
    On an enriched Balb/cJ background, p130-null embryos arrest and die between
    E11 and E13 with neural disorganization, reduced neuron numbers and
    widespread neural apoptosis; after one cross to C57BL/6 the nulls are
    viable and fertile.
  publication: PMID:9806916
  modeled_mechanisms:
  - target: Impaired Neurogenesis and Neural Cell Survival During Brain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Neural apoptosis and reduced neuron numbers in mid-gestation embryos.
    limitations: >-
      Embryonic lethal on one background and phenotypically normal on another,
      so no postnatal brain phenotype can be studied; the human disease is
      postnatal and patients with truncating variants survive.
    evidence:
    - reference: PMID:9806916
      reference_title: "Strain-dependent embryonic lethality in mice lacking the retinoblastoma-related p130 gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological analysis revealed varying degrees of disorganization in neural and dermamyotomal structures."
      explanation: Neural disorganization in p130-null embryos.
discussions:
- discussion_id: brwans_mechanism_of_neurodegeneration
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of p130 cause neuronal loss in patients through de-repression of
    cell-cycle genes in post-mitotic neurons, and is the progression of brain
    atrophy and microcephaly driven by neuronal apoptosis?
  attaches_to:
  - pathophysiology#Loss of p130-DREAM Repression of Cell-Cycle Genes
  - pathophysiology#Progressive Neurodegeneration
  rationale: >-
    The link from RBL2 loss to the neurological phenotype is proposed but
    untested. Patient fibroblasts excluded DNA methylation and telomere
    defects, and no study has examined cell-cycle gene expression, apoptosis or
    excitability in RBL2-deficient human neurons.
  proposed_experiments:
  - experiment_id: brwans_ipsc_neurons
    name: Patient iPSC-derived neurons and cortical organoids
    description: >-
      Measure E2F target-gene expression, cell-cycle re-entry, apoptosis and
      electrophysiology in RBL2-null iPSC-derived neurons and cortical
      organoids against isogenic corrected controls.
- discussion_id: brwans_no_postnatal_mammalian_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can a mammalian model reproduce the postnatal disease, given that p130-null
    mice are either embryonic lethal or phenotypically normal depending on
    genetic background, while human patients with truncating variants survive
    with a severe postnatal neurodevelopmental disorder?
  attaches_to:
  - pathophysiology#Impaired Neurogenesis and Neural Cell Survival During Brain Development
  rationale: >-
    Mouse evidence exists but its relevance to the human disease is uncertain:
    strain-dependent modifier genes determine the outcome of p130 loss in mice,
    and the only model with postnatal neurological phenotypes is an
    invertebrate.
  proposed_experiments:
  - experiment_id: brwans_mouse_postnatal_phenotyping
    experiment_design: TARGETED_PERTURBATION
    name: Postnatal neurological phenotyping of viable p130-null mice
    description: >-
      Assess brain growth, MRI volumetry, motor behaviour, sleep and seizures in
      p130-null mice on the viable C57BL/6 background, including brain-specific
      conditional deletion.

treatments:
- name: Antiseizure medication
  description: >-
    In the largest series most patients with seizures were controlled on
    valproate (five), levetiracetam (one) or both (two), and two had
    intractable seizures; in the founding family several drug trials failed in
    one sibling. These are uncontrolled case observations, not a comparison of
    drugs.

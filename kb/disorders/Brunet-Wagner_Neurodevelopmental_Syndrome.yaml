genetic:
- name: RBL2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RBL2
    term:
      id: hgnc:9894
      label: RBL2
  features: >-
    RB transcriptional corepressor like 2 (p130), a retinoblastoma-family
    pocket protein. Disease alleles are biallelic nonsense, frameshift, splice
    and multi-exon deletion variants; the founding family carried p.(Arg186Ter)
    in trans with an in-frame deletion of exons 13-17.
  evidence:
  - reference: PMID:32105419
    reference_title: "Biallelic loss-of-function variants in RBL2 in siblings with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing (ES) identified compound-heterozygous loss-of-function variants in the candidate gene RBL2 segregating within the family proposing RBL2 as an excellent candidate gene for neurodevelopmental disorders."
    explanation: Founding gene-disease report.
  - reference: PMID:33980986
    reference_title: "RBL2 bi-allelic truncating variants cause severe motor and cognitive impairment without evidence for abnormalities in DNA methylation or telomeric function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe the phenotype of three patients carrying bi-allelic RBL2-truncating variants. All presented with infantile hypotonia, severe developmental delay and microcephaly."
    explanation: Independent replication in three further patients.
  - reference: PMID:39692517
    reference_title: "Clinical and genetic characterization of a progressive RBL2-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we address this knowledge gap by characterizing a cohort of 35 patients from 20 families carrying homozygous or compound heterozygous pLOF variants in RBL2."
    explanation: Replication in 20 families.
  variants:
  - name: c.556C>T p.(Arg186Ter)
    description: >-
      Maternally inherited nonsense variant in exon 3 (NM_005611.3), found in
      trans with a paternal exon 13-17 deletion in the founding siblings.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:32105419
      reference_title: "Biallelic loss-of-function variants in RBL2 in siblings with a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The nonsense variant is located in exon 3 (chr16:53476754) and is predicted to cause a premature termination of translation."
      explanation: Location and predicted effect of the founding nonsense variant.

name: Brucella Suis Brucellosis
creation_date: "2026-09-29T23:56:11Z"
description: >-
  Brucella suis brucellosis is a swine-associated form of human brucellosis
  caused by the facultatively intracellular bacterium Brucella suis after
  zoonotic exposure to infected domestic or feral swine tissues, body fluids, or
  aerosols.
category: Infectious Disease
disease_term:
  preferred_term: Brucella suis brucellosis
  term:
    id: MONDO:0001190
    label: Brucella suis brucellosis
parents:
- Brucellosis
synonyms:
- B. suis infection
infectious_agent:
- name: Brucella suis
  infectious_agent_term:
    preferred_term: Brucella suis
    term:
      id: NCBITaxon:29461
      label: Brucella suis
  description: >-
    Facultatively intracellular Brucella species whose animal reservoirs include
    pigs and wild boar and that causes species-specific human brucellosis after
    zoonotic exposure.
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A retrospective review was conducted to assess 32 patients with
      brucellosis caused by Brucella suis in Townsville, Australia during
      1996-2009.
    explanation: >-
      Identifies B. suis as the causative species in a human brucellosis cohort.
  - reference: PMID:30050849
    reference_title: "Swine brucellosis: current perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Brucella suis is a significant zoonotic species that is present in
      domestic livestock and wildlife in many countries worldwide.
    explanation: >-
      Supports B. suis as a zoonotic Brucella species distributed in domestic
      and wildlife reservoirs.
agent_life_cycle:
  description: >-
    B. suis is maintained in infected domestic pigs and feral swine, which seed
    human infection by contact, aerosol, and tissue exposure. Humans are
    incidental clinical hosts rather than a maintenance reservoir.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: pig
    role: domestic and feral swine reservoir host
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Swine-associated zoonotic exposure
  description: >-
    Humans acquire B. suis brucellosis through exposure to infected domestic or
    feral swine tissues, reproductive fluids, carcasses, or aerosols generated
    during butchering, hunting, farm, abattoir, or laboratory work.
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The greatest risk factor for brucellosis was feral pig hunting (94%, n =
      30).
    explanation: >-
      Links most human B. suis cases in the northern Australia cohort to feral
      pig hunting.
  - reference: PMID:30050849
    reference_title: "Swine brucellosis: current perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission from animal reservoirs is the source of human infection as
      human-to-human transmission is very rare.
    explanation: >-
      Establishes animal reservoirs as the usual source of human B. suis
      infection.
pathophysiology:
- name: Swine-Associated Brucella suis Acquisition
  role: trigger
  description: >-
    B. suis enters the human host after swine-associated zoonotic exposure and
    establishes the species-specific form of brucellosis.
  biological_scale: ORGANISM
  downstream:
  - target: Intracellular Macrophage Survival
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Zoonotically acquired B. suis crosses a mucosal or cutaneous barrier and
      is taken up by phagocytes.
  evidence:
  - reference: PMID:30050849
    reference_title: "Swine brucellosis: current perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In many areas worldwide, feral or wild populations of swine are important
      reservoir hosts.
    explanation: >-
      Identifies feral and wild swine as reservoir hosts for the zoonotic
      acquisition step.
- name: Intracellular Macrophage Survival
  description: >-
    Brucella survives in phagocytic host cells by avoiding lysosomal killing and
    establishing an intracellular replicative niche.
  biological_scale: CELLULAR
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Systemic Brucellosis Inflammatory Syndrome
    causal_link_type: DIRECT
    description: >-
      Intracellular persistence drives the systemic inflammatory response of
      human brucellosis.
  evidence:
  - reference: PMID:11260139
    reference_title: >-
      Essential role of the VirB machinery in the maturation of the Brucella
      abortus-containing vacuole.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that a functional virB operon is essential for the
      biogenesis of the Brucella-containing vacuole.
    explanation: >-
      Demonstrates the conserved VirB-dependent Brucella intracellular-vacuole
      program in B. abortus, cited as an inference for the B. suis intracellular
      niche.
- name: Systemic Brucellosis Inflammatory Syndrome
  description: >-
    Persistent intracellular B. suis infection produces the systemic febrile
    inflammatory syndrome of human brucellosis and can seed focal complications.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      The systemic inflammatory response drives the febrile illness.
  - target: Fatigue
    causal_link_type: DIRECT
    description: >-
      Systemic inflammation produces the prominent constitutional fatigue.
  - target: Arthralgia
    causal_link_type: DIRECT
    description: >-
      Systemic inflammation produces the arthralgia of human brucellosis.
  - target: Depression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The systemic illness is accompanied by frequent, often severe depression.
  - target: Focal Organ Complications
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disseminated persistent infection seeds focal organ complications.
  evidence:
  - reference: PMID:29621840
    reference_title: >-
      Pigs, pooches and pasteurisation: The changing face of brucellosis in
      Australia.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brucellosis, also known as undulant, Mediterranean or Malta fever, is a
      systemic infection that causes fever, sweats, arthralgias and myalgias.
    explanation: >-
      Describes human brucellosis as a systemic febrile inflammatory syndrome
      with fever and arthralgia.
- name: Focal Organ Complications
  description: >-
    Disseminated, persistent B. suis infection can produce focal osteoarticular,
    genitourinary, and, more rarely, neurological or cardiovascular disease,
    with complications more likely after delayed diagnosis.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:29621840
    reference_title: >-
      Pigs, pooches and pasteurisation: The changing face of brucellosis in
      Australia.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which include osteoarticular, genitourinary or, more rarely, neurological
      or cardiovascular diseases.
    explanation: >-
      Lists the focal organ complications of human brucellosis.
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complication rate was 25% (n = 8).
    explanation: >-
      Quantifies the focal complication rate in the human B. suis cohort.
phenotypes:
- name: Fever
  description: >-
    Fever is the dominant systemic manifestation of B. suis brucellosis.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent clinical features included fever (94%, n = 30), fatigue
      (78%, n = 25) and arthralgia (78%, n = 25).
    explanation: >-
      Reports fever as the most frequent clinical feature in human B. suis
      brucellosis.
- name: Fatigue
  description: >-
    Fatigue is a common systemic symptom in B. suis brucellosis.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent clinical features included fever (94%, n = 30), fatigue
      (78%, n = 25) and arthralgia (78%, n = 25).
    explanation: >-
      Reports fatigue in 78% of patients in the human B. suis brucellosis
      cohort.
- name: Arthralgia
  description: >-
    Joint pain is common in B. suis brucellosis and can accompany focal
    osteoarticular complications.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent clinical features included fever (94%, n = 30), fatigue
      (78%, n = 25) and arthralgia (78%, n = 25).
    explanation: >-
      Reports arthralgia in 78% of patients in the human B. suis brucellosis
      cohort.
- name: Depression
  description: >-
    Depression is a common and often severe neuropsychiatric manifestation of
    human brucellosis. The source reports it qualitatively without a counted
    denominator, so no frequency band is assigned.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:29621840
    reference_title: >-
      Pigs, pooches and pasteurisation: The changing face of brucellosis in
      Australia.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Depression is common and often severe, relative to other symptoms.
    explanation: >-
      Reports depression as a common and often severe symptom of human
      brucellosis.
diagnosis:
- name: Serology and blood culture
  description: >-
    Suspected acute B. suis brucellosis is diagnosed with Brucella serology and
    blood culture in a compatible zoonotic-exposure syndrome, with imaging or
    biopsy reserved for suspected focal infection.
  results: >-
    Brucella-specific seroreactivity or culture growth of Brucella from blood
    or focal tissue.
  evidence:
  - reference: PMID:29621840
    reference_title: >-
      Pigs, pooches and pasteurisation: The changing face of brucellosis in
      Australia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosing acute infections is&nbsp;based on serology and blood cultures;
      imaging and biopsy may be required for diagnosis of focal infections.
    explanation: >-
      Describes the combined serology, culture, imaging, and biopsy approach for
      acute and focal brucellosis.
treatments:
- name: Doxycycline plus gentamicin
  description: >-
    Combination antibiotic therapy with doxycycline and gentamicin is an
    Australian recommended regimen for human brucellosis, including B. suis
    disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  target_mechanisms:
  - target: Intracellular Macrophage Survival
    treatment_effect: INHIBITS
    description: >-
      Combination therapy reduces the intracellular Brucella population that
      drives relapse-prone disease.
  evidence:
  - reference: PMID:29621840
    reference_title: >-
      Pigs, pooches and pasteurisation: The changing face of brucellosis in
      Australia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dual therapy with doxycycline and gentamicin is the recommended treatment.
      Relapse occurs in up to 10% of patients.
    explanation: >-
      Supports a doxycycline-gentamicin combination regimen and the relapse
      risk that makes complete therapy important.
progression:
- phase: Acute brucellosis
  notes: >-
    Acute disease is the initial systemic febrile presentation, with fever,
    fatigue, and arthralgia; delayed diagnosis raises the risk of focal
    complications.
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent clinical features included fever (94%, n = 30), fatigue
      (78%, n = 25) and arthralgia (78%, n = 25).
    explanation: >-
      Describes the acute systemic clinical features in the human B. suis
      cohort.
- phase: Relapse and chronic brucellosis
  notes: >-
    A substantial fraction of patients report recurrent or persistent symptoms
    after apparent treatment response, reflecting the relapse-prone course of
    intracellular Brucella infection.
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      64% (16) of the patients reporting recurrent symptoms.
    explanation: >-
      Quantifies recurrent symptoms as a frequent long-term outcome in the human
      B. suis cohort.
epidemiology:
- name: Northern Australia feral-pig hunter cohort
  description: >-
    In a Townsville cohort of 32 B. suis cases, the patients were young to
    middle-aged men whose dominant shared exposure was feral-pig hunting, and
    delayed diagnosis was associated with focal complications.
  evidence:
  - reference: PMID:20889883
    reference_title: Brucellosis in northern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complication rate was 25% (n = 8). A delay in diagnosis of more than
      14 days significantly increased the risk of the patient developing
      complications (95% confidence interval = 3.20-198.96, P = 0.002).
    explanation: >-
      Quantifies complications and ties delayed diagnosis to complication risk
      in the human B. suis cohort.

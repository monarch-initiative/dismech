  evidence:
  - reference: PMID:34812989
    reference_title: Molecular subtyping of ependymoma and prognostic impact of Ki-67.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surrogate IHC markers revealed high concordance rates between L1CAM and ZFTA-fusion and H3K27me3 loss or EZHIP overexpression was used for PFA-EPNs.
    explanation: Establishes EZHIP overexpression by immunohistochemistry as a surrogate biomarker for PFA ependymomas.
- name: Glial Fibrillary Acidic Protein (GFAP)
  presence: PRESENT
  context: >-
    Characteristic glial immunohistochemical marker positive in the fibrillary
    processes of perivascular pseudorosettes across ependymomas.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histological re-evaluation in five primary tumors and seven relapses showed characteristic histological features of ependymoma, namely pseudorosettes, GFAP- and EMA positivity.
    explanation: Documents GFAP positivity as a characteristic immunophenotypic feature of ependymoma.
- name: Epithelial Membrane Antigen (EMA)
  presence: PRESENT
  context: >-

- name: PRC2 Catalytic Inhibition
  conforms_to: epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression
  description: >-
    A short, highly conserved C-terminal peptide of EZHIP mimics the sequence of
    K27M-mutated histones and contacts the active site of the EZH2 subunit,
    blocking PRC2 methyltransferase activity. EZHIP therefore acts as an
    "oncohistone mimic", producing the same functional lesion as the H3 K27M
    mutation of diffuse midline glioma without any histone mutation.

name: Ependymoma
creation_date: '2026-07-28T16:00:00Z'
updated_date: '2026-07-28T16:00:00Z'
description: >-
  Ependymoma is a glial neoplasm of ependymal / radial-glial lineage that arises
  along the neuraxis — in the supratentorial brain, the posterior fossa, or the
  spinal cord. It accounts for roughly 2-3% of primary CNS tumors in adults and
  up to 10% in children, and is one of the more common pediatric brain tumors.
  Its defining biological feature is that, unlike most adult gliomas, it carries
  very few recurrent point mutations; instead it is driven by compartment-specific
  fusion oncogenes and epigenetic reprogramming. Under the 5th edition of the WHO
  Classification of Tumours of the Central Nervous System (WHO CNS5, 2021),
  ependymal tumors are therefore classified first by anatomical compartment and
  then by molecular group, because methylome profiling showed that
  compartment-specific groups are biologically distinct. Supratentorial tumors are
  defined by ZFTA (formerly C11orf95) or YAP1 fusions; posterior fossa tumors are
  split into group A (PFA) and group B (PFB) by methylation class or the H3 K27me3
  immunohistochemical surrogate; spinal tumors are frequently defined by NF2 loss,
  except for an aggressive MYCN-amplified class. WHO CNS5 dropped the
  classic-versus-anaplastic distinction because tumor grade correlated poorly with
  survival. Histologically, ependymomas are recognized by perivascular
  pseudorosettes and, less commonly, true ependymal rosettes. Clinical
  presentation depends on location: posterior fossa tumors obstruct cerebrospinal
  fluid pathways and cause hydrocephalus, supratentorial tumors present with
  seizures or focal deficits, and spinal tumors cause back pain and sensorimotor
  deficits. Maximal safe surgical resection is the cornerstone of treatment,
  followed by focal conformal radiotherapy for most grade 2 and 3 tumors;
  cytotoxic chemotherapy has no established role as primary therapy. Extent of
  resection and molecular group are the strongest prognostic determinants.
categories:
- Central Nervous System Neoplasm
- Glioma
- Pediatric Brain Tumor
- Molecularly Defined Tumor
parents:
- glioma
epidemiology:
- name: Proportion of primary CNS tumors
  description: >-
    Ependymomas account for approximately 2-3% of primary CNS tumors in adults and
    up to 10% in children, making them one of the more common pediatric brain
    tumors.
  evidence:
  - reference: PMID:30855832
    reference_title: Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They account for approximately 2% to 3% of all primary central nervous
      system (CNS) tumors in adults and up to 10% in children, making them one of
      the more common pediatric brain tumors after medulloblastoma and juvenile pilocytic
      astrocytoma.
    explanation: Provides the proportion of primary CNS tumors represented by ependymoma
      in adults and children.
- name: Population incidence
  description: >-
    In combined CBTRUS/NPCR/SEER data, ependymoma had the highest average annual
    age-adjusted incidence rate among the 12 rare CNS tumor types tracked by
    NCI-CONNECT, at 0.41 per 100,000 population.
  evidence:
  - reference: PMID:37980692
    reference_title: 'Capturing evolving definitions of 12 select rare CNS tumors: a
      timely report from CBTRUS and NCI-CONNECT.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AAAIR was 1.47 per 100,000 for these tumors combined, with highest incidence
      in ependymomas (AAAIR = 0.41/100,000).
    explanation: Provides the population-based age-adjusted incidence rate for ependymoma
      from a national registry analysis.
- name: Anatomic distribution by age
  description: >-
    Anatomic distribution differs sharply by age: about two-thirds of pediatric
    ependymomas are intracranial and most often arise in the posterior fossa,
    whereas in adults most tumors are spinal.
  evidence:
  - reference: PMID:30855832
    reference_title: Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'These tumors demonstrate a wide anatomic distribution: approximately
      two-thirds occur intracranially in children, most often in the posterior fossa;
      in adults, most cases are located in the spinal cord.'
    explanation: Documents the age-dependent anatomic distribution of ependymoma.
- name: Median age of intracranial disease
  description: >-
    Intracranial ependymomas most commonly affect young children, with a median
    age of about 5 years, and show a slight male predominance. Ependymomas
    predominantly affect children under 10 years of age.
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary
      review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Intracranial ependymomas are glial tumors arising from the ependymal
      lining of the ventricular system, most commonly affecting young children (median
      age: 5 years), though they can occur across all age groups.'
    explanation: Establishes median age at presentation and the predominance of young
      children among intracranial ependymomas.
  - reference: PMID:16142778
    reference_title: 'Central nervous system tumours in children: epidemiology and risk
      factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ependymomas mainly occur in children less than 10 years
    explanation: Independent epidemiologic review confirming the paediatric age distribution
      of ependymoma.
has_subtypes:
- name: ST-ZFTA
  display_name: Supratentorial ependymoma, ZFTA fusion-positive
  description: >-
    Supratentorial ependymoma defined by fusion of ZFTA (formerly C11orf95), most
    often to RELA. Under cIMPACT-NOW update 7 and WHO CNS5 the former
    "ependymoma, RELA fusion-positive" was renamed to reflect that ZFTA fusions
    with or without RELA involvement represent the same histomolecular entity.
  evidence:
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Concerning supratentorial ependymomas, the previous RELA fusion-positive
      ependymoma has been renamed into ZFTA fusion-positive and the novel YAP1 fusion-positive
      ependymoma subtype has been added.
    explanation: Confirms the WHO CNS5 renaming of the supratentorial ZFTA fusion-positive
      subtype.
- name: ST-YAP1
  display_name: Supratentorial ependymoma, YAP1 fusion-positive
  description: >-
    Supratentorial ependymoma defined by YAP1 fusion, added as a distinct subtype
    in WHO CNS5. YAP1-fused tumors were among the two prototypic supratentorial
    fusion-defined molecular subgroups identified by methylation profiling.
  evidence:
  - reference: PMID:25965575
    reference_title: Molecular Classification of Ependymal Tumors across All CNS Compartments,
      Histopathological Grades, and Age Groups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two supratentorial subgroups are characterized by prototypic fusion genes
      involving RELA and YAP1, respectively.
    explanation: Identifies YAP1 fusion as defining one of the two supratentorial molecular
      subgroups.
- name: PFA
  display_name: Posterior fossa ependymoma, group A
  description: >-
    Posterior fossa ependymoma of methylation group A, mainly diagnosed in infants
    and young children and carrying a poor prognosis. PFA tumors are characterized
    by a lack of the repressive H3K27me3 mark and high EZHIP expression; loss of
    H3 K27me3 by immunohistochemistry serves as a practical diagnostic surrogate.
  evidence:
  - reference: PMID:30923826
    reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as
      an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PFA tumors are mainly diagnosed in infants and young children, show a poor
      prognosis, and are characterized by a lack of the repressive histone H3 lysine
      27 trimethylation (H3K27me3) mark.
    explanation: Establishes the age distribution, prognosis and defining epigenetic mark
      loss of PFA ependymoma.
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Posterior fossa ependymomas should now be allocated either to the Type
      A or Type B subtypes based on molecular profiling or using the H3 K27me3 immunohistochemical
      surrogate.
    explanation: Establishes PFA/PFB assignment by methylation profiling or the H3 K27me3
      immunohistochemical surrogate.
- name: PFB
  display_name: Posterior fossa ependymoma, group B
  description: >-
    Posterior fossa ependymoma of methylation group B, occurring in older
    children and adults and carrying a substantially better prognosis than PFA.
    PFB tumors retain H3K27me3 immunoreactivity.
  evidence:
  - reference: PMID:32502305
    reference_title: 'cIMPACT-NOW update 7: advancing the molecular classification of
      ependymal tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Common recurrent genetic or epigenetic alterations found in tumors belonging
      to the main molecular groups have been used to define tumor types at intracranial
      sites; C11orf95 and YAP1 fusion genes for supratentorial tumors and two types
      of posterior fossa ependymoma defined by methylation group, PFA and PFB.
    explanation: Defines PFA and PFB as the two methylation-defined posterior fossa
      ependymoma types.
- name: SP-EPN
  display_name: Spinal ependymoma
  description: >-
    Conventional spinal cord ependymoma, the most common intramedullary neoplasm
    in children and adults, carrying a better prognosis than intracranial disease.
    Loss of chromosome 22q and NF2 mutation are the only known recurrent genetic
    events in this methylation class.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compared with intracranial ependymomas, spinal ependymomas are less frequent
      and exhibit a better prognosis.
    explanation: Contrasts the frequency and prognosis of spinal versus intracranial
      ependymoma.
  - reference: PMID:38265489
    reference_title: Transcriptomic and epigenetic dissection of spinal ependymoma (SP-EPN)
      identifies clinically relevant subtypes enriched for tumors with and without NF2
      mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The only known recurrent genetic events in SP-EPN are loss of chromosome
      22q and NF2 mutations
    explanation: Identifies 22q loss and NF2 mutation as the recurrent genetic events
      defining the spinal ependymoma methylation class.
- name: SP-MYCN
  display_name: Spinal ependymoma, MYCN-amplified
  description: >-
    Aggressive spinal ependymoma type defined by MYCN amplification, added in WHO
    CNS5. These tumors are prone to infiltration of the spinal cord and
    dissemination through the CNS, and outcome remains poor.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Copy number variation plots derived from DNA methylation arrays showed
      MYCN amplification as a characteristic genetic alteration in all cases of our
      cohort (n = 13), which was subsequently validated using fluorescence in situ hybridization.
    explanation: Establishes MYCN amplification as the defining alteration of this spinal
      ependymoma subgroup.
- name: Myxopapillary
  display_name: Myxopapillary ependymoma
  description: >-
    Histopathologically defined ependymal tumor type arising almost exclusively
    in the region of the conus medullaris, cauda equina and filum terminale. WHO
    CNS5 assigns it grade 2, a change from its previous grade 1 designation.
  evidence:
  - reference: PMID:32502305
    reference_title: 'cIMPACT-NOW update 7: advancing the molecular classification of
      ependymal tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Myxopapillary ependymoma and subependymoma have been retained as histopathologically
      defined tumor types, but the classification has dropped the distinction between
      classic and anaplastic ependymoma.
    explanation: Confirms myxopapillary ependymoma is retained as a histopathologically
      defined type.
- name: Subependymoma
  display_name: Subependymoma
  description: >-
    Slow-growing, histopathologically defined WHO grade 1 ependymal tumor,
    typically intraventricular and often an incidental finding. Retained as a
    distinct type in the molecular era because it is defined by histopathology
    rather than by a recurrent molecular alteration.
  evidence:
  - reference: PMID:27022130
    reference_title: Biology and management of ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Myxopapillary ependymomas and subependymomas have different biology than
      ependymomas with typical WHO grade II or III histology.
    explanation: Distinguishes subependymoma biology from conventional grade 2-3 ependymoma.
pathophysiology:
- name: Radial Glial Progenitor Transformation
  description: >-
    Ependymal neoplasms arise from the progenitors of the cells lining the
    ventricular system and spinal central canal. Radial glia are the proposed cell
    of origin, and compartment-restricted progenitor populations explain why
    supratentorial, posterior fossa and spinal ependymomas are molecularly
    distinct despite similar histology.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: ependymal cell
    term:
      id: CL:0000065
      label: ependymal cell
  locations:
  - preferred_term: ventricular system of brain
    term:
      id: UBERON:0005282
      label: ventricular system of brain
  evidence:
  - reference: PMID:17179988
    reference_title: Stem cells of ependymoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: radial glia are cells of origin of ependymoma
    explanation: Review of the evidence identifying radial glia as the cell of origin of
      ependymoma.
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ependymal neoplasms are a heterogenous group of neoplasms arising from
      the progenitors of the cells lining the ventricular system and the spinal central
      canal.
    explanation: Identifies progenitors of ependymal lining cells as the origin of ependymal
      neoplasms.
  downstream:
  - target: ZFTA-RELA Fusion Formation
    description: Supratentorial neural stem cells transformed by ZFTA-RELA fusion give
      rise to supratentorial ependymoma.
    evidence:
    - reference: PMID:24553141
      reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: C11orf95-RELA fusion proteins translocated spontaneously to the nucleus
        to activate NF-κB target genes, and rapidly transformed neural stem cells--the
        cell of origin of ependymoma--to form these tumours in mice.
      explanation: Demonstrates in mice that the fusion transforms neural stem cells,
        the cell of origin, into ependymoma.
  - target: EZHIP Overexpression
    description: Hindbrain progenitors give rise to PFA ependymoma, which is defined by
      ectopic EZHIP overexpression.
    evidence:
    - reference: PMID:30923826
      reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as
        an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Recently, we reported overexpression of chromosome X open reading frame
        67 (CXorf67) as a hallmark of PFA ependymoma
      explanation: Establishes EZHIP overexpression as the hallmark lesion of the posterior
        fossa group A tumors arising from this progenitor compartment.
  - target: CpG Island Methylator Phenotype Silencing
    description: Hindbrain progenitors in poor-prognosis PFA tumors acquire a CpG island
      methylator phenotype.
  - target: Impaired Lineage Differentiation
    description: Transformed progenitors fail to complete neuronal-glial differentiation,
      establishing a tumor cellular hierarchy.
    evidence:
    - reference: PMID:32663469
      reference_title: Single-Cell RNA-Seq Reveals Cellular Hierarchies and Impaired Developmental
        Trajectories in Pediatric Ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Ependymomas are composed of a cellular hierarchy initiating from undifferentiated
        populations, which undergo impaired differentiation toward three lineages of neuronal-glial
        fate specification.
      explanation: Directly demonstrates that the transformed progenitor compartment gives
        rise to a differentiation-blocked cellular hierarchy.
- name: Impaired Lineage Differentiation
  description: >-
    Single-cell RNA sequencing shows that ependymomas are organized as a cellular
    hierarchy initiating from undifferentiated populations that undergo impaired
    differentiation toward three neuronal-glial lineages. The proportion of
    undifferentiated cells tracks with aggressiveness: favorable molecular groups
    are dominated by differentiated cells, whereas aggressive groups are enriched
    for undifferentiated populations.
  biological_processes:
  - preferred_term: cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030154
      label: cell differentiation
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  evidence:
  - reference: PMID:32663469
    reference_title: Single-Cell RNA-Seq Reveals Cellular Hierarchies and Impaired Developmental
      Trajectories in Pediatric Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ependymomas are composed of a cellular hierarchy initiating from undifferentiated
      populations, which undergo impaired differentiation toward three lineages of neuronal-glial
      fate specification.
    explanation: Establishes the differentiation-blocked cellular hierarchy underlying
      ependymoma.
  - reference: PMID:32663469
    reference_title: Single-Cell RNA-Seq Reveals Cellular Hierarchies and Impaired Developmental
      Trajectories in Pediatric Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While prognostically favorable groups of ependymoma predominantly harbor
      differentiated cells, aggressive groups are enriched for undifferentiated cell
      populations.
    explanation: Links the degree of differentiation block to prognosis across molecular
      groups.
  downstream:
  - target: Uncontrolled Tumor Cell Proliferation
    description: Retention of undifferentiated progenitor populations sustains tumor
      growth.
    evidence:
    - reference: PMID:32663469
      reference_title: Single-Cell RNA-Seq Reveals Cellular Hierarchies and Impaired Developmental
        Trajectories in Pediatric Ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: While prognostically favorable groups of ependymoma predominantly harbor
        differentiated cells, aggressive groups are enriched for undifferentiated cell
        populations.
      explanation: Links retained undifferentiated populations to the aggressive, proliferative
        molecular groups.
- name: ZFTA-RELA Fusion Formation
  description: >-
    The majority of supratentorial ependymomas harbor oncogenic fusions between
    RELA, the principal effector of canonical NF-kB signalling, and ZFTA
    (formerly C11orf95). These fusions arise by chromothripsis of chromosome
    11q13.1 — a single catastrophic chromosomal shattering and reassembly event
    rather than stepwise mutation. This explains how a tumor with an otherwise
    very low mutation burden acquires a potent driver.
  biological_processes:
  - preferred_term: chromatin organization
    modifier: ABNORMAL
    term:
      id: GO:0006325
      label: chromatin organization
  locations:
  - preferred_term: lateral ventricle
    term:
      id: UBERON:0002285
      label: telencephalic ventricle
  evidence:
  - reference: PMID:24553141
    reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Here we show that more than two-thirds of supratentorial ependymomas contain
      oncogenic fusions between RELA, the principal effector of canonical NF-κB signalling,
      and an uncharacterized gene, C11orf95. In each case, C11orf95-RELA fusions resulted
      from chromothripsis involving chromosome 11q13.1.'
    explanation: Establishes the frequency of the fusion in supratentorial ependymoma
      and chromothripsis as its mechanism of formation.
  - reference: PMID:29949764
    reference_title: A De Novo Mouse Model of C11orf95-RELA Fusion-Driven Ependymoma
      Identifies Driver Functions in Addition to NF-κB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The majority of supratentorial ependymomas (ST-ependymomas) have few mutations
      but frequently display chromothripsis of chromosome 11q that generates a fusion
      between C11orf95 and RELA
    explanation: Independently confirms the low mutation burden and chromothripsis-generated
      fusion in supratentorial ependymoma.
  downstream:
  - target: Constitutive NF-kB Pathway Activation
    description: The fusion protein translocates to the nucleus and activates NF-kB
      target genes.
    evidence:
    - reference: PMID:24553141
      reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: C11orf95-RELA fusion proteins translocated spontaneously to the nucleus
        to activate NF-κB target genes
      explanation: Shows the fusion protein directly drives NF-kB target gene activation.
- name: Constitutive NF-kB Pathway Activation
  conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
  description: >-
    ZFTA-RELA fusion proteins localize spontaneously to the nucleus and
    constitutively activate canonical NF-kB target gene transcription,
    independently of upstream inflammatory signalling. This is a rare example of
    a recurrent genetic lesion directly activating NF-kB in human cancer, since
    constitutive NF-kB signalling is common in tumors but pathway mutations are
    otherwise rare. Mouse modelling indicates that additional driver functions
    beyond NF-kB contribute to tumorigenesis.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  - preferred_term: regulation of DNA-templated transcription
    modifier: DYSREGULATED
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  evidence:
  - reference: PMID:24553141
    reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although constitutive NF-κB signalling is present in most human tumours,
      mutations in pathway members are rare, complicating efforts to understand and
      block aberrant NF-κB activity in cancer.
    explanation: Frames the ZFTA-RELA fusion as an unusual recurrent genetic activator
      of NF-kB, motivating its role as a driver lesion.
  downstream:
  - target: Uncontrolled Tumor Cell Proliferation
    description: NF-kB target gene programs drive proliferation and survival of transformed
      progenitors.
    evidence:
    - reference: PMID:29949764
      reference_title: A De Novo Mouse Model of C11orf95-RELA Fusion-Driven Ependymoma
        Identifies Driver Functions in Addition to NF-κB.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: These tumors display enhanced NF-κB signaling, suggesting that this aberrant
        signal is the principal mechanism of oncogenesis.
      explanation: Supports NF-kB signalling as the principal oncogenic output of the fusion,
        while the same study shows additional driver functions contribute.
- name: EZHIP Overexpression
  conforms_to: epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression
  description: >-
    Posterior fossa type A ependymomas overexpress EZHIP (also called CXorf67).
    Overexpression, not mutation, is the lesion: EZHIP is a normally
    germline-restricted protein whose ectopic expression in hindbrain progenitors
    is the hallmark of the PFA methylation class.
  locations:
  - preferred_term: fourth ventricle
    term:
      id: UBERON:0002422
      label: fourth ventricle
  evidence:
  - reference: PMID:30923826
    reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as
      an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Recently, we reported overexpression of chromosome X open reading frame
      67 (CXorf67) as a hallmark of PFA ependymoma
    explanation: Establishes EZHIP/CXorf67 overexpression as the hallmark lesion of PFA
      ependymoma.
  downstream:
  - target: PRC2 Catalytic Inhibition
    description: EZHIP protein binds and inhibits the PRC2 catalytic subunit EZH2.
    evidence:
    - reference: PMID:30923826
      reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as
        an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: showed that CXorf67 can interact with enhancer of zeste homolog 2 (EZH2),
        thereby inhibiting polycomb repressive complex 2 (PRC2)
      explanation: Links EZHIP overexpression to direct inhibition of PRC2 through EZH2.
- name: PRC2 Catalytic Inhibition
  conforms_to: epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression
  description: >-
    A short, highly conserved C-terminal peptide of EZHIP mimics the sequence of
    K27M-mutated histones and contacts the active site of the EZH2 subunit,
    blocking PRC2 methyltransferase activity. EZHIP therefore acts as an
    "oncohistone mimic", producing the same functional lesion as the H3 K27M
    mutation of diffuse midline glioma without any histone mutation.
  biological_processes:
  - preferred_term: facultative heterochromatin formation
    modifier: DECREASED
    term:
      id: GO:0140718
      label: facultative heterochromatin formation
  evidence:
  - reference: PMID:31086175
    reference_title: PFA ependymoma-associated protein EZHIP inhibits PRC2 activity
      through a H3 K27M-like mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we find that a conserved sequence in EZHIP is necessary and sufficient
      to inhibit PRC2 catalytic activity in vitro and in vivo. EZHIP directly contacts
      the active site of the EZH2 subunit in a mechanism similar to the H3 K27M oncohistone.
    explanation: Establishes the biochemical mechanism by which EZHIP inhibits PRC2 catalysis.
  downstream:
  - target: Global H3K27me3 Loss
    description: Loss of PRC2 catalytic activity prevents deposition and spreading of
      the H3K27me3 mark.
    evidence:
    - reference: PMID:31086175
      reference_title: PFA ependymoma-associated protein EZHIP inhibits PRC2 activity
        through a H3 K27M-like mechanism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Furthermore, expression of H3 K27M or EZHIP in cells promotes similar
        chromatin profiles: loss of broad H3K27me3 domains, but retention of H3K27me3
        at CpG islands.'
      explanation: Links PRC2 inhibition directly to the loss of broad H3K27me3 domains.
- name: Global H3K27me3 Loss
  conforms_to: epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression
  description: >-
    PFA ependymomas are characterized by global depletion of the repressive
    H3K27me3 mark, with loss of broad domains but retention at CpG islands. The
    resulting de-repression of PRC2 target genes is the defining epigenetic
    lesion of the group and is used diagnostically as an immunohistochemical
    surrogate.
  biological_processes:
  - preferred_term: negative regulation of gene expression, epigenetic
    modifier: DECREASED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  evidence:
  - reference: PMID:30923826
    reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as
      an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PFA tumors are mainly diagnosed in infants and young children, show a poor
      prognosis, and are characterized by a lack of the repressive histone H3 lysine
      27 trimethylation (H3K27me3) mark.
    explanation: Documents global H3K27me3 loss as the defining feature of PFA tumors.
  downstream:
  - target: Impaired Lineage Differentiation
    description: De-repression of PRC2 target neurodevelopmental genes prevents orderly
      lineage maturation.
- name: CpG Island Methylator Phenotype Silencing
  conforms_to: epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression
  description: >-
    Poor-prognosis hindbrain ependymomas independently exhibit a CpG island
    methylator phenotype (CIMP). Transcriptional silencing driven by CpG
    methylation converges on the same Polycomb repressive complex 2 targets,
    reinforcing the differentiation block. This epigenetic program, rather than
    recurrent point mutation, drives tumorigenesis — these tumors have an
    extremely low mutation rate with no significant recurrent somatic single
    nucleotide variants.
  biological_processes:
  - preferred_term: negative regulation of gene expression, epigenetic
    modifier: DYSREGULATED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  evidence:
  - reference: PMID:24553142
    reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas
      of infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Transcriptional silencing driven by CpG methylation converges exclusively
      on targets of the Polycomb repressive complex 2 which represses expression of
      differentiation genes through trimethylation of H3K27.
    explanation: Establishes convergence of CIMP-driven silencing on PRC2 targets in
      poor-prognosis hindbrain ependymoma.
  - reference: PMID:24553142
    reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas
      of infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-genome and whole-exome sequencing of 47 hindbrain ependymomas reveals
      an extremely low mutation rate, and zero significant recurrent somatic single
      nucleotide variants.
    explanation: Documents the very low mutational burden, supporting an epigenetic rather
      than mutational driver mechanism.
  downstream:
  - target: Impaired Lineage Differentiation
    description: De-repression and dysregulation of PRC2 target differentiation genes
      blocks normal lineage maturation.
    evidence:
    - reference: PMID:24553142
      reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas
        of infancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Transcriptional silencing driven by CpG methylation converges exclusively
        on targets of the Polycomb repressive complex 2 which represses expression of
        differentiation genes through trimethylation of H3K27.
      explanation: Shows the silencing converges on PRC2-repressed differentiation genes,
        the mechanistic basis of the differentiation block.
  - target: Uncontrolled Tumor Cell Proliferation
    description: Failure to silence differentiation programs maintains progenitors in
      a proliferative state.
    evidence:
    - reference: PMID:24553142
      reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas
        of infancy.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: CpG island methylator phenotype-positive hindbrain ependymomas are responsive
        to clinical drugs that target either DNA or H3K27 methylation both in vitro and
        in vivo.
      explanation: Pharmacological reversal of the methylation lesion restrains these tumors,
        showing the epigenetic block is what sustains their growth.
- name: NF2 Loss in Spinal Ependymoma
  conforms_to: evading_growth_suppressors#Tumor Suppressor Inactivation
  description: >-
    Classic spinal ependymoma is characterized by biallelic inactivation of the
    NF2 tumor suppressor on chromosome 22q, arising from a germline or somatic
    NF2 mutation combined with loss of chromosome 22q. NF2 encodes merlin, a
    membrane-cytoskeleton scaffold that restrains growth signalling; its loss is
    the only recurrent genetic event in this methylation class.
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:38265489
    reference_title: Transcriptomic and epigenetic dissection of spinal ependymoma (SP-EPN)
      identifies clinically relevant subtypes enriched for tumors with and without NF2
      mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The only known recurrent genetic events in SP-EPN are loss of chromosome
      22q and NF2 mutations
    explanation: Establishes 22q loss and NF2 mutation as the recurrent genetic events in
      spinal ependymoma.
  downstream:
  - target: Uncontrolled Tumor Cell Proliferation
    description: Loss of merlin-mediated growth suppression permits progenitor expansion.
    evidence:
    - reference: PMID:38265489
      reference_title: Transcriptomic and epigenetic dissection of spinal ependymoma (SP-EPN)
        identifies clinically relevant subtypes enriched for tumors with and without NF2
        mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The only known recurrent genetic events in SP-EPN are loss of chromosome
        22q and NF2 mutations
      explanation: Identifies NF2 loss as the sole recurrent driver lesion in this compartment,
        implicating it in tumor cell outgrowth.
- name: MYCN Amplification in Spinal Ependymoma
  conforms_to: sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion
  description: >-
    A rare spinal ependymal tumor subgroup identified by DNA methylation
    profiling carries MYCN amplification in all reported cases. MYCN
    amplification drives an aggressive phenotype with spinal cord infiltration
    and CNS dissemination, in contrast to the generally good prognosis of other
    spinal ependymal tumors.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we describe a new and relatively rare subgroup of spinal ependymal
      tumors identified using DNA methylation profiling that is distinct from other
      molecular subgroups of ependymoma.
    explanation: Establishes MYCN-amplified spinal ependymoma as a distinct methylation-defined
      subgroup.
  downstream:
  - target: CNS Dissemination
    description: MYCN-amplified spinal tumors infiltrate the spinal cord and disseminate
      through the CNS.
    evidence:
    - reference: PMID:31414211
      reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: However, their treatment can be challenging if infiltration of the spinal
        cord or dissemination throughout the central nervous system (CNS) occurs and,
        in these cases, clinical outcome remains poor.
      explanation: Links spinal cord infiltration and CNS dissemination to poor clinical
        outcome.
- name: Uncontrolled Tumor Cell Proliferation
  conforms_to: evading_growth_suppressors#Unrestrained Proliferation
  description: >-
    Convergent consequence of the compartment-specific driver lesions. Whether
    initiated by fusion-driven NF-kB transcription, PRC2 inhibition, NF2 loss, or
    MYCN amplification, transformed ependymal progenitors proliferate without
    normal growth restraint and form an expanding intraventricular or
    intramedullary mass.

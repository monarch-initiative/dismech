    evidence_source: HUMAN_CLINICAL
    snippet: While prognostically favorable groups of ependymoma predominantly harbor differentiated cells, aggressive groups are enriched for undifferentiated cell populations.
    explanation: Links the degree of differentiation block to prognosis across molecular groups.
  downstream:

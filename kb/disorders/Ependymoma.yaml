genetic:
- name: ZFTA
  association: Fusion
  notes: >-
    ZFTA (formerly C11orf95) fusion, most commonly ZFTA-RELA, defines the
    dominant supratentorial ependymoma type and is present in more than
    two-thirds of supratentorial cases. Fusions arise by chromothripsis of
    11q13.1. Non-RELA ZFTA fusion partners (including NCOA1/2) produce the same
    histomolecular entity but with marked histopathological heterogeneity.
  evidence:
  - reference: PMID:34389065
    reference_title: 'Supratentorial non-RELA, ZFTA-fused ependymomas: a comprehensive
      phenotype genotype correlation highlighting the number of zinc fingers in ZFTA-NCOA1/2
      fusions.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This modification reinforces the idea that supratentorial-ependymomas exhibiting
      fusion that implicates the C11orf95 (now called ZFTA) gene with or without the
      RELA gene, represent the same histomolecular entity.
    explanation: Confirms ZFTA fusions with or without RELA define a single histomolecular
      entity.
- name: RELA
  association: Fusion
  notes: >-
    RELA, the principal effector of canonical NF-kB signalling, is the most
    frequent ZFTA fusion partner. The resulting fusion protein enters the nucleus
    spontaneously and constitutively activates NF-kB target genes.
  evidence:
  - reference: PMID:24553141
    reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data identify a highly recurrent genetic alteration of RELA in human
      cancer
    explanation: Establishes RELA fusion as a highly recurrent genetic alteration in this
      tumor.
- name: YAP1
  association: Fusion
  notes: >-
    YAP1 fusion defines the second, less common supratentorial ependymoma type,
    recognized as a distinct subtype in WHO CNS5. YAP1-fused tumors generally
    affect younger children and carry a better prognosis than ZFTA-fused tumors.
  evidence:
  - reference: PMID:25965575
    reference_title: Molecular Classification of Ependymal Tumors across All CNS Compartments,
      Histopathological Grades, and Age Groups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two supratentorial subgroups are characterized by prototypic fusion genes
      involving RELA and YAP1, respectively.
    explanation: Identifies YAP1 fusion as defining a distinct supratentorial molecular
      subgroup.
- name: EZHIP
  association: Overexpression
  notes: >-
    EZHIP (also known as CXORF67) is highly expressed in PFA ependymoma and acts
    as a peptidyl PRC2 inhibitor, an "oncohistone mimic" functionally analogous
    to the H3 K27M mutation of diffuse midline glioma. EZHIP overexpression, not
    mutation, is the driver.
  evidence:
  - reference: PMID:31086175
    reference_title: PFA ependymoma-associated protein EZHIP inhibits PRC2 activity
      through a H3 K27M-like mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Posterior fossa type A (PFA) ependymomas exhibit very low H3K27 methylation
      and express high levels of EZHIP (Enhancer of Zeste Homologs Inhibitory Protein,
      also termed CXORF67).
    explanation: Documents EZHIP overexpression and low H3K27 methylation as features
      of PFA ependymoma.
- name: NF2
  association: Loss of Function
  notes: >-
    Biallelic NF2 inactivation (22q12), through germline or somatic mutation
    combined with chromosome 22q loss, is the recurrent genetic event in classic
    spinal ependymoma. Germline NF2 mutation causes NF2-related schwannomatosis,
    the principal hereditary predisposition to ependymoma.
  evidence:
  - reference: PMID:38265489
    reference_title: Transcriptomic and epigenetic dissection of spinal ependymoma (SP-EPN)
      identifies clinically relevant subtypes enriched for tumors with and without NF2
      mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The only known recurrent genetic events in SP-EPN are loss of chromosome
      22q and NF2 mutations
    explanation: Establishes NF2 mutation and 22q loss as the recurrent genetic events in
      spinal ependymoma.
- name: MYCN
  association: Amplification
  notes: >-
    MYCN amplification defines the aggressive spinal ependymoma type added in WHO
    CNS5, and was present in all cases of the original defining cohort. Tumors
    were histologically anaplastic (WHO grade III) in ten of thirteen cases.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The histological diagnosis was anaplastic ependymoma (WHO Grade III) in
      ten cases and classic ependymoma (WHO Grade II) in three cases.
    explanation: Documents the histological grade distribution of MYCN-amplified spinal
      ependymoma.
- name: Chromosome 1q
  association: Gain
  notes: >-
    Gain of chromosome 1q is the best-established adverse copy-number biomarker in
    intracranial ependymoma, correlating with pediatric age and functioning as an
    independent prognostic marker. It was evaluated prospectively as a
    stratification variable in the COG ACNS0121 trial.
  evidence:
  - reference: PMID:16609018
    reference_title: Identification of gains on 1q and epidermal growth factor receptor
      overexpression as independent prognostic markers in intracranial ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: gain of 1q25 as determined by fluorescence in situ hybridization represented
      an independent prognostic marker
    explanation: Establishes 1q25 gain as an independent prognostic marker in intracranial
      ependymoma, supporting the adverse-biomarker claim.
- name: CDKN2A
  association: Homozygous Deletion
  notes: >-
    Homozygous deletion of CDKN2A/CDKN2B is an adverse copy-number marker in
    intracranial ependymoma, used together with 1q gain and age at diagnosis in
    molecular staging schemes that complement histopathological classification.
  evidence:
  - reference: PMID:20516456
    reference_title: Molecular staging of intracranial ependymoma in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: age at diagnosis, gain of 1q, and homozygous deletion of CDKN2A comprised
      the most powerful independent indicators of unfavorable prognosis
    explanation: Directly identifies homozygous CDKN2A deletion as one of the most powerful
      independent adverse prognostic indicators in intracranial ependymoma.
- name: EGFR
  association: Overexpression
  notes: >-
    EGFR at 7p11.2 shows frequent gains and high-level amplification in
    intracranial ependymoma, and protein overexpression by immunohistochemistry
    is an independent adverse prognostic marker that stratifies grade 2 tumors
    into distinct risk groups.
  evidence:
  - reference: PMID:16609018
    reference_title: Identification of gains on 1q and epidermal growth factor receptor
      overexpression as independent prognostic markers in intracranial ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: EGFR protein status subdivides intracranial grade II ependymomas into two
      different risk groups
    explanation: Establishes EGFR protein overexpression as a prognostic stratifier in
      intracranial ependymoma.
environmental:
- name: High-dose ionizing radiation
  description: >-
    High-dose ionizing radiation is the only established environmental risk factor
    for childhood CNS tumors including ependymoma. Investigations of other
    environmental aetiologies, including dietary N-nitroso compounds, have not
    produced consistent associations, and ependymoma is otherwise largely
    sporadic.
  presence: PRESENT
  evidence:
  - reference: PMID:16142778
    reference_title: 'Central nervous system tumours in children: epidemiology and risk
      factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whilst high dose ionising radiation is an established risk factor for this
      group of tumours, reported associations with dietary N-nitroso compounds have
      not been consistent
    explanation: Establishes high-dose ionizing radiation as the only confirmed environmental
      risk factor for childhood CNS tumors.
inheritance:
- name: Autosomal Dominant
  description: >-
    Most ependymomas are sporadic. The principal hereditary predisposition is
    NF2-related schwannomatosis (formerly neurofibromatosis type 2), an autosomal
    dominant tumor-predisposition syndrome caused by germline NF2 mutation on
    chromosome 22, in which spinal ependymomas are a common tumor. Fifty to sixty
    percent of patients represent de novo mutations and up to a third of those are
    mosaic, which complicates genetic testing and counseling.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23931824
    reference_title: 'Neurofibromatosis type 2 (NF2): diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neurofibromatosis type 2 (NF2) is an autosomal dominant inherited tumor
      predisposition syndrome caused by mutations in the NF2 gene on chromosome 22.
    explanation: Establishes the autosomal dominant inheritance and genetic basis of the
      predisposition syndrome.
  - reference: PMID:23931824
    reference_title: 'Neurofibromatosis type 2 (NF2): diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cranial and spinal meningiomas and spinal ependymomas are other common tumors.
    explanation: Documents spinal ependymoma as a common tumor in NF2-related schwannomatosis.
animal_models:
- species: Mouse (Mus musculus)
  genotype: C11orf95-RELA (ZFTA-RELA) fusion expressed in periventricular neural stem
    cells
  category: Transgenic
  description: >-
    De novo mouse model in which the C11orf95-RELA fusion is introduced into
    periventricular neural stem cells, generating supratentorial ependymoma. The
    model established that the fusion is sufficient to drive tumorigenesis in vivo
    and identified driver functions beyond NF-kB signalling. Limitation: it models
    only the supratentorial ZFTA-fused compartment and does not recapitulate PFA
    biology, for which EZHIP is eutherian-specific.
  genes:
  - preferred_term: RELA
    term:
      id: hgnc:9955
      label: RELA
  associated_phenotypes:
  - Supratentorial ependymoma
  evidence:
  - reference: PMID:29949764
    reference_title: A De Novo Mouse Model of C11orf95-RELA Fusion-Driven Ependymoma
      Identifies Driver Functions in Addition to NF-κB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We show that RELAFUS drives ST-ependymoma formation from periventricular
      neural stem cells in mice
    explanation: Demonstrates that the fusion alone initiates supratentorial ependymoma
      from periventricular neural stem cells in vivo.
treatments:
- name: Maximal Safe Surgical Resection
  description: >-
    Complete surgical resection is the single most important prognostic and
    therapeutic intervention across all ependymoma compartments and molecular
    groups. A complete resection should be attempted whenever possible, at first
    surgery or at reoperation.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The majority of studies have shown a major impact of extent of resection;
      thus, a complete resection must be performed, whenever possible, at first surgery
      or at reoperation.'
    explanation: Establishes extent of resection as the dominant modifiable prognostic
      factor and complete resection as the surgical goal.
- name: Conformal Radiation Therapy
  description: >-
    Focal conformal radiotherapy is recommended for grade 3 tumors and for
    incompletely resected grade 2 tumors. In the Children's Oncology Group
    ACNS0121 trial, immediate postoperative conformal radiation therapy was
    delivered to a cumulative dose of 59.4 Gy with a 1.0-cm clinical target
    volume margin.
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: MAXO:0000014
      label: radiation therapy
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Conformal radiotherapy is recommended for grade 3 or incompletely resected
      grade II tumors.
    explanation: States the indication for conformal radiotherapy by grade and extent
      of resection.
  - reference: PMID:30811284
    reference_title: Conformal Radiation Therapy for Pediatric Ependymoma, Chemotherapy
      for Incompletely Resected Ependymoma, and Observation for Completely Resected,
      Supratentorial Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CRT was administered with a 1.0-cm clinical target volume margin. The cumulative
      total dose was 59.4 Gy
    explanation: Documents the conformal radiotherapy dose and margin used in the ACNS0121
      cooperative group trial.
- name: Proton Beam Radiation Therapy
  description: >-
    Proton therapy is increasingly used, especially in children, to reduce the
    dose delivered to developing normal brain and thereby lower the risk of
    neurocognitive and endocrine late effects.
  treatment_term:
    preferred_term: proton beam radiation therapy
    term:
      id: NCIT:C66897
      label: Proton Beam Radiation Therapy
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Proton therapy is increasingly employed especially in children to reduce
      the risk of neurocognitive and endocrine sequelae.
    explanation: States the rationale and paediatric preference for proton therapy.
- name: Craniospinal Irradiation
  description: >-
    Craniospinal irradiation is reserved for documented metastatic
    (leptomeningeal) disease rather than being used routinely, because of its
    substantial neurocognitive and growth toxicity.
  treatment_term:
    preferred_term: craniospinal irradiation
    term:
      id: NCIT:C116437
      label: Craniospinal Irradiation
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Craniospinal irradiation is reserved for metastatic disease.
    explanation: Defines metastatic disease as the indication for craniospinal irradiation.
- name: Salvage Chemotherapy
  description: >-
    Cytotoxic chemotherapy has no established role as primary therapy for
    ependymoma and does not improve survival when added to surgery and radiation.
    It is used as salvage treatment for patients failing surgery and
    radiotherapy, and to delay irradiation in infants or after subtotal
    resection.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: MAXO:0000647
      label: chemotherapy
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Chemotherapy is not useful as primary treatment and is commonly employed
      as salvage treatment for patients failing surgery and radiotherapy.
    explanation: Establishes that chemotherapy is a salvage rather than primary modality.
  - reference: PMID:24553142
    reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas
      of infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Current standard therapy comprises surgery and radiation, but not cytotoxic
      chemotherapy as it does not further increase survival.
    explanation: Confirms that cytotoxic chemotherapy does not add a survival benefit
      to surgery and radiation.
- name: Locoregional CAR T-Cell Therapy
  description: >-
    Experimental, not standard of care. Because PFA ependymomas and their
    recurrences sit adjacent to and are bathed by cerebrospinal fluid,
    intrathecal delivery of chimeric antigen receptor T cells against EPHA2, HER2
    and IL13Rα2 bypasses the blood-brain barrier. Validated to date only in mouse
    xenograft models.
  treatment_term:
    preferred_term: cell therapy
    term:
      id: MAXO:0000058
      label: pharmacotherapy
  evidence:
  - reference: PMID:32341580
    reference_title: Locoregional delivery of CAR T cells to the cerebrospinal fluid
      for treatment of metastatic medulloblastoma and ependymoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We validate intrathecal delivery of EPHA2, HER2 and interleukin 13 receptor
      α2 chimeric antigen receptor T cells as an effective treatment for primary, metastatic
      and recurrent group 3 medulloblastoma and PFA ependymoma xenografts in mouse models.
    explanation: Preclinical mouse-xenograft evidence for intrathecal CAR T-cell therapy
      in PFA ependymoma; not yet clinically established.
diagnosis:
- name: DNA methylation array profiling
  description: >-
    Genome-wide DNA methylation profiling is the reference method for assigning
    an ependymal tumor to its molecular group and is definitional for the WHO
    CNS5 types. It is not merely confirmatory: in a series of histopathologically
    diagnosed ependymoma variants, integrated diagnosis had to be revised in more
    than a third of cases once methylation class was taken into account.
  diagnosis_term:
    preferred_term: methylation testing
    term:
      id: MAXO:0001616
      label: methylation testing
  evidence:
  - reference: PMID:31679042
    reference_title: Molecular characterization of histopathological ependymoma variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, integrated diagnosis had to be changed in 35.6% of cases as compared
      to the initial diagnosis.
    explanation: Quantifies how often methylation profiling overturns a purely histopathological
      ependymoma diagnosis, establishing it as the reference method.
- name: Surrogate immunohistochemistry for molecular group
  description: >-
    Where methylation profiling is unavailable, immunohistochemistry serves as a
    practical surrogate: L1CAM for ZFTA fusion in supratentorial tumors, and loss
    of H3K27me3 or EZHIP overexpression for posterior fossa group A.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: MAXO:0000144
      label: histological examination
  markers: L1CAM, H3K27me3, EZHIP
  evidence:
  - reference: PMID:34812989
    reference_title: Molecular subtyping of ependymoma and prognostic impact of Ki-67.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surrogate IHC markers revealed high concordance rates between L1CAM and
      ZFTA-fusion and H3K27me3 loss or EZHIP overexpression was used for PFA-EPNs.
    explanation: Validates L1CAM, H3K27me3 loss and EZHIP as immunohistochemical surrogates
      for the defining molecular alterations.
- name: Ki-67 proliferation index
  description: >-
    A Ki-67 labelling index with a 7% cut-off separates ependymomas into two
    prognostic grades across all anatomical compartments, and was the only
    independent prognostic factor in a 141-tumor reclassified cohort.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: MAXO:0000144
      label: histological examination
  markers: Ki-67
  evidence:
  - reference: PMID:34812989
    reference_title: Molecular subtyping of ependymoma and prognostic impact of Ki-67.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 7% cut-off of Ki-67 was sufficient to classify EPNs into two-tiered grades
      at all anatomical locations.
    explanation: Establishes the Ki-67 7% cut-off as a grading and prognostic discriminator.
- name: Diagnostic histology with MRI and CSF staging
  description: >-
    Diagnosis requires histological confirmation showing perivascular
    pseudorosettes with GFAP and EMA positivity. MRI of brain and whole spine
    plus cerebrospinal fluid cytology stage leptomeningeal dissemination, which
    is present in up to 10% of intracranial cases at diagnosis and determines
    whether craniospinal irradiation is indicated.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary
      review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis requires histologic confirmation, aided by MRI and cerebrospinal
      fluid analysis, with dissemination present in up to 10% of cases at diagnosis.
    explanation: Establishes the combined histological, MRI and CSF workup and its staging
      role.
progression:
- phase: Presentation and primary therapy
  age_range: Median 5 years for intracranial disease; adults for spinal disease
  notes: >-
    Onset is typically subacute to chronic, culminating in a raised intracranial
    pressure crisis for posterior fossa tumors. Achieving gross total resection at
    the initial operation is the critical intervention window, since extent of
    resection is the dominant modifiable prognostic factor.
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary
      review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Maximal safe surgical resection is the cornerstone of treatment.
    explanation: Identifies primary resection as the decisive therapeutic step at presentation.
- phase: Long-term outcome and recurrence
  notes: >-
    Recurrences are predominantly local rather than disseminated. Ten-year overall
    survival across all ependymoma ranges from 50% to 75% and is governed by
    extent of resection, molecular subtype and age; posterior fossa group B has an
    excellent outcome whereas group A with chromosome 1q gain does poorly.
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary
      review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ten-year overall survival ranges from 50% to 75%, influenced by extent of
      resection, molecular subtype, and age.
    explanation: Provides the long-term survival range and the factors that modify it.
disease_term:
  preferred_term: ependymoma
  term:
    id: MONDO:0016698
    label: ependymoma
classifications:
  icdo_morphology:
    classification_value: Glioma
    evidence:
    - reference: PMID:30855832
      reference_title: Ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Ependymomas are glial tumors originating from ependymal cells
      explanation: Confirms the glial lineage underlying the Glioma ICD-O morphology assignment.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:30855832
      reference_title: Ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Ependymomas are glial tumors originating from ependymal cells that line
        the ventricular system of the brain and the central canal of the spinal cord.
      explanation: Establishes ependymoma as a central nervous system glial neoplasm, placing
        it in the oncology domain.
notes: >-
  WHO CNS5 (2021) classifies ependymal tumors first by anatomical compartment and
  then by molecular group, and abandoned the poorly reproducible
  classic-versus-anaplastic histological grading distinction. This entry is
  organized around that compartment-plus-molecular-group axis, with has_subtypes
  following the WHO CNS5 types rather than the legacy histological variants
  (cellular, papillary, clear cell, tanycytic) that remain as children of
  MONDO:0016698 in the ontology. WHO CNS5 recognizes 10 ependymoma entities in
  total; the eight captured here omit supratentorial and posterior fossa
  subependymoma, which are grouped under the single Subependymoma subtype.

  Grading remains unsettled: cIMPACT-NOW update 7 judged the data insufficient to
  assign grade to the molecularly defined ependymoma types, while recommending WHO
  grade 2 for myxopapillary ependymoma (an upgrade from its former grade 1).

  Curation provenance: drafted from an OpenScientist deep-research report
  (research/Ependymoma-deep-research-openscientist.md, 10 iterations, 75 papers
  reviewed). Every PMID cited here was independently re-fetched through
  just fetch-reference and every snippet verified as an exact substring of the
  cached record. A number of PMIDs appearing in the research report were not used
  because they could not be independently corroborated.

  Known extension points: a datasets section (the methylation cohorts underpinning
  the molecular groups were not added because no accession could be verified from
  the cached records); a clinical_trials section (ACNS0121 is described under
  treatments but not yet modelled as a trial); per-molecular-group survival figures
  beyond the overall 10-year range recorded under progression; and 6q loss as an
  additional adverse marker in PFA.

  The eight has_subtypes entries deliberately carry no subtype_term binding. MONDO
  does have exact terms for all of them (MONDO:0956990 ST-ZFTA, MONDO:0956991
  ST-YAP1, MONDO:0956992 PFA, MONDO:0956993 PFB, MONDO:0003473 SP-EPN,
  MONDO:0850338 SP-MYCN, MONDO:0016699 myxopapillary, MONDO:0007667
  subependymoma), and all eight are genuine rdfs:subClassOf descendants of
  MONDO:0000001. They are omitted only because the DiseaseOrSubtypeTerm dynamic
  enum membership cache does not currently contain them — it holds 956 entries and
  lacks even MONDO:0016698, this entry's own disease_term. Binding them requires
  extending that cache, which is a separate change.

  Nystagmus is reported as an ependymoma phenotype in the deep-research report but
  is deliberately omitted here: no cached reference states it, and the nearest
  cached text gives vertigo rather than nystagmus. It should be added only once a
  citable source is available.

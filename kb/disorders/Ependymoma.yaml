name: Ependymoma
creation_date: '2026-07-28T16:00:00Z'
updated_date: '2026-07-28T16:00:00Z'
description: >-
  Ependymoma is a glial neoplasm of ependymal / radial-glial lineage that arises
  along the neuraxis — in the supratentorial brain, the posterior fossa, or the
  spinal cord. It accounts for roughly 2-3% of primary CNS tumors in adults and
  up to 10% in children, and is one of the more common pediatric brain tumors.
  Its defining biological feature is that, unlike most adult gliomas, it carries
  very few recurrent point mutations; instead it is driven by compartment-specific
  fusion oncogenes and epigenetic reprogramming. Under the 5th edition of the WHO
  Classification of Tumours of the Central Nervous System (WHO CNS5, 2021),
  ependymal tumors are therefore classified first by anatomical compartment and
  then by molecular group, because methylome profiling showed that
  compartment-specific groups are biologically distinct. Supratentorial tumors are
  defined by ZFTA (formerly C11orf95) or YAP1 fusions; posterior fossa tumors are
  split into group A (PFA) and group B (PFB) by methylation class or the H3 K27me3
  immunohistochemical surrogate; spinal tumors are frequently defined by NF2 loss,
  except for an aggressive MYCN-amplified class. WHO CNS5 dropped the
  classic-versus-anaplastic distinction because tumor grade correlated poorly with
  survival. Histologically, ependymomas are recognized by perivascular
  pseudorosettes and, less commonly, true ependymal rosettes. Clinical
  presentation depends on location: posterior fossa tumors obstruct cerebrospinal
  fluid pathways and cause hydrocephalus, supratentorial tumors present with
  seizures or focal deficits, and spinal tumors cause back pain and sensorimotor
  deficits. Maximal safe surgical resection is the cornerstone of treatment,
  followed by focal conformal radiotherapy for most grade 2 and 3 tumors;
  cytotoxic chemotherapy has no established role as primary therapy. Extent of
  resection and molecular group are the strongest prognostic determinants.

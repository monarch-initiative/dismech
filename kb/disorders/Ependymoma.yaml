  rate_denominator: PERSON_YEARS
  notes: >-
    Myxopapillary ependymoma has an annual incidence of 0.6 to 1.0 cases per
    1 million person-years (0.06-0.10 per 100,000 person-years), with a higher
    frequency in men and a peak in young adults aged 20-30 years.
  evidence:
  - reference: PMID:38074692
    reference_title: 'Spinal ependymoma in adults: from molecular advances to new treatment perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: They are rare tumors with an incidence of 0.6 – 1.0 cases per 1 million person-years and a higher frequency in men
    explanation: Provides the annual incidence rate of myxopapillary ependymoma per million person-years.
biochemical:
- name: H3K27me3 Nuclear Expression
  presence: DECREASED
  subtypes:
  - PFA
  context: >-
    Immunohistochemical assessment of histone H3 lysine 27 trimethylation in
    posterior fossa group A ependymoma; global loss of nuclear H3K27me3
    identifies PFA.
  evidence:
  - reference: PMID:34812989
    reference_title: Molecular subtyping of ependymoma and prognostic impact of Ki-67.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surrogate IHC markers revealed high concordance rates between L1CAM and ZFTA-fusion and H3K27me3 loss or EZHIP overexpression was used for PFA-EPNs.
    explanation: Establishes nuclear H3K27me3 loss as a high-concordance surrogate immunohistochemical biomarker for PFA ependymoma.
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

    reflecting microlumen formation in ependymal differentiation.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histological re-evaluation in five primary tumors and seven relapses showed characteristic histological features of ependymoma, namely pseudorosettes, GFAP- and EMA positivity.
    explanation: Documents EMA positivity as a characteristic immunophenotypic feature of ependymoma.
- name: HOXB13 Nuclear Expression
  presence: ELEVATED
  subtypes:
  - Myxopapillary
  context: >-
    Strong nuclear immunohistochemical expression characteristic of spinal
    myxopapillary ependymoma reflecting developmental cauda equina/filum
    terminale transcriptional identity.
  evidence:
  - reference: PMID:38074692
    reference_title: 'Spinal ependymoma in adults: from molecular advances to new treatment perspectives.'
    supports: SUPPORT
    evidence_source: OTHER

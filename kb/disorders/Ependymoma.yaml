    snippet: Since this tumor displays HOXB13 upregulation, the immunohistochemical detection of this protein may be used in routine practice for the distinction from other tumor types
    explanation: Establishes HOXB13 upregulation and immunohistochemical detection as a diagnostic marker for spinal myxopapillary ependymoma.
animal_models:
- species: Mouse (Mus musculus)
  genotype: C11orf95-RELA (ZFTA-RELA) fusion expressed in periventricular neural stem cells
  category: Transgenic
  description: >-
    De novo mouse model in which the C11orf95-RELA fusion is introduced into
    periventricular neural stem cells, generating supratentorial ependymoma. The
    model established that the fusion is sufficient to drive tumorigenesis in vivo
    and identified driver functions beyond NF-kB signalling. Limitation: it models
    only the supratentorial ZFTA-fused compartment and does not recapitulate PFA
    biology, for which EZHIP is eutherian-specific.
  genes:
  - preferred_term: RELA
    term:
      id: hgnc:9955
      label: RELA
  associated_phenotypes:
  - Supratentorial ependymoma
  evidence:
  - reference: PMID:29949764
    reference_title: A De Novo Mouse Model of C11orf95-RELA Fusion-Driven Ependymoma Identifies Driver Functions in Addition to NF-κB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We show that RELAFUS drives ST-ependymoma formation from periventricular neural stem cells in mice
    explanation: Demonstrates that the fusion alone initiates supratentorial ependymoma from periventricular neural stem cells in vivo.
treatments:
- name: Maximal Safe Surgical Resection
  description: >-
    Complete surgical resection is the single most important prognostic and
    therapeutic intervention across all ependymoma compartments and molecular
    groups. A complete resection should be attempted whenever possible, at first
    surgery or at reoperation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Uncontrolled Tumor Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Gross total surgical cytoreduction removes the proliferating tumor mass.
    evidence:
    - reference: PMID:35384591
      reference_title: 'Ependymoma: Evaluation and Management Updates.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: 'The majority of studies have shown a major impact of extent of resection; thus, a complete resection must be performed, whenever possible, at first surgery or at reoperation.'
      explanation: Complete surgical resection removes the proliferating tumor mass and is the primary determinant of outcome.
  - target: Cerebrospinal Fluid Pathway Obstruction
    treatment_effect: INHIBITS
    description: >-
      Resection of intraventricular posterior fossa or supratentorial tumor
      restores cerebrospinal fluid outflow and relieves obstructive
      hydrocephalus.
    evidence:
    - reference: PMID:40556668
      reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Maximal safe surgical resection is the cornerstone of treatment.
      explanation: Resection of intracranial intraventricular ependymoma relieves mass effect and CSF pathway obstruction.
  - target: Intramedullary Spinal Cord Tract Compression
    treatment_effect: INHIBITS
    description: >-
      Microsurgical resection along the tumor-cord cleavage plane decompresses
      adjacent ascending and descending spinal tracts.
    evidence:
    - reference: PMID:38074692
      reference_title: 'Spinal ependymoma in adults: from molecular advances to new treatment perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Treatment involves primarily surgical resection, aiming at maximal safe resection.
      explanation: Maximal safe surgical resection is the primary treatment for spinal ependymoma to decompress the spinal cord.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'The majority of studies have shown a major impact of extent of resection; thus, a complete resection must be performed, whenever possible, at first surgery or at reoperation.'
    explanation: Establishes extent of resection as the dominant modifiable prognostic factor and complete resection as the surgical goal.
- name: Conformal Radiation Therapy
  description: >-
    Focal conformal radiotherapy is recommended for grade 3 tumors and for
    incompletely resected grade 2 tumors. In the Children's Oncology Group
    ACNS0121 trial, immediate postoperative conformal radiation therapy was
    delivered to a cumulative dose of 59.4 Gy with a 1.0-cm clinical target
    volume margin.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Uncontrolled Tumor Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Focal ionizing radiation induces DNA damage and halts residual tumor cell
      proliferation in the resection bed.
    evidence:
    - reference: PMID:35384591
      reference_title: 'Ependymoma: Evaluation and Management Updates.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Conformal radiotherapy is recommended for grade 3 or incompletely resected grade II tumors.
      explanation: Conformal radiotherapy suppresses local tumor proliferation in high-grade or subtotally resected ependymoma.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Conformal radiotherapy is recommended for grade 3 or incompletely resected grade II tumors.
    explanation: States the indication for conformal radiotherapy by grade and extent of resection.
  - reference: PMID:30811284
    reference_title: Conformal Radiation Therapy for Pediatric Ependymoma, Chemotherapy for Incompletely Resected Ependymoma, and Observation for Completely Resected, Supratentorial Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CRT was administered with a 1.0-cm clinical target volume margin. The cumulative total dose was 59.4 Gy
    explanation: Documents the conformal radiotherapy dose and margin used in the ACNS0121 cooperative group trial.
- name: Proton Beam Radiation Therapy
  description: >-
    Proton therapy is increasingly used, especially in children, to reduce the
    dose delivered to developing normal brain and thereby lower the risk of
    neurocognitive and endocrine late effects.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: proton beam radiation therapy
    term:
      id: NCIT:C66897
      label: Proton Beam Radiation Therapy
  target_mechanisms:
  - target: Uncontrolled Tumor Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Delivers focal radiation cytotoxicity to proliferating tumor cells while
      sparing surrounding developing brain parenchyma.
    evidence:
    - reference: PMID:35384591
      reference_title: 'Ependymoma: Evaluation and Management Updates.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Proton therapy is increasingly employed especially in children to reduce the risk of neurocognitive and endocrine sequelae.
      explanation: Proton therapy targets proliferating tumor cells while sparing normal developing brain tissue.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Proton therapy is increasingly employed especially in children to reduce the risk of neurocognitive and endocrine sequelae.
    explanation: States the rationale and paediatric preference for proton therapy.
- name: Craniospinal Irradiation
  description: >-
    Craniospinal irradiation is reserved for documented metastatic
    (leptomeningeal) disease rather than being used routinely, because of its
    substantial neurocognitive and growth toxicity.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: craniospinal irradiation
    term:
      id: NCIT:C116437
      label: Craniospinal Irradiation
  target_mechanisms:
  - target: Uncontrolled Tumor Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Irradiates the entire neuraxis to suppress proliferating leptomeningeal
      tumor deposits.
    evidence:
    - reference: PMID:35384591
      reference_title: 'Ependymoma: Evaluation and Management Updates.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Craniospinal irradiation is reserved for metastatic disease.
      explanation: Neuraxis irradiation targets disseminated proliferating ependymoma cells.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Craniospinal irradiation is reserved for metastatic disease.
    explanation: Defines metastatic disease as the indication for craniospinal irradiation.
- name: Salvage Chemotherapy
  description: >-
    Cytotoxic chemotherapy has no established role as primary therapy for
    ependymoma and does not improve survival when added to surgery and radiation.
    It is used as salvage treatment for patients failing surgery and
    radiotherapy, and to delay irradiation in infants or after subtotal
    resection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Uncontrolled Tumor Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic agents target dividing tumor cells in recurrent disease or in
      infants to delay radiotherapy.
    evidence:
    - reference: PMID:35384591
      reference_title: 'Ependymoma: Evaluation and Management Updates.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Chemotherapy is not useful as primary treatment and is commonly employed as salvage treatment for patients failing surgery and radiotherapy.
      explanation: Salvage cytotoxic chemotherapy targets proliferating tumor cells after surgical and radiotherapeutic failure.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Chemotherapy is not useful as primary treatment and is commonly employed as salvage treatment for patients failing surgery and radiotherapy.
    explanation: Establishes that chemotherapy is a salvage rather than primary modality.
  - reference: PMID:24553142
    reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas of infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Current standard therapy comprises surgery and radiation, but not cytotoxic chemotherapy as it does not further increase survival.
    explanation: Confirms that cytotoxic chemotherapy does not add a survival benefit to surgery and radiation.
- name: Locoregional CAR T-Cell Therapy
  description: >-
    Experimental, not standard of care. Because PFA ependymomas and their
    recurrences sit adjacent to and are bathed by cerebrospinal fluid,
    intrathecal delivery of chimeric antigen receptor T cells against EPHA2, HER2
    and IL13Rα2 bypasses the blood-brain barrier. Validated to date only in mouse
    xenograft models.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: chimeric antigen receptor T-cell therapy
    term:
      id: NCIT:C126102
      label: Chimeric Antigen Receptor T-Cell Therapy
  target_mechanisms:
  - target: Uncontrolled Tumor Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Intrathecally delivered CAR T cells recognize EPHA2, HER2, and IL13Rα2 on
      ependymoma cells and mediate cytolytic clearance of proliferating tumor.
    evidence:
    - reference: PMID:32341580
      reference_title: Locoregional delivery of CAR T cells to the cerebrospinal fluid for treatment of metastatic medulloblastoma and ependymoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We validate intrathecal delivery of EPHA2, HER2 and interleukin 13 receptor α2 chimeric antigen receptor T cells as an effective treatment for primary, metastatic and recurrent group 3 medulloblastoma and PFA ependymoma xenografts in mouse models.
      explanation: Demonstrates CAR T-cell-mediated regression of proliferating PFA ependymoma xenografts in mice.
  evidence:
  - reference: PMID:32341580
    reference_title: Locoregional delivery of CAR T cells to the cerebrospinal fluid for treatment of metastatic medulloblastoma and ependymoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We validate intrathecal delivery of EPHA2, HER2 and interleukin 13 receptor α2 chimeric antigen receptor T cells as an effective treatment for primary, metastatic and recurrent group 3 medulloblastoma and PFA ependymoma xenografts in mouse models.
    explanation: Preclinical mouse-xenograft evidence for intrathecal CAR T-cell therapy in PFA ependymoma; not yet clinically established.
diagnosis:
- name: DNA methylation array profiling
  description: >-
    Genome-wide DNA methylation profiling is the reference method for assigning
    an ependymal tumor to its molecular group and is definitional for the WHO
    CNS5 types. It is not merely confirmatory: in a series of histopathologically
    diagnosed ependymoma variants, integrated diagnosis had to be revised in more
    than a third of cases once methylation class was taken into account.
  diagnosis_term:
    preferred_term: methylation testing
    term:
      id: NCIT:C165222
      label: DNA Methylation Array
  evidence:
  - reference: PMID:31679042
    reference_title: Molecular characterization of histopathological ependymoma variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, integrated diagnosis had to be changed in 35.6% of cases as compared to the initial diagnosis.
    explanation: Quantifies how often methylation profiling overturns a purely histopathological ependymoma diagnosis, establishing it as the reference method.
- name: Surrogate immunohistochemistry for molecular group
  description: >-
    Where methylation profiling is unavailable, immunohistochemistry serves as a
    practical surrogate: L1CAM for ZFTA fusion in supratentorial tumors, and loss
    of H3K27me3 or EZHIP overexpression for posterior fossa group A.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  markers: L1CAM, H3K27me3, EZHIP
  evidence:
  - reference: PMID:34812989
    reference_title: Molecular subtyping of ependymoma and prognostic impact of Ki-67.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Surrogate IHC markers revealed high concordance rates between L1CAM and ZFTA-fusion and H3K27me3 loss or EZHIP overexpression was used for PFA-EPNs.
    explanation: Validates L1CAM, H3K27me3 loss and EZHIP as immunohistochemical surrogates for the defining molecular alterations.
- name: Ki-67 proliferation index
  description: >-
    A Ki-67 labelling index with a 7% cut-off separates ependymomas into two
    prognostic grades across all anatomical compartments, and was the only
    independent prognostic factor in a 141-tumor reclassified cohort.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  markers: Ki-67
  evidence:
  - reference: PMID:34812989
    reference_title: Molecular subtyping of ependymoma and prognostic impact of Ki-67.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 7% cut-off of Ki-67 was sufficient to classify EPNs into two-tiered grades at all anatomical locations.
    explanation: Establishes the Ki-67 7% cut-off as a grading and prognostic discriminator.
- name: Diagnostic histology with MRI and CSF staging
  description: >-
    Diagnosis requires histological confirmation showing perivascular
    pseudorosettes with GFAP and EMA positivity. MRI of brain and whole spine
    plus cerebrospinal fluid cytology stage leptomeningeal dissemination, which
    is present in up to 10% of intracranial cases at diagnosis and determines
    whether craniospinal irradiation is indicated.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Diagnosis requires histologic confirmation, aided by MRI and cerebrospinal fluid analysis, with dissemination present in up to 10% of cases at diagnosis.
    explanation: Establishes the combined histological, MRI and CSF workup and its staging role.
differential_diagnoses:
- name: Medulloblastoma
  description: >-
    Major pediatric posterior fossa brain tumor that, together with juvenile
    pilocytic astrocytoma, is more common than ependymoma in children and must
    be differentiated in the evaluation of pediatric posterior fossa neoplasms.
  distinguishing_features:
  - Accounts for a larger share of pediatric primary CNS tumors than ependymoma (which represents up to 10% of pediatric brain tumors after medulloblastoma and juvenile pilocytic astrocytoma)
  - Distinguished by histological confirmation and DNA methylation profiling rather than the perivascular pseudorosettes and GFAP/EMA positivity of ependymoma
  disease_term:
    preferred_term: medulloblastoma
    term:
      id: MONDO:0007959
      label: medulloblastoma
  evidence:
  - reference: PMID:30855832
    reference_title: Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: They account for approximately 2% to 3% of all primary central nervous system (CNS) tumors in adults and up to 10% in children, making them one of the more common pediatric brain tumors after medulloblastoma and juvenile pilocytic astrocytoma.
    explanation: Identifies medulloblastoma as one of the primary pediatric brain tumors alongside ependymoma in the differential diagnosis of pediatric posterior fossa neoplasms.
- name: Pilocytic Astrocytoma
  description: >-
    Common pediatric posterior fossa or spinal astrocytic neoplasm (juvenile
    pilocytic astrocytoma) that ranks alongside medulloblastoma ahead of
    ependymoma among pediatric brain tumors and enters the differential
    diagnosis of pediatric posterior fossa masses.
  distinguishing_features:
  - More common pediatric brain tumor than ependymoma in children
  - Distinguished from ependymoma on histological examination by absence of ependymal rosettes and perivascular pseudorosettes
  disease_term:
    preferred_term: pilocytic astrocytoma
    term:
      id: MONDO:0016691
      label: pilocytic astrocytoma
  evidence:
  - reference: PMID:30855832
    reference_title: Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: They account for approximately 2% to 3% of all primary central nervous system (CNS) tumors in adults and up to 10% in children, making them one of the more common pediatric brain tumors after medulloblastoma and juvenile pilocytic astrocytoma.
    explanation: Identifies juvenile pilocytic astrocytoma alongside medulloblastoma as the major pediatric brain tumor entities differentiated from ependymoma.
- name: Choroid Plexus Papilloma
  description: >-
    Intraventricular neoplasm that, alongside ependymoma, is one of the most
    common ventricular tumors in children and shares intraventricular location
    and obstructive hydrocephalus presentation.
  distinguishing_features:
  - Shares intraventricular localization with ependymoma as one of the two most common pediatric ventricular neoplasms
  - Distinguished from ependymoma on histological examination by choroid plexus rather than ependymal glial differentiation
  disease_term:
    preferred_term: choroid plexus papilloma
    term:
      id: MONDO:0009837
      label: choroid plexus papilloma
  evidence:
  - reference: PMID:8677342
    reference_title: 'Intracranial supratentorial tumors: classification, clinical findings, surgical management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Choroid plexus papillomas and ependymomas are the most common ventricular neoplasms. However, subependymal giant cell astrocytomas, subependymomas, teratomas are also observed.
    explanation: Establishes choroid plexus papilloma alongside ependymoma as the major differential diagnostic considerations for intraventricular neoplasms.
- name: Diffuse Astrocytoma
  description: >-
    Infiltrative intramedullary spinal or cerebral astrocytic glioma that is the
    primary imaging differential diagnosis for spinal ependymoma. On spinal MRI,
    astrocytomas typically extend over more vertebral segments than ependymomas,
    which usually span fewer than 4 vertebral segments.
  distinguishing_features:
  - Longer longitudinal spinal cord extension on MRI compared with spinal ependymoma (which has a mean extension of less than 4 vertebral segments)
  disease_term:
    preferred_term: diffuse astrocytoma
    term:
      id: MONDO:0016686
      label: diffuse astrocytoma
  evidence:
  - reference: PMID:38074692
    reference_title: 'Spinal ependymoma in adults: from molecular advances to new treatment perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

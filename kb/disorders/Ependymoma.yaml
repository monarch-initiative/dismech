- name: Cerebrospinal Fluid Pathway Obstruction
  description: >-
    Posterior fossa ependymomas characteristically arise in or extend into the
    fourth ventricle, where they obstruct cerebrospinal fluid pathways. The
    resulting non-communicating hydrocephalus and raised intracranial pressure
    produce the classic presenting syndrome of headache, vomiting and
    papilledema.
  locations:
  - preferred_term: fourth ventricle
    term:
      id: UBERON:0002422
      label: fourth ventricle
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary
      review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical symptoms vary by location, with posterior fossa tumors often causing
      hydrocephalus-related signs, and supratentorial lesions presenting with seizures
      or focal deficits.
    explanation: Links posterior fossa location to hydrocephalus and supratentorial location
      to seizures and focal deficits.
  downstream:
  - target: Raised Intracranial Pressure Syndrome
    description: Obstructed CSF outflow raises intracranial pressure.
    evidence:
    - reference: PMID:8677342
      reference_title: 'Intracranial supratentorial tumors: classification, clinical findings,
        surgical management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A tumor hindering CSF circulation may cause hydrocephalus.
      explanation: States the causal link from obstructed CSF circulation to hydrocephalus
        and raised intracranial pressure.
- name: Raised Intracranial Pressure Syndrome
  description: >-
    Clinical endpoint of CSF obstruction: progressive hydrocephalus with
    headache, vomiting, papilledema and, in infants, macrocephaly and a bulging
    fontanelle. This is the dominant presenting syndrome for posterior fossa
    ependymoma and the reason urgent surgical decompression is frequently
    required.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:8677342
    reference_title: 'Intracranial supratentorial tumors: classification, clinical findings,
      surgical management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Signs and symptoms related to increased intracranial pressure are often reported
      and vary according to the patient's age.
    explanation: Establishes the raised intracranial pressure syndrome and its age-dependent
      presentation in paediatric intracranial tumors.
- name: CNS Dissemination
  conforms_to: invasion_and_metastasis#Local Invasion and Intravasation
  description: >-
    Ependymoma spreads through the cerebrospinal fluid rather than
    haematogenously. Leptomeningeal dissemination is present at diagnosis in up
    to 10% of intracranial cases, which is why staging includes craniospinal
    imaging and CSF cytology, and why craniospinal irradiation is reserved for
    documented metastatic disease.
  locations:
  - preferred_term: ventricular system of brain
    term:
      id: UBERON:0005282
      label: ventricular system of brain
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary
      review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis requires histologic confirmation, aided by MRI and cerebrospinal
      fluid analysis, with dissemination present in up to 10% of cases at diagnosis.
    explanation: Quantifies the frequency of dissemination at diagnosis and the role of
      CSF analysis in staging.
histopathology:
- name: Perivascular Pseudorosettes
  finding_term:
    preferred_term: Perivascular pseudorosette formation
    term:
      id: NCIT:C41626
      label: Perivascular Pseudorosette Formation
  description: >-
    Tumor cells arranged radially around blood vessels with a perivascular
    anucleate fibrillary zone. This is the most consistent diagnostic
    histological feature of ependymoma across compartments and molecular groups,
    and is accompanied by GFAP and EMA positivity.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histological re-evaluation in five primary tumors and seven relapses showed
      characteristic histological features of ependymoma, namely pseudorosettes, GFAP-
      and EMA positivity.
    explanation: Identifies pseudorosettes together with GFAP and EMA positivity as the
      characteristic histological features of ependymoma.
- name: Ependymal Rosettes
  finding_term:
    preferred_term: Ependymal rosette formation
    term:
      id: NCIT:C35944
      label: Ependymal Rosette Formation
  description: >-
    True ependymal rosettes — tumor cells arranged around a central lumen
    recapitulating the ependymal canal — are highly specific for ependymoma but
    much less frequent than perivascular pseudorosettes.
  evidence:
  - reference: PMID:11211057
    reference_title: Brain surface ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: forming true ependymal rosettes and perivascular pseudorosettes with fibrillary
      background
    explanation: Describes true ependymal rosettes occurring alongside perivascular pseudorosettes
      in a histologically confirmed ependymoma.

genetic:
- name: ZFTA
  association: Fusion
  gene_term:
    preferred_term: ZFTA
    term:
      id: hgnc:28449
      label: ZFTA
  notes: >-
    ZFTA (formerly C11orf95) fusion, most commonly ZFTA-RELA, defines the
    dominant supratentorial ependymoma type and is present in more than
    two-thirds of supratentorial cases. Fusions arise by chromothripsis of
    11q13.1. Non-RELA ZFTA fusion partners (including NCOA1/2) produce the same
    histomolecular entity but with marked histopathological heterogeneity.
  evidence:
  - reference: PMID:34389065
    reference_title: 'Supratentorial non-RELA, ZFTA-fused ependymomas: a comprehensive phenotype genotype correlation highlighting the number of zinc fingers in ZFTA-NCOA1/2 fusions.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This modification reinforces the idea that supratentorial-ependymomas exhibiting fusion that implicates the C11orf95 (now called ZFTA) gene with or without the RELA gene, represent the same histomolecular entity.
    explanation: Confirms ZFTA fusions with or without RELA define a single histomolecular entity.
- name: RELA
  association: Fusion
  gene_term:
    preferred_term: RELA
    term:
      id: hgnc:9955
      label: RELA
  notes: >-
    RELA, the principal effector of canonical NF-kB signalling, is the most
    frequent ZFTA fusion partner. The resulting fusion protein enters the nucleus
    spontaneously and constitutively activates NF-kB target genes.
  evidence:
  - reference: PMID:24553141
    reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data identify a highly recurrent genetic alteration of RELA in human cancer
    explanation: Establishes RELA fusion as a highly recurrent genetic alteration in this tumor.
- name: YAP1
  association: Fusion
  gene_term:
    preferred_term: YAP1
    term:
      id: hgnc:16262
      label: YAP1
  notes: >-
    YAP1 fusion defines the second, less common supratentorial ependymoma type,
    recognized as a distinct subtype in WHO CNS5. YAP1-fused tumors generally
    affect younger children and carry a better prognosis than ZFTA-fused tumors.
  evidence:
  - reference: PMID:25965575
    reference_title: Molecular Classification of Ependymal Tumors across All CNS Compartments, Histopathological Grades, and Age Groups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two supratentorial subgroups are characterized by prototypic fusion genes involving RELA and YAP1, respectively.
    explanation: Identifies YAP1 fusion as defining a distinct supratentorial molecular subgroup.
- name: EZHIP
  association: Overexpression
  gene_term:
    preferred_term: EZHIP
    term:
      id: hgnc:33738
      label: EZHIP
  notes: >-
    EZHIP (also known as CXORF67) is highly expressed in PFA ependymoma and acts
    as a peptidyl PRC2 inhibitor, an "oncohistone mimic" functionally analogous
    to the H3 K27M mutation of diffuse midline glioma. EZHIP overexpression, not
    mutation, is the driver.
  evidence:
  - reference: PMID:31086175
    reference_title: PFA ependymoma-associated protein EZHIP inhibits PRC2 activity through a H3 K27M-like mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Posterior fossa type A (PFA) ependymomas exhibit very low H3K27 methylation and express high levels of EZHIP (Enhancer of Zeste Homologs Inhibitory Protein, also termed CXORF67).
    explanation: Documents EZHIP overexpression and low H3K27 methylation as features of PFA ependymoma.
- name: NF2
  association: Loss of Function
  gene_term:
    preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  notes: >-
    Biallelic NF2 inactivation (22q12), through germline or somatic mutation
    combined with chromosome 22q loss, is the recurrent genetic event in classic
    spinal ependymoma. Germline NF2 mutation causes NF2-related schwannomatosis,
    the principal hereditary predisposition to ependymoma.
  evidence:
  - reference: PMID:38265489
    reference_title: Transcriptomic and epigenetic dissection of spinal ependymoma (SP-EPN) identifies clinically relevant subtypes enriched for tumors with and without NF2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The only known recurrent genetic events in SP-EPN are loss of chromosome 22q and NF2 mutations
    explanation: Establishes NF2 mutation and 22q loss as the recurrent genetic events in spinal ependymoma.
- name: MYCN
  association: Amplification
  gene_term:
    preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  notes: >-
    MYCN amplification defines the aggressive spinal ependymoma type added in WHO
    CNS5, and was present in all cases of the original defining cohort. Tumors
    were histologically anaplastic (WHO grade III) in ten of thirteen cases.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The histological diagnosis was anaplastic ependymoma (WHO Grade III) in ten cases and classic ependymoma (WHO Grade II) in three cases.
    explanation: Documents the histological grade distribution of MYCN-amplified spinal ependymoma.
- name: Chromosome 1q
  association: Gain
  notes: >-
    Gain of chromosome 1q is the best-established adverse copy-number biomarker in
    intracranial ependymoma, correlating with pediatric age and functioning as an
    independent prognostic marker. It was evaluated prospectively as a
    stratification variable in the COG ACNS0121 trial.
  evidence:
  - reference: PMID:16609018
    reference_title: Identification of gains on 1q and epidermal growth factor receptor overexpression as independent prognostic markers in intracranial ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: gain of 1q25 as determined by fluorescence in situ hybridization represented an independent prognostic marker
    explanation: Establishes 1q25 gain as an independent prognostic marker in intracranial ependymoma, supporting the adverse-biomarker claim.
- name: CDKN2A
  association: Homozygous Deletion
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  notes: >-
    Homozygous deletion of CDKN2A/CDKN2B is an adverse copy-number marker in
    intracranial ependymoma, used together with 1q gain and age at diagnosis in
    molecular staging schemes that complement histopathological classification.
  evidence:
  - reference: PMID:20516456
    reference_title: Molecular staging of intracranial ependymoma in children and adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: age at diagnosis, gain of 1q, and homozygous deletion of CDKN2A comprised the most powerful independent indicators of unfavorable prognosis
    explanation: Directly identifies homozygous CDKN2A deletion as one of the most powerful independent indicators of unfavorable prognosis in intracranial ependymoma.
- name: EGFR
  association: Overexpression
  gene_term:
    preferred_term: EGFR
    term:
      id: hgnc:3236
      label: EGFR
  notes: >-
    EGFR at 7p11.2 shows frequent gains and high-level amplification in
    intracranial ependymoma, and protein overexpression by immunohistochemistry
    is an independent adverse prognostic marker that stratifies grade 2 tumors
    into distinct risk groups.
  evidence:
  - reference: PMID:16609018
    reference_title: Identification of gains on 1q and epidermal growth factor receptor overexpression as independent prognostic markers in intracranial ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: EGFR protein status subdivides intracranial grade II ependymomas into two different risk groups
    explanation: Establishes EGFR protein overexpression as a prognostic stratifier in intracranial ependymoma.
environmental:
- name: High-dose ionizing radiation
  description: >-
    High-dose ionizing radiation is the only established environmental risk factor
    for childhood CNS tumors including ependymoma. Investigations of other
    environmental aetiologies, including dietary N-nitroso compounds, have not
    produced consistent associations, and ependymoma is otherwise largely
    sporadic.
  presence: PRESENT
  evidence:
  - reference: PMID:16142778
    reference_title: 'Central nervous system tumours in children: epidemiology and risk factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Whilst high dose ionising radiation is an established risk factor for this group of tumours, reported associations with dietary N-nitroso compounds have not been consistent
    explanation: Establishes high-dose ionizing radiation as the only confirmed environmental risk factor for childhood CNS tumors.
inheritance:
- name: Autosomal Dominant
  description: >-
    Most ependymomas are sporadic. The principal hereditary predisposition is
    NF2-related schwannomatosis (formerly neurofibromatosis type 2), an autosomal
    dominant tumor-predisposition syndrome caused by germline NF2 mutation on
    chromosome 22, in which spinal ependymomas are a common tumor. Fifty to sixty
    percent of patients represent de novo mutations and up to a third of those are
    mosaic, which complicates genetic testing and counseling.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23931824
    reference_title: 'Neurofibromatosis type 2 (NF2): diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Neurofibromatosis type 2 (NF2) is an autosomal dominant inherited tumor predisposition syndrome caused by mutations in the NF2 gene on chromosome 22.
    explanation: Establishes the autosomal dominant inheritance and genetic basis of the predisposition syndrome.
  - reference: PMID:23931824
    reference_title: 'Neurofibromatosis type 2 (NF2): diagnosis and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Cranial and spinal meningiomas and spinal ependymomas are other common tumors.
    explanation: Documents spinal ependymoma as a common tumor in NF2-related schwannomatosis.

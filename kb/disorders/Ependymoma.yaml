    explanation: Confirms H3K27me3 immunohistochemistry as the surrogate biomarker distinguishing PFB from PFA.
- name: L1CAM Membranous Expression
  presence: ELEVATED
  subtypes:
  - ST-ZFTA
  context: >-
    Immunohistochemical surrogate marker for ZFTA-RELA fusion-positive

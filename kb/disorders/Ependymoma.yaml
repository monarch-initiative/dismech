      label: telencephalic ventricle
  evidence:
  - reference: PMID:24553141
    reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Here we show that more than two-thirds of supratentorial ependymomas contain oncogenic fusions between RELA, the principal effector of canonical NF-κB signalling, and an uncharacterized gene, C11orf95. In each case, C11orf95-RELA fusions resulted from chromothripsis involving chromosome 11q13.1.'
    explanation: Establishes the frequency of the fusion in supratentorial ependymoma and chromothripsis as its mechanism of formation.
  - reference: PMID:29949764
    reference_title: A De Novo Mouse Model of C11orf95-RELA Fusion-Driven Ependymoma Identifies Driver Functions in Addition to NF-κB.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The majority of supratentorial ependymomas (ST-ependymomas) have few mutations but frequently display chromothripsis of chromosome 11q that generates a fusion between C11orf95 and RELA
    explanation: Independently confirms the low mutation burden and chromothripsis-generated fusion in supratentorial ependymoma.
  downstream:
  - target: Constitutive NF-kB Pathway Activation
    description: The fusion protein translocates to the nucleus and activates NF-kB target genes.
    evidence:
    - reference: PMID:24553141
      reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: C11orf95-RELA fusion proteins translocated spontaneously to the nucleus to activate NF-κB target genes, and rapidly transformed neural stem cells--the cell of origin of ependymoma--to form these tumours in mice.
      explanation: Shows the fusion protein drives NF-kB target gene activation. Graded MODEL_ORGANISM because the sentence reports tumour formation in mice; the same sentence carries both the nuclear-translocation and the in vivo transformation result, so it is not split.
- name: Constitutive NF-kB Pathway Activation
  conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
  description: >-
    ZFTA-RELA fusion proteins localize spontaneously to the nucleus and
    constitutively activate canonical NF-kB target gene transcription,
    independently of upstream inflammatory signalling. This is a rare example of
    a recurrent genetic lesion directly activating NF-kB in human cancer, since
    constitutive NF-kB signalling is common in tumors but pathway mutations are
    otherwise rare. Mouse modelling indicates that additional driver functions
    beyond NF-kB contribute to tumorigenesis.
  genes:

epidemiology:
- name: Proportion of primary CNS tumors
  description: >-
    Ependymomas account for approximately 2-3% of primary CNS tumors in adults and
    up to 10% in children, making them one of the more common pediatric brain
    tumors.
  evidence:
  - reference: PMID:30855832
    reference_title: Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: They account for approximately 2% to 3% of all primary central nervous system (CNS) tumors in adults and up to 10% in children, making them one of the more common pediatric brain tumors after medulloblastoma and juvenile pilocytic astrocytoma.
    explanation: Provides the proportion of primary CNS tumors represented by ependymoma in adults and children.
- name: Population incidence
  description: >-
    In combined CBTRUS/NPCR/SEER data, ependymoma had the highest average annual
    age-adjusted incidence rate among the 12 rare CNS tumor types tracked by
    NCI-CONNECT, at 0.41 per 100,000 population.
  evidence:
  - reference: PMID:37980692
    reference_title: 'Capturing evolving definitions of 12 select rare CNS tumors: a timely report from CBTRUS and NCI-CONNECT.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AAAIR was 1.47 per 100,000 for these tumors combined, with highest incidence in ependymomas (AAAIR = 0.41/100,000).
    explanation: Provides the population-based age-adjusted incidence rate for ependymoma from a national registry analysis.
- name: Anatomic distribution by age
  description: >-
    Anatomic distribution differs sharply by age: about two-thirds of pediatric
    ependymomas are intracranial and most often arise in the posterior fossa,
    whereas in adults most tumors are spinal.
  evidence:
  - reference: PMID:30855832
    reference_title: Ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'These tumors demonstrate a wide anatomic distribution: approximately two-thirds occur intracranially in children, most often in the posterior fossa; in adults, most cases are located in the spinal cord.'
    explanation: Documents the age-dependent anatomic distribution of ependymoma.
- name: Median age of intracranial disease
  description: >-
    Intracranial ependymomas most commonly affect young children, with a median
    age of about 5 years, and show a slight male predominance. Ependymomas
    predominantly affect children under 10 years of age.
  evidence:
  - reference: PMID:40556668
    reference_title: 'Optimizing outcomes in intracranial ependymoma: a contemporary review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Intracranial ependymomas are glial tumors arising from the ependymal lining of the ventricular system, most commonly affecting young children (median age: 5 years), though they can occur across all age groups.'
    explanation: Establishes median age at presentation and the predominance of young children among intracranial ependymomas.
  - reference: PMID:16142778
    reference_title: 'Central nervous system tumours in children: epidemiology and risk factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: ependymomas mainly occur in children less than 10 years
    explanation: Independent epidemiologic review confirming the paediatric age distribution of ependymoma.
has_subtypes:
- name: ST-ZFTA
  display_name: Supratentorial ependymoma, ZFTA fusion-positive
  description: >-
    Supratentorial ependymoma defined by fusion of ZFTA (formerly C11orf95), most
    often to RELA. Under cIMPACT-NOW update 7 and WHO CNS5 the former
    "ependymoma, RELA fusion-positive" was renamed to reflect that ZFTA fusions
    with or without RELA involvement represent the same histomolecular entity.
  evidence:
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Concerning supratentorial ependymomas, the previous RELA fusion-positive ependymoma has been renamed into ZFTA fusion-positive and the novel YAP1 fusion-positive ependymoma subtype has been added.
    explanation: Confirms the WHO CNS5 renaming of the supratentorial ZFTA fusion-positive subtype.
- name: ST-YAP1
  display_name: Supratentorial ependymoma, YAP1 fusion-positive
  description: >-
    Supratentorial ependymoma defined by YAP1 fusion, added as a distinct subtype
    in WHO CNS5. YAP1-fused tumors were among the two prototypic supratentorial
    fusion-defined molecular subgroups identified by methylation profiling.
  evidence:
  - reference: PMID:25965575
    reference_title: Molecular Classification of Ependymal Tumors across All CNS Compartments, Histopathological Grades, and Age Groups.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two supratentorial subgroups are characterized by prototypic fusion genes involving RELA and YAP1, respectively.
    explanation: Identifies YAP1 fusion as defining one of the two supratentorial molecular subgroups.
- name: PFA
  display_name: Posterior fossa ependymoma, group A
  description: >-
    Posterior fossa ependymoma of methylation group A, mainly diagnosed in infants
    and young children and carrying a poor prognosis. PFA tumors are characterized
    by a lack of the repressive H3K27me3 mark and high EZHIP expression; loss of
    H3 K27me3 by immunohistochemistry serves as a practical diagnostic surrogate.
  evidence:
  - reference: PMID:30923826
    reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: PFA tumors are mainly diagnosed in infants and young children, show a poor prognosis, and are characterized by a lack of the repressive histone H3 lysine 27 trimethylation (H3K27me3) mark.
    explanation: Establishes the age distribution, prognosis and defining epigenetic mark loss of PFA ependymoma.
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Posterior fossa ependymomas should now be allocated either to the Type A or Type B subtypes based on molecular profiling or using the H3 K27me3 immunohistochemical surrogate.
    explanation: Establishes PFA/PFB assignment by methylation profiling or the H3 K27me3 immunohistochemical surrogate.
- name: PFB
  display_name: Posterior fossa ependymoma, group B
  description: >-
    Posterior fossa ependymoma of methylation group B, occurring in older
    children and adults and carrying a substantially better prognosis than PFA.
    PFB tumors retain H3K27me3 immunoreactivity.
  evidence:
  - reference: PMID:32502305
    reference_title: 'cIMPACT-NOW update 7: advancing the molecular classification of ependymal tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Common recurrent genetic or epigenetic alterations found in tumors belonging to the main molecular groups have been used to define tumor types at intracranial sites; C11orf95 and YAP1 fusion genes for supratentorial tumors and two types of posterior fossa ependymoma defined by methylation group, PFA and PFB.
    explanation: Defines PFA and PFB as the two methylation-defined posterior fossa ependymoma types.
- name: SP-EPN
  display_name: Spinal ependymoma
  description: >-
    Conventional spinal cord ependymoma, the most common intramedullary neoplasm
    in children and adults, carrying a better prognosis than intracranial disease.
    Loss of chromosome 22q and NF2 mutation are the only known recurrent genetic
    events in this methylation class.
  evidence:
  - reference: PMID:35384591
    reference_title: 'Ependymoma: Evaluation and Management Updates.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Compared with intracranial ependymomas, spinal ependymomas are less frequent and exhibit a better prognosis.
    explanation: Contrasts the frequency and prognosis of spinal versus intracranial ependymoma.
  - reference: PMID:38265489
    reference_title: Transcriptomic and epigenetic dissection of spinal ependymoma (SP-EPN) identifies clinically relevant subtypes enriched for tumors with and without NF2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The only known recurrent genetic events in SP-EPN are loss of chromosome 22q and NF2 mutations
    explanation: Identifies 22q loss and NF2 mutation as the recurrent genetic events defining the spinal ependymoma methylation class.
- name: SP-MYCN
  display_name: Spinal ependymoma, MYCN-amplified
  description: >-
    Aggressive spinal ependymoma type defined by MYCN amplification, added in WHO
    CNS5. These tumors are prone to infiltration of the spinal cord and
    dissemination through the CNS, and outcome remains poor.
  evidence:
  - reference: PMID:31414211
    reference_title: MYCN amplification drives an aggressive form of spinal ependymoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Copy number variation plots derived from DNA methylation arrays showed MYCN amplification as a characteristic genetic alteration in all cases of our cohort (n = 13), which was subsequently validated using fluorescence in situ hybridization.
    explanation: Establishes MYCN amplification as the defining alteration of this spinal ependymoma subgroup.
- name: Myxopapillary
  display_name: Myxopapillary ependymoma
  description: >-
    Histopathologically defined ependymal tumor type arising almost exclusively
    in the region of the conus medullaris, cauda equina and filum terminale. WHO
    CNS5 assigns it grade 2, a change from its previous grade 1 designation.
  evidence:
  - reference: PMID:32502305
    reference_title: 'cIMPACT-NOW update 7: advancing the molecular classification of ependymal tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Myxopapillary ependymoma and subependymoma have been retained as histopathologically defined tumor types, but the classification has dropped the distinction between classic and anaplastic ependymoma.
    explanation: Confirms myxopapillary ependymoma is retained as a histopathologically defined type.
- name: Subependymoma
  display_name: Subependymoma
  description: >-
    Slow-growing, histopathologically defined WHO grade 1 ependymal tumor,
    typically intraventricular and often an incidental finding. Retained as a
    distinct type in the molecular era because it is defined by histopathology
    rather than by a recurrent molecular alteration.
  evidence:
  - reference: PMID:27022130
    reference_title: Biology and management of ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Myxopapillary ependymomas and subependymomas have different biology than ependymomas with typical WHO grade II or III histology.
    explanation: Distinguishes subependymoma biology from conventional grade 2-3 ependymoma.
pathophysiology:
- name: Radial Glial Progenitor Transformation
  description: >-
    Ependymal neoplasms arise from the progenitors of the cells lining the
    ventricular system and spinal central canal. Radial glia are the proposed cell
    of origin, and compartment-restricted progenitor populations explain why
    supratentorial, posterior fossa and spinal ependymomas are molecularly
    distinct despite similar histology.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: ependymal cell
    term:
      id: CL:0000065
      label: ependymal cell
  locations:
  - preferred_term: ventricular system of brain
    term:
      id: UBERON:0005282
      label: ventricular system of brain
  evidence:
  - reference: PMID:17179988
    reference_title: Stem cells of ependymoma.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: radial glia are cells of origin of ependymoma
    explanation: Review of the evidence identifying radial glia as the cell of origin of ependymoma.
  - reference: PMID:36534422
    reference_title: Ependymomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Ependymal neoplasms are a heterogenous group of neoplasms arising from the progenitors of the cells lining the ventricular system and the spinal central canal.
    explanation: Identifies progenitors of ependymal lining cells as the origin of ependymal neoplasms.
  downstream:
  - target: ZFTA-RELA Fusion Formation
    description: Supratentorial neural stem cells transformed by ZFTA-RELA fusion give rise to supratentorial ependymoma.
    evidence:
    - reference: PMID:24553141
      reference_title: C11orf95-RELA fusions drive oncogenic NF-κB signalling in ependymoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: C11orf95-RELA fusion proteins translocated spontaneously to the nucleus to activate NF-κB target genes, and rapidly transformed neural stem cells--the cell of origin of ependymoma--to form these tumours in mice.
      explanation: Demonstrates in mice that the fusion transforms neural stem cells, the cell of origin, into ependymoma.
  - target: YAP1 Fusion Signaling
    description: Supratentorial radial glial progenitors acquire YAP1 gene fusions (such as YAP1-MAMLD1) that define the ST-YAP1 molecular subgroup.
    evidence:
    - reference: PMID:25965575
      reference_title: Molecular Classification of Ependymal Tumors across All CNS Compartments, Histopathological Grades, and Age Groups.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Two supratentorial subgroups are characterized by prototypic fusion genes involving RELA and YAP1, respectively.
      explanation: Establishes YAP1 fusion as the defining oncogenic driver of the second supratentorial ependymoma subgroup arising in this compartment.
  - target: EZHIP Overexpression
    description: Hindbrain progenitors give rise to PFA ependymoma, which is defined by ectopic EZHIP overexpression.
    evidence:
    - reference: PMID:30923826
      reference_title: EZHIP/CXorf67 mimics K27M mutated oncohistones and functions as an intrinsic inhibitor of PRC2 function in aggressive posterior fossa ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: Recently, we reported overexpression of chromosome X open reading frame 67 (CXorf67) as a hallmark of PFA ependymoma
      explanation: Establishes EZHIP overexpression as the hallmark lesion of the posterior fossa group A tumors arising from this progenitor compartment.
  - target: CpG Island Methylator Phenotype Silencing
    description: Hindbrain progenitors in poor-prognosis PFA tumors acquire a CpG island methylator phenotype.
    evidence:
    - reference: PMID:24553142
      reference_title: Epigenomic alterations define lethal CIMP-positive ependymomas of infancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Ependymomas are common childhood brain tumours that occur throughout the nervous system, but are most common in the paediatric hindbrain.
      explanation: Locates the CIMP-positive tumors studied in this paper to the paediatric hindbrain progenitor compartment.
  - target: Impaired Lineage Differentiation
    description: Transformed progenitors fail to complete neuronal-glial differentiation, establishing a tumor cellular hierarchy.
    evidence:
    - reference: PMID:32663469
      reference_title: Single-Cell RNA-Seq Reveals Cellular Hierarchies and Impaired Developmental Trajectories in Pediatric Ependymoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Ependymomas are composed of a cellular hierarchy initiating from undifferentiated populations, which undergo impaired differentiation toward three lineages of neuronal-glial fate specification.
      explanation: Directly demonstrates that the transformed progenitor compartment gives rise to a differentiation-blocked cellular hierarchy.
- name: Impaired Lineage Differentiation
  description: >-
    Single-cell RNA sequencing shows that ependymomas are organized as a cellular
    hierarchy initiating from undifferentiated populations that undergo impaired
    differentiation toward three neuronal-glial lineages. The proportion of
    undifferentiated cells tracks with aggressiveness: favorable molecular groups
    are dominated by differentiated cells, whereas aggressive groups are enriched
    for undifferentiated populations.

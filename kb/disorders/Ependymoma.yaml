- name: CpG Island Methylator Phenotype Silencing
  conforms_to: epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression
  description: >-
    Poor-prognosis hindbrain ependymomas independently exhibit a CpG island
    methylator phenotype (CIMP). Transcriptional silencing driven by CpG
    methylation converges on the same Polycomb repressive complex 2 targets,
    reinforcing the differentiation block. This epigenetic program, rather than
    recurrent point mutation, drives tumorigenesis — these tumors have an
    extremely low mutation rate with no significant recurrent somatic single
    nucleotide variants.

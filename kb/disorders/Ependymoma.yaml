      explanation: Supports NF-kB signalling as the principal oncogenic output of the fusion, while the same study shows additional driver functions contribute.
- name: YAP1 Fusion Signaling
  conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
  description: >-
    A distinct supratentorial ependymoma subgroup (ST-EPN-YAP1), enriched in
    infants and associated with a favorable prognosis, is driven by recurrent
    fusions of the Hippo pathway transcriptional coactivator YAP1 (most
    commonly YAP1-MAMLD1). The fusion protein localizes strongly to the
    nucleus, driving aberrant YAP1-mediated transcriptional coactivation
    independently of ZFTA-RELA/NF-kB signaling.

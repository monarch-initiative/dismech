    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although constitutive NF-κB signalling is present in most human tumours, mutations in pathway members are rare, complicating efforts to understand and block aberrant NF-κB activity in cancer.
    explanation: Frames the ZFTA-RELA fusion as an unusual recurrent genetic activator of NF-kB, motivating its role as a driver lesion.

- phase: Long-term outcome and recurrence
  notes: >-
    Recurrences are predominantly local rather than disseminated. Ten-year overall
    survival across all ependymoma ranges from 50% to 75% and is governed by
    extent of resection, molecular subtype and age; posterior fossa group B has an
    excellent outcome whereas group A with chromosome 1q gain does poorly.

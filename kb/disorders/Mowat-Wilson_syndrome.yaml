notes: >-
  Asta deep research was completed and reviewed for this disorder. The final
  curation prioritized directly usable PubMed and DOI-backed syndrome-specific
  evidence because the retrieval output mixed review-level and case-level
  material.


  2026-07-30: Added the monosomy 2q22 etiological subtype (MONDO:0016855,
  Orphanet:261537), which MONDO models as is_a Mowat-Wilson syndrome. It is
  curated as a subtype rather than a standalone disease entry because it
  produces the classic Mowat-Wilson phenotype through the same ZEB2
  haploinsufficiency mechanism, differing in the lesion class (contiguous-gene
  deletion vs intragenic variant) and consequently in the diagnostic modality
  required to detect it. A falcon (Edison) deep-research run was performed for
  this session; it corroborated the contiguous-gene-deletion framing and the
  necessity of copy-number testing, but its supporting citation for
  genotype-phenotype correlation (Zou et al. 2020,
  DOI:10.3892/etm.2020.9393) was checked against the cached abstract and found
  to describe only truncating point variants with no deletion cases, so it was
  not used to support any deletion-specific claim. Claims that larger deletions
  add contiguous-gene features beyond the ZEB2 phenotype were likewise left
  uncurated: the retrieved sources assert this only in general terms without a
  quotable, deletion-specific result, so it is deliberately omitted rather than
  supported by an over-broad snippet.

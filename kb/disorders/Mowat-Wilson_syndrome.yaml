name: Mowat-Wilson syndrome
creation_date: "2026-04-13T22:47:36Z"
description: >-
  Mowat-Wilson syndrome is a rare ZEB2-related neurodevelopmental disorder
  characterized by distinctive craniofacial features, global developmental
  delay, intellectual disability, epilepsy, and frequent multisystem congenital
  anomalies including Hirschsprung disease and congenital heart defects. The
  disorder is usually caused by de novo heterozygous loss-of-function variants
  in ZEB2.
category: Mendelian
parents:
- hereditary disease
- neurodevelopmental disorder
synonyms:
- MWS
- Hirschsprung disease-intellectual disability syndrome
disease_term:
  preferred_term: Mowat-Wilson syndrome
  term:
    id: MONDO:0009341
    label: Mowat-Wilson syndrome
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Mowat-Wilson syndrome follows an autosomal dominant pattern, although most
    affected individuals have de novo pathogenic ZEB2 variants.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: DOI:10.1186/s43042-024-00517-2
    reference_title: "Mowat-Wilson syndrome: unraveling the complexities of diagnosis, treatment, and symptom management"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The inheritance pattern of this disorder is an autosomal dominant pattern."
    explanation: >-
      This review directly supports autosomal dominant inheritance for
      Mowat-Wilson syndrome.
has_subtypes:
- name: Monosomy 2q22
  display_name: Mowat-Wilson syndrome due to monosomy 2q22
  subtype_term:
    preferred_term: Mowat-Wilson syndrome due to monosomy 2q22
    term:
      id: MONDO:0016855
      label: Mowat-Wilson syndrome due to monosomy 2q22
  description: >-
    The etiological subtype of Mowat-Wilson syndrome caused by a heterozygous
    deletion at chromosome band 2q22 that removes the entire ZEB2 gene, as
    opposed to an intragenic ZEB2 sequence variant. The deletion may extend
    beyond ZEB2 to neighbouring genes, in which case the resulting ZEB2
    haploinsufficiency is accompanied by loss of one copy of flanking loci.
    Because a whole-gene deletion is not detectable by ZEB2 sequencing alone,
    this subtype is ascertained by copy-number methods (chromosomal microarray,
    FISH, MLPA, or qPCR) rather than by sequencing. Reported deletion patients
    show the recognizable Mowat-Wilson phenotype rather than a distinct
    syndrome, which is why Orphanet and MONDO model this as an etiological
    subtype nested under Mowat-Wilson syndrome rather than as a separate
    disease. The extent to which deletion size modifies the phenotype is not
    established here; see the entry notes.
  genes:
  - preferred_term: ZEB2
    description: >-
      Whole-gene deletion of ZEB2 within the deleted 2q22 segment, producing
      haploinsufficiency by loss of one entire allele.
    modifier: DECREASED
    term:
      id: hgnc:14881
      label: ZEB2
  inheritance:
  - name: Autosomal dominant inheritance
    description: >-
      The 2q22 deletion behaves as an autosomal dominant allele and is almost
      always de novo.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:20301585
      reference_title: "Classic Mowat-Wilson Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Classic MWS is an autosomal dominant disorder caused by a pathogenic variant in ZEB2, a heterozygous deletion of 2q22.3 involving ZEB2, or (rarely) a chromosome rearrangement that disrupts ZEB2."
      explanation: >-
        GeneReviews states that a heterozygous 2q22.3 deletion involving ZEB2 is
        one of the autosomal dominant causes of classic Mowat-Wilson syndrome.
  evidence:
  - reference: PMID:20301585
    reference_title: "Classic Mowat-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a heterozygous deletion of 2q22.3 involving ZEB2"
    explanation: >-
      GeneReviews names a heterozygous 2q22 deletion involving ZEB2 as a
      distinct causal mechanism alongside intragenic ZEB2 variants, which is the
      basis for this subtype.
  - reference: PMID:33982229
    reference_title: "Clinical characteristics of Polish patients with molecularly confirmed Mowat-Wilson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microdeletions in the critical chromosomal region 2q22-23, where the ZEB2 gene is located"
    explanation: >-
      This cohort explicitly separates 2q22-23 microdeletions from intragenic
      ZEB2 variants as a causal category, supporting the subtype boundary.
  - reference: PMID:34012377
    reference_title: "Interstitial Deletion of 2q22.2q22.3 Involving the Entire ZEB2 Gene in a Case of Mowat-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CMA revealed an interstitial 2.27-Mb microdeletion in chromosome 2q, involving the entire ZEB2 gene and other genes."
    explanation: >-
      A worked case of the subtype: a multi-megabase 2q22 deletion removing all
      of ZEB2 plus neighbouring genes, demonstrating the contiguous-gene
      character of this etiology.
pathophysiology:
- name: 2q22 contiguous-gene deletion removing ZEB2
  description: >-
    In the monosomy 2q22 subtype the proximal lesion is a heterozygous
    interstitial deletion at chromosome band 2q22 that removes the entire ZEB2
    coding region rather than altering it in situ. A reported case carried a
    2.27-Mb deletion encompassing ZEB2 and additional genes, making this a
    contiguous-gene deletion whose dominant contribution is ZEB2
    haploinsufficiency. The lesion therefore converges on the same downstream
    mechanism as intragenic loss-of-function variants, which is consistent with
    deletion patients presenting with the recognizable Mowat-Wilson phenotype.
  subtypes:
  - Monosomy 2q22
  biological_scale: MOLECULAR
  gene:
    preferred_term: ZEB2
    description: Entire ZEB2 locus lost on one homolog within the deleted 2q22 segment.
    modifier: ABSENT
    term:
      id: hgnc:14881
      label: ZEB2
  genes:
  - preferred_term: ZEB2
    term:
      id: hgnc:14881
      label: ZEB2
  evidence:
  - reference: PMID:34012377
    reference_title: "Interstitial Deletion of 2q22.2q22.3 Involving the Entire ZEB2 Gene in a Case of Mowat-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CMA revealed an interstitial 2.27-Mb microdeletion in chromosome 2q, involving the entire ZEB2 gene and other genes."
    explanation: >-
      Directly documents a 2q22 interstitial deletion spanning the whole ZEB2
      gene plus additional genes, establishing the contiguous-gene lesion.
  - reference: PMID:23466526
    reference_title: "ZEB2 zinc-finger missense mutations lead to hypomorphic alleles and a mild Mowat-Wilson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of mutations lead to haplo-insufficiency through premature stop codons or large gene deletions."
    explanation: >-
      Places large ZEB2 gene deletions alongside truncating variants as the
      major route to haploinsufficiency, supporting mechanistic convergence.
  downstream:
  - target: ZEB2 haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      Loss of one entire ZEB2 allele halves functional ZEB2 dosage, entering the
      shared Mowat-Wilson mechanism at the haploinsufficiency node.
    evidence:
    - reference: PMID:23466526
      reference_title: "ZEB2 zinc-finger missense mutations lead to hypomorphic alleles and a mild Mowat-Wilson syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The majority of mutations lead to haplo-insufficiency through premature stop codons or large gene deletions."
      explanation: >-
        Directly states that large gene deletions act by producing ZEB2
        haploinsufficiency, supporting this causal edge.

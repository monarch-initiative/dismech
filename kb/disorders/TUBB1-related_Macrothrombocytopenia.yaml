inheritance:
- name: Autosomal dominant inheritance with incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most reported disease-associated alleles are heterozygous and segregate in
    dominant pedigrees, but a carrier may have macrothrombocytopenia, isolated
    platelet enlargement, or normal platelet count and size.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation studies showed incomplete penetrance of these variants for
      platelet traits. Indeed, most carriers showed macrothrombocytopenia, some
      only increased platelet size, and a minority had no abnormalities.
    explanation: Directly establishes incomplete penetrance across nine TUBB1 families.
  - reference: PMID:33400601
    reference_title: Identification of a pathogenic TUBB1 variant in a Chinese family with congenital macrothrombocytopenia through whole genome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings were consistent with an autosomal dominant inheritance
      with incomplete penetrance.
    explanation: Independently documents dominant inheritance with incomplete penetrance.
- name: Variant-specific biallelic allele-burden pattern
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    In one consanguineous pedigree, p.Gly109Glu produced
    macrothrombocytopenia in homozygotes; heterozygous relatives generally had
    increased platelet size alone or normal platelets. This is a
    variant-specific observation, not evidence that all TUBB1 disease is
    recessive.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, only homozygous carriers of the p.Gly109Glu variant displayed
      macrothrombocytopenia, highlighting the importance of allele burden in
      the phenotypic expression of TUBB1-RT.
    explanation: Establishes the biallelic phenotype for this allele.
pathophysiology:
- name: Variant-Specific Disruption of Beta-1 Tubulin
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Disease-associated TUBB1 alleles do not have one uniform molecular effect.
    Several missense proteins fail to incorporate into microtubules, whereas
    p.Arg359Trp partly incorporates and has a weaker distribution defect;
    truncating alleles are also reported. The shared consequence across
    functionally tested alleles is disturbed beta-1-tubulin organization or
    dosage, not a universal simple loss-of-function mechanism.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: GERMLINE
    description: >-
      Heterozygous missense, frameshift, and nonsense alleles occur with
      incomplete penetrance. Homozygous p.Gly109Glu shows an allele-burden
      effect. UNKNOWN is used because assayed alleles differ in incorporation,
      abundance, and zygosity.
  genes:
  - preferred_term: TUBB1
    term: {id: "hgnc:16257", label: TUBB1}
  cell_types:
  - preferred_term: megakaryocyte
    term: {id: "CL:0000556", label: megakaryocyte}
  - preferred_term: platelet
    term: {id: "CL:0000233", label: platelet}
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    term: {id: "GO:0000226", label: microtubule cytoskeleton organization}
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:24344610
    reference_title: TUBB1 mutation disrupting microtubule assembly impairs proplatelet formation and results in congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant β1-tubulin was not incorporated into microtubules with endogenous
      α-tubulin, and α-tubulin expression was decreased in transfected Chinese
      hamster ovary cells.
    explanation: Establishes failed incorporation for p.Phe260Ser.
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whereas the p.Arg359Trp variant exerted a visible but weaker deleterious
      effect in β1-tubulin distribution.
    explanation: Supports variant-to-variant differences in incorporation.
  downstream:
  - target: Marginal-Ring and Platelet-Maturation Defect
    description: Disturbed beta-1 tubulin compromises platelet production and structure.
- name: Marginal-Ring and Platelet-Maturation Defect
  biological_scale: CELLULAR
  description: >-
    Patient platelets can lose or disorganize the beta-1-tubulin marginal ring.
    Patient-derived megakaryocytes show variant- and penetrance-dependent
    impairment of proplatelet formation, and circulating preplatelets show
    impaired final maturation.
  cell_types:
  - preferred_term: megakaryocyte
    term: {id: "CL:0000556", label: megakaryocyte}
  - preferred_term: platelet
    term: {id: "CL:0000233", label: platelet}
  biological_processes:
  - preferred_term: platelet formation
    term: {id: "GO:0030220", label: platelet formation}
    modifier: DECREASED
  evidence:
  - reference: PMID:24344610
    reference_title: TUBB1 mutation disrupting microtubule assembly impairs proplatelet formation and results in congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A circumferential marginal microtubule band was undetectable, whereas
      microtubules were frayed and disorganized in every platelet from the
      affected individuals.
    explanation: Direct cytological evidence from p.Phe260Ser patient platelets.
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The deleterious functional effect of TUBB1 variants (p.Arg359Trp,
      p.Gly269Asp, and p.Gly109Glu) is strongly supported by the finding of
      impaired MK maturation and proplatelet formation by MKs differentiated
      from CD34+ cell from thrombocytopenic carriers of these mutations.
    explanation: Links three variants to impaired patient-derived megakaryocytes.
  downstream:
  - target: Macrothrombocytopenia
    description: Reduced production and maturation yield fewer, larger platelets.
  - target: Giant Platelets
    description: Defective maturation generates large and giant platelets.
- name: p.Arg318Trp-Associated Thyroid Cell Proliferation Defect
  role: TRIGGER
  biological_scale: CELLULAR
  description: >-
    The recurrent heterozygous p.Arg318Trp allele occurs in independent
    thyroid-dysgenesis cohorts. In human thyroid cells it reduced TUBB1
    abundance and significantly inhibited proliferation. Its effect on
    wound-healing migration was not significant, so impaired migration is not
    asserted as the human cellular mechanism.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      The allele is associated with thyroid dysgenesis and has functional
      effects in thyroid cells, but the authors describe susceptibility and call
      for further mechanistic work.
  genes:
  - preferred_term: TUBB1
    term: {id: "hgnc:16257", label: TUBB1}
  biological_processes:
  - preferred_term: thyroid gland development
    term: {id: "GO:0030878", label: thyroid gland development}
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40071799
    reference_title: Genetic and functional analysis of TUBB1 variants in congenital hypothyroidism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The c.952C>T mutant decreased the expression of TUBB1 in both mRNA and
      protein level, and inhibited the proliferation of thyroid cells
      significantly.
    explanation: Supports reduced expression and proliferation.
  - reference: PMID:40071799
    reference_title: Genetic and functional analysis of TUBB1 variants in congenital hypothyroidism.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Also, c.952C>T mutant showed restrain effects on the migration, although
      there was no stistical significance.
    explanation: Prevents treating impaired migration as established.
  downstream:
  - target: Congenital Hypothyroidism Associated with Thyroid Dysgenesis
    description: Reduced proliferation is a candidate route to thyroid agenesis.
- name: Variant-Dependent Platelet Functional Effects
  biological_scale: CELLULAR
  description: >-
    Platelet agglutination, granule release, and low-dose agonist responses are
    abnormal in some TUBB1 families, but activation, secretion, aggregation,
    and spreading remain nearly normal with several other alleles. The evidence
    therefore supports an allele- or context-dependent functional branch rather
    than a necessary consequence of marginal-ring disruption.
  cell_types:
  - preferred_term: platelet
    term: {id: "CL:0000233", label: platelet}
  evidence:
  - reference: PMID:33400601
    reference_title: Identification of a pathogenic TUBB1 variant in a Chinese family with congenital macrothrombocytopenia through whole genome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals within the family demonstrated impaired platelet
      aggregation and/or release functions.
    explanation: Establishes the functional branch in the p.Arg318Trp family.
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, homozygous and heterozygous carriers of p.Gly109Glu showed
      normal platelet aggregation response to different agonists
    explanation: Refutes a necessary aggregation defect across TUBB1 genotypes.
  downstream:
  - target: Variable Platelet-Function Abnormalities
    description: >-
      Functional abnormalities occur in selected families while other carriers
      retain normal tested responses.
- name: Attenuated DNA-Damage Response in TUBB1-Deficient Cells
  biological_scale: CELLULAR
  description: >-
    In a thrombocytopenia family with myeloid malignancy, TUBB1 deficiency was
    associated experimentally with reduced nuclear p53 accumulation,
    pro-apoptotic transcription, and apoptosis after genotoxic stress. This is
    a plausible genome-instability route, not an established universal
    malignancy phenotype.
  genes:
  - preferred_term: TUBB1
    term: {id: "hgnc:16257", label: TUBB1}
  evidence:
  - reference: PMID:30854628
    reference_title: TUBB1 dysfunction in inherited thrombocytopenia causes genome instability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that the nuclear accumulation of p53 (also termed TP53) and the
      expression of pro-apoptotic genes triggered by genotoxic stress were
      blocked in TUBB1-deficient cells and, accordingly, apoptosis after DNA
      damage was diminished by knockdown of TUBB1.
    explanation: States the measured DNA-damage-response defects.
phenotypes:
- name: Macrothrombocytopenia
  description: >-
    Lifelong thrombocytopenia with increased platelet size is defining. Counts
    were generally moderately reduced, and most individuals in the largest
    series had little or no clinically relevant bleeding.
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term: {id: "HP:0040185", label: Macrothrombocytopenia}
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombocytopenia, defined as platelet count below the normal healthy
      volunteer range (n = 107; 142-359 × 109/L), was in general moderate
      (median, 76; range, 57-134 × 109/L) and associated with increased platelet
      size (mean platelet volume [MPV], 13.3-15.0 fL; normal, 9.0-12.8 fL;
      Table 1).
    explanation: Direct cohort evidence for the combined count-and-size phenotype.
- name: Giant Platelets
  description: >-
    Smears show a broad size distribution with large and occasional giant
    platelets. Electronic counts can be lower than microscopic counts when very
    large platelets are present.
  phenotype_term:
    preferred_term: Giant platelets
    term: {id: "HP:0001902", label: Giant platelets}
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variable platelet size was observed with large (arrows) and giant (cross)
      platelets.
    explanation: Directly documents large and giant circulating platelets.
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this family, several subjects across 3 generations displayed increased
      MPV, but only the 2 probands were thrombocytopenic (≈60 × 109/L at
      electronic counting), although they did not have excessive bleeding,
      including at childbirths and miscarriage (II.1). Microscopic platelet
      counting44 was ≈100 × 109/L in both siblings, with more than 20% of large
      platelets (mean platelet diameter, [MPD] > 5 µm) and occasional giant
      platelets (MPD > 6 µm; Figure 1B).
    explanation: >-
      Supports the observed microscopic count and size distribution underlying
      the caution about automated counting of very large platelets.
- name: Variable Platelet-Function Abnormalities
  description: >-
    Qualitative dysfunction is variant- and family-dependent. The p.Arg318Trp
    family included impaired ristocetin agglutination and reduced stimulated
    p-selectin release, whereas other variants had negligible functional effects.
  phenotype_term:
    preferred_term: Abnormal platelet function
    term: {id: "HP:0011869", label: Abnormal platelet function}
  evidence:
  - reference: PMID:33400601
    reference_title: Identification of a pathogenic TUBB1 variant in a Chinese family with congenital macrothrombocytopenia through whole genome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, impaired platelet agglutination in response to ristocetin was
      detected in the patient's brother. Half of the family members harboring
      the p.R318W mutation displayed significantly decreased external release
      of p-selectin by stimulated platelets.
    explanation: Documents two abnormalities in one p.Arg318Trp family.
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, TUBB1 mutations caused the formation of macroplatelets and
      hyperaggregation of human platelets after stimulation by low doses of
      agonists
    explanation: >-
      Documents the hyperaggregation result in the thyroid-ascertained families.
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.Arg359Trp, p.Gly269Asp, and p.Gly109Glu variants deranged β1-tubulin
      incorporation into the microtubular marginal ring in platelets but had a
      negligible effect on platelet activation, secretion, or spreading,
      suggesting that β1-tubulin is dispensable for these processes.
    explanation: Refutes a universal platelet-function defect.
- name: Congenital Hypothyroidism Associated with Thyroid Dysgenesis
  description: >-
    This is a replicated TUBB1 allelic association but not a required feature of
    the isolated platelet disorder. Four p.Arg318Trp thyroid-dysgenesis cases
    all had thyroid agenesis and normal platelets.
  phenotype_term:
    preferred_term: Congenital hypothyroidism
    term: {id: "HP:0000851", label: Congenital hypothyroidism}
  evidence:
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified three novel TUBB1 gene mutations that co-segregated with TD
      in three distinct families leading to 1.1% of TUBB1 mutations in TD study
      cohort.
    explanation: Establishes familial co-segregation and the original association.
  - reference: PMID:31642429
    reference_title: "[TUBB1 mutation in children with congenital hypothyroidism and thyroid dysgenesis in Shandong, China]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 289 children with CH and TD, 4 (1.4%) were found to have a
      c.952C>T(p.R318W) heterozygous mutation in the TUBB1 gene
    explanation: Replicates the association; classification remained potentially pathogenic.
  - reference: PMID:40071799
    reference_title: Genetic and functional analysis of TUBB1 variants in congenital hypothyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all 4 patients harbouring the c.952C>T mutation showed thyroid agenesis,
      underscoring its detrimental effect on cell survival during thyroid
      development. Notably, these 4 patients in our study cohort displayed
      normal platelets
    explanation: Documents thyroid agenesis and tissue-discordant penetrance.
genetic:
- name: TUBB1
  association: Causative
  gene_term:
    preferred_term: TUBB1 (beta-1 tubulin, class VI)
    term: {id: "hgnc:16257", label: TUBB1}
  notes: >-
    Beta-1 tubulin is predominant in megakaryocytes and platelets. TUBB1 is also
    expressed in developing and adult thyroid, but involvement differs among
    alleles and families.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microtubules are assembled by heterodimers of α and β-tubulin, and
      β1-tubulin, encoded by TUBB1, is the predominant β-tubulin isoform in
      megakaryocytes (MKs) and platelets.
    explanation: Supports the platelet-lineage context without claiming exclusivity.
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TUBB1 gene is expressed in the developing and adult thyroid in humans and
      mice.
    explanation: Establishes expression in the second relevant tissue.
diagnosis:
- name: Blood count, blood smear, and platelet tubulin assessment
  description: >-
    Count and size should be interpreted together and confirmed on a smear
    because automated counters may miss giant platelets. Beta-1-tubulin
    immunofluorescence can show an absent or disorganized marginal ring.
  diagnosis_term:
    preferred_term: laboratory procedure
    term: {id: "NCIT:C25294", label: Laboratory Procedure}
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Venous blood samples were drawn into EDTA and sodium citrate for the
      different studies (complete blood count [CBC], immature platelet fraction
      [%IPF], blood smear and immunofluorescence, functional studies, electron
      microscopy, CD34+ cell isolation and MK cultures, DNA, and RNA).
    explanation: Documents the phenotyping modalities used in the largest series.
- name: Molecular testing with segregation and functional interpretation
  description: >-
    Sequence findings should be integrated with phenotype, segregation, allele
    burden, and functional evidence. Incomplete penetrance complicates family
    interpretation, and prediction algorithms alone are insufficient.
  diagnosis_term:
    preferred_term: Genetic Testing
    term: {id: "NCIT:C15709", label: Genetic Testing}
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In silico algorithms of prediction are not reliable enough when analyzing
      TUBB1 variants, ratifying the importance of clinical information and
      biological evaluation when establishing the pathogenicity of such
      variants.
    explanation: Supports integrated interpretation rather than prediction alone.
treatments: []

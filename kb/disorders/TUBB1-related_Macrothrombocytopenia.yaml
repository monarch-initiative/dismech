discussions:
- discussion_id: gap_tubb1_variant_penetrance_and_allele_burden
  prompt: >-
    Which allele-specific, genetic, or environmental factors determine whether
    a carrier has macrothrombocytopenia, isolated enlargement, or normal traits?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Variant-Specific Disruption of Beta-1 Tubulin
  rationale: >-
    Rare heterozygous alleles show incomplete penetrance, while p.Gly109Glu
    caused macrothrombocytopenia only in homozygotes in one family.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These novel data expand the genetic spectrum of TUBB1-RT and highlight a
      remarkable heterogeneity in its clinical presentation, indicating that
      allelic burden or combination with other genetic or environmental factors
      modulate the phenotypic impact of rare TUBB1 variants.
    explanation: States the unresolved modifiers.
  - reference: PMID:32892537
    reference_title: Identification of novel TUBB1 variants in patients with macrothrombocytopenia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further clinical and functional studies of the newly identified TUBB1
      variants may offer important insights into their pathogenicity in
      macrothrombocytopenia.
    explanation: Supports caution for newly observed alleles.
- discussion_id: gap_tubb1_platelet_function_heterogeneity
  prompt: >-
    Why do some families show functional platelet abnormalities while other
    disruptive alleles leave activation, secretion, aggregation, and spreading normal?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Marginal-Ring and Platelet-Maturation Defect
  rationale: >-
    Structural marginal-ring defects do not predict a single functional phenotype.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There seems to be a divergence in the impact of variants on β1-tubulin
      incorporation into microtubules and on platelet function.
    explanation: Explicitly identifies the divergence.
- discussion_id: gap_tubb1_platelet_thyroid_tissue_penetrance
  prompt: >-
    Do tissue-specific thresholds or modifiers partition thyroid dysgenesis and
    macrothrombocytopenia among carriers of the same TUBB1 alleles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Variant-Specific Disruption of Beta-1 Tubulin
  - pathophysiology#p.Arg318Trp-Associated Thyroid Cell Proliferation Defect
  rationale: >-
    The four p.Arg318Trp thyroid-agenesis cases in the 2025 cohort had normal
    platelets, while platelet cohorts have not systematically established the
    prevalence of thyroid dysgenesis.
  evidence:
  - reference: PMID:40071799
    reference_title: Genetic and functional analysis of TUBB1 variants in congenital hypothyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these 4 patients in our study cohort displayed normal platelets
    explanation: Documents the thyroid phenotype without a platelet phenotype.
- discussion_id: gap_tubb1_myeloid_malignancy_generalizability
  prompt: >-
    Does impaired p53-dependent DNA-damage surveillance confer meaningful
    myeloid-malignancy risk across TUBB1 disease or only in particular families?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Attenuated DNA-Damage Response in TUBB1-Deficient Cells
  rationale: >-
    Myeloid malignancy and p.Thr149Pro were identified together in one family;
    no cited cohort establishes penetrance or excess risk.
  evidence:
  - reference: PMID:30854628
    reference_title: TUBB1 dysfunction in inherited thrombocytopenia causes genome instability.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing of a family with thrombocytopenia and
      myeloid malignancy and identified a novel TUBB1 variant, T149P.
    explanation: Establishes the family observation but not general risk.
notes: >-
  Reviewed 2026-08-26. The disease term is specifically the isolated platelet
  disorder. Thyroid dysgenesis is retained as a replicated, incompletely
  penetrant allelic association rather than made part of the disease identity.

  A universal LOSS_OF_FUNCTION label was removed because assayed alleles differ
  in incorporation, abundance, and zygosity. Abnormal platelet function is also
  explicitly variant- and cohort-dependent.

  Unsupported treatment claims were removed. The cited studies do not directly
  establish immune-thrombocytopenia treatment avoidance, thyroid screening, or
  levothyroxine recommendations for this disorder.

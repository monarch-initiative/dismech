discussions:
- discussion_id: gap_tubb1_platelet_thyroid_tissue_selectivity
  prompt: >-
    Why do TUBB1 variants affect platelets and thyroid, and does every individual
    with TUBB1-related macrothrombocytopenia carry a thyroid phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Thyroid Migration and Hormone Secretion
  - pathophysiology#Loss of the Platelet Marginal Microtubule Band
  rationale: >-
    The two phenotypes were discovered from opposite directions - the platelet
    one from a haematology family, the thyroid one from a congenital
    hypothyroidism cohort - and the literature has not systematically looked for
    each in patients ascertained for the other. The thyroid cohort study did
    check platelets and found macroplatelets and agonist hyperaggregation, so
    thyroid-ascertained patients do have the platelet phenotype. The converse is
    untested: whether individuals ascertained for macrothrombocytopenia have
    subclinical thyroid dysgenesis is unknown, and it matters clinically, because
    untreated congenital hypothyroidism has neurodevelopmental consequences that a
    mild platelet finding does not. It is also unclear whether particular variants
    partition between the two tissues or whether all TUBB1 variants affect both
    with different thresholds. A prospective thyroid assessment of a
    TUBB1-macrothrombocytopenia cohort would resolve the clinically urgent half of
    this.
  evidence:
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, TUBB1 mutations caused the formation of macroplatelets and
      hyperaggregation of human platelets after stimulation by low doses of
      agonists.
    explanation: >-
      Shows the thyroid-ascertained patients also have the platelet phenotype -
      the direction that has been tested.
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data highlight unexpected roles for β1-tubulin in thyroid development
      and in platelet physiology.
    explanation: >-
      The authors frame the dual role as unexpected, which is why the reciprocal
      screening has not been done.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

  Deliberately NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure: there is no neural phenotype.
  It is in the knowledge base because it is a tubulin isotype disease.

  functional_impact_category is LOSS_OF_FUNCTION rather than the
  DOMINANT_NEGATIVE used for TUBA1A, TUBB3 and TUBB8. The distinction is
  evidenced, not stylistic: mutant beta-1 tubulin is NOT incorporated into
  microtubules, whereas the dominant-negative tubulins are incorporated and
  poison the polymer from inside. The observed fall in alpha-tubulin expression
  leaves open whether a sequestration component is also present; that
  qualification is recorded in the genetic_context description.

  All evidence snippets are quoted from cached abstracts.

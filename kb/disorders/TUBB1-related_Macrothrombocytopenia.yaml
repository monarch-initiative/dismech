pathophysiology:
- name: Altered Platelet Beta-1 Tubulin (TUBB1) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Variants alter beta-1 tubulin, the class VI beta-tubulin restricted to the
    megakaryocyte-platelet lineage and also expressed in thyroid. The p.F260S
    variant sits at the alpha/beta intradimer interface, and the functional
    consequence is loss of incorporation rather than a subtle change in dynamics:
    mutant beta-1 tubulin is not incorporated into microtubules with endogenous
    alpha-tubulin at all, and alpha-tubulin expression falls in transfected cells.
    Independently, three thyroid dysgenesis-associated TUBB1 variants were shown
    to produce non-functional alpha/beta dimers that cannot be incorporated into
    microtubules - the same failure mode reached from a different phenotype.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Heterozygous missense variants whose product does not incorporate into
      microtubules. LOSS_OF_FUNCTION describes the mutant subunit's own activity,
      which is directly evidenced - it is not incorporated, and the dimers it
      forms are non-functional. Note this is a different mechanism class from the
      dominant-negative poisoning resolved for TUBA1A and TUBB8, where the mutant
      subunit DOES enter the polymer and degrades it from within. Whether the
      residual haploid dose alone explains the platelet phenotype, or whether
      sequestration of alpha-tubulin adds a dominant-negative component, is not
      settled; the observed fall in alpha-tubulin expression in transfected cells
      is suggestive of the latter.

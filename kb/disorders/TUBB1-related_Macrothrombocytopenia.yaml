name: TUBB1-related Macrothrombocytopenia
creation_date: "2026-08-20T17:15:00Z"
category: Mendelian
disease_term:
  preferred_term: macrothrombocytopenia, isolated, 1, autosomal dominant
  term:
    id: MONDO:0800047
    label: macrothrombocytopenia, isolated, 1, autosomal dominant
description: >-
  TUBB1-related macrothrombocytopenia is the haematological tubulinopathy. TUBB1
  encodes beta-1 tubulin, a class VI beta-tubulin whose expression is essentially
  confined to the megakaryocyte-platelet lineage, where it builds the
  circumferential marginal microtubule band that gives a resting platelet its
  discoid shape and that is drawn out into proplatelets during platelet
  production.

  Heterozygous variants disrupt that band. In affected individuals the
  circumferential marginal band is undetectable and platelet microtubules are
  frayed and disorganized. The mechanistic step is failure of incorporation:
  mutant beta-1 tubulin is not incorporated into microtubules with endogenous
  alpha-tubulin, and in transduced megakaryocytes proplatelet formation is
  diminished, producing fewer but larger proplatelet tips. The result is the
  clinical picture - a reduced number of abnormally large platelets - which is
  usually mild and is frequently discovered incidentally or mistaken for immune
  thrombocytopenia.

  A second, unexpected phenotype belongs to the same gene. TUBB1 is expressed in
  the developing and adult thyroid, and TUBB1 variants co-segregate with
  congenital hypothyroidism due to thyroid dysgenesis, accounting for about 1.1%
  of one thyroid dysgenesis cohort. Tubb1 knockout mice show impaired thyroid
  migration and thyroid hormone secretion. A platelet gene that also patterns the
  thyroid is not obvious a priori, and it means a TUBB1 finding on a
  thrombocytopenia panel has an endocrine implication.
parents:
- hereditary disease
- blood platelet disease

treatments:
- name: Avoidance of misdirected immune thrombocytopenia therapy
  description: >-
    The most consequential management decision is a negative one. An inherited
    macrothrombocytopenia is structurally, not immunologically, caused, so
    corticosteroids, immunoglobulin and splenectomy are ineffective and carry
    their own harms. Recognising the marginal-band defect prevents that pathway.
    Management is otherwise expectant, with platelet support reserved for surgery
    or bleeding.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24344610
    reference_title: TUBB1 mutation disrupting microtubule assembly impairs proplatelet formation and results in congenital macrothrombocytopenia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deficient functional microtubules might lead to defective proplatelet
      formation and abnormal protrusion-like platelet release, resulting in
      congenital macrothrombocytopenia.
    explanation: >-
      Establishes the congenital, structural aetiology that makes immune-directed
      therapy inappropriate.
- name: Thyroid function assessment and hormone replacement
  description: >-
    Because TUBB1 variants also cause thyroid dysgenesis, thyroid function should
    be assessed when a TUBB1 variant is identified, with levothyroxine
    replacement if congenital hypothyroidism is present.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT

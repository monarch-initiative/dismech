name: TUBB1-related Macrothrombocytopenia
creation_date: "2026-08-20T17:15:00Z"
category: Mendelian
disease_term:
  preferred_term: macrothrombocytopenia, isolated, 1, autosomal dominant
  term:
    id: MONDO:0800047
    label: macrothrombocytopenia, isolated, 1, autosomal dominant
description: >-
  TUBB1-related macrothrombocytopenia is an inherited platelet disorder caused
  by functionally consequential TUBB1 variants. Beta-1 tubulin is the
  predominant beta-tubulin isoform in megakaryocytes and platelets. It supports
  proplatelet formation and the marginal microtubule ring that maintains
  platelet shape. Pathogenic alleles can alter incorporation or abundance of
  beta-1 tubulin, disrupt the marginal ring and late platelet maturation, and
  produce lifelong macrothrombocytopenia or isolated platelet enlargement.

  The disorder is usually heterozygous with autosomal dominant transmission,
  but platelet-trait penetrance is incomplete. One p.Gly109Glu pedigree showed
  a clear allele-burden effect: macrothrombocytopenia occurred in homozygotes,
  whereas heterozygotes generally had only enlarged or normal platelets.
  Bleeding was mild or absent in most individuals in the largest cohort, and
  automated counters can underestimate platelet number when platelets are very
  large.

  Platelet-function effects are not uniform. Hyperaggregation or impaired
  agglutination and release has been reported in particular families, whereas
  several other variants had negligible effects on activation, secretion,
  aggregation, or spreading. Separately, heterozygous TUBB1 variants have been
  associated with congenital hypothyroidism due to thyroid dysgenesis. This is
  recorded as an incompletely penetrant allelic association rather than a core
  feature of the MONDO-defined isolated platelet disorder: four
  thyroid-agenesis cases carrying p.Arg318Trp had normal platelets.
parents:
- hereditary disease
- blood platelet disease

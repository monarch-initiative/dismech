- name: Loss of the Platelet Marginal Microtubule Band
  biological_scale: CELLULAR
  description: >-
    The cellular lesion, and one that is directly visible: in every platelet from
    affected individuals the circumferential marginal microtubule band is
    undetectable and the microtubules are frayed and disorganized. In
    megakaryocytes the same defect diminishes proplatelet formation, producing
    fewer but larger proplatelet tips - which is exactly the shape of the clinical
    phenotype, fewer and larger platelets.
  cell_types:
  - preferred_term: megakaryocyte

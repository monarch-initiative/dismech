  experimental_model_type: CELL_LINE
  description: >-
    CHO cells expressing wild-type or mutant TUBB1 compare beta-1-tubulin
    incorporation and distribution, but do not reproduce megakaryocyte biology.
  publication: PMID:34516618
  modeled_mechanisms:
  - target: Variant-Specific Disruption of Beta-1 Tubulin
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Compares molecular effects across multiple missense variants.
    limitations: CHO cells are neither human nor megakaryocytic and use overexpression.
    evidence:
    - reference: PMID:34516618
      reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transfection of TUBB1 missense variants in CHO cells altered β1-tubulin
        incorporation into the microtubular network.
      explanation: Establishes the model and molecular readout.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection of TUBB1 missense variants in CHO cells altered β1-tubulin
      incorporation into the microtubular network.
    explanation: Establishes the transfected-cell model.
- name: Patient-derived CD34-positive megakaryocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Peripheral-blood CD34-positive cells from carriers were differentiated into
    megakaryocytes to test maturation and proplatelet formation.
  publication: PMID:34516618
  modeled_mechanisms:
  - target: Marginal-Ring and Platelet-Maturation Defect
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Reproduces impaired maturation and proplatelet formation.
    limitations: >-
      In-vitro formation does not fully represent platelet release in vivo, and
      results differed by carrier phenotype.
    evidence:
    - reference: PMID:34516618
      reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TUBB1 variants markedly impaired proplatelet formation from peripheral
        blood CD34+ cell-derived megakaryocytes.
      explanation: States the model's principal phenotype.
  evidence:
  - reference: PMID:34516618
    reference_title: Expanding the genetic spectrum of TUBB1-related thrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TUBB1 variants markedly impaired proplatelet formation from peripheral
      blood CD34+ cell-derived megakaryocytes.
    explanation: Establishes the patient-derived model.
- name: p.Arg318Trp-transfected human thyroid cells
  experimental_model_type: CELL_LINE
  description: >-
    Immortalized Nthy-ori 3.1 thyroid cells expressing p.Arg318Trp were assayed
    for TUBB1 abundance, proliferation, and scratch-wound migration.
  publication: PMID:40071799
  modeled_mechanisms:
  - target: p.Arg318Trp-Associated Thyroid Cell Proliferation Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Reproduces reduced abundance and proliferation, but not significant migration.
    limitations: >-
      An immortalized, plasmid-transfected line does not model embryonic thyroid
      morphogenesis; the scratch assay lacks a matrix environment.
    evidence:
    - reference: PMID:40071799
      reference_title: Genetic and functional analysis of TUBB1 variants in congenital hypothyroidism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional experimental results indicated that the c.952C>T mutant
        dominantly affects gene expression and proliferation of thyroid cells.
      explanation: Supports the expression and proliferation readouts.
  evidence:
  - reference: PMID:40071799
    reference_title: Genetic and functional analysis of TUBB1 variants in congenital hypothyroidism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We performed real-time polymerase chain reaction (RT-PCR), western blot,
      Cell Counting Kit 8 (CCK8), and wound healing assay to evaluate the effect
      of TUBB1 c.952C>T on gene expression, cell proliferation, and migration.
    explanation: Defines the model and assays.
- name: TUBB1-deficient DNA-damage cell model
  experimental_model_type: OTHER

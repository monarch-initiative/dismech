    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A circumferential marginal microtubule band was undetectable, whereas
      microtubules were frayed and disorganized in every platelet from the
      affected individuals.
    explanation: >-
      The direct cytological observation in patient platelets that defines this
      node.
  - reference: PMID:24344610
    reference_title: TUBB1 mutation disrupting microtubule assembly impairs proplatelet formation and results in congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transduction of mutant β1-tubulin into mouse fetal liver-derived
      megakaryocytes demonstrated no incorporation of mutant β1-tubulin into
      microtubules with endogenous α-tubulin and diminished proplatelet
      formation, leading to the production of fewer, but larger, proplatelet
      tips.
    explanation: >-
      Links the incorporation failure to the fewer-and-larger production defect
      that generates the clinical phenotype.
  downstream:
  - target: Macrothrombocytopenia
    description: Fewer, larger platelets in the circulation.
  - target: Abnormal Platelet Function
    description: >-
      Beyond number and size, platelet reactivity is altered - hyperaggregation
      to low-dose agonists is reported.
- name: Impaired Thyroid Migration and Hormone Secretion
  biological_scale: TISSUE
  description: >-
    The second tissue. TUBB1 is expressed in developing and adult thyroid in
    humans and mice, and Tubb1 knockout in mouse disrupts microtubule integrity by
    preventing beta-1 tubulin incorporation, impairing thyroid migration and
    thyroid hormone secretion. In humans, TUBB1 variants co-segregated with
    thyroid dysgenesis in three families, accounting for 1.1% of a thyroid
    dysgenesis cohort. This arm is why a TUBB1 result should prompt thyroid
    assessment rather than being read as a purely haematological finding.
  biological_processes:
  - preferred_term: thyroid gland development
    term:
      id: GO:0030878
      label: thyroid gland development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, Tubb1 knock-out disrupted microtubule integrity by preventing
      β1-tubulin incorporation and impaired thyroid migration and thyroid hormone
      secretion.
    explanation: >-
      In vivo evidence for the thyroid arm and its mechanistic identity with the
      platelet arm.
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified three novel TUBB1 gene mutations that co-segregated with TD
      in three distinct families leading to 1.1% of TUBB1 mutations in TD study
      cohort.
    explanation: >-
      Human genetic evidence linking TUBB1 to thyroid dysgenesis, with a cohort
      frequency.
  downstream:
  - target: Congenital Hypothyroidism
    description: Thyroid dysgenesis with consequent congenital hypothyroidism.
phenotypes:
- name: Macrothrombocytopenia
  description: >-
    A reduced platelet count with abnormally large platelets. Usually mild, often
    an incidental finding, and readily mistaken for immune thrombocytopenia -
    which matters, because that misdiagnosis leads to immunosuppressive treatment
    or splenectomy for a structural, inherited defect.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:24344610
    reference_title: TUBB1 mutation disrupting microtubule assembly impairs proplatelet formation and results in congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report describes a family with TUBB1-associated macrothrombocytopenia
      diagnosed based on abnormal platelet β1-tubulin distribution.
    explanation: Names the phenotype and how the family was ascertained.
- name: Large Platelets
  description: >-
    Increased platelet size, the "macro" half of macrothrombocytopenia, produced
    by the fewer-but-larger proplatelet tips of the defective megakaryocyte.
  phenotype_term:
    preferred_term: Giant platelets
    term:
      id: HP:0001902
      label: Giant platelets
  evidence:
  - reference: PMID:24344610
    reference_title: TUBB1 mutation disrupting microtubule assembly impairs proplatelet formation and results in congenital macrothrombocytopenia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      diminished proplatelet formation, leading to the production of fewer, but
      larger, proplatelet tips
    explanation: Reports the production defect that yields larger platelets.
- name: Abnormal Platelet Function
  description: >-
    Platelet reactivity is altered, not merely platelet number: TUBB1 variants
    caused macroplatelet formation and hyperaggregation of human platelets after
    stimulation by low doses of agonists.
  phenotype_term:
    preferred_term: Abnormal platelet function
    term:
      id: HP:0011869
      label: Abnormal platelet function
  evidence:
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, TUBB1 mutations caused the formation of macroplatelets and
      hyperaggregation of human platelets after stimulation by low doses of
      agonists.
    explanation: Documents functional hyperaggregation alongside the morphological defect.
- name: Congenital Hypothyroidism
  description: >-
    Congenital hypothyroidism due to thyroid dysgenesis, the second phenotype of
    this gene.
  phenotype_term:
    preferred_term: Congenital hypothyroidism
    term:
      id: HP:0000851
      label: Congenital hypothyroidism
  evidence:
  - reference: PMID:30446499
    reference_title: TUBB1 mutations cause thyroid dysgenesis associated with abnormal platelet physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic causes of congenital hypothyroidism due to thyroid dysgenesis
      (TD) remain largely unknown. We identified three novel TUBB1 gene mutations
      that co-segregated with TD in three distinct families
    explanation: Links TUBB1 variants to congenital hypothyroidism from thyroid dysgenesis.

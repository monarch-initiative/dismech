      term:
        id: HP:0002376
        label: Developmental regression
    evidence:
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epileptic encephalopathy with spike-wave activation in sleep (EE-SWAS) is
          a rare syndrome associated with cognitive and behavioural regression.
        explanation: >-
          States the regression that defines the syndrome and that the trial's
          primary outcome was designed to capture.
  - category: Neurologic
    name: Intellectual disability
    description: >-
      Cognitive impairment, either pre-existing in the DEE-SWAS arm or acquired

    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although developmental regression patterns were similar in both
          syndromes, DEE-SWAS was associated with a longer duration of epilepsy and
          poorer intellectual outcome than EE-SWAS.
        explanation: >-
          Documents the intellectual outcome and its difference between the two
          arms.
  - category: Neurologic
    name: Language regression
    description: >-
      When the activation involves perisylvian cortex the loss is of language,
      which in its purest form is the Landau-Kleffner presentation: an acquired
      auditory agnosia in a child who had been speaking normally.
    phenotype_term:
      preferred_term: Aphasia
      term:
        id: HP:0002381
        label: Aphasia
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Several pediatric seizure disorders have common electrophysiological
          features during slow-wave sleep that produce different syndromes based on
          which part of the developing brain is involved.
        explanation: >-
          States the topographic principle that makes language the affected domain
          when perisylvian cortex carries the activation.
  - category: Behavioral
    name: Behavioural disturbance and attentional impairment

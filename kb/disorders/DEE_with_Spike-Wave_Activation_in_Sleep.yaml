name: Developmental and Epileptic Encephalopathy with Spike-Wave Activation in Sleep
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A childhood epilepsy syndrome whose defining lesion is not a seizure type but a
  sleep state. Epileptiform discharge that is sparse or absent while the child is
  awake becomes near-continuous once non-rapid-eye-movement sleep begins, and the
  child loses skills already acquired: language, attention, behaviour, or general
  cognition depending on which cortex is involved. Seizures are often mild and
  are not what does the damage. The syndrome is developmentally gated, appearing
  in mid-childhood and remitting spontaneously around adolescence whether or not
  it is treated, while the cognitive losses may not recover. Causes are
  heterogeneous, split roughly between genetic variants and early structural
  injury to the thalamus. The ILAE splits the syndrome by baseline development:
  DEE-SWAS in children already developmentally delayed, EE-SWAS in children whose
  development was normal until the regression.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - DEE-SWAS
  - EE-SWAS
  - D/EE-SWAS
  - continuous spike-and-wave during sleep
  - CSWS
  - electrical status epilepticus in sleep
  - ESES

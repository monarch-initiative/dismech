        snippet: >-
          In this paper, we describe the childhood onset epilepsy syndromes, most
          of which have both mandatory seizure type(s) and interictal
          electroencephalographic (EEG) features.
        explanation: >-
          Establishes that the ILAE defines these syndromes by mandatory seizure

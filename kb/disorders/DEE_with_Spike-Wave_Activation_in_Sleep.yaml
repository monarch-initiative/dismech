notes: >-
  Scope note. This entry models DEE-SWAS and EE-SWAS as one mechanism with two
  clinical framings rather than as two diseases. The ILAE distinguishes them only
  by whether development was already impaired before the spike-wave activation
  began, which is a statement about the baseline rather than about the process,
  and the mechanism graph is identical for both. Whether that boundary is the
  right one is curated as an explicit discussion rather than settled here, since
  the two arms do differ in how often an etiology is found and in outcome. The
  older names, continuous spike-and-wave during sleep and electrical status
  epilepticus in sleep, are retained as synonyms because most of the mechanistic
  literature this entry cites uses them.

  On the central causal claim. The syndrome's name assumes the epileptiform
  activation causes the regression. This entry does model that edge, but treats
  it as contested rather than established, because the alternative reading, in
  which the sleep activation and the regression are parallel consequences of one
  lesion, has not been excluded and carries different treatment implications. The
  relevant randomized evidence is curated with its limitations attached.

  Sourcing note. The entry was drafted from the ILAE position paper, the
  etiological cohort, the thalamic-lesion physiology series, and the randomized
  trial, then cross-checked against a deep-research report generated with the
  claude_code provider and committed here as
  research/DEE_with_Spike-Wave_Activation_in_Sleep-deep-research-claude_code.md.
  The cross-check prompted the subtype split recorded above and the discussion on
  why corticosteroids work. One of its recommendations was deliberately declined:
  it supplied competing numeric spike-wave index thresholds from the literature,
  and rather than curate a number this entry states in the diagnosis record that
  no threshold is asserted, because the thresholds disagree and quoting one would
  imply a consensus that does not exist.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance. The graph joins the module at the
  hyperexcitability node rather than at its ion-channel trigger, because the
  most-studied route into this syndrome is a structural thalamic lesion rather
  than a channel defect, and because the state-dependence is the part the generic
  module does not capture at all: what is unusual here is not that cortex is
  excitable but that it is excitable only in a particular sleep stage.
has_subtypes:
  - name: DEE-SWAS
    display_name: Developmental and epileptic encephalopathy with spike-wave activation in sleep
    description: >-
      The arm in which development was already impaired before the spike-wave
      activation began, so the child has both a developmental encephalopathy and
      an epileptic one. It behaves differently from its sibling arm in two ways
      that a mere difference in starting point does not obviously predict: an
      etiology is found roughly two thirds of the time, more than twice as often
      as in EE-SWAS, and the epilepsy runs longer with a poorer intellectual
      outcome. Whether that makes it a distinct entity is an open question curated
      in the discussions block.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified the etiology in 42/91 (46%) patients in our Core cohort,
          including 29/44 (66%) with DEE-SWAS and 13/47 (28%) with EE-SWAS.
        explanation: >-
          Quantifies the etiological yield in this arm and the contrast with the
          other, which is the strongest evidence that the split tracks something
          real.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although developmental regression patterns were similar in both
          syndromes, DEE-SWAS was associated with a longer duration of epilepsy and
          poorer intellectual outcome than EE-SWAS.
        explanation: >-
          Documents the worse course of this arm alongside the shared regression
          process.
  - name: EE-SWAS
    display_name: Epileptic encephalopathy with spike-wave activation in sleep
    description: >-
      The arm in which development was normal until the regression, so the
      encephalopathy is purely epileptic in the sense that the child had nothing
      wrong before it started. An etiology is found in only about a quarter of
      these children, and the intellectual outcome is better than in DEE-SWAS.
      Landau-Kleffner syndrome is the best-known presentation within this arm,
      distinguished by the activation sitting over perisylvian language cortex so
      that the regression is specifically an acquired auditory agnosia. This is
      the arm the randomized treatment evidence was generated in.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified the etiology in 42/91 (46%) patients in our Core cohort,
          including 29/44 (66%) with DEE-SWAS and 13/47 (28%) with EE-SWAS.
        explanation: >-
          Quantifies the much lower etiological yield in this arm, which is what
          makes the label practically useful when deciding how hard to investigate.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epileptic encephalopathy with spike-wave activation in sleep (EE-SWAS) is
          a rare syndrome associated with cognitive and behavioural regression.
        explanation: >-
          Confirms that the randomized treatment evidence in this entry was
          generated specifically in this arm, which is a limit on generalizing it
          to DEE-SWAS.
inheritance:
  - name: Heterogeneous, mostly de novo genetic or non-genetic
    description: >-
      There is no single inheritance pattern. A genetic cause is found in about a
      third of patients, spread across many genes rather than concentrated in one,
      with channelopathies and transcriptional regulators prominent. A comparable
      share have an acquired structural cause, chiefly perinatal thalamic injury,
      which is not heritable at all. Counselling therefore depends entirely on
      which arm a given child falls into, and in over half of cases no cause is
      identified.
    inheritance_term:
      preferred_term: Sporadic
      term:
        id: HP:0003745
        label: Sporadic
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A genetic etiology was identified in 31/91 (34%).
        explanation: >-
          Quantifies the genetic share, and by implication the majority in which a
          Mendelian inheritance pattern cannot be offered.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          DEE-SWAS and EE-SWAS have highly heterogeneous genetic and structural
          etiologies.
        explanation: >-
          States the etiological heterogeneity that makes a single inheritance
          statement impossible for this syndrome.
  - name: Autosomal dominant, usually de novo
    description: >-
      Most of the identified genetic causes are autosomal genes in which a single
      variant is sufficient, and the variants are typically de novo rather than
      inherited, which is why the family history is usually blank. The
      counselling consequence is that recurrence risk for siblings is low but not
      zero, because parental gonadal mosaicism cannot be excluded.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 10 novel D/EE-SWAS genes with a range of functions:
          ATP1A2, CACNA1A, FOXP1, GRIN1, KCNMA1, KCNQ3, PPFIA3, PUF60, SETD1B, and
          ZBTB18, and 2 novel copy number variants, 17p11.2 duplication and 5q22
          deletion.
        explanation: >-
          The named genes are autosomal and are established dominant
          developmental-disorder genes, which is the basis for curating an
          autosomal dominant block. Marked PARTIAL because the cited abstract lists
          the genes without stating the inheritance mode for each, so the mode is
          inferred from the genes rather than quoted.
  - name: X-linked
    description: >-
      A minority of cases arise from X-linked genes, which matters
      disproportionately for counselling because the recurrence risk and the
      pattern of who is affected differ completely from the autosomal forms. CNKSR2
      is the best-known example in this syndrome.
    inheritance_term:
      preferred_term: X-linked inheritance
      term:
        id: HP:0001417
        label: X-linked inheritance
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          DEE-SWAS and EE-SWAS have highly heterogeneous genetic and structural
          etiologies.
        explanation: >-
          Supports genetic heterogeneity broad enough to include X-linked causes.
          Marked PARTIAL because the abstract does not name an X-linked gene, so
          this block records the counselling-relevant possibility rather than
          quoting a demonstration of it, and the X-linked genes named in the wider
          literature are not asserted here without verifiable snippets.
genetic:
  - name: GRIN2A
    gene_term:
      preferred_term: GRIN2A
      term:
        id: hgnc:4585
        label: GRIN2A
    relationship_type: CAUSATIVE
    association: >-
      The longest-established gene for this syndrome, encoding an NMDA receptor
      subunit. It sits in the channelopathy group that the cohort analysis found
      to be functionally enriched, and it is the gene for which a
      mechanism-directed therapy is most plausible, since the direction of the
      functional change determines whether receptor blockade would help or harm.
    evidence:
      - reference: PMID:30544257
        reference_title: >-
          GRIN2A-related disorders: genotype and functional consequence predict
          phenotype.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          misTMD+Linker predominantly led to NMDAR gain-of-function, while
          misATD+LBD exclusively caused NMDAR loss-of-function
        explanation: >-
          Names this gene directly and establishes that the functional direction
          depends on which domain the variant hits, which is the fact that makes
          receptor-directed therapy conceivable and also potentially harmful in the
          wrong direction. Tagged IN_VITRO because this is receptor
          electrophysiology, with the null-variant arm measured in rodent cortical
          neurons, so the provenance of the entry's precision-therapy reasoning is
          bench data rather than a clinical observation.
      - reference: PMID:30544257
        reference_title: >-
          GRIN2A-related disorders: genotype and functional consequence predict
          phenotype.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          pathogenic missense variants in transmembrane and linker domains
          (misTMD+Linker) were associated with severe developmental phenotypes,
          whereas missense variants within amino terminal or ligand-binding domains
          (misATD+LBD) and null variants led to less severe developmental
          phenotypes
        explanation: >-
          Establishes the genotype-phenotype relationship within this gene, which
          is why gene identity alone under-predicts severity here.
      - reference: PMID:30544257
        reference_title: >-
          GRIN2A-related disorders: genotype and functional consequence predict
          phenotype.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This new pathomechanistic model may ultimately help in predicting
          phenotype severity as well as eligibility for potential precision
          medicine approaches in GRIN2A-related disorders
        explanation: >-
          Records the precision-therapy prospect without asserting a drug. Marked
          PARTIAL because it states a possibility rather than a demonstrated
          treatment, which is the honest strength of this claim today.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          D/EE-SWAS genes were highly co-expressed in brain, highlighting the
          importance of channelopathies and transcriptional regulators.
        explanation: >-
          Places the gene class this record belongs to at the centre of the
          syndrome's genetics. Marked PARTIAL because it does not name GRIN2A
          itself, so it supports the class rather than the gene.
  - name: Expanding gene set identified by cohort sequencing
    gene_term:
      preferred_term: GRIN1
      term:
        id: hgnc:4584
        label: GRIN1
    relationship_type: CAUSATIVE
    association: >-
      No single gene dominates. A recent cohort added ten genes at once, spanning
      ion channels, a sodium-potassium pump subunit, chromatin modifiers, and
      transcription factors, plus two recurrent copy number variants, and the
      genes cluster by brain co-expression rather than by pathway membership.
      GRIN1 is named as the representative because it appears in the quoted list
      and, like GRIN2A, encodes an NMDA receptor subunit, so it connects this set
      to the best-characterized arm of the syndrome's genetics. The gene list
      should be read as open rather than settled. X-linked causes exist and are
      counselling-relevant, but they are recorded in the inheritance block rather
      than given a gene record here, because no X-linked gene is named in a source
      cached for this entry.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 10 novel D/EE-SWAS genes with a range of functions:
          ATP1A2, CACNA1A, FOXP1, GRIN1, KCNMA1, KCNQ3, PPFIA3, PUF60, SETD1B, and
          ZBTB18, and 2 novel copy number variants, 17p11.2 duplication and 5q22
          deletion.
        explanation: >-
          Enumerates the newly added genes and copy number variants, and shows the
          list is still growing, which is why this record is framed as a set rather
          than as a gene.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A genetic etiology was identified in 31/91 (34%).
        explanation: >-
          Quantifies how much of the syndrome this expanding gene set currently
          accounts for.
pathophysiology:
  - name: Heterogeneous Genetic Etiology
    biological_scale: MOLECULAR
    description: >-
      About a third of patients have an identifiable genetic cause, but it is
      spread thinly: no single gene dominates, and the genes implicated cluster
      functionally rather than positionally, into ion channels and transcriptional
      regulators that are highly co-expressed in brain. GRIN2A is the
      longest-associated, and a recent cohort added ten more with functions
      ranging from sodium-potassium pump subunits to chromatin modifiers. The
      practical consequence is that gene identity predicts less here than the
      converging network output does.
    genes:
      - preferred_term: GRIN2A
        term:
          id: hgnc:4585
          label: GRIN2A
    biological_processes:
      - preferred_term: regulation of postsynaptic membrane potential
        term:
          id: GO:0060078
          label: regulation of postsynaptic membrane potential
        modifier: ABNORMAL
    downstream:
      - target: Abnormal Frequency-Dependent Cortical Excitability
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          D/EE-SWAS genes were highly co-expressed in brain, highlighting the
          importance of channelopathies and transcriptional regulators.
        explanation: >-
          Establishes the functional convergence of an otherwise scattered gene
          list, which is why this node is modeled as one etiological class rather
          than as many.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 10 novel D/EE-SWAS genes with a range of functions:
          ATP1A2, CACNA1A, FOXP1, GRIN1, KCNMA1, KCNQ3, PPFIA3, PUF60, SETD1B, and
          ZBTB18, and 2 novel copy number variants, 17p11.2 duplication and 5q22
          deletion.
        explanation: >-
          Enumerates the breadth of the genetic contribution and shows it is still
          expanding, which is the reason no single gene is named as the cause.
  - name: Early Thalamic Injury
    biological_scale: TISSUE
    description: >-
      The best-characterized route into this syndrome is not genetic at all. A
      perinatal thalamic lesion, typically unilateral, accounts for roughly one in
      seven cases and is the single commonest identifiable cause. The damage is
      concentrated in medial and dorsal nuclei and spares the ventral thalamus, a
      distribution that matters because it disconnects association cortex while
      leaving the machinery that generates sleep spindles intact. The child is
      often neurologically unremarkable for years before the electroencephalogram
      changes.
    locations:
      - preferred_term: dorsal plus ventral thalamus
        term:
          id: UBERON:0001897
          label: dorsal plus ventral thalamus
    downstream:
      - target: Selective Thalamocortical Disconnection
    evidence:
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Early neonatal thalamic lesions account for about 14% of continuous
          spike-wave of sleep (CSWS) syndrome, representing the most common
          etiology in this epileptic encephalopathy in children
        explanation: >-
          Establishes the frequency and the standing of this etiology, which is
          why it is modeled as a root node rather than as a rare variant.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Thalamic volume loss ranged from 19% to 94%, predominantly on medial and
          dorsal nuclei and sparing the ventral thalamus.
        explanation: >-
          Documents the nuclear distribution of the damage asserted by this node.
  - name: Selective Thalamocortical Disconnection
    biological_scale: TISSUE
    description: >-
      What the thalamic lesion produces is not a general loss of thalamic function
      but a selective severing of thalamic-cortical fibres on one side, with
      ipsilateral white matter loss. The selectivity is the point. Sleep spindles
      are preserved and the waking electroencephalogram is only mildly affected,
      so the rhythmic drive that normally organizes non-rapid-eye-movement sleep
      still arrives at a cortex that has lost its normal thalamic regulation. The
      continuous sleep spiking then appears on the side of the lesion, which is
      the observation tying the anatomy to the electrophysiology.
    locations:
      - preferred_term: cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
    downstream:
      - target: Abnormal Frequency-Dependent Cortical Excitability
    evidence:
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Unilateral selective thalamic-cortical disconnection is a common feature
          in our patients and is associated with both a focal pattern of CSWS and a
          pathological type of frequency-dependent excitability (peak: 10-20Hz).
        explanation: >-
          States the disconnection and links it to both the electrographic pattern
          and the excitability abnormality downstream.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Impact on EEG rhythms was mild, with a volume-loss-related decrease in
          alpha power and preservation of sleep spindles.
        explanation: >-
          Documents the preserved spindle machinery, which is what makes the
          selectivity of the disconnection mechanistically load-bearing.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The sleep continuous spiking was lateralized to the hemisphere with the
          lesion.
        explanation: >-
          Ties the electrographic abnormality to the side of the anatomical lesion,
          which is the strongest available evidence that this edge is causal.
  - name: Abnormal Frequency-Dependent Cortical Excitability
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Cortex that has lost thalamic regulation acquires an abnormal response to
      being driven at particular rates. Probing visual cortex in patients with
      posterior spiking reveals excitability that peaks when stimulation is
      delivered at ten to twenty hertz on the side of the lesion. This is the
      augmenting response, a form of synaptic potentiation that is absent from
      cortico-cortical interactions in intact animals and emerges after the
      thalamus is ablated. It is a state of latent, frequency-tuned potentiation
      rather than continuous overexcitation, which is why the child can look
      electrically normal while awake.
    cell_types:
      - preferred_term: pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    biological_processes:
      - preferred_term: regulation of synaptic plasticity
        term:
          id: GO:0048167
          label: regulation of synaptic plasticity
        modifier: ABNORMAL
    downstream:
      - target: Sleep-Potentiated Spike-Wave Activation
    evidence:
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Visual cortex stimulation in five patients with posterior cortex spiking
          revealed an abnormal frequency-dependent excitability at 10-20Hz on the
          side of the lesion.
        explanation: >-
          The direct human measurement of the abnormal excitability this node
          asserts, with lateralization to the lesion as an internal control.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We propose that this excitability represents an abnormal synaptic
          plasticity previously described as the augmenting response.
        explanation: >-
          Names the mechanism. Framed as a proposal by the authors, which is why
          this node describes a well-measured phenomenon with a proposed identity
          rather than an established one.
  - name: Sleep-Potentiated Spike-Wave Activation
    biological_scale: ORGANISM
    description: >-
      Two things coincide in non-rapid-eye-movement sleep and neither is
      sufficient alone: brainstem activation falls away, which is the condition
      under which the augmenting response is strongest, and sleep spindles supply
      rhythmic drive in precisely the frequency band the cortex has become
      abnormally responsive to. The result is that discharge which was
      intermittent or absent in wakefulness becomes near-continuous once the child
      falls asleep. This state-dependence is the defining feature of the syndrome
      and the reason a routine waking electroencephalogram can be reported as
      normal.
    biological_processes:
      - preferred_term: sleep
        term:
          id: GO:0030431
          label: sleep
    downstream:
      - target: Disruption of Sleep-Dependent Synaptic Plasticity
      - target: Focal and Atypical Absence Seizures
      - target: Age-Dependent Remission of the Electrographic Pattern
    evidence:
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Because this response is potentiated by sleep states of reduced brainstem
          activation and by appropriate stimulating rhythms, such as sleep
          spindles, the simultaneous occurrence of these two factors in
          nonrapid-eye-movement sleep is proposed as an explanation for CSWS in our
          patients.
        explanation: >-
          States the two-factor account of state-dependence that this node encodes,
          explicitly as a proposal.
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These disorders, of which continuous spike-wave in slow-wave sleep and
          Landau-Kleffner are the most common, are characterized by continuous
          spike-wave activity during slow-wave sleep, developmentally regulated
          onset and termination of abnormal electrical activity, and loss of
          previously acquired skills.
        explanation: >-
          Establishes the three features this node and its two downstream nodes
          model: the sleep-locked activity, its developmental gating, and the skill
          loss.
  - name: Disruption of Sleep-Dependent Synaptic Plasticity
    biological_scale: CELLULAR
    description: >-
      Slow-wave sleep is not passive for a developing cortex. It is when synaptic
      strengths are rescaled and the day's experience is consolidated into
      developing cortical maps, and it does this during critical periods when
      those maps are still plastic. Occupying that window with continuous
      epileptiform discharge is the proposed mechanism by which an
      electroencephalographic abnormality becomes a cognitive one, and it explains
      why the deficit tracks which cortex is involved rather than seizure burden:
      perisylvian activation costs language, frontal activation costs attention
      and behaviour.
    cell_types:
      - preferred_term: pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    biological_processes:
      - preferred_term: regulation of synaptic plasticity
        term:
          id: GO:0048167
          label: regulation of synaptic plasticity
        modifier: ABNORMAL
    downstream:
      - target: Developmental Regression and Cognitive-Behavioural Encephalopathy
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The role of slow-wave sleep in normal cortical plasticity during
          developmental critical periods, how disruption of slow-wave sleep by
          electrographic seizures could affect cortical maps and development, and
          the organization and functional connectivity of the thalamic structures
          that when damaged are thought to produce these seizure disorders are
          reviewed.
        explanation: >-
          States the plasticity-disruption account this node encodes, and the
          critical-period framing that makes the developmental gating expected
          rather than puzzling.
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Over the last 20 years, a variety of basic science findings suggest how
          spike-wave activity during sleep can cause the observed clinical
          outcomes.
        explanation: >-
          Supports the causal direction from discharge to cognitive outcome. Marked
          PARTIAL because the source says basic science findings suggest how this
          could work, which is a mechanism sketch rather than a demonstration in
          patients, and that gap is the subject of a discussion in this entry.
  - name: Focal and Atypical Absence Seizures
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Clinical seizures do occur, typically focal seizures often arising from
      sleep and atypical absences, but they are frequently mild, sometimes absent
      entirely, and they are not what causes the regression. This is the feature
      that most distinguishes the syndrome from other developmental and epileptic
      encephalopathies, where seizure burden and cognitive outcome move together.
      A child can have this syndrome, and lose skills to it, with barely any
      seizures at all.
    evidence:
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epileptic encephalopathy with spike-wave activation in sleep (EE-SWAS) is
          a rare syndrome associated with cognitive and behavioural regression.
        explanation: >-
          Frames the syndrome by its cognitive rather than its seizure burden,
          which is the claim this node is qualifying. The trial's primary outcome
          was cognitive, not seizure control, for the same reason.
  - name: Age-Dependent Remission of the Electrographic Pattern
    biological_scale: ORGANISM
    description: >-
      The sleep activation switches itself off, usually around adolescence, and it
      does so whether or not treatment worked. That spontaneous termination is as
      developmentally regulated as the onset, and it is the single most important
      thing to understand about prognosis: the electroencephalogram will normalize
      on its own, but the cognitive ground lost while it was active may not be
      recovered. It is also why treatment is judged on cognition rather than on
      the eventual disappearance of the pattern, which would have happened anyway.
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These disorders, of which continuous spike-wave in slow-wave sleep and
          Landau-Kleffner are the most common, are characterized by continuous
          spike-wave activity during slow-wave sleep, developmentally regulated
          onset and termination of abnormal electrical activity, and loss of
          previously acquired skills.
        explanation: >-
          States the developmentally regulated termination that this node models,
          alongside the persisting skill loss that makes it a poor measure of
          treatment success.
  - name: Developmental Regression and Cognitive-Behavioural Encephalopathy
    biological_scale: ORGANISM
    description: >-
      The clinical endpoint and the reason the syndrome matters: loss of skills
      the child already had. Which skills depends on which cortex carries the
      activation, giving language regression, attentional and behavioural collapse,
      or global cognitive decline. Regression patterns are similar whether the
      child was developmentally normal beforehand or already delayed, but the
      eventual intellectual outcome is worse in the delayed group, which also has
      a longer duration of epilepsy.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although developmental regression patterns were similar in both
          syndromes, DEE-SWAS was associated with a longer duration of epilepsy and
          poorer intellectual outcome than EE-SWAS.
        explanation: >-
          Documents both the shared regression process and the outcome difference
          between the two arms, which is what this node asserts and what the
          nosology discussion turns on.
phenotypes:
  - category: Neurologic
    name: Spike-wave activation in sleep
    description: >-
      The defining electroencephalographic finding: epileptiform discharge that
      becomes near-continuous in non-rapid-eye-movement sleep while being sparse
      or absent in wakefulness. A routine waking recording can be normal, so the
      diagnosis requires a sleep study.
    phenotype_term:
      preferred_term: Continuous spike and waves during slow sleep
      term:
        id: HP:0031491
        label: Continuous spike and waves during slow sleep
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These disorders, of which continuous spike-wave in slow-wave sleep and
          Landau-Kleffner are the most common, are characterized by continuous
          spike-wave activity during slow-wave sleep, developmentally regulated
          onset and termination of abnormal electrical activity, and loss of
          previously acquired skills.
        explanation: >-
          Establishes the sleep-locked continuous discharge as the defining feature.
  - category: Neurologic
    name: Developmental regression
    description: >-
      Loss of previously acquired skills, which is the clinical event that defines
      the encephalopathy. The domain affected follows the topography of the
      epileptiform activation rather than the seizures.
    phenotype_term:

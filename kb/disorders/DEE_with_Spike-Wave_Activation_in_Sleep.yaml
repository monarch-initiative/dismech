prevalence:
  - population: Children with epilepsy
    measure_type: UNKNOWN
    prevalence_class: RARE
    notes: >-
      No population-based prevalence estimate is available. The syndrome is
      described as rare in the randomized trial literature, and its ascertainment
      depends on whether a sleep electroencephalogram is performed, since a waking
      record can be normal. That dependence makes any published rate a lower bound
      on the true one.
    evidence:
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Epileptic encephalopathy with spike-wave activation in sleep (EE-SWAS) is
          a rare syndrome associated with cognitive and behavioural regression.
        explanation: >-
          Supports the qualitative rarity band. Marked PARTIAL because it is a
          descriptor rather than a measurement, which is why no rate is asserted.
  - population: Children with continuous spike-wave of sleep
    measure_type: UNKNOWN
    prevalence_class: UNKNOWN
    notes: >-
      Within the syndrome, early neonatal thalamic lesions account for about 14
      percent of cases, making them the commonest single identifiable cause. This
      is an etiological fraction rather than a population rate.
    evidence:
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Early neonatal thalamic lesions account for about 14% of continuous
          spike-wave of sleep (CSWS) syndrome, representing the most common
          etiology in this epileptic encephalopathy in children
        explanation: >-
          Gives the etiological fraction reported in the notes.
progression:
  - phase: Onset of sleep activation with regression
    age_range: Mid-childhood
    notes: >-
      The electroencephalographic activation appears in mid-childhood, often after
      a period in which seizures alone were present and unremarkable, and the loss
      of skills follows. Because a waking recording can be normal, the interval
      between the regression starting and the diagnosis being made is frequently
      long.
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          developmentally regulated onset and termination of abnormal electrical
          activity, and loss of previously acquired skills
        explanation: >-
          States the developmentally regulated onset and the associated skill loss
          that define this phase.
  - phase: Spontaneous remission of the electrographic pattern with residual deficit
    age_range: Adolescence
    notes: >-
      The sleep activation resolves on its own around adolescence regardless of
      treatment. Cognitive recovery is variable and often incomplete, so the
      prognosis is set less by whether the pattern eventually stops, which it
      will, than by how long it ran and over which cortex.
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          developmentally regulated onset and termination of abnormal electrical
          activity, and loss of previously acquired skills
        explanation: >-
          Supports the developmentally regulated termination described in this
          phase.
treatments:
  - name: Corticosteroids
    description: >-
      The best-supported treatment, and unusually for this syndrome the support is
      randomized. In a head-to-head trial against clobazam, a quarter of children
      given corticosteroids gained at least eleven and a quarter intelligence
      quotient points at six months while none of the clobazam group did. The
      trial's other cognitive measure showed no difference, and it stopped early
      without reaching its target sample, so the result strengthens rather than
      settles the case for early steroid use. Either continuous oral prednisolone
      or pulsed intravenous methylprednisolone is used.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: prednisolone
          term:
            id: CHEBI:8378
            label: prednisolone
        - preferred_term: methylprednisolone
          term:
            id: CHEBI:6888
            label: 6alpha-methylprednisolone
    target_mechanisms:
      - target: Sleep-Potentiated Spike-Wave Activation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our findings strengthen those from previous uncontrolled studies that
          support the early use of corticosteroids for children with EE-SWAS.
        explanation: >-
          The trial's own summary of what its result licenses, which is the
          strength of recommendation this record encodes.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our data indicated an improvement in IQ outcomes with corticosteroids
          compared with clobazam treatment, but no difference was seen in cognitive
          sum score.
        explanation: >-
          Records the split result across the two co-primary cognitive measures.
          Marked PARTIAL because one measure showed benefit and the other did not.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The trial was terminated prematurely, and the target sample size was not
          met, so our findings must be interpreted with caution.
        explanation: >-
          Records the limitation the investigators attach to their own result,
          which is why this treatment is curated as best-supported rather than
          established.
  - name: Clobazam
    description: >-
      A benzodiazepine long used for this syndrome on observational grounds. When
      finally compared head to head with corticosteroids it did not produce the
      intelligence quotient gains that steroids did, though the two were
      indistinguishable on the other cognitive measure and in adverse event rates.
      It remains in use, but the trial removes the basis for treating it as
      equivalent first-line.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: clobazam
          term:
            id: CHEBI:31413
            label: clobazam
    target_mechanisms:
      - target: Sleep-Potentiated Spike-Wave Activation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          On the basis of mostly small observational and retrospective studies,
          corticosteroids and clobazam are often considered the most effective
          treatments for this syndrome.
        explanation: >-
          Establishes clobazam's standing as a conventional treatment and the weak
          evidence base that standing rested on.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Adverse events occurred in ten (45%) of 22 children who received
          corticosteroids, most frequently weight gain, and in 11 (52%) of 21
          children who received clobazam, most often fatigue and behavioural
          disturbances.
        explanation: >-
          Documents the adverse event profile of both arms, which is the other half
          of the comparison and shows the two did not differ on tolerability.
  - name: Avoidance of sodium channel blocking antiseizure medications
    description: >-
      Carbamazepine, oxcarbazepine, phenytoin, and phenobarbital can induce or
      worsen the sleep activation, which makes stopping them the cheapest
      intervention available in this syndrome and one that costs nothing to try.
      The trap is structural rather than careless: these children often have focal
      seizures, focal seizures are a standard indication for carbamazepine, and the
      sleep activation that the drug then aggravates is invisible unless someone
      records a sleep electroencephalogram.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:26415787
        reference_title: >-
          Encephalopathy with status epilepticus during sleep (ESES) induced by
          oxcarbazepine in idiopathic focal epilepsy in childhood.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cases of worsening or induction of ESES with phenytoin, carbamazepine and
          phenobarbital have been reported.
        explanation: >-
          Names three of the four drugs directly, which converts this record from
          an argument by omission into a directly evidenced management claim.
diagnosis:
  - name: Sleep electroencephalography
    description: >-
      The diagnostic test, and one that will be missed if only a waking recording
      is done. A sleep study, ideally whole-night, is required to demonstrate the
      activation, because the waking record can be normal or show only sparse
      discharge. Quantifying how much of non-rapid-eye-movement sleep is occupied
      is what turns the observation into a diagnosis. This entry deliberately does
      not assert a numeric spike-wave index threshold. Published thresholds differ,
      the ILAE definition cited here does not mandate one, and a curated number
      would give a false impression of consensus about who has this disease.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Marked activation of epileptiform discharge in non-rapid-eye-movement sleep
      relative to wakefulness, often near-continuous, and lateralized to the side
      of any structural lesion.
    evidence:
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Longitudinal whole-night and high-density electroencephalograms (EEGs)
          were performed, as well as detailed imaging and clinical evaluation.
        explanation: >-
          Documents whole-night recording as the method used to characterize the
          syndrome, which is the diagnostic standard this record describes.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The sleep continuous spiking was lateralized to the hemisphere with the
          lesion.
        explanation: >-
          Supports the lateralization described in the results field, which is what
          links the electrographic finding to a structural cause when one exists.
  - name: Brain MRI for thalamic and structural lesions
    description: >-
      Imaging is directed at the thalamus in particular, since perinatal thalamic
      injury is the commonest identifiable cause and the volume loss can be subtle.
      Structural causes account for roughly one in eight patients overall.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: >-
      Unilateral thalamic volume loss predominantly affecting medial and dorsal
      nuclei, with ipsilateral white matter loss and ventricular enlargement, or
      another structural lesion.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Structural etiologies were found in 12/91 (13%) individuals.
        explanation: >-
          Quantifies the yield of imaging for a structural cause in a systematically
          investigated cohort.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Lesions produced white matter loss and ventricle enlargement on the same
          hemisphere, which in four patients was associated with selective loss of
          thalamic-cortical fibers.
        explanation: >-
          Describes the imaging findings reported in the results field.
  - name: Genetic testing
    description: >-
      Worth doing, because a genetic cause is found in about a third of patients
      and the yield is much higher in the developmentally delayed arm than in the
      previously normal one. No single gene dominates, so panel or exome testing
      rather than targeted analysis is appropriate.
    diagnosis_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    results: >-
      A pathogenic variant in one of a broad set of channel and transcriptional
      regulator genes, or a copy number variant, in roughly a third of patients.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified the etiology in 42/91 (46%) patients in our Core cohort,
          including 29/44 (66%) with DEE-SWAS and 13/47 (28%) with EE-SWAS.
        explanation: >-
          Quantifies the overall diagnostic yield and the large difference between
          the two arms, which is what makes baseline development a useful guide to
          how hard to look.
differential_diagnoses:
  - name: Landau-Kleffner Syndrome
    disease_term:
      preferred_term: Landau-Kleffner syndrome
      term:
        id: MONDO:0009509
        label: Landau-Kleffner syndrome
    description: >-
      The closest relative and arguably a variant rather than a separate disease.
      It shares the sleep-activated epileptiform activity and the developmentally
      regulated course, and differs mainly in that the activation sits over
      perisylvian language cortex, so the regression is specifically an acquired
      auditory agnosia.
    distinguishing_features:
      - Regression is specifically of language comprehension, presenting as acquired auditory agnosia.
      - Epileptiform activity is centrotemporal and perisylvian rather than diffuse or frontal.
      - Non-language cognition and behaviour are relatively preserved at onset.
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Several pediatric seizure disorders have common electrophysiological
          features during slow-wave sleep that produce different syndromes based on
          which part of the developing brain is involved.
        explanation: >-
          States the shared mechanism and the topographic basis of the difference,
          which is precisely why these two are differentials of each other rather
          than unrelated conditions.
  - name: Lennox-Gastaut Syndrome
    disease_term:
      preferred_term: Lennox-Gastaut syndrome
      term:
        id: MONDO:0016532
        label: Lennox-Gastaut syndrome
    description: >-
      Another childhood developmental and epileptic encephalopathy classified
      alongside this one by the ILAE, and confusable because both feature slow
      spike-wave and cognitive decline.
    distinguishing_features:
      - Tonic seizures in sleep are mandatory and are not a feature of spike-wave activation in sleep.
      - Slow spike-wave is present in wakefulness rather than being sleep-activated.
      - Seizure burden is high and tracks the encephalopathy, whereas here seizures may be minimal.
      - No spontaneous remission of the electrographic pattern at adolescence.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          developmental and/or epileptic encephalopathies, comprising five
          syndromes: epilepsy with myoclonic-atonic seizures, Lennox-Gastaut
          syndrome, developmental and/or epileptic encephalopathy with
          spike-and-wave activation in sleep, hemiconvulsion-hemiplegia-epilepsy
          syndrome, and febrile infection-related epilepsy syndrome.
        explanation: >-
          Establishes that the ILAE treats these as distinct syndromes within the
          same category, which is what makes the differentiation necessary.
  - name: Self-Limited Epilepsy with Centrotemporal Spikes
    disease_term:
      preferred_term: self-limited epilepsy with centrotemporal spikes
      term:
        id: MONDO:0007295
        label: self-limited epilepsy with centrotemporal spikes
    description: >-
      Shares sleep-activated centrotemporal discharge and an age-limited course,
      and sits at the benign end of what may be a continuum. The distinction
      matters because one needs treating and the other largely does not.
    distinguishing_features:
      - Discharge activates in sleep but does not become near-continuous.
      - No regression; cognition is normal or only subtly affected.
      - Seizures are infrequent, nocturnal, and remit in adolescence without deficit.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          self-limited focal epilepsies, comprising four syndromes: self-limited
          epilepsy with centrotemporal spikes, self-limited epilepsy with autonomic
          seizures, childhood occipital visual epilepsy, and photosensitive
          occipital lobe epilepsy
        explanation: >-
          Establishes that the ILAE places this syndrome in the self-limited focal
          category, separate from the encephalopathies, which is the classificatory
          basis of the distinction.
discussions:
  - discussion_id: dee_swas_does_the_eeg_cause_the_regression
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Does the sleep-activated epileptiform discharge actually cause the
      developmental regression, or are the discharge and the regression parallel
      consequences of the same underlying lesion, and what would distinguish the
      two?
    attaches_to:
      - pathophysiology#Sleep-Potentiated Spike-Wave Activation
      - pathophysiology#Disruption of Sleep-Dependent Synaptic Plasticity
      - pathophysiology#Developmental Regression and Cognitive-Behavioural Encephalopathy
    rationale: >-
      The syndrome's name embeds the causal claim, and there is a coherent
      mechanism for it: slow-wave sleep is when synaptic strengths are rescaled and
      cortical maps consolidate during critical periods, so filling that window
      with continuous discharge should damage exactly what it appears to damage.
      The topographic correlation supports it too, since the domain lost tracks
      which cortex carries the activation rather than tracking seizure burden. The
      strongest evidence is therapeutic: in the only randomized trial, children
      given corticosteroids were substantially more likely to gain intelligence
      quotient points than children given clobazam, which is hard to explain if the
      discharge were a bystander. But the case is not closed. The trial stopped
      early without its target sample, and its two co-primary cognitive measures
      disagreed, with the sum score showing no difference at all. The alternative
      reading is that a single lesion, whether a thalamic injury or a gene,
      produces both an abnormally excitable cortex and a cortex that develops
      badly, and that suppressing the discharge treats a marker. Two observations
      sit awkwardly for the strong causal reading. The electrographic pattern
      remits spontaneously at adolescence in essentially everyone, yet cognitive
      recovery is variable and often incomplete, which is at least consistent with
      the deficit having been set by the lesion rather than accumulated by the
      discharge. And regression patterns are similar in DEE-SWAS and EE-SWAS
      despite those groups differing substantially in underlying etiology and in
      eventual outcome. The stake is concrete: if the discharge is causal,
      aggressive early suppression is worth its steroid toxicity, and normalizing
      the sleep record is a legitimate treatment target. If it is a marker, both of
      those are wrong.
    proposed_experiments:
      - experiment_id: exp_dee_swas_discharge_burden_mediation
        name: Mediation analysis of discharge burden between etiology and cognitive outcome
        description: >-
          A prospective cohort with etiology characterized at entry, quantified
          spike-wave index measured serially through the active period, and
          standardized cognitive testing at fixed intervals, analysed to test
          whether discharge burden mediates the relationship between etiology and
          cognitive trajectory, or whether etiology predicts outcome independently
          of how much discharge occurred.
        decision_criterion: >-
          If cumulative discharge burden mediates the etiology-outcome relationship
          and predicts cognitive decline after adjustment for etiology, the causal
          reading is supported and suppression is a legitimate target. If etiology
          predicts outcome with no independent contribution from discharge burden,
          the discharge is a marker and treatment should be judged on cognition
          alone.
      - experiment_id: exp_dee_swas_eeg_response_versus_cognitive_response
        name: Dissociation of electrographic and cognitive response to treatment
        description: >-
          Within treated cohorts, classify children by whether the sleep record
          normalized and separately by whether cognition improved, and quantify the
          agreement between the two. Cases of electrographic response without
          cognitive response, and the reverse, are the informative cells.
        decision_criterion: >-
          Tight concordance would support the causal chain. A substantial number of
          children whose record normalizes without cognitive benefit would show
          that suppressing the discharge is not sufficient, and would undermine
          normalization of the electroencephalogram as a treatment endpoint.
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Over the last 20 years, a variety of basic science findings suggest how
          spike-wave activity during sleep can cause the observed clinical
          outcomes.
        explanation: >-
          States the mechanistic case for the causal reading, and states it as
          suggestion rather than demonstration, which is the epistemic situation
          this discussion records.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our findings strengthen those from previous uncontrolled studies that
          support the early use of corticosteroids for children with EE-SWAS.
        explanation: >-
          The randomized evidence that a treatment aimed at the discharge improves
          cognition, which is the strongest argument for the causal reading.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our data indicated an improvement in IQ outcomes with corticosteroids
          compared with clobazam treatment, but no difference was seen in cognitive
          sum score.
        explanation: >-
          The disagreement between the two co-primary measures, which is why the
          trial supports rather than settles the causal reading.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The trial was terminated prematurely, and the target sample size was not
          met, so our findings must be interpreted with caution.
        explanation: >-
          The limitation the investigators attach to their own result, recorded here
          so the therapeutic argument is not overstated.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although developmental regression patterns were similar in both
          syndromes, DEE-SWAS was associated with a longer duration of epilepsy and
          poorer intellectual outcome than EE-SWAS.
        explanation: >-
          Supports the alternative reading, since regression looks the same across
          groups that differ in etiology and outcome. Marked PARTIAL because
          similar regression patterns are consistent with either account and only
          become discriminating alongside discharge burden data.
  - discussion_id: dee_swas_one_syndrome_or_two
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      Is the ILAE split between DEE-SWAS and EE-SWAS, which rests entirely on
      whether development was already impaired before the spike-wave activation
      began, a real boundary or a description of the starting point?
    attaches_to:
      - pathophysiology#Developmental Regression and Cognitive-Behavioural Encephalopathy
      - pathophysiology#Heterogeneous Genetic Etiology
    rationale: >-
      The two labels differ only in baseline development, which is a statement
      about the child before the process started rather than about the process. The
      mechanism modeled in this entry is the same for both, which is why they are
      curated together. Evidence for the split being real is that the arms behave
      differently in ways a mere baseline difference does not obviously predict: an
      etiology is found in about two thirds of DEE-SWAS but only about a quarter of
      EE-SWAS, and DEE-SWAS carries a longer duration of epilepsy and a poorer
      intellectual outcome. Evidence against is that the regression itself looks
      the same in both, which is what one expects if a common process is acting on
      two different starting points. There is also a measurement problem underneath
      the boundary: mild pre-existing delay is hard to establish retrospectively
      once a child has regressed, and families reconstruct the before-picture
      through the after-picture, so some children are probably assigned to the
      wrong arm. The practical consequence of getting this right is diagnostic
      effort, because the etiological yield difference between the arms is large
      enough that the label changes how hard it is worth looking for a cause.
    proposed_experiments:
      - experiment_id: exp_dee_swas_prospective_baseline_phenotyping
        name: Prospectively measured baseline development before regression
        description: >-
          Use cohorts in which developmental assessment was performed before the
          onset of spike-wave activation, such as children under surveillance for
          another reason or those with an early structural lesion followed from
          infancy, to assign the arms on prospectively measured rather than
          retrospectively recalled baselines, then compare etiological yield and
          outcome.
        decision_criterion: >-
          If the etiological yield and outcome differences survive prospective
          baseline assignment, the split is a real boundary. If they shrink toward
          each other, much of the apparent difference was misclassification driven
          by retrospective assessment.
    evidence:
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified the etiology in 42/91 (46%) patients in our Core cohort,
          including 29/44 (66%) with DEE-SWAS and 13/47 (28%) with EE-SWAS.
        explanation: >-
          Quantifies the large etiological yield difference between the arms, the
          strongest argument that the split tracks something real.
      - reference: PMID:39096015
        reference_title: >-
          Solving the Etiology of Developmental and Epileptic Encephalopathy with
          Spike-Wave Activation in Sleep (D/EE-SWAS).
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although developmental regression patterns were similar in both
          syndromes, DEE-SWAS was associated with a longer duration of epilepsy and
          poorer intellectual outcome than EE-SWAS.
        explanation: >-
          Cuts both ways, which is why it is PARTIAL: the shared regression pattern
          argues for one process, the outcome difference argues for two entities.
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Based on the 2017 Classification of Seizures and Epilepsies, some syndrome
          names have been updated using terms directly describing the seizure
          semiology.
        explanation: >-
          Records that the current names are a recent nosological revision rather
          than a long-settled biological distinction, which is the context in which
          this question is live.
  - discussion_id: dee_swas_why_do_steroids_work
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Corticosteroids outperform a benzodiazepine on cognitive outcome in this
      syndrome, but no immune or inflammatory mechanism has been established for
      it. What are steroids actually doing, and would knowing let us keep the
      benefit without the toxicity?
    attaches_to:
      - pathophysiology#Sleep-Potentiated Spike-Wave Activation
      - pathophysiology#Disruption of Sleep-Dependent Synaptic Plasticity
    rationale: >-
      This is an uncomfortable gap because the treatment recommendation is
      relatively firm while the reason for it is not. Corticosteroids are used
      across several developmental and epileptic encephalopathies with a similar
      pattern of empirical success and mechanistic silence, and in this syndrome
      the randomized comparison showed them beating clobazam on intelligence
      quotient gain. Several accounts are available and none is established. The
      neuroinflammatory account holds that there is an immune contribution to the
      cortical hyperexcitability that steroids suppress, but no confirmed
      inflammatory mechanism has been demonstrated in this syndrome, and the
      corollary prediction, that other immunotherapies should work comparably, has
      not been tested head to head. A second account is genomic and has nothing to
      do with immunity: glucocorticoid receptors are abundant in cortex and
      hippocampus and steroids alter expression of genes governing excitability
      and synaptic scaling, which would act directly on the plasticity mechanism
      this entry models. A third possibility is that the effect is on sleep
      architecture itself, since steroids measurably alter slow-wave sleep, which
      would withdraw the very drive that potentiates the discharge. These make
      different predictions and are separable. The practical stake is real:
      steroid toxicity is the main reason treatment is delayed or truncated, and
      weight gain was the commonest adverse event in the trial. A mechanism would
      tell us which better-tolerated drug to reach for instead.
    proposed_experiments:
      - experiment_id: exp_dee_swas_steroid_mechanism_biomarker_panel
        name: Inflammatory and sleep-architecture markers across steroid response
        description: >-
          In children starting corticosteroids, measure cerebrospinal fluid and
          serum inflammatory markers, quantified slow-wave sleep parameters, and
          spike-wave burden before and during treatment, and relate each to
          cognitive response. Responders and non-responders provide the contrast.
        decision_criterion: >-
          If response tracks a fall in inflammatory markers, the immune account is
          supported and other immunotherapies become rational comparators. If
          response tracks a change in slow-wave sleep parameters with inflammatory
          markers unchanged, the mechanism is architectural and sleep-directed
          treatments become the better-tolerated alternative to chase.
    evidence:
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our findings strengthen those from previous uncontrolled studies that
          support the early use of corticosteroids for children with EE-SWAS.
        explanation: >-
          Establishes that the effect this gap is about is real enough to drive a
          treatment recommendation, which is what makes the missing mechanism worth
          curating rather than merely noting.
      - reference: PMID:38081201
        reference_title: >-
          Corticosteroids versus clobazam for treatment of children with epileptic
          encephalopathy with spike-wave activation in sleep (RESCUE ESES): a
          multicentre randomised controlled trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Adverse events occurred in ten (45%) of 22 children who received
          corticosteroids, most frequently weight gain, and in 11 (52%) of 21
          children who received clobazam, most often fatigue and behavioural
          disturbances.
        explanation: >-
          Quantifies the toxicity that makes finding the mechanism practically
          worthwhile rather than academic.
  - discussion_id: dee_swas_developmental_gating
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why does this syndrome switch on in mid-childhood and switch itself off at
      adolescence, in a child whose causal lesion, whether a thalamic injury or a
      germline variant, was present all along and does not go away?
    attaches_to:
      - pathophysiology#Sleep-Potentiated Spike-Wave Activation
      - pathophysiology#Age-Dependent Remission of the Electrographic Pattern
    rationale: >-
      Both ends of the course are developmentally regulated, and neither is
      explained. A perinatal thalamic lesion is present from birth, yet the sleep
      activation does not appear for years and then disappears on its own,
      regardless of treatment, while the lesion remains. Whatever gates it is a
      property of the developing cortex rather than of the cause. Candidate
      explanations exist but have not been discriminated: the closure of a
      critical period, so that the augmenting-response plasticity the syndrome
      exploits is simply no longer available; maturational change in the sleep
      architecture itself, since slow-wave sleep declines steeply across
      adolescence and would withdraw the drive; developmental change in inhibitory
      circuit maturation; or myelination altering the conduction properties of the
      surviving thalamocortical projections. Distinguishing them matters for
      practice in a specific way: if remission comes from withdrawal of the
      slow-wave drive, then interventions targeting sleep architecture become
      rational, and the treatment window is defined by the child's developmental
      stage rather than by the duration of therapy.
    proposed_experiments:
      - experiment_id: exp_dee_swas_sleep_architecture_trajectory
        name: Longitudinal sleep architecture through onset and remission
        description: >-
          Serial whole-night polysomnography with quantified slow-wave activity and
          spindle density in the same children from before onset through to
          spontaneous remission, testing whether the appearance and disappearance
          of the activation track measurable changes in the sleep parameters that
          are proposed to drive it.
        decision_criterion: >-
          If onset and remission coincide with the rise and fall of the specific
          sleep parameters that supply the drive, sleep maturation explains the
          gating and becomes a therapeutic target. If the activation appears and
          disappears with sleep architecture unchanged, the gate is in cortical
          plasticity rather than in the drive.
    evidence:
      - reference: PMID:25160535
        reference_title: >-
          Neurobiology of continuous spike-wave in slow-wave sleep and
          Landau-Kleffner syndromes.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These disorders, of which continuous spike-wave in slow-wave sleep and
          Landau-Kleffner are the most common, are characterized by continuous
          spike-wave activity during slow-wave sleep, developmentally regulated
          onset and termination of abnormal electrical activity, and loss of
          previously acquired skills.
        explanation: >-
          Names the developmentally regulated onset and termination as a defining
          feature of the syndrome class, which is what makes its lack of explanation
          a genuine gap rather than an incidental observation.
      - reference: PMID:29133062
        reference_title: >-
          Anatomical and physiological basis of continuous spike-wave of sleep
          syndrome after early thalamic lesions.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Early neonatal thalamic lesions account for about 14% of continuous
          spike-wave of sleep (CSWS) syndrome, representing the most common
          etiology in this epileptic encephalopathy in children
        explanation: >-
          Establishes that the commonest identifiable cause is present from birth,
          which is what makes the years-long delay before onset require an
          explanation.

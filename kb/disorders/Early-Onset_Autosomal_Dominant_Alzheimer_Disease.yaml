    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant decrease in cerebral metabolism in the precuneus was detected
      in mutation carriers 10 years before expected symptom onset
    explanation: >-
      Times cerebral hypometabolism at about 10 years before expected symptom
      onset, distinct from the 15-year atrophy timing of the upstream node.
  downstream:
  - target: Progressive Dementia

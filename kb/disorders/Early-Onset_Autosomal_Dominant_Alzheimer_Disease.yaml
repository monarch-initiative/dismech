- name: Cerebral Amyloid Angiopathy
  biological_scale: TISSUE
  role: consequence
  description: >-
    A parallel vascular arm of the same deposition process: amyloid-beta,
    especially the shorter Abeta40 species, deposits in the walls of
    leptomeningeal and cortical arterioles. This is present to some degree in
    most ADAD but is a defining and severe feature of APP locus duplication,
    where it produces lobar intracerebral haemorrhage. Its clinical importance
    has grown because cerebral amyloid angiopathy is the substrate for
    amyloid-related imaging abnormalities during anti-amyloid antibody therapy.

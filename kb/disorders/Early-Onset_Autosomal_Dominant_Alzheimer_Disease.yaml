biochemical:
- name: CSF Amyloid-beta 42
  presence: Decreased
  context: >-
    Cerebrospinal fluid. The earliest measurable biomarker change in ADAD: CSF
    Abeta42 concentration begins to decline about 25 years before expected
    symptom onset as the peptide is sequestered into plaques, reaching clearly
    abnormal levels about 10 years before onset. The magnitude of the decrease is
    similar to that seen in sporadic late-onset disease.
  biomarker_term:
    preferred_term: Decreased amyloid beta 42 peptide CSF concentration
    term:
      id: HP:0025684
      label: Decreased amyloid beta 42 peptide CSF concentration
  specificity: >-
    Not specific to ADAD - shared with sporadic Alzheimer disease. Its value in
    ADAD is that carrier status makes it interpretable decades before symptoms.
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concentrations of amyloid-beta (Aβ)(42) in the CSF appeared to decline 25
      years before expected symptom onset.
    explanation: >-
      Establishes the direction and preclinical timing of the CSF Abeta42 change
      in ADAD.
- name: CSF Amyloid-beta 42/40 Ratio
  presence: Decreased
  context: >-
    Cerebrospinal fluid. The ratio is preferred over Abeta42 alone because it
    normalises for individual differences in total amyloid-beta production, which
    matters especially in APP duplication carriers. It is used in DIAN as the
    dichotomising amyloid-status variable.
  specificity: >-
    Reflects cerebral amyloid status generally rather than the dominant genotype.
  reference_ranges:
  - lower_bound: 0.0776
    unit: "1"
    population: >-
      DIAN autosomal dominant Alzheimer disease cohort; mass-spectrometry CSF
      assay. Values at or above the bound are amyloid-negative; values below are
      amyloid-positive.
    notes: >-
      Dimensionless ratio, so the UCUM unit is "1" and there is no upper bound.
      No `loinc_term` is asserted: this curator could not verify a LOINC code for
      the CSF Abeta42/Abeta40 ratio against an authoritative source, and LOINC is
      not in the dismech OAK validation config (conf/oak_config.yaml), so an
      unverified code would be an undetectable error. Adding the verified LOINC
      code later is a welcome improvement.
    evidence:
    - reference: PMID:32161412
      reference_title: >-
        A soluble phosphorylated tau signature links tau, amyloid and the
        evolution of stages of dominantly inherited Alzheimer's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        classifying participants as amyloid positive (Aβ 42/40 ≥ 0.0776) or
        amyloid negative (Aβ 42/40 < 0.0776)
      explanation: >-
        Source of the 0.0776 amyloid-positivity cutoff used to define these
        bands.
    interpretation_bands:
    - name: Amyloid positive
      upper_bound: 0.0776
      unit: "1"
      abnormal_flag: LOW
      interpretation: >-
        CSF amyloid-beta 42/40 ratio below the cutoff indicates cerebral amyloid
        pathology.
      phenotype_term:
        preferred_term: Decreased amyloid beta 42 peptide CSF concentration
        term:
          id: HP:0025684
          label: Decreased amyloid beta 42 peptide CSF concentration
    - name: Amyloid negative
      lower_bound: 0.0776
      unit: "1"
      abnormal_flag: NORMAL
      interpretation: >-
        CSF amyloid-beta 42/40 ratio at or above the cutoff indicates no
        significant cerebral amyloid pathology.
  evidence:
  - reference: PMID:32161412
    reference_title: >-
      A soluble phosphorylated tau signature links tau, amyloid and the evolution
      of stages of dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When using CSF-soluble Aβ in DIAD to determine abnormal amyloid levels, we
      found the same order for the soluble tau measures in classifying
      participants as amyloid positive (Aβ 42/40 ≥ 0.0776) or amyloid negative
      (Aβ 42/40 < 0.0776)
    explanation: >-
      Documents the use of the CSF Abeta42/40 ratio with an explicit cutoff to
      define amyloid status in the DIAN ADAD cohort.
- name: CSF Phospho-tau 217 (pT217/T217 occupancy)
  presence: Increased
  context: >-
    Cerebrospinal fluid, measured as phosphorylation occupancy by mass
    spectrometry. The most amyloid-proximal tau marker: occupancy begins to rise
    about 21 years before expected symptom onset, essentially in lockstep with
    the first rise in amyloid PET signal, and near-perfectly discriminates
    amyloid-positive from amyloid-negative carriers. It then falls again around
    symptom onset as tangle pathology accumulates, so its trajectory is
    non-monotonic and must be interpreted with disease stage.
  specificity: >-
    Highly specific for amyloid pathology (AUC 0.97 against amyloid PET status in
    the DIAN cohort), and now the leading fluid biomarker of Alzheimer pathology
    generally.
  evidence:
  - reference: PMID:32161412
    reference_title: >-
      A soluble phosphorylated tau signature links tau, amyloid and the evolution
      of stages of dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a near-perfect association with Aβ pathology for pT217/T217
      (purple; AUC = 0.97).
    explanation: >-
      Quantifies the discriminative performance of CSF pT217 occupancy for
      amyloid pathology in ADAD.
  - reference: PMID:32161412
    reference_title: >-
      A soluble phosphorylated tau signature links tau, amyloid and the evolution
      of stages of dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Second, pT217/T217 and pT181/T181 began to decline significantly near the
      time of symptom onset, while phosphorylation at pT205/T205 slowed and t-tau
      levels continued to increase.
    explanation: >-
      Documents the non-monotonic trajectory that complicates stage-blind
      interpretation of pT217 and pT181.
- name: CSF Phospho-tau 181
  presence: Increased
  context: >-
    Cerebrospinal fluid. Rises about 19 years before expected symptom onset,
    shortly after pT217. It is the tau marker with the longest clinical assay
    history and was one of the biomarkers significantly lowered by gantenerumab
    in the DIAN-TU trial, making it a usable pharmacodynamic readout in ADAD.
  evidence:
  - reference: PMID:34155411
    reference_title: >-
      A trial of gantenerumab or solanezumab in dominantly inherited Alzheimer's
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gantenerumab significantly reduced amyloid plaques, cerebrospinal fluid
      total tau, and phospho-tau181 and attenuated increases of neurofilament
      light chain.
    explanation: >-
      Demonstrates CSF phospho-tau181 as an amyloid-downstream,
      treatment-responsive biomarker in ADAD.
- name: CSF Total Tau
  presence: Increased
  context: >-
    Cerebrospinal fluid. Rises about 15-17 years before expected symptom onset
    and continues to increase monotonically as cognition declines, making it the
    tau measure that tracks neurodegeneration most directly.
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In mutation carriers, levels of tau in the CSF were increased 15 years
      before expected symptom onset
    explanation: Times the rise in CSF total tau within the ADAD biomarker cascade.
- name: Fibrillar Amyloid PET (PiB) Standardised Uptake Value Ratio
  presence: Increased
  context: >-
    Imaging biomarker (11C-Pittsburgh compound B PET), reported as a cortical
    composite standardised uptake value ratio. Becomes abnormal about 15 years
    before expected symptom onset; no DIAN non-carrier had a positive scan. It is
    the primary pharmacodynamic endpoint for anti-amyloid antibody therapy in
    ADAD.
  specificity: >-
    Positive amyloid PET in an at-risk pedigree member is effectively
    genotype-informative, since non-carriers in the DIAN cohort were uniformly
    negative.
  reference_ranges:
  - upper_bound: 1.25
    unit: "1"
    population: >-
      DIAN cohort; cortical PiB-PET composite. The normal cutoff was derived from
      the 95th percentile of asymptomatic non-carriers.
    notes: >-
      Dimensionless uptake ratio, so the UCUM unit is "1" and there is no
      meaningful lower bound. No `loinc_term` is asserted because amyloid PET
      SUVR is an imaging-derived quantity rather than a LOINC-coded clinical
      laboratory analyte.
    evidence:
    - reference: PMID:40120616
      reference_title: >-
        Safety and efficacy of long-term gantenerumab treatment in dominantly
        inherited Alzheimer's disease: an open-label extension of the phase 2/3
        multicentre, randomised, double-blind, placebo-controlled platform
        DIAN-TU trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The DIAN normal cutoff was 1.25 PiB-PET SUVR
      explanation: >-
        Source of the 1.25 SUVR amyloid-positivity threshold used to define these
        bands.
    interpretation_bands:
    - name: Amyloid negative
      upper_bound: 1.25
      unit: "1"
      abnormal_flag: NORMAL
      interpretation: >-
        Cortical PiB-PET SUVR below the DIAN cutoff indicates no significant
        fibrillar amyloid burden.
    - name: Amyloid positive
      lower_bound: 1.25
      unit: "1"
      abnormal_flag: HIGH
      interpretation: >-
        Cortical PiB-PET SUVR at or above the DIAN cutoff indicates significant
        fibrillar cerebral amyloid pathology.
      phenotype_term:
        preferred_term: Deposits immunoreactive to beta-amyloid protein
        term:
          id: HP:0003791
          label: Deposits immunoreactive to beta-amyloid protein
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aβ deposition, as measured by positron-emission tomography with the use of
      Pittsburgh compound B, was detected 15 years before expected symptom onset.
    explanation: Times the amyloid PET biomarker within the preclinical cascade.
- name: CSF Neurofilament Light Chain
  presence: Increased
  context: >-
    Cerebrospinal fluid (and plasma). A non-specific marker of axonal
    neurodegeneration whose rate of increase tracks disease progression in ADAD
    and was attenuated by gantenerumab, providing evidence that anti-amyloid
    treatment slows the neurodegenerative arm even where cognitive endpoints did
    not move.
  specificity: >-
    Not disease-specific; elevated across many neurodegenerative and neuroaxonal
    injury states.
  evidence:
  - reference: PMID:34155411
    reference_title: >-
      A trial of gantenerumab or solanezumab in dominantly inherited Alzheimer's
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: attenuated increases of neurofilament light chain
    explanation: >-
      Documents neurofilament light chain as a treatment-responsive
      neurodegeneration marker in ADAD.
diagnosis:
- name: Molecular Genetic Testing of APP, PSEN1, and PSEN2
  presence: Definitive
  notes: >-
    The definitive diagnostic test. Because the disease is monogenic and
    deterministic, identifying a pathogenic variant in one of the three genes
    establishes the diagnosis in a symptomatic proband and, in an asymptomatic
    at-risk relative, is predictive rather than merely probabilistic. More than
    230 pathogenic variants are catalogued across the three genes, and the
    specific variant is the strongest single predictor of age at onset, so
    genotype has direct prognostic value. Testing should be offered with formal
    genetic counselling (see the Predictive Genetic Testing and Genetic
    Counselling treatment entry) and is a practical prerequisite for entry into
    secondary-prevention trials. A negative result does not exclude the disease:
    in a stringently ascertained population series no PSEN1, PSEN2, or APP
    variant was identified in 10 of 34 ADEOAD families, so roughly 29% of
    clinically dominant early-onset pedigrees remain genetically unexplained.
  evidence:
  - reference: PMID:24928124
    reference_title: >-
      Symptom onset in autosomal dominant Alzheimer disease: a systematic review
      and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Researchers have identified more than 230 different autosomal dominant
      Alzheimer disease (ADAD) mutations located in the genes for amyloid
      precursor protein (APP), presenilin 1 (PSEN1), and presenilin 2 (PSEN2)
    explanation: >-
      Defines the three-gene testing panel that constitutes the definitive
      molecular diagnosis.
  - reference: PMID:10441572
    reference_title: >-
      Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
      heterogeneity, and mutation spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the 10 remaining ADEOAD families and in 9 additional autosomal dominant
      Alzheimer disease families that did not fulfill the strict criteria for
      ADEOAD, no PSEN1, PSEN2, or APP mutation was identified.
    explanation: >-
      Documents the diagnostic limitation of the three-gene panel: a substantial
      minority of clinically dominant early-onset pedigrees are variant-negative.
      Marked PARTIAL because it qualifies rather than supports the test's
      sensitivity.
  - reference: PMID:27777022
    reference_title: >-
      Clinical phenotype and genetic associations in autosomal dominant familial
      Alzheimer's disease: a case series.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This highlights the importance of considering genetic testing in young
      patients with dementia and additional neurological features in order to
      appropriately diagnose and treat their symptoms
    explanation: >-
      States the clinical indication for genetic testing: young-onset dementia
      with additional neurological features (myoclonus, seizures, pyramidal
      signs).
- name: Pedigree Criterion for Autosomal Dominant Early-Onset Alzheimer Disease
  notes: >-
    The clinical/pedigree definition used to ascertain ADEOAD before or without
    molecular confirmation: at least three early-onset (age <61 years) Alzheimer
    disease cases across three generations. This is the stringent
    epidemiological criterion behind this entry's prevalence record. It is
    deliberately conservative and will miss de novo variants, small pedigrees,
    non-paternity, and the later-onset PSEN2 families; it is an ascertainment
    criterion, not a substitute for molecular testing.
  evidence:
  - reference: PMID:10441572
    reference_title: >-
      Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
      heterogeneity, and mutation spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EOAD was defined as onset of disease at age <61 years, and ADEOAD was
      defined as the occurrence of at least three EOAD cases in three
      generations.
    explanation: >-
      States the pedigree criterion verbatim, including the age threshold and the
      three-generation requirement.
- name: CSF Amyloid and Tau Biomarker Profile
  markers: >-
    CSF Amyloid-beta 42/40 Ratio; CSF Phospho-tau 217 (pT217/T217 occupancy);
    CSF Phospho-tau 181; CSF Total Tau
  notes: >-
    Cerebrospinal fluid Abeta42/Abeta40 ratio plus phosphorylated and total tau.
    In ADAD these establish that the Alzheimer pathological process is under way
    and stage it, rather than establishing the genetic diagnosis: the Abeta42/40
    ratio dichotomises amyloid status at 0.0776 in the DIAN cohort, and
    site-specific p-tau (pT217, pT181) rises in a stereotyped order two decades
    before symptoms. See the corresponding `biochemical` entries for the
    reference ranges and interpretation bands. Note that p-tau trajectories are
    non-monotonic - pT217 and pT181 fall again around symptom onset - so a result
    must be read together with disease stage.
  evidence:
  - reference: PMID:32161412
    reference_title: >-
      A soluble phosphorylated tau signature links tau, amyloid and the evolution
      of stages of dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      classifying participants as amyloid positive (Aβ 42/40 ≥ 0.0776) or amyloid
      negative (Aβ 42/40 < 0.0776)
    explanation: >-
      Documents the CSF Abeta42/40 cutoff used to dichotomise amyloid status in
      the DIAN ADAD cohort.
  - reference: PMID:32161412
    reference_title: >-
      A soluble phosphorylated tau signature links tau, amyloid and the evolution
      of stages of dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a near-perfect association with Aβ pathology for pT217/T217
      (purple; AUC = 0.97).
    explanation: >-
      Quantifies the diagnostic performance of CSF pT217 occupancy against
      amyloid pathology in ADAD.
- name: Amyloid PET Imaging
  markers: Fibrillar Amyloid PET (PiB) Standardised Uptake Value Ratio
  notes: >-
    11C-Pittsburgh compound B (or an 18F equivalent) PET, reported as a cortical
    composite standardised uptake value ratio with the DIAN normal cutoff at
    1.25. In ADAD its diagnostic value is unusually high because carrier status
    and scan status are almost perfectly concordant: amyloid deposition becomes
    detectable about 15 years before expected symptom onset in carriers and no
    non-carrier in the DIAN cohort had a positive scan. It is also the primary
    pharmacodynamic endpoint for anti-amyloid therapy.
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data suggest that amyloid deposition will develop and be detectable in
      all persons with a mutation while still asymptomatic, whereas no
      noncarriers had positive scans for amyloid deposition
    explanation: >-
      Establishes the near-perfect concordance between mutation carrier status
      and amyloid PET positivity that underpins the test's diagnostic value in
      ADAD pedigrees.
treatments:
- name: Gantenerumab
  description: >-
    A fully human IgG1 monoclonal antibody that binds aggregated amyloid-beta and
    promotes microglial plaque clearance. Gantenerumab is the anti-amyloid
    therapy with the most ADAD-specific evidence: in the DIAN-TU-001 double-blind
    period it engaged its target and significantly lowered amyloid plaques, CSF
    total tau and phospho-tau181, and attenuated the rise in neurofilament light
    chain, but did not slow cognitive decline. In the subsequent 3-year
    open-label extension at substantially higher doses, PiB-PET SUVR fell by 0.71
    and the longest-treated participants showed a hazard ratio for CDR-SB
    progression of 0.53, suggesting - but not establishing - that long-term
    complete amyloid removal may delay symptom onset. Amyloid-related imaging
    abnormalities were common (53% overall in the extension). Development was
    discontinued for lack of a regulatory path, so this agent is not clinically
    available; its value here is as the definitive test of the amyloid hypothesis
    in the deterministic form of the disease.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gantenerumab
      term:
        id: NCIT:C88580
        label: Gantenerumab
  target_mechanisms:
  - target: Progressive Cortical Amyloid Accumulation
    treatment_effect: INHIBITS
    description: >-
      Binds and opsonises aggregated amyloid-beta, driving microglial removal of
      established plaques and thereby reducing the accumulated cortical amyloid
      burden.
  evidence:
  - reference: PMID:34155411
    reference_title: >-
      A trial of gantenerumab or solanezumab in dominantly inherited Alzheimer's
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gantenerumab significantly reduced amyloid plaques, cerebrospinal fluid
      total tau, and phospho-tau181 and attenuated increases of neurofilament
      light chain.
    explanation: >-
      Demonstrates target engagement and downstream biomarker effect in ADAD
      mutation carriers.
  - reference: PMID:34155411
    reference_title: >-
      A trial of gantenerumab or solanezumab in dominantly inherited Alzheimer's
      disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gantenerumab and solanezumab did not slow cognitive decline in symptomatic
      DIAD.
    explanation: >-
      Refutes a clinical (cognitive) benefit of gantenerumab in symptomatic ADAD
      in the double-blind period, despite biomarker engagement.
  - reference: PMID:40120616
    reference_title: >-
      Safety and efficacy of long-term gantenerumab treatment in dominantly
      inherited Alzheimer's disease: an open-label extension of the phase 2/3
      multicentre, randomised, double-blind, placebo-controlled platform DIAN-TU
      trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Partial or short-term amyloid removal did not show significant clinical
      effects. However, long-term full amyloid removal potentially delayed
      symptom onset and dementia progression.
    explanation: >-
      Supports a possible clinical benefit of sustained complete amyloid removal
      in ADAD. Marked PARTIAL because the finding comes from an open-label
      extension with external controls, which the authors themselves flag as
      limiting.
  - reference: PMID:40120616
    reference_title: >-
      Safety and efficacy of long-term gantenerumab treatment in dominantly
      inherited Alzheimer's disease: an open-label extension of the phase 2/3
      multicentre, randomised, double-blind, placebo-controlled platform DIAN-TU
      trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amyloid-related imaging abnormalities occurred in 53% (39/73) of
      participants: 47% (34/73) with microhaemorrhages, 30% (22/73) with oedema,
      and 6% (5/73) were associated with symptoms.
    explanation: >-
      Quantifies the principal safety liability of high-dose anti-amyloid
      antibody therapy in ADAD, relevant because cerebral amyloid angiopathy is
      part of the disease.
- name: Solanezumab
  description: >-
    A humanised monoclonal antibody directed at the mid-domain of SOLUBLE
    monomeric amyloid-beta rather than aggregated plaque. Tested head-to-head
    with gantenerumab in DIAN-TU-001. It engaged its soluble target but produced
    no downstream biomarker benefit and was associated with greater cognitive
    decline on some measures - an informative negative result arguing that
    clearing soluble monomer is not therapeutically equivalent to clearing
    aggregated amyloid. Included here for that mechanistic contrast, not as a
    therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: solanezumab
      term:
        id: NCIT:C88585
        label: Solanezumab
  evidence:
  - reference: PMID:34155411
    reference_title: >-
      A trial of gantenerumab or solanezumab in dominantly inherited Alzheimer's
      disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The solanezumab-treated group showed a greater cognitive decline on some
      measures and did not show benefits on downstream biomarkers.
    explanation: >-
      Refutes clinical or biomarker benefit of solanezumab in ADAD and supports
      the aggregate-versus-monomer distinction.
- name: Lecanemab
  description: >-
    A humanised IgG1 monoclonal antibody with high affinity for amyloid-beta
    protofibrils, approved for early symptomatic sporadic Alzheimer disease on
    the basis of the Clarity AD trial, where it lowered amyloid burden and
    modestly slowed decline. IMPORTANT SCOPE CAVEAT: the pivotal evidence is in
    sporadic early Alzheimer disease, NOT in autosomal dominant disease; efficacy
    specifically in ADAD carriers has not been established, and the failure of
    gantenerumab and solanezumab to move cognition in DIAN-TU-001 means
    extrapolation should not be assumed. It is listed here because
    protofibril-directed removal of aggregated amyloid is the same mechanistic
    strategy as gantenerumab and is the class currently available to clinicians
    caring for ADAD carriers.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lecanemab
      term:
        id: NCIT:C175105
        label: Lecanemab
  target_mechanisms:
  - target: Progressive Cortical Amyloid Accumulation
    treatment_effect: INHIBITS
    description: >-
      Binds amyloid-beta protofibrils and promotes clearance of aggregated
      amyloid, reducing cortical amyloid burden.
  evidence:
  - reference: PMID:36449413
    reference_title: Lecanemab in Early Alzheimer's Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lecanemab reduced markers of amyloid in early Alzheimer's disease and
      resulted in moderately less decline on measures of cognition and function
      than placebo at 18 months but was associated with adverse events.
    explanation: >-
      Establishes amyloid lowering and modest clinical benefit in EARLY SPORADIC
      Alzheimer disease. Marked PARTIAL because the trial population was not
      autosomal dominant carriers, so it supports the mechanism class but not
      ADAD-specific efficacy.
- name: Donanemab
  description: >-
    A monoclonal antibody targeting the N-terminal pyroglutamate-modified
    amyloid-beta epitope found only in established plaque, approved for early
    symptomatic sporadic Alzheimer disease after the TRAILBLAZER-ALZ 2 trial. The
    same scope caveat as lecanemab applies: the pivotal evidence is in sporadic
    disease and ADAD-specific efficacy is unestablished.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: donanemab
      term:
        id: NCIT:C166484
        label: Donanemab
  target_mechanisms:
  - target: Progressive Cortical Amyloid Accumulation
    treatment_effect: INHIBITS
    description: >-
      Binds pyroglutamate-modified amyloid-beta present only in deposited plaque,
      driving microglial plaque removal.
  evidence:
  - reference: PMID:37459141
    reference_title: >-
      Donanemab in Early Symptomatic Alzheimer Disease: The TRAILBLAZER-ALZ 2
      Randomized Clinical Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among participants with early symptomatic Alzheimer disease and amyloid and
      tau pathology, donanemab significantly slowed clinical progression at 76
      weeks in those with low/medium tau and in the combined low/medium and high
      tau pathology population.
    explanation: >-
      Establishes clinical benefit in EARLY SPORADIC Alzheimer disease. Marked
      PARTIAL because the trial did not enrol autosomal dominant carriers.
- name: Predictive Genetic Testing and Genetic Counselling
  description: >-
    Because ADAD is deterministic and 50% of a carrier's children are at risk,
    formal genetic counselling with the option of presymptomatic predictive
    testing is a core, non-pharmacological part of care. It also enables
    reproductive options and, practically, is a prerequisite for participation in
    secondary-prevention trials such as the DIAN-TU open-label extension, which
    required participants to know their mutation status.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40120616
    reference_title: >-
      Safety and efficacy of long-term gantenerumab treatment in dominantly
      inherited Alzheimer's disease: an open-label extension of the phase 2/3
      multicentre, randomised, double-blind, placebo-controlled platform DIAN-TU
      trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For inclusion in the OLE, participants at risk for DIAD had participated in
      the double-blind period of DIAN-TU-001 and were required to know their
      mutation status.
    explanation: >-
      Documents genotype disclosure - and therefore predictive genetic testing
      with counselling - as an operational requirement of ADAD trial
      participation.
clinical_trials:
- name: NCT01760005
  phase: PHASE_III
  status: COMPLETED
  description: >-
    DIAN-TU-001, the first secondary-prevention platform trial in autosomal
    dominant Alzheimer disease. Randomised, double-blind, placebo-controlled,
    multi-arm, enrolling mutation carriers from 15 years before to 10 years after
    their estimated years to symptom onset. Registered as a phase 2/3 trial; the
    gantenerumab and solanezumab arms ran from 2012 to 2019, and the gantenerumab
    open-label extension (2020-2023, NCT06424236) escalated to substantially
    higher doses.
  target_phenotypes:
  - preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
  - preferred_term: Impaired episodic memory
    term:
      id: HP:0002354
      label: Memory impairment
  evidence:
  - reference: clinicaltrials:NCT01760005
    reference_title: >-
      A Phase II/III Multicenter Randomized, Double-Blind, Placebo-Controlled
      Platform Trial of Potential Disease Modifying Therapies Utilizing
      Biomarker, Cognitive, and Clinical Endpoints in Dominantly Inherited
      Alzheimer's Disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of this study is to assess the safety, tolerability, biomarker,
      cognitive and clinical efficacy of investigational products in participants
      with an Alzheimer's disease-causing mutation
    explanation: >-
      ClinicalTrials.gov record confirming that this platform trial enrols
      carriers of Alzheimer disease-causing mutations, i.e. the ADAD population.
  - reference: PMID:34155411
    reference_title: >-
      A trial of gantenerumab or solanezumab in dominantly inherited Alzheimer's
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty-two participants carrying a mutation were assigned to receive
      gantenerumab, 52 solanezumab and 40 placebo.
    explanation: >-

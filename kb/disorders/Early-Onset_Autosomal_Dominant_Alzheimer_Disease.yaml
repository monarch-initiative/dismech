name: Early-Onset Autosomal Dominant Alzheimer Disease
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Early-onset autosomal dominant Alzheimer disease (EOAD/ADAD, also "dominantly
  inherited Alzheimer disease", DIAD, or ADEOAD) is the deterministic, fully
  penetrant Mendelian form of Alzheimer disease caused by pathogenic variants in
  one of three genes of the amyloid-beta biosynthetic axis - APP (the amyloid
  precursor protein itself, including whole-locus duplication), PSEN1, and PSEN2
  (the catalytic subunits of gamma-secretase). Nearly all such variants shift APP
  proteolysis toward longer, more aggregation-prone amyloid-beta species,
  increasing the Abeta42:Abeta40 ratio and committing carriers to cerebral
  amyloid deposition beginning in early-to-mid adulthood. Mean symptom onset is
  in the fifth decade (~46 years, and as early as the third decade for some
  PSEN1 variants), decades earlier than sporadic late-onset Alzheimer disease.
  Because age at onset is strongly predicted by mutation type and family history,
  ADAD provides the field's principal natural experiment for reading out the
  temporal order of Alzheimer pathophysiology in living humans: the Dominantly
  Inherited Alzheimer Network (DIAN) showed that CSF Abeta42 falls ~25 years,
  fibrillar amyloid PET signal and CSF tau rise ~15 years, hypometabolism and
  episodic memory decline ~10 years, and global cognitive impairment ~5 years
  before expected symptom onset. The clinical and neuropathological phenotype is
  otherwise that of typical Alzheimer disease, with an excess of non-amnestic and
  "atypical" features (myoclonus, seizures, spastic paraparesis, cerebellar
  signs, prominent cerebral amyloid angiopathy) relative to late-onset disease.
disease_term:
  preferred_term: early-onset autosomal dominant Alzheimer disease
  term:
    id: MONDO:0015140
    label: early-onset autosomal dominant Alzheimer disease
synonyms:
- EOFAD
- ADAD
- DIAD
- ADEOAD
- autosomal dominant Alzheimer disease
- dominantly inherited Alzheimer disease
- early-onset familial autosomal dominant Alzheimer disease
category: Neurodegenerative Disorder
parents:
- Alzheimer Disease
- Dementia
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Progressive neurodegenerative dementia; the primary clinical home is the
      Harrison's neurology Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Fully penetrant Mendelian (autosomal dominant) disorder of three defined
      genes, with predictive genetic testing and genetic counselling as a core
      management axis.
  mechanistic_category:
  - classification_value: amyloidopathy
    notes: >-
      The proximal and defining lesion is deterministic overproduction of
      aggregation-prone amyloid-beta with cerebral amyloid fibril deposition.
    evidence:
    - reference: PMID:40120616
      reference_title: >-
        Safety and efficacy of long-term gantenerumab treatment in dominantly
        inherited Alzheimer's disease: an open-label extension of the phase 2/3
        multicentre, randomised, double-blind, placebo-controlled platform
        DIAN-TU trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        resulting in overproduction of aggregation prone amyloid β and
        accumulation of amyloid β-plaque pathology in early to mid-adulthood
      explanation: >-
        Supports the amyloidopathy classification: the disease-defining lesion is
        amyloid-beta overproduction and plaque accumulation.
  - classification_value: tauopathy
    notes: >-
      Downstream neurofibrillary tau pathology is obligate and is what tracks
      neurodegeneration and clinical decline.
    evidence:
    - reference: PMID:32161412
      reference_title: >-
        A soluble phosphorylated tau signature links tau, amyloid and the
        evolution of stages of dominantly inherited Alzheimer's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Intracellular NFTs in the cerebral cortex are a defining pathological
        feature of Alzheimer’s disease (AD)
      explanation: >-
        Supports the tauopathy classification: neurofibrillary tangles of
        hyperphosphorylated tau are a defining pathological feature.
  - classification_value: proteotoxic disease
    notes: >-
      Both arms (soluble Abeta oligomers, hyperphosphorylated tau) act through
      protein misfolding and proteotoxicity.
notes: >-
  LUMP-VS-SPLIT DECISION. dismech already carries `Alzheimer_Disease`
  (MONDO:0004975), which models Alzheimer disease as a whole and is dominated by
  the common late-onset, multifactorial/polygenic form. This entry is kept
  SEPARATE rather than folded into that one because ADAD is a mechanistically and
  epistemically distinct entity, not merely an early slice of the same disease:
  (i) causation is deterministic and monogenic with essentially complete
  penetrance, so the gene-to-amyloid step is a causal claim rather than a risk
  association; (ii) the proximal lesion is a defined shift in gamma-secretase
  processing of APP raising the Abeta42:Abeta40 ratio, whereas late-onset disease
  is driven mainly by impaired clearance and polygenic/APOE risk; (iii) age at
  onset is predictable from mutation type and family history, which makes ADAD
  the substrate for a completely different research and trial design (DIAN,
  DIAN-TU secondary prevention) than sporadic AD; and (iv) it carries its own
  MONDO term (MONDO:0015140, is_a MONDO:0100087 familial Alzheimer disease). This
  entry deliberately does NOT duplicate the general Alzheimer content in
  `Alzheimer_Disease` (broad amyloid-cascade discussion, late-onset risk factors,
  general symptomatic care, sporadic-AD epidemiology); it curates only what is
  specific to the deterministic autosomal dominant entity. `Alzheimer_Disease`
  retains an "Early-Onset Alzheimer's Disease" subtype covering the clinical
  category of onset before 65 years, which is BROADER than this entry - most
  early-onset AD is not autosomal dominant (Campion et al. report early-onset AD
  prevalence of 41.2 vs 5.3 per 100,000 for the autosomal dominant form,
  PMID:10441572). Read the two entries together: `Alzheimer_Disease` for the
  disease in general, this entry for the Mendelian deterministic form.
has_subtypes:
- name: PSEN1
  display_name: PSEN1-associated ADAD
  subtype_term:
    preferred_term: Alzheimer disease 3 (PSEN1)
    term:
      id: MONDO:0011913
      label: Alzheimer disease 3
  description: >-
    The most common and, on average, earliest-onset genetic form of ADAD.
    Missense variants in PSEN1 (chromosome 14, the AD3 locus) alter the catalytic
    subunit of gamma-secretase. PSEN1 variants account for the majority of
    mutation-positive ADAD families and are the source of the large Colombian
    (PSEN1 E280A) kindred. Atypical features - spastic paraparesis, myoclonus,
    seizures, cerebellar signs - are over-represented relative to APP and PSEN2
    forms.
  evidence:
  - reference: PMID:7596406
    reference_title: >-
      Cloning of a gene bearing missense mutations in early-onset familial
      Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five different missense mutations have been found that cosegregate with
      early-onset familial Alzheimer's disease.
    explanation: >-
      Original identification of PSEN1 (S182) missense variants cosegregating
      with early-onset familial Alzheimer disease, establishing this subtype.
  - reference: PMID:10441572
    reference_title: >-
      Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
      heterogeneity, and mutation spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 19 (56%) of these families, we identified 16 distinct PSEN1 missense
      mutations
    explanation: >-
      Population-based French series quantifying PSEN1 as the largest genetic
      subgroup of autosomal dominant early-onset Alzheimer disease.
  - reference: PMID:27777022
    reference_title: >-
      Clinical phenotype and genetic associations in autosomal dominant familial
      Alzheimer's disease: a case series.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age at onset differed by mutation, with a younger onset for individuals
      with PSEN1 mutations than for those with APP mutations
    explanation: >-
      Establishes the earlier mean age at onset of the PSEN1 subtype relative to
      APP, one of the defining features that justifies splitting these subtypes.
  - reference: PMID:27777022
    reference_title: >-
      Clinical phenotype and genetic associations in autosomal dominant familial
      Alzheimer's disease: a case series.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      within the PSEN1 group, 72% of age at onset variance was explained by the
      specific mutation
    explanation: >-
      Quantifies how strongly the specific PSEN1 variant determines age at onset,
      supporting variant-level rather than merely gene-level prognostication.
- name: APP
  display_name: APP-associated ADAD (point mutation)
  subtype_term:
    preferred_term: Alzheimer disease type 1 (APP)
    term:
      id: MONDO:0007088
      label: Alzheimer disease type 1
  description: >-
    Missense variants in APP, typically clustered around the secretase cleavage
    sites flanking the amyloid-beta peptide (e.g. the original V717I "London"
    variant), that shift APP processing toward Abeta42 or alter the aggregation
    properties of the peptide itself. Mean onset is somewhat later than PSEN1.
  evidence:
  - reference: PMID:1671712
    reference_title: >-
      Segregation of a missense mutation in the amyloid precursor protein gene
      with familial Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we demonstrate that in this kindred, which shows linkage to chromosome
      21 markers, there is a point mutation in the APP gene. This mutation causes
      an amino-acid substitution (Val----Ile) close to the carboxy terminus of
      the beta-amyloid peptide.
    explanation: >-
      The founding demonstration that an APP point mutation adjacent to the
      amyloid-beta peptide cosegregates with familial Alzheimer disease.
- name: APP Duplication
  display_name: APP locus duplication (gene-dosage ADAD)
  subtype_term:
    preferred_term: APP locus duplication
    term:
      id: MONDO:1060190
      label: APP-related brain and vascular amyloidosis
  description: >-
    Copy-number gain of the whole APP locus on chromosome 21, causing ADAD purely
    by gene dosage rather than by altered peptide chemistry. It is the human
    genetic counterpart of the trisomy-21 Alzheimer phenotype and is
    characteristically accompanied by severe cerebral amyloid angiopathy with
    lobar haemorrhage. Note that the bound `subtype_term` is the closest
    available MONDO class: MONDO has no distinct term for APP locus duplication,
    so this subtype is anchored on the APP-related brain and vascular amyloidosis
    grouping, which captures the parenchymal-plus-vascular amyloid phenotype that
    distinguishes it. The `preferred_term` records the intended narrower concept.
  evidence:
  - reference: PMID:16369530
    reference_title: >-
      APP locus duplication causes autosomal dominant early-onset Alzheimer
      disease with cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report duplication of the APP locus on chromosome 21 in five families
      with autosomal dominant early-onset Alzheimer disease (ADEOAD) and cerebral
      amyloid angiopathy (CAA).
    explanation: >-
      Defines the gene-dosage subtype and its cerebral amyloid angiopathy
      phenotype.
- name: PSEN2
  display_name: PSEN2-associated ADAD
  subtype_term:
    preferred_term: Alzheimer disease 4 (PSEN2)
    term:
      id: MONDO:0011743
      label: Alzheimer disease 4
  description: >-
    The rarest of the three genetic forms, exemplified by the PSEN2 N141I founder
    variant of the Volga German kindreds. PSEN2 variants have significantly later
    and more variable age at onset than PSEN1 or APP variants, with onset
    sometimes extending into the seventh decade, so PSEN2 disease can be missed
    if dominant AD is assumed always to be early in onset.
  evidence:
  - reference: PMID:7638622
    reference_title: Candidate gene for the chromosome 1 familial Alzheimer's disease locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A point mutation in STM2, resulting in the substitution of an isoleucine
      for an asparagine (N141l), was identified in affected people from Volga
      German AD kindreds.
    explanation: >-
      Original identification of the PSEN2 (STM2) N141I founder variant in the
      Volga German ADAD kindreds.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous pathogenic variants (or whole-locus duplication) in APP, PSEN1,
    or PSEN2 are transmitted in an autosomal dominant pattern with essentially
    complete penetrance by the family-typical age at onset; each child of an
    affected carrier has a 50% risk. Non-penetrance before age 61 is uncommon for
    PSEN1 and APP variants, although PSEN2 variants have later and more variable
    onset.
  evidence:
  - reference: PMID:10441572
    reference_title: >-
      Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
      heterogeneity, and mutation spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nonpenetrance at age <61 years is probably infrequent for PSEN1 or APP
      mutations
    explanation: >-
      Supports essentially complete penetrance of PSEN1 and APP variants by the
      expected age at onset, the defining feature of the dominant form.
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As expected with an autosomal dominant inheritance pattern, approximately
      50% of the asymptomatic participants were mutation carriers.
    explanation: >-
      DIAN cohort composition directly reflects autosomal dominant transmission
      within at-risk pedigrees.
prevalence:
- population: Rouen, France (city population 426,710)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.3
  notes: >-
    Population-based ascertainment. ADEOAD was defined stringently as at least
    three early-onset (age <61 years) Alzheimer cases in three generations; the
    denominator is persons at risk. The same study measured early-onset Alzheimer
    disease overall at 41.2 per 100,000, so the deterministic dominant form is
    roughly one-eighth of all early-onset Alzheimer disease.
  evidence:
  - reference: PMID:10441572
    reference_title: >-
      Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
      heterogeneity, and mutation spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we calculated that the EOAD and ADEOAD prevalences per 100,000 persons at
      risk were 41.2 and 5.3, respectively
    explanation: >-
      Direct population-based point-prevalence estimate for autosomal dominant
      early-onset Alzheimer disease.
- population: Worldwide, expressed as a fraction of all Alzheimer disease
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Not a population rate. Recorded because the clinically salient number for
    ADAD is its share of the Alzheimer disease total: approximately 1% of all
    cases. Measure type is UNKNOWN because the source reports a case fraction
    rather than an occurrence measure with a defined population denominator; the
    population-rate figure is the Rouen record above.
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      autosomal dominant Alzheimer’s disease accounts for a relatively small
      proportion (approximately 1%) of cases of Alzheimer’s disease
    explanation: Quantifies ADAD as roughly 1% of all Alzheimer disease.
progression:
- phase: Symptom onset
  age_range: mean 46.2 years
  notes: >-
    Mean age at first progressive cognitive symptoms across 1,307 affected
    individuals from 387 ADAD pedigrees was 46.2 years, roughly two decades
    earlier than sporadic late-onset disease. Onset is strongly predicted by
    mutation type and by parental/family age at onset, which is the basis for the
    "estimated years to symptom onset" (EYO) staging variable used throughout
    DIAN and DIAN-TU. PSEN1 variants have the earliest onset and PSEN2 the
    latest.
  evidence:
  - reference: PMID:24928124
    reference_title: >-
      Symptom onset in autosomal dominant Alzheimer disease: a systematic review
      and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mean onset was 46.2 years for all affected patients in the combined
      dataset, clearly younger than the mean symptom onset of 68 years reported
      in late-onset AD.
    explanation: >-
      Largest meta-analysis of ADAD age at onset, quantifying the shift relative
      to late-onset disease.
  - reference: PMID:24928124
    reference_title: >-
      Symptom onset in autosomal dominant Alzheimer disease: a systematic review
      and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant proportions of the observed variance in age at symptom onset in
      ADAD can be explained by family history and mutation type, providing
      empirical support for use of these data to estimate onset in clinical
      research.
    explanation: >-
      Establishes the predictability of onset that makes EYO-based staging and
      secondary-prevention trial design possible.
- phase: Symptomatic course to death
  duration: mean 9.7 years from symptom onset
  notes: >-
    Mean survival from symptom onset to death was 9.7 years, only modestly
    shorter than the ~11.3 years reported for sporadic Alzheimer disease - so the
    common belief that ADAD is uniformly more rapidly progressive is not
    supported. Disease course is non-linear in age at onset, with the very young
    and the very old at onset having the shortest survival.
  evidence:
  - reference: PMID:24928124
    reference_title: >-
      Symptom onset in autosomal dominant Alzheimer disease: a systematic review
      and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average course from symptom onset to death in our dataset (9.7 years ±
      5.06 SD) was only modestly shorter than the average course of 11.3 years
      from symptom onset to death reported in a large population with sporadic
      AD.
    explanation: >-
      Quantifies disease duration and refutes an assumed uniformly accelerated
      course.
  - reference: PMID:24928124
    reference_title: >-
      Symptom onset in autosomal dominant Alzheimer disease: a systematic review
      and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with early (younger than 35 years) or late (older than 65 years)
      onset each had a shorter disease course than patients with onset in midlife
      (35–65 years).
    explanation: >-
      Documents the inverted-U relationship between age at onset and survival.
- phase: Preclinical biomarker cascade
  notes: >-
    Pathophysiological change begins more than two decades before symptoms.
    Relative to expected symptom onset, CSF Abeta42 declines at about -25 years,
    fibrillar amyloid PET signal and CSF tau become abnormal at about -15 years
    together with hippocampal atrophy, cerebral hypometabolism and impaired
    episodic memory appear at about -10 years, global cognitive impairment at
    about -5 years, and dementia criteria are met about 3 years after expected
    onset.
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Changes begin in the brain at least two decades before the estimated onset
      of clinical symptoms.
    explanation: >-
      Summarises the DIAN finding that measurable pathophysiology long precedes
      symptoms in ADAD.
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the order and magnitude of changes indicate that genetic mutations cause
      increased Aβ42, which is followed by brain amyloidosis, tauopathy, brain
      atrophy, and decreased glucose metabolism
    explanation: >-
      States the observed temporal ordering of the ADAD biomarker cascade, which
      this entry's pathophysiology chain reproduces.
genetic:
- name: PSEN1
  gene_term:
    preferred_term: PSEN1
    term:
      id: hgnc:9508
      label: PSEN1
  association: Pathogenic missense variants (autosomal dominant, deterministic)
  subtype: PSEN1
  notes: >-
    PSEN1 encodes presenilin 1, the catalytic aspartyl protease subunit of the
    gamma-secretase complex that performs the final intramembrane cleavage of the
    APP C-terminal fragment. Pathogenic missense variants reduce the processivity
    of successive carboxypeptidase-like cleavages, releasing longer Abeta species
    and raising the Abeta42:Abeta40 ratio. PSEN1 variants are the most common
    cause of ADAD and are associated with the earliest onset.
  case_fractions:
  - population: French population-based ADEOAD families (Rouen study, n=34)
    case_fraction_percent: 56.0
    cohort_size: 34
    notes: 19 of 34 stringently defined ADEOAD families carried a PSEN1 variant.
    evidence:
    - reference: PMID:10441572
      reference_title: >-
        Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
        heterogeneity, and mutation spectrum.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 19 (56%) of these families, we identified 16 distinct PSEN1 missense
        mutations
      explanation: Quantifies the PSEN1 share of ADEOAD families in this cohort.
  evidence:
  - reference: PMID:7596406
    reference_title: >-
      Cloning of a gene bearing missense mutations in early-onset familial
      Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic linkage studies have mapped a locus (AD3) associated with
      susceptibility to a very aggressive form of Alzheimer's disease to
      chromosome 14q24.3.
    explanation: >-
      Maps and identifies the PSEN1 (AD3) locus underlying aggressive early-onset
      familial Alzheimer disease.
- name: APP
  gene_term:
    preferred_term: APP
    term:
      id: hgnc:620
      label: APP
  association: >-
    Pathogenic missense variants near the secretase cleavage sites, and
    whole-locus duplication (autosomal dominant, deterministic)
  subtype: APP
  notes: >-
    APP encodes the amyloid precursor protein, the substrate from which
    amyloid-beta is liberated by sequential beta- and gamma-secretase cleavage.
    Pathogenic variants cluster around the cleavage sites flanking the
    amyloid-beta peptide and either shift cleavage toward Abeta42 or increase the
    aggregation propensity of the peptide. Duplication of the entire locus causes
    disease purely by increased gene dosage.
  case_fractions:
  - population: French population-based ADEOAD families (Rouen study, n=34)
    case_fraction_percent: 15.0
    cohort_size: 34
    notes: 5 of 34 stringently defined ADEOAD families carried an APP variant.
    evidence:
    - reference: PMID:10441572
      reference_title: >-
        Early-onset autosomal dominant Alzheimer disease: prevalence, genetic
        heterogeneity, and mutation spectrum.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        APP mutations, including a novel mutation located at codon 715, were
        identified in 5 (15%) of the families.
      explanation: Quantifies the APP share of ADEOAD families in this cohort.
  evidence:
  - reference: PMID:1671712
    reference_title: >-
      Segregation of a missense mutation in the amyloid precursor protein gene
      with familial Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that some cases of AD could be caused by mutations in the APP
      gene.
    explanation: >-
      Original demonstration of APP as a causal gene for familial Alzheimer
      disease.
  - reference: PMID:16369530
    reference_title: >-
      APP locus duplication causes autosomal dominant early-onset Alzheimer
      disease with cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duplication of the APP locus, resulting in accumulation of amyloid-beta
      peptides, causes ADEOAD with CAA.
    explanation: >-
      Establishes gene dosage of APP as sufficient to cause the disease, a
      dose-response argument for the amyloid mechanism.
- name: PSEN2
  gene_term:
    preferred_term: PSEN2
    term:
      id: hgnc:9509
      label: PSEN2
  association: Pathogenic missense variants (autosomal dominant, deterministic)
  subtype: PSEN2
  notes: >-
    PSEN2 encodes presenilin 2, the paralogous catalytic subunit of
    gamma-secretase that can substitute for presenilin 1. Pathogenic variants are
    the rarest cause of ADAD, with the N141I founder variant of the Volga German
    kindreds the best characterised. Onset is significantly later and more
    variable than for PSEN1 or APP.
  evidence:
  - reference: PMID:7638622
    reference_title: Candidate gene for the chromosome 1 familial Alzheimer's disease locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of missense mutations in AD subjects in two highly similar
      genes strongly supports the hypothesis that mutations in both are
      pathogenic.
    explanation: >-
      Establishes PSEN2 (STM2) as a second presenilin gene causal for familial
      Alzheimer disease.
- name: APOE
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  relationship_type: MODIFIER
  association: Onset-modifying locus; the R136S "Christchurch" variant is protective
  notes: >-
    APOE genotype is the dominant risk locus for sporadic late-onset Alzheimer
    disease but is NOT a major determinant of onset age in ADAD as a whole: in
    the largest meta-analysis, APOE genotype and sex did not significantly add to
    the variance in onset explained by mutation type and family history. The
    striking exception is the homozygous APOE3 Christchurch (R136S) variant,
    which delayed cognitive onset by about three decades in a PSEN1 E280A carrier
    despite very high brain amyloid - the single most informative human
    resilience observation in ADAD, and the basis for APOE-directed therapeutic
    strategies.
  evidence:
  - reference: PMID:31686034
    reference_title: >-
      Resistance to autosomal dominant Alzheimer's disease in an APOE3
      Christchurch homozygote: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The individual had two copies of the APOE3 Christchurch (R136S) mutation,
      unusually high brain amyloid levels and limited tau and neurodegenerative
      measurements.
    explanation: >-
      Documents a protective APOE genotype uncoupling amyloid burden from tau,
      neurodegeneration, and clinical onset in an ADAD carrier.
mechanistic_hypotheses:
- hypothesis_group_id: deterministic_amyloid_cascade
  hypothesis_label: >-
    Deterministic amyloid cascade: mutation-driven Abeta42 overproduction is the
    sufficient upstream cause of the entire ADAD pathophysiology
  status: CANONICAL
  description: >-
    In ADAD the amyloid cascade is not merely correlative. All three causal genes
    sit on the amyloid-beta biosynthetic axis; APP locus duplication shows a pure
    gene-dosage effect; and the DIAN cross-sectional cascade recovers exactly the
    predicted temporal order (CSF Abeta42 change, then fibrillar amyloid, then
    tau, then atrophy and hypometabolism, then cognition). This entry's
    pathophysiology chain is modelled on that ordering. Downstream causal edges
    that belong to this model opt in via
    hypothesis_groups: [deterministic_amyloid_cascade].
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the order and magnitude of changes indicate that genetic mutations cause
      increased Aβ42, which is followed by brain amyloidosis, tauopathy, brain
      atrophy, and decreased glucose metabolism
    explanation: >-
      Reports the observed sequence of pathophysiological change in ADAD
      carriers, the empirical backbone of this hypothesis.
  - reference: PMID:16369530
    reference_title: >-
      APP locus duplication causes autosomal dominant early-onset Alzheimer
      disease with cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duplication of the APP locus, resulting in accumulation of amyloid-beta
      peptides, causes ADEOAD with CAA.
    explanation: >-
      A pure gene-dosage cause is the strongest available human argument that
      increased amyloid-beta production alone is sufficient to cause the disease.
  notes: >-
    Retained as CANONICAL, but the cascade being sufficient to CAUSE the disease
    is not the same as amyloid removal being sufficient to TREAT it: the DIAN-TU
    double-blind period showed target engagement and biomarker change without
    cognitive benefit. See the qualitative-Abeta-profile alternative below and
    the open discussions.
- hypothesis_group_id: qualitative_abeta_profile
  hypothesis_label: >-
    Qualitative Abeta profile, not simply the Abeta42:Abeta40 ratio, determines
    familial Alzheimer pathogenicity
  status: ALTERNATIVE
  description: >-
    An alternative reading of the proximal step. Kinetic dissection of
    gamma-secretase shows that familial Alzheimer disease mutations act through
    at least three distinct mechanisms and change the qualitative spectrum of
    Abeta products, not only the Abeta42 fraction - and that many PSEN variants
    paradoxically IMPAIR gamma-secretase rather than simply activating an
    Abeta42-generating gain of function. This matters therapeutically because it
    predicts that indiscriminate gamma-secretase inhibition (which failed
    clinically) is the wrong intervention, while modulation of the
    carboxypeptidase-like activity is the right one.
  evidence:
  - reference: PMID:22505025
    reference_title: The mechanism of γ-Secretase dysfunction in familial Alzheimer disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we use kinetic studies to demonstrate that FAD mutations affect Aβ
      generation via three different mechanisms, resulting in qualitative changes
      in the Aβ profiles, which are not limited to Aβ42.
    explanation: >-
      Directly states the qualitative-profile alternative to a simple
      Abeta42-quantity model.
  - reference: PMID:22505025
    reference_title: The mechanism of γ-Secretase dysfunction in familial Alzheimer disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, many PSEN mutations paradoxically impair γ-secretase and
      'loss-of-function' mechanisms have also been postulated.
    explanation: >-
      Notes the loss-of-function observation that a pure gain-of-toxic-function
      model does not accommodate. Marked PARTIAL because the sentence frames a
      postulate rather than establishing it.
pathophysiology:
- name: Pathogenic APP, PSEN1, or PSEN2 Germline Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The proximal cause is a heterozygous germline pathogenic variant in one of
    three genes on the amyloid-beta biosynthetic axis: APP (the substrate, by
    missense variant near a secretase cleavage site or by whole-locus
    duplication), PSEN1, or PSEN2 (the catalytic subunit of the gamma-secretase
    that performs the final cleavage). More than 230 such variants are
    catalogued. Because the lesion is present from conception and acts
    constitutively, the entire downstream cascade is deterministic rather than
    probabilistic, and its timing is set largely by which variant is carried.

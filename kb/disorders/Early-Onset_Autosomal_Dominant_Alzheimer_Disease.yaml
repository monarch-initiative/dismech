- name: NCT00869817
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    The Dominantly Inherited Alzheimer Network (DIAN) observational study: a
    longitudinal, multi-site natural-history and biomarker cohort of members of
    ADAD pedigrees, both carriers and non-carriers. It produced the canonical
    preclinical biomarker cascade that this entry's pathophysiology chain is
    built on, and supplies the participants and the estimated-years-to-onset
    staging used by DIAN-TU. Observational, so no trial phase applies.
  evidence:
  - reference: clinicaltrials:NCT00869817
    reference_title: Dominantly Inherited Alzheimer Network (DIAN)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of this study is to identify potential biomarkers that may
      predict the development of Alzheimer's disease in people who carry an
      Alzheimer's mutation.
    explanation: >-
      ClinicalTrials.gov record confirming the observational biomarker aim and

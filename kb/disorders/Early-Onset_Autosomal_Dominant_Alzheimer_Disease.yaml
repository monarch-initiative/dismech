- name: Site-Specific Soluble Tau Hyperphosphorylation
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    The first tau event, roughly two decades before symptoms and separated from
    tangle formation by about 20 years. Cortical amyloid pathology triggers a
    stereotyped, ordered, site-specific rise in soluble tau phosphorylation
    occupancy measurable in CSF: threonine 217 first (about 21 years before
    expected onset, essentially in lockstep with rising amyloid PET signal), then
    threonine 181, then total tau, then threonine 205. This is the mechanistic
    bridge from the amyloid arm into the tau arm, and is why p-tau217 is now the
    leading amyloid-proximal fluid biomarker. It is modelled separately from
    tangle formation because the two events are ~20 years apart and, critically,
    move in OPPOSITE directions once tangles appear (see the downstream node).

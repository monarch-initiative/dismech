- name: Increased APP Substrate Dosage
  biological_scale: MOLECULAR
  role: amplifier
  subtypes:
  - APP Duplication
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  description: >-
    The quantitative (gene-dosage) arm of the proximal lesion, and the sibling of
    the gamma-secretase-processing node. Copy-number gain of the whole APP locus
    on chromosome 21 increases the amount of APP substrate presented to the
    normal secretase machinery, so more amyloid-beta is produced without any
    change in the enzyme or in the Abeta42:Abeta40 ratio. It is modelled as a
    distinct node precisely because it is the cleanest human dose-response
    argument for the amyloid hypothesis: no altered peptide chemistry is
    required, only more of the normal precursor. This node is arguably the more
    literal instance of the amyloidogenesis module's "amyloidogenic precursor
    protein" trigger, whose description names overproduction alongside mutation
    as a route to a metastable precursor. It converges with the qualitative arm
    on the shared downstream misfolding node, and its vascular emphasis is
    carried onward by the cerebral amyloid angiopathy node.

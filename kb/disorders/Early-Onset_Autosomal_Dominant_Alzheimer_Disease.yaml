- name: Progressive Dementia
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "amyloidogenesis#Organ Dysfunction"
  description: >-
    The clinical end state, and the ADAD instance of the amyloidogenesis module's
    organ-dysfunction consequence, with the brain as the affected organ. Impaired
    episodic memory appears about 10 years before expected symptom onset, global
    cognitive impairment about 5 years before, and criteria for mild dementia are
    met about 3 years after expected onset, with progression to death over
    roughly a decade. Non-amnestic and neurological features (myoclonus,
    seizures, spastic paraparesis) are more common than in late-onset disease.
  evidence:
  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Global cognitive impairment, as measured by the Mini-Mental State
      Examination and the Clinical Dementia Rating scale, was detected 5 years
      before expected symptom onset, and patients met diagnostic criteria for
      dementia at an average of 3 years after expected symptom onset.
    explanation: >-
      Times the clinical consequence node relative to the rest of the cascade.

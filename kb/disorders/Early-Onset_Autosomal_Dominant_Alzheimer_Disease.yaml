- name: Cerebral Glucose Hypometabolism
  biological_scale: TISSUE
  role: effector
  description: >-
    Regional failure of cerebral glucose utilisation, measured by FDG-PET, in
    territories losing synapses and neurons. In DIAN carriers a significant
    decrease in precuneus metabolism appears about 10 years before expected
    symptom onset - five years after hippocampal atrophy becomes detectable,
    which is why it is a distinct node rather than being bundled with atrophy.
  locations:

  - reference: PMID:22784036
    reference_title: Clinical and biomarker changes in dominantly inherited Alzheimer's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants at risk for carrying a mutation for autosomal dominant
      Alzheimer’s disease were enrolled in the Dominantly Inherited Alzheimer
      Network (DIAN) study at 1 of 10 sites.
    explanation: >-
      Describes the DIAN observational cohort whose baseline data produced the
      biomarker cascade.
discussions:
- discussion_id: gap_adad_amyloid_removal_clinical_benefit
  prompt: >-
    Does complete, sustained removal of cerebral amyloid before symptom onset
    prevent or delay dementia in autosomal dominant Alzheimer disease carriers,
    or is the amyloid cascade causally sufficient to initiate the disease but no
    longer the rate-limiting step once tau pathology and neurodegeneration are
    established?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Cortical Amyloid Accumulation
  - pathophysiology#Site-Specific Soluble Tau Hyperphosphorylation
  - pathophysiology#Neurofibrillary Tangle Formation
  rationale: >-
    ADAD is the cleanest available test of the amyloid hypothesis: causation is
    monogenic and deterministic, onset is predictable, and asymptomatic carriers
    can be treated years before symptoms. Yet the DIAN-TU-001 double-blind period
    showed unambiguous target engagement and downstream biomarker movement
    (plaques, total tau, phospho-tau181, neurofilament light chain) with NO
    cognitive benefit. The open-label extension hints at a benefit from long-term
    complete removal (hazard ratio 0.53 in the longest-treated group), but it is
    open-label with external controls, was terminated early by the sponsor, and
    the authors explicitly caution against over-reading it. The gap is therefore
    not whether amyloid causes ADAD - the genetics settle that - but whether
    amyloid removal is a sufficient intervention, and at what point in the
    cascade it stops being one. This is a genuine absence of evidence rather than
    a model-system translation problem, hence KNOWLEDGE_GAP.
  proposed_experiments:
  - experiment_id: exp_adad_primary_prevention_full_removal
    name: >-
      Randomised, controlled primary-prevention trial of sustained complete
      amyloid removal in far-presymptomatic ADAD carriers
    description: >-
      Enrol mutation carriers substantially earlier than DIAN-TU-001 did - before
      amyloid PET positivity, i.e. more than 15 years before expected symptom
      onset - and treat to and maintain amyloid-negative status with an internal
      randomised control arm rather than external controls. Primary endpoint:
      time to first CDR progression; key secondary: whether tau PET and CSF pT217
      trajectories are prevented from ever diverging from non-carriers. A
      negative result under these conditions would constrain the amyloid
      hypothesis far more sharply than any trial to date.
  evidence:
  - reference: PMID:40120616
    reference_title: >-
      Safety and efficacy of long-term gantenerumab treatment in dominantly
      inherited Alzheimer's disease: an open-label extension of the phase 2/3
      multicentre, randomised, double-blind, placebo-controlled platform DIAN-TU
      trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conclusions are limited due to the OLE design and use of external controls
      and need to be confirmed in long term trials.
    explanation: >-
      The trialists themselves state that the question of clinical benefit from
      long-term amyloid removal in ADAD remains open.
- discussion_id: gap_adad_apoe_christchurch_resilience
  prompt: >-
    By what mechanism does homozygous APOE3 Christchurch (R136S) uncouple very
    high cerebral amyloid burden from tau pathology, neurodegeneration, and
    cognitive onset in a PSEN1 E280A carrier, and can that mechanism be
    pharmacologically reproduced?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Site-Specific Soluble Tau Hyperphosphorylation
  - pathophysiology#Neurofibrillary Tangle Formation
  rationale: >-
    A single PSEN1 E280A carrier homozygous for APOE3 Christchurch remained free
    of mild cognitive impairment until her seventies - three decades past the
    expected onset for that variant - despite unusually high brain amyloid. This
    is a human experiment showing that the amyloid-to-tau edge in this entry's
    pathograph is not obligate and can be broken downstream of amyloid. What is
    not known is which APOE function (lipidation, heparan sulfate proteoglycan
    binding, astrocytic or microglial signalling) is responsible, whether the
    effect generalises beyond a single individual and genotype, and whether an
    APOE-directed drug could reproduce it. Resolving this would identify a
    tau-arm target that acts even when amyloid removal has failed.
  evidence:
  - reference: PMID:31686034
    reference_title: >-
      Resistance to autosomal dominant Alzheimer's disease in an APOE3
      Christchurch homozygote: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a PSEN1 (presenilin 1) mutation carrier from the world's
      largest autosomal dominant Alzheimer's disease kindred, who did not develop
      mild cognitive impairment until her seventies, three decades after the
      expected age of clinical onset.
    explanation: Documents the resilience observation that defines this gap.
- discussion_id: gap_adad_gamma_secretase_mechanism_heterogeneity
  prompt: >-
    Given that familial Alzheimer disease variants alter the qualitative spectrum
    of amyloid-beta products through at least three distinct mechanisms - with
    many PSEN variants paradoxically IMPAIRING gamma-secretase rather than
    activating an Abeta42-generating gain of function - does a single
    Abeta42:Abeta40-ratio model adequately describe the proximal lesion across
    all ADAD genotypes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Gamma-Secretase Processing of APP and Increased Abeta42 Fraction
  rationale: >-
    This entry's second pathophysiology node is written around an increased
    Abeta42 fraction, which is the standard formulation and is what the DIAN
    biomarker data are consistent with at the level of the whole cohort. But the
    kinetic dissection of gamma-secretase shows the proximal step is
    mechanistically heterogeneous across variants, so a per-genotype description
    may be required - which matters directly for drug design, since it is the
    reason indiscriminate gamma-secretase inhibitors failed while modulators
    remain of interest. Whether the mechanistic subclasses map onto differences
    in age at onset, biomarker trajectory, or treatment response in living
    carriers is untested.

- name: Altered Gamma-Secretase Processing of APP and Increased Abeta42 Fraction
  biological_scale: MOLECULAR
  role: amplifier
  subtypes:
  - PSEN1
  - APP
  - PSEN2
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  description: >-
    The qualitative arm of the proximal lesion, and the mechanism of the
    point-mutation subtypes (PSEN1, PSEN2, and APP missense). Pathogenic variants shift
    the sequential, carboxypeptidase-like gamma-secretase cleavage of the APP
    C-terminal fragment so that longer, more aggregation-prone amyloid-beta
    species are released, raising the Abeta42:Abeta40 ratio. This node is the
    ADAD-specific substitution for the amyloidogenesis module's generic
    "amyloidogenic precursor protein" trigger: the precursor is amyloid-beta, and
    what destabilises it is not aging or somatic mutation but a constitutive
    germline change in how it is generated. A mechanistic caveat is carried by
    the qualitative_abeta_profile hypothesis: kinetic work shows familial
    Alzheimer variants change the qualitative spectrum of Abeta products through
    several distinct mechanisms, not only the Abeta42 quantity, and many PSEN
    variants paradoxically impair the enzyme. The parallel quantitative
    (gene-dosage) arm is modelled as the sibling node "Increased APP Substrate
    Dosage" rather than folded in here, because copy-number gain of APP does not
    alter gamma-secretase processing and does not by itself raise the
    Abeta42:Abeta40 ratio - it raises total substrate.

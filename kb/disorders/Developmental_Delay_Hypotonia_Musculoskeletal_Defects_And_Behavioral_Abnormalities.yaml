name: Developmental Delay, Hypotonia, Musculoskeletal Defects, and Behavioral Abnormalities
creation_date: "2026-09-02T18:30:00Z"
category: Mendelian
disease_term:
  preferred_term: DEHMBA syndrome (non-Floating-Harbor SRCAP-related neurodevelopmental disorder)
  term:
    id: MONDO:0859202
    label: developmental delay, hypotonia, musculoskeletal defects, and behavioral abnormalities
description: >-
  DEHMBA is an autosomal dominant neurodevelopmental disorder caused by de novo
  heterozygous loss-of-function SRCAP variants that fall outside the
  Floating-Harbor syndrome hotspot in exons 33 and 34.

  It is the clearest worked example in the SRCAP literature of a principle that
  is easy to state and easy to curate wrongly: one gene, two diseases,
  distinguished by where in the gene the truncation lands rather than by how
  severe it is. Truncations confined to exons 33-34 escape nonsense-mediated
  decay and leave a stable, shortened protein that acts dominant-negatively;
  those are Floating-Harbor syndrome, with its short stature, delayed bone age
  and recognizable facial gestalt. Truncations anywhere else destroy the allele,
  leaving simple haploinsufficiency, and produce a phenotype that shares the
  developmental delay but has none of the FLHS growth or facial signature.

  The evidence that these are two conditions and not one spectrum is epigenetic
  rather than clinical. Floating-Harbor syndrome has a well-established blood
  DNA-methylation episignature; when the founding DEHMBA cohort was run against
  a classifier trained on it, every affected individual was classified negative,
  and a separate signature emerged when they were compared against controls
  instead. That is a positive discriminator, not merely an absence of FLHS
  features, and it is now used diagnostically to resolve SRCAP variants of
  uncertain significance.

  Two things about this entry are worth flagging up front. The mechanism below
  the H2A.Z-deposition step is almost entirely mouse work: the Srcap-Satb2 axis
  and the parvalbumin interneuron loss that connect the chromatin lesion to
  behaviour have not been shown in human tissue, which is recorded here as a
  human-model mismatch rather than smoothed over. And the phenotype is genuinely
  non-specific - the name lists four categories, of which only the developmental
  delay and hypotonia are near-universal, so the musculoskeletal and behavioural
  features carry the disorder's name without carrying its diagnosis.
parents:
- hereditary disease
synonyms:

animal_models:
- name: Srcap heterozygous knockout mouse
  species: Mouse
  genotype: Srcap+/-
  description: >-
    The only in vivo model connecting SRCAP dosage to behaviour. It carries the
    single most informative result in this entry - AAV-delivered Satb2 rescues
    both the cellular and the behavioural phenotype - and simultaneously the
    entry's largest translational caveat, since the human relevance of the Satb2
    axis is untested.
  publication: PMID:38733588
  genes:
  - preferred_term: SRCAP
    term:
      id: hgnc:16974
      label: SRCAP
  modeled_mechanisms:
  - target: Parvalbumin Interneuron and Synaptic Deficits
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous Srcap loss reduces parvalbumin-positive interneuron numbers
      in the retrosplenial cortex and dentate gyrus.
    limitations: >-
      The cellular deficit has never been looked for in human DEHMBA brain, and
      the mouse models haploinsufficiency of the whole gene rather than a
      position-specific human allele - so it cannot speak to the exon 33-34
      distinction that defines this disease against Floating-Harbor syndrome.
    readouts:
    - name: Parvalbumin-positive interneuron number
      target: Parvalbumin Interneuron and Synaptic Deficits
      direction: DECREASED
      interpretation: >-
        Cellular correlate of the interneuron node, measured in two regions.
      evidence:
      - reference: PMID:38733588
        reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Notably, a reduction in parvalbumin-positive neurons is observed in
          the retrosplenial cortex (RSC) and dentate gyrus (DG) of these mice.
        explanation: >-
          The measurement and its direction.
    evidence:
    - reference: PMID:38733588
      reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, we find that Srcap regulates expression of Satb2 via H2A.z
        in the promoter.
      explanation: >-
        Establishes the model as informative for this node by supplying the
        molecular route from Srcap dosage to the cellular deficit.
  - target: Reduced Satb2 Expression
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Restoring Satb2 by AAV in neonatal mice reverses the neurodevelopmental
      and autism-like abnormalities, and expressing it in the retrosplenial
      cortex alone rescues social novelty in adolescents.
    limitations: >-
      A rescue in a mouse is not a therapy in a person: the intervention window
      is neonatal, the readouts are rodent behavioural assays, and no human
      DEHMBA tissue has been shown to have reduced SATB2 in the first place.
    readouts:
    - name: Social novelty response after AAV-Satb2
      target: Reduced Satb2 Expression
      direction: RESTORED
      interpretation: >-
        Interventional evidence that the Satb2 branch is load-bearing for the
        behavioural phenotype in this model.
      evidence:
      - reference: PMID:38733588
        reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, the expression of Satb2 only in the RSC of adolescent
          mice rectifies social novelty impairments.
        explanation: >-
          A regionally restricted rescue of a specific behavioural readout.
    evidence:
    - reference: PMID:38733588
      reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Therapeutic intervention via retro-orbital injection of adeno-associated
        virus (AAV)-Satb2 in neonatal Srcap+/- mice leads to amelioration of the
        neurodevelopmental and ASD-like abnormalities.
      explanation: >-
        The rescue that makes this a RESCUES link rather than a descriptive one.

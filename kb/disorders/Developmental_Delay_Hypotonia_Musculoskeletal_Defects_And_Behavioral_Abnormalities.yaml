discussions:
- discussion_id: dehmba_satb2_axis_human_untested
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Srcap-H2A.Z-Satb2 axis that explains the mouse behavioural
    phenotype operate in human DEHMBA, or is the human mechanism below the
    chromatin lesion still unknown?
  attaches_to:
  - "pathophysiology#Reduced Satb2 Expression"
  - "pathophysiology#Parvalbumin Interneuron and Synaptic Deficits"
  rationale: >-
    Everything in this entry above the H2A.Z step is human: the variants, the
    episignature, the phenotype. Everything below it is mouse.

    That is not a complaint about the mouse work, which is unusually strong - it
    identifies a specific target, shows the chromatin mechanism at that target's
    promoter, and then rescues the phenotype by restoring it. The problem is
    that the rescue is exactly what makes the axis tempting to state as the
    disease mechanism, and no part of it has been observed in a person with
    DEHMBA. There is no human DEHMBA brain transcriptomic or single-cell data,
    no measurement of SATB2 in patient tissue, and no count of parvalbumin
    interneurons in a human case.

    The mismatch is sharper than a generic species caveat for two reasons.
    First, the mouse is a whole-gene heterozygous knockout, so it models
    haploinsufficiency in general and is blind to the exon 33-34 position rule
    that defines DEHMBA against Floating-Harbor syndrome - a Srcap+/- mouse is
    arguably a model of both diseases or of neither. Second, SATB2
    haploinsufficiency causes its own well-characterized human syndrome, and
    DEHMBA does not resemble it, which is at least a prima facie argument that
    reduced SATB2 is not doing the same work in people that it does in the
    model.

    Resolving it does not need new technology. The human iPSC lines carrying
    distal-locus frameshifts already exist; differentiating them and asking
    whether H2A.Z occupancy and SATB2 expression fall at the human promoter
    would settle the first half.
  proposed_experiments:
  - experiment_id: dehmba_h2az_satb2_in_patient_derived_neurons
    name: H2A.Z and SATB2 in DEHMBA patient-derived neurons
    description: >-
      Differentiate the published SRCAP distal-locus frameshift iPSC lines into
      cortical neurons and interneurons and compare them with isogenic controls
      for H2A.Z occupancy at the SATB2 promoter, SATB2 transcript and protein
      level, and interneuron specification efficiency.
    would_support:
    - "pathophysiology#Reduced Satb2 Expression"
    - "pathophysiology#Parvalbumin Interneuron and Synaptic Deficits"
    supporting_outcome:
    - >-
      Reduced H2A.Z occupancy at the human SATB2 promoter with a corresponding
      fall in SATB2 transcript and protein.
    - >-
      Reduced yield of parvalbumin-lineage interneurons relative to isogenic
      controls.
    refuting_outcome:
    - >-
      Unchanged H2A.Z occupancy and SATB2 expression despite a confirmed
      reduction in SRCAP, which would mean the mouse axis is not the human
      mechanism and the human path from chromatin lesion to phenotype is
      unidentified.
- discussion_id: dehmba_musculoskeletal_branch_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does an SRCAP null allele produce musculoskeletal abnormalities at all,
    and through which cell types?
  attaches_to:
  - "phenotypes#Musculoskeletal abnormalities"
  rationale: >-
    The disorder's name puts musculoskeletal defects on equal footing with
    developmental delay, and the mechanism in this entry accounts for none of
    them. Every mechanistic step curated here is neural: H2A.Z deposition
    measured in neuroblastoma cells, interneurons counted in mouse brain,
    behaviour assayed in mice.

    The founding cohort reports musculoskeletal issues without resolving them
    into specific findings with frequencies, and no study has examined
    mesenchymal, chondrocyte or osteoblast lineages in this disease. So the gap
    is double: the phenotype is described too coarsely to model, and the model
    systems that exist are neural.

    It is worth stating rather than leaving implicit, because a mechanism that
    explains two of the four name-bearing features and is silent on a third is
    an incomplete account being presented as a complete one. Note the contrast
    with Floating-Harbor syndrome, where the skeletal phenotype is precise -
    delayed bone age, brachydactyly - and the difference in skeletal involvement
    between the two allele classes is itself unexplained.
notes: >-
  Naming. Three names are in circulation for one entity: DEHMBA, which follows
  the OMIM phenotype title and the MONDO label and is used here; non-FLHS
  SRCAP-related NDD, which is what the founding paper called it and what the
  methylation literature still uses; and SRCAP-related neurodevelopmental
  disorder, which is ambiguous because it also covers Floating-Harbor syndrome.
  A literature search on any one of them misses part of the corpus.

  Scope. This entry covers the non-hotspot loss-of-function phenotype.
  Floating-Harbor syndrome is curated separately, and the recently reported
  SRCAP developmental and epileptic encephalopathy presentation is recorded here
  as a differential rather than folded in, because the delineating paper is a
  single 2026 cohort and it is not yet clear whether that presentation is the
  severe end of this disorder or a third entity.
review_notes: >-
  Two areas were deliberately left thin rather than filled from secondary
  sources. Frequencies for individual behavioural and musculoskeletal features
  circulate as counts out of the 33-person founding cohort in review literature,
  but the cohort abstract gives only the qualitative list, so per-feature
  frequencies are not asserted here. Prevalence is absent for the same reason -
  no epidemiological estimate exists for a disorder delineated in 2021 with a
  few dozen published cases, and inventing a rarity band would be worse than the
  gap.

- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical convergence point: global developmental delay with or without
    intellectual disability, disproportionate speech and language delay,
    hypotonia, and behavioural and psychiatric problems. The course is static
    rather than degenerative, which is what a developmental chromatinopathy
    predicts and what distinguishes it from a neurometabolic differential.
  evidence:
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed clinical characterization of the proximal SRCAP individuals
      identified shared characteristics: developmental delay with or without
      intellectual disability, behavioral and psychiatric problems, non-specific
      facial features, musculoskeletal issues, and hypotonia.
    explanation: >-
      The phenotype this node represents, as characterized in the founding
      cohort.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Delayed speech and language development
    causal_link_type: DIRECT
  - target: Behavioral and psychiatric problems
    causal_link_type: DIRECT
- name: DEHMBA DNA Methylation Episignature
  biological_scale: MOLECULAR
  role: biomarker
  mechanism_confidence: ESTABLISHED
  description: >-
    A reproducible genome-wide DNA-methylation pattern in peripheral blood,
    distinct from the Floating-Harbor signature and from controls.

    It is included as a pathophysiology node rather than only as a laboratory
    test because it is the evidence that DEHMBA is a separate entity. A
    classifier trained on the FLHS signature calls every DEHMBA case negative,
    and a signature specific to the proximal-variant group emerges when the
    comparison is made against controls. A shared spectrum would not do that.
  cell_types:
  - preferred_term: peripheral blood leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  evidence:
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparing proximal variants with typically developing controls, we
      identified a DNAm signature distinct from the FLHS signature.
    explanation: >-
      The signature itself, and its separation from the FLHS signature.
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A machine-learning model, based on the FLHS DNAm signature, negatively

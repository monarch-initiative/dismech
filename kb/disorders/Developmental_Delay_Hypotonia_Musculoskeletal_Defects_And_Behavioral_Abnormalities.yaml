genetic:
- name: SRCAP
  association: >-
    De novo heterozygous loss-of-function variants outside the Floating-Harbor
    exon 33-34 hotspot.
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: SRCAP
    term:
      id: hgnc:16974
      label: SRCAP
  notes: >-
    The mutational spectrum is wider than point mutations. Beyond nonsense and
    frameshift variants, DEHMBA has been caused by a deep intronic
    splice-altering variant detectable only by adding RNA sequencing to exome
    sequencing, and by a full-length SVA retrotransposon insertion in exon 13.
    Both are invisible to a standard short-read exome pipeline, which matters
    for anyone reporting a negative exome in a compatible phenotype.
  evidence:
  - reference: PMID:38448605
    reference_title: "Combined exome and whole transcriptome sequencing identifies a de novo intronic SRCAP variant causing DEHMBA syndrome with severe sleep disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare heterozygous variants in exons 33-34 of the SRCAP gene are associated
      with Floating-Harbor syndrome and have a dominant-negative mechanism of
      action. At variance, heterozygous null alleles falling in other parts of
      the same gene cause developmental delay, hypotonia, musculoskeletal
      defects, and behavioral abnormalities (DEHMBA) syndrome.
    explanation: >-
      The gene-disease assertion, keyed to variant location.
  - reference: PMID:38448605
    reference_title: "Combined exome and whole transcriptome sequencing identifies a de novo intronic SRCAP variant causing DEHMBA syndrome with severe sleep disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WTS promptly demostrated four different abnormal transcripts affecting
      >40% of the reads, three of which leading to a frameshift.
    explanation: >-
      The transcript-level consequence of a deep intronic allele, quoted
      verbatim including the source's typographical error, since a snippet must
      match the cached text exactly.
  - reference: PMID:35768521
    reference_title: "A neurodevelopmental disorder caused by a novel de novo SVA insertion in exon 13 of the SRCAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The insertion was a full-length (~2.8 kb), antisense-oriented SVA
      insertion relative to the SRCAP transcript, bearing a 5' transduction and
      hallmarks of target-primed reverse transcription.
    explanation: >-
      Documents the structural-variant end of the mutational spectrum, which is
      why chromosomal microarray and transposon-aware calling belong in the
      diagnostic workup.
diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    The primary diagnostic route. Trio testing matters more than usual here
    because the variants are de novo and the phenotype is non-specific, so
    inheritance status carries much of the interpretive weight.
  presence: >-
    Identification of a de novo heterozygous loss-of-function SRCAP variant
    outside exons 33-34 in a compatible phenotype establishes the diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing for SRCAP
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: SRCAP
        term:
          id: hgnc:16974
          label: SRCAP
  evidence:
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present a cohort of 33 individuals with clinical features
      distinct from FLHS and truncating (mostly de novo) SRCAP variants either
      proximal (n = 28) or distal (n = 5) to the FLHS locus.
    explanation: >-
      The founding cohort was ascertained this way, and the proximal or distal
      location is the finding the test has to report.
- name: RNA sequencing after a non-diagnostic exome
  description: >-
    Second-tier testing when clinical suspicion survives a negative exome. A
    deep intronic SRCAP variant produced DEHMBA and was identifiable only once
    whole transcriptome sequencing showed the aberrant transcripts it generated.
  presence: >-
    Aberrant SRCAP transcripts on whole transcriptome sequencing support
    pathogenicity of a variant that DNA-level analysis could not classify.
  diagnosis_term:
    preferred_term: whole transcriptome sequencing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:38448605
    reference_title: "Combined exome and whole transcriptome sequencing identifies a de novo intronic SRCAP variant causing DEHMBA syndrome with severe sleep disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrated the efficacy of a combined ES-WTS approach in
      solving undiagnosed cases.
    explanation: >-
      States the diagnostic yield of adding RNA sequencing, which is the
      recommendation this entry makes.
- name: DNA methylation episignature testing
  description: >-
    An adjunct that does something sequencing cannot: classify an SRCAP variant
    of uncertain significance by the functional signature it leaves in blood,
    and distinguish DEHMBA from Floating-Harbor syndrome when the variant
    location is ambiguous.
  presence: >-
    A methylation profile matching the non-FLHS SRCAP signature supports the
    diagnosis; a profile matching the FLHS signature argues against it.
  diagnosis_term:
    preferred_term: DNA methylation episignature analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:37340855
    reference_title: "Missense variant in SRCAP with distinct DNA methylation signature associated with non-FLHS SRCAP-related neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent DNA methylation studies showed the unique methylation signature
      associated with pathogenic sequence variants in non-FLHS SRCAP-related
      NDD.
    explanation: >-
      A worked case in which episignature testing resolved a variant of
      uncertain significance into a diagnosis.
differential_diagnoses:
- name: Floating-Harbor syndrome
  description: >-
    The differential that matters, because it is the same gene. Everything
    depends on where the truncation sits: inside exons 33-34 gives a stable
    truncated protein and Floating-Harbor syndrome, outside gives a null allele
    and this disorder. Clinically the separator is growth and face - short
    stature, delayed bone age and a recognizable gestalt in FLHS, normal stature
    and non-specific features here - and where the clinical call is unclear, the
    two episignatures decide it.
  disease_term:
    preferred_term: Floating-Harbor syndrome
    term:
      id: MONDO:0007621
      label: Floating-Harbor syndrome
  distinguishing_features:
  - Truncating variant located within SRCAP exons 33-34 rather than outside them.
  - Short stature and delayed bone age, which are absent or much milder in DEHMBA.
  - A recognizable facial gestalt, versus non-specific facial features in DEHMBA.
  - A distinct blood DNA-methylation signature; a classifier trained on the FLHS signature classifies DEHMBA cases negative.
  evidence:
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, for SRCAP, there is a clear relationship between variant
      location, DNAm profile, and clinical phenotype.
    explanation: >-
      States the three-way correspondence that makes this differential
      resolvable rather than a matter of clinical judgement.
  - reference: PMID:23193612
    reference_title: "SRCAP-Related Floating-Harbor Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GENETIC COUNSELING: SRCAP-FHS is inherited in an autosomal dominant
      manner. The majority of affected individuals have a de novo pathogenic
      variant.
    explanation: >-
      Confirms that inheritance pattern and de novo status do not separate the
      two disorders - both are de novo dominant - so the separation has to come
      from variant location, growth phenotype and methylation.
- name: SRCAP-related developmental and epileptic encephalopathy
  description: >-
    A more recently delineated extreme of the same gene's spectrum, in which de
    novo SRCAP variants present as developmental and epileptic encephalopathy.
    Reported alongside a milder focal-epilepsy group carrying biallelic variants
    of lesser predicted damage, so the spectrum is graded by variant severity as
    well as location.
  distinguishing_features:
  - Epilepsy dominates the presentation from early life rather than appearing in a minority.
  - Reported variants are severely damaging truncations or missense changes, or in the milder focal group biallelic and less damaging.
  evidence:
  - reference: PMID:41144712
    reference_title: "De novo SRCAP variants cause developmental and epileptic encephalopathy and the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum ranges from DEE/multisystem developmental
      disorders to FE of varied severity, depending on the damage of variants.
    explanation: >-
      Describes the graded spectrum this differential sits on, and the variant
      property that grades it.
- name: 16p11.2 recurrent microdeletion syndrome
  description: >-
    SRCAP lies at 16p11.2, so a deletion spanning it produces an overlapping
    developmental and behavioural phenotype. The trap for a curator or reporting
    laboratory is that this is a different interval from the well-known
    recurrent BP4-BP5 16p11.2 deletion, and the two should not be conflated on
    the strength of a shared cytoband.
  distinguishing_features:
  - A copy-number result on microarray rather than a sequence-level SRCAP variant.
  - The classic recurrent BP4-BP5 interval is larger and more proximal than an SRCAP-containing deletion.
  notes: >-
    Left without an evidence item deliberately. The overlap is reported in
    review and case literature that this curation round could not resolve to a
    quotable primary abstract, and manufacturing a snippet for it would be worse
    than recording the differential and saying it is uncited.

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, and in practice sporadic: essentially every reported
    DEHMBA variant has arisen de novo in the proband, so recurrence risk to
    siblings is the low background risk of parental gonadal mosaicism rather
    than 50%.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present a cohort of 33 individuals with clinical features
      distinct from FLHS and truncating (mostly de novo) SRCAP variants either
      proximal (n = 28) or distal (n = 5) to the FLHS locus.
    explanation: >-
      Establishes heterozygous, predominantly de novo variants as the causal
      genotype in the founding cohort.
pathophysiology:
- name: SRCAP Loss-of-Function Allele Outside the FLHS Hotspot
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A de novo heterozygous variant in SRCAP that destroys the allele - nonsense,
    frameshift, canonical or deep-intronic splice-altering, or a retrotransposon
    insertion - and lies proximal or distal to exons 33-34.

    The location is the whole point. A truncation inside exons 33-34 escapes
    nonsense-mediated decay and yields a stable shortened protein, which is
    Floating-Harbor syndrome; anywhere else the transcript is degraded and the
    cell is simply short of SRCAP. So a curator or laboratory reading a novel
    SRCAP truncation should ask where it sits before predicting which disease it
    causes, and should not treat DEHMBA as a milder or severer FLHS.
  genes:
  - preferred_term: SRCAP
    term:
      id: hgnc:16974
      label: SRCAP
  genetic_context:
    gene:
      preferred_term: SRCAP
      term:
        id: hgnc:16974
        label: SRCAP
    allele_type: truncating (nonsense, frameshift, splice-altering) or structural
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous null alleles outside exons 33-34, contrasted with the
      dominant-negative truncations inside that hotspot which cause
      Floating-Harbor syndrome.
  evidence:
  - reference: PMID:38448605
    reference_title: "Combined exome and whole transcriptome sequencing identifies a de novo intronic SRCAP variant causing DEHMBA syndrome with severe sleep disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare heterozygous variants in exons 33-34 of the SRCAP gene are associated
      with Floating-Harbor syndrome and have a dominant-negative mechanism of
      action. At variance, heterozygous null alleles falling in other parts of
      the same gene cause developmental delay, hypotonia, musculoskeletal
      defects, and behavioral abnormalities (DEHMBA) syndrome.
    explanation: >-
      States the allelic rule this node encodes - null allele outside the
      hotspot for DEHMBA, dominant-negative inside it for FLHS - in one
      sentence.
  - reference: PMID:33909990
    reference_title: "Truncating SRCAP variants outside the Floating-Harbor syndrome locus cause a distinct neurodevelopmental disorder with a specific DNA methylation signature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating variants in exons 33 and 34 of the SNF2-related CREBBP
      activator protein (SRCAP) gene cause the neurodevelopmental disorder (NDD)
      Floating-Harbor syndrome (FLHS), characterized by short stature, speech
      delay, and facial dysmorphism.
    explanation: >-
      Fixes the hotspot coordinates that outside is defined against, and the
      FLHS phenotype this disease is being separated from.
  - reference: PMID:35768521
    reference_title: "A neurodevelopmental disorder caused by a novel de novo SVA insertion in exon 13 of the SRCAP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA sequencing and qRT-PCR confirmed significant depletion of SRCAP
      expression and low-level exon skipping in the proband.
    explanation: >-
      Direct measurement that a non-hotspot lesion reduces SRCAP transcript,
      which is the loss-of-function claim this node makes rather than a
      prediction from variant class.
  downstream:
  - target: SRCAP Complex Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      Transcript degradation or structural disruption of one allele leaves
      reduced functional SRCAP available to the remodelling complex.
    evidence:
    - reference: PMID:35768521
      reference_title: "A neurodevelopmental disorder caused by a novel de novo SVA insertion in exon 13 of the SRCAP gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        RNA sequencing and qRT-PCR confirmed significant depletion of SRCAP
        expression and low-level exon skipping in the proband.
      explanation: >-
        Measures the step itself - the causal variant is present and SRCAP
        expression is depleted in the same individual.
- name: SRCAP Complex Haploinsufficiency
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced SRCAP dosage leaves the SRCAP chromatin-remodelling complex - the
    human counterpart of yeast SWR1 - operating below its normal capacity. The
    complex's defining job is ATP-dependent exchange of canonical H2A for the
    histone variant H2A.Z, so a shortfall here is a shortfall in H2A.Z
    deposition rather than a general chromatin defect.
  genes:
  - preferred_term: SRCAP
    term:
      id: hgnc:16974
      label: SRCAP
  molecular_functions:
  - preferred_term: ATP-dependent H2A.Z histone chaperone activity
    modifier: DECREASED
    term:
      id: GO:0140849
      label: ATP-dependent H2AZ histone chaperone activity
  protein_complexes:
  - preferred_term: SRCAP complex
    term:
      id: GO:0000812
      label: Swr1 complex
  evidence:
  - reference: PMID:34474679
    reference_title: "The ATPase SRCAP is associated with the mitotic apparatus, uncovering novel molecular aspects of Floating-Harbor syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main function of the SRCAP complex is to promote the exchange of
      histone H2A with the H2A.Z variant.
    explanation: >-
      The complex's catalytic function, which is what a dosage shortfall here
      reduces. Graded OTHER because this is the paper's statement of established
      biochemistry rather than a result it reports.
  downstream:
  - target: Deficient H2A.Z Deposition at Neurodevelopmental Loci
    causal_link_type: DIRECT
    description: >-
      Less functional complex means less histone exchange at its target
      nucleosomes.
    evidence:
    - reference: PMID:40068207
      reference_title: "Srcap loss alters H2A.Z-dependent and neuronal differentiation-related gene expression in N2A cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Chromatin immunoprecipitation revealed reduced H2A.Z occupancy at
        activity-dependent and neurodevelopmental genes upon Srcap knockdown,
        confirming Srcap's role in H2A.Z deposition.
      explanation: >-
        Reducing Srcap and measuring H2A.Z occupancy is exactly this edge, done
        experimentally.
- name: Deficient H2A.Z Deposition at Neurodevelopmental Loci
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    H2A.Z is under-deposited at the complex's target nucleosomes, concentrated
    at activity-dependent and neurodevelopmental genes rather than distributed
    at random. Because H2A.Z occupancy sets chromatin accessibility, this is the
    step where a protein-dosage problem becomes a transcriptional one.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:40068207
    reference_title: "Srcap loss alters H2A.Z-dependent and neuronal differentiation-related gene expression in N2A cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The chromatin remodeler SRCAP plays a critical role in depositing the
      histone variant H2A.Z, which is essential for transcriptional regulation,
      chromatin accessibility, and neurodevelopmental processes.
    explanation: >-
      Names the deposition function and the reason its failure is
      transcriptional.
  downstream:
  - target: Dysregulated Neurodevelopmental Gene Expression
    causal_link_type: DIRECT
    description: >-
      Reduced H2A.Z occupancy tracks with altered expression of the same genes.
    evidence:
    - reference: PMID:40068207
      reference_title: "Srcap loss alters H2A.Z-dependent and neuronal differentiation-related gene expression in N2A cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Gene expression analysis revealed altered expression of
        neurodevelopmental genes in the absence of Srcap, correlating with
        reduced H2A.Z occupancy.
      explanation: >-
        Couples the occupancy change to the expression change in one
        measurement, which is the edge rather than either node alone.
  - target: DEHMBA DNA Methylation Episignature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The blood methylation signature is a reproducible downstream readout of
      the chromatin lesion; the intermediates between altered H2A.Z deposition
      and altered CpG methylation are not established.
- name: Dysregulated Neurodevelopmental Gene Expression
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Transcriptional output at SRCAP target loci is altered. In the mouse the
    dysregulated set is enriched for autism-associated genes, and one target,
    Satb2, has been followed all the way to behaviour.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:38733588
    reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Through RNA sequencing, we identify dysregulation in 27 ASD-related genes
      in Srcap+/- mice.
    explanation: >-
      Shows the dysregulated set is enriched for neurodevelopmental genes rather
      than being a diffuse transcriptional change.
  downstream:
  - target: Reduced Satb2 Expression
    causal_link_type: DIRECT
    description: >-
      Satb2 is the specific target followed mechanistically, via H2A.Z at its
      promoter.
    evidence:
    - reference: PMID:38733588
      reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, we find that Srcap regulates expression of Satb2 via H2A.z
        in the promoter.
      explanation: >-
        Names the regulatory relationship and the mechanism by which it acts,
        which is the claim this edge makes.
- name: Reduced Satb2 Expression
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Satb2 - itself the gene of a distinct neurodevelopmental disorder - is
    expressed at reduced levels because H2A.Z occupancy at its promoter falls.

    This node is mouse-only, and the entry is explicit about that. It is
    retained rather than dropped because it is the one branch of the mechanism
    with interventional support: restoring Satb2 rescues the model phenotype,
    which is a stronger form of evidence than correlation, and it is
    simultaneously the branch whose translation to human DEHMBA is unproven.
  genes:
  - preferred_term: SATB2
    term:
      id: hgnc:21637
      label: SATB2
  evidence:
  - reference: PMID:38733588
    reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therapeutic intervention via retro-orbital injection of adeno-associated
      virus (AAV)-Satb2 in neonatal Srcap+/- mice leads to amelioration of the
      neurodevelopmental and ASD-like abnormalities.
    explanation: >-
      Rescue by restoring the depleted factor, which is what makes this node
      load-bearing in the model rather than merely correlated.
  downstream:
  - target: Parvalbumin Interneuron and Synaptic Deficits
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Satb2 restoration reverses the cellular deficits, so the two are linked,
      but the steps between the transcription factor and interneuron number are
      not resolved.
- name: Parvalbumin Interneuron and Synaptic Deficits
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Fewer parvalbumin-positive interneurons in the retrosplenial cortex and
    dentate gyrus of Srcap heterozygous mice. Inhibitory interneuron loss is a
    recurrent cellular substrate for autism-like and social-behaviour
    phenotypes, and it is consistent with the independent human observation that
    SRCAP is expressed preferentially in inhibitory neurons of the late
    developmental brain.
  cell_types:
  - preferred_term: parvalbumin-expressing GABAergic interneuron
    term:
      id: CL:4023018
      label: pvalb GABAergic interneuron
  locations:
  - preferred_term: retrosplenial cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  - preferred_term: dentate gyrus
    term:
      id: UBERON:0001885
      label: dentate gyrus of hippocampal formation
  evidence:
  - reference: PMID:38733588
    reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, a reduction in parvalbumin-positive neurons is observed in the
      retrosplenial cortex (RSC) and dentate gyrus (DG) of these mice.
    explanation: >-
      The cellular finding and the two regions it was made in.
  - reference: PMID:41144712
    reference_title: "De novo SRCAP variants cause developmental and epileptic encephalopathy and the phenotypic spectrum."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the late developmental brain, EP400 is predominantly expressed in
      excitatory neurons, in contrast to the higher proportion of SRCAP
      expression in inhibitory neurons, explaining the association of SRCAP
      variants with DEE and refractory FE.
    explanation: >-
      Human expression data placing SRCAP preferentially in inhibitory neurons,
      which makes an interneuron-weighted lesion plausible in people. Indirect:
      an expression pattern is not a demonstration that interneurons are lost in
      patients.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Circuit-level consequence of interneuron and synaptic deficits, inferred
      from the mouse behavioural phenotype.
    evidence:
    - reference: PMID:38733588
      reference_title: "Srcap haploinsufficiency induced autistic-like behaviors in mice through disruption of Satb2 expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In this study, we demonstrate that Srcap+/- mice manifest deficits in
        social novelty response, as well as increased repetitive behaviors,
        anxiety, and impairments in learning and memory.
      explanation: >-
        The behavioural output of the model, which is what the cellular deficits

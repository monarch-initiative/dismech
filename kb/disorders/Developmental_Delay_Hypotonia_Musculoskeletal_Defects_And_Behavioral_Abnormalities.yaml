    limitations: >-
      Characterization to date establishes pluripotency and genomic integrity
      only. No disease-relevant phenotype has been reported in these lines, so
      they support the genotype end of the pathograph and nothing downstream of
      it.
    evidence:
    - reference: PMID:41045726
      reference_title: "Three modified human IPSC lines containing mutations in the distal DEHMBA associated locus of the SRCAP gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We modified an existing human iPSC line (MHHi001-A), using CRISPR/Cas9,
        to introduce heterozygous frameshift mutations in a locus of the SRCAP
        gene that is associated with the DEHMBA disease (OMIM 619595).
      explanation: >-
        States the edit and the locus, which is what makes these lines a model
        of this specific allele class.

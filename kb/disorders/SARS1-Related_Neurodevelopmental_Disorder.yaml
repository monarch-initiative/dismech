- name: Insufficient Aminoacylation Capacity for Translational Demand
  biological_scale: CELLULAR
  description: >-
    The organising hypothesis of the whole recessive ARS deficiency family, and
    the reason this disorder's phenotype is not arbitrary. Aminoacylation is the
    committed first step of protein synthesis: the synthetase ligates the amino
    acid to its cognate tRNA, and the resulting aminoacyl-tRNA is handed to
    ribosome elongation factors. A hypomorphic synthetase leaves a cell able to
    translate at rest but unable to scale, so the deficit manifests wherever and
    whenever translational demand is highest - in the tissues with the highest
    amino-acid incorporation rates and during the periods of highest demand, which
    are early growth and intercurrent illness. Fuchs and colleagues reached this
    formulation from the whole recessive ARS cohort, in which SARS was one of the
    thirteen synthetase deficiencies analysed, and drew from it the clinically
    consequential corollary that patients need adequate protein and amino acid
    supply rather than the traditional protein restriction of metabolic disease.

  evidence:
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SARS1 deficiency has already been associated with moderate intellectual disability, ataxia, muscle weakness, and seizure in one family."
    explanation: States ataxia as a feature of the originally described family.

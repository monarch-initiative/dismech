- name: Seizures
  category: Neurologic
  diagnostic: true
  description: >-
    Seizures are the third named feature. In the founding family they were
    generalised tonic-clonic with infantile onset. They also occurred in the
    dominant-negative patient and as part of the acute presentation of febrile
    metabolic decompensation, where a seizure may be the presenting sign of a

name: SARS1-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
  term:
    id: MONDO:0060577
    label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
description: >-
  Neurodevelopmental disorder with microcephaly, ataxia, and seizures (NEDMAS)
  is the single MONDO entity for germline disease caused by variants in SARS1,
  the gene encoding the CYTOPLASMIC seryl-tRNA synthetase (SerRS). SerRS is a
  homodimeric class II aminoacyl-tRNA synthetase that charges serine onto
  tRNA-Ser in a two-step reaction - serine plus ATP to enzyme-bound
  serine-adenylate, then transfer of the seryl moiety to the tRNA - and it also
  serylates the selenocysteine-specific tRNA-Sec, so it stands at the entry
  point of both general cytoplasmic translation and selenoprotein synthesis.
  Every SARS1 allele whose structural position has been published in the clinical
  literature sits in or immediately adjacent to the catalytic core - though
  ClinVar additionally holds a likely-pathogenic in-frame insertion inside the
  C-terminal UNE-S appendage for which no publication could be found - and the
  functional consequence measured in patient material has consistently been the
  same: reduced enzyme abundance and/or reduced serylation activity. The disorder therefore belongs squarely to
  the recessive aminoacyl-tRNA-synthetase (ARS) deficiency family, whose
  proposed unifying mechanism is that residual aminoacylation is sufficient at
  baseline but insufficient to meet translational demand in the organs and life
  periods with the highest protein-synthesis rates. That single premise accounts
  for a phenotype that otherwise looks incoherent: microcephaly with cerebral
  and cerebellar atrophy, moderate intellectual
  disability, ataxia, seizures, muscle weakness and a thin body habitus in the
  originally described families; and, with a different allele, developmental
  delay with central deafness, cardiomyopathy and life-threatening metabolic
  decompensation triggered by fever. The MONDO label names only the first
  presentation, which materially understates the entity - the deafness and
  cardiomyopathy presentation is filed against the same MONDO/OMIM term, and a
  further individual with a de novo, dominant-negative allele presented with
  complex spastic paraplegia and no microcephaly at all. SerRS additionally has
  well-documented non-canonical nuclear activities (repression of VEGFA
  transcription via its UNE-S nuclear localisation signal, and telomere binding
  with POT1); whether these contribute to the human disease has never been
  tested in patient material, and this entry treats the loss-of-charging route
  as the supported mechanism and the moonlighting route as an explicit open
  question rather than smoothing the two together. The disorder is ultra-rare:
  the entire published clinical literature is a handful of families - the Turkish
  family of the deafness-cardiomyopathy report explicitly consanguineous, the
  others not described as such in their abstracts - and single cases.
parents:
- Neurodevelopmental Disorder
- Inborn Error of Metabolism
synonyms:
- NEDMAS
- neurodevelopmental disorder with microcephaly, ataxia, and seizures
- SARS1 deficiency
- seryl-tRNA synthetase 1 deficiency
- cytoplasmic seryl-tRNA synthetase deficiency
- SARS1-related developmental disorder
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The defining and universal morbidity is central-nervous-system: microcephaly,
      moderate intellectual disability, global developmental delay, ataxia,
      tonic-clonic seizures and cerebral plus cerebellar atrophy on imaging. The
      chapter assignment is nonetheless not entirely comfortable, and the reason
      is recorded here rather than hidden. In the deafness-and-cardiomyopathy
      presentation, febrile metabolic decompensation is fatal, and in the one
      episode reported in detail (PMID:42158840) the terminal event was
      cardiogenic shock - so a purely neurological framing would miss the feature
      that actually determines survival. A single
      Harrison's chapter is required, and the neurological features are the ones
      present in every reported individual across every family, so NEUROLOGIC is
      assigned and the cardiac involvement is curated as a phenotype and a
      pathophysiology node instead.
    evidence:
    - reference: PMID:36004946
      reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures (NEDMAS) syndrome is a rare neurodevelopmental disorder characterized by moderate intellectual disability (ID), thin body habitus, microcephaly, seizures, ataxia, muscle weakness, and speech impairment"
      explanation: Enumerates the phenotype as predominantly neurological, which is the basis for the NEUROLOGIC chapter assignment.
  icimd_category:
  - classification_value: non_mitochondrial_trna_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021) places cytoplasmic aminoacyl-tRNA synthetase
      defects under "Disorders of non-mitochondrial tRNA metabolism", within the
      nucleobase/nucleotide/nucleic-acid super-domain. This is the classification
      slot where the SARS1 / SARS2 distinction is machine-visible: SARS2, the
      mitochondrial seryl-tRNA synthetase, would take the separate ICIMD group
      "Disorders of mitochondrial aminoacyl-tRNA synthetases". The two are
      different genes, different compartments, different tRNA pools and different
      diseases.
notes: >-
  Entity verification, run before any content was written. `runoak -i
  sqlite:obo:mondo info MONDO:0060577 -O obo` returns name "neurodevelopmental
  disorder with microcephaly, ataxia, and seizures", synonym NEDMAS, xrefs
  OMIM:617709, MEDGEN:1613354, GARD:0022576, UMLS:C4540188, parent MONDO:0100500
  (Mendelian neurodevelopmental disorder), and `relationship: RO:0004003
  HGNC:10537 ! SARS1`. `runoak -i sqlite:obo:mondo relationships --direction down
  -p RO:0004003 HGNC:10537` returns exactly one disease, MONDO:0060577, so MONDO
  has not split the SARS1 phenotype and this entry is the whole gene's germline
  disease space. `runoak -i sqlite:obo:hgnc info hgnc:10537 -O obo` confirms
  symbol SARS1, name "seryl-tRNA synthetase 1", Entrez 6301, Ensembl
  ENSG00000031698, UniProt P49591, EC 6.1.1.11, gene MIM 607529, with alias
  symbols SERS, "seryl-tRNA synthetase" and "serine tRNA ligase 1, cytoplasmic".
  That alias list matters for reading the literature: the founding clinical paper
  and all the pre-2019 mechanistic work call the gene SARS, not SARS1, and the
  protein SerRS.

  Named Entity Confusion - the trap for this gene, and what was done about it.
  The obvious NEC risk is SARS2, the MITOCHONDRIAL seryl-tRNA synthetase, whose
  disease is HUPRA syndrome. That contrast was verified with OAK before being
  named anywhere in this entry rather than typed from memory: `runoak -i
  sqlite:obo:hgnc search "SARS2"` returns hgnc:17697, whose definition is
  "seryl-tRNA synthetase 2, mitochondrial" (note it also carries the EXACT
  synonym "SARS", which is precisely how a literature search collides); and
  `runoak -i sqlite:obo:mondo info MONDO:0013458 -O obo` returns
  hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome, synonym
  "HUPRA syndrome", xref OMIM:613845 and Orphanet:363694, with `RO:0004003
  HGNC:17697 ! SARS2` and parents including mitochondrial oxidative
  phosphorylation disorder. Different HGNC ID, different OMIM number, different
  MONDO term, different compartment, different disease. HUPRA is curated below as
  a mechanistic contrast, not as a source of content, and no HUPRA literature was
  used for any claim in this file.

  Two further NEC risks were checked and are recorded because they nearly cost
  content. First, the founding publication (PMID:28236339) reports TWO genes in
  TWO unrelated Iranian families: SARS in family 1 and WARS2 - the MITOCHONDRIAL
  tryptophanyl-tRNA synthetase - in family 2. Only the family 1 material belongs
  to this entry. The WARS2 family is a different MONDO entity, verified as
  MONDO:0060578 (neurodevelopmental disorder, mitochondrial, with abnormal
  movements and lactic acidosis, with or without seizures; OMIM:617710;
  `RO:0004003 HGNC:12730 ! WARS2`), and every snippet taken from PMID:28236339 in
  this file was checked to be about the SARS family and not the WARS2 family.
  Second, PMID:35790048 reports "five individuals with biallelic missense
  variants in WARS1 or SARS1" without splitting the count in the abstract; the
  cytoplasmic WARS1 recessive disorder is a separate verified entity
  (MONDO:0957218, OMIM:620317, `RO:0004003 HGNC:12729 ! WARS1`), so that paper is
  quoted only for statements that are explicitly about SARS1 or about both genes
  jointly, and NO per-patient count is attributed to SARS1 from it.

  Third NEC risk, and the reason a plain PubMed search on this gene is
  dangerous: the token "SARS" retrieves the coronavirus literature, and "SARS1"
  additionally retrieves oncology biomarker papers (invasive lobular carcinoma,
  head and neck squamous cell carcinoma) that are expression-correlation studies
  with no germline disease content. Searches were therefore run as SARS1 or
  "seryl-tRNA synthetase" conjoined with microcephaly / intellectual disability /
  ataxia / seizures / aminoacylation, and each hit was read before use. All
  disease papers used here name SARS1 or SARS as the causal gene.

  Scope decision, and it is a real decision rather than a formality. MONDO gives
  SARS1 one disease term, but the published phenotype has three faces: (i) the
  microcephaly-ataxia-seizure presentation of the Iranian and Turkish families
  that gives the term its name; (ii) developmental delay with central deafness,
  cardiomyopathy and fatal febrile metabolic decompensation (PMID:34570399,
  PMID:42158840); and (iii) complex spastic paraplegia WITHOUT microcephaly from
  a de novo dominant-negative allele (PMID:36041817). ClinVar was consulted to
  test whether (ii) is filed as the same condition: the Musante allele
  c.514G>A (p.Asp172Asn, VCV000440921) and the Ravel allele c.638G>T
  (p.Arg213Leu, VCV001209576) are BOTH recorded against the condition
  "Neurodevelopmental disorder with microcephaly, ataxia, and seizures"
  (E-utilities query, retrieved 2026-08-01). This entry therefore curates the
  whole SARS1 germline spectrum under this term, and says explicitly wherever a
  feature belongs to one presentation and not another. The alternative - curating
  only the microcephaly presentation - would have left the only treatable and the
  only lethal feature of the disorder out of the knowledge base.

  Cohort arithmetic, deliberately not totalled. The published individuals cannot
  be summed reliably from cached abstracts, and no total is asserted anywhere in
  this entry. PMID:28236339 describes one Iranian family; the HPO annotation set
  for OMIM:617709 gives denominators of 4 for that family, sourced to
  PMID:28236339 (retrieved 2026-08-01 from
  https://ontology.jax.org/api/network/annotation/OMIM:617709), and the abstract
  itself gives no count. PMID:34570399 describes "children" in one consanguineous
  Turkish family without a number in the abstract. PMID:36004946 states "three
  unrelated Turkish families with four NEDMAS patients" but then says "both
  patients carried" the variant - an internal inconsistency in the abstract that
  is recorded here rather than resolved by guesswork, since the full text is not
  cached. PMID:35790048 gives five individuals across WARS1 AND SARS1 combined.
  PMID:36041817 is one patient. PMID:42158840 is one patient (from the family of
  PMID:34570399, on the internal evidence of Turkish origin, shared authorship
  from Nancy, and three siblings dead of febrile crises) plus a literature review
  whose contents are not in the cached abstract. Adding these would double-count.

  Frequency bands are omitted from every phenotype for the same reason. Where
  HPO annotation fractions exist they are recorded verbatim in each phenotype's
  `notes:` with their denominator and source, which is more informative and less
  falsifiable than a FrequencyEnum band derived from a single family.

  Structured-source evidence was unavailable. `data/orphadata/` and
  `data/clingen/` in this checkout contain only `MANIFEST.yaml` with no
  downloaded payload; a literal `grep -l "SARS1" references_cache/CGGV_*.md`
  across the 479 cached ClinGen assertions returned nothing, and MONDO:0060577
  carries no Orphanet xref. So no Orphanet prevalence class and no ClinGen
  gene-disease validity classification could be consulted. Per the scope rules
  the manifests were not touched. This is a gap, not an assertion that no such
  classification exists.

  A search for a GeneReviews chapter covering SARS1, performed on 2026-08-01,
  returned none; that is a statement about the search, not a guarantee that no
  chapter exists. No animal model
  of the human disease was found in the sources consulted: the zebrafish sars mutants that exist
  (PMID:19423847) were isolated for a VASCULAR phenotype and are curated below as
  a model of the gene's non-canonical function, explicitly NOT as a model of this
  neurodevelopmental disorder.

  Only abstracts are cached for PMID:28236339, PMID:36004946, PMID:34570399,
  PMID:35790048, PMID:36041817, PMID:42158840 and PMID:38255739; full text is
  cached for PMID:24095058, PMID:29875423, PMID:22353712, PMID:19423847 and
  PMID:27913726. Every claim sourced from a full text rather than an abstract is
  quoted from the cached body, and everything that could not be quoted from a
  cached file is in a `notes:` block rather than in an evidence snippet.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The dominant mode by a wide margin. Every family in the microcephaly and in
    the cardiomyopathy presentations was recessive: a homozygous missense allele
    in the Iranian family, and biallelic c.638G>T (p.Arg213Leu) in
    the consanguineous Turkish family. For the recessive ARS deficiencies as a
    class, the ARS review states that heterozygous parents of patients are
    unaffected and reads that as evidence of excess capacity in ARS activity - the
    central quantitative claim of the family: one functional allele supplies enough
    aminoacylation capacity, and disease requires that both alleles be damaged while
    still leaving some residual activity, because complete loss of a cytoplasmic
    aminoacyl-tRNA synthetase is not compatible with life. No cached SARS1 paper
    reports the phenotype of any SARS1 carrier parent directly, so the carrier
    statement is inherited from the class and not from a SARS1 observation.

    Penetrance is recorded as UNKNOWN rather than COMPLETE. Every reported
    biallelic individual is affected, but every reported biallelic individual was
    ascertained because they were affected, and the total number of families is
    in single figures. There is no population-scale genotype-first data for any
    SARS1 allele, so a penetrance claim of any kind would be an artefact of
    ascertainment. The HPO annotation set for OMIM:617709 records HP:0000007
    (autosomal recessive inheritance) sourced to PMID:28236339 (retrieved
    2026-08-01) and no dominant inheritance annotation, which is consistent with
    the dominant-negative case (PMID:36041817) postdating the annotation rather
    than contradicting it.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous missense mutation (c.514G>A, p.Asp172Asn) in the cytoplasmic seryl-tRNA synthetase (SARS) gene"
    explanation: A homozygous missense allele segregating in a single family is the founding evidence for autosomal recessive inheritance at this locus, and names the compartment (cytoplasmic) that distinguishes SARS1 from SARS2.
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a new clinical presentation including developmental delay, central deafness, cardiomyopathy, and metabolic decompensation during fever leading to death, in a consanguineous Turkish family, with biallelic variants (c.638G>T, p.(Arg213Leu)) in SARS1"
    explanation: Independent recessive family with a different biallelic allele, confirming the inheritance mode in a second, phenotypically distinct presentation.
  - reference: PMID:35790048
    reference_title: "WARS1 and SARS1: Two tRNA synthetases implicated in autosomal recessive microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seryl-tRNA synthetase 1 (SARS1) has rarely been implicated in an autosomal recessive developmental disorder."
    explanation: Independent statement of the inheritance mode from a third group, in a paper reporting a further SARS1 family.
  - reference: PMID:29875423
    reference_title: "Aminoacyl-tRNA synthetase deficiencies in search of common themes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that heterozygous parents of patients are unaffected suggests that on the other hand there is some excess capacity in ARS activity."
    explanation: Sources the carrier statement to the recessive ARS deficiency class rather than to a SARS1-specific observation, and states the excess-capacity reading it licenses.
- name: Autosomal dominant inheritance
  description: >-
    A single reported exception, and it is mechanistically informative rather
    than a nosological nuisance. One patient carried a DE NOVO splice-site
    deletion producing a five-amino-acid in-frame insertion near the active site,
    and complementation in Saccharomyces cerevisiae plus serylation assays in
    both yeast and the patient's own fibroblasts showed the allele to be not
    merely loss-of-function but DOMINANT NEGATIVE. Because SerRS is an obligate
    homodimer, a catalytically dead subunit that still dimerises poisons the
    wild-type subunit it partners, so a single such allele can drop total cellular
    serylation below the threshold that one intact recessive allele comfortably
    supports. That patient's phenotype was also different: complex spastic
    paraplegia with ataxia, intellectual disability, developmental delay and
    seizures, but explicitly WITHOUT microcephaly.

    Recorded because the mode of inheritance for this gene cannot be stated as
    autosomal recessive without qualification, and a diagnostic laboratory that
    filters SARS1 for biallelic hits only will miss this class of allele. It rests
    on a single published patient. The homodimer-poisoning rationale above is the
    standard interpretation of a dominant-negative allele in an obligate-dimeric
    class II synthetase and is consistent with the cited assays, but the specific
    claim that the mutant subunit heterodimerises with wild-type SerRS was not
    itself demonstrated in that paper and is therefore reasoning, not a finding.
    Penetrance is UNKNOWN on a single case.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: UNKNOWN
  evidence:
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo splice site deletion in SARS1 was identified in our patient, resulting in a 5-amino acid in-frame insertion near its active site."
    explanation: Establishes a de novo, monoallelic SARS1 event as a cause of disease at this locus.
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation assays in S. cerevisiae and serylation assays in both yeast strains and patient fibroblasts proved a loss-of-function, dominant negative effect."
    explanation: Functional demonstration that the de novo allele acts dominant-negatively, which is what makes a monoallelic genotype sufficient for disease.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence estimate of any kind has been published for this
    disorder, and MONDO:0060577 carries no Orphanet xref, so there is no source to
    band and `rate_per_100000` is deliberately empty. `NOT_YET_DOCUMENTED` is used
    rather than a qualitative ultra-rare band for that reason. A total published
    case count is also deliberately not asserted: see the entry-level notes for
    why the individual reports cannot be summed from cached abstracts without
    double-counting. What can be said, and is quoted below, is that as of mid-2022
    only two families had been reported, and that the reported families are
    Iranian and Turkish kindreds, the Turkish ones described as consanguineous -
    which reflects ascertainment
    through consanguinity-enriched autosomal-recessive intellectual-disability
    cohorts and must NOT be read as population restriction.
  evidence:
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, only two families with NEDMAS have been reported."
    explanation: Establishes the scale of the published experience as of 2022, which is the basis for treating the disorder as ultra-rare and for declining to band a prevalence.
  - reference: PMID:35790048
    reference_title: "WARS1 and SARS1: Two tRNA synthetases implicated in autosomal recessive microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seryl-tRNA synthetase 1 (SARS1) has rarely been implicated in an autosomal recessive developmental disorder."
    explanation: Independent characterisation of the disorder as rarely reported, supporting NOT_YET_DOCUMENTED rather than any numeric estimate.
pathophysiology:
- name: Damaging SARS1 Alleles in the Catalytic Core
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is damage to SARS1 at 1p13.3, reported against transcript
    NM_006513.4. What is striking about the allelic series is its positional
    consistency: the founding homozygous missense c.514G>A (p.Asp172Asn) was
    described as affecting the enzymatic core domain; the variant reported by
    Bogershausen and colleagues was mapped structurally to a position directly
    within the enzyme's active site; the de novo splice-site deletion reported by
    Verdura and colleagues produces a five-residue in-frame insertion near the
    active site. Every allele reported in the clinical literature with a published
    structural position therefore
    converges on the aminoacylation machinery rather than on the tRNA-binding
    domain, the dimer interface or the vertebrate-specific UNE-S appendage. This
    is the single most important structural observation in the entry, because it
    is what licenses reading the disorder as a charging defect rather than as a
    defect of one of SerRS's non-canonical activities.
  genes:
  - preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  mechanism_confidence: ESTABLISHED
  notes: >-
    Three qualifications. First, "converges on the catalytic core" is a statement
    about the alleles whose position has been published in the clinical
    literature, not about all alleles:
    ClinVar holds SARS1 entries whose position and effect are unannotated, and the
    Karaer allele c.1196C>T (p.Thr399Met) has no published structural mapping.
    Second, there is a known counterexample outside the published series:
    VCV004529504, c.1483GCA[4] p.Ala497_Arg498insAla, is classified Likely
    pathogenic for this condition in ClinVar and its residues fall inside the
    C-terminal UNE-S appendage (F470-A514 in PMID:22353712), not in the catalytic
    core. No publication for that record could be found, so it is not part of the
    allelic series above, but it is recorded here so that the convergence claim is
    not read as exceptionless.
    Third, the position of an allele is not by itself evidence of its mechanism;
    the mechanistic weight in this entry is carried by the enzyme-activity and
    protein-abundance measurements in the downstream nodes, not by position alone.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation affects the enzymatic core domain of the protein and impairs its enzymatic activity, probably leading to reduced cytoplasmic tRNASer concentrations."
    explanation: Places the founding allele in the enzymatic core and states the immediate functional consequence, which is the starting point of the causal chain modelled below.
  - reference: PMID:35790048
    reference_title: "WARS1 and SARS1: Two tRNA synthetases implicated in autosomal recessive microcephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structural mapping showed that the SARS1 variant is located directly within the enzyme's active site, most likely diminishing activity, while the WARS1 variant is located in the N-terminal domain."
    explanation: Independent structural mapping of a second SARS1 allele into the active site, establishing the positional convergence of the allelic series.
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo splice site deletion in SARS1 was identified in our patient, resulting in a 5-amino acid in-frame insertion near its active site."
    explanation: A third allele, of a different class and a different inheritance mode, again located at the active site.
  downstream:
  - target: Reduced SerRS Protein Stability and Steady-State Abundance
    description: >-
      The abundance arm. Both the p.Asp172Asn and the p.Arg213Leu missense alleles
      were shown to destabilise the protein, so less enzyme is present before any
      question of per-molecule catalytic competence arises.
  - target: Deficient Serylation of tRNA-Ser
    description: >-
      The catalytic arm. Active-site alleles reduce the specific activity of the
      enzyme that is present, independently of how much of it there is.
  - target: Dominant-Negative Poisoning of the SerRS Homodimer
    description: >-
      The allele-specific arm. The de novo in-frame insertion acts dominant
      negatively, which is a property of the allele rather than a consequence of
      reduced total protein, and so branches directly from the variant node.
- name: Reduced SerRS Protein Stability and Steady-State Abundance
  biological_scale: MOLECULAR
  description: >-
    Two independently reported missense alleles reduce the amount of SerRS in the
    cell rather than only its per-molecule activity. The founding p.Asp172Asn
    allele was predicted to be unstable and this was substantiated for ectopically
    expressed mutant protein in transfected HEK293T cells; the p.Arg213Leu allele
    was shown to cause protein instability with a consequent fall in both protein
    level and enzymatic activity. Instability is the commonest single mechanism
    across the recessive ARS deficiencies and it has a specific consequence for
    this disease: the deficit is in total cellular charging CAPACITY, which is
    exactly the quantity that a rise in translational demand can outstrip.
  genes:
  - preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  molecular_functions:
  - preferred_term: serine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004828
      label: serine-tRNA ligase activity
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  mechanism_confidence: ESTABLISHED
  notes: >-
    Evidence quality differs between the two alleles and the difference is worth
    keeping. For p.Asp172Asn the demonstration was in ectopically expressed
    protein in a transfected immortalised cell line, not in patient cells, so it
    establishes that the substitution destabilises the protein but not the
    steady-state level in a patient neuron. For p.Arg213Leu the reported result is
    reduced protein level together with reduced activity. Neither report is a
    measurement in human brain.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant protein was predicted to be unstable, which could be substantiated by investigating ectopic mutant SARS in transfected HEK293T cells."

- name: Demand-Dependent Decompensation During Febrile Catabolic Stress
  biological_scale: ORGANISM
  description: >-
    The most clinically consequential node in the entry and the clearest test of
    the demand-capacity model. In the SARS1 family reported from Nancy, febrile
    illness precipitated acute metabolic decompensation that was fatal; three
    siblings of the surviving proband died during similar febrile episodes. Fever
    raises basal metabolic rate, drives protein catabolism, and increases the
    demand for de novo protein synthesis for the acute-phase response and for
    tissue repair - precisely the demand that a hypomorphic synthetase cannot
    meet. The decompensation is multi-system, presenting with vomiting, hypotonia
    and seizures, and its lethal component is cardiac. The clinical corollary
    inverts standard metabolic-crisis management: rather than restricting protein,
    these patients need more of the limiting amino acid, and escalation of L-serine
    was associated with survival of an episode that had killed the patient's
    untreated siblings.
  biological_processes:
  - preferred_term: cytoplasmic translation
    modifier: DECREASED
    term:
      id: GO:0002181
      label: cytoplasmic translation
  chemical_entities:
  - preferred_term: L-serine
    term:
      id: CHEBI:17115
      label: L-serine
  mechanism_confidence: PROVISIONAL
  notes: >-
    The mechanistic account above - fever raises translational demand beyond
    residual charging capacity - is the model advanced for the ARS family, not a
    measurement made in a SARS1 patient during a crisis. No biochemical marker of
    the crisis has been characterised: there is no published amino acid profile,
    no charged-tRNA measurement, and no integrated-stress-response readout from a
    decompensating SARS1 patient. This is a substantial gap, because it means
    there is currently no laboratory test that can confirm a SARS1 crisis is
    underway or track its resolution, and it is recorded as a knowledge-gap
    discussion below. Note also that fever-triggered decompensation has so far
    been reported only in the p.Arg213Leu family; it is NOT known whether the
    microcephaly-presentation alleles carry the same risk, and that uncertainty
    has direct implications for whether all SARS1 patients should be issued an
    emergency protocol.

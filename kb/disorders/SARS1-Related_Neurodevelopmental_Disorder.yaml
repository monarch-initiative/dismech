- name: Slender build
  category: Growth
  description: >-
    A thin body habitus is listed among the defining features of NEDMAS and was a
    main manifestation in the Turkish probands. It fits the demand-capacity model
    directly: a ceiling on protein synthesis constrains the accretion of lean mass,
    and failure to thrive is one of the features common across recessive ARS
    deficiencies.
  phenotype_term:
    preferred_term: Slender build
    term:
      id: HP:0001533
      label: Slender build

- name: Cellular Senescence with a Senescence-Associated Secretory Phenotype
  biological_scale: CELLULAR
  description: >-
    The only cell-autonomous phenotype demonstrated in human SARS1 patient cells.
    Fibroblasts from the patient with the de novo dominant-negative allele showed
    abnormal cell shape, arrested division, increased beta-galactosidase staining,
    and a senescence-associated secretory phenotype with raised interleukin-6,
    p21, p16 and p53. The authors read this as revealing a role for SARS1 in the
    regulation of cell growth, division and senescence. There are two ways this
    could arise and they are not mutually exclusive: a translational ceiling is
    itself a proliferation constraint and chronically stalled growth engages
    p53/p21-dependent arrest; alternatively, the senescence could reflect loss of
    a non-canonical SerRS activity, since SerRS binds telomeric DNA and cooperates
    with the shelterin protein POT1 to regulate telomere length and senescence.
    Distinguishing these would require testing whether senescence is rescued by
    restoring serylation alone.
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  mechanism_confidence: PROVISIONAL
  notes: >-
    Scope caveat. This result comes from the fibroblasts of the ONE patient with
    the dominant-negative allele and the atypical spastic-paraplegia phenotype. It
    has not been reproduced in fibroblasts from any recessive SARS1 patient, so it
    is not established as a general feature of the disorder, and it should not be
    read backwards as evidence that the microcephaly families' cells senesce. Its
    relevance to a post-mitotic neuron, which does not divide, is also unclear -
    senescence-like states in neurons are described but are not the same
    phenomenon as replicative arrest in a fibroblast.
  evidence:
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts showed an abnormal cell shape, arrested division and increased beta-galactosidase staining along with a senescence-associated secretory phenotype (raised interleukin-6, p21, p16 and p53 levels)."
    explanation: The primary patient-cell demonstration of senescence and its molecular markers.
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We refine the phenotypic spectrum and modes of inheritance of a newly described, ultrarare neurodevelopmental disorder, while unveiling the role of SARS1 as a regulator of cell growth, division and senescence."
    explanation: The authors' own framing of SARS1 as a regulator of growth, division and senescence, which is the interpretive claim this node records.
  - reference: PMID:38255739
    reference_title: "Protein-Protein Interactions of Seryl-tRNA Synthetases with Emphasis on Human Counterparts and Their Connection to Health and Disease."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Additionally, SerRS binds telomeric DNA and cooperates with the shelterin protein POT1 to regulate telomere length and cellular senescence."
    explanation: >-
      Marked PARTIAL. It supplies an independent, non-translational route by which
      SerRS loss could cause senescence, which is the alternative explanation named
      in this node's description. It is a review statement about SerRS biology in
      general and says nothing about any patient allele, so it supports the
      existence of the alternative route and not its operation in this disease.
- name: Impaired Selenocysteine Incorporation
  biological_scale: MOLECULAR
  description: >-
    A predicted second consequence of the same enzyme deficit, included because
    it is a specific, testable prediction that the aminoacylation literature makes
    and the clinical literature has never examined. Selenoprotein synthesis in all
    domains of life begins with SerRS serylating the selenocysteine-specific
    tRNA-Sec; the serylated intermediate is then converted to
    selenocysteinyl-tRNA-Sec for co-translational insertion of the 21st amino acid.
    A hypomorphic SerRS therefore throttles the supply of the obligatory precursor
    for every selenoprotein. Which selenoproteins would be rate-limited first, and
    whether any of them are the antioxidant enzymes usually invoked, is not
    addressed by any source cached for this entry. If this
    arm operates, it would predict oxidative vulnerability that worsens under
    febrile stress and would give SARS1 deficiency a pathophysiological component
    that other ARS deficiencies do not have.
  biological_processes:
  - preferred_term: selenocysteine incorporation
    modifier: DECREASED
    term:
      id: GO:0001514
      label: selenocysteine incorporation
  - preferred_term: conversion of seryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec)
    modifier: DECREASED
    term:
      id: GO:0001717
      label: conversion of seryl-tRNAsec to selenocys-tRNAsec
  molecular_functions:
  - preferred_term: serine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004828
      label: serine-tRNA ligase activity
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    Explicitly HYPOTHETICAL and flagged as such rather than presented as part of
    the mechanism. No selenoprotein measurement, plasma selenium, glutathione
    peroxidase activity or selenocysteine-recoding assay has been reported in any
    SARS1 patient. The only established element is the biochemistry: SerRS
    serylates tRNA-Sec. Whether a partial reduction in SerRS activity is enough to
    limit the tRNA-Sec branch specifically is unknown - tRNA-Sec is a
    quantitatively minor substrate, so it could equally be spared or
    preferentially affected. This node is retained because it is cheap to test and
    would be diagnostically useful if true, not because there is evidence for it.
  evidence:
  - reference: PMID:24095058
    reference_title: "Crystal structure of human Seryl-tRNA synthetase and Ser-SA complex reveals a molecular lever specific to higher eukaryotes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SerRS also serylates the selenocysteine-specific tRNA (tRNASec) to participate in the translational incorporation of selenocysteine"
    explanation: Establishes that the same enzyme performs the first committed step of selenoprotein synthesis, which is the entire basis for this hypothetical arm.
- name: Loss of Non-Canonical Nuclear SerRS Function
  biological_scale: MOLECULAR
  description: >-
    Vertebrate SerRS is not only a synthetase. It acquired a C-terminal UNE-S
    domain in the lineage that developed closed circulatory systems; UNE-S carries
    a nuclear localisation signal that directs SerRS into the nucleus, where it
    attenuates VEGFA expression, acting through a complex with the transcription
    factor YY1 that binds distal cis-regulatory elements of the vegfa promoter and
    competes with activating factors. Genetically, this is not a minor
    embellishment: zebrafish sars mutants isolated in a vascular screen show
    dilated aortic arch vessels and aberrant hindbrain capillary patterning in a
    Vegf-dependent manner, and human SerRS alleles that disrupt nuclear
    localisation cause abnormal vasculature and premature death in fish. The
    question for this entry is whether any of this contributes to the human
    disease. The honest answer is that it is not known, and this node exists to
    say so precisely rather than to leave the moonlighting literature quietly
    attached to the mechanism.
  genes:
  - preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  biological_processes:
  - preferred_term: negative regulation of vascular endothelial growth factor production
    modifier: ABNORMAL
    term:
      id: GO:1904046
      label: negative regulation of vascular endothelial growth factor production
  - preferred_term: telomere maintenance
    modifier: ABNORMAL
    term:
      id: GO:0000723
      label: telomere maintenance
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  mechanism_confidence: HYPOTHETICAL
  notes: >-
    Why this is marked HYPOTHETICAL and kept out of the main causal chain. Three
    arguments say the human disease is a charging defect and not a moonlighting
    defect. (1) Every SARS1 allele reported in the clinical literature with a
    published location maps to the catalytic core or active site, not to UNE-S or
    its NLS; the one UNE-S-region allele this curation found, ClinVar
    VCV004529504 p.Ala497_Arg498insAla, has no accompanying publication and no
    functional data, so it weakens the argument without overturning it. (2) The functional
    assays performed in patient material measured serylation and protein
    abundance, and both were abnormal, so the charging deficit is demonstrated
    rather than assumed. (3) No vascular malformation, no VEGFA-related phenotype
    and no angiogenic abnormality has been reported in any SARS1 patient, in
    contrast to the striking vascular phenotype of the fish mutants.

    One argument on the other side, and it is not negligible. The SerRS/YY1
    interaction that represses vegfa is mediated by the CATALYTIC domain of SerRS,
    which is exactly the region the patient alleles damage - so an active-site
    variant is not automatically innocent with respect to the nuclear function.
    Whether p.Asp172Asn, p.Arg213Leu or p.Thr399Met perturbs nuclear import,
    YY1 binding or VEGFA repression has never been tested. Until it is, the
    contribution of this arm is unknown rather than excluded, and this entry does
    not attach any human phenotype to it.
  evidence:
  - reference: PMID:22353712
    reference_title: "Unique domain appended to vertebrate tRNA synthetase is essential for vascular development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UNE-S harbours a robust nuclear localization signal (NLS) directing SerRS to the nucleus where it attenuates vascular endothelial growth factor A expression"
    explanation: Establishes the nuclear, VEGFA-repressing activity of SerRS and the domain that mediates it.
  - reference: PMID:24095058
    reference_title: "Crystal structure of human Seryl-tRNA synthetase and Ser-SA complex reveals a molecular lever specific to higher eukaryotes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations that disrupted SerRS nuclear localization caused abnormal vasculature and premature death in zebrafish."
    explanation: Shows the nuclear function is essential at the organism level in a vertebrate, which is why it cannot simply be dismissed as an in vitro curiosity.
  - reference: PMID:27913726
    reference_title: "Competitive binding between Seryl-tRNA synthetase/YY1 complex and NFKB1 at the distal segment results in differential regulation of human vegfa promoter activity during angiogenesis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "we found that the catalytic domain of Seryl-tRNA synthetase (SerRS) interacted with transcription factor Yin Yang 1 (YY1) to form a SerRS/YY1 complex that negatively controls vegfa promoter activity"
    explanation: >-
      Marked PARTIAL. It identifies the CATALYTIC domain as the region mediating
      the nuclear repressor function, which is the one concrete reason a
      catalytic-core patient allele might also disrupt moonlighting. It is
      biochemistry in cell lines with no patient material, so it establishes the
      possibility and not its relevance to this disorder.
  - reference: PMID:38255739
    reference_title: "Protein-Protein Interactions of Seryl-tRNA Synthetases with Emphasis on Human Counterparts and Their Connection to Health and Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human cytosolic SerRS is a cellular hub protein connecting translation to vascular development, angiogenesis, lipogenesis, and telomere maintenance."
    explanation: Summarises the breadth of documented non-canonical SerRS activities, which is the scope of what is untested in this disease.
genetic:
- name: SARS1
  association: >-
    Biallelic missense and splice variants in the catalytic core cause autosomal
    recessive disease; one de novo, dominant-negative in-frame insertion allele
    has been reported
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  notes: >-
    Nomenclature and identity. HGNC:10537 is symbol SARS1, "seryl-tRNA synthetase
    1", at 1p13.3, Entrez 6301, Ensembl ENSG00000031698, UniProt P49591, EC
    6.1.1.11, gene MIM 607529 (OAK, `runoak -i sqlite:obo:hgnc info hgnc:10537 -O
    obo`, 2026-08-01). The former approved symbol was SARS, which is how the gene
    appears in PMID:28236339 and in all the pre-2019 mechanistic literature, and
    the protein is universally called SerRS. Do not confuse with SARS2
    (hgnc:17697), the mitochondrial enzyme, which unhelpfully also carries "SARS"
    as an exact synonym in HGNC.

    Allelic series, as published. c.514G>A (p.Asp172Asn), homozygous, Iranian
    family, enzymatic core domain, impaired activity and predicted plus
    demonstrated protein instability (PMID:28236339). c.638G>T (p.Arg213Leu),
    biallelic, consanguineous Turkish family, protein instability with reduced
    protein level and enzymatic activity (PMID:34570399). c.1196C>T (p.Thr399Met),
    reported as a novel variant in a Turkish series of three unrelated families
    with four patients; the abstract says only that "both patients carried" it, so
    how many of the four it was found in cannot be determined from the cached text
    and no family or patient count is asserted for this allele here - see the
    CURATION_TODO (PMID:36004946). A
    further variant mapped structurally into the active site (PMID:35790048) - the
    abstract does not give its coding change, and the full text is not cached, so
    no HGVS string is asserted for it here. A de novo splice-site deletion causing
    a five-residue in-frame insertion near the active site, dominant negative
    (PMID:36041817). All coding changes are against NM_006513.4, the transcript
    ClinVar uses for this gene.

    Variant classification is genuinely unsettled and is recorded rather than
    smoothed. A ClinVar E-utilities query on 2026-08-01
    (`esearch db=clinvar term="SARS1[gene] AND single_gene[prop]"`) returned 69
    records.
    Both founding disease alleles - c.514G>A (VCV000440921) and c.638G>T
    (VCV001209576) - are filed against the condition "Neurodevelopmental disorder
    with microcephaly, ataxia, and seizures" but currently return "no
    classifications from unflagged records", so ClinVar carries no usable
    classification for either. The Karaer allele c.1196C>T (VCV002506443) is
    classified Uncertain significance against "not specified" by a single
    submitter with criteria - that is, the variant published as the cause of
    disease in a Turkish series is a VUS in ClinVar. Two other alleles,
    c.447+1G>A (VCV003893287) and c.1483GCA[4] p.Ala497_Arg498insAla
    (VCV004529504), are Likely pathogenic for this condition and have no
    corresponding publication that this curation could find. Residues 497-498
    fall inside the C-terminal UNE-S appendage, whose boundaries are given as
    470-514 in the cached full text of PMID:22353712 ("the entire UNE-S
    (delta470-514)"); that domain assignment is arithmetic on a cached range,
    not a claim taken from any SARS1 clinical paper. A laboratory
    reporting a SARS1 variant should therefore expect the evidence base to be
    thinner than the OMIM entry implies. These ClinVar figures are from the public
    API and are not quotable from a cached reference, so they appear here and not
    as evidence snippets.

    Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF, missense
    Z) are NOT recorded anywhere in this entry because no cached source provides
    them and populating them from memory is exactly the failure mode the evidence
    rules exist to prevent. No allele frequency is asserted for any variant. No
    founder effect is claimed: the recurrence of Turkish and Iranian ancestry in
    the reports most likely reflects ascertainment in consanguinity-enriched
    recessive cohorts, and consanguinity is stated in the cached abstracts only
    for the Turkish family of PMID:34570399 - PMID:36004946 describes its Turkish
    families as unrelated but says nothing about consanguinity, and PMID:28236339
    does not describe its Iranian family as consanguineous either. No
    genotype-phenotype rule is asserted beyond the two that the literature states
    directly - that the dominant-negative allele produced spastic paraplegia
    without microcephaly, and that fever-triggered decompensation has so far been
    reported only with p.Arg213Leu. Whether complete SARS1 loss of function occurs
    in humans is unknown and presumed lethal, on the general grounds that
    cytoplasmic aminoacyl-tRNA synthetases are essential; that presumption is
    reasoning, not a cited finding.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous missense mutation (c.514G>A, p.Asp172Asn) in the cytoplasmic seryl-tRNA synthetase (SARS) gene"
    explanation: Establishes SARS1 as the causal gene with the founding allele, and names the cytoplasmic compartment that distinguishes it from SARS2.
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing results showed that both patients carried a novel missense variant c.1196C>T (p.Thr399Met) in the seryl-tRNA synthetase gene."
    explanation: Adds a further missense allele to the series, reported in unrelated Turkish families.
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense variant was shown to lead to protein instability, resulting in reduced protein level and enzymatic activity."
    explanation: Provides the functional characterisation for the third allele, tying genotype to a measured molecular consequence.
variants:
- name: SARS1 c.514G>A p.Asp172Asn
  gene:
    preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  description: >-
    The founding allele, homozygous in an Iranian family with
    autosomal recessive intellectual disability; the abstract reports the family
    as Iranian and does not state whether it is consanguineous.
    It lies in the enzymatic core
    domain, impairs enzymatic activity, and destabilises the protein - a combined
    activity-and-abundance hit rather than a pure catalytic lesion. The authors
    inferred from the activity loss that cytoplasmic tRNA-Ser charging is reduced.
  type: missense variant
  functional_effects:
  - function: serine-tRNA ligase activity
    description: Impaired enzymatic activity of the mutant protein, attributed to the substitution falling in the enzymatic core domain.
  - function: SerRS protein stability
    description: Predicted to be unstable, and substantiated for ectopically expressed mutant protein in transfected HEK293T cells.
  - function: cytoplasmic charged tRNA-Ser pool
    description: Inferred reduction in cytoplasmic tRNA-Ser concentrations as a consequence of impaired charging; inferred by the authors rather than measured.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous missense mutation (c.514G>A, p.Asp172Asn) in the cytoplasmic seryl-tRNA synthetase (SARS) gene"
    explanation: Identifies the allele and its homozygous state in the founding family.
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant protein was predicted to be unstable, which could be substantiated by investigating ectopic mutant SARS in transfected HEK293T cells."
    explanation: Supports the protein-stability functional effect.
- name: SARS1 c.638G>T p.Arg213Leu
  gene:
    preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  description: >-
    The allele of the deafness-cardiomyopathy-febrile-decompensation presentation,
    biallelic in a consanguineous Turkish family. Functionally it behaves as a
    destabilising allele: reduced protein level with consequently reduced
    enzymatic activity. This is the only SARS1 allele so far associated with fatal
    metabolic crises, and the only one for which a treatment response has been
    documented.
  type: missense variant
  functional_effects:
  - function: SerRS protein stability
    description: Protein instability demonstrated, with reduced steady-state protein level.
  - function: serine-tRNA ligase activity
    description: Reduced enzymatic activity, reported as a consequence of the reduced protein level rather than as an independent catalytic defect.
  evidence:
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a new clinical presentation including developmental delay, central deafness, cardiomyopathy, and metabolic decompensation during fever leading to death, in a consanguineous Turkish family, with biallelic variants (c.638G>T, p.(Arg213Leu)) in SARS1"
    explanation: Identifies the allele, its biallelic state, and the phenotype it produces.
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This missense variant was shown to lead to protein instability, resulting in reduced protein level and enzymatic activity."
    explanation: Supports both functional effects recorded for this allele.
- name: SARS1 c.1196C>T p.Thr399Met
  gene:
    preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  description: >-
    Reported as a novel missense variant in unrelated Turkish families with the
    NEDMAS phenotype, in individuals whose main manifestations were severe
    developmental delay and intellectual disability, thin body habitus and severe
    hypotonia, with bilateral cerebral and cerebellar diffuse atrophy on imaging.
    No functional assay has been published for this allele and no structural
    mapping is available, so its mechanism is assumed rather than shown.

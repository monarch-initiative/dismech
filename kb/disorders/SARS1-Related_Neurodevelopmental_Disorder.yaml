- name: Hearing impairment
  category: Otologic
  description: >-
    Deafness described as CENTRAL is part of the presentation reported from Nancy
    and is a feature that would not be expected from a cochlear lesion. It is
    clinically important out of proportion to its frequency: a child with
    developmental delay and deafness is likely to be worked up along an entirely
    different diagnostic route, and central deafness in particular points away

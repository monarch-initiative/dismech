  type: missense variant
  evidence:
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing results showed that both patients carried a novel missense variant c.1196C>T (p.Thr399Met) in the seryl-tRNA synthetase gene."
    explanation: Identifies the allele and the report that associates it with the NEDMAS phenotype.
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings help expand the variant spectrum of NEDMAS"
    explanation: The authors' own framing of the allele as an addition to the disease-associated variant spectrum.
- name: SARS1 de novo splice-site deletion causing a five-residue in-frame insertion
  gene:
    preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  description: >-
    The single reported de novo, monoallelic, dominant-negative SARS1 allele. A
    splice-site deletion yields a five-amino-acid in-frame insertion near the
    active site; complementation in yeast and serylation assays in yeast and in
    the patient's fibroblasts established a loss-of-function, dominant-negative
    effect. Clinically it produced complex spastic paraplegia with ataxia,
    intellectual disability, developmental delay and seizures, explicitly WITHOUT
    microcephaly - the one published SARS1 phenotype that the MONDO label would
    actively mislead a clinician about.
  type: splice site variant
  functional_effects:
  - function: serine-tRNA ligase activity
    description: Loss of serylation activity in yeast complementation and in patient fibroblast serylation assays, with a dominant-negative rather than purely recessive effect.
  - function: cellular proliferation and senescence
    description: Patient fibroblasts show abnormal shape, arrested division, increased beta-galactosidase staining and a senescence-associated secretory phenotype with raised IL-6, p21, p16 and p53.
  evidence:
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo splice site deletion in SARS1 was identified in our patient, resulting in a 5-amino acid in-frame insertion near its active site."
    explanation: Identifies the allele, its de novo origin, and its protein-level consequence.
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation assays in S. cerevisiae and serylation assays in both yeast strains and patient fibroblasts proved a loss-of-function, dominant negative effect."
    explanation: Supports the dominant-negative functional effect on serylation.
phenotypes:
- name: Microcephaly
  category: Neurologic
  diagnostic: true
  description: >-
    Microcephaly names the disorder and is the feature that ties it to the wider
    group of ARS-related developmental disorders. It is the direct organ-level
    reading of a translational ceiling imposed during the period of maximal brain
    growth. It is not, however, obligatory: the individual with the de novo
    dominant-negative allele had complex spastic paraplegia and explicitly no
    microcephaly, so a normal head circumference does not exclude a SARS1 diagnosis.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  notes: >-
    HPO annotation for OMIM:617709 records HP:0000252 at 4/4, sourced to
    PMID:28236339 (retrieved 2026-08-01 from
    https://ontology.jax.org/api/network/annotation/OMIM:617709). That
    denominator is the single founding family. No FrequencyEnum band is asserted;
    see the entry-level notes.
  evidence:
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures (NEDMAS) syndrome is a rare neurodevelopmental disorder characterized by moderate intellectual disability (ID), thin body habitus, microcephaly, seizures, ataxia, muscle weakness, and speech impairment"
    explanation: Names microcephaly as a defining feature of the syndrome.
  - reference: PMID:35790048
    reference_title: "WARS1 and SARS1: Two tRNA synthetases implicated in autosomal recessive microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report five individuals with biallelic missense variants in WARS1 or SARS1, who presented with an overlapping phenotype of microcephaly, developmental delay, intellectual disability, and brain anomalies."
    explanation: Independent confirmation of microcephaly in a further SARS1 report, and the basis for treating it as a class feature of cytoplasmic ARS deficiency.
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to identify the causal variant in a patient affected by complex spastic paraplegia with ataxia, intellectual disability, developmental delay and seizures, but without microcephaly."
    explanation: >-
      Marked PARTIAL because it qualifies rather than supports the association: it
      documents a SARS1 patient in whom microcephaly was absent, which is the
      evidence for the statement that microcephaly is not obligatory.
- name: Moderate intellectual disability
  category: Neurologic
  diagnostic: true
  description: >-
    Cognitive impairment is present in every reported individual across every
    presentation, and the disorder was originally ascertained through an autosomal
    recessive intellectual disability cohort. The founding series characterises it
    as moderate; a later Turkish series describes severe developmental delay and
    intellectual disability, so severity varies between families. The graded term
    below is bound because it is what the sources and the HPO annotation set state
    for the families they describe, not as an assertion that every affected
    individual is moderately affected - the severe end of the range is carried by
    the PARTIAL evidence item below and by this description.
  phenotype_term:
    preferred_term: Moderate intellectual disability
    term:
      id: HP:0002342
      label: Moderate intellectual disability
  notes: >-
    HPO annotation for OMIM:617709 records HP:0002342 (Moderate intellectual
    disability) at 4/4, sourced to PMID:28236339 (retrieved 2026-08-01). The term
    bound here is the graded child HP:0002342 rather than the parent HP:0001249
    (Intellectual disability), because the sources state the grade explicitly. The
    countervailing observation that a different series reported SEVERE
    developmental delay and intellectual disability is recorded in the description
    and quoted below, so the grade is not presented as settled. Binding the parent
    instead was considered and rejected: HP:0002342 is a descendant of HP:0001249,
    so any query over the parent already retrieves this entry by subsumption,
    whereas demoting the binding would delete from the machine-readable layer the
    one grade that HPOA and two independent papers actually state. The
    moderate-versus-severe spread is therefore carried by the description and by
    the PARTIAL evidence item rather than by weakening the term.
  evidence:
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures (NEDMAS) syndrome is a rare neurodevelopmental disorder characterized by moderate intellectual disability (ID), thin body habitus, microcephaly, seizures, ataxia, muscle weakness, and speech impairment"
    explanation: States moderate intellectual disability as a defining feature of the syndrome.
  - reference: PMID:34570399

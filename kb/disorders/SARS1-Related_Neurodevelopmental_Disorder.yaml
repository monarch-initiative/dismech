    distinction matters. The demand-capacity model is well argued across the ARS
    family as a whole and is the only model that accounts for both the tissue
    distribution and the fever triggering. But no measurement of global or
    codon-specific translation rate has ever been reported in SARS1 patient cells;
    the model is imported from the family, not demonstrated for this gene. A
    ribosome-profiling experiment in SARS1 patient fibroblasts, with and without
    serine supplementation and with and without a thermal or inflammatory
    challenge, would convert this from an inference to a finding. It has not been
    done - see the knowledge-gap discussions.

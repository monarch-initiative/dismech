- name: Dominant-Negative Poisoning of the SerRS Homodimer
  biological_scale: MOLECULAR
  description: >-
    An allele-specific route to the same endpoint. The de novo splice-site
    deletion reported in the spastic paraplegia patient yields a five-residue
    in-frame insertion near the active site, and complementation and serylation
    assays established that this allele is not simply inactive but dominant
    negative - that is, its presence reduces the activity attainable by the
    wild-type allele in the same cell. This node exists separately from the
    loss-of-abundance node because the two predict different things. Under simple
    haploinsufficiency a carrier of one null allele would be unaffected, which is
    what is observed for the recessive families; under dimer poisoning a single
    allele suffices, which is what is observed here.

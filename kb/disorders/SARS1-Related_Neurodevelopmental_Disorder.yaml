- name: Cardiomyocyte Translational Insufficiency
  biological_scale: TISSUE
  description: >-
    Cardiomyopathy is part of the SARS1 phenotype in the presentation reported
    from Nancy and is the feature that determines survival. In the documented
    decompensation episode the left ventricular ejection fraction fell to 20%,
    requiring mechanical ventilation and vasopressor support, with myocardial
    oedema that resolved on follow-up echocardiography; a subsequent febrile
    crisis produced severe biventricular dysfunction and fatal cardiogenic shock.
    Cardiac muscle is a plausible target for a charging-capacity defect because it
    combines high protein turnover with an inability to reduce workload during
    fever - the opposite of skeletal muscle, which can rest. The reversibility of
    the myocardial oedema between crises argues that the cardiac lesion is at
    least in part an acute, demand-driven failure superimposed on a chronic
    cardiomyopathy rather than fixed structural damage alone.

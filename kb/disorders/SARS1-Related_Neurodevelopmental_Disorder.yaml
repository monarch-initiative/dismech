- name: Impaired Neural Progenitor Proliferation and Brain Growth
  biological_scale: TISSUE
  description: >-
    The causal step from a translation defect to the cardinal phenotype. Brain
    growth in the second and third trimesters and the first postnatal years is
    among the most protein-synthesis-intensive processes in human development; a
    ceiling on charged-tRNA supply constrains progenitor proliferation and the
    accretion of neuronal and glial mass, producing microcephaly. This is the
    single feature that unites the SARS1 families with the recessive WARS1
    families reported alongside them, and it is the reason the two were described
    together as an emerging disease group of ARS-related developmental disorders
    with or without microcephaly. The microcephaly is not an isolated head-size
    measurement: it is accompanied by intellectual disability, developmental delay
    and structural brain anomalies in the same individuals.

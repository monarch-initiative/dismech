    in `preferred_term`. Reported in one family only.
  evidence:
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a new clinical presentation including developmental delay, central deafness, cardiomyopathy, and metabolic decompensation during fever leading to death, in a consanguineous Turkish family, with biallelic variants (c.638G>T, p.(Arg213Leu)) in SARS1"
    explanation: The source of both the finding and its localisation as central rather than peripheral.
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seryl-tRNA synthetase 1 (SARS1) deficiency is a rare autosomal recessive disorder presenting with neurodevelopmental delay, deafness, cardiomyopathy, and fatal metabolic decompensation triggered by febrile episodes."
    explanation: Independent restatement, four years later and from the same clinical service, that deafness is an established component of SARS1 deficiency.
- name: Cardiomyopathy
  category: Cardiovascular
  diagnostic: true
  description: >-
    Cardiomyopathy is the feature that determines survival in SARS1 deficiency and
    the one the MONDO label gives no hint of. It is chronic at baseline and
    catastrophically decompensating during febrile illness, with left ventricular
    ejection fraction falling to 20% in the documented episode and biventricular
    failure with fatal cardiogenic shock in a later one. Any child given a
    molecular diagnosis of SARS1 deficiency needs cardiac surveillance regardless
    of which presentation they were ascertained through, because the cardiac risk
    has not been shown to be allele-restricted - only to be, so far, allele-associated.
  phenotype_term:
    preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  notes: >-
    The generic HP:0001638 (Cardiomyopathy) is bound rather than HP:0001644
    (Dilated cardiomyopathy) or a hypertrophic term, because no cached source
    states the morphological subtype; the reported findings are a depressed
    ejection fraction, myocardial oedema, and biventricular dysfunction, which
    constrain function but not morphology. Reported in one family (with the
    2026 case report describing what is on internal evidence a member of that same
    family), so the frequency across the disorder is unknown and no band is
    asserted.
  evidence:
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a new clinical presentation including developmental delay, central deafness, cardiomyopathy, and metabolic decompensation during fever leading to death, in a consanguineous Turkish family, with biallelic variants (c.638G>T, p.(Arg213Leu)) in SARS1"
    explanation: The founding report of cardiomyopathy in SARS1 deficiency.
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course rapidly progressed to metabolic decompensation and severe acute cardiac failure, characterised by a left ventricular ejection fraction of 20%, necessitating mechanical ventilation and vasopressor support"
    explanation: Provides the only quantitative measure of cardiac dysfunction published for this disorder.
- name: Spastic paraplegia
  category: Neurologic
  description: >-
    Complex spastic paraplegia was the presenting syndrome in the one patient with
    a de novo dominant-negative SARS1 allele, occurring with ataxia, intellectual
    disability, developmental delay and seizures but without microcephaly. It
    broadens the differential in which SARS1 should be considered from
    microcephaly-intellectual-disability panels to hereditary spastic paraplegia
    panels.
  phenotype_term:
    preferred_term: Spastic paraplegia
    term:
      id: HP:0001258
      label: Spastic paraplegia
  notes: >-
    Reported in exactly one patient, with a genotype and inheritance mode
    different from every other reported individual. It is curated as a phenotype
    of this MONDO entity because MONDO gives SARS1 no second term, not because it
    is a typical feature. Not in the HPO annotation set for OMIM:617709.
  evidence:
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used exome sequencing to identify the causal variant in a patient affected by complex spastic paraplegia with ataxia, intellectual disability, developmental delay and seizures, but without microcephaly."
    explanation: The single source for this phenotype, which also documents the absence of microcephaly in the same individual.
diagnosis:
- name: Exome or genome sequencing with SARS1 variant interpretation
  description: >-
    Molecular diagnosis rests on identifying SARS1 variants against transcript
    NM_006513.4 by exome or genome sequencing. Three interpretation points follow
    from the published allelic series. First, do not filter for biallelic hits
    only: one reported patient carried a de novo monoallelic dominant-negative
    allele, and a laboratory applying a strict recessive filter would have
    discarded it. Second, expect the ClinVar evidence to be weaker than the OMIM
    entry implies - the allele published as causal in the Turkish series is
    currently a variant of uncertain significance in ClinVar - so a SARS1 candidate will
    often need functional support rather than database endorsement. Third, since
    the two named genes SARS1 and SARS2 differ only by a digit and share the
    legacy symbol SARS, confirm from the transcript accession, not the symbol,
    which enzyme has been reported.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous missense mutation (c.514G>A, p.Asp172Asn) in the cytoplasmic seryl-tRNA synthetase (SARS) gene"
    explanation: Establishes that the diagnosis is made by sequencing and that the gene of interest is the cytoplasmic, not the mitochondrial, seryl-tRNA synthetase.
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo splice site deletion in SARS1 was identified in our patient, resulting in a 5-amino acid in-frame insertion near its active site."
    explanation: Supports the specific warning that a monoallelic de novo SARS1 event can be causal and must not be filtered out.
- name: Serylation (aminoacylation) assay in patient fibroblasts
  description: >-
    The functional confirmatory test for a candidate SARS1 variant. Serylation
    activity measured in patient-derived fibroblasts, alongside yeast
    complementation, is what established pathogenicity for the dominant-negative
    allele and is the assay that distinguishes a true hypomorph from an incidental
    rare missense change. In the published SARS1 cases it was performed in a
    research setting; this entry makes no claim about where it is available as a
    clinical service, because no cached source addresses that. Its value is highest
    precisely where the genomic evidence is weakest, which for this gene is most
    of the time.
  evidence:
  - reference: PMID:36041817
    reference_title: "Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular senescence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation assays in S. cerevisiae and serylation assays in both yeast strains and patient fibroblasts proved a loss-of-function, dominant negative effect."
    explanation: Documents the assay pair that was used to establish variant pathogenicity in patient material.
  - reference: PMID:34570399
    reference_title: "A bi-allelic loss-of-function SARS1 variant in children with neurodevelopmental delay, deafness, cardiomyopathy, and decompensation during fever."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This missense variant was shown to lead to protein instability, resulting in reduced protein level and enzymatic activity."
    explanation: Shows that both protein level and enzyme activity are informative readouts for a candidate SARS1 allele.
- name: Brain MRI
  description: >-
    Brain MRI documents the structural correlates - bilateral diffuse cerebral and
    cerebellar atrophy - and supports the diagnosis in a child with microcephaly
    and ataxia. It does not distinguish SARS1 disease from the other recessive ARS
    deficiencies or from the many other causes of microcephaly with cerebellar
    atrophy, so its role is corroborative rather than discriminating.
  evidence:
  - reference: PMID:36004946
    reference_title: "Neurodevelopmental disorder with microcephaly, ataxia, and seizures syndrome: expansion of the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain imaging revealed bilateral cerebral and cerebellar diffuse atrophy."
    explanation: Names the specific imaging findings to be expected.
- name: Cardiac assessment with echocardiography
  description: >-
    Echocardiography with ejection fraction, together with cardiac biomarkers, is
    the surveillance test that matters most for prognosis in this disorder, and it
    is also the monitoring test during a febrile crisis. In the documented episode
    the ejection fraction fell to 20%, cardiac biomarkers normalised over about
    twenty days, and follow-up echocardiography at one month showed complete
    resolution of myocardial oedema - so serial imaging, not a single baseline
    study, is what captures the disease.
  notes: >-
    The specific follow-up timings (biomarker normalisation within 20 days,
    echocardiographic resolution at 1 month) are stated in the cached abstract of
    PMID:42158840 and are quoted below only in part; the recommendation to perform
    surveillance echocardiography in all SARS1 patients is a curatorial inference
    from the reported course and is not itself a published guideline. No
    surveillance protocol has been published for this disorder.
  evidence:
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course rapidly progressed to metabolic decompensation and severe acute cardiac failure, characterised by a left ventricular ejection fraction of 20%, necessitating mechanical ventilation and vasopressor support"
    explanation: Establishes the measurement (ejection fraction) that defines the acute cardiac emergency in this disorder.
differential_diagnoses:
- name: HUPRA syndrome
  disease_term:
    preferred_term: hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome
    term:
      id: MONDO:0013458
      label: hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome
  description: >-
    The paralogue trap, and the reason it is listed first. HUPRA syndrome is
    caused by SARS2, the MITOCHONDRIAL seryl-tRNA synthetase. The two genes encode
    enzymes that catalyse chemically the same reaction - serylation of tRNA-Ser -
    on two different tRNA pools in two different compartments, and their legacy
    symbols collide (HGNC lists "SARS" as an exact synonym of SARS2 as well as the
    former symbol of SARS1). A literature search, a variant report, or an
    automated gene-disease extraction that keys on the string "SARS" will merge
    them. Clinically they are not remotely similar: HUPRA is a mitochondrial
    oxidative-phosphorylation disorder of infancy with hyperuricaemia, pulmonary
    hypertension, progressive renal failure and metabolic alkalosis.
  distinguishing_features:
  - Different gene and compartment - SARS1 (hgnc:10537) encodes the cytoplasmic enzyme, SARS2 (hgnc:17697) the mitochondrial one; a report naming only "SARS" must be resolved before use.
  - Different MONDO and OMIM entities - this disorder is MONDO:0060577 / OMIM:617709; HUPRA is MONDO:0013458 / OMIM:613845 / Orphanet:363694.
  - HUPRA is classified in MONDO under mitochondrial oxidative phosphorylation disorder and inherited renal tubular disease; SARS1 disease is a Mendelian neurodevelopmental disorder with no renal or pulmonary-vascular component reported.
  - The cardinal HUPRA features - hyperuricaemia, pulmonary hypertension, renal failure, metabolic alkalosis - have never been reported in a SARS1 patient; conversely microcephaly, ataxia and seizures are not the HUPRA phenotype.
  - ICIMD places the two in different groups - mitochondrial aminoacyl-tRNA synthetase disorders for SARS2, non-mitochondrial tRNA metabolism for SARS1.
  notes: >-
    Every identifier in this differential was verified with OAK before being
    written, not typed from memory: `runoak -i sqlite:obo:hgnc search "SARS2"`
    gives hgnc:17697 with definition "seryl-tRNA synthetase 2, mitochondrial";
    `runoak -i sqlite:obo:mondo info MONDO:0013458 -O obo` gives the HUPRA term
    with synonym "HUPRA syndrome", xrefs OMIM:613845 and Orphanet:363694, and
    `RO:0004003 HGNC:17697 ! SARS2`. No HUPRA literature was read or used for any
    other claim in this file. No evidence item is attached because the contrast is
    an ontology-level and reasoned clinical comparison rather than a quotable
    finding from a cached source about this disease.
- name: WARS1-related neurodevelopmental disorder with microcephaly and speech delay
  disease_term:
    preferred_term: neurodevelopmental disorder with microcephaly and speech delay, with or without brain abnormalities
    term:
      id: MONDO:0957218
      label: neurodevelopmental disorder with microcephaly and speech delay, with or without brain abnormalities
  description: >-
    The closest true clinical mimic, and the reason the two were described in one
    paper. Biallelic variants in WARS1, the CYTOPLASMIC tryptophanyl-tRNA
    synthetase, produce microcephaly, developmental delay, intellectual disability
    and brain anomalies that overlap the SARS1 phenotype closely enough that the
    authors proposed a single emerging category of ARS-related developmental
    disorders with or without microcephaly. The distinction is molecular, not
    clinical.
  distinguishing_features:
  - Different gene - WARS1 is hgnc:12729, SARS1 is hgnc:10537; both are cytoplasmic synthetases and both disorders are autosomal recessive.
  - Different MONDO and OMIM entities - MONDO:0957218 / OMIM:620317 for WARS1 versus MONDO:0060577 / OMIM:617709 here.
  - WARS1 also carries a dominant disease, distal hereditary motor neuronopathy type 9 (MONDO:0060585), which has no SARS1 counterpart; a family history of adult-onset motor neuropathy points to WARS1.
  - Central deafness, cardiomyopathy and fever-triggered metabolic decompensation have been reported in SARS1 disease and are not features of the WARS1 recessive phenotype as described.
  - Speech delay is emphasised in the WARS1 entity's own name; both disorders involve speech impairment, so this does not discriminate at the bedside.
  notes: >-
    MONDO:0957218 and hgnc:12729 were verified with OAK (`runoak -i
    sqlite:obo:mondo relationships --direction down -p RO:0004003 HGNC:12729`
    returns MONDO:0060585 and MONDO:0957218; `runoak -i sqlite:obo:mondo info
    MONDO:0957218 -O obo` gives xref OMIM:620317). No dismech entry exists for
    either WARS1 disorder as of this curation.
  evidence:
  - reference: PMID:35790048
    reference_title: "WARS1 and SARS1: Two tRNA synthetases implicated in autosomal recessive microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report five individuals with biallelic missense variants in WARS1 or SARS1, who presented with an overlapping phenotype of microcephaly, developmental delay, intellectual disability, and brain anomalies."
    explanation: States directly that the WARS1 and SARS1 recessive phenotypes overlap, which is what makes this a differential rather than a remote comparison.
  - reference: PMID:35790048
    reference_title: "WARS1 and SARS1: Two tRNA synthetases implicated in autosomal recessive microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "define an emerging disease spectrum: ARS-related developmental disorders with or without microcephaly"
    explanation: The authors' proposal of a single category containing both disorders, which is the argument for curating them as differentials of each other.
- name: WARS2-related mitochondrial neurodevelopmental disorder
  disease_term:
    preferred_term: neurodevelopmental disorder, mitochondrial, with abnormal movements and lactic acidosis, with or without seizures
    term:
      id: MONDO:0060578
      label: neurodevelopmental disorder, mitochondrial, with abnormal movements and lactic acidosis, with or without seizures
  description: >-
    Included because of a specific citation hazard rather than a clinical one. The
    founding publication for this entry, PMID:28236339, reports TWO families and
    TWO genes: SARS in the first and WARS2 - the mitochondrial tryptophanyl-tRNA
    synthetase - in the second. Any automated or hurried extraction from that
    paper will attribute WARS2 findings (a nonsense allele with predicted
    nonsense-mediated decay, and a missense allele disrupting the mitochondrial
    localisation signal) to this disorder. They belong to MONDO:0060578, a
    separate entity with lactic acidosis and abnormal movements.
  distinguishing_features:
  - Different gene and compartment - WARS2 is hgnc:12730 and mitochondrial; SARS1 is hgnc:10537 and cytoplasmic.
  - Different MONDO and OMIM entities - MONDO:0060578 / OMIM:617710 versus MONDO:0060577 / OMIM:617709; the OMIM numbers are consecutive because both came from the same 2017 paper, which compounds the hazard.
  - Lactic acidosis is a defining feature of the WARS2 entity and has not been reported in SARS1 disease; a raised lactate should redirect the workup.
  - Abnormal movements including dystonia and parkinsonism characterise the WARS2 spectrum; the movement disorder in SARS1 disease is ataxia.
  notes: >-
    MONDO:0060578 was verified with OAK (`runoak -i sqlite:obo:mondo info
    MONDO:0060578 -O obo`: xref OMIM:617710, Orphanet:572798, `RO:0004003
    HGNC:12730 ! WARS2`, synonyms "WARS2 deficiency" and "mitochondrial
    tryptophanyl-tRNA synthetase deficiency"). This differential exists to protect
    future curation of PMID:28236339, and no WARS2 content was used anywhere in
    this entry.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report on mutations in two aminoacyl-tRNA synthetases that are associated with ID in two unrelated Iranian families"
    explanation: Documents that the founding publication covers two distinct gene-disease pairs, which is the basis for warning that its content must be split before use.
- name: Hypomyelinating leukodystrophy 3
  disease_term:
    preferred_term: hypomyelinating leukodystrophy 3
    term:
      id: MONDO:0009843
      label: hypomyelinating leukodystrophy 3
  description: >-
    A mechanistic rather than a bedside differential. AIMP1 encodes a non-catalytic
    scaffold component of the cytoplasmic multi-tRNA-synthetase complex, and its
    loss causes a recessive disorder with microcephaly, severe developmental
    failure and seizures. The founding SARS1 paper cites AIMP1 explicitly as the
    precedent that led its authors to propose tRNA-aminoacylation integrity as a
    general requirement for human cognition. The pair therefore anchors the
    argument that lesions anywhere in the cytoplasmic aminoacylation apparatus -
    catalytic subunit or scaffold - converge on a neurodevelopmental phenotype.
  distinguishing_features:
  - Different gene - AIMP1 is hgnc:10648; AIMP1 is a scaffold protein of the multi-synthetase complex, not a synthetase, and has no aminoacylation activity of its own.
  - Hypomyelination is the defining MRI feature of HLD3; the SARS1 imaging phenotype reported to date is diffuse cerebral and cerebellar atrophy, not a hypomyelinating pattern.
  - Onset and severity are commonly said to differ, with HLD3 the earlier and more severe of the two, but no source cached for this entry states patient age, onset age or survival for either condition, so this contrast is background rather than a usable discriminator.
  - Cardiomyopathy and fever-triggered metabolic decompensation are reported in SARS1 disease and are not features of HLD3.
  notes: >-
    MONDO:0009843 and hgnc:10648 were verified with OAK (`runoak -i
    sqlite:obo:mondo relationships --direction down -p RO:0004003 HGNC:10648`
    returns MONDO:0009843 only). The clinical description of HLD3 above is general
    background and is deliberately not evidenced with a snippet, because no HLD3
    paper is cached in this repository; the quotable element is the founding SARS1
    paper's own citation of AIMP1, which is attached below.
  evidence:
  - reference: PMID:28236339
    reference_title: "Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three genes with a role in tRNA-aminoacylation are now associated with this condition"
    explanation: The founding authors place SARS alongside AIMP1 and WARS2 as members of one aminoacylation-related disease group, which is the basis for this mechanistic differential.
- name: Other recessive cytoplasmic aminoacyl-tRNA synthetase deficiencies
  description: >-
    Not a single disease but the class this disorder belongs to, and in practice
    the differential a metabolic physician actually faces. Recessive deficiencies
    of AARS1, DARS1, GARS1, HARS1, IARS1, KARS1, LARS1, MARS1, QARS1, RARS1, VARS1
    and YARS1 share a phenotype template with SARS1 deficiency: abnormalities of
    the central nervous system and/or the senses in all thirteen of the
    deficiencies surveyed - a compound category, not a claim about the CNS alone -
    plus failure to thrive,
    gastrointestinal symptoms, dysmaturity, liver disease and facial dysmorphism
    recurring across the group, with symptoms concentrated in the first year of
    life and during infections. Because the clinical picture does not identify the
    gene, the practical route to diagnosis is a broad sequencing approach rather
    than a targeted one, and the practical route to management - adequate protein
    and amino acid supply rather than protein restriction - is shared across the
    class.
  distinguishing_features:
  - The clinical phenotypes of the recessive ARS deficiencies are described as diverse and without apparent logic; they are not separable at the bedside and the distinction is molecular.
  - Pulmonary alveolar proteinosis points towards MARS1, IARS1 or LARS1 rather than SARS1; it has not been reported in SARS1 disease.
  - Prominent liver disease points away from SARS1, in which hepatic involvement has not been reported.
  - Microcephaly as the leading feature narrows the group towards SARS1 and WARS1.
  - Fever-triggered decompensation is a class feature rather than a SARS1-specific one, so its presence does not identify the gene.
  notes: >-
    No MONDO term is bound to this differential because it is a class, not a
    disease entity, and binding any single member's term would misrepresent it.
    The gene symbols listed are the current HGNC forms of the symbols used in the
    quoted source, which predates the "1" suffix convention and writes AARS,
    DARS, GARS and so on.
  evidence:
  - reference: PMID:29875423
    reference_title: "Aminoacyl-tRNA synthetase deficiencies in search of common themes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In literature, we identified 107 patients with AARS, DARS, GARS, HARS, IARS, KARS, LARS, MARS, RARS, SARS, VARS, YARS, and QARS deficiencies"
    explanation: Enumerates the class of recessive cytoplasmic synthetase deficiencies that constitutes this differential, with SARS among them.
  - reference: PMID:29875423
    reference_title: "Aminoacyl-tRNA synthetase deficiencies in search of common themes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features of autosomal recessive ARS deficiencies appear very diverse and without apparent logic."
    explanation: Supports the claim that the class cannot be separated on clinical grounds, which is why the differential is handled by sequencing rather than by phenotyping.
treatments:
- name: L-serine supplementation
  action_category: THERAPEUTIC
  description: >-
    The only disease-specific intervention reported, and its rationale follows
    directly from the mechanism. If the lesion is insufficient charging capacity
    for the demand, then raising the intracellular concentration of the substrate
    amino acid should drive the residual hypomorphic enzyme harder - a mass-action
    rescue rather than a correction of the defect. Chronic supplementation is
    described as established practice in SARS1 deficiency. What was new in 2026 is
    acute management: during a febrile decompensation with an ejection fraction of
    20%, the patient's L-serine dose was progressively tripled alongside standard
    supportive care and he survived, where three untreated siblings had died of
    comparable episodes. That is the first documented survival of a SARS1 metabolic
    crisis. It is also, honestly, an n-of-1 with a fatal outcome a year later
    despite an emergency protocol - so the intervention is reported here as
    promising and mechanistically coherent, not as established efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: high-dose oral L-serine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_mechanisms:
  - target: Deficient Serylation of tRNA-Ser
    treatment_effect: ACTIVATES
    description: >-
      Raising substrate availability is intended to drive the residual
      hypomorphic enzyme harder by mass action, partially restoring serylation
      flux. This is the intended target; it has not been demonstrated in
      SARS1 patient cells.
  - target: Demand-Dependent Decompensation During Febrile Catabolic Stress
    treatment_effect: INHIBITS
    description: >-
      Dose escalation during febrile illness is intended to raise charging
      capacity at the moment translational demand spikes, aborting the crisis.
  target_phenotypes:
  - preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  notes: >-
    Deliberately not asserted: no dose, no dose range, no dosing schedule and no
    target plasma serine concentration is recorded anywhere in this entry. The
    cached abstract says the patient's dose was "progressively tripled" from his
    own baseline and gives no absolute figures, and inventing a mg/kg/day number
    would be exactly the kind of unchecked quantitative claim that prose is
    vulnerable to. Nor is the mass-action rationale in the description above a
    quoted finding - no study has measured whether serine loading increases
    serylation in SARS1 patient cells. On term choice: NCIT:C1505 (Dietary
    Supplement) was tried first and rejected because it is not reachable from
    NCIT:C25218 and fails TreatmentActionTerm validation; NCIT:C15433
    (Nutritional Support) is the correct clinical-action term, with the specific
    chemical carried in `therapeutic_agent`. The modality is SMALL_MOLECULE
    rather than BEHAVIORAL, following the explicit CLAUDE.md guidance not to tag
    nutritional supplementation of a defined chemical as BEHAVIORAL.
  evidence:
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While amino acid chronic supplementation is established, no guidelines exist for acute management."
    explanation: Establishes that chronic amino acid supplementation is already standard in this disorder while acute management is not codified.
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During hospitalisation, the patient's specific L-serine supplementation dosage was progressively tripled concurrently with standard supportive care."
    explanation: Describes the intervention actually administered, without an absolute dose.
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the fatal outcomes observed in his siblings, untreated by L-serine, the patient survived and recovered following this high-dose regimen"
    explanation: The efficacy observation, stated as a within-family comparison, which is the strongest available evidence and is still n-of-1.
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a year later, the patient presented with another febrile crisis at 10 years old, and despite an emergency protocol, the patient developed severe biventricular dysfunction progressing to fatal cardiogenic shock."
    explanation: >-
      Marked PARTIAL because it qualifies the efficacy claim: the same patient
      subsequently died of a febrile crisis despite an emergency protocol, so
      L-serine escalation is not reliably life-saving.
  - reference: PMID:29875423
    reference_title: "Aminoacyl-tRNA synthetase deficiencies in search of common themes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assuming residual ARS activity, adequate protein/amino acid supply seems essential instead of the traditional replacement of protein by glucose in patients with metabolic diseases."
    explanation: Supplies the class-level mechanistic rationale for amino acid supply rather than protein restriction in ARS deficiencies.
- name: Emergency protocol for febrile illness
  action_category: THERAPEUTIC
  description: >-
    Because febrile illness is the trigger for lethal decompensation, anticipatory
    management of intercurrent fever is the central chronic-care task in this
    disorder: early presentation, aggressive escalation of L-serine, and cardiac
    and haemodynamic monitoring during the episode. The 2026 report explicitly
    frames early, aggressive escalation as a viable strategy while noting that no
    guidelines exist. It also records the limit of the approach: the patient died
    in a subsequent crisis despite having an emergency protocol in place, so a
    protocol reduces but does not remove the risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: acute decompensation emergency protocol
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Demand-Dependent Decompensation During Febrile Catabolic Stress
    treatment_effect: INHIBITS
    description: >-
      Anticipatory management of the febrile trigger aims to prevent the
      demand-capacity mismatch from progressing to decompensation.
  notes: >-
    No published protocol exists to cite; the components listed in the description
    are drawn from what was actually done in the single reported episode
    (progressive tripling of L-serine, standard supportive care, mechanical
    ventilation and vasopressors as needed, serial cardiac biomarkers and
    echocardiography). Nothing here should be read as a validated pathway.
  evidence:
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings strongly suggest that early, aggressive escalation of L-serine dosage can be a viable therapeutic strategy for acute decompensation in SARS1 deficiency."
    explanation: The authors' explicit recommendation, which is the basis for treating anticipatory febrile management as a therapeutic action.
  - reference: PMID:42158840
    reference_title: "High-Dose L-Serine Supplementation During Febrile Decompensation in SARS1 Deficiency: A Case Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This constitutes the first documented survival of a SARS1-related metabolic crisis managed with high-dose L-serine."
    explanation: >-
      Marked PARTIAL: "first documented survival" simultaneously supports the
      strategy and discloses that the entire evidence base for it is one episode
      in one patient.
animal_models:
- species: Danio rerio
  genotype: adrasteia (adr) mutants; sars (seryl-tRNA synthetase) loss of function
  category: Forward-genetic mutant isolated in a vascular screen
  description: >-
    The zebrafish sars mutants are the only established animal model of the gene,
    and they are NOT a model of this disease - a distinction this entry insists on.
    They were recovered in a screen for vascular development and maintenance, and
    their phenotype is vascular: pronounced dilatation of the aortic arch vessels,
    aberrant patterning of hindbrain capillaries, and to a lesser extent altered
    intersomitic vessels, with the aortic dilatation dependent on Vegf signalling
    rather than on increased cell proliferation. Positional cloning identified
    seryl-tRNA synthetase as the affected gene, and siRNA knockdown in human
    umbilical vein endothelial cells showed the same regulation of endothelial
    sprouting. The model therefore validates the non-canonical, VEGFA-related
    function of SerRS at the organism level. It says nothing about microcephaly,
    ataxia, seizures, cardiomyopathy or febrile decompensation, and no vascular
    malformation has ever been reported in a human SARS1 patient. The consequence
    of that gap - that this disorder has no animal or cellular disease model at
    all, and what a usable one would have to capture - is worked through in the
    HUMAN_MODEL_MISMATCH discussion `sars1-no-disease-model`, which proposes the
    knock-in mouse and patient-derived cortical organoid experiments that would
    close it.
  genes:
  - preferred_term: SARS1
    term:
      id: hgnc:10537
      label: SARS1
  associated_phenotypes:
  - Dilatation of the aortic arch vessels
  - Aberrant hindbrain capillary patterning
  - Altered intersomitic vessel patterning
  evidence:
  - reference: PMID:19423847
    reference_title: "Genetic evidence for a noncanonical function of seryl-tRNA synthetase in vascular development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By positional cloning, we isolated seryl-tRNA synthetase (sars) as the gene affected by the adr mutations"
    explanation: Establishes that the adrasteia mutants are seryl-tRNA synthetase mutants, which is what makes them a model of this gene.
  - reference: PMID:19423847
    reference_title: "Genetic evidence for a noncanonical function of seryl-tRNA synthetase in vascular development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This dilatation of the aortic arch vessels does not appear to be caused by increased cell proliferation but is dependent on vascular endothelial growth factor (Vegf) signaling"
    explanation: Shows the mutant phenotype is Vegf-dependent, which is why the model speaks to the non-canonical rather than the translational function.
  - reference: PMID:19423847
    reference_title: "Genetic evidence for a noncanonical function of seryl-tRNA synthetase in vascular development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These analyses of zebrafish and human endothelial cells reveal a new noncanonical function of Sars in endothelial development"
    explanation: >-
      Marked PARTIAL with respect to this disease. The finding is solid, but what
      it establishes is a noncanonical endothelial function, which is precisely the
      arm of SerRS biology whose relevance to the human neurodevelopmental disorder
      is unestablished.
  - reference: PMID:22353712
    reference_title: "Unique domain appended to vertebrate tRNA synthetase is essential for vascular development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results are the first to show an essential role for a tRNA synthetase-associated appended domain at the organism level"
    explanation: Confirms at the organism level that the UNE-S appendage, not the catalytic core, carries the vascular function tested in these fish.
discussions:
- discussion_id: sars1-charging-vs-moonlighting
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the patient SARS1 alleles impair only serine charging, or do they also
    disrupt the non-canonical nuclear functions of SerRS - and would it change
    anything clinically if they did?
  rationale: >-
    This is the central unresolved mechanistic question for the entry. Vertebrate
    SerRS has a documented second life in the nucleus, repressing VEGFA through a
    YY1 complex and binding telomeric DNA with POT1, and disrupting the nuclear
    function is lethal in zebrafish. Every human SARS1 disease allele so far maps
    to the catalytic core - which argues for a pure charging defect - but the
    SerRS/YY1 interaction is itself mediated by the CATALYTIC domain, so
    active-site alleles are not automatically innocent with respect to the nuclear
    activity. Nobody has tested nuclear localisation, YY1 binding, VEGFA
    repression, or telomere length in cells carrying p.Asp172Asn, p.Arg213Leu or
    p.Thr399Met. The answer matters practically: if the moonlighting arm is intact,
    substrate supplementation targets the whole defect; if it is not, L-serine can
    never be more than partial therapy, and vascular or telomere-related
    surveillance might be warranted in a disorder where nobody currently looks for
    either.
  attaches_to:
  - "pathophysiology#Loss of Non-Canonical Nuclear SerRS Function"
  - "pathophysiology#Deficient Serylation of tRNA-Ser"
  proposed_experiments:
  - experiment_id: sars1-nuclear-localisation-allelic-series
    name: Nuclear localisation and VEGFA repression across the SARS1 allelic series
    description: >-
      Express each patient allele in a SerRS-depleted background and measure
      nuclear/cytoplasmic partitioning, co-immunoprecipitation with YY1, occupancy
      at the distal vegfa cis-regulatory element, and VEGFA transcript level,
      alongside serylation activity, so that the two functions are read out from
      the same cells.
  - experiment_id: sars1-telomere-length-patient-fibroblasts
    name: Telomere length and POT1 association in SARS1 patient fibroblasts
    description: >-
      Measure telomere length and SerRS-POT1 association in fibroblasts from
      recessive SARS1 patients and compare with the senescent fibroblasts of the
      dominant-negative patient, to test whether the reported senescence is
      telomeric or translational in origin.
- discussion_id: sars1-crisis-biomarker
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the biochemistry of a SARS1 febrile decompensation, and is there any
    laboratory test that can confirm one is underway?
  rationale: >-
    The decompensations are lethal and the proposed treatment is substrate loading,
    yet no biochemical characterisation of a crisis exists: no published amino acid
    profile, no charged-tRNA-Ser measurement, no integrated-stress-response readout,
    no proteomic signature. Clinicians are therefore escalating L-serine on
    mechanistic reasoning with no way to confirm the target is engaged or to
    titrate. The label "metabolic decompensation" is itself doing unexamined work -
    it is borrowed from the intoxication-type inborn errors, where a toxic
    metabolite accumulates, whereas the proposed SARS1 mechanism is a synthetic
    insufficiency with no accumulating toxin. Whether anything measurable
    accumulates or is depleted during a SARS1 crisis is simply unknown.
  attaches_to:
  - "pathophysiology#Demand-Dependent Decompensation During Febrile Catabolic Stress"
  - "treatments#L-serine supplementation"
  proposed_experiments:
  - experiment_id: sars1-crisis-metabolomics
    name: Paired crisis and baseline metabolomic and amino acid profiling
    description: >-
      Collect plasma and, where available, cerebrospinal fluid at presentation with
      febrile decompensation and again at baseline in the same patient, and profile
      amino acids, acylcarnitines and untargeted metabolites, to establish whether
      any analyte tracks the crisis.
  - experiment_id: sars1-fibroblast-thermal-challenge
    name: Thermal and inflammatory challenge of SARS1 patient fibroblasts
    description: >-
      Culture patient and control fibroblasts at 37 and 40 degrees Celsius, with
      and without inflammatory cytokine exposure and with and without serine
      supplementation, and measure charged tRNA-Ser, global translation by
      puromycin incorporation or ribosome profiling, and integrated-stress-response
      markers.
- discussion_id: sars1-mondo-label-understates-entity
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should the SARS1 phenotype remain one MONDO entity named for microcephaly,
    ataxia and seizures, when its most dangerous manifestation is cardiac and one
    reported patient had neither microcephaly nor a recessive genotype?
  rationale: >-
    MONDO:0060577 is the only disease term MONDO assigns to SARS1, and ClinVar
    files both the microcephaly allele and the cardiomyopathy allele against it, so
    curating the whole spectrum here is the correct current mapping. But the label
    actively misleads in two directions. A clinician reading "neurodevelopmental
    disorder with microcephaly, ataxia, and seizures" would not anticipate a
    treatable, lethal, fever-triggered cardiomyopathy, and would not consider the
    gene in a child with spastic paraplegia and a normal head circumference. This
    is recorded as an interpretation issue rather than silently resolved, because
    the resolution belongs to MONDO and OMIM, not to this entry. What this entry
    does instead is curate the full spectrum and mark, feature by feature, which
    presentation each observation comes from.
  attaches_to:
  - "phenotypes#Cardiomyopathy"
  - "phenotypes#Spastic paraplegia"
  notes: >-
    The alternative curation - restricting this entry to the microcephaly
    presentation and waiting for MONDO to split the term - was considered and
    rejected, because it would have excluded the only treatable and the only lethal
    features of SARS1 deficiency from the knowledge base while the term that ought
    to hold them does not exist.
- discussion_id: sars1-fever-risk-allele-restricted
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the risk of fatal febrile decompensation restricted to the p.Arg213Leu
    genotype, or does every SARS1 patient need an emergency protocol?
  rationale: >-
    Fever-triggered decompensation has been reported only in the family carrying
    c.638G>T (p.Arg213Leu). Two readings are possible and they imply opposite
    clinical policies. If the risk is allele-specific - for example because that
    allele's protein instability is itself temperature-sensitive, which would be a
    direct and elegant explanation for a fever trigger - then patients with other
    genotypes need no emergency plan. If instead the risk is generic to residual
    charging capacity, as the ARS-family model implies, then the other families
    simply have not been followed long enough or have not been recognised, and
    every SARS1 patient should be issued a protocol. Nobody has tested the thermal
    stability of any SARS1 mutant protein, which is a cheap experiment that would
    largely settle it.
  attaches_to:
  - "pathophysiology#Demand-Dependent Decompensation During Febrile Catabolic Stress"
  - "variants#SARS1 c.638G>T p.Arg213Leu"
  proposed_experiments:
  - experiment_id: sars1-thermal-stability-allelic-series
    name: Thermal stability and activity of recombinant SARS1 mutant proteins
    description: >-
      Measure melting temperature and residual serylation activity at 37 and 40
      degrees Celsius for recombinant wild-type SerRS and each patient allele, to
      test directly whether the p.Arg213Leu protein is disproportionately
      temperature-sensitive.
- discussion_id: sars1-no-disease-model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is there no animal or cellular model of SARS1 NEURODEVELOPMENTAL disease,
    and what would one need to capture?
  rationale: >-
    The only established in vivo SARS1 model is the zebrafish adrasteia mutant,
    which was isolated for a vascular phenotype and reads out the non-canonical
    function; it has never been used to model microcephaly, ataxia, seizures or
    cardiomyopathy, and human patients have no reported vascular malformation. No
    mouse model, no knock-in of a patient allele, and no neural organoid has been
    published. This is a genuine mismatch rather than a gap in the literature
    search: the model that exists reads out the arm of the biology that the human
    disease may not use. A knock-in of p.Asp172Asn or p.Arg213Leu, phenotyped for
    brain growth, cerebellar structure, seizure threshold and cardiac function
    under thermal challenge, is the missing experiment.
  attaches_to:
  - "pathophysiology#Impaired Neural Progenitor Proliferation and Brain Growth"
  proposed_experiments:
  - experiment_id: sars1-knockin-mouse-allelic
    name: Knock-in mouse carrying a patient SARS1 allele
    description: >-
      Generate homozygous knock-in mice for p.Asp172Asn and for p.Arg213Leu and
      phenotype brain weight and cortical thickness, cerebellar morphology, seizure
      susceptibility, and cardiac function at baseline and under a controlled
      pyrogenic or thermal challenge.
  - experiment_id: sars1-patient-derived-cortical-organoid
    name: Patient-derived cortical organoids
    description: >-
      Differentiate iPSC-derived cortical organoids from recessive SARS1 patients
      and isogenic corrected controls, and measure progenitor proliferation, organoid
      size, and global translation rate, to test the demand-capacity model in a human
      neural context.
- discussion_id: sars1-karaer-cohort-inconsistency
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    How many patients does PMID:36004946 actually report, and in how many of them
    was c.1196C>T found?
  rationale: >-
    The cached abstract states "three unrelated Turkish families with four NEDMAS
    patients" and then, two sentences later, "both patients carried a novel
    missense variant c.1196C>T (p.Thr399Met)". Four patients and "both patients"
    cannot both be right. The most likely readings are that the variant was found
    in only two of the four, or that "both" is a residue of an earlier draft
    describing two patients. This entry therefore asserts no case count from that
    paper and no genotype-count for the p.Thr399Met allele. Resolving it requires
    the full text, which is not cached in this repository. It is recorded rather
    than silently resolved because a curator or an automated extractor is otherwise
    likely to take "four patients" as a countable figure.
  attaches_to:
  - "variants#SARS1 c.1196C>T p.Thr399Met"
  - "prevalence#"
- discussion_id: sars1-thr399met-vus
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is c.1196C>T (p.Thr399Met) pathogenic, given that it is published as causal in
    multiple families but classified as a variant of uncertain significance in
    ClinVar?
  rationale: >-
    PMID:36004946 reports p.Thr399Met as the disease-causing variant in unrelated
    Turkish families with a matching phenotype. ClinVar (VCV002506443, retrieved
    2026-08-01) holds a single criteria-provided submission classifying it as
    Uncertain significance against "not specified". No functional assay has been
    published for this allele - no serylation measurement, no protein-stability
    measurement, no structural mapping - so the case for pathogenicity rests
    entirely on segregation and phenotype match in a small number of families. This
    is a live disagreement between the published literature and the variant
    database, and a laboratory encountering this allele will have to adjudicate it.
    A serylation assay in patient fibroblasts, the same experiment done for the
    other alleles, would resolve it.
  attaches_to:
  - "variants#SARS1 c.1196C>T p.Thr399Met"
  notes: >-
    The ClinVar classification is from the public E-utilities API and is not
    quotable from a cached reference, so it is recorded in this rationale rather
    than as an evidence snippet.

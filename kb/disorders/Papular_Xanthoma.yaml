name: Papular xanthoma
creation_date: "2026-05-07T23:30:22Z"
description: >
  Papular xanthoma is a rare cutaneous non-Langerhans cell histiocytosis in
  which papules are composed predominantly of xanthomatized macrophages. The
  classic clinicopathologic series frames it as a normolipemic skin-limited
  disorder, although pediatric exceptions with abnormal lipid profiles have
  been reported.
category: Rare Dermatologic Disorder
disease_term:
  preferred_term: Papular xanthoma
  term:
    id: MONDO:0015536
    label: papular xanthoma
parents:
- Non-Langerhans cell histiocytosis
- Cutaneous histiocytosis
synonyms:
- Papular xanthomatosis
classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
    notes: >-
      Papular xanthoma is a rare, skin-limited cutaneous non-Langerhans cell
      histiocytosis presenting with dermal xanthomatous papules.
    evidence:
    - reference: PMID:12028152
      reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Papular xanthoma (PX) is one of several clinicopathologic variants of
        normolipemic cutaneous non-Langerhans cell histiocytoses (n-LCH).
      explanation: >-
        Defines papular xanthoma as a cutaneous non-Langerhans cell
        histiocytosis of the skin, supporting placement in Harrison's
        dermatology Part.
    - reference: PMID:20199419
      reference_title: "Case report--papular xanthoma in a 10-year-old female with abnormal lipid profile."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Papular xanthoma is a rare normolipemic xanthomatous skin disease which
        primarily occurs in adults.
      explanation: >-
        Explicitly characterizes papular xanthoma as a xanthomatous skin
        disease.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    Population-level point prevalence is not established; papular xanthoma is a
    rare cutaneous non-Langerhans cell histiocytosis documented through small
    clinicopathologic series and isolated case reports, with a 4:1
    male-to-female ratio reported in the 10-case clinicopathologic study.
  evidence:
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this clinicopathologic study, papular xanthoma presented clinically
      mainly as solitary papule, with a male to female ratio of4 : 1, in an age
      range from 13 to 57 years and a biphasic occurrence: in the young
      adolescence and middle ages.
    explanation: >-
      Documents the 10-case clinicopathologic series and its 4:1 male-to-female
      distribution.
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This series confirms PX as a rare, but distinguished clinicopathologic
      entity in the spectrum of n-LCH of the skin.
    explanation: >-
      Confirms papular xanthoma as a rare entity within cutaneous
      non-Langerhans cell histiocytoses.
progression:
- phase: Biphasic adolescent and adult onset
  age_range: 13 to 57 years (young adolescence and middle age)
  notes: >-
    Papular xanthoma primarily occurs in adults, with the 10-case
    clinicopathologic series documenting an age range of 13 to 57 years and a
    biphasic distribution peaking in young adolescence and middle age.
  evidence:
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this clinicopathologic study, papular xanthoma presented clinically
      mainly as solitary papule, with a male to female ratio of4 : 1, in an age
      range from 13 to 57 years and a biphasic occurrence: in the young
      adolescence and middle ages.
    explanation: >-
      Establishes the 13 to 57 year age range and biphasic adolescent and
      middle-age distribution in the clinicopathologic series.
  - reference: PMID:20199419
    reference_title: "Case report--papular xanthoma in a 10-year-old female with abnormal lipid profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Papular xanthoma is a rare normolipemic xanthomatous skin disease which
      primarily occurs in adults.
    explanation: >-
      Confirms that papular xanthoma primarily presents in adulthood.
- phase: Childhood
  age_range: Childhood
  notes: >-
    Less commonly, papular xanthoma presents in children, including with
    multiple facial papules.
  evidence:
  - reference: PMID:20199419
    reference_title: "Case report--papular xanthoma in a 10-year-old female with abnormal lipid profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While this rare disorder has been documented in children, all but one
      reported in the literature had a normal lipid profile. We report a
      10-year-old girl with multiple papule xanthomas on her face that had an
      abnormal lipid profile.
    explanation: >-
      Documents childhood presentation with multiple facial papular xanthomas.
biochemical:
- name: Normal Serum Lipid Profile (Normolipemia)
  presence: Normal
  biomarker_term:
    preferred_term: cholesterol
    term:
      id: CHEBI:16113
      label: cholesterol
  loinc_term:
    id: LOINC:14647-2
    label: Cholesterol [Moles/volume] in Serum or Plasma
  context: >-
    Papular xanthoma is classically a normolipemic cutaneous non-Langerhans cell
    histiocytosis with normal serum cholesterol and triglyceride concentrations,
    distinguishing it from dyslipidemic cutaneous xanthomas.
  notes: >-
    Rare pediatric exceptions with abnormal serum lipid profiles have been
    documented (two pediatric cases noted by Alan Arbuckle and Prok 2010), so
    serum lipid evaluation remains part of the diagnostic workup.
  evidence:
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Papular xanthoma (PX) is one of several clinicopathologic variants of
      normolipemic cutaneous non-Langerhans cell histiocytoses (n-LCH).
    explanation: >-
      Defines papular xanthoma as a normolipemic cutaneous non-Langerhans cell
      histiocytosis.
  - reference: PMID:20199419
    reference_title: "Case report--papular xanthoma in a 10-year-old female with abnormal lipid profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While this rare disorder has been documented in children, all but one
      reported in the literature had a normal lipid profile. We report a
      10-year-old girl with multiple papule xanthomas on her face that had an
      abnormal lipid profile. To our knowledge this is only the second reported
      case of papular xanthoma in the pediatric population with an abnormal
      lipid profile.
    explanation: >-
      Confirms that normal serum lipid profiles are the rule in pediatric as
      well as adult papular xanthoma, while documenting the second reported
      pediatric case with an abnormal lipid profile.
  - reference: PMID:28500693
    reference_title: "The clinical spectrum of xanthomatous lesions of the eyelids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the other hand, different types of normolipemic disorders may also
      cause xanthomatous eyelid lesions. Among these, Langerhans cell
      histiocytosis, diffuse normolipemic xanthoma, and non-Langerhans cell
      histiocytoses (papular xanthoma, juvenile xanthogranuloma, xanthoma
      disseminatum, adult-onset xanthogranuloma, adult-onset asthma and
      periocular xanthogranuloma, necrobiotic xanthogranuloma, Erdheim-Chester
      disease, Rosai-Dorfman disease, and reticulohistiocytosis) can be listed.
    explanation: >-
      Places papular xanthoma among normolipemic disorders that cause
      xanthomatous lesions, contrasting it with hyperlipidemia-associated
      xanthelasma palpebrarum.
pathophysiology:
- name: Xanthomatized Dermal Macrophage Infiltration
  description: >
    Papular xanthoma lesions represent a monomorphous non-Langerhans cell
    histiocytosis reaction pattern dominated by xanthomatized macrophages in
    skin. Foamy macrophage accumulation and Touton giant cells produce the
    yellow papular clinical morphology and anchor the diagnosis histologically.
  cell_types:
  - preferred_term: xanthomatized macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage derived foam cell differentiation
    term:
      id: GO:0010742
      label: macrophage derived foam cell differentiation
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
  downstream:
  - target: Solitary or multiple papules
    description: >
      Dermal xanthomatized macrophage accumulation produces the papular lesion
      morphology described clinically.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12028152
      reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Histology showed moderately well circumscribed exoendophytic papules
        with a regular epidermis and a dense infiltration of xanthomatized
        macrophages interspersed by numerous Touton type giant cells.
      explanation: >-
        Connects the dense dermal infiltration of xanthomatized macrophages
        directly to the exoendophytic papular lesion morphology.
  - target: Yellow xanthomatous eyelid or periocular lesions
    description: >
      Xanthomatized macrophage infiltration in papular xanthoma is associated
      with xanthomatous lesions on the eyelids or periocular region.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28500693
      reference_title: "The clinical spectrum of xanthomatous lesions of the eyelids."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        On the other hand, different types of normolipemic disorders may also
        cause xanthomatous eyelid lesions. Among these, Langerhans cell
        histiocytosis, diffuse normolipemic xanthoma, and non-Langerhans cell
        histiocytoses (papular xanthoma, juvenile xanthogranuloma, xanthoma

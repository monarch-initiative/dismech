        periocular xanthogranuloma, necrobiotic xanthogranuloma, Erdheim-Chester
        disease, Rosai-Dorfman disease, and reticulohistiocytosis) can be
        listed.
      explanation: >-
        Lists papular xanthoma among normolipemic non-Langerhans cell
        histiocytoses that can cause xanthomatous eyelid lesions.
  - target: Foamy Xanthomatized Macrophage Infiltrate
    description: >
      The pathophysiologic macrophage accumulation is directly observed as the
      foamy or xanthomatized dermal infiltrate on biopsy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12028152
      reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."

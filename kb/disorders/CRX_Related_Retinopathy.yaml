genetic:
- name: CRX
  gene_term:
    preferred_term: CRX
    term:
      id: hgnc:2383
      label: CRX
  notes: >
    CRX encodes an OTX-family homeodomain transcription factor that acts
    synergistically with NRL, a rod-specific bZIP transcription factor, to
    activate the rhodopsin promoter and other rod photoreceptor genes; CRX also
    independently transactivates cone phototransduction and outer-segment
    genes. Disease variants act through dominant-negative, hypomorphic, or
    antimorphic/gain-of-function mechanisms depending on variant class and
    location.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In this paradigm, disease variants are categorized into four major classes based on their locations in CRX functional domains and the impacts on CRX biochemical properties (Figure 2E)."
    explanation: >
      Establishes the four-class variant categorization used to model CRX
      genetic mechanisms in this entry; this is the review authors'
      classification scheme rather than a primary result.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CRX-NRL-mediated synergistic activation of the rhodopsin promoter is another prominent example of CRX-transcription factor interactions. NRL is a basic leucine zipper (bZIP) transcription factor speciﬁcally expressed in rods (Chen et al., 1997)."
    explanation: >
      Documents the CRX-NRL synergistic activation of the rhodopsin promoter
      (established in cell-culture reporter assays) and NRL's identity as a
      rod-specific bZIP transcription factor.

- name: CORD2
  display_name: Cone-Rod Dystrophy 2
  description: >
    Autosomal dominant cone-rod dystrophy branch with earlier onset when caused
    by homeodomain DNA-binding-specificity gain-of-function variants (e.g.,
    p.Glu80Ala) or milder, later onset when caused by heterozygous hypomorphic
    homeodomain variants (e.g., p.Arg90Trp), presenting with progressive central
    visual loss, photophobia, and color vision disturbance preceding peripheral
    field loss.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "E80A [NM_000554.6:c.239A > C (p.Glu80Ala), ClinVar"
    explanation: >
      Identifies the DNA-binding-specificity gain-of-function variant
      p.Glu80Ala as a severe early-onset dominant CORD allele.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is associated with severe early-onset dominant"
    explanation: >
      Confirms p.Glu80Ala causes severe early-onset dominant CORD in humans.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild late-onset dominant CoRD"
    explanation: >
      Confirms that heterozygous p.Arg90Trp produces a distinct, milder
      late-onset dominant CORD phenotype.
- name: Maculopathy
  display_name: CRX-Associated Maculopathy
  description: >
    Macula-predominant branch with degeneration largely confined to the central
    retina; distinguished clinically from cone-rod and rod-cone patterns by
    relatively preserved peripheral function.
  evidence:
  - reference: PMID:41595470
    reference_title: "Nasal Retinal Degeneration Is a Feature of a Subset of CRX-Associated Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital amaurosis (LCA), maculopathy (M), cone-rod dystrophy (CRD), and"
    explanation: >
      Clinical case series explicitly categorizes CRX-associated maculopathy as
      a distinct phenotype alongside LCA, CORD, and RP.
- name: adRP
  display_name: Autosomal Dominant Retinitis Pigmentosa
  description: >
    Milder, later-onset rod-cone dystrophy branch presenting with night
    blindness and peripheral field loss preceding central involvement.
  evidence:
  - reference: PMID:41595470

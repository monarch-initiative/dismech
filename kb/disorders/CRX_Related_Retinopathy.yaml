name: CRX-Related Retinopathy
creation_date: "2026-07-07T00:00:00Z"
category: Mendelian
description: >
  CRX-related retinopathy is an umbrella of inherited retinal diseases caused by
  pathogenic variants in CRX (cone-rod homeobox), which encodes an OTX-family
  homeodomain transcription factor essential for photoreceptor differentiation,
  outer-segment morphogenesis, and maintenance. CRX transactivates
  phototransduction and photoreceptor outer-segment genes in both rod and cone
  photoreceptors. Disease variants fall into at least four biochemically distinct
  pathogenic classes -- C-terminal truncating variants that produce an
  overexpressed, transcriptionally incompetent dominant-negative protein;
  C-terminal elongating frameshift variants that disrupt cofactor recruitment;
  homeodomain missense variants that reduce CRX-DNA binding affinity
  (hypomorphic); and homeodomain missense variants that alter CRX-DNA binding
  specificity (antimorphic/gain-of-function) -- producing a phenotypic spectrum
  spanning severe early-onset Leber congenital amaurosis (LCA7), cone-rod
  dystrophy 2 (CORD2), CRX-associated maculopathy, and later-onset autosomal
  dominant retinitis pigmentosa, with disease severity broadly correlating with
  the variant class and its functional effect on CRX activity.

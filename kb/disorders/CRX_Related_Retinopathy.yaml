- name: LCA7
  display_name: Leber Congenital Amaurosis 7
  description: >
    Severe, infantile-onset branch presenting with profound vision loss,
    nystagmus, and a non-recordable or severely attenuated electroretinogram.
    Caused by dominant-negative C-terminal truncating variants (e.g., p.Glu168fs)
    or homeodomain DNA-binding-specificity-altering variants (e.g., p.Lys88Asn),
    and, rarely, by biallelic hypomorphic homeodomain variants (e.g., p.Arg90Trp
    homozygotes) that reduce CRX function to a degree comparable to complete loss.
  evidence:

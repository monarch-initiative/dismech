genetic:
- name: CRX
  gene_term:
    preferred_term: CRX
    term:
      id: hgnc:2383
      label: CRX
  notes: >
    CRX encodes an OTX-family homeodomain transcription factor that acts
    synergistically with NRL, a rod-specific bZIP transcription factor, to
    activate the rhodopsin promoter and other rod photoreceptor genes; CRX also
    independently transactivates cone phototransduction and outer-segment
    genes. Disease variants act through dominant-negative, hypomorphic, or
    antimorphic/gain-of-function mechanisms depending on variant class and
    location.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "paradigm, disease variants are categorized into four major classes"
    explanation: >
      Establishes the four-class variant categorization used to model CRX
      genetic mechanisms in this entry.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CRX-NRL-mediated synergistic activation of the rhodopsin"
    explanation: >
      Documents the CRX-NRL synergistic co-occupancy mechanism required for
      rod-specific rhodopsin promoter activation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rod-cone dystrophy (RCD), such as retinitis pigmentosa (RP)."
    explanation: >
      Confirms rod-cone dystrophy / retinitis pigmentosa as a recognized branch
      of the CRX phenotypic spectrum.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Most CRX-related disease arises from heterozygous de novo or inherited
    dominant-negative or gain-of-function variants.
  evidence:
  - reference: PMID:39632990
    reference_title: "Bifocal retinal degeneration observed on ultra-widefield autofluorescence in some cases of CRX-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in CRX are associated with dominantly inherited retinopathy with considerable phenotypic variability."
    explanation: >
      Multicenter UK cohort study confirms dominant inheritance as the
      predominant CRX disease mode with wide phenotypic variability.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Rare biallelic hypomorphic homeodomain variants (e.g., p.Arg90Trp
    homozygotes) that severely reduce, but do not eliminate, CRX DNA-binding
    affinity can produce recessive LCA; the same variant is associated with mild
    dominant CORD when heterozygous, an unusual zygosity-dependent phenotype
    divergence for a single allele.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R90W variant [NM_000554.6: c.268C > T (p.Arg90Trp),"
    explanation: >
      Identifies p.Arg90Trp as the representative hypomorphic variant whose
      biallelic state produces recessive LCA.
pathophysiology:
- name: CRX Variant Pathogenic Classification
  description: >
    CRX disease variants are categorized into at least four biochemically
    distinct pathogenic classes based on their location in CRX functional
    domains and their impact on CRX biochemical properties: C-terminal
    truncating variants, C-terminal elongating frameshift variants, homeodomain
    variants that reduce DNA-binding affinity, and homeodomain variants that
    alter DNA-binding specificity.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "disease variants are categorized into four major classes"
    explanation: >
      States the categorical framework used to classify CRX pathogenic variant
      mechanisms.
- name: C-Terminal Truncation and Dominant-Negative Overexpression
  description: >
    Frameshift and nonsense variants concentrated in the CRX C-terminal
    transcription-effector domain produce truncated proteins that retain intact
    DNA-binding activity but are defective in gene activation. These truncating
    transcripts escape nonsense-mediated decay and are allele-specifically
    overexpressed, so the truncated protein accumulates at higher-than-wild-type
    levels and outcompetes wild-type CRX for binding at cognate regulatory
    sequences, producing a dominant-negative block of photoreceptor gene
    activation.
  biological_processes:
  - preferred_term: Regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In humans, E168d2 [NM_000554.6: c.503_504del (p.Glu168fs),"
    explanation: >
      Anchors the C-terminal truncation mechanism to the CrxE168d2 knock-in
      mouse model of the human p.Glu168fs dominant-LCA variant.
- name: Homeodomain DNA-Binding Affinity Reduction
  description: >
    Homeodomain missense variants such as p.Arg90Trp reduce CRX's binding
    affinity to its cognate DNA sequences without altering binding specificity,
    producing a hypomorphic allele. Severity scales with the degree of affinity
    loss: heterozygous carriers show mild, late-onset dominant cone-rod
    dystrophy, while biallelic carriers show a loss-of-function phenotype
    resembling complete CRX deficiency (recessive LCA).
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R90W variant [NM_000554.6: c.268C > T (p.Arg90Trp),"
    explanation: >
      Identifies p.Arg90Trp as the representative hypomorphic, DNA-binding-affinity-reducing
      homeodomain variant.
- name: Homeodomain DNA-Binding Specificity Alteration
  description: >
    A distinct class of homeodomain missense variants (e.g., p.Glu80Ala,
    p.Lys88Asn) alters CRX's DNA-binding sequence specificity rather than
    simply reducing affinity, causing the mutant protein to bind non-cognate
    sites and either drive ectopic/precocious gene activation or antagonize
    wild-type CRX function at its normal target genes. These
    antimorphic/gain-of-function variants produce more severe dominant
    phenotypes than simple affinity-reducing hypomorphic variants.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "E80A [NM_000554.6:c.239A > C (p.Glu80Ala), ClinVar"
    explanation: >
      Identifies p.Glu80Ala as a DNA-binding-specificity-altering
      gain-of-function variant causing severe dominant CORD.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "K88N [NM_000554.6: c.264G > T (p.Lys88Asn), no"
    explanation: >
      Identifies p.Lys88Asn as a distinct DNA-binding-specificity-altering
      variant causing severe dominant LCA, the most severe class described.

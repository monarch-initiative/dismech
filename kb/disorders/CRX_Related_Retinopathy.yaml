has_subtypes:
- name: LCA7
  display_name: Leber Congenital Amaurosis 7
  description: >
    Severe, infantile-onset branch presenting with profound vision loss,
    nystagmus, and a non-recordable or severely attenuated electroretinogram.
    Caused by dominant-negative C-terminal truncating variants (e.g., p.Glu168fs)
    or homeodomain DNA-binding-specificity-altering variants (e.g., p.Lys88Asn),
    and, rarely, by biallelic hypomorphic homeodomain variants (e.g., p.Arg90Trp
    homozygotes) that reduce CRX function to a degree comparable to complete loss.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, E168d2 [NM_000554.6: c.503_504del (p.Glu168fs), ClinVar VCV000099609] ... is associated with dominant LCA (Freund et al., 1998; Jacobson et al., 1998)."
    explanation: >
      Review restates the original clinical genetics reports establishing the
      C-terminal truncating variant p.Glu168fs as a dominant-LCA allele in
      humans.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "K88N [NM_000554.6: c.264G > T (p.Lys88Asn), no ClinVar entry] ... is associated with severe dominant LCA in humans (Nichols et al., 2010)."
    explanation: >
      Review restates the human genotype-phenotype report identifying the
      homeodomain DNA-binding-specificity variant p.Lys88Asn as a severe
      dominant-LCA allele.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R90W variant [NM_000554.6: c.268C > T (p.Arg90Trp), ClinVar VCV000007422] ... is associated with recessive LCA and mild late-onset dominant CoRD (Swaroop et al., 1999; Fujinami-Yokokawa et al., 2020; Ng et al., 2020)."
    explanation: >
      Review restates the human reports associating the hypomorphic homeodomain
      variant p.Arg90Trp with recessive LCA (biallelic state), distinct from
      its mild dominant CORD presentation when heterozygous.
- name: CORD2
  display_name: Cone-Rod Dystrophy 2
  description: >
    Autosomal dominant cone-rod dystrophy branch with earlier onset when caused
    by homeodomain DNA-binding-specificity gain-of-function variants (e.g.,
    p.Glu80Ala) or milder, later onset when caused by heterozygous hypomorphic
    homeodomain variants (e.g., p.Arg90Trp), presenting with progressive central
    visual loss, photophobia, and color vision disturbance preceding peripheral
    field loss.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "E80A [NM_000554.6:c.239A > C (p.Glu80Ala), ClinVar VCV000007416] ... is associated with severe early-onset dominant CoRD in humans (Hittner et al., 1975; Freund et al., 1997; Sohocki et al., 1998, 2001)."
    explanation: >
      Review restates the human reports establishing the
      DNA-binding-specificity gain-of-function variant p.Glu80Ala as a severe
      early-onset dominant CORD allele.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R90W variant [NM_000554.6: c.268C > T (p.Arg90Trp), ClinVar VCV000007422] ... is associated with recessive LCA and mild late-onset dominant CoRD (Swaroop et al., 1999; Fujinami-Yokokawa et al., 2020; Ng et al., 2020)."
    explanation: >
      Review restates the human reports in which heterozygous p.Arg90Trp
      produces a distinct, milder late-onset dominant CORD phenotype (the
      recessive-LCA association applies to the biallelic state).
- name: Maculopathy
  display_name: CRX-Associated Maculopathy
  description: >
    Macula-predominant branch with degeneration largely confined to the central
    retina; distinguished clinically from cone-rod and rod-cone patterns by
    relatively preserved peripheral function.
  evidence:
  - reference: PMID:41595470
    reference_title: "Nasal Retinal Degeneration Is a Feature of a Subset of CRX-Associated Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CRX-associated retinopathies can produce variable phenotypes, including Leber congenital amaurosis (LCA), maculopathy (M), cone-rod dystrophy (CRD), and rod-cone dystrophy (RCD), such as retinitis pigmentosa (RP)."
    explanation: >
      Clinical case series explicitly categorizes CRX-associated maculopathy as
      a distinct phenotype alongside LCA, CORD, and RP.
- name: adRP
  display_name: Autosomal Dominant Retinitis Pigmentosa
  description: >
    Milder, later-onset rod-cone dystrophy branch presenting with night
    blindness and peripheral field loss preceding central involvement.
  evidence:
  - reference: PMID:41595470
    reference_title: "Nasal Retinal Degeneration Is a Feature of a Subset of CRX-Associated Retinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CRX-associated retinopathies can produce variable phenotypes, including Leber congenital amaurosis (LCA), maculopathy (M), cone-rod dystrophy (CRD), and rod-cone dystrophy (RCD), such as retinitis pigmentosa (RP)."
    explanation: >
      Confirms rod-cone dystrophy / retinitis pigmentosa as a recognized branch
      of the CRX phenotypic spectrum.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Most CRX-related disease arises from heterozygous de novo or inherited
    dominant-negative or gain-of-function variants.
  evidence:
  - reference: PMID:39632990
    reference_title: "Bifocal retinal degeneration observed on ultra-widefield autofluorescence in some cases of CRX-associated retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in CRX are associated with dominantly inherited retinopathy with considerable phenotypic variability."
    explanation: >
      Multicenter UK cohort study confirms dominant inheritance as the
      predominant CRX disease mode with wide phenotypic variability.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Rare biallelic hypomorphic homeodomain variants (e.g., p.Arg90Trp
    homozygotes) that severely reduce, but do not eliminate, CRX DNA-binding
    affinity can produce recessive LCA; the same variant is associated with mild
    dominant CORD when heterozygous, an unusual zygosity-dependent phenotype
    divergence for a single allele.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R90W variant [NM_000554.6: c.268C > T (p.Arg90Trp), ClinVar VCV000007422] ... is associated with recessive LCA and mild late-onset dominant CoRD (Swaroop et al., 1999; Fujinami-Yokokawa et al., 2020; Ng et al., 2020)."
    explanation: >
      Review restates the human reports identifying p.Arg90Trp as the
      representative hypomorphic variant whose biallelic state produces
      recessive LCA.
pathophysiology:
- name: CRX Variant Pathogenic Classification
  description: >
    CRX disease variants are categorized into at least four biochemically
    distinct pathogenic classes based on their location in CRX functional
    domains and their impact on CRX biochemical properties: C-terminal
    truncating variants, C-terminal elongating frameshift variants, homeodomain
    variants that reduce DNA-binding affinity, and homeodomain variants that
    alter DNA-binding specificity.
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In this paradigm, disease variants are categorized into four major classes based on their locations in CRX functional domains and the impacts on CRX biochemical properties (Figure 2E)."
    explanation: >
      States the review's categorical framework used to classify CRX pathogenic
      variant mechanisms; this is the authors' classification scheme rather
      than a primary clinical or experimental result.
- name: C-Terminal Truncation and Dominant-Negative Overexpression
  description: >
    Frameshift and nonsense variants concentrated in the CRX C-terminal
    transcription-effector domain produce truncated proteins that retain intact
    DNA-binding activity but are defective in gene activation. Because the
    entire effector domain is encoded in the last exon of CRX, the truncating
    transcripts are proposed to escape nonsense-mediated decay, although
    competing models suggest that the long 3'-UTRs created by premature
    termination codons can instead trigger NMD, and the mRNA-level mechanism
    remains an open question. What is demonstrated, in the E168d2/+ knock-in
    mouse, is an allele-specific overexpression of the mutant transcripts with
    accumulation of the non-functional truncated protein to a significantly
    elevated mutant-to-wild-type ratio, so that truncated CRX outcompetes
    wild-type CRX for binding at cognate regulatory sequences, producing a
    dominant-negative block of photoreceptor gene activation.
  biological_processes:
  - preferred_term: Regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Molecular studies in the E168d2/+ mouse retinas reveal an allelic-speciﬁc overexpression of the mutant transcripts and accumulation of the non-functional, truncated proteins, resulting in a signiﬁcantly elevated mutant-to-WT ratio (Figure 3D)."
    explanation: >
      Demonstrates, in the CrxE168d2 knock-in mouse modeling the human
      p.Glu168fs dominant-LCA variant, the allele-specific overexpression of
      the mutant transcript and truncated-protein accumulation asserted by
      this node.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The impaired photoreceptor diﬀerentiation in the E168d2/+ retinas can thus be explained by a dominant-negative mechanism where the signiﬁcantly higher concentrations of the mutant proteins outcompete WT proteins in binding to CRX cognate sites and interfere with downstream gene regulations."
    explanation: >
      States the dominant-negative interpretation of the mouse data: the
      overexpressed truncated protein outcompetes wild-type CRX at its cognate
      sites.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the entire CRX transcription eﬀector domain is encoded by sequences in the last exon of CRX, allelic truncating mutations in the CRX transcription eﬀector domain likely produce mutant mRNA that escapes NMD."
    explanation: >
      The review's inference from the exon-junction-complex model of NMD that
      supports the proposed (not established) NMD-escape clause of this node;
      it is mechanistic reasoning, not a primary experimental result.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Yet, other models suggest that the long 3’-UTRs created by PTCs can trigger NMD by promoting the binding of a central regulator of NMD (He and Jacobson, 2015)."
    explanation: >
      Records the competing model the review raises against NMD escape,
      supporting this node's framing of the mRNA-level mechanism as an open
      question.
  downstream:
  - target: Impaired CRX-Dependent Photoreceptor Gene Activation
    description: >-
      Overexpressed truncated CRX protein outcompetes wild-type CRX for
      binding at photoreceptor regulatory sequences, blocking activation of
      CRX target genes.
- name: C-Terminal Elongating Frameshift and Cofactor Recruitment Disruption
  description: >
    A second, distinct class of C-terminal frameshift variants produces an
    elongated mutant CRX protein retaining a partial transcription effector
    domain with a non-homologous C-terminal extension, rather than a
    truncated one. Unlike truncating variants, these elongating variants are
    not overexpressed and do not act through simple dominant-negative
    competition; instead, loss of the OTX tail domain and altered amino-acid
    composition and residue patterning of the extended effector domain
    disrupt the selective recruitment of transcriptional co-factors,
    mediators, and histone-binding complexes -- including self-recruitment of
    wild-type CRX and OTX2 -- perturbing photoreceptor gene regulation during
    development.
  biological_processes:
  - preferred_term: Regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "frameshift variants can also produce an elongated mutant CRX protein with a partial transcription eﬀector domain and a non-homologous extension in the C-terminus"
    explanation: >
      Describes the C-terminal elongating frameshift mechanism, distinct from
      truncation, modeled by the CrxRip mouse (p.Gly255Alafs*133).
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "removal of the OTX tail domain (CRX aa.284-296, Figure 2A) in the CRX RIP protein disrupts the recruitment of WT CRX and OTX2 and thus reduces the expression of downstream transcriptional regulators during photoreceptor development"
    explanation: >
      Identifies loss of the OTX tail domain in the CrxRip elongated protein
      as the mechanism disrupting cofactor recruitment during photoreceptor
      development.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "may disrupt WT CRX eﬀector domain residue patterning ( Figure 2G ), which could impact the aﬃnity and/or speciﬁcity of recruiting transcription (co-)factors and mediators beyond just OTX2 and CRX"
    explanation: >
      Explains that altered effector-domain residue patterning in elongating
      variants broadly perturbs recruitment of transcriptional co-factors
      beyond just the OTX tail interaction.
  downstream:
  - target: Impaired CRX-Dependent Photoreceptor Gene Activation
    description: >-
      Disrupted cofactor recruitment by the elongated CRX effector domain
      impairs activation of CRX target genes required for photoreceptor
      development and function.
- name: Homeodomain DNA-Binding Affinity Reduction
  description: >
    Homeodomain missense variants such as p.Arg90Trp reduce CRX's binding
    affinity to its cognate DNA sequences without altering binding specificity,
    producing a hypomorphic allele. Severity scales with the degree of affinity
    loss: heterozygous carriers show mild, late-onset dominant cone-rod
    dystrophy, while biallelic carriers show a loss-of-function phenotype
    resembling complete CRX deficiency (recessive LCA).
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical assays found that R90W HD has signiﬁcantly reduced DNA binding aﬃnity and activates photoreceptor gene promoters poorly (Chen et al., 2002; Figure 3B )."
    explanation: >
      Biochemical (in vitro) demonstration that the R90W homeodomain has
      reduced DNA-binding affinity and poorly activates photoreceptor gene
      promoters, the defining property of this hypomorphic variant class.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R90W variant [NM_000554.6: c.268C > T (p.Arg90Trp), ClinVar VCV000007422] ... is associated with recessive LCA and mild late-onset dominant CoRD (Swaroop et al., 1999; Fujinami-Yokokawa et al., 2020; Ng et al., 2020)."
    explanation: >
      Review restates the human genotype-phenotype reports: heterozygous
      p.Arg90Trp gives mild late-onset dominant CORD while the biallelic state
      gives recessive LCA, matching the zygosity-dependent severity claim of
      this node.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As expected, the CrxR90W/W mouse shows photoreceptor degeneration phenotypes similar to that observed in Crx−/− (Supplementary Table 2)."
    explanation: >
      The homozygous R90W knock-in mouse phenocopies complete Crx loss,
      supporting the claim that the biallelic hypomorphic state resembles
      complete CRX deficiency.
  downstream:
  - target: Impaired CRX-Dependent Photoreceptor Gene Activation
    description: >-
      Reduced DNA-binding affinity impairs CRX's ability to activate its
      target photoreceptor genes, with severity scaling with the degree of
      affinity loss.
- name: Homeodomain DNA-Binding Specificity Alteration
  description: >
    A distinct class of homeodomain missense variants (e.g., p.Glu80Ala,
    p.Lys88Asn) alters CRX's DNA-binding sequence specificity rather than
    simply reducing affinity, causing the mutant protein to bind non-cognate
    sites and either drive ectopic/precocious gene activation or antagonize
    wild-type CRX function at its normal target genes. These
    antimorphic/gain-of-function variants produce more severe dominant
    phenotypes than simple affinity-reducing hypomorphic variants.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical evidence suggests that the E > A substitution, which changes a negatively charged residue to a small hydrophobic residue, likely results in a gain of entropy such that the mutant CRX E80A protein binds more promiscuously to non-consensus/sub-optimal CRX motifs and drives a higher level of gene expression (Figure 3C; Wilson et al., 1995; Chaney et al., 2005)."
    explanation: >
      Biochemical demonstration that p.Glu80Ala relaxes CRX binding
      selectivity, causing promiscuous binding at non-cognate motifs and
      elevated gene expression - the ectopic/precocious activation arm of this
      node.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "High-throughput in vitro DNA binding speciﬁcity assay, Spec-seq, reveals that K88N mutation changes CRX preferred sequence from TAATCC to TAATT[A/T]."
    explanation: >
      In vitro Spec-seq demonstration that p.Lys88Asn changes CRX's preferred
      DNA-binding sequence, the defining specificity alteration of this
      variant class.
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Even in K88N/+ retinas, most photoreceptor-speciﬁc genes remain severely under-expressed at P21, suggesting that the ectopic CRX K88N activity functionally antagonizes CRX WT’s actions."
    explanation: >
      Mouse retinal data showing that ectopic K88N activity functionally
      antagonizes wild-type CRX, supporting the antimorphic arm of this node.
  downstream:
  - target: Impaired CRX-Dependent Photoreceptor Gene Activation
    description: >-
      Altered DNA-binding specificity causes the mutant protein to bind
      non-cognate sites, either driving ectopic/precocious gene activation or
      antagonizing wild-type CRX function at its normal target genes.
- name: Impaired CRX-Dependent Photoreceptor Gene Activation
  description: >
    All four CRX pathogenic variant classes converge on impaired activation
    of CRX-dependent photoreceptor genes -- whether through dominant-negative
    competition, disrupted cofactor recruitment, reduced DNA-binding
    affinity, or altered DNA-binding specificity. CRX transactivates
    phototransduction and photoreceptor outer-segment genes required for
    photoreceptor terminal differentiation, maturation, and maintenance in
    both rods and cones.
  biological_processes:
  - preferred_term: Regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genetic ablation of Crx in mice ( Crx-/-) does not aﬀect the genesis of photoreceptors but prevents their terminal diﬀerentiation and leads to rapid degeneration of the immature photoreceptor cells"
    explanation: >
      Establishes that loss of CRX-dependent gene activation prevents
      photoreceptor terminal differentiation and leads to their degeneration,
      the convergent downstream consequence of all four pathogenic variant
      classes.
  downstream:
  - target: Rod Photoreceptor Apoptosis
    description: >-
      Photoreceptors that fail to complete terminal differentiation and
      maintain CRX-dependent gene expression programs undergo progressive
      degeneration and apoptosis.
- name: Rod Photoreceptor Apoptosis
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >
    Photoreceptors lacking functional CRX-dependent gene expression undergo
    progressive rod and cone degeneration and apoptosis, producing the
    phenotypic spectrum of visual loss (nystagmus, non-recordable ERG,
    photophobia, color vision defects, macular atrophy, nyctalopia, central
    scotoma, and progressive visual field loss) that characterizes LCA7,
    CORD2, CRX-associated maculopathy, and adRP.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38414750
    reference_title: "Transcriptional precision in photoreceptor development and diseases - Lessons from 25 years of CRX research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "leads to rapid degeneration of the immature photoreceptor cells on or before P21"
    explanation: >
      Documents rapid photoreceptor degeneration following loss of CRX
      function in the Crx-/- mouse model.

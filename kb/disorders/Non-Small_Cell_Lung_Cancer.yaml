  title: Multi-omic analyses from a randomized phase II study of epigenetic priming followed by nivolumab in previously treated metastatic non-small cell lung cancer
  description: Emergence of resistance to immune checkpoint blockade (ICB) mandates the development of strategies for ICB sensitization. We aimed to understand the effects of epigenetic priming in re-shaping the tumor microenvironment, together with molecular drivers of therapeutic response of epigenetic therapy followed by ICB in non-small cell lung cancer (NSCLC; NCT01928576). This was done through a multi-omic approach encompassing both genomic and transcriptomic analyses. Findings suggest that epigenetic therapy may reshape the tumor microenvironment towards a more inflamed phenotype and prime responses to immunotherapy.

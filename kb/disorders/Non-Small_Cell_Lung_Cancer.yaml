discussions:
- discussion_id: gap_nsclc_coal_smoke_genomic_phenotype_vs_checkpoint_benefit
  prompt: >-
    Does the coal-smoke-associated genomic phenotype of Xuanwei NSCLC — higher
    tumour mutation burden, predominance of uncommon EGFR alleles, and a
    benzo[a]pyrene mutational signature — actually cause a different benefit
    from PD-1 blockade, or is the reported regional difference in disease
    control rate explained by cohort composition and retrospective design?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Oncogenic Driver Mutations
  - pathophysiology#Immune Evasion
  rationale: >-
    Two claims sit on either side of this gap and nothing yet connects them.
    The genomic side is peer-reviewed and reasonably firm: Xuanwei NSCLC is a
    distinct subtype with significantly higher tumour mutation burden than
    reference Chinese and TCGA cohorts, which is a recognised correlate of
    checkpoint-inhibitor benefit and would predict better response. The
    clinical side is a single-region retrospective real-world comparison,
    available only as a non-peer-reviewed preprint, reporting a higher disease
    control rate for camrelizumab and sintilimab in Xuanwei than non-Xuanwei
    patients — with no accompanying progression-free survival difference, which
    is what a genuine immunobiological advantage would be expected to move.
    Neither study measured TMB and checkpoint-inhibitor outcome in the same
    patients, so the mechanistic bridge is entirely inferred. This entry
    therefore records the question rather than asserting a
    coal-smoke-to-immunotherapy-response edge, and the preprint is deliberately
    not the sole support for anything curated on a node.
  proposed_experiments:
  - experiment_id: exp_nsclc_xuanwei_tmb_stratified_checkpoint_outcome
    name: TMB- and signature-stratified checkpoint-inhibitor outcome cohort in coal-smoke-exposed NSCLC
    description: >-
      Prospectively enrol NSCLC patients receiving PD-1 blockade from
      smoky-coal-exposed and unexposed regions, measure tumour mutation burden,
      SBS4/benzo[a]pyrene-type mutational signature exposure, EGFR allele class,
      and PD-L1 expression on the same tumours, and model objective response,
      disease control rate, and progression-free survival against those
      molecular variables rather than against region of residence.
    experiment_type:
      preferred_term: prospective biomarker-stratified cohort study
    decision_criterion: >-
      The genomic explanation would be supported if checkpoint-inhibitor benefit
      tracked tumour mutation burden or the benzo[a]pyrene signature after
      adjustment, and progression-free survival moved with it. It would be
      undermined if regional origin retained its association once those
      molecular variables and PD-L1 status were accounted for, which would point
      instead to differences in cohort composition, referral, or follow-up.
  evidence:
  - reference: PMID:33889543
    reference_title: "Next-Generation Sequencing Reveals High Uncommon EGFR Mutations and Tumour Mutation Burden in a Subgroup of Lung Cancer Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients from Xuanwei showed a significantly higher tumour mutation burden than the reference Chinese and TCGA cohorts (p < 0.001)."
    explanation: >-
      Establishes the genomic side of the gap — the biomarker that would predict
      differential checkpoint-inhibitor benefit is measurably elevated in this
      population.
  - reference: PMID:39432560
    reference_title: "Proteogenomic analysis of air-pollution-associated lung cancer reveals prevention and therapeutic opportunities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic mutation analysis revealed XWLC as a distinct subtype of LUAD separate from cases associated with smoking or endogenous factors."
    explanation: >-
      Supports treating coal-smoke-associated disease as a molecularly distinct
      subtype, which is the premise that makes a differential therapeutic
      response worth testing at all.
  - reference: PPR:PPR1273960
    reference_title: "Efficacy and Safety Analysis of Camrelizumab, Sintilimab, and Tislelizumab in the Treatment of NSCLC in Xuanwei, China: A Retrospective Real-World Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "DCR was significantly higher in the Xuanwei group than in the non-Xuanwei group (95.59% vs. 72.88%, P < 0.001)."
    explanation: >-
      The clinical observation that motivates the question. Marked PARTIAL and
      not used to support any pathophysiology node: this is a non-peer-reviewed
      preprint reporting a propensity-matched retrospective comparison of 156
      patients from two hospitals, and the same report finds no between-group
      difference in progression-free survival.
  notes: >-
    Raised from the preprint surfaced in monarch-initiative/dismech#6066. Per
    the preprint-scan policy the PPR reference is cited but is not the sole
    support for any claim, and no mechanism edge was created from it.


experimental_models:
- name: Human orthotopic NSCLC lung organ-on-chip (Wyss Institute)
  description: >-
    Microfluidic human lung organ chip in which non-small-cell lung cancer cells are
    grown within a reconstituted human lung microenvironment under cyclic mechanical
    actuation that mimics breathing motions. A non-animal New Approach Methodology
    that reproduces organ-microenvironment-specific tumour growth, tumour dormancy
    and tyrosine kinase inhibitor responses in vitro, and that resolves the influence
    of physical breathing cues on EGFR and MET signalling.
  experimental_model_type: ORGAN_ON_CHIP
  namo_type: namo:OrganOnChip
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  cell_types:
  - preferred_term: lung epithelial cell
    term:
      id: CL:0000082
      label: epithelial cell of lung
  conditions:
  - non-small cell lung carcinoma growth in an orthotopic lung microenvironment
  - tyrosine kinase inhibitor exposure
  - cyclic mechanical strain mimicking breathing motions
  cell_source: >-
    Human non-small-cell lung cancer cells co-cultured with human lung epithelium in a
    reconstituted orthotopic lung microenvironment
  culture_system: >-
    Two-channel microfluidic lung organ chip under continuous perfusion with cyclic
    mechanical actuation reproducing breathing-associated strain
  publication: PMID:29020635
  modeled_mechanisms:
  - target: Oncogenic Driver Mutations
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The chip reads out driver-kinase-dependent therapeutic response, reproducing the
      tyrosine kinase inhibitor sensitivity seen in patients and resolving EGFR- and
      MET-mediated modulation of that response by the mechanical microenvironment.
    limitations: >-
      Only EGFR and MET signalling were implicated; the ALK and ROS1 rearrangement arms
      of this node were not modelled. The published abstract reports lung cancer cell
      lines in a reconstituted microenvironment rather than patient-derived tumour
      carrying its native driver spectrum, so allele-level genotype-response
      relationships are not established by this system.
    readouts:
    - name: Tyrosine kinase inhibitor therapeutic response
      target: Oncogenic Driver Mutations
      direction: ALTERED
      interpretation: >-
        TKI response in the chip tracked the responses observed in patients, and was
        itself shifted by breathing-like mechanical cues acting through EGFR and MET.
      evidence:
      - reference: PMID:29020635
        reference_title: "Human Organ Chip Models Recapitulate Orthotopic Lung Cancer Growth, Therapeutic Responses, and Tumor Dormancy In Vitro."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: revealed a previously unknown sensitivity of lung cancer cell growth, invasion, and TKI therapeutic responses to physical cues associated with breathing motions, which appear to be mediated by changes in signaling through epidermal growth factor receptor (EGFR) and MET protein kinase
        explanation: >-
          Reports that the chip measured TKI therapeutic response and attributed its
          mechanical modulation to EGFR and MET signalling.
    evidence:
    - reference: PMID:29020635
      reference_title: "Human Organ Chip Models Recapitulate Orthotopic Lung Cancer Growth, Therapeutic Responses, and Tumor Dormancy In Vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: recapitulate organ microenvironment-specific cancer growth, tumor dormancy, and responses to tyrosine kinase inhibitor (TKI) therapy observed in human patients in vivo
      explanation: >-
        Supports treating the chip as informative for driver-kinase-directed therapeutic
        response, since it reproduces the TKI responses observed in patients.
  - target: Tumor Microenvironment Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The chip reconstitutes an orthotopic lung microenvironment in which tumour growth
      and dormancy are microenvironment-specific, and adds the mechanical dimension of
      breathing motion that static culture cannot supply.
    limitations: >-
      The microenvironment modelled is epithelial and mechanical. The abstract reports no
      immune, myeloid or fibroblast compartment, so the immune-remodelling and
      desmoplastic facets of this node are outside what the system captures.
    readouts:
    - name: Microenvironment-specific tumour growth and dormancy
      target: Tumor Microenvironment Remodeling
      direction: ALTERED
      interpretation: >-
        Growth and entry into dormancy depended on the reconstituted organ
        microenvironment and on breathing-associated mechanical cues.
      evidence:
      - reference: PMID:29020635
        reference_title: "Human Organ Chip Models Recapitulate Orthotopic Lung Cancer Growth, Therapeutic Responses, and Tumor Dormancy In Vitro."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: providing an experimental model to study cancer persister cells and mechanisms of tumor dormancy in vitro
        explanation: >-
          Establishes tumour dormancy and persister-cell behaviour as measurable outputs
          of the reconstituted microenvironment.
    evidence:
    - reference: PMID:29020635
      reference_title: "Human Organ Chip Models Recapitulate Orthotopic Lung Cancer Growth, Therapeutic Responses, and Tumor Dormancy In Vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: recapitulate organ microenvironment-specific cancer growth, tumor dormancy, and responses to tyrosine kinase inhibitor (TKI) therapy observed in human patients in vivo
      explanation: >-
        Supports the claim that tumour behaviour in this system is set by the
        reconstituted organ microenvironment rather than by the tumour cells alone.
  - target: Metastasis
    relationship: PARTIALLY_RECAPITULATES

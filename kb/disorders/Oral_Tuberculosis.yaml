name: Oral Tuberculosis
creation_date: "2026-11-27T00:24:17Z"
description: >-
  Oral tuberculosis is tuberculosis of the oral cavity: the tongue, gingiva, palate,
  lips, buccal mucosa and floor of the mouth, and the jaw bones. Mycobacterium tuberculosis
  reaches the mouth mostly in bacilli-laden sputum from active pulmonary tuberculosis,
  entering through small breaks in the mucosa (secondary oral tuberculosis), and less
  often by blood-borne spread or with no other detectable focus (primary oral tuberculosis).
  An intact oral epithelium and saliva normally resist infection, which is one reason
  oral disease is rare, at about 0.5-1% of tuberculosis cases. The lesion is a caseating
  granulomatous inflammation. The typical sign is a chronic, non-healing ulcer with
  irregular, undermined edges, most often on the tongue; secondary ulcers are usually
  painful, and primary lesions, more common in younger patients and on the gingiva,
  are often painless with enlarged regional lymph nodes. Nodular or proliferative
  masses, gingival enlargement and tuberculous osteomyelitis of the mandible or maxilla
  also occur. Because the lesion closely mimics squamous cell carcinoma, biopsy is
  required; histology shows caseating granulomas, acid-fast staining is often negative
  because lesions are paucibacillary, and culture, PCR or Xpert testing and chest
  imaging for a pulmonary focus complete the work-up. In about half of reported cases
  the oral lesion led to the diagnosis of previously unknown systemic tuberculosis.
  Standard multidrug antituberculous therapy heals the lesions; surgery is limited
  to biopsy and selected cases.
category: Infectious Disease
disease_term:
  preferred_term: oral tuberculosis
  term:
    id: MONDO:0005887
    label: oral tuberculosis
parents:
- Tuberculosis
- Extrapulmonary tuberculosis
- Gastrointestinal tuberculosis
synonyms:
- tuberculosis of the oral cavity
- tuberculosis of the mouth
- oral TB
- orofacial tuberculosis
notes: >-
  Scope and boundaries. This entry covers tuberculosis of the oral cavity proper:
  the oral mucosa (tongue, gingiva, hard and soft palate, lips, buccal mucosa, floor
  of the mouth) and the jaw bones. MONDO defines the class as tuberculosis of the
  mouth, tongue and salivary glands, so salivary gland tuberculosis falls within it,
  but the cited series report salivary disease only together with lymph node involvement
  and no salivary-specific node is curated here. Tuberculosis of the larynx is curated
  separately in Laryngeal_Tuberculosis, and cutaneous tuberculosis of the face, including
  lupus vulgaris, in Lupus_Vulgaris; an oral mucosal lesion is in scope here whatever
  its source. Tonsillar and oropharyngeal tuberculosis are outside this entry. Pulmonary
  and systemic tuberculosis are in Tuberculosis. Esophageal tuberculosis is a separate
  entity. Evidence base. The literature is case reports, small case series (the largest
  cited here has 42 patients) and two systematic reviews of pooled case reports (one
  of 301 oral and maxillofacial cases, which includes jaw and some extraoral sites).
  No prospective or controlled study defines the pathogenesis; the sputum-inoculation
  route and the protective role of the intact epithelium and saliva are stated in
  reviews and case discussions rather than demonstrated, and the granuloma mechanism
  is inferred from tuberculosis generally. The pooled systematic review restricted
  itself to otherwise uncompromised patients. Symptom frequencies are set only where
  a cited series or review gives a figure, and pooled case-report figures are biased
  toward unusual presentations. About 3% of reported lesions coexist with a carcinoma
  at the same site. Seeded from PubMed searches and research/Oral_Tuberculosis-deep-research-claude_code.md.
review_notes: >-
  Deliberately lumped. All oral tuberculosis is kept in one entry regardless of the
  infecting Mycobacterium tuberculosis complex organism and regardless of oral site
  (tongue, gingiva, palate, lips, buccal mucosa or jaw bone). PubMed was searched
  for oral tuberculosis, tuberculosis of the tongue and tuberculous osteomyelitis
  of the jaw; the sources found name M. tuberculosis as the main agent and mention
  M. bovis from raw milk only as a general route of tuberculosis, and none reports
  an organism, lineage or drug-resistance stratum with its own oral presentation,
  diagnosis or first-line therapy. Sites are not split because the same granulomatous
  lesion, work-up and regimen apply at each. Primary and secondary oral tuberculosis
  are kept as clinical-form subtypes because reviews describe different ages, pain
  and nodal involvement for them, not as separate entries.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes pulmonary tuberculosis and, when
    it reaches the mouth, a chronic granulomatous inflammation of the oral tissues.
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This complex consists of M. tuberculosis, which is the main causative agent
      of TB, as well as of M. bovis, M. africanum, and M. microti
    explanation: Review naming M. tuberculosis as the main agent within the complex.
  - reference: PMID:20486998
    reference_title: 'Tuberculosis of the oral cavity: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      M. tuberculosis infects all parts of the mouth (soft and hard palate, uvula,
      buccal mucosa, gingivae, lips, tongue, maxilla, and mandible) more often in
      men than in women, appearing predominantly in the form of ulcerative lesions.
    explanation: >-
      Systematic review of published cases in otherwise uncompromised patients: every
      oral site can be infected, mostly as ulcers.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    A member of the M. tuberculosis complex acquired from cattle, mainly in raw cow's
    milk. The oral tuberculosis sources mention it only as a general, less frequent
    cause of tuberculosis; no cited oral case is attributed to it.
  evidence:
  - reference: PMID:33456244
    reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is a chronic infectious granulomatous disease caused by Mycobacterium tuberculosis,
      an acid-fast bacillus (AFB), and less frequently by ingesting un-pasteurized
      cow's milk that is infected by Mycobacterium Bovis or by other atypical mycobacteria.
    explanation: >-
      A case series' introduction restating that tuberculosis is caused mainly by
      M. tuberculosis and less often by M. bovis from raw milk.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The microorganisms are transmitted by the droplet contact, rarely by the intake
      of unpasteurized cow's milk infected with Mycobacteria
    explanation: >-
      Review naming droplet spread and, rarely, raw cow's milk as routes of infection.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans by airborne droplets. In secondary oral
    tuberculosis the patient's own sputum from pulmonary lesions inoculates the oral
    mucosa; bacilli can also reach oral tissues and jaw bones in the blood or lymph.
    Cattle are a reservoir of M. bovis, transmitted to humans rarely in unpasteurized
    milk.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Bos taurus
    role: reservoir of Mycobacterium bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Humans and bovine animals are the reservoir of TB bacilli
    explanation: Review naming humans and cattle as reservoirs.
  - reference: PMID:26366156

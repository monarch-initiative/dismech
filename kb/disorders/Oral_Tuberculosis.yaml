    explanation: >-
      Cross-sectional study of 54 patients with suspected maxillofacial tuberculosis.
  - reference: PMID:37534343
    reference_title: An Analysis of Xpert Test for Diagnosing Maxillofacial Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although accuracy of Xpert test is better for pus and biopsy samples in the
      specimens from bone and soft tissue, it gives poor accuracy for aspirated cells.
    explanation: Xpert performs poorly on aspirates.
- name: Chest Radiography
  description: >-
    Chest radiography is mandatory to look for a pulmonary focus, which separates
    secondary from primary disease and identifies an infectious patient.
  diagnosis_term:
    preferred_term: chest radiography
    term:
      id: NCIT:C38103
      label: Chest Radiography
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In every patient suspected of TB, posterior-anterior (PA) and lateral view chest
      radiograph is mandatory.
    explanation: Review recommendation of chest radiography.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mantoux skin test and chest X-ray should be done to rule out the systemic TB.
    explanation: Review recommendation of tuberculin testing and chest radiography.
- name: Tuberculin Skin Test
  description: >-
    The tuberculin (Mantoux) skin test is used with chest radiography to look for
    systemic tuberculosis; it was among the main diagnostic methods in pooled cases.
  diagnosis_term:
    preferred_term: tuberculin skin test
    term:
      id: NCIT:C85994
      label: Tuberculin Skin Test
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mantoux skin test and chest X-ray should be done to rule out the systemic TB.

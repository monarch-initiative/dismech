- name: Breach of the Oral Mucosal Barrier
  role: trigger
  description: >-
    An intact oral squamous epithelium, the flow of saliva and its antibacterial properties
    resist tubercle bacilli, which is why oral disease is rare although bacilli are
    common in the oral fluids of patients with pulmonary tuberculosis. Local trauma
    (including from sharp or broken teeth), poor oral hygiene, chronic inflammation,
    leukoplakia and tooth extraction are proposed to breach this barrier.
  biological_scale: TISSUE
  locations:
  - preferred_term: mouth mucosa
    term:
      id: UBERON:0003729
      label: mouth mucosa

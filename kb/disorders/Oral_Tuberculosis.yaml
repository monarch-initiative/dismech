    explanation: >-
      Low bacillary load makes acid-fast staining of oral tissue insensitive.
  - reference: PMID:34932768
    reference_title: Primary tuberculosis of the tongue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Photomicrography showing acid-fast bacillus (arrow) inside a multinucleated
      giant cell
    explanation: Bacilli located inside a giant cell of the oral granuloma.
progression:
- phase: Inoculation of the oral tissues
  notes: >-
    Bacilli reach the mouth in sputum through a mucosal break, in the blood, or by
    an unidentified route in primary disease.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oral manifestations of TB occur either due to infected sputum or due to hematogenous
      spread.
    explanation: Review naming the two routes by which bacilli reach the mouth.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most likely route of inoculation is the entry of organisms in the sputum
      and, from there, entry into the mucosal tissue through a small break in the
      surface.
    explanation: Review statement of the sputum route through a mucosal break.
- phase: Chronic non-healing lesion
  notes: >-
    The ulcer or mass persists for weeks to months, enlarges slowly and does not respond
    to conservative treatment; it is often first diagnosed as carcinoma or a traumatic
    ulcer.
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tubercular ulcerations last for a long time showing no tendency to heal, and
      increase slowly in size
    explanation: Review statement on the chronic, slowly enlarging course of the ulcer.
  - reference: PMID:37842328
    reference_title: >-
      Primary Tuberculosis of Buccal and Labial Mucosa: Literature Review and a Rare
      Case Report of a Public Health Menace.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The commonest oral TB lesion is solitary ulceration with undermined edges, usually
      on the tongue, that does not exhibit healing with conservative therapies.
    explanation: A case report's literature review describing the commonest lesion.
- phase: Bone involvement
  notes: >-
    Tuberculous osteomyelitis of the jaw occurs mainly in later stages and carries
    an unfavorable prognosis.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous osteomyelitis frequently occurs in the later stages of the disease
      and has an unfavorable prognosis.
    explanation: >-
      Review statement that jaw osteomyelitis is a late, poor-prognosis manifestation.
- phase: Treatment response and healing
  notes: >-
    Oral lesions heal within weeks to about two months of starting antituberculous
    therapy, without recurrence in reported follow-up.
  evidence:
  - reference: PMID:34932768
    reference_title: Primary tuberculosis of the tongue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sixty days after starting antituberculous therapy, the patient presented with
      complete healing of the oral lesion
    explanation: Complete healing of a tongue ulcer after two months of therapy.
  - reference: PMID:21209722
    reference_title: Primary Oral Tuberculosis as an Indicator of HIV Infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The oral lesions resolved after 4 weeks of antituberculosis treatment.
    explanation: Lesions resolved on therapy in an HIV-infected patient.
  - reference: PMID:33456244
    reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient was later administered antitubercular regime, and within 2 months
      of therapy, the lesion healed
    explanation: A gingival lesion healed within two months of therapy.
  - reference: PMID:29122502
    reference_title: >-
      Clinical and pathologic analyses of tuberculosis in the oral cavity: report
      of 11 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mean follow-up period was 24.9 months, and there was no recurrence.
    explanation: No recurrence in follow-up of the series.
diagnosis:
- name: Biopsy Histopathology
  description: >-
    Biopsy of any persistent oral ulcer or mass is mandatory to confirm the diagnosis
    and to exclude squamous cell carcinoma, the main clinical misdiagnosis. Other
    differentials named in the cited reviews are aphthous, traumatic and syphilitic
    ulcers, lymphoma and metastases. A superficial or non-representative biopsy can
    miss the diagnosis, and a tuberculous lesion has been misread as carcinoma on
    biopsy; about 3% of reported lesions coexist with a carcinoma.
  diagnosis_term:
    preferred_term: histopathology of oral biopsy
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Diagnosis always needs to be confirmed histopathologically.
    explanation: Review statement that histology is required for the diagnosis.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As reported earlier, the most likely clinical diagnosis is that of squamous
      cell carcinoma, in which biopsy is mandatory.
    explanation: >-
      Review statement that squamous cell carcinoma is the main clinical misdiagnosis
      and biopsy is mandatory.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The aphthous ulcers, traumatic ulcers, syphilitic ulcers, and malignancy, including
      primary squamous cell carcinoma, lymphoma, and metastases are the differential
      diagnosis of the tubercular ulcer of the oral cavity.
    explanation: >-
      Review listing the differential diagnoses of the tuberculous oral ulcer.
  - reference: PMID:40503126
    reference_title: >-
      Three Interesting Cases of Primary Oral Tuberculosis Masquerading As Malignancy:
      Case Reports with Review of Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical presentation is indistinguishable from other common oral lesions
      particularly squamous cell carcinoma in adults.
    explanation: Case reports with literature review on the carcinoma mimic.
  - reference: PMID:40503126
    reference_title: >-
      Three Interesting Cases of Primary Oral Tuberculosis Masquerading As Malignancy:
      Case Reports with Review of Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Moreover, one of the patients was also misdiagnosed as squamous cell carcinoma
      on biopsy from a private lab.
    explanation: One of three patients was misdiagnosed as carcinoma on biopsy.
  - reference: PMID:22043432
    reference_title: >-
      Tuberculosis of the tongue clinically masquerading as a neoplasm: a case report
      and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In addition, the diagnosis was missed on the first and initial biopsy as it
      was not representative of the lesion.
    explanation: >-
      A non-representative first biopsy missed the diagnosis of a tongue lesion.
  - reference: PMID:20486998
    reference_title: 'Tuberculosis of the oral cavity: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Carcinomas are found to co-exist in the same lesion site in 3% of patients.
    explanation: Pooled rate of coexisting carcinoma at the lesion site.
- name: Acid-Fast Staining of Tissue
  description: >-
    Ziehl-Neelsen staining of the biopsy supports the diagnosis when positive, but
    it is insensitive in these paucibacillary lesions, so a negative stain does not
    exclude tuberculosis.
  diagnosis_term:
    preferred_term: Ziehl-Neelsen staining of oral tissue
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:

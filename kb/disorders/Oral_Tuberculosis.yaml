    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All three patients showed characteristic necrotizing granulomatous inflammation
      which also demonstrated Mycobacterium tuberculosis on Ziehl Neelsen staining.
    explanation: Necrotizing granulomas with acid-fast bacilli in three primary cases.
- name: Scant acid-fast bacilli
  description: >-
    Oral lesions are paucibacillary: acid-fast smears of oral biopsies are positive
    in only about 7.8%, and Ziehl-Neelsen staining often fails where PCR detects M.
    tuberculosis DNA. Bacilli, when seen, lie within giant cells.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In various studies, AFB smear positivity in a various biopsy specimen of the

pathophysiology:
- name: Active Pulmonary Tuberculosis with Bacilliferous Sputum
  role: trigger
  description: >-
    Active pulmonary tuberculosis produces sputum carrying many bacilli. Most patients
    with secondary oral tuberculosis have pulmonary lesions, and oral disease is usually
    secondary to pulmonary disease.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oral TB manifestations are uncommon and usually secondary to pulmonary changes.
    explanation: Review statement that oral disease usually follows pulmonary disease.
  - reference: PMID:10673784
    reference_title: 'Oral tuberculosis: a clinical evaluation of 42 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

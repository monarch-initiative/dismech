  - reference: PMID:33456244
    reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The diagnosis was made by histopathological examination, polymerase chain reaction
      analysis and Mantoux test.
    explanation: Diagnostic methods used in four primary cases.
- name: Xpert MTB/RIF
  description: >-
    In suspected maxillofacial tuberculosis negative on routine tests, Xpert testing
    was more accurate than routine tests on pus and biopsy samples but performed poorly
    on aspirated cells, including lymph node aspirates.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:

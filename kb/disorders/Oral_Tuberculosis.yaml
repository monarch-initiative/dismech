    explanation: Diagnostic methods recorded across pooled cases.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Systemic antituberculous therapy is required in every patient: isoniazid, rifampicin,
    pyrazinamide and ethambutol daily for two months, then a four-month continuation
    phase. Lesions heal within weeks to about two months. Topical treatment and removal
    of local irritants are only adjuncts.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Inflammation of the Oral Tissues
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli driving the granulomatous lesion, which
      heals.
    evidence:
    - reference: PMID:34932768
      reference_title: Primary tuberculosis of the tongue.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Sixty days after starting antituberculous therapy, the patient presented with
        complete healing of the oral lesion
      explanation: Complete healing of a tongue ulcer after two months of therapy.
    - reference: PMID:33456244
      reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: They were successfully treated with antituberculous treatment.
      explanation: All four primary cases responded to therapy.
  - target: Tuberculous Osteomyelitis of the Jaw
    treatment_effect: INHIBITS
    description: Multidrug therapy is the mainstay of treatment of jaw tuberculosis.
    evidence:
    - reference: PMID:38596155
      reference_title: >-
        Primary Mandibular Tuberculous Osteomyelitis Mimicking Ameloblastoma: A Case
        Report and Literature Review of Mandibular Tuberculous Osteomyelitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: The mainstay of treatment is antitubercular multidrug therapy.
      explanation: A case report's literature review on treatment of jaw tuberculosis.
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anti-tubercular systemic therapy is required in every patient diagnosed with
      oral TB, while topical treatment is only adjuvant.
    explanation: Review statement that systemic therapy is always required.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Currently, the most effective regimens require a combination of 4 drugs ...
      administered daily for the first 2 months, followed by an additional 4 months
      with 3 drugs (INH, RIF and ethambutol).
    explanation: >-
      Review statement of the standard regimen: four drugs (isoniazid, rifampicin,
      pyrazinamide, ethambutol, named in the elided span) for two months, then a four-month
      continuation phase.
  - reference: PMID:35785411
    reference_title: 'Oral and maxillofacial tuberculosis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antituberculosis therapy was used in 244 cases (100.0%) and 5.2% of patients

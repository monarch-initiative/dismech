  - reference: PMID:33456244
    reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: They were successfully treated with antituberculous treatment.
    explanation: All four primary cases responded to therapy.

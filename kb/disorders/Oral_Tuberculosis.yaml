        Clinical and pathologic analyses of tuberculosis in the oral cavity: report
        of 11 cases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Surgery is recommended as the treatment of choice to achieve good clinical

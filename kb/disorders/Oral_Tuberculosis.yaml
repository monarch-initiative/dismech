transmission:
- name: Autoinoculation from bacilliferous sputum
  description: >-
    In secondary oral tuberculosis, bacilli in the patient's own sputum from active
    pulmonary disease enter the oral mucosa through small breaks in its surface. This
    is the most likely and most often cited route.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most likely route of inoculation is the entry of organisms in the sputum
      and, from there, entry into the mucosal tissue through a small break in the
      surface.
    explanation: Review statement of the sputum route through a mucosal break.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      tuberculosis infection may appear as a result of autoinfection from sputum,
      but a hematogenous or lymphatic route of transmission is also possible
    explanation: Review statement of the sputum, blood and lymphatic routes.
  - reference: PMID:33456244
    reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It has been hypothesized that auto-inoculation may occur when the infected pulmonary
      mucus interacts with wounded, susceptible areas of the mucosa, eliciting the
      emergence of lesion.
    explanation: A case series' introduction restating the auto-inoculation hypothesis.
- name: Hematogenous or lymphatic spread from another focus
  description: >-
    Bacilli can reach the oral tissues, and especially the mandible and maxilla, through
    the blood or lymph from another tuberculous focus.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Oral manifestations of TB occur either due to infected sputum or due to hematogenous
      spread.
    explanation: Review naming the two routes by which bacilli reach the mouth.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      tuberculosis infection may appear as a result of autoinfection from sputum,
      but a hematogenous or lymphatic route of transmission is also possible
    explanation: Review statement of the sputum, blood and lymphatic routes.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TB bacilli can spread hematogenously to different parts of the body and this
      also involves maxilla or mandible.
    explanation: Review statement that blood-borne spread reaches the jaws.
- name: Airborne acquisition and, rarely, raw milk
  description: >-
    Tuberculosis is acquired by droplet contact and rarely, for M. bovis, by drinking
    unpasteurized cow's milk. The route of primary oral infection, with no other focus,
    is not established. Patients with possible tuberculosis are isolated until sputum
    smears are negative.
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The microorganisms are transmitted by the droplet contact, rarely by the intake
      of unpasteurized cow's milk infected with Mycobacteria
    explanation: >-
      Review naming droplet spread and, rarely, raw cow's milk as routes of infection.
  - reference: PMID:37842328
    reference_title: >-
      Primary Tuberculosis of Buccal and Labial Mucosa: Literature Review and a Rare
      Case Report of a Public Health Menace.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The exact mechanism of primary inoculation remains obscure, although it has
      been proposed that chronic inflammation or traumatic episodes may be the most
      likely factors to breach the integrity of the oral mucosa
    explanation: >-
      A case report's literature review on how the mucosa is breached in primary disease.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients with possible TB should be isolated until sputum smears are negative.
    explanation: Review recommendation on isolation.
has_subtypes:
- name: Secondary
  display_name: Secondary oral tuberculosis
  classification: clinical_form
  description: >-
    Oral tuberculosis in a patient with active tuberculosis elsewhere, usually pulmonary,
    attributed to sputum inoculation of the mucosa or to blood-borne spread. It is
    the commoner form (58% of pooled cases), affects mainly middle-aged and older
    people, and typically presents as a painful, irregular ulcer with undermined edges,
    often at a site of trauma.
  evidence:
  - reference: PMID:20486998
    reference_title: 'Tuberculosis of the oral cavity: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It was found as a secondary infection in 58% (54% pulmonary, 4% extrapulmonary)
      of patients and as a primary infection in 42% of patients.
    explanation: >-
      Pooled share of primary and secondary oral tuberculosis in the systematic review.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Secondary oral TB usually coexists with pulmonary disease, may occur in all
      age groups; however, middle-aged and older people are more likely involved.
    explanation: Review statement on secondary oral tuberculosis.
  - reference: PMID:10673784
    reference_title: 'Oral tuberculosis: a clinical evaluation of 42 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 79.4% patients with secondary disease had pulmonary lesions, 15 of
      whom showed clinical and radiological signs of activity
    explanation: Most secondary cases had pulmonary lesions.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This form of the disease usually appears in children, whereas the secondary
      form is most commonly observed in the middle-aged and elderly
    explanation: Review statement of the age distribution of the two forms.
- name: Primary
  display_name: Primary oral tuberculosis
  classification: clinical_form
  description: >-
    Oral tuberculosis with no detectable tuberculosis elsewhere (42% of pooled cases
    in otherwise uncompromised patients). Reviews describe it in children and younger
    patients, predominantly on the gingiva or buccal mucosa, as a painless ulcer or
    proliferative lesion with enlarged regional lymph nodes and rarely with systemic
    symptoms. Case series show that it also occurs in older adults, and chest imaging
    is normal, so the diagnosis rests on biopsy.
  evidence:
  - reference: PMID:20486998
    reference_title: 'Tuberculosis of the oral cavity: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It was found as a secondary infection in 58% (54% pulmonary, 4% extrapulmonary)
      of patients and as a primary infection in 42% of patients.
    explanation: >-
      Pooled share of primary and secondary oral tuberculosis in the systematic review.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Primary lesions are uncommon, seen in younger patients often associated with
      enlarged cervical lymph nodes.
    explanation: >-
      Review statement on the age and nodal involvement of primary oral tuberculosis.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, primary oral tuberculosis, which is less common, appears predominantly
      on the gingival or buccal mucosa
    explanation: Review statement of the usual sites of primary disease.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In primary TB, a non-painful ulcer is accompanied by the local (submandibular,
      submental and cervical) lymph nodes enlargement
    explanation: >-
      Review statement that the primary ulcer is painless and comes with regional
      node enlargement.
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Systemic symptoms rarely appear in the primary oral tuberculosis
    explanation: Review statement that primary disease rarely causes systemic symptoms.
  - reference: PMID:18442734
    reference_title: 'Primary oral tuberculosis: a case series from Bucharest, Romania.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      although primary oral TB was previously considered a disease of the young, these
      cases demonstrate that it may occur in subjects of all ages.
    explanation: >-
      A primary-disease case series showing that the form is not confined to the young.
  - reference: PMID:34932768
    reference_title: Primary tuberculosis of the tongue.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Neither chest imaging alterations nor other signals of pulmonary or systemic
      involvement were observed.
    explanation: A primary tongue case with normal chest imaging.
prevalence:
- population: Patients with tuberculosis
  measure_type: UNKNOWN
  notes: >-
    Reviews put oral tuberculosis at about 0.5-1% of all tuberculosis cases, and a
    case series' introduction gives 0.1-0.4%. These are shares of tuberculosis cases,
    not population rates, so no rate or band is asserted.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although oral TB is supposed to be a rare occurrence, it still accounts for
      0.5–1% of all tubercular cases.
    explanation: Review estimate of the share of tuberculosis cases with oral disease.
  - reference: PMID:33456244
    reference_title: 'Primary oral tuberculosis: A case series of a rare disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: The incidence of oral TB is only 0.1%–0.4%.
    explanation: A case series' introduction restating a lower estimate.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Oral tuberculosis is usually a localized, curable lesion, but it is painful, interferes
    with eating, is often first mistaken for carcinoma, and in about half of reported
    cases marks previously unknown systemic tuberculosis. In a systematic review of
    301 pooled oral and maxillofacial cases 5.2% of patients died, and tuberculous
    osteomyelitis of the jaw is a late manifestation with an unfavorable prognosis.
  evidence:
  - reference: PMID:35785411
    reference_title: 'Oral and maxillofacial tuberculosis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antituberculosis therapy was used in 244 cases (100.0%) and 5.2% of patients
      died.
    explanation: >-
      All treated cases received antituberculous therapy; 5.2% of the pooled patients
      died.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous osteomyelitis frequently occurs in the later stages of the disease
      and has an unfavorable prognosis.
    explanation: >-
      Review statement that jaw osteomyelitis is a late, poor-prognosis manifestation.
  - reference: PMID:20486998
    reference_title: 'Tuberculosis of the oral cavity: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In approximately 50% of patients, an oral manifestation of TB has led to the
      diagnosis of a previously unknown systemic infection, which resulted in a timely
      and effective treatment.
    explanation: >-
      The oral lesion was the route to diagnosing systemic tuberculosis in about half
      of pooled cases.
environmental:
- name: HIV infection
  description: >-
    HIV infection is a recorded predisposing condition. Oral tuberculosis can be the
    presenting sign of HIV infection, and in an 18-patient HIV series the palate and
    tongue were most affected.
  influences_mechanisms:
  - target: Caseating Granulomatous Inflammation of the Oral Tissues
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired cellular immunity predisposes to active tuberculosis including oral
      disease; the cited sources do not tie it to a specific step. In AIDS the granulomas
      may lack caseation.
    evidence:
    - reference: PMID:31143712
      reference_title: Oral tuberculosis - Current concepts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Immunocompromised states, such as HIV, diabetes mellitus, malnutrition, malignancies
        prolonged corticosteroids therapy, and chronic renal failure, may also pose
        a threat to the development of TB.
      explanation: Review list of immunocompromising risk factors.
    - reference: PMID:31143712
      reference_title: Oral tuberculosis - Current concepts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        However, in immunocompromised conditions such as acquired immunodeficiency
        syndrome, there may be a noncaseating granuloma.
      explanation: Review caveat that granulomas may lack caseation in AIDS.
  evidence:
  - reference: PMID:21209722
    reference_title: Primary Oral Tuberculosis as an Indicator of HIV Infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We present a case of primary oral tuberculosis that led to the diagnosis of
      HIV infection.
    explanation: A primary oral lesion was the presenting sign of HIV infection.
  - reference: PMID:16037775
    reference_title: >-
      Tuberculosis affecting the oral cavity in Brazilian HIV-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients with HIV and nonhealing oral lesions or papillomatous masses in the
      oral mucosa should be screened for the presence of pulmonary tuberculosis.
    explanation: Conclusion of an 18-patient HIV series.
  - reference: PMID:16037775
    reference_title: >-
      Tuberculosis affecting the oral cavity in Brazilian HIV-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The most affected sites were palate and tongue.
    explanation: Sites in 18 HIV-infected patients.

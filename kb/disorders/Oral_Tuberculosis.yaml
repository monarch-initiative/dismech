      such as persistent cough, hemoptysis, fever, weight loss, anorexia, and lymphadenopathy
    explanation: >-
      A case report's literature review listing the constitutional features of active
      tuberculosis.
- name: Caseating granulomatosis
  description: >-
    Caseating epithelioid granulomas with Langhans giant cells in the oral biopsy,
    the basis of most diagnoses; granulomatous inflammation was reported in 63.1%
    of pooled cases, and granulomas may lack caseation in AIDS.
  phenotype_term:
    preferred_term: Caseating granulomatosis
    term:
      id: HP:5210339
      label: Caseating granulomatosis
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Typically, histopathology of the biopsy specimen shows a classical caseating
      granuloma with central necrosis and is surrounded by epithelioid cells, Langhan's
      type of giant cells, and lymphocytes infiltration.
    explanation: Review description of the classical biopsy histology.
  - reference: PMID:35785411
    reference_title: 'Oral and maxillofacial tuberculosis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histopathological analysis showed a granulomatous inflammation in most cases
      (n = 156/63.1%).
    explanation: Granulomatous inflammation in 63.1% of pooled biopsies.
histopathology:
- name: Caseating epithelioid granulomas
  description: >-
    Granulomas with central caseous necrosis surrounded by epithelioid cells, Langhans-type
    giant cells and lymphocytes; in immunocompromised patients, including those with
    AIDS, the granulomas may lack caseation.
  evidence:
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Typically, histopathology of the biopsy specimen shows a classical caseating
      granuloma with central necrosis and is surrounded by epithelioid cells, Langhan's
      type of giant cells, and lymphocytes infiltration.
    explanation: Review description of the classical biopsy histology.
  - reference: PMID:31143712
    reference_title: Oral tuberculosis - Current concepts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, in immunocompromised conditions such as acquired immunodeficiency syndrome,
      there may be a noncaseating granuloma.
    explanation: Review caveat that granulomas may lack caseation in AIDS.
  - reference: PMID:40503126
    reference_title: >-

    reference_title: >-
      Rapid diagnosis of oral tuberculosis by amplification of Mycobacterium DNA from
      paraffin embedded specimens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In all specimens that were Ziehl-Neelsen negative, M. tuberculosis DNA was detected

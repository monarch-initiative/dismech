      assays, and skin testing.
    explanation: The series' conclusion on the diagnostic work-up.
- name: Mycobacterial Culture
  description: >-
    Culture of the lesion and of sputum is the definitive proof of infection but takes
    weeks; culture confirmed all cases in an HIV series.
  diagnosis_term:
    preferred_term: mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:26366156
    reference_title: 'Tuberculosis of the oral cavity: an uncommon but still a live
      issue.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Microbiological culture of sputum and of the material taken from the surface
      of the oral lesion should be done, but the results are obtained after 10 weeks
    explanation: Review recommendation of culture, with its slow turnaround.
  - reference: PMID:16037775
    reference_title: >-
      Tuberculosis affecting the oral cavity in Brazilian HIV-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All patients had culture confirming tuberculosis.
    explanation: Culture confirmed all 18 cases in the HIV series.
  - reference: PMID:29122502
    reference_title: >-
      Clinical and pathologic analyses of tuberculosis in the oral cavity: report
      of 11 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pathology, acid-fast staining, polymerase chain reaction, and DNA testing for
      Mycobacterium tuberculosis are useful for final diagnosis.
    explanation: The series' conclusion on confirmatory tests.
- name: PCR for Mycobacterium tuberculosis DNA
  description: >-
    PCR on fresh or paraffin-embedded tissue detects M. tuberculosis when staining

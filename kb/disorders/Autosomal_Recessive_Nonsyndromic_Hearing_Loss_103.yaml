- name: Autosomal recessive
  description: >-
    Biallelic CLIC5 variants: homozygous in the consanguineous Turkish founding family and
    in the Siberian founder cohort, compound heterozygous in the non-consanguineous
    Cameroonian family where each unaffected relative carried one of the two alleles.

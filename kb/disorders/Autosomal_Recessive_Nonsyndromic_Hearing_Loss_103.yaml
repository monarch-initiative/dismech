name: Autosomal Recessive Nonsyndromic Hearing Loss 103
category: Mendelian
creation_date: "2026-08-28T00:00:00Z"
synonyms:
- DFNB103
- CLIC5 autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness 103
- deafness, autosomal recessive 103
- autosomal recessive nonsyndromic deafness caused by mutation in CLIC5
- autosomal recessive deafness 103
description: >-
  DFNB103 is progressive, postlingual autosomal recessive sensorineural hearing loss
  caused by biallelic loss of CLIC5, often accompanied by vestibular involvement, though
  not in every reported individual. It is not a congenital profound deafness: hearing
  begins mild in early childhood and deteriorates to severe or profound over the second
  and third decades, and vestibular areflexia, when present, tends to appear later still.

  CLIC5 is not a chloride channel in any functionally relevant sense here. It is a member
  of the chloride intracellular channel family that behaves as a cytoskeletal adaptor, and
  it occupies a very specific address: the taper region at the base of the stereocilium,
  not the tip. There it sits in an approximately one-to-one stoichiometry with radixin and
  works with taperin, PTPRQ and myosin VI to pin the plasma membrane to the underlying
  actin core. The mechanism this entry curates is the failure of that pinning.

  What follows from a base-of-bundle adhesion defect is different from what follows from a
  tip defect, and the mouse shows it. Stereocilia in CLIC5-deficient mice do not simply
  shorten; they fuse with one another from postnatal day 10 onwards, and radixin, taperin
  and PTPRQ disperse out of the taper region rather than staying put - PTPRQ and radixin
  already before fusion is visible, which is what makes the mislocalisation causal rather
  than a consequence of the fusion. Loss of a membrane-to-actin tether at the base lets
  adjacent membranes come together.

  DFNB103 was defined in one Turkish family in 2015 and confirmed in a Cameroonian family
  in 2020, and until 2026 those were the only two. A founder truncating variant has since
  been found homozygous in 22 patients from 16 unrelated families in the Sakha Republic of
  Eastern Siberia, accounting for about one in ten GJB2-negative hearing loss patients
  there and traced to a single origin about 2,500 years ago. The disease went from an
  ultra-rare curiosity to a population-level cause in one region.

  There is now a proof of concept for treatment. Inner ear delivery of wild-type Clic5 by
  adeno-associated virus in neonatal Clic5-null mice prevented stereocilia fusion,
  restored radixin localisation, improved hair cell survival and rescued both auditory and
  vestibular function. Two features of that result are worth holding onto: the vestibular
  rescue was durable to 12 weeks while auditory thresholds drifted back up despite
  transgene expression remaining robust, and the injections were done at postnatal day 0,
  well before the mouse phenotype begins - neither of which maps cleanly onto a human
  disease that declares itself in childhood.

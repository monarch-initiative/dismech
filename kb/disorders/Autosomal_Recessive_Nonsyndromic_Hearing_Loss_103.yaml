    A hearing-loss multigene panel or genomic testing can identify biallelic pathogenic or likely pathogenic
    CLIC5 variants. Establish phase and assess deletion/duplication coverage where needed; a variant of uncertain
    significance alone is not diagnostic. Postlingual onset, vestibular signs or prior GJB2 exclusion are not
    prerequisites. In the Sakha population, the founder allele can inform locally appropriate testing, while
    a negative targeted test does not exclude other CLIC5 alleles or hearing-loss genes.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf

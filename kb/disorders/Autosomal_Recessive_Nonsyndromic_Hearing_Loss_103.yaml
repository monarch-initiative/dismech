inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic CLIC5 variants: homozygous in the consanguineous Turkish founding family and in the Siberian
    founder cohort, compound heterozygous in the non-consanguineous Cameroonian family where each unaffected
    relative carried one of the two alleles. For two confirmed heterozygous parents, each pregnancy has a 25%
    chance of inheriting both familial pathogenic alleles, a 50% carrier chance and a 25% chance of inheriting
    neither. Individual onset and severity are not predicted by this Mendelian ratio.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis of CLIC5 revealed a homozygous nonsense mutation c.96T>A (p.(Cys32Ter)) that segregated with the hearing loss."
    explanation: >-
      Homozygosity in the affected siblings of a consanguineous pedigree, with segregation
      through the family, which is the recessive pattern.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three affected individuals were compound heterozygous for both variants, and all unaffected individuals were heterozygous for one of the two variants."
    explanation: >-
      The three affected siblings carried the two variants in trans, while tested unaffected relatives carried
      one variant.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic
      variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance
      of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being
      a carrier.
    explanation: >-
      General autosomal recessive hearing-loss counseling, conditional on parental carrier status; not a DFNB103
      penetrance estimate.
pathophysiology:
- name: CLIC5 Loss of Function
  description: >-
    Biallelic CLIC5 variants impair protein function through allele-dependent mechanisms. The Turkish p.Cys32Ter
    allele predicts early truncation, but nonsense-mediated RNA decay was not confirmed in patient lymphoblastoid
    cells. The Cameroonian c.63+1G>A donor variant has a predicted, untested splicing effect; p.Leu75Pro shows
    increased abundance and perinuclear aggregation after ectopic expression in HEK293 cells. These observations
    do not establish complete absence of protein for every human allele. The Siberian p.Trp215Ter allele is
    another truncating variant.
  biological_scale: MOLECULAR

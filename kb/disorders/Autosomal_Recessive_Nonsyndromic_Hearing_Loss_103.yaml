    snippet: "Mutation analysis of CLIC5 revealed a homozygous nonsense mutation c.96T>A (p.(Cys32Ter)) that segregated with the hearing loss."
    explanation: >-
      The founding nonsense allele, which truncates the protein at codon 32, and its
      segregation with the phenotype.
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In silico analysis showed that the missense variant CLIC5-p.(L75P) substitutes a highly conserved amino acid residue (leucine), and is expected to alter the stability, the structure, and the function of the CLIC5 protein, while the splicing variant CLIC5-(c.63+1G>A) is predicted to disrupt a consensus donor splice site and alter the splicing of the pre-mRNA."
    explanation: The predicted consequences of the second family's compound heterozygous pair.
  - reference: PMID:36035115
    reference_title: "Cell-based analysis of CLIC5A and SLC12A2 variants associated with hearing impairment in two African families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant CLIC5A protein appears as aggregated perinuclear bodies while the wild-type protein was evenly distributed in the cytoplasm."
    explanation: >-
      Functional confirmation that the missense allele mislocalises, so the human allelic
      spectrum is uniformly loss of function rather than mixed.
  - reference: PMID:36035115
    reference_title: "Cell-based analysis of CLIC5A and SLC12A2 variants associated with hearing impairment in two African families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, cells transfected with the wild-type CLIC5A formed thin membrane filopodia-like protrusions which were absent in the CLIC5A mutant expressing and control cells."
    explanation: >-
      A membrane-protrusion assay in which the mutant behaves like empty vector, which is
      the closest cell-based analogue of the stereocilia phenotype.
- name: Loss of Membrane-Actin Tethering at the Stereocilia Taper
  description: >-
    CLIC5 concentrates at the base of hair cell stereocilia, in the taper region, and not
    at the tips. Mass spectrometry of chicken utricle stereocilia puts it there at roughly
    a one-to-one molar ratio with radixin, and biochemical assays show it interacts with
    ezrin-radixin-moesin proteins, with taperin and possibly with myosin VI. The proposed
    job of the complex is to hold the plasma membrane against the underlying actin core at
    the point where the stereocilium narrows.

    In CLIC5-deficient mice, radixin immunostaining at the bundle is reduced, and radixin,
    taperin and PTPRQ are all mislocalised in fused stereocilia. The timing is what makes
    this the primary lesion rather than a byproduct: PTPRQ and radixin are already
    dispersed before any fusion is visible. The dependency also runs the other way, since
    CLIC5 and radixin fail to localise properly in myosin VI mutant mice, so the complex is
    mutually stabilising rather than hierarchical.

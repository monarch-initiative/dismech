genetic:
- name: CLIC5
  notes: >-
    Biallelic CLIC5 nonsense, missense and canonical splice-donor variants are reported. p.Cys32Ter predicts
    early truncation, but patient lymphoblastoid-cell assays did not confirm nonsense-mediated decay. p.Leu75Pro
    is retained and mislocalized in a heterologous cell assay; c.63+1G>A has a computationally predicted splicing
    effect affecting the short isoforms rather than every CLIC5 transcript. Neither assay establishes a uniform
    dosage-null mechanism.

    The Siberian founder allele has equivalent transcript descriptions: NM_016929.5:c.644G>A (NP_058625.2:p.Trp215Ter)
    and NM_001114086.2:c.1121G>A (NP_001107558.1:p.Trp374Ter), mapped by ClinVar to GRCh38 chr6:45903200C>T.
    The 2019 and 2026 reports must not be added as independent case counts. The later genome-wide haplotype
    analysis supports common origin, with an estimated founder age of approximately 2,500 years. Direct human
    modifiers and population-wide penetrance estimates are not established.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, our results show that CLIC5 is a novel arNSHI gene involved in progressive hearing impairment, vestibular and possibly mild renal dysfunction in a family of Turkish origin."
    explanation: >-
      The founding gene-disease conclusion, including the authors' own hedged renal
      observation.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three affected individuals were compound heterozygous for both variants, and all unaffected individuals were heterozygous for one of the two variants."
    explanation: >-
      The three affected siblings carried the two variants in trans, while tested unaffected relatives carried
      one variant.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The haplotype analysis based on the 730,000 whole genome SNP-markers indicates common origin of all studied mutant chromosomes."
    explanation: The haplotype evidence establishing the Siberian allele as a single founder event.
    quote_role: PRIMARY_RESULT
diagnosis:

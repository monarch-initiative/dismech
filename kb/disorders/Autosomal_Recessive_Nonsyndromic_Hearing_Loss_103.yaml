    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of homozygous for c.1121G>A patients (19 out of 26) reported about late onset of their hearing loss occurred in postlingual period (averaged 9.7±0.6 years)."
    explanation: >-
      The denominator behind the frequency grade: 19 of 26 homozygotes, which is 73 percent
      and so FREQUENT rather than VERY_FREQUENT.
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hearing loss in individuals with pathogenic variants in the CLIC5 gene is not congenital but emerges in early childhood, before the second decade of life, while vestibular areflexia, if present, generally develops later"
    explanation: >-
      The non-congenital onset stated explicitly, together with the later timing of the
      vestibular component. Graded OTHER rather than HUMAN_CLINICAL: this is a mouse AAV
      study, and the sentence is its introduction restating human findings it cites from
      Seco 2015 and Wonkam-Tingang 2020 rather than data it generated.
- name: Vestibular Areflexia
  category: Vestibular
  description: >-
    Absent vestibular responses accompany the hearing loss in the founding family, and
    vestibular dysfunction is the other half of the CLIC5 phenotype in every species where
    it has been looked for. It is described as developing later than the hearing loss, and
    it is not documented in every reported family, so it is neither obligate nor
    incidental.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Vestibular areflexia
    term:
      id: HP:0008568
      label: Vestibular areflexia
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired hearing is accompanied by vestibular areflexia and in one of the patients with mild renal dysfunction."
    explanation: The vestibular finding in the founding family, with the renal observation alongside it.
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in the CLIC5 gene, encoding Chloride Intracellular Channel 5, have been found to cause autosomal recessive hearing loss in humans, along with vestibular dysfunction, observed in some individuals and a related mouse model"
    explanation: >-
      Graded PARTIAL because it qualifies the frequency claim rather than supporting it -
      vestibular dysfunction is observed in some individuals, not all, which is why this
      phenotype is FREQUENT rather than OBLIGATE.

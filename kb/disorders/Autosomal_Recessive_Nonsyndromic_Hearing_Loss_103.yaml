treatments:
- name: Genetic Counselling with Audiologic and Vestibular Surveillance
  description: >-
    Counselling for a recessive condition with a 25 percent sibling recurrence risk, and
    scheduled follow-up rather than a single assessment. Surveillance is the substantive
    part here: hearing is not congenitally impaired, newborn screening can be passed, and
    the loss then declines by several decibels per year, so a normal early audiogram is not
    a discharge. Vestibular testing is worth including because areflexia develops later
    than the hearing loss and is often asymptomatic.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In average the patients with DFNB103 lost 7.4 ± 13.65 dB on the speech frequency range in pure tone averages (PTA0.5,1.0,2.0,4.0 kHz) per year until reaching profound deafness in the second or third decade of the life."
    explanation: >-
      The quantified rate of decline, which is what makes scheduled rather than one-off
      audiometry the right recommendation.
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hearing loss in individuals with pathogenic variants in the CLIC5 gene is not congenital but emerges in early childhood, before the second decade of life, while vestibular areflexia, if present, generally develops later"
    explanation: >-
      The two-stage natural history that determines what surveillance should look for and
      when. Graded OTHER: the sentence is this mouse study's introduction restating human
      findings from papers it cites, not evidence the study produced.
  notes: >-
    No DFNB103-specific report of hearing amplification, cochlear implantation or
    vestibular rehabilitation was found in the reviewed literature, so none is curated here
    even though all three are standard in progressive severe-to-profound sensorineural
    hearing loss with vestibular failure. This is a deliberate scoping decision rather than
    a judgement that they are inappropriate. Gene replacement is likewise not curated as a
    treatment: the AAV work is preclinical and is recorded under animal_models, where its
    limitations can be stated alongside it.
animal_models:
- name: Clic5 jitterbug mouse
  species: Mouse
  genotype: Clic5 jbg/jbg, 97 bp intragenic deletion causing exon 5 skipping
  publication: PMID:17021174
  description: >-
    The founding model and the reason CLIC5 was a candidate gene at all. jitterbug is a
    spontaneous recessive mutation, a 97 base pair intragenic deletion that causes exon 5
    skipping with a frameshift and premature stop; western blot and immunohistochemistry
    confirm the protein is absent. Homozygotes have impaired hearing and vestibular
    dysfunction, dysmorphic stereocilia and progressive hair cell degeneration, and reduced
    radixin staining in the hair bundle. The 2014 follow-up on the same line established
    the fusion phenotype and the mislocalisation of radixin, taperin and PTPRQ.
  genes:
  - preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  modeled_mechanisms:
  - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This is where the mechanism was established. Stereocilia taper composition cannot be
      examined in living patients, so the jitterbug mouse is not corroborating a human
      observation; it is where the tethering claim was tested in the first place, and
      tested in both directions, since CLIC5 and radixin also fail to localise in myosin VI
      mutants. It is not the only mouse bearing on the claim - the independent Clic5-null
      line used in the 2025 gene-therapy study shows the same radixin dependence, and is
      curated separately below.
    limitations: >-
      A protein-null allele produced by exon skipping, against a human spectrum of
      nonsense, splice and missense alleles; the human missense allele in particular has
      residual protein that mislocalises rather than being absent, so it is not
      biochemically equivalent. The molecular partners were characterised partly in chicken
      and rat vestibular tissue rather than in mouse cochlea, so the complex is assembled
      from evidence across three species.
    readouts:
    - name: Radixin immunostaining in hair bundles
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: DECREASED
      interpretation: >-
        The partner protein is lost from the bundle when CLIC5 is absent, which is the
        direct evidence that CLIC5 holds the complex in place.
      evidence:
      - reference: PMID:17021174
        reference_title: "The chloride intracellular channel protein CLIC5 is expressed at high levels in hair cell stereocilia and is essential for normal inner ear function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Radixin immunostaining appeared reduced in hair bundles of jbg mutant mice."
        explanation: The immunolocalisation measurement behind this readout.
    - name: Taper-region localisation of radixin, taperin and PTPRQ
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: ALTERED
      interpretation: >-
        Three partners disperse out of the taper region, two of them before fusion is
        visible, so the complex disassembles first and the structure fails afterwards.
      evidence:
      - reference: PMID:24285636
        reference_title: "CLIC5 stabilizes membrane-actin filament linkages at the base of hair cell stereocilia in a molecular complex with radixin, taperin, and myosin VI."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Radixin (RDX), protein tyrosine phosphatase receptor Q (PTPRQ), and taperin (TPRN), deafness-associated proteins that also concentrate at the base of stereocilia, were mislocalized in fused stereocilia of jbg mice."
        explanation: The mislocalisation of all three taper proteins in the null.
    evidence:
    - reference: PMID:17021174
      reference_title: "The chloride intracellular channel protein CLIC5 is expressed at high levels in hair cell stereocilia and is essential for normal inner ear function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice homozygous for a new spontaneous recessive mutation of the Clic5 gene, named jitterbug (jbg), exhibit impaired hearing and vestibular dysfunction."
      explanation: >-
        The phenotype that makes the model informative, and the same two-system involvement
        seen in patients.
  - target: Progressive Stereocilia Fusion and Bundle Distortion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Fusion from postnatal day 10 with progressive worsening, which is the structural
      lesion this node describes and which no human material shows.
    limitations: >-
      The mouse time course is compressed relative to the human one - days to weeks against
      years - so the model reproduces the sequence of events but not their tempo. Whether
      the human loss reflects fusion at all is inference from the shared gene and shared
      progressive phenotype, since no human cochlear histology exists.
    readouts:
    - name: Stereocilia fusion by scanning electron microscopy
      target: Progressive Stereocilia Fusion and Bundle Distortion
      direction: INCREASED
      interpretation: Adjacent stereocilia progressively fuse from postnatal day 10 onwards.
      evidence:
      - reference: PMID:24285636
        reference_title: "CLIC5 stabilizes membrane-actin filament linkages at the base of hair cell stereocilia in a molecular complex with radixin, taperin, and myosin VI."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Confocal and scanning electron microscopy of CLIC5-deficient jitterbug (jbg) mice revealed progressive fusion of stereocilia as early as postnatal day 10."
        explanation: The structural measurement and its onset.
    evidence:
    - reference: PMID:17021174
      reference_title: "The chloride intracellular channel protein CLIC5 is expressed at high levels in hair cell stereocilia and is essential for normal inner ear function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological analysis of mutant inner ears revealed dysmorphic stereocilia and progressive hair cell degeneration."
      explanation: The histological phenotype, including its progressive character.
  evidence:
  - reference: PMID:17021174
    reference_title: "The chloride intracellular channel protein CLIC5 is expressed at high levels in hair cell stereocilia and is essential for normal inner ear function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The jbg mutation is a 97 bp intragenic deletion that causes skipping of exon 5, which creates a translational frame shift and premature stop codon."
    explanation: >-
      The molecular lesion, of the same truncating class as the human founder and founding
      alleles, which is what makes this model genetically comparable.
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The orthologous mouse gene is mutated in the jitterbug mutant that exhibits progressive hearing impairment and vestibular dysfunction."
    explanation: >-
      The human authors' own use of the mouse as the prior that made CLIC5 a credible
      candidate, so the model preceded and enabled the human discovery. Graded OTHER
      because the sentence reports neither this human study's clinical data nor a mouse
      experiment it ran - it is a citation of prior mouse work inside a human paper.
- name: Clic5 knockout mouse treated with inner ear AAV
  species: Mouse
  genotype: Clic5 null, homozygous, treated at postnatal day 0 with AAV2/9-PHP.B carrying wild-type Clic5
  publication: PMID:40859056
  description: >-
    A gene-replacement experiment in a Clic5-null line with a well-characterised baseline:
    untreated homozygotes have auditory brainstem response thresholds shifted by about
    40 dB at 4 weeks and no response at 8 weeks, circling behaviour from 4 weeks, and
    cochlear hair cell changes beginning between postnatal days 14 and 17. Utricle
    injection at postnatal day 0 of either a single-stranded or a self-complementary vector
    restored CLIC5 to the base of the stereocilia, normalised radixin localisation,
    prevented fusion and elongation, improved hair cell survival, and rescued auditory and
    vestibular function. The self-complementary vector achieved equivalent rescue at a
    titre an order of magnitude lower.
  genes:
  - preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  modeled_mechanisms:
  - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The strongest available test of the tethering mechanism, because it runs the
      experiment forwards: restoring the protein restores its partner's localisation and
      prevents the structural failure. That is a stronger claim than any correlation
      between absence and phenotype.
    limitations: >-
      Treatment was given at postnatal day 0, before the mouse lesion begins between
      postnatal days 14 and 17, so this establishes prevention rather than reversal. Human
      DFNB103 is diagnosed after hearing loss has begun, typically around age 8, which is
      the equivalent of treating well after the mouse window has closed - the experiment
      does not address that situation. The rescue was also incomplete and unstable in the
      auditory system: treated thresholds remained significantly worse than controls at
      12 weeks and deteriorated over time, particularly at high frequencies.
    readouts:
    - name: Radixin localisation after CLIC5 restoration
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: RESTORED
      interpretation: >-
        Restoring CLIC5 restores its partner to the taper region, closing the causal loop
        between the adaptor and the complex.
      evidence:
      - reference: PMID:40859056
        reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Restoring CLIC5 expression also appears to normalize the localization of RDX, emphasizing CLIC5's vital role in hair cell function."
        explanation: The partner-relocalisation readout after gene replacement.
    - name: Stereocilia morphology after treatment
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: RESTORED
      interpretation: >-
        Bundle morphology is held at normal rather than merely deteriorating more slowly:
        the fusion and elongation that follow loss of the tether do not occur.
      evidence:
      - reference: PMID:40859056
        reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This restoration prevents the fusion and elongation of stereocilia and improves hair cell survival."
        explanation: The structural and survival outcome of the rescue.
    evidence:
    - reference: PMID:40859056
      reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report a robust restoration of CLIC5 expression using either construct, including prevention of morphological degeneration and preserving auditory and vestibular function."
      explanation: The headline rescue result establishing the link's relevance to this node.
  - target: Progressive Hair Cell Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The untreated arm characterises the degeneration this node describes, in both the
      cochlea and the utricle, with a defined onset window between postnatal days 14 and
      17 and no abnormality before that.
    limitations: >-
      Only partial with respect to the human disease, because the mouse loses hearing
      entirely by 8 weeks whereas patients decline over one to two decades. The vestibular
      phenotype is also more prominent in the mouse, where circling and hyperactivity are
      the defining behavioural signs, than in patients, where areflexia may be absent and
      is often asymptomatic when present.
    readouts:
    - name: Auditory brainstem response threshold in untreated nulls
      target: Progressive Hair Cell Degeneration
      direction: INCREASED
      interpretation: >-
        Thresholds rise, so the direction is INCREASED even though hearing falls: a shift

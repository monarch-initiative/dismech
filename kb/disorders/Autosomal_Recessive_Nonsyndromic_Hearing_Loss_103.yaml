animal_models:
- name: Clic5 jitterbug mouse
  species: Mouse
  genotype: Clic5 jbg/jbg, 97 bp intragenic deletion causing exon 5 skipping
  publication: PMID:17021174
  description: >-
    The spontaneous C3H/HeJ jitterbug allele deletes 97 genomic bases, causing exon 5 skipping, frameshift
    and premature termination. Protein is undetectable by the reported assays. Mutants develop hearing and
    vestibular dysfunction, abnormal stereocilia and later hair-cell degeneration. The 2014 follow-up defines
    membrane lifting, fusion and altered partner localization. Cochlear supporting structures such as Reissner's
    membrane and stria vascularis were preserved in the original histology, arguing against a primary endolymph-volume
    phenotype.
  genes:
  - preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  modeled_mechanisms:
  - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Jitterbug mice support a role for CLIC5 in membrane-cytoskeletal attachment through membrane lifting,
      altered radixin/PTPRQ localization and subsequent bundle fusion. The exact direct molecular contacts
      remain unresolved.
    limitations: >-
      A functionally protein-null deletion does not reproduce every human allele. Biochemical interactions
      were measured partly in epithelial-cell constructs and mouse lung, while protein abundance and localization
      also used rat and chicken hair bundles; these are not a purified native human hair-cell complex.
    readouts:
    - name: Radixin immunostaining in hair bundles
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: DECREASED
      interpretation: >-
        Reduced radixin immunostaining supports a localization or stability dependence on CLIC5; it does not
        prove total loss of radixin or direct binding.
      evidence:
      - reference: PMID:17021174
        reference_title: "The chloride intracellular channel protein CLIC5 is expressed at high levels in hair cell stereocilia and is essential for normal inner ear function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Radixin immunostaining appeared reduced in hair bundles of jbg mutant mice."
        explanation: The immunolocalisation measurement behind this readout.
        quote_role: PRIMARY_RESULT
    - name: Taper-region localisation of radixin, taperin and PTPRQ
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: ALTERED
      interpretation: >-
        Radixin and PTPRQ dispersal precedes visible fusion, whereas taperin mislocalization occurs later.
        Temporal ordering does not identify a single initiating interaction.

    snippet: "In the vestibular system, vestibular hair cells (VHCs) of the utricle displayed elongated hair bundles as early as P15, and by P17, thickened hair bundles were also observed"
    explanation: The vestibular structural counterpart and its onset in an independent Clic5-null line.
- name: Progressive Hair Cell Degeneration
  description: >-
    Hair cells are lost after the bundles fail. The founding mouse description reports
    dysmorphic stereocilia together with progressive hair cell degeneration, and the
    vestibular hair cell count in Clic5-null mice is reduced by 12 weeks. Because
    degeneration follows rather than accompanies the structural lesion, there is a period
    in which cells are still present with damaged bundles, and that interval is where the
    gene therapy result sits.

- name: Progressive Stereocilia Fusion and Bundle Distortion
  description: >-
    CLIC5-deficient hair cells develop membrane lifting, stereocilia fusion and bundle distortion. In the jitterbug
    deletion line, early bundle abnormalities precede inner-hair-cell fusion at approximately P10; outer-hair-cell
    fusion becomes prominent after P14 and is more severe basally. In the ENU-induced nmf318 missense model
    used for AAV therapy, cochlear morphology appeared unchanged at P14 but fusion was present at P17, with
    inner hair cells affected across regions and outer-hair-cell fusion more severe apically. Utricular bundles
    were elongated at P15 and thickened by P17. These line- and assay-specific patterns cannot be converted
    into a human treatment window.

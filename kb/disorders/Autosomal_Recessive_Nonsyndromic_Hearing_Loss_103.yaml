phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Progressive bilateral sensorineural hearing loss is documented in the reported families. The Turkish siblings
    progressed from mild loss in early childhood to severe or profound loss before the second decade. Three
    Cameroonian siblings reported prelingual onset and progression and had profound loss when assessed as adults;
    earlier audiograms were unavailable. The Siberian cohort ranged from moderate to profound loss and reported
    highly variable decline, with a mean annual speech-frequency PTA change of 7.4 ± 13.65 dB. This cohort
    average does not predict an individual trajectory.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hearing loss in the present family had an onset in early childhood and progressed from mild to severe or even profound before the second decade."
    explanation: Onset and rate of progression in the founding family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis in patients with DFNB103 showed that HL was sensorineural, symmetrical and variable by severity (from moderate to profound)."
    explanation: >-
      Sensorineural loss, symmetry and severity range in the 22-patient Siberian cohort.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most cases this form of HL was detected in the post-lingual period (mean age 7.9 ± 1.2 years) and has a significant severity progression with age."
    explanation: Mean age at detection and confirmation of the progressive course in 22 patients.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33114113
    reference_title: Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-

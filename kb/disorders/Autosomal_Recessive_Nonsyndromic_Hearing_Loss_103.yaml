      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis of CLIC5 revealed a homozygous nonsense mutation c.96T>A (p.(Cys32Ter)) that segregated with the hearing loss."
    explanation: >-
      Homozygosity in the affected siblings of a consanguineous pedigree, with segregation
      through the family, which is the recessive pattern.
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three affected individuals were compound heterozygous for both variants, and all unaffected individuals were heterozygous for one of the two variants."
    explanation: >-
      Textbook recessive segregation in a non-consanguineous family, which is stronger
      evidence for the inheritance mode than a homozygous consanguineous pedigree alone.
pathophysiology:
- name: CLIC5 Loss of Function
  description: >-
    Biallelic CLIC5 alleles that abolish or cripple the protein. The reported human
    spectrum is a nonsense variant p.Cys32Ter in the founding Turkish family, a compound
    heterozygous pair in the Cameroonian family consisting of a missense p.L75P and a
    canonical donor splice-site variant, and a founder nonsense variant p.Trp215Ter in
    Eastern Siberia. Even the one missense allele behaves as a loss of function in cells:
    expressed CLIC5A p.L75P forms perinuclear aggregates instead of distributing evenly in
    the cytoplasm, and fails to produce the thin filopodia-like membrane protrusions the
    wild-type protein induces.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  downstream:
  - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper

genetic:
- name: CLIC5
  notes: >-
    CLIC5 on 6p21.1 encodes chloride intracellular channel 5, originally isolated from
    microvilli in complex with actin-binding proteins including ezrin. Despite the family
    name, its role in the ear is as a membrane-cytoskeletal adaptor at the stereocilia
    taper rather than as an ion channel. It is expressed elsewhere - in glomerular
    podocytes and endothelium, and in myoblasts - which is the background to the isolated
    report of mild renal dysfunction in one patient. In hair cells its expression is
    directly regulated by miR-96 and miR-182 of the miR-183 family, through a conserved
    binding site in its 3-prime untranslated region.

    The Siberian founder allele p.Trp215Ter is the only CLIC5 variant so far shown to reach
    appreciable population frequency anywhere; haplotype analysis over 730,000 genome-wide
    SNP markers places its origin around 78 generations ago.

    That allele appears in the literature under two names and they are the same variant:
    Pshennikova 2019 calls it c.1121G>A p.(Trp374*) and the 2026 Siberian cohort paper
    calls it c.644G>A p.(Trp215*). The offsets differ by exactly 477 nucleotides and 159
    codons, which is the shift between the two CLIC5 transcripts, not a second Siberian
    allele.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, our results show that CLIC5 is a novel arNSHI gene involved in progressive hearing impairment, vestibular and possibly mild renal dysfunction in a family of Turkish origin."
    explanation: >-
      The founding gene-disease conclusion, including the authors' own hedged renal
      observation.
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study is the second report, worldwide, to describe CLIC5 involvement in human hearing impairment, and thus confirms CLIC5 as a novel non-syndromic hearing impairment gene that should be included in targeted diagnostic gene panels."
    explanation: >-
      The independent replication that moved CLIC5 from a single-family finding to an
      accepted deafness gene.
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The haplotype analysis based on the 730,000 whole genome SNP-markers indicates common origin of all studied mutant chromosomes."
    explanation: The haplotype evidence establishing the Siberian allele as a single founder event.
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The encoded protein associates with actin-based cytoskeletal structures and may play a role in multiple processes including hair cell stereocilia formation, myoblast proliferation, and glomerular podocyte and endothelial cell maintenance."
    explanation: >-
      The gene's expression outside the ear, which is the reason the renal observation is
      biologically plausible rather than dismissible. Graded OTHER because the sentence is
      this paper's introductory summary of prior gene-function knowledge, not a clinical
      observation from the Cameroonian family it studied.
  - reference: PMID:22889583
    reference_title: "MiR-183 family regulates chloride intracellular channel 5 expression in inner ear hair cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings thus suggest that CLIC5 is directly regulated by miR-96 and miR-182 and that the target sequence in this regard is located between nucleotides 760-766 within the CLIC5 3'-UTR."
    explanation: >-
      Identifies a direct upstream regulator of CLIC5 dosage, mapped to a specific
      conserved binding site. Recorded because DFNB103 is a dosage-loss disease, so
      anything that sets CLIC5 expression level is a candidate modifier.
diagnosis:
- name: CLIC5 on panels for postlingual progressive recessive hearing loss
  description: >-
    DFNB103 is reached by exome sequencing or a targeted panel that contains CLIC5, after
    GJB2 has been excluded. The clinical prompt is a progressive postlingual sensorineural
    loss with vestibular signs, in a family pattern consistent with recessive inheritance
    and where newborn screening was passed. In the Sakha Republic the founder variant makes
    a single targeted test worthwhile in GJB2-negative patients before broader sequencing.
  evidence:
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."

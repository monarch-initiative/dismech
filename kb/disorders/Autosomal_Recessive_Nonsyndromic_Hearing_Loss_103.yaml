- name: Clic5 nmf318 missense mouse treated with inner ear AAV
  species: Mouse
  genotype: C57BL/6J-Clic5nmf318/J homozygote; ENU-induced missense allele; P0 AAV2/9-PHP.B Clic5 delivery
  publication: PMID:40859056
  description: >-
    The gene-replacement study used the ENU-induced nmf318 missense line (JAX 005329), not an engineered knockout.
    The MGI allele record specifies c.680T>C, p.Phe227Ser; the paper uses Clic5−/− as shorthand for the protein-deficient
    phenotype. Untreated animals had approximately 40-dB ABR threshold shifts at four weeks and no detected
    responses at eight weeks.

    Left-utricle injection at P0 restored CLIC5, prevented bundle fusion, improved hair-cell survival and auditory/vestibular
    outcomes. Radixin localization returned toward normal but taperin remained distributed along stereocilia
    at eight weeks. The self-complementary vector achieved comparable measured benefit at approximately eleven-fold
    lower titer than the single-stranded construct; this was not a formal equivalence trial, the constructs
    differed in reporter content and some untreated controls were shared. Auditory benefit declined, especially
    at high frequencies, whereas vestibular behavioral benefit persisted through the 12-week follow-up. No
    delayed-treatment arm tested reversal of established damage.
  genes:
  - preferred_term: CLIC5
    term:
      id: hgnc:13517
      label: CLIC5
  modeled_mechanisms:
  - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      CLIC5 replacement restores radixin localization and reduces structural abnormalities, supporting the
      proposed attachment function. Taperin remains mislocalized, so the experiment does not demonstrate reconstitution
      of every proposed complex component.
    limitations: >-
      P0 treatment precedes the observed lesion and tests prevention rather than reversal. No post-onset delivery
      arm defines when efficacy is lost. Auditory thresholds worsened by 12 weeks, especially at high frequencies;
      C57BL/6 background, expression dynamics and immune effects remain possible contributors.
    readouts:
    - name: Radixin localisation after CLIC5 restoration
      target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
      direction: RESTORED
      interpretation: >-
        Radixin returns toward the stereociliary base after CLIC5 replacement; this supports a functional dependency
        without proving the complete native binding architecture.
      evidence:
      - reference: PMID:40859056
        reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."

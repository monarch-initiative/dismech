phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Bilateral, symmetrical sensorineural hearing loss that begins mild and deteriorates.
    In the founding family onset was in early childhood and hearing progressed from mild
    to severe or profound before the second decade. The Siberian founder cohort quantifies
    the rate: about 7 dB lost per year across the speech frequencies, reaching profound
    deafness in the second or third decade, with severity across the cohort ranging from
    moderate to profound.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hearing loss in the present family had an onset in early childhood and progressed from mild to severe or even profound before the second decade."
    explanation: Onset and rate of progression in the founding family.
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis in patients with DFNB103 showed that HL was sensorineural, symmetrical and variable by severity (from moderate to profound)."
    explanation: >-
      Symmetry and severity range in the largest cohort. The symmetry is worth recording
      rather than assuming: it is the opposite of what the DFNA7 literature reports, where
      asymmetry is common enough that it has been proposed as a diagnostic prompt.
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most cases this form of HL was detected in the post-lingual period (mean age 7.9 ± 1.2 years) and has a significant severity progression with age."
    explanation: Mean age at detection and confirmation of the progressive course in 22 patients.
- name: Bilateral Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Both ears are affected. Every DFNB103 patient with a reported audiogram has bilateral
    disease, and the Siberian cohort adds that the two ears are usually matched rather than
    merely both involved.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiological assessment of the three affected individuals revealed bilateral profound sensorineural HI (Figure 1B)."
    explanation: Bilateral involvement in all three affected members of the Cameroonian family.
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis in patients with DFNB103 showed that HL was sensorineural, symmetrical and variable by severity (from moderate to profound)."
    explanation: >-
      Symmetry in the largest cohort, which is a stronger statement than bilaterality: the
      two ears are not merely both affected but affected to a similar degree.
  notes: >-
    VERY_FREQUENT rather than OBLIGATE because no reported series states laterality for
    every patient - the Turkish founding family's cached abstract does not say - so what is
    established is that no unilateral case has been described, not that none exists.

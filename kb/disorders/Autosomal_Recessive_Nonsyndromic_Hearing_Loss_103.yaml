discussions:
- discussion_id: clic5_therapeutic_window_timing
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Gene replacement prevents the CLIC5 phenotype when given at birth in mice, before the
    lesion starts. Human DFNB103 is diagnosed on an audiogram at around age 8, after
    stereocilia fusion would already have occurred. Can restoring CLIC5 rescue a bundle
    that has already fused, or only protect one that has not?
  attaches_to:
  - animal_models#Clic5 knockout mouse treated with inner ear AAV
  - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
  - treatments#Genetic Counselling with Audiologic and Vestibular Surveillance
  rationale: >-
    The rescue experiment is genuinely encouraging and it does not answer the question a
    patient would ask. Injections were given at postnatal day 0. The cochlear lesion
    begins between postnatal days 14 and 17. So what was demonstrated is that a hair cell
    which has never lost its taper complex can be kept intact, which is a prevention
    result. Nobody has injected a mouse after fusion has begun.

    The human timing makes this the central question rather than a detail. DFNB103 is not
    congenital, hearing is normal or near-normal at birth, and detection is at a mean of
    about 8 years - by which time the equivalent mouse would be long past the treatment
    window used. Any clinical translation therefore depends on an experiment that has not
    been done, and the founder cohort in the Sakha Republic, where the genotype is known
    and the population is identifiable, is exactly the setting where presymptomatic
    genetic diagnosis in infancy would be feasible if the answer turned out to be that
    only prevention works.

    There is a second, more specific worry inside the same result. Vestibular rescue was
    stable to 12 weeks while auditory thresholds deteriorated over the same period even
    though transgene expression remained robust and hair cell morphology looked
    unchanged. Something is failing in the treated cochlea that is neither loss of
    transgene nor visible loss of cells, and until that is understood the durability of
    any human auditory benefit is unpredictable.
  evidence:
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we performed utricle injections into P0 mice, prior to the morphological changes in hair cells that begin between P14 and P17, at the time of hearing onset"
    explanation: >-
      The authors state plainly that treatment preceded the lesion. That is the mismatch
      with human diagnostic timing.
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Vestibular function rescue remained durable up to 12 weeks post-injection, while ABR thresholds deteriorated over time, particularly at high frequencies."
    explanation: The divergence between the two rescued systems over time.
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite the deterioration of ABR thresholds over time, transgene expression remained robust at 12 weeks, and no significant morphological changes in hair cells were observed."
    explanation: >-
      Rules out the two obvious explanations for the auditory drift, which is what makes it
      an open mechanistic question rather than a technical shortfall.
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hearing loss in individuals with pathogenic variants in the CLIC5 gene is not congenital but emerges in early childhood, before the second decade of life, while vestibular areflexia, if present, generally develops later"
    explanation: >-
      The human timing that the neonatal mouse experiment does not correspond to. Graded
      OTHER because the sentence is this mouse study restating human findings it cites.
  proposed_experiments:
  - experiment_id: exp_dfnb103_delayed_aav_after_fusion_onset
    name: Delayed AAV delivery after stereocilia fusion has begun
    description: >-
      Deliver the same self-complementary Clic5 vector to Clic5-null mice at postnatal
      days 21 and 42, after fusion is established, with auditory brainstem response,
      distortion product otoacoustic emission, open-field circling and scanning electron
      microscopy at matched endpoints against the postnatal day 0 arm and untreated
      controls. Include a group in which transgene expression is confirmed but bundles are
      imaged before and after to distinguish arrest of progression from structural repair.
    would_support:
    - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
    supporting_outcome:
    - >-
      Delayed treatment arrests further threshold loss and stabilises bundle morphology
      relative to untreated nulls, which would mean the tethering defect is continuously
      required and a post-diagnosis human intervention is coherent.
    would_refute:
    - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
    refuting_outcome:
    - >-
      Delayed treatment restores CLIC5 protein and partner localisation but changes
      neither thresholds nor bundle morphology, which would mean fusion is irreversible
      once formed and would confine any therapeutic strategy to presymptomatic infants
      identified by genotype.
- discussion_id: clic5_renal_involvement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is DFNB103 truly nonsyndromic, or does biallelic CLIC5 loss carry a low-grade renal
    phenotype that has not been looked for systematically?
  attaches_to:
  - genetic#CLIC5
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 103
  rationale: >-
    One patient in the founding Turkish family had mild renal dysfunction, and the authors
    were careful to describe the gene as involved in hearing, vestibular and possibly mild
    renal dysfunction rather than asserting the last. That hedge has largely dropped out of
    subsequent descriptions, which now call the disease nonsyndromic without qualification.

    The observation deserves better than to be forgotten, because CLIC5 has an established
    role outside the ear in glomerular podocyte and endothelial cell maintenance. A
    podocyte adaptor protein whose loss produces a membrane-cytoskeletal failure in one
    specialised cell type has an obvious reason to do something similar in another. A
    single patient with mild dysfunction is weak evidence, but it is evidence pointing at a
    mechanism rather than a chance finding.

    What is missing is measurement. Neither the Cameroonian family nor the 22 Siberian
    patients have reported renal assessment, and the Siberian founder cohort is now large
    enough and genotypically homogeneous enough that urinalysis and estimated glomerular
    filtration rate against matched heterozygous relatives would settle the question
    cheaply. If a subclinical renal phenotype exists, DFNB103 patients need monitoring that
    nobody currently offers them; if it does not, the founding hedge can be retired on
    evidence rather than by attrition.
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired hearing is accompanied by vestibular areflexia and in one of the patients with mild renal dysfunction."
    explanation: >-
      Graded PARTIAL: a single patient with a mild finding, which is the entire human basis
      for the question.
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, our results show that CLIC5 is a novel arNSHI gene involved in progressive hearing impairment, vestibular and possibly mild renal dysfunction in a family of Turkish origin."
    explanation: >-
      The authors' own hedged wording, preserved here because later descriptions drop it
      and the hedge is the accurate statement of what is known.
  - reference: PMID:33114113
    reference_title: "Bi-Allelic Novel Variants in CLIC5 Identified in a Cameroonian Multiplex Family with Non-Syndromic Hearing Impairment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The encoded protein associates with actin-based cytoskeletal structures and may play a role in multiple processes including hair cell stereocilia formation, myoblast proliferation, and glomerular podocyte and endothelial cell maintenance."
    explanation: >-
      The biological reason the renal observation is plausible: the same class of
      membrane-cytoskeletal role in a different specialised cell type. Graded OTHER, not
      HUMAN_CLINICAL, because it is background prose summarising prior gene-function
      knowledge - grading it as clinical evidence would imply human podocyte data that
      this gap says does not exist.

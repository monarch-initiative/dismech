name: Autosomal Recessive Nonsyndromic Hearing Loss 103
category: Mendelian
creation_date: "2026-08-28T00:00:00Z"
synonyms:
- DFNB103
- CLIC5 autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness 103
- deafness, autosomal recessive 103
- autosomal recessive nonsyndromic deafness caused by mutation in CLIC5
- autosomal recessive deafness 103
description: >-
  DFNB103 is an autosomal recessive sensorineural hearing disorder caused by biallelic CLIC5 variants. Reported
  hearing loss is bilateral and progressive, with variable onset including prelingual and postlingual presentations.
  Vestibular areflexia is documented in the Turkish discovery family but is not established as universal. A
  Siberian founder allele accounts for an appreciable fraction of selected GJB2-negative patients in the Sakha
  Republic.

  Animal and cell studies support a role for CLIC5 in maintaining membrane-cytoskeletal attachments at the
  base of hair-cell stereocilia. CLIC5-deficient mice develop partner-protein mislocalization, stereocilia
  fusion and later hair-cell loss. Direct molecular contacts and the corresponding human cochlear lesion remain
  incompletely defined. Neonatal AAV gene replacement improves hearing and balance in an ENU-induced Clic5
  missense mouse model, but delayed treatment and durable human benefit have not been established.

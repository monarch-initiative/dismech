discussions:
- discussion_id: clic5_therapeutic_window_timing
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can CLIC5 replacement improve function after hearing loss or bundle damage begins, and what limits durable
    auditory rescue?
  attaches_to:
  - animal_models#Clic5 nmf318 missense mouse treated with inner ear AAV
  - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
  rationale: >-
    P0 delivery preceded morphological changes in the nmf318 model. The experiment does not define a closed
    window, prove irreversibility of fusion or establish an equivalent human treatment age. Human onset is
    variable, and cochlear histology is unavailable. Delayed delivery with adequate transduction and dose controls
    is needed.

    Vestibular rescue persisted through 12 weeks while auditory thresholds worsened despite persistent expression
    and no major gross morphological change. These endpoints do not exclude subtle bundle defects, cell-specific
    expression loss, inflammation or background susceptibility; the C57BL/6 Cdh23 allele is one potential confound.
    Radixin rescue with persistent taperin mislocalization also limits claims of complete complex restoration.
  evidence:
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we performed utricle injections into P0 mice, prior to the morphological changes in hair cells that begin between P14 and P17, at the time of hearing onset"
    explanation: >-
      The intervention preceded structural onset; delayed efficacy was not tested.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Vestibular function rescue remained durable up to 12 weeks post-injection, while ABR thresholds deteriorated over time, particularly at high frequencies."
    explanation: The divergence between the two rescued systems over time.
    quote_role: PRIMARY_RESULT
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Despite the deterioration of ABR thresholds over time, transgene expression remained robust at 12 weeks, and no significant morphological changes in hair cells were observed."
    explanation: >-
      Persistent expression and gross morphology leave several technical and biological explanations for auditory
      decline unresolved.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: exp_dfnb103_delayed_aav_after_fusion_onset
    name: Delayed AAV delivery after stereocilia fusion has begun
    description: >-
      Compare P0 with P21 and P42 delivery in the nmf318 line, using age-matched untreated and vector controls,
      verified cell-specific transduction, expression and dose. Measure auditory and vestibular function, partner
      localization, hair-cell counts and bundle ultrastructure; use matched cohorts where destructive imaging
      prevents within-cell follow-up. Include strain-background controls to assess high-frequency susceptibility.
    would_support:
    - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
    supporting_outcome:
    - >-
      Delayed delivery improves or stabilizes function and morphology with verified expression, supporting
      residual reversibility or prevention of further damage under that regimen.
    would_refute:
    - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
    refuting_outcome:
    - >-
      Verified delayed delivery fails to improve the measured endpoints, arguing against efficacy of that regimen
      at that stage; this would not prove universal irreversibility or restrict all human strategies to infancy.
- discussion_id: clic5_renal_involvement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is DFNB103 truly nonsyndromic, or does biallelic CLIC5 loss carry a low-grade renal
    phenotype that has not been looked for systematically?
  attaches_to:
  - genetic#CLIC5
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 103
  rationale: >-
    The Turkish discovery-family boy had repeatedly elevated urine albumin/creatinine ratios (9.2 and 3.8 mg/mmol)
    and mildly elevated blood pressure at age 11, with preserved estimated GFR (114 ml/min/1.73 m2). No renal
    biopsy established a lesion. The authors recommended follow-up for both siblings. Cameroonian participants
    lacked clinical renal signs, but biochemical kidney assessment was explicitly proposed for future work.
    The available Siberian abstract does not report renal evaluation.

    CLIC5-associated podocyte abnormalities in mice motivate systematic human assessment but do not establish
    a syndromic human nephropathy. Longitudinal albuminuria, blood pressure and kidney-function measurements
    with appropriate controls could clarify penetrance and alternative causes.
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired hearing is accompanied by vestibular areflexia and in one of the patients with mild renal dysfunction."
    explanation: >-
      An isolated renal observation in one of two discovery-family siblings; association with CLIC5 remains
      uncertain.
    quote_role: PRIMARY_RESULT
  - reference: url:https://repositoriosaludmadrid.es/bitstreams/e783eafe-8086-4b75-be09-9bd6ce296bad/download
    reference_title: "https://repositoriosaludmadrid.es/bitstreams/e783eafe-8086-4b75-be09-9bd6ce296bad/download"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Subsequent renal function follow-up of patient II.3 in the future will be needed to determine whether
      it is indeed a nephropathy.
    explanation: >-
      The primary report explicitly leaves nephropathy unresolved.
- discussion_id: clic5_expression_regulation
  kind: KNOWLEDGE_GAP
  prompt: Do experimentally identified CLIC5 regulators or binding partners modify human DFNB103 severity?
  attaches_to:
  - genetic#CLIC5
  rationale: >-
    miR-96 and miR-182 mimics reduce CLIC5 RNA/protein and a CLIC5 3-prime-UTR reporter in HEI-OC1 cells. GRXCR2
    interaction experiments also show functional importance despite largely preserved bundle morphology. Neither
    study establishes a modifier allele or prognostic marker in people with biallelic CLIC5 variants.
  evidence:
  - reference: PMID:22889583
    reference_title: MiR-183 family regulates chloride intracellular channel 5 expression in inner ear hair cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our findings thus suggest that CLIC5 is directly regulated by miR-96 and miR-182 and that the target
      sequence in this regard is located between nucleotides 760-766 within the CLIC5 3'-UTR.
    explanation: >-
      Cell and reporter experiments establish regulation in the tested system, not a human DFNB103 modifier.
  - reference: PMID:34026762
    reference_title: "N-Terminus of GRXCR2 Interacts With CLIC5 and Is Essential for Auditory Perception."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, mice harboring this in-frame deletion in Grxcr2 exhibit moderate hearing loss at lower frequencies and severe hearing loss at higher frequencies although the morphogenesis of stereocilia is minimally affected."
    explanation: >-
      Deleting GRXCR2 residues 36–95 disrupts CLIC5 association and causes hearing loss despite largely preserved
      bundle morphology. This is a partner-gene experiment, not evidence of a human DFNB103 modifier allele.
    quote_role: PRIMARY_RESULT

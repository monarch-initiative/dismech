    evidence_source: MODEL_ORGANISM
    snippet: "In addition, CLIC5 and RDX failed to localize normally in fused stereocilia of MYO6 mutant mice."
    explanation: >-
      The dependency measured in the other direction, which is what the description means
      by mutually stabilising rather than hierarchical: losing myosin VI mislocalises
      CLIC5, just as losing CLIC5 mislocalises radixin.
  - reference: PMID:34026762
    reference_title: "N-Terminus of GRXCR2 Interacts With CLIC5 and Is Essential for Auditory Perception."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, mice harboring this in-frame deletion in Grxcr2 exhibit moderate hearing loss at lower frequencies and severe hearing loss at higher frequencies although the morphogenesis of stereocilia is minimally affected."
    explanation: >-
      An independent line of evidence for the functional importance of the taper complex:
      deleting only the CLIC5-binding region of a partner protein causes hearing loss
      without visible morphological change, so the complex matters functionally and not
      only structurally.
- name: Progressive Stereocilia Fusion and Bundle Distortion
  description: >-
    The structural failure. Without the taper tether, adjacent stereocilia fuse. In the
    cochlea the fusion affects inner hair cells across all regions and outer hair cells
    most severely at the apex.

    The reported onset differs between the two mouse lines and they should not be read as
    one time course. In the jitterbug line, which carries an exon-skipping frameshift,
    fusion is described from postnatal day 10 onwards. In the Clic5-null line used for the
    gene therapy work, no cochlear abnormality is detectable at day 14 and the defects are
    established by day 17, with the vestibular change running slightly ahead - elongated
    utricular bundles from day 15, thickened by day 17. Both agree that the lesion has a
    defined postnatal onset rather than being present from birth, which is the structural
    counterpart of the postlingual, progressive human course; the P14-to-P17 window used
    by the therapeutic-window discussion and by the AAV model limitations is the null
    line's, not the jitterbug line's.

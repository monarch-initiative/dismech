progression:
- phase: Presymptomatic
  age_range: birth to about 8 years
  notes: >-
    Hearing is normal or near-normal at birth and the disease is not congenital, so a
    child with DFNB103 can pass newborn hearing screening. In the Siberian cohort the
    loss was detected at a mean of 7.9 years; in the Yakutia series the reported mean
    onset was 9.7 years. The founding Turkish family is the exception to the upper end,
    with onset in early childhood.
  evidence:
  - reference: PMID:40859056
    reference_title: "AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hearing loss in individuals with pathogenic variants in the CLIC5 gene is not congenital but emerges in early childhood, before the second decade of life, while vestibular areflexia, if present, generally develops later"
    explanation: >-
      The non-congenital start of the course. Graded OTHER because the sentence is this
      mouse study restating human findings it cites.
- phase: Progressive decline
  age_range: about 8 years to the second or third decade
  notes: >-
    Once detected the loss deteriorates at a measurable rate rather than in steps, which
    is what makes scheduled audiometry rather than a single audiogram the right
    surveillance. Vestibular areflexia, where it occurs, appears later than the hearing
    loss.
  evidence:
  - reference: PMID:40957967
    reference_title: "The c.644 G > A p.(Trp215*) founder variant in the CLIC5 gene causes progressive autosomal recessive deafness 103 (DFNB103) in Eastern Siberia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In average the patients with DFNB103 lost 7.4 ± 13.65 dB on the speech frequency range in pure tone averages (PTA0.5,1.0,2.0,4.0 kHz) per year until reaching profound deafness in the second or third decade of the life."
    explanation: >-
      The rate of decline and the age band it ends in, from the only cohort large enough
      to measure either.
- phase: Profound deafness
  age_range: second or third decade onwards
  notes: >-
    The endpoint reached by the Siberian cohort. The founding Turkish family reached
    severe or profound loss earlier, before the second decade, so the age at endpoint
    varies between reported populations even on truncating alleles.
  evidence:
  - reference: PMID:24781754
    reference_title: "Progressive hearing loss and vestibular dysfunction caused by a homozygous nonsense mutation in CLIC5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hearing loss in the present family had an onset in early childhood and progressed from mild to severe or even profound before the second decade."
    explanation: >-
      Graded PARTIAL because it qualifies the timing of this phase rather than confirming
      it: the founding family reached the endpoint a decade earlier than the Siberian
      cohort did.

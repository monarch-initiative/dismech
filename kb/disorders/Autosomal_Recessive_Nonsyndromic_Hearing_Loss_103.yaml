      decay; this is not a hair-cell assay.
- name: Loss of Membrane-Actin Tethering at the Stereocilia Taper
  description: >-
    CLIC5 concentrates near the stereociliary base and adjacent apical membrane. In jitterbug mice, radixin
    and PTPRQ localization is perturbed before fusion; taperin mislocalization is detected later. Membrane
    lifting and fusion support impaired attachment to the underlying cytoskeleton, but temporal precedence
    alone does not prove which interaction initiates the lesion.

    Co-immunoprecipitation in epithelial cells and pull-down from mouse lung support association with ERM proteins
    and taperin, with more tentative evidence for myosin VI. Direct CLIC5-actin binding and the composition
    of a single native hair-cell complex are not established by these assays. Approximately equimolar CLIC5
    and radixin abundance in bulk chicken hair bundles does not establish complex stoichiometry. Myosin VI
    mutants also mislocalize CLIC5 and radixin, indicating localization dependencies without resolving a unique
    assembly hierarchy.

animal_models:
- name: Tor1a heterozygous GAG-deletion knock-in mouse
  species: Mouse
  genotype: Tor1a+/dGAG (heterozygous in-frame GAG deletion)
  publication: PMID:30707939
  description: >-
    The genotype-matched model: a mouse carrying one copy of the same in-frame
    GAG deletion patients carry. It is the model that ought to reproduce the
    disease and largely does not, which is the central translational problem in
    this field. It does reproduce a specific neurochemical defect - reduced
    evoked striatal dopamine release, correctable with trihexyphenidyl - so it is
    informative for that node while failing at the level of overt pathology and
    dystonia.
  modeled_mechanisms:
  - target: Reduced Striatal Dopamine Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Directly measures reduced evoked dopamine release in the striatum of a
      mouse carrying the human allele, by ex vivo fast-scan cyclic voltammetry
      and in vivo microdialysis.
    limitations: >-
      The corresponding human data are reduced striatal D2 receptor density and
      altered dopamine metabolites, not a direct measurement of evoked release,
      so the human and mouse readouts are related but not the same quantity.
    readouts:
    - name: Evoked striatal dopamine release
      target: Reduced Striatal Dopamine Release
      direction: DECREASED
      interpretation: >-
        The defining measurement of this node in the model system.
      evidence:
      - reference: PMID:30707939
        reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found that DA release was significantly reduced in Dyt1 knockin mice"
        explanation: Reports the measured reduction in the knock-in genotype.
    - name: Dopamine release after trihexyphenidyl
      target: Reduced Striatal Dopamine Release
      direction: RESTORED
      interpretation: >-
        The rescue arm, which is what ties the clinically preferred drug to this
        node.
      evidence:
      - reference: PMID:30707939
        reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "THP restored DA release in Dyt1 mice through a nAChR-dependent mechanism"
        explanation: Reports restoration of the readout and the receptor dependence of the rescue.
    evidence:
    - reference: PMID:30707939
      reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a significant reduction in striatal DA release is observed in several mouse models of DYT1 dystonia"
      explanation: >-
        Establishes that the dopamine-release defect replicates across independent
        DYT1 mouse models, which is what makes this model informative for the node
        rather than a single-laboratory observation.
  - target: Generalized dystonia
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The genotype that matches patients does not produce the disease. Mice
      heterozygous for the identical deletion show no pathology, so the model
      cannot be used to study how the allele produces dystonia, only what it does
      to particular cellular readouts.
    limitations: >-
      This is a species difference rather than an allele or dosage artefact: the
      deletion is the human one and the zygosity is the human one. Pathology in
      mice requires homozygosity or conditional deletion, neither of which is the
      human genetic state, so every downstream mouse result in this entry is
      obtained from a genotype patients do not have.
    evidence:
    - reference: PMID:33468570
      reference_title: "Disease Modeling with Human Neurons Reveals LMNB1 Dysregulation Underlying DYT1 Dystonia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "significant species-dependent differences exist since animals with the identical heterozygous mutation fail to show pathology"
      explanation: >-
        States the negative result directly and attributes it to species
        difference, which is the substance of this FAILS_TO_RECAPITULATE link.
        Graded IN_VITRO because the publication is a human iPSC study; BACKGROUND
        because this sentence is its motivation for using human neurons rather
        than one of its own results.
- name: TorsinA-null and homozygous knock-in mouse neurons
  species: Mouse
  genotype: Tor1a-/- and Tor1a dGAG/dGAG
  publication: PMID:16364897
  description: >-
    The models in which the nuclear envelope lesion was discovered. Complete loss
    of torsinA, or homozygosity for the disease deletion, produces severely
    abnormal nuclear membranes specifically in neurons, with non-neuronal cells
    appearing normal - the observation that made nuclear envelope biology the
    dominant mechanistic account of this disease and that explains how a
    ubiquitously expressed gene causes a neurological illness.
  modeled_mechanisms:
  - target: Neuronal Nuclear Envelope Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Demonstrates the nuclear envelope lesion and its neuron-selectivity, and
      establishes its developmental timing.
    limitations: >-
      The genotypes are homozygous null or homozygous deletion; patients are
      heterozygous, and heterozygous mice show no pathology. The specific
      morphology seen here - perinuclear blebs - is also not what patient-derived
      human neurons show, so the node is supported but its mouse morphology should
      not be assumed to transfer. Fidelity is MODERATE rather than HIGH for those
      two reasons together.
    readouts:
    - name: Neuronal nuclear membrane morphology
      target: Neuronal Nuclear Envelope Disruption
      direction: ALTERED
      interpretation: >-
        The structural lesion defining the node, restricted to neurons.
      evidence:
      - reference: PMID:16364897
        reference_title: "Loss of the dystonia-associated protein torsinA selectively disrupts the neuronal nuclear envelope."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "contain severely abnormal nuclear membranes, although non-neuronal cell types appear normal"
        explanation: Reports the morphological measurement and its cell-type restriction.
    evidence:
    - reference: PMID:16364897
      reference_title: "Loss of the dystonia-associated protein torsinA selectively disrupts the neuronal nuclear envelope."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These observations demonstrate that neurons have a unique requirement for nuclear envelope localized torsinA function and suggest that loss of this activity is a key molecular event in the pathogenesis of DYT1 dystonia."
      explanation: >-
        The authors' own statement that this model is informative for the
        pathogenesis of the human disease at this node.
- name: Forebrain conditional torsinA knockout mouse
  species: Mouse
  genotype: Conditional Tor1a deletion in embryonic forebrain cholinergic and GABAergic progenitors
  publication: PMID:26052670
  description: >-
    The model that produces an overt movement phenotype. Deleting torsinA in
    embryonic progenitors of forebrain cholinergic and GABAergic neurons causes
    dystonic-like twisting movements appearing during juvenile maturation,
    coinciding with selective loss of dorsal striatal large cholinergic
    interneurons. It is the strongest available link from torsinA loss to a
    dystonic phenotype, and the model that identified the vulnerable cell type.
  modeled_mechanisms:
  - target: Striatal Cholinergic Interneuron Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Identifies the selectively vulnerable cell type and characterizes the
      surviving population as morphologically, electrophysiologically and
      connectionally abnormal.
    limitations: >-
      Conditional homozygous deletion in a defined progenitor population is not
      the human genetic state, and the cell loss seen here is more severe than
      anything reported in patients, whose striatum shows cholinergic
      abnormalities without overt degeneration.
    readouts:
    - name: Dorsal striatal large cholinergic interneuron number
      target: Striatal Cholinergic Interneuron Dysfunction
      direction: DECREASED
      interpretation: >-
        The cellular lesion whose timing coincides with symptom onset in this
        model.
      evidence:
      - reference: PMID:26052670
        reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The onset of these movements coincides with selective degeneration of dorsal striatal large cholinergic interneurons (LCI), and surviving LCI exhibit morphological, electrophysiological, and connectivity abnormalities."
        explanation: Reports the cell loss and the abnormality of survivors.
    evidence:
    - reference: PMID:26052670
      reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate that dorsal LCI have a unique requirement for torsinA function during striatal maturation, and link abnormalities of these cells to dystonic-like movements in an overtly symptomatic animal model."
      explanation: >-
        The authors' statement linking this cell type to the movement phenotype,
        which is what makes the model informative for this node.
  - target: Maturation-Dependent Disruption of Neuronal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Shows that the phenotype is timed to juvenile CNS maturation rather than
      present from birth or acquired in adulthood, matching the childhood onset
      of the human disease.
    limitations: >-
      Mouse juvenile maturation and human childhood are matched only in ordinal
      terms; the model cannot speak to the specific age window or to why human
      onset clusters around 9 years.
    evidence:
    - reference: PMID:26052670
      reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "causes dystonic-like twisting movements that emerge during juvenile CNS maturation"
      explanation: Establishes the maturation-dependent timing of the phenotype.
experimental_models:
- name: Patient-derived cholinergic motor neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:33468570
  description: >-
    Cholinergic motor neurons generated from DYT1 patients, either by direct
    conversion of skin fibroblasts or by differentiation of induced pluripotent
    stem cells, carrying the patient heterozygous GAG deletion in human cells.
    This is the model that works where the heterozygous mouse does not, and it is
    also the model that disagrees with the mouse about what the nuclear lesion
    looks like. Isogenic controls - genomically corrected patient lines and
    engineered deletion in healthy lines - are available and were used in the
    RANBP17 work, which is what makes the transport findings attributable to the
    allele rather than to line background.
  organism:
    preferred_term: human
    term:

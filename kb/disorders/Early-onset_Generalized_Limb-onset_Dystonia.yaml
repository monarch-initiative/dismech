  - target: Neuronal Nuclear Envelope Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces nuclear envelope pathology - markedly thickened nuclear lamina,
      disrupted nuclear morphology, LMNB1 upregulation and mislocalization - but
      not the perinuclear blebs that are the signature lesion in the mouse
      models. It supports the node while contradicting the mouse's account of what

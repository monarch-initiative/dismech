        snippet: "impaired nucleocytoplasmic transport (NCT) of mRNAs and proteins"
        explanation: Reports the transport measurement in patient-derived neurons.
    - name: Transport activity after RANBP17 overexpression
      target: Impaired Nucleocytoplasmic Transport
      direction: RESTORED
      interpretation: >-
        The rescue that makes the transport defect causal for the developmental
        phenotype rather than merely correlated with it.
      evidence:
      - reference: PMID:38438257
        reference_title: "RANBP17 Overexpression Restores Nucleocytoplasmic Transport and Ameliorates Neurodevelopment in Induced DYT1 Dystonia Motor Neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the overexpression of RANBP17 emerged as a substantial mitigating factor, effectively restoring impaired NCT activity and rescuing neurodevelopmental deficits observed in DYT1 MNs"
        explanation: Reports restoration of both the transport readout and the developmental phenotype.
    evidence:
    - reference: PMID:38438257
      reference_title: "RANBP17 Overexpression Restores Nucleocytoplasmic Transport and Ameliorates Neurodevelopment in Induced DYT1 Dystonia Motor Neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These patient-specific neurons retain the donor's heterozygous TOR1A mutation"
      explanation: >-
        Establishes that the model carries the human disease genotype at the

prevalence:
- population: Ashkenazi Jewish population
  measure_type: CARRIER_FREQUENCY
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 16.7
  rate_high: 50.0
  notes: >-
    A frequency of the founder GAG-deletion mutation, not disease prevalence. The
    reported 1/6,000 to 1/2,000 range converts to 16.7-50 per 100,000; no
    synthetic midpoint is assigned. Because penetrance is approximately 30%, the
    frequency of manifesting disease in this population is substantially lower
    than this figure, but the cited source does not report a manifesting rate and
    none is derived here.

    What measure_type should be is not fully resolved by the source, and the
    record is deliberately not written as though it were. The quoted sentence
    says only that "this dominant mutation" has a "current high frequency", and
    its closing clause speaks of "disease allele frequencies" - so whether
    1/6,000-1/2,000 is a heterozygote (carrier) frequency or an allele frequency
    is left open, and the two differ by a factor of about two. CARRIER_FREQUENCY
    is recorded because PrevalenceMeasureEnum has no allele-frequency value
    (permissible values checked: POINT_PREVALENCE, BIRTH_PREVALENCE,
    LIFETIME_PREVALENCE, PERIOD_PREVALENCE, ANNUAL_INCIDENCE, CARRIER_FREQUENCY,
    CASES_IN_LITERATURE, UNKNOWN) and because for a heterozygous dominant allele
    the carriers are the heterozygotes the enum's own definition names. Treat the
    band as the magnitude the source supports, not as a resolved carrier rate.
  evidence:
  - reference: PMID:7719342
    reference_title: "Genetic analysis of idiopathic torsion dystonia in Ashkenazi Jews and their recent descent from a small founder population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its current high frequency (between 1/6,000 and 1/2,000)"
    explanation: >-
      Supplies the carrier-frequency range for the founder allele in the
      Ashkenazi Jewish population.
- population: Ashkenazi Jewish early-onset cases
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Not an occurrence rate but the founder share: more than 90% of early-onset
    idiopathic torsion dystonia in this population traces to one mutation that
    arose about 350 years ago. Recorded as a prevalence record because it governs
    how the carrier frequency above should be read, and marked UNKNOWN /
    NOT_YET_DOCUMENTED rather than converted into a rate it does not supply.
  evidence:
  - reference: PMID:7719342
    reference_title: "Genetic analysis of idiopathic torsion dystonia in Ashkenazi Jews and their recent descent from a small founder population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data show that the vast majority (> 90%) of early-onset ITD cases in the Ashkenazi population are due to a single founder mutation, which we estimate first appeared approximately 350 years ago."
    explanation: >-
      Establishes the single-founder origin and its age, which is why carrier
      frequency in this population is high relative to the disease's rarity.
inheritance:
- name: Autosomal dominant with reduced penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Autosomal dominant transmission of a single recurrent TOR1A allele. Each child
    of an affected individual has a 50% chance of inheriting the variant, but only
    about 30% of those who inherit it ever develop dystonia. Reduced penetrance is
    the central counselling fact of this disease, not a caveat on it: most carriers
    in a pedigree are clinically normal, so an unaffected parent or sibling cannot
    be assumed to be a non-carrier, and apparently sporadic cases are frequently
    inherited. Expressivity among those who do manifest is also variable, so an
    affected child may be more or less severely affected than the transmitting
    parent.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DYT-TOR1A is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The penetrance for the TOR1A c.907_909delGAG deletion is approximately 30%; thus, on average, 30% of individuals who inherit the TOR1A c.907_909delGAG deletion develop dystonia and 70% do not develop dystonia."
    explanation: >-
      Quantifies penetrance directly and states the complementary 70%
      non-manifesting fraction, which is the fact that governs counselling.
  - reference: PMID:23649720
    reference_title: "Phenomenology and classification of dystonia: a consensus update."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "DYT1 dystonia is transmitted as an autosomal-dominant trait with a penetrance of about 30%."
    explanation: >-
      Independent corroboration of the penetrance figure from the international
      classification consensus, cited here because a single-source penetrance
      claim is exactly the kind that should be checked against a second authority.
      Graded OTHER because the publication is an expert consensus statement rather
      than a study reporting data, and INDIRECT because the sentence restates
      established literature rather than measuring penetrance.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DYT-TOR1A is associated with significant intrafamilial variability; thus, dystonia in an affected individual may be more or less severe than that of the parent from whom the TOR1A pathogenic variant was inherited."
    explanation: Supports the VARIABLE expressivity value alongside incomplete penetrance.
pathophysiology:
- name: Heterozygous TOR1A GAG Deletion
  biological_scale: MOLECULAR
  description: >-
    A heterozygous in-frame three-base-pair deletion, c.907_909delGAG, in exon 5 of
    TOR1A. It removes one of a pair of glutamate residues from a conserved
    C-terminal region of torsinA without shifting the reading frame, so a
    near-full-length protein is made. More than 98% of affected individuals carry
    this same allele, which is unusual for a Mendelian disease and is why the
    entry can describe one variant rather than a spectrum.
  genetic_context:
    variant_origin: GERMLINE
    allele_type: DELETION
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TOR1A
    term:
      id: hgnc:3098
      label: TOR1A
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Impaired TorsinA AAA+ ATPase Function
    description: >-
      Deletion of the glutamate within the conserved region compromises the
      nucleotide-dependent cycle of the AAA+ domain, which is the proximate
      molecular consequence of the allele.
  evidence:
  - reference: PMID:9288096
    reference_title: "The early-onset torsion dystonia gene (DYT1) encodes an ATP-binding protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This deletion results in loss of one of a pair of glutamic-acid residues in a conserved region of a novel ATP-binding protein, termed torsinA."
    explanation: >-
      The original gene-identification paper states the molecular nature of the
      lesion - single glutamate loss from a conserved region of an ATP-binding
      protein - which is the definition of this node.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 98% of affected individuals have the 3-bp deletion c.907_909delGAG involving the highly conserved GAGGAG sequence in exon 5."
    explanation: >-
      Supplies the precise coding change and establishes that essentially the
      whole disease is attributable to this one allele.
- name: Impaired TorsinA AAA+ ATPase Function
  biological_scale: MOLECULAR
  description: >-
    TorsinA is an AAA+ ATPase resident in the endoplasmic reticulum lumen and the
    contiguous perinuclear space. Unlike most AAA+ proteins it lacks a complete
    catalytic site of its own and depends on the membrane cofactors LAP1 (nuclear
    envelope) and LULL1 (bulk ER), each of which supplies an arginine finger to
    complete the active site and trigger hydrolysis. The disease deletion sits in
    the region that mediates this regulated cycle, so the mutant protein is
    impaired in the cofactor-driven ATPase activity through which torsinA does its
    work. The functional readout that matters is not the catalytic rate in
    isolation but the ability to rescue nuclear envelope defects in
    torsin-deficient cells.
  molecular_functions:
  - preferred_term: cofactor-dependent torsinA ATP hydrolysis
    modifier: DECREASED
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
  downstream:
  - target: Neuronal Nuclear Envelope Disruption
    description: >-
      Loss of regulated torsinA ATPase activity at the nuclear envelope removes
      the activity whose absence produces the membrane lesion in the next node.
  evidence:
  - reference: PMID:28814508
    reference_title: "Dynamic functional assembly of the Torsin AAA+ ATPase and its modulation by LAP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TorsinA is an essential AAA+ ATPase requiring LAP1 or LULL1 as cofactors."
    explanation: >-
      Establishes the enzyme class and the obligate cofactor dependence that
      defines how torsinA activity is regulated.
  - reference: PMID:28814508
    reference_title: "Dynamic functional assembly of the Torsin AAA+ ATPase and its modulation by LAP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Engagement of the oligomer by LAP1 triggers ATP hydrolysis and rapid complex disassembly."
    explanation: >-
      Describes the cofactor-triggered hydrolysis step, supporting the
      characterization of torsinA function as a regulated ATPase cycle rather than
      constitutive catalysis.
  - reference: PMID:28814508
    reference_title: "Dynamic functional assembly of the Torsin AAA+ ATPase and its modulation by LAP1."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "These Torsin mutants are severely compromised in their ability to rescue nuclear envelope defects in Torsin-deficient cells, suggesting that TorsinA homo-oligomers play a key role in vivo."
    explanation: >-
      Links loss of correct torsin assembly to failure of nuclear envelope
      maintenance, which is the edge this node asserts. INDIRECT because the
      mutants studied are engineered oligomerization-interface variants rather
      than the disease GAG deletion, so the inference to the patient allele is a
      step removed.
- name: Neuronal Nuclear Envelope Disruption
  biological_scale: CELLULAR
  description: >-
    Loss of torsinA function produces abnormal nuclear envelope architecture that
    is, strikingly, restricted to neurons even though TOR1A is widely expressed -
    the classic statement of the tissue-specificity problem in this disease. In
    mouse null and homozygous knock-in neurons the lesion takes the form of
    perinuclear membrane blebs or herniations. In human patient-derived cholinergic
    motor neurons carrying the heterozygous deletion the lesion instead appears as
    a markedly thickened nuclear lamina with disrupted nuclear morphology and
    LMNB1 dysregulation, without the blebs. Both are nuclear envelope pathology;
    they are not the same lesion, and the entry does not treat the mouse
    morphology as established in humans. See the HUMAN_MODEL_MISMATCH discussion.
  biological_processes:
  - preferred_term: nuclear envelope organization
    modifier: DECREASED
    term:
      id: GO:0006998
      label: nuclear envelope organization
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Impaired Nucleocytoplasmic Transport
    description: >-
      A disordered nuclear envelope and lamina compromise the interface across
      which all nuclear import and export occurs.
  - target: Maturation-Dependent Disruption of Neuronal Development
    description: >-
      The envelope lesion arises in postmigratory embryonic neurons and worsens
      with maturation, tying the cellular defect to a developmental window rather
      than to ongoing adult injury.
  evidence:
  - reference: PMID:16364897
    reference_title: "Loss of the dystonia-associated protein torsinA selectively disrupts the neuronal nuclear envelope."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "contain severely abnormal nuclear membranes, although non-neuronal cell types appear normal"
    explanation: >-
      Establishes both the nuclear membrane lesion and its neuron-selectivity in
      torsinA-null and knock-in mice, which is the core claim of this node.
  - reference: PMID:16364897
    reference_title: "Loss of the dystonia-associated protein torsinA selectively disrupts the neuronal nuclear envelope."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These observations demonstrate that neurons have a unique requirement for nuclear envelope localized torsinA function and suggest that loss of this activity is a key molecular event in the pathogenesis of DYT1 dystonia."
    explanation: >-
      States the authors' inference that nuclear-envelope-localized torsinA
      function is the relevant activity, supporting placement of this node on the
      main causal chain.
  - reference: PMID:33468570
    reference_title: "Disease Modeling with Human Neurons Reveals LMNB1 Dysregulation Underlying DYT1 Dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "markedly thickened nuclear lamina, disrupted nuclear morphology"
    explanation: >-
      Supplies the human counterpart of the envelope lesion in patient-derived
      motor neurons carrying the heterozygous deletion, which is what licenses
      this node for the human disease rather than only for mouse models.
  - reference: PMID:33468570
    reference_title: "Disease Modeling with Human Neurons Reveals LMNB1 Dysregulation Underlying DYT1 Dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we uncover that the nuclear lamina protein LMNB1 is upregulated in DYT1 cells and exhibits abnormal subcellular distribution in a cholinergic MNs-specific manner"
    explanation: >-
      Identifies the specific lamina protein whose dysregulation accompanies the
      human envelope lesion, and records that it is cell-type-restricted.
- name: Impaired Nucleocytoplasmic Transport
  biological_scale: CELLULAR
  description: >-
    Patient-derived DYT1 motor neurons show impaired bidirectional traffic across
    the nuclear envelope, affecting both protein import and export and the export
    of mRNA. A specific molecular correlate has been identified: RANBP17, an
    importin-beta superfamily nuclear transport receptor, is strongly
    downregulated in DYT1 motor neurons, and restoring it rescues both the
    transport defect and the neurodevelopmental phenotype. That rescue is what
    makes this node causal rather than merely correlated, and it places impaired
    transport upstream of the developmental abnormality rather than beside it.
  biological_processes:
  - preferred_term: nucleocytoplasmic transport
    modifier: DECREASED
    term:
      id: GO:0006913
      label: nucleocytoplasmic transport
  - preferred_term: protein import into the nucleus in DYT1 motor neurons
    modifier: DECREASED
    term:
      id: GO:0006606
      label: protein import into nucleus
  - preferred_term: mRNA export from the nucleus in DYT1 motor neurons
    modifier: DECREASED
    term:
      id: GO:0006406
      label: mRNA export from nucleus
  cell_types:
  - preferred_term: patient-derived cholinergic motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Maturation-Dependent Disruption of Neuronal Development
    description: >-
      Restoring nucleocytoplasmic transport by RANBP17 overexpression rescues the
      neurodevelopmental deficits of DYT1 motor neurons, which is direct evidence
      that the transport defect is upstream of the developmental one.
  evidence:
  - reference: PMID:33468570
    reference_title: "Disease Modeling with Human Neurons Reveals LMNB1 Dysregulation Underlying DYT1 Dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impaired nucleocytoplasmic transport (NCT) of mRNAs and proteins"
    explanation: >-
      Establishes the transport defect in human patient-derived neurons and that
      it affects both cargo classes.
  - reference: PMID:38438257
    reference_title: "RANBP17 Overexpression Restores Nucleocytoplasmic Transport and Ameliorates Neurodevelopment in Induced DYT1 Dystonia Motor Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identified that the expression level of RANBP17, a RAN-binding protein crucial for NCT regulation, exhibited a significant reduction in DYT1 MNs"
    explanation: >-
      Identifies the specific transport receptor whose loss accompanies the
      defect, giving the node a molecular handle rather than a phenomenological
      one.
  - reference: PMID:38438257
    reference_title: "RANBP17 Overexpression Restores Nucleocytoplasmic Transport and Ameliorates Neurodevelopment in Induced DYT1 Dystonia Motor Neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the overexpression of RANBP17 emerged as a substantial mitigating factor, effectively restoring impaired NCT activity and rescuing neurodevelopmental deficits observed in DYT1 MNs"
    explanation: >-
      A rescue experiment, which is the strongest available support for the
      downstream edge to the developmental node: correcting transport corrects
      development.
- name: Maturation-Dependent Disruption of Neuronal Development
  biological_scale: CELLULAR
  description: >-
    The consequences of torsinA loss are tied to a developmental window rather
    than to progressive adult injury. Nuclear envelope abnormalities appear in
    postmigratory embryonic neurons and worsen as those neurons mature; in
    conditional mouse mutants dystonic movements emerge during juvenile CNS
    maturation; and patient-derived motor neurons show reduced neurite length and
    branching. This node is why the disease is described as functional and
    developmental rather than degenerative, and it is the mechanistic counterpart
    of the clinical observation that symptoms begin in childhood, spread over a few
    years, and then persist without shortening life span.
  biological_processes:
  - preferred_term: neuron projection development
    modifier: DECREASED
    term:
      id: GO:0031175
      label: neuron projection development
  cell_types:
  - preferred_term: developing neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Striatal Cholinergic Interneuron Dysfunction
    description: >-
      The maturing dorsal striatum is where the developmental requirement for
      torsinA is most stringent, and its cholinergic interneurons are the cell
      type that fails.
  evidence:
  - reference: PMID:16364897
    reference_title: "Loss of the dystonia-associated protein torsinA selectively disrupts the neuronal nuclear envelope."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These membrane abnormalities develop in postmigratory embryonic neurons and subsequently worsen with further neuronal maturation, a finding evocative of the developmental dependence of DYT1 dystonia."
    explanation: >-
      States the developmental timing of the cellular lesion and explicitly ties
      it to the developmental dependence of the human disease.
  - reference: PMID:26052670
    reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "causes dystonic-like twisting movements that emerge during juvenile CNS maturation"
    explanation: >-
      Shows the behavioural phenotype itself is maturation-timed rather than
      present from birth or acquired in adulthood.
  - reference: PMID:33468570
    reference_title: "Disease Modeling with Human Neurons Reveals LMNB1 Dysregulation Underlying DYT1 Dystonia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "show reduced neurite length and branches"
    explanation: >-
      Supplies the human cellular neurodevelopmental readout that the RANBP17
      rescue experiment later corrects.
- name: Striatal Cholinergic Interneuron Dysfunction
  biological_scale: CELLULAR
  description: >-
    Dorsal striatal large cholinergic interneurons have a distinctive requirement
    for torsinA during striatal maturation. In mice with conditional forebrain
    deletion, the emergence of dystonic movements coincides with selective loss of
    these cells, and the survivors are morphologically, electrophysiologically and
    connectionally abnormal. Cholinergic abnormalities are also present in
    postmortem striatum from DYT1 patients, which is the main piece of human
    tissue evidence anywhere in this chain. Note the terminological hazard: the
    mouse model shows selective degeneration of this one interneuron class, which
    is not the same as the disease being a neurodegeneration - the human disorder
    has no overt neuropathological signature.
  cell_types:
  - preferred_term: dorsal striatal large cholinergic interneuron
    term:
      id: CL:0020007
      label: dorso-striatal cholinergic-GABAergic neuron
  biological_processes:
  - preferred_term: striatal cholinergic synaptic transmission
    modifier: ABNORMAL
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  locations:
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0002435
      label: striatum
  downstream:
  - target: Reduced Striatal Dopamine Release
    description: >-
      Acetylcholine released by striatal cholinergic interneurons drives dopamine
      release from nigrostriatal terminals through nicotinic receptors, so
      cholinergic interneuron dysfunction propagates directly into the dopaminergic
      readout.
  - target: Basal Ganglia and Cerebellothalamocortical Network Dysfunction
    description: >-
      Cholinergic interneurons are the principal local modulator of striatal
      output, so their dysfunction alters basal ganglia network signalling
      independently of the dopaminergic arm.
  evidence:
  - reference: PMID:26052670
    reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The onset of these movements coincides with selective degeneration of dorsal striatal large cholinergic interneurons (LCI), and surviving LCI exhibit morphological, electrophysiological, and connectivity abnormalities."
    explanation: >-
      Establishes both the selective vulnerability of this cell type and that the
      surviving population is functionally abnormal, which is the substance of
      this node.
  - reference: PMID:26052670
    reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify cholinergic abnormalities in postmortem striatal tissue from DYT1 dystonia patients"
    explanation: >-
      Human postmortem corroboration that the cholinergic abnormality is not a
      mouse-only finding. Graded HUMAN_CLINICAL because this specific claim rests
      on patient tissue, whereas the same paper's mouse results are graded
      MODEL_ORGANISM; the paper mixes sources and the items are split accordingly.
  - reference: PMID:26052670
    reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "murine dystonic-like movements are reduced significantly with an antimuscarinic agent used clinically"
    explanation: >-
      Pharmacological validation of the cholinergic node: blocking muscarinic
      signalling reduces the movements, which is also the mechanistic rationale
      for trihexyphenidyl in patients.
- name: Reduced Striatal Dopamine Release
  biological_scale: CELLULAR
  description: >-
    Striatal dopamine signalling is abnormal in both directions of evidence.
    Knock-in mice carrying the heterozygous deletion show significantly reduced
    evoked dopamine release, and DYT1 patients show reduced striatal D2 receptor
    availability. The link to the cholinergic node above is mechanistic rather
    than merely associative: trihexyphenidyl restores dopamine release in Dyt1
    mice through a nicotinic-receptor-dependent route, which is the clearest
    account available of how the clinically preferred drug works. Levodopa, by
    contrast, does not increase dopamine release in these mice, matching the
    clinical observation that DYT1 dystonia is not dopa-responsive.
  cell_types:
  - preferred_term: nigrostriatal dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: striatal dopamine secretion
    modifier: DECREASED
    term:
      id: GO:0014046
      label: dopamine secretion
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  downstream:
  - target: Basal Ganglia and Cerebellothalamocortical Network Dysfunction
    description: >-
      Reduced dopaminergic drive and reduced D2 receptor availability alter the
      balance of striatal output pathways, feeding the network abnormality seen on
      imaging.
  evidence:
  - reference: PMID:30707939
    reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we found that DA release was significantly reduced in Dyt1 knockin mice"
    explanation: >-
      Direct measurement of the reduced dopamine release that defines this node,
      in the mouse carrying the disease allele.
  - reference: PMID:30707939
    reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Previous studies have demonstrated reductions in striatal D2 receptor density and abnormalities in DA metabolites in DYT1 patients."
    explanation: >-
      Records the human counterpart of the mouse finding. INDIRECT because the
      sentence is this paper's summary of prior patient literature rather than a
      result it measures; the paper's own data are rodent, which is why the item
      is graded MODEL_ORGANISM.
  - reference: PMID:30707939
    reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "THP restored DA release in Dyt1 mice through a nAChR-dependent mechanism"
    explanation: >-
      Establishes the cholinergic-to-dopaminergic mechanistic link asserted by the
      upstream edge, and supplies the mechanism of action for trihexyphenidyl.
  - reference: PMID:30707939
    reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "In contrast, ʟ-DOPA, which is not usually effective for the treatment of DYT1 dystonia, did not increase dopamine release in either Dyt1 or control mice."
    explanation: >-
      Sources the levodopa half of this node's description, which was previously
      asserted without a citation. It is the pharmacological discriminator that
      separates this disease from dopa-responsive dystonia: the dopaminergic
      deficit here is in activity-dependent release rather than in dopamine
      synthesis or content, so supplying precursor does not correct it. The
      snippet reproduces the source's small-capital letter in "ʟ-DOPA" verbatim.
- name: Basal Ganglia and Cerebellothalamocortical Network Dysfunction
  biological_scale: TISSUE
  description: >-
    The convergence point, and the least mechanistically closed node in the entry.
    Functional imaging in DYT1 carriers shows reduced striatal GABA and dopamine
    receptor availability, increased metabolic activity in the lentiform nucleus,
    supplementary motor area and cerebellum, and an abnormal cerebellothalamocortical
    pathway. Notably these changes are present in carriers irrespective of whether
    they manifest dystonia, so network abnormality alone is not sufficient for
    disease - what distinguishes manifesting from non-manifesting carriers appears
    to involve the distal thalamocortical segment and compensatory putaminal
    changes. That is the imaging-level correlate of 30% penetrance. What remains
    unestablished is the causal step from this network state to the dystonic
    movement itself; the entry asserts the association and stops there.
  locations:
  - preferred_term: globus pallidus
    term:
      id: UBERON:0001875
      label: globus pallidus
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  downstream:
  - target: Limb-onset dystonia
    description: >-
      Abnormal motor network output is the presumed proximate cause of the
      dystonic postures and movements. This edge is the weakest in the chain and
      is supported by association and by the therapeutic response to pallidal
      stimulation rather than by a demonstrated causal path.
  evidence:
  - reference: PMID:37165749
    reference_title: "Neuroimaging findings in DYT1 dystonia and the pathophysiological implication: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All DYT1 gene carriers irrespective of clinical penetrance have reduced striatal GABA, dopamine receptors and increased metabolic activity in the lentiform nucleus, supplementary motor area, and cerebellum in addition to an abnormal cerebellothalamocortical pathway."
    explanation: >-
      The systematic review's primary result, establishing both the network
      abnormality and the critical observation that it is present in
      non-manifesting carriers too.
  - reference: PMID:37165749
    reference_title: "Neuroimaging findings in DYT1 dystonia and the pathophysiological implication: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose that DYT1 dystonia is a cerebellostriatothalamocortical network disorder affecting either the structure or function of the different structures or nodes in the network"
    explanation: >-
      States the review's synthesis, which is the framing this node adopts - a
      distributed network disorder rather than a single-structure lesion.
  - reference: PMID:26052670
    reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary dystonia results from abnormal functioning of a structurally intact central nervous system"
    explanation: >-
      Supports the characterization of the network state as functional rather than
      structural-degenerative, which is the distinction this entry is built
      around. INDIRECT because the sentence states the field's accepted framing in
      the paper's introduction rather than reporting a measurement.
phenotypes:
- category: Neurologic
  name: Limb-onset dystonia
  description: >-
    The presenting feature and the one the disease is named for. Dystonia begins
    in a leg or an arm, with a median onset age of 9 years. It is initially
    action-specific - an abnormal gait with foot inversion or knee flexion, or a
    hand posture that appears only on writing - and becomes present at rest as it
    progresses. Onset in axial, cervical or cranial regions occurs but is much
    less common, which is the clinical signature separating this entity from
    DYT6/THAP1 dystonia. Pain is not prominent.

    Onset is childhood in the great majority, but not exclusively: about 5% of
    affected individuals present after age 30. That tail matters clinically
    because "early-onset" in the entity's own name invites a late presentation
    being read as excluding the diagnosis, and it matters for counselling,
    because an at-risk relative who is well in their twenties is not thereby
    past risk.
  phenotype_term:
    preferred_term: Limb-onset dystonia
    term:
      id: HP:0002451
      label: Limb dystonia
    onset:
      onset_category: CHILDHOOD
      notes: >-
        Median age of onset 9 years, interquartile range 7-12 years, with about
        5% of individuals presenting after age 30. Only onset_category is set:
        the source reports a median and an interquartile range, and putting 9
        into mean_age_years or 7/12 into min_age_years/max_age_years would
        relabel a median as a mean and quartile bounds as extremes. The numbers
        are kept here verbatim instead, and both are carried by their own
        evidence items on this phenotype.
  sequelae:
  - target: Generalized dystonia
    description: >-
      Limb-onset dystonia spreads over months to years to other limbs and the
      trunk, particularly when onset was in a leg.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia typically begins in a leg or arm. While onset can occur in axial, cervical, or cranial regions, these are far less common than onset in a limb."
    explanation: >-
      States the limb-onset pattern and that non-limb onset is much less common,
      which is the defining clinical fact of this entity.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DYT1-TOR1A is an isolated dystonia with onset typically in childhood (median age of onset: 9 years; interquartile range: 7-12 years)."
    explanation: >-
      Supplies the onset age distribution and records that the dystonia is
      isolated rather than part of a complex syndrome.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "About 5% of individuals have onset after age 30 years."
    explanation: >-
      Quantifies the adult-onset minority, which bounds how far the entity's
      "early-onset" name can be relied on diagnostically. REVIEW_SYNTHESIS
      because GeneReviews is summarising the published cohorts rather than
      reporting its own series; evidence_source stays HUMAN_CLINICAL because the
      figure describes human patients.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially, dystonia is typically triggered by specific actions, presenting as a change in gait (e.g., foot inversion or abnormal flexion of the knee or hip) or as writer's cramp"
    explanation: >-
      Describes the action-specific character of the earliest signs, which is why
      the presentation is often mistaken for an orthopaedic or functional problem.
  - reference: PMID:33488508
    reference_title: "Pallidal Deep Brain Stimulation for Monogenic Dystonia: The Effect of Gene on Outcome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "typically begins between 9 and 12 years in a limb then spreads to become generalized with relative sparing of cervical and bulbar segments"
    explanation: >-
      Independent statement of the onset region and the relative cervical/bulbar
      sparing that distinguishes this entity from DYT6. Graded OTHER because the
      publication is a narrative review of DBS outcomes, and marked BACKGROUND
      because this sentence sets up the clinical entity rather than reporting the
      review's own analysis.
- category: Neurologic
  name: Generalized dystonia
  description: >-
    The characteristic endpoint in most affected individuals: dystonic movements
    lose their action specificity, appear at rest, and spread from the originally
    affected limb to other limbs and the trunk over months to years. Progression
    is particularly common when onset was in a leg. Once established, dystonic
    movements usually persist for life.
  phenotype_term:
    preferred_term: Generalized dystonia
    term:
      id: HP:0007325
      label: Generalized dystonia
    clinical_course: PROGRESSIVE
  sequelae:
  - target: Joint contracture
    description: >-
      Sustained dystonic posturing holds joints outside their normal range for
      long periods, so fixed contracture develops as a secondary musculoskeletal
      consequence of the movement disorder rather than as a feature of it.
      GeneReviews names joint contracture among the long-term orthopedic
      complications that timely treatment is meant to prevent.
  - target: Kyphoscoliosis
    description: >-
      Axial and truncal dystonia imposes asymmetric sustained load on the growing
      spine, so spinal deformity follows in a proportion of patients. This edge is
      why the entry treats early referral as more than a comfort argument: the
      deformity, once fixed, is not reversed by later stimulation.
  - target: Hip dislocation
    description: >-
      Dystonic posturing at the hip during skeletal growth can displace the joint,
      the third of the secondary orthopedic complications GeneReviews names as a
      target of physiatry and physical therapy.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dystonia can also spread to other body regions, progressing over months to years to \"generalized dystonia\" involving other limbs and the trunk. In individuals with onset in a leg, progression of dystonia is common."
    explanation: >-
      States the generalization process, its time course, and that leg onset
      predicts it - the basis for the PROGRESSIVE clinical course.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once dystonic movements appear, they usually persist lifelong."
    explanation: >-
      Establishes persistence, which together with the absence of degeneration
      characterizes the disease as a stable acquired motor disability rather than
      a progressive neurological decline.
- category: Neurologic
  name: Writer's cramp
  description: >-
    Task-specific upper-limb dystonia presenting as tightening or abnormal
    posturing of the hand and arm during writing. It is one of the two
    characteristic presenting forms, and is also the form in which disease most
    often remains restricted when it does not generalize.
  phenotype_term:
    preferred_term: Writer's cramp
    term:
      id: HP:0002356
      label: Writer's cramp
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "writer's cramp, characterized by tightening and/or posturing of the hand or arm with writing"
    explanation: Describes the task-specific upper-limb presentation.
- category: Neurologic
  name: Persistent focal dystonia
  description: >-
    Not every carrier who manifests generalizes. In about one in five affected
    individuals the dystonia stays confined to a single body region, most often as
    writer's cramp. This is a distinct outcome from non-penetrance: these
    individuals do have dystonia, it simply does not spread.
  phenotype_term:
    preferred_term: Focal dystonia
    term:
      id: HP:0004373
      label: Focal dystonia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In approximately 20% of individuals dystonia remains restricted to a single body region, most often as writer's cramp."
    explanation: >-
      Supplies both the phenotype and the ~20% figure, which is the basis for the
      OCCASIONAL (5-29%) frequency band rather than a separate qualitative
      judgement.
- category: Neurologic
  name: Gait disturbance
  description: >-
    Abnormal gait is the most common way leg-onset disease first presents, with
    foot inversion or abnormal flexion of the knee or hip appearing during
    walking before dystonia is evident at rest. Gait also responds least well to
    pallidal stimulation, so it is often the residual disability after treatment.
  phenotype_term:
    preferred_term: Dystonic gait disturbance
    term:
      id: HP:0001288
      label: Gait disturbance
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presenting as a change in gait (e.g., foot inversion or abnormal flexion of the knee or hip)"
    explanation: Describes the specific gait abnormality of leg-onset disease.
- category: Neurocognitive
  name: Largely preserved cognition with isolated executive dysfunction
  description: >-
    Cognition in DYT1 dystonia is largely intact. This is a defining negative
    feature - it is what makes the disease an isolated dystonia rather than a
    complex neurodevelopmental syndrome, and it separates this entry from
    KMT2B-related dystonia, where developmental delay and intellectual disability
    are usual. The qualification is that isolated executive dysfunction is
    reported, and that abnormal temporal and spatial discrimination thresholds are
    present in unaffected relatives and non-manifesting carriers as well, so they
    are endophenotypes of the genotype rather than consequences of the dystonia.
    Note that high-dose anticholinergic treatment can itself impair memory, so a
    cognitive complaint in a treated patient is not necessarily disease-related.
  phenotype_term:
    preferred_term: Isolated executive dysfunction on a background of intact cognition
    term:
      id: HP:0033051
      label: Impaired executive functioning
  evidence:
  - reference: PMID:28627117
    reference_title: The cognitive features of idiopathic and DYT1 dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In idiopathic or DYT1 dystonia, cognition is largely intact with only isolated executive dysfunction."
    explanation: >-
      States both halves of the claim - that cognition is broadly preserved and
      that the exception is executive function. REVIEW_SYNTHESIS because the
      publication is a literature review rather than a primary cognitive study.
  - reference: PMID:28627117
    reference_title: The cognitive features of idiopathic and DYT1 dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "considered endophenotypes of the disorder because deficits are also shown by unaffected relatives and nonmanifesting carriers of the DYT1 mutation"
    explanation: >-
      Supports treating the discrimination-threshold abnormalities as
      genotype-linked endophenotypes present without manifest dystonia, rather
      than as cognitive sequelae of the movement disorder.
  - reference: PMID:28627117
    reference_title: The cognitive features of idiopathic and DYT1 dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Anticholinergic medication in high doses can be associated with memory impairment in dystonia."
    explanation: >-
      Supports the treatment-related confounder noted in the description, which
      matters because high-dose trihexyphenidyl is standard therapy here.
- category: Neurologic
  name: Status dystonicus
  description: >-
    The one manifestation of this disease that is an emergency. Status dystonicus
    is a crescendo of generalized dystonic contractions severe enough to require
    emergent hospitalization, and it carries a risk of rhabdomyolysis, respiratory
    compromise and metabolic decompensation. In DYT-TOR1A it occurs but is not
    common, and recording it is a deliberate counterweight to the rest of this
    entry: a disease with normal cognition, normal life span and no degeneration
    still has a state in which a patient can die.
  phenotype_term:
    preferred_term: Status dystonicus
  review_notes: >-
    No ontology term is bound, and this is a recorded negative rather than an
    omission. HPO was searched through the working ols:hp adapter for
    `l~dystonicus`, `l~status dystonicus`, `l~dystonic storm`, `l~dystonic
    crisis` and `l~dystonic attack`; all five returned nothing, while the control
    search `l~dystonia` on the same adapter returned 17 terms (HP:0001332,
    HP:0002530, HP:0007325, HP:0012179, HP:0031008, HP:0002268, HP:0031007,
    HP:0012048, HP:0002451, HP:0004373, HP:0012049, HP:0031959, HP:0031960 and
    four seizure-with-dystonia terms), so the negative result is a fact about
    HPO and not about the adapter. HP:0001332 Dystonia was considered and
    rejected: it names the sign this entry already binds at several levels of
    specificity and would say nothing about the emergency state, which is the
    whole content of this phenotype.

    frequency is also deliberately absent. The source says only "can occur but
    is not common", and every band in FrequencyEnum carries a numeric range
    (OCCASIONAL 5-29%, VERY_RARE <5%), so selecting one would manufacture a
    figure the source does not give. Contrast the Persistent focal dystonia
    phenotype in this entry, whose OCCASIONAL band rests on an explicit
    "approximately 20%".

    No causal edge points at this node. "The most severe manifestation of
    dystonia" is dystonia at its extreme rather than a downstream consequence of
    it, so a sequela edge from Generalized dystonia would assert an escalation
    relation the source does not state.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Status dystonicus, the most severe manifestation of dystonia that requires emergent hospitalization, can occur but is not common in DYT-TOR1A."
    explanation: >-
      States the phenotype, its severity, the level of care it demands, and that
      it is uncommon in this specific genotype rather than in dystonia at large.
      REVIEW_SYNTHESIS because GeneReviews is summarising the reported cohorts.
- category: Musculoskeletal
  name: Joint contracture
  description: >-
    Fixed shortening of muscle and joint capsule following prolonged dystonic
    posturing. This is a secondary complication of the movement disorder rather
    than a primary feature of the genotype, which is exactly why it belongs in the
    entry: it is the part of the disability that is preventable, and preventing it
    is the stated reason for treating and referring early rather than waiting.
  phenotype_term:
    preferred_term: Joint contracture
    term:
      id: HP:0034392
      label: Joint contracture
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Timely medical intervention and appropriate referral for consideration of globus pallidus internus deep brain stimulation is recommended to optimally treat manifestations, minimize disability, and prevent long-term orthopedic complications such as joint contractures or spine deformities."
    explanation: >-
      Names joint contracture as a long-term orthopedic complication of untreated
      disease. INDIRECT because the sentence is framed as a treatment goal, and
      the occurrence of the complication follows from its being something
      treatment is meant to prevent; OTHER because a GeneReviews management
      recommendation is expert guidance rather than a reported study.
- category: Musculoskeletal
  name: Kyphoscoliosis
  description: >-
    Spinal deformity arising from sustained asymmetric dystonic load on the axial
    skeleton during growth. Like contracture it is a secondary consequence, and it
    is the one that most sharply limits what late intervention can achieve: once
    the curve is structural, relieving the dystonia that produced it does not undo
    it.
  phenotype_term:
    preferred_term: Kyphoscoliosis
    term:
      id: HP:0002751
      label: Kyphoscoliosis
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Physiatry and physical therapy to tailor exercise programs to maintain function and prevent secondary orthopedic complications (e.g., joint contractures, hip dislocation, and/or kyphoscoliosis), provide adaptative aids, and support and maintain ambulation"
    explanation: >-
      Names kyphoscoliosis specifically among the secondary orthopedic
      complications that physiatry and physical therapy are directed at, which is
      more precise than the same chapter's "spine deformities" phrasing.
      INDIRECT and OTHER for the same reasons as the contracture item.
- category: Musculoskeletal
  name: Hip dislocation
  description: >-
    Displacement of the hip joint under sustained dystonic posturing during
    skeletal growth. The third of the secondary orthopedic complications named as
    a target of physiatry and physical therapy, and the one most directly tied to
    loss of ambulation.
  phenotype_term:
    preferred_term: Hip dislocation
    term:
      id: HP:0002827
      label: Hip dislocation
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Physiatry and physical therapy to tailor exercise programs to maintain function and prevent secondary orthopedic complications (e.g., joint contractures, hip dislocation, and/or kyphoscoliosis), provide adaptative aids, and support and maintain ambulation"
    explanation: >-
      Names hip dislocation among the secondary orthopedic complications that
      rehabilitation is directed at preventing, and ties the prevention goal to
      maintaining ambulation. INDIRECT and OTHER as above.
genetic:
- name: TOR1A
  gene_term:
    preferred_term: TOR1A
    term:
      id: hgnc:3098
      label: TOR1A
  relationship_type: CAUSATIVE
  notes: >-
    TOR1A on chromosome 9q34 encodes torsinA, an AAA+ ATPase of the endoplasmic
    reticulum lumen and perinuclear space. The disease is caused almost entirely
    by one recurrent allele - the in-frame c.907_909delGAG deletion in exon 5,
    removing a single glutamate from a conserved C-terminal region - which is
    found in more than 98% of affected individuals and has arisen independently in
    several ethnic populations. In Ashkenazi Jews a single founder copy of that
    allele, roughly 350 years old, accounts for more than 90% of early-onset
    cases. Carriers are heterozygous; penetrance is about 30%.
  review_notes: >-
    TOR1A is hgnc:3098, verified against the local HGNC build and independently
    against MONDO's own RO:0004003 causal-gene relation for MONDO:0007492. It is
    not TOR1AIP1 (hgnc:29456) or TOR1AIP2 (hgnc:24055), which encode the LAP1
    cofactor family and are separate disease genes.
  evidence:
  - reference: PMID:9288096
    reference_title: "The early-onset torsion dystonia gene (DYT1) encodes an ATP-binding protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identifies the DYT1 gene on human chromosome 9q34 as being responsible for this dominant disease."
    explanation: >-
      The gene-identification paper establishing the causal locus and the dominant
      mode of transmission.
  - reference: PMID:9288096
    reference_title: "The early-onset torsion dystonia gene (DYT1) encodes an ATP-binding protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all cases of early-onset dystonia have a unique 3-bp deletion that appears to have arisen idependently in different ethnic populations."
    explanation: >-
      Establishes that one recurrent allele accounts for nearly all disease and
      that it is recurrent rather than descended from a single global founder.
      Quoted verbatim including the source's typographical error in
      "idependently", as an evidence snippet must never be corrected.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DYT-TOR1A is established in a proband with suggestive findings and a heterozygous pathogenic variant in TOR1A identified by molecular genetic testing."
    explanation: >-
      States the diagnostic criterion and the heterozygous state of the causal
      variant.
  - reference: PMID:7719342
    reference_title: "Genetic analysis of idiopathic torsion dystonia in Ashkenazi Jews and their recent descent from a small founder population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data show that the vast majority (> 90%) of early-onset ITD cases in the Ashkenazi population are due to a single founder mutation, which we estimate first appeared approximately 350 years ago."
    explanation: >-
      Establishes the Ashkenazi founder effect, which coexists with the recurrent
      origin of the same deletion elsewhere.
- name: TOR1A p.D216H
  gene_term:
    preferred_term: TOR1A
    term:
      id: hgnc:3098
      label: TOR1A
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  association: >-
    Intragenic modifier of penetrance of the c.907_909delGAG allele. The 216H
    allele carried in trans is highly protective; the D216 allele in cis appears
    to be required for the deletion to be penetrant.
  notes: >-
    D216H (rs1801968) is a common coding polymorphism in TOR1A itself - the same
    gene as the causative allele, which is why the effect is described as
    intragenic rather than as a second locus. The histidine allele is present on
    roughly 12% of control chromosomes, so this is ordinary population variation
    rather than a rare modifier allele.

    The direction is protective, and the effect is phase-dependent, which is the
    unusual part. In a case-control comparison of manifesting against
    non-manifesting GAG-deletion carriers, the 216H allele was enriched in
    carriers without dystonia and depleted in carriers with it; haplotype
    analysis localized the protective effect to the H allele in trans with the
    deletion, with suggestive evidence that D216 in cis is needed for penetrance
    at all. The authors' derived figures are a penetrance of about 35% for a
    carrier with D216 in trans against about 3% for one with 216H.

    relationship_type is MODIFIER rather than PROTECTIVE because the claim is
    about penetrance of another allele rather than about risk of disease in the
    general population, and because "gene modifier" is the cited study's own
    framing. Both values would be defensible; MODIFIER is the one that matches
    what the evidence measures.

    This does not close the penetrance question, and the entry does not let it
    look as though it does. The same paper states that 216H explains only a small
    proportion of the reduced penetrance and that nearly all manifesting carriers
    were D216 homozygotes, so what modulates severity among those who do manifest
    is still unaccounted for. That is recorded on the
    dyt1_reduced_penetrance_determinants discussion, which this record reworded
    rather than removed.
  review_notes: >-
    hgnc:3098 is the same identifier as the causative record above, deliberately:
    D216H lies in TOR1A. The CURIE and label were read from cache/hgnc/terms.csv
    in the same step as writing them, not recalled.

    The primary paper was located by independent PubMed search and fetched with
    `just fetch-reference PMID:17503336`; the cache carries green open-access
    full text from PMC, and its title, journal, year and content were read before
    quoting. It was not taken on trust from a citation supplied in review.
  evidence:
  - reference: PMID:17503336
    reference_title: "Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion dystonia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Analysis of haplotypes demonstrated a highly protective effect of the H allele in trans with the GAG deletion; there was also suggestive evidence that the D216 allele in cis is required for the disease to be penetrant."
    explanation: >-
      The result that establishes the modifier and, unusually, its phase
      dependence - protective in trans, permissive in cis. This is the sentence
      the MODIFIER classification rests on.
  - reference: PMID:17503336
    reference_title: "Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion dystonia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "found the frequency of the 216H allele to be increased in GAG-deletion carriers without dystonia and to be decreased in carriers with dystonia, compared with the control individuals"
    explanation: >-
      The underlying observation: the protective allele is enriched in
      non-manifesting carriers and depleted in manifesting ones, measured against
      controls. Cited separately from the haplotype analysis because it is the
      raw association rather than the phase-resolved inference drawn from it.
  - reference: PMID:17503336
    reference_title: "Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion dystonia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Our findings establish, for the first time, a clinically relevant gene modifier of DYT1."
    explanation: >-
      The authors' own characterization of what they found, which is where the
      MODIFIER relationship_type and the word "modifier" in this record come
      from rather than from a curator's paraphrase.
environmental:
- name: Immobilization of a dystonic body part by bracing or casting
  description: >-
    The one iatrogenic circumstance GeneReviews tells clinicians to avoid in this
    disease. Splinting, bracing or casting a limb affected by dystonia - the
    intuitive orthopaedic response to a fixed abnormal posture, and a plausible
    one given that contracture and spinal deformity are real complications here -
    can make the dystonia worse. It is modelled as an environmental influence
    rather than buried in a treatment note because it is an exposure the patient
    undergoes, it has a direction of effect, and it acts on a named node of this
    entry's pathograph.

    The exception the source preserves is "unless medically necessary": this is
    not a prohibition, for instance after a fracture, but a caution against
    immobilization chosen as a way of managing the dystonia itself. The practical
    corollary sits with the rehabilitation entries in `treatments:` - the
    GeneReviews management pathway is active exercise programmes and adaptive
    aids, not restraint.
  influences_mechanisms:
  - target: Limb-onset dystonia
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Immobilizing the affected part worsens the dystonia in that part. The link
      is drawn to the limb-onset node because the limb is what gets braced or
      cast, but the source states it for any body region affected by dystonia.
    evidence:
    - reference: PMID:20301665
      reference_title: DYT-TOR1A.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Unless medically necessary, avoid immobilization with bracing or casting of the parts of the body affected by dystonia, which can worsen dystonia."
      explanation: >-
        States the exacerbating effect of the exposure on the dystonia directly,
        which is what the EXACERBATES predicate on this link asserts, and
        preserves the medical-necessity exception.
  review_notes: >-
    No exposure_term is bound, and this is a recorded negative rather than an
    un-researched gap. ECTO was searched through the ols:ecto adapter for
    `l~immobil`, `l~immobilization`, `l~immobilisation`, `l~brace`, `l~cast`,
    `l~splint`, `l~orthosis`, `l~orthotic`, `l~restraint` and `l~bandage`; every
    one returned nothing. The control search `l~arsenic` on the same adapter
    returned seven terms (ECTO:7000087, ECTO:0080000, ECTO:0900004, ECTO:0900207,
    ECTO:9000032, ECTO:9002355, ECTO:9002674), so the empty results are a fact
    about ECTO rather than a broken adapter or an unpopulated local cache.

    `l~plaster` does return ECTO:7000038 exposure to plaster, with children
    ECTO:7000039 exposure to cement plaster and ECTO:7000040 exposure to lime
    plaster. It is rejected on positive grounds: that branch is occupational
    contact with plaster as a building material, not a limb held in a plaster
    cast, so binding it would assert the wrong exposure. No term beats a wrong
    one, and exposure_term is omitted entirely rather than left as a free-text
    preferred_term, which would read as grounded without being grounded.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Unless medically necessary, avoid immobilization with bracing or casting of the parts of the body affected by dystonia, which can worsen dystonia."
    explanation: >-
      The GeneReviews "Agents/circumstances to avoid" recommendation, which is the
      entire basis for this record. Graded OTHER because it is expert management
      guidance rather than a reported study, and REVIEW_SYNTHESIS because the
      chapter is synthesising practice it did not itself measure.
treatments:
- name: Bilateral pallidal deep brain stimulation
  description: >-
    Chronic high-frequency electrical stimulation delivered through electrodes
    implanted bilaterally in the internal globus pallidus. This is the defining
    intervention for the disease and the reason DYT1 dystonia, despite having no
    disease-modifying therapy, is one of the more treatable severe movement
    disorders. Efficacy in generalized and segmental dystonia is established by a
    randomized sham-controlled trial, and DYT1-specific series report large
    sustained improvements in Burke-Fahn-Marsden movement scores. Shorter disease
    duration predicts better outcome, which is the practical argument for early
    referral rather than a last resort after years of failed medication. It is
    symptomatic: it modulates network output and does nothing about torsinA.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: bilateral globus pallidus internus deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Basal Ganglia and Cerebellothalamocortical Network Dysfunction
    description: >-
      Stimulation is delivered into the pallidal output node of the network this
      entry identifies as the convergence point, altering its signalling. That
      the intervention works at this node is also the main indirect argument for
      placing the node on the causal path to the movement disorder.
  - target: Generalized dystonia
    description: >-
      The clinical target: large reductions in Burke-Fahn-Marsden movement and
      disability scores across the generalized distribution.
  notes: >-
    NCIT:C21024 is an action term reachable from NCIT:C25218 (via NCIT:C49236
    Therapeutic Procedure, checked with runoak), so it sits in the TreatmentTerm
    slot legitimately and no device-term workaround is needed here - unlike the
    cochlear-implant case, where the obvious NCIT term names equipment. No
    separate device qualifier is attached because the action term already names
    the intervention at the right granularity; the implanted pulse generator is
    not a distinct therapeutic claim.

    The KB binds NCIT:C21024 with therapeutic_modality DEVICE in all 19 other
    entries that use it, including Cervical_Dystonia and Torsion_Dystonia_6, and
    this entry follows that convention.
  evidence:
  - reference: PMID:17093249
    reference_title: "Pallidal deep-brain stimulation in primary generalized or segmental dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral pallidal neurostimulation for 3 months was more effective than sham stimulation in patients with primary generalized or segmental dystonia."
    explanation: >-
      The randomized sham-controlled result, which is the highest-quality
      evidence available for this intervention and the reason it is stated
      without hedging.
  - reference: PMID:17093249
    reference_title: "Pallidal deep-brain stimulation in primary generalized or segmental dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three months after randomization, the change from baseline in the mean (+/-SD) movement score was significantly greater in the neurostimulation group (-15.8+/-14.1 points) than in the sham-stimulation group (-1.4+/-3.8 points, P<0.001)."
    explanation: >-
      Quantifies the effect against sham on the Burke-Fahn-Marsden movement
      subscore, the standard outcome measure in this field.
  - reference: PMID:22811083
    reference_title: "Shorter disease duration correlates with improved long-term deep brain stimulation outcomes in young-onset DYT1 dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pallidal DBS was well tolerated and highly effective, with mean Burke-Fahn-Marsden Dystonia Rating Scale movement scores improving from baseline by 61.5% (P < .001) at 1 year, 64.4% (P < .001) at 2 years, and 70.3% (P < .001) at the final follow-up visit"
    explanation: >-
      DYT1-genotyped long-term outcome data, establishing that the benefit is
      large and sustained rather than transient - the sham-controlled trial above
      was only three months and was not genotype-restricted.
  - reference: PMID:22811083
    reference_title: "Shorter disease duration correlates with improved long-term deep brain stimulation outcomes in young-onset DYT1 dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings highlight the sustained benefit from DBS and the importance of early referral for DBS in children with medically refractory DYT1 primary torsion dystonia, which can lead to improved long-term benefits."
    explanation: >-
      Supports the early-referral recommendation, which is the clinically
      actionable consequence of duration predicting outcome.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Timely medical intervention and appropriate referral for consideration of globus pallidus internus deep brain stimulation is recommended to optimally treat manifestations, minimize disability, and prevent long-term orthopedic complications such as joint contractures or spine deformities."
    explanation: >-
      The authoritative source for the early-referral point, which until now
      rested in this entry on a single-centre outcome series (PMID:22811083). It
      also adds a reason for referring early that the outcome series does not
      give: not only that the stimulation works better with shorter disease
      duration, but that waiting allows fixed orthopedic complications to
      accumulate, which relieving the dystonia afterwards does not undo. Those
      complications are curated as sequelae of Generalized dystonia. Graded OTHER
      and REVIEW_SYNTHESIS because a GeneReviews management recommendation is
      expert guidance rather than a study reporting data.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A movement disorder specialist should be involved at an early stage to discuss pharmacologic and/or surgical treatment options to relieve manifestations of dystonia."
    explanation: >-
      Records that the referral pathway begins with specialist involvement rather
      than with the operation, which is what makes "early referral" actionable for
      the general paediatrician or neurologist who sees the child first. INDIRECT
      because the sentence is about who should decide rather than about this
      intervention's effect.
  - reference: PMID:33488508
    reference_title: "Pallidal Deep Brain Stimulation for Monogenic Dystonia: The Effect of Gene on Outcome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "They found DYT1 patients improved by 67.5% in BFMDS compared with 55.8% for non-DYT, and in multivariate analysis DYT1 was in independent predictor of superior outcome, along with shorter disease duration and lower baseline severity score"
    explanation: >-
      Records the meta-regression finding that the DYT1 genotype itself predicts
      better response. INDIRECT and REVIEW_SYNTHESIS because the quote is this
      review's account of another group's meta-regression rather than its own
      measurement. Quoted verbatim including the source's "was in independent
      predictor" typographical error.
  - reference: PMID:33488508
    reference_title: "Pallidal Deep Brain Stimulation for Monogenic Dystonia: The Effect of Gene on Outcome."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "there are important exceptions where secondary worsening of dystonia may occur"
    explanation: >-
      Recorded as REFUTE against an unqualified reading of durable benefit. A
      recognised subgroup deteriorates years after an initially good response, so
      the sustained-benefit claim above is not universal. Kept as its own item
      rather than folded into an explanation, because it cuts the other way.
- name: Trihexyphenidyl
  description: >-
    High-dose oral trihexyphenidyl, a non-selective muscarinic acetylcholine
    receptor antagonist, is the preferred small-molecule treatment. Its rationale
    is mechanistic rather than incidental: striatal cholinergic interneurons are
    the cell type implicated by the mouse work in this entry, and antimuscarinic
    treatment reduces dystonic movements in those mice. In Dyt1 knock-in mice
    trihexyphenidyl also restores the reduced striatal dopamine release, through
    a nicotinic-receptor-dependent route, which links the drug to two of the
    nodes above. Its limitation is tolerability: the doses needed are high and
    antimuscarinic side effects are dose-limiting, including memory impairment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trihexyphenidyl
      term:
        id: CHEBI:9720
        label: Trihexyphenidyl
  target_mechanisms:
  - target: Striatal Cholinergic Interneuron Dysfunction
    description: >-
      Muscarinic blockade acts directly on the striatal cholinergic node, which
      is the node the drug's mechanism of action is defined against.
  - target: Reduced Striatal Dopamine Release
    description: >-
      Trihexyphenidyl restores dopamine release in Dyt1 knock-in mice via
      nicotinic receptors, so it also acts on the dopaminergic node downstream.
  evidence:
  - reference: PMID:30707939
    reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Trihexyphenidyl, a nonselective muscarinic receptor antagonist, is the small molecule drug of choice for the treatment of DYT1 dystonia, but it is poorly tolerated due to significant side effects."
    explanation: >-
      States both the drug's first-line status in this specific disease and its
      tolerability limitation. Marked BACKGROUND because the sentence is the
      paper's framing of clinical practice, not a result of its rodent
      experiments; evidence_source stays MODEL_ORGANISM because the publication
      is a mouse study.
  - reference: PMID:30707939
    reference_title: "Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model of DYT1 dystonia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "THP restored DA release in Dyt1 mice through a nAChR-dependent mechanism, suggesting a mechanism of action for THP in the treatment of dystonia and identifying nAChRs as a therapeutic target."
    explanation: >-
      Supplies the mechanism of action behind the second target_mechanisms link.
      INDIRECT because the demonstration is in mouse striatal slices and in vivo
      microdialysis, so its application to the human drug effect is an inference.
  - reference: PMID:26052670
    reference_title: "Forebrain deletion of the dystonia protein torsinA causes dystonic-like movements and loss of striatal cholinergic neurons."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "murine dystonic-like movements are reduced significantly with an antimuscarinic agent used clinically"
    explanation: >-
      Behavioural evidence that antimuscarinic treatment works on the movements
      themselves, not only on a neurochemical readout. INDIRECT because the
      result is in a conditional-knockout mouse rather than in patients.
- name: Botulinum toxin chemodenervation
  description: >-
    Intramuscular botulinum neurotoxin injection into individually disabling
    dystonic muscles. In a generalized dystonia it cannot address the whole
    distribution, so its role here is adjunctive - targeting a residual focal
    problem, including one persisting after pallidal stimulation - rather than
    primary. It acts at the neuromuscular junction, the furthest possible point
    downstream of the torsinA lesion.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: botulinum toxin chemodenervation
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
  target_mechanisms:
  - target: Limb-onset dystonia
    description: >-
      Blocks acetylcholine release at the neuromuscular junction of the injected
      muscle, reducing contraction in that muscle only. Purely symptomatic and
      distal to every mechanistic node in this entry.
  notes: >-
    therapeutic_modality is OTHER rather than SMALL_MOLECULE: botulinum
    neurotoxin is a ~150 kDa bacterial protein, so SMALL_MOLECULE would be
    factually wrong and PEPTIDE nearly as wrong at that size. This follows the
    reasoning recorded on the same treatment in Torsion_Dystonia_6, which also
    notes that the KB is inconsistent on this point.

    therapeutic_agent is left absent. NCIT:C163032 Botulinum Toxin exists, but
    the cited source is a cognitive-outcomes review that names the modality
    without specifying a serotype or product, so binding a specific agent would
    assert more than the evidence carries.
  evidence:
  - reference: PMID:28627117
    reference_title: The cognitive features of idiopathic and DYT1 dystonia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The successful treatment of dystonia with botulinum toxin injections or deep brain stimulation does not produce any major adverse effects on cognition."
    explanation: >-
      The only quotable statement in the fetched reference set that bears on
      botulinum toxin in this disease. It establishes that the treatment is used
      and can be successful, and that it does not carry a cognitive penalty -
      relevant given that the oral alternative does. INDIRECT because the
      sentence is about cognitive safety rather than motor efficacy, and no
      motor-efficacy quote for botulinum toxin in DYT1 specifically was found in
      the references fetched for this entry.
- name: Physiatry and physical therapy
  description: >-
    Tailored exercise programmes, adaptive aids and gait support, directed by
    physical medicine and rehabilitation. Its purpose here is specific and worth
    stating precisely: it does not treat the dystonia, it treats what sustained
    dystonic posturing does to the musculoskeletal system. That makes it the one
    intervention in this entry aimed at the secondary complications - contracture,
    hip displacement, spinal deformity - rather than at the movement disorder,
    which is also why it runs alongside pallidal stimulation rather than competing
    with it.

    Note the direction of the contrast with the environmental record in this
    entry: the rehabilitation pathway is active exercise and adaptation, whereas
    immobilizing a dystonic part can worsen the dystonia.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physiatry and physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Joint contracture
    description: >-
      Range-of-motion and stretching programmes are directed at preventing fixed
      contracture in joints held in sustained dystonic posture.
  - target: Kyphoscoliosis
    description: >-
      Postural and trunk-directed exercise is aimed at limiting the spinal
      deformity that asymmetric axial dystonic load produces during growth.
  - target: Hip dislocation
    description: >-
      Positioning and strengthening are directed at keeping the hip loaded
      normally enough to prevent displacement.
  - target: Gait disturbance
    description: >-
      Gait training and adaptive aids support and maintain ambulation, which the
      source names as an explicit goal of physical therapy. Relevant because gait
      is also the feature that responds least well to pallidal stimulation and so
      is often the residual disability.
  notes: >-
    therapeutic_modality is BEHAVIORAL on the mechanical rule in CLAUDE.md, which
    maps NCIT:C15302 physical therapy to that value. It reads oddly for an
    exercise programme, but the enum's own definition of BEHAVIORAL explicitly
    covers a "behavioral, physical, dietary, or lifestyle intervention", so
    physical therapy is inside it by definition rather than by stretch.

    preferred_term is deliberately more specific than the bound label: the
    intervention as GeneReviews describes it is physiatry directing physical
    therapy, and NCIT:C15302 names only the therapy. The specificity is carried in
    preferred_term rather than by reaching for a term that does not mean this.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Physiatry and physical therapy to tailor exercise programs to maintain function and prevent secondary orthopedic complications (e.g., joint contractures, hip dislocation, and/or kyphoscoliosis), provide adaptative aids, and support and maintain ambulation"
    explanation: >-
      Establishes the intervention, its four stated goals, and the three specific
      complications it is directed against - which is where this treatment's
      target_mechanisms links come from rather than from a curator's inference
      about what rehabilitation is for. Graded OTHER and REVIEW_SYNTHESIS as
      expert management guidance. Quoted verbatim including the chapter's
      "adaptative" for adaptive.
- name: Occupational therapy
  description: >-
    Therapy directed at the fine motor tasks of daily life - feeding, grooming,
    dressing and writing. It matters disproportionately in this disease because
    writing is both a common presenting complaint and, in the roughly one in five
    patients whose dystonia stays focal, often the whole of the disability.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  target_mechanisms:
  - target: Writer's cramp
    description: >-
      Writing is one of the fine motor skills the source names as an explicit
      target of occupational therapy, and writer's cramp is the form this
      entry's task-specific upper-limb dystonia takes.
  notes: >-
    therapeutic_modality is BEHAVIORAL on the same mechanical rule that covers
    physical therapy, which maps NCIT:C121351 occupational therapy to that value.
    therapeutic_agent is absent because the intervention is non-pharmacological.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "occupational therapy to address fine motor skills (e.g., feeding, grooming, dressing, and writing)"
    explanation: >-
      Names the intervention and the fine motor domains it addresses, including
      writing, which is the basis for the link to writer's cramp. Graded OTHER and
      REVIEW_SYNTHESIS as expert management guidance.
diagnosis:
- name: Targeted TOR1A molecular genetic testing
  description: >-
    The diagnosis is established by finding a heterozygous pathogenic TOR1A
    variant in a proband with a suggestive clinical picture. This disease is
    unusually favourable for targeted testing rather than panel or exome
    sequencing, because more than 98% of affected individuals carry the same
    c.907_909delGAG allele - so a single-variant assay answers the question in
    nearly every case, and a negative targeted result is informative rather than
    merely uninformative.

    Two consequences of the genetics govern how the result is read, and both are
    curated elsewhere in this entry. Penetrance is about 30%, so identifying the
    variant in a relative predicts dystonia in a minority of carriers and an
    unaffected parent cannot be assumed to be a non-carrier. And about 5% of
    affected individuals present after age 30, so a later presentation does not
    exclude the diagnosis.
  diagnosis_term:
    preferred_term: targeted TOR1A single-variant molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  notes: >-
    NCIT:C15709 Genetic Testing was checked against cache/ncit/terms.csv for its
    label and against the treatmentactionterm enum cache for membership in the
    dynamic enum that diagnosis_term binds to, which is reachable from NCIT:C25218
    Clinical Intervention or Procedure. preferred_term carries the specificity the
    action term does not - that the assay is targeted at one variant in one gene
    rather than a broad genomic test.

    A levodopa trial to exclude dopa-responsive dystonia was considered as a second
    diagnostic item and is deliberately not curated, because no fetched source
    states it as a diagnostic step. The GeneReviews chapter does not mention
    levodopa at all, and the only fetched reference that does (PMID:30707939) is a
    mouse study whose levodopa content is a methods paragraph plus the result that
    levodopa does not increase striatal dopamine release. That result is curated
    where it belongs, on the Reduced Striatal Dopamine Release node, and it
    supports the pharmacological contrast with dopa-responsive dystonia without
    supporting a recommendation to perform a trial. Adding the item would have
    meant asserting a diagnostic pathway from a mouse experiment.
  evidence:
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DYT-TOR1A is established in a proband with suggestive findings and a heterozygous pathogenic variant in TOR1A identified by molecular genetic testing."
    explanation: >-
      States the diagnostic criterion - clinical suspicion plus a heterozygous
      pathogenic TOR1A variant on molecular testing - which is what this
      diagnostic item is. The same sentence is cited on the TOR1A genetic record,
      where it supports the gene-disease claim; here it supports the testing
      pathway, and evidence_source is HUMAN_CLINICAL in both places because the
      publication's grading cannot change with the use made of the quote.
  - reference: PMID:20301665
    reference_title: DYT-TOR1A.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 98% of affected individuals have the 3-bp deletion c.907_909delGAG involving the highly conserved GAGGAG sequence in exon 5."
    explanation: >-
      The allelic homogeneity that makes targeted single-variant testing an
      adequate first-line strategy here, where in most Mendelian diseases it
      would not be. INDIRECT because the sentence reports the allele distribution
      and the testing strategy follows from it rather than being stated.
clinical_trials:
- name: NCT00142259
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    The randomized, sham-controlled trial of bilateral internal globus pallidus
    stimulation in primary generalized or segmental dystonia reported by Kupsch
    and colleagues (PMID:17093249). Forty patients received an implanted device
    and were randomized to active or sham stimulation for three months, with
    blinded video assessment, followed by open-label active stimulation for all.
  target_phenotypes:
  - preferred_term: Generalized dystonia
    term:
      id: HP:0007325
      label: Generalized dystonia
  notes: >-
    phase is NOT_APPLICABLE because this is a device study that does not follow
    the FDA drug-phase classification, which is the case that enum value exists
    for. The trial was not restricted to TOR1A carriers, so it establishes
    efficacy for primary generalized and segmental dystonia as a class rather
    than for this genotype specifically; the genotype-specific evidence is the
    DYT1 cohort cited on the treatment.
  evidence:
  - reference: clinicaltrials:NCT00142259
    reference_title: "Randomisierte, Doppelblinde Langzeitstudie Zur Klinischen Wirksamkeit Der Bilateralen Globus Pallidus Internus-Stimulation Bei Idiopathischer Generalisierter Oder Segmentaler Dystonie"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate the efficacy and safety of bilateral deep brain stimulation of the internal globus pallidus for treating idiopathic generalized or severe segmental dystonia."
    explanation: >-
      The registry record establishing the trial's identity, target population
      and intervention. The title is the registry's own German-language official

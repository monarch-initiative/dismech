    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Measures impaired transport of both protein and mRNA cargo in human cells
      carrying the patient genotype, and identifies RANBP17 loss as its
      molecular correlate with a rescue experiment.
    limitations: >-
      Cultured neurons lack the striatal circuitry the disease is about, and the
      cell type studied is a cholinergic motor neuron rather than a striatal
      cholinergic interneuron, so the transport defect is demonstrated in a
      related but not identical vulnerable population.
    readouts:
    - name: Nucleocytoplasmic transport of protein and mRNA cargo

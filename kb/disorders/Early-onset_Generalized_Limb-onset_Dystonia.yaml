discussions:
- discussion_id: dyt1_nuclear_envelope_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Mouse models show perinuclear nuclear-envelope blebs and human patient-derived
    neurons do not, while heterozygous mice show no pathology at all. Which
    nuclear-envelope lesion is the one that occurs in patients, and does any of
    the mouse pathology apply to the human disease?
  attaches_to:
  - pathophysiology#Neuronal Nuclear Envelope Disruption
  - experimental_models#Patient-derived cholinergic motor neurons
  - animal_models#Tor1a heterozygous GAG-deletion knock-in mouse
  rationale: >-
    This is not a generic species caveat but a specific, twofold mismatch that
    bears on the entry's central mechanistic claim.

    First, zygosity. Patients are heterozygous. Mice heterozygous for the
    identical deletion show no pathology, so every mouse result supporting the
    nuclear-envelope account comes from a homozygous null, homozygous knock-in, or
    conditional-deletion genotype that no patient has.

    Second, morphology. Where the mouse shows perinuclear blebs or herniations,
    patient-derived cholinergic motor neurons carrying the heterozygous deletion
    show a thickened lamina, disrupted nuclear shape and LMNB1 dysregulation, and
    explicitly lack the blebs. Both are nuclear envelope pathology and it would be
    easy to treat them as the same finding, but they are different lesions, and
    the mechanism inferred from one does not automatically transfer.

    The consequence for reading this entry: the Neuronal Nuclear Envelope
    Disruption node is well supported as a category and poorly resolved as a
    specific lesion. No patient brain tissue has shown either morphology in vivo,
    which is what would settle it. The human model is not simply better than the
    mouse either - cultured motor neurons lack the striatal circuitry the disease
    is about, and the striatal cholinergic interneuron evidence runs the other
    way, existing in mouse and in postmortem patient striatum but not in the iPSC
    system.
  notes: >-
    Recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence is not absent: both lesions are well documented in their respective
    systems, and the open question is translational validity.
- discussion_id: dyt1_reduced_penetrance_determinants
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do roughly 70% of TOR1A GAG-deletion carriers never develop dystonia,
    when functional imaging shows the same network abnormality in manifesting and
    non-manifesting carriers alike?
  attaches_to:
  - pathophysiology#Basal Ganglia and Cerebellothalamocortical Network Dysfunction
  - inheritance#Autosomal dominant with reduced penetrance
  - genetic#TOR1A p.D216H
  rationale: >-
    Reduced penetrance is usually treated as a counselling fact, but here it is
    also the sharpest mechanistic question in the disease, because the obvious
    candidate explanation has been excluded. Reduced striatal GABA and dopamine
    receptor availability, increased lentiform, supplementary motor area and
    cerebellar metabolism, and an abnormal cerebellothalamocortical pathway are
    all present in carriers irrespective of whether they manifest. So the network
    abnormality this entry places immediately upstream of the movement disorder is
    not sufficient to produce it.

    The systematic review's proposal is that the distinguishing factor lies in the
    distal thalamocortical segment, disrupted in non-manifesting carriers in a way
    that may prevent abnormal impulses reaching cortex, together with larger
    putaminal volumes that appear compensatory and a correspondingly reduced
    response to plasticity-inducing protocols. That is a hypothesis generated from
    cross-sectional imaging of small cohorts rather than an established mechanism.

    One genetic modifier is established, and it is a partial answer rather than
    none. The TOR1A coding polymorphism D216H (rs1801968) modifies penetrance of
    the GAG deletion: the 216H allele carried in trans is highly protective,
    D216 in cis appears to be required for the deletion to be penetrant at all,
    and the derived penetrance estimates are about 35% for a carrier with D216 in
    trans against about 3% for one carrying 216H. It is curated as a MODIFIER
    record in `genetic:`. An earlier version of this discussion stated that no
    genetic modifier had been established, which was wrong, and the claim is
    withdrawn here rather than quietly softened.

    What keeps this a knowledge gap is the size and the scope of that answer,
    stated by the same study that found it. The 216H allele has a potent effect
    but explains only a small proportion of the reduced penetrance, so most of
    the 70% is still unaccounted for. And nearly all manifesting carriers were
    D216 homozygotes, which means the modifier says nothing about the second
    question sitting beside penetrance - why, among those who do manifest,
    severity ranges from writer's cramp that never spreads to generalized
    dystonia. Beyond D216H this entry records no determinant of penetrance, and
    none was found in the sources fetched for it: no environmental trigger, no
    developmental variable, and no further modifier locus.

    Until this is settled, the final edge in this entry - from network dysfunction
    to dystonia - is an association plus a therapeutic argument, and the entry
    says so at that node rather than implying a closed causal chain.
  evidence:
  - reference: PMID:17503336
    reference_title: "Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion dystonia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Although the 216H allele has a potent effect, it explains only a small proportion of the reduced penetrance associated with carrying the DYT1 GAG-deletion mutation."
    explanation: >-
      The authors' own bound on how much their modifier explains, which is what
      keeps reduced penetrance an open question after D216H rather than a solved
      one. Cited on the gap itself so that a reader who sees the MODIFIER record
      in `genetic:` does not conclude the gap has closed.
  - reference: PMID:17503336
    reference_title: "Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion dystonia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Also, almost all manifesting carriers, regardless of severity, were homozygous for the D216 allele, so factors moderating the extent of disease expression in these individuals remain unknown."
    explanation: >-
      States the second, distinct gap in the authors' own words: the modifier
      stratifies who manifests, not how severely. This is the sentence behind the
      variable-expressivity half of this discussion, which is separate from the
      penetrance half and is not addressed by D216H at all.
notes: >-
  Scope and sibling entries. This is the TOR1A/DYT1 Mendelian entity.
  Torsion_Dystonia_6 is its closest relative in the KB and the two are linked
  mechanistically as well as nosologically: THAP1, the DYT6 gene, represses the
  TOR1A core promoter, so that entry carries a "Derepression of TOR1A" node.
  Clinically they separate on onset region - limb here, cranial/cervical and
  laryngeal there - and on DBS response, which is better in DYT1.
  KMT2B-Related_Dystonia is the other major childhood-onset generalized monogenic
  dystonia but is a complex dystonia with developmental delay and intellectual
  disability, where this one is isolated with largely intact cognition.
  Cervical_Dystonia covers common adult-onset sporadic focal disease and
  deliberately binds no causal gene.

  Module conformance. No pathophysiology node declares conforms_to. kb/modules/
  was listed and searched for nuclear envelope, nucleocytoplasmic transport,
  basal ganglia, dystonia and striatal mechanisms; nothing covers nuclear
  envelope dysfunction or basal ganglia motor circuit dysfunction. If a
  nuclear-envelopathy module is created later - the LMNB1 and lamina findings
  here would sit naturally beside the laminopathies - this entry's Neuronal
  Nuclear Envelope Disruption node is the conformance target.

  Prevalence. No population prevalence estimate for the disease is recorded,
  because none was found in a citable form during this curation. What is recorded
  is the Ashkenazi frequency of the founder mutation and the founder share, which
  are different quantities from disease prevalence; the ~30% penetrance means the
  manifesting rate is well below either, and no derived figure is asserted.
  Whether the 1/6,000-1/2,000 figure is a carrier or an allele frequency is not
  resolved by its source, and the prevalence record's own notes say so rather
  than presenting CARRIER_FREQUENCY as a settled reading. The Orphanet record for
  this disease (Orphanet:256, cross-referenced from MONDO:0007492) is not present
  in references_cache and `just fetch-reference ORPHA:256` reports no source for
  it, so the usual Orphanet epidemiology row was not available.

  Deep-research provenance. research/Early-onset_Generalized_Limb-onset_Dystonia-deep-research-claude_code.md
  was used as a prose outline only. Its citations were not usable: of 16 cited
  PMIDs, a title check found 10 unrelated to dystonia (including papers on E. coli
  multidrug transporters, HIV integrase inhibitors, type 1 diabetes and vertebral
  artery stenting), and its own frontmatter records 8 mislabelled ontology terms,
  among them HP:0100260 given as "Segmental dystonia" when it is Mesoaxial
  polydactyly and NCIT:C376 given as baclofen when it is Cisplatin. Every
  reference in this entry was found by independent PubMed search, fetched with
  `just fetch-reference`, and read before quoting; every ontology identifier was
  resolved against an ontology lookup in the same step it was written. Nothing was
  carried over from the report.

  Review round, PR #13194. The GeneReviews chapter was mined for its Management
  and Clinical characteristics sections, which the first pass had used only for
  clinical description and genetics: the chapter is now the authoritative source
  for early pallidal referral, it supplies the physiatry/physical-therapy and
  occupational-therapy records, the immobilization caution in `environmental:`,
  status dystonicus, the adult-onset tail, and the secondary orthopedic
  complications now curated as sequelae of Generalized dystonia. PMID:20301665 is
  tagged as a GeneReviews chapter in `references:`.

  Four judgements in that round went against making a change, each recorded where
  it applies rather than only here. A levodopa-trial diagnostic item was not
  added, because no fetched source states it as a diagnostic step - see the
  `diagnosis:` notes. Status dystonicus is left with no HPO binding and no
  frequency band, because HPO has no term for it and the source gives no
  percentage - see its review_notes for the searches run. The immobilization
  exposure is left with no ECTO binding for the same kind of reason, with the ten
  searches recorded on it. And the prevalence record keeps CARRIER_FREQUENCY while
  its notes now state plainly that the source does not resolve carrier against
  allele frequency, rather than changing the measure to UNKNOWN and discarding a
  magnitude the source does support.

  Two corrections were made to first-pass content rather than additions. The
  penetrance knowledge-gap discussion asserted that no genetic modifier had been
  established; TOR1A D216H is one, so the sentence is withdrawn, the modifier is
  curated in `genetic:`, and the discussion now carries the primary study's own
  statement of how little of the penetrance gap it closes. And the perinuclear-blebs
  readout snippet was a four-word fragment justified by the claim that the source's
  internal quotation marks ended the quotable span; they do not, so the full clause
  is quoted and that explanation is corrected.

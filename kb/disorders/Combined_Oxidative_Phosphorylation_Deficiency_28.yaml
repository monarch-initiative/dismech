notes: >-
  No GeneReviews chapter covers COXPD28 or SLC25A26 deficiency. `just check-genereviews`
  returns NO_CHAPTER for both Bookshelf collections against the committed index (snapshot
  2026-09-10). The phenotype baseline is the index three-family report (PMID:26522469),
  with two later Chinese reports of the same compound-heterozygous pair adding the adult
  end of the spectrum.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Known from a handful of families. Recorded as ULTRA_RARE rather than UNKNOWN: the
    qualitative tiers are permitted alongside CASES_IN_LITERATURE, and with a published
    world literature in the single digits the tier carries more information than declining
    to classify. No numeric rate is asserted. The defining report described three families of
    different ethnic origins; later reports add Chinese patients carrying the same
    compound-heterozygous pair. No rate has been estimated and none can be from this
    denominator.

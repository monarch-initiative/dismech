genetic:
- name: SLC25A26
  gene_term:
    preferred_term: SLC25A26
    term:
      id: hgnc:20661
      label: SLC25A26
  relationship_type: CAUSATIVE
  notes: >
    SLC25A26 encodes SAMC, a member of the mitochondrial carrier family expressed in all
    human tissues examined.

    The reported allele spectrum is mostly missense but is not exclusively so, and the
    exception is the informative one. Of the three index families: P1 was homozygous for
    c.443T>C (p.Val148Gly); P2 compound heterozygous for c.305C>T (p.Ala102Val) and
    c.596C>T (p.Pro199Leu); and P3 homozygous for the splice allele c.33+1G>A, whose
    transcript lacks the first two transmembrane helices, fails to reach mitochondria, and
    is a functional null. The two later Chinese patients carry the recurrent
    compound-heterozygous pair c.34G>C (p.A12P) and c.197C>A (p.A66E) in transmembrane
    regions 1 and 2. The two adults carry c.425G>A (p.Arg142Gln) homozygous, and
    c.190+4A>G with c.404A>G (p.Glu135Gly) in compound heterozygosity.

    Residual carrier activity tracks severity, and it was measured rather than inferred.
    Yeast complementation and in vitro reconstitution graded the alleles: the splice-derived
    SAMCdelta1-88 completely inactive, p.Ala102Val and p.Pro199Leu negligible, p.Val148Gly
    retaining 15% of wild-type activity. P3, carrying the functional null, died at five days;
    the adults sit at the other end. That gradient is the entry's basis for treating
    severity as allele-dependent rather than stochastic - and it is why the earlier
    formulation of this note, which claimed reported variants were "missense rather than
    nulls", was wrong: the null exists and is the severe end of the very gradient the claim
    was reaching for.
  evidence:
  - reference: PMID:34375635
    reference_title: "Identification and characterization of novel compound variants in SLC25A26 associated with combined oxidative phosphorylation deficiency 28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel compound heterozygous SLC25A26 variants (c.34G > C, p.A12P; c.197C > A;
      p.A66E) were identified in a Chinese patient with COXPD28. These two variants are
      located in the transmembrane region 1 and transmembrane region 2, respectively.
    explanation: >-
      Gives the recurrent allele pair and locates both changes in the transmembrane domains
      the carrier function depends on.
  - reference: PMID:36456512
    reference_title: "[Identification and functional analysis of combined oxidative phosphorylation deficiency 28 gene mutation]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro function test showed that the expression levels of SLC25A26 mRNA and
      S-adenosylmethionine carrier (SAMC) protein in cells transfected with SLC25A26 mutant
      plasmid were significantly lower than those transfected with wild type plasmid.
    explanation: >-
      Establishes the functional consequence of the recurrent Chinese pair - reduced rather
      than absent carrier protein - in a transfection assay.
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified conserved missense mutations in P1, homozygous for a c.443T>C
      (p.Val148Gly) substitution, and P2, compound heterozygous for c.305C>T (p.Ala102Val)
      and c.596C>T (p.Pro199Leu). P3 was homozygous for a splice mutation (c.33+1G>A)
    explanation: >-
      Gives the three index genotypes, including the splice allele that makes the spectrum
      broader than missense.
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The shortened transcript lacks the first two transmembrane helices (Figure S3) and
      failed to co-localize (Figure 1D) or be detected in mitochondria by western blot
      analysis (Figure 1E), indicating that it does not encode a functional mitochondrial
      carrier protein.
    explanation: >-
      Establishes the splice allele as a functional null, which is what refutes the
      missense-only reading of the spectrum.
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the various degrees of residual SAM-import capacity correlated well with the severity
      of the clinical presentation and biochemical phenotype in the affected individuals
    explanation: >-
      States the genotype-severity relationship directly, measured across the allele series
      rather than inferred from clinical impression.
  - reference: PMID:35024855
    reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 1 was homozygous for a c.425G>A(p.Arg142Gln) substitution of a conserved amino
      acid residue, while Patient 2 had two heterozygous variants: c.190+4A>G and
      c.404A>G(p.Glu135Gly).
    explanation: >-
      Gives the two adult-onset genotypes, which are what make the severity spectrum an
      observation across genotypes rather than an assertion.
mechanistic_hypotheses:
- hypothesis_group_id: sam_versus_sah_transport_branch
  hypothesis_label: SAM-import versus SAH-export loss sets the severity
  status: EMERGING
  description: >-
    That the severity of COXPD28 is determined by which leg of the antiport a variant
    impairs, rather than by how much total carrier activity it removes. Variants reducing
    SAM import give severe neonatal disease; variants preferentially impairing SAH export
    give mild, adult-onset mitochondrial myopathy. If correct this is directly actionable -
    it makes the genotype prognostic in a disease that has no other prognostic marker - and
    it would also predict that SAM supplementation helps one group and not the other.

    EMERGING rather than established. The directional claim rests on two unrelated adult
    patients plus mouse and fruit fly models; the authors themselves write "likely". No
    human assay separates the two transport activities, so a patient's branch is currently
    inferred from phenotype, which makes the correlation hard to test without circularity.
  evidence:
  - reference: PMID:35024855
    reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings associate a novel pathomechanism with a known disease-causing protein and
      highlight the quests of precision medicine in optimizing diagnosis, therapeutic
      intervention and prognosis.
    explanation: >-
      States the authors' own framing of the finding as a second pathomechanism with
      prognostic and therapeutic implications, which is the claim this hypothesis group
      records.
pathophysiology:
- name: SLC25A26 Loss of Function
  description: >
    Biallelic SLC25A26 variants reduce expression and function of SAMC, the mitochondrial
    S-adenosylmethionine carrier. The reported alleles are transmembrane missense changes
    that lower rather than abolish the protein, which is consistent with a spectrum of
    severity rather than a uniform lethal phenotype.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: SLC25A26
    term:
      id: hgnc:20661
      label: SLC25A26
  molecular_functions:
  - preferred_term: S-adenosyl-L-methionine transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0000095
      label: S-adenosyl-L-methionine transmembrane transporter activity
  notes: >-
    SAMC abundance is itself regulated: FBXO24, an F-box protein of the SCF E3 ubiquitin
    ligase complex, mediates K6-linked polyubiquitylation of SLC25A26 at lysine 31 and
    targets it for degradation. Recorded here as a note on this node rather than as a
    `genetic` row with `relationship_type: MODIFIER`, because the work is in mouse
    spermiogenesis and no human FBXO24 variant has been linked to this disease; calling it a
    modifier would assert a human genotype-phenotype relationship that nobody has reported.
    It is worth carrying because it establishes that the carrier has a dose that something
    controls, which is the shape a modifier would take if one is found - and because the same
    study shows elevated SLC25A26 is also deleterious, matching the overexpression result
    cited on the methylation node.
  downstream:
  - target: Reduced Intra-Mitochondrial S-Adenosylmethionine
    causal_link_type: DIRECT
    description: >-
      SAMC is believed to be the only route of SAM entry into mitochondria, so reducing the
      carrier reduces the matrix pool directly, with no alternative import path to
      compensate. This is the limb associated with severe neonatal disease.
    evidence:
    - reference: PMID:26522469
      reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The human mitochondrial SAM carrier (SAMC), encoded by SLC25A26 (MIM: 611037), is
        expressed in all human tissues examined and is believed to be the only route of SAM
        entry into mitochondria.
      explanation: >-
        Establishes the exclusivity of the route, which is what makes this edge direct and
        uncompensated rather than merely contributory.
  - target: Impaired Matrix SAH Export
    causal_link_type: DIRECT
    hypothesis_groups:
    - sam_versus_sah_transport_branch
    description: >-
      The same carrier exports SAH on the return leg of the antiport. A variant can impair
      that leg preferentially, which is the limb associated with the mild, late-onset
      phenotype.
    evidence:
    - reference: PMID:35024855
      reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate using both mouse and fruit fly models that impairment of SAH, rather
        than SAM, transport across the mitochondrial membrane is likely the cause of this
        milder, late-onset phenotype.
      explanation: >-
        Establishes the SAH-export limb as a distinct consequence of carrier variants, and
        attributes the milder phenotype to it. The authors' own "likely" is retained.
  evidence:
  - reference: PMID:36456512
    reference_title: "[Identification and functional analysis of combined oxidative phosphorylation deficiency 28 gene mutation]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the expression levels of SLC25A26 mRNA and S-adenosylmethionine carrier (SAMC) protein
      in cells transfected with SLC25A26 mutant plasmid were significantly lower than those
      transfected with wild type plasmid
    explanation: >-
      Documents the reduced carrier expression that constitutes this node.
  - reference: PMID:40657752
    reference_title: "FBXO24 targets SLC25A26 for K6-linked polyubiquitylation to maintain mitochondrial function during spermiogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Mechanistically, FBXO24 mediates K6-linked polyubiquitylation of SLC25A26 at lysine
      residue 31, targeting it for degradation.
    explanation: >-
      Establishes that SAMC abundance is under post-translational control. Graded INDIRECT
      because it is a mouse spermiogenesis study and bears on this node only through the
      general point that carrier dose is regulated, not through any reported human variant.
- name: Reduced Intra-Mitochondrial S-Adenosylmethionine
  description: >
    The matrix SAM pool falls. SAM is the methyl donor for essentially every biological
    methylation, and inside mitochondria that means nucleic-acid modification and the
    reactions respiratory-chain function depends on. This node is the single bottleneck
    from which every downstream failure in this disease follows.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: S-adenosyl-L-methionine
    modifier: DECREASED
    term:
      id: CHEBI:15414
      label: S-adenosyl-L-methionine
  cellular_components:

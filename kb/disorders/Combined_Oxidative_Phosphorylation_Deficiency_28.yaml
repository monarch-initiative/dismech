name: Combined Oxidative Phosphorylation Deficiency 28
creation_date: "2026-09-18T00:00:00Z"
category: Mendelian
synonyms:
- COXPD28
- combined oxidative phosphorylation defect type 28
- intra-mitochondrial methylation deficiency
- mitochondrial S-adenosylmethionine carrier deficiency
- SAMC deficiency
- SLC25A26 deficiency
description: >
  Combined oxidative phosphorylation deficiency 28 is an autosomal recessive mitochondrial
  disease caused by biallelic variants in SLC25A26, which encodes the mitochondrial
  S-adenosylmethionine carrier (SAMC). SAM is made in the cytoplasm and cannot cross the
  inner mitochondrial membrane unaided; SAMC is believed to be its only route in. When the
  carrier fails, the matrix runs short of the methyl donor that essentially every
  mitochondrial methylation reaction depends on.

  SAMC is an antiporter, not a uniporter, and that detail turns out to carry the
  genotype-phenotype relationship. It imports SAM in exchange for exporting SAH, the
  by-product that every methylation reaction generates and that mitochondria cannot
  regenerate in situ - SAM synthesis and SAH recycling both happen in the cytoplasm. A
  carrier defect can therefore fail in two directions, and the two produce different
  diseases. Reduced SAM import gives the severe neonatal phenotype; impaired SAH export
  gives a much milder, later-onset mitochondrial myopathy, which mouse and fruit fly models
  were used to establish. That branch is currently the principal prognostic determinant in
  this disease, and it is the reason the entry models the two limbs separately rather than
  as one depleted pool.

  That makes this a *substrate-supply* defect, and it is the reason the entry sits apart
  from its many COXPD siblings. Most combined OXPHOS deficiencies are caused by a missing
  structural subunit or a missing assembly factor, where the chain itself cannot be built.
  Here the chain is intact and the machinery for building it is intact; what fails is a
  chemical modification step several removes upstream. One carrier defect therefore
  propagates into at least four distinct downstream failures that the index study
  demonstrated separately: mitochondrial RNA stability, protein modification, mitochondrial
  translation, and the biosynthesis of coenzyme Q10 and lipoic acid. The "combined" in the
  disease name is not a statement about which complexes are low - it is a consequence of
  the lesion sitting above all of them.

  Clinically the range is wide for a disease known from so few families: neonatal death from
  respiratory insufficiency and hydrops at one end; childhood episodes of cardiopulmonary
  failure with pulmonary hypertension and severe lactic acidosis in the middle; and at the
  other end adults with exercise intolerance and mitochondrial myopathy, one of whom
  presented with recurrent severe abdominal pain and metabolic decompensation. The adult
  cases nonetheless show marked respiratory-chain deficiency and mitochondrial
  histopathology in skeletal muscle comparable to the early-onset cases, so the mildness is
  in the clinical course rather than in the biochemistry.

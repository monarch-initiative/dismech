      label: S-adenosyl-L-methionine transmembrane transporter activity
  downstream:
  - target: Reduced Intra-Mitochondrial S-Adenosylmethionine
    causal_link_type: DIRECT
    description: >-
      SAMC is believed to be the only route of SAM entry into mitochondria, so reducing the
      carrier reduces the matrix pool directly, with no alternative import path to
      compensate. This is the limb associated with severe neonatal disease.
    evidence:
    - reference: PMID:26522469
      reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The human mitochondrial SAM carrier (SAMC), encoded by SLC25A26 (MIM: 611037), is
        expressed in all human tissues examined and is believed to be the only route of SAM
        entry into mitochondria.
      explanation: >-
        Establishes the exclusivity of the route, which is what makes this edge direct and
        uncompensated rather than merely contributory.
  - target: Impaired Matrix SAH Export
    causal_link_type: DIRECT
    hypothesis_groups:
    - sam_versus_sah_transport_branch
    description: >-
      The same carrier exports SAH on the return leg of the antiport. A variant can impair
      that leg preferentially, which is the limb associated with the mild, late-onset
      phenotype.
    evidence:
    - reference: PMID:35024855
      reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate using both mouse and fruit fly models that impairment of SAH, rather
        than SAM, transport across the mitochondrial membrane is likely the cause of this
        milder, late-onset phenotype.
      explanation: >-
        Establishes the SAH-export limb as a distinct consequence of carrier variants, and
        attributes the milder phenotype to it. The authors' own "likely" is retained.
  evidence:
  - reference: PMID:36456512
    reference_title: "[Identification and functional analysis of combined oxidative phosphorylation deficiency 28 gene mutation]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the expression levels of SLC25A26 mRNA and S-adenosylmethionine carrier (SAMC) protein
      in cells transfected with SLC25A26 mutant plasmid were significantly lower than those
      transfected with wild type plasmid
    explanation: >-
      Documents the reduced carrier expression that constitutes this node.
- name: Reduced Intra-Mitochondrial S-Adenosylmethionine
  description: >
    The matrix SAM pool falls. SAM is the methyl donor for essentially every biological
    methylation, and inside mitochondria that means nucleic-acid modification and the
    reactions respiratory-chain function depends on. This node is the single bottleneck
    from which every downstream failure in this disease follows.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: S-adenosyl-L-methionine
    modifier: DECREASED
    term:
      id: CHEBI:15414
      label: S-adenosyl-L-methionine
  cellular_components:

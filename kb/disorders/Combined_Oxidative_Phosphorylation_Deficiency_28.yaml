discussions:
- discussion_id: coxpd28_sam_supplementation_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can the matrix SAM pool be replenished pharmacologically - by SAM, methionine or
    betaine supplementation - when the sole carrier is defective?
  attaches_to:
  - pathophysiology#Reduced Intra-Mitochondrial S-Adenosylmethionine
  rationale: >-
    The bottleneck in this disease is a single transported metabolite, which is the shape of
    problem that sometimes yields to substrate supplementation. But the lesion is in the
    transporter, not in supply: raising cytosolic SAM does not obviously raise matrix SAM
    when the only route in is the thing that is broken. Whether the residual carrier
    function that the missense alleles leave behind is enough to exploit a raised cytosolic
    gradient is exactly the question, and it is untested. No treatment directed at the
    mechanism is reported in any of the three publications; management is supportive, with
    dichloroacetate for the acidosis. Recorded because the reasoning that makes
    supplementation attractive is also the reasoning that might make it useless, and the
    entry should not leave a reader to infer either.

    The SAM/SAH branch point sharpens the question rather than answering it. If a patient's
    defect is on the SAH-export leg, matrix SAH accumulation is the problem and adding SAM
    could plausibly make it worse, not better. So "try SAM" is not even a single proposal:
    it is two opposite proposals depending on which limb the genotype sits on, and nothing
    currently assays that in a patient.
- discussion_id: coxpd28_decompensation_trigger
  kind: KNOWLEDGE_GAP
  prompt: >-
    What precipitates an acute decompensation in COXPD28, and can episodes be prevented?
  attaches_to:
  - pathophysiology#Acute Metabolic Decompensation
  rationale: >-
    The episodes carry the mortality and the permanent neurological injury in this disease -
    one patient's hypoxic brain damage followed a crisis, not the baseline disease - yet no
    trigger is identified in any report. Patients have intervals of normal development
    between crises. If the episodes were predictable, the burden would be a different
    problem; as it stands, the pathograph has a node whose timing nothing explains.

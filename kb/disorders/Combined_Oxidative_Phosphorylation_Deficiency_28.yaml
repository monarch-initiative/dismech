experimental_models:
- name: Saccharomyces cerevisiae SAM5-null complementation assay
  experimental_model_type: OTHER
  organism:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:26522469
  description: >
    A yeast strain lacking the SAMC ortholog SAM5 cannot grow on non-fermentable carbon
    sources. Expressing each human patient allele in that strain asks whether the allele can
    do the job, and grades how well. This is the functional proof that the human protein is
    the SAM carrier and that the patient alleles impair it, and it produced the residual-
    activity gradient the entry's genotype-severity reading rests on.

    Filed under experimental_models rather than animal_models: yeast is not an animal, and
    ExperimentalModel is where non-animal systems belong. experimental_model_type is OTHER
    because a complementation assay in a null strain is not an organoid, cell line, chip or
    primary culture.
  modeled_mechanisms:
  - target: SLC25A26 Loss of Function
    relationship: MEASURES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The assay measures the transport competence of each human allele directly, which is
      precisely what this node asserts is impaired.
    limitations: >-
      Growth rescue in yeast reports carrier function in a yeast membrane and says nothing
      about the human tissue distribution of the consequence, nor about which downstream
      methylation reactions fail first. It also cannot address the SAM-versus-SAH branch,
      since the readout is growth rather than directional flux.
    readouts:
    - name: Growth on non-fermentable carbon sources after complementation
      target: SLC25A26 Loss of Function
      direction: DECREASED
      interpretation: >-
        Failure to restore growth indicates the allele cannot perform the carrier function.
      evidence:
      - reference: PMID:26522469
        reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the growth phenotype of SAM5Δ cells on non-fermentable carbon sources could not be
          restored by complementation of the knockout strain with the p.Ala102Val,
          p.Pro199Leu, or SAMCΔ1–88 variant. Only the p.Val148Gly altered SAMC partially
          rescued the growth de
        explanation: >-
          Reports the readout allele by allele, including the partial rescue that separates
          p.Val148Gly from the rest.
    evidence:
    - reference: PMID:26522469
      reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We confirmed pathogenicity by complementation studies in an S. cerevisiae SAMC-null
        strain (SAM5Δ)
      explanation: >-
        States what the assay was used for - confirming pathogenicity - which is the claim
        this link makes.
  evidence:
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SAMCΔ1–88 was completely inactive, whereas p.Ala102Val and p.Pro199Leu variants
      exhibited negligible activity, and p.Val148Gly strongly inhibited SAMC activity (15% of
      wild-type SAMC).
    explanation: >-
      Gives the quantified residual-activity gradient across the allele series, which is what
      makes this model informative beyond a binary pathogenic call.
animal_models:
- name: SAH-transport-impaired mouse and fruit fly models
  species: Mouse and Drosophila melanogaster
  genotype: Slc25a26 variants impairing SAH rather than SAM transport
  publication: PMID:35024855
  description: >
    Two model organisms used together to separate the two legs of the antiport, which no
    human assay currently does. They are what establishes that SAH-export impairment rather
    than SAM-import loss underlies the mild late-onset phenotype.
  modeled_mechanisms:
  - target: Impaired Matrix SAH Export
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The models demonstrate the transport-direction defect itself, which is the node, rather
      than the clinical phenotype it is invoked to explain.
    limitations: >-
      The models establish the transport biochemistry; the link from that to the mild human
      phenotype is an inference the authors hedge as "likely". The human arm of the argument
      is two unrelated patients. A fruit fly has no skeletal muscle phenotype comparable to
      human mitochondrial myopathy, so the clinical end of the claim is not modelled at all.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The models observe transport activity; the claim they are cited for is a
        whole-organism severity difference. Everything in between - which tissues tolerate
        SAH accumulation, and why skeletal muscle in particular - lies outside the model
        boundary and is not observed. Typed BOUNDARY_OMISSION rather than
        SCALE_EXTRAPOLATION because the model_scale and the target node are both MOLECULAR,
        so there is no scale gap for that value to describe; the missing biology is
        intervening, not higher.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse and Drosophila carriers stand in for a human mitochondrial myopathy. The fly in
        particular has no skeletal muscle phenotype comparable to the human one, so the
        clinical end of the severity claim has no counterpart in that organism at all.
    evidence:
    - reference: PMID:35024855
      reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate using both mouse and fruit fly models that impairment of SAH, rather
        than SAM, transport across the mitochondrial membrane is likely the cause of this
        milder, late-onset phenotype.
      explanation: >-
        States what the two models jointly demonstrate and the strength the authors claim for
        it.
  evidence:
  - reference: PMID:35024855
    reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The SLC25A26 gene encodes a mitochondrial inner membrane carrier that transports
      S-adenosylmethionine (SAM) into the mitochondrial matrix in exchange for
      S-adenosylhomocysteine (SAH).
    explanation: >-
      Establishes the antiport mechanism the models were built to interrogate, and so why
      they are informative for this node.
diagnosis:
- name: Whole-exome plus mitochondrial genome sequencing
  description: >
    Diagnosis is genetic. The biochemical picture - severe lactic acidosis with a combined
    respiratory-chain defect - places a patient in a large differential and does not
    identify the gene, so the reported route is whole-exome sequencing alongside
    mitochondrial genome sequencing, the latter to exclude a primary mtDNA cause of the same
    biochemistry.
  evidence:
  - reference: PMID:34375635
    reference_title: "Identification and characterization of novel compound variants in SLC25A26 associated with combined oxidative phosphorylation deficiency 28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome and mitochondrial genome sequencing was applied for the genetic analysis,
      together with bioinformatic analysis of predicted consequences of the identified
      variant.
    explanation: >-
      Describes the diagnostic route used to reach this disease, including the parallel mtDNA
      sequencing that rules out the alternative cause of the same biochemistry.
- name: Differential against the lipoic-acid and PDH-complex disorders
  description: >
    The impaired lipoic acid biosynthesis in this disease puts it in the same biochemical
    neighbourhood as the multiple mitochondrial dysfunction syndromes (NFU1, BOLA3, ISCA2,
    IBA57), which share lactic acidosis, combined respiratory-chain defects, and impairment
    of the lipoic-acid-dependent dehydrogenases. That overlap is the diagnostically useful
    fact: it is why SLC25A26 sits on pyruvate-dehydrogenase-complex deficiency gene panels
    rather than being reached by targeted testing, and why a patient with low PDHC activity
    and no PDHA1 variant should have this gene covered.
  evidence:
  - reference: PMID:27785568
    reference_title: "Novel mutations in IBA57 are associated with leukodystrophy and variable clinical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by lactic acidosis, hyperglycinemia, multiple defects of the respiratory
      chain complexes, and impairment of four lipoic acid-dependent enzymes
    explanation: >-
      Defines the biochemical signature of the differential class that this disease overlaps
      through its lipoic-acid arm.
  - reference: PMID:32742935
    reference_title: "Pitfalls of relying on genetic testing only to diagnose inherited metabolic disorders in non-western populations - 5 cases of pyruvate dehydrogenase deficiency from South Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Included in the panel were: PDHA1, PDHB, DLAT, DLD, PDHX, BOLA3, GLRX5, IBA57, LIAS,
      LIPT1, LIPT2, NFU1, PDP1, PDP2, SLC19A2, SLC19A3, SLC25A19, SLC25A26, TPK1 and FBXL4.
    explanation: >-
      Shows SLC25A26 on a diagnostic PDH-complex deficiency panel, which is the practical
      consequence of the biochemical overlap: this disease is reached through that
      differential rather than around it.
treatments:
- name: Riociguat for Refractory Pulmonary Hypertension
  description: >
    Riociguat, an oral soluble guanylate cyclase stimulator, was used as rescue therapy in a
    four-month-old with compound heterozygous SLC25A26 mutation and near-systemic pulmonary
    hypertension, after conventional combination PAH therapy had failed. It allowed
    successful weaning off inhaled nitric oxide over one week.

    Two caveats are load-bearing. This is a single patient in a two-case series, and the
    other case had an unrelated genotype (TBX4), so nothing here is specific to SLC25A26
    beyond the fact that this patient had it. And riociguat acts on the pulmonary vasculature,
    not on the carrier defect - it treats the most dangerous complication of the disease
    without touching its cause.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riociguat
      term:
        id: CHEBI:76018
        label: riociguat
  target_mechanisms:
  - target: Pulmonary arterial hypertension
    description: >-
      Stimulating soluble guanylate cyclase lowers pulmonary vascular resistance. It acts on
      the vascular consequence, downstream of everything this disease's pathograph models.
  evidence:
  - reference: PMID:36533232
    reference_title: "Novel use of riociguat in infants with severe pulmonary arterial hypertension unable to wean from inhaled nitric oxide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Case 2 is a 4-month-old term male with compound heterozygous SLC25A26 mutation and
      severe pulmonary hypertension. Initial cardiac catheterization showed PVRi 28.2 WU*m2.
    explanation: >-
      Establishes that the treated patient carried this disease's genotype, which is what
      makes the case relevant to this entry rather than to pulmonary hypertension generally.
  - reference: PMID:36533232
    reference_title: "Novel use of riociguat in infants with severe pulmonary arterial hypertension unable to wean from inhaled nitric oxide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a 24-h sildenafil washout, he was initiated and uptitrated on riociguat with
      concomitant, successful wean of nitric oxide over one week that was well tolerated.
    explanation: >-
      Documents the response to riociguat in this patient, including the sildenafil washout
      the switch required.
- name: Conventional Combination PAH Therapy
  description: >
    Sildenafil, bosentan and intravenous treprostinil are the standard escalation for
    paediatric pulmonary arterial hypertension, and in the one reported SLC25A26 patient
    they failed: pulmonary pressures stayed near systemic and repeated attempts to wean
    inhaled nitric oxide provoked tachypnoea, hypoxaemia and worsening echocardiographic
    hypertension. The failure is the clinically useful part of the record, and it is why
    this treatment is curated alongside the rescue therapy rather than omitted.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sildenafil
      term:
        id: CHEBI:9139
        label: sildenafil
    - preferred_term: bosentan
      term:
        id: CHEBI:51450
        label: bosentan
    - preferred_term: treprostinil
      term:
        id: CHEBI:50861
        label: treprostinil
  target_mechanisms:
  - target: Pulmonary arterial hypertension
    description: >-
      Standard pulmonary vasodilator combination, targeting the same vascular consequence.
  evidence:
  - reference: PMID:36533232
    reference_title: "Novel use of riociguat in infants with severe pulmonary arterial hypertension unable to wean from inhaled nitric oxide."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After uptitration of sildenafil, bosentan, and IV treprostinil, serial echocardiograms
      continued to demonstrate near-systemic pulmonary hypertension.
    explanation: >-
      Refutes the expectation that conventional combination therapy controls the pulmonary
      hypertension in this disease. Recorded as REFUTE against that efficacy claim, which is
      why the treatment is curated with its failure attached.
  - reference: PMID:36533232
    reference_title: "Novel use of riociguat in infants with severe pulmonary arterial hypertension unable to wean from inhaled nitric oxide."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He failed multiple attempts to wean off typical doses of iNO (10-20 ppm) over the
      following weeks with tachypnea, hypoxemia, and worsening pulmonary hypertension on
      echocardiogram despite continued aggressive combination targeted therapy.
    explanation: >-
      Documents the specific mode of failure - inability to wean nitric oxide - which is
      what the rescue therapy was introduced to solve.
- name: Dichloroacetate for Acute Lactic Acidosis
  description: >
    Sodium dichloroacetate was given during acute decompensations and is recorded as having
    had good effect in one patient and as part of the successful early management of another.
    It activates pyruvate dehydrogenase, which is mechanistically apt here for a reason
    specific to this disease: lipoic acid, the PDH cofactor, is itself depleted by the
    upstream SAM defect. The evidence is individual case description, not a trial.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    The severe end of the spectrum is neonatal death: one reported child died of respiratory
    and multiple organ failure at five days. The milder end still carries acute episodes of
    severe lactic acidosis - up to 42 mmol/l against a reference below 1.8 - with
    cardiopulmonary arrest and, in one patient, hypoxic brain damage from such an episode.
    Between episodes patients have slowly progressive muscle weakness. A disease whose
    typical course is punctuated by life-threatening, brain-damaging metabolic crises is
    HIGH burden irrespective of the interictal state.
  evidence:
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical findings ranged from neonatal mortality resulting from respiratory
      insufficiency and hydrops to childhood acute episodes of cardiopulmonary failure and
      slowly progressive muscle weakness.
    explanation: >-
      Gives the full clinical range, both ends of which drive the burden assessment.
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The child died of respiratory and multiple organ failure at 5 days of age.
    explanation: >-
      Documents neonatal death at the severe end of the spectrum.
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      she experienced an additional episode of severe lactic acidosis (36 mmol/l) followed
      by cardiopulmonary arrest and hypoxic brain damage
    explanation: >-
      Documents that an acute metabolic episode can itself cause permanent neurological
      injury, which is what makes the episodic course rather than the baseline state the
      driver of burden.

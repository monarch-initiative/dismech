    causal_link_type: DIRECT
  - target: Impaired CoQ10 and Lipoic Acid Biosynthesis
    causal_link_type: DIRECT
    description: >-
      Both cofactors require SAM-dependent methylation steps in their biosynthesis, so both
      fall with the matrix SAM pool.
    evidence:
    - reference: PMID:26522469
      reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We show that SLC25A26 mutations cause various mitochondrial defects, including those
        affecting RNA stability, protein modification, mitochondrial translation, and the
        biosynthesis of CoQ10 and lipoic acid.
      explanation: >-
        Names the biosynthetic arms this edge asserts, in the same sentence as the
        RNA/translation arm, which is what establishes them as parallel consequences of one
        lesion.
  evidence:
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including mitochondria, where methylation is mostly required for nucleic-acid
      modifications and respiratory-chain function
    explanation: >-
      States what the matrix SAM pool is needed for, and so what its depletion removes.
- name: Impaired Matrix SAH Export
  description: >
    The second limb of the antiport. SAH is the by-product of every methylation reaction, and
    mitochondria have no route to regenerate it - both SAM synthesis and SAH recycling are
    cytoplasmic - so SAH must leave the matrix on the carrier that brings SAM in. When export
    is preferentially impaired, matrix SAH accumulates and product-inhibits the same
    methyltransferases that SAM depletion would starve. The consequence converges on the
    node below, which is why one gene gives one biochemical syndrome by two routes.

    This limb is associated with the mild, adult-onset phenotype, and the association was
    established in mouse and fruit fly rather than in patients.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: S-adenosyl-L-homocysteine
    modifier: INCREASED
    term:
      id: CHEBI:16680
      label: S-adenosyl-L-homocysteine
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  downstream:
  - target: Failed Mitochondrial RNA and Protein Methylation
    causal_link_type: DIRECT
    description: >-
      Accumulated SAH product-inhibits SAM-dependent methyltransferases, reaching the same
      endpoint as substrate starvation by the opposite route.
  evidence:
  - reference: PMID:35730628
    reference_title: "Mitochondrial transport and metabolism of the major methyl donor and versatile cofactor S-adenosylmethionine, and related diseases: A review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, the intramitochondrial SAM-dependent methyltransferases require the import
      of SAM and export of SAH for recycling.
    explanation: >-
      States why export matters independently of import: the matrix cannot recycle SAH, so
      the export leg is a requirement rather than a convenience. Graded OTHER with
      quote_role REVIEW_SYNTHESIS because the source is a review stating established
      biochemistry rather than reporting a study.
  - reference: PMID:35730628
    reference_title: "Mitochondrial transport and metabolism of the major methyl donor and versatile cofactor S-adenosylmethionine, and related diseases: A review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Orthologous mitochondrial transporters belonging to the mitochondrial carrier family
      have been identified to catalyze this antiport transport step: Sam5p in yeast,
      SLC25A26 (SAMC) in humans, and SAMC1-2 in plants.
    explanation: >-
      Establishes that SLC25A26 is the antiporter that performs both legs, which is what
      makes a single carrier defect capable of two distinct biochemical failures.
- name: Failed Mitochondrial RNA and Protein Methylation
  description: >
    Without SAM, mitochondrial RNA and protein methylation fail. The consequences the index
    study demonstrated are reduced mitochondrial RNA stability, impaired protein
    modification, and a severe defect in de novo mitochondrial translation, the last most
    plausibly because tRNA maturation itself requires methylation.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tRNA methylation
    modifier: DECREASED
    term:
      id: GO:0030488
      label: tRNA methylation
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      Failed mitochondrial translation reduces the mtDNA-encoded subunits every affected
      complex needs, so the deficiency is combined by construction rather than by
      coincidence.
    evidence:
    - reference: PMID:26522469
      reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This defect is also reflected by the reduced steady-state level of COXII (Figure
        3G), a subunit of complex IV
      explanation: >-
        Traces the translation defect to the loss of a specific mtDNA-encoded complex IV
        subunit, which is the mechanism by which this edge operates.
  evidence:
  - reference: PMID:26522469
    reference_title: "Intra-mitochondrial Methylation Deficiency Due to Mutations in SLC25A26."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      de novo mitochondrial translation25 was severely affected in P3 fibroblasts (Figure
      3F), possibly because methylation is required for tRNA maturation
    explanation: >-
      Documents the translation defect in patient fibroblasts and the authors' proposed
      mechanism, stated with their own hedge intact.
  - reference: PMID:28118529
    reference_title: "SLC25A26 overexpression impairs cell function via mtDNA hypermethylation and rewiring of methyl metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      overexpression of SLC25A26 in CaSki cells increases mitochondrial SAM availability and
      promotes hypermethylation of mitochondrial DNA, leading to decreased expression of key
      respiratory complex subunits
    explanation: >-
      Corroborates the SAM-to-respiratory-subunit link from the opposite direction: raising
      matrix SAM also lowers respiratory subunit expression. Graded INDIRECT because it is a
      gain-of-carrier experiment in a cancer cell line, not the disease state - but a
      mechanism that breaks when the dose is moved either way is better supported than one
      tested in one direction only.
- name: Impaired CoQ10 and Lipoic Acid Biosynthesis
  description: >
    Coenzyme Q10 and lipoic acid both require SAM-dependent methylation for their synthesis.
    Their loss is a second, independent route from the same bottleneck to the same clinical
    picture: CoQ10 is the electron carrier between complexes I/II and III, and lipoic acid
    is the cofactor of pyruvate dehydrogenase, whose failure produces lactate directly.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: ubiquinone biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
  - preferred_term: lipoate biosynthetic process
    modifier: DECREASED

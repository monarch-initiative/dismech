genetic:
- name: SLC25A26
  gene_term:
    preferred_term: SLC25A26
    term:
      id: hgnc:20661
      label: SLC25A26
  relationship_type: CAUSATIVE
  notes: >
    SLC25A26 encodes SAMC, a member of the mitochondrial carrier family expressed in all
    human tissues examined. Reported variants are missense changes in the transmembrane
    regions rather than nulls - the recurrent compound-heterozygous pair c.34G>C (p.A12P)
    and c.197C>A (p.A66E) sits in transmembrane regions 1 and 2 - and reduce SAMC protein
    expression rather than abolishing it. That residual function is the most plausible
    explanation for why any patient survives a defect in the sole route of SAM entry into
    mitochondria.
  evidence:
  - reference: PMID:34375635
    reference_title: "Identification and characterization of novel compound variants in SLC25A26 associated with combined oxidative phosphorylation deficiency 28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel compound heterozygous SLC25A26 variants (c.34G > C, p.A12P; c.197C > A;
      p.A66E) were identified in a Chinese patient with COXPD28. These two variants are
      located in the transmembrane region 1 and transmembrane region 2, respectively.
    explanation: >-
      Gives the recurrent allele pair and locates both changes in the transmembrane domains
      the carrier function depends on.
  - reference: PMID:36456512
    reference_title: "[Identification and functional analysis of combined oxidative phosphorylation deficiency 28 gene mutation]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro function test showed that the expression levels of SLC25A26 mRNA and
      S-adenosylmethionine carrier (SAMC) protein in cells transfected with SLC25A26 mutant
      plasmid were significantly lower than those transfected with wild type plasmid.
    explanation: >-
      Establishes the functional consequence of the variants - reduced rather than absent
      carrier protein - in a transfection assay.
mechanistic_hypotheses:
- hypothesis_group_id: sam_versus_sah_transport_branch
  hypothesis_label: SAM-import versus SAH-export loss sets the severity
  status: EMERGING
  description: >-
    That the severity of COXPD28 is determined by which leg of the antiport a variant
    impairs, rather than by how much total carrier activity it removes. Variants reducing
    SAM import give severe neonatal disease; variants preferentially impairing SAH export
    give mild, adult-onset mitochondrial myopathy. If correct this is directly actionable -
    it makes the genotype prognostic in a disease that has no other prognostic marker - and
    it would also predict that SAM supplementation helps one group and not the other.

    EMERGING rather than established. The directional claim rests on two unrelated adult
    patients plus mouse and fruit fly models; the authors themselves write "likely". No
    human assay separates the two transport activities, so a patient's branch is currently
    inferred from phenotype, which makes the correlation hard to test without circularity.
  evidence:
  - reference: PMID:35024855
    reference_title: "Pathogenic SLC25A26 variants impair SAH transport activity causing mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings associate a novel pathomechanism with a known disease-causing protein and
      highlight the quests of precision medicine in optimizing diagnosis, therapeutic
      intervention and prognosis.
    explanation: >-
      States the authors' own framing of the finding as a second pathomechanism with
      prognostic and therapeutic implications, which is the claim this hypothesis group
      records.
pathophysiology:
- name: SLC25A26 Loss of Function
  description: >
    Biallelic SLC25A26 variants reduce expression and function of SAMC, the mitochondrial
    S-adenosylmethionine carrier. The reported alleles are transmembrane missense changes
    that lower rather than abolish the protein, which is consistent with a spectrum of
    severity rather than a uniform lethal phenotype.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION

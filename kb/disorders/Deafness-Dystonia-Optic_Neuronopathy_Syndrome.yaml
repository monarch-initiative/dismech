pathophysiology:
- name: TIMM8A Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Hemizygous loss-of-function TIMM8A variants, or contiguous Xq22.1 deletions
    removing the gene, abolish or destabilize the deafness/dystonia peptide DDP1.
    The C66W missense change is the best-characterized example: it disrupts Zn2+
    coordination by the conserved twin CX3C (Cys4) motif, so the protein is
    imported and sorted normally but is incorrectly folded.
  molecular_functions:
  - preferred_term: >-
      zinc ion binding by the twin CX3C motif of DDP1 (the missense route to
      loss of function; frameshift, stop and whole-gene-deletion alleles leave
      no protein for this state to describe)
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008270
      label: zinc ion binding
  downstream:
  - target: TIM8-TIM13 Chaperone Complex Assembly Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11956200
      reference_title: "The C66W mutation in the deafness dystonia peptide 1 (DDP1) affects the formation of functional DDP1.TIM13 complexes in the mitochondrial intermembrane space."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The C66W mutation impairs binding of Zn(2+) ions via the Cys(4) motif. As
        a consequence, the mutated DDP1 is incorrectly folded and loses its
        ability to assemble into a hetero-hexameric 70-kDa complex with its
        cognate partner protein human Tim13.
      explanation: >-
        Traces the causal step from the variant to failed complex assembly in the
        same experiment.
  evidence:
  - reference: PMID:8841189
    reference_title: "A novel X-linked gene, DDP, shows mutations in families with deafness (DFN-1), dystonia, mental deficiency and blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report small deletions in this candidate gene in the original
      DFN-1/MTS family, and in a family with deafness, dystonia and mental
      deficiency but not blindness. This gene, named DDP (deafness/ dystonia
      peptide), shows high levels of expression in fetal and adult brain.
    explanation: The positional-cloning report establishing TIMM8A/DDP as the causal gene.
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The novel base change in the TIMM8A gene (c.1A>T, p.Met1Leu) results in no
      detectable protein and a reduction in TIMM8A transcript abundance.
    explanation: >-
      Demonstrates complete loss of the protein for an initiation-codon allele,
      showing the lesion is loss of function.
- name: TIM8-TIM13 Chaperone Complex Assembly Failure
  biological_scale: MOLECULAR
  description: >-
    DDP1 assembles with TIMM13 into a soluble 70 kDa hetero-hexameric chaperone
    of the mitochondrial intermembrane space. Without functional DDP1 the complex
    does not form, and the steady-state level of its partner TIMM13 falls with it
    even though TIMM13 transcript abundance is unchanged.
  cellular_components:
  - preferred_term: mitochondrial intermembrane space
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
  downstream:
  - target: Impaired Intermembrane-Space Escort of Hydrophobic Precursors
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11875042
    reference_title: "Human deafness dystonia syndrome is caused by a defect in assembly of the DDP1/TIMM8a-TIMM13 complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We now show that TIMM8a assembles in a 70 kDa complex in the intermembrane
      space with TIMM13. DDP1/TIMM8a is not detectable in fibroblasts derived
      from a patient with a missense mutation in the DDP1/TIMM8a gene
    explanation: >-
      Establishes the complex and shows the protein is absent in patient
      fibroblasts.
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed a commensurate decrease in the steady-state level of the Tim13
      protein (the binding partner of Tim8a) but no decrease in TIMM13
      transcripts.
    explanation: >-
      Shows the partner protein is destabilized post-transcriptionally when DDP1
      is absent, which is what a failed assembly predicts.
- name: Impaired Intermembrane-Space Escort of Hydrophobic Precursors
  biological_scale: MOLECULAR
  description: >-
    The DDP1-TIMM13 complex contacts translocation intermediates of human TIM23
    directly and is required for its import, so loss of the chaperone impairs
    delivery of hydrophobic precursors across the aqueous intermembrane space to
    the inner membrane. The human complex complements the yeast TIM8-TIM13
    complex, and the reciprocal yeast mutation destabilizes Tim8p, indicating the
    step is conserved.
  biological_processes:
  - preferred_term: insertion of TIM23 into the mitochondrial inner membrane
    modifier: DECREASED
    term:
      id: GO:0045039
      label: protein insertion into mitochondrial inner membrane
  downstream:
  - target: Mitochondrial Morphology and Dynamics Disturbance
    causal_link_type: DIRECT
  - target: Neuronal Bioenergetic Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11489896
    reference_title: "Role of the deafness dystonia peptide 1 (DDP1) in import of human Tim23 into the inner membrane of mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The DDP1.hTim13 complex is in direct contact with translocation
      intermediates of human Tim23 in mammalian mitochondria. The human
      DDP1.hTim13 complex complements the function of the TIM8.13 complex in
      yeast and facilitates import of yeast and human Tim23.
    explanation: >-
      Direct evidence that the complex acts on TIM23 import, which is the step
      this node asserts.
  - reference: PMID:10051608
    reference_title: "Human deafness dystonia syndrome is a mitochondrial disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The deafness dystonia syndrome thus is a novel type of mitochondrial
      disease that probably is caused by a defective mitochondrial protein-import
      system.
    explanation: >-
      The report that reframed the disorder as an import defect rather than a
      respiratory-subunit defect.
  - reference: PMID:15254020
    reference_title: "The calcium-binding aspartate/glutamate carriers, citrin and aralar1, are new substrates for the DDP1/TIMM8a-TIMM13 complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A lymphoblast cell line derived from an MTS patient had decreased NADH
      levels and defects in mitochondrial protein import.
    explanation: >-
      The human patient-cell result supporting a general import defect. It is
      one side of a contradiction: see the REFUTE items below and the
      HUMAN_MODEL_MISMATCH discussion.
  - reference: PMID:21984432
    reference_title: "Alterations in expression levels of deafness dystonia protein 1 affect mitochondrial morphology."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Of note, knockdown of the TIMM8A gene by RNA interference did not show an
      influence on the oxygen respiration rate and the mitochondrial membrane
      potential.
    explanation: >-
      A human-cell negative. If loss of the chaperone broadly disabled inner
      membrane import, respiration and membrane potential would be expected to
      suffer; they did not.
  - reference: PMID:21984432
    reference_title: "Alterations in expression levels of deafness dystonia protein 1 affect mitochondrial morphology."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Deficiencies in the biogenesis of hTim23 and consecutive alterations in
      biogenesis of inner membrane and matrix proteins have been proposed to
      serve as one possible mechanistic explanation.
    explanation: >-
      The authors frame the TIM23 account as one proposal among possible
      explanations rather than an established mechanism, which is the epistemic
      status this node records.
  - reference: PMID:36090790
    reference_title: "Reduced mitochondrial size in hippocampus and psychiatric behavioral changes in the mutant mice with homologous mutation of Timm8a1-I23fs49X."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, we and others did not find Tim8a to mediate the biogenesis of
      Tim23, nor Tom proteins.
    explanation: >-
      A first-person negative from a group that assayed it directly, aligning
      the mouse result with the human fibroblast result against the TIM23
      account.
  - reference: PMID:40075073
    reference_title: "CHCHD2 rescues the mitochondrial dysfunction in iPSC-derived neurons from patient with Mohr-Tranebjaerg syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      However, it remains controversial whether the same mechanism exists in
      humans
    explanation: >-
      Records that the field itself treats the human cross-membrane transport
      mechanism as unsettled. Graded INDIRECT because it characterizes the
      state of the evidence rather than testing the step.
- name: Mitochondrial Morphology and Dynamics Disturbance
  biological_scale: CELLULAR
  description: >-
    Loss of DDP1 disturbs mitochondrial shape and the fusion-fission balance.
    The direction of the change is not consistent across systems and this entry
    does not force it into one: patient fibroblasts and DDP1-knockdown HeLa
    cells show elongated mitochondrial tubules, patient iPSC-derived neurons
    show fragmentation, and the mutant mouse hippocampus shows reduced
    mitochondrial size with upregulated Mtfp1/Mtp18, a positive regulator of
    fission. Cell type, species and whether the protein is knocked down or
    absent all differ between these results, so the shared claim is that
    dynamics are dysregulated, not that mitochondria are uniformly longer or
    shorter.
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: DYSREGULATED
    term:
      id: GO:0007005
      label: mitochondrion organization
  downstream:
  - target: Selective Neurodegeneration of Sensory and Basal Ganglia Neurons
  evidence:
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient fibroblasts exhibited elongation and/or increased fusion of
      mitochondria, consistent with prior reports.
    explanation: Documents the altered mitochondrial morphology in patient cells.
  - reference: PMID:21984432
    reference_title: "Alterations in expression levels of deafness dystonia protein 1 affect mitochondrial morphology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Live cell microscopy of primary fibroblasts derived from DDON patients and
      of DDP1 downregulated HeLa cells displayed alterations of mitochondrial
      morphology with notable extensions in the length of mitochondrial tubules
    explanation: >-
      Independent demonstration of the morphology change in both patient cells
      and an engineered knockdown, and the source of the elongation direction.
- name: Neuronal Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    A respiratory deficit that is selective for neurons. hTim8a is required for
    complex IV assembly in neuronal cells specifically, through a transient
    interaction with the copper chaperone COX17, and the resulting oxidative
    stress shifts apoptotic regulators so that cells are primed for death.
    Patient iPSC-derived neurons show reduced complex IV level and activity,
    reduced ATP, and increased reactive oxygen species, with CHCHD2
    downregulated as a downstream effector. This is the arm of the mechanism
    that explains why a ubiquitously expressed chaperone produces a disease of
    neurons, and notably it does not require the contested TIM23 step.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
  downstream:
  - target: Selective Neurodegeneration of Sensory and Basal Ganglia Neurons
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31682224
      reference_title: "Function of hTim8a in complex IV assembly in neuronal cells provides insight into pathomechanism underlying Mohr-Tranebjærg syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We hypothesise that enhanced sensitivity of neuronal cells to apoptosis
        is the underlying mechanism of MTS.
      explanation: >-
        The authors' own statement of this edge. Marked as their hypothesis
        rather than a demonstrated step, which is why the node it feeds carries
        separate human neuropathology evidence.
  evidence:
  - reference: PMID:31682224
    reference_title: "Function of hTim8a in complex IV assembly in neuronal cells provides insight into pathomechanism underlying Mohr-Tranebjærg syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that hTim8a is required for the assembly of Complex IV in neurons,
      which is mediated through a transient interaction with Complex IV assembly
      factors, in particular the copper chaperone COX17.
    explanation: >-
      Supplies the neuron-selectivity this node asserts: the complex IV
      requirement is specific to neuronal cells, which is why a ubiquitously
      expressed chaperone produces a neuronal disease.
  - reference: PMID:40075073
    reference_title: "CHCHD2 rescues the mitochondrial dysfunction in iPSC-derived neurons from patient with Mohr-Tranebjaerg syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mitochondrial function analysis revealed reduced protein levels and
      activity of complex IV, diminished ATP synthesis, and increased reactive
      oxygen species (ROS) generation in MTS- and MUT-neurons.
    explanation: >-
      Establishes the bioenergetic deficit in patient-derived neurons against an
      isogenic control.
- name: Selective Neurodegeneration of Sensory and Basal Ganglia Neurons
  biological_scale: TISSUE
  description: >-
    Chronic mitochondrial insufficiency in high-demand post-mitotic neurons
    produces progressive, spatially selective neuronal loss. Human neuropathology
    documents loss in the optic nerve, retina, striate cortex, basal ganglia, and
    dorsal roots of the spinal cord, and near-total loss of cochlear spiral
    ganglion neurons on temporal-bone study. The temporal separation of the
    affected populations is what produces the staged clinical course.
  cell_types:
  - preferred_term: cochlear spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  - preferred_term: >-
      striatal neuron (left unbound: the cited neuropathology resolves only to
      basal ganglia and striatum, and does not identify a neuron subclass)
  downstream:
  - target: Auditory Neuropathy
  - target: Dystonia
  - target: Ataxia
  - target: Optic Atrophy
  - target: Dementia
  - target: Personality Change
  - target: Paranoia
  - target: Corticospinal and Bulbar Involvement
  evidence:
  - reference: PMID:11803487
    reference_title: "Neuronal cell death in the visual cortex is a prominent feature of the X-linked recessive mitochondrial deafness-dystonia syndrome caused by mutations in the TIMM8a gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings included neuronal cell loss in the optic nerve, retina,
      striate cortex, basal ganglia, and dorsal roots of the spinal cord.
    explanation: >-
      Human neuropathology naming the degenerating populations this node
      asserts.
  - reference: PMID:17471106
    reference_title: Otopathology in Mohr-Tranebjaerg syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all bones examined showed near-total loss of cochlear neuronal cells and
      severe loss of vestibular neurons. When compared with age-matched
      controls, there was 90% to 95% loss of cochlear neurons and 75% to 85%
      loss of vestibular neurons.
    explanation: >-
      Quantified temporal-bone loss across four affected members of one family,
      establishing the cochlear ganglion degeneration this node asserts.
- name: Corticospinal and Bulbar Involvement
  biological_scale: TISSUE
  description: >-
    Degeneration extending to corticospinal and bulbar pathways, producing
    spasticity and hyperreflexia and, late, the swallowing impairment. Spasticity
    and dysphagia were part of the original DFN-1 description, and the reported
    case shows the spastic and bulbar deficits together. This node is what
    connects dysphagia to the pathograph; the hearing deficit does not cause it.
  downstream:
  - target: Dysphagia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8841189
    reference_title: "A novel X-linked gene, DDP, shows mutations in families with deafness (DFN-1), dystonia, mental deficiency and blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      postlingual progressive sensorineural deafness as the first presenting
      symptom in early childhood, followed by progressive dystonia, spasticity,
      dysphagia, mental deterioration, paranoia and cortical blindness
    explanation: >-
      The original description places spasticity and dysphagia in the syndrome
      and orders them after the deafness, which is the claim this node makes.
  - reference: PMID:37325222
    reference_title: "Case report: Mohr-Tranebjaerg syndrome: hearing impairment as the onset of an insidious disorder with high recurrence risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He did not present any motor deficit but had a generalized increase in
      muscle tone, especially in the lower limbs, with moderate spasticity and
      hyperreflexia, with a spastic gait that was impossible without assistance.
    explanation: >-
      Documents the corticospinal signs in the same patient in whom the dysphagia
      appeared.
phenotypes:
- name: Auditory Neuropathy
  category: Neurologic
  description: >-
    Prelingual or postlingual sensorineural hearing impairment beginning in early
    childhood and progressing rapidly to profound loss. The electrophysiologic
    signature is retrocochlear — preserved otoacoustic emissions with absent or
    abnormal auditory brainstem response — reflecting spiral ganglion neuron loss
    rather than a cochlear hair-cell lesion. It is the earliest and most
    consistent manifestation and is near-universal in hemizygous males, but it is
    not obligate: a 2025 report describes a hemizygous adolescent with
    progressive dystonia and basal ganglia iron deposition and no hearing loss at
    all, so a normal audiogram does not exclude the diagnosis.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: auditory neuropathy (retrocochlear sensorineural hearing impairment)
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Males with deafness-dystonia-optic neuronopathy (DDON) syndrome have
      prelingual or postlingual sensorineural hearing impairment in early
      childhood
    explanation: GeneReviews establishes the defining phenotype and its onset.
  - reference: PMID:30634948
    reference_title: "Phenotype prediction of Mohr-Tranebjaerg syndrome (MTS) by genetic analysis and initial auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, otological examinations illustrated the typical postsynaptic
      auditory neuropathy for the proband without the symptoms of dystonia or
      optic atrophy. MRI demonstrated abnormal small cochlear symmetric nerves
    explanation: >-
      Documents the auditory-neuropathy pattern and the small cochlear nerves
      that go with a neural lesion.
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The hearing impairment appears to be consistent in age of onset and
      progression, whereas the neurologic, visual, and neuropsychiatric signs
      vary in degree of severity and rate of progression.
    explanation: >-
      Supports treating hearing loss as the consistent anchor of the phenotype
      while the later features vary.
  - reference: PMID:11449109
    reference_title: "Temporal bone histopathologic and genetic studies in Mohr-Tranebjaerg syndrome (DFN-1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensorineural hearing loss in Mohr-Tranebjaerg syndrome is the result of a
      postnatal, progressive, severe auditory neuropathy.
    explanation: >-
      States the auditory-neuropathy character of the hearing loss that this
      phenotype's preferred_term asserts and that HP:0000407 alone cannot carry.
  - reference: PMID:40597358
    reference_title: "A novel TIMM8A mutation in Mohr-Tranebjaerg syndrome without hearing loss and with basal ganglia iron deposition."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report a case of a male adolescent with a previously undescribed
      variant in TIMM8A, associated with progressive dystonia but no hearing
      loss, highlighting the clinical variability of MTS.
    explanation: >-
      Refutes obligate penetrance of the hearing phenotype in hemizygous males.
      Kept as a REFUTE item rather than lowering the frequency, because
      VERY_FREQUENT remains right and the exception is the clinically
      actionable part.
  - reference: PMID:17471106
    reference_title: "Otopathology in Mohr-Tranebjaerg syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We infer that the HL in MTS is likely to be the result of a postnatal and
      progressive degeneration of cochlear neurons and that MTS constitutes a
      true auditory neuropathy.
    explanation: >-
      Independent temporal-bone series reaching the same conclusion, and the
      basis for the management implication carried on the treatment entry.

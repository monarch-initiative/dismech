has_subtypes:
- name: Intragenic TIMM8A
  display_name: Intragenic TIMM8A variant (isolated DDON syndrome)
  classification: molecular
  description: >-
    Point mutations, frameshifts, and small indels confined to TIMM8A, producing
    DDON syndrome without immunodeficiency. Reported alleles include the
    structurally characterized C66W missense change, the initiation-codon variant
    p.Met1Leu, and frameshifts such as p.His21Argfs*11 and p.Gln75fs95*.
  evidence:
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a male proband who has a hemizygous TIMM8A pathogenic variant (~50% of
      affected males)
    explanation: GeneReviews gives the share of cases due to intragenic variants.
- name: Contiguous Xq22.1 deletion
  display_name: Contiguous Xq22.1 deletion (with X-linked agammaglobulinemia when BTK is included)
  classification: molecular
  description: >-
    Deletions at Xq22.1 removing TIMM8A together with neighbouring genes. Where
    the deletion extends into BTK, which lies telomeric to TIMM8A, the patient
    additionally has X-linked agammaglobulinemia and needs immunoglobulin
    replacement. The immunodeficiency is a consequence of the deletion size, not
    of TIMM8A loss, so it is curated here and not as a pathophysiology node.
  evidence:
  - reference: PMID:37325222
    reference_title: "Case report: Mohr-Tranebjaerg syndrome: hearing impairment as the onset of an insidious disorder with high recurrence risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the contiguous gene deletion includes BTK, located telomeric to
      TIMM8A, it additionally results in X-linked agammaglobulinemia
    explanation: >-
      States that the immunodeficiency arises from co-deletion of BTK rather than
      from TIMM8A loss.
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a contiguous gene deletion of Xq22.1 involving TIMM8A (~50% of affected
      males and females)
    explanation: GeneReviews gives the share of cases due to contiguous deletion.
  - reference: PMID:36056138
    reference_title: "Identification and analysis of deletion breakpoints in four Mohr-Tranebjærg syndrome (MTS) patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The contiguous gene deletions most commonly include the BTK gene (MIM:
      #300,300), which is located less than one kb downstream of TIMM8A, but
      larger deletions involving additional genes in the region have also been
      described
    explanation: >-
      Primary deletion-architecture source. The sub-kilobase distance between
      TIMM8A and BTK is why this subtype exists at all: the two genes are close
      enough that a deletion large enough to remove one usually removes the
      other.
  - reference: PMID:36056138
    reference_title: "Identification and analysis of deletion breakpoints in four Mohr-Tranebjærg syndrome (MTS) patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two of the XLA-MTS cases presented with large deletions (63.5 and 27.2
      kb), and the junctional regions were characterized by long stretches of
      microhomology, indicating that the events have emerged through homologous
      recombination.
    explanation: >-
      Gives the deletion sizes and the recombination mechanism generating them,
      which is the molecular basis of this subtype rather than of TIMM8A loss.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists. The literature
    is a case-series aggregate: the deep-research report records 91 affected
    individuals in 37 families from GeneReviews and 69 cases reported worldwide
    since 1960 from a 2019 cohort paper, but neither figure appears in a cached
    abstract, so no numeric rate is asserted here. The one quantitative
    diagnostic-yield figure that is citable comes from a targeted
    auditory-neuropathy sequencing cohort, and is recorded on the diagnosis
    section instead.

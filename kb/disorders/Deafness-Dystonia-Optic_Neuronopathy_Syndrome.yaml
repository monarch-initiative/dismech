- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Hemizygous males are essentially fully penetrant for the classic phenotype.
    Heterozygous females may have mild hearing impairment and focal dystonia;
    this is attributed to skewed X-chromosome inactivation rather than to a
    discrete modifier locus.

histopathology:
- name: Cochlear and Vestibular Ganglion Neuronal Loss
  description: >-
    Temporal-bone study shows near-complete loss of cochlear ganglion neurons
    with severe loss of vestibular neurons, while the hair cells of both organs
    and the geniculate and trigeminal ganglia are preserved — so the
    degeneration is selective, not a general ganglion-cell loss. The vestibular
    loss is largely clinically silent.
  evidence:
  - reference: PMID:11449109
    reference_title: Temporal bone histopathologic and genetic studies in Mohr-Tranebjaerg syndrome (DFN-1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was near complete loss of spiral ganglion cells with loss of nearly
      all peripheral and central processes. Only 1,765 spiral ganglion cells
      remained (8.5% of mean normal for age). The organ of Corti (including hair
      cells), stria vascularis, and spiral ligament were preserved.
    explanation: >-
      The decisive observation for this entry: the ganglion is destroyed while
      the organ of Corti and its hair cells are preserved, which is what makes
      the lesion retrocochlear rather than cochlear.
  - reference: PMID:11449109
    reference_title: Temporal bone histopathologic and genetic studies in Mohr-Tranebjaerg syndrome (DFN-1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was also a severe loss of Scarpa's ganglion cells with preservation
      of vestibular hair cells. The population of geniculate and trigeminal
      ganglion cells appeared normal.
    explanation: >-
      Documents the vestibular ganglion loss and shows the degeneration is
      selective rather than a general ganglion-cell loss.
  - reference: PMID:17471106
    reference_title: Otopathology in Mohr-Tranebjaerg syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When compared with age-matched controls, there was 90% to 95% loss of
      cochlear neurons and 75% to 85% loss of vestibular neurons.
    explanation: Quantifies the loss across four affected individuals.
  - reference: PMID:30634948
    reference_title: "Phenotype prediction of Mohr-Tranebjaerg syndrome (MTS) by genetic analysis and initial auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      while the vestibular function appeared to be less influenced
    explanation: >-
      Supports the clinical-silence half of this node: the vestibular ganglion is
      severely depleted histologically yet function testing is relatively spared,
      which is why vestibular involvement is recorded here and not as a
      phenotype.
- name: Multifocal Central Neuronal Loss
  description: >-
    Neuronal loss in the optic nerve, retina, striate cortex, basal ganglia, and
    dorsal roots of the spinal cord in affected males from two unrelated families
    carrying different TIMM8A mutations.
  evidence:
  - reference: PMID:11803487
    reference_title: "Neuronal cell death in the visual cortex is a prominent feature of the X-linked recessive mitochondrial deafness-dystonia syndrome caused by mutations in the TIMM8a gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings included neuronal cell loss in the optic nerve, retina,
      striate cortex, basal ganglia, and dorsal roots of the spinal cord.
    explanation: Direct human neuropathologic description.
genetic:
- name: TIMM8A
  gene_term:
    preferred_term: TIMM8A
    term:
      id: hgnc:11817
      label: TIMM8A
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TIMM8A gene product localizes to the intermembrane space in
      mitochondria where it functions in the import of nuclear-encoded proteins
      into the mitochondrial inner membrane. Frameshifts or premature stops
      represent the majority of mutations in TIMM8A that cause DDON syndrome.
    explanation: Establishes the gene product's localization, function, and variant spectrum.
  - reference: PMID:40075073
    reference_title: "CHCHD2 rescues the mitochondrial dysfunction in iPSC-derived neurons from patient with Mohr-Tranebjaerg syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The human TIMM8A gene consists of one intron and two exons, encoding
      a 97-amino acid protein, TIMM8a/DDP1, which is located in the
      intermembrane space (IMS) of mitochondria
    explanation: Gives the gene structure and protein size stated in this entry.
diagnosis:
- name: Auditory Neuropathy Electrophysiologic Signature
  description: >-
    Preserved otoacoustic emissions with absent or abnormal auditory brainstem
    response and absent stapedial reflex, in a structurally normal inner ear, in
    a male with early-onset hearing loss. Because this pattern separates a neural
    from a hair-cell lesion, it is the practical entry point to the diagnosis and
    the reason TIMM8A belongs on auditory-neuropathy sequencing panels.
  evidence:
  - reference: PMID:30634948
    reference_title: "Phenotype prediction of Mohr-Tranebjaerg syndrome (MTS) by genetic analysis and initial auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, we found another two TIMM8A variations, the deletion
      c.133_135delGAG and a copy number variation (CNV) including the TIMM8A
      gene, in two independent case, when we performed NGS on an auditory
      neuropathy population.
    explanation: >-
      Shows TIMM8A variants being recovered by sequencing an auditory-neuropathy
      cohort, which is what makes this signature diagnostically useful.
  - reference: PMID:11449109
    reference_title: "Temporal bone histopathologic and genetic studies in Mohr-Tranebjaerg syndrome (DFN-1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sensorineural hearing loss in Mohr-Tranebjaerg syndrome is the result of a
      postnatal, progressive, severe auditory neuropathy.
    explanation: >-
      Establishes the auditory-neuropathy character of the deficit that the
      electrophysiologic signature in this node detects.
  - reference: PMID:30634948
    reference_title: "Phenotype prediction of Mohr-Tranebjaerg syndrome (MTS) by genetic analysis and initial auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI demonstrated abnormal small cochlear symmetric nerves
    explanation: >-
      Qualifies this node's "structurally normal inner ear" framing: the
      labyrinth is normal, but the cochlear nerves themselves may be visibly
      small, which is itself consistent with a neural rather than cochlear
      lesion.
- name: Molecular Testing Including Deletion Analysis
  description: >-
    Sequence analysis of TIMM8A detects roughly half of cases; the remainder are
    contiguous Xq22.1 deletions that require deletion/duplication analysis or
    chromosomal microarray. Sequence-only testing therefore misses about half of
    affected individuals, and microarray is specifically indicated where
    co-occurring agammaglobulinemia suggests a BTK-spanning deletion.
  evidence:
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of DDON syndrome is established in either a male proband who
      has a hemizygous TIMM8A pathogenic variant (~50% of affected males) or a
      female proband who has a heterozygous TIMM8A pathogenic variant (~50% of
      affected females) or a contiguous gene deletion of Xq22.1 involving TIMM8A
      (~50% of affected males and females)
    explanation: >-
      GeneReviews gives the split between sequence-detectable and
      deletion-detectable cases.
differential_diagnoses:
- name: Usher syndrome
  description: >-
    Also combines deafness with progressive visual loss, but the visual lesion is
    a retinal dystrophy with an abnormal electroretinogram, whereas DDON has optic
    atrophy with a typically normal electroretinogram.
- name: Wolfram syndrome
  description: >-
    Also combines hearing loss with optic atrophy, but is distinguished by
    juvenile-onset diabetes mellitus and the absence of dystonia.
- name: MEGDEL syndrome
  description: >-
    SERAC1-related deafness-dystonia, distinguished by Leigh-like MRI features
    and 3-methylglutaconic aciduria.
- name: Arts syndrome
  description: >-
    PRPS1-related X-linked disorder in which hearing loss predominates without
    the dystonia of DDON.
treatments:
- name: Cochlear Device Implantation
  description: >-
    Cochlear implantation is attempted and has been performed in DDON, but
    benefit is variable and generally less than in hair-cell sensorineural
    deafness. The reason is specific and follows from the pathograph: an implant
    works by bypassing the hair cells and electrically stimulating the spiral
    ganglion neurons directly, and in this disease those neurons are the
    population that has degenerated - 8.5% of the age-normal count remained in
    the case with a cytocochleogram, in an ear whose organ of Corti and hair
    cells were preserved. The device's target is what the disease destroys,
    which is the opposite of the usual indication.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Auditory Neuropathy
    description: >-
      Addresses the hearing phenotype symptomatically. It cannot restore the
      spiral ganglion neurons it depends on for stimulation, which is why
      benefit is limited and variable.
  evidence:
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Because auditory neuronopathy is the cause of the hearing loss, hearing
      aids have only variable success.
    explanation: >-
      GeneReviews states the mechanistic principle - the neural basis of the
      loss limits what a peripheral device achieves. Graded INDIRECT because it
      is stated of hearing aids, and this entry applies it to implantation.
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at age 6 years received cochlear implants
    explanation: >-
      Establishes that implantation is actually performed in this disease, which
      the GeneReviews hearing-aid statement does not.
  - reference: PMID:11449109
    reference_title: "Temporal bone histopathologic and genetic studies in Mohr-Tranebjaerg syndrome (DFN-1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 1,765 spiral ganglion cells remained (8.5% of mean normal for age).
      The organ of Corti (including hair cells), stria vascularis, and spiral
      ligament were preserved.
    explanation: >-
      Quantifies the depletion of the exact neuronal population a cochlear
      implant stimulates, which is the mechanistic basis for the limited
      benefit this entry describes.
- name: Physical and Occupational Therapy
  description: >-
    Physical medicine and rehabilitation to improve fine and gross motor skills
    and mobility, prevent contractures, and provide adaptive devices for
    activities of daily living.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Dystonia
    description: Symptomatic management of the movement disorder and its complications.
  evidence:
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Physical medicine and rehabilitation, physical and occupational therapy to
      improve fine and gross motor skills and mobility, to prevent contractures,
      and to provide adaptive devices to improve activities of daily living.
    explanation: GeneReviews management recommendation for the motor phenotype.
- name: Genetic Counseling
  description: >-
    Counseling for carrier females, whose recurrence risk is 50% per pregnancy,
    with prenatal and preimplantation testing available once the familial variant
    is known. The 2023 four-affected-male family report makes the case that
    timely etiologic investigation of childhood hearing loss is what brings this
    within reach.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37325222
    reference_title: "Case report: Mohr-Tranebjaerg syndrome: hearing impairment as the onset of an insidious disorder with high recurrence risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrence risk is high for female carriers, and reproductive options
      should be offered.
    explanation: Directly supports counseling as a management component.
- name: Antioxidant Rescue (preclinical only)
  description: >-
    Not a clinical treatment, and recorded here as the only pharmacological lead
    in the cited literature. In neuronal cells lacking hTim8a the complex IV
    assembly defect produces oxidative stress that primes the cells for
    apoptosis, and relieving that stress with vitamin E rescues them. This is a
    cell-culture result with no human evidence in DDON; it is curated so the lead
    is findable, not to imply a therapy.
  treatment_term:
    preferred_term: antioxidant supplementation (investigational, cell models only)
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vitamin E
      term:
        id: CHEBI:33234
        label: vitamin E
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Neuronal Bioenergetic Failure
    description: >-
      Acts on the oxidative-stress consequence of the complex IV assembly defect,
      not on the assembly defect itself.
  evidence:
  - reference: PMID:31682224
    reference_title: "Function of hTim8a in complex IV assembly in neuronal cells provides insight into pathomechanism underlying Mohr-Tranebjærg syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Alleviation of oxidative stress with Vitamin E treatment rescues cells from
      apoptotic vulnerability.
    explanation: >-
      The rescue result this entry records. In vitro only, which is why the
      treatment is labelled preclinical.
- name: Supportive and Multidisciplinary Care
  description: >-
    There is no disease-modifying therapy. Management is supportive: standard
    treatment of psychiatric issues, deaf-blind service referral and tactile sign
    language as vision loss compounds the deafness, feeding support for
    dysphagia, and surveillance across audiology, ophthalmology, and neurology.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301395
    reference_title: "Deafness-Dystonia-Optic Neuronopathy Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Educational programs for developmental and sensory deficits, including
      training in tactile sign language.
    explanation: GeneReviews management recommendation for combined sensory loss.

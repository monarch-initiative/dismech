disease_term:
  preferred_term: deafness dystonia syndrome
  term:
    id: MONDO:0010578
    label: deafness dystonia syndrome
description: >-
  Deafness-dystonia-optic neuronopathy (DDON) syndrome, universally known in the
  clinical literature as Mohr-Tranebjaerg syndrome, is an X-linked recessive
  neurodegenerative disorder caused by loss of function of TIMM8A, which encodes
  the 97-amino-acid deafness/dystonia peptide DDP1 of the mitochondrial
  intermembrane space. Affected males follow a stereotyped four-stage sequence:
  prelingual or postlingual sensorineural hearing impairment in early childhood,
  slowly progressive dystonia or ataxia in the teens, decreased visual acuity
  from optic atrophy from about age 20, and dementia from about age 40.
  Psychiatric features do not belong to that last stage — personality change and
  paranoia may appear in childhood and progress alongside everything else.

  Two features distinguish this entry from a generic syndromic hearing-loss
  entry. First, the deafness is an auditory neuropathy: the lesion is
  retrocochlear, with near-total loss of cochlear spiral ganglion neurons on
  temporal-bone histopathology while the cochlear hair cells are comparatively
  spared. That is not a descriptive detail — it is why hearing aids and cochlear
  implantation have only variable success, and it makes the treatment section a
  consequence of the pathograph rather than a separate list. Second, the disorder
  was among the first framed as a mitochondrial disease of the protein-import
  machinery rather than of an oxidative-phosphorylation subunit: DDP1 partners
  with TIMM13 as a hexameric intermembrane-space chaperone that escorts
  hydrophobic precursors, notably TIM23, to the inner membrane.

  How that molecular lesion becomes a neuron-selective disease is not settled.
  The TIM23-import account rests on human and yeast in-vitro and in-organello
  work, but the Timm8a1 mutant mouse shows hearing and cognitive impairment with
  abnormal mitochondrial structure and yet no detectable defect in Tim23 import
  or in oxidative-phosphorylation biogenesis, and a 2025 patient-iPSC study calls
  the cross-membrane transport mechanism in humans controversial while locating
  the neuronal defect in complex IV assembly and a downstream fall in CHCHD2.
  This entry curates both readings and records the mismatch rather than
  harmonizing them.

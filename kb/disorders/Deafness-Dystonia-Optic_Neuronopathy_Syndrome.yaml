experimental_models:
- name: MTS patient iPSC-derived neurons with isogenic CRISPR control
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    iPSCs from a male MTS patient carrying TIMM8A c.225-229del (p.Q75fs95*),
    differentiated into neurons and compared against both a healthy control line
    and an isogenic control into which the same mutation was introduced by
    CRISPR/Cas9. The isogenic arm is what lets the neuronal phenotype be
    attributed to the variant rather than to line background.
  publication: PMID:40075073
  modeled_mechanisms:
  - target: Neuronal Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Patient and isogenic-mutant neurons both show reduced complex IV level and
      activity, reduced ATP, increased reactive oxygen species, and mitochondrial
      fragmentation, with impaired neuronal differentiation.
    limitations: >-
      A cell model cannot report the staged, decades-long selectivity of the
      human disease across auditory, basal ganglia, and visual populations.
    evidence:
    - reference: PMID:40075073
      reference_title: "CHCHD2 rescues the mitochondrial dysfunction in iPSC-derived neurons from patient with Mohr-Tranebjaerg syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mitochondrial function analysis revealed reduced protein levels and
        activity of complex IV, diminished ATP synthesis, and increased reactive
        oxygen species (ROS) generation in MTS- and MUT-neurons.
      explanation: Supports this human cell model as informative for the node.
    readouts:
    - name: Complex IV protein level and activity
      target: Neuronal Bioenergetic Failure
      direction: DECREASED
      interpretation: Bioenergetic correlate of the neuronal mitochondrial deficit.
      evidence:
      - reference: PMID:40075073
        reference_title: "CHCHD2 rescues the mitochondrial dysfunction in iPSC-derived neurons from patient with Mohr-Tranebjaerg syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Mitochondrial function analysis revealed reduced protein levels and
          activity of complex IV, diminished ATP synthesis, and increased
          reactive oxygen species (ROS) generation in MTS- and MUT-neurons.
        explanation: Reports the complex IV measurement behind this readout.
    - name: CHCHD2 rescue of neurite outgrowth
      target: Neuronal Bioenergetic Failure
      direction: RESTORED
      interpretation: >-
        Overexpressing CHCHD2 reverses the mitochondrial and neurite phenotype,
        placing CHCHD2 downstream of TIMM8a loss.
      evidence:
      - reference: PMID:40075073
        reference_title: "CHCHD2 rescues the mitochondrial dysfunction in iPSC-derived neurons from patient with Mohr-Tranebjaerg syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Overexpression of CHCHD2 rescued mitochondrial dysfunction and promoted
          neurite elongation in MTS-neurons, suggesting that CHCHD2 acts as a
          downstream effector of TIMM8a in the pathogenesis of MTS.
        explanation: Reports the rescue measurement behind this readout.
- name: MTS patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Patient fibroblasts carrying C66W or p.Met1Leu, used to show absence of
    TIMM8a protein, reduced steady-state TIMM13, and altered mitochondrial
    morphology.
  publication: PMID:31903733
  modeled_mechanisms:
  - target: TIM8-TIM13 Chaperone Complex Assembly Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Directly demonstrates loss of DDP1 and the commensurate fall in its
      obligate partner in patient-derived cells.
    limitations: >-
      Fibroblasts are not an affected cell type in this disease, so they report
      the molecular lesion but not the neuron-selective consequence.
    evidence:
    - reference: PMID:31903733
      reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We observed a commensurate decrease in the steady-state level of the
        Tim13 protein (the binding partner of Tim8a) but no decrease in TIMM13
        transcripts.
      explanation: Supports the fibroblast model as informative for complex assembly.
discussions:
- discussion_id: timm8a_tim23_import_in_vivo
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Intermembrane-Space Escort of Hydrophobic Precursors
  prompt: >-
    Is impaired TIM23 import actually the operative lesion, given that patient
    fibroblasts, RNAi knockdown cells and the Timm8a1 mutant mouse all fail to
    show the import or respiratory defect that patient lymphoblasts do?
  rationale: >-
    This is not a clean species gap, and the entry should not be read as one.
    The disagreement is already present within human patient cells. Patient
    lymphoblasts carrying DDP1-Q34X showed decreased NADH and defects in
    mitochondrial protein import (PMID:15254020), while RNAi knockdown and
    patient fibroblasts showed no effect on respiration or membrane potential
    and the TIM23 account was framed there as a proposal (PMID:21984432). The
    mouse then sides with the negative result: Tim23 and Tom40 import and
    oxidative-phosphorylation biogenesis were assayed in the Timm8a1 mutant and
    reported unaffected (PMID:32820032), and the same group states in the
    follow-up that "we and others did not find Tim8a to mediate the biogenesis
    of Tim23" (PMID:36090790). PMID:40075073 calls the human mechanism
    controversial outright.

    So the honest reading is a contested step, not a species artifact, and the
    contest may be about cell type rather than about the biochemistry: the
    positive result is in a lymphoid line, the negatives are in fibroblasts,
    HeLa and whole mouse brain, and none of those is an affected cell type. Two
    alternative accounts have their own support and do not require TIM23
    depletion: neuron-specific complex IV assembly through COX17
    (PMID:31682224), and loss of the citrin/aralar1 aspartate-glutamate
    carriers, whose expression is prominent in large brain neurons
    (PMID:15254020). The distinction matters practically, because CHCHD2 is
    currently the only node in this entry with a demonstrated rescue.
  proposed_experiments:
  - experiment_id: tim23_import_in_patient_neurons
    name: Assay TIM23 steady-state level and import in patient-derived neurons
    description: >-
      Every result on either side of this contradiction comes from a cell type
      the disease spares: lymphoblasts, fibroblasts, HeLa, and whole mouse
      brain. The MTS patient iPSC-derived neurons with an isogenic CRISPR
      control already exist (PMID:40075073), so measuring TIM23 import and
      steady-state level in them would test the step for the first time in the
      cell type that actually degenerates, and would discriminate a cell-type
      explanation of the disagreement from a straightforwardly wrong mechanism.
    readouts:
    - name: TIM23 steady-state level in patient-derived neurons
      target: pathophysiology#Impaired Intermembrane-Space Escort of Hydrophobic Precursors
      direction: DECREASED
      interpretation: >-
        A reduction in the human neuronal context would support the import
        account; an unchanged level would align the human neuron with the mouse
        and move the mechanism onto the CHCHD2/complex IV arm.
    would_support:
    - pathophysiology#Impaired Intermembrane-Space Escort of Hydrophobic Precursors
    supporting_outcome:
    - >-
      Reduced TIM23 steady-state level and impaired import in patient
      iPSC-derived neurons relative to the isogenic control.
    refuting_outcome:
    - >-
      TIM23 import and steady-state level indistinguishable from the isogenic
      control, as in the mutant mouse, despite the complex IV and CHCHD2
      phenotype being present.
notes: >-
  Naming: MONDO labels this concept "deafness dystonia syndrome", which is used
  for disease_term, while the entry name follows the GeneReviews title. The
  eponym Mohr-Tranebjaerg syndrome is what the clinical literature uses almost
  exclusively. Jensen syndrome (MIM 311150) was described separately and was
  shown to be allelic when a TIMM8a stop mutation was found segregating in the
  original Danish family, so it is carried here as a synonym rather than as a
  separate entry.

  The vestibular ganglion is severely affected histologically while vestibular
  function testing is relatively spared, so the vestibular involvement is
  recorded under histopathology and deliberately not curated as a phenotype.

  Term notes, so they are not re-litigated. HPO has no term for auditory
  neuropathy, so the hearing phenotype is bound to HP:0000407 Sensorineural
  hearing impairment with the neural character carried in preferred_term and in
  the description; HP:0011971, which is easy to reach for by name, is
  Dermatographic urticaria. The striatal cell type in the neurodegeneration node
  is left unbound because the neuropathology resolves only to basal ganglia and
  striatum, and binding a neuron subclass such as medium spiny neuron would
  assert a specificity no cited source supports.

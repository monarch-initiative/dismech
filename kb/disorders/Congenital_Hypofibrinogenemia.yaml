diagnosis:
- name: Functional and antigenic plasma fibrinogen assays
  diagnosis_term:
    preferred_term: Coagulation Study
    term:
      id: NCIT:C62662
      label: Coagulation Study
  description: >-
    Standard clotting assays (PT, aPTT, thrombin time, reptilase time) paired
    with functional (Clauss) and immunological antigenic fibrinogen
    quantification.
  presence: Proportionally decreased functional and antigenic fibrinogen (<1.5 g/L) with functional-to-antigenic ratio >0.7 and variably prolonged clotting times
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional and antigenic fibrinogen levels are proportionally decreased"
    explanation: Establishes proportional reduction of both functional and antigenic fibrinogen as a laboratory diagnostic hallmark.
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A ratio of functional on antigenic fibrinogen level higher than 0.7 is traditionally used to distinguish between hypofibrinogenemia and dysfibrinogenemia"
    explanation: Documents the >0.7 functional-to-antigenic fibrinogen ratio used to distinguish hypofibrinogenemia from dysfibrinogenemia.

name: Congenital Hypofibrinogenemia
creation_date: '2026-05-16T00:00:00Z'
category: Genetic
parents:
- Bleeding Disorder
- Coagulation Disorder
disease_term:
  preferred_term: congenital hypofibrinogenemia
  term:
    id: MONDO:0015096
    label: familial hypofibrinogenemia
synonyms:
- familial hypofibrinogenemia
description: >-
  Congenital hypofibrinogenemia is a quantitative (Type I) congenital fibrinogen
  disorder caused by mutations in the fibrinogen genes FGA, FGB, or FGG, leading
  to proportionally reduced functional and antigenic plasma fibrinogen
  (typically <1.5 g/L). In the simple form, the defect is a loss-of-function:
  heterozygosity for null or hypomorphic alleles roughly halves fibrinogen
  output, the liver is structurally normal, and the bleeding tendency is mild
  and strongly dependent on the residual fibrinogen level (patients are
  frequently asymptomatic). This entry covers the simple quantitative form; the
  mechanistically distinct hepatic fibrinogen storage disease (toxic
  gain-of-function FGG variants causing hepatocyte ER aggregation) is treated as
  a separate entity.
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Quantitative inherited coagulation factor I (fibrinogen) deficiency
      predisposing to level-dependent bleeding and obstetrical hemorrhage.
    evidence:
    - reference: PMID:29316703
      reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Quantitative (also known as Type I) disorders affect the quantity of fibrinogen in circulation: hypofibrinogenemia is characterized by fibrinogen levels lower than 1.5 g/L; afibrinogenemia, an autosomal recessive disease, is characterized by the complete deficiency of fibrinogen."
      explanation: Defines congenital hypofibrinogenemia as a quantitative disorder of circulating coagulation fibrinogen.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Inherited disorder caused by heterozygous germline loss-of-function or
      secretion-impairing variants in FGA, FGB, or FGG.
    evidence:
    - reference: PMID:29316703
      reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital fibrinogen disorders are caused by mutations in one of the three fibrinogen chain-encoding genes."
      explanation: Establishes the monogenic basis of congenital hypofibrinogenemia across FGA, FGB, and FGG.
prevalence:
- population: General population
  prevalence_class: RARE
  notes: >-
    Inherited fibrinogen disorders are rare; a precise population prevalence for
    congenital hypofibrinogenemia is not well established, and many heterozygous
    carriers are detected incidentally.
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inherited disorders of fibrinogen are rare."
    explanation: >-
      The review states that inherited fibrinogen disorders, including
      quantitative defects such as hypofibrinogenemia, are rare.
pathophysiology:
- name: Reduced Hepatic Fibrinogen Synthesis and Secretion
  biological_scale: CELLULAR
  description: >-
    Heterozygosity for fibrinogen null or hypomorphic alleles (large deletions,
    frameshift, nonsense, splice-site, or secretion-impairing missense
    mutations) reduces the amount of normal fibrinogen hexamer assembled and
    secreted by hepatocytes, roughly halving hepatic fibrinogen output.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  genes:
  - preferred_term: FGA
    term:
      id: hgnc:3661
      label: FGA
  - preferred_term: FGB
    term:
      id: hgnc:3662
      label: FGB
  - preferred_term: FGG
    term:
      id: hgnc:3694
      label: FGG
  molecular_functions:
  - preferred_term: fibrinogen structural molecule activity
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  downstream:
  - target: Systemic Plasma Fibrinogen Depletion
    description: >-
      Reduced hepatic fibrinogen hexamer synthesis and secretion proportionally
      lowers functional and antigenic plasma fibrinogen levels.
    causal_link_type: DIRECT
  - target: Hypofibrinogenemia
    description: >-
      Reduced hepatic fibrinogen output produces the defining low circulating
      fibrinogen concentration (<1.5 g/L).
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypofibrinogenemia is generally caused by heterozygosity for these mutations."
    explanation: >-
      The review attributes hypofibrinogenemia to heterozygosity for the
      fibrinogen-deficiency mutation classes, i.e. a loss-of-function mechanism.
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "causative mutations can be divided into two main classes: null mutations with no protein production at all and mutations producing abnormal protein chains which are retained inside the cell"
    explanation: >-
      The review describes the two causative-mutation classes underlying
      quantitative fibrinogen deficiency.
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital fibrinogen disorders are caused by mutations in one of the three fibrinogen chain-encoding genes."
    explanation: >-
      Places all three fibrinogen chain genes on this node: any one of them can
      carry the lesion that reduces hepatic fibrinogen output, so the node is
      the shared convergence point rather than a per-gene step.
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distribution of mutations shows 143 distinct mutations in FGA (73 quantitative, 32 qualitative, 18 amyloidosis mutations), 87 in FGB (61 quantitative, 18 qualitative), and 136 in FGG (66 quantitative, 40 qualitative)."
    explanation: >-
      The mutation-database census confirms that quantitative alleles are
      recorded in each of the three genes, which is why none of them is left off
      this node.
- name: Systemic Plasma Fibrinogen Depletion
  biological_scale: ORGANISM
  description: >-
    Concordantly reduced functional and antigenic fibrinogen concentrations in
    circulating blood plasma (<1.5 g/L, with normal structure of the secreted
    fibrinogen molecule) limit substrate availability for hemostasis and
    placental matrix support.
  locations:
  - preferred_term: blood plasma
    term:
      id: UBERON:0001969
      label: blood plasma
  biological_processes:
  - preferred_term: blood coagulation
    modifier: DECREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional and antigenic fibrinogen levels are proportionally decreased"
    explanation: Confirms proportional depletion of both functional and antigenic plasma fibrinogen in hypofibrinogenemia.
  downstream:
  - target: Impaired Fibrin Clot Formation
    description: >-
      Reduced circulating plasma fibrinogen limits the substrate available for
      thrombin-mediated conversion to cross-linked fibrin.
    causal_link_type: DIRECT
  - target: Defective Placental Trophoblast Support
    description: >-
      Low maternal circulating fibrinogen provides insufficient fibrin/fibrinogen
      matrix support at the developing uteroplacental interface.
    causal_link_type: DIRECT
- name: Impaired Fibrin Clot Formation
  biological_scale: MOLECULAR
  description: >-
    Low plasma fibrinogen limits fibrin polymerization, so clot-based
    coagulation assays are prolonged in proportion to the residual fibrinogen
    level.
  locations:
  - preferred_term: blood plasma
    term:
      id: UBERON:0001969
      label: blood plasma
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    modifier: DECREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  downstream:
  - target: Bleeding Diathesis
    description: >-
      Impaired fibrin clot formation predisposes to a level-dependent bleeding
      tendency.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In hypofibrinogenemia, standard clotting assays are variably prolonged according to the circulating fibrinogen level."
    explanation: >-
      The review notes that clotting assays are prolonged in proportion to the
      circulating fibrinogen level in hypofibrinogenemia.
- name: Bleeding Diathesis
  biological_scale: ORGANISM
  description: >-
    The bleeding tendency is mild and strongly correlated with the residual
    coagulant fibrinogen level; many patients are asymptomatic, and bleeding is
    typically provoked by trauma or surgery or manifests on mucosal surfaces.
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a mean fibrinogen activity level of at least 0.7 g/L protected from spontaneous bleeding, while patients with a level above 1.0 g/L did not experience bleeds"
    explanation: >-
      The retrospective cohort data quantify the level-dependence of the
      bleeding phenotype in fibrinogen deficiency.
  downstream:
  - target: Abnormal Bleeding
    description: >-
      A level-dependent bleeding diathesis manifests clinically as variable
      abnormal bleeding.
    causal_link_type: DIRECT
  - target: Persistent Bleeding After Trauma
    description: >-
      In the mild quantitative deficiency state, bleeding is most often
      provoked by trauma or surgery rather than occurring spontaneously.
    causal_link_type: DIRECT
  - target: Menorrhagia
    description: >-
      Reduced clot stability can manifest as heavy menstrual bleeding in
      affected women.
    causal_link_type: DIRECT
  - target: Epistaxis
    description: >-
      Impaired mucosal fibrin hemostasis predisposes symptomatic individuals to
      epistaxis.
    causal_link_type: DIRECT
  - target: Gingival bleeding
    description: >-
      Impaired oral mucosal hemostasis predisposes symptomatic individuals to
      gingival bleeding.
    causal_link_type: DIRECT
- name: Defective Placental Trophoblast Support
  biological_scale: TISSUE
  description: >-
    Insufficient maternal fibrinogen impairs cytotrophoblast spreading and
    fetal-maternal vascular stabilization in the developing placenta,
    predisposing pregnant hypofibrinogenemic women to recurrent placental
    abruption and pregnancy loss.
  cell_types:
  - preferred_term: trophoblast cell
    term:
      id: CL:0000351
      label: trophoblast cell
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, fibrinogen is necessary to provide placental integrity by supporting the spreading of cytotrophoblasts at 4–6 weeks of gestation ... and for the optimal development of the fetal-maternal vascular throughout pregnancy"
    explanation: Explains the cellular and vascular requirement for maternal fibrinogen in cytotrophoblast spreading and placental integrity.
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "such as recurrent placenta abruption, suggesting insufficient fibrinogen to sustain placenta development"
    explanation: Directly links low fibrinogen levels in hypofibrinogenemic women to insufficient placental support and recurrent placental abruption.
  downstream:
  - target: Obstetrical complications
    description: >-
      Insufficient fibrinogen compromises placental integrity during pregnancy,
      producing a spectrum of obstetrical complications.
    causal_link_type: DIRECT
  - target: Placental abruption
    description: >-
      Defective fibrinogen-mediated uteroplacental attachment directly
      predisposes to recurrent placental abruption.
    causal_link_type: DIRECT

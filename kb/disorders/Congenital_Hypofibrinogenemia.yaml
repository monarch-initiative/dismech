    explanation: Confirms sequencing of FGA, FGB, and FGG as the molecular diagnostic method.
differential_diagnoses:
- name: Hepatic fibrinogen storage disease
  description: >-
    Toxic gain-of-function disorder caused by specific FGG missense variants
    near polymerization pocket hole 'a' that aggregate inside hepatocyte
    endoplasmic reticulum, combining moderate hypofibrinogenemia with chronic
    liver storage disease.
  distinguishing_features:
  - Chronic liver disease with hepatocyte endoplasmic reticulum fibrinogen-immunopositive inclusions on liver biopsy, restricted to specific FGG variants near pocket 'a'.
  evidence:
  - reference: PMID:29316703
    reference_title: "Clinical Consequences and Molecular Bases of Low Fibrinogen Levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypofibrinogenemic patients can suffer from fibrinogen storage disease, which is due to the accumulation of fibrinogen aggregates in the endoplasmic reticulum of hepatocytes [48]."
    explanation: Distinguishes hepatic fibrinogen storage disease by hepatocyte ER fibrinogen aggregation and liver pathology.
treatments:
- name: Fibrinogen Replacement Therapy
  description: >-
    Fibrinogen supplementation (fibrinogen concentrate) for on-demand
    management of bleeding episodes or perioperative/peripartum prophylaxis;
    asymptomatic patients with adequate residual levels generally require no
    treatment.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fibrinogen concentrate
      term:
        id: NCIT:C81126
        label: Fibrinogen Human
  target_mechanisms:
  - target: Systemic Plasma Fibrinogen Depletion
    treatment_effect: RESTORES
    description: Exogenous human fibrinogen concentrate directly replenishes circulating plasma fibrinogen.
  - target: Impaired Fibrin Clot Formation
    treatment_effect: RESTORES
    description: Restoring plasma fibrinogen concentration re-establishes normal fibrin clot formation.
  - target: Abnormal Bleeding
    treatment_effect: INHIBITS
    description: On-demand or perioperative supplementation controls and prevents trauma- or surgery-provoked bleeding.
  - target: Placental abruption
    treatment_effect: INHIBITS
    description: Maternal fibrinogen replacement supports uteroplacental integrity during pregnancy.
  evidence:
  - reference: PMID:36055263
    reference_title: "One Hundred Years of Congenital Fibrinogen Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fibrinogen supplementation is the cornerstone of bleeding management in fibrinogen disorders."
    explanation: >-
      The review identifies fibrinogen supplementation as the mainstay of
      bleeding management in congenital fibrinogen disorders.

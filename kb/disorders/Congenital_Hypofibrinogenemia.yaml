notes: >-
  Scope note: this entry models the simple quantitative (Type I) form
  (loss-of-function, liver structurally normal). Hepatic fibrinogen storage
  disease (HFSD) — toxic gain-of-function FGG missense variants near
  polymerization pocket "hole a" causing hepatocyte endoplasmic-reticulum
  fibrinogen aggregation and a distinct hepatopathy — is mechanistically
  distinct and is curated as the separate entry
  `Hepatic_Fibrinogen_Storage_Disease`, where MONDO:7770747 is the bound
  disease_term. MONDO places that class as a child of the familial
  hypofibrinogenemia term this entry carries, so the two entries divide one MONDO
  subtree along the loss-of-function / toxic-gain-of-function line rather than
  overlapping.

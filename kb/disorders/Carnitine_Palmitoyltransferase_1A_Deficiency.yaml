  description: Sudden death can complicate severe metabolic disease. This clinical risk is distinct from population-level p.Pro479Leu mortality associations.
  evidence:
  - reference: PMID:11350182
    reference_title: Molecular and enzymatic characterization of a unique carnitine palmitoyltransferase 1A mutation in the Hutterite community.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Symptomatology comprises attacks of hypoketotic hypoglycemia with risk of sudden death or neurological sequelae.
    explanation: Clinical background describing severe disease risk.
- name: Vomiting
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  description: Vomiting can accompany hepatic encephalopathy and worsen oral intake during a crisis.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Manifestations can include vomiting and altered mental status ranging from fatigue and lethargy to coma and/or death.
    explanation: Clinical presentation of hepatic encephalopathy.
- name: Hyperlipidemia
  phenotype_term:
    preferred_term: Hyperlipidemia
    term:
      id: HP:0003077
      label: Hyperlipidemia
  description: Transient hyperlipidemia has been reported during metabolic disease.
  evidence:
  - reference: PMID:11286380
    reference_title: Features of carnitine palmitoyltransferase type I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We discuss four new cases in three families showing, variously, renal tubular acidosis, transient hyperlipidaemia and, paradoxically, myopathy with elevated creatinine kinase or cardiac involvement in the neonatal period as additional features that deserve wider recognition.
    explanation: The four-case report broadens the classic hepatic presentation; no population frequency is inferred.
biochemical:
- name: Free carnitine and C0/(C16+C18) ratio
  presence: INCREASED
  notes: These are screening clues, not obligatory abnormalities. Normal plasma free carnitine and even a normal ratio can occur at diagnostic confirmation or follow-up; dried blood spots are more sensitive.
  evidence:
  - reference: PMID:41017303
    reference_title: Pitfalls in the diagnosis of carnitine palmitoyltransferase 1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Our cases demonstrate that acylcarnitine profiles and especially concentrations of free carnitine can be normal in plasma in infants with CPT1AD at confirmation diagnosis after screening and during follow-up.
    explanation: Qualifies the expected biochemical profile.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: CPT1A deficiency is characterized by marked reduction in the synthesis of all acylcarnitine species and increased levels of free carnitine (C0).
    explanation: Explains the usual profile.
- name: Long-chain acylcarnitines
  presence: DECREASED
  notes: Reduced formation underlies the high free-to-long-chain acylcarnitine ratio. Absolute values can normalize outside a crisis.
  evidence:
  - reference: PMID:21763168
    reference_title: Impaired fasting tolerance among Alaska native children with a common carnitine palmitoyltransferase 1A sequence variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Plasma free fatty acids increased normally in these children but their long-chain acylcarnitine and ketone production was significantly blunted.
    explanation: Fasting physiological evidence in p.Pro479Leu homozygotes.
- name: Urinary dodecanedioic and 3-hydroxyglutaric acids
  presence: INCREASED
  notes: Reported in a three-patient series; useful supportive clues, not specific confirmatory markers.
  evidence:
  - reference: PMID:16146704
    reference_title: Novel metabolic and molecular findings in hepatic carnitine palmitoyltransferase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Abnormal findings included a hypoketotic dicarboxylic aciduria with prominence of the C12 dicarboxylic (dodecanedioic) acid.
    explanation: Supports dodecanedioic aciduria.
  - reference: PMID:16146704
    reference_title: Novel metabolic and molecular findings in hepatic carnitine palmitoyltransferase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In addition, increased excretion of 3-hydroxyglutaric acid was detected in all three patients
    explanation: Supports the additional urine finding.
genetic:
- name: CPT1A
  gene_term:
    preferred_term: CPT1A
    term:
      id: hgnc:2328
      label: CPT1A
  relationship_type: CAUSATIVE
  association: Biallelic loss of function
  features: Pathogenic alleles include missense, nonsense, splice-site and small insertion/deletion variants, with rare exon or multiexon deletions. Residual enzyme activity and clinical penetrance vary by allele; hypomorphic population variants should not be equated with uniformly severe classic disease.
  inheritance:
  - name: Autosomal recessive
    description: For two carrier parents, recurrence risk is 25% affected, 50% carrier and 25% neither. For a carrier and an affected parent, risk is 50% affected and 50% carrier. Unaffected carriers generally have no metabolic phenotype; pregnancy with an affected fetus is a separate maternal risk context.
    evidence:
    - reference: PMID:20301700
      reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: When both parents are carriers of a CPT1A pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
      explanation: Specifies recurrence risks for two carrier parents.
    - reference: PMID:20301700
      reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: When one parent is a carrier and the other parent has two CPT1A pathogenic variants, each sib of an affected individual has at conception a 50% chance of being affected and a 50% chance of being an asymptomatic carrier.
      explanation: Distinguishes the second parental configuration.
  variants:
  - name: p.Pro479Leu (c.1436C>T)
    description: Common hypomorphic allele in several northern Indigenous populations. A patient fibroblast study found approximately 20% residual activity and partial resistance to malonyl-CoA inhibition. Most homozygotes are asymptomatic, but supervised fasting in five children demonstrated reduced ketogenesis and symptomatic hypoglycemia in two. Population associations with infectious illness and infant mortality do not establish a direct immune defect or an inevitable clinical outcome.
    evidence:
    - reference: PMID:11441142
      reference_title: 'Molecular characterization of L-CPT I deficiency in six patients: insights into function of the native enzyme.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The patient with atypical symptoms had approximately 20% of normal L-CPT I activity and was homozygous for a mutation (c.1436C-->T) that substituted leucine for proline at codon 479.
      explanation: Single-patient biochemical characterization.
    - reference: PMID:11441142
      reference_title: 'Molecular characterization of L-CPT I deficiency in six patients: insights into function of the native enzyme.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Assays performed with his cultured skin fibroblasts indicated that this mutation confers partial resistance to the inhibitory effects of malonyl-CoA.
      explanation: Functional regulation differs from complete enzyme loss.
    - reference: PMID:21763168
      reference_title: Impaired fasting tolerance among Alaska native children with a common carnitine palmitoyltransferase 1A sequence variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Homozygosity for the c.1436C→T sequence variant of CPT1A impairs fasting ketogenesis, and can cause hypoketotic hypoglycemia in young children.
      explanation: The small physiological study establishes possible fasting intolerance, not population penetrance.
    - reference: PMID:34295859
      reference_title: Association of the CPT1A p.P479L Metabolic Gene Variant With Childhood Respiratory and Other Infectious Illness in Nunavut.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: In multivariable analysis, p.P479L homozygosity was associated with LRTI admission (aOR:2.88 95%CI:1.46-5.64), otitis media (aOR:1.83, 95%CI:1.05-3.21), and gastroenteritis (aOR:1.74, 95%CI:1.09-2.77), compared to non-carriers.
      explanation: Adjusted associations in a retrospective Nunavut cohort; this does not demonstrate immunodeficiency.
  - name: p.Gly710Glu (c.2129G>A)
    description: Hutterite founder allele causing catalytic inactivity despite preserved protein stability and mitochondrial targeting.
    evidence:
    - reference: PMID:11350182
      reference_title: Molecular and enzymatic characterization of a unique carnitine palmitoyltransferase 1A mutation in the Hutterite community.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Studies in fibroblasts from one patient as well as heterologous expression of the mutagenized CPT1A in yeast show that the G710E mutation alters neither mitochondrial targeting nor stability of the CPT1A protein.
      explanation: Distinguishes a catalytic defect from instability.
    - reference: PMID:11350182
      reference_title: Molecular and enzymatic characterization of a unique carnitine palmitoyltransferase 1A mutation in the Hutterite community.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: By contrast, kinetic studies conclusively establish that the mutant CPT1A is totally inactive, indicating that the G710E mutation dramatically impairs the catalytic function of CPT1A.
      explanation: Patient fibroblast and heterologous yeast assays distinguish catalytic loss from protein instability.
  - name: p.Ser34Pro (c.100T>C)
    description: Micronesian founder allele associated with a mild biochemical phenotype. Twenty-two homozygotes had no significant metabolic decompensation in the reported follow-up, including ten without dietary management. Residual activity of 26% was measured in one asymptomatic adult, not across all 22 patients.
    evidence:
    - reference: PMID:35822099
      reference_title: Genotype-phenotype correlations in CPT1A deficiency detected by newborn screening in Pacific populations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: There have been no episodes of significant metabolic decompensation in any of the 22 cases, including 10 patients who were not treated with dietary management, and one who was admitted to the intensive care unit with sepsis.
      explanation: Documents the p.Ser34Pro cohort and treatment context.
    - reference: PMID:35822099
      reference_title: Genotype-phenotype correlations in CPT1A deficiency detected by newborn screening in Pacific populations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Enzymology in cultured skin fibroblasts in an asymptomatic adult, showed residual CPT1 activity at 26% of normal controls, despite abnormal acylcarnitine metabolites consistent with CPT1A deficiency
      explanation: Single-adult functional result; the series does not establish lifetime penetrance.
  - name: p.Ser708Arg (c.2122A>C)
    description: Niuean founder allele associated with classic disease. Among three reported homozygotes, two presented clinically and the third was identified through sibling testing before later mild illness-associated decompensations.
    evidence:
    - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
      reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: CPT1A pathogenic variant p.Ser708Arg has been reported in the Niuean population
      explanation: Identifies the founder allele; the primary series provides the individual ascertainment details.
    - reference: PMID:35822099
      reference_title: Genotype-phenotype correlations in CPT1A deficiency detected by newborn screening in Pacific populations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Two presented clinically with classical CPT1A deficiency symptoms, the third was an asymptomatic younger sibling, diagnosed prospectively.
      explanation: Primary full text distinguishes presentation from prospective ascertainment.
  - name: p.Lys455Thr (c.1364A>C)
    description: 'Finnish recurrent allele: five of six reported patients were homozygous and one was compound heterozygous with p.Tyr498Ser. Crises generally occurred with illness or fasting and were uncommon during dietary treatment.'
    evidence:
    - reference: PMID:21962599
      reference_title: Carrier frequency of a common mutation of carnitine palmitoyltransferase 1A deficiency and long-term follow-up in Finland.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Five cases carried a homozygous c.1364A>C (p.K455T) mutation, whereas 1 case had a compound c.1364A>C/c.1493A>C (p.Y498S) mutation.
      explanation: Defines the genotypes in this six-person series.
    - reference: PMID:21962599
      reference_title: Carrier frequency of a common mutation of carnitine palmitoyltransferase 1A deficiency and long-term follow-up in Finland.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: During dietary therapy, the patients had few transient decompensations.
      explanation: Uncontrolled follow-up, not a comparative treatment estimate.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Sequence analysis of CPT1A can be performed first to detect missense, nonsense, and splice site variants and small intragenic deletions/insertions.
    explanation: Summarizes variant classes.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Exon and multiexon deletions have been rarely reported
    explanation: Adds structural alleles.
  gene_disease_validity:

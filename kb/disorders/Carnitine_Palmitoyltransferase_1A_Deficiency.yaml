    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Liver disease Consider orthotic liver transplantation. In those w/liver failure
    explanation: The source recommendation concerns liver failure; no outcome rate is asserted.
- name: Pregnancy metabolic and hepatic monitoring
  description: Affected pregnant individuals require avoidance of fasting, hypoglycemia, dehydration and catabolism, with metabolic and maternal-fetal medicine care. Monitor liver function at prenatal visits during the first two trimesters and more often in the third in pregnancies at risk. Counsel carriers carrying an affected fetus about the limited evidence for maternal acute fatty liver. Triheptanoin has not been studied in pregnancy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Management of women with CPT1A deficiency during pregnancy should include avoidance of fasting, hypoglycemia, dehydration, and catabolic stress.
    explanation: Specifies maternal metabolic precautions.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Use of triheptanoin has not been studied in pregnancy.
    explanation: Limits treatment extrapolation.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: it is recommended that liver function testing be performed at each prenatal visit during the first two trimesters and more frequently during the third trimester, when the risk for AFLP is greatest.
    explanation: Supports liver monitoring in subsequent pregnancies after an affected child.
- name: Genetic counseling and family testing
  description: Explain genotype-dependent clinical uncertainty as well as autosomal recessive recurrence risk. Familial variant testing permits carrier, prenatal and preimplantation testing. Evaluate siblings regardless of age; at-risk newborns can undergo molecular testing in parallel with newborn screening.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301700
    reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: When both parents are carriers of a CPT1A pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: Specifies recurrence risks for two carrier parents.
  - reference: PMID:20301700
    reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Carrier testing for at-risk family members and prenatal testing for pregnancies at increased risk are possible if the CPT1A pathogenic variants in the family are known.
    explanation: Supports familial variant testing.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: molecular genetic testing for the familial CPT1A pathogenic variants can be done in parallel with newborn screening.
    explanation: Avoids reliance on biochemical newborn screening alone.
environmental:
- name: Febrile or gastrointestinal illness
  influences_mechanisms:
  - target: Hepatic energy deficit during catabolic stress
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced carbohydrate availability and increased reliance on fatty acid oxidation expose the pre-existing metabolic limitation; they do not create the inherited enzyme defect.
    evidence:
    - reference: PMID:28748224
      reference_title: 'Utility of Genetic Testing for Confirmation of Abnormal Newborn Screening in Disorders of Long-Chain Fatty Acids: A Missed Case of Carnitine Palmitoyltransferase 1A (CPT1A) Deficiency.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: elevated liver transaminases in the setting of acute gastroenteritis.
      explanation: The case illustrates hepatic illness-associated decompensation.
  description: 'Concurrent febrile or gastrointestinal illness increases energy demand and precipitates acute metabolic decompensation in CPT1A deficiency.

    '
  evidence:
  - reference: PMID:28748224
    reference_title: 'Utility of Genetic Testing for Confirmation of Abnormal Newborn Screening in Disorders of Long-Chain Fatty Acids: A Missed Case of Carnitine Palmitoyltransferase 1A (CPT1A) Deficiency.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: elevated liver transaminases in the setting of acute gastroenteritis.
    explanation: The case illustrates hepatic illness-associated decompensation.
- name: Fasting
  exposure_term:
    preferred_term: fasting
    term:
      id: XCO:0000102
      label: fasting
  influences_mechanisms:
  - target: Hepatic energy deficit during catabolic stress
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced carbohydrate availability and increased reliance on fatty acid oxidation expose the pre-existing metabolic limitation; they do not create the inherited enzyme defect.
    evidence:
    - reference: PMID:21763168
      reference_title: Impaired fasting tolerance among Alaska native children with a common carnitine palmitoyltransferase 1A sequence variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Homozygosity for the c.1436C→T sequence variant of CPT1A impairs fasting ketogenesis, and can cause hypoketotic hypoglycemia in young children.
      explanation: The small physiological study establishes possible fasting intolerance, not population penetrance.
  description: 'Prolonged fasting depletes glycogen and forces reliance on fatty acid oxidation, unmasking the CPT1A block and triggering hypoketotic hypoglycemia.

    '
  evidence:
  - reference: PMID:21763168
    reference_title: Impaired fasting tolerance among Alaska native children with a common carnitine palmitoyltransferase 1A sequence variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Homozygosity for the c.1436C→T sequence variant of CPT1A impairs fasting ketogenesis, and can cause hypoketotic hypoglycemia in young children.
    explanation: The small physiological study establishes possible fasting intolerance, not population penetrance.
notes: CPT1A is expressed in liver, kidney and other tissues; predominant CPT1B expression in heart and muscle does not exclude uncommon cardiac or muscle manifestations. The mechanism of these findings and of developmental abnormalities without recognized hypoglycemia remains uncertain. Population associations of p.Pro479Leu with infectious illness and infant death should be distinguished from classic biallelic disease and from proof of causation. The Nunavut infant-death study genotyped only 35 unexpected deaths, compared them with a historical birth cohort, and found an association that weakened after regional stratification; sleep-environment and other risks also contributed. Maternal complications have been reported both in an affected mother with an unaffected fetus and in a mother whose two children had deficient CPT1 activity without molecular confirmation. These contexts should not be conflated with an established universal fetal-genotype mechanism.
diagnosis:
- name: Molecular confirmation with complementary enzyme testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Confirm biallelic pathogenic or likely pathogenic CPT1A variants. One pathogenic allele plus a VUS, or two VUSs, is not diagnostic. Sequence analysis may require complementary deletion/duplication analysis. Fibroblast CPT1 enzyme testing can clarify unresolved results where available; residual activity is often 1–5% in classic disease but higher in hypomorphic genotypes.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The diagnosis of CPT1A deficiency is established in a proband with biallelic pathogenic (or likely pathogenic) variants in CPT1A identified by molecular genetic testing.
    explanation: Defines the primary diagnostic criterion.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If only one or no variant is detected by the sequencing method used, the next step is to perform gene-targeted deletion/ duplication analysis to detect exon and whole-gene deletions or duplications.
    explanation: Specifies additional testing for unresolved sequence results.
  - reference: PMID:20301700
    reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Diminished carnitine palmitoyltransferase 1 (CPT1) enzyme activity on cultured skin fibroblasts when molecular genetic testing is not definitive may be an available option in some countries.
    explanation: Enzyme testing is not universally available.
- name: Newborn screening and biochemical follow-up
  description: Elevated free carnitine and C0/(C16+C18) can identify risk, but a normal plasma profile at confirmation or follow-up does not exclude CPT1A deficiency. Dried blood spots are preferable for biochemical detection. Follow an abnormal newborn screen with molecular confirmation rather than dismissing it after a normal plasma result.
  evidence:
  - reference: PMID:41017303
    reference_title: Pitfalls in the diagnosis of carnitine palmitoyltransferase 1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Our cases demonstrate that acylcarnitine profiles and especially concentrations of free carnitine can be normal in plasma in infants with CPT1AD at confirmation diagnosis after screening and during follow-up.
    explanation: Documents false reassurance from plasma testing.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: individuals with this variant may be missed by NBS with acylcarnitine profile alone
    explanation: The p.Pro479Leu genotype can be missed by acylcarnitine screening alone.

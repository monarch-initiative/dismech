    reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Targeted therapies: Triheptanoin (an odd-carbon triglyceride) or MCT oil.'
    explanation: GeneReviews lists the metabolic therapies.
  - reference: PMID:32885845
    reference_title: 'Effects of triheptanoin (UX007) in patients with long-chain fatty acid oxidation disorders: Results from an open-label, long-term extension study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Propionyl‐CoA is further metabolized to succinyl‐CoA, which resupplies TCA cycle intermediates (anaplerosis) that may be secondarily deficient in patients with LC‐FAOD
    explanation: Mechanistic rationale in the trial introduction, not proof of CPT1A-specific efficacy.
  notes: CL202 was open-label with historical pre-treatment comparisons. The 2020 interim report enrolled 75 participants and the 2023 final report 94; these are successive reports of the same study, not independent trials.

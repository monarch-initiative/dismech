name: Carnitine Palmitoyltransferase 1A Deficiency
category: Mendelian
creation_date: '2026-07-02T00:00:00Z'
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
synonyms:
- CPT1A deficiency
- CPT-1A deficiency
- CPT IA deficiency
- Carnitine palmitoyltransferase 1A deficiency
- Hepatic carnitine palmitoyltransferase deficiency
- L-CPT1 deficiency
- Carnitine palmitoyltransferase I deficiency
description: Carnitine palmitoyltransferase 1A deficiency is an autosomal recessive disorder of the first reaction of the mitochondrial carnitine shuttle. Loss of CPT1A activity restricts long-chain acylcarnitine formation and hepatic fatty acid oxidation, impairing fasting ketogenesis and glucose homeostasis. Classic disease causes episodic hypoketotic hypoglycemia and hepatic decompensation, often during illness or reduced intake. Renal tubular acidosis and uncommon cardiac, muscle and neurodevelopmental manifestations broaden the phenotype. Some hypomorphic genotypes are largely asymptomatic. Elevated free carnitine and the C0/(C16+C18) ratio can suggest the diagnosis, but normal plasma results do not exclude it.
disease_term:
  preferred_term: carnitine palmitoyltransferase 1A deficiency
  term:
    id: MONDO:0009705
    label: carnitine palmitoyl transferase 1A deficiency
parents:
- Fatty Acid Oxidation Disorder
- Inborn Error of Metabolism
prevalence:
- population: Newborns screened in Australia, Germany and the United States
  notes: Historical combined screening incidence of approximately 1 in 750,000 to 2,000,000, summarized in the 2025 GeneReviews chapter. Screening sensitivity and genotype composition affect ascertainment; this is not an estimate of symptomatic disease among all CPT1A variant carriers.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Combined results of NBS programs in Australia, Germany, and the United States show an incidence of CPT1A deficiency of 1:750,000-2,000,000
    explanation: Provides the geographic scope and screening-based range.
- population: Nunavik Inuit adults in a population-genetic study
  notes: The p.Pro479Leu allele frequency was 95.5% among 100 analyzed adults, after exclusions from 113 recruits. This is allele frequency, not disease prevalence or penetrance; metabolic measurements were unavailable.
  evidence:
  - reference: PMID:26010953
    reference_title: Increased missense mutation burden of Fatty Acid metabolism related genes in nunavik inuit population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In our study of the Nunavik Inuit, the p.P479L mutation has an allele frequency of 95.5%, the highest reported to date.
    explanation: Reports variant frequency in the studied population.
  - reference: PMID:26010953
    reference_title: Increased missense mutation burden of Fatty Acid metabolism related genes in nunavik inuit population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Therefore a total of 100 Inuit samples were included in the genetic/statistical analysis
    explanation: Defines the analyzed denominator.
progression:
- phase: Episodic metabolic decompensation
  notes: Onset ranges from the newborn period to adulthood. Fasting or intercurrent illness can cause rapid deterioration. Between episodes development may be normal, but prior crises can cause permanent injury and late-diagnosed patients can have developmental or speech abnormalities without recognized decompensation.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Age of onset of manifestations can vary from the newborn period to adulthood, and some individuals are asymptomatic.
    explanation: Defines the onset spectrum.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: global developmental delay or isolated speech delay may be possible without preceding metabolic decompensation
    explanation: Limits the assumption that every developmental abnormality follows a recognized crisis.
- phase: Hypomorphic genotype presentations
  notes: Most p.Pro479Leu homozygotes remain asymptomatic, although fasting ketogenesis may be impaired. Twenty-two reported p.Ser34Pro homozygotes had no significant metabolic decompensation during follow-up; this small cohort does not establish zero lifetime risk. These genotypes share the same CPT1A reaction defect and are not separate mechanistic diseases.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In fact, most children homozygous for this variant never develop any manifestations of CPT1A deficiency.
    explanation: The preceding sentence identifies p.Pro479Leu.
  - reference: PMID:35822099
    reference_title: Genotype-phenotype correlations in CPT1A deficiency detected by newborn screening in Pacific populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There have been no episodes of significant metabolic decompensation in any of the 22 cases, including 10 patients who were not treated with dietary management, and one who was admitted to the intensive care unit with sepsis.
    explanation: Documents the p.Ser34Pro cohort and treatment context.
pathophysiology:
- name: Variant-dependent CPT1A protein instability
  description: 'Some pathogenic variants reduce CPT1A protein stability. This is variant dependent: p.Gly710Glu retains protein stability and mitochondrial targeting despite catalytic inactivity.'
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:11441142
    reference_title: 'Molecular characterization of L-CPT I deficiency in six patients: insights into function of the native enzyme.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Western blotting revealed lower levels of each of the mutant proteins, indicating that the low enzyme activity associated with these mutations was due, at least in part, to protein instability.
    explanation: Mutant expression in COS cells supports instability for the variants tested, not for every pathogenic allele.
  downstream:
  - target: Reduced CPT1A catalytic activity
    description: Loss of stable enzyme reduces available CPT1A activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11441142
      reference_title: 'Molecular characterization of L-CPT I deficiency in six patients: insights into function of the native enzyme.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Western blotting revealed lower levels of each of the mutant proteins, indicating that the low enzyme activity associated with these mutations was due, at least in part, to protein instability.
      explanation: Mutant expression in COS cells supports instability for the variants tested, not for every pathogenic allele.
- name: Reduced CPT1A catalytic activity
  description: Biallelic pathogenic variants reduce CPT1A catalytic capacity. Residual activity and regulation differ substantially among alleles.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:11350182
    reference_title: Molecular and enzymatic characterization of a unique carnitine palmitoyltransferase 1A mutation in the Hutterite community.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: By contrast, kinetic studies conclusively establish that the mutant CPT1A is totally inactive, indicating that the G710E mutation dramatically impairs the catalytic function of CPT1A.
    explanation: Patient fibroblast and heterologous yeast assays distinguish catalytic loss from protein instability.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Mechanism of disease causation. Loss of CPT1A function may occur from loss of mRNA expression or reduction of functional activity of CPT1A.
    explanation: Summarizes molecular routes to functional deficiency.

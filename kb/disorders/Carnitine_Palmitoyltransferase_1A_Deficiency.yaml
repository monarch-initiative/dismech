      reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Up to eight hours in infants between ages six and 12 months ⚬ Up to ten hours during the second year of life ⚬ Up to 12 hours after age two years
      explanation: Suggested maxima only in the absence of infection, fever or other stress.
- name: Individualized high-carbohydrate, low-long-chain-fat diet
  description: A metabolic dietitian guides carbohydrate supply, long-chain fat restriction and essential fatty acid replacement. The degree of fat restriction is controversial in mild or asymptomatic p.Pro479Leu homozygotes. Avoid overfeeding when well and monitor growth and nutrient status.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: High-carbohydrate diet (70% of calories) that is low in long-chain fat (<20% of calories)
    explanation: GeneReviews long-term diet table; specialist individualization is required.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If the physician chooses to recommend a low-fat diet when the affected individual is well, supplementation with essential fatty acids is necessary.
    explanation: Preserves nutritional requirements during restriction.
  therapeutic_modality: BEHAVIORAL
- name: Medium-chain triglyceride supplementation
  description: Medium-chain fat provides an alternative oxidizable substrate that bypasses the CPT1A-dependent long-chain shuttle. It does not restore CPT1A activity. Dose and caloric contribution vary with age, tolerance and acute versus maintenance needs.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:7877875
    reference_title: Rate-dependent distal renal tubular acidosis and carnitine palmitoyltransferase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Ketogenesis was absent after a long-chain triglyceride loading test; in contrast, the medium-chain triglyceride loading test resulted in a brisk rise in plasma ketone concentration.
    explanation: Physiological response in one affected infant supports bypass of long-chain transport.
  target_mechanisms:
  - target: Reduced CPT1A catalytic activity
    description: Medium-chain substrate can support ketogenesis despite deficient long-chain acylcarnitine formation.
    treatment_effect: BYPASSES

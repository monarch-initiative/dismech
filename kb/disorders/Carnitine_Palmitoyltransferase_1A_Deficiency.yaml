experimental_models:
- name: Variant-expressing COS cells
  experimental_model_type: CELL_LINE
  cell_source: COS cells transfected with patient-derived mutant or wild-type CPT1A cDNA
  description: Comparable transcript abundance but reduced mutant protein supports variant-dependent protein instability.
  evidence:
  - reference: PMID:11441142
    reference_title: 'Molecular characterization of L-CPT I deficiency in six patients: insights into function of the native enzyme.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Western blotting revealed lower levels of each of the mutant proteins, indicating that the low enzyme activity associated with these mutations was due, at least in part, to protein instability.
    explanation: Mutant expression in COS cells supports instability for the variants tested, not for every pathogenic allele.
  modeled_mechanisms:
  - target: Variant-dependent CPT1A protein instability
    relationship: RECAPITULATES
    model_scale: MOLECULAR
    description: Cell-based expression and biochemical assays reproduce the variant-specific protein defect.
    limitations: These assays do not recapitulate whole-organ or organism-level clinical outcomes.
    evidence:
    - reference: PMID:11441142
      reference_title: 'Molecular characterization of L-CPT I deficiency in six patients: insights into function of the native enzyme.'
      supports: SUPPORT
      evidence_source: IN_VITRO

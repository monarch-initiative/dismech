treatments:
- name: Age-appropriate fasting avoidance
  description: Frequent feeding prevents catabolic crises. GeneReviews recommends feeding neonates and infants every two to three hours. Suggested maximum fasting intervals when well are eight hours at 6–12 months, ten hours during the second year and twelve hours after age two. Illness, surgery and reduced intake require a more cautious individualized emergency plan, not a blanket twelve-hour allowance. Cornstarch or overnight feeding may be appropriate after infancy.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Neonates and infants require frequent feedings every two to three hours.
    explanation: Age-specific preventive guidance.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Up to eight hours in infants between ages six and 12 months ⚬ Up to ten hours during the second year of life ⚬ Up to 12 hours after age two years
    explanation: Suggested maxima only in the absence of infection, fever or other stress.
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Hepatic energy deficit during catabolic stress
    description: Carbohydrate availability reduces reliance on impaired hepatic fatty acid oxidation.
    treatment_effect: INHIBITS
    evidence:

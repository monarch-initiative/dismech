- name: Reduced distal renal acid secretion
  description: A rate-dependent failure of distal renal acid secretion has been demonstrated in an individual with CPT1A deficiency. The molecular explanation remains uncertain.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:7877875
    reference_title: Rate-dependent distal renal tubular acidosis and carnitine palmitoyltransferase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Evaluation of the renal acidification capacity showed a failure to acidify the urine during spontaneous acidosis but increased acid excretion and a normal decrease of urinary pH after acid loading.
    explanation: Physiological testing in one infant demonstrated a rate-dependent distal acidification defect.
  - reference: PMID:7877875
    reference_title: Rate-dependent distal renal tubular acidosis and carnitine palmitoyltransferase I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'This acidification defect can best be explained as an abnormality in distal tubular H+ secretion: a rate-dependent distal tubular acidosis.'
    explanation: Authors localize the acidification abnormality; the upstream molecular mechanism remains uncertain.
  downstream:
  - target: Distal renal tubular acidosis
    description: Impaired distal proton secretion produces the demonstrated acidification phenotype.

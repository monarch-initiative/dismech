- name: Emergency intravenous glucose
  description: Prompt intravenous dextrose corrects hypoglycemia and supports anabolism during acute decompensation. GeneReviews describes at least 10% dextrose, approximately 8–10 mg/kg/min, with fluids and electrolytes adjusted clinically. Continue glucose beyond normalization to replenish hepatic glycogen, and taper as oral intake recovers.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dextrose
      term:
        id: CHEBI:17234
        label: glucose

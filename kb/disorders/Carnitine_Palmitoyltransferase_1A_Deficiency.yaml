      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: Since the isoform is also expressed in the kidney, renal tubular acidosis can also occur.
      explanation: Review-level attribution of renal disease to CPT1A deficiency.

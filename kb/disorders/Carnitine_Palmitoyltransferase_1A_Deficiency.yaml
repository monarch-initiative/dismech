      quote_role: REVIEW_SYNTHESIS
      snippet: Carnitine O-palmitoyltransferase 1, liver isoform (also called carnitine palmitoyltransferase 1A; CPT1A), encoded by CPT1A, and located on the outer mitochondrial membrane, converts long-chain acyl-CoAs to their acylcarnitine equivalents.
      explanation: Defines the reaction impaired by CPT1A deficiency.
  - target: Reduced distal renal acid secretion

      snippet: Sufficient amounts of IV fluid containing at least 10% dextrose w/age-appropriate electrolytes as quickly as possible to correct hypoglycemia
      explanation: Recommends prompt carbohydrate replacement.
    - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf

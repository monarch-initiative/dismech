- name: Metabolic brain dysfunction and injury
  description: Metabolic crises can cause transient neurological dysfunction or lasting brain injury. This mechanism does not explain all developmental or speech findings in late-diagnosed patients.
  biological_scale: TISSUE
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Between episodes of metabolic decompensation, individuals with CPT1A deficiency typically appear developmentally and cognitively normal unless previous metabolic decompensation has resulted in neurologic damage (leading to motor and/or speech delays).
    explanation: Supports acquired neurological injury after crises, without accounting for all developmental findings.

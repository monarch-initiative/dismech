    preferred_term: Elevated circulating creatine kinase activity
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase activity
  description: Uncommon in the wider clinical spectrum, but found in seven of 14 patients in one selected retrospective series.
  evidence:
  - reference: PMID:38090675
    reference_title: A different perspective into clinical symptoms in CPT I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Additionally, elevated creatine kinase (CK) levels ranging between 250 and 800 U/L (normal range: 20–180 U/L) were detected in seven patients both at the time of initial diagnosis and during the follow-up period.'
    explanation: Selected cohort proportion; not a population frequency.
  - reference: PMID:11286380
    reference_title: Features of carnitine palmitoyltransferase type I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We discuss four new cases in three families showing, variously, renal tubular acidosis, transient hyperlipidaemia and, paradoxically, myopathy with elevated creatinine kinase or cardiac involvement in the neonatal period as additional features that deserve wider recognition.
    explanation: The four-case report broadens the classic hepatic presentation; no population frequency is inferred.
  notes: Only six of the 14 cohort patients had molecular confirmation, with parental variants supporting one additional deceased case. Remaining diagnoses relied on biochemical profiles; ascertainment and diagnostic limitations restrict generalization.

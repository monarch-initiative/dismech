      explanation: Physiological response in one affected infant supports bypass of long-chain transport.
- name: Triheptanoin
  description: 'This odd-chain triglyceride supplies medium-chain substrate and anaplerotic propionyl-CoA. GeneReviews lists it as targeted therapy. CPT1A-specific clinical evidence remains sparse: only one CPT I participant was included in the CL202 extension cohort, so pooled LC-FAOD event reductions should not be presented as a CPT1A effect estimate. Gastrointestinal intolerance can limit dosing.'
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:

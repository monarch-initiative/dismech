      snippet: continue glucose infusion beyond normalization of blood glucose to provide sufficient substrate for glycogen synthesis.
      explanation: Explains why normalization of blood glucose alone does not end acute support.
- name: Emergency planning and perioperative metabolic care
  description: Families need a written emergency plan, recognition of early decompensation and coordinated care during illness, surgery or sedation. Provide carbohydrate-containing fluids when adequate intake cannot be maintained.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Carry written info re child's disorder & appropriate treatment in emergency setting.
    explanation: Supports a written emergency plan.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Avoid fasting, including during periods of preparation and recovery from planned surgery or sedation
    explanation: Extends fasting precautions to procedures.
- name: Metabolic, nutritional, renal and developmental surveillance
  description: Assess growth, feeding and dietary adherence at visits. Monitor carnitine/acylcarnitines, essential fatty acids, fat-soluble vitamins, blood count, metabolic profile and CK according to age and diet. Check hepatic function and renal indices when indicated; assess development throughout childhood and refer for physical, occupational or speech-language therapy as needed.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301700
    reference_title: Carnitine Palmitoyltransferase 1A Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Assess growth, feeding, and adherence to diet at each visit
    explanation: Summarizes routine surveillance.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Nephrology BUN, serum creatinine concentration, & urinalysis for urine protein As clinically indicated to assess for renal tubular acidosis
    explanation: Adds renal surveillance.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Assess developmental & educational progress w/ referrals for social services, physical therapy, occupational therapy, & speech & language services as needed
    explanation: Supports developmental follow-up and rehabilitation.
- name: Caution with potentially hepatotoxic medicines
  description: Use valproate or salicylate cautiously if hepatic dysfunction is present. GeneReviews notes that CPT1A-specific adverse pharmacologic effects have not been reported; this is a conditional precaution.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1527/pdf/Bookshelf_NBK1527.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Potentially hepatotoxic agents such as valproate and salicylate should be used with caution if there is evidence of hepatic dysfunction
    explanation: States the condition for caution.
- name: Liver transplantation consideration
  description: GeneReviews advises considering liver transplantation in liver failure. Disease-specific outcome evidence is limited; it is not routine therapy for otherwise stable CPT1A deficiency.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

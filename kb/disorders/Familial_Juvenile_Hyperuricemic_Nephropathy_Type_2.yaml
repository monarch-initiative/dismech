  description: >-
    Production and secretion of prorenin and renin fall, lowering plasma renin
    activity and the activity of the renin-angiotensin system. Renin is an
    aspartic protease that cleaves angiotensinogen to angiotensin I, so less
    secreted renin means less of that cleavage.

animal_models:
- name: Zebrafish embryos injected with human L381P renin mRNA
  species: Zebrafish
  genotype: Wild-type embryos injected at the one-cell stage with human REN p.Leu381Pro or p.Leu16del mRNA
  publication: PMID:31406136
  modeled_mechanisms:
  - target: Nephron Loss and Tubulointerstitial Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Overexpression of mutant renin disturbs convolution of the pronephric
      tubules in most injected embryos.
    limitations: >-
      Overexpression of a human mRNA in wild-type embryos rather than a
      heterozygous germline allele; the embryonic pronephros cannot show the
      slowly progressive fibrosis, endocrine defects or anemia of the human
      disease.
    evidence:
    - reference: PMID:31406136
      reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease with Adult Onset due to a Novel Renin Mutation Mapping in the Mature Protein.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, 60% of embryos injected with the L381P renin variant showed pronephric alteration: 43% were characterized by reduced, partial convolution of the pronephric tubules and 17% showed absence of tubular convolutions (Fig. 5d)."
      explanation: Tubular phenotype induced by the mutant renin.
- name: Renin-lineage Dicer conditional knockout mouse
  species: Mouse
  genotype: Conditional deletion of Dicer in cells of the renin lineage
  publication: PMID:20056748
  modeled_mechanisms:
  - target: Loss of Juxtaglomerular Renin-Producing Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Loss of juxtaglomerular cells lowers renin expression, plasma renin and
      blood pressure, followed by vascular abnormalities and striped fibrosis.
    limitations: >-
      Juxtaglomerular cells are lost through loss of microRNA processing, not
      through a toxic REN variant, so the model informs only the consequences
      of renin-cell loss and says nothing about how REN variants cause it.
    evidence:
    - reference: PMID:20056748
      reference_title: The microRNA-processing enzyme dicer maintains juxtaglomerular cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of Dicer severely reduced the number of juxtaglomerular cells, decreased expression of the renin genes (Ren1 and Ren2), lowered plasma renin concentration, and decreased BP."
      explanation: Juxtaglomerular cell loss reproduces low renin and low blood pressure.

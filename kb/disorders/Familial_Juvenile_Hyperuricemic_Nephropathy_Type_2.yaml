    snippet: "The diagnosis of ADTKD-REN is established in a proband with suggestive findings and a heterozygous pathogenic variant in REN identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
- name: Laboratory surveillance
  description: >-
    Hemoglobin, uric acid, bicarbonate and creatinine are measured at least
    every six months in childhood or adolescent-onset disease, and every six to
    twelve months in adult-onset disease depending on kidney function. Testing
    of at-risk relatives allows earlier treatment, because the kidney disease
    is often asymptomatic.
  evidence:
  - reference: PMID:21473025
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease – REN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Surveillance: Childhood/adolescent-onset disease: measurement of hemoglobin concentration and serum concentration of uric acid, bicarbonate, and creatinine at least every six months starting at the time of diagnosis."
    explanation: GeneReviews surveillance recommendation.
  - reference: PMID:21473025
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease – REN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is appropriate to clarify the genetic status (by molecular genetic testing for the familial REN pathogenic variant) of apparently asymptomatic at-risk relatives, as CKD – one of the primary manifestations of this disorder – is often asymptomatic."
    explanation: GeneReviews recommendation on evaluating relatives at risk.
treatments:
- name: Fludrocortisone
  description: >-
    Mineralocorticoid replacement for hyporeninemic hypoaldosteronism. It
    corrects mild hypotension, hyperkalemia and acidemia, and raised eGFR in an
    affected child; in the international cohort it lowered serum potassium and
    raised bicarbonate without reported adverse effects. GeneReviews suggests
    it may be indicated before stage 3 chronic kidney disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

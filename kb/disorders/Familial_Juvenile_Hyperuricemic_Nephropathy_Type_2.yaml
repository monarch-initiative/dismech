name: Familial Juvenile Hyperuricemic Nephropathy Type 2
creation_date: "2026-10-29T03:40:00Z"
category: Mendelian
synonyms:
- ADTKD-REN
- FJHN type 2
- REN-associated kidney disease
- autosomal dominant tubulointerstitial kidney disease due to mutations in REN
disease_term:
  preferred_term: familial juvenile hyperuricemic nephropathy type 2
  term:
    id: MONDO:0013128
    label: familial juvenile hyperuricemic nephropathy type 2
parents:
- Autosomal Dominant Tubulointerstitial Kidney Disease
- Familial Juvenile Hyperuricemic Nephropathy
description: >-
  Familial juvenile hyperuricemic nephropathy type 2, now usually called
  autosomal dominant tubulointerstitial kidney disease due to REN variants
  (ADTKD-REN), is caused by heterozygous variants in REN, which encodes
  preprorenin, the precursor of the hormone renin made by the juxtaglomerular
  granular cells of the kidney. Variants in the signal peptide stop preprorenin
  from entering the endoplasmic reticulum, so the unprocessed protein stays in
  the cytoplasm; variants in the prosegment trap prorenin in the
  endoplasmic reticulum to Golgi intermediate compartment; and variants in the
  mature peptide retain the mutant protein in the endoplasmic reticulum. The
  mutant protein is thought to be toxic to renin-producing cells, and renin
  synthesis falls. The result is hyporeninemic hypoaldosteronism with mild
  hypotension, mild hyperkalemia and acidosis, hypoproliferative anemia with
  inappropriately low erythropoietin, hyperuricemia from reduced urate
  excretion with gout, and slowly progressive chronic kidney disease with a
  bland urine sediment, tubular atrophy and interstitial fibrosis, reaching
  kidney failure between the fourth and seventh decades. Signal peptide and
  prosegment variants usually present in childhood or adolescence with anemia;
  mature-peptide variants present in adulthood with gout or chronic kidney
  disease and no anemia. Fludrocortisone, erythropoietin and allopurinol are
  used, and kidney transplantation is curative because the graft does not
  develop the disease.
notes: >-
  Biallelic REN variants cause a different disorder, autosomal recessive
  renal tubular dysgenesis, which ClinGen curates separately; this entry covers
  only the dominant tubulointerstitial disease. GeneReviews advises against a
  low-sodium diet and notes that angiotensin-converting enzyme inhibitors could
  aggravate the underlying renin deficit. The mechanism is not uniform across
  variants: endoplasmic reticulum stress was shown for p.Leu16del and the
  mature-peptide variant p.Leu381Pro but was absent for the signal peptide
  variant p.Trp17Arg, which was routed to mitochondria in a cell model.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous REN variants segregate with disease across multiple
    generations; each child of an affected person has a 50% chance of
    inheriting the variant.
  evidence:
  - reference: PMID:21473025
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease – REN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "ADTKD-REN is inherited in an autosomal dominant manner. Each child of an affected individual has a 50% chance of inheriting the REN pathogenic variant."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:21903317
    reference_title: "Autosomal dominant mutation in the signal peptide of renin in a kindred with anemia, hyperuricemia, and CKD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the kindred, we found affected individuals over 4 generations who carried the novel REN mutation and were characterized by significant anemia, hyperuricemia, and CKD."
    explanation: Four-generation segregation of a heterozygous REN variant.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    An international cohort described 111 individuals from 30 families; REN
    accounted for 3% of genetically tested families in a large ADTKD referral
    series.
  evidence:
  - reference: PMID:32750457
    reference_title: An international cohort study of autosomal dominant tubulointerstitial kidney disease due to REN mutations identifies distinct clinical subtypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To further study this, we formed an international cohort characterizing 111 individuals from 30 families with both clinical and laboratory findings."
    explanation: Size of the largest published cohort.
  - reference: PMID:36250282
    reference_title: "Autosomal dominant tubulointerstitial kidney disease: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 455 families who provided samples for genetic testing, 207 (38%) were found to have UMOD pathogenic variants, 116 (21%) MUC1 pathogenic variants and 15(3%) REN pathogenic variants."
    explanation: REN is a minor cause of ADTKD in a large referral series.
has_subtypes:
- name: Signal peptide
  display_name: ADTKD-REN, signal peptide variants
  genes:
  - preferred_term: REN
    term:
      id: hgnc:9958
      label: REN
  description: >-
    The most common and most severe group. Variants reduce the hydrophobicity
    of the signal peptide so preprorenin is not translocated into the
    endoplasmic reticulum. Presentation is usually in childhood with anemia,
    sometimes with acute kidney injury or with anemia, acidosis and kidney
    failure; median age at kidney failure was 57 years.
  evidence:
  - reference: PMID:32750457
    reference_title: An international cohort study of autosomal dominant tubulointerstitial kidney disease due to REN mutations identifies distinct clinical subtypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Signal group patients were most severely affected, presenting at a mean age of 19.7 years, with the prosegment group presenting at 22.4 years, and the mature group at 37 years."
    explanation: Signal peptide variants give the most severe disease.
- name: Prosegment
  display_name: ADTKD-REN, prosegment variants
  genes:
  - preferred_term: REN
    term:
      id: hgnc:9958
      label: REN
  description: >-
    Variants in the prosegment lead to deposition of prorenin and renin in the
    endoplasmic reticulum to Golgi intermediate compartment and reduced
    prorenin secretion. Most patients present in childhood, often with anemia
    or gout.
  evidence:
  - reference: PMID:32750457
    reference_title: An international cohort study of autosomal dominant tubulointerstitial kidney disease due to REN mutations identifies distinct clinical subtypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "REN mutations in the prosegment led to deposition of prorenin and renin in the endoplasmic reticulum-Golgi intermediate compartment and decreased prorenin secretion."
    explanation: Cell-based localization of prosegment variants.
- name: Mature renin
  display_name: ADTKD-REN, mature renin peptide variants (adult onset)
  genes:
  - preferred_term: REN
    term:
      id: hgnc:9958
      label: REN
  description: >-
    Variants in the mature renin peptide cause retention of mutant prorenin in
    the endoplasmic reticulum, similar to ADTKD-UMOD. Patients present in
    adulthood with gout or chronic kidney disease, have no childhood anemia,
    and reach kidney failure later than the other groups.
  evidence:
  - reference: PMID:32750457
    reference_title: An international cohort study of autosomal dominant tubulointerstitial kidney disease due to REN mutations identifies distinct clinical subtypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in mature renin led to deposition of the mutant prorenin in the endoplasmic reticulum, similar to patients with ADTKD-UMOD"
    explanation: Expression studies of the mature-peptide variants show retention of mutant prorenin in the endoplasmic reticulum.
  - reference: PMID:32750457
    reference_title: An international cohort study of autosomal dominant tubulointerstitial kidney disease due to REN mutations identifies distinct clinical subtypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a rate of progression to end stage kidney disease (63.6 years) that was significantly slower vs. the signal (53.1 years) and prosegment groups (50.8 years)"
    explanation: In the cohort, patients with mature-peptide variants reached end stage kidney disease later than the other two groups.
  - reference: PMID:21473025
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease – REN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Adult onset, the less common presentation (caused by REN variants encoding the mature renin peptide), is characterized by gout or mild slowly progressive CKD, beginning in the third decade. Anemia, hyperkalemia, and acidemia do not occur."
    explanation: GeneReviews describes the adult-onset presentation.
pathophysiology:
- name: Heterozygous REN Preprorenin Variants
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous missense variants and single-residue in-frame
    deletions in REN. About 60% affect the signal peptide (for example
    p.Leu16del, p.Leu16Arg, p.Trp10Arg, p.Cys20Arg), about 25% the prosegment
    and about 15% the mature renin peptide (for example p.Leu381Pro). The
    mutant protein is thought to be toxic to renin-producing cells in addition
    to lowering renin output.
  genes:
  - preferred_term: REN
    term:
      id: hgnc:9958
      label: REN
  genetic_context:
    description: >-
      Germline heterozygous missense variants and in-frame single-codon
      deletions, inherited in an autosomal dominant manner.
    allelic_events:
    - MISSENSE_VARIANT
    - DELETION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:19664745
    reference_title: Dominant renin gene mutations associated with early-onset hyperuricemia, anemia, and chronic kidney failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified three unrelated families with the autosomal-dominant inheritance of early onset anemia, hypouricosuric hyperuricemia, progressive kidney failure, and mutations resulting either in the deletion (p.Leu16del) or the amino acid exchange (p.Leu16Arg) of a single leucine residue in the signal sequence of renin."
    explanation: Founding report of heterozygous signal sequence variants.
  - reference: PMID:31406136
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease with Adult Onset due to a Novel Renin Mutation Mapping in the Mature Protein.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through exome sequencing in an adult-onset ADTKD family we identified a new renin variant, p.L381P, mapping in the mature protein."
    explanation: A mature-peptide variant in an adult-onset family.
  downstream:
  - target: Aberrant Preprorenin Translocation and Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19664745
      reference_title: Dominant renin gene mutations associated with early-onset hyperuricemia, anemia, and chronic kidney failure.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transfection and in vitro studies confirmed that both mutations affect ER translocation and processing of nascent preprorenin, resulting either in reduced (p.Leu16del) or abolished (p.Leu16Arg) prorenin and renin biosynthesis and secretion."
      explanation: Signal sequence variants impair translocation of preprorenin into the endoplasmic reticulum.
    - reference: PMID:32750457
      reference_title: An international cohort study of autosomal dominant tubulointerstitial kidney disease due to REN mutations identifies distinct clinical subtypes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "REN signal peptide mutations reduced hydrophobicity of the signal peptide, which is necessary for recognition and translocation across the endoplasmic reticulum, leading to aberrant delivery of preprorenin into the cytoplasm."
      explanation: Signal peptide variants misdeliver preprorenin to the cytoplasm.
- name: Aberrant Preprorenin Translocation and Trafficking
  biological_scale: CELLULAR
  description: >-
    The mutant precursor fails to follow the normal secretory route. Signal
    peptide variants leave unprocessed, non-glycosylated preprorenin in the
    cytoplasm; prosegment variants accumulate in the endoplasmic reticulum to
    Golgi intermediate compartment; mature-peptide variants are retained in the
    endoplasmic reticulum.
  cell_types:
  - preferred_term: juxtaglomerular renin-producing granular cell
    term:
      id: CL:0000648
      label: kidney granular cell
  biological_processes:
  - preferred_term: protein targeting to ER
    modifier: DECREASED
    term:
      id: GO:0045047
      label: protein targeting to ER
  evidence:
  - reference: PMID:21084044
    reference_title: Clinical and molecular characterization of a family with a dominant renin gene mutation and response to treatment with fludrocortisone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation affects endoplasmic reticulum co-translational translocation and posttranslational processing, resulting in massive accumulation of non-glycosylated preprorenin in the cytoplasm."
    explanation: The p.Cys20Arg signal sequence variant leaves preprorenin in the cytoplasm.
  - reference: PMID:31406136
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease with Adult Onset due to a Novel Renin Mutation Mapping in the Mature Protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of the L381P variant leads to its ER retention and induction of the Unfolded Protein Response in cell models"
    explanation: A mature-peptide variant is retained in the endoplasmic reticulum.
  downstream:
  - target: Endoplasmic Reticulum Stress in Renin-Producing Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19664745
      reference_title: Dominant renin gene mutations associated with early-onset hyperuricemia, anemia, and chronic kidney failure.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cells stably expressing the p.Leu16del protein showed activated ER stress, unfolded protein response, and reduced growth rate."
      explanation: Mutant preprorenin activates the unfolded protein response.
  - target: Mitochondrial Mistargeting of Mutant Preprorenin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37283036
      reference_title: Leader peptide or pro-segment mutants of renin are misrouted to mitochondria in autosomal dominant tubulointerstitial kidney disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mitochondrial localisation and fragmentation were also observed for wild-type renin when ER translocation was affected."
      explanation: Failed endoplasmic reticulum translocation is enough to send renin to mitochondria.
  - target: Reduced Renin Biosynthesis and Secretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19664745
      reference_title: Dominant renin gene mutations associated with early-onset hyperuricemia, anemia, and chronic kidney failure.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transfection and in vitro studies confirmed that both mutations affect ER translocation and processing of nascent preprorenin, resulting either in reduced (p.Leu16del) or abolished (p.Leu16Arg) prorenin and renin biosynthesis and secretion."
      explanation: Defective translocation reduces or abolishes renin secretion.
- name: Endoplasmic Reticulum Stress in Renin-Producing Cells
  biological_scale: CELLULAR
  description: >-
    Mutant renin activates the unfolded protein response (BiP induction, XBP1
    splicing and the ATF6 branch for p.Leu381Pro). This is not universal: the
    signal peptide variant p.Trp17Arg did not activate endoplasmic reticulum
    stress in a cell model and was instead routed to mitochondria.
  cell_types:
  - preferred_term: juxtaglomerular renin-producing granular cell
    term:
      id: CL:0000648
      label: kidney granular cell
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  evidence:
  - reference: PMID:31406136
    reference_title: Autosomal Dominant Tubulointerstitial Kidney Disease with Adult Onset due to a Novel Renin Mutation Mapping in the Mature Protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of L381P isoform in HEK cells induces expression of HSPA5 (BiP) and spliced XBP1, markers of ER stress and UPR respectively."
    explanation: The mature-peptide variant induces unfolded protein response markers.
  - reference: PMID:38520530
    reference_title: "Case-inspired exploration of renin mutations in autosomal dominant tubulointerstitial kidney disease: not all paths lead to the endoplasmic reticulum."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "ERS activation is not a universal response to different renin mutations in ADTKD-REN."
    explanation: Endoplasmic reticulum stress was not seen for p.Trp17Arg, so this node does not hold for every variant.
  downstream:
  - target: Loss of Juxtaglomerular Renin-Producing Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21903317
      reference_title: "Autosomal dominant mutation in the signal peptide of renin in a kindred with anemia, hyperuricemia, and CKD."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Over time this may result in chronic ER stress, triggering apoptosis and inflammation resulting in juxtaglomerular cell loss and nephron loss."
      explanation: Proposed link from chronic endoplasmic reticulum stress to juxtaglomerular cell loss; stated as a hypothesis.
- name: Mitochondrial Mistargeting of Mutant Preprorenin
  biological_scale: CELLULAR
  description: >-
    Leader peptide and prosegment variants send mutant preprorenin fully (for
    example p.Leu16Arg, p.Trp17Arg, p.Cys20Arg) or partly (p.Trp10Arg,
    p.Leu16del) into mitochondria, with a mitochondrial import defect and
    fragmentation of the mitochondrial network. This offers an alternative to
    endoplasmic reticulum stress for variants that do not activate the
    unfolded protein response.
  cell_types:
  - preferred_term: juxtaglomerular renin-producing granular cell
    term:
      id: CL:0000648
      label: kidney granular cell
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:37283036
    reference_title: Leader peptide or pro-segment mutants of renin are misrouted to mitochondria in autosomal dominant tubulointerstitial kidney disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutated pre-pro-sequence of renin is necessary and sufficient to drive mitochondrial rerouting, mitochondrial import defect and fragmentation."
    explanation: Cell-based demonstration of mitochondrial misrouting by leader peptide and prosegment variants.
  - reference: PMID:38520530
    reference_title: "Case-inspired exploration of renin mutations in autosomal dominant tubulointerstitial kidney disease: not all paths lead to the endoplasmic reticulum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, the W17R variant was misrouted to the mitochondria resulting in changes of the mitochondrial network organisation."
    explanation: Independent observation for p.Trp17Arg.
  downstream:
  - target: Loss of Juxtaglomerular Renin-Producing Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38520530
      reference_title: "Case-inspired exploration of renin mutations in autosomal dominant tubulointerstitial kidney disease: not all paths lead to the endoplasmic reticulum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "The pathogenesis of the W17R mutation may involve mitochondrial dysfunction rather than the ER pathway, albeit further research is needed to substantiate this hypothesis fully."
      explanation: Mitochondrial dysfunction is proposed, not shown, to drive disease for this variant.

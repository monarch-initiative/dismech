- name: Increased Proximal Tubular Urate Reabsorption
  biological_scale: TISSUE
  description: >-
    Relative hypotension and volume contraction increase proximal tubular sodium
    and, with it, urate reabsorption, so the fractional excretion of uric acid
    is low. This is the proposed basis of hypouricosuric hyperuricemia.
  evidence:
  - reference: PMID:28701203
    reference_title: "Discovery of a novel dominant mutation in the REN gene after forty years of renal disease: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "This relative hypotension stimulates the reabsorption of sodium in the proximal tubule, which consequently leads to an increase in urate reabsorption and hyperuricaemia."
    explanation: Background statement of the proposed mechanism.
  downstream:
  - target: Impaired renal uric acid clearance

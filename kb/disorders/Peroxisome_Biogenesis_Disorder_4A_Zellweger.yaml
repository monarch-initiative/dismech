    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive clinical
      and biochemical findings above by identification of biallelic pathogenic
      variants in one of the 13 known ZSD-PEX genes.
    explanation: >-
      GeneReviews places biochemical findings ahead of molecular confirmation in the
      diagnostic sequence.
  - reference: PMID:41787707
    reference_title: "Unraveling PEX6: insights into very-long-chain fatty acid levels and peroxisome biogenesis disorders in pediatric populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While elevated levels of very-long-chain fatty acids (VLCFAs) remain a key
      diagnostic feature, the existence of unusual cases with normal plasma VLCFA
      levels highlight the limitations of relying solely on this biochemical marker for
      diagnosis.
    explanation: >-
      Records the caveat that matters most in practice: a normal VLCFA does not exclude
      a PEX6 disorder, so a negative first-line screen must not close the workup.
- name: Molecular Genetic Testing of the ZSD-PEX Genes

name: Peroxisome Biogenesis Disorder 4A (Zellweger)
creation_date: "2026-08-29T16:40:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 4A is the severe, neonatal-lethal end of the
  PEX6-related Zellweger spectrum - historically complementation group 4 (also
  catalogued as group C), which is where the "4" in the name comes from. PEX6 is
  an AAA-ATPase that heterohexamerises with PEX1 to form the receptor export
  module: the ATP-driven motor that pulls monoubiquitinated PEX5 back out of the
  peroxisomal membrane so the receptor can carry another load of matrix enzymes
  into the organelle. PEX6 defects are the second most common cause of Zellweger
  spectrum disease after PEX1.

  What separates PBD4A from PBD4B is not the gene but how much peroxin-6 activity
  the genotype leaves behind. Biallelic null or severely truncating PEX6 alleles
  abolish the export motor outright, PEX5 recycling stops, and matrix protein
  import collapses. The peroxisomal membrane is still made - patient cells contain
  "peroxisomal ghosts", membrane compartments with no matrix enzymes inside - so
  this is a disorder of biogenesis rather than of any one peroxisomal enzyme. The
  biochemical signature is correspondingly broad in both directions: very-long-chain
  fatty acids, phytanic and pristanic acid and C27 bile-acid intermediates
  accumulate because nothing is left to degrade them, while plasmalogens are
  missing because nothing is left to synthesise them.

  Both halves of that lesion damage the developing brain, the liver and the kidney
  simultaneously, and they do so before birth: the neuronal migration defect that
  produces perisylvian polymicrogyria is complete by the time the child is born,
  which is the reason no post-natal therapy changes the neurological outcome.
  Affected newborns are profoundly hypotonic, feed poorly, seize, and have
  distinctive facies, renal cysts, epiphyseal stippling and severe liver disease.
  Survival is usually less than a year.

  This entry is the severity counterpart of Peroxisome Biogenesis Disorder 4B at
  the same locus, and the PEX6 counterpart of Peroxisome Biogenesis Disorder 3A
  (PEX12) and 11A (PEX26). The gene-agnostic downstream cascade shared by the whole
  spectrum is curated on the Zellweger Spectrum Disorders entry; what is carried
  here is what is PEX6- and classic-Zellweger-specific.

        PEX1 and PEX6 are two members of the ATPases associated with diverse cellular
        activities (AAA) family and the core components of the receptor export module
        of the peroxisomal matrix protein import machinery.
      explanation: >-
        Identifies PEX6 as an obligate core component of the export module, so its
        complete absence removes the module.
- name: Receptor Export Module Failure
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The PEX1-PEX6 heterohexamer is the ATP-driven motor that extracts
    monoubiquitinated PEX5 from the peroxisomal membrane by processive threading and
    unfolding, returning it to the cytosol for reuse. Because PEX1 and PEX6 are
    obligate partners, a PEX6 null and a PEX1 null converge on the same rate-limiting
    step - which is why PBD4A and PBD1A are phenotypically indistinguishable at the
    bedside despite different genes.
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:
  - reference: PMID:29884772
    reference_title: "Peroxisomal monoubiquitinated PEX5 interacts with the AAA ATPases PEX1 and PEX6 and is unfolded during its dislocation into the cytosol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PEX1 and PEX6 are two members of the ATPases associated with diverse cellular
      activities (AAA) family and the core components of the receptor export module
      of the peroxisomal matrix protein import machinery.
    explanation: >-
      States the identity and role of the module whose failure this node describes.
  downstream:
  - target: Collapse of Peroxisomal Matrix Protein Import
    description: >-
      PEX5 that cannot be recycled is not available to carry the next matrix enzyme,
      so import runs down to nothing.
    causal_link_type: DIRECT
- name: Collapse of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Without receptor recycling, PTS1- and PTS2-targeted matrix enzymes are not
    delivered. The peroxisomal membrane compartment is still assembled, because
    membrane protein import uses PEX19/PEX3 and is independent of the PEX5 cycle;
    what results is an empty organelle - the "peroxisomal ghost" seen in patient
    fibroblasts. This is the defining cellular lesion of a biogenesis disorder and
    the reason the biochemical phenotype is multi-pathway rather than single-enzyme.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
    modifier: DECREASED
  - preferred_term: peroxisome organization
    term:
      id: GO:0007031
      label: peroxisome organization
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of the defect in peroxisome formation, multiple metabolic (both
      catabolic and anabolic) pathways are impaired resulting in metabolic
      abnormalities.
    explanation: >-
      States the central consequence of the import collapse - that the defect is at
      the level of the organelle and therefore hits many pathways at once.
  downstream:
  - target: Loss of Peroxisomal Fatty Acid Oxidation
    causal_link_type: DIRECT
    description: >-
      The beta- and alpha-oxidation enzymes are matrix enzymes and are among those
      not delivered.
  - target: Plasmalogen Biosynthesis Failure
    causal_link_type: DIRECT
    description: >-
      The first two committed steps of ether-lipid synthesis are peroxisomal matrix
      reactions, so the anabolic half of the phenotype has the same immediate cause
      as the catabolic half.
  - target: Bile Acid Intermediate Accumulation and Cholestatic Liver Injury
    causal_link_type: DIRECT
    description: >-
      C27 bile acid side-chain shortening is a peroxisomal beta-oxidation reaction.
  - target: Defective Neuronal Migration in the Developing Cortex
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The migration defect is downstream of the lipid lesions rather than of a single
      identified peroxisomal protein, so the link is recorded as indirect.
- name: Loss of Peroxisomal Fatty Acid Oxidation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Very-long-chain fatty acids are shortened only in peroxisomes, and phytanic acid
    can be degraded only by peroxisomal alpha-oxidation. With the matrix empty, both
    substrates accumulate in plasma and tissue. This is the arm of the phenotype that
    the first-line diagnostic assay reads out.
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  - preferred_term: fatty acid alpha-oxidation
    term:
      id: GO:0001561
      label: fatty acid alpha-oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZSD patients accumulate very long chain fatty acids (VLCFAs), phytanic- and
      pristanic acid, C27-bile acid intermediates and pipecolic acid in plasma and
      have a deficiency of plasmalogens in erythrocytes
    explanation: >-
      Names the accumulating substrates that define the catabolic half of the
      biochemical phenotype.
- name: Plasmalogen Biosynthesis Failure
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Ether-phospholipid synthesis begins with two peroxisomal matrix enzymes, so an
    empty peroxisome cannot make plasmalogens. Erythrocyte plasmalogen is
    correspondingly low and, unlike VLCFA, it is a deficiency rather than an
    accumulation - the anabolic half of the lesion.
  biological_processes:
  - preferred_term: ether lipid biosynthetic process
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZSD patients accumulate very long chain fatty acids (VLCFAs), phytanic- and
      pristanic acid, C27-bile acid intermediates and pipecolic acid in plasma and
      have a deficiency of plasmalogens in erythrocytes
    explanation: >-
      The same sentence records the erythrocyte plasmalogen deficiency that this node
      describes.
- name: Bile Acid Intermediate Accumulation and Cholestatic Liver Injury
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Shortening the side chain of the C27 intermediates DHCA and THCA to make the
    mature C24 bile acids is a peroxisomal beta-oxidation reaction. When it fails the
    intermediates accumulate and are themselves hepatotoxic and cholestatic, so the
    liver disease is not simply a consequence of generalised metabolic illness.
    Clinically this presents as prolonged jaundice, hepatomegaly and coagulopathy in
    the newborn period.
  biological_processes:
  - preferred_term: bile acid metabolic process
    term:
      id: GO:0008206
      label: bile acid metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZSD patients within this group typically present in the neonatal period with
      hepatic dysfunction and profound hypotonia resulting in prolonged jaundice and
      feeding difficulties.
    explanation: >-
      Describes the neonatal hepatic presentation of the severe group, which is the
      clinical face of this node.
- name: Defective Neuronal Migration in the Developing Cortex
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The cortical malformation of classic Zellweger syndrome - perisylvian
    polymicrogyria with heterotopia - is a prenatal neuronal migration defect. It is
    the single most consequential node in this entry for prognosis, because it is
    fixed at birth: no post-natal intervention can undo it, which is why no therapy
    in the treatments section - cholic acid included - changes the neurological
    outcome. It is also the node that most
    cleanly separates PBD4A from PBD4B, where congenital malformations are absent and
    the neurological course is degenerative rather than developmental.
  biological_processes:
  - preferred_term: cerebral cortex cell migration
    term:
      id: GO:0021795
      label: cerebral cortex cell migration
    modifier: DECREASED
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital malformations,
      but rather progressive peroxisome dysfunction
    explanation: >-
      GeneReviews draws exactly the contrast this node rests on: congenital
      malformation is the severe presentation, progressive dysfunction the milder one.
  - reference: PMID:24607700
    reference_title: Revisiting the neuropathogenesis of Zellweger syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neuropathological changes include abnormal neuronal migration affecting the
      cerebral hemispheres, cerebellum and inferior olivary complex, abnormal Purkinje
      cell arborisation, demyelination and post-developmental neuronal degeneration.
    explanation: >-
      Gives the anatomical extent of the migration defect and names the Purkinje-cell
      and demyelination changes that accompany it.
  - reference: PMID:14586000
    reference_title: Neuronal migration depends on intact peroxisomal function in brain and in extraneuronal tissues.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Functional peroxisome deficiency, as encountered in Zellweger syndrome, causes a
      specific impairment of neuronal migration.
    explanation: >-
      States the causal claim this node makes, in a mouse model of the same lesion.
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      generalized decrease in white matter volume, delayed myelination, bilaterial
      ventricular dilatation and germinolytic cysts
    explanation: >-
      Gives the neonatal MRI findings that accompany the migration defect in this
      group. The clause naming perisylvian polymicrogyria sits immediately before
      this one in the same sentence but is broken across a hyphenated line break in
      the cached PDF text and so cannot be quoted verbatim.
  downstream:
  - target: Neonatal Seizures
    causal_link_type: DIRECT
    description: >-
      The seizures of classic Zellweger syndrome arise from the cortical malformation
      rather than from metabolic decompensation.

treatments:
- name: Supportive and Symptomatic Management
  therapeutic_modality: OTHER
  description: >-
    There is no treatment for the biogenesis defect itself. Management is otherwise
    symptomatic - gastrostomy feeding, anti-seizure medication, hearing aids, cataract
    surgery, fat-soluble vitamin supplementation. None of it restores peroxisomal
    import, and the cortical malformation is complete before birth, so the neurological
    outcome is not modifiable. Cholic acid, curated separately below, is the one
    exception to "nothing is disease-modifying" and it modifies the liver arm only.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: The focus is on symptomatic therapy and may
      include gastrostomy to provide adequate calories, hearing aids, cataract
      removal, glasses to correct refractive errors, supplementation of fat-soluble
      vitamins, and cholic acid supplementation
    explanation: >-
      GeneReviews Management section enumerates the symptomatic measures and confirms
      that no disease-modifying therapy exists.
- name: Oral Cholic Acid
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The one pharmacological therapy in Zellweger spectrum disease with phase 3
    evidence behind it. Supplying the mature primary bile acid suppresses endogenous
    synthesis and so reduces production of the hepatotoxic C27 intermediates that
    accumulate when peroxisomal side-chain shortening fails. It is disease-modifying
    for the liver arm of the phenotype and for nothing else: it does not restore
    peroxisomal import and cannot touch the congenital brain malformation, so it does
    not change the prognosis of the severe presentation curated here.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  target_mechanisms:
  - target: Bile Acid Intermediate Accumulation and Cholestatic Liver Injury
    description: >-
      Feedback suppression of endogenous bile acid synthesis lowers the flux into the
      blocked peroxisomal step, so fewer toxic C27 intermediates are made.
    evidence:
    - reference: PMID:28644367
      reference_title: Oral Cholic Acid Is Efficacious and Well Tolerated in Patients With Bile Acid Synthesis and Zellweger Spectrum Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cholic acid significantly improved urine bile acid metabolite scores (P <
        0.0001) and serum aspartate aminotransferase and alanine aminotransferase (P <
        0.0001) in patients with SED and ZSD.
      explanation: >-
        Shows the intervention moves both the bile-acid metabolite readout and the
        liver-injury markers, which is the mechanism this link asserts.
  evidence:
  - reference: PMID:28644367
    reference_title: Oral Cholic Acid Is Efficacious and Well Tolerated in Patients With Bile Acid Synthesis and Zellweger Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral cholic acid is a safe, efficacious, and well-tolerated treatment for BASD
      due to SED and ZSD.
    explanation: >-
      The trial's conclusion. Note the ZSD arm was 20 patients in a single-arm,
      open-label, non-randomised design, and was not stratified by PEX gene or by
      severity, so nothing in it is specific to PBD4A.
- name: Docosahexaenoic Acid Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Curated because it is a negative result worth recording rather than a therapy to
    offer. DHA is low in Zellweger spectrum disease because its final synthetic step
    is peroxisomal, which made replacement an obvious hypothesis; a double-blind
    randomised placebo-controlled trial found no effect on visual function or growth.
    The entry keeps it so that a future curator does not re-derive the hypothesis from
    the biochemistry and present it as promising.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20805528
    reference_title: "Docosahexaenoic acid therapy in peroxisomal diseases: results of a double-blind, randomized trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHA supplementation did not improve the visual function or growth of treated
      individuals with peroxisome assembly disorders.
    explanation: >-
      Refutes DHA replacement as a disease-modifying therapy. Graded REFUTE because the
      claim being tested is that supplementing the deficient lipid helps, and the trial
      says it does not.
- name: Genetic Counseling
  therapeutic_modality: OTHER
  description: >-
    Recurrence risk counselling for the family, with carrier testing for at-risk
    relatives and the option of prenatal testing once both variants are known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carrier testing for at-risk relatives is possible if the pathogenic variants
      have been identified in an affected family member.
    explanation: >-
      GeneReviews Genetic Counseling section states the carrier-testing option that
      this entry records as management.
progression:
- phase: Neonatal-infantile
  notes: >-
    Presentation at or shortly after birth with profound hypotonia, poor feeding,
    seizures, dysmorphism and hepatic dysfunction. Congenital malformations - the
    cortical migration defect, renal cysts and epiphyseal stippling - are already
    present.
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The neonatal-infantile presentation grossly resembles what was originally
      described as classic ZS.
    explanation: >-
      Identifies the presentation curated here with classic Zellweger syndrome.
- phase: Infantile death
  notes: >-
    Death, usually in the first year, most often from liver failure, respiratory
    compromise or intractable seizures. Survival beyond infancy would put the
    diagnosis of the severe form in doubt and prompt reconsideration of PBD4B.
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis is poor and survival is usually not beyond the first year of life.
    explanation: >-
      Gives the survival expectation for the neonatal-infantile presentation.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die during the
      first year of life, usually having made no developmental progress.
    explanation: >-
      Independent statement of the same prognosis from GeneReviews.
discussions:
- discussion_id: pbd4a_null_genotype_fraction
  kind: KNOWLEDGE_GAP
  prompt: >-
    What fraction of the PEX6 complementation group carries a biallelic null genotype
    and therefore belongs to PBD4A rather than PBD4B?
  attaches_to:
  - pathophysiology#Biallelic Null PEX6 Genotype
  rationale: >-
    The A/B split at this locus is defined by residual peroxin-6 function, but the
    published PEX6 series report mutation spectra rather than a genotype-stratified
    phenotype breakdown. Ebberink and colleagues characterised 75 patients and 77
    distinct mutations without reporting how many of those genotypes were biallelic
    null. Without that denominator neither a prevalence figure nor a
    genotype-to-subtype rule can be curated for this entry, which is why the entry
    carries no prevalence block. This is a gap in the source literature rather than
    in the curation.
- discussion_id: pbd4a_migration_defect_proximate_cause
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the neuronal migration defect in classic Zellweger syndrome driven by
    plasmalogen deficiency, by VLCFA accumulation, or by loss of a peroxisomal
    function not yet identified?
  attaches_to:
  - pathophysiology#Defective Neuronal Migration in the Developing Cortex
  rationale: >-
    The link from the import collapse to the cortical malformation is recorded as
    INDIRECT_UNKNOWN_INTERMEDIATES precisely because the intervening step is unknown,
    and the best experiment on the question makes the gap wider rather than narrower.
    Selectively restoring peroxisomes in the liver of Pex5 knockout mice corrected the
    neuronal migration defect without changing brain VLCFA, DHA or plasmalogen levels
    at all. So the migration defect is not a straightforward consequence of the brain's
    own lipid abnormality, and an extraneuronal - probably hepatic - contribution is
    doing part of the work. Assigning the responsible factor would change what a
    prenatal intervention would have to target and in which tissue, so the gap is
    mechanistically load-bearing rather than academic.
  evidence:
  - reference: PMID:14586000
    reference_title: Neuronal migration depends on intact peroxisomal function in brain and in extraneuronal tissues.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In liver-rescued mice, the improvement of the neuronal migration was not
      accompanied by changes in very long chain fatty acid, docosahexaenoic acid, or
      plasmalogen levels in brain, indicating that other metabolic factors can
      influence the neuronal migration process.
    explanation: >-
      The result that keeps this gap open: correcting migration without correcting
      brain lipids rules out the obvious candidate mechanism.
notes: >-
  Curation level and lump/split decision. PBD4A is curated as its own entry rather
  than as a has_subtypes entry on PBD4B, following the precedent already set in this
  KB by Peroxisome Biogenesis Disorder 3A (PEX12) and 11A (PEX26) alongside 1B and
  4B. The reasoning is that the "A"/"B" split within a PEX complementation group is
  a mechanistic statement about residual peroxin function, not a bare severity label:
  the two ends differ in whether the disease is a congenital malformation syndrome or
  a progressive degenerative one, which is a different pathograph and not a different
  point on one. PBD4A also holds its own MONDO and OMIM identity.

  Relationship to sibling entries. The existing Peroxisome Biogenesis Disorder 4B
  entry names PBD4A explicitly as the severe counterpart it is defined against, so
  the two are intended to be read together. The gene-agnostic downstream cascade
  shared by the whole Zellweger spectrum - the full biochemical profile, the
  multisystem phenotype, and the management framework - is curated once on the
  Zellweger Spectrum Disorders entry; this entry deliberately carries only what is
  PEX6- and classic-Zellweger-specific, and cross-refers rather than duplicating.

  Evidence base and its limits, stated plainly. The clinical detail in this entry is
  inherited from descriptions of the severe end of the Zellweger spectrum as a whole -
  chiefly the GeneReviews chapter and the Klouwer review - not from a series of PBD4A
  patients, because no such series exists. What is anchored on PEX6-specific sources is
  the part that makes this a separate entry: the mutation spectrum and complementation
  group size (PMID:19877282) and the direction of the genotype-severity correlation,
  truncating alleles severe and missense milder (PMID:41787707). Neither of those
  reports a genotype-stratified phenotype breakdown, so the boundary between PBD4A and
  PBD4B is a qualitative rule rather than a validated classifier; the first knowledge
  gap records the study that would fix that. Two therapy claims - cholic acid and the
  negative DHA trial - come from ZSD-wide trials whose ZSD arms were 20 and roughly 48
  patients respectively, neither stratified by PEX gene, so they are recorded as
  spectrum-level evidence applied here rather than as PBD4A results. The
  evidence_source values follow the same logic: OTHER for the GeneReviews chapter and
  the Crane neuropathology review, which are expert compilations rather than primary
  studies; MODEL_ORGANISM for the mouse work on neuronal migration; HUMAN_CLINICAL for
  the patient trials and cohort reviews.

  Named-entity-confusion check. "Complementation group 4" and "complementation group
  C" both refer to this group in older literature, and the group was independently
  numbered in two different series - which is why MONDO carries both "complementation
  group 4" and "complementation group 6" as synonyms of the same concept. That is a
  numbering collision in the historical nosology, not two diseases. Care is needed in
  the other direction too: "PBD4A" and "PBD1A" are different genes (PEX6 and PEX1)
  with an indistinguishable clinical phenotype, so a clinical description alone never
  assigns an entry.

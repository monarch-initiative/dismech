      which PBD4A is the severe PEX6 end.
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The autosomal recessive Zellweger syndrome spectrum (ZSS) disorders comprise
      a main subgroup of the peroxisome biogenesis disorders.
    explanation: >-
      The PEX6 mutation survey confirms autosomal recessive inheritance across the
      complementation group this entry belongs to.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At conception, each sib of an individual with biallelic ZSD-causing pathogenic
      variants has a 25% chance of being affected, a 50% chance of being an
      asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      GeneReviews gives the recurrence risk that follows from the biallelic
      requirement, which is what genetic counselling for this entry turns on.
pathophysiology:
- name: Biallelic Null PEX6 Genotype
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PEX6 is a 17-exon gene encoding an AAA-ATPase with two tandem AAA cassettes;
    pathogenic variants are scattered across all exons and the allelic series is
    wide. PBD4A is the subset of that series in which both alleles are null or
    severely truncating, so no functional peroxin-6 is produced. This is the single
    variable that separates this entry from PBD4B at the identical locus, which is
    why the entry is curated on residual function rather than on gene identity.
  genes:
  - preferred_term: PEX6
    term:
      id: hgnc:8859
      label: PEX6
  genetic_context:
    genes:
    - preferred_term: PEX6
      term:
        id: hgnc:8859
        label: PEX6
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    complementation_group: "4"
    notes: >-
      Recorded as complete loss of function because it is the biallelic null or
      severely truncating genotypes, rather than PEX6 involvement as such, that
      define this entry against PBD4B. Compound heterozygosity for two severe
      alleles produces the same phenotype; HOMOZYGOUS is recorded as the
      commonest reported configuration in consanguineous pedigrees rather than
      as a requirement.
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  evidence:

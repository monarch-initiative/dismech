inheritance:
- name: Autosomal recessive
  description: >-
    PBD4A requires PEX6 variants on both alleles, and specifically the genotypes
    that leave no residual peroxin-6 function. A single severe allele in trans with
    a partially functional one shifts the presentation toward PBD4B rather than
    producing this phenotype.

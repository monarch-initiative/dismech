      rather than another group.
diagnosis:
- name: Plasma Very-Long-Chain Fatty Acid Profile
  description: >-
    The first-line biochemical test. Elevated C26:0 with abnormal C24/C22 and C26/C22
    ratios points at a peroxisomal disorder before any gene is sequenced, and in the
    severe presentation the result is not equivocal.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:

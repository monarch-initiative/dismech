    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The encoded protein PEX6 belongs to the AAA ATPase family and contains two
      AAA cassettes and an AAA protein family signature.
    explanation: >-
      Establishes the domain architecture of the protein whose complete loss defines
      this entry.
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed the PEX6 genes of 75 patients assigned to the PEX6 complementation
      group. We identified a total of 77 different mutations of which 47 mutations
      have not been reported previously, and 14 polymorphic variants.
    explanation: >-
      Documents the allelic heterogeneity across which the PBD4A/PBD4B severity split
      is drawn, and the size of the complementation group.
  - reference: PMID:41787707
    reference_title: "Unraveling PEX6: insights into very-long-chain fatty acid levels and peroxisome biogenesis disorders in pediatric populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic variations in PEX6, an important peroxisome biogenesis factor, contribute
      significantly to this phenotypic diversity, with missense variants often
      associated with less severe disease compared to truncating mutations.
    explanation: >-
      A PEX6-specific review stating the genotype-severity direction this entry is
      built on: truncating alleles at the severe end, missense at the milder one.
  - reference: PMID:26387595
    reference_title: "Heimler Syndrome Is Caused by Hypomorphic Mutations in the Peroxisome-Biogenesis Genes PEX1 and PEX6."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that each HS-affected family has at least one hypomorphic allele
      that results in extremely mild peroxisomal dysfunction.
    explanation: >-
      The opposite pole of the same allelic series. Cited here as the contrast that
      makes the residual-function claim testable: hypomorphic PEX6 alleles give the
      mildest phenotype known at this locus, so the severe phenotype curated here is
      attributed to their absence. INDIRECT because the inference runs from the mild
      end back to the severe one rather than from a direct study of null genotypes.
  downstream:
  - target: Receptor Export Module Failure
    description: >-
      With no functional peroxin-6, the PEX1-PEX6 motor cannot assemble, so the step
      it performs does not occur at all rather than occurring slowly.
    causal_link_type: DIRECT
    evidence:

genetic:
- name: PEX6
  gene_term:
    preferred_term: PEX6
    term:
      id: hgnc:8859
      label: PEX6
  relationship_type: CAUSATIVE
  notes: >-
    The complementation group 4 (group C) gene, and the second most common cause of
    Zellweger spectrum disease after PEX1. The gene alone does not determine which
    end of the spectrum a patient sits at; the residual function left by the genotype
    does. Note that this locus also carries a documented exception to simple
    recessive transmission - the p.Arg860Trp allele can cause disease in the
    heterozygous state through allelic expression imbalance - but that mechanism
    produces milder disease and is curated on the PBD4B entry, not here.
  evidence:
  - reference: PMID:19877282
    reference_title: Spectrum of PEX6 mutations in Zellweger syndrome spectrum patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Defects in the PEX6 gene are the second most common cause for ZSS disorders.
    explanation: >-
      Establishes PEX6 as the causative gene and its rank among the ZSD genes.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      by identification of biallelic pathogenic variants in one of the 13 known
      ZSD-PEX genes
    explanation: >-

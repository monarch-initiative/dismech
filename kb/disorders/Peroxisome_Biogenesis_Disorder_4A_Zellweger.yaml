    Plasma C26:0 with the C24/C22 and C26/C22 ratios is the first-line biochemical
    screen. In the severe presentation curated here the elevation is unambiguous,
    unlike the mild end of the PEX6 series where it can be borderline or normal.
  biomarker_term:

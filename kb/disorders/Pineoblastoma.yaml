      presenting neurologic and ocular manifestations.
  - reference: ORPHA:251909
    reference_title: "Pineoblastoma"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pineoblastoma is a rare, malignant type of supratentorial primitive
      neuroectodermal tumor (sPNET), found mainly in children (less than 10% of
      cases are reported in adults), and located in the pineal region of the
      brain but that can metastasize along the neuroaxis.
    explanation: >-
      Establishes pineal-region anatomic origin and neuroaxis leptomeningeal
      metastatic spread.

    snippet: >-
      Within PB-Grp1A (n=54) recurrent homozygous focal deletion of the DROSHA
      or DGCR8 gene loci were identified in 11/54 (20%) and 4/54 (7%) cases,
      respectively (example depicted in Figure 4a+b), whereas none of the
      PB-Grp1B (n=10) tumors showed a deletion of one of these genes.
    explanation: >-
      Documents recurrent homozygous focal deletions of DGCR8 in human
      pineoblastoma.
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The complex formed by the nuclear ribonuclease DROSHA and the
      microprocessor complex subunit DGCR8 further processes primary precursor
      miRNA into hairpin precursor-miRNA, which is then cleaved by DICER1 in
      order to obtain mature miRNA [42].
    explanation: >-
      Establishes the role of DGCR8 as the non-catalytic microprocessor complex
      subunit partnering with DROSHA in primary microRNA processing.
  downstream:
  - target: MicroRNA-Processing Pathway Inactivation
    description: Loss of DGCR8 impairs microprocessor complex function in primary microRNA cleavage

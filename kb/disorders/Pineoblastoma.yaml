      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        pineoblastoma (PB) constitutes a highly aggressive malignancy of
        childhood with a poor outcome.
      explanation: >-
        Supports classifying pineoblastoma as a malignant cancer.
    - reference: PMID:31802236
      reference_title: "Risk-adapted therapy and biological heterogeneity in pineoblastoma: integrated clinico-pathological analysis from the prospective, multi-center SJMB03 and SJYC07 trials."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pineoblastoma is a rare embryonal tumor of childhood that is
        conventionally treated with high-dose craniospinal irradiation (CSI).
      explanation: >-
        Supports classifying pineoblastoma as a pediatric solid embryonal tumor.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: ORPHA:251909
      reference_title: "Pineoblastoma"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Pineoblastoma is a rare, malignant type of supratentorial primitive
        neuroectodermal tumor (sPNET), found mainly in children (less than 10%
        of cases are reported in adults), and located in the pineal region of
        the brain but that can metastasize along the neuroaxis.
      explanation: >-
        Supports neurologic organ-system classification as a primary central
        nervous system pineal-region tumor with neuroaxis spread.

- name: Pineal Parenchymal Tumor Mass and CSF Obstruction
  biological_scale: TISSUE
  description: >-
    Expansion of a malignant embryonal mass in the pineal region compresses the
    dorsal midbrain and obstructs cerebrospinal fluid outflow at the cerebral
    aqueduct and posterior third ventricle, producing obstructive hydrocephalus,
    elevated intracranial pressure, ocular motility defects, and propensity for
    craniospinal leptomeningeal dissemination.

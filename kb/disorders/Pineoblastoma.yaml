- accession: geo:GSE180868
  title: A temporal in vivo catalog of chromatin accessibility and expression profiles in pineoblastoma reveals a prevalent role for repressor elements
  description: Pediatric pineoblastomas (PBs) are rare and aggressive tumors of grade IV histology. Although some oncogenic drivers are characterized, including germline mutations in RB1 and DICER1, the role of epigenetic deregulation and cis-regulatory regions in PB pathogenesis and progression is largely unknown. Here, we generated genome-wide gene expression, chromatin accessibility, and H3K27ac profiles covering key time points of PB initiation and progression from pineal tissues of a mouse model of CCND1-driven PB.

pathophysiology:
- name: DROSHA and DICER1 RNase III Endonuclease Inactivation
  subtypes:
  - PB-miRNA1
  - PB-miRNA2
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE_AND_SOMATIC
    allelic_hit_role: BIALLELIC_INACTIVATION
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic loss-of-function mutations or homozygous focal deletions of the
    RNase III endonucleases DROSHA or DICER1—arising either sporadically or via
    germline predisposition with a somatic second hit—abolish nuclear primary
    microRNA or cytoplasmic precursor microRNA cleavage in pinealocytes.
  cell_types:

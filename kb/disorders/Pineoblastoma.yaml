      label: miRNA processing
  genes:
  - preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  - preferred_term: DROSHA
    term:
      id: hgnc:17904
      label: DROSHA
  evidence:
  - reference: PMID:39992227
    reference_title: "Germline Pathogenic DROSHA Variants Are Linked to Pineoblastoma and Wilms Tumor Predisposition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Canonical miRNA biogenesis is a two-step process involving the RNases
      DROSHA and DICER1.
    explanation: >-
      Establishes that DROSHA and DICER1 are the two RNase enzymes catalyzing
      canonical two-step microRNA cleavage.
  - reference: PMID:39992227
    reference_title: "Germline Pathogenic DROSHA Variants Are Linked to Pineoblastoma and Wilms Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe nine children from eight families with heterozygous DROSHA
      GPVs and a diagnosis of pineoblastoma (n = 8) or Wilms tumor (n = 1). A
      somatic second hit in DROSHA was detected in all eight tumors analyzed.
    explanation: >-
      Demonstrates two-hit germline plus somatic biallelic inactivation of
      DROSHA in human pineoblastoma.
  - reference: PMID:41291966
    reference_title: "Recurrent genetic alterations in epigenetically defined pineoblastoma subtypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PB-miRNA subtype tumors had characteristic alterations in
      microRNA-processing genes; DICER1 mutations (n = 19/64) and homozygous
      deletions of the DROSHA locus (n = 18/67) were most abundant, followed by
      DROSHA mutations (n = 12/64).
    explanation: >-
      Quantifies the high frequency of DICER1 mutations and DROSHA homozygous
      deletions or mutations in PB-miRNA subtypes.
  downstream:
  - target: MicroRNA-Processing Pathway Inactivation
    description: Loss of DROSHA or DICER1 RNase III endonuclease activity disables two-step microRNA biogenesis

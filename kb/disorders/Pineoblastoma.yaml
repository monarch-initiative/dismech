genetic:
- name: DICER1
  gene_term:
    preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  association: Germline and Somatic Alterations
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    DICER1 is a recurrent pineoblastoma predisposition and tumor-suppressor
    driver gene in PB-miRNA1 and PB-miRNA2 subgroup disease, frequently coupled
    with chromosome 14 loss or copy-neutral loss of heterozygosity rather than
    the RNase IIIb hotspot missense pattern typical of extra-CNS DICER1 tumors.
  evidence:
  - reference: PMID:41291966
    reference_title: "Recurrent genetic alterations in epigenetically defined pineoblastoma subtypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PB-miRNA subtype tumors had characteristic alterations in
      microRNA-processing genes; DICER1 mutations (n = 19/64) and homozygous
      deletions of the DROSHA locus (n = 18/67) were most abundant, followed by
      DROSHA mutations (n = 12/64).
    explanation: >-
      Quantifies DICER1 mutations (19/64) as one of the two most abundant
      genetic lesions in PB-miRNA consensus subtypes.
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PBs mainly arise sporadically, but may also occur in the context of cancer
      predisposition syndromes including DICER1 and RB1 germline mutation.
    explanation: >-
      Establishes germline DICER1 cancer predisposition alongside sporadic
      disease in pineoblastoma.
- name: DROSHA
  gene_term:
    preferred_term: DROSHA
    term:
      id: hgnc:17904
      label: DROSHA
  association: Germline and Somatic Alterations
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    DROSHA is inactivated by somatic homozygous focal deletions or truncating
    mutations in PB-miRNA subtypes, and heterozygous germline DROSHA
    loss-of-function variants with somatic second-hit inactivation define an
    autosomal dominant pineoblastoma predisposition strongly enriched in
    PB-miRNA1.
  evidence:
  - reference: PMID:39992227
    reference_title: "Germline Pathogenic DROSHA Variants Are Linked to Pineoblastoma and Wilms Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe nine children from eight families with heterozygous DROSHA
      GPVs and a diagnosis of pineoblastoma (n = 8) or Wilms tumor (n = 1). A
      somatic second hit in DROSHA was detected in all eight tumors analyzed.
    explanation: >-
      Demonstrates germline DROSHA pathogenic variants with somatic second-hit
      inactivation as a hereditary cause of pineoblastoma.
  - reference: PMID:41291966
    reference_title: "Recurrent genetic alterations in epigenetically defined pineoblastoma subtypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PB-miRNA subtype tumors had characteristic alterations in
      microRNA-processing genes; DICER1 mutations (n = 19/64) and homozygous
      deletions of the DROSHA locus (n = 18/67) were most abundant, followed by
      DROSHA mutations (n = 12/64).
    explanation: >-
      Quantifies homozygous DROSHA deletions (18/67) and DROSHA mutations
      (12/64) across PB-miRNA subtypes.
- name: DGCR8
  gene_term:
    preferred_term: DGCR8
    term:
      id: hgnc:2847
      label: DGCR8
  association: Somatic Alterations
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    DGCR8 encodes the RNA-binding microprocessor complex subunit and undergoes
    mutually exclusive somatic focal homozygous deletions or mutations in
    microRNA-processing defective pineoblastoma.
  evidence:
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within PB-Grp1A (n=54) recurrent homozygous focal deletion of the DROSHA
      or DGCR8 gene loci were identified in 11/54 (20%) and 4/54 (7%) cases,
      respectively (example depicted in Figure 4a+b), whereas none of the
      PB-Grp1B (n=10) tumors showed a deletion of one of these genes.
    explanation: >-
      Documents recurrent somatic homozygous focal deletions of DGCR8 in
      pineoblastoma.
- name: RB1
  gene_term:
    preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  association: Germline and Somatic Alterations
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    Biallelic RB1 inactivation underlies the PB-RB1 subgroup, arising either
    from constitutional RB1 pathogenic variants with tumor loss of
    heterozygosity in trilateral retinoblastoma or from sporadic somatic RB1
    mutations and focal deletions.
  evidence:
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Information on RB1 germline status was known for three of the TLRB cases,
      with a constitutional heterozygous RB1 germline alteration accompanied by
      loss-of-heterozygosity (LOH) in the tumor in each case.
    explanation: >-
      Demonstrates constitutional RB1 mutation plus tumor LOH in trilateral
      retinoblastoma-associated pineoblastoma.
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, 11/16 cases showed an RB1 alteration (SNV, InDel or gene
      deletion) predicted to lead to a loss of function (with sequencing data
      missing for 6 cases).
    explanation: >-
      Documents recurrent somatic and germline loss-of-function RB1 alterations
      in the Pin-RB subgroup.
- name: FOXR2
  gene_term:
    preferred_term: FOXR2
    term:
      id: hgnc:30469
      label: FOXR2
  association: Oncogenic Overexpression
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Universal FOXR2 proto-oncogene overexpression defines the infant-predominant
    PB-MYC/FOXR2 subgroup.
  evidence:
  - reference: PMID:31802236
    reference_title: "Risk-adapted therapy and biological heterogeneity in pineoblastoma: integrated clinico-pathological analysis from the prospective, multi-center SJMB03 and SJYC07 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PB-FOXR2 samples universally overexpressed the FOXR2 proto-oncogene.
    explanation: >-
      Establishes FOXR2 proto-oncogene overexpression as the hallmark molecular
      driver of the PB-FOXR2 (consensus PB-MYC/FOXR2) subgroup.
- name: OTX2
  gene_term:
    preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  association: Copy-Number Gain
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Somatic copy-number gain of OTX2 occurs in nearly half of pineoblastomas
    across all four epigenetic consensus subgroups.
  evidence:
  - reference: PMID:41291966
    reference_title: "Recurrent genetic alterations in epigenetically defined pineoblastoma subtypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OTX2 gain represented the most frequent alteration that occurred in
      37/83 PB of all subtypes.
    explanation: >-
      Quantifies OTX2 copy-number gain (37/83) as the single most frequent
      genetic alteration across all pineoblastoma subtypes.
diagnosis:
- name: Brain and Spine Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Contrast-enhanced magnetic resonance imaging of the brain and entire
    craniospinal axis evaluates the pineal-region primary mass, associated
    obstructive hydrocephalus, and leptomeningeal dissemination required for
    staging and risk-adapted treatment stratification.
  results: >-
    Pineal-region mass often accompanied by obstructive hydrocephalus and, in
    metastatic cases, craniospinal leptomeningeal seeding.
  evidence:
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is an embryonal tumor graded as WHO grade IV which frequently
      disseminates in cranio-spinal axis [15, 30].
    explanation: >-
      Establishes frequent craniospinal axis dissemination, requiring full
      neuroaxis staging at diagnosis.
- name: Genome-Wide DNA Methylation Profiling and Molecular Subgrouping
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Genome-wide DNA methylation profiling distinguishes pineoblastoma from
    histologic mimics of the pineal region (pineocytoma, pineal parenchymal
    tumor of intermediate differentiation, papillary tumor of the pineal region,
    and medulloblastoma) and assigns tumors to consensus epigenetic subtypes
    (PB-miRNA1, PB-miRNA2, PB-MYC/FOXR2, and PB-RB1) with distinct clinical and
    prognostic profiles.
  results: >-
    Epigenetic classification into PB-miRNA1, PB-miRNA2, PB-MYC/FOXR2, or
    PB-RB1 consensus methylation classes with accompanying copy-number profile.
  evidence:
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unsupervised clustering based on DNA methylation profiling separated known
      subgroups, like pineocytoma, pineal parenchymal tumor of intermediate
      differentiation, papillary tumor of the pineal region and PB, and further
      distinct subtypes within these groups, including three subtypes within the
      core PB subgroup.
    explanation: >-
      Demonstrates that DNA methylation profiling separates pineoblastoma from
      other pineal parenchymal tumors and resolves molecular subtypes.
  - reference: PMID:41291966
    reference_title: "Recurrent genetic alterations in epigenetically defined pineoblastoma subtypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our cohort consisted of 48 PB-miRNA1, 19 PB-miRNA2, 8 PB-MYC/FOXR2, and
      8 PB-RB1 cases.
    explanation: >-
      Defines the four current epigenetic consensus subtypes used in molecular
      neuropathology classification of pineoblastoma.
- name: Paired Tumor-Germline Predisposition Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing and copy-number evaluation of RB1, DICER1, and DROSHA in germline
    and tumor DNA identify underlying hereditary cancer predisposition syndromes
    (trilateral retinoblastoma, DICER1-related tumor predisposition, and
    DROSHA-related tumor predisposition) and somatic driver alterations.
  results: >-
    Identification of constitutional pathogenic variants in RB1, DICER1, or
    DROSHA with tumor second-hit inactivation, or somatic-only pathway lesions.
  evidence:
  - reference: PMID:39992227
    reference_title: "Germline Pathogenic DROSHA Variants Are Linked to Pineoblastoma and Wilms Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that genetic testing for DROSHA GPVs be considered for patients
      with pineoblastoma, Wilms tumor, or other DICER1-/DGCR8-related conditions
      and propose surveillance recommendations through research studies for
      individuals with DROSHA GPVs.
    explanation: >-
      Supports germline DROSHA genetic testing alongside DICER1 evaluation in
      patients presenting with pineoblastoma.
  - reference: PMID:31768671
    reference_title: "Molecular subgrouping of primary pineal parenchymal tumors reveals distinct subtypes correlated with clinical parameters and genetic alterations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PBs mainly arise sporadically, but may also occur in the context of cancer
      predisposition syndromes including DICER1 and RB1 germline mutation.
    explanation: >-
      Supports germline RB1 and DICER1 predisposition evaluation in
      pineoblastoma.
treatments:
- name: Maximal Safe Surgical Resection
  description: >-
    Initial management centers on maximal safe surgical excision for diagnosis,
    decompression, and cytoreduction before adjuvant therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pineal Parenchymal Tumor Mass and CSF Obstruction
    description: Cytoreductive excision relieves pineal-region mass effect and cerebrospinal fluid obstruction
  evidence:
  - reference: PMID:40778560
    reference_title: "Outcomes of Infants and Young Children With CNS Embryonal Tumors Using Pre-Irradiation Chemotherapy: A Decade Long Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They were treated with maximal safe surgical excision followed by
      pre-irradiation chemotherapy (cyclophosphamide, etoposide and carboplatin)
      up to 36 months of age or till disease progression, followed by either
      craniospinal (standard 35Gy or reduced-dose 23.4 Gy) with boost to a total
      of 54.8 Gy or focal irradiation depending on attained age, residual tumor,
      and metastasis.
    explanation: >-
      Supports maximal safe surgical excision as part of standard multimodal
      pineoblastoma therapy.
- name: Craniospinal Irradiation
  description: >-
    Craniospinal irradiation remains a core component of treatment for older
    children, with dose adapted to metastasis risk group and age.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Craniospinal Irradiation
    term:
      id: NCIT:C116437
      label: Craniospinal Irradiation
  target_mechanisms:
  - target: Proliferation-Differentiation Imbalance
    description: Ionizing radiation eliminates proliferating embryonal pineoblastoma cells across the craniospinal axis
  - target: Pineal Parenchymal Tumor Mass and CSF Obstruction
    description: Primary-site boost and craniospinal irradiation control local pineal tumor burden and leptomeningeal spread
  evidence:
  - reference: PMID:31802236
    reference_title: "Risk-adapted therapy and biological heterogeneity in pineoblastoma: integrated clinico-pathological analysis from the prospective, multi-center SJMB03 and SJYC07 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pineoblastoma is a rare embryonal tumor of childhood that is conventionally
      treated with high-dose craniospinal irradiation (CSI).
    explanation: >-
      Supports craniospinal irradiation as a standard modality in pineoblastoma.
  - reference: PMID:31802236
    reference_title: "Risk-adapted therapy and biological heterogeneity in pineoblastoma: integrated clinico-pathological analysis from the prospective, multi-center SJMB03 and SJYC07 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SJMB03 protocol comprised risk-adapted CSI (average-risk = 23.4 Gy,
      high-risk = 36 Gy) with radiation boost to the primary site and adjuvant
      chemotherapy.
    explanation: >-
      Provides protocol-level evidence for risk-adapted craniospinal irradiation
      in older children.
- name: Multi-agent Chemotherapy
  description: >-
    Multi-agent cytotoxic chemotherapy is routinely combined with surgery and
    radiation, and in infants and young children under 3 years of age is used
    before irradiation to delay or reduce neurotoxic radiotherapy exposure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
  target_mechanisms:
  - target: Proliferation-Differentiation Imbalance
    description: DNA-damaging and topoisomerase-inhibiting cytotoxic agents eliminate cycling pineoblastoma cells
  - target: RB1 Pathway Inactivation
    description: Systemic chemotherapy targets rapidly dividing G1/S-deregulated embryonal tumor cells
  - target: FOXR2 Oncogenic Activation
    description: Induction and pre-irradiation chemotherapy are administered in infant pineoblastoma protocols
  evidence:
  - reference: PMID:31802236
    reference_title: "Risk-adapted therapy and biological heterogeneity in pineoblastoma: integrated clinico-pathological analysis from the prospective, multi-center SJMB03 and SJYC07 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SJYC07 protocol consisted of induction chemotherapy, consolidation with
      focal radiation (intermediate-risk) or chemotherapy (high-risk), and
      metronomic maintenance therapy.
    explanation: >-
      Supports protocol-based chemotherapy use in young children with
      pineoblastoma.
  - reference: PMID:40778560
    reference_title: "Outcomes of Infants and Young Children With CNS Embryonal Tumors Using Pre-Irradiation Chemotherapy: A Decade Long Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They were treated with maximal safe surgical excision followed by
      pre-irradiation chemotherapy (cyclophosphamide, etoposide and carboplatin)
      up to 36 months of age or till disease progression, followed by either
      craniospinal (standard 35Gy or reduced-dose 23.4 Gy) with boost to a total
      of 54.8 Gy or focal irradiation depending on attained age, residual tumor,
      and metastasis.
    explanation: >-
      Supports a common pediatric chemotherapy backbone used in the
      pre-irradiation setting for pineoblastoma.
- name: Genetic Counseling and Predisposition Surveillance
  description: >-
    Genetic counseling and germline testing for RB1, DICER1, and DROSHA are
    indicated for patients with pineoblastoma to guide hereditary cancer
    surveillance and family cascade evaluation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39992227
    reference_title: "Germline Pathogenic DROSHA Variants Are Linked to Pineoblastoma and Wilms Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that genetic testing for DROSHA GPVs be considered for patients
      with pineoblastoma, Wilms tumor, or other DICER1-/DGCR8-related conditions
      and propose surveillance recommendations through research studies for
      individuals with DROSHA GPVs.
    explanation: >-
      Supports predisposition genetic testing and surveillance counseling in
      pineoblastoma patients.

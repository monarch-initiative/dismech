notes: >-
  Pineoblastoma is modeled at the disease level (MONDO:0016722) with its four
  consensus DNA-methylation subgroups (PB-miRNA1, PB-miRNA2, PB-MYC/FOXR2, and
  PB-RB1) represented under has_subtypes rather than split into separate
  disorder entries. No dedicated pineoblastoma disease-level assertion is
  present in the ClinGen gene-disease validity snapshot (2026-10-20; germline
  RB1 and DICER1 assertions in ClinGen are scoped to retinoblastoma and
  DICER1-related tumor predisposition rather than MONDO:0016722), and no
  dedicated GeneReviews or StatPearls chapter for pineoblastoma is present in
  the NCBI Bookshelf index snapshot (2026-09-10) after matching across MONDO
  exact synonyms.

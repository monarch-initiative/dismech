  title: DNA methylation analysis of pineoblastoma
  description: Pineoblastoma is a rare and aggressive embryonal tumor of childhood. The molecular heterogeneity within has not been systematically evaluated. In this study, we used methylation profiling to compare the signatures of pineoblastoma and other pineal parenchymal tumors to a reference cohort of brain tumor entities (GSE90496) , clinically relevant epigenomic subgroups with characteristics genomic/transcriptomic features are described.

name: Light Chain Deposition Disease
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Light chain deposition disease is a monoclonal gammopathy of renal
  significance in which a small plasma cell clone, usually well below the
  threshold that would prompt myeloma treatment, secretes a free immunoglobulin
  light chain that deposits along basement membranes and destroys the kidney. The
  deposits are granular, powdery, and Congo red negative: they are not amyloid,
  and that distinction is the organising fact of the entry rather than a
  histological footnote.

  What makes the disease mechanistically interesting is that the light chain is
  not merely insoluble. It is a signalling molecule. Light chains from patients
  with light chain deposition disease are not taken up by mesangial cells at all;
  they act at the cell surface, driving the mesangial cell to transform toward a
  myofibroblast phenotype and to pour out extracellular matrix under TGF-beta
  control. At the same time matrix degradation falls, so the mesangium is caught
  in a vice with the tap opened and the drain plugged, and the glomerulus silts up
  into the nodular sclerosis that defines the biopsy.

  The contrast with AL amyloidosis is exact and inverted, which is why this entry
  does not conform to the amyloidogenesis module. Amyloidogenic light chains ARE
  endocytosed by the same cell, delivered to the lysosome, and converted to
  fibrils there, while stimulating matrix degradation. Same cell type, same class
  of ligand, opposite intracellular itinerary and opposite effect on matrix: AL
  hollows the mesangium out, this disease makes it build.

  Therapy follows the clone rather than the kidney. Nothing removes deposits
  directly; treatment works by shutting off production of the pathogenic light
  chain and letting tissue partially remodel. Proteasome inhibition is the
  backbone and has an unusually direct mechanistic rationale, since the pathogenic
  light chain places its own plasma cell under endoplasmic reticulum stress, and a
  clone already straining its quality-control machinery is disproportionately
  vulnerable to having that machinery blocked.
category: Acquired
disease_term:
  preferred_term: Light Chain Deposition Disease
  term:
    id: MONDO:0019730
    label: light chain deposition disease
synonyms:
- LCDD
- Randall-type monoclonal immunoglobulin deposition disease
notes: >-
  Module conformance was considered and deliberately declined for
  `amyloidogenesis`, which is the module this disease superficially resembles
  most. Both involve a monoclonal light chain falling out of solution in tissue,
  but the mechanisms are opposites at the decisive step. The amyloidogenesis
  module is built around protein misfolding into beta-sheet oligomers and
  formation of extracellular fibrils; the deposits here are non-fibrillar,
  granular, and Congo red negative, and MONDO itself classifies the disease under
  non-amyloid monoclonal immunoglobulin deposition disease. Declaring conformance
  would assert fibril formation that does not occur. The mirror-image evidence is
  curated on the mesangial node rather than left as prose.

  The fibrotic arm is closer to `fibrotic_response` and shares its logic of
  mesenchymal activation driving excessive matrix, but conformance is not declared
  here either, because the module's chain runs through inflammatory recruitment
  and the mechanism in this disease runs from direct receptor-level signalling by
  the light chain to mesangial phenotype transformation without an inflammatory
  intermediate. The resemblance is recorded here rather than asserted as a link.

  Highest-risk mis-annotation, flagged and avoided: HP:0001917 Renal amyloidosis.
  Binding any amyloid term to this disease would encode precisely the error the
  diagnostic literature exists to prevent. Similarly, MONDO carries "Bence Jones
  myeloma" and "Light chain disease" as synonyms of this concept; both are loose,
  both pull in myeloma and AL amyloidosis literature, and neither is adopted as a
  synonym here.

  Two evidence cautions carried from the source report. The daratumumab study
  pooled AL amyloidosis and this disease in one cohort, so its response figures
  are not disease-specific and are curated as PARTIAL with that stated. And
  several claims about direct renal effects of bortezomib and about transplant
  recurrence rates come from review full text rather than any abstract; where used
  they are quoted from a cached full-text record, and where not available they are
  described without being cited.
pathophysiology:
- name: Clonal Plasma Cell Secretion of Free Light Chain
  biological_scale: CELLULAR
  description: >-
    A plasma cell clone, typically small and often below the burden that would
    define myeloma, secretes free immunoglobulin light chain in excess. The clone
    size is characteristically modest relative to the damage it does, which is the
    defining feature of monoclonal gammopathy of renal significance: the lesion is
    not the tumour burden but the physical properties of the protein.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  evidence:
  - reference: PMID:32559766
    reference_title: "Immunoglobulin light-chain toxicity in a mouse model of monoclonal immunoglobulin light-chain deposition disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our mouse model recapitulates the characteristic features of LCDD, including progressive glomerulosclerosis, nephrotic-range proteinuria, and finally kidney failure."
    explanation: >-
      The transgenic model demonstrates that plasma-cell secretion of the
      pathogenic light chain is sufficient to reproduce the disease, which is the
      claim this node carries.
  downstream:
  - target: Pathogenic Light Chain Variable Domain
    causal_link_type: DIRECT
    description: >-
      The secreted product carries the structural abnormality that makes it
      pathogenic.
  - target: Plasma Cell Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: >-
      Producing an awkwardly folding protein at high rate imposes a burden on the
      clone's own quality-control machinery.
- name: Pathogenic Light Chain Variable Domain
  biological_scale: MOLECULAR
  description: >-
    The variable domain carries hydrophobic substitutions in its complementarity
    determining regions, sometimes an N-glycan, and a high isoelectric point. The
    positive charge is thought to drive deposition by complementarity with
    polyanionic basement membrane. This node, and not the clone, is the actual
    etiologic agent of the disease: the variable domain alone is sufficient to
    confer pathogenicity.
  evidence:
  - reference: PMID:32559766
    reference_title: "Immunoglobulin light-chain toxicity in a mouse model of monoclonal immunoglobulin light-chain deposition disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The variable domain of the LC bears alone the structural properties involved in its pathogenicity."
    explanation: >-
      States that pathogenicity resides in the variable domain by itself, which is
      why this node sits between the clone and every downstream consequence.
  downstream:
  - target: Non-Fibrillar Basement Membrane Deposition
    causal_link_type: DIRECT
    description: >-
      The physical deposition step, driven by the domain's charge and hydrophobic
      character.
  - target: Mesangial Cell Surface Engagement and Phenotype Transformation
    causal_link_type: DIRECT
    description: >-
      Separately from depositing, the light chain acts as a ligand at the mesangial
      cell surface. Deposition and signalling are distinct consequences of the same
      molecule, which is why they are separate downstream edges rather than a
      chain.
- name: Plasma Cell Endoplasmic Reticulum Stress
  biological_scale: CELLULAR
  description: >-
    Producing a structurally awkward light chain at high output places the plasma
    cell clone under endoplasmic reticulum stress. This node exists because it is
    the therapeutic vulnerability of the disease rather than a step toward kidney
    injury: the clone has backed itself into a corner by making a protein its own
    folding machinery struggles with, and blocking the proteasome tips it over.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:32559766
    reference_title: "Immunoglobulin light-chain toxicity in a mouse model of monoclonal immunoglobulin light-chain deposition disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNA sequencing conducted on PCs demonstrated that LCDD LC induces endoplasmic reticulum stress, likely accounting for the high efficiency of proteasome inhibitor-based therapy."
    explanation: >-
      Establishes the endoplasmic reticulum stress and, in the authors' own
      words, connects it to why proteasome inhibition works so well in this
      disease.
- name: Non-Fibrillar Basement Membrane Deposition
  biological_scale: TISSUE
  description: >-
    Linear and granular deposits of monoclonal light chain along glomerular and
    tubular basement membranes. They are Congo red negative and non-fibrillar,
    described as powdery on electron microscopy. This is the histological
    definition of the disease and the single most important thing distinguishing
    it from AL amyloidosis at the bench.
  evidence:
  - reference: PMID:39196376
    reference_title: "Light chain deposition disease: pathogenesis, clinical characteristics and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light chain deposition disease (LCDD) is a rare hematologic disorder characterized by the deposition of non-amyloid monoclonal light chains in several organs."
    explanation: >-
      States the non-amyloid character of the deposits, which is the property that
      defines this node and the reason the amyloidogenesis module is not declared.
  downstream:
  - target: Nodular Glomerulosclerosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deposition contributes to the sclerotic lesion, but the bulk of the matrix is
      made by mesangial cells responding to the light chain rather than being the
      deposited light chain itself.
- name: Mesangial Cell Surface Engagement and Phenotype Transformation
  biological_scale: CELLULAR
  description: >-
    The decisive mechanistic node, and the point at which this disease and AL
    amyloidosis part company. Light chains from patients with light chain
    deposition disease are NOT endocytosed by mesangial cells; they act at the cell
    surface, and the interaction drives apoptosis, transformation of the mesangial
    cell toward a myofibroblast phenotype, and secretion of matrix components and
    metalloproteinases. Amyloidogenic light chains from the same cell type do the
    opposite: they are avidly taken up and delivered to the lysosome, where fibrils
    form. Same cell, same class of ligand, opposite itinerary.
  cell_types:
  - preferred_term: mesangial cell
    term:
      id: CL:0000650
      label: mesangial cell
  - preferred_term: myofibroblast phenotype acquired by the mesangial cell
    term:
      id: CL:0000186
      label: myofibroblast cell
  evidence:
  - reference: PMID:33163710
    reference_title: "Understanding Mesangial Pathobiology in AL-Amyloidosis and Monoclonal Ig Light Chain Deposition Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Light chains from patients with LCDD exert their pathogenic signaling effect at the cell surface of mesangial cells."
    explanation: >-
      States the surface-signalling mechanism, which is what makes the light chain
      a ligand rather than merely a precipitate.
  - reference: PMID:33163710
    reference_title: "Understanding Mesangial Pathobiology in AL-Amyloidosis and Monoclonal Ig Light Chain Deposition Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Monoclonal light chains associated with AL-Am but not those producing LCDD are avidly endocytosed by mesangial cells and delivered to the mature lysosomal compartment where amyloid fibrils are formed."
    explanation: >-
      The explicit contrast with amyloidogenic light chains in the same cell type.
      Curated here because it is the direct evidence that this disease does not
      proceed by the amyloid mechanism, and therefore the basis for declining
      conformance to the amyloidogenesis module.
  - reference: PMID:33163710
    reference_title: "Understanding Mesangial Pathobiology in AL-Amyloidosis and Monoclonal Ig Light Chain Deposition Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which include apoptosis, phenotype transformation, and secretion of extracellular matrix components and metalloproteinases"
    explanation: >-
      Enumerates the cellular consequences of the surface interaction, including the
      phenotype transformation this node is named for.
  downstream:
  - target: TGF-beta Driven Matrix Overproduction
    causal_link_type: DIRECT
    description: >-
      The transformed mesangial cell increases matrix output under TGF-beta
      control.
  - target: Failure of Matrix Degradation
    causal_link_type: DIRECT
    description: >-
      The same interaction reduces matrix-degrading activity, which is the second
      half of the imbalance.
- name: TGF-beta Driven Matrix Overproduction
  biological_scale: TISSUE
  description: >-
    Mesangial cells exposed to glomerulopathic light chains increase production of
    type IV collagen, laminin, and fibronectin, with TGF-beta production and
    activity rising in parallel. The causal role of TGF-beta is established rather
    than inferred, because blocking it with antibody abolishes the effect.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:7639331
    reference_title: "Pathogenesis of glomerulosclerosis in light chain deposition disease. Role for transforming growth factor-beta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "transforming growth factor-beta (TGF-beta) production and activity increased when mesangial cells were exposed to these proteins"
    explanation: >-
      Establishes that the light chains raise TGF-beta production and activity in
      mesangial cells.
  - reference: PMID:7639331
    reference_title: "Pathogenesis of glomerulosclerosis in light chain deposition disease. Role for transforming growth factor-beta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "anti-TGF-beta antibody abolished the inhibition of cell proliferation and the increase of extracellular matrix protein production caused by these light chains"
    explanation: >-
      The blocking experiment, which converts the TGF-beta association into a
      causal claim: remove the cytokine and the phenotype disappears.
  - reference: PMID:7639331
    reference_title: "Pathogenesis of glomerulosclerosis in light chain deposition disease. Role for transforming growth factor-beta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings were not observed in mesangial cells exposed to human albumin and two other light chains previously characterized to be tubulopathic."
    explanation: >-
      The specificity control, and mechanistically important beyond
      methodology: glomerulopathic and tubulopathic light chains are distinct
      populations, which is why a similar clone in another patient produces cast
      nephropathy or Fanconi syndrome instead of this disease.
  downstream:
  - target: Nodular Glomerulosclerosis
    causal_link_type: DIRECT
    description: >-
      Sustained matrix overproduction expands the mesangium into nodules.
- name: Failure of Matrix Degradation
  biological_scale: CELLULAR
  description: >-
    The other half of the imbalance, and the reason the glomerulus fills so
    quickly. Alongside increased matrix production, collagenase activity falls, so
    matrix that would normally be turned over accumulates. The mirror image in AL
    amyloidosis is exact: there, matrix production falls and collagenase activity
    rises, degrading matrix and facilitating amyloid deposition instead.
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: DECREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  evidence:
  - reference: PMID:10369104
    reference_title: "Glomerulopathic light chain-mesangial cell interactions modulate in vitro extracellular matrix remodeling and reproduce mesangiopathic findings documented in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A concomitant decrease in collagenase IV activity further accentuates the accumulation of mesangial matrix."
    explanation: >-
      States the fall in matrix-degrading activity that accompanies increased
      production.
  - reference: PMID:10369104
    reference_title: "Glomerulopathic light chain-mesangial cell interactions modulate in vitro extracellular matrix remodeling and reproduce mesangiopathic findings documented in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a decrease in ECM protein production and a stimulatory effect on collagenase IV is observed, which results in matrix degradation and facilitates amyloid deposition"
    explanation: >-
      The mirror-image result for amyloidogenic light chains in the same
      experimental system. Curated as further evidence that the two diseases are
      mechanistically opposite at the mesangial cell rather than variants of one
      process.
  downstream:
  - target: Nodular Glomerulosclerosis
    causal_link_type: DIRECT
    description: >-
      Reduced turnover compounds increased production.
- name: Nodular Glomerulosclerosis
  biological_scale: TISSUE
  description: >-
    Nodular expansion of the mesangium, the characteristic light-microscopic
    lesion. It is a mesangial product rather than a pile of deposited light chain:
    the bulk of the nodule is matrix the mesangial cell was induced to make.
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nodular mesangial sclerosis was seen in 39 patients (61%)"
    explanation: >-
      The sentence that actually supports this node: nodular mesangial sclerosis in
      61 per cent of the series. The transplant-recurrence sentence previously
      quoted here supported the transplant discussion, not the histological lesion,
      and has been moved to where it belongs.
  downstream:
  - target: Proteinuria
    causal_link_type: DIRECT
    description: >-
      Glomerular architectural destruction produces protein loss.
  - target: Chronic kidney disease
    causal_link_type: DIRECT
    description: >-
      Progressive nephron loss follows the sclerotic process.
phenotypes:
- name: Proteinuria
  category: Renal
  description: >-
    Protein loss, frequently in the nephrotic range, and usually the presenting
    abnormality alongside a rising creatinine.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  evidence:
  - reference: PMID:32559766
    reference_title: "Immunoglobulin light-chain toxicity in a mouse model of monoclonal immunoglobulin light-chain deposition disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our mouse model recapitulates the characteristic features of LCDD, including progressive glomerulosclerosis, nephrotic-range proteinuria, and finally kidney failure."
    explanation: >-
      Names nephrotic-range proteinuria among the characteristic features of the
      disease being modelled. Tagged MODEL_ORGANISM because the sentence describes
      the mouse.
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation included renal insufficiency, proteinuria, hematuria, and hypertension"
    explanation: >-
      Human clinical evidence for proteinuria at presentation, so this phenotype no
      longer rests on model-organism evidence alone.
- name: Chronic kidney disease
  category: Renal
  description: >-
    Progressive loss of renal function, frequently to end-stage disease. The
    kidney is always involved in this disease, which is what separates it from
    other monoclonal gammopathies of renal significance in presentation.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "22 (39%) progressed to ESRD"
    explanation: >-
      Direct quantification of progression to end-stage renal disease, replacing the
      inferential support this phenotype previously relied on.
- name: Extrarenal organ involvement
  category: Systemic
  description: >-
    Although the kidney is always involved and dominates the presentation, roughly a
    third of patients have symptomatic disease elsewhere, most often hepatic and
    cardiac. This matters clinically because a patient whose renal disease is
    controlled may still be losing an organ that nobody is monitoring, and it
    matters mechanistically because deposition is a property of the circulating
    light chain rather than of the kidney.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Abnormal liver or cardiac involvement by light chain deposition
    term:
      id: HP:0001392
      label: Abnormality of the liver
  evidence:
  - reference: PMID:30578255
    reference_title: "Randall-type monoclonal immunoglobulin deposition disease: novel insights from a nationwide cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "35% of whom had symptomatic extrarenal (mostly hepatic and cardiac) involvement"
    explanation: >-
      Quantifies symptomatic extrarenal involvement at 35 per cent and names the
      organs most often affected. The FREQUENT band covers 30 to 79 per cent.
- name: Renal insufficiency
  category: Renal
  description: >-
    Impaired renal function at presentation, the most common presenting
    abnormality. The kidney is involved in essentially every case, which is what
    brings these patients to attention at all given how small the underlying clone
    usually is.
  phenotype_term:
    preferred_term: Renal insufficiency
    term:
      id: HP:0000083
      label: Renal insufficiency
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation included renal insufficiency, proteinuria, hematuria, and hypertension"
    explanation: >-
      Names renal insufficiency first among the presenting features of the series.
- name: Hypertension
  category: Cardiovascular
  description: >-
    Raised blood pressure at presentation, part of the presenting renal syndrome
    rather than an independent comorbidity.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation included renal insufficiency, proteinuria, hematuria, and hypertension"
    explanation: >-
      Names hypertension among the presenting features of the series.
- name: Hematuria
  category: Renal
  description: >-
    Blood in the urine at presentation. Worth recording because it is not what a
    purely deposition-driven glomerulopathy would obviously predict, and it forms
    part of the nephritic-flavoured presentation that can misdirect toward a
    glomerulonephritis.
  phenotype_term:

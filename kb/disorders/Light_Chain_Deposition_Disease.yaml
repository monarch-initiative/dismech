    term:
      id: HP:0000790
      label: Hematuria
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation included renal insufficiency, proteinuria, hematuria, and hypertension"
    explanation: >-
      Names hematuria among the presenting features of the series.
genetic:
- name: Somatically rearranged immunoglobulin light chain variable gene
  relationship_type: SOMATIC_DRIVER
  notes: >-
    This is an acquired clonal disease, not an inherited one, and no germline
    predisposition gene is established. The driver is somatic: the rearranged and
    hypermutated immunoglobulin light-chain variable gene of the plasma cell clone
    encodes the protein that is itself the pathogenic agent. The literature records
    biased usage of particular V-kappa germline subgroups by these clones, and
    kappa light chains predominate over lambda, the reverse of AL amyloidosis. No
    gene descriptor is bound here because the association is with subgroup usage in
    a somatic rearrangement rather than with any variant in the patient's germline,
    and because the pathogenic property lies in the expressed variable domain
    rather than in the germline segment it derives from. Recorded as SOMATIC_DRIVER
    rather than CAUSATIVE for that reason.
  evidence:
  - reference: PMID:32559766
    reference_title: "Immunoglobulin light-chain toxicity in a mouse model of monoclonal immunoglobulin light-chain deposition disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The variable domain of the LC bears alone the structural properties involved in its pathogenicity."
    explanation: >-
      Locates pathogenicity in the expressed variable domain, which is why this
      record describes a somatic rearrangement rather than binding a germline gene
      descriptor.
  - reference: PMID:11423577
    reference_title: "Renal monoclonal immunoglobulin deposition disease: the disease spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the composition of deposits included 11kappa/1lambda (LCDD)"
    explanation: >-
      Supports the kappa predominance recorded in the notes above, which is the
      reverse of the lambda predominance seen in AL amyloidosis and is one of the
      simplest discriminators between them.
biochemical:
- name: Serum free light chain ratio
  notes: >-
    The defining laboratory abnormality and the practical entry point to the
    diagnosis. An abnormal ratio between involved and uninvolved free light chains
    reflects the monoclonal clone, was abnormal in every patient tested in the
    largest single-institution series, and is also the measure by which
    haematologic response to treatment is judged. Its sensitivity is what makes it
    reasonable to look for this disease in a patient with unexplained renal
    impairment.
  presence: INCREASED
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum free light chain ratio was abnormal in all 51 patients tested"
    explanation: >-
      Abnormal in every patient in whom it was measured, which is the basis for
      treating it as the defining laboratory abnormality of the disease.
histopathology:
- name: Congo red negative granular basement membrane deposits
  description: >-
    The histological finding on which the whole entry turns. Monotypic light chain
    is demonstrated along glomerular and tubular basement membranes by
    immunofluorescence, and the deposits are granular and powdery on electron
    microscopy rather than fibrillar, and negative on Congo red staining. That
    negativity is not a technicality: it is what separates this disease from AL
    amyloidosis, which deposits the same class of protein in the same organ by an
    opposite cellular route.
  diagnostic: true
  evidence:
  - reference: PMID:39196376
    reference_title: "Light chain deposition disease: pathogenesis, clinical characteristics and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light chain deposition disease (LCDD) is a rare hematologic disorder characterized by the deposition of non-amyloid monoclonal light chains in several organs."
    explanation: >-
      States the non-amyloid character of the deposits, which is what Congo red
      negativity demonstrates at the bench and the reason amyloidogenesis
      conformance is declined in this entry.
- name: Nodular mesangial sclerosis
  description: >-
    Nodular expansion of the mesangium on light microscopy, present in the majority
    of biopsies. The nodules are largely matrix that the mesangial cell was induced
    to make rather than deposited light chain, which is why the lesion is
    disproportionate to the amount of protein visible by immunofluorescence.
  diagnostic: true
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nodular mesangial sclerosis was seen in 39 patients (61%)"
    explanation: >-
      Quantifies the nodular lesion in the largest single-institution series.
diagnosis:
- name: Serum free light chain measurement with renal biopsy
  description: >-
    The diagnostic spine. An abnormal free light chain ratio identifies the clone,
    and renal biopsy with immunofluorescence and electron microscopy identifies the
    lesion and distinguishes it from the alternatives. Neither alone is sufficient:
    a monoclonal gammopathy is common in older people and does not by itself
    explain renal impairment, while the biopsy appearance without demonstration of
    monotypic light chain does not distinguish this from diabetic nodular
    glomerulosclerosis.
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum free light chain ratio was abnormal in all 51 patients tested"
    explanation: >-
      The sensitivity of the free light chain ratio in this series is what makes it
      the appropriate screening arm of the diagnostic pair.
- name: Congo red staining to exclude amyloidosis
  description: >-
    Not an optional refinement but the step that assigns the diagnosis. Congo red
    negativity in the presence of monotypic light chain deposits establishes this
    disease rather than AL amyloidosis, and the two have different natural
    histories, different organ risks, and different mesangial mechanisms despite
    arising from the same class of protein.
  evidence:
  - reference: PMID:33163710
    reference_title: "Understanding Mesangial Pathobiology in AL-Amyloidosis and Monoclonal Ig Light Chain Deposition Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Monoclonal light chains associated with AL-Am but not those producing LCDD are avidly endocytosed by mesangial cells and delivered to the mature lysosomal compartment where amyloid fibrils are formed."
    explanation: >-
      The mechanistic reason the distinction matters: the two diseases differ in
      whether the light chain enters the cell at all, so a stain that separates them
      is separating two different pathologies rather than two appearances.
treatments:
- name: Bortezomib-Based Proteasome Inhibitor Therapy
  description: >-
    The treatment backbone, usually bortezomib with dexamethasone and often
    cyclophosphamide. It works by eliminating the clone rather than by touching
    the kidney, and it has an unusually direct mechanistic rationale for a
    cytotoxic regimen: the pathogenic light chain already places its own plasma
    cell under endoplasmic reticulum stress, so a clone straining its
    quality-control machinery is disproportionately vulnerable to blocking the
    proteasome. Renal response follows haematologic response, and benefit is
    greatest when treatment starts early, before sclerosis is fixed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bortezomib
      term:
        id: CHEBI:52717
        label: bortezomib
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
  target_mechanisms:
  - target: Plasma Cell Endoplasmic Reticulum Stress
    treatment_effect: INHIBITS
    description: >-
      Blocks proteasomal disposal of misfolded protein in a clone already under
      endoplasmic reticulum stress from its own product, which is why the effect is
      selective for the pathogenic clone rather than generally cytotoxic.
    evidence:
    - reference: PMID:32559766
      reference_title: "Immunoglobulin light-chain toxicity in a mouse model of monoclonal immunoglobulin light-chain deposition disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNA sequencing conducted on PCs demonstrated that LCDD LC induces endoplasmic reticulum stress, likely accounting for the high efficiency of proteasome inhibitor-based therapy."
      explanation: >-
        The authors connect the endoplasmic reticulum stress directly to the
        efficacy of proteasome inhibition, which is the rationale this link
        asserts.
  evidence:
  - reference: PMID:26176826
    reference_title: "Bortezomib produces high hematological response rates with prolonged renal survival in monoclonal immunoglobulin deposition disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bortezomib-based therapy is a promising treatment strategy in MIDD, mainly when used early in the disease course"
    explanation: >-
      The authors' own summary, including the timing qualifier. Note they write
      "promising" rather than established, and the series is retrospective.
- name: Autologous Stem Cell Transplantation
  description: >-
    High-dose therapy with autologous stem cell rescue for eligible patients.
    Deeper haematologic responses are achieved than with non-transplant, non
    proteasome-inhibitor approaches, though transplantation and proteasome
    inhibition are reported together in that comparison rather than against each
    other.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Plasma Cell Secretion of Free Light Chain
    treatment_effect: INHIBITS
    description: >-
      Eliminates the clone and therefore the supply of pathogenic light chain,
      which is the only route by which any current therapy helps the kidney.
    evidence:
    - reference: PMID:27501122
      reference_title: "Outcomes of patients with renal monoclonal immunoglobulin deposition disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients receiving ASCT or PI-based therapies were more likely to achieve at least a hematologic CR/VGPR compared to those receiving other therapies"
      explanation: >-
        Establishes superior haematologic response for these approaches, which is
        the intermediate outcome that determines renal outcome.
  evidence:
  - reference: PMID:27501122
    reference_title: "Outcomes of patients with renal monoclonal immunoglobulin deposition disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients receiving ASCT or PI-based therapies were more likely to achieve at least a hematologic CR/VGPR compared to those receiving other therapies"
    explanation: >-
      PARTIAL because the comparison groups transplantation together with
      proteasome-inhibitor therapy against everything else, so it cannot separate
      the contribution of transplantation itself, and because the endpoint is
      haematologic rather than renal.
- name: Kidney Transplantation
  description: >-
    Offered for end-stage renal disease, and genuinely contested. Series report
    recurrence in the graft in a majority of recipients, while another series
    reports no recurrence up to nearly ten years in patients whose clone was in
    sustained remission at the time of transplant. The two are reconcilable, and
    the discriminator appears to be haematologic remission status rather than
    transplantation itself; that reconciliation is curated as a discussion rather
    than resolved by picking a side.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:22156754
    reference_title: "Renal monoclonal immunoglobulin deposition disease: a report of 64 patients from a single institution."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease recurred in three of four patients who received a kidney transplant."
    explanation: >-
      Refutes transplantation as safe in the unselected case: three of four grafts
      were affected by recurrent disease.
  - reference: PMID:26392598
    reference_title: "Natural history and outcome of light chain deposition disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "among those whose underlying clonal disorder was in sustained remission, there was no recurrence of LCDD up to 9.7 years later"
    explanation: >-
      Supports transplantation in the specific circumstance of sustained clonal
      remission. PARTIAL rather than SUPPORT because the favourable outcome is
      conditional on remission status and the numbers are small.
- name: Daratumumab
  description: >-
    Anti-CD38 monoclonal antibody, used as consolidation after conventional therapy
    in patients who have not reached a complete haematologic response. The evidence
    that touches this disease is thin and indirect.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: daratumumab
      term:
        id: NCIT:C74007
        label: Daratumumab
  target_mechanisms:
  - target: Clonal Plasma Cell Secretion of Free Light Chain
    treatment_effect: INHIBITS
    description: >-
      Targets CD38 on the plasma cell clone, reducing production of the pathogenic
      light chain. Like every other effective therapy here it acts on the clone
      rather than on the deposits.
    evidence:
    - reference: PMID:34468250
      reference_title: "Consolidation with a short course of daratumumab in patients with AL amyloidosis or light chain deposition disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We used as a consolidation a short course of daratumumab in 25 patients with AL amyloidosis or light chain deposition disease (LCDD), who had not achieved a haematologic complete response (hemCR) after standard therapy with bortezomib, cyclophosphamide and dexamethasone (VCD)"
      explanation: >-
        PARTIAL because the cohort pools two diseases, so the effect on this one
        cannot be isolated, and because the endpoint is haematologic response rather
        than a renal outcome.
  evidence:
  - reference: PMID:34468250
    reference_title: "Consolidation with a short course of daratumumab in patients with AL amyloidosis or light chain deposition disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We used as a consolidation a short course of daratumumab in 25 patients with AL amyloidosis or light chain deposition disease (LCDD), who had not achieved a haematologic complete response (hemCR) after standard therapy with bortezomib, cyclophosphamide and dexamethasone (VCD)"
    explanation: >-
      Establishes the setting in which the agent was used. PARTIAL, and deliberately
      quoted at the sentence that names the POOLED cohort rather than at the
      response figures, because those figures cover AL amyloidosis and this disease
      together and cannot be attributed to either alone.
  notes: >-
    The supporting study pooled patients with AL amyloidosis and with this disease
    into one cohort and reported response rates for the combined group. Those
    figures are therefore not disease-specific and are not curated as such, and no
    dedicated trial of daratumumab in light chain deposition disease exists. The
    treatment is recorded because it is used, not because its benefit here is
    established.
discussions:
- discussion_id: lcdd_transplant_recurrence
  prompt: >-
    Is kidney transplantation appropriate in light chain deposition disease, and
    does recurrence in the graft depend on transplantation itself or on the state
    of the plasma cell clone at the time of transplant?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Clonal Plasma Cell Secretion of Free Light Chain
  - treatments#Kidney Transplantation
  rationale: >-
    The literature contains two apparently opposed findings. One series reports
    recurrence in three of four grafts, and a recent review concludes that renal
    allograft is not recommended because of the high incidence of relapse. Another
    series reports no recurrence up to nearly ten years, but only among patients
    whose clonal disorder was in sustained remission when they were transplanted.
    Read together these are not contradictory: the graft fails when the clone is
    still producing pathogenic light chain, because nothing about transplantation
    addresses the source of the protein. The apparent controversy about the
    procedure is better understood as a question about patient selection, and the
    proposed resolution is that haematologic remission status is the discriminator.
    It is recorded as open rather than resolved because no study has tested that
    reconciliation prospectively.
  evidence:
  - reference: PMID:26915878
    reference_title: "Light Chain Deposition Disease After Kidney Transplantation With Long Graft Survival: Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "they have experienced a prolonged period of stable renal function with no clinically detectable disease"
    explanation: >-
      Case-level support for the proposed reconciliation: grafts can be held long
      term when the clone is controlled. PARTIAL because it is a small number of
      cases and cannot by itself establish that remission status is the
      discriminator rather than one correlate of it.
  proposed_experiments:
  - experiment_id: lcdd_transplant_by_remission_status
    name: Graft outcome stratified by pre-transplant haematologic response depth
    description: >-
      Assemble a multicentre cohort of transplant recipients with this disease,
      stratified by depth and duration of haematologic response at the time of
      transplantation and by serial free light chain measurement afterwards, with
      graft recurrence as the endpoint. If the reconciliation is right, recurrence
      should track residual clonal activity rather than time since transplant.
- discussion_id: lcdd_glomerulopathic_vs_tubulopathic
  prompt: >-
    What structural features determine whether a monoclonal light chain becomes
    glomerulopathic and causes this disease, rather than tubulopathic and causing
    cast nephropathy or Fanconi syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pathogenic Light Chain Variable Domain
  rationale: >-
    The distinction is real and experimentally demonstrated rather than
    hypothetical: light chains previously characterised as tubulopathic do not
    produce the mesangial matrix response that glomerulopathic light chains do, in
    the same assay. Something in the variable domain sorts one destination from the
    other. Candidate determinants include isoelectric point, complementarity
    determining region hydrophobicity, glycosylation, and germline gene subgroup
    usage, but no rule predicts destination from sequence. This matters clinically
    because two patients with similar small clones can develop entirely different
    kidney diseases requiring different management, and there is currently no way
    to tell in advance which.
  proposed_experiments:
  - experiment_id: lcdd_lc_sequence_destination_map
    name: Sequence-to-destination mapping of pathogenic light chains
    description: >-
      Sequence the pathogenic light chain variable domain from a large series of
      patients with clinically and histologically classified renal lesions, and
      test whether isoelectric point, CDR hydrophobicity, glycosylation site
      presence, and germline subgroup predict glomerular versus tubular
      destination. Validate candidate determinants by expressing selected variants
      in the mesangial-cell assay in which the original distinction was drawn.
differential_diagnoses:
- name: AL amyloidosis
  description: >-
    The critical differential, and mechanistically the exact inverse. Both are
    caused by a monoclonal light chain deposited in tissue, but amyloidogenic light
    chains are endocytosed by mesangial cells and converted to fibrils in the
    lysosome while stimulating matrix degradation, whereas the light chains of this
    disease act at the cell surface without entering and drive matrix
    accumulation. Distinguished definitively at the bench: amyloid is Congo red
    positive and fibrillar, these deposits are Congo red negative and granular.
    Lambda light chains predominate in AL amyloidosis, kappa in this disease.
  evidence:
  - reference: PMID:33163710
    reference_title: "Understanding Mesangial Pathobiology in AL-Amyloidosis and Monoclonal Ig Light Chain Deposition Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Monoclonal light chains associated with AL-Am but not those producing LCDD are avidly endocytosed by mesangial cells and delivered to the mature lysosomal compartment where amyloid fibrils are formed."
    explanation: >-
      The experimental basis for treating these as mechanistically distinct
      diseases rather than variants of a single deposition process.
- name: Cast nephropathy and light chain Fanconi syndrome
  description: >-
    Other renal consequences of a monoclonal light chain, produced by tubulopathic
    rather than glomerulopathic light chains. The same clone size and the same
    class of protein produce a different disease depending on properties of the
    variable domain, which is why the distinction is curated as an open question
    rather than an incidental classification.
- name: Diabetic nodular glomerulosclerosis
  description: >-
    The main light-microscopic mimic, since nodular mesangial expansion looks
    similar. Distinguished by immunofluorescence showing monotypic light chain
    along basement membranes, which is absent in diabetic nephropathy, and by the
    clinical context.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. The disease is defined by renal
    biopsy in patients with a monoclonal gammopathy, so ascertainment depends
    heavily on biopsy practice and on whether small clones are investigated at all.
    The largest assembled series is a nationwide cohort of 255 patients with
    monoclonal immunoglobulin deposition disease, of whom 212 had this disease.
    Kappa light chains predominate over lambda, the reverse of AL amyloidosis.
  evidence:
  - reference: PMID:30578255
    reference_title: "Randall-type monoclonal immunoglobulin deposition disease: novel insights from a nationwide cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We retrospectively studied a nationwide cohort of 255 patients, with biopsy-proven LCDD (n = 212)"
    explanation: >-
      Gives the size of the largest assembled series and the number with this
      specific disease, which is what this record cites it for. It is not a
      population rate and is not presented as one.

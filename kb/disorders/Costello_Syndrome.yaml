  downstream:
  - target: Intellectual Disability
    description: Abnormal cortical development and neuroglial imbalance contribute to persistent cognitive impairment.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered cortical neuron production
    - abnormal neurogenesis-to-gliogenesis balance
  evidence:
  - reference: PMID:31250618
    reference_title: "Neurodevelopmental Aspects of RASopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Induced pluripotent stem cells (iPSCs) derived from Costello syndrome
      showed increased production of cortical neurons associated with extended
      progenitor phase (Rooney et al., 2016).
    explanation: >-
      This review cites disease-relevant iPSC evidence that Costello syndrome
      disrupts early cortical developmental programs.
  - reference: PMID:31250618
    reference_title: "Neurodevelopmental Aspects of RASopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During transition from neurogenesis to gliogenesis, Paquin et al. (2009)
      showed that variants found in Costello syndrome suppress neurogenesis but
      promote astrogenesis.
    explanation: >-
      This supports a second discrete developmental mechanism involving an
      abnormal neurogenesis-gliogenesis switch in Costello syndrome.
- name: Tumor Predisposition
  description: >
    The same activating HRAS signaling architecture that causes developmental
    disease also creates susceptibility to malignant neoplasms: rhabdomyosarcoma
    and neuroblastoma in young children and transitional cell carcinoma of the
    bladder in adolescents and young adults. A 2023 systematic review of
    published cases estimated a cumulative incidence of cancer of 13% by age 20
    years, and the AACR consensus update published in 2024 attributes this risk
    predominantly to these three tumors. In the same review, carriers of the
    common HRAS p.Gly12Ser variant had a lower combined rate of cancer and death
    than carriers of all other variants combined.
  biological_processes:
  - preferred_term: regulation of cell cycle
    modifier: DYSREGULATED
    term:
      id: GO:0051726
      label: regulation of cell cycle
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Rhabdomyosarcoma
    description: Germline HRAS-driven tumor predisposition manifests as rhabdomyosarcoma in young children.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39196581
      reference_title: "Update on Pediatric Cancer Surveillance Recommendations for Patients with Neurofibromatosis Type 1, Noonan Syndrome, CBL Syndrome, Costello Syndrome, and Related RASopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "CS has an estimated 13% risk (95% CI: 9-16) of malignancy by age 20 years(3). This is predominantly due to an increased risk for RMS, NB, and transitional cell carcinoma of the bladder (TCC)."
      explanation: >-
        The consensus update states that the 13% risk of malignancy by age 20
        years in Costello syndrome (CS) is predominantly due to an increased
        risk of rhabdomyosarcoma (RMS), neuroblastoma (NB) and transitional cell
        carcinoma of the bladder (TCC), so rhabdomyosarcoma is one of the three
        tumors through which the predisposition shows. The 13% covers all
        cancers combined, not rhabdomyosarcoma alone, and the sentences are the
        update's summary of published patient data rather than a result of its
        own.
    - reference: PMID:36966234
      reference_title: "Cancer in Costello syndrome: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Statistically significant SIRs were found for rhabdomyosarcoma (SIR = 1240), bladder (SIR = 1971), and neuroblastoma (SIR = 60)."
      explanation: >-
        This systematic review compared the rhabdomyosarcoma incidence in pooled
        published Costello syndrome cases with the expected incidence from the
        SEER general-population cancer registry and found a statistically
        significant standardized incidence ratio (SIR) of 1240, a direct measure
        of the excess this edge describes. The cohort was assembled from case
        reports and series, with birthdates inferred from publication data, so
        the magnitude is approximate.
    - reference: PMID:20301680
      reference_title: "HRAS-Related Costello Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: "Individuals with Costello syndrome have an approximately 15% lifetime risk for malignant tumors including rhabdomyosarcoma and neuroblastoma in young children and transitional cell carcinoma of the bladder in adolescents and young adults."
      explanation: >-
        GeneReviews places rhabdomyosarcoma among the malignant tumors of young
        children with Costello syndrome, which supports the age group in this
        edge's description. The approximately 15% figure is the lifetime risk
        for all malignant tumors combined, not for rhabdomyosarcoma alone.
  - target: Neuroblastoma
    description: Germline HRAS-driven tumor predisposition manifests as neuroblastoma in young children.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39196581

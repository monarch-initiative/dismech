    directness: DIRECT
    snippet: "Among the 573 individuals with clinical data, 53 (9.2%) had a history of malignancy, similar to what has been previously reported ... The most common cancer reported was RMS (n = 30, 5.2%), followed by transitional cell bladder cancer (n = 13, 2.2%), and neuroblastoma (n = 5, 0.9%)."

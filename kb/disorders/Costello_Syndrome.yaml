- name: Tumor Surveillance
  action_category: SCREENING
  description: >
    Age-stratified tumor surveillance. The consensus update from the 2023 AACR
    Childhood Cancer Predisposition Workshop (published 2024) recommends
    abdominopelvic ultrasound from birth or diagnosis every 3 months until age
    14 years for rhabdomyosarcoma (cumulative risk about 7%). For neuroblastoma
    (cumulative risk about 2%), its text says screening should begin as soon as
    an HRAS variant is identified and continue until age 6 years, then at
    decreasing frequency from 6 to 10 years, and its Table 3 gives every 6-12
    months until age 10 years as the neuroblastoma-specific interval. Urine
    catecholamine screening is not recommended, because baseline levels are
    variable and elevated in Costello syndrome. For transitional cell carcinoma
    of the bladder, the AACR update's Table 3 recommends annual urinalysis with
    cytology from age 10 years, with cystoscopy if there is hematuria, and
    encourages routine cytology within a research study where one is
    available; GeneReviews lists annual urinalysis from age 10 years, and the
    AACR text adds that surveillance cystoscopy every 2 years from age 10 could
    be considered, with a role for patient and family shared decision-making
    because the procedure is invasive. GeneReviews gives an
    earlier schedule of abdominal and pelvic ultrasound every 3-6 months until
    age 8-10 years. A 2023 systematic review notes that, although expert groups
    have recommended surveillance because of the apparent increased risk of
    malignancy, there is currently no evidence that such monitoring reduces
    mortality in Costello syndrome.
  treatment_term:
    preferred_term: age-stratified embryonal tumor and bladder cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:

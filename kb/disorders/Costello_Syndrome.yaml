      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "The SIR for neuroblastoma was 70 at ages 0-4, after which no more cases were reported."
      explanation: >-
        The review's age-stratified analysis places the neuroblastoma excess at

pathophysiology:
- name: USUV Cutaneous Inoculation and Interferon Antagonism
  description: >-
    After a mosquito bite USUV replicates locally in skin cells and draining
    lymphoid tissue. As with other flaviviruses, its nonstructural proteins
    (including NS5) antagonise type I interferon induction and signalling,
    blunting the early antiviral response and permitting systemic spread.

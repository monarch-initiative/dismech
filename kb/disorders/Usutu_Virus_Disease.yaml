name: Usutu Virus Disease
creation_date: "2026-11-04T00:00:00Z"
category: Infectious
description: >-
  Usutu virus disease is the human illness caused by Usutu virus (USUV), a
  mosquito-borne flavivirus (genus Orthoflavivirus, family Flaviviridae) of the
  Japanese encephalitis serocomplex and a close relative of West Nile virus.
  USUV is maintained in an enzootic cycle between Culex mosquitoes and birds,
  in which it can cause mass die-offs - notably of Eurasian blackbirds and
  owls - and it has spread and emerged across Europe since the early 2000s.
  Humans and horses are incidental, dead-end hosts infected by the bite of an
  infected mosquito. Most human infections are asymptomatic or cause only a
  mild febrile illness with rash and headache, but a minority - especially
  immunocompromised people - develop neuroinvasive disease (meningitis,
  encephalitis or meningoencephalitis), the first such human cases being
  recognised in Europe from 2009. It is an emerging arbovirus whose range and
  human recognition are expanding alongside West Nile virus.
disease_term:
  preferred_term: Usutu virus disease
notes: >-
  No MONDO term exists for human Usutu virus disease at the time of curation;
  the only MONDO concept, MONDO:1015078, is "usutu virus infection, non-human
  animal" and is deliberately not bound here as the disease_term. This entry is
  curated without a MONDO binding to support a request for a human-disease term;
  the agent is grounded in NCBITaxon (USUV, NCBITaxon:64286).
synonyms:
- USUV infection
- Usutu virus infection
infectious_agent:
- name: Usutu virus (USUV)
  description: >-
    The etiological agent is Usutu virus (USUV), an enveloped, positive-sense
    single-stranded RNA flavivirus (genus Orthoflavivirus, family Flaviviridae)
    within the Japanese encephalitis serocomplex and closely related to West
    Nile virus. Like other flaviviruses its nonstructural proteins, including
    NS5, antagonise the host type I interferon response.
  infectious_agent_term:
    preferred_term: Usutu virus
    term:
      id: NCBITaxon:64286
      label: Usutu virus
  evidence:
  - reference: PMID:32858963
    reference_title: "Epidemiology of Usutu Virus: The European Scenario."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Usutu virus (USUV) is an emerging arbovirus that belongs to the family Flaviviridae, genus Flavivirus, Japanese encephalitis serocomplex.
    explanation: >-
      Places USUV taxonomically in Flaviviridae, Japanese encephalitis
      serocomplex, and establishes its emerging-arbovirus status.
transmission:
- name: Bite of infected mosquitoes
  description: >-
    Humans acquire USUV through the bite of an infected mosquito, principally
    Culex species (notably Culex pipiens) that also maintain the enzootic
    bird-mosquito cycle. Humans are incidental, dead-end hosts.
- name: Transfusion-associated transmission
  description: >-
    As for West Nile virus, USUV RNA has been detected in asymptomatic blood
    donors, raising a documented risk of transfusion-transmitted infection that
    underlies blood-safety screening in affected areas.
  evidence:
  - reference: PMID:32858963
    reference_title: "Epidemiology of Usutu Virus: The European Scenario."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical cases of neuroinvasive disease and USUV fever, as well as seroconversion in blood donors were reported in Europe since 2009.
    explanation: >-
      Documents USUV seroconversion in blood donors, the basis for recognising
      a transfusion-transmission risk, alongside human clinical cases.
agent_life_cycle:
  description: >-
    USUV circulates in an enzootic cycle between ornithophilic Culex mosquitoes
    and birds, which are the amplifying and reservoir hosts and in which the
    virus can cause lethal epizootics (notably in Eurasian blackbirds and
    captive owls). Humans and horses are incidental, dead-end hosts that do not
    contribute to the transmission cycle.
  hosts:
  - preferred_term: Wild birds (amplifying and reservoir host)
    role: amplifying and reservoir host
    term:
      id: NCBITaxon:8782
      label: Aves
  - preferred_term: Human (incidental dead-end host)
    role: incidental (dead-end) host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Culex mosquitoes (notably Culex pipiens)
  evidence:
  - reference: PMID:32858963
    reference_title: "Epidemiology of Usutu Virus: The European Scenario."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      USUV was shown to be highly pathogenic for several bird species, especially blackbirds, great gray owls and house sparrows
    explanation: >-
      Documents birds (notably blackbirds and owls) as the hosts in which USUV
      causes lethal epizootics, the amplifying/reservoir hosts of the cycle.
  - reference: PMID:12095429
    reference_title: "Emergence of Usutu virus, an African mosquito-borne flavivirus of the Japanese encephalitis virus group, central Europe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      During late summer 2001 in Austria, a series of deaths in several species of birds occurred, similar to the beginning of the West Nile virus (WNV) epidemic in the United States.
    explanation: >-
      Documents the European emergence of USUV as avian die-offs, the first
      recognition of the virus outside Africa.
pathophysiology:
- name: USUV Cutaneous Inoculation and Interferon Antagonism
  description: >-
    After a mosquito bite USUV replicates locally in skin cells and draining
    lymphoid tissue. As with other flaviviruses, its nonstructural proteins
    (including NS5) antagonise type I interferon induction and signalling,
    blunting the early antiviral response and permitting systemic spread.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: flaviviral suppression of host type I interferon signaling
    term:
      id: GO:0039502
      label: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:40694555
    reference_title: STAT1-mediated interferon signaling in the hematopoietic system is essential for restricting Usutu virus infection in vivo.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previous studies demonstrated that whole-body deletion of type I interferon (IFN) signaling led to widespread USUV infection and fatality in mice.
    explanation: >-
      Shows type I interferon is the host response that restricts USUV, so its
      antagonism by viral nonstructural proteins is the pivotal early step;
      indirect because it is demonstrated by IFN-pathway deletion in mice.
  downstream:
  - target: Viremia and Systemic Dissemination
    causal_link_type: DIRECT
- name: Viremia and Systemic Dissemination
  description: >-
    Evasion of the early interferon response permits a viraemia that
    disseminates the virus systemically and, in a minority of hosts, to the
    central nervous system.
  biological_scale: ORGANISM
  downstream:
  - target: Neuroinvasion and CNS Infection
    causal_link_type: DIRECT
- name: Neuroinvasion and CNS Infection
  description: >-
    In neuroinvasive disease USUV enters the central nervous system and infects
    neurons, as shown by detection of viral antigen and RNA in brain tissue.
    Immunocompromise is a major risk factor for this outcome.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:40590537
    reference_title: "Extrapolation and comparison of West Nile virus- and Usutu virus-associated neurological diseases in humans: linking pathology to clinical symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      clinical reports of USUV infection do indicate involvement of similar brain regions as WNV
    explanation: >-
      Supports central nervous system involvement in human USUV infection,
      paralleling the neuroanatomic distribution of West Nile virus.
  downstream:
  - target: Neuroinflammation
    causal_link_type: DIRECT
- name: Neuroinflammation
  description: >-
    CNS infection provokes an inflammatory response with glial activation and
    leukocyte infiltration that, together with neuronal injury, produces the
    clinical meningoencephalitic syndrome.
  biological_scale: TISSUE
  downstream:
  - target: Meningoencephalitis
    causal_link_type: DIRECT
- name: Meningoencephalitis
  description: >-
    The convergent clinical expression of CNS infection and neuroinflammation,
    presenting as meningitis, encephalitis or meningoencephalitis with fever,
    headache and neurological signs.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32858963
    reference_title: "Epidemiology of Usutu Virus: The European Scenario."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      First human cases of USUV neuroinvasive infection caused by USUV Europe 1 lineage were documented in 2009
    explanation: >-
      Establishes human neuroinvasive USUV disease as a recognised clinical
      entity, first documented in Europe in 2009.
  downstream:
  - target: Encephalitis
    causal_link_type: DIRECT
  - target: Meningitis
    causal_link_type: DIRECT
  - target: Seizures
    causal_link_type: DIRECT

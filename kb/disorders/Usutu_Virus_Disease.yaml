progression:
- phase: Asymptomatic or mild febrile infection
  notes: >-
    Most human USUV infections are asymptomatic; a smaller fraction present as
    a mild febrile illness with rash and headache. This is the common outcome,
    recognised partly through surveillance of asymptomatic blood donors.
  evidence:
  - reference: PMID:37589592
    reference_title: "Epidemiology, surveillance and diagnosis of Usutu virus infection in the EU/EEA, 2012 to 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Human USUV infections, mainly asymptomatic and, less frequently, with a febrile illness or a neuroinvasive disease, have been reported in several EU/EEA countries
    explanation: >-
      Establishes the clinical spectrum, in which asymptomatic infection
      predominates over febrile and neuroinvasive disease.
- phase: Neuroinvasive disease
  notes: >-
    A minority progress to neuroinvasive disease (meningitis, encephalitis or
    meningoencephalitis), reported in both immunocompromised and immunocompetent
    patients. (Immunocompromise has been described as a risk factor in some
    reports, but a European surveillance series found none of its neuroinvasive
    cases immunocompromised, so the association is not uniform.)
  evidence:
  - reference: PMID:32858963
    reference_title: "Epidemiology of Usutu Virus: The European Scenario."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In Europe, neurotropism of USUV for humans was reported for the first time in both immunocompromised and immunocompetent patients
    explanation: >-
      Documents the neuroinvasive phase in humans, in both immunocompromised
      and immunocompetent hosts.
diagnosis:
- name: Serologic and molecular confirmation
  description: >-
    Laboratory diagnosis of human USUV infection rests on demonstrating a
    specific antibody response, detecting viral RNA, and virus isolation in
    cell culture from body fluids. Serology is complicated by antibody
    cross-reactivity among flaviviruses (notably West Nile virus), so
    confirmation often requires virus neutralization tests. USUV is included in
    the differential diagnosis of viral encephalitis in affected regions.
  presence: Positive USUV-specific antibody (neutralization-confirmed) or USUV RNA in blood, urine, or cerebrospinal fluid
  results: Confirms human Usutu virus infection and distinguishes it from cross-reactive West Nile virus infection via parallel neutralization assays.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:37589592
    reference_title: "Epidemiology, surveillance and diagnosis of Usutu virus infection in the EU/EEA, 2012 to 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Laboratory diagnosis of USUV infection in humans is based on demonstration of a specific antibody response against the virus, detection of viral RNA and virus isolation in cell culture from body fluids.
    explanation: States the serologic and molecular basis of human USUV diagnosis.
  - reference: PMID:37589592
    reference_title: "Epidemiology, surveillance and diagnosis of Usutu virus infection in the EU/EEA, 2012 to 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Several countries include USUV infection in the differential diagnosis of viral encephalitis
    explanation: >-
      Supports USUV as a recognised cause of viral encephalitis entering
      clinical differential diagnosis.
  - reference: PMID:37589592
    reference_title: "Epidemiology, surveillance and diagnosis of Usutu virus infection in the EU/EEA, 2012 to 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosing USUV infection in humans is challenging because of the cross-reactivity of antibodies with other related flaviviruses, such as WNV. Thus, neutralisation assays against both viruses need to be run in parallel for confirmation
    explanation: >-
      Supports the serologic cross-reactivity with West Nile virus and the need
      for parallel neutralisation assays, the central caveat of USUV diagnosis.
animal_models:
- name: Type I interferon-deficient mouse (Ifnar1-/- / Stat1-/-)
  species: Mouse
  genotype: Ifnar1-/- or Stat1-/- (type I interferon signaling deficient)
  publication: PMID:40694555
  description: >-
    Genetic ablation of type I interferon signaling renders mice susceptible to
    lethal, neuroinvasive USUV infection; conditional deletion localises the
    restricting response to the hematopoietic compartment, and exogenous
    interferon-beta is protective.
  modeled_mechanisms:
  - target: USUV Cutaneous Inoculation and Interferon Antagonism
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Recapitulates the dependence of USUV control on type I interferon, but
      only after the interferon axis is genetically removed.
    limitations: >-
      Disease requires genetic ablation of innate interferon immunity
      (Ifnar1-/- or Stat1-/-), so the model does not reproduce the
      immunocompetent human neuroinvasive cases that also occur.
    readouts:
    - name: Survival after USUV challenge in interferon-deficient mice
      target: USUV Cutaneous Inoculation and Interferon Antagonism

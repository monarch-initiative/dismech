animal_models:
- species: Mouse
  genotype: Cyp7b1 knockout
  publication: PMID:19812052
  description: >-
    The Cyp7b1 knockout mouse raises circulating 27-hydroxycholesterol but has no
    neurological symptoms. That negative result is informative rather than a failed
    experiment: the absolute plasma 27-hydroxycholesterol in the knockout is only
    about 20% of the level measured in patients, so the model is consistent with a
    concentration threshold the mouse never reaches.
  modeled_mechanisms:
  - target: Oxysterol Neurotoxicity in Cortical Neurons
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout accumulates the oxysterol but does not develop the neurological
      disease, so it does not reproduce the step this entry treats as pathogenic.
    limitations: >-
      The most likely reason is dose, not mechanism: plasma 27-hydroxycholesterol in
      the knockout is about a fifth of the patient level, and the human neuron
      experiment that establishes toxicity used patient-range concentrations. A model
      that never reaches the toxic concentration cannot test whether the concentration
      is toxic. The same source notes a cyp27a1 transgenic mouse with raised
      27-hydroxycholesterol and likewise no neurological symptoms.
    evidence:
    - reference: PMID:19812052
      reference_title: Marked accumulation of 27-hydroxycholesterol in SPG5 patients with hereditary spastic paresis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The findings are discussed in relation to two transgenic mouse models with
        increased levels of 27-hydroxy cholesterol in the circulation but without
        neurological symptoms: the cyp27a1 transgenic mouse and the cyp7b1 knockout
        mouse.
      explanation: >-
        States the negative neurological phenotype in both models, which is the claim
        this FAILS_TO_RECAPITULATE link makes.
    - reference: PMID:19812052
      reference_title: Marked accumulation of 27-hydroxycholesterol in SPG5 patients with hereditary spastic paresis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The absolute plasma levels of 27-hydroxycholesterol in the latter models are,
        however, only about 20% of those in the SPG5 patients.
      explanation: >-
        The quantitative reason the negative result does not refute the oxysterol
        hypothesis. Without this figure the mouse would read as evidence against the
        mechanism.
discussions:
- discussion_id: spg5_length_dependence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a systemic oxysterol excess produce length-dependent degeneration of the
    corticospinal tract rather than a diffuse cortical disease?
  attaches_to:
  - pathophysiology#Corticospinal Tract Degeneration
  rationale: >-
    The toxicity experiment that anchors this entry was done in human cortical neurons
    in culture and shows impaired viability at patient concentrations. It does not
    explain selectivity. Every hereditary spastic paraplegia has to answer this
    question and SPG5 has no better answer than the rest, so the edge from
    neurotoxicity to tract degeneration is typed with unknown intermediates.
- discussion_id: spg5_csf_target_engagement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does lowering serum 27-hydroxycholesterol lower it in the central compartment
    enough to matter?
  attaches_to:
  - treatments#Atorvastatin
  rationale: >-
    This is the hole in an otherwise unusually complete causal chain. Atorvastatin
    lowered serum 27-hydroxycholesterol by 31.5% with p = 0.001, but the
    cerebrospinal fluid reduction was 8.4% and did not separate from placebo — and
    cerebrospinal fluid is where the 30- to 50-fold accumulation sits. A biomarker
    trial that moves the peripheral marker without demonstrating central target
    engagement does not establish that the strategy can work, whatever the mechanism
    predicts.
- discussion_id: spg5_mouse_threshold
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the absence of neurological disease in the Cyp7b1 knockout mouse a dose effect
    or a species difference in oxysterol handling?
  attaches_to:
  - pathophysiology#Oxysterol Neurotoxicity in Cortical Neurons
  rationale: >-
    The knockout mouse accumulates 27-hydroxycholesterol and stays neurologically
    well, which taken alone argues against the oxysterol hypothesis. The dose figure
    rescues it — the mouse reaches about 20% of patient plasma levels — but "the model
    never reached the toxic concentration" and "the mouse tolerates concentrations
    that harm human neurons" are different claims with different consequences for
    using the model to test a therapy. No located source distinguishes them. This is a
    model-fidelity question rather than a plain absence of evidence, which is why it
    is typed HUMAN_MODEL_MISMATCH.
notes: >-
  SPG5 is worth curating carefully because its causal chain is closed further than
  most neurodegenerative diseases manage, and the places where it is not closed are
  specific and identifiable. The enzyme deficiency is genetic; the substrate
  accumulation is measured in patients in two compartments with magnitudes;
  the accumulated substrate is toxic to human cortical neurons at the concentrations
  patients actually have; serum levels correlate with severity and duration; and a
  randomised trial moves the marker. Two links are missing. Nothing explains why the
  corticospinal tract specifically degenerates, and the trial did not show central
  target engagement — cerebrospinal fluid 27-hydroxycholesterol fell 8.4% and did not
  separate from placebo. Both are recorded as discussions rather than glossed.

  On the treatment: this entry deliberately does not present atorvastatin as therapy.
  The trial was nine weeks in fourteen patients against a biomarker endpoint, and the
  paper says no clinical effects were seen or expected. The authors' phrase "the first
  causal treatment strategy in hereditary spastic paraplegia" is a claim about the
  strategy, and the entry quotes the negative cerebrospinal fluid result as its own
  evidence item so the qualification travels with the claim.

  On the gene: CYP7B1 causes two diseases. Congenital bile acid synthesis defect type
  3 is a neonatal cholestatic liver disease and is already carried as a has_subtypes
  entry on Inborn_Disorder_of_Bile_Acid_Synthesis. SPG5 is curated separately here
  because the lesions differ in kind and not in degree — the serum bile acid pattern
  is normal in SPG5, so it is a substrate-stranding disease rather than a bile acid
  deficiency. That entry's own text already notes the same gene produces a later-onset
  spastic paraplegia.

  On CHEBI: the compound the SPG5 literature calls 27-hydroxycholesterol is bound to
  CHEBI:17703, whose canonical label is 26-hydroxycholesterol. Same molecule,
  different numbering convention; the clinical name is kept in preferred_term. Do not
  "correct" either one.

  On the GeneReviews baseline: there is no GeneReviews chapter for SPG5 specifically.
  The relevant chapter is the Uncomplicated (Pure) Hereditary Spastic Paraplegia
  Overview (PMID:20301682), which covers the disease class rather than this subtype;
  it is tagged in the references block for that reason. just check-genereviews reports
  NO_CHAPTER for the entry's own names, which is correct and is not a gap.

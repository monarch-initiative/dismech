biochemical:
- name: Serum and cerebrospinal fluid 27-hydroxycholesterol
  biomarker_term:
    preferred_term: 27-hydroxycholesterol
    term:
      id: CHEBI:17703
      label: 26-hydroxycholesterol
  notes: >-
    The CYP7B1 substrate that is both the mechanism and the trial endpoint. Serum
    levels correlate with disease severity and disease duration, which is the property
    that makes it a candidate progression marker rather than only a diagnostic one.
    Baseline serum in the trial cohort was 853 ng/ml (IQR 683-1113).

    A caution on the ontology binding: CHEBI's canonical label for this compound is
    26-hydroxycholesterol, which is the IUPAC-preferred numbering for the same
    molecule the SPG5 literature calls 27-hydroxycholesterol throughout. The
    preferred_term keeps the clinical name.

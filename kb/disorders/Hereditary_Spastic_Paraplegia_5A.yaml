name: Hereditary Spastic Paraplegia 5A
creation_date: "2026-09-17T15:10:00Z"
description: >-
  Spastic paraplegia type 5A (SPG5) is the autosomal recessive hereditary spastic
  paraplegia caused by biallelic variants in CYP7B1, which encodes oxysterol
  7alpha-hydroxylase. The enzyme is the entry point of the alternative
  (acidic) pathway of cholesterol degradation to bile acids, so losing it does not
  block bile acid synthesis outright — the bile acid pattern in serum is normal —
  but strands its substrates. Plasma 27-hydroxycholesterol rises 6- to 9-fold and
  25-hydroxycholesterol about 100-fold; in cerebrospinal fluid 27-hydroxycholesterol
  rises 30- to 50-fold. Clinically the result is a progressive corticospinal
  degeneration presenting in childhood or adolescence, historically classified as a
  "pure" spastic paraplegia although gait ataxia is common and white matter
  hyperintensities are frequently seen.

  What makes SPG5 unusual among the spastic paraplegias is how much of the causal
  chain has been closed experimentally. Serum 27-hydroxycholesterol correlates with
  disease severity and duration; the same oxysterols impair metabolic activity and
  viability of human cortical neurons at the concentrations measured in patients;
  and a randomised placebo-controlled trial showed that atorvastatin lowers serum
  27-hydroxycholesterol by about a third. The trial was a biomarker trial, not an
  outcome trial — nine weeks, fourteen patients, no clinical endpoint met or
  expected — and the cerebrospinal fluid reduction did not separate from placebo,
  which is the part of the chain that still has a hole in it.
synonyms:
- SPG5
- SPG5A
- spastic paraplegia 5A, autosomal recessive
- CYP7B1-related hereditary spastic paraplegia

genetic:
- name: CYP7B1
  gene_term:
    preferred_term: CYP7B1
    term:
      id: hgnc:2652
      label: CYP7B1
  relationship_type: CAUSATIVE
  notes: >-
    Cytochrome P450 family 7 subfamily B member 1, encoding oxysterol
    7alpha-hydroxylase and expressed in brain and liver. Biallelic variants cause
    SPG5.

    The same gene separately causes congenital bile acid synthesis defect type 3, a
    neonatal cholestatic liver disease, which the dismech entry
    Inborn_Disorder_of_Bile_Acid_Synthesis already carries as a has_subtypes entry.
    The two are not a severity spectrum of one disease: in SPG5 the serum bile acid
    pattern is normal and the lesion is substrate accumulation, whereas the neonatal
    disease is a failure of bile acid production.
  variants:
  - name: p.R417H / p.R417C
    description: >-
      Missense changes at residue R417, described as a mutational hot spot; part of a
      cluster of missense variants at the C-terminal end of the protein in exon 6.
  - name: p.R63X, p.R112X, p.Y275X
    description: Nonsense variants reported in autosomal recessive HSP families.
  evidence:
  - reference: PMID:19439420
    reference_title: CYP7B1 mutations in pure and complex forms of hereditary spastic paraplegia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Very recently, five mutations in the CYP7B1 gene, encoding a cytochrome P450
      oxysterol 7-alpha hydroxylase and expressed in brain and liver, have been found
      in SPG5 families.
    explanation: >-
      Identifies the gene product and its expression pattern. The sentence is this
      paper's introduction summarising the prior gene-identification report.
  - reference: PMID:24117163
    reference_title: "CYP7B1: novel mutations and magnetic resonance spectroscopy abnormalities in hereditary spastic paraplegia type 5A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SPG5A subtype of Hereditary Spastic Paraplegia (HSP) is a rare autosomal
      recessive neurodegenerative disorder caused by mutations in the CYP7B1 gene,
      which encodes a steroid cytochrome P450 7α-hydroxylase.
    explanation: The gene-disease relationship stated for the SPG5A subtype by name.
treatments:
- name: Atorvastatin
  description: >-
    Atorvastatin 40 mg/day for nine weeks lowered serum 27-hydroxycholesterol by 31.5%
    in a randomised, placebo-controlled, double-blind trial in 14 SPG5 patients,
    against a primary endpoint of serum 27-hydroxycholesterol. Read the result
    carefully: the trial met a biomarker endpoint, not a clinical one; cerebrospinal
    fluid 27-hydroxycholesterol fell only 8.4% and did not separate from placebo; and
    no clinical effect was seen or expected over nine weeks. It is described by its
    authors as the first causal treatment strategy in hereditary spastic paraplegia,
    which is a claim about the strategy rather than about demonstrated clinical
    benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atorvastatin
      term:
        id: CHEBI:39548
        label: atorvastatin
  dosing_interval: once daily
  dosing_interval_days: 1
  target_mechanisms:
  - target: Oxysterol Substrate Accumulation
    description: >-
      Reducing cholesterol synthesis lowers the pool from which the stranded oxysterols
      are made, which is how a statin acts on a disease that is not a
      hypercholesterolaemia.
    evidence:
    - reference: PMID:29126212
      reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Atorvastatin, but not placebo, reduced serum 27-hydroxycholesterol from 853
        ng/ml
      explanation: >-
        The randomised result on the primary endpoint, with its comparator. The quote
        stops before the interquartile range because the reference validator strips
        bracketed spans before matching; the full reported change is 853 to 641 ng/ml,
        a 31.5% reduction at P = 0.001, and is given in the treatment description.
  evidence:
  - reference: PMID:29126212
    reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cerebrospinal fluid 27-hydroxycholesterol was reduced by 8.4% but this did not
      significantly differ from placebo.
    explanation: >-
      The negative half of the same trial, quoted as a separate evidence item because
      it bears on whether the drug reaches the compartment that matters. This is the
      limitation that keeps the treatment from being an established therapy.

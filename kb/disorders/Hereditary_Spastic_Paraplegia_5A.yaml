inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Two defective CYP7B1 alleles are required. The gene was identified in
    consanguineous families with homozygous variants, and compound heterozygosity
    has been documented in non-consanguineous recessive families. A heterozygous
    missense change segregating in a small dominant family has been reported, but
    that observation sits outside the recessive disease curated here and has not
    been established as a separate dominant entity.
  evidence:
  - reference: PMID:18855023
    reference_title: Analysis of CYP7B1 in non-consanguineous cases of hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygosity was observed in a recessive family with a clinically
      pure phenotype.
    explanation: >-
      Establishes that the recessive requirement is satisfied by compound
      heterozygosity and not only by homozygosity in consanguineous pedigrees.
prevalence:
- population: French series of autosomal recessive hereditary spastic paraplegia families
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    CYP7B1 variants accounted for 6 of 82 index patients (7.3%) in a series of
    autosomal recessive hereditary spastic paraplegia families, and 3 of 90 (3.3%) in
    a series of sporadic pure spastic paraplegia. These are shares of referred HSP
    series, not a population prevalence — the denominator is patients already known to
    have HSP. No population prevalence for SPG5 has been published in any located
    source, which is why measure_type is UNKNOWN and no rate is recorded.
  evidence:
  - reference: PMID:19439420
    reference_title: CYP7B1 mutations in pure and complex forms of hereditary spastic paraplegia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of CYP7B1 mutations were 7.3% (n = 6/82) in our series of
      autosomal recessive hereditary spastic paraplegia families and 3.3% (n = 3/90)
      in our series of sporadic pure spastic paraplegia.
    explanation: >-
      The yield in two referred series, quoted with both denominators attached so the
      figure cannot be read as a population rate.
progression:
- phase: Childhood or adolescent onset
  notes: >-
    Median age at manifestation 13 years in a 34-patient multicentre cohort. An
    earlier series reported a mean of 16.4 +/- 12.1 years with a range of 4 to 47,
    so onset is wide even though the median sits in adolescence.
  evidence:
  - reference: PMID:29126212
    reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, SPG5 manifested in childhood or adolescence (median 13 years).
    explanation: The median age at onset in the largest genetically confirmed cohort.
  - reference: PMID:19439420
    reference_title: CYP7B1 mutations in pure and complex forms of hereditary spastic paraplegia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean age at onset in 16 patients was 16.4 +/- 12.1 years (range 4-47 years).
    explanation: >-
      An independent estimate with its spread, which is what shows the onset range is
      wide rather than tightly adolescent.
- phase: Loss of independent ambulation
  notes: >-
    Independent walking is lost after a median disease duration of 23 years and
    wheelchair dependence follows at a median of 33 years. Cross-sectional
    progression on the Spastic Paraplegia Rating Scale is 0.56 points per year
    against a longitudinal 0.80 — the two figures are not interchangeable, and the
    difference is the kind of discrepancy that matters when powering a trial.
  evidence:
  - reference: PMID:29126212
    reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG5 patients lost the ability to walk independently after a median disease
      duration of 23 years and became wheelchair dependent after a median 33 years.
    explanation: The natural-history milestones, with their medians.
  - reference: PMID:29126212
    reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall cross-sectional progression rate of 0.56 points on the Spastic
      Paraplegia Rating Scale per year was slightly lower than the longitudinal
      progression rate of 0.80 points per year.
    explanation: >-
      Both progression rates, quoted together because the paper reports them as
      differing and either alone would misstate the rate.
pathophysiology:
- name: CYP7B1 Oxysterol 7alpha-Hydroxylase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic CYP7B1 variants reduce or abolish oxysterol 7alpha-hydroxylase, a
    cytochrome P450 expressed in brain and liver. Reported alleles include nonsense
    changes (p.R63X, p.R112X, p.Y275X) and missense changes clustering at the
    C-terminal end of the protein in exon 6, with residue R417 recurring often
    enough to be described as a mutational hot spot.
  genes:
  - preferred_term: CYP7B1
    term:
      id: hgnc:2652
      label: CYP7B1
  molecular_functions:
  - preferred_term: oxysterol 7-alpha-hydroxylase activity
    modifier: DECREASED
    term:
      id: GO:0008396
      label: oxysterol 7-alpha-hydroxylase activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Oxysterol Substrate Accumulation
    causal_link_type: DIRECT
    description: >-
      The enzyme's substrates have no alternative route out, so they accumulate. The
      founding metabolic study framed this as the expected consequence and then
      measured it.
    evidence:
    - reference: PMID:19812052
      reference_title: Marked accumulation of 27-hydroxycholesterol in SPG5 patients with hereditary spastic paresis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One of the expected metabolic consequences of such mutations is accumulation
        of oxysterol substrates due to decreased enzyme activity.
      explanation: >-
        States the predicted consequence of the enzyme deficiency, which the same
        paper then confirms by measurement.
  evidence:
  - reference: PMID:19439420
    reference_title: CYP7B1 mutations in pure and complex forms of hereditary spastic paraplegia type 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of these mutations were nonsense (p.R63X, p.R112X, p.Y275X) and five were
      missense mutations (p.T297A, p.R417H, p.R417C, p.F470I, p.R486C), the last four
      clustering in exon 6 at the C-terminal end of the protein. Residue R417 appeared
      as a mutational hot-spot.
    explanation: The allelic spectrum and the hot-spot residue.
- name: Oxysterol Substrate Accumulation
  biological_scale: ORGANISM
  description: >-
    27-hydroxycholesterol and 25-hydroxycholesterol accumulate. The magnitudes differ
    by compartment and by species of oxysterol in a way that matters: plasma
    27-hydroxycholesterol rises 6- to 9-fold, cerebrospinal fluid 27-hydroxycholesterol
    30- to 50-fold, and plasma 25-hydroxycholesterol about 100-fold, while
    25-hydroxycholesterol is not measurable in cerebrospinal fluid at all. Bile acid
    synthesis itself is normal, so this is a substrate-stranding lesion and not a bile
    acid deficiency.
  chemical_entities:
  - preferred_term: 27-hydroxycholesterol
    modifier: INCREASED
    term:
      id: CHEBI:17703
      label: 26-hydroxycholesterol
  - preferred_term: 25-hydroxycholesterol
    modifier: INCREASED
    term:
      id: CHEBI:42977
      label: 25-hydroxycholesterol
  biological_processes:
  - preferred_term: bile acid biosynthetic process
    term:
      id: GO:0006699
      label: bile acid biosynthetic process
  downstream:
  - target: Oxysterol Neurotoxicity in Cortical Neurons
    causal_link_type: DIRECT
    description: >-
      The accumulated oxysterols are themselves toxic to the relevant human neurons at
      the concentrations found in patients, which is the step that converts a
      biochemical abnormality into a mechanism.
    evidence:
    - reference: PMID:29126212
      reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Oxysterols were found to impair metabolic activity and viability of human
        cortical neurons at concentrations found in SPG5 patients, indicating that
        elevated levels of oxysterols might be key pathogenic factors in SPG5.
      explanation: >-
        The dose-matching is what makes this edge causal rather than a demonstration
        that a sterol can be toxic at some concentration.
  evidence:
  - reference: PMID:19812052
    reference_title: Marked accumulation of 27-hydroxycholesterol in SPG5 patients with hereditary spastic paresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate here that four patients with the SPG5 disease have 6- to 9-fold
      increased plasma levels of 27-hydroxycholesterol. A much higher increase, 30- to
      50-fold, was found in cerebrospinal fluid.
    explanation: >-
      The compartment-specific magnitudes, measured in patients. The much larger CSF
      increase is the reason a central mechanism is plausible at all.
  - reference: PMID:19812052
    reference_title: Marked accumulation of 27-hydroxycholesterol in SPG5 patients with hereditary spastic paresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pattern of bile acids in serum was normal, suggesting a normal bile acid
      synthesis.
    explanation: >-
      Excludes a bile acid deficiency as the lesion, which is what distinguishes this
      disease from the neonatal cholestatic CYP7B1 phenotype.
- name: Oxysterol Neurotoxicity in Cortical Neurons
  biological_scale: CELLULAR
  description: >-
    Oxysterols at patient concentrations impair metabolic activity and viability of
    human cortical neurons. The experiment was done in human neurons and dosed to the
    levels measured in patients, which is the strongest link in this chain — but note
    it establishes that these concentrations are toxic to cortical neurons in culture,
    not that the same process selects the long corticospinal axons in vivo.
  cell_types:
  - preferred_term: human cortical neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  downstream:
  - target: Corticospinal Tract Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Why a diffuse metabolic insult produces a length-dependent degeneration of the
      corticospinal tract, rather than a generalised cortical disease, is not
      established in any located source.
  evidence:
  - reference: PMID:29126212
    reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Oxysterols were found to impair metabolic activity and viability of human
      cortical neurons at concentrations found in SPG5 patients, indicating that
      elevated levels of oxysterols might be key pathogenic factors in SPG5.
    explanation: The neurotoxicity result in human cells.
- name: Corticospinal Tract Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive degeneration of the corticospinal tract motor neurons is the defining
    lesion of hereditary spastic paraplegia as a class, and SPG5 is one instance of
    it. White matter hyperintensities on brain MRI accompany it in a substantial
    minority, including in families whose clinical phenotype is otherwise pure.
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  downstream:
  - target: Spastic paraplegia
    causal_link_type: DIRECT
  - target: Hyperreflexia
    causal_link_type: DIRECT
  - target: Gait ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Gait ataxia is common in SPG5 and is not straightforwardly explained by
      corticospinal degeneration alone, which is part of why the "pure" classification
      of this disease has been questioned.
  - target: Urinary urgency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of descending corticospinal control of the detrusor produces urgency, the
      usual bladder consequence of an upper motor neuron lesion.
  - target: White matter hyperintensities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29126212
    reference_title: "Hereditary spastic paraplegia type 5: natural history, biomarkers and a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Spastic paraplegia type 5 (SPG5) is a rare subtype of hereditary spastic
      paraplegia, a highly heterogeneous group of neurodegenerative disorders defined
      by progressive neurodegeneration of the corticospinal tract motor neurons.
    explanation: >-
      The defining lesion of the disease class, of which SPG5 is stated to be a member.

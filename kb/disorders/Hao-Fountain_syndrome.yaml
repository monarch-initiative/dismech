  preferred_term: Hao-Fountain syndrome
  term:
    id: MONDO:0014805
    label: Hao-Fountain syndrome
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_high: 0.1
  notes: Orphanet reports a worldwide point prevalence below 1 per 1,000,000 for Hao-Fountain syndrome.
  evidence:
  - reference: ORPHA:643549
    reference_title: "Hao-Fountain syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | PMID:26365382,PMID:30679821,PMID:35627274"
    explanation: Orphanet records the worldwide point prevalence of Hao-Fountain syndrome as less than 1 per 1,000,000.
inheritance:
- name: Autosomal dominant inheritance
  description: >-

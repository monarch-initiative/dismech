      fibroblasts in Hao-Fountain syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hao–Fountain syndrome (HAFOUS) is a rare autosomal dominant
      neurodevelopmental disorder caused by pathogenic USP7 variants.
    explanation: This directly supports autosomal dominant inheritance and USP7 causality.
  - reference: PMID:41343689
    reference_title: "USP7-Related Hao-Fountain Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      USP7-related Hao-Fountain syndrome is an autosomal dominant disorder
      typically caused by a de novo pathogenic variant.
    explanation: GeneReviews confirms autosomal dominant inheritance with predominantly de novo pathogenic USP7 variants.
  - reference: PMID:41343689
    reference_title: "USP7-Related Hao-Fountain Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with USP7-related Hao-Fountain syndrome has a
      50% chance of inheriting the pathogenic variant.
    explanation: GeneReviews documents the 50% autosomal dominant transmission risk to offspring.
pathophysiology:
- name: USP7 haploinsufficiency
  description: >-
    Reduced USP7 dosage is the initiating molecular lesion in Hao-Fountain
    syndrome and perturbs several cellular homeostatic mechanisms, including
    deubiquitinase functions linked to the MUST complex and Polycomb repressive
    complex 1 (PRC1).
  genes:
  - preferred_term: USP7
    term:
      id: hgnc:12630
      label: USP7
  molecular_functions:
  - preferred_term: cysteine-type deubiquitinase activity
    modifier: DECREASED
    term:
      id: GO:0004843
      label: cysteine-type deubiquitinase activity
  evidence:
  - reference: DOI:10.3389/fcell.2026.1782599
    reference_title: >-
      Integrative epigenetic and transcriptomic profiling of whole blood and
      fibroblasts in Hao-Fountain syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      USP7, located on chromosome 16p13.2, encodes a deubiquitinating enzyme
      with broad regulatory roles in cellular homeostasis.
    explanation: Supports the cysteine-type deubiquitinase activity of USP7 impaired in USP7 haploinsufficiency.
  - reference: DOI:10.3389/fcell.2026.1782599
    reference_title: >-
      Integrative epigenetic and transcriptomic profiling of whole blood and
      fibroblasts in Hao-Fountain syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      USP7 haploinsufficiency is associated with a restricted set of regulatory
      loci enriched within PRC1-associated chromatin domains.
    explanation: This directly supports USP7 haploinsufficiency as the initiating molecular defect.
  - reference: PMID:38221796
    reference_title: "Hao-Fountain syndrome: 32 novel patients reveal new insights into the clinical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hao-Fountain syndrome (HAFOUS, OMIM: #616863) is a neurodevelopmental disorder caused by pathogenic variants in the gene USP7 coding for USP7, a protein involved in several crucial cellular homeostatic mechanisms and the recently described MUST complex."
    explanation: This provides partial mechanistic context that USP7 participates in broader homeostatic and MUST-complex-associated functions relevant to Hao-Fountain syndrome.
  downstream:
  - target: PRC1-associated chromatin dysregulation
    description: Reduced USP7 dosage perturbs PRC1-associated chromatin regulation.

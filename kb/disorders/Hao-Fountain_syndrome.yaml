notes: >-
  Asta deep research was completed for this disorder. Final curation combined
  the 2024 clinical spectrum paper, the 2025 GeneReviews chapter (PMID:41343689),
  and a disease-specific 2026 epigenetic and transcriptomic study to support
  mechanistic pathophysiology and clinical management. The expanded cohort also
  reported abnormal pain thresholds, but that finding was not promoted to a
  phenotype entry here because a confident best-fit HPO mapping was not
  established in this pass.

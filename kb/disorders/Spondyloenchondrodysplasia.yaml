name: Spondyloenchondrodysplasia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondyloenchondrodysplasia (SPENCD) is an autosomal recessive immuno-osseous
  dysplasia caused by biallelic loss of function in ACP5, which encodes
  tartrate-resistant acid phosphatase (TRAP). It was named in 1976 for the two
  radiographic findings that define it - platyspondyly and islands of chondroid
  tissue persisting inside ossified bone - and for three decades was treated as
  a skeletal dysplasia that sometimes had other features. The 2011 identification
  of ACP5 reframed it: SPENCD is a type I interferonopathy, and the autoimmunity
  (systemic lupus erythematosus, autoimmune thrombocytopenia, haemolytic anaemia,
  hypothyroidism), the intracranial calcification and the spasticity are as much
  the disease as the bone lesions are. Which of the three domains dominates
  varies widely, even between affected siblings, and neurological presentations
  can mask the skeletal and immune features entirely. How TRAP loss produces the
  interferon signature is still not settled; the leading proposal is failure to
  dephosphorylate osteopontin in plasmacytoid dendritic cells, sustaining TLR9
  signalling.
disease_term:
  preferred_term: spondyloenchondrodysplasia with immune dysregulation
  term:
    id: MONDO:0011939
    label: Spondyloenchondrodysplasia with immune dysregulation
parents:

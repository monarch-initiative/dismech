  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:21217752
    reference_title: "Genetic deficiency of tartrate-resistant acid phosphatase associated with skeletal dysplasia, cerebral calcifications and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped a locus in five consanguineous families to chromosome 19p13
    explanation: >-
      Establishes the consanguineous, recessive family structure that makes
      recurrence-risk counselling the relevant action.
animal_models:
- name: Acp5-null mouse
  species: Mouse
  genotype: Acp5 knockout (homozygous null)
  publication: PMID:8898228
  description: >-
    The Acp5 knockout mouse, reported in 1996, is viable and reproduces the
    skeletal arm of SPENCD — disorganised growth plates and mild osteopetrosis from
    an osteoclast resorptive defect — while developing neither overt autoimmunity
    nor neurological disease. Its bones are stronger than wild type, matching the
    absence of increased fracture risk in patients.
  modeled_mechanisms:
  - target: Osteoclast and Growth-Plate Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Loss of Acp5 alone is sufficient to produce the growth-plate disorganisation
      and resorptive defect, establishing this node as a direct consequence of TRAP
      loss rather than of inflammation.
    limitations: >-
      The mouse skeletal phenotype is described as mild osteopetrosis with limb and
      axial deformity; the enchondroma-like metaphyseal lucencies and platyspondyly
      of the human disorder are not asserted to be reproduced lesion for lesion.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Reminiscent of the skeletal features seen in patients with SPENCD, these
        defects include disorganized growth plates indicative of a role for TRAP in
        endochondral ossification, and mild osteopetrosis due to a resorptive defect
        of osteoclasts resulting in defective bone remodelling.
      explanation: >-
        States both that the mouse skeletal phenotype resembles the human one and
        what the underlying cellular defects are.
    - reference: PMID:8898228
      reference_title: "Mice lacking tartrate-resistant acid phosphatase (Acp 5) have disrupted endochondral ossification and mild osteopetrosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histomorphometry and mineralization density analysis of backscattered
        electron imaging revealed widened and disorganized epiphyseal growth plates
        with delayed mineralization of cartilage in 6- to 8-week-old mutant mice.
      explanation: >-
        The primary description of the model, measuring the growth-plate lesion
        directly rather than relying on the later review's summary of it.
    - reference: PMID:8898228
      reference_title: "Mice lacking tartrate-resistant acid phosphatase (Acp 5) have disrupted endochondral ossification and mild osteopetrosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus the findings reflect a mild osteopetrosis due to an intrinsic defect of
        osteoclastic modelling activity that was confirmed in the resorption pit
        assay in vitro.
      explanation: >-
        Establishes the resorptive defect as intrinsic to the osteoclast, confirmed
        by a functional assay rather than inferred from bone density alone.
  - target: Systemic Autoimmunity
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The defining extraskeletal feature of human SPENCD is absent in the null
      mouse, which is the central obstacle to studying the immune arm in vivo.
    limitations: >-
      Acp5-null mice show altered macrophage cytokine profiles, impaired bacterial
      clearance, and impaired Th1 responses, but no overt autoimmune disease and no
      neurological involvement. Any inference about the human autoimmune mechanism
      from this model is therefore indirect.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Acp5-null mice have not been described to manifest overt autoimmunity, which
        is such a prominent feature of ACP5-related disease in humans.
      explanation: >-
        Explicit negative result: the model does not reproduce the human autoimmune
        phenotype, which is what FAILS_TO_RECAPITULATE records.
    - reference: PMID:21217755
      reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        they do not develop an overt autoimmune phenotype
      explanation: >-
        The founding report makes the same negative observation independently.
discussions:
- discussion_id: spencd_mouse_immune_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Systemic Autoimmunity
  prompt: >-
    Why does the Acp5-null mouse reproduce the skeletal dysplasia of SPENCD but
    not the autoimmunity or the neurological disease that dominate the human
    phenotype?
  rationale: >-
    The only viable in vivo model of TRAP deficiency is silent on the arm of the
    disorder that causes most of the morbidity and all of the recorded deaths.
    Evidence for the immune mechanism therefore rests on human patient material and
    on knockdown in a plasmacytoid dendritic cell line, not on an organism-level
    system in which the interferon-to-autoimmunity link can be tested. Whether this
    reflects a species difference in the osteopontin-TLR9 axis, a difference in
    laboratory pathogen exposure, or a genuinely different mechanism in humans is
    unknown, and it is the reason the causal status of the interferon signature
    remains open.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Acp5-null mice have not been described to manifest overt autoimmunity, which
      is such a prominent feature of ACP5-related disease in humans.
    explanation: States the mismatch between the model and the human phenotype directly.
  proposed_experiments:
  - experiment_id: exp_spencd_sensitised_acp5_null_model
    name: Interferon-sensitised or humanised Acp5-deficient model
    description: >-
      Test whether Acp5-null mice develop autoimmunity when the type I interferon
      axis is sensitised — for example on a lupus-prone background, under TLR9
      agonist challenge, or with the human osteopontin phosphorylation sites
      knocked in — and whether JAK inhibition prevents it.
    would_support:
    - pathophysiology#Systemic Autoimmunity
    supporting_outcome:
    - >-
      Emergence of autoantibodies and cytopenias in sensitised Acp5-null animals,
      abrogated by JAK inhibition, would place the interferon node causally upstream
      of autoimmunity in vivo.
    would_refute:
    - pathophysiology#Persistent TLR9 Signaling in Plasmacytoid Dendritic Cells
    refuting_outcome:
    - >-
      Failure of TLR9 agonist challenge to elicit autoimmunity in Acp5-null animals
      despite an intact interferon response would argue that the osteopontin-TLR9
      route is not the operative mechanism.
- discussion_id: spencd_trap_substrate_identity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Osteopontin Hyperphosphorylation
  prompt: >-
    Is hyperphosphorylated osteopontin actually the substrate defect that drives
    type I interferon overproduction, or is TRAP acting on some other substrate?
  rationale: >-
    The osteopontin-TLR9 model rests on a single 2017 study, and its authors could
    not directly assess osteopontin phosphorylation in the plasmacytoid dendritic
    cell line they used. Alternative routes are plausible and untested: TRAP is a
    lysosomal enzyme that could act in TLR7 or TLR9 trafficking directly, or in
    STING degradation, or through its role in removing mannose-6-phosphate from
    acid hydrolases — two of which, DNase II and ribonuclease T2, are themselves
    interferonopathy genes.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it remains to be formally determined if OPN is a physical component of the
      TLR9/MyD88 complex in these cells and/or whether TRAP acts on a different
      substrate(s) in this or other pathway(s)
    explanation: The review states the substrate question as formally unresolved.
  proposed_experiments:
  - experiment_id: exp_spencd_substrate_mapping_pdc
    name: Substrate mapping in TRAP-deficient primary human plasmacytoid dendritic cells
    description: >-
      Phosphoproteomics on primary patient-derived plasmacytoid dendritic cells,
      combined with a test of whether mannose-6-phosphate retention on DNase II and
      ribonuclease T2 impairs their activity in TRAP-deficient cells.
    would_support:
    - pathophysiology#Persistent TLR9 Signaling in Plasmacytoid Dendritic Cells
    supporting_outcome:
    - >-
      Selective osteopontin hyperphosphorylation in patient plasmacytoid dendritic
      cells, with intact DNase II and ribonuclease T2 activity, would confirm the
      osteopontin route.
    would_refute:
    - pathophysiology#Osteopontin Hyperphosphorylation
    refuting_outcome:
    - >-
      Normal osteopontin phosphorylation alongside impaired lysosomal nuclease
      activity would relocate the mechanism to mannose-6-phosphate-dependent
      hydrolase maturation.
- discussion_id: spencd_adult_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Type I Interferon Overproduction
  prompt: >-
    What is the natural history of SPENCD in adulthood, and does early JAK
    inhibition change it?
  rationale: >-
    Published cases are overwhelmingly paediatric — only three of 77 individuals
    with recorded data presented after age 15 — and the 2025 review highlights a
    paucity of information on the disease beyond childhood. Whether short stature
    continues to worsen, whether intracranial calcification progresses, and whether
    the autoimmune burden accumulates or burns out are all unknown, which makes the
    benefit-risk of lifelong JAK inhibition started in early childhood impossible to
    assess.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we highlight a relative paucity of information relating to the natural history
      of the disease beyond childhood, and thus the need for longitudinal clinical
      and laboratory follow-up studies into adulthood
    explanation: The review names the adult natural history as the outstanding clinical gap.
  proposed_experiments:
  - experiment_id: exp_spencd_longitudinal_registry
    name: International longitudinal SPENCD registry
    description: >-
      Prospective longitudinal follow-up of molecularly confirmed patients into
      adulthood with standardised skeletal, neurological, immunological, and
      interferon-score endpoints, stratified by JAK inhibitor exposure.
    would_support:
    - pathophysiology#Type I Interferon Overproduction
    supporting_outcome:
    - >-
      Divergence in autoimmune event rates and interferon scores between
      JAK-inhibitor-exposed and unexposed cohorts would strengthen the causal role
      of the interferon node.
    would_refute:
    - pathophysiology#Type I Interferon Overproduction
    refuting_outcome:
    - >-
      Accumulating autoimmune events despite sustained interferon-score
      normalisation would argue that the signature is a biomarker rather than the
      driver.

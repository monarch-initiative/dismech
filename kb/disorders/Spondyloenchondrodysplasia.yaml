biochemical:
- name: Plasma tartrate-resistant acid phosphatase
  presence: Absent or negligible
  context: >-
    Total TRAP protein is negligible and the TRAP 5a isoform undetectable in
    affected individuals, including those homozygous for missense alleles. The
    assay is therefore a direct functional readout of the genetic lesion.
  evidence:
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      levels of total TRAP protein were negligible, and TRAP 5a protein undetectable, indicating an almost complete lack of TRAP synthesis or secretion in the affected patients tested
    explanation: >-
      Direct measurement of the biochemical defect.
- name: Interferon-stimulated gene expression score
  presence: Elevated
  context: >-
    Whole-blood ISG expression is raised in most patients and is the practical
    biomarker of the interferonopathy. It is not universal, and immunosuppression
    appears able to normalise it.
  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the majority of patients tested we detected upregulated expression of interferon-stimulated genes (ISGs), in keeping with the autoimmune phenotype and the likely immune-regulatory function of the deficient protein tartrate resistant acid phosphatase (TRAP).
    explanation: >-
      Establishes the ISG score as elevated in most molecularly confirmed
      patients.
diagnosis:
- name: Radiographic Recognition of the SPENCD Skeletal Pattern
  results: >-
    Platyspondyly with enchondroma-like radiolucent metaphyseal and vertebral
    lesions.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  description: >-
    Plain radiography of the spine and long bones showing platyspondyly with
    irregular end plates together with radiolucent metaphyseal lesions is the
    finding that raises the diagnosis and directs ACP5 testing. The radiographic
    features markedly increase the likelihood of finding biallelic ACP5 variants
    even when subtle, but some patients have minimal or no skeletal manifestations
    in early childhood, so normal radiographs do not exclude the diagnosis in a
    child presenting with autoimmunity.
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5
      variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPENCD can be differentiated from other spondylometaphyseal dysplasias by the presence of bone enchondromas which are radiographic radiolucent spondylar and metaphyseal lesions caused by persistence of chondroid tissue within the ossified bones
    explanation: >-
      Establishes the radiographic discriminator on which diagnosis is raised.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      while the presence of characteristic radiological features (even if subtle)
      significantly increases the likelihood of finding biallelic mutations in
      ACP5, some patients have minimal
    explanation: >-
      States both the diagnostic value of the radiographs and the limit on their
      sensitivity.
  - reference: PMID:38883133
    reference_title: "Spondyloenchondrodysplasia With Immune Dysregulation, but Without Skeletal Dysplasia, in a Six-Year-Old Boy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient did not have skeletal dysplasia, despite having ACP gene mutations,
      suggesting that there is a wide range of phenotypic severity in
      spondyloenchondrodysplasia
    explanation: >-
      A molecularly confirmed patient reported specifically as lacking a skeletal
      dysplasia, which is the clearest statement that normal radiographs do not
      exclude the diagnosis.
- name: ACP5 Sequencing
  results: Biallelic ACP5 loss-of-function variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Biallelic ACP5 variants confirm the diagnosis. Because the disease appears
    genetically homogeneous, a classical phenotype without an ACP5 result should
    prompt review for a deletion allele rather than a search for a second locus.
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5
      variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing was performed and revealed four ACP5 variants: c.629C > T (p.Ser210Phe), c.526C > T (p.Arg176Ter), c.742dupC (p.Gln248ProfsTer3) and c.775G > A (p.Gly259Arg).
    explanation: >-
      Documents exome sequencing as the diagnostic route in a recent series.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We are unaware of any patients conforming to the classical SPENCD phenotype
      being negative for mutations in ACP5, suggesting that the disease is
      genetically homogeneous.
    explanation: >-
      Genetic homogeneity is what makes single-gene testing the definitive
      confirmatory step.
- name: Serum TRAP Activity and Type I Interferon Signature
  results: >-
    Absent or negligible plasma TRAP, with upregulated interferon-stimulated
    gene expression in most patients.
  diagnosis_term:
    preferred_term: molecular diagnostic method
    term:
      id: NCIT:C18194
      label: Molecular Diagnostic Method
  description: >-
    Total and isoform 5b TRAP activity are undetectable in patient serum and
    leukocyte homogenates and roughly halved in heterozygous parents, providing a
    functional confirmation of a variant of uncertain significance. Serum
    interferon-alpha activity and a whole-blood interferon-stimulated gene score
    are elevated in most patients, but are neither specific to SPENCD nor invariably
    present, and can be suppressed by immunosuppressive treatment.
  evidence:
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All eight cases assayed showed elevated serum interferon alpha activity, and
      gene expression profiling in whole blood defined a type I interferon
      signature.
    explanation: >-
      Establishes the interferon assays as consistently abnormal in molecularly
      confirmed patients.
differential_diagnoses:
- name: Aicardi-Goutieres Syndrome
  description: >-
    Shares spasticity, intracranial calcification, and a type I interferon
    signature, and was the differential that prompted interferon assays in SPENCD.
    Significant cerebral white matter disease is usual in Aicardi-Goutieres and
    unusual in SPENCD, and the SPENCD skeletal dysplasia and the frank organ-specific
    autoimmunity are not features of Aicardi-Goutieres.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to Aicardi–Goutières syndrome (AGS), significant cerebral white
      matter disease is apparently unusual.
    explanation: Names the neuroimaging feature that separates the two disorders.
- name: Childhood-Onset Systemic Lupus Erythematosus
  description: >-
    SPENCD is one of the monogenic causes of lupus, and a third of patients meet
    ACR criteria. Very early onset, refractory cytopenias, intracranial
    calcification, short stature, or any vertebral or metaphyseal radiographic
    abnormality should prompt ACP5 testing rather than a diagnosis of idiopathic
    childhood lupus.
  evidence:
  - reference: PMID:41049574
    reference_title: >-
      Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lausch and colleagues (9) made a molecular diagnosis of SPENCD in a 63-year-old male first reported in 1958 as a 10-year-old child with a skeletal dysplasia and systemic lupus erythematosus (SLE) (11).
    explanation: >-
      A concrete instance of the diagnostic confusion this differential describes.
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TRAP deficiency now represents a third monogenic disorder associated with the
      development of lupus also showing an up-regulation of type I interferon
      activity
    explanation: >-
      Places SPENCD explicitly among the monogenic lupus disorders, which is why it
      belongs in this differential.
- name: Other Spondylometaphyseal Dysplasias
  description: >-
    Within ISDS group 12, odontochondrodysplasia (TRIP11), SMD Sutcliffe or corner
    fracture type (FN1), SMD with cone-rod dystrophy (PCYT1A), SMD with corneal
    dystrophy (PLCB3), and chondrodysplasia-pseudohermaphroditism syndrome (HHAT)
    share the combined vertebral and metaphyseal radiographic pattern. None of them
    produces intracranial calcification with systemic autoimmunity, so the
    extraskeletal triad resolves the differential in practice.
  notes: >-
    Recorded without an evidence item because it is a statement about the ISDS
    group-12 membership list, whose per-disorder placements are not quotable from
    the nosology abstract; the group assignment and its provenance are recorded in
    the classifications block.
treatments:
- name: JAK Inhibition
  description: >-
    Oral JAK1/2 or JAK1/3 inhibitors — ruxolitinib, baricitinib, tofacitinib —
    block signalling downstream of the type I interferon receptor. In reported
    cases they have controlled autoimmune cytopenias refractory to glucocorticoids,
    sirolimus, rituximab, and mycophenolate, allowing steroid tapering. The
    evidence is case reports only; no trial exists, optimal dosing is undefined,
    and the effect on the skeletal and neurological arms is unknown.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
    - preferred_term: tofacitinib
      term:
        id: CHEBI:71200
        label: tofacitinib
    - preferred_term: baricitinib
      term:
        id: CHEBI:95341
        label: baricitinib
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Type I Interferon Overproduction
    treatment_effect: INHIBITS
    description: >-
      JAK1/2 inhibition blocks IFNAR-proximal JAK-STAT signalling, so it acts on
      the consequences of excess interferon rather than on its production. The
      clinical benefit in autoimmune features is the main human evidence that this
      node is causal rather than a bystander biomarker.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The apparent efficacy of JAK1/2 /JAK1/3 inhibition in affected patients
        (Table S3), particularly relating to features of systemic autoimmunity
      explanation: >-
        Efficacy against systemic autoimmunity but not clearly against neurological
        involvement is why the supporting evidence is graded INDIRECT.
  evidence:
  - reference: PMID:41049574
    reference_title: >-
      Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Table S3 shows the data provided on patients recorded in Table S1 treated using JAK inhibition.
    explanation: >-
      Establishes that a cohort of SPENCD patients has been treated with JAK inhibition and
      tabulated, which is the evidence base for this treatment.
  - reference: PMID:40786056
    reference_title: "Case Report: Successful treatment of spondyloenchondrodysplasia with immune dysregulation using tofacitinib and ruxolitinib: a report of two pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On 16 August 2024, oral ruxolitinib (5 mg daily) combined with prednisone
      (7.5 mg daily) was started. Coombs test successfully turned negative after 1
      month of treatment adjustment.
    explanation: >-
      A documented remission of refractory Coombs-positive haemolysis on ruxolitinib
      after failure of prednisone and sirolimus.
  - reference: PMID:40786056
    reference_title: "Case Report: Successful treatment of spondyloenchondrodysplasia with immune dysregulation using tofacitinib and ruxolitinib: a report of two pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was switched to oral Tofacitinib (5 mg twice daily) in April 2023, with
      regular follow-ups. Currently, her hemoglobin and platelet levels remain
      within the normal range.
    explanation: Sustained haematological remission on tofacitinib in the second reported case.
  - reference: PMID:40786056
    reference_title: "Case Report: Successful treatment of spondyloenchondrodysplasia with immune dysregulation using tofacitinib and ruxolitinib: a report of two pediatric cases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the use of JAK inhibitors (Ruxolitinib and Tofacitinib) in our cases
      showed promising results, further studies are needed to determine the optimal
      treatment protocols.
    explanation: >-
      The authors' own caveat that the evidence base is anecdotal and the protocol
      undefined.
  - reference: PMID:42459138
    reference_title: A Multicenter Integrative Cohort Characterizing the Genetic, Clinical, and Transcriptomic Features of ACP5 Deficiency.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapeutically, prednisolone and azathioprine were the most common effective
      drugs, whereas patients treated with the JAK inhibitors ruxolitinib and
      upadacitinib achieved a partial response.
    explanation: >-
      The largest systematic treatment series to date is more equivocal than the
      individual case reports: JAK inhibition gave partial responses while
      conventional immunosuppression was the most commonly effective option. This
      tempers the case-report enthusiasm rather than contradicting it, since the
      reported JAK-inhibitor successes were in patients refractory to exactly those
      conventional drugs.
- name: Glucocorticoid and Conventional Immunosuppressive Therapy
  description: >-
    Glucocorticoids, intravenous immunoglobulin, rituximab, mycophenolate mofetil,
    and sirolimus are the conventional first-line treatments for the autoimmune
    cytopenias. Responses are frequently incomplete or transient — the
    thrombocytopenia of SPENCD is characteristically refractory — and prolonged
    corticosteroid exposure is itself a problem in a child with a skeletal
    dysplasia and short stature.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: prednisone

notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which was unpopulated when this work began. SPENCD is NOS 12-0010 in the 2023
  revision. It earns its place in the combined vertebral-plus-metaphyseal group
  on the platyspondyly and the enchondroma-like metaphyseal lesions, not on the
  autoimmunity, which is what makes it unusual among the group: it is
  simultaneously a skeletal dysplasia and a type I interferonopathy, and the
  route from the lysosomal phosphatase defect to the interferon signature is
  recorded here as an emerging hypothesis rather than as settled
  pathophysiology.

  This entry is the merge of two independently curated entries for
  MONDO:0011939 that reached the repository at the same time - one on main under
  this filename, and one on the ISDS group-12 branch as
  Spondyloenchondrodysplasia_with_Immune_Dysregulation.yaml. The surviving file
  keeps main's name and filename and takes the branch entry's content, which was
  the fuller of the two, together with main's osteopontin-TLR9 mechanistic
  hypothesis group (now carried by the three causal edges it covers) and its two
  biochemical markers. The superseded history records were moved into this slug
  directory with target.superseded_by blocks.

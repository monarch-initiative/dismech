pathophysiology:
- name: Biallelic ACP5 Loss of Function and TRAP Deficiency
  biological_scale: MOLECULAR
  description: >-
    Tartrate-resistant acid phosphatase is a lysosomal hydrolase expressed in
    cells of monocytic lineage, including osteoclasts and plasmacytoid dendritic
    cells. Null and missense ACP5 alleles both behave as nulls: plasma TRAP
    protein is negligible and the 5a isoform undetectable in patients, and the
    missense changes are predicted to destabilise the protein rather than merely
    reduce its catalytic rate.
  genes:
  - preferred_term: ACP5
    term:
      id: hgnc:124
      label: ACP5
  genetic_context:
    gene:
      preferred_term: ACP5
      term:
        id: hgnc:124
        label: ACP5
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic ACP5 variants, including whole-gene deletion, nonsense,
      frameshift and missense alleles. The missense alleles behave as nulls
      rather than as partial-activity variants: plasma TRAP protein is
      negligible and the 5a isoform undetectable even in missense homozygotes,
      and the substitutions are predicted to destabilise the protein.
  molecular_functions:
  - preferred_term: acid phosphatase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003993
      label: acid phosphatase activity
  evidence:
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to five age-matched controls, and an unaffected sibling to patients 2 and 3 who was homozygous for the wild-type allele on gene sequencing, levels of total TRAP protein were negligible, and TRAP 5a protein undetectable, indicating an almost complete lack of TRAP synthesis or secretion in the affected patients tested
    explanation: >-
      Direct patient measurement establishing that the disease state is absence
      of TRAP protein.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type-5 acid phosphatase, also known as tartrate-resistant acid phosphatase (TRAP), is a lysosomal hydrolase expressed in cells of monocytic lineage, with activity against a wide variety of substrates
    explanation: >-
      Establishes the enzyme's cellular distribution, which is what makes a bone
      enzyme deficiency an immune disease.
  downstream:
  - target: Enhanced Type I Interferon Signalling
    description: >-
      Loss of TRAP activity is followed by elevated serum interferon alpha and a
      type I interferon transcriptional signature in whole blood.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Failure to dephosphorylate a TRAP substrate in plasmacytoid dendritic cells, proposed to be osteopontin.
    hypothesis_groups:
    - opn_tlr9_pdc
    evidence:
    - reference: PMID:21217755
      reference_title: >-
        Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All eight cases assayed showed elevated serum interferon alpha activity, and gene expression profiling in whole blood defined a type I interferon signature.
      explanation: >-
        Establishes the interferon phenotype that follows TRAP loss in patients.
  - target: Persistence of Chondroid Tissue Within Ossifying Bone
    description: >-
      TRAP is a long-established, though explicitly nonspecific, marker of
      bone disease, and its loss is followed by the characteristic failure to
      clear and replace cartilage during endochondral ossification. Whether
      TRAP acts as an effector of resorption here, rather than only marking it,
      is not established by the cited source.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TRAP was identified in human serum and cells >70 years ago, becoming recognized as an important, albeit nonspecific, marker of both bone disease and macrophage activation
      explanation: >-
        Establishes TRAP's standing as a bone-turnover enzyme, the basis for
        linking its loss to the skeletal lesion.
- name: Enhanced Type I Interferon Signalling
  biological_scale: CELLULAR
  description: >-
    Elevated serum interferon alpha with upregulated interferon-stimulated gene
    expression in blood. This places SPENCD among the type I interferonopathies
    and explains why its autoimmune and neurological features resemble those of
    Aicardi-Goutieres syndrome and lupus rather than those of other skeletal
    dysplasias. The signature is not invariant: two mutation-positive patients in
    the largest survey did not show ISG upregulation, one of them while on
    immunosuppression.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the majority of patients tested we detected upregulated expression of interferon-stimulated genes (ISGs), in keeping with the autoimmune phenotype and the likely immune-regulatory function of the deficient protein tartrate resistant acid phosphatase (TRAP).
    explanation: >-
      Cohort-level evidence for the ISG signature and its link to the autoimmune
      phenotype.
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutation positive patients did not demonstrate an upregulation of ISGs, including one patient with significant autoimmune disease controlled by immunosuppressive therapy.
    explanation: >-
      Documents the exceptions that qualify the claim, and the hint that
      treatment can suppress the signature.
  downstream:
  - target: Systemic Autoimmunity
    description: >-
      Sustained type I interferon exposure drives the lupus-like autoimmune
      spectrum, which is the commonest clinical problem in the disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Interferon-driven loss of B- and T-cell tolerance, with autoantibody production.
    evidence:
    - reference: PMID:21217755
      reference_title: >-
        Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings reveal a previously unrecognized link between tartrate-resistant acid phosphatase activity and interferon metabolism and highlight the importance of type I interferon in the genesis of autoimmunity.
      explanation: >-
        The discovery paper's own statement of the interferon-to-autoimmunity
        link.
  - target: Intracranial Calcification and Spastic Neurological Disease
    description: >-
      Intracranial calcification with spasticity is the neurological signature
      shared across the type I interferonopathies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39853520
      reference_title: >-
        Clinical, laboratory, and molecular characteristics of patients with spondyloenchondrodysplasia: a case series study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SPENCD exhibits similarities with other type I interferonopathies, including increased levels of type I interferon and specific neurological symptoms
      explanation: >-
        Links the neurological phenotype to the shared interferonopathy
        mechanism.
- name: Persistence of Chondroid Tissue Within Ossifying Bone
  biological_scale: TISSUE
  description: >-
    The skeletal lesion is a failure to clear chondroid tissue during
    ossification, leaving radiolucent islands of cartilage inside vertebral and
    metaphyseal bone. Those enchondroma-like lesions are what distinguish SPENCD
    from every other spondylometaphyseal dysplasia on a radiograph.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    modifier: ABNORMAL
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPENCD can be differentiated from other spondylometaphyseal dysplasias by the presence of bone enchondromas which are radiographic radiolucent spondylar and metaphyseal lesions caused by persistence of chondroid tissue within the ossified bones
    explanation: >-
      Describes exactly the lesion this node names and its discriminating value.
  downstream:
  - target: Spondylometaphyseal Skeletal Dysplasia
    description: >-
      The retained chondroid islands, together with vertebral flattening and
      metaphyseal change, constitute the clinical skeletal dysplasia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37010587
      reference_title: >-
        Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Spondyloenchondrodysplasia (SPENCD, OMIM# 271550) is a very rare autosomal recessive spondylometaphyseal dysplasia characterized by variable degrees of metaphyseal changes, enchondromas, platyspondyly and short stature.
      explanation: >-
        Names the components of the expressed skeletal phenotype.
- name: Spondylometaphyseal Skeletal Dysplasia
  biological_scale: ORGANISM
  description: >-
    Platyspondyly, metaphyseal enchondroma-like lesions and short stature. Short
    stature was present in every patient of one recent series, making it the most
    consistent skeletal feature, and at least one patient with coexisting growth
    hormone deficiency responded to growth hormone.
  evidence:
  - reference: PMID:39853520
    reference_title: >-
      Clinical, laboratory, and molecular characteristics of patients with spondyloenchondrodysplasia: a case series study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients exhibited short stature and skeletal abnormalities.
    explanation: >-
      Cohort evidence that the skeletal phenotype and short stature are
      universal.
- name: Systemic Autoimmunity
  biological_scale: ORGANISM
  description: >-
    A broad autoimmune spectrum: systemic lupus erythematosus, autoimmune
    thrombocytopenia, autoimmune haemolytic anaemia, hypothyroidism, Sjogren
    syndrome, inflammatory myositis, Raynaud phenomenon and vitiligo. It affected
    22 of 26 patients in the largest survey and is usually the presenting problem.
  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 22 of 26 patients manifested autoimmune disease, most frequently autoimmune thrombocytopenia and systemic lupus erythematosus.
    explanation: >-
      Cohort frequency and the commonest autoimmune manifestations.
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of particular note was the diverse spectrum of autoimmune phenotypes observed in these individuals (cases), including systemic lupus erythematosus, Sjögren's syndrome, hemolytic anemia, thrombocytopenia, hypothyroidism, inflammatory myositis, Raynaud's disease and vitiligo.
    explanation: >-
      Source for the breadth of the autoimmune spectrum described here.
- name: Intracranial Calcification and Spastic Neurological Disease
  biological_scale: ORGANISM
  description: >-
    Basal ganglia calcification with spasticity, and variably developmental
    delay, epilepsy and ataxia. In some families the neurological picture is
    severe enough to mask the skeletal and immune features and delay diagnosis
    until exome sequencing is performed.
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All our patients had spasticity with variable associations of motor and mental delay or epilepsy. All except for one patient had bilateral calcification in the basal ganglia.
    explanation: >-
      Cohort evidence for the neurological syndrome and its calcification
      component.
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such variable phenotypic presentations were masking the disease and led to the delay in diagnosis until exome sequencing was used revealing homozygous variants in the ACP5 gene as the cause of the patients' phenotype.
    explanation: >-
      Documents the diagnostic delay caused by a neurology-dominant
      presentation.
mechanistic_hypotheses:
- hypothesis_group_id: opn_tlr9_pdc
  hypothesis_label: Osteopontin-TLR9 Model of Interferon Activation
  status: EMERGING
  description: >-
    The leading account of how a lysosomal phosphatase deficiency becomes an
    interferonopathy. TRAP dephosphorylates osteopontin; in its absence,
    phosphorylated osteopontin persists in plasmacytoid dendritic cells and
    sustains TLR9 signalling, driving type I interferon production. The model
    originates in mouse work and is put forward as a suggestion rather than an
    established pathway - the 2025 review's own framing is that the
    immunopathology of SPENCD remains unclear despite decades of TRAP research.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Subsequently, based on earlier work in mouse (12), it was suggested that the immunological features of SPENCD might relate to a failure of mutant TRAP to dephosphorylate osteopontin (OPN) in plasmacytoid dendritic cells (pDCs), leading to persistent Toll-like receptor 9 (TLR9) signalling (13).
    explanation: >-
      States the model and, in its hedged wording, its status as a proposal
      rather than a demonstrated mechanism.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      the immunopathology of SPENCD remains unclear
    explanation: >-
      The review's explicit statement that the mechanism is unresolved, which is
      why this is recorded as an emerging hypothesis and not as settled
      pathophysiology.

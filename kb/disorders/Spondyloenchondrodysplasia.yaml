treatments:
- name: Immunosuppressive therapy for the autoimmune manifestations
  description: >-
    Immunomodulatory treatment directed at the autoimmune disease. Notably, the
    interferon signature normalised in one treated patient with significant
    autoimmune disease, which has been proposed as a marker of therapeutic
    response rather than merely of disease control.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_phenotypes:
  - preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  target_mechanisms:
  - target: Enhanced Type I Interferon Signalling
    treatment_effect: INHIBITS
    description: >-
      Suppression of the interferon-driven autoimmune process, with the ISG
      signature as the readout.
    evidence:
    - reference: PMID:26951490
      reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the absence of an interferon signature following immunomodulatory treatments in a patient with significant autoimmune disease may indicate a therapeutic response important for the immune manifestations of spondyloenchondrodysplasia
      explanation: >-
        A single-patient observation, hedged by its authors, which is why this
        mechanism link is recorded as partially supported.
  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutation positive patients did not demonstrate an upregulation of ISGs, including one patient with significant autoimmune disease controlled by immunosuppressive therapy.
    explanation: >-
      Documents autoimmune disease controlled on immunosuppression in a
      molecularly confirmed patient.
- name: JAK1/2 inhibition
  description: >-
    Janus kinase inhibition is the treatment that acts on the disease mechanism
    rather than around it: by blocking signalling downstream of the type I
    interferon receptor it targets the interferonopathy directly, and reported
    benefit is concentrated in the systemic autoimmune features. The evidence is
    a tabulated case series in a review rather than a trial, so the claim here
    is apparent efficacy, not established efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: JAK inhibitor
      term:
        id: NCIT:C172200
        label: JAK Inhibitor
  target_phenotypes:
  - preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  target_mechanisms:
  - target: Enhanced Type I Interferon Signalling
    treatment_effect: INHIBITS
    description: >-
      Blocks JAK-dependent signal transduction downstream of the type I
      interferon receptor, the node this disease is built on.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The apparent efficacy of JAK1/2 /JAK1/3 inhibition in affected patients
      explanation: >-
        Reported efficacy of JAK inhibition in SPENCD patients, hedged by its
        authors as apparent and drawn from tabulated cases rather than a trial.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Table S3 shows the data provided on patients recorded in Table S1 treated using JAK inhibition.
    explanation: >-
      Establishes that a cohort of SPENCD patients has been treated with JAK
      inhibition and tabulated, which is the evidence base for this treatment.
- name: Growth hormone therapy
  description: >-
    Reported in one patient with coexisting growth hormone deficiency, whose
    height improved from -3.0 to -2.35 standard deviations. This is a
    single-patient observation and does not establish growth hormone as a
    treatment for the skeletal dysplasia itself.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had an associated growth hormone deficiency with fair response to growth hormone therapy (GH) where the height improved from -3.0 SD before GH therapy to -2.35 SD at presentation.
    explanation: >-
      The single reported treated patient, in whom growth hormone deficiency was
      a comorbidity rather than a feature of the dysplasia.
diagnosis:
- name: Skeletal radiography for enchondroma-like lesions
  description: >-
    Radiographs showing radiolucent spondylar and metaphyseal chondroid lesions
    with platyspondyly. This combination is what separates SPENCD from other
    spondylometaphyseal dysplasias and should prompt ACP5 testing.
  results: >-
    Platyspondyly with enchondroma-like radiolucent metaphyseal and vertebral
    lesions.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPENCD can be differentiated from other spondylometaphyseal dysplasias by the presence of bone enchondromas which are radiographic radiolucent spondylar and metaphyseal lesions caused by persistence of chondroid tissue within the ossified bones
    explanation: >-
      Establishes the radiographic discriminator on which diagnosis is raised.
- name: ACP5 sequencing
  description: >-
    Molecular confirmation. Because neurological presentations can mask the
    skeletal and immune features, exome sequencing has repeatedly been the route
    to diagnosis rather than targeted testing.
  results: Biallelic ACP5 loss-of-function variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing was performed and revealed four ACP5 variants: c.629C > T (p.Ser210Phe), c.526C > T (p.Arg176Ter), c.742dupC (p.Gln248ProfsTer3) and c.775G > A (p.Gly259Arg).
    explanation: >-
      Documents exome sequencing as the diagnostic route in a recent series.
- name: Interferon signature testing
  description: >-
    Whole-blood ISG expression supports the diagnosis and places the disorder
    among the interferonopathies, but a normal score does not exclude SPENCD,
    particularly in a treated patient.
  results: Upregulated interferon-stimulated gene expression in most patients.
  diagnosis_term:
    preferred_term: molecular diagnostic method
    term:
      id: NCIT:C18194
      label: Molecular Diagnostic Method
  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the majority of patients tested we detected upregulated expression of interferon-stimulated genes (ISGs), in keeping with the autoimmune phenotype and the likely immune-regulatory function of the deficient protein tartrate resistant acid phosphatase (TRAP).
    explanation: >-
      Supports ISG testing as a diagnostic adjunct while establishing that it is
      not universal.
differential_diagnoses:
- name: Systemic lupus erythematosus
  description: >-
    Sporadic SLE is the diagnosis many patients carry before the skeletal
    dysplasia is recognised, and one SPENCD patient was originally reported in
    1958 as a child with a skeletal dysplasia and SLE, only receiving a molecular
    diagnosis at 63.
  distinguishing_features:
  - Platyspondyly and enchondroma-like metaphyseal lesions on radiography
  - Biallelic ACP5 variants with absent TRAP protein
  - Intracranial calcification with spasticity
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lausch and colleagues (9) made a molecular diagnosis of SPENCD in a 63-year-old male first reported in 1958 as a 10-year-old child with a skeletal dysplasia and systemic lupus erythematosus (SLE) (11).
    explanation: >-
      A concrete instance of the diagnostic confusion this differential
      describes.

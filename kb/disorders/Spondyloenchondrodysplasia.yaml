        id: CHEBI:8382
        label: prednisone
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:26951490
    reference_title: >-
      Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the absence of an interferon signature following immunomodulatory treatments in a patient with significant autoimmune disease may indicate a therapeutic response important for the immune manifestations of spondyloenchondrodysplasia
    explanation: >-
      A single-patient observation, hedged by its authors, which is why this mechanism link is
      recorded as partially supported.
  - reference: PMID:26951490
    reference_title: >-
      Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two mutation positive patients did not demonstrate an upregulation of ISGs, including one patient with significant autoimmune disease controlled by immunosuppressive therapy.
    explanation: >-
      Documents autoimmune disease controlled on immunosuppression in a molecularly confirmed
      patient.
  - reference: PMID:40786056
    reference_title: "Case Report: Successful treatment of spondyloenchondrodysplasia with immune dysregulation using tofacitinib and ruxolitinib: a report of two pediatric cases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering the long history of oral glucocorticoid treatment and the poor

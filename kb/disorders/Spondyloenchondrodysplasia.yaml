notes: >-
  Curated to open ISDS Nosology group 12 (Spondylometaphyseal dysplasias), row
  NOS 12-0010. Entry name uses the short form "Spondyloenchondrodysplasia"
  because OMIM 271550 has been merged into 607944 and the "with immune
  dysregulation" qualifier no longer distinguishes a separate entity; the MONDO
  label retains it and is reproduced exactly on disease_term as term validation
  requires. The osteopontin-TLR9 route from TRAP deficiency to interferon
  activation is recorded as a mechanistic hypothesis with EMERGING status rather
  than as settled pathophysiology, following the 2025 review's own assessment.

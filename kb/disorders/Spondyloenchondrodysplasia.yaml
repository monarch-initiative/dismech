- name: Supportive Skeletal and Developmental Management
  description: >-
    No therapy modifies the skeletal dysplasia. Management is orthopaedic and
    developmental, directed at limb pain and bowing, stature, and learning support.
    The response of skeletal dysplasias to growth hormone is contested and no
    SPENCD-specific data exist.

    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Acp5-null mice are viable under laboratory conditions but suffer from
      developmental deformities of the limb and axial skeleton
    explanation: >-
      The null mouse establishes that loss of TRAP is sufficient for a skeletal
      dysplasia independent of any immune phenotype.
  downstream:
  - target: Vertebral and Metaphyseal Dysplasia
    causal_link_type: DIRECT
    description: >-
      Failure of cartilage-to-bone transition at the growth plate produces the
      persisting islands of chondroid tissue and the vertebral flattening that
      named the disorder.
    evidence:
    - reference: PMID:37010587
      reference_title: >-
        Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5
        variants with variable neurological presentations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Spondyloenchondrodysplasia (SPENCD, OMIM# 271550) is a very rare autosomal recessive spondylometaphyseal dysplasia characterized by variable degrees of metaphyseal changes, enchondromas, platyspondyly and short stature.
      explanation: >-
        Names the components of the expressed skeletal phenotype.
    - reference: PMID:40786056
      reference_title: "Case Report: Successful treatment of spondyloenchondrodysplasia with immune dysregulation using tofacitinib and ruxolitinib: a report of two pediatric cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with SPENCDI often exhibit areas where cartilage cannot transition
        into bone, as well as non-cancerous growths of cartilage.
      explanation: >-
        Names the failed cartilage-to-bone transition as the tissue-level basis of
        the enchondroma-like lesions.
- name: Vertebral and Metaphyseal Dysplasia
  biological_scale: TISSUE
  description: >-
    The radiographic core of the disorder: platyspondyly with irregular upper and
    lower vertebral end plates and posterior nodular lesions, together with
    radiolucent punched-out non-ossifying lesions running from the growth plate
    into the metaphysis and diaphysis, typically at the distal femur, proximal
    fibula, and distal radius and ulna.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic skeletal radiological features of SPENCD are (1)
      platyspondyly, with irregularity of both upper and lower end plates and
      nodular lesions particularly involving the posterior aspect of the vertebral
      bodies
    explanation: Defines the vertebral component of the radiographic phenotype.
  downstream:
  - target: Platyspondyly
    causal_link_type: DIRECT
    description: >-
      The vertebral lesion of the dysplasia read on plain radiography as flattened
      bodies with irregular end plates.
  - target: Metaphyseal Enchondroma-like Lesions
    causal_link_type: DIRECT
    description: >-
      The metaphyseal lesion read as radiolucent punched-out non-ossifying areas
      running from the growth plate into the metaphysis and diaphysis.
  - target: Disproportionate Short Stature
    causal_link_type: DIRECT
    description: >-
      Combined spinal and long-bone dysplasia reduces stature, with the short-trunk
      or short-limb pattern depending on which compartment dominates.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with SPENCD may be of reduced stature, due to short trunk
        and/or limbs depending on the relative degree of spinal and long bone
        dysplasia.
      explanation: >-
        Attributes the short stature directly to the spinal and long-bone dysplasia
        rather than to a separate growth-axis defect.

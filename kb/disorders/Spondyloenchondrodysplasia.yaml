  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compiled clinical, genetic and serological data from a total of 26 patients from 18 pedigrees, all with biallelic ACP5 mutations.
    explanation: >-

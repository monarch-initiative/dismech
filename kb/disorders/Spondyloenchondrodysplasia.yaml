    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had an associated growth hormone deficiency with fair response to growth hormone therapy (GH) where the height improved from -3.0 SD before GH therapy to -2.35 SD at presentation.
    explanation: >-
      The single reported treated patient, in whom growth hormone deficiency was a comorbidity

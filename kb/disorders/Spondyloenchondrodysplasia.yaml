name: Spondyloenchondrodysplasia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondyloenchondrodysplasia with immune dysregulation (SPENCD/SPENCDI; OMIM
  #607944) is an ultra-rare autosomal recessive immuno-osseous dysplasia caused
  by biallelic loss-of-function variants in ACP5, which encodes tartrate-resistant
  acid phosphatase (TRAP), a lysosomal metallophosphoesterase of the mononuclear
  phagocyte lineage and of osteoclasts. Three organ systems are involved in
  varying combination: a skeletal dysplasia with platyspondyly and radiolucent
  enchondroma-like metaphyseal lesions; neurological disease with spasticity,
  intracranial calcification, and learning difficulty; and a striking
  predisposition to systemic autoimmunity — immune thrombocytopenia, systemic
  lupus erythematosus, autoimmune haemolytic anaemia, and hypothyroidism being
  the commonest diagnoses. Loss of TRAP phosphatase activity leaves osteopontin
  hyperphosphorylated, which is the proposed route to persistent TLR9 signalling
  in plasmacytoid dendritic cells and the elevated type I interferon activity that
  places SPENCD among the type I interferonopathies. The skeletal arm is
  separately explained by the osteoclast and growth-plate roles of TRAP, which the
  Acp5-null mouse reproduces without any autoimmune phenotype. That split — a
  mouse that models the bone but not the immunity — is the central unresolved
  question of the disorder.
disease_term:
  preferred_term: spondyloenchondrodysplasia with immune dysregulation
  term:
    id: MONDO:0011939
    label: Spondyloenchondrodysplasia with immune dysregulation
synonyms:
- SPENCD
- SPENCDI
- Spondyloenchondrodysplasia
- Spondyloenchondromatosis
- Roifman-Melamed syndrome
- Immuno-osseous dysplasia with spondyloenchondrodysplasia
- TRAP deficiency
- ACP5-related spondyloenchondrodysplasia
parents:
- hereditary disease
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), Table 1 group 12 "Spondylometaphyseal dysplasias (SMD)",
      entry NOS 12-0010, listed as "Spondyloenchondrodysplasia with immune
      dysregulation (SPENCD), ACP5-related" (AR, ACP5, MIM 607944). Group 12 is
      the combined vertebral-plus-metaphyseal group; SPENCD earns its place on
      the platyspondyly and metaphyseal lesions, not on the autoimmunity.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: 0.0
  notes: >-
    A 2025 review counted 90 molecularly proven cases across 27 published
    reports, four decades after the first clinical description in 1976. Reported
    families are heavily enriched for consanguinity. No population-based
    incidence or prevalence figure exists, and the review is explicit that its
    case-collection approach cannot yield one; rate_per_100000 is recorded as 0.0
    only to mark that the true rate is far below the resolution of any published
    survey.
  evidence:
  - reference: PMID:26951490
    reference_title: >-
      Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compiled clinical, genetic and serological data from a total of 26 patients from 18 pedigrees, all with biallelic ACP5 mutations.
    explanation: >-
      The size of the largest reported cohort, standing in for a population estimate that does
      not exist.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a review of the 90 molecularly proven cases of SPENCD that we have been able
      to identify in the literature
    explanation: >-
      Establishes the cases-in-literature scale of the disorder at roughly 90
      molecularly confirmed individuals worldwide.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the absence of a comprehensive prospective survey of affected patients
      within a defined geographical region, such an approach carries a risk of
      ascertainment bias and imperfect definition of both the frequency of
      individual disease features and the full spectrum of the clinical phenotype,
      as well as precluding the derivation of accurate figures on incidence and
      prevalence.
    explanation: >-
      The review states directly that no accurate incidence or prevalence figure
      can be derived, which is why this record is a case count rather than a rate.
  - reference: PMID:42459138
    reference_title: A Multicenter Integrative Cohort Characterizing the Genetic, Clinical, and Transcriptomic Features of ACP5 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 17 patients with ACP5 deficiency from Egypt and China,
      discovering five novel pathogenic variants
    explanation: >-
      A 2026 multicentre cohort adds 17 further molecularly confirmed patients on top
      of the 90 tallied in the 2025 review, so the published caseload is now over a
      hundred and still rising.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SPENCD segregates as an autosomal recessive trait. Affected individuals carry
    homozygous or compound heterozygous ACP5 alleles; heterozygous parents are
    clinically unaffected and retain roughly half-normal serum TRAP activity.
    Reported cohorts are markedly enriched for parental consanguinity, consistent
    with the low population frequency of pathogenic ACP5 alleles.
  evidence:
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations segregated with the disease in the families investigated, and
      all parents tested were heterozygous for a relevant familial mutation.
    explanation: >-
      Biallelic segregation with unaffected heterozygous parents establishes
      autosomal recessive inheritance.
  - reference: PMID:21217752
    reference_title: "Genetic deficiency of tartrate-resistant acid phosphatase associated with skeletal dysplasia, cerebral calcifications and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped a locus in five consanguineous families to chromosome 19p13 and
      identified mutations in ACP5, which encodes tartrate-resistant phosphatase
      (TRAP), in 14 affected individuals
    explanation: >-
      Homozygosity mapping in consanguineous pedigrees is the recessive-model
      design that localised and identified the gene.
genetic:
- name: Biallelic ACP5 Loss-of-Function Variants
  gene_term:
    preferred_term: ACP5
    term:
      id: hgnc:124
      label: ACP5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    ACP5 (NM_001611.5) lies at 19p13.2 and comprises five exons encoding the
    325-amino-acid TRAP protein. Reported pathogenic alleles span missense,
    nonsense, frameshift, and whole-gene deletion classes and are distributed
    throughout the gene, with no genotype-phenotype correlation recognised. The
    missense alleles behave as functional nulls: expressed but catalytically dead,
    not proteolytically processed to the 5b isoform, and in most cases not
    secreted.
  evidence:
  - reference: PMID:39853520
    reference_title: >-
      Clinical, laboratory, and molecular characteristics of patients with
      spondyloenchondrodysplasia: a case series study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NM_001611.5 (ACP5): c.772_790del p.(Ser258TrpfsTer39) frameshift variant was identified in all patients.
    explanation: >-
      Source for the shared frameshift allele noted here.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We list 45 distinct mutations (28 missense substitutions; 8 STOP and 7
      frameshift mutations; 2 large deletions) distributed throughout the gene
    explanation: Gives the allelic spectrum and its distribution across the gene.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      showing that while expressed, all mutants lacked enzymatic activity
    explanation: >-
      Recombinant characterisation of the eight founding missense substitutions
      shows they are catalytically null, which is why missense and truncating
      alleles converge on one phenotype.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We are unaware of any patients conforming to the classical SPENCD phenotype
      being negative for mutations in ACP5, suggesting that the disease is
      genetically homogeneous.
    explanation: >-
      Supports treating SPENCD as a single-gene disorder rather than a
      locus-heterogeneous radiographic category.
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of ACP5, encoding tartrate-resistant acid phosphatase, identified
      biallelic mutations in each of the cases studied, and in vivo testing
      confirmed a loss of expressed protein.
    explanation: >-
      The founding report establishes both the gene and that the mechanism is loss
      of expressed protein.
mechanistic_hypotheses:
- hypothesis_group_id: opn_tlr9_pdc
  hypothesis_label: Osteopontin-TLR9 Model of Interferon Activation
  status: EMERGING
  description: >-
    The leading account of how a lysosomal phosphatase deficiency becomes an
    interferonopathy. TRAP dephosphorylates osteopontin; in its absence,
    phosphorylated osteopontin persists in plasmacytoid dendritic cells and
    sustains TLR9 signalling, driving type I interferon production. The model
    originates in mouse work and is put forward as a suggestion rather than an
    established pathway - the 2025 review's own framing is that the
    immunopathology of SPENCD remains unclear despite decades of TRAP research.
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subsequently, based on earlier work in mouse (12), it was suggested that the immunological features of SPENCD might relate to a failure of mutant TRAP to dephosphorylate osteopontin (OPN) in plasmacytoid dendritic cells (pDCs), leading to persistent Toll-like receptor 9 (TLR9) signalling (13).
    explanation: >-
      States the model and, in its hedged wording, its status as a proposal
      rather than a demonstrated mechanism.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the immunopathology of SPENCD remains unclear
    explanation: >-
      The review's explicit statement that the mechanism is unresolved, which is
      why this is recorded as an emerging hypothesis and not as settled
      pathophysiology.
pathophysiology:
- name: Biallelic ACP5 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous ACP5 alleles — missense, nonsense,
    frameshift, or whole-gene deletion — remove functional tartrate-resistant acid
    phosphatase. Missense alleles are not partial: they are expressed but
    catalytically inactive, so the initiating lesion is the same across the
    allelic spectrum.
  genes:
  - preferred_term: ACP5
    term:
      id: hgnc:124
      label: ACP5
  evidence:
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observation of biallelic null mutations in four of eight families
      indicated that the SPENCD phenotype results from a loss of TRAP activity.
    explanation: >-
      Null alleles in half the founding families identify loss of TRAP activity,
      not a neomorphic effect, as the initiating lesion.
  downstream:
  - target: Loss of Tartrate-Resistant Acid Phosphatase Activity
    causal_link_type: DIRECT
    description: >-
      Absent or catalytically dead TRAP protein abolishes the enzyme's acid
      phosphatase activity in serum and in the cells that normally express it.
    evidence:
    - reference: PMID:21217752
      reference_title: "Genetic deficiency of tartrate-resistant acid phosphatase associated with skeletal dysplasia, cerebral calcifications and autoimmunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        showed that these mutations abolish enzyme function in the serum and cells
        of affected individuals
      explanation: >-
        Direct enzymatic measurement in patient material links the genotype to
        abolished activity.
- name: Loss of Tartrate-Resistant Acid Phosphatase Activity
  biological_scale: MOLECULAR
  description: >-
    TRAP is a di-iron purple acid phosphatase with a low pH optimum, expressed by
    osteoclasts, macrophages, and dendritic cells. Its activity is undetectable in
    patient serum and leukocyte homogenates and roughly halved in heterozygous
    parents. This node is the point at which the skeletal and immune arms of the
    disorder diverge.
  molecular_functions:
  - preferred_term: acid phosphatase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003993
      label: acid phosphatase activity
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:41049574
    reference_title: >-
      Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type-5 acid phosphatase, also known as tartrate-resistant acid phosphatase (TRAP), is a lysosomal hydrolase expressed in cells of monocytic lineage, with activity against a wide variety of substrates
    explanation: >-
      Establishes the enzyme's cellular distribution, which is what makes a bone enzyme
      deficiency an immune disease.
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity
      and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to five age-matched controls, and an unaffected sibling to patients 2 and 3 who was homozygous for the wild-type allele on gene sequencing, levels of total TRAP protein were negligible, and TRAP 5a protein undetectable, indicating an almost complete lack of TRAP synthesis or secretion in the affected patients tested
    explanation: >-
      Direct patient measurement establishing that the disease state is absence of TRAP protein.
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      levels of total TRAP protein were negligible, and TRAP 5a protein
      undetectable, indicating an almost complete lack of TRAP synthesis or
      secretion in the affected patients tested
    explanation: >-
      Protein-level measurement in patient plasma confirms near-complete absence of
      the enzyme.
  downstream:
  - target: Osteopontin Hyperphosphorylation
    causal_link_type: DIRECT
    hypothesis_groups:
    - opn_tlr9_pdc
    description: >-
      Osteopontin is the best-characterised TRAP substrate; without TRAP its
      phosphoserines are not removed and phosphorylated osteopontin accumulates in
      patient fluids and cells.
    evidence:
    - reference: PMID:21217752
      reference_title: "Genetic deficiency of tartrate-resistant acid phosphatase associated with skeletal dysplasia, cerebral calcifications and autoimmunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Phosphorylated osteopontin, a protein involved in bone reabsorption and in
        immune regulation, accumulates in serum, urine and cells cultured from
        TRAP-deficient individuals.
      explanation: >-
        Demonstrates substrate accumulation in patient material, establishing the
        edge in humans rather than only in model systems.
  - target: Susceptibility to Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TRAP is expressed by macrophages and dendritic cells, and Acp5-null macrophages
      show an altered cytokine profile and reduced bacterial clearance. Infection
      susceptibility in patients is therefore plausibly intrinsic rather than purely
      a consequence of immunosuppressive treatment, though the two are hard to
      separate clinically.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        TRAP-deficient macrophages from Acp5-null mice demonstrate an altered cytokine
        profile and a decreased ability to clear bacteria after infection
      explanation: >-
        Model-organism evidence for an intrinsic innate-immune defect downstream of
        TRAP loss, which is the proposed basis of the clinical infection
        susceptibility.
  - target: Osteoclast and Growth-Plate Dysfunction
    causal_link_type: DIRECT
    description: >-
      TRAP is an osteoclast enzyme; its loss impairs bone resorption and disorders
      the growth plate, the arm of the disorder the Acp5-null mouse reproduces.
    evidence:
    - reference: PMID:41049574
      reference_title: >-
        Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TRAP was identified in human serum and cells >70 years ago, becoming recognized as an important, albeit nonspecific, marker of both bone disease and macrophage activation
      explanation: >-
        Establishes TRAP's standing as a bone-turnover enzyme, the basis for linking its loss to
        the skeletal lesion.
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        these defects include disorganized growth plates indicative of a role for
        TRAP in endochondral ossification, and mild osteopetrosis due to a
        resorptive defect of osteoclasts resulting in defective bone remodelling
      explanation: >-
        The Acp5-null mouse places both the resorptive defect and the growth-plate
        disorganisation immediately downstream of lost TRAP activity.
- name: Osteopontin Hyperphosphorylation
  biological_scale: MOLECULAR
  description: >-
    Osteopontin accumulates in its hyperphosphorylated form. Dephosphorylation of
    osteopontin by TRAP is required for osteoclast migration, and intracellular
    phosphorylated osteopontin has been proposed to couple the TLR9/MyD88
    signalosome to interferon-alpha expression in plasmacytoid dendritic cells.
  biological_processes:
  - preferred_term: protein dephosphorylation
    modifier: DECREASED
    term:
      id: GO:0006470
      label: protein dephosphorylation
  evidence:
  - reference: PMID:40786056
    reference_title: "Case Report: Successful treatment of spondyloenchondrodysplasia with immune dysregulation using tofacitinib and ruxolitinib: a report of two pediatric cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These mutations result in the loss of regulation of TRAP activity on the
      function of osteopontin (OPN), leading to an excess of phosphorylated OPN.
    explanation: >-
      States the substrate-accumulation step as the accepted proximate consequence
      of TRAP loss.
  downstream:
  - target: Persistent TLR9 Signaling in Plasmacytoid Dendritic Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - opn_tlr9_pdc
    description: >-
      The proposed but not formally established link between the substrate defect
      and the interferon phenotype. Whether osteopontin is a physical component of
      the TLR9/MyD88 complex in human plasmacytoid dendritic cells, or whether TRAP
      acts on a different substrate entirely, is unresolved.
    evidence:
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        suggested that the autoimmune features of SPENCD might relate to a failure
        of mutant TRAP to dephosphorylate OPN in pDCs in humans, leading to
        persistent TLR9 signalling
      explanation: >-
        The review presents this as a suggestion rather than a demonstrated
        mechanism, which is why the edge is graded INDIRECT with unknown
        intermediates.
- name: Persistent TLR9 Signaling in Plasmacytoid Dendritic Cells
  biological_scale: CELLULAR
  description: >-
    Knockdown of TRAP in a plasmacytoid dendritic cell line raises
    interferon-alpha protein, interferon-stimulated gene expression, and IRF7
    nuclear translocation on CpG-A stimulation, the in vitro correlate of
    unrestrained TLR9 signalling.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: toll-like receptor 9 signaling pathway
    modifier: INCREASED
    term:
      id: GO:0034162
      label: toll-like receptor 9 signaling pathway
  evidence:
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CpG-A stimulation in a pDC line with stable knockdown of TRAP resulted in
      increased expression of IFN
    explanation: >-
      A TRAP-knockdown plasmacytoid dendritic cell line responds to TLR9 ligand
      with excess interferon, the cell-level basis for this node.
  downstream:
  - target: Type I Interferon Overproduction
    causal_link_type: DIRECT
    hypothesis_groups:
    - opn_tlr9_pdc
    description: >-
      Unrestrained TLR9-driven IRF7 activation in plasmacytoid dendritic cells is
      the proposed cellular source of the systemic interferon signature.
    evidence:
    - reference: PMID:21217755
      reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We did not find evidence of a circulating inducer of interferon activity in
        patient sera (Supplementary Table 4), possibly suggesting an up-regulation
        of type I interferon via a cell-intrinsic mechanism.
      explanation: >-
        The absence of a circulating inducer argues for a cell-intrinsic source,
        consistent with but not proof of the plasmacytoid dendritic cell origin.
- name: Type I Interferon Overproduction
  biological_scale: ORGANISM
  description: >-
    Serum interferon-alpha activity is elevated and whole blood carries an
    interferon-stimulated gene signature in the great majority of patients tested,
    persisting across repeat measurements. This is the finding that classified
    SPENCD as a type I interferonopathy. Whether it drives the pathology or is a
    biomarker of it is not settled.
  biological_processes:
  - preferred_term: type I interferon production
    modifier: INCREASED
    term:
      id: GO:0032606
      label: type I interferon production
  - preferred_term: type I interferon-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:21217755
    reference_title: Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All eight cases assayed showed elevated serum interferon alpha activity, and
      gene expression profiling in whole blood defined a type I interferon
      signature.
    explanation: >-
      Establishes both the elevated interferon activity and the transcriptional
      signature in patients.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type I IFN signalling is enhanced in the majority of patients tested,
      although whether this is a driver of pathology or simply represents a disease
      biomarker remains unclear.
    explanation: >-
      Records that the causal status of the interferon signature is itself an open
      question, which is why downstream edges from this node are hedged.
  downstream:
  - target: Systemic Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained type I interferon exposure is the proposed route to the autoimmune
      phenotype, by analogy with lupus and the other interferonopathies; the
      intervening steps in SPENCD have not been mapped. The therapeutic response to
      JAK inhibition is the strongest evidence that the link is causal.
    evidence:
    - reference: PMID:21217755
      reference_title: >-
        Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity
        and a type I interferon expression signature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings reveal a previously unrecognized link between tartrate-resistant acid phosphatase activity and interferon metabolism and highlight the importance of type I interferon in the genesis of autoimmunity.
      explanation: >-
        The discovery paper's own statement of the interferon-to-autoimmunity link.
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The apparent efficacy of JAK1/2 /JAK1/3 inhibition in affected patients
        (Table S3), particularly relating to features of systemic autoimmunity
      explanation: >-
        Blocking signalling downstream of the interferon receptor improves the
        autoimmune features, which supports but does not prove the causal edge.
  - target: Interferon-Associated CNS Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Spasticity with intracranial calcification is the neurological signature
      shared with Aicardi-Goutieres syndrome and other type I interferonopathies,
      which is the basis for placing it downstream of interferon rather than of the
      skeletal arm. No mechanism has been established, and JAK inhibition has not
      clearly reversed the neurological features.
    evidence:
    - reference: PMID:39853520
      reference_title: >-
        Clinical, laboratory, and molecular characteristics of patients with
        spondyloenchondrodysplasia: a case series study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SPENCD exhibits similarities with other type I interferonopathies, including increased levels of type I interferon and specific neurological symptoms
      explanation: >-
        Links the neurological phenotype to the shared interferonopathy mechanism.
    - reference: PMID:41049574
      reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        with the spasticity and intracranial calcification seen in SPENCD typical
        of a subset of type I interferonopathies
      explanation: >-
        Places the neurological features in the interferonopathy pattern, which is
        a phenotypic analogy rather than a demonstrated mechanism.
- name: Systemic Autoimmunity
  biological_scale: ORGANISM
  description: >-
    At least one autoimmune diagnosis is recorded in the large majority of
    patients, and a third carry three or more. Immune thrombocytopenia, systemic
    lupus erythematosus, autoimmune haemolytic anaemia, and hypothyroidism are the
    commonest; antinuclear and anti-dsDNA antibodies are near-universal. The
    thrombocytopenia is characteristically treatment-refractory and has caused
    death and intracranial haemorrhage.
  evidence:
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity
      and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of particular note was the diverse spectrum of autoimmune phenotypes observed in these individuals (cases), including systemic lupus erythematosus, Sjögren's syndrome, hemolytic anemia, thrombocytopenia, hypothyroidism, inflammatory myositis, Raynaud's disease and vitiligo.
    explanation: >-
      Source for the breadth of the autoimmune spectrum described here.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      at least one autoimmune diagnosis was recorded in 22 patients overall (85%),
      with 9 (34%) assigned 3 or more such diagnoses
    explanation: Quantifies the autoimmune burden in the best-characterised cohort.
  - reference: PMID:42459138
    reference_title: A Multicenter Integrative Cohort Characterizing the Genetic, Clinical, and Transcriptomic Features of ACP5 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients showed elevated inflammatory activity, with enrichment of the NF-κB,
      MAPK, and cell death pathways, as well as up-regulation of type I interferon
      (IFN) genes in monocytes.
    explanation: >-
      The 2026 multicentre cohort adds transcriptomic confirmation of elevated
      inflammatory activity; the same sentence names NF-kappaB, MAPK, and cell-death
      pathway enrichment alongside the interferon signature.
  downstream:
  - target: Autoimmune Thrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Immune thrombocytopenia is the commonest single autoimmune diagnosis and the
      one most often responsible for serious harm.
  - target: Systemic Lupus Erythematosus
    causal_link_type: DIRECT
    description: >-
      A third of patients meet ACR criteria for SLE, with near-universal antinuclear
      and frequent anti-dsDNA antibodies.
  - target: Autoimmune Hemolytic Anemia
    causal_link_type: DIRECT
    description: >-
      Coombs-positive haemolysis; co-occurring with the thrombocytopenia it yields a
      diagnosis of Evans syndrome.
  - target: Autoimmune Hypothyroidism
    causal_link_type: DIRECT
    description: Thyroid autoimmunity in around a fifth of patients.
  - target: Celiac Disease
    causal_link_type: DIRECT
    description: >-
      Coeliac disease is among the autoimmune diagnoses recorded in SPENCD cohorts
      and has been the presenting autoimmune feature in a reported case.
  - target: Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Bilateral sensorineural hearing loss has been reported once, severe enough to
      require cochlear implantation. Autoimmune inner-ear disease is the proposed
      route, but the reporting authors could not establish whether the lesion is
      cochlear or central, and skeletal dysplasia itself independently raises the
      rate of hearing loss — so the edge is left with unknown intermediates.
    evidence:
    - reference: PMID:38219511
      reference_title: "Bilateral cochlear implants in a case of spondyloenchondrodysplasia with sensorineural hearing loss: Case report."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Uncontrolled immune system response in autoimmune diseases commonly causes
        bilateral SNHL. However, the exact defect, in this case, is still unknown if
        it is cochlear or central.
      explanation: >-
        The authors propose the autoimmune route while stating the anatomical level
        is unresolved, which is exactly the uncertainty this edge encodes.
- name: Interferon-Associated CNS Involvement
  biological_scale: ORGANISM
  description: >-
    Spasticity, sometimes evident in the first months of life, with calcification
    of the basal ganglia and other sites on computed tomography, and learning
    difficulty in a minority. Unlike Aicardi-Goutieres syndrome, significant
    cerebral white matter disease is unusual.
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5
      variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such variable phenotypic presentations were masking the disease and led to the delay in diagnosis until exome sequencing was used revealing homozygous variants in the ACP5 gene as the cause of the patients' phenotype.
    explanation: >-
      Documents the diagnostic delay caused by a neurology-dominant presentation.
  - reference: PMID:41049574
    reference_title: "Spondyloenchondrodysplasia: An enigmatic immuno-osseus type I interferonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      observed spasticity in 11 patients (44%), and intracranial calcification on
      computed tomography imaging in 9 of 13 patients assessed, variably involving
      the basal ganglia, pons, cerebellar dentate nuclei, and white-grey matter
      junction
    explanation: >-
      Gives the frequency and anatomical distribution of the two neurological
      features.
  downstream:
  - target: Spasticity
    causal_link_type: DIRECT
    description: >-
      Spasticity is the commonest neurological sign and can be evident within the
      first months of life.
  - target: Intracranial Calcification
    causal_link_type: DIRECT
    description: >-
      Calcification of the basal ganglia and other sites, detectable in early
      infancy.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Motor and cognitive delay accompanying the spasticity. Whether it follows
      from the calcification, the white-matter involvement, or interferon action
      on the developing brain more broadly is not established.
  - target: Learning Difficulty
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Learning difficulty occurs in a minority and its relationship to the
      calcification and spasticity is not established; marked global impairment and
      frank regression both occur.
- name: Osteoclast and Growth-Plate Dysfunction
  biological_scale: CELLULAR
  description: >-
    TRAP loss impairs osteoclast-mediated bone resorption and disorders the
    endochondral growth plate. In the Acp5-null mouse this produces mild
    osteopetrosis with disorganised growth plates and bones that are stronger, not
    weaker, than wild type — consistent with the absence of increased fracture risk
    in SPENCD.
  cell_types:

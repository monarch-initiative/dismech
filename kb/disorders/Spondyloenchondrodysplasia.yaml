      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients except for one had either cellular immunodeficiency (3 patients) or combined immunodeficiency (1 patient).
    explanation: >-
      Documents the immunodeficiency underlying the infection susceptibility.
- name: Global developmental delay
  category: Neurologic
  description: >-
    Motor and cognitive delay accompanies the spasticity in many patients, and
    intellectual disability and autism-spectrum behaviours have been described as
    features that distinguish SPENCD from other interferonopathies.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:37010587
    reference_title: >-
      Spondyloenchondrodysplasia in five new patients: identification of three novel ACP5 variants with variable neurological presentations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spondyloenchondrodysplasia (SPENCD) is an immune-osseous disorder caused by biallelic variants in ACP5 gene and is less commonly associated with neurological abnormalities such as global developmental delay, spasticity and seizures.
    explanation: >-
      Names global developmental delay among the neurological features.
biochemical:
- name: Plasma tartrate-resistant acid phosphatase
  presence: Absent or negligible
  context: >-
    Total TRAP protein is negligible and the TRAP 5a isoform undetectable in
    affected individuals, including those homozygous for missense alleles. The
    assay is therefore a direct functional readout of the genetic lesion.
  evidence:
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      levels of total TRAP protein were negligible, and TRAP 5a protein undetectable, indicating an almost complete lack of TRAP synthesis or secretion in the affected patients tested
    explanation: >-
      Direct measurement of the biochemical defect.
- name: Interferon-stimulated gene expression score
  presence: Elevated
  context: >-
    Whole-blood ISG expression is raised in most patients and is the practical
    biomarker of the interferonopathy. It is not universal, and immunosuppression
    appears able to normalise it.
  evidence:
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the majority of patients tested we detected upregulated expression of interferon-stimulated genes (ISGs), in keeping with the autoimmune phenotype and the likely immune-regulatory function of the deficient protein tartrate resistant acid phosphatase (TRAP).
    explanation: >-
      Establishes the ISG score as elevated in most molecularly confirmed
      patients.
genetic:
- name: ACP5
  association: Causal biallelic variant
  gene_term:
    preferred_term: ACP5
    term:
      id: hgnc:124
      label: ACP5
  notes: >-
    Biallelic loss-of-function variants, including whole-gene deletion, nonsense,
    frameshift and destabilising missense alleles. Founder effects occur: a
    single frameshift allele accounted for all nine patients at one centre.
  evidence:
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of ACP5, encoding tartrate-resistant acid phosphatase, identified biallelic mutations in each of the cases studied, and in vivo testing confirmed a loss of expressed protein.
    explanation: >-
      Establishes ACP5 as the causal gene with functional confirmation.
  - reference: PMID:39853520
    reference_title: >-
      Clinical, laboratory, and molecular characteristics of patients with spondyloenchondrodysplasia: a case series study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NM_001611.5 (ACP5): c.772_790del p.(Ser258TrpfsTer39) frameshift variant was identified in all patients.
    explanation: >-
      Source for the shared frameshift allele noted here.

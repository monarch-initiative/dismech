classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 12
      "Spondylometaphyseal dysplasias (SMD)", row NOS 12-0010
      "Spondyloenchondrodysplasia with immune dysregulation (SPENCD),
      ACP5-related" (MIM 607944, autosomal recessive). OMIM formerly separated
      SPENCD (271550) from SPENCD with immune dysregulation (607944); the
      molecularly confirmed cohorts showed these are one disorder, and 271550
      has since been incorporated into 607944.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ACP5 loss-of-function variants; many reported families are
    consanguineous and homozygous for a private or founder allele.
  evidence:
  - reference: PMID:21217755
    reference_title: >-
      Tartrate-resistant acid phosphatase deficiency causes a bone dysplasia with autoimmunity and a type I interferon expression signature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of ACP5, encoding tartrate-resistant acid phosphatase, identified biallelic mutations in each of the cases studied, and in vivo testing confirmed a loss of expressed protein.
    explanation: >-
      Establishes biallelic ACP5 loss of function as the cause across the
      discovery cohort.
  - reference: PMID:26951490
    reference_title: "Spondyloenchondrodysplasia Due to Mutations in ACP5: A Comprehensive Survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We compiled clinical, genetic and serological data from a total of 26 patients from 18 pedigrees, all with biallelic ACP5 mutations.
    explanation: >-
      Confirms biallelic inheritance across the largest assembled cohort.
prevalence:

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Crude fractionation of affected CAMLG-CDG fibroblasts showed a significant increase in the amount of STX5 mislocalized to the cytoplasm.
    explanation: The primary measurement, made in the patient's own fibroblasts.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

- name: Altered Lysosomal Cargo Trafficking
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: In conditional Caml-null mouse embryonic fibroblasts, procathepsin D secretion increased and CD222 distribution near the Golgi became diffuse. These observations support altered lysosomal cargo trafficking. Cortical neuronal cultures with partial CAML depletion had reduced cathepsin D, but their STX5 and CD222 localization changes were not statistically significant. These models do not establish lysosomal cargo misrouting in the human patient.
  evidence:
  - reference: PMID:39823474
    reference_title: Tail Anchored protein insertion mediated by CAML and TRC40 links to neuromuscular function in mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: CAML-depleted MEFs showed significantly greater amounts of precursor cathepsin D (procathepsin D) released from serum-starved cells, compared to control cultures
    explanation: Mouse fibroblast secretion supports abnormal handling of lysosomal cargo.
  - reference: PMID:39823474
    reference_title: Tail Anchored protein insertion mediated by CAML and TRC40 links to neuromuscular function in mice.

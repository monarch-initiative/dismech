- name: Depletion of the Golgi v-SNARE BET1L
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: BET1L abundance was 37% of control in patient fibroblasts and 30.3% of untreated levels after CAMLG knockdown in HeLa cells. The membrane/cytoplasmic distribution of remaining BET1L was normal. YKT6 abundance and distribution were normal. BET1L degradation before SNARE-complex incorporation is proposed, but no turnover assay establishes this route.
  evidence:
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This was confirmed by immunoblotting from whole cell lysates, with BET1L levels at 37% and 27% of controls in CAMLG-CDG and GET4-CDG fibroblasts, respectively
    explanation: Quantifies the depletion in the patient's cells and shows it is shared with the other TRC pathway disorder tested.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Distribution of both YKT6 and BET1L between the membranous and cytoplasmic fractions was found to be normal compared to controls
    explanation: The remaining BET1L retains a normal distribution; this does not demonstrate the mechanism of its depletion.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:
  - target: Proposed Golgi SNARE Trafficking Dysfunction
    causal_link_type: UNKNOWN
    description: Reduced BET1L could impair complexes containing STX5; complex assembly was not directly measured.
- name: Proposed Golgi SNARE Trafficking Dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: STX5 mislocalization and BET1L depletion could disturb Golgi SNARE complexes, vesicle fusion, and the positioning of glycoprotein substrates or glycosyltransferases. These intermediate processes remain unmeasured in the CAMLG-CDG patient. Retrograde transport was directly abnormal in GET4-deficient cells and later CAML-deficient mouse models, providing related-system support.
  evidence:
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: It is possible that specific glycoprotein substrates or glycosyltransferases are incorrectly trafficked within the Golgi as a downstream effect of Golgi SNARE complex dysfunction, leading to specific defective glycosylation.
    explanation: The authors propose trafficking as an explanation; the responsible substrate and causal sequence were not tested.

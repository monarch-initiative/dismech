- name: Depletion of the Golgi v-SNARE BET1L
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    BET1L (GS15) is itself a tail-anchored protein, and unlike STX5 it is not
    merely displaced: total cellular levels fall to 37% of control in patient
    fibroblasts and to 30% on CAMLG knockdown in HeLa cells. The distribution
    between membrane and cytosol is normal, which is consistent with the
    proposal that poorly inserted BET1L is degraded before it can join an STX5
    SNARE complex. YKT6, a Golgi SNARE that does not depend on the TRC pathway
    for insertion, is unaffected in both level and distribution - the internal
    control that makes the BET1L result specific.
  biological_processes:

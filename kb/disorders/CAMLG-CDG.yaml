- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CAMLG variants. The single reported individual is homozygous for
    the intronic splice variant c.633 + 4A>G (NM_001745.4), the child of
    fourth-degree cousins, and the variant segregated in an autosomal recessive
    fashion on trio whole genome analysis. With one family reported, nothing is
    known about allelic heterogeneity, and the usual 25% sibling recurrence risk
    for an autosomal recessive trait is the counselling figure by inheritance
    mode rather than by observation in this disease.
  evidence:

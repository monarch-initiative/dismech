- name: Syntaxin-5 Mislocalisation to the Cytosol
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: Both STX5 isoforms were more cytosolic in patient fibroblasts, with about 43% of the short isoform and 9% of the long isoform in the cytoplasmic fraction. Total STX5 abundance remained normal. The localization defect was reproduced by CAMLG knockdown in HeLa cells. It is a proposed research marker of TRC dysfunction; diagnostic sensitivity and specificity are not established.
  evidence:

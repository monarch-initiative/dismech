  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: The reported phenotype is predominantly neurological, with severe developmental impairment, epilepsy, abnormal muscle tone and structural brain abnormalities.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: An autosomal recessive inborn error identified by trio whole genome sequencing after a targeted CDG gene panel was negative.
  icimd_category:
  - classification_value: multiple_glycosylation_pathways
    notes: Combined mucin-type O-linked and type II N-linked glycosylation abnormalities were observed in the reported patient.
  - classification_value: vesicular_trafficking
    notes: CAML participates in tail-anchored protein insertion; impaired Golgi trafficking is a proposed downstream mechanism.

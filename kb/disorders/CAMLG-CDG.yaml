- name: Combined Type II N-Linked and Mucin-Type O-Linked Glycosylation Defect
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The biochemical signature of the disease, and the reason it is classified as
    a CDG at all. Serum transferrin isoelectric focusing repeatedly showed a type
    2 pattern; capillary zone electrophoresis showed reduced pentasialo and
    raised trisialo transferrin; MALDI-TOF of serum transferrin N-glycans showed
    a CDG-II pattern. In parallel, apolipoprotein C-III isoelectric focusing
    showed absent asialo and disialo forms with only a trace of monosialo
    apoC-III, which is the standard readout of a mucin-type O-glycosylation
    defect.

    Both arms of the defect are undersialylation of otherwise normally built
    glycans, which is what distinguishes this from the CDG in which the glycan is
    not assembled.

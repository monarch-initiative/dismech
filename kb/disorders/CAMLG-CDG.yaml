- name: Syntaxin-5 Mislocalisation to the Cytosol
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Both the long and short forms of syntaxin-5 are displaced from the membrane
    fraction to the cytosol in patient fibroblasts, with the short form affected
    more than the long form, and the same is seen on siRNA knockdown of CAMLG in
    HeLa cells and in GET4-deficient fibroblasts. Total STX5 protein is normal,
    so this is a localisation defect rather than a stability defect.

    The authors put this forward as a consistent cellular marker of TRC pathway
    dysfunction, which is its practical value: it is the assay that identifies a
    TRC pathway defect in a fibroblast line.

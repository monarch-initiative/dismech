- name: Failure of TRC-Mediated Tail-Anchored Protein Insertion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Tail-anchored proteins carry a single hydrophobic transmembrane domain at
    their C-terminus and therefore cannot use co-translational targeting; they
    are inserted post-translationally by the TRC pathway. Many of the
    ER-targeted substrates of that pathway are SNARE proteins or SNARE
    interactors, which is what makes a membrane-insertion defect present as a
    glycosylation disorder.

    The defect is selective rather than global. Emerin, VAMP7 and VAPB - all
    canonically TRC-dependent - were normally localised in the patient's
    fibroblasts, which the authors attribute to residual CAML or to redundancy
    with the SND pathway.
  biological_processes:
  - preferred_term: tail-anchored membrane protein insertion into ER membrane
    term:
      id: GO:0071816
      label: tail-anchored membrane protein insertion into ER membrane
    modifier: DECREASED
  evidence:

    been seizure-free for four years at the time of publication. This is a single
    observation in a single patient, not a disease-specific recommendation, and
    nothing is known about how CAMLG-CDG epilepsy responds to other agents.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

differential_diagnoses:
- name: GET4-CDG
  description: GET4 deficiency can cause overlapping developmental impairment, seizures, hypotonia, structural brain abnormalities and altered STX5 localization. The original GET4 case had a subtle type II transferrin pattern; broader serum N-glycan analysis and fibroblast glycosylation studies were normal. Clinical overlap warrants molecular testing; distinct findings in single cases do not establish reliable clinical discriminators.
  evidence:
  - reference: PMID:32395830
    reference_title: Mutations in GET4 disrupt the transmembrane domain recognition complex pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He presented with global developmental delay, intellectual disabilities, seizures, facial dysmorphism, and delayed bone age.
    explanation: The GET4-CDG phenotype, for comparison with the phenotype recorded here.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32395830
    reference_title: Mutations in GET4 disrupt the transmembrane domain recognition complex pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: in CDG-0381 fibroblasts, we were unable to find any clear glycosylation abnormality
    explanation: The GET4 comparator does not establish a universal shared cellular glycosylation phenotype.
- name: GET3-CDG (ASNA1-related cardiomyopathy)
  description: Biallelic ASNA1 variants caused rapidly progressive neonatal dilated cardiomyopathy and death in two siblings. Slight transferrin and apoC-III abnormalities were observed, but the authors cautioned that these might be secondary. This phenotype differs from the predominantly neurological CAMLG case, without defining an absolute organ-specific rule for either gene.
  evidence:
  - reference: PMID:31461301
    reference_title: Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Exome sequencing was used to screen for the causative genetic defect in a pair of siblings with rapidly progressive dilated cardiomyopathy and death in early infancy.
    explanation: The primary ASNA1 study directly describes the cardiac presentation in two siblings.
- name: STX5-CDG
  description: Loss of the short STX5 isoform causes a severe multisystem CDG with liver failure, cholestasis, hyperinsulinemic hypoglycemia and skeletal abnormalities. This establishes a related trafficking disorder; it does not prove that the partial STX5 mislocalization in CAMLG-CDG has the same clinical consequences.
  evidence:
  - reference: PMID:34711829
    reference_title: Congenital disorder of glycosylation caused by starting site-specific variant in syntaxin-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After birth, the main clinical problem for both patients IV:9 and IV:10 was progressive liver failure with cholestasis and hyperinsulinemic hypoglycemia
    explanation: The STX5-CDG phenotype, which is hepatic rather than neurological.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
discussions:
- discussion_id: camlg_how_does_trc_failure_injure_the_brain
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What connects altered tail-anchored protein handling to neurological impairment in CAMLG-CDG, and is the glycosylation defect causal or a parallel consequence?
  attaches_to:
  - pathophysiology#Impaired TRC-Mediated Tail-Anchored Protein Insertion
  - pathophysiology#Core 1 O-Glycan Hyposialylation
  - pathophysiology#Altered Lysosomal Cargo Trafficking
  - pathophysiology#Lysosomal Membrane Damage
  - pathophysiology#Spinal Motor Neuron Loss
  rationale: The 2022 patient study measured splicing, protein abundance, SNARE localization and glycosylation, but did not connect them experimentally to neurological impairment. A 2025 study showed motor-neuron loss after neuron-specific Caml deletion, alongside trafficking and lysosomal abnormalities measured mainly in mouse fibroblasts. Partially depleted cortical cultures retained normal neurite growth. These results support a neuronal requirement for CAML while leaving the relevant substrates, cell types and causal order unresolved. Glycosylation, lysosomal damage and altered trafficking could be interacting or parallel consequences; rescue experiments are needed to distinguish them.
  proposed_experiments:
  - experiment_id: exp_camlg_neuronal_model
    name: TRC pathway failure in a human neuronal model

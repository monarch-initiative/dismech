genetic:
- name: CAMLG
  gene_term:
    preferred_term: CAMLG
    term:
      id: hgnc:1471
      label: CAMLG
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    CAMLG encodes CAML, the ER membrane protein that pairs with GET1/WRB to form
    the receptor at the end of the TRC pathway; the protein is also called GET2
    in the trafficking literature, and papers on the pathway may use either
    name. One allele is known in human disease: homozygous c.633 + 4A>G
    (NM_001745.4), causing exon 2 skipping. Nothing can be said about the
    mutational spectrum from one family.

    ClinGen's Congenital Disorders of Glycosylation Gene Curation Expert Panel
    classified the CAMLG-CDG gene-disease relationship as Limited in September
    2024, on one proband in one publication plus experimental and
    model-organism support. Limited is not a negative assertion - it is what a
    correct gene looks like when only one family has been published - but it
    does mean a CAMLG variant reported on a diagnostic panel should be
    interpreted against a gene-disease relationship that is not yet definitive.
  evidence:
  - reference: PMID:35262690
    reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first reported patient with pathogenic variants in CAMLG.
    explanation: >-
      Establishes CAMLG as a disease gene and fixes the size of the evidence
      base.
  - reference: CGGV:assertion_c077f9b7-9845-44dc-8007-be476f7b291e-2024-09-25T160000.000Z
    reference_title: "CAMLG / congenital disorder of glycosylation, type IIz (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CAMLG | HGNC:1471 | congenital disorder of glycosylation, type IIz |
      MONDO:0859357 | AR | Limited | SOP11 | Congenital Disorders of
      Glycosylation Gene Curation Expert Panel | 2024-09-25T16:00:00.000Z
    explanation: >-
      The ClinGen Gene-Disease Validity assertion row: autosomal recessive,
      classified Limited by the CDG expert panel in September 2024.
  - reference: CGGV:assertion_c077f9b7-9845-44dc-8007-be476f7b291e-2024-09-25T160000.000Z
    reference_title: "CAMLG / congenital disorder of glycosylation, type IIz (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is limited evidence to support the relationship between
      CAMLG and Congenital Disorder of Glycosylation, type IIz.
    explanation: >-
      ClinGen's own summary of the strength of the gene-disease relationship,
      which is the honest statement of where this disease stands.
prevalence:
- population: Reported patients worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One reported individual, described in 2022. Every clinical statement in this
    entry has that denominator, which is why no phenotype here carries a
    frequency band. The disease was found by trio whole genome sequencing after
    a CDG gene panel was negative, so ascertainment depends on sequencing
    beyond established CDG genes in a child whose transferrin screen is
    abnormal - a route taken only in specialist settings.
  evidence:
  - reference: PMID:35262690
    reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first reported patient with pathogenic variants in CAMLG.
    explanation: >-
      The caseload at publication, and still the whole of it.
diagnosis:
- name: Serum transferrin and apolipoprotein C-III glycosylation screening
  description: >-
    The entry point is the same as for any suspected CDG: serum transferrin
    isoelectric focusing, which here shows a type 2 pattern, paired with apoC-III
    isoelectric focusing to test the mucin-type O-glycosylation arm. The combined
    abnormality narrows the differential to the Golgi trafficking and homeostasis
    disorders rather than to the N-glycan assembly defects.
  evidence:
  - reference: PMID:35262690
    reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemically, a combined O-linked and type II N-linked glycosylation
      defect was found.
    explanation: >-
      The biochemical finding the screening pair is meant to produce.
- name: Whole genome sequencing after a negative CDG gene panel
  description: >-
    A targeted panel of known CDG genes was negative in this patient, and the
    diagnosis was reached only by trio whole genome analysis. That sequence of
    events is the practical lesson of the case: a type 2 transferrin pattern with
    a negative CDG panel is an indication to sequence more broadly, not to
    abandon the CDG hypothesis. The causal variant is intronic, which is a second
    reason a panel might miss it.
  evidence:
  - reference: PMID:35262690
    reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis using a panel of known ‘CDG genes’ did not reveal any
      potentially pathogenic variants.
    explanation: >-
      The negative panel that made broader sequencing necessary.
- name: Syntaxin-5 mislocalisation in fibroblasts as a TRC pathway marker
  description: >-
    Where a fibroblast line is available, crude fractionation or
    immunofluorescence for syntaxin-5 distinguishes a TRC pathway defect from
    other causes of a combined N-/O-glycosylation abnormality. It is a pathway
    marker, not a gene-specific one: the same mislocalisation is seen in
    GET4-deficient fibroblasts. Reduced BET1L is a second readout of the same
    lesion.
  evidence:
  - reference: PMID:35262690
    reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mislocalization of syntaxin-5 in patient fibroblasts and in siCAMLG deleted
      Hela cells confirms this as a consistent cellular marker of TRC
      dysfunction.
    explanation: >-
      The authors' proposal of STX5 mislocalisation as the cellular marker of
      this pathway's defects.

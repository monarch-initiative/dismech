experimental_models:
- name: CAMLG-CDG patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary fibroblasts from a skin biopsy of the reported patient, homozygous
    for c.633 + 4A>G. Every cellular result in the defining study - exon
    skipping, reduced CAML protein, STX5 mislocalisation, BET1L depletion, PNA
    lectin binding - was obtained here, with GET4-deficient fibroblasts run in
    parallel as a pathway comparator.
  modeled_mechanisms:
  - target: Aberrant CAMLG Splicing and Loss of CAML Protein
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The patient's own cells carrying the patient's own allele, so the splicing
      and protein-level findings are the disease itself rather than a model of
      it.
    readouts:
    - name: Canonical CAMLG transcript level by RT-qPCR
      target: Aberrant CAMLG Splicing and Loss of CAML Protein
      direction: DECREASED
      interpretation: >-
        Negligible canonical transcript, confirming the splice consequence in
        vivo.
      evidence:
      - reference: PMID:35262690
        reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Indeed, on analysis of mRNA from patient fibroblasts, expression of the
          canonical CAMLG transcript was negligible
        explanation: >-
          The transcript measurement behind this readout.
    evidence:
    - reference: PMID:35262690
      reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This variant leads to aberrant splicing and lack of functional protein in
        patient-derived fibroblasts.
      explanation: >-
        Establishes the fibroblast line as informative for this node.
  - target: Syntaxin-5 Mislocalisation to the Cytosol
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      STX5 redistribution was measured here by both crude fractionation and
      colocalisation with the Golgi marker giantin.
    limitations: >-
      Fibroblasts are not the affected tissue. Whether the same SNARE
      abnormality occurs in neurons, which is where the clinical phenotype is,
      has not been tested.
    readouts:
    - name: STX5 colocalisation with giantin
      target: Syntaxin-5 Mislocalisation to the Cytosol
      direction: DECREASED
      interpretation: >-
        Loss of Golgi colocalisation, the imaging correlate of the fractionation
        result.
      evidence:
      - reference: PMID:35262690
        reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The mislocalization of STX5 was also visualized by immunofluorescence
          staining, with significantly lower amounts of STX5 colocalizing with
          the Golgi marker giantin
        explanation: >-
          The imaging measurement behind this readout.
    evidence:
    - reference: PMID:35262690
      reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Crude fractionation of affected CAMLG-CDG fibroblasts showed a
        significant increase in the amount of STX5 mislocalized to the cytoplasm.
      explanation: >-
        The fractionation result in this model.
- name: siRNA CAMLG knockdown in ST6GAL1-GFP HeLa cells
  experimental_model_type: CELL_LINE
  description: >-
    HeLa cells stably expressing GFP-tagged ST6GAL1, transfected twice with
    CAMLG siRNA to leave about 2% residual CAML protein. Used to test whether the
    fibroblast findings are specific consequences of losing CAML, and to
    visualise Golgi morphology through a trans-Golgi sialyltransferase.
  modeled_mechanisms:
  - target: Disordered Golgi SNARE Complexes and Golgi Architecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Acute knockdown reproduced both SNARE abnormalities and, unlike the
      patient's fibroblasts, showed a fragmented Golgi.
    limitations: >-
      An acute siRNA knockdown to near-zero protein in a transformed cell line is
      not the patient's state, who has a hypomorphic allele with residual
      protein. The authors themselves raise the possibility that the Golgi
      fragmentation seen here is a cell-line effect or an artefact of the
      short-term knockdown.
    readouts:
    - name: BET1L steady-state protein level
      target: Disordered Golgi SNARE Complexes and Golgi Architecture
      direction: DECREASED
      interpretation: >-
        BET1L falls to about a third of untreated levels, reproducing the
        fibroblast result.
      evidence:
      - reference: PMID:35262690
        reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Additionally, a significant (P < 0.01) reduction in BET1L steady-state
          levels was observed in whole-cell lysates, to 30.3% of levels in
          untreated cells
        explanation: >-
          The quantified readout in the knockdown model.
    evidence:
    - reference: PMID:35262690
      reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These findings therefore confirmed those identified in affected
        fibroblasts and the essential role of the CAML protein in STX5
        localization and BET1L steady state levels.
      explanation: >-
        The authors' statement of what the knockdown model established.
animal_models:
- name: Camlg knockout mouse
  species: Mouse
  genotype: Camlg (CAML) germline disruption, homozygous null
  publication: PMID:12919676
  description: >-
    Disruption of the mouse CAML gene is lethal in early embryonic development,
    although CAML-deficient cells remain viable. The model predates the human
    disease by nearly two decades and was made to study TACI and EGF receptor
    signalling, not glycosylation.
  modeled_mechanisms:
  - target: Severe Global Developmental Delay
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The complete null does not produce a viable animal with a neurological
      phenotype, so it cannot model the human developmental course.
    limitations: >-
      The mouse is a complete null and dies in early embryogenesis; the reported
      patient carries a hypomorphic splice allele with residual CAML protein and
      survived to at least fourteen years. The two genotypes are not comparable,
      and the defining human study points to exactly this difference as the
      reason the human disorder is compatible with life. A conditional or
      hypomorphic allele would be needed to model the disease.
    evidence:
    - reference: PMID:12919676
      reference_title: "CAML is required for efficient EGF receptor recycling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To study its function in the mouse, we disrupted the CAML gene and found
        it to be required for early embryonic development, but not for cellular
        viability.
      explanation: >-
        The embryonic lethality that prevents this model from reporting on a
        postnatal neurodevelopmental phenotype.
    - reference: PMID:35262690
      reference_title: "CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is perhaps surprising that a homozygous splice-site mutation in CAMLG
        can be compatible with life, given a mouse knockout model is embryonic
        lethal
      explanation: >-
        The defining study's own reading of the gap between the mouse null and
        the human hypomorph.
differential_diagnoses:
- name: GET4-CDG
  description: >-
    The nearest differential, and the one that cannot be separated clinically. A
    defect one step upstream in the same pathway, reported in a boy with global
    developmental delay, intellectual disability, seizures, facial dysmorphism
    and delayed bone age, and a mild type 2 transferrin pattern. His fibroblasts
    show the same STX5 mislocalisation and the same BET1L depletion as this
    disease. The features that differ - facial dysmorphism and skeletal
    involvement, against the almost non-dysmorphic CAMLG patient - rest on one
    case each, so they should not be treated as discriminating. Only sequencing
    separates them.
  evidence:
  - reference: PMID:32395830
    reference_title: "Mutations in GET4 disrupt the transmembrane domain recognition complex pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He presented with global developmental delay, intellectual disabilities,
      seizures, facial dysmorphism, and delayed bone age.
    explanation: >-
      The GET4-CDG phenotype, for comparison with the phenotype recorded here.
- name: GET3-CDG (ASNA1-related cardiomyopathy)
  description: >-
    The third TRC pathway disorder, and the one that shows the pathway does not
    determine the affected organ. Biallelic ASNA1 variants caused rapidly
    progressive dilated cardiomyopathy with death in early infancy in two
    siblings, with abnormal transferrin and apoC-III pointing to the same
    combined glycosylation defect. A child with a combined N-/O-glycosylation
    abnormality and cardiomyopathy rather than a static encephalopathy should be
    worked up towards this gene.
  evidence:
  - reference: PMID:31461301
    reference_title: "Biallelic Variants in ASNA1, Encoding a Cytosolic Targeting Factor of Tail-Anchored Proteins, Cause Rapidly Progressive Pediatric Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified compound heterozygous variants in the highly conserved ASNA1
      gene (arsA arsenite transporter, ATP-binding, homolog), which encodes an
      ATPase required for post-translational membrane insertion of tail-anchored
      proteins.
    explanation: >-
      Establishes ASNA1/GET3 as the third TRC pathway disease gene and its
      cardiac presentation.
- name: STX5-CDG
  description: >-
    The downstream target of the lesion in this disease, mutated in its own
    right. Loss of the short syntaxin-5 isoform gives a severe multisystem CDG
    dominated by liver failure with cholestasis and hyperinsulinaemic
    hypoglycaemia, fatal in infancy - a much more severe and differently
    distributed disease than the partial STX5 mislocalisation seen here. The
    contrast is informative rather than diagnostic: it suggests the TRC pathway
    defect produces a partial STX5 loss of function rather than an absence.
  evidence:
  - reference: PMID:34711829
    reference_title: "Congenital disorder of glycosylation caused by starting site-specific variant in syntaxin-5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After birth, the main clinical problem for both patients IV:9 and IV:10 was
      progressive liver failure with cholestasis and hyperinsulinemic
      hypoglycemia
    explanation: >-
      The STX5-CDG phenotype, which is hepatic rather than neurological.
discussions:
- discussion_id: camlg_how_does_trc_failure_injure_the_brain
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What connects failed tail-anchored protein insertion to the progressive
    encephalopathy of CAMLG-CDG, and is the glycosylation defect on that path or
    beside it?
  attaches_to:
  - "pathophysiology#Neurodevelopmental Failure in TRC Pathway Deficiency"
  - "pathophysiology#Combined Type II N-Linked and Mucin-Type O-Linked Glycosylation Defect"
  rationale: >-
    The cell biology of this disease is worked out and its clinical biology is
    not. STX5 mislocalisation and BET1L depletion are measured facts in patient
    cells; hyposialylation of N- and O-glycans is a measured fact in patient
    serum; the brain atrophy, hypomyelination, epilepsy and developmental arrest
    are measured facts in the patient. No published result joins the first two
    to the third.

    Two readings are open. Either the glycosylation defect is the proximate cause
    of the neurological disease, in which case CAMLG-CDG should behave like other
    hyposialylation CDG; or both are parallel consequences of a
    membrane-insertion failure that also affects tail-anchored proteins with
    neuronal functions unrelated to glycosylation, in which case the transferrin
    pattern is a biomarker rather than a mechanism. The defining study leans
    towards the second, noting the diversity of TA protein substrates, but
    does not test it.

    It matters for what would be worth trying. If the disease is a sialylation
    disorder, sialic acid precursor strategies are at least arguable; if it is a
    membrane-insertion disorder, they are beside the point.
  proposed_experiments:
  - experiment_id: exp_camlg_neuronal_model
    name: TRC pathway failure in a human neuronal model
    description: >-
      Differentiate neurons or cerebral organoids from patient-derived or
      CAMLG-edited iPSC and ask two questions side by side: whether STX5
      mislocalisation and BET1L depletion occur in neural cells at all, and
      whether the tail-anchored proteome of a neuron contains substrates whose
      loss would explain hypomyelination and cortical atrophy independently of
      glycosylation.
    would_support:
    - "pathophysiology#Neurodevelopmental Failure in TRC Pathway Deficiency"
    supporting_outcome:
    - >-
      Neural cells show the SNARE abnormality and a distinct set of
      mislocalised neuronal tail-anchored proteins, with myelination or synaptic
      readouts impaired in proportion.
    refuting_outcome:
    - >-
      Neural cells insert tail-anchored proteins normally, which would move the
      explanation for the brain phenotype away from a cell-autonomous insertion
      defect.
- discussion_id: camlg_single_patient_denominator
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which features of this entry are properties of CAMLG-CDG, and which are
    properties of one boy?
  attaches_to:
  - "phenotypes#"
  - "prevalence#Reported patients worldwide"
  rationale: >-
    One patient has been reported. Every phenotype in this entry is therefore
    present in 100% of the described cohort and in an unknown fraction of the
    disease, which is why no frequency band is asserted anywhere here.

    Some features are more likely than others to generalise. The combined
    transferrin and apoC-III abnormality is mechanistically tied to the lesion
    and is shared with GET4-CDG, so it is probably a disease feature. The severe
    neurological course is shared with GET4-CDG too. The dolichocephaly, the
    absence of dysmorphism, the specific age at which respiratory support became
    necessary, and the responsiveness of the epilepsy to levetiracetam are single
    observations with nothing to compare them to.

    The allele is a further restriction: c.633 + 4A>G is hypomorphic, leaving
    residual CAML protein. A patient with a true null allele might not be
    viable, given the mouse, or might have a different and more severe disease.
    Nothing in this entry should be read as describing the full spectrum of
    CAMLG deficiency.
notes: >-
  Naming. The KB names most CDG entries by gene, the defining publication names
  the disease CAMLG-CDG in its own title, and no other entry in kb/disorders/
  covers CAMLG - so there is no gene-identity collision of the kind that makes a
  roman-numeral entry name preferable (as for ATP6AP2, whose CDG entry is filed
  as Congenital_Disorder_of_Glycosylation_Type_IIr because the gene also causes a
  separately curated non-CDG disease). Hence the gene-named form;
  MONDO:0859357, OMIM 620201 and the roman-numeral form CDG-IIz are carried as
  the bound term and as synonyms. CAML is also called GET2 in the
  membrane-trafficking literature, and a reader searching the TRC/GET pathway
  papers will find the protein under that name.

  GeneReviews. No GeneReviews chapter covers CAMLG-CDG or CAMLG. The committed
  Bookshelf index of all 958 PubMed-indexed GeneReviews chapters (snapshot
  2026-09-10) contains no chapter matching this disease or gene, checked both
  offline and online, which is unsurprising for a disorder with one reported
  patient and no management literature. There is no StatPearls article either.

  Structured sources. ClinGen has a Gene-Disease Validity assertion for CAMLG
  (classification Limited, autosomal recessive, Congenital Disorders of
  Glycosylation Gene Curation Expert Panel, September 2024), cited in the
  genetic section. Orphanet has no corresponding concept: OLS searches of ORDO
  for "CAMLG", "glycosylation type IIz" and "CDG-IIz" each returned zero hits,
  against 99 for "glycosylation" in the same ontology, so the zeroes are
  absence rather than a failed query. Everything else in this entry rests on
  primary literature.

  Frequency bands. Deliberately absent from every phenotype. With one reported
  individual, an OBLIGATE band would assert 100% penetrance of each feature on a
  denominator of one, and any lower band would be invented. The `discussions`
  entry on the single-patient denominator records which features are most likely
  to generalise.

  Pathograph confidence. The chain from the CAMLG variant through loss of CAML,
  failed tail-anchored protein insertion, STX5 mislocalisation and BET1L
  depletion is supported by direct measurement in the patient's own cells. The
  two steps after that - from disordered Golgi SNARE complexes to hyposialylation,
  and from the biochemical defect to the neurological phenotype - are marked
  provisional and hypothetical respectively, because the defining study offers
  both as proposals and says explicitly that the pathomechanism is not
  established.

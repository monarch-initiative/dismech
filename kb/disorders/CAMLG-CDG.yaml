- name: Aberrant CAMLG Splicing and Loss of CAML Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The variant causes skipping of exon 2 and fusion of exons 1 and 3, which on
    the protein level is predicted to give the truncated product
    p.(Glu58ValfsTer80). The canonical full-length cDNA amplicon is absent in
    patient fibroblasts and a shortened amplicon appears in its place, and CAML
    protein is reduced on immunoblotting.

    The residual protein matters for how this disease is read. A complete mouse
    null is embryonically lethal, so the small amount of CAML that survives this
    splice variant is the most likely reason the disorder is compatible with
    life at all - this is a hypomorphic allele, not a demonstrated human null.

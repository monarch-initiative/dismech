name: CAMLG-CDG
creation_date: "2026-09-25T16:30:00Z"
category: Mendelian
disease_term:
  preferred_term: CAMLG-CDG
  term:
    id: MONDO:0859357
    label: congenital disorder of glycosylation, type IIz
description: >-
  CAMLG-CDG (congenital disorder of glycosylation type IIz) is an autosomal
  recessive disorder of the transmembrane domain recognition complex (TRC)
  pathway, the machinery that inserts C-terminally tail-anchored (TA) proteins
  post-translationally into the endoplasmic reticulum membrane. CAMLG encodes
  CAML (also called GET2), which pairs with GET1/WRB to form the ER membrane
  receptor at the end of that pathway. Losing it produces a combined defect of
  mucin-type O-linked and type II N-linked protein glycosylation, and a
  phenotype that is almost entirely neurological.

  The entry rests on a single reported individual, and that denominator governs
  everything below. He was born at term to consanguineous Turkish parents with a
  normal head circumference, was noticed at three months never to have achieved
  head control, was babbling at one year, and then lost his milestones as
  seizures began. At fourteen he had axial hypotonia with limb spasticity and
  contractures, bilateral clonus, no speech beyond sounds, a gastrostomy, and
  intermittent respiratory support; weight and head circumference were both
  below the 3rd centile. Brain MRI at seven years showed a very thin corpus
  callosum, an atrophic brain stem, severe cerebral and cerebellar atrophy and
  diffuse hypomyelination. There was no organomegaly and routine blood counts
  and chemistry were normal - the liver-dominated picture of several other
  Golgi-trafficking CDG is absent here.

  The mechanism is unusually well worked out at the cell-biological end and
  unresolved at the clinical end. In patient fibroblasts and in CAMLG-knockdown
  HeLa cells, syntaxin-5 is mislocalised from the Golgi to the cytosol and the
  Golgi v-SNARE BET1L is depleted to about a third of control levels, which the
  defining study proposes as the route to hyposialylation of both N- and
  O-glycans. What is not established is how any of that produces the
  neurological phenotype: the authors say explicitly that further study is
  needed to elucidate the precise pathomechanism, and the pathograph here marks
  that step as hypothetical rather than asserting it.

  ClinGen classifies the CAMLG gene-disease relationship as Limited, which is
  the appropriate weight for one published proband and is worth carrying
  forward into any diagnostic interpretation of a CAMLG variant.

  CAMLG-CDG is one of three disorders of the TRC pathway, alongside GET4-CDG and
  GET3-CDG (ASNA1). The clinical pictures do not track the pathway position in
  any simple way: GET4-CDG is neurologically similar, while GET3-CDG presents as
  rapidly progressive infantile cardiomyopathy.

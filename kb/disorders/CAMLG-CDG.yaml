- name: Altered Golgi Morphology
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: ST6GAL1-GFP distribution became more fragmented after CAMLG knockdown in HeLa cells while its abundance remained normal. In contrast, patient fibroblasts stained for GM130 or TGN46 showed no obvious Golgi morphological abnormality. COG1, COG4 and COG8 localization was also normal. Morphological disruption is model-dependent and has not been established as a required intermediate in the human glycosylation defect.
  evidence:
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Treated cells showed normal levels of ST6GAL1, but with a more fragmented distribution (Supplementary Material, Fig. S3). This indicated that knockdown of CAMLG expression leads to at least some disorganization of the Golgi.
    explanation: The evidence for Golgi disorganisation, and the model it comes from.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: no obvious morphological abnormalities of the Golgi, such as those seen in COG defects, could be observed in affected CAMLG-CDG or GET4-CDG fibroblasts stained with Golgi markers GM130 or TGN46
    explanation: Patient fibroblasts did not reproduce the visible morphology defect.

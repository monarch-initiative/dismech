- name: Disordered Golgi SNARE Complexes and Golgi Architecture
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    With STX5 partly cytosolic and its preferred partner BET1L depleted, the
    Golgi SNARE complexes that drive intra-Golgi and ER-Golgi fusion cannot be
    assembled normally. The morphological consequence is mild and was detectable
    only in the knockdown model - GFP-tagged ST6GAL1 showed a more fragmented
    distribution after CAMLG silencing, while patient fibroblasts stained for
    GM130 or TGN46 showed no obvious abnormality, and COG complex subunits were
    normally distributed.

    That asymmetry is why this node is provisional rather than established: the
    SNARE measurements are solid in patient cells, but the Golgi disorganisation
    they are supposed to produce was demonstrated in a cell line, not in the
    patient's own fibroblasts.
  biological_processes:

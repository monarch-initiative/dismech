- discussion_id: camlg_single_patient_denominator
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which features of this entry are properties of CAMLG-CDG, and which are properties of one boy?
  attaches_to:
  - phenotypes#
  - prevalence#Reported patients worldwide
  rationale: The clinical spectrum derives from one published individual carrying one homozygous splice-region allele. Population frequencies, penetrance, treatment-response rates and prognostic subgroups cannot be inferred. GET4 clinical overlap and experimental Caml models support related biology but do not independently replicate the human CAMLG-CDG phenotype. Residual CAML may help explain viability, yet the relationship between residual protein, neuronal vulnerability and survival has not been measured in additional human alleles.
notes: The CAML protein is also called GET2 in trafficking literature. Clinical observations in this entry concern the published recessive CAMLG-CDG case; common CAMLG variants studied in adult neurodegenerative-disease risk and unrelated immune-cell functions do not define this syndrome.

- name: Core 1 O-Glycan Hyposialylation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Patient fibroblasts showed increased peanut agglutinin binding to unsialylated core 1 O-glycans without increased Vicia villosa lectin staining. This supports predominantly defective terminal O-glycan sialylation among the tested markers. Serum apoC-III had an abnormal isoform profile, with absent asialo/disialo forms and only a small monosialo signal; the authors interpreted this as an O-glycosylation defect.
  evidence:
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: although PNA lectin fluorescence was barely detectable in control fibroblasts, a strong increase in signal was identified in affected fibroblasts
    explanation: Lectin binding supports increased exposure of unsialylated core 1 O-glycans.
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

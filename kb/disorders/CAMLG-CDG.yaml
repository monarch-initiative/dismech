- name: Spinal Motor Neuron Loss
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: Neuron-specific Caml deletion in SLICK-H-Cre mice caused hindlimb paralysis and a 28% reduction of motor-neuron cell bodies in lumbar spinal-cord sections. Constitutive synapsin-Cre deletion also caused severe early motor impairment. These results support a neuronal requirement for CAML, but neither motor-neuron depletion nor this causal route has been demonstrated in the human splice-variant case. Partially depleted embryonic cortical cultures retained normal neurite growth.
  evidence:
  - reference: PMID:39823474

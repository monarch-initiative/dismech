- name: Lysosomal Membrane Damage
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Caml-null mouse fibroblasts showed increased galectin-3 puncta, colocalization with LAMP1 and enlarged LAMP1-positive structures. These findings indicate lysosomal membrane damage in that model. Lysosomal damage has not been demonstrated in CAMLG-CDG patient cells or shown to mediate motor-neuron loss in vivo.

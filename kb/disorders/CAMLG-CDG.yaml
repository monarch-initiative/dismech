- name: Aberrant CAMLG Splicing
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Patient fibroblasts showed negligible canonical transcript and replacement of the 624-bp canonical RT-PCR amplicon by an approximately 163-bp product. Exon 2 is skipped and exons 1 and 3 join, predicting p.(Glu58ValfsTer80). The study did not directly demonstrate the truncated polypeptide or nonsense-mediated decay.
  evidence:
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: a corresponding increase of a truncated ~163 bp amplicon could be seen in affected fibroblasts, confirming that the c.633 + 4A>G variant causes skipping of exon 2
    explanation: The shortened cDNA product establishes aberrant splicing.
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: On a protein level, this is predicted to result in a truncated protein product p.(Glu58ValfsTer80).
    explanation: Sequence interpretation predicts a frameshift and premature stop; the truncated protein was not directly measured.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  downstream:
  - target: Reduced CAML Protein Abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Aberrant transcript processing is accompanied by reduced CAML protein; the contributions of RNA decay and protein instability were not separated.
- name: Reduced CAML Protein Abundance
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: CAML protein abundance was significantly reduced in patient fibroblasts. Residual protein was detectable; whether it retains sufficient function to explain survival is a hypothesis, not a demonstrated genotype-survival relationship.
  evidence:
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Accordingly, reduced levels of CAML protein were identified using immunoblotting analysis
    explanation: Immunoblotting directly measures protein abundance.
  downstream:
  - target: Impaired TRC-Mediated Tail-Anchored Protein Insertion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced receptor abundance is expected to impair insertion of susceptible substrates; insertion kinetics were not measured for the human allele.
  - target: Altered Golgi Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Acute CAMLG knockdown altered Golgi-marker distribution in HeLa cells; the same morphology was not observed in patient fibroblasts.
  - target: Altered Lysosomal Cargo Trafficking
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Caml deletion in mouse cells altered lysosomal cargo distribution and secretion; the human splice allele was not tested.
  - target: Spinal Motor Neuron Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Neuron-specific Caml deletion caused motor-neuron loss in mice; the intervening cellular mechanism and relevance to the human allele remain unresolved.
- name: Impaired TRC-Mediated Tail-Anchored Protein Insertion
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: CAML and WRB form the receptor for TRC-dependent tail-anchored protein insertion. Human WRB and CAML together rescue targeting in yeast lacking Get1/Get2, supporting conserved receptor function. The CAMLG-CDG fibroblast localization findings support a selective insertion defect, but no direct insertion assay was performed for c.633+4A>G. Normal localization of emerin, VAMP7 and VAPB argues against failure of all substrates; residual receptor activity and alternative insertion pathways remain possible explanations.
  evidence:
  - reference: PMID:24392163
    reference_title: WRB and CAML are necessary and sufficient to mediate tail-anchored protein targeting to the ER membrane.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Individually, WRB and CAML were unable to mediate GFP-Sed5 targeting to the Golgi membrane, but when co-expressed they formed a fully functional receptor and proper Sed5 localization was restored
    explanation: Wild-type complementation establishes conserved receptor function, not the magnitude of the human variant defect.
  - reference: PMID:35262690
    reference_title: 'CAMLG-CDG: a novel congenital disorder of glycosylation linked to defective membrane trafficking.'
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: several proteins that are canonically dependent upon the TRC pathway (Emerin, VAMP7, VAPB) were found to have normal subcellular localization in affected CAMLG-CDG and GET4-CDG fibroblasts
    explanation: Normal localization limits any claim of global substrate failure.
  biological_processes:
  - preferred_term: tail-anchored membrane protein insertion into ER membrane
    term:
      id: GO:0071816
      label: tail-anchored membrane protein insertion into ER membrane
    modifier: DECREASED
  downstream:

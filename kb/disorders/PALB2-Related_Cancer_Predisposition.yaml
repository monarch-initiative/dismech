name: PALB2-Related Cancer Predisposition
category: Mendelian
creation_date: "2026-11-12T22:40:00Z"
synonyms:
- PALB2-related cancer predisposition
- PALB2-associated hereditary breast and pancreatic cancer
description: >-
  An autosomal dominant hereditary cancer predisposition caused by heterozygous germline
  loss-of-function variants in PALB2, the scaffold that physically bridges BRCA1 to the
  BRCA2-RAD51 machinery and so is required for homologous-recombination repair of DNA
  double-strand breaks. Female breast cancer is the dominant manifestation at high, age-dependent
  and incompletely penetrant risk, with enrichment for oestrogen-receptor-negative and
  triple-negative tumours; ovarian, pancreatic and male breast cancer are elevated at much lower
  absolute risk. ClinGen lumps breast, ovarian and pancreatic cancer into this single gene-disease
  entity on the grounds that they share molecular mechanism and inheritance pattern. Loss of
  homologous recombination is both the route to malignancy and a therapeutic vulnerability: in a
  phase II study of olaparib across homologous-recombination genes, confirmed responses were seen
  only in germline PALB2 and somatic BRCA1/2 carriers, with the highest objective response rate in
  the PALB2 group. This entry covers the monoallelic adult predisposition only; biallelic PALB2
  causes Fanconi anemia complementation group N, a separate disease that ClinGen curates
  separately and that dismech curates in Fanconi_Anemia.
disease_term:
  preferred_term: PALB2-related cancer predisposition
  term:
    id: MONDO:0700272
    label: PALB2-related cancer predisposition
parents:
- Hereditary neoplastic syndrome
notes: >-
  Entry scope, and why it stops where it does. ClinGen's Hereditary Cancer GCEP lumped breast,
  ovarian and pancreatic cancer into MONDO:0700272 after finding no difference in molecular
  mechanism, inheritance pattern or phenotypic variability between them, and replaced the earlier
  separate hereditary-breast-and-ovarian-cancer and hereditary-nonpolyposis-colon-cancer
  curations with it. The same curation evaluated and rejected colorectal cancer, found gastric
  cancer evidence still limited, and curated Fanconi anemia complementation group N
  (MONDO:0012565) separately as an autosomal recessive disorder with unique clinical features.
  This entry follows that split exactly: the biallelic childhood phenotype - bone marrow failure,
  congenital anomalies, medulloblastoma, Wilms tumour, neuroblastoma - is not curated here, and is
  already covered in kb/disorders/Fanconi_Anemia.yaml, which carries PALB2/FANCN including the
  early embryonal tumour pattern it shares with FANCD1/BRCA2. Treating the two zygosities as one
  disease with a "dual inheritance architecture", as the deep-research report framing does, would
  put a recessive paediatric bone-marrow-failure syndrome and an adult dominant breast cancer
  predisposition in one pathograph; they are two diseases.
  MONDO:0013236 (pancreatic cancer, susceptibility to, 3) is MONDO's only descendant of this term
  and is a susceptibility concept rather than a distinct disease, so it is not given a subtype row.
  No GeneReviews chapter exists for PALB2. Searched cache/bookshelf/genereviews.csv (index
  snapshot 2026-09-10, 958 chapters) for PALB2 and for "cancer predisposition"; the index carries
  CHEK2-Related Cancer Predisposition, ATM-Related Cancer Predisposition and CDKN2A Cancer
  Predisposition but no PALB2 chapter, and `just check-genereviews` reports NO_CHAPTER. Phenotype
  and penetrance content is therefore taken from the international consortium studies rather than
  from a GeneReviews baseline.
  The ClinGen cache files committed here are stamped from a current ClinGen export (2026-11-12)
  rather than the release pinned in data/clingen/MANIFEST.yaml (2026-10-04), because
  `just fetch-reference` downloads and parses the current export; the pin had already drifted
  before this branch.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous germline loss-of-function allele confers the predisposition. Penetrance
    is incomplete and age-dependent, and absolute risk is further modified by family history and
    polygenic background. Biallelic PALB2 is a different disease with recessive inheritance.
  evidence:
  - reference: CGGV:assertion_b067d463-b881-4f67-b3a6-2924903fc119-2024-08-29T170000.000Z
    reference_title: PALB2 / PALB2-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is definitive evidence supporting the relationship between PALB2 and autosomal dominant PALB2-related cancer predisposition."
    explanation: ClinGen states the mode of inheritance for this MONDO entity.
genetic:
- name: PALB2
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PALB2
    term:
      id: hgnc:26144
      label: PALB2
  relationship_type: CAUSATIVE
  notes: >-
    Most pathogenic and likely pathogenic alleles are protein-truncating - frameshift, nonsense
    and splice-site. Missense variants are frequently variants of uncertain significance and are
    adjudicated by functional assays, including homologous-recombination complementation and
    assays of coiled-coil homodimerization and BRCA1 heterodimerization. Recurrent and founder
    alleles are reported in several populations - the Argentine c.1653T>A variant found in five
    unrelated families is cited as the worked example - and the entry does not record a
    per-population allele frequency because the cited sources give carrier counts in ascertained
    cohorts rather than population frequencies. ClinGen separately classifies PALB2 for Fanconi anemia complementation
    group N (MONDO:0012565) as Definitive with autosomal recessive inheritance; that tier is not
    recorded here because it concerns a different disease.
  case_fractions:
  - population: Canadian national cohort of women with breast cancer diagnosed at age 40 or younger
    case_fraction_percent: 1.2
    cohort_size: 805
    notes: >-
      Share of an ascertained young breast cancer cohort carrying a PALB2 pathogenic variant: 10
      of 805 women, within a panel-wide positivity rate of 18.6%. This is a case fraction in a
      disease cohort, not a population prevalence, which is why the entry carries no
      `prevalence:` record for it. No population carrier frequency is recorded because none of
      the sources cached for this entry reports one.
    evidence:
    - reference: PMID:42337046
      reference_title: Frequency of germline pathogenic variants in breast cancer predisposing genes in a national cohort of young women with breast cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "In 805 women, 153 PVs were found (positivity rate 18.6%). Most PVs (63%) were found in BRCA1 (50) or BRCA2 (46). Other PVs were in CHEK2 (24), ATM (13), PALB2 (10)"
      explanation: Source of the PALB2 count and its denominator in this ascertained cohort.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_b067d463-b881-4f67-b3a6-2924903fc119-2024-08-29T170000.000Z
    evidence:
    - reference: CGGV:assertion_b067d463-b881-4f67-b3a6-2924903fc119-2024-08-29T170000.000Z
      reference_title: PALB2 / PALB2-related cancer predisposition (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PALB2 | HGNC:26144 | PALB2-related cancer predisposition | MONDO:0700272 | AD | Definitive"
      explanation: ClinGen Hereditary Cancer GCEP classification for this MONDO entity.
  evidence:
  - reference: CGGV:assertion_b067d463-b881-4f67-b3a6-2924903fc119-2024-08-29T170000.000Z
    reference_title: PALB2 / PALB2-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we found no difference in molecular mechanism(s) or inheritance pattern and phenotypic variability. Therefore, breast, ovarian, and pancreatic cancers have been lumped into this curation for the new disease entity MONDO:0700272"
    explanation: The lumping decision that defines this entry's scope, in the curating panel's own words.
  - reference: PMID:33471991
    reference_title: "Breast Cancer Risk Genes - Association Analysis in More than 113,000 Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Protein-truncating variants in 5 genes (ATM, BRCA1, BRCA2, CHEK2, and PALB2) were associated with a risk of breast cancer overall with a P value of less than 0.0001."
    explanation: Places PALB2 among the five genes with the strongest breast cancer association in a 113,000-woman panel study.
  - reference: PMID:17200668
    reference_title: "PALB2, which encodes a BRCA2-interacting protein, is a breast cancer susceptibility gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified monoallelic truncating PALB2 mutations in 10/923 individuals with familial breast cancer compared with 0/1,084 controls (P = 0.0004) and show that such mutations confer a 2.3-fold higher risk of breast cancer"
    explanation: The founding report establishing monoallelic PALB2 truncating variants as a breast cancer susceptibility allele; its 2.3-fold estimate was later revised upward by the consortium studies.
  - reference: PMID:42011088
    reference_title: High Prevalence of Non-BRCA Pathogenic Variants and a Recurrent PALB2 Variant in an Argentine Hereditary Breast and Ovarian Cancer Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the PALB2 c.1653T>A variant was identified in five unrelated families, representing a recurrent variant compatible with a possible founder effect in this population"
    explanation: A worked example of the recurrent alleles the notes describe, carrying the authors' own hedge on whether it is a founder effect.
pathophysiology:
- name: Germline PALB2 Loss of Function
  description: >-
    A heterozygous germline protein-truncating variant halves functional PALB2 in every cell.
    PALB2 is a modular scaffold: its N-terminal coiled-coil homodimerizes and binds the BRCA1
    coiled-coil, while its C-terminal WD40 beta-propeller binds BRCA2, RAD51 and RAD51C, so the
    protein has no catalytic activity of its own and its loss is felt as a failure to assemble a
    complex. ClinGen records the disease mechanism as loss of function.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  evidence:
  - reference: CGGV:assertion_b067d463-b881-4f67-b3a6-2924903fc119-2024-08-29T170000.000Z
    reference_title: PALB2 / PALB2-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of disease is loss of function."
    explanation: ClinGen states the disease mechanism for this gene-disease pair.
  - reference: PMID:39745016
    reference_title: "Structural analysis of genetic variants of the human tumor suppressor PALB2 coiled-coil domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "PALB2 forms homodimers via its coiled-coil domain, and during HR, it forms a heterodimeric complex with BRCA1 using the same domain."
    explanation: States the scaffolding architecture whose loss defines this node; quoted from the paper's framing of established structural biology.
  gene:
    preferred_term: PALB2
    term:
      id: hgnc:26144
      label: PALB2
  molecular_functions:
  - preferred_term: PALB2 coiled-coil heterodimerization with BRCA1
    term:
      id: GO:0046982
      label: protein heterodimerization activity
    modifier: DECREASED
  - preferred_term: PALB2 coiled-coil homodimerization
    term:
      id: GO:0042802
      label: identical protein binding
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: PALB2
      term:
        id: hgnc:26144
        label: PALB2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    description: Heterozygous protein-truncating allele carried constitutionally; the first hit.
  downstream:
  - target: Somatic PALB2 Second-Hit Inactivation
    description: >-
      The remaining wild-type allele is lost somatically in the cell that goes on to transform.
      Biallelic inactivation of BRCA1, BRCA2 or PALB2 is documented in a fifth of breast cancer
      brain metastases, which is evidence the second hit occurs rather than a measurement of how
      often it does in primary carrier tumours.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42727421
      reference_title: "Clinically actionable genomic alterations in breast cancer brain metastases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Biallelic inactivation of BRCA1, BRCA2, or PALB2 was observed in 19.6% of samples"
      explanation: Documents that biallelic inactivation of these genes occurs in tumours; the figure is pooled across the three genes and measured in brain metastases, so it establishes that the second hit happens rather than how often it happens in a PALB2 carrier.
- name: Somatic PALB2 Second-Hit Inactivation
  description: >-
    Loss of the remaining wild-type PALB2 allele in a susceptible cell, which is what converts the
    constitutional carrier state into a homologous-recombination-deficient clone.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  genetic_context:
    gene:
      preferred_term: PALB2
      term:
        id: hgnc:26144
        label: PALB2
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
    description: Somatic loss of the wild-type allele in the transforming clone.
  downstream:
  - target: Failure of BRCA1-PALB2-BRCA2 Bridging and RAD51 Loading
    description: >-
      With both alleles inactivated the scaffold is absent and the BRCA1 to BRCA2-RAD51 bridge
      cannot be assembled.
    causal_link_type: DIRECT
- name: Failure of BRCA1-PALB2-BRCA2 Bridging and RAD51 Loading
  description: >-
    PALB2 is required to recruit BRCA2 and the RAD51 recombinase to sites of DNA damage, so its
    loss breaks the BRCA1 to BRCA2-RAD51 bridge and homologous recombination cannot proceed.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: MOLECULAR_ACTIVITY_EFFECT
  conforms_to: "dna_repair_synthetic_lethality#HRR or FA/BRCA Repair Deficiency"
  evidence:
  - reference: PMID:39745016
    reference_title: "Structural analysis of genetic variants of the human tumor suppressor PALB2 coiled-coil domain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The WD40 domain also interacts with other essential proteins for HR, such as RAD51, RAD51C, and RNF168"
    explanation: Identifies the C-terminal interactions that the scaffold loses, which is what breaks the bridge to RAD51 loading at this node.
  - reference: PMID:40749686
    reference_title: PALB2 and 53BP1 govern post-resection homologous recombination DNA repair.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "HR remained inefficient because the CC domain was required for PALB2 to bind to single-stranded (ss)DNA overhangs and subsequently promote PALB2 and RAD51 accumulation."
    explanation: A coiled-coil-mutant mouse allele showing directly that the domain is required for PALB2 and RAD51 to accumulate at breaks, which is the step this node says fails.
  - reference: PMID:39673470
    reference_title: Proline variants in the BRCA1 coiled-coil domain disrupt folding and binding to PALB2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Missense mutations in either BRCA1 or PALB2 that disrupt this important interaction result in loss of effective DNA damage repair and are associated with breast tumorigenesis."
    explanation: States that disrupting the BRCA1-PALB2 interaction from either side costs effective repair, which is evidence that the interaction itself carries the function rather than either partner alone; quoted from the paper's framing rather than from its own assay result.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  downstream:
  - target: Homologous Recombination Deficiency and Genomic Instability
    description: >-
      Without homologous recombination, double-strand breaks are repaired by error-prone routes
      and the cell accumulates chromosomal damage.
    causal_link_type: DIRECT
- name: Homologous Recombination Deficiency and Genomic Instability
  description: >-
    Error-prone repair in place of homologous recombination produces chromosome fragility,
    hypersensitivity to interstrand-crosslinking agents and ionizing radiation, and progressive
    genomic instability. This is simultaneously the route to malignancy and the therapeutic
    vulnerability the disease is treated through.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  node_class: GENOME_INSTABILITY
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  downstream:
  - target: Clonal Expansion and Tumor Initiation
    description: >-
      Accumulated mutations and chromosomal aberrations drive transformation, preferentially in
      breast epithelium and less often in ovary and pancreas.
    causal_link_type: DIRECT
  - target: PARP-Inhibitor Sensitivity
    description: >-
      The same repair deficiency makes the tumour cell dependent on the remaining repair routes,
      which PARP inhibition exploits.
    causal_link_type: DIRECT
- name: Clonal Expansion and Tumor Initiation
  description: >-
    Outgrowth of the homologous-recombination-deficient clone as a carcinoma. The tumour spectrum
    is narrower than the constitutional genotype would predict: breast cancer dominates, ovarian
    and pancreatic cancer are elevated at low absolute risk, and prostate and colorectal cancer
    are not.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  conforms_to: "germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation"
  evidence:
  - reference: PMID:31841383
    reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There was no evidence for increased risks of prostate or colorectal cancer."
    explanation: Establishes the boundary of the tumour spectrum, which is what makes this a narrower spectrum than a general genome-maintenance defect would give.
  downstream:
  - target: Breast carcinoma
    description: Breast epithelium is the dominant site, at 53% absolute risk to age 80.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31841383
      reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We found associations between PALB2 PVs and risk of female breast cancer (RR, 7.18; 95% CI, 5.82 to 8.85"
      explanation: The consortium relative-risk estimate for the dominant manifestation.
  - target: Ovarian carcinoma
    description: Ovarian cancer is elevated about threefold but at low absolute risk.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31841383
      reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "ovarian cancer (RR, 2.91; 95% CI, 1.40 to 6.04"
      explanation: The consortium relative-risk estimate for ovarian cancer.
  - target: Pancreatic adenocarcinoma
    description: Pancreatic cancer is elevated about twofold, at 2-3% absolute risk to age 80.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31841383
      reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "pancreatic cancer (RR, 2.37; 95% CI, 1.24 to 4.50"
      explanation: The consortium relative-risk estimate for pancreatic cancer.
- name: PARP-Inhibitor Sensitivity
  description: >-
    Homologous-recombination deficiency makes the tumour synthetically lethal to PARP inhibition.
    This is not an inference from the mechanism: in the TBCRC 048 phase II study of olaparib
    across homologous-recombination genes, confirmed responses were seen only in germline PALB2
    and somatic BRCA1/2 carriers, and the PALB2 group had the highest objective response rate and
    the longest median progression-free survival, while ATM and CHEK2 carriers had none. The
    expansion cohorts then reproduced the effect in 24 germline PALB2 patients at a 75% objective
    response rate and a 9.4-month median progression-free survival, the larger of the two PALB2
    series. Platinum sensitivity is deliberately not claimed on this node: it is
    mechanistically expected and is standard care in the associated cancers, but no source cached
    for this entry reports a platinum result in PALB2 carriers specifically, and the node is named
    for what the evidence covers.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "dna_repair_synthetic_lethality#PARP and Platinum Synthetic Lethality"
  evidence:
  - reference: PMID:33119476
    reference_title: "TBCRC 048: Phase II Study of Olaparib for Metastatic Breast Cancer and Mutations in Homologous Recombination-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Confirmed responses were seen only with gPALB2 (ORR, 82%) and sBRCA1/2 (ORR, 50%) mutations."
    explanation: The clinical result that establishes the vulnerability in this genotype specifically, and distinguishes it from other homologous-recombination genes in the same trial.
  - reference: PMID:33119476
    reference_title: "TBCRC 048: Phase II Study of Olaparib for Metastatic Breast Cancer and Mutations in Homologous Recombination-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "No responses were observed with ATM or CHEK2 mutations alone."
    explanation: The contrast within the same trial, which is what makes the PALB2 result a genotype-specific finding rather than a class effect.
  - reference: PMID:41604601
    reference_title: "TBCRC 048 (Olaparib Expanded) Expansion Cohorts: Phase II Study of Olaparib Monotherapy for Patients With Metastatic Breast Cancer With Germline Mutations in PALB2 or Somatic Mutations in BRCA1 or BRCA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Among pts with a gPALB2m, the overall response rate (ORR) was 75% (80% CI, 60.2 to 86.3), CBR was 83.3% (90% CI, 65.8 to 94.1), the median PFS was 9.4 months (90% CI, 8.3 to 13.1)"
    explanation: The expansion cohorts, in which 24 germline PALB2 patients reproduced the response seen in the trial's initial, smaller PALB2 arm.
phenotypes:
- name: Breast carcinoma
  category: Neoplastic
  description: >-
    Female breast cancer is the dominant manifestation, at a relative risk of 7.18 and an absolute
    risk of 53% to age 80. Absolute risk is strongly modified: the consortium range runs from
    about 44% to 76% depending on family history and polygenic background, so a single figure
    overstates what can be told an individual carrier. Tumours are enriched for
    oestrogen-receptor-negative disease, and in an ascertained cohort of women diagnosed at 40 or
    younger the panel positivity rate was higher in triple-negative and bilateral tumours. Onset
    is adult, with enrichment at young ages.
  phenotype_term:
    preferred_term: Breast carcinoma
    term:
      id: HP:0003002
      label: Breast carcinoma
  frequency: FREQUENT
  evidence:
  - reference: PMID:31841383
    reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the estimated risks to age 80 years were 53% (95% CI, 44% to 63%) for female breast cancer"
    explanation: The absolute-risk estimate quoted in the description, with its own confidence interval.
  - reference: PMID:33471991
    reference_title: "Breast Cancer Risk Genes - Association Analysis in More than 113,000 Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "for protein-truncating variants in BARD1, BRCA1, BRCA2, PALB2, RAD51C, and RAD51D, odds ratios were higher for ER-negative disease than for ER-positive disease"
    explanation: Source of the oestrogen-receptor-negative enrichment, measured against ER-positive disease in the same study.
  - reference: PMID:42337046
    reference_title: Frequency of germline pathogenic variants in breast cancer predisposing genes in a national cohort of young women with breast cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Higher PV frequencies were found in women with tumours with lobular histology (29.2%), triple negative cancers (27.5%), and bilateral breast cancers (35.7%)."
    explanation: The tumour-characteristic enrichment, reported as panel-wide positivity rather than PALB2-specific, which is why the description attributes it to the panel.
- name: Male breast cancer
  category: Neoplastic
  description: >-
    Male breast cancer is elevated at a relative risk of 7.34, similar in magnitude to the female
    relative risk, but its absolute risk to age 80 is only about 1% and its confidence interval is
    very wide. Both facts matter in counselling: the relative risk is large and the absolute risk
    is small.
  phenotype_term:
    preferred_term: male breast cancer
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:
  - reference: PMID:31841383
    reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "male breast cancer (RR, 7.34; 95% CI, 1.28 to 42.18"
    explanation: The relative risk and its confidence interval, which is what makes the estimate imprecise.
  - reference: PMID:31841383
    reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "1% (95% CI, 0.2% to 5%) for male breast cancer"
    explanation: The absolute risk to age 80, which the relative risk alone would misrepresent.
- name: Ovarian carcinoma
  category: Neoplastic
  description: >-
    Ovarian cancer is elevated about threefold with an absolute risk to age 80 of about 5%. That
    is the basis on which risk-reducing salpingo-oophorectomy is considered case by case for PALB2
    carriers rather than recommended uniformly as it is for BRCA1 and BRCA2.
  phenotype_term:
    preferred_term: ovarian carcinoma
    term:
      id: HP:0025318
      label: Ovarian carcinoma
  evidence:
  - reference: PMID:31841383
    reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "5% (95% CI, 2% to 10%) for ovarian cancer"
    explanation: The absolute ovarian risk estimate behind the management position.
- name: Pancreatic adenocarcinoma
  category: Neoplastic
  description: >-
    Pancreatic cancer is elevated about twofold with an absolute risk to age 80 of 2-3%. This is
    the risk on which family-history-triggered pancreatic surveillance is offered.
  phenotype_term:
    preferred_term: pancreatic adenocarcinoma
    term:
      id: HP:0006725
      label: Pancreatic adenocarcinoma
  evidence:
  - reference: PMID:31841383
    reference_title: "Cancer Risks Associated With Germline PALB2 Pathogenic Variants: An International Study of 524 Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "2%-3% (95% CI females, 1% to 4%; 95% CI males, 2% to 5%) for pancreatic cancer"
    explanation: The absolute pancreatic risk estimate, reported separately by sex.
diagnosis:
- name: Germline molecular diagnosis
  description: >-
    Identification of a heterozygous pathogenic or likely pathogenic germline PALB2 variant,
    usually on a hereditary breast cancer multigene panel. Most pathogenic alleles are
    protein-truncating; missense variants are frequently of uncertain significance and are
    adjudicated with functional assays of homologous recombination and of the coiled-coil
    dimerization interfaces.
  evidence:
  - reference: PMID:42337046
    reference_title: Frequency of germline pathogenic variants in breast cancer predisposing genes in a national cohort of young women with breast cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Germline genetic testing was performed for 18 genes (ATM, BARD1, BRCA1, BRCA2, BRIP1, CDH1, CHEK2, PALB2"
    explanation: Establishes multigene panel testing as the route by which PALB2 carriers are ascertained.
  - reference: PMID:39745016
    reference_title: Structural analysis of genetic variants of the human tumor suppressor PALB2 coiled-coil domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Overexpression of the PALB2 coiled-coil domain reduces RAD51 foci formation during HR, indicating a competition between PALB2 homo- and heterodimers"
    explanation: Illustrates the class of functional assay used to adjudicate coiled-coil missense variants of uncertain significance.
treatments:
- name: PARP-inhibitor therapy
  description: >-
    Olaparib in metastatic breast cancer with a germline PALB2 variant. In the initial TBCRC 048
    cohorts the germline PALB2 arm had an objective response rate of 82% and a median
    progression-free survival of 13.3 months, the strongest result in the trial, while ATM and
    CHEK2 carriers had no responses. The trial's later expansion cohorts, 24 germline PALB2
    patients, are the larger series: an objective response rate of 75% and a median
    progression-free survival of 9.4 months.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: olaparib
      term:
        id: CHEBI:83766
        label: olaparib
  target_mechanisms:
  - target: Clonal Expansion and Tumor Initiation
    treatment_effect: INHIBITS
    description: >-
      PARP inhibition exploits the homologous-recombination deficiency the germline lesion
      creates, killing the repair-deficient clone. Targeted at the tumour node rather than at
      PARP-Inhibitor Sensitivity, because the drug exploits that sensitivity and does not inhibit
      it.
    evidence:
    - reference: PMID:33119476
      reference_title: "TBCRC 048: Phase II Study of Olaparib for Metastatic Breast Cancer and Mutations in Homologous Recombination-Related Genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Median PFS was 13.3 months (90% CI, 12 months to not available/computable [NA]) for gPALB2"
      explanation: The progression-free survival in the germline PALB2 cohort specifically.
  evidence:
  - reference: PMID:33119476
    reference_title: "TBCRC 048: Phase II Study of Olaparib for Metastatic Breast Cancer and Mutations in Homologous Recombination-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Confirmed responses were seen only with gPALB2 (ORR, 82%) and sBRCA1/2 (ORR, 50%) mutations."
    explanation: The trial result supporting PARP inhibition in this genotype.
  - reference: PMID:41604601
    reference_title: "TBCRC 048 (Olaparib Expanded) Expansion Cohorts: Phase II Study of Olaparib Monotherapy for Patients With Metastatic Breast Cancer With Germline Mutations in PALB2 or Somatic Mutations in BRCA1 or BRCA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Among pts with a gPALB2m, the overall response rate (ORR) was 75% (80% CI, 60.2 to 86.3), CBR was 83.3% (90% CI, 65.8 to 94.1), the median PFS was 9.4 months (90% CI, 8.3 to 13.1)"
    explanation: The trial's expansion cohorts in 24 germline PALB2 patients, the larger of the two estimates of olaparib activity in this genotype.
  - reference: PMID:41713165
    reference_title: "BRCA1/2, PALB2 mutations and first-line CDK4/6 inhibitor efficacy in HR+ metastatic breast cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "PFS was significantly shorter in BRCA/PALB2m patients (9.9 months ... compared to BRCA/PALB2wt (15.4 months"
    explanation: >-
      Bears on sequencing rather than on PARP activity: carriers do worse on first-line
      endocrine therapy plus a CDK4/6 inhibitor, which is the argument for considering a PARP
      inhibitor earlier. The figure is pooled across BRCA and PALB2 carriers, so it is not a
      PALB2-specific estimate.
- name: Intensified breast surveillance
  description: >-
    Annual contrast-enhanced breast MRI is the cornerstone of surveillance for high-penetrance
    carriers, with mammography tailored by gene and age. Surveillance detects cancer earlier; it
    does not modify the mechanism.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: breast cancer screening with annual MRI and tailored mammography
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Breast carcinoma
    description: Earlier detection of the dominant manifestation; no effect on the underlying repair defect.
  evidence:
  - reference: PMID:41386971
    reference_title: "Imaging Surveillance and Risk-Based Management of Known Genetic Mutations in Breast Cancer: A Radiologist's Guide."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "High-penetrance variants (BRCA1/2, TP53, PALB2, PTEN) warrant intensified surveillance, with annual MRI as the cornerstone and mammography tailored by gene and age."
    explanation: Places PALB2 in the high-penetrance surveillance tier and states the modality; a guideline-oriented review synthesis rather than a primary result.
- name: Pancreatic surveillance
  description: >-
    Imaging surveillance of the pancreas, offered to PALB2 heterozygotes as high-risk
    individuals. In the PRECEDE prospective cohort, PALB2 carriers were 9% of the 2,085 eligible
    participants and baseline imaging was predominantly endoscopic ultrasound or MRI. The
    evidence base is thin by the consortium's own account: it reports that limited evidence
    exists to guide counselling on how often to image and what the findings mean over time, so
    this row records an offered programme rather than a demonstrated mortality benefit.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: pancreatic cancer surveillance by endoscopic ultrasound or MRI
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Pancreatic adenocarcinoma
    description: >-
      Earlier detection of the pancreatic manifestation; no effect on the underlying repair
      defect.
  evidence:
  - reference: PMID:42976359
    reference_title: "Longitudinal Pancreatic Imaging Findings in BRCA1, BRCA2, ATM, and PALB2 Heterozygotes Undergoing Pancreatic Cancer Surveillance: A Prospective PRECEDE Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A common subgroup of HRIs undergoing PC surveillance imaging includes those with a heterozygous pathogenic germline variant (PGV) in breast cancer susceptibility genes BRCA1, BRCA2, ATM, or PALB2."
    explanation: Establishes that PALB2 heterozygotes are among the high-risk individuals offered pancreatic surveillance; the sentence frames the study rather than reporting its result.
  - reference: PMID:42976359
    reference_title: "Longitudinal Pancreatic Imaging Findings in BRCA1, BRCA2, ATM, and PALB2 Heterozygotes Undergoing Pancreatic Cancer Surveillance: A Prospective PRECEDE Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Among 2,085 eligible participants, PGVs in BRCA2 (51%) were most common, followed by BRCA1 (21%), ATM (19%), and PALB2 (9%)"
    explanation: The PALB2 share of the surveilled cohort, which is the figure this row's description gives.
  - reference: PMID:42976359
    reference_title: "Longitudinal Pancreatic Imaging Findings in BRCA1, BRCA2, ATM, and PALB2 Heterozygotes Undergoing Pancreatic Cancer Surveillance: A Prospective PRECEDE Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Baseline pancreatic imaging occurred primarily with endoscopic ultrasound (EUS; 55%) or magnetic resonance imaging (43%)."
    explanation: The modalities actually used in the cohort, which is what the treatment name reflects.
  - reference: PMID:42976359
    reference_title: "Longitudinal Pancreatic Imaging Findings in BRCA1, BRCA2, ATM, and PALB2 Heterozygotes Undergoing Pancreatic Cancer Surveillance: A Prospective PRECEDE Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "limited evidence exists to guide counseling regarding the frequency and longitudinal outcomes of imaging findings"
    explanation: The consortium's own statement of how weak the evidence is, which is why this row claims an offered programme and not a benefit.
- name: Risk-reducing mastectomy
  description: >-
    Bilateral risk-reducing mastectomy is a recognized option for carriers at very high risk,
    taken by shared decision-making rather than recommended uniformly. Risk-reducing
    salpingo-oophorectomy is not uniformly recommended for PALB2 given the modest absolute ovarian
    risk.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: bilateral risk-reducing mastectomy
    term:
      id: NCIT:C15277
      label: Mastectomy
  target_mechanisms:
  - target: Breast carcinoma
    description: Removes the tissue at risk; prevention rather than treatment.
  evidence:
  - reference: PMID:43014839
    reference_title: "[Indications for prophylactic mastectomies]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prophylactic breast surgery is a major risk-reducing option for women at very high risk of breast cancer, particularly carriers of pathogenic variants in BRCA1, BRCA2, PALB2, or TP53."
    explanation: Names PALB2 among the variants for which prophylactic mastectomy is an option; a review synthesis of practice rather than a trial result.
- name: Genetic counseling and cascade testing
  description: >-
    Counselling covers the high but incompletely penetrant breast risk, the much lower absolute
    ovarian and pancreatic risks, and the reproductive implication that two carrier partners are
    at risk of a child with Fanconi anemia complementation group N. That last point is specific to
    this gene and is the reason preimplantation genetic testing is discussed with carrier couples.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: CGGV:assertion_3ebabbf1-1a43-4a57-b0b8-2b29bb57ade1-2019-08-18T160312.829Z
    reference_title: PALB2 / Fanconi anemia complementation group N (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PALB2 | HGNC:26144 | Fanconi anemia complementation group N | MONDO:0012565 | AR | Definitive"
    explanation: Establishes the recessive disease that two carrier partners are at risk of, which is what the reproductive counselling is about.
differential_diagnoses:
- name: Fanconi anemia complementation group N
  description: >-
    The biallelic PALB2 disease: an autosomal recessive paediatric disorder with congenital
    anomalies, progressive bone marrow failure, chromosome fragility and very early embryonal
    tumours, sharing the early embryonal tumour pattern with FANCD1/BRCA2. ClinGen curates it as a
    separate gene-disease entity on the grounds of phenotypic variability and a different
    inheritance pattern, and dismech curates it in Fanconi_Anemia. It is not a severe form of this
    entry's disease; it is a different disease caused by the same gene.
  evidence:
  - reference: CGGV:assertion_b067d463-b881-4f67-b3a6-2924903fc119-2024-08-29T170000.000Z
    reference_title: PALB2 / PALB2-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fanconi anemia complementation group N (MONDO:0012565), an autosomal recessive disorder with unique clinical features was curated separately."
    explanation: ClinGen's own statement of the split that scopes this entry.
- name: Hereditary breast and ovarian cancer syndrome (BRCA1, BRCA2)
  description: >-
    The higher-penetrance syndromes that dominate panel findings in young breast cancer cohorts
    and from which PALB2 is distinguished by a lower ovarian risk and by its intermediate position
    between BRCA1/BRCA2 and the moderate-penetrance genes. Curated in dismech as
    Hereditary_Breast_and_Ovarian_Cancer_Syndrome.
- name: Moderate-penetrance breast cancer predisposition (ATM, CHEK2)
  description: >-
    The genes PALB2 is most often contrasted with. The distinction is not only one of penetrance:
    in TBCRC 048 germline PALB2 carriers responded to olaparib and ATM and CHEK2 carriers did not,
    so the grouping of these genes as a single "non-BRCA panel" category is wrong therapeutically
    as well as in magnitude of risk.
  evidence:
  - reference: PMID:33119476
    reference_title: "TBCRC 048: Phase II Study of Olaparib for Metastatic Breast Cancer and Mutations in Homologous Recombination-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "No responses were observed with ATM or CHEK2 mutations alone."
    explanation: The therapeutic contrast that separates PALB2 from the moderate-penetrance panel genes.
animal_models:
- name: Palb2 knockout mouse
  species: Mouse
  genotype: Palb2 homozygous null; heterozygous null
  publication: PMID:20484223
  description: >-
    Homozygous Palb2 null mice are embryonic lethal by E9.5, phenocopying Brca1 and Brca2
    knockouts, while heterozygotes are normal and fertile. The heterozygote is therefore the
    genotype that matches the human carrier state, and it has no phenotype, so the model cannot be
    used to study the dominant cancer predisposition without conditional or tissue-specific
    approaches.
  genes:
  - preferred_term: Palb2
    term:
      id: MGI:3040695
      label: Palb2
  modeled_mechanisms:
  - target: Germline PALB2 Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout establishes that Palb2 is essential for development, which supports the
      genome-maintenance role, but the heterozygote that corresponds to the human carrier is
      normal and fertile.
    limitations: >-
      Homozygous loss is embryonic lethal at E9.5, so the adult tumour phenotype cannot be
      observed in the constitutive model; the heterozygote, which is the genotype matching the
      human disease, is normal and fertile and develops no reported tumour phenotype in the cited
      work. Conditional or tissue-specific models are required.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: INVALIDATING
      description: >-
        Adult tumorigenesis, the process this entry is about, is outside the model's reachable
        window because the homozygote dies at E9.5 and the heterozygote is unaffected.
    evidence:
    - reference: PMID:20484223
      reference_title: Inactivation of Palb2 gene leads to mesoderm differentiation defect and early embryonic lethality in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The data show that the Palb2((+/-)) mice are normal and fertile, and lack macroscopic tumors when followed up till the age of 8 months. Homozygous (HO) Palb2((-/-)) mice present with embryonic lethality and die at E9.5 at the latest."
      explanation: "Both halves of the limitation in one sentence pair: the carrier-equivalent heterozygote is tumour-free and the homozygote dies before any adult phenotype could appear."

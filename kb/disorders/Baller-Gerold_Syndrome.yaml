      explanation: Poikiloderma is named as a hallmark dermatological feature of BGS, supporting a dermatology classification alongside the skeletal one.
has_subtypes:
- name: RECQL4-positive
  display_name: BGS with poikiloderma (RECQL4-related)
  description: >-
    Patients ascertained as BGS who develop the poikilodermatous rash carry
    biallelic RECQL4 variants. This is the molecularly defined, allelic form of
    the disorder that sits on the RECQL4 spectrum with Rothmund-Thomson syndrome
    type 2 and RAPADILINO syndrome.
  genes:
  - preferred_term: RECQL4
    term:
      id: hgnc:9949
      label: RECQL4
  evidence:
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results confirm that BGS in a subgroup of patients is due to RECQL4 mutations and could be integrated into a clinical spectrum that encompasses RTS and RAPADILINO syndrome."
    explanation: Establishes that only a subgroup of clinically defined BGS is RECQL4-related.
- name: RECQL4-negative
  display_name: BGS without poikiloderma (not RECQL4-related)
  description: >-
    Patients meeting the craniosynostosis-plus-radial-ray criteria but lacking
    poikiloderma do not carry RECQL4 variants. This group is genetically
    heterogeneous; individual cases have been reassigned to Fanconi anemia,
    Roberts/SC phocomelia, TWIST1-related craniosynostosis, and Pfeiffer
    syndrome. It is retained here as a clinically ascertained subgroup, not as a
    molecularly defined entity.
  evidence:
  - reference: PMID:24635570
    reference_title: "Search for ReCQL4 mutations in 39 patients genotyped for suspected Rothmund-Thomson/Baller-Gerold syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No RECQL4 mutations were found in the BGS group without poikiloderma, confirming that RECQL4 sequencing was not indicated in this phenotype."
    explanation: Directly establishes the absence of RECQL4 variants in BGS ascertained without poikiloderma.
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of >20 cases reported so far, a few appear atypical and have been reassigned to other nosologic entities, including Fanconi anaemia, Roberts SC phocomelia, and Pfeiffer syndromes after demonstration of corresponding cytogenetic or molecular abnormalities."
    explanation: Documents the reassignment of atypical BGS-labelled cases to other genetic entities.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    BGS is inherited in an autosomal recessive manner; parents of an affected
    child are obligate asymptomatic heterozygotes and each sib has a 25 percent
    recurrence risk.
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baller-Gerold syndrome is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance directly.
  - reference: PMID:25966250
    reference_title: "Identification of novel compound heterozygous RECQL4 mutations and prenatal diagnosis of Baller-Gerold syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RECQL4 gene in the fetus showed compound heterozygous mutations, and each parent was found to be a carrier of one of the mutations."
    explanation: Biparental transmission of two different RECQL4 alleles demonstrates autosomal recessive segregation.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    BGS is described as rare; slightly over 20 cases had been reported at the
    time of the primary RECQL4 report, and a subset of those were subsequently
    reassigned to other entities, so the number of molecularly confirmed
    RECQL4-related cases is smaller still. No population-based rate estimate is
    available.
  evidence:
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of >20 cases reported so far, a few appear atypical and have been reassigned to other nosologic entities"
    explanation: Provides the literature case count and notes that some of those cases are not BGS, supporting an ultra-rare band with a case-count measure.
pathophysiology:
- name: Biallelic RECQL4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaging RECQL4 alleles - typically a missense change in trans with a
    frameshift or splice-site variant, or a homozygous splice-site variant -
    remove functional RECQL4, an ATP-dependent RecQ-family DNA helicase. Over
    100 clinically relevant RECQL4 variants are distributed across the gene, and
    the specific allele combination is what apportions patients between
    Baller-Gerold, Rothmund-Thomson type 2, and RAPADILINO syndromes.
  genes:
  - preferred_term: RECQL4
    term:
      id: hgnc:9949
      label: RECQL4
  downstream:
  - target: Failure of DNA Replication Origin Firing
    description: >-
      Loss of RECQL4 removes the Sld2-like activity that loads replication
      factors at origins, so replication initiation fails.
    evidence:
    - reference: PMID:15960976
      reference_title: Initiation of DNA replication requires the RECQL4 protein mutated in Rothmund-Thomson syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, xRTS functions after pre-RC formation to promote loading of replication factors at origins, a previously unrecognized activity necessary for initiation."
      explanation: Establishes that the RECQL4 homolog is required for the origin-loading step, so its loss directly causes initiation failure.
  evidence:
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this family, compound heterozygosity for a R1021W missense mutation and a g.2886delT frameshift mutation of exon 9 was found."
    explanation: Documents a biallelic (compound heterozygous) RECQL4 genotype in a BGS family.
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had a homozygous splice site mutation (IVS17-2A>C)."
    explanation: Documents the second, homozygous biallelic RECQL4 genotype in the same report.
  - reference: PMID:34869606
    reference_title: Molecular Mechanisms of the RECQ4 Pathogenic Mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "over 100 of clinically relevant mutations have been identified throughout the RECQ4 gene"
    explanation: Establishes the breadth of the pathogenic RECQL4 allelic series underlying the three RECQL4 syndromes.
- name: Failure of DNA Replication Origin Firing
  biological_scale: MOLECULAR
  description: >-
    RECQL4 acts after pre-replicative complex assembly, using its N-terminal
    Sld2-like domain to build chromatin-bound complexes with MCM10, the MCM2-7
    helicase, CDC45 and GINS at replication origins and to load downstream
    replication factors. Without it, origins are licensed but not fired and
    replicative polymerases are not recruited.
  biological_processes:
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  - preferred_term: DNA replication
    term:
      id: GO:0006260
      label: DNA replication
    modifier: DECREASED
  downstream:
  - target: Progenitor Cell Proliferation Failure
    description: >-
      Cells that cannot initiate replication efficiently arrest and fail to
      expand, which is the cellular consequence observed on RECQL4 depletion.
    evidence:
    - reference: PMID:15960976
      reference_title: Initiation of DNA replication requires the RECQL4 protein mutated in Rothmund-Thomson syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "xRTS can be replaced in extracts by its human homolog, while RECQL4 depletion from mammalian cells induces proliferation failure, suggesting an evolutionarily conserved function."
      explanation: Directly links loss of the replication-initiation activity to proliferation failure in mammalian cells.
  evidence:
  - reference: PMID:34869606
    reference_title: Molecular Mechanisms of the RECQ4 Pathogenic Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "human RECQ4 forms cell cycle-dependent, chromatin-bound protein complexes containing core replisome factors MCM10, MCM2-7 helicase, CDC45 and GINS at replication origins"
    explanation: Identifies the origin-associated replisome complex through which RECQL4 acts in human cells.
  - reference: PMID:15960976
    reference_title: Initiation of DNA replication requires the RECQL4 protein mutated in Rothmund-Thomson syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "xRTS depletion suppresses the loading of RPA, the ssDNA binding protein that marks unwound origins before polymerase recruitment."
    explanation: Shows the specific initiation step that fails without RECQL4, namely origin unwinding and RPA loading.
- name: Progenitor Cell Proliferation Failure
  biological_scale: CELLULAR
  description: >-
    Tissues that depend on rapid progenitor expansion are the ones that suffer
    when replication initiation is compromised. Acute Recql4 loss in osteoblast
    progenitors causes proliferative arrest, cell-cycle block and apoptosis
    rather than a repair-only phenotype, and Recql4-deficient embryonic
    fibroblasts show the same proliferation defect. This proliferative deficit,
    not a mutator phenotype, is the proximate cellular lesion of the
    developmental RECQL4 syndromes.
  cell_types:
  - preferred_term: osteoblast progenitor cell
    term:
      id: CL:0007010
      label: preosteoblast
  - preferred_term: skeletal mesenchymal progenitor cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: embryonic fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Defective Ossification and Skeletal Patterning
    description: >-
      Failure of osteoblast-lineage progenitors to expand translates into
      reduced bone formation and abnormal skeletal development.
    evidence:
    - reference: PMID:25859855
      reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data provide a mechanism for the benign skeletal phenotypes of RECQL4 mutation syndromes."
      explanation: The authors state that the osteoblast-progenitor proliferation defect is the mechanism of the skeletal phenotypes of the RECQL4 syndromes.
  - target: Generalized Growth Restriction
    description: >-
      Reduced proliferative capacity across dividing tissues limits fetal and
      postnatal growth.
    evidence:
    - reference: PMID:12915449
      reference_title: Growth retardation and skin abnormalities of the Recql4-deficient mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The exon 13-deleted Recql4-deficient mice are viable, but exhibit severe growth retardation and abnormalities in several tissues, and embryonic fibroblasts show a defect in cell proliferation."
      explanation: Couples the cellular proliferation defect to whole-organism growth retardation in a helicase-domain mouse model.
  - target: Cutaneous Poikilodermatous Degeneration
    description: >-
      Skin is among the tissues affected in helicase-deficient animals, but the
      route from progenitor proliferation failure to the poikilodermatous rash
      has not been established in human skin.
    evidence:
    - reference: PMID:12915449
      reference_title: Growth retardation and skin abnormalities of the Recql4-deficient mouse.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Abnormalities in the Recql4-deficient mice are similar to those in RTS patients, suggesting that defects in the Recql4 gene may indeed be responsible for RTS."
      explanation: The mouse tissue abnormalities are stated to resemble the human RECQL4 phenotype; the skin-specific step is inferred rather than asserted, so this edge is graded indirect.
  evidence:
  - reference: PMID:25859855
    reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Acute deletion of Recql4 in primary osteoblasts or shRNA knockdown in an osteoblastic cell line caused failed proliferation, accompanied by cell cycle arrest, induction of apoptosis and impaired differentiation."
    explanation: Cell-autonomous experiments establish proliferative arrest, apoptosis and impaired differentiation as the direct cellular consequence of Recql4 loss in the osteoblast lineage.
- name: Defective Ossification and Skeletal Patterning
  biological_scale: TISSUE
  description: >-
    Loss of osteoblast-progenitor expansion reduces mineral apposition and bone
    formation, giving shorter bones and reduced bone volume in the mouse. In BGS
    the same lesion is expressed during embryonic and early postnatal skeletal
    patterning, producing both a preaxial upper-limb reduction defect and
    premature fusion of cranial sutures. Why the cranial suture is affected in
    BGS and spared in the allelic Rothmund-Thomson syndrome is not explained by
    any established mechanism.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: DECREASED
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  - preferred_term: cranial suture morphogenesis
    term:
      id: GO:0060363
      label: cranial suture morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Craniosynostosis
    description: >-
      Premature fusion of one or more cranial sutures, most often the coronal
      suture, is one of the two defining findings of BGS.
  - target: Radial Ray Deficiency
    description: >-
      Preaxial upper-limb reduction, ranging from thumb hypoplasia to complete
      radial aplasia, is the other defining finding.
  evidence:
  - reference: PMID:25859855
    reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recql4 deletion in vivo at the osteoblastic progenitor stage of differentiation resulted in mice with shorter bones and reduced bone volume, assessed at 9 weeks of age."
    explanation: Demonstrates that progenitor-stage Recql4 loss produces a measurable defect in bone formation in vivo.
  - reference: PMID:1583650
    reference_title: The Baller-Gerold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extensive agenesis of the frontal and parietal bones, resulting in a very large fontanelle, in addition to coronal bilateral craniosynostosis was observed at necropsy."
    explanation: Autopsy findings show that the calvarial defect in severe BGS is a failure of membranous bone formation as well as premature suture fusion.
- name: Generalized Growth Restriction
  biological_scale: ORGANISM
  description: >-
    Growth is restricted before and after birth. Intrauterine growth retardation
    is recorded in severe neonatal cases, and surviving patients show slow
    growth from infancy with final height typically about 4 SD below the mean.
  downstream:
  - target: Growth Deficiency
    description: >-
      The organism-level growth deficit is expressed clinically as short stature
      with prenatal onset.
  evidence:
  - reference: PMID:1583650
    reference_title: The Baller-Gerold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A case of severe craniosynostosis-radial aplasia (Baller-Gerold) syndrome is described in a newborn male, following a pregnancy complicated by polyhydramnios and intrauterine growth retardation."
    explanation: Documents prenatal onset of the growth deficit in BGS.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these syndromes, Rothmund-Thomson (RTS), RAPADILINO and Baller-Gerold (BGS), are characterized by growth retardation and radial defects"
    explanation: Growth retardation is named as a shared constitutional feature of all three RECQL4 syndromes including BGS.
- name: Cutaneous Poikilodermatous Degeneration
  biological_scale: TISSUE
  description: >-
    In the poikiloderma-positive subgroup the skin passes through an
    inflammatory erythematous phase on the face and extremities within the first
    years of life and then evolves into fixed poikiloderma - reticulate hypo-
    and hyperpigmentation with telangiectasia and atrophy. The cellular route
    from RECQL4 loss to this cutaneous change has not been worked out in human
    skin.
  downstream:
  - target: Poikiloderma
    description: >-
      The evolving cutaneous change is the poikiloderma that defines the
      RECQL4-related subgroup of BGS.
    evidence:
    - reference: PMID:20301383
      reference_title: Baller-Gerold Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Skin lesions may appear anytime within the first few years after birth, typically beginning with erythema of the face and extremities and evolving into poikiloderma."
      explanation: Describes the temporal evolution from erythema to poikiloderma, which is the step this edge asserts.
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "poikiloderma that is a hallmark feature in both RTS and BGS"
    explanation: Establishes poikiloderma as a hallmark cutaneous feature of BGS, distinguishing it from RAPADILINO syndrome.
phenotypes:
- category: Craniofacial
  name: Craniosynostosis
  description: >-
    Premature fusion of one or more cranial sutures is one of the two defining
    features of BGS and is usually apparent at birth. The coronal suture is most
    commonly involved, but the metopic, lambdoid and sagittal sutures may be
    affected alone or in combination.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baller-Gerold syndrome (BGS) can be suspected at birth in an infant with craniosynostosis and upper limb abnormality."
    explanation: Craniosynostosis is one of the two findings that define the clinical suspicion of BGS at birth.
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coronal suture is most commonly affected; the metopic, lambdoid, and sagittal sutures may also be involved alone or in combination."
    explanation: Specifies which sutures are involved and their relative frequency.
- category: Craniofacial
  name: Coronal Craniosynostosis
  description: >-
    The coronal suture is the one most commonly fused in BGS, and in severe
    cases the fusion is bilateral.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Coronal craniosynostosis
    term:
      id: HP:0004440
      label: Coronal craniosynostosis
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coronal suture is most commonly affected"
    explanation: Identifies the coronal suture as the most frequently affected suture in BGS.
  - reference: PMID:1583650
    reference_title: The Baller-Gerold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in addition to coronal bilateral craniosynostosis was observed at necropsy"
    explanation: Documents bilateral coronal synostosis confirmed at autopsy in a severe neonatal case.
- category: Musculoskeletal
  name: Radial Ray Deficiency
  description: >-
    A preaxial upper-limb reduction defect is the second defining feature. It
    spans thumb hypoplasia or aplasia and radial hypoplasia or aplasia in
    combination, may be asymmetric between the two arms, and in severe cases is
    complete bilateral radial agenesis with oligodactyly.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Radial ray deficiency
    term:
      id: HP:0006433
      label: Radial ray deficiency
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upper limb abnormality can include a combination of thumb hypo- or aplasia and radial hypo- or aplasia and may be asymmetric."
    explanation: Defines the composition and asymmetry of the radial ray defect in BGS.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are characterized by growth retardation and radial defects"
    explanation: Radial defects are named as a constant feature across the RECQL4 syndromes including BGS.
- category: Musculoskeletal
  name: Radial Aplasia or Hypoplasia
  description: >-
    The radius itself is absent or short. Complete bilateral radial agenesis was
    documented at autopsy in a severe neonatal case.
  phenotype_term:
    preferred_term: Aplasia/Hypoplasia of the radius
    term:
      id: HP:0006501
      label: Aplasia/Hypoplasia of the radius
  evidence:
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baller-Gerold syndrome (BGS) is a rare autosomal recessive condition with radial aplasia/hypoplasia and craniosynostosis"
    explanation: Radial aplasia or hypoplasia is part of the definition of the syndrome.
  - reference: PMID:1583650
    reference_title: The Baller-Gerold syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was also bilateral radial agenesis, oligodactyly of the hands and feet, a midline facial angioma, and a scrotally positioned anus"
    explanation: Documents complete bilateral radial agenesis at the severe end of the spectrum.
- category: Musculoskeletal
  name: Thumb Aplasia or Hypoplasia
  description: >-
    Absent or hypoplastic thumbs accompany the radial defect and are the target
    of pollicization surgery.
  phenotype_term:
    preferred_term: Aplasia/Hypoplasia of the thumb
    term:
      id: HP:0009601
      label: Aplasia/Hypoplasia of the thumb
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thumb hypo- or aplasia and radial hypo- or aplasia"
    explanation: Thumb hypoplasia or aplasia is listed as a component of the BGS upper-limb abnormality.
- category: Musculoskeletal
  name: Carpal and Metacarpal Anomalies
  description: >-
    Malformation or absence of carpal or metacarpal bones extends the preaxial
    reduction defect distally into the hand.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Malformation or absence of carpal and metacarpal bones
    term:
      id: HP:0001191
      label: Abnormal carpal morphology
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malformation or absence of carpal or metacarpal bones has also been described."
    explanation: GeneReviews records carpal and metacarpal involvement as part of the BGS limb phenotype.
- category: Growth
  name: Growth Deficiency
  description: >-
    Growth is slow from infancy, with height and length typically reaching about
    4 SD below the mean. Onset is prenatal in severe cases.
  frequency: VERY_FREQUENT
  phenotype_term:

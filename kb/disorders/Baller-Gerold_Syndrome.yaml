name: Baller-Gerold Syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  Baller-Gerold syndrome (BGS) is a rare autosomal recessive malformation
  syndrome defined by the co-occurrence of craniosynostosis - most often of the
  coronal suture - with a radial ray defect of the upper limb, together with
  pre- and postnatal growth restriction. A poikilodermatous rash that begins as
  facial and acral erythema in the first years of life develops in a subset of
  patients. In that poikiloderma-positive subgroup the cause is biallelic
  loss-of-function variants in RECQL4, the RecQ-family DNA helicase gene that
  also underlies Rothmund-Thomson syndrome type 2 and RAPADILINO syndrome;
  RECQL4 is required for firing of DNA replication origins, and its loss causes
  proliferation failure in dividing progenitor populations. BGS ascertained
  without poikiloderma is genetically heterogeneous and is generally not
  RECQL4-related, having been reassigned in individual cases to Fanconi anemia,
  Roberts/SC phocomelia, TWIST1-related craniosynostosis, and Pfeiffer syndrome.
  The mechanism by which RECQL4 loss produces premature cranial suture fusion,
  which distinguishes BGS from the allelic Rothmund-Thomson syndrome, is
  unresolved.
synonyms:
- BGS
- craniosynostosis with radial defects
- craniosynostosis-radial aplasia syndrome
parents:
- Genetic Disease
- Skeletal Disease

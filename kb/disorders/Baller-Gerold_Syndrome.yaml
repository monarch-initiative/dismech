discussions:
- discussion_id: bgs_craniosynostosis_mechanism_gap
  prompt: >-
    Why does biallelic RECQL4 loss cause premature cranial suture fusion in
    Baller-Gerold syndrome but not in the allelic Rothmund-Thomson syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Ossification and Skeletal Patterning
  rationale: >-
    Craniosynostosis is the single feature that keeps BGS separate from RTS,
    yet the same gene and overlapping allele types are involved. The published
    cellular mechanism for RECQL4 skeletal disease is progenitor proliferation
    failure, which predicts hypo-ossification rather than premature suture
    fusion, and no genotype-phenotype rule or modifier has been identified that
    explains why the suture is affected in one syndrome and spared in the other.
  evidence:
  - reference: PMID:34869606
    reference_title: Molecular Mechanisms of the RECQ4 Pathogenic Mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nonetheless, RTS and BGS remain as two separate syndromes, since BGS also displays craniosynostosis during embryonic development, which is not shared with RTS."
    explanation: States that craniosynostosis is the discriminating feature between the two allelic syndromes, which is precisely what the mechanism does not account for.
- discussion_id: bgs_recql4_negative_heterogeneity
  prompt: >-
    What causes Baller-Gerold syndrome in the patients who have craniosynostosis
    and a radial ray defect but no poikiloderma and no RECQL4 variant?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#RECQL4-negative
  - genetic#RECQL4
  rationale: >-
    A systematic sequencing series found no RECQL4 variants in any BGS patient
    lacking poikiloderma, and a chromosomal abnormality and a TWIST mutation
    were identified instead in that cohort. The molecular basis of the remainder
    is unknown, which means the clinical label covers at least one
    uncharacterized entity as well as the RECQL4-related disorder curated here.
  evidence:
  - reference: PMID:24635570
    reference_title: "Search for ReCQL4 mutations in 39 patients genotyped for suspected Rothmund-Thomson/Baller-Gerold syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One chromosomal abnormality and one TWIST mutation was found in this cohort."
    explanation: Shows that alternative molecular causes account for only part of the RECQL4-negative group, leaving the rest unexplained.
  - reference: PMID:24635570
    reference_title: "Search for ReCQL4 mutations in 39 patients genotyped for suspected Rothmund-Thomson/Baller-Gerold syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aim of our study was therefore to determine the best clinical indicators for the presence of RECQL4 mutations in a series of 39 patients referred for RECQL4 molecular analysis and belonging to the RTS (27 cases) and BGS (12 cases) spectrum."
    explanation: Establishes the size and design of the series in which the RECQL4-negative BGS group was defined.
notes: >-
  Lump/split decision. Baller-Gerold syndrome is curated as its own Disease
  entry rather than as a has_subtypes entry on Rothmund-Thomson Syndrome
  (kb/disorders/Rothmund-Thomson_Syndrome.yaml), for four reasons. First, the
  defining feature is not shared, because BGS has craniosynostosis and RTS does
  not, and the RECQL4 literature treats that as the reason the two remain
  separate syndromes. Second, MONDO places them under different parents, BGS
  (MONDO:0009039) under syndromic craniosynostosis (MONDO:0015338) and RTS
  (MONDO:0010002) among the genodermatoses, and the curated RTS entry's
  has_subtypes slot is already used for its own two molecular types (ANAPC1 type
  1, RECQL4 type 2), so a BGS subtype there would misparent it. Third, BGS is
  not simply RECQL4 disease plus craniosynostosis. It is a clinically
  ascertained entity of which only the poikiloderma-positive subgroup is
  RECQL4-related, with the remainder heterogeneous and reassigned in individual
  cases to Fanconi anemia, Roberts/SC phocomelia, TWIST1-related
  craniosynostosis and Pfeiffer syndrome. A subtype of an RECQL4-defined entry
  cannot represent an entity that is partly not RECQL4-related. Fourth,
  management diverges, since cranial vault surgery before six months and
  pollicization are BGS-specific and appear nowhere in the RTS entry.
  The counter-argument is recorded rather than dismissed. Van Maldergem et al.
  (PMID:15964893) conclude that RECQL4-related BGS could be integrated into a
  clinical spectrum encompassing RTS and RAPADILINO syndrome, and Siitonen et
  al. (PMID:18716613) treat the three as one allelic series. This entry accepts
  the spectrum framing at the level of mechanism, since the pathophysiology
  chain here is the RECQL4 replication-initiation defect, the same lesion the
  RTS entry curates, while keeping the disease entries separate at the level of
  clinical entity.
  Deliberate omissions. Osteosarcoma and lymphoma are not curated as BGS
  phenotypes. GeneReviews recommends surveillance for them, but does so by
  extrapolation from the allelic RECQL4 disorders, and the cancer incidence in
  BGS itself has explicitly not been determined, so asserting them as phenotypes
  would overstate the evidence. They appear here only as the indication for the
  surveillance treatment. No conforms_to was declared, because the two candidate
  genomic-instability modules frame their chains around aging and around tumor
  clonal evolution respectively, whereas the BGS chain is a developmental
  proliferation deficit, and the published mouse work argues the skeletal
  phenotype arises from progenitor proliferation failure rather than from a
  mutator phenotype.
  Content deliberately not duplicated from the Rothmund-Thomson entry includes
  juvenile cataracts, sparse hair, eyelashes and eyebrows, patellar aplasia,
  dental abnormalities, osteopenia, the ANAPC1 type 1 mechanism, and the
  osteosarcoma predisposition chain, all of which are RTS features curated
  there.

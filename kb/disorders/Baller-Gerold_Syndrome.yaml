genetic:
- name: RECQL4
  gene_term:
    preferred_term: RECQL4
    term:
      id: hgnc:9949
      label: RECQL4
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:25966250
      reference_title: "Identification of novel compound heterozygous RECQL4 mutations and prenatal diagnosis of Baller-Gerold syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "each parent was found to be a carrier of one of the mutations"
      explanation: Each parent carried one variant and the affected fetus carried both, which is the expected recessive segregation.
  notes: >-
    RECQL4 encodes a RecQ-family DNA helicase. Reported BGS genotypes include
    compound heterozygosity for a missense and a frameshift allele, homozygosity
    for a splice acceptor variant, and compound heterozygosity for a splice
    acceptor variant with a frameshift. The same gene causes Rothmund-Thomson
    syndrome type 2 and RAPADILINO syndrome; genotype does not map cleanly onto
    which of the three clinical phenotypes a patient manifests. RECQL4 variants
    are found in BGS with poikiloderma and are not found in BGS without it.
  evidence:
  - reference: PMID:15964893
    reference_title: "Revisiting the craniosynostosis-radial ray hypoplasia association: Baller-Gerold syndrome caused by mutations in the RECQL4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because patients with RAPADILINO syndrome and a subset of patients with RTS have RECQL4 mutations, we reassessed two previously reported BGS families and found causal mutations in RECQL4 in both."
    explanation: Establishes RECQL4 as causative in BGS by re-analysis of two previously reported families.
  - reference: PMID:25966250
    reference_title: "Identification of novel compound heterozygous RECQL4 mutations and prenatal diagnosis of Baller-Gerold syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two heterozygous mutations (c.2059-1G>C and c.2141_2142delAG) were detected in the RECQL4 (NM_004260) gene in the fetus; therefore, the fetus was predicted to have Baller-Gerold syndrome."
    explanation: Reports two further novel biallelic RECQL4 alleles used to make a prenatal BGS diagnosis.
  - reference: PMID:24635570
    reference_title: "Search for ReCQL4 mutations in 39 patients genotyped for suspected Rothmund-Thomson/Baller-Gerold syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No RECQL4 mutations were found in the BGS group without poikiloderma, confirming that RECQL4 sequencing was not indicated in this phenotype."
    explanation: Bounds the causal claim, since RECQL4 explains BGS only where poikiloderma is present.
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of BGS is established in a proband with typical clinical findings and/or the identification of biallelic pathogenic variants in RECQL4 by molecular genetic testing."
    explanation: Confirms biallelic RECQL4 variants as the molecular diagnostic criterion for BGS.
animal_models:
- name: Recql4 exon 13 helicase-domain deleted mouse
  species: Mouse
  genotype: Recql4 exon 13 deletion (RecQ helicase domain), homozygous
  publication: PMID:12915449
  description: >-
    Complete Recql4 knockout is embryonic lethal at E3.5-6.5. Deletion of exon
    13 alone, within the consensus RecQ helicase domain that is the main site of
    patient mutations, yields viable mice with severe growth retardation,
    abnormalities in several tissues, and a proliferation defect in embryonic
    fibroblasts.
  modeled_mechanisms:
  - target: Generalized Growth Restriction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The helicase-domain mouse reproduces the severe constitutional growth
      deficit that characterizes the human RECQL4 syndromes.
    limitations: >-
      The model was generated and interpreted against Rothmund-Thomson syndrome
      rather than BGS, and no craniosynostosis is reported, so it does not
      address the feature that distinguishes BGS from its allelic disorders.
    evidence:
    - reference: PMID:12915449
      reference_title: Growth retardation and skin abnormalities of the Recql4-deficient mouse.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The exon 13-deleted Recql4-deficient mice are viable, but exhibit severe growth retardation and abnormalities in several tissues, and embryonic fibroblasts show a defect in cell proliferation."
      explanation: Reports the growth phenotype and the underlying proliferation defect in this allele.
  evidence:
  - reference: PMID:12915449
    reference_title: Growth retardation and skin abnormalities of the Recql4-deficient mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockout mice in which the Recql4 gene is disrupted at exons 5-8 exhibit embryonic lethality at embryonic day 3.5-6.5."
    explanation: Explains why a hypomorphic helicase-domain allele rather than a null is the informative model.
- name: Osterix-Cre conditional Recql4 osteoblast-progenitor knockout mouse
  species: Mouse
  genotype: Recql4 fl/fl Osx-Cre conditional deletion in osteoblast progenitors
  publication: PMID:25859855
  description: >-
    Conditional Recql4 deletion at the osteoblast-progenitor stage produces
    shorter bones and reduced bone volume with a cell-intrinsic fall in mineral
    apposition and bone formation rate, whereas deletion in mature osteoblasts
    and osteocytes causes no detectable phenotype.
  modeled_mechanisms:
  - target: Defective Ossification and Skeletal Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that the skeletal consequence of Recql4 loss is
      stage-specific and progenitor-intrinsic, which is the mechanism proposed
      for the benign skeletal phenotypes of the human RECQL4 syndromes.
    limitations: >-
      The phenotype is reduced bone length and volume in the appendicular
      skeleton, not a radial ray reduction defect or cranial suture fusion, so
      the model reproduces the cellular lesion rather than the BGS malformation
      pattern. Recql4 loss alone was also not sufficient to initiate
      osteosarcoma in this model.
    readouts:
    - name: Bone volume and bone length at nine weeks
      target: Defective Ossification and Skeletal Patterning
      direction: DECREASED
      interpretation: >-
        Structural correlate of the reduced-ossification node in this model.
      evidence:
      - reference: PMID:25859855
        reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "resulted in mice with shorter bones and reduced bone volume, assessed at 9 weeks of age"
        explanation: Reports the direction and timing of the skeletal measurement.
    evidence:
    - reference: PMID:25859855
      reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data provide a mechanism for the benign skeletal phenotypes of RECQL4 mutation syndromes."
      explanation: The authors offer this model as the mechanism for the skeletal phenotypes of the RECQL4 syndromes, which include BGS.
  evidence:
  - reference: PMID:25859855
    reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of Recql4 in mature osteoblasts/osteocytes in vivo, however, did not cause a detectable phenotype."
    explanation: Shows the requirement is restricted to the progenitor stage, which is why the model is informative for a developmental malformation syndrome.

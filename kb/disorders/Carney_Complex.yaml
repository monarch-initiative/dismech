      Analysis of additional cases revealed the same mutation in a sporadic case
      of CNC, and different mutations in three other families, including one
      with isolated inherited cardiac myxomas.
    explanation: >-
      Documents the allelic spectrum, including a de novo sporadic case and a
      family with an isolated cardiac-myxoma phenotype, which supports the
      variable expressivity curated in this entry.

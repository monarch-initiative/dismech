treatments:
- name: Lifelong Echocardiographic Surveillance for Cardiac Myxoma
  notes: >-
    Curated under `treatments:` as a management intervention, not as a claim
    that imaging or biochemistry is itself therapeutic. In a two-hit
    predisposition syndrome the second hit cannot be prevented, so the only
    available lever is stage at detection: surveillance is the intervention
    that converts an unavoidable tumor into a resectable one. Where a
    `target_mechanisms` link is present it points at the clinical-outcome node
    for that reason, and never at an upstream mechanistic node.
  description: >-
    The single most consequential intervention in Carney complex. Because
    myxomas arise at a young age, in any chamber, and recur after excision,
    echocardiography begins in childhood and moves to twice-yearly in anyone
    who has already had one excised. Surveillance does not end after a
    successful operation — recurrence in retained tissue is expected, which is
    the clinical expression of independent second hits.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  target_mechanisms:
  - target: Multiple Neoplasia and Paradoxical Endocrine Overactivity
    treatment_effect: INHIBITS
    description: >-
      Surveillance acts on the consequence node by detecting myxomas before
      they obstruct, embolise or cause heart failure; it does not prevent their
      formation.
  evidence:
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography annually beginning in childhood, biannually for those
      with a history of excised myxoma
    explanation: >-
      GeneReviews Management section, giving the surveillance interval and its
      escalation after a first myxoma — the schedule this entry curates as
      lifelong.
- name: Surgical Excision of Myxomas and Endocrine Tumors
  description: >-
    Cardiac myxomas are removed by open heart surgery; cutaneous and mammary
    myxomas are excised locally. Endocrine disease is managed organ by organ,
    including bilateral adrenalectomy for the Cushing syndrome of PPNAD. In boys
    with aggressive Sertoli cell tumors, orchiectomy is done specifically to
    prevent premature epiphyseal fusion and central precocious puberty rather
    than for malignant potential.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Multiple Neoplasia and Paradoxical Endocrine Overactivity
    treatment_effect: INHIBITS
    description: >-
      Resection removes established lesions and their hormonal output; the
      germline lesion and the risk of further tumors are unchanged.
  evidence:
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surgical excision via open heart surgery for cardiac myxomas; surgical
      excision of cutaneous and mammary myxomas; bilateral adrenalectomy for
      Cushing syndrome; transsphenoidal surgery for pituitary adenoma
    explanation: >-
      GeneReviews Management section, giving the organ-by-organ surgical
      approach across the complex.
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      orchiectomy for boys with aggressive LCCSCT and gynecomastia to avoid
      premature epiphyseal fusion and induction of central precocious puberty
    explanation: >-
      GeneReviews Management section. The stated indication is endocrine
      consequence rather than malignancy, which is why this is a growth-related
      decision in childhood.
- name: Endocrine Surveillance from Adolescence
  description: >-
    Biochemical surveillance across the endocrine axes the complex affects —
    cortisol, IGF-1, thyroid and gonadal — beginning in adolescence, with
    growth rate and pubertal staging monitored at every visit in children.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Multiple Neoplasia and Paradoxical Endocrine Overactivity
    treatment_effect: INHIBITS
    description: >-
      Detects hormonal overactivity before it produces irreversible endocrine
      consequences; acts on the consequence node, not on the lesion.
  evidence:
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      urinary free cortisol levels annually beginning in adolescence with
      diurnal cortisol levels, dexamethasome stimulation test, and adrenal CT as
      needed; annual serum IGF-1 beginning in adolescence
    explanation: >-
      GeneReviews Management section, giving the adrenal and somatotroph
      surveillance analytes and their start age.
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      monitor growth rate and pubertal staging at each visit and testicular
      ultrasound annually in males beginning in childhood
    explanation: >-
      GeneReviews Management section, giving the paediatric surveillance that
      exists because the Sertoli cell tumor acts on growth and puberty.
diagnosis:
- name: Clinical Diagnostic Criteria for Carney Complex
  description: >-
    A clinical diagnosis rests on two or more major diagnostic criteria drawn
    from the pigmentary, myxomatous, endocrine and schwannoma features. The
    median age at diagnosis is 20 years, so most patients are identified in
    adolescence or early adulthood.
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Two or more major criteria establish the clinical diagnosis and prompt
    confirmatory PRKAR1A testing.
  evidence:
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical diagnosis of CNC is established in a proband with two or more
      major diagnostic criteria.
    explanation: >-
      GeneReviews Diagnosis/Testing section, giving the clinical diagnostic
      threshold.
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The median age of diagnosis is 20 years.
    explanation: >-
      GeneReviews Clinical Characteristics section, giving the age at which the
      diagnosis is typically made — the practical target that surveillance of
      at-risk relatives aims to beat.
- name: Molecular Genetic Testing for PRKAR1A
  description: >-
    A heterozygous germline PRKAR1A pathogenic variant establishes the molecular
    diagnosis. Where testing is uninformative — expected in the subset of
    families mapping to the second locus at 2p16 — GeneReviews recommends
    surveillance of at-risk relatives on the basis of their 50% prior risk
    rather than discharging them.
  diagnosis_term:
    preferred_term: Genetic Testing

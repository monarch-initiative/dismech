  prompt: >-
    By which mechanism does loss of neuronal citrate uptake cause seizures - is
    the dominant driver a neuronal energy/tricarboxylic-acid-cycle deficit,
    reduced supply of citrate-derived precursors for glutamate and GABA
    neurotransmitter synthesis, or the effect of accumulated extracellular
    citrate chelating divalent cations (Zn2+, Ca2+, Mg2+) that normally modulate
    NMDA-receptor excitability?

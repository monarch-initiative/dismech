mechanistic_hypotheses:
- hypothesis_group_id: intracellular_citrate_depletion
  hypothesis_label: Intracellular neuronal citrate and TCA-intermediate depletion
  status: CANONICAL
  description: >-
    Loss of NaCT-mediated citrate import deprives neurons of extracellular and
    astrocyte-derived citrate needed to replenish tricarboxylic acid cycle
    intermediates, cytosolic acetyl-CoA, and neurotransmitter synthesis,
    impairing neuronal bioenergetics and excitability regulation.
  evidence:
  - reference: PMID:26384929
    reference_title: "Recessive mutations in SLC13A5 result in a loss of citrate transport and cause neonatal epilepsy, developmental delay and teeth hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurons are considered incapable of de novo synthesis of tricarboxylic acid cycle intermediates; therefore they rely on the uptake of intermediates, such as citrate, to maintain their energy status and neurotransmitter production."
    explanation: >-
      Frames intracellular neuronal citrate import as essential for TCA-cycle
      energy metabolism and neurotransmitter synthesis.
  - reference: PMID:28673551
    reference_title: "Analyses of SLC13A5-epilepsy patients reveal perturbations of TCA cycle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinctive elevations of citrate and dysregulation of citric acid cycle intermediates, supporting the hypothesis that loss of SLC13A5 function alters tricarboxylic acid cycle (TCA) metabolism and may disrupt metabolic compartmentation in the brain."
    explanation: >-
      Patient CSF and plasma metabolomics support perturbed cerebral TCA-cycle
      metabolism and metabolic compartmentation.
- hypothesis_group_id: extracellular_citrate_zinc_nmda
  hypothesis_label: Extracellular citrate chelation of zinc and NMDA receptor disinhibition
  status: EMERGING
  description: >-
    Unimported citrate accumulates in the brain extracellular space and
    over-chelates free synaptic and plasma-membrane Zn2+ ions, relieving
    tonic zinc-mediated inhibition of excitatory NMDA glutamate receptors and
    driving sustained neuronal Ca2+ influx and seizure-like hyperexcitability.
  evidence:
  - reference: PMID:40208862
    reference_title: "Modulation of NMDA receptor signaling and zinc chelation prevent seizure-like events in a zebrafish model of SLC13A5 epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data provide empirical evidence in support of the hypothesis that excess extracellular citrate over-chelates the zinc ions needed to regulate NMDA receptor function, leading to sustained channel opening and an exaggerated excitatory response that manifests as seizures."
    explanation: >-
      Zebrafish slc13a5 mutant studies provide direct experimental support for
      extracellular citrate chelation of Zn2+ and consequent NMDA receptor
      disinhibition as an emerging seizure mechanism.

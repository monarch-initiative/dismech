biochemical:
- name: Elevated Citrate
  presence: INCREASED
  context: >-
    Because NaCT-mediated citrate uptake is lost, citrate accumulates
    extracellularly. Distinctive elevations of citrate (in plasma, cerebrospinal
    fluid, and urine) together with dysregulated TCA-cycle intermediates form a
    diagnostic metabolic signature useful for diagnosis and for resolving
    variants of uncertain significance.
  biomarker_term:
    preferred_term: citrate
    term:
      id: CHEBI:16947
      label: citrate(3-)
  readouts:
  - target: Impaired Neuronal Citrate Uptake
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated plasma and cerebrospinal-fluid citrate reflect failure of
      NaCT-mediated citrate uptake.
  evidence:
  - reference: PMID:28673551
    reference_title: "Analyses of SLC13A5-epilepsy patients reveal perturbations of TCA cycle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinctive elevations of citrate and dysregulation of citric acid  cycle intermediates, supporting the hypothesis that loss of SLC13A5 function  alters tricarboxylic acid cycle (TCA) metabolism"
    explanation: >-

treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with antiseizure medications; the epilepsy is often
    treatment-resistant in early childhood, though seizure frequency tends to
    decrease with age in many individuals. Valproic acid has high clinical
    utilization and caregiver-reported benefit, acetazolamide has decreased
    seizures in a subset of patients, and GABAergic or sodium-channel agents can
    reduce seizure frequency.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
  target_mechanisms:
  - target: Neuronal Excitability Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Antiseizure medications suppress neuronal hyperexcitability to reduce
      ictal frequency and status epilepticus risk.
  evidence:
  - reference: PMID:27261973
    reference_title: "Mutations in the Na(+)/citrate cotransporter NaCT (SLC13A5) in pediatric patients with epilepsy and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acetazolamide, a carbonic anhydrase inhibitor and atypical  anti-seizure medication decreases seizures in 4 patients."
    explanation: >-
      Acetazolamide decreased seizures in a subset of patients.
  - reference: PMID:41442826
    reference_title: "SLC13A5 citrate transporter disorder epilepsy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple antiseizure medications were felt to be of benefit by caregivers, with valproic acid having the highest utilization with 22 patients and 80 % of caregivers reporting it to be helpful or very helpful."
    explanation: >-
      In a 30-patient prospective natural history study, valproic acid had the
      highest utilization and caregiver-reported benefit.
- name: Ketogenic Diet
  description: >-
    A ketogenic-diet trial is sometimes considered, but its role is unproven and
    reported clinical responses are bidirectional: three patients in an early
    European series responded favorably, whereas a subsequent pediatric series
    found that ketogenic diet and fasting worsened symptoms. It therefore
    requires close clinical monitoring rather than routine recommendation.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Disrupted Citrate-Dependent Neuronal Metabolism
    treatment_effect: MODULATES
    description: >-
      Dietary ketosis alters cerebral energy substrate utilization, with
      conflicting beneficial and worsening seizure responses reported across
      patient series.
  evidence:
  - reference: PMID:26384929
    reference_title: "Recessive mutations in SLC13A5 result in a loss of citrate transport and cause neonatal epilepsy, developmental delay and teeth hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients who tried the ketogenic diet responded well to this treatment, and future studies will allow us to ascertain whether this is a recurrent feature in this severe disorder."
    explanation: >-
      Documents favorable seizure response to the ketogenic diet in three
      treated patients in an early cohort.
  - reference: PMID:27261973
    reference_title: "Mutations in the Na(+)/citrate cotransporter NaCT (SLC13A5) in pediatric patients with epilepsy and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to  previous reports, the ketogenic diet and fasting produce worsening of symptoms."
    explanation: >-
      Documents symptom worsening with the ketogenic diet and fasting in a
      subsequent series, demonstrating bidirectional clinical response.
- name: AAV Gene Replacement Therapy
  description: >-
    Because antiseizure medications are only partially effective, gene-replacement
    therapy that restores NaCT is being developed. In a preclinical mouse model,
    cerebrospinal-fluid AAV9-mediated delivery of functional human SLC13A5
    lowered extracellular citrate and rescued epileptic and electrophysiologic
    phenotypes, and a Phase 1/2 open-label lumbar intrathecal clinical trial of
    TSHA-105 is registered (NCT07102524).
  action_category: THERAPEUTIC
  therapeutic_modality: GENE_THERAPY
  delivery_system:
    delivery_platform: VIRAL_VECTOR
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: NaCT Citrate Transporter Deficiency
    treatment_effect: RESTORES
    description: >-
      Gene replacement restores NaCT citrate-transporter expression, correcting
      the primary deficiency.
  evidence:
  - reference: PMID:41712282
    reference_title: "AAV-mediated gene therapy in a model of SLC13A5 citrate transporter disorder rescues epileptic and metabolic phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cerebrospinal fluid delivery of AAV9/SLC13A5 decreased extracellular citrate levels, normalized electrophysiologic and sleep architecture abnormalities, and restored resistance to chemically induced seizures and death."
    explanation: >-
      In Slc13a5-knockout mice, cerebrospinal fluid delivery of AAV9/SLC13A5
      reduced extracellular citrate and rescued electrophysiologic and seizure
      phenotypes.

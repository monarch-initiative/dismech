discussions:
- discussion_id: gap_slc13a5_seizure_mechanism
  prompt: >-
    By which mechanism does loss of neuronal citrate uptake cause seizures - is
    the dominant driver a neuronal energy/tricarboxylic-acid-cycle deficit,
    reduced supply of citrate-derived precursors for glutamate and GABA
    neurotransmitter synthesis, or the effect of accumulated extracellular
    citrate chelating divalent cations (Zn2+, Ca2+, Mg2+) that normally modulate
    NMDA-receptor excitability?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Citrate-Dependent Neuronal Metabolism
  - pathophysiology#Neuronal Excitability Dysregulation
  rationale: >-
    Citrate sits at the intersection of energy metabolism, lipid and
    neurotransmitter biosynthesis, and extracellular divalent-cation buffering,
    so loss of neuronal citrate handling could cause hyperexcitability through
    several non-exclusive routes. Distinguishing the dominant mechanism matters
    because it determines whether rational therapy should aim to restore neuronal
    energy substrate, replenish neurotransmitter precursors, or normalize
    extracellular citrate and cation balance; current antiseizure treatment is
    empirical and often only partially effective.
  proposed_experiments:
  - experiment_id: exp_slc13a5_seizure_mechanism_dissection
    name: Mechanistic dissection of SLC13A5 hyperexcitability
    description: >-
      In SLC13A5-deficient human iPSC-derived neurons and Slc13a5 model animals,
      measure neuronal energy charge and TCA flux, glutamate/GABA pools, and the
      excitability effects of manipulating extracellular citrate and divalent
      cations, to determine which perturbation is necessary and sufficient for
      the hyperexcitability phenotype.
  evidence:
  - reference: PMID:24995870
    reference_title: "Mutations in SLC13A5 cause autosomal-recessive epileptic encephalopathy with seizure onset in the first days of life."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "further highlight the role of citrate metabolism in epilepsy."
    explanation: >-
      The link between citrate metabolism and epilepsy is established, but the
      precise seizure mechanism remains open.

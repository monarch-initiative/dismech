  - pathophysiology#NMDA Receptor Disinhibition
  - pathophysiology#Neuronal Excitability Dysregulation
  rationale: >-
    Citrate sits at the intersection of energy metabolism, lipid and
    neurotransmitter biosynthesis, and extracellular divalent-cation buffering,
    so loss of neuronal citrate handling could cause hyperexcitability through
    several non-exclusive routes. Distinguishing the dominant mechanism in
    human patients matters because it determines whether rational therapy
    should aim to restore neuronal energy substrate, replenish neurotransmitter
    precursors, or normalize extracellular citrate and Zn2+/NMDA receptor
    signaling; current antiseizure treatment is empirical and often only
    partially effective.
  proposed_experiments:
  - experiment_id: exp_slc13a5_seizure_mechanism_dissection
    name: Mechanistic dissection of SLC13A5 hyperexcitability
    description: >-
      In SLC13A5-deficient human iPSC-derived neurons and Slc13a5 model animals,
      measure neuronal energy charge and TCA flux, glutamate/GABA pools, and the
      excitability effects of manipulating extracellular citrate and divalent
      cations, to determine which perturbation is necessary and sufficient for
      the hyperexcitability phenotype.
  evidence:
  - reference: PMID:24995870
    reference_title: "Mutations in SLC13A5 cause autosomal-recessive epileptic encephalopathy with seizure onset in the first days of life."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "further highlight the role of citrate metabolism in epilepsy."
    explanation: >-
      The link between citrate metabolism and epilepsy is established, while
      the relative contribution of intracellular metabolic depletion versus
      extracellular Zn2+/NMDA disinhibition in humans remains under study.
  - reference: PMID:40208862
    reference_title: "Modulation of NMDA receptor signaling and zinc chelation prevent seizure-like events in a zebrafish model of SLC13A5 epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data provide empirical evidence in support of the hypothesis that excess extracellular citrate over-chelates the zinc ions needed to regulate NMDA receptor function, leading to sustained channel opening and an exaggerated excitatory response that manifests as seizures."
    explanation: >-
      Provides experimental zebrafish evidence supporting the extracellular
      citrate zinc-chelation and NMDA-receptor disinhibition hypothesis
      alongside intracellular metabolic mechanisms.

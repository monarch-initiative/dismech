name: SLC13A5 Citrate Transporter Disorder
creation_date: "2026-07-23T00:00:00Z"
category: Mendelian
synonyms:
- DEE25
- EIEE25
- SLC13A5 deficiency
- SLC13A5-related developmental and epileptic encephalopathy
- Developmental and epileptic encephalopathy 25
description: >-
  SLC13A5 citrate transporter disorder (developmental and epileptic
  encephalopathy 25) is an autosomal recessive neonatal-onset epilepsy caused by
  biallelic loss-of-function variants in SLC13A5, which encodes the
  plasma-membrane sodium-dependent citrate transporter NaCT. NaCT imports extracellular
  citrate into cells; in neurons, imported citrate feeds the tricarboxylic acid
  cycle and supplies carbon for acetyl-CoA and for neurotransmitter precursor
  synthesis. Loss of NaCT reduces neuronal citrate uptake, so intracellular
  citrate falls while extracellular and cerebrospinal-fluid citrate rise
  (elevated cerebrospinal-fluid citrate is a recognized diagnostic clue). The
  resulting disruption of citrate-dependent neuronal metabolism produces
  treatment-resistant seizures beginning in the first days of life, together with
  developmental delay, hypotonia, and motor impairment. Because NaCT is
  also expressed in tooth-forming ameloblasts, affected individuals
  characteristically have abnormal dental enamel (amelogenesis imperfecta).

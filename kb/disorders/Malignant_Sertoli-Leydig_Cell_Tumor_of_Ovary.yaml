progression:
- phase: Early-stage unilateral presentation in young women
  notes: >-
    SLCT predominates in the second and third decades and presents as a large unilateral
    stage I mass; in one consecutive series every tumor was FIGO stage IA and none
    recurred. Median age at diagnosis in germline DICER1 carriers is 14 years, and
    DICER1-related ovarian sex cord-stromal tumors are most often diagnosed before age
    40, which is what bounds the surveillance window.
  evidence:
  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of tumors
      occur in individuals younger than age 40 years.
    explanation: >-
      GeneReviews Clinical Characteristics evidence for the age distribution of
      DICER1-related tumors, which is the basis for ending intensive ovarian
      surveillance around age 40.
  - reference: PMID:31344718
    reference_title: "Ovarian Sertoli-Leydig Cell Tumors: Epidemiological, Clinical and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the SLCTs were at stage IA, and most of them were moderately differentiated.
    explanation: >-
      Documents the early-stage presentation characteristic of this tumor.
- phase: Malignant potential graded by differentiation
  notes: >-
    Prognosis tracks stage and histologic differentiation. Well-differentiated tumors
    have essentially no malignant potential; the risk rises substantially with
    decreasing differentiation, which is the same axis along which the DICER1 driver is
    distributed.
  evidence:

histopathology:
- name: Moderately or Poorly Differentiated Sertoli-Leydig Morphology
  description: >-
    Tumors are graded well, moderately, or poorly differentiated, with or without
    heterologous elements or a retiform pattern. Moderately and poorly differentiated
    and retiform types commonly co-occur as a morphologic spectrum, whereas the
    well-differentiated form typically occurs in pure form and is genetically distinct.
  diagnostic: true
  evidence:
  - reference: PMID:36583307
    reference_title: Well-differentiated Sertoli-Leydig Cell Tumors (SLCTs) Are Not Associated With DICER1 Pathogenic Variants and Represent a Different Tumor Type to Moderately and Poorly Differentiated SLCTs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Well-differentiated SLCT is the least common and typically occurs in pure form,
      whereas moderately and poorly differentiated and retiform types often comprise a
      morphologic spectrum with an admixture of all 3.
    explanation: >-
      Describes the grading scheme and the morphologic separation this entry's scope
      depends on.
  - reference: PMID:31344718
    reference_title: "Ovarian Sertoli-Leydig Cell Tumors: Epidemiological, Clinical and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the anatomopathological exam, 1 (8.3%) tumor was well-differentiated, 8 (66.7%)
      were moderately differentiated, and 3 (25.0%) were poorly differentiated.
    explanation: >-
      Gives the observed distribution of differentiation grades in a consecutive series.
diagnosis:
- name: DICER1 Molecular Testing, Tumor and Germline
  description: >-
    Diagnosis rests on morphology plus a sex cord immunophenotype, with DICER1 RNase IIIb
    testing used both to confirm a moderately/poorly differentiated or retiform SLCT and
    to trigger germline evaluation. The workflow is deliberately two-tiered: a somatic
    hotspot variant in the tumor prompts germline testing, and a negative conventional
    germline test does not close the question, because deep intronic splice-altering
    DICER1 variants have been found by custom-capture panel in patients whose exon-directed
    sequencing was negative.
  evidence:
  - reference: PMID:37883719
    reference_title: Intronic Germline DICER1 Variants in Patients With Sertoli-Leydig Cell Tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that when no DICER1 pLOF variants or large deletions are discovered in
      exonic regions despite strong clinical suspicion, intron sequencing and splicing
      analysis should be performed.
    explanation: >-
      States the escalation step in the diagnostic workflow that prevents a falsely
      negative germline result from ending the evaluation.
  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DICER1 is established by identification of a
      heterozygous germline DICER1 pathogenic variant that is known or suspected to
      cause loss of function.
    explanation: >-
      GeneReviews diagnostic criterion for the predisposition syndrome that an SLCT
      diagnosis should prompt testing for.
genetic:
- name: DICER1
  association: >-
    Somatic missense mutations at the four metal-binding residues of the RNase IIIb
    catalytic centre are the defining recurrent lesion, present in about 44-60% of

  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once a germline DICER1 pathogenic variant has been
      identified in an affected family member, predictive testing for at-risk
      relatives and prenatal/preimplantation genetic testing are possible.
    explanation: >-
      Supports cascade genetic testing of relatives once a germline variant is found.

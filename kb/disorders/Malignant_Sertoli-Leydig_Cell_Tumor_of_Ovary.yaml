    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1 is inherited in an autosomal dominant manner with reduced,
      age-related penetrance.
    explanation: >-
      GeneReviews states the mode of inheritance and the reduced age-related penetrance
      curated in this block.

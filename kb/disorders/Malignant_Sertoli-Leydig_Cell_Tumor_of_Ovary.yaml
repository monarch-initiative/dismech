discussions:
- discussion_id: slct_non_dicer1_drivers
  kind: KNOWLEDGE_GAP
  prompt: >-
    What mechanism drives the FOXL2 C134W-mutant and the DICER1/FOXL2 double-wild-type
    subsets of Sertoli-Leydig cell tumor, and are these one disease with three routes or
    three diseases sharing a morphology?
  attaches_to:
  - "pathophysiology#DICER1 RNase IIIb Hotspot Mutation"
  rationale: >-
    Molecular classification of SLCT identifies at least three groups with distinct
    clinicopathologic profiles: DICER1-mutant (young, androgenic, retiform or
    heterologous elements), FOXL2 C134W-mutant (postmenopausal, abnormal bleeding), and
    double wild-type at intermediate age, which accounts for about 37% of tumors and
    includes all well-differentiated cases. Only the DICER1 arm has a worked-out
    mechanism; no driver at all is known for the wild-type group, which is the largest
    single category after DICER1. This matters for entry granularity as well as biology:
    if the FOXL2-mutant SLCTs turn out to share the AGCT mechanism, the boundary between
    this entry and Adult Granulosa Cell Tumor of Ovary is drawn in the wrong place, and
    the mutual exclusivity of the two drivers within a single morphologic category is
    currently the main evidence that it is not.
  evidence:
  - reference: PMID:30986800
    reference_title: DICER1 and FOXL2 Mutation Status Correlates With Clinicopathologic Features in Ovarian Sertoli-Leydig Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest at least 3 molecular subtypes of SLCT with distinct
      clinicopathologic features: DICER1 mutant (younger, more androgenic symptoms,
      moderately/poorly differentiated, retiform or heterologous elements), FOXL2 mutant
      (postmenopausal, abnormal bleeding, moderately/poorly differentiated, no retiform
      or heterologous elements), and DICER1/FOXL2 wild type (intermediate age, no
      retiform or heterologous elements, including all well-differentiated tumors).
    explanation: >-
      Sets out the three molecular subtypes and the fact that one of them has no
      identified driver, which is the substance of this knowledge gap.
  - reference: PMID:39592485
    reference_title: "Comprehensive analysis of 37 ovarian Sertoli-Leydig cell tumors: morphological, immunohistochemical and molecular characteristics."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DICER1WT tumors showed increased expression of PRKCA, HNF1A, LDLR, and MAP2K5.
      On the contrary, the DICER1MUT cases showed increased expression of CDK6, NOTCH2,
      and FGFR2.
    explanation: >-
      PARTIAL, and a partial narrowing rather than a resolution of this gap: RNA
      sequencing shows the DICER1-wild-type tumors have a distinct expression program
      rather than being a residual category, but differential expression identifies
      candidate genes, not a driver lesion, so the wild-type arm still has no established
      mechanism.
  proposed_experiments:
  - experiment_id: slct_wildtype_whole_genome_sequencing
    name: Whole-genome and RNA sequencing of DICER1/FOXL2 double-wild-type SLCTs
    description: >-
      Sequence a dedicated cohort of DICER1/FOXL2 wild-type Sertoli-Leydig cell tumors at
      whole-genome level, including non-coding and structural variation, to test whether
      the group harbours a recurrent driver that exon- and hotspot-directed panels have
      missed. The intronic-DICER1 result in two hotspot-positive patients establishes
      that DICER1 lesions can hide outside conventionally sequenced regions, so the first
      question is whether some apparent wild-type tumors are cryptic DICER1 tumors.

inheritance:
- name: Autosomal dominant DICER1 tumor predisposition
  description: >-
    The germline predisposing DICER1 variant is inherited in an autosomal dominant
    manner with reduced, age-related penetrance, so many carriers remain clinically
    unaffected. The tumor itself additionally requires a somatic RNase IIIb hotspot
    hit, which is why an inherited susceptibility produces a sporadic-looking unilateral
    tumor.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

  description: >-
    A diagnosis of moderately or poorly differentiated SLCT is an indication to consider
    germline DICER1 testing, since the tumor is a sentinel neoplasm of an autosomal
    dominant predisposition syndrome with implications for the patient and first-degree
    relatives.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

name: Malignant Sertoli-Leydig Cell Tumor of Ovary
creation_date: "2026-08-20T00:00:00Z"
description: >-
  Sertoli-Leydig cell tumor (SLCT, androblastoma, arrhenoblastoma) is a rare ovarian
  sex cord-stromal neoplasm of young women that recapitulates testicular tubular and
  interstitial differentiation and, when functional, produces androgen excess with
  hirsutism, hair loss and amenorrhea or oligomenorrhea. The moderately and poorly
  differentiated and retiform tumors — the ones with malignant potential, which this
  entry models — are driven by somatic missense mutations restricted to the
  metal-binding residues of the DICER1 RNase IIIb catalytic centre. These are
  hypomorphic rather than null alleles: the mutant enzyme retains RNase IIIa activity
  but loses 5p-strand cleavage, so mature miRNA output is reprogrammed to a 3p-biased
  repertoire, with derepression of the 5p-strand targets. A substantial fraction arise
  in carriers of a germline loss-of-function DICER1 variant, making SLCT a sentinel
  tumor of DICER1-related tumor predisposition. Well-differentiated SLCT is DICER1
  wild-type, has essentially no malignant potential, and has been argued to be a
  distinct tumor type; this entry is scoped to the malignant MONDO class accordingly.
  Its driver is mutually exclusive with the FOXL2 C134W driver of adult granulosa cell
  tumor, which is why the two are curated as separate Disease entries within the
  Ovarian Sex Cord-Stromal Tumors grouping.
categories:
- Gynecologic Cancer
- Ovarian Cancer
- Sex Cord-Stromal Tumor
- Solid Tumor
disease_term:
  preferred_term: malignant Sertoli-Leydig cell tumor of ovary
  term:
    id: MONDO:0020542
    label: malignant Sertoli-Leydig cell tumor of ovary
parents:
- ovarian sex cord-stromal tumor
notes: >-
  Scope note. MONDO:0020542 is the malignant ovarian SLCT class, a child of
  MONDO:0018172. That scoping is mechanistically load-bearing rather than merely
  nominal: DICER1 pathogenic variants are confined to the moderately/poorly
  differentiated and retiform tumors, while an 18-case series of well-differentiated
  SLCT found all of them DICER1 wild-type and FOXL2 wild-type, and the malignant
  potential of well-differentiated tumors is described as practically null. The DICER1
  chain curated here therefore applies to the malignant class and should not be
  inherited by well-differentiated SLCT. A minority of SLCTs instead carry the FOXL2
  C134W mutation, in an older, abnormal-bleeding population, and DICER1 and FOXL2
  mutation are mutually exclusive; that arm is recorded in the genetic section and in a
  KNOWLEDGE_GAP discussion rather than being given its own pathophysiology chain,
  because no mechanism downstream of FOXL2 in SLCT specifically has been evidenced.
pathophysiology:
- name: Germline DICER1 Loss-of-Function Predisposition
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline loss-of-function DICER1 variant establishes the predisposed
    state. Penetrance is reduced and age-related, and ovarian sex cord-stromal tumors
    are among the most characteristic manifestations, with SLCT diagnosed at a median
    age of 14 years in a large international registry cohort. The germline variant is
    the first hit; the somatic RNase IIIb hotspot change is the second.
  genes:
  - preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  downstream:
  - target: DICER1 RNase IIIb Hotspot Mutation
    description: >-
      In a predisposed gonad the second, somatic hotspot hit in the retained allele
      completes the two-step genetic lesion.
  evidence:
  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of DICER1 is established by identification of a
      heterozygous germline DICER1 pathogenic variant that is known or suspected to
      cause loss of function.
    explanation: >-
      GeneReviews defines the predisposition state modelled by this node as a
      heterozygous germline loss-of-function DICER1 variant.
  - reference: PMID:39400264
    reference_title: "DICER1-Related Tumor Predisposition: Identification of At-risk Individuals and Recommended Surveillance Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hundred and three individuals with a germline P/LP variant developed a primary
      ovarian Sertoli-Leydig cell tumor at a median age of 14 years (range: 11 months-66
      years); 13% were diagnosed before 8 years of age, the current age of onset of
      pelvic surveillance.
    explanation: >-
      Registry data quantify SLCT incidence and age distribution among germline DICER1
      variant carriers, grounding this node in a human predisposed cohort.
  - reference: PMID:29037807
    reference_title: "Ovarian sex cord-stromal tumors, pleuropulmonary blastoma and DICER1 mutations: A report from the International Pleuropulmonary Blastoma Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly all (36/37) SLCTs and 4/4 GAB tested had a DICER1 mutation in an RNase IIIb
      domain hotspot; approximately half of these individuals had a predisposing germline
      DICER1 mutation.
    explanation: >-
      Quantifies what fraction of the somatic-hotspot tumors sit on a germline
      predisposing background - roughly half - which is what makes this node a real
      but non-obligatory first step rather than a universal one.
  notes: >-
    Roughly half of hotspot-mutant SLCTs arise on a germline predisposing background and
    half are tumor-limited, so this node is a frequent but NOT obligatory upstream step;
    the somatic RNase IIIb hit below is the constant element. Somatic mosaicism for a
    hotspot variant is a recognised third architecture. Because germline pLOF variants
    are not always found by conventional exon-directed sequencing, two SLCT patients with
    a somatic hotspot variant and negative germline exon testing were shown to carry deep
    intronic splice-altering DICER1 variants, so a negative standard germline test does
    not exclude predisposition.
- name: DICER1 RNase IIIb Hotspot Mutation
  biological_scale: MOLECULAR
  description: >-
    Somatic missense mutations cluster tightly in the DICER1 region encoding the RNase
    IIIb domain, and are restricted to the codons encoding the four metal-binding
    residues of the RNase IIIb catalytic centre that are critical for microRNA
    interaction and cleavage. These mutations were found in 60% of Sertoli-Leydig cell
    tumors in the founding series and are somatic in every case with germline DNA
    available. Crucially they do not abolish DICER1: the mutant proteins retain RNase
    IIIa activity while losing RNase IIIb activity, so this is a hypomorphic,
    activity-altering lesion rather than a classic null.
  genes:
  - preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  molecular_functions:
  - preferred_term: DICER1 RNase IIIb catalytic activity
    modifier: DECREASED
    term:
      id: GO:0004525
      label: ribonuclease III activity
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Loss of 5p-Strand miRNA Processing and 3p Strand Bias
    description: >-
      RNase IIIb is the domain that cleaves the 3' end of the 5p miRNA strand, so its
      selective inactivation removes mature 5p miRNAs while leaving 3p production intact.
  evidence:
  - reference: PMID:22187960
    reference_title: Recurrent somatic DICER1 mutations in nonepithelial ovarian cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1 mutations in the RNase IIIb domain were found in 30 of 102 nonepithelial
      ovarian tumors (29%), predominantly in Sertoli-Leydig cell tumors (26 of 43, or
      60%), including 4 tumors with additional germline DICER1 mutations.
    explanation: >-
      Establishes the frequency of the RNase IIIb hotspot lesion in SLCT specifically and
      its co-occurrence with germline variants.
  - reference: PMID:22187960
    reference_title: Recurrent somatic DICER1 mutations in nonepithelial ovarian cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations were restricted to codons encoding metal-binding sites within the
      RNase IIIb catalytic centers, which are critical for microRNA interaction and
      cleavage, and were somatic in all 16 samples in which germline DNA was available
      for testing.
    explanation: >-
      Pins the lesion to the metal-binding residues of the RNase IIIb catalytic centre
      and establishes its somatic origin.
  - reference: PMID:22187960
    reference_title: Recurrent somatic DICER1 mutations in nonepithelial ovarian cancers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant DICER1 proteins had reduced RNase IIIb activity but retained RNase IIIa
      activity.
    explanation: >-
      In vitro cleavage assays support the DECREASED (not abolished) RNase III activity
      annotated on this node.
- name: Loss of 5p-Strand miRNA Processing and 3p Strand Bias
  biological_scale: MOLECULAR
  description: >-
    All four metal-binding hotspot alleles are functionally equivalent and behave as
    hypomorphs: cells expressing them lose mature 5p-strand miRNA production almost
    completely while still generating 3p-strand miRNAs. The resulting global 3p strand
    bias in the mature miRNA repertoire, rather than a wholesale loss of miRNA
    processing, is proposed to underpin the oncogenic effect.
  biological_processes:
  - preferred_term: pre-miRNA processing
    modifier: DECREASED
    term:
      id: GO:0031054
      label: pre-miRNA processing
  downstream:
  - target: Derepression of 5p-miRNA Target Transcripts
    description: >-
      Transcripts normally repressed by the lost 5p-derived miRNAs become
      enriched in expression.
  evidence:
  - reference: PMID:23132766
    reference_title: Cancer-associated somatic DICER1 hotspot mutations cause defective miRNA processing and reverse-strand expression bias to predominantly mature 3p strands through loss of 5p strand cleavage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, miRNA profiles showed that mutant DICER1 results in a dramatic loss in
      processing of mature 5p miRNA strands but were still able to create 3p strand
      miRNAs.
    explanation: >-
      Directly measures the selective loss of 5p-strand processing that defines this node.
  - reference: PMID:23132766
    reference_title: Cancer-associated somatic DICER1 hotspot mutations cause defective miRNA processing and reverse-strand expression bias to predominantly mature 3p strands through loss of 5p strand cleavage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further propose that this resulting 3p strand bias in mature miRNA expression
      likely underpins the oncogenic potential of these hotspot mutations.
    explanation: >-
      States the authors' proposed mechanistic link from strand bias to oncogenesis.
- name: Derepression of 5p-miRNA Target Transcripts
  biological_scale: CELLULAR
  description: >-
    Loss of the 5p-derived miRNAs releases their target mRNAs from post-transcriptional
    repression. Messenger RNA profiling of hotspot-mutant cells shows enriched
    expression of the predicted targets of exactly those lost 5p miRNAs, so the
    transcriptomic consequence is a specific derepression signature rather than
    generalized dysregulation. This altered post-transcriptional program in the
    developing gonadal stroma is the proximate route to tumor formation.
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing
    modifier: DECREASED
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  downstream:
  - target: Sertoli-Leydig Tumor Formation with Heterologous and Retiform Differentiation
    description: >-
      The derepressed program drives outgrowth of a tumor recapitulating testicular
      tubular and interstitial differentiation.
  evidence:
  - reference: PMID:23132766
    reference_title: Cancer-associated somatic DICER1 hotspot mutations cause defective miRNA processing and reverse-strand expression bias to predominantly mature 3p strands through loss of 5p strand cleavage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Messenger RNA (mRNA) profile changes were consistent with the loss of 5p strand
      miRNAs and showed enriched expression for predicted targets of the lost 5p-derived
      miRNAs.
    explanation: >-
      Directly demonstrates derepression of the predicted 5p-miRNA targets, which is the
      content of this node.
  - reference: PMID:22187960
    reference_title: Recurrent somatic DICER1 mutations in nonepithelial ovarian cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations do not obliterate DICER1 function but alter it in specific cell
      types, a novel mechanism through which perturbation of microRNA processing may be
      oncogenic.
    explanation: >-
      Supports the cell-type-selective character of the mechanism, which is why the
      lesion produces a gonadal stromal tumor rather than a generalized phenotype.
- name: Sertoli-Leydig Tumor Formation with Heterologous and Retiform Differentiation
  biological_scale: TISSUE
  description: >-
    The DICER1-mutant tumors are moderately or poorly differentiated, and every tumor
    with retiform or heterologous elements in a 42-case molecular series carried a
    DICER1 RNase IIIb mutation. The genotype therefore tracks with exactly the
    morphologic features that carry malignant potential, and well-differentiated SLCT —
    which is DICER1 wild-type — falls outside this chain.
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Tumor Androgen Overproduction
    description: >-
      The Leydig-like interstitial component of the tumor secretes androgen, producing
      the virilizing clinical picture.
  evidence:
  - reference: PMID:30986800
    reference_title: DICER1 and FOXL2 Mutation Status Correlates With Clinicopathologic Features in Ovarian Sertoli-Leydig Cell Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1 RNase IIIb domain mutations were identified in 18/41 (44%; 17 moderately, 1
      poorly differentiated), including all cases with retiform or heterologous elements.
    explanation: >-
      Ties the DICER1 genotype to moderately/poorly differentiated morphology and to all
      retiform/heterologous tumors.
  - reference: PMID:36583307
    reference_title: Well-differentiated Sertoli-Leydig Cell Tumors (SLCTs) Are Not Associated With DICER1 Pathogenic Variants and Represent a Different Tumor Type to Moderately and Poorly Differentiated SLCTs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We undertook DICER1 molecular testing in a cohort of 18 well-differentiated SLCTs
      and show all these to be DICER1 wild-type.
    explanation: >-
      Negative result establishing that the DICER1 chain does not extend to
      well-differentiated SLCT, which is why this entry is scoped to the malignant class.
  - reference: PMID:39592485
    reference_title: "Comprehensive analysis of 37 ovarian Sertoli-Leydig cell tumors: morphological, immunohistochemical and molecular characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have confirmed that DICER1 mutations are characteristic of moderately and poorly
      differentiated SLCTs, while well-differentiated SLCTs may represent a distinct
      entity.
    explanation: >-
      Independent 37-case replication of the grade restriction of the DICER1 driver, the
      observation this entry's malignant-class scoping rests on.
- name: Tumor Androgen Overproduction
  biological_scale: ORGANISM
  description: >-
    Functional SLCTs secrete androgen from their Leydig-cell-like component, raising
    circulating testosterone and producing hirsutism, androgenic alopecia, and
    amenorrhea or oligomenorrhea. Some patients instead show hyperestrogenism, either
    from direct tumor estrogen secretion or from peripheral aromatization of
    tumor-derived testosterone. DICER1-mutant tumors trended toward more androgenic
    symptoms than their FOXL2-mutant counterparts.
  biological_processes:
  - preferred_term: tumor androgen biosynthesis
    modifier: INCREASED
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  evidence:
  - reference: PMID:31344718
    reference_title: "Ovarian Sertoli-Leydig Cell Tumors: Epidemiological, Clinical and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This type of tumor predominates in the 2nd and 3rd decades of life and usually
      presents with hormonal changes, including signs of virilization, such as
      amenorrhea, hirsutism, acne, and male pattern of pilification.
    explanation: >-
      Enumerates the virilizing manifestations that this node produces, and the age
      distribution of the tumor.
  - reference: PMID:31344718
    reference_title: "Ovarian Sertoli-Leydig Cell Tumors: Epidemiological, Clinical and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These characteristics are due to an increase in androgen production by tumor cells.
    explanation: >-
      States the causal attribution of the virilizing phenotype to tumor androgen output,
      which is the mechanistic content of this node.
  - reference: PMID:30986800
    reference_title: DICER1 and FOXL2 Mutation Status Correlates With Clinicopathologic Features in Ovarian Sertoli-Leydig Cell Tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1-mutant patients trended toward having more androgenic symptoms (P=0.22).
    explanation: >-
      PARTIAL: a non-significant trend (P=0.22), quoted with its p-value so the weakness
      is visible. It is suggestive, not established, that the DICER1 genotype
      preferentially produces the androgenic presentation.

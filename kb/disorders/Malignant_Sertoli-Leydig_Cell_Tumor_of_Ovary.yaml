    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three children of women with SLCT were diagnosed with PPB based on genetic testing
      and clinical screening during the course of this study. All were diagnosed with PPB
      in its earliest and most curable form (Type I), were treated with surgery alone, and
      are alive without evidence of disease.
    explanation: >-
      Documents the concrete yield of cascade testing triggered by an SLCT diagnosis:
      three children detected with pleuropulmonary blastoma at its most curable stage.
      This is the strongest available justification for testing after SLCT.

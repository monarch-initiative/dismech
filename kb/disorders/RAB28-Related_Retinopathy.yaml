  - target: Dyschromatopsia
  - target: Photophobia
  - target: Macular atrophy
  - target: Retinal pigment epithelial atrophy
  - target: Macular hyperpigmentation
  - target: Bull's eye maculopathy
  - target: Central outer retinal thinning on OCT

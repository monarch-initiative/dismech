      label: ciliary basal body
  evidence:
  - reference: PMID:23746546
    reference_title: "Mutations in RAB28, encoding a farnesylated small GTPase, are associated with autosomal-recessive cone-rod dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Staining of rat retina showed localization of RAB28 to the basal body and the ciliary rootlet of the photoreceptors.
    explanation: Places RAB28 at the photoreceptor basal body in rat retina.
  - reference: PMID:23746546
    reference_title: "Mutations in RAB28, encoding a farnesylated small GTPase, are associated with autosomal-recessive cone-rod dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alternative RNA splicing yields three predicted protein isoforms with alternative C-termini, which are all truncated
      by the nonsense mutations identified in the arCRD families in this report.
    explanation: The founding null alleles truncate every isoform.
  - reference: PMID:33396523
    reference_title: "Expanding the Clinical and Genetic Spectrum of RAB28-Related Cone-Rod Dystrophy: Pathogenicity of Novel Variants in Italian Families."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The impaired GTP-GDP exchange ultimately locks Rab-28 in a GDP-bound inactive state.
    explanation: Molecular dynamics of the p.Thr26Asn missense variant.
  downstream:
  - target: Defective Cone Outer Segment Shedding and Phagocytosis
    description: Without RAB28, cone outer segment tips are not shed and taken up by the RPE.
    evidence:
    - reference: PMID:30228185
      reference_title: The small GTPase RAB28 is required for phagocytosis of cone outer segments by the murine retinal pigmented epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Taken together, these findings reveal that RAB28 is required for shedding and phagocytosis of cone OS discs.
      explanation: Knockout mouse conclusion.
- name: Defective Cone Outer Segment Shedding and Phagocytosis
  description: >-
    Cone outer segments in Rab28 knockout mice extend to the RPE apical processes and form enlarged balloon-like tips,
    and cone phagosomes in the RPE are almost absent while rod phagosomes are normal. Zebrafish knockouts show a 40-50%
    reduction in shed outer segment material and lose the dawn and dusk peaks of outer segment phagocytosis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: phagocytosis of cone outer segments by the RPE
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:30228185
    reference_title: The small GTPase RAB28 is required for phagocytosis of cone outer segments by the murine retinal pigmented epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Cone phagosomes were almost absent in Rab28-/- mice, whereas rod phagosomes displayed normal levels.
    explanation: Cone-specific phagocytosis defect in the knockout mouse.
  - reference: PMID:35471581
    reference_title: "Dawn and dusk peaks of outer segment phagocytosis, and visual cycle function require Rab28."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here, we demonstrate that Rab28 is also required for dusk peaks of OSP, but not for basal OSP levels.
    explanation: Rab28 is required for the circadian peaks of phagocytosis in zebrafish.
  downstream:
  - target: Visual Cycle Retinoid Depletion
    description: Phagocytosed outer segments feed retinoid recycling, which falls when Rab28 is absent.
    evidence:
    - reference: PMID:35471581
      reference_title: "Dawn and dusk peaks of outer segment phagocytosis, and visual cycle function require Rab28."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data give further understanding on the molecular mechanisms of RAB28-associated CRD, highlighting roles of
        Rab28 in both peaks of OSP, in vitamin A metabolism and in retinoid recycling.
      explanation: The same study links the phagocytosis and retinoid-recycling defects.
  - target: Progressive Cone-Then-Rod Photoreceptor Degeneration
    description: In the mouse, cones with unshed, ballooned outer segment tips degenerate, followed by rods.
    evidence:
    - reference: PMID:30228185
      reference_title: The small GTPase RAB28 is required for phagocytosis of cone outer segments by the murine retinal pigmented epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cones of Rab28-/- mice extended their outer segments (OSs) to the RPE apical processes and formed enlarged,
        balloon-like distal tips before undergoing degeneration.
      explanation: The shedding defect precedes cone degeneration.
- name: Visual Cycle Retinoid Depletion
  description: >-
    Retinae of larval and adult rab28 knockout zebrafish have reduced 11-cis-retinal, 11-cis-retinyl palmitate and
    all-trans-retinyl palmitate. This is shown only in zebrafish, which do not degenerate, so its contribution to human
    photoreceptor loss is not established.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: retinoid metabolic process
    modifier: DECREASED
    term:
      id: GO:0001523
      label: retinoid metabolic process
  evidence:
  - reference: PMID:35471581
    reference_title: "Dawn and dusk peaks of outer segment phagocytosis, and visual cycle function require Rab28."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rab28 loss also perturbs function of the visual cycle as retinoid levels of 11-cRAL, 11cRP, and atRP are significantly
      reduced in larval and adult rab28 KO retinae
    explanation: Retinoid measurements in the zebrafish knockout.
- name: Progressive Cone-Then-Rod Photoreceptor Degeneration
  description: >-
    Cones degenerate first and rods later, giving the cone-rod pattern of reduced or extinguished photopic and reduced
    scotopic electroretinogram responses, macular atrophy and RPE atrophy seen in patients.
  biological_scale: TISSUE
  cell_types:

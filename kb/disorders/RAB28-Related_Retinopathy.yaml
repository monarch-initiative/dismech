    term:
      id: UBERON:0000053
      label: macula lutea
  evidence:
  - reference: PMID:30228185
    reference_title: The small GTPase RAB28 is required for phagocytosis of cone outer segments by the murine retinal pigmented epithelium.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that Rab28-/- mice recapitulate features of the human dystrophy (i.e. they exhibited reduced cone and rod ERG
      responses and progressive retina degeneration).
    explanation: Progressive degeneration in the knockout mouse.
  - reference: PMID:32258030
    reference_title: "Genetic Deletion of Zebrafish Rab28 Causes Defective Outer Segment Shedding, but Not Retinal Degeneration."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      significantly reduced shed outer segment material/phagosomes in the RPE at 1 month post fertilization (mpf), but
      otherwise normal visual function up to 21 dpf and retinal structure up to 12 mpf
    explanation: In zebrafish the shedding defect does not lead to degeneration within 12 months.

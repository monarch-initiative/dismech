pathophysiology:
- name: RAB28 Loss of Function
  description: >-
    Nonsense, frameshift and splice variants truncate all three RAB28 isoforms, and missense variants such as p.Thr26Asn
    and p.Gly19Arg impair nucleotide binding or ciliary targeting of this farnesylated GTPase, which sits at the
    photoreceptor basal body and ciliary rootlet.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: RAB28
      term:
        id: hgnc:9768
        label: RAB28
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

- name: Central outer retinal thinning on OCT
  category: Ophthalmological
  frequency: VERY_FREQUENT
  description: >-
    Central (foveal) thinning with photoreceptor layer disruption on OCT, with relative sparing of the paracentral
    retina. Bound to the general OCT retinal-thinning term because the sources describe outer-retinal and
    photoreceptor-layer thinning without isolating the outer nuclear layer that HP:6000367 names.
  phenotype_term:
    preferred_term: Central outer retinal thinning on OCT
    term:
      id: HP:0030329
      label: Retinal thinning on OCT
  evidence:
  - reference: PMID:33396523
    reference_title: "Expanding the Clinical and Genetic Spectrum of RAB28-Related Cone-Rod Dystrophy: Pathogenicity of Novel Variants in Italian Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All probands displayed similar clinical phenotype consisting of photophobia, decreased visual acuity, central outer retinal thinning, and impaired color vision.
    explanation: Central outer retinal thinning in every Italian proband.
  - reference: PMID:42231409
    reference_title: "Sporadic cone-rod dystrophy caused by a heterozygous RAB28 p.Ser23Phe pathogenic variant and a de novo 4p16.1p15.33 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient exhibited significantly reduced visual acuity, severe color vision impairment, macular atrophy, and
      thinning of the photoreceptor layers.
    explanation: Photoreceptor-layer thinning in a further proband.

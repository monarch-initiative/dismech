name: RAB28-Related Retinopathy
description: >-
  Autosomal recessive cone-rod dystrophy (cone-rod dystrophy 18, CORD18) caused by biallelic loss-of-function variants in
  RAB28, which encodes a farnesylated Rab-family small GTPase found at the photoreceptor basal body and ciliary rootlet and
  in cone outer segments. Patients have poor visual acuity from childhood, photophobia, impaired color vision, macular
  hyperpigmentation and outer retinal or RPE atrophy, with severely reduced or undetectable cone responses and milder
  loss of rod responses on the electroretinogram. In Rab28 knockout mice cones fail to shed their outer segment tips,
  RPE phagocytosis of cone outer segments is almost absent, and cones and then rods degenerate. Zebrafish rab28
  knockouts show reduced outer segment shedding and reduced retinoid levels without retinal degeneration.
category: Mendelian

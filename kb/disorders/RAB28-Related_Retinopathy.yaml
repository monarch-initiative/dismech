      label: cone-rod dystrophy 18
    mapping_predicate: skos:narrowMatch
    mapping_source: manual curation
    mapping_justification: >-
      Cone-rod dystrophy 18 is the only MONDO descendant of RAB28-related retinopathy and is the same RAB28 cone-rod
      dystrophy phenotype; this entry covers it, so it is recorded as a synonym rather than a separate subtype.
notes: >-
  The human literature is small: two families in the gene discovery report (PMID:23746546), two Spanish families
  (PMID:25356532), a Korean patient (PMID:28388261, whose PubMed record had no abstract on fetch, so it is not cited as
  evidence), two Danish brothers (PMID:32084271), four Italian families (PMID:33396523) and a Chinese proband whose second
  allele is a de novo 4p deletion (PMID:42231409). No prevalence estimate exists. The two brothers in PMID:32084271 also
  had postaxial polydactyly, but the authors state that more data are needed before attributing it to RAB28, so it is
  not recorded as a phenotype. RAB28 and PROM1 lie in the same 4p interval, and one family with homozygosity there had
  a deep intronic PROM1 variant instead (PMID:26153215). No disease-specific treatment exists; cone-specific Rab28
  re-expression rescues outer segment phagocytosis in zebrafish (PMID:35471581). The deep-research report printed the
  RAB28 identifier as HGNC:9764, which is RAB22A; the binding here (hgnc:9768) comes from the ClinGen record.
  Myopia is not linked to a mechanism node because no source explains it. No GeneReviews chapter covers RAB28 or
  CORD18 (just check-genereviews against the committed Bookshelf index returned NO_CHAPTER). A Rab28/BBSome role in
  restraining ciliary extracellular vesicle shedding (PMID:32101165) was considered and left out, because it is shown
  only in C. elegans sensory neurons and its link to photoreceptor outer segments is untested.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is confirmed by finding biallelic RAB28 variants by exome or panel sequencing. Exon-level sequencing can
    miss a deletion of the second allele, which chromosomal microarray found in one proband, and homozygosity of the 4p
    interval can instead reflect a deep intronic PROM1 variant that exon-focused tests miss (PMID:26153215), so a
    single RAB28 variant or an unexplained 4p homozygous interval warrants copy-number and genome-level analysis.
  evidence:
  - reference: PMID:42231409
    reference_title: "Sporadic cone-rod dystrophy caused by a heterozygous RAB28 p.Ser23Phe pathogenic variant and a de novo 4p16.1p15.33 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Singleton clinical exome sequencing (CES), followed by chromosomal microarray (CMA), enabled the identification of a
      heterozygous RAB28 pathogenic variant inherited from the father
    explanation: Exome sequencing plus microarray resolved a case with one sequence variant and a deletion.
  - reference: PMID:26153215
    reference_title: Homozygosity mapping and whole-genome sequencing reveals a deep intronic PROM1 mutation causing cone-rod dystrophy by pseudoexon activation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous interval comprising two known genes associated with the autosomal recessive form of CRD,
      namely RAB28 and PROM1, in a consanguineous family with clinical evidence of CRD.
    explanation: >-
      Diagnostic caveat only: the family's disease was due to PROM1, not RAB28, so homozygosity at this interval does
      not by itself implicate RAB28.
- name: Full-field electroretinography
  description: >-
    Full-field ERG shows undetectable or severely reduced photopic (cone) responses with milder reduction of scotopic
    (rod) responses, the cone-rod pattern.
  evidence:
  - reference: PMID:33396523
    reference_title: "Expanding the Clinical and Genetic Spectrum of RAB28-Related Cone-Rod Dystrophy: Pathogenicity of Novel Variants in Italian Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Flash electroretinogram (ERG) recording showed a non-detectable response for the photopic component and a reduced
      response for the scotopic component.
    explanation: ERG pattern in the Italian series.
  - reference: PMID:42231409
    reference_title: "Sporadic cone-rod dystrophy caused by a heterozygous RAB28 p.Ser23Phe pathogenic variant and a de novo 4p16.1p15.33 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Full-field ERG revealed severely diminished cone responses, while rod responses were mildly reduced.
    explanation: Cone-predominant ERG loss in a further proband.
treatments:
- name: RAB28 Gene Replacement (Preclinical)
  description: >-
    No treatment is approved or in trials. Cone-specific transgenic re-expression of Rab28 rescues the outer segment
    phagocytosis defect in rab28 knockout zebrafish, which suggests gene replacement to cones as a strategy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:35471581
    reference_title: "Dawn and dusk peaks of outer segment phagocytosis, and visual cycle function require Rab28."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, transgenic overexpression of Rab28, solely in zebrafish cones, rescues the OSP defect in rab28 KO fish,
      suggesting rab28 gene replacement in cone photoreceptors is sufficient to regulate Rab28-OSP.
    explanation: Proof of concept in zebrafish only.
animal_models:
- name: Rab28 knockout mouse
  species: Mouse
  genotype: Rab28-/- (exon 3 deletion)
  publication: PMID:30228185
  modeled_mechanisms:
  - target: Defective Cone Outer Segment Shedding and Phagocytosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Cone phagosomes almost absent, with ballooned unshed cone outer segment tips.
    evidence:
    - reference: PMID:30228185
      reference_title: The small GTPase RAB28 is required for phagocytosis of cone outer segments by the murine retinal pigmented epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Cone phagosomes were almost absent in Rab28-/- mice, whereas rod phagosomes displayed normal levels.
      explanation: Cone-specific phagocytosis defect.
  - target: Progressive Cone-Then-Rod Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced cone and rod ERG responses and progressive retinal degeneration.
    limitations: The mouse retina has no macula, so the macular hyperpigmentation and atrophy of patients cannot be modeled.
    evidence:
    - reference: PMID:30228185
      reference_title: The small GTPase RAB28 is required for phagocytosis of cone outer segments by the murine retinal pigmented epithelium.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that Rab28-/- mice recapitulate features of the human dystrophy (i.e. they exhibited reduced cone and rod
        ERG responses and progressive retina degeneration).
      explanation: Degeneration and ERG loss in the knockout.
- name: rab28 knockout zebrafish
  species: Zebrafish
  genotype: CRISPR-Cas9 rab28 null
  publication: PMID:32258030
  modeled_mechanisms:
  - target: Defective Cone Outer Segment Shedding and Phagocytosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced shed outer segment material and phagosomes in the RPE.
    evidence:
    - reference: PMID:32258030
      reference_title: "Genetic Deletion of Zebrafish Rab28 Causes Defective Outer Segment Shedding, but Not Retinal Degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Significantly, rab28 null zebrafish display a 40–50% reduction in OS shedding as early as 15 days post fertilization
        (dpf), but without evidence of retinal degeneration up to 12 mpf.
      explanation: Shedding defect in the zebrafish knockout.
  - target: Progressive Cone-Then-Rod Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: No retinal degeneration up to 12 months post fertilization.
    limitations: >-
      The fish were followed for only 12 months, so the absence of degeneration may reflect species differences in
      disease tempo rather than a dispensable step; the authors do not resolve this.
    evidence:
    - reference: PMID:32258030
      reference_title: "Genetic Deletion of Zebrafish Rab28 Causes Defective Outer Segment Shedding, but Not Retinal Degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        significantly reduced shed outer segment material/phagosomes in the RPE at 1 month post fertilization (mpf), but
        otherwise normal visual function up to 21 dpf and retinal structure up to 12 mpf
      explanation: Normal retinal structure despite the shedding defect.

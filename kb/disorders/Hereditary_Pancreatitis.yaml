name: Hereditary Pancreatitis
creation_date: "2026-09-03T14:02:47Z"
category: Mendelian
synonyms:
- hereditary chronic pancreatitis
- autosomal dominant hereditary chronic pancreatitis
- PRSS1-related hereditary pancreatitis
- hereditary/genetic pancreatitis
description: >
  Hereditary pancreatitis is a Mendelian disorder of recurrent acute pancreatitis
  beginning typically in childhood or adolescence, with a high probability of
  progression to chronic pancreatitis, exocrine and endocrine pancreatic
  insufficiency, and a markedly increased lifetime risk of pancreatic ductal
  adenocarcinoma. The classic form is autosomal dominant with reduced penetrance
  (about 80%) and is caused by gain-of-function variants in PRSS1, the gene
  encoding cationic trypsinogen; the recurrent variants R122H (historically
  R117H) and N29I (historically N21I) account for most PRSS1-positive families.

  The unifying mechanism is a shift in the pancreatic protease balance toward
  active trypsin: PRSS1 gain-of-function variants either enhance trypsinogen
  autoactivation or destroy a trypsin-sensitive cleavage site that normally
  inactivates prematurely activated trypsin, so intrapancreatic trypsin
  accumulates and digests the acinar tissue. The same trypsin-dependent pathway
  is modified by other genes: loss-of-function SPINK1 (the intrapancreatic trypsin
  inhibitor) and CTRC (which degrades trypsinogen) raise risk, while the
  degradation-sensitive PRSS2 variant G191R is protective. Management is
  symptomatic (pain control, pancreatic enzyme replacement, diabetes management)
  with total pancreatectomy and islet autotransplantation in selected patients;
  smoking and alcohol avoidance and cancer surveillance are central.

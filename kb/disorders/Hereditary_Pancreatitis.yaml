  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: >
  Hereditary pancreatitis is the PRSS1-driven Mendelian pole of a broader genetic
  pancreatitis spectrum whose genes converge on the trypsin-activation balance:
  PRSS1 (gain of function, causative), SPINK1 and CTRC (loss of function, risk
  modifiers), CFTR (ductal secretion), and the protective PRSS2 G191R allele. The
  older literature numbers the two common PRSS1 variants R117H and N21I;
  contemporary nomenclature is R122H and N29I. The behavioral cessation treatment
  is bound to the generic Pharmacotherapy action term as a placeholder because
  NCIT lacks a clean C25218-rooted behavioral-counseling action term reachable by
  the treatment-term validator; the modality is recorded as BEHAVIORAL.

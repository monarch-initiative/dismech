    snippet: "total pancreatectomy with islet autotransplantation, an irreversible procedure with obligate side effects, in select individuals with severe CP"
    explanation: GeneReviews describes TPIAT as a management option in severe chronic pancreatitis.
- name: Smoking and alcohol cessation
  description: Avoidance of tobacco and alcohol to slow progression and reduce cancer risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

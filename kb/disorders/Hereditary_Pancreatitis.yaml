- name: Total pancreatectomy with islet autotransplantation
  description: >
    In selected patients with severe refractory chronic pancreatitis, total
    pancreatectomy with islet autotransplantation removes the pain source while
    preserving beta-cell mass; an irreversible procedure with obligate side
    effects.
  therapeutic_modality: SURGERY
  treatment_term:

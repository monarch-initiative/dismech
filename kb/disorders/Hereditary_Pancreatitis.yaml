pathophysiology:
- name: PRSS1 Gain of Function
  biological_scale: MOLECULAR
  description: >
    Germline gain-of-function variants in PRSS1 (cationic trypsinogen) either
    enhance autoactivation of trypsinogen to trypsin or destroy the R122 (R117)
    trypsin-sensitive cleavage site that normally allows prematurely activated
    trypsin to be inactivated within the pancreas.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: serine-type endopeptidase (trypsin) activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Increased Intrapancreatic Trypsin Activity
    causal_link_type: DIRECT
    description: Enhanced autoactivation or loss of the trypsin inactivation site raises active trypsin within the pancreas.
    evidence:
    - reference: PMID:8841182
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "loss of this cleavage site would permit autodigestion resulting in pancreatitis"
      explanation: States that loss of the trypsin-sensitive inactivation site raises trypsin activity and causes autodigestion.
- name: Increased Intrapancreatic Trypsin Activity
  biological_scale: MOLECULAR
  description: >
    The protease balance shifts toward active trypsin inside the pancreas, because
    trypsinogen autoactivation is enhanced and the fail-safe inactivation
    mechanisms (autolysis, SPINK1 inhibition, CTRC-mediated degradation) are
    outpaced or independently impaired.
  biological_processes:
  - preferred_term: protein autoprocessing (trypsinogen autoactivation)
    term:
      id: GO:0016540
      label: protein autoprocessing
    modifier: INCREASED
  downstream:
  - target: Pancreatic Acinar Autodigestion
    causal_link_type: DIRECT
    description: Excess active trypsin triggers the intracellular protease cascade that digests acinar tissue.
    evidence:
    - reference: PMID:9322498
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "providing strong evidence that trypsin plays a central role in premature zymogen activation and pancreatitis"
      explanation: Links premature trypsin/zymogen activation to pancreatitis.
- name: Pancreatic Acinar Autodigestion
  biological_scale: TISSUE
  description: >
    Active trypsin initiates autodigestion of pancreatic acinar tissue and an
    inflammatory response, the tissue lesion of an acute pancreatitis attack.
  cell_types:
  - preferred_term: pancreatic acinar cell
    term:
      id: CL:0002064
      label: pancreatic acinar cell
  downstream:
  - target: Recurrent acute pancreatitis
    causal_link_type: DIRECT
    description: Repeated autodigestive injury produces recurrent acute pancreatitis attacks.
  - target: Chronic pancreatitis
    causal_link_type: DIRECT
    description: Repeated acinar injury drives fibrosis and irreversible chronic pancreatitis.
    evidence:
    - reference: PMID:22379635
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with frequent progression to chronic pancreatitis (CP)"
      explanation: Recurrent acute injury progresses to chronic pancreatitis.

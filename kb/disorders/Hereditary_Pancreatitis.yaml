  association: Risk factor
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >
    SPINK1 encodes the pancreatic secretory trypsin inhibitor. Loss-of-function
    variants (e.g. N34S) reduce trypsin inhibition and raise chronic-pancreatitis

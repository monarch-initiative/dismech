  - target: Ureaplasma Ribosomal Translation (Tetracycline and Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline (30S subunit) and azithromycin (50S subunit) inhibit bacterial
      ribosomal protein synthesis in wall-less U. urealyticum.

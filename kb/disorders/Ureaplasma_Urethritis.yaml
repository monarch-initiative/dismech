name: Ureaplasma Urethritis
creation_date: "2026-09-30T10:37:00Z"
description: >-
  Ureaplasma urethritis is a sexually transmitted nongonococcal urethritis in
  which high-burden Ureaplasma urealyticum, especially the former biovar 2
  lineage, colonizes the anterior urethra and helps drive polymorphonuclear
  urethral inflammation with dysuria, urethral discharge, or urethral
  discomfort. Detection of Ureaplasma can also represent asymptomatic carriage,
  so organism load, species identity, and coinfecting urethral pathogens are
  critical context for attributing urethritis to Ureaplasma.
category: Infectious Disease
disease_term:
  preferred_term: Ureaplasma urethritis
  term:
    id: MONDO:0007007
    label: Ureaplasma urethritis
parents:
- Urethritis
synonyms:
- Ureaplasmal urethritis
- Ureaplasma urealyticum urethritis
- Ureaplasma-associated nongonococcal urethritis
- Ureaplasma-associated non-gonococcal urethritis
infectious_agent:
- name: Ureaplasma urealyticum
  description: >-
    Ureaplasma urealyticum is a cell-wall-deficient Mollicutes species that is
    sexually transmitted in humans, can colonize the urogenital tract, and is
    the Ureaplasma species most consistently implicated in male nongonococcal
    urethritis when species and burden are resolved.
  infectious_agent_term:
    preferred_term: Ureaplasma urealyticum
    term:
      id: NCBITaxon:2130
      label: Ureaplasma urealyticum
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is increasing evidence that U. parvum is non-pathogenic, and only
      U. urealyticum is pathogenic in some men but not all men colonized in the
      urethra
    explanation: >-
      Review synthesis separates U. urealyticum from U. parvum and frames it as
      a conditional urethral pathogen.
  - reference: PMID:17522569
    reference_title: >-
      Quantitative detection of Ureaplasma parvum (biovar 1) and Ureaplasma
      urealyticum (biovar 2) in urine specimens from men with and without
      urethritis by real-time polymerase chain reaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The association of increased U. urealyticum (biovar 2) loads with
      symptomatic urethritis suggests that U. urealyticum (biovar 2) may be a
      pathogen of NGU.
    explanation: >-
      Load-stratified human urine testing tied high U. urealyticum biovar 2
      burden to symptomatic nonmycoplasmal nonchlamydial NGU.
agent_life_cycle:
  description: >-
    Human U. urealyticum is a mucosal Mollicutes bacterium transmitted between
    human urogenital tracts; no arthropod vector or non-human reservoir is part
    of the male urethritis cycle represented here.
  hosts:
  - preferred_term: human
    role: urogenital reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:22646228
    reference_title: >-
      Comparative genome analysis of 19 Ureaplasma urealyticum and Ureaplasma
      parvum strains.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Ureaplasma urealyticum (UUR) and Ureaplasma parvum (UPA) are sexually
      transmitted bacteria among humans
    explanation: >-
      Comparative-genomics background identifies human-to-human sexual spread
      for the two human Ureaplasma species.
  - reference: PMID:22646228
    reference_title: >-
      Comparative genome analysis of 19 Ureaplasma urealyticum and Ureaplasma
      parvum strains.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Like other members of this class, which are obligate parasites of
      eukaryotes, ureaplasmas lack a cell wall, use a non-standard genetic
      code, have extremely small genome size, and require cholesterol.
    explanation: >-
      Supports a host-associated, extracellular Mollicutes life cycle rather
      than an arthropod-borne or environmental infectious cycle.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:26220178
      reference_title: Management of non-gonococcal urethritis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Non-gonococcal urethritis (NGU), or inflammation of the urethra, is the
        most common treatable sexually transmitted syndrome in men
      explanation: >-
        Places Ureaplasma-associated nongonococcal urethritis among sexually
        transmitted bacterial infectious diseases.
transmission:
- name: Sexual urogenital transmission
  description: >-
    U. urealyticum is exchanged by sexual exposure to colonized or infected
    urogenital mucosa and then may establish urethral carriage or high-burden
    urethral colonization.
  evidence:
  - reference: PMID:31515293
    reference_title: >-
      Aetiology and prevalence of mixed-infections and mono-infections in
      non-gonococcal urethritis in men: a case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Substantial evidence supports the idea that UU is sexually transmitted.
    explanation: >-
      The case-control discussion summarizes the sexual acquisition pattern for
      urogenital U. urealyticum.
progression:
- phase: Urethral Ureaplasma Carriage
  notes: >-
    After sexual acquisition, U. urealyticum may persist as urethral carriage
    without objective urethritis, especially when it is detected as a
    monoinfection in otherwise asymptomatic controls.
  evidence:
  - reference: PMID:31515293
    reference_title: >-
      Aetiology and prevalence of mixed-infections and mono-infections in
      non-gonococcal urethritis in men: a case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      UU monoinfections were more common in controls, in younger men and in men
      with no history of NGU.
    explanation: >-
      Supports a non-inflammatory carriage phase that can precede or exist
      instead of symptomatic Ureaplasma-attributable urethritis.
- phase: Symptomatic Nongonococcal Urethritis
  notes: >-
    Higher-burden pathogenic infection produces the inflammatory NGU syndrome
    with urethral discharge, dysuria, or urethral discomfort, although some
    infections may remain asymptomatic.
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Urethritis is characterized by discharge, dysuria and/or urethral
      discomfort but may be asymptomatic.
    explanation: >-
      Defines the symptomatic NGU phase and records that clinically defined
      urethritis can also be silent.
pathophysiology:
- name: High-Burden Urethral Ureaplasma Colonization
  role: trigger
  biological_scale: TISSUE
  description: >-
    Sexually acquired U. urealyticum attaches to urethral epithelial cells and
    colonizes the anterior urethral mucosa; only some colonized men develop
    urethritis, and organism burden appears to distinguish pathogenic infection
    from low-grade carriage.
  cell_types:
  - preferred_term: urethral epithelial cell
    term:
      id: CL:1000296
      label: epithelial cell of urethra
  locations:
  - preferred_term: urethra
    term:
      id: UBERON:0000057
      label: urethra
  downstream:
  - target: Neutrophilic Urethral Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Higher U. urealyticum biovar 2 burden is associated with symptomatic
      urethritis; the exact bacterial and host intermediates from load to
      polymorphonuclear inflammation remain incompletely resolved.
    evidence:
    - reference: PMID:17522569
      reference_title: >-
        Quantitative detection of Ureaplasma parvum (biovar 1) and Ureaplasma
        urealyticum (biovar 2) in urine specimens from men with and without
        urethritis by real-time polymerase chain reaction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        U. urealyticum (biovar 2) loads in 23 men with NMNCNGU were
        significantly higher than those in 14 men without urethritis.
      explanation: >-
        Supports high U. urealyticum burden as the clinical state associated
        with downstream urethral inflammation.
  evidence:
  - reference: PMID:22646228
    reference_title: >-
      Comparative genome analysis of 19 Ureaplasma urealyticum and Ureaplasma
      parvum strains.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      They are capable of attaching to a variety of cell types such as urethral
      epithelial cells, spermatozoa, and erythrocytes [ 12 ].
    explanation: >-
      Documents attachment of human Ureaplasma organisms to urethral epithelial
      cells at the mucosal colonization site.
  - reference: PMID:17522569
    reference_title: >-
      Quantitative detection of Ureaplasma parvum (biovar 1) and Ureaplasma
      urealyticum (biovar 2) in urine specimens from men with and without
      urethritis by real-time polymerase chain reaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      U. urealyticum (biovar 2) loads in 23 men with NMNCNGU were significantly
      higher than those in 14 men without urethritis.
    explanation: >-
      Supports high organism burden as the clinically relevant urethral
      colonization state.
  - reference: PMID:31515293
    reference_title: >-
      Aetiology and prevalence of mixed-infections and mono-infections in
      non-gonococcal urethritis in men: a case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      UU monoinfections were more common in controls, in younger men and in men
      with no history of NGU.
    explanation: >-
      Establishes that U. urealyticum detection alone can be colonization rather
      than urethritis, motivating the load-qualified trigger node.
- name: Ureaplasma Urea Catabolism and Surface Persistence
  biological_scale: CELLULAR
  description: >-
    Ureaplasma organisms generate ATP by hydrolyzing urea into ammonia and
    carbon dioxide and carry a phase-variable multiple-banded-antigen surface
    system that can vary exposed antigenic epitopes during mucosal persistence.
  locations:
  - preferred_term: urethra
    term:
      id: UBERON:0000057
      label: urethra
  chemical_entities:
  - preferred_term: urea
    term:
      id: CHEBI:16199
      label: urea
  - preferred_term: ammonia
    term:
      id: CHEBI:16134
      label: ammonia
  biological_processes:
  - preferred_term: urea catabolic process
    modifier: INCREASED
    term:
      id: GO:0043419
      label: urea catabolic process
  downstream:
  - target: High-Burden Urethral Ureaplasma Colonization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Urease-driven ATP generation and phase-variable multiple-banded-antigen
      expression sustain bacterial survival and immune evasion on the urethral
      mucosa, supporting high-burden colonization that drives downstream
      polymorphonuclear inflammation.
  evidence:
  - reference: PMID:22646228
    reference_title: >-
      Comparative genome analysis of 19 Ureaplasma urealyticum and Ureaplasma
      parvum strains.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      comprising those members of the family Mycoplasmataceae that hydrolyze
      urea and use it as a metabolic substrate for generation of ATP.
    explanation: >-
      Establishes the urease-dependent metabolic process encoded in the
      Ureaplasma genus name and represented at this node.
  - reference: PMID:22646228
    reference_title: >-
      Comparative genome analysis of 19 Ureaplasma urealyticum and Ureaplasma
      parvum strains.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Whole genome analysis of the 14 serovars and the 4 clinical isolates
      showed the mba gene was part of a large superfamily, which is a phase
      variable gene system
    explanation: >-
      Supports the phase-variable surface-antigen system that can vary during
      mucosal persistence.
- name: Ureaplasma IgA1 Cleavage
  biological_scale: MOLECULAR
  description: >-
    U. urealyticum secretes a human IgA1 protease that cleaves the IgA1 heavy
    chain hinge into Fab and Fc fragments, plausibly reducing secretory IgA1
    containment at the urethral surface.
  molecular_functions:
  - preferred_term: endopeptidase activity
    modifier: INCREASED
    term:
      id: GO:0004175
      label: endopeptidase activity
  locations:
  - preferred_term: urethra
    term:
      id: UBERON:0000057
      label: urethra
  biological_processes:
  - preferred_term: proteolysis
    modifier: INCREASED
    term:
      id: GO:0006508
      label: proteolysis
  downstream:
  - target: High-Burden Urethral Ureaplasma Colonization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cleavage of mucosal secretory IgA1 impairs local humoral containment at
      the urethral surface, permitting sustained high-burden colonization that
      drives downstream neutrophilic urethritis.
  evidence:
  - reference: PMID:1587621
    reference_title: Characterization of the immunoglobulin A protease of Ureaplasma urealyticum.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ureaplasma urealyticum strains of all serotypes express a specific human
      immunoglobulin A1 protease that cleaves immunoglobulin A1 to produce
      intact Fab and Fc fragments.
    explanation: >-
      Biochemical work documents U. urealyticum cleavage of human IgA1, a
      candidate mucosal immune-evasion step.
- name: Neutrophilic Urethral Inflammation
  role: consequence
  biological_scale: TISSUE
  description: >-
    Urethral infection is defined by excess polymorphonuclear leukocytes in the
    anterior urethra and causes the irritative symptoms and discharge of
    nongonococcal urethritis.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: urethra
    term:
      id: UBERON:0000057
      label: urethra
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Dysuria
    causal_link_type: DIRECT
    description: >-
      Inflamed anterior urethral mucosa produces painful urination and urethral
      discomfort.
  - target: Urethral Discharge
    causal_link_type: DIRECT
    description: >-
      Neutrophil-rich mucosal inflammation produces visible urethral exudate.
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis should be confirmed with microscopy of a stained smear from
      urethra, demonstrating an excess of polymorphonuclear leucocytes (PMNLs)
      or monocytes in the anterior urethra
    explanation: >-
      Defines urethritis by microscopic inflammatory cells in anterior urethral
      secretions.
- name: Ureaplasma Ribosomal Translation (Tetracycline and Macrolide Target)
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    U. urealyticum is a Mollicutes bacterium that lacks a cell wall;
    antimicrobial eradication targets bacterial 70S ribosomal mRNA translation
    via 30S-binding tetracyclines (doxycycline) or 50S-binding macrolides
    (azithromycin).
  cellular_components:
  - preferred_term: ribosome
    term:
      id: GO:0005840
      label: ribosome
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:22646228
    reference_title: >-
      Comparative genome analysis of 19 Ureaplasma urealyticum and Ureaplasma
      parvum strains.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Like other members of this class, which are obligate parasites of
      eukaryotes, ureaplasmas lack a cell wall, use a non-standard genetic
      code, have extremely small genome size, and require cholesterol.
    explanation: >-
      Confirms that ureaplasmas lack a bacterial cell wall, leaving intracellular
      70S ribosomal translation as the primary antimicrobial target.
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Establishes the bacterial 70S ribosome as the conserved antimicrobial
      target inhibited by tetracyclines and macrolides.
phenotypes:
- name: Dysuria
  category: Genitourinary
  description: >-
    Painful urination accompanied by urethral stinging, itching, or discomfort
    is one of the typical symptomatic manifestations of nongonococcal
    urethritis.
  phenotype_term:
    preferred_term: Dysuria
    term:
      id: HP:0100518
      label: Dysuria
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Urethritis is characterized by discharge, dysuria and/or urethral
      discomfort but may be asymptomatic.
    explanation: >-
      Identifies dysuria as a core symptomatic manifestation of urethritis while
      acknowledging asymptomatic infections.
- name: Urethral Discharge
  category: Genitourinary
  description: >-
    Mucopurulent, cloudy, or clear urethral inflammatory exudate visible
    clinically in men with nongonococcal urethritis.
  phenotype_term:
    preferred_term: Abnormal urethral discharge
    term:
      id: HP:6000108
      label: Abnormal urethral discharge
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Urethritis is characterized by discharge, dysuria and/or urethral
      discomfort but may be asymptomatic.
    explanation: >-
      Identifies urethral discharge as a core manifestation of urethritis.
diagnosis:
- name: Microscopic confirmation of urethritis
  description: >-
    Gram- or methylene-blue-stained anterior urethral smear microscopy
    establishes objective urethral inflammation by demonstrating five or more
    polymorphonuclear leukocytes per high-power field and concurrently rules out
    intracellular diplococci of gonococcal urethritis at presentation.
  diagnosis_term:
    preferred_term: Microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients presenting with symptoms of urethritis, the diagnosis should
      be confirmed by microscopy of a stained smear, ruling out gonorrhea.
    explanation: >-
      Supports stained-smear microscopy as the first step that confirms the NGU
      syndrome before a Ureaplasma etiology is assigned.
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Formally, the definition of urethritis diagnosis is microscopically,
      demonstrating ≥5 PMNL per high power (x1000) microscopic field (averaged
      over five fields with greatest concentration of PMNLs) ... in a stained
      smear from the anterior urethra.
    explanation: >-
      Records the quantitative PMNL threshold used on anterior urethral smear
      microscopy to define urethritis.
- name: Ureaplasma PCR
  description: >-
    Molecular assays on first-void urine or genital swabs can rapidly detect
    Ureaplasma species; quantitative or species-resolved assays are clinically
    preferable when trying to separate high-burden U. urealyticum biovar 2 from
    low-grade Ureaplasma carriage or non-pathogenic U. parvum.
  diagnosis_term:
    preferred_term: Nucleic Acid Amplification Test
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:37683891
    reference_title: >-
      Development of a Rapid and High-Throughput Multiplex Real-Time PCR Assay
      for Mycoplasma hominis and Ureaplasma Species.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We developed a high-throughput, real-time multiplex PCR assay for the
      rapid detection of M. hominis and Ureaplasma species in urine, genital
      swab, body fluid, and tissue.
    explanation: >-
      Validates urine and genital-swab real-time PCR as a rapid Ureaplasma
      detection method.
  - reference: PMID:17522569
    reference_title: >-
      Quantitative detection of Ureaplasma parvum (biovar 1) and Ureaplasma
      urealyticum (biovar 2) in urine specimens from men with and without
      urethritis by real-time polymerase chain reaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 16S rRNA gene of Ureaplasma was quantified by a TaqMan-based
      real-time polymerase chain reaction assay in first-pass urine
    explanation: >-
      Supports the quantitative urine PCR approach used to relate organism load
      and biovar/species distinction to urethritis.
differential_diagnoses:
- name: Gonorrhea
  description: >-
    Neisseria gonorrhoeae urethritis presents with dysuria and often more
    profuse purulent urethral discharge; stained urethral smear microscopy for
    intracellular Gram-negative diplococci and gonococcal NAAT rule it out.
  disease_term:
    preferred_term: gonorrhea
    term:
      id: MONDO:0004277
      label: gonorrhea
  distinguishing_features:
  - Intracellular diplococci on Gram- or methylene-blue-stained urethral smear and positive N. gonorrhoeae NAAT/culture
  - Typically more profuse purulent discharge than nongonococcal urethritis
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite some concerns about sensitivity, stained urethral smears for
      microscopic identification of N. gonorrhoeae is recommended for
      concurrently documenting inflammation and the presence of intracellular
      diplococci [ 31 ].
    explanation: >-
      Establishes microscopic and molecular exclusion of N. gonorrhoeae as the
      primary differential step in acute male urethritis.
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An excessive purulent discharge should arouse suspicion of gonorrhoea.
    explanation: >-
      Supports excessive purulent urethral discharge as a clinical clue
      distinguishing gonococcal urethritis from nongonococcal urethritis.
- name: Chlamydia trachomatis Nongonococcal Urethritis
  description: >-
    Chlamydia trachomatis accounts for 20-50% of nongonococcal urethritis cases
    in men and is the most common bacterial NGU etiology; it must be excluded
    by first-void urine NAAT before attributing urethritis to U. urealyticum.
  disease_term:
    preferred_term: Chlamydia trachomatis nongonococcal urethritis
    term:
      id: MONDO:0005701
      label: chlamydia trachomatis infectious disease
  distinguishing_features:
  - Positive first-void urine NAAT for Chlamydia trachomatis
  - Higher prevalence among acute NGU cases (20-50% versus 5-10% for U. urealyticum)
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Non-gonococcal urethritis (NGU), or inflammation of the urethra, is the
      most common treatable sexually transmitted syndrome in men, with
      approximately 20-50 % of cases being due to infection with Chlamydia
      trachomatis and 10-30 % Mycoplasma genitalium.
    explanation: >-
      Identifies C. trachomatis as the leading bacterial cause of NGU (20-50%
      of cases) that must be distinguished from U. urealyticum.
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All cases of urethritis should be screened for C. trachomatis by NAAT on
      first void urine.
    explanation: >-
      Establishes routine first-void urine NAAT screening to distinguish C.
      trachomatis urethritis from other NGU etiologies.
- name: Mycoplasma genitalium Nongonococcal Urethritis
  description: >-
    Mycoplasma genitalium is the second most common bacterial cause of
    nongonococcal urethritis (10-30% of cases) and a major driver of persistent
    NGU after first-line azithromycin or doxycycline; specific NAAT with
    macrolide-resistance testing and test of cure distinguish it from U.
    urealyticum urethritis.
  disease_term:
    preferred_term: Mycoplasma genitalium nongonococcal urethritis
    term:
      id: MONDO:1030003
      label: Mycoplasmoides infection
  notes: >-
    Mycoplasma genitalium is taxonomically classified within the genus
    Mycoplasmoides (Mycoplasmoides genitalium); MONDO contains no narrower
    species- or urethritis-specific term below MONDO:1030003.
  distinguishing_features:
  - Positive first-void urine NAAT for Mycoplasma genitalium
  - Frequent macrolide resistance and post-treatment persistence requiring resistance testing and test of cure
  evidence:
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Non-gonococcal urethritis (NGU), or inflammation of the urethra, is the
      most common treatable sexually transmitted syndrome in men, with
      approximately 20-50 % of cases being due to infection with Chlamydia
      trachomatis and 10-30 % Mycoplasma genitalium.
    explanation: >-
      Identifies M. genitalium as the second major bacterial etiology of NGU
      (10-30% of cases) distinct from U. urealyticum.
  - reference: PMID:26220178
    reference_title: Management of non-gonococcal urethritis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, if available, specific test for M. genitalium should be
      taken, preferably including test for macrolide resistance of M.
      genitalium [ 38 ].
    explanation: >-
      Documents pathogen-specific NAAT and macrolide-resistance testing to
      differentiate M. genitalium NGU and guide antimicrobial selection.
treatments:
- name: Doxycycline or Azithromycin for Nongonococcal Urethritis
  description: >-
    Doxycycline (100 mg twice daily for 7 days) and azithromycin (1 g single
    dose or 5-day extended course) are standard small-molecule regimens for
    symptomatic nongonococcal urethritis; in an NGU randomized trial that
    tested for U. urealyticum biovar 2, microbiologic cure of UU-2 was similar
    with azithromycin and doxycycline.

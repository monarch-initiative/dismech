review_notes: >-
  Deliberately lumped. This record keeps the MONDO Ureaplasma urethritis scope
  at the named pathogen-syndrome level and does not create species or biovar
  subtype files: U. urealyticum biovar 2 load is the best-supported pathogenic
  stratum, but asymptomatic U. urealyticum carriage is common and the literature
  has not established a stable, separately named MONDO disease for high-load
  U. urealyticum NGU. U. parvum is mentioned only as the non-pathogenic former
  biovar 1 comparator because the cited load study and NGU review argue against
  treating U. parvum detection as causal male Ureaplasma urethritis.

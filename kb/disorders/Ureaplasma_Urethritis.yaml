      reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The ribosome is one of the main antibiotic targets in the bacterial cell.
      explanation: >-
        Supports inhibition of bacterial ribosomal translation as the shared
        molecular mechanism of tetracycline and macrolide therapy.
  - target: High-Burden Urethral Ureaplasma Colonization
    treatment_effect: INHIBITS
    description: >-
      Effective antimicrobial therapy eradicates susceptible U. urealyticum
      biovar 2 and removes the high-burden bacterial trigger for
      polymorphonuclear urethritis.
    evidence:
    - reference: PMID:23223595
      reference_title: >-
        Standard treatment regimens for nongonococcal urethritis have similar but
        declining cure rates: a randomized controlled trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In pathogen-specific analyses, clinical cure did not differ by arm, nor
        did microbiologic cure differ for CT (86% vs 90%, P = .56), MG (40% vs
        30%, P = .41), or UU-2 (75% vs 70%, P = .50).
      explanation: >-
        Demonstrates microbiologic eradication of urethral U. urealyticum
        biovar 2 with both azithromycin and doxycycline in a randomized trial.

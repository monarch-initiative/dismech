name: Pearson syndrome
creation_date: '2026-07-06T01:07:38Z'
category: Mendelian
synonyms:
- Pearson marrow-pancreas syndrome
- Pearson's marrow/pancreas syndrome
- Pearson's syndrome
description: Pearson syndrome is an infantile single large-scale mitochondrial DNA deletion syndrome.
  The primary lesion is a heteroplasmic mtDNA deletion, often the common 4.97 kb deletion but variable
  in size and position, that removes mitochondrial coding and transfer-RNA sequence needed for respiratory-chain
  oxidative phosphorylation. A high deleted-mtDNA burden in hematopoietic and other proliferative tissues
  produces transfusion-dependent sideroblastic anemia, pancytopenia with vacuolated marrow precursors,
  exocrine pancreatic dysfunction, poor growth, renal tubular disease, lactic acidosis, and early childhood
  multisystem risk. Survivors can later evolve toward a Kearns-Sayre-like phenotype as deleted mtDNA becomes
  clinically important in post-mitotic tissues. Pearson syndrome is therefore modeled as a distinct disorder
  entry, not as a subtype of Kearns-Sayre syndrome, while both entries are grouped under single large-scale
  mtDNA deletion disorders.

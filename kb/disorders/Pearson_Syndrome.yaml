    supports: SUPPORT
    evidence_source: OTHER
    snippet: exocrine pancreatic dysfunction, poor weight gain, and lactic acidosis.
    explanation: GeneReviews summarizes core non-hematologic Pearson manifestations.
  - reference: PMID:36253820

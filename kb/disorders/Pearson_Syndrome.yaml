inheritance:
- name: Usually de novo mitochondrial inheritance
  description: Pearson syndrome is part of the single large-scale mitochondrial DNA deletion syndrome
    spectrum. Most cases are de novo, while rare maternal transmission is possible because mitochondrial
    DNA is maternally inherited.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  evidence:
  - reference: PMID:20301382
    reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: SLSMDSs are almost never inherited, suggesting that these disorders are typically caused
      by a de novo single large-scale mitochondrial DNA deletion (SLSMD) that occurs in the mother's oocytes
      during germline development or in the embryo during embryogenesis.
    explanation: GeneReviews describes the SLSMD inheritance pattern as usually de novo.
  - reference: PMID:36253820
    reference_title: 'Pearson syndrome: a multisystem mitochondrial disease with bone marrow failure.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Therefore, deleted mtDNA can be transmitted from the mother to her children.
    explanation: Pearson syndrome review notes the maternal inheritance route for mtDNA when transmission
      occurs.
pathophysiology:
- name: Single Large-Scale mtDNA Deletion
  description: Pearson syndrome is caused by a single large-scale mitochondrial DNA deletion. The deleted
    molecule is heteroplasmic and can be present at high load in blood and marrow early in life; deletion
    size and breakpoints vary, so the disease is not tied to a single nuclear gene or enzyme defect.

diagnosis:
- name: Mitochondrial DNA deletion testing
  presence: Positive
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Molecular diagnosis is established by detecting a single large-scale mtDNA deletion, often
    in blood, urine, buccal cells, or marrow in affected children.
  results: Detection of a single large-scale mtDNA deletion supports Pearson syndrome in the appropriate
    infantile clinical context.
  evidence:
  - reference: PMID:20301382
    reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of an SLSMDS is established in a proband with characteristic clinical features
      by identification of a mitochondrial DNA (mtDNA) deletion ranging in size from 1.1 to 10 kb on molecular
      genetic testing.
    explanation: GeneReviews defines molecular testing for single large-scale mtDNA deletion syndromes.
- name: Bone marrow aspiration and cytology
  presence: Positive
  diagnosis_term:
    preferred_term: Bone Marrow Aspiration
    term:
      id: NCIT:C15644
      label: Bone Marrow Aspiration
  description: Bone marrow examination shows characteristic cytoplasmic vacuolization of erythroid and
    myeloid precursors together with ring sideroblasts on iron staining.
  results: Vacuolated hematopoietic precursors and ring sideroblasts.
  evidence:
  - reference: PMID:36253820
    reference_title: 'Pearson syndrome: a multisystem mitochondrial disease with bone marrow failure.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Bone marrow cytology with vacuolization in erythroid and myeloid precursors and ring-sideroblasts
      guides to the correct diagnosis, which is established by detection of SLSMDs.
    explanation: Establishes bone marrow cytology showing precursor vacuolization and ring sideroblasts
      as a key diagnostic investigation in Pearson syndrome.
treatments:
- name: Transfusion and multidisciplinary supportive care
  therapeutic_modality: OTHER
  description: Management is supportive and includes transfusion therapy for sideroblastic anemia, pancreatic
    enzyme replacement when exocrine pancreatic insufficiency is present, renal/electrolyte support, surveillance
    for cardiac and endocrine complications, and coordinated mitochondrial-disease care. Volatile
    anesthetic hypersensitivity may occur, prolonged propofol (more than 30-60 minutes) should be avoided,
    and valproic acid, statins and aminoglycosides are avoided
    in primary mitochondrial disease because of their effects on mitochondrial function.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Bone Marrow Failure and Sideroblastic Anemia
    treatment_effect: BYPASSES
    description: Red blood cell transfusions compensate for severe infantile sideroblastic anemia caused
      by mitochondrial marrow failure.
    evidence:
    - reference: PMID:20301382
      reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: transfusion therapy for individuals with PS with sideroblastic anemia; replacement of pancreatic
        enzymes for exocrine pancreatic insufficiency;
      explanation: Supports transfusion therapy targeting the hematologic consequences of bone marrow
        failure.
  - target: Pancreatic Acinar Dysfunction
    treatment_effect: BYPASSES
    description: Pancreatic enzyme replacement therapy alleviates malabsorption resulting from exocrine
      pancreatic insufficiency.
    evidence:
    - reference: PMID:20301382
      reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: transfusion therapy for individuals with PS with sideroblastic anemia; replacement of pancreatic
        enzymes for exocrine pancreatic insufficiency;
      explanation: Supports pancreatic enzyme replacement for exocrine pancreatic insufficiency in Pearson
        syndrome.
  evidence:
  - reference: PMID:20301382
    reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: transfusion therapy for individuals with PS with sideroblastic anemia; replacement of pancreatic
      enzymes for exocrine pancreatic insufficiency;
    explanation: GeneReviews supports transfusion therapy for Pearson sideroblastic anemia and pancreatic
      enzyme replacement when exocrine pancreatic insufficiency is present.
  - reference: PMID:20301382
    reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Volatile anesthetic hypersensitivity may occur. Avoid prolonged treatment with propofol (>30-60
      minutes).
    explanation: GeneReviews agents and circumstances to avoid for single large-scale mtDNA deletion syndromes,
      including Pearson syndrome.
  - reference: PMID:36253820
    reference_title: 'Pearson syndrome: a multisystem mitochondrial disease with bone marrow failure.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Some medications (eg. valproic acid, statins, and aminoglycosides) should be avoided in PMD
      because of their effects on mitochondrial function and increased side effects
    explanation: The review lists medications to avoid in primary mitochondrial disease, the class that
      includes Pearson syndrome.
- name: Hematologic and pancreatic surveillance
  action_category: MONITORING
  description: Complete blood counts to assess transfusion needs, ferritin for patients receiving recurrent
    transfusions, and fecal fat and fecal elastase as needed for symptoms of exocrine pancreatic insufficiency.
  treatment_term:
    preferred_term: clinical surveillance
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:20301382
    reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: complete blood count in those with PS to assess transfusion needs with additional labs per
      hematologist, and ferritin for those needing recurrent transfusions as needed
    explanation: GeneReviews surveillance recommendation specific to Pearson syndrome.
  - reference: PMID:20301382
    reference_title: Single Large-Scale Mitochondrial DNA Deletion Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: fecal fat and fecal elastase as needed based on symptoms
    explanation: GeneReviews recommends fecal fat and fecal elastase monitoring as needed.
notes: 'Scope decision: Pearson syndrome is kept as a separate Disease entry because it has a distinct
  MONDO identity (MONDO:0010797; OMIM:557000; ORPHA:699) and a characteristic infantile marrow-pancreas
  presentation, even though it belongs to the same SLSMD continuum as Kearns-Sayre syndrome. The shared
  mechanism is captured in the Single Large-Scale mtDNA Deletion Disorders grouping.'

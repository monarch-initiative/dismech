- name: Cardiac conduction defect
  category: Cardiovascular
  description: Cardiac conduction defects are a relatively late complication and may require ablation
    or pacemaker implantation. Table 1 of PMID:36253820 reports cardiac abnormality or arrhythmia in 20-66%
    of patients across cohorts and conduction disease in 17% of one cohort, so no single frequency band
    is assigned.
  phenotype_term:
    preferred_term: Cardiac conduction defect
    term:
      id: HP:0031546
      label: Cardiac conduction abnormality
  evidence:
  - reference: PMID:36253820
    reference_title: 'Pearson syndrome: a multisystem mitochondrial disease with bone marrow failure.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PS patients who developed cardiac conduction defects may require intervention such as ablation
      and pacemaker implantations
    explanation: The review reports cardiac conduction defects in Pearson syndrome.

- name: Hair Follicle Inflammation and Degeneration
  description: >-
    Loss of follicular EGFR signalling makes the hair follicle stem cell niche
    hypersensitive to JAK-STAT1 signalling, so that interferon-gamma-producing
    CD8 T cells and NK cells destroy it. Follicles become inflamed and
    degenerate, producing alopecia, while the eyelashes grow abnormally long.

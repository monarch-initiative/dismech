histopathology:
- name: Epidermal intercellular oedema with mild acanthosis
  description: >-
    Non-lesional skin of the index patient showed mild acanthosis and widening
    between keratinocytes on light microscopy, and intercellular oedema from the
    basal to the mid-spinous layer with fewer gap junctions on electron
    microscopy, with structurally normal desmosomes and hemidesmosomes. The
    pattern resembled a desmosomal disorder without a desmosomal defect.
  evidence:
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light microscopy of non-lesional skin revealed mild acanthosis compared to age- and site-matched control skin, as well as a slight widening between adjacent keratinocytes (Figure 2a)."
    explanation: Light-microscopic findings in the index patient's skin.
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "transmission electron microscopy showed intercellular edema from the basal layer to the mid-spinous layer and a slight decrease in the number of gap junctions but no structural or numerical abnormalities in hemidesmosome or desmosome cell junctions"
    explanation: Ultrastructural findings in the index patient's skin.
- name: Thin dermis with lymphocytic folliculitis
  description: >-
    Skin biopsy of an affected sibling showed a thin dermis, lymphocytic
    infiltration of hair follicles and wiry-appearing collagen.
  evidence:
  - reference: PMID:26436111
    reference_title: EGFR mutations cause a lethal syndrome of epithelial dysfunction with progeroid features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A skin biopsy was performed and showed thin dermis, lymphocytic infiltration of hair follicles, and wiry appearing collagens (Table1)."
    explanation: Skin histology in an affected sibling.
diagnosis:
- name: Exome sequencing
  description: >-
    The disease was first identified, and is diagnosed, by exome sequencing in
    infants with neonatal erosive, inflammatory skin disease and multisystem
    involvement; the index patient was initially misdiagnosed with
    epidermolysis bullosa.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified a homozygous loss-of-function missense mutation in EGFR (c.1283 G>A; p.Gly428Asp) in a male infant with lifelong inflammation affecting the skin, bowel, and lungs."
    explanation: The causal variant was found by exome sequencing.
  - reference: PMID:32602142
    reference_title: "Epidermal growth factor receptor deficiency: Expanding the phenotype beyond infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a constitutional homozygous variant in EGFR"
    explanation: Exome sequencing also made the diagnosis in the long-term survivor.
- name: Targeted testing for the Roma founder variant
  description: >-
    Because one founder variant accounts for the reported Roma cases, targeted
    genotyping of EGFR c.1283G>A (p.Gly428Asp) can confirm the diagnosis or
    detect carriers; the carrier-frequency study genotyped 1321 Roma
    individuals by real-time PCR.
  diagnosis_term:
    preferred_term: Targeted genetic testing for EGFR c.1283G>A
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38019142
    reference_title: Frequency of Epidermal Growth Factor Receptor Gene Variant in Roma Population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A population sample of 1321 unrelated healthy individuals of Roma origin from Slovakia was tested for the p.GLY428Asp variant in EGFR gene by real-time PCR."
    explanation: Targeted genotyping of the founder variant by real-time PCR.
differential_diagnoses:
- name: Neonatal inflammatory skin and bowel disease 1 (ADAM17)
  disease_term:
    preferred_term: inflammatory skin and bowel disease, neonatal, 1
    term:
      id: MONDO:0013693
      label: inflammatory skin and bowel disease, neonatal, 1
  distinguishing_features:
  - >-
    Caused by biallelic loss of ADAM17, the sheddase that releases EGFR ligands,
    so the same signalling axis fails upstream of the receptor and the
    erythroderma, recurrent skin infection, sepsis and diarrhoea overlap closely;
    the two are separated by which gene carries the biallelic variants.
  evidence:
  - reference: PMID:33953303
    reference_title: Functionally confirmed compound heterozygous ADAM17 missense loss-of-function variants cause neonatal inflammatory skin and bowel disease 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both variants were detected in two siblings with clinical features of NISBD1, such as erythroderma with exudate in whole body, recurrent skin infection and sepsis and prolonged diarrhoea."
    explanation: Clinical features of ADAM17-related NISBD1 that overlap with NISBD2.
- name: Epidermolysis bullosa
  disease_term:
    preferred_term: epidermolysis bullosa
    term:
      id: MONDO:0006541
      label: epidermolysis bullosa
  distinguishing_features:
  - >-
    Neonatal skin erosions led to an initial diagnosis of epidermolysis bullosa
    in the index patient; EGFR-deficient skin shows intercellular oedema with
    structurally normal desmosomes and hemidesmosomes, and the disease involves
    gut, kidney and lung as well as skin.
  evidence:
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial clinical diagnosis was a subtype of inherited skin fragility, a heterogeneous group of disorders known collectively as epidermolysis bullosa (EB)"
    explanation: The index patient was first misdiagnosed as epidermolysis bullosa.
treatments:
- name: Supportive Care
  description: >-
    No disease-specific therapy exists. Care consists of intensive skin care,
    treatment of infection, nutritional support including parenteral nutrition,
    and correction of water and electrolyte imbalance; the long-term survivor
    stabilised on supportive measures alone.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Hypokalemia
    term:
      id: HP:0002900
      label: Hypokalemia
  - preferred_term: Recurrent skin infections
    term:
      id: HP:0001581
      label: Recurrent skin infections
  evidence:
  - reference: PMID:32250467
    reference_title: Fatal neonatal nephrocutaneous syndrome in 18 Roma children with EGFR deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management of ion and water imbalances and extremely demanding skin care may improve the unfavorable outcome of such patients."
    explanation: Fluid, electrolyte and skin management are the recommended care.
  - reference: PMID:32602142
    reference_title: "Epidermal growth factor receptor deficiency: Expanding the phenotype beyond infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients succumbed to early mortality; however, the proposita's condition has stabilized, despite only supportive interventions, with dermatological improvements and reduced frequency of infections at 8 years."
    explanation: Supportive care alone was followed by stabilisation in a long-term survivor.
animal_models:
- name: Egfr-null mouse (CD-1 background)
  species: Mouse
  genotype: Egfr null allele, homozygous
  background: CD-1
  publication: PMID:7618084
  description: >-
    Germline Egfr knockout. On CF-1 and 129/Sv backgrounds the null is
    embryonic lethal; on CD-1 the mice survive up to three weeks with
    abnormalities of skin, kidney, brain, liver and gastrointestinal tract,
    mirroring the multisystem involvement of NISBD2.
  modeled_mechanisms:
  - target: Abolished EGFR Downstream Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Complete germline loss of the receptor in a whole organism, with multiorgan epithelial abnormalities.
    limitations: >-
      A null allele rather than the human misfolding missense variant, and the
      phenotype depends strongly on genetic background.
    evidence:
    - reference: PMID:7618084
      reference_title: "Targeted disruption of mouse EGF receptor: effect of genetic background on mutant phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "On a 129/Sv background, homozygous mutants died at mid-gestation due to placental defects; on a CD-1 background, the mutants lived for up to 3 weeks and showed abnormalities in skin, kidney, brain, liver, and gastrointestinal tract."
      explanation: Surviving null mice show the skin, kidney and gut involvement seen in patients.
  evidence:
  - reference: PMID:7618084
    reference_title: "Targeted disruption of mouse EGF receptor: effect of genetic background on mutant phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "On a 129/Sv background, homozygous mutants died at mid-gestation due to placental defects; on a CD-1 background, the mutants lived for up to 3 weeks and showed abnormalities in skin, kidney, brain, liver, and gastrointestinal tract."
    explanation: Multisystem phenotype of the germline knockout.
- name: Epidermis-specific Egfr deletion mouse (EGFR delta-ep)
  species: Mouse
  genotype: Egfr conditional deletion in epidermal keratinocytes
  publication: PMID:23966300
  description: >-
    Keratinocyte-restricted Egfr knockout, which develops chemokine-driven skin
    inflammation, hair follicle degeneration, defective barrier and host
    defence, and early lethality.
  modeled_mechanisms:
  - target: Cutaneous Inflammation with Impaired Innate Host Defense
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reproduces the inflammatory skin phenotype and loss of antibacterial defence.
    limitations: >-
      Deletion is limited to the epidermis, so the intestinal, renal and
      cardiac components of the human disease are absent.
    evidence:
    - reference: PMID:23966300
      reference_title: Epidermal EGFR controls cutaneous host defense and prevents inflammation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking epidermal EGFR (EGFR(Δep)) show a similar phenotype, which is accompanied by chemokine-driven skin inflammation, hair follicle degeneration, decreased host defense, and deficient skin barrier function, as well as early lethality."
      explanation: The model shows skin inflammation and decreased host defence.
  - target: Hair Follicle Inflammation and Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Follicle degeneration after epidermal Egfr loss.
    limitations: Mouse hair cycling differs from human scalp hair; trichomegaly is not reported in the model.
    evidence:
    - reference: PMID:23966300
      reference_title: Epidermal EGFR controls cutaneous host defense and prevents inflammation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking epidermal EGFR (EGFR(Δep)) show a similar phenotype, which is accompanied by chemokine-driven skin inflammation, hair follicle degeneration, decreased host defense, and deficient skin barrier function, as well as early lethality."
      explanation: Hair follicle degeneration follows epidermal Egfr deletion.
  evidence:
  - reference: PMID:23966300
    reference_title: Epidermal EGFR controls cutaneous host defense and prevents inflammation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice lacking epidermal EGFR (EGFR(Δep)) show a similar phenotype, which is accompanied by chemokine-driven skin inflammation, hair follicle degeneration, decreased host defense, and deficient skin barrier function, as well as early lethality."
    explanation: Phenotype of the epidermis-specific knockout.
discussions:
- discussion_id: nisbd2_jak_inhibition_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hair Follicle Inflammation and Degeneration
  - treatments#
  prompt: >-
    JAK1/2 inhibition reverses inflammation, restores barrier function and
    regrows hair in mouse models of epidermal Egfr deletion. Would a JAK
    inhibitor reduce the inflammatory skin disease of NISBD2 patients, whose
    EGFR loss is germline and multisystem?
  rationale: >-
    The only mechanism-directed intervention yet shown to work against the
    cutaneous consequences of EGFR loss comes from mice and EGFR-inhibitor
    patients; it has not been tried in germline EGFR deficiency, which has no
    disease-specific treatment.
  evidence:
  - reference: PMID:39521937
    reference_title: JAK-STAT1 as therapeutic target for EGFR deficiency-associated inflammation and scarring alopecia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hair follicle-specific genetic depletion of either JAK1/2 or STAT1 or therapeutic inhibition of JAK1/2 ameliorated the inflammation, restored skin barrier function and activated the residual stem cells to resume hair growth in mouse models of epidermal and hair follicle-specific EGFR deletion."
    explanation: Preclinical efficacy of JAK1/2 inhibition in EGFR-deficient mouse skin.
references:
- reference: PMID:24691054
  title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
  findings:
  - statement: Discovery of homozygous EGFR p.Gly428Asp as the cause of neonatal inflammatory skin, bowel and lung disease.
notes: >-
  Almost all reported patients are homozygous for the same Roma founder
  variant, p.Gly428Asp, so the phenotype spectrum of other biallelic EGFR
  loss-of-function genotypes in humans is unknown.

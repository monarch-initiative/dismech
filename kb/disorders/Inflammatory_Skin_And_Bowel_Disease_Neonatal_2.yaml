name: Inflammatory Skin And Bowel Disease Neonatal 2
creation_date: '2026-10-24T18:00:00Z'
description: >-
  Neonatal inflammatory skin and bowel disease 2 (NISBD2), also called EGFR
  deficiency, is an autosomal recessive multisystem epithelial disorder caused
  by germline loss-of-function variants in EGFR. Almost every reported patient
  is homozygous for the same extracellular-domain missense variant,
  c.1283G>A (p.Gly428Asp), and of Roma origin. The variant receptor misfolds,
  binds EGF poorly, is lost from the plasma membrane and fails to
  autophosphorylate or activate ERK and AKT, so EGFR signalling is abolished in
  every epithelium that depends on it. Affected infants are usually born
  prematurely and growth-restricted, with thin, translucent, fragile skin that
  erodes and desquamates, then becomes ichthyotic and develops a papulopustular
  rash with alopecia and long eyelashes, the same picture produced by
  EGFR-inhibitor cancer drugs. Chronic diarrhoea, failure to thrive, recurrent
  skin and respiratory infections and sepsis, nephromegaly with renal tubular
  salt and water loss and severe electrolyte imbalance, congenital heart defects
  and a progeroid appearance complete the syndrome. Most patients die in the
  first months of life; rare survivors into childhood have been reported. The
  ADAM17-associated form (NISBD1) disrupts the same signalling axis upstream, by
  failing to shed EGFR ligands, and is a separate disease.

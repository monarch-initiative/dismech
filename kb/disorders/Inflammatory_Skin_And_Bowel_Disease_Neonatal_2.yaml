prevalence:
- population: Roma population of Slovakia (1321 unrelated healthy individuals)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2650.0
  notes: >-
    Carrier frequency of EGFR c.1283G>A (p.Gly428Asp) of 2.65%. The variant
    appears to be restricted to people of Roma origin, most patients having been
    reported from Slovakia and the Czech Republic. No disease prevalence figure
    has been published.
  evidence:
  - reference: PMID:38019142
    reference_title: Frequency of Epidermal Growth Factor Receptor Gene Variant in Roma Population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The carrier frequency in the Roma ethnic group was 2.65%."
    explanation: Population screening of 1321 healthy Roma individuals measured the carrier frequency of the founder variant.
  - reference: PMID:38019142
    reference_title: Frequency of Epidermal Growth Factor Receptor Gene Variant in Roma Population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This variant seems to be restricted to people of Roma origin with the majority of patients thus far reported being from Slovakia or the Czech Republic."
    explanation: Places the founder variant, and so the disease burden, in the Roma population.
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The largest series reports 18 children from 16 Roma families; together with
    the index case and two siblings reported earlier, and single later case
    reports, the published total is a few tens of patients.
  evidence:
  - reference: PMID:32250467
    reference_title: Fatal neonatal nephrocutaneous syndrome in 18 Roma children with EGFR deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 18 premature Roma children from 16 families with birthweights ranging 440-1470 g and multisystem diseases due to the homozygous mutation c.1283G˃A (p.Gly428Asp) in EGFR."
    explanation: The largest reported series, establishing the scale of the published case count.
progression:
- phase: Neonatal onset
  notes: >-
    Skin erosions and multisystem disease are present from birth in premature,
    growth-restricted infants.
  evidence:
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially, there were widespread erosions affecting his trunk and limbs that had been present since birth"
    explanation: The index patient had skin erosions from birth.
- phase: Early death in infancy
  notes: >-
    Most patients die within the first months of life from infection, sepsis,
    electrolyte imbalance or intestinal perforation; a 13-year-old boy and an
    8-year-old girl are the longest survivors reported.
  evidence:
  - reference: PMID:32250467
    reference_title: Fatal neonatal nephrocutaneous syndrome in 18 Roma children with EGFR deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their prognosis was poor, and all died before the age of 6 months except one 13-year-old boy with a severe skin disorder, dentinogenesis imperfecta, Fanconi-like syndrome and secondary hyperaldosteronism."
    explanation: Seventeen of 18 children in the series died before six months of age.
  - reference: PMID:32602142
    reference_title: "Epidermal growth factor receptor deficiency: Expanding the phenotype beyond infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients succumbed to early mortality; however, the proposita's condition has stabilized, despite only supportive interventions, with dermatological improvements and reduced frequency of infections at 8 years."
    explanation: A long-term survivor shows that the disease can stabilise with supportive care.
clinical_burden:

pathophysiology:
- name: EGFR Extracellular Domain Misfolding and Loss of Receptor Function
  description: >-
    The Gly428Asp substitution projects an acidic residue into the hydrophobic
    core of extracellular domain III. The receptor misfolds and aggregates,
    binds EGF about 100-fold more weakly, is unstable at the plasma membrane
    and undergoes constitutive endocytosis, so little receptor is available at
    the cell surface and what remains is not activated by ligand.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    gene:
      preferred_term: EGFR
      term:
        id: hgnc:3236
        label: EGFR
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous germline p.Gly428Asp; patient-derived fibroblasts show no
      ligand-induced receptor phosphorylation.

classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
    notes: >-
      The presenting and dominant feature is a congenital inflammatory and
      erosive skin disorder, although bowel, kidney, lung and heart are also
      involved.
    evidence:
    - reference: PMID:32250467
      reference_title: Fatal neonatal nephrocutaneous syndrome in 18 Roma children with EGFR deficiency.

- name: Renal Tubular Salt and Water Wasting
  description: >-
    The kidneys are enlarged and the tubules lose salt and water; patients
    develop hypokalaemia, hypernatraemia, hypomagnesaemia, dehydration and, in
    the long-term survivor, a Fanconi-like tubulopathy with secondary
    hyperaldosteronism. Electrolyte imbalance contributes to death.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: epithelial cell of nephron
    term:
      id: CL:1000449
      label: epithelial cell of nephron
  notes: >-
    HYPOTHETICAL as a mechanism: the renal phenotype is well documented
    clinically, but how loss of EGFR signalling produces tubular dysfunction in
    these patients has not been studied.
  evidence:
  - reference: PMID:26436111
    reference_title: EGFR mutations cause a lethal syndrome of epithelial dysfunction with progeroid features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had severe intrauterine growth restriction, nephromegaly, and renal tubulopathy."
    explanation: Nephromegaly with renal tubulopathy in an affected sibling.
  downstream:

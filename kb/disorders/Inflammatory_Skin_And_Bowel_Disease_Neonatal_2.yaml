    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, innate inflammatory response gene components (specifically PLA2, NF-κB, and JNK1) were among the most significantly up-regulated GO networks."
    explanation: Inflammatory and innate networks are up-regulated in the patient's skin.
  - reference: PMID:23966300

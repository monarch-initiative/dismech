    explanation: Discovery of the causal EGFR variant by exome sequencing.
  - reference: PMID:26436111
    reference_title: EGFR mutations cause a lethal syndrome of epithelial dysfunction with progeroid features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A comparison of homozygous inherited regions from a separate report of a patient from the same ethnic background and EGFR genotype confirms the pathogenicity of EGFR mutations in congenital disease."
    explanation: Independent affected siblings with the same genotype replicate the gene-disease association.

    term:
      id: GO:0001942
      label: hair follicle development
    modifier: DYSREGULATED
  notes: >-
    PROVISIONAL because the JAK-STAT1 mechanism comes from mouse models of
    epidermal and follicular Egfr deletion and from EGFR-inhibitor-treated
    patients; it has not been examined in NISBD2 patient skin. GO:0001942 hair
    follicle development with DYSREGULATED approximates the claim, which is
    immune destruction of the follicle stem-cell niche. OLS searches of GO for
    "stem cell niche" and "hair follicle stem cell" return only GO:0060250
    germ-line stem-cell niche homeostasis, which does not apply to the hair
    follicle.
  evidence:
  - reference: PMID:39521937
    reference_title: JAK-STAT1 as therapeutic target for EGFR deficiency-associated inflammation and scarring alopecia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, disruption of EGFR signaling generated a cell-intrinsic hypersensitivity within the JAK-STAT1 pathway, which, synergistically with interferon gamma expressing CD8 T-cell and NK-cell-mediated inflammation, compromised the stem cell niche."
    explanation: Mouse genetics identifies the mechanism by which EGFR loss destroys the follicle stem cell niche.
  downstream:
  - target: Alopecia
    description: Follicle destruction causes hair loss.
    evidence:
    - reference: PMID:24691054
      reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "EGFR initiates hair growth and hair follicle organization, and EGFR inhibition leads to inflammation, follicular necrosis and alopecia, as well as slow hair growth with brittle hairs, as observed in our patient"
      explanation: Links loss of EGFR activity to follicular inflammation and alopecia in the patient.
- name: Intestinal Epithelial Dysfunction
  description: >-
    The intestinal epithelium fails, producing life-long watery diarrhoea,
    vomiting and intolerance of feeds, and in the most severe cases
    progressive abdominal distension and intestinal perforation. In
    Egfr-deficient mice, intestinal villi are fewer and shorter and enterocyte
    proliferation is reduced.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  notes: >-
    PROVISIONAL because the cellular lesion has not been examined in patient
    intestine; the mouse villus findings are cited from secondary statements
    in the patient reports.
  evidence:
  - reference: PMID:26436111
    reference_title: EGFR mutations cause a lethal syndrome of epithelial dysfunction with progeroid features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence in this study and in the analysis of an additional affected patient from the same ethnic background shows that a failure of EGFR signaling leads to a complex phenotype with marked defects in epithelial formation and gut integrity."
    explanation: Gut integrity fails in homozygous patients.
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In murine bowel lacking Egfr, there are fewer, shorter intestinal villi and reduced proliferation of jejunal enterocytes, leading to fluid loss"
    explanation: Mouse knockout data cited by the patient report link Egfr loss to villus atrophy and fluid loss.
  downstream:
  - target: Chronic diarrhea
    description: Failing absorptive epithelium causes fluid loss.
    evidence:

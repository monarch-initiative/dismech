    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting purified sEGFRG428D protein bound EGF approximately 100-fold more weakly than wild-type sEGFR (Fig.4)."
    explanation: Surface plasmon resonance shows that the variant extracellular region has lost EGF binding.
  - reference: PMID:26436111
    reference_title: EGFR mutations cause a lethal syndrome of epithelial dysfunction with progeroid features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that the EGFR:c.1283G>A (p.Gly428Asp) mutation causes EGFR’s extracellular region to fold incorrectly, consistent with both reduced levels of the protein in patient-derived cells (and efforts to express EGFRGly428Asp exogenously) and loss of EGF binding."
    explanation: Misfolding explains both the reduced receptor level and the loss of ligand binding.
  - reference: PMID:24691054
    reference_title: Epithelial inflammation resulting from an inherited loss-of-function mutation in EGFR.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This suggests that the mutation p.Gly428Asp renders EGFR at the plasma membrane highly unstable and thus more susceptible to constitutive endocytosis."
    explanation: Expressed variant receptor fails to stay at the plasma membrane unless endocytosis is blocked.
  downstream:

- name: Cutaneous Inflammation with Impaired Innate Host Defense
  description: >-
    Without EGFR signalling, keratinocytes up-regulate chemokines and
    NF-kappaB-centred innate inflammatory networks and recruit macrophages, mast
    cells and lymphocytes, while producing fewer antimicrobial peptides and
    killing Staphylococcus aureus less effectively. The resulting papulopustular
    eruption reproduces the rash caused by EGFR-inhibitor drugs, and the
    weakened antibacterial defence allows recurrent staphylococcal infection.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

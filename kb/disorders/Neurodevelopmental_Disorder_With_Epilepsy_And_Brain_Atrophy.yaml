- ATP6V0A1-related progressive myoclonus epilepsy
- ATP6V0A1 biallelic neurodevelopmental disorder
disease_term:
  preferred_term: neurodevelopmental disorder with epilepsy and brain atrophy
  term:
    id: MONDO:0859265
    label: neurodevelopmental disorder with epilepsy and brain atrophy
parents:
- inborn error of metabolism
inheritance:
- name: Autosomal recessive
  description: >-
    NEDEBA is the biallelic (recessive) ATP6V0A1 phenotype; affected individuals
    carry compound-heterozygous variants, and the pedigrees were analysed under
    an autosomal recessive model.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34909687
    reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five individuals from 2 unrelated pedigrees in our cohort carry the biallelic E149Kfs*18 frameshift and R495W substitution and manifest an early onset, progressive myoclonus epilepsy (PME) and ataxia, therefore, expanding the neurological phenotypes associated with ATP6V0A1 variants beyond the more severe developmental and epileptic encephalopathy observed in the de novo cases."
    explanation: Establishes the biallelic (recessive) ATP6V0A1 phenotype distinct from the de novo DEE.
pathophysiology:
- name: ATP6V0A1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic ATP6V0A1 variants (a frameshift plus a missense) reduce the
    brain-enriched a1 subunit of the V0 membrane domain of the vacuolar
    H+-ATPase, the proton-translocating component that acidifies endosomes and
    lysosomes.
  genes:
  - preferred_term: ATP6V0A1
    term:
      id: hgnc:865
      label: ATP6V0A1
  molecular_functions:
  - preferred_term: V-ATPase proton transport
    modifier: DECREASED
    term:
      id: GO:0046961
      label: proton-transporting ATPase activity, rotational mechanism
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:34909687
    reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP6V0A1 is the brain-enriched isoform of the a subunit in the V0 domain"
    explanation: Identifies ATP6V0A1 as the brain-enriched V0 a-subunit affected in the disease.
  downstream:
  - target: Impaired Endolysosomal Acidification
    causal_link_type: DIRECT
    description: Loss of the a1 proton-pumping subunit raises endolysosomal pH.
- name: Impaired Endolysosomal Acidification
  biological_scale: CELLULAR
  description: >-
    Reduced V-ATPase activity fails to acidify the endolysosomal compartment.
    Functional assays of a recurrent de novo allele (R740Q) show directly
    impaired acidification, and other disease variants converge on the same
    defect, so impaired protonation is the shared mechanism across ATP6V0A1
    conditions including the biallelic arm.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: lysosomal lumen acidification
    modifier: DECREASED
    term:
      id: GO:0007042
      label: lysosomal lumen acidification
  evidence:
  - reference: PMID:34909687
    reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "N527D) variants also resulted in impaired lysosomal acidification, as recently shown, 66 suggesting that impaired protonation is a shared mechanism among other disease-associated variants."
    explanation: Supports impaired lysosomal acidification as the mechanism shared across ATP6V0A1 disease variants.
  downstream:
  - target: Lysosomal and Autophagic Dysfunction
    causal_link_type: DIRECT
    description: Without an acidic lumen, lysosomal hydrolysis and autophagosome turnover fail.
- name: Lysosomal and Autophagic Dysfunction
  biological_scale: CELLULAR
  description: >-
    Failure of lysosomal hydrolysis and of acidification-dependent autophagosome
    turnover causes autophagic dysfunction, the degradative failure that drives
    neurodegeneration.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:34909687
    reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The R740Q mutation, which alone accounts for almost 50% of the mutations identified among our cases, leads to failure of lysosomal hydrolysis by directly impairing acidification of the endolysosomal compartment, causing autophagic dysfunction and severe developmental defect in Caenorhabditis elegans."
    explanation: Links impaired acidification to failed lysosomal hydrolysis and autophagic dysfunction (assayed on a de novo allele and in C. elegans).
  downstream:
  - target: Cerebellar atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Degradative failure in neurons drives neurodegeneration, prominent in the cerebellum in the recessive arm.
  - target: Myoclonus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Neuronal dysfunction produces the progressive myoclonus epilepsy.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Neuronal dysfunction produces epilepsy.

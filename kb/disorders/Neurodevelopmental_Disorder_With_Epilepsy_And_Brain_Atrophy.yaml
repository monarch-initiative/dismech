notes: >-
  NEDEBA (OMIM 619971) is the biallelic/recessive ATP6V0A1 phenotype: early-onset
  progressive myoclonus epilepsy with ataxia and cerebellar atrophy. It is
  distinct from the de novo ATP6V0A1 phenotype, developmental and epileptic
  encephalopathy 104 (DEE104, OMIM 619970, MONDO:0031021), which is already
  curated as an ATP6V0A1 subtype of the Genetic_Developmental_and_Epileptic_Encephalopathy
  grouping entry; the two share a gene and the endolysosomal-acidification
  mechanism but differ in inheritance (recessive vs de novo), severity, and the
  prominence of cerebellar atrophy. The MONDO term for NEDEBA (MONDO:0859265) is
  not held by any other entry, so there is no shared-disease-term conflict.

  The recessive arm has direct functional evidence of its own: two biallelic
  alleles from earlier-reported families, A512P and N534D, impair lysosomal
  acidification in neuronal overexpression assays. The R495W allele in the main
  cohort was not tested; the authors speculate it is less damaging to proton
  pumping and manifests only in trans with a null allele. The autophagosome-turnover
  and C. elegans developmental-defect assays were performed on the recurrent de
  novo R740Q allele, and the evidence attributes them to it.

  No GeneReviews chapter covers ATP6V0A1-related disease.

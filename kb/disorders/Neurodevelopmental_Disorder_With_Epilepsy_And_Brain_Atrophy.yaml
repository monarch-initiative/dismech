      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five affected subjects with biallelic variants in this gene presented with a phenotype of early-onset progressive myoclonus epilepsy with ataxia, while 12 individuals carried de novo missense variants and showed severe developmental and epileptic encephalopathy."
      explanation: Demonstrates that NEDEBA is an inherited autosomal recessive genetic disorder caused by biallelic ATP6V0A1 variants.

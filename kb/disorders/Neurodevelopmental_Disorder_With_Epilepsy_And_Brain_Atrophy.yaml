genetic:
- name: ATP6V0A1
  gene_term:
    preferred_term: ATP6V0A1
    term:
      id: hgnc:865
      label: ATP6V0A1
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    ATP6V0A1 (chromosome 17q21.2) encodes the brain-enriched a1 isoform of the V0
    membrane domain of the vacuolar H+-ATPase. NEDEBA is the biallelic (recessive)
    ATP6V0A1 phenotype: the reported families are compound heterozygous for a
    frameshift (E149Kfs*18) and a missense (R495W) allele; earlier-reported
    families carried other biallelic missense alleles (A512P and N534D). De novo
    missense variants in the same gene instead cause the more severe
    developmental and epileptic encephalopathy (DEE104, OMIM 619970), curated as
    an ATP6V0A1 subtype of Genetic_Developmental_and_Epileptic_Encephalopathy.
  variants:
  - name: E149Kfs*18
    description: Frameshift allele carried in compound heterozygosity in the biallelic PME/ataxia families.
    evidence:
    - reference: PMID:34909687
      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five individuals from 2 unrelated pedigrees in our cohort carry the biallelic E149Kfs*18 frameshift and R495W substitution"
      explanation: Reports the biallelic frameshift allele.
  - name: R495W
    description: >-
      Missense allele carried in compound heterozygosity with the frameshift.
      Its functional impact was not tested; the authors speculate it is less
      damaging to proton pumping and manifests only in trans with a null allele.
    evidence:
    - reference: PMID:34909687
      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the biallelic E149Kfs*18 frameshift and R495W substitution"
      explanation: Reports the biallelic missense allele.
    - reference: PMID:34909687
      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We speculate that this variant has a less damaging impact on the proton pumping activity, leading to neurological manifestations only when in compound heterozygosity with a null allele."
      explanation: The impact of R495W on proton pumping is a stated speculation, not a measured result.
  - name: A512P
    description: >-
      Biallelic missense allele (NM_001130021.3 p.A505P) in an earlier-reported
      family, in compound heterozygosity with a 50-kb deletion; impairs lysosomal
      acidification in neuronal overexpression assays.
    evidence:
    - reference: PMID:34909687
      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two with the following biallelic mutations: a p. A512P missense variant (corresponding to NM_001130021.3: p. A505P) in compound heterozygosity with a 50-kb deletion, and a p. N534D missense variant (corresponding to NM_001130021.3: p. N527D)"
      explanation: Reports the A512P and N534D biallelic alleles from earlier-reported families.
  - name: N534D
    description: >-
      Biallelic missense allele (NM_001130021.3 p.N527D) in an earlier-reported
      family; impairs lysosomal acidification in neuronal overexpression assays.
    evidence:
    - reference: PMID:34909687
      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a p. N534D missense variant (corresponding to NM_001130021.3: p. N527D)"
      explanation: Reports the N534D biallelic allele.
  evidence:
  - reference: PMID:34909687
    reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "provide a direct link with endolysosomal acidification in the pathophysiology of ATP6V0A1-related conditions."
    explanation: Establishes ATP6V0A1 as causative via endolysosomal acidification failure.
notes: >-
  NEDEBA (OMIM 619971) is the biallelic/recessive ATP6V0A1 phenotype: early-onset
  progressive myoclonus epilepsy with ataxia and cerebellar atrophy. It is
  distinct from the de novo ATP6V0A1 phenotype, developmental and epileptic
  encephalopathy 104 (DEE104, OMIM 619970, MONDO:0031021), which is already
  curated as an ATP6V0A1 subtype of the Genetic_Developmental_and_Epileptic_Encephalopathy
  grouping entry; the two share a gene and the endolysosomal-acidification
  mechanism but differ in inheritance (recessive vs de novo), severity, and the
  prominence of cerebellar atrophy. The MONDO term for NEDEBA (MONDO:0859265) is
  not held by any other entry, so there is no shared-disease-term conflict.

  The recessive arm has direct functional evidence of its own: two biallelic
  alleles from earlier-reported families, A512P and N534D, impair lysosomal
  acidification in neuronal overexpression assays. The R495W allele in the main
  cohort was not tested; the authors speculate it is less damaging to proton
  pumping and manifests only in trans with a null allele. The autophagosome-turnover
  and C. elegans developmental-defect assays were performed on the recurrent de
  novo R740Q allele, and the evidence attributes them to it.

  No GeneReviews chapter covers ATP6V0A1-related disease.

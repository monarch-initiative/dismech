name: Neurodevelopmental Disorder with Epilepsy and Brain Atrophy
creation_date: "2026-11-06T15:55:00Z"
category: Mendelian
description: >-
  Neurodevelopmental disorder with epilepsy and brain atrophy (NEDEBA; OMIM
  619971; MONDO:0859265) is an autosomal recessive neurological disorder caused
  by biallelic loss-of-function variants in ATP6V0A1, which encodes the
  brain-enriched a1 subunit of the membrane-embedded V0 domain of the vacuolar
  H+-ATPase (V-ATPase) proton pump. Reduced V-ATPase proton-pumping activity
  impairs acidification of the endolysosomal compartment in neurons, leading to
  defective lysosomal hydrolysis, impaired autophagosome turnover, and
  neurodegeneration. Clinically, affected individuals present with early- or
  juvenile-onset progressive myoclonus epilepsy, mild to prominent cerebellar
  ataxia, intellectual disability, and cerebral and cerebellar atrophy on brain
  magnetic resonance imaging.
synonyms:
- NEDEBA
- ATP6V0A1-related progressive myoclonus epilepsy
- ATP6V0A1 biallelic neurodevelopmental disorder
disease_term:
  preferred_term: neurodevelopmental disorder with epilepsy and brain atrophy
  term:
    id: MONDO:0859265
    label: neurodevelopmental disorder with epilepsy and brain atrophy
parents:
- inborn error of metabolism

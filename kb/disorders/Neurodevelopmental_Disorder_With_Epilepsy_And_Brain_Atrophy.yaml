      reference_title: "Variants in ATP6V0A1 cause progressive myoclonus epilepsy and developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report 5 individuals from 2 unrelated families with compound heterozygous variants in ATP6V0A1 presenting with a phenotype of early-onset progressive myoclonus epilepsy (PME) and ataxia"
      explanation: Establishes NEDEBA as a primary neurological disorder characterized by progressive myoclonus epilepsy, ataxia, and cerebellar atrophy.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE

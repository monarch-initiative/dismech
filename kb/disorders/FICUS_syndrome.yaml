diagnosis:
- name: Standardized psychometric and sleep-fatigue symptom screening
  description: Clinical evaluation of ICU family members uses validated psychometric and symptom instruments—including the Hospital Anxiety and Depression Scale (HADS) for anxiety and depression, the Pittsburgh Sleep Quality Index (PSQI) for sleep disturbance, and the Fatigue Assessment Instrument for fatigue—to identify PICS-F domains.
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:40161896
    reference_title: 'Development and Validation of a Nomogram Prediction Model for Key Symptoms of Post-Intensive Care Syndrome-Family in Family Members of Critically-Ill Patients: Focusing on Sleep Disturbance, Fatigue, Anxiety, and Depression.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The sleep disturbances, fatigue, anxiety, and depression were assessed using the Pittsburgh Sleep Quality Index, the Subscale of Fatigue Assessment Instrument, and the Hospital Anxiety and Depression Scale, respectively.
    explanation: Documents the standardized clinical assessment scales used to evaluate core PICS-F symptom domains.

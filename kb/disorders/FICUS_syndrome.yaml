name: FICUS syndrome
creation_date: '2026-01-26T17:51:15Z'
category: Psychiatric
description: 'Family intensive care unit syndrome (FICUS, also termed post-intensive care syndrome-family / PICS-F) is a clinical constellation of acute and persistent psychological, cognitive, and somatic symptoms—including anxiety, depression, post-traumatic stress symptoms, sleep disturbance, fatigue, and diminished health-related quality of life—experienced by family members and surrogate decision-makers of critically ill intensive care unit (ICU) patients during hospitalization and following ICU discharge. Note: MONDO:0978296 refers to a genetic dysmorphology syndrome (OMIM 621193), not the PICS-F condition described here.

  '
synonyms:
- Family intensive care unit syndrome
- Post-intensive care syndrome-family
- PICS-F
parents:
- Psychiatric Disease
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:29277171
      reference_title: Post-intensive care syndrome symptoms and health-related quality of life in family decision-makers of critically ill patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Family members of critically ill patients can suffer symptoms of post-intensive care syndrome-family (PICS-F), including anxiety, depression, and posttraumatic stress disorder (PTSD) with a diminished quality of life.
      explanation: The core clinical manifestations are psychiatric and neurobehavioral (anxiety, depression, PTSD, sleep disturbance, and cognitive strain), supporting placement under Neurologic / Psychiatric disorders.
prevalence:
- population: ICU family members of COVID-19 patients (single-center, Japan)
  notes: Overall PICS-F occurred in 33% of evaluated ICU family members of COVID-19 patients.
  evidence:
  - reference: PMID:35795400
    reference_title: Postintensive Care Syndrome-Family Associated With COVID-19 Infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall PICS-F occurred in 33%.
    explanation: This study reports overall PICS-F occurrence among ICU family members of COVID-19 patients.
  measure_type: PERIOD_PREVALENCE
  rate_per_100000: 33000
- population: Symptom domain prevalence (anxiety, depression, PTSD) in family decision-makers of critically ill patients (single-center, United States)
  notes: Prevalence of anxiety (45.8%), depression (25%), and PTSD (11.1%) symptoms among family decision-makers over the course of the study.
  evidence:
  - reference: PMID:29277171
    reference_title: Post-intensive care syndrome symptoms and health-related quality of life in family decision-makers of critically ill patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found a significant prevalence of anxiety (45.8%), depression (25%), and PTSD (11.1%) symptoms among FDMs over the course of the study.
    explanation: This provides symptom prevalence estimates in family decision-makers during and after ICU admission.
  measure_type: PERIOD_PREVALENCE
epidemiology:
- name: Prevalence range of psychological outcomes in ICU family caregivers
  description: 'Systematic review reporting wide ranges in prevalence estimates for depression, anxiety, and PTSD among family caregivers of critically ill ICU patients across studies.

    '
  minimum_value: 2
  maximum_value: 94
  unit: percentage
  notes: Ranges reported across included studies; depression 4%–94%, anxiety 2%–80%, PTSD 3%–62%.
  evidence:
  - reference: PMID:30950647
    reference_title: Psychological Sequelae in Family Caregivers of Critically III Intensive Care Unit Patients. A Systematic Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of psychological outcomes in family caregivers ranged from 4% to 94% for depression, 2% to 80% for anxiety, and 3% to 62% for PTSD.
    explanation: This provides prevalence ranges across studies for key psychological outcomes in ICU family caregivers.
    quote_role: REVIEW_SYNTHESIS
- name: Risk factors for psychological outcomes in ICU family caregivers
  description: 'Systematic review identifying common risk factors for adverse psychological outcomes among family caregivers of critically ill ICU patients.

    '
  factors:
  - Younger caregiver age
  - Caregiver relationship to the patient
  - Lower socioeconomic status
  - Female sex
  evidence:
  - reference: PMID:30950647
    reference_title: Psychological Sequelae in Family Caregivers of Critically III Intensive Care Unit Patients. A Systematic Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Common risk factors identified for adverse psychological outcomes included younger caregiver age, caregiver relationship to the patient, lower socioeconomic status, and female sex.
    explanation: This review lists common risk factors associated with psychological outcomes in ICU family caregivers.
    quote_role: REVIEW_SYNTHESIS
progression:
- phase: Acute intra-ICU admission phase
  notes: Onset of acute emotional distress, fear, desperation, anxiety, depression, and impaired comprehension or recall occurs during the relative's ICU stay, particularly within 48 hours of critical illness and ICU delirium.
  evidence:
  - reference: DOI:10.1038/s41598-024-53968-3
    reference_title: 'The spectrum of psychological disorders in family members of patients suffering from delirium associated with critical illness: a prospective, observational study'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of anxiety symptoms, depression, and posttraumatic stress disorder (PTSD) was higher in families of patients diagnosed with ICU delirium within 48 h of admission to the ICU.
    explanation: Demonstrates acute emergence of anxiety, depression, and PTSD symptoms in family members during early ICU admission.
- phase: Chronic post-ICU survivorship phase
  notes: Longitudinal prospective cohort data demonstrate that psychological symptoms and health-related quality-of-life problems persist in nearly one-third of family members of ICU survivors at 12 months after ICU care.
  evidence:
  - reference: DOI:10.1186/s13613-025-01420-8
    reference_title: 'Psychological symptoms, quality of life and dyadic relations in family members of intensive care survivors: a multicentre, prospective longitudinal cohort study'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Almost one-third of the family members of ICU survivors reported persistent psychological symptoms and QoL problems at 12-months.
    explanation: Establishes chronic persistence of psychological symptoms and impaired quality of life at 12 months after ICU care.
  duration: Months to 12 months following ICU discharge
pathophysiology:
- name: Acute ICU critical illness exposure
  description: Exposure to a close relative's life-threatening critical illness, ICU delirium, and perceived unexpectedness of clinical deterioration or death act as the primary initiating traumatic stressor in family members.
  role: trigger
  biological_processes:
  - preferred_term: response to stress
    term:
      id: GO:0006950
      label: response to stress
  evidence:
  - reference: DOI:10.1038/s41598-024-53968-3
    reference_title: 'The spectrum of psychological disorders in family members of patients suffering from delirium associated with critical illness: a prospective, observational study'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During intensive care unit admission, relatives of critically ill patients can experience emotional distress.
    explanation: Identifies ICU admission of a critically ill relative as the primary initiating stressor.
  downstream:
  - target: Surrogate medical decision-making burden
    causal_link_type: DIRECT
    description: Critical illness in an incapacitated relative places family members into high-stakes surrogate decision-making roles.
  - target: Trauma-related intrusive cognitive processing and avoidance
    causal_link_type: DIRECT
    description: Traumatic ICU exposure and perceived unexpected clinical events trigger intrusive memories, avoidance, and post-traumatic stress responses.
    evidence:
    - reference: PMID:39023049
      reference_title: 'Understanding Intensive Care Unit Family Caregivers'' Vulnerability to Post-Traumatic Stress Disorder: The Impact of Neurotic Personality Traits, Emotional Suppression, and Perceptions of Unexpected Death.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Tendencies to view the patient's death as unexpected may contribute to intrusive thoughts and memories of the ICU experience.
      explanation: Connects traumatic perceptions of the ICU course to intrusive post-traumatic cognitive processing.
  - target: Affective dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Greater patient critical illness severity and lower family social support during ICU admission predict key PICS-F affective and somatic symptoms.
    evidence:
    - reference: PMID:40161896
      reference_title: 'Development and Validation of a Nomogram Prediction Model for Key Symptoms of Post-Intensive Care Syndrome-Family in Family Members of Critically-Ill Patients: Focusing on Sleep Disturbance, Fatigue, Anxiety, and Depression.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: 'The model included five predictive factors: family age, patient age, APACHE II score, average monthly income per family member, and PSSS score.'
      explanation: Identifies patient illness severity (APACHE II score) and family demographic/support factors as multivariable predictors of PICS-F symptoms.
  - target: Circadian and sleep disruption
    causal_link_type: DIRECT
    description: ICU vigils and acute stress disrupt circadian and sleep routines in family members.
- name: Surrogate medical decision-making burden
  description: High-stakes surrogate medical decision-making for an incapacitated critically ill patient—compounded by prognostic uncertainty and complex medical communication—intensifies acute cognitive strain and long-term psychological morbidity.
  role: central
  downstream:
  - target: Acute stress-induced cognitive overload
    causal_link_type: DIRECT
    description: High-stakes surrogate decision demands under emotional strain impair comprehension and recall of medical information.
  - target: Affective dysregulation
    causal_link_type: DIRECT
    description: Surrogate decision-making burden contributes to anxiety and depressive symptoms.
- name: Acute stress-induced cognitive overload
  description: Severe emotional distress during the ICU crisis impairs information encoding, comprehension of complex medical communication, and recall during family conferences.
  role: central
  evidence:
  - reference: DOI:10.1055/s-0043-1769933
    reference_title: 'Anxiety and Depression Symptoms of Family Members of Intensive Care Unit Patients: A Prospective Observational Study and the Lived Experiences of the Family Members'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All interviewees stated having difficulty understanding and remembering what was told.
    explanation: Demonstrates acute cognitive encoding and recall impairment under traumatic ICU stress.
  downstream:
  - target: Memory impairment
    causal_link_type: DIRECT
    description: Acute stress and cognitive overload impair comprehension and memory of medical information.
- name: Trauma-related intrusive cognitive processing and avoidance
  description: Unprocessed trauma from witnessing critical illness, delirium, or unexpected patient death leads to recurrent intrusive memories of the ICU experience, emotional avoidance, and hyperarousal.
  role: central
  evidence:
  - reference: PMID:39023049
    reference_title: 'Understanding Intensive Care Unit Family Caregivers'' Vulnerability to Post-Traumatic Stress Disorder: The Impact of Neurotic Personality Traits, Emotional Suppression, and Perceptions of Unexpected Death.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Tendencies to view the patient's death as unexpected may contribute to intrusive thoughts and memories of the ICU experience.
    explanation: Supports intrusive trauma-related cognitive processing in ICU family caregivers.
  - reference: PMID:29277171
    reference_title: Post-intensive care syndrome symptoms and health-related quality of life in family decision-makers of critically ill patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Avoidant coping demonstrated moderate relationships with PTSD symptoms and anxiety at T3.
    explanation: Demonstrates that avoidant coping in ICU family decision-makers is associated with PTSD and anxiety symptoms at 60 days post-admission.
  downstream:
  - target: Posttraumatic stress symptoms
    causal_link_type: DIRECT
    description: Trauma-related cognitive processing manifests clinically as post-traumatic stress symptoms.
  - target: Recurrent, involuntary, and intrusive distressing memories
    causal_link_type: DIRECT
    description: Traumatic ICU impressions produce recurrent intrusive distressing memories.
  - target: Avoidance of stimuli associated with traumatic event
    causal_link_type: DIRECT
    description: Emotional suppression and trauma-related distress drive avoidance of trauma-associated stimuli.
- name: Affective dysregulation
  description: Prolonged emotional strain and ongoing post-ICU caregiving demands produce persistent anxiety, depressive mood, and reduced health-related quality of life.
  role: effector
  evidence:
  - reference: PMID:29277171
    reference_title: Post-intensive care syndrome symptoms and health-related quality of life in family decision-makers of critically ill patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PICS symptom severity at T3 explained 75% of the variance in HRQOL mental summary score.
    explanation: Demonstrates that PICS-F symptom severity accounts for most of the variance in mental health-related quality of life at 60 days.
  - reference: DOI:10.1186/s13613-025-01420-8
    reference_title: 'Psychological symptoms, quality of life and dyadic relations in family members of intensive care survivors: a multicentre, prospective longitudinal cohort study'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Almost one-third of the family members of ICU survivors reported persistent psychological symptoms and QoL problems at 12-months.
    explanation: Links persistent affective symptoms to long-term impairment of quality of life.
  downstream:
  - target: Anxiety symptoms
    causal_link_type: DIRECT
    description: Affective dysregulation directly manifests as clinical anxiety symptoms.
  - target: Depressive symptoms
    causal_link_type: DIRECT
    description: Sustained caregiving burden manifests as depressive symptoms.
  - target: Diminished health-related quality of life
    causal_link_type: DIRECT
    description: Persistent affective and psychological symptoms degrade overall health-related quality of life.
    evidence:
    - reference: PMID:29277171
      reference_title: Post-intensive care syndrome symptoms and health-related quality of life in family decision-makers of critically ill patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: PICS symptom severity at T3 explained 75% of the variance in HRQOL mental summary score.
      explanation: Directly links PICS-F psychological symptom severity to diminished mental health-related quality of life.
- name: Circadian and sleep disruption
  description: Disrupted circadian and sleep routines during ICU vigils and sustained post-ICU caregiver strain produce clinically significant sleep disturbance and somatic fatigue.
  role: effector
  biological_processes:

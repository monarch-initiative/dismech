    In Cfap43-deficient mice the manchette of elongating spermatids is
    abnormal and the ectoplasmic specialization is disorganized, which
    impairs both sperm head shaping and flagellum formation and adds
    oligozoospermia and head defects to MMAF. Not yet examined in patients.

    description: Missense alleles still cause MMAF; whether it is milder is disputed.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This patient has the lowest percentage of sperm with short flagella (22%) with 10% of morphologically normal spermatozoa (versus 0% for the other CFAP43-mutated subjects) and therefore presents a milder phenotype compared to the others with homozygous truncating mutations."
      explanation: The one patient with a missense allele had a milder phenotype.
    - reference: PMID:41341611
      reference_title: "Expanding the phenotypic spectrum associated with CFAP43 mutations: a case report of familial male infertility with respiratory manifestations."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "However, this was not observed in the studied family, as both siblings suffered from almost complete asthenospermia in addition to the chronic respiratory symptoms."
      explanation: A homozygous missense allele gave a severe phenotype.
  evidence:
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly among CFAP43-mutated patients, only one (P43-9) carried a missense variant, with potentially a milder effect (Val347Ala)."
    explanation: A missense allele in trans with a truncating allele.
  - reference: PMID:41341611
    reference_title: "Expanding the phenotypic spectrum associated with CFAP43 mutations: a case report of familial male infertility with respiratory manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES identified a novel homozygous missense genetic variation in CFAP43 [c.421T>A p.(Trp141Arg)]."
    explanation: A homozygous missense allele in the WD-repeat region.
- name: Defective Intra-Manchette Transport

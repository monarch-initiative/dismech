- hypothesis_group_id: cfap43_motile_cilia_involvement
  hypothesis_label: CFAP43 loss also impairs airway motile cilia in some patients
  status: EMERGING
  description: >-
    CFAP43 is present in motile cilia, and Cfap43 knockout mice have faster
    but less effective tracheal ciliary beating, nasal mucus accumulation and
    hydrocephalus. Almost all patients nonetheless have isolated infertility.
    One Palestinian family with a homozygous missense variant had chronic
    sinusitis, wet cough and focal bronchiectasis, without ciliary studies.
    ClinGen treats that presentation as a separate CFAP43 primary ciliary
    dyskinesia entity rated Limited.

animal_models:
- name: Cfap43 knockout mouse
  species: Mouse
  genotype: Cfap43-/- (CRISPR/Cas9 frameshift), homozygous
  publication: PMID:29449551
  description: >-
    Several independent Cfap43 knockout lines have been made. Males are
    sterile with immotile MMAF sperm and disorganized axonemes; females are
    fertile. The mice also have oligozoospermia, sperm head and chromatin
    compaction defects, impaired tracheal ciliary function and
    hydrocephalus, which are not part of the human disease as usually
    reported.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knockout reproduces human MMAF.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cfap43−/− males were infertile and 100% of their spermatozoa were immotile and morphologically abnormal with short and coiled tail, a phenotype very similar to human MMAF"
      explanation: Knockout males reproduce the human sperm phenotype.
    - reference: PMID:28552195
      reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that both Cfap43- and Cfap44-deficient male mice were infertile, whereas female mice with corresponding mutants could generate offspring."
      explanation: An independent knockout line with male-only infertility.
  - target: Sperm Axonemal Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Knockout sperm lack the central pair and have scattered doublets.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Note the specific arrangement of the ODFs around the axoneme in WT sperm and the complete disorganization of the DMTs and the absence of the central pair in Cfap43−/− sperm."
      explanation: Same ultrastructural defect as in patients.
  - target: Defective Intra-Manchette Transport
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: The manchette defect has only been studied in mice.
    limitations: >-
      Spermatid manchette structure has not been examined in patients, so it
      is unknown whether the mouse finding applies to human SPGF19.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Knockout mice add oligozoospermia and strong sperm head and DNA
        compaction defects to MMAF, whereas reported patients usually have
        normal sperm counts and the head defects have not been measured,
        so the weight of the manchette pathway in the human disease may be
        smaller than in mice.
    evidence:
    - reference: PMID:33046149
      reference_title: "CFAP43-mediated intra-manchette transport is required for sperm head shaping and flagella formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, both abnormal manchette and disorganized ectoplasmic specialization (ES) could be observed at the elongated spermatids in Cfap43-deficient mice."
      explanation: Manchette defects in the knockout.
  - target: Airway Motile Cilia Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Knockouts have airway mucus accumulation and hydrocephalus.
    limitations: >-
      Airway and brain phenotypes are prominent in knockout mice but almost
      absent from patients; one family has respiratory symptoms and none has
      hydrocephalus.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mice are prone to hydrocephalus from ependymal ciliary defects that
        rarely cause hydrocephalus in humans, and the mouse tracheal phenotype
        has no counterpart in nearly all CFAP43 patients, so the knockout
        overstates motile-cilia involvement in the human disease.
    evidence:
    - reference: PMID:31884020
      reference_title: "CFAP43 modulates ciliary beating in mouse and Xenopus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CFAP43 is involved in the regulation of the beating frequency of tracheal cilia and loss of CFAP43 causes severe mucus accumulation in the nasal cavity."
      explanation: Airway ciliary dysfunction in the knockout.
- name: Trypanosoma brucei TbCFAP43 RNAi knockdown
  species: Trypanosoma brucei
  genotype: Tetracycline-inducible RNAi against TbCFAP43
  publication: PMID:29449551
  description: >-
    Knockdown in the protozoan parasite produces abnormal flagellar beating,
    disorganized axonemes, multiflagellated cells and growth arrest.
  modeled_mechanisms:
  - target: Sperm Axonemal Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Axonemal disorganization after knockdown in a flagellated protozoan.
    limitations: >-
      Trypanosome flagella have a paraflagellar rod instead of the fibrous
      sheath and outer dense fibres of sperm, and knockdown also blocks
      cytokinesis, which has no human counterpart.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The trypanosome flagellum is built on a paraflagellar rod rather than
        the sperm fibrous sheath, so the peri-axonemal partners of CFAP43
        differ between the model and human sperm.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In all cases, both TbCFAP44RNAi-induced and TbCFAP43RNAi-induced cells showed abnormal beating (Supplementary Movies 2–5) and stopped proliferating after 24 h and eventually died"
      explanation: Knockdown impairs flagellar beating.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect. Reported fertilization and blastocyst
    rates are similar to other ICSI cycles, and pregnancies and live births
    are reported after ICSI without oocyte activation. The Palestinian
    brothers each had one live-born son but needed 8 and 4 ICSI cycles. In
    knockout mice, Cfap43-deficient sperm have chromatin compaction defects
    and support embryo development less well than Cfap44-deficient sperm;
    whether this applies to patients is unknown.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar form and motility irrelevant to fertilization.
    evidence:
    - reference: PMID:36960497
      reference_title: "Patients with MMAF induced by novel biallelic CFAP43 mutations have good fertility outcomes after intracytoplasmic sperm injection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The rate of fertilization was 66.7% and 75.0%, the rate of embryo cleavage was 100.0% and 86.7%, and the rate of blastocyst formation was 41.7% and 46.2%."
      explanation: Normal-range fertilization and blastocyst rates with patient sperm.
  evidence:
  - reference: PMID:36960497
    reference_title: "Patients with MMAF induced by novel biallelic CFAP43 mutations have good fertility outcomes after intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following frozen-thawed embryo transfer, the female partner of F3-II-1 proband became pregnant and gave birth to a full-term healthy boy, while the partner of F4-II-1 proband was in a good state of clinical pregnancy."
    explanation: Pregnancies after ICSI in two couples.
  - reference: PMID:41549427
    reference_title: "Novel biallelic CFAP43 mutations induce MMAF with mitochondrial abnormalities and successful ICSI outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, assisted reproductive technology using intracytoplasmic sperm injection (ICSI) resulted in a successful pregnancy and live birth."
    explanation: A further live birth.
  - reference: PMID:30251428
    reference_title: "Patients with multiple morphological abnormalities of the sperm flagella harbouring CFAP44 or CFAP43 mutations have a good pregnancy outcome following intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results support a good ICSI prognosis for MMAF patients carrying CFAP44 or CFAP43 mutations."
    explanation: Retrospective cohort including CFAP43 patients.
  - reference: PMID:41341611
    reference_title: "Expanding the phenotypic spectrum associated with CFAP43 mutations: a case report of familial male infertility with respiratory manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 1 (Figure 1A, IV2), who is now 54 years old, has a history of 8 ICSI trials, and one of them was successful."
    explanation: Success after repeated cycles in the homozygous missense family.
  - reference: PMID:40070084
    reference_title: "A comprehensive study of the sperm head defects in MMAF condition and their impact on embryo development in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Sperm from all KO lines exhibited a marked decrease in supporting embryo development compared to the wild-type, with developmental failure rates ranked as follows: Ccdc146 > Cfap43 > Armc2 > Cfap44-deficient sperm."
    explanation: >-
      In mice, ICSI with Cfap43-deficient sperm gives poorer embryo
      development than wild-type sperm, a possible limit not yet seen in
      patients.

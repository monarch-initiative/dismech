- name: Sperm Axonemal Disorganization
  description: >-
    Most flagellar cross-sections lack the central pair (9+0), the central
    pair is misoriented when present, peripheral doublets are displaced, and
    fibrous sheaths are hypertrophic. Central-pair (SPAG6) staining is absent
    and radial-spoke (RSPH1) staining is diffuse in patient sperm.

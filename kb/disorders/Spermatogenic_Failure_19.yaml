- hypothesis_group_id: cfap43_cfap44_tether
  hypothesis_label: CFAP43 acts with its paralog CFAP44 in the I1 dynein tether/tether-head complex
  status: CANONICAL
  description: >-
    CFAP43 and CFAP44 are WD-repeat paralogs that interact and form the
    heterodimeric T/TH complex of the I1 inner dynein arm in ciliates.
    Biallelic loss of either gene gives the same MMAF phenotype in men and
    mice, consistent with a shared complex. In T. brucei, however, knockdown
    of one protein does not displace the other.
  evidence:
  - reference: PMID:29687140
    reference_title: "Ciliary proteins Fap43 and Fap44 interact with each other and are essential for proper cilia and flagella beating."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we provide evidence of a novel ciliary complex composed of two conserved WD-repeat proteins, Fap43p and Fap44p."
    explanation: The two orthologs interact in Tetrahymena.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no significant difference between the three groups (Table 1) as illustrated by the similar morphologies of sperm from patient P43-8 and P44-3, mutated for CFAP43 and CFAP44, respectively"
    explanation: CFAP43 and CFAP44 patients have indistinguishable semen phenotypes.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of TbCFAP43 by RNAi did not alter the amount and localization of TbCFAP44; conversely, inactivation of TbCFAP44 had no impact on TbCFAP43 protein"
    explanation: In trypanosomes the two proteins do not depend on each other for localization.

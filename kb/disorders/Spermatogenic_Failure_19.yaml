name: Spermatogenic Failure 19
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF19
- spermatogenic failure 19
- CFAP43-related multiple morphological abnormalities of the sperm flagella
- CFAP43-related MMAF
description: >-
  Spermatogenic failure 19 (SPGF19) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP43 (formerly WDR96),
  which encodes a WD-repeat cilia- and flagella-associated protein. In the
  axoneme of motile cilia and flagella, CFAP43 and its paralog CFAP44 form the
  heterodimeric tether/tether-head complex that anchors the motor domains of
  the regulatory I1 inner dynein arm to the doublet microtubule; in
  Trypanosoma the two proteins sit next to doublets 5 and 6. CFAP43 is
  expressed predominantly in the testis.

  Affected men have asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): absent, short, coiled, bent and
  irregular-caliber flagella, with essentially no progressive motility.
  Electron microscopy shows a missing central pair (9+0) in most flagella,
  disorganized peripheral doublets and hyperplastic fibrous sheaths. Cfap43
  knockout mice reproduce MMAF and also show defective intra-manchette
  transport during spermiogenesis. Most patients have no respiratory disease,
  but one family with a homozygous missense variant had chronic sinusitis and
  wet cough, and knockout mice have impaired tracheal ciliary function and
  hydrocephalus, so a motile-cilia component is possible. Intracytoplasmic
  sperm injection (ICSI) gives good fertilization and pregnancy rates.
disease_term:
  preferred_term: spermatogenic failure 19
  term:
    id: MONDO:0054723
    label: spermatogenic failure 19
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 617592. ClinGen classifies
  CFAP43 in SPGF19 as Definitive (2022). ClinGen curates two further CFAP43
  pairs as separate disease entities: primary ciliary dyskinesia (Limited,
  2026), based on the one family with MMAF and chronic respiratory symptoms
  that is also recorded here, and autosomal dominant normal-pressure
  hydrocephalus (Disputed, 2026), based on one Japanese family heterozygous
  for p.Trp1502Ter (PMID:31004071). The NPH family and a heterozygous carrier
  with respiratory symptoms after haematopoietic cell transplantation
  (PMID:39572557) are monoallelic, did not have fertility assessed, and are
  not part of this entry. No GeneReviews chapter covers the disorder.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP43 variants: homozygous variants in
    consanguineous North African, Middle Eastern, Pakistani, Palestinian and
    Chinese families, and compound heterozygous variants in
    non-consanguineous Han Chinese and French probands. Parents are
    heterozygous carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28552195
    reference_title: "Biallelic Mutations in CFAP43 and CFAP44 Cause Male Infertility with Multiple Morphological Abnormalities of the Sperm Flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of these recessive mutations were parentally inherited from heterozygous carriers but were absent in 984 individuals from three Han Chinese control populations."
    explanation: Compound heterozygous CFAP43 variants inherited from carrier parents.
  - reference: PMID:34100391
    reference_title: "Novel biallelic loss-of-function mutations in CFAP43 cause multiple morphological abnormalities of the sperm flagellum in Pakistani families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing further confirmed that these mutations were segregated recessively in the families with the MMAF phenotype."
    explanation: Recessive segregation in two Pakistani families.
pathophysiology:
- name: Loss of the CFAP43 Tether Protein
  description: >-
    Nonsense, frameshift, splice-site, multi-exon deletion and some missense
    alleles abolish or sharply reduce CFAP43. Patient sperm show low CFAP43
    mRNA and absent or reduced CFAP43 protein in the flagellum, and splice
    alleles cause exon skipping. CFAP43 is one half of the tether/tether-head
    (T/TH) complex, which in ciliates links the I1 inner dynein arm motor
    domains to the A-tubule of the doublet microtubule; loss of this binding
    function is inferred from the orthologous complex.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP43
    term:
      id: hgnc:26684
      label: CFAP43
  molecular_functions:
  - preferred_term: dynein complex binding
    modifier: DECREASED
    term:
      id: GO:0070840
      label: dynein complex binding
  cellular_components:
  - preferred_term: Axoneme
    term:
      id: GO:0005930
      label: axoneme
  downstream:
  - target: Sperm Axonemal Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Without CFAP43 the sperm axoneme loses its central pair and its doublet
      arrangement. How loss of a dynein tether leads to this wider collapse is
      not established; the T. brucei localization between doublets 5-6 and
      the paraflagellar rod suggests a link between the axoneme and
      peri-axonemal structures.
    evidence:
    - reference: PMID:29449551
      reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In CFAP43-mutated and CFAP44-mutated patients, approximately 95% of the cross-sections were abnormal and the main defect observed was the absence of the CPC (9+0 conformation) observed in 81.8, and 66.7% of the cases, respectively, compared to 0% in control fertile subject"
      explanation: Loss of CFAP43 is accompanied by central-pair loss in patient sperm.
  - target: Defective Intra-Manchette Transport
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Shown in Cfap43-deficient mice; not studied in patients.
    evidence:
    - reference: PMID:33046149
      reference_title: "CFAP43-mediated intra-manchette transport is required for sperm head shaping and flagella formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Furthermore, both abnormal manchette and disorganized ectoplasmic specialization (ES) could be observed at the elongated spermatids in Cfap43-deficient mice."
      explanation: Manchette defects in knockout spermatids.
  - target: Airway Motile Cilia Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cfap43_motile_cilia_involvement
    description: >-
      Shown in Cfap43 knockout mice and Xenopus; in patients suggested by a
      single family with chronic respiratory symptoms.
    evidence:
    - reference: PMID:31884020
      reference_title: "CFAP43 modulates ciliary beating in mouse and Xenopus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "CFAP43 is involved in the regulation of the beating frequency of tracheal cilia and loss of CFAP43 causes severe mucus accumulation in the nasal cavity."
      explanation: Loss of Cfap43 impairs airway ciliary function in mice.
  evidence:
  - reference: PMID:30904354
    reference_title: "NovelCFAP43 andCFAP44 mutations cause male infertility with multiple morphological abnormalities of the sperm flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence analysis of CFAP43 showed the protein was absent in the sperm flagella of patients 1 and 9."
    explanation: CFAP43 protein is lost from patient flagella.
  - reference: PMID:29277146
    reference_title: "Novel Mutations in CFAP44 and CFAP43 Cause Multiple Morphological Abnormalities of the Sperm Flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence analysis of CFAP43 showed lower CFAP43 protein expression levels in P6 than in the normal control."
    explanation: Reduced CFAP43 protein with a splice-acceptor deletion.
  - reference: PMID:32207550
    reference_title: "Mutational effect of human CFAP43 splice-site variant causing multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, using a minigene assay, we demonstrated that the c.3661-2delA variant may cause exon-30 to be skipped, thus generating the p.E1221_K1256del protein."
    explanation: A splice allele causes in-frame exon skipping.
  - reference: PMID:29514928
    reference_title: "The I1 dynein-associated tether and tether head complex is a conserved regulator of ciliary motility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The tether and tether head (T/TH) complex was hypothesized to provide mechanical feedback during ciliary beating because it links the motor domains of the regulatory I1 dynein to the ciliary doublet microtubule."
    explanation: >-
      Cryo-electron tomography of ciliate axonemes identifies FAP43 and FAP44
      as the T/TH complex that binds the I1 dynein motor domains; the binding
      function of human CFAP43 is inferred from this ortholog.
  - reference: PMID:29514928
    reference_title: "The I1 dynein-associated tether and tether head complex is a conserved regulator of ciliary motility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "WT-mutant comparisons revealed that the heterodimeric T/TH complex is required for the positional stability of the I1 dynein motor domains, stable anchoring of CK1 kinase, and proper phosphorylation of the regulatory IC138-subunit."
    explanation: Mutants lacking the complex lose stable positioning of the I1 dynein motor domains.
  - reference: PMID:29449551
    reference_title: "Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects in Trypanosoma and human."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Immunoelectron and stimulated-emission-depletion microscopy performed on CFAP43 and CFAP44 orthologs in Trypanosoma brucei evidenced that both proteins are located between the doublet microtubules 5 and 6 and the paraflagellar rod."
    explanation: Localization of the trypanosome ortholog to a specific subset of doublets.
- name: Partial CFAP43 Loss from Missense Alleles
  description: >-
    Most CFAP43 alleles are truncating. A minority of patients carry
    missense alleles, homozygous or in trans with a truncating allele. One
    compound heterozygous patient with p.Val347Ala had a milder semen
    phenotype than patients with homozygous truncating alleles, but a
    Palestinian family homozygous for p.Trp141Arg had complete
    asthenozoospermia. Whether missense alleles are hypomorphic is
    unresolved, and none has been tested functionally.
  biological_scale: MOLECULAR

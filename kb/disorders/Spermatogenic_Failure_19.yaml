diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis. Probands are identified by exome sequencing or
    MMAF gene panels with Sanger confirmation; copy-number analysis can be
    needed, as one allele was a 3.3-kb intragenic deletion. MMAF is
    genetically heterogeneous, and DNAH1, CFAP43 and CFAP44 together explain

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study expands the spectrum of pathogenic CFAP43 mutations and provides valuable insights for genetic counseling and personalized reproductive strategies in patients with MMAF."
    explanation: The authors name genetic counselling as an application of the diagnosis.
  - reference: PMID:36960497
    reference_title: "Patients with MMAF induced by novel biallelic CFAP43 mutations have good fertility outcomes after intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study significantly expands the mutant spectrum of CFAP43 , and together with the available information regarding male infertility and MMAF, provides new information for the genetic diagnosis and counseling of MMAF in the future."

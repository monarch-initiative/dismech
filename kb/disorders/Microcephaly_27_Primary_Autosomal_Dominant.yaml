animal_models:
- name: Lmnb2 knockout mouse
  species: Mouse
  genotype: Lmnb2 -/- (lacZ insertion in exon 1)
  publication: PMID:20145110
  description: >-
    Lamin B2-null mice die shortly after birth with a lissencephaly-like
    neuronal layering defect in the cerebral cortex and cerebellum caused by
    defective neuronal migration, while brain size at birth is nearly normal.
  modeled_mechanisms:
  - target: Reduced Cortical Neuron Output
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The constitutive null does not reproduce congenital microcephaly; its
      dominant brain phenotype is a neuronal migration defect that human
      MCPH27 imaging does not show.
    limitations: >-
      A homozygous null allele, whereas MCPH27 is caused by heterozygous
      missense variants proposed to act dominantly on lamin assembly;
      heterozygous Lmnb2+/- mice are phenotypically normal. The model is closer
      to the biallelic loss-of-function human phenotype (PMID:40011009).
    evidence:
    - reference: PMID:20145110
      reference_title: Abnormal development of the cerebral cortex and cerebellum in the setting of lamin B2 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The brain was nearly normal in size
      explanation: Lamin B2-null embryos have a nearly normal brain size, unlike the severe congenital microcephaly of MCPH27.
- name: Forebrain-specific Lmnb2 knockout mouse (Emx1-Cre Lmnb2fl/fl)
  species: Mouse
  genotype: Emx1-Cre Lmnb2 fl/fl
  publication: PMID:21976703
  description: >-
    Conditional deletion of Lmnb2 in the forebrain gives a small forebrain
    with fewer cortical neurons and disorganized neuronal layering in adult
    mice.
  modeled_mechanisms:
  - target: Reduced Cortical Neuron Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces reduced cortical neuron number and small forebrain, the
      tissue-level outcome of MCPH27.
    limitations: >-
      A conditional null rather than a dominant missense allele, and the mice
      also have disorganized neuronal layering, which MCPH27 patients do not
      show on imaging.
    evidence:
    - reference: PMID:21976703
      reference_title: Deficiencies in lamin B1 and lamin B2 cause neurodevelopmental defects and distinct nuclear shape abnormalities in neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The forebrain-specific Lmnb1- and Lmnb2-knockout models had a small
        forebrain with disorganized layering of neurons and nuclear shape

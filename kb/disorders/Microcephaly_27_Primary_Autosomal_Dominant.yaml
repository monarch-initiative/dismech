- name: Neural Progenitor Nuclear Fragility and Cell Death
  description: >-
    The reporting authors propose that LMNB2 variants alter the physical
    properties of lamin filaments, making the nuclei of neural progenitors
    fragile under the mechanical stresses of interkinetic nuclear migration
    and neuronal migration and increasing cell death during brain development.
    The proposal rests on the analogous LMNA variant producing fragile nuclei;
    increased apoptosis in the cortex has been observed in lamin B2-null mouse
    embryos, but not with the human variants.

name: Microcephaly 27, Primary, Autosomal Dominant
creation_date: "2026-10-15T15:45:00Z"
category: Mendelian
disease_term:
  preferred_term: microcephaly 27, primary, autosomal dominant
  term:
    id: MONDO:0030929
    label: microcephaly 27, primary, autosomal dominant
synonyms:
- MCPH27
- LMNB2-related primary microcephaly
description: >-
  Microcephaly 27, primary, autosomal dominant (MCPH27) is a severe congenital
  primary microcephaly caused by heterozygous, usually de novo, missense
  variants in LMNB2, which encodes the B-type nuclear lamin lamin B2. It was
  defined together with the LMNB1 form (MCPH26) as a lamin B-associated
  laminopathy. Affected individuals have severe microcephaly present from birth
  without intrauterine growth restriction or major malformations, global
  developmental delay of variable severity, and, in a minority, seizures;
  neuroimaging shows a small, structurally normal brain, sometimes with a
  simplified gyral pattern and reduced white matter, and no neuronal migration
  defect. The reported variants (recurrent p.Glu398Lys and p.Asn54His) alter
  conserved residues at dimer interfaces of the lamin coiled-coil rod and are
  proposed to act dominantly on lamin filament assembly; transfected variant
  lamin B2 forms nuclear aggregates and distorts nuclear shape. How a defective
  nuclear lamina reduces cortical neuron output is not established: disrupted
  spindle orientation in neural progenitors and mechanical fragility of
  progenitor nuclei are the two hypotheses proposed.
parents:
- autosomal dominant primary microcephaly
references:
- reference: PMID:33033404
  title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
- reference: PMID:20145110
  title: Abnormal development of the cerebral cortex and cerebellum in the setting of lamin B2 deficiency.
- reference: PMID:21976703
  title: Deficiencies in lamin B1 and lamin B2 cause neurodevelopmental defects and distinct nuclear shape abnormalities in neurons.
- reference: PMID:22116031
  title: Mouse B-type lamins are required for proper organogenesis but not by embryonic stem cells.
- reference: PMID:40011009
  title: Homozygous loss of function variant in LMNB2 gene causes major brain malformation and perinatal death.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous LMNB2 missense variants, de novo in most reported cases. In
    one family the variant was transmitted from a clinically unaffected mother
    who was mosaic for it, so parental mosaicism is a recurrence-risk
    consideration; this is parental mosaicism and is not bound to HP:0001442.
  evidence:
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For cases P4, P5, and P12, the variant was established to be de novo,
      while in P7, it had been inherited from the proband's mosaic, clinically
      unaffected, mother
    explanation: >-
      De novo heterozygous LMNB2 p.Glu398Lys in three probands and transmission
      from a mosaic parent in a fourth support dominant inheritance with
      parental mosaicism as a recurrence route.
mechanistic_hypotheses:
- hypothesis_group_id: lamin_b_progenitor_spindle_orientation
  hypothesis_label: Lamin B Spindle-Orientation Defect in Neural Progenitors
  status: EMERGING
  description: >-
    B-type lamins associate with the mitotic spindle, and mice lacking B-type
    lamins show spindle-orientation defects in neural progenitors. The
    hypothesis is that dominant LMNB2 variants perturb progenitor division in
    the same way, depleting the progenitor pool and reducing neuron output. It
    has not been tested with the human variants.
- hypothesis_group_id: lamin_b_progenitor_nuclear_fragility
  hypothesis_label: Nuclear Fragility of Neural Progenitors
  status: EMERGING
  description: >-
    A lamina built partly from assembly-defective lamin B2 may leave progenitor
    and migrating-neuron nuclei mechanically fragile, so that the stresses of
    interkinetic nuclear migration and neuronal migration increase cell death
    during cortical development. Proposed by analogy to LMNA variants; not
    tested with LMNB2 variants.
pathophysiology:
- name: LMNB2 Rod-Domain Missense Variant Disrupting Lamin B2 Dimer Assembly
  description: >-
    Heterozygous missense variants alter conserved residues in coiled-coil
    segments of the lamin B2 alpha-helical rod: Asn54 at the coil 1A intradimer
    interface and Glu398 at the coil 2B intradimer interface. Glu398 normally
    repels the Glu398 of the partner chain; the p.Glu398Lys substitution is
    predicted by structural modeling on lamin A/C structures to aberrantly
    stabilize mixed mutant/wild-type dimers. The variants are proposed to act
    dominantly on assembly of the lamin B2 filament that forms part of the
    nuclear lamina, rather than by haploinsufficiency.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Recurrent de novo missense variants at specific residues and the absence
      of truncating variants led the reporting authors to favor a dominant
      negative mechanism (with gain of function not excluded) over
      haploinsufficiency. This is an inference from the variant spectrum and
      structural modeling, not a measured effect on endogenous lamin B2.
  genes:
  - preferred_term: LMNB2
    term:
      id: hgnc:6638
      label: LMNB2
  molecular_functions:

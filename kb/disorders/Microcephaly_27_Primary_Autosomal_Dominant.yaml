      the Lmnb1+/- mouse.
    explanation: >-
      The reporting authors' interpretation of the variant spectrum favors a
      dominant negative rather than haploinsufficient mechanism.
    directness: INDIRECT
  downstream:
  - target: Nuclear Lamina Assembly Defect with Lamin Aggregates
    description: >-
      Assembly-defective lamin B2 is incorporated into the lamina and disrupts
      its higher-order organization.
- name: Nuclear Lamina Assembly Defect with Lamin Aggregates
  description: >-
    Cells expressing GFP-tagged lamin B2 carrying the microcephaly variants

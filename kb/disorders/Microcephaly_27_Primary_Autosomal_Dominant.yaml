      explanation: Forebrain loss of lamin B2 reduces forebrain size, the outcome modeled by this link.
discussions:
- discussion_id: mcph27_null_mouse_versus_dominant_missense
  prompt: >-
    Do the brain phenotypes of lamin B2-null mice, which center on neuronal
    migration, tell us anything about how heterozygous dominant LMNB2 missense
    variants cause microcephaly without a migration defect?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neural Progenitor Spindle Misorientation
  - pathophysiology#Neural Progenitor Nuclear Fragility and Cell Death
  - pathophysiology#Reduced Cortical Neuron Output
  rationale: >-
    Every mechanistic step below the lamina defect is supported only by null
    or double-null mice. Those mice show cortical layering and migration
    defects, and the constitutive Lmnb2 null has a nearly normal brain size,
    while patients with MCPH27 have severe congenital microcephaly with no
    migration defect. The reporting authors attribute the difference to the
    human variants acting dominantly rather than through loss of lamin B2.
    No heterozygous knock-in of a patient variant and no patient-derived
    neural cell or organoid model has been reported, so which of the proposed
    progenitor mechanisms operates in MCPH27 is unknown.
  evidence:
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      there were neuronal migration defects resulting in abnormal layering of
      the cerebral cortex,18 suggesting potential discordance with the human
      phenotype and neuroimaging findings
    explanation: The reporting authors identify the discordance between the knockout mouse brain phenotype and the human disease.
notes: >-
  Phenotype frequencies come from the founding report, which pools six LMNB2
  and seven LMNB1 individuals; per-gene detail is in its supplementary tables.
  LMNB1-related microcephaly (MCPH26) has the same clinical picture but is a
  separate MONDO disease and is not covered here. The molecular function
  binding GO:0160123 (structural constituent of nuclear lamina) is the GO
  term for the activity of a lamina structural protein; current QuickGO
  annotation of human LMNB2 (UniProt Q03252) carries the broader
  phylogenetically inferred GO:0005200 (structural constituent of
  cytoskeleton).

      individuals, the human genetic basis of the upstream lesion.
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Therefore the heterozygous LMNB2 p.Glu398Lys substitution would result in
      a subset of mismatched dimers in which, instead, interaction of the two
      chains would be aberrantly stabilized
    explanation: >-
      Structural modeling on homologous lamin A/C structures predicts that the
      recurrent variant aberrantly stabilizes mutant/wild-type dimers, the
      basis for a dominant effect on filament assembly.
    directness: INDIRECT
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

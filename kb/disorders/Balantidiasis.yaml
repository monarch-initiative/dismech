name: Balantidiasis
creation_date: '2026-11-14T08:30:23Z'
synonyms:
- balantidiosis
- Balantidium coli infection
- Balantioides coli infection
category: Infectious Disease
description: >-
  Balantidiasis is a fecal-oral zoonotic ciliate infection caused by
  Balantioides coli, historically called Balantidium coli. People acquire
  infection by ingesting cysts in water or food contaminated by human or
  porcine feces. Most infections are intestinal and may be asymptomatic, but
  trophozoites can colonize the cecum and colon and invade the colonic mucosa,
  producing intermittent diarrhea, dysentery, colitis with ulcerative colonic
  lesions, tenesmus, and rarely severe intestinal perforation.
disease_term:
  term:
    id: MONDO:0005662
    label: balantidiasis
  preferred_term: Balantidiasis
parents:
- Ciliophora infectious disease
- Parasitic intestinal disorder
- Protozoa infectious disease
infectious_agent:
- name: Balantioides coli
  infectious_agent_term:
    preferred_term: Balantioides coli
    term:
      id: NCBITaxon:71585
      label: Balantioides coli
  description: >-
    Ciliated intestinal protozoan, historically Balantidium coli and also
    Neobalantidium coli, that is the only ciliate currently confirmed to
    parasitize humans.
  evidence:
  - reference: PMID:33183780
    reference_title: "Balantioides coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantioides coli (=Balantidium coli) is the only ciliate that
      parasitizes humans. Pigs are the main reservoir.
    explanation: >-
      The current review names Balantioides coli, gives Balantidium coli as its
      synonym, and identifies pigs as the main reservoir.
agent_life_cycle:
  description: >-
    Balantioides coli has a direct cyst-trophozoite life cycle. Trophozoites
    inhabit the large intestine of infected hosts and encyst in the colon or
    rectum; cysts shed in feces can survive environmental stress long enough to
    contaminate water or food and infect another susceptible host after
    ingestion. Pigs are the main zoonotic reservoir, and humans are susceptible
    intestinal hosts.
  hosts:
  - preferred_term: domestic pig and wild boar
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
    role: reservoir host
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: susceptible host
  life_cycle_stages:
  - name: Environmental infective cyst
    description: >-
      Thick-walled cysts are shed in formed feces and transmit infection after
      they contaminate food or water and are ingested by another host.
    evidence:
    - reference: PMID:18854484
      reference_title: "Current world status of Balantidium coli."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The cyst of Balantidium is the transmissive stage of the organism.
        Because of its thickened wall, it is protected from desiccation and
        other environmental stress
      explanation: >-
        This review identifies the cyst as the transmissive and
        environmentally protected life-cycle stage.
  - name: Intestinal trophozoite
    life_cycle_stage_term:
      preferred_term: trophozoite stage
      term:
        id: OPL:0000057
        label: trophozoite stage
    description: >-
      Vegetative trophozoites inhabit the host intestine, multiply there, and
      can invade the cecal and colonic mucosa.
    evidence:
    - reference: PMID:35146143
      reference_title: "Cyst detection and viability assessment of Balantioides coli in environmental samples: Current status and future needs."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The parasite has a direct life cycle, with a vegetative form, the
        trophozoite, inhabiting the host intestine, and a resting cyst that is
        released into the environment in faeces.
      explanation: >-
        The review identifies the trophozoite and cyst as the core stages in
        the direct life cycle.
  evidence:
  - reference: PMID:35146143
    reference_title: "Cyst detection and viability assessment of Balantioides coli in environmental samples: Current status and future needs."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The parasite has a direct life cycle, with a vegetative form, the
      trophozoite, inhabiting the host intestine, and a resting cyst that is
      released into the environment in faeces.
    explanation: >-
      Supports the direct trophozoite-cyst life-cycle framing.
  - reference: PMID:33183780
    reference_title: "Balantioides coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pigs are the main reservoir. Other species, as camels, cattle, donkey,
      sheep and goat have been also proposed as reservoirs for human infections.
    explanation: >-
      Supports pig-centered reservoir ecology while noting other proposed
      mammalian reservoirs.
transmission:
- name: Fecal-oral cyst ingestion through contaminated food or water
  description: >-
    Humans acquire balantidiasis by ingesting infective B. coli cysts from food
    or water contaminated with feces from infected pigs or humans.
  evidence:
  - reference: PMID:35146143
    reference_title: "Cyst detection and viability assessment of Balantioides coli in environmental samples: Current status and future needs."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission is via the faecal-oral route through contaminated food and
      water. Only cysts are considered capable of infecting new hosts
    explanation: >-
      The review describes contaminated food and water as the fecal-oral
      transmission route and identifies cysts as the infective stage.
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pigs pass Balantidium cysts in their feces, which can contaminate wells
      and groundwaters, serving as a vehicle for transmission of parasites.
    explanation: >-
      The older review connects pig fecal cyst shedding to water contamination
      that can transmit infection.
epidemiology:
- name: Pig contact and poor sanitation
  description: >-
    Close contact with pigs and fecal contamination of water, wastewater, and
    food pathways are the central epidemiologic risks for human balantidiasis.
  factors:
  - close contact with pigs
  - inadequate water supply
  - inadequate wastewater disposal
  - poor hygiene
  evidence:
  - reference: PMID:33183780
    reference_title: "Balantioides coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main epidemiological factors involved in the transmission of this
      parasite include close contact with pigs, lack of basic sanitation
      infrastructures (water supply, wastewater disposal) and hygiene.
    explanation: >-
      The review lists pig proximity and sanitation infrastructure as major
      transmission factors.
  - reference: PMID:34339668
    reference_title: "Balantidiasis in humans: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A significant association (p < 0.05) was identified between proximity to
      pigs and positivity for B. coli, since more than 16% infected people were
      in proximity with pigs and/or their excreta.
    explanation: >-
      The human systematic review found a significant association between pig
      proximity and B. coli positivity.
prevalence:
- population: Human balantidiasis literature through 2020
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A 103-article systematic review found 997 people potentially infected with
    B. coli across 75 clinical case-report articles and 28 epidemiologic
    studies, but the review reported high heterogeneity and incomplete source
    information, so this record should be read as a literature summary rather
    than a global prevalence estimate.
  evidence:
  - reference: PMID:34339668
    reference_title: "Balantidiasis in humans: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A total of 103 articles were eligible and included in this review. Out of
      these 103 articles, 75 were clinical case reports and 28 were
      epidemiological studies, indicating a frequency of 997 (3.98%) people
      potentially infected with B. coli.
    explanation: >-
      Summarizes the case volume captured by the systematic review without
      treating the heterogeneous literature pool as a population prevalence
      estimate.
progression:
- phase: Asymptomatic intestinal carriage
  notes: >-
    B. coli can inhabit the large bowel without symptoms while the host still
    carries transmissible intestinal infection.
  evidence:
  - reference: PMID:33183780
    reference_title: "Balantioides coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantioides coli infections can be asymptomatic and symptomatic, which
      can be chronic (with intermittent diarrhoea), or acute (a dysenteric form
      which can be life-threatening).
    explanation: >-
      Supports an asymptomatic infection phase distinct from chronic or acute
      symptomatic intestinal disease.
- phase: Chronic intermittent diarrhea
  notes: >-
    Symptomatic intestinal balantidiasis can persist as a chronic intermittent
    diarrheal syndrome.
  evidence:
  - reference: PMID:33183780
    reference_title: "Balantioides coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantioides coli infections can be asymptomatic and symptomatic, which
      can be chronic (with intermittent diarrhoea), or acute (a dysenteric form
      which can be life-threatening).
    explanation: >-
      Supports a chronic symptomatic form marked by intermittent diarrhea.
- phase: Acute dysenteric disease
  notes: >-
    Acute symptomatic balantidiasis can present as severe dysentery and
    life-threatening ulcerative colitis.
  evidence:
  - reference: PMID:33183780
    reference_title: "Balantioides coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantioides coli infections can be asymptomatic and symptomatic, which
      can be chronic (with intermittent diarrhoea), or acute (a dysenteric form
      which can be life-threatening).
    explanation: >-
      Supports an acute dysenteric symptomatic phase.
pathophysiology:
- name: Ingestion of Infective Balantioides Cysts
  biological_scale: ORGANISM
  description: >-
    Thick-walled Balantioides cysts ingested in fecally contaminated food or
    water survive outside the host and initiate infection without an
    intermediate host.
  downstream:
  - target: Intestinal Trophozoite Colonization
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantidium has a simple life cycle, as follows: dormant cyst to
      trophozoite and trophozoite to cyst. Transmission is direct, from a
      contaminated water or food supply to humans
    explanation: >-
      Supports ingested cysts from contaminated food or water as the initiating
      stage in the direct life cycle.
- name: Intestinal Trophozoite Colonization
  biological_scale: TISSUE
  description: >-
    After cyst ingestion and excystation, trophozoites occupy the cecum and
    colon. Many hosts remain asymptomatic, but a trophozoite population in the
    large bowel can progress to tissue invasion and symptomatic colitis.
  locations:
  - preferred_term: large intestine
    term:
      id: UBERON:0000059
      label: large intestine
  downstream:
  - target: Colonic Mucosal Invasion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantidium's habitats in humans are the cecum and colon. Humans may
      remain asymptomatic, as does the pig, or may develop dysentery similar to
      that caused by Entamoeba histolytica.
    explanation: >-
      The review places the human trophozoite habitat in the cecum and colon
      and links colonization to either asymptomatic carriage or dysenteric
      disease.
- name: Colonic Mucosal Invasion
  biological_scale: TISSUE
  description: >-
    Balantioides trophozoites invade the colonic mucosa and submucosa and form
    flask-shaped nests. Chronic invasion can present with nonbloody diarrhea,
    cramping, halitosis, and abdominal pain and can progress to colonic
    ulceration.
  locations:
  - preferred_term: colonic mucosa
    term:
      id: UBERON:0000317
      label: colonic mucosa
  downstream:
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Abdominal Pain
    causal_link_type: DIRECT
  - target: Hyaluronidase-Associated Colonic Ulceration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The ciliates produce flask-shaped lesions in the submucosa, where they
      form clusters called nides or nests (4).
    explanation: >-
      The review describes submucosal nest formation as the invasive lesion
      produced by Balantidium trophozoites.
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      chronic infection that presents with nonbloody diarrhea, cramping,
      halitosis, and abdominal pain secondary to trophozoite invasion of the
      large intestine
    explanation: >-
      Supports chronic diarrhea and abdominal pain as consequences of large-bowel
      trophozoite invasion.
- name: Hyaluronidase-Associated Colonic Ulceration
  biological_scale: TISSUE
  description: >-
    Invasive trophozoites can erode the colonic wall and form ulcers.
    Hyaluronidase activity has been reported and may weaken hyaluronic
    acid-containing epithelial adhesion, although bacterial co-factors and
    parasite virulence differences also appear to modify tissue destruction.
  locations:
  - preferred_term: colonic mucosa
    term:
      id: UBERON:0000317
      label: colonic mucosa
  downstream:
  - target: Colitis
    causal_link_type: DIRECT
  - target: Bloody Diarrhea
    causal_link_type: DIRECT
  - target: Tenesmus
    causal_link_type: DIRECT
  - target: Intestinal Perforation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Balantidia produce no known toxins, but their ability to produce
      ulceration of the colon wall is attributed to hyaluronidase, an enzyme
      that digests hyaluronic acid
    explanation: >-
      Supports hyaluronidase activity as a proposed contributor to colon-wall
      ulceration while the node description preserves the review's stated
      uncertainty.

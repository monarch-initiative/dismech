diagnosis:
- name: Stool microscopy for Balantioides trophozoites or cysts
  description: >-
    Direct microscopic examination of fresh or preserved stool can detect the
    large ciliated trophozoites in diarrheic stools or cysts in formed stools.
    Repeated sampling can improve recovery because shedding may be erratic.
  diagnosis_term:
    preferred_term: Microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  evidence:
  - reference: PMID:18854484
    reference_title: "Current world status of Balantidium coli."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Because of their large size and spiraling motility, balantidia can
      readily be recognized in wet mount slide preparations, even at a low
      magnification (×100).
    explanation: >-
      Supports stool wet-mount microscopy as a practical way to recognize
      Balantidium trophozoites.
  - reference: PMID:35734242
    reference_title: "Neglected Case of Human Balantidiasis: Presumed as Antibiotic-Associated Diarrhoea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The received stool specimen was watery and contained blood and mucus.
      Immediately after receiving the sample, routine stool microscopy was
      performed which revealed the presence of cysts and actively motile
      trophozoites
    explanation: >-
      A contemporary human case was diagnosed by immediate routine stool
      microscopy showing B. coli cysts and motile trophozoites.
- name: Colonoscopy with biopsy or fresh tissue microscopy
  description: >-
    Colonoscopy can reveal colitis or ulcers when stool testing has not
    established the diagnosis; fresh endoscopic samples or tissue biopsy can
    demonstrate trophozoites in the colonic lesion.
  diagnosis_term:
    preferred_term: Colonoscopy
    term:
      id: NCIT:C16450
      label: Colonoscopy
  evidence:
  - reference: PMID:31688855
    reference_title: "[Colonic balantidiasis: report of a fatal case and review of the literature]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Colonoscopy was performed due to suspicion of infectious colitis,
      Balantidium coli trophozoites were found in the fresh sample and colonic
      tissue biopsy.
    explanation: >-
      The fatal colitis case used colonoscopy, a fresh sample, and colonic
      tissue biopsy to identify trophozoites.

transmission:
- name: Swallowed infected sputum
  description: >-
    Patients with pulmonary tuberculosis swallow bacilli in their sputum,
    which invade the intestinal epithelium, above all in lymphoid-rich
    terminal ileum.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These routes of acquisition include swallowing of contaminated
      respiratory tract secretions, hematogenous spread from active pulmonary
      infection, contiguous spread from adjacent infected viscera or lymph
      nodes, and uncommonly ingestion of contaminated unpasteurized dairy
      products
    explanation: >-
      A review lists the four routes by which bacilli reach the
      gastrointestinal tract.
- name: Hematogenous spread from a pulmonary focus
  description: >-
    Bacilli carried in the blood from active or past pulmonary infection
    seed the bowel wall.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These routes of acquisition include swallowing of contaminated
      respiratory tract secretions, hematogenous spread from active pulmonary
      infection, contiguous spread from adjacent infected viscera or lymph
      nodes, and uncommonly ingestion of contaminated unpasteurized dairy
      products
    explanation: >-
      Names hematogenous spread from the lung as a route.
- name: Contiguous spread from adjacent lymph nodes or viscera
  description: >-
    Tuberculous mesenteric lymph nodes or adjacent infected organs extend
    directly into the bowel wall.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alternative routes of infection include ingestion of bacilli with
      subsequent passage to mesenteric lymph nodes through the Peyer's patches
      in intestinal mucosa as well as contiguous spread from infected lymph
      nodes, ileocecal TB, or genitourinary TB.
    explanation: >-
      A review names contiguous spread from infected nodes among the routes
      of abdominal tuberculosis.
- name: Foodborne Mycobacterium bovis acquisition from unpasteurized dairy
  description: >-
    Uncommonly, M. bovis is ingested in unpasteurized milk or dairy products
    and enters through the intestinal mucosa.
  evidence:
  - reference: PMID:15253472
    reference_title: "Molecular and histopathologic evidence for systemic infection by Mycobacterium bovis in a patient with tuberculous enteritis, peritonitis, and meningitis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ingested M. bovis from unpasteurized deer's milk probably entered the
      mucosal macrophages of the intestine and then the draining mesenteric
      lymph nodes.
    explanation: >-
      A case report infers intestinal entry of M. bovis from unpasteurized
      milk.
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These routes of acquisition include swallowing of contaminated
      respiratory tract secretions, hematogenous spread from active pulmonary
      infection, contiguous spread from adjacent infected viscera or lymph
      nodes, and uncommonly ingestion of contaminated unpasteurized dairy
      products
    explanation: >-
      Names unpasteurized dairy as an uncommon route.
has_subtypes:
- name: Ulcerative
  display_name: Ulcerative intestinal tuberculosis
  classification: morphological_form
  description: >-
    Single or multiple mucosal ulcers, typically transverse or
    circumferential, in the jejunum, ileum and cecum. It is the commonest
    form and the one that perforates, bleeds, forms fistulas and heals into
    strictures.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ulcerative morphology predominates in 60% of cases, followed by
      ulcerohypertrophic (30%), and hypertrophic (10%)
    explanation: >-
      Relative frequency of the three morphological forms.
  - reference: PMID:26974755
    reference_title: "An Analysis of the Clinical, Endoscopic, and Pathologic Features of Intestinal Tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Endoscopic types included ulcerative (52.7%), ulcero-proliferative
      (27.3%), and proliferative (20.0%)
    explanation: >-
      Endoscopic types in an 81-patient series.
- name: Hypertrophic
  display_name: Hypertrophic intestinal tuberculosis
  classification: morphological_form
  description: >-
    Scarring, fibrosis and inflammatory pseudotumour, most often of the ileum
    and cecum, presenting as a mass or with mechanical obstruction.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hypertrophic tuberculous enteritis manifests with scarring, fibrosis,
      and psuedotumor formation, most commonly involving the ileum and cecum.
    explanation: >-
      Describes the hypertrophic form.
- name: Ulcerohypertrophic
  display_name: Ulcerohypertrophic intestinal tuberculosis
  classification: morphological_form
  description: >-
    Inflammatory pseudotumour with thickening and ulceration of the wall,
    combining the features of the other two forms.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ulcerohypertrophic tuberculous enteritis is characterized by
      inflammatory psuedotumor formation accompanied by thickening and
      ulceration of the intestinal wall.
    explanation: >-
      Describes the ulcerohypertrophic form.
prevalence:
- population: Patients with extrapulmonary tuberculosis
  measure_type: UNKNOWN
  notes: >-
    Intestinal tuberculosis is reported in about 10-11% of patients with
    extrapulmonary tuberculosis. This is a share of extrapulmonary
    tuberculosis cases, not a population prevalence or incidence, so no rate
    or band is asserted.
  evidence:
  - reference: PMID:28139494
    reference_title: "The diagnostic value of polymerase chain reaction for Mycobacterium tuberculosis to distinguish intestinal tuberculosis from crohn's disease: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      As the sixth most common presentation of extrapulmonary TB, ITB is
      observed in 11% of extrapulmonary TB patients.
    explanation: >-
      A meta-analysis introduction restating the share of extrapulmonary
      tuberculosis that is intestinal.
environmental:
- name: HIV infection and immunosuppression
  description: >-
    Gastrointestinal tuberculosis is more common in immunocompromised hosts,
    and HIV infection is cited as one reason for its resurgence, although it
    also occurs in immunocompetent people. No cached series reports the share
    of patients with HIV infection.
  influences_mechanisms:
  - target: Primary Pulmonary Tuberculous Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV-related immunosuppression increases tuberculosis, including the
      pulmonary disease from which the intestine is seeded; the cited sources
      do not establish which step it acts on.
    evidence:
    - reference: PMID:15797233
      reference_title: Spontaneous small bowel perforations due to intestinal tuberculosis should not be repaired by simple closure.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The incidence of it is rising in Western countries due to immigration
        from Third World countries and human immunodeficiency virus infection.
      explanation: >-
        A surgical case series' introduction attributing rising intestinal
        tuberculosis to HIV infection and immigration.
  evidence:
  - reference: PMID:34024445
    reference_title: Gastrointestinal and Abdominal Tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although GI TB more commonly affects immunocompromised hosts, it can
      also occur in immunocompetent people.
    explanation: >-
      A review names immunocompromise as a risk factor.
  - reference: PMID:28139494
    reference_title: "The diagnostic value of polymerase chain reaction for Mycobacterium tuberculosis to distinguish intestinal tuberculosis from crohn's disease: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      which was probably caused by the pandemic of human immunodeficiency
      virus (HIV) infection and the large wave of population migration
    explanation: >-
      Links the HIV pandemic to the increase in intestinal tuberculosis.
- name: Corticosteroid or anti-TNF therapy for presumed inflammatory bowel disease
  description: >-
    Intestinal tuberculosis misdiagnosed as Crohn disease and treated with
    corticosteroids, thiopurines or TNF inhibitors can worsen, disseminate
    and kill. Intestinal tuberculosis can also arise during immunosuppressive
    treatment of genuine inflammatory bowel disease.
  influences_mechanisms:
  - target: Caseating Granulomatous Inflammation of the Intestinal Wall
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Immunosuppression impairs granulomatous containment, so the intestinal
      infection progresses and disseminates.
    evidence:
    - reference: PMID:30918188
      reference_title: Ten Cases of Intestinal Tuberculosis Which Were Initially Misdiagnosed as Inflammatory Bowel Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The ITB patient treated with azathioprine and infliximab developed
        disseminated tuberculosis, and the patient treated with
        corticosteroids as IBD died due to respiratory failure despite the
        initiation of anti-tuberculosis treatment.
      explanation: >-
        In a series of ten misdiagnosed patients, anti-TNF therapy was
        followed by dissemination and corticosteroids by death.
    - reference: PMID:31720391
      reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This is of great importance, as initiation of immunosuppression for
        presumptive inflammatory bowel disease can lead to exacerbation or
        dissemination of TB
      explanation: >-
        A review on the consequence of immunosuppression for presumed IBD.
  evidence:
  - reference: PMID:31929918
    reference_title: "Intestinal Tuberculosis Masquerading as Crohn's Disease? A Case of Disseminated Tuberculosis after Anti-TNF Therapy for Suspected Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This patient was diagnosed with CD and treated with anti-TNF agents
      after indeterminate screening for latent tuberculosis. He was then
      admitted with septic shock and intestinal perforation due to
      disseminated tuberculosis.
    explanation: >-
      A case of septic shock and perforation from disseminated tuberculosis
      after anti-TNF therapy for presumed Crohn disease.
  - reference: PMID:30918188
    reference_title: Ten Cases of Intestinal Tuberculosis Which Were Initially Misdiagnosed as Inflammatory Bowel Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Though it is a rare condition, ITB could develop during the treatment of
      IBD with immunosuppressants
    explanation: >-
      A case series' introduction noting intestinal tuberculosis arising
      during immunosuppressive treatment of IBD.

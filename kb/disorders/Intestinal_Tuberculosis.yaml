histopathology:
- name: Caseating Granulomatous Enterocolitis
  description: >-
    Biopsies or resections show large, numerous, often confluent granulomas,
    many with caseous necrosis, predominantly in the submucosa, with ulcers
    lined by epithelioid histiocytes and disproportionate submucosal
    inflammation; acid-fast bacilli are seen in a minority.
  evidence:
  - reference: PMID:16873564
    reference_title: "Role of colonoscopic biopsy in distinguishing between Crohn's disease and intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histopathological features that seemed to reliably differentiate
      between intestinal tuberculosis and Crohn's disease included confluent
      granulomas, > or =10 granulomas per biopsy site and caseous necrosis (in
      biopsy samples of 50%, 33% and 22% of patients with intestinal
      tuberculosis, respectively, v 0% of patients with Crohn's disease).
    explanation: >-
      Confluent granulomas, many granulomas and caseation are specific for
      intestinal tuberculosis.
  - reference: PMID:26974755
    reference_title: "An Analysis of the Clinical, Endoscopic, and Pathologic Features of Intestinal Tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histopathologic findings were chronic mucosal inflammation (87.3%),
      ulceration (74.5%), lymphocytic aggregation (69.1%), and granulomatous
      fusion (58.2%). The presence of caseating granulomas (74.5%) and
      necrosis (25.5%) was helpful, but not common.
    explanation: >-
      Histological findings in 81 patients.
progression:
- phase: Seeding and mucosal invasion
  notes: >-
    Bacilli reach the ileocecal lymphoid tissue by swallowing, blood or
    contiguous spread, and invade the submucosa.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When contaminated sputum or food is ingested pathogenic bacteria
      invade through the intestinal epithelium and into the submucosa.
    explanation: >-
      Describes the invasion step.
- phase: Chronic active enterocolitis
  notes: >-
    An insidious illness over weeks to months with pain, weight loss, fever
    and altered bowel habit; diagnosis is often delayed, with a median of 13
    weeks from symptom onset in a London series.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous enteritis progresses slowly, and patients may not seek
      medical care until complications occur.
    explanation: >-
      The disease progresses slowly.
  - reference: PMID:28609809
    reference_title: "Intestinal tuberculosis: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Median time from symptom onset to ITB diagnosis was 13 weeks (IQR 3-26
      weeks).
    explanation: >-
      Diagnostic delay in 61 patients.
- phase: Complications
  notes: >-
    Untreated or late-diagnosed disease presents with obstruction,
    perforation, fistula or bleeding; strictures can also form during
    healing on treatment.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, in some cases, mucosal healing may lead to scarring and late
      onset obstruction necessitating surgical resection.
    explanation: >-
      Late obstruction from scarring after healing.
- phase: Response to treatment
  notes: >-
    Symptoms improve within weeks of antituberculous therapy and mucosal
    healing is documented by repeat colonoscopy at about six months.
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical improvement can be expected in as soon as two weeks following
      initiation of therapy, while endoscopic improvement can be seen after
      three months
    explanation: >-
      Timing of clinical and endoscopic response.
  - reference: PMID:27813111
    reference_title: "Endoscopic and clinical responses to anti-tubercular therapy can differentiate intestinal tuberculosis from Crohn's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the validation cohort, all the patients with intestinal tuberculosis
      had symptomatic response and endoscopic mucosal healing after 6 months
      of anti-tubercular therapy.
    explanation: >-
      Universal symptomatic and mucosal response at six months.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The disease is curable with six months of chemotherapy and recurrence is
    rare, but diagnosis is often delayed or wrong, complications need
    surgery, free perforation carried 25% mortality in one surgical series,
    and misdiagnosis as Crohn disease treated with immunosuppression can be
    fatal.
  evidence:
  - reference: PMID:15797233
    reference_title: Spontaneous small bowel perforations due to intestinal tuberculosis should not be repaired by simple closure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mortality rate among all patients was 25%.
    explanation: >-
      Mortality of tuberculous small bowel perforation in 12 patients.
  - reference: PMID:30918188
    reference_title: Ten Cases of Intestinal Tuberculosis Which Were Initially Misdiagnosed as Inflammatory Bowel Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      ITB patients were frequently misdiagnosed and treated as IBD, thus
      resulting in a poor clinical outcome even after finally making a correct
      diagnosis and administering appropriate treatment.
    explanation: >-
      Misdiagnosis worsens outcome.
  - reference: PMID:30338607
    reference_title: "Intestinal tuberculosis: clinico-pathological profile and the importance of a high degree of suspicion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Only 17 (20%) patients were initially diagnosed as ITB, the other 68
      patients were misdiagnosed.
    explanation: >-
      Most patients were initially misdiagnosed.
diagnosis:
- name: Ileocolonoscopy
  description: >-
    The most useful test. It shows transverse or annular ulcers, a deformed
    cecum and a patulous ileocecal valve, nodularity, pseudopolyps and
    strictures, usually in fewer than four colonic segments, and allows
    biopsy. Ileal intubation is needed because the terminal ileum is a main
    site. Colonoscopy confirmed the diagnosis in 77% of those examined in a
    London series.
  diagnosis_term:
    preferred_term: ileocolonoscopy
    term:
      id: NCIT:C16450
      label: Colonoscopy
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Endoscopy is perhaps the most useful modality and can identify ulcers,
      strictures, deformation of the cecum, ileocecal valve incompetence, and
      fistulas through direct visualization.
    explanation: >-
      Endoscopic findings and the role of endoscopy.
  - reference: PMID:28609809
    reference_title: "Intestinal tuberculosis: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Colonoscopy confirmed a diagnosis of ITB in 77% of those performed.
    explanation: >-
      Diagnostic yield of colonoscopy.
- name: Lee colonoscopic scoring system
  description: >-
    Eight colonoscopic findings are scored: anorectal lesions, longitudinal
    ulcers, aphthous ulcers and cobblestone appearance favour Crohn disease
    (+1 each), while involvement of fewer than four segments, a patulous
    ileocecal valve, transverse ulcers and scars or pseudopolyps favour
    intestinal tuberculosis (-1 each). A negative total indicates intestinal
    tuberculosis. It classified 87.5% of 88 patients correctly in its
    derivation cohort, with no validation cohort; a later study reported
    66.7% accuracy.
  evidence:
  - reference: PMID:16673312
    reference_title: "Analysis of colonoscopic findings in the differential diagnosis between intestinal tuberculosis and Crohn's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Four other parameters (involvement of fewer than four segments, a
      patulous ileocecal valve, transverse ulcers, and scars or pseudopolyps)
      were observed more frequently in patients with intestinal tuberculosis
      than in patients with Crohn's disease.
    explanation: >-
      The four colonoscopic features favouring intestinal tuberculosis.
  - reference: PMID:16673312
    reference_title: "Analysis of colonoscopic findings in the differential diagnosis between intestinal tuberculosis and Crohn's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Making these assumptions, we calculated that the diagnosis of either
      intestinal tuberculosis or Crohn's disease would have been made made
      correctly in 77 of our 88 patients (87.5 %), incorrectly in seven
      patients (8.0 %), and would not have been made in four patients (4.5
      %).
    explanation: >-
      Accuracy of the score in its derivation cohort.
  - reference: PMID:32311862
    reference_title: "Intestinal tuberculosis or Crohn's disease: a review of the diagnostic models designed to differentiate between these two gastrointestinal diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      reported the accuracy of this endoscopic model to be 66.7%.
    explanation: >-
      A review of diagnostic models reports that a 2015 study by Mao and
      colleagues found 66.7% accuracy for the Lee score.
- name: Meta-analytic Bayesian model for intestinal tuberculosis versus Crohn disease
  description: >-
    A Bayesian model built from 55 meta-analyses of 38 studies (1,589
    intestinal tuberculosis and 2,117 Crohn disease patients) combines
    clinical, endoscopic, histological, CT enterography and interferon-gamma
    release assay findings with the local pretest probability, available as
    a web application. Fever, night sweats, lung involvement, ascites,
    transverse ulcers, patulous ileocecal valve, cecal involvement,
    confluent or submucosal granulomas, lymphocyte cuffing, ulcers lined by
    histiocytes, short-segment involvement and a positive IGRA favour
    intestinal tuberculosis. Sensitivity and specificity were 90.9% and
    92.6% in a 49-patient validation cohort.
  evidence:
  - reference: PMID:28045023
    reference_title: "Meta-Analytic Bayesian Model For Differentiating Intestinal Tuberculosis from Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Findings that significantly favored ITB included fever, night sweats,
      lung involvement, and ascites; endoscopic findings of transverse ulcers,
      patulous ileocecal valve, and cecal involvement; pathological findings
      of confluent or submucosal granulomas, lymphocyte cuffing, and ulcers
      lined by histiocytes; a CTE finding of short segmental involvement; and
      a positive interferon-γ release assay.
    explanation: >-
      Pooled predictors favouring intestinal tuberculosis.
  - reference: PMID:28045023
    reference_title: "Meta-Analytic Bayesian Model For Differentiating Intestinal Tuberculosis from Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The sensitivity, specificity, and accuracy for diagnosis of ITB were
      90.9%, 92.6%, and 91.8%, respectively.
    explanation: >-
      Performance in the validation cohort.
- name: Colonoscopic biopsy histopathology
  description: >-
    Multiple biopsies of ulcer edges are examined for granulomas.
    Caseation, confluent granulomas, ten or more granulomas per site, large
    granulomas, ulcers lined by epithelioid histiocytes and disproportionate
    submucosal inflammation favour tuberculosis over Crohn disease, but
    caseation is present in only a minority of biopsies.
  diagnosis_term:
    preferred_term: endoscopic biopsy with histopathology
    term:
      id: NCIT:C15389
      label: Endoscopic Biopsy
  evidence:
  - reference: PMID:16873564
    reference_title: "Role of colonoscopic biopsy in distinguishing between Crohn's disease and intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histopathological features that seemed to reliably differentiate
      between intestinal tuberculosis and Crohn's disease included confluent
      granulomas, > or =10 granulomas per biopsy site and caseous necrosis (in
      biopsy samples of 50%, 33% and 22% of patients with intestinal
      tuberculosis, respectively, v 0% of patients with Crohn's disease).
    explanation: >-
      Histological discriminators and their sensitivity.
- name: Acid-fast bacilli smear of biopsy tissue
  description: >-
    Ziehl-Neelsen staining of biopsy tissue is specific but positive in only
    a small minority.
  diagnosis_term:
    preferred_term: Ziehl-Neelsen acid-fast staining
    term:
      id: NCIT:C85831
      label: Ziehl Neelsen Acid Fast Staining Method
  evidence:
  - reference: PMID:28045023
    reference_title: "Meta-Analytic Bayesian Model For Differentiating Intestinal Tuberculosis from Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      A definite diagnosis of ITB depends on methods that have
      unsatisfactorily low sensitivities, including 5.3–37.5% for acid-fast
      bacilli tissue staining
    explanation: >-
      The introduction of a meta-analysis restating the low sensitivity of
      tissue acid-fast staining.
- name: Mycobacterial culture of biopsy tissue
  description: >-
    Culture of biopsy tissue is the reference standard and allows drug
    susceptibility testing, but its sensitivity is low.
  diagnosis_term:
    preferred_term: mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:35227196
    reference_title: Recent advances in the diagnosis of intestinal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Culture as a gold standard has a sensitivity and specificity value of
      9.3% and 100% with the MGIT BACTEC system as the most recommended
      medium.
    explanation: >-
      Sensitivity and specificity of culture.
- name: Mycobacterium tuberculosis PCR of biopsy tissue
  description: >-
    PCR of biopsy tissue for M. tuberculosis is highly specific for
    intestinal tuberculosis against Crohn disease but misses about half of
    cases, so a negative result does not exclude it.
  diagnosis_term:
    preferred_term: polymerase chain reaction for Mycobacterium tuberculosis
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:28139494
    reference_title: "The diagnostic value of polymerase chain reaction for Mycobacterium tuberculosis to distinguish intestinal tuberculosis from crohn's disease: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The summary estimates were as follows: sensitivity 0.47 (95% CI:
      0.42-0.51); specificity 0.95 (95% CI: 0.93-0.97)
    explanation: >-
      Pooled accuracy of PCR in nine studies.
- name: Xpert MTB/RIF assay of biopsy tissue
  description: >-
    The Xpert MTB/RIF cartridge assay detects M. tuberculosis and rifampicin
    resistance; in intestinal tuberculosis it is highly specific but only
    about half as sensitive, so a positive result confirms the diagnosis and
    a negative one does not exclude it.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:37531292
    reference_title: A meta-analysis of the accuracy of Xpert MTB/RIF in diagnosing intestinal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled Xpert MTB/RIF sensitivity was 48%, and the specificity was
      99%.
    explanation: >-
      Pooled accuracy of Xpert in intestinal tuberculosis.
  - reference: PMID:37531292
    reference_title: A meta-analysis of the accuracy of Xpert MTB/RIF in diagnosing intestinal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      An Xpert-positive result may facilitate the rapid identification of ITB
      cases. Nevertheless, a negative result has less certainty in excluding
      the disease.
    explanation: >-
      Interpretation of positive and negative results.
- name: Interferon-gamma release assay
  description: >-
    A positive IGRA supports intestinal tuberculosis over Crohn disease in
    Asian patients, but it cannot separate active from latent infection and
    is supplementary only.
  diagnosis_term:
    preferred_term: interferon-gamma release assay
    term:
      id: NCIT:C128363
      label: Interferon Gamma Release Assay
  evidence:
  - reference: PMID:24910240
    reference_title: "Systematic review with meta-analysis: accuracy of interferon-gamma releasing assay and anti-Saccharomyces cerevisiae antibody in differentiating intestinal tuberculosis from Crohn's disease in Asians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled sensitivity, specificity, positive likelihood ratio, and
      negative likelihood ratio of IGRA for the diagnosis of ITB was 81% (95%
      CI, 75-86%), 85% (95% CI, 81-89%)
    explanation: >-
      Pooled accuracy of IGRA.
  - reference: PMID:24910240
    reference_title: "Systematic review with meta-analysis: accuracy of interferon-gamma releasing assay and anti-Saccharomyces cerevisiae antibody in differentiating intestinal tuberculosis from Crohn's disease in Asians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Both IGRA and ASCA may have a supplementary role in the differential
      diagnosis between ITB and CD when conventional workup is not
      diagnostic.
    explanation: >-
      IGRA is supplementary to the conventional workup.
- name: Abdominal computed tomography
  description: >-
    CT or CT enterography shows concentric ileocecal wall thickening,
    short-segment involvement and enlarged lymph nodes with necrotic
    hypodense centres; necrotic nodes are specific for tuberculosis against
    Crohn disease, while long segments, comb sign and skip lesions favour
    Crohn disease.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cross sectional imaging with computerized tomography (CT) is useful in
      identifying intra and extra-luminal pathology, as well as abdominal
      lymphadenopathy.
    explanation: >-
      The role of CT.
  - reference: PMID:30700939
    reference_title: "Differentiating Crohn's disease from intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the only exclusive features are caseation necrosis on biopsy, positive
      smear for acid-fast bacillus (AFB) and/or AFB culture, and necrotic
      lymph node on cross-sectional imaging in ITB.
    explanation: >-
      Necrotic lymph nodes on imaging are one of the few exclusive features.
- name: Chest radiograph and sputum testing for pulmonary tuberculosis
  description: >-
    Evidence of active or healed pulmonary tuberculosis supports the
    diagnosis; three sputum specimens are recommended in patients with
    tuberculous enteritis.
  diagnosis_term:
    preferred_term: chest radiography
    term:
      id: NCIT:C38103
      label: Chest Radiography
  evidence:
  - reference: PMID:16873564
    reference_title: "Role of colonoscopic biopsy in distinguishing between Crohn's disease and intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Clinical parameters helpful in differentiating intestinal tuberculosis
      from Crohn's disease included chest radiographic features of
      tuberculosis (56% v 0%)
    explanation: >-
      Chest radiographic tuberculosis in 56% of intestinal tuberculosis and
      no Crohn disease patients.
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      We recommend that patients with TB enteritis be tested with three
      spontaneous or induced sputum specimens to evaluate for concomitant
      pulmonary TB.
    explanation: >-
      Sputum testing recommendation.
- name: Empirical antituberculous therapy trial
  description: >-
    When intestinal tuberculosis and Crohn disease cannot be separated,
    Asia-Pacific guidance is to give 8-12 weeks of empirical antituberculous
    therapy before any immunosuppression, assess clinical response at 2-3
    months, and repeat colonoscopy at 6 months to document mucosal healing.
    Patients with tuberculosis respond and heal; persistence of symptoms or
    of active endoscopic disease points to Crohn disease. Some Crohn disease
    patients improve symptomatically on the trial, so symptom response alone
    is not diagnostic, and the trial delays treatment of Crohn disease.
  evidence:
  - reference: PMID:28045023
    reference_title: "Meta-Analytic Bayesian Model For Differentiating Intestinal Tuberculosis from Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Therefore, ITB still cannot be confidently excluded even when all the
      above results are negative, thus the current Asia-Pacific guidelines
      recommend 8–12 weeks of empirical antituberculosis treatment for
      patients with diagnostic uncertainty, owing to the potentially fatal
      complications if immunosuppressive agents are wrongly prescribed to ITB
      patients
    explanation: >-
      The introduction of a meta-analysis restating the Asia-Pacific
      recommendation for an empirical trial.
  - reference: PMID:27813111
    reference_title: "Endoscopic and clinical responses to anti-tubercular therapy can differentiate intestinal tuberculosis from Crohn's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Endoscopic mucosal healing was seen in only 5% of patients with Crohn's
      disease compared with 100% of intestinal tuberculosis patients.
    explanation: >-
      Mucosal healing separates the two diseases after a trial.
  - reference: PMID:27813111
    reference_title: "Endoscopic and clinical responses to anti-tubercular therapy can differentiate intestinal tuberculosis from Crohn's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the derivation cohort, among those eventually diagnosed as Crohn's
      disease, global symptomatic response with anti-tubercular therapy was
      seen in 38% at 3 months and in 37% who completed 6 months of
      anti-tubercular therapy.
    explanation: >-
      Symptomatic response occurs in a third of Crohn disease patients, so
      symptoms alone are not diagnostic.
  - reference: PMID:30700939
    reference_title: "Differentiating Crohn's disease from intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical response should be assessed at 2-3 mo of ATT. In patients
      who are responding, ATT should be continued till 6 months, and at 6
      months, a repeat endoscopy should be done to document mucosal healing.
    explanation: >-
      Proposed follow-up algorithm for the trial.
  - reference: PMID:30700939
    reference_title: "Differentiating Crohn's disease from intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therapeutic ATT trial is associated with a delay in the diagnosis of
      CD, and there is a need for better modalities for improved
      differentiation and reduction in the need for ATT trial.
    explanation: >-
      The cost of the trial is delayed Crohn disease diagnosis.
differential_diagnoses:
- name: Crohn disease
  disease_term:
    preferred_term: Crohn disease
    term:
      id: MONDO:0005011
      label: Crohn disease
  description: >-
    The clinically critical differential (see the Crohn_Disease entry). Both
    are chronic granulomatous ileocolonic diseases with overlapping clinical,
    endoscopic, radiological and histological features, and misdiagnosis in
    either direction is common. Treating intestinal tuberculosis as Crohn
    disease with corticosteroids, thiopurines or TNF inhibitors can cause
    dissemination and death, so tuberculosis must be excluded, if necessary
    by an empirical antituberculous trial, before immunosuppression.
  distinguishing_features:
  - Caseating, confluent, large or numerous submucosal granulomas, ulcers lined by epithelioid histiocytes, or acid-fast bacilli on biopsy favour tuberculosis
  - Transverse or circumferential ulcers, a patulous ileocecal valve, cecal involvement and fewer than four segments favour tuberculosis; longitudinal and aphthous ulcers, cobblestoning and anorectal lesions favour Crohn disease
  - Necrotic mesenteric lymph nodes and short-segment involvement on CT favour tuberculosis; comb sign, long segments and skip lesions favour Crohn disease
  - Fever, night sweats, ascites and pulmonary tuberculosis favour tuberculosis; perianal disease, hematochezia and extraintestinal manifestations favour Crohn disease
  - Mucosal healing after an antituberculous trial confirms tuberculosis
  evidence:
  - reference: PMID:30700939
    reference_title: "Differentiating Crohn's disease from intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the only exclusive features are caseation necrosis on biopsy, positive
      smear for acid-fast bacillus (AFB) and/or AFB culture, and necrotic
      lymph node on cross-sectional imaging in ITB.
    explanation: >-
      The few exclusive features of intestinal tuberculosis.
  - reference: PMID:30700939
    reference_title: "Differentiating Crohn's disease from intestinal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treating with steroids in such a situation would be disastrous if the
      patient has underlying ITB, and therefore, this dilemma is circumvented
      with a therapeutic anti-tubercular therapy (ATT) trial.
    explanation: >-
      Steroids are dangerous if the diagnosis is tuberculosis.
  - reference: PMID:28045023
    reference_title: "Meta-Analytic Bayesian Model For Differentiating Intestinal Tuberculosis from Crohn's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Findings in the model that significantly favored CD included male
      gender, hematochezia, perianal disease, intestinal obstruction, and
      extraintestinal manifestations; endoscopic findings of longitudinal
      ulcers, cobblestone appearance, luminal stricture, mucosal bridge, and
      rectal involvement; pathological findings of focally enhanced colitis;
      and computed tomographic enterography (CTE) findings of asymmetrical
      wall thickening, intestinal wall stratification, comb sign, and
      fibrofatty proliferation.
    explanation: >-
      Pooled findings favouring Crohn disease.
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When a definitive diagnosis remains in doubt after an extensive workup
      has been completed, a prudent strategy may be to consider empiric
      anti-tuberculous therapy before initiating immunosuppressant
      medications.
    explanation: >-
      Empirical treatment before immunosuppression.
  - reference: PMID:28139494
    reference_title: "The diagnostic value of polymerase chain reaction for Mycobacterium tuberculosis to distinguish intestinal tuberculosis from crohn's disease: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The clinical misdiagnosis rate between CD and ITB ranges from 50 to 70%.
    explanation: >-
      A meta-analysis introduction restating the misdiagnosis rate.
- name: Acute appendicitis
  description: >-
    Cecal tuberculosis can present as right iliac fossa pain and be operated
    on as appendicitis, with fistulas and deaths after inappropriate surgery.
  distinguishing_features:
  - Chronic symptoms, weight loss, pulmonary tuberculosis and ileocecal thickening with necrotic nodes on CT
  evidence:
  - reference: PMID:30338607
    reference_title: "Intestinal tuberculosis: clinico-pathological profile and the importance of a high degree of suspicion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Six patients with caecum tuberculosis were misdiagnosed as
      appendicitis, four of whom had improper surgical procedures followed by
      post-operative intestinal fistulas; two died due to MODS.
    explanation: >-
      Misdiagnosis as appendicitis in six of 85 patients.
- name: Intestinal lymphoma and colon cancer
  description: >-
    Hypertrophic tuberculosis forms an ileocecal mass that mimics lymphoma
    or carcinoma.
  distinguishing_features:
  - Granulomas with caseation or acid-fast bacilli rather than malignant cells on biopsy
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The differential diagnosis for patients suspected to have tuberculous
      enteritis includes Crohn's disease, typhlitis, infectious etiologies
      (amebiasis, yersiniosis, histoplasmosis, actinomycosis), and neoplasm
      (lymphoma, colon cancer).
    explanation: >-
      Names lymphoma and colon cancer among the differentials.
- name: Other infectious ileocolitis
  description: >-
    Amoebiasis, yersiniosis, histoplasmosis and actinomycosis also produce
    ileocecal inflammation, as does typhlitis.
  distinguishing_features:
  - Organism-specific histology, stains, culture or serology without mycobacterial evidence
  evidence:
  - reference: PMID:31720391
    reference_title: Tuberculosis of the gastrointestinal tract and associated viscera.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The differential diagnosis for patients suspected to have tuberculous
      enteritis includes Crohn's disease, typhlitis, infectious etiologies
      (amebiasis, yersiniosis, histoplasmosis, actinomycosis), and neoplasm
      (lymphoma, colon cancer).
    explanation: >-
      Names the infectious differentials.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    The standard regimen for drug-susceptible tuberculosis: isoniazid,
    rifampicin, pyrazinamide and ethambutol for two months, then isoniazid
    and rifampicin for four months. Three randomized trials in intestinal
    and peritoneal tuberculosis found six months as effective as nine, and an
    older trial found a six-month rifampicin-isoniazid-pyrazinamide regimen
    as effective as twelve months of ethambutol and isoniazid with initial
    streptomycin. The trials excluded people with HIV and comorbidities.
    Drug absorption may be impaired with extensive small-bowel disease, so
    persistent symptoms beyond about two weeks should prompt consideration of
    complications, malabsorption, drug resistance or another diagnosis.
    Adverse effects occurred in about a fifth of trial patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Inflammation of the Intestinal Wall
    treatment_effect: INHIBITS
    description: >-
      Chemotherapy kills the bacilli, resolving the granulomatous
      inflammation and healing the ulcers.

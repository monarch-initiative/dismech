    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes pulmonary tuberculosis
    and, by swallowing, bloodstream or contiguous spread, intestinal
    tuberculosis.
  evidence:
  - reference: PMID:35227196
    reference_title: Recent advances in the diagnosis of intestinal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculosis is an infectious disease caused by Mycobacterium
      tuberculosis. These bacteria generally infect the lung tissue, but can
      also infect outside of the lung.
    explanation: >-
      A review of intestinal tuberculosis diagnosis names M. tuberculosis as
      the agent and its extrapulmonary reach.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    The bovine tubercle bacillus, an uncommon cause of intestinal
    tuberculosis acquired by drinking unpasteurized milk; it enters through
    the intestinal mucosa and mesenteric lymph nodes.
  evidence:
  - reference: PMID:15253472
    reference_title: "Molecular and histopathologic evidence for systemic infection by Mycobacterium bovis in a patient with tuberculous enteritis, peritonitis, and meningitis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pathology demonstrated tuberculosis enteritis with colon perforation.
      The molecular diagnosis by nested polymerase chain reaction assay and
      single-strand conformation polymorphism assay showed M. bovis infection
      in the small intestine, mesenteric lymph nodes, and cerebrospinal fluid
      (CSF).
    explanation: >-
      A case of tuberculous enteritis with perforation in which M. bovis was
      identified in the bowel and mesenteric nodes.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans by inhaled aerosols and establishes
    pulmonary infection, from which the intestine is reached by swallowed
    sputum, by the blood or by contiguous spread. M. bovis is maintained in
    cattle and other bovids and cervids and reaches humans mainly through raw
    dairy products.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: maintenance host of Mycobacterium bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:31919980
    reference_title: "Human zoonotic tuberculosis and livestock exposure in low- and middle-income countries: A systematic review identifying challenges in laboratory diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cattle, buffalo and cervids are considered the maintenance hosts for M.
      bovis
    explanation: >-
      Names cattle as a maintenance host of M. bovis.
  - reference: PMID:31919980
    reference_title: "Human zoonotic tuberculosis and livestock exposure in low- and middle-income countries: A systematic review identifying challenges in laboratory diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reported prevalence of human zTB ranged from 0% to 28%, with cattle and
      raw dairy the primary exposures. All confirmed zTB cases were
      Mycobacterium bovis.
    explanation: >-
      A systematic review of human zoonotic tuberculosis identifies cattle
      and raw dairy as the exposures and M. bovis as the agent.

- ileocecal tuberculosis
notes: >-
  Scope. This entry covers tuberculosis of the small and large bowel wall,
  above all the ileocecal region, with its mesenteric lymphadenitis.
  Tuberculous peritonitis (Tuberculous_Peritonitis), esophageal tuberculosis
  (Esophageal_Tuberculosis), hepatic tuberculosis (Hepatic_Tuberculosis) and
  oral tuberculosis (Oral_Tuberculosis) are separate entries; peritoneal
  involvement accompanying intestinal disease is mentioned only where a cited
  source describes it with the bowel lesion. The wider abdominal and
  gastrointestinal tuberculosis concepts are groupings outside this entry.
  Gastroduodenal and anorectal tuberculosis are rare and are not curated
  separately here. Evidence. The literature is retrospective single-centre
  series (22 to 96 patients), case reports, narrative reviews, diagnostic
  meta-analyses and three randomized trials of treatment duration in
  abdominal (intestinal plus peritoneal) tuberculosis. Symptom frequencies
  are set only from series restricted to intestinal tuberculosis (Chinese
  series of 81 and 85 patients and a Hong Kong series of 22); the surgical
  Yemeni series of 96 patients who presented with an acute abdomen
  (PMID:39253062) is cited but not used for frequencies because it selects
  complicated disease. The mechanism of the ileocecal predilection (lymphoid
  tissue, M cells, stasis) and of transverse ulcer orientation is stated in
  reviews, not demonstrated. No HPO term exists for a patulous ileocecal
  valve or for alternating constipation and diarrhoea (OLS HP searches for
  "ileocecal" returned only HP:0033433 Ileocecal ulcer and HP:0025002, and
  for "alternating constipation and diarrhea" returned nothing), so the
  former is recorded under diagnosis and the latter under Constipation. No
  ECTO term exists for ingestion of unpasteurized cow milk (OLS ECTO searches
  for "raw milk", "milk ingestion" and "cow milk" returned human raw milk,
  plant milks, whole, skim and low-fat milk, and cow milk (liquid), none of
  which says unpasteurized), so that exposure is unbound. The share of
  patients with HIV infection is not reported in the cached series. Seeded
  from `research/Intestinal_Tuberculosis-deep-research-claude_code.md` and
  PubMed searches; every quotation was re-read in the cached reference.
review_notes: >-
  Deliberately lumped. All intestinal tuberculosis is kept in one entry
  regardless of whether Mycobacterium tuberculosis or Mycobacterium bovis is
  the agent, and regardless of lineage or drug-resistance pattern. PubMed was
  searched for intestinal tuberculosis with bovis and milk, and the
  deep-research run searched for zoonotic intestinal disease; M. bovis
  disease is reported as rare case reports with the same lesions, the same
  diagnostic pathway and the same management apart from intrinsic
  pyrazinamide resistance, which is not enough to define a separate entry.
  The ulcerative, hypertrophic and ulcerohypertrophic morphological forms
  are recorded as overlapping subtypes because they share the mechanism and
  treatment and differ only in the tissue response.

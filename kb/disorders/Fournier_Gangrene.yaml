  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The polymicrobial synergy contributes significantly to tissue
      destruction.
    explanation: >-
      Attributes tissue destruction to the polymicrobial synergy.
  - reference: PMID:19629386
    reference_title: "New insights into the epidemiology and etiology of Fournier's gangrene: a review of 33 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive cultures were obtained in 30 cases (90.9%).
    explanation: >-
      Cultures were positive in almost all cases in a 33-patient series.
- name: Obliterative Endarteritis of Subcutaneous Arteries
  description: >-
    Infection of the fascia causes an obliterative endarteritis of the
    subcutaneous arteries supplying the overlying skin.
  role: mediator
  biological_scale: TISSUE
  downstream:
  - target: Subcutaneous Vessel Thrombosis
    description: >-
      The endarteritis leads to thrombosis of the subcutaneous vessels.
    evidence:
    - reference: PMID:39840205
      reference_title: "A Case of Fournier's Gangrene in a Patient with Human Immunodeficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        This endarteritis leads to vascular thrombosis and subsequent tissue
        necrosis, allowing pathogens to migrate into traditionally sterile
        interfacial planes
      explanation: >-
        States the endarteritis-to-thrombosis step.
    - reference: PMID:39840205
      reference_title: "A Case of Fournier's Gangrene in a Patient with Human Immunodeficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        It is a polymicrobial infection that progresses to an obliterating

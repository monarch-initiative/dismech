- name: Klebsiella pneumoniae
  infectious_agent_term:
    preferred_term: Klebsiella pneumoniae
    term:
      id: NCBITaxon:573
      label: Klebsiella pneumoniae
  description: >-
    Klebsiella pneumoniae is a Gram-negative Enterobacterales isolate in
    Fournier gangrene, associated with severe disease, and occasionally the
    sole pathogen in scrotal infection.
  evidence:
  - reference: PMID:28257985
    reference_title: "Microbiological aspects of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acinetobacter baumannii and Klebsiella pneumonia were significantly more
      common in patients who required mechanical ventilation.
    explanation: >-
      Places K. pneumoniae among Fournier isolates and links it to severe
      disease requiring ventilation.
  - reference: PMID:41742047
    reference_title: "Scrotal abscess and Fournier gangrene caused by Klebsiella pneumoniae: a case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      K. pneumoniae was identified as the sole pathogen in all cases, including
      one hypervirulent ST23 strain.
    explanation: >-
      A case series documents monomicrobial K. pneumoniae scrotal infection
      progressing to Fournier gangrene.
- name: Acinetobacter baumannii
  infectious_agent_term:
    preferred_term: Acinetobacter baumannii
    term:
      id: NCBITaxon:470
      label: Acinetobacter baumannii
  description: >-
    Acinetobacter baumannii is a less common Fournier gangrene isolate that was
    the only organism associated with increased mortality in one series.
  evidence:
  - reference: PMID:28257985
    reference_title: "Microbiological aspects of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acinetobacter baumannii was the only microorganism which was associated
      with an increased mortality rate.
    explanation: >-
      Reports A. baumannii as a Fournier isolate linked to higher mortality.
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus, including community-acquired methicillin-resistant
    strains, is a Gram-positive etiological agent of Fournier gangrene.
  evidence:
  - reference: PMID:25546936
    reference_title: "Fournier's gangrene--current concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recently community-acquired methicillin-resistant Staphylococcus aureus
      (CA-MRSA) has emerged as an etiological agent of FG with severe clinical
      course and even fulminant sepsis.
    explanation: >-
      Review identifies CA-MRSA as an emerging Fournier gangrene pathogen.
- name: Candida albicans
  infectious_agent_term:
    preferred_term: Candida albicans
    term:
      id: NCBITaxon:5476
      label: Candida albicans
  description: >-
    Candida species rarely cause or contribute to Fournier gangrene; fungal
    infection carries the highest reported mortality.
  evidence:
  - reference: PMID:25546936
    reference_title: "Fournier's gangrene--current concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rarely FG may have a fungal etiology, being caused by yeast-like fungi
      Candida spp. or by moulds.
    explanation: >-
      Review documents rare fungal, Candida-associated Fournier gangrene.
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Escherichia coli was the most common isolate, but had a relatively lower
      mortality rate (25.9%) than Candida albicans (61.1%) and other pathogens
      such as Proteus, Pseudomonas, and Acinetobacter spp.
    explanation: >-
      Umbrella review names C. albicans as a Fournier isolate with high
      mortality.

  description: >-
    Systemic spread of the infection produces sepsis that can progress to
    septic shock and multiorgan failure, which account for most deaths. Pooled
    mortality in published series is about 20%, while the population-based US
    case fatality was 7.5%, lower than tertiary-centre series.

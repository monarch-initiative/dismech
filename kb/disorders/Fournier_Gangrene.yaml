name: Fournier Gangrene
creation_date: "2026-11-26T03:48:33Z"
description: >-
  Fournier gangrene is a rapidly progressive necrotizing fasciitis of the
  perineum, external genitalia, and perianal region. Mixed aerobic and
  anaerobic bacteria, usually entering from a urogenital, anorectal, or
  cutaneous source, act synergistically to cause obliterative endarteritis and
  thrombosis of the subcutaneous vessels, ischemic necrosis of the overlying
  skin and fascia, and spread along the Dartos, Colles, and Scarpa fasciae,
  while the testes are usually spared because of their separate blood supply.
  Sepsis and multiorgan failure drive mortality. Treatment is urgent radical
  debridement, broad-spectrum antibiotics, and intensive supportive care, with
  fecal or urinary diversion, wound therapy, and reconstruction as needed.
category: Infectious Disease
disease_term:
  preferred_term: fournier gangrene
  term:
    id: MONDO:0043352
    label: fournier gangrene
parents:
- Necrotizing Soft Tissue Infection
synonyms:
- Fournier's gangrene
- Fournier disease
- Necrotizing fasciitis of the perineum and genitalia
notes: >-
  Fournier gangrene is promoted here out of Necrotizing_Soft_Tissue_Infection,
  which had lumped it while MONDO lacked a term. It differs from the parent
  entry on two documented axes. Organ systems: it is confined to the perineal,
  genital, and perianal fascial compartments, bounded by the Colles, Dartos,
  and Scarpa fasciae, with characteristic testicular sparing and spread to the
  anterior abdominal wall. Therapy and diagnosis: it has its own severity score
  (the Fournier's Gangrene Severity Index) and adds fecal or urinary diversion
  to the debridement and antibiotic core. The literature is dominated by
  retrospective single-centre series and systematic reviews of them; no
  randomized trial of any intervention was found, and the hyperbaric oxygen and
  diversional stoma data are observational and confounded by severity.
  Bacteroides fragilis is commonly named as a Fournier pathogen in reviews, but
  no fetched abstract quoted it, so it is not listed as an infectious agent.
review_notes: >-
  Deliberately lumped. This entry keeps the polymicrobial Enterobacterales,
  streptococcal, staphylococcal, anaerobic, and rare fungal (Candida) etiologies
  together, and keeps male, female, and pediatric Fournier gangrene together,
  because a PubMed search on 2026-11-26 found no source documenting a
  difference between these strata in presentation, first-line therapy, or
  prognosis that would support a separate subtype row; cultures are mixed in
  most cases and therapy is empiric before the organisms are known. Female sex
  and fungal infection are reported as mortality risk factors, which is
  recorded in the evidence rather than as subtypes.
infectious_agent:
- name: Escherichia coli
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  description: >-
    Escherichia coli is the most frequently cultured single organism in
    Fournier gangrene, usually as part of a polymicrobial infection.
  evidence:
  - reference: PMID:25635243
    reference_title: "The evaluation of microbiology and prognosis of fournier's gangrene in past five years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly found pathogen is poly-microbial organism (54%),
      followed by Escherichia coli (46.6%) and Streptococcus (36.8%).
    explanation: >-
      Pooled analysis of 4,365 Fournier gangrene cases identifies E. coli as
      the most common single isolate after polymicrobial growth.
  - reference: PMID:28257985
    reference_title: "Microbiological aspects of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Escherichia coli was the most common microorganism (72%).
    explanation: >-
      A prospectively collected 50-patient series finds E. coli in most
      cultures.
- name: Streptococcus
  infectious_agent_term:
    preferred_term: Streptococcus
    term:
      id: NCBITaxon:1301
      label: Streptococcus
  description: >-
    Streptococci are the second most common isolates in pooled Fournier
    gangrene series.
  evidence:
  - reference: PMID:25635243
    reference_title: "The evaluation of microbiology and prognosis of fournier's gangrene in past five years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly found pathogen is poly-microbial organism (54%),
      followed by Escherichia coli (46.6%) and Streptococcus (36.8%).
    explanation: >-

progression:
- phase: Prodrome
  notes: >-
    About half of patients first present with a symptomatically similar
    diagnosis, most often genital swelling, in the three weeks before
    diagnosis; many of these visits represent diagnostic delay.
  evidence:
  - reference: PMID:36006046
    reference_title: "Understanding the Prodromal Period of Necrotizing Soft Tissue Infections of the Genitalia (Fournier's Gangrene) and the Incidence, Duration, and Risk Factors Associated With Potential Missed Opportunities for an Earlier Diagnosis: A Population-based Longitudinal Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly 50% of insured patients who undergo debridement for, or die from,
      necrotizing soft tissue infections of the genitalia will present to a
      medical provider with a symptomatically similar diagnosis suggestive of
      early disease development.
    explanation: >-
      Documents a prodromal phase before diagnosis in 8,098 patients.
- phase: Acute necrotizing phase
  notes: >-
    Progression from symptom onset to gangrene takes days, with sepsis in most
    hospitalized patients.
  evidence:
  - reference: PMID:19629386
    reference_title: "New insights into the epidemiology and etiology of Fournier's gangrene: a review of 33 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median time between the onset of symptoms and progression to
      gangrene was 6 days (range 2-28 days).
    explanation: >-
      Quantifies the time from symptom onset to gangrene.
- phase: Reconstruction and long-term recovery
  notes: >-
    Survivors often need flap or graft reconstruction of perineoscrotal
    defects and carry a long-term burden of bowel, urinary, sexual, and
    psychosocial dysfunction.
  evidence:
  - reference: PMID:41982033
    reference_title: "The Forgotten Suffering of Patients who Survived Fournier's Gangrene: A Systematic Review of Long-term Outcomes and Quality of Life Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, available evidence indicates that FG carries a sustained burden
      beyond the acute phase; however, conclusions are limited by the scarcity
      and low methodological quality of existing studies.
    explanation: >-
      Documents the post-acute phase of sustained morbidity, with the authors'
      caveat on evidence quality.
diagnosis:
- name: Clinical Diagnosis
  description: >-
    Fournier gangrene is diagnosed clinically from perineal or scrotal pain,
    erythema, swelling, crepitus, and fever, and confirmed at operation; skin
    signs can be absent early, which risks delay.
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      FG is primarily diagnosed clinically, with early symptoms including
      perineal or scrotal pain, erythema, swelling, and crepitus.
    explanation: >-
      States that diagnosis is primarily clinical.
- name: Computed Tomography
  description: >-
    CT shows asymmetric fascial thickening, subcutaneous emphysema, fluid
    collections, and abscesses, and delineates extent, including
    retroperitoneal spread; imaging must not delay debridement.
  diagnosis_term:
    preferred_term: Computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:18349455
    reference_title: "Fournier gangrene: role of imaging."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Compared with radiography and ultrasonography, CT provides a higher
      specificity for the diagnosis of Fournier gangrene and superior
      evaluation of disease extent; however, diagnosis and evaluation can also
      be performed with these other modalities.
    explanation: >-
      Supports CT as the most specific imaging modality for diagnosis and
      extent.
  - reference: PMID:18349455
    reference_title: "Fournier gangrene: role of imaging."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Findings at CT include asymmetric fascial thickening, subcutaneous
      emphysema, fluid collections, and abscess formation.
    explanation: >-
      Lists the CT findings.
- name: Fournier's Gangrene Severity Index
  description: >-
    The FGSI, adapted from APACHE II physiologic and laboratory parameters,
    stratifies mortality risk at admission; in the derivation series a score
    above 9 carried a 75% probability of death. Later series find the FGSI and
    its Uludag modification more accurate than LRINEC for mortality
    prediction.
  evidence:
  - reference: PMID:7776464
    reference_title: "Outcome prediction in patients with Fournier's gangrene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To assess better the physiological profile of the patients in both
      outcome categories, the acute physiology and chronic health evaluation
      II severity score was modified to create a Fournier's gangrene severity
      index.
    explanation: >-
      Original derivation of the FGSI from APACHE II.
  - reference: PMID:7776464
    reference_title: "Outcome prediction in patients with Fournier's gangrene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      severity index threshold value of 9, there was a 75% probability of death
      with a score greater than 9, while a score of 9 or less was associated
      with a 78% probability of survival (p = 0.008).
    explanation: >-
      Reports the FGSI threshold and its associated mortality in the 30-patient
      derivation series.
  - reference: PMID:39379674
    reference_title: "Comparative analysis of scoring systems for predicting mortality in Fournier gangrene: single center, 15 years experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      UFGSI and FGSI scores had the highest AUC values among all scores.
    explanation: >-
      In 311 patients the FGSI and Uludag FGSI outperformed other scores for
      mortality prediction.
- name: Laboratory Risk Indicator for Necrotizing Fasciitis
  description: >-
    The LRINEC score stratifies the probability of necrotizing fasciitis from
    routine laboratory values; in Fournier gangrene it was the least accurate
    of five scores for predicting mortality.
  evidence:
  - reference: PMID:26445600
    reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The Laboratory Risk Indicator for Necrotizing Fasciitis score can be used
      to stratify patients into low, moderate or high risk and the Fournier's
      Gangrene Severity Index (FGSI) can also be used to determine the
      severity and prognosis of Fournier's gangrene.
    explanation: >-
      Review describes LRINEC risk stratification in Fournier gangrene.
  - reference: PMID:39379674
    reference_title: "Comparative analysis of scoring systems for predicting mortality in Fournier gangrene: single center, 15 years experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the scoring systems used to predict mortality, UFGSI was the most
      accurate, while LRINEC was the least accurate.
    explanation: >-
      Shows LRINEC is the least accurate mortality predictor in Fournier
      gangrene.
treatments:
- name: Urgent Radical Surgical Debridement
  description: >-
    Early and aggressive excision of all necrotic tissue is the cornerstone of
    treatment, repeated as needed; delay to surgery is associated with higher
    mortality.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Debridement
    term:
      id: NCIT:C51682
      label: Debridement
  target_mechanisms:
  - target: Ischemic Necrosis of Perineogenital Skin and Fascia
    treatment_effect: INHIBITS
    description: >-
      Debridement removes the necrotic tissue.
  - target: Synergistic Aerobic-Anaerobic Polymicrobial Fascial Infection
    treatment_effect: INHIBITS
    description: >-
      Removing infected devitalized fascia provides source control.
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early and aggressive surgery is universally regarded as the cornerstone
      of treatment and important for patients’ survival
    explanation: >-
      Supports early aggressive debridement as the core treatment.
  - reference: PMID:26445600
    reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mainstays of treatment include rapid and aggressive surgical debridement
      of necrotized tissue, hemodynamic support with urgent resuscitation with
      fluids, and broad-spectrum parental antibiotics.
    explanation: >-
      Names debridement, resuscitation, and antibiotics as the mainstays.
- name: Empiric Broad-Spectrum Antibiotic Therapy
  description: >-
    Broad-spectrum parenteral antibiotics covering aerobes and anaerobes are
    started immediately after cultures and narrowed to culture results. One
    series recommended a third-generation cephalosporin with metronidazole and
    amikacin for empiric therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: third-generation cephalosporin
      term:
        id: CHEBI:23066
        label: cephalosporin
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: amikacin
      term:
        id: CHEBI:2637
        label: amikacin
  target_mechanisms:
  - target: Synergistic Aerobic-Anaerobic Polymicrobial Fascial Infection
    treatment_effect: INHIBITS
    description: >-
      Antibiotics suppress the mixed aerobic and anaerobic infection.
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, early culture collection and prompt initiation of
      broad-spectrum empiric antibiotics, followed by targeted therapy, are
      critical components of early FG management
    explanation: >-
      Supports immediate empiric broad-spectrum therapy followed by targeted
      therapy.
  - reference: PMID:28257985
    reference_title: "Microbiological aspects of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend 3rd-generation cephalosporin, metronidazole and amikacin for
      empirical therapy.
    explanation: >-
      A susceptibility-based recommendation for the empiric regimen from a
      50-patient series.
- name: Intensive Supportive Care and Resuscitation
  description: >-
    Fluid resuscitation, hemodynamic support, and critical care are one of the
    three core interventions.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Septic Multiorgan Failure
    treatment_effect: INHIBITS
    description: >-
      Resuscitation and organ support address septic shock and organ failure.
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The management of FG is consistently described as a multimodal emergency,
      centered on three core interventions: early surgical debridement,
      empiric broad-spectrum antibiotics, and intensive supportive care.
    explanation: >-
      Names intensive supportive care as a core intervention.
- name: Fecal and Urinary Diversion
  description: >-
    A diversional colostomy or a suprapubic catheter can keep stool or urine
    out of the wound when there is extensive perianal or urethral involvement
    or sphincter damage. Stoma formation is associated with higher mortality,
    which likely reflects more severe disease, so its use is individualized.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Colostomy
    term:
      id: NCIT:C15211
      label: Colostomy
  evidence:
  - reference: PMID:7985069
    reference_title: "Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diversion of the fecal and urinary streams may not always be necessary
      but should always be considered on a case-by-case basis.
    explanation: >-
      Supports case-by-case fecal and urinary diversion.
  - reference: PMID:33864128
    reference_title: "Relationship between diversional stoma and mortality rate in Fournier's gangrene: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrated that mortality rate remained high and a
      diversional stoma did not reduce risk of mortality as suggested by
      smaller case series. Its use should therefore be individualised based on
      disease severity and sphincter damage.
    explanation: >-
      Meta-analysis of 1,482 patients finds no mortality benefit from a stoma
      and supports individualized use, which is the claim recorded here.
- name: Negative Pressure Wound Therapy
  description: >-
    After debridement, open wounds are managed with dressings and
    negative-pressure wound therapy, which reduces analgesic use but has not
    been shown to reduce mortality, debridements, or hospital stay.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Negative pressure wound therapy
    term:
      id: NCIT:C159891
      label: Negative Pressure Wound Therapy
  evidence:
  - reference: PMID:26445600
    reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      After initial radical debridement, open wounds are generally managed with
      sterile dressings and negative-pressure wound therapy.
    explanation: >-
      Describes NPWT as standard post-debridement wound care.
  - reference: PMID:43055980
    reference_title: "Negative pressure wound therapy versus conventional wound care following surgical debridement of fournier's gangrene: a systematic review and meta-analysis of observational studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NPWT is associated with reduced postoperative analgesic consumption
      following debridement for Fournier's gangrene.
    explanation: >-
      Meta-analysis of 18 observational studies finds an analgesic benefit;
      the same abstract reports no significant mortality difference.
- name: Hyperbaric Oxygen Therapy
  description: >-
    Adjunctive hyperbaric oxygen is associated with lower mortality in
    meta-analyses of retrospective observational studies, but the studies are
    at moderate to high risk of bias, no randomized trial exists, and it must
    not delay surgery; its role remains controversial.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Hyperbaric oxygen therapy
    term:
      id: NCIT:C38065
      label: Hyperbaric Oxygen Therapy
  evidence:
  - reference: PMID:42356211
    reference_title: "Hyperbaric Oxygen Therapy Is Associated with Lower Mortality in Patients with Fournier's Gangrene: A Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the mortality rate of 27.45% in the control cohort, the
      rate in the hyperbaric oxygen therapy cohort was 9.55%.
    explanation: >-
      Meta-analysis of 14 observational studies (793 patients) reports lower
      mortality with adjunctive HBOT; the authors call for randomized trials.
  - reference: PMID:33285541
    reference_title: "Hyperbaric Oxygenation in the Treatment of Fournier's Gangrene: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, this leads to a mortality rate of 16.6% in the HBO group and
      25.9% in the non-HBO group. Overall, risk of bias was assessed as
      moderate to high.
    explanation: >-
      Systematic review finds lower mortality with HBO, with the authors'
      caveat on risk of bias.
- name: Reconstructive Surgery
  description: >-
    After infection control, perineoscrotal defects are reconstructed with
    skin grafts or regional flaps to cover exposed testes, urethra, or bone
    and restore function.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Reconstructive surgery
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  evidence:
  - reference: PMID:41720016
    reference_title: "Flap reconstruction following Fournier's gangrene: A systematic review of techniques and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the high-risk nature of the patient population, complication
      rates were low, with flap loss reported in only 1.6 % of cases.
    explanation: >-
      Systematic review of 619 patients reports low complication rates after
      flap reconstruction.

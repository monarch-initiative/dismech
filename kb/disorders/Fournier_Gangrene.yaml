transmission:
- name: Endogenous Invasion from a Urogenital, Anorectal, or Cutaneous Source
  description: >-
    Fournier gangrene is not transmitted between people. The patient's own
    urogenital, lower gastrointestinal, or skin flora enters the perineal
    fascial planes through a local portal such as a perianal or perirectal
    abscess, urethral disease or instrumentation, or local trauma or surgery.
  evidence:
  - reference: PMID:26445600
    reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The nidus for the synergistic polymicrobial infection is usually located
      in the genitourinary tract, lower gastointestinal tract or skin.
    explanation: >-
      Names the genitourinary, lower gastrointestinal, and cutaneous sources
      of the infecting flora.
  - reference: PMID:19629386
    reference_title: "New insights into the epidemiology and etiology of Fournier's gangrene: a review of 33 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The commonest etiological events were perianal and perirectal abscesses
      (n = 13; 39.4%).
    explanation: >-
      In a 33-patient series perianal and perirectal abscesses were the most
      common portal of infection.
  - reference: PMID:7985069
    reference_title: "Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anorectal, genitourinary, and traumatic infections are the most common
      causes of Fournier's gangrene.
    explanation: >-
      Review lists anorectal, genitourinary, and traumatic sources.
prevalence:
- population: United States males (State Inpatient Databases, 2001 and 2004)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.6
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Overall incidence 1.6 per 100,000 males, peaking at 3.3 per 100,000 in men
    aged 50 to 79, from hospital discharges in 13 states (2001) and 21 states
    (2004); 1,641 males and 39 females were identified.
  evidence:
  - reference: PMID:19286224
    reference_title: "Fournier's Gangrene: population based epidemiology and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall incidence was 1.6/100,000 males, which peaked in males who
      were 50 to 79 years old (3.3/100,000) with the highest rate in the South
      (1.9/100,000).
    explanation: >-
      Population-based US estimate of Fournier gangrene incidence among males.
environmental:
- name: Diabetes mellitus
  description: >-
    Diabetes mellitus is the most prevalent comorbidity in Fournier gangrene
    and is most frequent among non-survivors.
  disease_effect: PREDISPOSES
  influences_mechanisms:
  - target: Synergistic Aerobic-Anaerobic Polymicrobial Fascial Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Diabetes predisposes to the polymicrobial fascial infection; the cited
      sources establish the association but not the intervening immune or
      vascular steps.
    evidence:
    - reference: PMID:26445600
      reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Mainly associated with men and those over the age of 50, Fournier's
        gangrene has been shown to have a predilection for patients with
        diabetes as well as people who are long-term alcohol misusers.
      explanation: >-
        Review records the predilection of Fournier gangrene for diabetic
        patients.
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diabetes mellitus emerged as the most prevalent comorbidity across the
      reviews (32-66%) and was most frequent among nonsurvivors.
    explanation: >-
      Umbrella review of seven systematic reviews identifies diabetes as the
      leading comorbidity.
  - reference: PMID:19629386
    reference_title: "New insights into the epidemiology and etiology of Fournier's gangrene: a review of 33 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Predisposing factors included diabetes mellitus in 12 cases (36.4%),
      chronic alcoholism in ten cases (30.3%), immunosuppression in six cases
      (18.2%), and prolonged immobilization in five cases (15.2%).
    explanation: >-
      A 33-patient series records diabetes in more than a third of cases.
- name: Chronic alcohol misuse
  description: >-
    Long-term alcohol misuse is a recognized predisposing condition for
    Fournier gangrene.
  disease_effect: PREDISPOSES
  evidence:
  - reference: PMID:26445600
    reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mainly associated with men and those over the age of 50, Fournier's
      gangrene has been shown to have a predilection for patients with
      diabetes as well as people who are long-term alcohol misusers.
    explanation: >-
      Review records the predilection of Fournier gangrene for long-term
      alcohol misusers.
  - reference: PMID:19629386
    reference_title: "New insights into the epidemiology and etiology of Fournier's gangrene: a review of 33 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Predisposing factors included diabetes mellitus in 12 cases (36.4%),
      chronic alcoholism in ten cases (30.3%), immunosuppression in six cases
      (18.2%), and prolonged immobilization in five cases (15.2%).
    explanation: >-
      Chronic alcoholism was present in 30.3% of a 33-patient series.
- name: Immunosuppression including HIV infection
  description: >-
    Immunocompromised states, including HIV infection, predispose to Fournier
    gangrene, and HIV-positive patients have the highest reported mortality.
  disease_effect: PREDISPOSES
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Immunocompromised states, especially human immunodeficiency virus (HIV)
      infection, were associated with the highest mortality rate (54.2%),
      although data remain limited
    explanation: >-
      Umbrella review identifies immunosuppression, particularly HIV, as a
      risk factor with the highest associated mortality.
  - reference: PMID:38625013
    reference_title: "Risk Factors for Mortality Among Patients With Fournier Gangrene: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diabetes mellitus was the most common comorbidity in those who died, but
      the highest mortality rate was seen in HIV patients (54.17%).
    explanation: >-
      Systematic review of 3,646 patients reports the highest mortality in
      HIV-positive patients.
- name: Obesity
  description: >-
    Obesity is common among patients with Fournier gangrene and morbid obesity
    is associated with delayed diagnosis.
  disease_effect: PREDISPOSES
  evidence:
  - reference: PMID:19629386
    reference_title: "New insights into the epidemiology and etiology of Fournier's gangrene: a review of 33 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      17 patients (51.5%) had a body mass index (BMI) of 25 or higher, and 13
      patients (39.4%) had a BMI of 30 or higher.
    explanation: >-
      Records a high frequency of overweight and obesity in a 33-patient
      series.
  - reference: PMID:36006046
    reference_title: "Understanding the Prodromal Period of Necrotizing Soft Tissue Infections of the Genitalia (Fournier's Gangrene) and the Incidence, Duration, and Risk Factors Associated With Potential Missed Opportunities for an Earlier Diagnosis: A Population-based Longitudinal Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Risk factors for delay included urinary tract infection history (OR 2.1)
      and morbid obesity (OR 1.6).
    explanation: >-
      Morbid obesity was associated with diagnostic delay in 8,098 patients.
- name: SGLT2 inhibitor therapy
  description: >-
    Sodium-glucose cotransporter-2 inhibitors carry a regulatory safety signal
    for Fournier gangrene from postmarketing case reports, but randomized-trial
    and matched-cohort data have not shown an increased risk, so a causal
    association is unproven.
  chemicals:
  - sodium-glucose transport protein subtype 2 inhibitor
  disease_effect: PREDISPOSES
  evidence:
  - reference: PMID:31060053
    reference_title: "Fournier Gangrene Associated With Sodium-Glucose Cotransporter-2 Inhibitors: A Review of Spontaneous Postmarketing Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The FDA identified 55 unique cases of FG in patients receiving SGLT2
      inhibitors between 1 March 2013 and 31 January 2019.
    explanation: >-
      FDA postmarketing case series that established the SGLT2-inhibitor
      safety signal; it cannot establish causality or incidence.
  - reference: PMID:41451372
    reference_title: "Real-world data analysis of the risk of Fournier's gangrene in patients using sodium-glucose cotransporter 2 inhibitors (SGLT2i)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study found a significantly lower risk of FG in patients
      using SGLT2i in comparison with subjects not using SGLT2i.
    explanation: >-
      A matched cohort of 192,245 SGLT2-inhibitor users found a significantly
      lower Fournier gangrene risk than in non-users; the authors caution that
      the design limits interpretation and that better glycemic control in
      users may explain the difference.
  - reference: PMID:42258009
    reference_title: "Association between SGLT2 inhibitor use and Fournier's gangrene after genital or perineal surgery: a retrospective cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preoperative use of SGLT2is was not associated with increased
      postoperative FG risk following perineal or genital surgery.
    explanation: >-
      A propensity-matched surgical cohort found no increased postoperative
      Fournier gangrene risk with SGLT2-inhibitor exposure.
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While SGLT2i use does not appear to confer a statistically significant
      increase in risk, case-based evidence suggests heightened vigilance.
    explanation: >-
      Umbrella review summarizes a randomized-trial meta-analysis showing no
      significant risk increase, while noting the case-report signal.
pathophysiology:
- name: Polymicrobial Entry into Perineal Fascial Planes
  description: >-
    Mixed aerobic and anaerobic flora from a urogenital, anorectal, or
    cutaneous source gains access to the superficial perineal and genital
    fascia.
  role: cause
  biological_scale: TISSUE
  downstream:
  - target: Synergistic Aerobic-Anaerobic Polymicrobial Fascial Infection
    description: >-
      Organisms entering the fascial planes establish the synergistic mixed
      infection.
    evidence:
    - reference: PMID:26445600
      reference_title: "Contemporary diagnosis and management of Fournier's gangrene."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The nidus for the synergistic polymicrobial infection is usually
        located in the genitourinary tract, lower gastointestinal tract or skin.
      explanation: >-
        Links the source nidus to the synergistic polymicrobial infection it
        seeds.
  evidence:
  - reference: PMID:7985069
    reference_title: "Fournier's gangrene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anorectal, genitourinary, and traumatic infections are the most common
      causes of Fournier's gangrene.
    explanation: >-
      Identifies the local sources from which the infecting flora enters.
- name: Synergistic Aerobic-Anaerobic Polymicrobial Fascial Infection
  description: >-
    Aerobic and anaerobic bacteria act synergistically in the perineal and
    genital fascia; this polymicrobial synergy drives tissue destruction.
  role: mediator
  biological_scale: TISSUE
  downstream:
  - target: Obliterative Endarteritis of Subcutaneous Arteries
    description: >-
      The polymicrobial infection progresses to obliterative endarteritis of
      the subcutaneous arteries.
    evidence:
    - reference: PMID:39840205
      reference_title: "A Case of Fournier's Gangrene in a Patient with Human Immunodeficiency Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        It is a polymicrobial infection, typically involving an average of four
        organisms, that progresses to an obliterating endarteritis.
      explanation: >-
        States the infection-to-endarteritis step.
  - target: Spread Along Dartos, Colles, and Scarpa Fasciae
    description: >-
      The infection spreads rapidly along the superficial perineal and genital
      fascial planes.
    evidence:
    - reference: PMID:31747228
      reference_title: Fournier Gangrene.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The infectious and inflammatory process spreads quickly along the
        Dartos, Colles, and Scarpa fascias, allowing for the early involvement
        of the abdominal wall.
      explanation: >-
        States the fascial route of spread.
  - target: Septic Multiorgan Failure
    description: >-
      Uncontrolled infection leads to sepsis and multiorgan failure, the main
      causes of death.
    evidence:
    - reference: PMID:31962181
      reference_title: "Fournier's gangrene mortality: A 17-year systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The highest mortality rates were due to sepsis (76%) and multiple organ
        failure (66%), followed by respiratory (19.4%), renal (18%),
        cardiovascular (15.7%), and hepatic (5%) mortality.
      explanation: >-
        Meta-analysis identifies sepsis and multiorgan failure as the leading
        causes of death.
  - target: Subcutaneous emphysema
    description: >-
      Gas in the infected subcutaneous tissue is palpable as crepitus and
      visible on CT, but is not present in every case.
    evidence:
    - reference: PMID:18349455
      reference_title: "Fournier gangrene: role of imaging."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Subcutaneous emphysema is the hallmark of Fournier gangrene but is not
        seen in all cases.
      explanation: >-
        Identifies subcutaneous gas as the hallmark imaging consequence of the
        infection.
  - target: Fever
    description: >-
      The infection produces fever as part of the systemic inflammatory
      response.
    evidence:
    - reference: PMID:41439154
      reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Diagnosis is primarily clinical, based on symptoms (scrotal/labial pain,
        erythema, crepitus, and fever)
      explanation: >-
        Lists fever among the presenting features of the infection.
  evidence:
  - reference: PMID:41439154
    reference_title: "Defining the Standard of Care in Fournier's Gangrene-An Umbrella Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Microbiologically, FG is consistently described as a polymicrobial
      infection involving synergistic aerobes and anaerobes
    explanation: >-
      Umbrella review states the synergistic aerobic-anaerobic nature of the

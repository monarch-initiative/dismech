pathophysiology:
- name: Mycobacterium tuberculosis Entry into the Pleural Space
  role: trigger
  description: >-
    Bacilli and caseous material enter the pleural space, most often by rupture
    of a subpleural caseous focus, and less often by spillage from a parenchymal
    cavity or bronchopleural fistula, direct nodal extension, haematogenous
    spread or surgery.
  biological_scale: ORGANISM
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:26265445
    reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      weeks after primary infection a subpleural caseous focus ruptures into
      the pleural space where mycobacterial antigens interact with previously
      sensitized T cells to produce a delayed type hypersensitivity reaction
    explanation: >-
      Describes rupture of a subpleural caseous focus as the initiating event of
      the tuberculous effusion from which most empyemas develop.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TB empyema can also be caused by spillage of caseous material from a
      parenchymal focus or bronchopleural fistula, by direct extension from
      adjacent nodes, by haematogenous spread or following surgical
      interventions such as pneumonectomy or oleothorax
    explanation: >-
      Lists the other routes that seed a tuberculous empyema directly.
  downstream:
  - target: Pleural Delayed-Type Hypersensitivity Response
    causal_link_type: DIRECT
    description: >-
      Mycobacterial antigens in the pleural space meet sensitised T cells.
    evidence:
    - reference: PMID:26265445
      reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        weeks after primary infection a subpleural caseous focus ruptures into
        the pleural space where mycobacterial antigens interact with previously
        sensitized T cells to produce a delayed type hypersensitivity reaction
      explanation: >-
        States the causal step from pleural seeding to the hypersensitivity
        response.
  - target: Multibacillary Purulent Pleural Infection
    causal_link_type: DIRECT
    description: >-
      Spillage of caseous material or a fistula seeds a high bacillary load
      directly, without a preceding effusion.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        TB empyema can also be caused by spillage of caseous material from a
        parenchymal focus or bronchopleural fistula
      explanation: >-
        Supports direct seeding of an empyema by caseous spillage.
- name: Pleural Delayed-Type Hypersensitivity Response
  description: >-
    Precursor state. Interferon-gamma-producing T cells infiltrate the pleural
    space and produce the common lymphocytic tuberculous effusion, which usually
    contains the bacilli and resolves. This is the node that the
    Tuberculous Pleuritis node of Tuberculosis.yaml describes; it is included
    here because a minority of untreated effusions progress to empyema.
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: interferon-gamma production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: INCREASED
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The influx of IFN-γ-producing T-cells generally effects a highly
      efficient anti-TB response, which may explain the paucibacillary nature
      of most tuberculous effusions
    explanation: >-
      Describes the Th1 response that keeps the common effusion paucibacillary.
  - reference: PMID:10197400
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is rare compared with tuberculous pleural effusions that result from
      an exaggerated inflammatory response to a localized paucibacillary
      pleural infection with tuberculosis.
    explanation: >-
      Contrasts the paucibacillary hypersensitivity effusion with empyema.
  downstream:
  - target: Multibacillary Purulent Pleural Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Uncommonly, an untreated effusion fails to contain the bacilli and
      progresses to empyema. What tips the balance is not established.
    evidence:
    - reference: PMID:26265445
      reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        Uncommonly, untreated effusions proceed directly to a tuberculous
        empyema.
      explanation: >-
        States progression from untreated effusion to empyema.
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        It represents a spectrum of disease that can variably self-resolve or
        progress to TB empyema with severe sequelae such as chronic fibrothorax
        or empyema necessitans
      explanation: >-
        Places empyema at the progressive end of the pleural tuberculosis
        spectrum.
  - target: Pleural effusion
    causal_link_type: DIRECT
    description: >-
      The lymphocytic influx produces the persistent effusion.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        followed by a protracted influx of pre-sensitised T-lymphocytes into the
        pleural space that give rise to persistent pleural effusion
      explanation: >-
        Links the T-lymphocyte influx to the effusion.

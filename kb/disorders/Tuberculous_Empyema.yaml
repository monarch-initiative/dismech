name: Tuberculous Empyema
creation_date: "2026-11-26T03:48:37Z"
description: >-
  Tuberculous empyema is a chronic, active Mycobacterium tuberculosis infection
  of the pleural space in which the pleural fluid is frank pus containing large
  numbers of tubercle bacilli. It is distinct from the common tuberculous
  pleural effusion (tuberculous pleuritis), which is a paucibacillary,
  lymphocytic, delayed-hypersensitivity reaction that usually resolves.
  Tuberculous empyema arises when an untreated effusion progresses, or when
  caseous material spills into the pleura from a subpleural or parenchymal
  focus or through a bronchopleural fistula, and historically after collapse
  therapy. The infection is walled off by a thick, often calcified pleural rind,
  can persist for years with few symptoms, and presents with purulent,
  neutrophilic, low-glucose, low-pH fluid that is usually smear positive for
  acid-fast bacilli. Complications include bronchopleural fistula with
  pyopneumothorax, empyema necessitans, fibrothorax with a trapped lung and
  restrictive ventilatory defect, acquired drug resistance from poor drug
  penetration through the rind, and, after decades, pyothorax-associated
  lymphoma. Treatment is antituberculous chemotherapy with drainage of the
  pleural space, and decortication when the lung is trapped.
category: Infectious Disease
disease_term:
  preferred_term: tuberculous empyema
  term:
    id: MONDO:0005999
    label: tuberculous empyema
parents:
- Tuberculosis
- Pleural tuberculosis
- Pleural empyema
synonyms:
- TB empyema
- chronic tuberculous empyema
- tuberculous pyothorax
notes: >-
  Scope. MONDO:0005999 sits under pleural tuberculosis (MONDO:0005922), pleural
  empyema and empyema. The common tuberculous pleural effusion is curated as the
  Tuberculous Pleuritis node of Tuberculosis.yaml; this entry covers only the
  purulent, multibacillary form, and the hypersensitivity effusion appears here
  only as the precursor node from which a minority of cases progress. The
  parapneumonic_empyema_formation module is not used as a conformance target
  because its own description excludes tuberculous pleural disease. The
  literature is mostly retrospective single-centre series from high-burden
  settings (India, China, Taiwan, Nigeria), one prospective comparison against
  non-tuberculous empyema, case reports of drug penetration, and narrative
  reviews; no randomised trial of any intervention in tuberculous empyema was
  found. Histopathology of the pleural peel is not curated because no cached
  source described it specifically for tuberculous empyema. No source
  documented Mycobacterium bovis or another member of the M. tuberculosis
  complex as a cause, so no non-human reservoir is recorded. Cough and
  haemoptysis are left without an upstream edge: in the cited series they
  accompany coexisting parenchymal tuberculosis, which this entry does not
  model as a node. Seeded from
  research/Tuberculous_Empyema-deep-research-claude_code.md, used as leads
  only; every claim is supported by an evidence item quoting a cached abstract
  or full text.
review_notes: >-
  Deliberately lumped. No has_subtypes rows are declared. MONDO:0005999 has no
  MONDO children, and the candidate strata in the literature were checked
  against the infectious-disease granularity ladder: acute empyema evolving
  from a recent effusion versus chronic post-tuberculous empyema discovered
  decades later, adult versus paediatric disease, drug-susceptible versus
  drug-resistant infection, and the historical post-collapse-therapy form.
  These differ in tempo and surgical difficulty but share organism, mechanism,
  diagnostic approach and first-line management, and they are recorded as
  progression phases and in treatment descriptions rather than as subtypes. No
  organism stratum (M. bovis, M. africanum) was documented for this entity.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes tuberculosis. In
    tuberculous empyema it multiplies to a high bacillary load within a
    sequestered, purulent pleural space.
  evidence:
  - reference: PMID:10197400
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous empyema represents a chronic, active infection of the pleural
      space that contains a large number of tubercle bacilli.
    explanation: >-
      Defines tuberculous empyema as active pleural infection by tubercle
      bacilli at high load.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans as airborne droplet nuclei.
    Tuberculous empyema is not acquired by a separate route; it arises within an
    already infected host from a pleural, subpleural, parenchymal or nodal
    focus.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The host acquires M. tuberculosis by inhaling airborne bacilli. Pleural
    involvement follows later by spread within the host (see the pathophysiology
    node on entry into the pleural space), not by a separate transmission route.
- name: Within-host spread into the pleural space
  description: >-
    Bacilli and caseous material reach the pleura by rupture of a subpleural
    caseous focus, spillage from a parenchymal focus or through a
    bronchopleural fistula, direct extension from adjacent lymph nodes,
    haematogenous spread, or after thoracic surgery.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TB empyema can also be caused by spillage of caseous material from a
      parenchymal focus or bronchopleural fistula, by direct extension from
      adjacent nodes, by haematogenous spread or following surgical
      interventions such as pneumonectomy or oleothorax
    explanation: >-
      Lists the within-host routes that seed a tuberculous empyema.
prevalence:
- population: Culture-confirmed pleural tuberculosis, Shandong Provincial Chest Hospital, China, 2011-2015
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Empyema, defined as grossly purulent pleural fluid, was present in 42 of 474
    culture-confirmed pleural tuberculosis patients (8.9%). This is a share of
    pleural tuberculosis cases in a referral hospital, not a population
    prevalence or incidence, so no rate is asserted.
  evidence:
  - reference: PMID:31863026
    reference_title: Risk factors for tuberculous empyema in pleural tuberculosis patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The percentage of empyema patients was 8.9% (42 cases).
    explanation: >-
      Proportion of culture-confirmed pleural tuberculosis that was empyema in a
      retrospective cohort of 474 patients.
- population: Adults with non-surgical thoracic empyema, tertiary hospital, eastern India
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Tuberculosis caused 29 of 75 adult thoracic empyemas (38.7%) in a
    prospective series. This is an aetiological fraction among empyemas, not an
    occurrence rate.
  evidence:
  - reference: PMID:21139713
    reference_title: "Adult thoracic empyema: A comparative analysis of tuberculous and nontuberculous etiology in 75 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Seventy-five cases of empyema were seen during the study period, of which
      46 (61.3%) were of nontuberculous etiology while tuberculosis constituted
      29 (38.7%) cases.
    explanation: >-
      Share of adult empyema due to tuberculosis in a high-burden setting.
environmental:
- name: HIV co-infection
  description: >-
    People living with HIV have more pleural tuberculosis, and in them the
    impaired local lymphocytic response leaves a higher pleural mycobacterial
    load, the feature that defines empyema. No cached source quantified HIV as
    a risk factor for tuberculous empyema specifically, so the link to the
    multibacillary node is indirect.
  influences_mechanisms:
  - target: Multibacillary Purulent Pleural Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired local lymphocytic control in HIV raises the pleural bacillary
      load.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Although in PLHIV, where mycobacterial load is often higher due to an
        impaired local lymphocytic immune response, AFB are visualised in ∼20%
        of cases
      explanation: >-
        Links HIV to a higher pleural mycobacterial load in pleural
        tuberculosis generally, not in empyema alone.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is well recognised that people living with HIV (PLHIV) have higher
      rates of extrapulmonary TB
    explanation: >-
      HIV raises the rate of extrapulmonary, including pleural, tuberculosis.
  - reference: PMID:31863026
    reference_title: Risk factors for tuberculous empyema in pleural tuberculosis patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      for empyema, the mortality rate among HIV-infected patients is higher
      than that of non-infected patients (26.2% vs 5.1%)
    explanation: >-
      Background statement in a pleural tuberculosis cohort paper on higher
      empyema mortality with HIV; it refers to empyema in general rather than
      to tuberculous empyema alone.
- name: Collapse therapy for pulmonary tuberculosis
  description: >-
    Artificial pneumothorax, thoracoplasty and related collapse therapies, used
    for cavitary pulmonary tuberculosis before effective chemotherapy, are a
    historical, now rare, cause of chronic tuberculous empyema and the setting
    in which pyothorax-associated lymphoma later develops. No ECTO exposure
    term for a surgical or iatrogenic procedure was bound.
  influences_mechanisms:
  - target: Mycobacterium tuberculosis Entry into the Pleural Space
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Collapse therapy introduced or sustained infection of the pleural space.
    evidence:
    - reference: PMID:26265445
      reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: >-
        With few exceptions it is a late complication of a primary tuberculous
        pleural effusion or more rarely now that effective anti-tuberculosis
        (TB) drugs are available, collapse therapy (artificial pneumothorax,
        thoracoplasty etc.) for cavitary pulmonary TB
      explanation: >-
        Names collapse therapy as a historical cause of chronic tuberculous
        empyema.
  evidence:
  - reference: PMID:26265445
    reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      With few exceptions it is a late complication of a primary tuberculous

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histologically PAL usually shows a diffuse proliferation of large cells of
      B-cell type (diffuse large B-cell lymphoma [DLBL]).
    explanation: >-
      The lymphoma is usually a diffuse large B-cell lymphoma.
progression:
- phase: Tuberculous pleural effusion
  notes: >-
    The precursor in most cases: a lymphocytic hypersensitivity effusion after
    rupture of a subpleural focus, which usually resolves.
  evidence:
  - reference: PMID:26265445
    reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Uncommonly, untreated effusions proceed directly to a tuberculous
      empyema.
    explanation: >-
      Places the effusion before empyema in the natural history.
- phase: Exudative, fibrinopurulent and organising empyema
  notes: >-
    Like other empyemas, tuberculous empyema is staged as exudative (I),
    fibrinopurulent (II) and organising (III). Surgical series stage most
    operated tuberculous empyemas as II or III.
  evidence:
  - reference: PMID:31863026
    reference_title: Risk factors for tuberculous empyema in pleural tuberculosis patients.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      an empyema refers to a collection of pus in the pleural space and could
      be classified into three progressive stages, namely the exudative (I),
      fibrinopurulent (II) and organizing (III) phrases
    explanation: >-
      States the three-stage empyema classification used for tuberculous
      empyema in the surgical literature.
- phase: Chronic tuberculous empyema
  notes: >-
    A sequestered, walled-off infection that can persist for years or decades,
    often found on a chest radiograph or when a bronchopleural fistula or
    empyema necessitans develops.
  evidence:
  - reference: PMID:10197400
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The inflammatory process may be present for years with a paucity of
      clinical symptoms.
    explanation: >-
      Describes the chronic, often silent phase.
- phase: Fibrothorax and late sequelae
  notes: >-
    Fusion and scarring of the pleural space with a trapped lung and chest
    deformity; decades later, rarely, pyothorax-associated lymphoma.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      usually leading to severe scarring and fusion of the pleural space
      causing deformity of the chest cavity, termed a “fibrothorax”
    explanation: >-
      Describes fibrothorax as the late outcome.
diagnosis:
- name: Thoracentesis with pleural fluid microbiology
  description: >-
    Aspiration yields purulent fluid that is usually smear positive for
    acid-fast bacilli, unlike the paucibacillary tuberculous effusion. Culture
    is less sensitive than smear in some series because the acidic, anaerobic
    pus impairs growth; nucleic acid amplification of pus adds yield.
  diagnosis_term:
    preferred_term: Thoracentesis
    term:
      id: NCIT:C15392
      label: Thoracentesis
  evidence:
  - reference: PMID:21139713
    reference_title: "Adult thoracic empyema: A comparative analysis of tuberculous and nontuberculous etiology in 75 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pleural fluid smear for AFB was positive in 93.1% (27cases) of
      tuberculous empyema
    explanation: >-
      High pleural fluid smear positivity in 29 tuberculous empyemas.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In keeping with the paucibacillary nature of pTB, the yield of direct
      microscopy is inherently low, except in the setting of TB empyema
    explanation: >-
      Contrasts smear yield in empyema with that in ordinary pleural
      tuberculosis.
  - reference: PMID:21139713
    reference_title: "Adult thoracic empyema: A comparative analysis of tuberculous and nontuberculous etiology in 75 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The frequent culture negativity despite positive smears for M.
      tuberculosis in empyema fluid is attributed to the acidic, anaerobic
      environment of the pleural fluid
    explanation: >-
      Discussion of a primary case series restating why culture can lag smear
      in tuberculous pus.
  - reference: PMID:37221872
    reference_title: "Clinicopathological outcome in 27 children with tuberculous empyema in Shandong Provincial Chest Hospital, Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Six (60%) of 10 patients were TB-RT-PCR-positive in pus or purulent
      fluid.
    explanation: >-
      Yield of real-time PCR on pus in paediatric tuberculous empyema.
- name: Pleural fluid biochemistry
  description: >-
    Pleural fluid glucose is lower and lactate dehydrogenase higher than in
    non-empyema pleural tuberculosis, and the pH falls as an empyema develops.
  evidence:
  - reference: PMID:31863026
    reference_title: Risk factors for tuberculous empyema in pleural tuberculosis patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Glucose (mmol/L) | 4.18 (2.65, 5.75) | 2.90 (0.22, 4.62) | 4.10 (2.37,
      5.69) | 0.802 (0.697, 0.922) | 0.002
    explanation: >-
      Table row: median pleural glucose 2.90 mmol/L with empyema against 4.18
      mmol/L without.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      in an uncomplicated TB pleural effusion the pH is usually above 7.3;
      however, as an empyema develops the pH will classically reduce
    explanation: >-
      Falling pleural pH marks progression to empyema.
- name: Pleural fluid adenosine deaminase
  description: >-
    Pleural fluid adenosine deaminase is raised in tuberculous pleural disease,
    and higher levels were independently associated with empyema among
    culture-confirmed cases. Very high levels are unusual in tuberculosis and
    suggest bacterial empyema, so a very high value in suspected tuberculous
    empyema should raise the question of pyogenic infection.
  evidence:
  - reference: PMID:31863026
    reference_title: Risk factors for tuberculous empyema in pleural tuberculosis patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      pleural adenosine deaminase (ADA, >88 U/L) (adjusted OR = 3.367, 95% CI:
      1.533, 7.395)
    explanation: >-
      Pleural ADA above 88 U/L was independently associated with empyema in
      474 culture-confirmed pleural tuberculosis patients.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In fact, very high levels (>250 U·L−1) are unusual in TB, and should
      prompt consideration of an alternative diagnosis such as bacterial
      empyema or lymphoma
    explanation: >-
      Limits ADA interpretation at very high values.
- name: Chest computed tomography
  description: >-
    CT shows loculated pleural fluid surrounded by a thick, often calcified
    pleural rind with rib thickening, and frequently coexisting parenchymal
    tuberculosis. Preoperative CT volumes predict lung-function gain after
    decortication.
  diagnosis_term:
    preferred_term: Chest computed tomography
    term:
      id: NCIT:C191501
      label: Chest Computed Tomography
  evidence:
  - reference: PMID:10197400
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of tuberculous empyema is suspected on computed tomography
      imaging by finding a thick, calcific pleural rind and rib thickening
      surrounding loculated pleural fluid.
    explanation: >-
      States the CT findings that suggest tuberculous empyema.
  - reference: PMID:21139713
    reference_title: "Adult thoracic empyema: A comparative analysis of tuberculous and nontuberculous etiology in 75 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Associated parenchymal lesion in the same or opposite lung was also
      significantly higher in the tubercular group (20 cases, 68.8%)
    explanation: >-
      Coexisting parenchymal disease is common on imaging.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard first-line antituberculous therapy, given for longer than in
    uncomplicated pleural tuberculosis and always combined with drainage of the
    pleural space. Outcomes are worse than for pulmonary tuberculosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Multibacillary Purulent Pleural Infection
    treatment_effect: INHIBITS
    description: >-
      Kills the pleural bacilli, with drainage as source control.
  evidence:
  - reference: PMID:10197400
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment consists of pleural space drainage and antituberculous
      chemotherapy.
    explanation: >-
      States the two components of treatment.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A standard 6-month regimen is recommended for drug-sensitive pTB, but
      longer regimens are commonly employed in complicated, loculated
      tuberculous effusions and in TB empyema.
    explanation: >-
      Supports longer regimens in tuberculous empyema.
  - reference: PMID:10201053
    reference_title: Tuberculous empyema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We conclude that the treatment outcome of tuberculous empyema is less
      satisfactory than that of pulmonary tuberculosis
    explanation: >-
      Outcome of chemotherapy with drainage in 35 patients, of whom 62.9% were
      treated successfully.
- name: High-End Dosing Guided by Therapeutic Drug Monitoring
  description: >-
    Antituberculous drugs dosed to the upper end of the serum range, with
    paired serum and pleural fluid concentrations measured, to overcome poor
    penetration into the empyema. Supported by a case report and review, and
    combined with catheter drainage in that report.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
    - preferred_term: moxifloxacin
      term:
        id: CHEBI:63611
        label: moxifloxacin
  target_mechanisms:
  - target: Impaired Antituberculous Drug Penetration into the Pleural Space
    treatment_effect: INHIBITS
    description: >-
      Higher serum levels bring pleural concentrations into the therapeutic
      range.
  evidence:
  - reference: PMID:26265445
    reference_title: "Therapeutic drug monitoring and the conservative management of chronic tuberculous empyema: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When serum concentrations of the anti-TB drugs isoniazid, pyrazinamide and
      ethambutol at the high end of the normal range are achieved, pleural fluid
      concentrations at the low end of the normal range may be anticipated in
      CTE.
    explanation: >-
      Pharmacokinetic conclusion from the index case and two published cases.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Suggested strategies to counter this poor penetration include high-end
      dosing of anti-TB medications
    explanation: >-
      Review endorsement of high-end dosing.
- name: Tube Thoracostomy Drainage
  description: >-
    Intercostal tube or image-guided catheter drainage of the pus as source
    control. Drainage is prolonged in tuberculous empyema, often over a month.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Tube thoracostomy
    term:
      id: NCIT:C148463
      label: Tube Thoracostomy
  target_mechanisms:
  - target: Multibacillary Purulent Pleural Infection
    treatment_effect: INHIBITS
    description: >-
      Evacuates the infected pleural space and reduces the bacillary burden.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There is also a role for drainage of TB empyema as source control and to
      reduce the infectious burden
    explanation: >-
      Supports drainage as source control.
  - reference: PMID:21139713
    reference_title: "Adult thoracic empyema: A comparative analysis of tuberculous and nontuberculous etiology in 75 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Duration of illness and mean duration of chest tube drainage were longer
      (48.7 vs. 23.2 days) in patients with tuberculous empyema.
    explanation: >-
      Chest tube drainage lasted twice as long in tuberculous empyema.
- name: Decortication
  description: >-
    Surgical removal of the pleural peel to re-expand a trapped lung, by
    thoracotomy or video-assisted thoracoscopic surgery, including uniportal
    VATS for stage III disease. Large Chinese series report no perioperative
    deaths and high rates of full re-expansion, with prolonged air leak the
    commonest complication; drug-resistant disease makes surgery harder and
    raises complications. Operating after more than six weeks of
    chemotherapy gave better re-expansion than earlier surgery in one
    prospective comparison.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Decortication
    term:
      id: NCIT:C28139
      label: Decortication
  target_mechanisms:
  - target: Lung Entrapment and Fibrothorax
    treatment_effect: INHIBITS
    description: >-
      Removing the peel frees the lung to re-expand.
  - target: Pleural Fibrocalcific Rind Formation
    treatment_effect: INHIBITS
    description: >-
      Resects the thickened pleura.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      surgical intervention with decortication and/or pleurectomy may be
      required in cases of pleural thickening causing encasement of the lung or
      TB empyema to control infection, relieve symptoms and prevent progression
      to fibrothorax
    explanation: >-
      States the indications for decortication.
  - reference: PMID:36329427
    reference_title: "The efficacy and safety of uniportal video-assisted thoracic surgery on the treatment for stage II-III tuberculous empyema: a single-arm clinical retrospective study from 2016 to 2021 in a thoracic surgery center in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All stage II TE achieved complete lung re-expansion after surgery while
      84.22%(315/374) of stage III achieved complete lung re-expansion
    explanation: >-
      Re-expansion after uniportal VATS in 439 patients, with no deaths.
  - reference: PMID:34954953
    reference_title: "[Uniportal thoracoscopic decortication for stage Ⅲ tuberculous empyema of 158 cases]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The incidence of prolonged air leaks (>5 days) was 80.3%(126/157).
    explanation: >-
      Prolonged air leak is the common morbidity after decortication for stage
      III disease.
  - reference: PMID:37812210
    reference_title: The safety and efficacy of decortication for stage III drug-resistant tuberculous empyema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Decortication is a safe, effective and feasible option for patients with
      stage III drug-resistant TE, although the operation is difficult and
      risky.
    explanation: >-
      Supports decortication in drug-resistant stage III disease, with its
      difficulty.
  - reference: PMID:37221872
    reference_title: "Clinicopathological outcome in 27 children with tuberculous empyema in Shandong Provincial Chest Hospital, Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In childhood TE, aggressive surgical management is associated with a
      favourable outcome.
    explanation: >-
      Paediatric series in which 22 of 27 children underwent decortication and
      all were treated successfully.
  - reference: PMID:33575146
    reference_title: Role of Anti-Tuberculous Treatment in the Outcome of Decortication for Chronic Tuberculous Empyema.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In Group B, 21 (60%) participants had full post-operative expansion of
      lungs, compared to eight (22.8%) in Group A (p=0.002).
    explanation: >-
      Prospective comparison of 70 patients: decortication after more than six
      weeks of antituberculous therapy gave full re-expansion more often than
      earlier surgery, supporting a period of chemotherapy before operation.

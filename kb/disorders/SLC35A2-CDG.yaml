discussions:
- discussion_id: gap_slc35a2_ogalnac_versus_nglycan_lesion
  prompt: >-
    Is the epileptogenic lesion in SLC35A2 disease a generalized
    hypogalactosylation of N-glycans, or specifically a truncation of O-GalNAc
    glycans on extracellular matrix proteins?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hypogalactosylation of Glycans
  - pathophysiology#Brain Somatic Mosaicism and MOGHE
  rationale: >-
    SLC35A2 supplies UDP-galactose to every galactosyltransferase in the Golgi,
    so the default reading is that all galactosylated glycoconjugates are
    affected together and the brain is simply the most sensitive tissue. A 2026
    forebrain-knockout study reports something narrower - a specific defect in
    O-GalNAc glycan synthesis with other galactose-containing glycoconjugates
    intact, truncated precursors accumulating on extracellular matrix
    molecules, and a correlation between variant burden and glycan truncation
    in human epilepsy tissue. If that holds, the therapeutic target and the
    biomarker both change, and galactose supplementation would be expected to
    work only insofar as it repletes the O-GalNAc branch. The finding is a
    preprint and has not been reproduced, so this entry does not yet curate a
    dedicated O-GalNAc node.
  proposed_experiments:
  - experiment_id: exp_slc35a2_glycan_class_survey_human_tissue
    name: Glycan-class survey of resected MOGHE and germline SLC35A2 tissue
    description: >-
      Apply matched N-glycan, O-GalNAc, and glycolipid profiling to resected
      MOGHE epileptogenic tissue and, where available, germline SLC35A2-CDG
      brain, against epilepsy-surgery controls. If O-GalNAc truncation is
      selective in both arms, it becomes the disease-defining lesion; if
      N-glycan hypogalactosylation dominates in the germline arm, the two
      subtypes differ mechanistically as well as clinically.
  - experiment_id: exp_slc35a2_galactose_response_by_glycan_class
    name: Which glycan class does galactose supplementation actually repair
    description: >-
      In SLC35A2-deficient neural cells, measure N-glycan and O-GalNAc
      galactosylation before and after galactose loading. A galactose response
      confined to one class would explain the partial and inconsistent clinical
      responses reported for galactose supplementation in this disorder.
notes: >-
  Two disease forms share this gene and little else. Germline SLC35A2-CDG is a
  multisystem X-linked disorder detectable by serum transferrin screening;
  brain-restricted somatic mosaicism causes MOGHE, where blood is typically
  wild type, transferrin screening is normal, and the diagnosis requires
  sequencing resected epileptogenic tissue. Phenotypes that depend on
  body-wide transporter deficiency (transferrin profile, skeletal
  abnormalities, dysmorphic features, failure to thrive) are tagged to the
  Germline subtype for that reason. Shared phenotypes - epilepsy, epileptic
  spasms, developmental delay - are deliberately left untagged, because both
  arms produce them.

  A 2026 preprint (PMID:41867720) proposes that the lesion is specifically
  truncated O-GalNAc glycosylation rather than generalized
  hypogalactosylation. That would be a substantial reframing, and it is
  recorded as an open knowledge gap rather than curated as mechanism, because
  it is a preprint and unreplicated.

parents:
- congenital disorder of glycosylation
has_subtypes:
- name: Germline
  display_name: Germline SLC35A2-CDG (X-linked, multisystem)
  description: >-
    De novo or inherited germline SLC35A2 variants present in every tissue.
    Because the UDP-galactose transporter is deficient body-wide, the
    presentation is multisystem: developmental and epileptic encephalopathy with
    epileptic spasms, global developmental delay, hypotonia, dysmorphic and
    skeletal features, failure to thrive, and an abnormal type II serum
    transferrin profile that makes the disorder detectable by standard CDG
    biochemical screening.
  evidence:
  - reference: PMID:41373710
    reference_title: "SLC35A2-Related Brain Disorders: Genetics, Pathophysiology, and Therapeutic Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      germline or de novo mutations, which give rise to SLC35A2-CDG and result
      in widespread neurodevelopmental impairment
    explanation: >-
      The review draws the germline-versus-somatic split this subtype models,
      and assigns the widespread multisystem phenotype to the germline arm.
- name: Somatic MOGHE
  display_name: Brain-restricted somatic mosaicism (MOGHE)
  description: >-
    Post-zygotic SLC35A2 variants confined to a neuroglial clone in the
    developing brain. Blood and fibroblasts are typically wild type, so serum
    transferrin screening is normal and the diagnosis rests on sequencing
    resected epileptogenic tissue. The disease is focal: mild malformation of
    cortical development with oligodendroglial hyperplasia in epilepsy (MOGHE),
    presenting as drug-resistant focal epilepsy, most often infantile epileptic
    spasms syndrome, and treated by resection rather than by systemic therapy.
    This arm shares a gene with germline SLC35A2-CDG but not a clinical
    specialty, a diagnostic route, or a treatment.
  evidence:
  - reference: PMID:41373710
    reference_title: "SLC35A2-Related Brain Disorders: Genetics, Pathophysiology, and Therapeutic Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      somatic, brain-restricted mutations, which underlie focal cortical
      malformations such as MOGHE and non-lesional focal epilepsies
    explanation: >-
      Defines the brain-restricted somatic arm as a distinct category of
      SLC35A2 disease.
  - reference: PMID:42542984
    reference_title: "Mild malformation of cortical development with oligodendroglial hyperplasia in epilepsy (MOGHE): genetics, mechanisms and precision therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent genetic analyses of epileptogenic tissue resected from individuals
      with MOGHE have identified somatic mosaic loss-of-function variants in
      SLC35A2.
    explanation: >-
      Establishes the diagnostic route - sequencing resected epileptogenic
      tissue - that distinguishes this arm in practice.
inheritance:
- name: X-linked

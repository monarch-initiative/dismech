  notes: >-
    A variant detection rate within a disease-ascertained cohort - 3.38% of 148 Chinese men with
    IHH carried an IL17RD variant - not a population prevalence, and not a rate of HH18 as a
    diagnosis, since most carriers also carry variants elsewhere. `measure_type` and
    `prevalence_class` are left UNKNOWN rather than converted to a rate, because the quantity is
    not a population frequency. The same source states plainly that the prevalence of IL17RD
    variants is unknown.

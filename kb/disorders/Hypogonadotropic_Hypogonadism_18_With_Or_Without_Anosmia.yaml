      term:
        id: CHEBI:17347
        label: testosterone
  target_mechanisms:
  - target: Absent or Incomplete Puberty
    treatment_effect: BYPASSES
    description: >-
      Symptomatic and downstream: exogenous sex steroid produces the pubertal changes without
      acting on the hypothalamic defect, so it is recorded against the phenotype rather than an
      upstream node.
    evidence:
    - reference: PMID:20301509
      reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "To induce and maintain secondary sex characteristics, gradually increasing doses of testosterone or human chorionic gonadotropin (hCG) injections in males or estrogen and progestin in females"
      explanation: The management recommendation for the disease class.
  notes: >-
    No treatment evidence specific to IL17RD carriers was found in the sources read here;
    management is the general CHH regimen and is cited as such, from GeneReviews rather than from
    an IL17RD series.
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To induce and maintain secondary sex characteristics, gradually increasing doses of testosterone or human chorionic gonadotropin (hCG) injections in males or estrogen and progestin in females"
    explanation: The recommendation, stated for isolated GnRH deficiency as a whole.
- name: Gonadotropin or Pulsatile GnRH Therapy for Fertility
  description: >-
    Combined gonadotropin therapy (hCG with hMG or recombinant FSH), or pulsatile GnRH delivery,
    to drive gametogenesis when fertility is the goal. Pulsatile GnRH is the one intervention here
    that acts at the level of the missing signal itself, replacing the hypothalamic pulse
    generator rather than substituting for its end product - which is why it works only when the
    pituitary and gonads are otherwise intact.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gonadorelin
      term:
        id: CHEBI:5520
        label: gonadorelin
    - preferred_term: human chorionic gonadotropin
      term:
        id: CHEBI:81570
        label: Chorionic gonadotropin
  target_mechanisms:
  - target: GnRH-Driven Gonadotropin Deficiency
    treatment_effect: RESTORES
    description: >-
      Pulsatile GnRH substitutes for the absent hypothalamic signal at exactly the point the
      pathograph breaks, which is why it is recorded against this node rather than against a
      phenotype. Combined gonadotropin therapy acts one step further downstream, replacing the
      pituitary output instead.
    evidence:
    - reference: PMID:20301509
      reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "or pulsatile GnRH therapy. If conception fails despite spermatogenesis in a male or ovulation induction in a female, in vitro fertilization may be an option."
      explanation: The fertility regimen for the disease class.
  notes: >-
    As above, no IL17RD-specific outcome data exist in the sources read here: the regimen is the
    general one for isolated GnRH deficiency, and it is cited from GeneReviews rather than from
    any IL17RD series.
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "to stimulate spermatogenesis or folliculogenesis, either combined gonadotropin therapy"
    explanation: The recommendation, stated for isolated GnRH deficiency as a whole.
discussions:
- discussion_id: hh18_direction_of_fgf_signalling_change
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does an IL17RD variant increase or decrease FGF8-FGFR1 signalling in the developing
    olfactory-GnRH system, and how does either direction produce the same disease as FGFR1
    loss of function?
  attaches_to:
  - pathophysiology#Dysregulated FGF8-FGFR1 Signaling in the Developing Olfactory-GnRH System
  rationale: >-
    Sef is an antagonist, so impairing it should raise pathway output; but CHH is otherwise
    produced by FGFR1 and FGF8 loss of function, which lowers it. Both DUSP6 and the sprouties -
    also negative regulators - are implicated in the same disease, so this is not a peculiarity
    of IL17RD but a pattern that the negative-modulator class as a whole presents. No source read
    here measures signalling output for a patient IL17RD allele in a GnRH-lineage cell, so the
    node records dysregulation without a direction. Resolving it would need the patient alleles
    assayed in a relevant cell type, not in HEK293T.
- discussion_id: hh18_hearing_loss_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is hearing loss the characteristic non-reproductive feature of IL17RD-related CHH?
  attaches_to:
  - phenotypes#Sensorineural Hearing Impairment
  rationale: >-
    The association is one of the most reproducible things about this entity - 6 of 8 in the
    founding cohort, 7 of 18 across the published carriers, and the most common accompanying
    symptom in both - and it is also completely unexplained. None of the sources read here
    proposes a role for Sef in cochlear or auditory-nerve development, and no IL17RD animal model
    with an auditory phenotype was found. That combination, a strong clinical signal with no
    mechanistic account, is exactly what a knowledge gap is for.
- discussion_id: hh18_susceptibility_versus_causative
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is any IL17RD variant sufficient on its own to cause congenital hypogonadotropic
    hypogonadism?
  attaches_to:
  - pathophysiology#Oligogenic Requirement for Additional CHH Loci
  rationale: >-
    Every informative proband in the largest IL17RD series inherited the variant from an
    unaffected parent, and oligogenicity was found in most; the same cohort concluded that
    DUSP6 variants are sufficient alone while IL17RD variants act in synergy. But the comparison
    is between small numbers, the sequencing in the earlier study did not cover every CHH gene,
    and an apparently isolated IL17RD case cannot be distinguished from one with an unsequenced
    second hit. Settling this needs genome-wide analysis of IL17RD carriers with and without
    disease, not more single cases. Until then the gene is typed SUSCEPTIBILITY rather than
    CAUSATIVE, and this discussion records that the typing is a judgement about evidence rather
    than a settled biological fact.

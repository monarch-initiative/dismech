genetic:
- name: IL17RD
  notes: >-
    Encodes Sef, a transmembrane feedback antagonist of FGF signalling and a member of the fgf8
    synexpression group. The gene name is misleading: the similarity to the interleukin 17
    receptor is a sequence feature of the intracellular domain, and the biology that matters here
    is FGFR1 association and suppression of the Raf/MEK/ERK cascade.

    Reported CHH variants are heterozygous missense changes spread across the protein - p.P191L,
    p.G35V, p.S671L, p.A221T, p.I329M and p.I329V in the Chinese cohort, p.Gly701Ser in the case
    report and in two previously published patients. The recurrent p.Gly701Ser is instructive
    about the oligogenic pattern: of the three reported carriers, one also carried PROKR2 p.Y113H
    and one carried FGFR1 p.Gly348Glu with RUVBL2 p.Arg71Trp.

    No genotype-phenotype correlation has been established, and the variant detection rate in
    ascertained IHH cohorts is a few per cent - 3.38% in one series of 148 Chinese men. That is a
    detection rate within a disease cohort and says nothing about population frequency.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: IL17RD
    term:
      id: hgnc:17616
      label: IL17RD
  evidence:
  - reference: PMID:23643382
    reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Independently, IBAS predicted FGF17 and IL17RD as the two top candidates in the entire proteome on the basis of a statistical test of their protein-protein interaction patterns to proteins known to be altered in CHH."
    explanation: >-
      The computational nomination that converged with the sequencing result, which is part of
      why this gene-disease relationship was taken seriously from a small number of probands.
  - reference: PMID:32389901
    reference_title: Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six heterozygous IL17RD variants (p.P191L, p.G35V, p.S671L, p.A221T, p.I329M and p.I329V) were found in seven patients."
    explanation: The allelic spectrum and the heterozygous state, in the largest IL17RD series.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, the prevalence of IL17RD variants remains unknown, and a definitive correlation between specific IL17RD variant types and clinical phenotypes is yet to be established"
    explanation: >-
      The explicit statement that neither a prevalence nor a genotype-phenotype correlation is
      available, which is why this entry asserts neither.

progression:
- phase: Presentation
  age_range: infancy to adolescence
  notes: >-
    Two presentation windows. In infancy the sign is genital: micropenis, cryptorchidism, or
    both. Otherwise the disease surfaces in adolescence as absent or arrested puberty - the
    IL17RD carrier described in detail presented at 14.4 years with a short penis and reduced
    olfaction.
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IGD can first become apparent in infancy, adolescence, or adulthood."
    explanation: The presentation windows for the disease class.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 14.4-year-old male patient presented with a complaint of “having a short penis for over 7 years and reduced olfaction for over 5 years”."
    explanation: The adolescent presentation in an IL17RD carrier.

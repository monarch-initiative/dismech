name: Hypogonadotropic Hypogonadism 18 With or Without Anosmia
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- HH18
- IL17RD-related congenital hypogonadotropic hypogonadism
- IL17RD-related Kallmann syndrome
description: >-
  HH18 is the form of congenital hypogonadotropic hypogonadism (CHH) attributed to variants in
  IL17RD, which encodes Sef ("similar expression to fgf genes") - not an interleukin receptor in
  any functional sense, despite the name, but a transmembrane feedback antagonist of FGF
  signalling that shares only sequence similarity with the intracellular domain of the IL-17
  receptor. Sef was found in zebrafish as a member of the fgf8 synexpression group and shown to
  antagonise Ras/Raf/MEK/MAPK signalling downstream of FGF; in mammalian cells it associates with
  FGFR1 and suppresses receptor tyrosine phosphorylation and ERK activation.

  That places IL17RD in the same pathway as the genes that dominate CHH genetics. FGF8 and FGFR1
  account for around 12% of CHH, and the hypothesis that produced HH18 was explicitly that
  modulators of FGFR1 signalling would also be mutated in CHH patients. Sequencing seven such
  genes in 386 CHH probands found IL17RD variants in eight, and an interactome-based prediction
  run independently ranked IL17RD among the top two candidate genes in the entire proteome.

  Two features make this entity different from a textbook Mendelian locus, and the entry is
  organised around them rather than around them being caveats. First, the variants are almost
  always heterozygous and inherited from an unaffected parent - in a Chinese cohort every one of
  five informative probands inherited the IL17RD variant from a parent with no phenotype - and
  most patients carry additional rare variants in other CHH genes. The cohort authors' own
  conclusion is that IL17RD variants act in synergy with other CHH loci rather than alone, which
  is why this entry types IL17RD as a susceptibility locus in an oligogenic architecture rather
  than as causative. Second, the extra-reproductive phenotype is unusually consistent for CHH:
  IL17RD variants were found only in anosmic (Kallmann) patients in the founding cohort and were
  strongly linked to hearing loss, which remains the most common accompanying feature across the
  published cases.
disease_term:
  preferred_term: hypogonadotropic hypogonadism 18 with or without anosmia
  term:
    id: MONDO:0014103
    label: hypogonadotropic hypogonadism 18 with or without anosmia
parents:
- Congenital hypogonadotropic hypogonadism
- Disorders of puberty
notes: >-
  Identifiers. OMIM #615267 (HH18) and OMIM 606807 (IL17RD). Recorded in prose because the
  schema's `mappings` block carries `mondo_mappings` only and has no OMIM slot.

  Lump/split. This is curated as its own entry rather than as a `has_subtypes` row on
  `Kallmann_Syndrome`, following the precedent already in the KB: FGFR1-related CHH has a
  standalone entry (`FGFR1_Hypogonadotropic_Hypogonadism`) even though Kallmann syndrome 2 is
  also a gene-named subtype row inside `Kallmann_Syndrome`. The argument for a separate entry
  here is that HH18's mechanism is not "another CHH gene" but specifically the loss of *negative*
  feedback on the same FGF8-FGFR1 axis, and its inheritance is oligogenic rather than dominant -
  a different pathograph and a different counselling problem. A curator who prefers the lumped
  arrangement should fold this into `Kallmann_Syndrome` as an IL17RD subtype row rather than
  duplicating it; the two representations should not both exist.

  Why `relationship_type: SUSCEPTIBILITY` rather than `CAUSATIVE`. The published evidence does
  not support IL17RD variants being sufficient. They are heterozygous, inherited from unaffected
  parents, present in patients who also carry variants in other CHH genes, and the largest
  IL17RD-specific cohort concludes that they act in synergy with other loci. Typing this locus
  CAUSATIVE would assert something the sources decline to assert, so it is typed SUSCEPTIBILITY,
  and the oligogenic requirement is modelled as its own pathophysiology node rather than being
  buried in a caveat.

  Evidence base. Three human sources: the founding CHH cohort of 386 probands (PMID:23643382),
  an IL17RD/DUSP6/SPRY4-focused cohort of 196 Chinese IHH patients (PMID:32389901), and a single
  well-characterised case report that also reviews the 22 published IL17RD carriers
  (PMID:38628584). Mechanism comes from the zebrafish and cell-culture Sef literature
  (PMID:11802165, PMID:16603339), and general CHH management from GeneReviews (PMID:20301509).
  There is no IL17RD animal model of CHH cited here because none was found in these sources; the
  entry therefore carries no `animal_models` block rather than an empty gesture at one.

  What is not asserted. No prevalence figure is given for HH18: the case-report review states
  outright that the prevalence of IL17RD variants remains unknown, and the one available
  denominator is a variant detection rate within an ascertained IHH cohort, which is a different
  quantity. No genotype-phenotype correlation is asserted, for the same reason - the same source
  says none has been established.

  Deep research. A Falcon deep-research report is committed alongside this entry. It passed
  `just preflight-dr` against MONDO:0014103 with IL17RD mentioned 44 times and no rival gene
  close behind, and its reference validation resolved 17 of 17 citations with a confabulation
  rate of 0. Its term validation flagged one invented identifier, `HP:0000806`, which HP does not
  contain; that CURIE is not used here, and no ontology binding in this entry was taken from the
  report. The report was used as a lead source only - every snippet below is anchored to a PMID
  fetched into `references_cache/` and read directly.
inheritance:
- name: Oligogenic
  description: >-
    The predominant pattern for IL17RD in CHH. Most carriers have variants in at least one other
    CHH-associated gene, and the reported combinations include IL17RD with PROKR2, with FGFR1
    and RUVBL2, and with CPEB4. IL17RD is named in the schema sense as a contributing rather
    than a determining locus; see the `genetic` section, where it is typed SUSCEPTIBILITY.
  inheritance_term:
    preferred_term: Oligogenic inheritance
    term:
      id: HP:0010983
      label: Oligogenic inheritance
  evidence:
  - reference: PMID:32389901
    reference_title: Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DUSP6 alone seem sufficient to cause IHH in an autosomal dominant manner, whereas IL17RD or SPRY4 mutations may cause IHH phenotypes in synergy with variants in other IHH-associated genes."
    explanation: >-
      The sharpest statement of the distinction this entry turns on - and it is made against a
      directly comparable gene in the same pathway, DUSP6, which the same cohort does call
      sufficient.
  - reference: PMID:23643382
    reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in genes encoding components of the FGF pathway are associated with complex modes of CHH inheritance and act primarily as contributors to an oligogenic genetic architecture underlying CHH."
    explanation: >-
      The founding cohort's own conclusion about the class of genes that includes IL17RD.
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Almost all IGD-related genes have also been associated with indeterminate or oligogenic inheritance."
    explanation: >-
      Places the oligogenic pattern in its clinical context: it is the norm across CHH genes, not
      a peculiarity of IL17RD.
pathophysiology:
- name: IL17RD Variant Altering Sef Function
  description: >-
    IL17RD encodes Sef, a transmembrane protein of the fgf8 synexpression group that acts as a
    feedback-induced antagonist of FGF signalling. In zebrafish it antagonises the
    Ras/Raf/MEK/MAPK arm downstream of FGF; in mammalian cells its extracellular and
    transmembrane domains associate with FGFR1 and inhibit receptor tyrosine phosphorylation and
    the ensuing Raf/MEK/ERK cascade.

    The CHH-associated variants are missense changes distributed across the protein, and most of
    those tested altered protein function in vitro. What that alteration does to signalling in a
    GnRH neuron is not established: the assays are heterologous, the variants are heterozygous,
    and no source read here measures FGF signalling output in patient-derived tissue.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: IL17RD
    term:
      id: hgnc:17616
      label: IL17RD
  biological_processes:
  - preferred_term: Sef-mediated negative feedback on FGF receptor signalling
    modifier: ABNORMAL
    term:
      id: GO:0040037
      label: negative regulation of fibroblast growth factor receptor signaling pathway
  genetic_context:
    functional_impact_category: UNKNOWN
    zygosity: HETEROZYGOUS
    description: >-
      Reported IL17RD variants in CHH are heterozygous missense changes. Most altered protein
      function in the founding study's in-vitro assays, but the direction of that alteration in
      the developing olfactory-GnRH system is not established, so the impact category is left
      UNKNOWN rather than being recorded as loss of function.
  downstream:
  - target: Dysregulated FGF8-FGFR1 Signaling in the Developing Olfactory-GnRH System
    description: >-
      An altered feedback antagonist changes the gain of the pathway it regulates. The link is
      inferred from Sef's established role as an FGFR1-associated inhibitor plus the in-vitro
      demonstration that CHH variants alter protein function; it has not been measured in
      GnRH-lineage cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural Hearing Impairment
    description: >-
      The strongest and least explained association in this disease. IL17RD variants were found
      only in anosmic patients in the founding cohort and were strongly linked to hearing loss,
      and hearing loss remains the most common accompanying feature in the published carriers.
      No mechanism connecting Sef to cochlear development is offered by any source read here, so
      this edge records a reproducible clinical association whose intermediates are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:11802165
    reference_title: Sef is a feedback-induced antagonist of Ras/MAPK-mediated FGF signalling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Here we show that in zebrafish, Sef functions as a feedback-induced antagonist of Ras/Raf/MEK/MAPK-mediated FGF signalling."
    explanation: >-
      Establishes the normal function of the gene product. INDIRECT with respect to the human
      disease: it is zebrafish developmental biology, and it predates any link to CHH.
  - reference: PMID:16603339
    reference_title: A role for extracellular and transmembrane domains of Sef in Sef-mediated inhibition of FGF signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We also showed that SefECTM associated with FGFR1, and inhibited FGF-induced ERK activation in HEK293T cells."
    explanation: >-
      Places Sef physically on FGFR1 in a mammalian cell system, which is the specific pathway
      connection that makes IL17RD a candidate CHH gene at all.
  - reference: PMID:23643382
    reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the FGF17 and IL17RD mutations altered protein function in vitro."
    explanation: >-
      The functional evidence that the patient variants are not silent, stated with the hedge the
      authors used.
- name: Oligogenic Requirement for Additional CHH Loci
  description: >-
    An IL17RD variant on its own is usually not enough. In the IL17RD-focused Chinese cohort,
    every informative proband inherited the variant from an unaffected parent, and more than half
    carried variants in additional CHH genes; the published case reports repeat the pattern, with
    IL17RD paired with PROKR2, with FGFR1 plus RUVBL2, and with CPEB4. Whatever the IL17RD change
    does to FGF signalling, the disease appears where it is combined with a second hit.

    This node exists so the requirement is a step in the causal chain rather than a caveat
    attached to one. It is also the reason recurrence-risk counselling in HH18 cannot be run off
    a dominant model.
  role: modifier
  biological_scale: ORGANISM
  downstream:
  - target: Dysregulated FGF8-FGFR1 Signaling in the Developing Olfactory-GnRH System
    description: >-
      Co-inherited variants in other CHH genes - several of them in the same FGF8-FGFR1 axis -
      are what push the pathway past the threshold at which the olfactory-GnRH programme fails.
      The threshold model is the authors' inference from segregation and co-occurrence, not a
      measured quantity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32389901
    reference_title: Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis indicated that 100% (5/5) of probands inherited the IL17RD variants from their unaffected parents, and oligogenicity was found in 4/7 patients."
    explanation: >-
      The segregation and oligogenicity numerators in one sentence; this is the observation the
      node is built on.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing confirmed that the child carried both the IL17RD variant (c.2101G>A, p.Gly701Ser) inherited from the mother and the new CPEB4 variant (c.1414C>T, p.Arg472*)."
    explanation: >-
      A worked instance of the pattern: a maternally inherited IL17RD variant carried by an
      unaffected mother, plus a de novo second-locus variant in the affected child.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous studies have demonstrated that the genetic penetrance and phenotypic expressivity of disease symptoms was dependent on factors such as zygosity of the mutation as well as mutations occurring in other genetic loci, suggesting an oligogenic mode of action"
    explanation: >-
      States the oligogenic model explicitly for this gene, in the review that accompanies the
      case.
- name: Dysregulated FGF8-FGFR1 Signaling in the Developing Olfactory-GnRH System
  description: >-
    FGF8-FGFR1 signalling is required for the embryonic programme in which GnRH neurons and
    olfactory axons migrate together from the olfactory placode toward the forebrain, and
    impairment of this signalling is one of the principal causes of CHH. IL17RD joins that
    pathway from the regulatory side: DUSP6, IL17RD, SPRY2 and SPRY4 are all negative modulators
    of FGF8-FGFR1 signalling that have been implicated in the disease.

    The step from "the pathway is dysregulated" to a specific direction of change is not taken
    here. Loss of a feedback antagonist would be expected to increase signalling, which is not
    the direction that FGFR1 loss-of-function CHH implies, and no source read here resolves that
    tension for IL17RD.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: FGF8-FGFR1 signalling in the olfactory-GnRH axis
    modifier: DYSREGULATED
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
  - preferred_term: downstream ERK activation
    modifier: DYSREGULATED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  downstream:
  - target: Failure of GnRH Neuron Migration and Olfactory Bulb Development
    description: >-
      The developmental programme that FGF8-FGFR1 signalling supports is the co-migration of GnRH
      neurons with olfactory axons and the morphogenesis of the olfactory bulb; disturbing the
      signal disturbs that programme.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:32389901
    reference_title: Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF8-FGFR1 signalling is involved in multiple biological processes, while impairment of this signalling is one of the main reasons for isolated hypogonadotropic hypogonadism (IHH)."
    explanation: Establishes the pathway as a principal cause of the disease.
  - reference: PMID:32389901
    reference_title: Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, several negative modulators of FGF8-FGFR1 signalling were also found to be involved in IHH, including DUSP6, IL17RD, SPRY2 and SPRY4."
    explanation: >-
      Places IL17RD specifically among the negative modulators of that pathway implicated in the
      disease.
- name: Failure of GnRH Neuron Migration and Olfactory Bulb Development
  description: >-
    GnRH neurons originate outside the brain and reach the hypothalamus by migrating along
    olfactory axons; the shared route is why reproductive and olfactory deficits travel together
    in Kallmann syndrome. When the programme fails, the hypothalamus is left without its GnRH
    neuron population and the olfactory bulb is malformed or absent - in the imaged case report,
    bilateral olfactory nerve deficits on MRI accompanied a complete inability to identify odours.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: GnRH neuron
    term:
      id: CL:0011111
      label: hypothalamic gonadotropin-releasing hormone neuron
  biological_processes:
  - preferred_term: GnRH neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0001764
      label: neuron migration
  locations:
  - preferred_term: olfactory bulb
    term:
      id: UBERON:0002264
      label: olfactory bulb
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  downstream:
  - target: GnRH-Driven Gonadotropin Deficiency
    description: >-
      Without a functioning hypothalamic GnRH neuron population there is no pulsatile GnRH signal
      to drive pituitary gonadotropin secretion.
    causal_link_type: DIRECT
  - target: Anosmia
    description: >-
      The olfactory arm of the same failed developmental programme, which is why IL17RD carriers
      in the founding cohort were anosmic rather than normosmic.
    causal_link_type: DIRECT
  - target: Abnormal Olfactory Bulb Morphology
    description: >-
      The structural correlate visible on MRI, and the imaging finding that distinguishes
      Kallmann syndrome from normosmic CHH.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During embryonic development, several interacting genes are involved in olfaction establishment and the migration of GnRH neurons, implying a shared embryonic origin among these genes"
    explanation: >-
      States the shared developmental origin that makes one lesion produce both the reproductive
      and the olfactory phenotype.
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IGD is associated with a normal sense of smell (normosmic IGD) in approximately 40% of affected individuals and an impaired sense of smell (Kallmann syndrome) in approximately 60%."
    explanation: >-
      The clinical split that the olfactory arm of this node produces, across CHH as a whole.
- name: GnRH-Driven Gonadotropin Deficiency
  description: >-
    Absent or insufficient hypothalamic GnRH input leaves the pituitary gonadotropes unstimulated,
    so LH and FSH are inappropriately low in the face of low sex steroids - the biochemical
    signature of the disease. The pituitary itself is structurally and functionally normal apart
    from this, which is what separates CHH from combined pituitary hormone deficiency, and the
    deficit is demonstrable as a blunted LH response to exogenous GnRH.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: pituitary gonadotrope
    term:
      id: CL:0000438
      label: luteinizing hormone secreting cell
  downstream:
  - target: Hypogonadotropic Hypogonadism
    description: The direct endocrine consequence, and the defining feature of the disease.
    causal_link_type: DIRECT
  - target: Absent or Incomplete Puberty
    description: >-
      Without gonadotropin drive the gonads do not produce the sex steroids that carry pubertal
      development, so puberty does not start or does not complete.
    causal_link_type: DIRECT
  - target: Micropenis
    description: >-
      A consequence of gonadotropin deficiency in fetal and neonatal life rather than at puberty,
      which is why it can be the presenting sign in an infant boy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cryptorchidism
    description: >-
      Testicular descent is gonadotropin-dependent in late gestation, so the same prenatal
      deficit that produces micropenis can leave the testes undescended.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Isolated gonadotropin-releasing hormone (GnRH) deficiency (IGD) is characterized by inappropriately low serum concentrations of the gonadotropins LH (luteinizing hormone) and FSH (follicle-stimulating hormone) in the presence of low circulating concentrations of sex steroids."
    explanation: The biochemical definition of the node.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, during the gonadorelin stimulation test (1-day method), LH reached a maximum of only 2.71 IU/L at 60 min."
    explanation: >-
      The blunted stimulated LH response in an IL17RD carrier, which is the functional
      demonstration of this node in a patient with this genotype.
phenotypes:
- name: Hypogonadotropic Hypogonadism
  category: Endocrine
  description: >-
    Low LH and FSH with low sex steroids - the defining feature, present by definition in every
    patient assigned to this entity.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  notes: >-
    OBLIGATE because it is definitional rather than observed at some rate: a patient without it
    would not be assigned to this disease.
  evidence:
  - reference: PMID:20301509
    reference_title: "Isolated Gonadotropin-Releasing Hormone (GnRH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Isolated gonadotropin-releasing hormone (GnRH) deficiency (IGD) is characterized by inappropriately low serum concentrations of the gonadotropins LH (luteinizing hormone) and FSH (follicle-stimulating hormone) in the presence of low circulating concentrations of sex steroids."
    explanation: The definitional statement.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The basal levels of Luteinising hormone (LH), which was 0.22 IU/L (normal reference range 0.71-6.24, the same below), follicle-stimulating hormone (FSH), which was 1.63 IU/L (0.91-7.25), and testosterone (T) was 0.45 nmol/L(0.71-22.92)."
    explanation: The measured values in an IL17RD carrier.
- name: Anosmia
  category: Neurological
  description: >-
    Absent or impaired sense of smell, which is what makes most IL17RD carriers Kallmann syndrome
    rather than normosmic CHH. In the founding cohort IL17RD variants were found exclusively in
    anosmic patients.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Anosmia
    term:
      id: HP:0000458
      label: Anosmia
  notes: >-
    Numerator/denominator: 18 of 22 published IL17RD carriers (81.8%) had Kallmann syndrome
    rather than normosmic CHH, which sits at the bottom of the VERY_FREQUENT band. The founding
    cohort's 8 of 8 is the stronger claim but the smaller denominator; the 22-patient review is
    used for the band because it includes the later normosmic carriers.
  evidence:
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, KS occurred in 18 out of 22 (81.8%) patients"
    explanation: The numerator and denominator behind the band.
  - reference: PMID:23643382
    reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL17RD mutations were found only in KS individuals and were strongly linked to hearing loss (6/8 individuals)."
    explanation: >-
      The founding cohort's exclusive association with the anosmic form. Note the same sentence
      carries the hearing-loss association recorded separately below.
- name: Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    The characteristic non-reproductive feature of IL17RD-related CHH, and the most common
    accompanying manifestation across the published carriers. No mechanism linking Sef to
    cochlear development has been proposed in the sources read here.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    Numerator/denominator: 7 of 18 Kallmann-syndrome IL17RD carriers in the published review
    (38.9%), which sits in the FREQUENT band. The founding cohort reported a higher rate, 6 of 8,
    which is the source of the "strongly linked" phrasing; the band uses the larger denominator.
  evidence:
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss emerged as the most common concomitant symptom (7 out of 18, 38.9%), as confirmed by our findings."
    explanation: >-
      The numerator and denominator behind the band, 7 of 18 or 38.9%.
  - reference: PMID:23643382
    reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL17RD mutations were found only in KS individuals and were strongly linked to hearing loss (6/8 individuals)."
    explanation: The founding cohort's rate, on a smaller denominator.
  - reference: PMID:38628584
    reference_title: Clinical phenotype of a Kallmann syndrome patient with IL17RD and CPEB4 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiometry confirmed sensorineural hearing loss in the right ear."
    explanation: >-
      Audiometric confirmation in an individual carrier, and a reminder that the deficit can be
      unilateral.
- name: Abnormal Olfactory Bulb Morphology
  category: Neurological
  description: >-
    Structural failure of the olfactory system on MRI, the imaging counterpart of the anosmia.
    Reported here in one imaged IL17RD carrier as bilateral olfactory nerve deficits.
  phenotype_term:
    preferred_term: Abnormal morphology of the olfactory bulb
    term:
      id: HP:0040327
      label: Abnormal morphology of the olfactory bulb
  notes: >-
    No frequency band. Only one IL17RD carrier read here had olfactory imaging reported, so any
    band would rest on a denominator of one. The bound term is the general abnormal-morphology

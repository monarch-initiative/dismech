- name: Sex Steroid Replacement for Induction of Secondary Sexual Characteristics
  description: >-
    Gradually increasing testosterone in males, or estrogen and progestin in females, to induce
    and then maintain secondary sexual characteristics. This substitutes for the gonadal output
    the absent gonadotropin drive never produced; it does not restore the axis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:

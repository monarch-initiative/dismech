treatments:
- name: Calcitriol Replacement
  description: >-
    Physiological replacement with the missing hormone, calcitriol, or with
    alfacalcidol which requires only hepatic 25-hydroxylation to become active.
    This bypasses the enzymatic block rather than overwhelming it, which is why
    physiological rather than pharmacological doses suffice and why the disorder
    is termed vitamin D-dependent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_mechanisms:
  - target: Calcitriol Deficiency with Preserved 25-Hydroxyvitamin D
    treatment_effect: BYPASSES
    description: >-
      Supplying the hormone downstream of the absent enzyme restores vitamin D
      receptor signalling without requiring 1-alpha-hydroxylation.
    evidence:
    - reference: PMID:30282619
      reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Generally, a good response to treatment with alfacalcidol or calcitriol
        (10-400 ng/kg/day) is expected in cases with VDDR1A
      explanation: >-
        States the expected therapeutic response to the hormones that bypass the
        enzymatic block.
    - reference: PMID:30282619
      reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Differentiation of nutritional rickets and VDDR1A was made by
        normal/high 25-OHD levels, low/inappropriately normal 1,25-OH2D levels
        and improvement in the clinical, biochemical and radiological findings
        of rickets after replacement with calcitriol.
      explanation: >-
        Records clinical, biochemical and radiological improvement on calcitriol
        replacement, the therapeutic bypass this link asserts.
biochemical:
- name: 1,25-dihydroxyvitamin D (calcitriol)
  presence: Decreased
  biomarker_term:
    preferred_term: 1,25-Dihydroxyvitamin D3 Measurement
    term:
      id: NCIT:C179754
      label: 1,25-Dihydroxyvitamin D3 Measurement
  context: >-
    The discriminating analyte across the vitamin D-dependent rickets series. In
    type 1A it is low or inappropriately normal while 25-hydroxyvitamin D is
    normal or high - the mirror image of nutritional rickets, where both are low,
    and of types 2A and 2B, where calcitriol is elevated. Recorded as a
    biochemical marker rather than a phenotype because no HPO term exists for an
    elevated or inappropriately normal 1,25-dihydroxyvitamin D concentration;
    HP:0100512 covers only a decreased concentration and would misstate this.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients also had biochemical features suggestive of rickets such as
      hypophosphatemia, hypo- or normocalcemia, elevated PTH and ALP, normal or
      high 25-OHD levels and low or normal 1,25-OH2D levels.
    explanation: >-
      Reports the pattern of normal-to-high 25-hydroxyvitamin D with low or
      inappropriately normal calcitriol that defines the type 1A biochemistry.
- name: 25-hydroxyvitamin D (calcifediol)
  presence: Normal or elevated
  biomarker_term:
    preferred_term: 25-Hydroxyvitamin D Measurement
    term:
      id: NCIT:C92268
      label: 25-Hydroxyvitamin D Measurement
  context: >-
    Normal or high, because hepatic 25-hydroxylation is intact and the substrate
    accumulates behind the enzymatic block. This single measurement is what
    separates type 1A from both nutritional rickets and type 1B at the bedside.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VDDR1A should definitely be considered when a patient with signs of
      rickets has a normal 25-OHD level or when there is unresponsiveness to
      vitamin D treatment.
    explanation: >-
      States the diagnostic use of a normal 25-hydroxyvitamin D level in a child
      with rickets - the sentence's actual claim, which is diagnostic rather than
      therapeutic.
notes: >-
  Naming caution: "vitamin D-dependent" describes dependence on the active
  hormone, not on dietary vitamin D. The name is shared with VDDR type 2, which
  is mechanistically the opposite - receptor resistance with elevated rather than
  low calcitriol - and the two must not be merged. See the
  `Vitamin_D-Dependent_Rickets` grouping for the boundary between the members.

treatments:
- name: Calcitriol Replacement
  action_category: THERAPEUTIC
  description: >-
    Calcitriol supplies the active hormone downstream of CYP27B1. Dose is
    individualized against calcium, phosphate, PTH, alkaline phosphatase, urinary
    calcium, skeletal healing, and growth; response depends on adherence and age
    at diagnosis and is not a stand-alone diagnostic test.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
  target_mechanisms:
  - target: Renal 1-Alpha-Hydroxylase Deficiency
    treatment_effect: BYPASSES
    description: >-
      Supplying calcitriol bypasses the missing renal 1-alpha-hydroxylation step
      and restores hormone availability downstream of the enzyme defect.
    evidence:
    - reference: PMID:30282619
      reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Differentiation of nutritional rickets and VDDR1A was made by
        normal/high 25-OHD levels, low/inappropriately normal 1,25-OH2D levels
        and improvement in the clinical, biochemical and radiological findings
        of rickets after replacement with calcitriol.
      explanation: >-
        Records multi-domain improvement after replacement with the product of
        the blocked reaction.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After the definitive diagnosis of VDDR1A all patients received calcitriol
      treatment. The duration of treatment with calcitriol ranged between six
      months and seven years. Biochemical improvement with treatment occurred
      within a period ranging between four and 12 months.
    explanation: >-
      Reports calcitriol exposure and the observed time to biochemical
      improvement in this cohort, without converting it into a universal dosing
      or response estimate.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serum (calcium, phosphorus, PTH, alkaline phosphatase, creatinine, and
      appropriate vitamin D metabolites) and urinary (24-h urine calcium or
      random urine calcium/creatinine ratio) biochemistries should be measured
      every 3–6 months.
    explanation: >-
      Supports biochemical and urinary-calcium monitoring during ongoing
      replacement; exact intervals remain clinical guidance, not a target value.
- name: Alfacalcidol Replacement
  action_category: THERAPEUTIC
  description: >-
    Alfacalcidol is already 1-alpha-hydroxylated and requires hepatic
    25-hydroxylation to become active, so it also bypasses CYP27B1. It is curated
    separately from calcitriol because activation, half-life, and dosing are not
    interchangeable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_mechanisms:
  - target: Renal 1-Alpha-Hydroxylase Deficiency
    treatment_effect: BYPASSES
    description: >-
      The analogue overcomes the renal enzymatic block because its remaining
      activation step is 25-hydroxylation.
    evidence:
    - reference: PMID:32596195
      reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Treatment with 1α-cholecalciferol is similarly effective as this
        metabolite also overcomes the enzymatic block, and due to its longer
        half-life than calcitriol, it can be administered once daily.
      explanation: >-
        Directly supports alfacalcidol as a distinct analogue that overcomes the
        block; the entry does not turn the cited general schedule into an
        individualized prescription.
  evidence:
  - reference: PMID:36321535
    reference_title: "Genotype-phenotype Description of Vitamin D-dependent Rickets 1A: CYP27B1 p.(Ala129Thr) Variant Induces a Milder Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were treated with alfacalcidol. Clinical (skeletal, neurological),
      biochemical, and radiological outcomes were satisfactory, and complications
      occurred if there was bad adherence.
    explanation: >-
      Reports satisfactory multidomain outcomes in a 24-case cohort while
      preserving the source's adherence caveat.
- name: Calcium Supplementation for Hypocalcemia and Remineralization
  action_category: THERAPEUTIC
  description: >-
    Oral calcium is added when hypocalcemia or the calcium demand of skeletal
    remineralization warrants it. It is adjunctive to activated vitamin D, not a
    correction of the CYP27B1 defect, and should not be inferred as necessary for
    every patient at every phase.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium
      term:
        id: CHEBI:29108
        label: calcium(2+)
  target_mechanisms:
  - target: Systemic Calcium Deficit
    treatment_effect: RESTORES
    description: >-
      Supplemental calcium directly increases substrate available to correct
      hypocalcemia and support remineralization while active vitamin D restores
      absorption.
    evidence:
    - reference: PMID:30282619
      reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients received calcitriol and patients with hypocalcaemia received
        calcium replacement.
      explanation: >-
        Supports selective calcium replacement in hypocalcemic patients rather
        than universal supplementation.
  target_phenotypes:
  - preferred_term: Hypocalcemia
    term:
      id: HP:0002901
      label: Hypocalcemia
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients received calcitriol and patients with hypocalcaemia received
      calcium replacement.
    explanation: >-
      Directly documents the cohort's calcium-replacement indication.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Calcium supplements (50 mg/kg of elemental calcium per day for children)
      should also be given during initial treatment to prevent worsening of
      hypocalcemia due to the “hungry bones” phenomenon that occurs with
      remineralization of the skeleton.
    explanation: >-
      Supports the distinct early-remodeling indication for adjunctive calcium;
      the quoted review dose is not promoted as a universal prescription here.
biochemical:
- name: 1,25-dihydroxyvitamin D (calcitriol)
  presence: Decreased or inappropriately normal
  biomarker_term:
    preferred_term: 1,25-Dihydroxyvitamin D3 Measurement
    term:
      id: NCIT:C179754
      label: 1,25-Dihydroxyvitamin D3 Measurement
  context: >-
    Low or inappropriately normal calcitriol is the proximal biochemical readout
    of impaired CYP27B1-dependent activation. Interpretation must be relative to
    calcium, phosphate, PTH, treatment, and assay context: a value inside the
    laboratory interval may still be inadequate during hypocalcemia and marked
    PTH elevation. The value is not interpreted through a rigid two-analyte table.
  readouts:
  - target: Calcitriol Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A low or physiologically inappropriate calcitriol concentration reports the
      failed activation step, but a normal-range value does not exclude VDDR1A.
    evidence:
    - reference: PMID:30282619
      reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We also found that the concentrations of 1,25-dihydroxyvitamin D levels
        may be within inappropriately normal ranges in genetically proven vitamin
        D dependent rickets type 1A and lead to diagnostic confusion.
      explanation: >-
        Directly supports physiologic interpretation of a normal-range result and
        the risk of false exclusion.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients also had biochemical features suggestive of rickets such as
      hypophosphatemia, hypo- or normocalcemia, elevated PTH and ALP, normal or
      high 25-OHD levels and low or normal 1,25-OH2D levels.
    explanation: >-
      Reports the pattern of normal-to-high 25-hydroxyvitamin D with low or
      inappropriately normal calcitriol that defines the type 1A biochemistry.
- name: 25-hydroxyvitamin D (calcifediol)
  presence: Variable; often normal or elevated
  biomarker_term:
    preferred_term: 25-Hydroxyvitamin D Measurement
    term:
      id: NCIT:C92268
      label: 25-Hydroxyvitamin D Measurement
  context: >-
    Hepatic 25-hydroxylation is intact, so normal or high 25-hydroxyvitamin D can
    distinguish VDDR1A from nutritional deficiency and CYP2R1-related VDDR1B.
    It is not required to be normal: nutritional status, prior supplementation,
    and other clinical factors can move the measured concentration, and a
    24-case genetically confirmed cohort reported low 25OHD.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VDDR1A should definitely be considered when a patient with signs of
      rickets has a normal 25-OHD level or when there is unresponsiveness to
      vitamin D treatment.
    explanation: >-
      States the diagnostic value of a normal 25-hydroxyvitamin D result in a
      child with rickets, without making normality necessary.
  - reference: PMID:36321535
    reference_title: "Genotype-phenotype Description of Vitamin D-dependent Rickets 1A: CYP27B1 p.(Ala129Thr) Variant Induces a Milder Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      low 25OHD and low 1,25(OH)2D3
    explanation: >-
      Demonstrates low 25OHD in a genetically confirmed cohort and prevents a
      required-normal biochemical rule.
diagnosis:
- name: Clinical, radiographic, and biochemical evaluation
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Evaluate rachitic signs and growth, wrist or knee radiographs, serum calcium,
    phosphate, alkaline phosphatase, PTH, 25-hydroxyvitamin D, and calcitriol.
    Low or inappropriately normal calcitriol in a calciopenic-rickets context is
    particularly informative, but calcium and both vitamin D metabolites can
    fall inside or outside their usual pattern; biochemical response to treatment
    is supportive rather than confirmatory.
  results: >-
    A calciopenic-rickets phenotype with secondary hyperparathyroidism and
    inadequate calcitriol should prompt molecular testing for VDDR1A while
    competing nutritional, phosphopenic, activation, and receptor disorders are
    assessed.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients also had biochemical features suggestive of rickets such as
      hypophosphatemia, hypo- or normocalcemia, elevated PTH and ALP, normal or
      high 25-OHD levels and low or normal 1,25-OH2D levels. Wrist and knee
      radiographs of all patients demonstrated widened epiphyses and metaphyseal
      cupping and fraying.
    explanation: >-
      Provides the measured laboratory and radiographic pattern in the
      11-patient Turkish cohort; the entry does not generalize every component as
      obligatory.
- name: Biallelic CYP27B1 molecular confirmation
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Demonstration of pathogenic variants on both CYP27B1 alleles confirms the
    molecular diagnosis. Variant interpretation should allow partial-loss alleles
    and should not rely on a normal/high 25-hydroxyvitamin D prerequisite.
  results: >-
    A pathogenic biallelic CYP27B1 genotype establishes VDDR1A in the appropriate
    phenotype and distinguishes it from genetically different rickets disorders.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As it may be confused with nutritional rickets and hypophosphatemic
      rickets, genetic analysis is important for making a correct diagnosis.
    explanation: >-
      Directly supports molecular analysis as the resolving test when clinical
      and biochemical presentations overlap.
differential_diagnoses:
- name: Nutritional rickets
  description: >-
    Nutritional vitamin D or calcium deficiency shares calciopenia, secondary
    hyperparathyroidism, hypophosphatemia, high alkaline phosphatase, and rachitic
    radiographs. Low 25-hydroxyvitamin D and response to ordinary nutritional
    replacement favor deficiency, but low 25-hydroxyvitamin D can coexist with
    VDDR1A and cannot exclude a biallelic CYP27B1 diagnosis.
  distinguishing_features:
  - Normal or high 25-hydroxyvitamin D supports VDDR1A over vitamin D deficiency but is not required for VDDR1A.
  - Low or inappropriately normal calcitriol despite strong PTH drive supports impaired 1-alpha-hydroxylation.
  - Biallelic pathogenic CYP27B1 variants confirm VDDR1A.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical and laboratory features of VDDR1A are very similar to
      nutritional rickets although the differential diagnosis can be made by a
      low or inappropriately normal 1, 25-OH2D level and unresponsiveness to
      vitamin D treatment.
    explanation: >-
      Directly identifies the clinical overlap and the value of physiologically
      inadequate calcitriol and poor response to usual vitamin D therapy.
- name: X-linked hypophosphatemic rickets
  disease_term:
    preferred_term: X-linked dominant hypophosphatemic rickets
    term:
      id: MONDO:0010619
      label: X-linked dominant hypophosphatemic rickets
  description: >-
    Both disorders can present with hypophosphatemia, growth failure, bowed legs,
    and rachitic radiographs. In VDDR1A, phosphate wasting is secondary to high
    PTH from the calcium/calcitriol defect; in X-linked hypophosphatemia it is a
    primary FGF23-mediated renal phosphate-wasting disorder and calcium and PTH
    are usually not calciopenic-pattern abnormalities.
  distinguishing_features:
  - Markedly elevated PTH with low or inappropriately normal calcitriol favors VDDR1A.
  - Primary renal phosphate wasting with a pathogenic PHEX variant favors X-linked hypophosphatemia.
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentations of patients with VDDR1A could lead to a
      misdiagnosis of nutritional rickets or hypophosphatemic rickets, which can
      be differentiated from hypophosphatemic rickets by a high PTH level and
      from nutritional rickets by a normal 25-OHD level.
    explanation: >-
      Identifies high PTH as a useful discriminator from hypophosphatemic rickets;
      it is interpreted as a pattern rather than an absolute threshold.
- name: Vitamin D-Dependent Rickets Type 1B
  disease_term:
    preferred_term: vitamin D hydroxylation-deficient rickets, type 1B
    term:
      id: MONDO:0010810
      label: vitamin D hydroxylation-deficient rickets, type 1B
  description: >-
    CYP2R1-related VDDR1B also impairs vitamin D activation but blocks hepatic
    25-hydroxylation rather than renal 1-alpha-hydroxylation. Very low
    25-hydroxyvitamin D with normal or high calcitriol and response to
    calcifediol favor VDDR1B.
  distinguishing_features:
  - Biallelic CYP2R1 rather than CYP27B1 variants establish VDDR1B.
  - Very low 25-hydroxyvitamin D with normal or high calcitriol supports VDDR1B.
  evidence:
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discuss the difficulties in establishing the correct diagnosis and the
      specific biochemical pattern, namely, very low 25-OH-D suggestive of
      classical vitamin D deficiency, in the face of normal/high concentrations
      of 1,25-(OH)2 D.
    explanation: >-
      Defines the CYP2R1-deficiency metabolite pattern that contrasts with the
      CYP27B1 activation block.
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate dramatic improvements in patients who were given 25-OH-D
      therapy (clinical symptoms, biochemical data, and bone densitometry).
    explanation: >-
      Directly supports response to calcifediol as a treatment clue in the
      reported CYP2R1-deficient families, not as a stand-alone diagnostic test.
- name: Vitamin D-Dependent Rickets Type 2A
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 2A
    term:
      id: MONDO:0010186
      label: vitamin D-dependent rickets, type 2A
  description: >-
    VDR-related VDDR2A produces target-organ resistance rather than deficient
    calcitriol synthesis. Elevated calcitriol and alopecia in about half of
    reported patients favor VDDR2A; absence of alopecia does not exclude it.
  distinguishing_features:
  - Elevated rather than inadequate calcitriol supports receptor resistance.
  - Biallelic pathogenic VDR variants establish VDDR2A.
  - Alopecia is supportive when present but is not obligatory.
  evidence:
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biochemical studies show low serum levels of calcium and phosphorus and
      elevated serum concentrations of 1,25(OH)2D, in the range of 50–1,000 pg/mL
      (normal in children is 30–100 pg/mL); serum concentrations of 25(OH)D may be
      normal or elevated due to lack of induction of CYP24A1, which requires VDR
      action.
    explanation: >-
      Supports the high-calcitriol receptor-resistance pattern that separates
      VDDR2A from deficient CYP27B1-mediated synthesis.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical features of VDDR2a are very similar to those of patients with
      other forms of VDDR, but about fifty percent of patients with VDDR2a have
      alopecia.
    explanation: >-
      Supports alopecia as a common but non-obligate discriminator.
- name: Vitamin D-Dependent Rickets Type 2B
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 2B
    term:
      id: MONDO:0010931
      label: vitamin D-dependent rickets, type 2B
  description: >-
    Historical VDDR2B reports describe receptor-positive/postreceptor vitamin D
    resistance with high calcitriol despite a normal VDR coding sequence. The
    entity boundary remains unresolved, and HNRNPC overexpression in one index
    lineage must not be converted into an established germline HNRNPC cause.
  distinguishing_features:
  - Elevated calcitriol with target-organ resistance contrasts with the deficient or inappropriately normal calcitriol of VDDR1A.
  - A normal VDR coding sequence was reported, but there is no validated positive molecular test for VDDR2B.
  - Biallelic pathogenic CYP27B1 variants establish VDDR1A rather than VDDR2B.
  evidence:
  - reference: PMID:7586652
    reference_title: Vitamin D dependent rickets type II and normal vitamin D receptor cDNA sequence. A cluster in a rural area of Cauca, Colombia, with more than 200 affected children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum analysis showed significantly lower serum calcium as compared to
      normal relatives, though in the normal low range, normal phosphorus, high
      alkaline phosphatase, normal 25-hydroxyvitamin D3 and high
      1,25-dihydroxyvitamin D3, indicating target organ resistance. The cDNA
      analysis showed normal nucleotide sequence.
    explanation: >-
      Defines the reported receptor-positive cluster pattern and normal VDR cDNA
      without assigning it the separate index-case HNRNPC mechanism.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VDDR2b appears to be a very uncommon condition, if indeed it is a distinct
      disorder at all.
    explanation: >-
      Preserves the current review's explicit uncertainty about the entity.
- name: Vitamin D-Dependent Rickets Type 3
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 3
    term:
      id: MONDO:0033640
      label: vitamin D-dependent rickets, type 3
  description: >-
    VDDR3 is accelerated vitamin D-metabolite inactivation caused by the
    recurrent de novo CYP3A4 p.Ile301Thr gain-of-function variant in the two
    originally reported unrelated patients. Both major metabolites were low and
    responsiveness to parent and activated vitamin D was deficient; CYP3A4
    rather than CYP27B1 establishes this reported mechanism.
  distinguishing_features:
  - A heterozygous CYP3A4 p.Ile301Thr gain-of-function variant establishes the reported VDDR3 mechanism.
  - Low concentrations of both 25-hydroxyvitamin D and calcitriol with deficient replacement responsiveness support accelerated catabolism.
  evidence:
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe two unrelated patients with early-onset rickets, reduced
      serum levels of the vitamin D metabolites 25-hydroxyvitamin D and
      1,25-dihydroxyvitamin D, and deficient responsiveness to parent and
      activated forms of vitamin D.
    explanation: >-
      Defines the original two-patient VDDR3 metabolite and response pattern;
      the entry does not generalize beyond that evidence.
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      using whole exome sequencing analysis, we identified a recurrent de novo
      missense mutation, c.902T>C (p.I301T), in CYP3A4 in both subjects that
      alters the conformation of substrate recognition site 4 (SRS-4).
    explanation: >-
      Directly establishes the recurrent de novo variant in the two reported
      patients.
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, the mutant CYP3A4 oxidized 1,25-dihydroxyvitamin D with 10-fold
      greater activity than WT CYP3A4 and 2-fold greater activity than CYP24A1,
      the principal inactivator of vitamin D metabolites.
    explanation: >-
      Functionally establishes gain of calcitriol-inactivation activity in the
      mutant enzyme rather than relying on sequence inference alone.
experimental_models:
- name: Patient-derived VDDR-1 keratinocyte cultures
  description: >-
    Primary keratinocytes from the founding patient and adult or neonatal human
    comparison cultures were used to assay 1-alpha-hydroxylase activity. The
    patient cells lacked detectable activity and carried compound-heterozygous
    deletion/frameshift null variants. This directly tests the catalytic lesion
    in patient-derived cells but is not a renal proximal-tubule model.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  conditions:
  - VDDR-1 patient primary keratinocytes
  - Adult and neonatal comparison keratinocytes
  cell_source: Primary human keratinocytes from one VDDR-1 patient and comparison donors
  culture_system: Primary keratinocyte culture
  publication: PMID:9415400
  modeled_mechanisms:
  - target: Renal 1-Alpha-Hydroxylase Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The patient-derived culture recapitulates loss of CYP27B1 catalytic
      activity, while its nonrenal lineage limits tissue-level fidelity.
    limitations: >-
      One founding patient was studied; keratinocytes can assay the enzyme but do
      not reproduce proximal-tubule regulation or whole-body mineral homeostasis.
    evidence:
    - reference: PMID:9415400
      reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Primary cultures of human adult and neonatal keratinocytes exhibit
        abundant 1 alpha-hydroxylase activity, whereas those from a patient with
        VDDR-1 lacked detectable activity.
      explanation: >-
        Directly compares patient and human comparison cultures for the modeled
        enzyme activity.
  evidence:
  - reference: PMID:9415400
    reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Keratinocyte P450c1 alpha cDNA from the patient with VDDR-1 contained
      deletion/frameshift mutations either at codon 211 or at codon 231,
      indicating that the patient was a compound heterozygote for two null
      mutations.
    explanation: >-
      Grounds the model in the patient's two null alleles rather than an
      ungenotyped culture phenotype.
animal_models:
- name: Cyp27b1-deficient mouse
  species: Mouse (Mus musculus)
  genotype: Cyp27b1-/- targeted loss of function
  category: Targeted loss-of-function model
  description: >-
    Targeted Cyp27b1 inactivation produces a pseudo-vitamin-D-deficiency-rickets
    model. Chronic calcitriol treatment corrected hypocalcemia and secondary
    hyperparathyroidism, cured rickets and osteomalacia histologically, and
    restored bone biomechanical properties. This is causal model-organism
    evidence, not a human treatment-effect estimate.
  publication: PMID:12674324
  associated_phenotypes:
  - Hypocalcemia
  - Secondary hyperparathyroidism
  - Rickets
  modeled_mechanisms:
  - target: Renal 1-Alpha-Hydroxylase Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Targeted loss of the ortholog reproduces the initiating enzyme-deficiency
      mechanism.
    limitations: >-
      A constitutive engineered mouse does not capture the full allelic and
      treatment-history heterogeneity of human VDDR1A.
    evidence:
    - reference: PMID:12674324
      reference_title: "Rescue of the pseudo-vitamin D deficiency rickets phenotype of CYP27B1-deficient mice by treatment with 1,25-dihydroxyvitamin D3: biochemical, histomorphometric, and biomechanical analyses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We have previously engineered an animal model of PDDR by targeted
        inactivation of the 1alpha-OHase gene in mice.
      explanation: >-
        Directly establishes the targeted enzyme-loss model.
  - target: Defective Skeletal Mineralization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The untreated knockout carries the rachitic/osteomalacic skeletal endpoint,
      and calcitriol rescue normalizes histology and mechanics.
    limitations: >-
      Rescue under an experimental injection regimen cannot set a human dose or
      guarantee human growth recovery.
    evidence:
    - reference: PMID:12674324
      reference_title: "Rescue of the pseudo-vitamin D deficiency rickets phenotype of CYP27B1-deficient mice by treatment with 1,25-dihydroxyvitamin D3: biochemical, histomorphometric, and biomechanical analyses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bone histology and histomorphometry confirmed that the rickets and
        osteomalacia were cured. The rescue regimen also restored the
        biomechanical properties of the bone tissue within normal parameters.
      explanation: >-
        Directly supports the skeletal phenotype and its calcitriol-responsive
        rescue in the mouse.
  evidence:
  - reference: PMID:12674324
    reference_title: "Rescue of the pseudo-vitamin D deficiency rickets phenotype of CYP27B1-deficient mice by treatment with 1,25-dihydroxyvitamin D3: biochemical, histomorphometric, and biomechanical analyses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Blood biochemistry analysis revealed that the rescue treatment corrected
      the hypocalcemia and secondary hyperparathyroidism.
    explanation: >-
      Supports biochemical rescue of two modeled downstream consequences.
datasets:
- accession: geo:GSE69170
  title: >-
    1,25-Dihydroxyvitamin D3 Controls a Cohort of Vitamin D Receptor Target
    Genes in the Proximal Intestine That Is Enriched for Calcium Regulating
    Components (RNA-seq)
  description: >-
    Bulk RNA-seq of duodenum from Cyp27b1-null male mice on a vitamin-D-deficient
    normal-mineral diet or a high-calcium/high-phosphate rescue diet, sampled six
    hours after vehicle or calcitriol treatment. The four-condition design
    directly interrogates the intestinal calcitriol-response program downstream
    of the modeled synthesis defect; it is not a human VDDR1A cohort.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 24
  conditions:
  - Vitamin-D-deficient normal-mineral diet plus vehicle
  - Vitamin-D-deficient normal-mineral diet plus calcitriol
  - Vitamin-D-deficient high-calcium/high-phosphate rescue diet plus vehicle
  - Vitamin-D-deficient high-calcium/high-phosphate rescue diet plus calcitriol
  platform: GPL13112
  publication: PMID:26041780
  evidence:
  - reference: GEO:GSE69170
    reference_title: >-
      1,25-Dihydroxyvitamin D3 Controls a Cohort of Vitamin D Receptor Target
      Genes in the Proximal Intestine That Is Enriched for Calcium Regulating
      Components (RNA-seq)
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To examine this issue, Cyp27b1 null mice on either a normal or a high
      calcium/phosphate-containing rescue diet were treated with either vehicle
      or 1,25(OH)2D3 and evaluated 6h later. RNA samples from duodena were then
      subjected to RNA-seq analysis and the data analyzed bioinformatically.
    explanation: >-
      The accession record directly establishes the genotype, dietary and
      calcitriol perturbations, intestinal tissue, timing, and RNA-seq assay.
  notes: >-
    Accession, organism, 24-sample four-group design, platform, and linked
    publication were verified against the full NCBI GEO record on 2026-08-24.
    GEO lists this series within SuperSeries GSE69180. Relevance is confined to
    the Cyp27b1-null mouse and downstream intestinal vitamin-D response.
notes: >-
  Naming caution: "vitamin D-dependent" describes dependence on the active
  hormone, not on dietary vitamin D. Historical labels such as VDDR-I and
  pseudovitamin-D-deficiency rickets predate or blur the modern type 1A/type 1B
  split and should not be mapped to this entry without CYP27B1 or compatible
  mechanistic evidence. VDDR types 2A and 2B instead concern target-organ
  resistance with high calcitriol; type 2B remains an unresolved entity and is
  not an established germline HNRNPC disorder. The 11-patient Turkish and
  24-case French referral cohorts used here are complementary but small, so
  their frequencies and treatment observations remain cohort-scoped. See the
  `Vitamin_D-Dependent_Rickets` grouping for member boundaries.

    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients had mild hypocalcemia at presentation while four patients
      had normal calcium concentrations.
    explanation: >-
      Documents the hypocalcemia that follows loss of calcitriol-dependent
      calcium absorption, and its incomplete penetrance at presentation.
  downstream:
  - target: Defective Skeletal Mineralization
    causal_link_type: DIRECT
    description: >-
      Combined calcium and phosphate deficit lowers the calcium-phosphate product
      at the mineralization front.
- name: Defective Skeletal Mineralization
  description: >-
    Hydroxyapatite is not deposited into newly formed osteoid, and in the open
    growth plates of infancy the hypertrophic chondrocyte layer expands, producing
    the widened, cupped and frayed metaphyses of rickets together with bone pain,
    deformity of the weight-bearing long bones, and growth failure.
  role: effector
  biological_scale: TISSUE
  conforms_to: "defective_skeletal_mineralization#Impaired Hydroxyapatite Deposition at the Mineralization Front"
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: Bone Mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED

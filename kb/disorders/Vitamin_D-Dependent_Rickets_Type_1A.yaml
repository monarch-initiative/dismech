genetic:
- name: Biallelic CYP27B1 loss-of-function variants
  gene_term:
    preferred_term: CYP27B1
    term:
      id: hgnc:2606
      label: CYP27B1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Splice-site, frameshift, nonsense and missense alleles are reported. The
    c.195+2T>G splice-donor variant was recurrent among the Turkish families in
    PMID:30282619 and clustered by city of origin, supporting a local founder or
    common-ancestor interpretation; it is not asserted as a universal founder
    allele. Loss of function can be partial rather than complete, as shown for
    p.(Ala129Thr).
  evidence:
  - reference: PMID:9415400
    reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene encoding P450c1 alpha was localized to chromosome 12, where the 1
      alpha-hydroxylase deficiency syndrome, vitamin D-dependent rickets type 1
      (VDDR-1), has been localized.
    explanation: >-
      Maps the 1-alpha-hydroxylase gene to the VDDR-1 locus, establishing it as
      the candidate disease gene.
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prevalent mutation was the c.195 + 2T>G splice donor site
      mutation, affecting five out of 11 patients with VDDR1A.
    explanation: >-
      Documents the recurrent splice variant in this 11-patient Turkish cohort;
      geographic founder inference is scoped in the notes rather than generalized.
  - reference: PMID:36321535
    reference_title: "Genotype-phenotype Description of Vitamin D-dependent Rickets 1A: CYP27B1 p.(Ala129Thr) Variant Induces a Milder Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The partial loss-of-function variation p.(Ala129Thr) was associated with a
      milder phenotype: older age at diagnosis, higher serum calcium (2.26 vs
      1.85 mmol/L), lower PTH (4.7 vs 7.5 ULN), and lower alkaline phosphatase
      (759 vs 2082 IU/L).
    explanation: >-
      A 24-case multicenter cohort identifies a partial-loss allele and its
      milder group-level biochemical and age-at-diagnosis profile, showing that
      CYP27B1 activity is not invariably abolished.
pathophysiology:
- name: Renal 1-Alpha-Hydroxylase Deficiency
  description: >-
    CYP27B1 encodes the mitochondrial enzyme that performs renal
    1-alpha-hydroxylation of 25-hydroxyvitamin D. Biallelic pathogenic variants
    reduce or abolish this catalytic activity. The directly assayed founding
    patient had two null alleles and no detectable activity in primary
    keratinocytes; that nonrenal culture is functional evidence for the enzyme
    defect, not a measurement of kidney expression or population-wide residual
    activity.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: CYP27B1
    term:
      id: hgnc:2606
      label: CYP27B1
  cell_types:
  - preferred_term: Kidney Proximal Tubule Epithelial Cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  molecular_functions:
  - preferred_term: 25-Hydroxyvitamin D 1-Alpha-Hydroxylase Activity
    term:
      id: GO:0004498
      label: calcidiol 1-monooxygenase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9415400
    reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Primary cultures of human adult and neonatal keratinocytes exhibit abundant
      1 alpha-hydroxylase activity, whereas those from a patient with VDDR-1
      lacked detectable activity.
    explanation: >-
      Demonstrates absent 1-alpha-hydroxylase activity in patient-derived cells;
      the assay is in vitro and the sampled cell type is not the renal proximal
      tubule.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To gain full potency, 25 (OH)D undergoes 1α-hydroxylation to 1,25 (OH)2D
      by the mitochondrial cytochrome P450 by CYP27B1 in kidney proximal tubule
      cells.
    explanation: >-
      The clinical review directly locates the CYP27B1 reaction in renal
      proximal-tubule cells and identifies its substrate and product.
  downstream:
  - target: Calcitriol Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of the enzyme that converts 25-hydroxyvitamin D reduces production of
      its active product, calcitriol.
    evidence:
    - reference: PMID:32596195
      reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Patients with VDDR1a (OMIM 264700) are unable to convert 25(OH)D to
        1,25(OH)2D owing to biallelic mutations in the CYP27B1 gene on chromosome
        12q13.3 that encodes 25-hydroxyvitamin D3-1α-hydroxylase.
      explanation: >-
        The review directly links biallelic CYP27B1 defects to failure of the
        substrate-to-product conversion.
- name: Calcitriol Deficiency
  description: >-
    Impaired 1-alpha-hydroxylation produces calcitriol concentrations that are
    low or inappropriately normal for the accompanying hypocalcemia and secondary
    hyperparathyroidism. Serum 25-hydroxyvitamin D is often normal or high when
    substrate supply is adequate, but it can be low in genetically confirmed
    patients and must not be encoded as necessarily preserved.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients also had biochemical features suggestive of rickets such as
      hypophosphatemia, hypo- or normocalcemia, elevated PTH and ALP, normal or
      high 25-OHD levels and low or normal 1,25-OH2D levels.
    explanation: >-
      Defines the Turkish cohort's low-or-normal calcitriol pattern without
      treating a normal-range value as physiologically appropriate.
  - reference: PMID:36321535
    reference_title: "Genotype-phenotype Description of Vitamin D-dependent Rickets 1A: CYP27B1 p.(Ala129Thr) Variant Induces a Milder Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      low 25OHD and low 1,25(OH)2D3
    explanation: >-
      A separate 24-case French cohort directly documents that low 25OHD can
      coexist with genetically confirmed VDDR1A, while calcitriol is also low.
  downstream:
  - target: Reduced Intestinal Calcium Absorption
    causal_link_type: DIRECT
    description: >-
      Loss of active vitamin D signaling reduces the intestinal transport of
      calcium.
    evidence:
    - reference: PMID:32596195
      reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Nearly all features of vitamin D deficiency represent a direct or
        indirect consequence of the loss of vitamin D action on duodenal
        transport of calcium and to a lesser degree on impaired mobilization of
        calcium from skeletal stores.
      explanation: >-
        Supports reduced duodenal calcium transport as the proximal physiologic
        consequence of lost calcitriol action.
- name: Reduced Intestinal Calcium Absorption
  description: >-
    Reduced calcitriol-dependent VDR signaling in enterocytes decreases active

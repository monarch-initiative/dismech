  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VDDR1A should definitely be considered when a patient with signs of rickets

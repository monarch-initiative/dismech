name: Vitamin D-Dependent Rickets Type 1A
synonyms:
- VDDR1A
- VDDR-I
- Pseudovitamin D-deficiency rickets
- 1-alpha-hydroxylase deficiency
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 1A is an autosomal recessive defect of vitamin
  D activation caused by biallelic loss-of-function variants in CYP27B1, which
  encodes the renal 25-hydroxyvitamin D 1-alpha-hydroxylase. The substrate
  25-hydroxyvitamin D is produced normally and circulates at normal or high
  concentration, but it cannot be converted to calcitriol. Calcitriol deficiency
  reduces active intestinal calcium absorption, producing hypocalcemia,
  secondary hyperparathyroidism, renal phosphate wasting, and rickets in the
  first two years of life. The disease is "vitamin D-dependent" rather than
  vitamin D-deficient: nutritional vitamin D does not correct it, whereas
  physiological replacement with calcitriol or alfacalcidol does, which is the
  discriminating clinical feature.

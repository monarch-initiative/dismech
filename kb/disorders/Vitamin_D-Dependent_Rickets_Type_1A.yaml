  evidence:
  - reference: PMID:9415400
    reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene encoding P450c1 alpha was localized to chromosome 12, where the 1
      alpha-hydroxylase deficiency syndrome, vitamin D-dependent rickets type 1
      (VDDR-1), has been localized.
    explanation: >-
      Maps the 1-alpha-hydroxylase gene to the VDDR-1 locus, establishing it as
      the candidate disease gene.
  - reference: PMID:30282619
    reference_title: Genetic and Clinical Characteristics of Patients with Vitamin D Dependent Rickets Type 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prevalent mutation was the c.195 + 2T>G splice donor site
      mutation, affecting five out of 11 patients with VDDR1A.
    explanation: >-
      Documents the recurrent founder splice variant in a genotyped patient
      cohort.
pathophysiology:
- name: Renal 1-Alpha-Hydroxylase Deficiency
  description: >-
    CYP27B1 encodes the mitochondrial cytochrome P450 that carries out the final,
    rate-limiting activation step of vitamin D, 1-alpha-hydroxylation of
    25-hydroxyvitamin D in the renal proximal tubule. Biallelic loss-of-function
    variants abolish this activity. Because the preceding hepatic
    25-hydroxylation is intact, 25-hydroxyvitamin D is normal or elevated while
    calcitriol is low - the biochemical signature that separates this disorder
    from nutritional rickets and from CYP2R1 disease.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Kidney Proximal Tubule Epithelial Cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  molecular_functions:
  - preferred_term: 25-Hydroxyvitamin D 1-Alpha-Hydroxylase Activity
    term:
      id: GO:0004498
      label: calcidiol 1-monooxygenase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9415400
    reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary cultures of human adult and neonatal keratinocytes exhibit abundant
      1 alpha-hydroxylase activity, whereas those from a patient with VDDR-1
      lacked detectable activity.
    explanation: >-
      Demonstrates absent 1-alpha-hydroxylase enzyme activity in patient-derived
      cells, the molecular lesion this node represents.
  - reference: PMID:9415400
    reference_title: Cloning of human 25-hydroxyvitamin D-1 alpha-hydroxylase and mutations causing vitamin D-dependent rickets type 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The key step in the biosynthesis of 1,25(OH)2D is its 1 alpha-hydroxylation
      from 25-hydroxyvitamin D (25-OHD) in the kidney.
    explanation: >-
      Establishes that the lost reaction is the rate-limiting activation step of
      the vitamin D pathway.
  downstream:
  - target: Calcitriol Deficiency with Preserved 25-Hydroxyvitamin D
    causal_link_type: DIRECT
    description: >-
      Loss of the activating enzyme leaves substrate intact but product absent.
- name: Calcitriol Deficiency with Preserved 25-Hydroxyvitamin D
  description: >-
    Absent calcitriol removes the ligand for the vitamin D receptor in the
    intestine, reducing active calcium absorption. Serum calcium falls,
    parathyroid hormone rises, and parathyroid hormone-driven phosphaturia adds a
    phosphate deficit, so the mineralization front is short of both ions. This is
    the disorder-specific instance of the module's calciopenic trigger arm; the
    substitution relative to the generic module node is that the interruption sits
    at 1-alpha-hydroxylation rather than at intake, 25-hydroxylation, or the
    receptor.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"
  cell_types:
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte

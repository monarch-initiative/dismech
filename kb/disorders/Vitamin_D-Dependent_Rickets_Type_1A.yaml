name: Vitamin D-Dependent Rickets Type 1A
synonyms:
- VDDR1A
- VDDR-I
- Pseudovitamin D-deficiency rickets
- 1-alpha-hydroxylase deficiency
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 1A is an autosomal recessive disorder of
  vitamin D activation caused by biallelic loss-of-function variants in CYP27B1,
  which encodes 25-hydroxyvitamin D 1-alpha-hydroxylase. Reduced or absent
  1-alpha-hydroxylation limits conversion of 25-hydroxyvitamin D to calcitriol,
  reducing intestinal calcium absorption and causing a calciopenic cascade of
  hypocalcemia, secondary hyperparathyroidism, renal phosphate wasting, and
  defective skeletal mineralization. Presentation is usually in infancy or early
  childhood, but residual enzyme activity and clinical context modify severity
  and age at diagnosis. Normal or high 25-hydroxyvitamin D with low or
  inappropriately normal calcitriol is a useful pattern, not an invariant rule:
  contemporary genetically confirmed cohorts also include low 25-hydroxyvitamin
  D. Activated hormone or analogue replacement with calcitriol or alfacalcidol
  bypasses the synthesis defect; response supports management but is not by
  itself diagnostic.

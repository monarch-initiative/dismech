mechanistic_hypotheses:
- hypothesis_group_id: znf341_stat3_supply
  hypothesis_label: Reduced basal STAT3 and loss of STAT3 autoinduction in lymphocytes
  status: CANONICAL
  description: >-
    ZNF341 binds the STAT3 promoter and is required for normal basal STAT3
    transcription and for the transient autoinduction of STAT3 when naive T
    cells are co-stimulated through the TCR and IL-6 (and B cells through CD40L
    and IL-21). Because a 50% fall in basal STAT3 is not by itself thought to
    cause HIES (no STAT3 haploinsufficiency phenotype is known), the
    combination of low basal STAT3 with failed autoinduction in lymphocytes is
    the favoured explanation for the STAT3-deficiency phenocopy.
  evidence:
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The combination of decreased basal expression level and impaired autoinduction of STAT3 observed in ZNF341-deficient lymphocytes is considered a more likely pathophysiological mechanism."
    explanation: The disease-defining authors' synthesis names the combined basal-plus-autoinduction defect as the working mechanism.
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, as there is no clear evidence that STAT3 haploinsufficiency causes HIES, this decrease alone is probably insufficient to explain the HIES phenotype observed in the ZNF341-deficient patients."
    explanation: States why reduced basal STAT3 alone is not accepted as sufficient.
- hypothesis_group_id: znf341_stat1_mycobacteria
  hypothesis_label: Reduced STAT1 expression and mycobacterial susceptibility
  status: EMERGING
  description: >-
    ZNF341 also binds the STAT1 promoter and ZNF341-deficient cells have lower
    STAT1. Two patients have had tuberculosis, and the 2023 review raises the
    possibility that partial STAT1 impairment contributes; the original 2018
    report judged the lower STAT1 unlikely to contribute to the clinical
    phenotype. Unresolved.
  evidence:
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "we cannot rule out the possibility that ZNF341-deficient patients are susceptible to virulent environmental mycobacteria due to a partial impairment of STAT1 signaling"
    explanation: Frames the STAT1 route to mycobacterial disease as a possibility only.
  - reference: PMID:29907691
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "the lower levels of STAT1 observed in ZNF341-deficient patients are unlikely to account for or even contribute to their immunological or clinical phenotypes."
    explanation: The discovery paper argued the opposite, that reduced STAT1 is unlikely to matter clinically.
- hypothesis_group_id: dna_repair_malignancy
  hypothesis_label: Impaired DNA repair and malignancy predisposition
  status: EMERGING
  description: >-
    Ex vivo irradiated leukocytes from four ZNF341-deficient patients repaired
    DNA damage more slowly than controls, and one patient developed a nasal
    primitive neuroendocrine tumor followed by papillary thyroid cancer. The
    authors propose that the repair defect, together with radiation exposure,
    predisposes to malignancy. The clinical side of this rests on one patient.
  evidence:
  - reference: PMID:35511492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased radiosensitivity and impaired DNA repair were demonstrated in patients diagnosed with STAT3-LOF and ZNF341 deficiency, potentially explaining the susceptibility to malignant transformation."
    explanation: Comet-assay study on patient leukocytes proposing the DNA-repair route to malignancy.
pathophysiology:
- name: ZNF341 biallelic loss of function
  description: >-
    All confirmed patients are homozygous for predicted loss-of-function
    ZNF341 alleles (nonsense, frameshift, essential splice site). The truncated
    products lack most of the twelve C2H2 zinc fingers; the p.Gln195* and
    p.Arg302* products are retained in the cytoplasm, and mutant proteins fail
    to activate the STAT3 promoter. ZNF341 is a constitutively nuclear
    transcription factor expressed in all leukocytes tested and in fibroblasts
    and keratinocytes.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ZNF341
    term:
      id: hgnc:15992
      label: ZNF341
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:29907691
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZNF341 is a transcription factor that resides in the nucleus, where it binds a specific DNA motif present in various genes, including the STAT3 promoter."
    explanation: Defines ZNF341 as a nuclear transcription factor that binds the STAT3 promoter.
  - reference: PMID:29907690
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type ZNF341 bound to and activated the STAT3 promoter, whereas the mutant variants showed impaired transcriptional activation, partly due to nuclear translocation failure."
    explanation: Patient variants lose transcriptional activation of STAT3, partly through failed nuclear import.
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All the patients with AR ZNF341 deficiency described to date were homozygous for pLOF variants"
    explanation: Every confirmed patient carries biallelic predicted loss-of-function alleles.
  downstream:
  - target: Reduced basal STAT3 expression
    causal_link_type: DIRECT
    description: Loss of ZNF341 binding at the STAT3 promoter lowers constitutive STAT3 transcription.
    hypothesis_groups:
    - znf341_stat3_supply
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The patients' cells have low basal levels of STAT3 mRNA and protein."
      explanation: Patient cells lacking ZNF341 have low basal STAT3.
  - target: Loss of STAT3 autoinduction in lymphocytes
    causal_link_type: DIRECT
    description: ZNF341 is required for STAT3 to induce its own transcription on combined TCR and IL-6 stimulation.
    hypothesis_groups:
    - znf341_stat3_supply
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Human ZNF341 is essential for the STAT3 transcription-dependent autoinduction and sustained activity of STAT3."
      explanation: States that ZNF341 is required for STAT3 autoinduction.
  - target: Reduced STAT1 expression
    causal_link_type: DIRECT
    description: ZNF341 binds the STAT1 promoter; deficient cells have less STAT1.
    hypothesis_groups:
    - znf341_stat1_mycobacteria
    evidence:
    - reference: PMID:37080116
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "ZNF341 upregulates STAT1 mRNA and protein levels, as demonstrated by the lower levels of STAT1 in ZNF341-deficient cells"
      explanation: Reports reduced STAT1 in ZNF341-deficient cells.
  - target: Reduced natural killer cell count
    causal_link_type: UNKNOWN
    description: >-
      NK lymphopenia is common in ZNF341 deficiency but rare in STAT3
      dominant-negative disease. Whether it reflects a STAT3-independent ZNF341
      function or a deeper STAT3 defect in NK progenitors is unresolved.
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Conversely, the NK lymphopenia seen in ZNF341-deficient but not STAT3-DN patients suggests that ZNF341 may be essential for at least one STAT3-independent function."
      explanation: Attributes the NK phenotype to ZNF341 loss while leaving the pathway open.
- name: Reduced basal STAT3 expression
  description: >-
    Patient primary cells have reduced resting STAT3 mRNA and protein. The
    discovery papers report different magnitudes: about 50% of normal in
    primary naive CD4+ T cells, monocytes and fibroblasts (Beziat et al.), and
    16-28% of wild-type protein in PBMCs, EBV-B cells and skin fibroblasts
    (Frey-Jakobs et al.). Cytokine-induced STAT3 Y705 phosphorylation is
    correspondingly lower. The defect is present in non-hematopoietic cells as
    well as lymphocytes.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  evidence:
  - reference: PMID:29907690
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STAT3 protein expression was reduced in ZNF341-mutant cells (patients’ PBMCs, EBV-transformed B cells, and PSF) down to 16–28% of wild-type levels"
    explanation: Quantifies reduced STAT3 protein in several patient cell types.
  - reference: PMID:29907690
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STAT3 Y705-phosphorylation was markedly impaired in PBMCs from patients with R302* and R386* mutations, respectively, following stimulation with IL-6"
    explanation: Lower total STAT3 translates into lower IL-6-induced STAT3 activation.
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "All the ZNF341-deficient cell subsets tested, including lymphocytes, monocytes, and fibroblasts, had 50% the normal level of STAT3 mRNA and protein."
    explanation: Shows the basal reduction extends beyond lymphocytes to monocytes and fibroblasts.
  downstream:
  - target: Insufficient STAT3 activity in lymphocytes
    causal_link_type: DIRECT
    hypothesis_groups:
    - znf341_stat3_supply
    description: Low basal STAT3 contributes to lower STAT3 activation downstream of STAT3-activating cytokines.
  - target: Reduced STAT3 function in non-hematopoietic cells
    causal_link_type: DIRECT
    description: The basal STAT3 reduction is also present in fibroblasts.
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, these patients do develop such somatic features, consistent with the STAT3 phenotype detected in the fibroblasts of ZNF341-deficient patients."
      explanation: Links the fibroblast STAT3 defect to the somatic (extra-hematopoietic) features.
- name: Loss of STAT3 autoinduction in lymphocytes
  description: >-
    In control naive CD4+ T cells, co-stimulation through CD2/CD3/CD28 plus IL-6
    or Th17-polarizing cytokines raises STAT3 mRNA 10- to 20-fold; this synergy
    is absent in ZNF341-deficient cells but preserved in STAT3
    dominant-negative cells. Autoinduction is also impaired in naive B cells
    stimulated with CD40L and IL-21. Loss of this boost prevents sustained
    STAT3 activity during lymphocyte differentiation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  evidence:
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "STAT3 autoinduction was abolished in ZNF341-deficient naive T cells stimulated under these conditions, but not in STAT3-deficient naive T cells"
    explanation: The autoinduction defect distinguishes ZNF341 from STAT3 dominant-negative disease.
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "impaired STAT3 autoinduction was also observed in ZNF341-deficient naive B cells following CD40L and IL-21 costimulation, and was associated with a severe impairment of immunoglobulin production"
    explanation: Extends the autoinduction defect to B cells.
  downstream:
  - target: Insufficient STAT3 activity in lymphocytes
    causal_link_type: DIRECT
    hypothesis_groups:
    - znf341_stat3_supply
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Together, low baseline STAT3 mRNA and protein levels, and the impaired auto-induction of STAT3 itself, result in lower levels of STAT3 activation (phosphorylation) and transcriptional activity, as low as those in patients with DN STAT3 mutations."
      explanation: The two defects together bring lymphocyte STAT3 activity down to the level seen in dominant-negative STAT3 disease.
- name: Insufficient STAT3 activity in lymphocytes
  description: >-
    The net effect in T and B cells is STAT3 activation and transcriptional
    output as low as in dominant-negative STAT3 disease, so STAT3-dependent
    lymphocyte differentiation programs (Th17, T follicular helper, memory B
    cell, plasma cell) fail in the same way. TCR-induced calcium flux and T
    cell proliferation are normal.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: JAK-STAT signaling
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  - preferred_term: interleukin-6-mediated signaling pathway
    term:
      id: GO:0070102
      label: interleukin-6-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:29907691
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consequently, STAT3-dependent genes, such as RORC, IL17A, and IL17F, are poorly induced."
    explanation: Downstream STAT3 target genes are poorly induced in patient T cells.
  downstream:
  - target: Impaired Th17 differentiation and IL-17/IL-22 immunity
    causal_link_type: DIRECT
    hypothesis_groups:
    - znf341_stat3_supply
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The lack of ZNF341 prevents Th cells from producing sufficient amounts of functional STAT3, and thereby of ROR-γ/ROR-γT, during Th17 development"
      explanation: Links insufficient STAT3 to failed RORgammat induction and Th17 development.
  - target: Th2 skewing of CD4 T cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - znf341_stat3_supply
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Like patients with STAT3 DN mutations, ZNF341-deficient patients lack T helper 17 (TH17) cells, have an excess of TH2 cells, and have low memory B cells due to the tight dependence of STAT3 activity on ZNF341 in lymphocytes."
      explanation: Attributes Th17 loss, Th2 excess and memory B cell deficiency to the lymphocyte dependence of STAT3 on ZNF341.
  - target: Impaired T follicular helper and memory B cell development
    causal_link_type: DIRECT
    hypothesis_groups:
    - znf341_stat3_supply
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The same mechanism probably operates in B cells, accounting for the B-cell phenotypes of ZNF341-deficient patients being identical to those of HIES patients with DN STAT3 mutations"
      explanation: Extends the STAT3 insufficiency mechanism to the B cell phenotype.
- name: Impaired Th17 differentiation and IL-17/IL-22 immunity
  description: >-
    Circulating Th17 cells are low, memory CD4+ T cells make little IL-17A,
    IL-17F or IL-22, and naive CD4+ T cells fail to produce IL-17 under
    Th17-polarizing conditions. Patient fibroblasts and keratinocytes respond
    normally to IL-17A, so the candidiasis reflects deficient IL-17 production
    rather than deficient IL-17 response.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: DECREASED
  - preferred_term: interleukin-17 production
    term:
      id: GO:0032620
      label: interleukin-17 production
    modifier: DECREASED
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
    modifier: DECREASED
  evidence:
  - reference: PMID:29907691
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In marked contrast, the production of Th17 cytokines (IL-17A, IL-17F, IL-22) by ZNF341-deficient memory CD4+ T cells was much weaker than that by control cells"
    explanation: Patient memory CD4+ T cells make little Th17 cytokine.
  - reference: PMID:29907690
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients however presented a significantly reduced percentage of Th17 CD4+ T cells, a key feature of STAT3-HIES"
    explanation: Independent cohort confirms low circulating Th17 cells.
  downstream:
  - target: Chronic mucocutaneous candidiasis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29907691
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As in patients with DN STAT3 mutations, this defect accounts for the CMC observed in the patients, as fibroblasts and keratinocytes from P2–P4 responded normally to IL-17A"
      explanation: The Th17 defect accounts for the candidiasis, since IL-17 responsiveness of the target tissue is intact.
  - target: Onychomycosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of IL-17-dependent antifungal defense
    description: Nail Candida infection is one of the mucocutaneous candidiasis manifestations tabulated for these patients.
  - target: Decreased Th17 T cell proportion
    causal_link_type: DIRECT
    description: The differentiation defect is read out as a low Th17 proportion on immunophenotyping.
  - target: Recurrent skin infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      By analogy with STAT3 dominant-negative disease, loss of IL-17/IL-22
      epithelial antibacterial signals is thought to contribute to
      staphylococcal skin infection. No ZNF341-specific study tests this edge.
- name: Th2 skewing of CD4 T cells
  description: >-
    Circulating memory CD4+ T cells are skewed toward Th2, with high GATA3 and
    Th2 cytokine transcripts (IL-4, IL-5, IL-13, IL-31) that persist even under
    Th17-polarizing conditions; CD8+ T cells over-express IL-5 and IL-9. The
    excess type 2 response is the proposed basis of the high IgE, eczema,
    eosinophilia and allergy.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
    modifier: INCREASED
  - preferred_term: type 2 immune response
    term:
      id: GO:0042092
      label: type 2 immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:29907691
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that the allergic features of ZNF341-deficient patients were due to the enhanced production of some, but not all Th2-like cytokines, including IL-5 and IL-9, in particular, by both CD4+ and CD8+ T cells."
    explanation: Patient T cells over-produce Th2-type cytokines.
  downstream:
  - target: Atopic dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37080116
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The high proportion of Th2 cells probably underlies the high serum levels of IgE, eczema, and the other allergic manifestations seen in the patients"
      explanation: Proposes the Th2 excess as the cause of eczema and high IgE.
    - reference: PMID:31993867
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This observation suggests that Th2-mediated IL-4 and/or IL-13 signaling plays a central role in atopic dermatitis in HIES."
      explanation: Response to IL-4Ralpha blockade in a ZNF341-deficient patient supports a type 2 driver of the dermatitis; a therapeutic response is indirect support.
  - target: Elevated serum IgE
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Excess IL-4/IL-13 signaling favours IgE class switching; total IgE fell under IL-4Ralpha blockade.
    evidence:

- name: Loss of STAT3 autoinduction in lymphocytes
  description: >-
    In control naive CD4+ T cells, co-stimulation through CD2/CD3/CD28 plus IL-6
    or Th17-polarizing cytokines raises STAT3 mRNA 10- to 20-fold; this synergy
    is absent in ZNF341-deficient cells but preserved in STAT3
    dominant-negative cells. Autoinduction is also impaired in naive B cells
    stimulated with CD40L and IL-21. Loss of this boost prevents sustained
    STAT3 activity during lymphocyte differentiation.
  biological_scale: CELLULAR

      explanation: Reports reduced STAT1 in ZNF341-deficient cells.
  - target: Reduced natural killer cell count
    causal_link_type: UNKNOWN
    description: >-
      NK lymphopenia is common in ZNF341 deficiency but rare in STAT3
      dominant-negative disease. Whether it reflects a STAT3-independent ZNF341
      function or a deeper STAT3 defect in NK progenitors is unresolved.
    evidence:
    - reference: PMID:29907691
      reference_title: "A recessive form of hyper-IgE syndrome by disruption of ZNF341-dependent STAT3 transcription and activity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Conversely, the NK lymphopenia seen in ZNF341-deficient but not STAT3-DN patients suggests that ZNF341 may be essential for at least one STAT3-independent function."
      explanation: Attributes the NK phenotype to ZNF341 loss while leaving the pathway open.
- name: Reduced basal STAT3 expression
  description: >-
    Patient primary cells have reduced resting STAT3 mRNA and protein. The
    discovery papers report different magnitudes: about 50% of normal in
    primary naive CD4+ T cells, monocytes and fibroblasts (Beziat et al.), and
    16-28% of wild-type protein in PBMCs, EBV-B cells and skin fibroblasts
    (Frey-Jakobs et al.). Cytokine-induced STAT3 Y705 phosphorylation is
    correspondingly lower. The defect is present in non-hematopoietic cells as
    well as lymphocytes.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STAT3
    term:
      id: hgnc:11364
      label: STAT3
  evidence:
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STAT3 protein expression was reduced in ZNF341-mutant cells (patients’ PBMCs, EBV-transformed B cells, and PSF) down to 16–28% of wild-type levels"
    explanation: Quantifies reduced STAT3 protein in several patient cell types.
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STAT3 Y705-phosphorylation was markedly impaired in PBMCs from patients with R302* and R386* mutations, respectively, following stimulation with IL-6"
    explanation: Lower total STAT3 translates into lower IL-6-induced STAT3 activation.
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "All the ZNF341-deficient cell subsets tested, including lymphocytes, monocytes, and fibroblasts, had 50% the normal level of STAT3 mRNA and protein."
    explanation: Shows the basal reduction extends beyond lymphocytes to monocytes and fibroblasts.
  downstream:
  - target: Insufficient STAT3 activity in lymphocytes
    causal_link_type: DIRECT
    hypothesis_groups:

    evidence_source: IN_VITRO
    snippet: "During the recovery period of irradiation, TL, TDNA%, and OTM values of healthy controls decreased rapidly toward the baseline, while these values of patients with STAT3-LOF and ZNF341 deficiency continued to increase, implying impaired DNA repair mechanisms."
    explanation: Ex vivo radiation assay showing slower DNA-damage resolution in patient leukocytes.
  downstream:
  - target: Neoplasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

inheritance:
- name: Autosomal recessive
  description: >-
    ZNF341 deficiency is autosomal recessive and fully penetrant. All 20
    patients pooled in the 2023 review were homozygous for a truncating ZNF341
    allele and all their kindreds were consanguineous, so the disorder was
    initially seen only as homozygosity for a founder or private null allele. A
    later report describes a child with a biallelic missense allele and does not
    state whether she is homozygous, so neither truncation nor homozygosity can
    be treated as a requirement. Heterozygous relatives are healthy. The cited
    sources do not state a numerical recurrence risk for the sibship, so none
    is recorded here.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29907691
    reference_title: "A recessive form of hyper-IgE syndrome by disruption of ZNF341-dependent STAT3 transcription and activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The segregation of the four mutant alleles of ZNF341 in the six families was consistent with a fully penetrant AR trait"
    explanation: Segregation across six kindreds establishes a fully penetrant autosomal recessive trait.
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated patients of four consanguineous families with an autosomal-recessive disorder resembling the phenotype of AD-HIES"
    explanation: The independent discovery cohort is likewise four consanguineous autosomal recessive kindreds.
  - reference: CGGV:assertion_2dc4032e-7215-464d-9844-c392ec25148b-2024-06-04T170000.000Z

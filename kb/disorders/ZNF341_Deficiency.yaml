      evidence_source: HUMAN_CLINICAL
      snippet: "This improvement was accompanied by a progressive decrease in total serum IgE, and allergen-specific IgE"
      explanation: IgE fell when IL-4/IL-13 signaling was blocked, supporting a type 2 driver.
  - target: Eosinophilia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - excess IL-5 production by CD4+ and CD8+ T cells
    description: T cell IL-5 over-production is the proposed driver of eosinophilia.
  - target: Allergy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Allergic manifestations are attributed to the Th2 excess.
- name: Impaired T follicular helper and memory B cell development
  description: >-
    Patients have low circulating T follicular helper cells and low memory B
    cells (with increased naive B cells), and naive B cells fail to
    differentiate into immunoglobulin-secreting cells on CD40L plus IL-21
    stimulation. Unlike STAT3 dominant-negative disease, serum IgG is usually
    high; the basis of this dissociation is not explained.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: memory B cell
    term:

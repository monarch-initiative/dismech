    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous nonsense mutation in exon 6 of ZNF341 (Chr20:32345116C>T; GRCh37; c.904C>T; p.Arg302*, R302* for isoform1; RefSeq NM_001282933.1)"

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZNF341 is a transcription factor that resides in the nucleus, where it binds a specific DNA motif present in various genes, including the STAT3 promoter."
    explanation: Defines ZNF341 as a nuclear transcription factor that binds the STAT3 promoter.
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type ZNF341 bound to and activated the STAT3 promoter, whereas the mutant variants showed impaired transcriptional activation, partly due to nuclear translocation failure."
    explanation: Patient variants lose transcriptional activation of STAT3, partly through failed nuclear import.
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All the patients with AR ZNF341 deficiency described to date were homozygous for pLOF variants"
    explanation: Every confirmed patient carries biallelic predicted loss-of-function alleles.

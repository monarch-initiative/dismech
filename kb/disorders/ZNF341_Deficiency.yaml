    explanation: Establishes loss of function, rather than negative dominance, as the disease mechanism.
treatments:
- name: Dupilumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Dupilumab, an anti-IL-4-receptor-alpha monoclonal antibody, blocks IL-4 and
    IL-13 signalling and is the one therapy reported in a genetically confirmed
    ZNF341-deficient patient. A 48-year-old woman with severe atopic dermatitis
    (SCORAD 85.5) refractory to ultra-potent topical corticosteroids and
    topical tacrolimus received 600 mg followed by 300 mg subcutaneously every
    two weeks, improved after three injections, stopped topical treatment at
    three months, and had a complete and well-tolerated response at one year,
    with falling total and allergen-specific IgE. This is a single case report
    in an adult, so it establishes that the Th2 axis is targetable in this
    disorder rather than an efficacy estimate. Paediatric experience now exists:
    a 2-year-old girl with biallelic ZNF341 variants, severe atopic dermatitis
    over more than 70% of her body surface and IgE above 40,000 IU/mL was
    started at 300 mg every four weeks and improved to mild disease under 10%
    body surface by six months, with her IgE falling to 6935 IU/mL. Treatment
    was then interrupted for four months, during which her dermatitis flared;
    it settled again on restarting at the same initial dose, and she remained
    stable over the following year. The response therefore appears to require
    continued treatment. Total published
    experience in this disorder is two patients, one adult and one child.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dupilumab
      term:
        id: NCIT:C162455
        label: Dupilumab
  dosing_interval: every two weeks
  dosing_interval_days: 14
  target_phenotypes:
  - preferred_term: Atopic dermatitis
    term:
      id: HP:0001047
      label: Atopic dermatitis
  target_mechanisms:
  - target: Th2 skewing of CD4 T cells
    description: >-
      Dupilumab blocks the IL-4 receptor alpha chain shared by the IL-4 and
      IL-13 receptors, the effector arm of the Th2 skewing that drives the
      atopic dermatitis in this disorder.
    evidence:
    - reference: PMID:31993867
      reference_title: "Efficacy of Dupilumab for Controlling Severe Atopic Dermatitis in a Patient with Hyper-IgE Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This observation suggests that Th2-mediated IL-4 and/or IL-13 signaling plays a central role in atopic dermatitis in HIES."
      explanation: The authors read the treatment response as evidence that Th2 IL-4/IL-13 signalling drives the dermatitis.
  evidence:

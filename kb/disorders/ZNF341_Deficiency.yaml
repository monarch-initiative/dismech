    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both ZNF341-deficient and STAT3-deficient patients were highly prone to recurrent skin infections, with skin abscesses (75% vs. 73%) and CMC (60% vs. 85%)."
    explanation: Skin abscesses in 75% of pooled patients.
  - reference: PMID:29907690
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

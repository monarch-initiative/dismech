genetic:
- name: ZNF341
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ZNF341
    term:
      id: hgnc:15992
      label: ZNF341
  variant_origin: GERMLINE
  notes: >-
    ZNF341 (20q11.22) encodes a nuclear C2H2 zinc-finger transcription factor
    that binds the STAT3 promoter. Every allele in the 20 patients pooled by
    the 2023 review is biallelic and truncating - nonsense or frameshift - and
    the mechanism is loss of function rather than negative dominance, which is
    the mechanistic difference from STAT3 dominant-negative AD-HIES. A
    subsequent paediatric case report carries a biallelic missense allele
    (c.538C>G, p.Pro180Ala), so truncation is not a requirement of the
    diagnosis; that report does not present functional data on the variant.
    Reported truncating alleles include
    p.Arg302* (c.904C>T), seen homozygously in several unrelated kindreds and
    the nearest thing to a recurrent allele, plus p.Gln195* (c.583C>T),
    p.Lys355Serfs (c.1062delG), p.Tyr542* (c.1626C>G), p.Ser64* and an
    essential splice-site variant. Residue numbering is isoform-dependent: the
    Frey-Jakobs report numbers its second allele p.Arg386* against RefSeq
    NM_001282933.1 (854 residues), and the two main transcripts differ by 21
    in-frame nucleotides, so an allele quoted from one paper will not always
    match the numbering in another. p.Arg302* is a founder allele: in the
    Israeli village from which eight of the first eleven patients came, 10 of
    200 screened women were heterozygous carriers.
  evidence:
  - reference: PMID:35185921
    reference_title: Hyper IgE Syndrome in an Isolated Population in Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All samples were tested by Sanger sequencing for the ZNF341 mutation (c.904C>T, NM_001282933.1)."
    explanation: Confirms c.904C>T as the allele screened for as a founder variant in that population.
  - reference: PMID:39420803
    reference_title: "Improvement in Atopic Dermatitis and Recurrent Infection With Dupilumab in Children With Distinct Genetic Types of Hyper-IgE Syndrome: A Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZNF341 (c.538C > G; p.Pro180Ala) | This manuscript | 2 | F | Hyperpigmented plaques, diffuse xerosis and pruritis, cutaneous infections including eczema herpeticum"
    explanation: A biallelic missense ZNF341 allele in a child, outside the truncating spectrum of the pooled cohort.
  - reference: CGGV:assertion_2dc4032e-7215-464d-9844-c392ec25148b-2024-06-04T170000.000Z
    reference_title: "ZNF341 / hyper-IgE recurrent infection syndrome 3, autosomal recessive (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZNF341 | HGNC:15992 | hyper-IgE recurrent infection syndrome 3, autosomal recessive | MONDO:0032654 | AR | Definitive"
    explanation: ClinGen's SCID-CID expert panel classifies the gene-disease relationship as Definitive with autosomal recessive inheritance.
  - reference: PMID:29907690

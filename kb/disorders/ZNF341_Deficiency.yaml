      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The low proportions of Tfh and memory B cells probably at least partly account for the severe bacterial infections of the lungs observed in these patients, through the impairment of sustained humoral responses"
      explanation: Proposes the humoral defect as a cause of the bacterial lung infections.
  - target: Recurrent upper respiratory tract infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired sustained humoral responses are thought to contribute to sinopulmonary infection generally.
- name: Reduced STAT3 function in non-hematopoietic cells
  description: >-
    STAT3 levels are also reduced in patient fibroblasts, and patients develop
    the connective-tissue, skeletal and dental features of STAT3 HIES, but less
    often and more mildly. The discovery paper suggests the IL-11R, LIFR and
    IL-6ST-dependent programs in these tissues need less STAT3 than lymphocyte
    programs do. This is an interpretation, not a measured tissue-by-tissue
    dose threshold, so the edges below are left as unknown intermediates.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:29907691
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ZNF341 deficiency appear to develop fewer and milder non-hematopoietic developmental phenotypes than patients with STAT3 DN mutations."
    explanation: States the milder extra-hematopoietic involvement relative to STAT3 dominant-negative disease.
  downstream:
  - target: Facial dysmorphism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: High palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Persistence of primary teeth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Joint hypermobility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Minimal-trauma fractures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced STAT1 expression
  description: >-
    ZNF341 binds two sites in the STAT1 promoter and ZNF341-deficient cells
    have lower STAT1 mRNA and protein. Its clinical significance is disputed.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STAT1
    term:
      id: hgnc:11362
      label: STAT1
  evidence:
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Two ZNF341-binding sites were identified within the STAT1 promoter, including one approximately 400 nucleotides upstream from the transcription start site (TSS), as in the STAT3 promoter"
    explanation: Identifies STAT1 as a direct ZNF341 target.
  downstream:
  - target: Tuberculosis
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - znf341_stat1_mycobacteria
    description: Proposed, unconfirmed route to mycobacterial susceptibility (see mechanistic hypothesis).
- name: Impaired repair of radiation-induced DNA damage
  description: >-
    In an alkaline Comet assay on ex vivo irradiated leukocytes from four
    ZNF341-deficient and twelve STAT3 loss-of-function patients, DNA-damage
    measures kept rising during the recovery period while those of healthy
    controls returned toward baseline. The mechanism linking ZNF341 or STAT3
    to DNA repair is not established, so this node has no upstream edge.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:35511492
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "During the recovery period of irradiation, TL, TDNA%, and OTM values of healthy controls decreased rapidly toward the baseline, while these values of patients with STAT3-LOF and ZNF341 deficiency continued to increase, implying impaired DNA repair mechanisms."
    explanation: Ex vivo radiation assay showing slower DNA-damage resolution in patient leukocytes.
  downstream:
  - target: Neoplasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dna_repair_malignancy
    evidence:
    - reference: PMID:35511492
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Except for a patient with ZNF341 deficiency who developed nasal cell primitive neuroendocrine tumor and papillary thyroid cancer during the follow-up, there was no cancer in both groups."
      explanation: The single malignancy observed in the radiosensitivity cohort occurred in a ZNF341-deficient patient, which is the only clinical observation behind this edge.
phenotypes:
- name: Atopic dermatitis
  category: Dermatologic
  frequency: VERY_FREQUENT
  description: >-
    Atopic dermatitis was present in all 20 published patients and is the most
    common presenting feature; IUIS describes it as early-onset eczema. In
    three of the four kindreds of the Frey-Jakobs report the disease was first
    diagnosed as atopic dermatitis, with the other HIES features appearing
    later in life, so severe early-childhood eczema can precede recognition of
    the immunodeficiency.
  phenotype_term:
    preferred_term: Atopic dermatitis
    term:
      id: HP:0001047
      label: Atopic dermatitis
  evidence:
  - reference: PMID:37080116
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Atopic dermatitis was the most common clinical presentation of patients with ZNF341 deficiency, present in all patients reported"
    explanation: Atopic dermatitis in 20/20 pooled patients.
  - reference: PMID:35748970
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Phenocopy of AD-HIES; mild facial dysmorphism; early onset eczema"
    explanation: IUIS describes the eczema as early onset.
  - reference: PMID:29907690
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected members of Families B, C and D (Fig. 2B–D) presented with a milder phenotype initially diagnosed as atopic dermatitis, with characteristic HIES symptoms occurring later in life."
    explanation: Dermatitis can be the sole initial presentation, with HIES features emerging later.

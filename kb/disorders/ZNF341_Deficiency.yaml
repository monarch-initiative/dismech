mechanistic_hypotheses:
- hypothesis_group_id: znf341_stat3_supply
  hypothesis_label: Reduced basal STAT3 and loss of STAT3 autoinduction in lymphocytes
  status: CANONICAL
  description: >-
    ZNF341 binds the STAT3 promoter and is required for normal basal STAT3
    transcription and for the transient autoinduction of STAT3 when naive T
    cells are co-stimulated through the TCR and IL-6 (and B cells through CD40L
    and IL-21). Because a 50% fall in basal STAT3 is not by itself thought to
    cause HIES (no STAT3 haploinsufficiency phenotype is known), the
    combination of low basal STAT3 with failed autoinduction in lymphocytes is
    the favoured explanation for the STAT3-deficiency phenocopy.
  evidence:
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The combination of decreased basal expression level and impaired autoinduction of STAT3 observed in ZNF341-deficient lymphocytes is considered a more likely pathophysiological mechanism."
    explanation: The disease-defining authors' synthesis names the combined basal-plus-autoinduction defect as the working mechanism.
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, as there is no clear evidence that STAT3 haploinsufficiency causes HIES, this decrease alone is probably insufficient to explain the HIES phenotype observed in the ZNF341-deficient patients."
    explanation: States why reduced basal STAT3 alone is not accepted as sufficient.
- hypothesis_group_id: znf341_stat1_mycobacteria
  hypothesis_label: Reduced STAT1 expression and mycobacterial susceptibility
  status: EMERGING
  description: >-
    ZNF341 also binds the STAT1 promoter and ZNF341-deficient cells have lower
    STAT1. Two patients have had tuberculosis, and the 2023 review raises the
    possibility that partial STAT1 impairment contributes; the original 2018
    report judged the lower STAT1 unlikely to contribute to the clinical
    phenotype. Unresolved.
  evidence:
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "we cannot rule out the possibility that ZNF341-deficient patients are susceptible to virulent environmental mycobacteria due to a partial impairment of STAT1 signaling"
    explanation: Frames the STAT1 route to mycobacterial disease as a possibility only.
  - reference: PMID:29907691
    reference_title: "A recessive form of hyper-IgE syndrome by disruption of ZNF341-dependent STAT3 transcription and activity."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "the lower levels of STAT1 observed in ZNF341-deficient patients are unlikely to account for or even contribute to their immunological or clinical phenotypes."
    explanation: The discovery paper argued the opposite, that reduced STAT1 is unlikely to matter clinically.
- hypothesis_group_id: dna_repair_malignancy
  hypothesis_label: Impaired DNA repair and malignancy predisposition
  status: EMERGING
  description: >-
    Ex vivo irradiated leukocytes from four ZNF341-deficient patients repaired
    DNA damage more slowly than controls, and one patient developed a nasal
    primitive neuroendocrine tumor followed by papillary thyroid cancer. The
    authors propose that the repair defect, together with radiation exposure,
    predisposes to malignancy. The clinical side of this rests on one patient.
  evidence:
  - reference: PMID:35511492
    reference_title: "Increased radiosensitivity and impaired DNA repair in patients with STAT3-LOF and ZNF341 deficiency, potentially contributing to malignant transformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased radiosensitivity and impaired DNA repair were demonstrated in patients diagnosed with STAT3-LOF and ZNF341 deficiency, potentially explaining the susceptibility to malignant transformation."
    explanation: Comet-assay study on patient leukocytes proposing the DNA-repair route to malignancy.
pathophysiology:
- name: ZNF341 biallelic loss of function
  description: >-
    All 20 patients pooled in the 2023 review were homozygous for predicted
    loss-of-function ZNF341 alleles (nonsense, frameshift, essential splice
    site); a biallelic missense allele has since been reported, so truncation
    characterises that cohort rather than defining the disease. The truncated
    products lack most of the twelve C2H2 zinc fingers; the p.Gln195* and
    p.Arg302* products are retained in the cytoplasm, and mutant proteins fail
    to activate the STAT3 promoter. ZNF341 is a constitutively nuclear
    transcription factor expressed in all leukocytes tested and in fibroblasts
    and keratinocytes.
  biological_scale: MOLECULAR

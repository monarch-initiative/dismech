    snippet: "kindred D had a frameshift deletion (c.1062delG) leading to a premature stop codon (K355fs), kindred E had a nonsense mutation (c.1626C>G) replacing the tyrosine 542 codon with a premature stop codon (Y542X), and kindred F had a nonsense mutation (c.583C>T) replacing the glutamine 195 codon with a premature stop codon (Q195X)"

name: ZNF341 Deficiency
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
synonyms:
- Autosomal recessive hyper-IgE syndrome due to ZNF341 deficiency
- Autosomal recessive HIES due to ZNF341 deficiency
- AR-HIES due to ZNF341 deficiency
- Autosomal recessive hyperimmunoglobulin E syndrome due to zinc finger protein 341 deficiency
- Hyper-IgE recurrent infection syndrome 3, autosomal recessive
- HIES3
disease_term:
  preferred_term: ZNF341 Deficiency
  term:
    id: MONDO:0032654
    label: hyper-IgE recurrent infection syndrome 3, autosomal recessive
parents:
- Hyper-IgE syndrome
- Inborn error of immunity
- Primary immunodeficiency
description: >-
  ZNF341 deficiency is an autosomal recessive hyper-IgE syndrome caused by
  biallelic loss-of-function variants in ZNF341, a nuclear C2H2 zinc-finger
  transcription factor that binds the STAT3 promoter. Loss of ZNF341 lowers
  basal STAT3 mRNA and protein and abolishes the cytokine- and TCR-driven
  autoinduction of STAT3 in lymphocytes, so the disease is a clinical and
  immunological phenocopy of autosomal dominant (dominant-negative) STAT3
  hyper-IgE syndrome, reached through reduced STAT3 supply rather than a
  poisoned STAT3 dimer. Atopic dermatitis is present in essentially every
  reported patient and is typically the presenting feature from early
  childhood; recurrent staphylococcal skin infection and abscesses, chronic
  mucocutaneous candidiasis, sinopulmonary infection, high serum IgE and
  eosinophilia follow, with low Th17 cells, excess Th2 cells and low memory B
  cells. Compared with STAT3 dominant-negative disease the course is milder
  (median NIH HIES score 28.5 versus 64), the extra-hematopoietic
  connective-tissue, skeletal and dental features are less frequent, no
  vascular complications have been reported, serum IgG is typically high, and
  NK cell counts are low in most patients. About 20 patients have been
  published, nearly all homozygous for truncating variants in consanguineous
  kindreds.
notes: >-
  Lump/split: kept as a separate Disease entry from
  Autosomal_Dominant_Hyper-IgE_Syndrome (STAT3), not a subtype of it. The two
  differ in gene, inheritance and molecular mechanism (loss of a
  transcriptional regulator of STAT3 versus dominant-negative STAT3), carry
  separate MONDO, OMIM (618282), Orphanet (ORPHA:641368) and ClinGen
  assertions, and differ in several features (NK lymphopenia, high IgG, fewer
  extra-hematopoietic features). IUIS lists them as separate rows of the same
  hyper-IgE subtable. The entry name follows the literature's usual term
  ("ZNF341 deficiency") and the gene-named convention used for other inborn
  errors of immunity in this knowledge base; the exact MONDO label is kept as
  a synonym. The somatic MN1::ZNF341 fusion reported in pediatric round-cell
  tumors is an unrelated somatic event and is out of scope for this germline
  entry. No GeneReviews chapter names this disease. No animal model of ZNF341
  deficiency was found (PubMed query "ZNF341", 29 records on 2026-09-23, none
  describing a Znf341-mutant animal).

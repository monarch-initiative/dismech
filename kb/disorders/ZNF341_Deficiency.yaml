  description: >-
    STAT3 levels are also reduced in patient fibroblasts, and patients develop
    the connective-tissue, skeletal and dental features of STAT3 HIES, but less
    often and more mildly. The discovery paper suggests the IL-11R, LIFR and
    IL-6ST-dependent programs in these tissues need less STAT3 than lymphocyte
    programs do. This is an interpretation, not a measured tissue-by-tissue

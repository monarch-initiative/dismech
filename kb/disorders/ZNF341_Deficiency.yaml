- name: Recurrent cutaneous abscesses
  category: Infectious
  frequency: FREQUENT
  description: >-
    Skin abscesses were reported in 15 of 20 patients (75%), a frequency similar
    to STAT3 dominant-negative disease. The 2023 review states that
    inflammation is clinically and biologically appropriate in ZNF341
    deficiency, whereas the Frey-Jakobs and Israeli reports describe cold
    abscesses in some patients; see the discussion attached to this phenotype.
  phenotype_term:

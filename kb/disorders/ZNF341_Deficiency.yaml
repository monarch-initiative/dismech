    snippet: "ZNF341 (c.538C > G; p.Pro180Ala) | This manuscript | 2 | F | Hyperpigmented plaques, diffuse xerosis and pruritis, cutaneous infections including eczema herpeticum | IGA score of 4, > 70% TBSA | IgE > 40,000 IU/mL | 600 mg loading dose, 200 mg Q2W | After: 6 months: IGA score of 1, < 10% TBSA | After 6 months: IgE 6935 IU/mL |"
    explanation: Source for this child's dosing, baseline severity and six-month response recorded here.
- name: Topical corticosteroids and calcineurin inhibitors for atopic dermatitis
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Topical corticosteroids and topical calcineurin inhibitors with oral
    antihistamines are the mainstay of atopic dermatitis management in hyper-IgE
    syndrome generally. They are not always sufficient in ZNF341 deficiency:
    the one patient reported in detail applied ultra-high potency class I
    topical corticosteroids daily together with topical tacrolimus without
    effect before dupilumab was started.
  treatment_term:
    preferred_term: Topical corticosteroid and calcineurin-inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: topical corticosteroid
      term:
        id: NCIT:C29505
        label: Topical Corticosteroid
    - preferred_term: tacrolimus
      term:
        id: NCIT:C1311
        label: Tacrolimus
  target_phenotypes:
  - preferred_term: Atopic dermatitis
    term:
      id: HP:0001047
      label: Atopic dermatitis
  evidence:
  - reference: PMID:31993867
    reference_title: "Efficacy of Dupilumab for Controlling Severe Atopic Dermatitis in a Patient with Hyper-IgE Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Topical corticosteroids and calcineurin inhibitors, associated with oral antihistamines are the main treatment, whereas immunosuppressive agents are not recommended given a higher risk of infection."
    explanation: States the standard topical regimen for hyper-IgE syndrome, and that systemic immunosuppression is avoided because of infection risk.
  - reference: PMID:31993867
    reference_title: "Efficacy of Dupilumab for Controlling Severe Atopic Dermatitis in a Patient with Hyper-IgE Syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "She applied ultra-high potency class I topical corticosteroids daily, and topical tacrolimus, which were ineffective."
    explanation: In the one ZNF341-deficient patient reported in detail the topical regimen failed, so it is not reliably sufficient here.
- name: Surveillance for malignancy
  action_category: MONITORING
  description: >-
    Leukocytes from ZNF341-deficient patients clear radiation-induced DNA
    damage more slowly than those of controls, and the one malignancy reported
    in the disorder - a nasal primitive neuroendocrine tumour followed by
    papillary thyroid cancer - arose in a patient in that study. The authors
    read the radiosensitivity as a potential explanation for susceptibility to
    malignant transformation. This supports being deliberate about cumulative
    diagnostic radiation and about cancer surveillance, but the basis is one
    patient and an ex vivo assay in four, and no surveillance protocol,
    starting age or interval has been published for this disorder.
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:35511492
    reference_title: "Increased radiosensitivity and impaired DNA repair in patients with STAT3-LOF and ZNF341 deficiency, potentially contributing to malignant transformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased radiosensitivity and impaired DNA repair were demonstrated in patients diagnosed with STAT3-LOF and ZNF341 deficiency, potentially explaining the susceptibility to malignant transformation."
    explanation: The comet-assay study's own conclusion, which is the entire published rationale for surveillance in this disorder.
- name: Genetic counselling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    The kindreds pooled in the 2023 review are consanguineous and their
    patients homozygous for a truncating allele, so counselling for an affected
    family turns on
    recessive recurrence and on carrier testing within the extended family.
    The cited sources state the inheritance pattern and the consanguinity but
    give no numerical recurrence risk, so none is asserted in this entry.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: CGGV:assertion_2dc4032e-7215-464d-9844-c392ec25148b-2024-06-04T170000.000Z
    reference_title: "ZNF341 / hyper-IgE recurrent infection syndrome 3, autosomal recessive (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This curation included ten probands from 10 unrelated consanguineous families (PMID: 29907691, 29907690 & 37080116)."
    explanation: Records that consanguinity is the context in which every published proband was ascertained.
diagnosis:
- name: ZNF341 molecular genetic testing
  description: >-
    Because ZNF341 deficiency is clinically almost indistinguishable from STAT3
    dominant-negative AD-HIES, the diagnosis rests on finding biallelic ZNF341
    loss-of-function variants, by an HIES or inborn-errors-of-immunity gene
    panel or by exome sequencing. In both discovery cohorts STAT3 itself was
    sequenced and excluded first. A high NIH HIES score with an autosomal
    recessive pedigree, consanguinity, low NK cells or high IgG should prompt
    testing that covers ZNF341 rather than STAT3 alone.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic ZNF341 loss-of-function variants
  evidence:
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although generally milder, AR ZNF341 deficiency is a hardly distinguishable clinical phenocopy of AD STAT3 deficiency in the absence of genetic testing."
    explanation: States that genetic testing is what separates this disorder from STAT3 AD-HIES.
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic defects in STAT3 itself were excluded by sequencing of the exons, cDNA, and the genomic promoter region"
    explanation: Shows STAT3 exclusion preceding the ZNF341 diagnosis in the discovery cohort.
- name: Th17 enumeration by flow cytometry
  description: >-
    Reduced circulating IL-17-producing CD4+ T cells are found in most
    patients and support a STAT3-pathway defect, but they do not distinguish
    ZNF341 deficiency from STAT3 dominant-negative disease, in which the same
    reduction is seen at a comparable frequency. Low NK cell counts, uncommon
    in STAT3 deficiency, are the flow-cytometric finding that points toward
    ZNF341.
  diagnosis_term:
    preferred_term: Th17 and NK cell flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: Reduced Th17 cell proportion; reduced NK cell count
  evidence:
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, ZNF341 deficiency phenocopies STAT3 deficiency in terms of the immunological phenotype of patients, except that NK cell counts are low in a majority of patients with ZNF341 deficiency but rarely in those with STAT3 deficiency."
    explanation: Identifies NK lymphopenia as the immunological finding that separates the two disorders.
differential_diagnoses:
- name: STAT3 dominant-negative hyper-IgE syndrome (AD-HIES)
  description: >-
    The principal differential and a near-complete clinical phenocopy. It is
    autosomal dominant, usually de novo, and acts by negative dominance rather
    than loss of function. Pointers away from it and toward ZNF341 deficiency
    are a recessive pedigree with consanguinity, a lower NIH HIES score (median
    28.5 versus 64), low NK cells, high serum IgG, less frequent
    connective-tissue, skeletal and dental involvement, and no reported
    vascular complication. None of these is decisive without genetic testing.
  evidence:
  - reference: PMID:37080116
    reference_title: "Inherited human ZNF341 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although generally milder, AR ZNF341 deficiency is a hardly distinguishable clinical phenocopy of AD STAT3 deficiency in the absence of genetic testing."
    explanation: Establishes AD-HIES as the differential that clinical assessment alone cannot exclude.
- name: DOCK8 deficiency (autosomal recessive HIES)
  description: >-
    The commonest autosomal recessive hyper-IgE syndrome, and therefore the
    first alternative in a recessive pedigree. It is distinguished by severe
    cutaneous viral infection - herpes simplex, human papillomavirus,
    molluscum - which was specifically looked for and not found in any ZNF341
    patient, and by early malignancy.
  evidence:
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased susceptibility to viral infections, typical in DOCK8-deficient AR-HIES, was not observed in any of the patients."
    explanation: The discriminating feature, assessed directly in the ZNF341 discovery cohort.
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "biallelic DOCK8 mutations account for disease in ~80% of patients with the autosomal-recessive (AR) form of HIES"
    explanation: Establishes DOCK8 as the leading cause of AR-HIES and so the first differential to exclude.
- name: PGM3 deficiency
  description: >-
    A further autosomal recessive hyper-IgE syndrome, in which the
    glycosylation defect adds neurocognitive impairment and skeletal dysplasia
    to the atopy and high IgE. It is covered by any HIES gene panel.
  evidence:
  - reference: PMID:29907690
    reference_title: "ZNF341 controls STAT3 expression and thereby immunocompetence."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Additionally, mutations in PGM3 (MIM: 172100, (15, 16)) have been described in AR-HIES."
    explanation: Names PGM3 as a further recessive HIES gene to consider.

prevalence:
- population: California newborn-screening cohort
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.399
  notes: >
    The California program reported 71 diagnosed infants among 2,959,108
    screened (1 in 41,676). Incomplete confirmatory data and many mild or
    unclassified biochemical phenotypes limit generalization beyond this
    screening program.
  evidence:
  - reference: PMID:24103308

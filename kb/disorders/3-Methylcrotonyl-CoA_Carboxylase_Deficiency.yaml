  presence: INCREASED
  context: >
    Urinary 3-hydroxyisovaleric acid is a characteristic downstream metabolite,
    but it can be absent or only mildly elevated and must be interpreted with
    the full acylcarnitine, organic-acid, enzymatic, and molecular profile.
  biomarker_term:
    preferred_term: 3-hydroxyisovaleric acid
    term:
      id: CHEBI:37084
      label: 3-hydroxyisovaleric acid
  readouts:
  - target: Leucine-pathway metabolite shunting
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Increased urinary 3-hydroxyisovaleric acid supports a leucine-pathway block.
  evidence:
  - reference: PMID:36822454
    reference_title: "Newborn screening for 3-methylcrotonyl-CoA carboxylase deficiency in Zhejiang province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "94 % (50/53) of the patients had markedly increased urinary 3-hydroxyisovaleric acid and 3-methylcrotonylglycine."
    explanation: Provides a defined denominator and shows the marker is characteristic but not universal.
- name: Increased urinary 3-methylcrotonylglycine
  presence: INCREASED
  context: >
    Urinary 3-methylcrotonylglycine accompanies 3-hydroxyisovaleric acid in the
    characteristic organic-acid profile; the analyte is kept separate because
    it does not share the 3-hydroxyisovaleric-acid ontology binding.
  readouts:
  - target: Leucine-pathway metabolite shunting
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Increased urinary 3-methylcrotonylglycine supports abnormal handling of 3-methylcrotonyl-CoA.
  evidence:
  - reference: PMID:36822454
    reference_title: "Newborn screening for 3-methylcrotonyl-CoA carboxylase deficiency in Zhejiang province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "94 % (50/53) of the patients had markedly increased urinary 3-hydroxyisovaleric acid and 3-methylcrotonylglycine."
    explanation: Quantifies the combined urinary metabolite pattern.
- name: Decreased free carnitine
  presence: DECREASED
  context: >
    Secondary carnitine deficiency is variably present and is a monitoring and
    treatment target rather than a measure of residual MCC activity.
  biomarker_term:
    preferred_term: carnitine
    term:
      id: CHEBI:17126
      label: carnitine
  readouts:
  - target: Secondary carnitine depletion
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: Low plasma free carnitine identifies secondary depletion that may warrant replacement.
  evidence:
  - reference: PMID:36822454
    reference_title: "Newborn screening for 3-methylcrotonyl-CoA carboxylase deficiency in Zhejiang province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-three of 53 patients had secondary carnitine deficiency."
    explanation: Shows depletion in a substantial but non-universal subset.
- name: Isolated reduction of MCC enzyme activity
  presence: DECREASED
  context: >
    Demonstration of severely reduced MCC activity with preserved
    propionyl-CoA carboxylase activity in cultured fibroblasts supports isolated
    MCC deficiency and helps distinguish it from multiple-carboxylase defects.
  readouts:
  - target: MCCC1/MCCC2-dependent methylcrotonyl-CoA carboxylase deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Low MCC with normal PCC directly measures the isolated enzyme defect.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In all but two individuals MCC activity in fibroblasts was severely reduced combined with normal activity of PCC."
    explanation: Directly supports the isolated fibroblast enzyme-activity pattern.

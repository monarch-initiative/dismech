- population: Zhejiang Province newborn-screening cohort
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.204
  notes: >
    Screening of 4,402,587 newborns from 2009 through August 2022 identified 53
    cases, corresponding to 1 in 83,068 newborns in Zhejiang Province.
  evidence:
  - reference: PMID:36822454
    reference_title: "Newborn screening for 3-methylcrotonyl-CoA carboxylase deficiency in Zhejiang province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated incidence of 3-MCCD in Zhejiang Province was 1 in 83,068 newborns."

name: 3-Methylcrotonyl-CoA Carboxylase Deficiency
category: Mendelian
creation_date: '2026-05-03T00:00:00Z'
synonyms:
- 3-MCC deficiency
- 3-MCCD
- 3-methylcrotonylglycinuria
- MCC deficiency
- MCCD
description: >
  3-methylcrotonyl-CoA carboxylase deficiency (3-MCCD) is an autosomal
  recessive disorder of leucine catabolism caused by biallelic pathogenic
  variants in MCCC1 or MCCC2, which encode the alpha and beta subunits of the
  mitochondrial, biotin-dependent methylcrotonyl-CoA carboxylase complex.
  Reduced enzyme activity impairs conversion of 3-methylcrotonyl-CoA to
  3-methylglutaconyl-CoA and produces elevated C5OH acylcarnitine and urinary
  3-hydroxyisovaleric acid and 3-methylcrotonylglycine. Clinical penetrance is
  low: most newborn-screening-identified individuals remain asymptomatic, while
  a minority can develop acute organic-aciduria-like decompensation during
  intercurrent illness or other catabolic stress. C5OH concentration,
  biochemical severity, and genotype do not reliably predict outcome, and
  chronic nonspecific neurologic findings require evaluation for alternative
  causes.

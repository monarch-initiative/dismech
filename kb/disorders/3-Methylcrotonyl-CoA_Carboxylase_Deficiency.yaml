- discussion_id: gap_translation_of_experimental_oxidative_stress
  prompt: >
    Do the mitochondrial and oxidative-stress effects observed in two affected
    fibroblast lines and metabolite-exposed rat cortex preparations operate in
    vivo, and do they explain any human clinical outcome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Experimental mitochondrial and oxidative stress
  rationale: >
    The experimental findings are mechanistically interesting but derive from
    very small in-vitro systems. The branch is intentionally detached from
    patient phenotypes until human tissue, biomarker, or intervention data
    establish translation.
  proposed_experiments:
  - experiment_id: exp_3mccd_human_metabolic_stress_translation
    name: Genotype-confirmed human metabolic-stress translation study
    description: >
      Compare isogenic control and MCCC1- or MCCC2-deficient human iPSC-derived
      hepatocytes under basal and catabolic-stress conditions, measuring MCC
      flux, C5OH and organic-acid release, free carnitine, mitochondrial
      respiration, and redox markers. In parallel, test whether the same marker
      signature is detectable prospectively during well and illness visits in
      molecularly confirmed patients, including asymptomatic and crisis-prone
      groups. Concordant, crisis-associated human-cell and patient signatures
      would support translation; their absence would argue that the fibroblast
      and rat-preparation findings are model-specific.
  evidence:
  - reference: PMID:27417235
    reference_title: A 3-methylcrotonyl-CoA carboxylase deficient human skin fibroblast transcriptome reveals underlying mitochondrial dysfunction and oxidative stress.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "immortalized cultured skin fibroblast cells of two clinically affected MCC deficient patients and two healthy individuals"
    explanation: Shows the limited sample and surrogate cell type underlying the human-cell hypothesis.
  - reference: PMID:23053545
    reference_title: Neurochemical evidence that the metabolites accumulating in 3-methylcrotonyl-CoA carboxylase deficiency induce oxidative damage in cerebral cortex of young rats.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It is therefore presumed that alterations of the cellular redox homeostasis"
    explanation: The study itself frames translation from the rat preparation as a presumption.
- discussion_id: interpretation_mccc1_arg385ser_and_biotin_response
  prompt: >
    Should MCCC1 p.Arg385Ser be treated as a clinically relevant dominant-negative,
    biotin-responsive exception, or as a low-penetrance biochemical allele whose
    reported two-patient response does not justify changing canonical recessive
    inheritance or routine treatment?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#MCCC1
  rationale: >
    An early report described partial deficiency, heterozygous dominant-negative
    behavior, and biotin responsiveness in two people. A larger later cohort
    found the allele in both severely affected and asymptomatic individuals.
    This exceptional literature should not support routine biotin therapy
    without specialist review.
  evidence:
  - reference: PMID:15868465
    reference_title: Molecular mechanism of dominant expression in 3-methylcrotonyl-CoA carboxylase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both showed evidence of biotin responsiveness and were heterozygous for the missense mutation MCCA-R385S."
    explanation: Captures the two-patient observation behind the exceptional biotin-responsive claim.
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.R385S appears not to be a predictor of a particular phenotype"
    explanation: Later cohort evidence weakens any simple clinical interpretation of the allele.

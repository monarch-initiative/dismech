    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mitochondrial enzyme MCC (EC 6.4.1.4) catalyzes the fourth step in the leucine catabolic pathway"
    explanation: Defines the enzyme, compartment, and blocked pathway step.
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCC consists of an alpha and a beta subunit assembled into a α6β6 dodecamer."
    explanation: Supports the two-subunit holoenzyme architecture encoded by MCCC1 and MCCC2.
  downstream:
  - target: Leucine-pathway metabolite shunting
    description: Reduced MCC activity blocks normal leucine-catabolic flux and diverts upstream carbon into characteristic organic acids and C5OH acylcarnitine.
    causal_link_type: DIRECT

      evidence_source: HUMAN_CLINICAL
      snippet: "A genetic defect in 3-methylcrotonyl-CoA carboxylase leads to elevation of 3-methylcrotonyl CoA, 3-methylcrotonyl glycine and 3-OH isovaleric acid"
      explanation: Directly connects the enzyme defect to upstream metabolite elevation.
- name: Leucine-pathway metabolite shunting
  description: >
    The blocked reaction is associated with accumulation and excretion of
    3-hydroxyisovaleric acid, 3-methylcrotonylglycine, and
    3-hydroxyisovalerylcarnitine (C5OH). Clinical toxicity and any associated
    energy deficit are incompletely established: very high metabolite excretion
    is often compatible with an asymptomatic course, so this node is not mapped
    to the module's toxic-metabolite/energy-deficit state.
  chemical_entities:

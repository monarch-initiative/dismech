progression:
- phase: Predominantly asymptomatic course after newborn-screening detection
  age_range: Infancy through reported follow-up
  notes: >
    Most people identified prospectively through newborn screening remain
    clinically well during available follow-up. Follow-up remains relatively
    short in many cohorts, so absence of childhood symptoms does not establish
    lifelong absence of risk.
  evidence:
  - reference: PMID:36822454
    reference_title: "Newborn screening for 3-methylcrotonyl-CoA carboxylase deficiency in Zhejiang province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these 53 patients did not present any clinical symptom."
    explanation: All 53 screened cases were asymptomatic during reported follow-up.
  - reference: PMID:26566957
    reference_title: "Primary and maternal 3-methylcrotonyl-CoA carboxylase deficiency: insights from the Israel newborn screening program."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the primary 3MCCD individuals were asymptomatic"
    explanation: The Israeli program likewise found a predominantly asymptomatic screened phenotype.
- phase: Occasional catabolic-stress decompensation
  age_range: Infancy and childhood, rarely later
  notes: >
    A minority develop acute metabolic crises, commonly in association with
    infection or another catabolic stressor. The largest classic cohort mixed
    newborn-screened, symptom-referred, family-screened, and maternal cases and
    is therefore vulnerable to ascertainment bias.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "12 patients (5 of 53 identified by newborn screening) presented with acute metabolic decompensations."
    explanation: Quantifies acute crises in the mixed 88-person cohort and its newborn-screened subset.
  - reference: DOI:10.3390/ijns11040115
    reference_title: "Psychological Impact of Newborn Screening for 3-Methylcrotonyl-CoA Carboxylase Deficiency: The Parental Experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one patient experienced metabolic decompensation during an intercurrent illness, which was promptly treated."
    explanation: A recent nine-child cohort documents one illness-associated crisis during mean follow-up to 4.2 years.
- phase: Uncertain attribution of chronic nonspecific findings
  age_range: Childhood through adulthood
  notes: >
    Developmental delay, hypotonia, seizures, failure to thrive, and fatigue
    have been reported, but they are not specific to defective leucine
    catabolism. A second diagnosis or other contributor should be sought when
    chronic neurologic or multisystem findings dominate.
  evidence:
  - reference: PMID:25356967
    reference_title: Consanguinity and rare mutations outside of MCCC genes underlie nonspecific phenotypes of MCCD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For 5 of these 10 individuals, we discovered a homozygous damaging mutation in a disease gene"
    explanation: Alternative homozygous disease-gene variants plausibly explained nonspecific findings in half of the examined cases.
  - reference: PMID:27033733
    reference_title: Outcomes of cases with 3-methylcrotonyl-CoA carboxylase (3-MCC) deficiency - Report from the Inborn Errors of Metabolism Information System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "15% of those with available developmental information had recorded developmental disabilities not clearly attributable to other causes."
    explanation: Registry data show a small developmental-signal estimate while retaining uncertainty about attribution.
pathophysiology:
- name: MCCC1/MCCC2-dependent methylcrotonyl-CoA carboxylase deficiency
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  description: >
    Biallelic pathogenic variants in MCCC1 or MCCC2 reduce activity of the
    mitochondrial alpha6-beta6 methylcrotonyl-CoA carboxylase holoenzyme. The
    biotin-dependent enzyme catalyzes the fourth step of leucine catabolism,
    converting 3-methylcrotonyl-CoA toward 3-methylglutaconyl-CoA.
  genes:
  - preferred_term: MCCC1
    term:
      id: hgnc:6936
      label: MCCC1
  - preferred_term: MCCC2
    term:
      id: hgnc:6937
      label: MCCC2

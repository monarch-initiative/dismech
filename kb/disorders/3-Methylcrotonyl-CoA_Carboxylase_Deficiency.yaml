diagnosis:
- name: C5OH newborn-screening signal with infant-mother evaluation
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  description: >
    In newborn-screening programs, elevated C5OH is followed by repeat infant
    biochemical testing and evaluation of a possible maternal source. C5OH
    alone neither establishes 3-MCCD nor predicts which person will become
    symptomatic.
  results: Persistent infant C5OH supports an infant biochemical phenotype; infant normalization with a persistent maternal pattern supports maternal origin. Neither is a final diagnosis.
  evidence:
  - reference: PMID:27033733
    reference_title: Outcomes of cases with 3-methylcrotonyl-CoA carboxylase (3-MCC) deficiency - Report from the Inborn Errors of Metabolism Information System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C5OH level found on newborn screening by itself is not sufficient for diagnostic or predictive purposes."
    explanation: Directly limits the interpretation of C5OH screening concentration.
  - reference: PMID:26566957
    reference_title: "Primary and maternal 3-methylcrotonyl-CoA carboxylase deficiency: insights from the Israel newborn screening program."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "several asymptomatic 3MCCD mothers were initially identified following abnormal screening of their healthy babies"
    explanation: Supports evaluation for a maternal source of an infant screening signal.
  - reference: PMID:18155630
    reference_title: A Delphi-based consensus clinical practice protocol for the diagnosis and management of 3-methylcrotonyl CoA carboxylase deficiency.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "initial evaluation of the screen-positive infant-mother dyad"
    explanation: Expert consensus explicitly frames initial evaluation around the infant-mother dyad, although all recommendations were Grade D.
- name: Confirmatory acylcarnitine and urine organic-acid testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    Repeat plasma or dried-blood-spot acylcarnitines and urine organic acids
    define the biochemical pattern. The characteristic combination is
    supportive but was paired with molecular or enzymatic confirmation in
    well-characterized cohorts when the diagnosis was uncertain.
  results: Elevated C5OH plus urinary 3-hydroxyisovaleric acid and 3-methylcrotonylglycine.
  evidence:
  - reference: PMID:27033733
    reference_title: Outcomes of cases with 3-methylcrotonyl-CoA carboxylase (3-MCC) deficiency - Report from the Inborn Errors of Metabolism Information System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up confirmatory testing included plasma acylcarnitine and urine organic acid analyses."
    explanation: Documents the core confirmatory biochemical studies used after screening.
  - reference: PMID:36822454
    reference_title: "Newborn screening for 3-methylcrotonyl-CoA carboxylase deficiency in Zhejiang province, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recalled for repeated testing, urine organic acid analysis and molecular genetic analysis"
    explanation: Provides an independent staged confirmatory workflow.
- name: MCCC1 and MCCC2 molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >
    Identification of biallelic pathogenic variants in either MCCC1 or MCCC2
    confirms canonical autosomal-recessive 3-MCCD and enables family testing.
    A single MCCC1 or MCCC2 variant can accompany a mild biochemical phenotype
    and does not meet this canonical biallelic criterion. Molecular results do
    not by themselves predict clinical severity.
  results: Biallelic pathogenic variants in MCCC1 or MCCC2.
  evidence:
  - reference: CGGV:assertion_6bd0c545-9ef8-4005-a124-a73be6178745-2019-10-25T160000.000Z
    reference_title: "MCCC1 / 3-methylcrotonyl-CoA carboxylase deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MCCC1 | HGNC:6936 | 3-methylcrotonyl-CoA carboxylase deficiency | MONDO:0018950 | AR | Definitive"
    explanation: Supports MCCC1 as a definitive molecular cause.
  - reference: CGGV:assertion_3653ea30-b630-499a-a6f0-65152106ad8c-2019-10-25T160000.000Z
    reference_title: "MCCC2 / 3-methylcrotonyl-CoA carboxylase deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MCCC2 | HGNC:6937 | 3-methylcrotonyl-CoA carboxylase deficiency | MONDO:0018950 | AR | Definitive"
    explanation: Supports MCCC2 as a definitive molecular cause.
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "carriers of a single mutation at the MCCC1 locus"
    explanation: Supports caution that a single variant can accompany a mild biochemical phenotype without establishing canonical biallelic disease.
- name: Isolated MCC enzyme activity assay
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    When molecular findings are incomplete or require functional confirmation,
    MCC and propionyl-CoA carboxylase activities can be assayed in cultured
    fibroblasts. Severe MCC reduction with preserved PCC supports isolated
    3-MCCD.
  results: Severely reduced MCC activity with normal PCC activity and an increased PCC-to-MCC activity ratio.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Diagnosis of MCC deficiency was confirmed by assaying MCC and PCC activities in fibroblasts"
    explanation: Directly supports paired fibroblast enzyme assays for confirmation.
differential_diagnoses:
- name: Maternal 3-methylcrotonyl-CoA carboxylase deficiency
  description: >
    Placental transfer of maternal C5OH-related metabolites can produce an
    abnormal newborn result in an unaffected infant. Repeat infant studies can
    normalize while maternal acylcarnitines remain abnormal; maternal molecular
    or enzyme confirmation then identifies the source.
  distinguishing_features:
  - Resolution of the infant C5OH elevation on repeat testing.
  - Persistent abnormal maternal acylcarnitines or urine organic acids.
  - Maternal biallelic MCCC1/MCCC2 variants or isolated MCC enzyme deficiency.
  evidence:
  - reference: PMID:25356967
    reference_title: Consanguinity and rare mutations outside of MCCC genes underlie nonspecific phenotypes of MCCD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "18 asymptomatic mothers who were discovered to have MCCD only by detection of abnormal C5OH-carnitine in the newborn screening sample"
    explanation: Documents maternal 3-MCCD discovered through an infant's transient screening abnormality.
- name: Multiple-carboxylase deficiencies
  description: >
    Biotinidase deficiency and holocarboxylase synthetase deficiency can elevate
    C5OH but affect multiple biotin-dependent carboxylases rather than isolated
    MCC. Serum biotinidase activity, the broader metabolite pattern, clinical
    context, and BTD or HLCS testing distinguish these treatable disorders.
  distinguishing_features:
  - Reduced biotinidase activity in biotinidase deficiency.
  - Biochemical evidence of more than one carboxylase defect.
  - Biallelic BTD or HLCS variants rather than MCCC1/MCCC2 variants.
  evidence:
  - reference: PMID:37373384
    reference_title: "Delayed Biotin Therapy in a Child with Atypical Profound Biotinidase Deficiency: Late Arrival of the Truth and a Lesson Worth Thinking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3-hydroxyisovaleryl-carnitine in plasma"
    explanation: Directly supports C5OH elevation in biotinidase deficiency.
  - reference: PMID:9350481
    reference_title: "Multiple carboxylase deficiency: inherited and acquired disorders of biotin metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "lead to deficiency of the 4 biotin-dependent carboxylases"
    explanation: Distinguishes biotin-metabolism disorders from an isolated MCC enzyme defect.
- name: HMG-CoA lyase deficiency
  description: >
    HMG-CoA lyase deficiency also elevates C5OH but produces a broader urinary
    leucine-pathway profile and a clinically important hypoketotic-hypoglycemia
    crisis phenotype. Urine organic acids and HMGCL testing distinguish it from
    isolated 3-MCCD.
  distinguishing_features:
  - Urinary 3-hydroxy-3-methylglutaric, 3-methylglutaconic, and 3-methylglutaric acids.
  - Hypoketotic hypoglycemia rather than a usually asymptomatic screened course.
  - Biallelic HMGCL variants.
  evidence:
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma of these patients contains elevated levels of 3‐hydroxyisovalerylcarnitine"
    explanation: Directly supports C5OH elevation in HMG-CoA lyase deficiency.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acidosis with hypoketotic hypoglycemia"
    explanation: Supports the distinguishing acute crisis pattern.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3‐hydroxy‐3‐methylglutaric acid (3H3MG‐A), 3‐methylglutaric acid (3MG‐A)"
    explanation: Supports the broader urine organic-acid profile that distinguishes HMG-CoA lyase deficiency.
- name: Beta-ketothiolase deficiency
  description: >
    Beta-ketothiolase deficiency can elevate C5OH during an acute crisis, but
    the acyl group is 2-methyl-3-hydroxybutyryl rather than
    3-hydroxyisovaleryl. Concurrent C5:1 and characteristic isoleucine-derived
    urine metabolites support ACAT1 deficiency.
  distinguishing_features:
  - Elevated C5:1 tiglylcarnitine with C5OH.
  - Urinary 2-methyl-3-hydroxybutyrate, tiglylglycine, and 2-methylacetoacetate.
  - Biallelic ACAT1 variants.
  evidence:
  - reference: PMID:23958592
    reference_title: "Metabolic encephalopathy in beta-ketothiolase deficiency: the first report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(2-methyl-3-hydroxybutyryl) carnitine and C5:1 (tiglyl) carnitine were elevated"
    explanation: Directly supports the distinguishing C5OH-plus-C5:1 crisis profile.
  - reference: PMID:23958592
    reference_title: "Metabolic encephalopathy in beta-ketothiolase deficiency: the first report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "large amounts of 2-methyl-3-hydroxybutyrate, tiglylglycine, and 2-methylacetoacetate were excreted."
    explanation: Supports the characteristic urinary isoleucine-derived metabolites.
treatments:
- name: Sick-day emergency regimen and avoidance of prolonged fasting
  action_category: THERAPEUTIC
  description: >
    A metabolic-specialist sick-day plan and precautions against prolonged
    fasting are commonly used with the aim of reducing catabolic stress.
    Observational evidence documents this practice, but its preventive effect
    has not been established in a controlled study.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Catabolic-stress acute metabolic decompensation
    treatment_effect: MODULATES
    description: Reducing catabolism is intended to lower the risk or severity of an illness-associated crisis.
    evidence:
    - reference: PMID:27033733
      reference_title: Outcomes of cases with 3-methylcrotonyl-CoA carboxylase (3-MCC) deficiency - Report from the Inborn Errors of Metabolism Information System.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The role that prevention of fasting plays in outcome cannot be ascertained."
      explanation: Supports the clinical rationale while explicitly showing that effectiveness remains unresolved.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "an emergency regimen during intercurrent illness"
    explanation: The cohort authors cautiously recommend an illness regimen rather than asserting proven efficacy.
  - reference: DOI:10.3390/ijns11040115
    reference_title: "Psychological Impact of Newborn Screening for 3-Methylcrotonyl-CoA Carboxylase Deficiency: The Parental Experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An emergency protocol was provided to all affected children to manage intercurrent illnesses."
    explanation: A recent cohort documents contemporary use of an emergency protocol.
- name: Carnitine supplementation for documented deficiency
  action_category: THERAPEUTIC
  description: >
    Oral L-carnitine can restore low free carnitine in people with documented
    secondary deficiency and may help selected symptomatic individuals. It
    does not correct the MCC block, and available data do not support universal
    supplementation.
  treatment_term:
    preferred_term: carnitine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: carnitine
      term:
        id: CHEBI:17126
        label: carnitine
  target_mechanisms:
  - target: Secondary carnitine depletion
    treatment_effect: RESTORES
    description: Supplementation replenishes depleted plasma and tissue free carnitine.
    evidence:
    - reference: PMID:25732994
      reference_title: "Is L-Carnitine Supplementation Beneficial in 3-Methylcrotonyl-CoA Carboxylase Deficiency?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "L-Carnitine supplementation increased muscle and plasma carnitine levels to a low-normal range"
      explanation: Directly supports biochemical restoration in the 13-person Faroese study.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monitoring of free carnitine concentrations"
    explanation: Supports monitoring-first, deficiency-directed replacement.
  - reference: PMID:25732994
    reference_title: "Is L-Carnitine Supplementation Beneficial in 3-Methylcrotonyl-CoA Carboxylase Deficiency?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Some symptomatic 3-MCCd patients may benefit biochemically and clinically from L-carnitine supplementation, a more general recommendation cannot be given."
    explanation: Limits the possible benefit to selected individuals and rejects a general recommendation.
- name: Individualized dietary management
  therapeutic_modality: BEHAVIORAL
  action_category: THERAPEUTIC
  description: >
    Routine leucine or protein restriction is usually unnecessary. A metabolic
    specialist may consider a modest, individualized leucine restriction for a
    person with recurrent or severe specific crises, but clinical efficacy is
    unproven and nutritional adequacy must be protected.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Leucine-pathway metabolite shunting
    treatment_effect: MODULATES
    description: Reducing leucine substrate is intended to reduce upstream metabolite burden, but outcome benefit has not been demonstrated.
    evidence:
    - reference: PMID:27033733
      reference_title: Outcomes of cases with 3-methylcrotonyl-CoA carboxylase (3-MCC) deficiency - Report from the Inborn Errors of Metabolism Information System.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "At present, the role of dietary leucine restriction remains unproven"
      explanation: Directly identifies the proposed intervention and uncertainty in efficacy.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dietetic treatment is usually not required."
    explanation: Supports avoiding routine restriction for most affected people.
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "but the efficacy of these approaches is unproven"
    explanation: Supports selective use only with an explicit evidence limitation.
discussions:
- discussion_id: gap_penetrance_and_risk_stratification
  prompt: >
    Which genetic, metabolic, or environmental modifiers distinguish the small
    subgroup at risk of specific metabolic crises from the much larger
    asymptomatic biochemically affected population?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal recessive inheritance with incomplete clinical penetrance
  - progression#Occasional catabolic-stress decompensation
  - pathophysiology#Catabolic-stress acute metabolic decompensation
  rationale: >
    Neither genotype, residual biochemical phenotype, nor newborn-screening
    C5OH identifies who will decompensate. Prospective, uniformly confirmed
    cohorts with untreated natural-history comparators are lacking.
  evidence:
  - reference: PMID:22642865
    reference_title: "3-methylcrotonyl-CoA carboxylase deficiency: clinical, biochemical, enzymatic and molecular studies in 88 individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neither the genotype nor the biochemical phenotype is helpful in predicting the clinical course."
    explanation: Directly states the current failure of genotype and biochemical risk stratification.
  - reference: PMID:27033733
    reference_title: Outcomes of cases with 3-methylcrotonyl-CoA carboxylase (3-MCC) deficiency - Report from the Inborn Errors of Metabolism Information System.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no correlation between newborn screening (NBS) C5OH level and presence of metabolic, newborn, later-life or developmental abnormalities"
    explanation: Shows that initial C5OH concentration also fails as a prognostic marker.
- discussion_id: controversy_newborn_screening_benefit_and_burden
  prompt: >
    Does population newborn screening for 3-MCCD prevent enough severe morbidity
    to justify false-positive recalls, detection of clinically insignificant
    biochemical phenotypes, chronic surveillance, and family psychological
    burden?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - diagnosis#C5OH newborn-screening signal with infant-mother evaluation
  - progression#Predominantly asymptomatic course after newborn-screening detection
  rationale: >
    Programs identify many asymptomatic infants and adults, C5OH is nonspecific,
    and comparative evidence for prevention of crises is absent. Recent cohorts
    nonetheless document treatable illness events and parents who support
    screening, so benefit and burden remain contested.
  evidence:
  - reference: PMID:24103308
    reference_title: Analysis of cases of 3-methylcrotonyl CoA carboxylase deficiency (3-MCCD) in the California newborn screening program reported in the state database.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a significant number of individuals receiving treatment for 3-MCCD may not have a clinically significant condition."
    explanation: Captures the overdiagnosis and overtreatment concern in a large state program.
  - reference: PMID:26566957
    reference_title: "Primary and maternal 3-methylcrotonyl-CoA carboxylase deficiency: insights from the Israel newborn screening program."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest to exclude this disorder from NBS programs."
    explanation: Provides one published program-level argument against continued screening.
  - reference: DOI:10.3390/ijns11040115
    reference_title: "Psychological Impact of Newborn Screening for 3-Methylcrotonyl-CoA Carboxylase Deficiency: The Parental Experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Psychological assessments revealed an initial high level of parental psychological impact, which decreased over time."
    explanation: Adds recent direct evidence about an important screening burden.
  - reference: DOI:10.3390/ijns11040115
    reference_title: "Psychological Impact of Newborn Screening for 3-Methylcrotonyl-CoA Carboxylase Deficiency: The Parental Experience"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All parents strongly supported the screening program."
    explanation: Provides a contrasting parent-reported argument in favor of screening.
- discussion_id: gap_treatment_thresholds_and_effectiveness
  prompt: >
    Which asymptomatic or symptomatic individuals benefit clinically from
    fasting precautions, carnitine replacement, or leucine restriction, and
    what biochemical or clinical thresholds should trigger each intervention?

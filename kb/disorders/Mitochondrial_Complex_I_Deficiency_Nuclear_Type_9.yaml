      blocked a late step of complex I assembly.
    explanation: >-
      NDUFS6 and its zinc site are needed for late assembly.
  - reference: PMID:25902503
    reference_title: "Accessory NUMM (NDUFS6) subunit harbors a Zn-binding site and is essential for biogenesis of mitochondrial complex I."

name: Mitochondrial Complex I Deficiency, Nuclear Type 9
creation_date: "2026-11-27T13:53:38Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 9 (MC1DN9) is the autosomal
  recessive disorder caused by biallelic variants in NDUFS6, a small accessory
  subunit of the complex I matrix arm that carries a zinc-binding site and
  stabilizes the NADH-oxidizing N module at a late step of assembly. Its loss
  leaves complex I without most of the N module, unstable and deficient. The
  disorder was first described as a fatal neonatal lactic acidosis with profound
  hypotonia and death within days, including a founder missense variant in Jews
  of Caucasus origin, and later as infantile Leigh syndrome. Since 2024 a
  recurrent splice-region variant, c.309+5G>A, and a nonsense variant have been
  found in children and adolescents with a slowly progressive axonal
  Charcot-Marie-Tooth-like neuropathy with pes cavus, nystagmus, optic atrophy,
  pyramidal signs or epilepsy, and little or no metabolic derangement, so the
  phenotype now spans lethal neonatal encephalopathy to a hereditary neuropathy.
  The splice variant leaves partially functional isoforms, which is thought to
  explain survival. Ndufs6 gene-trap mice, in which aberrant splicing removes
  Ndufs6 almost completely from the heart, develop a complex I-deficient
  cardiomyopathy that AAV gene therapy prevents when given early.
category: Mendelian

      id: hgnc:7713
      label: NDUFS6
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function by reduced or absent NDUFS6 protein, or, for the Cys115
      missense alleles, loss of a zinc-coordinating residue. The c.309+5G>A allele
      is hypomorphic.

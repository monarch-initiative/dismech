- name: Peripheral Nerve Axonal Degeneration
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The mild form is a slowly progressive axonal sensorimotor neuropathy of
    Charcot-Marie-Tooth type, with distal weakness and wasting, pes cavus and
    steppage gait, beginning in early or later childhood. Long peripheral axons
    are thought to be vulnerable to partial complex I dysfunction because of their
    energy demand and dependence on mitochondrial transport, but that explanation
    has not been tested in NDUFS6 patient neurons.
  evidence:
  - reference: PMID:38459834
    reference_title: "Alternative splicing expands the clinical spectrum of NDUFS6-related mitochondrial disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients presented with early-onset, slowly progressive axonal CMT, and
      nystagmus; some exhibited additional central nervous system symptoms.
    explanation: >-
      Axonal neuropathy in three families homozygous for c.309+5G>A.
  - reference: PMID:41683799
    reference_title: "Expanding the Phenotypic Spectrum of NDUFS6-Related Disease: From Neonatal Mitochondrial Encephalopathy to Childhood-Onset Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Peripheral neurons are particularly vulnerable to complex I dysfunction
      because of their high energetic demands, long axonal architecture, and
      reliance on efficient mitochondrial transport and ATP production.
    explanation: >-
      The proposed reason for axonal vulnerability; a stated rationale rather
      than a measurement.
  - reference: PMID:38549004
    reference_title: "Variants in mitochondrial disease genes are common causes of inherited peripheral neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in SACS, SPG7, GDAP1, C12orf65, UCHL1, NDUFS6, ETFDH and
      DARS2 and variants in the mitochondrial DNA (mtDNA)-encoded MT-ATP6 and MT-TK
      were also causative for mitochondrial CMT.
    explanation: >-
      NDUFS6 among the causes of mitochondrial CMT in a large neuropathy cohort.
  downstream:
  - target: Peripheral Axonal Neuropathy
    causal_link_type: DIRECT
  - target: Distal Muscle Weakness
    causal_link_type: DIRECT
  - target: Pes Cavus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Steppage Gait
    causal_link_type: DIRECT

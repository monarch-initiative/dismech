  - reference: PMID:25902503
    reference_title: "Accessory NUMM (NDUFS6) subunit harbors a Zn-binding site and is essential for biogenesis of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the accessory NUMM subunit of complex I (human NDUFS6) harbors
      a Zn-binding site and resolve its position by X-ray crystallography.
    explanation: >-
      Establishes the zinc-binding site of the NDUFS6 ortholog in the yeast
      Yarrowia lipolytica.
  - reference: PMID:41683799
    reference_title: "Expanding the Phenotypic Spectrum of NDUFS6-Related Disease: From Neonatal Mitochondrial Encephalopathy to Childhood-Onset Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Importantly, despite this pronounced structural defect, complex I enzymatic
      activity and overall respiratory capacity were not severely impaired,
      indicating that NDUFS6 is critical for structural stability and assembly,
      rather than for the catalytic function of the enzyme.
    explanation: >-
      Summarises knockout-cell work showing that NDUFS6 is structural rather than
      catalytic, the basis for binding structural molecule activity.
  - reference: PMID:38459834
    reference_title: "Alternative splicing expands the clinical spectrum of NDUFS6-related mitochondrial disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

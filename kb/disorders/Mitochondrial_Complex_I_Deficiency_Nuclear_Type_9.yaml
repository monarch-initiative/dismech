  - reference: PMID:30948790
    reference_title: "NDUFS6 related Leigh syndrome: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data confirm the importance of NDUFS6 and the Zn-finger domain for a

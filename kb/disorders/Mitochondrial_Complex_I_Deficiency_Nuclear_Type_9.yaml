- name: Late-Stage N-Module Assembly Failure
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    In the yeast Yarrowia lipolytica, deleting the NDUFS6 ortholog or mutating its
    zinc ligands stalls complex I at a late assembly intermediate that lacks the
    NDUFA12 ortholog and keeps the assembly factor NDUFAF2 bound, and NDUFS6 is
    needed to insert or stabilize iron-sulfur cluster N4. In human knockout cells
    most of the N module dissociates from the enzyme. Patient cells show the same
    pattern: an abnormal complex I assembly profile, and loss of NDUFS6 together
    with the neighbouring N-module and late-assembly subunits NDUFA12, NDUFS4 and
    NDUFV1.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly

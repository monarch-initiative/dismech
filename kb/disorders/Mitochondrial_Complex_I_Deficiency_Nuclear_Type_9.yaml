genetic:
- name: NDUFS6
  gene_term:
    preferred_term: NDUFS6
    term:
      id: hgnc:7713
      label: NDUFS6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFS6 is at 5p15.33. ClinGen classifies NDUFS6 as Definitive for mitochondrial
    disease (MONDO:0044970, autosomal recessive, 2022). That record is for a lumped
    disease term, not this entry's MONDO term, so it is not copied into
    gene_disease_validity; CAUSATIVE rests on more than ten families with
    homozygous or compound heterozygous variants and functional data.

    Alleles: a large deletion and c.186+2T>A in the first two patients; the
    founder c.344G>A (C115Y) in Jews of Caucasus origin; c.344G>T (C115F);
    c.352C>T (Q118*); c.309+5G>A with c.343T>C (C115R) in two Leigh syndrome
    reports; homozygous c.309+5G>A in the neuropathy families (PMID:38459834,
    PMID:38217609); and homozygous c.130C>T (Q44*) in a neuropathy patient.
    The 2022 neonate homozygous for C115F (PMID:35801790) also carried compound
    heterozygous NHLRC2 variants causing FINCA syndrome, so that case is not used
    as phenotype evidence here. No clear genotype-phenotype correlation exists:
    truncating alleles occur at both ends of the spectrum.
  evidence:
  - reference: PMID:15372108
    reference_title: "NDUFS6 mutations are a novel cause of lethal neonatal mitochondrial complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients had homozygous mutations in this gene, one causing a splicing
      abnormality and the other a large deletion.
    explanation: >-
      The defining report.
  - reference: PMID:19259137
    reference_title: "Mutated NDUFS6 is the cause of fatal neonatal lactic acidemia in Caucasus Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified the c.344G>A homozygous mutation resulting in substitution of a
      highly evolutionary conserved cysteine residue by tyrosine
    explanation: >-
      A second, founder allele in two further families.
  - reference: PMID:38459834
    reference_title: "Alternative splicing expands the clinical spectrum of NDUFS6-related mitochondrial disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We expand the clinical spectrum of NDUFS6-related mitochondrial disorders to
      include axonal CMT
    explanation: >-
      Extends the gene-disease relationship to the neuropathy phenotype.
  - reference: PMID:38549004
    reference_title: "Variants in mitochondrial disease genes are common causes of inherited peripheral neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in SACS, SPG7, GDAP1, C12orf65, UCHL1, NDUFS6, ETFDH and
      DARS2 and variants in the mitochondrial DNA (mtDNA)-encoded MT-ATP6 and MT-TK
      were also causative for mitochondrial CMT.
    explanation: >-
      Independent ascertainment of biallelic NDUFS6 variants in a neuropathy
      cohort.

  description: >-
    The severe form: an encephalopathy in the first days of life with profound
    hypotonia, drowsiness, abnormal eye movements, tachypnea and central
    hypoventilation, death within days to weeks, or, in infancy, Leigh syndrome
    with developmental regression and basal ganglia lesions. Mild lenticular
    nucleus lesions, pyramidal signs and seizures also occur in the
    neuropathy-predominant form, so the central nervous system is not spared at
    the mild end.
  evidence:
  - reference: PMID:41683799
    reference_title: "Expanding the Phenotypic Spectrum of NDUFS6-Related Disease: From Neonatal Mitochondrial Encephalopathy to Childhood-Onset Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early reports predominantly described neonates presenting within the first
      days of life with profound hypotonia, severe lactic acidosis, and rapid
      clinical deterioration leading to death
    explanation: >-

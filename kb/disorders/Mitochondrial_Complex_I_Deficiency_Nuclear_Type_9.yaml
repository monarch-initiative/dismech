- name: Isolated Complex I Deficiency
  conforms_to: "complex_i_deficiency#Impaired NADH:Ubiquinone Oxidoreduction and ATP Synthesis"
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The neonatal and Leigh syndrome cases have isolated complex I deficiency, and
    knockdown of Ndufs6 in mice reduces complex I activity in heart and kidney.
    The deficit is not uniform across genotypes: complete NDUFS6 knockout cells
    keep substantial activity despite losing the N module, and lymphoblasts
    homozygous for c.309+5G>A showed no detectable defect in complex stability or
    bioenergetics. That negative finding is recorded as refuting evidence so that
    this node is not read as true of every genotype.

animal_models:
- name: Ndufs6 gene-trap mouse
  species: Mouse
  genotype: Ndufs6 gt/gt gene-trap insertion with tissue-specific splicing
  publication: PMID:22474353
  description: >-
    The gene trap removes Ndufs6 almost completely from heart but leaves some
    wild-type transcript in other tissues by tissue-specific splicing. The mice
    develop a complex I-deficient cardiomyopathy with heart failure from 4 to 8
    months, and a partial renal complex I deficiency with signs of kidney injury.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Marked complex I deficiency in heart and partial deficiency in kidney.
    limitations: >-
      Cardiomyopathy and renal disease are the mouse phenotypes, but neither has
      been reported in an NDUFS6 patient, whose disease is a neonatal
      encephalopathy, Leigh syndrome or an axonal neuropathy; the tissue
      distribution of the deficit is set by the gene trap's splicing, not by a
      patient allele.
    evidence:
    - reference: PMID:22474353
      reference_title: "Tissue-specific splicing of an Ndufs6 gene-trap insertion generates a mitochondrial complex I deficiency-specific cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ndufs6(gt/gt) mice have essentially complete knockout of the Ndufs6
        subunit in heart, resulting in marked CI deficiency.
      explanation: >-
        Complex I deficiency in the model.
    - reference: PMID:23320803
      reference_title: "Deficiency in mitochondrial complex I activity due to Ndufs6 gene trap insertion induces renal disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ndufs6 mice had a partial renal cortical complex I deficiency
      explanation: >-
        Partial deficiency in kidney.
discussions:
- discussion_id: mc1dn9_neonatal_versus_neuropathy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What decides whether biallelic NDUFS6 loss causes a fatal neonatal
    encephalopathy or a slowly progressive axonal neuropathy?
  attaches_to:
  - "pathophysiology#Biallelic NDUFS6 Variants"
  - "pathophysiology#Isolated Complex I Deficiency"
  rationale: >-
    The splice-region allele c.309+5G>A leaves partially functional isoforms and
    no detectable complex I defect in lymphoblasts, which fits its mild
    neuropathy. But a homozygous nonsense allele (Q44*) also gave a
    neuropathy-predominant phenotype, while other truncating alleles were lethal in
    the neonatal period, and NDUFS6 knockout cells keep substantial complex I
    activity. Mutation type alone does not predict severity, and complex I activity
    in accessible cells does not either.
  proposed_experiments:
  - experiment_id: exp_mc1dn9_neuronal_assay
    name: Measure complex I assembly and activity in patient-derived neurons
    description: >-
      Differentiate iPSC lines from neonatal-form and neuropathy-form patients
      into motor and sensory neurons and compare NDUFS6 isoforms, N-module
      assembly and complex I activity, to test whether the tissue that fails shows
      a defect that lymphoblasts do not.
- discussion_id: mc1dn9_mouse_cardiomyopathy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Ndufs6 gene-trap mouse develop cardiomyopathy and kidney injury
    when no NDUFS6 patient has been reported with either?
  attaches_to:
  - "pathophysiology#Isolated Complex I Deficiency"
  rationale: >-
    The mouse phenotype follows the gene trap's tissue-specific splicing, which
    removes Ndufs6 almost completely in heart only. Patients carry the same lesion
    in every tissue; the severe ones die of neonatal metabolic crisis before a
    cardiomyopathy could develop, and the mild ones have a neuropathy. The model is
    the basis of the only gene-therapy data for this gene, so whether its cardiac
    readout predicts benefit for the human neurological disease is the open
    question.
  proposed_experiments:
  - experiment_id: exp_mc1dn9_patient_allele_mouse
    name: Model a patient allele in mouse
    description: >-
      Introduce the c.309+5G>A or C115Y allele into the mouse Ndufs6 locus and
      record which tissues lose complex I and which phenotypes follow.
notes: >-
  No gene-specific GeneReviews chapter exists. The Nuclear Gene-Encoded Leigh
  Syndrome Spectrum Overview (PMID:26425749) is tagged because its scope covers
  the Leigh presentation, but its cached record is a statement of purpose with no
  clinical content; the phenotypes come from the primary reports and from the
  table of all published patients in the 2026 report (PMID:41683799), whose rows
  are quoted for the earlier cases cached here as abstracts only.

  The synonyms NDUFS6-related mitochondrial disorder and NDUFS6-related disease
  follow the titles of the 2024 and 2026 reports (PMID:38459834, PMID:41683799).
  MONDO has one disease term for NDUFS6, so the neuropathy-predominant patients
  belong to this entry rather than to a separate Charcot-Marie-Tooth entry.

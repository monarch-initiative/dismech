pathophysiology:
- name: Biallelic NDUFS6 Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The reported alleles are a large deletion, canonical and non-canonical splice
    variants, nonsense variants and missense variants at Cys115 (C115Y, C115F,
    C115R), a conserved residue of the zinc-binding motif. Severe neonatal alleles
    and the Leigh syndrome genotype markedly reduce NDUFS6 protein. The recurrent
    neuropathy variant c.309+5G>A causes aberrant splicing with negligible
    canonical transcript but leaves partially functional isoforms that keep Cys115.
    NDUFS6 has no catalytic role; its lost activity is structural, through a
    zinc-binding site that is needed for late assembly.

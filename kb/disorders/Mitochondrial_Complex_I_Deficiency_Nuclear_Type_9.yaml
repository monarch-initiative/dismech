    evidence_source: IN_VITRO
    snippet: >-
      An accumulating assembly intermediate lacked accessory subunit N7BM
      (NDUFA12), whereas a paralog of this subunit, the assembly factor N7BML
      (NDUFAF2), was found firmly bound instead.
    explanation: >-
      Identifies the stalled intermediate.
  - reference: PMID:25902503
    reference_title: "Accessory NUMM (NDUFS6) subunit harbors a Zn-binding site and is essential for biogenesis of mitochondrial complex I."

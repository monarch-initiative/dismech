      id: GO:0004930
      label: G protein-coupled receptor activity
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: Raynaud Phenomenon
    description: Arterial alpha-2A adrenoceptor overexpression lowers the threshold for catecholamine-evoked digital vasospasm.
  - target: Digital Ischemia
    description: Enhanced alpha-2A-mediated arteriolar constriction reduces acral perfusion during sympathetic activation.
  evidence:
  - reference: PMID:37828025
    reference_title: "ADRA2A and IRX1 are putative risk genes for Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variant rs1343449 is a reported gene expression quantitative trait locus (cis-eQTL) for ADRA2A in artery tissue and statistical colocalization confirmed a shared genetic signal with RP with high confidence (tibial artery, posterior probability (PP) > 96%; Fig. 2), with the RP risk-increasing A-allele of rs7090046 being associated with higher ADRA2A expression (beta = 0.28, p = 1.0 × 10−9)."
    explanation: Arterial cis-eQTL colocalization links increased ADRA2A expression to Raynaud phenomenon risk.
  - reference: PMID:37828025
    reference_title: "ADRA2A and IRX1 are putative risk genes for Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through integration with gene expression data, we demonstrated that the strongest locus likely acts via increased expression of α2A-adrenoreceptors in arterial tissue, augmenting the current concept of predominantly α2C-adrenoreceptors mediating the vasospasms seen in RP patients"
    explanation: Demonstrates that arterial alpha-2A adrenoceptor overexpression augments alpha-2C-mediated vasospasm in RP.
- name: RhoA/ROCK Potentiation of Vasospasm
  biological_scale: CELLULAR
  description: >
    Cold-triggered mitochondrial ROS activates RhoA/ROCK signaling in arteriolar
    vascular smooth muscle cells, driving filamin engagement, actin filament
    rearrangement, Golgi/ER-to-surface trafficking of alpha-2C adrenoceptors, and
    calcium sensitization of smooth muscle contraction.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Vascular Smooth Muscle Contraction
    term:
      id: GO:0014829
      label: vascular associated smooth muscle contraction
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: Raynaud Phenomenon
    description: RhoA/ROCK-amplified smooth muscle contraction sustains episodic digital vasospasm.
  - target: Digital Ischemia
    description: Sustained arteriolar contraction restricts digital oxygen delivery.
  - target: Acrocyanosis
    description: Prolonged microvascular stasis downstream of vasospasm causes venous deoxygenation and cyanosis.
  - target: Digital Pain and Paresthesia
    description: Vasospastic ischemia and neurovascular sensitization provoke digital pain, numbness, and paresthesia.
  evidence:
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mitochondria in arteriolar VSMCs act as thermo-sensors, and release ROS in response to cold. ROS then activates the Rho/ROCK signaling pathway leading to the filamin engagement and actin filament rearrangement. This cytoskeletal architectural change facilitates the trafficking of α2C-AR from the Golgi/ER to the cell surface."
    explanation: Directly establishes the mitochondrial ROS-to-Rho/ROCK cytoskeletal pathway mobilizing alpha-2C-AR in arteriolar VSMCs during cooling.
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent research has also implicated neurohumoral factors and signaling pathways like Rho-associated protein kinase (RhoA/ROCK) and reactive oxygen species (ROS) ... which hold promise as potential treatment targets."
    explanation: Implicates RhoA/ROCK and ROS signaling pathways directly in Raynaud pathogenesis.
- name: Estrogen Potentiation of Alpha-2C-AR
  biological_scale: MOLECULAR
  description: >
    Estrogen signaling via GPER activates the cAMP/EPAC/JNK/AP-1 cascade in vascular
    smooth muscle cells to upregulate alpha-2C adrenoceptor expression and function,
    contributing to the higher incidence of Raynaud phenomenon in premenopausal females.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction
    description: Estrogen-GPER signaling upregulates alpha-2C-AR abundance and cold-induced contractile responsiveness.
  evidence:
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Raynaud's phenomenon incidence is significantly higher in premenopausal females compared to age-matched males, highlighting a role of the female hormone, estrogen, in Raynaud's phenomenon pathogenesis."
    explanation: Estrogen contributes to female predominance in Raynaud phenomenon incidence.
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GPER mediates estrogen-induced α2C-AR upregulation through the cAMP/EPAC/JNK/AP-1 pathway."
    explanation: Defines the intracellular GPER-cAMP-EPAC-JNK-AP-1 pathway through which estrogen upregulates alpha-2C adrenoceptors.
- name: Endothelial Dysfunction
  biological_scale: CELLULAR
  description: >
    Impaired endothelium-dependent vasodilation with reduced nitric oxide (NO) and
    prostacyclin bioavailability and increased production of endothelin-1 (ET-1).
    The imbalance between vasoconstrictors and vasodilators favors persistent
    vasoconstriction, platelet activation, and intimal proliferation. In secondary RP
    associated with systemic sclerosis, endothelial damage leads to defective
    angiogenesis, endothelial-to-mesenchymal transition, and progressive capillary loss.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Vasodilation
    term:
      id: GO:0042311
      label: vasodilation
  - preferred_term: Nitric Oxide Biosynthesis
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: Intravascular and Platelet Abnormalities
    description: Loss of endothelial nitric oxide and prostacyclin promotes local platelet activation and impaired fibrinolysis.
  - target: Digital Ischemia
    description: Impaired endothelium-dependent vasodilation and excess endothelin-1 prolong digital hypoperfusion.
  - target: Digital Ulceration
    description: Structural endothelial injury, failed angiogenesis, and intimal fibroproliferation in secondary RP cause ischemic digital ulcers.
  evidence:
  - reference: DOI:10.3390/ijms241814385
    reference_title: "Endothelial Dysfunction in Systemic Sclerosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Endothelial damage and activation occur early, possibly triggered by various infectious agents and autoantibodies. Endothelial dysfunction, along with defects in endothelial progenitor cells, leads to defective angiogenesis and vasculogenesis."
    explanation: Endothelial dysfunction is an early event driving vascular pathology in secondary Raynaud phenomenon.
  - reference: DOI:10.3390/biomedicines12061331
    reference_title: "Recent Insights into Cellular and Molecular Mechanisms of Defective Angiogenesis in Systemic Sclerosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "once damaged, endothelial cells can be dysfunctionally activated, thus becoming unable to undergo angiogenesis and promoting perivascular inflammation. They can also undergo apoptosis, transdifferentiate into profibrotic myofibroblasts"
    explanation: Describes mechanisms of endothelial dysfunction including EndoMT and failed angiogenesis in SSc-associated RP.
- name: Sympathetic Nervous System Dysregulation
  biological_scale: TISSUE
  description: >
    Increased sympathetic adrenergic outflow to digital resistance vessels and
    arteriovenous anastomoses, together with reduced sensory-nerve vasodilator
    calcitonin gene-related peptide (CGRP) release, disrupts neurovascular tone and
    triggers vasospasm in response to cold or emotional stress.
  cell_types:
  - preferred_term: Sympathetic Neuron
    term:
      id: CL:0011103
      label: sympathetic neuron
  biological_processes:
  - preferred_term: Temperature Homeostasis
    term:
      id: GO:0001659
      label: temperature homeostasis
  locations:
  - preferred_term: Manual Digit
    term:
      id: UBERON:0002389
      label: manual digit
  downstream:
  - target: Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction
    description: Sympathetic norepinephrine release activates cold-mobilized postsynaptic alpha-2C adrenoceptors on digital VSMCs.
  - target: Alpha-2A Adrenoceptor Catecholamine Hypersensitivity
    description: Sympathetic catecholamine release engages overexpressed arterial alpha-2A adrenoceptors during cold or emotional stress.
  - target: Raynaud Phenomenon
    description: Neurovascular imbalance between sympathetic vasoconstriction and CGRP-mediated vasodilation triggers episodic digital color changes.
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogenesis of RP involves a complex interaction between the vascular wall, nerves, hormones, and humoral factors, disrupting the balance between vasoconstriction and vasodilation."
    explanation: Neurovascular dysregulation is a central mechanism disrupting vasomotor balance.
  - reference: PMID:15741200
    reference_title: "Pathogenesis of Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neural abnormalities include deficiency of the vasodilator calcitonin gene-related peptide (released from sensory afferents), alpha(2)-adrenoreceptor activation (possibly with up-regulation of the normally 'silent' alpha(2C)-adrenoreceptor) and a central nervous system component."
    explanation: Identifies central nervous system drive, sympathetic alpha-2 activation, and sensory CGRP deficiency in RP neural dysregulation.
- name: Intravascular and Platelet Abnormalities
  biological_scale: CELLULAR
  description: >
    Platelet activation and release of thromboxane A2 and serotonin contribute to
    vasospasm. Altered coagulation and fibrinolysis pathways and increased blood
    viscosity further impair microvascular flow during episodes. Gene ontology analysis
    identifies enrichment in negative regulation of fibrinolysis and complement/coagulation
    cascades among RP-associated genes.
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: Platelet Activation
    term:
      id: GO:0030168
      label: platelet activation
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: Digital Ischemia
    description: Platelet aggregation, impaired fibrinolysis, and hyperviscosity reduce digital microvascular perfusion.
  - target: Acrocyanosis
    description: Sluggish hyperviscous microvascular blood flow deepens digital venous deoxygenation.
  evidence:
  - reference: PMID:15741200
    reference_title: "Pathogenesis of Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intravascular abnormalities include platelet activation, impaired fibrinolysis, increased viscosity and probably oxidant stress."
    explanation: Directly summarizes platelet activation, impaired fibrinolysis, and hyperviscosity as core intravascular abnormalities in RP.
  - reference: DOI:10.1515/tjb-2023-0197
    reference_title: "Determination of molecular pathways and gene ontology of genes associated with Raynaud’s phenomenon"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A significant enrichment by gene ontology enrichment analysis was detected in a subset of genes involved in biological processes including cellular response to luteinizing hormone stimulus, negative regulation of fibrinolysis, negative regulation of smooth muscle cell apoptotic process, plasminogen activation"
    explanation: Computational GO enrichment analysis of RP-associated genes highlights fibrinolysis regulation pathways.
  - reference: DOI:10.1515/tjb-2023-0197
    reference_title: "Determination of molecular pathways and gene ontology of genes associated with Raynaud’s phenomenon"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Through the use of KEGG pathways, we were able to identify many molecular processes that contribute to RP, including the AGE-RAGE signaling pathway in diabetic complications, complement and coagulation cascades, fluid shear stress, atherosclerosis."
    explanation: Computational KEGG pathway enrichment confirms complement and coagulation cascade involvement in RP.
- name: Oxidative Stress and Ischemia-Reperfusion Injury
  biological_scale: CELLULAR
  description: >
    Cold-sensing vascular smooth muscle mitochondria generate reactive oxygen species
    (ROS) that trigger RhoA/ROCK-dependent alpha-2C-AR mobilization, while repeated
    cycles of ischemic vasospasm followed by reperfusion hyperemia produce oxidant
    stress and free-radical-mediated endothelial injury, establishing a feed-forward
    cycle of microvascular damage.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Response to Oxidative Stress
    term:
      id: GO:0006979
      label: response to oxidative stress
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: RhoA/ROCK Potentiation of Vasospasm
    description: Cold-evoked mitochondrial ROS activates RhoA/ROCK signaling and alpha-2C-AR surface translocation.
  - target: Endothelial Dysfunction
    description: Recurrent ischemia-reperfusion oxidant stress damages microvascular endothelium and depletes nitric oxide bioavailability.
  - target: Digital Ulceration
    description: Cumulative ischemia-reperfusion oxidative injury promotes irreversible digital tissue necrosis in severe secondary RP.
  evidence:
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cold is sensed by mitochondria in VSMCs; these organelles act as thermosensors, triggering release of reactive oxygen species (ROS), and consequently activating the Rho/Rho kinase signaling pathway"
    explanation: Establishes mitochondrial ROS generation in vascular smooth muscle cells as an upstream trigger of Rho/ROCK activation during cold exposure.
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "initial vasospasm causing white-pallor discoloration, followed by deoxygenation resulting in blue-cyanotic coloration, and finally reperfusion hyperemia resulting in redness"
    explanation: Documents the sequential ischemia, deoxygenation, and reperfusion hyperemia cycle characteristic of Raynaud attacks.
  - reference: PMID:15741200
    reference_title: "Pathogenesis of Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intravascular abnormalities include platelet activation, impaired fibrinolysis, increased viscosity and probably oxidant stress."
    explanation: Identifies oxidant stress as a pathogenic contributor to microvascular dysfunction in Raynaud phenomenon.
phenotypes:
- category: Vascular
  name: Raynaud Phenomenon
  frequency: OBLIGATE
  diagnostic: true
  description: >
    Episodic vasospasm of digital arteries triggered by cold or stress, producing the
    characteristic triphasic color change: pallor (ischemia), cyanosis (deoxygenation),
    and erythema (reperfusion). This is the defining clinical feature.
  phenotype_term:
    preferred_term: Raynaud phenomenon
    term:
      id: HP:0030880
      label: Raynaud phenomenon
  evidence:
  - reference: PMID:25770637
    reference_title: "Raynaud syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Raynaud syndrome (RS) was first described by the French physician Maurice Raynaud in 1862 with the characteristic tricolor change featuring pallor (ischemic phase), cyanosis (deoxygenation phase), and erythema (reperfusion phase) induced by cold or stress."
    explanation: Classic triphasic color change as the hallmark clinical feature.
  - reference: PMID:24418302
    reference_title: "Raynaud's phenomenon: from molecular pathogenesis to therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Raynaud's phenomenon (RP) is a well defined clinical syndrome characterized by recurrent episodes of digital vasospasm triggered by exposure to physical/chemical or emotional stress."
    explanation: Defines RP as a clinical syndrome of recurrent digital vasospasm.
- category: Vascular
  name: Acrocyanosis
  frequency: VERY_FREQUENT
  description: >
    Blue discoloration of affected digits following the ischemic phase, reflecting
    deoxygenation of static venous blood. Represents the second phase of the triphasic
    color change.
  phenotype_term:
    preferred_term: Acrocyanosis
    term:
      id: HP:0001063
      label: Acrocyanosis
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pallor indicates reduced blood flow due to oxygen deprivation, while erythema appears as reperfusion."
    explanation: Describes the color change phases during digital oxygen deprivation and subsequent reperfusion.
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "initial vasospasm causing white-pallor discoloration, followed by deoxygenation resulting in blue-cyanotic coloration, and finally reperfusion hyperemia resulting in redness"
    explanation: Explicitly links blue-cyanotic digital coloration to venous deoxygenation following initial vasospasm.
- category: Pain
  name: Digital Pain and Paresthesia
  frequency: VERY_FREQUENT
  description: >
    Pain, numbness, and tingling in affected digits during and after vasospastic episodes.
    Ischemic pain from vasospasm and neurogenic sensitization are major symptomatic burdens.
  phenotype_term:
    preferred_term: Paresthesia
    term:
      id: HP:0003401
      label: Paresthesia
  evidence:
  - reference: PMID:29237099
    reference_title: "Calcium channel blockers for primary and secondary Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Raynaud's phenomenon is a vasospastic disease characterized by digital pallor, cyanosis, and extremity pain."
    explanation: Extremity pain is a core characteristic feature of Raynaud phenomenon.
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Severe cases involve puffiness, numbness, or ulceration of digits significantly impacting quality of life"
    explanation: Digital numbness and sensory disturbance accompany severe vasospastic episodes.
- category: Dermatological
  name: Digital Ulceration
  frequency: VERY_RARE
  description: >
    Ischemic ulcers at fingertips resulting from recurrent severe ischemia, endothelial
    damage, and failed angiogenesis. Occurs predominantly in secondary Raynaud phenomenon
    associated with systemic sclerosis. Rare in primary Raynaud disease.
  phenotype_term:
    preferred_term: Digital ulcer
    term:
      id: HP:0031917
      label: Digital ulcer
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "digital tissue damage frequently occurs in secondary RP but not primary RP"
    explanation: Digital ulceration is characteristic of secondary rather than primary RP.
  - reference: PMID:24418302
    reference_title: "Raynaud's phenomenon: from molecular pathogenesis to therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "sRP can evolve and be complicated by acral digital ulcers and gangrene, which may require surgical treatment"
    explanation: Secondary RP can progress to digital ulcers and gangrene.
- category: Vascular
  name: Digital Ischemia
  frequency: FREQUENT
  description: >
    Reduced blood flow to digits during vasospastic episodes causing tissue hypoxia.
    In severe or secondary disease, sustained ischemia may lead to tissue necrosis.
  phenotype_term:
    preferred_term: Digital ischemia
    term:
      id: HP:0033402
      label: Digital ischemia
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pallor indicates reduced blood flow due to oxygen deprivation"
    explanation: Digital pallor reflects ischemia from vasospasm-induced blood flow reduction.
diagnosis:
- name: Clinical History and Physical Examination
  diagnosis_term:
    preferred_term: Physical Examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >
    Diagnosis of Raynaud phenomenon is primarily clinical, based on a history of
    episodic cold- or stress-provoked bi- or triphasic digital color changes and
    focused vascular and rheumatologic physical examination to exclude secondary
    vaso-occlusive or connective tissue causes.
  presence: Positive clinical history of cold- or stress-induced episodic digital pallor and cyanosis
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis of RP is primarily clinical. Recent advancements in imaging techniques have aided in diagnosis and monitoring, but nail fold capillaroscopy remains the gold standard for distinguishing between primary and secondary RP."
    explanation: Establishes clinical evaluation as the primary diagnostic modality for Raynaud phenomenon.
- name: Nailfold Capillaroscopy
  diagnosis_term:
    preferred_term: Microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  description: >
    Noninvasive microscopic inspection of the nailfold microcirculation is the gold
    standard for differentiating primary Raynaud disease (normal capillary loops)
    from secondary connective-tissue-disease-associated Raynaud phenomenon (giant
    capillaries, microhemorrhages, and avascular areas).
  presence: Normal nailfold capillary architecture in primary RP; dilated or avascular capillary loops in secondary RP
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent advancements in imaging techniques have aided in diagnosis and monitoring, but nail fold capillaroscopy remains the gold standard for distinguishing between primary and secondary RP."
    explanation: Confirms nailfold capillaroscopy as the gold-standard diagnostic test to distinguish primary from secondary RP.
- name: Autoantibody Serologic Screening
  diagnosis_term:
    preferred_term: Autoantibody Measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  description: >
    Serologic testing for antinuclear antibodies (ANA), extractable nuclear antigen
    antibodies, and rheumatoid factor is performed to identify underlying systemic
    sclerosis, systemic lupus erythematosus, or other autoimmune connective tissue
    disorders in suspected secondary Raynaud phenomenon.
  presence: Negative ANA in primary Raynaud disease; disease-specific autoantibodies in secondary CTD-associated RP
  evidence:
  - reference: PMID:25770637
    reference_title: "Raynaud syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Serologic screening (antinuclear antibody and rheumatoid factor) is advocated to rule out associated connective tissue disorders."
    explanation: Supports ANA and rheumatoid factor serologic screening to exclude underlying connective tissue disease.
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Depending on the clinical picture, additional tests like antinuclear antibodies (ANA), extractable nuclear antibodies, thyroid function tests, and serum plasma electrophoresis might be performed"
    explanation: Supports ANA and extractable nuclear antibody testing in the diagnostic workup of Raynaud phenomenon.
genetic:
- name: ADRA2A
  gene_term:
    preferred_term: ADRA2A
    term:
      id: hgnc:281
      label: ADRA2A
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  association: >
    Genome-wide significant risk locus at 10q25.2 (lead variant rs7090046, OR 1.26,
    p < 9.6 x 10^-27) colocalizing with higher arterial ADRA2A cis-eQTL expression
    in both overall and stringently defined primary Raynaud phenomenon.
  evidence:
  - reference: PMID:37828025
    reference_title: "ADRA2A and IRX1 are putative risk genes for Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We prioritized ADRA2A (rs7090046, odds ratio (OR) per allele: 1.26; 95%-CI: 1.20-1.31; p < 9.6 × 10-27) and IRX1 (rs12653958, OR: 1.17; 95%-CI: 1.12-1.22, p < 4.8 × 10-13) as candidate causal genes through integration of gene expression in disease relevant tissues."
    explanation: Identifies ADRA2A as the strongest genome-wide significant candidate causal risk gene for Raynaud phenomenon.
- name: IRX1
  gene_term:
    preferred_term: IRX1
    term:
      id: hgnc:14358
      label: IRX1
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  association: >
    Genome-wide significant risk locus at 5p15.33 (lead variant rs12653958, OR 1.17,
    p < 4.8 x 10^-13) colocalizing with higher IRX1 expression in skeletal muscle
    and tibial artery, putatively impairing prostaglandin- and bradykinin-mediated
    vasodilation.
  evidence:
  - reference: PMID:37828025
    reference_title: "ADRA2A and IRX1 are putative risk genes for Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RP-increasing effect-allele of rs11748327 was associated with higher expression of IRX1 in skeletal muscle (beta = 0.57, p = 1.1 × 10−22) and tibial artery (beta = 0.42, p = 5.7 × 10−11), suggesting that higher gene expression confers a higher risk for RP."
    explanation: Establishes cis-eQTL colocalization of the 5p15.33 Raynaud risk allele with increased IRX1 expression.
environmental:
- name: Cold Exposure
  influences_mechanisms:
  - target: Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Local cooling of cutaneous and digital arterioles triggers mitochondrial
      reactive oxygen species release and RhoA/ROCK-dependent translocation of
      alpha-2C adrenoceptors to the vascular smooth muscle plasma membrane, directly
      initiating cold-induced digital vasoconstriction.
    evidence:
    - reference: PMID:40506673
      reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "estrogen plays a fundamental role in potentiating the expression and function of α2C adrenoceptor (α2C-AR), the sole mediator of local cooling-induced vasoconstriction"
      explanation: >-
        Identifies alpha-2C adrenoceptor as the mediator of local cooling-induced
        vasoconstriction in peripheral arterioles.
    - reference: PMID:40506673
      reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Raynaud's phenomenon is a peripheral vascular disorder characterized by exaggerated vasoconstrictive response to certain stimuli, most typically cold exposure and emotional stress."
      explanation: >-
        Establishes cold exposure as the canonical environmental stimulus provoking
        exaggerated digital vasoconstriction in Raynaud phenomenon.
  description: >
    Cold ambient temperature or direct contact with cold objects is the primary trigger
    for vasospastic episodes. Cold triggers alpha-2C adrenoceptor-mediated vasoconstriction
    in digital smooth muscle cells.
  exposure_term:
    preferred_term: exposure to decreased temperature
    term:
      id: ECTO:0001057
      label: exposure to decreased temperature
  evidence:
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Raynaud's phenomenon is a peripheral vascular disorder characterized by exaggerated vasoconstrictive response to certain stimuli, most typically cold exposure and emotional stress."
    explanation: Cold exposure is the primary trigger for RP attacks.
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "estrogen plays a fundamental role in potentiating the expression and function of α2C adrenoceptor (α2C-AR), the sole mediator of local cooling-induced vasoconstriction"
    explanation: Cold exposure activates alpha-2C-AR-mediated vasoconstriction.
- name: Emotional Stress
  influences_mechanisms:
  - target: Sympathetic Nervous System Dysregulation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acute emotional stress activates central autonomic outflow and peripheral
      sympathetic adrenergic discharge to digital resistance vessels and
      arteriovenous anastomoses, triggering catecholamine-mediated vasospasm even
      in thermoneutral environments.
    evidence:
    - reference: PMID:24418302
      reference_title: "Raynaud's phenomenon: from molecular pathogenesis to therapy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "recurrent episodes of digital vasospasm triggered by exposure to physical/chemical or emotional stress"
      explanation: >-
        Documents emotional stress as an established trigger of recurrent digital
        vasospastic episodes.
    - reference: PMID:29763008
      reference_title: "Raynaud Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In Raynaud phenomenon, blood flow is restricted in response to cold temperatures and emotional stress. Specifically, Raynaud phenomenon involves vasoconstriction of the digital arteries and cutaneous arterioles."
      explanation: >-
        Confirms that emotional stress triggers digital arterial and cutaneous
        arteriolar vasoconstriction in Raynaud phenomenon.
  description: >
    Psychological stress and emotional disturbance can trigger vasospastic episodes
    through sympathetic nervous system activation, independent of cold exposure.
  exposure_term:
    preferred_term: exposure to emotional stress
    term:
      id: XCO:0001265
      label: stress
  evidence:
  - reference: PMID:24418302
    reference_title: "Raynaud's phenomenon: from molecular pathogenesis to therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "recurrent episodes of digital vasospasm triggered by exposure to physical/chemical or emotional stress"
    explanation: Emotional stress is a recognized trigger alongside physical stimuli.
  notes: >-
    ECTO contains no specific psychological or emotional stress exposure class
    (searching ECTO for stress, emotional, and psychological returns only the
    upper-level stressor role ExO:0000000 "exposure stressor" and imported
    behavior class NBO:0000003 "emotional behavior"). Bound instead to
    XCO:0001265 "stress", a direct child of XCO:0000000 "experimental condition"
    whose definition encompasses "a physical, chemical, or emotional factor that
    causes bodily or mental tension and may be a factor in disease causation."
treatments:
- name: Calcium Channel Blockers
  description: >
    Dihydropyridine calcium channel blockers (e.g., nifedipine, amlodipine) are
    first-line pharmacotherapy. They reduce frequency and severity of vasospastic
    attacks by inhibiting L-type calcium influx into vascular smooth muscle cells.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction
    treatment_effect: INHIBITS
    description: Blocks L-type voltage-gated calcium entry required for smooth muscle contraction downstream of alpha-2C adrenoceptor activation.
  - target: RhoA/ROCK Potentiation of Vasospasm
    treatment_effect: INHIBITS
    description: Reduces intracellular calcium availability opposing RhoA/ROCK-sensitized digital smooth muscle vasospasm.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nifedipine
      term:
        id: CHEBI:7565
        label: nifedipine
    - preferred_term: amlodipine
      term:
        id: CHEBI:2668
        label: amlodipine
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dihydropyridine calcium channel blockers (CCBs), such as nifedipine, are commonly used for vasodilation."
    explanation: CCBs are established first-line vasodilator pharmacotherapy for RP.
  - reference: PMID:29237099
    reference_title: "Calcium channel blockers for primary and secondary Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CCBs (especially the dihydropyridine class) may be useful in reducing the frequency, duration, severity of attacks, pain and disability associated with Raynaud's phenomenon."
    explanation: Cochrane systematic review of 38 RCTs demonstrating CCBs reduce attack frequency and severity.
- name: Cold Avoidance and Protective Measures
  description: >
    Behavioral modification including wearing warm gloves, avoiding cold exposure,
    stress management, and hand warming. First-line non-pharmacological management
    for all patients with Raynaud phenomenon.
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction
    treatment_effect: INHIBITS
    description: Prevents local cutaneous cooling that triggers mitochondrial ROS release and alpha-2C adrenoceptor mobilization.
  - target: Sympathetic Nervous System Dysregulation
    treatment_effect: MODULATES
    description: Thermal protection and stress management attenuate reflex sympathetic vasoconstrictor outflow to digital vessels.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25770637
    reference_title: "Raynaud syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most patients with RS can be managed conservatively, with avoidance of cold exposure or hand warming."
    explanation: Conservative management with cold avoidance and hand warming is first-line for most patients.
- name: Phosphodiesterase-5 Inhibitors
  description: >
    Sildenafil and tadalafil improve digital blood flow by inhibiting PDE5, increasing
    intracellular cGMP levels, and restoring nitric oxide-mediated vasodilation. Used
    as second-line therapy for refractory cases or secondary RP with digital ischemia.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Endothelial Dysfunction
    treatment_effect: RESTORES
    description: Inhibits cGMP degradation in vascular smooth muscle to restore impaired nitric oxide-sGC-cGMP vasodilation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sildenafil
      term:
        id: CHEBI:9139
        label: sildenafil
    - preferred_term: tadalafil
      term:
        id: CHEBI:71940
        label: tadalafil
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Phosphodiesterase-5 inhibitors and prostaglandin analogs are alternative options for patients who do not respond to CCBs or have ischemic tissue damage."
    explanation: PDE5 inhibitors are second-line options for CCB-refractory RP or ischemic tissue injury.
  - reference: PMID:28281457
    reference_title: "Evaluation of the effect of sildenafil on the microvascular blood flow in patients with systemic sclerosis: a randomised, double-blind, placebo-controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sildenafil improved digital blood flow and RP symptoms in SSc patients after 8 weeks of treatment, and might be a good therapeutic option for secondary RP."
    explanation: Randomized controlled trial demonstrating sildenafil improves microvascular blood flow in SSc-associated RP.
- name: Prostacyclin Analogues
  description: >
    Intravenous iloprost is used for severe Raynaud phenomenon with digital ischemia
    or ulceration, providing potent vasodilation and inhibition of platelet aggregation.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Endothelial Dysfunction
    treatment_effect: RESTORES
    description: Replaces deficient endogenous prostacyclin signaling to induce cAMP-dependent microvascular vasodilation.
  - target: Intravascular and Platelet Abnormalities
    treatment_effect: INHIBITS
    description: Suppresses platelet activation and aggregation in ischemic digital microvessels.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iloprost
      term:
        id: CHEBI:63916
        label: iloprost
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Phosphodiesterase-5 inhibitors and prostaglandin analogs are alternative options for patients who do not respond to CCBs or have ischemic tissue damage."
    explanation: Prostacyclin analogs are alternative options for severe/refractory RP with ischemic tissue damage.
- name: Endothelin Receptor Antagonists
  description: >
    Bosentan blocks endothelin-1 receptor signaling and is effective in preventing
    new digital ulcers in patients with systemic sclerosis-associated secondary
    Raynaud phenomenon and multiple digital ulcers.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Endothelial Dysfunction
    treatment_effect: INHIBITS
    description: Antagonizes endothelin ETA/ETB receptors to block excess endothelin-1-driven vasoconstriction and vascular remodeling.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: bosentan
      term:
        id: CHEBI:51450
        label: bosentan
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bosentan, an endothelin-1 receptor antagonist, has shown effectiveness in treating and preventing digital ulcers, especially in patients with multiple ulcers."
    explanation: Bosentan is effective for digital ulcer prevention in SSc-associated RP.
- name: Sympathectomy
  description: >
    Surgical sympathectomy can be used for severe, refractory Raynaud phenomenon
    to interrupt sympathetic adrenergic vasoconstriction, though long-term
    effectiveness is uncertain.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Sympathetic Nervous System Dysregulation
    treatment_effect: INHIBITS
    description: Surgically interrupts sympathetic adrenergic fibers innervating digital arteries.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "sympathectomy surgery can be used to control RP symptoms. However, botulinum toxin injections require repeated administration, and sympathectomy's long-term effectiveness is uncertain."
    explanation: Sympathectomy is an option for severe refractory cases but has uncertain long-term efficacy.
notes: >
  Raynaud phenomenon was first described by Maurice Raynaud in 1862 and affects
  approximately 3-5% of the general population with female predominance. Primary
  Raynaud disease involves reversible functional vasospasm with normal nailfold
  capillaries and negative autoantibody serology, whereas secondary Raynaud
  phenomenon (most commonly associated with systemic sclerosis and other connective
  tissue diseases) combines functional vasospasm with structural endothelial injury,
  intimal fibrosis, and risk of digital ulceration. Large-scale UK Biobank GWAS
  identifies common regulatory risk alleles at ADRA2A and IRX1 underlying primary
  vasospastic susceptibility.

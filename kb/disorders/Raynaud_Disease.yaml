has_subtypes:
- name: Primary Raynaud Phenomenon
  description: >
    Idiopathic vasospastic episodes without underlying connective tissue disease.
    Primarily functional vascular abnormalities with symmetric involvement, younger
    age of onset, and milder course. Digital tissue damage is uncommon.
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In primary RP, the vascular abnormalities are primarily functional."
    explanation: Distinguishes primary RP as functional versus structural in secondary RP.
- name: Secondary Raynaud Phenomenon
  description: >
    Raynaud phenomenon occurring in the context of an underlying disease, most commonly
    systemic sclerosis, systemic lupus erythematosus, or mixed connective tissue disease.
    Associated with both functional and structural vascular changes and higher risk of
    digital ulceration and tissue loss.
  evidence:
  - reference: PMID:39040029
    reference_title: "Raynaud's Phenomenon: A Current Update on Pathogenesis, Diagnostic Workup, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in secondary RP, both functional and structural components occur in blood vessels. This explains why digital tissue damage frequently occurs in secondary RP but not primary RP."
    explanation: Structural vascular changes explain complications in secondary RP.
pathophysiology:
- name: Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction
  biological_scale: MOLECULAR
  description: >
    Cold triggers alpha-2C adrenoceptor (ADRA2C) translocation from the Golgi/ER to
    the plasma membrane and receptor activation in microvascular smooth muscle cells,
    mediating local cooling-induced vasoconstriction of digital arteries and arterioles.
  genes:
  - preferred_term: ADRA2C
    term:
      id: hgnc:283
      label: ADRA2C
  molecular_functions:
  - preferred_term: G protein-coupled receptor activity
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
  - preferred_term: Cellular Response to Cold
    term:
      id: GO:0070417
      label: cellular response to cold
  locations:
  - preferred_term: Digital Artery
    term:
      id: UBERON:0004552
      label: digital artery
  downstream:
  - target: RhoA/ROCK Potentiation of Vasospasm
    description: Alpha-2C-AR cell-surface mobilization and contractile output are coupled to cold-induced ROS-RhoA/ROCK signaling.
  - target: Raynaud Phenomenon
    description: Exaggerated cold-induced digital arterial vasoconstriction produces episodic triphasic Raynaud attacks.
  - target: Digital Ischemia
    description: Digital arteriolar spasm acutely restricts cutaneous and acral blood flow.
  evidence:
  - reference: PMID:25770637
    reference_title: "Raynaud syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "alterations in activity of the peripheral adrenoceptor have been implicated, specifically an enhanced smooth muscle contraction due to overexpression or hyperactivity of postsynaptic alpha 2 receptors"
    explanation: Alpha-2 adrenoceptor hyperactivity drives exaggerated smooth muscle contraction.
  - reference: PMID:40506673
    reference_title: "Cold responses and hormonal echoes: a comprehensive view of Raynaud's vascular dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "estrogen plays a fundamental role in potentiating the expression and function of α2C adrenoceptor (α2C-AR), the sole mediator of local cooling-induced vasoconstriction"
    explanation: Identifies alpha-2C-AR as a central G protein-coupled receptor mediator of local cooling-induced vasospasm.
  - reference: PMID:15741200
    reference_title: "Pathogenesis of Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neural abnormalities include deficiency of the vasodilator calcitonin gene-related peptide (released from sensory afferents), alpha(2)-adrenoreceptor activation (possibly with up-regulation of the normally 'silent' alpha(2C)-adrenoreceptor) and a central nervous system component."
    explanation: Confirms upregulation and activation of alpha-2C adrenoceptors in Raynaud pathophysiology.
- name: Alpha-2A Adrenoceptor Catecholamine Hypersensitivity
  biological_scale: MOLECULAR
  description: >
    Common germline regulatory risk variants at the ADRA2A locus increase arterial
    expression of alpha-2A adrenoceptors, sensitizing small arteries and arterioles
    to sympathetic catecholamine-induced vasoconstriction even under thermoneutral
    conditions.
  genes:
  - preferred_term: ADRA2A
    term:
      id: hgnc:281
      label: ADRA2A
  molecular_functions:
  - preferred_term: G protein-coupled receptor activity

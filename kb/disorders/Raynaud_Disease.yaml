inheritance:
- name: Polygenic Inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >
    Raynaud phenomenon exhibits substantial polygenic heritability (twin estimates
    55-64%, SNP-based liability-scale heritability 7.7%), with common regulatory risk
    alleles at ADRA2A and IRX1 contributing to vasospastic susceptibility.
  evidence:
  - reference: PMID:37828025
    reference_title: "ADRA2A and IRX1 are putative risk genes for Raynaud's phenomenon."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted a genome-wide association study including 5,147 RP cases and 439,294 controls, based on diagnoses from electronic health records, and identified three unreported genomic regions associated with the risk of RP (p < 5 × 10-8)."
    explanation: Large-scale genome-wide association study establishes a polygenic susceptibility architecture for Raynaud phenomenon.
description: >
  Raynaud disease (primary Raynaud phenomenon) is a vasospastic disorder characterized
  by episodic, excessive vasoconstriction of digital arteries and arterioles triggered
  by cold exposure or emotional stress. It manifests as triphasic color changes of the
  fingers and toes (pallor, cyanosis, erythema) reflecting vasospasm, deoxygenation,
  and reperfusion hyperemia. Primary Raynaud disease occurs without an underlying
  connective tissue disease and involves primarily functional vascular abnormalities.
  Secondary Raynaud phenomenon is associated with autoimmune conditions such as
  systemic sclerosis and involves both functional and structural vascular changes.
  The pathogenesis involves dysregulated neurovascular control, endothelial dysfunction,
  alpha-2A and alpha-2C adrenoceptor-mediated vasoconstriction amplified by RhoA/ROCK
  signaling, and impaired nitric oxide-soluble guanylate cyclase-cGMP vasodilatory pathways.

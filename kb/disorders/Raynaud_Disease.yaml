      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Specifically, Raynaud phenomenon involves vasoconstriction of the digital arteries and cutaneous arterioles. Maurice Raynaud first described this phenomenon in 1862, and Sir Thomas Lewis later studied it in 1930. Overall, Raynaud phenomenon is characterized as a transient, peripheral vasoconstrictive response to cold temperatures or emotional stress."

      MBTPS2, a membrane-embedded zinc metalloprotease, activates signaling
      proteins involved in sterol control of transcription and ER stress
      response.
    explanation: >-
      The enzyme class and the two pathways it serves, which is the whole basis
      for the two-arm pathograph below.
  downstream:
  - target: Reduced Regulated Intramembrane Proteolysis
    causal_link_type: DIRECT
- name: Reduced Regulated Intramembrane Proteolysis
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    S2P makes the second cut of a two-cut cascade. SREBP and ATF6 are cleaved
    first by site-1 protease and then, within the membrane, by S2P, which releases
    the active transcription-factor domain into the cytosol. Reduce S2P activity
    and both substrates are released less efficiently.

    This node is the reason the disease looks pleiotropic. Two entirely unrelated
    transcriptional programmes share one protease, so a single hypomorphic allele
    hits lipid synthesis and the stress response together rather than choosing one.
  cellular_components:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  evidence:
  - reference: PMID:33743732
    reference_title: "MBTPS2, a membrane bound protease, underlying several distinct skin and bone disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The MBTPS2 gene on the X-chromosome encodes the membrane-bound transcription
      factor protease, site-2 (MBTPS2) or site-2 protease (S2P) which cleaves and
      activates several signaling and regulatory proteins from the membrane.
    explanation: >-
      The intramembrane-cleavage function. Graded OTHER: this is a review's
      background statement of established biochemistry, not a result the paper
      reports.
  - reference: PMID:33743732
    reference_title: "MBTPS2, a membrane bound protease, underlying several distinct skin and bone disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The MBTPS2 is critical for a myriad of cellular processes, ranging from the
      regulation of cholesterol homeostasis to unfolded protein responses.
    explanation: >-
      States the two-pathway breadth that the fork below represents.
  downstream:
  - target: Impaired SREBP-Driven Lipid Synthesis
    causal_link_type: DIRECT
  - target: Impaired ATF6 Endoplasmic Reticulum Stress Response
    causal_link_type: DIRECT
- name: Impaired SREBP-Driven Lipid Synthesis
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Less active SREBP reaches the nucleus, so cholesterol and fatty-acid synthesis
    genes are under-induced. The functional signature of this in the assays used to
    prove variant pathogenicity is failure to grow in cholesterol-depleted medium -
    a cell that cannot make its own lipid and is no longer given any.

    In the epidermis this is the barrier-lipid arm: the cornified envelope depends
    on locally synthesised lipids, and a follicular hyperkeratosis is what a
    failing keratinisation programme looks like at the skin surface.
  biological_processes:
  - preferred_term: SREBP signaling pathway
    modifier: DECREASED
    term:
      id: GO:0032933
      label: SREBP signaling pathway
  - preferred_term: cholesterol biosynthesis
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:19361614
    reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Wild-type MBTPS2 was able to complement the protease deficiency in Chinese
      hamster M19 cells as shown by induction of an SRE-regulated reporter gene in
      transient transfection experiments and by growth of stably transfected cells
      in media devoid of cholesterol and lipids.
    explanation: >-
      The complementation assay that reads out this node, and the two measurements
      it uses.
  - reference: PMID:34655156
    reference_title: "A novel MBTPS2 variant associated with BRESHECK syndrome impairs sterol-regulated transcription and the endoplasmic reticulum stress response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro modeling supports variant pathogenicity, with impaired cell growth
      in cholesterol-depleted media, attenuated activation of the sterol
      regulatory element-binding protein pathway, and failure to activate the
      endoplasmic reticulum stress response pathway.
    explanation: >-
      An independent demonstration in a different variant, and the only single
      sentence in the literature reviewed here that measures both arms of the
      fork in the same experiment.
  downstream:
  - target: Defective Epidermal and Follicular Keratinization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Progressive Vascularising Keratopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired ATF6 Endoplasmic Reticulum Stress Response
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    ATF6 is the second S2P substrate, and it is the arm of the unfolded protein
    response that depends on the same two cuts. A BRESHECK-associated variant was
    shown to fail to activate the ER stress response entirely, alongside its
    attenuated SREBP effect.

    Graded PROVISIONAL rather than ESTABLISHED, and the distinction from the SREBP
    node is deliberate. The biochemistry is not in doubt - S2P cleaves ATF6, and
    the assay result is clear. What is not established is that this arm
    *contributes to the human phenotype*: no clinical feature of IFAP has been
    tied to loss of ATF6 signalling specifically, and every phenotype the entry
    curates could in principle be explained by the SREBP arm alone. The node is
    kept because a mechanism curated only where it is convenient is not a
    mechanism, and because it predicts things the SREBP arm does not.
  biological_processes:
  - preferred_term: ATF6-mediated unfolded protein response
    modifier: DECREASED
    term:
      id: GO:0036500
      label: ATF6-mediated unfolded protein response
  - preferred_term: response to endoplasmic reticulum stress
    modifier: DECREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:34655156
    reference_title: "A novel MBTPS2 variant associated with BRESHECK syndrome impairs sterol-regulated transcription and the endoplasmic reticulum stress response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro modeling supports variant pathogenicity, with impaired cell growth
      in cholesterol-depleted media, attenuated activation of the sterol
      regulatory element-binding protein pathway, and failure to activate the
      endoplasmic reticulum stress response pathway.
    explanation: >-
      The measured failure of ER-stress activation. Note the asymmetry the source
      itself reports: the SREBP pathway was "attenuated" while the ER stress
      response failed outright.
  - reference: PMID:19361614
    reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that the phenotypic expression of IFAP syndrome is
      quantitatively related to a reduced function of a key cellular regulatory
      system affecting cholesterol homeostasis and ability to cope with ER stress.
    explanation: >-
      Names both arms together as the affected system, which is the only
      published statement tying the ER-stress arm to the human phenotype - and it
      does so by naming the pair rather than by isolating this arm.
- name: Defective Epidermal and Follicular Keratinization
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    The skin and hair phenotype: spiny follicular hyperkeratosis and near-total
    absence of scalp hair, eyebrows and eyelashes from birth.

    Graded PROVISIONAL because the step from an impaired lipid-synthesis programme
    to this specific histology is inferred, not demonstrated. No study reviewed here
    measures barrier lipids, cornified envelope composition or follicular
    differentiation markers in IFAP skin. The disease is defined clinically at this
    level and mechanistically two levels up, with the connection assumed.
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle

inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    MBTPS2 is on Xp22, and affected individuals are male. The locus was mapped to
    a 5.4 Mb interval between DXS989 and DXS8019 before the gene was identified.

    Carrier females are not uniformly unaffected. Mosaic cutaneous lesions along
    Blaschko lines are described, and an ocular sign has been proposed: retinal
    vascular tortuosity in the carrier mother of two affected boys. That is a
    single family and is curated as such - it is a lead for examining carriers,
    not an established carrier test.
  evidence:
  - reference: PMID:19361614
    reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ichthyosis follicularis with atrichia and photophobia (IFAP syndrome) is a
      rare X-linked, oculocutaneous human disorder.
    explanation: >-
      The X-linked classification and the oculocutaneous framing of the entity.
  - reference: PMID:19361614
    reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we assign the IFAP locus to the 5.4 Mb region between DXS989 and
      DXS8019 on Xp22.11-p22.13
    explanation: >-
      The mapping interval, which is what established X-linkage before the gene
      was known.
  - reference: PMID:15370546
    reference_title: "Ocular findings in ichthyosis follicularis-alopecia-photophobia (IFAP) syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinal vascular tortuosity may be another clinical sign of carrier status
      in females.
    explanation: >-
      Graded PARTIAL, and the source's own "may be" is the reason. This is one
      carrier mother in one family; it supports the proposal, not the sign.
pathophysiology:
- name: Hypomorphic MBTPS2 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Missense variants exchanging highly conserved residues, and splice-site
    variants, in MBTPS2. The allelic spectrum is hypomorphic rather than null:
    every reported variant leaves some residual protease activity, and the amount
    left is what the phenotype tracks.

    That is not merely an observation about severity - it constrains what kind of
    variant can be pathogenic here. A curator or laboratory assessing a novel
    MBTPS2 variant should expect partial loss of function, and a variant predicted
    to abolish the protein entirely would be atypical for this entity rather than
    a confidently severe allele.

    explanation: >-
      The same c.671-9T>G allele with and without keratoderma across three
      patients - which is why this is banded OCCASIONAL and why the entry does not
      treat keratoderma as genotype-predicted. The source's spelling
      "heterogeneicity" is reproduced as published.
- category: Dermatological
  name: Nail Dystrophy
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Nail dystrophy
    term:
      id: HP:0008404
      label: Nail dystrophy
  evidence:
  - reference: PMID:24313295
    reference_title: "Recurrent splice-site mutation in MBTPS2 underlying IFAP syndrome with Olmsted syndrome-like features in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      along with pachyonychia, palmoplantar and periorificial keratoderma, which
      were reminiscent of Olmsted syndrome
    explanation: >-
      Pachyonychia in the reported patient, curated under the general nail
      dystrophy term.
genetic:
- name: MBTPS2
  gene_term:
    preferred_term: MBTPS2
    term:
      id: hgnc:15455
      label: MBTPS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    MBTPS2 encodes site-2 protease, a membrane-embedded zinc metalloprotease that
    performs the intramembrane cleavage step of regulated intramembrane
    proteolysis for SREBP and ATF6. Both missense and splice-site variants are
    pathogenic.
  notes: >-
    Three things about this gene that a variant-interpretation reader needs.

    First, the genotype-phenotype relationship here is quantitative and was
    measured, not inferred. The gene-identification study assayed five patient
    variants for residual activity and found the degree of diminished activity
    correlated with clinical severity in male patients. That is unusually direct
    for a rare disease, and it is why the disease-BRESHECK continuum is curated as
    one entity.

    Second, that correlation coexists with real variable expressivity within a
    single allele. The intronic variant c.671-9T>G produced IFAP with Olmsted-like
    keratoderma in one patient and IFAP without keratoderma in two others. So
    residual activity predicts severity along the main axis while leaving
    individual features unpredictable - both statements are true and neither
    should be dropped.

    Third, MBTPS2 is an allelic series across several distinct diseases: IFAP with
    or without BRESHECK, keratosis follicularis spinulosa decalvans, an X-linked
    form of Olmsted syndrome, and osteogenesis imperfecta type XIX. Two of those
    already have dismech entries. Why the same gene produces a bone disease in one
    family and a skin-and-eye disease in another is explicitly unresolved in the
    review literature - it is not a matter of a curator not having looked it up.
  evidence:
  - reference: PMID:19361614
    reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The degree of diminished activity correlated with clinical severity as noted
      in male patients.
    explanation: >-
      The measured activity-severity correlation, which is the central
      genotype-phenotype fact of this disease.
  - reference: PMID:19361614
    reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These functions were impaired in five mutations as detected in unrelated
      patients.
    explanation: >-
      The number of patient variants assayed, which bounds how much weight the
      correlation can carry.
  - reference: PMID:24313295
    reference_title: "Recurrent splice-site mutation in MBTPS2 underlying IFAP syndrome with Olmsted syndrome-like features in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a recurrent intronic mutation in MBTPS2 (c.671-9T>G) in a Chinese
      patient with the typical triad of IFAP syndrome
    explanation: >-
      A splice-site variant in the pathogenic spectrum, and the allele behind the
      variable-expressivity observation.
  - reference: PMID:33743732
    reference_title: "MBTPS2, a membrane bound protease, underlying several distinct skin and bone disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      how mutations in the MBTPS2 gene lead to several human disorders with
      different phenotypes including Ichthyosis Follicularis, Atrichia and
      Photophobia syndrome (IFAP) with or without BRESHECK syndrome, Keratosis
      Follicularis Spinulosa Decalvans (KFSD), Olmsted syndrome, and Osteogenesis
      Imperfecta type XIX remains obscure
    explanation: >-
      The allelic series and, in the same sentence, the explicit statement that
      how one gene produces them is unresolved.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence or incidence figure exists. The commonly repeated count is
    "40 cases reported", and that number deserves a caveat rather than
    repetition: it comes from the introduction of a case report about Hodgkin
    lymphoma in an IFAP patient, not from a systematic review or a registry. It is
    a background sentence in a paper about something else, and no method for
    arriving at it is given.

    It is curated because it is the only quantitative anchor available and because
    a reader will otherwise meet it uncited elsewhere, but it is graded PARTIAL and
    rate_per_100000 is left empty.
  evidence:
  - reference: PMID:28654459
    reference_title: "Hodgkin Lymphoma in a Patient With IFAP Syndrome: A Case Report and Review of Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 40 cases has been reported, but no correlation with Hodgkin
      lymphoma has been reported yet.
    explanation: >-
      Graded PARTIAL because of what the sentence is: a background count in the
      introduction of a report about a different question, with no stated method.
      It bounds the literature loosely and is not a prevalence measurement.
treatments:
- name: Systemic Acitretin
  description: >-
    A systemic retinoid, tried for the cutaneous and corneal features. The reported
    response is partial in a specific and consistent way: skin and corneal erosions
    improve, alopecia and photophobia do not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_mechanisms:
  - target: Defective Epidermal and Follicular Keratinization
    treatment_effect: MODULATES
    description: >-
      Retinoids act on keratinocyte differentiation, so the plausible target is the
      keratinisation node rather than the protease defect upstream of it. Curated
      as MODULATES rather than RESTORES: nothing about the treatment restores S2P
      activity, and the reported improvement is partial.
    evidence:
    - reference: PMID:16268889
      reference_title: "Ichthyosis follicularis, alopecia and photophobia (IFAP) syndrome treated with acitretin."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A moderate response to acitretin therapy (1 mg/kg) administered for 6
        months was observed, with improvement in cutaneous features and corneal
        erosions and no change in alopecia or photophobia.
      explanation: >-
        Graded PARTIAL on the source's own terms - a "moderate response" in a
        single patient, with two of the three triad features explicitly unchanged.
  evidence:
  - reference: PMID:16268889
    reference_title: "Ichthyosis follicularis, alopecia and photophobia (IFAP) syndrome treated with acitretin."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a 3-year-old male patient with the ichthyosis follicularis,
      alopecia and photophobia (IFAP) syndrome, who developed cutaneous and ocular
      involvement in infancy.
    explanation: >-
      Establishes the evidence base as a single three-year-old patient, which is
      the fact that most constrains how this treatment should be read.
  notes: >-
    The deep-research report that accompanied this curation proposed NCIT:C29496
    as the term for "Acitretin ~1 mg/kg". That identifier does not exist in NCIT -
    its own term-validation section flagged it as most likely invented. The
    treatment is instead curated with the generic Pharmacotherapy action term plus
    a CHEBI therapeutic_agent, which is the pattern CLAUDE.md prescribes and which
    validates.

    A dose does not belong in an ontology binding in any case. The 1 mg/kg figure
    lives in the evidence snippet, where it is attributable.
- name: Ocular Surface Protection
  description: >-
    The mainstay of ocular care, and on the limbal-failure reading of the disease
    it is a holding measure rather than a treatment of the lesion. Aggressive
    lubrication, prophylactic antibiotics and lateral tarsorrhaphy maintained a
    stable corneal surface in the one infant followed prospectively from diagnosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Vascularising Keratopathy
    treatment_effect: MODULATES
    description: >-
      Protects the ocular surface without addressing the limbal stem-cell failure
      that is failing to maintain it.
    evidence:
    - reference: PMID:32482964
      reference_title: "Limbal Stem Cell Dysfunction in Ichthyosis Follicularis, Alopecia, and Photophobia Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The corneal surface was maintained with lubrication and tarsorrhaphy and
        has remained stable since.
      explanation: >-
        The reported outcome of surface protection in that patient.
  evidence:
  - reference: PMID:32482964
    reference_title: "Limbal Stem Cell Dysfunction in Ichthyosis Follicularis, Alopecia, and Photophobia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which were managed with aggressive lubrication, prophylactic antibiotics,
      and bilateral permanent lateral tarsorrhaphies at 7 months of age
    explanation: >-
      The specific measures used, with the age at which they were needed.
  notes: >-
    Curated with an explicit target link even though it is supportive care, because
    on this entry's reading the ocular problem is stem-cell failure and surface
    protection is the only thing currently offered against it. Saying that plainly
    is more useful than leaving the ocular arm with no treatment attached.
experimental_models:
- name: CHO M19 site-2-protease-deficient complementation assay
  experimental_model_type: CELL_LINE
  description: >-
    Chinese hamster ovary M19 cells lack endogenous S2P and therefore cannot grow
    without exogenous cholesterol and lipid. Transfecting human MBTPS2 rescues
    them, and patient variants rescue them only partially - read out both by an
    SRE-regulated reporter and by growth in lipid-free medium.

    This is the assay the entire pathogenicity classification of MBTPS2 variants
    rests on, and it is the reason the severity relationship in this disease is
    quantitative rather than categorical.
  modeled_mechanisms:
  - target: Impaired SREBP-Driven Lipid Synthesis
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies residual S2P activity through its SREBP output, which is what
      makes the activity-severity correlation measurable.

      Curated as MEASURES rather than RECAPITULATES on purpose: the cell line does
      not model IFAP, it assays one function of the mutant protein. Nothing about
      a hamster ovary cell reproduces a hair follicle or a corneal limbus.
    limitations: >-
      Two limits worth stating. The readout is the SREBP arm; the assay in its
      original form says nothing about ATF6, which is why the ER-stress node is
      graded lower. And a rodent ovary-derived line carries none of the
      tissue-specific context that determines why the phenotype falls on skin,
      hair and cornea rather than on the many other tissues that need SREBP.
    readouts:
    - name: SRE-regulated reporter induction and growth in lipid-free medium
      target: Impaired SREBP-Driven Lipid Synthesis
      direction: DECREASED
      interpretation: >-
        Patient variants complement the M19 deficiency less well than wild-type
        MBTPS2, and the shortfall is graded rather than all-or-none.
      evidence:
      - reference: PMID:19361614
        reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Wild-type MBTPS2 was able to complement the protease deficiency in
          Chinese hamster M19 cells as shown by induction of an SRE-regulated
          reporter gene in transient transfection experiments and by growth of
          stably transfected cells in media devoid of cholesterol and lipids.
        explanation: >-
          The two readouts of the assay, in the paper that established it for this
          gene.
    evidence:
    - reference: PMID:19361614
      reference_title: "IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease essential for cholesterol homeostasis and ER stress response."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The degree of diminished activity correlated with clinical severity as
        noted in male patients.
      explanation: >-
        Supports treating this assay as informative for the disease: its output
        tracks the clinical phenotype.
differential_diagnoses:
- name: Keratosis follicularis spinulosa decalvans
  description: >-
    The nearest allelic differential, and the one most likely to be confused. Also
    MBTPS2, also X-linked, also follicular hyperkeratosis with hair loss and
    photophobia - but the hair loss is progressive and cicatricial rather than
    congenital atrichia, and the corneal disease is milder.
  distinguishing_features:
  - Atrichia in IFAP is congenital and near-total; hair loss in KFSD is progressive and scarring.
  - Both are MBTPS2 disorders, so the gene result does not separate them - the phenotype does.
  evidence:
  - reference: PMID:33743732
    reference_title: "MBTPS2, a membrane bound protease, underlying several distinct skin and bone disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      how mutations in the MBTPS2 gene lead to several human disorders with
      different phenotypes including Ichthyosis Follicularis, Atrichia and
      Photophobia syndrome (IFAP) with or without BRESHECK syndrome, Keratosis
      Follicularis Spinulosa Decalvans (KFSD), Olmsted syndrome, and Osteogenesis
      Imperfecta type XIX remains obscure
    explanation: >-
      Establishes KFSD as an allelic disorder of the same gene, which is what makes
      it a differential that genetic testing alone cannot resolve.
- name: X-linked Olmsted syndrome
  description: >-
    Also allelic. The distinction is genuinely contested rather than merely
    difficult: a patient with the IFAP triad plus Olmsted-like periorificial and
    palmoplantar keratoderma has been reported, and the authors argued the overlap
    may challenge whether the X-linked form of Olmsted syndrome exists as an
    independent condition at all.
  distinguishing_features:
  - Periorificial and palmoplantar keratoderma is the Olmsted-like element; it occurs in IFAP patients too, including with a variant that produced IFAP without keratoderma in others.
  evidence:
  - reference: PMID:24313295
    reference_title: "Recurrent splice-site mutation in MBTPS2 underlying IFAP syndrome with Olmsted syndrome-like features in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The concomitance of Olmsted syndrome-like features in this patient with IFAP
      may challenge the existence of the X-linked form of Olmsted syndrome as an
      independent condition.
    explanation: >-
      The authors' own nosological doubt, which is the substance of this
      differential rather than a list of separating features.
discussions:
- discussion_id: ifap_atf6_arm_unattached_to_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does loss of ATF6 signalling contribute anything to the IFAP phenotype, or is
    the disease explained by the SREBP arm alone?
  attaches_to:
  - "pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response"
  - "pathophysiology#Impaired SREBP-Driven Lipid Synthesis"
  rationale: >-
    Every account of this disease, including this entry's own description, states
    that S2P loss impairs both cholesterol homeostasis and the ER stress response.
    The first half of that is measured and connected to phenotype. The second half
    is measured and connected to nothing.

    What exists for the ATF6 arm: a BRESHECK-associated variant fails to activate
    the ER stress response in vitro, and the gene-identification paper names
    "ability to cope with ER stress" alongside cholesterol homeostasis as the
    affected system. What does not exist: any clinical feature of IFAP attributed
    to ATF6 loss specifically, any tissue in which ER stress has been measured in a
    patient, and any account of why an ER-stress defect would fall on hair follicle
    and limbus rather than on the secretory tissues where the UPR matters most.

    So the two-arm mechanism is stated everywhere and load-bearing nowhere. Every
    phenotype curated in this entry could be produced by the SREBP arm alone. That
    is worth flagging rather than smoothing over, because a two-arm story that
    cannot be broken by any observation is not doing explanatory work.

    Note one asymmetry in the data that argues *against* dismissing the arm: in the
    one variant where both were tested, the SREBP pathway was attenuated while the
    ER stress response failed outright. If that pattern holds, the ATF6 arm is the
    more severely affected one, which makes its clinical silence more puzzling
    rather than less.
  proposed_experiments:
  - experiment_id: exp_ifap_er_stress_in_patient_keratinocytes
    name: ER stress response in patient keratinocytes and limbal epithelial cells
    description: >-
      Derive keratinocytes and, where available, limbal epithelial cells from IFAP
      patients across the severity range, and measure ATF6 processing and
      downstream UPR target induction under tunicamycin or thapsigargin challenge
      alongside SREBP target induction in the same cells. This asks whether the two
      arms are impaired to different degrees in the tissues that actually express
      the phenotype, rather than in a hamster ovary line.
    would_support:
    - "pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response"
    supporting_outcome:
    - Patient keratinocytes show blunted ATF6 processing and UPR target induction, and the magnitude tracks cutaneous severity independently of the SREBP readout.
    would_refute:
    - "pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response"
    refuting_outcome:
    - ATF6 processing and UPR target induction are preserved in patient keratinocytes despite a measurable SREBP deficit, placing the whole phenotype on the SREBP arm.
  evidence:
  - reference: PMID:34655156
    reference_title: "A novel MBTPS2 variant associated with BRESHECK syndrome impairs sterol-regulated transcription and the endoplasmic reticulum stress response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro modeling supports variant pathogenicity, with impaired cell growth
      in cholesterol-depleted media, attenuated activation of the sterol
      regulatory element-binding protein pathway, and failure to activate the
      endoplasmic reticulum stress response pathway.
    explanation: >-
      The one experiment measuring both arms, and the source of the asymmetry the
      rationale points at - attenuated versus failed.
- discussion_id: ifap_allelic_series_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do MBTPS2 variants produce a skin-and-eye disease in some families and a
    bone disease in others?
  attaches_to:
  - "genetic#MBTPS2"
  rationale: >-
    MBTPS2 causes IFAP with or without BRESHECK, keratosis follicularis spinulosa
    decalvans, an X-linked form of Olmsted syndrome, and osteogenesis imperfecta
    type XIX. These are not variations in severity of one phenotype - osteogenesis
    imperfecta is a different organ system from ichthyosis and keratopathy.

    The review literature is unusually explicit that this is unresolved, which is
    worth recording because it is easy for a curator to assume the answer is known
    and merely not looked up.

    Two features of this entry make the question sharper rather than more diffuse.
    The activity-severity correlation says residual protease activity sets severity
    along the IFAP-BRESHECK axis - so if it also set tissue specificity, KFSD and
    osteogenesis imperfecta would be points on the same line, and they are not.
    And the same allele can vary in expressivity within IFAP, so allele identity
    does not fully determine the phenotype even inside one disease.

    dismech is in an unusual position to notice this, because it already carries
    entries for two of the other MBTPS2 diseases. A cross-entry comparison of which
    residues and which functional consequences map to which entity is a concrete
    piece of work that does not need new data.
  proposed_experiments:
  - experiment_id: exp_ifap_allelic_series_residue_map
    name: Residue-level map of MBTPS2 variants across the four allelic diseases
    description: >-
      Assemble every reported MBTPS2 variant with its associated clinical entity,
      map onto the protein's transmembrane and catalytic architecture, and test
      whether disease assignment separates by domain, by predicted residual
      activity, or by neither. Assay a matched set in both the SREBP and ATF6
      readouts, since only the SREBP arm has been systematically measured.
    would_support:
    - "genetic#MBTPS2"
    supporting_outcome:
    - Variants segregate by domain or by which substrate arm they preferentially impair, giving a mechanism for the tissue specificity.
    would_refute:
    - "genetic#MBTPS2"
    refuting_outcome:
    - Variants causing bone and skin disease are interleaved across domains with indistinguishable functional profiles, placing the determinant outside the protein.
  evidence:
  - reference: PMID:33743732
    reference_title: "MBTPS2, a membrane bound protease, underlying several distinct skin and bone disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While its functional role has become much clearer in the recent years, how
      mutations in the MBTPS2 gene lead to several human disorders with different
      phenotypes
    explanation: >-
      The review's framing of the gap: function understood, disease mapping not.
notes: >-
  Lump/split calls. BRESHECK is a has_subtypes entry, not a separate disease - the
  MONDO label itself lumps them, the gene and allele class are the same, and the
  functional assay shows the same two pathways impaired. The other MBTPS2
  diseases are kept separate, and that asymmetry is deliberate: BRESHECK is the
  severe end of the same phenotype, while KFSD, Olmsted syndrome and osteogenesis
  imperfecta type XIX are different phenotypes that happen to share a gene. Two of
  those already have dismech entries.

  Nomenclature. The disease name uses "atrichia" in some sources and "alopecia" in
  others, and both spellings are in the published titles cited here. The synonym
  list carries both because a search on one alone will miss papers.

  What is deliberately not curated. The disease is described in the literature as
  X-linked recessive, and the entry uses HP:0001419 accordingly - but the carrier
  findings, mosaic Blaschko-linear skin lesions and retinal vascular tortuosity,
  sit awkwardly with a strictly recessive label, and no source reviewed here
  resolves that. Also not curated: an SREBP-NF-kB link that has been proposed as an
  explanation for recurrent infections in IFAP, which rests on LPS-stimulation
  experiments in an unrelated system with no IFAP patient data attached; the
  Hodgkin lymphoma association, which is a single case and the source itself
  presents as a first report rather than an established risk; and Drosophila S2P
  mutants, which are informative about the enzyme but are not a disease model.

  Provenance. Built from primary literature with an OpenScientist deep-research
  report run alongside and committed under research/. The report supplied most of
  the reference set, each verified on PubMed and fetched through
  'just fetch-reference' before use. Two of its ontology suggestions were rejected
  on its own validation evidence: NCIT:C29496 for "Acitretin ~1 mg/kg", which does
  not exist in NCIT, and HP:0033052 offered as "Angular cheilitis / periorificial
  keratotic plaques" when that identifier is "Non-epileptic seizure" - a
  mislabelling that would have put a seizure phenotype into a genodermatosis. It
  also gave MBTPS2 as HGNC:7375; the correct identifier is hgnc:15455, as the
  curation stub recorded. The "40 cases reported" figure it surfaced is curated
  but graded PARTIAL, because its source is a background sentence in a case report
  about Hodgkin lymphoma rather than a systematic count.

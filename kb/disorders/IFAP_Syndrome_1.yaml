has_subtypes:
- name: BRESHECK
  display_name: BRESHECK syndrome (severe multisystem end of the spectrum)
  description: >-
    The IFAP triad plus intellectual disability and multiple congenital anomalies.
    The acronym expands to brain anomalies, retardation of mentality and growth,
    ectodermal dysplasia, skeletal malformations, Hirschsprung disease, ear
    deformity and deafness, eye hypoplasia, cleft palate, cryptorchidism, and
    kidney dysplasia or hypoplasia.

    Curated as a subtype rather than a separate disease because it is the severe
    end of one activity continuum, not a different mechanism: the same gene, the
    same class of hypomorphic allele, and a functional assay showing the same two
    pathways impaired. The MONDO label itself lumps them - "IFAP syndrome 1, with
    or without BRESHECK syndrome".
  evidence:

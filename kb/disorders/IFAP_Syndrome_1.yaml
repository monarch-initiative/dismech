name: IFAP Syndrome 1
creation_date: "2026-08-29T12:40:00Z"
category: Mendelian
disease_term:
  preferred_term: IFAP syndrome
  term:
    id: MONDO:0100213
    label: IFAP syndrome 1, with or without BRESHECK syndrome
description: >-
  IFAP syndrome is an X-linked genodermatosis defined by a congenital triad -
  ichthyosis follicularis, atrichia, and photophobia - caused by hypomorphic
  variants in MBTPS2, which encodes site-2 protease (S2P).

  The reason one protease produces skin, hair and eye disease at once is that S2P
  is not a pathway enzyme but a shared switch. It performs the second,
  membrane-embedded cut of regulated intramembrane proteolysis, and it does so for
  two unrelated regulators: SREBP, which drives cholesterol and fatty-acid
  synthesis, and ATF6, which carries the endoplasmic-reticulum stress response.
  Losing S2P activity therefore degrades barrier lipid synthesis and the ER stress
  response together, in every tissue that depends on either - the cornified
  epidermis, the hair follicle, and the corneal and limbal epithelium.

  The disease has an unusual property that makes it worth curating carefully:
  severity is a dose of enzyme activity rather than a category. Every reported
  allele is hypomorphic - complete loss of S2P is presumably not viable - and the
  original gene-identification study measured residual protease activity for five
  patient variants in a complementation assay and found the degree of diminished
  activity correlated with clinical severity. The same continuum runs from
  isolated IFAP up to BRESHECK syndrome, the IFAP triad plus intellectual
  disability and multiple congenital anomalies, which is curated here as a subtype
  rather than as a separate disease.

  The eye is the organ that carries most of the morbidity and the part most often
  under-described. Photophobia is not a symptom of dry eye but the surface
  expression of a progressive vascularising keratopathy, and anterior-segment
  imaging in an infant followed from six days old points at limbal stem cell
  dysfunction as the lesion - which reframes the ocular problem from one of
  lubrication to one of stem-cell failure.

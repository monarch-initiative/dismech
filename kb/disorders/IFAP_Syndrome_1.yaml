    modifier: DECREASED
    term:
      id: GO:0030216
      label: keratinocyte differentiation
  evidence:
  - reference: PMID:24313295
    reference_title: "Recurrent splice-site mutation in MBTPS2 underlying IFAP syndrome with Olmsted syndrome-like features in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the typical triad of IFAP syndrome (i.e. ichthyosis, atrichia and
      photophobia), along with pachyonychia, palmoplantar and periorificial
      keratoderma
    explanation: >-
      The cutaneous phenotype including the keratoderma that extends it in some
      patients.
- name: Progressive Vascularising Keratopathy
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    The ocular phenotype, and the one that carries the morbidity. Photophobia is
    the symptom; the disease is a keratopathy that progresses through spontaneous
    epithelial defects, superficial and deep corneal vascularisation, and scarring
    to counting-fingers acuity.

    The most informative observation is developmental rather than static. An
    infant diagnosed at six days had clear corneas; the epithelial defects appeared
    at six months, and imaging then showed limbal thickening, peripheral pannus,
    conjunctivalisation and abnormal hyperreflective epithelium - the picture of
    limbal stem cell dysfunction. So the cornea is not malformed, it fails to
    maintain itself, which is a different therapeutic target.

    Graded PROVISIONAL: the limbal-failure account rests on one prospectively
    followed infant, and no histology or limbal-marker study has been published.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  - preferred_term: corneal epithelium
    term:
      id: UBERON:0001772
      label: corneal epithelium
  evidence:
  - reference: PMID:32482964
    reference_title: "Limbal Stem Cell Dysfunction in Ichthyosis Follicularis, Alopecia, and Photophobia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The progressive conjunctivalization, spontaneous epithelial defects, and
      anterior segment optical coherence tomography features are highly suggestive
      of limbal stem cell dysfunction in IFAP syndrome.
    explanation: >-
      The limbal-failure interpretation, in the authors' own hedged words -
      "highly suggestive of", which is what the PROVISIONAL grade records.
  - reference: PMID:32482964
    reference_title: "Limbal Stem Cell Dysfunction in Ichthyosis Follicularis, Alopecia, and Photophobia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial examination showed hyperkeratotic eyelids, madarosis, and
      lagophthalmos, but otherwise clear corneas. He developed bilateral central
      corneal epithelial defects spontaneously 6 months later
    explanation: >-
      The developmental sequence - normal cornea at six days, breakdown at six
      months - which is what distinguishes maintenance failure from malformation.
  - reference: PMID:15370546
    reference_title: "Ocular findings in ichthyosis follicularis-alopecia-photophobia (IFAP) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected male children had severe photophobia, total superficial and
      deep corneal vascularization, and reduction of vision to counting fingers.
    explanation: >-
      The endpoint of the progression, in two siblings.

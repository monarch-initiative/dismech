differential_diagnoses:
- name: Langerhans Cell Histiocytosis
  disease_term:
    preferred_term: Langerhans cell histiocytosis
    term:
      id: MONDO:0018310
      label: Langerhans cell histiocytosis
  description: >-
    Clonal L-group histiocytosis that shares MAPK pathway driver mutations and
    can co-occur with or mimic Erdheim-Chester disease in up to 15% of cases.
  distinguishing_features:
  - >-
    ECD is characterized by foamy CD68-positive, CD1a-negative histiocytes and
    bilateral symmetric long-bone osteosclerosis, whereas Langerhans cell
    histiocytosis is defined by CD1a-positive dendritic histiocytes.
  evidence:
  - reference: PMID:32107533
    reference_title: "Erdheim-Chester disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The discovery of BRAF mutations and of other MAP kinase pathway
      alterations, as well as the co-occurrence of ECD with LCH in 15% of
      patients with ECD, led to the 2016 revision of the classification of
      histiocytoses in which LCH and ECD belong to the "L" group.
    explanation: >-
      Documents the close clinicopathologic relationship and 15% overlap between
      ECD and Langerhans cell histiocytosis.
  - reference: PMID:32107533
    reference_title: "Erdheim-Chester disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Erdheim-Chester disease (ECD) is characterized by the infiltration of
      tissues by foamy CD68+CD1a- histiocytes, with 1500 known cases since 1930.
    explanation: >-
      Establishes the CD68+CD1a- immunophenotype that distinguishes ECD
      histiocytes from CD1a+ Langerhans cell histiocytosis.
datasets:
- accession: geo:GSE279030
  title: The effect of methylation on the let-7-BCL2L1-BCL2 axis and the potential use of hypomethylating and BH3 mimetic drugs in histiocytic neoplasms
  description: The histiocytoses [Erdheim-Chester Disease (ECD), Langerhans cell histiocytosis (LCH), and Rosai-Dorfman-Destombes disease (RDD)] are characterized by the infiltration of monocytes, macrophages, and dendritic cells in normal tissues, leading to significant morbidity due to disruption of critical organ systems. While their pathogenesis involves MAPK-ERK pathway mutations, their epigenetic landscape remains poorly understood. Epigenetic mechanisms such as DNA methylation, histone modification, and non-coding RNA are crucial in gene expression regulation and cancer development. We previously identified a distinct non-coding RNA profile in histiocytosis patients compared to controls.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 34
  publication: PMID:39516372
  notes: Identified by GEO DataSets index search for Erdheim-Chester Disease (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis rests on a compatible cone-rod dystrophy phenotype and biallelic
    ADAM9 variants found by inherited retinal disease gene panels or exome
    sequencing, with Sanger confirmation and segregation testing. ADAM9 is
    also included in panels for early-onset severe retinal dystrophy and Leber
    congenital amaurosis, where it is an uncommon cause.
  results: Identification of biallelic pathogenic ADAM9 variants confirms the diagnosis.
  evidence:
  - reference: PMID:25091951
    reference_title: Novel ADAM9 homozygous mutation in a consanguineous Egyptian family with severe cone-rod dystrophy and cataract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening for mutations in genes known to be implicated in retinal
      disorders was done with the IROme, an in-solution enrichment array,
      followed by high-throughput sequencing.
    explanation: Panel sequencing identified the ADAM9 variant.
  - reference: PMID:38028590
    reference_title: "Four different gene-related cone-rod dystrophy: clinical and genetic findings in six Chinese families with diverse modes of inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing was performed on probands to screen the causative
      variants, and all suspected pathogenic variants were determined via Sanger
      sequencing.
    explanation: Exome sequencing with Sanger confirmation identified the ADAM9 variant.
  - reference: PMID:38892339
    reference_title: "Four Unique Genetic Variants in Three Genes Account for 62.7% of Early-Onset Severe Retinal Dystrophy in Chile: Diagnostic and Therapeutic Consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it complements and reinforces earlier reports, indicating the involvement
      of ADAM9 and RP1 as uncommon causes of LCA/EOSRD
    explanation: ADAM9 is an uncommon cause of early-onset severe retinal dystrophy in a panel-sequenced cohort.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: retinal examination
    term:
      id: NCIT:C101217
      label: Retinal Examination
  description: >-
    Light-adapted and dark-adapted full-field electroretinography quantifies
    combined cone and rod photoreceptor dysfunction and establishes the
    cone-rod dystrophy pattern.
  results: Reduced photopic cone and scotopic rod response amplitudes.
  evidence:
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "electroretinograms (ERGs) showed a similar degree of rod and cone involvement"
    explanation: Full-field ERG demonstrates combined cone and rod involvement in the founding families.
  - reference: PMID:38028590
    reference_title: "Four different gene-related cone-rod dystrophy: clinical and genetic findings in six Chinese families with diverse modes of inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ERG results suggested a mild reduction in the b-wave amplitude of the
      photopic cone response and a severe reduction in the b-wave amplitude of
      the scotopic rod response in both eyes
    explanation: ERG findings in the homozygous ADAM9 p.Arg202Ter proband.

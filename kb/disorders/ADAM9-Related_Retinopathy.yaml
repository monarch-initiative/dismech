  variants:
  - name: c.1130+1G>A
    description: >-
      Homozygous splice donor variant at the first base of intron 11, found in
      the Brazilian family in which the CORD9 locus was first mapped.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sequencing revealed a homozygous point mutation in the ADAM9 gene (MIM
        ∗602713), altering the first base of intron 11 (c.1130+1G→A) and
        abolishing the splice-site
      explanation: Reports the variant and its effect on splicing.
  - name: c.766C>T (p.Arg256Ter)
    description: Homozygous nonsense variant in exon 9, found in a consanguineous Pakistani family.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Direct sequencing of ADAM9 in MEP49 revealed a homozygous point mutation
        in exon 9, creating a premature stop codon (c.766C→T; p.R256X)
      explanation: Reports the variant in family MEP49.
  - name: c.490C>T (p.Arg164Ter)
    description: Homozygous nonsense variant found in a consanguineous Tunisian Jewish family.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A second homozygous stop codon was identified in MOL0172 (c.490C→T; p.R164X)"
      explanation: Reports the variant in family MOL0172.
  - name: c.411-8A>G
    description: >-
      Homozygous intronic variant that activates a cryptic splice acceptor,
      adding seven bases to exon 6 and causing a frameshift (R137SfsX16).
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        this mutation activated a cryptic splice acceptor site giving rise only
        to an aberrant transcript
      explanation: Patient lymphocyte cDNA shows the variant produces only an aberrant transcript.
  - name: c.1396-2A>G
    description: Homozygous splice acceptor variant in intron 13, found in a consanguineous Egyptian family.
    evidence:
    - reference: PMID:25091951
      reference_title: Novel ADAM9 homozygous mutation in a consanguineous Egyptian family with severe cone-rod dystrophy and cataract.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IROme analysis identified a c.1396-2A>G homozygous mutation in the
        splice acceptor site of intron 13 of ADAM9.
      explanation: Reports the variant.
  - name: c.604C>T (p.Arg202Ter)
    description: Homozygous nonsense variant found in a Chinese proband from a family reporting no consanguinity.
    evidence:
    - reference: PMID:38028590
      reference_title: "Four different gene-related cone-rod dystrophy: clinical and genetic findings in six Chinese families with diverse modes of inheritance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The proband carried a homozygous nonsense variant c.604C>T (p.Arg202Ter)
        in ADAM9, and the phenotypically normal father and mother carried the
        same heterozygous variant
      explanation: Reports the variant with heterozygous unaffected parents.
pathophysiology:
- name: ADAM9 Loss of Function
  description: >-
    Biallelic nonsense, frameshift and splice variants are predicted to abolish
    ADAM9, a transmembrane metalloprotease with adhesion and ectodomain-shedding
    functions, through nonsense-mediated decay.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: ADAM9
      term:
        id: hgnc:216
        label: ADAM9
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ADAM9
    term:
      id: hgnc:216
      label: ADAM9
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
    modifier: ABSENT
  evidence:
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      strongly suggesting that ADAM9 is likely to be absent in these patients
      because of nonsense-mediated decay
    explanation: The human alleles are inferred to eliminate the protein.
  downstream:
  - target: RPE Apical Microvillus Disorganization
    description: >-
      Loss of Adam9 in knockout mice disorganizes the apical processes of the
      retinal pigment epithelium.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In 12-month-old knockout mice, photoreceptors appear normal, but the
        apical processes of the retinal pigment epithelium (RPE) cells are
        disorganized
      explanation: Knockout mice show the RPE apical defect as a consequence of Adam9 loss.
- name: RPE Apical Microvillus Disorganization
  description: >-
    The apical microvilli of the retinal pigment epithelium fail to invest the
    photoreceptor outer segments; in mice the apical processes are extended,
    malformed and vesiculated. This is the first lesion in both the mouse and
    the dog models.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: microvillus organization
    term:
      id: GO:0032528
      label: microvillus organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20806078
    reference_title: An ADAM9 mutation in canine cone-rod dystrophy 3 establishes homology with human cone-rod dystrophy 9.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      as in ADAM9 knockout mice, the primary lesion in crd3 appears to be a
      failure of the apical microvilli of the retinal pigment epithelium to
      appropriately invest photoreceptor outer segments
    explanation: Dogs with an ADAM9 deletion share the RPE apical microvillus lesion seen in knockout mice.
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electron microscopy revealed extended malformed, vesiculated RPE apical
      processes
    explanation: Ultrastructural description of the RPE apical defect in Adam9 knockout mice.
  downstream:
  - target: Photoreceptor Outer Segment-RPE Separation
    description: >-
      Without normal apical microvilli, contact between the outer segments and
      the RPE apical surface is lost and the subretinal space widens.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the apical processes of the retinal pigment epithelium (RPE) cells are
        disorganized and contact between photoreceptor outer segments (POSs) and
        the RPE apical surface is compromised
      explanation: The apical process defect and the loss of POS-RPE contact are reported together in knockout mice.
  - target: Abnormal retinal pigmentation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred link. The RPE changes seen on fundus examination in patients
      are taken to reflect the RPE pathology shown in the mouse and dog
      models; no study has examined ADAM9 patient RPE histologically to
      confirm it.
    evidence:
    - reference: PMID:25091951
      reference_title: Novel ADAM9 homozygous mutation in a consanguineous Egyptian family with severe cone-rod dystrophy and cataract.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        reorganisation of the retinal pigment epithelium with mid-periphery
        greyish-white discolouration
      explanation: Clinical RPE reorganization on fundus examination in homozygous ADAM9 patients parallels the RPE pathology of animal models.
- name: Photoreceptor Outer Segment-RPE Separation
  description: >-
    Expansion of the subretinal space separating photoreceptor outer segments
    from the retinal pigment epithelium. In Adam9 knockout mice the gap is
    present well before photoreceptors degenerate.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:41642651
    reference_title: Adam9-deficient retinal pigment epithelium pseudopods maintain photoreceptor outer segment renewal despite subretinal space expansion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we analyzed outer segment function and renewal in the Adam9-knockout
      mouse characterized by a major expansion of the subretinal space
    explanation: Subretinal space expansion is the defining tissue feature of the knockout retina.
  downstream:
  - target: Compensatory RPE Pseudopod Outer Segment Ingestion
    description: >-
      RPE cells extend elongated pseudopods across the enlarged subretinal space
      to ingest outer segment tips.
    evidence:
    - reference: PMID:41642651
      reference_title: Adam9-deficient retinal pigment epithelium pseudopods maintain photoreceptor outer segment renewal despite subretinal space expansion.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The latter is achieved through the formation of elongated RPE pseudopods
        extending across the enlarged subretinal space to ingest outer segment
        tips.
      explanation: The pseudopods are the RPE response to the expanded subretinal space.
  - target: Progressive Photoreceptor Degeneration
    description: >-
      The POS-RPE junction anomaly precedes photoreceptor degeneration in
      knockout mice; the mechanism linking the two is not established, and the
      pseudopod work shows that the gap alone does not immediately impair
      photoreceptor function.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In 20-month-old mice, there is clear evidence of progressive retinal
        degeneration with disorganized POS and thinning of the outer nuclear
        layer (ONL) in addition to the anomaly at the POS-RPE junction.
      explanation: >-
        Degeneration follows the junction anomaly in time; the temporal order
        supports, but does not prove, a causal link.
- name: Compensatory RPE Pseudopod Outer Segment Ingestion
  description: >-
    Elongated RPE pseudopods reach across the expanded subretinal space and
    ingest outer segment tips, keeping outer segment renewal and rod light
    responses normal in knockout mice before photoreceptor degeneration begins.
  role: compensation
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: phagocytosis, engulfment
    term:
      id: GO:0006911
      label: phagocytosis, engulfment
  evidence:
  - reference: PMID:41642651
    reference_title: Adam9-deficient retinal pigment epithelium pseudopods maintain photoreceptor outer segment renewal despite subretinal space expansion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      photoreceptor-RPE separation affected neither the sensitivity of
      photoreceptor light responses nor the normal rate of outer segment renewal
      in this mouse prior to the onset of photoreceptor degeneration
    explanation: Outer segment renewal and photoreceptor function are preserved early despite the separation.
- name: Progressive Photoreceptor Degeneration
  description: >-
    Progressive loss of rod and cone photoreceptors with disorganized outer
    segments and outer nuclear layer thinning, accompanied in older knockout
    mice by RPE basal deposits and macrophages in the subretinal space. In
    humans this produces the cone-rod dystrophy phenotype.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest a progressive degeneration affecting both rods and
      cones in Adam9−/− mice.
    explanation: ERG decline in knockout mice indicates progressive rod and cone degeneration.
  - reference: PMID:20806078
    reference_title: An ADAM9 mutation in canine cone-rod dystrophy 3 establishes homology with human cone-rod dystrophy 9.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      by 15 months of age, cone dysfunction is present. Subsequently, both rod

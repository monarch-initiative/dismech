name: ADAM9-Related Retinopathy
creation_date: "2026-11-05T00:49:53Z"
category: Mendelian
description: >-
  An autosomal recessive inherited retinal dystrophy caused by biallelic
  loss-of-function variants in ADAM9, a transmembrane metalloprotease. The
  reported human presentation is an early-onset cone-rod dystrophy (cone-rod
  dystrophy 9, CORD9) with poor visual acuity in the first decade, macular
  outer retinal atrophy, retinal pigment epithelium changes and reduced rod and
  cone electroretinogram responses. In Adam9 knockout mice and in dogs with a
  naturally occurring ADAM9 deletion, the first lesion is at the junction
  between the retinal pigment epithelium apical microvilli and the
  photoreceptor outer segments, and photoreceptor degeneration follows later.
disease_term:
  preferred_term: ADAM9-related retinopathy
  term:
    id: MONDO:0800398
    label: ADAM9-related retinopathy
synonyms:
- Cone-rod dystrophy 9
- CORD9
- Autosomal recessive cone-rod dystrophy 9
- ADAM9-related cone-rod dystrophy
parents:
- Cone-Rod Dystrophy
- Inherited Retinal Dystrophy
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal recessive Mendelian inherited retinal dystrophy caused by
      germline biallelic null variants in ADAM9.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified null mutations in the ADAM metallopeptidase domain 9
        (ADAM9) gene in four consanguineous families with recessively inherited
        early-onset CRD
      explanation: Establishes the monogenic autosomal recessive etiology of ADAM9-related cone-rod dystrophy.
  - classification_value: NEUROLOGIC
    notes: >-
      Neurosensory retinal degeneration affecting the retinal pigment epithelium
      and cone and rod photoreceptors; Harrison's places visual sensory
      disorders within Neurologic Disorders.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cone-rod dystrophy (CRD) is an inherited progressive retinal dystrophy
        affecting the function of cone and rod photoreceptors.
      explanation: Defines the disorder as a progressive neurosensory photoreceptor degeneration.
notes: >-
  The human literature is small: four consanguineous families in the gene
  discovery report (PMID:19409519), one consanguineous Egyptian family
  (PMID:25091951), a single Chinese proband in an exome study (PMID:38028590),
  and an exome-diagnosed child (PMID:25546566) whose PubMed record returned no
  abstract text on the fetches made for this entry, so it is not cited as
  evidence. ClinGen also scores an ADAM9 proband from a Chinese recessive
  retinitis pigmentosa panel study (PMID:23661369); only its abstract was
  retrievable, and the abstract does not name ADAM9, so it is not cited. No
  prevalence estimate specific to ADAM9 disease was found.
  Photophobia and nystagmus are not recorded as phenotypes because the gene
  discovery report states that neither was noted in its affected individuals.
  No disease-specific treatment is established; the gene discovery report
  suggests ADAM9 as a gene therapy target because photoreceptors are intact
  early in the mouse disease, but no clinical trial was identified. No
  GeneReviews chapter covers ADAM9 or CORD9 (just check-genereviews against
  the 2026-09-10 Bookshelf index returned NO_CHAPTER).
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous for null ADAM9 alleles, typically in
    consanguineous families; heterozygous parents and siblings are unaffected.
  evidence:
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified null mutations in the ADAM metallopeptidase domain 9
      (ADAM9) gene in four consanguineous families with recessively inherited
      early-onset CRD
    explanation: Gene discovery report establishing recessive inheritance in four families.
  - reference: PMID:25091951
    reference_title: Novel ADAM9 homozygous mutation in a consanguineous Egyptian family with severe cone-rod dystrophy and cataract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was homozygous in the two children affected by arCRD and in
      their affected mother. This mutation was heterozygous in the unaffected
      father and the four unaffected children.
    explanation: Segregation of a homozygous ADAM9 variant with disease, with unaffected heterozygous carriers.
prevalence:
- population: Published literature (CORD9 families and EOSRD cohorts)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate specific to ADAM9 retinopathy has been
    published. Reported human cases are limited to a small number of
    predominantly consanguineous families (four founding families in
    PMID:19409519, one Egyptian family in PMID:25091951, a Chinese CORD proband
    in PMID:38028590) and uncommon cases in early-onset severe retinal
    dystrophy cohorts (PMID:38892339).
  evidence:
  - reference: PMID:25091951
    reference_title: Novel ADAM9 homozygous mutation in a consanguineous Egyptian family with severe cone-rod dystrophy and cataract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The percentage of arCRD cases caused by mutation in ADAM9 remains to be
      determined. Few families are reported in the literature to date; hence
      extensive clinical descriptions of families with ADAM9 mutations are of
      significant importance.
    explanation: Documents the ultra-rare literature base limited to a few reported families.
  - reference: PMID:38892339
    reference_title: "Four Unique Genetic Variants in Three Genes Account for 62.7% of Early-Onset Severe Retinal Dystrophy in Chile: Diagnostic and Therapeutic Consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it complements and reinforces earlier reports, indicating the involvement
      of ADAM9 and RP1 as uncommon causes of LCA/EOSRD
    explanation: Confirms ADAM9 is an uncommon genetic cause within early-onset severe retinal dystrophy cohorts.

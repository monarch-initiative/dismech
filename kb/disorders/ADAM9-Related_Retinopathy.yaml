    cascade molecular testing once familial ADAM9 variants are identified.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38028590
    reference_title: "Four different gene-related cone-rod dystrophy: clinical and genetic findings in six Chinese families with diverse modes of inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This discovery extends the range of pathogenic variants in CORD genes,
      hence offering valuable insights into genetic counseling in families.
    explanation: Molecular identification of causal CORD variants including ADAM9 informs family genetic counseling.
  - reference: PMID:38892339
    reference_title: "Four Unique Genetic Variants in Three Genes Account for 62.7% of Early-Onset Severe Retinal Dystrophy in Chile: Diagnostic and Therapeutic Consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

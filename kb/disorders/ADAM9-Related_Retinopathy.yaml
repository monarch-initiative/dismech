      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cone-rod dystrophy (CRD) is an inherited progressive retinal dystrophy
        affecting the function of cone and rod photoreceptors.
      explanation: Combined degeneration of cone and rod photoreceptors manifests clinically as cone-rod dystrophy.
  - target: Reduced visual acuity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

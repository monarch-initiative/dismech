    explanation: Genetic diagnosis in early-onset retinal dystrophy cohorts (which include ADAM9) supports patient and family counseling.
- name: ADAM9 Gene Augmentation Therapy (Proposed)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Preclinical and conceptual only; no clinical trial or animal rescue study
    has been reported. Because ADAM9-related retinopathy is a recessive
    loss-of-function disorder in which photoreceptors remain structurally and
    functionally preserved early behind compensatory RPE pseudopods, the
    gene-discovery report proposes ADAM9 as a candidate target for gene
    replacement therapy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: ADAM9 Loss of Function
    treatment_effect: RESTORES
    description: Proposed gene replacement would restore functional ADAM9 expression at the RPE-photoreceptor interface prior to photoreceptor degeneration.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Finally, the observation that photoreceptors appear to be intact in the
        early stages of the disease also suggests that ADAM9 may be a valid
        target for gene therapy.
      explanation: Early photoreceptor preservation in the Adam9-null mouse motivates gene replacement targeting ADAM9 loss of function.
  evidence:
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, the observation that photoreceptors appear to be intact in the
      early stages of the disease also suggests that ADAM9 may be a valid
      target for gene therapy.
    explanation: Proposal of ADAM9 gene therapy based on preserved photoreceptors in early-stage disease; no clinical trial has been conducted.
animal_models:
- name: Adam9 knockout mouse
  species: Mus musculus
  genotype: Adam9-/-
  description: >-
    Germline Adam9 null mice, previously reported as asymptomatic, show an
    expanded gap between photoreceptor outer segments and the RPE, reduced rod
    and later cone ERG responses, and progressive photoreceptor degeneration
    with RPE basal deposits and subretinal macrophages at older ages.
  associated_phenotypes:
  - Decreased rod and cone electroretinogram responses
  evidence:
  - reference: PMID:19409519
    reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also found reduced photoreceptor responses in Adam9 knockout mice,
      previously reported to be asymptomatic.
    explanation: Knockout mice have a retinal phenotype.
  modeled_mechanisms:
  - target: RPE Apical Microvillus Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The RPE apical process defect is the earliest lesion in the knockout retina.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Electron microscopy revealed extended malformed, vesiculated RPE apical
        processes
      explanation: Ultrastructural RPE apical defect in knockout mice.
  - target: Progressive Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Rod and cone degeneration develops late in the knockout mouse.
    limitations: >-
      The mouse phenotype is milder and later than the human disease, and the
      mouse retina has no macula, so the macular, cone-dominant human
      presentation is not reproduced.
    evidence:
    - reference: PMID:19409519
      reference_title: Loss of the metalloprotease ADAM9 leads to cone-rod dystrophy in humans and retinal degeneration in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The milder phenotype of Adam9−/− mice is likely to represent the early
        stages of the human disease because of a combination of shorter life
        span, the progressive nature of CORD, and the fact that mice lack a
        macula
      explanation: The authors state the species difference that limits the model.
- name: Glen of Imaal Terrier ADAM9 exon 15-16 deletion (crd3)
  species: Canis lupus familiaris
  genotype: ADAM9 homozygous deletion of exons 15 and 16
  description: >-
    A naturally occurring canine cone-rod dystrophy 3 (also described as
    generalized progressive retinal atrophy) in the Glen of Imaal Terrier, caused
    by a deletion of over 20 kb that removes ADAM9 exons 15 and 16 and
    introduces a premature stop codon. Onset is adult and variable.
  evidence:
  - reference: PMID:20806078
    reference_title: An ADAM9 mutation in canine cone-rod dystrophy 3 establishes homology with human cone-rod dystrophy 9.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sequence analysis identified a large genomic deletion (over 20 kb) that
      removed exons 15 and 16 from the ADAM9 transcript, introduced a premature
      stop
    explanation: Identifies the causal canine ADAM9 allele.
  - reference: PMID:20691256
    reference_title: Generalized progressive retinal atrophy in the Irish Glen of Imaal Terrier is associated with a deletion in the ADAM9 gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A variable and, at times, very late onset of gPRA was confirmed in GITs by
      a relatively mild retinal degeneration at an advanced age.
    explanation: Independent report of the same deletion, with variable late onset.
  modeled_mechanisms:
  - target: RPE Apical Microvillus Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Affected dogs share the RPE apical microvillus lesion of the knockout mouse.
    evidence:
    - reference: PMID:20806078
      reference_title: An ADAM9 mutation in canine cone-rod dystrophy 3 establishes homology with human cone-rod dystrophy 9.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the primary lesion in crd3 appears to be a failure of the apical
        microvilli of the retinal pigment epithelium to appropriately invest
        photoreceptor outer segments
      explanation: Light and electron microscopy of the canine retina.
  - target: Progressive Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Cone dysfunction followed by rod and cone degeneration.
    limitations: >-
      Onset in dogs is adult and variable, later than the childhood onset
      reported in humans.
    evidence:
    - reference: PMID:20806078
      reference_title: An ADAM9 mutation in canine cone-rod dystrophy 3 establishes homology with human cone-rod dystrophy 9.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        by 15 months of age, cone dysfunction is present. Subsequently, both rod
        and cone function degenerate.
      explanation: ERG time course in affected dogs.

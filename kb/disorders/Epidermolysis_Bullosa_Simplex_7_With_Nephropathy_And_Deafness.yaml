    reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "is probably a component of the inner ear"
    explanation: "The only mechanistic statement in the literature about the auditory arm, and the authors hedge it."
  - reference: PMID:35278129
    reference_title: "Basement membrane defects in CD151-associated glomerular disease."
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The extrarenal features, including sensorineural deafness and bullous skin lesions, have not been replicated in knockout mouse models"
    explanation: "Records that the mouse null does not reproduce the deafness, which refutes any claim that the auditory arm is a settled, model-supported mechanism."
  downstream:
  - target: Sensorineural hearing impairment
    description: The clinical auditory phenotype.
    evidence:

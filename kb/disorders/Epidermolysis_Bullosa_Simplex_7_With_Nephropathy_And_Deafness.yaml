discussions:
- discussion_id: cd151_cochlear_mechanism_unmodelled
  status: OPEN
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Cochlear Basement Membrane Involvement
  prompt: >-
    Sensorineural hearing loss is consistent across CD151 probands, but the mouse
    null does not become deaf and no cochlear tissue from a patient or a model has
    been examined. Is the human deafness a direct consequence of CD151 loss in the
    inner ear, and if so which structure fails?
  rationale: >-
    The only mechanistic statement in the literature is the founding paper's hedge
    that CD151 "is probably a component of the inner ear", reasoned backwards from
    the patients' deafness. The one model that could test it is explicitly reported
    as not reproducing the phenotype. So the auditory arm of this disease rests on
    clinical co-occurrence alone, and a reader should not take its presence in the
    pathograph as evidence that the mechanism is known. This is the case
    HUMAN_MODEL_MISMATCH exists for rather than a plain KNOWLEDGE_GAP: evidence in
    the model system exists and is negative.
- discussion_id: cd151_heterozygote_partial_phenotype
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#CD151
  - inheritance#Autosomal recessive
  prompt: >-
    Do heterozygous CD151 carriers have a partial phenotype? Two heterozygous
    sisters in one pedigree had steroid-responsive nephrotic syndrome and hearing
    impairment with low-grade proteinuria, while other heterozygous relatives in the
    same family were asymptomatic.
  rationale: >-
    A single consanguineous family cannot distinguish a genuine carrier phenotype
    from coincidence or from a second segregating variant, and no carrier series has
    been published. It matters practically, because if carriers do have low-grade
    proteinuria then the relatives identified during cascade testing need renal
    follow-up rather than reassurance. The observation is recorded here rather than
    curated as a phenotype so that it is not read as an established feature.
- discussion_id: cd151_epilepsy_and_chloride_transport
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Epidermolysis Bullosa Simplex 7 With Nephropathy And Deafness
  prompt: >-
    Are the epilepsy and the sweat-chloride-positive "atypical cystic fibrosis"
    phenotype reported in one CD151 proband part of the syndrome?
  rationale: >-
    The authors argue they are, on the grounds that CD151 is expressed in the
    nervous system and in bronchial epithelium where CFTR operates, and that an
    extensive workup found no alternative cause. That argument is from tissue
    expression, not from any demonstrated mechanism, and it rests on one patient.
    Until a second proband is reported with either feature it cannot be
    distinguished from comorbidity in a consanguineous pedigree, so neither is
    curated as a phenotype of this disorder.
- discussion_id: cd151_cleavage_plane_unsettled
  status: OPEN
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Keratinocyte Dysadhesion in the Lower Epidermis
  prompt: >-
    Where does the skin split in CD151 disease - intraepidermally, or below the
    epidermis? The two ultrastructural reports disagree.
  rationale: >-
    This matters more than an ultrastructural detail normally would, because the
    cleavage plane is what classifies an epidermolysis bullosa subtype, and it is
    the organising axis of the `dermal_epidermal_junction_adhesion_failure` module
    this entry conforms to.

    PMID:29138120 examined the proband's skin by transmission electron microscopy
    and reports intracellular disruption and cell-cell dysadhesion of keratinocytes
    in the lower epidermis - an intraepidermal plane, which is what classifies the
    disease as an EB simplex. PMID:35519797 reports biopsies showing subepidermal
    separation in its patient, though it notes that neither immunofluorescence
    mapping nor transmission electron microscopy was available there, so the two
    observations are not of equal technical weight.

    Cell biology favours the intraepidermal reading: PMID:31488507 shows that
    keratin-anchored hemidesmosomes form and persist without CD151, so the
    hemidesmosomal plane should not be the one that fails. But that is an argument
    from a cell line, not a second patient biopsy.

    Consequence for this entry: conformance to the module is declared at the
    attachment-defect and loss-of-adhesive-integrity nodes, which hold on either
    reading, and deliberately not at its dermal-epidermal separation node. Settling
    it needs immunofluorescence mapping or electron microscopy on a further
    proband.

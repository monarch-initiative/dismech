name: Epidermolysis Bullosa Simplex 7 With Nephropathy And Deafness
creation_date: "2026-09-21T00:00:00Z"
description: >-
  An autosomal recessive tetraspanin disorder caused by biallelic loss-of-function
  variants in CD151. CD151 is not itself a structural component of the basement
  membrane; it is a lateral organiser that forms very stable complexes with the
  laminin-binding integrins alpha-3/beta-1 and alpha-6/beta-4 and holds those
  receptors in a high-avidity association with their laminin ligands. Losing it
  therefore weakens the same class of cell-matrix adhesion in every tissue whose
  epithelium is anchored that way, which is why one gene produces a three-organ
  syndrome: skin fragility with pretibial blistering, a progressive glomerular
  disease running to nephrotic-range proteinuria and kidney failure, and
  sensorineural hearing loss. Nail dystrophy, dental and hair abnormalities,
  poikiloderma and oesophageal strictures are variably present, and the published
  probands span a wide severity range on the same class of truncating allele.
  The skin lesion is intraepidermal in the lower epidermis rather than a
  hemidesmosomal split, which is why the condition is classified as a syndromic
  epidermolysis bullosa simplex rather than a junctional form.
category: Mendelian
parents:
- Epidermolysis Bullosa Simplex
- Hereditary Nephropathy
disease_term:
  preferred_term: epidermolysis bullosa simplex 7, with nephropathy and deafness
  term:
    id: MONDO:0012190
    label: epidermolysis bullosa simplex 7, with nephropathy and deafness
synonyms:
- EBS7
- nephropathy with pretibial epidermolysis bullosa and deafness
- nephrotic syndrome - deafness - pretibial epidermolysis bullosa syndrome
- CD151 deficiency
- CD151-associated syndromic epidermolysis bullosa simplex
notes: >-
  Entry scope. This entry curates the CD151-related syndrome as a single DISEASE.
  The stub recorded no MONDO descendants, and MONDO carries one causal gene
  relation for MONDO:0012190, to hgnc:1630 CD151 (read from
  stubs/Epidermolysis_Bullosa_Simplex_7_With_Nephropathy_And_Deafness.yaml, which
  `just enrich-stubs` wrote from MONDO). All published probands carry biallelic
  CD151 alleles and share the skin/kidney/inner-ear triad, so there is one
  conserved pathograph here and no case for a GROUPING. No `has_subtypes` rows are
  declared: the reported allele classes are all truncating (frameshift, nonsense
  and a whole-exon-skipping splice allele) and the phenotypic differences between
  probands do not track allele class, so a subtype split would assert a structure
  the literature does not support.

  Severity is genuinely uncoupled from genotype here and that is worth stating
  rather than smoothing over. PMID:38188895 reports a proband homozygous for
  p.Arg165* whose renal disease was detected incidentally on a home dipstick,
  and makes the point explicitly that one genotype gives variable expression;
  PMID:15265795 reports end-stage kidney disease in all three of its probands.
  Both are recorded, and no severity ordering is asserted between them.

  Module conformance: two modules, one per organ arm, plus a correction.

  An earlier draft of this note claimed a module search had been run and had found
  only `podocyte_injury_and_glomerular_filtration_barrier_failure` and
  `epithelial_barrier_dysfunction`. That was false in a way worth recording: no
  module of the first name exists in `kb/modules/` at all, and the real candidates
  were missed. The automated second-opinion comment on the claim issue
  (dismech#12389) named `dermal_epidermal_junction_adhesion_failure` and
  `nephrotic_podocyte_injury`; `ls kb/modules/` confirms both, and both were then
  read in full. This is exactly the failure the `dismech-terms` skill documents at
  step 3a - an unverified justification that tells the next reviewer to skip the
  one check that would catch it - landing on module selection rather than on a
  term binding.

  What was declared, after reading both modules:

  - `dermal_epidermal_junction_adhesion_failure` on the two skin-arm nodes. CD151
    belongs in that module's trigger class: it is a component of the extracellular
    attachment network, not an intracellular filament protein, which is the scope
    boundary that module draws when it excludes KRT5 and KRT14.
  - `nephrotic_podocyte_injury` on the renal node. That module's chain is an
    inherited adhesion or cytoskeletal defect destabilizing the podocyte, giving
    foot-process effacement, barrier breakdown, proteinuria and glomerulosclerosis,
    and every step of it is separately evidenced here.

  Conforming to only one would have asserted that one organ arm is the disease,
  which is what the earlier draft got wrong in substance as well as in provenance.

  One caveat on the skin conformance, recorded in `discussions` rather than
  buried: the module's organising axis is the ultrastructural cleavage plane, and
  in this disease that plane is not settled. PMID:29138120 reports intraepidermal
  keratinocyte dysadhesion in the lower epidermis on electron microscopy, while
  PMID:35519797 reports subepidermal separation on biopsy. Conformance is declared
  at the attachment-defect and loss-of-adhesive-integrity nodes, which hold either
  way, and not at the module's dermal-epidermal separation node, which does not.

  No GeneReviews chapter exists for this disorder. Checked offline with
  `just check-genereviews kb/disorders/Epidermolysis_Bullosa_Simplex_7_With_Nephropathy_And_Deafness.yaml`
  against the committed Bookshelf index; it reports NO_CHAPTER for GeneReviews.
  The phenotype baseline is therefore the primary literature: five published
  probands from four families as of the reports cited here.

  Two claims that appear in the sources were deliberately NOT curated. The
  beta-thalassemia minor and the bilateral cervical ribs reported in the original
  Indian Jewish family (PMID:15265795, restated in PMID:38188895) are
  co-segregating findings in one consanguineous pedigree with no proposed
  mechanistic link to CD151, and are not asserted here as features of the
  syndrome. The "atypical cystic fibrosis" and epilepsy in PMID:35519797 are
  argued by its authors to be part of a unified CD151 process, but that argument
  rests on tissue-expression overlap rather than on any demonstrated mechanism;
  the phenotypes are recorded with that reasoning quoted and marked as a single
  unreplicated observation rather than folded into the pathograph.
references:
- reference: PMID:15265795
  title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
  tags: []
  findings:
  - statement: >-
      The founding report. Three MER2-negative patients of Indian Jewish origin,
      homozygous for a single-nucleotide insertion in CD151 exon 5 truncating the
      protein before its integrin-binding domain, with end-stage kidney disease,
      sensorineural deafness and pretibial epidermolysis bullosa.
- reference: PMID:29138120
  title: "Recessive mutation in tetraspanin CD151 causes Kindler syndrome-like epidermolysis bullosa with multi-systemic manifestations including nephropathy."
  tags: []
  findings:
  - statement: >-
      An independent consanguineous family with a homozygous CD151 donor splice-site
      allele deleting exon 5, complete absence of CD151 protein on the proband's
      skin, and keratinocyte dysadhesion in the lower epidermis on electron
      microscopy. Establishes CD151 as an epidermolysis bullosa gene.
- reference: PMID:35278129
  title: "Basement membrane defects in CD151-associated glomerular disease."
  tags: []
  findings:
  - statement: >-
      A homozygous truncating CD151 variant in a child with nephrotic-range
      proteinuria, with thickened glomerular basement membrane and podocyte
      effacement on biopsy, and a zebrafish CRISPR knockdown in which proteinuria
      was rescued by wild-type but not by variant CD151 mRNA.
- reference: PMID:35519797
  title: "Expanding the spectrum of epidermolysis bullosa simplex: Syndromic epidermolysis bullosa simplex with nephropathy and epilepsy secondary to CD151 tetraspanin defect-a case report and review of the literature."
  tags: []
  findings:
  - statement: >-
      The fifth recorded CD151 proband, homozygous for the nonsense allele
      p.Gln136*, presenting with focal segmental glomerulosclerosis, sensorineural
      hearing loss, pretibial bullae and dental and nail changes, and misdiagnosed
      and immunosuppressed for years as bullous pemphigoid before genetic testing.
- reference: PMID:38188895
  title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
  tags: []
  findings:
  - statement: >-
      A Saudi proband homozygous for p.Arg165* whose proteinuria was an incidental
      finding, reported specifically to document how wide the phenotypic range is
      on a single CD151 genotype.
- reference: PMID:31488507
  title: "Tetraspanin CD151 and integrin α3β1 contribute to the stabilization of integrin α6β4-containing cell-matrix adhesions."
  tags: []
  findings:
  - statement: >-
      Keratinocyte cell-biology showing that CD151 acts through integrin alpha-3/beta-1
      to stabilise a hybrid alpha-6/beta-4 adhesion structure, and that true
      keratin-anchored hemidesmosomes form and persist without CD151 - which is why
      the skin split in this disease is intraepidermal rather than junctional.
- reference: PMID:22338088
  title: "Morphology and migration of podocytes are affected by CD151 levels."
  tags: []
  findings:
  - statement: >-
      Podocyte cell-line work showing that CD151 knockdown reduces beta-1 integrin
      expression and podocyte cell area, giving a cellular mechanism for the
      adhesion failure seen in the patient glomerulus.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CD151 loss-of-function alleles. Every published proband is homozygous,
    and all but one arose in a consanguineous or founder pedigree; no compound
    heterozygote has been reported. Carriers are usually asymptomatic, but the
    recessive label should not be read as strictly all-or-nothing: in the Saudi
    pedigree two heterozygous sisters had partial phenotypes - one steroid-responsive
    nephrotic syndrome, the other hearing impairment with low-grade proteinuria -
    while other heterozygous relatives were unaffected. That is one family and is
    recorded in `discussions` rather than asserted as a general carrier phenotype.
  evidence:
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nephrotic syndrome (NS)-epidermolysis bullosa (EB) sensorineural deafness syndrome is an autosomal recessive rare genetic disease caused by a CD151 gene homozygous mutation on chromosome 11p15.5."
    explanation: "States the inheritance mode and the homozygous CD151 lesion that defines it."
  - reference: PMID:15265795
    reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 patients are homozygous for a single nucleotide insertion (G383) in exon 5 of CD151, causing a frameshift and premature stop signal at codon 140."
    explanation: "The founding pedigree: three affected homozygotes, consistent with recessive inheritance."
pathophysiology:
- name: CD151 Loss of Function
  biological_scale: MOLECULAR
  role: Initiating genetic lesion
  description: >-
    Biallelic CD151 alleles that truncate the protein before or within its large
    extracellular loop. The reported lesions are a frameshifting single-nucleotide
    insertion stopping translation at codon 140, a donor splice-site change that
    removes the whole of exon 5, and the nonsense alleles p.Gln136* and p.Arg165*.
    What they have in common is loss of the integrin-binding region, so the
    resulting protein cannot perform the one function CD151 has in this disease.
  genetic_context:
    gene:
      preferred_term: CD151
      term:
        id: hgnc:1630
        label: CD151
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      All published alleles are truncating and homozygous. No missense or
      hypomorphic allele has been reported, so there is no allelic series here to
      grade severity against.
  genes:
  - preferred_term: CD151
    term:
      id: hgnc:1630
      label: CD151
  evidence:
  - reference: PMID:15265795
    reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resultant truncated protein would lack its integrin-binding domain."
    explanation: "Names the specific functional consequence of the founding allele: loss of the region through which CD151 binds its integrin partners."
  - reference: PMID:29138120
    reference_title: "Recessive mutation in tetraspanin CD151 causes Kindler syndrome-like epidermolysis bullosa with multi-systemic manifestations including nephropathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence of proband's skin and Western blot of skin proteins with a monoclonal antibody revealed complete absence of CD151."
    explanation: "Demonstrates at protein level that the splice allele produces a null, not a reduced-function product."
  downstream:
  - target: Destabilization of Laminin-Binding Integrin Adhesion Complexes
    description: >-
      Without the integrin-binding region there is no lateral organiser to hold the
      laminin-binding integrins in their high-avidity state.
    evidence:
    - reference: PMID:15265795
      reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tetraspanin CD151 forms very stable laminin-binding complexes with integrins alpha3beta1 and alpha6beta1 in kidney and alpha3beta1 and alpha6beta4 in skin."
      explanation: "Identifies the complexes that the truncated protein can no longer form, in exactly the two tissues this disease affects."
- name: Destabilization of Laminin-Binding Integrin Adhesion Complexes
  biological_scale: MOLECULAR
  conforms_to: "dermal_epidermal_junction_adhesion_failure#Basement Membrane Zone Attachment Component Defect"
  role: Shared molecular lesion upstream of all three organ arms
  description: >-
    CD151 normally clusters integrin alpha-3/beta-1 and alpha-6/beta-4 laterally
    and stabilises their engagement with laminin in the underlying basement
    membrane. In its absence the receptors are still expressed but the adhesion
    they mediate is weaker and less persistent. This single molecular failure is
    what makes the disorder multi-organ: the same integrin-laminin axis anchors
    basal keratinocytes to laminin-332 in skin and podocytes to laminin-521 in the
    glomerulus.
  molecular_functions:
  - preferred_term: laminin binding by the CD151-integrin complex
    term:
      id: GO:0043236
      label: laminin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: integrin-mediated cell-matrix adhesion
    term:
      id: GO:0033627
      label: cell adhesion mediated by integrin
    modifier: DECREASED
  evidence:
  - reference: PMID:31488507
    reference_title: "Tetraspanin CD151 and integrin α3β1 contribute to the stabilization of integrin α6β4-containing cell-matrix adhesions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "We show that CD151, through binding to integrin α3β1, plays a critical role in the stabilization of an adhesion structure with a distinct molecular composition of hemidesmosomes with tetraspanin features."
    explanation: "Direct cell-biological demonstration that CD151 works by stabilising a laminin-binding integrin adhesion, which is the lesion this node asserts."
  - reference: PMID:35278129
    reference_title: "Basement membrane defects in CD151-associated glomerular disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "CD151 interacts with the laminin–integrin–actin axis, specifically via integrin α3β1, increasing the strength of integrin-dependent adhesion of the podocyte to laminin-521 in the GBM."
    explanation: "States the same mechanism on the renal side, naming the specific laminin isoform the podocyte binds."
  downstream:
  - target: Keratinocyte Dysadhesion in the Lower Epidermis
    description: Loss of the stabilised adhesion in basal and immediately suprabasal keratinocytes.
    evidence:
    - reference: PMID:29138120
      reference_title: "Recessive mutation in tetraspanin CD151 causes Kindler syndrome-like epidermolysis bullosa with multi-systemic manifestations including nephropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transmission electron microscopy showed intracellular disruption and cell-cell dysadhesion of keratinocytes in the lower epidermis."
      explanation: "Locates the adhesion failure in the patient's own skin, at the level this edge asserts."
  - target: Glomerular Basement Membrane Disorganization
    description: >-
      Loss of podocyte-GBM adhesion under the mechanical load of filtration, with
      secondary structural change in the membrane itself.
    evidence:
    - reference: PMID:15265795
      reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We conclude that CD151 is essential for the proper assembly of the glomerular and tubular basement membrane in kidney, has functional significance in the skin, is probably a component of the inner ear, and could play a role in erythropoiesis."
      explanation: "The founding paper's own conclusion that the renal basement membrane is a direct target of CD151 loss."
  - target: Cochlear Basement Membrane Involvement
    description: >-
      The inner-ear arm. Note the founding paper states this as an inference from
      the clinical phenotype rather than from direct cochlear study.
    evidence:
    - reference: PMID:15265795
      reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "is probably a component of the inner ear"
      explanation: "The authors' own hedged inference. Graded INDIRECT because the claim is reasoned back from the deafness in their patients, not from cochlear tissue."
- name: Keratinocyte Dysadhesion in the Lower Epidermis
  biological_scale: CELLULAR
  conforms_to: "dermal_epidermal_junction_adhesion_failure#Loss of Adhesive Integrity at a Defined Cleavage Plane"
  role: Cutaneous arm
  description: >-
    Basal and lower-epidermal keratinocytes separate from one another and from the
    matrix under minor mechanical stress. The split is intraepidermal, which is what
    classifies this as an epidermolysis bullosa simplex rather than a junctional
    form, and it sits alongside intact keratin-anchored hemidesmosomes - cell-biology
    work shows those form and persist without CD151.
  cell_types:
  - preferred_term: basal keratinocyte of the epidermis
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: keratinocyte cell-matrix adhesion
    term:
      id: GO:0007160
      label: cell-matrix adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:29138120
    reference_title: "Recessive mutation in tetraspanin CD151 causes Kindler syndrome-like epidermolysis bullosa with multi-systemic manifestations including nephropathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transmission electron microscopy showed intracellular disruption and cell-cell dysadhesion of keratinocytes in the lower epidermis."
    explanation: "Ultrastructural evidence from patient skin for the cellular lesion this node names."
  - reference: PMID:31488507
    reference_title: "Tetraspanin CD151 and integrin α3β1 contribute to the stabilization of integrin α6β4-containing cell-matrix adhesions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In contrast, hemidesmosomes, keratin filament-associated adhesions that contain integrin α6β4, plectin, BP180 (encoded by COL17A1) and BP230 (encoded by DST), do not require CD151 for their formation or maintenance."
    explanation: "Explains why the cleavage plane is intraepidermal rather than at the hemidesmosome: CD151 is not needed to build a hemidesmosome."
  downstream:
  - target: Pretibial blistering
    description: The clinical blistering that follows loss of keratinocyte adhesion.
    evidence:
    - reference: PMID:15265795
      reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition to hereditary nephritis the sibs have sensorineural deafness, pretibial epidermolysis bullosa, and beta-thalassemia minor."
      explanation: "Records the pretibial distribution of the blistering in the founding pedigree."
- name: Glomerular Basement Membrane Disorganization
  biological_scale: TISSUE
  conforms_to: "nephrotic_podocyte_injury#Podocyte Injury"
  role: Renal arm
  description: >-
    Podocyte attachment to the glomerular basement membrane is under continuous
    mechanical load during filtration, so a weakened integrin-laminin bond has
    structural consequences here that it does not have in quieter tissues. Patient
    biopsies show a thickened, disorganised GBM with podocyte foot-process
    effacement - the classical substrate of a glomerular protein leak.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  locations:
  - preferred_term: glomerular basement membrane
    term:
      id: UBERON:0005777
      label: glomerular basement membrane
  biological_processes:
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: DECREASED
  evidence:
  - reference: PMID:35278129
    reference_title: "Basement membrane defects in CD151-associated glomerular disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy imaging of patient kidney tissue showed thickening of GBM and podocyte effacement."
    explanation: "Direct ultrastructural observation in a CD151 patient of the tissue lesion this node asserts."
  - reference: PMID:22338088
    reference_title: "Morphology and migration of podocytes are affected by CD151 levels."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "CD151 knockdown in podocytes reduced β(1)-integrin expression and podocyte cell area, indicating diminished adherence and/or spreading."
    explanation: "Gives the cellular mechanism behind the tissue lesion. INDIRECT because it is a knockdown in a mouse podocyte line, not the patient's glomerulus."
  downstream:
  - target: Nephrotic range proteinuria
    description: Filtration-barrier failure following podocyte detachment and GBM disorganization.
    evidence:
    - reference: PMID:35278129
      reference_title: "Basement membrane defects in CD151-associated glomerular disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Through targeted NGS, a novel, homozygous truncating variant was identified in CD151, a gene rarely reported in patients with nephrotic syndrome."
      explanation: "Links the CD151 lesion to nephrotic-range protein loss in a patient."
  - target: Focal segmental glomerulosclerosis
    description: The sclerosing response that follows sustained podocyte loss.
    evidence:
    - reference: PMID:35519797
      reference_title: "Expanding the spectrum of epidermolysis bullosa simplex: Syndromic epidermolysis bullosa simplex with nephropathy and epilepsy secondary to CD151 tetraspanin defect-a case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "chronic kidney disease secondary to nephrotic syndrome from focal segmental glomerular sclerosis"
      explanation: "Records FSGS as the renal histology in a CD151 proband."
- name: Cochlear Basement Membrane Involvement
  biological_scale: TISSUE
  role: Auditory arm
  description: >-
    The least directly evidenced arm of the disease. Sensorineural hearing loss is
    consistent across probands, and CD151 is inferred to be a component of the
    inner ear, but no human or model cochlear tissue study has been reported, and
    the Cd151 knockout mouse does not reproduce the deafness. This node is curated
    because the phenotype is consistent and needs somewhere to attach, not because
    the mechanism is established.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  evidence:

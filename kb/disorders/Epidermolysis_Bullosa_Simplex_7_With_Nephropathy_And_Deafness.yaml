genetic:
- name: CD151
  gene_term:
    preferred_term: CD151
    term:
      id: hgnc:1630
      label: CD151
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic truncating alleles (frameshift, nonsense, and a donor splice-site allele deleting exon 5)
  presence: Positive
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    CD151 is at 11p15.5 and also carries the MER2 antigen of the Raph blood group,
    so CD151-null individuals type MER2-negative. That is how the founding family
    was ascertained - through a blood-group discrepancy, not through the skin or
    kidney disease - and it remains a usable confirmatory test. No constraint
    metrics were consulted for this entry and none is claimed.
  evidence:
  - reference: PMID:15265795
    reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 patients are homozygous for a single nucleotide insertion (G383) in exon 5 of CD151, causing a frameshift and premature stop signal at codon 140."
    explanation: "Establishes CD151 as the causative gene and gives the founding truncating allele."
  - reference: PMID:29138120
    reference_title: "Recessive mutation in tetraspanin CD151 causes Kindler syndrome-like epidermolysis bullosa with multi-systemic manifestations including nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one family, a homozygous donor splice site mutation in CD151 (NM_139029; c.351+2T>C) at the exon 5/intron 5 border was identified, and RT-PCR and whole transcriptome analysis by RNA-seq confirmed deletion of the entire exon 5 encoding 25 amino acids."
    explanation: "An independent allele class - a splice-site change causing exon skipping - confirming the gene in a second family."
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing results indicated a homozygous pathogenic variant identified in the CD151 gene (c.493C>T p.(Arg165*), which was consistent with a genetic diagnosis of autosomal recessive nephropathy with pretibial EB and deafness syndrome."
    explanation: "A third independent family and a third truncating allele."
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    The diagnosis is molecular. In practice it has been reached by an
    epidermolysis-bullosa gene panel, by targeted next-generation sequencing from a
    nephrology direction, and by whole genome sequencing - which route depends
    entirely on which specialty the patient reaches first. That is the core
    diagnostic problem in this disease: dermatology, nephrology and audiology each
    see a plausible isolated condition.
  diagnosis_term:
    preferred_term: next-generation sequencing gene panel
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:29138120
    reference_title: "Recessive mutation in tetraspanin CD151 causes Kindler syndrome-like epidermolysis bullosa with multi-systemic manifestations including nephropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have developed a next-generation sequencing (NGS) panel targeting genes known to be mutated in skin fragility disorders, including tetraspanin CD151 expressed in keratinocytes at the dermal-epidermal junction."
    explanation: "The skin-fragility panel route to the diagnosis."
  - reference: PMID:35278129
    reference_title: "Basement membrane defects in CD151-associated glomerular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite this, CD151 is not routinely screened for in patients with nephrotic-range proteinuria."
    explanation: "States the diagnostic gap from the nephrology side, which is why proteinuric patients are missed."
- name: MER2 Blood Group Phenotyping
  description: >-
    CD151 carries the MER2 antigen, so loss of CD151 makes red cells MER2-negative.
    Absent immunoreactivity to anti-CD151/MER2 on patient erythrocytes has been used
    as a confirmatory assay, and MER2-negativity is what identified the founding
    family in the first place. It is a cheap orthogonal check on a novel variant.
  diagnosis_term:
    preferred_term: MER2/CD151 erythrocyte antigen phenotyping
    term:
      id: NCIT:C210738
      label: Blood Typing Test
  evidence:
  - reference: PMID:35278129
    reference_title: "Basement membrane defects in CD151-associated glomerular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence of patient kidney tissue demonstrated that CD151 was significantly reduced, and we did not detect immunoreactivity to CD151/MER2 on patient red blood cells."
    explanation: "Records the MER2 red-cell assay being used as a confirmatory test in a patient."
  - reference: PMID:15265795
    reference_title: "CD151, the first member of the tetraspanin (TM4) superfamily detected on erythrocytes, is essential for the correct assembly of human basement membranes in kidney and skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that CD151 expresses the MER2 blood group antigen and is located on erythrocytes."
    explanation: "Establishes the biological basis of the blood-group test."
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists. The literature is a
    small number of case reports: PMID:35519797 describes its patient as "the fifth
    recorded case of EBS with nephropathy in relation to CD151 defects", and
    PMID:38188895 and PMID:35278129 add further probands after that. The count is
    recorded as a literature count rather than converted into a rate, because no
    denominator is available.
  evidence:
  - reference: PMID:35519797
    reference_title: "Expanding the spectrum of epidermolysis bullosa simplex: Syndromic epidermolysis bullosa simplex with nephropathy and epilepsy secondary to CD151 tetraspanin defect-a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the fifth recorded case of EBS with nephropathy in relation to CD151 defects and, to our knowledge, the first case to be reported with neurologic and chloride transport complications."
    explanation: "The only published count of reported cases, and the basis for the ULTRA_RARE band."
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nephrotic syndrome (NS)-epidermolysis bullosa (EB) sensorineural deafness syndrome is an autosomal recessive rare genetic disease caused by a CD151 gene homozygous mutation on chromosome 11p15.5."
    explanation: "Characterises the condition as rare; supports the band without supplying a rate."
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The renal arm dominates prognosis and is what makes the burden variable rather
    than uniformly high. All three probands in the founding pedigree reached
    end-stage kidney disease and two were on peritoneal dialysis; the Saudi proband
    reported eighteen years later had proteinuria detected incidentally at home and
    was managed on an oral ACE inhibitor. The skin disease is a lifelong dressing
    and wound-care burden but is not by itself life-limiting. Nothing in the cited
    sources characterises survival for the condition as a whole, so no mortality
    claim is made.
  evidence:
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Both siblings had hereditary nephritis, pre-tibial EB, and beta-thalassemia minor with nephrotic range proteinuria and ESRD and were on peritoneal dialysis."
    explanation: "The severe end of the range - dialysis-dependent renal failure. Marked BACKGROUND because this case report is summarising the earlier pedigree, not its own patient."
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings emphasize that even a single genotype can result in variable phenotypic expression, necessitating the assessment of the pleiotropic effects of the disease on the patient, which can range from severe to mild."
    explanation: "The authors' own statement that severity ranges from severe to mild, which is what VARIABLE encodes."
treatments:
- name: Renin-Angiotensin System Blockade
  description: >-
    An oral ACE inhibitor is the reported pharmacological management of the
    proteinuria. In the one patient followed longitudinally, proteinuria resolved
    and then relapsed in step with adherence to lisinopril, which is about as close
    to a within-patient control as this literature offers. The proposed mechanism -
    lowering intraglomerular pressure and so the mechanical load on an
    adhesion-compromised capillary wall - fits the pathophysiology directly, and is
    supported in the Cd151-null mouse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lisinopril
      term:
        id: CHEBI:43755
        label: lisinopril
  target_mechanisms:
  - target: Glomerular Basement Membrane Disorganization
    description: >-
      Reduces intraglomerular pressure, lowering the mechanical demand on a
      podocyte-GBM attachment that CD151 loss has already weakened.
    evidence:
    - reference: PMID:35278129
      reference_title: "Basement membrane defects in CD151-associated glomerular disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "This was alleviated with angiotensin-converting enzyme inhibitors, which may act by reducing the mechanical load on the capillary wall by decreasing intraglomerular pressure [9, 10]."
      explanation: "Gives the proposed mechanism and the mouse result behind it. INDIRECT and MODEL_ORGANISM because the observation is in Cd151-knockout mice, and the mechanism is offered as a possibility by the authors."
  evidence:
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had relapses of proteinuria that are most likely explained by poor compliance with Lisinopril."
    explanation: "Proteinuria tracking adherence in a CD151 patient is the strongest human evidence available that the drug is doing something here."
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was kept on PO Lisinopril with follow-up visits."
    explanation: "Records the specific agent and route used in long-term management."
- name: Wound Care and Withdrawal of Immunosuppression
  description: >-
    Skin management is non-adherent dressings, protection and nutrition. The
    substantive therapeutic finding in this disease is a negative one: because the
    blistering is often mistaken for an acquired autoimmune blistering disease,
    patients are treated with immunosuppressants that cannot work on a structural
    adhesion defect. One proband had years of topical and systemic corticosteroids,
    minocycline, nicotinamide, mycophenolate mofetil and methotrexate with no
    benefit, and improved substantially once they were all withdrawn in favour of
    skin care. Stopping the wrong treatment is the actionable consequence of making
    the genetic diagnosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: wound care management
    term:
      id: NCIT:C116681
      label: Wound Care Management
  target_mechanisms:
  - target: Keratinocyte Dysadhesion in the Lower Epidermis
    description: >-
      Protective and mechanical, not mechanistic: dressings reduce the shear that
      separates keratinocytes, they do not restore the adhesion complex.
    evidence:
    - reference: PMID:35519797
      reference_title: "Expanding the spectrum of epidermolysis bullosa simplex: Syndromic epidermolysis bullosa simplex with nephropathy and epilepsy secondary to CD151 tetraspanin defect-a case report and review of the literature."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The blisters substantially improved with this regimen, and she was referred to a multidisciplinary EB clinic for further evaluation and treatment."
      explanation: "Records improvement on skin care after immunosuppression was withdrawn. INDIRECT for the mechanism: an uncontrolled single-patient observation with two simultaneous changes."
  evidence:
  - reference: PMID:35519797
    reference_title: "Expanding the spectrum of epidermolysis bullosa simplex: Syndromic epidermolysis bullosa simplex with nephropathy and epilepsy secondary to CD151 tetraspanin defect-a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was tapered off of all forms of immunosuppressants, with a care plan that was shifted to careful skin care, nutrition, and ocular health."
    explanation: "The management change itself: immunosuppression withdrawn, supportive skin care substituted."
  - reference: PMID:35519797
    reference_title: "Expanding the spectrum of epidermolysis bullosa simplex: Syndromic epidermolysis bullosa simplex with nephropathy and epilepsy secondary to CD151 tetraspanin defect-a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had trialed topical corticosteroids, minocycline, nicotinamide, mycophenolate mofetil, methotrexate, and protracted courses of systemic corticosteroids with negligible therapeutic benefit prior to this visit."
    explanation: "Documents the failed immunosuppressive regimens, which is what makes withdrawal the right move rather than merely a neutral one."
- name: Renal Replacement Therapy
  description: >-
    Dialysis for those who reach end-stage kidney disease. Peritoneal dialysis is
    what is recorded for the founding siblings. No transplant outcome has been
    reported for this disorder, so nothing is asserted here about whether the
    disease recurs in a graft - which, given that the lesion is in the recipient's
    podocytes and not circulating, would be worth knowing.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: peritoneal dialysis
    term:
      id: NCIT:C15221
      label: Dialysis
  evidence:
  - reference: PMID:38188895
    reference_title: "Nephrotic syndrome: Pretibial epidermolysis bullosa in a patient with CD151 tetraspanin defect: A case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Both siblings had hereditary nephritis, pre-tibial EB, and beta-thalassemia minor with nephrotic range proteinuria and ESRD and were on peritoneal dialysis."
    explanation: "The only record of renal replacement therapy in this disorder. Marked BACKGROUND: the citing case report is restating the earlier pedigree's course, not reporting its own."
animal_models:
- name: Cd151-null mouse
  species: Mouse
  genotype: Cd151 global knockout
  publication: PMID:35278129
  description: >-
    The mammalian null. Its behaviour is strain-dependent in a way that matters for
    interpretation: on the FVB background it develops early massive proteinuria with
    focal segmental glomerulosclerosis and kidney failure, while on C57BL/6 there is
    no spontaneous kidney phenotype at all and proteinuria appears only with
    hypertension. Neither background reproduces the deafness or the skin blistering.
  modeled_mechanisms:
  - target: Glomerular Basement Membrane Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the renal arm on a permissive background, including the FSGS
      endpoint seen in patients.
    limitations: >-
      The phenotype depends on strain background rather than on the lesion, so the
      model reports genetic modifiers as much as it reports CD151. It also covers
      only one of the three affected organs.
    evidence:
    - reference: PMID:35278129
      reference_title: "Basement membrane defects in CD151-associated glomerular disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Global deletion of CD151 in mouse models on the FVB background exhibits early, massive proteinuria with associated focal segmental glomerulosclerosis (FSGS) and subsequent kidney failure [7, 8]."
      explanation: "The renal phenotype of the mouse null on the permissive background."
  - target: Cochlear Basement Membrane Involvement
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The mouse null is deliberately recorded as a negative for the extrarenal arms.
      This is the structural reason the auditory mechanism in this disease is

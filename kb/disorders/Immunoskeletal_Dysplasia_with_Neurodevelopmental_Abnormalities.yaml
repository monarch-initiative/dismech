treatments:
- name: Cervical Decompression Surgery
  description: >
    Decompression of the craniovertebral junction — typically C1-arch excision —
    for cord compression or cervical instability. This is the highest-yield
    intervention in ISDNA: early detection followed by surgery is explicitly
    identified as the key to good neurological prognosis, and multiple reported
    patients underwent it in infancy with good outcome.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  target_mechanisms:
  - target: Cervical Cord Compression
    treatment_effect: INHIBITS
    description: >-
      Surgical decompression relieves the mechanical compression of the cervical
      cord produced by odontoid hypoplasia and canal stenosis.
    evidence:
    - reference: PMID:28331220
      reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She received an excision of the C1 arch for the cord compression with good
        outcome.
      explanation: >-
        Documents the decompressive procedure acting on this mechanism node with a
        good clinical outcome.
  evidence:

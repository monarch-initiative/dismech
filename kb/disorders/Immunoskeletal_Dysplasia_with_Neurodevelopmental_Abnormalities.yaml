inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    ISDNA follows autosomal recessive inheritance. All reported disease alleles
    are germline missense variants carried in the homozygous state, with
    heterozygous unaffected parents confirmed by Sanger sequencing.
    Consanguinity contributed to ascertainment in several families but is not
    obligatory; the recurrent c.953C>T (p.Pro318Leu) allele lies in a shared
    homozygous stretch on chromosome 8, suggesting a common founder.
  evidence:
  - reference: PMID:38010033
    reference_title: "Immune skeletal dysplasia with neurodevelopmental abnormalities caused by a novel variant of EXTL3 gene in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune skeletal dysplasia with neurodevelopmental abnormalities (ISDNA) is
      an extremely rare, autosomal recessive genetic disorder characterized by
      various skeletal abnormalities, neurodevelopmental deficits, and abnormal
      immune system function.
    explanation: >-
      States the autosomal recessive mode of inheritance and the three-system
      clinical definition of ISDNA.
  - reference: PMID:28132690
    reference_title: "Mutations in EXTL3 Cause Neuro-immuno-skeletal Dysplasia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By whole-exome sequencing, we identified homozygous missense mutations
      c.1382C>T, c.1537C>T, c.1970A>G, and c.2008T>G in EXTL3 in nine affected
      individuals from five unrelated families.
    explanation: >-
      Documents homozygous (biallelic) missense variants segregating in multiple
      unrelated families, consistent with recessive inheritance.

name: Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
description: >
  Immunoskeletal dysplasia with neurodevelopmental abnormalities (ISDNA; also
  called neuro-immuno-skeletal dysplasia syndrome, or EXTL3-deficient
  spondyloepimetaphyseal dysplasia) is an ultra-rare autosomal recessive
  disorder caused by biallelic missense variants in EXTL3, which encodes the
  N-acetylglucosaminyltransferase that initiates and elongates heparan sulfate
  (HS) chains on proteoglycan core proteins. Hypomorphic EXTL3 alleles reduce
  glycosyltransferase activity and yield structurally aberrant HS — longer
  chains with an abnormal sulfation pattern — rather than simple absence of HS.
  Because HS proteoglycans act as co-receptors that spatially tune morphogen
  and cytokine signaling, the biochemical defect is transduced in
  tissue-specific and opposite directions: FGF2-ERK signaling is potentiated in
  fibroblasts (driving the skeletal dysplasia, whose radiographic appearance
  mimics FGFR3-related dysplasia), while IL-2/IL-7-driven STAT5 phosphorylation
  in lymphocytes is markedly reduced. The clinical result is a triad spanning
  three organ systems: a spondyloepimetaphyseal dysplasia with severe
  platyspondyly, brachydactyly, and craniovertebral-junction stenosis that
  frequently requires early decompression; a highly variable T-cell-predominant
  immunodeficiency ranging from mild T-cell lymphopenia to Omenn-like severe
  combined immunodeficiency; and neurodevelopmental impairment. Hepatic and
  renal cysts are a recurrent extra-triad feature. Immunological severity is
  strikingly discordant even between individuals homozygous for the same
  allele, implying unidentified modifiers. Roughly 16 individuals have been
  reported; about a third of the reviewed cohort died before one year of age,
  chiefly from infection.

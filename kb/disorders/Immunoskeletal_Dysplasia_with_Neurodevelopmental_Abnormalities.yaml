    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She received an excision of the C1 arch for the cord compression with good
      outcome.
    explanation: Documents C1-arch excision with good outcome for cord compression.
  - reference: PMID:28331220

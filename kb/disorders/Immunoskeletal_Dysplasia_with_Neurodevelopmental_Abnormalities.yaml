- name: Impaired Cytokine-STAT5 Signaling
  biological_scale: CELLULAR
  description: >
    In the lymphoid compartment the same HS defect acts in the opposite
    direction. HS modulates responses to IL-2 and IL-7, the cytokines that drive
    T-cell survival and homeostatic expansion; patient lymphocytes show markedly
    reduced STAT5 phosphorylation after IL-2 stimulation, with a subtler defect
    after IL-7. This opposite-direction transduction of one biochemical lesion
    is the mechanistic core of the multisystem character of the disease.

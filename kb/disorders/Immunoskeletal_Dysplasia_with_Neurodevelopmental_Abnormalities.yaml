- name: Impaired Thymopoiesis and Progenitor Expansion
  biological_scale: CELLULAR
  description: >
    The immunodeficiency has both hematopoietic-intrinsic and thymic-stromal
    components. EXTL3 is most abundant in hematopoietic stem cells and early
    progenitor T cells, and patient-derived iPSCs show reduced expansion of
    lymphohematopoietic progenitors together with defective differentiation of
    thymic epithelial progenitors (reduced TBX1, EYA1, and CK5 with persistent
    SOX17). extl3-mutant zebrafish crossed to a rag2:GFP thymic reporter show
    roughly halved thymic volume, rescued by injection of wild-type human EXTL3
    RNA. Because the thymic stroma is itself affected, hematopoietic stem cell
    transplantation cannot be assumed to correct the whole immune phenotype.

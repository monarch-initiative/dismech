diagnosis:
- name: Molecular confirmation by exome or genome sequencing
  description: >
    There are no formal consensus diagnostic criteria. Diagnosis rests on
    molecular confirmation of biallelic EXTL3 variants, typically by trio exome
    or genome sequencing (or a skeletal-dysplasia / inborn-error-of-immunity
    panel containing EXTL3), with familial segregation confirmed by Sanger
    sequencing. Because the radiographic phenotype overlaps several
    morphologically similar spondyloepimetaphyseal dysplasias, sequencing is
    what discriminates the entity rather than imaging alone.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing analysis revealed the presence of a homozygous
      known pathogenic variant c.953C > T (p. Pro318Leu) in exon 3 of the EXTL3
      gene, thereby confirming diagnosis of ISDNA.
    explanation: >-
      Exome sequencing is the confirmatory test that establishes the diagnosis.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By Sanger sequencing, we confirmed that the variant was heterozygous in
      their parents in both families
    explanation: >-
      Parental Sanger confirmation is the segregation step supporting a
      recessive molecular diagnosis.
- name: Craniovertebral junction imaging for cord compression
  description: >
    Cervical imaging is the single most consequential investigation in this
    disorder, because craniovertebral junction stenosis with cord compression is
    common, is the main actionable complication, and is surgically correctable
    with good outcome when detected early. Both MRI and CT have been used to
    demonstrate canal stenosis, odontoid and C1-arch hypoplasia, and cord
    impingement. This is also the basis for avoiding unassessed neck
    manipulation or positioning in an affected child.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging revealed canal stenosis and cord compression at
      the cranio-vertebral junction
    explanation: >-
      MRI is the modality that demonstrates the actionable craniovertebral
      lesion.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complication should be recognized because its early detection followed
      by appropriate surgical treatment is a key to good prognosis.
    explanation: >-
      States explicitly that early detection of cord compression determines
      prognosis, which is the rationale for making this imaging a priority.
- name: Skeletal survey
  description: >
    A radiographic skeletal survey establishes the spondyloepimetaphyseal
    pattern — severe platyspondyly with increased intervertebral spaces,
    metaphyseal broadening, pelvic distortion with narrow sacroischiatic
    notches, and brachydactyly — which is what raises the diagnosis
    pre-molecularly.
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her skeletal survey showed broad thorax, severe platyspondyly with
      thoracolumbar kyphosis, broad ilia with short greater notches, and broad
      ischia and pubes as well as metaphyseal broadening of the long tubular
      bones and severe brachydactyly
    explanation: >-
      Enumerates the radiographic pattern the skeletal survey is performed to
      detect.
- name: Immunological evaluation and newborn TREC screening
  description: >
    Because immunodeficiency is present in most but not all reported patients
    and is not predicted by genotype, immune evaluation is required in every
    affected individual rather than only in those with infections. Assessment
    covers lymphocyte subsets, immunoglobulins, and T-cell receptor excision
    circles (TRECs). Severe cases are detectable by routine newborn SCID
    screening, which has already ascertained at least one patient before the
    onset of infection.
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was ascertained after positive newborn screening for SCID (T cell
      excision circles, TRECs of 12/µL blood, with the normal range being
      >25/µL; control actin copy number was normal).
    explanation: >-
      Documents ascertainment of an affected infant through the standard newborn
      TREC screen.
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this study expands the number of SCID-related disorders that can be
      identified with newborn screening.
    explanation: >-
      The authors position ISDNA as newborn-screening-detectable, supporting
      TREC screening as a case-finding route.
- name: Visceral and cardiac surveillance imaging
  description: >
    Hepatic (and less often renal) cysts are a recurrent extra-triad feature
    detectable on abdominal ultrasonography, sometimes prenatally; because they
    are unusual in infants they also serve as a diagnostic clue. Echocardiography
    has disclosed structural cardiac findings in individual patients.
  diagnosis_term:
    preferred_term: ultrasonography procedure
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abdominal ultrasonography demonstrated enlarged liver with a few cystic
      lesions.
    explanation: Ultrasonography is the modality detecting the hepatic cysts.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of its rarity in infants, the association of the liver cyst seems
      not fortuitous
    explanation: >-
      Supports treating infantile hepatic cysts as a diagnostically meaningful
      clue rather than an incidental finding.
- name: Normal mucopolysaccharidosis screening does not exclude the diagnosis
  description: >
    A practically important negative: urinary glycosaminoglycan screening and
    leukocyte lysosomal enzyme assays — the standard first-line tests when a
    storage disorder is suspected from coarse features and dysostosis — are
    normal in ISDNA. A normal MPS screen therefore does not exclude EXTL3
    deficiency, and the disaccharide-resolved serum/urine signature recorded in
    the biochemical section is a different assay from this bulk screen.
  diagnosis_term:
    preferred_term: urinary GAG and leukocyte lysosomal enzyme screening
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory examination, urine GAG screening and leukocyte lysosomal enzyme
      screening were normal.
    explanation: >-
      Documents that routine storage-disorder screening is normal, so it cannot
      be used to rule the diagnosis out.
differential_diagnoses:
- name: Other immuno-osseous dysplasias
  description: >
    The closest differential is the small group of disorders combining skeletal
    dysplasia with immune dysfunction — collectively termed immune-osseous
    dysplasias. These are distinguished from ISDNA by their causal genes, which
    is why molecular testing rather than radiography resolves the differential.
  distinguishing_features:
  - >-
    Schimke immuno-osseous dysplasia is caused by SMARCAL1, cartilage-hair
    hypoplasia by RMRP, and spondyloenchondrodysplasia with immune dysregulation
    by ACP5, whereas ISDNA is caused by biallelic EXTL3 variants.
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The list includes Schimke immuno-osseous dysplasia (MIM 242900),
      cartilage–hair hypoplasia (MIM 250250) and spondyloenchondrodysplasia with
      immune dysregulation (MIM 607944), which are caused by mutations in
      SMARCAL1 (MIM 606622), RMRP (MIM 157660) and ACP5 (MIM 171640),
      respectively.
    explanation: >-
      Names the immune-osseous dysplasia differentials and their distinct causal
      genes.
- name: Morphologically similar spondyloepimetaphyseal dysplasias
  description: >
    Before molecular testing, ISDNA is readily mistaken for other severe SEMDs —
    particularly opsismodysplasia and odontochondrodysplasia — because all share
    non-lethality, extreme platyspondyly, and severe brachydactyly. The source
    describes this overlap as a recognised cause of nosological confusion and
    misdiagnosis.
  distinguishing_features:
  - >-
    Distinguished by identification of biallelic EXTL3 variants; the known
    causal genes of the mimicking SEMDs were excluded in the reported patients.
  evidence:
  - reference: PMID:28331220

name: Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
description: >
  Immunoskeletal dysplasia with neurodevelopmental abnormalities (ISDNA; also
  called neuro-immuno-skeletal dysplasia syndrome, or EXTL3-deficient
  spondyloepimetaphyseal dysplasia) is an ultra-rare autosomal recessive
  disorder caused by biallelic missense variants in EXTL3, which encodes the
  N-acetylglucosaminyltransferase that initiates and elongates heparan sulfate
  (HS) chains on proteoglycan core proteins. Hypomorphic EXTL3 alleles reduce
  glycosyltransferase activity and yield structurally aberrant HS — longer
  chains with an abnormal sulfation pattern — rather than simple absence of HS.
  Because HS proteoglycans act as co-receptors that spatially tune morphogen
  and cytokine signaling, the biochemical defect is transduced in
  tissue-specific and opposite directions: FGF2-ERK signaling is potentiated in
  fibroblasts (driving the skeletal dysplasia, whose radiographic appearance
  mimics FGFR3-related dysplasia), while IL-2/IL-7-driven STAT5 phosphorylation
  in lymphocytes is markedly reduced. The clinical result is a triad spanning
  three organ systems: a spondyloepimetaphyseal dysplasia with severe
  platyspondyly, brachydactyly, and craniovertebral-junction stenosis that
  frequently requires early decompression; a highly variable T-cell-predominant
  immunodeficiency ranging from mild T-cell lymphopenia to Omenn-like severe
  combined immunodeficiency; and neurodevelopmental impairment. Hepatic and
  renal cysts are a recurrent extra-triad feature. Immunological severity is
  strikingly discordant even between individuals homozygous for the same
  allele, implying unidentified modifiers. Roughly 16 individuals have been
  reported; about a third of the reviewed cohort died before one year of age,
  chiefly from infection.
disease_term:
  preferred_term: immunoskeletal dysplasia with neurodevelopmental abnormalities
  term:
    id: MONDO:0044312
    label: immunoskeletal dysplasia with neurodevelopmental abnormalities
synonyms:
- ISDNA
- Neuro-immuno-skeletal dysplasia syndrome
- Spondyloepimetaphyseal dysplasia with immune deficiency, EXTL3 type
- EXTL3-deficient spondyloepimetaphyseal dysplasia
parents:
- Skeletal Dysplasia
- Combined Immunodeficiency
classifications:
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      ISDNA is a syndromic combined immunodeficiency in the IUIS sense: the
      T-cell defect (ranging to T-B+NK+ SCID and Omenn-like presentations)
      occurs together with extra-immune syndromic features — skeletal dysplasia
      and neurodevelopmental impairment — that are themselves caused by the same
      lesion rather than being secondary to the immune defect.
    evidence:
    - reference: PMID:28148688
      reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We studied three patients with severe skeletal dysplasia, T cell
        immunodeficiency, and developmental delay.
      explanation: >-
        Establishes the co-occurrence of T-cell immunodeficiency with skeletal
        and neurodevelopmental features that defines a syndromic combined
        immunodeficiency.
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic autosomal recessive disorder of glycosaminoglycan
      biosynthesis; its multi-system presentation is best approached from the
      genetics side rather than any single organ chapter.
  icimd_category:
  - classification_value: o_linked_protein_glycosylation
    notes: >-
      ICIMD category 18 (disorders of O-linked protein glycosylation) explicitly
      subsumes glycosaminoglycan *synthesis*, which is where EXTL3 acts — it adds
      the GlcNAc to the O-linked tetrasaccharide linker that commits a chain to
      the heparan sulfate fate. Deliberately not classified under
      glycosaminoglycan_degradation: that category covers the
      mucopolysaccharidoses, the mechanistic opposite of this disorder, and the
      distinction is clinically load-bearing here because routine MPS screening
      is normal in ISDNA (see the diagnosis section).
    evidence:
    - reference: PMID:28331220
      reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        EXTL3 encodes N-acetylglucosaminyltransferase-I (GlcNAcT-I) and GlcNAcT-II,
        which transfers N-acetylglucosamine (GlcNAc) from uridine
        diphosphate-GlcNAc (UDP-GlcNAc) to the linkage region of heparan sulfate
        (HS) and heparin, and to the glucuronic acid (GlcUA) of growing glycan
        chains, respectively
      explanation: >-
        Establishes EXTL3 as a glycosyltransferase acting on the linkage region
        in glycosaminoglycan synthesis, placing the disorder in the O-linked
        glycosylation/GAG-synthesis category rather than a degradation category.
  isds_skeletal_category:
  - classification_value: spondylo_epi_metaphyseal_dysplasias
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019 revision
      (Mortier et al., PMID:31633310), Table 1 group 13 "Spondylo-epi-(meta)-physeal
      dysplasias (SE(M)D)"; listed as "SEMD with immune deficiency, EXTL3 type".

- name: Immunoglobulin Replacement Therapy
  description: >
    Monthly intravenous immunoglobulin for clinically significant antibody
    deficiency. Because immune function can improve spontaneously, replacement
    may be reassessed over time — in one reported patient it was successfully
    discontinued after partial immune recovery with subsequent demonstrable
    vaccine responses.
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: MAXO:0001480
      label: immunoglobulin infusion therapy
  target_mechanisms:
  - target: T-Cell-Predominant Immunodeficiency
    treatment_effect: BYPASSES
    description: >-
      Passive immunoglobulin substitutes for the deficient humoral response
      rather than correcting the underlying HS or thymic defect.
    evidence:

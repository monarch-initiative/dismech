discussions:
- discussion_id: isdna_immune_severity_modifiers
  kind: KNOWLEDGE_GAP
  prompt: >
    What modifiers determine whether an individual with biallelic EXTL3 variants
    develops Omenn-like SCID versus a clinically intact immune system?
  attaches_to:
  - pathophysiology#T-Cell-Predominant Immunodeficiency
  rationale: >
    Immunological severity is discordant between individuals homozygous for the
    identical EXTL3 allele — including unrelated patients sharing p.Pro318Leu or
    p.Pro461Leu — while the skeletal phenotype stays comparatively uniform.
    Variant position therefore does not predict immune outcome, and the
    responsible genetic or environmental modifiers are unidentified. This is the
    single largest barrier to prognostication and to deciding which infants
    warrant transplant evaluation.
  proposed_experiments:
  - experiment_id: exp_isdna_modifier_screen
    name: Modifier screening across the reported ISDNA cohort
    description: >-
      Genome-wide modifier screening across the full reported ISDNA cohort,
      focusing on heparan-sulfate-biosynthesis and thymic-development loci, to
      identify variants segregating with immunological severity independently of
      the EXTL3 genotype.
  - experiment_id: exp_isdna_isogenic_ipsc_background_swap
    name: Isogenic iPSC background-swap panel
    description: >-
      Isogenic iPSC panels carrying each EXTL3 allele on shared and divergent
      genetic backgrounds, differentiated to thymic epithelial progenitors and
      lymphohematopoietic progenitors, to test whether genetic background alone
      reproduces the observed divergence in immune severity.
  evidence:
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients harbouring the same variant in EXTL3 gene show
      phenotypic variability especially with respect to presence or absence of
      immunological manifestations, suggesting a role of unknown modifiers.
    explanation: Directly states the unresolved modifier question this gap records.
- discussion_id: isdna_neuro_primary_vs_secondary
  kind: KNOWLEDGE_GAP
  prompt: >
    Is the neurodevelopmental impairment in ISDNA a primary consequence of the
    heparan sulfate defect in the developing brain, or largely secondary to
    cervical cord compression and chronic illness?
  attaches_to:
  - pathophysiology#Neurodevelopmental Impairment
  - pathophysiology#Cervical Cord Compression
  rationale: >
    Cord compression, laryngotracheal narrowing, recurrent infection, and failure
    to thrive all independently impair development, and all co-occur with the
    neurological phenotype. No reported patient separates the two contributions,
    yet the distinction determines whether early cervical decompression should be
    expected to improve cognitive outcome or only to prevent further injury.
  proposed_experiments:
  - experiment_id: exp_isdna_decompression_neurodev_followup
    name: Pre- and post-decompression neurodevelopmental follow-up
    description: >-
      Longitudinal neurodevelopmental assessment of patients before and after
      early cervical decompression, compared against affected patients without
      cervical stenosis, to separate compression-attributable from
      HS-attributable developmental impairment.
  - experiment_id: exp_isdna_neural_conditional_extl3_ko
    name: Neural-progenitor-restricted conditional Extl3 deletion
    description: >-
      Conditional Extl3 deletion restricted to neural progenitors in mouse,
      bypassing the skeletal and cervical phenotype, to test whether
      neurodevelopmental impairment arises cell-autonomously in the brain.
- discussion_id: isdna_zebrafish_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >
    Does the extl3-mutant zebrafish thymic phenotype model the human immune
    disease closely enough to support therapeutic inference, given that the fish
    model does not reproduce the human spinal, cognitive, or longitudinal
    phenotype?
  attaches_to:
  - pathophysiology#Impaired Thymopoiesis and Progenitor Expansion
  rationale: >
    The zebrafish box mutant provides the strongest in vivo causal evidence in
    the disease — roughly halved thymic volume rescued by wild-type human EXTL3
    RNA — but reproduces only the thymic and fin phenotypes. Meanwhile complete
    Extl3 knockout in mouse is lethal at E9.5, so no mammalian model
    recapitulates the surviving hypomorphic human state. Evidence therefore
    exists in models, but its translational reach to human immune reconstitution
    is the open question.
  proposed_experiments:
  - experiment_id: exp_isdna_hypomorphic_knockin_mouse
    name: Hypomorphic knock-in mouse models
    description: >-
      Knock-in mouse models carrying the human hypomorphic alleles (p.Pro318Leu,
      p.Arg339Trp) rather than a null, to obtain a viable mammalian model that
      reproduces the partial-function human state.
  - experiment_id: exp_isdna_patient_thymic_organoid
    name: Patient-derived thymic organoids
    description: >-
      Patient-derived thymic organoid systems to test whether the thymic-stromal
      defect is cell-autonomous and whether it can be corrected independently of
      the hematopoietic compartment — the key question for HSCT rationale.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interbreeding of the extl3-mutant zebrafish (box) with Tg(rag2:green
      fluorescent protein) transgenic zebrafish revealed defective thymopoiesis,
      which was rescued by injection of wild-type human EXTL3 RNA.
    explanation: >-
      The model-system evidence whose translational validity to the human
      disease is the subject of this mismatch record.

- name: Potentiated FGF2-ERK Signaling
  biological_scale: CELLULAR
  description: >
    Longer HS chains bearing excess 6-O-sulfate provide additional FGF receptor
    binding sites, so the HS defect paradoxically increases rather than
    decreases growth-factor signaling in mesenchymal lineages. Patient
    fibroblasts show enhanced ERK phosphorylation on FGF2 stimulation, corrected
    by wild-type EXTL3. This explains why the radiographic phenotype at birth
    resembles the FGFR3-related dysplasias driven by constitutively increased
    FGFR signaling, even though FGFR1/2/3 are wild-type in these patients.
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that by altering HS chain length and composition,
      EXTL3 mutations potentiate FGF2 signaling, thereby contributing to the
      pathophysiology of the skeletal dysplasia observed in the patients.
    explanation: >-
      Directly attributes the skeletal arm of the disease to potentiated (not
      reduced) FGF2 signaling downstream of the HS defect.
  downstream:
  - target: Spondyloepimetaphyseal Dysplasia
    evidence:
    - reference: PMID:28148688
      reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."

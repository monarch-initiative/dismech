        Both patients had spinal cord compression at the cranio-vertebral junction
        and multiple liver cysts since early infancy.
      explanation: >-
        The skeletal dysplasia produced craniovertebral-junction cord compression
        in both reported patients.
- name: Cervical Cord Compression
  biological_scale: ORGANISM
  description: >
    Odontoid hypoplasia, non-ossification of the atlas, and cervical canal
    stenosis converge on compression of the upper cervical cord. This is the
    single most actionable complication of ISDNA: it is detectable by early
    cervical imaging, is correctable by C1-arch excision or decompression, and
    if unrecognised leads to irreversible neurological injury and neurogenic
    bladder. It is a downstream structural consequence of the skeletal
    dysplasia, mechanistically distinct from the primary neurodevelopmental
    impairment.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three patients had narrowing of the cervical canal, and severe
      narrowing of the laryngotracheal tract was present in P1 and P2.
    explanation: >-
      Documents cervical canal narrowing in every patient of the founding
      series, with associated airway narrowing.
- name: T-Cell-Predominant Immunodeficiency
  biological_scale: ORGANISM
  description: >
    The immune phenotype is T-cell predominant and strikingly variable. Reported
    profiles include T-B+NK+ SCID with absent TRECs, Omenn-like disease with
    oligoclonal activated/memory autologous T cells and exfoliative
    erythroderma, isolated T-cell lymphopenia with hypogammaglobulinemia, and —
    in some individuals with the same genotype — no clinically apparent immune
    defect. Impaired mitogen proliferation, eosinophilia, hypogammaglobulinemia,
    and elevated IgE are recurrent laboratory findings. Spontaneous partial
    recovery of T-cell number and vaccine responsiveness has been documented in
    at least one survivor. Absence of overt immunodeficiency does not exclude
    the diagnosis.
  evidence:
  - reference: PMID:28132690
    reference_title: "Mutations in EXTL3 Cause Neuro-immuno-skeletal Dysplasia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe combined immunodeficiency (SCID) with a complete absence of T cells
      was observed in three families.
    explanation: Documents the severe end of the immunological spectrum.
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients harbouring the same variant in EXTL3 gene show
      phenotypic variability especially with respect to presence or absence of
      immunological manifestations, suggesting a role of unknown modifiers.
    explanation: >-
      Establishes the genotype-independent variability of the immune phenotype
      that motivates the modifier hypothesis.
- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >
    Global developmental delay — particularly gross motor — with central or
    axial hypotonia and intellectual disability of variable degree is a
    defining component of the syndrome. Severe presentations include seizures,
    opisthotonus, hyperreflexia, nystagmus, and developmental arrest. Because
    HS proteoglycans regulate morphogen signaling in neural progenitors, this
    arm is regarded as a primary consequence of the HS defect rather than
    solely secondary to cord compression, although the two coexist and their
    relative contributions have not been separated in patients.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological abnormalities included: opisthotonus, hyperreflexia,
      generalized seizures, and developmental delay in P1; clonic arm movements,
      nystagmus, and developmental arrest in P2; and muscular hypotonia and
      marked developmental delay in P3.
    explanation: >-
      Enumerates the neurological spectrum across the three index patients.
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data identify EXTL3 mutations as a novel cause of severe immune
      deficiency with skeletal dysplasia and developmental delay and underline a
      crucial role of HS in thymopoiesis and skeletal and brain development.
    explanation: >-
      Attributes brain development, alongside thymopoiesis and skeleton, to the
      HS-dependent mechanism.

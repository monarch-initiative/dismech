- name: Spondyloepimetaphyseal Dysplasia
  biological_scale: TISSUE
  description: >
    Disrupted HS-dependent growth-plate signaling produces a
    spondyloepimetaphyseal dysplasia: disproportionate short-limb short stature,
    severe platyspondyly with widened intervertebral spaces, brachydactyly,
    epiphyseal and metaphyseal irregularity, pelvic distortion with
    trident-shaped acetabula and narrow sacro-ischiatic notches, and progressive
    kyphoscoliosis. The craniovertebral junction is the clinically decisive
    site: odontoid hypoplasia and cervical canal stenosis cause cord compression
    that has required decompressive surgery in infancy across multiple reports.
    Premature craniosynostosis, including cloverleaf skull, occurs at the severe
    end.
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a novel type of SEMD in two unrelated Turkish patients who
      presented with severe platyspondyly, kyphoscoliosis, pelvic distortion,
      constriction of the proximal femora and brachydactyly.
    explanation: Defines the core skeletal presentation as a spondyloepimetaphyseal dysplasia.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients had spinal cord compression at the cranio-vertebral junction
      and multiple liver cysts since early infancy.
    explanation: >-
      Documents the craniovertebral cord compression that drives early
      neurosurgical management, alongside the recurrent hepatic cysts.
  downstream:
  - target: Cervical Cord Compression
    evidence:
    - reference: PMID:28331220
      reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
      supports: SUPPORT

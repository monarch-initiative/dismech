- name: Supportive and Rehabilitative Care
  description: >
    Multidisciplinary supportive care: early physical, occupational, and
    speech/language therapy for developmental delay; nutritional support
    including gastrostomy feeding for failure to thrive; respiratory monitoring
    with non-invasive ventilation for obstructive sleep apnea or restrictive
    lung disease; standard antiseizure treatment; and surveillance of hepatic
    and renal cysts. There is no disease-modifying therapy for EXTL3 deficiency
    and no disease-specific interventional trial.
  treatment_term:
    preferred_term: supportive care
    term:

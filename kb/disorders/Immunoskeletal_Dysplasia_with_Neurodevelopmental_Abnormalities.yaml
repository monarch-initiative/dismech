treatments:
- name: Cervical Decompression Surgery
  description: >
    Decompression of the craniovertebral junction — typically C1-arch excision —
    for cord compression or cervical instability. This is the highest-yield
    intervention in ISDNA: early detection followed by surgery is explicitly
    identified as the key to good neurological prognosis, and multiple reported
    patients underwent it in infancy with good outcome.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cervical Cord Compression
    treatment_effect: INHIBITS
    description: >-
      Surgical decompression relieves the mechanical compression of the cervical
      cord produced by odontoid hypoplasia and canal stenosis.
    evidence:
    - reference: PMID:28331220
      reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She received an excision of the C1 arch for the cord compression with good
        outcome.
      explanation: >-
        Documents the decompressive procedure acting on this mechanism node with a
        good clinical outcome.
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She received an excision of the C1 arch for the cord compression with good
      outcome.
    explanation: Documents C1-arch excision with good outcome for cord compression.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complication should be recognized because its early detection followed
      by appropriate surgical treatment is a key to good prognosis.
    explanation: Establishes early surgical decompression as prognostically decisive.
- name: Immunoglobulin Replacement Therapy
  description: >
    Monthly intravenous immunoglobulin for clinically significant antibody
    deficiency. Because immune function can improve spontaneously, replacement
    may be reassessed over time — in one reported patient it was successfully
    discontinued after partial immune recovery with subsequent demonstrable
    vaccine responses.
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: T-Cell-Predominant Immunodeficiency
    treatment_effect: BYPASSES
    description: >-
      Passive immunoglobulin substitutes for the deficient humoral response
      rather than correcting the underlying HS or thymic defect.
    evidence:
    - reference: PMID:28331220
      reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Currently, she is 2 years old and has been treated with monthly intravenous
        immunoglobulin injection.
      explanation: >-
        Documents immunoglobulin replacement used to manage the antibody-deficiency
        component of this node.
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, she is 2 years old and has been treated with monthly intravenous
      immunoglobulin injection.
    explanation: Documents monthly IVIG as the management of the antibody deficiency.
- name: Hematopoietic Stem Cell Transplantation
  description: >
    HSCT may be considered for life-threatening cellular immunodeficiency, but
    with an important mechanistic caveat specific to ISDNA: because EXTL3
    deficiency also impairs thymic epithelial (stromal) differentiation and
    other non-hematopoietic tissues, replacing the hematopoietic compartment
    alone should not be assumed to correct the immune phenotype. No
    disease-specific response rates have been published.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired Thymopoiesis and Progenitor Expansion
    treatment_effect: RESTORES
    description: >-
      Transplantation replaces the defective hematopoietic progenitor
      compartment, but cannot correct the thymic epithelial (stromal) arm of the
      same node, which remains EXTL3-deficient in the host.
    evidence:
    - reference: PMID:28148688
      reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Targeted differentiation of patient-derived induced pluripotent stem cells
        showed a reduced expansion of lymphohematopoietic progenitor cells and
        defects of thymic epithelial progenitor cell differentiation.
      explanation: >-
        The thymic-stromal component of this node is why transplantation of the
        hematopoietic compartment alone may be insufficient.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Targeted differentiation of patient-derived induced pluripotent stem cells
      showed a reduced expansion of lymphohematopoietic progenitor cells and
      defects of thymic epithelial progenitor cell differentiation.
    explanation: >-
      The demonstrated thymic-stromal (non-hematopoietic) component is the basis
      for caution that HSCT may not correct the full immune phenotype; no
      clinical transplant outcome data exist for this disorder.
- name: Nutritional Support and Gastrostomy Feeding
  description: >
    Severe failure to thrive is common and has required high-calorie
    supplementation and gastrostomy tube feeding. Split out from general
    supportive care because it is the one nutritional intervention explicitly
    documented in a reported patient rather than inferred from the phenotype.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In her first year of life, she had severe failure to thrive and required
      high calorie supplements and tube feedings with a G-tube.
    explanation: >-
      Documents high-calorie supplementation and gastrostomy feeding for failure
      to thrive in a reported patient.
- name: Genetic Counseling and Prenatal Testing
  description: >
    Because ISDNA is autosomal recessive with a 25% recurrence risk and
    consanguinity is frequent among reported families, genetic counseling with
    carrier testing and prenatal or preimplantation testing is a core part of
    management. Molecular confirmation in the proband is the prerequisite that
    makes accurate prenatal testing possible, which is why a "proband-first"
    testing strategy is recommended when a further pregnancy is under
    consideration.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in order to guide them with robust prenatal counseling and testing in the
      current pregnancy.
    explanation: >-
      Documents the proband-first molecular diagnosis being used to enable
      prenatal counseling and testing in an ongoing pregnancy.
  - reference: PMID:38010033
    reference_title: "Immune skeletal dysplasia with neurodevelopmental abnormalities caused by a novel variant of EXTL3 gene in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More comprehensive genetic counseling and precise prenatal diagnosis for
      the next pregnancy can also be provided to families with genetic
      disorders.
    explanation: >-
      States that molecular diagnosis enables genetic counseling and prenatal
      diagnosis for subsequent pregnancies.
- name: Supportive and Rehabilitative Care
  description: >
    The genuine remainder of phenotype-directed supportive care once the
    separately curated interventions (cervical decompression, immunoglobulin
    replacement, transplantation, nutritional support, genetic counseling) are
    accounted for: developmental and rehabilitative therapy, standard
    antiseizure treatment, respiratory monitoring, and surveillance of hepatic
    and renal cysts. There is no disease-modifying therapy for EXTL3 deficiency
    and no disease-specific interventional trial. This entry deliberately
    retains the generic supportive-care term because the individual component
    therapies, while recommended in review sources, are not documented for a
    specific reported patient in any reference cached for this entry.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients also had multiple liver cysts in infancy.
    explanation: >-
      Establishes the hepatic cyst burden that motivates ongoing visceral
      surveillance as part of supportive care.
discussions:
- discussion_id: isdna_immune_severity_modifiers
  kind: KNOWLEDGE_GAP
  prompt: >
    What modifiers determine whether an individual with biallelic EXTL3 variants
    develops Omenn-like SCID versus a clinically intact immune system?
  attaches_to:
  - pathophysiology#T-Cell-Predominant Immunodeficiency
  rationale: >
    Immunological severity is discordant between individuals homozygous for the
    identical EXTL3 allele — including unrelated patients sharing p.Pro318Leu or
    p.Pro461Leu — while the skeletal phenotype stays comparatively uniform.
    Variant position therefore does not predict immune outcome, and the
    responsible genetic or environmental modifiers are unidentified. This is the
    single largest barrier to prognostication and to deciding which infants
    warrant transplant evaluation.
  proposed_experiments:
  - experiment_id: exp_isdna_modifier_screen
    name: Modifier screening across the reported ISDNA cohort
    description: >-
      Genome-wide modifier screening across the full reported ISDNA cohort,
      focusing on heparan-sulfate-biosynthesis and thymic-development loci, to
      identify variants segregating with immunological severity independently of
      the EXTL3 genotype.
  - experiment_id: exp_isdna_isogenic_ipsc_background_swap
    name: Isogenic iPSC background-swap panel
    description: >-
      Isogenic iPSC panels carrying each EXTL3 allele on shared and divergent
      genetic backgrounds, differentiated to thymic epithelial progenitors and
      lymphohematopoietic progenitors, to test whether genetic background alone
      reproduces the observed divergence in immune severity.
  evidence:
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients harbouring the same variant in EXTL3 gene show
      phenotypic variability especially with respect to presence or absence of
      immunological manifestations, suggesting a role of unknown modifiers.
    explanation: Directly states the unresolved modifier question this gap records.
- discussion_id: isdna_neuro_primary_vs_secondary
  kind: KNOWLEDGE_GAP
  prompt: >
    Is the neurodevelopmental impairment in ISDNA a primary consequence of the
    heparan sulfate defect in the developing brain, or largely secondary to
    cervical cord compression and chronic illness?
  attaches_to:
  - pathophysiology#Neurodevelopmental Impairment
  - pathophysiology#Cervical Cord Compression
  rationale: >
    Cord compression, laryngotracheal narrowing, recurrent infection, and failure
    to thrive all independently impair development, and all co-occur with the
    neurological phenotype. No reported patient separates the two contributions,
    yet the distinction determines whether early cervical decompression should be
    expected to improve cognitive outcome or only to prevent further injury.
  proposed_experiments:
  - experiment_id: exp_isdna_decompression_neurodev_followup
    name: Pre- and post-decompression neurodevelopmental follow-up
    description: >-
      Longitudinal neurodevelopmental assessment of patients before and after
      early cervical decompression, compared against affected patients without
      cervical stenosis, to separate compression-attributable from
      HS-attributable developmental impairment.
  - experiment_id: exp_isdna_neural_conditional_extl3_ko
    name: Neural-progenitor-restricted conditional Extl3 deletion
    description: >-
      Conditional Extl3 deletion restricted to neural progenitors in mouse,
      bypassing the skeletal and cervical phenotype, to test whether
      neurodevelopmental impairment arises cell-autonomously in the brain.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      craniocervical magnetic resonance imaging showed impingement of the
      posterior arch of C1 on the medulla with mild stenosis of the cervical
      canal requiring neurosurgery
    explanation: >-
      Documents structural cord compression coexisting with the
      neurodevelopmental phenotype in the same patient — the confound that makes
      the primary-versus-secondary attribution unresolvable from reported cases.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients had spinal cord compression at the cranio-vertebral
      junction, which caused serious neurological disorders in early infancy.
    explanation: >-
      Attributes serious early neurological disease directly to cord
      compression, stating the secondary-cause side of this open question.
- discussion_id: isdna_zebrafish_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >
    Does the extl3-mutant zebrafish thymic phenotype model the human immune
    disease closely enough to support therapeutic inference, given that the fish
    model does not reproduce the human spinal, cognitive, or longitudinal
    phenotype?
  attaches_to:
  - pathophysiology#Impaired Thymopoiesis and Progenitor Expansion
  rationale: >
    The zebrafish box mutant provides the strongest in vivo causal evidence in
    the disease — roughly halved thymic volume rescued by wild-type human EXTL3
    RNA — but reproduces only the thymic and fin phenotypes. Meanwhile complete
    Extl3 knockout in mouse is lethal at E9.5, so no mammalian model
    recapitulates the surviving hypomorphic human state. Evidence therefore
    exists in models, but its translational reach to human immune reconstitution
    is the open question.
  proposed_experiments:
  - experiment_id: exp_isdna_hypomorphic_knockin_mouse
    name: Hypomorphic knock-in mouse models
    description: >-
      Knock-in mouse models carrying the human hypomorphic alleles (p.Pro318Leu,
      p.Arg339Trp) rather than a null, to obtain a viable mammalian model that
      reproduces the partial-function human state.
  - experiment_id: exp_isdna_patient_thymic_organoid
    name: Patient-derived thymic organoids
    description: >-
      Patient-derived thymic organoid systems to test whether the thymic-stromal
      defect is cell-autonomous and whether it can be corrected independently of
      the hematopoietic compartment — the key question for HSCT rationale.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interbreeding of the extl3-mutant zebrafish (box) with Tg(rag2:green
      fluorescent protein) transgenic zebrafish revealed defective thymopoiesis,
      which was rescued by injection of wild-type human EXTL3 RNA.
    explanation: >-
      The model-system evidence whose translational validity to the human
      disease is the subject of this mismatch record.

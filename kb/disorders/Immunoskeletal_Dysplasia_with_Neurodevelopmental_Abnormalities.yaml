inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    ISDNA follows autosomal recessive inheritance. All reported disease alleles
    are germline missense variants carried in the homozygous state, with
    heterozygous unaffected parents confirmed by Sanger sequencing.
    Consanguinity contributed to ascertainment in several families but is not
    obligatory; the recurrent c.953C>T (p.Pro318Leu) allele lies in a shared
    homozygous stretch on chromosome 8, suggesting a common founder.
  evidence:
  - reference: PMID:38010033
    reference_title: "Immune skeletal dysplasia with neurodevelopmental abnormalities caused by a novel variant of EXTL3 gene in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune skeletal dysplasia with neurodevelopmental abnormalities (ISDNA) is
      an extremely rare, autosomal recessive genetic disorder characterized by
      various skeletal abnormalities, neurodevelopmental deficits, and abnormal
      immune system function.
    explanation: >-
      States the autosomal recessive mode of inheritance and the three-system
      clinical definition of ISDNA.
  - reference: PMID:28132690
    reference_title: "Mutations in EXTL3 Cause Neuro-immuno-skeletal Dysplasia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By whole-exome sequencing, we identified homozygous missense mutations
      c.1382C>T, c.1537C>T, c.1970A>G, and c.2008T>G in EXTL3 in nine affected
      individuals from five unrelated families.
    explanation: >-
      Documents homozygous (biallelic) missense variants segregating in multiple
      unrelated families, consistent with recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only ~16 affected individuals had been reported at the time of the most
    recent case report. Reported ancestries include Turkish, North African,
    Portuguese, Colombian, Indian, Hispanic, and Chinese, indicating worldwide
    occurrence rather than a single geographic concentration. No population
    prevalence or carrier frequency has been established.
  evidence:
  - reference: PMID:38010729
    reference_title: "EXTL3-Associated Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities: A Lethal Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoskeletal dysplasia with neurodevelopmental abnormalities (ISDNA)
      caused by Exostosin-Like Glycosyltransferase 3 (EXTL3) biallelic mutations
      is a very rare syndrome with only 16 cases reported in the literature.
    explanation: >-
      Gives the published case count, the basis for the CASES_IN_LITERATURE
      measure and ULTRA_RARE class.
biochemical:
- name: Circulating and Urinary Glycosaminoglycan Disaccharide Signature
  presence: INCREASED
  biomarker_term:
    preferred_term: glycosaminoglycan disaccharides (D0a0, D0a4)
    term:
      id: NCIT:C28153
      label: Glycosaminoglycan
  specificity: >-
    Reported as the biochemical readout distinguishing EXTL3 deficiency from
    morphologically similar spondyloepimetaphyseal dysplasias. Specificity has
    not been formally quantified against a control or disease-comparator cohort;
    the supporting study reports the abnormality in all analyzed affected
    individuals but provides no sensitivity/specificity statistics.
  notes: >
    Biallelic EXTL3 variants produce a measurable glycosaminoglycan abnormality
    in body fluids, not only in cultured cells: total GAG concentrations are
    abnormal and the non-sulfated chondroitin disaccharide D0a0 and the
    disaccharide D0a4 are increased in serum and urine. This is the one
    biochemical readout reported to distinguish EXTL3 deficiency from
    morphologically similar spondyloepimetaphyseal dysplasias, and it is
    assayed on accessible fluids rather than requiring a fibroblast biopsy.
    Note the contrast with routine mucopolysaccharidosis screening, which is
    normal in this disorder (see the diagnosis section) — the abnormality is
    detected by disaccharide-resolved analysis, not by bulk urinary GAG
    screening.
  evidence:
  - reference: PMID:28132690
    reference_title: "Mutations in EXTL3 Cause Neuro-immuno-skeletal Dysplasia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed abnormal glycosaminoglycan concentrations and increased
      concentrations of the non-sulfated chondroitin disaccharide D0a0 and the
      disaccharide D0a4 in serum and urine of all analyzed affected individuals.
    explanation: >-
      Establishes the serum/urine disaccharide signature in all analyzed
      affected individuals, making it a candidate biomarker rather than a
      single-patient observation.
- name: Aberrant Heparan Sulfate Chain Length and Sulfation Pattern
  presence: ABNORMAL
  biomarker_term:
    preferred_term: heparan sulfate
    term:
      id: NCIT:C540
      label: Heparan Sulfate
  specificity: >-
    A research assay rather than a clinical test: measured by LC-MS disaccharide
    analysis on patient-derived fibroblasts, so it requires a skin biopsy and is
    not a first-line diagnostic. Its value is mechanistic confirmation — the
    abnormality is corrected by wild-type EXTL3 complementation, which is what
    ties the structural HS defect causally to the variant.
  notes: >
    In patient-derived fibroblasts the quantity of heparan sulfate is
    essentially preserved while its structure is not: chains are longer and
    carry an increased proportion of 6-O- and 2-O-sulfated disaccharides. This
    is the cell-level assay corresponding to the mechanism the entry models —
    a qualitative, not quantitative, HS defect — and it is correctable by
    wild-type EXTL3 complementation, which is what establishes the variants as
    causal rather than incidental.
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      extracted ion chromatogram liquid chromatography–mass spectrometry
      revealed an abnormal HS sulfation pattern in P1’s fibroblasts, with
      increase in 6-O–sulfated and 2-O–sulfated disaccharides, which was
      corrected by EXTL3 overexpression
    explanation: >-
      Documents the specific sulfation abnormality and its correction by
      wild-type EXTL3, establishing both the readout and its causal attribution.
genetic:
- name: EXTL3
  gene_term:
    preferred_term: EXTL3
    term:
      id: hgnc:3518
      label: EXTL3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    EXTL3 (chromosome 8p21.2) encodes a Golgi bi-domain glycosyltransferase
    carrying GT47 and GT64 domains. It acts as N-acetylglucosaminyltransferase-I
    and -II, transferring GlcNAc from UDP-GlcNAc both to the tetrasaccharide
    linkage region (initiating the HS chain) and to the growing glucuronic acid
    terminus (elongating it). All reported ISDNA alleles are germline missense
    variants that reduce, but do not abolish, enzyme activity — consistent with
    the embryonic lethality of complete Extl3 loss in mouse. Reported alleles
    include c.953C>T (p.Pro318Leu), c.1015C>T (p.Arg339Trp), c.1382C>T
    (p.Pro461Leu), c.1537C>T (p.Arg513Cys), c.1970A>G (p.Asn657Ser), c.2008T>G
    (p.Tyr670Asp), and c.2015G>A (p.Arg672Gln).

    Two features of the allelic spectrum are notable. First, every reported
    disease allele to date is a missense change and all cluster in exon 3 — no
    nonsense, frameshift, or whole-gene deletion allele has been reported in a
    surviving patient, which is the human genetic counterpart of the embryonic
    lethality of complete Extl3 loss in mouse and implies that ISDNA is a
    partial-loss-of-function disease with a floor below which the genotype is
    not viable. Second, ISDNA alleles are essentially private: the variants were
    absent from dbSNP, 1000 Genomes, ExAC, ESP6500, and HGMD at the time of
    first reporting, or present only at very low frequency, consistent with a
    severe recessive disorder under selection. Penetrance of the skeletal
    phenotype appears complete in reported biallelic individuals, whereas the
    immune phenotype is incompletely penetrant even within a genotype (see the
    immune_severity_modifiers hypothesis).

    Beyond disease genetics, EXTL3 occupies the branch point of glycosaminoglycan
    biosynthesis: acting on the shared tetrasaccharide linker, it adds the
    GlcNAc that commits a chain to the heparan sulfate rather than chondroitin
    sulfate fate, and it does so with a preference for heparan-sulfate
    proteoglycan core-protein substrates. This is the biochemical reason an
    EXTL3 lesion perturbs HS specifically, and it is also why the disease
    biomarker is a chondroitin-disaccharide excess — the linker traffic that
    EXTL3 fails to commit to HS is measurable on the other branch.
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The enzyme activity of the mutant EXTL3 protein was significantly
      decreased compared to the wild-type protein.
    explanation: >-
      Direct in vitro enzymology showing the p.Pro318Leu allele causes loss of
      GlcNAc transferase activity, establishing the variants as hypomorphic.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      EXTL3 encodes N-acetylglucosaminyltransferase-I (GlcNAcT-I) and GlcNAcT-II,
      which transfers N-acetylglucosamine (GlcNAc) from uridine
      diphosphate-GlcNAc (UDP-GlcNAc) to the linkage region of heparan sulfate
      (HS) and heparin, and to the glucuronic acid (GlcUA) of growing glycan
      chains, respectively
    explanation: Defines the dual enzymatic role of EXTL3 in HS chain initiation and elongation.
  - reference: PMID:38010033
    reference_title: "Immune skeletal dysplasia with neurodevelopmental abnormalities caused by a novel variant of EXTL3 gene in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel homozygous variant, NM_001440: c.2015G>A (p.Arg672Gln) in the
      EXTL3 gene, was identified using WES, which has never been reported before.
    explanation: >-
      Expands the reported allelic spectrum with an additional homozygous
      missense variant in a Chinese family.
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The EXTL3 variant was not deposited in any available databases, including
      dbSNP
    explanation: >-
      Supports the private, population-database-absent character of ISDNA
      alleles.
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the variants reported in the EXTL3 gene till date, are missense
      variants, located in exon 3
    explanation: >-
      Establishes that the reported allelic spectrum is exclusively missense and
      exon-3 clustered.
  - reference: DOI:10.1093/glycob/cwae016
    reference_title: >-
      Chemo-enzymatic synthesis of tetrasaccharide linker peptides to study the
      divergent step in glycosaminoglycan biosynthesis
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, EXTL3 showed a preference towards peptides mimicking the core
      proteins of heparan sulfate proteoglycans over the ones from chondroitin
      sulfate proteoglycans. This suggests that EXTL3 could play a role in the
      decision-making step during glycosaminoglycan biosynthesis.
    explanation: >-
      Establishes EXTL3 as the enzyme governing the heparan-sulfate versus
      chondroitin-sulfate branch decision, the biochemical basis for why an
      EXTL3 lesion perturbs HS specifically and yields a chondroitin-disaccharide
      biomarker.
mechanistic_hypotheses:
- hypothesis_group_id: immune_severity_modifiers
  hypothesis_label: Unidentified modifiers determine immunological severity
  status: EMERGING
  description: >
    The most conspicuous unexplained feature of ISDNA is that immunological
    severity does not track with variant position or identity: individuals
    homozygous for the identical allele (both p.Pro318Leu and p.Pro461Leu) have
    ranged from Omenn-like SCID to a clinically intact immune system, while the
    skeletal phenotype remains comparatively uniform. This dissociation implies
    that genetic modifiers or environmental factors — not the EXTL3 lesion
    alone — gate whether the HS defect is transduced into thymic/hematopoietic
    failure. No modifier locus has been identified.
  evidence:
  - reference: PMID:35114981
    reference_title: "An ultra-rare case of immunoskeletal dysplasia with neurodevelopmental abnormalities in an Indian patient with homozygous c.953C > T variant in EXTL3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, patients harbouring the same variant in EXTL3 gene show
      phenotypic variability especially with respect to presence or absence of
      immunological manifestations, suggesting a role of unknown modifiers.
    explanation: >-
      States the same-genotype/divergent-immune-phenotype observation and
      attributes it explicitly to unknown modifiers.
pathophysiology:
- name: EXTL3 Glycosyltransferase Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic hypomorphic missense variants reduce the GlcNAc-transferase
    activity of the Golgi enzyme EXTL3, which initiates and elongates heparan
    sulfate chains on proteoglycan core proteins. Activity is reduced rather
    than abolished; complete Extl3 loss is embryonically lethal in mouse at
    ~E9.5, before skeletal elements differentiate, so surviving human disease
    necessarily reflects partial function.
  molecular_functions:
  - preferred_term: heparan sulfate N-acetylglucosaminyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0042328
      label: heparan sulfate N-acetylglucosaminyltransferase activity
  evidence:
  - reference: PMID:28331220
    reference_title: "Identification of biallelic EXTL3 mutations in a novel type of spondylo-epi-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Exlt3 knockout mice (Exlt3−/−) are embryonic lethal at 9 days post coitum
      when the differentiated skeletal elements are not formed.
    explanation: >-
      Establishes that complete EXTL3 loss is incompatible with skeletal
      development, supporting the interpretation that human disease alleles are
      hypomorphic rather than null.
  - reference: DOI:10.1038/s41467-022-31048-2
    reference_title: "The structure of EXTL3 helps to explain the different roles of bi-domain exostosins in heparan sulfate synthesis"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report the structure of human exostosin-like 3 (EXTL3) in apo and
      UDP-bound forms.
    explanation: >-
      Provides the cryo-EM structural basis of the bi-domain (GT47/GT64)
      architecture within which the disease-causing missense substitutions act.
  downstream:
  - target: Aberrant Heparan Sulfate Chain Structure
    evidence:
    - reference: PMID:28148688
      reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Altogether, these results indicate that the EXTL3 R339W mutation is a
        hypomorphic allele that alters the function of the enzyme and leads to
        longer HS chains with an aberrant sulfation pattern.
      explanation: >-
        Reduced EXTL3 enzyme function is shown to produce the aberrant HS chain
        structure, establishing this edge.
- name: Aberrant Heparan Sulfate Chain Structure
  biological_scale: MOLECULAR
  description: >
    The consequence of reduced EXTL3 activity is not loss of heparan sulfate but
    structurally abnormal HS. Patient fibroblasts produce a quantitatively
    normal amount of HS, yet the chains are abnormally long and carry an
    aberrant sulfation pattern with increased 6-O- and 2-O-sulfated
    disaccharides; wild-type EXTL3 cDNA corrects the defect. Systemically,
    affected individuals show abnormal glycosaminoglycan concentrations in serum
    and urine, including elevated non-sulfated chondroitin disaccharides —
    consistent with EXTL3 acting at the branch point between heparan sulfate and
    chondroitin sulfate assembly.
  biological_processes:
  - preferred_term: glycosaminoglycan biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0006024
      label: glycosaminoglycan biosynthetic process
  evidence:
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altogether, these results indicate that the EXTL3 R339W mutation is a
      hypomorphic allele that alters the function of the enzyme and leads to
      longer HS chains with an aberrant sulfation pattern.
    explanation: >-
      States the central biochemical lesion — qualitatively abnormal HS
      (longer, aberrantly sulfated), not absent HS.
  - reference: PMID:28148688
    reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient-derived fibroblasts showed abnormal HS composition and altered
      fibroblast growth factor 2 signaling, which was rescued by overexpression
      of wild-type EXTL3 cDNA.
    explanation: >-
      Complementation with wild-type EXTL3 rescues both the HS defect and its
      signaling consequence, establishing causality.
  - reference: PMID:28132690
    reference_title: "Mutations in EXTL3 Cause Neuro-immuno-skeletal Dysplasia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed abnormal glycosaminoglycan concentrations and increased
      concentrations of the non-sulfated chondroitin disaccharide D0a0 and the
      disaccharide D0a4 in serum and urine of all analyzed affected individuals.
    explanation: >-
      Demonstrates the biochemical defect is detectable systemically in patient
      body fluids, not only in cultured cells.
  downstream:
  - target: Potentiated FGF2-ERK Signaling
    evidence:
    - reference: PMID:28148688
      reference_title: "EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results indicate that by altering HS chain length and composition,
        EXTL3 mutations potentiate FGF2 signaling, thereby contributing to the
        pathophysiology of the skeletal dysplasia observed in the patients.
      explanation: >-
        Directly links the altered HS chain length and composition to potentiated

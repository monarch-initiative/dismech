treatments:
- name: Genetic Counseling and Symptom Education
  description: >-
    Carriers and their families are counselled about the low absolute
    medulloblastoma risk and taught the signs and symptoms of a posterior
    fossa tumor, with an annual CNS-focused physical examination. Routine
    brain MRI surveillance is not recommended; the 2024 AACR pediatric
    predisposition update allows a personalized imaging plan, for example for
    a carrier sibling of an affected child, after shared decision making.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38573059
    reference_title: Update on Cancer Predisposition Syndromes and Surveillance Guidelines for Childhood Brain Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the absolute risk of MB development in germline GPR161 is currently considered low(32), surveillance with brain imaging may not be warranted."
    explanation: >-
      Consensus guideline position against routine imaging surveillance.
  - reference: PMID:38573059
    reference_title: Update on Cancer Predisposition Syndromes and Surveillance Guidelines for Childhood Brain Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Education regarding signs and symptoms; consider further screening based on family history and shared decision making with family"
    explanation: >-
      The guideline's GPR161 surveillance recommendation.
  - reference: PMID:38573059
    reference_title: Update on Cancer Predisposition Syndromes and Surveillance Guidelines for Childhood Brain Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At a minimum, it is helpful for the parents to understand the signs and symptoms of the associated tumors and for the child to get an annual, comprehensive and CNS-targeted physical exam."
    explanation: >-
      Minimum follow-up for carriers of genes without formal recommendations,
      a group in which the guideline names GPR161.
  - reference: PMID:36961676
    reference_title: Perspectives on the implications of carrying putative pathogenic variants in the medulloblastoma predisposition genes ELP1 and GPR161.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Radiological screening for medulloblastoma appears not to be justified in incidentally identified cases but the risks for siblings of medulloblastoma cases who are heterozygotes may still justify closer monitoring."
    explanation: >-
      The same position, derived from the projected absolute risk.
diagnosis:
- name: Germline GPR161 genetic testing
  diagnosis_term:
    preferred_term: germline GPR161 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Germline GPR161 testing is suggested for children with SHH-activated
    medulloblastoma, particularly those diagnosed in infancy. A heterozygous
    pathogenic GPR161 variant in constitutional DNA establishes the diagnosis.
  evidence:
  - reference: PMID:33194646
    reference_title: Cancer Predisposition Syndromes and Medulloblastoma in the Molecular Era.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, we suggest that patients with MBSHH should be tested for germline ELP1 mutations, especially those presenting outside of infancy, and for germline GPR161 mutations, particularly those presenting in infancy."
    explanation: >-
      Review recommendation on whom to test.
- name: Tumor chromosome 1q copy-neutral loss of heterozygosity
  diagnosis_term:
    preferred_term: tumor copy number and loss-of-heterozygosity analysis
    term:
      id: NCIT:C20826
      label: Molecular Diagnosis
  description: >-
    Copy-neutral loss of heterozygosity of 1q in an SHH medulloblastoma was
    found only in germline GPR161 carriers in the defining series and was
    proposed as a tumor marker for selecting patients for germline testing.
    It has not been validated in an independent series.
  evidence:
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This analysis revealed that 1q cnLOH is exclusively present in tumors with germline GPR161 mutations (GPR161MUT = five of six v GPR161WT = zero of 220; P = 8.8×10−8, Fisher’s exact test), which suggests that 1q cnLOH is a hallmark for GPR161 deficiency and a molecular marker for the identification of patients with GPR161 mutations."
    explanation: >-
      Specificity of the marker and the proposal to use it.
animal_models:
- name: Gpr161 conditional knockout mouse (neural stem cell or granule progenitor)
  species: Mouse
  genotype: Gpr161 floxed exon 4, homozygous, with hGFAP-Cre, Nestin-Cre or Atoh1-Cre
  publication: PMID:29386106
  modeled_mechanisms:
  - target: Derepression of Hedgehog Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Deleting Gpr161 in cerebellar lineages raises Hedgehog pathway output
      through loss of Gli3 repressor.
    limitations: >-
      Both alleles are deleted in the whole Cre lineage, unlike a germline
      heterozygote with a clonal somatic second hit, so the model does not
      address penetrance.
    evidence:
    - reference: PMID:29386106
      reference_title: Basal Suppression of the Sonic Hedgehog Pathway by the G-Protein-Coupled Receptor Gpr161 Restricts Medulloblastoma Pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Irrespective of Shh production in the cerebellum, Gpr161 deletion increased downstream activity of the Shh pathway by restricting Gli3-mediated repression, causing more extensive generation and proliferation of GC progenitors."
      explanation: >-
        Shows the derepression in the model.
  - target: SHH-Activated Medulloblastoma Initiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mice develop SHH-type medulloblastoma that groups with Smo-driven
      mouse tumors and human SHH medulloblastoma.
    limitations: >-
      Tumors are milder than after Ptch1 deletion, and they arise from
      lineage-wide biallelic deletion rather than a germline heterozygous
      state with somatic 1q loss of heterozygosity.
    evidence:
    - reference: PMID:29386106
      reference_title: Basal Suppression of the Sonic Hedgehog Pathway by the G-Protein-Coupled Receptor Gpr161 Restricts Medulloblastoma Pathogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Multiple lines of evidence, including RNA sequencing (RNA-seq) analysis and immunohistochemistry, group the Shh-MB tumors in Gpr161 conditional knockout mice with SmoM2-induced tumors in mice and human SHH-MB."
      explanation: >-
        Tumor identity in the model.
discussions:
- discussion_id: controversy_gpr161_gorlin_lump
  prompt: >-
    Is GPR161-related medulloblastoma predisposition a separate condition, or a
    gene within nevoid basal cell carcinoma (Gorlin) syndrome?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#
  rationale: >-
    The sources disagree. ClinGen curates GPR161 against this MONDO term and
    split it from the other GPR161 phenotypes, and a screen of 27 Gorlin
    families without PTCH1 or SUFU variants found no GPR161 variant. The 2025
    WHO genetic tumour syndrome classification instead lists GPR161 with PTCH1
    and SUFU under nevoid basal cell carcinoma syndrome, and the 2024 AACR
    update describes a Gorlin-like phenotype in some carriers. That phenotype
    rests mainly on the index patient, whose basal cell carcinomas all arose
    in the radiation field of her medulloblastoma treatment. This entry follows
    MONDO and ClinGen and is curated separately from the PTCH1- and
    SUFU-related entries.
  evidence:
  - reference: CGGV:assertion_126a60ed-67a8-4d42-841e-cc88b1138fbc-2026-01-13T170000.000Z
    reference_title: GPR161 / GPR161-related medulloblastoma predisposition (Strong)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, the following disease entities have been split into multiple disease entities: GPR161-related medulloblastoma predisposition, Pituitary stalk interruption syndrome, Spina bifida."
    explanation: >-
      ClinGen's lump/split decision for GPR161.
  - reference: PMID:36961676
    reference_title: Perspectives on the implications of carrying putative pathogenic variants in the medulloblastoma predisposition genes ELP1 and GPR161.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our specific screen of GPR161 in our cohort of 27 PTCH1/SUFU pathogenic variant-negative patients with Gorlin syndrome found no pathogenic or likely pathogenic variants."
    explanation: >-
      Against GPR161 as a Gorlin syndrome gene.
  - reference: PMID:41210224
    reference_title: Towards a WHO classification of genetic tumour syndromes.
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Naevoid basal cell carcinoma syndrome (Gorlin syndrome) | PTCH1, SUFU, GPR161"
    explanation: >-
      The WHO classification (beta version) lumps GPR161 into Gorlin syndrome,
      contradicting a separate entry.
  - reference: PMID:38573059
    reference_title: Update on Cancer Predisposition Syndromes and Surveillance Guidelines for Childhood Brain Tumors.
    supports: REFUTE
    evidence_source: OTHER
    snippet: "These patients can have an overlapping NBCCS-like phenotype (i.e. develop other associated tumors including BCC and meningioma in probands and family members and Gorlin syndrome-like stigmata)."
    explanation: >-
      Describes a Gorlin-like phenotype in some carriers.
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 16 years, the patient developed her first basal-cell carcinoma (BCC) and has subsequently gone on to develop 10 more BCCs, all within the radiation field and all amenable to surgical removal."
    explanation: >-
      The index patient's basal cell carcinomas were confined to the radiation
      field, which leaves radiation as an explanation for them.
- discussion_id: gap_gpr161_penetrance_and_surveillance
  prompt: >-
    What is the actual medulloblastoma risk for a GPR161 truncating-variant
    carrier, and does it justify any imaging surveillance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal dominant inheritance
  - treatments#Genetic Counseling and Symptom Education
  rationale: >-
    The only risk figure is a projection from four truncating cases and gnomAD
    allele counts. No carrier cohort has been followed, and the guideline
    position against surveillance rests on that projection.
  evidence:
  - reference: PMID:36961676
    reference_title: Perspectives on the implications of carrying putative pathogenic variants in the medulloblastoma predisposition genes ELP1 and GPR161.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We excluded the putative missense variant in GPR161 and the index case leaving only 4 definite loss-of-function variants amongst 1040 cases."
    explanation: >-
      Shows how few cases the penetrance estimate rests on.
- discussion_id: gap_gpr161_tumor_spectrum
  prompt: >-
    Do GPR161 carriers have any tumor risk beyond infant SHH medulloblastoma?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Infant SHH-Activated Medulloblastoma
  rationale: >-
    Almost all reported carriers were children ascertained through
    medulloblastoma. The adult tumors reported (in the index patient, a
    meningioma, colorectal and gastric lesions and basal cell carcinomas
    within the radiation field; in her carrier father, colon adenocarcinoma)
    are single observations and are not curated as phenotypes here.
  evidence:
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional studies are needed to identify a potential broader tumor spectrum associated with germline GPR161 mutations."
    explanation: >-
      The defining series names the gap.
notes: >-
  Curated as a germline predisposition entry separate from the tumor it
  predisposes to (Medulloblastoma_SHH_Activated), following design decision
  3a, and separate from the PTCH1- and SUFU-related nevoid basal cell
  carcinoma syndrome entries; the competing WHO lump into Gorlin syndrome is
  recorded as a controversy discussion. ClinGen split GPR161 medulloblastoma
  predisposition from pituitary stalk interruption syndrome (a homozygous
  GPR161 missense variant in one consanguineous family) and from spina bifida
  (rare heterozygous variants proposed as risk factors); neither is curated
  here.
  No GeneReviews chapter names this condition (just check-genereviews).

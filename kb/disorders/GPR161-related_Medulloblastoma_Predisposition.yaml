inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous germline variants were inherited in every family where
    parents were tested, from a parent without medulloblastoma. Penetrance for
    childhood medulloblastoma is low. The only estimate is a population-based
    projection from the four definite truncating carriers in the discovery
    cohorts and the gnomAD truncating-variant frequency; no carrier cohort has
    been followed prospectively.

      Defines the constitutional heterozygous lesion.
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients were found to harbor GPR161 protein-truncating variants and one patient was a carrier of a predicted damaging missense variant (SJMB054)."
    explanation: >-
      Allele spectrum of the probands found in the extension cohorts.
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients (MB11_06 and SJMB335) shared the same frameshift mutation as that of the index patient; kinship analysis demonstrated that all three patients were unrelated."
    explanation: >-
      The recurrent frameshift in three unrelated probands.
  - reference: CGGV:assertion_126a60ed-67a8-4d42-841e-cc88b1138fbc-2026-01-13T170000.000Z
    reference_title: GPR161 / GPR161-related medulloblastoma predisposition (Strong)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is reported to be loss of function."
    explanation: >-
      ClinGen's statement of the disease mechanism.
  - reference: PMID:23332756
    reference_title: The ciliary G-protein-coupled receptor Gpr161 negatively regulates the Sonic hedgehog pathway via cAMP signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Constitutive Gpr161 activity increases cAMP levels and represses Shh signaling by determining the processing of Gli3 to its repressor form."
    explanation: >-
      Basis for the G protein-coupled receptor activity binding. Graded
      IN_VITRO because the cAMP measurements in this paper are cell-based.
  - reference: PMID:27357676
    reference_title: Gpr161 anchoring of PKA consolidates GPCR and cAMP signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that Gpr161 functions as a selective high-affinity AKAP for type I PKA regulatory subunits (RI)."
    explanation: >-
      Basis for the protein kinase A regulatory subunit binding.
  - reference: PMID:38326651
    reference_title: GPR161 structure uncovers the redundant role of sterol-regulated ciliary cAMP signaling in the Hedgehog pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By contrast, a protein kinase A-binding site in the GPR161 C terminus is critical in suppressing GLI2 ciliary accumulation."
    explanation: >-
      The PKA-binding site, rather than Gs coupling, is what GPR161 needs to
      suppress ciliary GLI2 in this study.

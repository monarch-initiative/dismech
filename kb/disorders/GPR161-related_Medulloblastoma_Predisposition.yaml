    snippet: "This was demonstrated by the discovery of a GPR161 (NM_001375883.1) p.Tyr344Ter germline alteration in a patient with medulloblastoma."
    explanation: >-
      An independent carrier with medulloblastoma; the paper's case table
      gives age 1.5 years and SHH subgroup.

  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "analysis of two available parent-offspring trios (M20769 and MB13_03) demonstrated parental transmission in both affected patients"
    explanation: >-
      Both trios in the defining series showed parental transmission of the
      germline variant.
  - reference: PMID:38424437
    reference_title: The evolutionary impact of childhood cancer on the human gene pool.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least one family member was tested in two of the six families, and in both cases the variant was inherited from a parent without personal or family history of MB."
    explanation: >-
      The transmitting parents were unaffected, which supports incomplete
      penetrance.
  - reference: PMID:36961676
    reference_title: Perspectives on the implications of carrying putative pathogenic variants in the medulloblastoma predisposition genes ELP1 and GPR161.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The projected risks are around 1 in 270-430 for ELP1 and 1 in 1600-2500 for GPR161."
    explanation: >-
      Projected childhood medulloblastoma risk for a GPR161 truncating-variant
      carrier, from population incidence and a case-versus-gnomAD odds ratio.
      It is a modelled estimate, not an observed carrier cohort.
pathophysiology:
- name: Germline GPR161 Loss-of-Function
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous constitutional GPR161 variant, protein-truncating in most
    probands and a predicted damaging missense in one, removes one functional
    copy of a ciliary G protein-coupled receptor. GPR161 signals constitutively
    to raise cAMP and anchors type I protein kinase A regulatory subunits, and
    its PKA-binding site is required for it to keep the Hedgehog pathway
    repressed.

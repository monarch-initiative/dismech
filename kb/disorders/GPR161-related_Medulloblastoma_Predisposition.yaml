name: GPR161-related medulloblastoma predisposition
creation_date: '2026-10-13T19:45:06Z'
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Pediatric Cancer
parents:
- hereditary neoplastic syndrome
disease_term:
  preferred_term: GPR161-related medulloblastoma predisposition
  term:
    id: MONDO:1010204
    label: GPR161-related medulloblastoma predisposition
synonyms: []
description: >-
  GPR161-related medulloblastoma predisposition is an autosomal dominant,
  low-penetrance childhood brain tumor predisposition caused by heterozygous
  germline loss-of-function variants, mostly truncating, in GPR161 (1q24.2).
  GPR161 encodes a cilium-localized orphan G protein-coupled receptor that
  keeps the Sonic hedgehog pathway basally repressed through cAMP and protein
  kinase A. The only established tumor is SHH-activated, TP53-wildtype
  medulloblastoma of infancy, with a median age at diagnosis of 1.5 years in
  the defining series. In the tumor the wild-type allele is lost, usually by
  somatic copy-neutral loss of heterozygosity of chromosome 1q, and no other
  SHH-pathway driver is shared across carrier tumors. Germline variants explain
  about 3 per cent of pediatric and 5 per cent of infant SHH medulloblastoma.
  Because truncating variants are common in the general population and are
  usually inherited from an unaffected parent, the childhood risk for a carrier
  has been estimated at about 1 in 1,600 to 1 in 2,500. Brain imaging
  surveillance is not recommended; families are counselled about the signs
  and symptoms of medulloblastoma. Whether carriers have any further tumor risk is
  unknown.

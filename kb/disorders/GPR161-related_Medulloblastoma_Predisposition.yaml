phenotypes:
- category: Neoplastic
  name: Infant SHH-Activated Medulloblastoma
  description: >-
    SHH-activated, TP53-wildtype medulloblastoma diagnosed in infancy or early
    childhood: median 1.5 years in the six carriers of the defining series,
    with every truncating-variant carrier diagnosed before 3 years. Five of
    the six tumors fell in the SHH-beta infant subtype, though that enrichment
    was not significant. A further carrier with a nonsense variant and SHH
    medulloblastoma was found by germline exome sequencing of a pediatric brain
    tumor cohort.
  phenotype_term:
    preferred_term: SHH-activated medulloblastoma
    term:
      id: HP:0002885
      label: Medulloblastoma
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GPR161 mutations were exclusively associated with the sonic hedgehog medulloblastoma (MBSHH) subgroup and accounted for 5% of infant MBSHH cases in our cohorts."
    explanation: >-
      Restriction to the SHH subgroup and contribution to infant SHH
      medulloblastoma.
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carriers of a protein-truncating germline mutation in GPR161 reported here developed MBSHH before the age of 3 years."
    explanation: >-
      Upper bound of onset among truncating-variant carriers.
  - reference: PMID:31609649
    reference_title: Germline GPR161 Mutations Predispose to Pediatric Medulloblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assessed TP53 mutation status across all MBSHH and observed that all GPR161-associated MBSHH were TP53 wild type"
    explanation: >-
      Places the tumors in the TP53-wildtype SHH category.
  - reference: PMID:39036440

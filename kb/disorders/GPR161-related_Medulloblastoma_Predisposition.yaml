- name: Derepression of Hedgehog Signaling
  conforms_to: "hedgehog_pathway_activation#Loss of Hedgehog Pathway Negative Regulation"
  biological_scale: CELLULAR
  description: >-
    Without GPR161, processing of GLI3 to its repressor form falls and
    Hedgehog target genes are expressed without ligand, before Purkinje cells
    begin secreting Sonic hedgehog. The lesion acts on the PKA-GLI3 repressor
    arm and is distinct from the PTCH1 and SUFU lesions of nevoid basal cell
    carcinoma syndrome.

progression:
- phase: Early infancy - apparently normal development
  age_range: birth to about 1 year
  notes: >-
    Development is typically normal in early infancy. The biallelic genotype is
    present from conception but produces no overt phenotype until milestones
    begin to lag.
  evidence:
  - reference: PMID:36473599
    reference_title: >-
      Natural history of TANGO2 deficiency disorder: Baseline assessment of 73 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients showed normal development in early infancy, with progressive delay in developmental milestones thereafter.
    explanation: Establishes the normal early-infancy period preceding progressive milestone delay.
- phase: Baseline neurodevelopmental phenotype
  age_range: about 1 to 3 years onward
  notes: >-
    Progressive milestone delay emerges, with ataxia, dystonia and speech
    difficulties typically starting between 1 and 3 years, evolving into
    intellectual disability, dysarthria and paroxysmal TANGO2 spells.
  evidence:
  - reference: PMID:36473599
    reference_title: >-
      Natural history of TANGO2 deficiency disorder: Baseline assessment of 73 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptoms included ataxia, dystonia, and speech difficulties, typically starting between the ages of 1 to 3 years.
    explanation: Fixes the age window in which the chronic neurological phenotype becomes manifest.
- phase: Episodic metabolic and cardiac crises
  age_range: childhood onward, median age 6.4 years at cardiac crisis admission
  notes: >-
    Superimposed on the chronic phenotype, catabolic stress precipitates
    metabolic crises with rhabdomyolysis and encephalopathy; about two-thirds of
    those who experience a metabolic crisis go on to have a cardiac crisis with
    QT prolongation and ventricular arrhythmia (30 of 71 individuals, 42%, in the
    natural-history cohort). Crisis manifestations including
    cardiomyopathy are often reversible, but each crisis carries a risk of
    sudden death.
  evidence:
  - reference: PMID:36473599
    reference_title: >-
      Natural history of TANGO2 deficiency disorder: Baseline assessment of 73 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 46/71 (65%) patients suffered metabolic crises, and of those, 30 (65%) developed cardiac crises.
    explanation: Quantifies the proportion progressing from metabolic to cardiac crisis.
  - reference: PMID:35568137
    reference_title: >-
      Cardiac crises: Cardiac arrhythmias and cardiomyopathy during TANGO2 deficiency related metabolic crises.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Twenty-seven children were admitted for 43 cardiac crises (median age 6.4 years
    explanation: Gives the median age at cardiac crisis admission.
- phase: Long-term course and severity spectrum
  age_range: lifelong
  notes: >-
    The course is lifelong. Developmental disability generally persists and may
    step down after severe crises, while global brain atrophy accrues. Severity
    ranges from a fatal early-onset crisis to an adult limb-girdle myopathy
    phenotype, and a minority never experience an overt crisis; intrafamilial
    variability is marked even between siblings sharing a genotype, so genotype
    does not predict trajectory.
  evidence:
  - reference: PMID:42196371
    reference_title: >-
      Genetic and Clinical Characterization of TANGO2 Deficiency Disorder: Insights from the Italian Multicentre Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical severity ranged from an asymptomatic individual under preventive therapy to a fatal early-onset metabolic crisis. Marked intrafamilial variability was observed in two siblings sharing the same genotype.
    explanation: Documents the breadth of the severity spectrum and intrafamilial variability.
  - reference: PMID:31276219
    reference_title: >-
      TANGO2 deficiency as a cause of neurodevelopmental delay with indirect effects on mitochondrial energy metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of importance, we identify two subjects (aged 12 and 17 years) who have never experienced any overt episode of the catabolism-induced metabolic crises typical for the disease.
    explanation: Shows that crises are not obligate and that a crisis-free course into adolescence is possible.
  - reference: PMID:26805782
    reference_title: >-
      Bi-allelic Truncating Mutations in TANGO2 Cause Infancy-Onset Recurrent Metabolic Crises with Encephalocardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Over the course of the disease, all individuals developed global brain atrophy with cognitive impairment and pyramidal signs.
    explanation: Documents the cumulative neurodegenerative component of the long-term course.

pathophysiology:
- name: Catabolic Stress Exposure
  biological_scale: ORGANISM
  role: trigger
  description: >-
    TDD is a stress-unmasked disorder: the biallelic genotype is present from
    conception, but the acute phenotype requires an extrinsic catabolic
    challenge. Established precipitants are intercurrent (especially febrile or
    viral) illness, fasting, dehydration, reduced oral intake, excessive heat,
    overexertion and a ketogenic diet. Some anaesthetic agents and, more
    tentatively, L-carnitine have been proposed as additional triggers, which
    makes specialist perioperative planning important.
  evidence:
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Triggers for TANGO2 spells and acute metabolic crises including fasting, dehydration, overexertion, exposure to excessive heat, ketogenic diet, and infections.
    explanation: >-
      Enumerates the established crisis precipitants. Evidence source is OTHER
      because this is a GeneReviews expert-consensus chapter rather than a
      primary study.
  - reference: PMID:32929747
    reference_title: >-
      Clinical and biological characterization of 20 patients with TANGO2 deficiency indicates novel triggers of metabolic crises and no primary energetic defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We show previously uncharacterized triggers of metabolic crises in TANGO2 patients, such as some anesthetics and possibly l-carnitine.
    explanation: Adds anaesthetic exposure as a trigger identified in the 20-patient French cohort; the l-carnitine association is explicitly hedged by the authors.
  downstream:
  - target: Catabolic-Stress Metabolic Decompensation
    description: >-
      Catabolic challenge raises substrate demand and shifts fuel use toward
      fatty acids in a system that cannot sustain that shift, converting the
      latent metabolic vulnerability into an acute crisis.

- name: TANGO2 Loss of Function
  biological_scale: MOLECULAR
  role: primary_defect
  description: >-
    Biallelic loss-of-function variants in TANGO2 - multiexon deletions
    (predominantly the recurrent exon 3-9 deletion), nonsense, frameshift,
    canonical splice-site and missense alleles - abolish or severely reduce
    TANGO2 protein. Purified TANGO2 binds acyl-coenzyme A, and mutation of its
    conserved NRDE motif abolishes that binding, leading its authors to propose
    that TANGO2 is an acyl-CoA-binding protein of the mitochondrial lumen.
    Separate imaging work localizes it predominantly to mitochondria and
    partially to mitochondrial sites juxtaposed to lipid droplets and the
    endoplasmic reticulum. An
    independent line of work identifies TANGO2 as a binding partner of the small
    heat-shock protein CRYAB that restrains desmin intermediate-filament
    aggregation, so the precise primary biochemical activity remains an area of
    active disagreement.
  genes:
  - preferred_term: TANGO2
    term:
      id: hgnc:25439
      label: TANGO2
  molecular_functions:
  - preferred_term: fatty-acyl-CoA binding
    term:
      id: GO:0000062
      label: fatty-acyl-CoA binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  - preferred_term: lipid droplet
    term:
      id: GO:0005811
      label: lipid droplet
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:26805782
    reference_title: >-
      Bi-allelic Truncating Mutations in TANGO2 Cause Infancy-Onset Recurrent Metabolic Crises with Encephalocardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By exome sequencing, we identified three different bi-allelic truncating mutations in TANGO2 in three unrelated individuals with infancy-onset episodic metabolic crises characterized by encephalopathy, hypoglycemia, rhabdomyolysis, arrhythmias, and laboratory findings suggestive of a defect in mitochondrial fatty acid oxidation.
    explanation: The gene-discovery paper establishing biallelic truncating TANGO2 variants as the cause of the disorder.
  - reference: PMID:40015245
    reference_title: >-
      TANGO2 is an acyl-CoA binding protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We further show that purified TANGO2 binds acyl-coenzyme A, and mutations in the highly conserved NRDE sequence of TANGO2 inhibit this binding.
    explanation: Biochemical evidence assigning TANGO2 an acyl-CoA-binding molecular function.
  - reference: PMID:40015245
    reference_title: >-
      TANGO2 is an acyl-CoA binding protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we demonstrate that TANGO2 localizes to the mitochondrial lumen via a structural region containing LIL residues
    explanation: Localizes the protein to the mitochondrial lumen, supporting the mitochondrial cellular-component annotation.
  - reference: PMID:36961129
    reference_title: >-
      Defects in lipid homeostasis reflect the function of TANGO2 in phospholipid and neutral lipid metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that TANGO2 in mammalian cells localizes predominantly to mitochondria and partially at mitochondria sites juxtaposed to lipid droplets (LDs) and the endoplasmic reticulum.
    explanation: >-
      Sources the mitochondria-lipid-droplet-endoplasmic-reticulum contact-site
      localization and the lipid droplet cellular-component annotation on this node.
  - reference: PMID:40480980
    reference_title: >-
      TANGO2 binds crystallin alpha B and its loss causes desminopathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: We identify that TANGO2 binds the small heat shock protein crystallin alpha B (CRYAB) to prevent the aggregation of the intermediate filament desmin and in the absence of TANGO2, mice develop desminopathy, which is consistent with features found in patients carrying mutations in either desmin or CRYAB.
    explanation: >-
      An alternative, mouse-and-cell-derived account of TANGO2 function via CRYAB
      and desmin. Marked PARTIAL because it proposes a different primary activity
      from the acyl-CoA-binding model and has not been reconciled with it in
      human tissue.
  downstream:
  - target: Lipid and Acyl-CoA Homeostasis Failure
    description: Loss of acyl-CoA handling starves downstream acylation and lipid-remodelling reactions.
  - target: Impaired ER-to-Golgi Membrane Trafficking
    description: Loss of TANGO2 slows secretory-pathway cargo transit, the phenotype for which the gene was originally named.
  - target: Oligodendroglial Lipid Dysregulation and Cerebellar Myelin Loss
    description: >-
      Cell-type-specific mouse deletion shows that TANGO2 loss in
      oligodendroglia is by itself sufficient to disturb phospholipid metabolism
      and myelin maintenance.

- name: Impaired ER-to-Golgi Membrane Trafficking
  biological_scale: CELLULAR
  description: >-
    Fibroblasts from affected individuals show a significant delay in movement of
    secretory cargo between the endoplasmic reticulum and the Golgi apparatus,
    attributable to loss of TANGO2 function, together with altered mitochondrial
    morphology. This trafficking arm is the defect most directly rescued by
    vitamin B5 in human cells, which is why it is retained as a distinct node
    even though its quantitative contribution to the acute crisis is not
    established.

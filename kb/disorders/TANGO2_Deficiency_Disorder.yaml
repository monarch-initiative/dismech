genetic:
- name: TANGO2
  gene_term:
    preferred_term: TANGO2
    term:
      id: hgnc:25439
      label: TANGO2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic loss-of-function variants in TANGO2 at 22q11.21 are necessary and
    sufficient to cause TANGO2 deficiency disorder. Reported pathogenic classes
    include multiexon deletions, nonsense, frameshift, canonical splice-site,
    small in-frame deletion and missense variants. The recurrent 34-kb deletion of
    exons 3-9 is the single most common allele, seen in 42% of reported
    individuals and enriched in European-ancestry cases; c.460G>A (p.Gly154Arg) is
    recurrent in Hispanic/Latino families. Because the disorder is caused by
    deletions as often as by sequence variants, exon-level deletion/duplication
    analysis is required alongside sequencing, and hemizygous variants that appear
    heterozygous on sequencing alone are a recognized diagnostic pitfall.
  evidence:
  - reference: PMID:26805782
    reference_title: >-
      Bi-allelic Truncating Mutations in TANGO2 Cause Infancy-Onset Recurrent Metabolic Crises with Encephalocardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our results establish TANGO2 deficiency as a clinically recognizable cause of pediatric disease with multi-organ involvement.
    explanation: The gene-disease relationship as first established.
  - reference: PMID:34668327
    reference_title: >-
      Variable clinical severity in TANGO2 deficiency: Case series and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 27 pathogenic variants reported to date, the recurrent exons 3-9 deletion represents the most common variant seen in 42% of individuals with TANGO2 deficiency.
    explanation: Quantifies the dominance of the recurrent exon 3-9 deletion in the reported allelic spectrum.
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The other subjects carried three novel homozygous (c.262C>T/p.Arg88*; c.220A>C/p.Thr74Pro; c.380+1G>A), and two further novel heterozygous
    explanation: Illustrates the nonsense, missense and splice-site variant classes contributing to the allelic spectrum.
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The hemizygous mutations in two patients suggest that some mutations leading to allele loss are difficult to detect.
    explanation: Supports the diagnostic pitfall of apparently heterozygous variants that are in fact hemizygous.
  - reference: PMID:30245509
    reference_title: >-
      TANGO2: expanding the clinical phenotype and spectrum of pathogenic variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the need for additional copy-number variation analysis when ES is performed
    explanation: Supports the requirement for copy-number analysis alongside exome sequencing.
  - reference: PMID:36473599
    reference_title: >-
      Natural history of TANGO2 deficiency disorder: Baseline assessment of 73 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 24 different TANGO2 alleles were observed.
    explanation: Quantifies allelic heterogeneity across the 73-patient natural-history cohort.

- name: TANGO2 unmasked by a 22q11.2 deletion in trans
  gene_term:
    preferred_term: TANGO2
    term:
      id: hgnc:25439
      label: TANGO2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    TANGO2 lies within the interval recurrently deleted in 22q11.2 deletion
    syndrome. An individual carrying a 22q11.2 deletion that removes one TANGO2
    allele develops TDD if the remaining allele carries a pathogenic sequence
    variant - an autosomal-recessive second diagnosis unmasked by the deletion.
    This configuration has been documented directly, and it makes 22q11.2 deletion
    syndrome an at-risk group in which TDD is thought to be underdiagnosed because
    the phenotypes overlap. A multicentre screen of 435 individuals with 22q11.2
    deletion syndrome identified 21 meeting consensus criteria for TANGO2 testing;
    of the nine actually sequenced with deletion/duplication analysis, none were
    diagnosed with TDD, so the practical yield of symptom-based screening remains
    unproven. This entry describes the TDD side of that relationship; the
    22q11.2 Deletion Syndrome entry covers it as a second-diagnosis and
    differential-diagnosis consideration.
  evidence:
  - reference: PMID:38829177
    reference_title: >-
      Multicenter appraisal of comorbid TANGO2 deficiency disorder in patients with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TANGO2 deficiency disorder (TDD) is a rare, autosomal recessive condition caused by pathogenic variants in TANGO2, a gene residing within the region commonly deleted in 22q11.2 deletion syndrome (22q11.2DS).
    explanation: Establishes that TANGO2 lies within the 22q11.2 deleted interval.
  - reference: PMID:38829177
    reference_title: >-
      Multicenter appraisal of comorbid TANGO2 deficiency disorder in patients with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although patients with 22q11.2DS are at substantially higher risk for comorbid TDD, it remains underdiagnosed within 22q11.2DS, likely due to overlapping symptomatology and a lack of knowledge about TDD.
    explanation: Supports the elevated risk and the underdiagnosis concern in this group.
  - reference: PMID:38829177
    reference_title: >-
      Multicenter appraisal of comorbid TANGO2 deficiency disorder in patients with 22q11.2 deletion syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Of the nine patients undergoing TANGO2 sequencing with del/dup analysis, none were ultimately diagnosed with TDD.
    explanation: >-
      Recorded as PARTIAL: the null yield constrains how strongly symptom-based
      screening can be recommended, while the study's own conclusion is that
      better prospective screening tools are needed rather than that screening is
      unwarranted.
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two carried the reported deletion of exons 3 to 9, one homozygous, one heterozygous with a 22q11.21 microdeletion inherited in trans.
    explanation: A directly documented instance of biallelic TANGO2 loss produced by a sequence-level deletion plus a 22q11.21 microdeletion in trans.
  - reference: PMID:42420940
    reference_title: >-
      TANGO2-related metabolic encephalopathy-arrhythmia syndrome unmasked in 22q11.2 deletion syndrome: hemizygous pathogenic variant, complex phenotype modified by two genetic conditions, and implications for proactive crisis prevention: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with 22q11.2 deletion syndrome are at increased risk when a pathogenic variant occurs in the remaining allele, yet this dual diagnosis remains underrecognized as clinicians often attribute all manifestations to the primary genetic condition.
    explanation: >-
      The dedicated case report of TDD unmasked by a 22q11.2 deletion; this is the
      same source the 22q11.2 Deletion Syndrome entry uses for the reciprocal
      claim, keeping the two entries consistent.

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    TDD is inherited in an autosomal recessive manner. Parents of an affected
    child are typically heterozygous carriers, giving a 25% recurrence risk per
    pregnancy. Penetrance for biallelic severe loss of function appears high, but
    expressivity is markedly variable - including between siblings who share a
    genotype - so genotype does not reliably predict severity. Consanguinity
    increases the chance of homozygosity but is not required; compound
    heterozygosity and unmasking by a 22q11.2 deletion in trans are both
    recognized routes to biallelic loss.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38829177
    reference_title: >-
      Multicenter appraisal of comorbid TANGO2 deficiency disorder in patients with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TANGO2 deficiency disorder (TDD) is a rare, autosomal recessive condition caused by pathogenic variants in TANGO2
    explanation: States the mode of inheritance.
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All nine subjects carried autosomal recessive TANGO2 mutations.
    explanation: Confirms recessive segregation across an independent multi-family series.
  - reference: PMID:42115085
    reference_title: >-
      Molecular basis and clinical implications of TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Intrafamilial phenotypic variability and overlapping manifestations with other metabolic diseases complicate timely and accurate diagnosis.
    explanation: >-
      Supports the variable-expressivity statement. Evidence source is OTHER
      because this is a review article.
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for a TANGO2 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of inheriting neither of the familial pathogenic variants.
    explanation: >-
      Sources the 25% recurrence risk and carrier probabilities stated in this
      block. Evidence source is OTHER because this is a GeneReviews chapter.

environmental:
- name: Catabolic stress
  influences_mechanisms:
  - target: Catabolic Stress Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The node is named for this exposure and describes the disorder as
      stress-unmasked: the genotype is present from conception and the acute
      phenotype requires an extrinsic catabolic challenge. Exposure and node
      are therefore the same thing, and the cited chapter enumerates the
      precipitants the node lists.
    evidence:
    - reference: PMID:29369572
      reference_title: "TANGO2 Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Triggers for TANGO2 spells and acute metabolic crises including fasting, dehydration, overexertion, exposure to excessive heat, ketogenic diet, and infections."
      explanation: >-
        Enumerates fasting, dehydration, overexertion, excessive heat,
        ketogenic diet and infection as triggers, which is this node's own
        content.
  description: >-
    Fever and intercurrent illness, fasting, dehydration, reduced oral intake,
    excessive heat, overexertion and a ketogenic diet precipitate metabolic
    crises and TANGO2 spells. These are not causes of the disorder but the
    modifiable determinants of when and how severely it manifests, which is why
    avoidance of catabolism is the backbone of preventive care.
  evidence:
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Triggers for TANGO2 spells and acute metabolic crises including fasting, dehydration, overexertion, exposure to excessive heat, ketogenic diet, and infections.
    explanation: >-
      Enumerates the crisis triggers. Evidence source is OTHER because this is a
      GeneReviews chapter.


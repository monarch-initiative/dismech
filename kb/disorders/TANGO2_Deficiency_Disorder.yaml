- name: Extracorporeal Membrane Oxygenation for Refractory Arrhythmia
  description: >-
    ECMO is used as a last-resort rescue for arrhythmia or cardiogenic shock
    refractory to medical therapy. In the 27-patient cardiac-crisis series,
    arrhythmias were controlled after ECMO in 6 patients, 5 of whom survived. In a
    single reported case, thoracoscopic left sympathectomy performed during ECMO
    support terminated a refractory ventricular fibrillation storm.

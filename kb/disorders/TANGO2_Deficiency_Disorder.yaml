  conforms_to: "metabolic_intoxication_decompensation#Acute Metabolic Decompensation"
  description: >-
    The acute crisis is the shared central effector of the disorder. It manifests
    as hypoglycaemia, lactic and metabolic acidosis, markedly elevated creatine
    kinase and transaminases, and encephalopathy, and it converts the latent
    cellular lesion into simultaneous multi-organ injury of skeletal muscle,
    brain and heart. Between episodes, standard metabolic screening is frequently
    normal, so a normal baseline workup does not exclude the diagnosis.

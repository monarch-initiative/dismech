    reference_title: >-
      Intrinsic and extrinsic regulation of rhabdomyolysis susceptibility by Tango2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the loss of Tango2 in zebrafish results in growth defects, early lethality and increased susceptibility of skeletal muscle defects in response to extrinsic triggers, similar to TANGO2-deficient patients
    explanation: Model-organism recapitulation of trigger-dependent skeletal muscle injury.
  - reference: PMID:39722856
    reference_title: >-
      TANGO2-related rhabdomyolysis symptoms are associated with abnormal autophagy functioning.
    supports: SUPPORT

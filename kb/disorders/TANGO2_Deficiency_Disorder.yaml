    supports: SUPPORT
    evidence_source: OTHER
    snippet: TANGO2 variants result in a complex disease phenotype consisting of recurrent crisis-induced rhabdomyolysis, encephalopathy, seizures, lactic acidosis, hypoglycemia, and cardiac arrhythmias.
    explanation: >-
      Enumerates the biochemical and clinical content of the decompensated state.
      Evidence source is OTHER because this is the background statement of an

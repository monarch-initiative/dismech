name: TANGO2 Deficiency Disorder
category: Mendelian
creation_date: "2026-07-31T00:00:00Z"
synonyms:
- TANGO2 deficiency
- TANGO2 deficiency disease
- TANGO2-related metabolic encephalopathy-arrhythmia syndrome
- TANGO2-related disorder
- MECRCN
- recurrent metabolic encephalomyopathic crises-rhabdomyolysis-cardiac arrhythmia-intellectual disability syndrome
description: >-
  TANGO2 deficiency disorder (TDD) is an ultra-rare autosomal recessive disorder
  caused by biallelic loss-of-function variants in TANGO2 (transport and Golgi
  organization 2 homolog), a gene at 22q11.21 whose product is required for
  intracellular lipid and membrane homeostasis and has been proposed, on
  biochemical evidence, to act as an acyl-CoA-binding protein. Affected
  individuals have baseline global developmental delay, intellectual disability,
  ataxia, dysarthria and hypothyroidism, punctuated by paroxysmal "TANGO2 spells"
  and by acute metabolic crises precipitated by catabolic stress such as fasting,
  febrile illness, dehydration, heat or exertion. Crises feature rhabdomyolysis
  with markedly elevated creatine kinase, hypoglycaemia, lactic acidosis,
  encephalopathy and life-threatening cardiac involvement with QT prolongation,
  ventricular tachycardia and cardiomyopathy; arrhythmia is the leading cause of
  death. Because TANGO2 lies within the region deleted in 22q11.2 deletion
  syndrome, a pathogenic variant on the remaining allele can unmask TDD as a
  second diagnosis. Daily B-complex/multivitamin supplementation (with
  pantothenate/B5 and folate/B9 as the best-supported active components) is an
  emerging crisis-prevention strategy backed by observational natural-history and
  model-system rescue data, but not yet by randomized trials.

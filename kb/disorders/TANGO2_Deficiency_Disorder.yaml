- name: Avoidance of Catabolic Triggers and Sick-Day Planning
  description: >-
    Preventive care centres on avoiding prolonged fasting and dehydration,
    maintaining regular meals, avoiding a ketogenic diet, limiting exertion and
    heat exposure during illness, and having a written sick-day plan with early
    hospital evaluation for fever, reduced intake, weakness, dark urine, seizure
    or palpitations.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Catabolic Stress Exposure
    treatment_effect: INHIBITS

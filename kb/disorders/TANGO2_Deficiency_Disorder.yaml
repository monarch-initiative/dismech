    description: Cerebellar myelin loss contributes to the chronic ataxia, dysarthria and motor decline independently of acute crises.

- name: Progressive Neurodegeneration and Regression
  biological_scale: ORGANISM
  description: >-
    Over the course of the disease, individuals develop global brain atrophy with
    cognitive impairment and pyramidal signs. Neuroimaging shows variable cerebral
    and white-matter atrophy and ventriculomegaly. Post-mortem examination in one
    case revealed heterotopic neurons in the cerebral white matter, raising the
    possibility of an additional neuronal-migration contribution to the
    neurodevelopmental phenotype.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:26805782
    reference_title: >-
      Bi-allelic Truncating Mutations in TANGO2 Cause Infancy-Onset Recurrent Metabolic Crises with Encephalocardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Over the course of the disease, all individuals developed global brain atrophy with cognitive impairment and pyramidal signs.
    explanation: Documents the progressive neurodegenerative trajectory in the index cohort.
  - reference: PMID:31276219
    reference_title: >-
      TANGO2 deficiency as a cause of neurodevelopmental delay with indirect effects on mitochondrial energy metabolism.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: In one deceased patient, post-mortem autopsy revealed heterotopic neurons in the cerebral white matter, indicating a possible role for TANGO2 in neuronal migration.
    explanation: >-

    explanation: The parallel rescue of the ER-to-Golgi trafficking defect in human TANGO2-deficient cells.
  - reference: PMID:36502486
    reference_title: >-
      Vitamin B5, a coenzyme A precursor, rescues TANGO2 deficiency disease-associated defects in Drosophila and human cells.
    supports: PARTIAL

    and body tilt, increased dysarthria, drooling, lethargy and disorientation -
    lasting minutes to hours. They are distinguished from metabolic crises by the
    absence of rhabdomyolysis and cardiac involvement, and are the single most
    characteristic episodic feature of the disorder.

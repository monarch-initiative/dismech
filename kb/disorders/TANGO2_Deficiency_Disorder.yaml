    description: Energy failure in the highest-demand striated tissue produces myofiber necrosis with release of creatine kinase and myoglobin.
  - target: Acute Metabolic Encephalopathy
    description: Hypoglycaemia, acidosis and neuronal energy failure produce acute encephalopathy and seizures during the crisis.
  - target: Cardiomyocyte ATP Depletion and Repolarization Instability
    description: Cardiomyocytes forced onto fatty-acid fuel during the crisis lose ATP and destabilize repolarization.

- name: Skeletal Myofiber Necrosis and Rhabdomyolysis
  biological_scale: TISSUE
  description: >-
    Skeletal muscle is the tissue most consistently injured during crises.
    Myofibers undergo necrosis with release of creatine kinase and myoglobin,
    producing myoglobinuria and, when severe, acute kidney injury. Zebrafish
    tango2 mutants reproduce this stress-conditional muscle vulnerability, showing
    increased skeletal-muscle susceptibility to extrinsic triggers; the same model
    links the injury to failed autophagy and mitophagy.
    Chronic myopathic change with endomysial fibrosis is documented at the mild
    end of the spectrum.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:

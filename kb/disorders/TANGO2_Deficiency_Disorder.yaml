    snippet: Muscle histology two years later revealed increased endomysial fibrosis and other myopathic changes.
    explanation: Documents chronic structural muscle damage persisting between crises in a human case.

- name: Acute Metabolic Encephalopathy
  biological_scale: ORGANISM
  conforms_to: "metabolic_intoxication_decompensation#Acute Metabolic Encephalopathy"
  description: >-
    During crises, neuronal energy failure compounded by hypoglycaemia and lactic
    acidosis produces acute encephalopathy ranging from lethargy and
    disorientation to seizures and coma. Unlike the classical intoxication-type
    inborn errors, ammonia neurotoxicity is not the dominant driver in TDD; the
    conformance to the module is therefore on the shared energy-failure and
    acidosis route to acute encephalopathy rather than on the ammonia-glutamine
    astrocyte-swelling route.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:26805782
    reference_title: >-
      Bi-allelic Truncating Mutations in TANGO2 Cause Infancy-Onset Recurrent Metabolic Crises with Encephalocardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: three unrelated individuals with infancy-onset episodic metabolic crises characterized by encephalopathy, hypoglycemia, rhabdomyolysis, arrhythmias
    explanation: Places encephalopathy within the crisis syndrome alongside hypoglycaemia.
  - reference: PMID:30245509
    reference_title: >-
      TANGO2: expanding the clinical phenotype and spectrum of pathogenic variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Primary features include metabolic crisis with rhabdomyolysis, encephalopathy, intellectual disability, seizures, and cardiac arrhythmias.
    explanation: Independent case-series confirmation that encephalopathy is a primary crisis feature.
  downstream:
  - target: Progressive Neurodegeneration and Regression
    description: Repeated encephalopathic episodes contribute to stepwise loss of acquired skills superimposed on the baseline neurodevelopmental course.

- name: Cardiomyocyte ATP Depletion and Repolarization Instability
  biological_scale: CELLULAR
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  description: >-
    In TANGO2-null iPSC-derived cardiomyocytes, the palmitate-driven collapse of
    the ATP/ADP ratio prolongs the action potential; the prolongation is
    abolished by intracellular delivery of Mg-ATP or creatine kinase, showing it
    is energy-dependent rather than a primary channel defect. The metabolic crisis
    upregulates TRPM4, an ATP- and calcium-regulated cation channel, and TRPM4
    knockdown or block prevents action-potential prolongation without correcting
    the energy deficit. L-type calcium channel inhibition with verapamil also
    prevents prolongation by normalizing ATP/ADP and intracellular calcium
    handling. Conformance to the channelopathy module is declared here on the
    altered-action-potential/calcium-handling stage only: TDD reaches that stage
    through a metabolic route, not through an inherited ion-channel variant, so
    the module's trigger node is deliberately not claimed.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle cell action potential
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
    modifier: ABNORMAL
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:42389941
    reference_title: >-
      Metabolic crisis and TRPM4 activation cause QT prolongation in TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: During the crisis, TANGO2-/- hiPSC-CMs exhibited AP prolongation, prevented by intracellular delivery of Mg-ATP or creatine kinase.
    explanation: Establishes that action-potential prolongation is directly caused by the cardiomyocyte energy deficit.
  - reference: PMID:42389941
    reference_title: >-
      Metabolic crisis and TRPM4 activation cause QT prolongation in TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Importantly, the metabolic crisis upregulated TRPM4, an ATP- and Ca-regulated channel. TRPM4 siRNA knockdown or pharmacological block prevented AP prolongation without rescuing the energetic deficit of TANGO2-/- hiPSC-CMs.
    explanation: Identifies TRPM4 as the effector channel translating ATP deficiency into repolarization abnormality.
  - reference: PMID:42389941
    reference_title: >-
      Metabolic crisis and TRPM4 activation cause QT prolongation in TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: LTCC inhibition with verapamil prevented AP prolongation by normalizing ATP/ADP ratios and intracellular Ca mishandling.
    explanation: Documents disturbed intracellular calcium handling and its pharmacological correction.
  downstream:
  - target: Arrhythmogenic Substrate and Triggered Activity
    description: Prolonged, heterogeneous repolarization across the ventricular wall creates the substrate for triggered beats and reentry.

- name: Arrhythmogenic Substrate and Triggered Activity
  biological_scale: TISSUE
  conforms_to: "cardiac_ion_channel_repolarization#Arrhythmogenic Substrate and Triggered Activity"
  description: >-
    At the tissue level the cellular repolarization defect appears as marked QTc
    prolongation, which is present in essentially every documented TDD cardiac
    crisis (median QTc 547 ms in a 27-patient multicentre series), and in a
    minority as a type I Brugada pattern. The resulting dispersion of
    repolarization is the substrate on which triggered beats initiate ventricular
    arrhythmia.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DYSREGULATED
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:35568137
    reference_title: >-
      Cardiac crises: Cardiac arrhythmias and cardiomyopathy during TANGO2 deficiency related metabolic crises.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During crisis, QTc prolongation occurred in all (median 547 ms; IQR 504-600 ms) and a type I Brugada pattern in 8 (26%).
    explanation: Quantifies universal QTc prolongation within cardiac crises, with the median value and the Brugada-pattern minority.
  - reference: PMID:42389941
    reference_title: >-
      Metabolic crisis and TRPM4 activation cause QT prolongation in TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings suggest a mechanistic link between ATP deficiency, TRPM4 activation, and AP prolongation in TDD.
    explanation: Supplies the mechanistic chain connecting the cellular node to this tissue-level substrate.
  downstream:
  - target: Ventricular Tachyarrhythmia and Cardiac Arrest
    description: Triggered beats on a dispersed-repolarization substrate degenerate into ventricular tachycardia, torsade de pointes and cardiac arrest.

- name: Ventricular Tachyarrhythmia and Cardiac Arrest
  biological_scale: ORGANISM
  conforms_to: "cardiac_ion_channel_repolarization#Ventricular Tachyarrhythmia"
  description: >-
    Ventricular tachycardia occurred in 78% and cardiac arrest in 74% of patients
    admitted with a TDD cardiac crisis, with cardiomyopathy in 70% and 37%
    mortality, six of ten deaths arrhythmia-related. These arrhythmias are
    recalcitrant to standard antiarrhythmic drugs and constitute the leading cause
    of death in the disorder, which is why they are modelled as the terminal node
    of the cardiac arm.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:35568137
    reference_title: >-
      Cardiac crises: Cardiac arrhythmias and cardiomyopathy during TANGO2 deficiency related metabolic crises.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Arrhythmias included VT in 21 (78%), supraventricular tachycardia in 3 (11%), and heart block in 1 (4%). Nineteen patients (70%) developed cardiomyopathy, and 20 (74%) experienced a cardiac arrest. There were 10 deaths (37%), 6 related to arrhythmias.
    explanation: The primary quantitative outcome data for the cardiac arm within crisis admissions.
  - reference: PMID:38855866
    reference_title: >-
      Folate as a potential treatment for lethal ventricular arrhythmias in TANGO2-deficiency disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: TDD-associated cardiac arrhythmias are recalcitrant to standard antiarrhythmic medications and constitute the leading cause of death.
    explanation: >-
      Establishes arrhythmia as the leading cause of death and its refractoriness
      to conventional therapy. Evidence source is OTHER because this is the
      framing statement of an iPSC-cardiomyocyte study rather than its own
      clinical result; the mortality figures themselves are cited from
      PMID:35568137 elsewhere in this entry.

- name: Oligodendroglial Lipid Dysregulation and Cerebellar Myelin Loss
  biological_scale: CELLULAR
  description: >-
    Constitutive and oligodendrocyte-specific Tango2 knockout mice both reproduce
    the motor deficits seen in TDD, with robust cerebellar myelin loss, increased
    cerebellar synapse number, and downregulation of phospholipid-metabolism
    programmes. Vitamin B5 supplementation alleviates both the motor deficit and
    the myelin defect. This provides a cell-autonomous, non-crisis route from
    TANGO2 loss to the chronic ataxia and motor phenotype; it is a mouse finding
    not yet confirmed in human tissue.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  locations:

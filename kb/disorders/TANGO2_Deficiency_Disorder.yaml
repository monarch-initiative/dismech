- name: Acute Antiarrhythmic Management
  description: >-
    TDD crisis arrhythmias respond poorly to standard antiarrhythmic drugs.
    Reported effective measures are intravenous magnesium (with magnesium
    maintained above 2.2 mg/dL), isoproterenol, atrial overdrive pacing, and
    aggressive electrolyte correction; verapamil was effective in one patient and
    has independent mechanistic support from L-type calcium channel inhibition in
    the cardiomyocyte model. Management by an electrophysiologist is recommended
    rather than application of generic long-QT algorithms.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
    - preferred_term: isoproterenol
      term:
        id: CHEBI:64317
        label: isoprenaline
    - preferred_term: verapamil

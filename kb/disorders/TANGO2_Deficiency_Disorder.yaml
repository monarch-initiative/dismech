    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: an increased pool of free fatty acids in both human cells devoid of TANGO2 and Drosophila harboring a previously described TANGO2 loss of function allele. All these changes were reversed upon vitamin B5 supplementation.
    explanation: >-
      Cross-species (Drosophila) replication of the free-fatty-acid expansion and
      its reversal by vitamin B5, which ties this node to the therapeutic

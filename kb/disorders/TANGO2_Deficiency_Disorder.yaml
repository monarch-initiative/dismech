    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Quantitative lipidomics revealed a marked increase in lysophosphatidic acid (LPA) and a concomitant decrease in its biosynthetic precursor phosphatidic acid (PA). These changes were exacerbated in nutrient-starved cells.
    explanation: The core lipidomic signature, and its worsening under the nutrient stress that clinically triggers crises.
  - reference: PMID:36961129
    reference_title: >-
      Defects in lipid homeostasis reflect the function of TANGO2 in phospholipid and neutral lipid metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The defect in acyl-CoA availability impacts the metabolism of many other fatty acids, generates high levels of reactive oxygen species, and promotes lipid peroxidation.
    explanation: Links the acyl-CoA defect to oxidative injury, the bridge from lipid imbalance to tissue damage.
  - reference: PMID:38718569
    reference_title: >-
      Lipidomic analysis of human TANGO2-deficient cells suggests a lipid imbalance as a cause of TANGO2 deficiency disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we found profound changes in the lipid profile of human TANGO2-deficient cells
    explanation: Independent lipidomic replication of the lipid-profile abnormality in human TANGO2-deficient cells.

      Intrinsic and extrinsic regulation of rhabdomyolysis susceptibility by Tango2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using lipidomics, we identified alterations in the glycerolipid pathway in tango2 mutants, which is critical for membrane stability and energy balance.
    explanation: Cross-species (zebrafish) confirmation that the glycerolipid pathway is the affected axis.
  downstream:
  - target: Impaired Mitochondrial Fatty-Acid Oxidation and Energy Reserve
    description: >-
      Restricted acyl-CoA supply and disordered membrane phospholipid composition
      degrade the capacity of mitochondria to oxidize fatty acids and to sustain
      ATP output under load.

- name: Impaired Mitochondrial Fatty-Acid Oxidation and Energy Reserve
  biological_scale: CELLULAR
  conforms_to: "metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy Deficit"
  description: >-
    Mutant fibroblasts show a functional defect of palmitate-dependent
    respiration, and CRISPR-engineered TANGO2-null iPSC-derived cardiomyocytes
    have normal bioenergetics on glucose but a profound fall in ATP production
    rate and ATP/ADP ratio when forced to use palmitate, worsened by 24-hour
    fasting. Muscle histology and respiratory-chain studies in patients are often
    unremarkable at baseline, and plasma acylcarnitines and FGF-21 are usually
    normal between episodes: the deficit is a conditional, substrate-dependent
    loss of energy reserve rather than a constitutive respiratory-chain enzyme
    deficiency. Autophagy and mitophagy are additionally impaired on starvation,
    limiting the clearance of damaged organelles. This node conforms to the
    module's toxic-metabolite/energy-deficit stage on the energy-deficit arm; the
    accumulating species in TDD are lysophospholipids and free fatty acids rather
    than a classical organic acid.
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:26805782
    reference_title: >-
      Bi-allelic Truncating Mutations in TANGO2 Cause Infancy-Onset Recurrent Metabolic Crises with Encephalocardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Investigation of palmitate-dependent respiration in mutant fibroblasts showed evidence of a functional defect in mitochondrial β-oxidation.
    explanation: First functional demonstration of impaired fatty-acid oxidation in patient cells.
  - reference: PMID:42389941
    reference_title: >-
      Metabolic crisis and TRPM4 activation cause QT prolongation in TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: using palmitate as energy substrate triggered a profound reduction in cellular ATP production rate and decreased ATP/ADP ratios in TANGO2-/- hiPSC-CMs, exacerbated by 24-hour fasting. This crisis was prevented by 2-week treatment with vitamins B5 and B9.
    explanation: >-
      Shows the deficit is substrate-conditional (present on palmitate, absent on
      glucose) and fasting-amplified, and that B-vitamin pretreatment prevents it.
  - reference: PMID:32929747
    reference_title: >-
      Clinical and biological characterization of 20 patients with TANGO2 deficiency indicates novel triggers of metabolic crises and no primary energetic defect.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Mechanistically, TANGO2 disease is unlikely to originate from a primary mitochondrial defect. Rather, we suggest that mitochondrial defects are secondary to strong extrinsic triggers in TANGO2 deficient patients.
    explanation: >-
      Constrains the claim: this node is a secondary, stress-dependent
      mitochondrial deficit, not a primary respiratory-chain disorder. Recorded
      as PARTIAL because it refutes the strong version of the mitochondrial
      hypothesis while supporting the conditional version modelled here.
  - reference: PMID:39722856
    reference_title: >-
      TANGO2-related rhabdomyolysis symptoms are associated with abnormal autophagy functioning.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TANGO2 mutations were associated with reduced LC3-II levels upon starvation
    explanation: Adds a starvation-conditional autophagy defect in patient primary myoblasts.
  downstream:
  - target: Catabolic-Stress Metabolic Decompensation
    description: >-
      Once fatty acids become the dominant fuel during fasting or febrile
      illness, the exhausted energy reserve tips high-demand tissues into overt
      decompensation.

- name: Catabolic-Stress Metabolic Decompensation
  biological_scale: ORGANISM

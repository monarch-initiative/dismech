      The phenotype associated with variants in TANGO2 may be explained by a dual role of the protein in ER-to-Golgi transport and at the mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: there is a significant delay in the movement of cargo between the endoplasmic reticulum and the Golgi
    explanation: Direct measurement of the trafficking delay in patient-derived fibroblasts.
  - reference: PMID:32909282
    reference_title: >-
      The phenotype associated with variants in TANGO2 may be explained by a dual role of the protein in ER-to-Golgi transport and at the mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We further show that a portion of TANGO2 protein localizes to the mitochondria through a necessary but not sufficient stretch of amino acids at the amino terminus of the protein.
    explanation: Supports the dual trafficking-plus-mitochondrial account of the protein referenced in this node's description.
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Proteomic analysis in fibroblasts revealed significant changes in components of the mitochondrial fatty acid oxidation, plasma membrane, endoplasmic reticulum-Golgi network and secretory pathways.
    explanation: Independent proteomic corroboration that the ER-Golgi and secretory compartments are perturbed.
  downstream:
  - target: Catabolic-Stress Metabolic Decompensation
    description: >-
      Secretory and membrane-transport impairment is proposed to reduce the
      cell's capacity to remodel membranes under stress; the causal weight of
      this edge relative to the lipid arm is not established.

- name: Lipid and Acyl-CoA Homeostasis Failure
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Quantitative lipidomics of TANGO2-null HepG2 cells and patient fibroblasts
    shows a marked rise in lysophosphatidic acid with a reciprocal fall in its
    biosynthetic product phosphatidic acid, consistent with insufficient acyl-CoA
    available for LPA acylation. Triglyceride and lysophospholipid pools rise, the
    free fatty acid pool expands, and lipid droplets enlarge.
    The resulting defect in fatty-acid handling generates high levels of reactive
    oxygen species and promotes lipid peroxidation. Critically, these changes are
    exacerbated by nutrient starvation - the biochemical correlate of the clinical
    fasting trigger - and are reversed by vitamin B5 supplementation, which
    restores the coenzyme A precursor pool.
  chemical_entities:
  - preferred_term: phosphatidic acid
    term:
      id: CHEBI:16337
      label: phosphatidic acid
    modifier: DECREASED

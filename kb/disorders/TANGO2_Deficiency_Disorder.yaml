- name: Folate (Vitamin B9) for Arrhythmia Prevention
  description: >-
    High-dose folate virtually abolishes arrhythmias in patient-derived
    TANGO2-null iPSC cardiomyocytes, and the effect is blocked by methotrexate,
    indicating a requirement for intracellular folate metabolism. Combined B5 plus
    B9 pretreatment prevents the palmitate-and-fasting-induced energetic crisis in
    an independent CRISPR cardiomyocyte model. Human evidence is observational
    only; folate is not established as a standalone antiarrhythmic in TDD and is
    delivered in practice as part of B-complex supplementation.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: folic acid (vitamin B9)
      term:
        id: CHEBI:27470
        label: folic acid
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Cardiomyocyte ATP Depletion and Repolarization Instability
    treatment_effect: INHIBITS
    description: Prevents the energy-dependent action-potential prolongation that underlies TDD arrhythmia.
  target_phenotypes:
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:38855866
    reference_title: >-
      Folate as a potential treatment for lethal ventricular arrhythmias in TANGO2-deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we demonstrated that high-dose folate (vitamin B9) virtually abolishes arrhythmias in TDD iPSC-CMs and that folate's effect was blocked by the dihydrofolate reductase inhibitor methotrexate, supporting the need for intracellular folate to mediate antiarrhythmic effects
    explanation: The primary in vitro antiarrhythmic result and its mechanistic control.

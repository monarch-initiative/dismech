      Clinical and biological characterization of 20 patients with TANGO2 deficiency indicates novel triggers of metabolic crises and no primary energetic defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we describe a cohort of 20 French patients bearing mutations in the TANGO2 gene. We found that the main clinical presentation was the association of neurodevelopmental delay (n = 17), acute metabolic crises (n = 17) and hypothyroidism (n = 12), with a large intrafamilial clinical variability.
    explanation: >-
      Gives both numerator and denominator (17/20 = 85%), which falls in the
      VERY_FREQUENT band (99-80%).

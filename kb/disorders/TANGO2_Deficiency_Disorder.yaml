      term:
        id: CHEBI:17234
        label: glucose
  target_mechanisms:
  - target: Catabolic-Stress Metabolic Decompensation
    treatment_effect: INHIBITS
    description: Reverses the catabolic state driving the crisis by restoring exogenous fuel supply.

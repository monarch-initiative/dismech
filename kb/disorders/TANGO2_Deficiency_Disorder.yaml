- name: Genetic Counseling
  description: >-
    Counselling should cover autosomal-recessive recurrence risk (25% per
    pregnancy when both parents are carriers), marked variable expressivity that
    limits genotype-based prognosis, the requirement to test for deletions as
    well as sequence variants, the availability of carrier, prenatal and
    preimplantation testing once the familial variants are known, and cascade
    testing of apparently asymptomatic siblings so that B-complex vitamins,
    supportive treatment and trigger avoidance can be started before a first
    crisis.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for a TANGO2 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of inheriting neither of the familial pathogenic variants.
    explanation: >-
      Sources the autosomal-recessive recurrence-risk counselling content.
      Evidence source is OTHER because this is a GeneReviews chapter.
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once the TANGO2 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal/preimplantation genetic testing are possible.
    explanation: >-
      Sources the carrier-testing, prenatal and preimplantation testing options.
      Evidence source is OTHER because this is a GeneReviews chapter.
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is appropriate to clarify the genetic status of apparently asymptomatic older and younger sibs of an affected individual by molecular genetic testing to allow prompt initiation of B-complex vitamins, supportive treatment, and avoidance of triggers for TANGO2 spells and acute metabolic crises.
    explanation: >-
      Sources cascade testing of at-risk siblings and the actionable reason for
      it. Evidence source is OTHER because this is a GeneReviews chapter.
  - reference: PMID:42196371
    reference_title: >-
      Genetic and Clinical Characterization of TANGO2 Deficiency Disorder: Insights from the Italian Multicentre Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This cohort expands the mutational and phenotypic spectrum of TDD and highlights the diagnostic value of TANGO2 testing in patients with neurodevelopmental delay or paroxysmal neurological episodes, even in the absence of metabolic crises.
    explanation: Supports the counselling point that testing is warranted on the neurological phenotype alone.

diagnosis:
- name: Molecular genetic testing with deletion/duplication analysis
  description: >-
    Diagnosis is established by identifying biallelic pathogenic TANGO2 variants.
    Because multiexon deletions account for a large share of pathogenic alleles,
    testing must combine sequence analysis with exon-level deletion/duplication
    analysis; exome sequencing alone requires additional copy-number analysis. In
    an individual with a 22q11.2 deletion and suggestive features, the remaining
    TANGO2 allele should be sequenced.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of TANGO2 deficiency is established in a proband with biallelic pathogenic variants in TANGO2 identified by molecular genetic testing.
    explanation: >-
      States the diagnostic standard. Evidence source is OTHER because this is a
      GeneReviews chapter.
  - reference: PMID:30245509
    reference_title: >-
      TANGO2: expanding the clinical phenotype and spectrum of pathogenic variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We illustrate the utility of routine ES data reanalysis whereby discovery of novel disease genes can lead to a diagnosis in previously unsolved cases and the need for additional copy-number variation analysis when ES is performed.
    explanation: Supports the requirement for copy-number analysis alongside exome sequencing.

- name: Crisis laboratory and cardiac evaluation
  description: >-
    During illness or crisis, obtain serial creatine kinase, glucose, blood gas
    and lactate, electrolytes including magnesium, transaminases, renal function
    and urine myoglobin, together with continuous ECG/telemetry with repeated QTc
    assessment and echocardiography. Normal interictal acylcarnitines, lactate,
    carnitine or respiratory-chain studies do not exclude the diagnosis.
  evidence:
  - reference: PMID:34668327
    reference_title: >-
      Variable clinical severity in TANGO2 deficiency: Case series and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Findings such as elevated creatine kinase, hypothyroidism, ketotic hypoglycemia, QT prolongation, or abnormalities of long-chain acylcarnitines and urine dicarboxylic acids should raise clinical suspicion for this life-threatening condition.
    explanation: Lists the laboratory findings that should trigger evaluation for TDD.
  - reference: PMID:32929747
    reference_title: >-
      Clinical and biological characterization of 20 patients with TANGO2 deficiency indicates novel triggers of metabolic crises and no primary energetic defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unexpectedly, plasma acylcarnitines, plasma FGF-21, muscle histology, and mitochondrial spectrometry were mostly normal.
    explanation: Supports the caution that standard metabolic workup is frequently normal and cannot exclude TDD.
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: monitor creatine phosphokinase; EKG to monitor QTc and for development of type 1 Brugada pattern; continuous rhythm monitoring for arrhythmias including premature ventricular contractions, ventricular tachycardia, and torsade de pointes
    explanation: >-
      Sources the creatine kinase, serial QTc and continuous rhythm-monitoring
      elements of the crisis evaluation panel. Evidence source is OTHER because
      this is a GeneReviews chapter.

differential_diagnoses:
- name: 22q11.2 deletion syndrome
  description: >-
    A 22q11.2 deletion is both a differential diagnosis and a risk state: TANGO2
    lies inside the deleted interval, so an individual with 22q11.2 deletion
    syndrome who develops rhabdomyolysis, metabolic crises or ventricular
    arrhythmia should be evaluated for a pathogenic variant on the remaining
    TANGO2 allele rather than having those features attributed to the deletion
    syndrome alone.
  disease_term:
    preferred_term: 22q11.2 deletion syndrome
    term:
      id: MONDO:0018923
      label: 22q11.2 deletion syndrome
  evidence:
  - reference: PMID:38829177
    reference_title: >-
      Multicenter appraisal of comorbid TANGO2 deficiency disorder in patients with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although patients with 22q11.2DS are at substantially higher risk for comorbid TDD, it remains underdiagnosed within 22q11.2DS, likely due to overlapping symptomatology and a lack of knowledge about TDD.
    explanation: Supports both the phenotypic overlap and the recommendation to look for comorbid TDD.

- name: Fatty acid oxidation disorders
  description: >-
    Disorders of mitochondrial fatty-acid oxidation share fasting-triggered
    hypoketotic hypoglycaemia, rhabdomyolysis, cardiomyopathy and arrhythmia, and
    TDD can present with acylcarnitine abnormalities suggestive of a
    beta-oxidation defect. They are distinguished by a consistent, diagnostic
    acylcarnitine profile and by the absence of the TDD neurodevelopmental and
    TANGO2-spell phenotype.
  evidence:
  - reference: PMID:34668327
    reference_title: >-
      Variable clinical severity in TANGO2 deficiency: Case series and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We present biochemical and clinical data to help highlight the features that aid in consideration of this condition in the differential with disorders of fatty acid oxidation.
    explanation: Explicitly frames fatty-acid oxidation disorders as the key differential.

- name: Primary mitochondrial disease
  description: >-
    TDD was initially classified among mitochondrial disorders, and secondary
    respiratory-chain and coenzyme Q10 abnormalities are reported in muscle. It is
    distinguished by the absence of a constitutive primary energetic defect, with
    normal interictal acylcarnitines, FGF-21, muscle histology and mitochondrial
    spectrometry in most patients.
  evidence:
  - reference: PMID:32929747
    reference_title: >-
      Clinical and biological characterization of 20 patients with TANGO2 deficiency indicates novel triggers of metabolic crises and no primary energetic defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mechanistically, TANGO2 disease is unlikely to originate from a primary mitochondrial defect.
    explanation: Supports the distinction from primary mitochondrial cytopathy.
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: a defect of multiple respiratory chain enzymes and coenzyme Q10 (CoQ10 ) in two cases, suggesting a possible secondary defect of oxidative phosphorylation
    explanation: >-
      Recorded as PARTIAL because respiratory-chain abnormalities do occur in a
      minority, which is precisely why the differential is difficult; the authors
      interpret them as secondary.

- name: Inherited long QT and Brugada syndromes
  description: >-
    TDD produces marked QTc prolongation and, in about a quarter of crises, a type
    I Brugada pattern, which can prompt a primary channelopathy diagnosis. TDD is
    distinguished by the crisis-conditional, metabolically triggered nature of the
    repolarization abnormality, its association with rhabdomyolysis and
    encephalopathy, and its poor response to standard antiarrhythmic drugs.
  evidence:
  - reference: PMID:35568137
    reference_title: >-
      Cardiac crises: Cardiac arrhythmias and cardiomyopathy during TANGO2 deficiency related metabolic crises.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During crisis, QTc prolongation occurred in all (median 547 ms; IQR 504-600 ms) and a type I Brugada pattern in 8 (26%).
    explanation: Documents the channelopathy-mimicking electrocardiographic phenotype.
  - reference: PMID:38855866
    reference_title: >-
      Folate as a potential treatment for lethal ventricular arrhythmias in TANGO2-deficiency disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: TDD-associated cardiac arrhythmias are recalcitrant to standard antiarrhythmic medications and constitute the leading cause of death.
    explanation: >-
      Supports the distinguishing feature of refractoriness to conventional
      antiarrhythmic therapy. Evidence source is OTHER because this is the
      framing statement of an iPSC-cardiomyocyte study.

animal_models:
- species: Danio rerio
  genotype: tango2 loss-of-function mutant and morpholino knockdown
  category: Loss-of-function mutant and knockdown, with extrinsic stress challenge
  genes:
  - preferred_term: TANGO2
    term:
      id: hgnc:25439
      label: TANGO2
  description: >-
    Zebrafish tango2 mutants show growth defects, early lethality and heightened
    susceptibility of skeletal muscle to extrinsic triggers, closely mirroring the
    stress-conditional rhabdomyolysis of patients.
    Lipidomics in the same model identified glycerolipid-pathway alterations, and a
    separate knockdown study linked the rhabdomyolysis phenotype to autophagy and
    mitophagy failure with rescue by calpeptin. The model is well suited to trigger
    and rescue studies but does not reproduce the full human neurocardiac
    phenotype.
  associated_phenotypes:
  - Rhabdomyolysis
  - Muscle Weakness
  evidence:
  - reference: PMID:37577943
    reference_title: >-
      Intrinsic and extrinsic regulation of rhabdomyolysis susceptibility by Tango2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we demonstrate that the loss of Tango2 in zebrafish results in growth defects, early lethality and increased susceptibility of skeletal muscle defects in response to extrinsic triggers, similar to TANGO2-deficient patients
    explanation: Establishes the model and its recapitulation of trigger-dependent muscle injury.
  - reference: PMID:39722856
    reference_title: >-
      TANGO2-related rhabdomyolysis symptoms are associated with abnormal autophagy functioning.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Calpeptin treatment was sufficient to rescue the locomotor properties thanks to its beneficial effect on autophagy functioning in zebrafish and to improve LC3-II levels in starved primary muscle cells of TANGO2 patients.
    explanation: Demonstrates a pharmacological rescue acting through autophagy in the same model.

- species: Mus musculus
  genotype: Constitutive Tango2 knockout and oligodendrocyte-specific conditional knockout
  category: Knockout and cell-type-specific conditional knockout, with vitamin B5 rescue
  genes:
  - preferred_term: TANGO2
    term:
      id: hgnc:25439
      label: TANGO2
  description: >-
    Constitutive and oligodendrocyte-specific Tango2 knockout mice reproduce the
    motor deficits of TDD, with cerebellar myelin loss and disturbed phospholipid
    metabolism that are alleviated by vitamin B5. An independent knockout line
    shows impaired intermediate-filament structure with fragmented mitochondrial
    networks and, in male mice, heart defects, reduced muscle function and glucose
    intolerance culminating in desminopathy. Earlier reports of grossly normal
    knockout mice mean that phenotype penetrance in mouse is line- and
    condition-dependent.
  associated_phenotypes:
  - Ataxia
  - Cardiomyopathy
  evidence:
  - reference: PMID:42522778
    reference_title: >-
      Oligodendroglial TANGO2 Regulates Lipid Metabolism to Control Motor Coordination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Behavioral analyses revealed that both constitutive and oligodendrocyte-specific deletion of Tango2 recapitulate the motor deficits associated with individuals with TDD.
    explanation: Establishes motor-phenotype recapitulation and its oligodendroglial origin.
  - reference: PMID:40480980
    reference_title: >-
      TANGO2 binds crystallin alpha B and its loss causes desminopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In male mice, loss of TANGO2 caused heart defects, reduced muscle function and glucose intolerance by remodelling of intermediate filaments, which altered the mitochondrial and cytoplasmic proteomes, N-glycosylation and nucleocytoplasmic O-GlcNAcylation.
    explanation: Documents cardiac, muscular and metabolic phenotypes in an independent knockout line.

- species: Drosophila melanogaster
  genotype: TANGO2 (CG31938) loss-of-function allele
  category: Loss-of-function mutant with starvation and heat-stress challenge and vitamin rescue
  description: >-
    A Drosophila model of TANGO2 loss reproduces starvation sensitivity,
    heat-induced seizure susceptibility and locomotor impairment. It was the system
    in which vitamin B5 rescue was first demonstrated, with a weaker partial rescue
    by vitamin B3, and it provided the rationale for B-complex supplementation in
    patients.
  associated_phenotypes:
  - Seizures
  evidence:
  - reference: PMID:36502486
    reference_title: >-
      Vitamin B5, a coenzyme A precursor, rescues TANGO2 deficiency disease-associated defects in Drosophila and human cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here, we describe a model of TANGO2-related disease in the fruit fly Drosophila melanogaster that recapitulates crucial disease traits.
    explanation: Establishes the fly model and its recapitulation of disease traits.
  - reference: PMID:36502486
    reference_title: >-
      Vitamin B5, a coenzyme A precursor, rescues TANGO2 deficiency disease-associated defects in Drosophila and human cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We also observed a partial rescue of one of the fly defects by vitamin B3, though to a lesser extent than vitamin B5.
    explanation: Documents the vitamin specificity of the rescue in the fly model.

experimental_models:
- name: Patient-derived and CRISPR-engineered iPSC cardiomyocytes
  description: >-
    Induced pluripotent stem cell-derived cardiomyocytes from individuals with TDD
    recapitulate the key electrophysiological abnormalities, and these are rescued
    by adenoviral wild-type TANGO2 expression or CRISPR correction of the
    pathogenic variant, establishing causality. An independent CRISPR line carrying
    the exon 3-9 deletion showed that the electrophysiological defect is
    substrate-conditional and mediated by ATP depletion and TRPM4 upregulation.
    This is currently the most disease-proximal platform for the arrhythmia arm.
  evidence:
  - reference: PMID:38855866
    reference_title: >-
      Folate as a potential treatment for lethal ventricular arrhythmias in TANGO2-deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we established potentially novel patient-derived induced pluripotent stem cell differentiated cardiomyocyte (iPSC-CM) models that recapitulate key electrophysiological abnormalities in TDD. These electrophysiological abnormalities were rescued in iPSC-CMs with either adenoviral expression of WT-TANGO2 or correction of the pathogenic variant using CRISPR editing.
    explanation: Establishes the platform and its genetic-rescue validation.
  - reference: PMID:42389941
    reference_title: >-
      Metabolic crisis and TRPM4 activation cause QT prolongation in TANGO2 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CRISPR/Cas9 were used to generate human induced pluripotent stem cell cardiomyocytes (hiPSC-CMs) carrying a TANGO2 exon 3-9 deletion (TANGO2-/-).
    explanation: Documents the independent isogenic CRISPR cardiomyocyte model.

- name: Patient fibroblasts and primary myoblasts
  description: >-
    Skin fibroblasts and primary myoblasts from affected individuals are the
    workhorse system for trafficking, lipidomic, respiration, reactive oxygen
    species and nutrient-stress assays, and they show reduced TANGO2 protein on
    immunoblot. They cannot model excitable tissue physiology.
  evidence:
  - reference: PMID:31339582
    reference_title: >-
      Clinical presentation and proteomic signature of patients with TANGO2 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Immunoblot analysis detected a significant decrease of TANGO2 protein.
    explanation: Demonstrates that patient-derived cells report the molecular loss of function directly.
  - reference: PMID:39722856
    reference_title: >-
      TANGO2-related rhabdomyolysis symptoms are associated with abnormal autophagy functioning.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Autophagy functioning was analyzed in vitro, in primary skeletal myoblasts from TANGO2 patients, in basal and fasting conditions
    explanation: Illustrates the use of patient primary myoblasts under nutrient stress.

clinical_trials:
- name: NCT05374616
  status: RECRUITING
  description: >-
    Baylor College of Medicine observational natural-history study and
    biorepository for TANGO2-related disorder, collecting longitudinal clinical
    data plus blood, saliva and fibroblast specimens. It is non-interventional
    and is not a treatment-efficacy study, so it cannot resolve the open question
    of whether B-vitamin supplementation prevents crises; it is nonetheless the
    principal registered study in this disorder and the source of the
    natural-history cohorts cited throughout this entry.
  target_phenotypes:
  - preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: clinicaltrials:NCT05374616
    reference_title: >-
      Natural History Study and Establishment of a Biorepository-TANGO2-related Disorder
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The study aims to establish a biorepository of individuals with TANGO2 deficiency to support scientific research and establish a comprehensive clinical database of affected individuals to understand the disease course.
    explanation: The registry's own description of its biorepository and natural-history objectives.

notes: >-
  Evidence-strength calibration. Three claims in this entry are deliberately
  curated below the confidence with which they are often stated in reviews.
  (1) B-vitamin supplementation is recommended in GeneReviews and supported by two
  independent retrospective natural-history analyses plus convergent rescue in
  flies, mice, human cells and iPSC cardiomyocytes, but it has never been tested in
  a randomized controlled trial; dose, formulation, long-term safety in children
  and the identity of the active vitamin(s) all remain open.
  (2) The primary molecular function of TANGO2 is unsettled: the acyl-CoA-binding
  model and the CRYAB/desmin intermediate-filament model are both supported by
  strong primary data and have not been reconciled, and a proposed heme-transport
  role for TANGO2 homologues remains unresolved.
  (3) The mitochondrial phenotype is stress-conditional and secondary; TDD should
  not be curated as a primary respiratory-chain disorder.

  Module conformance. Conformance to metabolic_intoxication_decompensation is
  declared on the energy-deficit, decompensation and encephalopathy nodes only. The
  module's trigger node ("Enzymatic Block in Intermediary Metabolism") is
  deliberately not claimed because TANGO2 is a lipid-binding/trafficking protein
  rather than a metabolic enzyme, and the accumulating species are
  lysophospholipids and free fatty acids rather than a classical organic acid or
  ammonia. Conformance to cardiac_ion_channel_repolarization is declared on the
  altered-action-potential, arrhythmogenic-substrate and
  ventricular-tachyarrhythmia nodes; the module's trigger node ("Cardiac
  Ion-Channel or Calcium-Handling Variant") is deliberately not claimed because TDD
  reaches the arrhythmogenic substrate through metabolic ATP depletion and
  secondary TRPM4 upregulation rather than through an inherited ion-channel
  variant, and TDD hearts are frequently not structurally normal during a crisis.

  Relationship to 22q11.2 deletion syndrome. This entry curates the TDD side of the
  relationship. The 22q11.2 Deletion Syndrome entry independently carries the same
  relationship as a diagnostic red flag and a differential diagnosis; the two
  entries are intended to be complementary and non-contradictory. Neither asserts
  that TANGO2 hemizygosity alone causes TDD - a pathogenic variant on the remaining
  allele is required.

  Deep research provenance. A Falcon (Edison Scientific) deep-research report for
  this disease is archived under research/. It supplied leads only: it reported
  DOIs rather than PMIDs, so every reference used here was independently resolved,
  fetched into references_cache/ with just fetch-reference, and had its snippet
  verified as an exact substring of the cached abstract. Several of the strongest
  sources used here (the 73-patient natural history, the TRPM4/QT mechanism, the
  acyl-CoA-binding and CRYAB structural work, the oligodendroglial mouse) post-date
  or were absent from that report. The report's single artifact is a markdown
  summary table, not an image, so no evidence item carries an images: attachment.

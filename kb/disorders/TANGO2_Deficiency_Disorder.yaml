    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the crisis rather than at the catabolic stress node, because
      an anaesthetic is not obviously a catabolic challenge and the node
      upstream is defined by catabolism; that is a real gap in the graph and
      is better stated than papered over. Graded partial throughout because
      the authors hedge the finding themselves and identify neither the
      responsible agents nor a mechanism, which is also why the practical
      recommendation is perioperative planning rather than a blanket
      contraindication.
    evidence:
    - reference: PMID:32929747
      reference_title: "Clinical and biological characterization of 20 patients with TANGO2 deficiency indicates novel triggers of metabolic crises and no primary energetic defect."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We show previously uncharacterized triggers of metabolic crises in TANGO2 patients, such as some anesthetics and possibly l-carnitine."
      explanation: >-
        Reports previously uncharacterised triggers of metabolic crises
        including some anaesthetics. The crisis is this node, but the sentence
        names no agent and offers no route to it.
  description: >-
    Certain anaesthetic agents were identified as previously uncharacterized
    triggers of metabolic crises in a 20-patient cohort. This warrants
    multidisciplinary perioperative planning involving metabolic, anaesthetic and
    cardiology teams rather than a blanket contraindication, since the specific
    agents and mechanism are not established.

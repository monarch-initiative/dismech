treatments:
- name: Daily B-Complex or Multivitamin Supplementation
  description: >-
    Daily supplementation with a multivitamin containing all eight B vitamins, or
    a B-complex preparation, is the principal disease-directed intervention and is
    recommended in expert-consensus guidance. The evidence base is convergent but
    not randomized: in the 73-patient natural-history study metabolic crises were
    significantly reduced after supplementation was started, and an independent
    natural-history analysis found that multivitamin/B-complex intake greatly
    diminished the risk of cardiac crises. Both observations are retrospective and
    uncontrolled. No randomized controlled trial has been performed, optimal dose
    and formulation are not standardized, and the long-term safety of sustained
    high-dose supplementation in children (including vitamin B6 toxicity, for
    which serum monitoring is advised) is explicitly flagged as unresolved. This
    is therefore curated as a promising, guideline-endorsed but trial-unvalidated
    intervention rather than as proven standard of care.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: pantothenate (vitamin B5)
      term:
        id: CHEBI:29032
        label: (R)-pantothenate
    - preferred_term: folic acid (vitamin B9)
      term:
        id: CHEBI:27470
        label: folic acid
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Lipid and Acyl-CoA Homeostasis Failure
    treatment_effect: RESTORES
    description: >-
      Pantothenate is the biosynthetic precursor of coenzyme A; restoring the CoA
      precursor pool is the proposed route by which B5 reverses the acyl-CoA and
      lipid imbalance.
  target_phenotypes:
  - preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:29369572
    reference_title: >-
      TANGO2 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Daily supplementation with a multivitamin including all eight B vitamins or a B-complex vitamin at the minimum recommended daily allowance for age.
    explanation: >-
      The expert-consensus targeted-therapy recommendation. Evidence source is
      OTHER because this is a GeneReviews chapter, not a trial.
  - reference: PMID:36473599
    reference_title: >-
      Natural history of TANGO2 deficiency disorder: Baseline assessment of 73 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Metabolic crises were significantly decreased after the initiation of B-complex or multivitamin supplementation.
    explanation: The primary observational human signal, from the 73-patient natural-history cohort.
  - reference: PMID:36473599
    reference_title: >-
      Natural history of TANGO2 deficiency disorder: Baseline assessment of 73 patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: We provide the most comprehensive review of natural history of TDD and important observational data suggesting that B-complex or multivitamins may prevent metabolic crises.
    explanation: >-
      Recorded as PARTIAL because the authors frame their own result as
      observational and hedged ("suggesting", "may prevent"), which is the
      epistemic level at which this treatment should be curated.
  - reference: PMID:38855866
    reference_title: >-
      Folate as a potential treatment for lethal ventricular arrhythmias in TANGO2-deficiency disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Our natural history study in patients with TDD suggests that the intake of multivitamin/B complex greatly diminished the risk of cardiac crises in patients with TDD.
    explanation: >-
      Observational support for the cardiac-crisis endpoint specifically.
      Recorded as PARTIAL because the source hedges ("suggests") and because the
      natural history study referred to is the same Baylor cohort reported in
      PMID:36473599, so this is a restatement rather than an independent cohort.
  - reference: PMID:38836374
    reference_title: >-
      TANGO2 deficiency disease is predominantly caused by a lipid imbalance.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: much remains unknown about TANGO2 function, the pathological mechanism of TDD and the possible downsides of sustained vitamin supplementation in children and young adults
    explanation: >-
      Records the explicit safety and evidence caveat from a Perspective article,
      constraining how strongly this treatment can be asserted.
  - reference: PMID:42196371
    reference_title: >-
      Genetic and Clinical Characterization of TANGO2 Deficiency Disorder: Insights from the Italian Multicentre Cohort.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Early supplementation therapy may contribute to clinical stability, though prospective controlled studies are needed.
    explanation: A recent multicentre cohort reaching the same hedged conclusion and explicitly calling for controlled trials.
  - reference: PMID:37381587
    reference_title: >-
      Management of acute metabolic crisis in TANGO2 deficiency: a case report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Vitamin B-complex was started. Our patient's mental status and rhabdomyolysis improved dramatically, and cardiac crises ended without Torsades de pointes, ventricular tachycardia and/or fibrillation or myocardial dysfunction.
    explanation: >-
      A single uncontrolled case of B-complex use during an acute crisis;
      recorded as PARTIAL because temporal improvement in one patient cannot be
      separated from the natural resolution of a crisis under supportive care.

- name: Vitamin B5 (Pantothenate)
  description: >-
    Pantothenate, the coenzyme A precursor, is the best-characterized single
    active component of B-complex therapy in model systems. It improves multiple
    TANGO2 loss-of-function defects in Drosophila, rescues membrane-trafficking
    defects in human cells, reverses the lipid-profile abnormalities of
    TANGO2-deficient human cells and flies, and alleviates motor deficits and
    cerebellar myelin loss in Tango2 knockout mice. Human evidence is limited to
    single-patient reports of symptomatic improvement on B5 monotherapy; it is not
    established as a standalone therapy.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: pantothenate (vitamin B5)
      term:
        id: CHEBI:29032
        label: (R)-pantothenate
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Lipid and Acyl-CoA Homeostasis Failure
    treatment_effect: RESTORES
    description: Restores the coenzyme A precursor pool needed for acyl-CoA-dependent lipid acylation.
  evidence:
  - reference: PMID:36502486
    reference_title: >-
      Vitamin B5, a coenzyme A precursor, rescues TANGO2 deficiency disease-associated defects in Drosophila and human cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We demonstrate that vitamin B5 specifically improves multiple defects associated with TANGO2 loss-of-function in Drosophila
    explanation: The primary in vivo rescue result in the Drosophila model.
  - reference: PMID:36502486
    reference_title: >-

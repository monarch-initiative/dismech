    explanation: Independent CRISPR cardiomyocyte model showing combined B5/B9 pretreatment prevents the energetic crisis.

- name: Acute Crisis Management with Dextrose-Containing Fluids and Nutrition
  description: >-
    During an acute crisis, admission for intravenous hydration with
    glucose-containing fluids, correction of hypoglycaemia, and prompt restoration
    of full enteral or parenteral nutrition including vitamin supplementation is
    the mainstay. Fluid rate must be adjusted against echocardiographic assessment
    of cardiac function to avoid pulmonary oedema. Glucose alone appears
    insufficient: initiation of feeds was associated with a reduction in
    ventricular tachycardia events, suggesting complete nutrition rather than
    dextrose alone is what matters.
  treatment_term:
    preferred_term: fluid replacement therapy
    term:
      id: NCIT:C66896
      label: Hydration Therapy
    therapeutic_agent:

genetic:
- name: TRPV4
  gene_term:
    preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense variants in TRPV4 cause SEDM. Notably, some SEDM
    patients carry substitutions previously reported in metatropic dysplasia,
    so genotype does not cleanly predict which TRPV4 skeletal phenotype occurs.
  evidence:
  - reference: PMID:20503319
    reference_title: "Spondylo-epiphyseal dysplasia, Maroteaux type (pseudo-Morquio syndrome type 2), and parastremmatic dysplasia are caused by TRPV4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six patients were found to have heterozygous TRPV4 mutations; three patients had unreported mutations, while three patients had mutations previously described in association with metatropic dysplasia."
    explanation: >-
      Establishes TRPV4 as causal in 6/6 tested patients and documents the
      genotype-phenotype overlap with metatropic dysplasia.
differential_diagnoses:
- name: Morquio Syndrome (MPS IVA)
  description: >-
    SEDM was historically called pseudo-Morquio syndrome type 2 because it
    mimics Morquio syndrome radiographically. The distinguishing features are
    the absence of corneal opacity, of keratan sulfate excretion, and of any
    biochemical abnormality.
  evidence:
  - reference: PMID:2229114
    reference_title: "Spondyloepiphyseal dysplasia of Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients do not have corneal opacities or increased excretion of keratosulphate."
    explanation: >-
      Names the two findings that separate SEDM from Morquio syndrome at the
      bedside and in the laboratory.
- name: Spondylometaphyseal Dysplasia Kozlowski Type
  description: >-
    A sibling TRPV4 dysplasia with metaphyseal rather than epiphyseal
    predominance, already curated in dismech.
- name: Metatropic Dysplasia
  description: >-
    The most severe member of the TRPV4 skeletal dysplasia family. Some SEDM
    patients carry TRPV4 substitutions previously reported in metatropic
    dysplasia, so molecular findings alone may not separate them.
discussions:
- discussion_id: sedm_variant_phenotype_discordance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#TRPV4 Channel Dysfunction in Chondrocytes
  prompt: >-
    Why do TRPV4 substitutions that cause metatropic dysplasia in some
    individuals produce the much milder Maroteaux-type phenotype in others?
  rationale: >-
    PMID:20503319 reports that three of six SEDM patients carried substitutions
    previously described in metatropic dysplasia. This breaks the usual
    assumption that a channelopathy's severity tracks the variant's functional
    effect, and means the pathophysiology node above cannot currently be
    annotated with a variant-specific gain- or loss-of-function claim. Modifier
    alleles, mosaicism, and genetic background are all untested explanations.
- discussion_id: sedm_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying therapy for SEDM, or any evidence that TRPV4
    channel modulators alter skeletal outcome?
  rationale: >-
    No treatments section is curated because management is entirely supportive
    and orthopedic. No trial or cohort evidence for a disease-modifying therapy
    was found for this entity.
notes: >-
  MONDO labels this concept "spondyloepimetaphyseal dysplasia, Maroteaux type"
  while essentially all of the primary literature (PMID:2229114, PMID:20503319,
  PMID:22791502, PMID:33774370) uses "spondyloepiphyseal dysplasia Maroteaux
  type". The disease_term follows the MONDO label; the literature spelling is
  recorded as the first synonym. This is a naming difference, not two concepts.

  Functional-impact annotation was deliberately left off the TRPV4
  pathophysiology node. Sibling TRPV4 entries in dismech annotate
  gain-of-function on the basis of in vitro channel studies of their own
  variants; no equivalent functional study of SEDM-specific variants was found,
  and the shared-variant finding in PMID:20503319 argues against assuming the
  metatropic dysplasia mechanism transfers. See the knowledge gap above.

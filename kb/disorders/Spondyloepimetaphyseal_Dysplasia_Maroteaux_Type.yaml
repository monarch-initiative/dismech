differential_diagnoses:
- name: Morquio Syndrome (MPS IVA)
  description: >-
    SEDM was historically called pseudo-Morquio syndrome type 2 because it
    mimics Morquio syndrome radiographically. The distinguishing features are
    the absence of corneal opacity, of keratan sulfate excretion, and of any
    biochemical abnormality.
  evidence:
  - reference: PMID:2229114
    reference_title: "Spondyloepiphyseal dysplasia of Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients do not have corneal opacities or increased excretion of keratosulphate."
    explanation: >-
      Names the two findings that separate SEDM from Morquio syndrome at the
      bedside and in the laboratory.
- name: Spondylometaphyseal Dysplasia Kozlowski Type
  description: >-
    A sibling TRPV4 dysplasia with metaphyseal rather than epiphyseal
    predominance, already curated in dismech.
- name: Metatropic Dysplasia
  description: >-
    The most severe member of the TRPV4 skeletal dysplasia family. Some SEDM
    patients carry TRPV4 substitutions previously reported in metatropic
    dysplasia, so molecular findings alone may not separate them.
discussions:
- discussion_id: sedm_orphanet_only_features
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#
  prompt: >-
    What are the quantitative penetrance and age-at-onset distributions of
    osteoarthritis, pelvic dysplasia, and short neck across molecularly
    confirmed TRPV4-SEDM patients?
  rationale: >-
    Orphanet (ORPHA:263482) and individual case reports (PMID:14755468) list
    dysplastic pelvis/small square iliac wings, short neck, osteoporosis, and
    osteoarthritis in SEDM, but no published molecularly confirmed cohort
    aggregates per-feature frequencies or age-stratified osteoarthritis onset
    separately from sibling TRPV4 skeletal dysplasias.
- discussion_id: sedm_variant_phenotype_discordance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#TRPV4 Channel Dysfunction in Chondrocytes
  prompt: >-
    Why do TRPV4 substitutions that cause metatropic dysplasia in some
    individuals produce the much milder Maroteaux-type phenotype in others?
  rationale: >-
    PMID:20503319 reports that three of six SEDM patients carried substitutions
    previously described in metatropic dysplasia. This breaks the usual
    assumption that a channelopathy's severity tracks the variant's functional
    effect, and means the pathophysiology node above cannot currently be
    annotated with a variant-specific gain- or loss-of-function claim. Modifier
    alleles, mosaicism, and genetic background are all untested explanations.
  evidence:
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specific phenotype, age of onset, and disease severity cannot be accurately predicted because of reduced penetrance and highly variable expressivity."
    explanation: >-
      GeneReviews states the unpredictability prospectively for the whole TRPV4
      family, which reframes the shared-variant observation in PMID:20503319 as
      a recognized property of these disorders rather than an artefact of one
      six-patient series. That is what makes this a genuine open question about
      mechanism rather than a sampling complaint.
- discussion_id: sedm_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying therapy for SEDM, or any evidence that TRPV4
    channel modulators alter skeletal outcome?
  rationale: >-
    Management is entirely supportive and orthopedic — physical therapy,
    activity precautions, cervical/odontoid and scoliosis surveillance, and
    orthopedic surgery when indicated (PMID:24830047). No clinical trial or
    cohort evidence for a disease-modifying therapy, or for pharmacological
    TRPV4 channel modulation altering human skeletal outcomes, has been
    established for this entity.
notes: >-
  MONDO labels this concept "spondyloepimetaphyseal dysplasia, Maroteaux type"
  (matching Orphanet ORPHA:263482 and GeneReviews PMID:24830047), while much of
  the primary clinical literature (PMID:2229114, PMID:20503319, PMID:22791502,
  PMID:33774370) uses "spondyloepiphyseal dysplasia Maroteaux type". Both
  spellings denote the same clinical-radiographic entity (OMIM:184095).

  Published reviews differ on nosological placement within the TRPV4 skeletal
  dysplasia spectrum: PMID:22791502 treats SEDM as a variant phenotype
  deviating from the main TRPV4 severity series, whereas GeneReviews
  (PMID:24830047, updated 2025) orders it as an intermediate severity tier
  between Kozlowski-type spondylometaphyseal dysplasia and metatropic dysplasia.
  Both perspectives are represented with indirect support rather than resolved
  by curator preference.

  Gain- vs loss-of-function directionality is intentionally left at
  DYSREGULATED on the TRPV4 pathophysiology node: while sibling TRPV4 skeletal
  dysplasias show constitutive channel gain-of-function in vitro, dedicated
  electrophysiological characterization of SEDM-specific cohorts is lacking and
  PMID:20503319 demonstrates substantial phenotypic overlap with metatropic
  dysplasia alleles.

    reference_title: "Spondyloepiphyseal dysplasia of Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mode of transmission appears to be autosomal dominant."
    explanation: >-
      The original four-patient clinical series describing the entity reports
      autosomal dominant transmission.
  - reference: PMID:20503319
    reference_title: "Spondylo-epiphyseal dysplasia, Maroteaux type (pseudo-Morquio syndrome type 2), and parastremmatic dysplasia are caused by TRPV4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six patients were found to have heterozygous TRPV4 mutations; three patients had unreported mutations, while three patients had mutations previously described in association with metatropic dysplasia."
    explanation: >-
      All six tested patients carried heterozygous (not biallelic) TRPV4
      variants, consistent with dominant inheritance.
classifications:

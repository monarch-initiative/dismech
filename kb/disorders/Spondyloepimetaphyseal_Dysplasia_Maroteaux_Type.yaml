- name: Disproportionate Short-Trunk Stature
  biological_scale: ORGANISM
  description: >-
    Disproportionate short stature with a short trunk, not evident at birth and
    becoming apparent in childhood. Vertebral flattening supplies the trunk
    component; GeneReviews records long-bone involvement in the four more severe
    TRPV4 skeletal dysplasias, so the vertebrae are not the sole contributor.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
    description: >-
      This node is what the disproportionate short stature phenotype records.
  evidence:
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All TRPV4-related skeletal dysplasias are characterized by brachydactyly; the four most severe forms have short stature that varies from mild to severe with progressive spinal deformity and involvement of the long bones and pelvis."
    explanation: >-
      Establishes short stature and names both the spinal and long-bone
      contributions across the four more severe TRPV4 dysplasias as a group,
      without apportioning their relative contributions for SEDM specifically.

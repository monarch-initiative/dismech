    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The known variant phenotypes are spondyloepiphyseal dysplasia Maroteaux type (Pseudo-Morquio type 2), parastremmatic dysplasia, and"
    explanation: >-
      Places SEDM among the recognized TRPV4 bone dysplasia phenotypes, whose
      shared substrate is the growth plate. Note this source calls it a variant
      phenotype that deviates from the general pattern, which the GeneReviews
      item below reads differently.
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The five autosomal dominant skeletal dysplasias are (from mildest to most severe) familial digital arthropathy with brachydactyly, brachyolmia, spondylometaphyseal dysplasia (Kozlowski type), spondyloepimetaphyseal dysplasia (Maroteaux type), and metatropic dysplasia."
    explanation: >-
      The GeneReviews TRPV4 chapter places SEDM as a severity tier between
      Kozlowski and metatropic dysplasia, rather than as a deviating variant;
      marked INDIRECT and OTHER because it records a nosological ordering across
      the TRPV4 spectrum rather than direct cellular growth-plate measurements,
      and contrasts with PMID:22791502 on that ordering.
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All TRPV4-related skeletal dysplasias are characterized by brachydactyly; the four most severe forms have short stature that varies from mild to severe with progressive spinal deformity and involvement of the long bones and pelvis."
    explanation: >-
      Describes the observed human clinical features shared across the TRPV4
      skeletal dysplasias, including the progressive spinal deformity and
      long-bone involvement seen in SEDM.
  - reference: PMID:33774370
    reference_title: "Natural history of TRPV4-Related disorders: From skeletal dysplasia to neuromuscular phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "skeletal dysplasia associated with TRPV4 pathogenic variants share some clinical features such as short stature with short trunk, spinal and pelvic changes with varying degrees of long bone involvement"
    explanation: >-
      Independent cohort description of the shared TRPV4 skeletal-dysplasia
      axial, pelvic, and appendicular endochondral features.
  downstream:
  - target: Vertebral Body Flattening
    causal_link_type: DIRECT
    description: >-
      Failure of normal vertebral body growth produces flattened vertebrae.
  - target: Epiphyseal Dysplasia
    causal_link_type: DIRECT
    description: >-
      Disordered chondrocyte maturation in secondary ossification centers

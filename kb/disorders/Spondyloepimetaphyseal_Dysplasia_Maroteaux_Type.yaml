      spondyloepiphyseal spelling.
pathophysiology:
- name: TRPV4 Channel Dysfunction in Chondrocytes
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants in TRPV4 alter the gating of a
    calcium-permeable mechanosensitive cation channel in chondrocytes. Several
    of the variants found in SEDM patients are the same substitutions reported
    in metatropic dysplasia, so the variant alone does not determine which
    phenotype in the TRPV4 family results.
  genetic_context:
    gene:
      preferred_term: TRPV4
      term:
        id: hgnc:18083
        label: TRPV4
    allele_type: missense
    zygosity: HETEROZYGOUS
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Calcium Ion Transmembrane Transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  evidence:
  - reference: PMID:20503319
    reference_title: "Spondylo-epiphyseal dysplasia, Maroteaux type (pseudo-Morquio syndrome type 2), and parastremmatic dysplasia are caused by TRPV4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We tested the hypothesis that a further condition, Spondylo-epiphyseal dysplasia (SED), Maroteaux type (MIM 184095; also known as pseudo-Morquio syndrome type 2), could be caused by TRPV4 mutations."
    explanation: >-
      Establishes TRPV4 as the tested and confirmed causal gene for SEDM.
  - reference: PMID:20503319
    reference_title: "Spondylo-epiphyseal dysplasia, Maroteaux type (pseudo-Morquio syndrome type 2), and parastremmatic dysplasia are caused by TRPV4 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that SED Maroteaux type and parastremmatic dysplasia are part of the TRPV4 dysplasia family and that TRPV4 mutations show considerable variability in phenotypic expression resulting in distinct clinical-radiographic phenotypes."
    explanation: >-
      Supports membership in the TRPV4 dysplasia family, but only partially
      supports a variant-specific mechanism: the authors attribute the distinct
      phenotypes to variable expression rather than to distinct variant effects.
  downstream:
  - target: Disordered Growth Plate Chondrocyte Differentiation
    description: >-
      Altered chondrocyte calcium handling disrupts the ordered proliferation
      and hypertrophy of growth plate chondrocytes.
- name: Disordered Growth Plate Chondrocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    Disturbed chondrocyte differentiation in the vertebral and epiphyseal growth
    plates produces the characteristic platyspondyly and epiphyseal dysplasia.
    The mechanistic detail linking TRPV4 channel dysfunction to the specific
    Maroteaux-type radiographic pattern — as opposed to the Kozlowski or
    metatropic patterns — has not been established.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Chondrocyte Differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22791502
    reference_title: "TRPV4-associated skeletal dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The known variant phenotypes are spondyloepiphyseal dysplasia Maroteaux type (Pseudo-Morquio type 2), parastremmatic dysplasia, and"
    explanation: >-
      Places SEDM among the recognized TRPV4 bone dysplasia phenotypes, whose
      shared substrate is the growth plate.
  downstream:
  - target: Platyspondyly and Short-Trunk Short Stature
    description: >-
      Failure of normal vertebral body growth produces flattened vertebrae and
      disproportionate short-trunk stature.
- name: Platyspondyly and Short-Trunk Short Stature
  biological_scale: ORGANISM
  description: >-
    Generalized platyspondyly without the anterior tongue-like vertebral
    deformity of Morquio syndrome, producing disproportionate short-trunk short
    stature that is not evident at birth and becomes apparent in childhood.
  evidence:
  - reference: PMID:2229114
    reference_title: "Spondyloepiphyseal dysplasia of Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platyspondylysis is present but there are no anterior tongue-like deformities of the vertebral bodies."
    explanation: >-
      Documents the platyspondyly and the specific radiographic feature that
      distinguishes it from Morquio syndrome.

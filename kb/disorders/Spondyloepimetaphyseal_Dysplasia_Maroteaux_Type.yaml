- name: TRPV4
  gene_term:
    preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: SUPPORTIVE
    classified_by: ORPHANET
    external_id: ORPHA:263482
    evidence:
    - reference: ORPHA:263482
      reference_title: "Spondyloepimetaphyseal dysplasia, Maroteaux type"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TRPV4 | transient receptor potential cation channel subfamily V member 4 | hgnc:18083 | Disease-causing germline mutation(s) in"
      explanation: >-
        Orphanet asserts germline TRPV4 mutations as causal for SEDM
        (MONDO:0008473). ClinGen's Definitive TRPV4 skeletal-dysplasia curation
        is against the lumped parent entity MONDO:0018240 rather than SEDM
        specifically.
  notes: >-
    Heterozygous missense variants in TRPV4 cause SEDM. Notably, some SEDM
    patients carry substitutions previously reported in metatropic dysplasia,
    so genotype does not cleanly predict which TRPV4 skeletal phenotype occurs.
  evidence:
  - reference: PMID:20503319
    reference_title: "Spondylo-epiphyseal dysplasia, Maroteaux type (pseudo-Morquio syndrome type 2), and parastremmatic dysplasia are caused by TRPV4 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six patients were found to have heterozygous TRPV4 mutations; three patients had unreported mutations, while three patients had mutations previously described in association with metatropic dysplasia."
    explanation: >-
      Establishes TRPV4 as causal in 6/6 tested patients and documents the
      genotype-phenotype overlap with metatropic dysplasia.
treatments:
- name: Cervical Spine and Odontoid Surveillance
  description: >-
    Assessment for odontoid hypoplasia before school age and before any
    procedure requiring general anaesthesia. This is the clinically actionable
    item in this entry: undetected odontoid hypoplasia turns routine airway
    positioning into a cervical-cord risk.
  action_category: SCREENING
  treatment_term:
    preferred_term: cervical spine imaging
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For skeletal dysplasias, annual evaluation for joint pain and scoliosis; assessment for odontoid hypoplasia before a child reaches school age and before surgical procedures involving general anesthesia; annual hearing assessment; and assessment of weight, height, and weight-for-height at each visit."
    explanation: >-
      States the odontoid assessment and its pre-anaesthetic timing.

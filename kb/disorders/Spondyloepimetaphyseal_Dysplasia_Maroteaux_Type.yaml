name: Spondyloepimetaphyseal Dysplasia Maroteaux Type
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondyloepimetaphyseal dysplasia, Maroteaux type (SEDM; also called
  spondyloepiphyseal dysplasia Maroteaux type or pseudo-Morquio syndrome type 2)
  is an autosomal dominant skeletal dysplasia caused by heterozygous missense
  variants in TRPV4, which encodes a calcium-permeable mechanosensitive cation
  channel expressed in chondrocytes. Affected individuals have disproportionate
  short-trunk short stature with platyspondyly, epiphyseal dysplasia,
  brachydactyly, genu valgum and progressive scoliosis, but — unlike the Morquio
  syndrome it clinically mimics — no corneal clouding, no keratan sulfate
  excretion and no other biochemical abnormality. The disorder occupies a
  distinct position in the TRPV4 skeletal dysplasia family. Sources differ on
  how to place it: the 2012 review (PMID:22791502) treats it as a variant
  phenotype that overlaps the main severity series but deviates from it, while
  the GeneReviews TRPV4 chapter (PMID:24830047, updated 2025) explicitly orders
  it as a tier, between spondylometaphyseal dysplasia Kozlowski type and
  metatropic dysplasia. Both readings are curated below rather than one being
  chosen. Management is supportive and orthopedic; no disease-modifying therapy
  exists.

  - target: Genu Valgum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Asymmetric epiphyseal and metaphyseal growth around the knee leads to
      genu valgum deformity.
  - target: Hypoplastic Iliac Wings
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired pelvic endochondral ossification produces small, square iliac

pathophysiology:
- name: TRPV4 Channel Dysfunction in Chondrocytes
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants in TRPV4 alter the gating of a
    calcium-permeable mechanosensitive cation channel in chondrocytes. Several
    of the variants found in SEDM patients are the same substitutions reported
    in metatropic dysplasia, so the variant alone does not determine which
    phenotype in the TRPV4 family results.

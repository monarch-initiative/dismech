inheritance:
- name: Autosomal Dominant
  description: >-
    Autosomal dominant inheritance. Heterozygous TRPV4 missense variants are
    causal; both inherited and de novo variants occur across the TRPV4 skeletal
    dysplasia family.
  inheritance_term:

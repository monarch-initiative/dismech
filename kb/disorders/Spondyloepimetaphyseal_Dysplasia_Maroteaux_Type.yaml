  - target: Pectus Carinatum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal costochondral and sternal growth-plate development produces
      anterior chest-wall protrusion.
  - target: Osteoporosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Generalized osteochondrodysplasia and altered bone remodeling manifest
      radiographically with osteoporosis.
  - target: Osteoarthritis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Irregular dysplastic epiphyseal articular surfaces predispose to
      premature secondary osteoarthritis.
- name: Vertebral Body Flattening
  biological_scale: TISSUE
  description: >-
    Generalized platyspondyly without the anterior tongue-like vertebral
    deformity of Morquio syndrome. A tissue-level structural outcome of the
    disordered growth plate, kept separate from the organism-level stature
    deficit it contributes to.
  locations:

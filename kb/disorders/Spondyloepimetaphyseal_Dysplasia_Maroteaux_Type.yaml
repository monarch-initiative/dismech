    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 8 "TRPV4 group".
      Assigned by analogy with the sibling TRPV4 entries already curated in
      dismech (Brachyolmia, Spondylometaphyseal Dysplasia Kozlowski Type,

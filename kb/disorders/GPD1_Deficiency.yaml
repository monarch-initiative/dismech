name: GPD1 Deficiency
creation_date: "2026-09-23T14:58:06Z"
category: Mendelian
synonyms:
- transient infantile hypertriglyceridemia and hepatosteatosis
- transient infantile hypertriglyceridemia and fatty liver
- transient infantile hypertriglyceridemia
- HTGTI
- glycerol-3-phosphate dehydrogenase 1 deficiency
description: >-
  Autosomal recessive inborn error of glycerolipid and carbohydrate metabolism
  caused by biallelic loss-of-function variants in GPD1, which encodes the
  cytosolic NAD+-dependent glycerol-3-phosphate dehydrogenase that interconverts
  dihydroxyacetone phosphate (DHAP) and glycerol-3-phosphate (G3P). Children
  present in the first two years of life (median age about six to nine months
  in pooled literature reviews) with hepatomegaly, hepatic steatosis, raised
  transaminases and moderate to severe hypertriglyceridemia, sometimes with
  failure to thrive, vomiting, splenomegaly, hypercholesterolemia or, less
  often, fasting hypoglycemia. Liver biopsy shows macro- and microvesicular
  steatosis with fibrosis in most biopsied patients and cirrhosis in a
  minority, sometimes already in infancy; a hepatocellular adenoma has been
  reported once. The MONDO and Orphanet name calls the disorder "transient",
  after the decline of triglycerides with age in the founding cohort, but
  pooled follow-up of the published cases finds triglycerides and
  transaminases normalizing in only about three in ten patients, with mild
  hypertriglyceridemia persisting into the third and fourth decades. Severity
  varies even within a family carrying the same variant. How loss of an enzyme
  that makes the triglyceride backbone produces more rather than less hepatic
  and plasma triglyceride is unresolved: three incompatible mechanistic
  proposals are recorded below, and the only animal model, the Gpd1-null
  BALB/cHeA mouse, points the other way.
disease_term:
  preferred_term: transient infantile hypertriglyceridemia and hepatosteatosis
  term:
    id: MONDO:0013771
    label: transient infantile hypertriglyceridemia and hepatosteatosis
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
  - classification_value: GASTROINTESTINAL
    notes: >-
      The dominant clinical burden is steatotic liver disease with fibrosis and,
      in a minority, cirrhosis.
parents:
- Inborn Error of Metabolism
mechanistic_hypotheses:
- hypothesis_group_id: acyl_dhap_diversion
  hypothesis_label: Diversion of excess DHAP into glycerolipid synthesis through the acyl-DHAP route
  status: EMERGING
  description: >-
    With GPD1 absent, DHAP produced by glycolysis is not reduced to G3P and is
    proposed to be acylated directly, entering glycerolipid synthesis through the
    acyl-DHAP pathway and driving hepatocellular triglyceride accumulation. The
    proposal is consistent with the raised DHAP and lowered G3P measured in
    Gpd1-null mouse tissue, but neither hepatic DHAP, acyl-DHAP flux nor hepatic
    G3P has been measured in a patient.
  evidence:
  - reference: PMID:24549054
    reference_title: A compound heterozygous mutation in GPD1 causes hepatomegaly, steatohepatitis, and hypertriglyceridemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of fatty liver in our patient may be due to acylation of excess DHAP."
    explanation: >-
      The authors' own mechanistic proposal, stated as a possibility in the
      discussion of a single case; no metabolite or flux measurement accompanies
      it, hence OTHER.
  - reference: PMID:40216993
    reference_title: "GPD1 deficiency-a rare, overlooked cause of liver disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "It has been suggested that the fatty liver observed in all patients with GPD1 deficiency on ultrasonography or other imaging may result from excessive acylation of dihydroxyacetone phosphate (DHAP)"
    explanation: >-
      A 2025 case report restating the acyl-DHAP proposal from earlier
      literature; its next sentence says the detailed mechanisms remain
      unclear.
- hypothesis_group_id: hepatic_g3p_retention
  hypothesis_label: Reduced G3P-to-DHAP conversion increases hepatic G3P for triglyceride synthesis
  status: EMERGING
  description: >-
    Proposes that hypertriglyceridemia results because loss of GPD1 prevents
    oxidation of G3P back to DHAP, enlarging the hepatic G3P pool available for
    triglyceride synthesis. This runs opposite to the acyl-DHAP proposal on the
    direction of the metabolite change, and opposite to the low tissue G3P and
    high DHAP measured in the Gpd1-null mouse. It has not been tested in patient
    tissue.
  evidence:
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Hypertriglyceridemia may result from reduced conversion of G3P to DHAP, increasing the hepatic G3P for triglyceride synthesis."
    explanation: >-
      States the G3P-retention proposal, attributed by the authors to earlier
      literature; it is a stated possibility, not a measurement.
  - reference: PMID:11147825
    reference_title: Mouse lacking NAD+-linked glycerol phosphate dehydrogenase has normal pancreatic beta cell function but abnormal metabolite pattern in skeletal muscle.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Levels of glycerol phosphate (low) and dihydroxyacetone phosphate (high) were very abnormal in nonislet tissue, especially in skeletal muscle."
    explanation: >-
      In the Gpd1-null mouse, tissue G3P is low and DHAP high, the opposite of
      the enlarged G3P pool this proposal requires. The measurement is in mouse
      and is most marked in muscle, so it does not settle what happens in human
      liver.
- hypothesis_group_id: hepatic_triglyceride_secretion
  hypothesis_label: Increased hepatic triglyceride secretion drives the hypertriglyceridemia
  status: EMERGING
  description: >-
    Proposes that the plasma hypertriglyceridemia reflects increased secretion of
    triglyceride by hepatocytes, based on a single HepG2 experiment in which a
    mutant GPD1 cDNA was overexpressed on top of the endogenous enzyme. That
    design tests whether the mutant protein does something, not what its
    absence does, so it is weak support for a loss-of-function mechanism. A
    later review restating the founding paper lists decreased hepatic
    triglyceride output instead, so the direction of hepatic export is itself
    unsettled.
  evidence:
  - reference: PMID:22226083
    reference_title: Transient infantile hypertriglyceridemia, fatty liver, and hepatic fibrosis caused by mutated GPD1, encoding glycerol-3-phosphate dehydrogenase 1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of mutant GPD1 in HepG2 cells, in comparison to overexpression of wild-type GPD1, resulted in increased secretion of triglycerides (p = 0.01)."
    explanation: The single experimental observation behind the secretion proposal.
  - reference: PMID:41971245
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of GPD1 Gene Variants: A Cause of Hepatomegaly and Hepatic Steatosis in Early Childhood."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Therefore, GPD1 mutations lead to increased TG synthesis in the liver, decreased output from the liver, increased inflow of fatty acids into the liver, and impaired hepatic beta-oxidation causing nonalcoholic hepatic steatosis"
    explanation: >-
      A 2026 review, restating the founding paper, lists decreased rather than
      increased hepatic output; the two accounts disagree on the direction of
      triglyceride export. Neither is a measurement in patients.
pathophysiology:
- name: GPD1 Loss of Function
  description: >-
    Biallelic GPD1 variants (splice-site, nonsense, frameshift, missense and a
    whole-gene deletion) abolish or reduce the cytosolic NAD+-dependent
    glycerol-3-phosphate dehydrogenase. The founding homozygous splice-acceptor
    variant c.361-1G>C produces aberrantly spliced mRNA predicted to truncate the
    protein, and GPD1 protein was absent on western blot of liver from a
    compound heterozygote carrying a deletion and p.Arg229Gln. Enzyme activity
    has not been reported for most missense alleles.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

- name: Progressive Hepatic Fibrosis
  description: >-
    Portal fibrosis is present in most biopsied patients and progresses to
    cirrhosis in a minority, documented from infancy to adolescence. Sequential
    biopsies at 3 and 15 years in one boy showed progression from incomplete
    cirrhosis to diffuse nodular transformation. Decompensated liver disease has
    not been reported. Biopsy is done selectively, so the fibrosis and cirrhosis
    fractions among biopsied patients overstate their frequency in all
    patients. Conformance to the fibrosis node of the steatosis module is not
    claimed, because stellate-cell activation has not been examined in this
    disorder.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver biopsy (n = 18) demonstrated steatosis in all, fibrosis in 94.4%, and cirrhosis in 22.2%."
    explanation: Pooled biopsy findings across the published cases.
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first showed incomplete cirrhosis, inflammation, and steatosis and the second showed diffuse nodular transformation of liver and extensive steatosis, suggesting slow disease progression."
    explanation: Sequential biopsies in one patient document progression rather than regression of the liver disease.
  downstream:
  - target: Hepatic fibrosis
    causal_link_type: DIRECT
  - target: Cirrhosis
    causal_link_type: DIRECT
phenotypes:
- category: Metabolic
  name: Hypertriglyceridemia
  description: >-
    Moderate to severe fasting hypertriglyceridemia, highest in early infancy and
    inversely related to age at presentation. It declines in most but normalizes
    in only about three in ten patients on follow-up, and mild
    hypertriglyceridemia has been reported persisting into the third and fourth
    decades.
  phenotype_term:
    preferred_term: Hypertriglyceridemia
    term:
      id: HP:0002155
      label: Hypertriglyceridemia
    onset:
      onset_category: INFANTILE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertriglyceridemia (97.2%) was nearly universal, 100% had fatty liver, and hypoglycaemia (11.2%) was uncommon."
    explanation: Frequency in 36 pooled published cases supports VERY_FREQUENT.
  - reference: PMID:36051699
    reference_title: Clinical characteristics and variant analyses of transient infantile hypertriglyceridemia related to GPD1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The laboratory investigations showed that 96.8% of them had hypertriglyceridemia (HTG) with a median level of 3.1 (2.1, 5.5) mmol/L, but only 30.0% had returned to normal during follow-up."
    explanation: Independent pooled series of 31 cases; also documents that most patients do not normalize.
  - reference: PMID:41839820

genetic:
- name: Biallelic GPD1 variants
  gene_term:
    preferred_term: GPD1
    term:
      id: hgnc:4455
      label: GPD1
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:27368975
      reference_title: Expanding the molecular diversity and phenotypic spectrum of glycerol 3-phosphate dehydrogenase 1 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transient infantile hypertriglyceridemia (HTGT1; OMIM #614480) is a rare autosomal recessive disorder, which manifests in early infancy with transient hypertriglyceridemia, hepatomegaly, elevated liver enzymes, persistent fatty liver and hepatic fibrosis."
      explanation: States autosomal recessive inheritance.
  features: >-
    Most patients are homozygous, reflecting consanguinity and founder alleles:
    c.361-1G>C (p.Ile119fs) in Palestinian and Israeli Arab families,
    p.Gly299Arg in the Czech population, p.Thr251Asnfs*10 in Saudi Arabia and
    c.500G>A (p.Gly167Asp) in South Asians. Missense, nonsense, frameshift,
    splice-site and whole-gene deletion alleles are reported. Severity does not
    track variant type and varies within a family carrying the same variant.
    Variant interpretation is complicated because some putatively causal
    alleles occur in population databases, including in the homozygous state,
    which leaves open whether those alleles are incompletely penetrant or not
    causal.
  evidence:
  - reference: PMID:36051699
    reference_title: Clinical characteristics and variant analyses of transient infantile hypertriglyceridemia related to GPD1 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of patients, 87.1% had homozygous variants, with the most frequent loci being c.361-1G > C and c.895G > A."
    explanation: Homozygosity and the recurrent alleles across pooled cases.
  - reference: PMID:41839820
    reference_title: "Founder Effect of the c.500G>A Variant in South Asian Patients With Inherited GPD1 Deficiency: Report on 16 Patients and Variant Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients also have a similar homozygous haplotype around the variant, construing its founder effect in South Asian patients with inherited GPD1 deficiency."
    explanation: Founder allele in South Asians.
  - reference: PMID:41971245
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of GPD1 Gene Variants: A Cause of Hepatomegaly and Hepatic Steatosis in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the 15 variants likely originated from a common ancestor, \"that is, founder in nature\": p.I119fs*94 (Palestinian Arabs), p.Gly299Arg (Czech population), and p.Thr251Asnfs*10 (Saudi Arabia)."
    explanation: Further founder alleles across populations.
  - reference: PMID:41971245
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of GPD1 Gene Variants: A Cause of Hepatomegaly and Hepatic Steatosis in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Even within a single family with the same GPD1 variant, the severity of the disease was variable; an infant (Patient Number 14 in Table 1) had cirrhosis on liver biopsy performed at the age of 5 months, and the uncle (Patient Number 15) had mild portal fibrosis on liver biopsy at the age of 2 years and is doing very well at the age of 31 years with mild elevation of liver transaminases and TG levels."
    explanation: Intrafamilial variability with a shared genotype.
  - reference: PMID:24549054
    reference_title: A compound heterozygous mutation in GPD1 causes hepatomegaly, steatohepatitis, and hypertriglyceridemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband inherited a GPD1 deletion from the father determined using copy number analysis and a missense change p.(R229Q) from the mother."
    explanation: A copy-number deletion allele in trans with a missense variant.
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several potentially disease-causing variants are likely to be present in population databases like gnomAD even in the homozygous state, like the c.500G>A and c.361 G>A variants detected in cases 1 and 3, respectively."
    explanation: Records the population-database homozygote problem for variant classification.

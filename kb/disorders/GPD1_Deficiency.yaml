    snippet: "Follow-up data showed that HTG normalized in 28% of patients (11 out of 39) but persisted mildly in the remaining 72% (28 out of 39)."
    explanation: Persistence of hypertriglyceridemia in most followed patients.
  - reference: PMID:41971245
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of GPD1 Gene Variants: A Cause of Hepatomegaly and Hepatic Steatosis in Early Childhood."

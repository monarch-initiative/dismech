    reference_title: Transient infantile hypertriglyceridemia, fatty liver, and hepatic fibrosis caused by mutated GPD1, encoding glycerol-3-phosphate dehydrogenase 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis revealed a homozygous splicing mutation, c.361-1G>C, which resulted in an aberrantly spliced mRNA in the ten affected individuals."
    explanation: Founding report of the homozygous GPD1 splice variant and its aberrant splicing in all ten affected individuals.
  - reference: PMID:24549054
    reference_title: A compound heterozygous mutation in GPD1 causes hepatomegaly, steatohepatitis, and hypertriglyceridemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GPD1 protein was absent in the patient's liver biopsy on western blot."
    explanation: Shows absence of the protein in patient liver, the target tissue.
  - reference: PMID:24549054
    reference_title: A compound heterozygous mutation in GPD1 causes hepatomegaly, steatohepatitis, and hypertriglyceridemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in GPD1 encoding glycerol-3-phosphate dehydrogenase that catalyzes the reversible redox reaction of dihydroxyacetone phosphate and NADH to glycerol-3-phosphate (G3P) and NAD(+) were identified."
    explanation: States the reaction the lost enzyme catalyzes, which defines the molecular-function binding.
  - reference: PMID:28944580
    reference_title: "Biallelic mutations in GPD1 gene in a Chinese boy mainly presented with obesity, insulin resistance, fatty liver, and short stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies demonstrated that the Ala274Thr variant induced a decrease in GPD1 protein expression."
    explanation: Functional evidence that a missense allele reduces GPD1 protein.
  downstream:
  - target: Impaired Cytosolic DHAP and G3P Interconversion
    causal_link_type: DIRECT
    description: Loss of the enzyme removes the cytosolic NADH-dependent reduction of DHAP to G3P and its reverse.
  - target: Increased Hepatocyte Triglyceride Secretion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - hepatic_triglyceride_secretion
    description: >-
      Supported only by overexpression of a mutant cDNA in HepG2 cells; see the
      hepatic_triglyceride_secretion hypothesis for why that design is weak
      evidence about loss of function.
    evidence:
    - reference: PMID:22226083
      reference_title: Transient infantile hypertriglyceridemia, fatty liver, and hepatic fibrosis caused by mutated GPD1, encoding glycerol-3-phosphate dehydrogenase 1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of mutant GPD1 in HepG2 cells, in comparison to overexpression of wild-type GPD1, resulted in increased secretion of triglycerides (p = 0.01)."
      explanation: Mutant GPD1 increased triglyceride secretion from a hepatocyte-derived cell line.
- name: Impaired Cytosolic DHAP and G3P Interconversion
  description: >-
    Without GPD1, cytosolic DHAP is not reduced to G3P. In the Gpd1-null mouse
    this gives low tissue G3P and high DHAP, most marked in skeletal muscle; a
    second strain lacking both GPD1 and malic enzyme showed the abnormal
    G3P/DHAP pattern only in skeletal muscle. Hepatic G3P and DHAP have not been
    measured in patients, so the state of the hepatic metabolite pool, which is
    what the competing steatosis proposals turn on, is unknown.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: glycerol-3-phosphate metabolic process
    term:
      id: GO:0006072
      label: glycerol-3-phosphate metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:11147825
    reference_title: Mouse lacking NAD+-linked glycerol phosphate dehydrogenase has normal pancreatic beta cell function but abnormal metabolite pattern in skeletal muscle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Levels of glycerol phosphate (low) and dihydroxyacetone phosphate (high) were very abnormal in nonislet tissue, especially in skeletal muscle."
    explanation: Direct metabolite measurement of the block in the Gpd1-null mouse.
  - reference: PMID:11451371
    reference_title: "Survey of normal appearing mouse strain which lacks malic enzyme and Nad+-linked glycerol phosphate dehydrogenase: normal pancreatic beta cell function, but abnormal metabolite pattern in skeletal muscle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tissue levels of glycerol phosphate (low) and dihydroxyacetone phosphate (high) were only abnormal in skeletal muscle."
    explanation: >-
      Same direction of change in a double-mutant strain, but confined to
      skeletal muscle, which is why the hepatic metabolite state is recorded as
      unknown.
  downstream:
  - target: Hepatocyte Triglyceride Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - acyl_dhap_diversion
    - hepatic_g3p_retention
    description: >-
      Both published proposals route through this step but disagree on which
      metabolite accumulates; the intermediate steps are not demonstrated in
      patients.
    evidence:
    - reference: PMID:24549054
      reference_title: A compound heterozygous mutation in GPD1 causes hepatomegaly, steatohepatitis, and hypertriglyceridemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The mechanism of fatty liver in our patient may be due to acylation of excess DHAP."
      explanation: Proposes, without measurement, that the metabolite block causes the fatty liver.
  - target: Impaired Glycerol-3-Phosphate Shuttle
    causal_link_type: DIRECT
    description: GPD1 is the cytosolic half of the shuttle, so the shuttle cannot run without it.
    evidence:
    - reference: PMID:11147825
      reference_title: Mouse lacking NAD+-linked glycerol phosphate dehydrogenase has normal pancreatic beta cell function but abnormal metabolite pattern in skeletal muscle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This suggests that a nonfunctional glycerol phosphate shuttle caused a block in glycolysis at the step catalyzed by glyceraldehyde phosphate dehydrogenase."
      explanation: Links the enzyme loss to a nonfunctional shuttle in the mouse.
  - target: Impaired Gluconeogenesis from Glycerol
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27733253
      reference_title: Glycerol-3-phosphate dehydrogenase 1 deficiency induces compensatory amino acid metabolism during fasting in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The blood glucose levels in the HeA mice were lower than that in the By mice after glycerol administration."
      explanation: Glycerol loading produces less glucose in Gpd1-null mice.
- name: Impaired Glycerol-3-Phosphate Shuttle
  description: >-
    GPD1 and mitochondrial GPD2 together carry cytosolic reducing equivalents into
    mitochondria. In the Gpd1-null mouse the nonfunctional shuttle lowers the
    cytosolic NAD/NADH ratio and blocks glycolysis at glyceraldehyde-phosphate
    dehydrogenase, chiefly in skeletal muscle, where exercised mice could not
    maintain ATP. No human phenotype has been attributed to this node; muscle
    and brain energy metabolism have not been studied in patients, so it has no
    downstream phenotype.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: glycerol-3-phosphate shuttle
    term:
      id: GO:0006127
      label: glycerol-3-phosphate shuttle
    modifier: DECREASED
  evidence:
  - reference: PMID:11147825
    reference_title: Mouse lacking NAD+-linked glycerol phosphate dehydrogenase has normal pancreatic beta cell function but abnormal metabolite pattern in skeletal muscle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "When exercised, mice were unable to maintain normal ATP levels in skeletal muscle."
    explanation: Functional consequence of the shuttle defect in the mouse.
- name: Impaired Gluconeogenesis from Glycerol
  description: >-
    G3P formed from glycerol must be oxidized to DHAP by GPD1 to enter
    gluconeogenesis. Gpd1-null mice make less glucose from glycerol, but after
    one to four hours of fasting their blood glucose is higher than controls,
    with a compensatory shift to alanine-driven gluconeogenesis. Because the
    model compensates rather than becoming hypoglycemic, this node is not wired
    to the hypoglycemia seen in about one in ten patients; that phenotype has no
    sourced mechanism.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:27733253
    reference_title: Glycerol-3-phosphate dehydrogenase 1 deficiency induces compensatory amino acid metabolism during fasting in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although these data indicate that a lack of GPD1 inhibits gluconeogenesis from glycerol, chronic GPD1 deficiency may induce an adaptation that enhances gluconeogenesis from glycogenic amino acids."
    explanation: Establishes the block and the compensatory adaptation in the mouse.
  - reference: PMID:27733253
    reference_title: Glycerol-3-phosphate dehydrogenase 1 deficiency induces compensatory amino acid metabolism during fasting in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although lack of GPD1 inhibited gluconeogenesis from glycerol, blood glucose levels in the HeA mice after 1-4h of fasting were significantly higher than that in the By mice."
    explanation: The fasting result that argues against using this node to explain human hypoglycemia.
- name: Hepatocyte Triglyceride Accumulation
  description: >-
    Triglyceride accumulates in hepatocyte lipid droplets, seen on ultrastructure
    as intrahepatocytic lipid droplets and on biopsy as macro- and microvesicular
    steatosis in every biopsied patient. Which substrate route feeds it is not
    established (see the acyl_dhap_diversion and hepatic_g3p_retention
    hypotheses). Conformance to the steatosis module is claimed at this node
    only: the module's lipotoxic-stress and inflammatory nodes have not been
    studied in GPD1 deficiency.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "hepatic_steatosis_lipotoxicity#Hepatocyte Lipid Overload"
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:

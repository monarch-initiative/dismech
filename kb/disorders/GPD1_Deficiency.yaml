- phase: Childhood and later course
  age_range: childhood to fourth decade
  notes: >-
    Triglycerides fall with age in most, but normalize in only about 28-30%;
    transaminases and hepatomegaly resolve in about a third. Fibrosis can
    progress, and cirrhosis is documented from infancy to adolescence. No
    pancreatitis, coronary events or liver decompensation have been reported,
    with the longest follow-up at 31 years. Long-term hepatic outcome in
    adulthood is unknown.
  evidence:
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During follow-up (11-376 months), hepatomegaly resolved in 35.2%, triglycerides, and transaminases normalized in 29.1% and 31.5%, respectively."
    explanation: Pooled follow-up outcomes.

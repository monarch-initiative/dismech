animal_models:
- name: Gpd1-null BALB/cHeA mouse
  species: Mouse
  genotype: Spontaneous loss of cytosolic glycerol phosphate dehydrogenase (BALB/cHeA strain); BALB/cBy used as control
  description: >-
    Normal-appearing strain lacking GPD1 activity. It reproduces the metabolite
    block and the loss of glycerol gluconeogenesis, but its reported lipid
    phenotype runs opposite to the human disease: less weight gain, enhanced
    fat oxidation, and protection from ethanol-induced hepatic triglyceride
    accumulation. No cited study reports spontaneous hepatic steatosis or
    hypertriglyceridemia in this strain.
  modeled_mechanisms:
  - target: Impaired Cytosolic DHAP and G3P Interconversion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Metabolite abnormality is most marked in skeletal muscle; whether hepatic
      G3P and DHAP are altered is inconsistent between reports, and hepatic
      metabolites have not been measured in patients for comparison.
    evidence:
    - reference: PMID:11147825
      reference_title: Mouse lacking NAD+-linked glycerol phosphate dehydrogenase has normal pancreatic beta cell function but abnormal metabolite pattern in skeletal muscle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Levels of glycerol phosphate (low) and dihydroxyacetone phosphate (high) were very abnormal in nonislet tissue, especially in skeletal muscle."
      explanation: Reproduces the expected G3P/DHAP block.
  - target: Impaired Gluconeogenesis from Glycerol
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    limitations: >-
      Gluconeogenesis from glycerol has not been measured in patients, so
      whether this node applies to human GPD1 deficiency is untested.
    evidence:
    - reference: PMID:27733253
      reference_title: Glycerol-3-phosphate dehydrogenase 1 deficiency induces compensatory amino acid metabolism during fasting in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The blood glucose levels in the HeA mice were lower than that in the By mice after glycerol administration."
      explanation: In vivo readout of impaired glycerol gluconeogenesis.
discussions:
- discussion_id: gpd1_mouse_liver_lipid_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatocyte Triglyceride Accumulation
  - animal_models#Mouse
  prompt: >-
    Why does loss of GPD1 cause hepatic steatosis and hypertriglyceridemia in
    children, when the Gpd1-null mouse is protected from ethanol-induced
    hepatic triglyceride accumulation, oxidizes more fat and gains less weight?
  rationale: >-
    The mouse data fit the expectation that GPD1 supplies the glycerol backbone
    for hepatic triglyceride, so its loss should reduce triglyceride. Patients
    show the opposite. Either the human phenotype arises through a route the
    mouse does not use (the acyl-DHAP pathway has been proposed), or the mouse
    phenotyping has not tested the conditions that matter in infants, such as a
    milk-based high-fat diet. Until the discrepancy is explained, none of the
    proposed hepatic mechanisms can be regarded as tested.
  evidence:
  - reference: PMID:24472537
    reference_title: The role of glycerol-3-phosphate dehydrogenase 1 in the progression of fatty liver after acute ethanol administration in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "On the other hand, in GPD1 null mice carrying normal GYK activity, no significant increase in hepatic TG level was observed after acute ethanol intake."
    explanation: In the mouse, GPD1 loss prevents rather than causes hepatic triglyceride accumulation after ethanol.
  - reference: PMID:32662756
    reference_title: The enhancement of fat oxidation during the active phase and suppression of body weight gain in glycerol-3-phosphate dehydrogenase 1 deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data indicate that GPD1 deficiency induces enhancement of fat oxidation with suppression of weight gain."
    explanation: Whole-body lipid phenotype of the mouse runs opposite to the human disease.
- discussion_id: gpd1_transient_course
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#
  - phenotypes#Hypertriglyceridemia
  - pathophysiology#Progressive Hepatic Fibrosis
  prompt: >-
    Is GPD1 deficiency a transient infantile disorder, as its MONDO and Orphanet
    names state, or a persistent liver and lipid disorder whose infantile peak
    is followed by long-lasting milder disease?
  rationale: >-
    The founding cohort showed triglycerides declining with age, and Orphanet
    still describes reduction or normalization with age. Pooled follow-up of
    later cases finds triglycerides normalizing in under a third, fibrosis that
    can progress to cirrhosis, and persistent hypertriglyceridemia into
    adulthood. The answer determines whether surveillance should continue into
    adulthood. It is limited by short follow-up, selective biopsy, and the few
    adults reported.
  evidence:
  - reference: ORPHA:300293
    reference_title: "Transient infantile hypertriglyceridemia and hepatosteatosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reduction or normalization of triglyceride serum levels occurs with advancing age."
    explanation: The transient framing as recorded by Orphanet.
  - reference: PMID:41971245
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of GPD1 Gene Variants: A Cause of Hepatomegaly and Hepatic Steatosis in Early Childhood."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This study indicates that GPD1 deficiency may not be a transient or benign condition, as previously considered, due to the persistence of HTG and liver pathology in a significant proportion of cases."
    explanation: Pooled-review conclusion against the transient framing.
  - reference: PMID:32685347
    reference_title: Successful fenofibrate therapy for severe and persistent hypertriglyceridemia in a boy with cirrhosis and glycerol-3-phosphate dehydrogenase 1 deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In some patients, hypertriglyceridemia could be severe and persist overtime."
    explanation: Severe hypertriglyceridemia persisting over time in some patients.

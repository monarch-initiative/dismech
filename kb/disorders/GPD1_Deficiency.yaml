notes: >-
  Naming and identity. The entry is named GPD1 Deficiency rather than after its
  MONDO label because the "transient" course in that label is contested by the
  pooled follow-up data (see the gpd1_transient_course discussion);
  MONDO:0013771 is bound unchanged, and the MONDO and Orphanet labels are kept
  as synonyms. Lump/split: MONDO records GPD1 as the only causal gene
  (RO:0004003 HGNC:4455) and this entry follows it. Orphanet ORPHA:300293
  additionally lists CREB3L3 as disease-causing and maps OMIM:619324
  (hypertriglyceridemia 2, MONDO:0859149) as a broader term; CREB3L3-related
  hypertriglyceridemia is a separate MONDO disease with a different gene and is
  not included here. A single adult heterozygous for a GPD1 missense variant
  with recurrent hypertriglyceridemia-related pancreatitis (PMID:39849455) is
  not curated as part of this autosomal recessive entity, because one
  heterozygous case does not establish a monoallelic phenotype. No ClinGen
  gene-disease validity assertion for GPD1 appears in the ClinGen gene-validity
  download dated 2026-09-23 (only GPD1L, with Brugada syndrome), and no
  GeneReviews chapter names the disorder (just check-genereviews --online:
  NO_CHAPTER against the 2026-09-10 Bookshelf index plus a live PubMed title
  search), so the pooled literature reviews serve as the phenotype baseline. The founding
  report (PMID:22226083) is available as an abstract only, so nothing from its
  full-text discussion is attributed to it. Phenotypes reported in single
  patients and not curated: anemia requiring transfusion (PMID:37211761) and
  kidney involvement (PMID:27368975); neither has been linked to the enzyme
  defect. Development: one pooled review reports normal psychiatric status in
  all 31 cases (PMID:36051699), while a later review tabulates one patient with
  growth and developmental delay (PMID:41971245), so neurodevelopmental
  involvement is not recorded as a phenotype.

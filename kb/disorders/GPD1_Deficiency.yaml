      label: lipid storage
    modifier: INCREASED
  evidence:
  - reference: PMID:29940878
    reference_title: "A novel homozygous mutation in the glycerol-3-phosphate dehydrogenase 1 gene in a Chinese patient with transient infantile hypertriglyceridemia: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural study showed intrahepatocytic lipid droplets."
    explanation: Ultrastructural demonstration of hepatocyte lipid accumulation in a patient.
  - reference: PMID:41971245
    reference_title: "Clinical, Laboratory, and Molecular Characteristics of GPD1 Gene Variants: A Cause of Hepatomegaly and Hepatic Steatosis in Early Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen patients underwent liver biopsy; all showed micro- and macrosteatosis, mild to moderate portal fibrosis in 58% (11 out of 19), and cirrhosis in the remaining eight cases (42%)."
    explanation: Every biopsied patient in the pooled literature had micro- and macrovesicular steatosis.
  downstream:
  - target: Hepatic steatosis
    causal_link_type: DIRECT
    description: The accumulation is what imaging and histology read as steatosis.
  - target: Hepatomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred: hepatomegaly and steatosis co-occur in nearly every patient and
      steatosis is the dominant histological finding, but no cited source tests
      whether lipid accumulation alone accounts for the liver enlargement.
  - target: Elevated transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred: the transaminase rise accompanies steatosis and steatohepatitis
      on biopsy, but the hepatocyte-injury step between them has not been
      characterized in this disorder.
  - target: Progressive Hepatic Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The founding cohort describes fatty liver followed by fibrosis; the intervening injury and stellate-cell steps are not studied here.
    evidence:
    - reference: PMID:22226083
      reference_title: Transient infantile hypertriglyceridemia, fatty liver, and hepatic fibrosis caused by mutated GPD1, encoding glycerol-3-phosphate dehydrogenase 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a hitherto unreported disease in ten individuals manifesting as moderate to severe transient childhood hypertriglyceridemia and fatty liver followed by hepatic fibrosis and the identification of the mutated gene responsible for this condition."
      explanation: Describes the temporal sequence from fatty liver to fibrosis in the founding families.
- name: Increased Hepatocyte Triglyceride Secretion
  description: >-
    Proposed mechanism for the plasma hypertriglyceridemia, resting on one HepG2
    overexpression experiment. The direction of hepatic triglyceride export in
    patients has not been measured, and a later review lists decreased hepatic
    output instead; see the hepatic_triglyceride_secretion hypothesis.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:

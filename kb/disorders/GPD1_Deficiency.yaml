  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the limited experience of fibrates in children and concerns of adverse effects (raised liver enzyme, muscle enzymes, gall stone, and renal impairment), fenofibrate should be used cautiously under close supervision and regular monitoring."

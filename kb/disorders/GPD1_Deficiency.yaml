    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of mutant GPD1 in HepG2 cells, in comparison to overexpression of wild-type GPD1, resulted in increased secretion of triglycerides (p = 0.01)."
    explanation: The only experimental observation for this node.
  downstream:
  - target: Hypertriglyceridemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

  evidence:
  - reference: PMID:32685347
    reference_title: Successful fenofibrate therapy for severe and persistent hypertriglyceridemia in a boy with cirrhosis and glycerol-3-phosphate dehydrogenase 1 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the persistent and progressive increase of plasma triglycerides, fenofibrate treatment was started at 15 years of age allowing triglyceride level reduction in the following 1-year follow-up."
    explanation: Triglyceride reduction on fenofibrate in an adolescent.
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All received supportive therapy, and fenofibrate was successfully used in one case for progressive hypertriglyceridemia."

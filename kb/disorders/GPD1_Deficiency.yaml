diagnosis:
- name: Exome or gene-panel sequencing
  description: >-
    There is no specific biochemical marker, and nearly all recent diagnoses
    were made by exome sequencing in children with unexplained hepatomegaly,
    steatosis, raised transaminases and hypertriglyceridemia. GPD1 is included
    on some pediatric hypertriglyceridemia gene panels. Targeted testing for
    c.500G>A has been suggested as a first-tier test in South Asian patients.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is confirmed by genetic testing."
    explanation: Molecular confirmation is the diagnostic standard.
  - reference: PMID:37211761
    reference_title: "A very rare cause of hypertrygliseridemia in infancy: a novel mutation in glycerol-3-phosphate dehydrogenase 1 (GPD1) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GPD1 deficiency should be investigated in the presence of unexplained hypertriglyceridemia and hepatic steatosis in children especially in infants."
    explanation: Indication for testing.
  - reference: PMID:40773003
    reference_title: "Assessment of Pediatric Hypertriglyceridemia Etiology: Insights from Next-Generation Sequencing Panels and Identification of Novel Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 4 out of the 6 patients with a familial history of hypertriglyceridemia, we identified pathogenic variants in the GPD1, LIPC, LPL and APOC2 genes, which are associated with hypertriglyceridemia."
    explanation: GPD1 variants identified on a pediatric hypertriglyceridemia panel.
  - reference: PMID:41839820
    reference_title: "Founder Effect of the c.500G>A Variant in South Asian Patients With Inherited GPD1 Deficiency: Report on 16 Patients and Variant Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted testing for c.500G>A could be considered as a first-tier evaluation strategy in South Asian patients with HTGTI."
    explanation: Population-specific first-tier testing suggestion.
treatments:
- name: Low-fat, medium-chain-triglyceride-enriched diet
  description: >-
    First-line supportive management. There are no dietary guidelines for GPD1
    deficiency; a low-fat diet with medium-chain triglyceride as a large share
    of fat has been used and lowered triglycerides in case reports.
  treatment_term:
    preferred_term: low-fat, medium-chain-triglyceride-enriched diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL

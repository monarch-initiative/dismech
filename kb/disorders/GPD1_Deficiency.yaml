    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a low-fat diet with enriched medium-chain fatty acids, their plasma triglyceride level were significantly decreased, and finally normalized in case 2."
    explanation: Triglyceride reduction on the diet in two children.
  - reference: PMID:39839217
    reference_title: "Glycerol-3-Phosphate Dehydrogenase 1 Deficiency and Steatotic Liver Disease in Children: Our Cases and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, there are no dietary guidelines for GPD1 deficiency."
    explanation: Records the absence of guidelines.
- name: Fenofibrate
  description: >-
    Off-label fibrate therapy for severe or progressive hypertriglyceridemia,
    reported in an adolescent with cirrhosis and in an infant. Pediatric

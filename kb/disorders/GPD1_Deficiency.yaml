- phase: Infantile presentation
  age_range: first 2 years of life (median about 6-9 months)
  notes: >-
    Hepatomegaly, steatosis, raised transaminases and hypertriglyceridemia,
    with triglycerides highest in the youngest patients.
  evidence:
  - reference: PMID:36051699
    reference_title: Clinical characteristics and variant analyses of transient infantile hypertriglyceridemia related to GPD1 gene.
    supports: SUPPORT

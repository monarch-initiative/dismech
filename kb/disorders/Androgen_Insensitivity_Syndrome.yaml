- name: Androgen Receptor Dysfunction
  description: 'The variant androgen receptor has reduced or absent ligand-dependent transcriptional
    activity, most often through impaired androgen or DNA binding. Residual receptor function
    is graded rather than binary: effectively absent activity produces the complete phenotype,
    while retained partial activity permits some androgen-dependent masculinization and pubertal
    response.'

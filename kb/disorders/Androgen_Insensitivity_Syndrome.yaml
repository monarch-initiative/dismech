biochemical:
- name: Testosterone
  context: Normal male-range or elevated concentrations with retained testes, interpreted by age and treatment. A normal postnatal value does not prove normal fetal steroid synthesis, and hCG response does not exclude every biosynthetic disorder.
  biomarker_term:
    preferred_term: testosterone
    term:
      id: CHEBI:17347
      label: testosterone
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Testosterone levels are within or above the normal male range in patients with retained testes. Testosterone is peripherally aromatised to oestrogen resulting in endogenous oestrogen levels which are above the male range but generally lower than the normal female range
    explanation: Guideline specifies the reference range and retained-gonad context.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Normal serum concentrations of T, DHT, and LH after birth do not prove that the concentration was normal during the critical period of fetal genital masculinization.
    explanation: Limits retrospective inference from postnatal hormones.
- name: Estradiol
  context: Aromatization produces estradiol despite AR resistance. Concentrations in CAIS with retained testes are generally above male but below female reference values; postgonadectomy levels depend on replacement.
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Testosterone levels are within or above the normal male range in patients with retained testes. Testosterone is peripherally aromatised to oestrogen resulting in endogenous oestrogen levels which are above the male range but generally lower than the normal female range
    explanation: Comparator-specific synthesis.
- name: Luteinizing hormone and follicle-stimulating hormone
  context: LH is often elevated when the axis is active; FSH can remain normal under estrogen/inhibin feedback. Normal gonadotropins were the most common pattern in one selected pediatric cohort, so elevation is not required at every age.
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Thus, the LH/FSH ratio is typically relatively high in CAIS and PAIS
    explanation: Typical pubertal physiology.
  - reference: PMID:30251955
    reference_title: 'Androgen Insensitivity Syndrome: Clinical Phenotype and Molecular Analysis in a Single Tertiary Center Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In agreement with previous reports, normal gonadotropin levels were the most frequent finding
    explanation: Observed cohort hormone pattern.
- name: Antimullerian hormone
  context: Normal prepubertal values can be followed by failure of the expected pubertal fall. This age-specific pattern reflects impaired androgen suppression of Sertoli AMH and is distinct from fetal Müllerian regression.
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: With rising intratesticular testosterone levels, AMH secretion is inhibited in a subject with normal AR function, whereas a boy with PAIS continues to have prepubertal levels of AMH due to lack of inhibition.
    explanation: Pubertal regulation.
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The testicular Sertoli cell markers inhibin B and AMH are within the normal prepubertal male range
    explanation: Prepubertal comparator.
genetic:
- name: AR
  association: Causal pathogenic variants, including germline and postzygotic mosaic variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  notes: AR is the established AIS gene. Pathogenic missense, truncating, splice and copy-number variants can cause disease; variant-specific binding and transactivation effects differ. One selected cohort identified AR variants in 11/11 suspected CAIS and 13/30 suspected PAIS cases, with blood mosaicism in 4/24 AR-positive individuals. These are diagnostic-cohort proportions, not population prevalence. Some AR-negative clinical PAIS presentations have other diagnoses. The previously cited p.Ser176Arg candidate is currently benign/likely benign in ClinVar and should not be treated as a confirmed causal AIS allele.
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Androgen insensitivity syndrome (AIS) is a rare inherited condition caused by X-linked pathogenic mutations in the androgen receptor (AR) gene
    explanation: Established gene relationship.
  - reference: PMID:30251955
    reference_title: 'Androgen Insensitivity Syndrome: Clinical Phenotype and Molecular Analysis in a Single Tertiary Center Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All of the CAIS cases (n=11) were genetically confirmed, while in PAIS (n=30) a mutation in AR was detected in only 13 patients (43.3%).
    explanation: Explicit Results numerators; the Discussion uses a discrepant percentage.
  - reference: PMID:30251955
    reference_title: 'Androgen Insensitivity Syndrome: Clinical Phenotype and Molecular Analysis in a Single Tertiary Center Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In four individuals (P5, P6, P8 and P16), 17% of AR-mutated gene patients, somatic mosaicism of mutant and wild type alleles was detected in DNA derived from blood leukocytes.
    explanation: Blood-detected mosaicism in this cohort.
  - reference: url:https://www.ncbi.nlm.nih.gov/clinvar/variation/804018/
    reference_title: VCV000804018.30 - ClinVar - NCBI
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Benign (2); Likely benign (3)
    explanation: Current primary ClinVar aggregate for c.528C>A p.Ser176Arg, checked 2026-09-21.

- name: Estrogen replacement and pubertal induction after gonadectomy
  description: After gonadectomy, provide individualized estrogen replacement and gradual puberty induction when needed. Endo-ERN recommends starting induction around age 11 in gonadectomized CAIS, with very low-certainty evidence. Monitor pubertal progression, satisfaction, hormone exposure and bone health; routine progestin is generally unnecessary without a uterus. Retained testes usually support spontaneous CAIS puberty. The same induction principles apply to PAIS patients seeking female puberty when endogenous hormone production is absent or inadequate. During induction, the guideline recommends review every three to six months.

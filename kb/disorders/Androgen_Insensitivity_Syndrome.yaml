    supports: SUPPORT
    evidence_source: OTHER
    snippet: HP:0000771 | Gynecomastia | Frequent (79-30%)
    explanation: Orphanet records gynecomastia as frequent in PAIS.
- name: Impaired Spermatogenesis and Sexual Function
  description: Androgen receptor dysfunction impairs spermatogenesis and androgen-dependent
    sexual function, causing azoospermia, male infertility, and sexual dysfunction; milder
    AR variants are a recognized cause of otherwise isolated male infertility.
  evidence:

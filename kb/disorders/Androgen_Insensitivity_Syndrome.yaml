    directness: DIRECT
    snippet: It is best if the diagnosis of AIS is explained to the affected individual and family in an empathic environment, with both professional and family support.
    explanation: GeneReviews care framework.
- name: Shared decisions about gonadal retention or gonadectomy
  description: Discuss gonadal location, subtype, uncertain age-specific tumor risk, spontaneous puberty, surveillance limits and lifelong hormone needs. The 2022 guideline recommends spontaneous puberty in CAIS with retained testes. Gonadectomy after puberty or continued retention are individualized decisions; prepubertal removal is not a universal requirement. A suspicious mass needs specialist evaluation, but benign Leydig or Sertoli lesions must not be relabeled germ-cell cancer.
  treatment_term:
    preferred_term: Shared decisions about gonadal retention or gonadectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure

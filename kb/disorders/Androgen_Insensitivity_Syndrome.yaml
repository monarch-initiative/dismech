- name: Androgen Target-Tissue Resistance
  description: 'Androgen-responsive tissues fail to respond to circulating androgen despite
    a 46,XY karyotype, functional testes, and age-appropriate or elevated testosterone. The
    degree of resistance sets the phenotype: complete resistance blocks androgen-dependent
    masculinization entirely, while partial resistance yields variable undervirilization.'

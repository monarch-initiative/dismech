  description: Measure testosterone, DHT, LH, FSH and relevant steroid precursors with age, gonadal status and replacement therapy in mind. Selected hCG stimulation testing assesses Leydig response. Normal testosterone or a response to hCG does not by itself exclude all biosynthetic defects or establish normal fetal androgen exposure.

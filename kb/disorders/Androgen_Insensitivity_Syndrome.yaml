has_subtypes:
- name: CAIS
  display_name: Complete Androgen Insensitivity Syndrome (CAIS)
  subtype_term:
    preferred_term: complete androgen insensitivity syndrome
    term:
      id: MONDO:0021023
      label: complete androgen insensitivity syndrome
  description: Effectively absent androgen receptor function. Wolffian derivatives do not
    develop and the external genitalia follow the default female pathway, giving a 46,XY individual
    with female external genitalia, a blind-ending vagina, and absent or sparse terminal sexual
    hair. Typically presents as inguinal swelling in infancy or primary amenorrhoea in adolescence.
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
- name: PAIS
  display_name: Partial Androgen Insensitivity Syndrome (PAIS)
  subtype_term:
    preferred_term: partial androgen insensitivity syndrome
    term:
      id: MONDO:0010720
      label: partial androgen insensitivity syndrome
  description: 'Residual, partial androgen receptor function. Some target tissues still respond,
    so virilization is incomplete rather than absent: ambiguous or undervirilized male genitalia
    recognized at birth, with gynecomastia and impaired spermatogenesis after puberty. Variable
    residual activity and modifier loci such as MAP3K1 make genotype-phenotype correlation
    markedly weaker than in the complete form.'
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
  - preferred_term: MAP3K1
    term:
      id: hgnc:6848
      label: MAP3K1
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: 'Androgen insensitivity syndrome is inherited in an X-linked recessive pattern
    through hemizygous pathogenic variants in AR, across the complete-to-partial spectrum.
    This X-linked statement covers the AR arm only: the MAP3K1 modifier curated on the partial
    subtype is autosomal, so a contributing MAP3K1 variant does not follow the X-linked pattern.'
  evidence:
  - reference: PMID:32338288
    reference_title: "Novel compound variants of the AR and MAP3K1 genes are related to the clinical heterogeneity of androgen insensitivity syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AIS is inherited in an X-linked recessive manner and is caused by variants in
      the androgen receptor (AR) gene
    explanation: States the X-linked recessive mode of inheritance and its causal gene directly.
  - reference: PMID:29785970
    reference_title: Phenotypic and molecular characteristics of androgen insensitivity syndrome
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A pathogenic mutation of the androgen receptor gene (AR; OMIM# 313700) is the
      only established molecular cause of the X-linked recessive inherited disease.
    explanation: This AIS cohort/review statement directly supports AR-based X-linked recessive
      inheritance.

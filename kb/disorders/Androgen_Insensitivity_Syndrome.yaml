experimental_models:
- name: AR and MAP3K1 coexpression in HEK293T/17 cells
  experimental_model_type: CELL_LINE
  description: Transient expression of wild-type or variant AR and MAP3K1 plasmids measured AR protein band abundance after 48 hours. The one-family study reported lower AR abundance with the AR variant alone and higher signal in selected MAP3K1-mutant/coexpression conditions. It did not measure androgen binding, DNA binding, reporter transactivation, kinase signaling, receptor half-life or clinical rescue. Single-plasmid and dual-plasmid conditions used different per-plasmid doses. Thus these results do not establish MAP3K1 modifier causality and are not connected to a proven clinical signaling route.
  cell_source: HEK293T/17 kidney-derived cell line
  evidence:
  - reference: PMID:32338288
    reference_title: Novel compound variants of the AR and MAP3K1 genes are related to the clinical heterogeneity of androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The cells lysates were used to analyze the AR protein expression by Western blot.
    explanation: Measured endpoint is protein abundance, not receptor activity.
  - reference: PMID:32338288
    reference_title: Novel compound variants of the AR and MAP3K1 genes are related to the clinical heterogeneity of androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The transfection concentration of a single plasmid was 2.5 μg/ml. When the cotransfection of the two plasmids was conducted, the concentration of each plasmid is 1.5 μg/ml.
    explanation: Dose difference limits a clean interaction interpretation.
- name: Exploratory PAIS peripheral-blood transcriptome study
  experimental_model_type: OTHER
  description: RNA sequencing compared isolated PBMCs from three AR-variant PAIS patients with three age-matched male volunteers. The reported 725 differentially expressed genes and computational network/enrichment analyses are exploratory associations, not a validated diagnostic signature or evidence that candidate immune/metabolic pathways cause genital development. Only CCR1 was significantly different in the reported qPCR follow-up; the other selected genes were not significant. The Methods cites a mouse GRCm38 annotation despite human samples, an unresolved source reporting issue. No independent diagnostic validation cohort or controlled AR perturbation was provided.
  cell_source: Uncultured peripheral blood mononuclear cells from three PAIS patients and three controls
  evidence:
  - reference: PMID:34867780
    reference_title: Identification of Potential Genes in Pathogenesis and Diagnostic Value Analysis of Partial Androgen Insensitivity Syndrome Using Bioinformatics Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The peripheral blood of three PAIS patients and three healthy male volunteers (age-matched) was obtained from Shanghai Ninth People’s Hospital
    explanation: Human observational sampling, not a six-patient series.
  - reference: PMID:34867780
    reference_title: Identification of Potential Genes in Pathogenesis and Diagnostic Value Analysis of Partial Androgen Insensitivity Syndrome Using Bioinformatics Analysis.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: a total of 725 DEGs, including 495 upregulated and 230 downregulated genes, were identified in PAIS patients
    explanation: Exploratory differential-expression output with the study threshold.
  - reference: PMID:34867780
    reference_title: Identification of Potential Genes in Pathogenesis and Diagnostic Value Analysis of Partial Androgen Insensitivity Syndrome Using Bioinformatics Analysis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: GENCODE (Release M22, GRCm38. p6)
    explanation: Source-internal reference-annotation mismatch; not corrected or silently assumed away.
discussions:
- discussion_id: ais-ser176arg-reclassification
  kind: INTERPRETATION
  status: OPEN
  prompt: How should the previously attributed Ser176Arg case be interpreted after variant reclassification?
  rationale: The 2020 case report nominated AR c.528C>A p.Ser176Arg by exome prioritization without a functional assay and reported substantial East Asian population frequency. ClinVar VCV000804018.30, checked 2026-09-21, aggregates benign/likely benign classifications without conflict. This weakens the molecular AIS attribution; the child may still have a difference of sex development requiring an alternative explanation. Its short androgen exposure is not used as AIS-specific efficacy evidence.
  attaches_to:
  - genetic#AR
  - diagnosis#AR molecular testing and variant interpretation
  evidence:
  - reference: PMID:33363845
    reference_title: 'Male pseudohermaphroditism: A case study of 46,XY disorder of sexual development using whole-exome sequencing.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: a relatively high prevalence of this AR variant in East Asia (1%‐1.5%)
    explanation: The original source itself notes a relatively common population allele.
  - reference: url:https://www.ncbi.nlm.nih.gov/clinvar/variation/804018/
    reference_title: VCV000804018.30 - ClinVar - NCBI
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Benign (2); Likely benign (3)
    explanation: Current primary variant record.
- discussion_id: ais-map3k1-modifier-hypothesis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does the reported MAP3K1 variant modify AR-related AIS?
  rationale: One proband and the mother shared AR and MAP3K1 variants. The source calls AR likely pathogenic but MAP3K1 Arg260Cys a VUS; no replicated segregation or developmental assay establishes modification. HEK293T/17 immunoblots measure abundance, not transactivation, and single versus dual plasmid doses differ. A rudimentary uterine structure is an atypical observation, not proof of a MAP3K1-mediated AMH defect. The paper repeatedly writes His690Glu for AR c.2070C>A, while Results says glutamine and Figure 2 labels H690Q; the inconsistent protein expansion is not propagated as verified nomenclature.
  attaches_to:
  - experimental_models#AR and MAP3K1 coexpression in HEK293T/17 cells
  evidence:
  - reference: PMID:32338288
    reference_title: Novel compound variants of the AR and MAP3K1 genes are related to the clinical heterogeneity of androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The MAP3K1 variant is a variant of “unknown significance” according to ACMG criteria.
    explanation: The source qualification takes precedence over stronger abstract language.
  - reference: PMID:32338288
    reference_title: Novel compound variants of the AR and MAP3K1 genes are related to the clinical heterogeneity of androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: there is a lack of basic experiments to validate regulatory mechanism between the AR and MAP3K1 gene.
    explanation: Authors explicitly identify the unresolved mechanism.
  - reference: PMID:32338288
    reference_title: Novel compound variants of the AR and MAP3K1 genes are related to the clinical heterogeneity of androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The hemizygous variant occurs at position 690 (H690Q).
    explanation: Figure caption differs from the erroneous Glu expansion.
- discussion_id: ais-gonadal-risk-and-surveillance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How can gonadal cancer risk and surveillance be estimated for a particular AIS patient?
  rationale: Published cohorts mix age, subtype, genotype confirmation, gonadal location and surgical ascertainment. Benign stromal lesions, precursor lesions and invasive germ-cell cancer should not be pooled as one outcome. The low prepubertal risk and benefit of spontaneous CAIS puberty inform shared decisions, but neither normal imaging nor isolated benign case reports establish a universally safe retention schedule.
  attaches_to:
  - treatments#Shared decisions about gonadal retention or gonadectomy
  - treatments#Retained-gonad follow-up
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: There is an ongoing debate about the need to perform gonadectomy after puberty since the risk of invasive GGCC development is still uncertain.
    explanation: Guideline acknowledges uncertainty.
  - reference: PMID:36851849
    reference_title: 'Complete androgen insensitivity syndrome: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Leydig cell tumour of the right testis. It was a benign testicular tumour.
    explanation: Specific benign stromal histology.
- discussion_id: ais-genotype-and-tissue-heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which tissue and developmental factors explain the variable phenotype of the same AR variant?
  rationale: Residual receptor activity matters, but PAIS genotype-phenotype correlation and puberty prediction remain imperfect. Blood mosaicism is observed; fetal genital-tissue proportions and functional effects are often unmeasured. The exploratory three-case PBMC expression study supplies candidate associations, not a diagnostic assay or causal explanation for genital variation.
  attaches_to:
  - pathophysiology#Pathogenic AR Variation
  - experimental_models#Exploratory PAIS peripheral-blood transcriptome study
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In contrast to the clinical findings, the functional analysis of AR variants did not appear to predict pubertal outcome
    explanation: Clinical prediction limit.
  - reference: PMID:30251955
    reference_title: 'Androgen Insensitivity Syndrome: Clinical Phenotype and Molecular Analysis in a Single Tertiary Center Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In four individuals (P5, P6, P8 and P16), 17% of AR-mutated gene patients, somatic mosaicism of mutant and wild type alleles was detected in DNA derived from blood leukocytes.
    explanation: Observed blood mosaicism, not measured fetal tissue mosaicism.
review_notes: Comprehensive review consumed the full original entry, both matching CAIS/PAIS deep-research reports, all original cached sources and the complete GeneReviews NBK1429 clinical, diagnostic, management, counseling and molecular sections. The 2022 Endo-ERN guideline was read in full in the related DSD reviews, with all AIS-specific recommendations, rationale and evidence limitations rechecked here. Full scientific bodies, Methods, Results, Discussion and available tables/captions were read for PMID29785970, 30251955, 32202729 (Russian PDF), 33363845, 34867780, 36851849, 39600030, 41163677, 35258786 and 40496184. A peer independently read the complete 32338288 body and its experimental limits; claim-local passages were checked here. The complete 14745012 manuscript was recovered through a generated public PMC URL cache after canonical retrieval failures, including its stereological methods, tables and conditional/global knockout contrast. The original 2018 hormone trial PMID30075954, the 2019 bone cohort31491747, and older22698698/26303086/26012135 remain abstract-supported; none is presented as a fully inspected manuscript. Both complete Orphanet structured subtype records
  were read. All cache changes were generated with just fetch-reference. Material corrections include removal of established MAP3K1 modifier attribution and reclassified Ser176Arg case efficacy, addition of MAIS, separation of allele-dependent binding/transcription defects, preserved fetal AMH versus pubertal suppression, and explicit hormone age/comparator/gonadal context. Ovaries are not Müllerian derivatives despite erroneous wording in a cited cohort. The selected 30251955 Results gives 13/30 PAIS molecular diagnoses, whereas its Discussion percentage is inconsistent. The 32202729 source has case-level age/HGVS inconsistencies and an overstrong recurrence assertion; these are not exported. The 34867780 Methods names a mouse reference annotation for human PBMC samples, which remains unresolved. The MAP3K1 report has AR protein-name and plasmid-dose inconsistencies. The metabolic hormone paper is a secondary analysis of the same crossover trial, not independent replication. Historical early surgery guidance, case-derived cancer risks and unvalidated transcriptomic mechanisms are not promoted to universal recommendations. Deep-research false positives involving cancer therapy resistance,
  glucocorticoid resistance and unrelated endocrine conditions were excluded.

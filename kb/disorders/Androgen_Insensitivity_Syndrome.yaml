- name: Mullerian-Derived Structure Aplasia
  description: Normal testis development and Sertoli-cell antimullerian hormone production
    cause regression of Mullerian-derived internal reproductive structures, so the uterus,
    fallopian tubes, and cervix are absent or hypoplastic and the vagina ends blindly. This
    arm is a consequence of intact testicular function rather than of androgen resistance,
    which is what separates androgen insensitivity from the gonadal-determination defects.
  evidence:
  - reference: PMID:32338288
    reference_title: Novel compound variants of the AR and MAP3K1 genes are related to the
      clinical heterogeneity of androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Müllerian derivatives are generally not found in individuals with AIS.
    explanation: The AIS heterogeneity paper states that Mullerian derivatives are generally
      absent in AIS.
  - reference: ORPHA:99429
    reference_title: Complete androgen insensitivity syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: HP:0000151 | Aplasia of the uterus | Very frequent (99-80%)
    explanation: Orphanet records uterine aplasia as very frequent in CAIS.
  - reference: ORPHA:90797

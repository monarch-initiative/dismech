differential_diagnoses:
- name: Mayer-Rokitansky-Küster-Hauser syndrome
  description: Amenorrhea and absent Müllerian structures can resemble CAIS, but MRKH usually has a 46,XX karyotype and ovarian rather than testicular gonads.
  distinguishing_features:
  - Chromosome result and gonadal identity; pubic hair is generally androgen responsive.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Individuals with MRKH can be distinguished from those with CAIS by confirmation of a 46,XX
    explanation: GeneReviews differential diagnosis; raw HTML interrupts the following karyotype term.
- name: Steroid 5-alpha-reductase 2 deficiency
  description: SRD5A2-related impaired conversion of testosterone to DHT can cause undervirilization with testes and preserved Müllerian regression. Steroid profiles, pubertal course and molecular testing distinguish it from AIS.
  distinguishing_features:
  - Reduced DHT formation with compatible biallelic SRD5A2 variants; a single testosterone value is insufficient.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The enzyme converts testosterone to dihydrotestosterone (DHT), which is primarily responsible for the development of the external genitalia before birth.
    explanation: GeneReviews SRD5A2 differential mechanism.
- name: 17-beta-hydroxysteroid dehydrogenase 3 deficiency and other steroidogenic defects
  description: HSD17B3 and other biosynthetic disorders can overlap with clinical PAIS. Compensatory LH stimulation can yield a normal testosterone concentration despite a partial biosynthetic defect.
  distinguishing_features:
  - Steroid precursor pattern, stimulation testing and molecular findings.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Elevated levels of testosterone precursors caused by a partial testosterone biosynthetic defect in which compensatory serum LH concentrations stimulate a normal plasma testosterone concentration
    explanation: Explicit diagnostic pitfall.
- name: 46,XY gonadal dysgenesis
  description: Impaired testicular development can reduce both androgen and AMH production, unlike the usually preserved AMH pathway in AIS. Retained Müllerian structures or a broader syndromic phenotype should prompt reconsideration.
  distinguishing_features:
  - Gonadal differentiation, AMH function, internal anatomy and the causal molecular diagnosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The presence of m&#x000fc;llerian duct derivatives as a result of a testicular organogenesis defect with impaired Sertoli cell production of anti-m&#x000fc;llerian hormone
    explanation: GeneReviews differential mechanism.
histopathology:
- name: Impaired germ-cell development and gonadal fibrosis
  description: Selected gonadectomy specimens show immature seminiferous tubules, fibrosis and absent germ cells. This is not a universal biopsy requirement and does not establish that all infertility is due to cryptorchidism.
  evidence:
  - reference: PMID:29785970
    reference_title: Phenotypic and molecular characteristics of androgen insensitivity syndrome patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Large areas of prepubertal tubules (arrow) surrounded by some fibrosis (arrowhead) are visualized, with no germ cells in the gonads.
    explanation: Case 8 histological caption; selected tissue, not prevalence.
- name: Benign testicular stromal lesions
  description: Benign Leydig-cell tumor and Sertoli-rich hamartomas have been documented in individual CAIS reports. These must be distinguished from germ-cell neoplasia and malignant cancer when discussing gonadal risk.
  evidence:
  - reference: PMID:36851849
    reference_title: 'Complete androgen insensitivity syndrome: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Leydig cell tumour of the right testis. It was a benign testicular tumour.
    explanation: Single clinically diagnosed CAIS case without AR molecular confirmation.
progression:
- phase: Presentation across the AIS spectrum
  notes: CAIS may be recognized with an inguinal mass or hernia in childhood or primary amenorrhea after spontaneous breast development. PAIS is often recognized from atypical genital anatomy at birth; MAIS may first be investigated for pubertal gynecomastia or infertility. These are alternative presentations, not a fixed sequence.
  evidence:
  - reference: PMID:29785970
    reference_title: Phenotypic and molecular characteristics of androgen insensitivity syndrome patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Affected individuals typically exhibit inguinal swelling during infancy or primary amenorrhea during puberty.
    explanation: Background CAIS presentation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In some instances, the only observed abnormality appears to be male infertility
    explanation: MAIS clinical presentation.
- phase: Puberty and adult follow-up
  notes: With retained testes, CAIS usually undergoes spontaneous breast development; gonadectomized individuals require planned replacement. PAIS virilization is variable and cannot be predicted from an AR assay alone. Gonadal, bone, sexual and psychological follow-up continues into adulthood.
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Puberty treatment is not indicated in girls with retained testes.
    explanation: CAIS recommendation context.
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

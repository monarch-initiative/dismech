- name: Gynecomastia
  description: Pubertal androgen resistance with preserved aromatization of testosterone to
    estradiol shifts the effective sex-steroid balance, producing gynecomastia in individuals
    raised male. In the complete form the same hormonal milieu instead drives typical female
    breast development at puberty.

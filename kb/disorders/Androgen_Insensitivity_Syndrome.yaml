  description: Evaluate genital anatomy, gonadal location, pubertal development, menstrual history and fertility with chromosome testing. CAIS may present as childhood inguinal hernia or adolescent primary amenorrhea; PAIS and MAIS have different patterns. Clinical appearance alone does not establish an AR-related diagnosis or determine gender identity.
  diagnosis_term:
    preferred_term: Integrated DSD evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation

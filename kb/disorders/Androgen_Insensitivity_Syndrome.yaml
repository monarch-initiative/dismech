name: Androgen Insensitivity Syndrome
creation_date: '2026-05-11T04:48:29Z'
category: Mendelian
description: 'Androgen insensitivity syndrome is an X-linked 46,XY disorder of sex development
  in which testis determination and androgen biosynthesis are both intact, but target tissues
  cannot respond to circulating androgen because the androgen receptor encoded by AR is defective.
  It is a single allelic series graded by the residual transcriptional activity of the variant
  receptor: effectively absent activity gives the complete form (female external genitalia
  in a 46,XY individual, presenting as inguinal swelling in infancy or primary amenorrhoea
  at puberty), while retained partial activity gives the partial form (ambiguous or undervirilized
  male genitalia recognized at birth, with gynecomastia and impaired spermatogenesis after
  puberty). Because the testes are functional, antimullerian hormone production is preserved
  and Mullerian derivatives regress across the spectrum - the feature that separates androgen
  resistance from the gonadal-determination defects.'

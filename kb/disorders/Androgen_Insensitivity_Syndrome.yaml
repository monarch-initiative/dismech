clinical_trials:
- name: DRKS00003136
  phase: PHASE_III
  status: COMPLETED
  description: Prospectively registered randomized, blinded crossover comparison of transdermal testosterone and estradiol in adults with genetically confirmed CAIS after gonadectomy. The registry lists 30 planned and 26 final participants, completion in January 2016 and EudraCT 2010-021790-37. The primary mental-health quality-of-life comparison was not significant; a sexual-desire subscale favored testosterone. The metabolic publication is an exploratory secondary analysis of this same trial.
  notes: Registry checked 2026-09-21; last update 2025-02-13. Registry age ceiling is 55, while the publication reports participants aged 18–54. Withdrawal and missing visits reduced analysis populations. The 2022 abstract says 17 completed; its Methods describes 18 analyzed with permitted missing visits. No independent replication, long-term cardiovascular benefit or overall treatment equivalence is established.
  evidence:
  - reference: url:https://drks.de/search/en/trial/DRKS00003136
    reference_title: German Clinical Trials Register
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Postpubertal adult patient with complete androgen insensitivity syndrome classified as either Sinnecker Type 5A or 5B
    explanation: Registry eligibility; mutation confirmation and prior gonadectomy are adjacent criteria.
  - reference: PMID:30075954
    reference_title: 'Oestrogen versus androgen in hormone-replacement therapy for complete androgen insensitivity syndrome: a multicentre, randomised, double-dummy, double-blind crossover trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Mental health-related quality of life did not differ between treatment groups (linear mixed model, p=0·794)
    explanation: Original trial primary outcome.
  - reference: PMID:35258786
    reference_title: Metabolic effects of estradiol versus testosterone in complete androgen insensitivity syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here we report the results of a secondary metabolic outcome analysis of the first multicentre, randomised, double-dummy, double-blind crossover trial investigating the effects of estradiol in comparison to testosterone replacement therapy in CAIS probands
    explanation: Full secondary manuscript establishes cohort overlap.
  - reference: PMID:35258786
    reference_title: Metabolic effects of estradiol versus testosterone in complete androgen insensitivity syndrome.
    supports: SUPPORT

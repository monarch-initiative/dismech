- name: Pelvic and gonadal imaging
  description: Ultrasound and selected MRI identify gonadal location and internal anatomy and can assess a new mass. Imaging and serum tumor markers cannot reliably exclude microscopic germ-cell precursor lesions. Apparent Müllerian remnants require careful interpretation; benign stromal nodules are not synonymous with cancer.

- name: 46,XY Undervirilization
  description: 'Failure of androgen-dependent masculinization of the external genitalia, spanning
    the phenotypic continuum: fully female external genitalia in the complete form, commonly
    presenting as inguinal swelling in infancy or primary amenorrhoea at puberty; and ambiguous
    or undervirilized male genitalia in the partial form, with hypospadias, micropenis, perineal
    meatus, bifid scrotum, clitoral hypertrophy, fused labia majora, or a urogenital sinus
    anomaly.'

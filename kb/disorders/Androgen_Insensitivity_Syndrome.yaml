name: Androgen Insensitivity Syndrome
creation_date: '2026-05-11T04:48:29Z'
category: Mendelian
description: Androgen insensitivity syndrome (AIS) is an AR-related difference of sex development in which 46,XY individuals have testes and impaired tissue responses to androgen. Complete AIS usually has female external genitalia; partial AIS has variable genital virilization; mild AIS can present with infertility or pubertal undervirilization despite typical male external genitalia. Germline and postzygotic AR variants can impair ligand binding, DNA binding or transcriptional regulation, but residual activity does not reliably predict an individual phenotype, especially in partial AIS. Fetal testicular AMH activity is generally preserved, so Müllerian structures are absent or rudimentary. Age, gonadal status, tissue sensitivity and clinical goals shape endocrine findings and care.
disease_term:
  preferred_term: androgen insensitivity syndrome
  term:
    id: MONDO:0019154
    label: androgen insensitivity syndrome
synonyms:

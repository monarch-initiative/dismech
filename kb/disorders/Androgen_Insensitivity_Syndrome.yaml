- name: Sertoli-cell androgen receptor knockout mouse
  species: Mouse
  genotype: Ar exon 2 deletion induced by Amh-Cre (SCARKO)
  category: GENETIC
  publication: PMID:14745012
  description: Amh-Cre activity begins around embryonic day 15, before normal neonatal Sertoli AR expression. Selective receptor loss markedly reduces androgen-responsive Pem expression and impairs meiotic progression, with increased germ-cell apoptosis and no elongated spermatids at day 50. Stereological nuclear-volume estimates, rather than direct absolute cell counts, gave spermatocyte and round-spermatid values of 64% and 3% of controls. Sertoli nuclear volume was not significantly changed. Testicular descent, external development and androgen-dependent ducts were preserved; LH and testosterone were not significantly different, while FSH was higher.

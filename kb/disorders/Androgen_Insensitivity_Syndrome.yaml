      directness: DIRECT
      snippet: Single-nucleotide variants in the zinc fingers or &#x003b1;-helical portions of the DNA-binding domain impair binding to a sequence of regulatory nucleotides known as an androgen response element. Such binding is essential for the androgen receptor to exert transcriptional regulatory control over most of its target genes.
      explanation: Domain-specific molecular mechanism.

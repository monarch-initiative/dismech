    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: However, long-term studies are lacking, and whether or not there is a role for oestrogen blockers to prevent gynecomastia remains to be studied.
    explanation: Limits both treatment and prevention claims.
  target_mechanisms:
  - target: Gynecomastia
    treatment_effect: MODULATES
    description: Individualized management of the indicated manifestation; no correction of the AR variant is implied.
    evidence:
    - reference: PMID:35353710
      reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: The effect of medical treatment on gynaecomastia is variable and most males decide to undergo mastectomy.
      explanation: Guideline synthesis; individual preference remains central.
- name: Genetic counseling and family evaluation
  description: Explain X-linked transmission, de novo and postzygotic variants, possible maternal germline mosaicism, variable expression and testing limitations. Offer appropriate testing of at-risk relatives and reproductive counseling when a familial pathogenic variant is known. A blood mosaic fraction does not specify genital-tissue or germline burden. Support fertility counseling without promising assisted-reproduction success for an uncharacterized patient.
  treatment_term:
    preferred_term: Genetic counseling and family evaluation
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: the chance of transmitting it in each pregnancy is 50%.
    explanation: GeneReviews maternal heterozygote transmission counseling.
  - reference: PMID:30251955
    reference_title: 'Androgen Insensitivity Syndrome: Clinical Phenotype and Molecular Analysis in a Single Tertiary Center Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In four individuals (P5, P6, P8 and P16), 17% of AR-mutated gene patients, somatic mosaicism of mutant and wild type alleles was detected in DNA derived from blood leukocytes.
    explanation: Primary blood mosaicism evidence; no tissue fraction or universal recurrence risk.
- name: Testosterone as an alternative replacement in selected gonadectomized adults with CAIS
  description: A randomized crossover trial enrolled 26 gonadectomized adult women with genetically confirmed CAIS; 18 contributed to the primary analysis after withdrawals. Testosterone and estradiol did not differ significantly for the primary mental-health quality-of-life outcome. Testosterone improved only the sexual-desire component of the sexual-function questionnaire. This small secondary-endpoint finding can inform individualized specialist discussion but does not prove overall superiority, equivalence or long-term safety.
  treatment_term:
    preferred_term: Testosterone as an alternative replacement in selected gonadectomized adults with CAIS
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  evidence:
  - reference: PMID:30075954
    reference_title: 'Oestrogen versus androgen in hormone-replacement therapy for complete androgen insensitivity syndrome: a multicentre, randomised, double-dummy, double-blind crossover trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Mental health-related quality of life did not differ between treatment groups (linear mixed model, p=0·794)
    explanation: Primary outcome in the randomized crossover trial; full original manuscript was not recovered.
  - reference: PMID:30075954
    reference_title: 'Oestrogen versus androgen in hormone-replacement therapy for complete androgen insensitivity syndrome: a multicentre, randomised, double-dummy, double-blind crossover trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: For the FSFI, testosterone was superior to oestradiol only in improving sexual desire (linear mixed model, p=0·018).
    explanation: Secondary subscale result, not improvement in all sexual-function domains.
  - reference: PMID:30075954
    reference_title: 'Oestrogen versus androgen in hormone-replacement therapy for complete androgen insensitivity syndrome: a multicentre, randomised, double-dummy, double-blind crossover trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: No virilisation was observed, and gonadotrophin concentrations remained stable in both treatment groups.
    explanation: Observation during the trial, not evidence of lifelong safety.
  therapeutic_modality: SMALL_MOLECULE
notes: This entry retains complete, partial and mild AIS as clinical subtypes of the AR-related spectrum. Orphanet phenotype-frequency bands are retained with their original CAIS/PAIS scope and are not extrapolated to MAIS. Historical synonyms are preserved for retrieval. Gonadal anatomy, hormone reference ranges and gender identity are distinct dimensions. Management requires individualized multidisciplinary counseling; older case-report recommendations for routine early gonadectomy or sex assignment are not treated as current universal care.

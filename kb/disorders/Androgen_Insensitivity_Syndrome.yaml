  description: CAIS can be associated with low bone mineral density through limited androgen action and relative estrogen deficiency. Gonadectomy without adequate replacement adds risk. This is multifactorial and does not make osteoporosis obligatory or demonstrate a particular fracture rate.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Women with CAIS and intact gonads have an increased risk of developing low BMD due to bone insensitivity to testosterone and relative oestrogen deficiency. After gonadectomy, the risk of developing low BMD further increases.
    explanation: Guideline synthesis of bone-health observations.
  downstream:
  - target: Decreased bone mineral density
    description: Reduced accrual and later loss can produce low measured bone mineral density.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

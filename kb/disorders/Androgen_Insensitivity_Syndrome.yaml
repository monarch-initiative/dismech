pathophysiology:
- name: AR Germline Pathogenic Variant
  description: 'Hemizygous pathogenic variants in AR, the X-linked nuclear receptor that mediates
    testosterone and dihydrotestosterone responses, are the only established molecular cause
    of androgen insensitivity. AR is a single allelic series: the residual transcriptional
    activity retained by the variant receptor, not a difference in pathway, is what places
    an individual on the complete-to-partial phenotypic continuum.'

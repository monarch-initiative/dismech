treatments:
- name: Multidisciplinary DSD care and psychological support
  description: Coordinate endocrinology, genetics, urology/gynecology and psychological or sexual-health support. Explain the diagnosis transparently and sensitively, and revisit fertility, body image, sexual function and patient goals over time. Gender identity should be assessed before PAIS puberty induction; genital anatomy does not determine identity or mandate irreversible procedures.

- name: Androgen-Resistance Endocrine Feedback
  description: Androgen resistance reduces effective negative feedback at the hypothalamic-pituitary
    level while gonadal testosterone production, peripheral aromatization to estradiol, and
    Sertoli-cell antimullerian hormone production are preserved. The resulting biochemical
    signature - raised luteinizing hormone with normal-to-high testosterone - is shared across
    the severity spectrum.

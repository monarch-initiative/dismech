has_subtypes:
- name: CAIS
  display_name: Complete Androgen Insensitivity Syndrome (CAIS)
  subtype_term:
    preferred_term: complete androgen insensitivity syndrome
    term:
      id: MONDO:0021023
      label: complete androgen insensitivity syndrome
  description: Markedly reduced androgen responsiveness with female external genitalia, usually absent or rudimentary Müllerian structures, a short blind-ending vagina, sparse sexual hair and inguinal, labial or abdominal testes. Presentations include childhood inguinal hernia or adolescent primary amenorrhea. Occasional Wolffian remnants and atypical findings prevent an absolute internal-anatomy rule.
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
- name: PAIS
  display_name: Partial Androgen Insensitivity Syndrome (PAIS)
  subtype_term:
    preferred_term: partial androgen insensitivity syndrome
    term:
      id: MONDO:0010720
      label: partial androgen insensitivity syndrome
  description: Variable incomplete androgen responsiveness with predominantly male, predominantly female or ambiguous external genitalia. Pubertal virilization, gynecomastia and fertility vary. Genotype and in-vitro receptor assays do not determine an individual pubertal outcome.
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
- name: MAIS
  display_name: Mild Androgen Insensitivity Syndrome (MAIS)
  description: Typical male external genitalia with possible infertility, impaired pubertal virilization or gynecomastia. A distinct ontology descendant is not required to retain this recognized clinical subtype.
  genes:
  - preferred_term: AR
    term:
      id: hgnc:644
      label: AR
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: AIS usually follows X-linked inheritance through a hemizygous pathogenic AR variant. De novo variants and postzygotic mosaicism also occur. A heterozygous carrier has a 50% probability of transmitting the variant in each pregnancy; phenotype depends on chromosomal and biological context. A negative maternal blood test does not exclude germline mosaicism, and blood mosaic fractions do not specify fetal genital-tissue fractions.
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Androgen insensitivity syndrome (AIS) is a rare inherited condition caused by X-linked pathogenic mutations in the androgen receptor (AR) gene
    explanation: Guideline synthesis of established AR-related inheritance.
  - reference: PMID:30251955
    reference_title: 'Androgen Insensitivity Syndrome: Clinical Phenotype and Molecular Analysis in a Single Tertiary Center Cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In four individuals (P5, P6, P8 and P16), 17% of AR-mutated gene patients, somatic mosaicism of mutant and wild type alleles was detected in DNA derived from blood leukocytes.
    explanation: Four of 24 AR-positive cases in a selected tertiary-center series, not a population mosaicism frequency.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
    reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: the chance of transmitting it in each pregnancy is 50%.
    explanation: Maternal heterozygote transmission probability in GeneReviews counseling.

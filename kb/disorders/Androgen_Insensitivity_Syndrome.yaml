pathophysiology:
- name: Pathogenic AR Variation
  description: Hemizygous pathogenic germline variants and postzygotic mosaic AR variants can impair androgen receptor signaling. Defects differ by allele and domain; not every variant affects ligand binding, DNA binding and receptor abundance together. Genotype-phenotype correlation is especially limited in PAIS.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:35353710
    reference_title: 'Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Androgen insensitivity syndrome (AIS) is a rare inherited condition caused by X-linked pathogenic mutations in the androgen receptor (AR) gene
    explanation: Established gene-disease relationship.
  downstream:
  - target: Reduced Androgen Binding
    description: Some ligand-binding-domain variants reduce affinity, increase dissociation or otherwise impair ligand responsiveness.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/
      reference_title: Androgen Insensitivity Syndrome - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: impair androgen binding and impair transactivation by the AR. Some decrease only the apparent equilibrium affinity constant; some increase only the non-equilibrium dissociation rate; others do both, either with all androgens or selectively with certain androgens.
      explanation: GeneReviews describes allele-dependent biochemical defects.
  - target: Impaired AR DNA Binding
    description: Some DNA-binding-domain variants impair recognition of androgen response elements.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1429/

- name: Ubiquitous androgen receptor knockout mouse
  species: Mouse
  genotype: Ar exon 2 deletion induced by ubiquitous PGK-Cre
  category: GENETIC
  publication: PMID:14745012
  description: Global deletion of exon 2 eliminates functional AR and produces a CAIS-like female external phenotype with small abdominal or inguinal testes and absent androgen-dependent internal ducts. Müllerian derivatives were absent, consistent with preserved non-AR fetal testicular function. This does not recreate every patient allele or isolate the cell type responsible for infertility.

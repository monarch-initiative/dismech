    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Patients with CAIS and intraabdominal testes might be at increased risk of developing gonadal germ cell cancers (GGCC), mainly seminomas, but this risk seems to be low before/during puberty
    explanation: Guideline identifies the indication and its age-specific uncertainty.
  - reference: PMID:35353710

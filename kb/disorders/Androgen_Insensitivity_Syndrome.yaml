notes: 'This entry merges the previously separate Complete (MONDO:0021023) and Partial (MONDO:0010720)
  androgen insensitivity syndrome entries into the single AR allelic series they describe,
  with the two named clinical entities retained as grounded has_subtypes. The split was not
  carrying a mechanistic distinction: the two pathographs were near-isomorphic, three node
  pairs differing only by a ''Partial'' prefix on the same node, and severity is set by residual
  receptor activity rather than by a different pathway. The divergences that did exist were
  curation drift, not biology - the complete entry recorded raised luteinizing hormone and
  testosterone as phenotypes but never built the endocrine-feedback node the partial entry
  had, so this entry carries the explicit node for both. Follows the precedent set by ZRS-Related_Limb_Malformation,
  where a named entity was retargeted to its locus-level allelic series and the named entities
  kept as subtypes.


  Per-subtype detail is preserved rather than averaged: phenotypes whose frequency differs
  between the complete and partial forms are curated as separate subtype-keyed records (six
  of the ten shared phenotypes, including cryptorchidism, blind vagina, and germ cell neoplasia),
  and only phenotypes with identical frequency across the spectrum are unkeyed. Pathophysiology
  has no subtype slot, so severity is expressed in node descriptions.


  Mild androgen insensitivity (MAIS) is a recognized third clinical tier but has no distinct
  MONDO descendant term, so it is not curated as a subtype here; the milder-AR-variant contribution
  to isolated male infertility is captured on the Impaired Spermatogenesis and Sexual Function
  node. biological_scale is not yet populated on these nodes - a follow-up, deliberately out
  of scope for the merge.


  Management of both forms belongs in an experienced multidisciplinary DSD setting with transparent
  counselling, psychological support, attention to fertility and sexual function, gonadal
  tumour-risk management, and shared decisions about the timing of gonadectomy and hormone
  replacement. Androgen insensitivity overlaps clinically with other 46,XY DSDs, including
  testosterone biosynthesis defects, so diagnosis requires integration of phenotype, karyotype,
  hormone testing, and molecular results.


  Provenance gap carried over from the merged entries: ORPHA:754, the Orphanet record for
  the androgen insensitivity syndrome parent concept, is not present in the local Orphadata
  index, so the Orphanet rows cited here come from the subtype records ORPHA:99429 (complete)
  and ORPHA:90797 (partial). This matters more now than it did before the merge, because the
  entry is keyed at exactly that parent level.'

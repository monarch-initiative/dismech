- name: Bone health surveillance and supportive treatment
  description: Monitor bone mineral density as clinically appropriate, including adult DXA, and review hormone replacement, nutrition and physical activity. Weight-bearing exercise, adequate calcium and vitamin D are advised. Bisphosphonates may be considered for selected patients with low density or fractures; they are not routine therapy for everyone with AIS.

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Delaying gonadectomy allows for spontaneous pubertal development which is thought to be more satisfactory to the individual and also allows the patient to be fully involved in the shared decision-making to remove their gonads or not.
    explanation: Guideline rationale for avoiding an automatic early-removal rule.

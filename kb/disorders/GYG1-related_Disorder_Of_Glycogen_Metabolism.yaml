name: GYG1-Related Disorder of Glycogen Metabolism
creation_date: "2026-10-04T12:30:00Z"
category: Mendelian
synonyms:
- glycogenin-1 deficiency
- GYG1 deficiency
- glycogen storage disease XV
- polyglucosan body myopathy type 2
disease_term:
  preferred_term: GYG1-related disorder of glycogen metabolism
  term:
    id: MONDO:0100314
    label: GYG1-related disorder of glycogen metabolism
notes: >-
  A single gene-defined entity spanning two named presentations of biallelic
  GYG1 (glycogenin-1) deficiency: glycogen storage disease XV (OMIM 613507),
  with cardiomyopathy, and polyglucosan body myopathy type 2 (OMIM 616199),
  a skeletal myopathy. Which pole predominates depends on the variant: absent
  (truncating) glycogenin-1 gives a skeletal myopathy with glycogen and
  polyglucosan storage, while a nonfunctional (missense) glycogenin-1 expressed
  in the heart is deleterious and drives cardiomyopathy. No GeneReviews chapter
  exists for GYG1 (checked offline and against a live PubMed [book] search).
has_subtypes:
- name: GSD XV
  display_name: Glycogen storage disease XV (cardiac presentation)
  description: >-
    Presentation dominated by cardiomyopathy and arrhythmia, associated with
    expression of a nonfunctional glycogenin-1 in the heart and storage of
    abnormal glycogen; skeletal muscle may show glycogen depletion.
  subtype_term:
    preferred_term: glycogen storage disease XV
    term:
      id: MONDO:0013291
      label: glycogen storage disease XV
- name: PGBM2
  display_name: Polyglucosan body myopathy type 2 (skeletal presentation)
  description: >-
    Adult-onset, slowly progressive limb-girdle skeletal myopathy with
    accumulation of glycogen and polyglucosan in muscle fibers, typically
    without cardiomyopathy.
  subtype_term:
    preferred_term: polyglucosan body myopathy type 2
    term:
      id: MONDO:0014526
      label: polyglucosan body myopathy type 2
description: >-
  GYG1-related disorder of glycogen metabolism is an autosomal recessive
  condition caused by biallelic loss-of-function variants in GYG1, which encodes
  glycogenin-1, the self-glucosylating protein that primes glycogen synthesis in
  skeletal and cardiac muscle. Loss of normal glycogenin-1 autoglucosylation
  disrupts glycogen synthesis; depending on the variant, affected muscle
  accumulates abnormal, poorly branched glycogen (polyglucosan) or is depleted
  of glycogen. The disorder spans two poles: a skeletal myopathy with
  polyglucosan storage (polyglucosan body myopathy type 2) and a cardiomyopathy
  driven by a deleterious mutant glycogenin-1 in the heart (glycogen storage
  disease XV).
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Caused by biallelic loss-of-function variants in GYG1 (glycogenin-1).
genetic:
- name: GYG1
  gene_term:
    preferred_term: GYG1
    term:
      id: hgnc:4699
      label: GYG1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Glycogen storage disease type XV/polyglucosan body myopathy 2 (OMIM#613507/#616199) is caused by biallelic mutations in the GYG1 gene."
    explanation: Establishes biallelic GYG1 variants as the cause of both named presentations.
  - reference: PMID:20357282
    reference_title: Glycogenin-1 deficiency and inactivated priming of glycogen synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the glycogenin-1 gene, GYG1, revealed a nonsense mutation in one allele and a missense mutation, Thr83Met, in the other."
    explanation: Documents biallelic GYG1 variants in the index patient, consistent with recessive inheritance.
pathophysiology:
- name: GYG1 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic GYG1 variants either abolish glycogenin-1 (truncating alleles) or
    yield a nonfunctional protein (missense alleles).
  downstream:
  - target: Impaired Glycogenin-1 Autoglucosylation
    description: Absent or nonfunctional glycogenin-1 cannot prime glycogen synthesis normally.
  evidence:
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with GYG1 mutations are characterized by either the absence of glycogenin-1 or the expression of nonfunctional glycogenin-1, and there is storage of glycogen and polyglucosan in the affected tissues."
    explanation: States the two molecular consequences of GYG1 variants.
- name: Impaired Glycogenin-1 Autoglucosylation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Glycogenin-1 normally autoglucosylates to build the short oligosaccharide
    primer that glycogen synthase and branching enzyme extend into glycogen.
    Loss of this priming activity disrupts normal glycogen synthesis in muscle.
  molecular_functions:
  - preferred_term: glycogenin glucosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0008466
      label: glycogenin glucosyltransferase activity
  genes:
  - preferred_term: GYG1
    term:
      id: hgnc:4699
      label: GYG1
  downstream:
  - target: Polyglucosan and Glycogen Accumulation in Skeletal Muscle
    description: In skeletal muscle, loss of glycogenin-1 leads to focal storage of glycogen and polyglucosan.
  - target: Skeletal Muscle Glycogen Depletion
    description: In the founding case, inactivated priming instead depleted glycogen in skeletal muscle.
  - target: Mutant Glycogenin-1 Cardiotoxicity
    description: A nonfunctional glycogenin-1 expressed in the heart is deleterious and stores abnormal glycogen.
  evidence:
  - reference: PMID:20357282
    reference_title: Glycogenin-1 deficiency and inactivated priming of glycogen synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense mutation resulted in inactivation of the autoglucosylation of glycogenin-1 that is necessary for the priming of glycogen synthesis in muscle."
    explanation: Identifies loss of glycogenin-1 autoglucosylation as the molecular lesion.
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glycogen can be synthesized in the absence of glycogenin, and glycogenin-1 deficiency is not compensated for by upregulation of functional glycogenin-2."
    explanation: Clarifies that glycogen synthesis is not abolished without glycogenin-1 and is not rescued by glycogenin-2, so the lesion is abnormal rather than absent synthesis.

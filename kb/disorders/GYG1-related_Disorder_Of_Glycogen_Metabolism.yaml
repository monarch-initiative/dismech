histopathology:
- name: Polyglucosan bodies in muscle
  description: >-
    Subsarcolemmal and intermyofibrillar deposits that are PAS-positive and
    partially diastase (alpha-amylase) resistant, consistent with polyglucosan.
  evidence:
  - reference: PMID:26652229
    reference_title: Late-onset polyglucosan body myopathy in five patients with a homozygous mutation in GYG1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PAS-positive deposits consistent with polyglucosan"
    explanation: Describes the diagnostic polyglucosan deposits on muscle biopsy.
treatments:
- name: Supportive care
  description: >-
    Management is supportive; there is no disease-modifying therapy. Care centers
    on surveillance and treatment of cardiomyopathy and arrhythmia and on
    management of progressive muscle weakness, with advanced heart failure
    sometimes requiring cardiac transplantation.
discussions:
- discussion_id: mutant_glycogenin1_cardiomyopathy_causation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does expression of a mutant glycogenin-1 in the heart actually cause the
    cardiomyopathy, or is it only associated with it?
  attaches_to:
  - pathophysiology#Mutant Glycogenin-1 Cardiotoxicity
  rationale: >-
    The cardiac phenotype tracks with expression of a nonfunctional glycogenin-1
    rather than with loss of glycogenin-1 as such: patients who completely lack
    the protein from biallelic truncating variants do not develop cardiomyopathy.
    Whether the mutant protein is itself sufficient to cause the cardiomyopathy is
    not settled.
  evidence:
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An important question is whether expression of mutated glycogenin-1 does in fact cause cardiomyopathy since patients who completely lack glycogenin-1 because of biallelic truncating GYG1 mutations do not develop cardiomyopathy"
    explanation: The source explicitly leaves cardiomyopathy causation open and distinguishes truncating from missense alleles.

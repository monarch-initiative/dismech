    explanation: Documents biallelic GYG1 variants in the index patient, consistent with recessive inheritance.
pathophysiology:
- name: GYG1 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic GYG1 variants either abolish glycogenin-1 (truncating alleles) or
    yield a nonfunctional protein (missense alleles).
  genes:
  - preferred_term: GYG1
    term:
      id: hgnc:4699
      label: GYG1
  downstream:
  - target: Impaired Glycogenin-1 Autoglucosylation
    description: Absent or nonfunctional glycogenin-1 cannot prime glycogen synthesis normally.
  evidence:
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with GYG1 mutations are characterized by either the absence of glycogenin-1 or the expression of nonfunctional glycogenin-1, and there is storage of glycogen and polyglucosan in the affected tissues."
    explanation: States the two molecular consequences of GYG1 variants.
- name: Impaired Glycogenin-1 Autoglucosylation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Glycogenin-1 normally autoglucosylates to build the short oligosaccharide
    primer that glycogen synthase and branching enzyme extend into glycogen.
    Loss of this priming activity disrupts normal glycogen synthesis in muscle.
  molecular_functions:
  - preferred_term: glycogenin glucosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0008466
      label: glycogenin glucosyltransferase activity
  downstream:
  - target: Polyglucosan and Glycogen Accumulation in Skeletal Muscle
    description: In skeletal muscle, loss of glycogenin-1 leads to focal storage of glycogen and polyglucosan.
  - target: Mutant Glycogenin-1 Cardiotoxicity
    description: A nonfunctional glycogenin-1 expressed in the heart is deleterious and stores abnormal glycogen.
  evidence:
  - reference: PMID:20357282
    reference_title: Glycogenin-1 deficiency and inactivated priming of glycogen synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense mutation resulted in inactivation of the autoglucosylation of glycogenin-1 that is necessary for the priming of glycogen synthesis in muscle."
    explanation: Identifies loss of glycogenin-1 autoglucosylation as the molecular lesion.
- name: Polyglucosan and Glycogen Accumulation in Skeletal Muscle
  role: effector
  biological_scale: TISSUE
  description: >-
    In skeletal muscle, absent glycogenin-1 leads to focal accumulation of
    glycogen and abnormal, poorly branched polyglucosan in muscle fibers.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  chemical_entities:
  - preferred_term: glycogen
    modifier: INCREASED
    term:
      id: CHEBI:28087
      label: glycogen
  downstream:
  - target: Skeletal myopathy
    description: Polyglucosan and glycogen deposits disrupt muscle fibers, causing progressive weakness.
  - target: Proximal muscle weakness
    description: The myopathy manifests as progressive limb-girdle (proximal) weakness.
  evidence:
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absence of glycogenin-1 leads to the focal accumulation of glycogen and polyglucosan in skeletal muscle fibers."
    explanation: Supports skeletal-muscle storage of glycogen and polyglucosan as the consequence of glycogenin-1 absence.
- name: Mutant Glycogenin-1 Cardiotoxicity
  role: effector
  biological_scale: TISSUE
  description: >-
    When a nonfunctional (missense) glycogenin-1 is expressed in the heart it is
    deleterious, with storage of abnormal glycogen and cardiomyopathy. Whether the
    mutant protein is itself sufficient to cause the cardiomyopathy is unresolved,
    since patients who completely lack glycogenin-1 do not develop it (see discussions).
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: cardiac muscle tissue
    term:
      id: UBERON:0001133
      label: cardiac muscle tissue
  downstream:
  - target: Cardiomyopathy
    description: Storage of abnormal glycogen in cardiomyocytes produces cardiomyopathy.
  - target: Arrhythmia
    description: Abnormal cardiac storage material is associated with conduction disturbance.
  evidence:
  - reference: PMID:31628455
    reference_title: "Glycogenin is Dispensable for Glycogen Synthesis in Human Muscle, and Glycogenin Deficiency Causes Polyglucosan Storage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of mutated glycogenin-1 in the heart is deleterious, and it leads to storage of abnormal glycogen and cardiomyopathy."
    explanation: Supports a deleterious mutant glycogenin-1 in the heart as the driver of cardiomyopathy.

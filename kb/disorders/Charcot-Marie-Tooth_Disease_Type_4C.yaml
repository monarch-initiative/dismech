- name: Progressive Axonal Loss
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Secondary Axonal Loss and Length-Dependent Deficit"
  description: >-
    CMT4C is an almost pure demyelinating neuropathy, but motor amplitudes fall
    with age: median nerve CMAP amplitude is significantly lower after age 50
    than in younger patients. This is the axonal component that accumulates
    secondarily, and it tracks the loss of ambulation seen in older patients.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Interestingly, we observed a significant reduction of median nerve CMAP
      amplitude after age 50 years in comparison with younger patients,
      indicative of progressive axonal loss with age
    explanation: >-
      The authors' own interpretation of the amplitude decline as progressive
      axonal loss.
  downstream:
  - target: Progressive Demyelinating Sensorimotor Neuropathy
    causal_link_type: DIRECT
    description: >-
      Axonal loss adds a component of fixed deficit to the demyelinating
      neuropathy and drives the late loss of walking.
- name: Progressive Demyelinating Sensorimotor Neuropathy
  biological_scale: ORGANISM
  description: >-
    The clinical syndrome: a length-dependent sensorimotor demyelinating
    polyneuropathy, usually beginning before age 10 but with adult onset in a
    quarter of patients, producing distal weakness, sensory loss, foot deformity
    and, in a significant proportion after age 50, loss of independent walking.
  evidence:
  - reference: PMID:40745932

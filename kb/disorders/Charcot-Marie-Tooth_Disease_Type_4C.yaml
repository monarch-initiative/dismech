- name: Cranial Nerve Involvement
  biological_scale: ORGANISM
  description: >-
    Roughly half of patients have cranial nerve involvement, most often the
    eighth nerve with hearing loss, and also the seventh, ninth, tenth and
    twelfth. This is uncommon in the other CMT4 subtypes and is a practical
    diagnostic pointer. Whether the lesion is in the cranial nerve myelin itself
    or in the cochlea has not been settled, so the edge from the genotype to this
    node is left as an unknown-intermediate one rather than routed through the
    limb-nerve chain.
  evidence:
  - reference: PMID:40745932

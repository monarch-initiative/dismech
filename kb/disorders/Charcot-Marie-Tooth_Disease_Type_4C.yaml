- name: Paraspinal Muscle Weakness and Spinal Deformity
  biological_scale: ORGANISM
  description: >-
    Early, severe scoliosis or kyphoscoliosis is the feature that most sets
    CMT4C apart from the other CMT4 subtypes. It can be the presenting sign, and
    in two patients of a 103-patient cohort it was the only clinical
    abnormality, with the neuropathy detectable on nerve conduction study alone.
    The mechanical consequence — a restrictive respiratory deficit — is what
    drives the ventilatory morbidity in this disease.
  evidence:

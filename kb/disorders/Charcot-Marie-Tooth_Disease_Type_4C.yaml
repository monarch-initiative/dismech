name: Charcot-Marie-Tooth Disease Type 4C
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 4C (CMT4C) is an autosomal recessive
  demyelinating peripheral neuropathy caused by biallelic variants in SH3TC2,
  and is the most common of the recessive demyelinating (CMT4) forms. Its
  molecular lesion is unusual among the myelin neuropathies: SH3TC2 is not a
  myelin structural protein but a Rab11 effector that holds the Schwann cell's
  recycling endosome in working order. Disease-causing variants — truncating and
  missense alike — lose the SH3TC2-Rab11 interaction, so the protein is
  mistargeted away from the recycling endosome, membrane and receptor recycling
  fails, and ErbB2 internalization downstream of axonal neuregulin-1 is
  disturbed. The Schwann cell therefore never reads axonal calibre correctly,
  and myelinates poorly. Two features distinguish CMT4C clinically. Spinal
  deformity is early and prominent, to the point that scoliosis can be the
  presenting and occasionally the only sign; and cranial nerve involvement,
  especially hearing loss, is common, which is rare in the other CMT4 subtypes.
  The nodes of Ranvier are structurally disorganized in patient nerve biopsies
  as well as in the mouse, and correcting that architecture is one of the
  read-outs by which Schwann-cell-targeted gene replacement has been shown to
  work in the Sh3tc2-/- mouse.

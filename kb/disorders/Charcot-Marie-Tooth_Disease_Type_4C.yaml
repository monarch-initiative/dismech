animal_models:
- name: Sh3tc2 exon 1 knockout mouse
  species: Mouse
  genotype: Sh3tc2(DeltaEx1/DeltaEx1)
  description: >-
    Constitutive knockout in which exon 1 of Sh3tc2 is replaced by an EGFP
    cassette. It reproduces the demyelinating neuropathy and, importantly, the
    nodal disorganization that was subsequently confirmed in patient nerve
    biopsies. This is a single line, not two: the "Sh3tc2-/-" mouse used in the
    gene-replacement and neurotrophin-3 trials is the same allele, distributed
    as JAX stock #033933, so the RECAPITULATES and RESCUES links below all
    attach to one model.
  publication: PMID:19805030
  modeled_mechanisms:
  - target: Hypomyelination and Segmental Demyelination
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knockout develops progressive hypomyelinating neuropathy with reduced
      motor and sensory conduction velocity, matching the human demyelinating
      phenotype.
    limitations: >-
      A constitutive null models the truncating alleles that dominate the human
      allelic spectrum but not the missense alleles, whose defect is loss of
      Rab11 binding by a protein that is still made.
    readouts:
    - name: Motor and sensory nerve conduction velocity
      target: Hypomyelination and Segmental Demyelination
      direction: DECREASED
      interpretation: >-
        Slowed conduction is the functional signature of the hypomyelination.
      evidence:
      - reference: PMID:19805030
        reference_title: SH3TC2/KIAA1985 protein is required for proper myelination and the integrity of the node of Ranvier in the peripheral nervous system.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          The Sh3tc2(DeltaEx1/DeltaEx1) knockout animals develop progressive
          peripheral neuropathy manifested by decreased motor and sensory nerve
          conduction velocity and hypomyelination.
        explanation: Reports the conduction and myelination measurements.
    evidence:
    - reference: PMID:19805030
      reference_title: SH3TC2/KIAA1985 protein is required for proper myelination and the integrity of the node of Ranvier in the peripheral nervous system.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        The generated Sh3tc2 knockout mice thus present a reliable model of
        CMT4C neuropathy
      explanation: >-
        The authors' own assessment that the line models CMT4C.
  - target: Nodal and Paranodal Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Abnormal node of Ranvier organization was found first in this model and
      then confirmed in CMT4C patient nerve biopsies, so the model led the human
      observation rather than following it.
    limitations: >-
      Ultrastructural nodal analysis in the mouse is far more complete than what
      the confirmatory patient biopsies could show, so the degree of
      correspondence is not quantified.
    readouts:
    - name: Node of Ranvier organization on peripheral nerve ultrastructure
      target: Nodal and Paranodal Disorganization
      direction: ALTERED
      interpretation: >-
        Disorganized nodal architecture, the structural correlate of this node.
      evidence:
      - reference: PMID:19805030
        reference_title: SH3TC2/KIAA1985 protein is required for proper myelination and the integrity of the node of Ranvier in the peripheral nervous system.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          detailed analyses of the structures composed of compact and noncompact
          myelin in the peripheral nerve of Sh3tc2(DeltaEx1/DeltaEx1) animals
          revealed abnormal organization of the node of Ranvier
        explanation: >-
          The ultrastructural nodal measurement made in the mouse. The patient
          confirmation from the same sentence is quoted on the pathophysiology
          node instead.
    evidence:
    - reference: PMID:19805030
      reference_title: SH3TC2/KIAA1985 protein is required for proper myelination and the integrity of the node of Ranvier in the peripheral nervous system.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        a morphological phenotype that can be used as an additional CMT4C
        diagnostic marker
      explanation: >-
        The authors treat the nodal phenotype as directly informative for human
        CMT4C.
  - target: Disturbed Neuregulin-1/ErbB2 Trafficking and Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same line was used to show that Sh3tc2 loss perturbs the Nrg1/ErbB
      pathway and ErbB2 internalization.
    limitations: >-
      The signalling work is mouse and cell-based. The bridge to human disease
      is that patient missense alleles also impair ErbB2 internalization, which
      is an in vitro result rather than a measurement in patient nerve.
    readouts:
    - name: ErbB2 internalization after neuregulin-1 stimulation
      target: Disturbed Neuregulin-1/ErbB2 Trafficking and Signalling
      direction: ALTERED
      interpretation: >-
        Sh3tc2 loss changes the rate at which ErbB2 leaves the plasma membrane,
        the trafficking step this node describes.
      evidence:
      - reference: PMID:23553667
        reference_title: Sh3tc2 deficiency affects neuregulin-1/ErbB signaling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          We demonstrated that Sh3tc2 interacts with ErbB2 and plays a role in
          the regulation of ErbB2 intracellular trafficking from the plasma
          membrane upon Nrg1 activation.
        explanation: Reports the trafficking measurement.
    evidence:
    - reference: PMID:23553667
      reference_title: Sh3tc2 deficiency affects neuregulin-1/ErbB signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Altogether, our results indicate that the molecular mechanism for the
        axonal size sensing is disturbed in Sh3tc2-deficient myelinating Schwann
        cells, thus providing a novel insight into the pathophysiology of CMT4C
        neuropathy.
      explanation: >-
        The authors present this model as informative for CMT4C pathophysiology.
  - target: Hypomyelination and Segmental Demyelination
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Schwann-cell-targeted SH3TC2 replacement improved myelin thickness,
      g-ratios and the proportion of demyelinated fibres, and increased motor
      conduction velocities — a causal test of the myelination arm of the
      mechanism.
    limitations: >-
      Rescue was partial and was measured 4-8 weeks after a single intrathecal
      injection in young mice. No human trial exists, and the mouse null does not
      carry the missense alleles that make up a fifth of the human allelic
      spectrum.
    readouts:
    - name: Myelin thickness and g-ratio in sciatic nerve and lumbar roots
      target: Hypomyelination and Segmental Demyelination
      direction: RESTORED
      interpretation: >-
        Restoring SH3TC2 to Schwann cells improves the myelin measurements,
        showing the demyelination is a consequence of the Schwann cell defect
        and is at least partly reversible.
      evidence:
      - reference: PMID:30907403
        reference_title: Gene replacement therapy in a model of Charcot-Marie-Tooth 4C neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          On a structural level, morphological analysis revealed significant
          improvement in g-ratios, myelin thickness, and ratios of demyelinated
          fibres in lumbar roots and sciatic nerves of treated Sh3tc2-/- mice.
        explanation: Reports the myelin morphometry after treatment.
    - name: Motor nerve conduction velocity
      target: Hypomyelination and Segmental Demyelination
      direction: INCREASED
      interpretation: >-
        Faster conduction after treatment, the functional counterpart of the
        myelin measurements.
      evidence:
      - reference: PMID:30907403
        reference_title: Gene replacement therapy in a model of Charcot-Marie-Tooth 4C neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          Moreover, motor nerve conduction velocities were increased in treated
          Sh3tc2-/- mice.
        explanation: Reports the conduction measurement after treatment.
    evidence:
    - reference: PMID:30907403
      reference_title: Gene replacement therapy in a model of Charcot-Marie-Tooth 4C neuropathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Sh3tc2-/- mice represent a well characterized disease model developing
        early onset progressive peripheral neuropathy with hypo- and
        demyelination, slowing of nerve conduction velocities and disturbed
        nodal architecture.
      explanation: >-
        Establishes that this line models the demyelinating phenotype the rescue
        acts on.
  - target: Nodal and Paranodal Disorganization
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Both the lentiviral and the AAV9 vector normalized nodal molecular
      architecture, including after delayed treatment.
    limitations: >-
      Nodal normalization is a molecular-marker read-out in the mouse; no
      equivalent measurement has been made in a treated human nerve, and no
      human trial exists.
    readouts:
    - name: Nodal molecular architecture
      target: Nodal and Paranodal Disorganization
      direction: RESTORED
      interpretation: >-
        Nodal organization is restored by returning SH3TC2 to Schwann cells.
      evidence:
      - reference: PMID:37641403
        reference_title: AAV9-mediated SH3TC2 gene replacement therapy targeted to Schwann cells for the treatment of CMT4C.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: >-
          Moreover, treatment led to normalization of the organization of the
          nodes of Ranvier, which is typically deficient in CMT4C patients and
          Sh3tc2-/- mice, along with reduced ratios of demyelinated fibers,
          increased myelin thickness and reduced g-ratios at both time points of
          intervention.
        explanation: >-
          Reports nodal normalization after both early and delayed treatment.
    evidence:
    - reference: PMID:37641403
      reference_title: AAV9-mediated SH3TC2 gene replacement therapy targeted to Schwann cells for the treatment of CMT4C.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Taken together, our results provide a proof of concept for an effective
        and potentially translatable gene replacement therapy for CMT4C
        treatment.
      explanation: >-
        The authors' assessment of the model's translational relevance for CMT4C.
treatments:
- name: Multidisciplinary Symptomatic Management
  description: >-
    No disease-modifying therapy exists. GeneReviews describes management as
    symptomatic and delivered by a team spanning neurology, physiatry,
    orthopaedic surgery, therapy services, audiology, speech and language, and
    respiratory medicine.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301514
    reference_title: SH3TC2-Related Hereditary Motor and Sensory Neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Treatment is symptomatic. Affected individuals are often managed by a
      multidisciplinary team that includes neurologists, physiatrists,
      orthopedic surgeons, physical and occupational therapists,
      audiologists/otolaryngologists, speech and language therapists, and
      pulmonologists.
    explanation: >-
      The management standard for this disorder.
- name: Scoliosis Surgery
  description: >-
    Surgical correction of spinal deformity. In the Inherited Neuropathy
    Consortium cohort 36% of participants had undergone scoliosis surgery, which
    makes this the most frequently performed intervention in CMT4C.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Paraspinal Muscle Weakness and Spinal Deformity
    description: >-
      Surgery corrects the deformity itself; it does not act on the neuropathy
      that causes it.
  evidence:
  - reference: PMID:36947133
    reference_title: "Neuropathy due to bi-allelic SH3TC2 variants: genotype-phenotype correlation and natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      There was a high rate of scoliosis (81%), scoliosis surgery (36%), and
      walking difficulty (94%) among study participants.
    explanation: >-
      Documents how often scoliosis surgery is actually performed in this
      population.
- name: Non-Invasive Ventilation
  description: >-
    For scoliosis-related restrictive respiratory failure. Three of 103 patients
    in the largest cohort were treated this way, and the authors recommend
    systematic respiratory assessment in patients with scoliosis.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: non-invasive ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  target_mechanisms:
  - target: phenotypes#Scoliosis-Related Respiratory Insufficiency
    description: >-
      Ventilatory support for the restrictive deficit produced by chest wall
      deformity.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Three patients (3%) were treated with non-invasive ventilation (NIV) for
      scoliosis-related respiratory insufficiency.
    explanation: >-
      Documents the use of non-invasive ventilation in CMT4C patients.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance with a 25% sibling recurrence risk. Carrier
    testing is complicated in populations with high carrier frequency, where an
    apparently asymptomatic person tested as a carrier may turn out to be
    homozygous.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301514
    reference_title: SH3TC2-Related Hereditary Motor and Sensory Neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      If both parents are known to be heterozygous for an SH3TC2 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of inheriting biallelic SH3TC2 pathogenic variants and being affected
    explanation: >-
      The recurrence risk that genetic counselling communicates.
- name: Schwann-Cell-Targeted SH3TC2 Gene Replacement (preclinical)
  description: >-
    Lentiviral and AAV9 vectors carrying human SH3TC2 under a myelin protein
    zero promoter, delivered intrathecally to Sh3tc2-/- mice. This is preclinical
    only: no human trial has been reported, and it is curated here because the
    rescue is the strongest causal test of the entry's mechanism, not because it
    is available to patients.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic SH3TC2 Loss of Function
    description: >-
      Restores SH3TC2 expression in myelinating Schwann cells, acting at the
      root of the pathograph.
  evidence:
  - reference: PMID:30907403
    reference_title: Gene replacement therapy in a model of Charcot-Marie-Tooth 4C neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      This study provides a proof of principle for viral gene replacement
      therapy targeted to Schwann cells to treat Charcot-Marie-Tooth disease
      type 4C
    explanation: >-
      Establishes the approach as a proof of principle in the mouse, which is
      the limit of what is claimed here.
- name: Neurotrophin-3 Surrogate Gene Therapy (preclinical)
  description: >-
    An alternative to correcting the Schwann cell gene: intramuscular
    scAAV1.tMCK.NT-3 turns skeletal muscle into a source of circulating
    neurotrophin-3, an autocrine factor for Schwann cell survival, differentiation
    and myelination. In Sh3tc2-/- mice it improved rotarod, grip strength and
    conduction velocity, and improved hypomyelination and neuromuscular junction
    denervation. Its rationale is explicitly the difficulty of reaching human
    Schwann cells with an intrathecal vector, so it is a bypass rather than a
    correction of the SH3TC2 defect. Preclinical only.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Hypomyelination and Segmental Demyelination
    description: >-
      Circulating NT-3 acts on the Schwann cell to promote myelination
      downstream of, and without repairing, the SH3TC2 defect.
  evidence:
  - reference: PMID:39544702
    reference_title: AAV1.tMCK.NT-3 gene therapy improves phenotype in Sh3tc2(-/-) mouse model of Charcot-Marie-Tooth Type 4C.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      NT-3 gene therapy improved functional and electrophysiological outcomes
      including rotarod, grip strength and nerve conduction velocity.
    explanation: >-
      Reports the functional benefit of NT-3 gene therapy in the CMT4C mouse.
  - reference: PMID:39544702
    reference_title: AAV1.tMCK.NT-3 gene therapy improves phenotype in Sh3tc2(-/-) mouse model of Charcot-Marie-Tooth Type 4C.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Qualitative and quantitative histopathological studies showed that
      hypomyelination of peripheral nerves and denervated status of
      neuromuscular junctions at lumbrical muscles were also improved in the
      NT-3-treated mice.
    explanation: >-
      Reports the structural benefit on the myelination node this treatment
      targets.
- name: Avoidance of Neurotoxic Medication and Obesity
  description: >-
    GeneReviews lists obesity and neurotoxic drugs as circumstances to avoid in
    this disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: preventive intervention
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: PMID:20301514
    reference_title: SH3TC2-Related Hereditary Motor and Sensory Neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Agents/circumstances to avoid: Obesity, which makes walking more
      difficult; medications that are toxic or potentially toxic to persons with
      hereditary motor and sensory neuropathy.
    explanation: >-
      The GeneReviews avoidance recommendation.
differential_diagnoses:
- name: Chronic Inflammatory Demyelinating Polyradiculoneuropathy
  description: >-
    CMT4C produces motor conduction block and temporal dispersion in half of
    patients, which is the electrophysiological signature usually taken to
    indicate an acquired inflammatory neuropathy. Two patients in the largest
    cohort were diagnosed with CIDP and given intravenous immunoglobulin before
    the genetic diagnosis was made; treatment was ineffective in both.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Two patients were diagnosed with chronic inflammatory demyelinating
      polyneuropathy (CIDP) and were treated with intravenous immunoglobulins
      (IVIg) before being diagnosed with hereditary neuropathy.
    explanation: >-
      Documents the misdiagnosis actually occurring in this cohort.
- name: Friedreich Ataxia
  description: >-
    Both share polyneuropathy and scoliosis, and the CMT4C patient with
    cerebellar signs had carried an FRDA diagnosis. The authors distinguish them
    by the absence in CMT4C of cardiomyopathy, endocrine abnormality and dentate
    iron accumulation.
  evidence:
  - reference: PMID:31346473
    reference_title: The cerebellar phenotype of Charcot-Marie-Tooth neuropathy type 4C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Some clinical features of FRDA and CMT4C overlap, with both conditions
      featuring polyneuropathy and scoliosis.
    explanation: >-
      States the overlap that creates the differential.
- name: Other CMT4 Subtypes
  description: >-
    CMT4A, 4B1, 4B2, 4D, 4F and 4J are also autosomal recessive demyelinating
    neuropathies and are curated as has_subtypes entries on Charcot-Marie-Tooth
    Disease Type 4. CMT4C is distinguished by the prominence of early scoliosis
    and by frequent cranial nerve involvement.
discussions:
- discussion_id: cmt4c_scoliosis_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Paraspinal Muscle Weakness and Spinal Deformity
  prompt: >-
    Why is spinal deformity so much more prominent in CMT4C than in the other
    demyelinating neuropathies, and does it arise from paraspinal denervation
    alone?
  rationale: >-
    Scoliosis is the feature that most distinguishes CMT4C, present in 73-81% of
    patients and severe enough to require surgery in a third, and it can be the
    only clinical sign. The route from a length-dependent neuropathy to axial
    deformity is assumed to be weakness of trunk musculature during growth, but
    no study has measured paraspinal involvement in CMT4C, and the assumption
    does not explain why this subtype is affected so much more than others whose
    limb neuropathy is comparable or worse. The edge in this entry is therefore
    curated as a mechanism claim without direct supporting measurement.
- discussion_id: cmt4c_cranial_nerve_substrate
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cranial Nerve Involvement
  prompt: >-
    Is the hearing loss in CMT4C due to demyelination of the eighth nerve, to
    cochlear pathology, or to both?
  rationale: >-
    Hearing loss affects over a third of patients and cranial nerve involvement
    nearly half, but no temporal bone or cochlear pathology from a CMT4C patient
    has been reported, and the published series record the deficit clinically
    without localizing it. Since SH3TC2 expression in peripheral nerve is
    restricted to Schwann cells, a myelin lesion of the eighth nerve is the
    natural hypothesis, but it has not been demonstrated.
- discussion_id: cmt4c_missense_mouse_gap
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Mouse
  prompt: >-
    Do the constitutive Sh3tc2 null mice model the missense alleles that make up
    a fifth of human CMT4C, in which a full-length protein is made but cannot
    bind Rab11?
  rationale: >-
    Both published mouse lines are nulls. Roughly 20% of human alleles are
    missense, and the cell-based work shows their defect is loss of Rab11 binding
    and consequent mistargeting rather than absence of protein — a mislocalized
    protein could in principle have effects a null does not. The clinical
    evidence is that missense and truncating alleles give the same disease, and
    the largest cohort found no severity difference between the one-truncating
    and zero-truncating groups, so the null is a reasonable proxy. But the
    proposition has been tested only in transfected cells, never in an animal
    carrying a knock-in missense allele, and gene-replacement results obtained in
    nulls are being read as evidence for a therapy that would be given to
    missense carriers too.
  proposed_experiments:
  - experiment_id: cmt4c_missense_knockin_mouse
    name: Knock-in mouse carrying a CMT4C missense allele
    description: >-
      Generate a mouse carrying a Rab11-binding-deficient Sh3tc2 missense allele
      equivalent to a human CMT4C variant, and compare its nerve phenotype and
      its response to SH3TC2 gene replacement with the null.
    would_support:
    - pathophysiology#Loss of the SH3TC2-Rab11 Interaction
    supporting_outcome:
    - >-
      A missense knock-in reproduces the null's hypomyelination and nodal
      disorganization and responds comparably to gene replacement, confirming
      that loss of Rab11 binding is the whole of the missense mechanism.
    would_refute:
    - pathophysiology#Loss of the SH3TC2-Rab11 Interaction
    refuting_outcome:
    - >-
      The missense knock-in shows a phenotype the null does not, or fails to
      respond to gene replacement, indicating the mislocalized protein does
      something beyond losing its Rab11 function.
notes: >-
  Entry type. This is curated as a standalone Disease rather than as a
  has_subtypes entry on Charcot-Marie-Tooth Disease Type 4, which already carries
  a CMT4C subtype block naming SH3TC2. The reason is that the umbrella binds the
  gene and the subtype label but curates no CMT4C-specific mechanism beyond a
  single node, while CMT4C has a distinct molecular pathway (Rab11 effector loss
  and recycling-endosome mistargeting), its own natural history cohorts, its own
  minimum prevalence, two animal models and a preclinical gene therapy. Note that
  the general policy question of when a per-subtype CMT entry should instead be
  an entry_type SUBTYPE stub was raised on PR #9696 and has not been settled;
  this entry follows the merged precedent set by Charcot-Marie-Tooth Disease Type
  4K rather than treating that question as closed. The umbrella was not modified.

  Named entity confusion. SH3TC2 has one substantial off-target literature: it is
  reported as an oncogene in colorectal cancer (PMID:35954399, not cited here),
  and pan-cancer expression studies are the main non-neuropathy hits on the gene
  symbol. Every reference cited in this entry was checked to be about SH3TC2
  neuropathy specifically. Two further care points: PMID:40745932 is a nationwide
  SH3TC2 neuropathy cohort, not a general CMT cohort, so its percentages are
  CMT4C percentages; and PMID:31346473 is a five-patient single-centre cohort in
  which the cerebellar findings rest on one patient, which the phenotype entry
  states rather than implying a frequency.

  Frequency banding. All phenotype bands come from PMID:40745932 (n=103) unless
  stated. Where a second cohort disagrees — scoliosis at 73% versus 81% — both
  numbers are curated and the band follows the larger, more recent series, with
  the disagreement recorded in the phenotype description rather than averaged
  away. Sensory ataxia and the cerebellar phenotype carry no frequency at all
  because their sources give none.

  Prevalence. The only published figure is the Norwegian minimum prevalence of
  0.7/100,000, which is a floor derived from diagnostic registries. Orphanet
  publishes an epidemiology class for this disorder, but it could not be
  consulted: `just refresh-orphadata` aborts on a drifted sha256 against the
  snapshot pinned in data/orphadata/MANIFEST.yaml, and `just fetch-reference
  ORPHA:...` is not a supported path for this prefix. Repinning the manifest
  would rewrite every committed ORPHA cache file and does not belong in a
  curation PR. This entry should gain an Orphanet prevalence class once that is
  fixed.

  Cerebellar findings and PDF extraction. PMID:31346473 is a PDF-derived cache
  whose body text carries extraction artifacts, including a mangled "CMTC4A" for
  CMT4C in the concluding sentence and several missing spaces around the gene
  symbol. The two snippets quoted here were taken from the clean abstract block
  and checked character by character; the damaged conclusion sentence is
  deliberately not quoted.

  Gene therapy caveat. Two Schwann-cell-targeted SH3TC2 replacement studies and
  one neurotrophin-3 surrogate study are curated, all preclinical. The NT-3
  authors argue directly that intrathecal Schwann-cell transduction may not
  translate from mouse to human because of the anatomy of the human sciatic
  nerve, and recommend non-human primate testing first. That caveat is stated in
  the NT-3 treatment description rather than left implicit, so the two
  approaches are not read as equally close to the clinic.

  Not curated. No histopathology block: the only quantified pathology statement
  is the six-biopsy demyelination and onion-bulb finding, which is curated on the
  demyelination node where it does mechanistic work. No biochemical block: blood
  neurofilament light is reported as a treatment-response biomarker in the mouse
  gene-therapy study, not as a validated human CMT4C biomarker, so it is recorded
  in the model readout description rather than promoted to a biomarker claim. No
  datasets block: no CMT4C-specific accession was identified.

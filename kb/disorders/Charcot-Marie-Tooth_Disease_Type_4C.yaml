- name: Nodal and Paranodal Disorganization
  biological_scale: TISSUE
  description: >-
    Abnormal organization of the node of Ranvier was found in the Sh3tc2
    knockout mouse and then confirmed in CMT4C patient nerve biopsies. It is
    the structural read-out that Schwann-cell-targeted gene replacement
    normalizes in the mouse, which is why it is modelled as its own node rather
    than folded into demyelination.
  cellular_components:
  - preferred_term: node of Ranvier
    term:
      id: GO:0033268
      label: node of Ranvier
  evidence:
  - reference: PMID:19805030
    reference_title: SH3TC2/KIAA1985 protein is required for proper myelination and the integrity of the node of Ranvier in the peripheral nervous system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      a phenotype that we confirmed in CMT4C patient nerve biopsies
    explanation: >-
      Nodal disorganization was confirmed in nerve biopsies from CMT4C patients.

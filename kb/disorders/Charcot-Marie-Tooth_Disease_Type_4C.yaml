- name: Nerve Conduction Slowing and Conduction Block
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Nerve Conduction Slowing and Conduction Block"
  description: >-
    Motor conduction velocities fall into the demyelinating range in essentially
    every patient, and half also show a motor conduction block or temporal
    dispersion — a pattern more often associated with acquired inflammatory
    neuropathy, and one reason CMT4C is sometimes mistaken for CIDP.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Nerve conduction studies showed sensorimotor abnormalities within the
      demyelinating range in all cases.
    explanation: >-
      Demyelinating-range conduction in all 103 patients.
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."

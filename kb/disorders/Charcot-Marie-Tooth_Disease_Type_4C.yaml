progression:
- phase: Childhood onset
  notes: >-
    Sixty percent of patients develop symptoms before age 10, typically with
    foot deformity, distal weakness, sensory ataxia and scoliosis. A quarter,
    however, present only after age 20, so childhood onset is the rule rather
    than a criterion.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Mean age at disease onset was 14 years (0-52), 60% of patients started the
      disease before age 10 years, and 24% after age 20 years.
    explanation: >-
      Establishes both the childhood-onset majority and the substantial
      adult-onset minority.
- phase: Adult loss of ambulation
  notes: >-
    Walking deteriorates with age. Nearly half of patients walked independently
    before age 50 but only 13% did so after 50, and 23% of those over 50 were
    wheelchair-bound.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Half the patients (48%) walked independently before age 50 years, in
      contrast with only 13% after age 50 years. After age 50 years, 23% of
      patients were wheelchair-bound.
    explanation: >-
      Quantifies the age-related decline in ambulation.
genetic:
- name: SH3TC2
  gene_term:
    preferred_term: SH3TC2
    term:
      id: hgnc:29427
      label: SH3TC2
  relationship_type: CAUSATIVE
  association: Biallelic Pathogenic Variants
  notes: >-
    SH3TC2 (originally KIAA1985) is the only gene known to cause CMT4C. The
    p.Arg954* nonsense allele is the dominant recurrent variant across European
    cohorts, and founder effects have been reported in French Canadians and in a
    Swedish cohort in which all five patients were homozygous for it. Carrier
    frequency is relatively high in some populations, notably individuals of
    Spanish Roma heritage.
  evidence:
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      the pathogenic variant c.2860C>T, p.(Arg954*) being the most frequently
      identified, that is, 45.6% of the alleles and 67% of families
    explanation: >-
      Quantifies the recurrent p.Arg954* allele in the largest cohort.
  - reference: PMID:20301514
    reference_title: SH3TC2-Related Hereditary Motor and Sensory Neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Because the carrier frequency for SH3TC2-HMSN in certain populations
      (e.g., individuals of Spanish Roma heritage) is relatively high and the
      onset of SH3TC2-HMSN may be late, some individuals who undergo carrier
      testing may be identified as being homozygous.
    explanation: >-
      Records the population carrier-frequency point and its practical
      consequence for carrier testing.
  case_fractions:
  - population: All Charcot-Marie-Tooth disease
    case_fraction_low: 0.0
    case_fraction_high: 7.0
    notes: >-
      A range compiled across published series rather than a single measurement,
      and the zero lower bound reflects series in which no CMT4C was found. Not a
      population estimate.
    evidence:
    - reference: PMID:40745932
      reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        It is a rare disease, representing 0%-7% of all CMT
      explanation: >-
        Source of the CMT4C share of all CMT across published series.

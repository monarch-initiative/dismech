pathophysiology:
- name: Biallelic SH3TC2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  description: >-
    Two pathogenic SH3TC2 alleles remove functional SH3TC2 from myelinating
    Schwann cells. The allelic spectrum is dominated by truncating variants — in
    a 103-patient series, nonsense and frameshift alleles together accounted for
    69% of alleles, with p.Arg954* alone accounting for 45.6% — but missense
    variants produce the same clinical picture, which is what first pointed to a
    shared downstream defect rather than to simple dosage.
  genetic_context:
    gene:
      preferred_term: SH3TC2
      term:
        id: hgnc:29427
        label: SH3TC2
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:14574644
    reference_title: Mutations in a gene encoding a novel SH3/TPR domain protein cause autosomal recessive Charcot-Marie-Tooth type 4C neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We observed eight distinct protein-truncating mutations and three
      nonconservative missense mutations affecting amino acids conserved through
      evolution.
    explanation: >-
      Establishes that both truncating and missense SH3TC2 alleles cause the
      disease, the observation that motivates a shared downstream mechanism.
  - reference: PMID:40745932
    reference_title: "Nationwide Phenotypic and Genotypic Characterisation of 103 Patients With SH3TC2 Gene-Related Demyelinating Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Frameshift variants accounted for 10% of the series, contributing to a
      total of 69% truncated protein.
    explanation: >-
      Quantifies the predominance of truncating alleles in the largest published
      CMT4C cohort.
  downstream:
  - target: Loss of the SH3TC2-Rab11 Interaction
    causal_link_type: DIRECT
    description: >-
      Every disease-causing SH3TC2 construct tested loses the ability to bind
      Rab11, so this is the immediate molecular consequence of the genotype.
- name: Loss of the SH3TC2-Rab11 Interaction
  biological_scale: MOLECULAR
  description: >-
    Wild-type SH3TC2 is a Rab11 effector: it binds preferentially to GTP-loaded
    Rab11 and is thereby held on the perinuclear recycling endosome.
    Disease-causing variants cannot associate with Rab11, and are mistargeted
    away from that compartment. The authors of the localization study proposed
    this mistargeting as the fundamental molecular defect of CMT4C — the step
    where truncating and missense alleles converge.
  molecular_functions:
  - preferred_term: SH3TC2 binding to GTP-loaded Rab11
    term:
      id: GO:0031267
      label: small GTPase binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  evidence:
  - reference: PMID:20028792
    reference_title: Mistargeting of SH3TC2 away from the recycling endosome causes Charcot-Marie-Tooth disease type 4C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      We show that wild-type SH3TC2 targets to the intracellular recycling
      endosome by associating with the small GTPase, Rab11, which is known to
      regulate the recycling of internalized membrane and receptors back to the
      plasma membrane.
    explanation: >-
      Establishes the normal SH3TC2-Rab11 interaction whose loss this node
      describes.
  - reference: PMID:20028792
    reference_title: Mistargeting of SH3TC2 away from the recycling endosome causes Charcot-Marie-Tooth disease type 4C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Of clinical pathological relevance, all SH3TC2 constructs harbouring
      disease-causing mutations are shown to be unable to associate with Rab11
      with consequent loss of recycling endosome localization.
    explanation: >-
      Every disease-causing construct tested loses Rab11 binding and recycling
      endosome localization, which is the claim of this node.
  - reference: PMID:20826437
    reference_title: "SH3TC2, a protein mutant in Charcot-Marie-Tooth neuropathy, links peripheral nerve myelination to endosomal recycling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Consistent with a function of Rab11 in Schwann cell myelination, SH3TC2
      mutations that cause neuropathy disrupt the SH3TC2/Rab11 interaction, and
      forced expression of dominant negative Rab11 strongly impairs myelin
      formation in vitro.
    explanation: >-
      Independent replication of the loss of Rab11 binding, and the reciprocal
      experiment showing that blocking Rab11 alone impairs myelination.
  downstream:
  - target: Impaired Schwann Cell Endosomal Recycling
    causal_link_type: DIRECT
    description: >-
      Losing the Rab11 effector removes SH3TC2 from the compartment that returns
      internalized membrane and receptors to the cell surface.
- name: Impaired Schwann Cell Endosomal Recycling
  biological_scale: CELLULAR
  description: >-
    SH3TC2 expression in peripheral nerve is restricted to Schwann cells, where
    it sits on the plasma membrane and the perinuclear endocytic recycling
    compartment. With SH3TC2 mistargeted, receptor recycling is measurably
    altered: wild-type but not mutant SH3TC2 influences transferrin receptor
    dynamics.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: DECREASED
  evidence:
  - reference: PMID:20826437
    reference_title: "SH3TC2, a protein mutant in Charcot-Marie-Tooth neuropathy, links peripheral nerve myelination to endosomal recycling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      SH3TC2 expression is restricted to Schwann cells in the peripheral nervous
      system, and the gene product, SH3TC2, localizes to the perinuclear
      recycling compartment.
    explanation: >-
      Establishes both the cell type and the subcellular compartment this node
      is about.
  - reference: PMID:20028792
    reference_title: Mistargeting of SH3TC2 away from the recycling endosome causes Charcot-Marie-Tooth disease type 4C.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Moreover, we show that wild-type SH3TC2, but not mutant SH3TC2, influences
      transferrin receptor dynamics, consistent with a functional role on the
      endocytic recycling pathway.
    explanation: >-
      A functional read-out showing that mutant SH3TC2 fails to support receptor
      recycling, not merely that it is mislocalized.
  downstream:
  - target: Disturbed Neuregulin-1/ErbB2 Trafficking and Signalling
    causal_link_type: DIRECT
    description: >-
      ErbB2 is one of the receptors whose movement between the surface and the
      recycling compartment SH3TC2 controls.
  - target: Hypomyelination and Segmental Demyelination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Recycling failure impairs myelination through the ErbB2 arm and, in the
      knockout mouse, through broader changes in myelination and cell-adhesion
      transcripts that are not individually modelled here.
- name: Disturbed Neuregulin-1/ErbB2 Trafficking and Signalling
  biological_scale: CELLULAR
  description: >-
    Axonal neuregulin-1 acting on Schwann cell ErbB receptors is the signal by
    which a Schwann cell measures the axon it must myelinate. Sh3tc2 interacts
    with ErbB2 and regulates its internalization from the plasma membrane after
    Nrg1 stimulation; both mouse Sh3tc2 loss and the missense variants found in
    patients disturb that internalization. The authors frame the consequence as
    a failure of axonal size sensing.
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: ERBB2 signaling pathway
    term:
      id: GO:0038128
      label: ERBB2 signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23553667
    reference_title: Sh3tc2 deficiency affects neuregulin-1/ErbB signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      This early phenotype is associated with changes in the canonical Nrg1/ErbB
      pathway involved in control of myelination.
    explanation: >-
      Links Sh3tc2 loss in the mouse to the Nrg1/ErbB pathway that controls
      myelination.
  - reference: PMID:23553667
    reference_title: Sh3tc2 deficiency affects neuregulin-1/ErbB signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Interestingly, both the loss of Sh3tc2 function in mice and the
      pathological mutations present in CMT4C patients affect ErbB2
      internalization, potentially altering its downstream intracellular
      signaling pathways.
    explanation: >-
      Extends the trafficking defect from the mouse null to the specific
      missense alleles carried by patients, which is what makes this node
      relevant to human CMT4C rather than only to the model.
  downstream:
  - target: Hypomyelination and Segmental Demyelination
    causal_link_type: DIRECT
    description: >-
      Misread axonal neuregulin signal produces myelin sheaths that are too thin
      for the axons they surround.

  rate_denominator: POPULATION
  notes: >-
    Overall prevalence in European-ancestry populations is estimated at 3% to
    6% (3,000 to 6,000 per 100,000), with a two- to seven-fold male
    predominance.
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Research indicates that around 3%-6% of individuals of European ancestry
      are affected, with men being two to seven times more likely to develop
      the condition than women [5].
    explanation: >-
      Reports a 3% to 6% prevalence in individuals of European ancestry and
      documents the male predominance.
- population: Older men of Northern European descent (over 60 years)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_high: 30000.0
  rate_denominator: POPULATION
  notes: >-
    Dupuytren disease shows a strong demographic predilection, with highest
    prevalence in older men of Northern European ancestry; published estimates
    report upper bounds of up to 20% and up to approximately 30% among men over
    60 years (both figures are maxima from two sources rather than a
    lower-to-upper range), and prevalence increases markedly with age.
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Commonly seen in older men of Northern European descent, Dupuytren's can
      significantly impair hand function as contractures develop.
    explanation: >-
      This review establishes the predominant demographic (older men of
      Northern European descent). Evidence source is OTHER because this is a
      narrative review.
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Typically, Dupuytren's contracture begins after the age of 40, and its
      incidence rises significantly with age; up to 20% of men over 60 may
      experience it.
    explanation: >-
      Quantifies prevalence in men over 60 years at up to 20%.
  - reference: DOI:10.1093/molbev/msad130
    reference_title: "Major Genetic Risk Factors for Dupuytren's Disease Are Inherited From Neandertals"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Whereas people of African ancestry are rarely afflicted by Dupuytren's
      disease, up to ∼30% of men over 60 years suffer from this condition in
      northern Europe.
    explanation: >-
      Reports prevalence up to approximately 30% among men over 60 years in
      Northern Europe.
progression:
- phase: Variable progression
  notes: >-
    Disease course is variable; high recurrence after treatment and variability
    in progression are central management challenges, with younger onset and
    strong family history predicting more aggressive disease.
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Challenges in management include high recurrence rates and variability in
      disease progression, emphasizing the need for standardized assessment
      protocols and innovative therapeutic approaches.
    explanation: >-
      This review documents high recurrence and variability in disease
      progression. Evidence source is OTHER because this is a narrative review.

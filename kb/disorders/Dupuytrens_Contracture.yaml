diagnosis:
- name: Clinical Physical Examination and Joint Goniometry
  description: >-
    Dupuytren contracture is diagnosed clinically by inspection and palpation of
    palmar skin pitting, subcutaneous nodules, and longitudinal fascial cords,
    combined with goniometric measurement of passive extension deficit at the
    metacarpophalangeal and proximal interphalangeal joints (Tubiana staging).
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Range of motion (ROM) measurements are another cornerstone in assessing
      Dupuytren's disease, particularly with regard to the degree of joint
      flexion and extension. ROM is typically measured at the MCP and PIP
      joints using a goniometer for accuracy.
    explanation: >-
      Documents goniometric joint extension measurement at the MCP and PIP
      joints as a standard clinical assessment of Dupuytren contracture.
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Tubiana Classification is one of the most widely utilized grading
      systems for Dupuytren's disease. It categorizes the disease based on the
      degree of flexion contracture at the MCP and PIP joints.
    explanation: >-
      Establishes clinical Tubiana staging of MCP and PIP flexion contracture.
- name: Palmar Ultrasound Imaging
  description: >-
    High-resolution palmar ultrasound visualizes subcutaneous nodules and
    fascial cords within the palmar aponeurosis when clinical findings are
    equivocal or early-stage lesions are being monitored.
  diagnosis_term:
    preferred_term: palmar ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ultrasound imaging is particularly useful in identifying nodules and
      cords within the palmar fascia, offering a detailed view of the fibrotic
      change's characteristic of the disease.
    explanation: >-
      Supports ultrasound imaging for visualizing palmar fascial nodules and
      fibrotic cords.
treatments:
- name: Collagenase clostridium histolyticum injection
  description: >-
    Intralesional injection of clostridial collagenase enzymatically disrupts
    the collagen cord, allowing subsequent manipulation to break the contracture
    without open surgery.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: collagenase clostridium histolyticum therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: collagenase clostridium histolyticum
      term:
        id: NCIT:C185860
        label: Collagenase Clostridium histolyticum
  target_mechanisms:
  - target: Excessive Collagen Deposition and Cord Formation
    treatment_effect: INHIBITS
    description: >-
      Clostridial collagenases AUX-I and AUX-II enzymatically hydrolyze
      interstitial collagen in the contracted palmar cord so the cord can be
      mechanically ruptured.
    evidence:
    - reference: DOI:10.7759/cureus.74945
      reference_title: "Dupuytren's Contracture: A Review of the Literature"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This enzyme specifically targets and breaks down collagen in the
        fibrous cords, effectively weakening the contracture.
      explanation: >-
        Demonstrates direct enzymatic cleavage of collagen within the fibrotic
        cord.
  evidence:
  - reference: PMID:19726771
    reference_title: "Injectable collagenase clostridium histolyticum for Dupuytren's contracture."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagenase clostridium histolyticum significantly reduced contractures
      and improved the range of motion in joints affected by advanced
      Dupuytren's disease.
    explanation: >-
      The CORD I randomized, double-blind, placebo-controlled trial demonstrates
      that collagenase injection significantly reduces contractures and improves
      range of motion in Dupuytren disease.
  - reference: PMID:21060335
    reference_title: "Scientific understanding and clinical management of Dupuytren disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonsurgical correction of DD contractures can be achieved by Clostridium
      histolyticum collagenase injection, although the long-term safety and
      recurrence rate of this procedure requires further assessment.
    explanation: >-
      This review supports collagenase clostridium histolyticum injection as a
      nonsurgical correction of Dupuytren contractures while noting uncertainty
      about long-term recurrence. Evidence source is OTHER because this is a
      narrative review.
- name: Percutaneous needle fasciotomy
  description: >-
    A minimally invasive procedure that uses a needle to divide the contracted
    cord percutaneously, correcting the deformity with rapid recovery but higher
    recurrence than open surgery.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Excessive Collagen Deposition and Cord Formation
    treatment_effect: INHIBITS
    description: >-
      Percutaneous needle division severs the tethering fibrotic cord beneath
      the skin to release fixed digital flexion contracture.
    evidence:
    - reference: DOI:10.7759/cureus.74945
      reference_title: "Dupuytren's Contracture: A Review of the Literature"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This procedure uses a small needle to sever the fibrous cords beneath
        the skin, allowing the affected finger to straighten.
      explanation: >-
        Establishes mechanical division of the fibrous cord to relieve digital
        flexion contracture.
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      nonsurgical options like collagenase injections and needle aponeurotomy
      are effective for early stages but often have high recurrence rates.
    explanation: >-
      This review supports needle aponeurotomy (percutaneous needle fasciotomy)
      as an effective option for early-stage disease while noting high
      recurrence. Evidence source is OTHER because this is a narrative review.
- name: Surgical fasciectomy
  description: >-
    Open surgical excision of the diseased palmar fascia, the traditional
    treatment for advanced contractures, offering durable correction at the cost
    of greater morbidity and recovery time.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Excessive Collagen Deposition and Cord Formation
    treatment_effect: INHIBITS
    description: >-
      Open surgical excision removes the diseased collagenous cords and
      contracted palmar aponeurosis to restore digital extension.
    evidence:
    - reference: PMID:21060335
      reference_title: "Scientific understanding and clinical management of Dupuytren disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The mainstay of treatment is surgical release or excision of the
        affected palmodigital tissue, but symptoms often recur.
      explanation: >-
        Surgical excision directly removes the fibrotic palmodigital cord
        tissue.
  evidence:
  - reference: PMID:21060335
    reference_title: "Scientific understanding and clinical management of Dupuytren disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mainstay of treatment is surgical release or excision of the affected
      palmodigital tissue, but symptoms often recur.
    explanation: >-
      This review identifies surgical excision of the affected palmodigital
      tissue (fasciectomy) as the mainstay of treatment, while noting frequent
      recurrence. Evidence source is OTHER because this is a narrative review.
- name: Radiotherapy for early disease
  description: >-
    Low-dose external beam radiotherapy applied to early-stage nodular disease
    in an attempt to slow progression before fixed contractures develop; the
    supporting evidence base remains limited.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Myofibroblast Activation and Contraction
    treatment_effect: INHIBITS
    description: >-
      Low-dose ionizing radiation targets proliferating fibroblasts in the
      palmar fascia during early nodular disease to help halt progression
      toward contractile cord formation.
    evidence:
    - reference: DOI:10.7759/cureus.74945
      reference_title: "Dupuytren's Contracture: A Review of the Literature"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Low-dose radiotherapy targets proliferating fibroblasts in the palmar
        fascia and can help halt disease progression.
      explanation: >-
        Directly describes low-dose radiotherapy targeting proliferating
        fibroblasts in the palmar fascia to halt early disease progression.
  evidence:
  - reference: PMID:28490266
    reference_title: "Radiotherapy in Dupuytren's disease: a systematic review of the evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Radiotherapy has been advocated as an alternative treatment in early
      Dupuytren's disease.
    explanation: >-
      This systematic review notes that radiotherapy is advocated as an
      alternative option for early nodular Dupuytren disease while highlighting
      limitations in the clinical trial evidence base. Evidence source is OTHER
      because this is a systematic review.
histopathology:
- name: Proliferative phase (cellular nodule)
  finding_term:
    preferred_term: hypercellularity
    term:
      id: NCIT:C177116
      label: Hypercellularity
  description: >-
    The earliest classically described histologic stage of Dupuytren disease,
    characterized by hypercellular nodules composed of immature fibroblasts
    and proliferating myofibroblasts arranged in a whorled or storiform
    pattern, with abundant cell-cell and cell-matrix interactions and
    relatively little organized extracellular collagen.
  context: Early-stage Dupuytren palmar fascia; classical Luck (1959) three-phase nomenclature
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This initial phase is characterized by an increase in the number of
      fibroblasts within the palmar fascia, resulting in the formation of
      nodules. These fibroblasts then differentiate into myofibroblasts, which
      are responsible for producing extracellular matrix components,
      particularly type III collagen.
    explanation: >-
      Describes the hypercellular fibroblast- and myofibroblast-rich
      proliferative nodule stage of Dupuytren disease.
  - reference: DOI:10.7759/cureus.53147
    reference_title: "Comparing Complications and Patient Satisfaction Following Injectable Collagenase Versus Limited Fasciectomy for Dupuytren’s Disease: A Systematic Review and Meta-Analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The progression of Dupuytren contracture occurs in three phases:
      proliferative, involutional, and residual, with the proliferative stage
      characterized by fascial fibroplasia, nodule formation, and fibroblast
      proliferation [5].
    explanation: >-
      Confirms fascial fibroplasia, fibroblast proliferation, and nodule
      formation in the proliferative phase.
- name: Involutional phase (transitional)
  finding_term:
    preferred_term: spindle cell alignment along tension lines
    term:
      id: NCIT:C53643
      label: Spindle Cell Pattern
  description: >-
    The intermediate histologic stage of Dupuytren disease, in which
    myofibroblasts align along lines of mechanical tension and deposit
    progressively more type III collagen, producing linear organization of
    cells and matrix. Clinical contracture begins to emerge as the tissue
    becomes more fibrous and less cellular than in the proliferative phase.
  context: Mid-stage Dupuytren palmar fascia; classical Luck (1959) three-phase nomenclature
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During this stage, myofibroblasts contract and align along the length of
      the fascia, leading to the thickening and shortening of the cords. As
      these cords become thicker and contract, they begin to pull the affected
      fingers into flexion, leading to the characteristic contractures seen in
      Dupuytren's disease.
    explanation: >-
      Describes alignment and contraction of myofibroblasts along fascial
      tension lines during the involutional phase.
  - reference: DOI:10.7759/cureus.53147
    reference_title: "Comparing Complications and Patient Satisfaction Following Injectable Collagenase Versus Limited Fasciectomy for Dupuytren’s Disease: A Systematic Review and Meta-Analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The involution phase involves cell rearrangement along tissue stress
      lines, leading to cord development [6].
    explanation: >-
      Confirms cellular rearrangement along tissue stress lines in the
      involutional phase.
- name: Residual phase (acellular collagen cord)
  finding_term:
    preferred_term: dense collagenous cord fibrosis
    term:
      id: NCIT:C3044
      label: Fibrosis
  description: >-
    The late histologic stage of Dupuytren disease, characterized by
    relatively acellular, dense, type-I-collagen-rich cords with sparse
    mature spindle-shaped fibrocytes. The cord is the mechanically
    contracted lesion responsible for the established finger flexion
    deformity that brings patients to clinical attention and is the
    structure targeted by needle aponeurotomy, collagenase injection, and
    open fasciectomy.
  context: Late-stage Dupuytren palmar fascia; classical Luck (1959) three-phase nomenclature
  evidence:
  - reference: DOI:10.7759/cureus.74945
    reference_title: "Dupuytren's Contracture: A Review of the Literature"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this final stage, the disease stabilizes, and while the cords become
      less cellular, they remain thickened and contracted. The flexion
      deformities become permanent at this point, and without intervention, the
      affected fingers stay curled into the palm [10].
    explanation: >-
      Describes the hypocellular, densely fibrotic, permanently contracted cord
      of the residual phase.
  - reference: DOI:10.7759/cureus.53147
    reference_title: "Comparing Complications and Patient Satisfaction Following Injectable Collagenase Versus Limited Fasciectomy for Dupuytren’s Disease: A Systematic Review and Meta-Analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the residual phase, nodules regress, leaving thick cords and
      relatively acellular residual tissue, causing visible cords and severe
      contractures [7, 8].
    explanation: >-
      Confirms nodule regression into relatively acellular, thick fibrotic cords
      in the residual phase.

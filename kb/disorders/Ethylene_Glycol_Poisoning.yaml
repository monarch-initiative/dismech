name: Ethylene Glycol Poisoning
creation_date: '2026-09-01T20:00:00Z'
description: >-
  Ethylene glycol poisoning follows ingestion of antifreeze, de-icing fluid or
  other ethylene-glycol-containing products, taken deliberately, accidentally, or
  as a substitute intoxicant. The parent alcohol is only mildly intoxicating. The
  damage is done by its metabolites: alcohol dehydrogenase oxidises ethylene
  glycol to glycolaldehyde and then to glycolic acid, which drives a severe anion
  gap metabolic acidosis, and finally to oxalic acid, which precipitates with
  calcium as insoluble calcium oxalate crystals in the renal tubules and produces
  acute kidney injury. Because the toxicity is metabolic rather than direct, the
  antidote is an enzyme inhibitor rather than a chelator or a receptor blocker,
  and giving it early enough prevents the renal injury outright.
categories:
- Toxic Exposure Disorder
- Environmental Health Disorder
category: Complex
parents:
- Poisoning
disease_term:
  preferred_term: ethylene glycol poisoning
  term:
    id: MONDO:0017861
    label: ethylene glycol poisoning
pathophysiology:
- name: Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation
  description: >-
    Ingested ethylene glycol is oxidised by alcohol dehydrogenase to
    glycolaldehyde and onward to glycolic and oxalic acid. The parent alcohol is
    only mildly intoxicating; the toxicity belongs to the metabolites. That is
    what makes this a bioactivation poisoning rather than a direct one, and it is
    why an enzyme inhibitor works as an antidote while removing the parent
    compound alone does not.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake"
  molecular_functions:
  - preferred_term: alcohol dehydrogenase (NAD+) activity
    term:
      id: GO:0004022
      label: alcohol dehydrogenase (NAD+) activity
    modifier: INCREASED
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The effects of these substances, except for isopropanol and possibly
      alcoholic ketoacidosis, are due to their metabolites, which can cause
      metabolic acidosis and cellular dysfunction.
    explanation: >-
      States that the toxicity belongs to the metabolites rather than the parent
      alcohols, which is the claim this node is built on.
  notes: >-
    Conformance is asserted on the shared step of a nephrotoxin being concentrated
    and acted on in the kidney, not on the agent being a drug. The module's
    trigger names a nephrotoxic drug; ethylene glycol is an ingested industrial
    alcohol. Unlike the chronic dietary exposures curated elsewhere in this KB,
    the acute time course of the module fits this disease exactly.
  downstream:
  - target: Glycolic Acid Accumulation and High Anion Gap Metabolic Acidosis
    causal_link_type: DIRECT
    description: >-
      Glycolic acid is the metabolite that dominates the acid load.
  - target: Oxalic Acid Production and Calcium Oxalate Crystal Deposition
    causal_link_type: DIRECT
    description: >-
      Terminal oxidation yields oxalate, which precipitates with calcium.
- name: Glycolic Acid Accumulation and High Anion Gap Metabolic Acidosis
  description: >-
    Glycolic acid accumulates and consumes bicarbonate, producing the high anion
    gap acidosis that dominates early presentation. The osmolal gap moves the
    other way in time: it is highest while unmetabolised alcohol is still
    present, and falls as the anion gap rises. A patient sampled late can have a
    normal osmolal gap and a large anion gap, and a patient sampled early the
    reverse, which is why either alone can mislead.
  role: amplifier
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulation of the alcohols in the blood can cause an increment in the
      osmolality, and accumulation of their metabolites can cause an increase in
      the anion gap and a decrease in serum bicarbonate concentration.
    explanation: >-
      Separates the osmolal gap, which tracks the parent alcohol, from the anion
      gap, which tracks the metabolites - the basis for the timing caveat in this
      node's description.
  downstream:
  - target: Metabolic acidosis
    causal_link_type: DIRECT
  - target: Confusion
    causal_link_type: DIRECT
  - target: Coma
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
- name: Oxalic Acid Production and Calcium Oxalate Crystal Deposition
  description: >-
    Oxalate is the terminal metabolite. It precipitates with calcium as insoluble
    calcium oxalate in the renal tubules. Plasma and urinary oxalate outlast the
    parent alcohol by days: in a reported case the parent compound was cleared
    within 36 hours by dialysis while plasma oxalate peaked on day 3 and did not
    normalise until day 7. The crystal burden is therefore still being laid down
    after the poison itself has gone.
  role: mechanism
  biological_scale: TISSUE
  locations:
  - preferred_term: proximal tubule
    term:
      id: UBERON:0004134
      label: proximal tubule
  evidence:
  - reference: PMID:18696123
    reference_title: "Hyperoxaluria after ethylene glycol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both lead to calcium-oxalate oversaturation and hence to the risk of local
      (renal) or systemic crystal deposition.
    explanation: >-
      Links raised plasma and urinary oxalate to calcium oxalate oversaturation
      and crystal deposition.
  - reference: PMID:18696123
    reference_title: "Hyperoxaluria after ethylene glycol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The plasma oxalate level, however, rose to a maximum of 89 micromol/l
      (normal <6.3 +/- 1.1) on day 3 and only normalized on day 7 after
      ingestion.
    explanation: >-
      Gives the kinetics behind the claim that oxalate outlasts the parent
      alcohol, which is why crystal injury continues after the alcohol is
      cleared.
  downstream:
  - target: Proximal Tubular Epithelial Cell Death
    causal_link_type: DIRECT
    description: >-
      Intratubular crystal deposition injures the proximal tubular epithelium.
  - target: Nephrocalcinosis
    causal_link_type: DIRECT
  - target: Hypocalcemia
    causal_link_type: DIRECT
    description: >-
      Calcium is consumed forming the crystals.
  - target: Hyperoxaluria
    causal_link_type: DIRECT
  - target: Crystalluria
    causal_link_type: DIRECT
- name: Proximal Tubular Epithelial Cell Death
  description: >-
    Death of proximal tubular epithelium. The killing agent is the crystal, not
    the ion: calcium oxalate monohydrate crystals produce membrane damage and cell
    death in human proximal tubule cells, while oxalate held in solution and
    prevented from crystallising does not. Acidosis potentiates that
    crystal cytotoxicity, so the two arms of this poisoning are not independent -
    the glycolic acid load makes the oxalate crystals more lethal to the same
    cells. Glycolate itself does not potentiate it.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death"
  cell_types:
  - preferred_term: kidney proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:15695020
    reference_title: "The cytotoxicity of oxalate, metabolite of ethylene glycol, is due to calcium oxalate monohydrate formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results demonstrate that COM crystals, and not the oxalate ion, are
      responsible for the membrane damage and cell death observed in normal human
      and rat PT cells
    explanation: >-
      Discriminates crystal from ion as the cytotoxic species in human proximal
      tubule cells, which is what makes crystal deposition the causal step rather
      than a marker of oxalate load.
  - reference: PMID:15695020
    reference_title: "The cytotoxicity of oxalate, metabolite of ethylene glycol, is due to calcium oxalate monohydrate formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The cytotoxic effects of COM to HPT cells were potentiated by acidosis (pH
      6.5), but not by glycolate, the major metabolite of ethylene glycol.
    explanation: >-
      Establishes that the acidosis arm potentiates the crystal arm, which is why
      this entry does not treat the two downstream branches as independent. Also
      excludes glycolate itself as the potentiating agent.
  downstream:
  - target: Acute Kidney Injury
    causal_link_type: DIRECT
- name: Acute Kidney Injury
  description: >-
    Falling glomerular filtration rate following tubular injury. This is the
    module's effector, and here the acute time course matches it exactly.
  role: effector
  biological_scale: ORGANISM
  conforms_to: "drug_induced_nephrotoxicity#Acute Kidney Injury"
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition to metabolic acidosis, acute renal failure and neurologic
      disease can occur in some of the intoxications.
    explanation: >-
      Names acute renal failure as an outcome of this class of intoxication,
      alongside the acidosis modelled upstream.
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
phenotypes:
- name: Metabolic acidosis
  description: >-
    High anion gap metabolic acidosis, driven by glycolic acid.
  phenotype_term:
    preferred_term: High anion gap metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
    temporality: ACUTE
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As EG is metabolized, metabolic acidemia appears after a latent period of
      approximately 3–6 h after ingestion.
    explanation: >-
      Establishes the acidaemia and its timing relative to ingestion.
- name: Acute kidney injury
  phenotype_term:
    preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
    temporality: ACUTE
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of AKI varies between 30 and 70%
    explanation: >-
      The reported incidence range for the renal endpoint of this poisoning.
- name: Nephrocalcinosis
  description: >-
    Calcium oxalate deposition in the kidney, which can persist after recovery.
  phenotype_term:
    preferred_term: Nephrocalcinosis
    term:
      id: HP:0000121
      label: Nephrocalcinosis
  evidence:
  - reference: PMID:18696123
    reference_title: "Hyperoxaluria after ethylene glycol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      alkaline citrate was given as a preventive measure to increase urinary
      oxalate solubility, but nephrocalcinosis still developed.
    explanation: >-
      Documents nephrocalcinosis occurring despite a measure aimed at preventing
      it, in a reported poisoning.
- name: Confusion
  description: >-
    Altered mental status belongs to the early illness, before acidaemia and
    renal injury declare, when ethylene glycol is still acting as an alcohol. It
    was recorded in 237 of the 446 patients in the EXTRIP cohort.
  phenotype_term:
    preferred_term: Altered mental status
    term:
      id: HP:0001289
      label: Confusion
    temporality: ACUTE
  evidence:
  - reference: PMID:29427181
    reference_title: "Toxic alcohol diagnosis and management: an emergency medicine review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The patient with an altered mental status or concerning history warrants
      consideration of this potentially deadly ingestion.
    explanation: >-
      Establishes altered mental status as the presentation that should prompt
      consideration of this poisoning.
- name: Coma
  phenotype_term:
    preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
    temporality: ACUTE
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thereafter, progressive neurotoxicity (coma, cerebral edema, cranial nerve
      palsies, and seizures), cardiotoxicity (tachycardia with hypertension or
      hypotension), respiratory distress, and AKI occur.
    explanation: >-
      Names coma among the neurotoxic manifestations of the multiorgan phase.
- name: Seizure
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
    temporality: ACUTE
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thereafter, progressive neurotoxicity (coma, cerebral edema, cranial nerve
      palsies, and seizures), cardiotoxicity (tachycardia with hypertension or
      hypotension), respiratory distress, and AKI occur.
    explanation: >-
      Names seizures among the neurotoxic manifestations.
- name: Hypocalcemia
  description: >-
    A direct consequence of the oxalate arm rather than an independent
    disturbance: calcium is consumed in forming the crystals.
  phenotype_term:
    preferred_term: Hypocalcemia
    term:
      id: HP:0002901
      label: Hypocalcemia
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      neither oxalate crystals in urine, urine immunofluorescence nor hypocalcemia
      nor a history of EG exposure alone are indications for ECTR (but may help to
      diagnose EG poisoning)
    explanation: >-
      Names hypocalcaemia among the features that help diagnose this poisoning in
      humans. This is the item that establishes the phenotype occurs; the
      chemistry item below explains why, and cannot carry the claim on its own.
      Note that PMID:18696123, also cited in this entry, reports a case in which
      hypocalcaemia did NOT occur, so the finding is characteristic rather than
      invariable.
  - reference: PMID:15695020
    reference_title: "The cytotoxicity of oxalate, metabolite of ethylene glycol, is due to calcium oxalate monohydrate formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Oxalate has two forms in vivo: oxalate ions and calcium oxalate monohydrate
      (COM) crystals that readily form in the presence of calcium.
    directness: INDIRECT
    explanation: >-
      Mechanistic companion, not the support for the phenotype. It establishes
      that crystal formation consumes calcium, which is why the oxalate arm lowers
      serum calcium, and it is a cell-culture chemistry observation that cannot
      establish that the finding occurs in patients.
- name: Hyperoxaluria
  phenotype_term:
    preferred_term: Hyperoxaluria
    term:
      id: HP:0003159
      label: Hyperoxaluria
  evidence:
  - reference: PMID:18696123
    reference_title: "Hyperoxaluria after ethylene glycol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      urinary oxalate excretion was elevated (maximum 1.16 mmol/1.73 m(2)/24 h)
    explanation: >-
      Measured urinary oxalate excretion in a reported poisoning.
- name: Crystalluria
  description: >-
    Calcium oxalate crystals in the urine, the bedside correlate of the crystal
    deposition modelled upstream.
  phenotype_term:
    preferred_term: Crystalluria
    term:
      id: HP:0020074
      label: Crystalluria
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosed by plasma EG concentration in 24 patients, and by urinary calcium
      oxalate crystals in 6 patients
    explanation: >-
      Names urinary calcium oxalate crystals in patients, which is what this
      phenotype asserts. An earlier draft cited a sentence about nephrocalcinosis
      here; renal parenchymal deposition is not crystals in the urine, and that
      sentence remains correct only where it sits on the Nephrocalcinosis
      phenotype.
biochemical:
- name: Plasma oxalate
  notes: >-
    Oxalate outlasts the parent alcohol. In a reported poisoning the ethylene
    glycol level fell below 15 mg/dL within 36 hours under ethanol and dialysis,
    while plasma oxalate peaked on day 3 and normalised only on day 7. Crystal
    formation therefore continues after the poison itself has been cleared, which
    is why clearing the alcohol does not end the renal risk.
  reference_ranges:
  - lower_bound: 0.0
    upper_bound: 6.3
    unit: micromol/L
    population: reference range cited for this assay
    notes: >-
      Reported in the source as normal <6.3 +/- 1.1 micromol/L. Recorded as an
      upper bound; the plus-or-minus is the source's own dispersion, not an
      interval this entry asserts.
  evidence:
  - reference: PMID:18696123
    reference_title: "Hyperoxaluria after ethylene glycol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The plasma oxalate level, however, rose to a maximum of 89 micromol/l
      (normal <6.3 +/- 1.1) on day 3 and only normalized on day 7 after
      ingestion.
    explanation: >-
      Gives the peak, the normal range and the timing, which together carry the
      claim that oxalate outlasts the parent alcohol.
  - reference: PMID:18696123
    reference_title: "Hyperoxaluria after ethylene glycol poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Under treatment by ethanol infusions to block the alcohol dehydrogenase and
      by hemodialysis to eliminate ethylene glycol and its toxic metabolites, this
      level decreased to below 15 mg/dl within 36 h.
    explanation: >-
      The parent-alcohol clearance time this oxalate course is contrasted with.
- name: Serum anion gap
  notes: >-
    Rises as metabolites accumulate. It is the later of the two gaps and tracks
    glycolic acid rather than the parent alcohol.
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accumulation of the alcohols in the blood can cause an increment in the
      osmolality, and accumulation of their metabolites can cause an increase in
      the anion gap and a decrease in serum bicarbonate concentration.
    explanation: >-
      Assigns the anion gap to the metabolites, which is what makes it the late
      marker.
- name: Serum osmolal gap
  notes: >-
    Rises first and falls as metabolism proceeds, because it tracks the
    unmetabolised parent alcohol. The two gaps therefore cross over in time. A
    patient sampled early can have a wide osmolal gap and a normal anion gap, and
    a patient sampled late the reverse, so either test alone can reassure
    wrongly. Both being abnormal at once is the informative combination.
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presence of both laboratory abnormalities concurrently is an important
      diagnostic clue, although either can be absent, depending on the time after
      exposure when blood is sampled.
    explanation: >-
      States both the diagnostic value of the pair and the time dependence that
      makes either alone unreliable, which is the whole content of this entry.
progression:
- phase: Initial intoxication
  duration: from ingestion, before metabolic acidaemia appears
  notes: >-
    Presents as ethanol intoxication would - inebriation and ataxia. The parent
    alcohol is acting as an alcohol, and nothing yet distinguishes the poisoning
    from a drunk patient, which is the reason it is missed.
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The initial clinical manifestations of EG poisoning mimic those of ethanol
      ingestion, namely inebriation and ataxia.
    explanation: >-
      Describes the initial phase and the resemblance to ethanol intoxication.
- phase: Metabolic acidaemia
  duration: approximately 3 to 6 hours after ingestion
  notes: >-
    The latent period is the interval in which enzyme blockade prevents rather
    than mitigates, because the metabolites responsible have not yet accumulated.
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As EG is metabolized, metabolic acidemia appears after a latent period of
      approximately 3–6 h after ingestion.
    explanation: >-
      Gives the latent period before acidaemia, which is the only interval this
      entry states with a number.
- phase: Multiorgan toxicity
  notes: >-
    Progressive neurotoxicity, cardiotoxicity, respiratory distress and acute
    kidney injury follow the acidaemia. Acute kidney injury occurs in 30 to 70
    percent across reported series.
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thereafter, progressive neurotoxicity (coma, cerebral edema, cranial nerve
      palsies, and seizures), cardiotoxicity (tachycardia with hypertension or
      hypotension), respiratory distress, and AKI occur.
    explanation: >-
      Orders the multiorgan phase after the acidaemia and names its components.
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The incidence of AKI varies between 30 and 70%
    explanation: >-
      The reported range for acute kidney injury, carried as a range rather than
      a point estimate.
- phase: Delayed neuropathy
  duration: several days after ingestion, and despite treatment
  notes: >-
    Cranial nerve palsies, radiculopathy and other neuropathies appearing after
    the acute illness has been treated. The source is explicit that treatment does
    not prevent them.

    An earlier draft of this entry gave four phases with precise windows - 0 to 12
    hours, 12 to 24 hours, 12 hours onward, day 5 to 20. Those windows came from
    the deep-research report and are NOT in the cited source, which gives a 3 to 6
    hour latent period to acidaemia and 'several days' for the delayed neuropathy
    and no other numeric window. The phases were rewritten to what the source
    states. Do not reintroduce the finer windows without a citation carrying
    them.
  evidence:
  - reference: PMID:36765419
    reference_title: "Extracorporeal treatment for ethylene glycol poisoning: systematic review and recommendations from the EXTRIP workgroup."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cranial nerve palsies, radiculopathy, and other neuropathies may appear
      several days after ingestion, despite treatment
    explanation: >-
      Establishes the delayed phase and that it occurs despite treatment.

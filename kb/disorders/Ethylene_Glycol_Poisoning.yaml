  evidence:
  - reference: PMID:29427181
    reference_title: "Toxic alcohol diagnosis and management: an emergency medicine review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methanol, ethylene glycol, and isopropyl alcohol are readily available in
      common hardware and household materials.
    explanation: >-
      Establishes the availability that makes this a recurring household
      exposure rather than an occupational one.
treatments:
- name: Fomepizole
  description: >-
    A competitive alcohol dehydrogenase inhibitor, and the first-line antidote. It
    acts on the bioactivation step rather than on any downstream injury, so its
    value is entirely a matter of timing: given before significant acidosis or
    organ injury it prevents renal failure outright and can remove the need for
    dialysis, and given late it cannot undo crystal deposition that has already
    happened.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fomepizole
      term:
        id: CHEBI:5141
        label: fomepizole
  target_mechanisms:
  - target: Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation
    treatment_effect: INHIBITS
    description: >-
      Blocks the enzyme that converts the relatively harmless parent alcohol into
      the metabolites that do the damage.
  evidence:
  - reference: PMID:27147840
    reference_title: "Treatment of patients with ethylene glycol or methanol poisoning: focus on fomepizole."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fomepizole, a potent alcohol dehydrogenase (ADH) inhibitor, is an efficient
      and safe antidote that prevents or reduces toxic EG and methanol
      metabolism.
    explanation: >-
      Names the enzyme target, which is what places this treatment on the
      bioactivation node rather than on the renal injury.
  - reference: PMID:27147840
    reference_title: "Treatment of patients with ethylene glycol or methanol poisoning: focus on fomepizole."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Administered early, fomepizole prevents EG-related renal failure and
      methanol-related visual and neurological injuries.
    explanation: >-
      Supports prevention of the renal endpoint, conditional on early
      administration.
  - reference: PMID:27147840
    reference_title: "Treatment of patients with ethylene glycol or methanol poisoning: focus on fomepizole."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When administered prior to the onset of significant acidosis or organ
      injury, fomepizole may obviate the need for hemodialysis.
    explanation: >-
      Records the timing dependence explicitly, which is the qualification the
      description rests on.
- name: Hemodialysis
  description: >-
    Removes the unmetabolised alcohol and its organic acid metabolites, and
    corrects the acidosis. It is the second arm alongside enzyme blockade, and it
    is what remains when the antidote arrives too late.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Glycolic Acid Accumulation and High Anion Gap Metabolic Acidosis
    treatment_effect: INHIBITS
    description: >-
      Clears the accumulated organic acids that drive the acidosis.
  evidence:
  - reference: PMID:18045860
    reference_title: "Toxic alcohol ingestions: clinical features, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dialysis to remove the unmetabolized alcohol and possibly the organic acid
      anion can be helpful in treatment of several of the alcohol-related
      intoxications.
    explanation: >-
      States what dialysis removes, which is why it attaches to the acid
      accumulation node rather than to the enzyme step.

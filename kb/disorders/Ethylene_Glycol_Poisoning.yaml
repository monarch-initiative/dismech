  influences_mechanisms:
  - target: Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingestion delivers the substrate that alcohol dehydrogenase then activates.
    evidence:
    - reference: PMID:29427181
      reference_title: "Toxic alcohol diagnosis and management: an emergency medicine review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Toxic alcohols are ingested for a variety of reasons including accidental

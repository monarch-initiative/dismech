environmental:
- name: Ingestion of ethylene glycol
  description: >-
    Antifreeze, de-icing fluid and other ethylene-glycol-containing products,
    taken deliberately in self-harm, accidentally by children, or as a substitute
    intoxicant. The products are sweet-tasting and sold without restriction,
    which is the reason accidental paediatric ingestion is a recurring pattern.
  exposure_term:
    preferred_term: ingestion of ethylene glycol
    term:
      id: ECTO:0000231
      label: exposure to chemical
  exposure_classifications:

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CHIME syndrome is a rare autosomal recessive neuroectodermal disorder associated with biallelic mutations in PIGL."
      explanation: Establishes CHIME syndrome as a Mendelian autosomal recessive genetic disorder.
  - classification_value: DERMATOLOGY
    evidence:
    - reference: PMID:38773877
      reference_title: "Severe congenital ichthyosiform dermatosis in CHIME syndrome successfully treated with ixekizumab."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Coloboma, congenital heart disease, ichthyosiform dermatosis, intellectual disability, conductive hearing loss, and epilepsy (CHIME) syndrome is a rare autosomal recessive neuroectodermal disorder caused by PIGL gene mutations."
      explanation: Identifies congenital ichthyosiform dermatosis as a cardinal dermatologic manifestation of CHIME syndrome.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:7666399
      reference_title: "Neuroectodermal (CHIME) syndrome: an additional case with long term follow up of all reported cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The main features include ocular colobomas, congenital heart disease, early onset migratory ichthyosiform dermatosis, mental retardation, conductive hearing loss, seizures, and typical facial features."
      explanation: Establishes intellectual disability and seizures as primary neurological manifestations of CHIME syndrome.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: PMID:29473937
      reference_title: "Large deletion in PIGL: a common mutational mechanism in CHIME syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Germline mutations in other members of GPI and Post GPI Attachment to Proteins (PGAP) family genes have been described and constitute a group of diseases within the congenital disorders of glycosylation."
      explanation: Places PIGL-related CHIME syndrome within inherited metabolic congenital disorders of glycosylation.
  icimd_category:
  - classification_value: lipid_glycosylation
    evidence:
    - reference: PMID:33340416
      reference_title: "An international classification of inherited metabolic disorders (ICIMD)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The Congenital Disorders of Glycosylation (CDG) are divided into disorders affecting N-linked and O-linked protein glycosylation (including glycosaminoglycan synthesis), disorders of lipid glycosylation (including the disorders of glycosylphosphatidylinositol biosynthesis), and disorders with the potential to affect multiple glycosylation pathways (dolichol metabolism, Golgi transport and homeostasis, sialic acid metabolism, and others)."
      explanation: ICIMD classifies disorders of glycosylphosphatidylinositol anchor biosynthesis under disorders of lipid glycosylation.

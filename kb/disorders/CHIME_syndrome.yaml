    explanation: Confirms autosomal recessive inheritance caused by biallelic PIGL variants.
pathophysiology:
- name: PIGL De-N-Acetylase Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in PIGL impair the endoplasmic reticulum
    de-N-acetylase that converts N-acetylglucosaminyl-phosphatidylinositol (GlcNAc-PI)
    to glucosaminyl-phosphatidylinositol (GlcN-PI) in the second step of
    glycosylphosphatidylinositol anchor biosynthesis.
  genes:
  - preferred_term: PIGL
    term:
      id: hgnc:8966
      label: PIGL
  molecular_functions:
  - preferred_term: N-acetylglucosaminylphosphatidylinositol deacetylase activity
    term:
      id: GO:0000225
      label: N-acetylglucosaminylphosphatidylinositol deacetylase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: glycosylphosphatidylinositol biosynthetic process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22444671
    reference_title: "Mutations in the glycosylphosphatidylinositol gene PIGL cause CHIME syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing on five previously reported cases identified PIGL, the de-N-acetylase required for glycosylphosphatidylinositol (GPI) anchor formation, as a strong candidate."
    explanation: Establishes PIGL de-N-acetylase mutations as the molecular defect in CHIME syndrome.
  - reference: PMID:29473937
    reference_title: "Large deletion in PIGL: a common mutational mechanism in CHIME syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIGL is an endoplasmic reticulum localized enzyme that catalyzes the second step of glycosylphosphatidylinositol (GPI) biosynthesis, which plays a role in the anchorage of cell-surface proteins including receptors, enzymes, and adhesion molecules."
    explanation: Defines the enzymatic role of PIGL at the second step of GPI biosynthesis in the endoplasmic reticulum.
  downstream:
  - target: Impaired Endoplasmic Reticulum GPI Anchor Biosynthesis
    description: Deficient GlcNAc-PI de-N-acetylation blocks assembly of mature GPI glycolipid anchors in the endoplasmic reticulum.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29473937
      reference_title: "Large deletion in PIGL: a common mutational mechanism in CHIME syndrome?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PIGL is an endoplasmic reticulum localized enzyme that catalyzes the second step of glycosylphosphatidylinositol (GPI) biosynthesis, which plays a role in the anchorage of cell-surface proteins including receptors, enzymes, and adhesion molecules."
      explanation: Loss of step-two catalysis directly impairs ER GPI anchor assembly.
- name: Impaired Endoplasmic Reticulum GPI Anchor Biosynthesis
  biological_scale: CELLULAR
  description: >-
    Incomplete GPI precursor synthesis in the endoplasmic reticulum limits attachment of
    GPI anchors to nascent client proteins and triggers endoplasmic reticulum stress in
    proliferating and differentiating cells.
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: DOI:10.1007/s00018-024-05284-2
    reference_title: The GPI-anchor biosynthesis pathway is critical for syncytiotrophoblast differentiation and placental development
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "glycosylphosphatidylinositol (GPI) biosynthetic pathway in the endoplasmic reticulum (ER) is crucial for generating GPI-anchored proteins (GPI-APs), which are translocated to the cell surface and play a vital role in cell signaling and adhesion."
    explanation: Establishes that ER GPI biosynthesis is required to generate mature GPI-anchored proteins for translocation to the plasma membrane.
  downstream:
  - target: GPI Anchor Deficiency
    description: Defective ER GPI precursor synthesis directly reduces cell-surface expression of GPI-anchored proteins such as CD59 and FLAER-binding anchors.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22444671
      reference_title: "Mutations in the glycosylphosphatidylinositol gene PIGL cause CHIME syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, cell lines derived from these cases had significantly reduced levels of the two GPI anchor markers, CD59 and a GPI-binding toxin, aerolysin (FLAER), confirming the pathogenicity of the mutations."
      explanation: Patient-derived cell lines demonstrate reduced surface GPI-anchor markers downstream of impaired ER GPI synthesis.

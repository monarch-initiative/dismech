diagnosis:
- name: PIGL Sequencing and Deletion/Duplication Analysis
  description: >-
    Molecular genetic testing of PIGL combining sequence analysis (which detects the
    recurrent c.500T>C p.Leu167Pro variant and other point variants) with targeted copy
    number analysis to detect Alu-mediated intragenic and 5-prime exon 1 deletions missed
    by standard next-generation sequencing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29473937
    reference_title: "Large deletion in PIGL: a common mutational mechanism in CHIME syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In CHIME syndrome, a recurrent missense mutation c.500T > C (p.Leu167Pro) is found in the majority of patients, associated with a null mutation in the other allele, including an overrepresentation of large deletions. The latter are not detected by the standard analysis in sequencing techniques, including next-generation sequencing. Thus, in individuals with a clinical diagnosis of CHIME syndrome in which only one mutation is found, an active search for a large deletion should be sought."
    explanation: Establishes the necessity of combining PIGL sequence analysis with deletion testing in diagnostic workups.
  - reference: PMID:28371479
    reference_title: "Alu-mediated deletion of PIGL in a Patient with CHIME syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these findings indicate that patients with a clinical diagnosis of CHIME syndrome and a single identifiable mutation in PIGL warrant further investigation for copynumber changes involving PIGL."
    explanation: Independently confirms that copy-number evaluation of PIGL is required when only a single sequence variant is identified.
- name: Flow Cytometry of Cell-Surface GPI-Anchored Markers
  description: >-
    Functional flow-cytometric quantification of cell-surface GPI-anchored proteins
    (such as CD59) and fluorescently labeled proaerolysin (FLAER) binding on patient
    leukocytes or fibroblasts to confirm reduced GPI-anchor surface expression.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:22444671
    reference_title: "Mutations in the glycosylphosphatidylinositol gene PIGL cause CHIME syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, cell lines derived from these cases had significantly reduced levels of the two GPI anchor markers, CD59 and a GPI-binding toxin, aerolysin (FLAER), confirming the pathogenicity of the mutations."
    explanation: Demonstrates reduced surface CD59 and FLAER levels as functional confirmation of pathogenic PIGL variants.
genetic:
- name: PIGL
  gene_term:
    preferred_term: PIGL
    term:
      id: hgnc:8966
      label: PIGL
  association: Causal
  notes: >-
    Autosomal recessive mutations in PIGL cause CHIME syndrome. Most reported individuals
    are compound heterozygous for c.500T>C (p.Leu167Pro) and a loss-of-function trans
    allele, including frameshift variants, splice variants, or Alu-mediated deletions.
  evidence:
  - reference: PMID:22444671
    reference_title: "Mutations in the glycosylphosphatidylinositol gene PIGL cause CHIME syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing on five previously reported cases identified PIGL, the de-N-acetylase required for glycosylphosphatidylinositol (GPI) anchor formation, as a strong candidate."
    explanation: Identifies PIGL as the causal gene for CHIME syndrome through whole-exome sequencing.
  - reference: PMID:28371479
    reference_title: "Alu-mediated deletion of PIGL in a Patient with CHIME syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHIME syndrome is a rare autosomal recessive neuroectodermal disorder associated with biallelic mutations in PIGL. To date, six molecularly confirmed cases of CHIME syndrome have been reported. Here, we report the seventh patient with biallelic PIGL mutations associated with CHIME syndrome and describe the first characterization of an intragenic deletion in PIGL."
    explanation: Documents Alu-mediated intragenic deletion in PIGL as a disease-causing mechanism in CHIME syndrome.
  - reference: PMID:29473937
    reference_title: "Large deletion in PIGL: a common mutational mechanism in CHIME syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In CHIME syndrome, a recurrent missense mutation c.500T > C (p.Leu167Pro) is found in the majority of patients, associated with a null mutation in the other allele, including an overrepresentation of large deletions. The latter are not detected by the standard analysis in sequencing techniques, including next-generation sequencing. Thus, in individuals with a clinical diagnosis of CHIME syndrome in which only one mutation is found, an active search for a large deletion should be sought."
    explanation: Establishes that large deletions paired with p.Leu167Pro are a recurrent mutational mechanism in CHIME syndrome.
  - reference: PMID:35258128
    reference_title: "Child with a mild CHIME syndrome phenotype and carrying a novel p.(Asp52Asn) PIGL pathogenic variant in association with the previously reported p.(Leu167Pro) variant: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel \"likely pathogenic\" PIGL missense variant (c.154G>A, p.(Asp52Asn)) was detected on the maternal allele. This case provides new insights into the clinical spectrum of CHIME syndrome and highlights the potential for phenotypic/genotypic variations."
    explanation: Documents compound heterozygosity for p.Asp52Asn and p.Leu167Pro associated with a milder CHIME phenotype.
treatments:
- name: Multidisciplinary Supportive Care
  description: Coordinated multidisciplinary surveillance and symptomatic management across dermatology, neurology, cardiology, ophthalmology, and audiology.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:9295069
    reference_title: "Acute lymphoblastic leukemia in a child with the CHIME neuroectodermal dysplasia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is important to make because of the potential for associated congenital heart disease, neurologic compromise, possible autosomal recessive inheritance, and possible association with malignancy."
    explanation: Highlights the need for coordinated multidisciplinary surveillance and symptomatic management across cardiac, neurological, and hematologic complications.
- name: Cardiac Surgery
  description: Surgical repair or palliation of congenital heart malformations when hemodynamically indicated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Congenital Heart Defects
    treatment_effect: MODULATES
    description: Surgical repair addresses structural congenital cardiac malformations without correcting upstream GPI-anchor deficiency.
    evidence:
    - reference: PMID:9295069
      reference_title: "Acute lymphoblastic leukemia in a child with the CHIME neuroectodermal dysplasia syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The diagnosis is important to make because of the potential for associated congenital heart disease, neurologic compromise, possible autosomal recessive inheritance, and possible association with malignancy."
      explanation: Highlights the clinical need to identify and manage congenital heart disease in CHIME syndrome.
- name: Seizure Management
  description: Antiseizure pharmacotherapy for epilepsy control, although seizures in inherited GPI-anchor deficiencies are frequently treatment-resistant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_mechanisms:
  - target: Seizure Disorder
    treatment_effect: MODULATES
    description: Antiseizure medications provide symptomatic seizure control without restoring neuronal GPI-anchor synthesis.
    evidence:
    - reference: PMID:7666399
      reference_title: "Neuroectodermal (CHIME) syndrome: an additional case with long term follow up of all reported cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Long term follow up information on this patient, as well as the previously described cases, provides information regarding the outcome for these patients, which includes general good health, severe mental retardation, seizures that worsen after puberty, conductive hearing loss, and chronic migratory ichthyosiform skin rash without scarring."
      explanation: Documents persistent seizures worsening after puberty that require ongoing neurological management.
- name: Targeted IL-17A Blockade with Ixekizumab
  description: >-
    Systemic interleukin-17A inhibition with ixekizumab for severe congenital
    ichthyosiform dermatosis refractory to topical agents and dupilumab.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ixekizumab
      term:
        id: NCIT:C174646
        label: Ixekizumab
  target_mechanisms:
  - target: Ichthyosiform Dermatosis
    treatment_effect: INHIBITS
    description: Ixekizumab blocks IL-17A-driven cutaneous inflammation to ameliorate severe ichthyosiform dermatosis without correcting PIGL deficiency.
    evidence:
    - reference: PMID:38773877
      reference_title: "Severe congenital ichthyosiform dermatosis in CHIME syndrome successfully treated with ixekizumab."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report a case of severe ichthyosiform dermatosis in a child with CHIME syndrome who was recalcitrant to multiple topical medications and dupilumab. This is the first reported case of successful treatment of congenital ichthyosiform dermatosis in a CHIME syndrome patient with ixekizumab, an IL-17A antagonist."
      explanation: Demonstrates clinical resolution of treatment-refractory ichthyosiform dermatosis in CHIME syndrome with IL-17A blockade.
  evidence:
  - reference: PMID:38773877
    reference_title: "Severe congenital ichthyosiform dermatosis in CHIME syndrome successfully treated with ixekizumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a case of severe ichthyosiform dermatosis in a child with CHIME syndrome who was recalcitrant to multiple topical medications and dupilumab. This is the first reported case of successful treatment of congenital ichthyosiform dermatosis in a CHIME syndrome patient with ixekizumab, an IL-17A antagonist."
    explanation: Flowers et al. 2024 documents successful treatment of severe ichthyosiform dermatosis in CHIME syndrome using ixekizumab.
- name: Auditory Rehabilitation
  description: Audiologic rehabilitation and assistive amplification for conductive hearing impairment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Conductive Hearing Loss
    treatment_effect: MODULATES
    description: Audiologic management compensates functionally for conductive hearing impairment.
    evidence:
    - reference: PMID:22444671
      reference_title: "Mutations in the glycosylphosphatidylinositol gene PIGL cause CHIME syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CHIME syndrome is characterized by colobomas, heart defects, ichthyosiform dermatosis, mental retardation (intellectual disability), and ear anomalies, including conductive hearing loss."
      explanation: Documents conductive hearing loss as a core feature requiring audiologic management.
- name: Educational and Developmental Support
  description: Special education and developmental therapies tailored to intellectual disability and communication impairment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_mechanisms:
  - target: Intellectual Disability
    treatment_effect: MODULATES
    description: Structured developmental and educational interventions support adaptive functioning in individuals with intellectual disability.
    evidence:
    - reference: DOI:10.1093/brain/awae056
      reference_title: The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The majority of individuals experienced delayed or absent speech (95%), motor delay with non-ambulance (64%), and severe-to-profound DD/ID (59%)."
      explanation: Demonstrates high prevalence of speech delay and developmental disability requiring developmental and educational support.
notes: >-
  Acute lymphoblastic leukemia and osteosarcoma have been reported in isolated individuals
  with CHIME syndrome (PMID:9295069), although cohorts remain too small to quantify
  malignancy risk precisely.

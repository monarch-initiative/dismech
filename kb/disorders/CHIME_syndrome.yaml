name: CHIME_syndrome
creation_date: '2025-12-22T19:53:18Z'
description: >-
  CHIME syndrome (PIGL-CDG) is an ultra-rare autosomal recessive congenital disorder of
  glycosylphosphatidylinositol (GPI) anchor biosynthesis caused by biallelic pathogenic
  variants in PIGL, which encodes endoplasmic reticulum N-acetylglucosaminylphosphatidylinositol
  de-N-acetylase. Impaired synthesis of cell-surface GPI-anchored proteins disrupts
  embryonic neuroectodermal and visceral morphogenesis, producing the cardinal pentad of
  ocular colobomas, congenital heart defects, migratory ichthyosiform dermatosis,
  intellectual disability, and ear anomalies with conductive hearing loss, frequently
  accompanied by seizures, craniofacial dysmorphism, and variable renal anomalies.
category: Mendelian
disease_term:
  preferred_term: CHIME syndrome
  term:
    id: MONDO:0010221
    label: CHIME syndrome
parents:
- Neuroectodermal Disorder
synonyms:
- PIGL-CDG
- Zunich-Kaye syndrome
- Zunich neuroectodermal syndrome
- coloboma-congenital heart disease-ichthyosiform dermatosis-intellectual disability-ear anomalies syndrome
- Coloboma-heart-ichthyosis-mental retardation-ear syndrome
- congenital disorder of glycosylation due to PIGL deficiency
- neuroectodermal dysplasia, CHIME type
- neuroectodermal syndrome, Zunich type
classifications:

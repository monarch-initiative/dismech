discussions:
- discussion_id: azide_no_established_antidote
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does any antidote improve outcome in human sodium azide poisoning, and is
    cobinamide or extracorporeal elimination the better candidate?
  attaches_to:
  - treatments#Hydroxocobalamin
  - pathophysiology#Cytochrome c Oxidase Inhibition
  rationale: >-
    Every source on this entry states that no antidote exists, and the agents given
    in practice - sodium nitrite, sodium thiosulfate, hydroxocobalamin - are used on
    mechanistic analogy with cyanide rather than on evidence in azide poisoning. Two
    distinct candidates have emerged and neither has human outcome data. Cobinamide
    rescued flies and mice from otherwise lethal azide exposure and outperformed
    hydroxocobalamin, which is a genuine animal result but an animal result;
    separately, high-volume continuous veno-venous hemofiltration with levocarnitine
    was reported in a single patient who survived a dose described as supralethal.
    The two act on different things - one neutralises nitric oxide and oxidative
    stress, the other removes the anion and supports metabolism - so they are not
    competing versions of one hypothesis, and the question of which arm of the
    toxidrome is worth targeting is open. The irreversibility of the oxidase binding
    is the reason to doubt that any scavenger given after absorption can reverse the
    bioenergetic lesion, which is an argument for the eliminative approach and
    against the scavenging one.
  evidence:
  - reference: PMID:37010385
    reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cobinamide rescued Drosophila melanogaster and mice from lethal exposure to azide and was more effective than hydroxocobalamin."
    explanation: >-
      Establishes the animal efficacy signal for cobinamide, and that it exceeded
      hydroxocobalamin's, while remaining non-human.
  - reference: PMID:40055827
    reference_title: "Sodium azide (NaN(3)) intoxication, \"the man who lived\": potential effective antidote and treatment strategy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter demonstrated a substantial mitigation of lactate concentration."
    explanation: >-
      The single-patient report of the eliminative approach, whose measured effect was
      on lactate; one case cannot establish outcome benefit.
  posed_by: "dismech curation (design decisions section 3g)"
  posed_date: "2026-11-25T16:05:00Z"

name: Sodium Azide Poisoning
creation_date: "2026-11-25T16:05:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Chemical Poisoning
- Mitochondrial Toxicity
synonyms:
- azide poisoning
- azide intoxication
- hydrazoic acid poisoning
description: >-
  Sodium azide poisoning is an acute chemical toxidrome caused by exposure to the
  azide anion, which is encountered as sodium azide in laboratory, pharmacy and
  industrial settings, as a biocide and preservative, and as the gas generant in
  vehicle airbag inflators. The anion has two mechanisms that run in parallel and
  together account for the clinical picture. It binds the heme centre of
  cytochrome c oxidase and blocks terminal electron transfer, so oxidative
  phosphorylation fails while oxygen delivery is intact - the histotoxic hypoxia
  that cyanide and carbon monoxide also produce, and that this entry shares with
  them through the `xenobiotic_oxidative_phosphorylation_blockade` module. Azide
  is also oxidized in vivo to nitric oxide, which causes vasodilation and
  hypotension and worsens the oxidative damage; that second arm has no
  counterpart in cyanide poisoning and is why hypotension dominates the
  presentation and may need vasopressor or mechanical circulatory support.
  Patients present with vomiting, seizures, hypotension, metabolic acidosis and
  coma, and cardiac injury characteristically appears days after exposure rather
  than at presentation. In contact with water the salt forms hydrazoic acid, so a
  contaminated food or drink vehicle carries both species. No antidote is
  established; management is decontamination and aggressive supportive care, with
  hydroxocobalamin used on mechanistic grounds.
notes: >-
  ONTOLOGY GAP - no `disease_term` is bound because MONDO has no azide concept.
  OLS searches scoped to the `mondo` ontology on 2026-11-25 for each of `azide`,
  `hydrazoic`, `sodium azide` and `azide poisoning` returned zero hits. MONDO
  codes many named chemical poisonings as siblings (`MONDO:0018754` cyanide
  poisoning, `MONDO:0017860` methanol, `MONDO:0018019` lead, `MONDO:0023176`
  formaldehyde, `MONDO:0041996` thallium), so this is a coverage gap in a
  populated branch rather than a modelling decision, and it is a candidate MONDO
  term request. `Aconitine_Poisoning` and `Arsenic_Poisoning` set the precedent in
  this knowledge base for an entry with no `disease_term`; the nearest available
  ancestor, `MONDO:0029000` poisoning, carries no information and is deliberately
  not bound.

  No `icd10cm_mappings` entry is recorded either. OLS searches scoped to
  `icd10cm` on 2026-11-25 for `azide` and for two candidate container labels
  returned nothing, and the committed `cache/icd10cm/terms.csv` holds no azide
  code (its nearest neighbour is `ICD10CM:T65.0` toxic effect of cyanides, which
  is a different substance). Rather than compose a plausible T65-series code from
  memory, the mapping is left absent for a curator who can read the code from the
  ICD-10-CM tabular list.

  Dose thresholds are deliberately not curated. They carry no mechanistic
  information, and a large share of the case literature is self-harm; the entry
  models the mechanism and the clinical course instead.

  The relationship to lead azide. This entry is the azide half of what a composite
  azide salt would deliver. Design decisions section 3g records why such a
  composite is not an entry of its own: its toxicity is its moieties' toxicity,
  and the two moieties bind to ontology terms while the compound does not.
pathophysiology:
- name: Systemic Azide Exposure
  biological_scale: ORGANISM
  role: trigger
  description: >-
    The toxic exposure. Sodium azide is highly water soluble and is absorbed
    rapidly after ingestion; it is also encountered by inhalation and by skin
    contact, and medical personnel treating a poisoned patient have themselves
    been exposed. On contact with water the salt forms hydrazoic acid, so an
    aqueous vehicle delivers both the anion and the acid.
  chemical_entities:
  - preferred_term: sodium azide
    modifier: INCREASED
    term:
      id: CHEBI:278547
      label: sodium azide
  downstream:
  - target: Cytochrome c Oxidase Inhibition
    causal_link_type: DIRECT
    description: The absorbed anion reaches mitochondria and binds the terminal oxidase.
    evidence:
    - reference: PMID:35681182
      reference_title: "Potential therapies for sodium azide intoxication; a case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sodium azide irreversible blocks cytochrome C oxidase by inhibiting oxidative phosphorylation leading to cell death."
      explanation: States the step from systemic azide to inhibition of the terminal oxidase.
  - target: Nitric Oxide Generation from Azide
    causal_link_type: DIRECT
    description: >-
      A fraction of the absorbed anion is oxidized to nitric oxide, which is the
      second, non-bioenergetic arm of the toxidrome.
    evidence:
    - reference: PMID:37010385
      reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Azide inhibits mitochondrial cytochrome c oxidase and is likely oxidized to nitric oxide in vivo."
      explanation: >-
        States both branches from the absorbed anion, including the oxidation to
        nitric oxide that this edge represents.
  evidence:
  - reference: PMID:22739775
    reference_title: "Sodium azide poisoning at a restaurant - Dallas County, Texas, 2010."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 5 months after the incident, extensive laboratory testing identified sodium azide (NaN3) and hydrazoic acid (formed when sodium azide contacts water) as the toxic agents in the iced tea."
    explanation: >-
      Confirms a real human exposure and the formation of hydrazoic acid when the
      salt contacts water, which is the two-species claim in this node.
- name: Cytochrome c Oxidase Inhibition
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Xenobiotic Blockade of Mitochondrial Respiration"
  biological_scale: MOLECULAR
  description: >-
    The azide anion binds the heme centre of cytochrome c oxidase, Complex IV of
    the respiratory chain, and blocks transfer of electrons to molecular oxygen.
    The binding is described as irreversible, which distinguishes the kinetics from
    cyanide's and is part of why no scavenging antidote is established.
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    modifier: DECREASED
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
  biological_processes:
  - preferred_term: electron transport chain
    modifier: DECREASED
    term:
      id: GO:0022900
      label: electron transport chain
  downstream:
  - target: Cellular ATP Depletion despite Preserved Oxygen Delivery
    causal_link_type: DIRECT
    description: >-
      With the terminal oxidase blocked, the respiratory chain cannot pass
      electrons to oxygen and oxidative ATP synthesis stops.
    evidence:
    - reference: PMID:38567268
      reference_title: "A case report of sodium azide-induced myopericarditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sodium azide exposures are rare but can be lethal as the substance inhibits complex IV in the electron transport chain, blocking adenosine-triphosphate (ATP) synthesis."
      explanation: States the step from Complex IV inhibition to blocked ATP synthesis.
  evidence:
  - reference: PMID:37010385
    reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Azide inhibits mitochondrial cytochrome c oxidase and is likely oxidized to nitric oxide in vivo."
    explanation: Supports inhibition of mitochondrial cytochrome c oxidase as the primary molecular lesion.
- name: Cellular ATP Depletion despite Preserved Oxygen Delivery
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Cellular ATP Depletion despite Preserved Oxygen Delivery"
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The rate-limiting step the whole toxidrome funnels through. Oxygen continues to
    arrive and to be carried normally, but the cell can no longer phosphorylate
    ADP, so tissues fail energetically in the presence of adequate oxygen. This is
    the disorder-agnostic conformance target of the module, shared with cyanide,
    carbon monoxide, formate and diglycolic acid.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: ATP biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006754
      label: ATP biosynthetic process
  downstream:
  - target: Anaerobic Glycolytic Shift with Lactic Acidosis
    causal_link_type: DIRECT
    description: Glycolysis becomes the only remaining route to ATP and lactate accumulates.
    evidence:
    - reference: PMID:40055827
      reference_title: "Sodium azide (NaN(3)) intoxication, \"the man who lived\": potential effective antidote and treatment strategy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The latter demonstrated a substantial mitigation of lactate concentration."
      explanation: >-
        The treated patient's lactate is the measured readout of the glycolytic
        shift, and it fell when the metabolic intervention was given.
  - target: Secondary Mitochondrial Oxidative Stress
    causal_link_type: DIRECT
    description: A blocked chain leaks reducing equivalents and reactive oxygen species rise.
    evidence:
    - reference: PMID:37010385
      reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Cytochrome c oxidase inhibition depletes intracellular adenosine triphosphate and increases oxidative stress, while increased nitric oxide causes hypotension and exacerbates oxidative damage."
      explanation: States the step from ATP depletion to increased oxidative stress.
  - target: Energy Failure of High Oxidative-Demand Tissue
    causal_link_type: DIRECT
    description: >-
      The tissues with the least capacity to run on glycolysis fail first, which is
      why the heart and the brain carry the clinical syndrome.
    evidence:
    - reference: PMID:38567268
      reference_title: "A case report of sodium azide-induced myopericarditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sodium azide exposures are rare but can be lethal as the substance inhibits complex IV in the electron transport chain, blocking adenosine-triphosphate (ATP) synthesis."
      explanation: >-
        Links the ATP synthesis block to lethality, which is the organ-level energy
        failure this edge represents.
  evidence:
  - reference: PMID:37010385
    reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cytochrome c oxidase inhibition depletes intracellular adenosine triphosphate and increases oxidative stress, while increased nitric oxide causes hypotension and exacerbates oxidative damage."
    explanation: Supports intracellular ATP depletion as the direct consequence of the oxidase block.
- name: Anaerobic Glycolytic Shift with Lactic Acidosis
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Anaerobic Glycolytic Shift with Lactic Acidosis"
  biological_scale: ORGANISM
  role: amplifier
  description: >-
    With oxidative phosphorylation unavailable, anaerobic glycolysis becomes the
    only source of ATP and is grossly inadequate to meet demand. Lactate
    accumulates and produces a metabolic acidosis with a raised anion gap, which is
    the laboratory signature of the toxidrome and the quantity that falls when
    treatment works.
  biological_processes:
  - preferred_term: glycolytic process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
  downstream:
  - target: Energy Failure of High Oxidative-Demand Tissue
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic acidosis further impairs myocardial contractility and cerebral
      function already compromised by the energy deficit.
    evidence:
    - reference: PMID:37010385
      reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Azide-poisoned patients present with vomiting, seizures, hypotension, metabolic acidosis, and coma; death can occur."
      explanation: >-
        Places metabolic acidosis alongside the neurological depression in the same
        clinical syndrome, which is the convergence this edge asserts.
  evidence:
  - reference: PMID:40055827
    reference_title: "Sodium azide (NaN(3)) intoxication, \"the man who lived\": potential effective antidote and treatment strategy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter demonstrated a substantial mitigation of lactate concentration."
    explanation: >-
      Reports lactate as the monitored quantity in a treated human case, supporting
      lactate accumulation as a real feature of this node.
- name: Secondary Mitochondrial Oxidative Stress
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Secondary Mitochondrial Oxidative Stress"
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    The blocked respiratory chain generates reactive oxygen species, and the nitric
    oxide arm of azide toxicity adds to the same oxidative burden rather than
    running separately from it. That convergence is the stated rationale for
    testing an antioxidant that also scavenges nitric oxide.
  biological_processes:
  - preferred_term: reactive oxygen species biosynthetic process
    modifier: INCREASED
    term:
      id: GO:1903409
      label: reactive oxygen species biosynthetic process
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Myocardial Injury and Encephalopathy
    causal_link_type: DIRECT
    description: Oxidative injury contributes to the cell death that produces the organ syndromes.
    evidence:
    - reference: PMID:35681182
      reference_title: "Potential therapies for sodium azide intoxication; a case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sodium azide irreversible blocks cytochrome C oxidase by inhibiting oxidative phosphorylation leading to cell death."
      explanation: States that the bioenergetic lesion ends in cell death, the endpoint of this edge.
  evidence:
  - reference: PMID:37010385
    reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Yet, cobinamide improved growth, increased intracellular adenosine triphosphate, and reduced apoptosis and malondialdehyde, a marker of oxidative stress, in azide-exposed cells."
    explanation: >-
      Malondialdehyde measured in azide-exposed cells is a direct readout of the
      oxidative stress asserted by this node.
- name: Nitric Oxide Generation from Azide
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    The second arm of the toxidrome, and the one that has no counterpart in cyanide
    or carbon monoxide poisoning, so it is modelled here rather than in the shared
    module. Azide is oxidized in vivo to nitric oxide; in poisoned mice this was
    evidenced by a rise in serum nitrite and nitrate accompanied by a fall in blood
    pressure.
  chemical_entities:
  - preferred_term: nitric oxide
    modifier: INCREASED
    term:
      id: CHEBI:16480
      label: nitric oxide
  downstream:
  - target: Vasodilatory Hypotension
    causal_link_type: DIRECT
    description: >-
      Nitric oxide relaxes vascular smooth muscle, lowering systemic vascular
      resistance and blood pressure.
    evidence:
    - reference: PMID:37010385
      reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Cytochrome c oxidase inhibition depletes intracellular adenosine triphosphate and increases oxidative stress, while increased nitric oxide causes hypotension and exacerbates oxidative damage."
      explanation: States directly that the increased nitric oxide causes the hypotension.
  - target: Secondary Mitochondrial Oxidative Stress
    causal_link_type: DIRECT
    description: Nitric oxide adds to the oxidative damage already produced by the blocked chain.
    evidence:
    - reference: PMID:37010385
      reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Cytochrome c oxidase inhibition depletes intracellular adenosine triphosphate and increases oxidative stress, while increased nitric oxide causes hypotension and exacerbates oxidative damage."
      explanation: States that the increased nitric oxide exacerbates oxidative damage.
  evidence:
  - reference: PMID:37010385
    reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Azide likely generated nitric oxide in the mice, as evidenced by increased serum nitrite and nitrate, and reduced blood pressure and peripheral body temperature in the animals; the reduced temperature was likely due to reflex vasoconstriction in response to the hypotension."
    explanation: >-
      Measured serum nitrite and nitrate in azide-exposed mice is the direct
      experimental support for nitric oxide generation from azide in vivo. The
      authors state it as likely rather than established, and the entry follows them.
- name: Vasodilatory Hypotension
  biological_scale: ORGANISM
  description: >-
    Profound hypotension is the feature that dominates the presentation and the one
    that distinguishes azide clinically from the other oxidase inhibitors. It is
    frequently severe enough to need vasopressors, and in reported cases mechanical
    circulatory support. It also feeds back on the energy failure, since a falling
    perfusion pressure compounds a tissue bed that already cannot use the oxygen
    it receives.
  biological_processes:
  - preferred_term: vasodilation
    modifier: INCREASED
    term:
      id: GO:0042311
      label: vasodilation
  downstream:
  - target: Energy Failure of High Oxidative-Demand Tissue
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Falling perfusion pressure reduces substrate delivery to the heart and brain
      on top of their inability to phosphorylate ADP.
    evidence:
    - reference: PMID:34128439
      reference_title: "Sodium azide poisoning: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypotension occurred commonly, in some cases requiring vasopressors and one patient received an intra-aortic ballon pump."
      explanation: >-
        The need for vasopressors and an intra-aortic balloon pump establishes that
        the hypotension reaches a level that compromises cardiac output.
  - target: Hypotension
    causal_link_type: DIRECT
    description: The mechanism node's clinical expression.
    evidence:
    - reference: PMID:34128439
      reference_title: "Sodium azide poisoning: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypotension occurred commonly, in some cases requiring vasopressors and one patient received an intra-aortic ballon pump."
      explanation: Reports hypotension as a common clinical finding in reviewed human cases.
  evidence:
  - reference: PMID:34128439
    reference_title: "Sodium azide poisoning: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of systemic poisoning may require aggressive hemodynamic support due to profound hypotension."
    explanation: >-
      The review's own conclusion that hemodynamic support is required establishes
      the severity asserted by this node.
- name: Energy Failure of High Oxidative-Demand Tissue
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Energy Failure of High Oxidative-Demand Tissue"
  biological_scale: TISSUE
  role: effector
  description: >-
    Cardiomyocytes and neurons have the highest oxidative demand and the least
    glycolytic reserve, so they are where the systemic bioenergetic lesion becomes
    organ dysfunction. Clinically this is the seizures, depressed consciousness and
    cardiac failure of the toxidrome.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Myocardial Injury and Encephalopathy
    causal_link_type: DIRECT
    description: Sustained energy failure in these tissues produces measurable injury.
    evidence:
    - reference: PMID:38567268
      reference_title: "A case report of sodium azide-induced myopericarditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cardiac toxicity after sodium azide ingestion usually occurs days after ingestion and has been previously described in the forms of heart failure with reduced ejection fraction complicated by cardiogenic shock."
      explanation: >-
        Documents the progression from exposure to established cardiac injury, with
        the delay that characterises it.
  evidence:
  - reference: PMID:37010385
    reference_title: "The vitamin B(12) analog cobinamide ameliorates azide toxicity in cells, Drosophila melanogaster, and mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Azide-poisoned patients present with vomiting, seizures, hypotension, metabolic acidosis, and coma; death can occur."
    explanation: >-
      Seizures and coma are the neurological expression, and death the endpoint, of
      energy failure in these tissues.
- name: Myocardial Injury and Encephalopathy
  conforms_to: "xenobiotic_oxidative_phosphorylation_blockade#Selective Deep Grey Matter and Myocardial Necrosis"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Where the two arms reconverge. Cardiac injury is documented across the reported
    human cases as heart failure with reduced ejection fraction and cardiogenic
    shock, and in one case as myopericarditis with preserved ejection fraction; it
    characteristically appears days after exposure rather than at presentation,
    which matters because a patient stabilised on day one can deteriorate later.
    The module node this conforms to also names deep grey matter necrosis, the
    pattern cyanide and carbon monoxide produce. That component is not asserted
    here: the azide literature reviewed for this entry reports encephalopathy,
    seizures and coma but no basal ganglia necrosis, so only the myocardial arm and
    a general cell-death claim are bound.
  biological_processes:
  - preferred_term: cell death
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Pleuritic chest pain
    causal_link_type: DIRECT
    description: Pericardial involvement produced pleuritic chest pain in the reported case.
    evidence:
    - reference: PMID:38567268
      reference_title: "A case report of sodium azide-induced myopericarditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although initially chest pain free, she developed pleuritic chest pain 48 h after ingestion."
      explanation: >-
        Records the symptom and its delayed onset in the one documented
        myopericarditis case.
  evidence:
  - reference: PMID:38567268
    reference_title: "A case report of sodium azide-induced myopericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac toxicity after sodium azide ingestion usually occurs days after ingestion and has been previously described in the forms of heart failure with reduced ejection fraction complicated by cardiogenic shock."
    explanation: Establishes myocardial injury, and its characteristic delay, as a real consequence.

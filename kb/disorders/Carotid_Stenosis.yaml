histopathology:
- name: Vulnerable carotid atherosclerotic plaque
  description: >-
    Vulnerable carotid atheroma has abundant lipids, macrophages, and T lymphocytes with fewer
    vascular smooth muscle
    cells and less extracellular matrix than stable plaque. A lipid-rich core and weakened
    fibrous cap are central
    structural features; plaque composition is distinct from lumen severity.
  evidence:
  - reference: PMID:38673936
    reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Histologically, vulnerable plaques are characterized by a high amount of lipids, macrophages, and T lymphocytes and a lower accumulation of vascular smooth muscle cells (VSMCs) and extracellular matrix compounds
    explanation: Explicitly describes histologic cellular and matrix composition.
  - *id003

  evidence:
  - reference: PMID:37303351
    reference_title: 'Carotid Artery Stenosis: A Look Into the Diagnostic and Management Strategies, and Related Complications.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CS is seen undergoing almost the same pathogenesis of any atherosclerotic plaque formation,
      from endothelial
      damage of the artery lumen to the formation of a fibrous cap with a foam cell, lipid-filled
      core.
    explanation: This abstract supports fibrous-cap formation as part of the carotid atherosclerotic plaque branch.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vascular smooth muscle cell phenotypic switching through transdifferentiation and stem/progenitor
      cell activation
      resulting in the promotion of inflammation, calcification, and secretion of extracellular
      matrix, altering
      fibrous cap structure, and necrotic core growth.
    explanation: >-
      This histopathology review supports the conserved smooth-muscle-cell
      switching and matrix-secretion program that builds the fibrous cap and
      enlarges the necrotic core of the carotid plaque.
    quote_role: REVIEW_SYNTHESIS
  - &id003
    reference: PMID:39099701
    reference_title: Brazilian Angiology and Vascular Surgery Society Guidelines for the treatment of extracranial cerebrovascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The characteristic lesion of atherosclerosis is the atherosclerotic plaque or atheromatous plaque, a complex lesion of the intimal layer of the vessel wall, consisting of a central core of cholesterol clefts, macrophages, and inflammatory cells, surrounded by layers of smooth muscle cells and connective tissue as well as a fibrous cap separating the core from the arterial lumen.
    explanation: Describes the cellular and matrix architecture of carotid atheroma.
  downstream:
  - target: Flow-limiting carotid lumen narrowing
    description: Growth can encroach on the residual lumen.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39099701

- accession: geo:GSE311535
  title: RNA-seq of human atherosclerotic carotid plaque tissue from diabetic patients
  description: Diabetes Mellitus is associated with increased risk of myocardial infarctions and strokes due to accelerated atherosclerotic plaque development and rupture. The mechanisms driving plaque rupture in the diabetic setting remain unclear. We sequenced ribosome-depleted total RNA from carotid plaques obtained from diabetic subjects undergoing carotid endarterectomy with high-grade stenosis, who either recently experienced a carotid-related ischemic cerebrovascular event (Symptomatic, n=6) or had no such event (Asymptomatic, n=6).

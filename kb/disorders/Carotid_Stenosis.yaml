    snippet: >-
      comorbid hypertension, diabetes, and chronic kidney disease (CKD), and lifestyle aspects,
      including smoking
      and diet, played the most salient role in plaque development.
    explanation: This review abstract identifies these comorbidities as salient contributors to plaque development.
    quote_role: REVIEW_SYNTHESIS

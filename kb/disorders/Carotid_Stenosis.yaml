      directness: DIRECT
      snippet: The atherosclerotic plaque usually grows slowly, limiting the arterial lumen and causing a local stenosis that reduces blood flow to the distal vessels.
      explanation: Connects plaque growth with narrowing and reduced distal flow.
  - target: Vulnerable plaque instability
    description: Inflammatory remodeling of an established plaque can enlarge its lipid core and thin its cap, producing a vulnerable state.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38673936
      reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: IFN-γ, TNF-α, and IL-1β promote the apoptosis of macrophages and foam cells, leading to lipid core enlargement. Moreover, these cytokines induce the apoptosis of SMCs, resulting in the thinning of the fibrous cap
      explanation: The cached review identifies inflammatory-cell and smooth-muscle-cell loss as intermediates connecting advanced plaque remodeling to lipid-core enlargement and cap thinning.
    intermediate_mechanisms:
    - inflammatory cytokine signaling
    - macrophage and smooth-muscle-cell apoptosis
    - lipid-core enlargement and cap thinning
  - target: Fibrous-cap matrix degradation
    description: Inflammatory proteases can degrade the matrix of an established plaque.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38673936
      reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: MMPs play a critical role in determining the instability of plaques because of their capability to degrade the cellular matrix, the vascular wall, and fibrotic caps, leading to a higher risk of rupture.
      explanation: Review synthesis links proteolysis to weakened cap structure.
    intermediate_mechanisms:
    - inflammatory-cell protease production
  - target: Intraplaque neovascularization
    description: Advanced plaque can develop an immature microvascular network.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38673936
      reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Angiogenic sprouting entails the proliferation and migration of ECs into avascular areas. Pathological angiogenesis is a consistent feature of atherosclerotic plaque development,
      explanation: Defines intraplaque endothelial sprouting.
    intermediate_mechanisms:

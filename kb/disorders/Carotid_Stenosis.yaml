    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Magnetic resonance or computed tomographic perfusion imaging tested for baseline hemodynamic impairment defined by delayed time-to-peak (TTP) arrival of intravenous contrast in the hemisphere ipsilateral minus contralateral to the stenotic artery.

  evidence:
  - reference: clinicaltrials:NCT00004732
    reference_title: Carotid Revascularization Endarterectomy Versus Stenting Trial (CREST)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of the Carotid Revascularization Endarterectomy versus Stenting Trial (CREST)
      is to compare the
      relatively new procedure of stent-assisted carotid angioplasty (CAS) to the traditional
      and accepted surgical
      approach of carotid endarterectomy (CEA) for the treatment of carotid artery stenosis
      to prevent recurrent
      strokes in those patients who have had a TIA (transient ischemic attack) or a mild stroke
      within the past
      6 months (symptomatic) and in those patients who have not had any symptoms within the
      past 6 months (asymptomatic).
    explanation: The trial summary directly supports CREST as a comparative stenting-versus-endarterectomy trial for symptomatic and asymptomatic carotid stenosis.
    quote_role: BACKGROUND
  - reference: PMID:20505173
    reference_title: Stenting versus endarterectomy for treatment of carotid-artery stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: There was no significant difference in the estimated 4-year rates of the primary end point between carotid-artery stenting and carotid endarterectomy (7.2% and 6.8%, respectively;
    explanation: Reports the main randomized comparison.
  - *id008
  notes: ClinicalTrials.gov registry checked 2026-10-04; last posted update 2017-05-17.
- name: NCT02089217
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    CREST-2 comprised two parallel randomized trials in asymptomatic stenosis of at least
    70%: 1245 patients in
    the stenting comparison and 1240 in the endarterectomy comparison. At 4 years, the primary
    composite was lower
    with stenting plus intensive medical management (2.8% versus 6.0%, P=.02); the endarterectomy
    comparison was
    neutral (3.7% versus 5.3%, P=.24). Neither comparison showed cognitive benefit through
    4 years in the prespecified
    secondary cognitive analysis. The trials do not directly compare stenting with endarterectomy.
  target_phenotypes:
  - preferred_term: Ischemic stroke
    term:
      id: HP:0002140
      label: Ischemic stroke
  evidence:
  - reference: clinicaltrials:NCT02089217
    reference_title: Carotid Revascularization and Medical Management for Asymptomatic Carotid Stenosis Trial
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carotid revascularization for primary prevention of stroke (CREST-2) is two independent
      multicenter, randomized
      controlled trials of carotid revascularization and intensive medical management versus
      medical management
      alone in patients with asymptomatic high-grade carotid stenosis.
    explanation: The trial summary directly supports CREST-2 as a randomized comparison of revascularization plus intensive medical management versus medical management alone.
    quote_role: BACKGROUND
  - *id009
  - *id010
  - *id006
  - reference: PMID:42747844
    reference_title: 'Revascularization of Asymptomatic Carotid Artery Stenosis: Cognitive Results of the CREST-2 Randomized Trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: revascularization with either CAS or CEA plus IMM, compared with IMM alone, did not significantly improve cognitive function at up to 4 years of follow-up.
    explanation: Prespecified secondary cognitive outcomes in CREST-2 were neutral.
  notes: ClinicalTrials.gov registry checked 2026-10-04; last posted update 2025-10-01. The registry lists 2486 enrolled; the publication reports 2485 randomized, which is the denominator used here. TCAR was not included.
- name: NCT03121209
  phase: PHASE_III
  status: COMPLETED
  description: >-
    CREST-H enrolled 392 patients with severe asymptomatic stenosis; 291 had complete imaging
    and cognitive data.
    In the primary analysis of 51 with reduced baseline cognition, baseline perfusion impairment
    did not significantly
    modify the cognitive response to revascularization versus intensive medical management
    over one year (interaction
    P=.40). Small subgroup size and missing data limit inference.
  target_phenotypes:

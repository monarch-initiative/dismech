review_notes: >-
  Falcon deep research emphasized vulnerable plaque biology, asymptomatic versus
  symptomatic carotid stenosis framing, DUS/CTA diagnostics, medical therapy and
  revascularization, and CREST/CREST-2 trial context. Several report-suggested
  ontology IDs were corrected after local OAK validation: carotid artery
  stenosis uses HP:0100546, amaurosis fugax uses HP:0100576, and treatment
  bindings avoid Falcon-suggested treatment IDs that resolved locally to unrelated
  concepts. PR review follow-up replaced a systemic blood-circulation binding
  with GO:0001666 response to hypoxia for hemodynamic impairment, changed
  carotid artery stenting from a generic surgical-procedure binding to the
  local NCIT angioplasty term, added exact NCIT bindings for broad diagnostic
  imaging and CT angiography diagnoses, and added vulnerable plaque
  histopathology from the plaque-biology review.
datasets:
- accession: geo:GSE308470
  title: Possible association between the microbiota in subgingival and atherosclerotic plaque in patients with carotid stenosis.
  description: Bacterial DNA was detected in both subgingival and carotid plaque samples. The microbial composition differed between subgingival and carotid plaque communities. Alpha diversity analysis revealed significantly higher diversity in subgingival samples compared to carotid plaques (p = 0.039). Beta diversity analysis, including unweighted UniFrac analysis (p<0.001), linear discriminant analysis with effect size estimation, cladogram-based analysis, and principal component analysis, confirmed marked differences between the subgingival and carotid plaque microbiota. However, the study did reveal overlaps in a few individual cases.

datasets:
- accession: geo:GSE308470
  title: Possible association between the microbiota in subgingival and atherosclerotic plaque in patients with carotid stenosis.
  description: Paired subgingival and carotid endarterectomy specimens from 25 patients (50 samples), profiled by V3-V4 16S rRNA amplicon sequencing. Oral and vascular bacterial DNA profiles differed; occasional overlap does not establish oral origin, viable infection, or microbial causation of stenosis.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  sample_count: 50
  publication: PMID:41908294
  notes: Cross-sectional, small surgical cohort. Low bacterial biomass makes vascular samples susceptible to reagent contamination and carryover. Amplicon sequencing cannot establish microbial viability and has limited species resolution. This is not shotgun metagenomics.
- accession: geo:GSE311535
  title: RNA-seq of human atherosclerotic carotid plaque tissue from diabetic patients
  description: 'Bulk RNA sequencing of carotid plaques from 12 patients with diabetes undergoing endarterectomy: six recently symptomatic and six asymptomatic. Sex and insulin use explained substantial transcriptomic variation; the small observational study cannot establish that insulin causes plaque rupture. Spatial localization was inferred computationally using external single-cell and spatial references.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 12
  publication: PMID:41377472
  notes: Recently symptomatic samples were obtained about five days after events, so expression changes may follow rupture. No contemporaneous nondiabetic control group was included; batch effects prevented comparison with a historical cohort. Inferred fibrous-cap expression is not direct spatial transcriptomic measurement.
notes: This entry models atherosclerotic extracranial carotid stenosis. Dissection, carotid web, vasculitis, radiation injury, and complete carotid occlusion have distinct mechanisms and management. Symptomatic and asymptomatic disease are clinical states, not obligate sequential stages or separate inherited subtypes. Stenosis percentages depend on the measurement method; NASCET uses the normal distal lumen whereas ECST estimates the original lumen at the lesion. Trial findings apply to their selected populations and endpoints; CREST-2 comprised two parallel trials and was not a direct stenting-versus-endarterectomy comparison.
imaging_findings:
- name: Duplex evidence of carotid lumen narrowing
  modality: ULTRASOUND
  description: Duplex combines plaque morphology and flow velocities to estimate stenosis. Laboratory thresholds and near-occlusion interpretation vary, so a single velocity is not a universal substitute for complete vascular assessment.
  evidence:
  - reference: PMID:38683353
    reference_title: CIRSE Standards of Practice on Carotid Artery Stenting.
    snippet: Duplex ultrasonography utilises blood velocity in addition to B-mode greyscale to detect the existence and degree of stenosis, as well as evaluation of plaque composition and characteristics.
    explanation: Describes combined morphologic and hemodynamic assessment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: DOI:10.54522/jvsgbi.2024.156
    reference_title: Current practice in ultrasound grading of carotid artery stenosis in the UK and Ireland
    snippet: The criteria prioritised to grade a stenosis and how near occlusion was defined on duplex imaging was variable, and there were inconsistent practices on internal audits and quality assurance.
    explanation: UK/Ireland practice survey documents variability; it is not a diagnostic-accuracy estimate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Ipsilateral cerebral perfusion delay
  modality: MRI
  description: CREST-H used perfusion MRI or CT to measure delayed contrast arrival in the hemisphere ipsilateral to severe stenosis. This imaging phenotype does not by itself establish infarction or reversible cognitive dysfunction.
  evidence:
  - reference: PMID:42747834
    reference_title: 'Revascularization in Asymptomatic Carotid Artery Stenosis With Hemodynamic Impairment and Cognitive Outcomes: The CREST-H Substudy of the CREST-2 Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Magnetic resonance or computed tomographic perfusion imaging tested for baseline hemodynamic impairment defined by delayed time-to-peak (TTP) arrival of intravenous contrast in the hemisphere ipsilateral minus contralateral to the stenotic artery.
    explanation: CREST-H measured perfusion delay in severe unilateral asymptomatic stenosis; this is an organ-level observation, not evidence for a specific cellular hypoxia-response pathway.

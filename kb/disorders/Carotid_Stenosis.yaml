diagnosis:
- name: Duplex ultrasound with confirmatory CT angiography
  description: >-
    Duplex ultrasonography is commonly used as first-line assessment of ICA
    stenosis. Significant stenosis is often confirmed or further characterized
    with CT angiography or another cross-sectional vascular imaging modality.
  diagnosis_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  results: Estimates stenosis severity and informs medical versus revascularization management.
  evidence:
  - reference: PMID:38896635
    reference_title: Accuracy of duplex ultrasonography versus angiotomography for the diagnosis of extracranial internal carotid stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duplex ultrasonography (DUS) is the first line of investigation of ICA stenosis, but
      its accuracy varies in
      the literature and it is usual to complement the study with another more accurate exam
      when faced with significant
      stenosis.
    explanation: This directly supports DUS as first-line imaging and confirmatory imaging for significant stenosis.
    quote_role: PRIMARY_RESULT
- name: CT angiography for severe ICA stenosis
  description: >-
    CT angiography can accurately diagnose severe internal carotid stenosis and
    is used to characterize anatomy for procedural planning.
  diagnosis_term:
    preferred_term: computed tomography angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  results: High sensitivity and specificity for severe ICA stenosis in meta-analysis.
  evidence:
  - reference: PMID:39143526
    reference_title: Systematic review and meta-analysis of the diagnostic value of computed tomography angiography for severe internal carotid artery stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CTA demonstrated high sensitivity and specificity for diagnosing severe ICA stenosis.
    explanation: This meta-analysis conclusion directly supports CTA for severe ICA stenosis diagnosis.
    quote_role: PRIMARY_RESULT
- name: Vulnerable plaque risk stratification
  description: >-
    Plaque composition, including intraplaque hemorrhage, lipid-rich core, and surface disruption,
    adds information
    beyond lumen stenosis. CT and MRI can identify vulnerable plaques against histology; these
    findings do not by
    themselves establish that a particular patient benefits from revascularization.
  diagnosis_term:
    preferred_term: vascular imaging
  results: Identifies high-risk plaque composition and may refine stroke-risk stratification.
  evidence:
  - reference: PMID:38953552
    reference_title: 'Diagnostic accuracy of carotid plaque instability by noninvasive imaging: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: CT and MRI have a similar, high performance in detecting vulnerable carotid plaques, whereas US showed significantly less diagnostic accuracy.
    explanation: Meta-analysis compares imaging against histology; it does not test treatment benefit.
- name: NASCET and ECST stenosis measurement
  description: Report the measurement convention. NASCET compares the narrowest residual lumen with the normal distal lumen; ECST uses the estimated original lumen at the lesion. The percentages are not interchangeable.
  evidence:
  - reference: PMID:38683353
    reference_title: CIRSE Standards of Practice on Carotid Artery Stenting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The degree of the stenosis is calculated by either the NASCET criteria, that calculates the ratio of the stenosis to the normal lumen distal to the stenosis, or the ECST criteria, which characterises the degree of the stenosis in relation to the estimated normal lumen at the same level
    explanation: Explains the distinct denominator conventions.
- name: Transcranial Doppler microembolic signals
  description: Transcranial Doppler monitoring can detect microembolic signals associated with active embolization and plaque instability. Absence of detected signals does not exclude carotid disease.
  evidence:
  - reference: PMID:38673936
    reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Microembolisms from carotid plaques are one of the mechanisms responsible for cerebral ischemia.
    explanation: Defines the process assessed by microembolic monitoring.
  - reference: PMID:38673936
    reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Microembolic signals (MESs) can also be detected in asymptomatic patients,
    explanation: Supports detecting embolic activity even without recent symptoms.
- name: Distinguishing near-occlusion from conventional stenosis and complete occlusion
  description: Near-occlusion is a tight proximal ICA stenosis with distal lumen reduction, with or without a threadlike full collapse. Residual lumen distinguishes it from complete occlusion. The collapsed distal vessel is not a valid normal denominator for routine percentage stenosis; confirm this configuration before applying conventional thresholds.
  evidence:
  - reference: PMID:26316571
    reference_title: 'Carotid Near-Occlusion: A Comprehensive Review, Part 1--Definition, Terminology, and Diagnosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Carotid near-occlusion is distal ICA luminal collapse beyond a tight stenosis, where the distal lumen should not be used for calculating percentage stenosis.
    explanation: Defines near-occlusion and the measurement caveat.
  - reference: PMID:41614493
    reference_title: 'Carotid near-occlusion diagnostics and its consequences: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: When grading carotid stenosis, it is crucial to first assess if the case have CNO and only grade conventional stenoses with percent.
    explanation: The contemporary systematic review maintains the distinction from conventional percentage stenosis.

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In this substudy of a randomized clinical trial, there was no differential effect of revascularization vs IMM alone on cognition over 1 year by cerebral hemodynamic status among those with baseline reduced cognition,
    explanation: The CREST-H result does not support the proposed differential cognitive benefit from restoring flow; the reduced-cognition primary-analysis subgroup contained 51 participants.
  - reference: PMID:42747834

    term:
      id: HP:0002140
      label: Ischemic stroke
  evidence:
  - reference: PMID:39099701
    reference_title: Brazilian Angiology and Vascular Surgery Society Guidelines for the treatment of extracranial cerebrovascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'Optimal clinical management consists of three key elements: (1) adopting healthy eating habits and physical activity; (2) controlling comorbidities and risk factors; and (3) optimization of antithrombotic and lipid-lowering therapy.'
    explanation: Defines the components of carotid disease prevention.
  - reference: PMID:41269206
    reference_title: Medical Management and Revascularization for Asymptomatic Carotid Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Primary targets were a systolic blood pressure of less than 130 mm Hg (the initial target of 140 mm Hg was reduced in 2018 after guideline changes) and a low-density lipoprotein (LDL) cholesterol level of less than 70 mg per deciliter
    explanation: Reports CREST-2 protocol targets.
  - reference: PMID:39099701
    reference_title: Brazilian Angiology and Vascular Surgery Society Guidelines for the treatment of extracranial cerebrovascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: For patients with asymptomatic ICA stenosis, lipid-lowering therapy with statins associated or not with ezetimibe to prevent cardiovascular events (AMI, stroke, cardiovascular death) is recommended
    explanation: Supports statin-based lipid lowering, with ezetimibe where appropriate.
  - &id012
    reference: PMID:40252662
    reference_title: 'Optimised medical therapy alone versus optimised medical therapy plus revascularisation for asymptomatic or low-to-intermediate risk symptomatic carotid stenosis (ECST-2): 2-year interim results of a multicentre randomised trial.'
    snippet: No evidence for a benefit of revascularisation in addition to OMT was found in the first 2 years following treatment for patients with asymptomatic or symptomatic carotid stenosis of 50% or greater with a low or intermediate predicted stroke risk (assessed by the CAR score).
    explanation: ECST-2 interim findings apply to low/intermediate predicted-risk patients and do not establish absence of benefit in high-risk symptomatic disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39099701
    reference_title: Brazilian Angiology and Vascular Surgery Society Guidelines for the treatment of extracranial cerebrovascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: There is no proven benefit from dual antiplatelet therapy for asymptomatic individuals, and clopidogrel should be used as monotherapy in case of intolerance to ASA.
    explanation: Distinguishes long-term prevention in asymptomatic stenosis from periprocedural dual antiplatelet therapy for stenting.
  - reference: PMID:39099701
    reference_title: Brazilian Angiology and Vascular Surgery Society Guidelines for the treatment of extracranial cerebrovascular disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'statins: atorvastatin 40-80 mg/day or rosuvastatin 20-40 mg/day.'
    explanation: The guideline explicitly names atorvastatin as a lipid-lowering option; doses are source context, not individualized instructions.
  notes: Aspirin, clopidogrel, and atorvastatin are examples of antiplatelet and lipid-lowering agents; the intensive-management trial results do not isolate the effect of an individual drug. ECST-2 found no added benefit from revascularization on its two-year hierarchical endpoint in selected patients with at least 50% stenosis and predicted five-year ipsilateral stroke risk below 20%; this differs from the CREST-2 population and endpoint. Antiplatelet choice and duration depend on symptoms, intervention, and bleeding risk; the listed agents do not imply that all should be prescribed together.
  target_mechanisms:
  - target: Carotid plaque-surface thrombosis
    treatment_effect: INHIBITS
    description: The antiplatelet component reduces platelet-mediated thrombotic activity; other components address vascular risk.
    evidence:
    - reference: PMID:38673936
      reference_title: 'Molecular Pathways of Vulnerable Carotid Plaques at Risk of Ischemic Stroke: A Narrative Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: These data confirm that platelet activation plays a crucial role in cerebral microembolism, as demonstrated by the efficacy of antiplatelet drugs in reducing the MES rate
      explanation: Links antiplatelet therapy to reduced microembolic signals; the surrogate is not itself a clinical stroke endpoint.
- name: Carotid endarterectomy
  description: >-
    Carotid endarterectomy removes the atheromatous lesion. NASCET established benefit for
    selected recently symptomatic
    70-99% stenosis; prompt assessment is important, with timing depending on neurologic stability
    and infarct burden.
    Older ACAS results supported selected asymptomatic patients, but in the separate modern
    CREST-2 endarterectomy
    trial the 4-year composite rate was 3.7% with surgery plus intensive management versus
    5.3% with intensive management
    alone (P=.24). This neutral asymptomatic result does not negate symptomatic-trial benefit.
  treatment_term:
    preferred_term: Carotid Endarterectomy
    term:
      id: NCIT:C157807
      label: Carotid Endarterectomy
  target_phenotypes:
  - preferred_term: Ischemic stroke
    term:
      id: HP:0002140
      label: Ischemic stroke
  - preferred_term: Transient ischemic attack
    term:
      id: HP:0002326
      label: Transient ischemic attack
  evidence:
  - reference: PMID:1852179
    reference_title: Beneficial effect of carotid endarterectomy in symptomatic patients with high-grade carotid stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carotid endarterectomy is highly beneficial to patients with recent hemispheric and
      retinal transient ischemic
      attacks or nondisabling strokes and ipsilateral high-grade stenosis (70 to 99 percent)
      of the internal carotid
      artery.
    explanation: This randomized trial abstract directly supports carotid endarterectomy for symptomatic high-grade carotid stenosis.
    quote_role: PRIMARY_RESULT
  - reference: PMID:7723155
    reference_title: Endarterectomy for asymptomatic carotid artery stenosis. Executive Committee for the Asymptomatic Carotid Atherosclerosis Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with asymptomatic carotid artery stenosis of 60% or greater reduction in diameter
      and whose general
      health makes them good candidates for elective surgery will have a reduced 5-year risk
      of ipsilateral stroke
      if carotid endarterectomy performed with less than 3% perioperative morbidity and mortality
      is added to aggressive
      management of modifiable risk factors.
    explanation: Historical ACAS benefit in selected asymptomatic patients predates contemporary intensive management; interpret alongside CREST-2.
    quote_role: PRIMARY_RESULT
  - &id010
    reference: PMID:41269206
    reference_title: Medical Management and Revascularization for Asymptomatic Carotid Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In the endarterectomy trial, the 4-year incidence of primary-outcome events was 5.3% (95% CI, 3.3 to 7.4) in the medical-therapy group and 3.7% (95% CI, 2.1 to 5.5) in the endarterectomy group
    explanation: The difference in the separate endarterectomy trial was not statistically significant (P=.24).
  - &id006
    reference: PMID:41269206
    reference_title: Medical Management and Revascularization for Asymptomatic Carotid Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The primary outcome was a composite of any stroke or death, assessed from randomization to 44 days, or ipsilateral ischemic stroke, assessed during the remaining follow-up period up to 4 years.
    explanation: Defines the composite endpoint used for the two trial-specific estimates.
  - reference: PMID:38683353
    reference_title: CIRSE Standards of Practice on Carotid Artery Stenting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Intervention within two weeks of TIA onset is most beneficial for symptomatic patients with ≥50% stenosis (NASCET)
    explanation: Supports prompt intervention assessment after TIA in eligible symptomatic patients.
  - reference: PMID:41614493
    reference_title: 'Carotid near-occlusion diagnostics and its consequences: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Symptomatic CNO have no benefit with revascularization in studies with "good" CNO diagnostics, which foremost applies to the moderate subtype (without full collapse).
    explanation: The review separates near-occlusion definitions; these findings do not prove equivalence for the sparsely studied full-collapse subgroup.
  therapeutic_modality: SURGERY
  notes: Conventional high-grade stenosis results should not be extrapolated to near-occlusion. Contemporary evidence for benefit in near-occlusion is limited, especially for the full-collapse subgroup; individualized specialist assessment is required.
  target_mechanisms:
  - target: Flow-limiting carotid lumen narrowing
    treatment_effect: INHIBITS
    description: Removal of the obstructing plaque restores the residual lumen.
    evidence:
    - reference: PMID:37303351
      reference_title: 'Carotid Artery Stenosis: A Look Into the Diagnostic and Management Strategies, and Related Complications.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: The artery is opened, and the plaque is removed.
      explanation: Describes direct removal of the carotid atheroma.
  - target: Artery-to-artery embolization
    treatment_effect: INHIBITS
    description: Removal of the culprit plaque removes a local source of artery-to-artery emboli.
    evidence:
    - reference: PMID:37303351
      reference_title: 'Carotid Artery Stenosis: A Look Into the Diagnostic and Management Strategies, and Related Complications.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: The artery is opened, and the plaque is removed.
      explanation: Describes direct removal of the carotid atheroma.
- name: Carotid artery stenting
  description: >-
    Carotid stenting with embolic protection is an alternative for selected patients. CREST
    found similar composite
    outcomes to endarterectomy but more periprocedural stroke with stenting and more myocardial
    infarction with
    endarterectomy, with age modifying relative outcomes. In the separate CREST-2 stenting
    trial for asymptomatic
    stenosis of at least 70%, transfemoral stenting plus intensive management reduced the
    4-year composite from
    6.0% to 2.8% (P=.02). Certified operators and trial selection limit generalization; CREST-2
    did not include
    TCAR or directly compare stenting with endarterectomy.
  treatment_term:
    preferred_term: Endovascular Stenting
    term:
      id: NCIT:C157840
      label: Endovascular Stenting
  target_phenotypes:
  - preferred_term: Ischemic stroke
    term:
      id: HP:0002140
      label: Ischemic stroke
  evidence:
  - &id008
    reference: PMID:20505173
    reference_title: Stenting versus endarterectomy for treatment of carotid-artery stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the rates of the individual end points differed between the stenting group and the endarterectomy group (death, 0.7% vs. 0.3%; P = 0.18; stroke, 4.1% vs. 2.3%; P = 0.01; myocardial infarction, 1.1% vs. 2.3%; P = 0.03)
    explanation: Reports the opposing periprocedural stroke and myocardial-infarction differences in CREST.
  - &id009
    reference: PMID:41269206
    reference_title: Medical Management and Revascularization for Asymptomatic Carotid Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In the stenting trial, the 4-year incidence of primary-outcome events was 6.0% (95% confidence interval [CI], 3.8 to 8.3) in the medical-therapy group and 2.8% (95% CI, 1.5 to 4.3) in the stenting group
    explanation: CREST-2 stenting versus intensive medical management, not versus endarterectomy.
  - *id006
  - reference: PMID:41269206
    reference_title: Medical Management and Revascularization for Asymptomatic Carotid Stenosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: revascularization was performed only by well-trained and certified high-volume operators, so the results in CREST-2 may not reflect practice more broadly.
    explanation: Limits extrapolation of trial results.
  - &id007
    reference: PMID:38683353
    reference_title: CIRSE Standards of Practice on Carotid Artery Stenting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: It should be noted that the objective of CAS endpoint is not to achieve maximal luminal gain, but rather to attain complete plaque coverage.
    explanation: Explains the plaque-coverage mechanism of stenting.
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Artery-to-artery embolization
    treatment_effect: INHIBITS
    description: Stent coverage stabilizes the plaque surface; embolic protection reduces procedural embolization risk.
    evidence:
    - *id007
    - reference: PMID:38683353
      reference_title: CIRSE Standards of Practice on Carotid Artery Stenting.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: In order to mitigate this risk, embolic protection devices (EPDs) have been devised to capture and remove any fragments that may break off during the procedure.
      explanation: Supports procedural embolic protection.
- name: Transcarotid artery revascularization with flow reversal
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Endovascular Stenting
    term:
      id: NCIT:C157840
      label: Endovascular Stenting
  description: TCAR combines direct cervical carotid access, flow reversal for embolic protection, and stent placement. ROADSTER-3 reported a 0.9% 30-day stroke/death/MI rate in 344 intention-to-treat standard-risk patients younger than 80 years. The study was single-arm and industry sponsored; it does not prove superiority to endarterectomy or benefit over medical therapy in asymptomatic disease.
  evidence:
  - reference: PMID:41277872
    reference_title: 'Prospective, Multicenter Evaluation of Transcarotid Artery Revascularization in Standard-Risk Patients: 30-Day Outcomes of the ROADSTER 3 Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Transcarotid artery revascularization (TCAR) combines transcarotid arterial access and robust reversal of antegrade internal carotid artery flow to provide embolic protection during carotid angioplasty and stenting (CAS) for stroke prevention.
    explanation: Defines TCAR access and protection mechanisms.
  - &id011
    reference: PMID:41277872
    reference_title: 'Prospective, Multicenter Evaluation of Transcarotid Artery Revascularization in Standard-Risk Patients: 30-Day Outcomes of the ROADSTER 3 Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The composite 30-day stroke/death/myocardial infarction rate was 0.6% (95% CI, 0.1-2.2%) for the per protocol population and 0.9% (95% CI, 0.2-2.5%) for the intent to treat population.
    explanation: 'Single-arm ROADSTER-3 outcomes: 320 per-protocol and 344 intention-to-treat patients; not a randomized comparison.'
  - reference: PMID:41277872
    reference_title: 'Prospective, Multicenter Evaluation of Transcarotid Artery Revascularization in Standard-Risk Patients: 30-Day Outcomes of the ROADSTER 3 Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: ROADSTER 3 is a single-arm study without a comparative group, and potential bias can exist without randomization.
    explanation: Explicit limitation of causal comparative efficacy inference.
  target_mechanisms:
  - target: Artery-to-artery embolization
    treatment_effect: INHIBITS
    description: Reversed flow protects the cerebral circulation during stent delivery.
    evidence:
    - reference: PMID:41277872
      reference_title: 'Prospective, Multicenter Evaluation of Transcarotid Artery Revascularization in Standard-Risk Patients: 30-Day Outcomes of the ROADSTER 3 Study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: TCAR combines transcarotid arterial access and robust reversal of antegrade internal carotid artery flow to provide embolic protection during carotid angioplasty and stenting
      explanation: Defines the procedural protection mechanism.
clinical_trials:
- name: NCT00004732
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    CREST analyzed 2502 symptomatic or asymptomatic patients to stenting or endarterectomy.
    The estimated 4-year
    primary composite rates were 7.2% and 6.8% (P=.51), with opposing periprocedural stroke
    and myocardial-infarction
    differences. The comparison did not include a medical-therapy-only arm.
  target_phenotypes:
  - preferred_term: Ischemic stroke

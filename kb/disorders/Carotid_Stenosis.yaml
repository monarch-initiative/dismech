name: Carotid Stenosis
creation_date: '2026-05-06T18:58:50Z'
description: >-
  Carotid stenosis is narrowing of the extracranial carotid arterial lumen, usually from atherosclerotic
  plaque
  at the bifurcation or proximal internal carotid artery. Plaque burden and plaque instability
  are distinct determinants
  of risk. Embolization and, in some severe lesions, inadequate perfusion can cause ipsilateral
  cerebral or retinal
  ischemia. Symptomatic status, stenosis severity, plaque characteristics, procedural risk,
  and contemporary medical
  therapy influence stroke-prevention decisions. Cognitive impairment is associated with severe
  disease, but randomized
  revascularization trials have not demonstrated cognitive benefit.

name: PMM2-Congenital Disorder of Glycosylation
description: >-
  PMM2-CDG (historically CDG-Ia, carbohydrate-deficient glycoprotein syndrome type I,
  or Jaeken syndrome) is an autosomal recessive disorder of N-linked protein
  glycosylation caused by biallelic hypomorphic variants in PMM2. Phosphomannomutase 2
  interconverts mannose-6-phosphate and mannose-1-phosphate, the committed precursor of
  GDP-mannose and dolichol-phosphate-mannose. Losing that step starves assembly of the
  dolichol-linked oligosaccharide donor, so N-glycosylation fails globally rather than
  for one substrate, and essentially every secreted and membrane glycoprotein is
  affected. The result is a multisystem disease dominated by cerebellar hypoplasia and
  ataxia, with coagulopathy, hepatopathy, endocrine dysfunction and a characteristic
  pattern of inverted nipples and abnormal subcutaneous fat distribution. It is the
  most common congenital disorder of glycosylation.
disease_term:
  preferred_term: PMM2-congenital disorder of glycosylation
  term:
    id: MONDO:0008907
    label: PMM2-congenital disorder of glycosylation

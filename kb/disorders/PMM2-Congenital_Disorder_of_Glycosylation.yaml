    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      treatment of hypothyroidism, hypoglycemia, and other endocrinopathies per
      endocrinologist
    explanation: >-
      The GeneReviews Management section treats hypothyroidism as an expected
      manifestation requiring specialist management.

- category: Hematologic
  name: Deep Venous Thrombosis
  frequency: OCCASIONAL
  description: >-
    The clinical event the antithrombin deficiency produces; reported in 10% of a
    prospective cohort, and in that series always in the context of infection.
  phenotype_term:
    preferred_term: Venous thrombosis
    term:
      id: HP:0004936
      label: Venous thrombosis
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The risk for deep venous thrombosis is increased.
    explanation: States the increased thrombotic risk in the adult stage.
  - reference: PMID:37224763
    reference_title: >-
      Coagulation abnormalities in a prospective cohort of 50 patients with
      PMM2-congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, 16% of the cohort experienced symptoms of spontaneous bleeding and
      10% had thrombosis.
    explanation: Quantifies both bleeding and thrombotic events in the prospective cohort.

- category: Hepatic
  name: Hepatomegaly
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:40307862
    reference_title: >-
      A comprehensive update of genotype-phenotype correlations in PMM2-CDG: insights
      from molecular and structural analyses.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including brain hypoplasia, disturbed psychomotor abilities, areflexia,
      hypotonia, and strabismus as well as other organ involvement (hepatomegaly,
      tubulopathy)
    explanation: >-
      Reports hepatomegaly among the organ involvement in described patients. Graded
      PARTIAL because it describes specific genotypes rather than giving a cohort
      frequency.

- category: Ocular
  name: Myopia
  frequency: FREQUENT
  description: >-
    Emerges in the adult stable disability stage alongside the progressive retinal
    dystrophy, and is a separate refractive problem from it.
  phenotype_term:
    preferred_term: Myopia
    term:
      id: HP:0000545
      label: Myopia
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: progressive retinitis pigmentosa and myopia are seen
    explanation: Names myopia among the adult-stage ocular findings.

- category: Musculoskeletal
  name: Joint Contractures
  frequency: OCCASIONAL
  description: >-
    Reported in the late-infantile and childhood ataxia-intellectual disability stage,
    alongside skeletal deformity.
  phenotype_term:
    preferred_term: Joint contracture
    term:
      id: HP:0034392
      label: Joint contracture
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      coagulopathy, retinitis pigmentosa, joint contractures, and skeletal deformities
    explanation: Lists joint contractures among the childhood-stage findings.

- category: Musculoskeletal
  name: Osteoporosis
  frequency: FREQUENT
  description: >-
    Progressive in the adult stage, in which thoracic and spinal deformity worsens with
    it. Part of the premature-aging picture of the third stage rather than a
    presenting feature.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      thoracic and spinal deformities with osteoporosis worsen, and premature aging is
      observed
    explanation: States the progressive skeletal deterioration of the adult stage.

- category: Endocrine
  name: Hypogonadotropic Hypogonadism
  frequency: OCCASIONAL
  description: >-
    Absent or deficient secondary sexual development, reported in the adult stage:
    females may lack secondary sexual development and males may show decreased
    testicular volume.
  phenotype_term:
    preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hypogonadotropic hypogonadism and coagulopathy may occur.
    explanation: States the hypogonadotropic hypogonadism of the adult stable stage.

biochemical:
- name: Serum transferrin isoform pattern
  presence: Abnormal
  context: >-
    A type I transferrin pattern is the established screening test and the functional
    assay used to interpret PMM2 variants of uncertain significance. Its sensitivity is
    high but not complete, and two recurrent variants are enriched among false
    positives.
  readouts:
  - target: Global Protein N-Hypoglycosylation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Under-occupied glycosylation sites on transferrin report the global sequon
      occupancy defect.
    evidence:
    - reference: PMID:39216211
      reference_title: "Sensitivity of transferrin isoform analysis for PMM2-CDG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The data demonstrate 94% overall test sensitivity for PMM2-CDG and importantly
        demonstrate two known, recurrent variants enriched in false positive cases
        highlighting an important limitation of the test.
      explanation: >-
        Quantifies the sensitivity of this readout and names its limitation, rather
        than treating it as a perfect test.

- name: Antithrombin activity
  presence: Decreased
  context: >-
    Antithrombin is itself an N-glycoprotein, so its activity reports the glycosylation
    defect directly. Activity below roughly 65% marks the range in which thrombotic
    events occurred in the prospective cohort.
  readouts:
  - target: Hypoglycosylation of Coagulation Regulators
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Reduced activity of a glycoprotein anticoagulant reports the hypoglycosylation of
      the coagulation system.
    evidence:
    - reference: PMID:37224763
      reference_title: "Coagulation abnormalities in a prospective cohort of 50 patients with PMM2-congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AT activity was below 50% in 62.5% of all patients (normal range 80-130%).
      explanation: Gives the magnitude of the deficit against a stated reference interval.

diagnosis:
- name: Type I transferrin isoform pattern with confirmatory PMM2 testing
  description: >-
    Diagnosis rests on a tiered sequence rather than a single test: a type I transferrin
    isoform pattern establishes a disorder of N-linked glycosylation, and biallelic PMM2
    variants confirm which one. Phosphomannomutase enzyme activity in leukocytes or
    fibroblasts is the fallback when the molecular result is uncertain, which is why the
    enzyme assay retains a role even in a sequencing era.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PMM2-CDG is established in a proband with type I transferrin
      isoform analysis and identification of either biallelic pathogenic variants in
      PMM2 on molecular genetic testing or (if results of molecular genetic testing are
      uncertain) low levels of phosphomannomutase (PMM) enzyme activity.
    explanation: >-
      The GeneReviews Diagnosis/Testing criterion, giving all three tiers and the
      condition under which the enzyme assay is used.

progression:
- phase: Infantile multisystem
  age_range: birth to ~3 years
  notes: >-
    Axial hypotonia, hyporeflexia, esotropia and developmental delay, with feeding
    difficulty and faltering growth. Two courses are distinguished: a nonfatal
    neurologic one, and a neurologic-multivisceral one carrying roughly 20% mortality
    in the first year.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a more severe neurologic-multivisceral course with approximately 20% mortality in
      the first year of life
    explanation: Gives the mortality attached to the severe infantile course.
- phase: Late-infantile and childhood ataxia-intellectual disability
  age_range: 3 to 10 years onward
  notes: >-
    Hypotonia, ataxia, severely delayed language and motor development, inability to
    walk, and IQ of 40 to 70, with seizures, stroke-like episodes, coagulopathy and
    retinitis pigmentosa.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The late-infantile and childhood ataxia–intellectual disability stage, which
      begins between ages three and ten years
    explanation: Defines the stage and its age of onset.
- phase: Adult stable disability
  age_range: adulthood
  notes: >-
    Intellectual ability stabilizes. Progressive retinitis pigmentosa and myopia,
    worsening thoracic and spinal deformity with osteoporosis, premature aging, and
    hypogonadotropic hypogonadism.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the adult stable disability stage, intellectual ability is stable; peripheral
      neuropathy is variable, progressive retinitis pigmentosa and myopia are seen
    explanation: >-
      Characterizes the adult stage, and specifically that the cognitive trajectory
      plateaus rather than continuing to decline.

genetic:
- name: PMM2
  gene_term:
    preferred_term: PMM2
    term:
      id: hgnc:9115
      label: PMM2
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic hypomorphic variants. Missense alleles predominate because complete loss
    of activity is not compatible with survival.
    R141H (c.422G>A) is the commonest severe allele and has never been reported
    homozygous in a living patient; F119L retains partial activity, and the R141H/F119L
    compound heterozygote is the commonest genotype. Per-allele residual activity is
    what places a patient on the severity spectrum.
  evidence:
  - reference: PMID:40501776
    reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      R141H, a human pathogenic variant carried by more than 60% of PMM2-CDG patients
    explanation: >-
      Background statement of the allele's frequency among patients; graded OTHER
      because it recites human epidemiology inside a mouse-model paper.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic inheritance, but with an observed recurrence risk that exceeds the
    Mendelian expectation in practice.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, based on outcomes of at-risk pregnancies, the risk of having an affected
      child is closer to 1/3 than to the expected 1/4
    explanation: >-
      The GeneReviews Genetic Counseling section records an observed segregation ratio
      above the 1/4 expectation, which is the figure counseling should use.

prevalence:
- population: North America and Europe
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.9
  notes: >-
    Reported as an incidence of approximately 1:35,000 in North America and Europe;
    normalized here to cases per 100,000.
  evidence:
  - reference: PMID:40501776
    reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PMM2-CDG has an estimated incidence of approximately 1:35,000 in North America
      and Europe
    explanation: >-
      Background epidemiology stated in a mouse-model paper; graded OTHER because the
      sentence reports human population data the paper did not generate.

- population: Worldwide (allele-frequency ceiling)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.0
  notes: >-
    An upper bound derived from population allele frequencies rather than from
    diagnosed cases. It exceeds observed diagnosed rates, and this entry's own
    null-lethality claim is one reason the two diverge: genotypes that never reach live
    birth are counted in an allele-based estimate and not in a clinical one.
  evidence:
  - reference: PMID:34447415
    reference_title: "The Estimated Prevalence of N-Linked Congenital Disorders of Glycosylation Across Various Populations Based on Allele Frequencies in General Population Databases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Based on population allele frequencies, the expected birth prevalence of the most
      common PMM2-CDG could be as high as 1:20,000
    explanation: >-
      The dedicated prevalence study's allele-frequency-derived ceiling. Graded
      COMPUTATIONAL because it is inferred from population allele frequencies rather
      than ascertained from diagnosed patients.

treatments:
- name: Supportive and Multisystem Management
  description: >-
    There is no therapy that restores glycosylation. Management is organ-directed:
    nutritional support, seizure control, developmental therapies, and specialist
    management of the ocular, cardiac, endocrine and renal manifestations.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Ataxia and Developmental Impairment
    treatment_effect: MODULATES
    description: >-
      Acts on the consequences of the cerebellar lesion rather than on the
      glycosylation defect.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic treatment for severe infantile phase in a pediatric tertiary care
      center.
    explanation: >-
      The GeneReviews Management section frames care as symptomatic, which is the
      accurate description of what is available.
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cautious use of acetaminophen and other agents metabolized by the liver if
      significant liver insufficiency is present.
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid line, which is a management
      instruction rather than a general caution and follows from the hepatic arm.

- name: Haematological Monitoring and Perioperative Planning
  description: >-
    Annual assessment of bleeding and clotting parameters, with haematology input
    before surgery. This is the arm of management that acts on a measurable mechanistic
    readout rather than on symptoms.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Hypoglycosylation of Coagulation Regulators
    treatment_effect: MODULATES
    description: >-
      Surveillance and perioperative correction address the coagulation consequences of
      hypoglycosylation.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      annual assessment of bleeding and clotting parameters by a hematologist including
      prothrombin time, protein C, protein S, antithrombin III, factor IX, and factor XI
    explanation: >-
      The GeneReviews surveillance recommendation naming the specific factors to follow.

- name: GLM101 (Mannose-1-Phosphate Replacement)
  description: >-
    A liposomal mannose-1-phosphate replacement therapy that supplies the metabolite
    immediately downstream of the deficient enzyme, bypassing the block rather than
    correcting it. This is the investigational agent whose mechanism engages the
    pathograph most directly.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Depletion of Mannose-1-Phosphate and GDP-Mannose
    treatment_effect: BYPASSES
    description: >-
      Delivering mannose-1-phosphate directly restores the pool the blocked enzyme
      cannot make, without requiring residual PMM2 activity.
    evidence:
    - reference: clinicaltrials:NCT05549219
      reference_title: >-
        A Phase 2, Randomized, Open-Label, 24-Week Study to Assess the Pharmacodynamics,
        Safety, Tolerability, and Pharmacokinetics of Multiple Doses of GLM101
        Administered Intravenously to Adult, Adolescent, and Pediatric Participants With
        PMM2-CDG
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This is a Phase 2, randomized, open-label, 24-week treatment study to evaluate
        the potential pharmacodynamic (PD) activity, safety, tolerability, and
        pharmacokinetics (PK) of GLM101 in adult, adolescent, and pediatric, patients
        with a confirmed diagnosis of PMM2-CDG.
      explanation: >-
        The registered trial establishing that this agent is under clinical evaluation
        in this disease, with pharmacodynamic activity as a stated endpoint.
  notes: >-
    Reported Phase 2a results and the enrolment status of the Phase 2b POLAR study are
    described in press releases rather than in indexed literature, so they are not
    curated as evidence here; only the registered trial record is cited.

- name: Diazoxide for Hyperinsulinemic Hypoglycemia
  description: >-
    Opens the beta-cell K-ATP channel to suppress inappropriate insulin secretion. It
    treats a specific complication rather than the glycosylation defect, and it is the
    one place where an uncommon manifestation of this disease has a well-defined
    pharmacological answer.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazoxide
      term:
        id: CHEBI:4495
        label: diazoxide
  evidence:
  - reference: PMID:32071842
    reference_title: >-
      Hypoglycemia in CDG patients due to PMM2 mutations: Follow up on hyperinsulinemic
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among these 10 patients, seven were successfully treated with diazoxide.
    explanation: Gives the response rate among the hyperinsulinemic subgroup.
  - reference: PMID:32071842
    reference_title: >-
      Hypoglycemia in CDG patients due to PMM2 mutations: Follow up on hyperinsulinemic
      patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, most patients remained on therapy longer than a year to stay free of
      hypoglycemia.
    explanation: >-
      Records that the benefit is maintenance rather than cure, which is the limit on
      the claim.

- name: AAV9-PMM2 Gene Replacement (preclinical)
  description: >-
    Preclinical gene replacement in the Pmm2 knockout mouse. Curated because it speaks
    directly to this entry's own question about the developmental window: it reverses a
    molecular deficit in the cerebellum of the same model whose conditional knockouts
    locate the PMM2 requirement in development.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Disrupted Cerebellar Development
    treatment_effect: RESTORES
    description: >-
      Restores Neurexin-2 abundance in the cerebellum of the knockout mouse. This is a
      molecular readout, not a behavioural or structural rescue, and the entry does not
      claim more.
    evidence:
    - reference: PMID:40832321
      reference_title: >-
        AAV-based gene replacement reverses Neurexin-2 downregulation in the cerebellum
        of a mouse model of phosphomannomutase 2 deficiency (PMM2-CDG).
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        showed that its reduced abundance can be reversed by AAV9- PMM2 gene treatment
        of the Pmm2 KO mice
      explanation: >-
        Graded PARTIAL deliberately: the reversal demonstrated is of a single protein's
        abundance in a mouse, not of the cerebellar phenotype and not in humans.
  notes: >-
    Preclinical only. No human trial of gene replacement in PMM2-CDG is cited here.

- name: Oral Mannose Supplementation
  description: >-
    Attempts to raise flux into the pathway upstream of the block. Corrects
    hypoglycosylation in patient fibroblasts but has not translated: short-term trials
    were largely unsuccessful. Curated because a negative result about an intuitively
    obvious therapy is worth recording.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: D-mannose
      term:
        id: CHEBI:16024
        label: D-mannose
  evidence:
  - reference: PMID:39236565
    reference_title: 'Treatment of congenital disorders of glycosylation: An overview.'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Mostly, we are only able to manage the disease symptoms rather than to address
      the underlying cause.
    explanation: >-
      A review statement of the field's overall position, cited for the general absence
      of an established disease-modifying therapy rather than for mannose specifically.
  notes: >-
    The specific mannose trial results summarized in the research report are published
    in sources not fetched here, so this treatment carries the field-level statement
    rather than a trial-specific quote. Worth strengthening with the primary
    unsuccessful-mannose report on a future pass.

- name: Epalrestat
  description: >-
    An aldose reductase inhibitor, repurposed from diabetic neuropathy, that raises
    residual PMM enzyme activity rather than supplying a downstream metabolite. It is
    the one investigational agent here that acts on the deficient enzyme step itself,
    and it is in placebo-controlled paediatric trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: epalrestat
      term:
        id: CHEBI:31539
        label: epalrestat
  target_mechanisms:
  - target: Reduced Phosphomannomutase 2 Activity
    treatment_effect: MODULATES
    description: >-
      Raises the activity of the residual enzyme rather than bypassing it, so the
      benefit is expected to depend on there being hypomorphic activity left to raise.
    evidence:
    - reference: PMID:35562242
      reference_title: Nutrition interventions in congenital disorders of glycosylation.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        epalrestat (an aldose reductase enzyme inhibitor) has been reported to improve
        PMM enzyme activity levels and shown to increase protein glycosylation by
        glycoproteomic studies
      explanation: >-
        States the mechanism by which the drug acts on the enzyme-activity node. Graded
        OTHER because the cited sentence is a review's summary of other work rather
        than a primary result of this paper.
  evidence:
  - reference: clinicaltrials:NCT04925960
    reference_title: >-
      A Prospective, Randomized, Double-Blind, Placebo-Controlled, Single-Center Study
      of Oral Epalrestat Therapy in Pediatric Subjects With Phosphomannomutase
      2-congenital Disorder of Glycosylation (PMM2-CDG)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      designed to assess the safety, tolerability, and clinical and metabolic
      improvement of pediatric subjects with PMM2-CDG on oral epalrestat therapy vs.
      placebo
    explanation: The registered controlled trial of this agent in this disease.
  notes: >-
    Epalrestat is also in trial for SORD-related Charcot-Marie-Tooth disease
    (NCT05777226), where it works by lowering sorbitol rather than by raising PMM
    activity. That trial is a different disease and is deliberately not cited here.

clinical_trials:
- name: NCT05549219
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Randomized, open-label, 24-week study of intravenous GLM101 at 10, 20 and 30 mg/kg
    in adult, adolescent and pediatric patients with confirmed PMM2-CDG.
  evidence:
  - reference: clinicaltrials:NCT05549219
    reference_title: >-
      A Phase 2, Randomized, Open-Label, 24-Week Study to Assess the Pharmacodynamics,
      Safety, Tolerability, and Pharmacokinetics of Multiple Doses of GLM101
      Administered Intravenously to Adult, Adolescent, and Pediatric Participants With
      PMM2-CDG
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The planned doses of GLM101 to be investigated are 10, 20, and 30 mg/kg.
    explanation: Records the dose range under evaluation in the registered protocol.

- name: NCT04925960
  phase: PHASE_III
  status: UNKNOWN
  description: >-
    Randomized, double-blind, placebo-controlled single-center study of oral epalrestat
    in pediatric PMM2-CDG, with safety, tolerability and clinical and metabolic
    improvement as endpoints.
  evidence:
  - reference: clinicaltrials:NCT04925960
    reference_title: >-
      A Prospective, Randomized, Double-Blind, Placebo-Controlled, Single-Center Study
      of Oral Epalrestat Therapy in Pediatric Subjects With Phosphomannomutase
      2-congenital Disorder of Glycosylation (PMM2-CDG)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is a prospective, single-center, randomized, double-blind, placebo-controlled
      study designed to assess the safety, tolerability, and clinical and metabolic
      improvement of pediatric subjects with PMM2-CDG on oral epalrestat therapy vs.
      placebo.
    explanation: The registered protocol record for this trial.
  - reference: PMID:40501776
    reference_title: >-
      Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      aldose reductase inhibitors are in development as novel therapeutics for
      PMM2-CDG, including a recent phase III clinical trial of epalrestat (NCT04925960)
    explanation: >-
      Source for the Phase III designation, which the registry record itself does not
      state. Graded OTHER because the sentence is contextual framing rather than a
      result of the mouse study it appears in.
  notes: >-
    The registry record does not state a recruitment status, so status is UNKNOWN
    rather than inferred.

animal_models:
- name: Nestin-Cre embryonic neural precursor Pmm2 knockout mouse (eKO)
  species: Mouse
  genotype: Pmm2 R137H/flox with Nestin-Cre
  publication: PMID:40501776
  description: >-
    Pairs a catalytically inactive knock-in allele with a conditional null to reproduce
    the compound-heterozygous state while avoiding the embryonic lethality of a whole-body
    knockout.
  modeled_mechanisms:
  - target: Disrupted Cerebellar Development
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Deleting Pmm2 in embryonic neural precursors reproduces cerebellar hypoplasia,
      ataxia and seizures, and the glycoproteomic changes are corroborated in human
      post-mortem cerebellar tissue.
    limitations: >-
      Early lethality limits study to the first weeks of life, and Nestin-Cre has
      ectopic renal expression, so the renal cysts in this model cannot be attributed
      to the cerebellar mechanism.
    readouts:
    - name: Cerebellar hypoplasia and ataxic gait
      target: Disrupted Cerebellar Development
      direction: DECREASED
      interpretation: Structural and behavioural correlate of the human cerebellar lesion.
      evidence:
      - reference: PMID:40501776
        reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          removal of PMM2 from embryonic neural precursor cells leads to cerebellar
          hypoplasia, ataxia, seizures, and early lethality
        explanation: Reports the phenotype produced by precursor-stage deletion.
    evidence:
    - reference: PMID:40501776
      reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        glycoproteomic alterations identified in our mouse model are corroborated in
        PMM2-CDG patient post-mortem cerebellar tissue
      explanation: >-
        Cross-validation against human tissue is what justifies treating this model as
        informative for the human node.

- name: Post-mitotic neuronal and astrocyte Pmm2 knockout mouse (nKO, aKO)
  species: Mouse
  genotype: Pmm2 R137H/flox with Snap25-Cre or Gfap-Cre
  publication: PMID:40501776
  description: >-
    Deletes Pmm2 after neurons and astrocytes are post-mitotic, testing whether ongoing
    glycosylation in mature cells is what the disease requires.
  modeled_mechanisms:
  - target: Disrupted Cerebellar Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Removing PMM2 from mature neurons or astrocytes produces no detectable phenotype.
      This is a substantive negative result: it locates the requirement for PMM2 in
      development rather than in maintenance, and is the comparison that makes the
      embryonic-precursor model interpretable.
    limitations: >-
      A negative result in a conditional model cannot exclude a smaller maintenance
      requirement below the sensitivity of the assays used, and bulk-lysate enzyme
      assays still detect activity from non-recombined cells.
    evidence:
    - reference: PMID:40501776
      reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice with post-mitotic loss of PMM2 from neurons or astrocytes are
        indistinguishable from unaffected littermates, including in a broad battery of
        neurological assessments.
      explanation: >-
        States the negative result directly, including the breadth of testing behind
        it.

- name: pmm2 morpholino zebrafish
  species: Zebrafish
  genotype: pmm2 morpholino knockdown
  publication: PMID:22956764
  description: >-
    The model in which the substrate-accumulation mechanism was identified.
  modeled_mechanisms:
  - target: Truncated Lipid-Linked Oligosaccharide Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces reduced global N-glycosylation and reduced LLO levels, and allowed the
      M6P-accumulation route to be separated from precursor depletion by epistasis with
      mannose phosphate isomerase.
    limitations: >-
      Morpholino knockdown is transient and not allele-specific, so it models loss of
      Pmm2 rather than the hypomorphic compound-heterozygous state patients carry.
    evidence:
    - reference: PMID:22956764
      reference_title: "A zebrafish model of PMM2-CDG reveals altered neurogenesis and a substrate-accumulation mechanism for N-linked glycosylation deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Suppression of the M6P-synthesizing enzyme mannose phosphate isomerase within
        the pmm2 background normalized M6P levels and certain aspects of the
        craniofacial phenotype and abrogated pmm2-dependent LLO cleavage.
      explanation: >-
        The epistasis experiment that establishes M6P accumulation as causal rather
        than incidental.

discussions:
- discussion_id: pmm2_two_routes_to_underglycosylation
  kind: INTERPRETATION
  prompt: >-
    Does underglycosylation in PMM2-CDG follow from precursor depletion, from substrate
    accumulation, or from both?
  attaches_to:
  - pathophysiology#Truncated Lipid-Linked Oligosaccharide Synthesis
  rationale: >-
    The textbook account is depletion of mannose-1-phosphate and GDP-mannose. The
    zebrafish study could not measure either metabolite reliably, but did find that
    accumulated mannose-6-phosphate promotes cleavage of the lipid-linked
    oligosaccharide, and that suppressing M6P synthesis abolished the cleavage. Both
    routes converge on the same node and are not mutually exclusive; the entry models
    them as separate hypothesis groups so a future measurement can support one without
    silently retiring the other.

- discussion_id: pmm2_developmental_window
  kind: KNOWLEDGE_GAP
  prompt: >-
    If the cerebellar lesion is established during development, what can any therapy
    started after birth be expected to achieve for it?
  attaches_to:
  - pathophysiology#Disrupted Cerebellar Development
  rationale: >-
    The conditional mouse work locates the requirement for PMM2 in embryonic neural
    precursors and finds no phenotype when the enzyme is removed from mature neurons.
    If that transfers to humans, the structural cerebellar deficit is fixed before
    presentation, and post-natal therapy would be expected to act on the non-cerebellar
    arms of the disease rather than to reverse the hypoplasia.

    There is now a partial answer pointing the other way, which is why this is a gap
    rather than a settled limit: AAV9-PMM2 gene treatment of the Pmm2 knockout mouse
    reverses the cerebellar downregulation of Neurexin-2. That is a molecular readout in
    one protein, not a structural or behavioural rescue, so it establishes that some
    cerebellar molecular phenotype remains addressable after the developmental window
    without establishing that the hypoplasia itself is. What would settle it is a
    structural and functional endpoint after post-natal intervention in the same model.

notes: >-
  Scope and naming. This entry covers the PMM2 complementation group as a whole. The
  KB already curates thirteen other CDG entries and a Congenital_Disorders_of_Glycosylation
  grouping that does not yet list PMM2-CDG; adding this entry to that grouping's members
  is a reasonable follow-up.

  MONDO identifier. The deep-research report proposed MONDO:0015286 for this entry. That
  term is the generic "congenital disorder of glycosylation" parent and would have bound
  the entry to the whole category. The correct term is MONDO:0008907, which the stub
  already carried and whose OMIM cross-reference (212065) matches the report's own.

  Ontology corrections. Five of the twenty-seven CURIEs suggested by the research report
  were wrong and were replaced after checking each against the ontology: GO:0097502
  (mannosylation) and CL:0000643 (offered as cerebellar granule cell) are both obsolete;
  HP:0009026, offered as abnormal subcutaneous fat distribution, is Hypoplasia of
  latissimus dorsi muscle; HP:0001636, offered as pericardial effusion, is Tetralogy of
  Fallot; and HP:0001700, offered as hypertrophic cardiomyopathy, is Myocardial necrosis.
  The replacements used are GO:0006487, CL:0001031, HP:0007552, HP:0001698 and HP:0001639
  respectively, though the last two are not yet curated as phenotypes here because the
  sources consulted describe them only as subset findings without a frequency.

  GeneReviews mining. PMID:20301289 is tagged and is now mined across all four
  sections. The first version of this entry consumed Clinical Characteristics,
  Management and Genetic Counseling but not Diagnosis/Testing, while the history record
  for that session asserted all four. Review caught it. The diagnostic tiering and the
  agents-to-avoid line are curated now, and the over-claim is recorded here rather than
  quietly corrected - the same failure was caught on a previous entry in this
  repository and repeating it is worth stating.

  Evidence grading. Several quotes are taken from the mouse-model and zebrafish papers
  but state human epidemiology or human clinical features in their background sections.
  Those are graded OTHER rather than MODEL_ORGANISM, because evidence_source classifies
  what the quoted sentence reports, not which paper it sits in.

pathophysiology:
- name: Biallelic PMM2 Hypomorphic Variants
  biological_scale: MOLECULAR
  description: >-
    Two hypomorphic PMM2 alleles. Complete loss of PMM2 is embryonic lethal, so every
    surviving patient retains partial activity from at least one allele; this is a
    constraint on the genotype space rather than an incidental observation.
  evidence:
  - reference: PMID:40501776
    reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To overcome embryonic lethality caused by whole body knock-out of Pmm2 and mimic
      patient-related compound heterozygous pathogenic variants
    explanation: >-
      States the null-lethality constraint that forces every viable genotype to retain
      residual activity.
  downstream:
  - target: Reduced Phosphomannomutase 2 Activity
    causal_link_type: DIRECT
    description: The variants reduce catalytic activity of the encoded enzyme.

- name: Reduced Phosphomannomutase 2 Activity
  biological_scale: MOLECULAR
  description: >-
    Cytosolic phosphomannomutase activity falls below the level needed to sustain flux
    from mannose-6-phosphate to mannose-1-phosphate.
  molecular_functions:
  - preferred_term: phosphomannomutase activity
    modifier: DECREASED
    term:
      id: GO:0004615
      label: phosphomannomutase activity
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  evidence:
  - reference: PMID:22956764
    reference_title: "A zebrafish model of PMM2-CDG reveals altered neurogenesis and a substrate-accumulation mechanism for N-linked glycosylation deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital disorder of glycosylation (PMM2-CDG) results from mutations in pmm2,
      which encodes the phosphomannomutase (Pmm) that converts mannose-6-phosphate
      (M6P) to mannose-1-phosphate (M1P).
    explanation: >-
      Background statement of the human enzymatic step, cited for the reaction rather
      than for the zebrafish result.
  downstream:
  - target: Depletion of Mannose-1-Phosphate and GDP-Mannose
    causal_link_type: DIRECT
    description: Loss of the forward reaction depletes the downstream sugar-nucleotide pool.
  - target: Mannose-6-Phosphate Accumulation
    causal_link_type: DIRECT
    description: >-
      Substrate upstream of the blocked step accumulates. Modeled as its own node
      because it turns out to do work of its own rather than being an inert marker.

- name: Mannose-6-Phosphate Accumulation
  biological_scale: MOLECULAR
  description: >-
    Substrate accumulation upstream of the enzymatic block. In the zebrafish model this
    is not merely a marker of the block: raised M6P promotes cleavage of the
    lipid-linked oligosaccharide, so accumulation contributes actively to
    underglycosylation alongside precursor depletion.
  evidence:
  - reference: PMID:22956764
    reference_title: "A zebrafish model of PMM2-CDG reveals altered neurogenesis and a substrate-accumulation mechanism for N-linked glycosylation deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pmm2 depletion unexpectedly caused accumulation of M6P, shown earlier to promote
      LLO cleavage in vitro.
    explanation: >-
      Establishes the accumulation and its proposed effect on the oligosaccharide
      donor.
  downstream:
  - target: Truncated Lipid-Linked Oligosaccharide Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - pmm2_substrate_accumulation
    description: >-
      Raised M6P promotes LLO cleavage, reducing the available donor independently of
      precursor supply.

- name: Depletion of Mannose-1-Phosphate and GDP-Mannose
  biological_scale: MOLECULAR
  description: >-
    The mannose-1-phosphate pool and the GDP-mannose and dolichol-phosphate-mannose
    derived from it fall, limiting the sugar donors for oligosaccharide assembly.
  biological_processes:
  - preferred_term: GDP-mannose biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0009298
      label: GDP-mannose biosynthetic process
  evidence:
  - reference: PMID:22956764
    reference_title: "A zebrafish model of PMM2-CDG reveals altered neurogenesis and a substrate-accumulation mechanism for N-linked glycosylation deficiency."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although M1P and GDP-mannose were below reliable detection/quantification limits
    explanation: >-
      Graded PARTIAL deliberately: the depletion is the long-standing proposed
      mechanism, but this study reports it was not directly measurable, which is the
      honest state of the evidence.
  downstream:
  - target: Truncated Lipid-Linked Oligosaccharide Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - pmm2_precursor_depletion
    description: Reduced donor supply limits assembly of the full oligosaccharide.

- name: Truncated Lipid-Linked Oligosaccharide Synthesis
  biological_scale: MOLECULAR
  description: >-
    Assembly of the dolichol-linked Glc3Man9GlcNAc2 precursor in the endoplasmic
    reticulum is incomplete, so the oligosaccharyltransferase complex has less
    full-length donor to transfer onto nascent glycoproteins.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:22956764
    reference_title: "A zebrafish model of PMM2-CDG reveals altered neurogenesis and a substrate-accumulation mechanism for N-linked glycosylation deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Significantly, global N-linked glycosylation and LLO levels were reduced in pmm2
      morphants.
    explanation: Directly measures the reduction in the oligosaccharide donor.
  downstream:
  - target: Global Protein N-Hypoglycosylation
    causal_link_type: DIRECT
    description: Less donor means fewer occupied sequons on nascent glycoproteins.

- name: Global Protein N-Hypoglycosylation
  biological_scale: CELLULAR
  description: >-
    Occupancy of Asn-X-Ser/Thr sequons falls across the secreted and membrane
    glycoproteome. Because the defect is at the shared donor rather than at one
    transferase, the consequence is global, which is why a single enzyme deficiency
    produces a multisystem disease.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PMM2-CDG, the most common of a group of disorders of abnormal glycosylation of
      N-linked oligosaccharides
    explanation: Places the disease at the level of N-linked glycosylation as a whole.
  downstream:
  - target: Disrupted Cerebellar Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The developing cerebellum is disproportionately dependent on intact
      N-glycosylation; the glycoproteins that mediate this are not fully identified.
  - target: Hypoglycosylation of Coagulation Regulators
    causal_link_type: DIRECT
    description: >-
      Antithrombin, protein C, protein S and factors IX and XI are themselves
      N-glycoproteins.
  - target: Hepatic Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hepatocyte dysfunction with transaminase elevation and fibrosis.

- name: Disrupted Cerebellar Development
  biological_scale: TISSUE
  description: >-
    Cerebellar hypoplasia is established during development rather than accrued by
    later degeneration. Conditional mouse work localizes the requirement to embryonic
    neural precursors: deleting Pmm2 from post-mitotic neurons or astrocytes produces
    no phenotype, while deleting it from precursors reproduces the hypoplasia.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  biological_processes:
  - preferred_term: cerebellar granule cell differentiation
    modifier: DECREASED
    term:
      id: GO:0021707
      label: cerebellar granule cell differentiation
  evidence:
  - reference: PMID:40501776
    reference_title: "Novel mouse model reveals neurodevelopmental origin of PMM2-CDG brain pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings highlight the heightened dependency of the developing cerebellum
      on intact N-glycosylation, aligning with clinical observations in PMM2-CDG
      patients.
    explanation: >-
      States the developmental dependency that makes the cerebellum the most affected
      structure.
  downstream:
  - target: Ataxia and Developmental Impairment
    causal_link_type: DIRECT
    description: The structural deficit produces the dominant neurological phenotype.

- name: Hypoglycosylation of Coagulation Regulators
  biological_scale: ORGANISM
  description: >-
    Anticoagulant and procoagulant glycoproteins are simultaneously underglycosylated
    and lose activity, so the same patient can carry both bleeding and thrombotic risk.
    Antithrombin is the most consistently affected.
  evidence:
  - reference: PMID:37224763
    reference_title: "Coagulation abnormalities in a prospective cohort of 50 patients with PMM2-congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prothrombotic and antithrombotic factor activities were frequently abnormal in
      PMM2-CDG patients, including AT, PC, PT, INR, and FXI.
    explanation: >-
      Documents that both arms of the coagulation system are affected together, which
      is what makes the coagulopathy mixed rather than one-directional.

- name: Hepatic Involvement
  biological_scale: TISSUE
  description: >-
    Hepatocyte dysfunction with transaminase elevation, hepatomegaly and, in some
    patients, fibrosis.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cerebellar hypoplasia, and hepatopathy in infancy followed by neuropathy and
      retinitis pigmentosa in the first or second decade
    explanation: Places hepatopathy in the infantile course alongside the cerebellar lesion.

- name: Ataxia and Developmental Impairment
  biological_scale: ORGANISM
  description: >-
    The dominant clinical consequence: hypotonia and delay in infancy, then ataxia with
    intellectual disability that plateaus rather than progressing relentlessly.
  evidence:
  - reference: PMID:20301289
    reference_title: "PMM2-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is characterized by hypotonia, ataxia, severely delayed language and motor
      development, inability to walk, and IQ of 40 to 70
    explanation: Describes the childhood ataxia-intellectual disability stage.

mechanistic_hypotheses:
- hypothesis_group_id: pmm2_precursor_depletion
  hypothesis_label: Precursor depletion limits oligosaccharide assembly
  status: CANONICAL
  description: >-
    The long-standing account: reduced PMM2 activity depletes mannose-1-phosphate and
    hence GDP-mannose, starving assembly of the lipid-linked oligosaccharide.
- hypothesis_group_id: pmm2_substrate_accumulation
  hypothesis_label: Substrate accumulation promotes oligosaccharide cleavage
  status: EMERGING
  description: >-
    A complementary account from the zebrafish model: accumulated mannose-6-phosphate
    promotes cleavage of the lipid-linked oligosaccharide, reducing donor availability
    by a route independent of precursor supply. Suppressing mannose phosphate isomerase
    normalized M6P and abolished the cleavage, which is the experiment that
    distinguishes the two. The two are not exclusive and both may operate.


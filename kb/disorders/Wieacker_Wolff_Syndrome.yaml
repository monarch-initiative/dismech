references:
- reference: ORPHA:3454
  title: Wieacker-Wolff syndrome
  findings:
  - statement: >-
      For the classic MONDO:0010758 subtype, Orphanet provides the structured
      disease definition, X-linked recessive inheritance, neonatal onset,
      ultra-rare prevalence, ZC4H2 gene association, phenotype frequencies, and
      cross-references.
    supporting_text: "ZC4H2 | zinc finger C4H2-type containing | hgnc:24931 | Disease-causing germline mutation(s) in"
- reference: ORPHA:85283
  title: X-linked intellectual disability, Miles-Carpenter type
  findings:
  - statement: >-
      Orphanet provides a sparse legacy record for the Miles-Carpenter synonym
      aggregated under the classic MONDO:0010758 child of the Wieacker-Wolff
      syndrome spectrum.
    supporting_text: "X-linked intellectual disability, Miles-Carpenter type"
- reference: PMID:23623388
  title: ZC4H2 mutations are associated with arthrogryposis multiplex congenita and intellectual disability through impairment of central and peripheral synaptic plasticity.
  findings:
  - statement: >-
      Human genetic, mouse neuronal, and zebrafish model evidence links ZC4H2
      variants to X-linked AMC plus intellectual disability through synaptic,
      dendritic-spine, and motor-neuron mechanisms.
    supporting_text: "We identified disease-causing mutations in the zinc-finger gene ZC4H2 in four families affected by X-linked AMC plus ID and one family affected by cerebral palsy."
- reference: PMID:35121145
  title: Ophthalmic abnormalities in Wieacker-Wolff syndrome.
  findings:
  - statement: >-
      Ophthalmic review/case evidence supports ptosis, strabismus, and
      oculomotor apraxia as common eye manifestations.
    supporting_text: "Common eye manifestations of the syndrome reported in the literature include ptosis, strabismus, and oculomotor apraxia."
- reference: PMID:34484757
  title: "Wieacker-Wolff syndrome, a distinctive phenotype of arthrogryposis multiplex congenita caused by a \"de novo\" ZC4H2 gene partial deletion."
  findings:
  - statement: >-
      Prenatal case evidence supports ultrasound recognition of arthrogryposis,
      clubfoot, hypo/akinesia, contractures, and ZC4H2-focused molecular
      diagnosis with genetic counseling.
    supporting_text: "Unusual fetal arthrogryposis on ultrasound should draw attention to look for additional lower limb anomalies."
- reference: PMID:31885220
  title: A novel de novo nonsense mutation in ZC4H2 causes Wieacker-Wolff Syndrome.
  findings:
  - statement: >-
      A de novo female case supports nonsense ZC4H2 variants, whole-exome
      diagnosis, truncal hypotonia, scoliosis, rehabilitation, and abnormal
      mutant ZC4H2 trafficking.
    supporting_text: "We identified a heterozygous nonsense mutation in the ZC4H2 gene (c.199C>T, p. R67X) in this patient but not in her father and mother, indicating that the patient has a de novo mutation"
- reference: PMID:29150902
  title: Wieacker-Wolff syndrome with associated cleft palate in a female case.
  findings:
  - statement: >-
      A female case report supports the traditional X-linked recessive clinical
      description and adds cleft palate as a reported manifestation.
    supporting_text: "It is traditionally described in males as an X-linked recessive disorder associated with congenital contractures of the feet, progressive neurologic muscular atrophy, and intellectual delay caused by ZC4H2 mutations."
- reference: PMID:31206972
  title: Deleterious de novo variants of X-linked ZC4H2 in females cause a variable phenotype with neurogenic arthrogryposis multiplex congenita.
  findings:
  - statement: >-
      The study synthesizes reported disease in 48 males and 57 females from 42
      families.
    supporting_text: "We also compared clinical phenotypes with previously published cases of both sexes and provide an overview on 48 males and 57 females from 42 families."
  - statement: >-
      Mostly inherited missense variants predominate in affected males, whereas
      de novo splice, frameshift, nonsense, and partial-gene deletions occur in
      affected females.
    supporting_text: "The spectrum of ZC4H2 defects comprises novel and recurrent mostly inherited missense variants in affected males, and de novo splicing, frameshift, nonsense, and partial ZC4H2 deletions in affected females."
  - statement: >-
      Common findings in both sexes include neurologic, motor, bulbar, and
      genitourinary manifestations such as hypotonia, spasticity, hyperreflexia,
      dysphagia, poor or absent speech, and urinary incontinence.
    supporting_text: >-
      Overall, common clinical features in child- and adulthood in both males
      and females (30% or more positive informative in probands) included
      postnatal growth retardation, generalized hypotonia, motor delay, inability
      to walk, spasticity, hyperreflexia, urinary incontinence,
      dysarthria-deficit in expressive language, poor or absent speech, ID,
      drooling, dysphagia, chewing difficulties including oral motor dysfunction,
      feeding difficulties
- reference: PMID:32630355
  title: Loss of ZC4H2 and RNF220 Inhibits Neural Stem Cell Proliferation and Promotes Neuronal Differentiation.
  findings:
  - statement: >-
      Cultured ZC4H2-null mouse embryonic cortical neural stem cells show
      reduced proliferation and increased neuronal differentiation.
    supporting_text: "We showed that loss of either ZC4H2 or RNF220 inhibits the proliferation and promotes the differentiation abilities of NSCs in vitro."
- reference: PMID:36140726
  title: Loss of Protein Function Causing Severe Phenotypes of Female-Restricted Wieacker Wolff Syndrome due to a Novel Nonsense Mutation in the ZC4H2 Gene.
  findings:
  - statement: >-
      Mutant ZC4H2 produced no detectable protein in transfected 293T cells.
    supporting_text: "RT-qPCR and western blot analysis showed that ZC4H2 protein could not be detected in the 293T cells transfected with MT ZC4H2."
  - statement: ZC4H2 knockdown impaired survival and growth of neural stem cells.
    supporting_text: "These results suggest that ZC4H2 inhibition prevented the survival and growth of NSCs."
  - statement: >-
      ZC4H2 knockdown reduced expression of oxidative-phosphorylation complexes
      I and IV in neural stem cells.
    supporting_text: "Our results also confirmed that the expression of the oxidative phosphorylation complex, especially complex I and complex IV, was significantly down-regulated in the NSCs following lentiviral vector-mediated ZC4H2 knockdown."
  - statement: The connection between the observed pathway changes and clinical phenotypes remains unresolved.
    supporting_text: "The association between changes in pathway regulation and the clinical phenotypes requires further study."
- reference: PMID:36250278
  title: "Expanding allelic and phenotypic spectrum of ZC4H2-related disorder: A novel hypomorphic variant and high prevalence of tethered cord."
  findings:
  - statement: >-
      A seven-patient molecular series identifies tethered cord as a clinically
      important and potentially under-recognized manifestation.
    supporting_text: "Of note, 4/7 patients had a tethered cord that required a surgical repair."
- reference: PMID:39032379
  title: Genotype-Phenotype Correlations and Sex Differences in ZC4H2-Associated Rare Disorder.
  findings:
  - statement: >-
      The natural-history report presents baseline data from 40 participants.
    supporting_text: "In this article, we present data from baseline visits with 40 participants, the largest ZARD cohort studied thus far, focusing on genotype-phenotype correlations and sex differences."
  - statement: >-
      Female participants more often had contractures, arthrogryposis,
      spasticity, and lower-limb atrophy, whereas male participants more often
      had seizures, pain, severe visual impairment, dysphagia for solids, and
      generalized atrophy.
    supporting_text: "Unexpectedly, we found that female participants were more likely to have contractures at birth, a diagnosis of arthrogryposis multiplex congenita, spasticity on exam, and lower limb muscle atrophy, while males were more likely to experience seizures, intermittent periods of pain, severe vision impairment, dysphagia for solids, and a generalized distribution of muscle atrophy."
  - statement: >-
      Brain MRI showed white-matter abnormalities in 12 participants and global
      atrophy in seven.
    supporting_text: "Of the 40 participants, 37 had brain MRIs performed. The most common brain MRI findings were white matter abnormalities (in 12 participants) and global atrophy (in 7 participants)."
  - statement: >-
      Tethered cord or suggestive spinal imaging was the dominant spine MRI
      finding, with only three of 24 imaged participants lacking those features.
    supporting_text: "Spine MRI was performed for 24/40 participants. The most common finding by far was tethered cord or imaging features suggestive of tethered cord. Only three participants for whom spine MRI was performed did not have tethered cord or imaging findings suggestive of tethered cord."
notes: >-
  This entry is anchored to the MONDO:0025445 spectrum rather than either of its
  two direct MONDO children. ORPHA:3454 describes the classic MONDO:0010758
  X-linked recessive subtype; its prevalence, neonatal-onset, and HPO-frequency
  assertions are not generalized to the female-restricted MONDO:0026762
  subtype. ORPHA:85283 is retained only as a legacy Miles-Carpenter
  synonym/cross-reference of the classic child because its structured cache has
  no separate definition, phenotypes, inheritance, or gene assertion.
review_notes: >-
  Identity and scope rule: pooled ZARD cohorts that include affected males and
  females support spectrum-level claims. Classic Orphanet assertions and other
  inheritance-arm-specific findings remain explicitly qualified to the relevant
  subtype. The local MONDO hierarchy places MONDO:0010758 and MONDO:0026762 as
  sibling children of MONDO:0025445, so neither child is modeled as the root of
  the other.

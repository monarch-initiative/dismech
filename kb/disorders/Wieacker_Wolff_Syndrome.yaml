name: Wieacker-Wolff Syndrome Spectrum
creation_date: "2026-05-08T07:43:05Z"
category: Mendelian
synonyms:
- Wieacker-Wolff syndrome (spectrum)
- WWS
- WRWF
- WRWFXLR
- Wieacker syndrome
- Wieacker-Wolff syndrome, X-linked
- Wieacker-Wolff syndrome, X-linked recessive
- Foot contractures-muscle atrophy-oculomotor apraxia syndrome
- Intellectual disability-developmental delay-contractures syndrome
- Miles-Carpenter syndrome
- X-linked intellectual disability, Miles-Carpenter type
- ZC4H2-associated rare disorders
- ZC4H2-associated disorder
- ZARD
description: >-
  The Wieacker-Wolff syndrome spectrum, also called ZC4H2-associated rare
  disorder (ZARD), is an X-linked neurodevelopmental and neuromuscular disease
  spectrum. It includes classic X-linked recessive Wieacker-Wolff syndrome
  (MONDO:0010758), in which inherited missense variants predominantly affect
  males, and female-restricted X-linked dominant Wieacker-Wolff syndrome
  (MONDO:0026762), which is usually associated with de novo loss-of-function
  variants. Across the spectrum, reported manifestations include congenital
  contractures or arthrogryposis, distal muscle atrophy or weakness, ocular
  movement abnormalities, developmental delay or intellectual disability, and
  variable speech, skeletal, foot, and ophthalmic findings. Experimental work
  implicates synaptic and dendritic-spine regulation, motor-neuron development,
  and neural stem-cell proliferation and differentiation; altered protein
  trafficking has been shown for at least one truncating variant.

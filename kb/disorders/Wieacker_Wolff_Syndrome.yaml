has_subtypes:
- name: Classic XLR WWS
  display_name: Wieacker-Wolff syndrome (classic X-linked recessive; OMIM 314580)
  subtype_term:
    preferred_term: Wieacker-Wolff syndrome
    term:
      id: MONDO:0010758
      label: Wieacker-Wolff syndrome
  description: >-
    The classic MONDO:0010758 arm corresponds to OMIM:314580 and the Orphanet
    Wieacker-Wolff syndrome record. It is the historically described severe
    X-linked recessive neurodevelopmental disorder with congenital contractures
    or arthrogryposis and intellectual disability. Familial disease is reported
    predominantly in males and is commonly associated with inherited missense
    ZC4H2 variants.
  inheritance:
  - name: X-linked recessive inheritance
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
    description: >-
      This inheritance mode applies to the classic MONDO:0010758 arm, not to
      every disorder in the spectrum. Familial disease in affected males is
      usually associated with missense variants inherited from asymptomatic or
      variably affected heterozygous females.
    evidence:
    - reference: ORPHA:3454
      reference_title: Wieacker-Wolff syndrome
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "X-linked recessive"
      explanation: Orphanet records X-linked recessive inheritance for classic Wieacker-Wolff syndrome.
    - reference: PMID:29150902
      reference_title: Wieacker-Wolff syndrome with associated cleft palate in a female case.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is traditionally described in males as an X-linked recessive disorder associated with congenital contractures of the feet, progressive neurologic muscular atrophy, and intellectual delay caused by ZC4H2 mutations."
      explanation: This review/case report summarizes the traditional male X-linked recessive presentation.
  evidence:
  - reference: ORPHA:3454
    reference_title: Wieacker-Wolff syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Intellectual disability-developmental delay-contractures syndrome, formerly known as Wieacker-Wolff syndrome, is a severe X-linked recessive neurodevelopmental disorder characterized by severe contractures (arthrogryposis) and intellectual disability."
    explanation: Orphanet defines the classic X-linked recessive clinical entity.
  - reference: PMID:31206972
    reference_title: Deleterious de novo variants of X-linked ZC4H2 in females cause a variable phenotype with neurogenic arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of ZC4H2 defects comprises novel and recurrent mostly inherited missense variants in affected males, and de novo splicing, frameshift, nonsense, and partial ZC4H2 deletions in affected females."
    explanation: The expanded cohort supports the inherited-missense, male-predominant classic arm while distinguishing it from the de novo female arm.
- name: Female-restricted XLD WWS
  display_name: Wieacker-Wolff syndrome, female-restricted (X-linked dominant; OMIM 301041)
  subtype_term:
    preferred_term: Wieacker-Wolff syndrome, female-restricted
    term:
      id: MONDO:0026762
      label: Wieacker-Wolff syndrome, female-restricted
  description: >-
    The female-restricted MONDO:0026762 arm corresponds to OMIM:301041. It is an
    X-linked dominant presentation usually associated with de novo ZC4H2
    loss-of-function variants in affected females. Severity is variable and its
    clinical features overlap the classic arm, but its ontology identity and
    inheritance are distinct.
  inheritance:
  - name: X-linked dominant inheritance
    inheritance_term:
      preferred_term: X-linked dominant inheritance
      term:
        id: HP:0001423
        label: X-linked dominant inheritance
    description: >-
      This inheritance mode applies to the female-restricted MONDO:0026762 arm.
      Reported affected females commonly have de novo loss-of-function ZC4H2
      variants rather than the inherited missense pattern of the classic arm.
    evidence:
    - reference: PMID:31206972
      reference_title: Deleterious de novo variants of X-linked ZC4H2 in females cause a variable phenotype with neurogenic arthrogryposis multiplex congenita.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "de novo variants in the affected females are predicted to be loss-of function alleles, suggesting ZC4H2 insufficiency as the most likely pathological mechanism leading to an X-linked dominant phenotype."
      explanation: The molecular case series explicitly supports the female-restricted X-linked dominant loss-of-function arm.
  evidence:
  - reference: PMID:31206972
    reference_title: Deleterious de novo variants of X-linked ZC4H2 in females cause a variable phenotype with neurogenic arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of ZC4H2 defects comprises novel and recurrent mostly inherited missense variants in affected males, and de novo splicing, frameshift, nonsense, and partial ZC4H2 deletions in affected females."
    explanation: The expanded cohort supports the de novo loss-of-function variant spectrum in affected females.

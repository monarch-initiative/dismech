genetic:
- name: ZC4H2 pathogenic variants across the spectrum
  gene_term:
    preferred_term: ZC4H2
    term:
      id: hgnc:24931
      label: ZC4H2
  association: X-linked germline ZC4H2 point mutations, rearrangements, deletions, or truncating variants causing the Wieacker-Wolff syndrome spectrum
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported pathogenic variation includes mostly inherited missense variants
    in affected males and de novo missense, splice, frameshift, nonsense, or
    partial-gene deletions in affected females. Functional studies support
    variant-specific loss or altered localization of ZC4H2, dendritic-spine
    effects, motor-neuron developmental defects, and neural stem-cell
    dysregulation.
  evidence:
  - reference: ORPHA:3454
    reference_title: Wieacker-Wolff syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZC4H2 | zinc finger C4H2-type containing | hgnc:24931 | Disease-causing germline mutation(s) in"
    explanation: Orphanet identifies ZC4H2 as the disease-causing germline gene for the classic MONDO:0010758 subtype.
  - reference: PMID:23623388
    reference_title: ZC4H2 mutations are associated with arthrogryposis multiplex congenita and intellectual disability through impairment of central and peripheral synaptic plasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified disease-causing mutations in the zinc-finger gene ZC4H2 in four families affected by X-linked AMC plus ID and one family affected by cerebral palsy."
    explanation: Human family and simplex sequencing directly support ZC4H2 as causal.
  - reference: PMID:31885220
    reference_title: A novel de novo nonsense mutation in ZC4H2 causes Wieacker-Wolff Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a heterozygous nonsense mutation in the ZC4H2 gene (c.199C>T, p. R67X) in this patient but not in her father and mother, indicating that the patient has a de novo mutation"
    explanation: A de novo nonsense ZC4H2 variant supports the simplex female presentation.
  - reference: PMID:31206972
    reference_title: Deleterious de novo variants of X-linked ZC4H2 in females cause a variable phenotype with neurogenic arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The spectrum of ZC4H2 defects comprises novel and recurrent mostly inherited missense variants in affected males, and de novo splicing, frameshift, nonsense, and partial ZC4H2 deletions in affected females."
    explanation: The expanded cohort defines the sex-associated variant spectrum.
mechanistic_hypotheses:
- hypothesis_group_id: neural_stem_cell_dysregulation_model
  hypothesis_label: Neural stem-cell dysregulation model
  status: EMERGING
  description: >-
    Cultured ZC4H2-null mouse neural stem cells and ZC4H2-knockdown neural stem
    cells support a model of reduced precursor
    proliferation, survival, and growth with altered differentiation. One study
    also found reduced expression of oxidative-phosphorylation complexes;
    GO:0006119 is used provisionally as a process-level proxy because respiratory
    flux was not measured. The connection from these cellular findings to
    patient phenotypes remains unproven.
  evidence:
  - reference: PMID:32630355
    reference_title: Loss of ZC4H2 and RNF220 Inhibits Neural Stem Cell Proliferation and Promotes Neuronal Differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed that loss of either ZC4H2 or RNF220 inhibits the proliferation and promotes the differentiation abilities of NSCs in vitro."
    explanation: Cultured knockout mouse neural stem cells directly support altered proliferation and differentiation.
  - reference: PMID:36140726
    reference_title: Loss of Protein Function Causing Severe Phenotypes of Female-Restricted Wieacker Wolff Syndrome due to a Novel Nonsense Mutation in the ZC4H2 Gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that ZC4H2 inhibition prevented the survival and growth of NSCs."
    explanation: ZC4H2 knockdown in cultured neural stem cells directly supports impaired survival and growth.
  - reference: PMID:36140726
    reference_title: Loss of Protein Function Causing Severe Phenotypes of Female-Restricted Wieacker Wolff Syndrome due to a Novel Nonsense Mutation in the ZC4H2 Gene.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Our results also confirmed that the expression of the oxidative phosphorylation complex, especially complex I and complex IV, was significantly down-regulated in the NSCs following lentiviral vector-mediated ZC4H2 knockdown."
    explanation: The study supports reduced oxidative-phosphorylation-complex expression, while the GO:0006119 process annotation remains a provisional proxy rather than a direct flux measurement.
  - reference: PMID:36140726
    reference_title: Loss of Protein Function Causing Severe Phenotypes of Female-Restricted Wieacker Wolff Syndrome due to a Novel Nonsense Mutation in the ZC4H2 Gene.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The association between changes in pathway regulation and the clinical phenotypes requires further study."
    explanation: The human iPSC-derived neural stem-cell study explicitly limits the clinical interpretation of its oxidative-phosphorylation findings.
pathophysiology:
- name: ZC4H2 variant-mediated protein dysfunction
  description: >-
    Germline or de novo ZC4H2 variants, including missense, deletion,
    rearrangement, and truncating alleles, impair ZC4H2 function. Abnormal
    trafficking has been demonstrated for one truncating allele and is not
    assumed to be a universal effect of every pathogenic variant.
  genes:
  - preferred_term: ZC4H2
    term:
      id: hgnc:24931
      label: ZC4H2
  biological_processes:
  - preferred_term: intracellular protein localization
    modifier: ABNORMAL
    term:
      id: GO:0008104
      label: intracellular protein localization
  evidence:
  - reference: PMID:23623388
    reference_title: ZC4H2 mutations are associated with arthrogryposis multiplex congenita and intellectual disability through impairment of central and peripheral synaptic plasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified disease-causing mutations in the zinc-finger gene ZC4H2 in four families affected by X-linked AMC plus ID and one family affected by cerebral palsy."
    explanation: Human genetic evidence places ZC4H2 variants at the proximal mechanism.
  - reference: PMID:31885220
    reference_title: A novel de novo nonsense mutation in ZC4H2 causes Wieacker-Wolff Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results showed that wild-type ZC4H2 had perinuclear and nuclear punctate pattern of EGFP signals in the cells"
    explanation: Cell-expression experiments establish the normal subcellular localization pattern used to interpret mutant trafficking.
  - reference: PMID:31885220
    reference_title: A novel de novo nonsense mutation in ZC4H2 causes Wieacker-Wolff Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "indicating the mutant protein's trafficking was altered."
    explanation: In vitro localization data support abnormal protein trafficking for a truncating WWS variant.
  - reference: PMID:36140726
    reference_title: Loss of Protein Function Causing Severe Phenotypes of Female-Restricted Wieacker Wolff Syndrome due to a Novel Nonsense Mutation in the ZC4H2 Gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RT-qPCR and western blot analysis showed that ZC4H2 protein could not be detected in the 293T cells transfected with MT ZC4H2."
    explanation: A second truncating allele produced undetectable ZC4H2 protein in a heterologous expression system, supporting variant-mediated loss of protein function.
  downstream:
  - target: Impaired synaptic plasticity and dendritic spine regulation
    causal_link_type: DIRECT
    description: >-
      ZC4H2 localizes to excitatory synapses and pathogenic variants alter
      dendritic spine density.
    evidence:
    - reference: PMID:23623388
      reference_title: ZC4H2 mutations are associated with arthrogryposis multiplex congenita and intellectual disability through impairment of central and peripheral synaptic plasticity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In mouse primary hippocampal neurons, transiently produced ZC4H2 localized to the postsynaptic compartment of excitatory synapses, and the altered protein influenced dendritic spine density."
      explanation: Cultured primary mouse neurons directly link altered ZC4H2 to synaptic and dendritic-spine biology.
  - target: Motor neuron developmental dysfunction
    causal_link_type: DIRECT
    description: ZC4H2 disruption impairs motor-neuron development in zebrafish models.
    evidence:
    - reference: PMID:23623388
      reference_title: ZC4H2 mutations are associated with arthrogryposis multiplex congenita and intellectual disability through impairment of central and peripheral synaptic plasticity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In zebrafish, antisense-morpholino-mediated zc4h2 knockdown caused abnormal swimming and impaired α-motoneuron development."
      explanation: Zebrafish knockdown directly supports a motor-neuron developmental mechanism.
  - target: Neural stem-cell proliferation and differentiation dysregulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - neural_stem_cell_dysregulation_model
    description: >-
      In cultured neural stem cells, targeted ZC4H2 knockout or knockdown
      directly reduces proliferation, survival, and growth and alters
      differentiation. DIRECT is limited to the experimental gene-perturbation
      to cellular-readout relationship, not a demonstrated direct path to human
      clinical manifestations.
    evidence:
    - reference: PMID:32630355
      reference_title: Loss of ZC4H2 and RNF220 Inhibits Neural Stem Cell Proliferation and Promotes Neuronal Differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We showed that loss of either ZC4H2 or RNF220 inhibits the proliferation and promotes the differentiation abilities of NSCs in vitro."
      explanation: ZC4H2 knockout directly alters proliferation and differentiation in cultured mouse neural stem cells.
    - reference: PMID:36140726
      reference_title: Loss of Protein Function Causing Severe Phenotypes of Female-Restricted Wieacker Wolff Syndrome due to a Novel Nonsense Mutation in the ZC4H2 Gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that ZC4H2 inhibition prevented the survival and growth of NSCs."
      explanation: ZC4H2 knockdown directly impaired survival and growth in cultured neural stem cells.

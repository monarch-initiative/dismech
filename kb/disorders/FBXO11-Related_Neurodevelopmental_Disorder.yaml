name: FBXO11-Related Neurodevelopmental Disorder
creation_date: "2026-10-31T00:00:00Z"
category: Mendelian
synonyms:
- intellectual developmental disorder with dysmorphic facies and behavioral abnormalities
- IDDFBA
- FBXO11 neurodevelopmental disorder
disease_term:
  preferred_term: FBXO11-related neurodevelopmental disorder
  term:
    id: MONDO:0060760
    label: intellectual developmental disorder with dysmorphic facies and behavioral abnormalities
parents:
- autosomal dominant syndromic intellectual disability
description: >-
  FBXO11-related neurodevelopmental disorder (intellectual developmental disorder
  with dysmorphic facies and behavioral abnormalities, IDDFBA; OMIM 618089) is an
  autosomal dominant condition caused by heterozygous, mostly de novo,
  loss-of-function or missense variants in FBXO11, the substrate-recognition F-box
  subunit of a nuclear SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase. Reduced
  SCF(FBXO11) activity impairs ubiquitin-mediated turnover of its substrates
  (among them BCL6, SNAIL and BLIMP-1) during brain development. The phenotype is
  highly variable, with intellectual disability as the core feature and
  behavioral abnormalities (autistic features, attention problems), hypotonia and
  nonspecific facial dysmorphism as common additional features; microcephaly or
  macrocephaly, seizures, orofacial clefting, obesity and skeletal findings occur
  in a minority. More than 75 affected individuals have been reported.

inheritance:
- name: Autosomal dominant (predominantly de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The great majority of reported cases arise from de novo heterozygous variants
    in FBXO11, but transmission consistent with autosomal dominant inheritance has
    been documented in a family with an inherited variant and affected mother and
    daughters.
  evidence:
  - reference: PMID:30679813
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe 24 individuals with a de novo disease-causing variant in, or partial deletion of, the F-box only protein 11 gene"
    explanation: Establishes de novo heterozygous FBXO11 variants as the usual origin.
  - reference: PMID:32902151
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present the first report of a family showing autosomal dominantly inherited IDDFBA, harboring a novel heterozygous variant in FBXO11"
    explanation: Documents transmission consistent with autosomal dominant inheritance.

genetic:
- name: FBXO11
  gene_term:
    preferred_term: FBXO11
    term:
      id: hgnc:13590
      label: FBXO11
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous de novo loss-of-function (nonsense, frameshift, splice-site,
    partial or whole-gene deletion) and missense variants in FBXO11 cause the
    disorder. FBXO11 encodes the substrate-recognition subunit of an SCF E3
    ubiquitin ligase; loss of function and haploinsufficiency are the proposed
    mechanism, with functional studies suggesting a loss-of-function effect even
    for missense variants.
  evidence:
  - reference: PMID:30057029
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified de novo aberrations comprise two large deletions, ten likely gene disrupting variants, and eight missense variants distributed throughout FBXO11."
    explanation: Describes the de novo mutational spectrum underlying the disorder.
  - reference: PMID:40114442
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of FBXO11, encoding a ubiquitin ligase complex subunit, is associated with a variable neurodevelopmental disorder."
    explanation: States haploinsufficiency as the mechanism of the FBXO11 neurodevelopmental disorder.

pathophysiology:
- name: FBXO11 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo loss-of-function (and loss-of-function missense) variants
    reduce functional FBXO11, the F-box substrate-recognition subunit of a nuclear
    SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase.
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: FBXO11
    term:
      id: hgnc:13590
      label: FBXO11
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    modifier: DECREASED
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  downstream:
  - target: Impaired SCF(FBXO11) Substrate Ubiquitination
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30057029
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "is compatible with loss of function or haploinsufficiency as an underlying mechanism"
      explanation: Reduced FBXO11 dosage impairs the SCF ligase it forms a subunit of.
- name: Impaired SCF(FBXO11) Substrate Ubiquitination
  biological_scale: MOLECULAR
  description: >-
    Reduced SCF(FBXO11) ligase activity impairs ubiquitin-mediated degradation of
    its substrates (reported substrates include BCL6, SNAIL and BLIMP-1),
    perturbing transcriptional and developmental programs in neural cells.
  biological_processes:
  - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0031146
      label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  downstream:
  - target: Impaired Neuronal Proliferation, Differentiation, and Migration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30679813
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FBXO11 is part of the SCF (SKP1-cullin-F-box) complex, a multi-protein E3 ubiquitin-ligase complex catalyzing the ubiquitination of proteins destined for proteasomal degradation."
      explanation: Identifies the SCF(FBXO11) ubiquitin-ligase activity whose loss drives downstream neural effects.
    - reference: PMID:40114442
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RNA sequencing revealed disrupted transcriptional networks related to processes important for neuronal development, such as differentiation, migration, and cell signaling."
      explanation: >-
        Loss of FBXO11 in human iPSC-derived neurons disrupts the transcriptional
        networks controlling neuronal differentiation and migration, linking
        impaired ubiquitination to the neuronal phenotype.
- name: Impaired Neuronal Proliferation, Differentiation, and Migration
  biological_scale: CELLULAR
  description: >-
    In FBXO11-deficient human iPSC-derived neurons and in Drosophila, loss of
    FBXO11 disrupts transcriptional networks governing neuronal differentiation,
    proliferation and migration, with impaired neuronal migration and an abnormal
    proliferation/differentiation balance.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: DECREASED
    term:
      id: GO:0001764
      label: neuron migration
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
  downstream:
  - target: Disrupted Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:40114442
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "loss of FBXO11 leads to neuronal phenotypes such as impaired neuronal migration and abnormal proliferation/differentiation balance in human cultured neurons"
    explanation: Human iPSC-derived neurons lacking FBXO11 show impaired migration and proliferation/differentiation imbalance.
  - reference: PMID:40114442
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "impaired dendritic development and behavior in Drosophila"
    explanation: A Drosophila knockdown model confirms disrupted neuronal development on FBXO11 loss.
- name: Disrupted Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    Dysregulated FBXO11-dependent substrate turnover during corticogenesis
    produces the variable neurodevelopmental phenotype.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES


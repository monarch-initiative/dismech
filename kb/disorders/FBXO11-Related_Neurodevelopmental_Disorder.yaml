description: >-
  FBXO11-related neurodevelopmental disorder (intellectual developmental disorder
  with dysmorphic facies and behavioral abnormalities, IDDFBA; OMIM 618089) is an
  autosomal dominant condition caused by heterozygous, mostly de novo,
  loss-of-function or missense variants in FBXO11, the substrate-recognition F-box
  subunit of a nuclear SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase. Reduced
  SCF(FBXO11) activity impairs ubiquitin-mediated turnover of its substrates
  (among them BCL6, SNAIL and BLIMP-1) during brain development. The phenotype is
  highly variable, with intellectual disability as the core feature and
  behavioral abnormalities (autistic features, attention problems), hypotonia and
  nonspecific facial dysmorphism as common additional features; microcephaly or
  macrocephaly, seizures, orofacial clefting, obesity and skeletal findings occur
  in a minority.


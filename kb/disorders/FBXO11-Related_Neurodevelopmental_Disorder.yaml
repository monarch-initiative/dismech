experimental_models:
- name: FBXO11-deficient human iPSC-derived neurons (CRISPR-Cas9)
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  genes:
  - preferred_term: FBXO11
    term:
      id: hgnc:13590
      label: FBXO11
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  publication: PMID:40114442
  description: >-
    Human induced pluripotent stem cells with CRISPR-Cas9-generated heterozygous
    and compound-heterozygous FBXO11 loss, differentiated to neural progenitors
    and forebrain neurons, used for transcriptomic and cellular phenotyping.
  modeled_mechanisms:
  - target: Impaired Neuronal Proliferation, Differentiation, and Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      FBXO11-deficient human neural progenitors and neurons reproduce the
      impaired neurosphere migration and abnormal proliferation/differentiation
      balance attributed to the disorder.
    limitations: >-
      CRISPR indels in a single control iPSC background model FBXO11 loss of
      function rather than patient missense alleles, and 2D neuronal culture
      lacks the cytoarchitecture of the developing human cortex.
    evidence:
    - reference: PMID:40114442
      reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "loss of FBXO11 leads to neuronal phenotypes such as impaired neuronal migration and abnormal proliferation/differentiation balance in human cultured neurons"
      explanation: Grounds the model-to-mechanism link in the reported human-neuron phenotype.
  evidence:
  - reference: PMID:40114442
    reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "To decipher the neurodevelopmental pathomechanisms associated with loss of FBXO11 function, we generated FBXO11-deficient human induced pluripotent stem cells (hIPSCs) and differentiated them to neural progenitor cells and neurons."
    explanation: Establishes the CRISPR-engineered human iPSC-derived neural progenitor and neuron model.

animal_models:
- name: Drosophila Fbxo11 tissue-specific knockdown
  species: Drosophila melanogaster
  genotype: tissue-specific RNAi knockdown of the FBXO11 ortholog
  publication: PMID:40114442
  description: >-
    A Drosophila model using UAS-GAL4 tissue-specific RNAi knockdown of the
    endogenous Fbxo11 ortholog, used for in vivo transcriptomic, dendritic, and
    behavioral phenotyping.
  modeled_mechanisms:
  - target: Impaired Neuronal Proliferation, Differentiation, and Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Knockdown of the Drosophila FBXO11 ortholog impairs dendritic development
      and behavior, supporting a conserved neurodevelopmental role.
    limitations: >-
      Drosophila neurodevelopment diverges substantially from the human cortex,
      and knockdown is not equivalent to human heterozygous loss of function.
    evidence:
    - reference: PMID:40114442
      reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "impaired dendritic development and behavior in Drosophila"
      explanation: In vivo confirmation of a neurodevelopmental consequence of FBXO11 loss.
  evidence:
  - reference: PMID:40114442
    reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To validate transcriptomic changes and functional consequences of loss of FBXO11 in\u00a0vivo, we utilized D.\u00a0melanogaster as a model system."
    explanation: Establishes the Drosophila Fbxo11 RNAi model used for in vivo validation.

diagnosis:
- name: Whole-exome or multigene next-generation sequencing
  description: >-
    Diagnosis is established molecularly by identifying a heterozygous
    pathogenic or likely pathogenic single-nucleotide or indel variant in FBXO11
    via whole-exome sequencing or multigene neurodevelopmental next-generation
    sequencing panels, because facial and behavioral features are nonspecific
    and frequently recognized only by reverse phenotyping.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32902151
    reference_title: "The first familial case of inherited intellectual developmental disorder with dysmorphic facies and behavioral abnormalities (IDDFBA) with a novel FBXO11 variant."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual developmental disorder with dysmorphic facies and behavioral abnormalities (IDDFBA) caused by germline de novo variants in FBXO11 was recently recognized as a novel intellectual disability (ID) syndrome through reverse phenotyping after whole-exome sequencing (WES)."
    explanation: Documents whole-exome sequencing followed by reverse phenotyping as the primary diagnostic pathway.
  - reference: PMID:30679813
    reference_title: "De novo variants in FBXO11 cause a syndromic form of intellectual disability with behavioral problems and dysmorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two variants were identified by next-generation sequencing, comprising 2 in-frame deletions, 11 missense variants, 1 canonical splice site variant, and 8 nonsense or frameshift variants leading to a truncated protein or degraded transcript."
    explanation: Next-generation sequencing identified 22 of 24 pathogenic FBXO11 variants in the cohort.
- name: Array-comparative genomic hybridization for FBXO11 deletions
  description: >-
    Chromosomal microarray / array-comparative genomic hybridization detects
    partial or whole-gene deletions encompassing FBXO11 that may not be captured
    by sequence-only analysis.
  diagnosis_term:
    preferred_term: array-based comparative genomic hybridization
    term:
      id: NCIT:C198497
      label: Array-based Comparative Genomic Hybridization
  evidence:
  - reference: PMID:30679813
    reference_title: "De novo variants in FBXO11 cause a syndromic form of intellectual disability with behavioral problems and dysmorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining two variants were identified by array-comparative genomic hybridization and consisted of a partial deletion of FBXO11."
    explanation: Array-CGH identified partial FBXO11 deletions in 2 of 24 cohort individuals.

treatments:
- name: Supportive and symptomatic management
  description: >-
    Management is supportive and multidisciplinary: early developmental
    intervention, special education, speech and behavioral therapy, and
    symptomatic treatment of the features present in a given individual (e.g.
    seizures). No disease-modifying therapy is established.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40114442
    reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, the underlying nervous system-related pathomechanisms are poorly understood, and specific therapies are lacking."
    explanation: Confirms the absence of specific disease-modifying therapies in clinical care.
- name: Genetic counseling
  description: >-
    Genetic counseling addresses both the low recurrence risk typical of de novo
    FBXO11 variants (allowing for parental mosaicism) and autosomal dominant
    transmission when a parent is mildly affected.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32902151
    reference_title: "The first familial case of inherited intellectual developmental disorder with dysmorphic facies and behavioral abnormalities (IDDFBA) with a novel FBXO11 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding is expected to increase our understanding of the genotype-phenotype of IDDFBA and to facilitate genetic counseling for the disorder caused by FBXO11."
    explanation: Highlights the clinical role of genetic counseling, especially given documented dominant familial transmission.
- name: Proteasome-activating agents (investigational)
  description: >-
    A preclinical, investigational direction only. In FBXO11-deficient human
    iPSC-derived neurons and in Drosophila, proteasome-activating substances —
    including the long-approved drug verapamil — ameliorated FBXO11-deficiency
    phenotypes, suggesting that boosting proteasomal degradation could compensate
    for reduced SCF(FBXO11) activity. This has not been tested in patients and is
    not an established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
  target_mechanisms:
  - target: Impaired Neuronal Proliferation, Differentiation, and Migration
    treatment_effect: BYPASSES
    description: >-
      Proteasome activation acts downstream of SCF(FBXO11) — boosting substrate
      clearance rather than restoring FBXO11-dependent ubiquitination — and
      rescued the FBXO11-deficiency neuronal phenotype in the model systems.
    evidence:
    - reference: PMID:40114442
      reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "application of three different proteasome-activating substances could alleviate FBXO11-deficiency-associated phenotypes in both human neurons and flies"
      explanation: >-
        Proteasome activators rescued FBXO11-deficiency phenotypes in human
        iPSC-derived neurons (and, confirmatorily, in Drosophila); the single
        source sentence spans both systems and is graded by its primary human
        cell-model result. Investigational, not established in patients.
    - reference: PMID:40114442
      reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "One of these substances is the long-approved drug Verapamil, opening the possibility of drug repurposing in the future."
      explanation: >-
        Identifies verapamil as the repurposing candidate among the
        proteasome-activating substances; a drug-repurposing proposal, not
        established human evidence.


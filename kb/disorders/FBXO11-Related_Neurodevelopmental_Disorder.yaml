experimental_models:
- name: FBXO11-deficient human iPSC-derived neurons (CRISPR-Cas9)
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  publication: PMID:40114442
  description: >-
    Human induced pluripotent stem cells with CRISPR-Cas9-generated FBXO11 loss,
    differentiated to neural progenitors and neurons, used for transcriptomic and
    molecular phenotyping.
  modeled_mechanisms:
  - target: Impaired Neuronal Proliferation, Differentiation, and Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      FBXO11-null human neurons reproduce the impaired migration and abnormal
      proliferation/differentiation balance attributed to the disorder.
    limitations: >-
      A CRISPR knockout in a single control iPSC background models FBXO11 loss but
      not the specific patient variants, and 2D neuronal culture lacks the
      cytoarchitecture of the developing human cortex.
    evidence:
    - reference: PMID:40114442
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "loss of FBXO11 leads to neuronal phenotypes such as impaired neuronal migration and abnormal proliferation/differentiation balance in human cultured neurons"
      explanation: Grounds the model-to-mechanism link in the reported human-neuron phenotype.

animal_models:
- name: Drosophila Fbxo11 tissue-specific knockdown
  species: Drosophila melanogaster
  genotype: tissue-specific RNAi knockdown of the FBXO11 ortholog
  publication: PMID:40114442
  description: >-
    A Drosophila model using tissue-specific knockdown of the FBXO11 ortholog,
    used for in vivo molecular and morphological phenotyping.
  modeled_mechanisms:
  - target: Impaired Neuronal Proliferation, Differentiation, and Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Knockdown of the Drosophila FBXO11 ortholog impairs dendritic development
      and behavior, supporting a conserved neurodevelopmental role.
    limitations: >-
      Drosophila neurodevelopment diverges substantially from the human cortex,
      and knockdown is not equivalent to human heterozygous loss of function.
    evidence:
    - reference: PMID:40114442
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "impaired dendritic development and behavior in Drosophila"
      explanation: In vivo confirmation of a neurodevelopmental consequence of FBXO11 loss.

treatments:
- name: Supportive and symptomatic management
  description: >-
    Management is supportive and multidisciplinary: early developmental
    intervention, special education, speech and behavioral therapy, and
    symptomatic treatment of seizures, feeding problems and orthopedic or
    ophthalmologic findings. No disease-modifying therapy is established.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Proteasome-activating agents (investigational)
  description: >-
    A preclinical, investigational direction only. In FBXO11-deficient human
    iPSC-derived neurons and in Drosophila, proteasome-activating substances —
    including the long-approved drug verapamil — ameliorated FBXO11-deficiency
    phenotypes, suggesting that boosting proteasomal degradation could compensate
    for reduced SCF(FBXO11) activity. This has not been tested in patients and is
    not an established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
  target_mechanisms:
  - target: Impaired SCF(FBXO11) Substrate Ubiquitination
    description: >-
      Proteasome activation is proposed to compensate for reduced
      SCF(FBXO11)-mediated substrate degradation.
    evidence:
    - reference: PMID:40114442
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "One of these substances is the long-approved drug Verapamil, opening the possibility of drug repurposing in the future."
      explanation: >-
        Names verapamil as the repurposing candidate among the
        proteasome-activating substances that rescued FBXO11-deficiency
        phenotypes in this study's model systems; a drug-repurposing proposal,
        not established human evidence.

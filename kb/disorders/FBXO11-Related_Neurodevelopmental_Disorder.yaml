genetic:
- name: FBXO11
  gene_term:
    preferred_term: FBXO11
    term:
      id: hgnc:13590
      label: FBXO11
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous de novo loss-of-function (nonsense, frameshift, splice-site,
    partial or whole-gene deletion) and missense variants in FBXO11 cause the
    disorder. FBXO11 encodes the substrate-recognition subunit of an SCF E3
    ubiquitin ligase; loss of function and haploinsufficiency are the proposed
    mechanism, with functional studies suggesting a loss-of-function effect even
    for missense variants.
  evidence:
  - reference: PMID:30057029
    reference_title: "De Novo Variants in the F-Box Protein FBXO11 in 20 Individuals with a Variable Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified de novo aberrations comprise two large deletions, ten likely gene disrupting variants, and eight missense variants distributed throughout FBXO11."
    explanation: Describes the de novo mutational spectrum underlying the disorder.
  - reference: PMID:40114442
    reference_title: "Proteasomal activation ameliorates neuronal phenotypes linked to FBXO11-deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Haploinsufficiency of FBXO11, encoding a ubiquitin ligase complex subunit, is associated with a variable neurodevelopmental disorder."
    explanation: >-
      The iPSC-model paper's framing sentence restates the established
      haploinsufficiency mechanism of the FBXO11 neurodevelopmental disorder.


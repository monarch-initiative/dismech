- name: Multisystem Ciliopathy Involvement
  conforms_to: "ciliopathy_dysfunction#Multisystem Pleiotropic Ciliopathy Phenotype"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Beyond the defining triad, the shared ciliary lesion produces organ
    involvement that varies by subtype and supplies most of the discriminating
    features: polycystic kidney disease (OFD I), intracerebral cysts, agenesis of
    the corpus callosum and cerebellar vermis hypoplasia with the molar tooth sign
    (OFD III, 6, 14, 16, 17), retinal colobomata (OFD IX) and retinopathy (OFD
    16), tibial dysplasia and short ribs (OFD IV), hypothalamic hamartoma (OFD 6),
    and holoprosencephaly or pituitary anomaly (OFD 21). Intellectual disability
    is present in roughly half of individuals with OFD type I.
  biological_processes:
  - preferred_term: neural retina development
    term:
      id: GO:0003407
      label: neural retina development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20301367

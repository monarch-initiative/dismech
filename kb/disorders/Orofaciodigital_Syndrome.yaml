pathophysiology:
- name: Ciliary and Centriolar Gene Defect
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion in most orofaciodigital subtypes is a germline variant
    in a gene encoding a centriolar, basal-body, transition-zone or
    CPLANE/intraflagellar transport protein. Functional dissection of the OFDS
    gene set resolves it into three ciliary protein modules: the
    KIAA0753-FOPNL-OFD1 complex regulating centriole elongation, the Meckel-Gruber
    transition-zone module (TMEM107, TMEM216, TMEM231, TCTN3), and the CPLANE
    complex required for IFT-A assembly (INTU, CPLANE1, WDPCP, FUZ). Different
    subtypes enter the shared downstream cascade through different modules, which
    is one source of their phenotypic divergence.
  biological_processes:
  - preferred_term: centriole elongation
    term:
      id: GO:0061511
      label: centriole elongation
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: ciliary basal body
    term:
      id: GO:0036064
      label: ciliary basal body
  - preferred_term: ciliary transition zone
    term:
      id: GO:0035869
      label: ciliary transition zone
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional studies revealed the involvement of centriole elongation,
      transition zone and intraflagellar transport defects in OFDS, thus
      characterising three ciliary protein modules: the complex
      KIAA0753-FOPNL-OFD1, a regulator of centriole elongation; the Meckel-Gruber
      syndrome module, a major component of the transition zone; and the CPLANE
      complex necessary for IFT-A assembly.
    explanation: >-
      Directly supports the three-module decomposition of the OFDS gene set that
      this node records.
  - reference: PMID:24997988
    reference_title: The oral-facial-digital syndrome gene C2CD3 encodes a positive regulator of centriole elongation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whereas OFD1 deletion leads to centriole hyperelongation, loss of C2CD3
      results in short centrioles without subdistal and distal appendages
    explanation: >-
      Shows that two OFD genes act antagonistically on centriole length, the
      molecular-scale defect captured by this node. Evidence source is IN_VITRO
      because the centriole measurements were made in cultured cells.
  downstream:
  - target: Impaired Ciliogenesis and Ciliary Compartment Function
    description: >-
      Loss of the centriolar, transition-zone or CPLANE protein prevents assembly
      of a structurally and functionally competent primary cilium.
    evidence:
    - reference: PMID:37384395
      reference_title: Pathogenic RAB34 variants impair primary cilium assembly and cause a novel oral-facial-digital syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        cells expressing mutant RAB34 exhibit a significant defect in cilium
        assembly
      explanation: >-
        Demonstrates directly that an OFD-causing variant in a ciliary gene
        produces defective cilium assembly, which is the edge asserted here.
        Evidence source is IN_VITRO because the assays were in cultured cells.
    - reference: PMID:16311594
      reference_title: Oral-facial-digital type I protein is required for primary cilia formation and left-right axis specification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found failure of left-right axis specification in mutant male embryos,
        and ultrastructural analysis showed a lack of cilia in the embryonic node.
      explanation: >-
        Shows loss of the OFD type I gene abolishes cilia in vivo. Evidence source
        is MODEL_ORGANISM because this is an Ofd1 knockout mouse.
- name: Minor Spliceosome Dysfunction and Ciliary Transcript Depletion
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A second, mechanistically distinct entry route operates in the two most
    recently delineated subtypes. SCNM1 (OFD 19) and ZRSR2 (OFD 21) encode
    components of the minor (U12-type) spliceosome. Loss of function causes
    retention or mis-splicing of the small set of U12-type introns, which are
    enriched in ciliary and basal-body genes, so ciliary transcripts such as
    TMEM107 are depleted without any primary defect in a ciliary protein itself.
    The convergence onto the ciliary phenotype is therefore indirect but
    experimentally demonstrated.
  biological_processes:
  - preferred_term: minor (U12-type) pre-mRNA splicing
    term:
      id: GO:0000398
      label: "mRNA splicing, via spliceosome"
    modifier: ABNORMAL
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:36084634
    reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, expression of TMEM107 and FAM92A encoding primary cilia and basal
      body proteins, respectively, and that of DERL2, ZC3H8, and C17orf75, were
      severely reduced in SCNM1-deficient cells.
    explanation: >-
      Demonstrates depletion of ciliary and basal-body transcripts as the direct
      consequence of minor-spliceosome loss. Evidence source is IN_VITRO because
      the measurements were made in patient fibroblasts and engineered cell lines.
  - reference: PMID:38158857
    reference_title: Differential alternative splicing analysis links variation in ZRSR2 to a novel type of oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient samples showed significant enrichment of minor intron retention.
      Among differentially spliced targets are ciliopathy-related genes, such as
      TMEM107 and CIBAR1.
    explanation: >-
      Independent confirmation in a second minor-spliceosome gene that the
      mis-spliced targets are ciliopathy genes. Evidence source is IN_VITRO
      because the analysis used patient lymphoblastoid and fibroblast lines.
  downstream:
  - target: Impaired Ciliogenesis and Ciliary Compartment Function
    description: >-
      Depletion of correctly spliced ciliary transcripts produces a structurally
      abnormal primary cilium, observed as abnormal cilium elongation in patient
      and knockout cells.
    evidence:
    - reference: PMID:36084634
      reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Primary fibroblasts containing SCNM1 mutations, as well as SCNM1 knockout
        and SCNM1 knockdown RPE-1 cells, were also found with abnormally elongated
        cilia.
      explanation: >-
        Establishes the causal step from minor-spliceosome loss to an abnormal
        primary cilium. Evidence source is IN_VITRO because the cilia were
        measured in cultured patient and engineered cells.
    - reference: PMID:38158857
      reference_title: Differential alternative splicing analysis links variation in ZRSR2 to a novel type of oral-facial-digital syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Primary fibroblasts containing the NM_005089.4:c.1207_1208del ZRSR2
        variant had abnormally elongated cilia, confirming an association between
        defective U12-type intron splicing, OFD and abnormal primary cilia
        formation.
      explanation: >-
        Replicates the same edge for the second minor-spliceosome subtype.
        Evidence source is IN_VITRO because the observation is in patient
        fibroblasts.
- name: Impaired Ciliogenesis and Ciliary Compartment Function
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Both entry routes converge on failure to build, or to correctly
    compartmentalize, the primary cilium: cilia may be absent, short, abnormally
    elongated, or structurally present but unable to gate signaling machinery at
    the transition zone. This is the shared cellular lesion of the orofaciodigital
    syndromes and the node at which they conform to the ciliopathy module. The
    specific module affected biases which downstream tissue is worst hit.
  cell_types:
  - preferred_term: ciliated cell
    term:
      id: CL:0000064
      label: ciliated cell
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: DECREASED
  - preferred_term: protein localization to cilium
    term:

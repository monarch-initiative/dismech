discussions:
- discussion_id: ofds_disease_versus_grouping
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should the orofaciodigital syndromes be modeled as this Disease entry with
    has_subtypes, or as a Grouping over the already-standalone member entries?
  rationale: >-
    The case for a Grouping is real and should not be lost. Two members are
    already independent Disease entries with their own pathographs
    (Orofaciodigital_Syndrome_Type_I, Orofaciodigital_Syndrome_17) and a third
    OFD-spectrum disorder is curated under a non-OFD name
    (Heart_Defect_Tongue_Hamartoma_Polysyndactyly_Syndrome, WDPCP); the project
    convention is that a grouping sits over already-distinct entries. The subtypes
    are heterogeneous in inheritance (X-linked dominant male-lethal, X-linked
    recessive, autosomal recessive) and in ciliary subcompartment, and Bruel et
    al. state that the wide heterogeneity makes the initial classification
    obsolete, proposing a clinical classification restricted to three
    well-delineated subtypes with genotype-based classification for the rest,
    which is closer to a curated union with membership criteria than to a single
    blended graph. The case for the present Disease modeling is that the entry
    also has to carry a shared mechanism (ciliary Hedgehog derangement) that all
    members instantiate, that seventeen of the twenty numbered types have no
    standalone entry to group over, and that the MONDO term itself is a disease
    node with a curated pathophysiology to attach to. This entry takes the Disease
    form (the priority dashboard's CURATE_ROOT_WITH_SUBTYPES recommendation) and
    records the counter-argument here rather than deciding silently. If the
    per-subtype entry count grows, converting to a Grouping with NECESSARY
    criteria over an oral/facial arm, a digital arm and the
    ciliopathy_dysfunction basal-body/transition-zone node would be the natural
    migration.
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A clinical classification restricted to the three frequent/well-delineated
      subtypes could be proposed, and for patients who do not fit one of these
      three main subtypes, a further classification could be based on the
      genotype.
    explanation: >-
      The nosological proposal that motivates the Grouping alternative recorded in
      this discussion.
- discussion_id: ofds_mondo_excludes_type_i
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    MONDO:0015375 does not have MONDO:0010702 (orofaciodigital syndrome I) among
    its descendants, so the eponymous and commonest subtype falls outside the
    MONDO grouping term for its own disease family. Should this be raised
    upstream?
  rationale: >-
    Verified with OAK against the local MONDO build on 2026-08-19: MONDO:0015375
    has nineteen is_a descendants (types II, III, IV, V, 6, VII, VIII, IX, X, XI,
    12, 14, XV, 16, 17, 18, 19, 20, 21) and OFD I is not among them; OFD I's
    asserted parents are MONDO:0002254 syndromic disease, MONDO:0100500 Mendelian
    neurodevelopmental disorder and MONDO:1040039 OFD1-related ciliopathy. Three
    of MONDO:0015375's own annotations contradict the omission: its MeSH-derived
    definition names Type I explicitly, its OMIM cross-reference is the phenotypic
    series OMIMPS:311200 anchored on OFD I, and its Orphanet cross-reference
    (Orphanet:140997) is the OFD group record that includes OFD I. This entry
    therefore lists OFD I as a subtype on clinical and phenotypic-series grounds.
    The remaining action is to report the missing is_a edge to MONDO; it has not
    been filed from this session.
  notes: >-
    Consequence for tooling: any process that builds an OFDS member list from the
    MONDO descendant closure will silently omit the commonest type. Related, but a
    separate observation: OFD XIII (Degner syndrome) has no MONDO term at all.
- discussion_id: ofds_minor_spliceosome_route
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does minor (U12-type) spliceosome dysfunction produce a specifically
    orofaciodigital phenotype rather than a generic multisystem disorder, and is
    ciliary transcript depletion the whole explanation?
  attaches_to:
  - pathophysiology#Minor Spliceosome Dysfunction and Ciliary Transcript Depletion
  rationale: >-
    Two subtypes (OFD 19, SCNM1; OFD 21, ZRSR2) are caused by loss of minor
    spliceosome components rather than of ciliary proteins, and both show
    minor-intron retention, depletion of ciliary transcripts including TMEM107,
    and abnormally elongated primary cilia. What is not established is whether
    ciliary transcript depletion is sufficient to account for the phenotype, or
    whether non-ciliary U12-dependent targets contribute; the SCNM1 study lists
    DERL2, ZC3H8 and C17orf75 among the severely reduced transcripts alongside the
    ciliary ones, and the ZRSR2 phenotype includes holoprosencephaly and pituitary
    anomaly, which are not typical of the ciliary subtypes. Note also that both
    reports describe cilia that are abnormally elongated, whereas several ciliary
    OFD genes give absent or short cilia, so the cellular phenotype is not simply
    a phenocopy. dismech separately curates minor-spliceosome disorders
    (RNU12-related_Minor_Spliceopathy, Roifman-syndrome) with no link to the
    ciliopathy tree; a shared minor-spliceosome module would be the structural
    place to resolve this.
  proposed_experiments:
  - experiment_id: ofds_u12_ciliary_transcript_rescue
    name: Rescue of the ciliary phenotype by restoring individual U12-dependent ciliary transcripts
    description: >-
      In SCNM1- or ZRSR2-deficient patient fibroblasts, re-express the depleted
      ciliary and basal-body transcripts (TMEM107, FAM92A) individually and in
      combination, and measure cilium length and Hedgehog reporter output. Full
      rescue would establish ciliary transcript depletion as sufficient; partial
      rescue would implicate non-ciliary U12 targets.
    evidence:
    - reference: PMID:36084634
      reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Conversely, cilia length and expression of SCNM1-regulated genes were
        restored in SCNM1-deficient fibroblasts following reintroduction of SCNM1
        via retroviral delivery.
      explanation: >-
        Establishes the feasibility precedent for the proposed design: rescue by
        re-expression in the same patient-fibroblast system, read out as cilium
        length, has already been performed for SCNM1 itself. Evidence source is
        IN_VITRO because the rescue was done in cultured fibroblasts.
  evidence:
  - reference: PMID:36084634
    reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, expression of TMEM107 and FAM92A encoding primary cilia and basal
      body proteins, respectively, and that of DERL2, ZC3H8, and C17orf75, were
      severely reduced in SCNM1-deficient cells.
    explanation: >-
      Shows that the depleted transcript set is not confined to ciliary genes,
      which is the open question this discussion records. Evidence source is
      IN_VITRO because the transcriptome comparison used patient fibroblasts and
      engineered cell lines.

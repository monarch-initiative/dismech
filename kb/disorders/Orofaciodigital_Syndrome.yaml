has_subtypes:
- name: OFD I
  display_name: Orofaciodigital syndrome type I (Papillon-Leage-Psaume syndrome)
  description: >-
    X-linked dominant, male-lethal form caused by heterozygous OFD1 variants; the
    most frequent subtype. Oral, facial and digital malformations with polycystic
    kidney disease, corpus callosum agenesis and intracerebral cysts. Curated in
    full in Orofaciodigital_Syndrome_Type_I. Listed here on clinical and
    OMIM-phenotypic-series grounds despite not being a MONDO descendant of the
    grouping term (see notes).
  subtype_term:
    preferred_term: orofaciodigital syndrome I
    term:
      id: MONDO:0010702
      label: orofaciodigital syndrome I
  genes:
  - preferred_term: OFD1
    term:
      id: hgnc:2567
      label: OFD1
  evidence:
  - reference: PMID:11179005
    reference_title: Identification of the gene for oral-facial-digital type I syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we analyzed several transcripts mapping to the region and found mutations in
      OFD1
    explanation: >-
      Original identification of OFD1 as the gene mutated in orofaciodigital
      syndrome type I, which is the gene assignment recorded for this subtype.
- name: OFD II
  display_name: Orofaciodigital syndrome type II (Mohr syndrome)
  description: >-
    Autosomal recessive form with lobulated tongue, midline cleft lip, broad nasal
    tip, conductive hearing loss and polysyndactyly, classically including
    reduplicated hallux. Long molecularly undefined; biallelic INTS13 variants
    were reported in two families with variable OFD type 2.
  subtype_term:
    preferred_term: orofaciodigital syndrome type II
    term:
      id: MONDO:0009642
      label: orofaciodigital syndrome type II
  genes:
  - preferred_term: INTS13
    term:
      id: hgnc:20174
      label: INTS13
  evidence:
  - reference: PMID:36229431
    reference_title: INTS13 variants causing a recessive developmental ciliopathy disrupt assembly of the Integrator complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through homozygosity mapping and exome sequencing of two families with
      variable OFD type 2, we identified distinct germline variants in INTS13
    explanation: >-
      Supplies the gene assignment for OFD type II, which MONDO does not record.
      The authors' own qualifier "variable OFD type 2" is retained rather than
      strengthened.
- name: OFD III
  display_name: Orofaciodigital syndrome type III (Sugarman syndrome)
  description: >-
    Autosomal recessive form distinguished by metronome-like ocular motor apraxia
    in addition to lingual hamartomas and postaxial polydactyly, with cerebellar
    vermis hypoplasia and Dandy-Walker malformation; TMEM231 variants have been
    reported in affected sibs.
  subtype_term:
    preferred_term: orofaciodigital syndrome III
    term:
      id: MONDO:0009793
      label: orofaciodigital syndrome III
  genes:
  - preferred_term: TMEM231
    term:
      id: hgnc:37234
      label: TMEM231
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      related the clinical spectrum of four genes in other ciliopathies (C5orf42,
      TMEM138, TMEM231 and WDPCP) to OFDS
    explanation: >-
      Places TMEM231 within the OFDS gene set. Classified PARTIAL because it
      supports gene-group membership rather than the specific type III
      assignment, which rests on the Franco and Thauvin-Robinet review
      classification.
- name: OFD IV
  display_name: Orofaciodigital syndrome type IV (Mohr-Majewski / Baraitser-Burn syndrome)
  description: >-
    Severe autosomal recessive form combining the orofaciodigital triad with
    tibial dysplasia (the discriminating feature), short ribs, cystic kidneys and
    brain anomalies; caused by biallelic TCTN3 variants and overlapping
    phenotypically with Meckel syndrome.
  subtype_term:
    preferred_term: orofaciodigital syndrome IV
    term:
      id: MONDO:0009794
      label: orofaciodigital syndrome IV
  genes:
  - preferred_term: TCTN3
    term:
      id: hgnc:24519
      label: TCTN3
  evidence:
  - reference: PMID:22883145
    reference_title: TCTN3 mutations cause Mohr-Majewski syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified truncating TCTN3 mutations as the cause of an extreme form of
      OFD associated with bone dysplasia, tibial defect, cystic kidneys, and brain
      anomalies (OFD IV, Mohr-Majewski syndrome)
    explanation: >-
      Establishes both the gene assignment and the discriminating tibial and
      skeletal features of OFD type IV.
- name: OFD V
  display_name: Orofaciodigital syndrome type V (Thurston syndrome)
  description: >-
    Autosomal recessive form reported predominantly in families of Indian origin,
    characterized by median cleft lip with postaxial polydactyly and relatively
    little visceral involvement; biallelic DDX59 variants were identified in two
    consanguineous multiplex families.
  subtype_term:
    preferred_term: orofaciodigital syndrome V
    term:
      id: MONDO:0008267
      label: orofaciodigital syndrome V
  genes:
  - preferred_term: DDX59
    term:
      id: hgnc:25360
      label: DDX59
  evidence:
  - reference: PMID:23972372
    reference_title: Mutations in DDX59 implicate RNA helicase in the pathogenesis of orofaciodigital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing revealed a different homozygous variant in DDX59 in each of
      the two families
    explanation: >-
      Records the DDX59 gene assignment for this subtype in two multiplex
      consanguineous families affected by OFD.
- name: OFD 6
  display_name: Orofaciodigital syndrome type VI (Varadi-Papp syndrome)
  description: >-
    Autosomal recessive form defined by the molar tooth sign plus tongue
    hamartoma/additional frenula, mesoaxial polydactyly and/or hypothalamic
    hamartoma; a Joubert-syndrome-related disorder. CPLANE1 (C5orf42) is the major
    gene, with TMEM216, TMEM107 and OFD1 also reported.
  subtype_term:
    preferred_term: orofaciodigital syndrome type 6
    term:
      id: MONDO:0010176
      label: orofaciodigital syndrome type 6
  genes:
  - preferred_term: CPLANE1
    term:
      id: hgnc:25801
      label: CPLANE1
  - preferred_term: TMEM216
    term:
      id: hgnc:25018
      label: TMEM216
  evidence:
  - reference: PMID:24178751
    reference_title: C5orf42 is the major gene responsible for OFD syndrome type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral-facial-digital syndrome type VI (OFD VI) is a recessive ciliopathy
      defined by two diagnostic criteria: molar tooth sign (MTS) and one or more
      of the following: (1) tongue hamartoma (s) and/or additional frenula and/or
      upper lip notch; (2) mesoaxial polydactyly of one or more hands or feet; (3)
      hypothalamic hamartoma.
    explanation: >-
      Gives the operational diagnostic criteria that separate OFD VI from the
      other subtypes and from pure Joubert syndrome.
  - reference: PMID:24178751
    reference_title: C5orf42 is the major gene responsible for OFD syndrome type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a total of 14 novel mutations in the C5orf42 gene in 9/11
      families with positive OFD VI diagnostic criteria
    explanation: >-
      Supports CPLANE1 (C5orf42) as the major gene for OFD VI.
- name: OFD VII
  display_name: Orofaciodigital syndrome type VII (Whelan syndrome)
  description: >-
    Rare form reported with the orofaciodigital triad accompanied by facial
    asymmetry and hydronephrosis. Molecularly undefined; enumerated here for
    completeness of the numbered series, not curated in depth.
  subtype_term:
    preferred_term: orofaciodigital syndrome VII
    term:
      id: MONDO:0012049
      label: orofaciodigital syndrome VII
- name: OFD VIII
  display_name: Orofaciodigital syndrome type VIII (Edwards syndrome)
  description: >-
    X-linked recessive form affecting males, with the orofaciodigital triad,
    duplicated hallux and radial/tibial defects. Molecularly undefined; enumerated
    here for completeness of the numbered series, not curated in depth.
  subtype_term:
    preferred_term: orofaciodigital syndrome VIII
    term:
      id: MONDO:0010336
      label: orofaciodigital syndrome VIII
- name: OFD IX
  display_name: Orofaciodigital syndrome type IX (Gurrieri syndrome)
  description: >-
    Autosomal recessive form distinguished by retinal colobomata in addition to
    the typical orofaciodigital findings; TBC1D32 and SCLT1 variants have been
    reported in severe cases.
  subtype_term:
    preferred_term: orofaciodigital syndrome IX
    term:
      id: MONDO:0009795
      label: orofaciodigital syndrome IX
  genes:
  - preferred_term: TBC1D32
    term:
      id: hgnc:21485
      label: TBC1D32
  - preferred_term: SCLT1
    term:
      id: hgnc:26406
      label: SCLT1
  evidence:
  - reference: PMID:27141300
    reference_title: Update on oral-facial-digital syndromes (OFDS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      OFD type IX is characterized by retinal colobomata in addition to the
      typical oro-facio-digital findings. It is inherited as an autosomal
      recessive trait.
    explanation: >-
      Records the discriminating retinal feature and inheritance mode of OFD type
      IX. Evidence source is OTHER because this is a narrative review.
- name: OFD X
  display_name: Orofaciodigital syndrome type X (Figuera syndrome)
  description: >-
    Rare form reported with the orofaciodigital triad and radial defects with
    fibular aplasia. Molecularly undefined; enumerated here for completeness of
    the numbered series, not curated in depth.
  subtype_term:
    preferred_term: orofaciodigital syndrome X
    term:
      id: MONDO:0008137
      label: orofaciodigital syndrome X
- name: OFD XI
  display_name: Orofaciodigital syndrome type XI (Gabrielli syndrome)
  description: >-
    Rare form reported with the orofaciodigital triad and vertebral and dental
    anomalies. Molecularly undefined; enumerated here for completeness of the
    numbered series, not curated in depth.
  subtype_term:
    preferred_term: orofaciodigital syndrome XI
    term:
      id: MONDO:0013035
      label: orofaciodigital syndrome XI
- name: OFD 12
  display_name: Orofaciodigital syndrome type XII (Moran-Barroso syndrome)
  description: >-
    Rare form reported with the orofaciodigital triad, cardiac defect and cerebral
    malformation. Molecularly undefined; enumerated here for completeness of the
    numbered series, not curated in depth.
  subtype_term:
    preferred_term: orofaciodigital syndrome type 12
    term:
      id: MONDO:0015421
      label: orofaciodigital syndrome type 12
- name: OFD 14
  display_name: Orofaciodigital syndrome type XIV
  description: >-
    Autosomal recessive form distinguished from the other subtypes by severe
    microcephaly and cerebral malformation including the molar tooth sign; caused
    by biallelic variants in C2CD3, a positive regulator of centriole elongation
    that is antagonized by OFD1.
  subtype_term:
    preferred_term: orofaciodigital syndrome type 14
    term:
      id: MONDO:0014413
      label: orofaciodigital syndrome type 14
  genes:
  - preferred_term: C2CD3
    term:
      id: hgnc:24564
      label: C2CD3
  evidence:
  - reference: PMID:24997988
    reference_title: The oral-facial-digital syndrome gene C2CD3 encodes a positive regulator of centriole elongation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we uncover a new subtype of OFD with severe microcephaly and cerebral
      malformations and identify distinct mutations in two affected families in
      the evolutionarily conserved C2CD3 gene.
    explanation: >-
      Establishes both the gene assignment and the microcephaly and cerebral
      malformation features that delineate this subtype.
- name: OFD XV
  display_name: Orofaciodigital syndrome type XV
  description: >-
    Autosomal recessive form caused by biallelic KIAA0753 variants; KIAA0753 acts
    with FOPNL and OFD1 in the centriole-elongation module and its allelic
    spectrum also includes Joubert syndrome and short-rib skeletal dysplasia.
  subtype_term:
    preferred_term: orofaciodigital syndrome XV
    term:
      id: MONDO:0014932
      label: orofaciodigital syndrome XV
  genes:
  - preferred_term: KIAA0753
    term:
      id: hgnc:29110
      label: KIAA0753
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the KIAA0753 gene have recently been associated with Joubert
      syndrome (JBTS) and orofaciodigital (OFD) syndrome.
    explanation: >-
      Confirms the KIAA0753-OFD association and the allelic overlap with Joubert
      syndrome recorded in this subtype description.
- name: OFD 16
  display_name: Orofaciodigital syndrome type XVI
  description: >-
    Autosomal recessive form caused by biallelic TMEM107 variants; features
    include postaxial polydactyly of the hands and mesoaxial polydactyly of the
    feet, cerebellar vermis hypoplasia with molar tooth sign, retinopathy and
    developmental delay, and tibial dysplasia has been reported.
  subtype_term:
    preferred_term: orofaciodigital syndrome 16
    term:
      id: MONDO:0033045
      label: orofaciodigital syndrome 16
  genes:
  - preferred_term: TMEM107
    term:
      id: hgnc:28128
      label: TMEM107
  evidence:
  - reference: PMID:35361766
    reference_title: Additional findings of tibial dysplasia in a male with orofaciodigital syndrome type XVI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of OFD syndrome type XVI mainly include postaxial
      polydactyly of the hands and feet, vermis hypoplasia, MTS, retinopathy,
      apnea/hyperpnea, and developmental delay
    explanation: >-
      Supplies the clinical delineation of OFD type XVI recorded in this subtype
      description.
- name: OFD 17
  display_name: Orofaciodigital syndrome type XVII
  description: >-
    Autosomal recessive form caused by biallelic INTU variants, a subunit of the
    CPLANE module required for IFT-A assembly. Curated in full in
    Orofaciodigital_Syndrome_17.
  subtype_term:
    preferred_term: orofaciodigital syndrome 17
    term:
      id: MONDO:0033375
      label: orofaciodigital syndrome 17
  genes:
  - preferred_term: INTU
    term:
      id: hgnc:29239
      label: INTU
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified causal variants in five new genes (C2CD3, TMEM107, INTU,
      KIAA0753 and IFT57)
    explanation: >-
      Identifies INTU among the OFD-causing ciliary genes, the assignment recorded
      for this subtype.
- name: OFD 18
  display_name: Orofaciodigital syndrome type XVIII
  description: >-
    Autosomal recessive form caused by biallelic variants in IFT57, a core
    component of the IFT-B intraflagellar transport complex.
  subtype_term:
    preferred_term: orofaciodigital syndrome 18
    term:
      id: MONDO:0054770
      label: orofaciodigital syndrome 18
  genes:
  - preferred_term: IFT57
    term:
      id: hgnc:17367
      label: IFT57
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified causal variants in five new genes (C2CD3, TMEM107, INTU,
      KIAA0753 and IFT57)
    explanation: >-
      Identifies IFT57 among the OFD-causing ciliary genes, the assignment
      recorded for this subtype.
- name: OFD 19
  display_name: Orofaciodigital syndrome type XIX
  description: >-
    Autosomal recessive form caused by biallelic loss-of-function variants in
    SCNM1, a component of the minor (U12) spliceosome. Patient cells show
    defective minor-intron processing, reduced expression of ciliary and basal
    body genes, and abnormally elongated cilia.
  subtype_term:
    preferred_term: orofaciodigital syndrome 19
    term:
      id: MONDO:0859310
      label: orofaciodigital syndrome 19
  genes:
  - preferred_term: SCNM1
    term:
      id: hgnc:23136
      label: SCNM1
  evidence:
  - reference: PMID:36084634
    reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe individuals with OFD from three unrelated families having
      bi-allelic loss-of-function variants in SCNM1 as the cause of their
      condition.
    explanation: >-
      Establishes the SCNM1 gene assignment and biallelic loss-of-function
      mechanism for this subtype.
- name: OFD 20
  display_name: Orofaciodigital syndrome type XX
  description: >-
    Autosomal recessive form caused by biallelic missense variants clustered near
    the RAB34 C-terminus, accompanied by cardiac, cerebral, skeletal and anorectal
    defects. RAB34 acts selectively in the intracellular ciliogenesis pathway.
  subtype_term:
    preferred_term: orofaciodigital syndrome 20
    term:
      id: MONDO:0958230
      label: orofaciodigital syndrome 20
  genes:
  - preferred_term: RAB34
    term:
      id: hgnc:16519
      label: RAB34
  evidence:
  - reference: PMID:37384395
    reference_title: Pathogenic RAB34 variants impair primary cilium assembly and cause a novel oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified by exome sequencing bi-allelic missense variants in a novel
      disease-causing ciliary gene RAB34 in four individuals from three unrelated
      families.
    explanation: >-
      Establishes the RAB34 gene assignment for this most recently delineated
      autosomal recessive subtype.
- name: OFD 21
  display_name: Orofaciodigital syndrome type XXI
  description: >-
    X-linked recessive form caused by ZRSR2 variants affecting the last exon,

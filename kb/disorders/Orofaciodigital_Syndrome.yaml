    evidence_source: HUMAN_CLINICAL
    snippet: >-
      polycystic kidney disease; brain MRI findings (intracerebral cysts, agenesis
      of the corpus callosum, cerebellar agenesis with or without Dandy-Walker
      malformation); and intellectual disability (in approximately 50% of affected
      individuals)
    explanation: >-
      Records the renal, CNS and cognitive involvement that this node describes
      for OFD type I, including the quantified frequency of intellectual
      disability.
  - reference: PMID:27141300
    reference_title: Update on oral-facial-digital syndromes (OFDS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additional signs may involve brain, kidneys and other organs thus better
      defining the different clinical subtypes.
    explanation: >-
      Supports the framing that the extra-triad organ involvement is what
      discriminates the numbered subtypes. Evidence source is OTHER because this
      is a narrative review.

- name: Serially Homologous Autopod Malformation
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The digital arm of the defining triad, expressed across serially homologous
    elements: polydactyly (preaxial, postaxial or the mesoaxial form
    characteristic of OFD VI), syndactyly, brachydactyly, clinodactyly of the
    fifth finger and duplicated hallux, characteristically affecting hands and
    feet together.
  cell_types:

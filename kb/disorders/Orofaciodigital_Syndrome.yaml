      nesting inside it, so the relation is recorded as a related match.
notes: >-
  Scope and subtype-list provenance. The has_subtypes list below enumerates all
  twenty numbered orofaciodigital types that carry a MONDO identifier, each bound
  to a CURIE and canonical label verified with OAK against the local MONDO build
  on 2026-08-19. Depth of curation is deliberately uneven and should not be read
  as a completeness claim: the well-delineated types (I, II, III, IV, V, 6, IX,
  14, XV, 16, 17, 18, 19, 20, 21) carry a gene assignment and, where a quotable
  primary source exists, subtype-level evidence, whereas types VII, VIII, X, XI
  and 12 are enumerated with their MONDO binding and a one-line clinical
  descriptor only, because they remain molecularly undefined. OFD XIII (Degner
  syndrome) is named in the classical series but has no MONDO term and is
  therefore absent from the list entirely.

  Inclusion of OFD type I. OFD type I (MONDO:0010702) is listed here as a subtype
  even though MONDO does not place it under MONDO:0015375: its asserted is_a
  parents are syndromic disease, Mendelian neurodevelopmental disorder and
  OFD1-related ciliopathy, so it is not among the nineteen descendants of the
  grouping term. Building the list from the MONDO descendant closure alone would
  silently omit the eponymous and commonest type. Three independent authorities
  place it inside the group: MONDO:0015375 itself carries the cross-reference
  OMIMPS:311200, an OMIM phenotypic series anchored on OFD type I (OMIM:311200);
  MONDO's own definition text for the grouping names Type I (Papillon-Leage and
  Psaume syndrome, Gorlin-Psaume syndrome) as one of its two members; and
  Orphanet:140997, the other cross-reference, is likewise the OFD group record.
  The omission is judged to be an artifact of MONDO's classification of OFD I
  under the gene-based OFD1-related ciliopathy node, and is worth reporting
  upstream rather than reproducing here. See the ofds_mondo_excludes_type_i
  discussion.

  Relationship to existing entries. Two members are already curated as standalone
  Disease entries (Orofaciodigital_Syndrome_Type_I, Orofaciodigital_Syndrome_17)
  and a third OFD-spectrum disorder is curated under a non-OFD name
  (Heart_Defect_Tongue_Hamartoma_Polysyndactyly_Syndrome, WDPCP, related to OFDS
  by PMID:28289185). This entry is the group-level view and deliberately does not
  restate their pathographs. Whether the group is better modeled as a Grouping
  over those entries is recorded as an open discussion below rather than being
  decided silently.

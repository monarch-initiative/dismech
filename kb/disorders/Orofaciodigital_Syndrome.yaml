      label: protein localization to cilium
    modifier: ABNORMAL
  - preferred_term: intraciliary transport
    term:
      id: GO:0042073
      label: intraciliary transport
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: primary cilium
    term:
      id: GO:0005929
      label: cilium
  evidence:
  - reference: PMID:27141300
    reference_title: Update on oral-facial-digital syndromes (OFDS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A number of genes have already found to be mutated in OFDS and most of the
      encoded proteins are predicted or proven to be involved in primary
      cilia/basal body function.
    explanation: >-
      Supports treating primary cilium and basal body function as the shared
      cellular lesion across the OFDS gene set. Evidence source is OTHER because
      this is a narrative review.
  - reference: PMID:37384395
    reference_title: Pathogenic RAB34 variants impair primary cilium assembly and cause a novel oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in over 20 genes encoding ciliary proteins have been
      found to cause OFDS through deleterious structural or functional impacts on
      primary cilia.
    explanation: >-
      States that the OFDS gene set acts through structural or functional damage
      to primary cilia, which is what this node asserts.
  downstream:
  - target: Dysregulated Hedgehog Signal Transduction and GLI Processing
    description: >-
      Because the primary cilium is the obligate compartment for vertebrate
      Hedgehog signal transduction, a defective cilium or transition zone deranges
      GLI processing and the balance of GLI activator and repressor.
    evidence:
    - reference: PMID:22883145
      reference_title: TCTN3 mutations cause Mohr-Majewski syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we found that TCTN3 is necessary for transduction of the sonic hedgehog
        (SHH) signaling pathway, as revealed by abnormal processing of GLI3 in
        patient cells
      explanation: >-
        Demonstrates in cells from an OFD IV patient that loss of a transition
        zone protein produces abnormal GLI3 processing, which is precisely the
        edge asserted here. Evidence source is IN_VITRO because GLI3 processing
        was assayed in cultured patient cells.
    - reference: PMID:27802276
      reference_title: Craniofacial Ciliopathies Reveal Specific Requirements for GLI Proteins during Development of the Facial Midline.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that loss of intraflagellar transport proteins (KIF3a or IFT88)
        caused aberrant GLI processing such that the amount of GLI3FL and GLI2FL
        was increased, thus skewing the ratio of GLIFL to GLIR in favor of the FL
        isoform.
      explanation: >-
        Independent demonstration that loss of ciliary transport proteins skews
        GLI processing toward the full-length activator. Evidence source is
        MODEL_ORGANISM because the analysis was performed in conditional-knockout
        mice.
  - target: Multisystem Ciliopathy Involvement
    description: >-
      The same ciliary lesion acts in renal tubular epithelium, retina and
      developing CNS, producing the cystic kidney disease, retinal degeneration
      and cerebellar/CNS malformation that distinguish the subtypes.
    evidence:
    - reference: PMID:16311594
      reference_title: Oral-facial-digital type I protein is required for primary cilia formation and left-right axis specification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Formation of cilia was defective in cystic kidneys from heterozygous
        females, implicating ciliogenesis as a mechanism underlying cyst
        development.
      explanation: >-
        Directly implicates defective ciliogenesis in renal cyst formation, the
        organ arm of this edge. Evidence source is MODEL_ORGANISM because the
        kidneys examined were from Ofd1 heterozygous mice.
- name: Dysregulated Hedgehog Signal Transduction and GLI Processing
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Hedgehog pathway components traffic through the ciliary compartment, where
    full-length GLI2 and GLI3 are proteolytically processed into repressor forms.
    A defective cilium perturbs this processing and shifts the activator to
    repressor ratio, so Hedgehog output is not simply reduced but deranged, and
    can be excessive in tissues such as the facial mesenchyme. Because Hedgehog
    patterns both the cranial neural crest derivatives and the limb bud, this
    single signaling lesion generates the oral-facial and the digital arms of the
    phenotype together.
  biological_processes:
  - preferred_term: Hedgehog (smoothened) signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:27802276
    reference_title: Craniofacial Ciliopathies Reveal Specific Requirements for GLI Proteins during Development of the Facial Midline.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings suggest that ciliopathic facial phenotypes are generated via
      loss of both GLI3R and GLI2R and that this pathology occurs via a
      de-repression mechanism.
    explanation: >-
      Identifies loss of GLI repressor forms, that is de-repression rather than
      simple pathway loss, as the mechanism of the ciliopathic facial phenotype.
      Evidence source is MODEL_ORGANISM because the conclusion rests on mouse
      conditional knockouts.
  - reference: PMID:36084634
    reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      functional analysis in SCNM1-retrotransduced fibroblasts showed that SCNM1
      is a positive mediator of Hedgehog (Hh) signaling
    explanation: >-
      Shows that the minor-spliceosome entry route also converges on Hedgehog
      signaling, supporting this node as the shared effector for both routes.
      Evidence source is IN_VITRO because the assay used patient-derived
      fibroblasts.
  downstream:
  - target: Cranial Neural Crest and Facial Midline Patterning Failure
    description: >-
      Deranged Hedgehog activity in cranial neural crest cells and the facial
      prominences alters midline patterning, producing hypertelorism and
      frontonasal dysplasia rather than the hypotelorism of Hedgehog loss.
    evidence:
    - reference: PMID:20106874
      reference_title: A primary cilia-dependent etiology for midline facial disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show that excessive Hedgehog activity, caused by truncating the
        primary cilia on cranial neural crest cells, causes hypertelorism and
        frontonasal dysplasia (FND).
      explanation: >-
        Directly asserts the causal step from cilium-dependent Hedgehog
        dysregulation in cranial neural crest to facial midline malformation.
        Evidence source is MODEL_ORGANISM because the demonstration is in mouse
        conditional knockouts and avian talpid embryos.
  - target: Disrupted Autopod Digit Number and Identity Specification
    description: >-
      The same cilium-dependent Hedgehog derangement acts in the limb bud, where
      it alters the posterior patterning programme that specifies digit number and
      identity.
    evidence:
    - reference: PMID:16311594
      reference_title: Oral-facial-digital type I protein is required for primary cilia formation and left-right axis specification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we found impaired patterning of the neural tube and altered expression of
        the 5' Hoxa and Hoxd genes in the limb buds of mice lacking Ofd1
      explanation: >-
        Shows that loss of the OFD type I gene alters the limb-bud patterning
        programme, the edge asserted here. Evidence source is MODEL_ORGANISM
        because the limb buds examined were from Ofd1 knockout mice.
- name: Cranial Neural Crest and Facial Midline Patterning Failure
  biological_scale: TISSUE
  role: intermediate
  description: >-
    The facial skeleton and the oral soft tissues derive from cranial neural crest
    cells populating the frontonasal and pharyngeal-arch prominences. Ciliary
    Hedgehog derangement in these cells broadens the domains of Hedgehog target
    gene expression and alters neural crest proliferation in the facial
    prominences, so the midline is patterned incorrectly. This is the tissue-level
    step that generates the oral and facial arms of the orofaciodigital triad.
  biological_processes:
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20106874
    reference_title: A primary cilia-dependent etiology for midline facial disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Elimination of the intraflagellar transport protein Kif3a leads to excessive
      Hedgehog responsiveness in facial mesenchyme, which is accompanied by broader
      expression domains of Gli1, Ptc and Shh, and reduced expression domains of
      Gli3.
    explanation: >-
      Documents the molecular signature of ciliary Hedgehog derangement within the
      facial mesenchyme that this tissue-level node describes. Evidence source is
      MODEL_ORGANISM because the analysis is in conditional-knockout mouse
      embryos.
  downstream:
  - target: Oral and Facial Malformation
    description: >-
      Mis-patterning of the facial prominences and their neural crest populations
      yields the clinically observed facial and oral malformations.
    evidence:
    - reference: PMID:20106874
      reference_title: A primary cilia-dependent etiology for midline facial disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, broader domains of Gli1 expression correspond to areas of
        enhanced neural crest cell proliferation in the facial prominences of
        Kif3a conditional knockouts. Avian Talpid embryos that lack primary cilia
        exhibit similar molecular changes and similar facial phenotypes.
      explanation: >-
        Links the neural crest patterning change to the resulting facial phenotype
        in two independent cilium-deficient model systems, which is the edge
        asserted here. Evidence source is MODEL_ORGANISM because the observations
        are in mouse and avian embryos.
- name: Disrupted Autopod Digit Number and Identity Specification
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  biological_scale: TISSUE
  role: intermediate
  description: >-
    Ciliary Hedgehog derangement in the limb bud perturbs the anteroposterior
    patterning gradient that specifies how many digits form and what identity each
    takes. In the orofaciodigital syndromes this typically adds digits, giving
    preaxial, postaxial or mesoaxial polydactyly, and also disturbs phalangeal
    segmentation, giving brachydactyly, syndactyly and clinodactyly. Because the
    autopod patterning programme is serially reused in fore- and hindlimb, the
    lesion is expressed in hands and feet alike.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: limb morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:16311594
    reference_title: Oral-facial-digital type I protein is required for primary cilia formation and left-right axis specification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found impaired patterning of the neural tube and altered expression of
      the 5' Hoxa and Hoxd genes in the limb buds of mice lacking Ofd1
    explanation: >-
      Documents altered posterior HOX expression in the limb bud on loss of an OFD
      gene, the patterning derangement this node records. Evidence source is
      MODEL_ORGANISM because the limb buds are from Ofd1 knockout mice.
  downstream:
  - target: Serially Homologous Autopod Malformation
    description: >-
      The mis-specified autopod programme is expressed in both fore- and hindlimb,
      so a single patterning lesion produces a digit-anomaly bundle across hands
      and feet rather than an isolated defect.
    evidence:
    - reference: PMID:35361766
      reference_title: Additional findings of tibial dysplasia in a male with orofaciodigital syndrome type XVI.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        bilateral postaxial polydactyly of the hands, bilateral mesoaxial
        polydactyly of the feet
      explanation: >-
        A single OFD patient with polydactyly in both hands and both feet, which
        is the serially homologous bundle this edge asserts. Note the digit
        subtype differs between hand and foot in this patient, so the shared
        programme is not producing an identical malformation at each site.
- name: Oral and Facial Malformation
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The oral and facial arms of the defining triad: accessory or hyperplastic

genetic:
- name: OFD1
  notes: >-
    OFD1 encodes a centrosomal and basal-body protein of the KIAA0753-FOPNL-OFD1
    centriole-elongation module. Heterozygous loss-of-function variants cause
    X-linked dominant, male-lethal OFD type I; frameshift variants predominate.
    The same gene has a broader allelic series in males (Joubert syndrome 10,
    primary ciliary dyskinesia, retinitis pigmentosa 23), captured by
    MONDO:1040039.
  gene_term:
    preferred_term: OFD1
    term:
      id: hgnc:2567
      label: OFD1
  relationship_type: CAUSATIVE
  subtype: OFD I
  evidence:
  - reference: PMID:11179005
    reference_title: Identification of the gene for oral-facial-digital type I syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the familial cases revealed a missense mutation, a 19-bp
      deletion, and a single base-pair deletion leading to a frameshift.
    explanation: >-
      Documents the variant spectrum found in OFD1 in familial OFD type I cases.
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent, OFD type I, is caused by a heterozygous mutation in the
      OFD1 gene encoding a centrosomal protein.
    explanation: >-
      Confirms the heterozygous OFD1 mechanism and the centrosomal identity of the
      protein.
- name: C2CD3
  notes: >-
    C2CD3 localizes to the distal end of centrioles, physically associates with
    OFD1, and promotes centriole elongation, an activity OFD1 antagonizes.
    Biallelic variants cause autosomal recessive OFD 14, distinguished by severe
    microcephaly.
  gene_term:
    preferred_term: C2CD3
    term:
      id: hgnc:24564
      label: C2CD3
  relationship_type: CAUSATIVE
  subtype: OFD 14
  evidence:
  - reference: PMID:24997988
    reference_title: The oral-facial-digital syndrome gene C2CD3 encodes a positive regulator of centriole elongation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we propose that C2CD3 directly promotes centriole elongation and that OFD1
      acts as a negative regulator of C2CD3
    explanation: >-
      Establishes the antagonistic relationship between two OFD gene products at
      the centriole. Evidence source is IN_VITRO because the localization and
      length experiments were done in cultured cells.
- name: TCTN3
  notes: >-
    TCTN3 is a transition-zone protein that forms a complex with TCTN1 and TCTN2.
    Biallelic truncating variants cause the severe, autosomal recessive OFD type
    IV (Mohr-Majewski) phenotype and, in other families, overlapping Meckel and
    Joubert phenotypes.
  gene_term:
    preferred_term: TCTN3
    term:
      id: hgnc:24519
      label: TCTN3
  relationship_type: CAUSATIVE
  subtype: OFD IV
  evidence:
  - reference: PMID:22883145
    reference_title: TCTN3 mutations cause Mohr-Majewski syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, our data show the involvement of the transition zone protein TCTN3
      in the regulation of the key SHH signaling pathway and that its disruption
      causes a severe form of ciliopathy, combining features of Meckel and OFD IV
      syndromes.
    explanation: >-
      Establishes TCTN3 as a transition-zone gene whose disruption causes OFD IV
      through Hedgehog dysregulation.
- name: CPLANE1
  notes: >-
    CPLANE1 (formerly C5orf42) is a component of the CPLANE complex required for
    IFT-A assembly and is the major gene for autosomal recessive OFD VI. It is
    allelic with Joubert syndrome 17, and the comparison of CPLANE1-mutated with
    non-mutated OFD VI cases implicates it particularly in limb development.
  gene_term:
    preferred_term: CPLANE1
    term:
      id: hgnc:25801
      label: CPLANE1
  relationship_type: CAUSATIVE
  subtype: OFD 6
  evidence:
  - reference: PMID:24178751
    reference_title: C5orf42 is the major gene responsible for OFD syndrome type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C5orf42 mutations have already been reported in Joubert syndrome confirming
      that OFD VI and JBS are allelic disorders
    explanation: >-
      Documents both the causal role in OFD VI and the allelism with Joubert
      syndrome that this entry records.
- name: INTU
  notes: >-
    INTU is a subunit of the CPLANE (ciliogenesis and planar cell polarity
    effector) module required for IFT-A assembly. Biallelic variants cause
    autosomal recessive OFD 17; the allelic spectrum also includes short-rib
    thoracic dysplasia 20 with polydactyly. Curated in detail in
    Orofaciodigital_Syndrome_17.
  gene_term:
    preferred_term: INTU
    term:
      id: hgnc:29239
      label: INTU
  relationship_type: CAUSATIVE
  subtype: OFD 17
  evidence:
  - reference: PMID:28289185
    reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified causal variants in five new genes (C2CD3, TMEM107, INTU,
      KIAA0753 and IFT57)
    explanation: >-
      Identifies INTU as one of the OFD causal genes recorded in this entry.
- name: SCNM1
  notes: >-
    SCNM1 encodes a component of the human minor (U12-type) spliceosome. Biallelic
    loss-of-function variants cause autosomal recessive OFD 19. This is a
    non-ciliary gene reaching the ciliary phenotype indirectly, through defective
    minor-intron processing of ciliary and basal-body transcripts.
  gene_term:
    preferred_term: SCNM1
    term:
      id: hgnc:23136
      label: SCNM1
  relationship_type: CAUSATIVE
  subtype: OFD 19
  evidence:
  - reference: PMID:36084634
    reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing defects affecting primary cilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that defective U12 intron splicing can lead to a
      typical ciliopathy such as OFD and reveal that primary cilia length and Hh
      signaling are regulated by the minor spliceosome through SCNM1 activity.
    explanation: >-
      Establishes the indirect, minor-spliceosome route to the ciliary phenotype
      recorded for this gene.
- name: ZRSR2
  notes: >-
    ZRSR2, on Xp22.2, encodes a splicing factor of the minor spliceosome. Germline
    variants affecting the last exon cause X-linked recessive OFD 21 in hemizygous
    males, with brain anomalies ranging from alobar holoprosencephaly to pituitary
    anomalies.
  gene_term:
    preferred_term: ZRSR2
    term:
      id: hgnc:23019
      label: ZRSR2
  relationship_type: CAUSATIVE
  subtype: OFD 21
  evidence:
  - reference: PMID:38158857
    reference_title: Differential alternative splicing analysis links variation in ZRSR2 to a novel type of oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZRSR2, located on chromosome Xp22.2, encodes a splicing factor of the minor
      spliceosome complex, which recognizes minor introns, representing 0.35% of
      human introns.
    explanation: >-
      Records the gene's location and minor-spliceosome function, the basis of the
      mechanism assigned to OFD 21.
- name: RAB34
  notes: >-
    RAB34 is a Rab GTPase that mediates ciliary membrane formation specifically in
    cell types using the intracellular ciliogenesis pathway. Biallelic missense
    variants clustered near the C-terminus cause autosomal recessive OFD 20 and
    act through strong loss of function.
  gene_term:
    preferred_term: RAB34
    term:
      id: hgnc:16519
      label: RAB34
  relationship_type: CAUSATIVE
  subtype: OFD 20
  evidence:
  - reference: PMID:37384395
    reference_title: Pathogenic RAB34 variants impair primary cilium assembly and cause a novel oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that the protein products of these pathogenic variants, which are
      clustered near the RAB34 C-terminus, exhibit a strong loss of function.
    explanation: >-
      Establishes the loss-of-function mechanism of the OFD 20 variants. Evidence
      source is IN_VITRO because the functional characterization was in cultured
      cells.
- name: INTS13
  notes: >-
    INTS13 is a subunit of the Integrator complex, which associates with RNA
    polymerase II and cleaves nascent RNA. Biallelic germline variants disrupting
    binding to the Integrator cleavage module were reported in two families with
    variable OFD type 2; depletion disrupts ciliogenesis and dysregulates ciliary
    genes.
  gene_term:
    preferred_term: INTS13
    term:
      id: hgnc:20174
      label: INTS13
  relationship_type: CAUSATIVE
  subtype: OFD II
  evidence:
  - reference: PMID:36229431
    reference_title: INTS13 variants causing a recessive developmental ciliopathy disrupt assembly of the Integrator complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of INTS13 disrupts ciliogenesis in human cultured cells and causes
      dysregulation of a broad collection of ciliary genes.
    explanation: >-
      Establishes the ciliary consequence of INTS13 loss. Evidence source is
      IN_VITRO because the ciliogenesis assays were performed in cultured human
      cells.
- name: FUZ
  notes: >-
    FUZ is a core CPLANE subunit involved in vesicular trafficking within primary
    cilia. Biallelic loss-of-function variants produce a skeletal ciliopathy with
    digital anomalies, orofacial cleft, short ribs and cardiac defects that the
    reporting authors describe as akin to orofaciodigital syndrome; no numbered
    OFD type has yet been assigned, so it is recorded here as a gene of the OFD
    spectrum rather than against a subtype.
  gene_term:
    preferred_term: FUZ
    term:
      id: hgnc:26219
      label: FUZ
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:38702430
    reference_title: Biallelic loss of function variants in FUZ result in an orofaciodigital syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings underscore the association between biallelic loss of function
      variants in FUZ and skeletal ciliopathy akin to orofaciodigital syndrome.
    explanation: >-
      Supports a FUZ-OFD spectrum association. Classified PARTIAL because the
      authors describe the phenotype as akin to orofaciodigital syndrome rather
      than assigning a numbered OFD type.
diagnosis:
- name: Clinical recognition of the oral-facial-digital triad
  description: >-
    Diagnosis begins with recognition of the characteristic combination of oral
    (frenula, lobulated tongue, tongue nodules, clefting), facial (hypertelorism,
    median upper-lip cleft or pseudocleft, hypoplastic alae nasi) and digital
    (polydactyly, syndactyly, brachydactyly, clinodactyly) anomalies. The
    additional organ findings then direct subtype assignment.
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:37384395
    reference_title: Pathogenic RAB34 variants impair primary cilium assembly and cause a novel oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral-facial-digital syndromes (OFDS) are a group of clinically and
      genetically heterogeneous disorders characterized by defects in the
      development of the face and oral cavity along with digit anomalies.
    explanation: >-
      Defines the clinical triad on which the initial diagnostic recognition
      rests.
- name: Brain MRI for cerebral and cerebellar malformation
  description: >-
    Brain MRI identifies the molar tooth sign and cerebellar vermis hypoplasia
    that assign a case to the Joubert-overlapping subtypes (notably OFD VI), and
    detects the intracerebral cysts, corpus callosum agenesis and Dandy-Walker
    malformation seen in OFD type I.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:24178751
    reference_title: C5orf42 is the major gene responsible for OFD syndrome type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral-facial-digital syndrome type VI (OFD VI) is a recessive ciliopathy
      defined by two diagnostic criteria: molar tooth sign (MTS) and one or more
      of the following
    explanation: >-
      Establishes the molar tooth sign, an MRI finding, as a formal diagnostic
      criterion for a subtype.
  - reference: PMID:35361766
    reference_title: Additional findings of tibial dysplasia in a male with orofaciodigital syndrome type XVI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI showed cerebellar vermis hypoplasia and a molar tooth sign
    explanation: >-
      Worked example of brain MRI making the subtype-defining CNS findings in an
      orofaciodigital case.
- name: Skeletal radiography of hands, feet and thorax
  description: >-
    Radiographs delineate the digital anomalies (extra rays, phalangeal number and
    shape, metacarpal form) and detect the tibial dysplasia and short ribs that
    identify the severe skeletal subtypes OFD IV and OFD XV.
  diagnosis_term:
    preferred_term: radiography
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:35361766
    reference_title: Additional findings of tibial dysplasia in a male with orofaciodigital syndrome type XVI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic imaging at 48 days showed the 6th finger, including two
      proximal phalanxes and one distal phalanx
    explanation: >-
      Worked example of radiography resolving the digital anatomy in an
      orofaciodigital case.
- name: Molecular genetic testing
  description: >-
    Diagnosis is confirmed by identifying the causal variant. For OFD type I this
    is a heterozygous OFD1 variant in a female or a hemizygous variant in a male;
    for the other subtypes a multigene ciliopathy panel or exome sequencing is
    required.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301367
    reference_title: Oral-Facial-Digital Syndrome Type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of OFD1 is established in a female proband with suggestive
      findings and a heterozygous OFD1 pathogenic variant identified by molecular
      genetic testing.
    explanation: >-
      States the molecular diagnostic criterion for the commonest subtype.
- name: Exome sequencing for the molecularly undefined subtypes
  description: >-
    Because several of the classically described subtypes still lack a molecular
    definition, exome or genome sequencing is the appropriate test when a case
    does not fit a gene-defined type; this is how C2CD3, TMEM107, INTU, KIAA0753,
    IFT57, SCNM1, RAB34 and ZRSR2 were each identified.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27141300
    reference_title: Update on oral-facial-digital syndromes (OFDS).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, seven of the described OFDS still await a molecular definition and
      two unclassified forms need further clinical and molecular validation.
    explanation: >-
      Establishes the residual diagnostic gap that motivates untargeted sequencing
      in this group. Evidence source is OTHER because this is a narrative review.
- name: Renal ultrasound surveillance
  description: >-
    Because polycystic kidney disease in OFD type I is typically adult-onset,
    imaging surveillance rather than one-off testing is required; kidney, liver,
    pancreas and ovarian ultrasound is recommended annually from age ten.
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:20301367
    reference_title: Oral-Facial-Digital Syndrome Type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annual blood pressure; serum creatinine; and kidney, liver, pancreas, and
      ovarian ultrasound for cystic disease beginning at age ten years.
    explanation: >-
      States the imaging surveillance schedule for cystic organ disease in OFD
      type I.
differential_diagnoses:
- name: Joubert syndrome
  description: >-
    The closest differential. OFD VI is formally a Joubert-syndrome-related
    disorder and shares the molar tooth sign and several genes (CPLANE1, TMEM216,
    TMEM107, OFD1), so the two are allelic rather than merely similar.
  distinguishing_features:
  - >-
    OFD VI requires oral-facial-digital findings (tongue hamartoma, additional
    frenula, mesoaxial polydactyly or hypothalamic hamartoma) in addition to the
    molar tooth sign; pure Joubert syndrome lacks them.
  - >-
    Joubert syndrome presents with hypotonia, ataxia, oculomotor apraxia and
    episodic hyperpnea as the leading features rather than a malformation triad.
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  evidence:
  - reference: PMID:24178751
    reference_title: C5orf42 is the major gene responsible for OFD syndrome type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C5orf42 mutations have already been reported in Joubert syndrome confirming
      that OFD VI and JBS are allelic disorders, thus enhancing our knowledge of
      the complex, highly heterogeneous nature of ciliopathies.
    explanation: >-
      Establishes the allelic relationship that makes Joubert syndrome the primary
      differential for the molar-tooth-sign subtypes.
- name: Meckel syndrome
  description: >-
    A lethal transition-zone ciliopathy sharing genes with the severe OFD
    subtypes; TCTN3 truncating variants were found in fetal cases with overlapping
    Meckel and OFD IV phenotypes.
  distinguishing_features:
  - >-
    Meckel syndrome is defined by the triad of occipital encephalocele, cystic
    renal dysplasia and hepatic ductal plate malformation, and is perinatally
    lethal.
  - >-
    The oral findings characteristic of OFDS (accessory frenula, lobulated tongue,
    tongue hamartoma) are not part of the Meckel definition.
  disease_term:
    preferred_term: Meckel syndrome
    term:
      id: MONDO:0018921
      label: Meckel syndrome
  evidence:
  - reference: PMID:22883145
    reference_title: TCTN3 mutations cause Mohr-Majewski syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      led us to identify four additional truncating TCTN3 mutations in unrelated
      fetal cases with overlapping Meckel and OFD IV syndromes
    explanation: >-
      Documents the phenotypic overlap that makes Meckel syndrome a differential
      for the severe OFD subtypes.
- name: Bardet-Biedl syndrome
  description: >-
    A pleiotropic ciliopathy that also features polydactyly, and shares the ciliary
    mechanism, but with a quite different clinical centre of gravity.
  distinguishing_features:
  - >-
    Bardet-Biedl syndrome is defined by rod-cone dystrophy, obesity, hypogonadism
    and renal dysfunction; postaxial polydactyly is its only overlap with the
    orofaciodigital triad.
  - >-
    The oral and facial midline malformations of OFDS are not features of
    Bardet-Biedl syndrome.
  disease_term:
    preferred_term: Bardet-Biedl syndrome
    term:
      id: MONDO:0015229
      label: Bardet-Biedl syndrome
  evidence:
  - reference: PMID:35361766
    reference_title: Additional findings of tibial dysplasia in a male with orofaciodigital syndrome type XVI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OFD syndromes are classified under ciliopathies, which also include Joubert
      syndrome (JBS), Meckel–Gruber syndrome (MKS), Bardet–Biedl syndrome,
      nephronophthisis (NPHP), and several chondrodysplasias
    explanation: >-
      Places Bardet-Biedl syndrome alongside OFDS within the ciliopathies, which
      is why it is carried as a differential.
treatments:
- name: Surgical correction of oral, facial and digital malformations
  description: >-
    Management is symptomatic. Surgery addresses cleft lip and palate, tongue

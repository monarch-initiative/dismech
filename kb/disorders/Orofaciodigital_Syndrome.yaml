classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A group of Mendelian malformation syndromes whose members are defined by
      germline variants in ciliary, centriolar and minor-spliceosome genes.
    evidence:
    - reference: PMID:27141300
      reference_title: Update on oral-facial-digital syndromes (OFDS).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        With the exception of OFD types I and VIII, which are X-linked, the
        majority of OFDS is transmitted as an autosomal recessive syndrome.
      explanation: >-
        Establishes OFDS as a set of Mendelian disorders with defined modes of
        inheritance, which is why the entry is assigned to the genetics chapter.
        Evidence source is OTHER because this is a narrative review.
  mechanistic_category:
  - classification_value: ciliopathy
    notes: >-
      Assigned on the basis of the ciliary/centriolar identity of the OFDS gene
      set rather than on any single subtype.
    evidence:
    - reference: PMID:28289185
      reference_title: "Fifteen years of research on oral-facial-digital syndromes: from 1 to 16 causal genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        OFDS now appear to be a distinct subgroup of ciliopathies with wide
        heterogeneity
      explanation: >-
        States explicitly that the orofaciodigital syndromes form a subgroup of
        the ciliopathies, which is the mechanistic category assigned here.
mappings:
  mondo_mappings:

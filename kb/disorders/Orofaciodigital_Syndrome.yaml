  - reference: PMID:20301367
    reference_title: Oral-Facial-Digital Syndrome Type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      oral features (lobulated tongue, tongue nodules, cleft of the hard or soft
      palate, accessory gingival frenulae, hypodontia, and other dental
      abnormalities)
    explanation: >-

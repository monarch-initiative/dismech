name: Orofaciodigital Syndrome
creation_date: "2026-08-19T10:00:00Z"
category: Mendelian
description: >-
  Orofaciodigital syndrome (OFDS; oral-facial-digital syndrome) is the umbrella
  entry for a clinically and genetically heterogeneous group of ciliopathies
  defined by the co-occurrence of malformations of the oral cavity (accessory
  frenula, lobulated or bifid tongue, tongue hamartomas/nodules, cleft palate,
  dental anomalies), the face (hypertelorism, median cleft or pseudocleft of the
  upper lip, hypoplastic alae nasi, micrognathia) and the digits (pre-, post- and
  mesoaxial polydactyly, syndactyly, brachydactyly, clinodactyly), with variable
  additional involvement of the brain, kidneys, retina and skeleton that
  distinguishes the numbered subtypes from one another. The archetypal and by far
  the most frequent form is OFD type I, an X-linked dominant, male-lethal disorder
  caused by heterozygous OFD1 variants; almost all other subtypes are autosomal
  recessive, with OFD VIII and OFD 21 X-linked recessive. Nearly every causal gene
  encodes a centriolar, basal-body, transition-zone or CPLANE/intraflagellar
  transport protein, so the shared mechanism is failure of primary-cilium assembly
  or ciliary compartmentalization, which deranges cilium-dependent Hedgehog signal
  transduction and thereby the patterning of the cranial neural crest derivatives
  and the autopod. Two of the most recently delineated subtypes (OFD 19, SCNM1;
  OFD 21, ZRSR2) instead disrupt the minor (U12) spliceosome and reach the same
  ciliary endpoint indirectly, by depleting transcripts of ciliary genes. Because
  the shared mechanism is elaborated in the ciliopathy_dysfunction module and the
  digit bundle in limb_digit_patterning_serial_homology, this entry declares
  conformance to both rather than re-deriving them, and cross-references the
  existing per-subtype entries Orofaciodigital_Syndrome_Type_I and
  Orofaciodigital_Syndrome_17 rather than duplicating their detail.

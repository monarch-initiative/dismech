    snippet: >-
      digital features (brachydactyly, syndactyly, clinodactyly of the fifth
      finger, duplicated great toe)
    explanation: >-
      Enumerates the hand and foot anomalies of this node in the
      best-characterized subtype, including the hallux duplication that shows
      hindlimb involvement.
  - reference: PMID:35361766

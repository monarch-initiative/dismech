genetic:
- name: M1AP
  notes: >-
    M1AP (meiosis 1 associated protein; previous symbol C2orf65) lies on 2p13.
    It is among the more frequently identified single-gene causes in exome
    studies of non-obstructive azoospermia. The recurrent c.676dup frameshift
    accounts for most reported alleles. Missense variants need caution: a
    p.Gly317Arg variant reported in a man with meiotic arrest did not impair
    fertility when modelled in mice.
  gene_term:
    preferred_term: M1AP
    term:
      id: hgnc:25183
      label: M1AP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:32673564
    reference_title: "Bi-allelic Mutations in M1AP Are a Frequent Cause of Meiotic Arrest and Severely Impaired Spermatogenesis Leading to Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next, we screened four large cohorts of infertile men and identified three
      additional individuals carrying homozygous c.676dup and three carrying
      combinations of this and other likely causal variants in M1AP.
    explanation: >-
      Replication of biallelic M1AP variants across independent infertility
      cohorts.
  - reference: PMID:41401169
    reference_title: "Diagnostic yield of exome sequencing in nonobstructive azoospermia (NOA): A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 270 positive cases identified through ES testing, mutations in 262
      genes were detected, with AR, TEX11, FANCM, TDRD9, PNLDC1, M1AP, FBXO15,
      and DMRT1 being the most frequently observed.
    explanation: >-
      A meta-analysis of exome sequencing in non-obstructive azoospermia places
      M1AP among the most frequently diagnosed genes.
  - reference: PMID:37459509
    reference_title: "In vivo versus in silico assessment of potentially pathogenic missense variants in human reproductive genes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      M1AP (Meiosis 1–associated protein) is a conserved protein of unknown
      biochemical function but when knocked out in mice causes male (but not
      female) infertility associated primarily with meiotic metaphase I arrest
    explanation: >-
      Records that M1AP has no characterised biochemical activity, and that
      the knockout phenotype is male-specific.
histopathology:
- name: Partial metaphase I arrest with rare round spermatids
  description: >-
    The discriminating testicular histology is a predominant meiotic arrest at
    metaphase I in which some tubules still contain CREM-positive round
    spermatids and occasionally elongated spermatids. Metaphase cells with
    correctly aligned chromosomes are present alongside aberrant ones. Loss of
    SHOC1, TEX11 or SPO16 instead gives a complete early arrest without haploid
    cells.
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One key difference between the cases was that only men with LoF variants
      in M1AP exhibited TUNEL-negative metaphase cells, round, and even
      elongated spermatids.
    explanation: >-
      Distinguishes the M1AP histology from that of the core ZZS genes.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only men with LoF variants in M1AP had CREM-positive round spermatids.
    explanation: >-
      Haploid round spermatids are present in M1AP deficiency but not in ZZS
      deficiency.
diagnosis:
- name: Semen analysis
  description: >-
    Repeated semen analysis shows azoospermia or cryptozoospermia. Azoospermia
    is only called once no sperm are found after centrifugation of the sample,
    which is also how cryptozoospermia, the presentation that still allows
    sperm to be used from the ejaculate, is distinguished from it.
  results: Azoospermia, or cryptozoospermia with sperm only in the centrifuged pellet.
  evidence:
  - reference: PMID:41401169
    reference_title: "Diagnostic yield of exome sequencing in nonobstructive azoospermia (NOA): A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the various causes of male infertility, azoospermia is considered
      the most severe form, defined as the complete absence of spermatozoa in
      the ejaculate following centrifugation and subsequent microscopic
      evaluation of the specimen on two separate semen analyses
    explanation: >-
      Defines azoospermia by examination of the centrifuged ejaculate on two
      analyses.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Semen analysis of all 24 men included in this study revealed a high
      proportion of azoospermia (N = 21), with the remaining three men
      displaying cryptozoospermia.
    explanation: >-
      Semen analysis findings in the M1AP and ZZS-gene cohort; the three
      cryptozoospermic men all carried M1AP variants.
- name: Karyotype and Y-chromosome microdeletion analysis
  description: >-
    Both tests come before gene-level testing and exclude the commonest
    genetic causes of non-obstructive azoospermia. Men with M1AP-related
    disease have a normal 46,XY karyotype and no AZF deletion.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: Normal 46,XY karyotype with no AZF microdeletion.
  evidence:
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current genetic diagnostic tests for NOA include karyotyping and Y
      chromosome azoospermia factor (AZF) microdeletion analysis.
    explanation: >-
      Names the two standard genetic tests that precede gene-level testing.
  - reference: PMID:42324855
    reference_title: "Variants in ZZS Complex-Associated Genes TEX11 and M1AP Are Responsible for Male Infertility and Nonobstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES were conducted in genomic DNA from all the patients with a normal
      karyotype (46, XY) and no Y chromosome microdeletions.
    explanation: >-
      In the cohort where M1AP variants were found, exome sequencing was done
      only after karyotype and Y-microdeletion testing were normal.
- name: Testicular biopsy
  description: >-
    Histology from a biopsy or sperm-extraction procedure shows the partial
    metaphase I arrest with rare round spermatids described under
    histopathology. It points to a meiotic gene but does not name one.
  diagnosis_term:
    preferred_term: testicular biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: Predominant metaphase I arrest with rare round and elongated spermatids.
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testicular biopsies originating from testicular sperm retrieval (TESE)
      procedures were available in 20 of the selected cases and used for
      histological evaluation of spermatogenic differentiation.
    explanation: >-
      Histology in this cohort came from TESE material, so the biopsy and the
      retrieval attempt are usually one procedure.
- name: M1AP molecular genetic testing
  description: >-
    Exome sequencing or an exome-based infertility gene panel finds the
    recurrent c.676dup frameshift and other sequence variants. A homozygous
    deletion of exon 2 found in a Pakistani family was missed by exome
    sequencing and detected only by genome sequencing with copy-number
    calling, so a negative exome does not exclude M1AP disease.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic M1AP variants.
  evidence:
  - reference: PMID:32673564
    reference_title: "Bi-allelic Mutations in M1AP Are a Frequent Cause of Meiotic Arrest and Severely Impaired Spermatogenesis Leading to Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To address this gap, we performed whole-exome sequencing in 58 men with
      unexplained meiotic arrest and identified the same homozygous frameshift
      variant c.676dup (p.Trp226LeufsTer4) in M1AP
    explanation: >-
      Exome sequencing detects the recurrent frameshift allele.
  - reference: PMID:38073178
    reference_title: "Genome sequencing of Pakistani families with male infertility identifies deleterious genotypes in SPAG6, CCDC9, TKTL1, TUBA3C, and M1AP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the positive side, the identification of the 10kb M1AP deletion,
      affecting a single exon, was a direct result of the WGS approach, as this
      causal mutation would have been missed with standard WES.
    explanation: >-
      The exon-2 deletion needs genome sequencing or copy-number analysis;
      exome sequencing alone would miss it.
animal_models:
- name: M1ap-deficient mouse
  species: Mouse
  genotype: M1ap null
  publication: PMID:23269666
  description: >-
    The first M1ap knockout. Males are infertile or severely oligozoospermic
    with a predominant metaphase I arrest; females have normal ovaries.
  modeled_mechanisms:
  - target: Metaphase I Arrest and Spermatocyte Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the predominant metaphase I arrest with apoptosis seen in
      affected men.
    limitations: >-
      The mouse also shows progressive tubular degeneration to a Sertoli
      cell-only picture, which has not been described as typical of the human
      disease.
    evidence:
    - reference: PMID:23269666
      reference_title: "Meiosis I arrest abnormalities lead to severe oligozoospermia in meiosis 1 arresting protein (M1ap)-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although some germ cells arrested at the zygotene/pachytene stages, most
        cells advanced to metaphase I before arresting and entering apoptosis.
      explanation: >-
        Shows the model reproduces the metaphase I arrest node.
  evidence:
  - reference: PMID:23269666
    reference_title: "Meiosis I arrest abnormalities lead to severe oligozoospermia in meiosis 1 arresting protein (M1ap)-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whereas females had histologically normal ovaries, males exhibited
      reduced testicular size and a myriad of tubular defects, which led to
      severe oligozoospermia and infertility.
    explanation: >-
      The knockout phenotype is male-specific infertility.
- name: M1ap patient splice-variant knock-in mouse
  species: Mouse
  genotype: M1ap knock-in of the human c.1074+2T>C splice mutation, homozygous
  publication: PMID:36440627
  description: >-
    Mice carrying the splice mutation found in patients, used to establish
    M1AP's interaction with the ZZS complex and its effect on TEX11
    recruitment and crossover formation.
  modeled_mechanisms:
  - target: Reduced Recombination Intermediates and Class I Crossovers
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the reduction in recombination intermediates and crossovers.
    limitations: >-
      The mechanism is established in mouse spermatocytes; the human evidence
      for the same step comes from a spermatocyte spread of a single man.
    evidence:
    - reference: PMID:36440627
      reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutation abolishes M1AP foci on the chromosome axes, resulting in
        decreased recombination intermediates and crossovers in male mouse
        models.
      explanation: >-
        Shows the model reproduces the recombination node.
  evidence:
  - reference: PMID:36440627
    reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      M1AP shows cytoplasmic localization in fetal oocytes and is dispensable
      for fertility and crossover formation in female mice.
    explanation: >-
      Records the sex difference: the model affects male but not female
      fertility.
treatments:
- name: Testicular sperm extraction with intracytoplasmic sperm injection
  description: >-
    Nothing restores spermatogenesis, but the arrest is incomplete, so sperm
    can sometimes be recovered from the ejaculate or by testicular sperm
    extraction and used for ICSI. One cohort reported a TESE success rate of
    40%, and a multicentre study reported up to 50% for M1AP carriers. Of the
    four men in that cohort who attempted ICSI, one fathered a healthy,
    euploid child using ejaculated sperm; the other attempts failed at
    fertilisation or embryo development. Because few crossovers form, aneuploid sperm are a
    theoretical concern that has not been measured.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TESE success rate in our cohort was 40%, and we described one man who
      fathered a healthy, euploid child, thus showing that biallelic LoF
      variants in M1AP are compatible with fatherhood and, thereby, presenting a
      proof-of-principle.
    explanation: >-
      Sperm retrieval succeeds in a minority of men and fatherhood by ICSI is
      possible.
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the proportion of cases with successful sperm recovery is up to 50% for
      patients carrying M1AP LP/P mutations
    explanation: >-
      An independent multicentre study gives a sperm retrieval rate for M1AP
      carriers similar to the single-cohort figure, so a molecular diagnosis
      does not argue against attempting retrieval.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an ICSI-TESE attempt by M2062 and his female partner, three oocytes
      were fertilised, but none developed to the blastocyst stage and a
      transfer was not possible.
    explanation: >-
      Not every attempt succeeds; embryo development can fail after
      fertilisation.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four of the ten men with LoF variants in M1AP tried to conceive via ICSI.
    explanation: >-
      The denominator for the ICSI outcomes: four attempting couples, one live
      birth.
- name: Genetic counselling
  description: >-
    Counselling covers autosomal recessive recurrence risk for brothers, the
    possibility of sperm retrieval, and the open question of sperm aneuploidy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32017041
    reference_title: "An M1AP homozygous splice-site mutation associated with severe oligozoospermia in a consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His parents and fertile brother were heterozygous for the mutation.
    explanation: >-
      Heterozygous relatives are unaffected carriers, which is the basis for
      recessive recurrence-risk and carrier counselling in the family.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis showed the autosomal-recessive inheritance pattern
      of the frameshift variant c.676dup.
    explanation: >-
      Family segregation confirming autosomal recessive transmission of the
      recurrent allele, which sets the recurrence risk for brothers.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The burden is reproductive and psychosocial. There is no systemic disease
    and no effect on virilisation or testosterone. The cost is the prospect of
    biological parenthood without assisted reproduction, with a minority of
    men able to father children through sperm retrieval and ICSI.

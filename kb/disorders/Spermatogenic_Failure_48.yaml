inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected men are homozygous or compound heterozygous for M1AP variants,
    often from consanguineous families, and the variants segregate with
    infertility. The recurrent c.676dup frameshift predominates; splice-site
    variants, a homozygous single-exon (exon 2) deletion, and a missense variant
    segregating in one consanguineous family are also reported.
  evidence:
  - reference: PMID:32673564
    reference_title: "Bi-allelic Mutations in M1AP Are a Frequent Cause of Meiotic Arrest and Severely Impaired Spermatogenesis Leading to Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, these findings demonstrate that mutations in M1AP are a
      relatively frequent cause of autosomal recessive severe spermatogenic
      failure and male infertility with strong clinical validity.
    explanation: >-
      The founding multi-cohort study establishes autosomal recessive
      inheritance.
  - reference: PMID:32017041
    reference_title: "An M1AP homozygous splice-site mutation associated with severe oligozoospermia in a consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His parents and fertile brother were heterozygous for the mutation.
    explanation: >-
      Heterozygous carriers in the family are unaffected, consistent with
      recessive inheritance.
  - reference: PMID:38073178
    reference_title: "Genome sequencing of Pakistani families with male infertility identifies deleterious genotypes in SPAG6, CCDC9, TKTL1, TUBA3C, and M1AP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a pathogenic homozygous 10kb deletion encompassing exon two
      of the gene Meiosis 1-associated protein (M1AP) segregating with
      infertility in family 9
    explanation: >-
      A homozygous structural allele segregating with infertility in a
      consanguineous family, extending the allele spectrum beyond
      sequence-level variants.
pathophysiology:
- name: M1AP Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic frameshift, splice and exon-deletion variants remove or truncate
    M1AP. The only molecular activity demonstrated for M1AP is binding to the
    ZZS proteins SHOC1, TEX11 and SPO16, shown by co-immunoprecipitation for
    the mouse and the human proteins. Truncated M1AP proteins modelled on
    patient alleles no longer bind TEX11, so the disease alleles abolish the
    one activity the protein is known to have.
  notes: >-
    The molecular function is bound to GO:0005515 protein binding because that
    is the activity the literature demonstrates and nothing more specific is
    supported. On 2026-10-15 QuickGO returned only GO:0005515 protein binding
    and GO:0042802 identical protein binding as molecular-function annotations
    for UniProtKB:Q8TC57, and PMID:37459509 describes M1AP as a conserved
    protein of unknown biochemical function. GO:0044877 protein-containing
    complex binding was considered and not used: PMID:40374915 shows each ZZS
    protein binding M1AP independently in pairwise co-expression, not binding to
    an assembled complex. An adaptor-activity term was also not used, since
    reduced TEX11 recruitment shows M1AP is needed for recruitment but not that
    it bridges TEX11 to another molecule. Unlike interaction-screen hits, these
    bindings are targeted experiments, and their loss is the disease mechanism.
  genes:
  - preferred_term: M1AP
    term:
      id: hgnc:25183
      label: M1AP
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Germline biallelic truncating, splice and exon-deletion variants; the
      recurrent allele is c.676dup (p.Trp226LeufsTer4).
  molecular_functions:
  - preferred_term: binding to the ZZS proteins SHOC1, TEX11 and SPO16
    modifier: DECREASED
    term:
      id: GO:0005515
      label: protein binding
  evidence:
  - reference: PMID:32673564
    reference_title: "Bi-allelic Mutations in M1AP Are a Frequent Cause of Meiotic Arrest and Severely Impaired Spermatogenesis Leading to Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant most likely results in a truncated protein as shown in vitro
      by heterologous expression of mutant M1AP.
    explanation: >-
      Shows that the recurrent c.676dup allele produces a truncated protein.
  - reference: PMID:32017041
    reference_title: "An M1AP homozygous splice-site mutation associated with severe oligozoospermia in a consanguineous family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The splice variant led to a lack of M1AP protein in the patient's
      spermatozoa.
    explanation: >-
      Demonstrates absent M1AP protein in a patient carrying a homozygous splice
      variant.
  - reference: PMID:36440627
    reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      M1AP interacts with the mammalian ZZS (an acronym for yeast proteins
      Zip2-Zip4-Spo16) complex components, SHOC1, TEX11, and SPO16.
    explanation: >-
      Establishes the binding partners of M1AP in mouse, the basis of the
      molecular-function binding on this node.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A subsequent Western blot showed that human M1AP binds specifically to
      each of the three human ZZS complex components
    explanation: >-
      Confirms the same binding for the human proteins by co-immunoprecipitation
      in transfected HEK293T cells.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that the deletion of the last 97 amino acids of M1AP (~
      18% of the protein) is already sufficient to completely abolish the
      binding of M1AP and TEX11 implying that for the protein-protein
      interaction the full-length protein of M1AP is mandatory.
    explanation: >-
      Shows that truncation abolishes TEX11 binding, linking the loss-of-function
      alleles to loss of the binding activity.
  downstream:
  - target: Reduced TEX11 Recruitment to Recombination Sites
    causal_link_type: DIRECT
    description: >-
      Without its binding partner M1AP, less TEX11 is recruited to the
      chromosome axes, while SHOC1 localisation is unchanged.
    evidence:
    - reference: PMID:36440627
      reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ablation of M1AP does not alter SHOC1 localization but reduces the
        recruitment of TEX11 to recombination intermediates.
      explanation: >-
        Mouse evidence that M1AP loss reduces TEX11 recruitment specifically.
- name: Reduced TEX11 Recruitment to Recombination Sites
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    M1AP localises to the chromosome axes of spermatocytes in a SPO16-dependent
    manner and colocalises with TEX11. Its loss leaves SHOC1 in place but
    reduces the TEX11 recruited to recombination intermediates, by about two
    thirds in the one human spermatocyte spread analysed. The ZZS complex is not
    abolished, which distinguishes this lesion from loss of SHOC1, TEX11 or
    SPO16 themselves, where TEX11 foci are absent.
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M1AP deficiency significantly reduced the recruitment of TEX11 to the axes
    explanation: >-
      Direct measurement of reduced TEX11 foci in spermatocyte spreads from a
      man with biallelic M1AP loss of function.
  - reference: PMID:36440627
    reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      M1AP localizes to chromosomal axes in a SPO16-dependent manner and
      colocalizes with TEX11.
    explanation: >-
      Places M1AP at the chromosome axes alongside TEX11, where the recruitment
      defect occurs.
  downstream:
  - target: Reduced Recombination Intermediates and Class I Crossovers
    causal_link_type: DIRECT
    description: >-
      TEX11 recruited by the ZZS complex stabilises recombination intermediates
      destined to become class I crossovers, so less TEX11 means fewer of both.
    evidence:
    - reference: PMID:40374915
      reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We propose that M1AP is functionally linked to the regulation of SHOC1,
        TEX11, and SPO16, thereby affecting recombination stability,
        processing, and class I crossover resolution.
      explanation: >-
        The authors' model linking M1AP's effect on the ZZS proteins to
        recombination and crossover outcome; stated as a proposal.
- name: Reduced Recombination Intermediates and Class I Crossovers
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Early recombination proceeds: double-strand breaks form and are repaired,
    and homologous chromosomes synapse fully. What is reduced is the number of
    MSH5-marked recombination intermediates and of MLH1-marked class I
    crossovers. In the one human case quantified, MSH5 foci fell to about half
    and MLH1 foci to about 35 against 48 per spermatocyte, although every
    homologue pair still carried at least one crossover in the cell examined.
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:
  - preferred_term: reciprocal meiotic recombination
    modifier: DECREASED
    term:
      id: GO:0007131
      label: reciprocal meiotic recombination
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abolished M1AP led to a reduced number of recombination intermediates and
      class I crossover.
    explanation: >-
      Human spermatocyte evidence for the recombination defect.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the complete repair of DSBs post-zygotene and the clear
      restriction of γH2AX to the XY body was only observed in controls and in
      men with LoF variants in M1AP.
    explanation: >-
      Shows that double-strand break repair is intact, which places the defect
      at the crossover-designation step rather than earlier.
  - reference: PMID:36440627
    reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutation abolishes M1AP foci on the chromosome axes, resulting in
      decreased recombination intermediates and crossovers in male mouse models.
    explanation: >-
      Mice carrying the patient splice mutation reproduce the reduction in
      recombination intermediates and crossovers.
  downstream:
  - target: Metaphase I Arrest and Spermatocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      Spermatocytes with too few crossovers cannot align their chromosomes
      properly at metaphase I and are eliminated.
    evidence:
    - reference: PMID:40374915
      reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast, LoF variants in M1AP led to a metaphase I arrest, where
        early meiotic recombination was completed while the total number of
        recombination intermediates and the final recombination products, the
        meiotic class I crossover events, was reduced.
      explanation: >-
        Connects the reduced crossover number to the metaphase I arrest in the
        same men.
    - reference: PMID:23269666
      reference_title: "Meiosis I arrest abnormalities lead to severe oligozoospermia in meiosis 1 arresting protein (M1ap)-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cells that reached metaphase I were unable to properly align their
        chromosomes at the metaphase plate due to abnormal chromosome synapses
        and failure to form crossover foci.
      explanation: >-
        In the M1ap knockout mouse, failed crossover formation is what prevents
        metaphase I chromosome alignment.
- name: Metaphase I Arrest and Spermatocyte Apoptosis
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Most spermatocytes progress through prophase I and arrest at metaphase I
    with misaligned chromosomes, then undergo apoptosis. The arrest is partial:
    some metaphase cells align correctly, escape apoptosis, and complete
    meiosis, so round and occasionally elongated spermatids are found. This
    partial metaphase I arrest differs from the early zygotene to pachytene
    arrest caused by loss of SHOC1, TEX11 or SPO16.
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:
  - preferred_term: male meiosis I
    modifier: DECREASED
    term:
      id: GO:0007141
      label: male meiosis I
  - preferred_term: spermatocyte apoptosis
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Men with LoF variants in M1AP exhibited a predominant metaphase I arrest
      with rare haploid round or even elongated spermatids.
    explanation: >-
      Defines the human arrest stage and its incompleteness.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This, together with the presence of post-meiotic cells, classified the
      arrest in men with M1AP LoF variants as a partial metaphase I arrest
    explanation: >-
      Classifies the arrest as partial metaphase I arrest.
  - reference: PMID:36440627
    reference_title: "M1AP interacts with the mammalian ZZS complex and promotes male meiotic recombination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a homozygous M1AP splicing mutation (c.1074 + 2T > C) in
      patients with severe oligozoospermia owing to meiotic metaphase I arrest.
    explanation: >-
      Independent human report of metaphase I arrest with a different allele.
  - reference: PMID:23269666
    reference_title: "Meiosis I arrest abnormalities lead to severe oligozoospermia in meiosis 1 arresting protein (M1ap)-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although some germ cells arrested at the zygotene/pachytene stages, most
      cells advanced to metaphase I before arresting and entering apoptosis.
    explanation: >-
      The knockout mouse shows the same predominant metaphase I arrest followed
      by apoptosis.
  downstream:
  - target: Severe Spermatogenic Failure
    causal_link_type: DIRECT
    description: >-
      Loss of most spermatocytes at metaphase I leaves few or no post-meiotic
      germ cells.
  - target: Spermatocyte maturation arrest
    causal_link_type: DIRECT
    description: >-
      The metaphase I arrest is what the pathologist reports as spermatocyte
      maturation arrest.

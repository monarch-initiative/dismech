name: Spermatogenic failure 48
creation_date: "2026-10-15T00:00:00Z"
description: >-
  Spermatogenic failure 48 is autosomal recessive male infertility caused by
  biallelic loss-of-function variants in M1AP, which encodes meiosis 1
  associated protein, a germ-cell protein of unknown biochemical activity that
  binds the three components of the ZZS recombination complex (SHOC1, TEX11 and
  SPO16). Without M1AP, spermatocytes recruit less TEX11 to the chromosome axes,
  form fewer recombination intermediates and fewer class I crossovers, and most
  arrest at metaphase I and die. The arrest is partial rather than complete: a
  minority of cells finish meiosis, so affected men have non-obstructive
  azoospermia or, less often, cryptozoospermia or severe oligozoospermia, with
  rare round and elongated spermatids on biopsy. That residual spermatogenesis
  sets M1AP apart from the core ZZS genes, whose loss gives a complete early
  meiotic arrest, and it is why testicular sperm extraction is sometimes
  successful and one affected man has fathered a healthy child by ICSI.
  Testicular volume and testosterone are normal and there is no phenotype
  outside the testis. A recurrent frameshift, c.676dup (p.Trp226LeufsTer4),
  accounts for most reported cases, and M1AP is among the more frequently
  diagnosed single-gene causes of non-obstructive azoospermia.
notes: >-
  No GeneReviews chapter covers M1AP or spermatogenic failure 48. Female
  meiosis is not addressed by this entry: M1ap-deficient female mice are
  fertile, and no biallelic M1AP variants have been reported in women, so a
  female phenotype is neither curated nor excluded.
category: Mendelian
parents:
- hereditary disease

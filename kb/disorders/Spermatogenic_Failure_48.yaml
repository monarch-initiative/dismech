    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features were similar between men, including normal testicular
      volumes, normal luteinising hormone, follicle-stimulating hormone in the
      high range, and normal testosterone
    explanation: >-
      Shows that the disease is confined to spermatogenesis, with normal
      endocrine testicular function.
biochemical:
- name: Serum follicle-stimulating hormone
  presence: Elevated (high range)
  biomarker_term:
    preferred_term: follicle-stimulating hormone
    term:
      id: NCIT:C181076
      label: Follicle-Stimulating Hormone
  loinc_term:
    id: LOINC:15067-2
    label: Follitropin [Units/volume] in Serum or Plasma
  notes: >-
    FSH is in the high range while luteinising hormone and testosterone are
    normal, the expected pattern when spermatogenesis fails but Leydig cell
    function is intact. The source reports this for its whole cohort of men
    with M1AP or ZZS-gene loss of function, not for M1AP carriers separately.
  evidence:
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features were similar between men, including normal testicular

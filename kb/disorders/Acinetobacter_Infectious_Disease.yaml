differential_diagnoses:
- name: Klebsiella Pneumonia
  disease_term:
    preferred_term: Klebsiella pneumonia
    term:
      id: MONDO:0030602
      label: Klebsiella pneumonia
  description: >-
    Nosocomial pneumonia and bloodstream infection caused by multidrug-resistant
    or carbapenem-resistant Klebsiella pneumoniae (an ESKAPE and CRE pathogen)
    overlaps clinically with ICU-acquired Acinetobacter pneumonia and sepsis.
  distinguishing_features:
  - Distinguished by microbiological culture, MALDI-TOF mass spectrometry species identification, and carbapenemase/susceptibility profiling (with A. baumannii exhibiting nearly triple the carbapenem resistance rate of K. pneumoniae in CHINET surveillance)
  evidence:
  - reference: PMID:41890236
    reference_title: >-
      Integrated Proteomics and Metabolomics Reveal Multifaceted Mechanisms of
      Colistin Resistance in Acinetobacter baumannii.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Although 2024 data showed modest declines (meropenem 64.7%; imipenem
      64.5%), A. baumannii maintains carbapenem resistance rates 28~32 times
      higher than Escherichia coli, 3~4 times higher than Pseudomonas
      aeruginosa, and nearly triple those of Klebsiella pneumoniae (2024 CHINET
      surveillance data).
    explanation: >-
      Compares carbapenem resistance rates between A. baumannii, K. pneumoniae,
      and P. aeruginosa in hospital surveillance.
  - reference: PMID:42570093
    reference_title: >-
      Infectious Diseases Society of America 2026 Guidance on the Treatment of
      Antimicrobial-Resistant Gram-Negative Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This updated IDSA AMR Guidance document provides treatment suggestions for
      infections caused by extended-spectrum β-lactamase-producing
      Enterobacterales (ESBL-E), AmpC β-lactamase-producing Enterobacterales
      (AmpC-E), carbapenem-resistant Enterobacterales (CRE), Pseudomonas
      aeruginosa with difficult-to-treat resistance (DTR P. aeruginosa),
      carbapenem-resistant Acinetobacter baumannii (CRAB), and
      Stenotrophomonas maltophilia.
    explanation: >-
      Frames CRE and DTR P. aeruginosa alongside CRAB as the major
      antimicrobial-resistant Gram-negative infections requiring pathogen-specific
      identification and susceptibility-guided therapy.
- name: Pseudomonas aeruginosa Pneumonia
  disease_term:
    preferred_term: pneumonia caused by pseudomonas aeruginosa infection
    term:
      id: MONDO:0037398
      label: pneumonia caused by pseudomonas aeruginosa infection
  description: >-
    Ventilator-associated and hospital-acquired pneumonia caused by biofilm-forming,
    difficult-to-treat resistant Pseudomonas aeruginosa presents in the same
    mechanically ventilated ICU population as Acinetobacter pneumonia.
  distinguishing_features:
  - Differentiated by culture and MALDI-TOF species identification and treated with pathogen-specific regimens distinct from sulbactam-durlobactam-anchored CRAB combinations
  evidence:
  - reference: PMID:42570093
    reference_title: >-
      Infectious Diseases Society of America 2026 Guidance on the Treatment of
      Antimicrobial-Resistant Gram-Negative Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This updated IDSA AMR Guidance document provides treatment suggestions for
      infections caused by extended-spectrum β-lactamase-producing
      Enterobacterales (ESBL-E), AmpC β-lactamase-producing Enterobacterales
      (AmpC-E), carbapenem-resistant Enterobacterales (CRE), Pseudomonas
      aeruginosa with difficult-to-treat resistance (DTR P. aeruginosa),
      carbapenem-resistant Acinetobacter baumannii (CRAB), and
      Stenotrophomonas maltophilia.
    explanation: >-
      Distinguishes DTR P. aeruginosa and CRAB as major resistant non-fermenting

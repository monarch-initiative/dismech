diagnosis:
- name: Culture, MALDI-TOF species identification, and susceptibility testing
  description: >-
    Diagnosis is based on culturing Acinetobacter from a compatible infected
    site, species-level identification and differentiation of ACB-complex
    species by MALDI-TOF or molecular methods, and susceptibility testing for
    carbapenem, colistin, and other treatment-critical resistance.
  evidence:
  - reference: PMID:24054697
    reference_title: >-
      Improvement of MALDI-TOF MS profiling for the differentiation of species
      within the Acinetobacter calcoaceticus-Acinetobacter baumannii complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      this method suffers from the inability to differentiate reliably between
      some closely related bacterial species including those of the
      Acinetobacter calcoaceticus-Acinetobacter baumannii (ACB) complex, namely
      A. baumannii and Acinetobacter nosocomialis.
    explanation: >-
      Supports the need for optimized or confirmatory workflows when MALDI-TOF
      must distinguish ACB-complex species.

treatments:
- name: Susceptibility-guided combination antibiotic therapy
  description: >-
    Severe carbapenem-resistant A. baumannii infection is treated with
    susceptibility-guided antibiotic combinations, commonly anchored by
    sulbactam-durlobactam or cefiderocol when available and appropriate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: sulbactam
      term:
        id: CHEBI:9321
        label: sulbactam
    - preferred_term: durlobactam
      term:
        id: CHEBI:229539
        label: durlobactam
    - preferred_term: cefiderocol
      term:
        id: CHEBI:140376
        label: cefiderocol
  target_mechanisms:
  - target: Environmental A. baumannii Exposure and Colonization
    treatment_effect: INHIBITS
    description: >-
      Active antibiotics reduce viable bacterial burden after Acinetobacter is
      identified and susceptibility data are available.
  - target: Bacteremia and Sepsis
    treatment_effect: INHIBITS
    description: >-
      Appropriate active therapy treats bloodstream infection and septic
      physiology.
  evidence:
  - reference: PMID:42549848
    reference_title: Therapeutic options for carbapenem-resistant Acinetobacter baumannii infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      both the Infectious Diseases Society of America (IDSA) and the European
      Society of Clinical Microbiology and Infectious Diseases (ESCMID)
      guidance support the use of a combination of at least 2 agents for severe
      infections
    explanation: >-
      Supports combination therapy as the guidance-backed strategy for severe
      CRAB infection.
  - reference: PMID:42570093
    reference_title: >-
      Infectious Diseases Society of America 2026 Guidance on the Treatment of
      Antimicrobial-Resistant Gram-Negative Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Preferred and alternative treatment strategies are outlined with
      accompanying rationales, based on pathogen identification and in vitro
      susceptibility data.
    explanation: >-
      Supports using pathogen identification and in vitro susceptibility to
      choose therapy for AMR pathogens including CRAB.

review_notes: >-
  Duplicate preflight found no Acinetobacter-named files in an ignored-inclusive
  local search of kb/disorders, stubs, research, and history/disorders; origin/main
  searches for MONDO:0006635 and Acinetobacter only found incidental Klebsiella
  pneumonia differential-diagnosis text; all-state GitHub PR search returned no
  Acinetobacter work; all-state GitHub issue search via GET /search/issues
  returned total_count 0. Deep research requested falcon but fell back to
  OpenScientist, producing
  research/Acinetobacter_Infectious_Disease-deep-research-openscientist.md with
  44/44 references resolved and 39/44 on-topic. Term validation set needs_review
  because the report mislabeled HP:0001647 as endocarditis and HP:0000010 as
  UTI; endocarditis was rebound to HP:0100584 and generic UTI was omitted. The
  report passed manual identity review after preflight-dr returned SKIP for this
  non-Mendelian MONDO term. Most mechanisms were curated from A. baumannii or
  ACB-complex evidence and should not be generalized to every Acinetobacter
  species without review. Scope (design decisions section 3e): this is a
  genus-agent entry. The pathophysiology curates the shared
  opportunistic-pathogen pathway (device-associated environmental acquisition,
  biofilm surface persistence, and OmpA/OMV host-cell injury) together with the
  dominant invasive pneumonia and bacteremia/sepsis pathway that drives severe
  disease and mortality. Localized forms such as urinary tract and wound
  infection share the upstream colonization and biofilm steps but not the
  invasive terminal nodes, and are described as clinical presentations rather
  than carried as separate pathophysiology. MONDO has no species- or
  syndrome-specific Acinetobacter subtype terms to anchor a has_subtypes split,
  so the scope is declared here rather than structured as subtypes.

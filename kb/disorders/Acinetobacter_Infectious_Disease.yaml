      within the Acinetobacter calcoaceticus-Acinetobacter baumannii complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the four validly named species of the ACB complex
    explanation: >-
      Supports the ACB complex as four validly named, closely related species

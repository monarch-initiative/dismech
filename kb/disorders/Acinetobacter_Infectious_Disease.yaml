- name: Acinetobacter baumannii
  description: >-
    A. baumannii is the dominant Acinetobacter species in severe
    healthcare-associated disease and carbapenem-resistant ICU outbreaks.
  infectious_agent_term:
    preferred_term: Acinetobacter baumannii
    term:
      id: NCBITaxon:470
      label: Acinetobacter baumannii
  evidence:
  - reference: PMID:36272902
    reference_title: Treatment of Acinetobacter baumannii severe infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acinetobacter baumannii is a Gram-negative, multidrug-resistant (MDR)
      pathogen that causes nosocomial infections, especially in intensive care
      units (ICUs) and immunocompromised patients.
    explanation: >-
      Identifies A. baumannii as a severe human nosocomial pathogen.

transmission:
- name: Nosocomial environmental and device-associated spread
  description: >-
    Carbapenem-resistant A. baumannii spreads in ICUs from contaminated surfaces
    and medical devices to vulnerable, ventilated, or catheterized patients.
  evidence:
  - reference: PMID:34412693
    reference_title: >-
      A five-component infection control bundle to permanently eliminate a
      carbapenem-resistant Acinetobacter baumannii spreading in an intensive
      care unit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      WGS demonstrated that CRAB strains were clonally related to an
      environmental reservoir which confirms the primary role of the
      environment in CRAB ICU spreading.
    explanation: >-
      WGS in an ICU outbreak tied clinical isolates to an environmental
      reservoir, supporting hospital-environment transmission.

environmental:
- name: Mechanical ventilation and invasive-device exposure
  description: >-
    ICU care, mechanical ventilation, prior antibiotic exposure, severe illness,
    longer ICU or hospital stay, and medical devices increase acquisition of
    multidrug-resistant A. baumannii.
  influences_mechanisms:
  - target: Environmental A. baumannii Exposure and Colonization
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Ventilation and invasive devices create healthcare contact and mucosal
      access points through which MDR A. baumannii can colonize the patient.
  evidence:
  - reference: PMID:36272902
    reference_title: Treatment of Acinetobacter baumannii severe infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common risk factors for the acquisition of MDR A. baumannii are
      previous antibiotic use, mechanical ventilation, length of ICU and
      hospital stay, severity of illness, and use of medical devices.
    explanation: >-
      Summarizes the major ICU and device-associated acquisition risk factors
      for MDR A. baumannii infection.
- name: Desiccation-tolerant hospital reservoirs
  description: >-
    Resistance to dry-surface stress and disinfectants lets A. baumannii
    persist in the built hospital environment long enough to seed outbreaks.
  influences_mechanisms:
  - target: Environmental A. baumannii Exposure and Colonization
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A surface reservoir provides viable bacteria that can be transferred to
      patients or patient-care devices.
  evidence:
  - reference: PMID:30277310
    reference_title: The role of compatible solutes in desiccation resistance of Acinetobacter baumannii.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Acinetobacter baumannii is a nosocomial pathogen which can persist in the
      hospital environment not only due to the acquirement of multiple
      antibiotic resistances, but also because of its exceptional resistance
      against disinfectants and desiccation.
    explanation: >-
      Supports dry-surface and disinfectant tolerance as reservoir traits that
      let A. baumannii remain in hospital environments.

pathophysiology:
- name: Environmental A. baumannii Exposure and Colonization
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infection begins when a critically ill or device-bearing patient acquires A.
    baumannii from a contaminated ICU environment or medical device, allowing
    colonization of the lower airway, wound, bloodstream access device, urinary
    catheter, or another susceptible site.
  downstream:
  - target: Acinetobacter Biofilm and Surface Persistence
    causal_link_type: DIRECT
    description: >-
      Colonizing bacteria attach to host or device surfaces and initiate
      matrix-protected biofilm communities.
  evidence:
  - reference: PMID:34412693
    reference_title: >-
      A five-component infection control bundle to permanently eliminate a
      carbapenem-resistant Acinetobacter baumannii spreading in an intensive
      care unit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      WGS demonstrated that CRAB strains were clonally related to an
      environmental reservoir which confirms the primary role of the
      environment in CRAB ICU spreading.
    explanation: >-
      Connects the ICU environment to clonal CRAB transmission in a human
      outbreak investigation.
- name: Acinetobacter Biofilm and Surface Persistence
  biological_scale: CELLULAR
  description: >-
    A. baumannii belongs to the clinically relevant biofilm-forming organisms
    whose matrix communities on chronic or device-associated surfaces increase
    antimicrobial tolerance and host immune evasion.
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  downstream:
  - target: OmpA and OMV Host-Cell Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Protected colonizing populations deliver surface and vesicle-associated
      virulence factors, including OmpA, to epithelial and immune cells.
  - target: Skin and soft-tissue infection
    description: >-
      Biofilm-protected colonization of wounds and devices produces local skin
      and soft-tissue infection.
  evidence:
  - reference: PMID:42754003
    reference_title: >-
      Biofilm-driven antimicrobial resistance: A review of molecular
      mechanisms, clinical implications, and therapeutic innovation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinically relevant biofilm-forming microorganisms, including Pseudomonas
      aeruginosa, Staphylococcus aureus, Escherichia coli, Klebsiella
      pneumoniae, Acinetobacter baumannii, and Candida albicans
    explanation: >-
      Identifies A. baumannii as a clinically relevant biofilm-forming organism
      in chronic, device-associated, and healthcare-associated infection
      contexts.
- name: OmpA and OMV Host-Cell Injury
  biological_scale: MOLECULAR
  description: >-
    A. baumannii outer membrane protein A is delivered directly or within outer
    membrane vesicles; it enters mammalian cells, accumulates on mitochondria or
    in the nucleus, promotes mitochondrial fragmentation and reactive oxygen
    species, and triggers apoptosis in epithelial and innate immune cells.
  cell_types:
  - preferred_term: pulmonary alveolar epithelial cell
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
  downstream:
  - target: Inflammatory Pneumonia and Barrier Breach
    causal_link_type: DIRECT
    description: >-
      OmpA-dependent epithelial and macrophage injury amplifies pulmonary
      inflammation, damages lung tissue, and can help bacteria disseminate
      systemically.
  evidence:
  - reference: PMID:41260154
    reference_title: >-
      Effect of OmpA of Acinetobacter baumannii on apoptosis in pulmonary
      epithelial cells and its molecular mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      In vivo experiments confirmed that OmpA deficiency significantly
      alleviated inflammatory damage, alveolar structural disruption, and
      peribronchial inflammatory cell infiltration in SD rat lung tissue.
    explanation: >-
      A rat lung infection model supports OmpA as a contributor to pulmonary
      inflammation and alveolar damage.
  - reference: PMID:17760880
    reference_title: Acinetobacter baumannii outer membrane protein A targets the nucleus and induces cytotoxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      AbOmpA translocates to the nucleus by a novel monopartite nuclear
      localization signal (NLS).
    explanation: >-
      Supports nuclear trafficking as one host-cell route for OmpA
      cytotoxicity.
  - reference: PMID:33436835
    reference_title: >-
      Outer membrane vesicles containing OmpA induce mitochondrial fragmentation
      to promote pathogenesis of Acinetobacter baumannii.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      A. baumannii infection in mice also induces mitochondrial damage in
      alveolar macrophages in an OmpAAb dependent manner.
    explanation: >-
      An in-vivo mouse result showing OmpA-dependent mitochondrial damage in
      alveolar macrophages, grounding the macrophage cell type of this node.
- name: Inflammatory Pneumonia and Barrier Breach
  biological_scale: TISSUE
  description: >-
    OmpA-mediated alveolar epithelial damage and innate inflammatory signaling
    generate A. baumannii pneumonia and can breach the pulmonary barrier,
    letting the organism seed bacteremia and sepsis.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Pneumonia
    description: >-
      Inflammatory lung injury and alveolar barrier breach present clinically as
      Acinetobacter pneumonia.
  - target: Bacteremia and Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe nosocomial pneumonia can progress to bloodstream infection,
      septic shock, and organ failure.
  evidence:
  - reference: PMID:36272902
    reference_title: Treatment of Acinetobacter baumannii severe infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A. baumannii can cause a variety of infections, especially
      ventilator-associated pneumonia, bacteremia, and skin wound infections,
      among others.
    explanation: >-
      Summarizes pneumonia, bacteremia, and wound disease as common severe A.
      baumannii clinical manifestations.
- name: Bacteremia and Sepsis
  biological_scale: ORGANISM
  description: >-
    A. baumannii can disseminate from a pulmonary or device-associated focus
    into blood, where bacteremia worsens carbapenem-resistant A. baumannii
    nosocomial pneumonia survival and can progress to sepsis or septic shock.
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Bacteremic sepsis
    description: >-
      Bloodstream infection manifests clinically as bacteremic sepsis.
  - target: Fever
    description: >-
      Systemic bloodstream infection produces fever.
  - target: Endocarditis
    description: >-
      Hematogenous seeding can produce infective endocarditis.
  evidence:
  - reference: PMID:38852767
    reference_title: >-
      The impact and risk factors for developing pneumogenic bacteremia in
      carbapenem-resistant Acinetobacter baumannii nosocomial pneumonia in the
      intensive care unit: A multicenter retrospective study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The bacteremia group had 22.4 percentage of increase in-hospital
      mortality than the non-bacteremia group (68.3% vs 45.9%, P < 0.001).
    explanation: >-
      Quantifies the mortality increase observed when CRAB nosocomial pneumonia
      was accompanied by bacteremia.
- name: Carbapenem and Colistin Resistance
  biological_scale: MOLECULAR
  description: >-
    OXA-type carbapenemases dominate carbapenem resistance in A. baumannii, and
    colistin resistance can involve PmrABC-driven lipid A modification, membrane
    remodeling, and metabolic reprogramming, creating therapeutic-failure risk
    after selection by antibiotic exposure.
  evidence:
  - reference: PMID:42549848
    reference_title: Therapeutic options for carbapenem-resistant Acinetobacter baumannii infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Worldwide, OXA-type carbapenemases are the predominant mechanism of
      resistance; other mechanisms, including efflux pumps, porin mutations,
      and, rarely, metallo-beta-lactamases, may contribute to resistance in
      resistant isolates, complicating management.
    explanation: >-
      Supports OXA carbapenemase dominance among mechanisms of carbapenem
      resistance in A. baumannii.
  - reference: PMID:41890236
    reference_title: >-
      Integrated Proteomics and Metabolomics Reveal Multifaceted Mechanisms of
      Colistin Resistance in Acinetobacter baumannii.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Colistin resistance in A. baumannii appears to involve a multifaceted
      strategy integrating lipid A modification, cell membrane remodeling, and
      metabolic reprogramming.
    explanation: >-
      Supports lipid-A and membrane remodeling as molecular features of a
      colistin-resistant XDR-CRAB isolate.


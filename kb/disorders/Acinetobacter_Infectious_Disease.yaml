animal_models:
- name: Neutropenic BALB/c mouse intranasal A. baumannii lung infection model
  species: Mouse
  genotype: Wild-type BALB/c rendered neutropenic, infected intranasally with wild-type vs. delta-ompA A. baumannii Ab17978
  description: >-
    Neutropenic BALB/c mice inoculated intranasally with 10^7 CFU of A.
    baumannii develop OmpA-dependent pulmonary outgrowth, alveolar macrophage
    mitochondrial fragmentation, and systemic dissemination to the liver,
    kidneys, and spleen within 24 hours.
  associated_phenotypes:
  - Pneumonia
  - Bacteremic sepsis
  modeled_mechanisms:
  - target: OmpA and OMV Host-Cell Injury
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Intranasal mouse infection demonstrates OmpA-dependent mitochondrial
      damage in alveolar macrophages in vivo.
    limitations: >-
      Requires induced neutropenia and high intranasal inoculum (10^7 CFU) to
      model acute 24-hour pulmonary outgrowth.
  - target: Bacteremia and Sepsis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Wild-type and OmpA-complemented A. baumannii, but not delta-ompA mutants,
      disseminate from the lungs to liver, kidneys, and spleen by 24 hours
      post-infection.
    limitations: >-
      Acute 24-hour neutropenic mouse dissemination model does not capture
      prolonged human ICU mechanical ventilation or device-associated biofilm
      colonization.
  evidence:
  - reference: PMID:33436835
    reference_title: >-
      Outer membrane vesicles containing OmpA induce mitochondrial fragmentation
      to promote pathogenesis of Acinetobacter baumannii.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      A. baumannii infection in mice also induces mitochondrial damage in
      alveolar macrophages in an OmpAAb dependent manner. We finally show that
      OmpAAb is also required for systemic dissemination in the mouse lung
      infection model.
    explanation: >-
      Demonstrates in vivo OmpA-dependent alveolar macrophage mitochondrial
      injury and systemic extrapulmonary dissemination in mice.
- name: Sprague-Dawley rat A. baumannii lung injury model
  species: Rat
  genotype: Sprague-Dawley rats infected with wild-type vs. OmpA-deficient A. baumannii
  description: >-
    In vivo lung infection in Sprague-Dawley rats models OmpA-driven pulmonary
    epithelial apoptosis, alveolar structural disruption, and peribronchial
    inflammatory infiltration mediated by Beclin-1, JNK1, Drp-1, and
    caspase-3/9 upregulation.
  associated_phenotypes:
  - Pneumonia
  modeled_mechanisms:
  - target: OmpA and OMV Host-Cell Injury
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      OmpA deficiency in vivo reduces Drp-1 and caspase-3/9 activation and
      alleviates pulmonary epithelial apoptosis in rat lung tissue.
    limitations: >-
      Experimental rodent infection model does not replicate chronic ventilator
      circuit colonization in human ICUs.
  - target: Inflammatory Pneumonia and Barrier Breach
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Rat lung infection reproduces alveolar structural disruption and
      peribronchial inflammatory cell infiltration that are attenuated by OmpA
      deletion.
    limitations: >-
      Acute rodent lung injury model differs from human polymorbid ICU
      ventilator-associated pneumonia.
  evidence:
  - reference: PMID:41260154
    reference_title: >-
      Effect of OmpA of Acinetobacter baumannii on apoptosis in pulmonary
      epithelial cells and its molecular mechanism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      In vivo experiments confirmed that OmpA deficiency significantly
      alleviated inflammatory damage, alveolar structural disruption, and
      peribronchial inflammatory cell infiltration in SD rat lung tissue.
    explanation: >-
      Confirms OmpA-dependent alveolar disruption and pulmonary inflammation in
      the Sprague-Dawley rat lung infection model.

review_notes: >-
  Duplicate preflight found no Acinetobacter-named files in an ignored-inclusive
  local search of kb/disorders, stubs, research, and history/disorders; origin/main
  searches for MONDO:0006635 and Acinetobacter only found incidental Klebsiella
  pneumonia differential-diagnosis text; all-state GitHub PR search returned no
  Acinetobacter work; all-state GitHub issue search via GET /search/issues
  returned total_count 0. Deep research requested falcon but fell back to
  OpenScientist, producing
  research/Acinetobacter_Infectious_Disease-deep-research-openscientist.md with
  44/44 references resolved and 39/44 on-topic. Term validation set needs_review
  because the report mislabeled HP:0001647 as endocarditis and HP:0000010 as
  UTI; endocarditis was rebound to HP:0100584 and generic UTI was omitted. The
  report passed manual identity review after preflight-dr returned SKIP for this
  non-Mendelian MONDO term. Most mechanisms were curated from A. baumannii or
  ACB-complex evidence and should not be generalized to every Acinetobacter
  species without review. Scope (design decisions section 3e): this is a
  genus-agent entry. The pathophysiology curates the shared
  opportunistic-pathogen pathway (device-associated environmental acquisition,
  biofilm surface persistence, and OmpA/OMV host-cell injury) together with the
  dominant invasive pneumonia and bacteremia/sepsis pathway that drives severe
  disease and mortality. Localized forms such as urinary tract and wound
  infection share the upstream colonization and biofilm steps but not the
  invasive terminal nodes, and are described as clinical presentations rather
  than carried as separate pathophysiology. MONDO has no species- or
  syndrome-specific Acinetobacter subtype terms to anchor a has_subtypes split,
  so the scope is declared here rather than structured as subtypes.

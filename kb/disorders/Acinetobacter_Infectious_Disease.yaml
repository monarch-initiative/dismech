name: Acinetobacter Infectious Disease
creation_date: "2026-09-30T07:10:16Z"
description: >-
  Acinetobacter infectious disease is an acquired, usually
  healthcare-associated infection caused by Acinetobacter species,
  predominantly Acinetobacter baumannii. It can present as
  ventilator-associated or hospital-acquired pneumonia, bacteremia with sepsis,
  wound and skin infection, urinary tract infection, meningitis, or rare
  endocarditis, with carbapenem-resistant A. baumannii causing difficult
  ICU outbreaks.
category: Infectious Disease
disease_term:
  preferred_term: Acinetobacter infectious disease
  term:
    id: MONDO:0006635
    label: Acinetobacter infectious disease
parents:
- Bacterial Infection
synonyms:
- Acinetobacter infection
- Acinetobacter disease or disorder
- Acinetobacter baumannii infection
- carbapenem-resistant Acinetobacter baumannii infection
- Mimae infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:42178970
      reference_title: "ESKAPE pathogens and antimicrobial resistance: emerging trends and therapeutic challenges."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Among the most-concerning multidrug-resistant (MDR) pathogens are the
        ESKAPE organisms (Enterococcus faecium, Staphylococcus aureus,
        Klebsiella pneumoniae, Acinetobacter baumannii, Pseudomonas aeruginosa,
        and Enterobacter spp.)
      explanation: >-
        Frames A. baumannii as a clinically important antimicrobial-resistant
        bacterial pathogen.

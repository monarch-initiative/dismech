- name: Impaired Wnt-Dependent Intestinal Stem Cell Renewal
  description: >-
    A second, matrix-independent route to the gut phenotype, shown so far only
    in mouse. CMG2 knockout mice have a normal colon until colitis is induced;
    they then fail to regenerate the epithelium because the Wnt-dependent
    transition from fetal-like cells to Lgr5-positive adult stem cells is
    blocked, with defective beta-catenin nuclear translocation. The authors
    propose CMG2 as a context-specific modulator of Wnt signalling. Whether
    this operates in affected children has not been shown, so the human
    inference is explicit rather than demonstrated and the node is recorded
    with a knowledge gap attached.
  biological_scale: CELLULAR
  node_class: IMPAIRED_REPAIR

  description: >-
    Weakness and hypotonia alongside the contractures. In the Antxr2-null
    mouse the corresponding change is collagen VI accumulation in
    intramuscular connective tissue with maladaptive hypertrophy and
    myopathic features; that mechanism has not been demonstrated in patients.

name: Hyaline Fibromatosis Syndrome
creation_date: "2026-11-13T09:00:00Z"
category: Mendelian
synonyms:
- HFS
- infantile systemic hyalinosis
- juvenile hyaline fibromatosis
- systemic hyalinosis
- ANTXR2-related hyaline fibromatosis syndrome
- Murray-Puretic-Drescher syndrome
- fibromatosis hyalinica multiplex juvenilis
disease_term:
  preferred_term: hyaline fibromatosis syndrome
  term:
    id: MONDO:0009229
    label: hyaline fibromatosis syndrome
parents:
- Connective tissue disease
- Primary osteolysis
description: >-
  Hyaline fibromatosis syndrome (HFS, OMIM 228600) is an ultra-rare autosomal
  recessive connective tissue disorder caused by biallelic loss-of-function
  variants in ANTXR2 (also called CMG2, capillary morphogenesis gene 2). It is
  the unifying term for two conditions described separately for decades and
  shown in 2003 to be allelic: the milder juvenile hyaline fibromatosis and the
  severe, usually lethal infantile systemic hyalinosis. The defining lesion is
  progressive deposition of amorphous, PAS-positive, diastase-resistant hyaline
  extracellular matrix in skin, gingiva, periarticular tissue, bone and, in the
  severe form, the viscera. ANTXR2 encodes a single-pass type I transmembrane
  receptor with an extracellular von Willebrand factor type A domain and an
  immunoglobulin-like domain. Its physiological role is the turnover of
  collagen VI: ligand binding triggers release of talin and recruitment of
  RhoA, and this switch is required for receptor-mediated internalisation and
  intracellular degradation of collagen VI. When ANTXR2 is lost, collagen VI
  is no longer cleared and accumulates extracellularly, which is the material
  seen histologically as hyaline. Children present at or soon after birth with
  extreme pain on minimal handling, painful joint stiffness and contractures,
  thickened skin with pearly papules and subcutaneous nodules, hyperpigmented
  patches over bony prominences, gingival hypertrophy and fleshy perianal
  masses. The severe form adds protein-losing enteropathy, intractable
  diarrhoea, recurrent infection and failure to thrive, with death usually
  before the second birthday. Cognitive development is normal. Severity tracks
  with the position of the variant: missense changes in exons 1 to 12 and
  variants producing a premature stop codon give the severe form, while
  missense variants in exons 13 to 17 give the mild form. No curative therapy
  exists.
notes: >-
  Scope and lumping. This entry covers hyaline fibromatosis syndrome as the
  single ANTXR2 disease. Juvenile hyaline fibromatosis (MONDO:0016071) and
  infantile systemic hyalinosis (MONDO:0016331) are recorded as has_subtypes
  rather than as separate entries, because they are allelic forms of one
  disorder distinguished by severity and not by mechanism, and because the
  field has replaced them with a four-grade severity scale. The two historical
  names are kept in synonyms so the older literature is findable.
  GeneReviews baseline. A disease-specific GeneReviews chapter exists
  (PMID:20301698, Hyaline Fibromatosis Syndrome) and is tagged in references.
  Its Clinical Characteristics section was used as the phenotype baseline.
  Features it names that are not separately recorded below are covered by a
  recorded phenotype: pearly papules of the face and neck and skin nodules are
  recorded as Subcutaneous Nodules, hyperpigmented macules over bony
  prominences as Hyperpigmentation Over Bony Prominences, inadequate weight
  gain as Failure to Thrive, and the chapter's statement that cognitive
  development is normal is a negative finding and so is not recorded as a
  phenotype. Osteopenia, periosteal reaction and lucent bone lesions from its
  Diagnosis/Testing section are recorded as Osteopenia and Osteolytic Bone
  Lesions; villous atrophy and lymphangiectasia from the same section are
  recorded in the Protein-Losing Enteropathy phenotype description.
  Orphanet. ORPHA:2176 is Orphanet's record for infantile systemic hyalinosis
  and maps exactly to MONDO:0016331, the severe subtype, not to this entry's
  MONDO:0009229, so it is cited only for the severe form's prevalence and not
  as a record of the whole disease. Its phenotype table lists several features
  at Very frequent that the molecular case series and the GeneReviews chapter
  do not support for this disease (polycystic ovaries, macrocephaly,
  urticaria, adrenal abnormality), so that table was not transcribed; the
  phenotypes below come from the GeneReviews chapter and from the molecular
  case series instead.
  Term binding. The deep-research report suggested HP:0000704 for gingival
  overgrowth, HP:0100242 for subcutaneous nodules and CL:0002254 for
  intestinal stem cell; its own term-validation section flags all three as
  mislabelled, and OLS confirms they are Periodontitis, Sarcoma and epithelial
  cell of small intestine respectively. None of the three is used. The terms
  bound below were each looked up in OLS at the time of writing.
  Fibro-adipogenic progenitors have no Cell Ontology term; CL:0000134
  mesenchymal stem cell is bound with the specific cell named in
  preferred_term.
  Not cited, and why. The report's remaining citations were read and left out
  where they add no claim this entry makes: PMID:24390076 (murine cervical
  remodelling and dystocia) and PMID:35212873 (CMG2 in endothelial chemotaxis)
  describe Antxr2-null mouse phenotypes with no human counterpart recorded
  here; PMID:38989346, PMID:30152846, PMID:22300424, PMID:39258861 and
  PMID:33120290 are single case reports whose claims are already carried by
  the larger series; PMID:42409807 is cited in the report for an S-acylation
  mechanism that is not yet connected to a clinical feature.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two loss-of-function ANTXR2 alleles, homozygous
    in consanguineous families and compound heterozygous otherwise. Carrier
    parents are unaffected and the recurrence risk is 25% per pregnancy.
  evidence:
  - reference: PMID:14508707
    reference_title: "Mutations in the gene encoding capillary morphogenesis protein 2 cause juvenile hyaline fibromatosis and infantile systemic hyalinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile hyaline fibromatosis (JHF) and infantile systemic hyalinosis (ISH) are autosomal recessive conditions characterized by multiple subcutaneous skin nodules, gingival hypertrophy, joint contractures, and hyaline deposition."
    explanation: The founding molecular study states the recessive inheritance of both forms.
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HFS is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for an ANTXR2 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected"
    explanation: GeneReviews states the inheritance pattern and the sibling recurrence risk.
  - reference: PMID:29801470
    reference_title: "The genetic basis of hyaline fibromatosis syndrome in patients from a consanguineous background: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we describe four cases of HFS from consanguineous backgrounds."
    explanation: Homozygous variants in consanguineous families, as expected for a recessive disorder.
has_subtypes:
- name: JHF
  display_name: Juvenile hyaline fibromatosis (mild form)
  description: >-
    The milder, historically separate presentation. Onset is in infancy or
    early childhood with papulonodular skin lesions, large subcutaneous
    swellings, gingival hypertrophy and osteolytic bone lesions, without the
    infantile painful phase or the visceral complications. Survival into
    adulthood is usual. Associated with missense variants in exons 13 to 17.
  evidence:
  - reference: PMID:33173631
    reference_title: "Juvenile Hyaline Fibromatosis: Literature Review and a Case Treated With Surgical Excision and Corticosteroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JHF is a relatively mild presentation of the hyaline fibromatosis syndrome (HFS) family of diseases, with Infantile hyaline fibromatosis (IHF) being the more lethal form."
    explanation: Positions JHF as the mild pole of the same disease.
  - reference: PMID:21328543
    reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually do not present these complications and do not have the infantile painful phase, but do present cutaneous tumours and debilitating loss of joint mobility"
    explanation: >-
      Describes what the mild form does and does not include. The quoted
      sentence's subject, which is juvenile hyaline fibromatosis, is dropped
      from the quote because the bracketed MIM number inside it does not
      survive snippet normalisation.
- name: ISH
  display_name: Infantile systemic hyalinosis (severe form)
  description: >-
    The severe, life-limiting presentation, corresponding to grades 3 and 4 of
    the severity scale. It manifests in the first weeks of life with painful
    swelling of the skin and large joints, and adds visceral hyaline
    deposition, protein-losing enteropathy, intractable diarrhoea, recurrent
    infection and failure to thrive. Associated with truncating variants and
    with missense variants in exons 1 to 12.
  evidence:
  - reference: PMID:21328543
    reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "manifests in the first weeks of life by painful swelling of the skin and the large joints as well as oedema of the skin"
    explanation: >-
      Defines the neonatal onset of the severe form. The quoted sentence's
      subject, which is infantile systemic hyalinosis, is dropped from the
      quote because the bracketed MIM number inside it does not survive
      snippet normalisation.
  - reference: PMID:30176098
    reference_title: "Hyaline fibromatosis syndrome: Clinical update and phenotype-genotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age of death of grade 4 cases is 15.0 months (p25-p75: 9.5-24.0)."
    explanation: Mortality of the life-limiting grade in the 84-case review.
genetic:
- name: ANTXR2
  gene_term:
    preferred_term: ANTXR2
    term:
      id: hgnc:21732
      label: ANTXR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic loss-of-function variants, homozygous or compound heterozygous
  notes: >-
    More than 40 ANTXR2 variants have been reported. The allele classes are
    missense changes in the extracellular von Willebrand factor A and
    immunoglobulin-like domains, frameshift and nonsense changes, and splice
    variants. relationship_type is CAUSATIVE because ClinGen rates the
    ANTXR2 to hyaline fibromatosis syndrome relationship Definitive
    (autosomal recessive, Syndromic Disorders GCEP); that assertion is
    recorded under gene_disease_validity.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
  evidence:
  - reference: PMID:14508707
    reference_title: "Mutations in the gene encoding capillary morphogenesis protein 2 cause juvenile hyaline fibromatosis and infantile systemic hyalinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now report the identification of 15 different mutations in the gene encoding capillary morphogenesis protein 2 (CMG2) in 17 families with JHF or ISH."
    explanation: The founding study that identified ANTXR2/CMG2 as the causal gene across both forms.
  - reference: PMID:29801470
    reference_title: "The genetic basis of hyaline fibromatosis syndrome in patients from a consanguineous background: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 40 mutations in the ANTXR2 gene have been associated with cases of HFS."
    explanation: Size of the reported allelic spectrum.
  - reference: PMID:30176098
    reference_title: "Hyaline fibromatosis syndrome: Clinical update and phenotype-genotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review provides evidence to reinforce the previous hypothesis that missense mutations in exons 1-12 and mutations leading to a premature stop codon lead to the severe form of the disease, while missense pathogenic variants in exons 13-17 lead to the mild form of the disease."
    explanation: The exon-position rule relating allele to severity.
  variants:
  - name: c.1073dup (p.Ala359Cysfs*13)
    description: >-
      A recurrent frameshift duplication reported in unrelated consanguineous
      families from different populations. Haplotype analysis in one series
      argued against a single ancient founder and for recurrent origin. It is
      a candidate for escaping nonsense-mediated decay. Associated with the
      severe form.
    type: frameshift variant
    gene:
      preferred_term: ANTXR2
      term:
        id: hgnc:21732
        label: ANTXR2
    evidence:
    - reference: PMID:29801470
      reference_title: "The genetic basis of hyaline fibromatosis syndrome in patients from a consanguineous background: a case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis was performed to determine the origin of this mutation in this consanguineous cohort, which suggested that it may develop sporadically in different populations."
      explanation: Recurrent rather than founder origin of this allele.
    - reference: PMID:38814306
      reference_title: "Hyaline fibromatosis syndrome: a rare, yet recognizable syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sanger sequencing was performed in 3 patients and homozygous c.945T>G p.(Cys315Trp), c.1073dup p.(Ala359CysfsTer13), and c.1074del p.(Ala359HisfsTer50) variants were identified in ANTXR2."
      explanation: Independent observation of the same allele in a Turkish cohort.
  - name: c.945T>G (p.Cys315Trp)
    description: >-
      A missense variant replacing a cysteine of the immunoglobulin-like
      domain. In transfected cells the corresponding mutant fails to form its
      disulphide bonds, is retained in the endoplasmic reticulum and is
      targeted to ER-associated degradation, so little protein reaches the
      cell surface.
    type: missense variant
    gene:
      preferred_term: ANTXR2
      term:
        id: hgnc:21732
        label: ANTXR2
    evidence:
    - reference: PMID:21328543
      reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations in the Ig-like domain prevent proper disulphide bond formation and are more efficiently targeted to ER-associated degradation."
      explanation: Cell-level consequence of Ig-like domain cysteine substitutions, of which p.Cys315Trp is one.
    - reference: PMID:38814306
      reference_title: "Hyaline fibromatosis syndrome: a rare, yet recognizable syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sanger sequencing was performed in 3 patients and homozygous c.945T>G p.(Cys315Trp), c.1073dup p.(Ala359CysfsTer13), and c.1074del p.(Ala359HisfsTer50) variants were identified in ANTXR2."
      explanation: Observation of this allele in homozygous form in a patient.
prevalence:

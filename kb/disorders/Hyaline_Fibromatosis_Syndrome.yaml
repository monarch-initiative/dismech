  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    84 cases had been published at the time of the 2018 review, and later
    reports put the cumulative total near 100. HFS is strongly associated with
    consanguineous backgrounds.
  evidence:
  - reference: PMID:30176098
    reference_title: "Hyaline fibromatosis syndrome: Clinical update and phenotype-genotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed the 84 published cases and their molecular findings, aiming to gain insight into the clinical features, prognostic factors, and phenotype-genotype correlations."
    explanation: Cumulative published case count in the largest review.
  - reference: PMID:33173631
    reference_title: "Juvenile Hyaline Fibromatosis: Literature Review and a Case Treated With Surgical Excision and Corticosteroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile hyaline fibromatosis (JHF) is an extremely rare autosomal recessive disease with less than a hundred cases reported worldwide and is more prevalent in the middle east due to higher rates of interfamilial marriages."
    explanation: Independent statement of scale and of the consanguinity association.
- population: Worldwide
  subtype: ISH
  measure_type: POINT_PREVALENCE

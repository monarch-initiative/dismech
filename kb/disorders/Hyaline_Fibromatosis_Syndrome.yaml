  notes: >-
    Orphanet's point-prevalence class for ORPHA:2176, which is its record for
    infantile systemic hyalinosis and maps exactly to MONDO:0016331, the
    severe subtype of this entry.
  evidence:
  - reference: ORPHA:2176
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence"
    explanation: Orphanet epidemiology row for the severe form.
pathophysiology:
- name: Biallelic ANTXR2 Loss-of-Function Variant
  description: >-
    Both ANTXR2 alleles carry a loss-of-function change: a missense
    substitution in the extracellular von Willebrand factor A or
    immunoglobulin-like domain, a frameshift or nonsense change, or a splice
    variant. The founding study mapped the locus to chromosome 4q21 and found
    15 different such changes across 17 families covering both the mild and
    the severe presentation.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline and biallelic. Homozygous in the consanguineous families that
      make up much of the literature, compound heterozygous otherwise.
  genes:
  - preferred_term: ANTXR2
    term:
      id: hgnc:21732
      label: ANTXR2
  downstream:
  - target: Endoplasmic Reticulum Retention of Misfolded CMG2
    causal_link_type: DIRECT
    description: >-
      Missense changes in the ectodomain act by misfolding rather than by
      abolishing a binding site, so the protein never leaves the ER.
    evidence:
    - reference: PMID:21328543
      reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "missense mutations that map to the extracellular von Willebrand domain or the here characterized Ig-like domain of CMG2 lead to folding defects and thereby to retention of the mutated protein in the endoplasmic reticulum (ER)."
      explanation: States that this allele class causes ER retention, which is the edge claimed here.
  - target: Loss of Cell-Surface CMG2 Collagen VI Receptor
    causal_link_type: DIRECT
    description: >-
      Frameshift and nonsense alleles reduce ANTXR2 mRNA, apparently through
      nonsense-mediated decay, so no receptor is made at all. This is the
      branch that does not pass through ER retention.
    evidence:
    - reference: PMID:21328543
      reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that these frame-shift mutations lead to a decrease in the mRNA levels of cmg2, presumably due to degradation via the nonsense-mediated mRNA decay (NMD) pathway"
      explanation: Frameshift alleles remove the transcript rather than misfold the protein.
  evidence:
  - reference: PMID:14508707
    reference_title: "Mutations in the gene encoding capillary morphogenesis protein 2 cause juvenile hyaline fibromatosis and infantile systemic hyalinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We previously mapped the gene for JHF to chromosome 4q21. We now report the identification of 15 different mutations in the gene encoding capillary morphogenesis protein 2 (CMG2) in 17 families with JHF or ISH."
    explanation: Establishes the initiating lesion of this entry.
- name: Endoplasmic Reticulum Retention of Misfolded CMG2
  description: >-
    Ectodomain missense mutants fold incorrectly. Immunoglobulin-like domain
    substitutions prevent the correct disulphide bonds from forming. The
    misfolded protein is held in the endoplasmic reticulum and routed to
    ER-associated degradation, so it does not reach the plasma membrane. The
    block is partly reversible: proteasome inhibition in patient fibroblasts
    restores surface CMG2 that is signalling competent, which is what makes
    this step a candidate intervention point rather than simply a consequence.
  biological_scale: MOLECULAR
  node_class: PROTEIN_MISFOLDING_AGGREGATION
  biological_processes:
  - preferred_term: ER-associated degradation of misfolded CMG2
    modifier: INCREASED
    term:
      id: GO:0036503
      label: ERAD pathway
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Loss of Cell-Surface CMG2 Collagen VI Receptor
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21328543
      reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we show that mutant CMG2 can be rescued in fibroblasts of some patients by treatment with proteasome inhibitors and that CMG2 is then properly transported to the plasma membrane and signalling competent"
      explanation: >-
        The rescue experiment is the evidence for the edge: relieving ER
        retention is what restores surface receptor, so retention is what was
        withholding it.
  evidence:
  - reference: PMID:21328543
    reference_title: "Hyaline fibromatosis syndrome inducing mutations in the ectodomain of anthrax toxin receptor 2 can be rescued by proteasome inhibitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in the Ig-like domain prevent proper disulphide bond formation and are more efficiently targeted to ER-associated degradation."
    explanation: The misfolding and degradation route for this allele class.
- name: Loss of Cell-Surface CMG2 Collagen VI Receptor
  description: >-
    Fibroblasts and fibro-adipogenic progenitors lose functional CMG2 from the
    plasma membrane. CMG2 is the cell-surface receptor for collagen VI; the
    receptor is also, incidentally, the entry route for anthrax toxin, which
    is how the gene was first named and how loss of function is assayed.
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  cell_types:
  - preferred_term: fibro-adipogenic progenitor
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Failed Receptor-Mediated Endocytosis of Collagen VI
    causal_link_type: DIRECT
    description: >-
      Without surface receptor there is nothing to execute the ligand-triggered
      talin-to-RhoA switch that drives internalisation.
    evidence:
    - reference: PMID:32428455
      reference_title: "Ligand Binding to the Collagen VI Receptor Triggers a Talin-to-RhoA Switch that Regulates Receptor Endocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrate that effective switching between talin and RhoA binding is required for the intracellular degradation of collagen VI in human fibroblasts, which explains why HFS mutations in the cytoskeleton-binding domain lead to dysregulation of extracellular matrix homeostasis."
      explanation: Links the receptor switch directly to collagen VI degradation and to HFS mutations.
  evidence:
  - reference: PMID:32428455
    reference_title: "Ligand Binding to the Collagen VI Receptor Triggers a Talin-to-RhoA Switch that Regulates Receptor Endocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Capillary morphogenesis gene 2 (CMG2/ANTXR2) is a cell surface receptor for both collagen VI and anthrax toxin. Biallelic loss-of-function mutations in CMG2 lead to a severe condition, hyaline fibromatosis syndrome (HFS)."
    explanation: Identifies the lost protein as the cell-surface collagen VI receptor.
  - reference: PMID:42878719
    reference_title: "FAPs orchestrate ANTXR2-mediated fine-tuning of collagen VI to ensure skeletal muscle function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that ANTXR2 is expressed predominantly by fibro-adipogenic progenitors (FAPs) and mediates internalization of the major ECM component collagen VI (COL6)."
    explanation: Identifies the cell type that carries the receptor.
- name: Failed Receptor-Mediated Endocytosis of Collagen VI
  description: >-
    In the intact pathway, collagen VI binding releases talin from CMG2 in a
    src-dependent manner and recruits RhoA and its effectors, and this switch
    drives internalisation of the receptor with its ligand and subsequent
    intracellular degradation of collagen VI. Without the receptor the switch
    cannot occur and collagen VI is not cleared. Collagen VI gene expression
    is unchanged in Antxr2-null mice, so the defect is in removal rather than
    in production.
  biological_scale: CELLULAR
  node_class: CELLULAR_FUNCTION_DISTURBANCE
  biological_processes:
  - preferred_term: receptor-mediated endocytosis of collagen VI
    modifier: DECREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  - preferred_term: collagen VI catabolism
    modifier: DECREASED
    term:
      id: GO:0030574
      label: collagen catabolic process
  downstream:
  - target: Extracellular Collagen VI Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28604699
      reference_title: "CMG2/ANTXR2 regulates extracellular collagen VI which accumulates in hyaline fibromatosis syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CMG2 loss of function promotes accumulation of collagen VI in patients, leading in particular to nodule formation."
      explanation: States the step from loss of function to extracellular accumulation in patients.
  evidence:
  - reference: PMID:28604699
    reference_title: "CMG2/ANTXR2 regulates extracellular collagen VI which accumulates in hyaline fibromatosis syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "collagen VI accumulates massively in uteri of Antxr2-/- mice, which do not display changes in collagen gene expression"
    explanation: >-
      Unchanged collagen gene expression is what identifies the defect as
      failed clearance rather than overproduction.
  - reference: PMID:32428455
    reference_title: "Ligand Binding to the Collagen VI Receptor Triggers a Talin-to-RhoA Switch that Regulates Receptor Endocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CMG2 binds talin, and thereby the actin cytoskeleton, only in its ligand-free state. Extracellular ligand binding leads to src-dependent talin release and recruitment of the actin cytoskeleton regulator RhoA and its effectors."
    explanation: The molecular switch whose failure blocks internalisation.
- name: Extracellular Collagen VI Accumulation
  description: >-
    Collagen VI, the physiological ligand of CMG2, builds up in the
    extracellular matrix. This is the material that histology reports as
    amorphous, eosinophilic, PAS-positive and diastase-resistant hyaline. That
    the accumulation is specifically collagen VI driven was shown by crossing
    Antxr2-null mice with Col6a1-null mice, which reverses the phenotype.
  biological_scale: TISSUE
  node_class: FIBROSIS_REMODELLING
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Hyaline Deposition in Skin and Gingiva
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28604699
      reference_title: "CMG2/ANTXR2 regulates extracellular collagen VI which accumulates in hyaline fibromatosis syndrome."

histopathology:
- name: Hyaline Matrix with Bland Fibroblasts
  description: >-
    Skin or nodule biopsy shows bland spindle to epithelioid fibroblasts
    embedded in abundant amorphous eosinophilic ground substance that is
    PAS-positive and diastase-resistant. Intestinal biopsy in the severe form
    may show the same hyaline material with villous atrophy and
    lymphangiectasia. The biopsy can also be non-diagnostic, so a normal
    result does not exclude the disease.
  evidence:
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin biopsy may show hyaline material accumulation in the dermis or nondiagnostic findings; intestinal biopsy may demonstrate hyaline material, villous atrophy, and lymphangiectasia."
    explanation: The GeneReviews account of what biopsy shows, including that it can be non-diagnostic.
diagnosis:
- name: ANTXR2 Molecular Testing
  description: >-
    Diagnosis is established by characteristic clinical features together with
    biallelic pathogenic ANTXR2 variants. Testing is by single-gene
    sequencing, exome or genome sequencing.
  evidence:
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of HFS is established in a proband with characteristic clinical features and/or biallelic pathogenic variants in ANTXR2 identified by molecular genetic testing."
    explanation: The diagnostic criterion as stated by GeneReviews.
  - reference: PMID:38814306
    reference_title: "Hyaline fibromatosis syndrome: a rare, yet recognizable syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All coding exons of the ANTXR2 were amplified and sequenced on ABI Prism 3500 Genetic Analyser."
    explanation: Single-gene sequencing as used in a diagnostic cohort.
- name: Anthrax Toxin Binding Assay
  description: >-
    Because CMG2 is the anthrax toxin receptor, resistance of patient cells to
    anthrax toxin is a functional readout of loss of surface receptor and has
    been used to show that a specific variant is loss of function.
  evidence:
  - reference: PMID:33147779
    reference_title: "Enhanced Collagen Deposition in the Duodenum of Patients with Hyaline Fibromatosis Syndrome and Protein Losing Enteropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using an anthrax-toxin assay we showed that the c.155C>T mutation causes loss-of-function of ANTXR2 protein."
    explanation: The assay used as a functional test of an ANTXR2 allele.
treatments:
- name: Surgical Excision of Nodules and Perianal Masses
  description: >-
    Debilitating or obstructing nodules, perianal masses and lesions that
    interfere with the airway or with feeding are excised. Excision gives
    immediate and comparatively durable relief, but lesions recur. The
    GeneReviews chapter also warns that anaesthetists must expect difficult
    endotracheal intubation in these patients.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision of hyaline nodules
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Hyaline Deposition in Skin and Gingiva
    description: Removes the deposited material rather than preventing its formation.
  evidence:
  - reference: PMID:33173631
    reference_title: "Juvenile Hyaline Fibromatosis: Literature Review and a Case Treated With Surgical Excision and Corticosteroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early surgical treatment provided instantaneous and more sustainable results, while corticosteroids can be used as alternative modalities with temporary outcomes."
    explanation: Compares the durability of surgery with that of corticosteroids.
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lesions that obstruct the airway or interfere with feedings can be excised but may recur; anesthesiologists need to be aware of potential difficulties with endotracheal intubation"
    explanation: The GeneReviews indication for excision and its airway-safety warning.
- name: Corticosteroid Therapy for Nodules
  description: >-
    Intralesional or oral corticosteroids reduce nodule size. The effect is
    temporary, so corticosteroids are an alternative where surgery is not
    possible rather than a first choice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Hyaline Deposition in Skin and Gingiva
  evidence:
  - reference: PMID:33173631
    reference_title: "Juvenile Hyaline Fibromatosis: Literature Review and a Case Treated With Surgical Excision and Corticosteroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corticosteroids can be used as alternative modalities with temporary outcomes"
    explanation: States the role and the limit of corticosteroid treatment.
- name: Pain Management
  description: >-
    Non-steroidal anti-inflammatory drugs, gabapentin and potentially baclofen
    are used for pain, with gentle handling, splinting to reduce pain, and
    referral to a pain management specialist. Pain control is central because
    the pain itself limits what physiotherapy can achieve.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pain Therapy
    term:
      id: NCIT:C15180
      label: Pain Therapy
  target_mechanisms:
  - target: Severe Pain on Handling
  evidence:
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nonsteroidal anti-inflammatory drugs, gabapentin, and/or potentially baclofen for pain; gentle handling; splinting may reduce pain; consultation with a pain management specialist"
    explanation: The GeneReviews pain management recommendation.
- name: Nutritional Support and Albumin Infusion
  description: >-
    Early nasogastric or gastrostomy feeding, or parenteral nutrition, under a
    gastroenterologist and dietitian, with nutrition tailored for
    malabsorption or lymphangiectasia, and hydration plus albumin infusions
    for protein-losing enteropathy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Protein-Losing Enteropathy
  - target: Failure to Thrive
  evidence:
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early consideration of nasogastric tube, gastrostomy tube feeding, or parenteral nutrition under supervision of a gastroenterologist and nutritionist; nutrition tailored for the possibility of malabsorption or lymphangiectasia; hydration and albumin infusions for protein-losing enteropathy"
    explanation: The GeneReviews nutritional management recommendation.
- name: Physical Therapy for Contractures
  description: >-
    Physiotherapy can be considered for the joint contractures, but pain
    frequently limits it, which is why the GeneReviews chapter qualifies the
    recommendation rather than making it unconditional.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Joint Contractures
  evidence:
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "physical therapy for joint contractures can be considered although pain may be problematic"
    explanation: The qualified GeneReviews recommendation.
- name: Genetic Counseling and Reproductive Testing
  description: >-
    Once the family's ANTXR2 variants are known, carrier testing for at-risk
    relatives and prenatal or preimplantation genetic testing become possible.
    This is the only preventive option for a recessive monogenic disorder and
    matters most in the consanguineous families where the disease clusters.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301698
    reference_title: "Hyaline Fibromatosis Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the ANTXR2 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: The GeneReviews genetic counselling statement.
progression:
- phase: Neonatal and infantile onset
  notes: >-
    Onset is at birth or in early infancy. The severe form presents in the
    newborn period with extreme pain on handling and skin and joint swelling;
    in most cases the first sign in the first year is joint stiffness or
    contracture.
  evidence:
  - reference: PMID:33147779
    reference_title: "Enhanced Collagen Deposition in the Duodenum of Patients with Hyaline Fibromatosis Syndrome and Protein Losing Enteropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most cases, disease onset occurs within the first year of life, characterized by joint stiffness or contracture."
    explanation: Age and mode of onset.
- phase: Progressive deposition
  notes: >-
    The course is chronic and progressive without remission. Nodules increase
    in number and size with age and recur after excision; contractures worsen.
  evidence:
  - reference: PMID:28604699
    reference_title: "CMG2/ANTXR2 regulates extracellular collagen VI which accumulates in hyaline fibromatosis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the hallmark of which is the progressive growth of subcutaneous nodules"
    explanation: The progressive character of the lesions.
- phase: Severe-form mortality
  notes: >-
    In the severe form death follows from intractable diarrhoea, recurrent
    infection or organ failure, at a median of 15 months in grade 4 patients.
    The milder form is compatible with survival into adulthood.
  subtype: ISH
  evidence:
  - reference: PMID:30176098
    reference_title: "Hyaline fibromatosis syndrome: Clinical update and phenotype-genotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Causes of death are intractable diarrhea, recurrent infections, and organ failure. Median age of death of grade 4 cases is 15.0 months (p25-p75: 9.5-24.0)."
    explanation: Causes and timing of death in the life-limiting grade.
differential_diagnoses:
- name: Winchester syndrome
  description: >-
    Another primary osteolysis with contractures and thickened skin, listed in
    the deep-research report's differential alongside juvenile rheumatoid
    arthritis, lipoid proteinosis, Farber disease, neurofibromatosis and
    isolated gingival fibromatosis. It is distinguished molecularly: Winchester
    syndrome is MMP14-related, whereas this disease is ANTXR2-related.
- name: Juvenile idiopathic arthritis
  description: >-
    Shares painful joint stiffness and contractures in a young child, but
    without the hyaline skin and gingival deposits and without the
    characteristic PAS-positive diastase-resistant biopsy.
discussions:
- kind: HUMAN_MODEL_MISMATCH
  discussion_id: hfs_intestinal_stem_cell_human_evidence
  prompt: >-
    Does the Wnt-dependent intestinal stem cell renewal defect shown in CMG2
    knockout mice operate in children with hyaline fibromatosis syndrome, and
    if so how does it relate to the duodenal collagen VI deposition shown
    directly in patients?
  rationale: >-
    Two mechanisms are on offer for the gut phenotype and they are not the
    same claim. Patient tissue shows collagen VI deposition in the duodenum,
    and the authors of that work explicitly call its role in protein-losing
    enteropathy likely rather than established. The stem-cell renewal defect
    is a mouse result and requires induced colitis before any phenotype
    appears at all, so it is a regeneration-failure mechanism rather than a
    baseline one. Patient-derived and ANTXR2-knockout intestinal organoids
    grew, polarised and formed monolayers normally, which argues against a
    constitutive epithelial defect but does not test regeneration after
    injury. Which mechanism dominates matters for management, because the
    mouse work raises the possibility of treatments used in inflammatory bowel
    disease.
  attaches_to:
  - pathophysiology#Impaired Wnt-Dependent Intestinal Stem Cell Renewal
  - phenotypes#Intractable Diarrhea
  proposed_experiments:
  - experiment_id: hfs_organoid_injury_regeneration
    name: Regeneration assay in patient-derived intestinal organoids after injury
    description: >-
      The published organoid work tested steady-state growth and monolayer
      formation. Testing the same patient-derived and ANTXR2-knockout
      organoids for the fetal-like to Lgr5-positive transition after an injury
      stimulus would ask the question the mouse experiment asked, in human
      cells.
    readouts:
    - name: Lgr5-positive stem cell fraction after injury
      target: pathophysiology#Impaired Wnt-Dependent Intestinal Stem Cell Renewal
      direction: DECREASED
      interpretation: >-
        A reduced Lgr5-positive fraction in patient organoids after injury
        would carry the mouse mechanism into human cells.
    would_support:
    - pathophysiology#Impaired Wnt-Dependent Intestinal Stem Cell Renewal
    supporting_outcome:
    - >-
      Patient-derived and knockout organoids fail to restore the
      Lgr5-positive compartment after injury while control organoids recover.
    refuting_outcome:
    - >-
      Patient-derived and knockout organoids regenerate normally after injury,
      which would leave duodenal matrix change as the sole recorded mechanism
      for the gut phenotype.

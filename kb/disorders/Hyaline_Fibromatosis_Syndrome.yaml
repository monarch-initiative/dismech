- name: Duodenal Collagen VI Deposition
  description: >-
    Collagen VI accumulates in the duodenal wall, demonstrated by electron
    microscopy and second harmonic generation imaging in affected patients.
    Intestinal organoids derived from a patient and CRISPR ANTXR2 knockout
    organoids grew and polarised normally and formed monolayers normally, so
    the epithelium itself is not primarily defective; the abnormality is in
    the matrix around it. This is the reason protein-losing enteropathy is
    placed downstream of matrix change rather than of epithelial failure.

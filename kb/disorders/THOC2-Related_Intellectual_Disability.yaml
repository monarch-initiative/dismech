prevalence:
- population: Published individuals worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The disorder was defined in 2015 from four families; by 2020 the cumulative
    published series had reached 10 further individuals from nine families plus
    an intragenic deletion case, with 14 missense variants functionally tested.
    No population prevalence estimate exists.
  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report 10 individuals from nine families with rare missense THOC2 variants including the first case of a recurrent variant (p.Arg77Cys), and an additional individual with an intragenic THOC2 microdeletion (Del-Ex37-38)."
    explanation: Quantifies the published caseload of the largest expansion series, supporting an ultra-rare classification.
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X chromosome exome sequencing revealed four missense variants in THOC2 in four families, including family MRX12, first ascertained in 1971."
    explanation: The defining series comprised four families, establishing the rarity of the disorder at first description.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  description: >-
    THOC2 is on the X chromosome and the disorder is X-linked, with affected males
    and typically milder or unaffected carrier females. Both inherited and de novo
    variants occur: the original families were ascertained through X-linked
    intellectual disability pedigrees, and a de novo variant has been documented
    in a female with epileptic encephalopathy, so the disorder is not confined to
    transmitting families. Heterozygous carrier mothers are clinically unaffected
    and, where tested, show highly skewed X-chromosome inactivation, which is the
    proposed explanation for their non-penetrance; the one severely affected female
    reported carried a de novo variant and her XCI status could not be assessed.
  evidence:
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that variants in THOC2, which encodes a subunit of the highly conserved TREX mRNA-export complex, cause syndromic intellectual disability (ID)."
    explanation: The defining report establishing THOC2 as a cause of syndromic intellectual disability, ascertained through X-linked intellectual disability families.
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present detailed clinical assessment and functional studies on a de novo variant in a female with an epileptic encephalopathy"
    explanation: Documents a de novo THOC2 variant in an affected female, showing the disorder is not restricted to inherited male-transmitted cases.
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygous mothers were clinically unaffected, and, where available, X-chromosome inactivation (XCI) was highly skewed"
    explanation: Establishes skewed X-inactivation in carrier mothers as the observed correlate of their non-penetrance, which is the substance of the X-linked expressivity claim.
pathophysiology:
- name: Hypomorphic THOC2 Variants Reducing Protein Stability
  biological_scale: MOLECULAR
  description: >-
    Every disease-associated THOC2 allele is hypomorphic rather than null, because
    THOC2 is an essential gene. Two mechanistic classes are documented. Missense
    variants at evolutionarily conserved residues reduce THOC2 protein stability -
    9 of 14 tested missense variants did so across current and published studies.
    Splice-site and intragenic-deletion variants instead produce C-terminally
    truncated THOC2 with loss of small regions of the C-terminal RNA-binding
    domain. Structural modelling places the altered residues in RNA-binding
    domains of two THOC2 conformations, interpreted as different intermediate
    RNA-binding states during RNA transport.
  genes:
  - preferred_term: THOC2
    term:
      id: hgnc:19073
      label: THOC2
  downstream:
  - target: TREX Complex Destabilisation
    causal_link_type: DIRECT
    description: >-
      Reduced THOC2 stability has a flow-on effect on the stability of its partner
      TREX subunits.
    evidence:
    - reference: PMID:26166480
      reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that two variants lead to decreased stability of THOC2 and its TREX-complex partners in cells derived from the affected individuals."
      explanation: Measures the two ends of this edge in the same patient-derived cells - reduced THOC2 stability and reduced stability of its complex partners - which is what makes the link DIRECT.
  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ex vivo missense variant testing and patient-derived cell line data from current and published studies show 9 of the 14 missense THOC2 variants result in reduced protein stability."
    explanation: Quantifies the proportion of tested missense variants that destabilise THOC2, establishing reduced protein stability as the dominant missense mechanism.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The splicing-defective and deletion variants result in a loss of small regions of the C-terminal THOC2 RNA binding domain (RBD)."
    explanation: Defines the second allele class - splice and deletion variants removing part of the C-terminal RNA-binding domain. This is a molecular variant-consequence finding derived from patient-cell cDNA and protein analysis, hence IN_VITRO rather than HUMAN_CLINICAL.
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that two variants lead to decreased stability of THOC2 and its TREX-complex partners in cells derived from the affected individuals."
    explanation: Patient-derived cells demonstrate reduced stability of both THOC2 and its complex partners, the first functional evidence for the mechanism.
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Protein structural modeling showed that the altered amino acids are located in the RNA-binding domains of two complex THOC2 structures, potentially representing two different intermediate RNA-binding states of THOC2 during RNA transport."
    explanation: The localisation of the variants to RNA-binding domains, and the two-intermediate-state interpretation, come from structural modelling rather than experimental structure determination, so this is curated as partial computational support.
- name: TREX Complex Destabilisation
  biological_scale: MOLECULAR
  description: >-
    THOC2 is the largest subunit of the TREX complex, which couples transcription
    to mRNA export. Reduced THOC2 stability propagates to the complex: the
    stability of the other TREX/THOC subunits - specifically those themselves
    associated with neurodevelopmental disorders - falls as a consequence. The
    disorder is therefore a complex-level lesion rather than a single-protein one,
    which is one reason the phenotype overlaps other THOC-subunit disorders.
    Scope of the export claim. The 2015 discovery paper framed the disorder as a
    disturbance of the canonical mRNA-export pathway, and that framing survives at
    the level of the pathway. It does NOT survive as a claim of measurable bulk
    nuclear mRNA retention: when the exon 37-38 deletion allele was tested directly,
    neither mutant mouse primary neurons nor the corresponding patient fibroblasts
    showed overt nuclear retention of mRNAs. The GO annotation below is therefore
    left without a DECREASED modifier - the pathway is the affected one, but a
    quantitative reduction in bulk export has not been demonstrated for a
    disease allele, and the measured downstream consequence is loss of R-loop and
    genome homeostasis rather than transcript sequestration.
  biological_processes:
  - preferred_term: mRNA export from nucleus
    term:
      id: GO:0006406
      label: mRNA export from nucleus
  downstream:
  - target: Perturbed R-Loop Homeostasis and DNA Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Compromised THOC2/TREX function leads to R-loop accumulation, the proposed
      root of the disorder. The intermediates between complex destabilisation and
      hybrid accumulation - whether co-transcriptional RNA packaging, R-loop
      resolution or 3' processing is the failing step - have not been determined.
    evidence:
    - reference: PMID:38331934
      reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Thoc2Δ/Y mouse brain development is significantly impacted by compromised THOC2/TREX function resulting in R-loop accumulation, DNA damage and consequent cell death."
      explanation: States the edge directly - compromised THOC2/TREX function results in R-loop accumulation - without specifying the intervening steps, which is why the link is typed INDIRECT_UNKNOWN_INTERMEDIATES.
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disturbance of the canonical mRNA-export pathway is compatible with life but
      results in altered neuronal development. This edge is retained alongside the
      better-characterised route through R-loop accumulation and cortical
      neurogenesis because the 2015 discovery paper asserts the pathway-to-phenotype
      link directly, without committing to the intervening genome-instability steps.
    evidence:
    - reference: PMID:26166480
      reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results show that disturbance of the canonical molecular pathway of mRNA export is compatible with life but results in altered neuronal development with other comorbidities."
      explanation: States this edge directly - partial disturbance of the export pathway is survivable but produces altered neuronal development - without naming the intermediates, which is why the link is typed INDIRECT_UNKNOWN_INTERMEDIATES.
  - target: Multi-Organ Developmental Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      THOC subunits are ubiquitously expressed, and the congenital anomalies seen
      across several organ systems are attributed by the largest cohort to a role
      for THOC2 in multi-organ development rather than to a secondary consequence
      of the neurological phenotype.
  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, reduced stability of THOC2 variant proteins has a flow-on effect on the stability of the multi-protein TREX complex; specifically on the other NDD-associated THOC subunits."
    explanation: Establishes the complex-level consequence - destabilised THOC2 destabilises its partner THOC subunits, particularly the other NDD-associated ones.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We implicated the X-chromosome THOC2 gene, which encodes the largest subunit of the highly-conserved TREX (Transcription-Export) complex, in a clinically complex neurodevelopmental disorder with intellectual disability as the core phenotype."
    explanation: States THOC2's identity as the largest TREX subunit and confirms intellectual disability as the core phenotype of the disorder.
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results show that disturbance of the canonical molecular pathway of mRNA export is compatible with life but results in altered neuronal development with other comorbidities."
    explanation: States the central paradox of the disorder - an essential housekeeping pathway can be partially disturbed compatibly with life, at the cost of altered neurodevelopment.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Surprisingly, we did not observe any overt nuclear retention of mRNAs"
    explanation: Directly refutes the stronger reading of this node - that the disease allele causes measurable bulk nuclear mRNA retention. The tested material was both mutant mouse primary neurons AND fibroblasts from the patient carrying the same allele, so the negative result has a human arm; it is tagged IN_VITRO because both are cultured cells. Curated as REFUTE so the entry does not overstate the export defect, and it is why the GO annotation on this node carries no DECREASED modifier.
- name: Multi-Organ Developmental Involvement
  biological_scale: ORGANISM
  description: >-
    The non-neurological arm of the disorder. THOC subunits are ubiquitously
    expressed, and the largest cohort concluded that THOC2-related disorder should
    be considered multisystemic in a significant proportion of individuals:
    congenital anomalies of the cardiorespiratory, genitorenal and skeletal systems
    are each present in 10-30%, and the cohort authors attribute these to a role for
    THOC2 in multi-organ development and function rather than to a secondary
    consequence of the neurological phenotype. The molecular route from TREX
    destabilisation to organ malformation has not been investigated - no
    non-neural tissue has been examined in the mouse model or in patient material -
    so this node records a well-evidenced clinical observation with an unevidenced
    mechanism.
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Congenital Cardiac Anomaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital anomalies of the cardiorespiratory system occur in a significant
      minority.
  - target: Genitourinary Anomaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital anomalies of the genitourinary tract occur in a significant
      minority.
  - target: Skeletal Anomaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital anomalies of the skeletal system occur in a significant minority.
  - target: Laryngomalacia and Tracheomalacia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Airway malacia is among the congenital anomalies with increased risk in the
      severe neuromuscular subgroup.
  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "THOC2-related disorder should be considered a multi-systemic disorder in a significant proportion of individuals"
    explanation: The largest cohort's explicit conclusion that the disorder is multisystemic, which is the claim this node represents.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital anomalies of the cardiorespiratory, genitorenal and skeletal systems, severe feeding difficulties and gastroesophageal reflux, and visual and hearing impairments are present in a significant proportion (10–30%)"
    explanation: Enumerates the organ systems affected and gives the 10-30% frequency range shared by the phenotypes downstream of this node.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Further research to explore the underlying pathophysiological basis for these more severe phenotypes is warranted, but likely reflect the involvement of THOC2 in multi-organ development and function."
    explanation: The mechanistic half of this node is the cohort authors' explicitly hedged inference ("likely reflect"), with the accompanying statement that further research is warranted - which is why the node carries PROVISIONAL confidence and is curated as PARTIAL.
- name: Perturbed R-Loop Homeostasis and DNA Damage
  biological_scale: CELLULAR
  description: >-
    The best-supported root mechanism, derived from a mouse model carrying a patient
    allele together with cells from the patient who carries it. Compromised
    THOC2/TREX function allows R-loops (RNA:DNA hybrids with a displaced single
    strand) to accumulate, producing DNA damage and consequent cell death during
    brain development. Two pieces of evidence lift this above a purely
    model-organism inference: R-loops accumulate in the patient's own fibroblasts as
    well as in mutant mouse neural stem cells, and forced RNase H1 expression - which
    degrades the RNA strand of RNA:DNA hybrids - reduces both the R-loop burden and
    the comet-assay DNA damage, placing R-loops upstream of the damage rather than
    alongside it. Confidence is nonetheless held at PROVISIONAL: the rescue
    experiment was performed in mouse neural stem cells rather than patient cells,
    only the exon 37-38 deletion allele has been tested, and no R-loop or DNA-damage
    measurement exists in human brain tissue.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Disrupted Cortical Neurogenesis and Neuronal Maturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      DNA damage and progenitor cell death during corticogenesis translate into
      measurable structural and maturational deficits in the developing cortex.
      The known intermediate is loss of ventricular-zone neural stem cells.
    evidence:
    - reference: PMID:38331934
      reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "reduction in the thickness of the ventricular zone (VZ) of the E18.5 Thoc2"
      explanation: Loss of the ventricular-zone progenitor compartment is the identified intermediate between DNA damage/cell death and the downstream cortical structural deficits, which is why the link is typed INDIRECT_KNOWN_INTERMEDIATES.
  evidence:
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Thoc2Δ/Y mouse brain development is significantly impacted by compromised THOC2/TREX function resulting in R-loop accumulation, DNA damage and consequent cell death."
    explanation: Direct in vivo demonstration of the R-loop, DNA-damage and cell-death chain in the brain of a mouse carrying a patient THOC2 allele.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "indicating R-loops also accumulate in the patient cells"
    explanation: R-loop accumulation is not confined to the mouse - it is reproduced in fibroblasts from the patient whose allele the mouse carries, which is the strongest available human anchor for this node.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced R-loop accumulation (Fig. 7e) and comet tail formation (Fig. 7f) in Thoc2"
    explanation: RNase H1 overexpression lowers both R-loop burden and comet-assay DNA damage in cultured mutant neural stem cells, establishing the R-loop as an upstream cause of the damage rather than a co-occurring marker. Tagged IN_VITRO rather than MODEL_ORGANISM because the rescue was done in cultured cells, not in the animal.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, we suggest that perturbed R-loop homeostasis, in stem cells and/or differentiated cells in mice and the patient, and DNA damage-associated functional alterations are at the root of THOC2 syndrome."
    explanation: The authors frame the R-loop model as a suggestion rather than a demonstrated human mechanism, and the human arm of the claim is inferred from the mouse; this is why the node carries PROVISIONAL mechanism confidence.
- name: Disrupted Cortical Neurogenesis and Neuronal Maturation
  biological_scale: TISSUE
  description: >-
    The tissue-level consequence measured in the patient-allele mouse. Loss of
    neural stem cells from the cortical ventricular zone thins the progenitor
    compartment at embryonic day 18.5, and the cortical plate and corpus callosum
    are correspondingly thinner. Neurons that do form show perturbed migration,
    altered electrophysiological properties and impaired synapse formation. This
    node is what connects the molecular genome-instability lesion to a
    brain-predominant clinical phenotype: the affected compartment is the
    proliferating progenitor pool of the developing cortex, which is why a
    ubiquitously required housekeeping factor produces a predominantly
    neurodevelopmental disease. This node accounts for the neurological arm only -
    the largest cohort concluded that THOC2 disease is also multisystemic in a
    significant proportion of individuals, which is modelled separately in the
    Multi-Organ Developmental Involvement node. All measurements are murine; the
    corresponding human neuroimaging findings are inconsistent: structural MRI was
    normal in three of the five individuals imaged in the 2018 series, and the 2020
    pooled cohort found no unifying neuroradiological abnormality across the
    individuals it reviewed.

phenotypes:
- category: Cognitive
  name: Intellectual Disability
  description: >-
    Intellectual disability is the core phenotype, of variable degree. The largest
    cohort refines the core to language disorder and/or intellectual disability,
    so some individuals have language impairment without frank intellectual
    disability, while a subset has severe-to-profound intellectual disability. The
    2015 defining families spanned borderline to severe intellectual disability;
    the 2018 series, ascertained more severely, found intellectual disability
    universal and at least moderate in all seven individuals. The pooled cohort
    describes the range of cognitive disability as very broad, from a normal IQ to
    profound intellectual disability - one functionally confirmed variant carrier
    had a performance IQ of 104 with an isolated language disorder, which is the
    concrete case behind the "language disorder AND/OR intellectual disability"
    formulation of the core phenotype and the reason this band is not stated as
    obligate.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in a clinically complex neurodevelopmental disorder with intellectual disability as the core phenotype"
    explanation: States intellectual disability as the core phenotype of the disorder.
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals presented with variable degrees of ID and commonly observed features included speech delay, elevated BMI, short stature, seizure disorders, gait disturbance, and tremors."
    explanation: The defining cohort documents intellectual disability in all affected individuals with variable degree, alongside the associated features.
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ID was universal and at least moderate in severity: 2/7 were non-ambulatory and 3/7 non-verbal."
    explanation: Intellectual disability was present in 7 of 7 individuals in this series, the direct quantitative basis for the VERY_FREQUENT band.

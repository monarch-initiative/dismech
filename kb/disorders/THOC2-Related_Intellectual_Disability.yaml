    snippet: "Here, we describe for the first time a recurrent arthrogryposis multiplex congenita phenotype (AMC) in two male fetuses in a family."
    explanation: Documents recurrence of a lethal fetal presentation in consecutive pregnancies of one carrier mother, which is the specific recurrence risk that counselling for this allele class must address.
animal_models:
- species: Mouse
  genotype: Thoc2 exon 37-38 deletion hemizygous male (Thoc2Δ/Y), based on a patient allele

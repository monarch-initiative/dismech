      label: THOC2
  associated_phenotypes:
  - Reduced size and weight
  - Spatial learning and working memory deficits
  - Sensorimotor deficits
  description: >-
    A hypomorphic mouse built directly on a patient's THOC2 exon 37-38 deletion
    allele. It recapitulates the core human phenotypes - smaller size and weight,
    and deficits in spatial learning, working memory and sensorimotor function -
    and is the system in which the R-loop/DNA-damage mechanism was demonstrated.
    Its construct validity is unusually good for a hypomorphic-allele disorder,
    because the modelled allele is a real patient variant rather than an
    engineered knockdown.
  evidence:
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated a mouse model based on a hypomorphic Thoc2 exon 37-38 deletion variant of a patient with ID, speech delay, hypotonia, and microcephaly"
    explanation: Establishes the construct validity of the model - it carries an actual patient allele.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice recapitulate the core phenotypes of THOC2 syndrome including smaller size and weight, and significant deficits in spatial learning, working memory and sensorimotor functions"
    explanation: Establishes face validity across the cognitive, sensorimotor and growth domains.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thoc2Δ/Y neurons show perturbed in vitro neural migration, electrophysiological properties and synapse formation"
    explanation: Extends the model's construct validity below the behavioural level to cellular neurodevelopmental readouts, which is what makes it usable for mechanism and rescue experiments.
- species: Caenorhabditis elegans
  genotype: thoc-2 homozygous deletion (ok961) and heterozygotes, maintained over a balancer
  genes:
  - preferred_term: THOC2
    term:
      id: hgnc:19073
      label: THOC2
  associated_phenotypes:
  - Impaired locomotion
  - Sensory neuron dysfunction (reduced chemotaxis)
  description: >-
    An invertebrate loss-of-function model generated in the course of investigating
    a patient with a de novo X;8 translocation that knocked down THOC2 expression.
    Because the C. elegans thoc-2 deletion is homozygous lethal it must be
    balanced, which independently corroborates the essentiality of the gene that
    forces every human disease allele to be hypomorphic. Surviving animals show
    impaired locomotion and defective chemosensation, establishing a neuronal role
    for the orthologue. Its interpretive limits are substantial: it is a null
    rather than a hypomorph, an invertebrate rather than a mammal, and the human
    case that prompted it also had PTK2 haploinsufficiency, so the human arm of
    that report is confounded.
  evidence:
  - reference: PMID:23749989
    reference_title: "A de novo X;8 translocation creates a PTK2-THOC2 gene fusion with THOC2 expression knockdown in a patient with psychomotor retardation and congenital cerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "THOC2 ortholog knockout in C.elegans which produced functional defects in specific sensory neurons"
    explanation: Establishes that loss of the THOC2 orthologue produces a neuronal functional deficit in an invertebrate, supporting a conserved neuronal requirement for the gene.
  - reference: PMID:23749989
    reference_title: "A de novo X;8 translocation creates a PTK2-THOC2 gene fusion with THOC2 expression knockdown in a patient with psychomotor retardation and congenital cerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Animals thoc-2−/− were almost completely immobile, or moved slowly and for a short time upon touching"
    explanation: Documents the locomotor phenotype listed for this model, and the dose-dependence noted in the same figure - locomotion was also reduced in heterozygotes - parallels the hypomorphic nature of the human alleles.
discussions:
- discussion_id: thoc2_rloop_human_validation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is perturbed R-loop homeostasis with consequent DNA damage the mechanism of
    THOC2 syndrome in humans, or is it specific to the mouse model?
  attaches_to:
  - pathophysiology#Perturbed R-Loop Homeostasis and DNA Damage
  rationale: >-
    The R-loop/DNA-damage model is the only mechanistic account on offer for why
    partial loss of a ubiquitously required transcription-export factor produces a
    brain-predominant phenotype, and it nominates a druggable axis
    (R-loop-resolving helicases, DNA-damage-response modulation). It is better
    evidenced than a purely murine claim: R-loops were shown to accumulate in
    fibroblasts from the very patient whose allele the mouse carries, and RNase H1
    overexpression reduced both R-loops and comet-assay DNA damage, which orders
    the two events causally. Three gaps nonetheless keep this open. First, the
    rescue was performed in mouse neural stem cells, not in the patient cells, so
    the causal ordering is established in mouse and only the phenotype is
    established in human cells. Second, only one allele has been interrogated -
    the exon 37-38 deletion - whereas THOC2 alleles fall into two structurally
    different classes (destabilising missense versus C-terminal
    RNA-binding-domain truncation), so it is not established that both converge on
    R-loops. Third, the authors themselves frame the conclusion as a suggestion
    covering "mice and the patient", and no R-loop or DNA-damage measurement
    exists in human brain tissue. A fourth, sharper tension is that an earlier
    study reported the opposite cellular outcome from acute THOC2 knockdown in
    rodent neural cells - increased progenitor proliferation with no change in
    apoptosis - which is not obviously reconcilable with the germline-hypomorph
    finding of progenitor cell death, though the two differ in species, timing and
    the acuteness of the depletion.
  proposed_experiments:
  - experiment_id: thoc2_rloop_allele_classes
    name: R-loop and DNA-damage profiling across both THOC2 allele classes
    description: >-
      Quantify R-loop burden (DRIP-seq and S9.6 immunofluorescence) and DNA-damage
      markers in patient-derived lymphoblastoid or fibroblast lines carrying
      destabilising missense alleles, and compare against the already-characterised
      exon 37-38 deletion line and sex-matched controls. Then perform the RNase H1
      rescue directly in the human patient lines rather than in mouse neural stem
      cells.
    decision_criterion: >-
      Elevated R-loops with RNase H1 rescue in patient cells of both allele classes
      would establish the mechanism in human cells and unify the allele classes;
      an effect confined to the truncation class would mean the two classes act
      through different proximal mechanisms and that the entry's single causal
      chain needs to be split.
  - experiment_id: thoc2_proliferation_vs_apoptosis
    name: Reconciling increased progenitor proliferation with progenitor cell death
    description: >-
      Directly compare acute shRNA knockdown of THOC2 against a germline
      hypomorphic allele in the same neural progenitor system, measuring
      proliferation rate, apoptosis, R-loop burden and DNA damage in parallel and
      over a time course.
    decision_criterion: >-
      If the germline hypomorph produces apoptosis where acute knockdown produces
      proliferation, the discrepancy is a kinetic/adaptive effect and the entry's
      cell-death node stands; if acute knockdown also produces apoptosis under
      matched conditions, the earlier report is the outlier and the chain is
      simpler than currently curated.
  - experiment_id: thoc2_severe_subset_mechanism
    name: Mechanistic characterisation of the severe-profound subset
    description: >-
      Compare THOC2 protein levels, TREX subunit abundance and R-loop burden
      between individuals with the severe-profound phenotype (persistent hypotonia
      and respiratory abnormalities) and those with the milder
      language-predominant phenotype.
    decision_criterion: >-
      A quantitative relationship between residual THOC2 or TREX abundance and
      clinical severity would answer the cohort authors' explicit call for the
      pathophysiological basis of the severe phenotype.
  evidence:
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, we suggest that perturbed R-loop homeostasis, in stem cells and/or differentiated cells in mice and the patient, and DNA damage-associated functional alterations are at the root of THOC2 syndrome."
    explanation: The mechanism is offered as a suggestion, and the human half of the claim is extrapolated from the mouse rather than measured, which is the substance of this open question.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further investigations to elucidate the pathophysiological basis for this severe phenotype are warranted."
    explanation: The largest cohort's authors explicitly state that the mechanism of the severe subset is unexplained, which is part of what keeps this discussion open.
  - reference: PMID:38331934
    reference_title: "Compromised transcription-mRNA export factor THOC2 causes R-loop accumulation, DNA damage and adverse neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "reduced R-loop accumulation (Fig. 7e) and comet tail formation (Fig. 7f) in Thoc2"
    explanation: The RNase H1 rescue that orders R-loops upstream of DNA damage was performed in mutant mouse neural stem cells, not in patient cells - which is precisely the residual human-model gap the first proposed experiment closes.
  - reference: PMID:23749989
    reference_title: "A de novo X;8 translocation creates a PTK2-THOC2 gene fusion with THOC2 expression knockdown in a patient with psychomotor retardation and congenital cerebellar hypoplasia."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Thoc2 knockdown in neuronal stem cells (LC1) which increased their in vitro growth rate without modifying apoptosis levels"
    explanation: Acute THOC2 knockdown in rodent neural stem cells increased proliferation and explicitly did not change apoptosis, the opposite of the progenitor cell death seen with a germline hypomorphic allele. Curated as PARTIAL because it is an in-vitro acute-knockdown result in a different system rather than a direct contradiction, but it is the substance of the second proposed experiment.

name: THOC2-Related Intellectual Disability
creation_date: "2026-07-31T00:00:00Z"
description: >-
  THOC2-related intellectual disability (X-linked intellectual disability-short
  stature-overweight syndrome; OMIM 300957) is an X-linked neurodevelopmental
  disorder caused by hypomorphic variants in THOC2, which encodes the largest
  subunit of the highly conserved TREX (Transcription-Export) complex. The core
  phenotype is language disorder and/or intellectual disability of variable
  severity together with disorders of growth. Commonly reported features include
  speech delay, elevated body mass index with truncal obesity in older males,
  short stature, seizure disorders, gait disturbance and tremors; a subset of
  affected individuals have severe-to-profound intellectual disability with
  persistent hypotonia, recurrent aspiration and respiratory abnormalities, and one
  recurrent canonical acceptor splice-site allele produces the most severe reported
  presentation - fetal akinesia with arthrogryposis multiplex congenita. The largest
  cohort concluded that the disorder should be regarded as multisystemic in a
  significant proportion of individuals: congenital anomalies of the
  cardiorespiratory, genitorenal and skeletal systems, feeding difficulties and
  gastro-oesophageal reflux, and visual and hearing impairment are each present in
  10-30%, prompting a recommendation for systematic evaluation at diagnosis. Because
  complete loss of
  THOC2 is incompatible with life, every disease-associated allele is
  hypomorphic - missense variants that reduce THOC2 protein stability, or
  splice/deletion variants that remove small regions of the C-terminal RNA-binding
  domain. Reduced THOC2 stability destabilises its partner TREX subunits. The
  best-supported downstream mechanism is perturbed R-loop homeostasis with
  consequent DNA damage and cell death in the developing brain; notably, the
  patient allele that was modelled in mouse did NOT produce detectable bulk
  nuclear mRNA retention, so the disorder is better framed as a genome-stability
  lesion of the transcription-export machinery than as a simple bulk mRNA-export
  block.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
notes: >-
  Scope and disambiguation. THOC2 is a subunit of the THO/TREX complex, and the
  general THO/TREX literature - mRNA export biochemistry, R-loop biology,
  co-transcriptional RNA processing, and TREX in cancer and viral RNA export - is
  large and largely unconnected to this disorder. This entry is anchored on the
  human disease (MONDO:0010496 / OMIM 300957): every evidence item comes from a
  THOC2 patient cohort, a THOC2 patient-derived cell line, or the THOC2 mouse
  model built on a patient allele. Generic THO/TREX complex biology is cited only
  where a THOC2-disease paper states it about THOC2 itself.
  Note on the MONDO label. The MONDO/Orphanet name emphasises short stature and
  overweight, which reflects the 2015 first-description cohort. The largest
  subsequent cohort explicitly refined the core phenotype to "language disorder
  and/or ID, with a variable severity, and disorders of growth", so this entry
  uses the gene-anchored name and treats the growth features as one component
  rather than as defining.
  Relationship to THOC6-related disorder. kb/disorders/THOC6-Related_Developmental_
  Delay-Microcephaly-Facial_Dysmorphism_Syndrome.yaml curates a different disease
  (Beaulieu-Boycott-Innes syndrome) caused by biallelic autosomal-recessive variants
  in a different THO subunit. The two entries share only the complex: both genes
  encode subunits of the THO core of TREX, and a 2025 review groups THOC2, THOC6 and
  DDX39B as TREX components implicated in neurodevelopmental disorders. They are
  kept separate because the gene, inheritance mode, MONDO term and clinical picture
  all differ (THOC6 has a recognisable facial gestalt and cardiac/genitourinary
  malformations; THOC2 does not). Convergently, both entries have had to retire the
  simple "bulk mRNA-export block" model: the THOC6 entry on the basis of human
  neural-cell mis-splicing data, and this entry on the basis of the 2024 mouse and
  patient-fibroblast data showing no overt nuclear mRNA retention. No THOC6
  literature is used as evidence here.
  GeneReviews. A PubMed search for a GeneReviews chapter on THOC2 returns no
  results (a chapter exists for THOC6, PMID:32790266, but that is a different
  disorder and is not used here), so no GeneReviews phenotype baseline is available
  for this entry.
  Module conformance. No module in kb/modules/ captures an mRNA-export or R-loop
  chain. `genome_instability_mutation` was evaluated because the mouse model
  shows R-loop accumulation and DNA damage, but that module is explicitly the
  cancer "mutational engine" - its chain runs to a mutator phenotype,
  chromosomal instability and accelerated clonal evolution, which is not what
  happens here; in THOC2 the DNA damage leads to cell death in the developing
  brain and there is no neoplastic phenotype. Declaring conformance would import
  a cancer framing the evidence does not support.
  Deep research provenance. An Edison/falcon deep-research run
  (research/THOC2-Related_Intellectual_Disability-deep-research-falcon.md) informed
  this entry. Its report cited a wrong PMID for the 2015 defining paper (26166475
  rather than 26166480) and asserted that no MONDO/OMIM identifier could be
  established; both were corrected against primary sources. It also missed the 2020
  expansion cohort, the arthrogryposis reports and the 2013 translocation case,
  which were added from an independent PubMed sweep.

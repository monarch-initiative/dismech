- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    The organism-level consequence is a neurodevelopmental disorder with
    intellectual disability as the core phenotype, accompanied by disorders of
    growth. Severity spans language disorder without frank intellectual
    disability at one end to severe-profound intellectual disability with
    persistent hypotonia and respiratory abnormalities at the other. Movement and
    seizure disorders are prominent in the more severely affected. The mouse
    carrying a patient allele recapitulates the core features - smaller size and
    weight, and deficits in spatial learning, working memory and sensorimotor
    function - which supports the causal chain.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: Intellectual disability is the core phenotype.
  - target: Speech and Language Disorder
    causal_link_type: DIRECT
    description: >-
      Language disorder is part of the refined core phenotype and can occur with
      or without frank intellectual disability.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Seizure disorders occur, particularly in the severe group.
  - target: Hypotonia
    causal_link_type: DIRECT
    description: >-
      Persistent hypotonia characterises the severe-profound end of the spectrum.
  - target: Tremor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Tremor is among the commonly observed movement features.
  - target: Gait Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Gait disturbance is among the commonly observed motor features.
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disorders of growth are part of the refined core phenotype, and the mouse
      model is smaller and lighter than wild type.
  - target: Small for Gestational Age
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth restriction is already present at birth in a substantial minority,
      indicating a prenatal onset of the growth arm of the phenotype.
  - target: Increased Body Mass Index
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Elevated BMI with truncal obesity emerges in older affected males, the
      second growth feature that gives the disorder its MONDO name; the
      intervening mechanism between the THOC2 lesion and the body-composition
      change is unknown.
  - target: Microcephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced cortical progenitor pool and thinner cortical structures in the
      mouse provide a plausible route to the reduced head circumference seen in a
      minority of affected individuals.
  - target: Atypical Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Behavioural problems, including autism spectrum disorder in one individual,
      are among the common findings of the disorder.
  - target: Autism Spectrum Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One individual in the quantified cohort met diagnostic criteria for autism
      spectrum disorder.
  - target: Inability to Walk
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      At the severe end of the motor spectrum, affected individuals never achieve
      independent ambulation.
  - target: Respiratory Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Respiratory abnormalities accompany persistent hypotonia in the
      severe-profound subset; the cohort authors explicitly flagged the
      pathophysiological basis of this severe presentation as unexplained.
  - target: Arthrogryposis Multiplex Congenita
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Allele-specific extreme of the phenotype. A recurrent canonical acceptor
      splice-site variant has produced lethal fetal akinesia with congenital joint
      contractures in male fetuses from two unrelated families, with a myopathic
      muscle phenotype showing cytoplasmic bodies. The intermediate steps between
      the THOC2 lesion and reduced fetal movement have not been established.
  - target: Abnormality of Movement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal motor coordination, stereotypies and involuntary movements are the
      most common neurological feature after the cognitive and language phenotype,
      and emerge or worsen with age in a subset.
  - target: Hypertonia and Spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A minority develop hypertonia with spasticity or contractures with age, the
      opposite tone pole from the infantile hypotonia of early presentation.
  - target: Recurrent Aspiration and Respiratory Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In the severe neuromuscular subgroup, persistent muscular hypotonia together
      with feeding difficulty and airway malacia leads to recurrent aspiration and
      respiratory tract infection.
  - target: Sialorrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Excessive salivation follows from the oromotor component of the persistent
      hypotonia in the severe neuromuscular subgroup.
  - target: Feeding Difficulties
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe feeding difficulty follows from oromotor dysfunction in the hypotonic
      subgroup, and travels with gastroesophageal reflux and aspiration risk.
  - target: Gastroesophageal Reflux
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Gastroesophageal reflux occurs in a significant minority and contributes to
      the feeding and aspiration morbidity of the severe subgroup.
  - target: Visual Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Visual impairment occurs in a significant minority; cortical visual
      impairment was documented in the severely affected female.
  - target: Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hearing impairment occurs in a significant minority and compounds the
      language phenotype.

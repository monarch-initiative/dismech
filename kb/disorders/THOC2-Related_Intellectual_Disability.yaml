  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "refines the core phenotype of THOC2 NDDs to language disorder and/or ID"
    explanation: Establishes language disorder as a core phenotype and therefore a primary intervention target; no THOC2-specific trial of speech therapy exists, so this supports the indication rather than the efficacy.
- name: Multisystem Surveillance at Diagnosis
  description: >-
    Because congenital anomalies of the cardiorespiratory, genitorenal and skeletal
    systems, feeding difficulties, and visual and hearing impairment are each
    present in 10-30% of affected individuals, the largest cohort explicitly
    recommends that every newly diagnosed individual receives a comprehensive
    evaluation - a detailed systems review by a paediatrician, a cardiac
    echocardiogram, hearing screening and ophthalmological review. This is the only
    concrete management recommendation issued in the THOC2 literature. Hearing and
    vision assessment matter disproportionately here because the population already
    has a language disorder, so remediable sensory deficits would otherwise be
    attributed to the neurodevelopmental diagnosis.
  treatment_term:
    preferred_term: multisystem screening evaluation at diagnosis
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment

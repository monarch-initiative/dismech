  - preferred_term: Gait disturbance
    term:
      id: HP:0001288
      label: Gait disturbance
  evidence:
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "They have a core phenotype of ID, and common findings of behavioural disorders, infantile hypotonia, gait disturbance and growth impairment"
    explanation: Establishes hypotonia and gait disturbance as common findings and therefore as standing rehabilitation targets; it supports the indication, not the efficacy, of physical and occupational therapy, which has not been studied in this disorder.
- name: Antiseizure Medication
  description: >-
    Epilepsy is not universal in THOC2 disease but does occur, and the one reported
    female with a de novo variant presented with an epileptic encephalopathy.
    Antiseizure treatment is standard-of-care and selected by seizure type; no
    THOC2-specific antiseizure regimen, drug preference or contraindication has
    been reported.
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Confirmed seizure disorder was only present in the affected female (individual 7) but suspected in individual 2."
    explanation: Documents the seizure burden that establishes the indication. It supports treating the seizures that occur, not any THOC2-specific efficacy claim, and it is also the reason this treatment is not framed as universally required.
- name: Genetic Counseling
  description: >-
    Counselling covers X-linked inheritance with affected males and typically
    milder or unaffected carrier females, the recurrence risk implied by carrier
    status, and the fact that de novo variants also occur - including in affected
    females - so a negative maternal test does not exclude the diagnosis in a
    proband. Counselling of carrier mothers must also cover the recurrent
    splice-site allele associated with lethal fetal arthrogryposis, for which
    prenatal recurrence was documented in consecutive pregnancies.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL

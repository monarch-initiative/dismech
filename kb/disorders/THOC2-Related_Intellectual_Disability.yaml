genetic:
- name: THOC2
  gene_term:
    preferred_term: THOC2
    term:
      id: hgnc:19073
      label: THOC2
  association: Causal - X-linked hypomorphic variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    THOC2 is on the X chromosome and encodes the largest subunit of the TREX
    (Transcription-Export) complex. Because THOC2 is essential, all
    disease-associated alleles are hypomorphic. Two classes are documented:
    missense variants at evolutionarily conserved residues that reduce THOC2
    protein stability (9 of 14 tested), and canonical splice-site variants or
    intragenic deletions that yield C-terminally truncated protein lacking part of
    the RNA-binding domain. A recurrent variant (p.Arg77Cys) has been described.
    Both inherited (X-linked pedigree) and de novo variants occur, including a de
    novo variant in an affected female with epileptic encephalopathy; carrier
    mothers are clinically unaffected with highly skewed X-inactivation. Allele
    class predicts the extreme of the spectrum: one specific recurrent canonical
    acceptor splice-site variant, c.2482-1_2484delGTCA at the intron 22/exon 23
    boundary, has produced lethal fetal akinesia with arthrogryposis multiplex
    congenita in two unrelated families, which is a qualitatively different and
    more severe outcome than the postnatal neurodevelopmental presentation of the
    missense alleles. Outside that one allele, no genotype-phenotype correlation
    holds: the largest cohort found no clear relationship between clinical severity
    and either variant type (missense, splicing-defective or microdeletion) or the
    region of the protein affected. The two arthrogryposis reports postdate that
    analysis and are not contradicted by it, but they should be read as a single
    allele-specific exception rather than as evidence for a general
    variant-type-to-severity rule.
  evidence:
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report that variants in THOC2, which encodes a subunit of the highly conserved TREX mRNA-export complex, cause syndromic intellectual disability (ID)"
    explanation: The gene-discovery statement establishing THOC2 as the cause of this syndromic intellectual disability.
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "THOC2 variants that affect evolutionarily conserved amino acid residues and reduce protein stability and two with canonical splice-site THOC2 variants that result in C-terminally truncated THOC2 proteins."
    explanation: Enumerates the two allele classes - destabilising missense at conserved residues, and splice variants producing C-terminal truncation.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "including the first case of a recurrent variant (p.Arg77Cys), and an additional individual with an intragenic THOC2 microdeletion (Del-Ex37-38)"
    explanation: Documents the first recurrent THOC2 variant and an intragenic microdeletion, expanding the variant spectrum beyond private missense alleles.
  - reference: PMID:37945483
    reference_title: "Muscular phenotype description of abnormal THOC2 splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a family with the same splice site mutation in the THOC2 gene involved in fetal arthrogryposis as well."
    explanation: Establishes a recurrent splice-site allele with a distinct, lethal fetal presentation in a second unrelated family, which is the basis for the allele-class-to-severity statement in the notes.
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygous mothers were clinically unaffected, and, where available, X-chromosome inactivation (XCI) was highly skewed"
    explanation: Documents the carrier-female genotype-phenotype relationship - unaffected despite carrying a pathogenic allele, with skewed X-inactivation as the observed correlate.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is no clear genotypic-phenotypic correlation between the severity or spectrum of phenotypic differences and either the type of genetic variant"
    explanation: The largest cohort's explicit negative finding on genotype-phenotype correlation, which is why this entry does not attempt to grade severity by variant class outside the one recurrent arthrogryposis splice allele.
diagnosis:
- name: Molecular Genetic Testing for THOC2
  description: >-
    The diagnosis is established by identifying a hypomorphic THOC2 variant in an
    individual with suggestive findings. Testing must cover both sequence variants
    and intragenic copy-number changes, because intragenic THOC2 microdeletions
    are an established allele class that coding-only analysis will miss. Because
    variants are typically private missense alleles in an essential gene,
    functional assessment of protein stability can support classification of
    variants of uncertain significance.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:26166480
    reference_title: "THOC2 Mutations Implicate mRNA-Export Pathway in X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X chromosome exome sequencing revealed four missense variants in THOC2 in four families"
    explanation: Establishes sequencing as the diagnostic route for the missense allele class.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an additional individual with an intragenic THOC2 microdeletion (Del-Ex37-38)"
    explanation: Documents the intragenic microdeletion allele class, which is why copy-number analysis must accompany sequencing.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ex vivo missense variant testing and patient-derived cell line data from current and published studies show 9 of the 14 missense THOC2 variants result in reduced protein stability."
    explanation: Protein-stability testing of missense variants is an established functional assay in this disorder and can support variant classification.
- name: Neurological Investigation for Symptoms or Signs
  description: >-
    Once the molecular diagnosis is made, the largest cohort advises a low threshold
    for EEG and brain MRI whenever neurological symptoms or signs appear. The
    rationale is that seizures, while affecting only about a fifth of the cohort
    overall, cluster in the severe neuromuscular subgroup where they can take the
    form of a severe developmental and epileptic encephalopathy with infantile
    spasms, and that the neurological phenotype can progress with age in some males.
    Imaging is for detection of complications rather than for diagnosis - there is
    no unifying neuroradiological signature for this disorder.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinicians should have a low threshold for investigating neurological symptoms or signs with an EEG and MRI brain"
    explanation: An explicit investigation recommendation from the largest cohort, naming both modalities.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although for many individuals the phenotype is static, a more complex neurological phenotype also emerges with age in several males"
    explanation: Age-emergent neurological features are the reason surveillance is ongoing rather than a one-off assessment at diagnosis.
differential_diagnoses:
- name: Other X-Linked Intellectual Disability Syndromes
  description: >-
    THOC2 was identified through X-linked intellectual disability pedigrees
    (including family MRX12, ascertained in 1971) and has no pathognomonic
    feature; over 120 of the identified intellectual-disability genes are
    X-linked. Broad genomic testing rather than targeted testing is the practical
    approach.
  evidence:
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Over 120 of the identified >800 ID genes are located on the X-chromosome"
    explanation: Quantifies the size of the X-linked intellectual-disability differential that THOC2 sits within, which is why targeted single-gene testing is impractical.
- name: Other THO/TREX Subunit Neurodevelopmental Disorders
  description: >-
    Other TREX subunits are themselves associated with neurodevelopmental
    disorders - THOC6 (Beaulieu-Boycott-Innes syndrome, curated separately in this
    knowledge base) and DDX39B - and THOC2 destabilisation reduces the abundance of
    the other NDD-associated THOC subunits, so the phenotypes are expected to
    overlap. This makes the group a coherent differential set rather than a list of
    unrelated conditions. THOC6 disease is distinguished by autosomal recessive
    inheritance, a recognisable facial gestalt, and cardiac and genitourinary
    malformations, none of which characterise THOC2 disease.
  evidence:
  - reference: PMID:40651286
    reference_title: "Transcription-Export complex in neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "partial loss of function variants in the TREX components THOC2, THOC6, and DDX39B were implicated in neurodevelopmental disorders"
    explanation: A 2025 review naming the specific TREX subunits whose partial loss of function causes neurodevelopmental disorders, which defines the membership of this differential group.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, reduced stability of THOC2 variant proteins has a flow-on effect on the stability of the multi-protein TREX complex; specifically on the other NDD-associated THOC subunits."
    explanation: Provides the mechanistic reason these disorders overlap - a THOC2 lesion lowers the abundance of the very subunits whose own loss causes the differential diagnoses.
- name: Syndromic Obesity with Intellectual Disability
  description: >-
    The MONDO name's emphasis on overweight and short stature places THOC2 in the
    differential for syndromic obesity with intellectual disability (for example
    Prader-Willi and Smith-Magenis syndromes), although the largest THOC2 cohort
    refined the core phenotype away from that framing and toward language disorder
    and growth disturbance. The obesity is adult-onset and truncal rather than
    early-onset hyperphagic obesity, which is a practical discriminator from
    Prader-Willi syndrome.
  evidence:
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals had a syndromic NDD, characterized by borderline to severe ID, speech delay, short stature and adult onset truncal obesity"
    explanation: Documents the adult-onset truncal pattern of the obesity, which is the feature that distinguishes THOC2 disease from the early-onset hyperphagic obesity syndromes in this differential. This sentence is the 2018 paper's recap of the 2015 cohort rather than a new observation.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our current, expanded cohort refines the core phenotype of THOC2 NDDs to language disorder and/or ID, with a variable severity, and disorders of growth."
    explanation: The largest cohort's refinement moves the core away from the obesity framing, which is why this differential is listed but not treated as the leading one.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy and none is in development. Management is
    supportive and symptom-directed - developmental and educational support,
    speech and language therapy, antiseizure medication where epilepsy is present,
    management of the movement disorder, growth and nutritional monitoring, and
    respiratory support for the severe-profound subset. No treatment has been
    evaluated in a THOC2-specific study.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No published THOC2-specific treatment study exists, so this entry records the
    standard-of-care framing rather than evidence of efficacy. The claim that
    intellectual disability generally lacks specific therapy is cited from the
    THOC2 cohort literature's own framing.
  evidence:
  - reference: PMID:29851191
    reference_title: "Severe neurocognitive and growth disorders due to variation in THOC2, an essential component of nuclear mRNA export machinery."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "frequently have limited or no specific therapies for their core symptoms"
    explanation: Background statement from the THOC2 cohort paper's introduction about intellectual disability generally; curated as PARTIAL/OTHER because it is framing rather than a THOC2-specific treatment finding, and it is the only citable statement on therapy available for this disorder.
- name: Speech and Language Therapy
  description: >-
    Language disorder is half of the refined core phenotype and speech delay is
    among the most consistently reported features, making speech-language therapy
    the intervention most directly matched to the disorder's dominant morbidity.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy

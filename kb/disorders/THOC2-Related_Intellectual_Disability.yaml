    term:
      id: HP:0001627
      label: Abnormal heart morphology
  - preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  - preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  evidence:
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "comprehensive evaluation including detailed systems review by a pediatrician, cardiac echocardiogram, hearing screening and ophthalmological review in all newly diagnosed patients is highly recommended"
    explanation: An explicit, specific management recommendation issued by the largest THOC2 cohort, naming the exact investigations - this is a direct recommendation rather than an inferred indication.
  - reference: PMID:32116545
    reference_title: "Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export Factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital anomalies of the cardiorespiratory, genitorenal and skeletal systems, severe feeding difficulties and gastroesophageal reflux, and visual and hearing impairments are present in a significant proportion (10–30%)"
    explanation: Gives the prevalence of the multisystem findings that justify screening for them at diagnosis.
- name: Physical and Occupational Therapy
  description: >-
    Hypotonia and gait disturbance are among the common findings of the disorder,
    and a subset of individuals are non-ambulatory, so motor rehabilitation is a
    standing component of management. No THOC2-specific rehabilitation study
    exists; the indication rests on the documented motor phenotype rather than on
    any evaluated outcome.
  treatment_term:

datasets:
- accession: geo:GSE303169
  title: RNAseq analyses of Esophageal biopsies from proton pump inhibitor (PPI)-responsive and PPI-unresponsive Pediatric patients with Eosinophilic Esophagitis.
  description: Clinical trials have identified two distinct eosinophilic esophagitis (EoE) treatment phenotypes, proton pump inhibitor (PPI)-responsive (PPI-R) and PPI-unresponsive (PPI-UR). Herein, we performed clinical, endoscopic, and histologic evaluation of esophageal biopsies from pediatric PPI-R and PPI-UR EoE individuals prior to PPI therapy (diagnosis) and following PPI trial. RNAseq analyses of esophageal biopsy samples revealed common immune and inflammatory transcriptional signatures in both PPI-R EoE and PPI-UR EoE at diagnosis and distinct signatures enriched for processes related to neuropeptide signaling and cell cycle and division.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 25
  publication: PMID:41059573
  notes: Identified by GEO DataSets index search for Eosinophilic Esophagitis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE275710
  title: MicroRNAs in plasma-derived extracellular vesicles as non-invasive biomarkers for eosinophilic esophagitis
  description: 'Background: The lack of non-invasive biomarkers imposes the dependence on endoscopy with biopsies for the diagnosis and monitoring of eosinophilic esophagitis (EoE), a prevalent chronic inflammation of the esophagus mediated by a type 2 immune response. We aimed to identify potential non-invasive biomarkers using microRNAs (miRNAs) in plasma-derived extracellular vesicles (pEVs). Methods: This is a prospective single-center observational study including a discovery cohort of EoE patients (n=26) with active disease (EoE.Basal) and after anti-inflammatory treatment (EoE.Post.tx), and control subjects (n=16).'

- accession: geo:GSE278888
  title: Differing Epithelial and Immunologic Activation Patterns Following Food Reintroduction Reveal Differential Transcriptional Profiles in Active Eosinophilic Esophagitis
  description: During food trigger reintroductions, eosinophilia can recur in a patchy manner both endoscopically and histologically. We postulated that areas containing low eosinophils represented the early stage of EoE recurrence, while areas with >15 eos/HPF represented established active EoE. We identified ten patients with prior pan-esophageal EoE who experienced patchy eosinophilia during trigger food reintroduction. The progression of recurrent EoE is illustrated by the transcriptional changes occurring from baseline remission through recurrent low and high eosinophil tissues in those with paired time points.

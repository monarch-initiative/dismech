discussions:
- discussion_id: gap_eoe_food_antigen_specificity
  prompt: >-
    Why do individual EoE patients react to different specific food antigens
    despite sharing a common esophageal epithelial barrier defect and type 2
    inflammatory program?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Esophageal Epithelial Barrier Dysfunction
  - pathophysiology#Type 2 Immune Activation
  - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
  rationale: >-
    A shared barrier defect and type 2 axis do not explain patient-specific
    antigen selectivity. The connecting mechanism likely involves pre-existing
    local IgE sensitization and Th2 memory to particular foods, but there is no
    clean mechanistic consensus, and it cannot currently be modeled as a single
    causal edge from barrier disruption to a defined antigen response. The
    mechanism is not evidence free, however. Bulk T-cell receptor sequencing of
    biopsies from patients with endoscopically confirmed triggers found relative
    clonality in children and more shared and similar receptors among
    milk-triggered patients than among patients with differing triggers, which
    is direct molecular evidence for food-specific T-cell recognition. What is
    missing is a validated way to predict an individual patient's trigger and an
    account of how that repertoire is selected in the first place.
  evidence:
  - reference: PMID:30364207
    reference_title: "Eosinophilic Esophagitis: Review and Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, several unmet needs are to be solved urgently, as finding a non-invasive disease-monitoring methods and biomarkers for routine practice, the development or new therapies, novel food allergy testing to detect triggering foods, drug, and doses required for initial therapy and safety issues with long-term maintenance therapy, amongst others."
    explanation: Review identifies better food allergy testing to detect triggering foods as an unmet need, supporting the antigen-specificity gap.
  - reference: PMID:37203302
    reference_title: "Bulk T-cell receptor sequencing confirms clonality in pediatric eosinophilic esophagitis and identifies a food-specific repertoire."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a shared EoE trigger (milk) had a greater degree of shared and similar TCRs compared to patients with differing triggers (seafood, wheat, egg, soy)."
    explanation: Trigger-confirmed biopsies show the T-cell repertoire tracks the specific food trigger, so patient-level antigen selectivity has partial molecular support rather than none.
  - reference: PMID:37203302
    reference_title: "Bulk T-cell receptor sequencing confirms clonality in pediatric eosinophilic esophagitis and identifies a food-specific repertoire."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed relative clonality in children but not adults with active EoE and identified potential food-specific TCRs, particularly for milk-triggered EoE. Further studies are needed to better identify the broad TCR repertoire relevant to food triggers."
    explanation: The same study limits its own claim to children and to candidate receptors and calls for further work, which is why this remains an open gap rather than a resolved mechanism.
- discussion_id: gap_eoe_detergent_human_causality
  prompt: >-
    Is environmental detergent exposure a genuine upstream human causal trigger
    of EoE, or only a mechanistically plausible model-system association?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Environmental Detergent Exposure
  rationale: >-
    Detergent (SDS) exposure impairs the esophageal barrier and induces IL-33
    and eosinophilia in cell-culture and mouse models, but direct human causal
    evidence is lacking. Whether this represents a true initiating exposure in
    patients or an experimentally tractable proxy remains unresolved.
- discussion_id: gap_eoe_eosinophil_symptom_causality
  prompt: >-
    Which eosinophil-dependent versus eosinophil-independent effector mechanisms
    drive dysphagia and fibrostenotic symptoms in EoE?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Eosinophil Recruitment to Esophagus
  - pathophysiology#Esophageal Fibrosis and Remodeling
  - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
  rationale: >-
    Eosinophil recruitment is a defining histologic and diagnostic axis, but
    eosinophil depletion alone has not consistently translated into symptom
    improvement. The symptom-producing tissue effectors may include epithelial
    remodeling, mast cells, neuromuscular dysfunction, and fibrosis in addition
    to eosinophils. A phase 3 trial of the eosinophil-depleting anti-IL-5
    receptor antibody benralizumab put the dissociation beyond doubt: 87.4% of
    treated patients reached histologic response against 6.5% on placebo, with
    no significant difference in the Dysphagia Symptom Questionnaire and no
    substantial difference in the endoscopic reference score. That result rules
    out tissue eosinophilia as a sufficient explanation of symptoms; it does not
    identify the effector that is responsible, and the persistent mast cell arm
    modeled in Esophageal Mast Cell Accumulation is one candidate among several.
  evidence:
  - reference: PMID:29372536
    reference_title: "Biological Therapies for Eosinophilic Esophagitis: Where Do We Stand?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mepolizumab and reslizumab, two anti-IL-5 antibodies, were studied in children and adults with EoE and resulted in reduction of esophageal tissue and blood eosinophils, but no significant reduction in symptoms."
    explanation: Review of biologic therapy trials supports a gap between eosinophil reduction and symptom improvement.
  - reference: PMID:38924732
    reference_title: "Eosinophil Depletion with Benralizumab for Eosinophilic Esophagitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this trial involving patients 12 to 65 years of age with eosinophilic esophagitis, a histologic response (≤6 eosinophils per high-power field) occurred in significantly more patients in the benralizumab group than in the placebo group. However, treatment with benralizumab did not result in fewer or less severe dysphagia symptoms than placebo."
    explanation: The randomized phase 3 MESSINA trial separates histologic from symptomatic response under near-complete eosinophil depletion, the strongest available evidence that esophageal eosinophilia does not by itself produce dysphagia.
  - reference: PMID:38924732
    reference_title: "Eosinophil Depletion with Benralizumab for Eosinophilic Esophagitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no substantial between-group difference in the change from baseline in the Eosinophilic Esophagitis Endoscopic Reference Score, which reflects endoscopic abnormalities."
    explanation: Endoscopic abnormalities also failed to improve with eosinophil depletion, extending the dissociation from symptoms to the structural findings that track remodeling.
- discussion_id: gap_eoe_barrier_cause_or_consequence
  prompt: >-
    Does esophageal epithelial barrier dysfunction precede EoE inflammation, or
    is the barrier defect measured at diagnosis largely a consequence of type 2
    cytokine signaling?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Esophageal Epithelial Barrier Dysfunction
  - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
  rationale: >-
    The model places barrier disruption upstream of the type 2 cascade, and two
    observations are usually offered in support: rare desmosome variants that
    impair barrier integrity in a fifth of multiplex families, and barrier
    abnormalities that persist into histologic remission. Neither settles the
    direction. Persistence after disease is not precedence before it, and IL-13
    impairs esophageal epithelial barrier function directly, so the defect seen
    at diagnosis is at least partly inflammation driven. Deciding this needs
    sampling from before disease onset in an at-risk cohort rather than more
    cross-sectional biopsies of established or treated disease.
  evidence:
  - reference: PMID:34815391
    reference_title: "Desmoplakin and periplakin genetically and functionally contribute to eosinophilic esophagitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Esophageal biopsies from patients with these variants retain dilated intercellular spaces and decrease DSP and PPL expression even during disease remission."
    explanation: This persistence in variant carriers is the observation most often read as showing an upstream barrier defect, and it is the claim this gap asks to test prospectively.
  - reference: PMID:39343172
    reference_title: "Persistent desmoglein-1 downregulation and periostin accumulation in histologic remission of eosinophilic esophagitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epithelial-to-mesenchymal transition normalized in inactive EoE, whereas desmosome recovery remained impaired as a result of desmoglein-1 downregulation."
    explanation: Prospective pediatric biopsies show desmosomal repair stays incomplete once eosinophilic inflammation has resolved, consistent with an epithelium-intrinsic defect but silent on whether it predates disease.
- discussion_id: gap_eoe_type2_molecular_heterogeneity
  prompt: >-
    Do the molecular endotypes of active EoE defined by esophageal type 2 gene
    expression predict who responds to a given type 2 directed therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Type 2 Immune Activation
  - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
  rationale: >-
    A 10-site cohort resolved active EoE into five subgroups by expression of
    IL4, IL5, IL13, CCL26, TSLP, CLC, CCR3 and CPA3. The subgroups differed
    sharply in EoE diagnostic panel score and in age, and one carried the highest
    IL5, TSLP and CCL26 together with tissue-remodeling genes, yet they did not
    differ in eosinophil counts. The single histologic measure used to diagnose
    and monitor the disease therefore does not track the type 2 program that the
    approved biologics target. Whether these endotypes predict response to an
    IL-4Rα, IL-5 or TSLP directed agent has not been tested prospectively, so
    the entry models one shared type 2 activation node rather than stratified
    ones.
  evidence:
  - reference: PMID:32197970
    reference_title: "Esophageal type 2 cytokine expression heterogeneity in eosinophilic esophagitis in a multisite cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These groups differed in age (P < .02) and EoE diagnostic panel score (P < 1.08E-30) but not in eosinophil levels."
    explanation: The five expression subgroups separate strongly on the molecular panel while being indistinguishable by the eosinophil count used clinically, which is the substance of the gap.
  - reference: PMID:32197970
    reference_title: "Esophageal type 2 cytokine expression heterogeneity in eosinophilic esophagitis in a multisite cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed heterogeneous type 2 gene expression among patients with active EoE. Type 2 gene overexpression was not directly proportional to disease features; this was especially true for tissue remodeling events."
    explanation: States the heterogeneity result at its actual strength, namely that type 2 expression is not proportional to disease features and especially not to remodeling, rather than being unrelated to disease severity altogether.

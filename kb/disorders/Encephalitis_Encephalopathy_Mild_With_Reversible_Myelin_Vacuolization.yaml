  evidence:
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Luciferase assay revealed that transcriptional activity of the N-terminal region of MYRF was significantly diminished by introducing the c.1208A>G variant."
    explanation: Demonstrates that the recurrent c.1208A>G (p.Gln403Arg) variant directly diminishes transcriptional activity of the N-terminal MYRF fragment.
  - reference: PMID:23966833
    reference_title: "MYRF is a membrane-associated transcription factor that autoproteolytically cleaves to directly activate myelin genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that Myrf is a membrane-associated transcription factor that undergoes an activating proteolytic cleavage to separate its transmembrane domain-containing C-terminal region from a nuclear-targeted N-terminal region."
    explanation: Establishes the normal activating proteolytic cleavage mechanism of MYRF.
  - reference: PMID:23966832
    reference_title: "A Bacteriophage tailspike domain promotes self-cleavage of a human membrane-bound transcription factor, the myelin regulatory factor MYRF."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Indeed, the intramolecular chaperone domain of MYRF facilitates its homo-oligomerization and proteolytically processes it into two halves. The N-terminal trimer, containing the DNA-binding domain, is released from the ER membrane and moves to the nucleus, where it exerts transcriptional effects."
    explanation: Details ICA domain-mediated homotrimerization, autoproteolytic cleavage at the ER membrane, and nuclear translocation of the N-terminal MYRF trimer.
  - reference: PMID:41190523
    reference_title: "Persistent Leukoencephalopathy Following H1N1 Infection Associated With a Novel MYRF Variant (p.Gly735Asp)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Critically, the variant resides within the highly conserved intramolecular chaperone auto‐processing (ICA)/peptidase S74 domain, a region essential for the protein's activation."
    explanation: Shows that MMERV/leukoencephalopathy-associated p.Gly735Asp affects the conserved ICA/peptidase S74 autoprocessing domain required for MYRF activation.

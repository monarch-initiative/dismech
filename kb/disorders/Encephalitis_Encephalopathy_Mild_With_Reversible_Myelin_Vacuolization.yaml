genetic:
- name: MYRF
  association: Causal Germline Heterozygous Missense Variant
  gene_term:
    preferred_term: MYRF
    term:
      id: hgnc:1181
      label: MYRF
  inheritance:
  - name: Autosomal Dominant
  features: >-
    Classic MMERV is caused by the recurrent heterozygous missense variant
    c.1208A>G (p.Gln403Arg) in the conserved Ndt80-like DNA-binding domain of
    MYRF, which partially reduces transcriptional activation of the cleaved
    N-terminal fragment without causing the developmental cardiac-urogenital
    defects seen with truncating or complete loss-of-function MYRF alleles.
  evidence:
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By filtering genes expressed in the corpus callosum, we identified a heterozygous c.1208A>G predicting p.Gln403Arg in the highly conserved DNA-binding domain in the myelin regulatory factor (MYRF) gene. We subsequently screened the coding regions of MYRF by Sanger sequencing in our cohort comprised of 33 sporadic cases with MERS and 3 cases in another family with extensive myelin vacuolization, and identified the same heterozygous c.1208A>G in all affected members in the second family."
    explanation: >-
      Identifies the recurrent heterozygous MYRF c.1208A>G (p.Gln403Arg)
      DNA-binding domain variant across two unrelated multiplex families with
      MMERV.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing of the proband revealed a missense mutation (MYRF- Q403R) at codon 403 of the MYRF gene: c.1208A>G (p.Gln403Arg) (Figure 3), resulting in an amino acid change from glutamine to arginine."
    explanation: >-
      Confirms the same recurrent MYRF c.1208A>G (p.Gln403Arg) variant in an
      independent Chinese family with MMERV.

  description: >-
    Transmitted in an autosomal dominant pattern with incomplete penetrance and
    variable expressivity; some heterozygous MYRF variant carriers remain
    asymptomatic unless exposed to severe febrile or viral triggers, and most
    affected individuals have normal baseline psychomotor development between
    episodes.

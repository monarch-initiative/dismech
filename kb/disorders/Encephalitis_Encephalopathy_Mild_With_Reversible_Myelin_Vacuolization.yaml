name: Encephalitis/Encephalopathy, Mild, With Reversible Myelin Vacuolization
description: >-
  MYRF-related mild encephalopathy with reversible myelin vacuolization (MMERV)
  is a rare autosomal dominant neurological disorder caused by heterozygous
  partial loss-of-function variants in MYRF, encoding a membrane-associated
  transcription factor that undergoes autoproteolytic cleavage to directly
  activate central nervous system myelin genes in oligodendrocytes. Under basal
  physiological conditions, carriers typically exhibit normal psychomotor
  development; however, acute febrile illnesses or viral infections trigger
  recurrent episodes of acute encephalopathy characterized by impaired
  consciousness, delirium, seizures, dysarthria, ataxia, and transient focal
  motor or sensory deficits. Brain MRI during acute episodes shows extensive,
  symmetric diffusion restriction and T2 hyperintensity in the corpus callosum
  (particularly the splenium) and bilateral deep cerebral white matter (centrum
  semiovale) reflecting intramyelinic edema and myelin vacuolization, which
  typically resolve clinically and radiologically within days to weeks,
  frequently aided by systemic corticosteroid therapy.

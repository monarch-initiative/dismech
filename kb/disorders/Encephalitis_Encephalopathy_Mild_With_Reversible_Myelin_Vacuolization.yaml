differential_diagnoses:
- name: Mild Encephalopathy with a Reversible Splenial Lesion (MERS / CLOCC)
  description: >-
    Cytotoxic lesions of the corpus callosum / mild encephalopathy with a
    reversible splenial lesion (CLOCC/MERS) is the primary clinical and
    radiological differential diagnosis for MMERV. Like MMERV, CLOCC/MERS is
    typically triggered by childhood viral infections and presents with mild
    encephalopathy, seizures, confusion, and reversible diffusion restriction in
    the corpus callosum (MERS type I) or both the corpus callosum and symmetric
    cerebral white matter (MERS type II). Whereas MERS type II is
    radiologically indistinguishable from acute MMERV, sporadic MERS cases do
    not harbor MYRF variants, making family history and MYRF genetic testing the
    definitive discriminators.
  distinguishing_features:
  - Sporadic CLOCC/MERS lacks pathogenic MYRF variants (0/33 sporadic MERS cases carried MYRF mutations in the discovery cohort), whereas MMERV segregates autosomal dominant MYRF variants (characteristically c.1208A>G p.Gln403Arg) with frequent family history or recurrence.
  - MERS type I is confined to the corpus callosum (splenium), whereas MMERV characteristically involves extensive symmetrical subcortical/centrum semiovale white matter in addition to the corpus callosum (resembling MERS type II).
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLOCC/MERS is the primary differential diagnosis for MMERV."
    explanation: >-
      Explicitly identifies CLOCC/MERS as the primary differential diagnosis for
      MMERV.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, MMERV presents clinically indistinguishable from MERS type II. Therefore, when MRI shows extensive myelin vacuolization, genetic analysis should be performed to determine the presence of MYRF variants to further diagnose the disease and guide eugenics in this family."
    explanation: >-
      Explains why MMERV mimics MERS type II on neuroimaging and why MYRF
      genetic analysis is required to distinguish the two conditions.
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We subsequently screened the coding regions of MYRF by Sanger sequencing in our cohort comprised of 33 sporadic cases with MERS and 3 cases in another family with extensive myelin vacuolization, and identified the same heterozygous c.1208A>G in all affected members in the second family."
    explanation: >-
      Demonstrates that 0 of 33 sporadic MERS cases carried pathogenic MYRF
      variants, whereas familial cases with extensive reversible myelin
      vacuolization shared the heterozygous MYRF c.1208A>G variant.
- name: Charcot-Marie-Tooth Disease, X-Linked Dominant, 1 (CMTX1)
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked dominant 1
    term:
      id: MONDO:0010549
      label: Charcot-Marie-Tooth disease X-linked dominant 1
  description: >-
    GJB1-related X-linked Charcot-Marie-Tooth disease type 1 (CMTX1) can present
    with recurrent, infection-triggered transient central nervous system
    leukoencephalopathy and reversible diffusion-weighted MRI lesions in the
    corpus callosum and deep cerebral white matter (centrum semiovale) that
    closely mimic MMERV. However, CMTX1 is caused by hemizygous or heterozygous
    variants in GJB1 (encoding connexin 32), typically features baseline
    peripheral demyelinating sensorimotor neuropathy and acute motor/sensory
    deficits rather than isolated seizures or impaired consciousness, and follows
    X-linked inheritance.
  distinguishing_features:
  - Causal variant in GJB1 (X-linked inheritance) rather than MYRF (autosomal dominant inheritance).
  - Presence of chronic peripheral sensorimotor polyneuropathy and prominent acute motor/sensory deficits in CMTX1.
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, CMTX1 can sometimes present as familial/recurrent transient leukoencephalopathy with reversible callosal and deep brain white matter lesions similar to MMERV. CMTX1 is caused by mutations in the GJB1 gene located on the X chromosome, which encodes connexin 32 (Cx32), a myelin-associated protein involved in the formation of gap junctions."
    explanation: >-
      Establishes CMTX1 as a key genetic differential diagnosis for recurrent
      reversible callosal and deep white matter leukoencephalopathy and
      distinguishes it by GJB1 etiology and peripheral nervous system
      involvement.
notes: >-
  Genotype-phenotype correlation at the MYRF locus reflects both variant-specific
  functional severity and domain localization. MYRF is broadly expressed during
  embryonic development (heart, diaphragm, lungs, urogenital tract, and eye) as
  well as postnatally in differentiated CNS oligodendrocytes. De novo
  loss-of-function or severe DNA-binding/autoproteolytic variants cause
  cardiac-urogenital syndrome (CUGS; MONDO:0032702) or C-terminal syndromic
  nanophthalmos, whereas the hypomorphic missense variant p.Gln403Arg in MMERV
  retains sufficient residual transcriptional activity for normal embryonic
  organogenesis and baseline development while compromising stress-induced myelin
  homeostasis in mature oligodendrocytes. Additionally, a distinct allelic
  autosomal dominant virus-triggered MYRF leukoencephalopathy caused by
  c.2204G>A (p.Gly735Asp) in the C-terminal ICA/peptidase S74 domain has been
  reported (PMID:41190523); unlike classic p.Gln403Arg MMERV, the p.Gly735Asp
  phenotype presented with persistent, nonreversible white matter lesions on
  two-year follow-up MRI and minimal corpus callosum involvement.

name: Encephalitis/Encephalopathy, Mild, with Reversible Myelin Vacuolization
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
description: >-
  Encephalitis/encephalopathy, mild, with reversible myelin vacuolization
  (MMERV; MONDO:0020853; OMIM:618113) is an autosomal dominant neurological
  disorder caused by heterozygous missense variants in the N-terminal
  Ndt80-like DNA-binding domain of the myelin regulatory factor gene (MYRF),
  characteristically the recurrent c.1208A>G (p.Gln403Arg) variant. Affected
  individuals have normal baseline neurodevelopment and experience acute or
  recurrent episodes of mild encephalopathy—manifesting with impaired
  consciousness, confusion, delirium, seizures, dysarthria or speech fluency
  impairment, ataxia, and transient motor deficits—typically triggered by
  febrile viral infections in infancy, childhood, or young adulthood. Brain
  magnetic resonance imaging during acute episodes demonstrates extensive
  symmetrical diffusion restriction (hyperintensity on diffusion-weighted
  imaging with reduced apparent diffusion coefficient) and T2/FLAIR
  hyperintensity involving the corpus callosum (particularly the splenium) and
  bilateral deep cerebral white matter (centrum semiovale), reflecting
  intramyelinic edema and reversible myelin vacuolization. Clinical symptoms
  and neuroimaging abnormalities characteristically resolve within one to two
  weeks without permanent neurological sequelae, distinguishing classic MMERV
  from severe de novo MYRF loss-of-function syndromic conditions (cardiac-urogenital
  syndrome and nanophthalmos) and from nonreversible MYRF leukoencephalopathies.

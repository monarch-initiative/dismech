notes: >-
  Sporadic mild encephalitis/encephalopathy with a reversible splenial lesion
  (MERS / cytotoxic lesions of the corpus callosum, CLOCC) is the primary
  clinical differential diagnosis (PMID:38155716), distinguished from MMERV by
  lack of family history, absence of MYRF variants, and lesions typically
  confined to the splenium rather than extensive recurrent centrum semiovale
  involvement. While patients with the recurrent DNA-binding domain variant
  p.Gln403Arg typically experience full clinical and neuroimaging recovery
  within 1-2 weeks, the C-terminal ICA/peptidase S74 domain variant p.Gly735Asp
  (PMID:41190523) was associated with persistent MRI leukoencephalopathy despite
  clinical stabilization, illustrating allelic heterogeneity in myelin repair
  reserve.

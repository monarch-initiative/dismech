- name: Acute Reversible Intramyelinic Edema and Myelin Vacuolization
  description: >-
    During acute febrile or viral triggers, systemic inflammatory cytokines and
    metabolic stress act on vulnerable MYRF-deficient myelin sheaths, causing
    splitting of myelin lamellae and accumulation of fluid within intramyelinic
    spaces (intramyelinic edema / myelin vacuolization) across high-density
    commissural and deep cerebral white matter tracts, especially the corpus
    callosum (splenium) and bilateral centrum semiovale. Because axons and
    oligodendrocyte cell bodies remain viable, the intramyelinic fluid is
    reabsorbed as inflammation subsides, resulting in rapid and complete
    radiological resolution within one to two weeks.

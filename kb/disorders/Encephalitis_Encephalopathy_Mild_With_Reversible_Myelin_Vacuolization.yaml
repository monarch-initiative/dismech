inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    MMERV is inherited in an autosomal dominant manner across multigenerational
    pedigrees segregating the heterozygous MYRF c.1208A>G (p.Gln403Arg)
    missense variant. Incomplete penetrance and variable expressivity are
    documented, with some heterozygous carriers experiencing only isolated
    childhood seizures without recurrent adult episodes or extensive white
    matter relapses.
  evidence:
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By filtering genes expressed in the corpus callosum, we identified a heterozygous c.1208A>G predicting p.Gln403Arg in the highly conserved DNA-binding domain in the myelin regulatory factor (MYRF) gene. We subsequently screened the coding regions of MYRF by Sanger sequencing in our cohort comprised of 33 sporadic cases with MERS and 3 cases in another family with extensive myelin vacuolization, and identified the same heterozygous c.1208A>G in all affected members in the second family."
    explanation: >-
      Establishes heterozygous cosegregation of the MYRF c.1208A>G
      (p.Gln403Arg) variant across affected family members in two multiplex
      families consistent with autosomal dominant inheritance.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYRF-related mild encephalopathy with reversible myelin vacuolization is a rare autosomal dominant genetic disease, with early clinical manifestations often being seizures."
    explanation: >-
      Explicitly defines MMERV as an autosomal dominant genetic disorder.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is noteworthy that only three patients (II-1 and IV-1 in family A and III-1 in Family C) in the study experienced multiple episodes. However, it is uncertain whether these episodes were triggered by predisposing factors or if other carriers had asymptomatic episodes."
    explanation: >-
      Documents marked intrafamilial variable expressivity and potential
      incomplete penetrance across heterozygous MYRF c.1208A>G carriers within
      the three reported families.
prevalence:
- population: Global (reported families and cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare disorder with no established population prevalence rate. Reported
    cases in the literature comprise three familial MMERV pedigrees carrying the
    recurrent heterozygous MYRF c.1208A>G (p.Gln403Arg) variant summarized in
    the 2023 literature review—including the two multiplex Japanese families
    (nine affected individuals) originally described by Kurahashi et al.—as well
    as additional case reports such as the recurrent pediatric patient reported
    by Saito et al.
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kurahashi (Kurahashi et al., 2018) identified this missense mutation in the MYRF gene through genetic testing of nine symptomatic individuals from two unrelated families. In one family, the pedigree showed an autosomal dominant mode of inheritance, while the other family was too small to confirm. In all three familial cases of MMERV, carriers of this mutation showed normal psychomotor development under physiological, indicating relatively preserved MYRF function under normal conditions."
    explanation: >-
      Summarizes the three reported familial MMERV pedigrees (including the nine
      symptomatic individuals across the first two families) carrying the
      recurrent MYRF c.1208A>G variant.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, knowledge regarding MMERV has been based on two familial MMERV, which may be underdiagnosed due to limited awareness of the disease among clinicians and the fact that genetic testing technology is not yet fully available."
    explanation: >-
      Confirms that prior to the third familial pedigree reported in 2023,
      published MMERV knowledge derived from two familial cohorts and that the
      condition is likely underdiagnosed.

- name: Infection-Triggered Intramyelinic Edema and Myelin Vacuolization
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  description: >-
    During acute febrile viral infections, systemic cytokine release and
    neuroinflammation act as a second hit that overwhelms the compromised
    MYRF-dependent myelin maintenance capacity. This leads to fluid accumulation
    between myelin lamellae (intramyelinic edema), reversible myelin
    vacuolization, and variable myelin fragmentation with microglial/macrophage
    activation predominantly within the high-density commissural and deep white
    matter tracts of the corpus callosum and centrum semiovale.

      label: Genetic Testing
  description: >-
    Definitive diagnosis of MMERV requires molecular genetic testing (such as
    whole-exome sequencing, gene panel testing, or targeted Sanger sequencing)
    demonstrating a heterozygous pathogenic variant in MYRF, characteristically
    c.1208A>G (p.Gln403Arg), which differentiates familial MMERV from sporadic
    CLOCC/MERS and GJB1-related CMTX1.
  evidence:

- name: Compromised Oligodendrocyte Myelin Gene Transcription and Maintenance Reserve
  description: >-
    Mature oligodendrocytes require continuous MYRF transcriptional activity to
    sustain expression of major structural myelin genes (such as MBP, PLP1, MAG,
    and MOG) and preserve compact central nervous system myelin sheath integrity.
    Partial loss of MYRF transcriptional activity due to heterozygous missense
    variation permits normal baseline myelination and neurodevelopment but leaves
    mature oligodendrocytes with reduced homeostatic reserve for myelin
    maintenance and repair.

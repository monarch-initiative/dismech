- name: Compromised Oligodendrocyte Myelin Gene Transcription and Maintenance Reserve
  description: >-
    In mature oligodendrocytes, the nuclear N-terminal MYRF trimer directly binds
    enhancer regions of central nervous system myelin structural genes (such as
    MBP, PLP1, and MAG) to sustain myelin sheath maintenance. Heterozygous
    hypomorphic MYRF variants preserve sufficient basal myelin transcription for
    normal physiological development but leave oligodendrocytes unable to
    upregulate myelin gene transcription and repair during metabolic or
    inflammatory stress.

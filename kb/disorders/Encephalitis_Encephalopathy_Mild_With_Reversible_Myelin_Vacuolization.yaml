      snippet: "However, under pathological conditions such as infection, MYRF function is further impaired or fails to increase the transcriptional rate of myelin. This leads to myelin fragmentation and subsequent phagocytosis by activated microglia/macrophages in the white matter (Koenning et al., 2012), resulting in associated neurological symptoms and rapid, reversible severe demyelination manifestations on neuroimaging."
      explanation: >-
        Directly connects infection-triggered failure to upregulate MYRF myelin

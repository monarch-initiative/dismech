genetic:
- name: MYRF
  association: Causal
  gene_term:
    preferred_term: MYRF
    term:
      id: hgnc:1181
      label: MYRF
  features: >-
    Heterozygous missense variants causing partial loss of function, most
    commonly the recurrent c.1208A>G (p.Gln403Arg) variant in the conserved
    Ndt80-like DNA-binding domain, as well as c.2204G>A (p.Gly735Asp) in the
    C-terminal intramolecular chaperone auto-processing (ICA)/peptidase S74
    domain. Unlike de novo truncating or severe loss-of-function MYRF variants
    that cause fatal syndromic congenital heart-urogenital-diaphragmatic-eye
    anomalies, MMERV-associated variants are hypomorphic alleles that spare
    embryonic organogenesis and baseline development while compromising stress-
    induced CNS myelin maintenance.
  evidence:
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By filtering genes expressed in the corpus callosum, we identified a heterozygous c.1208A>G predicting p.Gln403Arg in the highly conserved DNA-binding domain in the myelin regulatory factor (MYRF) gene."
    explanation: Identifies the recurrent heterozygous MYRF c.1208A>G (p.Gln403Arg) variant in the DNA-binding domain as causal for familial reversible myelin vacuolization.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing of the proband revealed a missense mutation (MYRF- Q403R) at codon 403 of the MYRF gene: c.1208A>G (p.Gln403Arg) (Figure 3), resulting in an amino acid change from glutamine to arginine."
    explanation: Confirms the recurrent c.1208A>G (p.Gln403Arg) missense mutation in an independent Chinese family with MMERV.
  - reference: PMID:41190523
    reference_title: "Persistent Leukoencephalopathy Following H1N1 Infection Associated With a Novel MYRF Variant (p.Gly735Asp)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified a novel MYRF variant (c.2204G>A, p.Gly735Asp) in its C-terminal domain, with familial cosegregation confirming autosomal dominant inheritance."
    explanation: Expands the allelic spectrum of MYRF-related leukoencephalopathy to include the C-terminal ICA domain variant c.2204G>A (p.Gly735Asp).
treatments:
- name: Systemic Corticosteroid Therapy
  description: >-
    Intravenous pulse methylprednisolone, dexamethasone, or oral prednisone
    administered during acute febrile-triggered encephalopathic episodes to
    suppress neuroinflammation and accelerate resolution of intramyelinic edema
    and neurological deficits, typically achieving clinical recovery within 1
    week in p.Gln403Arg carriers.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: 6alpha-methylprednisolone
      term:
        id: CHEBI:6888
        label: 6alpha-methylprednisolone
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Infection-Triggered Intramyelinic Edema and Myelin Vacuolization
    treatment_effect: INHIBITS
    description: >-
      Dampens infection-triggered neuroinflammation and blood-brain barrier
      permeability to promote rapid resolution of intramyelinic edema.
    evidence:
    - reference: PMID:35990002
      reference_title: "Case report: Mild encephalitis with a reversible splenial lesion associated with SARS-CoV-2 infection in a patient with MYRF variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She was treated with a single course of intravenous methylprednisolone pulse therapy (1 g/day for 3 days), which resulted in an immediate improvement in her symptoms. A follow-up MRI on the 10th day after onset demonstrated resolution of the previously noted abnormalities."
      explanation: Intravenous methylprednisolone pulse therapy rapidly resolved acute white matter MRI abnormalities and clinical symptoms.
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, the treatment options for MMERV are limited and based on hormonal steroids therapy with full recovery of symptoms within 1 week."
    explanation: Establishes corticosteroid therapy as the primary acute treatment associated with rapid symptom resolution within 1 week.
  - reference: PMID:35990002
    reference_title: "Case report: Mild encephalitis with a reversible splenial lesion associated with SARS-CoV-2 infection in a patient with MYRF variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with a single course of intravenous methylprednisolone pulse therapy (1 g/day for 3 days), which resulted in an immediate improvement in her symptoms. A follow-up MRI on the 10th day after onset demonstrated resolution of the previously noted abnormalities."
    explanation: Demonstrates immediate clinical improvement and day-10 MRI resolution following intravenous methylprednisolone pulse therapy.
- name: Genetic Counseling
  description: >-
    Counseling of affected individuals and asymptomatic family carriers
    regarding autosomal dominant inheritance, incomplete penetrance, and the
    need for prompt medical evaluation during severe febrile viral illnesses.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41190523
    reference_title: "Persistent Leukoencephalopathy Following H1N1 Infection Associated With a Novel MYRF Variant (p.Gly735Asp)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following genetic counseling, the asymptomatic carriers were advised of the potential risk of developing neurological symptoms, particularly in the context of severe febrile illnesses, and were encouraged to seek prompt medical evaluation should such symptoms arise."
    explanation: Documents the role of genetic counseling and anticipatory guidance for febrile illnesses in MYRF variant carriers.
differential_diagnoses:
- name: Charcot-Marie-Tooth disease X-linked dominant 1
  description: >-
    Caused by pathogenic GJB1 (connexin-32) variants; in addition to peripheral
    demyelinating neuropathy, patients can experience recurrent, febrile- or
    altitude-triggered transient central nervous system leukoencephalopathy with
    reversible corpus callosum and centrum semiovale diffusion restriction that
    closely mimics MMERV on brain MRI.
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked dominant 1
    term:
      id: MONDO:0010549
      label: Charcot-Marie-Tooth disease X-linked dominant 1
  distinguishing_features:
  - X-linked dominant inheritance (GJB1) rather than autosomal dominant MYRF variants
  - Coexisting chronic demyelinating peripheral sensorimotor polyneuropathy (pes cavus, distal amyotrophy, areflexia)
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, CMTX1 can sometimes present as familial/recurrent transient leukoencephalopathy with reversible callosal and deep brain white matter lesions similar to MMERV."
    explanation: Identifies X-linked Charcot-Marie-Tooth disease type 1 (CMTX1) as a key genetic differential diagnosis presenting with recurrent reversible callosal and deep white matter lesions.

  presence: Present
  notes: >-
    Acute episodes of MMERV are characteristically precipitated by antecedent
    febrile infections—including influenza A, SARS-CoV-2, and other respiratory
    or systemic viral illnesses—in genetically susceptible MYRF variant carriers.
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infectious diseases in children are a major triggering factor for MMERV (Imamura et al., 2010; Kurahashi et al., 2018; Saito et al., 2022)."
    explanation: >-
      Identifies childhood infectious illnesses as a major precipitating factor
      for acute MMERV episodes.
  - reference: PMID:35990002
    reference_title: "Case report: Mild encephalitis with a reversible splenial lesion associated with SARS-CoV-2 infection in a patient with MYRF variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her medical history included five episodes of MERS, at the ages of 3, 6, 7, 8 and 9 years (Table 1). Three of these five episodes were associated with influenza A."
    explanation: >-
      Documents recurrent acute episodes associated with influenza A and
      SARS-CoV-2 viral infections in a patient carrying the MYRF p.Gln403Arg
      variant.
  - reference: PMID:41190523
    reference_title: "Persistent Leukoencephalopathy Following H1N1 Infection Associated With a Novel MYRF Variant (p.Gly735Asp)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individuals with a pre‐existing, subclinical genetic vulnerability such as MYRF haploinsufficiency, the robust systemic inflammation and immune dysregulation following a viral infection (e.g., cytokine storms seen in COVID‐19 or influenza) can act as a “second hit” ... This may disrupt the blood–brain barrier, promote neuroinflammation, and overwhelm the compromised myelin maintenance or repair capacity, thereby precipitating acute neurological disease"
    explanation: >-
      Articulates the general "second hit" mechanism by which systemic viral
      inflammation precipitates acute leukoencephalopathy in individuals with
      underlying MYRF genetic vulnerability, discussed in the context of an
      adjacent nonreversible MYRF leukoencephalopathy phenotype compared against
      MMERV.
pathophysiology:
- name: Impaired MYRF DNA-Binding Domain Transcriptional Activity
  description: >-
    MYRF encodes an endoplasmic reticulum membrane-anchored precursor protein
    that undergoes intramolecular chaperone auto-processing (ICA)
    domain-mediated homotrimerization and autoproteolytic self-cleavage to
    release an active N-terminal transcription factor trimer that translocates
    to the nucleus. In MMERV, the recurrent heterozygous missense variant
    c.1208A>G (p.Gln403Arg) alters a highly conserved residue within the
    Ndt80-like DNA-binding domain of the cleaved N-terminal fragment,
    significantly diminishing its transcriptional activation of downstream
    myelin target genes.

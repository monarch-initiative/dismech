  evidence:
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Luciferase assay revealed that transcriptional activity of the N-terminal region of MYRF was significantly diminished by introducing the c.1208A>G variant."
    explanation: >-
      Demonstrates functionally in vitro that the MMERV-associated c.1208A>G
      (p.Gln403Arg) variant in the DNA-binding domain reduces the
      transcriptional activation capacity of the N-terminal MYRF fragment.
  - reference: PMID:23966832
    reference_title: "A Bacteriophage tailspike domain promotes self-cleavage of a human membrane-bound transcription factor, the myelin regulatory factor MYRF."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Indeed, the intramolecular chaperone domain of MYRF facilitates its homo-oligomerization and proteolytically processes it into two halves. The N-terminal trimer, containing the DNA-binding domain, is released from the ER membrane and moves to the nucleus, where it exerts transcriptional effects."
    explanation: >-
      Establishes the normal biochemical mechanism by which MYRF self-cleaves via its
      ICA domain into an active N-terminal homotrimeric transcription factor.
  - reference: PMID:23966833
    reference_title: "MYRF is a membrane-associated transcription factor that autoproteolytically cleaves to directly activate myelin genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Using ChIP-Seq we show that the N-terminal cleavage product directly binds the enhancer regions of oligodendrocyte-specific and myelin genes. This binding occurs via a defined DNA-binding consensus sequence and strongly promotes the expression of target genes."
    explanation: >-
      Confirms that nuclear translocation of the cleaved N-terminal MYRF
      fragment directly binds myelin gene enhancers to drive transcription.

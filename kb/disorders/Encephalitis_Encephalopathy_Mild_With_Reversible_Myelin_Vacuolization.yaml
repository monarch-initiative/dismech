  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In mature oligodendrocytes, conditional knockdown of MYRF results in a dramatic downregulation of myelin gene expression and myelin damage (Wang et al., 2022). Mutations in the structural domain of this gene may have an impact on myelin transcription."
    explanation: >-
      Confirms that MYRF activity in mature oligodendrocytes maintains CNS
      myelin gene expression and that domain mutations impair myelin
      transcription.
  downstream:
  - target: Acute Reversible Intramyelinic Edema and Myelin Vacuolization
    description: >-
      When challenged by a febrile viral infection ("second hit"), compromised

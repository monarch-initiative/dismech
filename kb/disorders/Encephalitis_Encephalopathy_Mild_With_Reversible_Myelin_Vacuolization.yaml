prevalence:
- population: Global reported families and cases
  percentage: Ultra-rare (<10 families reported worldwide)
  notes: >-
    Ultra-rare autosomal dominant disorder with fewer than 10 families described
    in the peer-reviewed literature, predominantly reported in East Asian
    pedigrees with recurrent c.1208A>G (p.Gln403Arg) or novel C-terminal
    c.2204G>A (p.Gly735Asp) variants.
  evidence:
  - reference: PMID:29265453
    reference_title: "MYRF is associated with encephalopathy with reversible myelin vacuolization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We subsequently screened the coding regions of MYRF by Sanger sequencing in our cohort comprised of 33 sporadic cases with MERS and 3 cases in another family with extensive myelin vacuolization, and identified the same heterozygous c.1208A>G in all affected members in the second family."
    explanation: Documents the initial two multiplex families identified with the recurrent MYRF c.1208A>G variant.
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all three familial cases of MMERV, carriers of this mutation showed normal psychomotor development under physiological, indicating relatively preserved MYRF function under normal conditions."
    explanation: Summarizes the three reported familial cases carrying the p.Gln403Arg variant at the time of the review.
environmental:
- name: Febrile viral infection trigger
  exposure_term:
    preferred_term: exposure to virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  description: >-
    Acute febrile viral infections (including influenza A/H1N1 and SARS-CoV-2)
    and associated systemic inflammatory cytokines act as an environmental
    second hit that precipitates acute episodes of myelin vacuolization and
    encephalopathy in individuals with underlying MYRF haploinsufficiency or
    hypomorphic function.
  evidence:
  - reference: PMID:38155716
    reference_title: "MYRF-related mild encephalopathy with reversible myelin vacuolization: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infectious diseases in children are a major triggering factor for MMERV (Imamura et al., 2010; Kurahashi et al., 2018; Saito et al., 2022)."
    explanation: Establishes childhood infectious diseases as the primary environmental trigger for acute MMERV episodes.
  - reference: PMID:35990002
    reference_title: "Case report: Mild encephalitis with a reversible splenial lesion associated with SARS-CoV-2 infection in a patient with MYRF variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 14-year-old girl with a heterozygous p. Gln403Arg variant in the MYRF gene, who had five episodes of encephalopathy. She experienced reduced consciousness, numbness in the arm, and impaired verbal communication from day 4 of SARS-CoV-2 infection."
    explanation: Demonstrates SARS-CoV-2 infection precipitating an acute episode of encephalopathy in a patient with the MYRF p.Gln403Arg variant.
  - reference: PMID:41190523
    reference_title: "Persistent Leukoencephalopathy Following H1N1 Infection Associated With a Novel MYRF Variant (p.Gly735Asp)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individuals with a pre‐existing, subclinical genetic vulnerability such as MYRF haploinsufficiency, the robust systemic inflammation and immune dysregulation following a viral infection (e.g., cytokine storms seen in COVID‐19 or influenza) can act as a “second hit” ... This may disrupt the blood–brain barrier, promote neuroinflammation, and overwhelm the compromised myelin maintenance or repair capacity, thereby precipitating acute neurological disease"
    explanation: Explains how systemic viral infection and inflammation act as a second hit in MYRF variant carriers.
pathophysiology:
- name: Impaired MYRF Autoproteolytic Processing or DNA-Binding Activity
  conforms_to: "cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult"
  description: >-
    MYRF encodes an endoplasmic reticulum membrane-anchored precursor protein
    whose intramolecular chaperone auto-processing (ICA/peptidase S74) domain
    promotes homotrimerization and self-cleavage, releasing the N-terminal
    trimer into the nucleus to act as a sequence-specific transcription factor.
    Pathogenic MMERV variants either directly impair the conserved Ndt80-like
    DNA-binding domain (such as p.Gln403Arg) or disrupt the C-terminal
    ICA/peptidase S74 autoprocessing domain (such as p.Gly735Asp), reducing
    nuclear MYRF transcriptional activity.

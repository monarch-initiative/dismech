name: Myopathy Due To Myoadenylate Deaminase Deficiency
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- Myoadenylate deaminase deficiency
- AMP deaminase deficiency
- AMP deaminase 1 deficiency
- AMPD1 deficiency
- Adenosine monophosphate deaminase deficiency
- MMDD
description: >-
  Myopathy due to myoadenylate deaminase deficiency is a metabolic myopathy
  caused by deficiency of the skeletal-muscle isoform of AMP deaminase, encoded
  by AMPD1. AMP deaminase catalyzes the deamination of AMP to IMP with release
  of ammonia, the committed step of the purine nucleotide cycle that operates in
  contracting skeletal muscle. Loss of the enzyme stops purine nucleotide cycle
  flux during exercise, so the muscle cannot generate IMP and ammonia, cannot
  buffer the adenine-nucleotide energy charge by draining AMP toward ATP
  resynthesis, and loses an anaplerotic input to the TCA cycle. Symptomatic
  individuals present with exercise-induced myalgia, cramps, and early fatigue,
  and the defect is characteristically revealed by a flat venous ammonia response
  with a normal lactate rise on the ischemic forearm exercise test. The common
  nonsense allele c.34C>T (p.Gln12Ter) is frequent in people of European descent,
  yet the great majority of homozygotes are clinically asymptomatic, so the
  pathogenic significance of the biochemical deficiency is debated.

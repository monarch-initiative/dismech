    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In muscle, the purine nucleotide cycle has been shown to function during
      intense exercise;
    explanation: Establishes that the purine nucleotide cycle operates in muscle specifically during intense exercise.
  downstream:

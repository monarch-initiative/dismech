      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Three enzymes of purine metabolism, adenylosuccinate synthetase,
        adenylosuccinate lyase and AMP deaminase, have been proposed to form a
        functional unit, termed the purine nucleotide cycle.
      explanation: Establishes AMP deaminase as a required enzyme of the purine nucleotide cycle, so its loss disables the cycle.
- name: Failure of the Purine Nucleotide Cycle During Exercise
  description: >-
    The purine nucleotide cycle, which deaminates AMP to IMP and regenerates AMP
    via adenylosuccinate, cannot turn over without AMP deaminase, so the cycle
    fails under the metabolic demand of intense exercise.
  biological_scale: MOLECULAR

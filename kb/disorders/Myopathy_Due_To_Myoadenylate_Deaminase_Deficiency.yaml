    causal_link_type: DIRECT
  - target: Skeletal Muscle AMP Accumulation During Exercise
    causal_link_type: DIRECT
  - target: Reduced TCA-Cycle Anaplerosis in Contracting Muscle
    causal_link_type: DIRECT
    description: Cycle flux normally forms fumarate from aspartate, an anaplerotic input lost when the cycle fails.
    evidence:

      explanation: Confirms homozygous Q12X (p.Gln12Ter) in a genetically diagnosed patient.
  evidence:
  - reference: PMID:1631143
    reference_title: Molecular basis of AMP deaminase deficiency in skeletal muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutant allele is found in 12% of Caucasians and 19% of African-Americans,
      whereas none of the 106 Japanese subjects surveyed has this mutant allele.
    explanation: Reports the population allele frequencies of the common AMPD1 deficiency allele.
diagnosis:
- name: Ischemic forearm exercise test
  description: >-
    A forearm (or aerobic) exercise test showing a flat or absent venous ammonia
    rise with a normal lactate response points to the defect; it is a screen, not
    a confirmation.
  measurements:
  - preferred_term: venous lactate after ischemic forearm exercise
    term:
      id: LOINC:59849-0
      label: Lactate [Moles/volume] in Serum or Plasma --post exercise
  notes: >-
    Only the lactate limb of this test is codeable, and the limb that carries the
    diagnosis is not. LOINC has no exercise-qualified ammonia measurement: across the
    full LOINC 2.83 table no ammonia code is qualified by any challenge at all, and the
    Monarch KG, asked separately because that table holds no Part codes, returns 38
    ammonia records of which four are Parts, all unqualified components. So the flat
    ammonia rise that distinguishes this deficiency has nothing to bind to, while the
    normal lactate rise the test is read against does. The post-exercise lactate code
    is bound in millimoles per litre, the unit the comparison entries in this family
    report. Two near misses were avoided: the release's only pre-exercise lactate code
    is for D-lactate, a different enantiomer measured for unrelated reasons, and the KG
    carries a D-Lactate Part alongside the plain one. No reference range is bound; this
    row reports the pattern in words and states no concentration.
  results: Flat/absent venous ammonia rise with a normal lactate rise.
  evidence:
  - reference: PMID:10495640
    reference_title: Exertional myalgia syndrome associated with diminished serum ammonia elevation in ischemic exercise testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of a normal serum lactate elevation and a diminished serum
      ammonia elevation after ischemic exercise is usually considered indicative of
      myoadenylate deaminase deficiency.
    explanation: Establishes the characteristic forearm-test pattern used to screen for the deficiency.
- name: Muscle biopsy with histochemistry
  description: >-
    Muscle biopsy with histochemical and biochemical assay demonstrates absent
    myoadenylate deaminase activity and confirms the diagnosis.
  diagnosis_term:
    preferred_term: Muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  results: Absent histochemical and biochemical myoadenylate deaminase activity.
  evidence:
  - reference: PMID:15378456
    reference_title: "[Myoadenylate deaminase deficiency in a child with myalgias induced by physical exercise]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In muscle biopsy, an absence of the enzymatic activity of myoadenylate
      deaminase is observed
    explanation: Muscle biopsy demonstrating absent enzyme activity is a confirmatory diagnostic finding.
- name: AMPD1 molecular genetic testing
  description: >-
    Sequencing can demonstrate biallelic AMPD1 pathogenic variants, confirming
    the diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Identification of biallelic AMPD1 pathogenic variants.
  evidence:
  - reference: PMID:15378456
    reference_title: "[Myoadenylate deaminase deficiency in a child with myalgias induced by physical exercise]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the genetic analysis proves the 'nonsense' Q12X mutation which he has in a
      homozygous status.
    explanation: Molecular confirmation of the homozygous AMPD1 variant establishes the diagnosis.
differential_diagnoses:
- name: Glycolytic/glycogenolytic metabolic myopathies
  description: >-
    Other metabolic myopathies causing exertional myalgia (e.g. glycogen storage
    disease type V / McArdle disease) are distinguished on the forearm exercise
    test, which shows an absent lactate rise rather than an absent ammonia rise,
    and definitively by muscle histoenzymology and genetic testing.
  evidence:
  - reference: PMID:15378456
    reference_title: "[Myoadenylate deaminase deficiency in a child with myalgias induced by physical exercise]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ischemic forearm exercise test guides about the muscle metabolic
      disorder type, although the definitive diagnosis is obtained through the
      muscle biopsy histoenzymatic analysis and genetic techniques.
    explanation: Supports the forearm test plus biopsy/genetics as the way to separate the metabolic myopathy subtypes.
- name: Non-enzymatic causes of a diminished exercise ammonia response
  description: >-
    A diminished ammonia rise on the forearm test is not specific; it can also
    reflect impaired net ammonia efflux from muscle into blood rather than AMP
    deaminase deficiency, so enzyme or genetic confirmation is required.
  evidence:
  - reference: PMID:10495640
    reference_title: Exertional myalgia syndrome associated with diminished serum ammonia elevation in ischemic exercise testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A diminished serum ammonia elevation in the IFET could also reflect an
      impairment of net ammonia efflux from muscle into blood.
    explanation: Documents a non-enzymatic cause of the same test abnormality, requiring confirmation.
mechanistic_hypotheses:
- hypothesis_group_id: energy_charge_buffering_symptom_mechanism
  hypothesis_label: >-
    Exertional symptoms arise from loss of adenine-nucleotide energy-charge
    buffering during intense contraction
  status: EMERGING
  description: >-
    One proposed account of the exercise-induced symptoms is that, without AMP
    deaminase to drain AMP and pull the adenylate kinase reaction toward ATP
    resynthesis, the muscle cannot buffer its adenine-nucleotide energy charge
    under the demand of intense contraction, impairing exertional energy
    metabolism. The hypothesis is contested: because the biochemical deficiency
    is common yet most homozygotes are asymptomatic, the ATP-regenerating role
    of the cycle appears largely dispensable, so the branch is marked EMERGING
    rather than canonical and is tied to the open knowledge gap on why so few
    homozygotes become symptomatic.
  evidence:
  - reference: PMID:1529104
    reference_title: The purine nucleotide cycle and its molecular defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: >-
      The observation that it can be found in clinically asymptomatic individuals
      suggests, paradoxically, that the ATP-regenerating function which has been
      attributed to the purine nucleotide cycle is not essential for muscle function.
    explanation: >-
      Frames the ATP-regenerating (energy-charge buffering) role of the cycle as a
      proposed but contested mechanism, consistent with an emerging rather than
      established hypothesis.
discussions:
- discussion_id: gap_ampd1_asymptomatic_homozygotes
  prompt: >-
    Why do the great majority of individuals homozygous for the common AMPD1
    nonsense allele remain clinically asymptomatic, when the same biallelic
    loss-of-function abolishes muscle AMP deaminase and disables the purine
    nucleotide cycle?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of the Purine Nucleotide Cycle During Exercise
  - mechanistic_hypotheses#energy_charge_buffering_symptom_mechanism
  rationale: >-
    The biochemical deficiency is common (~2% of the population) but symptomatic
    myopathy is far rarer, and no genotype-phenotype rule explains who becomes
    symptomatic. Proposed explanations include alternative splicing of the
    mutation-bearing exon that restores some catalytically active enzyme, and
    metabolic pathways that compensate for the absent cycle flux; the reason the
    ATP-regenerating function of the cycle appears dispensable in most people is
    unresolved.
  proposed_experiments:
  - experiment_id: exp_ampd1_modifier_cohort
    name: Genotype-stratified deep-phenotyping cohort for AMPD1 symptom modifiers
    description: >-
      Assemble a cohort of genetically confirmed AMPD1-homozygous individuals,
      stratified by symptom status, with standardized exercise physiology,
      quantification of residual AMPD1 transcript and enzyme activity, and testing
      of candidate genetic and metabolic modifiers of the symptomatic phenotype.
  evidence:
  - reference: PMID:9211191
    reference_title: Clinical heterogeneity and molecular mechanisms in inborn muscle AMP deaminase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the vast majority of homozygous subjects do not develop a metabolic
      myopathy.
    explanation: Establishes the asymptomatic-homozygote discordance motivating this knowledge gap.
  - reference: PMID:9211191
    reference_title: Clinical heterogeneity and molecular mechanisms in inborn muscle AMP deaminase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This clinical heterogeneity may be due to molecular genetic factors such as
      alternative splicing of the exon harbouring the mutation, or due to metabolic
      conditions such as pathways compensating for the defect.
    explanation: Names the leading candidate explanations (alternative splicing, compensatory pathways).
  - reference: PMID:1529104
    reference_title: The purine nucleotide cycle and its molecular defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The observation that it can be found in clinically asymptomatic individuals
      suggests, paradoxically, that the ATP-regenerating function which has been
      attributed to the purine nucleotide cycle is not essential for muscle function.
    explanation: Frames the paradox that the cycle's ATP-regenerating role appears dispensable in most people.
notes: >-
  Single-gene (AMPD1) inherited metabolic myopathy; MONDO:0014220 / OMIM:615511.
  This entry covers the primary (inherited) deficiency, distinct from secondary
  (acquired) AMP deaminase deficiency seen alongside other neuromuscular diseases.
  The nearest sibling entry is McArdle disease (glycogen storage disease type V),
  another exertional metabolic myopathy; the two are separated on the forearm
  exercise test (flat ammonia here versus flat lactate in McArdle). No GeneReviews
  chapter exists for this disease (checked via the PubMed genereviews[book] field).
  No ClinGen gene-disease validity record or Orphanet entry was cached, so
  gene_disease_validity is deliberately omitted. The pathogenic significance of the
  common biochemical deficiency is debated because most homozygotes are
  asymptomatic (see the knowledge-gap discussion). No disease-specific
  pharmacotherapy exists; reported management is supportive (reassurance, graded
  activity, and avoidance of provoking exertion), and tried interventions such as
  D-ribose supplementation lack a quotable supporting source, so a treatments
  section is intentionally omitted rather than populated from unsourced claims.

    reference_title: Molecular basis of AMP deaminase deficiency in skeletal muscle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The C----T transition at codon 12 results in a nonsense mutation predicting
      a severely truncated AMPD peptide.
    explanation: Identifies the common codon-12 nonsense allele predicting a truncated enzyme.
  - reference: PMID:9211191
    reference_title: Clinical heterogeneity and molecular mechanisms in inborn muscle AMP deaminase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic basis of the inherited defect is the nonsense mutation C34-T in
      the AMPD1 gene encoding myoadenylate deaminase. The mutation results in a
      premature stop of the enzyme synthesis.
    explanation: States that the AMPD1 C34-T nonsense mutation causes premature termination of enzyme synthesis.
  downstream:

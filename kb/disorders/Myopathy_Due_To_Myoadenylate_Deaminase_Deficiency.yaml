pathophysiology:
- name: AMPD1 Biallelic Loss-of-Function
  description: >-
    Biallelic pathogenic variants in AMPD1, most commonly homozygosity for the
    recurrent nonsense allele carrying c.34C>T (p.Gln12Ter), abolish production
    of functional skeletal-muscle AMP deaminase (myoadenylate deaminase).

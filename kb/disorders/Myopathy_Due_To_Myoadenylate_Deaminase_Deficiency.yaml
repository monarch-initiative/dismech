        patients.
      explanation: Links the nonsense allele to absence of the enzyme protein in skeletal muscle.
- name: Loss of Skeletal Muscle AMP Deaminase Activity
  description: >-
    Absence of the AMPD1 gene product removes AMP deaminase catalytic activity
    from skeletal muscle, so AMP is no longer deaminated to IMP with release of
    ammonia.

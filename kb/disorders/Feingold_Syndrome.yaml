      snippet: "Feingold syndrome is a skeletal dysplasia caused by loss-of-function mutations of either MYCN (type 1) or MIR17HG that encodes miR-17-92 microRNAs (type 2)."
      explanation: "Establishes Feingold syndrome as a genetic congenital skeletal dysplasia caused by loss-of-function mutations in MYCN or MIR17HG."

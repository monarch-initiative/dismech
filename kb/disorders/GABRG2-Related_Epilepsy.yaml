    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thus provide the first genetic evidence that a GABA(A) receptor is directly involved in human idiopathic epilepsy.
    explanation: >-
      Links GABA-A receptor dysfunction directly to the human epilepsy phenotype.
  downstream:
  - target: Febrile seizures
    description: Network hyperexcitability produces fever-triggered seizures in early childhood.

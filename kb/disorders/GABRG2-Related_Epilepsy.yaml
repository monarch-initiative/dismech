    epilepsy; fever-sensitive seizures were reported in the large majority of a
    GABRG2 cohort, consistent with the temperature-sensitive trafficking
    mechanism.
  phenotype_term:
    preferred_term: Febrile seizure
    term:
      id: HP:0002373
      label: Febrile seizure (within the age range of 3 months to 6 years)
  frequency: VERY_FREQUENT

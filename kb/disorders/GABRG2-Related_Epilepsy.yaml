name: GABRG2-Related Epilepsy
creation_date: "2026-07-25T00:00:00Z"
category: Mendelian
description: >-
  GABRG2-related epilepsy is a gene-anchored, phenotypically heterogeneous
  epilepsy spectrum caused by heterozygous variants in GABRG2, which encodes the
  gamma-2 subunit of the GABA-A receptor, the heteropentameric chloride channel
  that mediates most fast synaptic (phasic) inhibition in the brain. The
  gamma-2 subunit has a special role in GABA-A receptor assembly, trafficking,
  clustering, and synaptic maintenance, so many missense and truncating variants
  reduce surface receptor expression through endoplasmic reticulum retention and
  degradation and exert dominant-negative effects on co-assembled wild-type
  subunits, while other variants alter channel gating. All routes converge on
  reduced GABA-gated chloride current and diminished inhibitory tone. The
  clinical spectrum ranges from simple febrile seizures, febrile seizures plus,
  and childhood absence epilepsy at the mild end, through generalized and focal
  epilepsies, to Dravet-like presentations and severe developmental and
  epileptic encephalopathy at the severe end. A distinctive feature is
  temperature-sensitive receptor trafficking, providing a mechanistic link to
  the prominent fever sensitivity of GABRG2-related seizures. This entry is
  deliberately gene-anchored on the GABRG2 receptor-trafficking mechanism across
  the whole allelic spectrum; the milder familial multi-gene GEFS+ syndrome (in
  which GABRG2 is one of several loci) is curated separately and listed here as
  a differential.

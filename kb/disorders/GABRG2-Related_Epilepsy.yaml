genetic:
- name: GABRG2
  gene_term:
    preferred_term: GABRG2
    term:
      id: hgnc:4087
      label: GABRG2
  association: >-
    GABRG2 encodes the GABA-A receptor gamma-2 subunit and is the most commonly
    implicated GABA-A receptor subunit gene in epilepsy. Missense, nonsense,
    frameshift, and splice-site variants reduce surface receptor expression via
    endoplasmic reticulum retention and dominant-negative effects or alter
    channel gating, producing a spectrum from febrile seizures and GEFS+ through
    childhood absence epilepsy to Dravet syndrome and developmental and epileptic
    encephalopathy.
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal dominant (frequently de novo)
  evidence:
  - reference: PMID:11326274
    reference_title: "First genetic evidence of GABA(A) receptor dysfunction in epilepsy: a mutation in the gamma2-subunit gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report a K289M mutation in the GABA(A) receptor gamma2-subunit gene (GABRG2) that segregates in a family with a phenotype closely related to GEFS+
    explanation: >-
      Original identification of a causative GABRG2 gamma-2 subunit variant in
      familial epilepsy.
  - reference: PMID:11748509
    reference_title: "Truncation of the GABA(A)-receptor gamma2 subunit in a family with generalized epilepsy with febrile seizures plus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation lies in the intracellular loop between the third and fourth transmembrane domains of the GABA(A)-receptor gamma2 subunit and introduces a premature stop codon at Q351 in the mature protein.
    explanation: >-
      Documents a causative truncating (Q351X) GABRG2 variant at the severe
      (severe myoclonic epilepsy of infancy) end of the spectrum.
  - reference: PMID:35359574
    reference_title: "Phenotypic Spectrum and Prognosis of Epilepsy Patients With GABRG2 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypes of GABRG2-related epilepsy were ranged from mild febrile seizures to severe epileptic encephalopathies.
    explanation: >-
      Summarizes the gene-anchored breadth of GABRG2-related epilepsy across a
      multicenter cohort.
  - reference: CGGV:assertion_3a3176e9-ac0c-41fe-ae40-0750726c33d8-2020-01-21T170000.000Z
    reference_title: "GABRG2 / epilepsy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GABRG2 | HGNC:4087 | epilepsy | MONDO:0005027 | AD | Definitive | SOP7 | Epilepsy Gene Curation Expert Panel | 2020-01-21T17:00:00.000Z
    explanation: >-
      ClinGen's Epilepsy Gene Curation Expert Panel classifies the
      GABRG2-epilepsy gene-disease relationship as Definitive (autosomal
      dominant), the authoritative gene-disease validity statement anchoring this
      gene-scoped entry.

diagnosis:
- name: Gene-panel or exome sequencing (GABRG2)
  description: >-
    Molecular diagnosis is by identification of a heterozygous pathogenic GABRG2
    variant, typically via a targeted epilepsy gene panel or exome/genome
    sequencing. GABRG2 is included among the GABA-A receptor subunit genes
    sequenced in early-onset epilepsy and epileptic encephalopathy work-ups; many
    variants are de novo.
  evidence:
  - reference: PMID:27864268
    reference_title: "De novo GABRG2 mutations associated with epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many epileptic encephalopathies have a genetic aetiology and are often associated with de novo mutations in genes mediating synaptic transmission, including GABAA receptor subunit genes.
    explanation: >-
      Supports next-generation sequencing detection of de novo GABA-A receptor
      subunit (GABRG2) variants in the diagnostic work-up of epileptic
      encephalopathy.

differential_diagnoses:
- name: Generalized epilepsy with febrile seizures plus (GEFS+)
  description: >-
    GEFS+ is a familial multi-gene epilepsy syndrome in which GABRG2 is one of
    several loci (alongside SCN1A, SCN1B, SCN9A, GABRD, and STX1B). It is curated
    as a separate dismech entry. This gene-anchored GABRG2 entry instead spans the
    full GABRG2 allelic spectrum, including the childhood absence epilepsy,
    Dravet-like, and severe developmental and epileptic encephalopathy
    presentations that fall outside the classic GEFS+ definition.
  distinguishing_features:
  - >-
    GEFS+ is defined at the syndrome/family level and is genetically
    heterogeneous (sodium-channel, GABA-A receptor, and SNARE genes), whereas this
    entry is anchored on the single gene GABRG2 and its receptor-trafficking
    mechanism.
  - >-
    GABRG2 variants also cause phenotypes beyond GEFS+, including childhood
    absence epilepsy, Dravet syndrome, and severe developmental and epileptic
    encephalopathy.
  evidence:
  - reference: PMID:24480790
    reference_title: "Association of nonsense mutation in GABRG2 with abnormal trafficking of GABAA receptors in severe epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in GABRG2, which encodes the γ2 subunit of GABAA receptors, can cause both genetic epilepsy with febrile seizures plus (GEFS+) and Dravet syndrome.
    explanation: >-
      Documents that GABRG2 causes both GEFS+ and Dravet syndrome, justifying a
      gene-anchored entry distinct from the GEFS+ syndrome entry.
- name: SCN1A-related Dravet syndrome
  description: >-
    Dravet syndrome is most commonly caused by SCN1A loss-of-function variants.
    GABRG2 truncating variants can produce a clinically overlapping Dravet-like
    presentation, so SCN1A testing is part of the differential at the severe end.
  distinguishing_features:
  - >-
    Molecular testing distinguishes SCN1A sodium-channel Dravet syndrome from
    GABRG2 GABA-A receptor Dravet-like presentations; sodium-channel-blocking
    anti-seizure medications are specifically contraindicated in SCN1A Dravet
    syndrome.

progression:
- phase: Onset
  age_range: Infancy to early childhood
  notes: >-
    Onset is usually in infancy or early childhood, frequently with
    fever-sensitive seizures. The course is strongly variant- and
    phenotype-dependent: milder febrile-seizure, GEFS+, and childhood absence
    presentations often have a good prognosis with seizure control, whereas the
    de novo developmental and epileptic encephalopathy end has early-onset,
    frequently drug-resistant seizures with developmental delay. In one cohort,
    seizures were controlled in most patients.
  evidence:
  - reference: PMID:35359574
    reference_title: "Phenotypic Spectrum and Prognosis of Epilepsy Patients With GABRG2 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of GABRG2-related epilepsy included seizure onset, usually in infancy, and seizures were fever-sensitive.
    explanation: >-
      Documents the typical infantile onset and fever sensitivity of
      GABRG2-related epilepsy.

treatments:
- name: Anti-seizure medication (valproate and levetiracetam)
  description: >-
    Broad-spectrum anti-seizure medication is the mainstay of treatment. In a
    GABRG2-related epilepsy cohort most patients achieved seizure control, and the
    great majority of controlled seizures responded to valproate and/or
    levetiracetam.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_mechanisms:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    treatment_effect: INHIBITS
    description: >-
      Broad-spectrum anti-seizure medications (valproate, levetiracetam) suppress
      network hyperexcitability and hypersynchronous firing, raising the seizure
      threshold.
  evidence:
  - reference: PMID:35359574
    reference_title: "Phenotypic Spectrum and Prognosis of Epilepsy Patients With GABRG2 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      92% of their seizures were controlled by valproate and/or levetiracetam.
    explanation: >-
      Supports valproate and levetiracetam as effective anti-seizure treatments in
      GABRG2-related epilepsy.
  - reference: PMID:35359574
    reference_title: "Phenotypic Spectrum and Prognosis of Epilepsy Patients With GABRG2 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Valproate and levetiracetam were effective treatments for most patients.
    explanation: >-
      Directly states that valproate and levetiracetam are effective for most
      GABRG2-related epilepsy patients.
- name: Benzodiazepines (acute and cluster-seizure control)
  description: >-
    Benzodiazepines are positive allosteric modulators of the GABA-A receptor
    used for acute seizures, status epilepticus, and cluster seizures in
    GABRG2-related epilepsy. Their efficacy can be attenuated for variants that
    reduce the benzodiazepine sensitivity of the mutant receptor, so response is
    variant-dependent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    treatment_effect: INHIBITS
    description: >-
      As GABA-A positive allosteric modulators, benzodiazepines enhance residual
      inhibitory tone to suppress network hyperexcitability.
  evidence:
  - reference: PMID:11326275
    reference_title: "Mutant GABA(A) receptor gamma2-subunit in childhood absence epilepsy and febrile seizures."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      the mutation in GABRG2 (encoding the gamma2-subunit) abolished in vitro sensitivity to diazepam
    explanation: >-
      Documents that a GABRG2 (R43Q) variant abolishes benzodiazepine (diazepam)
      sensitivity of the mutant receptor, a pharmacogenetic caveat that can limit
      benzodiazepine efficacy for some variants.
- name: Ketogenic diet
  description: >-
    The ketogenic diet is a recognized non-pharmacological option for
    drug-resistant epilepsy, including the severe developmental and epileptic

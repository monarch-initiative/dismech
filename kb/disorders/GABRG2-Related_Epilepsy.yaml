datasets: []

notes: >-
  This entry is intentionally gene-anchored on GABRG2 and its GABA-A receptor
  gamma-2 subunit trafficking mechanism across the whole allelic spectrum. The
  overlapping but distinct multi-gene familial syndrome, generalized epilepsy
  with febrile seizures plus (GEFS+, MONDO:0018214), is curated as a separate
  dismech entry in which GABRG2 is one of several contributing loci; it is listed
  here as a differential rather than duplicated. Founding GABRG2 variants include
  K289M (Baulac 2001), R43Q (childhood absence epilepsy and febrile seizures,
  Wallace 2001), and the truncating Q351X (Harkin 2002).

discussions:
- discussion_id: gap_gabrg2_variant_class_phenotype_severity
  prompt: >-
    What determines where a given GABRG2 variant places a patient on the severity
    spectrum, from benign febrile seizures to severe developmental and epileptic
    encephalopathy: is it purely the quantitative degree of surface GABA-A
    receptor loss (trafficking and dominant-negative burden), or do variant
    location and residual channel function contribute independently?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired GABA-A Receptor Assembly and Trafficking
  rationale: >-
    GABRG2 variants span a wide phenotypic range within a single gene, and both
    trafficking-deficient missense variants and dominant-negative truncating
    variants reduce surface receptors, yet the mapping from molecular severity to
    clinical severity is incompletely resolved. A cohort study found that
    transmembrane-region missense variants were associated with developmental
    delay more often than extracellular-region variants, hinting that variant
    location adds information beyond simple loss of surface expression, but a
    predictive genotype-severity model is lacking and would directly aid
    prognostic counseling.
  evidence:
  - reference: PMID:27864268
    reference_title: "De novo GABRG2 mutations associated with epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with wild-type α1β2γ2L receptors, GABAA receptors containing a mutant γ2 subunit had reduced cell surface expression with altered subunit stoichiometry or decreased GABA-evoked whole-cell current amplitudes, but with different levels of reduction.
    explanation: >-
      Shows that different GABRG2 encephalopathy variants reduce surface
      expression and current to different extents, framing the open question of
      how molecular severity maps to clinical severity.
  proposed_experiments:
  - experiment_id: exp_gabrg2_genotype_function_severity_map
    name: GABRG2 variant surface-expression versus clinical-severity mapping
    description: >-
      Across a graded GABRG2 allelic series spanning febrile seizures, GEFS+,
      absence epilepsy, Dravet-like, and encephalopathy phenotypes, quantify
      surface receptor expression, GABA-evoked current, and dominant-negative
      burden in a common assay background and test correlation with clinical
      severity and variant location.
    experiment_type:
      preferred_term: genotype-function-severity correlation study
    readouts:
    - name: Surface receptor expression and GABA-gated current versus severity
      target: pathophysiology#Impaired GABA-A Receptor Assembly and Trafficking
      biological_processes:
      - preferred_term: GABA-A receptor localization to the plasma membrane
        term:
          id: GO:0072659
          label: protein localization to plasma membrane
        modifier: DECREASED
      assays:
      - preferred_term: patch-clamp electrophysiology
      - preferred_term: cell-surface biotinylation assay
      direction: NEGATIVE
    controls:
    - name: Wild-type GABRG2
      description: Wild-type gamma-2 subunit assayed in the same background.
    decision_criterion: >-
      A single quantitative axis is supported if clinical severity correlates
      monotonically with loss of surface receptor expression and current across
      the allelic series; an independent contribution of variant location is
      supported if residuals track with domain (extracellular versus
      transmembrane) after adjusting for surface-expression loss.
    would_support:
    - pathophysiology#Impaired GABA-A Receptor Assembly and Trafficking

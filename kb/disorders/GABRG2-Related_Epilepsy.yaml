    causal_link_type: DIRECT
  - target: Focal-onset seizures
    description: GABRG2 network hyperexcitability can present with focal-onset seizures.
    causal_link_type: DIRECT
  - target: Absence seizures
    description: Thalamocortical disinhibition produces generalized non-motor (absence) seizures.
    causal_link_type: DIRECT
  - target: Myoclonic seizures
    description: >-
      Network hyperexcitability generates generalized myoclonic seizures, more
      prominent toward the Dravet-like end of the spectrum.
    causal_link_type: DIRECT
  - target: Impaired Neurodevelopment
    description: >-
      Severe, early, and frequent GABRG2 loss-of-inhibition manifests as
      developmental and epileptic encephalopathy at the severe end of the
      spectrum.
    causal_link_type: DIRECT


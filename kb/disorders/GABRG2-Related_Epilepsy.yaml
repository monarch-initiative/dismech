inheritance:
- name: Autosomal dominant (frequently de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    GABRG2-related epilepsy is inherited in an autosomal dominant manner. In
    multiplex families with milder phenotypes (febrile seizures, GEFS+, childhood
    absence epilepsy) the variant is transmitted dominantly with variable
    expressivity, whereas the severe developmental and epileptic encephalopathy
    end is enriched for de novo variants. In a multicenter cohort of 35 patients
    with GABRG2 variants, the majority (22 of 35) were de novo.
  evidence:
  - reference: PMID:35359574
    reference_title: "Phenotypic Spectrum and Prognosis of Epilepsy Patients With GABRG2 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 35 patients with GABRG2 variants, 22 variants were de novo, and 18 variants were novel.
    explanation: >-
      Documents that most GABRG2 epilepsy variants in a contemporary cohort arose
      de novo, supporting autosomal dominant inheritance with a large de novo
      contribution at the severe end.
  - reference: PMID:16510738
    reference_title: "Why does fever trigger febrile seizures? GABAA receptor gamma2 subunit mutations associated with idiopathic generalized epilepsies have temperature-dependent trafficking deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      mutations in the gamma2 subunit have been monogenically associated with autosomal dominant transmission of febrile seizures.
    explanation: >-
      Supports autosomal dominant transmission for the milder inherited
      (febrile-seizure) end of the GABRG2 spectrum.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    GABRG2 is the most commonly implicated GABA-A receptor subunit gene in
    epilepsy, but GABRG2-related epilepsy is individually rare and no firm
    population prevalence has been established; reports are cohort- and
    case-series-based rather than population-based. The severe developmental and
    epileptic encephalopathy end (DEE74, OMIM:618396) is ultra-rare.

has_subtypes:
- name: DEE74
  display_name: Developmental and Epileptic Encephalopathy 74
  subtype_term:
    preferred_term: developmental and epileptic encephalopathy, 74
    term:
      id: MONDO:0032725
      label: developmental and epileptic encephalopathy, 74
  description: >-
    The severe encephalopathic end of the GABRG2 spectrum (OMIM:618396),
    typically caused by de novo variants producing marked loss of surface
    GABA-A receptors, with early-onset, frequently drug-resistant seizures and
    developmental delay. In a multicenter GABRG2 cohort this severe end was a
    minority of the spectrum, which was dominated by milder febrile-seizure-plus
    and epilepsy-with-developmental-delay presentations.
  evidence:
  - reference: PMID:35359574
    reference_title: "Phenotypic Spectrum and Prognosis of Epilepsy Patients With GABRG2 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve patients were diagnosed with febrile seizures plus, eleven with epilepsy and developmental delay, two with Dravet syndrome, two with developmental and epileptic encephalopathy, two with focal epilepsy, two with febrile seizures, and four with unclassified epilepsy.
    explanation: >-
      Provides the syndromic breakdown of a GABRG2 cohort, placing developmental
      and epileptic encephalopathy (DEE74) at the severe end of the spectrum
      alongside the milder febrile-seizure and absence phenotypes.

pathophysiology:
- name: GABRG2 Variant and Gamma-2 Subunit Dysfunction
  role: trigger
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  biological_scale: MOLECULAR
  description: >-
    Heterozygous GABRG2 variants (missense, nonsense, frameshift, and splice-site
    classes) disrupt the GABA-A receptor gamma-2 subunit. The same gene produces
    a broad allelic spectrum: the founding K289M variant segregated in a family
    with a GEFS+-related phenotype, and across cohorts GABRG2 variants cause
    disease ranging from febrile seizures and GEFS+ to Dravet syndrome and severe
    developmental and epileptic encephalopathy.
  cell_types:
  - preferred_term: GABAergic inhibitory interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  molecular_functions:
  - preferred_term: GABA-A receptor activity
    term:
      id: GO:0004890
      label: GABA-A receptor activity
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:11326274
    reference_title: "First genetic evidence of GABA(A) receptor dysfunction in epilepsy: a mutation in the gamma2-subunit gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report a K289M mutation in the GABA(A) receptor gamma2-subunit gene (GABRG2) that segregates in a family with a phenotype closely related to GEFS+
    explanation: >-
      Establishes GABRG2 gamma-2 subunit variation as the first genetic evidence
      of GABA-A receptor dysfunction in human epilepsy.
  - reference: PMID:24480790
    reference_title: "Association of nonsense mutation in GABRG2 with abnormal trafficking of GABAA receptors in severe epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in GABRG2, which encodes the γ2 subunit of GABAA receptors, can cause both genetic epilepsy with febrile seizures plus (GEFS+) and Dravet syndrome.
    explanation: >-
      Documents the gene-anchored breadth of the GABRG2 phenotypic spectrum, from
      GEFS+ to Dravet syndrome.
  downstream:
  - target: Impaired GABA-A Receptor Assembly and Trafficking
    description: >-
      Gamma-2 subunit variants perturb receptor biogenesis, biasing pentamer
      assembly and surface delivery.
    causal_link_type: DIRECT

- name: Impaired GABA-A Receptor Assembly and Trafficking
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    Because the gamma-2 subunit is critical for GABA-A receptor assembly and
    trafficking, many variants reduce alpha-beta-gamma-2 receptor surface
    expression through impaired pentamer assembly, endoplasmic reticulum
    retention, and degradation. Truncating variants are frequently stably
    translated and exert dominant-negative effects on co-assembled wild-type
    subunits, amplifying the loss of surface receptors beyond simple
    haploinsufficiency.
  cell_types:
  - preferred_term: GABAergic inhibitory interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA-A receptor localization to the plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:24798517
    reference_title: "Three epilepsy-associated GABRG2 missense mutations at the γ+/β- interface disrupt GABAA receptor assembly and trafficking by similar mechanisms but to different extents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The γ2(R82Q) and γ2(P83S) subunits had reduced α1β2γ2 receptor surface expression due to impaired assembly into pentamers, endoplasmic reticulum (ER) retention and degradation.
    explanation: >-
      Directly demonstrates endoplasmic reticulum retention and reduced surface
      expression as the trafficking mechanism of GABRG2 epilepsy variants.
  - reference: PMID:11748509
    reference_title: "Truncation of the GABA(A)-receptor gamma2 subunit in a family with generalized epilepsy with febrile seizures plus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      fluorescent-microscopy studies have shown that receptors containing GFP-labeled gamma2(Q351X) protein are retained in the lumen of the endoplasmic reticulum.
    explanation: >-
      Shows that the truncating Q351X variant causes endoplasmic reticulum
      retention of GABA-A receptors.
  - reference: PMID:24480790
    reference_title: "Association of nonsense mutation in GABRG2 with abnormal trafficking of GABAA receptors in severe epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most GABRG2 truncating mutations associated with Dravet syndrome result in premature termination codons (PTCs) and are stably translated into mutant proteins with potential dominant-negative effects.
    explanation: >-
      Establishes the dominant-negative mechanism whereby stably translated
      truncated gamma-2 subunits impair co-assembled wild-type receptors.
  - reference: PMID:39143639
    reference_title: "GABRG2 mutations in genetic epilepsy with febrile seizures plus: structure, roles, and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The γ2 subunit plays a special role in receptor trafficking and is closely related to its structural specificity.
    explanation: >-
      A 2024 review affirms the special role of the gamma-2 subunit in GABA-A
      receptor trafficking, the mechanism perturbed by GABRG2 variants. Evidence
      source is OTHER because this is a review article.
  downstream:
  - target: Reduced GABA-Gated Chloride Current and Phasic Inhibition
    description: >-
      Fewer surface GABA-A receptors reduce the postsynaptic chloride
      conductance available for phasic inhibition.
    causal_link_type: DIRECT
  - target: Temperature-Sensitive Receptor Trafficking
    description: >-
      The mistrafficked mutant receptors are additionally temperature-labile, so
      febrile-range temperature further depletes them from the cell surface.
    causal_link_type: DIRECT

- name: Temperature-Sensitive Receptor Trafficking
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    A distinctive property of several GABRG2 variants is that their surface
    trafficking is temperature-sensitive: brief febrile-range temperature
    elevation dynamically reduces surface mutant receptors, while conversely
    lowering the temperature partially rescues surface expression. This provides a
    direct molecular link between the receptor-trafficking defect and the
    prominent fever-triggered seizures of GABRG2-related epilepsy.
  cell_types:
  - preferred_term: GABAergic inhibitory interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA-A receptor localization to the plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:16510738
    reference_title: "Why does fever trigger febrile seizures? GABAA receptor gamma2 subunit mutations associated with idiopathic generalized epilepsies have temperature-dependent trafficking deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      suggesting that febrile seizures may be produced by a temperature-induced dynamic reduction of susceptible mutant surface GABAA receptors in response to fever.
    explanation: >-
      Provides the temperature-sensitive-trafficking mechanism linking GABRG2
      receptor mistrafficking to fever-triggered seizures.
  - reference: PMID:24798517
    reference_title: "Three epilepsy-associated GABRG2 missense mutations at the γ+/β- interface disrupt GABAA receptor assembly and trafficking by similar mechanisms but to different extents."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      found increased surface and total levels of both wildtype and mutant γ2 subunits after decreasing the incubation temperature to 30°C for 24h, suggesting that lower temperatures increased GABAA receptor stability.
    explanation: >-
      Demonstrates temperature-sensitive trafficking: lower temperature rescues
      surface GABA-A receptor expression, the converse of fever-driven surface
      receptor loss.
  downstream:
  - target: Febrile seizures
    description: >-
      Temperature-sensitive trafficking dynamically depletes surface mutant
      receptors during fever, lowering the seizure threshold.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16510738
      reference_title: "Why does fever trigger febrile seizures? GABAA receptor gamma2 subunit mutations associated with idiopathic generalized epilepsies have temperature-dependent trafficking deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        suggesting that febrile seizures may be produced by a temperature-induced dynamic reduction of susceptible mutant surface GABAA receptors in response to fever.
      explanation: >-
        Provides the temperature-sensitive-trafficking mechanism linking GABRG2
        receptor mistrafficking to fever-triggered seizures.

- name: Reduced GABA-Gated Chloride Current and Phasic Inhibition
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    Reduced surface GABA-A receptors and altered channel gating decrease the
    GABA-gated chloride current, weakening fast phasic inhibitory
    neurotransmission. Functional studies of GABRG2 variants show decreased
    GABA-activated current amplitudes and, for some variants, abolished
    benzodiazepine (diazepam) sensitivity, consistent with loss of inhibitory
    receptor function.
  cell_types:
  - preferred_term: GABAergic inhibitory interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  molecular_functions:
  - preferred_term: GABA-gated chloride ion channel activity
    term:
      id: GO:0022851
      label: GABA-gated chloride ion channel activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: Chloride transmembrane transport
    term:
      id: GO:1902476
      label: chloride transmembrane transport
    modifier: DECREASED
  - preferred_term: GABAergic synaptic transmission
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: DECREASED
  evidence:
  - reference: PMID:11326274
    reference_title: "First genetic evidence of GABA(A) receptor dysfunction in epilepsy: a mutation in the gamma2-subunit gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the mutated and wild-type alleles in Xenopus laevis oocytes confirmed the predicted effect of the mutation, a decrease in the amplitude of GABA-activated currents.
    explanation: >-
      Direct electrophysiological evidence that a GABRG2 variant reduces
      GABA-activated (chloride) current.
  - reference: PMID:24480790
    reference_title: "Association of nonsense mutation in GABRG2 with abnormal trafficking of GABAA receptors in severe epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Electrophysiological studies with the reconstituted GABAA receptors in HEK cells showed reduced GABA-induced currents when mutated γ2 DNA was cotransfected with wild-type α1 and β2 subunits.
    explanation: >-
      Confirms reduced GABA-induced current when the mutant gamma-2 subunit is
      co-expressed with wild-type subunits (dominant-negative functional effect).
  - reference: PMID:11326275
    reference_title: "Mutant GABA(A) receptor gamma2-subunit in childhood absence epilepsy and febrile seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the mutation in GABRG2 (encoding the gamma2-subunit) abolished in vitro sensitivity to diazepam
    explanation: >-
      Demonstrates loss of benzodiazepine modulation of the mutant GABA-A
      receptor, a functional readout of impaired inhibitory receptor function.
  downstream:
  - target: Excitation-Inhibition Imbalance
    description: >-
      Loss of phasic inhibition shifts the cortical and thalamocortical
      excitation-inhibition balance toward net excitation.
    causal_link_type: DIRECT

- name: Excitation-Inhibition Imbalance
  role: intermediate
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  biological_scale: CELLULAR
  description: >-
    Because GABA-A receptors mediate most fast synaptic inhibition in the brain,
    diminished GABAergic tone shifts the balance between excitatory
    (glutamatergic) and inhibitory (GABAergic) signaling toward net excitation
    across cortical and thalamocortical circuits, the conserved amplifier step of
    the epilepsy excitation-inhibition-imbalance pathway.
  cell_types:
  - preferred_term: GABAergic inhibitory interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:16510738
    reference_title: "Why does fever trigger febrile seizures? GABAA receptor gamma2 subunit mutations associated with idiopathic generalized epilepsies have temperature-dependent trafficking deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pentameric GABAA receptors mediate the majority of fast synaptic inhibition in the brain
    explanation: >-
      Establishes that GABA-A receptors carry most fast synaptic inhibition, so
      their loss of function tips the excitation-inhibition balance toward
      excitation. Evidence source is OTHER because this is a general background
      statement rather than a disease-specific experimental finding.
  downstream:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    description: >-
      Net excitatory bias drives neuronal hyperexcitability and hypersynchrony.
    causal_link_type: DIRECT

- name: Neuronal Hyperexcitability and Hypersynchrony
  role: intermediate
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  biological_scale: CELLULAR
  description: >-
    The net excitatory bias produces a hyperexcitable, hypersynchronous neuronal
    state that lowers the seizure threshold and generates the seizures that define
    the disorder. GABRG2 loss of inhibitory function directly disinhibits
    excitatory networks.
  cell_types:
  - preferred_term: Excitatory pyramidal neuron

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other clinical features included fever-sensitive seizures (91.4%), cluster seizures (57.1%), and developmental delay (45.7%).
    explanation: >-
      Supports fever-sensitive (febrile) seizures as a very frequent (91.4%)
      feature of GABRG2-related epilepsy.

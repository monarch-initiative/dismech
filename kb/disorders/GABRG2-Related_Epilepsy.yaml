    snippet: >-
      Many epileptic encephalopathies have a genetic aetiology and are often associated with de novo mutations in genes mediating synaptic transmission, including GABAA receptor subunit genes.
    explanation: >-
      Establishes de novo GABA-A receptor subunit (including GABRG2) variants as

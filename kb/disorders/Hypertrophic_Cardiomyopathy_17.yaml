has_subtypes:
- name: Thr161Lys
  display_name: Finnish p.(Thr161Lys) founder variant
  description: >-
    A Finnish founder allele (c.482C>A) identified in nine index families and
    described by its authors as causing atypical HCM: alongside left
    ventricular hypertrophy it carries prominent conduction disease and
    progression to systolic heart failure with non-dilated chamber geometry.
    Penetrance is age-dependent, reaching 100% only by age 80.
  evidence:
  - reference: PMID:30235249
    reference_title: "Heterozygous junctophilin-2 (JPH2) p.(Thr161Lys) is a monogenic cause for HCM with heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we propose that the heterozygous JPH2 p.(Thr161Lys) variant is a new Finnish mutation causing atypical HCM"
    explanation: The authors' own designation of this allele as a distinct, atypical founder form.
experimental_models:
- name: JPH2 p.(Thr161Lys) patient-derived iPSC cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:37371654
  description: >-
    Skin fibroblasts from a Finnish patient carrying the p.(Thr161Lys) founder
    allele were reprogrammed to iPSCs and differentiated to cardiomyocytes,
    with an isogenic CRISPR-corrected counterpart as control. The isogenic
    design is what makes this informative: the comparison is against the same
    genetic background rather than an unrelated line, so the differences are
    attributable to the variant. It models the exact allele curated as a
    has_subtypes entry on this disease.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  modeled_mechanisms:
  - target: Prohypertrophic Cardiomyocyte Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The mutant cardiomyocytes reproduce the cellular hallmarks of
      hypertrophic cardiomyopathy - cellular hypertrophy, multi-nucleation and
      sarcomeric disarray.
    limitations: >-
      iPSC-derived cardiomyocytes are immature relative to adult myocardium,
      with fetal-like calcium handling and underdeveloped T-tubules. That last
      point matters more here than usual: the disease mechanism is dyad
      architecture, and the dyad is precisely the structure these cells have
      not fully formed.
    readouts:
    - name: Cellular hypertrophy, multi-nucleation and sarcomeric disarray
      target: Prohypertrophic Cardiomyocyte Remodeling
      direction: INCREASED
      interpretation: The cellular correlates of the hypertrophic phenotype are present in the mutant line.
      evidence:
      - reference: PMID:37371654
        reference_title: "The Junctophilin-2 Mutation p.(Thr161Lys) Is Associated with Hypertrophic Cardiomyopathy Using Patient-Specific iPS Cardiomyocytes and Demonstrates Prolonged Action Potential and Increased Arrhythmogenicity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "JPH2-hiPSC-CMs displayed key HCM hallmarks (cellular hypertrophy, multi-nucleation, sarcomeric disarray)."
        explanation: Directly reports the hypertrophic cellular phenotype in the patient-derived line.
    evidence:
    - reference: PMID:37371654
      reference_title: "The Junctophilin-2 Mutation p.(Thr161Lys) Is Associated with Hypertrophic Cardiomyopathy Using Patient-Specific iPS Cardiomyocytes and Demonstrates Prolonged Action Potential and Increased Arrhythmogenicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "JPH2-hiPSC-CMs displayed key HCM hallmarks (cellular hypertrophy, multi-nucleation, sarcomeric disarray)."
      explanation: Supports treating this line as informative for the hypertrophic remodeling node.
  - target: Disordered Intracellular Calcium Handling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The mutant cardiomyocytes show prolonged action potential duration and
      increased arrhythmogenicity, attributed to slower inactivation of calcium
      channels - a calcium-handling abnormality in a human cell carrying the
      disease allele.
    limitations: >-
      Immature calcium handling and incomplete T-tubule development mean the
      magnitude of the defect should not be read across to adult myocardium.
    readouts:
    - name: Action potential duration and arrhythmogenicity
      target: Disordered Intracellular Calcium Handling
      direction: INCREASED
      interpretation: Prolonged action potential with increased arrhythmic events in the mutant line.
      evidence:
      - reference: PMID:37371654
        reference_title: "The Junctophilin-2 Mutation p.(Thr161Lys) Is Associated with Hypertrophic Cardiomyopathy Using Patient-Specific iPS Cardiomyocytes and Demonstrates Prolonged Action Potential and Increased Arrhythmogenicity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "JPH2-hiPSC-CMs exhibit a higher degree of arrhythmia and longer action potential duration associated with slower inactivation of calcium channels"
        explanation: Reports the electrophysiological and calcium-handling abnormality measured in the patient-derived line.
    evidence:
    - reference: PMID:37371654
      reference_title: "The Junctophilin-2 Mutation p.(Thr161Lys) Is Associated with Hypertrophic Cardiomyopathy Using Patient-Specific iPS Cardiomyocytes and Demonstrates Prolonged Action Potential and Increased Arrhythmogenicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional evaluation supported clinical observations, with differences in beating characteristics when compared with isogenic-hiPSC-CMs."
      explanation: The isogenic comparison supports attributing the functional differences to the variant.
prevalence:
- population: Unrelated hypertrophic cardiomyopathy probands
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Reported as a yield within an HCM cohort, not a population prevalence:
    three of 388 unrelated HCM patients carried an HCM-associated JPH2 variant
    in the original screen. JPH2 is a minor HCM gene; the eight core sarcomeric
    genes account for more than 90% of pathogenic variants in HCM.
  evidence:
  - reference: PMID:17509612
    reference_title: "Mutations in JPH2-encoded junctophilin-2 associated with hypertrophic cardiomyopathy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were discovered in 3/388 unrelated patients with HCM"
    explanation: The reported yield of JPH2 variants among unrelated HCM probands.
treatments:
- name: Genetic Testing and Cascade Family Screening
  description: >-
    Identifying a JPH2 variant permits predictive testing of relatives, but the
    Moderate ClinGen classification and the age-dependent penetrance both bear
    on how a result should be reported. A variant in a moderate-evidence gene
    carries less interpretive weight than one in a definitive sarcomeric gene,
    and an unaffected middle-aged carrier is not evidence against the variant.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classification of HCM genes and variants is critical, as misclassification can lead to genetic misdiagnosis."
    explanation: States why gene-level validity must inform how a JPH2 result is reported to a family.
- name: Genetic Counseling
  description: >-
    Counseling should convey the autosomal dominant inheritance, the
    age-dependent and incomplete penetrance documented in the founder families,
    and the Moderate strength of the underlying gene-disease relationship.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30235249
    reference_title: "Heterozygous junctophilin-2 (JPH2) p.(Thr161Lys) is a monogenic cause for HCM with heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 26 heterozygotes with the variant and penetrance was 71% by age 60 and 100% by age 80."
    explanation: Provides the age-dependent penetrance figures that counseling must convey.
notes: >-
  Management of established hypertrophic cardiomyopathy in JPH2 variant
  carriers follows general HCM care and is not curated here as
  JPH2-specific; no gene-directed therapy exists. The conduction disease
  reported in the Finnish founder families may warrant device consideration on
  standard indications, but no JPH2-specific device evidence was found and none
  is asserted.

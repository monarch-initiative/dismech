inheritance:
- name: Autosomal dominant
  description: >-
    Reported HCM-associated JPH2 variants are heterozygous and segregate as an
    autosomal dominant trait. Penetrance is age-dependent and incomplete: in
    the Finnish p.(Thr161Lys) founder families it was 71% by age 60 and 100% by
    age 80, so an unaffected middle-aged carrier does not exclude the variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30235249
    reference_title: "Heterozygous junctophilin-2 (JPH2) p.(Thr161Lys) is a monogenic cause for HCM with heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 26 heterozygotes with the variant and penetrance was 71% by age 60 and 100% by age 80."
    explanation: Quantifies age-dependent penetrance in heterozygotes, establishing the dominant but incompletely penetrant inheritance pattern.
pathophysiology:
- name: Junctophilin-2 Structural Deficit
  description: >-
    Junctophilin-2 spans the narrow gap of the cardiac dyad, anchoring in the
    sarcoplasmic reticulum membrane and binding the plasma membrane, so that
    the junctional membrane complex is physically held together. Both routes
    documented in human disease reduce the amount of functional protein at that
    junction: missense variants at key functional domains reorganize the
    protein, and JPH2 expression is itself reduced in myocardium from patients
    with hypertrophic cardiomyopathy. The lesion is architectural rather than
    contractile - nothing about the sarcomere's force-generating machinery is
    directly altered.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Junctional sarcoplasmic reticulum membrane
    term:
      id: GO:0014701
      label: junctional sarcoplasmic reticulum membrane
  downstream:
  - target: Dyad Disruption and Uncoupling of the L-Type Channel from the Ryanodine Receptor
    causal_link_type: DIRECT
    description: >-
      Losing the physical bridge separates the two channels that must be
      apposed for calcium-induced calcium release.
    evidence:
    - reference: PMID:25659516
      reference_title: "Ca²⁺ microdomains organized by junctophilins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In muscle cells, junctophilin deficiency prevents JMC formation and functional crosstalk between cell-surface Ca(2+) channels and ER/SR Ca(2+) release channels."
      explanation: States the direct structural-to-functional consequence - without junctophilin the junctional complex does not form and the two channel classes stop communicating.
  evidence:
  - reference: PMID:17509612
    reference_title: "Mutations in JPH2-encoded junctophilin-2 associated with hypertrophic cardiomyopathy in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "each human mutation caused (i) protein reorganization of junctophilin-2"
    explanation: Functional characterisation showing each HCM-associated variant reorganizes the protein itself, which is the structural deficit this node describes.
  - reference: PMID:21216834
    reference_title: "Junctophilin-2 expression silencing causes cardiocyte hypertrophy and abnormal intracellular calcium handling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JPH2 expression was reduced in flash-frozen human cardiac tissue procured from patients with HCM compared with ostensibly healthy traumatic death victims."
    explanation: Shows reduced junctophilin-2 in human HCM myocardium, an expression-level route to the same structural deficit as the coding variants.
- name: Dyad Disruption and Uncoupling of the L-Type Channel from the Ryanodine Receptor
  description: >-
    The cardiac dyad exists so that calcium entering through the L-type channel
    reaches the ryanodine receptor at a high enough local concentration to
    trigger sarcoplasmic reticulum calcium release. Widening or disorganizing
    that junction breaks the trigger. In JPH2-silenced myocytes the calcium
    transient loses its dependence on L-type channel activation, which is the
    signature of a broken structural coupling rather than of a channel that has
    itself stopped working.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Release of sequestered calcium into cytosol by sarcoplasmic reticulum
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DECREASED
  downstream:
  - target: Disordered Intracellular Calcium Handling
    causal_link_type: DIRECT
    description: >-
      An untriggered or weakly triggered release produces an abnormal calcium
      transient.
    evidence:
    - reference: PMID:21216834
      reference_title: "Junctophilin-2 expression silencing causes cardiocyte hypertrophy and abnormal intracellular calcium handling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "shJPH2 cells demonstrated depressed maximal Ca(2+) transient amplitudes that were insensitive to L-type Ca(2+) channel activation with JPH2 knockdown"
      explanation: The loss of L-type sensitivity is the specific signature of structural uncoupling, and it is the measured consequence of reducing junctophilin-2.
  evidence:
  - reference: PMID:17476457
    reference_title: "Mutation of junctophilin type 2 associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the mutant cardiac myocytes exhibit impaired formation of peripheral couplings and arrhythmic Ca2+ signaling caused by functional uncoupling between dihydropyridine and ryanodine receptor channels"
    explanation: The Jph2 knockout mouse establishes the uncoupling mechanism directly, naming both channel partners.
- name: Disordered Intracellular Calcium Handling
  description: >-
    Calcium transients are reduced in amplitude and sarcoplasmic reticulum
    stores are depleted. Because intracellular calcium is simultaneously the
    contractile trigger and the input to hypertrophic signalling, this node is
    modelled as the shared origin of both clinical arms - the hypertrophic
    remodelling and the arrhythmic vulnerability.

    That shared origin is the canonical reading, not a settled one. Beavers et
    al argue the opposite for E169K specifically: they attribute its
    arrhythmogenicity to reduced JPH2-RyR2 binding while stating that HCM
    development in JPH2 disease likely involves other cellular mechanisms
    still to be explored. Their E169K mice were AF-susceptible with no
    structural cardiomyopathy at two months, which is the observation that
    separates the arms. Their refuting sentence is carried below rather than
    left implicit, since three quotes from that same paper support the
    downstream edges leaving this node.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: DECREASED
  - preferred_term: Regulation of cardiac muscle contraction by calcium ion signaling
    term:
      id: GO:0010882
      label: regulation of cardiac muscle contraction by calcium ion signaling
    modifier: DECREASED
  downstream:
  - target: Prohypertrophic Cardiomyocyte Remodeling
    causal_link_type: DIRECT
    description: >-
      Altered calcium handling engages the hypertrophic signalling programme in
      the cardiomyocyte.
    evidence:
    - reference: PMID:21216834
      reference_title: "Junctophilin-2 expression silencing causes cardiocyte hypertrophy and abnormal intracellular calcium handling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Partial silencing of JPH2 expression in HL-1 cells by a small interfering RNA probe targeted to murine JPH2 mRNA (shJPH2) resulted in myocyte hypertrophy and increased expression of known markers of cardiac hypertrophy."
      explanation: Reducing junctophilin-2 alone is sufficient to produce myocyte hypertrophy with induction of hypertrophic markers.
  - target: Arrhythmia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disordered calcium release is the substrate for the arrhythmic
      vulnerability and conduction disease seen in carriers, and the steps
      between the two are identified rather than assumed. Spontaneous
      sarcoplasmic reticulum calcium release appears as cell-wide calcium
      waves; these activate the sodium-calcium exchanger, which generates
      delayed afterdepolarizations, and the resulting triggered activity is
      the arrhythmia. This was worked out for the E169K allele, found in
      hypertrophic cardiomyopathy patients with juvenile-onset paroxysmal
      atrial fibrillation and modelled in pseudoknock-in mice.
    evidence:
    - reference: PMID:23973696
      reference_title: "Mutation E169K in junctophilin-2 causes atrial fibrillation due to impaired RyR2 stabilization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These cell-wide spontaneous Ca2+ waves can directly activate NCX, trigger delayed afterdepolarizations (DADs) and cause triggered activity associated with AF"
      explanation: Names the intermediates that lie between disordered calcium release and the arrhythmia itself - calcium waves, sodium-calcium exchanger activation, delayed afterdepolarizations, triggered activity.
    - reference: PMID:23973696
      reference_title: "Mutation E169K in junctophilin-2 causes atrial fibrillation due to impaired RyR2 stabilization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These changes were attributed to reduced binding of E169K-JPH2 to RyR2."
      explanation: Upstream allele context - loss of JPH2-RyR2 binding is what makes the calcium release abnormal in the first place, so it is the reason this edge is engaged rather than a step within it.
    - reference: PMID:23973696
      reference_title: "Mutation E169K in junctophilin-2 causes atrial fibrillation due to impaired RyR2 stabilization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "E169K-PKI but not A399A-PKI atrial cardiomyocytes showed an increased incidence of abnormal SR Ca(2+) release events."
      explanation: Demonstrates the abnormal calcium release that constitutes the arrhythmic substrate, with an allele-specific control.
    - reference: PMID:17476457
      reference_title: "Mutation of junctophilin type 2 associated with hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "arrhythmic Ca2+ signaling caused by functional uncoupling between dihydropyridine and ryanodine receptor channels"
      explanation: Independent knockout-model support for arrhythmic calcium signalling arising from the same uncoupling.
  evidence:
  - reference: PMID:17509612
    reference_title: "Mutations in JPH2-encoded junctophilin-2 associated with hypertrophic cardiomyopathy in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "each human mutation caused (i) protein reorganization of junctophilin-2, (ii) perturbations in intracellular calcium signaling, and (iii) marked cardiomyocyte hyperplasia"
    explanation: All three human HCM variants produced calcium-signalling perturbation on functional characterisation.
  - reference: PMID:23973696
    reference_title: "Mutation E169K in junctophilin-2 causes atrial fibrillation due to impaired RyR2 stabilization."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "it is likely that the proarrhythmogenic effects of the E169K mutation are due to the reduced binding of E169K-JPH2 to RyR2, whereas HCM development likely involves other cellular mechanisms that remain to be explored in future studies"
    explanation: Contradicts modelling one calcium disturbance as the shared origin of both arms - for E169K these authors separate the arrhythmic mechanism from the hypertrophic one and place the latter outside this node.
- name: Prohypertrophic Cardiomyocyte Remodeling
  description: >-
    Cardiomyocytes enlarge and induce the canonical hypertrophic gene
    programme, producing the left ventricular hypertrophy that defines the
    clinical phenotype. In a subset of patients the disease progresses beyond
    hypertrophy to systolic failure with normal or only mildly enlarged
    diastolic dimensions - an end-stage picture that is not typical
    burnt-out HCM and was one reason the Finnish cohort was described as
    atypical.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cardiac muscle hypertrophy in response to stress
    term:
      id: GO:0014898
      label: cardiac muscle hypertrophy in response to stress
    modifier: INCREASED
  locations:
  - preferred_term: Myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  downstream:
  - target: Left ventricular hypertrophy
    causal_link_type: DIRECT
    description: >-
      Cardiomyocyte hypertrophy summed across the ventricular wall is the
      macroscopic hypertrophy.
    evidence:
    - reference: PMID:30235249
      reference_title: "Heterozygous junctophilin-2 (JPH2) p.(Thr161Lys) is a monogenic cause for HCM with heart failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Main clinical features were left ventricular hypertrophy, arrhythmia vulnerability and conduction abnormalities including third degree AV-block."
      explanation: Reports left ventricular hypertrophy as the leading clinical feature in the largest JPH2 HCM cohort.
  evidence:
  - reference: PMID:21216834
    reference_title: "Junctophilin-2 expression silencing causes cardiocyte hypertrophy and abnormal intracellular calcium handling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "resulted in myocyte hypertrophy and increased expression of known markers of cardiac hypertrophy"
    explanation: Documents the cellular hypertrophy and hypertrophic marker induction that constitute this node.
mechanistic_hypotheses:
- hypothesis_group_id: dyad_architecture_not_sarcomere
  hypothesis_label: CMH17 arises from dyad architectural failure rather than altered sarcomeric cross-bridge kinetics
  status: CANONICAL
  description: >-
    The eight definitive HCM genes encode sarcomeric proteins, and the dominant
    model of HCM is altered actin-myosin cross-bridge kinetics with increased
    myofilament calcium sensitivity. JPH2 encodes no part of the sarcomere. The
    proposed mechanism for CMH17 is instead that loss of the junctophilin-2
    bridge widens or disorganizes the dyad, uncouples the L-type channel from
    the ryanodine receptor, and drives hypertrophy through disordered calcium
    signalling. The chain is supported by a knockout model, by siRNA silencing
    sufficient to produce hypertrophy in isolation, and by functional
    characterisation of the three original human variants. What it does not yet
    have is direct demonstration of dyad ultrastructural disruption in
    myocardium from a genotyped human CMH17 patient, so the human step of the
    argument rests on reduced JPH2 protein in HCM tissue rather than on imaging
    the junction itself.
  evidence:
  - reference: PMID:17509612
    reference_title: "Mutations in JPH2-encoded junctophilin-2 associated with hypertrophic cardiomyopathy in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The molecular and functional evidence implicates defective junctophilin-2 and disrupted calcium signaling as a novel pathogenic mechanism for HCM"
    explanation: The authors' own statement of the mechanism as distinct from established sarcomeric HCM pathogenesis.
  - reference: PMID:34526680
    reference_title: "Minor hypertrophic cardiomyopathy genes, major insights into the genetics of cardiomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "variants in several additional genes (ACTN2, ALPK3, CSRP3, FHOD3, FLNC, JPH2, KLHL24, PLN and TRIM63), encoding non-sarcomeric proteins with diverse functions, have been shown to be disease-causing in a small number of patients"
    explanation: Places JPH2 explicitly among the non-sarcomeric HCM genes, which is the premise of this hypothesis.

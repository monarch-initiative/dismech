genetic:
- name: JPH2
  association: Causal
  gene_term:
    preferred_term: JPH2
    term:
      id: hgnc:14202
      label: JPH2
  notes: >-
    Heterozygous JPH2 missense variants are reported in HCM: S101R, Y141H and
    S165F in three of 388 unrelated probands (Landstrom et al), G505S with a
    statistically significant case-control excess in a Japanese cohort
    (Matsushita et al), and the Finnish founder allele c.482C>A p.(Thr161Lys)
    segregating across nine families (Vanninen et al). ClinGen's Hereditary
    Cardiovascular Disease Gene Curation Expert Panel grades JPH2 for autosomal
    dominant HCM as Moderate. Separately, JPH2 is graded Strong for autosomal
    recessive dilated cardiomyopathy and Limited for autosomal dominant DCM by
    the Dilated Cardiomyopathy GCEP, so allele and inheritance pattern both
    matter to interpretation. The 2024 HCM reappraisal left JPH2 at Moderate
    rather than downgrading it, so that grade is current.

    Allele matters to phenotype as well as to validity. E169K was found in 2
    of 203 unrelated HCM probands screened by Beavers et al, both with
    juvenile-onset paroxysmal atrial fibrillation - an index case whose
    fibrillation began at 22, before significant atrial remodeling, and his
    father, who had supraventricular tachycardia. A405S, identified in the
    same cohort, was not associated with atrial arrhythmia, and neither were
    the previously reported HCM alleles. The arrhythmic phenotype of this
    entry is therefore an E169K observation rather than a general property of
    JPH2-associated HCM.
  evidence:
  - reference: PMID:23973696
    reference_title: "Mutation E169K in junctophilin-2 causes atrial fibrillation due to impaired RyR2 stabilization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening 203 unrelated hypertrophic cardiomyopathy patients uncovered a novel JPH2 missense mutation (E169K) in 2 patients with juvenile-onset paroxysmal AF (pAF)."
    explanation: The human cohort finding that establishes E169K as an HCM allele and ties it to juvenile-onset atrial fibrillation.
  - reference: PMID:23973696
    reference_title: "Mutation E169K in junctophilin-2 causes atrial fibrillation due to impaired RyR2 stabilization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient with the other HCM-associated JPH2 mutation, A405S, did not exhibit atrial arrhythmias, similar to all other previously reported HCM patients with JPH2 mutations"
    explanation: The allele-specific control - other JPH2 HCM alleles carried no atrial arrhythmia, so the arrhythmic phenotype should not be generalized across the gene.
  - reference: CGGV:assertion_378a727d-0c5b-4563-9c96-ac18a2902742-2022-10-12T160000.000Z
    reference_title: "JPH2 / hypertrophic cardiomyopathy (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "JPH2 | HGNC:14202 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Moderate | SOP9 | Hereditary Cardiovascular Disease Gene Curation Expert Panel | 2022-10-12T16:00:00.000Z"
    explanation: The current ClinGen gene-disease validity classification for JPH2 in autosomal dominant hypertrophic cardiomyopathy.
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, and MYL3); 3 had moderate evidence ( CSRP3, TNNC1, and JPH2; 33%)"
    explanation: Places JPH2 in the moderate-evidence tier against the definitive sarcomeric genes, giving the comparative context for this entry's confidence.
  - reference: PMID:17509612
    reference_title: "Mutations in JPH2-encoded junctophilin-2 associated with hypertrophic cardiomyopathy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three novel HCM-susceptibility mutations: S101R, Y141H and S165F, which localize to key functional domains, were discovered in 3/388 unrelated patients with HCM and were absent in 1000 ethnic-matched reference alleles."
    explanation: The original variant discovery with an allele-frequency control, which is the foundation of the gene-disease claim.
  - reference: PMID:17476457
    reference_title: "Mutation of junctophilin type 2 associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only the G505S mutation showed statistical significance (4/296 HCM patients and 0/472 control individuals, P=0.022)"
    explanation: An independent case-control association for a distinct JPH2 allele, surviving correction for multiple comparisons.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "1 no evidence ( TNNC2), 6 limited ( KLF10, NEXN, OBSCN, PDLIM3, RYR2, TTN ), 1 moderate (JPH2), and 3 definitive evidence (CACNA1C, FLNC, PRKAG2)"
    explanation: The 2024 reappraisal left JPH2 at Moderate rather than downgrading it, so the classification cited here is the current one and not a stale grade.
  - reference: CGGV:assertion_7aa138ae-114c-46b0-84e4-5bfc5a7db51b-2025-01-24T170000.000Z
    reference_title: "JPH2 / dilated cardiomyopathy (Strong)"

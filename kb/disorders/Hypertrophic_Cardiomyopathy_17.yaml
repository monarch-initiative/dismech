name: Hypertrophic Cardiomyopathy 17
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- CMH17
- cardiomyopathy, familial hypertrophic, 17
- hypertrophic cardiomyopathy type 17
- JPH2 hypertrophic cardiomyopathy
- hypertrophic cardiomyopathy caused by mutation in JPH2
description: >-
  Hypertrophic cardiomyopathy 17 (CMH17) is the JPH2-attributed member of the
  numbered familial hypertrophic cardiomyopathy series. JPH2 encodes
  junctophilin-2, which is not a sarcomeric protein: it is the structural
  bridge that holds the T-tubule membrane against the junctional sarcoplasmic
  reticulum, keeping the L-type calcium channel and the ryanodine receptor
  close enough for calcium-induced calcium release to work. The proposed
  mechanism is therefore failure of dyad architecture and of
  excitation-contraction coupling, rather than the altered actin-myosin
  cross-bridge kinetics of classic sarcomeric HCM.

  Evidence for the gene-disease relationship is real but not definitive, and
  the entry states this rather than implying otherwise. ClinGen's Hereditary
  Cardiovascular Disease Gene Curation Expert Panel classifies JPH2 for
  autosomal dominant hypertrophic cardiomyopathy as **Moderate** - above the
  Limited tier that most non-sarcomeric HCM candidates occupy, below the
  Definitive tier of the eight core sarcomeric genes. The supporting evidence
  is three unrelated probands from a 388-patient screen with functional
  characterisation, a separate Japanese association, and a Finnish founder
  variant with documented segregation across nine families.

  JPH2 also carries a separate and differently graded relationship with dilated
  cardiomyopathy - Strong for autosomal recessive inheritance, Limited for
  autosomal dominant - so the gene is not simply an HCM gene, and genotype
  interpretation depends on the allele and the inheritance pattern.

- name: Cochlear autoinflammation and hearing loss
  biological_scale: TISSUE
  description: >
    Progressive sensorineural hearing loss in MWS reflects local NLRP3
    inflammasome-driven autoinflammation in the cochlea. Resident
    macrophage/monocyte-like cells in the cochlea activate the NLRP3
    inflammasome and secrete IL-1beta, producing chronic cochlear inflammation
    and progressive hearing loss.

- name: AA (serum amyloid A) amyloidosis
  biological_scale: TISSUE
  conforms_to: "amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition"
  description: >
    The most serious long-term complication of MWS. Sustained systemic
    inflammation keeps the acute-phase precursor serum amyloid A (SAA)
    chronically elevated; SAA misfolds and aggregates into insoluble AA amyloid
    fibrils that deposit in the extracellular space, preferentially in the
    kidney, causing proteinuria and progressive renal amyloidosis. This node
    substitutes serum amyloid A as the amyloidogenic precursor of the conserved
    amyloidogenesis chain.
  locations:
  - preferred_term: Kidney
    term:
      id: UBERON:0002113
      label: kidney

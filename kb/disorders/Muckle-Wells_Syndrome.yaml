differential_diagnoses:
- name: Familial cold autoinflammatory syndrome
  description: >
    The mildest CAPS phenotype, with cold-triggered urticarial episodes, fever,
    and arthralgia and, unlike MWS, generally without progressive hearing loss
    or amyloidosis.
  disease_term:
    preferred_term: familial cold autoinflammatory syndrome
    term:
      id: MONDO:0018768
      label: familial cold autoinflammatory syndrome
  evidence:
  - reference: PMID:11687797
    reference_title: "Mutation of a new gene encoding a putative pyrin-like protein causes familial cold autoinflammatory syndrome and Muckle-Wells syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial cold autoinflammatory syndrome (FCAS, MIM 120100), commonly known as familial cold urticaria (FCU), is an autosomal-dominant systemic inflammatory disease characterized by intermittent episodes of rash, arthralgia, fever and conjunctivitis after generalized exposure to cold."
    explanation: FCAS is the milder, cold-triggered CAPS phenotype distinguished from MWS, which is largely cold-independent and carries hearing loss and amyloidosis risk.
- name: CINCA syndrome
  description: >
    The most severe CAPS phenotype (NOMID), with neonatal-onset chronic aseptic
    meningitis, deforming arthropathy with epiphyseal overgrowth, and
    neurodevelopmental impairment absent in MWS.
  disease_term:
    preferred_term: CINCA syndrome
    term:
      id: MONDO:0011776
      label: CINCA syndrome
  evidence:
  - reference: PMID:36275641
    reference_title: "NLRP3 inflammasome and NLRP3-related autoinflammatory diseases: From cryopyrin function to targeted therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "higher levels of acute phase reactants and severe articular and neurological involvement"
    explanation: CINCA/NOMID is distinguished from MWS by its severe articular and neurological (CNS) involvement and higher acute-phase reactants, features absent in the intermediate MWS phenotype.

pathophysiology:
- name: NLRP3 gain-of-function activation
  biological_scale: MOLECULAR
  description: >
    Heterozygous gain-of-function missense mutations in NLRP3 (CIAS1, encoding
    cryopyrin) lower the activation threshold of the NLRP3 inflammasome. NLRP3
    is an intracellular NOD-like receptor sensor with a pyrin domain, a NACHT
    nucleotide-binding domain, and a leucine-rich repeat region; MWS mutations
    drive the sensor outside its normal autoinhibitory regulatory constraints.

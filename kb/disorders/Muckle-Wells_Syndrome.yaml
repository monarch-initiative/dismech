    Recombinant IL-1 receptor antagonist (blocks IL-1alpha and IL-1beta), given
    daily; effective across the CAPS spectrum including MWS, rapidly controlling
    inflammation and normalizing acute-phase reactants.
  therapeutic_modality: OTHER
  treatment_term:

name: Muckle-Wells Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
synonyms:
- MWS
- Urticaria-deafness-amyloidosis syndrome
- UDA syndrome
- NLRP3-associated autoinflammatory disease, intermediate
disease_term:
  preferred_term: Muckle-Wells syndrome
  term:
    id: MONDO:0008633
    label: Muckle-Wells syndrome
parents:
- Autoinflammatory diseases
- Cryopyrin-associated periodic syndromes
description: >
  Muckle-Wells syndrome (MWS) is a dominantly inherited autoinflammatory
  disorder representing the intermediate-severity phenotype of the
  cryopyrin-associated periodic syndrome (CAPS) spectrum, sitting between the
  mild familial cold autoinflammatory syndrome (FCAS) and the severe
  CINCA/NOMID. It is caused by heterozygous gain-of-function mutations in NLRP3
  (CIAS1, encoding cryopyrin) that lower the activation threshold of the NLRP3
  inflammasome, producing constitutive caspase-1 activation and excessive
  interleukin-1beta (IL-1beta) secretion. Clinically it is characterized by
  recurrent (largely non-cold-triggered) episodes of urticaria-like rash,
  fever, arthralgia, myalgia, conjunctivitis, and fatigue, together with
  progressive sensorineural hearing loss from cochlear autoinflammation. Its
  most serious long-term complication is AA (serum amyloid A) amyloidosis with
  renal involvement, driven by sustained systemic inflammation. IL-1 blockade
  (anakinra, canakinumab, rilonacept) is the defining, disease-modifying
  therapy.

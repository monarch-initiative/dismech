mechanistic_hypotheses:
- hypothesis_group_id: canonical_nlrp3_il1_inflammasome_model
  hypothesis_label: Canonical NLRP3 Inflammasome / IL-1beta Model
  status: CANONICAL
  description: >-
    Gain-of-function NLRP3 mutations cause constitutive inflammasome assembly and
    caspase-1 activation, driving excessive IL-1beta production as the central
    effector of the systemic and organ-specific inflammation of MWS. The dominant
    pathogenic role of IL-1beta is established by the rapid clinical and
    biochemical response to IL-1 blockade.
review_notes: >-
  GeneReviews baseline check (re-verified 2026-08-29 against the NCBI GeneReviews
  A-to-Z / Bookshelf): GeneReviews has no dedicated chapter for Muckle-Wells
  syndrome, NLRP3-associated autoinflammatory disease, or the broader
  cryopyrin-associated periodic syndromes (CAPS). Related hereditary
  periodic-fever chapters (e.g. Familial Mediterranean Fever, TNF
  Receptor-Associated Periodic Fever Syndrome) exist, but none covers CAPS/NLRP3;
  the disorder is covered instead by primary reviews. No GeneReviews baseline is
  tagged. MWS is the intermediate phenotype of the CAPS spectrum; its sibling CAPS
  entries in this KB are Familial_Cold_Autoinflammatory_Syndrome (the mild end)
  and, for the severe end, the CINCA/NOMID differential (see
  differential_diagnoses). Created de novo (no deep-research provider used, per
  task constraints) from primary literature; snippets verified against cached
  references and ontology terms validated with OAK.

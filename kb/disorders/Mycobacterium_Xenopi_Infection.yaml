name: Mycobacterium Xenopi Infection
synonyms:
- Mycobacterium xenopi caused disease or disorder
- Mycobacterium xenopi disease or disorder
- Mycobacterium xenopi infectious disease
creation_date: "2026-09-30T10:37:00Z"
description: >-
  Mycobacterium xenopi infection is a nontuberculous mycobacterial infection in
  which inhaled environmental M. xenopi survives in pulmonary macrophage
  compartments, drives granulomatous airway and parenchymal inflammation, and
  can produce chronic cavitary lung disease.
category: Infectious Disease
disease_term:
  preferred_term: Mycobacterium xenopi infection
  term:
    id: MONDO:0017832
    label: Mycobacterium xenopi infection
parents:
- Mycobacterial infectious disease
infectious_agent:
- name: Mycobacterium xenopi
  description: >-
    Mycobacterium xenopi is a slow-growing environmental nontuberculous
    mycobacterium associated chiefly with chronic pulmonary infection.
  infectious_agent_term:
    preferred_term: Mycobacterium xenopi
    term:
      id: NCBITaxon:1789
      label: Mycobacterium xenopi
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Environmental Aerosol Inhalation
  description: >-
    Environmental mycobacteria are acquired from water-associated aerosols into
    susceptible airways rather than by sustained person-to-person spread.
  evidence:
  - reference: PMID:8132983
    reference_title: >-
      A nosocomial pseudo-outbreak of Mycobacterium xenopi due to a contaminated
      potable water supply: lessons in prevention.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M xenopi was isolated from tap water in 20 of 24 patient rooms tested, the
      endoscopy suite, and the central hot water mixing tank, but not from water
      in the microbiology laboratory.
    explanation: >-
      Identifies potable and hot-water plumbing as an environmental M. xenopi
      source that can contaminate respiratory and other clinical specimens.
pathophysiology:
- name: Inhaled Mycobacterium xenopi Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    M. xenopi reaches structurally susceptible lower airways after inhalation
    from an environmental water reservoir.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pulmonary Macrophage Persistence
    causal_link_type: DIRECT
    description: >-
      Organisms that evade local killing persist in macrophage-rich airway and
      parenchymal niches.
- name: Pulmonary Macrophage Persistence
  biological_scale: CELLULAR
  description: >-
    Intracellular mycobacteria persist inside infected phagocytes and maintain
    chronic local immune activation.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: immune response
    modifier: INCREASED
    term:
      id: GO:0006955
      label: immune response
  - preferred_term: type II interferon-mediated signaling pathway
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Granulomatous Pulmonary Inflammation
    causal_link_type: DIRECT
    description: >-
      Infected macrophages and recruited lymphocytes organize into chronic
      granulomatous lesions.
  evidence:
  - reference: PMID:18515557
    reference_title: Susceptibility to nontuberculous mycobacterial lung disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with pre-existing structural lung disease are known to be at risk
      of NTMLD.
    explanation: >-
      Establishes structural lung disease as a susceptibility context for
      nontuberculous mycobacterial persistence in the lung.
  - reference: PMID:18515557
    reference_title: Susceptibility to nontuberculous mycobacterial lung disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      patients with genetically determined defects of cell-mediated immunity,
      including abnormalities of the interleukin-12/interferon-gamma axis
    explanation: >-
      Supports type-II-interferon macrophage activation as a host-defense axis
      relevant to nontuberculous mycobacterial lung susceptibility.
- name: Granulomatous Pulmonary Inflammation
  biological_scale: TISSUE
  description: >-
    Persistent granulomatous inflammation remodels airway-adjacent lung tissue
    and can progress to cavitary nontuberculous mycobacterial disease.
  downstream:
  - target: Productive cough
    causal_link_type: DIRECT
    description: >-
      Bronchiectatic airway injury increases sputum production.
  - target: Bronchiectasis
    causal_link_type: DIRECT
    description: >-
      Chronic mycobacterial airway inflammation is coupled to
      nodular-bronchiectatic radiographic disease.
phenotypes:
- name: Productive cough
  category: Respiratory
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Productive cough
    term:
      id: HP:0031245
      label: Productive cough
  evidence:
  - reference: PMID:40139333
    reference_title: >-
      Clinical characteristics and diagnostic practices in nontuberculous
      mycobacterial pulmonary disease: Insights from Denmark.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms included cough (62 %), expectoration (51 %), dyspnea (43 %), and
      systemic symptoms (42 %), with 36 % experiencing symptoms for over 6
      months.
    explanation: >-
      Uses expectoration in a pulmonary-NTM cohort that included M. xenopi to
      support productive cough as part of the pulmonary presentation.
- name: Bronchiectasis
  category: Respiratory
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
  evidence:
  - reference: PMID:34702233
    reference_title: >-
      Management of patients with pulmonary mycobacteriosis in France: a
      multicenter retrospective cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A slightly higher rate of nodulobronchiectatic pattern (42.6%) than
      cavitations (34%) was observed in patients with NTM-PD cause by M. xenopi.
    explanation: >-
      Reports nodular-bronchiectatic disease in 42.6% of M. xenopi pulmonary
      disease cases in a multicenter French NTM-PD cohort.
progression:
- phase: Chronic pulmonary M. xenopi disease
  notes: >-
    M. xenopi pulmonary disease is chronic nontuberculous mycobacterial lung
    disease with high mortality among NTM species; available comparisons suggest
    that host comorbidity contributes substantially to this adverse prognosis.
  evidence:
  - reference: PMID:32421543
    reference_title: >-
      Clinical outcomes in Mycobacterium xenopi versus Mycobacterium avium
      complex pulmonary disease: A retrospective matched cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mycobacterium xenopi is associated with the highest mortality among
      pulmonary nontuberculous mycobacterial (NTM) infections, but whether this
      is due to the infection or other factors is unclear.
    explanation: >-
      Frames the prognosis of M. xenopi pulmonary disease and the uncertainty
      about how much of the high mortality is pathogen-specific versus driven by
      comorbid host lung disease.
diagnosis:
- name: Composite NTM pulmonary disease criteria
  description: >-
    Diagnosis requires compatible pulmonary symptoms and imaging plus repeated
    isolation of the same NTM species or otherwise strong microbiologic and
    histopathologic support, because environmental NTM can contaminate
    respiratory specimens without causing progressive lung disease.
  evidence:
  - reference: PMID:32797222
    reference_title: >-
      Treatment of Nontuberculous Mycobacterial Pulmonary Disease: An Official
      ATS/ERS/ESCMID/IDSA Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current guideline also recommends use of these criteria to classify
      patients as having NTM pulmonary disease (Table 2).
    explanation: >-
      Establishes that the contemporary ATS/ERS/ESCMID/IDSA guideline retains
      the composite clinical, radiographic and microbiologic NTM-PD criteria.
  - reference: PMID:32797222
    reference_title: >-
      Treatment of Nontuberculous Mycobacterial Pulmonary Disease: An Official
      ATS/ERS/ESCMID/IDSA Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      >1 positive sputum culture is recommended for diagnostic purposes, and the
      same NTM species (or subspecies in the case of M. abscessus) should be
      isolated in ≥2 sputum cultures.
    explanation: >-
      Supports requiring repeated same-species sputum isolation when diagnosing
      pulmonary disease from respiratory cultures.
treatments:
- name: M. xenopi multidrug therapy
  description: >-
    Guideline therapy uses at least three active drugs, centered on rifampicin,
    ethambutol, and a macrolide or fluoroquinolone, with amikacin added for
    cavitary or advanced severe bronchiectatic pulmonary disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: moxifloxacin
      term:
        id: CHEBI:63611
        label: moxifloxacin
    - preferred_term: amikacin
      term:
        id: CHEBI:2637
        label: amikacin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32797222
    reference_title: >-
      Treatment of Nontuberculous Mycobacterial Pulmonary Disease: An Official
      ATS/ERS/ESCMID/IDSA Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with M. xenopi pulmonary disease, we suggest a daily regimen
      that includes at least 3 drugs: rifampicin, ethambutol, and either a
      macrolide and/or a fluoroquinolone (eg, moxifloxacin)
    explanation: >-
      Provides the guideline basis for rifampicin, ethambutol, and macrolide or
      moxifloxacin multidrug therapy.
  - reference: PMID:32797222
    reference_title: >-
      Treatment of Nontuberculous Mycobacterial Pulmonary Disease: An Official
      ATS/ERS/ESCMID/IDSA Clinical Practice Guideline.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with cavitary or advanced/severe bronchiectatic M. xenopi
      pulmonary disease, we suggest adding parenteral amikacin to the treatment
      regimen and obtaining expert consultation
    explanation: >-
      Supports parenteral amikacin intensification for severe M. xenopi pulmonary
      disease.

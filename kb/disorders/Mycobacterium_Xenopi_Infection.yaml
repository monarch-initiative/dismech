name: Mycobacterium Xenopi Infection
synonyms:
- Mycobacterium xenopi caused disease or disorder
- Mycobacterium xenopi disease or disorder
- Mycobacterium xenopi infectious disease
creation_date: "2026-09-30T10:37:00Z"
description: >-
  Mycobacterium xenopi infection is a nontuberculous mycobacterial infection in
  which inhaled environmental M. xenopi survives in pulmonary macrophage
  compartments, drives granulomatous airway and parenchymal inflammation, and
  can produce chronic cavitary lung disease.
notes: >-
  This entry currently curates pulmonary M. xenopi disease, the form addressed
  by the cached ATS/ERS/ESCMID/IDSA treatment guideline. Disseminated and other
  extrapulmonary M. xenopi infections, including advanced-HIV presentations,
  remain out of scope until site-specific evidence is cached and modeled.
category: Infectious Disease
disease_term:
  preferred_term: Mycobacterium xenopi infection
  term:
    id: MONDO:0017832
    label: Mycobacterium xenopi infection
parents:
- Mycobacterial infectious disease
infectious_agent:
- name: Mycobacterium xenopi
  description: >-
    Mycobacterium xenopi is a slow-growing environmental nontuberculous
    mycobacterium associated chiefly with chronic pulmonary infection.
  infectious_agent_term:
    preferred_term: Mycobacterium xenopi
    term:
      id: NCBITaxon:1789
      label: Mycobacterium xenopi
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Environmental Aerosol Inhalation
  description: >-
    Environmental mycobacteria are acquired from water-associated aerosols into
    susceptible airways rather than by sustained person-to-person spread.
  evidence:
  - reference: PMID:8132983
    reference_title: >-
      A nosocomial pseudo-outbreak of Mycobacterium xenopi due to a contaminated
      potable water supply: lessons in prevention.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M xenopi was isolated from tap water in 20 of 24 patient rooms tested, the
      endoscopy suite, and the central hot water mixing tank, but not from water
      in the microbiology laboratory.
    explanation: >-
      Identifies potable and hot-water plumbing as an environmental M. xenopi
      source that can contaminate respiratory and other clinical specimens.
environmental:
- name: Structural lung disease and prior tuberculosis damage
  description: >-
    COPD, bronchiectasis, prior tuberculosis sequelae, and other structural lung
    lesions predispose airways to pulmonary NTM disease by weakening local
    clearance and giving inhaled M. xenopi an opportunity to persist.
  influences_mechanisms:
  - target: Pulmonary Macrophage Persistence
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Damaged airways impair local clearance and make the downstream
      macrophage-rich pulmonary niche permissive for persistent M. xenopi
      infection.
  evidence:
  - reference: PMID:34702233
    reference_title: >-
      Management of patients with pulmonary mycobacteriosis in France: a
      multicenter retrospective cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory comorbidities were found in 68% of cases, tuberculosis
      sequelae in 31.4% of patients, and immunosuppression in 16.8% of cases.
    explanation: >-
      Reports structural respiratory comorbidity and prior tuberculosis sequelae
      as common host contexts in a multicenter pulmonary-NTM cohort in which M.
      xenopi caused 20% of cases.
- name: Immunosuppression
  description: >-
    Acquired or iatrogenic immune impairment predisposes to NTM pulmonary
    disease by weakening the cell-mediated macrophage activation needed to
    restrict environmental mycobacteria.
  influences_mechanisms:
  - target: Pulmonary Macrophage Persistence
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired cell-mediated immunity makes infected macrophage compartments
      more permissive for persistent nontuberculous mycobacteria.
  evidence:
  - reference: PMID:34702233
    reference_title: >-
      Management of patients with pulmonary mycobacteriosis in France: a
      multicenter retrospective cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory comorbidities were found in 68% of cases, tuberculosis
      sequelae in 31.4% of patients, and immunosuppression in 16.8% of cases.
    explanation: >-
      Quantifies immunosuppression in a multicenter pulmonary-NTM cohort that
      included M. xenopi as the second most common species.
pathophysiology:
- name: Inhaled Mycobacterium xenopi Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    M. xenopi reaches structurally susceptible lower airways after inhalation
    from an environmental water reservoir.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pulmonary Macrophage Persistence
    causal_link_type: DIRECT
    description: >-
      Organisms that evade local killing persist in macrophage-rich airway and
      parenchymal niches.
  evidence:
  - reference: PMID:30302953
    reference_title: >-
      Infection Source and Epidemiology of Nontuberculous Mycobacterial Lung
      Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common routes for pulmonary NTM infection involve the inhalation
      of aerosols generated by hot tubs and showerheads.
    explanation: >-
      Supports aerosol inhalation from warm engineered-water sources as a common
      route by which nontuberculous mycobacteria seed the lung.
- name: Pulmonary Macrophage Persistence
  biological_scale: CELLULAR
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >-
    Intracellular mycobacteria persist inside infected phagocytes and maintain
    chronic local immune activation.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Granulomatous Pulmonary Inflammation
    causal_link_type: DIRECT
    description: >-
      Infected macrophages and recruited lymphocytes organize into chronic
      granulomatous lesions.
  - target: Requirement for Cell-Penetrant Antimicrobial Therapy
    causal_link_type: DIRECT
    description: >-
      The intracellular macrophage niche gates therapy toward agents that enter
      host cells.
  evidence:
  - reference: PMID:33563837
    reference_title: >-
      Nrf2 Regulates Granuloma Formation and Macrophage Activation during
      Mycobacterium avium Infection via Mediating Nramp1 and HO-1 Expressions.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      The Nrf2 system is activated in alveolar macrophages, the most important
      cells during MAC infection, as both the main reservoir of infection and
      bacillus-killing cells.
    explanation: >-
      Establishes the alveolar macrophage as the NTM infection reservoir and
      effector cell in a closely related pulmonary-NTM model; quote_role records
      that this is background framing in a mouse MAC study.
  - reference: PMID:18611821
    reference_title: Intracellular organisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such
      as the beta-lactam compounds.
    explanation: >-
      Supports the intracellular-niche conformance pattern for mycobacterial
      infection and its poorly cell-penetrant beta-lactam exclusion.
- name: Granulomatous Pulmonary Inflammation
  biological_scale: TISSUE
  conforms_to: "granuloma_formation#Persistent Indigestible Stimulus"
  description: >-
    Persistent granulomatous inflammation remodels airway-adjacent lung tissue
    and can progress to cavitary nontuberculous mycobacterial disease.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: macrophage activation
    modifier: INCREASED
    term:
      id: GO:0042116
      label: macrophage activation
  downstream:
  - target: Productive cough
    causal_link_type: DIRECT
    description: >-
      Bronchiectatic airway injury increases sputum production.
  - target: Bronchiectasis
    causal_link_type: DIRECT
    description: >-
      Chronic mycobacterial airway inflammation is coupled to
      nodular-bronchiectatic radiographic disease.
  - target: Fibrocavitary Pulmonary Remodeling
    causal_link_type: DIRECT
    description: >-
      Persistent granulomatous inflammation can progress into a destructive
      fibrocavitary tissue-remodeling pattern.
  evidence:
  - reference: PMID:33563837
    reference_title: >-
      Nrf2 Regulates Granuloma Formation and Macrophage Activation during
      Mycobacterium avium Infection via Mediating Nramp1 and HO-1 Expressions.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nrf2 is a critical regulator of host susceptibility to pulmonary MAC
      disease by promoting phagolysosome fusion and granuloma formation via
      activating Nramp1 and HO-1 genes, respectively.
    explanation: >-
      Supports macrophage granuloma formation as a host response in pulmonary
      NTM disease, using a closely related mouse MAC model.
- name: Fibrocavitary Pulmonary Remodeling
  biological_scale: TISSUE
  role: consequence
  description: >-
    Chronic granulomatous NTM inflammation can remodel lung tissue into the
    destructive fibrocavitary radiographic form observed in M. xenopi pulmonary
    disease.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Pulmonary cavity
    causal_link_type: DIRECT
    description: >-
      Destructive fibrocavitary remodeling creates the cavitary lung lesions
      seen in a substantial subset of M. xenopi pulmonary disease cases.
  evidence:
  - reference: PMID:34702233
    reference_title: >-
      Management of patients with pulmonary mycobacteriosis in France: a
      multicenter retrospective cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A slightly higher rate of nodulobronchiectatic pattern (42.6%) than
      cavitations (34%) was observed in patients with NTM-PD cause by M. xenopi.
    explanation: >-
      Documents cavitary M. xenopi pulmonary disease in a multicenter French
      cohort.
  - reference: PMID:42437710
    reference_title: Nontuberculous Mycobacterial Lung Diseases.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Radiological patterns include nodular bronchiectatic disease and
      fibrocavitary disease.
    explanation: >-
      Supports fibrocavitary disease as a canonical radiographic form of
      nontuberculous mycobacterial lung disease.
- name: Requirement for Cell-Penetrant Antimicrobial Therapy
  biological_scale: CELLULAR
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  role: therapeutic_vulnerability
  description: >-
    Persistence inside pulmonary macrophages makes cell-penetrating
    antimicrobials the relevant pharmacologic class for NTM disease rather than
    poorly cell-penetrant beta-lactams.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    reference_title: >-
      Intracellular Pharmacokinetics of Antibacterials and Their Clinical
      Implications.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Establishes that intracellular antibacterial efficacy depends on the
      concentration achieved inside host cells.

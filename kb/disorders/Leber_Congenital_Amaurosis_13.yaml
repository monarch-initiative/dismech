- name: Retinaldehyde and Aldehyde Toxicity in the Inner Segment
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Unreduced all-trans-retinal is a reactive aldehyde, and it accumulates in the
    compartment that holds the photoreceptor's mitochondria and endoplasmic
    reticulum. RDH12 also reduces C9 aldehydes - lipid peroxidation products - so
    the same loss removes a second arm of aldehyde defence, and at saturating
    peroxidic-aldehyde concentrations in cells under oxidative stress this may be
    a substantial part of its role.

    The light dependence follows directly. Rdh12-null mice show increased
    susceptibility to light-induced photoreceptor apoptosis, and the authors of
    that study concluded that the severe visual impairment of humans with null
    RDH12 mutations may likely be caused by light damage.

    That mouse inference needs a caveat stated here and not only in the
    discussion it attaches to: Rdh12-null mice do not develop retinal
    degeneration. Two knockout lines were made and both have normal retinal
    histology. So the model supports the *susceptibility* claim - accumulated
    all-trans-retinal, slower ERG recovery after bleaching, more light damage -
    and does not support the step from susceptibility to the degeneration humans
    have. The node is graded PROVISIONAL for that reason.
  biological_processes:
  - preferred_term: aldehyde metabolic process
    term:
      id: GO:0006081
      label: aldehyde metabolic process
    modifier: DYSREGULATED
  - preferred_term: cellular response to light stimulus

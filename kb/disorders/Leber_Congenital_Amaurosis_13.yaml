    causal_link_type: DIRECT
- name: Retinoic Acid Overproduction
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    A second, non-obvious consequence of the same enzymatic loss, and a candidate
    mechanism of cell death in its own right. In living cells RDH12 acts
    exclusively as a retinaldehyde *reductase*, despite being bidirectional in
    vitro - so it pulls retinoid homeostasis toward retinol and away from
    all-trans-retinal, which is the substrate for retinoic acid synthesis. Losing
    it lets bioactive retinoic acid rise.

    The evidence that this is not incidental: the reductase activity protects
    cells from retinaldehyde-induced death specifically at high retinaldehyde
    concentrations, and the protective effect correlates with lower retinoic acid
    levels in RDH12-expressing cells.

    Graded PROVISIONAL rather than ESTABLISHED because it rests on one cell-based
    study and no one has measured retinoic acid in an RDH12-deficient retina.
  biological_processes:
  - preferred_term: retinoid metabolic process
    term:
      id: GO:0001523
      label: retinoid metabolic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:17925390
    reference_title: "Overproduction of bioactive retinoic acid in cells expressing disease-associated mutants of retinol dehydrogenase 12."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in living cells, RDH12 acts exclusively as a retinaldehyde reductase,
      shifting the retinoid homeostasis toward the increased levels of retinol and
      decreased levels of bioactive retinoic acid
    explanation: >-
      Establishes the directionality in cells, against the bidirectionality seen
      with purified enzyme.
  - reference: PMID:17925390
    reference_title: "Overproduction of bioactive retinoic acid in cells expressing disease-associated mutants of retinol dehydrogenase 12."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The retinaldehyde reductase activity of RDH12 protects the cells from
      retinaldehyde-induced cell death, especially at high retinaldehyde
      concentrations, and this protective effect correlates with the lower levels
      of retinoic acid in RDH12-expressing cells.
    explanation: >-
      Links the enzyme activity, the retinoic acid level and cell survival in one
      experiment.
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Photoreceptor Degeneration
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Progressive loss of rod and cone photoreceptors. Functionally it is complete
    early: scotopic and photopic electroretinography was markedly reduced in every
    subject of the natural-history cohort, with a non-recordable ERG documented at
    one year of age.

    The word to hold onto is *progressive*. The gene-discovery series described a
    severe yet progressive rod-cone dystrophy, and the natural-history data show
    reduced but often useful vision retained into adolescence before severe loss
    of function and structure after age ten. That trajectory is what makes
    treatment timing the central clinical question here.

experimental_models:
- name: HEK-293 lines expressing wild-type and mutant RDH12
  experimental_model_type: CELL_LINE
  description: >-
    A heterologous expression system, and the source of the entry's ER and
    oxidative stress node and of the pregabalin result. Wild-type lines protect
    against all-trans-retinal toxicity; mutant lines do not, and instead show
    oxidative and ER stress with sXBP1, CHOP and ATF4 upregulated.

    Its limitation is structural rather than technical: HEK-293 cells are not
    photoreceptors, have no outer segment, no visual cycle and no light exposure,
    so the system can show that mutant RDH12 fails to protect a cell from
    all-trans-retinal, and cannot show that this is what kills a photoreceptor.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      The stress response to unhandled all-trans-retinal, with a wild-type
      control.
    limitations: >-
      A non-retinal cell line with no outer segment, visual cycle, or light
      exposure. Fidelity is graded LOW for that reason despite the result being
      clean and internally controlled.
    readouts:
    - name: sXBP1, CHOP and ATF4 expression
      target: Endoplasmic Reticulum and Oxidative Stress
      direction: INCREASED
      interpretation: >-
        Upregulation of three unfolded-protein-response effectors in mutant but
        not wild-type lines.
      evidence:
      - reference: PMID:34445569
        reference_title: "Involvement of Oxidative and Endoplasmic Reticulum Stress in RDH12-Related Retinopathies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          inducing oxidative and endoplasmic reticulum (ER) stress, with
          upregulation of sXBP1, CHOP, and ATF4
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:34445569
      reference_title: "Involvement of Oxidative and Endoplasmic Reticulum Stress in RDH12-Related Retinopathies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        HEK-293 cell lines expressing wildtype (WT) and mutant RDH12 were created.
        The WT cells afforded protection from atRAL-induced toxicity and oxidative
        stress.
      explanation: >-
        The system and its wild-type control.
discussions:
- discussion_id: lca13_rdh12_null_mouse_does_not_degenerate
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do Rdh12-null mice have normal retinal histology when humans with the
    same enzymatic loss are blind in childhood?
  attaches_to:
  - "pathophysiology#Retinaldehyde and Aldehyde Toxicity in the Inner Segment"
  - "pathophysiology#Photoreceptor Degeneration"
  - "animal_models#Rdh12-null mouse"
  - "treatments#AAV Gene Supplementation (Investigational)"
  - "treatments#Light Exposure Reduction"
  rationale: >-
    This is the central translational problem for RDH12 and it constrains almost
    everything preclinical in this entry, which is why it attaches to five places
    rather than sitting under one node.

    The evidence is positive on both sides and disagrees. Two independent Rdh12
    knockout mouse lines were generated; both have normal retinal histology and
    no apparent signs of retinal degeneration. They do reproduce the biochemistry
    - accumulated all-trans-retinal, slower ERG recovery after bleaching,
    increased susceptibility to light-induced photoreceptor apoptosis, and in the
    second line increased RPE A2E - so the enzymatic deficit translates and the
    tissue outcome does not. Humans with the same loss have universal macular
    atrophy from age two and a non-recordable ERG from age one.

    Three candidate explanations are worth separating rather than assuming.
    Species differences in retinal illumination and outer-segment retinoid flux,
    so the mouse never accumulates enough substrate. Redundancy from another
    mouse reductase, absent or weaker in humans. Or a lifespan mismatch, the
    mouse not living long enough to accumulate the damage - which the zebrafish
    result argues against being the whole story, since that model shows early
    degenerative change at twelve months.

    Two practical consequences, and they are why this is graded a mismatch rather
    than a curiosity. First, the aldehyde toxicity node is PROVISIONAL rather
    than ESTABLISHED because its step to degeneration rests on a model that does
    not degenerate. Second, the AAV gene-therapy programme states in its own
    abstract that efficacy was demonstrated in an animal model that does not
    exhibit a retinal degeneration phenotype - so what was shown is reconstituted
    reductase activity and reduced light-damage susceptibility, not rescue of
    vision, and there is currently no preclinical model in which rescuing the
    human phenotype could be demonstrated. The same applies to light avoidance,
    whose entire evidential basis is that mouse.
  evidence:
  - reference: PMID:34445569
    reference_title: "Involvement of Oxidative and Endoplasmic Reticulum Stress in RDH12-Related Retinopathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Two Rdh12 knockout mouse models were generated; however, both displayed a
      relatively mild phenotype, with normal retinal histology and no apparent
      signs of retinal degeneration.
    explanation: >-
      The negative in both mouse lines, which is the model side of the mismatch.
  - reference: PMID:31237438
    reference_title: "Development of a Gene Therapy Vector for RDH12-Associated Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      thus demonstrating potential therapeutic efficacy in an animal model that
      does not exhibit a retinal degeneration phenotype
    explanation: >-
      The gene-therapy programme naming the same limitation inside its own
      efficacy claim, which is what makes this a constraint on translation rather
      than a background fact.
  - reference: PMID:30979730
    reference_title: "Detailed clinical characterisation, unique features and natural history of autosomal recessive RDH12-associated retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macular atrophy was a universal clinical finding in all subjects, as young
      as 2 years of age.
    explanation: >-
      The human side of the mismatch: universal early structural loss, against a
      mouse with normal histology.
  proposed_experiments:
  - experiment_id: lca13_mouse_retinoid_load_vs_human
    name: Comparative all-trans-retinal load in Rdh12-null mouse and human retina
    description: >-
      Quantify all-trans-retinal and its adducts in Rdh12-null mouse retina under
      cyclic and constant light against post-mortem RDH12 patient retina, to test
      whether the mouse is protected by a lower substrate load rather than by a
      different downstream response.
    would_support:
    - "pathophysiology#Retinaldehyde and Aldehyde Toxicity in the Inner Segment"
    supporting_outcome:
    - >-
      All-trans-retinal load is substantially lower in the null mouse retina than
      in human RDH12 retina, placing the species difference upstream in substrate
      flux rather than in the death pathway.
    refuting_outcome:
    - >-
      Comparable retinoid loads in both, which would locate the difference in a
      downstream protective mechanism the mouse has and humans lack, and make the
      mouse unsuitable for efficacy testing on any endpoint downstream of
      substrate clearance.
- discussion_id: lca13_gene_therapy_window_closes_early
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a therapeutic window for RDH12 gene supplementation, given that
    macular atrophy is universal from age two?
  attaches_to:
  - "pathophysiology#Early Macular Atrophy"
  - "treatments#AAV Gene Supplementation (Investigational)"
  rationale: >-
    The obstacle is timing, and the numbers make it concrete. Macular atrophy was
    universal in all 57 subjects of the natural-history cohort and documented at
    age two. Non-recordable ERG has been documented at one year. Yet reduced but
    useful vision is frequently retained until adolescence, and severe loss of
    function and structure follows only after age ten.

    So there is a decade in which a treated patient has something left to
    preserve, and a treatment aimed at it would have to be given to a very young
    child whose macula is already atrophic. Whether the surviving extramacular
    photoreceptors are worth preserving, and by what measure, is not known - which
    is precisely why both natural-history papers say formal studies are needed to
    identify appropriate outcome measures. The ERG cannot be one; it is already at
    floor.

    This is curated as a knowledge gap rather than a pessimistic conclusion. The
    dissociation between early structural loss and late functional loss is itself
    the interesting finding, and it is not explained.
  proposed_experiments:
  - experiment_id: lca13_prospective_outcome_measure_study
    name: Prospective structure-function study to identify a trial endpoint
    description: >-
      Longitudinal optical coherence tomography, microperimetry and widefield
      autofluorescence in RDH12 patients aged two to eighteen, to find a measure
      that changes over a trial-length interval in the decade when vision is still
      useful.
    would_support:
    - "pathophysiology#Early Macular Atrophy"
    supporting_outcome:
    - >-
      A structural or functional measure outside the macula changes measurably
      over one to two years in the age range where vision is retained, giving a
      usable endpoint.
    refuting_outcome:
    - >-
      No measure changes detectably over a trial-length interval, indicating that
      efficacy could only be judged over a decade and that supplementation trials
      in this genotype are not currently feasible.
- discussion_id: lca13_which_toxic_species_drives_death
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do photoreceptors die from all-trans-retinal and lipid-aldehyde toxicity, or
    from retinoic acid overproduction?
  attaches_to:
  - "pathophysiology#Retinaldehyde and Aldehyde Toxicity in the Inner Segment"
  - "pathophysiology#Retinoic Acid Overproduction"
  rationale: >-
    Two candidate death mechanisms follow from the same enzymatic loss, and the
    cited work supports each without discriminating between them. A third
    element, added in review, is not a competing candidate but a shared
    downstream one - the ER and oxidative stress response that mutant RDH12 cell
    lines mount, with sXBP1, CHOP and ATF4 upregulated. Both toxic-species
    accounts would converge on it, which is why it is curated as its own node and
    why this question should not be read as a two-way choice about what kills the
    cell. It is a question about which upstream species drives that shared
    response, and the practical stake is in what a drug would have to target.

    The aldehyde-toxicity account: unreduced all-trans-retinal is reactive, RDH12
    also clears C9 lipid peroxidation products, and Rdh12-null mice show increased
    light-induced photoreceptor apoptosis.

    The retinoic-acid account: RDH12 acts as a reductase in living cells and so
    holds retinoic acid down; disease mutants cannot, and the protection from
    retinaldehyde-induced death correlates with the lower retinoic acid levels
    rather than being attributed to aldehyde clearance directly.

    The second account has one cell-based study behind it and no measurement in an
    RDH12-deficient retina, which is why that node is graded PROVISIONAL and the
    aldehyde node ESTABLISHED. Distinguishing them is not academic: an
    aldehyde-scavenging small molecule and a retinoic-acid-signalling antagonist
    are different drugs, and neither would be worth developing without knowing
    which arm matters.
  proposed_experiments:
  - experiment_id: lca13_retinoid_species_measurement_in_retina
    name: Retinoid speciation in Rdh12-null retina under light stress
    description: >-
      Quantify all-trans-retinal, retinal-derived adducts and all-trans-retinoic
      acid in Rdh12-null and wild-type mouse retina before and after light
      exposure, alongside photoreceptor apoptosis, to see which species tracks
      cell death.
    would_support:
    - "pathophysiology#Retinoic Acid Overproduction"
    supporting_outcome:
    - >-
      Retinoic acid rises in the null retina and its magnitude tracks apoptosis
      more closely than the retinal or aldehyde-adduct load does.
    refuting_outcome:
    - >-
      Retinoic acid is unchanged in the null retina while retinal and aldehyde
      adducts accumulate with apoptosis, restricting the retinoic-acid mechanism
      to the cell-culture setting in which it was found.
notes: >-
  Curated from a Perplexity deep-research report plus independent PubMed
  searching. The report was used for framing only, and its term validation is the
  reason. It reported 25 of 44 checked labels mismatched - the worst of the five
  reports produced in this curation batch - and the mismatches were of the most
  dangerous kind, real HPO terms paired with the wrong names. It offered
  HP:0000639 as "visual impairment" when HPO calls it Nystagmus, and HP:0000556 as
  "nystagmus" when HPO calls it Retinal dystrophy - the two labels are swapped
  between two real terms, so neither the CURIE nor the name looks wrong on its
  own. No CURIE was taken from the report; every binding here was resolved against
  the committed term caches and OLS.

  The GeneReviews overview of nonsyndromic LCA/EOSRD (PMID:30285347) is cited as
  the expert baseline. It is an overview chapter covering the whole disease class
  rather than an RDH12-specific one, so it is not used as an evidence source for
  this genotype's phenotypes; those come from the two natural-history studies.

  Two decisions made in review are recorded here because they are absences a
  reader would otherwise read as omissions.

  No clinical_trials section. A prospective natural-history study is described as
  ongoing in the 2022 review, and no interventional trial for RDH12 retinopathy
  is identified in any source cited here. A ClinicalTrials.gov identifier was not
  invented to fill the section.

  PMID:29398085 is in references_cache but is deliberately uncited: it is a
  CEP290 natural-history study, cached because the deep-research report's
  citation list resolved it, and it has no RDH12 content. Recorded so a later
  reader does not add it as a plausible-looking LCA citation.

  A nomenclature trap is recorded in the genetic notes: the 2005 biochemical
  paper refers to RDH12 as linked to "Leber's congenital amaurosis 3", not 13.
  LCA3 is now assigned to SPATA7.

- name: Photoreceptor Degeneration
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Progressive loss of rod and cone photoreceptors. Functionally it is complete
    early: scotopic and photopic electroretinography was markedly reduced in every
    subject of the natural-history cohort, with a non-recordable ERG documented at
    one year of age.

    The word to hold onto is *progressive*. The gene-discovery series described a
    severe yet progressive rod-cone dystrophy, and the natural-history data show
    reduced but often useful vision retained into adolescence before severe loss
    of function and structure after age ten. That trajectory is what makes
    treatment timing the central clinical question here.

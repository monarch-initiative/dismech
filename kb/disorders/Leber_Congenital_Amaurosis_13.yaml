    reference_title: "Detailed clinical characterisation, unique features and natural history of autosomal recessive RDH12-associated retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macular atrophy was a universal clinical finding in all subjects, as young
      as 2 years of age.
    explanation: >-
      Universality and earliest documented age, in the largest cohort.
  - reference: PMID:30979730
    reference_title: "Detailed clinical characterisation, unique features and natural history of autosomal recessive RDH12-associated retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Widefield imaging in 23 subjects revealed a unique, variegated
      watercolour-like pattern of atrophy in 13 subjects and sparing of the
      peripapillary area in 18 subjects.
    explanation: >-
      The imaging signature, with its denominators - which matter, because it is
      characteristic rather than universal.
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinct phenotypic features include macular atrophy followed by bone
      spicule pigment early in life, in contrast to other forms of LCA which often
      have a relatively normal fundus appearance in childhood despite severe
      visual dysfunction.
    explanation: >-
      The contrast with other LCA genotypes, which is the point of curating this
      as a separate node.

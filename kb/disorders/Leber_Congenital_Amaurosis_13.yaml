genetic:
- name: RDH12
  gene_term:
    preferred_term: RDH12
    term:
      id: hgnc:19977
      label: RDH12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A short-chain dehydrogenase/reductase on chromosome 14, highly expressed in
    photoreceptor inner segments.

    Two things about variant interpretation in this gene are worth stating
    explicitly. First, residual in vitro activity does not exclude pathogenicity:
    T49M and I51N retain significant activity on purified protein and still fail
    in cells, because of reduced NADPH affinity and much lower expression. Second,
    the gene's phenotypic range is wide - EOSRD/LCA is the commonest presentation,
    but retinitis pigmentosa, cone-rod dystrophy and macular dystrophy are all
    attributed to it, and autosomal dominant RP as well. A biallelic RDH12
    genotype therefore does not by itself predict the LCA phenotype.

    Third, and usefully for a diagnostic laboratory: functional assay does
    separate the pathogenic changes from the polymorphisms here. In a survey of
    119 patients across LCA, retinitis pigmentosa and cone-rod dystrophy, the
    RDH12 mutants associated with LCA were inactive or had only residual activity
    when expressed in COS-7 and Sf9 cells, while the changes that proved
    polymorphic were fully active. That is the mirror image of the first point
    rather than a contradiction of it: residual in vitro activity does not
    exclude pathogenicity, but full in vitro activity has so far tracked with
    benignity.

    Severity is associated with genotype in some cases, per the natural-history
    review, but no allele-level rule has been established.

    A nomenclature trap for anyone reading the older literature: the 2005
    biochemical characterisation refers to RDH12 as linked to "Leber's congenital
    amaurosis 3", not 13. LCA3 is now assigned to SPATA7. A search on the old
    designation will return the wrong gene.
  evidence:
  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RDH12-associated retinopathy has wide phenotypic variability; including
      early-onset severe retinal dystrophy/Leber Congenital Amaurosis (EOSRD/LCA;
      most frequent presentation), retinitis pigmentosa, cone-rod dystrophy, and
      macular dystrophy.
    explanation: >-
      The phenotypic range attributed to the gene, with LCA identified as the
      commonest presentation. Graded OTHER because it is a review's synthesis.
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severity is associated with genotype in some cases.
    explanation: >-
      A genotype-severity association without a rule. Graded PARTIAL because the
      qualifier "in some cases" is doing most of the work in that sentence.
  - reference: PMID:38371258
    reference_title: "RDH12-associated retinal degeneration caused by a homozygous pathogenic variant of 146C>T and literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical characteristics of a total of 13 patients reported with the
      same pathologic variant varied.
    explanation: >-
      Thirteen patients sharing one variant with varying clinical
      characteristics. Graded REFUTE because it is evidence against a simple
      allele-to-severity rule, and it is the reason this entry states that
      severity is associated with genotype in some cases without asserting one.
  - reference: PMID:17512964
    reference_title: "Novel RDH12 mutations associated with Leber congenital amaurosis and cone-rod dystrophy: biochemical and clinical evaluations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that Rdh12 mutant proteins associated with LCA were inactive or
      displayed only residual activity when expressed in COS-7 and Sf9 cells,
      whereas those mutants that were considered polymorphisms were fully active.
    explanation: >-
      The functional separation of pathogenic from polymorphic RDH12 changes.
      Directly useful for variant interpretation, and the basis for this entry
      saying that full in vitro activity has tracked with benignity while
      residual activity does not exclude pathogenicity.
diagnosis:
- name: Widefield Fundus Imaging
  description: >-
    The imaging pattern is characteristic enough to raise the genotype before
    sequencing: petal-shaped, coloboma-like macular atrophy with a variegated
    watercolour-like appearance and peripapillary sparing. It is characteristic
    rather than pathognomonic - the watercolour pattern was present in 13 of 23
    imaged subjects, and the peripapillary sparing in 18 of 23.
  evidence:
  - reference: PMID:30979730
    reference_title: "Detailed clinical characterisation, unique features and natural history of autosomal recessive RDH12-associated retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Widefield imaging in 23 subjects revealed a unique, variegated
      watercolour-like pattern of atrophy in 13 subjects and sparing of the
      peripapillary area in 18 subjects.
    explanation: >-
      The imaging findings with their denominators, which is what makes this
      suggestive rather than diagnostic on its own.
- name: Molecular Genetic Testing
  description: >-
    Sequencing establishes the diagnosis, and it is the only thing that does -
    the ERG is non-recordable across LCA genotypes and the fundus pattern is
    suggestive rather than specific. It matters more here than genotype usually
    does in LCA, because RDH12 is one of the genotypes for which RPE65-style gene
    supplementation is not expected to behave the same way.
  evidence:
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RDH12 is involved in photoreceptor retinoid metabolism and is a potential
      target for gene therapy, which has been successful in treating
      RPE65-associated LCA.
    explanation: >-
      Why identifying the gene matters therapeutically. Graded OTHER because it is
      the review's framing rather than a result.
treatments:
- name: No Approved Disease-Modifying Therapy
  description: >-
    There is currently no treatment for RDH12-associated retinal degeneration.
    Curated as an explicit entry rather than an empty section, because the absence
    is the clinically relevant fact and because it sits against a background where
    one LCA genotype - RPE65 - does have an approved therapy, which patients and
    families reasonably ask about.
  evidence:
  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is currently no treatment available for RDH12-retinopathy.
    explanation: >-
      The state of treatment as of the 2022 review. Graded OTHER because it is a
      review's statement of the field rather than a study result.
- name: AAV Gene Supplementation (Investigational)
  description: >-
    A gene therapy vector for RDH12-associated retinal dystrophy has been
    developed, and preclinical work plus a prospective natural-history study are
    described as preparing the foundation for trials. Nothing has been shown to
    work in patients.

    The specific obstacle for this genotype is timing rather than vector design.
    Macular atrophy is universal and documented from age two; supplementation can
    only preserve photoreceptors that still exist. That is the reason the
    natural-history studies exist at all - to identify outcome measures, since the
    ERG is already non-recordable and visual acuity does not fall until later.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic RDH12 Loss of Function
    description: >-
      Supplies a functional RDH12 copy to photoreceptors. It addresses the
      enzymatic deficit but cannot reverse atrophy that has already occurred.
  evidence:
  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, extensive preclinical investigations and an ongoing prospective
      natural history study are preparing the necessary foundation to design and
      establish forthcoming clinical trials.
    explanation: >-
      The development stage as of 2022 - preclinical, with trials not yet
      designed. Graded OTHER because it reports the state of a field.
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      RDH12-associated retinal degeneration is particularly devastating due to
      early macular atrophy, which will likely impact therapeutic outcomes.
    explanation: >-
      The anticipated limitation on efficacy. Graded PARTIAL because it qualifies
      the therapeutic prospect rather than supporting it.
  - reference: PMID:31237438
    reference_title: "Development of a Gene Therapy Vector for RDH12-Associated Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Wild-type and Rdh12-/- mice that received a subretinal injection of rAAV2/5
      carrying a human RDH12 cDNA driven by a human rhodopsin-kinase promoter
      exhibited transgene expression that was stable, correctly localized, and
      did not cause retinal toxicity.
    explanation: >-
      The vector, its promoter and the safety result, in the preclinical study
      this treatment refers to.
  - reference: PMID:31237438
    reference_title: "Development of a Gene Therapy Vector for RDH12-Associated Retinal Dystrophy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      thus demonstrating potential therapeutic efficacy in an animal model that
      does not exhibit a retinal degeneration phenotype
    explanation: >-
      The efficacy claim with the authors' own limiting clause attached. Graded
      PARTIAL because the endpoint reconstituted was reductase activity together
      with reduced susceptibility to light damage, not rescue of a degeneration
      the model does not have.
- name: Pregabalin (Investigational Retinal Scavenger)
  description: >-
    The one therapeutic candidate in this literature that targets the toxic
    species rather than the missing gene. Pregabalin is a retinaldehyde
    scavenger, and in the mutant RDH12 cell lines it attenuated
    all-trans-retinal-induced ER stress.

    Two limits on how far to read that. The experiment is in HEK-293 cells
    expressing mutant RDH12, not in photoreceptors; and the endpoint is a stress
    marker, not photoreceptor survival. It is included because a scavenger
    strategy is genotype-agnostic in a way gene supplementation is not - it does
    not depend on delivering a transgene to photoreceptors that may already be
    lost - which is exactly the constraint the macular-atrophy timing imposes on
    the gene-therapy route.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pregabalin
      term:
        id: CHEBI:64356
        label: pregabalin
  target_mechanisms:
  - target: Endoplasmic Reticulum and Oxidative Stress
    description: >-
      Scavenging all-trans-retinal removes the stimulus for the stress response,
      rather than restoring the enzyme that would have cleared it.
  evidence:
  - reference: PMID:34445569
    reference_title: "Involvement of Oxidative and Endoplasmic Reticulum Stress in RDH12-Related Retinopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pregabalin, a retinal scavenger, attenuated atRAL-induced ER stress in the
      mutant RDH12 cell lines.
    explanation: >-
      The rescue result, with its system and endpoint both stated in the sentence
      itself.
- name: Light Exposure Reduction
  description: >-
    A mechanistically motivated intervention with no clinical evidence behind it.
    The Rdh12-null mouse is highly susceptible to light-induced photoreceptor
    apoptosis, and the authors of that study concluded that the severe visual
    impairment of humans with null RDH12 mutations may likely be caused by light
    damage - because the retinal that overwhelms the inner segment is generated by
    illumination.

    No human study has tested whether reducing light exposure alters the course.
    It is recorded here because the mechanistic case is unusually direct and
    because tinted lenses are low-risk; it should not be presented to a family as
    established.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral intervention
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Retinaldehyde and Aldehyde Toxicity in the Inner Segment
    description: >-
      Reducing illumination reduces the all-trans-retinal load that leaks into the
      inner segment, which is the substrate the missing enzyme would clear.
  evidence:
  - reference: PMID:17032653
    reference_title: "Retinol dehydrogenase (RDH12) protects photoreceptors from light-induced degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, severe visual impairments of individuals with null mutations in RDH12
      may likely be caused by light damage(1).
    explanation: >-
      The authors' inference from the mouse to the human, quoted with its hedge.
      This is the entire evidential basis for the intervention, and it is murine.
animal_models:
- name: Rdh12-null mouse
  species: Mouse
  genotype: Rdh12-/- (targeted deletion)
  publication: PMID:17032653
  description: >-
    The model most of this disease's mechanistic literature runs through, and the
    one whose limitation is easiest to lose. Two independent knockout lines were
    made. Both have normal retinal histology and no retinal degeneration, which
    is the defining human phenotype.

    What the model does show is the biochemistry: slower kinetics of
    all-trans-retinal reduction with delayed dark adaptation, accelerated
    11-cis-retinal production, accumulated all-trans-retinal, slower ERG recovery
    after bleaching, and markedly increased susceptibility to light-induced
    photoreceptor apoptosis. So it is a good model of the enzymatic deficit and
    not a model of the disease.
  modeled_mechanisms:
  - target: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The enzymatic deficit itself is faithfully reproduced - slowed
      all-trans-retinal reduction and altered retinoid flow in the inner segment.
    limitations: >-
      Faithful for the biochemistry only. Nothing about this link should be read
      as support for the downstream degeneration, which the model does not have.
    readouts:
    - name: Kinetics of all-trans-retinal reduction
      target: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
      direction: DECREASED
      interpretation: >-
        Slowed reduction with delayed dark adaptation, the direct functional
        consequence of losing the enzyme.
      evidence:
      - reference: PMID:17032653
        reference_title: "Retinol dehydrogenase (RDH12) protects photoreceptors from light-induced degeneration in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          deletion of this gene in mice slows the kinetics of all-trans-retinal
          reduction, delaying dark adaptation
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:17032653
      reference_title: "Retinol dehydrogenase (RDH12) protects photoreceptors from light-induced degeneration in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        RDH12 localizes to the photoreceptor inner segments and that deletion of
        this gene in mice slows the kinetics of all-trans-retinal reduction
      explanation: >-
        Localisation and functional consequence in the same sentence, which is
        what makes the model informative for this node.
  - target: Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model does not develop retinal degeneration. Two knockout lines were
      generated and both showed normal retinal histology with no apparent signs
      of degeneration - against a human disease defined by universal macular
      atrophy from age two and a non-recordable ERG from age one.
    limitations: >-
      This is the central translational problem for RDH12 and it constrains
      everything preclinical. The gene-therapy vector study says so in its own
      abstract: efficacy was demonstrated in an animal model that does not
      exhibit a retinal degeneration phenotype, with reconstituted reductase
      activity and reduced light-damage susceptibility as the endpoints rather
      than rescue of degeneration. Any efficacy claim derived from this model is
      a claim about biochemistry, not about vision.
    readouts:
    - name: Retinal histology
      target: Photoreceptor Degeneration
      direction: UNCHANGED
      interpretation: >-
        Normal retinal histology in both knockout lines - a real negative result,
        recorded as UNCHANGED rather than omitted.
      evidence:
      - reference: PMID:34445569
        reference_title: "Involvement of Oxidative and Endoplasmic Reticulum Stress in RDH12-Related Retinopathies."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Two Rdh12 knockout mouse models were generated; however, both displayed
          a relatively mild phenotype, with normal retinal histology and no
          apparent signs of retinal degeneration.
        explanation: >-
          The negative histology in both lines. Graded REFUTE because it is
          evidence against the model reproducing the human degeneration.
    evidence:
    - reference: PMID:34445569
      reference_title: "Involvement of Oxidative and Endoplasmic Reticulum Stress in RDH12-Related Retinopathies."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockout Rdh12 mouse models do not recapitulate the severe phenotype
        observed in patients; therefore, the study of disease mechanisms remains
        a challenge.
      explanation: >-
        The reviewers' own summary of the translational gap, and the reason this
        link is FAILS_TO_RECAPITULATE. Graded REFUTE for the same reason as the
        readout above.
  evidence:
  - reference: PMID:31237438
    reference_title: "Development of a Gene Therapy Vector for RDH12-Associated Retinal Dystrophy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although Rdh12-deficient (Rdh12-/-) mice do not exhibit retinal

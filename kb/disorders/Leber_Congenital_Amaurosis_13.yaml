    explanation: >-
      Mean age of onset in the 57-subject cohort.
- category: Ophthalmologic
  name: Spicular Retinal Pigmentation
  description: >-
    Dense bone-spicule pigmentation, appearing early in life and following the
    macular atrophy rather than preceding it. Its early appearance is part of what
    distinguishes this genotype from other LCA forms, where the childhood fundus
    is often relatively unremarkable.
  phenotype_term:
    preferred_term: Spicular pigmentation of the retina
    term:
      id: HP:0007737
      label: Spicular pigmentation of the retina

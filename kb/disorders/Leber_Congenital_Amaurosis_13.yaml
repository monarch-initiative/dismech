  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      petal-shaped, coloboma-like macular atrophy with variegated watercolour-like
      pattern, peripapillary sparing, and often dense bone spicule pigmentation
    explanation: >-
      The full fundus signature. Graded OTHER because it is a review's synthesis

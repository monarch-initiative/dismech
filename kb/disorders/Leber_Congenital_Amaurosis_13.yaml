  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: null
  notes: >-
    RDH12 accounts for a few per cent of LCA/EOSRD, and the reported share has
    drifted upward as ascertainment improved: 4.1 per cent of 110 unrelated LCA
    patients in the 2004 gene-discovery series, 2-7 per cent in a 2019 review,
    3.4-10.5 per cent in the natural-history study, 3.5-10.5 per cent in a 2022
    review noting a higher share in East Asian populations.

    All four are fractions of an ascertained LCA cohort, not population rates,
    and they should not be multiplied by an LCA prevalence to obtain one -
    the denominators are referral cohorts with different inclusion criteria, which
    is most of why the ranges disagree.

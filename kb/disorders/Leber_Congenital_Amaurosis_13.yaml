      description.
  - reference: PMID:17925390
    reference_title: "Overproduction of bioactive retinoic acid in cells expressing disease-associated mutants of retinol dehydrogenase 12."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disease-associated mutants of RDH12, T49M and I51N, exhibit significant
      residual activity in vitro, but are unable to control retinoic acid levels
      in the cells because of their dramatically reduced affinity for NADPH and
      much lower protein expression levels.
    explanation: >-
      The dissociation between in vitro activity and cellular function, which is
      why residual catalytic activity does not exclude pathogenicity here.
  downstream:
  - target: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
    causal_link_type: DIRECT
- name: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that defines the disease, and the one that separates it from every
    visual-cycle LCA. Photoactivated rhodopsin releases all-trans-retinal in the
    outer segment, where RDH8 reduces it; that is the visual cycle. Under
    continuous illumination some of that retinal leaks into the inner segment,
    and clearing it there is RDH12's job.

    Single-cell imaging in knockout mice separated the two enzymes cleanly.
    Rdh8-deficient outer segments failed to reduce all-trans-retinal;
    Rdh12-deficient outer segments were unaffected. The leak of retinoids from
    outer to inner segment occurs in wild-type cells too, but in cells lacking
    either enzyme it is mainly all-trans-retinal rather than retinol. And
    wild-type rods could reduce moderate retinal loads inside the cell, an ability
    lost by cells deficient in either enzyme.

    Biochemically RDH12 is well suited to it: purified human RDH12 has its highest
    catalytic efficiency for all-trans-retinal, and it also recognises C9
    aldehydes - lipid peroxidation products - as substrates.
  molecular_functions:

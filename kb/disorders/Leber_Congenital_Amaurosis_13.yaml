pathophysiology:
- name: Biallelic RDH12 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. RDH12 is a small gene on chromosome 14 encoding a
    member of the short-chain dehydrogenase/reductase superfamily, highly
    expressed in photoreceptor inner segments.

    Loss of function here is not always loss of catalysis, and that is worth
    stating because it changes how a missense variant should be read. Two
    disease-associated mutants, T49M and I51N, retain significant residual
    activity in vitro and still fail in cells - because their affinity for NADPH
    is dramatically reduced and their protein expression levels are much lower.
    An in vitro activity assay on purified protein can therefore look reassuring
    for an allele that is functionally null in a photoreceptor.
  genes:
  - preferred_term: RDH12
    term:
      id: hgnc:19977
      label: RDH12
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Curated as loss of function on the combined evidence of allele spectrum and
      cellular phenotype. Zygosity is left unset at disease level because reported
      patients are variously homozygous and compound heterozygous; the
      natural-history cohort's criterion was simply two likely disease-causing
      variants.
  evidence:

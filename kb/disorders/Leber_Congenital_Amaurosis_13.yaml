disease_term:
  preferred_term: RDH12-associated retinal degeneration
  term:
    id: MONDO:0012990
    label: Leber congenital amaurosis 13
description: >-
  LCA13 is the early-onset severe retinal dystrophy caused by biallelic loss of
  RDH12, and it is the LCA subtype whose mechanism sits *outside* the visual
  cycle rather than inside it. RDH8 does the visual-cycle job in the photoreceptor
  outer segment, reducing the all-trans-retinal released by photoactivated
  rhodopsin. RDH12 sits in the inner segment and does something different: it
  clears the all-trans-retinal that leaks inward under continuous illumination,
  and it reduces lipid peroxidation products. It is a detoxifying enzyme, not a
  recycling one.

  That distinction is not academic - it is the single most consequential fact
  about this disease, and it is what makes RDH12 a poor analogue for RPE65.
  RPE65-associated LCA is a functional visual-cycle defect with relatively
  preserved macular structure, which is why supplementing the missing enzyme
  works. RDH12 disease destroys the macula early: macular atrophy was a universal
  finding in all 57 subjects of the largest natural-history cohort, documented in
  children as young as two. Gene supplementation cannot restore atrophied
  photoreceptors, so any treatment aimed at preserving central vision has to
  reach this retina very early. How early is not established - useful vision is
  frequently retained until adolescence, so a window may remain outside the
  macula - and this entry does not assert that it has closed by any particular
  age.

  A second constraint is easy to miss, and is recorded here as a
  HUMAN_MODEL_MISMATCH: Rdh12-null mice do not develop retinal degeneration. The
  preclinical gene-therapy work says so in its own abstract. What has been
  demonstrated is reconstituted enzyme activity and reduced light damage, not
  rescue of vision, and there is at present no model in which rescue of the human
  phenotype could be shown.

  The clinical picture is distinctive enough to be recognisable on imaging: a
  petal-shaped, coloboma-like macular atrophy with a variegated watercolour-like
  pattern, sparing of the peripapillary area, and dense bone-spicule pigmentation
  appearing early in life - in contrast to other LCA forms, where the fundus often
  looks relatively normal in childhood despite severe visual dysfunction. Vision
  is reduced yet often useful into adolescence before it fails.

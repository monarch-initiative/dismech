  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinct phenotypic features include macular atrophy followed by bone

      states the actual finding.
- category: Ophthalmologic
  name: Absence of Marked Hyperopia
  description: >-
    Recorded as a differentiating negative. RDH12 patients have no or only mild
    hyperopia, where marked hyperopia is characteristic of some other LCA
    genotypes. It is one of the few refractive clues available at a stage when
    the fundus may not yet be diagnostic.
  phenotype_term:

- category: Ophthalmologic
  name: Peripapillary Sparing
  description: >-
    Preservation of retina immediately around the optic disc while the macula
    atrophies - present in 18 of 23 subjects imaged with widefield photography. It
    is a recognition feature rather than a functionally useful one, since the
    spared area is not where central vision lives.
  phenotype_term:

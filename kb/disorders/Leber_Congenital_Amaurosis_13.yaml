- name: Zebrafish rdh12 CRISPR mutant
  species: Zebrafish
  genotype: rdh12u533 c.17_23del p.(Val6AlafsTer5), CRISPR-Cas9
  publication: PMID:34445569
  description: >-
    Made because the mouse does not degenerate, and the first model to show
    degenerative changes. At 12 months post-fertilisation the mutants have
    disrupted phagocytosis with increased phagosome size on electron microscopy,
    rhodopsin mislocalisation, and reduced atg12 and sod2 expression - which the
    authors read as early signs of a rod-predominant degeneration.

    "Early signs" is the operative phrase and is not smoothed over here: this is
    not the severe early-onset blinding disease humans have, and no visual
    outcome is reported. It is a better model than the mouse for the degeneration
    question and still not a model of the human phenotype.
  modeled_mechanisms:

genetic:
- name: RDH12
  gene_term:
    preferred_term: RDH12
    term:
      id: hgnc:19977
      label: RDH12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A short-chain dehydrogenase/reductase on chromosome 14, highly expressed in
    photoreceptor inner segments.

    Two things about variant interpretation in this gene are worth stating
    explicitly. First, residual in vitro activity does not exclude pathogenicity:
    T49M and I51N retain significant activity on purified protein and still fail
    in cells, because of reduced NADPH affinity and much lower expression. Second,
    the gene's phenotypic range is wide - EOSRD/LCA is the commonest presentation,
    but retinitis pigmentosa, cone-rod dystrophy and macular dystrophy are all
    attributed to it, and autosomal dominant RP as well. A biallelic RDH12
    genotype therefore does not by itself predict the LCA phenotype.

    Severity is associated with genotype in some cases, per the natural-history
    review, but no allele-level rule has been established.

    A nomenclature trap for anyone reading the older literature: the 2005
    biochemical characterisation refers to RDH12 as linked to "Leber's congenital
    amaurosis 3", not 13. LCA3 is now assigned to SPATA7. A search on the old
    designation will return the wrong gene.
  evidence:
  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RDH12-associated retinopathy has wide phenotypic variability; including
      early-onset severe retinal dystrophy/Leber Congenital Amaurosis (EOSRD/LCA;
      most frequent presentation), retinitis pigmentosa, cone-rod dystrophy, and
      macular dystrophy.
    explanation: >-
      The phenotypic range attributed to the gene, with LCA identified as the
      commonest presentation. Graded OTHER because it is a review's synthesis.
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severity is associated with genotype in some cases.
    explanation: >-
      A genotype-severity association without a rule. Graded PARTIAL because the
      qualifier "in some cases" is doing most of the work in that sentence.
diagnosis:
- name: Widefield Fundus Imaging
  description: >-
    The imaging pattern is characteristic enough to raise the genotype before
    sequencing: petal-shaped, coloboma-like macular atrophy with a variegated
    watercolour-like appearance and peripapillary sparing. It is characteristic
    rather than pathognomonic - the watercolour pattern was present in 13 of 23
    imaged subjects, and the peripapillary sparing in 18 of 23.
  evidence:
  - reference: PMID:30979730
    reference_title: "Detailed clinical characterisation, unique features and natural history of autosomal recessive RDH12-associated retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Widefield imaging in 23 subjects revealed a unique, variegated
      watercolour-like pattern of atrophy in 13 subjects and sparing of the
      peripapillary area in 18 subjects.
    explanation: >-
      The imaging findings with their denominators, which is what makes this
      suggestive rather than diagnostic on its own.
- name: Molecular Genetic Testing
  description: >-
    Sequencing establishes the diagnosis, and it is the only thing that does -
    the ERG is non-recordable across LCA genotypes and the fundus pattern is
    suggestive rather than specific. It matters more here than genotype usually
    does in LCA, because RDH12 is one of the genotypes for which RPE65-style gene
    supplementation is not expected to behave the same way.
  evidence:
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RDH12 is involved in photoreceptor retinoid metabolism and is a potential
      target for gene therapy, which has been successful in treating
      RPE65-associated LCA.
    explanation: >-
      Why identifying the gene matters therapeutically. Graded OTHER because it is
      the review's framing rather than a result.
treatments:
- name: No Approved Disease-Modifying Therapy
  description: >-
    There is currently no treatment for RDH12-associated retinal degeneration.
    Curated as an explicit entry rather than an empty section, because the absence
    is the clinically relevant fact and because it sits against a background where
    one LCA genotype - RPE65 - does have an approved therapy, which patients and
    families reasonably ask about.
  evidence:
  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is currently no treatment available for RDH12-retinopathy.
    explanation: >-
      The state of treatment as of the 2022 review. Graded OTHER because it is a
      review's statement of the field rather than a study result.
- name: AAV Gene Supplementation (Investigational)
  description: >-
    A gene therapy vector for RDH12-associated retinal dystrophy has been
    developed, and preclinical work plus a prospective natural-history study are
    described as preparing the foundation for trials. Nothing has been shown to
    work in patients.

    The specific obstacle for this genotype is timing rather than vector design.
    Macular atrophy is universal and documented from age two; supplementation can
    only preserve photoreceptors that still exist. That is the reason the
    natural-history studies exist at all - to identify outcome measures, since the
    ERG is already non-recordable and visual acuity does not fall until later.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic RDH12 Loss of Function
    description: >-
      Supplies a functional RDH12 copy to photoreceptors. It addresses the
      enzymatic deficit but cannot reverse atrophy that has already occurred.
  evidence:
  - reference: PMID:35491887
    reference_title: "RDH12 retinopathy: clinical features, biology, genetics and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, extensive preclinical investigations and an ongoing prospective
      natural history study are preparing the necessary foundation to design and
      establish forthcoming clinical trials.
    explanation: >-
      The development stage as of 2022 - preclinical, with trials not yet
      designed. Graded OTHER because it reports the state of a field.
  - reference: PMID:31884613
    reference_title: "Natural History and Genotype-Phenotype Correlations in RDH12-Associated Retinal Degeneration."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      RDH12-associated retinal degeneration is particularly devastating due to
      early macular atrophy, which will likely impact therapeutic outcomes.
    explanation: >-
      The anticipated limitation on efficacy. Graded PARTIAL because it qualifies
      the therapeutic prospect rather than supporting it.
- name: Light Exposure Reduction
  description: >-
    A mechanistically motivated intervention with no clinical evidence behind it.
    The Rdh12-null mouse is highly susceptible to light-induced photoreceptor
    apoptosis, and the authors of that study concluded that the severe visual
    impairment of humans with null RDH12 mutations may likely be caused by light
    damage - because the retinal that overwhelms the inner segment is generated by
    illumination.

    No human study has tested whether reducing light exposure alters the course.
    It is recorded here because the mechanistic case is unusually direct and
    because tinted lenses are low-risk; it should not be presented to a family as
    established.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral intervention
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  target_mechanisms:
  - target: Retinaldehyde and Aldehyde Toxicity in the Inner Segment
    description: >-
      Reducing illumination reduces the all-trans-retinal load that leaks into the
      inner segment, which is the substrate the missing enzyme would clear.
  evidence:
  - reference: PMID:17032653
    reference_title: "Retinol dehydrogenase (RDH12) protects photoreceptors from light-induced degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, severe visual impairments of individuals with null mutations in RDH12
      may likely be caused by light damage(1).
    explanation: >-
      The authors' inference from the mouse to the human, quoted with its hedge.
      This is the entire evidential basis for the intervention, and it is murine.
discussions:
- discussion_id: lca13_gene_therapy_window_closes_early
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a therapeutic window for RDH12 gene supplementation, given that
    macular atrophy is universal from age two?
  attaches_to:
  - "pathophysiology#Early Macular Atrophy"
  - "treatments#AAV Gene Supplementation (Investigational)"
  rationale: >-
    The obstacle is timing, and the numbers make it concrete. Macular atrophy was
    universal in all 57 subjects of the natural-history cohort and documented at
    age two. Non-recordable ERG has been documented at one year. Yet reduced but
    useful vision is frequently retained until adolescence, and severe loss of
    function and structure follows only after age ten.

    So there is a decade in which a treated patient has something left to
    preserve, and a treatment aimed at it would have to be given to a very young
    child whose macula is already atrophic. Whether the surviving extramacular
    photoreceptors are worth preserving, and by what measure, is not known - which
    is precisely why both natural-history papers say formal studies are needed to
    identify appropriate outcome measures. The ERG cannot be one; it is already at
    floor.

    This is curated as a knowledge gap rather than a pessimistic conclusion. The
    dissociation between early structural loss and late functional loss is itself
    the interesting finding, and it is not explained.
  proposed_experiments:
  - experiment_id: lca13_prospective_outcome_measure_study
    name: Prospective structure-function study to identify a trial endpoint
    description: >-
      Longitudinal optical coherence tomography, microperimetry and widefield
      autofluorescence in RDH12 patients aged two to eighteen, to find a measure
      that changes over a trial-length interval in the decade when vision is still
      useful.
    would_support:
    - "pathophysiology#Early Macular Atrophy"
    supporting_outcome:
    - >-
      A structural or functional measure outside the macula changes measurably
      over one to two years in the age range where vision is retained, giving a
      usable endpoint.
    refuting_outcome:
    - >-
      No measure changes detectably over a trial-length interval, indicating that
      efficacy could only be judged over a decade and that supplementation trials
      in this genotype are not currently feasible.
- discussion_id: lca13_which_toxic_species_drives_death
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do photoreceptors die from all-trans-retinal and lipid-aldehyde toxicity, or
    from retinoic acid overproduction?
  attaches_to:
  - "pathophysiology#Retinaldehyde and Aldehyde Toxicity in the Inner Segment"
  - "pathophysiology#Retinoic Acid Overproduction"
  rationale: >-
    Two candidate death mechanisms follow from the same enzymatic loss, and the
    cited work supports each without discriminating between them.

    The aldehyde-toxicity account: unreduced all-trans-retinal is reactive, RDH12
    also clears C9 lipid peroxidation products, and Rdh12-null mice show increased
    light-induced photoreceptor apoptosis.

    The retinoic-acid account: RDH12 acts as a reductase in living cells and so
    holds retinoic acid down; disease mutants cannot, and the protection from
    retinaldehyde-induced death correlates with the lower retinoic acid levels
    rather than being attributed to aldehyde clearance directly.

    The second account has one cell-based study behind it and no measurement in an
    RDH12-deficient retina, which is why that node is graded PROVISIONAL and the
    aldehyde node ESTABLISHED. Distinguishing them is not academic: an
    aldehyde-scavenging small molecule and a retinoic-acid-signalling antagonist
    are different drugs, and neither would be worth developing without knowing
    which arm matters.
  proposed_experiments:
  - experiment_id: lca13_retinoid_species_measurement_in_retina
    name: Retinoid speciation in Rdh12-null retina under light stress
    description: >-
      Quantify all-trans-retinal, retinal-derived adducts and all-trans-retinoic
      acid in Rdh12-null and wild-type mouse retina before and after light
      exposure, alongside photoreceptor apoptosis, to see which species tracks
      cell death.
    would_support:
    - "pathophysiology#Retinoic Acid Overproduction"
    supporting_outcome:
    - >-
      Retinoic acid rises in the null retina and its magnitude tracks apoptosis
      more closely than the retinal or aldehyde-adduct load does.
    refuting_outcome:
    - >-
      Retinoic acid is unchanged in the null retina while retinal and aldehyde
      adducts accumulate with apoptosis, restricting the retinoic-acid mechanism
      to the cell-culture setting in which it was found.
notes: >-
  Curated from a Perplexity deep-research report plus independent PubMed
  searching. The report was used for framing only, and its term validation is the
  reason. It reported 25 of 44 checked labels mismatched - the worst of the five
  reports produced in this curation batch - and the mismatches were of the most
  dangerous kind, real HPO terms paired with the wrong names. It offered
  HP:0000639 as "visual impairment" when HPO calls it Nystagmus, and HP:0000556 as
  "nystagmus" when HPO calls it Retinal dystrophy - the two labels are swapped
  between two real terms, so neither the CURIE nor the name looks wrong on its
  own. No CURIE was taken from the report; every binding here was resolved against
  the committed term caches and OLS.

  The GeneReviews overview of nonsyndromic LCA/EOSRD (PMID:30285347) is cited as
  the expert baseline. It is an overview chapter covering the whole disease class
  rather than an RDH12-specific one, so it is not used as an evidence source for
  this genotype's phenotypes; those come from the two natural-history studies.

  A nomenclature trap is recorded in the genetic notes: the 2005 biochemical
  paper refers to RDH12 as linked to "Leber's congenital amaurosis 3", not 13.
  LCA3 is now assigned to SPATA7.

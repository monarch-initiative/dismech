    reference_title: "Retinol dehydrogenase (RDH12) protects photoreceptors from light-induced degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      accelerated 11-cis-retinal production and increased susceptibility to
      light-induced photoreceptor apoptosis were also observed in Rdh12(-/-) mice,
      suggesting that RDH12 plays a unique, nonredundant role in the photoreceptor
      inner segments to regulate the flow of retinoids in the eye
    explanation: >-
      Light-induced apoptosis in the null mouse, and the non-redundancy claim.
  - reference: PMID:15865448
    reference_title: "Biochemical properties of purified human retinol dehydrogenase 12 (RDH12): catalytic efficiency toward retinoids and C9 aldehydes and effects of cellular retinol-binding protein type I (CRBPI) and cellular retinaldehyde-binding protein (CRALBP) on the oxidation and reduction of retinoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      at saturating concentrations of peroxidic aldehydes in the cells undergoing
      oxidative stress, for example, photoreceptors, RDH12 might also play a role
      in detoxification of lipid peroxidation products
    explanation: >-
      The second substrate class. Quoted with the authors' hedge intact, since
      this arm is inferred from in vitro kinetics rather than measured in vivo.
  downstream:

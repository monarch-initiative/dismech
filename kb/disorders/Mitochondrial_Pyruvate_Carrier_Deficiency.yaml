name: Mitochondrial Pyruvate Carrier Deficiency
creation_date: '2026-10-12T18:40:00Z'
category: Mendelian
parents:
- Mitochondrial Disease
- Disorder of Pyruvate Metabolism
- Inborn Error of Metabolism
disease_term:
  preferred_term: mitochondrial pyruvate carrier deficiency
  term:
    id: MONDO:0013877
    label: mitochondrial pyruvate carrier deficiency
synonyms:
- MPYCD
- MPC deficiency
- MPC1 deficiency
- defect in mitochondrial pyruvate transport
description: >-
  Mitochondrial pyruvate carrier (MPC) deficiency is a rare autosomal
  recessive inborn error of pyruvate oxidation caused by biallelic variants in
  MPC1 or, less often, MPC2, which encode the two interdependent subunits of
  the carrier that imports pyruvate across the inner mitochondrial membrane.
  Without it, pyruvate made by glycolysis cannot reach pyruvate dehydrogenase
  and the tricarboxylic acid cycle, so pyruvate and lactate accumulate while
  mitochondrial respiration from pyruvate falls. Because cytosolic redox
  balance is preserved, lactate and pyruvate rise together and the
  lactate:pyruvate ratio stays normal, the same biochemical signature as
  pyruvate dehydrogenase deficiency, from which it is distinguished by normal
  pyruvate dehydrogenase and respiratory chain activities and by impaired
  pyruvate oxidation in intact or permeabilised cells. Onset is usually in the
  first six months, with global developmental delay, microcephaly, growth
  failure and hypotonia; seizures, encephalopathy, periventricular cysts and
  basal ganglia signal change occur, and some cases are lethal before birth or
  in infancy. Fewer than twenty patients are reported. Ketogenic diet and
  glutamine supplementation, which feed the tricarboxylic acid cycle by routes
  that do not need the carrier, have been followed by clinical improvement.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34873722
    reference_title: "Identification and characterization of novel MPC1 gene variants causing mitochondrial pyruvate carrier deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPC deficiency (OMIM#614741) due to pathogenic MPC1 variants is a rare autosomal recessive disease involving developmental delay, microcephaly, growth failure, and increased serum lactate and pyruvate."
    explanation: >-
      States recessive inheritance for MPC1-related deficiency.
  - reference: PMID:36417180
    reference_title: "MPC2 variants disrupt mitochondrial pyruvate metabolism and cause an early-onset mitochondriopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the first family, patients presented with antenatal developmental abnormalities and harboured a homozygous c.148T>C (p.Trp50Arg) variant."
    explanation: >-
      A homozygous MPC2 variant segregating with disease, consistent with
      recessive inheritance for the MPC2 subtype.
has_subtypes:
- name: MPC1
  display_name: MPC1-related mitochondrial pyruvate carrier deficiency
  description: >-
    The original and commoner form, caused by biallelic MPC1 missense or
    loss-of-function variants. Variants either destabilise the MPC complex,
    so that MPC2 is lost as well, or ablate pyruvate uptake in an assembled
    complex.
  evidence:
  - reference: PMID:22628558
    reference_title: "A mitochondrial pyruvate carrier required for pyruvate uptake in yeast, Drosophila, and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human genetic studies of three families with children suffering from lactic acidosis and hyperpyruvatemia revealed a causal locus that mapped to MPC1, changing single amino acids that are conserved throughout eukaryotes."
    explanation: >-
      The first families in which the disease was mapped to MPC1.
- name: MPC2
  display_name: MPC2-related mitochondrial pyruvate carrier deficiency
  description: >-
    Described in four patients from two families, one with a homozygous
    p.Trp50Arg variant and antenatal developmental abnormalities and one with
    a start-codon variant and infantile encephalopathy. Fibroblasts show the
    same pyruvate-specific respiratory defect as MPC1 deficiency, rescued by
    wild-type MPC2.
  evidence:
  - reference: PMID:36417180
    reference_title: "MPC2 variants disrupt mitochondrial pyruvate metabolism and cause an early-onset mitochondriopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present work describes the first pathogenic variants in MPC2 associated with human disease in four patients from two unrelated families."
    explanation: >-
      First report of MPC2-related disease.
pathophysiology:
- name: Biallelic MPC1 or MPC2 Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic missense, start-codon or other loss-of-function variants in
    MPC1 or MPC2 are the initiating lesion. Because the two subunits
    stabilise each other, variants in either gene can destabilise the whole
    complex; patient fibroblasts with MPC1 variants show reduced MPC1 and
    MPC2 protein.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: MPC1
    term:
      id: hgnc:21606
      label: MPC1
  - preferred_term: MPC2
    term:
      id: hgnc:24515
      label: MPC2
  evidence:
  - reference: PMID:34873722
    reference_title: "Identification and characterization of novel MPC1 gene variants causing mitochondrial pyruvate carrier deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we report three novel pathogenic MPC1 variants in six patients from three unrelated families, identified within European, Kuwaiti, and Chinese mitochondrial disease patient cohorts, one of whom presented as a Leigh-like syndrome."
    explanation: >-
      Additional MPC1 variants in affected families.
  - reference: PMID:37899339
    reference_title: "[Mitochondrial pyruvate carrier deficiency: 3 cases report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 5 MPC1 gene missense variants and 2 MPC2 gene variants were identified in 15 cases."
    explanation: >-
      Summarises the allelic spectrum across both genes in 15 reported cases.
  downstream:
  - target: Loss of the MPC1-MPC2 Carrier Complex
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34873722
      reference_title: "Identification and characterization of novel MPC1 gene variants causing mitochondrial pyruvate carrier deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Complementing homozygous MPC1 mutant cDNA with CRISPR-deleted MPC1 C2C12 cells verified the mechanism of variants: unstable MPC complex or ablated pyruvate uptake activity."
      explanation: >-
        Complementation experiments assign the variants to two mechanisms,
        complex instability or loss of transport activity.
- name: Loss of the MPC1-MPC2 Carrier Complex
  biological_scale: MOLECULAR
  description: >-
    MPC1 and MPC2 form a hetero-oligomeric complex of about 150 kDa in the
    inner mitochondrial membrane, and each subunit is needed to stabilise the
    other. Pathogenic variants leave either no stable complex or a complex
    that cannot transport pyruvate.
  molecular_functions:
  - preferred_term: pyruvate transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0050833
      label: pyruvate transmembrane transporter activity
  evidence:
  - reference: PMID:22628558
    reference_title: "A mitochondrial pyruvate carrier required for pyruvate uptake in yeast, Drosophila, and humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mpc1 and Mpc2 associate to form an ~150-kilodalton complex in the inner mitochondrial membrane."
    explanation: >-
      Defines the carrier as a two-subunit complex.
  - reference: PMID:34873722
    reference_title: "Identification and characterization of novel MPC1 gene variants causing mitochondrial pyruvate carrier deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis in primary fibroblasts from the patients revealed decreased expression of MPC1 and MPC2."
    explanation: >-
      MPC1 variants reduce both subunits in patient cells.
  - reference: PMID:31145700
    reference_title: "Two human patient mitochondrial pyruvate carrier mutations reveal distinct molecular mechanisms of dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Truncated MPC1 A58G protein was intrinsically unstable and failed to form MPC complexes."
    explanation: >-
      One patient allele product cannot assemble the complex.
  - reference: PMID:31145700
    reference_title: "Two human patient mitochondrial pyruvate carrier mutations reveal distinct molecular mechanisms of dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conversely, MPC1 L79H protein formed stable complexes with MPC2, but these complexes failed to transport pyruvate."
    explanation: >-
      Another patient allele assembles a complex that cannot transport
      pyruvate.
  - reference: PMID:22628554
    reference_title: "Identification and functional expression of the mitochondrial pyruvate carrier."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coexpression of mouse MPC1 and MPC2 in Lactococcus lactis promoted transport of pyruvate across the membrane."
    explanation: >-
      The two subunits together are sufficient for pyruvate transport.
  downstream:
  - target: Impaired Mitochondrial Pyruvate Import
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22628558
      reference_title: "A mitochondrial pyruvate carrier required for pyruvate uptake in yeast, Drosophila, and humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of yeast Mpc1 results in defective mitochondrial pyruvate uptake, and silencing of MPC1 or MPC2 in mammalian cells impairs pyruvate oxidation."
      explanation: >-
        Loss of either subunit impairs pyruvate uptake and oxidation.
- name: Impaired Mitochondrial Pyruvate Import
  biological_scale: CELLULAR
  description: >-
    Pyruvate cannot cross the inner mitochondrial membrane, so it is not
    oxidised by pyruvate dehydrogenase even though that enzyme and the
    respiratory chain are intact. Patient fibroblasts show reduced
    pyruvate-driven respiration that is restored by re-expressing the
    wild-type subunit, and a profile that mimics control cells treated with
    the carrier inhibitor alpha-cyano-4-hydroxycinnamate.
  biological_processes:
  - preferred_term: pyruvate import into mitochondria
    modifier: DECREASED
    term:
      id: GO:0006850
      label: pyruvate import into mitochondria
  evidence:
  - reference: PMID:36417180
    reference_title: "MPC2 variants disrupt mitochondrial pyruvate metabolism and cause an early-onset mitochondriopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient-derived skin fibroblasts exhibit decreased pyruvate-driven oxygen consumption rates with normal activities of the pyruvate dehydrogenase complex and mitochondrial respiratory chain and no defects in mitochondrial content or morphology."
    explanation: >-
      Pyruvate-specific respiratory defect with intact downstream enzymes.
  - reference: PMID:36417180
    reference_title: "MPC2 variants disrupt mitochondrial pyruvate metabolism and cause an early-onset mitochondriopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Re-expression of wild-type MPC2 restored pyruvate-dependent respiration rates in patient-derived fibroblasts."
    explanation: >-
      Rescue confirms the defect lies in the carrier.
  - reference: PMID:12649063
    reference_title: "Impaired mitochondrial pyruvate importation in a patient and a fetus at risk."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results are consistent with a defect of mitochondrial pyruvate transport in the patient."
    explanation: >-
      The original functional description of the transport defect in
      permeabilised patient fibroblasts.
  downstream:
  - target: Reduced Mitochondrial Pyruvate Oxidation
    causal_link_type: DIRECT
- name: Reduced Mitochondrial Pyruvate Oxidation
  biological_scale: CELLULAR
  description: >-
    Pyruvate-derived acetyl-CoA no longer feeds the tricarboxylic acid cycle,
    so oxidative energy production from glucose falls. Tissues most dependent
    on glucose oxidation, above all the developing brain, are most affected.
    Glutamine and beta-hydroxybutyrate can still sustain respiration in
    carrier-deficient cells because they enter the cycle by other routes.
  biological_processes:
  - preferred_term: pyruvate decarboxylation to acetyl-CoA
    modifier: DECREASED
    term:
      id: GO:0006086
      label: pyruvate decarboxylation to acetyl-CoA
  evidence:
  - reference: PMID:34873722
    reference_title: "Identification and characterization of novel MPC1 gene variants causing mitochondrial pyruvate carrier deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We rescued pyruvate-driven oxygen consumption rate in patient's fibroblasts by reconstituting with wild-type MPC1."
    explanation: >-
      Pyruvate-driven respiration is reduced in patient fibroblasts and
      restored by wild-type MPC1.
  - reference: PMID:22628558
    reference_title: "A mitochondrial pyruvate carrier required for pyruvate uptake in yeast, Drosophila, and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Yeast and Drosophila mutants lacking MPC1 display impaired pyruvate metabolism, with an accumulation of upstream metabolites and a depletion of tricarboxylic acid cycle intermediates."
    explanation: >-
      Loss of the carrier depletes TCA cycle intermediates in model
      organisms.
  downstream:
  - target: Accumulation of Pyruvate and Lactate
    causal_link_type: DIRECT
  - target: Neuronal Energy Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25526709
      reference_title: "The spectrum of pyruvate oxidation defects in the diagnosis of mitochondrial disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PDHC deficiency including regulation and import affect mainly the glucose dependent central and peripheral nervous system and skeletal muscle."
      explanation: >-
        Review of pyruvate oxidation defects placing the import defect among
        those that mainly affect glucose-dependent nervous tissue.
- name: Accumulation of Pyruvate and Lactate
  biological_scale: ORGANISM
  description: >-
    Unused pyruvate accumulates in the cytosol and is reduced to lactate, so
    blood and cerebrospinal fluid lactate and pyruvate rise together with a
    normal lactate:pyruvate ratio. The acidosis can be severe and resistant to
    bicarbonate.
  evidence:
  - reference: PMID:37899339
    reference_title: "[Mitochondrial pyruvate carrier deficiency: 3 cases report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had elevated blood lactate and pyruvate, but the ratio of lactate/pyruvate was normal."
    explanation: >-
      Case series and literature review showing raised lactate and pyruvate
      with a normal ratio in every patient.
  - reference: PMID:12649063
    reference_title: "Impaired mitochondrial pyruvate importation in a patient and a fetus at risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She presented at birth with hypotonia, mild facial dysmorphism, periventricular cysts, marked metabolic acidosis, hyperlactacidemia with normal lactate/pyruvate molar ratios, normoglycemia, and normal ammonia."
    explanation: >-
      The first patient had marked lactic acidosis with a normal ratio.
  downstream:
  - target: Lactic acidosis
  - target: Increased circulating pyruvate concentration
- name: Neuronal Energy Failure
  biological_scale: TISSUE
  description: >-
    Reduced oxidation of glucose-derived pyruvate deprives the developing
    brain of energy, producing developmental delay, microcephaly, hypotonia,
    seizures and, in severe cases, encephalopathy and early death.
  evidence:
  - reference: PMID:36417180
    reference_title: "MPC2 variants disrupt mitochondrial pyruvate metabolism and cause an early-onset mitochondriopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Pathogenic variants in the MPC1 gene disrupt mitochondrial pyruvate uptake and oxidation and cause autosomal-recessive early-onset neurological dysfunction in humans."
    explanation: >-
      Links loss of pyruvate uptake and oxidation to early-onset neurological
      dysfunction.
  downstream:
  - target: Global developmental delay
  - target: Microcephaly
  - target: Hypotonia
  - target: Seizures
  - target: Periventricular cysts
  - target: Basal ganglia and thalamic signal abnormality
  - target: Growth failure

diagnosis:
- name: Pyruvate oxidation studies and MPC1/MPC2 sequencing
  description: >-
    Raised lactate and pyruvate with a normal ratio point to a pyruvate
    oxidation defect. Normal pyruvate dehydrogenase and respiratory chain
    activities with reduced pyruvate-driven respiration in intact or
    permeabilised cells point to the carrier, and sequencing of MPC1 and MPC2
    confirms it. Import defects are missed if pyruvate oxidation is not
    measured in intact mitochondria.
  evidence:
  - reference: PMID:25526709
    reference_title: "The spectrum of pyruvate oxidation defects in the diagnosis of mitochondrial disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cofactor and transport defects can be missed, if pyruvate oxidation is not measured in intact mitochondria routinely."
    explanation: >-
      Explains why import defects escape routine enzyme testing.
  - reference: PMID:36417180
    reference_title: "MPC2 variants disrupt mitochondrial pyruvate metabolism and cause an early-onset mitochondriopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lactate/pyruvate (L/P) molar ratios, mitochondrial respiratory chain and pyruvate dehydrogenase (PDH) activities were normal."
    explanation: >-
      The normal ratio and normal downstream enzyme activities that separate
      the disorder from PDH and respiratory chain defects.
treatments:
- name: Ketogenic diet
  description: >-
    A high-fat, low-carbohydrate diet supplies ketone-derived acetyl-CoA that
    enters the tricarboxylic acid cycle without the carrier. The response is
    mixed: some MPC1-deficient patients improved, including seizure control,
    while in the first described patient the diet did not correct the lactic
    acidosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ketogenic diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_mechanisms:
  - target: Reduced Mitochondrial Pyruvate Oxidation
    treatment_effect: BYPASSES
    description: >-
      Ketone bodies provide acetyl-CoA downstream of the blocked pyruvate
      import step.
  evidence:
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In MPC1-deficiency, we report for the first time a beneficial clinical course on KD."
    explanation: >-
      First report of clinical benefit from ketogenic diet in MPC1
      deficiency.
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 13 MAS/MPC1-individuals with a neurological phenotype treated with KD, 11 experienced benefits-mainly a striking effect against seizures."
    explanation: >-
      Benefit across the pooled malate-aspartate shuttle and MPC1 group,
      mainly on seizures; MPC1 patients are a minority of this group.
  - reference: PMID:12649063
    reference_title: "Impaired mitochondrial pyruvate importation in a patient and a fetus at risk."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperlactacidemia was severe (5-14 mmol/l) and not corrected with bicarbonate, thiamine (10 mg/d), 2-chloropropionate (100 mg/kg/d) and a ketogenic diet."
    explanation: >-
      The index patient's lactic acidosis did not respond to the diet.
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In contrast, KD has been reported unsuccessful in one case with MPC1-deficiency"
    explanation: >-
      The same cohort paper acknowledges a previously reported non-responder.
- name: Glutamine supplementation
  description: >-
    Oral glutamine provides an anaplerotic substrate that can sustain
    mitochondrial respiration in carrier-deficient cells. Three Chinese
    patients improved in motor ability, cognition and endurance after two
    years of glutamine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glutamine
      term:
        id: CHEBI:28300
        label: glutamine
  target_mechanisms:
  - target: Reduced Mitochondrial Pyruvate Oxidation
    treatment_effect: BYPASSES
    description: >-
      Glutamine enters the tricarboxylic acid cycle as alpha-ketoglutarate,
      independent of pyruvate import.
  evidence:
  - reference: PMID:34873722
    reference_title: "Identification and characterization of novel MPC1 gene variants causing mitochondrial pyruvate carrier deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we showed that glutamine and beta-hydroxybutyrate were alternative substrates to maintain mitochondrial respiration when cells lack pyruvate."
    explanation: >-
      Cellular rationale for glutamine as an alternative fuel.
  - reference: PMID:37899339
    reference_title: "[Mitochondrial pyruvate carrier deficiency: 3 cases report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical symptoms including motor ability, cognition and activity endurance were improved in these 3 patients after taking glutamine for 2 years."
    explanation: >-
      Clinical improvement in three treated patients; uncontrolled case
      series.
animal_models:
- name: Mpc1 knockout mouse
  species: Mouse
  genotype: Mpc1-/- (complete loss of MPC1 expression)
  publication: PMID:27176894
  description: >-
    Complete Mpc1 loss is embryonic-lethal at about E13.5, with lactic
    acidosis, depleted TCA cycle intermediates, energy deficit and abnormal
    brain morphology and neurotransmitter balance. A maternal ketogenic diet
    reverses these changes and allows normal gestation, although pups die
    shortly after birth.
  modeled_mechanisms:
  - target: Reduced Mitochondrial Pyruvate Oxidation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Glucose-derived pyruvate contributes less to the TCA cycle and
      glutaminolysis rises.
    evidence:
    - reference: PMID:27176894
      reference_title: "Embryonic Lethality of Mitochondrial Pyruvate Carrier 1 Deficient Mouse Can Be Rescued by a Ketogenic Diet."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Labeling experiments using 13C-labeled glucose and glutamine demonstrated that MPC deficiency causes increased glutaminolysis and reduced contribution of glucose-derived pyruvate to the TCA cycle."
      explanation: >-
        Isotope tracing of the oxidation defect in knockout cells.
  - target: Neuronal Energy Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Embryonic brains show morphological defects and energy deficit that a
      ketogenic diet reverses.
    limitations: >-
      Complete knockout is embryonic-lethal, more severe than most human
      patients, who carry missense or partial-function alleles.
    evidence:
    - reference: PMID:27176894
      reference_title: "Embryonic Lethality of Mitochondrial Pyruvate Carrier 1 Deficient Mouse Can Be Rescued by a Ketogenic Diet."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morphological defects were observed in mutant embryonic brains, together with major alterations of their metabolome including lactic acidosis, diminished TCA cycle intermediates, energy deficit and a perturbed balance of neurotransmitters."
      explanation: >-
        Brain energy failure in the knockout.
    - reference: PMID:27176894
      reference_title: "Embryonic Lethality of Mitochondrial Pyruvate Carrier 1 Deficient Mouse Can Be Rescued by a Ketogenic Diet."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, these changes were reversed when the pregnant dams were fed a ketogenic diet, which provides acetyl-CoA directly to the TCA cycle and bypasses the need for a functional MPC."
      explanation: >-
        Ketogenic diet rescues the brain phenotype, supporting the bypass
        rationale.
- name: Mpc1 partial-deficiency mouse
  species: Mouse
  genotype: Mpc1+/- (CRISPR/Cas9)
  publication: PMID:29175325
  description: >-
    Viable mice with partial MPC1 loss have low body weight and reduced
    movement that improve on a high-fat diet, consistent with fatty acid
    oxidation compensating for reduced pyruvate oxidation.
  modeled_mechanisms:
  - target: Reduced Mitochondrial Pyruvate Oxidation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      A mild energy deficit compensated by fatty acid oxidation.
    limitations: >-
      Heterozygous mice model partial carrier loss; human disease is
      biallelic.
    evidence:
    - reference: PMID:29175325
      reference_title: "Fatty acid oxidation alleviates the energy deficiency caused by the loss of MPC1 in MPC1(+/-) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The MPC1+/- mice may employ fatty acid oxidation to meet their bioenergetic demands."
      explanation: >-
        Compensation by fatty acid oxidation in the partial-loss mouse.
notes: >-
  No GeneReviews chapter covers this disorder. HGNC gives MPC1 as hgnc:21606
  and MPC2 as hgnc:24515.

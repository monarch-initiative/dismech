mechanistic_hypotheses:
- hypothesis_group_id: stromal_cytokine_source
  hypothesis_label: Lymph Node Stromal Cells as the Source of VEGF
  status: EMERGING
  description: >-
    The cells that oversupply VEGF in unicentric Castleman disease are lymph node
    stromal cells - CXCL13+ follicular dendritic cells and FDCSP+/CLU+ B-zone
    reticular cells - rather than the hematopoietic compartment that earlier
    immunohistochemical work implicated. In UCD the expanded subsets and the
    VEGF signal are confined to follicles, which distinguishes it from the
    multicentric forms where T-zone and perivascular reticular cells dominate and
    the signal extends interfollicularly. The evidence is a single spatial
    multi-omic study of 22 cases with no functional perturbation, so the causal
    direction (stromal activation driving the lesion versus responding to it) is
    not established.
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCD is characterized by increased TRC while UCD shows increased B-reticular cells (BRC)."
    explanation: >-
      Establishes that a distinct stromal subset dominates the unicentric form,
      the core claim of this hypothesis group.
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, prominent FDCs in CD were considered remnants of attenuated germinal centers."
    explanation: >-
      States the prior interpretation this hypothesis displaces: follicular
      dendritic cells as passive remnants rather than activated drivers.
- hypothesis_group_id: clonal_stromal_origin
  hypothesis_label: Clonal Somatic Stromal Mutation as a Driver of UCD
  status: EMERGING
  description: >-
    Recurrent somatic mutations in the stromal compartment - notably PDGFRB
    N666S, and IL6ST and PDGFRB in paraneoplastic-pemphigus-associated cases -
    make unicentric Castleman disease at least partly a clonal stromal-cell
    neoplasm rather than a purely reactive process. The mutations are recurrent
    and enriched, and PDGFRB N666S is an activating allele in other diseases, but
    they are present in a minority of cases, no functional model has shown that
    they initiate the lymph node lesion, and their cell of origin within the node
    is unresolved.
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific mutations in PDGFRB N666S in 10% of unicentric CD (UCD) and NCOA4 L261F in 23% of idiopathic multicentric CD (iMCD) cases"
    explanation: >-
      Quantifies the recurrent somatic allele this hypothesis rests on, and the
      minority frequency that keeps it from being canonical.
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we continue to lack a foundational understanding of the biological mechanisms driving this disease process."
    explanation: >-
      The same review states that the mechanistic significance of these genetic
      findings is not established, limiting the hypothesis to EMERGING status.
description: >-
  Unicentric Castleman disease (UCD) is the localized form of Castleman disease,
  involving a single lymph node region and accounting for the majority of
  Castleman cases. It usually presents as an asymptomatic mass found
  incidentally or on investigation of local compressive symptoms, and complete
  surgical resection is generally curative, with 5-year survival around 91%.
  About one in five patients nonetheless has systemic symptoms or laboratory
  abnormalities, and these are more pronounced in children. The hyaline-vascular
  histologic pattern predominates: regressed germinal centers with expanded
  follicular dendritic cell meshworks producing the "onion-skin" mantle zones,
  and follicle-confined VEGF overexpression producing the penetrating "lollipop"
  vessels. Recurrent somatic mutations in the stromal compartment - PDGFRB N666S
  in about 10% of cases, and IL6ST and PDGFRB in about a third of
  paraneoplastic-pemphigus-associated cases - raise the possibility that UCD is a
  clonal stromal neoplasm rather than a reactive process, though this is not
  established. Paraneoplastic pemphigus with bronchiolitis obliterans is a rare
  but frequently fatal complication that can progress even after the Castleman
  lesion is removed.
pathophysiology:
- name: Somatic Stromal Cell Mutation
  description: >-
    Recurrent somatic mutations are found in UCD lesional tissue. PDGFRB N666S,
    an activating receptor tyrosine kinase allele, is present in about 10% of
    cases. In paraneoplastic-pemphigus-associated UCD, whole-exome sequencing
    found IL6ST (encoding gp130) and PDGFRB as the most frequently mutated genes
    at 32% each, with IL6ST variants predicting worse overall survival. MAPK and
    interleukin signaling pathway abnormalities cluster in UCD, in contrast to
    the chromatin-organization and methylation abnormalities that cluster in
    idiopathic multicentric disease. Whether these alleles initiate the lesion or
    accumulate within it is unresolved.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
    notes: >-
      PDGFRB N666S is an activating allele; IL6ST encodes the gp130 subunit
      through which IL-6 signals. PDGFRB is also the marker of the perivascular
      and fibroblastic reticular cells that expand in Castleman lymph nodes.
  biological_processes:
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific mutations in PDGFRB N666S in 10% of unicentric CD (UCD) and NCOA4 L261F in 23% of idiopathic multicentric CD (iMCD) cases"
    explanation: Gives the recurrent alleles and their frequencies in each subtype.
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes affecting chromatin organization and abnormalities in methylation are seen more commonly in iMCD while abnormalities within the mitogen-activated protein kinase (MAPK) and interleukin signaling pathways are more frequent in UCD."
    explanation: Supports the subtype-specific pathway clustering described in this node.
  - reference: PMID:37839777
    reference_title: "Whole-Exome Sequencing Reveals the Genomic Profile and IL6ST Variants as a Prognostic Biomarker of Paraneoplastic Pemphigus-Associated Unicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, IL6ST and PDGFRB were the most frequently mutated genes (32%), followed by DPP6 (18%) and MUC4 (18%)."
    explanation: >-
      Whole-exome sequencing of 37 PNP-associated UCD samples identifies the two
      recurrently mutated genes named in this node.
  downstream:
  - target: Lymph Node Stromal Cell Activation and Expansion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - clonal_stromal_origin
    description: >-

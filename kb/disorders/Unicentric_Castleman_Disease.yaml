histopathology:
- name: Angiofollicular Lymph Node Hyperplasia, Hyaline-Vascular Variant
  description: >-
    The hyaline-vascular histologic pattern predominates in UCD. Features
    regressed/atretic germinal centers, penetrating radial "lollipop"
    vessels with hyalinized walls, expanded "onion-skinning" mantle zones
    of concentric small lymphocytes, and interfollicular vascular
    proliferation. Plasmacytosis is minimal. Spatial mapping attributes the
    onion-skinning to interdigitation of expanded CD21+ follicular dendritic cell
    meshworks between the concentric mantle-zone B cell layers, and the
    lollipop vessels to focal VEGF overexpression by those same follicular
    dendritic cells.
  context: UCD
  diagnostic: true
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interaction of activated follicular dendritic cell (FDC) cytoplasmic meshworks with mantle-zone B cells is associated with B-cell activation and differentiation."
    explanation: >-
      Provides the cellular basis now proposed for the mantle-zone architecture
      described in this finding.
- name: Expanded CD21-Positive Follicular Dendritic Cell Meshwork
  description: >-
    CD21 immunostaining shows follicular dendritic cell meshworks of greater
    area, intensity, and structural complexity (image entropy) in both UCD and
    MCD than in reactive lymph nodes, and UCD follicles show reduced cellular
    diversity consistent with FDC predominance. This is an immunohistochemical
    correlate of the stromal-activation model rather than a routine diagnostic
    criterion.
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD shows increased stromal cells that form unique microenvironments."
    explanation: >-
      Records the increased stromal content quantified by CD21 meshwork imaging
      in this study.
imaging_findings:
- name: Solitary Avidly Enhancing Nodal Mass
  modality: CT
  description: >-
    UCD typically appears on contrast CT as a solitary, homogeneous, avidly
    enhancing soft-tissue mass in one nodal station, most often mediastinal,
    cervical, or abdominal, sometimes with branching or coarse calcification.
    Assessing resectability and the relation of the mass to adjacent vital
    structures is what determines whether first-line surgery is possible.
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Unresectable UCD that is symptomatic as a result of compression of vital neighboring structures may be rendered amenable to resection by medical therapy (eg, rituximab, steroids), radiotherapy, or embolization."
    explanation: >-
      Supports the clinical purpose of cross-sectional imaging in UCD -
      determining resectability and compression of neighboring structures. The
      quote does not describe the imaging appearance itself, hence PARTIAL.
biochemical:
- name: Interleukin-6 (IL-6)
  presence: Elevated
  context: >-
    Serum IL-6 is typically normal in UCD, which is the usual laboratory
    contrast with the multicentric forms. It is elevated in the symptomatic
    minority with an inflammatory syndrome, and those are the patients for whom
    the international UCD guideline recommends considering siltuximab when the
    lesion cannot be resected.
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The anti-interleukin-6 monoclonal antibody siltuximab should be considered for unresectable UCD patients with an inflammatory syndrome."
    explanation: >-
      Supports the clinical relevance of an IL-6-driven inflammatory syndrome in
      the symptomatic UCD minority. The quote does not itself report IL-6 levels,
      hence PARTIAL.
- name: C-Reactive Protein (CRP)
  presence: Elevated
  context: >-
    Acute-phase reactant driven by IL-6 signaling. Normal in most UCD and
    elevated in the symptomatic minority; when raised before resection it is the
    practical marker for confirming that the inflammatory syndrome has resolved
    afterwards.
prevalence:
- population: United States
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 2.3
  rate_low: 2.1
  rate_high: 2.5
  notes: >-
    All Castleman disease, not UCD alone - no UCD-specific incidence estimate
    exists. Two commercial claims databases gave 21 and 25 cases per million
    person-years using a lymphadenopathy-anchored case-finding algorithm (there
    was no CD-specific ICD-9 code at the time), reported as 2.1-2.5 per 100,000
    here. About 23% of identified cases were multicentric, so roughly
    three-quarters of incident Castleman disease is unicentric.
  evidence:
  - reference: PMID:25120049
    reference_title: "Use of a claims database to characterize and estimate the incidence rate for Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence rate for CD was calculated as 21 (IMS LifeLink™) and 25 (MarketScan(®)) per million person-years."
    explanation: The source incidence estimate converted to the normalized rate above.
  - reference: PMID:25120049
    reference_title: "Use of a claims database to characterize and estimate the incidence rate for Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, 23% of patients with CD were identified as potentially suffering from MCD."
    explanation: Gives the multicentric fraction of the incident cases.
progression:
- phase: Post-resection long-term survival
  notes: >-
    UCD has the best outcome of any Castleman category: 5-year overall survival
    was 91% in a 113-patient two-centre series, against 65% for multicentric
    disease without POEMS. Complete resection is generally curative and
    recurrence is rare. The exceptions are unresectable disease and
    paraneoplastic pemphigus with bronchiolitis obliterans, which can progress to
    respiratory failure even after the Castleman lesion is removed.
  evidence:
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all patients, 2, 5, and 10-year OS was 92%, 76%, 59%, respectively."
    explanation: Gives the overall survival figures quoted here.
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(1) unicentric CD (91%); (2) multicentric CD associated with the osteosclerotic variant of POEMS syndrome (90%); (3); multicentric CD without POEMS syndrome (65%); and (4) multicentric CD with POEMS syndrome without osteosclerotic lesions (27%)."
    explanation: Gives the category-specific 5-year survival stratification.
diagnosis:
- name: Excisional lymph node biopsy
  description: >-
    Diagnosis requires characteristic lymph node histopathology; there is no
    diagnostic serum biomarker. Excisional biopsy is preferred over core or fine
    needle sampling because architectural features - regressed or hyperplastic
    germinal centers, mantle-zone onion-skinning, penetrating vessels,
    interfollicular plasmacytosis - cannot be assessed on a fragment. Histology
    alone is not sufficient: reactive Castleman-like changes occur in
    autoimmune disease, lymphoma, and infection, so the findings must be
    combined with clinical and laboratory data.
  diagnosis_term:
    preferred_term: lymph node biopsy
    term:
      id: NCIT:C51900
      label: Lymph Node Biopsy
  results: >-
    Angiofollicular lymph node hyperplasia of hyaline-vascular, plasma-cell, or
    mixed type.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like changes in reactive lymph nodes, and thus histologic findings must be combined with clinical and laboratory findings to accurately diagnose iMCD."
    explanation: States directly why histology alone cannot establish the diagnosis.
- name: Cross-sectional and FDG-PET imaging
  description: >-
    CT of the neck, chest, abdomen, and pelvis, or FDG-PET/CT, establishes
    whether disease is unicentric or multicentric - the single most consequential
    branch point in management, since unicentric disease is surgically curable.
    Imaging also selects the biopsy target and, in UCD, determines resectability.
  diagnosis_term:
    preferred_term: positron emission tomography
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  results: >-
    A single involved nodal region confirms unicentric disease. Any additional
    involved region reclassifies the case as multicentric, which changes both
    the entity and the first-line therapy.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unicentric CD (UCD) involves one enlarged lymph node region, whereas multicentric CD (MCD) involves multiple enlarged lymph node regions."
    explanation: The distinction that imaging is performed to establish.
differential_diagnoses:
- name: Lymphoma
  description: >-
    Hodgkin and non-Hodgkin lymphoma both produce lymphadenopathy with systemic
    symptoms and can generate reactive Castleman-like nodal changes; iMCD-NOS in
    particular mimics indolent lymphoma. Lymphoma is a formal exclusion in the
    iMCD diagnostic criteria. The relationship also runs the other way in
    HHV-8+ MCD, where concurrent KSHV-driven lymphoma occurs at 28 cases per
    1,000 patient-years.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like changes in reactive lymph nodes, and thus histologic findings must be combined with clinical and laboratory findings to accurately diagnose iMCD."
    explanation: Names lymphoma among the conditions producing Castleman-like reactive nodes.
- name: Multicentric Castleman disease
  description: >-
    The same histopathology in more than one nodal region. This is the
    distinction that defines the entity and it is made by imaging, not by
    pathology: a node that looks identical under the microscope belongs to a
    different disease with a different cause and a different first-line therapy
    if other regions are involved. Systemic symptoms, cytopenias, and
    hypoalbuminemia in a patient with apparently unicentric disease should
    prompt a careful search for additional sites.
  distinguishing_features:
  - >-
    Multiple enlarged lymph node regions on cross-sectional or FDG-PET imaging;
    systemic inflammatory syndrome in most rather than a minority of patients.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unicentric CD (UCD) involves one enlarged lymph node region, whereas multicentric CD (MCD) involves multiple enlarged lymph node regions."
    explanation: States the anatomic criterion that separates the two entities.
genetic:
- name: PDGFRB
  gene_term:
    preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  presence: Somatic mutation in lesional tissue
  frequency: >-
    N666S in about 10% of unicentric CD; PDGFRB among the two most frequently
    mutated genes (32%) in paraneoplastic-pemphigus-associated UCD.
  notes: >-
    N666S is an activating allele of the platelet-derived growth factor receptor
    beta, the receptor whose expression also marks the perivascular and
    fibroblastic reticular cells that expand in Castleman lymph nodes. Whether
    the mutation initiates the lesion or is acquired within an already
    proliferating stromal population has not been established, so this is
    recorded as a somatic driver candidate rather than a confirmed cause.
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "specific mutations in PDGFRB N666S in 10% of unicentric CD (UCD) and NCOA4 L261F in 23% of idiopathic multicentric CD (iMCD) cases"
    explanation: Gives the recurrence frequency of PDGFRB N666S in UCD.
  - reference: PMID:37839777
    reference_title: "Whole-Exome Sequencing Reveals the Genomic Profile and IL6ST Variants as a Prognostic Biomarker of Paraneoplastic Pemphigus-Associated Unicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, IL6ST and PDGFRB were the most frequently mutated genes (32%), followed by DPP6 (18%) and MUC4 (18%)."
    explanation: Independent whole-exome confirmation of recurrent PDGFRB mutation in a UCD cohort.
- name: IL6ST
  gene_term:
    preferred_term: IL6ST
    term:
      id: hgnc:6021
      label: IL6ST
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  presence: Somatic mutation in lesional tissue
  frequency: 32% of paraneoplastic-pemphigus-associated unicentric CD.
  notes: >-
    IL6ST encodes gp130, the signal-transducing subunit shared by IL-6 and viral
    IL-6, so a somatic IL6ST variant sits directly on the pathway the disease's
    approved therapy targets. IL6ST variants were associated with worse overall
    survival in PNP-associated UCD and defined one of four proposed genomic
    subgroups (IL6ST, PDGFRB, IL6ST-PDGFRB, unknown). The functional consequence
    of the specific variants has not been characterized.
  evidence:
  - reference: PMID:37839777
    reference_title: "Whole-Exome Sequencing Reveals the Genomic Profile and IL6ST Variants as a Prognostic Biomarker of Paraneoplastic Pemphigus-Associated Unicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, IL6ST and PDGFRB were the most frequently mutated genes (32%), followed by DPP6 (18%) and MUC4 (18%)."
    explanation: Establishes IL6ST as the joint most frequently mutated gene in this cohort.
  - reference: PMID:37839777
    reference_title: "Whole-Exome Sequencing Reveals the Genomic Profile and IL6ST Variants as a Prognostic Biomarker of Paraneoplastic Pemphigus-Associated Unicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we classified PNP-associated UCD into 4 genomic subgroups: IL6ST, PDGFRB, IL6ST-PDGFRB, and an unknown subgroup."
    explanation: Supports the proposed genomic subgrouping described in the notes.
treatments:
- name: Surgical Resection
  description: >-
    Complete surgical resection is generally curative for unicentric Castleman
    disease and is the preferred first-line therapy wherever it is feasible.
    Asymptomatic unresectable disease may be observed rather than treated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  target_mechanisms:
  - target: Angiofollicular Lymph Node Hyperplasia
    treatment_effect: INHIBITS
    description: >-
      Removing the single involved node removes the entire lesion and, with it,
      the stromal cytokine source in unicentric disease.
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete surgical resection is often curative and is therefore the preferred first-line therapy, if possible."
    explanation: International consensus guideline establishing resection as first-line UCD therapy.
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Existing evidence supports that asymptomatic unresectable UCD may be observed."
    explanation: Records the observation option for the unresectable asymptomatic case.
- name: Siltuximab
  description: >-
    Anti-IL-6 monoclonal antibody. In unicentric disease its role is narrow: the
    international guideline recommends considering it for unresectable UCD in
    patients who have an inflammatory syndrome. It is not indicated for the
    typical asymptomatic resectable case. Its efficacy evidence comes from
    multicentric disease, where a randomised placebo-controlled trial showed
    durable tumour and symptomatic response in 34% of treated patients.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  context: Unresectable UCD with an inflammatory syndrome
  treatment_term:
    preferred_term: anti-IL-6 monoclonal antibody therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: siltuximab
      term:
        id: NCIT:C61084
        label: Siltuximab
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The anti-interleukin-6 monoclonal antibody siltuximab should be considered for unresectable UCD patients with an inflammatory syndrome."
    explanation: The guideline statement defining siltuximab's place in unicentric disease.
  - reference: PMID:25042199
    reference_title: "Siltuximab for multicentric Castleman's disease: a randomised, double-blind, placebo-controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Durable tumour and symptomatic responses occurred in 18 (34%) of 53 patients in the siltuximab group and none of 26 in the placebo group (difference 34·0%, 95% CI 11·1-54·8, p=0·0012)."
    explanation: >-
      The efficacy evidence, which comes from multicentric disease rather than
      UCD - hence PARTIAL for this entry.
- name: Neoadjuvant Rituximab or Corticosteroids
  description: >-
    For unresectable UCD that is symptomatic because it compresses neighbouring
    structures, medical therapy with rituximab or steroids can shrink the mass
    enough to make resection possible. This is cytoreduction to enable surgery,
    not definitive therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  context: Unresectable symptomatic UCD
  treatment_term:
    preferred_term: rituximab therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unresectable UCD that is symptomatic as a result of compression of vital neighboring structures may be rendered amenable to resection by medical therapy (eg, rituximab, steroids), radiotherapy, or embolization."
    explanation: The guideline statement naming rituximab and steroids for this indication.
- name: Radiotherapy or Embolization for Unresectable UCD
  description: >-
    Alternatives to medical cytoreduction for the same goal. Radiotherapy or
    arterial embolization can debulk an unresectable symptomatic mass and may
    render it resectable.
  therapeutic_modality: RADIOTHERAPY
  context: Unresectable symptomatic UCD
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unresectable UCD that is symptomatic as a result of compression of vital neighboring structures may be rendered amenable to resection by medical therapy (eg, rituximab, steroids), radiotherapy, or embolization."
    explanation: The guideline statement naming radiotherapy and embolization for this indication.
discussions:
- discussion_id: gap_ucd_persistent_symptoms_after_resection
  prompt: >-
    Why do some UCD patients keep constitutional symptoms after complete excision
    with normalized laboratory markers, and what should they be offered?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Surgical Resection
  - phenotypes#Elevated C-Reactive Protein
  rationale: >-
    Complete resection is described as often curative, so persisting symptoms
    with normal inflammatory markers after a complete excision are not explained
    by the current model, in which the resected node is the entire lesion and the
    source of the cytokine signal. Either the disease is not confined to the
    resected node in these patients, or the symptoms have a separate cause. The
    international UCD guideline names this as an open research question and
    offers no recommendation, so these patients are managed without evidence.
  evidence:
  - reference: PMID:33284946
    reference_title: "International evidence-based consensus diagnostic and treatment guidelines for unicentric Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further research is needed in UCD patients with persisting constitutional symptoms despite complete excision and normal laboratory markers."
    explanation: The guideline explicitly names this as an unmet research need.
  proposed_experiments:
  - experiment_id: exp_ucd_post_resection_longitudinal_profiling
    name: Longitudinal profiling of post-resection symptomatic UCD
    description: >-
      Follow UCD patients from before resection through 24 months with serial
      serum proteomics (including CXCL13, IL-6, and VEGF-A), whole-body FDG-PET,
      and patient-reported symptom scores, comparing those with and without
      persisting symptoms. Sequence the resected node and any FDG-avid residual
      site for the same somatic alleles to test whether persistent symptoms mark
      occult multicentric or multifocal disease.
    would_support:
    - pathophysiology#Somatic Stromal Cell Mutation
    supporting_outcome:
    - >-
      Symptomatic post-resection patients show residual FDG-avid nodal tissue or
      a persistently elevated cytokine signature, indicating incompletely
      resected or multifocal disease.
    refuting_outcome:
    - >-
      Symptomatic and asymptomatic post-resection patients are indistinguishable
      on imaging and cytokine profile, pointing to a cause outside the Castleman
      lesion.
- discussion_id: gap_ucd_clonal_vs_reactive
  prompt: >-
    Are the recurrent somatic PDGFRB and IL6ST alleles in UCD the initiating
    lesion, or passengers acquired inside an already-expanding stromal
    population?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic Stromal Cell Mutation
  - genetic#PDGFRB
  - genetic#IL6ST
  rationale: >-
    The answer decides whether UCD is a clonal stromal neoplasm or a reactive
    process, and therefore whether a PDGFRB inhibitor is a rational therapy for
    unresectable disease. PDGFRB N666S is activating in other diseases and PDGFRB
    marks the stromal subsets that expand here, which is suggestive. Against it:
    the alleles are present in a minority of cases, the cell of origin within the
    node has not been established, and no functional model has shown that either
    allele initiates the lesion.
  evidence:
  - reference: PMID:33804823
    reference_title: "A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, we continue to lack a foundational understanding of the biological mechanisms driving this disease process."
    explanation: >-
      The systematic review of Castleman molecular abnormalities states that the
      mechanistic significance of these findings is unresolved.
  proposed_experiments:
  - experiment_id: exp_ucd_sorted_stromal_variant_allele_fraction
    name: Variant allele fraction across sorted lymph node compartments
    description: >-
      Sort follicular dendritic cells, B-zone and perivascular reticular cells,
      endothelium, B cells, T cells, and plasma cells from PDGFRB- or
      IL6ST-mutant UCD nodes and measure the variant allele fraction in each. A
      driver should be near-clonal in one stromal compartment and absent from the
      hematopoietic ones; a passenger should be subclonal or spread across
      compartments.
    would_support:
    - pathophysiology#Somatic Stromal Cell Mutation
    supporting_outcome:
    - >-
      The variant is near-clonal in a single stromal compartment and absent from
      hematopoietic cells, identifying a cell of origin.
    refuting_outcome:
    - >-
      The variant is subclonal or distributed across unrelated compartments,
      indicating it was acquired within an already-expanded population.
- discussion_id: gap_ucd_no_disease_model
  prompt: >-
    Can a model system be built that reproduces the UCD lymph node lesion, and
    until one exists how can the stromal-activation mechanism be tested causally?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
  - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
  - pathophysiology#Stromal VEGF Overproduction and Neovascularization
  rationale: >-
    Every mechanism node in this entry derives from human tissue association -
    spatial transcriptomics and immunohistochemistry - with no perturbation
    experiment behind it, because no validated model system exists. That is why
    the causal direction cannot be settled: stromal activation could be driving
    the lesion or responding to it.
  evidence:
  - reference: DOI:10.1038/s41467-025-61214-1
    reference_title: "Spatial and single cell mapping of castleman disease reveals key stromal cell types and cytokine pathways"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of accurate cell culture or murine models limits functional studies of CD."
    explanation: States the gap in the authors' own words.
  proposed_experiments:
  - experiment_id: exp_ucd_lymphoid_organoid_stromal_perturbation
    name: Human lymphoid organoid with defined stromal perturbation
    description: >-
      Build a human lymphoid organoid containing primary follicular dendritic
      cells, B-zone reticular cells, naive B cells, and endothelium, then perturb
      single stromal populations (constitutive PDGFRB N666S expression, forced
      VEGFA expression, lymphotoxin-beta receptor stimulation) and score for the
      defining tissue readouts: CD21 meshwork expansion, concentric mantle-zone
      B cell layering, and perifollicular neovascularization.
    would_support:
    - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
    - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
    supporting_outcome:
    - >-
      Perturbing a single stromal population reproduces the onion-skinning and
      penetrating-vessel architecture, establishing stromal activation as
      sufficient rather than reactive.
    refuting_outcome:
    - >-
      No stromal perturbation reproduces the architecture, indicating the lesion
      requires an input absent from the organoid.
notes: >-
  Scope note: this entry covers the unicentric (localized) form only. It was
  split out of the former umbrella `Castleman_Disease` entry, together with
  `HHV-8-Associated_Multicentric_Castleman_Disease` and
  `Idiopathic_Multicentric_Castleman_Disease`, because those forms have
  different causes, different first-line therapy, and different confirmatory
  tests - differences that live in `pathophysiology`, `treatments` and
  `diagnosis`, none of which carry a `subtype:` discriminator. The curated union
  is kept in `kb/groupings/Castleman_Disease.yaml`.

  Evidence note: the stromal pathophysiology nodes here rest on human tissue
  association without any perturbation experiment, because no validated animal
  or cell-culture model of Castleman disease exists. That limitation is recorded
  as its own knowledge gap (gap_ucd_no_disease_model) and is why those nodes
  carry EMERGING hypothesis groups rather than being asserted as established
  mechanism.

  Ontology note: `MONDO:0019753` carries "unicentric Castleman disease" only as a
  RELATED synonym, with "localized Castleman disease" as EXACT, which is why
  `disease_term.label` reads "localized". Current clinical usage is "unicentric";
  a request to promote the synonym is tracked in the split issue.

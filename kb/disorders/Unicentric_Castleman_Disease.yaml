- name: Stromal VEGF Overproduction and Neovascularization
  description: >-
    In UCD, VEGFA is expressed by CXCL13+ follicular dendritic cells and the
    expression is confined to follicles - in contrast to the multicentric forms,
    where perivascular and T-zone reticular cells carry the highest expression
    and it extends into the interfollicular space. The resulting perifollicular
    neovascularization and penetrating vessels are the structural basis of the
    diagnostic "lollipop" follicle, and hypervascularization supports the stromal
    remodeling and nodal expansion that make the node enlarge.

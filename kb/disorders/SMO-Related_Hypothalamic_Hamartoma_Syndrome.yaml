      reference_title: "SMO / congenital hypothalamic hamartoma syndrome (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SMO | HGNC:11119 | congenital hypothalamic hamartoma syndrome | MONDO:0009436 | AR | Moderate | SOP10 | Syndromic Disorders Gene Curation Expert Panel | 2023-10-20T16:00:00.000Z"
      explanation: ClinGen classifies the SMO-congenital hypothalamic hamartoma syndrome relationship as Moderate (AR).
  evidence:
  - reference: PMID:30497210
    reference_title: "A familial syndrome of hypothalamic hamartomas, polydactyly, and SMO mutations: a clinical report of 2 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this is the first report in the literature describing a familial syndrome caused by germline mutations in the Smoothened (SMO) gene and the first familial syndrome associated with hypothalamic hamartomas other than Pallister-Hall syndrome."
    explanation: First familial germline-SMO hypothalamic hamartoma syndrome, distinct from GLI3 Pallister-Hall.
pathophysiology:
- name: Biallelic SMO Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic loss-of-function SMO variants leave absent or non-functional
    Smoothened, the obligatory transducer of Hedgehog signalling downstream of
    PTCH1 at the primary cilium.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  downstream:
  - target: Impaired Hedgehog Signal Transduction
    description: Loss of Smoothened blocks transduction of the Hedgehog signal.
  evidence:
  - reference: PMID:32413283
    reference_title: "Bi-allelic Variations of SMO in Humans Cause a Broad Spectrum of Developmental Anomalies Due to Abnormal Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report bi-allelic loss-of-function variations in SMO in seven individuals from five independent families"
    explanation: Biallelic SMO loss of function is the cause.
- name: Impaired Hedgehog Signal Transduction
  biological_scale: CELLULAR
  description: >-
    Patient cells show normal ciliogenesis but severely altered Hedgehog signal
    transduction, with Hh-independent accumulation of GLI2 at the ciliary tip,
    indicating that SMO loss disrupts ciliary trafficking and GLI processing.
    Reduced Hedgehog output during embryogenesis produces the malformation
    continuum.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  cell_types:
  - preferred_term: fibroblast (patient)
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Hypothalamic hamartoma
    description: Reduced Hedgehog patterning of the ventral diencephalon produces hypothalamic hamartoma.
  - target: Postaxial polydactyly
    description: Altered Hedgehog limb patterning produces postaxial polydactyly.
  - target: Atrioventricular septal defect
    description: Defective Hedgehog-dependent cardiac morphogenesis produces atrioventricular septal defect.
  - target: Hirschsprung disease
    description: Impaired Hedgehog-dependent enteric neural crest development produces aganglionosis.
  evidence:
  - reference: PMID:32413283
    reference_title: "Bi-allelic Variations of SMO in Humans Cause a Broad Spectrum of Developmental Anomalies Due to Abnormal Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells derived from affected individuals showed normal ciliogenesis but severely altered Hh-signal transduction as a result of either altered PC trafficking or abnormal activation of the pathway downstream of SMO."
    explanation: Patient cells show the Hedgehog-transduction defect with intact cilia.
  - reference: PMID:32413283
    reference_title: "Bi-allelic Variations of SMO in Humans Cause a Broad Spectrum of Developmental Anomalies Due to Abnormal Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Hh-independent GLI2 accumulation at the PC tip in cells from the affected individuals suggests a potential function of SMO in regulating basal ciliary trafficking of GLI2 when the pathway is off."
    explanation: SMO loss dysregulates ciliary GLI2 trafficking.

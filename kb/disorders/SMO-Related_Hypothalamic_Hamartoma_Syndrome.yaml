animal_models:
- name: Smo-null mouse
  species: Mouse
  genotype: Smo -/- (constitutive knockout)
  publication: PMID:11440720
  description: >-
    Constitutive Smo knockout; embryos fail to turn and arrest at somite stages
    with a small linear heart tube, open gut and cyclopia, demonstrating Smo's
    obligatory role in Hedgehog signalling and cardiac morphogenesis.
  modeled_mechanisms:
  - target: Impaired Hedgehog Signal Transduction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Confirms Smo as the obligatory Hedgehog transducer and reproduces the
      Hedgehog-loss developmental phenotype, including cardiac morphogenesis
      defects relevant to the human atrioventricular septal defect.
    limitations: >-
      The homozygous null is embryonic-lethal with cyclopia/holoprosencephaly, far
      more severe than the viable human recessive syndrome, so it does not
      reproduce the hypothalamic hamartoma; it models the Hedgehog-transduction
      mechanism rather than the human phenotype.
    evidence:
    - reference: PMID:11440720
      reference_title: "Smoothened mutants reveal redundant roles for Shh and Ihh signaling including regulation of L/R asymmetry by the mouse node."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we demonstrate an absolute requirement for Hedgehog signaling in sclerotomal development and a role in cardiac morphogenesis."
      explanation: Establishes Smo's obligatory role in Hedgehog signalling and cardiac morphogenesis.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Exome or genome sequencing with copy-number analysis (one reported allele was
    a 7q32.1 partial deletion; a synonymous splice variant required RNA studies).
    Brain MRI shows a non-enhancing tuber cinereum mass.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32413283
    reference_title: "Bi-allelic Variations of SMO in Humans Cause a Broad Spectrum of Developmental Anomalies Due to Abnormal Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Here, we report bi-allelic loss-of-function variations in SMO in seven individuals from five independent families"
    explanation: Molecular identification of biallelic SMO variants establishes the diagnosis.
treatments:
- name: Supportive and surgical care
  description: >-
    No disease-modifying therapy exists, and Hedgehog agonists are inapplicable
    because they require functional SMO. Management is symptomatic: antiseizure
    medication (gelastic seizures are often pharmacoresistant) and surgical
    treatment of the hamartoma (MR-guided laser interstitial thermal therapy,
    radiosurgery, or disconnection), plus repair of the atrioventricular septal
    defect and Hirschsprung disease and other organ-directed care.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30497210
    reference_title: "A familial syndrome of hypothalamic hamartomas, polydactyly, and SMO mutations: a clinical report of 2 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Hypothalamic hamartomas are benign tumors known to cause gelastic or dacrystic seizures, precocious puberty, developmental delay, and medically refractory epilepsy."
    explanation: The refractory epilepsy and malformations define the symptomatic/surgical management needs.

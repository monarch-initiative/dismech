genetic:
- name: SMO variants
  gene_term:
    preferred_term: SMO
    term:
      id: hgnc:11119
      label: SMO
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline loss-of-function SMO variants: frameshift, partial-gene
    deletion (7q32.1), missense (e.g. p.Arg400His), and an exon-skipping
    synonymous variant. The first familial germline SMO syndrome was reported by
    Rubino 2018 (compound heterozygous 2-bp deletion plus a 7q32.1 deletion).

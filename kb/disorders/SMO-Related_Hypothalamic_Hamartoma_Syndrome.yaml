name: SMO-Related Pallister-Hall-Like Syndrome
creation_date: "2026-11-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: congenital hypothalamic hamartoma syndrome
  term:
    id: MONDO:0009436
    label: congenital hypothalamic hamartoma syndrome
synonyms:
- Pallister-Hall-like syndrome
- PHLS
- hypothalamic hamartomas
description: >-
  A pleiotropic autosomal recessive developmental disorder caused by biallelic
  germline loss-of-function variants in SMO (Smoothened), the obligatory
  transducer of Hedgehog signalling at the primary cilium. Loss of SMO blocks
  Hedgehog signal transduction, producing a continuum of malformations:
  hypothalamic hamartoma (with gelastic or dacrystic seizures), microcephaly,
  atrioventricular septal defect, postaxial polydactyly, narrow chest and short
  long bones, and enteric aganglionosis (Hirschsprung disease). It is distinct
  from GLI3-related Pallister-Hall syndrome (autosomal dominant, a constitutive
  GLI3 repressor) and from the mosaic activating-SMO Curry-Jones syndrome
  (MONDO:1030005); the shared Hedgehog pathway is the common thread. A germline
  plus somatic (two-hit) SMO mechanism has also been found in sporadic
  hypothalamic hamartoma.
notes: >-
  Scope: biallelic germline SMO loss-of-function (Pallister-Hall-like syndrome,
  OMIM 241800). Kept distinct from GLI3 Pallister-Hall syndrome
  (MONDO:0007804, autosomal dominant) and from mosaic activating-SMO Curry-Jones
  syndrome (MONDO:1030005, ClinGen Definitive), which are separate concepts. The
  two-hit (one germline, one somatic) SMO mechanism reported in sporadic
  hypothalamic hamartoma shares the Hedgehog-transduction defect and is recorded
  as mechanism context, not as a separate entry.

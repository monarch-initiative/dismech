differential_diagnoses:
- name: Parkinson disease
  disease_term:
    preferred_term: Parkinson disease
    term:
      id: MONDO:0005180
      label: Parkinson disease
  description: >-
    ADSD can resemble idiopathic Parkinson disease clinically. A dominant
    pedigree, a truncating PDE8B variant, and the characteristic bilateral
    striatal MRI pattern support ADSD; rare tremor presentations mean that
    tremor alone cannot reliably distinguish the two.
  distinguishing_features:
  - Characteristic putamen and caudate signal abnormalities in ADSD
  - Heterozygous loss-of-function PDE8B variant segregating with disease
  - Familial dominant transmission rather than a typical sporadic presentation
  evidence:
  - reference: PMID:20085714
    reference_title: "Autosomal-dominant striatal degeneration is caused by a mutation in the phosphodiesterase 8B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These symptoms resemble idiopathic Parkinson disease, but tremor is not present."
    explanation: The original molecular report explicitly identifies idiopathic Parkinson disease as a clinical mimic.
  - reference: PMID:31726290
    reference_title: "Clinical findings of autosomal-dominant striatal degeneration and PDE8B mutation screening in parkinsonism and related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No causative PDE8B mutation was discovered in our cohort of PD or Parkinsonism patients."
    explanation: A large screening cohort argues against treating rare PDE8B ADSD as a common cause of Parkinson disease or parkinsonism.

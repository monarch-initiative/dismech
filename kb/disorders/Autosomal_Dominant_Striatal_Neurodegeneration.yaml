discussions:
- discussion_id: pde8b_to_selective_striatal_injury
  prompt: >-
    How does loss of PDE8B-mediated cAMP hydrolysis produce selective,
    progressive striatal injury?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PDE8B Cyclic Nucleotide Phosphodiesterase Loss
  - pathophysiology#Degeneration of the striatum
  rationale: >-
    Human genetics and enzyme activity establish PDE8B loss of function, and
    PDE8B expression plus its role in cAMP metabolism nominate altered dopamine
    signaling. Published patient evidence does not resolve the relevant
    striatal cell type, the direction and compartment of cyclic-nucleotide
    dysregulation in vivo, or the intervening injury pathway.
  evidence:
  - reference: PMID:20085714
    reference_title: "Autosomal-dominant striatal degeneration is caused by a mutation in the phosphodiesterase 8B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We believe that the functional analysis of PDE8B will help to further elucidate the pathomechanism of ADSD as well as contribute to a better understanding of movement disorders."
    explanation: The causal-gene report explicitly leaves the downstream disease mechanism for future functional analysis.
- discussion_id: adsd_phenotypic_boundaries
  prompt: >-
    Which manifestations belong to the reproducible PDE8B-ADSD spectrum rather
    than isolated case-level expansions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Parkinsonism
  - phenotypes#Ataxia
  - phenotypes#Tremor
  rationale: >-
    Core bradykinetic-rigid, dysarthric, and gait manifestations recur across
    families, whereas ataxia and tremor without parkinsonism are supported by
    individual reports. Larger genotype-first cohorts and standardized
    longitudinal imaging are needed before frequencies or prognostic claims
    can be assigned to these expanded features.
  evidence:
  - reference: PMID:31726290
    reference_title: "Clinical findings of autosomal-dominant striatal degeneration and PDE8B mutation screening in parkinsonism and related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, we described the typical ataxia phenotype in ADSD."
    explanation: The authors identify ataxia as a newly described case-level expansion.
  - reference: PMID:34022587
    reference_title: "Tremor without parkinsonism: A new phenotype of autosomal-dominant striatal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tremor without parkinsonism: A new phenotype of autosomal-dominant striatal degeneration."
    explanation: The report identifies tremor without parkinsonism as another phenotypic expansion.
notes: >-
  Evidence was re-audited through 2026-07-21. A fully paginated
  ClinicalTrials.gov search for the disease name or PDE8B returned no studies,
  and the corresponding NCBI GEO/DataSets search returned no disease-specific
  datasets. No disease-modifying therapy or validated disease-specific
  experimental model was identified. Symptomatic treatment evidence is limited
  to individual reports and is therefore not promoted to a general treatment
  recommendation here. Orphanet frequency labels derive from very small
  reported families and should be interpreted cautiously.

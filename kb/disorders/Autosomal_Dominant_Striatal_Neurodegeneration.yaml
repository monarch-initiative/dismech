name: Autosomal dominant striatal neurodegeneration
creation_date: "2026-05-11T21:02:17Z"
description: >-
  Autosomal dominant striatal neurodegeneration is an ultra-rare adult-onset
  movement disorder caused by heterozygous loss-of-function PDE8B variants.
  Reported families show a slowly progressive striatal movement disorder,
  usually with parkinsonism, bradykinesia, rigidity, dysarthria, and gait
  disturbance, together with characteristic signal abnormalities of the
  putamen and caudate. Ataxia, tremor without parkinsonism, and limb dystonia
  expand the phenotype in individual reports. The link from impaired PDE8B
  cyclic-nucleotide hydrolysis to selective striatal injury remains unresolved.

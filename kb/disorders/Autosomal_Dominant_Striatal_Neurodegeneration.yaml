pathophysiology:
- name: PDE8B Cyclic Nucleotide Phosphodiesterase Loss
  description: >-
    ADSN-associated heterozygous PDE8B frameshift or nonsense variants abolish
    or are predicted to abolish phosphodiesterase activity. PDE8B normally
    degrades cyclic AMP, a second messenger involved in dopamine signaling and
    movement control. Altered striatal cAMP/dopamine signaling is therefore a
    plausible bridge to disease, but it has not been demonstrated directly in
    patient-derived striatal neurons.

name: Short-rib thoracic dysplasia 21 without polydactyly
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- SRTD21
- KIAA0753-related skeletal ciliopathy
- MNR-related short-rib thoracic dysplasia
- Moonraker-related skeletal ciliopathy
description: >-
  Short-rib thoracic dysplasia 21 without polydactyly is the skeletal
  presentation of biallelic KIAA0753 variants. KIAA0753 - also called
  Moonraker and OFIP - is a centriolar and pericentriolar-satellite protein.
  It sits at the top of a recruitment cascade at the distal end of the
  centriole: Moonraker brings in OFD1, FOPNL and CEP90, which in turn place
  the distal appendage proteins that dock the basal body to the plasma
  membrane so a cilium can be built. Losing it therefore removes the cilium's
  foundation rather than its transport machinery, which distinguishes this
  disorder mechanistically from the intraflagellar-transport and dynein-2
  forms of short-rib thoracic dysplasia. Hedgehog signalling failure is a
  proposed contributor to the growth-plate lesion. Chondrocyte proliferation
  in the growth plate depends on cilium-transduced Hedgehog signals;
  Joubert-patient fibroblasts are deficient in primary cilia and show
  a blunted response to Hedgehog pathway stimulation, and the growth plate of
  an affected fetus had a disorganised proliferative zone with a broadened
  hypertrophic zone. Clinically this gives short ribs, a narrow thorax and
  short tubular bones, with respiratory insufficiency and pulmonary vascular
  complications contributing to severe outcomes. Two things make this entity
  awkward and both are recorded explicitly below. First, it is one of three
  phenotypes caused by the same gene: KIAA0753 also causes Joubert syndrome
  and orofaciodigital syndrome type 6, and the literature on the gene mixes
  all three. Second, the separation between them is not clean in individual
  patients - several people counted as skeletal cases also have the molar
  tooth sign, and the report of the eighth patient concluded that this gene
  shows how one locus can present as apparently distinct syndromes.

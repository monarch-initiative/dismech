treatments:
- name: Respiratory support and thoracic management
  description: >-
    No disease-modifying treatment exists. Management is supportive and is
    dominated by the thorax: ventilatory support for the restrictive
    insufficiency, nutritional support for the feeding difficulties, and
    orthopaedic follow-up for the limb and spinal consequences of the skeletal
    dysplasia. Thoracic expansion surgery is used in the short-rib dysplasias
    generally; no KIAA0753 patient has been reported to have undergone it, so
    it is not curated here as a treatment for this disorder.
  notes: >-
    The generic Supportive Care binding summarizes the respiratory and feeding
    difficulties documented in the skeletal case. Detailed airway and feeding
    interventions described in Joubert-only patients cannot establish treatment
    of thoracic restriction in SRTD21. This evidence does not establish the
    absence of such interventions in other skeletal patients.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  evidence:
  - reference: PMID:31816441
    reference_title: A new case of KIAA0753-related variant of Jeune asphyxiating thoracic dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This 4 year-old boy with narrow thorax, short limbs, severe respiratory and feeding difficulties from birth on had a history of hypotonia and developmental delay.
    explanation: >-
      Establishes the respiratory and feeding problems that supportive
      management addresses.
diagnosis:
- name: Skeletal survey
  description: >-
    Radiographs establish the diagnosis within the short-rib group: short broad
    ribs with cupped anterior ends, short tubular bones with metaphyseal
    irregularity and cone-shaped epiphyses, and a trident pelvis. Absence of
    polydactyly is part of the description of this entity.
  results: >-
    Narrow thorax with short ribs, short tubular bones, metaphyseal irregularity
    and cone-shaped epiphyses, trident pelvis.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skeletal survey showed severe metaphyseal dysplasia and cone-shaped epiphyses of the proximal tibia and distal femur embedded in cup-shaped metaphyses (Fig. 2a–c).
    explanation: >-
      Documents the radiographic route to the diagnosis.
- name: Prenatal ultrasound
  description: >-
    In the affected fetus of the discovery series the diagnosis was suspected
    prenatally: fetal ultrasound at 19 weeks showed the whole picture at once -
    short limbs, a narrow chest, a prominent abdomen, cerebral ventriculomegaly
    and a suspected cerebellar vermis defect. Both the skeletal and the CNS
    branches of this disorder are visible before birth.
  results: >-
    Short limbs with a narrow chest, prominent abdomen, cerebral
    ventriculomegaly and suspected cerebellar vermis defect.
  diagnosis_term:
    preferred_term: fetal ultrasound imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal ultrasound at 19 weeks gestation showed short limbs, narrow chest, prominent abdomen, cerebral ventriculomegaly, suspected defect in the cerebellar vermis and mild pelviectasis.
    explanation: >-
      The prenatal findings in the one fetus in whom they were recorded.
- name: Brain MRI
  description: >-
    Brain imaging is not optional in a patient with this skeletal phenotype. Two
    of the four patients of the discovery series had the molar tooth sign, and
    the reported findings also include corpus callosum hypoplasia,
    ventriculomegaly and a small pituitary gland - the last of which matters
    because growth hormone deficiency is documented in the Joubert presentation
    of this same gene.
  results: >-
    Inferior vermis dysplasia with the molar tooth sign, corpus callosum
    hypoplasia, ventricular dilatation and a small pituitary gland.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) showed hypoplasia of the corpus callosum, small pituitary gland, inferior vermis dysplasia, “molar tooth” sign (MTS) and mildly dilated third ventricle (Supplementary Fig. S1).
    explanation: >-
      The brain MRI findings that make imaging part of the assessment.
- name: KIAA0753 sequencing with transcript analysis
  description: >-
    Exome or genome sequencing on a skeletal-dysplasia or ciliopathy panel.
    Transcript analysis matters more than usual here: a synonymous KIAA0753
    variant that in silico tools did not flag turned out to activate abnormal
    splicing, and was only resolved by sequencing cDNA. A negative panel result
    on a patient with this phenotype is therefore worth reanalysing.
  results: Biallelic KIAA0753 variants, with cDNA confirmation for splice-altering alleles.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33875766
    reference_title: High diagnostic yield in skeletal ciliopathies using massively parallel genome sequencing, structural variant screening and RNA analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four variants located in non-canonical splice sites of DYNC2H1, EVC, and KIAA0753 led to aberrant splicing that was shown by sequencing of cDNA.
    explanation: >-
      Establishes cDNA sequencing as the step that resolved the splice-altering
      alleles, including in KIAA0753.
  - reference: PMID:34016807
    reference_title: "KIAA0753-related skeletal ciliopathy: a ninth case, extending the phenotype and reporting a novel variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing, aged eight, via skeletal dysplasia panel analysis and subsequent whole-genome sequencing (via the 100,000 genomes project) found no cause. WGS data reanalysis using exomiser uncovered compound heterozygous pathogenic KIAA0753 variants (frameshift and splice site).
    explanation: >-
      A worked example of the diagnosis being missed by first-pass panel and
      genome analysis and found only on reanalysis.
differential_diagnoses:
- name: Joubert syndrome
  description: >-
    The same gene causes Joubert syndrome, and the boundary is soft: two of the
    four patients in the skeletal discovery series had brain abnormalities
    consistent with Joubert syndrome. The distinction as used in the literature
    is which system dominates - a molar tooth sign with hypotonia,
    developmental delay and abnormal eye movements and no significant skeletal
    disease is called Joubert syndrome; short ribs with a narrow thorax is
    called this disorder, whether or not a molar tooth sign is also present.
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  distinguishing_features:
  - Cerebellar and brainstem malformation dominates rather than skeletal disease
  - No short ribs or thoracic constriction
  - Growth hormone deficiency reported in the KIAA0753 Joubert siblings
  evidence:
  - reference: PMID:28220259
    reference_title: Mutations in KIAA0753 cause Joubert syndrome associated with growth hormone deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present 2 siblings with Joubert syndrome associated with growth hormone deficiency. Whole exome sequencing of the family identified compound heterozygous mutations in KIAA0753, i.e., a missense mutation (p.Arg257Gly) and an intronic mutation (c.2359-1G>C).
    explanation: >-
      Establishes the Joubert presentation of the same gene, in siblings without
      a skeletal ciliopathy label.
- name: Orofaciodigital syndrome type 6
  description: >-
    The third KIAA0753 phenotype. It is defined by oral, facial and digital
    anomalies - hypertelorism, cleft palate, tongue lobulation, digital
    abnormalities - and the index KIAA0753 patient also had a molar tooth sign.
    Note that the dismech entry Orofaciodigital_Syndrome_17 is a different
    disorder, caused by INTU; it names KIAA0753 only inside a quoted list of
    genes from the paper that identified both.
  disease_term:
    preferred_term: orofaciodigital syndrome type 6
    term:
      id: MONDO:0010176
      label: orofaciodigital syndrome type 6
  distinguishing_features:
  - Oral, facial and digital anomalies rather than short ribs
  - No thoracic constriction or respiratory insufficiency
  evidence:
  - reference: PMID:26643951
    reference_title: OFIP/KIAA0753 forms a complex with OFD1 and FOR20 at pericentriolar satellites and centrosomes and is mutated in one individual with oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here causal compound heterozygous mutations of KIAA0753/OFIP in a patient with an OFD VI syndrome.
    explanation: >-
      Establishes the orofaciodigital presentation of the same gene.
- name: Jeune asphyxiating thoracic dystrophy
  description: >-
    The clinical group this disorder sits inside, and the label under which
    several KIAA0753 patients were reported. The other genetically defined
    forms are intraflagellar-transport and dynein-2 defects; this one is a basal
    body docking defect, which is the mechanistic reason it is curated
    separately rather than as a subtype.
  disease_term:
    preferred_term: Jeune syndrome
    term:
      id: MONDO:0018770
      label: Jeune syndrome
  distinguishing_features:
  - Caused by IFT or dynein-2 components rather than a centriolar docking protein
  - Polydactyly occurs in several of the IFT-related forms
  evidence:
  - reference: PMID:31816441
    reference_title: A new case of KIAA0753-related variant of Jeune asphyxiating thoracic dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in at least 23 genes are likely to correspond to this clinical presentation: IFT43/52/80/81/122/140/172, WDR19/34/35/60, DYNC2H1, DYNC2LI1, CEP120, NEK1, TTC21B, TCTEX1D2, INTU, TCTN3, EVC 1/2 and KIAA0586.
    explanation: >-
      Lists the genes of the clinical group, which are dominated by
      intraflagellar-transport and dynein-2 components and do not include
      KIAA0753.
animal_models:
- name: kiaa0753 nonsense zebrafish
  species: Zebrafish
  genotype: kiaa0753 homozygous nonsense
  publication: PMID:29138412
  description: >-
    Zebrafish embryos homozygous for a nonsense variant in kiaa0753, made
    alongside the human skeletal cases to test whether the gene is needed for
    skeletal development. It is the only animal model in which a skeletal
    readout was taken; the Mnr-null mouse below dies too early in gestation for
    the skeleton to be assessed.
  modeled_mechanisms:
  - target: Growth Plate Zonal Disorganisation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The embryos have abnormal cartilage patterning and abnormal head
      morphology, establishing that the gene is required for cartilage
      development.
    limitations: >-
      Zebrafish cartilage patterning is not a growth plate. The fish have no
      endochondral growth plate of the mammalian kind, so the model cannot
      address the proliferative and hypertrophic zone abnormality that is the
      human lesion, and it cannot model a narrow thorax at all. Lethality at
      early developmental stages further limits what can be asked of it. The
      model establishes gene requirement, not disease mechanism.
    readouts:
    - name: Craniofacial cartilage patterning
      target: Growth Plate Zonal Disorganisation
      direction: ALTERED
      interpretation: >-
        Cartilage development requires the gene, which is the claim this model
        supports.
      evidence:
      - reference: PMID:29138412
        reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Zebrafish knockout model with homozygous nonsense variants in the kiaa0753 gene show classic ciliopathy phenotype with cartilage abnormalities and curved body seen in other ciliopathy models15 and abnormal head morphology due to altered cartilage patterning and lethality at early developmental stages.
        explanation: >-
          The cartilage and morphology measurements in the model, together with
          the early lethality that bounds its usefulness.
    evidence:
    - reference: PMID:29138412
      reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The importance of KIAA0753 for normal skeletal development is further confirmed by our findings that zebrafish embryos homozygous for a nonsense mutation in kiaa0753 display altered cartilage patterning.
      explanation: >-
        The authors' own statement of what the model establishes, which is gene
        requirement for skeletal development.
- name: Mnr-null mouse (Kiaa0753 knockout)
  species: Mouse
  genotype: Mnr (Kiaa0753) homozygous null, IMPC-derived allele
  publication: PMID:34241634
  description: >-
    A mouse null for Mnr, the mouse orthologue of KIAA0753, obtained from the
    International Mouse Phenotyping Consortium and characterised alongside a
    Cep90-null mouse as part of the work that defined the distal centriole
    complex. Embryos have no cilia in the E9.5 neural tube, and fibroblasts
    derived from them make no cilia and cannot induce Hedgehog target genes.
  modeled_mechanisms:
  - target: Defective Basal Body Docking and Ciliogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of Mnr abolishes ciliogenesis in vivo and in embryo-derived
      fibroblasts, which is the same lesion patient fibroblasts show.
    limitations: >-
      The mouse is a complete null, whereas patients carry truncating and
      splice-altering alleles some of which retain partial function, and the
      mouse phenotype is correspondingly more severe: cilia are absent rather
      than reduced in number. Embryos were characterised at E8.5 to E9.5, before
      the skeleton forms, so this model has not been used to ask any skeletal
      question.
    readouts:
    - name: Cilia in the E9.5 neural tube
      target: Defective Basal Body Docking and Ciliogenesis
      direction: ABOLISHED
      interpretation: >-
        Ciliogenesis fails in vivo when the gene is absent.
      evidence:
      - reference: PMID:34241634
        reference_title: A ciliopathy complex builds distal appendages to initiate ciliogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Similarly, cilia detected by ARL13B staining were absent in neural tube sections from E9.5 Mnr−/− embryos (Fig. 4 f).
        explanation: >-
          The in vivo ciliation measurement in the model.
    evidence:
    - reference: PMID:34241634
      reference_title: A ciliopathy complex builds distal appendages to initiate ciliogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cells and mice lacking CEP90 or MNR do not generate cilia, fail to assemble distal appendages, and do not transduce Hedgehog signals.
      explanation: >-
        States the model phenotype, including the distal appendage failure that
        is the specific mechanism this node asserts.
  - target: Impaired Hedgehog Signal Transduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Fibroblasts from Mnr-null embryos fail to induce the Hedgehog target genes
      Gli1 and Ptch1 in response to a Smoothened agonist.
    limitations: >-
      The response is abrogated in the mouse null, whereas in patient
      fibroblasts it is blunted rather than absent, so the model exaggerates the
      severity of the signalling defect. The measurement is in embryonic
      fibroblasts, not in growth-plate chondrocytes.
    readouts:
    - name: SAG-induced Gli1 and Ptch1 expression in embryo-derived fibroblasts
      target: Impaired Hedgehog Signal Transduction
      direction: DECREASED
      interpretation: >-
        Direct transcriptional readout of Hedgehog pathway output in the model.
      evidence:
      - reference: PMID:34241634
        reference_title: A ciliopathy complex builds distal appendages to initiate ciliogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, qRT-PCR analysis confirmed that induction of the Hedgehog target genes Gli1 and Ptch1 in response to the Hedgehog pathway activator Smoothened agonist (SAG) was abrogated in Cep90−/− or Mnr−/− MEFs (Fig. 4, i and l).
        explanation: >-
          The Hedgehog target-gene measurement in Mnr-null fibroblasts.
    evidence:
    - reference: PMID:34241634
      reference_title: A ciliopathy complex builds distal appendages to initiate ciliogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, CEP90 and MNR are both required for vertebrate development, ciliogenesis, and Hedgehog signaling.
      explanation: >-
        The authors' summary of what the mouse establishes.
experimental_models:
- name: KIAA0753 patient fibroblasts and knockout cell lines
  description: >-
    Dermal fibroblasts from Joubert-presenting patient 1 of the Inskeep series,
    mouse NIH3T3 knockout and variant-rescue cells, and human RPE1 cells used in
    studies of the centriolar complex. These systems establish ciliation,
    SHH/WNT response and protein-recruitment defects; none directly measures the
    growth plate of a skeletal patient.
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Joubert-patient dermal fibroblasts, mouse NIH3T3 cells and human RPE1 cells
  culture_system: Two-dimensional culture with serum starvation to induce ciliogenesis, plus siRNA or knockout depletion and variant reconstitution
  publication: PMID:34523780
  modeled_mechanisms:
  - target: Defective Basal Body Docking and Ciliogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient fibroblasts carry the actual disease genotypes and show the
      ciliation deficit directly; depleting any member of the ternary complex in
      RPE1 cells reproduces the recruitment failure.
    limitations: >-
      Fibroblasts are not chondrocytes. The cell type in which the disease
      manifests is the growth-plate chondrocyte, and no chondrocyte or cartilage
      model of this genotype has been reported, so the ciliation and signalling
      measurements are made in a proxy tissue. In the Inskeep series the
      fibroblast donor had a Joubert presentation; the ablation/rescue experiments
      used mouse NIH3T3 cells.
    readouts:
    - name: Proportion of ciliated cells after serum starvation
      target: Defective Basal Body Docking and Ciliogenesis
      direction: DECREASED
      interpretation: >-
        Direct measurement of the ciliogenesis defect in cells carrying patient
        genotypes.
      evidence:
      - reference: PMID:34523780
        reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Correspondingly, KIAA0753 patient fibroblasts have a deficit in primary ciliation and improper SHH and WNT signaling, with a particularly blunted response to SHH pathway stimulation.
        explanation: >-
          The ciliation measurement in patient cells.
    evidence:
    - reference: PMID:26643951
      reference_title: OFIP/KIAA0753 forms a complex with OFD1 and FOR20 at pericentriolar satellites and centrosomes and is mutated in one individual with oral-facial-digital syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The decreased expression of any component of this ternary complex in RPE1 cells causes a defective recruitment onto centrosomes and satellites.
      explanation: >-
        Establishes that the recruitment failure is a property of the complex,
        reproducible by depleting any member.
  - target: Impaired Hedgehog Signal Transduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hedgehog pathway output is measured directly in patient fibroblasts and in
      KIAA0753-ablated cells.
    limitations: >-
      Hedgehog signalling in fibroblasts is a surrogate for Hedgehog signalling in
      the growth plate, where the ligand source, the receiving cell type and the
      transcriptional output all differ. The blunting is quantitative rather than
      absolute, and nothing links the size of the in vitro defect to skeletal
      severity in the corresponding patient. In the Inskeep series the fibroblast
      donor had a Joubert presentation; the ablation/rescue experiments used mouse
      NIH3T3 cells.
    readouts:
    - name: Hedgehog pathway response to stimulation
      target: Impaired Hedgehog Signal Transduction
      direction: DECREASED
      interpretation: >-
        The signalling step that connects the ciliary lesion to the skeletal
        phenotype.
      evidence:
      - reference: PMID:34523780
        reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Ablation of KIAA0753 in vitro blocks primary ciliogenesis and SHH pathway activity.
        explanation: >-
          The Hedgehog output measurement on gene ablation.
    evidence:
    - reference: PMID:34523780
      reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our work expands the phenotypic spectrum of KIAA0753 ciliopathies and demonstrates the utility of patient-focused functional assays for proving causality of genetic variants.
      explanation: >-
        States the purpose the system was used for, which is establishing causality
        of individual patient variants.
discussions:
- discussion_id: gap_srtd21_which_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether biallelic KIAA0753 variants produce a short-rib
    skeletal ciliopathy, Joubert syndrome, or orofaciodigital syndrome type 6,
    given that all three arise from the same class of truncating allele and that
    individual patients carry features of more than one?
  attaches_to:
  - genetic#KIAA0753
  - pathophysiology#Defective Basal Body Docking and Ciliogenesis
  - pathophysiology#Cerebellar and CNS Involvement
  rationale: >-
    The three labels were assigned by which organ system dominated in the first
    patients described under each, not by an allele-level or mechanistic
    distinction. Truncating variants appear in all three groups. Two of the four
    patients in the skeletal discovery series had the molar tooth sign, which is
    the defining feature of the second label; the report of the eighth patient
    said outright that this gene shows how one locus presents as apparently
    distinct syndromes. Variant-level functional testing has been done, and it
    finds that every patient allele tested is deficient in supporting
    ciliogenesis - which explains why they all cause disease but not why they
    cause different diseases. With thirteen reported individuals across all
    three phenotypes there is no prospect of a genotype-phenotype analysis
    powered to settle it. The practical consequence for this knowledge base is
    that a citation about this gene must be checked for which presentation it
    describes.
  evidence:
  - reference: PMID:31816441
    reference_title: A new case of KIAA0753-related variant of Jeune asphyxiating thoracic dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case provides confirmation of an additional molecular basis for skeletal dysplasia and illustrates how ciliopathies due to mutations in a single gene may present as apparently distinct syndromes.
    explanation: >-
      States the problem the gap describes.
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum associated with biallelic pathogenic variants in KIAA0753 is broad and not well-characterized.
    explanation: >-
      The authors' own assessment that the spectrum is not characterised.
- discussion_id: gap_srtd21_chondrocyte_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Hedgehog signalling defect measured in KIAA0753 patient fibroblasts
    represent what happens in the growth-plate chondrocyte, the cell in which
    the disease actually manifests?
  attaches_to:
  - pathophysiology#Impaired Hedgehog Signal Transduction
  - pathophysiology#Growth Plate Zonal Disorganisation
  rationale: >-
    Every functional measurement for this disorder was made in fibroblasts or in
    immortalised human cell lines. The disease is a chondrodysplasia, and the
    one direct observation in the affected tissue - the disorganised
    proliferative zone and broadened hypertrophic zone in a single fetus - is
    histology, not a signalling measurement. The gap is not that the fibroblast
    result is unreliable; it is that Hedgehog signalling in the growth plate has
    a different ligand source, a different receiving cell and a different
    transcriptional output, and no chondrocyte or cartilage model carrying a
    KIAA0753 genotype has been reported. Neither animal model closes the gap.
    The zebrafish shows altered cartilage patterning in an animal with no
    mammalian endochondral growth plate, and dies early. The Mnr-null mouse does
    have the mammalian skeleton, and it does show the Hedgehog defect directly -
    but it was characterised at E8.5 to E9.5, before the skeleton forms, and
    that measurement was again made in fibroblasts. Until a chondrocyte model
    exists, or the mouse is taken to a skeletal timepoint, the step from
    measured signalling defect to observed growth plate lesion is an inference.
    The Inskeep signaling experiments used fibroblasts from Joubert-presenting
    patient 1, not the skeletal-presenting patient 3, adding a presentation
    mismatch to the tissue mismatch.
  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Correspondingly, KIAA0753 patient fibroblasts have a deficit in primary ciliation and improper SHH and WNT signaling, with a particularly blunted response to SHH pathway stimulation.
    explanation: >-
      Names the cell type in which the signalling defect was actually measured.
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that KIAA0753 is expressed in normal fetal human growth plate and show that the affected fetus, with a compound heterozygous frameshift and a nonsense mutation in KIAA0753, has an abnormal proliferative zone and a broad hypertrophic zone.
    explanation: >-
      The single direct observation in the affected tissue, which is
      histological rather than functional.
- discussion_id: srtd21_slc13a5_confounded_findings
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the developmental impairment in discovery-series P1 and P2 is
    due to KIAA0753 versus their additional SLC13A5 diagnosis?
  attaches_to:
  - phenotypes#Global developmental delay
  - phenotypes#Delayed speech and language development
  - phenotypes#Delayed gross motor development
  rationale: >-
    Both cousins carry homozygous SLC13A5 p.Thr142Met as well as KIAA0753
    variants. The authors assign their seizures and teeth hypoplasia to SLC13A5,
    so neither is curated here as a KIAA0753 phenotype. Developmental and speech
    delay remain associated with the skeletal presentation through independent
    patients, but the cousins cannot establish a KIAA0753-specific frequency or
    severity.
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thus conclude that the seizures and teeth hypoplasia in P1 and P2 are due to the homozygous SLC13A5 variant, while the developmental and speech delay is an overlapping feature and could be inferable to either one of the congenital conditions.
    explanation: >-
      Explicit attribution of dental hypoplasia and seizures to the second
      diagnosis, with developmental attribution unresolved.
- discussion_id: srtd21_unresolved_clinical_routes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which mechanisms explain the remaining craniofacial, neurologic, sensory,
    genital and associated skeletal findings in the KIAA0753 skeletal
    presentation?
  attaches_to:
  - phenotypes#Trident pelvis
  - phenotypes#Feeding difficulties
  - phenotypes#Global developmental delay
  - phenotypes#Hypotonia
  - phenotypes#Molar tooth sign on MRI
  - phenotypes#Delayed speech and language development
  - phenotypes#Delayed gross motor development
  - phenotypes#Flexion contracture
  - phenotypes#Protuberant abdomen
  - phenotypes#Hypoplasia of the corpus callosum
  - phenotypes#Ventriculomegaly
  - phenotypes#Small pituitary gland
  - phenotypes#Macrocephaly
  - phenotypes#Frontal bossing
  - phenotypes#Flat face
  - phenotypes#Depressed nasal bridge
  - phenotypes#Pectus carinatum
  - phenotypes#Pectus excavatum
  - phenotypes#Cervical spinal canal stenosis
  - phenotypes#Hepatomegaly
  - phenotypes#Pulmonary hypertension
  - phenotypes#Low-set ears
  - phenotypes#Anteverted nares
  - phenotypes#Micrognathia
  - phenotypes#Wide nasal bridge
  - phenotypes#Long philtrum
  - phenotypes#Ankyloglossia
  - phenotypes#Micropenis
  - phenotypes#Hypospadias
  - phenotypes#Cryptorchidism
  - phenotypes#Cone-rod dystrophy
  - phenotypes#Nystagmus
  - phenotypes#Conductive hearing impairment
  - phenotypes#Leg-length discrepancy
  - phenotypes#Developmental regression
  - phenotypes#Respiratory ciliary dyskinesia
  rationale: >-
    Case reports establish these findings but do not resolve feature-specific
    causal routes. The broad CNS node and the mouse granule-neuron study do not
    explain every brain-imaging, developmental or sensory finding. In
    particular, motor and speech findings in two cousins are confounded by
    SLC13A5, while regression, hearing loss and motile-cilia dyskinesia come
    from a later single case. Thoracic restriction does not by itself establish
    the cause of feeding difficulty, pulmonary hypertension, hepatomegaly,
    pectus deformity or abdominal prominence. These are clinical gaps, not
    laboratory readouts; occurrence alone does not justify a causal arrow.
  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum associated with biallelic pathogenic variants in KIAA0753 is broad and not well-characterized.
    explanation: >-
      The clinical spectrum and its mechanistic subdivision remain incompletely
      characterized.
  - reference: PMID:34016807
    reference_title: "KIAA0753-related skeletal ciliopathy: a ninth case, extending the phenotype and reporting a novel variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case is the eldest woman reported to date (aged ten years) and the only known case to report associated hearing loss, leg-length discrepancy, pectus carinatum, respiratory ciliary dyskinesia and late-onset (9 years old) neuro-degenerative regression.
    explanation: >-
      The later skeletal case adds uncommon multisystem findings without
      identifying their individual mechanisms.

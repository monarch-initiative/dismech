genetic:
- name: KIAA0753
  association: Causal biallelic variant
  gene_term:
    preferred_term: KIAA0753
    term:
      id: hgnc:29110
      label: KIAA0753
  notes: >-
    The same gene causes three named disorders: this skeletal ciliopathy,
    Joubert syndrome, and orofaciodigital syndrome type 6. The split is by
    clinical label rather than by allele - truncating variants appear across all
    three - and individual patients carry features of more than one, so the
    labels describe where a patient sits on a continuum rather than three
    separable diseases. Any citation about this gene must be checked for which
    presentation it describes before it is used.
  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, there have been 8 patients with biallelic pathogenic variants in KIAA0753 reported in the literature(5–8): two are described as having JS, one with OFD, and six with SRPS (Table 1).
    explanation: >-
      The breakdown of reported patients by clinical label, which is the
      three-phenotype split this note describes.
  - reference: PMID:31816441
    reference_title: A new case of KIAA0753-related variant of Jeune asphyxiating thoracic dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case provides confirmation of an additional molecular basis for skeletal dysplasia and illustrates how ciliopathies due to mutations in a single gene may present as apparently distinct syndromes.
    explanation: >-
      The authors' statement that the three labels are apparent rather than
      separable entities.

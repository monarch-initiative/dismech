notes: >-
  Lump/split decision. Curated as a standalone Disease rather than as a
  has_subtypes entry on Jeune_Asphyxiating_Thoracic_Dystrophy, on two grounds.
  The mechanism differs from every subtype currently listed there: those are
  intraflagellar-transport, dynein-2 and Hedgehog-kinase defects, whereas
  KIAA0753 loss removes the recruitment platform that docks the basal body
  before any transport question arises. And the KB already curates
  Short-Rib_Thoracic_Dysplasia_6_With_Or_Without_Polydactyly as a standalone
  entry on the same reasoning, that the per-gene SRTD numbering identifies a
  single disease. The counter-argument is real and is recorded rather than
  hidden: MONDO places MONDO:0030356 under Jeune syndrome, and the reported
  patients overlap Joubert syndrome clinically. Same-gene separation. KIAA0753
  causes three named disorders and the KB already holds two of them -
  Joubert_syndrome carries it as a causal gene, and
  Orofaciodigital_Syndrome_17 mentions it only inside a quoted gene list from
  the paper that identified INTU. Clinical findings are restricted to skeletal
  presentations. PMID:28220259 supports the Joubert differential;
  PMID:26643951 supports OFIP cell biology and the OFD differential. The
  Inskeep fibroblast experiments and mouse neuronal studies inform gene
  function with explicit presentation and tissue limitations. Evidence-source
  convention: patient clinical, radiographic and genetic findings, and the
  fetal growth-plate histology, are graded HUMAN_CLINICAL; cell-line and
  patient-fibroblast work IN_VITRO; zebrafish and mouse MODEL_ORGANISM.
  Phenotype review: dental hypoplasia is excluded because the discovery paper
  assigns it to coexisting SLC13A5 disease; no independent dental-hypoplasia
  observation was identified in the subsequent skeletal reports reviewed.
  Clinical observations are kept separate from Joubert-only and OFD-only
  cases. Pulmonary hypertension retains the source wording in preferred_term;
  HP:0002092 has a broader pulmonary-hypertension definition despite its
  arterial label.

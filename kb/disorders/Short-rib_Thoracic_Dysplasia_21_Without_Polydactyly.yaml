  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Correspondingly, KIAA0753 patient fibroblasts have a deficit in primary ciliation and improper SHH and WNT signaling, with a particularly blunted response to SHH pathway stimulation.
    explanation: >-
      Measures both signalling defects in cells carrying patient genotypes, and
      records that the Hedgehog response is the more severely affected.
  downstream:
  - target: Growth Plate Zonal Disorganisation
    description: >-
      Hedgehog signalling controls chondrocyte proliferation and the timing of
      hypertrophy in the growth plate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29138412
      reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We demonstrate that KIAA0753 is expressed in normal fetal human growth plate and show that the affected fetus, with a compound heterozygous frameshift and a nonsense mutation in KIAA0753, has an abnormal proliferative zone and a broad hypertrophic zone.
      explanation: >-
        Establishes both that the gene is expressed where the lesion appears and
        what the lesion looks like. The intervening steps between the signalling
        defect and the histology were not measured in the same tissue, which is
        why this edge is indirect with unknown intermediates.
- name: Growth Plate Zonal Disorganisation
  biological_scale: TISSUE
  description: >-
    The distal femoral growth plate of the affected fetus had disorganized
    proliferative columns and a broad hypertrophic zone, with absent KIAA0753
    staining in proliferative chondrocytes. The authors infer that impaired
    ciliary and centrosomal function disrupts growth-plate organization and
    causes abnormal skeletal growth. The contribution of Hedgehog signaling is
    inferred from other tissues and experimental systems.
  cell_types:

      The majority of reported KIAA0753 variants predict premature truncation of the KIAA0753 protein.
    explanation: >-
      Describes the predominant allele class across reported patients.
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report biallelic pathogenic variants in KIAA0753 in four patients with short-rib type skeletal dysplasia.
    explanation: >-

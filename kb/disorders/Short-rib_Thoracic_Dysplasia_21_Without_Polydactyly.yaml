    snippet: >-
      We demonstrate that KIAA0753 is expressed in normal fetal human growth plate and show that the affected fetus, with a compound heterozygous frameshift and a nonsense mutation in KIAA0753, has an abnormal proliferative zone and a broad hypertrophic zone.
    explanation: >-
      The direct histological observation this node records, in human tissue.
  downstream:
  - target: Short Ribs and Thoracic Constriction
    description: >-
      Disordered endochondral growth shortens the ribs and the tubular bones.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

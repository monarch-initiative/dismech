  description: >-
    Biallelic KIAA0753 variants, homozygous in consanguineous families and
    compound heterozygous elsewhere. Most reported alleles predict premature
    truncation, but splice-altering and missense alleles occur, including a
    synonymous change that creates a cryptic splice site.
  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of reported KIAA0753 variants predict premature truncation of the KIAA0753 protein.
    explanation: >-
      Describes the predominant allele class across reported patients.
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report biallelic pathogenic variants in KIAA0753 in four patients with short-rib type skeletal dysplasia.
    explanation: >-
      Establishes the biallelic requirement in the skeletal cases.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. A 2021 skeletal-ciliopathy cohort counted 13
    individuals reported with pathogenic KIAA0753 variants in total, across all
    three phenotypes the gene causes, not the skeletal presentation alone.
  evidence:
  - reference: PMID:33875766
    reference_title: High diagnostic yield in skeletal ciliopathies using massively parallel genome sequencing, structural variant screening and RNA analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, there are 13 individuals reported with pathogenic variants in KIAA0753, out of them two pregnancies were terminated, three patients died before three months of age, one patient deceased at seven years of age, and seven patients are to our knowledge alive
    explanation: >-
      The total reported case count and its outcome breakdown, standing in for a
      population estimate that has never been made.
progression:
- phase: Perinatal lethal end of the range
  notes: >-
    The 2021 count pools all KIAA0753 presentations rather than SRTD21 alone.
    Skeletal cases include respiratory failure after infection at seven years
    and neonatal death from severe pulmonary hypertension with pulmonary
    hypoplasia; a single exclusive route to death is not established.
  evidence:
  - reference: PMID:33875766
    reference_title: High diagnostic yield in skeletal ciliopathies using massively parallel genome sequencing, structural variant screening and RNA analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, there are 13 individuals reported with pathogenic variants in KIAA0753, out of them two pregnancies were terminated, three patients died before three months of age, one patient deceased at seven years of age, and seven patients are to our knowledge alive
    explanation: >-
      Quantifies the early-lethal fraction of reported cases.
- phase: Surviving childhood
  notes: >-
    Survivors have moderate skeletal dysplasia with disproportionate short
    stature, narrow thorax and metaphyseal change, alongside developmental delay
    and hypotonia. The oldest reported patient at the time of her report was ten
    years old and had accumulated cone-rod dystrophy, conductive hearing loss and
    a late neurodegenerative regression, so the phenotype is not static in
    survivors.
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The manifestations in our patients are variable and ranging from fetal lethal to viable and moderate skeletal dysplasia with narrow thorax and abnormal metaphyses.
    explanation: >-
      States the range from lethal to moderate viable disease.
  - reference: PMID:34016807
    reference_title: "KIAA0753-related skeletal ciliopathy: a ninth case, extending the phenotype and reporting a novel variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case is the eldest woman reported to date (aged ten years) and the only known case to report associated hearing loss, leg-length discrepancy, pectus carinatum, respiratory ciliary dyskinesia and late-onset (9 years old) neuro-degenerative regression.
    explanation: >-
      Documents the accumulating features in the oldest reported survivor, and
      is careful to note they are so far unique to that case.
pathophysiology:
- name: Biallelic KIAA0753 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift and splice-altering variants on both KIAA0753 alleles.
    Truncating alleles predominate. Splice-altering alleles are easy to miss:
    two Pakistani families sharing an 85 kb homozygous block carried a
    synonymous c.810C>T change that turned out to activate abnormal splicing,
    which was only demonstrated by sequencing cDNA.
  genes:
  - preferred_term: KIAA0753
    term:
      id: hgnc:29110
      label: KIAA0753
  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of reported KIAA0753 variants predict premature truncation of the KIAA0753 protein.
    explanation: >-
      Establishes the predominant class of disease allele.
  - reference: PMID:33875766
    reference_title: High diagnostic yield in skeletal ciliopathies using massively parallel genome sequencing, structural variant screening and RNA analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four variants located in non-canonical splice sites of DYNC2H1, EVC, and KIAA0753 led to aberrant splicing that was shown by sequencing of cDNA.
    explanation: >-
      Documents splice-altering KIAA0753 alleles confirmed at the transcript
      level.
  downstream:
  - target: Defective Basal Body Docking and Ciliogenesis
    description: >-
      Loss of the protein removes the recruitment platform at the distal
      centriole on which cilium assembly depends.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34523780
      reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We report in vitro results assessing the function of each variant indicating that mutant proteins are not fully competent to promote primary ciliogenesis.
      explanation: >-
        Tests the patient alleles themselves and shows each is deficient in
        supporting ciliogenesis.
- name: Defective Basal Body Docking and Ciliogenesis
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_scale: CELLULAR
  description: >-
    KIAA0753 forms a ternary complex with OFD1 and FOPNL (FOR20) at centrosomes
    and pericentriolar satellites, and it acts upstream of them: mammalian
    centrioles need Moonraker to recruit OFD1, FOPNL and CEP90, which then place
    the distal appendage proteins CEP83, CEP89 and CEP164. Distal appendages are
    what dock the basal body to the plasma membrane, the step that permits a
    cilium to be built at all. The protein also has microtubule-stabilising
    activity. In patients the result is a measurable deficit in ciliation:
    fibroblasts from affected individuals make fewer primary cilia, and
    ablating the gene in vitro blocks ciliogenesis outright.

    This node substitutes a docking and appendage-assembly defect for the
    module's generic basal body lesion. Intraflagellar transport is not the
    primary lesion here, which is what separates this disorder from the IFT and
    dynein-2 forms of short-rib thoracic dysplasia.
  cellular_components:
  - preferred_term: centriolar satellite
    term:
      id: GO:0034451
      label: centriolar satellite
  - preferred_term: ciliary basal body
    term:
      id: GO:0036064
      label: ciliary basal body
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  - preferred_term: protein localization to cilium
    modifier: ABNORMAL
    term:
      id: GO:0061512
      label: protein localization to cilium
  evidence:
  - reference: PMID:26643951
    reference_title: OFIP/KIAA0753 forms a complex with OFD1 and FOR20 at pericentriolar satellites and centrosomes and is mutated in one individual with oral-facial-digital syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the KIAA0753/OFIP protein, whose sequence is conserved in ciliated species, associates with centrosome/centriole and pericentriolar satellites in human cells and forms a complex with FOR20 and OFD1.
    explanation: >-
      Establishes the localisation and the ternary complex this node is built
      on.
  - reference: PMID:36070319
    reference_title: "The evolutionary conserved proteins CEP90, FOPNL, and OFD1 recruit centriolar distal appendage proteins to initiate their assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we show that mammalian centrioles require another component, Moonraker (MNR), to recruit OFD1, FOPNL, and CEP90, which will then recruit the distal appendage proteins CEP83, CEP89, and CEP164.
    explanation: >-
      Places KIAA0753/Moonraker upstream of the distal appendage assembly
      cascade, which is the specific mechanism this node asserts.
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ablation of KIAA0753 in vitro blocks primary ciliogenesis and SHH pathway activity.
    explanation: >-
      KIAA0753 ablation abolishes primary ciliogenesis in mouse NIH3T3
      fibroblasts, a cell-culture experiment.
  downstream:
  - target: Impaired Hedgehog Signal Transduction
    description: >-
      Without a competent primary cilium the Hedgehog pathway cannot be
      transduced.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34523780
      reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Correspondingly, KIAA0753 patient fibroblasts have a deficit in primary ciliation and improper SHH and WNT signaling, with a particularly blunted response to SHH pathway stimulation.
      explanation: >-
        Couples the ciliation deficit to the Hedgehog signalling defect in cells
        carrying patient genotypes.
  - target: Cerebellar and CNS Involvement
    description: >-
      Mouse cerebellar experiments implicate centriolar KIAA0753 recruitment in
      granule-neuron progenitor differentiation. Translation to individual brain
      abnormalities in skeletal patients is unresolved; this supports a CNS
      developmental branch without explaining every clinical finding.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34711653
      reference_title: CEP120-mediated KIAA0753 recruitment onto centrioles is required for timely neuronal differentiation and germinal zone exit in the developing cerebellum.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surprisingly, we found that CEP120 recruits KIAA0753 to centrioles, and that loss of this interaction induces accumulation of GNPs in the germinal zone and impairs neuronal differentiation.
      explanation: >-
        Mouse depletion/rescue experiments support a role in cerebellar development;
        they do not directly demonstrate the cause of callosal, ventricular or
        pituitary findings in SRTD21.
      directness: INDIRECT
- name: Impaired Hedgehog Signal Transduction
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  biological_scale: CELLULAR
  description: >-
    KIAA0753-null mouse NIH3T3 cells fail to induce Gli1 after Smoothened
    agonist treatment. Fibroblasts from the Joubert-presenting patient 1 in the
    Inskeep series show reduced ciliation and a blunted SHH response with
    altered aspects of WNT signaling. These results support gene function but
    are not direct measurements in skeletal-patient growth plates.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED

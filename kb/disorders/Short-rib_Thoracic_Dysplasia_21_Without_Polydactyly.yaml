- name: Respiratory Insufficiency from Thoracic Restriction
  biological_scale: ORGANISM
  description: >-
    Thoracic restriction and pulmonary hypoplasia contribute to respiratory
    insufficiency from birth in severe cases. Reported outcomes also include
    respiratory failure after infection and neonatal death due to pulmonary
    hypertension, so thoracic size alone does not establish the terminal
    mechanism. One skeletal patient additionally had confirmed respiratory
    ciliary dyskinesia with recurrent chest infections, a separate route to
    respiratory disease.
  evidence:
  - reference: PMID:31816441
    reference_title: A new case of KIAA0753-related variant of Jeune asphyxiating thoracic dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This 4 year-old boy with narrow thorax, short limbs, severe respiratory and feeding difficulties from birth on had a history of hypotonia and developmental delay.
    explanation: >-
      Documents the respiratory phenotype from birth.
  - reference: PMID:34016807
    reference_title: "KIAA0753-related skeletal ciliopathy: a ninth case, extending the phenotype and reporting a novel variant."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case is the eldest woman reported to date (aged ten years) and the only known case to report associated hearing loss, leg-length discrepancy, pectus carinatum, respiratory ciliary dyskinesia and late-onset (9 years old) neuro-degenerative regression.
    explanation: >-
      Supports the second, motile-cilia route named in this node's description
      rather than the thoracic-restriction route: confirmed respiratory ciliary
      dyskinesia with recurrent chest infections. The quoted sentence states in
      the same breath that this has been seen in one patient only, so it does
      not generalise.
  downstream:
  - target: Respiratory insufficiency
    causal_link_type: DIRECT
    description: >-
      Restricted thoracic expansion and reduced lung volume account for
      respiratory insufficiency in the severe skeletal presentation.
- name: Cerebellar and CNS Involvement
  conforms_to: "ciliopathy_dysfunction#Cerebellar and CNS Malformation"
  biological_scale: ORGANISM
  description: >-
    KIAA0753 depletion in mouse cerebellar granule-neuron progenitors impairs
    differentiation and germinal-zone exit. The authors propose that this
    contributes to cerebellar hypoplasia in Joubert syndrome. Inferior vermis
    hypoplasia/dysplasia and molar tooth sign also occur in skeletal patients,
    supporting an overlapping cerebellar developmental branch. Callosal,
    ventricular and pituitary anomalies, hypotonia and developmental delay are
    associated clinical findings whose individual causal routes remain
    unresolved.
  locations:
  - preferred_term: cerebellar vermis
    term:
      id: UBERON:0004720
      label: cerebellar vermis
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition two of our patients showed brain abnormalities consistent with JBTS.
    explanation: >-
      Records the CNS involvement within the skeletal case series, and its
      frequency there.
  - reference: PMID:34016807
    reference_title: "KIAA0753-related skeletal ciliopathy: a ninth case, extending the phenotype and reporting a novel variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a ninth case that expands the phenotype; a 10-year-old girl with rhizomelic short stature (-5.6 SD), macrocephaly, developmental delay, CNS anomalies (thin corpus callosum, bilateral ventriculomegaly), cone-rod dystrophy, nystagmus, mild conductive hearing loss and recurrent chest infections secondary to confirmed ciliary dyskinesia.
    explanation: >-
      Documents the structural CNS findings alongside the skeletal phenotype in
      one patient.
  - reference: PMID:34711653
    reference_title: CEP120-mediated KIAA0753 recruitment onto centrioles is required for timely neuronal differentiation and germinal zone exit in the developing cerebellum.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, our data reveal a close interplay between CEP120 and KIAA0753 for the germinal zone exit and timely neuronal differentiation of GNPs during cerebellar development, and mutations in CEP120 and KIAA0753 may participate in the heterotopia and cerebellar hypoplasia observed in JS patients.
    explanation: >-
      The authors interpret mouse neuronal-development experiments as a possible
      explanation for human cerebellar hypoplasia. Extension to the vermian
      hypoplasia of skeletal/Joubert overlap patients remains indirect.
  downstream:
  - target: Cerebellar vermis hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective cerebellar neurogenesis provides a literature-supported candidate
      route to vermian underdevelopment in skeletal/Joubert overlap patients;
      human tissue confirmation is lacking.
    evidence:
    - reference: PMID:34711653

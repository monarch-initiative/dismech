- name: Growth Plate Zonal Disorganisation
  biological_scale: TISSUE
  description: >-
    In the one affected fetus examined histologically, the distal femoral growth
    plate had a disorganised proliferative zone and a broadened hypertrophic
    zone. That is the expected signature of reduced Hedgehog input: fewer
    proliferating chondrocytes and a failure to hold hypertrophy in check.
    KIAA0753 is expressed in the normal fetal human growth plate, so the lesion
    is where the gene acts.

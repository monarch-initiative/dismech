genetic:
- name: KIAA0753
  association: Causal biallelic variant
  gene_term:
    preferred_term: KIAA0753
    term:
      id: hgnc:29110
      label: KIAA0753
  notes: >-
    The same gene causes three named disorders: this skeletal ciliopathy,
    Joubert syndrome, and orofaciodigital syndrome type 6. The split is by
    clinical label rather than by allele - truncating variants appear across all
    three - and individual patients carry features of more than one, so the
    labels describe where a patient sits on a continuum rather than three
    separable diseases. Any citation about this gene must be checked for which
    presentation it describes before it is used.
  variants:
  - name: c.970C>T (p.Arg324*)
    description: >-
      A nonsense variant, homozygous in three affected individuals across two
      separate families of the discovery series, which makes it the one
      recurrent allele of this disorder. Carrier frequency in gnomAD is 4 in
      245,846 heterozygotes, minor allele frequency 1.627e-5, in South Asian and
      non-Finnish European populations.
    type: nonsense
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: KIAA0753
      term:
        id: hgnc:29110
        label: KIAA0753
    evidence:
    - reference: PMID:29138412
      reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In family 1 and 2, all three affected patients were homozygous for a nonsense mutation, c.970 C > T (p.Arg324*); and in family 3, the affected fetus was compound heterozygous for a nonsense variant c.943 C > T (p.Gln315*) and a 1-bp deletion, c.1271del (p.Pro424Hisfs*9).
      explanation: >-
        The sequencing results directly identify the variants and zygosity in the
        discovery families.
  - name: c.943C>T (p.Gln315*)
    description: >-
      A nonsense variant carried in trans with c.1271del by the affected fetus
      of the discovery series, and reported homozygous in an unrelated patient
      with the Jeune presentation. gnomAD carrier frequency 6 in 276,744,
      minor allele frequency 2.168e-5, non-Finnish European.
    type: nonsense
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: KIAA0753
      term:
        id: hgnc:29110
        label: KIAA0753
    evidence:
    - reference: PMID:29138412
      reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In family 1 and 2, all three affected patients were homozygous for a nonsense mutation, c.970 C > T (p.Arg324*); and in family 3, the affected fetus was compound heterozygous for a nonsense variant c.943 C > T (p.Gln315*) and a 1-bp deletion, c.1271del (p.Pro424Hisfs*9).
      explanation: >-
        The sequencing results directly identify the variants and zygosity in the
        discovery families.
    - reference: PMID:31816441
      reference_title: A new case of KIAA0753-related variant of Jeune asphyxiating thoracic dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

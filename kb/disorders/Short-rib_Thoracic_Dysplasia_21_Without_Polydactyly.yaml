progression:
- phase: Perinatal lethal end of the range
  notes: >-
    Two reported pregnancies were terminated and three patients died before
    three months of age. Death in this group is respiratory, from a thorax too
    small to permit adequate ventilation, rather than from primary lung disease.
  evidence:
  - reference: PMID:33875766
    reference_title: High diagnostic yield in skeletal ciliopathies using massively parallel genome sequencing, structural variant screening and RNA analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, there are 13 individuals reported with pathogenic variants in KIAA0753, out of them two pregnancies were terminated, three patients died before three months of age, one patient deceased at seven years of age, and seven patients are to our knowledge alive
    explanation: >-
      Quantifies the early-lethal fraction of reported cases.
- phase: Surviving childhood
  notes: >-
    Survivors have moderate skeletal dysplasia with disproportionate short
    stature, narrow thorax and metaphyseal change, alongside developmental delay
    and hypotonia. The oldest reported patient at the time of her report was ten
    years old and had accumulated cone-rod dystrophy, conductive hearing loss and
    a late neurodegenerative regression, so the phenotype is not static in
    survivors.
  evidence:
  - reference: PMID:29138412
    reference_title: Novel KIAA0753 mutations extend the phenotype of skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The manifestations in our patients are variable and ranging from fetal lethal to viable and moderate skeletal dysplasia with narrow thorax and abnormal metaphyses.
    explanation: >-
      States the range from lethal to moderate viable disease.
  - reference: PMID:34016807
    reference_title: "KIAA0753-related skeletal ciliopathy: a ninth case, extending the phenotype and reporting a novel variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case is the eldest woman reported to date (aged ten years) and the only known case to report associated hearing loss, leg-length discrepancy, pectus carinatum, respiratory ciliary dyskinesia and late-onset (9 years old) neuro-degenerative regression.
    explanation: >-
      Documents the accumulating features in the oldest reported survivor, and
      is careful to note they are so far unique to that case.
pathophysiology:
- name: Biallelic KIAA0753 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift and splice-altering variants on both KIAA0753 alleles.
    Truncating alleles predominate. Splice-altering alleles are easy to miss:
    two Pakistani families sharing an 85 kb homozygous block carried a
    synonymous c.810C>T change that turned out to activate abnormal splicing,
    which was only demonstrated by sequencing cDNA.
  genes:
  - preferred_term: KIAA0753
    term:
      id: hgnc:29110
      label: KIAA0753
  evidence:
  - reference: PMID:34523780
    reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of reported KIAA0753 variants predict premature truncation of the KIAA0753 protein.
    explanation: >-
      Establishes the predominant class of disease allele.
  - reference: PMID:33875766
    reference_title: High diagnostic yield in skeletal ciliopathies using massively parallel genome sequencing, structural variant screening and RNA analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four variants located in non-canonical splice sites of DYNC2H1, EVC, and KIAA0753 led to aberrant splicing that was shown by sequencing of cDNA.
    explanation: >-
      Documents splice-altering KIAA0753 alleles confirmed at the transcript
      level.
  downstream:
  - target: Defective Basal Body Docking and Ciliogenesis
    description: >-
      Loss of the protein removes the recruitment platform at the distal
      centriole on which cilium assembly depends.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34523780
      reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We report in vitro results assessing the function of each variant indicating that mutant proteins are not fully competent to promote primary ciliogenesis.
      explanation: >-

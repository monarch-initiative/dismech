      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results indicate that the effect that the KIAA0753 mutations have on cilia and centrosomes are sufficient to affect the growth plate organization, leading to severe postnatal short stature and bone deformities.
      explanation: >-

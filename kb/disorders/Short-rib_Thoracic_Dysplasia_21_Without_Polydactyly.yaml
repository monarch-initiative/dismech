        snippet: >-
          Correspondingly, KIAA0753 patient fibroblasts have a deficit in primary ciliation and improper SHH and WNT signaling, with a particularly blunted response to SHH pathway stimulation.
        explanation: >-
          The ciliation measurement in patient cells.
    evidence:
    - reference: PMID:26643951
      reference_title: OFIP/KIAA0753 forms a complex with OFD1 and FOR20 at pericentriolar satellites and centrosomes and is mutated in one individual with oral-facial-digital syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The decreased expression of any component of this ternary complex in RPE1 cells causes a defective recruitment onto centrosomes and satellites.
      explanation: >-
        Establishes that the recruitment failure is a property of the complex,
        reproducible by depleting any member.
  - target: Impaired Hedgehog Signal Transduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hedgehog pathway output is measured directly in patient fibroblasts and in
      KIAA0753-ablated cells.
    limitations: >-
      Hedgehog signalling in fibroblasts is a surrogate for Hedgehog signalling
      in the growth plate, where the ligand source, the receiving cell type and

pathophysiology:
- name: MYH7 Missense Variant Causing Diminished Contractile Function
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMD1S is a heterozygous missense variant in MYH7,
    encoding the beta-cardiac myosin heavy chain. The founding alleles were
    Ser532Pro and Phe764Leu, identified after a genome-wide linkage study mapped a
    dilated cardiomyopathy locus to chromosome 14q11.2-13, where MYH7 is encoded.
    Unlike the hypertrophic MYH7 alleles curated in CMH1, which increase
    contractile output, the dilated alleles diminish contractile function - the same
    motor protein perturbed in the opposite functional direction.

notes: >-
  CMD1S is the MYH7 member of the numbered dilated cardiomyopathy series and
  carries ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  The reason this entry earns its place alongside Hypertrophic Cardiomyopathy 1 is
  the allelic contrast, which is curated explicitly rather than left implicit: one
  gene, one protein, two opposite remodelling programmes. CMH1 alleles act by a
  gain of contractile function (super-relaxed-state destabilization, raised
  intrinsic force); CMD1S alleles diminish contractile function and the ventricle
  dilates instead of thickening. The founding study states the principle directly,
  and that statement is curated as evidence on the effector node.

  Scope caveat. The entry deliberately does not assert a single settled
  structural rule (for example a head-domain versus rod-domain partition) for which
  MYH7 alleles give dilated rather than hypertrophic disease; the founding alleles
  are cited by name and the functional direction is what is claimed. Sharpening
  that genotype-structure relationship is a natural augmentation if the literature
  supports it.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary MYH7 cohort and pedigree literature
  cited throughout, principally PMID:11106718.

- name: Impaired Force Generation by the Sarcomere
  biological_scale: MOLECULAR
  role: effector
  description: >-
    The mutant beta-myosin is expressed and incorporated into the sarcomere, where
    it degrades the contractile output of the cardiomyocyte rather than enhancing
    it. This hypocontractile lesion is the functional inverse of the hypertrophic
    MYH7 alleles, and it is the reason the ventricle responds by dilating rather
    than by thickening: the myocardium compensates for inadequate force by
    enlarging the chamber, not by adding wall thickness. Affected individuals
    accordingly show no antecedent hypertrophy and none of the histopathological
    features characteristic of hypertrophic disease.

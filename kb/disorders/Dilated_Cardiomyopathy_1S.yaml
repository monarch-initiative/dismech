name: Dilated Cardiomyopathy 1S
creation_date: "2026-08-23T00:00:00Z"
synonyms:
- CMD1S
- MYH7 familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1S
- cardiomyopathy, dilated, 1S
- beta-myosin heavy chain dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1S (CMD1S) is the MYH7-related form of familial isolated
  dilated cardiomyopathy. MYH7 encodes the beta-cardiac myosin heavy chain, the
  force-generating motor of the thick filament - the same protein whose variants
  cause hypertrophic cardiomyopathy 1 (CMH1). CMD1S is therefore the cleanest
  illustration in the knowledge base of a principle that the founding study of
  sarcomeric dilated cardiomyopathy set out explicitly: distinct mutations in one
  sarcomere protein cause either dilated or hypertrophic disease, so the mutant
  motor must trigger two different remodelling programmes. Where hypertrophic MYH7
  alleles act by a gain of contractile function, the dilated alleles diminish
  contractile function. Kamisago and colleagues established the entity in 2000 by
  mapping a dilated cardiomyopathy locus to 14q11.2-13, where MYH7 is encoded, and
  identifying dominant missense alleles (Ser532Pro, Phe764Leu) that produced
  early-onset ventricular dilatation with diminished contractile function and no
  antecedent hypertrophy. ClinGen classifies the MYH7-dilated cardiomyopathy
  relationship as Definitive with autosomal dominant inheritance.

    explanation: >-
      Establishes that the dilated MYH7 phenotype arises without a preceding
      hypertrophic phase and without hypertrophic histopathology, distinguishing it
      from CMH1 at the tissue level.
  - reference: PMID:11106718
    reference_title: "Mutations in sarcomere protein genes as a cause of dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because distinct mutations in sarcomere proteins cause either dilated or
      hypertrophic cardiomyopathy, the effects of mutant sarcomere proteins on
      muscle mechanics must trigger two different series of events that remodel the
      heart
    explanation: >-
      States the principle this entry exists to record: one sarcomere protein, two
      opposite remodelling programmes depending on the allele.
  downstream:
  - target: Ventricular Dilation and Systolic Dysfunction
    causal_link_type: DIRECT
    description: >-
      Chronic inadequate force generation drives chamber enlargement and falling
      systolic performance.
- name: Ventricular Dilation and Systolic Dysfunction
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Sustained hypocontractility produces the defining structural remodeling of
    dilated cardiomyopathy: left ventricular chamber enlargement with wall thinning,
    myocyte loss and interstitial fibrosis, with falling ejection fraction. In
    CMD1S this occurs early - the founding kindreds averaged 24 years at diagnosis -
    and without the myocyte disarray and wall thickening of the hypertrophic MYH7
    phenotype.

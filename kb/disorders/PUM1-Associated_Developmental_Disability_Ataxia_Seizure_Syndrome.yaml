- Intellectual Disability
- Developmental and Epileptic Encephalopathy
notes: >-
  Lump/split: this entry is scoped to PADDAS alone, and deliberately does not lump the
  milder adult-onset PUM1 phenotype into a single dosage-spectrum entry. The 2018
  delineating study (PMID:29474920) proposed exactly such a spectrum: near-halved PUM1
  protein in the infantile cases (PADDAS) and a ~25% reduction in one multigenerational
  family with adult-onset ataxia (PUM1-related cerebellar ataxia, PRCA), which OMIM and
  MONDO then curated as spinocerebellar ataxia 47 (SCA47, MONDO:0033482, OMIM:617931).
  The adult-onset arm of that spectrum no longer stands. Re-examining the same family
  (Family X), PMID:40191983 identified a pathogenic FGF14 GAA repeat expansion
  segregating with the ataxia and absent from the reportedly non-penetrant relative, and
  concluded that the PUM1 p.Thr1035Ser variant is not causative and that PUM1 variants
  are likely not associated with adult-onset ataxia. OMIM has since deprecated the SCA47
  entry and reclassified the variant as of uncertain significance, and MONDO:0033482
  carries that deprecation note. There is therefore no second established PUM1 disease
  entity to lump with, and a spectrum entry built on the 2018 dosage model would assert
  a phenotype the primary literature has withdrawn.

  A consequence for the mechanism recorded below: the protein-dosage gradient is still a
  real and well-documented feature of PUM1 biology, but the human evidence for it now
  rests on the range of severity within PADDAS itself and on mouse and patient-cell work
  (PMID:37070548), not on a contrast between two human diseases. PMID:37070548 also shows
  that the severity difference is not a simple linear function of PUM1 abundance: the
  severe R1147W allele de-represses canonical PUM1 targets no more than the mild allele
  does, and instead disrupts PUM1's interactions with partner RNA-binding proteins.

  MONDO files MONDO:0958231 under autosomal dominant cerebellar ataxia type I
  (MONDO:0019792). That placement is not followed here, and
  kb/disorders/Autosomal_Dominant_Cerebellar_Ataxia_Type_I.yaml records the same
  decision from the other side: PADDAS is a de novo developmental syndrome rather than a
  dominantly inherited progressive ataxia, and the MONDO term's own definition makes no
  ADCA-I claim. That entry's notes additionally state that PRCA/SCA47 "is the PUM1 ataxia
  phenotype"; the Cuillerier finding above supersedes that sentence, which was written
  before this curation and has not been edited here.

  Identifier note: Orphanet's ORPHA:589515 record cross-references MONDO:0035117, which
  MONDO has since obsoleted; the live term for this concept is MONDO:0958231. Both
  Orphanet and MONDO cross-reference OMIM:620719.

  Evidence gaps recorded rather than filled. No GeneReviews chapter exists for PUM1 or
  PADDAS (checked offline against cache/bookshelf and with a live PubMed
  "PUM1 AND genereviews[book]" search on 2026-09-26, both empty), so no expert-curated
  phenotype baseline is available and the phenotype list below is assembled from the
  primary cohort and case literature. ClinGen has published no Gene-Disease Validity
  assertion for PUM1 (data/clingen/gene_validity.csv, snapshot in
  data/clingen/MANIFEST.yaml, contains no PUM1 row), so no CGGV row is cited. No
  prevalence estimate has been published; the literature is a published case count and is
  recorded as such rather than converted into a rate. PMID:31859446, a letter reporting
  two further PUM1 patients that the later literature cites as Voet et al., has no
  abstract or full text available through the reference fetcher, so its cases are reached
  here only through PMID:35386260's tabulation of them and it is not cited directly.
inheritance:
- name: Autosomal dominant, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Every reported PADDAS proband carries a single heterozygous PUM1 lesion - either a
    1p35.2 microdeletion whose minimal region of overlap contains only PUM1, or a
    missense or frameshift variant - and where parental samples have been tested the
    variant has been de novo. No affected parent-child pair has been described, and the
    recurrent p.Arg1147Trp allele has arisen independently in several unrelated
    families. Transmission risk to the offspring of an affected individual has not been
    reported in the literature and is not stated here.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified eleven individuals with either PUM1 deletions or de novo missense variants who suffer a developmental syndrome"
    explanation: Establishes heterozygous deletion and de novo missense variation as the
      two causal lesion classes in the founding cohort.
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, at least three unrelated patients with this variant have been reported (5, 7, 8), and all of them were de novo."
    explanation: Independent recurrence of the same de novo allele in unrelated families
      supports de novo dominant occurrence rather than inherited transmission.
genetic:
- name: PUM1
  gene_term:
    preferred_term: PUM1
    term:
      id: hgnc:14957
      label: PUM1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    PUM1 at 1p35.2 encodes Pumilio1, a PUF-family sequence-specific RNA-binding protein
    that binds Pumilio response elements in the 3' untranslated regions of target mRNAs
    and represses their translation and stability. Disease-causing lesions are
    heterozygous whole-gene deletions, de novo missense variants inside or immediately
    adjacent to the Pumilio homology domain (recurrently p.Arg1139Trp and p.Arg1147Trp),
    and at least one de novo frameshift allele. Of the nine deletion probands in the
    founding cohort the deletions ranged from 0.3 to 5.6 Mb, and PUM1 was the only gene
    inside the minimal region of overlap.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we did identify nine patients with heterozygous deletions ranging in size from 0.6 to 5.60 Mb, where the minimal region of overlap included only PUM1"
    explanation: Narrows the deleted interval to PUM1 alone, which is what makes the
      deletion cases evidence about this gene rather than about a contiguous gene
      syndrome.
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of all the deleted genes, PUM1 had the highest probability to be pathogenic"
    explanation: Supports PUM1 as the driver gene within the deleted intervals.
  - reference: PMID:40472467
    reference_title: "A new developmental and epileptic encephalopathy: PUM1-neurodevelopmental disorder with epilepsy with myoclonic-atonic seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES showed a de novo heterozygous frameshift pathogenic variant in PUM1"
    explanation: Extends the allelic spectrum beyond deletions and missense variants to a
      frameshift allele.
pathophysiology:
- name: PUM1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    A heterozygous whole-gene deletion, destabilising missense variant, or frameshift
    allele leaves one functional PUM1 copy. In fibroblasts and lymphoblastoid lines from
    the infantile-onset probands, PUM1 protein falls to roughly half of control levels,
    which is the quantitative starting point of the disease.
  genes:
  - preferred_term: PUM1
    term:
      id: hgnc:14957
      label: PUM1
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Studies in patient-derived cells revealed that the missense mutations reduced PUM1 protein levels by ∼25% in the adult-onset cases and by ∼50% in the infantile-onset cases"
    explanation: Quantifies the residual PUM1 protein in patient-derived cells for the
      infantile-onset (PADDAS) alleles.
  downstream:
  - target: Loss of Pumilio1 Translational Repression
    causal_link_type: DIRECT
    description: Halving the dose of a translational repressor halves the repressive
      activity available to its target transcripts.
  - target: Disruption of PUM1 Partner RNA-Binding Protein Complexes
    causal_link_type: DIRECT
    description: >-
      A separate consequence of the severe alleles, not mediated by loss of target
      repression: the R1147W protein still binds and represses canonical targets normally
      but fails to hold its normal partner complexes.
    evidence:
    - reference: PMID:37070548
      reference_title: "Dosage sensitivity to Pumilio1 variants in the mouse brain reflects distinct molecular mechanisms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mild PUM1 loss derepresses PUM1-specific targets, but the severe mutation disrupts interactions with several RNA-binding proteins and the regulation of their targets"
      explanation: Establishes the partner-complex arm as a mechanism distinct from target
        de-repression.
- name: Loss of Pumilio1 Translational Repression
  biological_scale: MOLECULAR
  description: >-
    Pumilio1 binds Pumilio response elements in target 3' untranslated regions and
    represses translation and transcript stability. With one functional allele the
    aggregate repressor activity on those transcripts is reduced.
  molecular_functions:
  - preferred_term: translation repressor activity
    modifier: DECREASED
    term:
      id: GO:0030371
      label: translation repressor activity
  - preferred_term: mRNA 3'-UTR binding
    modifier: DECREASED
    term:
      id: GO:0003730
      label: mRNA 3'-UTR binding
  evidence:
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "It binds to specific mRNAs (ATXN1, E2F3, CDKN1B, SAE1, CDK1, and AAMP) and directly prevents its translation, thus negatively regulating the expression of the target genes"
    explanation: States the repressor function and names the target transcripts; quoted
      from the case report's introduction, which restates established PUM1 biology rather
      than reporting the authors' own experiment.
  downstream:
  - target: De-repression of PUM1 Target Transcripts
    causal_link_type: DIRECT
    description: Reduced repressor occupancy raises the steady-state level of the bound
      transcripts and their protein products.
    evidence:
    - reference: PMID:29474920
      reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "levels of known PUM1 targets increased accordingly"
      explanation: Directly links the reduced PUM1 protein level to increased target
        levels in patient-derived cells.
- name: De-repression of PUM1 Target Transcripts
  biological_scale: MOLECULAR
  description: >-
    PUM1 target transcripts, including ATXN1 and E2F3, rise in patient cells in
    proportion to the loss of PUM1 protein. ATXN1 is the target with an established
    neurological consequence: wild-type ataxin-1 is itself dose-sensitive, and raising it
    reproduces features of spinocerebellar ataxia type 1 without any repeat expansion.
  biological_processes:
  - preferred_term: negative regulation of translation of PUM1 target mRNAs
    modifier: DECREASED
    term:
      id: GO:0017148
      label: negative regulation of translation
  evidence:
  - reference: PMID:25768905
    reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Pum1 caused progressive motor dysfunction and SCA1-like neurodegeneration with motor impairment, primarily by increasing Ataxin1 levels."
    explanation: Identifies raised ataxin-1 as the principal mediator of the neurological
      consequences of Pum1 loss in mice.
  downstream:
  - target: Elevated Wild-Type Ataxin-1 in Purkinje Cells
    causal_link_type: DIRECT
    description: ATXN1 is a direct PUM1 target; its transcript and protein rise when PUM1
      repression is lost.
    evidence:
    - reference: PMID:35386260
      reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "A loss-of-function mutation of PUM1 increases the ATXN1 mRNA level, which leads to Atxn1 accumulation in Purkinje cells located in the cerebellar cortex of the brain, consequently leading to motor dysfunction"
      explanation: States the ATXN1 de-repression to Purkinje-cell accumulation step;
        quoted from the introduction's summary of prior work.
- name: Disruption of PUM1 Partner RNA-Binding Protein Complexes
  biological_scale: MOLECULAR
  description: >-
    The severe PADDAS missense allele p.Arg1147Trp lies outside the RNA-binding domain
    and leaves canonical target repression intact, yet produces a far more severe
    phenotype than the alleles that impair RNA binding. In mouse brain proteomics and
    patient cell lines the severe allele instead disrupts PUM1's interactions with
    partner RNA-binding proteins, dysregulating their targets as well. This is why
    phenotype severity in PUM1 disease is not a linear function of PUM1 abundance.
  evidence:
  - reference: PMID:37070548
    reference_title: "Dosage sensitivity to Pumilio1 variants in the mouse brain reflects distinct molecular mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results demonstrate that dosage sensitivity does not always signify a linear relationship with protein abundance but can involve distinct mechanisms."
    explanation: States the paper's conclusion that a second, non-linear mechanism operates
      alongside simple target de-repression.
  - reference: PMID:37070548
    reference_title: "Dosage sensitivity to Pumilio1 variants in the mouse brain reflects distinct molecular mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patient-derived cell lines, restoring PUM1 levels restores these interactors and their targets to normal levels."
    explanation: Shows the interactor defect is a consequence of reduced PUM1 and is
      reversible in patient cells, which is what makes it a mechanistic node rather than
      an incidental finding.
  downstream:
  - target: Impaired Neuronal Dendritic Arborization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Dysregulation of the targets of the disrupted partner RNA-binding proteins in neurons.
- name: Elevated Wild-Type Ataxin-1 in Purkinje Cells
  biological_scale: CELLULAR
  description: >-
    Ataxin-1 accumulates in cerebellar Purkinje cells when PUM1 repression of ATXN1 is
    lost. In mice this is sufficient to produce SCA1-like degeneration, and genetically
    lowering Atxn1 back to normal largely rescues the Pum1 heterozygous phenotype, which
    is the strongest available evidence that this step is causal rather than correlative.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:25768905
    reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Breeding Pum1(+/-) mice to SCA1 mice (Atxn1(154Q/+)) exacerbated disease progression, whereas breeding them to Atxn1(+/-) mice normalized Ataxin1 levels and largely rescued the Pum1(+/-) phenotype."
    explanation: A bidirectional genetic epistasis experiment establishing ataxin-1 dosage
      as the mediator of the Pum1 haploinsufficiency phenotype.
  downstream:
  - target: Cerebellar Purkinje Cell Degeneration
    causal_link_type: DIRECT
    description: Raised wild-type ataxin-1 drives the same Purkinje-cell degeneration seen
      in SCA1.
- name: Cerebellar Purkinje Cell Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive loss and dysfunction of cerebellar Purkinje cells, the sole output neurons
    of the cerebellar cortex. In PADDAS this is the substrate of the ataxia, the
    dysarthria, and the vermian and posterior fossa changes seen on MRI; in the founding
    cohort the cerebellar signs were documented as progressive in several children.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "progressive cerebellar signs involving gross and fine motor incoordination"
    explanation: Describes the cerebellar motor phenotype that the Purkinje-cell
      degeneration produces, in the Pum1 mouse model the authors compare the patients to.
  downstream:
  - target: Ataxia
    causal_link_type: DIRECT
    description: Cerebellar output failure produces limb and gait incoordination.
  - target: Dysarthria
    causal_link_type: DIRECT
    description: Cerebellar involvement of speech motor control.
- name: Impaired Neuronal Dendritic Arborization
  biological_scale: CELLULAR
  description: >-
    PUM1 dosage governs dendritic complexity in neurons. Both overexpression and
    PADDAS-associated mutant PUM1 suppress dendritic branching in dissociated mouse
    hippocampal neurons, placing the gene inside the machinery that builds neuronal
    connectivity and giving the developmental delay and intellectual disability a
    cellular substrate distinct from the cerebellar degeneration.
  biological_processes:
  - preferred_term: dendrite morphogenesis
    modifier: DECREASED
    term:
      id: GO:0048813
      label: dendrite morphogenesis
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of each mutant suppressed dendritic arborization somewhat compared to empty vector"
    explanation: Direct measurement of reduced dendritic branching with the patient mutant
      proteins in cultured neurons.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced dendritic complexity and synaptic connectivity across developing cortical and subcortical circuits.
  - target: Intellectual disability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced dendritic complexity and synaptic connectivity in cortical circuits.
  - target: Cortical Network Hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered excitatory/inhibitory balance arising from abnormal dendritic and synaptic development.
- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  description: >-
    Cortical circuit dysfunction produces early-onset, frequently pharmacoresistant
    epilepsy. EEG in reported children shows diffuse background slowing with multifocal
    spikes, hypsarrhythmia in one infant with spasms, and generalised spike-and-wave in
    others; MRI abnormalities are cerebral (thin or short corpus callosum, dilated
    ventricles) as well as cerebellar, which is the argument that PADDAS is not a purely
    cerebellar disease.
  evidence:
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy is the dysfunction of the cerebrum (17), and we believe that epilepsy and abnormal cortical EEG findings in these patients may indicate that their cerebrum may also be affected."
    explanation: Attributes the epilepsy in PUM1 patients to cerebral rather than
      cerebellar involvement, on the basis of their EEG findings.
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: Cortical hyperexcitability is the immediate substrate of the seizures.
  - target: Developmental regression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Ongoing epileptiform activity interfering with development, the developmental and epileptic encephalopathy pattern; regression followed seizure onset and improved with seizure control in at least one reported child.
- name: Impaired Somatic Growth
  biological_scale: ORGANISM
  description: >-
    PADDAS children are commonly small for age. Pum1 knockout mice show marked growth
    defects and are smaller than normal at birth, falling further behind the growth curve
    over life, and the PADDAS probands with the best clinical documentation show the same
    pattern, so the growth phenotype appears to be a direct consequence of PUM1 loss
    rather than a secondary effect of feeding difficulty.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "many of the PADDAS subjects—particularly the two missense mutation patients, for whom we have the most reliable clinical data—are small for their age"
    explanation: Documents poor growth across the human cohort.
  downstream:
  - target: Growth delay
    causal_link_type: DIRECT
    description: The clinical expression of the growth defect.
phenotypes:
- category: Neurologic
  name: Global developmental delay
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  description: >-
    Delay across motor, language, and adaptive domains, recognised in infancy or the
    first years of life. Every proband in the founding deletion cohort had it, and it is
    present in all nine of the PUM1 patients with epilepsy tabulated in the 2022 review.
    It is the one feature reported in every published case.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All nine subjects were documented to have developmental delay, eight had language delay, seven have intellectual disability, six have ataxia, and three were noted to have seizures"
    explanation: Gives the per-feature counts in the nine-patient deletion cohort;
      developmental delay was universal.
- category: Neurologic
  name: Delayed speech and language development
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  description: >-
    Expressive language is disproportionately affected. Eight of the nine deletion
    probands had documented language delay, and several of the more severely affected
    children had no verbal communication at last follow-up in the preschool years.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All nine subjects were documented to have developmental delay, eight had language delay, seven have intellectual disability, six have ataxia, and three were noted to have seizures"
    explanation: Eight of nine with language delay in the founding deletion cohort.
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we noted no verbal communication, severe intellectual disability, and the use of only eye contact to acknowledge other people"
    explanation: Illustrates the severe end of the language phenotype at age three years.
- category: Neurologic
  name: Intellectual disability
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  description: >-
    Cognitive impairment ranging from mild to severe. Seven of the nine deletion probands
    had documented intellectual disability; the two children with de novo missense
    variants in the founding report differed, one having intellectual disability and the
    other not, which is the earliest indication that cognitive outcome varies within the
    disorder.
  evidence:

    documented onset age, four began in the first year of life (three at four to five
    months), one at fourteen months and one at three years. Semiology is heterogeneous
    across reported children and includes focal seizures, typical absences, infantile
    spasms, generalised tonic-clonic seizures, myoclonic-atonic seizures, and status

diagnosis:
- name: Trio exome or genome sequencing
  description: >-
    The route by which every recently reported case has been diagnosed. Trio design
    matters here because the diagnostic observation is de novo occurrence of a
    heterozygous PUM1 variant that population databases do not contain; without parental
    samples a novel PUM1 missense variant is difficult to classify.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:40472467
    reference_title: "A new developmental and epileptic encephalopathy: PUM1-neurodevelopmental disorder with epilepsy with myoclonic-atonic seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through trio-based whole exome sequencing (WES), we identified a novel de novo heterozygous frameshift variant in the PUM1 gene."
    explanation: Trio exome sequencing as the diagnostic modality in a recent case.
- name: Chromosomal microarray
  description: >-
    Required to reach the deletion end of the allelic spectrum. Nine of the eleven
    founding PADDAS probands carried 1p35.2 microdeletions of 0.3 to 5.6 Mb, which an
    exome-only strategy can miss, so a normal exome does not exclude PUM1 as the cause in
    a child with this phenotype.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought patients with copy-number variations (CNVs) of PUM1 from public databases and from a cohort of 52,000 patients who underwent clinical chromosome microarray analysis for neurodevelopmental disorders"
    explanation: Chromosomal microarray was the ascertainment route for the deletion
      cases.
- name: Electroencephalography
  description: >-
    EEG is indicated in any child with this diagnosis and seizures, and the reported
    patterns are non-specific: diffuse background slowing from as early as four months,
    multifocal spikes appearing over time, generalised spike-and-wave, and hypsarrhythmia
    in the infant with spasms. No PUM1-specific EEG signature has been described.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The background EEG showed diffuse slowing activity initially at 4 months of age. Sporadic multifocal spikes appeared over time"
    explanation: Describes the evolving EEG findings in a reported infant.
treatments:
- name: Antiseizure Pharmacotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Seizure control is the treatment decision with the largest developmental consequence
    in this disorder, and response is unpredictable. In the tabulated PUM1 epilepsy cases
    four of six with a documented outcome achieved control on one or two agents, while
    two were refractory: one girl failed carbamazepine, phenobarbitone, lamotrigine,
    levetiracetam, clobazam, oxcarbazepine, cannabidiol and the ketogenic diet in
    combination. Another child's fever-triggered status epilepticus came under control
    only when perampanel was added to levetiracetam, valproate and topiramate. No agent
    has been shown to be preferentially effective in PUM1-related epilepsy, and the
    choice follows seizure semiology as it would in any developmental and epileptic
    encephalopathy.
  treatment_term:
    preferred_term: antiseizure pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cortical Network Hyperexcitability
    treatment_effect: INHIBITS
    description: Antiseizure medication suppresses the cortical hyperexcitability that
      generates the seizures; it does not act on PUM1 dosage.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seizures were not controllable by polypharmacy (carbamazepine, phenobarbitone, lamotrigine, levetiracetum, clobazam, oxcarbazepine, cannibidiol and combinations) or the ketogenic diet"
    explanation: Documents pharmacoresistance in one proband, which is why treatment
      response is described here as variable rather than reliable.
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perampanel (PER; final dose at 3 mg/day) was added to the combination treatment of LEV, VPA, and TPM at 1 year and 10 months of age, which reduced the frequency of fever-triggered seizures from once a month to only one episode in the last year."
    explanation: A documented regimen and its measured effect on seizure frequency in one
      child.
- name: Dietary Intervention for Seizure Control
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Dietary therapy, conventionally ketogenic for myoclonic-atonic seizures, was part of
    the regimen that brought the reported boy with PUM1-related epilepsy with
    myoclonic-atonic seizures under control within a year, with developmental gains
    following. The opposite result is also on record: the ketogenic diet failed in the
    severely affected founding proband. Both are single cases.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Cortical Network Hyperexcitability
    treatment_effect: INHIBITS
    description: Dietary therapy as an adjunct to antiseizure medication for seizure
      control.
  evidence:
  - reference: PMID:40472467
    reference_title: "A new developmental and epileptic encephalopathy: PUM1-neurodevelopmental disorder with epilepsy with myoclonic-atonic seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with antiseizure medication and dietary intervention led seizure control within one year, enabling developmental gains despite persisting delays in adaptive functioning and communication."
    explanation: Reports the combined regimen and the developmental gain that followed
      seizure control.
- name: Developmental and Rehabilitative Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physical, occupational and speech therapy for the motor delay, hypotonia, ataxia and
    the disproportionate expressive language impairment. This is the standard of care for
    a child with a developmental and epileptic encephalopathy; no PUM1-specific
    rehabilitation evidence exists, and none is claimed here.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  notes: >-
    Deliberately carries no evidence item. No published study reports a rehabilitation
    outcome in PADDAS, and citing a general developmental-delay source would be a weaker
    adjacent citation rather than support for this claim.
- name: Genetic Counseling
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Counselling covers the de novo origin of the variant in the proband and the
    implications for future pregnancies. The published PADDAS lesions have all been de
    novo where parental testing was performed; no PUM1 germline mosaicism and no
    recurrence figure has been reported, so a numeric sibling recurrence risk cannot be
    quoted from this literature.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, at least three unrelated patients with this variant have been reported (5, 7, 8), and all of them were de novo."
    explanation: The de novo occurrence that the counselling discussion rests on.
differential_diagnoses:
- name: Dravet syndrome
  disease_term:
    preferred_term: Dravet syndrome
    term:
      id: MONDO:0100135
      label: Dravet syndrome
  description: >-
    The PADDAS child with fever-triggered, drug-resistant status epilepticus beginning at
    four months, with developmental slowing after seizure onset and an EEG that was
    initially slow and later multifocal, was clinically considered to have a Dravet-like
    syndrome before PUM1 was identified. SCN1A accounts for more than 85% of Dravet
    syndrome.
  distinguishing_features:
  - >-
    Severe developmental delay already present in infancy, before or independent of the
    epilepsy, and dysmorphic facial features are both atypical for classical Dravet
    syndrome and point away from SCN1A. Ataxia and the structural MRI findings are also
    not expected in Dravet syndrome.
  evidence:
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, she displayed severe developmental delay as an infant, which was atypical for classical DS. Besides epilepsy, she also had dysmorphic features, which is also not characteristic of DS."
    explanation: States the two features that distinguish this presentation from classical
      Dravet syndrome.
- name: Spinocerebellar ataxia type 1
  disease_term:
    preferred_term: spinocerebellar ataxia type 1
    term:
      id: MONDO:0008119
      label: spinocerebellar ataxia type 1
  description: >-
    The mechanistic neighbour rather than a clinical mimic. SCA1 is caused by a CAG repeat
    expansion in ATXN1; PADDAS raises the level of wild-type ataxin-1 by removing its
    repressor, and mouse work shows that this alone produces SCA1-like degeneration.
    PADDAS is not itself a polyglutamine repeat disease.
  distinguishing_features:
  - >-
    SCA1 is an adult-onset, dominantly inherited progressive ataxia with a demonstrable
    CAG expansion, without developmental delay, epilepsy or dysmorphism. PADDAS presents
    in infancy or early childhood, is de novo, and has no repeat expansion.
  evidence:
  - reference: PMID:25768905
    reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Pum1 caused progressive motor dysfunction and SCA1-like neurodegeneration with motor impairment, primarily by increasing Ataxin1 levels."
    explanation: Establishes the shared effector that makes SCA1 the relevant mechanistic
      comparator.
- name: Spinocerebellar ataxia 27B
  disease_term:
    preferred_term: spinocerebellar ataxia 27B, late-onset
    term:
      id: MONDO:0859340
      label: spinocerebellar ataxia 27B, late-onset
  description: >-
    The disease that displaced the PUM1 adult-onset ataxia phenotype. On re-examination of
    the original PUM1 ataxia family, a pathogenic FGF14 GAA intronic repeat expansion was
    found in all affected members and absent from the supposedly non-penetrant relative.
  distinguishing_features:
  - >-
    SCA27B is an adult-onset ataxia caused by an FGF14 GAA repeat expansion, detected by
    repeat-targeted testing rather than by exome sequencing. It has no relationship to the
    infantile PADDAS phenotype other than that a PUM1 variant was once wrongly credited
    for it, which is a reason to test for FGF14 expansions rather than to attribute an
    adult ataxia to a PUM1 variant of uncertain significance.
  evidence:
  - reference: PMID:40191983
    reference_title: "FGF14 GAA Intronic Expansion in Unsolved Adult-Onset Ataxia in the Care4Rare Canada Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified a pathogenic GAA expansion in FGF14 in all affected family members, and it is absent in the presumably nonpenetrant unaffected family member initially reported"
    explanation: The finding that reassigned the family's ataxia from PUM1 to FGF14.
  - reference: PMID:40191983
    reference_title: "FGF14 GAA Intronic Expansion in Unsolved Adult-Onset Ataxia in the Care4Rare Canada Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ruling out that the missense variant in PUM1 is causative and indicating that variants in PUM1 are likely not associated with adult-onset ataxia"
    explanation: The authors' explicit conclusion about PUM1 and adult-onset ataxia, which
      is what removes the adult arm from this disorder's scope.
animal_models:
- name: Pum1 heterozygous mouse
  species: Mouse
  genotype: Pum1+/- (heterozygous null)
  publication: PMID:25768905
  description: >-
    The mouse counterpart of PUM1 haploinsufficiency, and the model that prompted the
    search for human PUM1 patients. Pum1+/- mice develop progressive motor dysfunction
    with Purkinje cell degeneration, and the phenotype is driven by raised wild-type
    Ataxin1: crossing to Atxn1+/- normalises Ataxin1 levels and largely rescues it, while
    crossing to an SCA1 model worsens it. Roughly two thirds of heterozygotes also
    develop spontaneous seizures, so the model captures both the ataxia and the epilepsy
    arms of the human disorder.
  modeled_mechanisms:
  - target: Elevated Wild-Type Ataxin-1 in Purkinje Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Raised Ataxin1 in the haploinsufficient mouse, shown to be the mediator of the
      phenotype by bidirectional genetic rescue and exacerbation. The observation is
      Ataxin1 accumulation in cerebellar Purkinje cells, at the same scale as the node.
    limitations: >-
      The rescue experiments alter Atxn1 gene dosage genetically from conception, which
      is not available as an intervention in humans and says nothing about whether
      lowering ataxin-1 after symptom onset would help. No equivalent measurement of
      ataxin-1 in human PADDAS neural tissue has been reported.
    evidence:
    - reference: PMID:25768905
      reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Breeding Pum1(+/-) mice to SCA1 mice (Atxn1(154Q/+)) exacerbated disease progression, whereas breeding them to Atxn1(+/-) mice normalized Ataxin1 levels and largely rescued the Pum1(+/-) phenotype."
      explanation: Genetic epistasis in both directions is what makes this a
        high-fidelity model of the ataxin-1 dosage step rather than a correlation.
  - target: Cerebellar Purkinje Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Progressive Purkinje cell degeneration with motor incoordination.
    limitations: >-
      The mouse phenotype is a progressive adult-onset degeneration, whereas the human
      disorder is an early-childhood developmental syndrome in which ataxia is one
      feature among developmental delay, epilepsy, growth failure and dysmorphism. The
      model therefore captures the cerebellar arm well and the developmental arm poorly.
    evidence:
    - reference: PMID:25768905
      reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of Pum1 caused progressive motor dysfunction and SCA1-like neurodegeneration with motor impairment, primarily by increasing Ataxin1 levels."
      explanation: Reports the degenerative cerebellar phenotype in the model.
  - target: Cortical Network Hyperexcitability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Spontaneous seizures appear in most heterozygotes, but at 16 weeks of age, which is
      adult, where the human seizures begin in the first year of life.
    limitations: >-
      The timing is wrong in the direction that matters most clinically: the model does
      not reproduce the infantile onset or the developmental and epileptic encephalopathy
      pattern, so it cannot be used to study the developmental consequence of early
      seizures in this disorder.
    evidence:
    - reference: PMID:29474920
      reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "they show marked growth defects and spontaneous seizures at 16 weeks of age"
      explanation: Reports both the seizures and their age of onset in the model.
  - target: Impaired Somatic Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Pum1 knockout mice are smaller than normal at birth and fall further behind the
      growth curve over life, matching the poor growth of the human probands.
    evidence:
    - reference: PMID:29474920
      reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "are smaller than normal at birth and fall farther behind on the growth curve over the course of their lives"
      explanation: Documents the growth phenotype in the mouse.
  evidence:
  - reference: PMID:25768905
    reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we discovered that the RNA-binding protein PUMILIO1 (PUM1) not only directly regulates ATAXIN1 but also plays an unexpectedly important role in neuronal function"
    explanation: Establishes the mouse model as the source of the PUM1-ATXN1 mechanism
      that the human disorder was then found to instantiate.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence estimate has been published. The founding report
    described eleven individuals with the PADDAS phenotype, and the epilepsy-focused
    literature review tabulated nine PUM1 patients with seizures, with further single
    cases since. No numeric rate is recorded here because none exists in a citable source,
    and converting a published case count into a rate would manufacture a figure the
    literature does not support.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified eleven individuals with either PUM1 deletions or de novo missense variants who suffer a developmental syndrome"
    explanation: The founding case count, which is the basis for classing the disorder as
      ultra-rare.
  - reference: PMID:35386260
    reference_title: "A de novo PUM1 Variant in a Girl With a Dravet-Like Syndrome: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upon thoroughly reviewing the existing literature, nine cases of PUM1 mutation-related epilepsy were identified"
    explanation: The published case count for the epilepsy subset four years later,
      showing the literature is still counted in single figures.
discussions:
- discussion_id: paddas_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the neurological course of PADDAS static, as in a developmental encephalopathy, or
    progressive, as the mouse degeneration and the ataxia in some probands suggest?
  attaches_to:
  - pathophysiology#Cerebellar Purkinje Cell Degeneration
  - phenotypes#Ataxia
  rationale: >-
    The answer changes what is said to families at diagnosis and whether serial
    neurological and imaging follow-up is warranted beyond routine developmental review.
    The mechanism points at progression: the mouse model degenerates, and two founding
    probands were documented as having progressive features. The human evidence does not
    settle it, because no longitudinal cohort has been followed. With the adult-onset
    PUM1 ataxia phenotype withdrawn, there is also no longer a late-onset human
    counterpart from which to infer a degenerative trajectory.
  evidence:
  - reference: PMID:29474920
    reference_title: "A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency Causes Developmental Delay and Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She developed early-onset, progressive ataxia with hypotonicity in her lower limbs"
    explanation: One of the few explicit human statements that the motor phenotype
      progressed, in a single child.
- discussion_id: paddas_surveillance_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What paediatric surveillance does PADDAS actually require, beyond the developmental,
    seizure and growth monitoring any child with a developmental and epileptic
    encephalopathy receives?
  attaches_to:
  - phenotypes#Reduced bone mineral density
  - phenotypes#Scoliosis
  - phenotypes#Cryptorchidism
  - phenotypes#Strabismus
  rationale: >-
    No guideline, GeneReviews chapter or management paper exists for this disorder, so
    there is no published surveillance protocol to record in the treatments section. The
    non-neurological findings that have been reported in single children - low bone
    mineral density, scoliosis, cryptorchidism, strabismus and refractive error - are each
    plausible surveillance targets, but each rests on one or two cases and none has a
    denominator. Recording them as phenotypes with their case-level frequency is
    deliberate; asserting a surveillance schedule from them would be an inference the
    literature does not support.
- discussion_id: paddas_atxn1_lowering
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    If raised wild-type ataxin-1 mediates the cerebellar phenotype, would lowering ATXN1
    benefit PADDAS?
  attaches_to:
  - pathophysiology#Elevated Wild-Type Ataxin-1 in Purkinje Cells
  rationale: >-
    Genetically halving Atxn1 largely rescues the Pum1 heterozygous mouse, which is a
    direct demonstration that the step is tractable in principle. No PUM1 or PADDAS
    preclinical rescue study using an ATXN1-lowering agent has been published, and none is
    claimed here. Two limits are worth stating alongside the hypothesis: ataxin-1
    de-repression is only one arm of the mechanism, since the severe alleles act partly by
    disrupting PUM1 partner complexes rather than by raising canonical targets; and the
    developmental features of PADDAS are established before any postnatal intervention
    could begin.
  evidence:
  - reference: PMID:25768905
    reference_title: "Pumilio1 haploinsufficiency leads to SCA1-like neurodegeneration by increasing wild-type Ataxin1 levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "breeding them to Atxn1(+/-) mice normalized Ataxin1 levels and largely rescued the Pum1(+/-) phenotype"
    explanation: The genetic proof of principle that lowering ataxin-1 reverses the
      consequences of Pum1 haploinsufficiency in mice.
  - reference: PMID:37070548
    reference_title: "Dosage sensitivity to Pumilio1 variants in the mouse brain reflects distinct molecular mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the severe mutation disrupts interactions with several RNA-binding proteins and the regulation of their targets"
    explanation: The second mechanistic arm, which an ATXN1-directed therapy would not
      address.

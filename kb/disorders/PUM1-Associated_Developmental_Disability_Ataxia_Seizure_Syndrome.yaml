name: PUM1-Associated Developmental Disability, Ataxia, and Seizure Syndrome
creation_date: '2026-09-26T00:00:00Z'
category: Mendelian
synonyms:
- PADDAS
- PADDAS syndrome
- PUM1-associated developmental disability-ataxia-seizure syndrome
- Pumilio1-associated developmental disability, ataxia, and seizure syndrome
- neurodevelopmental disorder with motor abnormalities, seizures, and facial dysmorphism
description: >-
  A de novo dominant neurodevelopmental disorder caused by heterozygous loss of one
  functional copy of PUM1, the gene encoding Pumilio1, a sequence-specific RNA-binding
  translational repressor. The causal lesions are 1p35.2 microdeletions spanning PUM1
  and de novo missense or truncating variants that destabilise the protein; in
  patient-derived cells the missense alleles associated with the infantile-onset
  phenotype reduce PUM1 protein by roughly half, and PUM1 target transcripts rise in
  proportion. Children present in the first years of life with global developmental
  delay, intellectual disability, early-onset and often pharmacoresistant seizures,
  ataxia and other motor abnormalities, hypotonia, poor somatic growth, and dysmorphic
  facial features; brain MRI commonly shows a thin or shortened corpus callosum,
  dilated ventricles, or posterior fossa abnormalities. The best-characterised
  molecular consequence is de-repression of PUM1 target mRNAs, of which ATXN1 is the
  one with an established neurodegenerative role, giving this disorder a mechanistic
  link to spinocerebellar ataxia type 1 that runs through wild-type ataxin-1 dosage
  rather than through a repeat expansion.

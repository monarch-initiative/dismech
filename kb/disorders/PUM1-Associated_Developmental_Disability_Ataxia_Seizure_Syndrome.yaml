- category: Ophthalmologic
  name: Strabismus
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  description: >-
    Ocular misalignment, exotropic or esotropic, recorded in four of the tabulated PUM1

  evidence:
  - reference: PMID:30903679
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here an additional patient with early onset developmental delay, epilepsy, microcephaly, and hair dysplasia, with a de novo heterozygous missense variant of PUM1"
    explanation: Reports microcephaly in this patient.
- category: Dermatologic
  name: Abnormal hair morphology
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Abnormal hair morphology
    term:
      id: HP:0001595
      label: Abnormal hair morphology
  description: >-
    Hair dysplasia was described in a single patient and proposed by the authors as an
    expansion of the PADDAS phenotype. It has not been reported since and is recorded here
    as an isolated observation.
  evidence:
  - reference: PMID:30903679
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report is in favor of a variable expressivity of PADDAS syndrome, and broadens the phenotypic spectrum with the description of hair dysplasia."
    explanation: States the hair finding and the authors' own framing of it as a
      phenotype expansion.

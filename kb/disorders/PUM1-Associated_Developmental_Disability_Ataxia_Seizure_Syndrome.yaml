  evidence:
  - reference: PMID:35386260
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| Ocular abnormalities | Exotropia | Hypermetropia and exotropia | Astigmatism with esotropia | Cortical visual impairment | ND | ND | ND | Esotropia | ND |"
    explanation: The tabulated ocular findings across the reported cases, showing
      exotropia and esotropia in four children.
- category: Ophthalmologic
  name: Cerebral visual impairment
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Cerebral visual impairment
    term:
      id: HP:0100704
      label: Cerebral visual impairment
  description: >-
    Cortical visual impairment was documented in the more severely affected of the two
    founding missense probands, the girl with infantile-onset epileptic encephalopathy.
  evidence:
  - reference: PMID:29474920
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she suffers global developmental delay, cortical visual impairment, stereotypic hand-clasping, scoliosis, facial dysmorphia, and low bone mineral density in the neck of femur"
    explanation: Lists cortical visual impairment among this proband's features.
- category: Behavioral

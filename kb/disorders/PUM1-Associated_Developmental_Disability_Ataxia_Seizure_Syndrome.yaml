  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Motor stereotypy
    term:
      id: HP:0000733
      label: Motor stereotypy
  description: >-
    Stereotypic hand-clasping was recorded in one founding missense proband. Together
    with the severe developmental delay and loss of purposeful hand use this can prompt
    consideration of a Rett-like disorder.
  evidence:
  - reference: PMID:29474920
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she suffers global developmental delay, cortical visual impairment, stereotypic hand-clasping, scoliosis, facial dysmorphia, and low bone mineral density in the neck of femur"
    explanation: Records the hand stereotypy.
- category: Musculoskeletal
  name: Scoliosis
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  description: >-
    Lateral curvature of the spine, reported in one founding missense proband. In a child
    with hypotonia and limited ambulation, spinal surveillance is part of routine
    neurodisability follow-up regardless of how often it is reported in this small
    literature.
  evidence:
  - reference: PMID:29474920
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she suffers global developmental delay, cortical visual impairment, stereotypic hand-clasping, scoliosis, facial dysmorphia, and low bone mineral density in the neck of femur"
    explanation: Records scoliosis in this proband.
- category: Musculoskeletal
  name: Reduced bone mineral density
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  description: >-
    Bone mineral density four standard deviations below the age-matched mean at the
    femoral neck in one founding proband. Low bone density is expected in a non-ambulant
    child with epilepsy on enzyme-inducing antiseizure medication, so it is recorded here
    as a documented finding rather than as evidence of a primary skeletal role for PUM1.
  evidence:
  - reference: PMID:29474920
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low bone mineral density in the neck of femur (4 standard deviations below normal for age)"
    explanation: Quantifies the bone density deficit in this proband.
- category: Genitourinary
  name: Cryptorchidism
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Cryptorchidism
    term:
      id: HP:0000028
      label: Cryptorchidism
  description: >-
    Undescended testes in both male subjects in the founding cohort for whom this was
    recorded, which the authors link to the testicular hypoplasia of Pum1 knockout mice.
    Genital examination belongs in the assessment of a boy with this diagnosis.
  evidence:
  - reference: PMID:29474920
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two male subjects have cryptorchidism, which is consistent with the testicular hypoplasia reported in Pum1 knockout mice"
    explanation: Reports cryptorchidism in the male probands and its mouse counterpart.
- category: Neurologic
  name: Microcephaly
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  description: >-
    Reported in one child with the recurrent de novo p.Arg1147Trp allele, alongside hair
    dysplasia. Head circumference is not small in most published PADDAS children, so this

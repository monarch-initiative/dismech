name: PUM1-Associated Developmental Disability, Ataxia, and Seizure Syndrome
creation_date: '2026-09-26T00:00:00Z'
category: Mendelian
synonyms:
- PADDAS
- PUM1-associated developmental disability-ataxia-seizure syndrome
- neurodevelopmental disorder with motor abnormalities, seizures, and facial dysmorphism
- Pumilio1-associated developmental disability, ataxia, and seizure syndrome
description: >-
  A de novo dominant neurodevelopmental disorder caused by heterozygous loss of
  one functional copy of PUM1, which encodes Pumilio1, a sequence-specific
  RNA-binding translational repressor. Presentation is in infancy or early
  childhood with global developmental delay, intellectual disability, early-onset
  seizures, ataxia and other motor abnormalities, poor somatic growth, and
  dysmorphic facial features.

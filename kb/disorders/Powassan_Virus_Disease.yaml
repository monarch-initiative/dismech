name: Powassan Virus Disease
creation_date: "2026-11-04T02:33:28Z"
category: Infectious Disease
description: >-
  Powassan virus disease is an emerging tick-borne flaviviral infection of North
  America (and parts of Russia), transmitted by Ixodes ticks. Most infections
  are asymptomatic or cause a febrile illness, but severe neuroinvasive disease
  (meningitis, encephalitis) carries a case-fatality of roughly 10-30% and
  leaves about half of survivors with long-term neurological sequelae. Its
  geographic range and reported incidence are both increasing, and there is no
  licensed vaccine or specific antiviral.
disease_term:
  term:
    id: MONDO:0000276
    label: Powassan encephalitis
  preferred_term: Powassan virus disease
synonyms:
- Powassan encephalitis
- Powassan virus infection
notes: >-
  The bound MONDO term MONDO:0000276 is labelled "Powassan encephalitis", which
  is narrower than the clinical entity curated here (CDC "Powassan virus
  disease" spans febrile and neuroinvasive forms); no broader MONDO term exists,
  so this is a candidate upstream MONDO label/scope report. No GeneReviews
  chapter exists (an arboviral infection, not a Mendelian disorder).
parents:
- Arbovirus Infection
infectious_agent:
- name: Powassan virus
  infectious_agent_term:
    preferred_term: Powassan virus
    term:
      id: NCBITaxon:11083
      label: Powassan virus
  description: >-
    An enveloped, positive-sense single-stranded RNA orthoflavivirus of the
    family Flaviviridae, the only North American member of the tick-borne
    encephalitis serogroup. Two genetic lineages exist: lineage I (prototype)
    and lineage II (deer tick virus).
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Powassan viruses are emergent tick-borne Flaviviruses (FV) associated with severe encephalitic disease and long-term neurologic sequelae"
    explanation: Identifies POWV as a tick-borne flavivirus.
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "POWV has two distinct genetic lineages, Lineage I (POWV-LB) and Lineage II (POWV-Spooner, Deer-tick virus, POWV-Long Island 9), spread by different species of ticks"
    explanation: Documents the two POWV lineages.
agent_life_cycle:
  description: >-
    POWV is maintained in an enzootic cycle between Ixodes ticks and small- to
    medium-sized mammals (white-footed mice, groundhogs, squirrels, skunks).
    Lineage I is associated mainly with Ixodes cookei and lineage II with Ixodes
    scapularis. Humans are incidental dead-end hosts, developing viremia too low
    to infect new ticks.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: dead-end (incidental) host
  - preferred_term: white-footed mouse
    term:
      id: NCBITaxon:10041
      label: Peromyscus leucopus
    role: enzootic reservoir
  - preferred_term: Blacklegged (deer) tick (vector host, lineage II)
    role: vector host
    term:
      id: NCBITaxon:6945
      label: Ixodes scapularis
  - preferred_term: Groundhog tick (vector host, lineage I)
    role: vector host
    term:
      id: NCBITaxon:35565
      label: Ixodes cookei
  vectors:
  - Ixodes scapularis (blacklegged/deer tick; lineage II)
  - Ixodes cookei (groundhog tick; lineage I)
transmission:
- name: Ixodes tick bite transmission
  description: >-
    POWV is transmitted in the saliva of an attached Ixodes tick. Unlike the
    Lyme-disease agent, which needs many hours of attachment, POWV can be
    transmitted within about 15 minutes of tick attachment.
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "POWV spreads from an Ixodes tick to the host through tick saliva in as little as 15 minutes"
    explanation: States the rapid salivary transmission by Ixodes ticks.
pathophysiology:
- name: Tick-Bite Inoculation and Flaviviral Entry
  biological_scale: MOLECULAR
  description: >-
    POWV in tick saliva infects permissive cells at the bite site - thought to
    include keratinocytes and dendritic Langerhans cells - entering via
    receptor-mediated endocytosis, with endosomal acidification driving fusion
    of the viral envelope and release of the genome into the cytoplasm.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: Langerhans cell
    term:
      id: CL:0000453
      label: Langerhans cell
  biological_processes:
  - preferred_term: endocytosis involved in viral entry into host cell
    term:
      id: GO:0075509
      label: endocytosis involved in viral entry into host cell
  downstream:
  - target: Peripheral Replication and Viremia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cellular targets at the bite site of tick-borne FVs are thought to include keratinocytes and dendritic Langerhans cells"
    explanation: Names the cellular targets at the bite site.
- name: Peripheral Replication and Viremia
  biological_scale: ORGANISM
  description: >-
    Following entry, the flaviviral genome is translated and replicated and
    progeny virions disseminate, producing a peripheral viremic phase that
    precedes central nervous system invasion.
  downstream:
  - target: Blood-Brain Barrier Disruption and Neuroinvasion
    causal_link_type: DIRECT
  - target: Fever
  - target: Headache
  evidence:
  - reference: PMID:42577415
    reference_title: "Characterization of virus neuroinvasion, blood-brain barrier integrity and neuroinflammation following Powassan virus infection in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "POWV effectively replicates in WT mice, where replication and dissemination resulted in peripheral and neurotropic phases"
    explanation: >-
      A mouse model shows the biphasic peripheral-then-neurotropic course this
      node asserts.
- name: Blood-Brain Barrier Disruption and Neuroinvasion
  biological_scale: TISSUE
  conforms_to: "blood_brain_barrier_breakdown#Blood-Brain Barrier Permeability Increase"
  description: >-
    Neuroinvasion is the critical determinant of outcome. POWV entry into the
    CNS is accompanied by enhanced blood-brain barrier permeability, with
    inflammatory cytokines (TNF-alpha, IL-1beta) contributing to loss of barrier
    integrity.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  biological_processes:
  - preferred_term: cytokine-mediated signaling pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
  downstream:
  - target: Neuroinflammation and Glial Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42577415
    reference_title: "Characterization of virus neuroinvasion, blood-brain barrier integrity and neuroinflammation following Powassan virus infection in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Viral neuroinvasion correlated with severe neuropathological alterations as well as enhanced blood-brain barrier permeability."
    explanation: Links neuroinvasion to BBB permeability.
  - reference: PMID:42577415
    reference_title: "Characterization of virus neuroinvasion, blood-brain barrier integrity and neuroinflammation following Powassan virus infection in mice."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "inflammatory cytokines such as tumor necrosis factor alpha (TNF-α) and interleukin (IL)-1β have been shown to alter the BBB integrity"
    explanation: Names the cytokines implicated in BBB disruption.
- name: Neuroinflammation and Glial Activation
  biological_scale: TISSUE
  conforms_to: "neuroinflammation_glial_activation#Reactive Microglial and Astrocytic Activation"
  description: >-
    Within the CNS, POWV drives reactive microglial and astrocyte activation and
    infiltration of peripheral immune cells, with a histopathological predilection
    for gray matter (thalamus, midbrain, cerebellum). Neuroinflammation can
    persist in survivors.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
  downstream:
  - target: Neuronal Death
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42577415
    reference_title: "Characterization of virus neuroinvasion, blood-brain barrier integrity and neuroinflammation following Powassan virus infection in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "demonstrated increased activation of microglia (IBA1) and astrocytes (GFAP), infiltration of peripheral immune cells (CD45), and elevated neuronal cell death (TUNEL) in POWV-infected brains"
    explanation: >-
      Documents microglial/astrocyte activation and immune infiltration in
      POWV-infected brain.
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lymphocytic infiltration of perivascular neuronal tissue can be seen on pathology, with a predilection for gray matter, including the thalamus, midbrain, and cerebellum"
    explanation: Describes the gray-matter neuropathology.
- name: Neuronal Death
  biological_scale: TISSUE
  description: >-
    POWV-driven neuroinflammation leads to neuronal death through apoptotic and
    senescence-associated pathways, the substrate of the encephalitic syndrome
    and its long-term neurological sequelae.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
  downstream:
  - target: Viral encephalitis
  - target: Meningitis
  - target: Seizure
  - target: Ataxia
  - target: Paralysis
  - target: Memory impairment
  - target: Aphasia
  - target: Cognitive impairment
  - target: Ophthalmoplegia
  evidence:
  - reference: PMID:42577415
    reference_title: "Characterization of virus neuroinvasion, blood-brain barrier integrity and neuroinflammation following Powassan virus infection in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased protein expression of caspase-3 and p16 further indicated activation of apoptotic and senescence-associated pathways."
    explanation: Supports the apoptotic and senescence pathways driving neuronal death.

name: Powassan Virus Disease
creation_date: "2026-11-04T02:33:28Z"
updated_date: "2026-11-08T03:00:00Z"
category: Infectious Disease
description: >-
  Powassan virus disease is an emerging tick-borne flaviviral infection of North
  America (and parts of Russia), transmitted by Ixodes ticks. Most infections
  are asymptomatic or cause a febrile illness, but severe neuroinvasive disease
  (meningitis, encephalitis) carries a case-fatality of roughly 10-30% and
  leaves about half of survivors with long-term neurological sequelae. Its
  geographic range and reported incidence are both increasing, and there is no
  licensed vaccine or specific antiviral.
disease_term:
  term:
    id: MONDO:0000276
    label: Powassan encephalitis
  preferred_term: Powassan virus disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    notes: Tick-borne arboviral infection caused by Powassan virus (Orthoflavivirus, Flaviviridae) transmitted by Ixodes ticks.
    evidence:
    - reference: PMID:40545598
      reference_title: "Pathogenicity and virulence of Powassan virus."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Powassan viruses (POWV) are emergent tick-borne Flaviviruses that cause severe encephalitis and long-term neurologic sequelae in patients."
      explanation: "Establishes Powassan virus disease as a tick-borne flaviviral infectious disease."
  - classification_value: NEUROLOGIC
    notes: Neuroinvasive arboviral disease causing meningoencephalitis, gray-matter neuroinflammation, paralysis, and long-term neurological deficits.
    evidence:
    - reference: PMID:38133440
      reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Between 2004 and 2022, a total of 288 cases have been reported to the CDC, of which 267 (92.7%) pertained to neuroinvasive disease, 264 (91.7%) required hospitalization, and 36 (12.5%) resulted in death."
      explanation: "Demonstrates that the overwhelming majority of reported clinical cases involve central nervous system neuroinvasive disease."
synonyms:
- Powassan encephalitis
- Powassan virus infection
notes: >-
  The bound MONDO term MONDO:0000276 is labelled "Powassan encephalitis", which
  is narrower than the clinical entity curated here (CDC "Powassan virus
  disease" spans febrile and neuroinvasive forms); no broader MONDO term exists,
  so this is a candidate upstream MONDO label/scope report. No GeneReviews
  chapter exists (an arboviral infection, not a Mendelian disorder).
parents:
- Arbovirus Infection
infectious_agent:
- name: Powassan virus
  infectious_agent_term:
    preferred_term: Powassan virus
    term:
      id: NCBITaxon:11083
      label: Powassan virus
  description: >-
    An enveloped, positive-sense single-stranded RNA orthoflavivirus of the
    family Flaviviridae, the only North American member of the tick-borne
    encephalitis serogroup. Two genetic lineages exist: lineage I (prototype)
    and lineage II (deer tick virus).
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Powassan viruses are emergent tick-borne Flaviviruses (FV) associated with severe encephalitic disease and long-term neurologic sequelae"
    explanation: Identifies POWV as a tick-borne flavivirus.
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "POWV has two distinct genetic lineages, Lineage I (POWV-LB) and Lineage II (POWV-Spooner, Deer-tick virus, POWV-Long Island 9), spread by different species of ticks"
    explanation: Documents the two POWV lineages.
agent_life_cycle:
  description: >-
    POWV is maintained in an enzootic cycle between Ixodes ticks and small- to
    medium-sized mammals (white-footed mice, groundhogs, squirrels, skunks).
    Lineage I is associated mainly with Ixodes cookei and lineage II with Ixodes
    scapularis. Humans are incidental dead-end hosts, developing viremia too low
    to infect new ticks.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: dead-end (incidental) host
  - preferred_term: white-footed mouse
    term:
      id: NCBITaxon:10041
      label: Peromyscus leucopus
    role: enzootic reservoir
  - preferred_term: Blacklegged (deer) tick (vector host, lineage II)
    role: vector host
    term:
      id: NCBITaxon:6945
      label: Ixodes scapularis
  - preferred_term: Groundhog tick (vector host, lineage I)
    role: vector host
    term:
      id: NCBITaxon:35565
      label: Ixodes cookei
  vectors:
  - Ixodes scapularis (blacklegged/deer tick; lineage II)
  - Ixodes cookei (groundhog tick; lineage I)
transmission:
- name: Ixodes tick bite transmission
  description: >-
    POWV is transmitted in the saliva of an attached Ixodes tick. Unlike the
    Lyme-disease agent, which needs many hours of attachment, POWV can be
    transmitted within about 15 minutes of tick attachment.
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "POWV spreads from an Ixodes tick to the host through tick saliva in as little as 15 minutes"
    explanation: States the rapid salivary transmission by Ixodes ticks.
pathophysiology:
- name: Tick-Bite Inoculation and Flaviviral Entry
  biological_scale: MOLECULAR
  description: >-
    POWV in tick saliva infects permissive cells at the bite site - thought to
    include keratinocytes and dendritic Langerhans cells - entering via
    receptor-mediated endocytosis, with endosomal acidification driving fusion
    of the viral envelope and release of the genome into the cytoplasm.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: Langerhans cell
    term:
      id: CL:0000453
      label: Langerhans cell
  locations:
  - preferred_term: zone of skin
    term:
      id: UBERON:0000014
      label: zone of skin
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  biological_processes:
  - preferred_term: endocytosis involved in viral entry into host cell
    term:
      id: GO:0075509
      label: endocytosis involved in viral entry into host cell
  downstream:
  - target: Peripheral Replication and Viremia
    causal_link_type: DIRECT
  evidence:

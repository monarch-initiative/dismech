diagnosis:
- name: Diagnosis of Powassan virus disease
  description: >-
    Diagnosis rests on serology (POWV-specific IgM and neutralizing antibodies)
    and, within the narrow viremic window, molecular testing; CNS disease is
    confirmed with CSF examination and supportive neuroimaging. Diagnosis is
    frequently delayed because the disease is rare and testing is specialized.
  evidence:
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis was confirmed in all cases through testing of the serum samples or CSF for Powassan virus-neutralizing antibodies or genetic material."
    explanation: Confirmation is by serum/CSF neutralizing antibodies or viral genetic material.
  - reference: PMID:42182837
    reference_title: "Delays in Diagnosis of Powassan Virus Encephalitis-Vermont, 2022-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two recent POWV encephalitis cases reported in Vermonters; both experienced diagnostic delays."
    explanation: Documents the diagnostic delay that is common for this rare disease.
progression:
- phase: Acute phase
  notes: >-
    Acute symptoms begin roughly 1-5 weeks after the tick bite. Severe POWV
    disease is biphasic: this acute phase is followed by an encephalitic phase.
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severe POWV infections are biphasic, with acute symptoms beginning 1–5 weeks post-tick bite, followed by encephalitis that can persist for several weeks to months"
    explanation: Describes the acute phase and the biphasic course.
- phase: Encephalitic phase
  notes: >-
    In severe disease the acute phase is followed by encephalitis that can
    persist for several weeks to months, with long-term neurological sequelae in
    about half of survivors.
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "followed by encephalitis that can persist for several weeks to months"
    explanation: The encephalitic phase follows the acute phase and is prolonged.
prevalence:
- population: United States, reported to CDC, 2004-2022
  measure_type: CASES_IN_LITERATURE
  notes: >-
    288 cases reported 2004-2022, of which 92.7% were neuroinvasive and 12.5%
    fatal; reported incidence is rising with the expanding range of vector ticks.
  evidence:
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Between 2004 and 2022, a total of 288 cases have been reported to the CDC, of which 267 (92.7%) pertained to neuroinvasive disease, 264 (91.7%) required hospitalization, and 36 (12.5%) resulted in death."
    explanation: Gives the CDC-reported case burden and severity breakdown.
treatments:
- name: Supportive Care
  description: >-
    There is no licensed vaccine and no specific antiviral for POWV; management
    is supportive, with intensive neurological and respiratory support for
    severe neuroinvasive disease.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "there are currently no licenced vaccines or therapeutics for treating POWV disease"
    explanation: States the absence of specific vaccines or therapeutics.

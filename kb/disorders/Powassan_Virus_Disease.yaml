diagnosis:
- name: Diagnosis of Powassan virus disease
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  presence: Positive
  results: Positive POWV-specific IgM immunoassay and plaque-reduction neutralizing antibodies in serum and/or CSF, or detection of POWV RNA in CSF by RT-PCR or metagenomic next-generation sequencing.
  description: >-
    Diagnosis rests on serology (POWV-specific IgM and neutralizing antibodies)
    and, within the narrow viremic window, molecular testing; CNS disease is
    confirmed with CSF examination and supportive neuroimaging. Diagnosis is
    frequently delayed because the disease is rare and testing is specialized.
  evidence:
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis was confirmed in all cases through testing of the serum samples or CSF for Powassan virus-neutralizing antibodies or genetic material."
    explanation: Confirmation is by serum/CSF neutralizing antibodies or viral genetic material.
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Specifically, immunoassays for Powassan virus IgM were used to identify 80 cases (95.2%)—either in serum for 61 cases (72.6%), in CSF for 38 cases (45.2%), or in both for 17 cases (20.2%)."
    explanation: Quantifies the diagnostic role of serum and CSF Powassan virus IgM immunoassays across published cases.
  - reference: PMID:42182837
    reference_title: "Delays in Diagnosis of Powassan Virus Encephalitis-Vermont, 2022-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two recent POWV encephalitis cases reported in Vermonters; both experienced diagnostic delays."
    explanation: Documents the diagnostic delay that is common for this rare disease.
- name: Lumbar Puncture and Cerebrospinal Fluid Analysis
  diagnosis_term:
    preferred_term: Lumbar Puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  presence: Positive
  results: Lymphocytic pleocytosis (median WBC 119/mL in adults and 137.5/mL in children), elevated CSF protein, normal glucose, and detectable POWV-neutralizing antibodies.
  description: >-
    Cerebrospinal fluid examination obtained by lumbar puncture demonstrates
    lymphocytic-predominant pleocytosis and elevated protein and provides CSF for
    POWV IgM, neutralizing antibody titers, and viral PCR/mNGS.
  evidence:
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lumbar puncture was performed in 79 (94%) of patients, with findings summarized in Table 4."
    explanation: Establishes lumbar puncture and CSF analysis as standard in the diagnostic evaluation of neuroinvasive POWV.
- name: Brain Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: Positive
  results: T2/FLAIR hyperintensities most commonly involving the basal ganglia (32.1%), cerebral cortex (26.8%), cerebellum (21.4%), thalamus (14.3%), and midbrain (8.9%), with occasional leptomeningeal enhancement.
  description: >-
    Brain MRI characterizes the distribution of encephalitic gray-matter and
    posterior-fossa involvement, particularly basal ganglia, thalamic, and
    cerebellar T2/FLAIR hyperintensities.
  evidence:
  - reference: PMID:38133440
    reference_title: "Powassan Virus Infections: A Systematic Review of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the adults, the most commonly affected location was the basal ganglia, observed in 32.1% of cases. This was followed by cerebral involvement (26.8%) and cerebellar involvement (21.4%)."
    explanation: Documents the characteristic anatomical distribution of brain MRI abnormalities in adult POWV encephalitis.
progression:
- phase: Acute phase
  notes: >-
    Acute symptoms begin roughly 1-5 weeks after the tick bite. Severe POWV
    disease is biphasic: this acute phase is followed by an encephalitic phase.
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severe POWV infections are biphasic, with acute symptoms beginning 1–5 weeks post-tick bite, followed by encephalitis that can persist for several weeks to months"
    explanation: Describes the acute phase and the biphasic course.
- phase: Encephalitic phase
  notes: >-
    In severe disease the acute phase is followed by encephalitis that can
    persist for several weeks to months, with long-term neurological sequelae in
    about half of survivors.
  evidence:
  - reference: PMID:40545598
    reference_title: "Pathogenicity and virulence of Powassan virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "followed by encephalitis that can persist for several weeks to months"
    explanation: The encephalitic phase follows the acute phase and is prolonged.

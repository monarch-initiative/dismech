  evidence:
  - reference: PMID:19648921
    reference_title: Mutations in PYCR1 cause cutis laxa with progeroid features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altered mitochondrial morphology, membrane potential and increased
      apoptosis rate upon oxidative stress were evident in fibroblasts from
      affected individuals.
    explanation: Patient fibroblasts show increased oxidative-stress-induced apoptosis.
  - reference: PMID:26733354
    reference_title: PYCR1 and PYCR2 Interact and Collaborate with RRM2B to Protect Cells from Overt Oxidative Stress.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Silencing of both PYCR1 and PYCR2 by expressing short hairpin RNAs
      induced defects in cell proliferation, partial fragmentation of the
      mitochondrial network, and hypersensitivity to oxidative stress in
      hTERT-immortalized human foreskin fibroblasts (HFF-hTERT).
    explanation: >-
      Combined PYCR1/PYCR2 knockdown in normal fibroblasts reproduces the

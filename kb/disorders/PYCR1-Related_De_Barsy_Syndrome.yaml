animal_models:
- name: pycr1 knockout zebrafish
  species: Zebrafish
  genotype: pycr1 homozygous 2-bp deletion in exon 4 (knockout)
  publication: PMID:31091804
  description: >-
    Stable pycr1 knockout zebrafish are viable but show apoptosis and
    senescence from the embryo or larva stage, reduced proline and
    extracellular matrix content, a progeroid phenotype from 4 months and about
    50% mortality by 6 months.
  modeled_mechanisms:
  - target: Increased Oxidative-Stress-Induced Apoptosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces increased apoptosis and reduced antioxidant capacity in vivo.
    limitations: >-
      Fish skin, lifespan and paralogue complement differ from human; the
      ageing and behavioural phenotypes have no direct human counterpart in
      the congenital disorder.
    evidence:
    - reference: PMID:31091804
      reference_title: Zebrafish Carrying pycr1 Gene Deficiency Display Aging and Multiple Behavioral Abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Marked apoptosis and senescence were detected in pycr1 KO zebrafish
      explanation: The knockout shows the apoptosis node in vivo.
  - target: Impaired Mitochondrial Proline Biosynthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Adult knockout fish have reduced proline content.
    evidence:
    - reference: PMID:31091804
      reference_title: Zebrafish Carrying pycr1 Gene Deficiency Display Aging and Multiple Behavioral Abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Biochemical assays showed that adult pycr1 KO fish have significantly
        reduced proline and extracellular matrix contents
      explanation: Measured proline reduction in the knockout.
- name: pycr1 morpholino knockdown Xenopus and zebrafish embryos
  species: Xenopus
  genotype: morpholino knockdown of the PYCR1 orthologues
  publication: PMID:19648921
  description: >-

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient displayed characteristic symptoms of ARCL2B, which were
      consistent with previous reports, including wrinkled and/or sagging
      skin, distinct facial dysmorphism, hyperlaxity of joints, growth
      retardation, hypotonia, and psychomotor developmental delay.
    explanation: >-
      Homozygous PYCR1 patient with wrinkled and sagging skin.

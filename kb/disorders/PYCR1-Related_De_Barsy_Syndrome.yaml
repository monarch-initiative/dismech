      grows older
    explanation: >-
      Thin skin in PYCR1-related ARCL2B infants, improving with age.
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These disorders are characterized by thin, translucent skin with
      wrinkles (especially on the hands and feet); typical facial
      characteristics including a triangular face with a progeroid appearance,
      a broad forehead (prominent-appearing neurocranium due to small
      viscerocranium), convex nasal ridge, full or sagging cheeks, and pointed
      chin; moderate-to-severe intellectual disability or mild intellectual
      disability with additional neurodiverse phenotypes including autism
      spectrum disorder or attention-deficit/hyperactivity disorder; and pre-
      and postnatal growth deficiency.
    explanation: >-
      Thin, translucent skin. GeneReviews statement pooled across PYCR1- and
      ALDH18A1-related disease, so it is supporting rather than
      PYCR1-specific.

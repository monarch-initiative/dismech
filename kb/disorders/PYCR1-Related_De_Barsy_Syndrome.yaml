genetic:
- name: PYCR1
  gene_term:
    preferred_term: PYCR1
    term:
      id: hgnc:9721
      label: PYCR1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    PYCR1 (17q25.3) encodes mitochondrial pyrroline-5-carboxylate reductase 1,
    which reduces delta-1-pyrroline-5-carboxylate to proline with oxidation of
    NAD(P)H. Reported disease alleles include missense, splice-site, nonsense,
    frameshift and whole-gene deletion variants; most cluster in exons 4 to 6.
    Missense alleles reduce protein abundance or catalytic activity, and some
    are predicted to interfere with PYCR1 multimerization. Patients with
    variants in the first two exons had lower average clinical scores and
    absent or mild intellectual disability, but the correlation is imperfect.
  evidence:
  - reference: PMID:19648921
    reference_title: Mutations in PYCR1 cause cutis laxa with progeroid features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping in several kindreds with ARCL identified a candidate
      region on chromosome 17q25. By high-throughput sequencing of the entire
      candidate region, we detected disease-causing mutations in the gene PYCR1.
    explanation: The founding gene-discovery study identifies PYCR1 mutations in ARCL kindreds.
  - reference: PMID:24035636
    reference_title: Genotype-phenotype spectrum of PYCR1-related autosomal recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort we identified 20 different PYCR1 mutations of which seven
      were novel. Most of the mutations accumulated in exons 4 to 6. Missense
      alterations of highly conserved residues were most frequent followed by
      splice site changes and a single nonsense mutation.
    explanation: Describes the PYCR1 allelic spectrum in the largest cohort.
  - reference: PMID:24035636
    reference_title: Genotype-phenotype spectrum of PYCR1-related autosomal recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of genotype-phenotype correlation revealed that patients with
      mutations in the first two exons had lower average clinical scores and
      absent or only mild intellectual disability.
    explanation: Supports the stated genotype-severity correlation.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ca242cd8-1f57-4c7b-ba97-5ec0c97b425b-2020-05-21T191607.864Z
    subtype: ARCL2B
    notes: >-
      ClinGen classified PYCR1 for autosomal recessive cutis laxa type 2B
      (MONDO:0013051), the has_subtypes row of this entry. No ClinGen record
      names MONDO:0013755 itself.
    evidence:
    - reference: CGGV:assertion_ca242cd8-1f57-4c7b-ba97-5ec0c97b425b-2020-05-21T191607.864Z
      reference_title: PYCR1 / autosomal recessive cutis laxa type 2B (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PYCR1 | HGNC:9721 | autosomal recessive cutis laxa type 2B | MONDO:0013051 | AR | Definitive"
      explanation: ClinGen classifies the PYCR1-ARCL2B relationship as definitive with autosomal recessive inheritance.
  variants:
  - name: c.797G>A (p.Arg266Gln)
    description: >-
      Homozygous missense variant at the last nucleotide of exon 6 found in
      ARCL2 families from an eastern Canadian subpopulation isolate. It causes
      skipping of exon 6, deleting the reductase functional domain and shifting
      the downstream reading frame.
    evidence:
    - reference: PMID:19576563
      reference_title: Mutation in pyrroline-5-carboxylate reductase 1 gene in families with cutis laxa type 2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Skipping of the associated exon was confirmed in RNA from blood
        lymphocytes of affected homozygotes and heterozygous mutation carriers.
        Exon skipping leads to deletion of the reductase functional
        domain-coding region and an obligatory downstream frameshift.
      explanation: Patient RNA shows the splice consequence of the founder allele.
  - name: c.559G>A (p.Ala187Thr)
    description: >-
      Homozygous missense variant in a Chinese child with severe developmental
      delay. In transfected HEK293T cells the mutant protein was less abundant
      and had about half the wild-type reductase activity.
    evidence:
    - reference: PMID:39172257
      reference_title: Confirming the enzymatic activity and neurodevelopmental trajectory of PYCR1 mutation in one child with autosomal-recessive cutis laxa type 2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The in vitro assay showed significantly decreased
        3,4-dehydro-L-proline dehydrogenase activity in Mut cells compared with
        WT cells (17.78 ± 0.62 vs. 8.12 ± 0.64 nmol/min/mg protein
      explanation: Transfected-cell enzyme assay showing reduced activity of the p.Ala187Thr protein.
pathophysiology:
- name: Biallelic PYCR1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic PYCR1 variants reduce the amount or catalytic activity of
    mitochondrial pyrroline-5-carboxylate reductase 1. A null allele with a
    second missense allele lowered PYCR1 mRNA and protein in patient skin
    fibroblasts, and a homozygous missense allele lowered protein abundance and
    reductase activity in transfected cells.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: PYCR1
    modifier: DECREASED
    term:
      id: hgnc:9721
      label: PYCR1
  molecular_functions:
  - preferred_term: pyrroline-5-carboxylate reductase activity
    modifier: DECREASED
    term:
      id: GO:0004735
      label: pyrroline-5-carboxylate reductase activity
  evidence:
  - reference: PMID:22052856
    reference_title: Compound heterozygous mutations in PYCR1 further expand the phenotypic spectrum of De Barsy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The effect of mutation results in a reduction of PYCR1 mRNA expression and
      PYCR1 protein expression in skin fibroblasts from the patient.
    explanation: Patient fibroblasts from a de Barsy syndrome case show reduced PYCR1 expression.
  - reference: PMID:39172257
    reference_title: Confirming the enzymatic activity and neurodevelopmental trajectory of PYCR1 mutation in one child with autosomal-recessive cutis laxa type 2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutagenesis and enzyme assay study revealed decreased activity of the
      mutant protein in vitro, indicating that this mutation impairs PYCR1
      function.
    explanation: A patient missense allele reduces PYCR1 catalytic activity.
  downstream:
  - target: Impaired Mitochondrial Proline Biosynthesis
    description: >-
      PYCR1 performs the final reduction of pyrroline-5-carboxylate to proline,
      so its loss is expected to reduce de novo proline synthesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19576563
      reference_title: Mutation in pyrroline-5-carboxylate reductase 1 gene in families with cutis laxa type 2.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Similarly, loss of PYCR1 activity in our patients would be expected to
        reduce proline biosynthesis.
      explanation: >-
        The authors infer reduced proline synthesis from loss of PYCR1
        activity in their patients; it is an expectation, not a measurement.
    - reference: PMID:31091804
      reference_title: Zebrafish Carrying pycr1 Gene Deficiency Display Aging and Multiple Behavioral Abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Biochemical assays showed that adult pycr1 KO fish have significantly
        reduced proline and extracellular matrix contents
      explanation: pycr1 knockout zebrafish have measurably reduced proline.
  - target: Mitochondrial Morphology and Membrane Potential Defect
    description: >-
      Fibroblasts from affected individuals show altered mitochondria. Whether
      this follows from proline shortage, altered NAD(P)H redox balance, or
      another PYCR1 function is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19648921
      reference_title: Mutations in PYCR1 cause cutis laxa with progeroid features.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Altered mitochondrial morphology, membrane potential and increased
        apoptosis rate upon oxidative stress were evident in fibroblasts from
        affected individuals.
      explanation: Patient fibroblasts carrying PYCR1 mutations show the mitochondrial defect.
  - target: Neurodevelopmental Impairment
    description: >-
      PYCR1 loss is associated with hypotonia, psychomotor delay and variable
      intellectual disability; the neural mechanism is unknown, and severity
      tracks the location of the variant.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24035636
      reference_title: Genotype-phenotype spectrum of PYCR1-related autosomal recessive cutis laxa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analysis of genotype-phenotype correlation revealed that patients with
        mutations in the first two exons had lower average clinical scores and
        absent or only mild intellectual disability.
      explanation: Neurodevelopmental severity varies with PYCR1 genotype, linking the lesion to the neural phenotype.
  - target: Intrauterine growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Prenatal growth restriction is a hallmark of PYCR1 deficiency; the mechanism is unknown.
  - target: Postnatal growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Postnatal growth deficiency accompanies PYCR1 deficiency; the mechanism is unknown.
  - target: Strabismus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Strabismus occurs in about a third of evaluated patients; the mechanism is unknown.
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Lens opacity occurs in a minority of patients; the mechanism is unknown.
  - target: Glaucoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Glaucoma has been reported in individual patients; the mechanism is unknown.
  - target: Osteopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced bone mineralization occurs in PYCR1 deficiency; the bone mechanism is unknown.
  - target: Wormian bones
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Wormian bones are reported in PYCR1 deficiency; the mechanism is unknown.
  - target: Large fontanelles
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: An open or large fontanel is reported in PYCR1 deficiency; the mechanism is unknown.
  - target: Adducted thumb
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Adducted thumbs are reported in PYCR1 deficiency; the mechanism is unknown.
  - target: Aortic root dilatation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Aortic root dilatation was reported in one de Barsy patient; the mechanism is unknown.
- name: Impaired Mitochondrial Proline Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    Reduced conversion of pyrroline-5-carboxylate to proline in mitochondria.
    In mouse the paralogue Pycr2 can supply proline when Pycr1 is lost, so the
    size of the systemic proline deficit in patients is uncertain.
  biological_processes:
  - preferred_term: L-proline biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0055129
      label: L-proline biosynthetic process
  evidence:
  - reference: PMID:31091804
    reference_title: Zebrafish Carrying pycr1 Gene Deficiency Display Aging and Multiple Behavioral Abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Biochemical assays showed that adult pycr1 KO fish have significantly
      reduced proline and extracellular matrix contents
    explanation: Loss of pycr1 lowers proline content in a vertebrate model.
  - reference: PMID:33734376
    reference_title: Genetic analysis of Pycr1 and Pycr2 in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, Pycr1 and -2 have redundant functions in proline biosynthesis, and
      their loss makes proline a semi-essential amino acid.
    explanation: >-
      Mouse genetics place PYCR1 in proline biosynthesis and show paralogue
      redundancy that limits the deficit when PYCR1 alone is lost.
  downstream:
  - target: Progeroid Skin and Connective-Tissue Changes
    description: >-
      Elastin is a proline-rich protein abundant in the most affected tissues,
      so reduced local proline supply is the proposed link to the
      connective-tissue phenotype. This remains a hypothesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33734376
      reference_title: Genetic analysis of Pycr1 and Pycr2 in mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        is most logically associated with the demand for the proline-rich
        protein elastin in the affected tissues.
      explanation: >-
        In the authors' discussion the subject of this sentence is the cutis
        laxa phenotype of PYCR1 mutations (the cached full text runs the gene
        name into its neighbouring words, so the quote starts at the verb).
        It proposes elastin's proline demand as the link between PYCR1 loss
        and cutis laxa; it is argument, not a measurement.
    - reference: PMID:31091804
      reference_title: Zebrafish Carrying pycr1 Gene Deficiency Display Aging and Multiple Behavioral Abnormalities.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Biochemical assays showed that adult pycr1 KO fish have significantly
        reduced proline and extracellular matrix contents
      explanation: >-
        Reduced proline and reduced extracellular matrix co-occur in pycr1
        knockout zebrafish; co-occurrence does not show that one causes the other.

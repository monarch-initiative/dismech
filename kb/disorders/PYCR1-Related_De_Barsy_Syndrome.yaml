differential_diagnoses:
- name: ALDH18A1-related de Barsy syndrome
  disease_term:
    preferred_term: ALDH18A1-related de Barsy syndrome
    term:
      id: MONDO:0009053
      label: ALDH18A1-related de Barsy syndrome
  description: >-
    Biallelic ALDH18A1 (P5CS) deficiency, one step upstream in the same
    mitochondrial proline-synthesis pathway, produces an overlapping
    neurocutaneous progeroid cutis-laxa phenotype. GeneReviews covers both in
    one chapter.
  distinguishing_features:
  - Molecular testing distinguishes PYCR1 from ALDH18A1 disease; dystonic posturing and corpus-callosum dysgenesis are shared and do not discriminate between them.
  evidence:
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurocutaneous disorders due to mitochondrial proline synthesis defects
      comprise PYCR1-related autosomal recessive cutis laxa (ARCL),
      ALDH18A1-related ARCL, and ALDH18A1-related autosomal dominant cutis laxa
      (ADCL).
    explanation: GeneReviews groups PYCR1- and ALDH18A1-related ARCL as overlapping disorders of one pathway.
  - reference: PMID:23963297
    reference_title: Clinical and biochemical features guiding the diagnostics in neurometabolic cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dystonic posturing was discriminatory for PYCR1 and ALDH18A1 defects.
    explanation: The same neurological sign points to both proline-synthesis genes, so it cannot separate them.
- name: Autosomal recessive cutis laxa type 2A
  disease_term:
    preferred_term: autosomal recessive cutis laxa type 2A
    term:
      id: MONDO:0018163
      label: autosomal recessive cutis laxa type 2A
  description: >-
    ATP6V0A2-related cutis laxa shares neonatal skin laxity, hypotonia and
    developmental delay. It has abnormal glycosylation and cobblestone brain
    malformation, where PYCR1 disease has normal biochemistry and callosal
    dysgenesis.
  distinguishing_features:
  - Abnormal glycosylation biochemistry supports ARCL2A; it is uninformative for PYCR1 disease.
  - Cobblestone cortical dysgenesis on MRI favours ARCL2A; corpus-callosum dysgenesis or agenesis favours PYCR1 disease.
  evidence:
  - reference: PMID:28294978
    reference_title: "Discriminative Features in Three Autosomal Recessive Cutis Laxa Syndromes: Cutis Laxa IIA, Cutis Laxa IIB, and Geroderma Osteoplastica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI imaging would be expected to differentiate between ARCL2A and
      ARCL2B based on the presence of cobblestone dysgenesis in ARCL2A compared
      to dysgenesis or agenesis of corpus callosum in cutis laxa IIB
    explanation: Distinguishes ARCL2A and PYCR1-related ARCL2B by brain imaging.
  - reference: PMID:28294978
    reference_title: "Discriminative Features in Three Autosomal Recessive Cutis Laxa Syndromes: Cutis Laxa IIA, Cutis Laxa IIB, and Geroderma Osteoplastica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical analysis is good for identification of ARCL2A patients but it
      cannot be used for identification of ARCL2B and GO cases.
    explanation: Biochemical testing identifies ARCL2A but not PYCR1 disease.
- name: Geroderma osteodysplastica
  disease_term:
    preferred_term: geroderma osteodysplastica
    term:
      id: MONDO:0009271
      label: geroderma osteodysplastica
  description: >-
    GORAB-related geroderma osteodysplastica shares wrinkled skin on the dorsum
    of the hands and feet and osteopenia; some PYCR1 families were first
    diagnosed with it.
  distinguishing_features:
  - Severe osteopenia with pathologic fractures and normal intellect favour geroderma osteodysplastica.
  - Intellectual disability favours PYCR1 disease.
  evidence:
  - reference: PMID:21204221
    reference_title: The phenotype caused by PYCR1 mutations corresponds to geroderma osteodysplasticum rather than autosomal recessive cutis laxa type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the patients with GORAB mutations have severe osteopenia, the
      patients with PYCR1 mutations have severe mental retardation.
    explanation: Contrasts the bone and cognitive phenotypes of the two disorders.
  - reference: PMID:28294978
    reference_title: "Discriminative Features in Three Autosomal Recessive Cutis Laxa Syndromes: Cutis Laxa IIA, Cutis Laxa IIB, and Geroderma Osteoplastica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GO have normal mentation, whereas the majority of the
      patients with ARCL2A and ARCL2B have variable degrees of intellectual
      disability.
    explanation: Normal cognition favours geroderma osteodysplastica over PYCR1 disease.

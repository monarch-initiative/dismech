diagnosis:
- name: Molecular Genetic Confirmation
  description: >-
    Diagnosis rests on compatible clinical findings with identification of
    biallelic pathogenic PYCR1 variants. Clinical features overlap with
    ALDH18A1-related ARCL, ATP6V0A2-related ARCL2A and geroderma
    osteodysplastica, so molecular testing is needed to assign the gene.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic pathogenic or likely pathogenic PYCR1 variants.
  evidence:
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of a neurocutaneous disorder due a to mitochondrial proline
      synthesis defect can be established in a proband with characteristic
      clinical findings and identification of biallelic ALDH18A1 or PYCR1
      pathogenic variants
    explanation: GeneReviews diagnostic criterion for PYCR1-related ARCL.

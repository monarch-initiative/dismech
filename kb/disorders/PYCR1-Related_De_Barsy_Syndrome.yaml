name: PYCR1-Related De Barsy Syndrome
creation_date: "2026-10-18T00:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive neurocutaneous connective-tissue disorder caused by
  biallelic pathogenic variants in PYCR1, which encodes mitochondrial
  pyrroline-5-carboxylate reductase 1, the enzyme for the final step of de novo
  proline synthesis. Affected individuals have congenital lax, thin and wrinkled
  skin (most marked on the dorsum of the hands and feet) with visible veins, a
  triangular progeroid face, intrauterine and postnatal growth deficiency,
  hypotonia, psychomotor delay and variable intellectual disability, joint
  hypermobility and congenital hip dislocation, and in a subset corneal
  clouding, cataract, athetoid or dystonic movements, and corpus-callosum
  dysgenesis. The historical labels de Barsy syndrome (cutis laxa, autosomal
  recessive, type IIIB) and autosomal recessive cutis laxa type 2B describe
  overlapping parts of one PYCR1-related spectrum. Patient fibroblasts show
  altered mitochondrial morphology and membrane potential and increased
  apoptosis under oxidative stress.
disease_term:
  preferred_term: PYCR1-related de Barsy syndrome
  term:
    id: MONDO:0013755
    label: PYCR1-related de Barsy syndrome
synonyms:
- ARCL3B
- Cutis laxa, autosomal recessive, type IIIB
- PYCR1 deficiency
- Pyrroline-5-carboxylate reductase 1 deficiency
- De Barsy syndrome caused by mutation in PYCR1
- PYCR1-related autosomal recessive cutis laxa
parents:
- Cutis Laxa
- Inborn Error of Amino Acid Metabolism
notes: >-
  Lump/split decision. The entry is bound to MONDO:0013755 (PYCR1-related de
  Barsy syndrome, OMIM 614438, ARCL3B), the term the curation stub named, and
  carries autosomal recessive cutis laxa type 2B (MONDO:0013051, OMIM 612940,
  ARCL2B) as a has_subtypes row rather than as a second disorder entry. The
  basis is the 33-patient PYCR1 cohort (PMID:24035636), whose patients carried
  initial diagnoses ranging across wrinkly skin syndrome, gerodermia
  osteodysplastica, de Barsy syndrome and progeria and were analysed as one
  PYCR1-related ARCL spectrum with genotype-dependent severity, and the
  GeneReviews chapter (PMID:41570168), which treats PYCR1-related ARCL as one
  disorder. MONDO places the two terms as siblings (ARCL3B under de Barsy
  syndrome and inherited cutis laxa; ARCL2B under autosomal recessive cutis
  laxa type 2), so no mappings.mondo_mappings row is asserted: neither
  exactMatch nor narrowMatch describes ARCL2B relative to the bound term. The
  structure mirrors ALDH18A1_De_Barsy_Spectrum, the P5CS counterpart one step
  upstream in the same pathway. No dismech mechanism module was a genuine fit:
  mitochondrial_dysfunction is scoped to age-associated bioenergetic decline,
  and no elastic-fibre or cutis-laxa module exists. The GeneReviews chapter
  pools PYCR1- and ALDH18A1-related disease, so its abstract is cited only for
  statements it makes about PYCR1 or about the group as a whole, and
  PYCR1-specific primary reports are preferred for phenotypes.
has_subtypes:
- name: ARCL2B
  display_name: Autosomal Recessive Cutis Laxa Type 2B
  subtype_term:
    preferred_term: autosomal recessive cutis laxa type 2B
    term:
      id: MONDO:0013051
      label: autosomal recessive cutis laxa type 2B
  description: >-
    The ARCL2B label covers PYCR1-related patients described as having cutis
    laxa of variable severity, intrauterine growth restriction, congenital hip
    dislocation, joint hyperlaxity, wrinkling of the dorsum of the hands and
    feet and progeroid facial features, with frequent hypotonia and
    developmental delay. It overlaps clinically and genetically with de Barsy
    syndrome (ARCL3B); the same PYCR1 genotypes have received either diagnosis.
  evidence:
  - reference: PMID:24035636
    reference_title: Genotype-phenotype spectrum of PYCR1-related autosomal recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe 33 patients with PYCR1-related ARCL from 27 families with
      initial diagnoses varying between wrinkly skin syndrome, gerodermia
      osteodysplastica, De Barsy syndrome or more severe progeria syndromes.
    explanation: >-
      One PYCR1 cohort includes patients first diagnosed as de Barsy syndrome
      and as other ARCL entities, supporting modelling ARCL2B and ARCL3B as one
      PYCR1-related spectrum.
  - reference: ORPHA:357064
    reference_title: Autosomal recessive cutis laxa type 2B
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare, hereditary, developmental defect with connective tissue
      involvement characterized by cutis laxa of variable severity, in utero
      growth restriction, congenital hip dislocation and joint hyperlaxity,
      wrinkling of the skin, in particular the dorsum of hands and feet, and
      progeroid facial features.
    explanation: Orphanet definition of the ARCL2B branch of the spectrum.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PYCR1 pathogenic variants, homozygous or compound heterozygous,
    cause the disorder. Heterozygous parents and sibs are asymptomatic; when
    both parents are heterozygous each sib has a 25% chance of being affected.
  evidence:
  - reference: PMID:41570168
    reference_title: Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for a pathogenic variant,
      each sib of an individual with PYCR1- or ALDH18A1-related ARCL has at
      conception a 25% chance of being affected, a 50% chance of being
      heterozygous, and a 25% chance of being unaffected and not a carrier.
      Heterozygous sibs of a proband with PYCR1-related ARCL are asymptomatic.
    explanation: >-
      GeneReviews states recessive recurrence risks for PYCR1-related ARCL and
      that heterozygous sibs are asymptomatic.
  - reference: PMID:22052856
    reference_title: Compound heterozygous mutations in PYCR1 further expand the phenotypic spectrum of De Barsy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of PYCR1 revealed compound heterozygous PYCR1
      mutations, including a p.P115fsX7 null mutation allele and a second
      allele with two missense mutations in cis: p.G248E and p.G297R.
    explanation: A de Barsy syndrome patient carries biallelic (compound heterozygous) PYCR1 variants.

- name: Progeroid Skin and Connective-Tissue Changes
  biological_scale: TISSUE
  description: >-
    Skin of affected individuals shows smaller and fragmented elastic fibres
    and irregular collagen fibrils, with loss of subcutaneous fat. These
    connective-tissue changes underlie the lax, thin, wrinkled skin and the
    prematurely aged appearance, and joint laxity is part of the same
    connective-tissue phenotype.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:21487760
    reference_title: "Defect in proline synthesis: pyrroline-5-carboxylate reductase 1 deficiency leads to a complex clinical phenotype with collagen and elastin abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Light- and electron microscopy investigations of skin biopsies showed
      smaller and fragmented elastic fibres, abnormal morphology of the
      mitochondria and their cristae, and slightly abnormal collagen fibril
      diameters with irregular outline and variable size.
    explanation: Patient skin biopsies show the elastic-fibre and collagen-fibril abnormalities.
  - reference: PMID:19648921
    reference_title: Mutations in PYCR1 cause cutis laxa with progeroid features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings link mutations in PYCR1 to altered mitochondrial function
      and progeroid changes in connective tissues.
    explanation: The founding study frames the disease as progeroid connective-tissue change.
  downstream:
  - target: Cutis laxa
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Elastic-fibre and collagen changes in the dermis are the tissue substrate of lax skin.
  - target: Thin skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dermal and subcutaneous connective-tissue loss presents as thin skin.
  - target: Excessive wrinkled skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Lax dermis wrinkles, most visibly on the dorsum of the hands and feet.
  - target: Prominent superficial veins
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Thin skin with little subcutaneous fat leaves superficial veins visible.
  - target: Lipodystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of subcutaneous adipose tissue is part of the progeroid tissue phenotype.
  - target: Prematurely aged appearance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The skin and fat changes produce the progeroid appearance.
    evidence:
    - reference: PMID:19648921
      reference_title: Mutations in PYCR1 cause cutis laxa with progeroid features.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings link mutations in PYCR1 to altered mitochondrial function
        and progeroid changes in connective tissues.
      explanation: Links the PYCR1 connective-tissue change to the progeroid phenotype.
  - target: Triangular face
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Facial lipoatrophy and thin skin contribute to the triangular progeroid face.
  - target: Joint hypermobility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Joint laxity accompanies the connective-tissue phenotype; the periarticular mechanism is not studied.
  - target: Congenital hip dislocation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hip dislocation is attributed to connective-tissue laxity; the mechanism is not studied.
  - target: Hernia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hernias are attributed to connective-tissue weakness of the abdominal wall; the mechanism is not studied in PYCR1 disease.
  - target: Pes planus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Flat feet are attributed to ligamentous laxity; the mechanism is not studied in PYCR1 disease.
  - target: Blue sclerae
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Blue sclerae are taken to reflect thin scleral connective tissue; scleral histology has not been reported in PYCR1 disease.
  - target: Corneal opacity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A corneal button from a PYCR1 patient showed loss of the stromal lamellar
      architecture, a connective-tissue defect of the cornea.
    evidence:
    - reference: PMID:36524384
      reference_title: Progeroid syndrome of De Barsy - a case report and review of ophthalmic literature.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Histopathology of the corneal button revealed loss of the bowman's
        layer which was replaced by a fibrous pannus while the stroma showed
        loss of stromal lamellar architecture with anterior and mid stroma
        showing vascularization.
      explanation: >-
        Corneal histology in one homozygous PYCR1 patient shows stromal
        connective-tissue disorganisation underlying the opacity.
- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    PYCR1 deficiency impairs neurodevelopment, with hypotonia, psychomotor
    delay, variable intellectual disability, movement disorder and
    corpus-callosum dysgenesis. Neural mechanisms have not been studied in
    patient tissue. Patients with variants in the first two exons have milder
    or absent intellectual disability.
  evidence:
  - reference: PMID:24035636
    reference_title: Genotype-phenotype spectrum of PYCR1-related autosomal recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intrauterine growth retardation, a characteristic triangular facial
      gestalt, psychomotor retardation, and hypotonia were the most relevant
      distinctive hallmarks of ARCL due to proline de novo synthesis defects.
    explanation: Psychomotor retardation and hypotonia are core features in the PYCR1 cohort.

- name: Increased Oxidative-Stress-Induced Apoptosis
  biological_scale: CELLULAR
  description: >-
    PYCR1-deficient fibroblasts undergo more apoptosis when challenged with
    oxidative stress. Silencing PYCR1 with PYCR2 in normal fibroblasts
    reproduces the oxidative-stress hypersensitivity, and pycr1 knockdown or
    knockout vertebrates show marked apoptosis.
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway in response to oxidative stress
    modifier: INCREASED

genetic:
- name: LCK
  gene_term:
    preferred_term: LCK
    term:
      id: hgnc:6524
      label: LCK
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Biallelic loss-of-function variants, ranging from complete loss (p.L341P,
    p.C465R) through a truncating frameshift to a hypomorphic missense (p.P440S)
    and a splice-acceptor variant with residual isoform expression. Expressivity
    tracks residual LCK function.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_3e301c04-c0a1-4e0f-a9e4-69a6bd4be915-2025-07-17T160000.000Z
    evidence:
    - reference: CGGV:assertion_3e301c04-c0a1-4e0f-a9e4-69a6bd4be915-2025-07-17T160000.000Z
      reference_title: "LCK / severe combined immunodeficiency due to LCK deficiency (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "LCK | HGNC:6524 | severe combined immunodeficiency due to LCK deficiency | MONDO:0014334 | AR | Definitive"
      explanation: ClinGen SCID-CID GCEP classification.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: c.1022T>C (p.Leu341Pro)
    description: Homozygous through uniparental disomy; weakly expressed, no kinase activity.
    evidence:
    - reference: PMID:22985903
      reference_title: "Primary T-cell immunodeficiency with immunodysregulation caused by autosomal recessive LCK deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant LCK protein (p.L341P) was weakly expressed with no kinase activity and failed to reconstitute TCR signaling in LCK-deficient T cells."
      explanation: Functional characterization of the first LCK allele.
  - name: c.188-2A>G (splice acceptor)
    description: >-
      Homozygous in three siblings with atypical epidermodysplasia verruciformis;
      causes exon 3 skipping, frameshift and mRNA decay.
    evidence:
    - reference: PMID:27087313
      reference_title: "Identification of LCK mutation in a family with atypical epidermodysplasia verruciformis with T-cell defects and virus-induced squamous cell carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation resulted in an exon 3 deletion T lymphocyte-specific protein tyrosine kinase isoform, which further led to frameshift mutation and subsequent mRNA decay."
      explanation: Splice consequence of the variant.
  - name: c.1393T>C (p.Cys465Arg)
    description: Second complete-loss allele; no LCK protein detected.
    evidence:
    - reference: PMID:38100037
      reference_title: "A Novel Biallelic LCK Variant Resulting in Profound T-Cell Immune Deficiency and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "which led to the absence of LCK protein expression and phosphorylation, and a consecutive decrease in proximal TCR signaling"
      explanation: Consequence of the p.C465R allele.
  - name: c.1129dupA (p.Ser377fs)
    description: Truncating frameshift in two cousins; reduced expression of a truncated, kinase-deficient protein.
    evidence:
    - reference: PMID:38112969
      reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The LCK mutation led to reduced expression of a truncated LCK protein lacking a substantial part of the kinase domain and two critical regulatory tyrosine residues."
      explanation: Consequence of the truncating allele.
  - name: c.1318C>T (p.Pro440Ser)
    description: Hypomorphic missense in two siblings; residual TCR signalling and proliferation.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients' T cells show residual TCR signal transduction and proliferation following anti-CD3/CD28 and phytohemagglutinin (PHA) stimulation."
      explanation: The p.P440S allele is partial loss of function.
  evidence:
  - reference: PMID:22985903
    reference_title: "Primary T-cell immunodeficiency with immunodysregulation caused by autosomal recessive LCK deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a new form of T-cell immunodeficiency caused by a LCK gene defect, highlighting the essential role of Lck in human T-cell development and responses."
    explanation: Establishes LCK as the causal gene.
diagnosis:
- name: Lymphocyte immunophenotyping
  diagnosis_term:
    preferred_term: lymphocyte immunophenotyping by flow cytometry
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  description: >-
    Flow cytometry shows T-cell lymphopenia with preserved B and NK cells, few
    naive T cells and relative gamma-delta expansion. Measuring CD4 and CD8
    surface density, not just cell counts, is the most specific clue.
  evidence:
  - reference: PMID:38100037
    reference_title: "A Novel Biallelic LCK Variant Resulting in Profound T-Cell Immune Deficiency and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD4 and CD8 surface expression may be of value for early detection of mono- and/or biallelic LCK deficiency."
    explanation: Proposes CD4 and CD8 surface expression as an early diagnostic marker.
- name: Molecular genetic testing
  description: >-
    Exome sequencing or an inborn-errors-of-immunity panel including LCK
    identifies the biallelic variants; functional TCR signalling assays support
    novel variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38100037
    reference_title: "A Novel Biallelic LCK Variant Resulting in Profound T-Cell Immune Deficiency and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing (WES) revealed a novel pathogenic biallelic missense mutation in LCK (c.1393T>C, p.C465R)"
    explanation: Exome sequencing identified the causal variant.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment. Outcomes in the few transplanted patients are
    mixed: one cousin with the truncating allele was infection-free and at
    school 4.5 years after transplant despite only 20% donor chimerism, while
    her cousin died of septic shock 20 days after transplant. Both p.P440S
    siblings were transplanted at age 6 and one died of pneumonia on day +102,
    so two of the four transplanted patients described here died. General SCID transplant cohorts
    show better survival with early transplant and no active infection.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: LCK Loss of Kinase Function
    description: Donor haematopoietic cells carry functional LCK, bypassing the lesion.
  evidence:
  - reference: PMID:38112969
    reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Now, she is 4.5 years after transplantation with 20% donor chimerism, without any infections, attending school."
    explanation: Durable clinical benefit after transplant in one LCK-deficient patient.
  - reference: PMID:38112969
    reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "She was successfully engrafted but on day + 10 she developed a septic shock with blood cultures positive for Candida glabrata and vancomycin-resistant enterococci (VRE), to which she succumbed on day + 20."
    explanation: Transplant-related infectious death in the second cousin; transplant is not uniformly successful.
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "P1, unfortunately, died on day +102 after transplantation of pneumonia."
    explanation: Post-transplant death of a p.P440S sibling.
  - reference: PMID:37352885
    reference_title: "Measuring the effect of newborn screening on survival after haematopoietic cell transplantation for severe combined immunodeficiency: a 36-year longitudinal study from the Primary Immune Deficiency Treatment Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For 902 children with confirmed SCID, 5-year overall survival remained unchanged at 72%-73% for 28 years until 2010-18, when it increased to 87%"
    explanation: >-
      SCID-wide transplant survival, not specific to LCK deficiency; cited for
      the general benefit of transplantation in severe T-cell immunodeficiency.
animal_models:
- name: Lck knockout mouse
  species: Mouse
  genotype: Lck-/-
  description: Complete Lck loss arrests thymic T-cell development and causes profound T-cell lymphopenia.
  modeled_mechanisms:
  - target: Arrested Thymic T Cell Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Thymic development arrests with profound T-cell lymphopenia.
    limitations: >-
      Unlike the knock-in, the knockout mouse does not develop intestinal
      inflammation, so it models the complete-loss alleles only.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "While both Lck-/- and LckP440S/P440S mice exhibit arrested thymic T cell development and profound T cell lymphopenia, only LckP440S/P440S mice show residual T cell proliferation, cytokine production, and intestinal inflammation."
      explanation: Supports the knockout reproducing the thymic arrest.
  evidence:
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate in mouse models that complete (Lck-/-) versus partial (LckP440S/P440S) loss-of-function LCK causes disease with differing phenotypes."
    explanation: Comparison of complete and partial Lck loss in mice.
- name: Lck P440S knock-in mouse
  species: Mouse
  genotype: LckP440S/P440S
  description: >-
    Knock-in of the human hypomorphic variant; residual T-cell function with
    CD4 T cell-driven, Treg-preventable intestinal inflammation.
  modeled_mechanisms:
  - target: CD4 T Cell-Driven Intestinal Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Intestinal inflammation prevented by CD4 depletion or Treg transfer.
    limitations: >-
      The human p.P440S siblings had protracted diarrhoea, but intestinal
      histology matching the mouse inflammation is not reported for them.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, the intestinal disease in the LckP440S/P440S mice is prevented by CD4+ T cell depletion or regulatory T cell transfer."
      explanation: Supports the knock-in reproducing CD4-driven, Treg-sensitive gut inflammation.
  evidence:
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate in mouse models that complete (Lck-/-) versus partial (LckP440S/P440S) loss-of-function LCK causes disease with differing phenotypes."
    explanation: Establishes the knock-in model.
notes: >-
  About nine molecularly confirmed patients in five families have been
  published, so no frequency is given for any phenotype. No GeneReviews chapter
  covers LCK deficiency.

  The MONDO label calls this a severe combined immunodeficiency, and MONDO
  places it under T-B- SCID. The published cases have T cells present, reduced
  and oligoclonal, with normal B and NK numbers, which IUIS records as a
  combined immunodeficiency; the IUIS classification is used here.

classifications:
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      IUIS 2022 phenotypic classification of inborn errors of immunity, Table 1
      (immunodeficiencies affecting cellular and humoral immunity), lists LCK
      deficiency as autosomal recessive with low CD4 and regulatory T cells, a
      restricted T-cell repertoire and poor TCR signalling, and normal B and NK
      compartments.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "LCK deficiency LCK AR 615758 Low CD4+, low Treg, restricted T cell repertoire, poor TCR signaling Normal Normal IgG and IgA, high IgM Recurrent infections, immune dysregulation, autoimmunity"
      explanation: >-
        The IUIS classification row for LCK deficiency, recording recessive
        inheritance, the T-cell phenotype and the clinical features.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic LCK variants are required. Most reported families are
    consanguineous; the first patient was homozygous through uniparental
    disomy. ClinGen rates the LCK relationship to this disease Definitive under
    autosomal recessive inheritance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22985903
    reference_title: "Primary T-cell immunodeficiency with immunodysregulation caused by autosomal recessive LCK deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify and describe a child with a T-cell immunodeficiency caused by a homozygous missense mutation of the LCK gene (c.1022T>C) resulting from uniparental disomy."
    explanation: First patient, homozygous for an LCK missense variant.
  - reference: CGGV:assertion_3e301c04-c0a1-4e0f-a9e4-69a6bd4be915-2025-07-17T160000.000Z
    reference_title: "LCK / severe combined immunodeficiency due to LCK deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LCK | HGNC:6524 | severe combined immunodeficiency due to LCK deficiency | MONDO:0014334 | AR | Definitive"
    explanation: ClinGen classifies the relationship as Definitive with autosomal recessive inheritance.
pathophysiology:
- name: LCK Loss of Kinase Function
  biological_scale: MOLECULAR
  description: >-
    Pathogenic LCK alleles remove or reduce kinase activity. The p.L341P and
    p.C465R missense alleles give little or no protein and no kinase activity;
    a frameshift allele gives a truncated protein lacking much of the kinase
    domain and both regulatory tyrosines; the p.P440S allele is hypomorphic and
    retains some signalling; and the c.188-2A>G splice allele skips exon 3 but
    may leave a longer isoform.
  genes:
  - preferred_term: LCK
    term:
      id: hgnc:6524
      label: LCK
  molecular_functions:
  - preferred_term: non-membrane spanning protein tyrosine kinase activity
    modifier: DECREASED
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
  evidence:
  - reference: PMID:22985903
    reference_title: "Primary T-cell immunodeficiency with immunodysregulation caused by autosomal recessive LCK deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant LCK protein (p.L341P) was weakly expressed with no kinase activity and failed to reconstitute TCR signaling in LCK-deficient T cells."
    explanation: Functional analysis shows the first patient's allele has no kinase activity.
  - reference: PMID:38100037
    reference_title: "A Novel Biallelic LCK Variant Resulting in Profound T-Cell Immune Deficiency and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which led to the absence of LCK protein expression and phosphorylation, and a consecutive decrease in proximal TCR signaling"
    explanation: The p.C465R allele abolishes LCK protein in patient cells.
  - reference: PMID:38112969
    reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LCK mutation led to reduced expression of a truncated LCK protein lacking a substantial part of the kinase domain and two critical regulatory tyrosine residues."
    explanation: The frameshift allele produces a truncated, kinase-deficient protein.
  downstream:
  - target: Failure of Proximal TCR Signalling
    causal_link_type: DIRECT
    description: >-
      LCK phosphorylates the CD3 and zeta ITAMs and ZAP70, so its loss stops
      the signal at the receptor.
    evidence:
    - reference: PMID:38100037
      reference_title: "A Novel Biallelic LCK Variant Resulting in Profound T-Cell Immune Deficiency and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "which led to the absence of LCK protein expression and phosphorylation, and a consecutive decrease in proximal TCR signaling"
      explanation: Loss of LCK protein is followed by reduced proximal TCR signalling in the same patient cells.
- name: Failure of Proximal TCR Signalling
  biological_scale: CELLULAR
  description: >-
    Without LCK, TCR engagement gives only weak tyrosine phosphorylation and no
    calcium flux. Some downstream outputs, such as mTOR activation, can be
    partly preserved with the truncating allele.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  - preferred_term: positive regulation of cytosolic calcium ion concentration
    modifier: DECREASED
    term:
      id: GO:0007204
      label: positive regulation of cytosolic calcium ion concentration
  evidence:
  - reference: PMID:22985903
    reference_title: "Primary T-cell immunodeficiency with immunodysregulation caused by autosomal recessive LCK deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The residual T lymphocytes had an oligoclonal T-cell repertoire and exhibited a profound TCR signaling defect, with only weak tyrosine phosphorylation signals and no Ca(2+) mobilization in response to TCR stimulation."
    explanation: Patient T cells cannot signal through the TCR.
  - reference: PMID:38112969
    reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite severely impaired TCR signaling mTOR activation was partially preserved in patients' T cells."
    explanation: Confirms severely impaired TCR signalling with a truncating allele.
  downstream:
  - target: Arrested Thymic T Cell Development
    description: Thymocyte selection depends on TCR signalling, so development stalls.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "While both Lck-/- and LckP440S/P440S mice exhibit arrested thymic T cell development and profound T cell lymphopenia, only LckP440S/P440S mice show residual T cell proliferation, cytokine production, and intestinal inflammation."
      explanation: Complete and partial Lck loss both arrest thymic T-cell development in mice.
  - target: Defective T Cell Effector Function
    description: Mature T cells that escape the thymus still cannot respond normally to antigen.
    evidence:
    - reference: PMID:38112969
      reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Residual TCR signaling in LCK deficiency allows for reduced, but detectable T-cell differentiation, while T-cell function is severely disturbed."
      explanation: Residual signalling permits some differentiation, but the cells do not function.
  - target: Failure of Regulatory T Cell Development
    description: >-
      With the hypomorphic allele, signalling is enough for some conventional T
      cells to mature but not for regulatory T cells.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate that P440S LCK spares sufficient T cell function to allow the maturation of some conventional T cells but not regulatory T cells-leading to intestinal inflammation."
      explanation: Partial LCK signalling spares conventional but not regulatory T-cell maturation.
- name: Arrested Thymic T Cell Development
  biological_scale: CELLULAR
  description: >-
    Thymic output collapses, giving low TRECs, few naive T cells, a restricted
    or oligoclonal repertoire, and loss of conventional CD4 and CD8 alpha-beta T
    cells, with relative expansion of gamma-delta T cells.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    modifier: DECREASED
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
  evidence:
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While both Lck-/- and LckP440S/P440S mice exhibit arrested thymic T cell development and profound T cell lymphopenia, only LckP440S/P440S mice show residual T cell proliferation, cytokine production, and intestinal inflammation."
    explanation: Mouse evidence that LCK loss arrests thymic T-cell development.
  - reference: PMID:38100037
    reference_title: "A Novel Biallelic LCK Variant Resulting in Profound T-Cell Immune Deficiency and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of conventional CD4+ and CD8+ αβT-cells and homeostatic T-cell expansion was accompanied by increased γδT-cell and Treg percentages."
    explanation: Patient loses conventional alpha-beta T cells, with relative gamma-delta expansion.
  downstream:
  - target: Decreased total T cell count
    description: Reduced thymic output produces T-cell lymphopenia.
  - target: Decreased total CD4+ T cell count
    description: CD4 T cells are the most consistently reduced lineage.
  - target: Defective T Cell Effector Function
    description: Too few, oligoclonal T cells cannot cover the antigen repertoire.
  - target: Panniculitis
    description: Inflammatory skin disease in the first patient, part of the immune dysregulation.
  - target: Vasculitis
    description: Accompanied the panniculitis in the first patient.
  - target: Increased circulating IgM concentration
    description: >-
      Recorded by IUIS alongside the T-cell defect; no source here gives the
      mechanism.
  - target: Autoimmunity
    description: >-
      Inferred link. Weak TCR signalling probably shifts thymic negative
      selection, letting self-reactive T cells escape; the mouse study proposes
      this for both complete and partial Lck loss, but it is not shown in
      patients.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The thymic positive and negative selection thresholds are likely altered in the P440S and KO mice, potentially resulting in the selection of host-reactive T cells."
      explanation: >-
        Proposes altered negative selection, and so escape of host-reactive T
        cells, in both complete and partial Lck loss.
- name: Defective T Cell Effector Function
  biological_scale: CELLULAR
  description: >-
    Few T cells, of restricted repertoire and poor function, leave cellular
    immunity deficient, giving severe and recurrent bacterial, viral and fungal
    infection from infancy and, with the splice allele, persistent HPV infection
    and HPV-driven skin cancer.
  evidence:
  - reference: PMID:38112969
    reference_title: "Combined Immunodeficiency Caused by a Novel Nonsense Mutation in LCK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite detectable differentiation of memory and effector T cells, their function was severely disturbed."
    explanation: Memory and effector T cells are present but do not function.
  downstream:
  - target: Recurrent infections
  - target: Recurrent respiratory infections
  - target: Failure to thrive
  - target: Chronic diarrhea
  - target: Recurrent mucocutaneous candidiasis
    description: Deficient T-cell immunity fails to control Candida at mucosal surfaces.
  - target: Verrucae
    description: Failed T-cell control of HPV allows persistent wart-like skin disease.
  - target: Squamous cell carcinoma of the skin
    description: Persistent HPV infection progressed to virus-induced skin carcinoma.
    evidence:
    - reference: PMID:27087313
      reference_title: "Identification of LCK mutation in a family with atypical epidermodysplasia verruciformis with T-cell defects and virus-induced squamous cell carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We demonstrate a novel mutation in LCK in a family affected by atypical EV with T-cell defects, HPV infection and virus-induced malignancy"
      explanation: Links the LCK T-cell defect to HPV infection and virus-induced malignancy.
- name: Failure of Regulatory T Cell Development
  biological_scale: CELLULAR
  description: >-
    With partial LCK function (p.P440S), conventional T cells can mature but
    regulatory T cells cannot. In mice, Treg numbers are reduced in both the
    knockout and the P440S knock-in; what sets P440S apart is that conventional T
    cells keep enough function to cause disease once Treg number and function
    are deficient. The published human cases disagree on Treg
    numbers: IUIS lists low Treg, while the complete-loss p.C465R patient had an
    increased Treg percentage among a reduced T-cell pool, so this node is
    supported for the hypomorphic allele rather than for the disease as a whole.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    modifier: DECREASED
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
  evidence:
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings demonstrate that P440S LCK spares sufficient T cell function to allow the maturation of some conventional T cells but not regulatory T cells-leading to intestinal inflammation."
    explanation: Knock-in mouse evidence for selective failure of regulatory T cells.
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conjunction with deficient endogenous P440S Treg numbers and function, the unrestrained Tconv consequently drive intestinal inflammation in P440S mice."
    explanation: The P440S defect is in both Treg number and Treg function.
  downstream:
  - target: CD4 T Cell-Driven Intestinal Inflammation
    description: Without regulatory T cells, residual conventional CD4 T cells inflame the gut.
    evidence:
    - reference: PMID:37962568
      reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, the intestinal disease in the LckP440S/P440S mice is prevented by CD4+ T cell depletion or regulatory T cell transfer."
      explanation: Regulatory T-cell transfer prevents the gut disease, placing Treg failure upstream of it.
- name: CD4 T Cell-Driven Intestinal Inflammation
  biological_scale: TISSUE
  description: >-
    In the p.P440S knock-in mouse, residual conventional CD4 T cells cause
    intestinal inflammation that CD4 depletion or regulatory T-cell transfer
    prevents. The two p.P440S siblings had protracted diarrhoea.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:37962568
    reference_title: "A partial human LCK defect causes a T cell immunodeficiency with intestinal inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, the intestinal disease in the LckP440S/P440S mice is prevented by CD4+ T cell depletion or regulatory T cell transfer."
    explanation: The gut inflammation is CD4 T-cell dependent and Treg sensitive.
  downstream:
  - target: Chronic diarrhea
    description: Intestinal inflammation contributes to the chronic diarrhoea of the hypomorphic cases.

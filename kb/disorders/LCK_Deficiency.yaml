name: LCK Deficiency
creation_date: "2026-11-03T14:10:00Z"
category: Mendelian
synonyms:
- severe combined immunodeficiency due to LCK deficiency
- SCID due to LCK deficiency
- severe combined immunodeficiency due to lymphocyte-specific protein tyrosine kinase deficiency
- combined immunodeficiency due to LCK deficiency
- immunodeficiency 22
- IMD22
description: >-
  LCK deficiency is an autosomal recessive combined immunodeficiency caused by
  biallelic loss-of-function variants in LCK, the Src-family kinase that starts
  T-cell receptor signalling. When the receptor engages peptide-MHC, LCK
  phosphorylates the ITAMs of the CD3 and zeta chains, which recruits ZAP70, and
  then activates ZAP70 itself. Without LCK the receptor cannot signal, so
  thymocytes fail selection, few T cells leave the thymus, and those that do
  respond poorly to antigen.

  About nine patients in five families have been described. The complete-loss
  alleles (p.L341P, p.C465R) and a truncating allele give profound T-cell
  lymphopenia with an oligoclonal repertoire, recurrent and severe infections
  from infancy, failure to thrive and chronic diarrhoea, plus early inflammatory
  and autoimmune disease in the first case. A characteristic laboratory clue is
  reduced surface density of CD4 (and often CD8) on the remaining T cells. A
  hypomorphic allele (p.P440S) leaves enough signalling for some conventional T
  cells to mature but not regulatory T cells, and in the matching knock-in mouse
  CD4 T cells drive intestinal inflammation that regulatory T-cell transfer
  prevents. A splice allele with residual expression of a longer isoform gives a
  later-onset picture dominated by HPV skin disease and virus-induced squamous
  cell carcinoma. Allogeneic haematopoietic stem cell transplantation is the only
  curative treatment, with mixed outcomes in the few cases transplanted.

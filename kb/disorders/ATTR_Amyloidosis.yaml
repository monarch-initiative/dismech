discussions:
- discussion_id: gap_attrv_genotype_penetrance_and_tissue_tropism
  prompt: >-
    Which variant-specific and host factors determine penetrance, age at onset,
    and whether ATTRv presents predominantly as neuropathy, cardiomyopathy, or a
    mixed multisystem phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TTR
  - pathophysiology#Progressive Multitissue TTR Amyloid Accumulation
  rationale: >-
    Pathogenic TTR variation establishes the disease mechanism, but clinical
    penetrance and organ tropism remain heterogeneous even among common
    variants. The record therefore avoids treating one genotype or organ pattern
    as universal.
  evidence:
  - reference: PMID:36941075
    reference_title: Phenotypes Associated With the Val122Ile, Leu58His, and Late-Onset Val30Met Variants in Patients With Hereditary Transthyretin Amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Important clinical differences exist between ATTRv genotypes."
    explanation: The cohort directly demonstrates genotype-associated clinical differences.
  - reference: PMID:38844302
    reference_title: "Genotype-Phenotype Correlations in ATTR Amyloidosis: A Clinical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical phenotype varies according to the gene variant and includes predominantly cardiac, predominantly neurologic, and mixed phenotypes."
    explanation: The review frames variable organ presentation as a central genotype-phenotype problem.


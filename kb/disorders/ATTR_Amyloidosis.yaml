- accession: geo:GSE149665
  title: Circulating microRNAs profile in patients with transthyretin variant amyloidosis
  description: Transthyretin variant amyloidosis (ATTRv) is a rare autosomal dominant disease characterized by the accumulation of amyloid in many organs, mostly causing a sensory-motor neuropathy, cardiomyopathy, and dysautonomia. The aim of the study was to report microRNAs (miRNAs) expression profile identified in the blood of ATTRv patients. 10 symptomatic ATTRv patients, 10 asymptomatic carriers of transthyretin variant (TTRv), 10 patients with Charcot-Marie-Tooth (CMT) disease, and 10 healthy controls were studied.

- accession: geo:GSE154683
  title: Epigenomic profiles of African American Transthyretin Val122Ile carriers reveals putatively dysregulated amyloid mechanisms
  description: The Val122Ile mutation in Transthyretin (TTR) gene causes a rare, difficult to diagnose hereditary form of cardiac amyloidosis. This mutation is most common in the United States and mainly present in people of African descent. The carriers have an increased risk of congestive heart failure, peripheral edema, and several other non-cardiac phenotypes such as carpal tunnel syndrome, and arthroplasty which are top reasons for ambulatory/outpatient surgeries in the country. We conducted first-ever epigenome-wide association study in Val122Ile carriers of African descent for heart disease (HD) and multiple outpatient surgeries (OS) - an early disease indicator.

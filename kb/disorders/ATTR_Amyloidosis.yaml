    A heterozygous pathogenic TTR variant produces an amyloidogenic
    transthyretin precursor. TTR is synthesized predominantly in the liver and
    circulates as a tetramer; disease-associated variant protein makes the
    native complex more prone to leave its folded state.
  role: trigger
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"

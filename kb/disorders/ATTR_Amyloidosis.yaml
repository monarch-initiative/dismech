biochemical:
- name: Plasma pyroglutamate
  presence: Elevated in symptomatic TTR-Val30Met carriers
  context: Candidate circulating marker of impaired glutathione homeostasis
  biomarker_term:
    preferred_term: pyroglutamate
    term:
      id: CHEBI:18183
      label: 5-oxo-L-proline
  evidence:
  - reference: PMID:42436580
    reference_title: Disrupted glutathione homeostasis in the pathogenesis of TTR-V30M amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic individuals had significantly elevated plasma PGA levels compared with both asymptomatic carriers and age-matched healthy controls, consistent with impaired GSH homeostasis."
    explanation: >-
      The cross-sectional cohort reports higher plasma pyroglutamate in
      symptomatic carriers than both comparator groups.
- name: Plasma kynurenine-to-tryptophan ratio
  presence: Elevated in symptomatic TTR-Val30Met carriers
  context: Candidate circulating marker of inflammatory activation
  evidence:
  - reference: PMID:42436580
    reference_title: Disrupted glutathione homeostasis in the pathogenesis of TTR-V30M amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In parallel, the kynurenine/tryptophan ratio was increased in symptomatic TTR-V30M carriers, supporting inflammatory activation in manifest disease."
    explanation: >-
      The study reports an elevated ratio in symptomatic carriers.

genetic:
- name: TTR
  association: Pathogenic variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TTR
    term:
      id: hgnc:12405
      label: TTR
  notes: >-
    Pathogenic heterozygous TTR variants cause ATTRv through a toxic
    gain-of-function protein-misfolding mechanism. Penetrance and the balance of
    cardiac, neurologic, and mixed disease vary by variant.
  evidence:
  - reference: PMID:38844302
    reference_title: "Genotype-Phenotype Correlations in ATTR Amyloidosis: A Clinical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary transthyretin-related amyloidosis (hATTR) is the most common form of familial amyloidosis. It is an autosomal dominant disease caused by a pathogenic variant in the TTR gene."
    explanation: The review directly identifies pathogenic TTR variation as causative.
  - reference: PMID:38844302
    reference_title: "Genotype-Phenotype Correlations in ATTR Amyloidosis: A Clinical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical phenotype varies according to the gene variant and includes predominantly cardiac, predominantly neurologic, and mixed phenotypes."
    explanation: The review supports variant-dependent expressivity.

diagnosis:
- name: Molecular confirmation of hereditary ATTR amyloidosis
  description: >-
    Active ATTRv diagnosis requires compatible clinical manifestations plus
    imaging or histopathologic evidence of amyloidosis and identification of a
    heterozygous pathogenic TTR variant. A pathogenic variant alone indicates
    genetic risk, not necessarily clinically manifest amyloidosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301373
    reference_title: Hereditary Transthyretin Amyloidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of ATTRv amyloidosis is established in a proband with characteristic clinical features, including imaging or histopathology findings of amyloidosis, and a heterozygous pathogenic variant in TTR identified by molecular genetic testing."
    explanation: GeneReviews states the combined phenotypic, amyloid, and molecular requirements.

- name: Monoclonal protein testing and bone-avid cardiac scintigraphy with SPECT
  description: >-
    In suspected cardiac ATTR, serum free light chains plus serum and urine
    immunofixation assess for a monoclonal protein before interpreting
    technetium-PYP, DPD, or HMDP scintigraphy. Grade 2-3 myocardial uptake with
    no monoclonal protein supports a nonbiopsy ATTR-CM diagnosis; SPECT confirms
    myocardial rather than blood-pool uptake.
  diagnosis_term:
    preferred_term: cardiac radionuclide scintigraphy
    term:
      id: NCIT:C62667
      label: Radionuclide Imaging
  evidence:
  - reference: PMID:27143678
    reference_title: Nonbiopsy Diagnosis of Cardiac Transthyretin Amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone scintigraphy enables the diagnosis of cardiac ATTR amyloidosis to be made reliably without the need for histology in patients who do not have a monoclonal gammopathy."
    explanation: The multicenter study establishes the nonbiopsy pathway only when monoclonal gammopathy is absent.
  - reference: PMID:33221204
    reference_title: "Diagnosing Transthyretin Cardiac Amyloidosis by Technetium Tc 99m Pyrophosphate: A Test in Evolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the inclusion of monoclonal protein testing and SPECT imaging is crucial to rule out amyloid light chain amyloidosis and distinguish myocardial retention from blood pooling."
    explanation: This supports both AL exclusion and tomographic confirmation of myocardial uptake.

- name: Tissue biopsy with amyloid typing when nonbiopsy criteria are not met
  description: >-
    Discordant imaging, a monoclonal protein, or other diagnostic uncertainty
    requires tissue demonstration of Congo-red-positive amyloid followed by
    typing, preferably by mass spectrometry, because Congo red alone does not
    distinguish ATTR from AL amyloid.
  evidence:
  - reference: DOI:10.3389/frhem.2024.1378451
    reference_title: "AL amyloidosis: an overview on diagnosis, staging system, and treatment"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Histological diagnosis with Congo red staining is the gold standard, but typing the amyloid with immunohistochemistry or mass spectrometry of the Congo red positive tissue is necessary to establish if an AL or ATTR amyloidosis could be diagnosed."
    explanation: The review directly states that Congo red must be followed by amyloid typing to distinguish AL from ATTR.

- name: Neurologic phenotyping and denervation assessment
  description: >-
    Neurologic examination, nerve-conduction studies, sudomotor testing, and
    intraepidermal nerve-fiber assessment characterize neuropathy and
    denervation. These tests support organ phenotyping but do not replace TTR
    genetic testing and amyloid identification.
  evidence:
  - reference: PMID:38923548
    reference_title: "Amyloid Neuropathy: From Pathophysiology to Treatment in Light-Chain Amyloidosis and Hereditary Transthyretin Amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nerve conduction studies, quantitative sudomotor axon testing, and intraepidermal nerve fiber density are useful tools to evaluate denervation."
    explanation: The neuropathy review supports these tools for physiologic characterization of denervation.

treatments:
- name: Tafamidis
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral TTR kinetic stabilizer used for ATTR cardiomyopathy and, in some
    jurisdictions, hereditary ATTR polyneuropathy. Binding the thyroxine-binding
    channel stabilizes the tetramer and inhibits the dissociation step that
    precedes fibril formation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tafamidis
      term:
        id: CHEBI:78538
        label: tafamidis
  target_mechanisms:
  - target: TTR Tetramer Destabilization, Misfolding, and Oligomerization
    treatment_effect: INHIBITS
    description: Kinetic stabilization inhibits tetramer dissociation into amyloidogenic monomers.
  evidence:
  - reference: PMID:30145929
    reference_title: Tafamidis Treatment for Patients with Transthyretin Amyloid Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the primary analysis, all-cause mortality and rates of cardiovascular-related hospitalizations were lower among the 264 patients who received tafamidis than among the 177 patients who received placebo (P<0.001)."
    explanation: ATTR-ACT demonstrates clinical benefit in ATTR cardiomyopathy.
  - reference: PMID:42265992
    reference_title: "Cardiac Amyloidosis: Pathogenesis, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the use of tafamidis has been found to be associated with better outcomes and lower overall mortality at 30 months compared with placebo (HR 0.70 [0.51; 0.96])."
    explanation: 2026 clinical review synthesizes tafamidis mortality reduction in ATTR cardiac amyloidosis.
  - reference: PMID:42423415
    reference_title: Guidelines for the management of hereditary ATTR amyloidosis 2026.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tafamidis and vutrisiran are indicated for both polyneuropathy (ATTRv-PN) and cardiomyopathy (ATTR-CM)"
    explanation: The 2026 ISA guideline supports tafamidis use across hereditary polyneuropathy and cardiomyopathy phenotypes, subject to local authorization.

- name: Diflunisal
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Diflunisal is a repurposed nonsteroidal anti-inflammatory drug used
    off-label as a TTR kinetic stabilizer. A randomized trial demonstrated
    slower polyneuropathy progression and preserved quality of life in
    hereditary ATTR with polyneuropathy. It is an older option rather than an
    equivalent substitute for currently authorized stabilizers or gene-silencing
    therapies, and NSAID-related gastrointestinal, cardiac, and renal risks
    require careful patient selection and monitoring.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diflunisal
      term:
        id: CHEBI:39669
        label: diflunisal
  target_mechanisms:
  - target: TTR Tetramer Destabilization, Misfolding, and Oligomerization
    treatment_effect: INHIBITS
    description: Binding at the thyroxine-binding site kinetically stabilizes TTR tetramers and inhibits release of amyloidogenic monomers.
  evidence:
  - reference: PMID:24368466
    reference_title: "Repurposing diflunisal for familial amyloid polyneuropathy: a randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diflunisal, a nonsteroidal anti-inflammatory agent, stabilizes transthyretin tetramers and prevents amyloid fibril formation in vitro."
    explanation: The randomized-trial report supplies the kinetic-stabilization rationale for repurposed diflunisal.
  - reference: PMID:24368466
    reference_title: "Repurposing diflunisal for familial amyloid polyneuropathy: a randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of diflunisal compared with placebo for 2 years reduced the rate of progression of neurological impairment and preserved quality of life."
    explanation: The randomized trial demonstrates benefit for hereditary ATTR polyneuropathy while not establishing equivalence to newer therapies.
  - reference: PMID:24368466
    reference_title: "Repurposing diflunisal for familial amyloid polyneuropathy: a randomized clinical trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Drug-related adverse events led to study drug discontinuation in 4 patients from the diflunisal group (gastrointestinal bleed, congestive heart failure, glaucoma, nausea)"
    explanation: Trial discontinuations support explicit safety and patient-selection caveats for repurposed NSAID therapy.

- name: Acoramidis
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    High-affinity oral TTR tetramer stabilizer used for ATTR cardiomyopathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acoramidis
      term:
        id: NCIT:C170791
        label: Acoramidis
  target_mechanisms:
  - target: TTR Tetramer Destabilization, Misfolding, and Oligomerization
    treatment_effect: INHIBITS
    description: Acoramidis inhibits tetramer dissociation and thereby reduces formation of amyloidogenic monomers.
  evidence:
  - reference: PMID:38197816
    reference_title: Efficacy and Safety of Acoramidis in Transthyretin Amyloid Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acoramidis is a high-affinity TTR stabilizer that acts to inhibit dissociation of tetrameric TTR and leads to more than 90% stabilization across the dosing interval as measured ex vivo."
    explanation: The pivotal trial describes the intended tetramer-stabilizing mechanism.
  - reference: PMID:38197816
    reference_title: Efficacy and Safety of Acoramidis in Transthyretin Amyloid Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with transthyretin amyloid cardiomyopathy, the receipt of acoramidis resulted in a significantly better four-step primary hierarchical outcome containing components of mortality, morbidity, and function than placebo."
    explanation: ATTRibute-CM demonstrates clinical benefit in ATTR cardiomyopathy.

- name: Vutrisiran
  action_category: THERAPEUTIC
  therapeutic_modality: SIRNA
  description: >-
    Subcutaneous GalNAc-conjugated siRNA that reduces hepatic synthesis of both
    variant and wild-type TTR. It is used in hereditary ATTR polyneuropathy and
    ATTR cardiomyopathy, with eligibility varying by jurisdiction.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vutrisiran
      term:
        id: NCIT:C152919
        label: Vutrisiran
  target_mechanisms:
  - target: Amyloidogenic Variant TTR Precursor
    treatment_effect: INHIBITS
    description: RNA interference lowers hepatic TTR production and the circulating amyloid precursor pool.
  evidence:
  - reference: PMID:39213194
    reference_title: Vutrisiran in Patients with Transthyretin Amyloidosis with Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with ATTR-CM, treatment with vutrisiran led to a lower risk of death from any cause and cardiovascular events than placebo and preserved functional capacity and quality of life."
    explanation: HELIOS-B demonstrates benefit in ATTR cardiomyopathy.
  - reference: PMID:42265992
    reference_title: "Cardiac Amyloidosis: Pathogenesis, Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vutrisiran also lowers overall mortality and reduces recurrent cardiovascular events compared to placebo (HR 0.72 [0.56; 0.93])."
    explanation: 2026 clinical review reports vutrisiran mortality and cardiovascular event reduction in ATTR cardiomyopathy.
  - reference: PMID:42423415
    reference_title: Guidelines for the management of hereditary ATTR amyloidosis 2026.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tafamidis and vutrisiran are indicated for both polyneuropathy (ATTRv-PN) and cardiomyopathy (ATTR-CM)"
    explanation: The 2026 ISA guideline supplies phenotype-specific hereditary ATTR treatment scope.

- name: Patisiran

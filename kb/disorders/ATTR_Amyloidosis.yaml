- accession: geo:GSE67784
  title: A Gene Expression-based Blood Diagnostic for Symptomatic Transthyretin Amyloidosis Revealing Male and Female-specific Signatures
  description: Early diagnosis of transthyretin (TTR) amyloid diseases remains challenging because of variable disease penetrance. Currently, patients must have an amyloid positive tissue biopsy to be eligible for disease modifying therapies. Early diagnosis is often difficult because the patient exhibits apparent symptoms of polyneuropathy or cardiomyopathy, but has a negative amyloid biopsy. Thus, there is a pressing need for more objective, quantitative diagnostics and biomarkers of TTR-aggregation-associated polyneuropathy and cardiomyopathy. This is especially true in the context of clinical trials demonstrating significant disease modifying effects, e.g.

progression:
- phase: Progressive multisystem disease
  age_range: Adult onset; age varies by genotype and population
  notes: >-
    Neuropathy is usually slowly progressive, while cardiac, ocular, renal, and
    central nervous system involvement varies by TTR variant and disease stage.
    A fixed onset range is not asserted because genotype and geography strongly
    affect presentation.
  evidence:
  - reference: PMID:20301373
    reference_title: Hereditary Transthyretin Amyloidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary transthyretin amyloidosis (ATTRv amyloidosis) is characterized by a slowly progressive peripheral sensorimotor and/or autonomic neuropathy."
    explanation: GeneReviews supports progressive neuropathy as a central natural-history feature.
  - reference: PMID:38844302
    reference_title: "Genotype-Phenotype Correlations in ATTR Amyloidosis: A Clinical Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical phenotype varies according to the gene variant and includes predominantly cardiac, predominantly neurologic, and mixed phenotypes."
    explanation: The review supports genotype-dependent organ presentation rather than one universal onset course.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_variant_ttr_amyloidogenesis
  hypothesis_label: Canonical Variant-TTR Amyloidogenesis Model
  status: CANONICAL
  description: >-
    A pathogenic TTR variant destabilizes the circulating transthyretin
    tetramer. Tetramer dissociation releases monomers that misfold, oligomerize,
    and assemble into extracellular amyloid fibrils; progressive tissue
    accumulation then produces organ-specific dysfunction.
  evidence:
  - reference: PMID:25604431
    reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
    explanation: This directly states the canonical variant-to-tetramer-to-fibril sequence.
  - reference: PMID:29962408
    reference_title: Inhibition of the Amyloidogenesis of Transthyretin by Natural Products and Synthetic Compounds.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mutations destabilize the tetramer and/or monomer of TTR, and thus the stabilization of TTR is a key strategy for the treatment of TTR-related amyloidosis."
    explanation: The review independently supports TTR destabilization and its therapeutic tractability.
- hypothesis_group_id: val30met_glutathione_signature
  hypothesis_label: Val30Met Glutathione and Inflammatory Metabolomic Signature
  status: EMERGING
  description: >-
    A cross-sectional metabolomics study associates symptomatic TTR-Val30Met
    disease with impaired glutathione homeostasis and inflammatory activation.
    Directionality and generalizability beyond this genotype remain unresolved.
  evidence:
  - reference: PMID:42436580
    reference_title: Disrupted glutathione homeostasis in the pathogenesis of TTR-V30M amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings identify disrupted GSH homeostasis and inflammatory activation as metabolic features associated with symptomatic TTR-V30M amyloidosis in vivo, supporting a link between redox imbalance and disease manifestation."
    explanation: >-
      The study reports an association with manifest Val30Met disease without
      establishing the causal direction.


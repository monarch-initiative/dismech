name: Hereditary Transthyretin Amyloidosis
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Hereditary transthyretin amyloidosis (ATTRv amyloidosis) is an autosomal
  dominant, adult-onset systemic protein-misfolding disease caused by pathogenic
  TTR variants. Variant transthyretin tetramers are prone to dissociation;
  released monomers misfold and assemble into extracellular amyloid fibrils.
  Progressive tissue accumulation most often produces sensorimotor and
  autonomic neuropathy, infiltrative cardiomyopathy, or a mixed phenotype, with
  additional gastrointestinal, ocular, and renal manifestations that vary by
  genotype and disease stage.
category: Mendelian
parents:
- Genetic Disease
- Protein Misfolding Disease
disease_term:
  preferred_term: familial amyloid neuropathy
  term:
    id: MONDO:0007100
    label: familial amyloid neuropathy
synonyms:
- ATTRv amyloidosis
- Familial amyloid polyneuropathy
- Familial transthyretin amyloidosis
- Hereditary ATTR amyloidosis
- Hereditary transthyretin-mediated amyloidosis
- hATTR
notes: >-
  This record is intentionally restricted to hereditary/variant ATTR because
  MONDO:0007100 denotes the familial genetic disease. Age-related wild-type
  ATTR (MONDO:0018018) is not a subtype of this record; the shared ATTRv/ATTRwt
  mechanism is represented in the broader Amyloidosis entry. This scope avoids
  projecting hereditary Orphanet frequencies, inheritance, genetic testing,
  and polyneuropathy treatment indications onto wild-type disease.

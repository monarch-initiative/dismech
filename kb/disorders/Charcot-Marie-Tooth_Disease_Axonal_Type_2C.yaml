genetic:
  - name: TRPV4
    relationship_type: CAUSATIVE
    gene_term:
      preferred_term: TRPV4
      term:
        id: hgnc:18083
        label: TRPV4
    notes: >-
      Causal variants cluster in the intracellular N-terminal ankyrin repeat
      domain: R232C, R269H, R315W, R316C, R316H and S542Y are reported. The same
      residues also cause scapuloperoneal spinal muscular atrophy and congenital
      distal spinal muscular atrophy, and the same variant can present as either
      phenotypic CMT2C or as undifferentiated CMT2 within one family - so a
      TRPV4 ankyrin-domain variant predicts TRPV4 neuromuscular disease but does
      not predict which of the three phenotypes a given individual will have.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          TRPV4 ankyrin domain alterations including a novel de novo mutation
          cause axonal CMT2. Individuals with the same mutation may have
          nondistinct CMT2 or have phenotypic CMT2C with vocal cord paresis.
        explanation: >-
          Establishes causality and, in the same breath, the within-genotype
          phenotypic variability that the notes describe.
      - reference: PMID:12062259
        reference_title: >-
          Charcot-Marie-Tooth disease type 2C: a distinct genetic entity.
          Clinical and molecular characterization of the first European family.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Charcot-Marie-Tooth disease type 2C is clinically and genetically
          different from Charcot-Marie-Tooth disease type 2A, B, D, E and F, and
          is not allelic with distal hereditary motor neuronopathy type VII.
        explanation: >-
          The pre-gene linkage evidence establishing CMT2C as a separate entity,
          which is the historical basis for curating it as its own disease.
discussions:
  - discussion_id: trpv4_ankyrin_domain_phenotype_discordance
    kind: KNOWLEDGE_GAP
    prompt: >-
      What determines whether a TRPV4 ankyrin-repeat-domain variant produces
      CMT2C, scapuloperoneal spinal muscular atrophy, congenital distal spinal
      muscular atrophy, or no neuropathy at all, given that the same residues
      and even the same variant can yield different phenotypes?
    attaches_to:
      - pathophysiology#TRPV4 Ankyrin-Repeat Domain Gain-of-Function Variant
    rationale: >-
      TRPV4 genotype-phenotype relationships are discordant at two levels. Within
      the neuromuscular group, the same variant can present as phenotypic CMT2C
      with vocal cord paresis in one individual and as undifferentiated CMT2 in
      another from the same family, so the laryngeal feature that defines the
      entity is not genotype-determined. Across the wider spectrum, TRPV4
      variants outside the ankyrin domain cause skeletal dysplasias with no
      neuropathy, and affected individuals typically have either neuromuscular
      or skeletal manifestations rather than both. A calcium-toxicity model
      explains why an ankyrin-domain gain of function kills neurons, but not why
      it kills these neurons in this pattern, nor why other gain-of-function
      variants spare neurons entirely and hit cartilage instead. Modifier genes,
      cell-type-specific channel regulation and differential expression are all
      candidates; none is established.
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Individuals with the same mutation may have nondistinct CMT2 or have
          phenotypic CMT2C with vocal cord paresis.
        explanation: >-
          The within-genotype discordance at the heart of this gap.
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Affected individuals typically have either neuromuscular or skeletal
          manifestations, although overlapping phenotypes can occur.
        explanation: >-
          States the neuromuscular/skeletal dichotomy across the TRPV4 spectrum
          that any candidate mechanism would have to explain.
  - discussion_id: trpv4_channel_blockade_therapeutic_hypothesis
    kind: KNOWLEDGE_GAP
    prompt: >-
      Does pharmacological TRPV4 channel blockade prevent or slow axonal
      degeneration in TRPV4-related neuropathy in vivo, as it prevents mutant
      cell death in vitro?
    attaches_to:
      - pathophysiology#Cytotoxic Intracellular Calcium Elevation
    rationale: >-
      This entry curates no treatments, because none exists beyond symptomatic
      management. But the in-vitro result is unusually pointed: mutant-induced
      cell death was reversed by the TRPV channel antagonist ruthenium red, and
      the original authors themselves flagged the reversibility as an attractive
      target. That is a specific, testable therapeutic hypothesis attached to a
      specific node, and it is recorded here rather than as an absent treatments
      section so that the gap is visible and the reasoning is not lost. Ruthenium
      red itself is a non-selective research tool, not a candidate drug; the
      hypothesis concerns TRPV4 blockade as a principle.
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The reversibility of cell death by channel blockade provides an
          attractive area of investigation in consideration of treatable axonal
          degeneration.
        explanation: >-
          The authors' own statement of the therapeutic hypothesis this gap
          records. Graded IN_VITRO because the reversibility was shown in
          transfected cells and has not been tested in vivo.

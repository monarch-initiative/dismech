  - name: Respiratory Insufficiency from Diaphragm Weakness
    category: Respiratory
    description: >-
      Diaphragm weakness presenting as orthopnoea. Together with laryngeal
      dysfunction this is the main determinant of morbidity, and because it does
      not track limb severity it warrants independent surveillance.
    phenotype_term:
      preferred_term: Respiratory insufficiency
      term:
        id: HP:0002093
        label: Respiratory insufficiency
    evidence:
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Additional common features include laryngeal dysfunction (i.e., vocal
          fold paresis causing voice change and/or inspiratory stridor),
          diaphragm weakness (orthopnea), scoliosis, bilateral sensorineural
          hearing loss, and joint contractures.
        explanation: >-
          The GeneReviews feature list. Note its scope is the TRPV4
          neuromuscular group as a whole, not CMT2C specifically, so this
          supports the feature occurring in this disease group rather than a
          CMT2C-specific frequency. Graded OTHER as expert consensus review.

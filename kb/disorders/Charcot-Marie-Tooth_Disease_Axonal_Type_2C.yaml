          Additional common features include laryngeal dysfunction (i.e., vocal
          fold paresis causing voice change and/or inspiratory stridor),
          diaphragm weakness (orthopnea), scoliosis, bilateral sensorineural
          hearing loss, and joint contractures.
        explanation: >-
          Names joint contractures among the common additional features. Same
          group-level scope caveat as the other features drawn from this
          sentence.
genetic:
  - name: TRPV4
    relationship_type: CAUSATIVE
    gene_term:
      preferred_term: TRPV4
      term:
        id: hgnc:18083
        label: TRPV4
    notes: >-
      Causal variants cluster in the intracellular N-terminal ankyrin repeat
      domain: R232C, R269H, R315W, R316C, R316H and S542Y are reported. R269H,
      R315W and R316C come from the two 2010 gene-discovery papers cited below,
      which is where the variant spectrum in this note originates. The same
      residues also cause scapuloperoneal spinal muscular atrophy and congenital
      distal spinal muscular atrophy, and the same variant can present as either
      phenotypic CMT2C or as undifferentiated CMT2 within one family - so a
      TRPV4 ankyrin-domain variant predicts TRPV4 neuromuscular disease but does
      not predict which of the three phenotypes a given individual will have.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          TRPV4 ankyrin domain alterations including a novel de novo mutation
          cause axonal CMT2. Individuals with the same mutation may have
          nondistinct CMT2 or have phenotypic CMT2C with vocal cord paresis.
        explanation: >-
          Establishes causality and, in the same breath, the within-genotype
          phenotypic variability that the notes describe.
      - reference: PMID:20037588
        reference_title: "Alterations in the ankyrin domain of TRPV4 cause congenital distal SMA, scapuloperoneal SMA and HMSN2C."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The arginine missense substitutions R269H, R315W and R316C disrupt one
          of these repeats, which allowed us to identify a new 315RR repeat that
          appears to affect proper TRPV4 channel maturation.
        explanation: >-
          The source of the R269H, R315W and R316C substitutions named in the
          notes above, and of the structural account of why these particular
          arginines matter.
      - reference: PMID:12062259
        reference_title: >-
          Charcot-Marie-Tooth disease type 2C: a distinct genetic entity.
          Clinical and molecular characterization of the first European family.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Charcot-Marie-Tooth disease type 2C is clinically and genetically
          different from Charcot-Marie-Tooth disease type 2A, B, D, E and F, and
          is not allelic with distal hereditary motor neuronopathy type VII.
        explanation: >-
          The pre-gene linkage evidence establishing CMT2C as a separate entity,
          which is the historical basis for curating it as its own disease.
discussions:
  - discussion_id: trpv4_ankyrin_domain_phenotype_discordance
    kind: KNOWLEDGE_GAP
    prompt: >-
      What determines whether a TRPV4 ankyrin-repeat-domain variant produces
      CMT2C, scapuloperoneal spinal muscular atrophy, congenital distal spinal
      muscular atrophy, or no neuropathy at all, given that the same residues
      and even the same variant can yield different phenotypes?
    attaches_to:
      - pathophysiology#TRPV4 Ankyrin-Repeat Domain Gain-of-Function Variant
    rationale: >-
      TRPV4 genotype-phenotype relationships are discordant at two levels. Within
      the neuromuscular group, the same variant can present as phenotypic CMT2C
      with vocal cord paresis in one individual and as undifferentiated CMT2 in
      another from the same family, so the laryngeal feature that defines the
      entity is not genotype-determined. Across the wider spectrum, TRPV4
      variants outside the ankyrin domain cause skeletal dysplasias with no
      neuropathy, and affected individuals typically have either neuromuscular
      or skeletal manifestations rather than both. A calcium-toxicity model
      explains why an ankyrin-domain gain of function kills neurons, but not why
      it kills these neurons in this pattern, nor why other gain-of-function
      variants spare neurons entirely and hit cartilage instead. Modifier genes,
      cell-type-specific channel regulation and differential expression are all
      candidates; none is established.
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Individuals with the same mutation may have nondistinct CMT2 or have
          phenotypic CMT2C with vocal cord paresis.
        explanation: >-
          The within-genotype discordance at the heart of this gap.
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Affected individuals typically have either neuromuscular or skeletal
          manifestations, although overlapping phenotypes can occur.
        explanation: >-
          States the neuromuscular/skeletal dichotomy across the TRPV4 spectrum
          that any candidate mechanism would have to explain.
  - discussion_id: trpv4_channel_blockade_human_translation
    kind: HUMAN_MODEL_MISMATCH
    prompt: >-
      Does systemic TRPV4 antagonism, which rescues symptomatic knock-in mice,
      benefit human CMT2C, given that the mouse disease is lethal and
      vascular-dominant while the human disease is chronic and usually
      non-lethal?
    attaches_to:
      - pathophysiology#Endothelial Blood-CNS Barrier Breakdown
      - pathophysiology#Cytotoxic Intracellular Calcium Elevation
    rationale: >-
      Systemic administration of a TRPV4-specific antagonist abrogates the
      barrier impairment and markedly rescues symptomatic mutant mice, so the
      open question is not whether channel blockade works in an animal but
      whether the animal is the right animal. The knock-in mice show early lethality and a vascular-dominant
      phenotype, whereas human CMT2C is a chronic, slowly progressive neuropathy
      in which patients characteristically survive to adulthood - so a rescue
      measured against early death in mice does not straightforwardly predict
      benefit against decades of axonal loss in people. The reversibility of the
      barrier lesion is the encouraging part; the severity mismatch is the
      caveat.
    evidence:
      - reference: PMID:38776392
        reference_title: >-
          Gain-of-function mutations of TRPV4 acting in endothelial cells drive
          blood-CNS barrier breakdown and motor neuron degeneration in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Systemic administration of a TRPV4-specific antagonist abrogated
          channel-mediated BSCB impairments and provided a marked phenotypic
          rescue of symptomatic mutant mice.
        explanation: >-
          The in vivo rescue, which is what moves the open question from
          "does blockade work at all" to "does this model predict humans".
      - reference: PMID:38776392
        reference_title: >-
          Gain-of-function mutations of TRPV4 acting in endothelial cells drive
          blood-CNS barrier breakdown and motor neuron degeneration in mice.
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          TRPV4 mutant mice exhibited weakness, early lethality, and regional
          motor neuron loss.
        explanation: >-
          Graded PARTIAL because it supports the mismatch rather than the
          therapeutic claim: early lethality is not a feature of human CMT2C,
          and it is the severity gap that makes the translation uncertain.
animal_models:
  - name: Trpv4 R269C and R232C knock-in mice
    species: Mouse
    genotype: Trpv4 R269C or R232C knock-in at the endogenous locus
    publication: PMID:38776392
    description: >-
      Knock-in of two patient substitutions into the endogenous mouse Trpv4
      gene. The decisive experiments are the conditional deletions: removing the
      mutant allele from endothelium rescues, removing it from neurons, glia or
      muscle does not.
    modeled_mechanisms:
      - target: Endothelial Blood-CNS Barrier Breakdown
        relationship: RECAPITULATES
        fidelity: HIGH
        description: >-
          Focal blood-spinal cord barrier disruption with altered endothelial
          tight junction structure, attributable to the mutant channel in
          endothelial cells specifically.
        readouts:
          - name: Blood-spinal cord barrier integrity
            target: Endothelial Blood-CNS Barrier Breakdown
            direction: DECREASED
            interpretation: >-
              Direct measure of the barrier lesion this node models.
            evidence:
              - reference: PMID:38776392
                reference_title: >-
                  Gain-of-function mutations of TRPV4 acting in endothelial
                  cells drive blood-CNS barrier breakdown and motor neuron
                  degeneration in mice.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  Symptomatic mutant mice exhibited focal disruptions of
                  blood-spinal cord barrier (BSCB) integrity
                explanation: >-
                  The measurement itself.
          - name: Phenotypic response to systemic TRPV4 antagonist
            target: Endothelial Blood-CNS Barrier Breakdown
            direction: RESTORED
            interpretation: >-
              The rescue arm. Establishes that the barrier lesion is reversible
              pharmacologically, which is what makes the human translation
              question worth asking rather than idle.
            evidence:
              - reference: PMID:38776392
                reference_title: >-
                  Gain-of-function mutations of TRPV4 acting in endothelial
                  cells drive blood-CNS barrier breakdown and motor neuron
                  degeneration in mice.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  Systemic administration of a TRPV4-specific antagonist
                  abrogated channel-mediated BSCB impairments and provided a
                  marked phenotypic rescue of symptomatic mutant mice.
                explanation: >-
                  Reports both the barrier and the phenotypic rescue.
        evidence:
          - reference: PMID:38776392
            reference_title: >-
              Gain-of-function mutations of TRPV4 acting in endothelial cells
              drive blood-CNS barrier breakdown and motor neuron degeneration in
              mice.
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Genetic deletion of the mutant Trpv4 allele from endothelial cells
              (but not neurons, glia, or muscle) rescued these phenotypes.
            explanation: >-
              The cell-type-specific rescue that makes this model informative
              about where the lesion begins, not merely that it occurs.
      - target: Motor-Predominant Axonal Degeneration
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: >-
          Weakness and regional motor neuron loss are reproduced, but with early
          lethality that human CMT2C does not show.
        limitations: >-
          The mouse disease is more severe and differently shaped than the human
          one: knock-in mice die early and their phenotype is vascular-dominant,
          whereas human CMT2C is a chronic, slowly progressive neuropathy whose
          defining features are vocal cord and diaphragm involvement with normal
          or near-normal lifespan. The model is therefore strong evidence about
          mechanism and weak evidence about natural history, and a therapeutic
          rescue measured against early murine death should not be read as
          predicting benefit against decades of human axonal loss.
        readouts:
          - name: Regional motor neuron number
            target: Motor-Predominant Axonal Degeneration
            direction: DECREASED
            interpretation: >-
              The degenerative endpoint, reproduced in the model.
            evidence:
              - reference: PMID:38776392
                reference_title: >-
                  Gain-of-function mutations of TRPV4 acting in endothelial
                  cells drive blood-CNS barrier breakdown and motor neuron
                  degeneration in mice.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  TRPV4 mutant mice exhibited weakness, early lethality, and
                  regional motor neuron loss.
                explanation: >-
                  Reports the motor neuron loss, and in the same sentence the
                  early lethality that grounds the limitation above.
treatments:
  - name: Orthoses and Mobility Support
    description: >-
      Ankle-foot and knee-ankle-foot orthoses, shoes with good ankle support,
      surgery for severe foot deformities, mobility devices and exercise as
      tolerated. Symptomatic management, which is what exists for this disease.
    therapeutic_modality: DEVICE
    treatment_term:
      preferred_term: physical therapy
      term:
        id: NCIT:C15302
        label: Physical Therapy
    evidence:
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          For neuromuscular disorders, additional treatment includes special
          shoes with good ankle support, shoe orthotics, ankle-foot orthoses /
          knee-ankle-foot orthoses, surgery for severe foot deformities,
          mobility devices, and exercise as tolerated
        explanation: >-
          The GeneReviews management protocol for the neuromuscular arm. Scope
          caveat as elsewhere in this entry: GeneReviews covers all three TRPV4
          neuromuscular phenotypes together.
  - name: Laryngeal Surgery for Vocal Cord Paresis
    description: >-
      Vocal fold lateralization or tracheostomy in individuals with severe
      laryngeal involvement. This is the intervention the entry's defining
      phenotype leads to.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: surgical procedure
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    target_mechanisms:
      - target: Laryngeal and Diaphragmatic Denervation
        description: >-
          Relieves the airway consequence of laryngeal denervation. It does not
          act on the channel or the degeneration.
    evidence:
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          laryngeal surgery for vocal cord paresis (in some individuals, vocal
          fold lateralization or tracheostomy); speech therapy; and respiratory
          therapy including noninvasive ventilatory support as needed
        explanation: >-
          Names the laryngeal and respiratory interventions. Same GeneReviews
          scope caveat.
  - name: Avoidance of Neurotoxic Medications and Respiratory Infection
    description: >-
      GeneReviews names specific circumstances to avoid, and one of them is
      unusually consequential here: upper respiratory tract infection can swell
      the vocal folds and worsen upper airway obstruction in a patient whose
      folds are already paretic. Diabetes and neurotoxic drugs are to be avoided
      as additional insults to an already compromised nerve.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          For neuromuscular disorders, avoid diabetes and neurotoxic
          medications; upper respiratory tract infections can cause vocal fold
          swelling and worsen upper airway obstruction.
        explanation: >-
          The agents-and-circumstances-to-avoid guidance, including the
          respiratory-infection interaction with vocal fold paresis.
diagnosis:
  - name: Molecular Genetic Testing with Characteristic Neurophysiology
    description: >-
      Diagnosis rests on characteristic clinical and neurophysiologic findings
      plus a heterozygous TRPV4 pathogenic variant. The neurophysiology is what
      separates this from demyelinating CMT: the neuropathy is axonal, so
      compound muscle action potential amplitudes are reduced while conduction
      velocities remain normal or near-normal.
    evidence:
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The diagnosis of an autosomal dominant TRPV4-related disorder is
          established in a proband who has characteristic clinical and
          neurophysiologic findings, radiographic findings in the skeletal
          dysplasias, and a heterozygous TRPV4 pathogenic variant identified by
          molecular genetic testing.
        explanation: >-
          The diagnostic criteria. Note the sentence is about TRPV4-related
          disorders as a group; the axonal electrophysiology detail in this
          node's description is standard for CMT2 and is not asserted by this
          quote.
  - name: Surveillance for Laryngeal and Respiratory Involvement
    description: >-
      Because laryngeal and diaphragmatic severity does not track limb severity,
      respiratory and laryngeal surveillance has to be scheduled independently
      of the neurological examination rather than triggered by it.
    evidence:
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          For neuromuscular disorders, annual neurologic examination, physical
          therapy assessment, otolaryngology evaluation of laryngeal function,
          dynamic breathing chest radiograph, pulmonary function tests, sleep
          study, hearing assessment, and musculoskeletal evaluation
        explanation: >-
          The surveillance schedule, which is the concrete answer to the
          "warrants independent surveillance" claim the respiratory phenotype
          makes.

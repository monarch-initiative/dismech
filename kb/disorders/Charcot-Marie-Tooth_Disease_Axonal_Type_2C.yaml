name: Charcot-Marie-Tooth Disease Axonal Type 2C
creation_date: "2026-08-28T00:20:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type 2C is an autosomal dominant axonal neuropathy
  caused by heterozygous missense variants in the ankyrin-repeat domain of
  TRPV4, a calcium-permeable cation channel. It was recognised as a distinct
  clinical entity long before its gene was found, on the strength of a feature
  no other CMT2 subtype has: vocal cord and diaphragm paralysis accompanying the
  limb neuropathy. Two things about it are unusual enough to be the reason the
  entry exists. First, the mechanism is a channel gain of function, not a loss:
  mutant TRPV4 localises normally but raises resting intracellular calcium to
  cytotoxic levels, and in transfected cells the resulting death is reversed by
  a TRPV channel antagonist - a rare instance of an inherited axonal
  degeneration that is pharmacologically reversible in vitro. Second, the
  laryngeal and diaphragmatic involvement does not track limb severity: patients
  with the worst muscle weakness may have minimal respiratory symptoms and vice
  versa, so respiratory risk cannot be inferred from the neurological
  examination. The same ankyrin-domain residues also produce scapuloperoneal
  spinal muscular atrophy and congenital distal spinal muscular atrophy, while
  TRPV4 variants elsewhere in the protein cause skeletal dysplasias with no
  neuropathy at all.
parents:
  - Charcot-Marie-Tooth Disease
  - Hereditary Motor and Sensory Neuropathy
  - Channelopathy
synonyms:
  - CMT2C
  - HMSN2C
  - hereditary motor and sensory neuropathy type IIC
  - Charcot-Marie-Tooth disease type 2C with vocal cord paresis
disease_term:
  preferred_term: Charcot-Marie-Tooth disease axonal type 2C
  term:
    id: MONDO:0011633
    label: Charcot-Marie-Tooth disease axonal type 2C
references:
  - reference: PMID:24830047
    title: "Autosomal Dominant TRPV4-Related Disorders."
    tags:
      - GeneReviews
notes: >-
  Boundary with the neighbouring TRPV4 entries, which is the modelling question
  this entry has to answer. TRPV4 neuromuscular disease is already partly
  curated in kb/ as Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant,
  which discusses HMSN2C within the TRPV4 allelic series, and as
  Scapuloperoneal_Spinal_Muscular_Atrophy. Neither carries MONDO:0011633. CMT2C
  is separable from those on a definitional rather than a merely clinical
  ground: it has sensory involvement, and a distal hereditary *motor*
  neuronopathy by definition does not. The three phenotypes overlap clinically
  and arise from the same residues, so this entry cross-references rather than
  duplicating them, and the shared calcium-toxicity mechanism is stated here in
  full because the project's convention for conserved mechanisms is duplication
  with consistency checking rather than inheritance.

  GeneReviews baseline. PMID:24830047, Autosomal Dominant TRPV4-Related
  Disorders, is the expert-curated reference for this gene and is tagged in the
  references block. Its Clinical Characteristics section covers all three
  neuromuscular phenotypes together rather than CMT2C alone, so features it
  lists - laryngeal dysfunction, diaphragm weakness, scoliosis, sensorineural
  hearing loss, joint contractures - are curated here as phenotypes of the
  TRPV4 neuromuscular group with that scope stated in each explanation, rather
  than being silently attributed to CMT2C specifically.
inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Both inherited and de novo heterozygous variants are described.
      Expressivity is markedly variable, including for the defining laryngeal
      feature. On penetrance the sources disagree in a way worth preserving: the
      2002 European family was reported as highly penetrant, but GeneReviews
      states across the TRPV4 neuromuscular disorders that phenotype and
      severity cannot be accurately predicted because of reduced penetrance and
      highly variable expressivity. This entry does not assert high penetrance
      generally; the family-level observation is recorded as such.
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The R316H is a novel de novo mutation found in a patient with CMT2C
          phenotype.
        explanation: >-
          Documents a de novo occurrence, establishing that the disease is not
          exclusively familial.
      - reference: PMID:12062259
        reference_title: >-
          Charcot-Marie-Tooth disease type 2C: a distinct genetic entity.
          Clinical and molecular characterization of the first European family.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In this family the disease has high penetrance, variable severity and
          apparently the most severe limb muscle involvement in the youngest
          generation.
        explanation: >-
          Reports high penetrance alongside variable severity in a
          multigenerational family.
mechanistic_hypotheses:
  - hypothesis_group_id: trpv4_endothelial_non_cell_autonomous
    hypothesis_label: Non-cell-autonomous degeneration via endothelial barrier breakdown
    status: CANONICAL
    description: >-
      The account with the strongest in vivo support. Knock-in mice carrying the
      same ankyrin-domain substitutions found in patients develop weakness and
      regional motor neuron loss, and deleting the mutant allele specifically
      from endothelial cells rescues them, while deleting it from neurons, glia
      or muscle does not. The proximate lesion is focal breakdown of the
      blood-spinal cord barrier, driven by gain of mutant channel function in
      neural vascular endothelial cells. On this account motor neuron death is a
      consequence of vascular barrier failure rather than of channel activity in
      the neuron itself.
    evidence:
      - reference: PMID:38776392
        reference_title: >-
          Gain-of-function mutations of TRPV4 acting in endothelial cells drive
          blood-CNS barrier breakdown and motor neuron degeneration in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Genetic deletion of the mutant Trpv4 allele from endothelial cells
          (but not neurons, glia, or muscle) rescued these phenotypes.
        explanation: >-
          The cell-type-specific rescue experiment, which is what makes this a
          claim about the driving cell type rather than about where the channel
          happens to be expressed.
  - hypothesis_group_id: trpv4_neuron_autonomous_calcium_toxicity
    hypothesis_label: Neuron-autonomous cytotoxic calcium overload
    status: ALTERNATIVE
    description: >-
      The account this entry's pathophysiology chain models in detail: mutant
      channel activity raises intracellular calcium to cytotoxic levels and
      kills the cell directly, with the death reversible by channel blockade.
      It rests on transfected-cell work rather than on in vivo genetics, and the
      cell-type-specific rescue above argues that in the intact animal the
      neuron is not the cell in which the decisive channel activity occurs. The
      two are not mutually exclusive - calcium toxicity is the proximate cause
      of cell death in whichever cell type carries the decisive activity - but
      an entry that modelled only the neuronal version would misstate where the
      lesion begins.
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Cells transfected with R232C and R316H displayed increased
          intracellular Ca(2+) levels and reversible cell death by the TRPV
          channel antagonist, ruthenium red.
        explanation: >-
          The transfected-cell basis of this account, and the reason it is
          ALTERNATIVE rather than CANONICAL: the experiment establishes calcium
          toxicity in a cell line, not that the neuron is the driving cell type
          in vivo.
      - reference: PMID:20037587
        reference_title: "Scapuloperoneal spinal muscular atrophy and CMT2C are allelic disorders caused by alterations in TRPV4."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Our findings link mutations in TRPV4 to altered calcium homeostasis
          and peripheral neuropathies, implying a pathogenic mechanism and
          possible options for therapy
        explanation: >-
          Links the TRPV4 mutations to altered calcium homeostasis as the
          proposed pathogenic mechanism. Supports the calcium-toxicity account
          without establishing which cell type carries the decisive activity,
          which is why this group remains ALTERNATIVE.
  - hypothesis_group_id: trpv4_reduced_surface_expression
    hypothesis_label: Reduced channel surface expression and haploinsufficiency
    status: DEPRECATED
    description: >-
      A directly opposed reading of the same variants, and the entry records it
      because the disagreement is real rather than settled. The 2010
      gene-discovery study found that R269H, R315W and R316C reduced or
      abolished cell-surface expression and produced decreased stimulus-dependent
      channel activity in HeLa cells, and proposed haploinsufficiency as the
      likely pathomechanism - the opposite direction to the gain-of-function
      reading this entry otherwise adopts. The weight of later evidence favours
      gain of function, particularly the in vivo endothelial work, but a curator
      reading only the GOF papers would not know this was ever in question.
    evidence:
      - reference: PMID:20037588
        reference_title: "Alterations in the ankyrin domain of TRPV4 cause congenital distal SMA, scapuloperoneal SMA and HMSN2C."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Based on our results using HeLa cells as a heterologous expression
          system, we suggest that the mutations described here lead to decreased
          stimulus-dependent TRPV4 channel activity.
        explanation: >-
          The authors' own directional conclusion, opposite to the
          gain-of-function reading. Graded IN_VITRO because it is a
          heterologous-expression result.
      - reference: PMID:20037588
        reference_title: "Alterations in the ankyrin domain of TRPV4 cause congenital distal SMA, scapuloperoneal SMA and HMSN2C."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Haploinsufficiency can be considered the most likely underlying
          pathomechanism, although we cannot fully exclude adverse interaction
          of wild-type and mutant TRPV4 subunits.
        explanation: >-
          States the haploinsufficiency proposal explicitly, including the
          authors' own hedge.
pathophysiology:
  - name: TRPV4 Ankyrin-Repeat Domain Gain-of-Function Variant
    biological_scale: MOLECULAR
    description: >-
      Heterozygous missense variants clustering in the intracellular
      N-terminal ankyrin repeat domain of TRPV4 - R232C, R269H, R315W, R316C,
      R316H, S542Y among them - produce a channel that reaches the membrane
      normally but is inappropriately active. The direction of the defect is the
      substantive claim: mutant protein subcellular localisation is normal in
      transfected cells, so this is not a trafficking or expression failure, and
      the functional data point to gain rather than loss of channel function.
    genes:
      - preferred_term: TRPV4
        term:
          id: hgnc:18083
          label: TRPV4
    molecular_functions:
      - preferred_term: calcium channel activity
        term:
          id: GO:0005262
          label: calcium channel activity
        modifier: GAIN_OF_FUNCTION
    genetic_context:
      functional_impact_category: GAIN_OF_FUNCTION
      allele_type: MISSENSE
      zygosity: HETEROZYGOUS
    downstream:
      - target: Cytotoxic Intracellular Calcium Elevation
        hypothesis_groups:
          - trpv4_neuron_autonomous_calcium_toxicity
      - target: Endothelial Blood-CNS Barrier Breakdown
        hypothesis_groups:
          - trpv4_endothelial_non_cell_autonomous
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Two TRPV4 mutations R232C and R316H from 17 CMT2C families were
          identified in the ankyrin repeat domains.
        explanation: >-
          Localises the causal variants to the ankyrin repeat domain across a
          17-family CMT2C cohort. Graded HUMAN_CLINICAL because this is
          sequencing of human families, not a cell-based assay; the sibling item
          below, from the same paper, is IN_VITRO because it reports a
          transfected-cell localisation experiment.
      - reference: PMID:20037587
        reference_title: "Scapuloperoneal spinal muscular atrophy and CMT2C are allelic disorders caused by alterations in TRPV4."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Functional analysis revealed that increased calcium channel activity
          is a distinct property of both SPSMA- and CMT2C-causing mutant
          proteins.
        explanation: >-
          Independent support for the gain-of-function direction, from a
          different group than the Klein cohort, and covering the
          CMT2C-causing mutants specifically. Worth having because the direction
          of the functional defect is contested in this disease - see the
          reduced-surface-expression hypothesis group.
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Both mutant TRPV4 proteins had normal subcellular localization in
          HEK293 and HeLa cells.
        explanation: >-
          Rules out mislocalisation as the mechanism, which is what makes the
          gain-of-function reading rather than a loss-of-function one the
          supported interpretation. Graded IN_VITRO because the localisation was
          assessed in transfected cell lines.
  - name: Cytotoxic Intracellular Calcium Elevation
    biological_scale: CELLULAR
    description: >-
      Cells expressing the mutant channel carry increased intracellular calcium
      and die. The calcium elevation is the proximate toxic species: blocking
      the channel prevents the death, which is what distinguishes a causal
      calcium overload from an incidental one.
    biological_processes:
      - preferred_term: calcium ion transmembrane transport
        term:
          id: GO:0070588
          label: calcium ion transmembrane transport
        modifier: INCREASED
      - preferred_term: calcium ion homeostasis
        term:
          id: GO:0055074
          label: calcium ion homeostasis
        modifier: DYSREGULATED
    downstream:
      - target: Motor-Predominant Axonal Degeneration
    evidence:
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Cells transfected with R232C and R316H displayed increased
          intracellular Ca(2+) levels and reversible cell death by the TRPV
          channel antagonist, ruthenium red.
        explanation: >-
          Reports the calcium elevation, the resulting cell death, and its
          reversal by channel blockade - the three observations this node
          depends on. Graded IN_VITRO because the work is in transfected cells.
      - reference: PMID:21288981
        reference_title: "TRPV4 mutations and cytotoxic hypercalcemia in axonal Charcot-Marie-Tooth neuropathies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Reversible hypercalcemic gain-of-function of mutant TRPV4 instead of
          loss-of-function appears to be pathologically important.
        explanation: >-
          The authors' own directional conclusion, which is what licenses the
          GAIN_OF_FUNCTION modifier used upstream rather than a
          loss-of-function reading.
  - name: Endothelial Blood-CNS Barrier Breakdown
    biological_scale: TISSUE
    description: >-
      Gain of mutant channel function in neural vascular endothelial cells
      alters tight junction structure and produces focal disruption of the
      blood-spinal cord barrier. In knock-in mice this is the step that actually
      drives motor neuron loss: deleting the mutant allele from endothelium
      rescues the phenotype, while deleting it from neurons, glia or muscle does
      not. The node is curated because without it the entry asserts a
      neuron-autonomous chain that the strongest in vivo evidence contradicts.
      Its evidence is entirely murine, and the human relevance is the open
      question recorded in the mismatch discussion below.
    cell_types:
      - preferred_term: neural vascular endothelial cell
        term:
          id: CL:0000071
          label: blood vessel endothelial cell
    downstream:
      - target: Motor-Predominant Axonal Degeneration
        hypothesis_groups:
          - trpv4_endothelial_non_cell_autonomous
    evidence:
      - reference: PMID:38776392
        reference_title: >-
          Gain-of-function mutations of TRPV4 acting in endothelial cells drive
          blood-CNS barrier breakdown and motor neuron degeneration in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Symptomatic mutant mice exhibited focal disruptions of blood-spinal
          cord barrier (BSCB) integrity, associated with a gain of function of
          mutant TRPV4 channel activity in neural vascular endothelial cells
          (NVECs) and alterations of NVEC tight junction structure.
        explanation: >-
          The barrier lesion and its localisation to endothelial cells, which is
          what this node models.
      - reference: PMID:38776392
        reference_title: >-
          Gain-of-function mutations of TRPV4 acting in endothelial cells drive
          blood-CNS barrier breakdown and motor neuron degeneration in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Together, our findings show that mutant TRPV4 channels can drive motor
          neuron degeneration in a non-cell autonomous manner by precipitating
          focal breakdown of the BSCB.
        explanation: >-
          The authors' conclusion that degeneration is non-cell-autonomous,
          which is the claim this node adds to the entry.
  - name: Motor-Predominant Axonal Degeneration
    biological_scale: TISSUE
    description: >-
      Neuronal loss produces a motor-predominant, non-length-dependent axonal
      neuropathy. Two features distinguish it from a generic dying-back
      neuropathy and both matter clinically: it is not length-dependent, so
      proximal and cranial-nerve-innervated territories are vulnerable rather
      than merely distal ones, and it is motor-greater-than-sensory rather than
      purely motor - the sensory component is what separates CMT2C from the
      allelic distal hereditary motor neuronopathies.
    cell_types:
      - preferred_term: motor neuron
        term:
          id: CL:0000100
          label: motor neuron
    biological_processes:
      - preferred_term: neuron apoptotic process
        term:
          id: GO:0051402
          label: neuron apoptotic process
        modifier: INCREASED
    downstream:
      - target: Laryngeal and Diaphragmatic Denervation
      - target: Distal Limb Weakness and Sensory Loss
    evidence:
      - reference: PMID:21115951
        reference_title: "CMT2C with vocal cord paresis associated with short stature and mutations in the TRPV4 gene."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Two multigenerational families had a motor greater than sensory
          axonal neuropathy associated with variable vocal cord paresis.
        explanation: >-
          Establishes the motor-greater-than-sensory axonal pattern, including
          the sensory involvement that distinguishes CMT2C from a pure motor
          neuronopathy.
      - reference: PMID:24830047
        reference_title: "Autosomal Dominant TRPV4-Related Disorders."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          These neuromuscular disorders are characterized by a
          motor-predominant, non-length-dependent peripheral neuropathy or motor
          neuronopathy with a wide range in age of onset, from congenital to
          late adult.
        explanation: >-
          The GeneReviews characterisation, supporting the non-length-dependent
          quality specifically. Graded OTHER because GeneReviews is expert
          consensus review rather than a primary study, and note its scope is
          the TRPV4 neuromuscular group rather than CMT2C alone.
  - name: Laryngeal and Diaphragmatic Denervation
    biological_scale: TISSUE
    description: >-
      Denervation of the larynx and diaphragm produces vocal cord paresis, voice
      change, inspiratory stridor and orthopnoea, and is the feature that defined
      CMT2C as a clinical entity before its gene was known. It ranges from
      absent to severe enough to require permanent tracheostomy, and - the point
      with real clinical consequence - its severity is independent of limb
      involvement.
    evidence:
      - reference: PMID:12062259
        reference_title: >-
          Charcot-Marie-Tooth disease type 2C: a distinct genetic entity.
          Clinical and molecular characterization of the first European family.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Vocal cord paralysis is unrelated to the degree of muscular weakness
          and patients with the most severe muscle involvement have absent or
          minimal respiratory symptoms.
        explanation: >-
          The dissociation this node asserts, stated directly: respiratory risk
          cannot be inferred from limb severity.
      - reference: PMID:21115951
        reference_title: "CMT2C with vocal cord paresis associated with short stature and mutations in the TRPV4 gene."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The vocal cord paresis varied from absent to severe, requiring
          permanent tracheotomy in 2 subjects.
        explanation: >-
          Gives the range of laryngeal severity within TRPV4-confirmed CMT2C
          families, including the tracheostomy-requiring extreme.
  - name: Distal Limb Weakness and Sensory Loss
    biological_scale: ORGANISM
    description: >-
      The CMT limb phenotype: distal weakness and wasting with sensory loss,
      variable in severity between and within families, and in the first
      European family apparently more severe in the youngest generation.
    evidence:
      - reference: PMID:21115951
        reference_title: "CMT2C with vocal cord paresis associated with short stature and mutations in the TRPV4 gene."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The other family had a more severe, progressive, motor neuropathy with
          sensory loss, but less remarkable short stature and an R315W mutation
          in TRPV4.
        explanation: >-
          Documents progressive motor neuropathy with sensory loss in a
          TRPV4-confirmed CMT2C family.
phenotypes:
  - name: Vocal Cord Paresis
    category: Respiratory
    description: >-
      The defining feature of CMT2C. Ranges from clinically absent to severe
      enough to require permanent tracheostomy, and its severity is independent
      of limb involvement.
    phenotype_term:
      preferred_term: Vocal cord paresis
      term:
        id: HP:0001604
        label: Vocal cord paresis
    frequency: FREQUENT
    evidence:
      - reference: PMID:21115951
        reference_title: "CMT2C with vocal cord paresis associated with short stature and mutations in the TRPV4 gene."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The vocal cord paresis varied from absent to severe, requiring
          permanent tracheotomy in 2 subjects.
        explanation: >-
          Documents the phenotype and its full severity range. Recorded as
          FREQUENT rather than VERY_FREQUENT because the same source reports it
          as absent in some affected individuals, and the R232C family in the
          Klein cohort contained members with and without it.

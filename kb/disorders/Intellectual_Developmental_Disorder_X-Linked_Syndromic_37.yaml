- name: Serum calcium and parathyroid hormone measurement
  description: >
    Biochemical endocrine screening with serum calcium and PTH is indicated in
    ZFX variant carriers, and the reporting authors extend this specifically
    to clinically unaffected females with missense variants. An isolated PTH
    elevation with normal calcium has been interpreted as a possible early
    sign.
  evidence:
  - reference: PMID:41074764
    reference_title: De Novo Heterozygous ZFX Frameshift Variant in a Female With an X-Linked Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical care should include cardiac and endocrine monitoring, with endocrine testing offered to unaffected females carrying missense variants."
    explanation: The recommendation for endocrine testing in carriers.
  - reference: PMID:41077274
    reference_title: Expansion of the phenotype in ZFX neurodevelopmental disorder in a family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An elevated PTH was noted, with normocalcemia, a possible early sign of hyperparathyroidism."
    explanation: Shows what an early biochemical signal looks like in practice.
treatments:
- name: Multidisciplinary Supportive Care
  description: >
    No disease-modifying or targeted therapy exists for MRXS37. Management is
    supportive and multidisciplinary, as for other syndromic intellectual
    disabilities, and is directed at the individual's developmental,
    behavioural, sensory, cardiac and endocrine findings.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Cardiac and Endocrine Surveillance
  description: >
    Structured surveillance is the one management step the literature states
    explicitly for this disorder: cardiac monitoring, plus endocrine
    monitoring (serum calcium and PTH) extended to clinically unaffected
    females carrying missense variants, on the basis that the
    hyperparathyroidism risk tracks the missense allele class rather than the
    neurodevelopmental phenotype.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41074764
    reference_title: De Novo Heterozygous ZFX Frameshift Variant in a Female With an X-Linked Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical care should include cardiac and endocrine monitoring, with endocrine testing offered to unaffected females carrying missense variants."
    explanation: The explicit surveillance recommendation from the reporting authors.
- name: Parathyroidectomy
  description: >
    Surgical parathyroidectomy for symptomatic primary hyperparathyroidism, as
    performed in a germline ZFX missense carrier with normalisation of PTH,
    calcium and phosphorus afterwards. This treats the endocrine complication;
    it does not modify the neurodevelopmental disorder.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Parathyroidectomy
    term:
      id: NCIT:C51593
      label: Parathyroidectomy
  target_mechanisms:
  - target: Parathyroid Chief Cell Proliferation and Adenoma Formation
    treatment_effect: INHIBITS
    description: >
      Resection of the hyperfunctioning parathyroid tissue removes the
      proliferating chief-cell lesion driving the hypercalcaemia.
    evidence:
    - reference: PMID:39056049
      reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient underwent right inferior parathyroidectomy with normalization of PTH, calcium, and phosphorus."
      explanation: Demonstrates biochemical resolution after resection in a ZFX missense carrier.
  evidence:
  - reference: PMID:39056049
    reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 51-year-old woman with a history of primary hyperparathyroidism (PHPT) with prior parathyroidectomy, osteoporosis, and learning disability was referred for hypercalcemia discovered after a fall."
    explanation: >-
      Documents parathyroidectomy as the treatment actually used for the
      endocrine complication in a germline ZFX missense carrier.
- name: Genetic Counseling
  description: >
    Genetic counselling for families, covering the X-linked inheritance, the
    documented occurrence of both de novo and inherited variants, and the
    implication that a transmitting mother may be only minimally affected but
    still at endocrine risk if the allele is missense.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
animal_models:
- name: zfx loss-of-function zebrafish
  species: Zebrafish
  genotype: zfx loss of function
  publication: PMID:38325380
  description: >
    A zebrafish model of ZFX loss generated alongside the founding human
    cohort. It is the only in vivo model reported for this disorder and it
    supports a neurobehavioural consequence of ZFX loss.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a zebrafish model of ZFX loss displayed an altered behavioral phenotype"
    explanation: Establishes that this zebrafish model exists and what it showed.
  modeled_mechanisms:
  - target: Disrupted Neurodevelopment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >
      Reproduces an altered behavioural phenotype, supporting a conserved
      neurobehavioural role for ZFX.
    limitations: >
      Only a behavioural phenotype is reported. The model does not address the
      defining human features - intellectual disability, the recurrent facial
      gestalt, congenital anomalies, or hyperparathyroidism - and behaviour in
      a larval fish is not a measure of human neurocognition. Fidelity is
      recorded as LOW for that reason, not because the result is doubted.
    evidence:
    - reference: PMID:38325380
      reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, a zebrafish model of ZFX loss displayed an altered behavioral phenotype, providing additional evidence for the functional significance of ZFX."
      explanation: The model's reported outcome and the authors' own interpretation of its scope.
- name: Zfx knockout mouse
  species: Mouse
  genotype: Zfx conditional/germline deletion
  publication: PMID:17448993
  description: >
    Not a disease model of MRXS37 but the gene-function model that established
    ZFX's role in stem cell self-renewal. Deletion impairs self-renewal of
    embryonic and adult haematopoietic stem cells while sparing
    differentiation and short-term progenitors.
  evidence:
  - reference: PMID:17448993
    reference_title: Zfx controls the self-renewal of embryonic and hematopoietic stem cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The deletion of transcription factor Zfx impaired the self-renewal but not the differentiation capacity of murine ESC"
    explanation: >-
      Establishes the murine deletion model and the selective self-renewal
      phenotype for which it is cited here.
  modeled_mechanisms:
  - target: Impaired Stem and Progenitor Cell Self-Renewal
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Establishes the selective self-renewal requirement for Zfx that this
      pathophysiology node asserts.
    limitations: >
      Two limitations bound its use for the human disorder. First, this is a
      gene-function study in stem cell compartments, with no craniofacial,
      cardiac, endocrine or cognitive phenotyping analogous to the human
      syndrome, and neural progenitors were not the compartment assayed.
      Second, mouse Zfx is SUBJECT to X inactivation whereas human ZFX escapes
      it, so the dosage biology of a heterozygous female differs between
      species - see the HUMAN_MODEL_MISMATCH discussion.
    evidence:
    - reference: PMID:17448993
      reference_title: Zfx controls the self-renewal of embryonic and hematopoietic stem cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, Zfx deletion abolished the maintenance of adult HSC but did not affect erythromyeloid progenitors or fetal HSC."
      explanation: The selective, compartment-specific self-renewal requirement demonstrated in mouse.
experimental_models:
- name: ZFX knockdown and overexpression in human embryonic stem cells
  experimental_model_type: CELL_LINE
  description: >
    Human embryonic stem cells with ZFX knockdown or overexpression, used to
    test whether the self-renewal requirement identified in mouse is conserved
    in human cells. It is, which is what licenses using the murine stem cell
    data to reason about a human disorder.
  modeled_mechanisms:
  - target: Impaired Stem and Progenitor Cell Self-Renewal
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      ZFX knockdown impairs clonal growth and serial replating in human ESCs;
      overexpression resists spontaneous differentiation.
    limitations: >
      Embryonic stem cells are not neural progenitors and not patient-derived,
      and the perturbation is knockdown rather than a patient allele, so this
      supports the general requirement rather than the specific disease
      mechanism.
    evidence:
    - reference: PMID:22879936
      reference_title: ZFX controls the self-renewal of human embryonic stem cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ZFX knockdown in hESCs hindered clonal growth and decreased colony size after serial replating."
      explanation: The loss-of-function readout in human cells.
- name: ZFX and ZNF711 CRISPR knockout HEK293T cells
  experimental_model_type: CELL_LINE
  description: >
    Bi-allelic CRISPR knockouts of ZFX and/or ZNF711 in female HEK293T cells,
    used to establish the scale of transcriptome dysregulation caused by loss
    of these factors and to map the domains required for DNA binding and
    transactivation.
  modeled_mechanisms:
  - target: Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters
    relationship: MEASURES
    fidelity: MODERATE
    description: >
      Quantifies the transcriptomic consequence of losing ZFX and localises
      DNA-binding function to zinc fingers 11-13.
    limitations: >
      An immortalised kidney-derived cell line, not a neural or parathyroid
      context, and complete bi-allelic knockout rather than the partial dosage
      reduction that a heterozygous patient sustains.
    evidence:
    - reference: PMID:32406922
      reference_title: Characterization of the ZFX family of transcription factors that bind downstream of the start site of CpG island promoters.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that loss of either ZFX or ZNF711 reduced cell growth and that the double knockout cells have major defects in proliferation."
      explanation: The proliferation phenotype of ZFX loss in human cells.
differential_diagnoses:
- name: Other X-linked syndromic intellectual disability disorders
  description: >
    MRXS37 sits within a large group of X-linked syndromic intellectual
    disability disorders and is not clinically separable from them without
    sequencing. The recurrent facial gestalt is the feature that makes it
    pattern-recognisable once suspected, and hyperparathyroidism in a person
    with syndromic intellectual disability is the finding most likely to point
    specifically at ZFX.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in multiple genes on the X chromosome have been implicated in syndromic and non-syndromic intellectual disability disorders."
    explanation: >-
      States the differential-diagnostic context: ZFX sits among many X-linked
      genes producing syndromic intellectual disability.
- name: Non-syndromic and syndromic causes of primary hyperparathyroidism
  description: >
    Ascertainment can run the other way. A woman presenting with primary
    hyperparathyroidism who also has facial dysmorphism, hearing loss or
    cutaneous melanocytic nevi should prompt consideration of germline ZFX
    testing, which is the recommendation drawn by the endocrine case series.
  evidence:
  - reference: PMID:40779536
    reference_title: Association of germline variants in the ZFX gene with primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZFX may be one of the genes to be analyzed in women affected by PHPT with suspected genetic inheritance, especially if they have other features such as facial deformities, hearing loss, and cutaneous melanocytic nevi."
    explanation: The reverse-ascertainment recommendation from the endocrine literature.
discussions:
- discussion_id: zfx_mouse_xci_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Escape of ZFX from X Inactivation
  prompt: >
    Can mouse Zfx models be used to reason about ZFX dosage in human female
    carriers, given that mouse Zfx is subject to X inactivation while human
    ZFX escapes it?
  rationale: >
    This is a species difference in the exact variable the human disease
    mechanism turns on. In humans, ZFX escapes X inactivation, so a
    heterozygous female has a uniform partial reduction of ZFX in every cell -
    which is the proposed reason females are genuinely affected rather than
    silent carriers. In mouse, Zfx is inactivated, so a heterozygous female
    mouse is a cellular mosaic of wild-type and mutant cells and her
    phenotype depends on skewing. A heterozygous Zfx mouse therefore does not
    model a heterozygous ZFX human, and a mild or absent phenotype in such a
    mouse would be uninformative about human female dosage sensitivity rather
    than evidence against it. The mouse data used in this entry are from
    homozygous/conditional deletion in stem cell compartments, where the
    question does not arise; the mismatch bites for any future heterozygous
    mouse model.
  proposed_experiments:
  - experiment_id: allele_specific_zfx_expression_female_cells
    name: Allele-specific ZFX expression in patient-derived female cells
    description: >
      Measure allele-specific ZFX transcript and protein levels in cells from
      heterozygous females across the expressivity range, to test whether
      residual ZFX dosage - rather than X-inactivation skewing, which should
      not apply to an escape gene - tracks clinical severity.
  - experiment_id: escape_competent_mouse_model
    name: Humanised or escape-competent mouse model
    description: >
      Assess whether a mouse model engineered so that Zfx escapes inactivation
      reproduces female dosage sensitivity, isolating escape status as the
      variable.
  evidence:
  - reference: PMID:2052543
    reference_title: Inactivation of the Zfx gene on the mouse X chromosome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicate that the mouse Zfx gene is subject to X inactivation."
    explanation: Establishes the mouse side of the mismatch.
  - reference: PMID:2500252
    reference_title: ZFX has a gene structure similar to ZFY, the putative human sex determinant, and escapes X inactivation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcription analysis of human-rodent hybrid cell lines containing \"inactive\" human X chromosomes suggests that ZFX escapes X inactivation."
    explanation: Establishes the human side of the mismatch.
- discussion_id: zfx_neural_progenitor_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Stem and Progenitor Cell Self-Renewal
  prompt: >
    Does ZFX loss actually impair neural progenitor self-renewal in the
    developing human brain, or is the progenitor route to the
    neurodevelopmental phenotype an inference from embryonic and
    haematopoietic stem cells?
  rationale: >
    Every direct measurement of a ZFX self-renewal requirement comes from
    embryonic stem cells (mouse and human) or adult haematopoietic stem cells.
    No study has assayed neural progenitors, and no patient-derived neural
    tissue or organoid model of MRXS37 has been reported. The step from
    "ZFX maintains stem cell self-renewal" to "ZFX loss disrupts cortical
    development" is therefore currently an extrapolation across cell type, and
    the entry marks the causal edge into the neurodevelopmental node PARTIAL
    for that reason. The alternative that has not been excluded is that the
    relevant defect is not progenitor depletion at all but a post-mitotic
    transcriptional deficit in differentiating neurons.
  evidence:
  - reference: PMID:17448993
    reference_title: Zfx controls the self-renewal of embryonic and hematopoietic stem cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These studies identify Zfx as a shared transcriptional regulator of ESC and HSC, suggesting a common genetic basis of self-renewal in embryonic and adult SC."
    explanation: >-
      Shows the scope of what has actually been demonstrated - embryonic and
      haematopoietic stem cells - which is precisely the boundary this gap sits
      at. Marked PARTIAL because it supports the general self-renewal role but
      says nothing about neural progenitors.
  - reference: PMID:22879936
    reference_title: ZFX controls the self-renewal of human embryonic stem cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "ZFX-overexpressing hESCs resisted spontaneous differentiation but could be directed to differentiate into endodermal and neural cell fates when provided with the appropriate cues."
    explanation: >-
      The closest existing result to a neural readout, and it shows neural
      differentiation is preserved rather than assaying neural progenitor
      self-renewal - so the gap stands.
  proposed_experiments:
  - experiment_id: patient_ipsc_cortical_organoids
    name: Patient-derived iPSC cortical organoids
    description: >
      Differentiate iPSCs carrying truncating and zinc-finger missense ZFX
      alleles into cortical organoids and measure neural progenitor
      proliferation, apoptosis and cell-cycle exit against isogenic controls,
      distinguishing a progenitor-maintenance defect from a differentiation
      defect.
  - experiment_id: zfx_target_mapping_neural_progenitors
    name: ZFX target-gene mapping in human neural progenitors
    description: >
      ChIP-seq and nascent-transcription profiling of ZFX in human neural
      progenitor cells, to test whether the promoter-proximal pausing
      mechanism established in cancer cell lines operates on
      neurodevelopmental target genes.
- discussion_id: zfx_craniofacial_route_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Disrupted Craniofacial Patterning and Congenital Anomaly Formation
  prompt: >
    By what developmental route does impaired ZFX transcriptional activation
    produce the recurrent facial gestalt and the congenital-anomaly burden?
  rationale: >
    The genotype-to-gestalt association is not in doubt - it is the disease
    definition, and the founding cohort reports the facial features in every
    subject. What is entirely unexamined is the mechanism. No study has looked
    at cranial neural crest specification or migration, pharyngeal-arch
    patterning, or any other craniofacial developmental programme in ZFX
    deficiency, in any model system. The incoming causal edge is therefore
    drawn as INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence: the
    association is evidenced, the route is not. This is the craniofacial twin
    of `zfx_neural_progenitor_gap`, and the two may or may not share an
    intermediate - a common progenitor-maintenance deficit would explain both,
    but nothing currently rules out a craniofacial-specific transcriptional
    programme instead.
  proposed_experiments:
  - experiment_id: zfx_cranial_neural_crest_differentiation
    name: Cranial neural crest differentiation from patient iPSCs
    description: >
      Differentiate patient-derived and isogenic-control iPSCs down a cranial
      neural crest lineage and compare specification efficiency, migration and
      survival, to test whether the gestalt originates in a neural-crest defect
      at all.
  - experiment_id: zfx_craniofacial_model_morphometry
    name: Craniofacial morphometry and facial-primordia target profiling in a ZFX-deficient model
    description: >
      Quantitative craniofacial morphometry in a ZFX-deficient model organism,
      with ZFX target-gene profiling in the developing facial primordia, to
      identify which ZFX-dependent promoters operate in that tissue.
- discussion_id: zfx_missense_endocrine_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Germline ZFX Zinc-Finger Missense Variant
  prompt: >
    Do zinc-finger missense alleles cause hyperparathyroidism through gained
    or altered transcriptional activity, or is the missense-only association
    an artefact of small numbers?
  rationale: >
    The genotype-phenotype claim rests on hyperparathyroidism having been
    reported in four missense families and in no truncating case. With
    eighteen founding subjects plus a handful of later reports, and with
    hyperparathyroidism being an age-dependent finding in a largely paediatric
    cohort, the absence of endocrine disease among truncating carriers may
    reflect ascertainment and follow-up rather than biology. The functional
    data do not settle it either: the founding paper reports "differential
    expression of a small set of target genes" and explicitly declines to say
    whether this is gain or loss of activity. Resolving this matters clinically,
    because it determines whether endocrine surveillance should be offered to
    all ZFX carriers or only to missense carriers, which is how the current
    recommendation is written.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "DNA-binding domain variants elicited differential expression of a small set of target genes relative to wild-type ZFX in cultured cells, suggesting a gain or loss of transcriptional activity."
    explanation: >-
      The functional result that leaves the direction of effect open in the
      authors' own words, which is the substance of this gap.
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome or genome sequencing revealed 11 variants in 18 subjects (14 males and 4 females) from 16 unrelated families."
    explanation: >-
      Sources the cohort size that makes the missense-only association of
      hyperparathyroidism statistically fragile.
  proposed_experiments:
  - experiment_id: prospective_endocrine_surveillance_by_allele_class
    name: Prospective endocrine surveillance across allele classes
    description: >
      Longitudinal serum calcium and PTH in an unselected ZFX cohort stratified
      by allele class, with sufficient follow-up into adulthood to test whether
      truncating carriers are genuinely spared.
  - experiment_id: direction_resolving_functional_assay
    name: Direction-resolving functional assay in parathyroid-relevant cells
    description: >
      Compare genome-wide binding and target activation of wild-type ZFX,
      zinc-finger missense alleles, and null in a parathyroid or
      endocrine-competent cell model, to determine whether the missense alleles
      gain targets, lose targets, or redistribute.

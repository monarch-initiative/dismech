description: >
  X-linked syndromic intellectual developmental disorder 37 (MRXS37; OMIM
  301118; MONDO:0958322) is a recently delineated neurodevelopmental syndrome
  caused by germline variants in ZFX at Xp22.11. ZFX encodes a ubiquitously
  expressed Krueppel-type C2H2 zinc-finger transcription factor that acts as a
  transcriptional ACTIVATOR, binding a short motif a few hundred base pairs
  DOWNSTREAM of the transcription start site at the majority of active CpG
  island promoters, where it promotes productive elongation.

  The entity was defined in 2024 by a multi-centre cohort of 18 individuals
  (14 males, 4 females) from 16 unrelated families carrying 11 distinct
  germline ZFX variants. The core presentation is developmental delay and
  intellectual disability of variable severity with behavioural abnormalities
  and hypotonia, set on a recurrent and clinically recognisable facial gestalt
  (thickened and medially broadened eyebrows, altered facial shape, external
  eye anomalies, a smooth and/or long philtrum, and ear anomalies) together
  with a variable burden of congenital anomalies.

  Two features make this disorder mechanistically distinctive.

  First, ZFX is one of the small number of human X-linked genes that ESCAPE X
  inactivation, established since 1989. Both X alleles are therefore normally
  expressed in females, so a heterozygous female sustains a genuine dosage
  reduction in every cell rather than the mosaic of wild-type and mutant cells
  seen for X-inactivated genes. Consistent with this, females are genuinely
  affected as well as males rather than being obligate silent carriers -
  although expressivity in females is wide, from apparently unaffected
  transmitting mothers to syndromic multi-organ presentations, and males are
  in general more severely affected. This entry therefore annotates the
  neutral HPO `X-linked inheritance` term rather than asserting X-linked
  dominant or X-linked recessive.

  Second, the disorder carries an endocrine/neoplastic arm that is unusual
  among neurodevelopmental genes. Hyperparathyroidism was found in four
  founding-cohort families, all of which carried MISSENSE alleles. That
  observation aligns with the independent finding that recurrent SOMATIC ZFX
  missense mutations at an arginine hotspot (R786/R787) in the C-terminal
  zinc-finger region are selected in sporadic parathyroid adenomas, and it is
  why this entry models two partially separate mechanistic arms rather than
  one.

  The allele-class correlation must not be overstated, and this entry
  deliberately does not state it as a rule. The founding cohort reports
  hyperparathyroidism in four missense families; it does not report its
  absence in truncating families, so "found in missense families" is not the
  same claim as "restricted to missense alleles". A later endocrine series
  (PMID:40779536) weakens a strict version further: of its three germline ZFX
  carriers with primary hyperparathyroidism, one carries an IN-FRAME INSERTION
  rather than a missense allele, and of the two missense carriers one is
  p.(Arg536Cys), which does not lie in the C-terminal zinc fingers. Both of
  those are variants of uncertain significance, which is the honest caveat -
  but the correlation as published is a tendency observed in small numbers,
  not an established genotype-phenotype rule. See the
  `zfx_missense_endocrine_gap` discussion.

  SCOPE / EVIDENCE-MATURITY NOTE - this is a young entity. As of this
  curation there is no GeneReviews chapter, no Orphanet ORPHA code, no
  published prevalence estimate, no natural-history study, and no clinical
  trial; the whole literature is a founding cohort plus a handful of
  case reports and an endocrine case series. Frequencies are therefore
  omitted for most phenotypes rather than estimated, and the
  genotype-phenotype split below is curated as a competing-hypothesis pair,
  not as settled fact.

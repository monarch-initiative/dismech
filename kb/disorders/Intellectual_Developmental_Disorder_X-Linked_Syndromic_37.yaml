notes: >
  Curation provenance and identifier caveat. This entry was built from primary
  literature, with two deep-research reports used as lead-generation aids:
  `claude_code` and `openscientist`. The default `falcon`/Edison provider was
  attempted first and FAILED - the API returned HTTP 402 Payment Required and
  produced no report - so there is no falcon artifact for this entry. Both
  reports that did run passed the NEC preflight against MONDO:0958322 (PASS,
  with ZFX mentioned 53 and 59 times respectively and the next-ranked gene in
  low single digits), and both reported 9/9 citations resolved with none
  flagged off topic.

  One identifier error was caught and NOT propagated: the `claude_code` report
  asserted `HGNC:12874` for ZFX. That identifier is ZIC3. ZFX is `hgnc:12869`,
  which is both the causal gene recorded on MONDO:0958322 via RO:0004003 and
  the value the independent `openscientist` report gives. The wrong ID was
  discarded. This is worth recording because it is the DR failure mode that
  snippet validation cannot see - a fabricated ontology identifier is caught
  only by checking it against the ontology.

  One claim present in the `openscientist` report was deliberately NOT adopted:
  that "X-inactivation skewing is the dominant modifier of expression in
  females". That contradicts the escape-from-X-inactivation premise stated
  elsewhere in the same report and reasoned from here - skewing is precisely
  what does not govern an escape gene. A speculative link between ZFX and
  canonical Wnt signalling was also left out; its source is an editorial that
  presents it as "one possible mechanism".

  Several quantitative claims that circulate in secondary summaries of this
  disorder are deliberately NOT curated here because no quotable primary
  source was found for them: the gnomAD pLI value, the exact de-novo fraction
  of the founding cohort, and per-phenotype frequencies. The founding paper's
  abstract states the cohort composition and the qualifier "in all subjects"
  for the facial gestalt, and those are the only frequency-bearing statements
  used.
pathophysiology:
- name: Germline ZFX Truncating Variant
  biological_scale: MOLECULAR
  description: >
    Frameshift and nonsense variants distributed across ZFX, accounting for
    seven of the eleven variants in the founding cohort. These alleles are
    presumed to act by loss of function, reducing functional ZFX dosage. In a
    hemizygous male no functional allele remains; in a heterozygous female,
    because ZFX escapes X inactivation, the remaining wild-type allele is
    expressed in every cell but cannot be up-regulated to compensate, giving a
    genuine partial dosage reduction rather than cellular mosaicism.
  genetic_context:
    allele_type: LOSS_OF_FUNCTION_VARIANT
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters
    causal_link_type: DIRECT
    hypothesis_groups:
    - haploinsufficiency_model
    description: >
      Reduced functional ZFX protein lowers occupancy and transactivation at
      the CpG island promoters that ZFX normally licenses.
    evidence:
    - reference: PMID:29429977
      reference_title: ZFX acts as a transcriptional activator in multiple types of human tumors by binding downstream from transcription start sites at the majority of CpG island promoters.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Many genes with promoters bound by ZFX were down-regulated upon ZFX knockdown, supporting the hypothesis that ZFX acts as a transcriptional activator."
      explanation: >-
        Reducing ZFX specifically - by siRNA against ZFX alone - lowers
        expression of the promoters it binds, which is exactly the dosage-loss
        step this edge asserts.
    - reference: PMID:32406922
      reference_title: Characterization of the ZFX family of transcription factors that bind downstream of the start site of CpG island promoters.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "RNA-seq analysis revealed that thousands of genes showed altered expression in the double knockout clones, suggesting that these TFs are critical regulators of the transcriptome."
      explanation: >-
        Shows the scale of transcriptome dysregulation when these factors are
        lost. Marked PARTIAL because the clones are ZFX AND ZNF711 double
        knockouts, so the effect cannot be attributed to ZFX alone, and because
        a bi-allelic knockout is not the partial dosage reduction a patient
        sustains.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four missense variants were identified in 11 subjects, with seven truncation variants in the remaining individuals."
    explanation: >-
      Establishes the truncating allele class and its share of the founding
      cohort's variant spectrum.
- name: Germline ZFX Zinc-Finger Missense Variant
  biological_scale: MOLECULAR
  description: >
    Missense variants affecting the C2H2 zinc-finger DNA-binding region of
    ZFX, which in the founding cohort accounted for four variants but eleven
    of the eighteen subjects. This allele class is separated from the
    truncating class because its reported functional consequence is altered
    rather than simply absent transcriptional output, and because every
    founding-cohort family with hyperparathyroidism carried a missense allele.
    It is NOT curated as the only allele class that can produce
    hyperparathyroidism: a later series reports an in-frame insertion carrier
    with primary hyperparathyroidism, and the founding cohort never asserts
    absence of the endocrine phenotype in truncating carriers. The functionally critical fingers are the
    C-terminal ones: zinc fingers 11-13 are necessary and sufficient for DNA
    binding, and the somatic parathyroid-adenoma hotspot (R786/R787) lies in
    the same C-terminal zinc-finger region.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DYSREGULATED
  genetic_context:
    allele_type: MISSENSE_VARIANT
    variant_origin: GERMLINE
  downstream:
  - target: Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters
    description: >
      DNA-binding-domain missense alleles change the transcriptional output at
      ZFX target promoters relative to wild-type protein.
    evidence:
    - reference: PMID:38325380
      reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In molecular studies, DNA-binding domain variants elicited differential expression of a small set of target genes relative to wild-type ZFX in cultured cells, suggesting a gain or loss of transcriptional activity."
      explanation: >-
        Direct functional demonstration that DBD missense alleles alter target
        gene expression; the authors themselves leave the direction (gain vs
        loss) open.
  - target: Parathyroid Chief Cell Proliferation and Adenoma Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - altered_dna_binding_specificity_model
    description: >
      The endocrine arm. Every founding-cohort family with hyperparathyroidism
      carried a missense allele, mirroring the recurrent somatic missense
      hotspot selected in sporadic parathyroid adenomas. The steps between the
      variant and chief-cell proliferation are not established, hence an
      indirect edge with unknown intermediates.
    evidence:
    - reference: PMID:38325380
      reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Hyperparathyroidism was found in four families with missense variants, and enrichment of different tumor types was observed."
      explanation: >-
        Ties hyperparathyroidism to missense-carrying families. Marked PARTIAL
        for two reasons: it reports a clinical endocrine association, not
        chief-cell proliferation or adenoma, which is what this edge's target
        node asserts; and it states where hyperparathyroidism was found, not
        that it is absent in truncating carriers.
  evidence:
  - reference: PMID:32406922
    reference_title: Characterization of the ZFX family of transcription factors that bind downstream of the start site of CpG island promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that zinc fingers 11-13 are necessary and sufficient for DNA binding and, in combination with the N terminal region, constitute a functional transactivator."
    explanation: >-
      Maps DNA-binding function to the C-terminal zinc fingers, which is the
      region in which the disease-associated missense alleles and the somatic
      parathyroid hotspot both fall.
- name: Escape of ZFX from X Inactivation
  biological_scale: MOLECULAR
  description: >
    ZFX is one of the few human X-linked genes that escape X inactivation, so
    it is transcribed from both the active and the inactive X in females. This
    is a constitutive property of the locus rather than a disease event, and
    it is modelled here because it is what determines the dosage consequence
    of a heterozygous allele: a female carrier has a uniform partial reduction
    in ZFX activity in every cell rather than a mosaic of wild-type and mutant
    cells, which is why females are genuinely affected rather than silent
    carriers.
  downstream:
  - target: Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters
    description: >
      MODULATING, not causing. Note the schema's `causal_link_type` encodes
      only directness, so it is deliberately left unset here rather than
      asserting a directness that would misdescribe this edge.
      Escape from X inactivation is a constitutive
      normal property of the locus and produces no disease on its own; what it
      does is set how a heterozygous allele translates into dosage. Because the
      second allele cannot be recruited by skewed inactivation, heterozygosity
      in a female produces a uniform partial reduction in ZFX activity rather
      than a mosaic.
    evidence:
    - reference: PMID:41074764
      reference_title: De Novo Heterozygous ZFX Frameshift Variant in a Female With an X-Linked Neurodevelopmental Disorder.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Female carriers of pathogenic ZFX variants demonstrate highly variable expressivity, ranging from apparently unaffected individuals to syndromic presentations."
      explanation: >-
        Documents that heterozygous females are genuinely affected, consistent
        with an escape-gene dosage model. Marked PARTIAL because the paper
        reports the clinical observation, not a measurement of allelic
        expression in the affected tissue.
  evidence:
  - reference: PMID:2500252
    reference_title: ZFX has a gene structure similar to ZFY, the putative human sex determinant, and escapes X inactivation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcription analysis of human-rodent hybrid cell lines containing \"inactive\" human X chromosomes suggests that ZFX escapes X inactivation."
    explanation: The original demonstration that human ZFX escapes X inactivation.
  - reference: PMID:1970799
    reference_title: Chromosomal localization of ZFX--a human gene that escapes X inactivation--and its murine homologs.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZFX is one of a few genes on the human X chromosome that are known to escape X inactivation."
    explanation: >-
      Independent confirmation of escape status and of the Xp21.3/Xp22.1
      localisation. Classified OTHER because the supporting work is linkage
      and physical mapping rather than a clinical, animal, cell-based, or in
      silico study.
  - reference: PMID:39940742
    reference_title: Expression Patterns of Escape Genes in Turner Syndrome Fibroblasts and Induced Pluripotent Stem Cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Forty-five escape genes were differentially expressed between the WT and TS cell lines. Among these, five genes (ATP7A, PHKA1, EBP, ZFX, and SMC1A) were suggested to be implicated in the TS phenotype."
    explanation: >-
      Contemporary confirmation that ZFX is treated as an X-inactivation escape
      gene. Marked PARTIAL because the paper says these genes were "suggested
      to be implicated" in the Turner phenotype - a hypothesis about a
      different disorder - so it corroborates escape status but not any claim
      about ZFX dosage consequences here.
- name: Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters
  biological_scale: MOLECULAR
  description: >
    The convergent molecular node. ZFX binds a short motif roughly 200-250 bp
    downstream of the transcription start site at the majority of active CpG
    island promoters - an unusual, architecturally defined binding position
    inside the transcribed region rather than upstream - and acts there as an
    activator. Genes whose promoters ZFX occupies are expressed at higher
    levels, and knockdown reduces their expression. Both the truncating and
    the missense allele classes converge on degraded or mis-specified output
    from this promoter-proximal activator function.
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    modifier: DECREASED
  molecular_functions:
  - preferred_term: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    modifier: DECREASED
  downstream:
  - target: Increased RNA Polymerase II Promoter-Proximal Pausing
    description: >
      Because ZFX binds within the transcribed region just downstream of the
      TSS, reduced ZFX acts on elongation: polymerase accumulates in the
      paused state at ZFX-regulated promoters instead of proceeding into
      productive elongation.
    evidence:
    - reference: PMID:38726870
      reference_title: Reduction of ZFX levels decreases histone H4 acetylation and increases Pol2 pausing at target promoters.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We used GRO-seq to show that loss or reduction of ZFX increased Pol2 pausing at ZFX-regulated promoters."
      explanation: >-
        Nascent-transcription measurement establishing the elongation defect
        as the proximate consequence of reduced ZFX.
  - target: Disrupted Craniofacial Patterning and Congenital Anomaly Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - haploinsufficiency_model
    description: >
      The facial gestalt and the congenital-anomaly burden follow from the same
      transcriptional defect as the neurodevelopmental arm. Indirect with
      unknown intermediates, and deliberately parented here rather than on the
      self-renewal node: no study has examined cranial neural crest,
      pharyngeal-arch patterning, or any other craniofacial developmental
      programme in ZFX deficiency, so no intermediate can be named and a
      progenitor route cannot be asserted.
    evidence:
    - reference: PMID:38325380
      reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Our clinical and experimental data support that variants in ZFX are associated with an X-linked intellectual disability syndrome characterized by a recurrent facial gestalt, neurocognitive and behavioral abnormalities, and an increased risk for congenital anomalies and hyperparathyroidism."
      explanation: >-
        Establishes the genotype-to-gestalt association, which is part of the
        disease definition rather than an inference. Marked PARTIAL because it
        evidences THAT ZFX variants produce the gestalt, not the developmental
        route from the transcriptional defect to it.
  - target: Impaired Stem and Progenitor Cell Self-Renewal
    description: >
      Among the programmes ZFX activates is a self-renewal transcriptional
      module shared by embryonic and adult stem cells, so degraded ZFX output
      manifests cellularly as a self-renewal defect.
    evidence:
    - reference: PMID:17448993
      reference_title: Zfx controls the self-renewal of embryonic and hematopoietic stem cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Zfx directly activated common target genes in ESC and HSC, as well as ESC-specific target genes including ESC self-renewal regulators Tbx3 and Tcl1."
      explanation: >-
        Links ZFX's direct transcriptional activation to the self-renewal
        programme, connecting the molecular node to the cellular one.
  evidence:
  - reference: PMID:29429977
    reference_title: ZFX acts as a transcriptional activator in multiple types of human tumors by binding downstream from transcription start sites at the majority of CpG island promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Many genes with promoters bound by ZFX were down-regulated upon ZFX knockdown, supporting the hypothesis that ZFX acts as a transcriptional activator."
    explanation: >-
      Establishes ZFX as an activator whose loss reduces target gene
      expression, which is the premise of this node.
  - reference: PMID:29429977
    reference_title: ZFX acts as a transcriptional activator in multiple types of human tumors by binding downstream from transcription start sites at the majority of CpG island promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified roughly 9000 ZFX binding sites and found that most of the sites are in CpG island promoters."
    explanation: >-
      Genome-wide localisation of ZFX to CpG island promoters, which defines
      the regulatory territory affected.
  - reference: PMID:38726870
    reference_title: Reduction of ZFX levels decreases histone H4 acetylation and increases Pol2 pausing at target promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The ZFX transcriptional activator binds to CpG island promoters, with a major peak at ∼200-250 bp downstream from transcription start sites."
    explanation: >-
      Specifies the unusual promoter-downstream binding position that makes
      the elongation mechanism plausible.
- name: Increased RNA Polymerase II Promoter-Proximal Pausing
  biological_scale: MOLECULAR
  description: >
    Reduced ZFX at target promoters increases Pol II pausing and decreases
    histone H4 acetylation, the two coupled readouts of the proposed
    mechanism: ZFX recruits H4 acetylation activity and thereby releases
    polymerase into productive elongation. This is the best-resolved step in
    the ZFX mechanism and is derived entirely from cell-line work, not from
    patient tissue.
  biological_processes:
  - preferred_term: transcription elongation by RNA polymerase II
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
    modifier: DECREASED
  downstream:
  - target: Impaired Stem and Progenitor Cell Self-Renewal
    description: >
      Failure to release paused polymerase at ZFX-dependent promoters lowers
      output of the self-renewal programme those promoters drive.
    evidence:
    - reference: PMID:38726870
      reference_title: Reduction of ZFX levels decreases histone H4 acetylation and increases Pol2 pausing at target promoters.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Our studies support a model in which ZFX enhances elongation at target promoters by recruiting H4 acetylation complexes and reducing pausing."
      explanation: >-
        States the elongation model, including the H4-acetylation recruitment
        step. Marked PARTIAL because the paper establishes the elongation
        defect but does not itself measure a self-renewal outcome; that link
        comes from the stem-cell literature.
  evidence:
  - reference: PMID:38726870
    reference_title: Reduction of ZFX levels decreases histone H4 acetylation and increases Pol2 pausing at target promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We used GRO-seq to show that loss or reduction of ZFX increased Pol2 pausing at ZFX-regulated promoters."
    explanation: >-
      The measured result - nascent-transcription profiling showing increased
      pausing on ZFX reduction - which is the state this node asserts.
  - reference: PMID:38726870
    reference_title: Reduction of ZFX levels decreases histone H4 acetylation and increases Pol2 pausing at target promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our studies support a model in which ZFX enhances elongation at target promoters by recruiting H4 acetylation complexes and reducing pausing."
    explanation: >-
      Sources the coupled H4-acetylation arm of this node, and the authors'
      mechanistic interpretation of the pausing result.
- name: Impaired Stem and Progenitor Cell Self-Renewal
  biological_scale: CELLULAR
  description: >
    In model systems, loss of ZFX selectively impairs self-renewal while
    leaving differentiation capacity intact, with increased apoptosis and
    stem-cell-specific up-regulation of stress-inducible genes. The
    requirement is conserved to human embryonic stem cells, where ZFX behaves
    as a rheostat setting the balance between self-renewal and
    differentiation. Extension of this to neural progenitors in the developing
    human brain is INFERENCE, not observation - no patient-tissue or
    neural-progenitor data exist for MRXS37, which is recorded as a knowledge
    gap below. The cell types annotated on this node are therefore
    deliberately the ones actually assayed, embryonic and haematopoietic stem
    cells, and NOT neural stem cells, so that the pathograph and anything
    exported from it do not assert a neural-progenitor claim this entry's own
    prose declines to make.
  cell_types:
  - preferred_term: embryonic stem cell
    term:
      id: CL:0002322
      label: embryonic stem cell
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: stem cell population maintenance
    term:
      id: GO:0019827
      label: stem cell population maintenance
    modifier: DECREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  downstream:
  - target: Disrupted Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - haploinsufficiency_model
    description: >
      A progenitor-maintenance deficit during development is the proposed
      route from the transcriptional defect to the neurodevelopmental
      phenotype. Indirect with unknown intermediates: no neural-progenitor data
      exist, which is recorded in the zfx_neural_progenitor_gap discussion.
    evidence:
    - reference: PMID:38325380
      reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, a zebrafish model of ZFX loss displayed an altered behavioral phenotype, providing additional evidence for the functional significance of ZFX."
      explanation: >-
        The only in vivo evidence tying ZFX loss to a neurobehavioural
        outcome. Marked PARTIAL because the zebrafish assay reports behaviour,
        not progenitor dynamics or craniofacial patterning, so the specific
        progenitor route remains inferred.

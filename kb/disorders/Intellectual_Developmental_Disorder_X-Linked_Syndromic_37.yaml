- name: Disrupted Craniofacial Patterning and Congenital Anomaly Formation
  biological_scale: ORGANISM
  description: >
    The extra-neural developmental consequence: a recurrent and clinically
    recognisable facial gestalt present in every reported subject of the
    founding cohort - thickened and medially broadened eyebrows, altered
    facial shape, external eye anomalies, a smooth and/or long philtrum and
    ear anomalies - together with a variable burden of congenital anomalies.
    This node deliberately carries no mechanistic annotation beyond the
    clinical observation: no study has examined cranial neural crest,
    pharyngeal-arch patterning, or any other craniofacial developmental
    programme in ZFX deficiency, so the route from the transcriptional defect
    to the gestalt is entirely unexamined. That unexamined route is recorded
    as the `zfx_craniofacial_route_gap` discussion; it is a reason to draw the
    incoming edge as INDIRECT_UNKNOWN_INTERMEDIATES, not a reason to omit it -
    that ZFX variants produce this gestalt is the disease definition, and only
    the mechanism is unknown.

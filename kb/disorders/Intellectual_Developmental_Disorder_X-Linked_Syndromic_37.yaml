      reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory evaluation showed an elevated parathyroid hormone (PTH) level, hypercalcemia, and hypophosphatemia, all consistent with PHPT."
      explanation: Documents hypophosphataemia co-occurring with the PTH elevation in a ZFX carrier.
  - target: Osteoporosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Long-standing parathyroid hormone excess drives bone resorption, giving
      the reduced bone density seen after years of untreated disease.
    evidence:
    - reference: PMID:39056049
      reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A 51-year-old woman with a history of primary hyperparathyroidism (PHPT) with prior parathyroidectomy, osteoporosis, and learning disability was referred for hypercalcemia discovered after a fall."
      explanation: >-
        Documents osteoporosis co-occurring with long-standing primary
        hyperparathyroidism in a ZFX carrier. Marked PARTIAL because the case
        report establishes co-occurrence, not that the ZFX-associated PTH
        excess caused this individual's bone loss.
  evidence:
  - reference: PMID:25594030
    reference_title: Recurrent ZFX mutations in human sporadic parathyroid adenomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ZFX mutations we identified were strikingly specific, focused in each tumor on one encoded residue in a hotspot of two consecutive highly conserved arginine residues (R786/787; arginine to glutamine, threonine or leucine) in a zinc finger domain near the C-terminus of the protein."
    explanation: >-
      Defines the somatic hotspot in the same C-terminal zinc-finger region
      that harbours the germline missense alleles.
  - reference: PMID:25594030
    reference_title: Recurrent ZFX mutations in human sporadic parathyroid adenomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the absence of loss of heterozygosity, and the absence of these mutations among over 4000 ZFX alleles in the dbSNP137 database, strongly suggest a novel role for ZFX as a human proto-oncogene."
    explanation: >-
      Establishes the proto-oncogene (not tumour-suppressor) framing, which is
      why this arm is modelled as gained proliferative activity rather than as
      loss of a brake.
  - reference: PMID:39056049
    reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing showed a likely pathogenic de novo heterozygous germline missense variant p.R764W in the ZFX gene that encodes a zinc-finger transcription factor previously shown to harbor somatic missense variants in a subset of sporadic parathyroid tumors."
    explanation: >-
      A germline zinc-finger missense allele in a patient with surgically
      confirmed primary hyperparathyroidism.
  - reference: PMID:40779536
    reference_title: Association of germline variants in the ZFX gene with primary hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present the clinical and molecular characterization of three patients diagnosed with primary hyperparathyroidism (PHPT) who have germline variants in the ZFX gene."
    explanation: >-
      Independent case series confirming germline ZFX variants in primary
      hyperparathyroidism.
mechanistic_hypotheses:
- hypothesis_group_id: haploinsufficiency_model
  hypothesis_label: Haploinsufficiency / loss of ZFX transcriptional dosage
  status: CANONICAL
  description: >
    Truncating alleles, and by extension the neurodevelopmental phenotype
    generally, act by reducing the amount of functional ZFX available to
    activate its CpG island promoter targets, with the elongation defect and
    the self-renewal defect as the proximate consequences. This is the
    default model and the one consistent with the cell-line knockdown and
    knockout data.
  evidence:
  - reference: PMID:29429977
    reference_title: ZFX acts as a transcriptional activator in multiple types of human tumors by binding downstream from transcription start sites at the majority of CpG island promoters.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Many genes with promoters bound by ZFX were down-regulated upon ZFX knockdown, supporting the hypothesis that ZFX acts as a transcriptional activator."
    explanation: >-
      The measured result behind the dosage-loss model: reducing ZFX
      down-regulates the promoters it binds, which is what a haploinsufficiency
      model predicts.
- hypothesis_group_id: altered_dna_binding_specificity_model
  hypothesis_label: Altered DNA-binding specificity / gained activity of zinc-finger missense alleles
  status: EMERGING
  description: >
    Zinc-finger missense alleles are not simple nulls but change which targets
    are activated and by how much, and this altered activity - rather than
    reduced dosage - is what predisposes to parathyroid chief cell
    proliferation. The supporting arguments are that the founding cohort's
    functional assay showed differential rather than abolished target
    expression, that hyperparathyroidism has been reported only with missense
    alleles, and that the somatic parathyroid hotspot is a recurrent missense
    change without loss of heterozygosity. The direction of effect is
    explicitly unresolved: the founding paper says "a gain or loss of
    transcriptional activity" and does not choose.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "DNA-binding domain variants elicited differential expression of a small set of target genes relative to wild-type ZFX in cultured cells, suggesting a gain or loss of transcriptional activity."
    explanation: >-
      The functional observation this hypothesis rests on. PARTIAL because the
      same sentence declines to resolve the direction, and only a small set of
      targets was affected.

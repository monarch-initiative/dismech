genetic:
- name: ZFX
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ZFX
    term:
      id: hgnc:12869
      label: ZFX
  notes: >
    ZFX (Xp22.11; zinc finger protein X-linked) encodes a Krueppel-type C2H2
    zinc-finger transcription factor with an N-terminal acidic transactivation
    region and a C-terminal DNA-binding domain of 13 tandem C2H2 zinc fingers.
    ZFX has two close relatives: the Y-linked paralogue ZFY, which is 99%
    identical across the zinc-finger domain, and ZNF711.

    Allelic spectrum: the founding cohort reported 11 distinct variants in 18
    subjects from 16 families - four missense (accounting for 11 subjects) and
    seven truncating. The two classes are curated as separate pathophysiology
    nodes because they differ in reported consequence and in phenotype: the
    missense alleles affect the zinc-finger DNA-binding region and are the
    ones reported with hyperparathyroidism, whereas the truncating alleles are
    presumed simple loss of function. Zinc fingers 11-13 are necessary and
    sufficient for DNA binding, which is the region in which both the germline
    missense alleles and the recurrent somatic parathyroid-adenoma hotspot
    (R786/R787) fall.

    Recurrence across individuals is documented: p.(Met666Valfs*2) was found
    in a female by genome sequencing having previously been reported in an
    affected male, which is independent support for causality of that allele.

    Somatic/germline duality: ZFX is unusual among neurodevelopmental genes in
    that the same gene carries recurrent SOMATIC missense mutations selected in
    sporadic parathyroid adenomas. Those somatic events are a separate
    phenomenon from the germline disorder and are cited here only because they
    converge on the same protein region.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present clinical and molecular characterization of 18 individuals with germline ZFX variants."
    explanation: The gene-discovery cohort establishing the ZFX-MRXS37 relationship.
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome or genome sequencing revealed 11 variants in 18 subjects (14 males and 4 females) from 16 unrelated families."
    explanation: Sources the variant count, cohort composition, and family count.
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZFX on Xp22.11 encodes a transcription factor that has been linked to diverse processes including oncogenesis and development, but germline variants have not been characterized in association with disease."
    explanation: Sources the locus and the novelty of the germline gene-disease relationship.
  - reference: PMID:41074764
    reference_title: De Novo Heterozygous ZFX Frameshift Variant in a Female With an X-Linked Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a 20-year-old female with a heterozygous ZFX frameshift variant, p.(Met666Valfs*2), identified by genome sequencing, previously reported in an affected male."
    explanation: Documents recurrence of a specific allele across two unrelated individuals.
  - reference: PMID:41077274
    reference_title: Expansion of the phenotype in ZFX neurodevelopmental disorder in a family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present a male patient and his mother with a new likely pathogenic variant in the ZFX gene (NM_003410.4(ZFX): c.2363C > G, p. Pro788Arg)"
    explanation: >-
      Adds a further zinc-finger-region missense allele and gives the reference
      transcript NM_003410.4.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    The neutral HPO X-linked term is used deliberately, and neither X-linked
    dominant nor X-linked recessive is asserted.

    The reason is that ZFX escapes X inactivation. Both X alleles are normally
    expressed in females, so a heterozygous female is not a mosaic of
    wild-type and mutant cells whose phenotype depends on skewing - she has a
    uniform partial reduction in ZFX activity. Consequently females are
    genuinely affected rather than obligate silent carriers, which is what the
    reported female cases show, including a de novo frameshift in a
    syndromically affected 20-year-old woman.

    Expressivity in females is nevertheless wide, from apparently unaffected
    transmitting mothers through to multi-organ syndromic presentations, and
    males are in general more severely affected than females. The founding
    cohort included both de novo and inherited variants. Because the number of
    reported individuals is still small and no penetrance study exists, no
    numeric penetrance estimate is curated here.

    Counselling implication drawn by the reporting authors: endocrine testing
    should be offered even to clinically unaffected females carrying missense
    variants, because the hyperparathyroidism risk tracks the allele rather
    than the neurodevelopmental phenotype.
  evidence:
  - reference: PMID:2500252
    reference_title: ZFX has a gene structure similar to ZFY, the putative human sex determinant, and escapes X inactivation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcription analysis of human-rodent hybrid cell lines containing \"inactive\" human X chromosomes suggests that ZFX escapes X inactivation."
    explanation: >-
      The escape-from-X-inactivation premise that rules out a standard
      manifesting-carrier framing for heterozygous females.
  - reference: PMID:41074764
    reference_title: De Novo Heterozygous ZFX Frameshift Variant in a Female With an X-Linked Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Female carriers of pathogenic ZFX variants demonstrate highly variable expressivity, ranging from apparently unaffected individuals to syndromic presentations."
    explanation: Sources the variable-expressivity and incomplete-penetrance annotation in females.
  - reference: PMID:41074764
    reference_title: De Novo Heterozygous ZFX Frameshift Variant in a Female With an X-Linked Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical care should include cardiac and endocrine monitoring, with endocrine testing offered to unaffected females carrying missense variants."
    explanation: Sources the counselling recommendation stated in the description.
  - reference: PMID:41077274
    reference_title: Expansion of the phenotype in ZFX neurodevelopmental disorder in a family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mother presents with fatigue, low iron status and a slight elevation of PTH with normocalcemia."
    explanation: >-
      A transmitting mother with only subtle findings, illustrating the mild
      end of female expressivity.
diagnosis:
- name: Exome or genome sequencing
  description: >
    Molecular diagnosis rests on exome or genome sequencing; every reported
    case to date was ascertained this way. Because ZFX was implicated in
    disease only in 2024, older targeted X-linked intellectual disability
    panels may not include it, so a negative panel does not exclude the
    diagnosis.
  evidence:
  - reference: PMID:38325380
    reference_title: Variants in ZFX are associated with an X-linked neurodevelopmental disorder with recurrent facial gestalt.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

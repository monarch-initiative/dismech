      reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory evaluation showed an elevated parathyroid hormone (PTH) level, hypercalcemia, and hypophosphatemia, all consistent with PHPT."
      explanation: Documents hypercalcaemia co-occurring with the PTH elevation in a ZFX carrier.

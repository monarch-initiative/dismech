      reference_title: Expansion of the phenotype in ZFX neurodevelopmental disorder in a family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An elevated PTH was noted, with normocalcemia, a possible early sign of hyperparathyroidism."
      explanation: The earliest biochemical signal reported, preceding hypercalcaemia.
  - target: Hypercalcemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Excess parathyroid hormone raises serum calcium through its established
      actions on bone, kidney and intestinal calcium handling.
    evidence:

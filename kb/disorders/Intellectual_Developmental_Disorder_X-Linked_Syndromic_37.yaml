- name: Parathyroid Chief Cell Proliferation and Adenoma Formation
  biological_scale: TISSUE
  description: >
    The endocrine arm, reached from the zinc-finger missense allele class
    rather than from the truncating class. Germline missense carriers develop
    primary hyperparathyroidism, in some cases with a resectable parathyroid
    lesion and normalisation of PTH and calcium after parathyroidectomy. The
    supporting rationale is that recurrent SOMATIC ZFX missense mutations at a
    two-arginine hotspot (R786/R787) in a C-terminal zinc finger are
    positively selected in sporadic parathyroid adenomas, without loss of
    heterozygosity - the signature of a proto-oncogene rather than a tumour
    suppressor. Note this is convergence of two allele sets on one protein
    region, not a demonstration that the germline alleles act by the same
    biochemical route.
  cell_types:
  - preferred_term: chief cell of parathyroid gland
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Hyperparathyroidism
    causal_link_type: DIRECT
    description: >
      Autonomous proliferation of parathyroid chief cells is what produces
      inappropriate parathyroid hormone secretion.
    evidence:
    - reference: PMID:39056049
      reference_title: A Germline ZFX Missense Variant in a Patient With Primary Hyperparathyroidism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Laboratory evaluation showed an elevated parathyroid hormone (PTH) level, hypercalcemia, and hypophosphatemia, all consistent with PHPT."
      explanation: Documents the elevated PTH that this edge asserts follows from the lesion.
  - target: Elevated circulating parathyroid hormone level
    causal_link_type: DIRECT
    description: >
      The biochemical expression of the lesion, and the earliest signal
      reported - an isolated PTH elevation with normal calcium.
    evidence:

      explanation: The authors' own framing of the strain as a model of the human defect.
  - target: Central Nervous System Hypomyelination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ultrastructural hypomyelination of the corpus callosum with a matching

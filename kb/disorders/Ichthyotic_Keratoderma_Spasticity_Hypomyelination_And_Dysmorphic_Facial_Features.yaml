animal_models:
- name: Elovl1-null mouse
  species: Mouse
  genotype: Elovl1 knockout
  publication: PMID:23689133
  description: >-
    A complete null, and it dies within hours of birth from barrier failure. It
    is the definitive model of the epidermal arm and, by the same token, cannot
    model the disease: human patients survive with a hypomorphic or heterozygous
    lesion and live long enough to develop the neurological phenotype the null
    never reaches.
  modeled_mechanisms:
  - target: Reduced Ultra-Long-Chain Ceramides in the Stratum Corneum
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the epidermal chain-length shift and the loss of lamellar
      architecture that follows it.
    limitations: >-
      A complete null against a human heterozygous missense allele, so it speaks
      to the direction of the lipid change rather than to its magnitude in
      patients.
    readouts:
    - name: Epidermal ceramide chain-length distribution
      target: Reduced Ultra-Long-Chain Ceramides in the Stratum Corneum
      direction: DECREASED
      interpretation: >-
        Species of C26 and above fall while those of C24 and below rise, which
        is the signature of a chain-length ceiling rather than a shortage.
      evidence:
      - reference: PMID:23689133
        reference_title: "Impaired epidermal permeability barrier in mice lacking elovl1, the gene responsible for very-long-chain fatty acid production."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the epidermis of the Elovl1-null mice, the levels of Cers with >=C26
          FAs were decreased, while those of Cers with <=C24 FAs were increased.
        explanation: The paired measurement behind this readout.
    evidence:
    - reference: PMID:23689133
      reference_title: "Impaired epidermal permeability barrier in mice lacking elovl1, the gene responsible for very-long-chain fatty acid production."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Elovl1 is a key determinant of epidermal Cer chain length and is
        essential for permeability barrier formation.
      explanation: Supports treating this model as informative for the epidermal node.
  - target: Central Nervous System Hypomyelination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Neonatal death from the skin phenotype forecloses the neurological one.
      The model cannot report on central myelination because the animals do not
      survive myelination.
    limitations: >-
      Elovl1 knockout mice died shortly after birth from epidermal barrier
      defects, before central myelination occurs, so no statement about
      hypomyelination can be obtained from this strain. The separate Elovl1
      mutant strain below exists precisely because of this.
    evidence:
    - reference: PMID:23689133
      reference_title: "Impaired epidermal permeability barrier in mice lacking elovl1, the gene responsible for very-long-chain fatty acid production."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Elovl1 knockout mice died shortly after birth due to epidermal barrier
        defects.
      explanation: >-
        Establishes the neonatal lethality that makes the neurological arm
        unobservable in this model.

- name: Elovl1 mutant mouse
  species: Mouse
  genotype: Elovl1 mutant (hypomorphic, survives to adulthood)
  publication: PMID:32123819
  description: >-
    The strain that reaches the neurological phenotype. Survival past the
    neonatal period is what makes it informative where the null is not, and it
    reproduces the myelin lipid change, the ultrastructural hypomyelination and
    a motor deficit.
  modeled_mechanisms:
  - target: Shortened Sphingolipid Acyl Chains in Central Myelin
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the chain-length shift across galactosylceramides, sulfatides,
      sphingomyelins and ceramides in brain.
    limitations: >-
      Survival is still reduced and some animals die of startle epilepsy, a
      feature not reported in patients, so the strain is more severe than the
      human monoallelic disease on the seizure axis.
    readouts:
    - name: Brain sphingolipid acyl chain length
      target: Shortened Sphingolipid Acyl Chains in Central Myelin
      direction: DECREASED
      interpretation: >-
        Markedly shortened across four sphingolipid classes, with
        galactosylceramide levels reduced outright.
      evidence:

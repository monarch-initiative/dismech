differential_diagnoses:
- name: Sjogren-Larsson syndrome
  description: >-
    The differential that is actually reached at the bedside, and it was
    suspected first in a reported patient. It shares the defining triad -
    congenital ichthyosis, spastic paraparesis and white matter abnormality -
    and is separated by MR spectroscopy, which is abnormal in Sjogren-Larsson
    and was normal here.
  evidence:
  - reference: PMID:42101073
    reference_title: "Complicated Spastic Paraparesis: Study of a Patient With a De Novo Pathogenic Variant in ELOVL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sjögren–Larsson syndrome was initially suspected; however, MR spectroscopy performed at that time was normal
    explanation: >-
      Records both the diagnostic confusion and the test that resolved it, in a
      real patient rather than as a textbook contrast. The quote is trimmed to a
      span free of the non-breaking spaces the source uses elsewhere in the
      sentence, which is why it stops at "normal".


discussions:
- discussion_id: one_lesion_two_inheritance_modes
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#ELOVL1
  prompt: >-
    Why does a single recurrent heterozygous ELOVL1 missense variant produce
    disease at all, when biallelic loss is needed in other patients?
  rationale: >-
    Every monoallelic patient reported carries the same substitution,
    p.Ser165Phe, arising de novo each time rather than from a founder allele.
    That pattern - one recurrent allele, never inherited, causing disease in the
    heterozygous state - is what a dominant-negative or gain-of-toxic-function
    mechanism looks like, and it sits awkwardly beside a separate cohort in whom
    two loss-of-function alleles are required. The measured effect of
    p.Ser165Phe is abolition of enzymatic activity, which on its own would
    predict recessive inheritance. What is not established is whether the mutant
    subunit interferes with wild-type ELOVL1 or with the other ELOVL enzymes it
    is known to dysregulate.
  proposed_experiments:
  - experiment_id: s165f_dominant_negative_test
    name: Co-expression of p.Ser165Phe with wild-type ELOVL1
    description: >-
      Express p.Ser165Phe alongside wild-type ELOVL1 at physiological ratio and
      measure C24 to C26 elongation against wild type alone and against a
      null allele. A dominant-negative allele suppresses activity below the
      50 per cent expected from haploinsufficiency.
    would_support:
    - pathophysiology#ELOVL1 Elongase Activity Loss
    supporting_outcome:
    - >-
      Elongation activity in the co-expression condition falls significantly
      below half of wild type.
    refuting_outcome:
    - >-
      Activity in the co-expression condition is indistinguishable from half of
      wild type, consistent with simple haploinsufficiency.

- discussion_id: monoallelic_versus_biallelic_scope
  kind: KNOWLEDGE_GAP
  attaches_to:
  - has_subtypes#Biallelic ELOVL1 disorder
  prompt: >-
    Are the monoallelic and biallelic ELOVL1 phenotypes one disease or two?
  rationale: >-
    They share the mechanism and most of the phenotype, and differ in
    inheritance mode, in the prominence of the movement disorder, and in whether
    cognition is spared. MONDO currently carries a single ELOVL1 disease
    concept, whose name comes from the monoallelic report, so the biallelic
    cohort has no separate term to be curated against. They are kept together
    here for that reason rather than because the case for lumping is settled;
    if MONDO adds a term for the recessive entity, the subtype split in this
    entry is where the separation should be made.

notes: >-
  Scope, and why it differs from the sibling decision in this batch. Both
  inheritance arms are curated in one entry because MONDO holds exactly one
  ELOVL1 disease concept, checked against the ontology rather than assumed. The
  contrast is RBP4, curated in the same batch, where the dominant and recessive
  arms each had somewhere to live and were therefore kept apart. Here, scoping
  to the monoallelic arm alone - which the disease name would justify, since
  "IKSHD" is that report's own acronym - would leave seven published patients
  with no entry at all. The split is recorded as has_subtypes so it can be
  separated cleanly if a term appears.

  One enzyme, two organs, and that is the whole mechanism. ELOVL1 sets the
  chain-length ceiling for C22 to C26 fatty acids. Two tissues specifically
  require the longest species: the ceramide lamellae of the stratum corneum and
  the sphingolipids of central myelin. This is why an ichthyosis gene is also a
  leukodystrophy gene, and the patient fibroblast transcriptome shows both arms
  at once as reciprocal programmes - keratinisation up, myelination down.

  Model discipline. The Elovl1 null and the Elovl1 mutant mouse are curated as
  two separate models with opposite verdicts on the same node, which is the
  honest reading rather than a redundancy. The null dies within hours of birth
  from barrier failure, so it is definitive for the epidermal arm and
  FAILS_TO_RECAPITULATE the neurological one - not because myelination is
  normal, but because the animals do not live long enough to myelinate. The
  hypomorphic mutant survives and carries the myelin phenotype. Reporting the
  null as simply "a model of ELOVL1 deficiency" would hide the fact that the
  most complete genetic model of this gene cannot speak to half the disease.

  Deliberately not curated. No prevalence record: the published literature is
  three monoallelic patients and one seven-patient recessive cohort, and no
  population rate exists. No treatments section: the only therapeutic material
  in the literature is a fibroblast loading experiment showing that C22:0
  supplementation raises C24:0 ceramides, plus an authors' suggestion that
  PPAR-modulating drugs might be applicable. Neither has been given to a
  patient, so curating either as a treatment would assert a clinical
  intervention that does not exist; the loading result is left for a future
  curator to model as an experiment if the schema use is agreed. No acanthosis
  nigricans phenotype: it appears in the title of PMID:30487246 and nowhere in
  the retrieved abstract, and a title is not a finding. Papers on congenital
  ichthyosis treatment trials and on X-linked adrenoleukodystrophy lipidomics
  were returned by the research run, read, and set aside: they concern other
  diseases, and their caches are not shipped.

  Report handling. The deep-research report's one machine-checked quote failed
  verification, and inspection showed it was a paraphrase - the report had
  compressed and reordered a real sentence from PMID:40590574 rather than
  inventing one. The full original sentence is better and is what this entry
  quotes. Six further terms were flagged as mislabelled, all because the report
  wrote category headings such as "Neurological sign" where the term's own name
  belonged; the identifiers themselves were correct. Separately, the fetch of
  PMID:40590574 failed once with an HTTP 400 from the PMC provider and succeeded
  on retry, which is worth distinguishing from a bad identifier.

name: Ichthyotic_Keratoderma_Spasticity_Hypomyelination_And_Dysmorphic_Facial_Features
category: Disease
creation_date: "2026-09-01T23:05:00Z"
description: >-
  A neuro-ichthyotic disorder caused by pathogenic variants in ELOVL1, the
  elongase that catalyses the first and rate-limiting step in making saturated
  and monounsaturated very-long-chain fatty acids of C22 to C26. One enzymatic
  lesion produces two apparently unrelated organ phenotypes, because the same
  ultra-long acyl chains are structural requirements in two places: the
  ceramide lamellae of the stratum corneum, and the sphingolipids of central
  myelin. Losing them gives ichthyotic keratoderma and a hypomyelinating
  leukodystrophy in the same patient.

  Reported in two inheritance modes. Heterozygous de novo variants - the
  recurrent p.Ser165Phe in every published case so far - give the phenotype the
  disease is named for: ichthyosis, progressive spastic paraparesis, nystagmus
  and cerebral hypomyelination. Biallelic variants give an overlapping but more
  severe picture with a prominent complex movement disorder. Both arms are
  curated here because MONDO carries a single ELOVL1 disease concept.
disease_term:
  preferred_term: ichthyotic keratoderma, spasticity, hypomyelination, and dysmorphic facial features
  term:
    id: MONDO:0032798
    label: ichthyotic keratoderma, spasticity, hypomyelination, and dysmorphic facial features

has_subtypes:
- name: Monoallelic IKSHD
  display_name: Monoallelic (de novo dominant) IKSHD
  description: >-
    The phenotype the disease name records, and the one described first. Every
    published case carries the same heterozygous de novo missense variant,
    p.Ser165Phe, arising independently rather than from a founder allele.
    Ichthyosis is congenital; spastic paraparesis and nystagmus follow, with
    cerebral hypomyelination on MRI. Cognition may be entirely normal.
  evidence:
  - reference: PMID:30487246
    reference_title: "De novo mutation in ELOVL1 causes ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients carried an identical heterozygous de novo ELOVL1 mutation
      (c.494C>T, NM_001256399; p.S165F) not deriving from a founder allele.
    explanation: >-
      Establishes the recurrent de novo allele and rules out a shared founder,
      which is what makes the recurrence mechanistically interesting.
- name: Biallelic ELOVL1 disorder
  display_name: Biallelic (autosomal recessive) ELOVL1 disorder
  description: >-
    Seven patients with autosomal recessive ELOVL1 variants, reported as a
    single cohort. The overlap with the monoallelic form is substantial -
    ichthyosis, spasticity, hypomyelination - but the movement disorder is
    prominent and near-universal, and developmental delay is present in all,
    where the monoallelic form can spare cognition entirely.
  evidence:
  - reference: PMID:40590574
    reference_title: "Biallelic ELOVL1 Variants Are Linked to Hypomyelinating Leukodystrophy, Movement Disorder, and Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We, here, describe seven patients with autosomal recessive variants in
      ELOVL1.
    explanation: Establishes the recessive arm and its cohort size.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Applies to the Monoallelic IKSHD subtype. De novo in every reported case; no transmitted pedigree has been published,
    so the dominant mode is inferred from heterozygosity plus de novo status
    rather than from segregation.
  evidence:
  - reference: PMID:42101073
    reference_title: "Complicated Spastic Paraparesis: Study of a Patient With a De Novo Pathogenic Variant in ELOVL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis identified the de novo pathogenic variant p.Ser165Phe in
      ELOVL1.
    explanation: A further independent de novo occurrence of the same allele.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Applies to the Biallelic ELOVL1 disorder subtype.
  evidence:
  - reference: PMID:40590574
    reference_title: "Biallelic ELOVL1 Variants Are Linked to Hypomyelinating Leukodystrophy, Movement Disorder, and Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We, here, describe seven patients with autosomal recessive variants in
      ELOVL1.
    explanation: States the recessive mode for this arm.

genetic:
- name: ELOVL1
  gene_term:
    preferred_term: ELOVL1
    term:
      id: hgnc:14418
      label: ELOVL1
  relationship_type: CAUSATIVE
  notes: >-
    ELOVL1 catalyses the rate-limiting condensation step in elongating C22-C26
    saturated and monounsaturated fatty acids, and is most abundant in heavily
    myelinated central nervous system regions and in epidermis - which is why a
    single enzyme defect reaches both organs. The recurrent monoallelic allele
    is p.Ser165Phe; biallelic variants are private to their families.
  evidence:
  - reference: PMID:29496980
    reference_title: "Dominant ELOVL1 mutation causes neurological disorder with ichthyotic keratoderma, spasticity, hypomyelination and dysmorphic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The functional effect of prioritised variant in ELOVL1 (very-long-chain
      fatty acids (VLCFAs) elongase) was analysed by VLCFA profiling by gas
      chromatography-mass spectrometry in stably transfected HEK2932 cells and
      in cultured patient's fibroblasts.
    explanation: >-
      Records that the causal assignment rests on measured elongase function,
      not on variant prediction alone.

pathophysiology:
- name: ELOVL1 Elongase Activity Loss
  biological_scale: MOLECULAR
  description: >-
    The p.Ser165Phe substitution abolishes elongase activity in patient cells
    and in a transfected expression system. Because ELOVL1 catalyses the
    condensation step that limits the whole elongation cycle, losing it caps
    acyl chain length rather than reducing fatty acid supply generally.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  biological_processes:
  - preferred_term: fatty acid elongation
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030497
      label: fatty acid elongation
  downstream:
  - target: Deficient C24 to C26 Very-Long-Chain Fatty Acid Elongation
    causal_link_type: DIRECT
    description: >-
      Loss of the condensing enzyme truncates the acyl chains available to
      downstream sphingolipid synthesis.
    evidence:
    - reference: PMID:30487246
      reference_title: "De novo mutation in ELOVL1 causes ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutation abrogated ELOVL1 enzymatic activity and reduced >=C24
        ceramides and sphingomyelins in patient cells.
      explanation: >-
        Couples the enzymatic defect to the measured lipid consequence in the
        same experiment, which is what makes this edge direct rather than
        inferred.
  evidence:
  - reference: PMID:42101073
    reference_title: "Complicated Spastic Paraparesis: Study of a Patient With a De Novo Pathogenic Variant in ELOVL1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ELOVL1 plays a key role in the initial step of the fatty acid elongation
      cycle within the endoplasmic reticulum (ER), being responsible for the
      elongation of very long-chain fatty acids (VLCFAs), particularly saturated
      and monounsaturated C22-C26
    explanation: >-
      States the enzyme's step and substrate range, which is what fixes the
      chain-length ceiling this node describes.

- name: Deficient C24 to C26 Very-Long-Chain Fatty Acid Elongation
  biological_scale: MOLECULAR
  description: >-
    Ultra-long acyl chains become unavailable while shorter species accumulate.
    The lesion is a shift in chain-length distribution rather than a shortage of
    lipid, which is why the two affected tissues are the two that specifically
    require the longest species.
  biological_processes:
  - preferred_term: ceramide metabolic process
    modifier: DECREASED
    term:
      id: GO:0006672
      label: ceramide metabolic process
  downstream:
  - target: Shortened Sphingolipid Acyl Chains in Central Myelin
    causal_link_type: DIRECT
    description: >-
      Myelin sphingolipids are built from the acyl chains this step supplies.
    evidence:
    - reference: PMID:32123819
      reference_title: "Reduced chain length in myelin sphingolipids and poorer motor coordination in mice deficient in the fatty acid elongase Elovl1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The acyl chain length of sphingolipids such as galactosylceramides,
        sulfatides, sphingomyelins, and ceramides in the brains of these mice
        was markedly shortened.
      explanation: >-
        Direct measurement of the chain-length shift in brain sphingolipids on
        loss of the same enzyme.
  - target: Reduced Ultra-Long-Chain Ceramides in the Stratum Corneum
    causal_link_type: DIRECT
    description: >-
      Epidermal ceramides uniquely require extremely long fatty acids, supplied
      by this step.
    evidence:
    - reference: PMID:23689133
      reference_title: "Impaired epidermal permeability barrier in mice lacking elovl1, the gene responsible for very-long-chain fatty acid production."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the epidermis of the Elovl1-null mice, the levels of Cers with >=C26
        FAs were decreased, while those of Cers with <=C24 FAs were increased.
      explanation: >-
        Shows the reciprocal shift - long species down, shorter species up -
        that identifies this as a chain-length defect rather than a deficiency.
  evidence:
  - reference: PMID:40590574
    reference_title: "Biallelic ELOVL1 Variants Are Linked to Hypomyelinating Leukodystrophy, Movement Disorder, and Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma VLCFA analysis in one patient showed reduced concentrations of
      C24:0 and C26:0.
    explanation: >-
      The corresponding measurement in a patient rather than a model, though in
      a single individual.

- name: Shortened Sphingolipid Acyl Chains in Central Myelin
  biological_scale: CELLULAR
  description: >-
    Galactosylceramides, sulfatides and sphingomyelins of central myelin are
    assembled with acyl chains that are too short, and galactosylceramide levels
    fall. These are the lipids that give compact myelin its stability.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  downstream:
  - target: Central Nervous System Hypomyelination
    causal_link_type: DIRECT
    description: >-
      Lipid composition failure translates into structurally deficient myelin,
      most evident in large-diameter axons.
    evidence:
    - reference: PMID:32123819
      reference_title: "Reduced chain length in myelin sphingolipids and poorer motor coordination in mice deficient in the fatty acid elongase Elovl1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Electron microscope analysis of the corpus callosum in Elovl1 mutant
        mice revealed modest hypomyelination, especially in large-diameter
        axons.
      explanation: >-
        Ultrastructural confirmation that the lipid change produces a myelin
        deficit, and that it is selective for large axons.
  evidence:
  - reference: PMID:32123819
    reference_title: "Reduced chain length in myelin sphingolipids and poorer motor coordination in mice deficient in the fatty acid elongase Elovl1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, the mice exhibited reduced levels of galactosylceramides, which
      are important for myelin formation and stability.
    explanation: >-
      Names the specific lipid class whose loss links chain length to myelin
      integrity.

- name: Central Nervous System Hypomyelination
  biological_scale: TISSUE
  description: >-
    Non-progressive or slowly progressive white matter signal abnormality on
    MRI, with thinning of the corpus callosum. It is the substrate for the
    pyramidal and oculomotor findings, and it is what places the disorder among
    the hypomyelinating leukodystrophies rather than the demyelinating ones.
  downstream:
  - target: Spastic paraplegia
    causal_link_type: DIRECT
    description: >-
      Corticospinal tract hypomyelination produces the progressive spastic
      paraparesis.
    evidence:
    - reference: PMID:30487246
      reference_title: "De novo mutation in ELOVL1 causes ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hypomyelination of the central white matter explained spastic paraplegia
        and central nystagmus, while optic atrophy was causative for reduction
        of peripheral vision and visual acuity.
      explanation: >-
        The authors' own attribution of the motor and oculomotor findings to
        hypomyelination, and of the visual loss to a separate optic lesion.
  - target: Nystagmus
    causal_link_type: DIRECT
    description: Central nystagmus attributed to the same white matter deficit.
    evidence:
    - reference: PMID:30487246
      reference_title: "De novo mutation in ELOVL1 causes ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hypomyelination of the central white matter explained spastic paraplegia
        and central nystagmus, while optic atrophy was causative for reduction
        of peripheral vision and visual acuity.
      explanation: Same attribution, for the oculomotor sign.
  evidence:
  - reference: PMID:40590574
    reference_title: "Biallelic ELOVL1 Variants Are Linked to Hypomyelinating Leukodystrophy, Movement Disorder, and Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI revealed non-progressive hypomyelination (6/6) and hypoplasia of
      the corpus callosum (5/6).
    explanation: >-
      Frequencies in the recessive cohort, and the observation that the
      hypomyelination is non-progressive.

- name: Reduced Ultra-Long-Chain Ceramides in the Stratum Corneum
  biological_scale: TISSUE
  description: >-
    Epidermal ceramides are unusual in carrying extremely long fatty acids, and
    those are what organise the lipid lamellae of the stratum corneum. Shortened
    chains cannot build them.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Epidermal Permeability Barrier Failure
    causal_link_type: DIRECT
    description: >-
      Loss of the lamellar lipid architecture leaves the barrier unable to
      restrict water loss.
    evidence:
    - reference: PMID:23689133
      reference_title: "Impaired epidermal permeability barrier in mice lacking elovl1, the gene responsible for very-long-chain fatty acid production."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The lipid lamellae in the stratum corneum were largely diminished in
        these mice.
      explanation: The structural failure that connects lipid composition to barrier function.
  evidence:
  - reference: PMID:23689133
    reference_title: "Impaired epidermal permeability barrier in mice lacking elovl1, the gene responsible for very-long-chain fatty acid production."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Elovl1 is a key determinant of epidermal Cer chain length and is essential
      for permeability barrier formation.
    explanation: The authors' summary of the enzyme's role in this compartment.

- name: Epidermal Permeability Barrier Failure
  biological_scale: TISSUE
  description: >-
    A defective barrier drives compensatory hyperproliferation and
    hyperkeratosis, which is the ichthyotic keratoderma the disease is named
    for. Transcriptome analysis of patient fibroblasts shows the epidermal
    developmental and keratinisation programmes upregulated while
    neurodevelopmental and myelination programmes are downregulated - the two
    arms of the phenotype visible as opposite transcriptional shifts.
  downstream:
  - target: Ichthyosis
    causal_link_type: DIRECT
    description: >-
      Barrier failure with compensatory hyperkeratosis presents as congenital
      ichthyosis.
    evidence:
    - reference: PMID:30487246
      reference_title: "De novo mutation in ELOVL1 causes ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients suffered from epidermal hyperproliferation and increased
        keratinisation (ichthyosis).
      explanation: Names the epidermal response and the clinical term for it.
  evidence:
  - reference: PMID:30487246
    reference_title: "De novo mutation in ELOVL1 causes ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptome analysis revealed upregulation of modules involved in
      epidermal development and keratinisation, and downregulation of genes for
      neurodevelopment, myelination, and synaptogenesis.
    explanation: >-
      Shows both organ arms of the disease as reciprocal transcriptional
      programmes in the same patient cells.


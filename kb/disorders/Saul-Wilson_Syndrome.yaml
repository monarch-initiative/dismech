- name: Growth Hormone Supplementation (Ineffective)
  description: >-
    Curated as a negative result rather than a recommendation. A retrospective
    analysis comparing height-for-age model fits before and after starting
    growth hormone found no apparent effect on height in Saul-Wilson syndrome.
    That is the expected outcome for a cell-intrinsic secretion and matrix
    defect, and it matters practically: the same paper warns against
    unnecessarily aggressive nutritional intervention aimed at a weight target
    that is not achievable in a genetically determined primordial dwarfism.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:32652690
    reference_title: "Growth in individuals with Saul-Wilson syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed statistical comparisons of height-for-age model fits before and after initiation of growth hormone supplementation, and found that this therapy does not appear to influence height in individuals with SWS"
    explanation: >-
      Refutes growth hormone as an effective height intervention in this
      disorder, which is why the entry records it as a negative result.

diagnosis:
- name: Molecular genetic testing of COG4
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Heterozygous COG4 c.1546G>A p.(Gly516Arg)
  description: >-
    Unusually straightforward for a rare disease: every reported patient
    carries the same de novo heterozygous substitution, so a targeted single
    variant test confirms the diagnosis. Note that other COG4 variants cause a
    biallelic congenital disorder of glycosylation with a different phenotype,
    so the gene name alone is not the answer - the specific allele is.
  evidence:
  - reference: PMID:32078278
    reference_title: "Saul-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SWS is established in a proband with marked short stature, typical facial and skeletal features, and a heterozygous pathogenic variant in COG4 identified by molecular genetic testing."
    explanation: >-
      The GeneReviews diagnostic criterion.
animal_models:
- name: Zebrafish COG4 p.Gly516Arg expressing embryos
  species: Zebrafish
  genotype: Expression of human COG4 p.Gly516Arg mRNA in wild-type embryos
  publication: PMID:34595172
  description: >-
    An overexpression rather than a knock-in model, and that is the caveat to
    carry through everything below - but it reproduces the two things the human
    disorder needs explaining: short body length and defective cartilage
    chondrocyte intercalation, both traceable to glypican accumulation and a
    selective rise in wnt4.
  modeled_mechanisms:
  - target: Glypican Accumulation and Elevated wnt4 Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mechanism was established in this model, not merely reproduced by it -
      glypican accumulation, the selective wnt4 increase, the phenocopy on wnt4
      overexpression, and the partial pharmacological rescue are all zebrafish
      results.
    limitations: >-
      Dominant human mRNA expressed in a wild-type background, so the dose is
      not physiological and a dominant-negative artefact cannot be formally
      excluded. The LGK974 rescue is also biphasic - correcting at low
      concentration and worsening at slightly higher - which is what one expects
      of a pathway that must be tuned rather than switched off, but it makes the
      rescue a weaker causal argument than a clean dose-response would be.
    readouts:
    - name: Larval body length under Wnt inhibition
      target: Glypican Accumulation and Elevated wnt4 Signalling
      direction: RESTORED
      interpretation: >-
        Partial pharmacological rescue supports Wnt signalling as the effector
        arm, with the biphasic response as the stated caveat.
      evidence:
      - reference: PMID:34595172
        reference_title: "A Dominant Heterozygous Mutation in COG4 Causes Saul-Wilson Syndrome, a Primordial Dwarfism, and Disrupts Zebrafish Development via Wnt Signaling."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "LGK974, an inhibitor of Wnt signaling, corrects the shortened body length at low concentrations but amplifies it at slightly higher concentrations."
        explanation: >-
          The rescue and its biphasic limitation, quoted together because they
          are one result.
    evidence:
    - reference: PMID:34595172
      reference_title: "A Dominant Heterozygous Mutation in COG4 Causes Saul-Wilson Syndrome, a Primordial Dwarfism, and Disrupts Zebrafish Development via Wnt Signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These animals show phenotypes consistent with convergent extension (CE) defects during gastrulation, shortened body length, and malformed jaw cartilage chondrocyte intercalation at larval stages."
      explanation: >-
        The developmental phenotype that makes this model informative for the
        glypican/wnt4 node.
- name: C. elegans cogc-4(av107)
  species: Caenorhabditis elegans
  genotype: cogc-4(av107) - CRISPR-Cas9 knock-in of the orthologous glycine-to-arginine substitution
  publication: PMID:33688625
  description: >-
    A genuine negative result, and the more rigorous model design of the two:
    an endogenous knock-in of the orthologous substitution rather than
    overexpression of the human protein. It produced no detectable phenotype -
    not on observation, not under heat or Paraquat stress, and not on RNAi
    against the other seven COG subunits. Recorded because a published negative
    that took this much work to establish should not have to be rediscovered.
  modeled_mechanisms:
  - target: Recurrent COG4 p.Gly516Arg Substitution
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The same substitution, made endogenously in the orthologous gene, causes
      nothing detectable in the worm. This is a constraint on how the human
      variant is understood: whatever it does, it is not a cell-autonomous
      insult that any COG4-expressing organism would register.
    limitations: >-
      Absence of a phenotype under the assays used is not absence of a
      molecular defect - the authors say so themselves, and recommend directly
      assessing Golgi function rather than screening for organismal phenotypes.
      C. elegans also lacks cartilage and endochondral bone entirely, so the
      tissue in which the human disease manifests has no counterpart to
      examine.
    evidence:
    - reference: PMID:33688625
      reference_title: "Saul-Wilson Syndrome Missense Allele Does Not Show Obvious Golgi Defects in a C. elegans Model."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Our data suggest that this mutation in cogc-4(av107) worms does not lead to a detectable phenotype."
      explanation: >-
        The negative conclusion, stated by the authors.
    - reference: PMID:33688625
      reference_title: "Saul-Wilson Syndrome Missense Allele Does Not Show Obvious Golgi Defects in a C. elegans Model."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We used a variety of assays including stressing the worms using heat and Paraquat, as well as RNAi against the 7 other COG complex subunit genes in an attempt to uncover a phenotype."
      explanation: >-
        Documents the breadth of the search, which is what distinguishes this
        from a model that was simply not looked at hard enough.

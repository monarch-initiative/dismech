- category: Hematologic
  name: Intermittent neutropenia
  phenotype_term:
    preferred_term: Intermittent neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  frequency: VERY_FREQUENT
  description: >-
    A laboratory finding rather than a structural one, and easy to miss in a
    disorder framed as a skeletal dysplasia. Two things make the timing matter:
    it is intermittent without cyclic periodicity, so a single normal count
    does not exclude it, and it was absent in all four individuals whose counts
    were taken in the first two months of life - a normal neonatal count says
    nothing. In everyone tested beyond that window it was present.
  evidence:
  - reference: PMID:31949312
    reference_title: "Defining the clinical phenotype of Saul-Wilson syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

genetic:
- name: COG4
  gene_term:
    preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    COG4 (16q22.1) encodes a lobe-A subunit of the conserved oligomeric Golgi
    complex. Saul-Wilson syndrome is caused by a single recurrent amino acid
    substitution, p.Gly516Arg; only two COG4 variants have been reported, both
    producing that same change. This allelic specificity is unusual enough to be
    diagnostically useful - a different COG4 variant is not Saul-Wilson
    syndrome.
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected subjects harbored heterozygous de novo variants in COG4, giving rise to the same recurrent amino acid substitution (p.Gly516Arg)."
    explanation: >-
      Establishes the gene and the single recurrent substitution.
  - reference: PMID:32078278
    reference_title: "Saul-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date only two COG4 variants, both resulting in a p.Gly516Arg missense change, have been reported."
    explanation: >-
      Confirms the allelic restriction at the level of reported variants.
pathophysiology:
- name: Recurrent COG4 p.Gly516Arg Substitution
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous de novo missense change in a lobe-A subunit of the conserved
    oligomeric Golgi complex. Critically, this is not haploinsufficiency:
    patient fibroblasts have undiminished COG4 mRNA and protein, so the variant
    protein is present and acting, not absent.
  genes:
  - preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  genetic_context:
    functional_impact_category: UNKNOWN
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      A single recurrent heterozygous missense substitution. Its impact is not
      loss of function - COG4 mRNA and protein levels are preserved - and no
      published work assigns it to a named functional class, so
      functional_impact_category is recorded as UNKNOWN rather than guessed at.
  downstream:
  - target: Imbalanced Bidirectional Golgi Vesicular Traffic
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Affected individuals' fibroblasts, whose COG4 mRNA and protein were not decreased"
    explanation: >-
      Rules out reduced COG4 abundance as the mechanism, which is what forces a
      non-loss-of-function reading of the variant.
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The conserved oligomeric Golgi (COG) complex is involved in intracellular vesicular transport, and is composed of eight subunits distributed in two lobes, lobe A (COG1-4) and lobe B (COG5-8)."
    explanation: >-
      Identifies the complex and the lobe in which COG4 sits.
- name: Imbalanced Bidirectional Golgi Vesicular Traffic
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show delayed anterograde vesicular trafficking from the
    ER to the Golgi together with accelerated retrograde recycling from the
    Golgi back to the ER. The disorder is therefore one of steady-state
    imbalance in both directions, not a simple block - a distinction that
    matters because it predicts a shrinking rather than a distended Golgi.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    modifier: INCREASED
  downstream:
  - target: Golgi Volume Loss and Stack Collapse
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "exhibited delayed anterograde vesicular trafficking from the ER to the Golgi and accelerated retrograde vesicular recycling from the Golgi to the ER"
    explanation: >-
      The measured bidirectional trafficking defect in patient cells.
- name: Golgi Volume Loss and Stack Collapse
  biological_scale: CELLULAR
  description: >-
    The altered steady-state equilibrium decreases Golgi volume and collapses
    the Golgi stacks - the structural consequence of removing more membrane
    retrogradely than arrives anterogradely.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  biological_processes:
  - preferred_term: Golgi organization
    term:
      id: GO:0007030
      label: Golgi organization
    modifier: ABNORMAL
  downstream:
  - target: Selective Decorin Glycosylation Defect
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This altered steady-state equilibrium led to a decrease in Golgi volume, as well as morphologic abnormalities with collapse of the Golgi stacks."
    explanation: >-
      Documents both the volume loss and the morphological collapse.
- name: Selective Decorin Glycosylation Defect
  biological_scale: MOLECULAR
  description: >-
    Despite a visibly abnormal Golgi, protein glycosylation in patient serum and
    fibroblasts is not notably altered. The one demonstrated exception is
    decorin, a proteoglycan secreted into the extracellular matrix, whose
    Golgi-dependent glycosylation is altered. This selectivity is the reason the
    disease presents as a skeletal dysplasia rather than as a congenital
    disorder of glycosylation, and it is also the weakest link in the causal
    chain: no study has yet shown that altered decorin glycosylation is
    sufficient to produce the skeletal phenotype.
  biological_processes:
  - preferred_term: proteoglycan biosynthetic process
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
    modifier: ABNORMAL
  downstream:
  - target: Profound Short Stature and Skeletal Dysplasia
  - target: Lamellar cataracts
    description: >-
      Decorin and related small leucine-rich proteoglycans are
      extracellular-matrix components of ocular tissue; grouped here as the most plausible
      route, which has not been shown directly.
  - target: Rod-cone retinal dystrophy
    description: >-
      Grouped with the other ocular findings as a probable
      extracellular-matrix consequence; not demonstrated.
  - target: Hearing loss
    description: >-
      Conductive, sensorineural and mixed loss are reported; the conductive
      component is plausibly skeletal, but no mechanism has been established.
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "protein glycosylation in sera and fibroblasts from affected subjects was not notably altered, but decorin, a proteoglycan secreted into the extracellular matrix, showed altered Golgi-dependent glycosylation"
    explanation: >-
      Establishes both the sparing of bulk glycosylation and the single
      demonstrated proteoglycan defect.
- name: Profound Short Stature and Skeletal Dysplasia
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint: profound short stature with distinctive craniofacial
    features, short distal phalanges of fingers and toes and often clubfoot,
    with cognition normal.
  downstream:
  - target: Profound short stature
    description: >-
      The growth endpoint of the extracellular-matrix defect.
  - target: Short distal phalanges of fingers
    description: >-
      Acral skeletal expression of the same dysplasia.
  - target: Clubfoot
    description: >-
      Skeletal/positional consequence of the dysplasia.
  - target: Distinctive craniofacial features
    description: >-
      Craniofacial skeletal expression of the dysplasia.
  - target: Atlantoaxial instability
    description: >-
      Cervical skeletal consequence, and the finding that drives the activity
      restriction; the specific route from altered proteoglycan glycosylation
      to ligamentous or odontoid instability is not established.
  - target: Delayed speech and language development
    description: >-
      Early speech and motor development are delayed while cognition is
      normal; grouped with the developmental consequences, with no established
      mechanism.
  evidence:
  - reference: PMID:32078278
    reference_title: "Saul-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Saul-Wilson syndrome (SWS) is a skeletal dysplasia characterized by profound short stature, distinctive craniofacial features, short distal phalanges of fingers and toes, and often clubfoot."
    explanation: >-
      GeneReviews defines the clinical endpoint.

discussions:
- discussion_id: sws_decorin_sufficiency
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Selective Decorin Glycosylation Defect
  prompt: >-
    Is altered decorin glycosylation sufficient to produce the Saul-Wilson
    skeletal phenotype, or is it a marker of a broader extracellular-matrix
    defect that has not yet been measured?
  rationale: >-
    Decorin is the only protein shown to be abnormally glycosylated in patient
    cells, and bulk glycosylation is preserved - so it carries the entire
    explanatory weight between a shrunken Golgi and a skeletal dysplasia. That
    is a lot to rest on one assay of one proteoglycan, and no reported
    experiment tests whether correcting or phenocopying the decorin defect
    changes the skeletal outcome.

name: Saul-Wilson Syndrome
creation_date: "2026-08-27T01:40:00Z"
category: Mendelian
synonyms:
- SWS
- SWILS
- microcephalic osteodysplastic dysplasia, Saul-Wilson type
description: >-
  Saul-Wilson syndrome is a primordial skeletal dysplasia caused by a single
  recurrent de novo heterozygous COG4 substitution, p.Gly516Arg. COG4 is a
  lobe-A subunit of the conserved oligomeric Golgi (COG) complex, which
  organizes vesicular transport at the Golgi. What makes the disorder
  mechanistically distinctive is that it is not a loss of COG4: patient
  fibroblasts have normal COG4 mRNA and protein, and the variant instead shifts
  the steady-state balance of Golgi traffic - anterograde ER-to-Golgi transport
  is delayed while retrograde Golgi-to-ER recycling is accelerated. The Golgi
  shrinks and its stacks collapse. Bulk protein glycosylation is nonetheless
  largely preserved, and the measurable glycosylation defect is restricted to
  decorin, a secreted extracellular-matrix proteoglycan - which is why the
  phenotype is skeletal rather than the multisystem picture of biallelic
  COG4-CDG, a genuinely different disease in the same gene. Clinically:
  profound short stature, distinctive craniofacial features, short distal
  phalanges and often clubfoot, with normal cognition.

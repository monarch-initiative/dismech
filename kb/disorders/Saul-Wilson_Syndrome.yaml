genetic:
- name: COG4
  gene_term:
    preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    COG4 (16q22.1) encodes a lobe-A subunit of the conserved oligomeric Golgi
    complex. Saul-Wilson syndrome is caused by a single recurrent amino acid
    substitution, p.Gly516Arg; only two COG4 variants have been reported, both
    producing that same change. This allelic specificity is unusual enough to be
    diagnostically useful - a different COG4 variant is not Saul-Wilson
    syndrome.
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected subjects harbored heterozygous de novo variants in COG4, giving rise to the same recurrent amino acid substitution (p.Gly516Arg)."
    explanation: >-
      Establishes the gene and the single recurrent substitution.
  - reference: PMID:32078278
    reference_title: "Saul-Wilson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date only two COG4 variants, both resulting in a p.Gly516Arg missense change, have been reported."
    explanation: >-
      Confirms the allelic restriction at the level of reported variants.
pathophysiology:
- name: Recurrent COG4 p.Gly516Arg Substitution
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous de novo missense change in a lobe-A subunit of the conserved
    oligomeric Golgi complex. Critically, this is not haploinsufficiency:
    patient fibroblasts have undiminished COG4 mRNA and protein, so the variant
    protein is present and acting, not absent.
  genes:
  - preferred_term: COG4
    term:
      id: hgnc:18620
      label: COG4
  genetic_context:
    functional_impact_category: UNKNOWN
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      A single recurrent heterozygous missense substitution. Its impact is not
      loss of function - COG4 mRNA and protein levels are preserved - and no
      published work assigns it to a named functional class, so
      functional_impact_category is recorded as UNKNOWN rather than guessed at.
  downstream:
  - target: Imbalanced Bidirectional Golgi Vesicular Traffic
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Affected individuals' fibroblasts, whose COG4 mRNA and protein were not decreased"
    explanation: >-
      Rules out reduced COG4 abundance as the mechanism, which is what forces a
      non-loss-of-function reading of the variant.
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The conserved oligomeric Golgi (COG) complex is involved in intracellular vesicular transport, and is composed of eight subunits distributed in two lobes, lobe A (COG1-4) and lobe B (COG5-8)."
    explanation: >-
      Identifies the complex and the lobe in which COG4 sits.
- name: Imbalanced Bidirectional Golgi Vesicular Traffic
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show delayed anterograde vesicular trafficking from the
    ER to the Golgi together with accelerated retrograde recycling from the
    Golgi back to the ER. The disorder is therefore one of steady-state
    imbalance in both directions, not a simple block - a distinction that
    matters because it predicts a shrinking rather than a distended Golgi.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    modifier: INCREASED
  downstream:
  - target: Golgi Volume Loss and Stack Collapse
  - target: Intermittent neutropenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Granulocyte development and release are secretion-dependent; grouped
      here as the most plausible route, which has not been investigated in
      this disorder.
  - target: Elevated liver transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hepatocytes are among the most secretory cell types; grouped here, with
      no established mechanism.
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "exhibited delayed anterograde vesicular trafficking from the ER to the Golgi and accelerated retrograde vesicular recycling from the Golgi to the ER"
    explanation: >-
      The measured bidirectional trafficking defect in patient cells.
- name: Golgi Volume Loss and Stack Collapse
  biological_scale: CELLULAR
  description: >-
    The altered steady-state equilibrium decreases Golgi volume and collapses
    the Golgi stacks - the structural consequence of removing more membrane
    retrogradely than arrives anterogradely.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  biological_processes:
  - preferred_term: Golgi organization
    term:
      id: GO:0007030
      label: Golgi organization
    modifier: ABNORMAL
  downstream:
  - target: Selective Decorin Glycosylation Defect
  - target: Glypican Accumulation and Elevated wnt4 Signalling
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This altered steady-state equilibrium led to a decrease in Golgi volume, as well as morphologic abnormalities with collapse of the Golgi stacks."
    explanation: >-
      Documents both the volume loss and the morphological collapse.
- name: Selective Decorin Glycosylation Defect
  biological_scale: MOLECULAR
  description: >-
    Despite a visibly abnormal Golgi, protein glycosylation in patient serum and
    fibroblasts is not notably altered. The one demonstrated exception is
    decorin, a proteoglycan secreted into the extracellular matrix, whose
    Golgi-dependent glycosylation is altered. This selectivity is the reason the
    disease presents as a skeletal dysplasia rather than as a congenital
    disorder of glycosylation, and it is also the weakest link in the causal
    chain: no study has yet shown that altered decorin glycosylation is
    sufficient to produce the skeletal phenotype.
  biological_processes:
  - preferred_term: proteoglycan biosynthetic process
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
    modifier: ABNORMAL
  downstream:
  - target: Profound Short Stature and Skeletal Dysplasia
  - target: Lamellar cataracts
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Decorin and related small leucine-rich proteoglycans are
      extracellular-matrix components of ocular tissue; grouped here as the most plausible
      route, which has not been shown directly.
  - target: Rod-cone retinal dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the other ocular findings as a probable
      extracellular-matrix consequence; not demonstrated.
  - target: Hearing loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Conductive, sensorineural and mixed loss are reported; the conductive
      component is plausibly skeletal, but no mechanism has been established.
  - target: Cystic macular changes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the other ocular findings as a probable
      extracellular-matrix consequence; not demonstrated.
  evidence:
  - reference: PMID:30290151
    reference_title: "A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome, Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "protein glycosylation in sera and fibroblasts from affected subjects was not notably altered, but decorin, a proteoglycan secreted into the extracellular matrix, showed altered Golgi-dependent glycosylation"
    explanation: >-
      Establishes both the sparing of bulk glycosylation and the single
      demonstrated proteoglycan defect.
- name: Glypican Accumulation and Elevated wnt4 Signalling
  biological_scale: MOLECULAR
  description: >-
    The proteoglycan defect is not confined to decorin. Patient fibroblasts
    accumulate glypicans - heparan sulfate proteoglycans that gate several
    growth and bone-development pathways - and the same accumulation occurs in
    zebrafish embryos expressing COG4 p.G516R. Downstream, wnt4 transcripts rise
    selectively, and overexpressing wnt4 alone phenocopies the developmental
    defects, so the elevated wnt4 is doing causal work rather than marking the
    lesion. The Wnt inhibitor LGK974 partially corrects body length, which is
    the strongest evidence in this disorder that a downstream node is
    pharmacologically addressable.
  biological_processes:
  - preferred_term: heparan sulfate proteoglycan metabolic process
    term:
      id: GO:0030201
      label: heparan sulfate proteoglycan metabolic process
    modifier: ABNORMAL
  - preferred_term: non-canonical Wnt signaling pathway
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
    modifier: INCREASED
  downstream:
  - target: Impaired Chondrocyte Differentiation and Secretome
  - target: Profound Short Stature and Skeletal Dysplasia
    description: >-
      Convergent-extension defects and shortened body length in the zebrafish
      model are the developmental route from glypican/wnt4 dysregulation to the
      growth phenotype.
  evidence:
  - reference: PMID:34595172
    reference_title: "A Dominant Heterozygous Mutation in COG4 Causes Saul-Wilson Syndrome, a Primordial Dwarfism, and Disrupts Zebrafish Development via Wnt Signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SWS fibroblasts accumulate glypicans, a group of heparan sulfate proteoglycans (HSPGs) critical for growth and bone development through multiple signaling pathways."
    explanation: >-
      Extends the proteoglycan defect from decorin to the glypicans in patient
      cells.
  - reference: PMID:34595172
    reference_title: "A Dominant Heterozygous Mutation in COG4 Causes Saul-Wilson Syndrome, a Primordial Dwarfism, and Disrupts Zebrafish Development via Wnt Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we assessed wnt levels and found a selective increase of wnt4 transcripts in the presence of COG4 p.G516R"
    explanation: >-
      Identifies the specific signalling change downstream of glypican
      accumulation.
  - reference: PMID:34595172
    reference_title: "A Dominant Heterozygous Mutation in COG4 Causes Saul-Wilson Syndrome, a Primordial Dwarfism, and Disrupts Zebrafish Development via Wnt Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "overexpression of wnt4 mRNA phenocopies these developmental defects"
    explanation: >-
      Phenocopy by wnt4 alone is what makes the elevated wnt4 causal rather than
      correlative.
- name: Impaired Chondrocyte Differentiation and Secretome
  biological_scale: CELLULAR
  description: >-
    In a chondrocyte-relevant cell type carrying a CRISPR knock-in of the
    variant, 3D spheroids are smaller and apoptosis is increased - impaired in
    vitro chondrogenesis. The defect is largely non-cell-autonomous: adding
    wild-type cells or merely their conditioned medium rescues both cell death
    and spheroid size, pointing at missing secreted matrix components rather
    than an intrinsic block. Secretome analysis identifies MMP13 and IGFBP7,
    both chondro-osteogenic, as selectively under-secreted, and the cells show
    reduced MMP13 and COL10A1 differentiation markers with a delayed BMP2
    response. Notably, bulk N-glycans change only modestly, which reinforces
    that this is a trafficking and secretion disease rather than a
    glycosylation disease.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Profound Short Stature and Skeletal Dysplasia
  - target: Skeletal fragility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Under-secretion of chondro-osteogenic matrix components is the plausible
      route to fragile bone; not demonstrated directly.
  - target: Premature degenerative joint disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The adult-onset consequence of the same abnormal cartilage matrix:
      chondrocytes that differentiate and secrete abnormally produce cartilage
      that wears out decades early.
  evidence:
  - reference: PMID:36393834
    reference_title: "COG4 mutation in Saul-Wilson syndrome selectively affects secretion of proteins involved in chondrogenesis in chondrocyte-like cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that cells carrying the COG4p.G516R variant made smaller spheroids and had increased apoptosis, indicating impaired in vitro chondrogenesis"
    explanation: >-
      The chondrogenic defect measured in a disease-relevant cell type.
  - reference: PMID:36393834
    reference_title: "COG4 mutation in Saul-Wilson syndrome selectively affects secretion of proteins involved in chondrogenesis in chondrocyte-like cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Adding WT cells or their conditioned medium reduced cell death and increased spheroid sizes of COG4p.G516R mutant cells, suggesting a deficiency in secreted matrix components."
    explanation: >-
      Rescue by conditioned medium alone establishes the defect as
      non-cell-autonomous - a secreted-factor deficiency.
  - reference: PMID:36393834
    reference_title: "COG4 mutation in Saul-Wilson syndrome selectively affects secretion of proteins involved in chondrogenesis in chondrocyte-like cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mass spectrometry-based secretome analysis showed selectively impaired protein secretion, including MMP13 and IGFBP7 which are involved in chondrogenesis and osteogenesis."
    explanation: >-
      Names the specific under-secreted factors linking the Golgi lesion to the
      cartilage phenotype.
  - reference: PMID:36393834
    reference_title: "COG4 mutation in Saul-Wilson syndrome selectively affects secretion of proteins involved in chondrogenesis in chondrocyte-like cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both SW1353 and HEK293T cells carrying COG4p.G516R showed very modest, cell-type dependent changes in N-glycans."
    explanation: >-
      Bulk glycosylation is near-normal, which is why this is a trafficking
      rather than a glycosylation disorder.

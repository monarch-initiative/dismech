genetic:
- name: CACNA1F
  gene_term:
    preferred_term: CACNA1F
    term:
      id: hgnc:1393
      label: CACNA1F
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the alpha-1F pore-forming subunit of the Cav1.4 L-type
    voltage-gated calcium channel. Located at Xp11.23, 48 exons; the
    pathogenic variant spectrum includes missense, nonsense, frameshift,
    splice-site, and intronic/synonymous splice-altering variants, with no
    clear genotype-phenotype correlation established.
  evidence:
  - reference: PMID:33513752
    reference_title: "A Novel Splice-Site Variant in CACNA1F Causes a Phenotype Synonymous with Åland Island Eye Disease and Incomplete Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-hundred and thirty variants were reported to be associated with CSNB2A, 19 were specific to AIED, and 14 were associated with both AIED and CSNB2A"
    explanation: Documents the size and overlap of the CACNA1F pathogenic variant spectrum across the CSNB2A/AIED phenotypic continuum.
discussions:
- discussion_id: gap_cacna1f_genotype_phenotype_divergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#CACNA1F
  prompt: >-
    Why do CACNA1F variants produce such divergent phenotypes (stationary
    CSNB2A/AIED versus progressive CORDX3/retinitis-pigmentosa-like disease)
    without a clear genotype-phenotype correlation, even among patients
    sharing the same variant?
  rationale: >-
    Multiple independent cohorts report that neither variant type/location
    nor family background reliably predicts phenotype severity or
    progression, implying unidentified modifier genes or environmental
    factors shape the clinical spectrum.
  proposed_experiments:
  - experiment_id: exp_cacna1f_modifier_gene_screen
    name: Modifier-gene screen across stationary vs progressive CACNA1F cohorts
    description: >-
      Systematic modifier-gene screening (e.g. exome-wide association) across
      deeply phenotyped CACNA1F cohorts stratified by stationary (CSNB2A/AIED)
      vs progressive (CORDX3) course, to identify genetic or environmental
      factors that explain the divergent clinical trajectories.
diagnosis:
- name: Full-Field Electroretinogram (ERG)
  description: >-
    Characteristic ERG findings are central to diagnosis and distinguish
    complete from incomplete X-linked CSNB. CACNA1F-related (incomplete)
    disease shows an electronegative (Schubert-Bornschein) waveform, with a
    markedly reduced b-wave relative to a relatively preserved a-wave, unlike
    the "complete" CSNB caused by ON-bipolar-cell signal-transduction defects.
  diagnosis_term:
    preferred_term: electroretinogram
    term:
      id: NCIT:C101217
      label: Retinal Examination
  results: >-
    Electronegative (reduced b/a ratio) dark-adapted standard/bright-flash
    ERG waveform.
  evidence:
  - reference: PMID:20301423
    reference_title: X-Linked Congenital Stationary Night Blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic ERG findings can help distinguish between complete
      X-linked CSNB and incomplete X-linked CSNB.
    explanation: >-
      GeneReviews establishes ERG waveform pattern as the key diagnostic
      differentiator between complete and incomplete (CACNA1F-related)
      X-linked CSNB.
  - reference: PMID:33668843
    reference_title: "Optic Atrophy and Inner Retinal Thinning in CACNA1F-related Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DA standard flash ERG showed an electronegative configuration in 20 of 22 patients (mean (SD) b/a ratio: 0.59 (0.23); range 0.25-1.16)"
    explanation: >-
      Quantifies the electronegative ERG waveform used diagnostically in a
      molecularly-confirmed CACNA1F cohort.
- name: Molecular Genetic Testing
  description: >-
    Identification of a hemizygous (or, in females, heterozygous/biallelic)
    pathogenic CACNA1F variant confirms the diagnosis, particularly when
    clinical/ERG features are inconclusive.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Identification of a hemizygous (male) or heterozygous/biallelic (female) pathogenic CACNA1F variant.
  evidence:
  - reference: PMID:20301423
    reference_title: X-Linked Congenital Stationary Night Blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous pathogenic variant in CACNA1F or NYX by
      molecular genetic testing can confirm the diagnosis if clinical
      features are inconclusive.
    explanation: >-
      GeneReviews establishes molecular genetic testing as confirmatory when
      clinical/ERG findings alone are inconclusive.
treatments:
- name: Refractive Correction
  description: >-
    Glasses or contact lenses to correct refractive error (myopia, occasionally
    hyperopia), which is common in CACNA1F-related disease; yearly eye
    examinations with refraction are recommended from a young age.
  treatment_term:
    preferred_term: therapeutic procedure of ocular refractive media
  evidence:
  - reference: PMID:20301423
    reference_title: X-Linked Congenital Stationary Night Blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glasses or contact lenses to treat refractive error (myopia or
      hyperopia)
    explanation: >-
      GeneReviews management section documenting refractive correction as
      supportive first-line management.
- name: Strabismus Surgery

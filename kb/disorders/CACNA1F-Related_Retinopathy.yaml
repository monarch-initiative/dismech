name: CACNA1F-Related Retinopathy
creation_date: "2026-07-13T00:00:00Z"
category: Mendelian
description: >
  CACNA1F-related retinopathy is an X-linked retinal channelopathy caused by
  pathogenic variants in CACNA1F, which encodes the alpha-1F pore-forming
  subunit of the Cav1.4 L-type voltage-gated calcium channel expressed at rod
  and cone photoreceptor ribbon synapses. Cav1.4 mediates the sustained,
  graded calcium influx required for tonic glutamate release from
  photoreceptors onto second-order bipolar cells in darkness. Most pathogenic
  variants are loss-of-function and abolish this synaptic transmission,
  producing the classic electronegative ERG (markedly reduced b-wave with
  relatively preserved a-wave) of incomplete congenital stationary night
  blindness (CSNB2A) -- distinguishing it from the "complete" CSNB caused by
  ON-bipolar-cell signal-transduction defects (e.g. NYX, GRM6). The disease
  spans a spectrum from stationary night blindness (CSNB2A) through the
  related, separately-curated Aland Island eye disease (fundus
  hypopigmentation plus CSNB2A features) to progressive X-linked cone-rod
  dystrophy (CORDX3), depending on residual channel activity and as-yet
  unidentified modifying factors -- with no clear genotype-phenotype
  correlation established. CACNA1F-retinopathy patients also show macular
  ganglion cell layer-inner plexiform layer thinning and optic disc pallor
  independent of myopia, indicating that inner retinal and optic nerve
  involvement extends beyond the primary photoreceptor synaptic defect.

has_subtypes:
- name: CSNB2A
  display_name: Incomplete Congenital Stationary Night Blindness (CSNB2A)
  subtype_term:
    preferred_term: congenital stationary night blindness 2A
    term:
      id: MONDO:0010241
      label: congenital stationary night blindness 2A
  description: >-
    The classic, non-progressive presentation. Nyctalopia and/or photophobia,
    myopia, nystagmus, reduced visual acuity, and a pathognomonic
    electronegative (Schubert-Bornschein) full-field ERG, with essentially
    normal fundus appearance apart from myopic changes.
- name: CORDX3
  display_name: X-linked Cone-Rod Dystrophy 3 (CORDX3)
  subtype_term:
    preferred_term: X-linked cone-rod dystrophy 3
    term:
      id: MONDO:0010335
      label: X-linked cone-rod dystrophy 3
  description: >-
    A progressive end of the CACNA1F spectrum, with declining visual acuity,
    color vision, and visual fields over time, and fundus/OCT findings
    (chorioretinal atrophy, vascular attenuation) overlapping with
    retinitis-pigmentosa-like degeneration rather than the stationary course
    of CSNB2A.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Hemizygous CACNA1F variants in males cause disease; female carriers are
    typically asymptomatic, occasionally with mild latent nystagmus or ERG
    abnormalities. If the mother of an affected male is a carrier, each
    pregnancy carries a 50% chance of transmitting the pathogenic variant;
    affected males pass the variant to all daughters (obligate carriers) and
    no sons.
  evidence:
  - reference: PMID:20301423
    reference_title: X-Linked Congenital Stationary Night Blindness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the mother of the proband is a carrier, the chance of transmitting
      the pathogenic variant in each pregnancy is 50%.
    explanation: >-
      GeneReviews genetic-counseling section quantifying transmission risk
      for X-linked CSNB/CACNA1F-related disease.
pathophysiology:
- name: Cav1.4 Channel Dysfunction at the Photoreceptor Ribbon Synapse
  description: >-
    CACNA1F pathogenic variants (missense, nonsense, frameshift, splice-site,
    and synonymous splice-altering variants) alter Cav1.4 L-type calcium
    channel abundance, gating, or biophysical properties at the presynaptic
    ribbon synapse of rod and cone photoreceptors. Most variants are
    loss-of-function; rare gain-of-function variants (e.g. I756T) also cause
    disease via a distinct mechanism.
  cell_types:
  - preferred_term: Photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  molecular_functions:
  - preferred_term: Voltage-gated calcium channel activity
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:33513752
    reference_title: "A Novel Splice-Site Variant in CACNA1F Causes a Phenotype Synonymous with Åland Island Eye Disease and Incomplete Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these channels support Ca2+ influx under relatively depolarized conditions, which is necessary for tonic glutamate release from rod and cone photoreceptors"
    explanation: Describes the normal Cav1.4 function at the photoreceptor synapse that CACNA1F variants disrupt.
  - reference: PMID:36943941
    reference_title: "Characterization of two pathological gating-charge substitutions in Cav1.4 L-type calcium channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A set of known mutations affects conserved gating charges in"
    explanation: Functional electrophysiology of pathogenic CACNA1F gating-charge substitutions supporting altered channel biophysics as the proximal molecular lesion.
  downstream:
  - target: Defective Photoreceptor-to-Bipolar Cell Glutamatergic Transmission
- name: Defective Photoreceptor-to-Bipolar Cell Glutamatergic Transmission
  description: >-
    Impaired Ca2+ influx reduces tonic glutamate release from photoreceptor
    terminals onto ON- and OFF-bipolar cells, producing the pathognomonic
    electronegative full-field ERG (markedly reduced b-wave relative to a
    relatively preserved a-wave) that defines CACNA1F-related iCSNB.
  cell_types:
  - preferred_term: Retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  biological_processes:
  - preferred_term: Glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: DECREASED
  evidence:
  - reference: PMID:33668843
    reference_title: "Optic Atrophy and Inner Retinal Thinning in CACNA1F-related Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DA standard flash ERG showed an electronegative configuration in 20 of 22 patients (mean (SD) b/a ratio: 0.59 (0.23); range 0.25-1.16)"
    explanation: Quantifies the electronegative ERG (reduced b/a ratio) that reflects defective photoreceptor-to-bipolar-cell signaling.
  - reference: PMID:33513752
    reference_title: "A Novel Splice-Site Variant in CACNA1F Causes a Phenotype Synonymous with Åland Island Eye Disease and Incomplete Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "b-wave was markedly attenuated giving rise to an electronegative waveform in both eyes, characteristically known as Schubert-Bornschein type ERG"
    explanation: Confirms the electronegative Schubert-Bornschein ERG pattern in a molecularly-confirmed CACNA1F case.
  downstream:
  - target: Cone Bipolar Cell Dendritic Sprouting and Cone Pathway Dysfunction
  - target: Inner Retinal Thinning and Optic Nerve Involvement
- name: Cone Bipolar Cell Dendritic Sprouting and Cone Pathway Dysfunction
  description: >-
    In Cav1.4 gain-of-function (I756T) mice, cone photoreceptors retain the
    capacity to release glutamate, but most cone bipolar cells undergo
    dendritic sprouting and ganglion cell responses to photopic stimuli are
    lost in the majority of cells, indicating a postsynaptic cone bipolar
    cell defect downstream of the presynaptic channelopathy. Acute
    calcium-channel blockade did not rescue synaptic transmission deficits.
  cell_types:
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: Cone retinal bipolar cell
    term:
      id: CL:0000752
      label: cone retinal bipolar cell
  evidence:
  - reference: PMID:33526839
    reference_title: "Function of cone and cone-related pathways in Ca(V)1.4 IT mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Though cone photoreceptors underwent morphological rearrangements, they retained their ability to release glutamate. Our functional data suggested a postsynaptic cone bipolar cell defect"
    explanation: Mouse Cav1.4-IT model localizes a component of the cone pathway defect to the postsynaptic bipolar cell rather than presynaptic glutamate release itself.
- name: Inner Retinal Thinning and Optic Nerve Involvement
  description: >-
    Independent of myopia, CACNA1F-retinopathy patients show reduced macular
    ganglion cell layer-inner plexiform layer (GCL-IPL) thickness and optic
    disc pallor with reduced peripapillary retinal nerve fiber layer (RNFL)
    thickness, indicating that higher-order (inner retinal/optic nerve)
    structures are affected beyond the primary photoreceptor synaptic defect.
    This involvement appears to be present from childhood and stable over
    long-term follow-up rather than progressive.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  evidence:
  - reference: PMID:33668843
    reference_title: "Optic Atrophy and Inner Retinal Thinning in CACNA1F-related Congenital Stationary Night Blindness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean GCL-IPL thickness was significantly lower"
    explanation: >-
      Quantifies macular inner retinal (GCL-IPL) thinning independent of
      myopia in molecularly-confirmed CACNA1F-retinopathy (55.00 vs 84.57 um
      in age-matched controls, p << 0.001).
  - reference: PMID:36469668
    reference_title: "Optic nerve involvement in CACNA1F-related disease: observations from a multicentric case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Low average pRNFL thickness was evident in all patients. In three of them, pRNFL thickness was evaluated longitudinally and was proven to be stable over time."
    explanation: Confirms optic nerve fiber layer thinning is present from an early age and stable, not progressive, over long-term follow-up.

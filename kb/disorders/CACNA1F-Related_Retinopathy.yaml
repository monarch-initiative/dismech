- name: Gene Therapy (Preclinical)
  description: >-
    No approved disease-specific therapy exists. Experimental gene-based
    strategies (e.g. beta2 subunit augmentation, in vivo electroporation to
    reintroduce Cav1.4-alpha1) have shown only partial functional recovery in
    animal models; a major translational barrier is that CACNA1F exceeds
    single-AAV packaging capacity, motivating dual-AAV delivery approaches
    not yet ready for clinical translation.

references:
- reference: PMID:19320537
  title: "The alcohol flushing response: an unrecognized risk factor for esophageal cancer from alcohol consumption."
- reference: PMID:39075523
  title: "Uncovering newly identified aldehyde dehydrogenase 2 genetic variants that lead to acetaldehyde accumulation after an alcohol challenge."
external_assertions:
- name: OMIM acute alcohol sensitivity
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:610251
  description: OMIM entry for alcohol sensitivity, acute (ALDH2-related).
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single inactive ALDH2 allele produces the phenotype, because the mutant
    subunit inactivates the tetramers it is incorporated into rather than merely
    contributing nothing. Homozygotes are more severely affected than
    heterozygotes, so the trait is dominant but not fully so at the quantitative
    level - a gene-dosage gradient sits on top of the dominant-negative effect.
  evidence:
  - reference: PMID:8290656
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results support the notion that the mutant allele is dominant and that the heterotetrameric ALDH2 molecules containing the mutant subunits are enzymatically inactive or far less active."
    explanation: >-
      States both the dominance and its structural basis in one sentence.
pathophysiology:
- name: Inactivating ALDH2 Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous or homozygous variant reducing ALDH2 catalytic capacity. The
    dominant allele worldwide is rs671 (p.Glu504Lys, historically written E487K
    in mature-protein numbering); rs747096195 (p.Arg101Gly) and rs190764869
    (p.Arg114Trp) are further variants identified in flushing individuals of
    non-East-Asian descent.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In East Asian descendants, an inactive genetic variant in ALDH2, rs671, triggers an alcohol flushing response due to acetaldehyde accumulation."
    explanation: >-
      Names the canonical variant and the causal chain in one sentence.
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two additional ALDH2 variants in humans causing facial flushing and acetaldehyde accumulation after alcohol consumption."
    explanation: >-
      Establishes that the allelic basis is broader than rs671, which is why
      this node is named for the class of variant rather than for rs671.
  downstream:
  - target: Loss of Tetrameric ALDH2 Catalytic Activity
    causal_link_type: DIRECT
    description: >-
      The variant subunit inactivates the tetramer. The route differs by allele:
      rs671 subunits assemble but the resulting heterotetramers are inactive,
      whereas p.Arg101Gly fails to form functional dimers/tetramers at all and
      p.Arg114Trp reduces Vmax.
    evidence:
    - reference: PMID:8290656
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "None of the subjects with the mutant homozygotic and the heterozygotic genotypes exhibited the ALDH2 activity band or intermediate bands between ALDH2 and ALDH1 on isoelectric focusing gels."
      explanation: >-
        The observation behind the dominant-negative conclusion: heterozygotes
        show no residual activity band, not a half-height one.
    - reference: PMID:39075523
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The effect is caused by a lack of functional dimer/tetramer formation for R101G and decreased Vmax for both R101G and R114W."
      explanation: >-
        Distinguishes the assembly-failure and kinetic routes of the two newer
        variants from the rs671 poisoned-tetramer route.
- name: Loss of Tetrameric ALDH2 Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    The mitochondrial low-Km aldehyde dehydrogenase that oxidises acetaldehyde
    to acetate loses activity. Because ALDH2 is the low-Km enzyme, it is what
    normally keeps circulating acetaldehyde near zero during drinking, and there
    is no redundant activity that substitutes at physiological concentrations.
  molecular_functions:
  - preferred_term: aldehyde dehydrogenase (NAD+) activity
    modifier: DECREASED
    term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
  biological_processes:
  - preferred_term: ethanol catabolic process
    modifier: DECREASED
    term:
      id: GO:0006068
      label: ethanol catabolic process
  - preferred_term: protein homotetramerization
    modifier: DECREASED
    term:
      id: GO:0051289
      label: protein homotetramerization
  evidence:
  - reference: PMID:8290656
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About half of Chinese individuals lack mitochondrial aldehyde dehydrogenase-2 (ALDH2) activity, which is responsible for the oxidation of acetaldehyde produced during ethanol metabolism."
    explanation: >-
      Names the enzyme, its substrate, and the scale of the deficiency in the
      population where it was characterised.
  downstream:
  - target: Acetaldehyde Accumulation After Ethanol Exposure
    causal_link_type: DIRECT
    description: >-
      With the clearing enzyme disabled, acetaldehyde produced from ethanol
      accumulates instead of being oxidised onward to acetate.
    evidence:
    - reference: PMID:39075523
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Humans heterozygous for rs747096195 (R101G) or rs190764869 (R114W) had facial flushing and a 2-fold increase in acetaldehyde levels, while rs671 (E504K) had facial flushing and a 6-fold increase in acetaldehyde levels relative to wild type ALDH2 carriers."
      explanation: >-
        Direct measurement of acetaldehyde after a controlled alcohol challenge,
        quantified per genotype - the strongest single piece of evidence in this
        entry.
- name: Acetaldehyde Accumulation After Ethanol Exposure
  biological_scale: ORGANISM
  description: >-
    Systemic acetaldehyde rises after drinking. This node is the hinge of the
    entry: everything upstream is constitutive genetics, everything downstream
    requires an ethanol exposure to have occurred. A carrier who never drinks
    has the genotype and none of the phenotype.
  chemical_entities:
  - preferred_term: acetaldehyde
    modifier: INCREASED
    term:
      id: CHEBI:15343
      label: acetaldehyde
  evidence:
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human subjects were given an alcohol challenge (0.25 g/kg) while quantifying acetaldehyde levels and the physiological response (heart rate and skin temperature) to alcohol"
    explanation: >-
      Establishes that the accumulation is measured under a defined exposure,
      which is what makes this node exposure-conditioned rather than
      constitutive.
  downstream:
  - target: Flushing
    causal_link_type: DIRECT
    description: >-
      Acetaldehyde is a vasodilator; the cutaneous vasodilation it causes is the
      visible sign the syndrome is named for.
    evidence:
    - reference: PMID:19320537
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This so-called alcohol flushing response (also known as “Asian flush” or “Asian glow”) is predominantly due to an inherited deficiency in the enzyme aldehyde dehydrogenase 2 (ALDH2)"
      explanation: >-
        Attributes the flushing response to ALDH2 deficiency.
  - target: Tachycardia
    causal_link_type: DIRECT
    description: >-
      Part of the acute physiological response, measured as heart rate in the
      alcohol-challenge protocol.
    evidence:
    - reference: PMID:19320537
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "show a characteristic physiological response to drinking alcohol that includes facial flushing (see Figure 1), nausea, and tachycardia"
      explanation: >-
        Names tachycardia as part of the characteristic response.
  - target: Nausea
    causal_link_type: DIRECT
    description: >-
      The third element of the acute triad.
    evidence:
    - reference: PMID:19320537
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "includes facial flushing (see Figure 1), nausea, and tachycardia"
      explanation: >-
        Names nausea as part of the characteristic response.
  - target: Acetaldehyde Genotoxicity and Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      The same accumulated acetaldehyde is a genotoxin, so the acute symptomatic
      arm and the long-term carcinogenic arm share one upstream node.
    evidence:
    - reference: PMID:15840430
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The frequency of micronuclei induced by acetaldehyde increased in a dose-dependent manner with the largest increase seen in subjects that were homozygous for the ALDH2(2) allele."
      explanation: >-
        Dose-dependent chromosomal damage from acetaldehyde, greatest in the
        genotype with least clearance capacity.
- name: Acetaldehyde Genotoxicity and Oxidative Stress
  biological_scale: CELLULAR
  description: >-
    Accumulated acetaldehyde damages DNA - measurable as micronucleus formation
    in lymphocytes - and alcohol metabolism in cells carrying reduced-activity
    ALDH2 variants generates excess reactive oxygen species. This is the
    mechanistic bridge from a transient flushing reaction to a durable cancer
    risk.
  biological_processes:
  - preferred_term: reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  evidence:
  - reference: PMID:15840430
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Alcohol-induced facial flushing was also associated with an increased frequency of micronuclei in lymphocytes treated with acetaldehyde."
    explanation: >-
      Links the clinical sign directly to measured genotoxicity in the same
      subjects.
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the R101G and R114W variants had a 2-3-fold increase in reactive oxygen species formation with respect to wild type ALDH2"
    explanation: >-
      The oxidative-stress arm, measured for the two newer variants.
  downstream:
  - target: Esophageal squamous cell carcinoma risk
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Repeated genotoxic acetaldehyde exposure of the upper aerodigestive
      epithelium over years of drinking raises squamous carcinoma risk. The
      intermediates - mutation accumulation, clonal expansion, dysplasia - are
      the standard carcinogenesis sequence and are curated in the oesophageal
      cancer entries rather than duplicated here.
    evidence:
    - reference: PMID:19320537
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "few are aware of the accumulating evidence that ALDH2-deficient individuals are at much higher risk of esophageal cancer (specifically squamous cell carcinoma) from alcohol consumption than individuals with fully active ALDH2"
      explanation: >-
        States the risk relationship and its specificity to squamous cell
        carcinoma.
    - reference: PMID:24477652
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The drinkers with flushing response also had a higher ESCC risk than those without flushing response."
      explanation: >-
        Independent case-control confirmation using flushing as the exposure
        variable.
phenotypes:
- category: Dermatologic
  name: Flushing
  description: >-
    Cutaneous vasodilation of the face and often the neck and upper chest,
    beginning within minutes of drinking. The visible sign the syndrome is named
    for, and - because most affected people notice it - the basis for
    identifying ALDH2 deficiency by history alone.
  phenotype_term:
    preferred_term: Flushing
    term:
      id: HP:0031284
      label: Flushing
    temporality: ACUTE
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "show a characteristic physiological response to drinking alcohol that includes facial flushing (see Figure 1), nausea, and tachycardia"
    explanation: >-
      Names facial flushing as the leading element of the response.
  - reference: PMID:15840430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant association was observed between the ALDH2 genotype and alcohol-induced facial flushing."
    explanation: >-
      Genotype-phenotype association measured directly rather than assumed.
- category: Cardiovascular
  name: Tachycardia
  description: >-
    Rise in heart rate accompanying the flush, measured as part of the
    physiological response in controlled alcohol-challenge protocols.
  phenotype_term:
    preferred_term: Tachycardia
    term:
      id: HP:0001649
      label: Tachycardia
    temporality: ACUTE
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characteristic physiological response to drinking alcohol that includes facial flushing (see Figure 1), nausea, and tachycardia"
    explanation: >-
      Names tachycardia in the characteristic response.
- category: Gastrointestinal
  name: Nausea
  description: >-
    Nausea after drinking, the third element of the acute triad and part of what
    makes the reaction aversive enough to reduce drinking.
  phenotype_term:
    preferred_term: Nausea
    term:
      id: HP:0002018
      label: Nausea
    temporality: ACUTE
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "facial flushing (see Figure 1), nausea, and tachycardia"
    explanation: >-
      Names nausea in the characteristic response.
- category: Oncologic
  name: Esophageal squamous cell carcinoma risk
  description: >-
    Markedly elevated risk of oesophageal squamous cell carcinoma among
    ALDH2-deficient people who drink. This is a *conditional* risk, not a
    feature of the genotype: a carrier who does not drink does not carry the
    excess risk, which is precisely why the flushing history is actionable. A
    Chinese case-control study also found elevated gastric cardia adenocarcinoma
    risk in flushers, with the striking result that alcohol consumption alone
    showed no significant association while flushing status did.
  phenotype_term:
    preferred_term: Esophageal neoplasm
    term:
      id: HP:0100751
      label: Esophageal neoplasm
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALDH2-deficient individuals are at much higher risk of esophageal cancer (specifically squamous cell carcinoma) from alcohol consumption than individuals with fully active ALDH2"
    explanation: >-
      The central risk claim, with its restriction to squamous cell carcinoma
      and its conditioning on alcohol consumption both stated.
  - reference: PMID:24477652
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the adjusted ORs for flushing response of GCA and ESCC was 2.03 (95% CI 1.15-3.56, p=0.014) and 2.32 (95% CI 1.34-4.03, p=0.003), respectively, compared with those reporting no flushing response"
    explanation: >-
      Quantifies the risk for both oesophageal squamous carcinoma and gastric
      cardia adenocarcinoma using flushing as the exposure variable.
  - reference: PMID:24477652
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no significant association between GCA risk and alcohol consumption."
    explanation: >-
      The negative result that makes the positive one interesting: in this
      cohort the risk tracked flushing status rather than drinking quantity.
- category: Behavioral
  name: Reduced heavy drinking
  description: >-
    Carriers drink less. This is the protective side of the same allele and is
    curated as a phenotype of this disorder rather than only as a genetic
    modifier on the alcohol-use-disorder entry, because it is a direct
    behavioural consequence of the aversive reaction. It is also what makes the
    cancer risk paradoxical - carriers who *do* drink despite the reaction are
    the high-risk group.
  evidence:
  - reference: PMID:15840430
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of heavy drinking was significantly higher among subjects with the ALDH2(1)/ALDH2(1) genotype than among subjects with the ALDH2(2) allele (ALDH2(1)/ALDH2(2) and ALDH2(2)/ALDH2(2) genotypes)."
    explanation: >-
      Measures the behavioural difference by genotype in the same cohort where
      flushing and micronuclei were measured.
  - reference: PMID:8290656
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ALDH2 deficiency in Chinese has been implicated in alcohol flush reaction and reported to be a negative risk factor for development of alcohol dependence."
    explanation: >-
      States the protective relationship with alcohol dependence.
environmental:
- name: Ethanol Ingestion
  description: >-
    Drinking ethanol is a necessary condition for every symptomatic feature of
    this disorder. The entry is named for a *sensitivity*, so the exposure is
    not a risk factor sitting alongside the genotype - it is the other half of
    the cause. The exposure term is bound to the chemical rather than the
    drinking-behaviour term because the mechanism curated here is ethanol
    chemistry: oxidation to acetaldehyde and failure of its clearance.
  exposure_term:
    preferred_term: exposure to ethanol
    term:
      id: ECTO:9000027
      label: exposure to ethanol
  influences_mechanisms:
  - target: Acetaldehyde Accumulation After Ethanol Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ethanol is the substrate whose oxidation produces the acetaldehyde that
      cannot be cleared. Without the exposure there is no accumulation and no
      phenotype.
    evidence:
    - reference: PMID:39075523
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Aldehyde dehydrogenase 2 (ALDH2) is critical for alcohol metabolism by converting acetaldehyde to acetic acid."
      explanation: >-
        Places ethanol metabolism upstream of the acetaldehyde step this
        exposure triggers.
  evidence:
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human subjects were given an alcohol challenge (0.25 g/kg) while quantifying acetaldehyde levels and the physiological response (heart rate and skin temperature) to alcohol"
    explanation: >-
      A controlled, dosed ethanol exposure producing the measured response -
      the exposure itself, evidenced.
genetic:
- name: ALDH2
  features: >-
    Mitochondrial low-Km aldehyde dehydrogenase 2. rs671 (p.Glu504Lys) is the
    common inactivating allele, carried by an estimated 540 million people
    worldwide - about 8% of the global population and roughly 36% of East
    Asians. rs747096195 (p.Arg101Gly) and rs190764869 (p.Arg114Trp) are rarer
    variants producing the same flushing phenotype in non-East-Asian
    individuals, so ancestry is not a reliable screen. Note the numbering: rs671
    is written p.Glu504Lys against the precursor and E487K against the mature
    protein; both refer to the same substitution.
  gene_term:
    preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we estimate that there are at least 540 million ALDH2-deficient individuals in the world, representing approximately 8% of the population"
    explanation: >-
      The population scale of the deficient genotype.
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As alcohol flushing is not exclusive to those of East Asian descent, we questioned whether additional ALDH2 genetic variants can drive facial flushing and inefficient acetaldehyde metabolism using human testing and biochemical assays."
    explanation: >-
      The premise that led to the two additional variants, and the reason
      ancestry cannot be used to rule the diagnosis out.
prevalence:
- population: East Asian (Japanese, Chinese, Korean)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 36000.0
  notes: >-
    Approximately 36% of East Asians show the alcohol flushing response. Entered
    as 36,000 per 100,000. This is the prevalence of the flushing *response* in
    that population, which the source attributes predominantly - not
    exclusively - to ALDH2 deficiency.
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 36% of East Asians (Japanese, Chinese, and Koreans) show a characteristic physiological response to drinking alcohol that includes facial flushing"
    explanation: >-
      The population figure, with the ancestry group it applies to.
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 8000.0
  notes: >-
    An estimated 540 million ALDH2-deficient individuals globally, about 8% of
    the world population - entered as 8,000 per 100,000. This is the authors'
    extrapolation from East Asian population sizes and expected genotype
    frequencies, not a direct worldwide measurement, and it predates the
    identification of the non-East-Asian variants, so it is likely an
    underestimate of ALDH2-related flushing overall.
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we estimate that there are at least 540 million ALDH2-deficient individuals in the world, representing approximately 8% of the population"
    explanation: >-
      The worldwide figure. The surrounding sentence, which cannot be quoted
      here because it contains an inline citation marker that snippet matching
      strips, states the derivation: it is extrapolated from Japanese, Chinese
      and Korean population sizes and expected genotype frequencies - the basis
      for the caveat in this record's note.
- population: Chinese subjects sampled by gastroendoscopic biopsy
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    Of 30 subjects, 16 were ALDH2*1 homozygotes, 13 heterozygotes and 1 an
    ALDH2*2 homozygote - 14 of 30 carrying at least one inactive allele. A very
    small convenience sample from a mechanistic study, recorded because it is
    the cohort in which the dominant-negative biochemistry was demonstrated,
    not as a population estimate.
  evidence:
  - reference: PMID:8290656
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen subjects were homozygous for the ALDH2(1) allele, one was homozygous for ALDH2(2), and thirteen were the heterozygous genotype."
    explanation: >-
      The genotype breakdown of the cohort behind the mechanism claim.
diagnosis:
- name: Flushing history
  description: >-
    Asking whether alcohol has previously caused facial flushing identifies
    ALDH2 deficiency without a laboratory test, because the reaction is
    intense enough that affected people are aware of it. The authors of the
    landmark paper propose this explicitly as a clinical screening question and
    the basis for counselling and, in high-risk patients, endoscopic screening.
  diagnosis_term:
    preferred_term: medical history taking
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore clinicians can determine ALDH2 deficiency simply by asking about previous episodes of alcohol-induced flushing."
    explanation: >-
      The screening recommendation, stated as a method.
  - reference: PMID:24477652
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, alcohol flushing response is a clinically useful biomarker of susceptibility to GCA and ESCC risk from alcohol."
    explanation: >-
      Independent endorsement of flushing history as a risk biomarker.
  - reference: PMID:19320537
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALDH2-deficient patients can then be counseled to reduce alcohol consumption, and high-risk patients can be assessed for endoscopic cancer screening"
    explanation: >-
      The actionable consequence of a positive flushing history - what the
      screening question is *for*.
- name: ALDH2 genotyping
  description: >-
    Molecular testing for rs671 and, where the history suggests flushing in a
    non-East-Asian individual, wider ALDH2 sequencing - since two further
    flushing-causing variants have been described that an rs671-only assay
    would miss.
  diagnosis_term:
    preferred_term: molecular genetic analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:8290656
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "determined the genotypes from leukocytes of the same individuals by using polymerase-chain-reaction amplification and hybridization with allele-specific oligonucleotide probes"
    explanation: >-
      Describes the genotyping approach in the study that paired genotype with
      enzyme phenotype.
  - reference: PMID:39075523
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the methodology developed here to characterize ALDH2 genetic variant response to alcohol can lead the way precision medicine strategies to further understand the interplay of alcohol consumption, ALDH2 genetics, and cancer"
    explanation: >-
      The authors' framing of genotype-guided assessment, which is the rationale
      for testing beyond rs671.
differential_diagnoses:
- name: Alcohol Use Disorder
  description: >-
    Not a diagnostic confusion so much as the mechanistic mirror image, and the
    reason this entry matters to the rest of the knowledge base. The same
    inactive ALDH2 allele that *causes* acute alcohol sensitivity is one of the
    two largest-effect *protective* loci against alcohol use disorder, because
    the reaction is aversive. `Alcohol_Use_Disorder` already curates ALDH2 in
    that protective role; this entry curates the disorder that produces the
    aversion.
  disease_term:
    preferred_term: alcohol use disorder
    term:
      id: MONDO:0007079
      label: alcohol dependence
  distinguishing_features:
  - Opposite direction of the same allele - carriers are less likely, not more likely, to develop dependence.
  - Acute alcohol sensitivity is an exposure-triggered metabolic reaction with an onset in minutes; alcohol use disorder is a chronic behavioural condition.
  - A carrier who abstains has neither condition; a carrier who drinks despite the reaction carries elevated cancer risk without necessarily meeting dependence criteria.
  evidence:
  - reference: PMID:8290656
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reported to be a negative risk factor for development of alcohol dependence"
    explanation: >-
      States the protective direction explicitly.
- name: Disulfiram-ethanol reaction
  description: >-
    A pharmacologically identical syndrome produced on purpose. Disulfiram
    inhibits ALDH2, so a patient taking it who drinks develops flushing, nausea
    and tachycardia by the same acetaldehyde-accumulation mechanism curated
    here. Cyanamide is another ALDH inhibitor used the same way. The
    distinguishing feature is drug exposure, not phenotype - which is a useful
    reminder that the mechanism, not the genotype, produces the syndrome.
  distinguishing_features:
  - Acquired and reversible on stopping the drug, rather than lifelong.
  - No family history; onset coincides with starting an ALDH-inhibiting drug.
  - Genotyping is normal at ALDH2 unless the patient also carries an inactivating variant, in which case the reaction is more severe.
  evidence:
  - reference: PMID:39075523
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Aldehyde dehydrogenase 2 (ALDH2) is critical for alcohol metabolism by converting acetaldehyde to acetic acid."
    explanation: >-
      Supports the shared enzymatic step that a pharmacological ALDH2 inhibitor
      blocks. Graded PARTIAL because this entry holds no source characterising
      the disulfiram reaction itself; that claim rests on the shared mechanism,
      and a curator adding disulfiram detail should cite a source for it.
discussions:
- discussion_id: aldh2_scope_susceptibility_or_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is acute alcohol sensitivity a disease entry, or a susceptibility annotation
    that belongs on the alcohol-related entries rather than standing alone?
  attaches_to:
  - "pathophysiology#Acetaldehyde Accumulation After Ethanol Exposure"
  rationale: >-
    MONDO flags MONDO:0012454 `subset: omim_susceptibility`, and the honest
    reading is that this concept sits on the boundary of what dismech curates as
    a Disease. The case for curating it is that it has a defined
    post-exposure phenotype with an onset in minutes, a measurable biochemical
    marker (blood acetaldehyde, six-fold elevated in rs671 heterozygotes under
    challenge), an OMIM entity, a causal gene with a demonstrated
    dominant-negative mechanism, and an actionable clinical consequence - the
    same footing as the existing Dihydropyrimidine_Dehydrogenase_Deficiency
    entry, which is likewise a pharmacogenomic/metabolic sensitivity. The case
    against is that its manifestations only exist under an elective exposure,
    which makes it look more like a trait than a disease. This entry takes the
    first position and records the second, rather than making the choice
    silently. If dismech later adopts a general policy on exposure-conditioned
    metabolic sensitivities, this entry should be revisited under it.
- discussion_id: aldh2_ancestry_framing_is_outdated
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of ALDH2-related alcohol sensitivity outside East Asian
    populations is missed because both the clinical framing and the standard
    genetic test are built around rs671?
  attaches_to:
  - "pathophysiology#Inactivating ALDH2 Variant"
  rationale: >-
    The disorder is described almost everywhere - including in MONDO's own
    definition, which says it is "usually found in Asians" - as an East Asian
    condition caused by rs671. A 2024 alcohol-challenge study found two further
    ALDH2 variants, rs747096195 and rs190764869, in flushing individuals who
    were not of East Asian descent, each roughly doubling acetaldehyde by
    mechanisms distinct from rs671's. An rs671-only assay returns normal for
    those people, and an ancestry-based clinical heuristic never prompts the
    test. Since the flushing history is the recommended screening question for
    a markedly elevated oesophageal cancer risk, a systematic blind spot here
    has a downstream consequence. What is not known is the population frequency
    of these and other ALDH2 variants outside East Asia, or what fraction of
    non-East-Asian flushers they explain.
  proposed_experiments:
  - experiment_id: aldh2_full_gene_sequencing_in_non_east_asian_flushers
    name: Full ALDH2 sequencing in ancestry-diverse self-reported flushers
    description: >-
      Recruit self-reported alcohol flushers across ancestries, sequence the
      full ALDH2 coding region rather than genotyping rs671 alone, and pair each
      genotype with a standardised alcohol challenge measuring acetaldehyde,
      heart rate and skin temperature - the protocol that identified the two
      known additional variants.
    readouts:
    - name: Blood acetaldehyde after standardised alcohol challenge, by genotype
      target: Acetaldehyde Accumulation After Ethanol Exposure
      direction: INCREASED
      interpretation: >-
        Elevated acetaldehyde in rs671-negative flushers would quantify how much
        of the phenotype an rs671-only test misses.
notes: >-
  Scope decision, stated up front. MONDO marks MONDO:0012454 `subset:
  omim_susceptibility`, so the first question this entry had to answer was
  whether it should exist as a Disease rather than as a susceptibility
  annotation on the alcohol-related entries. It is curated as a Disease on the
  same grounds as the existing Dihydropyrimidine_Dehydrogenase_Deficiency entry:
  a defined post-exposure phenotype, a measurable biochemical marker, an OMIM
  entity, a causal gene with a demonstrated mechanism, and an actionable
  clinical consequence. The counter-argument - that its manifestations exist
  only under an elective exposure - is recorded as an open discussion rather
  than dismissed.

  Why this entry earns its place in the knowledge base. Two consequences of the
  inactive ALDH2 allele were already curated without the disorder that produces
  them: `Alcohol_Use_Disorder` names ALDH2 as one of two large-effect
  *protective* loci, and the oesophageal cancer entries name it as a *risk*
  factor. Both point at acetaldehyde accumulation, which had no entry of its
  own. The `Reduced heavy drinking` phenotype and the Alcohol Use Disorder
  differential are the deliberate joins.

  Residue numbering. rs671 is written **p.Glu504Lys** against the precursor
  protein and **E487K** against the mature protein after cleavage of the
  mitochondrial targeting sequence; both name the same substitution. This entry
  uses the 504 numbering throughout, matching dbSNP, MONDO and the 2024 paper.
  Older literature using E487K is describing the same allele, not a second one -
  worth stating, because a mismatched-numbering pair is exactly the kind of
  thing that gets curated twice.

  Ontology binding rationale for the exposure. Per the project's ECTO guidance,
  the choice between `ECTO:0001082` (exposure to alcohol consumption, a
  behaviour term) and `ECTO:9000027` (exposure to ethanol, anchored on
  CHEBI:16236) follows what the entry's own name and mechanism state. This
  entry's mechanism is ethanol chemistry - oxidation to acetaldehyde and failure
  of its clearance - not a drinking-behaviour claim, so the environmental entry
  is named `Ethanol Ingestion` and bound to the chemical term. `ECTO:9000027`
  was verified against the local `sqlite:obo:ecto` build that
  `conf/oak_config.yaml` actually uses for validation, not against OLS.

  Cell-type term caution carried forward from this curation batch: a plain OAK
  lookup returns real terms that are wrong for the intended sense often enough
  that every identifier here was resolved by label before use.

  Deep-research report: read, cross-checked, and mostly not used. `just
  preflight-dr` returned PASS (ALDH2 mentioned 126 times; report OMIM 610251
  matching the MONDO xref), but the report's own `reference_validation` block
  reports **quotes_valid: 2 of quotes_checked: 5** - three quotes attributed to
  sources that do not contain them (PMC:PMC9844601, PMID:9419411,
  DOI:10.1073/pnas.1510757112). None of those three is cited by this entry, and
  every snippet here was taken from an abstract read directly before the report
  was generated, so no report-sourced quote entered the KB. But a 3-in-5
  unsupported-quote rate is a stronger warning than a confabulation_rate of 0.0
  suggests, and it is the reason the leads below were each re-checked against
  PubMed independently rather than curated on the report's word.

  Leads from that report NOT curated, for want of a citable source:
  - *Antihistamine and H2-blocker masking of the flush.* The report argues that
    blunting the aversive symptom while continuing to drink raises silent
    acetaldehyde exposure and therefore cancer risk. This is plausible and
    clinically important, and it would fit the pattern of curating a harm
    rather than only a benefit - but a targeted PubMed search returned only two
    papers from 1980 and 1982, neither stating it. Not asserted here. A curator
    who finds a modern source should add it as a treatment entry with
    `supports: REFUTE` or a harm framing.
  - *ALDH2 activators (Alda-1, AD-9308).* Investigational, and by the report's
    own account "not yet as an approved therapy for the flush reaction itself".
    Out of scope for a treatments block that would otherwise be empty.
  - *Amplified reaction with disulfiram, metronidazole, cephalosporins and
    sulfonylureas.* Only the disulfiram arm is represented here, as a
    differential diagnosis, and even that is graded PARTIAL on the shared
    enzymatic step. The metronidazole/cephalosporin/sulfonylurea claims were
    not verified.
  - *Lugol chromoendoscopy surveillance in Japan.* Searching returned related
    papers on Lugol-voiding lesions and field cancerization (e.g.
    PMID:12376487, PMID:23667679) but none establishing the surveillance
    recommendation in the form the report states it. The endoscopic-screening
    point that IS curated comes from Brooks and colleagues' own sentence.

  Not curated, and why. No `treatments` block: there is no therapy for this
  disorder, and the intervention that matters - not drinking, or drinking less -
  is the avoidance of the trigger rather than a treatment of the condition. It
  is represented instead by the `Ethanol Ingestion` environmental entry and by
  the `Flushing history` diagnosis entry, which carries the counselling and
  endoscopic-screening rationale. Curating "alcohol avoidance" as a Treatment
  would assert a clinical recommendation with a shape the sources do not have.

  The disulfiram-ethanol reaction is curated as a differential on the strength
  of the shared enzymatic step only; the evidence item is graded PARTIAL and
  says so. A curator adding disulfiram detail should cite a source describing
  that reaction directly rather than inheriting this one.

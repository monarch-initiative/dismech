    underestimate of ALDH2-related flushing overall.
  evidence:
  - reference: PMID:19320537
    reference_title: "The alcohol flushing response: an unrecognized risk factor for esophageal cancer from alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we estimate that there are at least 540 million ALDH2-deficient individuals in the world, representing approximately 8% of the population"
    explanation: >-
      The worldwide figure. The surrounding sentence, which cannot be quoted
      here because it contains an inline citation marker that snippet matching
      strips, states the derivation: it is extrapolated from Japanese, Chinese
      and Korean population sizes and expected genotype frequencies - the basis
      for the caveat in this record's note.
- population: Chinese subjects sampled by gastroendoscopic biopsy
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    Of 30 subjects, 16 were ALDH2*1 homozygotes, 13 heterozygotes and 1 an
    ALDH2*2 homozygote - 14 of 30 carrying at least one inactive allele. A very
    small convenience sample from a mechanistic study, recorded because it is
    the cohort in which the dominant-negative biochemistry was demonstrated,
    not as a population estimate.
  evidence:
  - reference: PMID:8290656
    reference_title: "Dominance of the mutant ALDH2(2) allele in the expression of human stomach aldehyde dehydrogenase-2 activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen subjects were homozygous for the ALDH2(1) allele, one was homozygous for ALDH2(2), and thirteen were the heterozygous genotype."
    explanation: >-
      The genotype breakdown of the cohort behind the mechanism claim.
diagnosis:
- name: Flushing history
  description: >-
    Asking whether alcohol has previously caused facial flushing identifies
    ALDH2 deficiency without a laboratory test, because the reaction is
    intense enough that affected people are aware of it. The authors of the
    landmark paper propose this explicitly as a clinical screening question and
    the basis for counselling and, in high-risk patients, endoscopic screening.

    Its performance is good but population-dependent, and the dependence runs
    the wrong way for the people most at risk. In male clinic patients aged 50
    and over, a validated flushing questionnaire had 96.1% sensitivity and
    79.0% specificity for inactive ALDH2 - better on both counts than the
    ethanol patch test (72.4% / 71.4%), which is worth stating because the
    patch test is sometimes proposed as the more objective alternative. But in
    472 Japanese *alcohol-dependent women*, sensitivity fell to 50.0%, against
    88% previously reported in the Japanese general female population. The
    authors' inference is the mechanistically interesting one: a *lack* of
    flushing may itself be what allows a woman with inactive ALDH2 to become
    alcohol-dependent, so the screen fails selectively in exactly the group
    whose drinking puts them at highest oesophageal-cancer risk. A negative
    flushing history in a heavy drinker should not be taken to exclude ALDH2
    deficiency; genotyping should be.
  diagnosis_term:
    preferred_term: medical history taking
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:9419411
    reference_title: "Reliability of a flushing questionnaire and the ethanol patch test in screening for inactive aldehyde dehydrogenase-2 and alcohol-related cancer risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When all three categories of flushing (current always, former always, and sometimes) were collapsed into one, the questionnaire's sensitivity and specificity for identifying inactive ALDH2 were 96.1 and 79.0%, respectively, compared with 72.4 and 71.4% for the ethanol patch test."
    explanation: >-
      Quantifies the questionnaire and shows it outperforms the ethanol patch
      test on both sensitivity and specificity.
  - reference: PMID:30629674
    reference_title: "Endoscopic screening using esophageal iodine staining and genotypes of ADH1B and ALDH2 in Japanese alcohol-dependent women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the sensitivity and specificity of current or former flushing to identify the presence of inactive ALDH2 were 50.0% and 93.5%, respectively; these values were previously reported to be 88% and 92%, respectively, in a Japanese general female population"
    explanation: >-
      The failure mode. Graded PARTIAL because it qualifies the screening
      recommendation rather than supporting it: sensitivity halves in
      alcohol-dependent women.
  - reference: PMID:30629674
    reference_title: "Endoscopic screening using esophageal iodine staining and genotypes of ADH1B and ALDH2 in Japanese alcohol-dependent women."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The low sensitivity in the present study suggests that a lack of alcohol flushing may play a crucial role in the development of alcohol dependence in women with inactive ALDH2."
    explanation: >-
      The authors' interpretation, which explains why the failure is selective
      rather than random - and connects it to the Reduced heavy drinking
      phenotype curated above.
  - reference: PMID:34310648
    reference_title: "Combinations of alcohol-induced flushing with genetic polymorphisms of alcohol and aldehyde dehydrogenases and the risk of alcohol dependence in Japanese men and women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The temporal profiles for drinking and flushing in former-flushing AD subjects revealed that the flushing response disappeared soon after or before the start of habitual drinking during young adulthood, regardless of the ALDH2 genotype."
    explanation: >-
      Independent evidence that the flushing history can go negative over time
      in the drinkers who matter most, which is the mechanism behind the low
      sensitivity above.
  - reference: PMID:29707772
    reference_title: "Association of low-activity ALDH2 and alcohol consumption with risk of esophageal cancer in Chinese adults: A population-based cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Self-reported flushing response had low sensitivity (56.8%) and high specificity (88.4%) in identifying rs671 A allele among male weekly alcohol consumers."
    explanation: >-
      A third measurement, in a third population, completing a consistent
      pattern rather than adding a fourth number: 96.1% in general male clinic
      patients, 56.8% in male weekly drinkers, 50.0% in alcohol-dependent
      women. Sensitivity degrades as drinking increases - so the screening
      question is least reliable precisely where the cancer risk is
      concentrated. Graded PARTIAL for the same reason as the other limit
      items.

  - reference: PMID:19320537
    reference_title: "The alcohol flushing response: an unrecognized risk factor for esophageal cancer from alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore clinicians can determine ALDH2 deficiency simply by asking about previous episodes of alcohol-induced flushing."
    explanation: >-
      The screening recommendation, stated as a method.
  - reference: PMID:24477652
    reference_title: "Association between gastric cardia adenocarcinoma risk and alcohol flushing response, but not alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, alcohol flushing response is a clinically useful biomarker of susceptibility to GCA and ESCC risk from alcohol."
    explanation: >-
      Independent endorsement of flushing history as a risk biomarker.
  - reference: PMID:19320537
    reference_title: "The alcohol flushing response: an unrecognized risk factor for esophageal cancer from alcohol consumption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALDH2-deficient patients can then be counseled to reduce alcohol consumption, and high-risk patients can be assessed for endoscopic cancer screening"
    explanation: >-
      The actionable consequence of a positive flushing history - what the
      screening question is *for*.
- name: Endoscopic screening with esophageal iodine staining
  description: >-
    Lugol chromoendoscopy detects distinct iodine-unstained lesions (DIULs) in
    the oesophageal squamous mucosa - a marker of field cancerization, and in
    one Japanese series of 472 alcohol-dependent women, lesions that proved on
    histology to be low-grade intraepithelial neoplasia in 26 patients and
    superficial squamous cell carcinoma in 9. This is the secondary-prevention
    step that the flushing history and genotype are used to select for.
  diagnosis_term:
    preferred_term: esophageal iodine staining chromoendoscopy
    term:
      id: NCIT:C16546
      label: Endoscopic Procedure
  evidence:
  - reference: PMID:30629674
    reference_title: "Endoscopic screening using esophageal iodine staining and genotypes of ADH1B and ALDH2 in Japanese alcohol-dependent women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we investigated the results of screening using esophageal iodine staining and the identification of determinants for esophageal DIULs in 472 Japanese alcohol-dependent women"
    explanation: >-
      Documents iodine-staining endoscopic screening applied to an
      ALDH2-relevant at-risk population.
  - reference: PMID:30629674
    reference_title: "Endoscopic screening using esophageal iodine staining and genotypes of ADH1B and ALDH2 in Japanese alcohol-dependent women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DIULs ≥5 mm were histologically diagnosed as low-grade intraepithelial neoplasia in 26 patients and superficial squamous cell carcinoma in 9 patients."
    explanation: >-
      Shows the screen detects real neoplasia rather than an incidental
      staining artefact, which is what makes it worth performing.
  - reference: PMID:30629674
    reference_title: "Endoscopic screening using esophageal iodine staining and genotypes of ADH1B and ALDH2 in Japanese alcohol-dependent women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of large or multiple esophageal distinct iodine-unstained lesions (DIULs) is a strong predictor of field cancerization in the upper aerodigestive tract."
    explanation: >-
      States what the finding means - field cancerization, not a single lesion.
- name: ALDH2 genotyping
  description: >-
    Molecular testing for rs671 and, where the history suggests flushing in a
    non-East-Asian individual, wider ALDH2 sequencing - since two further
    flushing-causing variants have been described that an rs671-only assay
    would miss.
  diagnosis_term:
    preferred_term: molecular genetic analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:8290656
    reference_title: "Dominance of the mutant ALDH2(2) allele in the expression of human stomach aldehyde dehydrogenase-2 activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "determined the genotypes from leukocytes of the same individuals by using polymerase-chain-reaction amplification and hybridization with allele-specific oligonucleotide probes"
    explanation: >-
      Describes the genotyping approach in the study that paired genotype with
      enzyme phenotype.
  - reference: PMID:39075523
    reference_title: "Uncovering newly identified aldehyde dehydrogenase 2 genetic variants that lead to acetaldehyde accumulation after an alcohol challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the methodology developed here to characterize ALDH2 genetic variant response to alcohol can lead the way precision medicine strategies to further understand the interplay of alcohol consumption, ALDH2 genetics, and cancer"
    explanation: >-
      The authors' framing of genotype-guided assessment, which is the rationale
      for testing beyond rs671.
animal_models:
- name: Aldh2 knockout mouse
  species: Mouse
  genotype: Aldh2 -/- (homozygous knockout); Aldh2 +/+ wild-type comparator
  publication: PMID:19874182
  description: >-
    The standard rodent model of human ALDH2 inactivity. Note the allelic
    mismatch: this is a null, whereas the common human allele rs671 is a
    dominant-negative missense subunit that assembles into tetramers. The null
    reproduces the *consequence* (no ALDH2 activity, acetaldehyde
    accumulation) without reproducing the *mechanism* by which a single human
    allele achieves it. The source is a review of published Aldh2-knockout
    studies rather than a single primary experiment.
  modeled_mechanisms:
  - target: Acetaldehyde Accumulation After Ethanol Exposure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockout mice exposed to ethanol or acetaldehyde show higher blood
      acetaldehyde and greater toxicity than wild-type, which is the defining
      biochemical feature of the human disorder.
    limitations: >-
      A null allele models homozygous ALDH2 inactivity, not the heterozygous
      dominant-negative state that most affected humans carry; the human
      phenotype's hallmark - that one poisoned subunit disables the tetramer -
      cannot be represented by an absent protein. The cited source is also a
      review rather than primary data.
    readouts:
    - name: Blood acetaldehyde after ethanol or acetaldehyde exposure
      target: Acetaldehyde Accumulation After Ethanol Exposure
      direction: INCREASED
      interpretation: >-
        Higher blood acetaldehyde in knockouts than wild-type reproduces the
        human biochemical phenotype.
      evidence:
      - reference: PMID:19874182
        reference_title: "Characteristics of aldehyde dehydrogenase 2 (Aldh2) knockout mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "When they were exposed to atmospheres containing acetaldehyde, the Aldh2 -/- mice showed more severe toxic symptoms, like weight loss and higher blood acetaldehyde levels, as compared with the Aldh2 +/+ mice."
        explanation: >-
          The measurement, with the wild-type comparator stated.
    evidence:
    - reference: PMID:19874182
      reference_title: "Characteristics of aldehyde dehydrogenase 2 (Aldh2) knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Aldh2 knockout mice appear to be a valid animal model for humans with inactive ALDH2"
      explanation: >-
        The authors' own claim that the model is valid for human ALDH2
        inactivity, which is what justifies curating this link.
differential_diagnoses:
- name: Alcohol Use Disorder
  description: >-
    Not a diagnostic confusion so much as the mechanistic mirror image, and the
    reason this entry matters to the rest of the knowledge base. The same
    inactive ALDH2 allele that *causes* acute alcohol sensitivity is one of the
    two largest-effect *protective* loci against alcohol use disorder, because
    the reaction is aversive. `Alcohol_Use_Disorder` already curates ALDH2 in
    that protective role; this entry curates the disorder that produces the
    aversion.
  disease_term:
    preferred_term: alcohol use disorder
    term:
      id: MONDO:0007079
      label: alcohol dependence
  distinguishing_features:
  - Opposite direction of the same allele - carriers are less likely, not more likely, to develop dependence.
  - Acute alcohol sensitivity is an exposure-triggered metabolic reaction with an onset in minutes; alcohol use disorder is a chronic behavioural condition.
  - A carrier who abstains has neither condition; a carrier who drinks despite the reaction carries elevated cancer risk without necessarily meeting dependence criteria.
  evidence:
  - reference: PMID:8290656
    reference_title: "Dominance of the mutant ALDH2(2) allele in the expression of human stomach aldehyde dehydrogenase-2 activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reported to be a negative risk factor for development of alcohol dependence"
    explanation: >-
      States the protective direction explicitly.
- name: Disulfiram-ethanol reaction
  description: >-
    A pharmacologically identical syndrome produced on purpose. Disulfiram
    inhibits ALDH2, so a patient taking it who drinks develops flushing, nausea
    and tachycardia by the same acetaldehyde-accumulation mechanism curated
    here. Cyanamide is another ALDH inhibitor used the same way. The
    distinguishing feature is drug exposure, not phenotype - which is a useful
    reminder that the mechanism, not the genotype, produces the syndrome.
  distinguishing_features:
  - Acquired and reversible on stopping the drug, rather than lifelong.
  - No family history; onset coincides with starting an ALDH-inhibiting drug.
  - Genotyping is normal at ALDH2 unless the patient also carries an inactivating variant, in which case the reaction is more severe.
  evidence:
  - reference: PMID:39075523
    reference_title: "Uncovering newly identified aldehyde dehydrogenase 2 genetic variants that lead to acetaldehyde accumulation after an alcohol challenge."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Aldehyde dehydrogenase 2 (ALDH2) is critical for alcohol metabolism by converting acetaldehyde to acetic acid."
    explanation: >-
      Supports the shared enzymatic step that a pharmacological ALDH2 inhibitor
      blocks. Graded PARTIAL because this entry holds no source characterising
      the disulfiram reaction itself; that claim rests on the shared mechanism,
      and a curator adding disulfiram detail should cite a source for it.
discussions:
- discussion_id: aldh2_scope_susceptibility_or_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is acute alcohol sensitivity a disease entry, or a susceptibility annotation
    that belongs on the alcohol-related entries rather than standing alone?
  attaches_to:
  - "pathophysiology#Acetaldehyde Accumulation After Ethanol Exposure"
  rationale: >-
    MONDO flags MONDO:0012454 `subset: omim_susceptibility`, and the honest
    reading is that this concept sits on the boundary of what dismech curates as
    a Disease. The case for curating it is that it has a defined
    post-exposure phenotype with an onset in minutes, a measurable biochemical
    marker (blood acetaldehyde, six-fold elevated in rs671 heterozygotes under
    challenge), an OMIM entity, a causal gene with a demonstrated
    dominant-negative mechanism, and an actionable clinical consequence - the
    same footing as the existing Dihydropyrimidine_Dehydrogenase_Deficiency
    entry, which is likewise a pharmacogenomic/metabolic sensitivity. The case
    against is that its manifestations only exist under an elective exposure,
    which makes it look more like a trait than a disease. This entry takes the
    first position and records the second, rather than making the choice
    silently. If dismech later adopts a general policy on exposure-conditioned
    metabolic sensitivities, this entry should be revisited under it.
- discussion_id: aldh2_ancestry_framing_is_outdated
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of ALDH2-related alcohol sensitivity outside East Asian
    populations is missed because both the clinical framing and the standard
    genetic test are built around rs671?
  attaches_to:
  - "pathophysiology#Inactivating ALDH2 Variant"
  rationale: >-
    The disorder is described almost everywhere - including in MONDO's own
    definition, which says it is "usually found in Asians" - as an East Asian
    condition caused by rs671. A 2024 alcohol-challenge study found two further
    ALDH2 variants, rs747096195 and rs190764869, in flushing individuals who
    were not of East Asian descent, each roughly doubling acetaldehyde by
    mechanisms distinct from rs671's. An rs671-only assay returns normal for
    those people, and an ancestry-based clinical heuristic never prompts the
    test. Since the flushing history is the recommended screening question for
    a markedly elevated oesophageal cancer risk, a systematic blind spot here
    has a downstream consequence. What is not known is the population frequency
    of these and other ALDH2 variants outside East Asia, or what fraction of
    non-East-Asian flushers they explain.
  proposed_experiments:
  - experiment_id: aldh2_full_gene_sequencing_in_non_east_asian_flushers
    name: Full ALDH2 sequencing in ancestry-diverse self-reported flushers
    description: >-
      Recruit self-reported alcohol flushers across ancestries, sequence the
      full ALDH2 coding region rather than genotyping rs671 alone, and pair each
      genotype with a standardised alcohol challenge measuring acetaldehyde,
      heart rate and skin temperature - the protocol that identified the two
      known additional variants.
    readouts:
    - name: Blood acetaldehyde after standardised alcohol challenge, by genotype
      target: Acetaldehyde Accumulation After Ethanol Exposure
      direction: INCREASED
      interpretation: >-
        Elevated acetaldehyde in rs671-negative flushers would quantify how much
        of the phenotype an rs671-only test misses.
notes: >-
  Scope decision, stated up front. MONDO marks MONDO:0012454 `subset:
  omim_susceptibility`, so the first question this entry had to answer was
  whether it should exist as a Disease rather than as a susceptibility
  annotation on the alcohol-related entries. It is curated as a Disease on the
  same grounds as the existing Dihydropyrimidine_Dehydrogenase_Deficiency entry:
  a defined post-exposure phenotype, a measurable biochemical marker, an OMIM
  entity, a causal gene with a demonstrated mechanism, and an actionable
  clinical consequence. The counter-argument - that its manifestations exist
  only under an elective exposure - is recorded as an open discussion rather
  than dismissed.

  Why this entry earns its place in the knowledge base. Two consequences of the
  inactive ALDH2 allele were already curated without the disorder that produces
  them: `Alcohol_Use_Disorder` names ALDH2 as one of two large-effect
  *protective* loci, and the oesophageal cancer entries name it as a *risk*
  factor. Both point at acetaldehyde accumulation, which had no entry of its
  own. The `Reduced heavy drinking` phenotype and the Alcohol Use Disorder
  differential are the deliberate joins.

  Residue numbering. rs671 is written **p.Glu504Lys** against the precursor
  protein and **E487K** against the mature protein after cleavage of the
  mitochondrial targeting sequence; both name the same substitution. This entry
  uses the 504 numbering throughout, matching dbSNP, MONDO and the 2024 paper.
  Older literature using E487K is describing the same allele, not a second one -
  worth stating, because a mismatched-numbering pair is exactly the kind of
  thing that gets curated twice.

  Ontology binding rationale for the exposure. Per the project's ECTO guidance,
  the choice between `ECTO:0001082` (exposure to alcohol consumption, a
  behaviour term) and `ECTO:9000027` (exposure to ethanol, anchored on
  CHEBI:16236) follows what the entry's own name and mechanism state. This
  entry's mechanism is ethanol chemistry - oxidation to acetaldehyde and failure
  of its clearance - not a drinking-behaviour claim, so the environmental entry
  is named `Ethanol Ingestion` and bound to the chemical term. `ECTO:9000027`
  was verified against the local `sqlite:obo:ecto` build that
  `conf/oak_config.yaml` actually uses for validation, not against OLS.

  Cell-type term caution carried forward from this curation batch: a plain OAK
  lookup returns real terms that are wrong for the intended sense often enough
  that every identifier here was resolved by label before use.

  Deep-research report: read, cross-checked, and mostly not used. `just
  preflight-dr` returned PASS (ALDH2 mentioned 126 times; report OMIM 610251
  matching the MONDO xref), but the report's own `reference_validation` block
  reports **quotes_valid: 2 of quotes_checked: 5** - three quotes attributed to
  sources that do not contain them (PMC:PMC9844601, PMID:9419411,
  DOI:10.1073/pnas.1510757112). None of those three is cited by this entry, and
  every snippet here was taken from an abstract read directly before the report
  was generated, so no report-sourced quote entered the KB. But a 3-in-5
  unsupported-quote rate is a stronger warning than a confabulation_rate of 0.0
  suggests, and it is the reason the leads below were each re-checked against
  PubMed independently rather than curated on the report's word.

  A lesson this entry paid for twice, worth keeping because it generalizes.
  An earlier version of these notes claimed a search "returned related papers
  ... but none establishing the surveillance recommendation". PMID:30629674 -
  already sitting in `references_cache/` because this entry's own
  deep-research run resolved it - is exactly that study, and is now curated as
  a `diagnosis` entry. **A claim about what the literature does not contain is
  still a claim, and that one was made without checking the cache this entry
  was shipping.** The same paper then supplied the flushing-history limits the
  diagnosis entry was missing.

  The ESCC risk is exposure-conditioned, and both halves are curated so
  neither can be quoted alone. In a 0.5-million prospective cohort, people
  drinking less than weekly showed *no* excess oesophageal cancer risk from
  inactive ALDH2; the risk appears at higher intake (rs671 GA vs GG HR 3.31 in
  male weekly consumers). Meanwhile a meta-analysis across all subjects
  irrespective of drinking found rs671 *protective* for ESCC (OR 0.60) - which
  is what the `Reduced heavy drinking` phenotype predicts, since carriers
  drink less. Those two estimates are not in conflict; they are the two halves
  of this entry's central paradox. That meta-analysis's Mendelian
  randomization arm also failed to establish a causal alcohol effect, curated
  as a PARTIAL negative rather than omitted.

  The flushing screen degrades exactly where it matters. Sensitivity for
  inactive ALDH2 is 96.1% in general male clinic patients, 56.8% in male
  weekly drinkers, and 50.0% in alcohol-dependent women - three populations,
  three papers, one monotone pattern. A negative flushing history in a heavy
  drinker does not exclude ALDH2 deficiency; genotyping does.

  Leads still NOT curated, each re-checked:
  - *Antihistamine and H2-blocker masking of the flush.* Still unsourced: a
    targeted PubMed search returned only papers from 1980 and 1982, neither
    stating it. Not asserted. A curator who finds a modern source should add it
    as a harm-framed treatment entry.
  - *ALDH2 activators (Alda-1, AD-9308).* Investigational, and not a therapy
    for the flush reaction itself.
  - *Amplified reaction with metronidazole, cephalosporins and sulfonylureas.*
    Only the disulfiram arm is represented, as a differential graded PARTIAL on
    the shared enzymatic step.

  Scoping decision on non-cancer sequelae. The chronic consequences curated
  here stop at the upper-aerodigestive carcinogenesis arm. Cardiovascular
  associations (coronary vasospasm, hypertension, atrial fibrillation),
  amyloid/neurodegeneration links, and the ALDH5/formaldehyde AMeD-syndrome arm
  all appear in the deep-research report and are real literatures, but each is
  a downstream disease with its own mechanism rather than a feature of acute
  alcohol sensitivity, and curating them here would make this entry a
  general ALDH2 review. They belong on the relevant disease entries, which can
  reference this one.

  Not curated, and why. No `treatments` block: there is no therapy for this
  disorder, and the intervention that matters - not drinking, or drinking less -
  is the avoidance of the trigger rather than a treatment of the condition. It
  is represented instead by the `Ethanol Ingestion` environmental entry and by
  the `Flushing history` diagnosis entry, which carries the counselling and
  endoscopic-screening rationale. Curating "alcohol avoidance" as a Treatment
  would assert a clinical recommendation with a shape the sources do not have.

  The disulfiram-ethanol reaction is curated as a differential on the strength
  of the shared enzymatic step only; the evidence item is graded PARTIAL and
  says so. A curator adding disulfiram detail should cite a source describing
  that reaction directly rather than inheriting this one.

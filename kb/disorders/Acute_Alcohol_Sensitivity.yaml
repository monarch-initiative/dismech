name: Acute Alcohol Sensitivity
creation_date: "2026-08-22T16:00:00Z"
category: Genetic
description: >
  Acute alcohol sensitivity - the alcohol flushing response, colloquially "Asian
  flush" - is an inherited, exposure-conditioned disorder of acetaldehyde
  clearance. Ethanol is oxidised to acetaldehyde by alcohol dehydrogenase and
  then to acetate by mitochondrial aldehyde dehydrogenase 2 (ALDH2). When ALDH2
  activity is deficient, acetaldehyde accumulates after drinking and produces
  facial flushing, nausea and tachycardia within minutes.

  The mechanism is *dominant negative*, which is why a single copy suffices.
  ALDH2 functions as a tetramer, and a subunit encoded by the inactive allele
  poisons the tetramers it joins: in gastric biopsies, neither homozygotes nor
  heterozygotes showed any ALDH2 activity band on isoelectric focusing, so
  heterotetramers containing mutant subunits are inactive or nearly so. In an
  alcohol challenge, rs671 (p.Glu504Lys) heterozygotes reached a six-fold
  higher acetaldehyde level than wild-type carriers.

  Two framings in the standard account of this disorder are wrong, and this
  entry deliberately departs from both. First, **it is not only rs671.** A 2024
  alcohol-challenge study identified two further ALDH2 variants - rs747096195
  (p.Arg101Gly) and rs190764869 (p.Arg114Trp) - in flushing individuals who were
  not of East Asian descent, each roughly doubling acetaldehyde, by mechanisms
  that differ from rs671's: failure of functional dimer/tetramer formation for
  R101G, and reduced Vmax for both. Second, **it is not a benign curiosity.**
  Acetaldehyde is a genotoxin; the flushing response is a clinically usable
  biomarker of markedly elevated oesophageal squamous cell carcinoma risk from
  drinking, and Brooks and colleagues wrote their landmark paper specifically to
  tell clinicians that a question about past flushing episodes is a cancer risk
  assessment.

  The same allele that causes this disorder is *protective* against alcohol use
  disorder, because the reaction is aversive. The knowledge base already curates
  both downstream consequences - `Alcohol_Use_Disorder` names ALDH2 as a
  large-effect protective locus, and the oesophageal cancer entries name it as a
  risk factor - without curating the disorder that sits between them. This entry
  supplies that shared mechanism.

  downstream:
  - target: TLR-Driven Innate Inflammatory Signaling
    causal_link_type: DIRECT
    description: >-
      Anaerobic bacteria and their cell-wall products in the subarachnoid space
      are recognized by innate immune receptors, driving the inflammatory
      signaling cascade.
  - target: Fever
    causal_link_type: DIRECT
    description: Meningeal inflammation produces fever.
  - target: Headache
    causal_link_type: DIRECT
    description: Meningeal inflammation produces headache.
  - target: Nuchal rigidity
    causal_link_type: DIRECT
    description: Meningeal irritation produces neck stiffness.
  - target: Reduced consciousness
    causal_link_type: DIRECT
    description: >-

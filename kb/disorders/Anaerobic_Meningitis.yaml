  - target: CSF polymorphonuclear pleocytosis
    causal_link_type: DIRECT
    description: Neutrophil recruitment into CSF produces a neutrophilic pleocytosis.
- name: TLR-Driven Innate Inflammatory Signaling
  description: >-
    Bacterial recognition by Toll-like receptors on antigen-presenting cells
    activates NF-kappaB and MAPK pathways, upregulating cytokines and chemokines
    that recruit and activate neutrophils in the subarachnoid space. This step
    is extrapolated from pneumococcal meningitis models rather than measured in
    anaerobe-induced disease.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: INCREASED
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  evidence:
  - reference: PMID:22618789
    reference_title: Pathophysiology of acute meningitis caused by Streptococcus pneumoniae and adjunctive therapy approaches.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      S. pneumoniae is recognized by antigen-presenting cells through the
      binding of Toll-like receptors inducing the activation of factor nuclear
      kappa B or mitogen-activated protein kinase pathways
    explanation: >-
      Describes the TLR to NF-kappaB/MAPK innate-inflammatory step; quoted from a
      pneumococcal pathophysiology review, so it is INDIRECT for anaerobic disease.
  downstream:
  - target: Oxidative Stress and Blood-Brain Barrier Breakdown
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cytokine-driven neutrophil activation generates reactive oxygen and
      nitrogen species that injure the blood-brain barrier.
- name: Oxidative Stress and Blood-Brain Barrier Breakdown
  description: >-
    Activated neutrophils release superoxide and nitric oxide, forming
    peroxynitrite; the resulting oxidative stress drives lipid peroxidation,
    mitochondrial damage, and blood-brain barrier breakdown. Also extrapolated
    from pneumococcal meningitis rather than measured in anaerobic disease.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: superoxide anion generation
    term:
      id: GO:0042554
      label: superoxide anion generation
    modifier: INCREASED
  evidence:
  - reference: PMID:22618789
    reference_title: Pathophysiology of acute meningitis caused by Streptococcus pneumoniae and adjunctive therapy approaches.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      polymorphonuclear are attracted, activated and released in large amounts
      of superoxide anion and nitric oxide, leading to the peroxynitrite
      formation, generating oxidative stress. This cascade leads to lipid
      peroxidation, mitochondrial damage, blood-brain barrier breakdown
      contributing to cell injury during pneumococcal meningitis.
    explanation: >-
      Describes the oxidative-injury and blood-brain-barrier-breakdown step;
      quoted from a pneumococcal review, so it is INDIRECT for anaerobic disease.
  downstream:
  - target: Anaerobic CNS Injury
    causal_link_type: DIRECT
    description: >-
      Oxidative injury and barrier breakdown contribute to the central nervous
      system tissue damage of anaerobic meningitis.
- name: Septic Thrombophlebitis and Lemierre Branch
  description: >-
    Oropharyngeal Fusobacterium can extend to septic internal jugular or
    cavernous sinus venous thrombophlebitis (Lemierre physiology), a contiguous
    venous route to intracranial injury recognized in anaerobic meningitis.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:41330476
    reference_title: "Meningitis caused by Fusobacterium nucleatum complicated with cavernous sinus thrombosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging revealed left cavernous sinus thrombosis
      requiring anticoagulation.
    explanation: >-
      Documents septic cavernous sinus thrombosis complicating Fusobacterium
      nucleatum meningitis.
  downstream:
  - target: Anaerobic CNS Injury
    causal_link_type: DIRECT
    description: >-
      Septic venous thrombosis and emboli injure central nervous system
      structures.
- name: Bacteroides Capsular Abscess Formation
  description: >-
    Encapsulated Bacteroides fragilis uses its capsular polysaccharide as an
    abscess-promoting and antiphagocytic virulence factor that can help sustain
    purulent anaerobic foci next to the meningeal compartment.
  biological_scale: CELLULAR
  downstream:
  - target: Anaerobic CNS Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Abscess-forming anaerobic virulence can maintain the contiguous purulent
      focus that complicates anaerobic meningitis.
  evidence:
  - reference: PMID:6954635
    reference_title: "Infection with Bacteroides fragilis: pathogenesis and immunoprophylaxis in an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The abscesses caused by encapsulated strains were shown to be directly
      attributable to the capsular polysaccharide, which is an important
      virulence factor of this organism.
    explanation: >-
      Demonstrates that the B. fragilis capsule itself is sufficient to drive
      abscess formation in an animal model of anaerobic infection.
- name: Anaerobic CNS Injury
  role: outcome
  description: >-
    Meningeal inflammation, brain abscess, ventriculitis, and septic venous
    thrombosis injure central nervous system tissue and can leave survivors
    with persistent neurologic deficits.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite treatment, 30.8% (4/13) of the patients died. Of the nine
      survivors, 22.2% (2/9) had a full recovery, while the other 77.8% (7/9)
      had varying degrees of neurological deficits.
    explanation: >-
      Quantifies mortality and persistent neurologic morbidity after adult
      anaerobic bacterial meningitis.
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty children had a "complicated" meningitis, while 7 an "isolated" one.
      Median age was 4 years old in both groups. In the complicated group, 12
      children underwent surgical drainage and 4 died.
    explanation: >-
      Shows the high complication burden in pediatric F. necrophorum
      meningitis.
  downstream:
  - target: Focal neurologic deficit
    causal_link_type: DIRECT
    description: >-
      Focal brain, abscess, or venous injury produces focal neurologic deficits.

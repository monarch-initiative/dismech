agent_life_cycle:
  description: >-
    Anaerobic meningitis agents are endogenous human mucosal or skin anaerobes
    that normally persist in oxygen-poor oral, gastrointestinal, or cutaneous
    niches and cause meningitis when trauma, surgery, device infection, sinus or
    ear infection, dental disease, thrombophlebitic spread, or an abscess lets
    them reach cerebrospinal fluid.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:32717475
    reference_title: Clinical utility of anaerobic culture of cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anaerobic meningitis is a rare serious clinical condition which mainly
      affects vulnerable populations and patients with predisposing factors such
      as head trauma, prior neurosurgical procedures or implantable medical
      devices such as ventriculoperitoneal shunts or ventricular drains.
    explanation: >-
      Supports neurosurgical disruption and CNS devices as portals through
      which endogenous anaerobes can reach CSF or ventricular fluid.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Endogenous contiguous anaerobe spread
  description: >-
    Host mucosal anaerobes seed the meninges by direct or thrombophlebitic
    extension after cranial, spinal, postoperative, or parameningeal barrier
    disruption.
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      53.8% (7/13) had a postneurosurgical state as the preceding event, and
      79.6% (10/13) had underlying medical conditions including diabetes
      mellitus, malignancy, liver cirrhosis, cerebral infarct and alcoholism
    explanation: >-
      Quantifies postoperative events and host comorbidities among adults with
      anaerobic bacterial meningitis.
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All children had a previous ENT infection, mainly acute otitis media (N =
      21/27).
    explanation: >-
      Supports ENT infection as the entry branch for pediatric F. necrophorum
      meningitis.
pathophysiology:
- name: Endogenous Anaerobe Barrier Breach
  role: trigger
  description: >-
    Trauma, neurosurgery, implanted CNS hardware, otitis, sinusitis, dental
    disease, or a local abscess opens a portal through which normally commensal
    oral, gut, or skin anaerobes can leave their reservoir niche.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32717475
    reference_title: Clinical utility of anaerobic culture of cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anaerobic meningitis is a rare serious clinical condition which mainly
      affects vulnerable populations and patients with predisposing factors such
      as head trauma, prior neurosurgical procedures or implantable medical
      devices such as ventriculoperitoneal shunts or ventricular drains.
    explanation: >-
      Places head trauma, neurosurgical procedures, and CSF devices upstream of
      anaerobic meningitis.
  downstream:
  - target: Anaerobic CNS Seeding
    causal_link_type: DIRECT
    description: >-
      Barrier disruption permits direct, contiguous, thrombophlebitic, or
      bloodstream access to the central nervous system.
- name: Anaerobic CNS Seeding
  description: >-
    Fusobacterium, Bacteroides, Prevotella, Peptostreptococcus/Parvimonas, and
    Cutibacterium lineages enter CSF or adjacent intracranial foci from ENT,
    odontogenic, traumatic, postoperative, or device-associated sites.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 14 anaerobic strains were isolated from cerebrospinal fluid
      specimens, including nine Gram-negative (G(-)) strains: Fusobacterium
      nucleatum (3), Prevotella species (3) and Bacteroides fragilis (3), and
      five Gram-positive (G(+)) strains: Propionibacterium acnes (3) and
      Peptostreptococcus micros (also known as Parvimonas micra) (2)
    explanation: >-
      Documents the mixed Gram-negative and Gram-positive anaerobic spectrum
      recovered from adult anaerobic-meningitis CSF.
  downstream:
  - target: Anaerobic CSF Replication
    causal_link_type: DIRECT
    description: >-
      Anaerobic organisms that reach CSF persist in an oxygen-poor intracranial
      focus and amplify the local bacterial stimulus.
  - target: Septic Thrombophlebitis and Lemierre Branch
    causal_link_type: DIRECT
    description: >-
      Oropharyngeal Fusobacterium seeding can take a septic venous
      thrombophlebitic route rather than, or in addition to, direct CSF seeding.
- name: Anaerobic CSF Replication
  description: >-
    Strict anaerobes replicate in a purulent meningeal focus and expose local
    innate immune cells to anaerobic bacterial cell-wall products.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  evidence:
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fusobacterium necrophorum was isolated in the cerebrospinal fluid (CSF) by
      culture (N = 16) or by polymerase chain reaction (PCR) (N = 3).
    explanation: >-
      Shows that a pediatric F. necrophorum branch involves organisms detectable
      directly in CSF.
  downstream:
  - target: Anaerobic Neutrophilic Meningitis
    causal_link_type: DIRECT
    description: >-
      Anaerobic growth in the CSF recruits neutrophils and produces acute
      bacterial meningitis.
  - target: Bacteroides Capsular Abscess Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Encapsulated Bacteroides fragilis replicating in or next to the meningeal
      compartment can wall off into an abscess-forming suppurative focus.
- name: Anaerobic Neutrophilic Meningitis
  description: >-
    Anaerobic organisms in the cerebrospinal-fluid space provoke a neutrophilic
    meningeal inflammatory response with CSF pleocytosis, fever, headache, and
    meningismus.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil

  infectious_agent_term:
    preferred_term: Prevotella
    term:
      id: NCBITaxon:838
      label: Prevotella
  description: >-
    Prevotella species are oral and mucosal anaerobes that can participate in
    anaerobic bacterial meningitis.
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 14 anaerobic strains were isolated from cerebrospinal fluid
      specimens, including nine Gram-negative (G(-)) strains: Fusobacterium
      nucleatum (3), Prevotella species (3) and Bacteroides fragilis (3), and
      five Gram-positive (G(+)) strains: Propionibacterium acnes (3) and
      Peptostreptococcus micros (also known as Parvimonas micra) (2)
    explanation: >-
      Identifies Prevotella among anaerobic strains recovered from adult
      anaerobic bacterial meningitis CSF specimens.

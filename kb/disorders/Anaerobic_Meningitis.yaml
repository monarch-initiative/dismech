    evidence_source: HUMAN_CLINICAL
    snippet: >-
      other children had a CSF pleocytosis with a positive blood culture.
    explanation: >-
      Documents CSF pleocytosis in the pediatric F. necrophorum anaerobic
      meningitis cohort.
diagnosis:
- name: Anaerobic CSF Culture and Molecular Detection
  description: >-
    Anaerobic meningitis is confirmed by recovering anaerobes from CSF or
    ventricular fluid, with anaerobic culture, 16S rRNA PCR, and CSF
    metagenomic sequencing used when routine aerobic culture is unrevealing or
    an anaerobic pathogen is suspected.
  evidence:
  - reference: PMID:32717475
    reference_title: Clinical utility of anaerobic culture of cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anaerobe culture of CSF is important in identification of anaerobic
      meningitis, as growth of anaerobes other than C. acnes is rare from
      aerobic CSF culture.
    explanation: >-
      Supports dedicated anaerobic CSF culture when anaerobic meningitis is in
      the differential.
  - reference: PMID:35692070
    reference_title: "[Clinical observation of 8 cases with central nervous system anaerobic infection diagnosed by metagenomic next-generation sequencing of cerebrospinal fluid]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metagenomic next-generation sequencing can identify multiple pathogens
      (viral, bacterial, fungal, or parasitic) from samples based on DNA and/or
      RNA sequences and has advantages in diagnosing anaerobic infections of the
      central nervous system.
    explanation: >-
      Supports CSF mNGS as a molecular route to detect culture-negative or
      fastidious CNS anaerobic infection.
treatments:
- name: Anaerobe-Active Antimicrobial Therapy
  description: >-
    Metronidazole-containing antimicrobial therapy kills obligate anaerobes in
    CSF or adjacent abscesses and is paired with broader bactericidal coverage
    when the organism and susceptibility pattern are not yet known.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Anaerobic CSF Replication
    treatment_effect: INHIBITS
    description: >-
      Anaerobe-active antibiotics eradicate susceptible bacteria replicating in
      CSF, ventricular fluid, or associated abscesses.
  evidence:
  - reference: PMID:434970
    reference_title: "Metronidazole therapy of anaerobic bacteremia, meningitis, and brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all cases the anaerobic pathogens were eradicated. Five of the six
      patients recovered.
    explanation: >-
      Documents metronidazole-associated anaerobe eradication across a small
      anaerobic bacteremia, brain abscess, ventriculitis, and meningitis series.
- name: Surgical Source Control
  description: >-
    Surgical excision or drainage of the infected nidus (brain abscess, subdural
    empyema, infected device, or parameningeal focus) removes the anaerobic
    source that seeds and sustains the meningeal infection, and is paired with
    prolonged anaerobe-active antibiotics.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical source control (excision or drainage)
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Endogenous Anaerobe Barrier Breach
    treatment_effect: INHIBITS
    description: >-
      Source control removes the breached focus through which endogenous
      anaerobes reach the central nervous system.
  evidence:
  - reference: PMID:28089421
    reference_title: Microbiology and treatment of brain abscess.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once an abscess has formed, surgical excision or drainage combined with
      prolonged antibiotics (usually 4-8weeks) remains the treatment of choice.
    explanation: >-
      Supports surgical source control plus prolonged antibiotics for the
      anaerobe-rich suppurative foci associated with anaerobic CNS infection;
      quoted from a brain-abscess review, so INDIRECT for meningitis specifically.
- name: Adjunctive Dexamethasone
  description: >-
    Adjunctive corticosteroid given with or before antibiotics to blunt the
    injurious inflammatory response. The mortality and sequelae benefit is
    established for acute bacterial (especially pneumococcal) meningitis in
    general and is extrapolated to anaerobic disease, for which direct evidence
    is lacking.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: TLR-Driven Innate Inflammatory Signaling
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids dampen the pro-inflammatory signaling that drives
      neutrophilic injury in the subarachnoid space.
  evidence:
  - reference: PMID:41675892
    reference_title: "Corticosteroids as adjunctive therapy in acute meningitis: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corticosteroids significantly reduce mortality and neurological sequelae
      in acute bacterial meningitis (particularly pneumococcal), especially when
      administered before or with antibiotics.
    explanation: >-
      Supports adjunctive corticosteroids in bacterial meningitis generally; the
      benefit is extrapolated to anaerobic disease, hence INDIRECT.
  - reference: PMID:40113367
    reference_title: "Adjunctive dexamethasone and 30-day all-cause death after hospital admission in paediatric pneumococcal meningitis: a propensity score analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      After IPTW, the adjusted 30-day death rate was 6% in the dexamethasone
      group and 12% in the no dexamethasone group (marginal odds ratio 0·39, 95%
      CI 0·23-0·65).
    explanation: >-
      Quantifies an early-dexamethasone mortality benefit in paediatric
      pneumococcal meningitis; extrapolated to anaerobic meningitis, hence INDIRECT.
prevalence:
- population: Culture-proven adult bacterial meningitis (Taiwan, 1986-2015)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Anaerobic infection accounted for 13 of 540 culture-proven adult bacterial
    meningitis cases (2.4%) over a 30-year single-centre study. This is a
    proportion of bacterial-meningitis cases, not a population rate, so it is
    recorded as a case count rather than mapped to a prevalence band.
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 540 patients with culture-proven bacterial meningitis during a
      study period of 30 years (1986-2015), of whom 13 (2.4%) had anaerobic
      infections.
    explanation: >-
      Source for the defining 2.4% (13/540) share of anaerobic infection among
      culture-proven adult bacterial meningitis.
- population: Pediatric Fusobacterium necrophorum meningitis (France, 2001-2024)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A French national observatory covering about 60% of pediatric wards recorded
    27 cases of F. necrophorum meningitis over roughly two decades, indicating
    how uncommon this anaerobic subset is even in a large surveillance network.
  evidence:
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 27 cases of F. necrophorum meningitis were recorded.
    explanation: >-
      Source for the pediatric case count recorded here.
biochemical:
- name: CSF lactate
  presence: INCREASED
  context: >-
    Rapid CSF discriminator between bacterial and aseptic meningitis, generated
    by bacterial anaerobic metabolism.
  notes: >-
    Pretreatment with antibiotics lowers its sensitivity, so a normal value
    after antibiotics does not exclude bacterial meningitis.
  evidence:
  - reference: PMID:21382412
    reference_title: "Diagnostic accuracy of cerebrospinal fluid lactate for differentiating bacterial meningitis from aseptic meningitis: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled test characteristics of CSF lactate were sensitivity 0.93 (95%
      CI: 0.89-0.96), specificity 0.96 (95% CI: 0.93-0.98)
    explanation: >-
      Meta-analytic diagnostic performance of CSF lactate for bacterial
      meningitis, a finding mechanistically apt for anaerobic metabolism.
discussions:
- discussion_id: cascade_extrapolated_from_pneumococcal
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The TLR to cytokine to oxidative-stress to blood-brain-barrier-breakdown
    cascade modelled here is measured in pneumococcal and Klebsiella meningitis,
    not in anaerobe-induced meningitis. Does the same cascade, with the same
    intensity and kinetics, operate when the organism is a strict anaerobe?
  attaches_to:
  - pathophysiology#TLR-Driven Innate Inflammatory Signaling
  - pathophysiology#Oxidative Stress and Blood-Brain Barrier Breakdown
  rationale: >-
    Anaerobic cell-wall components differ from the pneumococcal ligands that
    define the canonical meningitis inflammatory cascade, and no study has
    measured the cytokine surge, oxidative burst, or barrier breakdown directly
    in anaerobe-induced meningitis. The downstream nodes are therefore an
    extrapolation, which is why their evidence is graded INDIRECT.
  evidence:
  - reference: PMID:22618789
    reference_title: Pathophysiology of acute meningitis caused by Streptococcus pneumoniae and adjunctive therapy approaches.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This cascade leads to lipid peroxidation, mitochondrial damage,
      blood-brain barrier breakdown contributing to cell injury during
      pneumococcal meningitis.
    explanation: >-
      States that the modelled oxidative-injury cascade is characterized in
      pneumococcal meningitis, the source of the extrapolation this gap names.
progression:
- phase: Preceding focal barrier-breach infection
  notes: >-
    Anaerobic meningitis is typically preceded by a contiguous focal infection
    or barrier-breaching event (ear, nose and throat infection, odontogenic
    disease, trauma, neurosurgery, or device infection) rather than arising de
    novo.
  evidence:
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All children had a previous ENT infection, mainly acute otitis media (N =
      21/27).
    explanation: >-
      Documents an antecedent ENT infection in every pediatric F. necrophorum
      meningitis case, the barrier-breach phase preceding meningitis.
- phase: Complicated course and prolonged treatment
  duration: Antibiotics usually 4-8 weeks, often with surgical drainage
  notes: >-
    A large share of cases develop local or systemic complications (mastoiditis,
    abscess, empyema, Lemierre syndrome) requiring surgical drainage and a
    prolonged antimicrobial course.
  evidence:
  - reference: PMID:28089421
    reference_title: Microbiology and treatment of brain abscess.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once an abscess has formed, surgical excision or drainage combined with
      prolonged antibiotics (usually 4-8weeks) remains the treatment of choice.
    explanation: >-
      Dates the prolonged (4-8 week) treatment phase for anaerobe-rich
      suppurative CNS foci; INDIRECT because quoted from a brain-abscess review.
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the complicated group, 12 children underwent surgical drainage and 4
      died.
    explanation: >-
      Quantifies the complicated-course phase requiring surgical drainage in the
      pediatric cohort.

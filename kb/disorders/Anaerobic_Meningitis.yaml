agent_life_cycle:
  description: >-
    Anaerobic meningitis agents are endogenous human mucosal or skin anaerobes
    that normally persist in oxygen-poor oral, gastrointestinal, or cutaneous
    niches and cause meningitis when trauma, surgery, device infection, sinus or
    ear infection, dental disease, thrombophlebitic spread, or an abscess lets
    them reach cerebrospinal fluid.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:32717475
    reference_title: Clinical utility of anaerobic culture of cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anaerobic meningitis is a rare serious clinical condition which mainly
      affects vulnerable populations and patients with predisposing factors such
      as head trauma, prior neurosurgical procedures or implantable medical
      devices such as ventriculoperitoneal shunts or ventricular drains.
    explanation: >-
      Supports neurosurgical disruption and CNS devices as portals through
      which endogenous anaerobes can reach CSF or ventricular fluid.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Endogenous contiguous anaerobe spread
  description: >-
    Host mucosal anaerobes seed the meninges by direct or thrombophlebitic
    extension after cranial, spinal, postoperative, or parameningeal barrier
    disruption.
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      53.8% (7/13) had a postneurosurgical state as the preceding event, and
      79.6% (10/13) had underlying medical conditions including diabetes
      mellitus, malignancy, liver cirrhosis, cerebral infarct and alcoholism
    explanation: >-
      Quantifies postoperative events and host comorbidities among adults with
      anaerobic bacterial meningitis.
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All children had a previous ENT infection, mainly acute otitis media (N =
      21/27).
    explanation: >-
      Supports ENT infection as the entry branch for pediatric F. necrophorum
      meningitis.
pathophysiology:
- name: Endogenous Anaerobe Barrier Breach
  role: trigger
  description: >-
    Trauma, neurosurgery, implanted CNS hardware, otitis, sinusitis, dental
    disease, or a local abscess opens a portal through which normally commensal
    oral, gut, or skin anaerobes can leave their reservoir niche.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32717475
    reference_title: Clinical utility of anaerobic culture of cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anaerobic meningitis is a rare serious clinical condition which mainly
      affects vulnerable populations and patients with predisposing factors such
      as head trauma, prior neurosurgical procedures or implantable medical
      devices such as ventriculoperitoneal shunts or ventricular drains.
    explanation: >-
      Places head trauma, neurosurgical procedures, and CSF devices upstream of
      anaerobic meningitis.
  downstream:
  - target: Anaerobic CNS Seeding
    causal_link_type: DIRECT
    description: >-
      Barrier disruption permits direct, contiguous, thrombophlebitic, or
      bloodstream access to the central nervous system.
- name: Anaerobic CNS Seeding
  description: >-
    Fusobacterium, Bacteroides, Prevotella, Peptostreptococcus/Parvimonas, and
    Cutibacterium lineages enter CSF or adjacent intracranial foci from ENT,
    odontogenic, traumatic, postoperative, or device-associated sites.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 14 anaerobic strains were isolated from cerebrospinal fluid
      specimens, including nine Gram-negative (G(-)) strains: Fusobacterium
      nucleatum (3), Prevotella species (3) and Bacteroides fragilis (3), and
      five Gram-positive (G(+)) strains: Propionibacterium acnes (3) and
      Peptostreptococcus micros (also known as Parvimonas micra) (2)
    explanation: >-
      Documents the mixed Gram-negative and Gram-positive anaerobic spectrum
      recovered from adult anaerobic-meningitis CSF.
  downstream:
  - target: Anaerobic CSF Replication
    causal_link_type: DIRECT
    description: >-
      Anaerobic organisms that reach CSF persist in an oxygen-poor intracranial
      focus and amplify the local bacterial stimulus.
- name: Anaerobic CSF Replication
  description: >-
    Strict anaerobes replicate in a purulent meningeal focus and expose local
    innate immune cells to anaerobic bacterial cell-wall products.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  evidence:
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fusobacterium necrophorum was isolated in the cerebrospinal fluid (CSF) by
      culture (N = 16) or by polymerase chain reaction (PCR) (N = 3).
    explanation: >-
      Shows that a pediatric F. necrophorum branch involves organisms detectable
      directly in CSF.
  downstream:
  - target: Anaerobic Neutrophilic Meningitis
    causal_link_type: DIRECT
    description: >-
      Anaerobic growth in the CSF recruits neutrophils and produces acute
      bacterial meningitis.
- name: Anaerobic Neutrophilic Meningitis
  description: >-
    Anaerobic organisms in the cerebrospinal-fluid space provoke a neutrophilic
    meningeal inflammatory response with CSF pleocytosis, fever, headache, and
    meningismus.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  evidence:
  - reference: PMID:41330476
    reference_title: "Meningitis caused by Fusobacterium nucleatum complicated with cavernous sinus thrombosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      lumbar puncture confirmed neutrophilic meningitis with Fusobacterium
      nucleatum isolation.
    explanation: >-
      Supports neutrophilic meningeal inflammation at the time an anaerobe is
      isolated from CSF.
  downstream:
  - target: Anaerobic CNS Injury
    causal_link_type: DIRECT
    description: >-
      Persistent anaerobic inflammation and contiguous infection damage adjacent
      brain, ventricular, abscess, and venous structures.
- name: Bacteroides Capsular Abscess Formation
  description: >-
    Encapsulated Bacteroides fragilis uses its capsular polysaccharide as an
    abscess-promoting and antiphagocytic virulence factor that can help sustain
    purulent anaerobic foci next to the meningeal compartment.
  biological_scale: CELLULAR
  downstream:
  - target: Anaerobic CNS Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Abscess-forming anaerobic virulence can maintain the contiguous purulent
      focus that complicates anaerobic meningitis.
  evidence:
  - reference: PMID:6954635
    reference_title: "Infection with Bacteroides fragilis: pathogenesis and immunoprophylaxis in an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The abscesses caused by encapsulated strains were shown to be directly
      attributable to the capsular polysaccharide, which is an important
      virulence factor of this organism.
    explanation: >-
      Demonstrates that the B. fragilis capsule itself is sufficient to drive
      abscess formation in an animal model of anaerobic infection.
- name: Anaerobic CNS Injury
  role: outcome
  description: >-
    Meningeal inflammation, brain abscess, ventriculitis, and septic venous
    thrombosis injure central nervous system tissue and can leave survivors
    with persistent neurologic deficits.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite treatment, 30.8% (4/13) of the patients died. Of the nine
      survivors, 22.2% (2/9) had a full recovery, while the other 77.8% (7/9)
      had varying degrees of neurological deficits.
    explanation: >-
      Quantifies mortality and persistent neurologic morbidity after adult
      anaerobic bacterial meningitis.
  - reference: PMID:41479136
    reference_title: Fusobacterium necrophorum Meningitis 27 Pediatric Cases From a French National Observatory.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty children had a "complicated" meningitis, while 7 an "isolated" one.
      Median age was 4 years old in both groups. In the complicated group, 12
      children underwent surgical drainage and 4 died.
    explanation: >-
      Shows the high complication burden in pediatric F. necrophorum
      meningitis.
phenotypes:
- name: Fever
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:15509818
    reference_title: Clinical features and prognostic factors in adults with bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic triad of fever, neck stiffness, and a change in mental status
      was present in only 44 percent of episodes; however, 95 percent had at
      least two of the four symptoms of headache, fever, neck stiffness, and
      altered mental status.
    explanation: >-
      Identifies fever as one of the cardinal acute features of adult bacterial
      meningitis.
- name: Headache
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:35692070
    reference_title: "[Clinical observation of 8 cases with central nervous system anaerobic infection diagnosed by metagenomic next-generation sequencing of cerebrospinal fluid]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 8 patients, 7 cases had headache and fever as the first
      symptoms, and 1 case had left-sided limb weakness as the first symptom.
    explanation: >-
      Reports headache and fever among patients with central nervous system
      anaerobic infection diagnosed by CSF metagenomic sequencing.
- name: Nuchal rigidity
  phenotype_term:
    preferred_term: Nuchal rigidity
    term:
      id: HP:0031179
      label: Nuchal rigidity
  evidence:
  - reference: PMID:15509818
    reference_title: Clinical features and prognostic factors in adults with bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic triad of fever, neck stiffness, and a change in mental status
      was present in only 44 percent of episodes; however, 95 percent had at
      least two of the four symptoms of headache, fever, neck stiffness, and
      altered mental status.
    explanation: >-
      Maps the neck-stiffness component of the bacterial-meningitis triad to
      the nuchal-rigidity HPO term.
diagnosis:
- name: Anaerobic CSF Culture and Molecular Detection
  description: >-
    Anaerobic meningitis is confirmed by recovering anaerobes from CSF or
    ventricular fluid, with anaerobic culture, 16S rRNA PCR, and CSF
    metagenomic sequencing used when routine aerobic culture is unrevealing or
    an anaerobic pathogen is suspected.
  evidence:
  - reference: PMID:32717475
    reference_title: Clinical utility of anaerobic culture of cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anaerobe culture of CSF is important in identification of anaerobic
      meningitis, as growth of anaerobes other than C. acnes is rare from
      aerobic CSF culture.
    explanation: >-
      Supports dedicated anaerobic CSF culture when anaerobic meningitis is in
      the differential.
  - reference: PMID:35692070
    reference_title: "[Clinical observation of 8 cases with central nervous system anaerobic infection diagnosed by metagenomic next-generation sequencing of cerebrospinal fluid]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metagenomic next-generation sequencing can identify multiple pathogens
      (viral, bacterial, fungal, or parasitic) from samples based on DNA and/or
      RNA sequences and has advantages in diagnosing anaerobic infections of the
      central nervous system.
    explanation: >-
      Supports CSF mNGS as a molecular route to detect culture-negative or
      fastidious CNS anaerobic infection.
treatments:
- name: Anaerobe-Active Antimicrobial Therapy
  description: >-
    Metronidazole-containing antimicrobial therapy kills obligate anaerobes in
    CSF or adjacent abscesses and is paired with broader bactericidal coverage
    when the organism and susceptibility pattern are not yet known.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Anaerobic CSF Replication
    treatment_effect: INHIBITS
    description: >-
      Anaerobe-active antibiotics eradicate susceptible bacteria replicating in
      CSF, ventricular fluid, or associated abscesses.
  evidence:
  - reference: PMID:434970
    reference_title: "Metronidazole therapy of anaerobic bacteremia, meningitis, and brain abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all cases the anaerobic pathogens were eradicated. Five of the six
      patients recovered.
    explanation: >-
      Documents metronidazole-associated anaerobe eradication across a small
      anaerobic bacteremia, brain abscess, ventriculitis, and meningitis series.

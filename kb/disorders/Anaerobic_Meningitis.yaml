name: Anaerobic meningitis
creation_date: "2026-09-30T03:14:32Z"
description: >-
  Anaerobic meningitis is bacterial meningitis caused by anaerobic bacteria,
  usually after oral, gastrointestinal, skin, or abscess-associated anaerobes
  exploit otogenic, odontogenic, traumatic, device-associated, or postoperative
  barrier disruption, reach the cerebrospinal-fluid compartment, replicate
  locally, and trigger neutrophilic meningeal inflammation with high rates of
  intracranial complications and neurologic sequelae.
category: Infectious Disease
disease_term:
  preferred_term: anaerobic meningitis
  term:
    id: MONDO:0002000
    label: anaerobic meningitis
parents:
- Bacterial meningitis
- Anaerobic Bacteria Infectious Disease
synonyms:
- meningitis due to anaerobic bacteria
- anaerobic bacterial meningitis
notes: >-
  The Falcon deep-research request fell back to OpenScientist. All 28 reported
  references resolved, but only 9 were judged on-topic; term validation also
  flagged several label mismatches, including a report binding of CSF
  pleocytosis to HP:0025432, the HPO term for Acanthoma. preflight-dr skipped
  the automated gene-identity check because MONDO:0002000 records no causal
  gene; manual duplicate and synonym review confirmed that the report covered
  anaerobic meningitis.
review_notes: >-
  Deliberately lumped. Anaerobic meningitis groups Prevotella,
  Peptostreptococcus, Bacteroides, Fusobacterium necrophorum, and other strict
  anaerobes because MONDO scopes this child by anaerobic physiology and
  endogenous barrier-breach route rather than by a single genus, while
  organism-specific differences can still be split into child entries if later
  evidence shows a distinct presentation, reservoir, prognosis, diagnostic
  pattern, or treatment susceptibility.
infectious_agent:
- name: Prevotella
  infectious_agent_term:
    preferred_term: Prevotella
    term:
      id: NCBITaxon:838
      label: Prevotella
  description: >-
    Prevotella species are oral and mucosal anaerobes that can participate in
    anaerobic bacterial meningitis.
  evidence:
  - reference: PMID:29396061
    reference_title: Anaerobic bacterial meningitis in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 14 anaerobic strains were isolated from cerebrospinal fluid
      specimens, including nine Gram-negative (G(-)) strains: Fusobacterium
      nucleatum (3), Prevotella species (3) and Bacteroides fragilis (3), and
      five Gram-positive (G(+)) strains: Propionibacterium acnes (3) and
      Peptostreptococcus micros (also known as Parvimonas micra) (2)
    explanation: >-
      Identifies Prevotella among anaerobic strains recovered from adult
      anaerobic bacterial meningitis CSF specimens.

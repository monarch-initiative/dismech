name: Cryptococcal Meningitis
disease_term:
  preferred_term: cryptococcal meningitis
  term:
    id: MONDO:0005723
    label: Cryptococcal meningitis
category: Disease
creation_date: "2026-10-08T00:00:00Z"
description: >-
  Meningoencephalitis caused by the encapsulated basidiomycete yeast
  Cryptococcus neoformans. Infection begins with inhalation of the organism
  from the environment and initial colonisation of the lungs; where cellular
  immunity is intact the infection is contained there, and where it is not,
  chiefly in advanced HIV disease, the yeast reaches the bloodstream, crosses
  the blood-brain barrier and establishes meningoencephalitis. Raised
  intracranial pressure is present in most patients and is a direct cause of
  death, which is why therapeutic lumbar puncture is adjunctive management
  rather than a diagnostic step. The disease is the commonest cause of
  meningitis in adults living with HIV in sub-Saharan Africa and accounts for
  roughly a fifth of AIDS-related mortality, an estimated 152,000 cases and
  112,000 deaths a year. Induction therapy pairs amphotericin B with
  flucytosine, and flucytosine's contribution is specific and measurable
  rather than incidental, which is what makes this disease the reference
  conformer for the flucytosine activation pathway.
notes: >-
  Scope and granularity. This entry sits at the named clinical entity of the
  infectious-disease ladder in design decisions section 3e, the
  pathogen-syndrome pair that is diagnosed and treated as a unit. It is
  deliberately not the organism-level concept MONDO:0005724 cryptococcosis,
  which also covers pulmonary and disseminated disease without CNS
  involvement; those are separate presentations and a Grouping over them is
  the natural follow-up rather than an absorption into this entry.

  Cryptococcus gattii is not modelled here. It is a separate etiologic agent
  whose epidemiology differs in the way that matters to the ladder, infecting
  apparently immunocompetent hosts with no defined risk factor where C.
  neoformans disease is overwhelmingly a consequence of advanced HIV. Whether
  that earns a second entry or a subtype row on this one is left open, and the
  agent block carries only the organism this entry's evidence describes.

  The flucytosine node is a therapeutic vulnerability, not a step in the
  disease. It is modelled because the trial evidence identifies flucytosine as
  the component that changes mortality, and because conformance to
  fungal_nucleic_acid_antimetabolite is what connects this entry to the
  activation biochemistry rather than restating it. Its evidence is clinical
  efficacy; the biochemical cascade is the module's claim and is cited there.

  Fluconazole consolidation and secondary prophylaxis are part of standard
  care and are not curated as treatments here. Both cited trials administered
  fluconazole after induction, but neither abstract states an indication or
  effect for the consolidation phase on its own, and the azole target pathway
  already has its own module. Adding them needs a source about consolidation
  rather than an inference from the induction regimens.
infectious_agent:
- name: Cryptococcus neoformans
  infectious_agent_term:
    preferred_term: Cryptococcus neoformans
    term:
      id: NCBITaxon:5207
      label: Cryptococcus neoformans
  description: >-
    An encapsulated, melanin-forming basidiomycete yeast that lives in soil,
    trees and bird droppings. Its polysaccharide capsule, melanin formation
    and urease activity are virulence determinants, and the capsule in
    particular distinguishes it from the pathogenic Candida species.
  evidence:
  - reference: PMID:24985132
    reference_title: "Cryptococcus neoformans and Cryptococcus gattii, the etiologic agents of cryptococcosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "They belong to the phylum Basidiomycota and can be readily distinguished from other pathogenic yeasts such as Candida by the presence of a polysaccharide capsule, formation of melanin, and urease activity, which all function as virulence determinants."
    explanation: Establishes the organism's taxonomic placement and the three virulence determinants named in this record.
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The fungus exists in environments such as soil, trees, and bird droppings."
    explanation: The environmental reservoir, which is why acquisition is from the environment rather than person to person.
- name: Cryptococcus gattii
  infectious_agent_term:
    preferred_term: Cryptococcus gattii
    term:
      id: NCBITaxon:37769
      label: Cryptococcus gattii
  description: >-
    The sibling species complex of C. neoformans, associated with trees rather
    than bird droppings and with temperate and tropical outbreak regions. It
    differs clinically in the host it infects: it causes disease in apparently
    immunocompetent people more often than in the immunosuppressed, and a large
    share of those apparently immunocompetent cases are in fact driven by
    acquired neutralising autoantibodies against GM-CSF, a hidden immune defect
    that an HIV/CD4 framing misses. It is more prone to parenchymal
    cryptococcomas than to the diffuse meningitis that dominates in
    HIV-associated C. neoformans disease.
  evidence:
  - reference: PMID:24985132
    reference_title: "Cryptococcus neoformans and Cryptococcus gattii, the etiologic agents of cryptococcosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "gattii are more often reported in immunocompetent patients with undefined risk than in the immunocompromised."
    explanation: Establishes the clinical distinction from C. neoformans, that C. gattii more often affects immunocompetent hosts.
  - reference: PMID:34700378
    reference_title: "Cryptococcus gattii Species Complex as an Opportunistic Pathogen: Underlying Medical Conditions Associated with the Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Cryptococcus gattii species complex has often been referred to as a primary pathogen due to its high infection frequency among apparently immunocompetent patients."
    explanation: States the apparently-immunocompetent host pattern that distinguishes this agent, which the paper then attributes partly to hidden GM-CSF autoantibodies.
  - reference: PMID:34700378
    reference_title: "Cryptococcus gattii Species Complex as an Opportunistic Pathogen: Underlying Medical Conditions Associated with the Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supporting this antibody as a major hidden risk factor for C."
    explanation: Supports the claim that anti-GM-CSF autoantibodies are a major hidden risk factor in apparently immunocompetent C. gattii cases.
agent_life_cycle:
  description: >-
    Cryptococcus neoformans is an environmental saprophyte with no animal or
    arthropod stage required for human disease. It persists in soil, trees and
    bird droppings, and humans acquire it by inhalation. There is no
    person-to-person transmission, so the human host is a dead end for the
    organism rather than part of its cycle, which is why this block records an
    environmental reservoir and no vector.
  hosts:
  - preferred_term: Homo sapiens
    role: >-
      Incidental, dead-end host; infection follows inhalation from the
      environment and does not transmit onward.
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: >-
    Birds are associated with the reservoir through their droppings rather
    than as infected hosts, so they are deliberately not recorded as a host
    here: the cited sources name the droppings as an environment the fungus
    lives in, not avian infection.
  evidence:
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The fungus exists in environments such as soil, trees, and bird droppings."
    explanation: The environmental reservoir this life cycle is built on.
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cryptococcus neoformans (C. neoformans) is an encapsulated pathogenic fungus that infects humans and animals"
    explanation: Records that animals are also infected, which is why the human host is described as incidental rather than unique.
transmission:
- name: Inhalation from an environmental reservoir
  description: >-
    Acquired by inhaling the yeast from soil, trees or bird droppings. There
    is no person-to-person transmission, so this is an environmentally
    acquired rather than communicable infection, and the clinical event that
    follows is progression in a host whose cellular immunity has failed.
  evidence:
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Humans become infected by inhaling the fungus from the environment, and the fungus initially colonizes the lungs."
    explanation: States the route and the initial site, which are this record's two claims.
  - reference: PMID:24985132
    reference_title: "Cryptococcus neoformans and Cryptococcus gattii, the etiologic agents of cryptococcosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infection proceeds via inhalation and subsequent dissemination to the central nervous system to cause meningoencephalitis."
    explanation: The same route, and the dissemination that this entry's pathophysiology follows.
pathophysiology:
- name: Inhalation and Pulmonary Colonisation
  role: trigger
  biological_scale: TISSUE
  description: >-
    Inhaled yeast cells reach the alveoli and interact first with alveolar
    macrophages. Phagocytosis may kill the organism, but it may equally
    survive or replicate inside the phagocyte, so the macrophage is both the
    first line of defence and, when defence fails, a niche. Outcome at this
    step is decided by the host's immune status rather than by the inoculum.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: ABNORMAL
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The fungal cells interact initially with alveolar macrophages in the lungs, which may lead to the phagocytosis of the organism."
    explanation: Places the first host-pathogen interaction in the alveolar macrophage, the cell this node binds.
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Macrophages may kill ingested C. neoformans; alternatively, fungal cells can survive or grow within the phagocytes, depending on the host's immune status"
    explanation: The two outcomes at this node, and the fact that immune status rather than the organism decides between them.
  downstream:
  - target: Failure of Pulmonary Containment in Advanced Immunosuppression
    causal_link_type: DIRECT
    description: >-
      Survival within the phagocyte is what allows the infection to escape the
      lung when cellular immunity cannot contain it.
- name: Failure of Pulmonary Containment in Advanced Immunosuppression
  role: amplifier
  biological_scale: ORGANISM
  description: >-
    Where cellular immunity is intact the infection stays in the lung. Where
    it is not, and the dominant cause is advanced HIV disease, containment
    fails and the organism proliferates and escapes. Cryptococcal antigenaemia
    marks this stage and precedes meningitis, which is what makes antigen
    screening in advanced HIV disease a prevention strategy rather than an
    early diagnosis.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
    modifier: DECREASED
  evidence:
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Persons at risk for cryptococcal infection have advanced HIV disease, either because they do not know their HIV status, have not engaged in outpatient HIV care and initiated ART, are on a failing ART regimen, or have had interruptions in treatment."
    explanation: Names advanced HIV disease, and the specific routes into it, as the condition under which containment fails - the claim this node makes.
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "If the immune system fails to contain C. neoformans in the lungs, the fungus can disseminate to the blood and invade the central nervous system, resulting in fatal meningoencephalitis particularly in immunocompromised individuals including HIV/AIDS patients."
    explanation: The conditional structure of this node, where containment failure is what licenses dissemination.
  downstream:
  - target: Haematogenous Dissemination and Blood-Brain Barrier Invasion
    causal_link_type: DIRECT
    description: >-
      Escape from the lung puts the organism in the bloodstream, from which
      the central nervous system is reachable.
- name: Haematogenous Dissemination and Blood-Brain Barrier Invasion
  role: effector
  biological_scale: ORGANISM
  description: >-
    The yeast enters the bloodstream and crosses the blood-brain barrier into
    the central nervous system. The tropism is marked: among the organs
    reachable by blood, the brain is where cryptococcal disease declares
    itself, and the capsule and other virulence factors modulate the immune
    response the organism meets there.
  biological_processes:
  - preferred_term: defense response to fungus
    term:
      id: GO:0050832
      label: defense response to fungus
    modifier: DECREASED
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  evidence:
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "To overcome host defenses, C. neoformans possesses multiple virulence factors capable of modulating immune responses."
    explanation: The virulence-factor contribution to surviving the host response encountered after invasion.
  - reference: PMID:24985132
    reference_title: "Cryptococcus neoformans and Cryptococcus gattii, the etiologic agents of cryptococcosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infection proceeds via inhalation and subsequent dissemination to the central nervous system to cause meningoencephalitis."
    explanation: Establishes dissemination to the central nervous system as the step between lung and meningoencephalitis.
  downstream:
  - target: Cryptococcal Meningoencephalitis
    causal_link_type: DIRECT
    description: >-
      The organism establishes infection of the meninges and brain
      parenchyma.
- name: Cryptococcal Meningoencephalitis
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Established infection of the meninges and brain parenchyma produces the
    clinical syndrome of headache, meningism and altered consciousness. This
    node is the infection itself; the raised intracranial pressure it
    commonly generates is modelled separately because it is treated
    separately, by cerebrospinal fluid drainage rather than by antifungal
    therapy.
  notes: >-
    No biological process is bound here. The node was previously bound to
    GO:0050832 defense response to fungus with modifier INCREASED, which
    asserts a heightened host antifungal response at the point where this
    entry's two upstream nodes both record it as DECREASED, and no source
    cited by this entry grades the intensity of the meningeal response.
    Searched GO for meningitis, meningeal and encephalitis terms and for
    inflammatory response terms narrower than GO:0006954; a graded claim
    about cerebrospinal fluid inflammation in this disease needs its own
    source before a direction can be asserted here.
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  evidence:
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "If the immune system fails to contain C. neoformans in the lungs, the fungus can disseminate to the blood and invade the central nervous system, resulting in fatal meningoencephalitis particularly in immunocompromised individuals including HIV/AIDS patients."
    explanation: Names meningoencephalitis as the central nervous system outcome of invasion, which is the syndrome this node represents.
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cryptococcal meningitis is the most common cause of meningitis in adults living with HIV in sub-Saharan Africa."
    explanation: The clinical weight of this node in the population where it concentrates.
  downstream:
  - target: Meningitis
    causal_link_type: DIRECT
    description: >-
      Infection of the meninges is the defining clinical finding.
  - target: Raised Intracranial Pressure from Impaired Cerebrospinal Fluid Outflow
    causal_link_type: DIRECT
    description: >-
      Infection of the subarachnoid space impairs cerebrospinal fluid
      outflow, which is the mechanism of the pressure rise.
    evidence:
    - reference: PMID:27607912
      reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Overall, 50-70% of patients with cryptococcal meningitis have raised intracranial pressure"
      explanation: Establishes that the pressure rise follows the meningitis in most but not all patients, which is why this is a separate node on a separate edge.
- name: Raised Intracranial Pressure from Impaired Cerebrospinal Fluid Outflow
  role: amplifier
  biological_scale: ORGANISM
  description: >-
    Cerebrospinal fluid outflow through the infected subarachnoid space is
    obstructed, raising intracranial pressure in half to two thirds of
    patients. The pressure is not an epiphenomenon of the infection but a
    treatable contributor to death, which is why repeated therapeutic lumbar
    puncture is standard adjunctive management and is associated with a large
    survival difference. Separating it from the infection node is what lets
    drainage and antifungal therapy be recorded as acting on different steps.
  locations:
  - preferred_term: meninx
    term:
      id: UBERON:0002360
      label: meninx
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DECREASED
  evidence:
  - reference: PMID:27607912
    reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Overall, 50-70% of patients with cryptococcal meningitis have raised intracranial pressure"
    explanation: Quantifies how common this node is among patients who reach the infection node above it.
  - reference: PMID:27607912
    reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Performance of a therapeutic lumbar puncture is associated with 69% relative survival protection."
    explanation: The survival association that makes this node a treatable contributor to death rather than an incidental finding.
  downstream:
  - target: Increased intracranial pressure
    causal_link_type: DIRECT
    description: >-
      The measured pressure elevation is the clinical expression of this node.
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Raised pressure, alongside meningeal inflammation, produces the
      presenting headache.
- name: Flucytosine Activation by Fungal Cytosine Deaminase
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "fungal_nucleic_acid_antimetabolite#Deamination to 5-Fluorouracil by Fungal Cytosine Deaminase"
  description: >-
    Cryptococcus neoformans carries the cytosine permease and cytosine
    deaminase that import flucytosine and convert it to 5-fluorouracil, a
    pathway mammalian cells lack, and this is the selectivity on which the
    drug depends. The node is a therapeutic vulnerability rather than a step
    in the disease, and it is recorded here because the trial evidence
    identifies flucytosine specifically, not antifungal therapy in general, as
    the component that changes mortality.
  biological_processes:
  - preferred_term: pyrimidine nucleobase catabolic process
    term:
      id: GO:0006208
      label: pyrimidine nucleobase catabolic process
  evidence:
  - reference: PMID:29539274
    reference_title: Antifungal Combinations for Treatment of Cryptococcal Meningitis in Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a partner drug with amphotericin B, flucytosine was superior to fluconazole"
    explanation: Identifies flucytosine, against an active comparator, as the partner drug that changes survival, which is what makes this pathway a vulnerability worth modelling in this disease.
  - reference: PMID:35320642
    reference_title: Single-Dose Liposomal Amphotericin B Treatment for Cryptococcal Meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a single high dose of liposomal amphotericin B (10 mg per kilogram of body weight) on day 1 plus 14 days of flucytosine (100 mg per kilogram per day) and fluconazole (1200 mg per day)"
    explanation: Flucytosine retained in the regimen that changed the amphotericin component, which shows the drug is a fixed part of induction rather than interchangeable.
- name: Amphotericin B Extraction of Membrane Ergosterol
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "fungal_membrane_ergosterol_binding#Polyene Binding and Ergosterol Extraction / Pore Formation"
  description: >-
    The second half of induction therapy acts on a target that is not an enzyme
    at all. Amphotericin B is an amphiphilic macrolactone that engages
    Cryptococcus neoformans membrane ergosterol directly: large extramembranous
    aggregates physically pull the sterol out of the bilayer, and binding
    ergosterol rather than the minor pore-forming fraction is what makes the
    drug fungicidal. Selectivity rests on a single fungal-specific feature,
    since polyenes bind ergosterol more avidly than the mammalian cholesterol
    that replaces it, and the discrimination being imperfect is why the drug
    carries dose-limiting nephrotoxicity and why the liposomal formulation
    exists. Two consequences matter for this disease specifically. Because the
    target is a finished membrane lipid rather than a mutable gene product,
    clinically significant polyene resistance in cryptococcal disease is rare,
    which is why a drug in use for five decades remains the induction backbone.
    And because the killing is physicochemical rather than
    replication-dependent, it clears organisms from cerebrospinal fluid at a
    rate that can be measured directly, which is the endpoint the
    single-high-dose liposomal regimen was judged on. This node is a
    therapeutic vulnerability rather than a step in the disease.
  notes: >-
    No biological_processes or molecular_functions term is bound here, following
    the module node this conforms to, which records the reason on itself: the
    polyene mechanism is a direct drug-lipid interaction, and GO's
    biological-process and molecular-function branches describe gene-product
    activities, so any term would misrepresent a physical sterol-extraction
    event. The ergosterol substrate is annotated on the module's upstream
    trigger node rather than duplicated here.
  evidence:
  - reference: PMID:24681535
    reference_title: "Amphotericin forms an extramembranous and fungicidal sterol sponge."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      amphotericin exists primarily in the form of large, extramembranous
      aggregates that kill yeast by extracting ergosterol from lipid bilayers
    explanation: >-
      The mechanism this node asserts, and the result that displaced the older
      ion-channel account as the primary cytocidal route. Graded IN_VITRO as the
      work is solid-state NMR and cell-based; the same sentence carries the same
      grading on the module node.
  - reference: PMID:35320642
    reference_title: Single-Dose Liposomal Amphotericin B Treatment for Cryptococcal Meningitis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fungal clearance from cerebrospinal fluid was -0.40 log10 colony-forming units (CFU) per milliliter per day in the liposomal amphotericin B group and -0.42 log10 CFU per milliliter per day in the control group."
    explanation: >-
      The measured antifungal effect in this disease, at the site that kills
      patients. Recorded as INDIRECT because clearance rate supports the
      fungicidal mechanism this node names by an inference step rather than
      measuring sterol extraction.
phenotypes:
- name: Meningitis
  category: Clinical
  description: >-
    Inflammation of the meninges from established cryptococcal infection, the
    defining clinical presentation and the basis of diagnosis on
    cerebrospinal fluid examination.
  phenotype_term:
    preferred_term: cryptococcal meningitis
    term:
      id: HP:0001287
      label: Meningitis
  evidence:
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cryptococcal meningitis is the most common cause of meningitis in adults living with HIV in sub-Saharan Africa."
    explanation: Meningitis as the presenting syndrome, and its epidemiological weight.
- name: Headache
  category: Clinical
  description: >-
    The usual presenting symptom, driven by meningeal inflammation and raised
    intracranial pressure, and often the reason a lumbar puncture is
    performed.
  phenotype_term:
    preferred_term: headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:23457857
    reference_title: The prevalence, clinical features, risk factors and outcome associated with cryptococcal meningitis in HIV positive patients in Kenya.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Common clinical manifestations among CM patients included headache 103 (93%), neck stiffness 76 (69%) and weight loss 53 (48%)."
    explanation: Measures headache in 93% of a cryptococcal meningitis cohort of HIV-positive adults, which is the basis for calling it the usual presenting symptom.
- name: Nuchal rigidity
  category: Clinical
  description: >-
    Neck stiffness from meningeal irritation, a common presenting sign though
    less consistently present than in acute bacterial meningitis because the
    cryptococcal inflammatory response is blunted.
  phenotype_term:
    preferred_term: nuchal rigidity
    term:
      id: HP:0031179
      label: Nuchal rigidity
  evidence:
  - reference: PMID:23457857
    reference_title: The prevalence, clinical features, risk factors and outcome associated with cryptococcal meningitis in HIV positive patients in Kenya.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Common clinical manifestations among CM patients included headache 103 (93%), neck stiffness 76 (69%) and weight loss 53 (48%)."
    explanation: Reports neck stiffness in 69% of the same HIV-positive cryptococcal meningitis cohort, above the 10% threshold for a curated phenotype.
- name: Weight loss
  category: Clinical
  description: >-
    Constitutional weight loss accompanying the subacute course, reflecting the
    systemic burden of disseminated infection and advanced HIV in most cases.
  phenotype_term:
    preferred_term: weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:23457857
    reference_title: The prevalence, clinical features, risk factors and outcome associated with cryptococcal meningitis in HIV positive patients in Kenya.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Common clinical manifestations among CM patients included headache 103 (93%), neck stiffness 76 (69%) and weight loss 53 (48%)."
    explanation: Reports weight loss in 48% of the same HIV-positive cryptococcal meningitis cohort, above the 10% threshold for a curated phenotype.
- name: Increased intracranial pressure
  category: Clinical
  description: >-
    Raised intracranial pressure in half to two thirds of patients, which
    contributes directly to mortality and is managed by repeated therapeutic
    lumbar puncture rather than by antifungal therapy alone.
  phenotype_term:
    preferred_term: raised intracranial pressure
    term:
      id: HP:0002516
      label: Increased intracranial pressure
  evidence:
  - reference: PMID:27607912
    reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Overall, 50-70% of patients with cryptococcal meningitis have raised intracranial pressure"
    explanation: The prevalence of this phenotype within the disease.
    directness: DIRECT
  - reference: PMID:27607912
    reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Performance of a therapeutic lumbar puncture is associated with 69% relative survival protection."
    explanation: Establishes the phenotype as a treatable contributor to death rather than an incidental finding.
diagnosis:
- name: Cryptococcal antigen detection
  description: >-
    Cryptococcal antigen is detectable in blood weeks to months before
    meningitis symptoms begin and is the test the disease is diagnosed and
    screened for on. In a Kenyan series of adults presenting with suspected
    cryptococcal meningitis it made the diagnosis in a third of them. The
    lateral flow device is what makes antigen screening in advanced HIV
    disease a prevention strategy rather than an early diagnosis, which is
    the claim the containment-failure node above records.
  diagnosis_term:
    preferred_term: cryptococcal antigen lateral flow assay
    term:
      id: NCIT:C154829
      label: Cryptococcus Antigen Measurement
  evidence:
  - reference: PMID:23457857
    reference_title: The prevalence, clinical features, risk factors and outcome associated with cryptococcal meningitis in HIV positive patients in Kenya.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Of three hundred and forty suspected CM patients, 111 (33%) were diagnosed with CM by CrAg."
    explanation: The diagnostic yield of this test in a cohort of adults presenting with suspected cryptococcal meningitis.
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cryptococcal antigen detection using FDA approved lateral flow devices is perhaps the ultimate test in microbiology – highly accurate, quick, easy to read, and inexpensive."
    explanation: The authors' assessment of the lateral flow device, which is why antigen detection rather than culture is the entry point.
- name: Lumbar puncture with cerebrospinal fluid examination
  description: >-
    Lumbar puncture establishes meningitis in someone already known to carry
    cryptococcal antigen, and measures the opening pressure that decides
    whether the pressure node needs treating in its own right. The same
    procedure is the therapeutic intervention curated below, which is why
    recording it here is not duplication: the diagnostic reading and the
    drainage are different claims about one act.
  diagnosis_term:
    preferred_term: diagnostic lumbar puncture with cerebrospinal fluid examination
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  evidence:
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "With wider implementation of lumbar punctures to identify early meningitis among CrAg-positive people, especially those who are symptomatic or with high CrAg titers, more deaths could be averted."
    explanation: Names lumbar puncture as the step that identifies meningitis in antigen-positive people, which is the diagnostic role this record describes.
  notes: >-
    No opening-pressure reference range is recorded. Manometry is standard of
    care in this disease and the cited sources say so, but none of them
    states a numeric threshold in a quotable sentence, and a cut-off written
    from memory is exactly what the reference-range slot must not carry.
prevalence:
- population: Adults living with HIV, worldwide, 2020
  measure_type: ANNUAL_INCIDENCE
  notes: >-
    The source reports 152,000 incident cases a year as an absolute global
    estimate in adults with HIV, not as a rate, and gives no at-risk
    denominator to turn it into one. No rate_per_100000 is recorded here for
    that reason: dividing the count by a world population of about 8 billion
    would describe the whole population rather than the at-risk group and would
    not be a risk estimate for anyone with HIV. The informative figures are the
    absolute case and death counts and the mortality share, which the evidence
    below carries.
  evidence:
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annually, we estimated that there are 152 000 cases (111 000-185 000) of cryptococcal meningitis, resulting in 112 000 cryptococcal-related deaths (79 000-134 000)."
    explanation: The absolute annual case and death estimates this record normalizes.
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Globally, cryptococcal disease accounts for 19% (13-24) of AIDS-related mortality."
    explanation: The mortality share, which conveys the burden better than a population rate does.
treatments:
- name: Amphotericin B plus Flucytosine Induction Therapy
  description: >-
    Induction antifungal therapy pairing amphotericin B with flucytosine, now
    deliverable as a single high dose of liposomal amphotericin B with
    fourteen days of flucytosine, which is noninferior to the previous
    week-long amphotericin schedule and better tolerated. Flucytosine is the
    partner drug that changes mortality, with a hazard ratio for death at ten
    weeks of 0.62 against fluconazole as comparator.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antifungal induction therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: amphotericin B
      term:
        id: CHEBI:2682
        label: amphotericin B
    - preferred_term: flucytosine
      term:
        id: CHEBI:5100
        label: flucytosine
  target_mechanisms:
  - target: Amphotericin B Extraction of Membrane Ergosterol
    treatment_effect: ACTIVATES
    description: >-
      The polyene half of the regimen. This node is the drug's own action, the
      binding and extraction of membrane ergosterol, so the treatment engages
      it rather than inhibiting it, exactly as the flucytosine link below
      engages its activation node. What is disrupted downstream, in the module,
      is the integrity of the fungal membrane the extracted sterol supported.
      Paired with the flucytosine link, the two edges make the regimen's two
      drugs reach two different modules, which is what the combination buys.
    evidence:
    - reference: PMID:35320642
      reference_title: Single-Dose Liposomal Amphotericin B Treatment for Cryptococcal Meningitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the upper boundary of the one-sided 95% confidence interval was 1.2 percentage points (within the noninferiority margin; P<0.001 for noninferiority)"
      explanation: Establishes that the amphotericin component is what the trial varied and found noninferior, so the link is to a drug whose contribution was tested rather than assumed.
  - target: Flucytosine Activation by Fungal Cytosine Deaminase
    treatment_effect: ACTIVATES
    description: >-
      Flucytosine is a prodrug with no intrinsic antifungal activity, so the
      therapy works by being activated through this fungal pathway. The
      treatment engages the node rather than inhibiting it; what the resulting
      5-fluorouracil inhibits is fungal nucleic acid synthesis downstream, in
      the module.
    evidence:
    - reference: PMID:29539274
      reference_title: Antifungal Combinations for Treatment of Cryptococcal Meningitis in Africa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As a partner drug with amphotericin B, flucytosine was superior to fluconazole"
      explanation: The effect attributable to flucytosine specifically, which is what this link claims.
  evidence:
  - reference: PMID:35320642
    reference_title: Single-Dose Liposomal Amphotericin B Treatment for Cryptococcal Meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the upper boundary of the one-sided 95% confidence interval was 1.2 percentage points (within the noninferiority margin; P<0.001 for noninferiority)"
    explanation: The noninferiority result for the single-dose liposomal regimen this treatment describes.
  - reference: PMID:35320642
    reference_title: Single-Dose Liposomal Amphotericin B Treatment for Cryptococcal Meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fungal clearance from cerebrospinal fluid was -0.40 log10 colony-forming units (CFU) per milliliter per day in the liposomal amphotericin B group and -0.42 log10 CFU per milliliter per day in the control group."
    explanation: Microbiological equivalence alongside the mortality endpoint, measured in the compartment this disease occupies.
- name: Therapeutic Lumbar Puncture
  description: >-
    Repeated drainage of cerebrospinal fluid to relieve raised intracranial
    pressure, recommended by multiple international guidelines as adjunctive
    management and associated with a large relative survival benefit. It
    treats the pressure, not the infection.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic lumbar puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  target_mechanisms:
  - target: Raised Intracranial Pressure from Impaired Cerebrospinal Fluid Outflow
    treatment_effect: INHIBITS
    description: >-
      Drainage lowers intracranial pressure without affecting fungal burden,
      so it acts on this node and not on the infection node above it.
    evidence:
    - reference: PMID:27607912
      reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Performance of a therapeutic lumbar puncture is associated with 69% relative survival protection."
      explanation: The survival association that justifies treating the pressure as a target in its own right.
  evidence:
  - reference: PMID:27607912
    reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Therapeutic lumbar punctures are a critical part of cryptococcal meningitis management and CSF immunological assays are increasingly being performed in research settings."
    explanation: The review's own summary of the procedure's place in management.
  - reference: PMID:27607912
    reference_title: "Repeated therapeutic lumbar punctures in cryptococcal meningitis - necessity and/or opportunity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Multiple international treatment guidelines recommend repeated therapeutic lumbar punctures as adjunctive management."
    explanation: Records the guideline status of this procedure as adjunctive management, which is the claim this treatment's description makes.
- name: Cryptococcal Antigen Screening with Pre-emptive Fluconazole
  description: >-
    Prevention rather than treatment of established meningitis: people with
    advanced HIV are screened for serum cryptococcal antigen before symptoms,
    and those who test positive are given fluconazole to stop antigenaemia
    progressing to meningitis. Delivered with short-term adherence support at
    ART start, this reduced all-cause mortality in a randomised trial in
    Tanzania and Zambia.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: pre-emptive antifungal pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fluconazole
      term:
        id: CHEBI:46081
        label: fluconazole
  evidence:
  - reference: PMID:25765698
    reference_title: "Cryptococcal meningitis screening and community-based early adherence support in people with advanced HIV infection starting antiretroviral therapy in Tanzania and Zambia: an open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening and pre-emptive treatment for cryptococcal infection combined with a short initial period of adherence support after initiation of ART could substantially reduce mortality in HIV programmes in Africa."
    explanation: The trial's conclusion that CrAg screening plus pre-emptive antifungal therapy at ART start reduces mortality, the basis for this prevention strategy.
- name: Deferred Antiretroviral Therapy Initiation
  description: >-
    A timing decision, not an antifungal: in a person presenting with
    cryptococcal meningitis who is not yet on antiretroviral therapy, starting
    ART is deferred by about four to five weeks rather than begun immediately.
    Starting ART too early restores an inflammatory response to residual
    cryptococcal antigen in the central nervous system (immune reconstitution
    inflammatory syndrome), and the COAT trial found that earlier initiation
    carried higher mortality, concentrated in the first few weeks.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: antiretroviral therapy timing
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:24963568
    reference_title: Timing of antiretroviral therapy after diagnosis of cryptococcal meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The excess deaths associated with earlier ART initiation occurred 2 to 5 weeks after diagnosis"
    explanation: The COAT trial result that earlier ART raised early mortality, the evidence for deferring initiation after a cryptococcal meningitis diagnosis.
progression:
- phase: Cryptococcal antigenaemia
  notes: >-
    Detectable cryptococcal antigen without meningitis, the stage that
    precedes central nervous system disease in advanced HIV and the one
    antigen screening is designed to catch. An estimated 179,000 people were
    antigenaemic globally in 2020 against 152,000 annual meningitis cases, so
    not every antigenaemic person progresses.
  evidence:
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corresponding to 179 000 cases (IQR 133 000-219 000) of cryptococcal antigenaemia globally in 2020"
    explanation: The antigenaemic population this phase describes.
  - reference: PMID:36049486
    reference_title: "The global burden of HIV-associated cryptococcal infection in adults in 2020: a modelling analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We estimated progression from cryptococcal antigenaemia to meningitis or death based on estimates from the published literature."
    explanation: Confirms that progression from this phase to meningitis is a modelled transition rather than an assumed one.
- phase: Cryptococcal meningitis
  notes: >-
    Established central nervous system disease, carrying 10-week mortality of
    roughly a quarter to two fifths even on trial-standard induction therapy.
  evidence:
  - reference: PMID:29539274
    reference_title: Antifungal Combinations for Treatment of Cryptococcal Meningitis in Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cryptococcal meningitis accounts for more than 100,000 human immunodeficiency virus (HIV)-related deaths per year."
    explanation: The lethality of this phase, stated by the trial that measured its mortality under three regimens.
- phase: Cryptococcal immune reconstitution inflammatory syndrome
  notes: >-
    A paradoxical worsening that can follow antiretroviral therapy once immune
    function recovers, despite effective antifungal treatment of the infection.
    It is the reason ART is deferred rather than started immediately after a
    meningitis diagnosis (see the Deferred Antiretroviral Therapy Initiation
    treatment), and it is a distinct post-treatment phase rather than a step in
    the untreated course above.
  evidence:
  - reference: PMID:24963568
    reference_title: Timing of antiretroviral therapy after diagnosis of cryptococcal meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the immune reconstitution inflammatory syndrome (IRIS), a paradoxical reaction that occurs during immunologic recovery with ART despite effective therapy for the opportunistic infection"
    explanation: Defines cryptococcal IRIS as the paradoxical reaction during ART-driven immune recovery that this phase records.
discussions:
- discussion_id: gap_cryptococcal_cns_tropism
  prompt: >-
    Why does Cryptococcus neoformans, which reaches the bloodstream from the
    lung, declare itself in the central nervous system rather than in other
    perfused organs, and what determines whether a disseminating infection
    crosses the blood-brain barrier?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Haematogenous Dissemination and Blood-Brain Barrier Invasion
  rationale: >-
    The dissemination node records the tropism as an observation and does not
    explain it. The review cited there frames barrier crossing as a current
    question and describes candidate routes without settling which operates in
    human disease, and the entry's own chain therefore contains no mechanism
    for organ selection. This matters for prevention rather than for
    treatment: antigen screening works on the stage before invasion, so
    knowing what commits a disseminating infection to the brain would identify
    whom to treat pre-emptively.
  evidence:
  - reference: PMID:36294634
    reference_title: "Cryptococcus neoformans Infection in the Central Nervous System: The Battle between Host and Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To enter the brain, C. neoformans must cross the BBB, and three major pathways have been proposed for crossing the BBB including Trojan horse, transcytosis, and paracellular crossing"
    explanation: Records that three candidate routes across the blood-brain barrier are proposed rather than one established, which is the open question this gap states. The review's own account of the state of the field, so it is graded OTHER rather than as a study result.

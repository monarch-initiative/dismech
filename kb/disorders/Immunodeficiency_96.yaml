name: Immunodeficiency 96
creation_date: "2026-09-07T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 96
  term:
    id: MONDO:0030693
    label: immunodeficiency 96
description: >
  Immunodeficiency 96 (IMD96; OMIM 619774), also called DNA ligase I deficiency
  or LIG1 syndrome, is an ultra-rare autosomal recessive inborn error of
  immunity caused by biallelic hypomorphic variants in LIG1. LIG1 encodes DNA
  ligase 1, the replicative ligase that seals the roughly fifty million nicks
  left between Okazaki fragments in every round of lagging-strand synthesis and
  that also completes the final ligation step of base excision, nucleotide
  excision and mismatch repair.

  The defining laboratory picture is hypogammaglobulinemia with lymphopenia, an
  increased proportion of circulating gamma-delta T cells, and erythrocyte
  macrocytosis, on a background of cellular hypersensitivity to ionizing
  radiation and alkylating agents. Clinically the disease is a spectrum rather
  than a single presentation, running from a CVID-like antibody deficiency
  managed with immunoglobulin replacement to T-B-NK+ severe combined
  immunodeficiency with Omenn-like features requiring haematopoietic stem cell
  transplantation in infancy. The spread is not explained by genotype alone:
  within one consanguineous kindred, three relatives homozygous for the same two
  variants split into two brothers transplanted for SCID and a cousin managed on
  immunoglobulin and antibiotics.

  Two things make the entry mechanistically distinctive. First, no patient has
  ever been reported with complete biallelic loss of LIG1; every published
  genotype retains at least one allele with residual catalytic activity, which
  is read in the literature as evidence that a true null is not survivable.
  Second, and unlike DNA ligase IV deficiency - whose immunodeficiency is
  cleanly explained by failed V(D)J recombination - the route from a general
  replicative ligation defect to a lineage-weighted immune failure is not
  established. That gap is curated explicitly rather than papered over with a
  plausible chain.

synonyms:
- IMD96
- DNA ligase I deficiency
- DNA ligase 1 deficiency
- LIG1 deficiency
- LIG1 syndrome
- immunodeficiency, autosomal recessive due to LIG1 deficiency

parents:
- Inborn error of immunity
- DNA repair disorder
- Chromosomal instability syndrome


      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RASGRP1 deficiency is a rare inborn error of immunity characterized by immunodeficiency, autoimmunity, and lymphoproliferation."
      explanation: >
        An inborn error of immunity with autoimmunity and lymphoproliferation,
        placing it in Harrison's immune/rheumatologic Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:27776107
      reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we used homozygosity mapping and exome sequencing to identify a biallelic stop-gain variant in RASGRP1"
      explanation: >
        A biallelic Mendelian disorder identified by homozygosity mapping,
        placing it in Harrison's genetics Part.
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      Both cellular and humoral compartments are functionally affected - ERK
      phosphorylation is reduced in T cells and B cells alike, and
      proliferation, activation and motility are defective in both - so the
      combined-immunodeficiency placement reflects measured biology rather
      than the disease name. NK cytotoxicity is also impaired, by a separate
      cytoskeletal mechanism.
    evidence:
    - reference: PMID:27776107
      reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RASGRP1 deficiency also resulted in defective proliferation, activation and motility of T cells and B cells."
      explanation: >-
        Documents functional impairment of both T and B lymphocytes, the basis
        for classifying this as a combined rather than isolated T cell defect.
        Graded IN_VITRO because the quoted result is from assays on patient
        cells, not a clinical observation.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    The index kindred was consanguineous with a homozygous stop-gain variant
    segregating perfectly with disease; subsequently reported patients carry
    homozygous or compound heterozygous loss-of-function alleles, including
    homozygous splice-donor variants.
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a patient with recurrent bacterial and viral infections, born to healthy consanguineous parents, we used homozygosity mapping and exome sequencing to identify a biallelic stop-gain variant in RASGRP1."
    explanation: >
      Healthy consanguineous parents with a biallelic variant in the affected
      child is the classic autosomal recessive configuration.

notes: >
  About fifteen patients reported. Where this entry gives a percentage it comes
  from the 2026 systematic review of 14 previously reported cases plus one new
  patient, and the denominator is that aggregated cohort - not a population.

  Named Entity Confusion warning for future curators and for dataset/literature
  searches on this gene: common regulatory variants at the RASGRP1 locus are
  replicated GWAS susceptibility alleles for East Asian SLE, rheumatoid
  arthritis, Hashimoto thyroiditis and IgA nephropathy. Those are
  population-level dosage-modifying alleles and a different claim entirely from
  the rare biallelic null alleles that cause IMD64. This entry curates only the
  monogenic disease; the GWAS literature is deliberately not cited as evidence
  for any node here, because a common-variant association at a locus is not
  evidence about a Mendelian mechanism.

pathophysiology:
- name: Biallelic RASGRP1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    Stop-gain, other truncating, and splice-donor alleles, all biallelic. The
    structural basis for why truncation is catastrophic is known: RASGRP1 is
    held autoinhibited, with its RAS-binding catalytic site blocked by an
    interdomain linker and its membrane-interaction surface buried in a
    dimerization interface stabilised by the C-terminal oligomerization domain.
    Calcium binding to the EF-hand regulatory module drives the conformational
    change that releases it. Truncating alleles remove the catalytic or
    regulatory modules that convert the calcium/DAG signal into RAS-GTP
    loading, so there is no partial-activity state to fall back on.
  genes:
  - preferred_term: RASGRP1
    term:
      id: hgnc:9878
      label: RASGRP1
    modifier: DECREASED
  genetic_context:
    description: >-
      Biallelic loss-of-function RASGRP1 alleles - homozygous stop-gain in the
      index kindred, with subsequently reported truncating and splice-donor
      alleles.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant segregated perfectly with the disease and has not been reported in genetic databases."
    explanation: >
      Perfect segregation plus absence from population databases is the human
      genetic evidence for causality.
  - reference: PMID:30030704
    reference_title: "Novel Mutations in RASGRP1 are Associated with Immunodeficiency, Immune Dysregulation, and EBV-Induced Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening identified two novel loss-of-function mutations in RASGRP1."
    explanation: >
      Independent replication of loss-of-function RASGRP1 alleles in unrelated
      patients.
  - reference: PMID:23908768
    reference_title: "Structural analysis of autoinhibition in the Ras-specific exchange factor RasGRP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These features allow RasGRP1 to be maintained in an inactive state that is poised for activation by calcium and membrane-localization signals."
    explanation: >
      Establishes the autoinhibited architecture whose catalytic and
      regulatory modules truncating alleles remove. Graded INDIRECT because it
      characterises wild-type protein architecture, not the patient variants.
    directness: INDIRECT
  downstream:
  - target: Collapse of TCR-to-RAS-ERK Signal Transduction
    description: Loss of the exchange factor that loads RAS with GTP downstream of the TCR.
  - target: Loss of RASGRP1-DYNLL1 Cytoskeletal Coupling
    description: >
      The same protein loss removes a RAS-independent link to cytoskeletal
      regulation.

- name: Collapse of TCR-to-RAS-ERK Signal Transduction
  biological_scale: MOLECULAR
  description: >
    The catalytic arm. RASGRP1 deficiency reduces RAS-GTPase activity and
    decreases ERK phosphorylation in both T cells and B cells; re-expression of
    wild-type RASGRP1 restores ERK phosphorylation, which is what makes this a
    demonstrated causal step rather than a correlation.
  molecular_functions:
  - preferred_term: Ras guanyl-nucleotide exchange factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: DECREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RASGRP1 deficiency was associated in T cells and B cells with decreased phosphorylation of the extracellular-signal-regulated serine kinase ERK, which was restored following expression of wild-type RASGRP1."
    explanation: >
      Reduced ERK phosphorylation in both lineages with wild-type rescue -
      the core causal demonstration for the catalytic arm.
  - reference: PMID:30030704
    reference_title: "Novel Mutations in RASGRP1 are Associated with Immunodeficiency, Immune Dysregulation, and EBV-Induced Lymphoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblotting and active Ras pull-down assays confirmed perturbed ERK1/2 signaling and reduced Ras-GTPase activity"
    explanation: >
      Independent biochemical confirmation, measuring RAS-GTP loading directly
      rather than inferring it from ERK.
  downstream:
  - target: Defective Antigen-Driven Lymphocyte Proliferation and Activation
    description: Loss of the principal proliferative signal downstream of the TCR.

- name: Loss of RASGRP1-DYNLL1 Cytoskeletal Coupling
  biological_scale: MOLECULAR
  description: >
    The second, RAS-independent arm. Interaction proteomics identified the
    dynein light chain DYNLL1 as a RASGRP1 interactor, and RASGRP1-deficient
    cells show decreased activation of the GTPase RhoA. This is the arm that
    explains the immune-synapse and motility phenotypes, which do not follow
    from reduced ERK signalling.
  biological_processes:
  - preferred_term: Rho protein signal transduction
    modifier: DECREASED
    term:
      id: GO:0007266
      label: Rho protein signal transduction
  - preferred_term: actin cytoskeleton organization
    modifier: DECREASED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interaction proteomics identified the dynein light chain DYNLL1 as interacting with RASGRP1, which links RASGRP1 to cytoskeletal dynamics."
    explanation: >
      Establishes the physical interaction that is the basis for the
      cytoskeletal arm.
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RASGRP1-deficient cells showed decreased activation of the GTPase RhoA."
    explanation: >
      The measured signalling consequence of losing the cytoskeletal coupling.
  downstream:
  - target: Impaired NK Cell Cytotoxic Synapse Assembly
    description: Reduced RhoA activity impairs granule convergence and actin accumulation.

- name: Impaired NK Cell Cytotoxic Synapse Assembly
  biological_scale: CELLULAR
  description: >
    RASGRP1-deficient NK cells are impaired in cytotoxicity with defective
    granule convergence and actin accumulation - a synapse-assembly failure
    rather than a cell-number deficit. Reversible in principle: lenalidomide
    increases RhoA activity and reverses the migration and activation defects
    of RASGRP1-deficient lymphocytes.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    modifier: DECREASED
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RASGRP1-deficient natural killer (NK) cells exhibited impaired cytotoxicity with defective granule convergence and actin accumulation."
    explanation: >
      Locates the NK defect at synapse assembly - granule convergence and
      actin - rather than at NK cell development or number.

- name: Defective Antigen-Driven Lymphocyte Proliferation and Activation
  biological_scale: CELLULAR
  description: >
    Proliferation, activation and motility are all defective in T and B cells.
    Motility is the item worth noticing: it is a cytoskeletal readout appearing
    alongside the proliferative ones, so both upstream arms converge here.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: positive regulation of T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042102
      label: positive regulation of T cell proliferation
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RASGRP1 deficiency also resulted in defective proliferation, activation and motility of T cells and B cells."
    explanation: >
      The cellular phenotype shared by both lymphocyte lineages.
  downstream:
  - target: Failed Expansion of EBV-Specific CD8-Positive T Cells
    description: >
      Antigen-driven expansion is the specific function EBV control depends
      on.

- name: Failed Expansion of EBV-Specific CD8-Positive T Cells
  biological_scale: CELLULAR
  description: >
    The step that makes IMD64 an EBV disease specifically. RASGRP1 is grouped
    with MAGT1 and ITK as genes whose mutation causes defective expansion of
    EBV-specific CD8+ T cells, and therefore failure to eliminate proliferating
    EBV-infected B cells. This is a shared final common path across a family of
    inborn errors, reached here through a TCR-proximal signalling defect.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: "CD8-positive, alpha-beta T cell"
  evidence:
  - reference: PMID:31402499
    reference_title: "Signaling pathways involved in the T-cell-mediated immunity against Epstein-Barr virus: Lessons from genetic diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the defective expansion of EBV-specific CD8 T cells results from mutations in genes involved in T-cell activation (such as RASGRP1, MAGT1, and ITK)"
    explanation: >
      Places RASGRP1 explicitly in the group of T-cell-activation genes whose
      loss prevents EBV-specific CD8+ T cell expansion.
  - reference: PMID:37898412
    reference_title: "A novel homozygous mutation in RASGRP1 that predisposes to immune dysregulation and immunodeficiency associated with uncontrolled Epstein-Barr virus-induced B cell proliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T cells from the patient showed severe activation defects resulting in uncontrolled Epstein-Bar Virus-induced B cell proliferation"
    explanation: >
      Directly links the patient's T cell activation defect to failure of EBV
      control.
  downstream:
  - target: EBV-Driven B Cell Lymphoproliferation and Lymphoma
    description: Unchecked proliferation of EBV-infected B cells.

- name: EBV-Driven B Cell Lymphoproliferation and Lymphoma
  biological_scale: ORGANISM
  description: >
    The characteristic and most dangerous outcome: EBV-associated
    lymphoproliferative disease with susceptibility to EBV-induced B cell
    malignancies.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:30030704
    reference_title: "Novel Mutations in RASGRP1 are Associated with Immunodeficiency, Immune Dysregulation, and EBV-Induced Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RASGRP1 deficiency is associated with life-threatening immune dysregulation, severe autoimmune manifestations, and susceptibility to EBV-induced B cell malignancies"
    explanation: >
      Reports the lymphoproliferative and malignant endpoint together with the
      autoimmune arm.

- name: Immune Dysregulation with Autoimmunity and Vasculopathy
  biological_scale: ORGANISM
  description: >
    A second clinical arm, and the one whose weight has grown with reporting.
    Alongside cytopenic autoimmunity, the 2026 systematic review identifies
    vascular autoimmunity as an emerging life-threatening phenotype: the index
    case of that report had severe vasculopathy with ischaemic stroke and
    thrombosis, secondary antiphospholipid syndrome, and fatal refractory
    autoimmune haemolytic anaemia. This entry records vasculopathy as emerging
    rather than established, following the source's own framing.
  evidence:
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 5-year-old male with novel homozygous splice-donor mutations in RASGRP1(c.1720+1G>A and c.1720+2T>C) who presented with severe vasculopathy (ischemic stroke and thrombosis), secondary antiphospholipid syndrome, and fatal refractory autoimmune hemolytic anemia."
    explanation: >
      The index case establishing the severity of the vascular and
      cytopenic-autoimmune arm.

mechanistic_hypotheses:
- hypothesis_group_id: rasgrp1_dual_arm
  hypothesis_label: RASGRP1 deficiency acts through parallel catalytic (RAS-ERK) and cytoskeletal (DYNLL1-RhoA) arms
  status: EMERGING
  description: >
    The claim is that the NK synapse and lymphocyte motility defects are not
    downstream of reduced ERK signalling but arise from a separate RASGRP1
    function, mediated by DYNLL1 and read out as reduced RhoA activation. The
    strongest support is pharmacological rather than genetic: lenalidomide
    raises RhoA activity and reverses the migration and activation defects
    without addressing the RAS exchange lesion. If the two arms were serial,
    a RhoA-directed intervention should not rescue anything.

discussions:
- discussion_id: rasgrp1_lenalidomide_translational_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Lenalidomide
  - pathophysiology#Loss of RASGRP1-DYNLL1 Cytoskeletal Coupling
  prompt: >-
    Does lenalidomide's reversal of the RhoA, migration and activation defects
    in RASGRP1-deficient cells translate into clinical benefit in patients?
  rationale: >-
    The lenalidomide result is an ex vivo cellular rescue reported in the
    original description. No trial, cohort, or case series establishing
    clinical benefit in RASGRP1 deficiency has been reported, and the 2026
    systematic review states that transplantation remains the only curative
    therapy. The gap is worth recording rather than glossing because a
    mechanism-based rescue in patient cells is exactly the kind of finding
    that gets cited as if it were a therapy.
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with lenalidomide increased RhoA activity and reversed the migration and activation defects of RASGRP1-deficient lymphocytes."
    explanation: >-
      The cellular result whose clinical translation is unknown.
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation remains the only curative therapy, as conservative management carries high mortality."
    explanation: >-
      Establishes that as of the most recent systematic review no
      pharmacological therapy, lenalidomide included, is curative.


biochemical:
- name: Antiphospholipid Antibody Panel
  notes: >
    Positive lupus anticoagulant with elevated anti-beta-2-glycoprotein and
    anti-cardiolipin titres in the index case, supporting a diagnosis of
    secondary antiphospholipid syndrome. These are the serological markers that
    make the vascular arm an autoimmune process rather than an unexplained
    thrombotic one. Recorded as a single panel rather than three markers
    because the source reports them as one result supporting one diagnosis.
  evidence:
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A comprehensive autoimmune panel revealed significantly positive results for lupus anticoagulant and elevated titers of anti\u2010beta\u20102 glycoprotein and anti\u2010cardiolipin antibodies, supporting a diagnosis of secondary antiphospholipid syndrome (APS)"
    explanation: >
      Documents the three antiphospholipid markers and the resulting diagnosis.

genetic:
- name: RASGRP1
  gene_term:
    preferred_term: RASGRP1
    term:
      id: hgnc:9878
      label: RASGRP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    RASGRP1 encodes a calcium- and diacylglycerol-regulated guanine nucleotide
    exchange factor that activates RAS downstream of the T cell antigen
    receptor. The protein is normally autoinhibited, with the RAS-binding site
    blocked by an interdomain linker and the membrane-interaction surface
    buried in a dimerization interface; calcium binding to the EF-hand
    regulatory module releases it. Disease alleles are biallelic and
    loss-of-function - stop-gain, other truncating, and splice-donor.
  review_notes: >-
    Do not conflate with the common regulatory variants at this locus that are
    GWAS susceptibility alleles for SLE, rheumatoid arthritis, Hashimoto
    thyroiditis and IgA nephropathy. Those alter RASGRP1 dosage at population
    level and would be `relationship_type: SUSCEPTIBILITY` against those
    diseases; they are not evidence about IMD64 and are not cited here. No
    ClinGen gene-disease validity assertion for RASGRP1 in IMD64 exists to
    cite, but the human genetics (perfect segregation, absence from
    population databases, independent replication in unrelated kindreds) plus
    wild-type rescue of the ERK defect support CAUSATIVE.
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RASGRP1 is an important guanine nucleotide exchange factor and activator of the RAS-MAPK pathway following T cell antigen receptor (TCR) signaling."
    explanation: >
      States the normal molecular function whose loss defines the disease.
  - reference: PMID:30030704
    reference_title: "Novel Mutations in RASGRP1 are Associated with Immunodeficiency, Immune Dysregulation, and EBV-Induced Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening identified two novel loss-of-function mutations in RASGRP1."
    explanation: >
      Independent replication of the gene-disease relationship in unrelated
      patients.

diagnosis:
- name: Lymphocyte Activation and Proliferation Testing
  description: >
    Functional immunology is what distinguishes this from a numerical
    immunodeficiency: the informative findings are defective proliferation,
    activation and motility of T and B cells, with reduced ERK phosphorylation
    on TCR stimulation.
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RASGRP1 deficiency also resulted in defective proliferation, activation and motility of T cells and B cells."
    explanation: >
      These are the functional abnormalities a diagnostic immunology
      laboratory would demonstrate.

- name: Coagulation and Antiphospholipid Screening
  description: >
    Suggested by the review on the strength of the index case: unexplained
    neurological or vascular symptoms in a RASGRP1-deficient patient should
    prompt coagulation screening. Recorded as a suggestion, which is what the
    source calls it - one case is not a surveillance guideline.
  evidence:
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with RASGRP1 deficiency may benefit from regular coagulation screening, especially in the presence of unexplained neurological or vascular symptoms."
    explanation: >
      The authors' own hedged surveillance suggestion, reproduced with its
      hedge intact.

- name: Molecular Genetic Testing of RASGRP1
  description: >
    Confirmatory. Splice-donor alleles feature among reported genotypes, so
    canonical splice-site variants should not be dismissed on the basis of
    coding-region-only analysis.
  evidence:
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 5-year-old male with novel homozygous splice-donor mutations in RASGRP1(c.1720+1G>A and c.1720+2T>C)"
    explanation: >
      Documents homozygous splice-donor alleles as a reported disease
      genotype.

treatments:
- name: Conservative Immunosuppressive Management
  description: >
    Steroids, rituximab and sirolimus, used to control the autoimmune and
    lymphoproliferative manifestations. Curated because it is what most
    reported patients actually received, and because its outcome is the
    comparator that makes the transplantation argument: roughly 45% mortality,
    with deaths ascribed to refractory AIHA, TTP, or lymphoma complications.
    In the index case an aggressive multimodal regimen - high-dose
    methylprednisolone, IVIG, eculizumab, sirolimus, bortezomib and
    plasmapheresis - failed to control the haemolysis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  evidence:
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals managed conservatively with immunosuppressive agents (including steroids, rituximab, and sirolimus) faced a mortality rate of roughly 45%"
    explanation: >
      Recorded as REFUTE against conservative immunosuppression being adequate
      definitive management. It does not say the drugs have no effect - the
      review notes conservative approaches may provide temporary control - but
      the reported mortality is the evidence against relying on them.
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite aggressive multimodal rescue therapy consisting of high\u2010dose methylprednisolone, intravenous immunoglobulin (IVIG), eculizumab, sirolimus, bortezomib, and plasmapheresis, the patient's condition continued to deteriorate"
    explanation: >
      Documents the intensity of rescue therapy attempted in the index case and
      its failure, which is what "refractory" means concretely here.

- name: Antiviral Prophylaxis and EBV Surveillance
  description: >
    Oral valganciclovir with regular EBV monitoring, used in a reported patient
    specifically to pre-empt EBV-driven B-cell lymphoma. This is the one
    management step aimed at the disease's characteristic mechanism rather than
    at its consequences.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valganciclovir
      term:
        id: CHEBI:63635
        label: valganciclovir
  evidence:
  - reference: PMID:37898412
    reference_title: "A novel homozygous mutation in RASGRP1 that predisposes to immune dysregulation and immunodeficiency associated with uncontrolled Epstein-Barr virus-induced B cell proliferation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient will be maintained on oral valganciclovir and monitored regularly for Epstein-Bar Virus infections to avoid the development of Epstein-Bar Virus- induced B cell lymphoma"
    explanation: >
      Documents antiviral prophylaxis with EBV surveillance as a management
      plan, with the stated aim of preventing EBV-driven lymphoma. This is one
      patient's plan, not an outcome, so no efficacy is claimed.

- name: Hematopoietic Stem Cell Transplantation
  description: >
    The only curative therapy, and the review argues for it as definitive care
    rather than salvage. Four of four transplanted patients achieved full
    remission and are alive; conservative management carried roughly 45%
    mortality. Those are small numbers from a retrospective aggregation of
    fifteen cases with obvious selection pressures - the sickest patients are
    the least likely to reach transplant - so the contrast is a strong signal
    rather than a controlled comparison.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation remains the only curative therapy, as conservative management carries high mortality."
    explanation: >
      States both the curative status of transplantation and the mortality of
      the alternative.
  - reference: PMID:42253627
    reference_title: "RASGRP1 Deficiency Manifesting as Severe Vasculopathy and Fatal Autoimmune Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients received hematopoietic stem cell transplantation (HSCT), all of whom achieved full clinical remission and are alive."
    explanation: >
      The outcome data behind the curative claim: four of four transplanted
      patients in remission and alive. Small numbers, but they are the whole
      transplanted cohort rather than a selected subset.

- name: Lenalidomide
  description: >
    Mechanism-based and, so far, entirely preclinical for this disease.
    Lenalidomide increases RhoA activity and reverses the migration and
    activation defects of RASGRP1-deficient lymphocytes ex vivo, targeting the
    cytoskeletal arm rather than the RAS exchange lesion. No clinical benefit
    has been reported - see the knowledge gap attached to this treatment. It
    is curated because the mechanistic rationale is specific and testable, not
    because it is established care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lenalidomide
      term:
        id: CHEBI:63791
        label: lenalidomide
  target_mechanisms:
  - target: Loss of RASGRP1-DYNLL1 Cytoskeletal Coupling
    description: >
      Raises RhoA activity, the signalling output lost when RASGRP1-DYNLL1
      coupling is absent.
    evidence:
    - reference: PMID:27776107
      reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment with lenalidomide increased RhoA activity and reversed the migration and activation defects of RASGRP1-deficient lymphocytes."
      explanation: >
        Shows the drug acting on the specific signalling defect of this node,
        in patient-derived cells.
  evidence:
  - reference: PMID:27776107
    reference_title: "RASGRP1 deficiency causes immunodeficiency with impaired cytoskeletal dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with lenalidomide increased RhoA activity and reversed the migration and activation defects of RASGRP1-deficient lymphocytes."
    explanation: >
      The ex vivo cellular rescue that is the entire evidence base for this
      treatment.


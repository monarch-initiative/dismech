name: Immunodeficiency 64
creation_date: "2026-08-30T19:20:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 64
  term:
    id: MONDO:0032803
    label: immunodeficiency 64
description: >
  Immunodeficiency 64 (IMD64; OMIM 618534; RASGRP1 deficiency) is an autosomal
  recessive combined immunodeficiency with immune dysregulation, caused by
  biallelic loss-of-function variants in RASGRP1. RASGRP1 is the calcium- and
  diacylglycerol-regulated guanine nucleotide exchange factor that couples the
  T cell antigen receptor to RAS, so losing it severs TCR signalling from the
  RAS-MAPK/ERK cascade at its first step. Roughly fifteen patients have been
  reported. Infection is essentially universal and lymphoproliferation is
  present in the large majority; the characteristic and most dangerous
  complication is EBV-driven B cell lymphoproliferation and lymphoma.

  What makes the entry mechanistically interesting is that RASGRP1 deficiency
  is not one lesion but two, running in parallel from the same protein. The
  expected arm is catalytic: reduced RAS-GTP loading, reduced ERK
  phosphorylation in both T and B cells, and consequently failed antigen-driven
  expansion - which is precisely why EBV-specific CD8+ T cells cannot be
  mobilised to clear infected B cells. The second arm is cytoskeletal and
  RAS-independent: RASGRP1 interacts with the dynein light chain DYNLL1,
  deficient cells show decreased RhoA activation, and NK cells fail cytotoxic
  granule convergence and actin accumulation at the synapse. Lenalidomide
  restores RhoA activity and reverses the migration and activation defects,
  which is both a mechanistic argument for the second arm's independence and
  the only mechanism-based therapy so far proposed.

  Curators should be aware of a naming hazard: common regulatory variants near
  RASGRP1 are established GWAS susceptibility alleles for several autoimmune
  diseases. Those are a different genetic claim from the rare biallelic null
  alleles that cause IMD64, and literature searches on the gene return both.

synonyms:
  - IMD64
  - RASGRP1 deficiency
  - combined immunodeficiency due to RASGRP1 deficiency

parents:
  - Inborn error of immunity
  - Combined immunodeficiency
  - EBV-susceptibility inborn error of immunity


experimental_models:
- name: Patient iPSC-derived neuroepithelial stem cells
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: PATIENT_DERIVED
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:30920170
  description: >-
    Fibroblasts from two affected siblings were reprogrammed to iPSCs and
    differentiated into neuroepithelial-like stem cells, which showed a mild
    combined complex I and IV defect that muscle and fibroblasts lacked.
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The neural progenitors show the respiratory chain defect absent from patient fibroblasts.
    limitations: >-
      Cells from two siblings with one genotype; the defect was mild, and
      neural progenitors stand in for the mature neurons and glia affected in
      patients.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Proliferating neuroepithelial progenitors in culture lack mature
        neurons, myelinating glia and white matter, where the leukoencephalopathy
        arises.
    evidence:
    - reference: PMID:30920170
      reference_title: Mutations in the mitochondrial tryptophanyl-tRNA synthetase cause growth retardation and progressive leukoencephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Biochemical analysis of patient-derived neuroepithelial stem cells
        revealed a mild combined complex I and IV defect
      explanation: The respiratory chain defect in patient neural progenitors.
animal_models:
- name: Wars2 V117L mouse
  species: Mouse
  genotype: Wars2 V117L homozygous (ENU-induced hypomorphic allele)
  description: >-
    An ENU-induced hypomorphic Wars2 allele lowers WARS2 protein and causes
    progressive hearing loss, reduced adiposity with adipose tissue dysfunction
    and hypertrophic cardiomyopathy, with tissue-specific respiratory chain
    deficiency and activation of the integrated stress response.
  publication: PMID:30566859
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Tissue-specific respiratory chain deficiency in heart, liver and brown fat.
    limitations: >-
      The V117L allele is not a patient allele, and the phenotype is dominated
      by hearing loss, adipose dysfunction and cardiomyopathy rather than the
      neurodevelopmental disease.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Developmental delay, epilepsy, abnormal movements and
        leukoencephalopathy are not among the reported pathologies of the
        mouse.
    evidence:
    - reference: PMID:30566859
      reference_title: A Wars2 Mutant Mouse Model Displays OXPHOS Deficiencies and Activation of Tissue-Specific Stress Response Pathways.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Altogether, these data indicate that tissue-specific upregulation of
        mitochondrial biogenesis explains the pattern of respiratory chain
        deficiencies observed in Wars2V117L/V117L mice.
      explanation: Tissue-specific respiratory chain deficiency in the mouse.
  evidence:
  - reference: PMID:30566859
    reference_title: A Wars2 Mutant Mouse Model Displays OXPHOS Deficiencies and Activation of Tissue-Specific Stress Response Pathways.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This hypomorphic allele causes progressive tissue-specific pathologies,
      including hearing loss, reduced adiposity, adipose tissue dysfunction, and
      hypertrophic cardiomyopathy.
    explanation: The mouse phenotype.
- name: Drosophila WARS2 RNAi knockdown
  species: Drosophila melanogaster
  genotype: Ubiquitous WARS2 RNAi knockdown (GAL4-UAS, two independent lines)
  description: >-
    Silencing the fly WARS2 orthologue shows that a partial aminoacylation
    defect is lethal.
  publication: PMID:30920170
  modeled_mechanisms:
  - target: Reduced Mitochondrial tRNA-Trp Aminoacylation
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: Knockdown lowers WARS2 and its aminoacylation activity, with lethality as the readout.
    limitations: >-
      RNAi knockdown rather than patient alleles, read out as viability rather
      than neurological function.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Knockdown lowers the whole transcript instead of introducing a patient
        missense or frameshift allele, so allele-specific residual activity is
        not modelled.
    evidence:
    - reference: PMID:30920170
      reference_title: Mutations in the mitochondrial tryptophanyl-tRNA synthetase cause growth retardation and progressive leukoencephalopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, silencing of wild type WARS2 in Drosophila melanogaster
        showed that a partial defect in aminoacylation is enough to cause
        lethality.
      explanation: Partial loss of aminoacylation is lethal in flies.
references:
- reference: PMID:37824696
  title: WARS2 Deficiency.
  tags:
  - GeneReviews
notes: >-
  The GeneReviews chapter (PMID:37824696) covers the whole WARS2 deficiency
  spectrum, which MONDO divides into this disease (MONDO:0060578) and
  childhood-onset parkinsonism-dystonia 3 (MONDO:0030676). MONDO lists "WARS2
  deficiency" and "WARS2-related disorder" as broad synonyms of this term, so
  neither is used as the entry name. Reports of levodopa-responsive
  parkinsonism or dystonia with p.Trp13Gly in trans (PMID:29120065,
  PMID:34890876, PMID:37107582, PMID:39073549, PMID:40977440) are cited here
  only for the differential, the p.Trp13Gly allele and the diagnostic caveat.
  The tryptophan observations come from a small uncontrolled series
  (PMID:42863838).

  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Combined Respiratory Chain Complex Deficiency"
  description: >-
    The deficiency is tissue-selective. It has been found in liver and in
    patient-derived neuroepithelial stem cells, while muscle and fibroblasts
    usually have normal respiratory chain activity.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:

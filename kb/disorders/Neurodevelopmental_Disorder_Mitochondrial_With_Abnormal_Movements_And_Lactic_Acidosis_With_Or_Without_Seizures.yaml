name: Neurodevelopmental Disorder, Mitochondrial, With Abnormal Movements and Lactic Acidosis, With or Without Seizures
creation_date: "2026-11-27T14:59:30Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder, mitochondrial, with abnormal movements and lactic acidosis, with or without seizures
  term:
    id: MONDO:0060578
    label: neurodevelopmental disorder, mitochondrial, with abnormal movements and lactic acidosis, with or without seizures
synonyms:
- NEMMLAS
- mitochondrial tryptophanyl-tRNA synthetase deficiency
parents:
- Mitochondrial Disease
description: >-
  NEMMLAS is an autosomal recessive mitochondrial disease caused by biallelic
  variants in WARS2, which encodes the mitochondrial tryptophanyl-tRNA
  synthetase. Pathogenic variants lower the amount of enzyme or impair its
  import into mitochondria, leave mitochondrial tRNA-Trp uncharged and reduce
  mitochondrial protein synthesis. Respiratory chain activity is often normal
  in muscle and fibroblasts, while combined deficiencies have been found in
  liver and in patient-derived neural stem cells.

  At the severe end, onset is neonatal or infantile with lactic acidosis,
  encephalomyopathy or a developmental and epileptic encephalopathy, and early
  death. Other patients have a later, attenuated course with global
  developmental delay, intellectual disability, speech impairment, abnormal
  movements (athetosis, ataxia, dystonia, tremor or parkinsonism), spasticity
  and behavioural problems, sometimes with progressive leukoencephalopathy,
  microcephaly and growth failure. One child developed acute liver failure
  after starting valproate.

  Levodopa-responsive parkinsonism or dystonia and progressive
  myoclonus-ataxia beginning in later childhood or early adulthood, with the
  hypomorphic p.Trp13Gly allele in trans, are catalogued separately as
  childhood-onset parkinsonism-dystonia 3, although the GeneReviews chapter
  treats both as one WARS2 deficiency spectrum.

diagnosis:
- name: Molecular genetic testing for biallelic WARS2 variants
  description: >-
    The diagnosis rests on biallelic WARS2 variants. Because the hypomorphic
    p.Trp13Gly allele is common in the general population, it is easily
    filtered out of diagnostic sequencing analyses. Respiratory chain studies
    of muscle and fibroblasts are often normal.
  evidence:
  - reference: PMID:37824696
    reference_title: WARS2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of WARS2 deficiency is established in a proband with
      suggestive findings and biallelic pathogenic variants in WARS2 identified
      by molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:37107582
    reference_title: "The Expanding Phenotypical Spectrum of WARS2-Related Disorder: Four Novel Cases with a Common Recurrent Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WARS2-related disorders are diagnostically challenging diseases due to
      the broad phenotypic spectrum and the disease relevance of a relatively
      common missense change that is often filtered out in a diagnostic setting
      since it occurs in ~0.5% of the general European population.
    explanation: The common p.Trp13Gly allele is easily missed.
differential_diagnoses:
- name: Parkinsonism-dystonia 3, childhood-onset
  description: >-
    The allelic later-onset WARS2 presentation: levodopa-responsive
    tremor-dominant parkinsonism or dystonia and progressive myoclonus-ataxia
    beginning in childhood or early adulthood, often with neuropsychiatric
    features, in patients carrying p.Trp13Gly in trans with a pathogenic allele.
  disease_term:
    preferred_term: parkinsonism-dystonia 3, childhood-onset
    term:
      id: MONDO:0030676
      label: parkinsonism-dystonia 3, childhood-onset
  evidence:
  - reference: PMID:34890876
    reference_title: WARS2 mutations cause dopa-responsive early-onset parkinsonism and progressive myoclonus ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study expands the spectrum of the disease to later onset phenotypes of
      early-onset tremor-dominant parkinsonism and progressive myoclonus-ataxia
      phenotypes.
    explanation: The later-onset movement disorder phenotypes.
  - reference: PMID:29120065
    reference_title: Biallelic mutations in mitochondrial tryptophanyl-tRNA synthetase cause Levodopa-responsive infantile-onset Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the case of a 17-year-old boy with compound heterozygous
      mutations in WARS2 (p.Trp13Gly, p.Ser228Trp) who presented with
      infantile-onset, Levodopa-responsive Parkinsonism at the age of 2 years.
    explanation: Levodopa-responsive parkinsonism with p.Trp13Gly.
  - reference: PMID:40977440
    reference_title: "WARS2 -Associated Neuropsychiatric Phenotype in Childhood: A Case-Based Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He demonstrated a remarkable clinical response to levodopa.
    explanation: A childhood-onset levodopa-responsive case with p.Trp13Gly.
treatments:
- name: Supportive multidisciplinary care
  description: >-
    There is no cure. Care is supportive and multidisciplinary, covering
    seizures, nutrition and feeding, respiratory support, physical therapy and
    development. Valproate should be avoided, because it caused severe
    hepatopathy and neurological deterioration in one child.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37824696

  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits"
  description: >-
    Mitochondrial protein synthesis falls in patient fibroblasts, lowering
    respiratory chain subunits and oxygen consumption.

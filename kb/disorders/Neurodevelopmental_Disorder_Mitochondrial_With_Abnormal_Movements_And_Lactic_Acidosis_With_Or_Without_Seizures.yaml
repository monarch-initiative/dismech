    explanation: Biallelic variants in every affected individual of five families.
genetic:
- name: WARS2
  gene_term:
    preferred_term: WARS2
    term:
      id: hgnc:12730
      label: WARS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic WARS2 variants cause the disease. Affected individuals from
    several unrelated families carry biallelic variants, and patient cells show
    uncharged mitochondrial tRNA-Trp, less WARS2 protein and reduced
    mitochondrial protein synthesis; yeast and fly models confirm that the
    aminoacylation defect impairs respiration and viability.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:37824696
      reference_title: WARS2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: WARS2 deficiency is inherited in an autosomal recessive manner.
      explanation: Recessive inheritance.
  notes: >-
    ClinGen classifies WARS2 as Definitive (autosomal recessive) for
    mitochondrial disease (MONDO:0044970), a broader MONDO concept than this
    entry's MONDO:0060578, so no tier is recorded in gene_disease_validity.
    The GeneReviews chapter counts 29 individuals from 24 families across the
    whole WARS2 deficiency spectrum, including the later-onset movement
    disorder presentation catalogued as MONDO:0030676.
  variants:
  - name: c.37T>G, p.Trp13Gly
    description: >-
      A hypomorphic missense change in the mitochondrial localization signal
      that causes protein mislocalization. It occurs in about 0.5% of
      Europeans, so it is easily filtered out in diagnostic pipelines. The
      first NEMMLAS family carried it in trans with a frameshift allele, and
      all reported patients with a childhood- or adult-onset movement disorder
      carry it in trans with a pathogenic allele.
    evidence:
    - reference: PMID:28236339
      reference_title: Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The latter affects the mitochondrial localization signal of WARS2,
        causing protein mislocalization.
      explanation: The variant impairs mitochondrial targeting.
    - reference: PMID:37824696
      reference_title: WARS2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Of note, to date all individuals with a childhood- or early
        adulthood-onset movement disorder have the hypomorphic WARS2 variant
        c.37T>G (p.Trp13Gly) with a WARS2 pathogenic variant on the other
        allele.
      explanation: The allele defines the later-onset movement disorder genotype.
    - reference: PMID:39073549
      reference_title: "Compound Heterozygous WARS2 Variants Including a Hypomorphic Allele Cause a Milder Phenotype of Complex Dopa Responsive Dystonia: Case Report and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The p.(Trp13Gly) missense variant has previously been reported in
        individuals with less severe phenotypes than those carrying biallelic
        WARS2 loss-of-function variants.
      explanation: The allele is associated with milder disease.
  - name: c.938A>T, p.Lys313Met
    description: >-
      A recurrent missense allele found homozygous or in trans with another
      pathogenic allele in several patients with infantile onset.
    evidence:
    - reference: PMID:28650581
      reference_title: Deficiency of WARS2, encoding mitochondrial tryptophanyl tRNA synthetase, causes severe infantile onset leukoencephalopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        He was found by whole-exome sequencing to have compound heterozygous
        variants in WARS2, c.938A>T (p.K313M) and c.298_300delCTT (p.L100del).
      explanation: The allele in a severely affected infant.
    - reference: PMID:29783990
      reference_title: Severe hepatopathy and neurological deterioration after start of valproate treatment in a 6-year-old child with mitochondrial tryptophanyl-tRNA synthetase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using Whole Exome Sequencing two known pathogenic variants were detected
        in WARS2 (c.797delC, p.Pro266ArgfsTer10/ c.938 A > T, p.Lys313Met).
      explanation: The allele in a further patient.
  evidence:
  - reference: PMID:28905505
    reference_title: Biallelic variants in WARS2 encoding mitochondrial tryptophanyl-tRNA synthase in six individuals with mitochondrial encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report six individuals from five families presenting with either
      severe neonatal onset lactic acidosis, encephalomyopathy and early death or
      a later onset, more attenuated course of disease with predominating
      intellectual disability.
    explanation: Biallelic WARS2 variants in five families.
  - reference: PMID:28236339
    reference_title: Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the second family, we found a compound heterozygous genotype of the
      mitochondrial tryptophanyl-tRNA synthetase (WARS2) gene, comprising a
      nonsense mutation (c.325delA, p.Ser109Alafs*15), which very likely entails
      nonsense-mediated mRNA decay and a missense mutation (c.37T>G, p.Trp13Gly).
    explanation: The first family with WARS2-related intellectual disability.
  - reference: PMID:30920170
    reference_title: Mutations in the mitochondrial tryptophanyl-tRNA synthetase cause growth retardation and progressive leukoencephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      modeling the disease in yeast demonstrated that the reported aminoacylation
      defect severely affects respiration and viability
    explanation: Yeast modelling supports pathogenicity of the patient variants.

    explanation: A combined defect in patient-derived neural cells.
  - reference: PMID:29783990
    reference_title: Severe hepatopathy and neurological deterioration after start of valproate treatment in a 6-year-old child with mitochondrial tryptophanyl-tRNA synthetase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Supportive care to improve quality of life, maximize function, and reduce
      complications is recommended.
    explanation: GeneReviews management recommendation.
  - reference: PMID:37824696
    reference_title: WARS2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Valproic acid has caused severe hepatopathy and neurologic deterioration
      in one individual with WARS2-related DEE.
    explanation: GeneReviews lists valproate as an agent to avoid.
- name: Oral tryptophan supplementation
  description: >-
    Supplementation with the enzyme's substrate was well tolerated in a small
    uncontrolled series. Two WARS2 patients with infantile onset improved in
    development, sleep, agitation, energy, tremor or gait during treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-tryptophan
      term:
        id: CHEBI:16828
        label: L-tryptophan
  target_mechanisms:
  - target: Reduced Mitochondrial tRNA-Trp Aminoacylation
    description: Proposed to raise substrate availability for the residual synthetase.
  evidence:
  - reference: PMID:42863838
    reference_title: Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarly, P1WARS2 showed improved language and social development during
      Tryptophan treatment, as measured using Bayley‐III
    explanation: Developmental gain on tryptophan in one patient, without a control.
  - reference: PMID:42863838
    reference_title: Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She had more energy and was much more active during the day. Her tremors decreased. Walking is more stable.
    explanation: Improvement in a second patient, homozygous for p.Lys313Met.
  - reference: PMID:42863838
    reference_title: Tailored Amino Acid Treatment for Pediatric Patients With Mitochondrial Aminoacyl-tRNA Synthetase Deficiencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Supplementation was well tolerated, with no adverse effects observed.
    explanation: No adverse effects across the series.

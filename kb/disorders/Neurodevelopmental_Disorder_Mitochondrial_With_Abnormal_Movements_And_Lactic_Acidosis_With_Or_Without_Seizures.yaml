    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      WARS2 encodes mitochondrial tryptophanyl-tRNA synthase (mtTrpRS), a
      homodimeric class Ic enzyme (mitochondrial tryptophan-tRNA ligase; EC
      6.1.1.2).
    explanation: The enzyme's normal activity.
  - reference: PMID:28905505
    reference_title: Biallelic variants in WARS2 encoding mitochondrial tryptophanyl-tRNA synthase in six individuals with mitochondrial encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An increase of uncharged mitochondrial tRNATrp and a decrease of mtTrpRS
      protein content were found in fibroblasts of affected individuals.
    explanation: Less enzyme in patient fibroblasts.
  - reference: PMID:28236339
    reference_title: Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the etiology of autosomal recessive intellectual disability.

- category: Eye
  name: Refractive Error
  description: >-
    Hypermetropia or myopia, the commonest of the ophthalmological findings the
    larger cohort added to the phenotype. The authors are careful that
    refractive error is common in the general population too, so its presence in
    an individual carrier is weak evidence on its own; what the cohort supports
    is that ophthalmological findings belong in the phenotype and warrant a
    formal eye assessment.
  phenotype_term:

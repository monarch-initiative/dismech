    explanation: >-
      Gives hearing loss in about half of individuals, which maps to FREQUENT.
  - reference: PMID:39723281
    reference_title: Genetic Diagnostics and Phenotypic Profiling of a Girl With Autosomal Recessive Intellectual Developmental Disorder and Autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was diagnosed with a bilateral mild sensorineural hearing defect,

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other frequent, so far unreported symptoms observed in this study are
      muscular hypotonia and/ or hypertonia, ophthalmologic findings and
      sleeping problems.
    explanation: >-
      Names sleeping problems as a frequent and previously unreported part of
      the phenotype. The FREQUENT band follows the authors' own word for it.
  - reference: PMID:39723281
    reference_title: Genetic Diagnostics and Phenotypic Profiling of a Girl With Autosomal Recessive Intellectual Developmental Disorder and Autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological signs included atypical leukoencephalopathy, hypotonia,
      sensorineural hearing loss, and sleep disturbances.
    explanation: >-
      Independent case documenting sleep disturbance alongside the other
      neurological features.
- category: Nervous System
  name: Reduced Pain Sensitivity
  description: >-
    A raised pain threshold, noted in single individuals in the original report
    and confirmed in the larger cohort. It is an unusual feature to find
    alongside intellectual disability and hearing loss, and it is worth
    recording because a child who does not report pain normally is at risk of
    unrecognized injury or illness.
  phenotype_term:
    preferred_term: Pain insensitivity
    term:
      id: HP:0007021
      label: Pain insensitivity
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observation of reduced pain sensitivity in this study supports an
      association with this previously described, however rare symptom
    explanation: >-
      Independent confirmation of a rare feature first noted in the founding
      cohort.
- category: Nervous System
  name: Epilepsy
  description: >-
    Seizures occur, but how often is genuinely unsettled. The founding cohort
    reported epilepsy in six of nine individuals; the larger follow-up cohort
    found it much less frequent. See the discussion attached to this entry, which
    treats the discrepancy as an ascertainment question rather than picking a
    number.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Beside variable intellectual disability (ID) in all individuals, epilepsy
      occurred in six, and behavioral problems or sensorineural hearing loss in
      three individuals, respectively
    explanation: >-
      Records epilepsy in six of the nine individuals of the founding cohort. No
      frequency band is asserted on this phenotype because the two published
      cohorts disagree.
- category: Nervous System
  name: Developmental Regression
  description: >-
    Loss of previously acquired skills, reported at ages from 2.5 to about 30
    years in three of twenty individuals. The authors are careful that two of the
    three had confounding diagnoses, an encephalopathy with vitamin B12
    deficiency and a psychosis with meningioma, so whether regression belongs to
    this disease is unresolved. It is recorded here because it bears on prognosis
    if it is real.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental regression or neurodegeneration at various ages (2.5 to ~ 30
      years) was observed in three of the 20 affected individuals which might be
      relevant for prognosis. However, two of the three individuals had
      additional diagnoses that are not necessarily related to this syndromic
      disorder
    explanation: >-
      Reports the observation together with the confound that prevents
      attributing it to the disease. Graded PARTIAL for that reason.
- category: Digestive
  name: Gastrointestinal Symptoms
  description: >-
    Functional gastrointestinal problems, newly added to the spectrum by the
    larger cohort. Anal stenosis was reported in a single individual in the
    original report.
  phenotype_term:
    preferred_term: Functional gastrointestinal abnormality
    term:
      id: HP:0012719
      label: Functional abnormality of the gastrointestinal tract
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare features that might be part of the EIF3F related NDD include
      functional problems of the gastrointestinal tract, undescended testes,
      cleft lip and palate, heart defect and nasal fistula.
    explanation: >-
      Names functional gastrointestinal problems among the rarer features of the
      spectrum.
- category: Head and Neck
  name: Cleft Lip or Palate
  description: >-
    An orofacial cleft, including minor forms, in a minority of individuals in
    both published cohorts. It is one of the few frank malformations in an
    otherwise non-malformative disorder.
  phenotype_term:
    preferred_term: Cleft lip or palate
    term:
      id: HP:0000202
      label: Orofacial cleft
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, this study suggests that microcephaly, reduced sensitivity to
      pain, cleft lip/palate, gastrointestinal symptoms and ophthalmological
      symptoms are part of the phenotypic spectrum.
    explanation: >-
      Places cleft lip and palate within the recognized phenotypic spectrum.
- category: Nervous System
  name: Leukoencephalopathy
  description: >-
    White-matter abnormality on MRI, reported in two individuals: cystic
    dilatation of the Virchow-Robin spaces distributed through the white matter
    in one, and extensive supratentorial leukodystrophy in a compound
    heterozygote. It sits uneasily with the larger cohort's finding that brain
    imaging is nonspecific, and it may be an emerging feature or may be
    incidental. The open question attached to this entry sets out why it is
    interesting and why it is not yet established.
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  evidence:
  - reference: PMID:39723281
    reference_title: Genetic Diagnostics and Phenotypic Profiling of a Girl With Autosomal Recessive Intellectual Developmental Disorder and Autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An MRI scan at 24 months of age showed randomly distributed cystic
      dilatations of the Virchow-Robin spaces bilaterally in the white matter,
      with a maximum concentration in the left parietal-temporal-occipital site,
      indicating atypical leukoencephalopathy.
    explanation: >-
      The imaging finding in a homozygous carrier of the founder variant.
  - reference: PMID:39723281
    reference_title: Genetic Diagnostics and Phenotypic Profiling of a Girl With Autosomal Recessive Intellectual Developmental Disorder and Autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another case study engaging MRI revealed extensive supratentorial
      leukodystrophy; however, the patient was a compound heterozygote in EIF3F
    explanation: >-
      A second individual with a white-matter abnormality, with the authors
      flagging the differing genotype.
genetic:
- name: EIF3F
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: EIF3F (eukaryotic translation initiation factor 3 subunit F)
    term:
      id: hgnc:3275
      label: EIF3F
  notes: >-
    The only gene attributed to this entity, and one of only two genes that a
    genome-wide recessive burden analysis of the Deciphering Developmental
    Disorders cohort identified as newly associated with recessive developmental
    disorders. Its allelic architecture is unusual for a recessive
    neurodevelopmental disorder: rather than many private truncating variants in
    a few families, almost every reported patient carries the same relatively
    common missense founder allele.
  evidence:
  - reference: PMID:30409806
    reference_title: Quantifying the contribution of recessive coding variation to developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two genes not previously associated with recessive
      developmental disorders, KDM5B and EIF3F, and functionally validated them
      with mouse and cellular models.
    explanation: >-
      The founding gene-disease association. Graded HUMAN_CLINICAL because the
      association itself came from a recessive burden analysis of 6,040 human
      families in the Deciphering Developmental Disorders study; the same
      sentence also reports mouse and cellular validation, but that clause
      cannot be split into a separately graded item because it shares the
      sentence, and one quote may carry only one grade.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, an identical, rather frequent missense variant in EIF3F in
      almost all affected individuals is an uncommon finding in NDDs,
      particularly in a cohort with heterogeneous, ethnical and regional
      backgrounds.
    explanation: >-
      States what is unusual about this gene's allelic architecture relative to
      other recessive neurodevelopmental disorders.
  variants:
  - name: EIF3F c.694T>G p.(Phe232Val)
    description: >-
      The founder allele, homozygous in 21 of 22 reported individuals across
      sixteen families and present on a single shared haplotype in all fifteen
      families tested, so it arose once. It is the seventh most common EIF3F
      missense variant in gnomAD at 0.07% overall, 0.21% in Ashkenazi Jewish and
      0.12% in non-Finnish European individuals, yet no gnomAD individual is
      homozygous for it, in contrast to five of the six more frequent EIF3F
      missense variants. Functionally it lowers eIF3f protein level, translation
      rate and proliferation in gene-edited stem cells.
    gene:
      preferred_term: EIF3F
      term:
        id: hgnc:3275
        label: EIF3F
    clinical_significance: PATHOGENIC
    type: missense
    evidence:
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        21 patients were homozygous and one compound heterozygous for
        c.694T>G/p.(Phe232Val) in EIF3F. Haplotype analyses in 15 families
        suggested that c.694T>G/p.(Phe232Val) was a founder variant.
      explanation: >-
        Establishes the allele's dominance of the reported cohort and its
        founder origin.
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This variant represents the 7th most common EIF3F missense variant in
        gnomAD (0.07%) with highest frequencies in Ashkenazi Jewish (0.21%) and
        non-Finnish European individuals (0.12%)
      explanation: >-
        Gives the population frequency and its ancestry distribution.
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In line with its pathogenicity, no individual in gnomAD was reported to
        be homozygous for this variant, in contrast to five of the six more
        frequent variants.
      explanation: >-
        The absence-of-homozygotes argument that separates this allele from the
        other common EIF3F missense variants.
  - name: EIF3F c.861dup p.(Gln288AlafsTer14)
    description: >-
      A frameshift allele found in trans with the founder missense variant in
      one individual, who was at the severe end of the spectrum for motor
      milestones, speech delay, organic problems and pre- and postnatal growth
      of body and head. This is the entity's only genotype-phenotype signal, and
      it is what supports reading the founder allele as hypomorphic rather than
      null.
    gene:
      preferred_term: EIF3F
      term:
        id: hgnc:3275
        label: EIF3F
    clinical_significance: PATHOGENIC
    type: frameshift
    evidence:
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        was predicted to result in a frameshift and subsequently either in mRNA
        decay or a truncated protein (length reduced by 20%, exon 6 of 8) with
        altered structure.
      explanation: >-
        Characterizes the frameshift allele and its predicted consequence.
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Symptoms in the compound heterozygous individual with an additional
        truncating variant were at the severe end of the spectrum in regard to
        motor milestones, speech delay, organic problems and pre- and postnatal
        growth of body and head, suggesting some genotype-phenotype correlation.
      explanation: >-
        The genotype-phenotype observation that supports a dosage reading of the
        disease.
experimental_models:
- name: Gene-edited EIF3F p.(Phe232Val) homozygous iPSC line
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:30409806
  description: >-
    The isogenic human cell model, and the source of every functional
    measurement this pathograph rests on. Induced pluripotent stem cells were
    gene-edited to carry the founder variant homozygously, and show reduced
    eIF3f protein, reduced translation rate and reduced proliferation against
    their unedited controls. It is the only human system in this entry, and it
    is the model the "no neural model" knowledge gap is measured against: it
    establishes the molecular and cellular steps in human cells while saying
    nothing about neurons, because the cells were never differentiated.
  modeled_mechanisms:
  - target: Homozygous EIF3F p.Phe232Val Lowers eIF3f Protein Abundance
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Carries the exact human disease allele in the exact zygosity of affected
      people, on an isogenic background, and reproduces the reduction in eIF3f
      protein that the molecular node asserts.
    limitations: >-
      Undifferentiated stem cells. Protein abundance is measured in a cell type
      that has nothing to do with the affected tissue, so the model establishes
      that the allele lowers eIF3f, not that it does so in a neuron.
    evidence:
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro studies of induced pluripotent stem cells (iPSC), gene-edited to
        be homozygous for the c.694T>G/ p.(Phe232Val) variant, demonstrated lower
        EIF3F protein levels and reduced proliferation rates
      explanation: >-
        Describes the model and the reduced protein level it demonstrates.
  - target: Reduced Global Translation Initiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Translation rate is reduced in cells carrying the variant, in
      heterozygotes as well as homozygotes, which is the cellular step the
      pathograph turns on.
    limitations: >-
      A bulk translation-rate measurement in undifferentiated cells. It does not
      identify which transcripts lose translational efficiency, which is the
      open question the entry's knowledge gap records.
    evidence:
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, both heterozygous and homozygous variants reduced translation
        rates in iPSC cells
      explanation: >-
        The measured reduction in translation rate attributable to the allele.
  - target: Reduced Cell Proliferation and Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced proliferation rate in the edited line against its isogenic
      control.
    limitations: >-
      Proliferation of a stem cell is not the developmental growth of a brain or
      a body; the link to the organism-level phenotype remains an inference.
    evidence:
    - reference: PMID:33736665
      reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro studies of induced pluripotent stem cells (iPSC), gene-edited to
        be homozygous for the c.694T>G/ p.(Phe232Val) variant, demonstrated lower
        EIF3F protein levels and reduced proliferation rates
      explanation: >-
        The measured reduction in proliferation rate in the isogenic model.
animal_models:
- name: eIF3f-null mouse
  species: Mouse
  genotype: eIF3f homozygous null
  publication: PMID:31026345
  description: >-
    Homozygous null embryos fail to develop and die at an early embryonic stage,
    after implantation. This is the experimental counterpart of the human
    observation that no patient with two truncating EIF3F alleles has ever been
    reported, and it is the reason the founder missense allele must retain
    residual function.
  modeled_mechanisms:
  - target: Homozygous EIF3F p.Phe232Val Lowers eIF3f Protein Abundance
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      A complete null, not the human allele. It bounds the mechanism from the
      severe end rather than reproducing the disease: it shows what happens when
      eIF3f is absent altogether, which is embryonic lethality rather than a
      neurodevelopmental disorder.
    limitations: >-
      This genotype does not exist in any reported patient and produces a
      qualitatively different outcome from the human disease. It cannot be used
      to model the phenotype, only to argue that the human allele is hypomorphic.
    evidence:
    - reference: PMID:31026345
      reference_title: "eIF3f depletion impedes mouse embryonic development, reduces adult skeletal muscle mass and amplifies muscle loss during disuse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We showed that homozygous eIF3f knockout fail to develop and that
        eIF3f-/- embryos die at an early stage of development but after the
        pre-implantation stage.
      explanation: >-
        Records the embryonic lethality of complete eIF3f loss.
- name: eIF3f heterozygous mouse
  species: Mouse
  genotype: eIF3f heterozygous null
  publication: PMID:31026345
  description: >-
    Viable, fertile and grossly normal, but with reduced eIF3f mRNA and protein
    in every tissue examined, reduced polysome content, a lower protein
    synthesis rate, inhibited mTOR signalling, reduced lean mass and altered
    muscle cell size. It is the only in vivo demonstration that partial eIF3f
    depletion produces a measurable translational and growth deficit.
  modeled_mechanisms:
  - target: Reduced Global Translation Initiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the translational deficit itself, measured as reduced polysome
      content and protein synthesis rate, and identifies mTOR inhibition as the
      link to growth.
    limitations: >-
      The measurements were made in skeletal muscle, not brain, and the mouse
      carries a null allele on one chromosome rather than the human missense
      allele on both. Heterozygous mice are behaviourally and developmentally
      normal, so this model captures the biochemistry of partial eIF3f depletion
      without reproducing the neurodevelopmental phenotype.
    evidence:
    - reference: PMID:31026345
      reference_title: "eIF3f depletion impedes mouse embryonic development, reduces adult skeletal muscle mass and amplifies muscle loss during disuse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Skeletal muscles of heterozygous mice show a deficiency in polysome
        content, a decrease in protein synthesis rate and an inhibition of the
        mechanistic target of rapamycin (MTOR) pathway.
      explanation: >-
        The measured translational deficit and its mTOR coupling.
  - target: Reduced Cell Proliferation and Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced lean mass and altered muscle cell size without a change in fibre
      number, which is a growth deficit at the level of cell size rather than
      cell number.
    limitations: >-
      Body size is normal in these mice, so the growth phenotype is not the
      short stature seen in patients, and no neural tissue was examined.
    evidence:
    - reference: PMID:31026345
      reference_title: "eIF3f depletion impedes mouse embryonic development, reduces adult skeletal muscle mass and amplifies muscle loss during disuse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Interestingly, skeletal muscles are mainly affected and display an
        altered cell size without modification of fibre number.
      explanation: >-
        Locates the growth deficit at cell size rather than cell number.
treatments:
- name: Developmental and Educational Support
  description: >-
    There is no treatment directed at the mechanism. Management is
    developmental: speech and language therapy, which matters
    disproportionately here because speech is the most consistently and severely
    affected domain, together with special education, physiotherapy and
    behavioural support. Affected children in reported cases are followed by
    neurology, otorhinolaryngology, psychology and speech therapy together.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:39723281
    reference_title: Genetic Diagnostics and Phenotypic Profiling of a Girl With Autosomal Recessive Intellectual Developmental Disorder and Autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient is under the care of several clinical specialists, including
      neurologists, otorhinolaryngologists, psychologists, and a speech
      therapist.
    explanation: >-
      Documents the multidisciplinary care actually provided, including speech
      therapy, in a reported case.
  notes: >-
    Carries no `target_mechanisms`. Supportive developmental care does not act
    on any node in the pathograph, and no disease-modifying therapy exists.
- name: Genetic Counseling
  description: >-
    Once the biallelic EIF3F genotype is known, counselling is concrete: the
    parents are obligate carriers and each future pregnancy carries a 25%
    recurrence risk. This matters more than usual here, because the founder
    allele is comparatively common in some ancestries, so a carrier parent may
    have relatives at risk who would not otherwise be identified.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39723281
    reference_title: Genetic Diagnostics and Phenotypic Profiling of a Girl With Autosomal Recessive Intellectual Developmental Disorder and Autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of the causal variant c.694T>G, p.(Phe232Val) in the
      EIF3F gene indicates a 25% recurrence risk in potential siblings of the
      patient, due to its autosomal recessive mode of inheritance, as explained
      by the clinical geneticist to the parents of the proband.
    explanation: >-
      States the recurrence risk and records that it was actually delivered as
      counselling in a reported family.
  notes: >-
    Carries no `target_mechanisms`. Counselling is an informational
    intervention, not a therapeutic action on a pathograph node.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Around thirty individuals from about twenty-three families have been
    reported, across two cohorts and scattered case reports. No prevalence
    estimate exists. The carrier frequency of the founder allele is known
    (0.07% in gnomAD overall, 0.21% in Ashkenazi Jewish and 0.12% in
    non-Finnish European individuals) and is recorded on the variant, but it
    cannot be converted into a disease prevalence: the disease is far rarer than
    Hardy-Weinberg on that allele frequency would predict, and the entry does
    not speculate about why.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      21 patients were homozygous and one compound heterozygous for
      c.694T>G/p.(Phe232Val) in EIF3F.
    explanation: >-
      The size of the largest reported cohort, which together with the founding
      nine-patient report is essentially the whole literature.
diagnosis:
- name: Audiological Assessment
  description: >-
    Hearing loss affects about half of individuals and can be mild, so it will
    not announce itself in a child who already has global developmental delay
    and no speech. Detecting it changes management, because uncorrected hearing
    loss compounds the speech delay that is this disorder's most prominent
    feature.
  diagnosis_term:
    preferred_term: diagnostic audiology testing
    term:
      id: NCIT:C217379
      label: Diagnostic Audiology Testing
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About half of the affected individuals had behavioral problems, altered
      muscular tone, hearing loss, and short stature.
    explanation: >-
      Gives the roughly 50% frequency of hearing loss that makes routine
      audiological assessment worthwhile in a child with this diagnosis.
- name: Genome-Wide Sequencing
  description: >-
    Exome or genome sequencing is the diagnostic route, and effectively the only
    one. There is no biomarker, no distinctive facial gestalt, and brain imaging
    is nonspecific, so nothing directs a clinician to this gene before
    sequencing does. Because the causal allele is a single recurrent missense
    variant rather than an obvious truncation, it is also the kind of variant a
    filtering pipeline can discard as too common.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, genome-wide sequencing approaches (genome or exome sequencing)
      represent an essential component of the diagnostic work-up.
    explanation: >-
      The authors' conclusion that sequencing is essential, following from the
      absence of directive clinical or imaging findings.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Minor dysmorphic features were observed, although neither the individuals'
      facial nor general appearance were obviously distinctive.
    explanation: >-
      Records the absence of a recognizable gestalt, which is why clinical
      diagnosis is not possible.
discussions:
- discussion_id: eif3f_epilepsy_frequency_discrepancy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is epilepsy a common feature of EIF3F-related neurodevelopmental disorder or
    an uncommon one? The two published cohorts disagree by a wide margin.
  attaches_to:
  - phenotypes#Epilepsy
  rationale: >-
    Epilepsy occurred in six of the nine individuals in the founding cohort,
    and was reported as substantially less frequent in the larger follow-up
    cohort of twenty-one. Both describe the same homozygous founder allele, so
    the difference is not genotypic. The likely explanation is ascertainment:
    the founding cases came out of a cohort recruited for undiagnosed
    developmental disorders and analysed by recessive burden, while the
    follow-up cohort was assembled through GeneMatcher after the gene was
    already known, which lets milder and non-epileptic cases in. If that is
    right, the true frequency is closer to the lower figure and the founding
    report overstates it, which matters for what a family is told at diagnosis.
    No frequency band is asserted on the epilepsy phenotype in this entry until
    a third independent cohort settles it.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Beside variable intellectual disability (ID) in all individuals, epilepsy
      occurred in six, and behavioral problems or sensorineural hearing loss in
      three individuals, respectively
    explanation: >-
      The founding cohort's figure, six of nine.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hearing loss and behavioral difficulties were more common findings, and
      epilepsy less frequent in this study.
    explanation: >-
      The follow-up cohort's contradictory finding, stated by the authors as a
      direct comparison.
- discussion_id: eif3f_moonlighting_deubiquitinase_relevance
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does the disease act only through reduced translation, or does it also act
    through eIF3f's separate deubiquitinase activity on Notch?
  attaches_to:
  - pathophysiology#Reduced Global Translation Initiation
  rationale: >-
    This entry models the disease entirely as a translation-initiation defect,
    because that is what has actually been measured in cells carrying the
    disease allele. But eIF3f has a second, unrelated documented activity: it is
    an intrinsic deubiquitinase that removes monoubiquitin from the activated
    Notch receptor and is required for Notch signalling, being recruited to
    activated Notch on endocytic vesicles by Deltex1. Notch signalling is central
    to neurogenesis, so a partial loss of eIF3f could in principle produce a
    neurodevelopmental phenotype through that route rather than, or as well as,
    through translation. Nobody has tested whether the p.(Phe232Val) allele
    affects the deubiquitinase activity. The question is not idle: the two
    mechanisms predict different things, since a translational deficit should
    scale with how much protein a cell needs while a Notch deficit should be
    specific to cell-fate decisions.
  proposed_experiments:
  - experiment_id: eif3f_phe232val_dub_activity_assay
    name: Test whether p.(Phe232Val) impairs eIF3f deubiquitinase activity on Notch
    description: >-
      Assay intrinsic deubiquitinase activity and monoubiquitinated Notch1
      accumulation in cells expressing wild-type versus p.(Phe232Val) eIF3f,
      alongside a catalytically inactive mutant as the positive control for loss
      of activity, and score Notch reporter activation in a coculture assay.
      Separating a translational from a Notch effect requires the two readouts in
      the same isogenic background.
  evidence:
  - reference: PMID:21124883
    reference_title: The translation initiation factor 3f (eIF3f) exhibits a deubiquitinase activity regulating Notch activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that eIF3f has an intrinsic DUB activity. Knocking down eIF3f leads
      to an accumulation of monoubiquitinated forms of activated Notch, an effect
      counteracted by murine WT eIF3f but not by a catalytically inactive mutant.
    explanation: >-
      Establishes the second, non-translational activity that this question is
      about.
  - reference: PMID:21124883
    reference_title: The translation initiation factor 3f (eIF3f) exhibits a deubiquitinase activity regulating Notch activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, catalytically inactive forms of eIF3f as well as shRNAs targeting
      eIF3f repress Notch activation in a coculture assay, showing that eIF3f is
      a new positive regulator of the Notch pathway.
    explanation: >-
      Shows that loss of eIF3f impairs Notch signalling, which is the route this
      question asks about.
- discussion_id: eif3f_white_matter_involvement
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is white-matter disease part of EIF3F-related neurodevelopmental disorder,
    and if so does it act through eIF3f's role in repeat-associated non-ATG
    translation?
  attaches_to:
  - phenotypes#Leukoencephalopathy
  rationale: >-
    Two individuals have been reported with white-matter abnormalities on MRI,
    one with cystic dilatation of the perivascular spaces and one, a compound
    heterozygote, with extensive supratentorial leukodystrophy. That is thin,
    and it sits against a larger cohort in which brain imaging was explicitly
    nonspecific and was judged not diagnostically useful. What makes it worth
    keeping open rather than dismissing is a piece of biology from an unrelated
    disease: eIF3F regulates repeat-associated non-ATG translation, and knocking
    it down lowers the steady-state level of the SCA8 polySer protein, whose
    aggregates accumulate specifically in white-matter regions that show
    demyelination and axonal degeneration. That is a real, published route by
    which an eIF3f defect could reach white matter. It is also entirely
    circumstantial here: no one has examined RAN translation, myelination or
    oligodendrocytes in a patient or in a model of the disease allele, and the
    genotype differed between the two individuals with imaging findings. Until
    someone does, the leukoencephalopathy is curated as a phenotype without a
    frequency and without a causal edge into the pathograph.
  proposed_experiments:
  - experiment_id: eif3f_oligodendrocyte_translation
    name: Test myelination and RAN-translation readouts in p.(Phe232Val) oligodendrocytes
    description: >-
      Differentiate oligodendrocytes from the gene-edited p.(Phe232Val)
      homozygous stem cell lines and isogenic controls, and compare myelin gene
      translational efficiency and RAN-protein steady-state levels. A positive
      result would convert the imaging finding from an association into a
      mechanism; a negative one would argue the two reported scans are
      incidental.
  evidence:
  - reference: PMID:30206144
    reference_title: SCA8 RAN polySer protein preferentially accumulates in white matter regions and is regulated by eIF3F.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, knockdown of the eukaryotic translation initiation factor
      eIF3F in cells reduces steady-state levels of SCA8 polySer and other RAN
      proteins.
    explanation: >-
      Establishes that eIF3F modulates RAN protein accumulation, the biology
      this question asks about.
  - reference: PMID:30206144
    reference_title: SCA8 RAN polySer protein preferentially accumulates in white matter regions and is regulated by eIF3F.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WM regions with polySer aggregates show demyelination and axonal
      degeneration in SCA8 human and mouse brains.
    explanation: >-
      Establishes the white-matter tropism of the process eIF3F modulates. Two
      caveats are carried deliberately: the finding is in SCA8, not in this
      disease, which is why the question is open rather than answered; and the
      quoted observation spans human and mouse brains, graded here on the human
      arm because that is the claim being made about white-matter tropism in
      people.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In concordance with the previous study, brain imaging did not reveal
      specific findings and were therefore not considered diagnostically
      indicative in EIF3F related NDD.
    explanation: >-
      The larger cohort found no consistent imaging abnormality, which argues
      against white-matter disease being a general feature.
- discussion_id: eif3f_meningioma_signal
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Two of twenty-one individuals in a cohort with a median age of 8.5 years had
    a meningioma. Is that a tumour predisposition, or coincidence in a small
    cohort?
  attaches_to:
  - pathophysiology#Reduced Cell Proliferation and Growth
  rationale: >-
    The number is small but the context makes it hard to dismiss: meningioma in
    two of twenty-one individuals whose median age at last examination was 8.5
    years is not what a paediatric cohort normally looks like. In one of the two
    it was an increased seizure frequency that led to the diagnosis, and in the
    other the tumour is named as a confound for that individual's apparent
    developmental regression, so the finding is currently visible in this entry
    only as a caveat inside the regression phenotype rather than as a question
    in its own right. The authors went looking for a mechanism and did not find
    one: somatic EIF3F variants appear in 0.9% of nearly 39,000 COSMIC samples
    and in none of 130 meningiomas. That negative is worth curating explicitly,
    because it is the kind of result that does not get published twice and would
    otherwise have to be re-derived by the next person who notices the two
    cases. This is recorded as a knowledge gap and NOT as a phenotype and NOT as
    a surveillance recommendation: two cases with an explicit negative
    tumour-genetics check do not support either.
  proposed_experiments:
  - experiment_id: eif3f_tumour_incidence_in_carrier_cohort
    name: Ascertain tumour incidence in a larger EIF3F biallelic cohort
    description: >-
      Follow the reported and future biallelic carriers longitudinally and
      compare central nervous system tumour incidence against age-matched
      expectation. Two cases in twenty-one cannot distinguish a real
      predisposition from ascertainment; a defined denominator with follow-up
      time can. A negative would retire the question; a positive would change
      surveillance, which is why it should not be inferred either way from the
      present data.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      somatic EIF3F variants have been detected in 0.9% of 38,579 samples (n =
      353) and did not include 130 meningioma samples, providing no further
      evidence for a role of EIF3F in tumorigenesis of meningioma
    explanation: >-
      The authors' own negative check against COSMIC, which is the main reason
      this is curated as an open gap rather than as a phenotype.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, two of the three individuals had additional diagnoses that are not
      necessarily related to this syndromic disorder: encephalopathy in an
      individual with vitamin B12 deficiency and psychosis in an individual with
      meningioma.
    explanation: >-
      Records the meningioma cases as the authors present them, as confounds for
      other features rather than as an asserted part of the phenotype.
- discussion_id: eif3f_no_neural_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a general reduction in translation initiation produce this
    particular phenotype, with speech affected in everyone and hearing,
    stature and pain sensation affected in only some?
  attaches_to:
  - pathophysiology#Impaired Brain Development and Somatic Growth
  rationale: >-
    Every functional measurement in this disease has been made outside the
    nervous system. The cellular work used undifferentiated induced pluripotent
    stem cells; the in vivo work used mouse skeletal muscle in an animal
    carrying a null allele on one chromosome, not the human missense allele on
    both. There is no neural model of the disease allele at all, and brain
    imaging in patients is explicitly nonspecific, so there is no structural
    finding to reason from either. The step from "translation is slower" to
    "speech does not develop" is therefore an inference. It is a reasonable one,
    since eIF3 loads a defined subset of mRNAs rather than acting uniformly, but
    which of those messages matter in which neural cell type at which
    developmental stage is entirely unknown.
  proposed_experiments:
  - experiment_id: eif3f_neural_differentiation_translatome
    name: Profile the translatome of patient-allele neurons through differentiation
    description: >-
      Differentiate cortical neurons from the existing gene-edited p.(Phe232Val)
      homozygous stem cell lines and their isogenic controls, and compare
      ribosome profiling across differentiation stages to identify which
      transcripts lose translational efficiency in neural lineage cells
      specifically, rather than in stem cells.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In concordance with the previous study, brain imaging did not reveal
      specific findings and were therefore not considered diagnostically
      indicative in EIF3F related NDD.
    explanation: >-
      Records the absence of any structural neural correlate to reason from.
notes: >-
  Entry-type decision: DISEASE. MONDO:0032662 is a leaf with no descendants and
  a single causal gene (hgnc:3275 EIF3F); it maps to OMIM 618295. The MONDO
  parent (MONDO:0019502, autosomal recessive non-syndromic intellectual
  disability) is recorded as a `skos:broadMatch` cross-reference rather than
  adopted, because the clinical literature consistently describes this entity as
  syndromic.


  NAMED ENTITY CONFUSION: the falcon deep-research report for this disease was
  discarded and is deliberately NOT committed. `just preflight-dr` against
  MONDO:0032662 returned FAIL: the expected gene EIF3F was mentioned zero times
  while PPP1R21 was mentioned 48 times. PPP1R21 is the gene for a different
  member of the same numbered series (intellectual developmental disorder,
  autosomal recessive 59), which is exactly the numbered-series aliasing that
  the NEC risk classes describe. The report's own citation validation was clean
  (4/4 references resolved, confabulation rate 0.0), which is the point: every
  citation in a wrong-entity report resolves, and only the gene-frequency check
  catches it. Nothing in this entry derives from that report. All references
  here were located independently through PubMed E-utilities and fetched with
  `just fetch-reference`, and a second deep-research run was performed with the
  `claude_code` provider, which returned PASS on the same check (EIF3F mentioned
  64 times, report OMIM 618295 matching the MONDO xref) and independently
  flagged the same PPP1R21 confusion hazard in its own text. That report is
  committed; its `needs_review: true` flag is due to two malformed DOI
  identifiers in which markdown link syntax leaked into the identifier string,
  and nothing was curated from either.


  Frequency bands are asserted only where the source gives one. Global
  developmental delay, speech delay and intellectual disability are stated as
  present in all affected individuals (VERY_FREQUENT); behavioural problems,
  hearing loss, altered muscle tone and short stature are stated as present in
  about half (FREQUENT). Microcephaly, reduced pain sensitivity, cleft
  lip/palate, gastrointestinal symptoms, developmental regression and epilepsy
  carry NO frequency. Epilepsy in particular is left unbanded on purpose: the
  two published cohorts disagree by a wide margin and a CONTROVERSY discussion
  records why.


  The reported carrier frequency of the founder allele is curated on the variant
  but deliberately not converted into a disease prevalence. The disease is far
  rarer than Hardy-Weinberg on a 0.07% allele frequency would predict, and this
  entry does not speculate about the reason.


  Snippet-quoting note: this paper interleaves numeric citation markers such as
  `[9]` and `[6]` inside the sentences worth quoting. Those markers are stripped
  from a snippet before matching but not from the cached text, so several quotes
  here are trimmed to bracket-free spans rather than transcribed with the marker.


  GeneReviews has no chapter for this entity and Orphanet has no matching
  concept, so neither a GeneReviews baseline nor an ORPHA reference is cited.
  `just refresh-orphadata` is currently failing on a drifted sha256 in this
  repository and was not run.


  PMID:35743796 was fetched during literature search and deliberately not
  curated. It reports a heterozygous EIF3F variant as one of seven
  moderate-effect alleles in a proposed oligogenic model of intellectual
  disability, which is a different claim from biallelic EIF3F causing MRT67;
  citing it here would misrepresent a polygenic hypothesis as a case of this
  Mendelian disease.

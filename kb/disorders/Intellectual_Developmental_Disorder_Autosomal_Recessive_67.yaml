name: Intellectual Developmental Disorder Autosomal Recessive 67
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
synonyms:
- MRT67
- Mental Retardation, Autosomal Recessive 67
- EIF3F-related neurodevelopmental disorder
- EIF3F deficiency
disease_term:
  preferred_term: intellectual developmental disorder, autosomal recessive 67
  term:
    id: MONDO:0032662
    label: intellectual developmental disorder, autosomal recessive 67
description: >-
  MRT67 is a syndromic autosomal recessive neurodevelopmental disorder caused by
  biallelic variants in EIF3F, which encodes the f subunit of eIF3, the largest
  and most complex of the eukaryotic translation initiation factors. Its
  molecular logic is unusual: the disease is a partial failure of general
  protein synthesis, not a defect in a pathway or a neuron-specific protein.
  Gene-edited stem cells homozygous for the disease allele carry less eIF3f
  protein, proliferate more slowly, and translate less. What reaches the clinic
  is global developmental delay in every reported individual, with speech delay
  in every individual too, and then a variable syndromic tail of behavioural
  problems, sensorineural hearing loss, abnormal muscle tone, short stature,
  microcephaly, ophthalmological findings, reduced pain sensitivity, and
  occasional cleft lip or palate.


  What makes this entity distinctive among recessive neurodevelopmental
  disorders is its genetics. Almost every reported patient carries the identical
  homozygous missense variant c.694T>G p.(Phe232Val), and haplotype analysis
  across fifteen families placed it on one shared haplotype, so it arose once
  and is a founder allele. It is also comparatively common: it is the seventh
  most frequent EIF3F missense variant in gnomAD at 0.07%, rising to 0.21% in
  Ashkenazi Jewish and 0.12% in non-Finnish European individuals. Most recessive
  neurodevelopmental disorders are caused by many different, mostly truncating,
  private variants in a handful of families; here one relatively frequent
  missense allele explains almost the whole disease across French, English,
  Irish, Scottish, German, Bulgarian, Ukrainian, Russian, Ashkenazi Jewish and
  Iraqi families.


  That pattern is itself mechanistically informative. EIF3F is strongly
  intolerant of loss of function in population data, no individual homozygous
  for the common allele appears in gnomAD, and no patient with two truncating
  alleles has ever been reported, while the one compound heterozygote with a
  missense plus a frameshift allele sat at the severe end of the spectrum. The
  most economical reading is that p.(Phe232Val) is a hypomorph that leaves
  enough residual eIF3f function to be survivable, and that complete loss is
  not: the mouse says the same thing, since eIF3f-null embryos die shortly after
  implantation while heterozygotes are viable.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019502
      label: autosomal recessive non-syndromic intellectual disability
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    notes: >-
      The MONDO parent is a non-syndromic grouping, but this entity is
      consistently described as syndromic in the clinical literature, with
      hearing loss, short stature, microcephaly and dysmorphism alongside the
      intellectual disability. The parent is recorded as a cross-reference
      rather than adopted as a characterization.
parents:
- hereditary neurological disease

    explanation: >-
      Contrasts the stature and head-size phenotypes and their different
      longitudinal behaviour.
- category: Head and Neck
  name: Microcephaly
  description: >-
    Small head circumference, of variable degree, and less frequent than short
    stature. It was newly recognized as part of the spectrum by the larger
    follow-up study.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, this study suggests that microcephaly, reduced sensitivity to

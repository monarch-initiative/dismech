pathophysiology:
- name: Homozygous EIF3F p.Phe232Val Lowers eIF3f Protein Abundance
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The founder missense allele does not obviously break a catalytic site; what
    it does is leave less eIF3f protein in the cell. Stem cells gene-edited to
    carry the variant homozygously have reduced eIF3f protein levels, which is
    the observation the loss-of-function interpretation rests on. Population
    genetics agrees: EIF3F is strongly intolerant of loss-of-function variation,
    no gnomAD individual is homozygous for this allele, and no patient with two
    truncating alleles has been reported, so this allele is best read as a
    hypomorph that survives where a null would not.
  molecular_functions:
  - preferred_term: translation initiation factor activity of the eIF3f subunit
    term:
      id: GO:0003743
      label: translation initiation factor activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: eukaryotic translation initiation factor 3 complex
    term:
      id: GO:0005852
      label: eukaryotic translation initiation factor 3 complex
  genetic_context:
    gene:
      preferred_term: EIF3F
      term:
        id: hgnc:3275
        label: EIF3F
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous c.694T>G p.(Phe232Val) in almost every reported individual; one
      compound heterozygote carries this allele with a frameshift on the other
      chromosome and is more severely affected.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies of induced pluripotent stem cells (iPSC), gene-edited to
      be homozygous for the c.694T>G/ p.(Phe232Val) variant, demonstrated lower
      EIF3F protein levels and reduced proliferation rates
    explanation: >-
      The measurement this node asserts: the disease allele lowers eIF3f protein
      abundance in an isogenic cellular model.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, the overall number of truncating alleles in individuals in gnomAD
      v2.1.1 is extremely low (probability of being loss-of-function intolerant =
      0.97, observed over expected variants = 0.07).
    explanation: >-
      Population constraint data supporting the reading that EIF3F cannot
      tolerate full loss of function, which is why the disease allele must be
      hypomorphic.
  downstream:
  - target: Reduced Global Translation Initiation
    description: >-
      Less eIF3f in the eIF3 complex lowers the rate at which the cell can
      initiate translation.
- name: Reduced Global Translation Initiation
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    eIF3 is the largest of the eukaryotic initiation factors, and it does not
    load every message equally; it binds a specific subset of mRNAs involved in
    proliferation, growth, cell-cycle control, differentiation and apoptosis.
    Lowering eIF3f lowers the measured translation rate in cells carrying the
    variant, in heterozygotes as well as homozygotes. In mouse, partial eIF3f
    depletion reduces polysome content and protein synthesis rate and inhibits
    the mTOR pathway, which is the coupling by which a translation-factor defect
    becomes a growth defect.
  biological_processes:
  - preferred_term: translational initiation
    term:
      id: GO:0006413
      label: translational initiation
    modifier: DECREASED
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, both heterozygous and homozygous variants reduced translation
      rates in iPSC cells
    explanation: >-
      Direct measurement of reduced translation rate attributable to the disease
      allele.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      EIF3F encodes an essential subunit of the largest eukaryotic translation
      initiation factor eIF3 which binds to a highly specific group of mRNAs
      involved in cell proliferation and growth, including cell cycle control,
      differentiation and apoptosis
    explanation: >-
      Explains why a general translation factor produces a selective phenotype:
      eIF3 acts on a defined mRNA subset rather than uniformly.
  - reference: PMID:31026345
    reference_title: "eIF3f depletion impedes mouse embryonic development, reduces adult skeletal muscle mass and amplifies muscle loss during disuse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Skeletal muscles of heterozygous mice show a deficiency in polysome
      content, a decrease in protein synthesis rate and an inhibition of the
      mechanistic target of rapamycin (MTOR) pathway.
    explanation: >-
      Shows the same translational deficit in vivo, and identifies mTOR
      inhibition as the coupling to growth.
  downstream:
  - target: Reduced Cell Proliferation and Growth
    description: >-
      A lowered translation rate constrains how fast cells can grow and divide.
- name: Reduced Cell Proliferation and Growth
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Cells homozygous for the disease allele proliferate more slowly. This is the
    step that most plausibly connects a general translation defect to the
    particular clinical picture, since the tissues that need the most protein
    synthesis over the longest developmental window are the ones that show up in
    the phenotype: brain, stature, head circumference and, in the mouse, muscle
    mass.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies of induced pluripotent stem cells (iPSC), gene-edited to
      be homozygous for the c.694T>G/ p.(Phe232Val) variant, demonstrated lower
      EIF3F protein levels and reduced proliferation rates
    explanation: >-
      Records the measured reduction in proliferation rate in the isogenic
      cellular model.
  - reference: PMID:31026345
    reference_title: "eIF3f depletion impedes mouse embryonic development, reduces adult skeletal muscle mass and amplifies muscle loss during disuse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although heterozygous mice are phenotypically indistinguishable from
      wild-type mice, they present a diminished body weight and a lean mass
      reduction associated with normal body size.
    explanation: >-
      Growth consequence of partial eIF3f depletion in an intact animal.
  downstream:
  - target: Impaired Brain Development and Somatic Growth
    description: >-
      Constrained proliferation and growth during development produce the
      neurodevelopmental and growth phenotype.
- name: Impaired Brain Development and Somatic Growth
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    The clinical endpoint: global developmental delay with prominent speech
    delay in every reported individual, plus a variable syndromic tail of
    hearing loss, abnormal muscle tone, short stature and microcephaly. This
    node is marked provisional because the step from a general reduction in
    translation to these specific outcomes is inferred rather than measured. No
    neural model of the disease allele has been reported; the cellular work was
    done in undifferentiated stem cells and the in vivo work in mouse muscle.
    Brain imaging in affected people is unhelpfully nonspecific, which is itself
    a piece of evidence: there is no structural lesion to point at.
  biological_processes:
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals had developmental delays including delayed speech
      development. About half of the affected individuals had behavioral
      problems, altered muscular tone, hearing loss, and short stature.
    explanation: >-
      The clinical outcome this node represents, with the constant and the
      variable components separated.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In concordance with the previous study, brain imaging did not reveal
      specific findings and were therefore not considered diagnostically
      indicative in EIF3F related NDD.
    explanation: >-
      Records the absence of a structural correlate, which is why this node is
      an inference from cellular data rather than an observed brain lesion.
phenotypes:
- category: Nervous System
  name: Global Developmental Delay
  description: >-
    Present in every reported individual, but of widely variable degree: one
    child never walked independently, most walked late, and some reached motor
    milestones on time. The severity of the intellectual disability varies just
    as widely, so the constant feature is that development is delayed, not how
    much.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals had developmental delays including delayed speech
      development.
    explanation: >-
      Establishes global developmental delay in all affected individuals, which
      maps to VERY_FREQUENT.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, all affected individuals had global developmental delay of
      variable degree. Motor developmental delay was variable: one patient did
      not learn to walk independently, while most individuals learned walking
      late, and some individuals achieved motor milestones at a normal age.
    explanation: >-
      Documents both the universality and the wide variability in degree.
- category: Nervous System
  name: Delayed Speech and Language Development
  description: >-
    Speech is the most consistently and most severely affected domain. Every
    individual in the largest cohort had speech delay, and about a quarter never
    developed speech at all. Speech delay was not recognized as part of the
    phenotype in the original report and was added by the larger follow-up
    study.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals had developmental delays including delayed speech
      development.
    explanation: >-
      Speech delay in all affected individuals, mapping to VERY_FREQUENT.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study adds the finding of significant speech delay to the phenotype:
      the majority of individuals spoke more than few words, while a quarter of
      affected individuals had no speech development.
    explanation: >-
      Quantifies the severity within the speech domain and records that this
      feature was newly recognized.
- category: Nervous System
  name: Intellectual Disability
  description: >-
    Intellectual disability of variable degree is present in all reported
    individuals, and is the feature the disease is named for.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Beside variable intellectual disability (ID) in all individuals, epilepsy
      occurred in six, and behavioral problems or sensorineural hearing loss in
      three individuals, respectively
    explanation: >-
      Records intellectual disability in all individuals of the founding cohort.
- category: Nervous System
  name: Behavioral Problems
  description: >-
    Behavioural difficulties affect about half of reported individuals, and were

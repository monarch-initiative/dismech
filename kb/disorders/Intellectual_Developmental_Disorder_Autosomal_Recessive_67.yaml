      Records that tone can be increased or decreased, which is why a
      directionless term is used.
- category: Growth
  name: Short Stature
  description: >-
    Short stature affects about half of individuals and persists into adulthood.
    It is more common than microcephaly in this disorder, and longitudinal data
    show head growth tracking its centiles more steadily than height does, so
    the growth restriction is not simply a proportionate consequence of the
    brain phenotype.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: FREQUENT
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About half of the affected individuals had behavioral problems, altered
      muscular tone, hearing loss, and short stature.
    explanation: >-
      Gives short stature in about half of individuals, mapping to FREQUENT.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short stature, also occurring until adulthood, was commonly observed in

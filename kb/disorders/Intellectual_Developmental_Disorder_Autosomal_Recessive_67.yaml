inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic EIF3F variants are required. All tested parents in the largest
    cohort were heterozygous carriers and were essentially unaffected, and
    parental consanguinity was reported in only one of sixteen families, which
    is unusual for a recessive disorder and reflects the frequency of the
    founder allele in the general European population.
  evidence:
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All tested parents were heterozygous carriers of the variant (parents of
      pedigree 16 (P16) were not available for testing).
    explanation: >-
      Segregation showing carrier parents and affected biallelic offspring.
  - reference: PMID:33736665
    reference_title: "EIF3F-related neurodevelopmental disorder: refining the phenotypic and expanding the molecular spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous carriers were mainly asymptomatic. One father was reported to
      have epilepsy, and one mother migraines. Those overlapping symptoms are
      likely unrelated and of different etiology.
    explanation: >-
      Establishes that heterozygous carriers are not affected, which is what
      makes the inheritance recessive rather than dominant with reduced
      penetrance.

    causal_link_type: DIRECT

- name: Paraneoplastic Anti-NMDAR Encephalitis Association
  biological_scale: ORGANISM
  description: >
    Ovarian teratomas (including mature/dermoid teratomas containing neural
    tissue) are the commonest tumor associated with anti-N-methyl-D-aspartate
    receptor (anti-NMDAR) encephalitis, a paraneoplastic autoimmune syndrome.
    Neural tissue within the teratoma expresses NMDA receptors and triggers an
    autoimmune response; tumor removal is a central component of treatment.
  evidence:
  - reference: PMID:42361457
    reference_title: "Ovarian teratoma and the anti-N-methyl-D-aspartate receptor encephalitis paraneoplastic phenomenon: A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Anti-N-methyl-D-aspartate receptor (anti-NMDAR) encephalitis is the commonest GCT-associated paraneoplastic syndrome."
    explanation: >
      Establishes anti-NMDAR encephalitis as the most common germ-cell-tumor
      (including ovarian teratoma) associated paraneoplastic syndrome.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All teratomas contained nervous tissue; 25 were examined for expression of NMDA receptors, and all were positive (data not shown)."
    explanation: >
      Demonstrates ectopic NMDA receptor expression within teratoma neural
      tissue in patients with anti-NMDAR encephalitis.
  - reference: PMID:42361457
    reference_title: "Ovarian teratoma and the anti-N-methyl-D-aspartate receptor encephalitis paraneoplastic phenomenon: A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Where possible, ovarian-sparing surgery should be offered."
    explanation: >
      Supports that surgical removal of the ovarian teratoma is central to
      management of the associated anti-NMDAR encephalitis.
  downstream:
  - target: Seizure
    description: >
      Anti-NMDAR encephalitis associated with ovarian teratoma commonly produces
      neuropsychiatric features and seizures.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All patients presented with psychiatric symptoms or memory problems; 76 had seizures, 88 unresponsiveness (decreased consciousness), 86 dyskinesias, 69 autonomic instability, and 66 hypoventilation. 58 (59%) of 98 patients for whom results of oncological assessments were available had tumours, most commonly ovarian teratoma."
      explanation: >
        Documents seizures in 76 of 100 anti-NMDAR encephalitis patients in a
        series where ovarian teratoma was the predominant associated tumor.


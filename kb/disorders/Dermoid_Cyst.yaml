      Identifies mature cystic teratoma as the most common ovarian teratoma and
      benign ovarian germ cell neoplasm.

- category: Clinical
  name: Intracranial dermoid cyst
  description: >
    A congenital intracranial dermoid cyst, a rare benign CNS lesion that may
    present with headache, seizures, and signs of mass effect; rupture can cause
    chemical meningitis.
  phenotype_term:
    preferred_term: Intracranial dermoid cyst
    term:
      id: HP:0012097
      label: Intracranial dermoid cyst
  evidence:
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Intracranial dermoid cysts (IDCs) are rare, benign, slow-growing congenital lesions originating from ectodermal elements during neural tube closure, typically between the 5th and 6th weeks of fetal development"
    explanation: >
      Establishes intracranial dermoid cysts as rare congenital benign CNS
      lesions arising from ectodermal inclusion during neural tube closure.
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "MRI revealed most likely a ruptured dermoid cyst located in the anterior fossa, with a mass effect on the optic chiasm, prechiasmatic part (Figure 1 and Figure 2)."
    explanation: >
      Clinical case confirmation of an intracranial dermoid cyst in the anterior
      cranial fossa exerting optic-pathway mass effect.

- category: Clinical
  name: Nasal dermoid cyst
  description: >
    A congenital nasal dermoid sinus cyst, the most common congenital midline
    nasal mass; presents as a painless midline mass, sometimes with a sinus
    opening and visible hair, and carries a high risk of recurrent infection.
  phenotype_term:
    preferred_term: Nasal dermoid cyst
    term:
      id: HP:0430145
      label: Nasal dermoid cyst
  evidence:
  - reference: PMID:41585020
    reference_title: "Pediatric nasal dermoid sinus cysts: advances in pathogenesis, management strategies, and translational research-a multidisciplinary management perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Pediatric nasal dermoid/sinus cysts (NDSC) are common congenital midline craniofacial lesions associated with embryonic tissue entrapment and abnormal midline fusion during embryogenesis"
    explanation: >
      Supports nasal dermoid sinus cyst as a common congenital midline
      craniofacial lesion.
  - reference: PMID:41585020
    reference_title: "Pediatric nasal dermoid sinus cysts: advances in pathogenesis, management strategies, and translational research-a multidisciplinary management perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "they can involve intracranial structures and predispose patients to recurrent infection, intracranial complications, and cosmetic or functional impairment"
    explanation: >
      Documents the infection risk, intracranial extension, and cosmetic/functional
      morbidity of nasal dermoid sinus cysts.

- category: Clinical
  name: Limbal dermoid
  description: >
    A congenital ocular-surface (limbal/epibulbar) dermoid choristoma that may
    induce astigmatism and visual disturbance.
  phenotype_term:
    preferred_term: Limbal dermoid
    term:
      id: HP:0001140
      label: Limbal dermoid
  evidence:
  - reference: PMID:30088427
    reference_title: "Lamellar keratoplasty using femtosecond laser intrastromal lenticule for limbal dermoid: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "An 18-year-old woman presented at the Department of Ophthalmology, First Hospital of Jilin University, with a history of a corneal-limbal mass in the right eye; the mass had been present since birth, and had gradually increased in size."
    explanation: >
      Documents a congenital limbal dermoid presenting as a slowly enlarging
      corneal-limbal mass confirmed histologically.
  - reference: PMID:30088427
    reference_title: "Lamellar keratoplasty using femtosecond laser intrastromal lenticule for limbal dermoid: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Generally, it arises in the inferior portion of the temporal quadrant, and can lead to astigmatism, cosmetic difficulties, and increasing astigmatism, as well as vision disturbances in conjunction with lesions."
    explanation: >
      Supports limbal dermoid as an ocular-surface choristoma causing
      astigmatism and visual disturbance.

- category: Clinical
  name: Pelvic pain
  description: >
    Larger or complicated ovarian dermoid cysts may present with pelvic pain.
  phenotype_term:
    preferred_term: Pelvic pain
    term:
      id: HP:0034267
      label: Pelvic pain
  evidence:
  - reference: PMID:39726691
    reference_title: "Ruptured Ovarian Mature Cystic Teratoma with Adenocarcinoma Transformation: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "While typically asymptomatic, benign tumors may cause pelvic pain if complicated by torsion or rupture."
    explanation: >
      Directly supports pelvic pain as a presenting feature of complicated
      benign ovarian mature cystic teratomas.

- category: Clinical
  name: Abdominal mass
  description: >
    A large ovarian dermoid cyst can present as a palpable abdominal/pelvic mass.
  phenotype_term:
    preferred_term: Abdominal mass
    term:
      id: HP:0031500
      label: Abdominal mass
  evidence:
  - reference: PMID:39867042
    reference_title: "Squamous Cell Carcinoma Originating From Mature Cystic Teratoma of the Ovary Diagnosed 10 Years After Initial Tumor Detection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The current plane magnetic resonance imaging showed a large pelvic-abdominal cystic tumor measuring 17 cm, consisting of fat, fluid-fluid level, and a hair ball."
    explanation: >
      Documents a large ovarian dermoid presenting as a pelvic-abdominal cystic
      mass.

- category: Clinical
  name: Headache
  description: >
    Intracranial dermoid cysts frequently present with headache.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A thirty-two-year-old Caucasian male patient was admitted to the hospital due to recurrent headaches and visual impairment that began at the age of thirty-one."
    explanation: >
      Documents recurrent headache as a primary presenting symptom of a ruptured
      intracranial dermoid cyst.
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "If the size of the cyst affects the surrounding tissues, it may cause various neurological symptoms, such as headaches, seizures, numbness, weakness, visual impairment, neck stiffness, and facial pain."
    explanation: >
      Supports headache as a recognized neurological manifestation of
      intracranial dermoid cyst mass effect.

- category: Clinical
  name: Seizure
  description: >
    Intracranial dermoid cysts may present with seizures, including acute
    symptomatic seizures following rupture; seizures also occur in
    teratoma-associated anti-NMDAR encephalitis.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "If the size of the cyst affects the surrounding tissues, it may cause various neurological symptoms, such as headaches, seizures, numbness, weakness, visual impairment, neck stiffness, and facial pain."
    explanation: >
      Directly supports seizures as a neurological symptom of intracranial
      dermoid cysts compressing adjacent brain tissue.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with psychiatric symptoms or memory problems; 76 had seizures, 88 unresponsiveness (decreased consciousness), 86 dyskinesias, 69 autonomic instability, and 66 hypoventilation. 58 (59%) of 98 patients for whom results of oncological assessments were available had tumours, most commonly ovarian teratoma."
    explanation: >
      Supports seizures as a frequent clinical feature in ovarian
      teratoma-associated anti-NMDAR encephalitis.

- category: Clinical
  name: Meningitis
  description: >
    Rupture of an intracranial dermoid cyst can cause chemical aseptic
    meningitis from release of lipid contents into the cerebrospinal fluid.
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  evidence:
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "On the contrary, the rupture of IDCs is a rare complication that may lead to severe outcomes, such as aseptic meningitis caused by the leakage of cyst contents into the subarachnoid space."
    explanation: >
      Directly documents chemical aseptic meningitis caused by leakage of
      dermoid cyst contents into the subarachnoid space upon rupture.

- category: Clinical
  name: Squamous cell carcinoma
  description: >
    Squamous cell carcinoma arising by malignant transformation of an ovarian
    mature cystic teratoma (~1-3% of cases).
  phenotype_term:
    preferred_term: Squamous cell carcinoma
    term:
      id: HP:0002860
      label: Squamous cell carcinoma
  evidence:
  - reference: PMID:39867042
    reference_title: "Squamous Cell Carcinoma Originating From Mature Cystic Teratoma of the Ovary Diagnosed 10 Years After Initial Tumor Detection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We diagnosed this tumor as squamous cell carcinoma originating from mature cystic teratoma of the left ovary."
    explanation: >
      Documents squamous cell carcinoma arising from malignant transformation of
      an ovarian mature cystic teratoma.

genetic:
- name: BMP15 germline mutation (hereditary ovarian teratoma)
  gene_term:
    preferred_term: BMP15
    term:
      id: hgnc:1068
      label: BMP15
  association: Germline predisposition variant in rare familial ovarian immature teratoma
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  inheritance:
  - name: X-linked dominant
  features: >
    A rare germline BMP15 missense mutation (C262T; p.Arg88Cys) causes a
    hereditary, X-linked dominant form of ovarian immature teratoma affecting
    heterozygous female carriers. Most dermoid cysts are sporadic; this gene is
    relevant only to the rare hereditary ovarian teratoma form.
  evidence:
  - reference: PMID:38427603
    reference_title: "A rare germline BMP15 missense mutation causes hereditary ovarian immature teratoma in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "BMP15 was identified as a pathogenic gene for OIT which improved our understanding of the etiology of OIT and provided a potential biomarker for genetic screening of this disorder."
    explanation: >
      Establishes BMP15 as a pathogenic gene for hereditary ovarian immature
      teratoma and a candidate genetic-screening biomarker.

diagnosis:
- name: Pelvic and Soft-Tissue Ultrasound Imaging
  description: >
    Ultrasonography is a first-line imaging modality for uncomplicated ovarian
    dermoid cysts and serves as a bedside adjunct for superficial craniofacial
    dermoid cysts.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:39726691
    reference_title: "Ruptured Ovarian Mature Cystic Teratoma with Adenocarcinoma Transformation: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Ovarian MCT can be easily diagnosed using ultrasonography, CT, or MRI in uncomplicated cases."
    explanation: >
      Supports ultrasonography as a standard diagnostic modality for ovarian
      mature cystic teratomas.

- name: Magnetic Resonance Imaging
  description: >
    MRI characterizes fat-containing and heterogeneous inclusions in ovarian,
    intracranial, and nasal dermoid cysts, delineates intracranial extension of
    midline tracts, and detects disseminated subarachnoid fat droplets after
    intracranial rupture.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:41585020
    reference_title: "Pediatric nasal dermoid sinus cysts: advances in pathogenesis, management strategies, and translational research-a multidisciplinary management perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "MRI is the imaging modality of choice, CT is used for osseous assessment, and ultrasound and endoscopy serve as bedside and intraoperative adjuncts."
    explanation: >
      Establishes MRI as the primary imaging modality for evaluating nasal
      dermoid sinus cysts and potential intracranial extension.
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In brain magnetic resonance imaging (MRI) studies, dermoids are typically hyperintense lesions seen on T1-weighted images and hyper- to hypointense structures on T2-weighted images"
    explanation: >
      Describes the characteristic T1/T2 MRI appearance used to diagnose
      intracranial dermoid cysts.

- name: Histopathologic Examination
  description: >
    Definitive diagnosis rests on histologic demonstration of keratinized
    stratified squamous epithelium accompanied by dermal adnexal structures
    (sebaceous glands, sweat glands, and hair follicles) or mature derivatives
    of multiple germ layers, and excludes malignant transformation.
  diagnosis_term:
    preferred_term: histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:40150055
    reference_title: "Ruptured Intracranial Dermoid Cyst with Fat Dissemination: A Clinical Case Mimicking an Epidermoid Cyst and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A histological examination of surgical material confirms the diagnosis, particularly in cases with atypical radiological findings."
    explanation: >
      Confirms histopathologic examination of resected tissue as the definitive
      diagnostic test for dermoid cysts.

treatments:
- name: Surgical Excision
  description: >
    Complete surgical excision is the definitive treatment across all dermoid
    cyst subtypes. For ovarian dermoid cysts, fertility-sparing cystectomy or
    oophorectomy is performed, commonly via laparoscopy. Intracranial lesions
    require neurosurgical resection (gross total resection minimizes recurrence);
    nasal dermoid sinus cysts require complete excision of the cyst and tract.
    Completeness of resection is the primary determinant of recurrence.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Slowly Enlarging Cystic Mass
    treatment_effect: INHIBITS
    description: Complete excision removes the keratin- and sebum-accumulating cyst capsule and prevents mass progression or recurrence.
    evidence:
    - reference: PMID:41585020
      reference_title: "Pediatric nasal dermoid sinus cysts: advances in pathogenesis, management strategies, and translational research-a multidisciplinary management perspective."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Treatment centers on complete excision: external rhinoplasty approaches, endoscopic endonasal techniques, or combined intracranial-extracranial approaches should be individualized according to imaging-based classification; perioperative infection control and standardized follow-up substantially reduce recurrence."
      explanation: >
        Complete surgical excision eliminates the expanding dermoid lesion and
        minimizes recurrence.
  evidence:
  - reference: PMID:41585020
    reference_title: "Pediatric nasal dermoid sinus cysts: advances in pathogenesis, management strategies, and translational research-a multidisciplinary management perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment centers on complete excision: external rhinoplasty approaches, endoscopic endonasal techniques, or combined intracranial-extracranial approaches should be individualized according to imaging-based classification; perioperative infection control and standardized follow-up substantially reduce recurrence."
    explanation: >
      Supports complete surgical excision as the central treatment for dermoid
      sinus cysts.
  - reference: PMID:37174909
    reference_title: "Immature Teratoma: Diagnosis and Management-A Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "surveillance or a targeted treatment is preferred, but the main therapy is fertility-sparing surgery."
    explanation: >
      Supports fertility-sparing surgery as the main therapy for ovarian
      teratomas.

- name: Oophorectomy / Ovarian Cystectomy
  description: >
    For ovarian dermoid cysts, removal of the cyst (cystectomy) or the ovary
    (oophorectomy) is performed; ovarian-sparing approaches are preferred where
    feasible to preserve fertility.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: oophorectomy
    term:
      id: NCIT:C15291
      label: Oophorectomy
  target_mechanisms:
  - target: Slowly Enlarging Cystic Mass
    treatment_effect: INHIBITS
    description: Resection of the ovarian teratoma via cystectomy or oophorectomy removes the cystic mass and prevents paraneoplastic or mechanical complications.
    evidence:
    - reference: PMID:37296950
      reference_title: "Molecular Biology of Pediatric and Adult Ovarian Germ Cell Tumors: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Historically, tumors have been removed via an open approach in order to preserve capsular integrity. In addition, conservative surgery to preserve fertility has been established as the standard of care [ 36 ]."
      explanation: >
        Establishes fertility-sparing surgical removal with preservation of
        capsular integrity as standard resection of ovarian germ cell tumors.
    - reference: PMID:37390246
      reference_title: "Mature cystic teratoma of the ovary with a grossly visible, completely developed intestinal loop: A case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "After the tumor had shrunk, the tumor and the loop of the intestine were completely removed from the right ovary."
      explanation: >
        Demonstrates complete ovarian-sparing surgical removal of the mature
        cystic teratoma mass from the ovary.
  evidence:
  - reference: PMID:42361457
    reference_title: "Ovarian teratoma and the anti-N-methyl-D-aspartate receptor encephalitis paraneoplastic phenomenon: A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There was no difference in outcomes for those patients with oophorectomies compared with ovarian-sparing surgery."
    explanation: >
      Supports oophorectomy and ovarian-sparing surgery as the surgical options
      for ovarian teratoma.

- name: Laparoscopic Surgery
  description: >
    Laparoscopy is commonly used for fertility-sparing excision of ovarian
    dermoid cysts when feasible.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laparoscopy
    term:
      id: NCIT:C16969
      label: Laparoscopy
  target_mechanisms:
  - target: Slowly Enlarging Cystic Mass
    treatment_effect: INHIBITS
    description: Laparoscopic cystectomy removes the mature cystic teratoma while preserving ovarian parenchyma.
    evidence:
    - reference: PMID:37390246
      reference_title: "Mature cystic teratoma of the ovary with a grossly visible, completely developed intestinal loop: A case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "An emergency single-port laparoscopic excision of the right ovarian cyst and histopathology were performed."
      explanation: >
        Documents laparoscopic excision of a symptomatic ovarian mature cystic
        teratoma with 2-year recurrence-free follow-up.
  evidence:
  - reference: PMID:37390246
    reference_title: "Mature cystic teratoma of the ovary with a grossly visible, completely developed intestinal loop: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "An emergency single-port laparoscopic excision of the right ovarian cyst and histopathology were performed."
    explanation: >
      Directly documents laparoscopic excision for surgical management of
      ovarian mature cystic teratoma.


diagnosis:
- name: Whole Exome Sequencing
  description: >-
    Definitive molecular diagnosis requires identifying biallelic pathogenic
    variants in TIMM50 by whole-exome or multigene sequencing, as biochemical
    and enzymatic markers are variable and urinary 3-methylglutaconic acid can
    be absent.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:27573165
    reference_title: Mitochondrial epileptic encephalopathy, 3-methylglutaconic aciduria and variable complex V deficiency associated with TIMM50 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using exome analysis we identified two homozygous missense mutations, Arg217Trp and Thr252Met, in the TIMM50 gene.
    explanation: Exome sequencing established the molecular diagnosis in the two index families.
  - reference: PMID:31058414
    reference_title: Mutations in TIMM50 cause severe mitochondrial dysfunction by targeting key aspects of mitochondrial physiology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-exome sequencing identified compound heterozygous mutations in TIMM50
    explanation: Whole-exome sequencing identified biallelic TIMM50 variants in an independent patient.
- name: Urinary Organic Acid Analysis
  description: >-
    Urine organic acid profiling detects elevated 3-methylglutaconic acid in
    most affected individuals as a metabolic biomarker of inner mitochondrial
    membrane dysfunction, although normal urinary 3-methylglutaconic acid does
    not exclude TIMM50-related disease.
  diagnosis_term:
    preferred_term: Urinary Organic Acid Analysis
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  evidence:
  - reference: PMID:27573165
    reference_title: Mitochondrial epileptic encephalopathy, 3-methylglutaconic aciduria and variable complex V deficiency associated with TIMM50 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Routine laboratory investigations including lactate, creatine phosphokinase (CPK), liver transaminases and plasma amino acids were normal, and urinary organic acid analysis revealed 3MGA.
    explanation: Urinary organic acid analysis detected 3-methylglutaconic aciduria even when routine blood lactate and amino acids were normal.
  - reference: PMID:38828998
    reference_title: Reduced Protein Import via TIM23 SORT Drives Disease Pathology in TIMM50-Associated Mitochondrial Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While these features are consistent with other reported TIMM50 patients, urinary excretion of 3-methylglutaconic acid (3-MGA) was not detected in this patient.
    explanation: Demonstrates that absence of urinary 3-methylglutaconic acid does not exclude molecularly confirmed MGCA9.
- name: Electroencephalography
  description: >-
    Electroencephalography evaluates infantile-onset seizures and commonly
    demonstrates hypsarrhythmia in patients presenting with infantile spasms,
    as well as treatment-related EEG evolution.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:27573165

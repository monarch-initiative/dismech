      reference_title: Mutations in TIMM50 compromise cell survival in OxPhos-dependent metabolic conditions.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "In humans, only six diseases have been associated with mutations in nuclear genes encoding components of the mitochondrial protein import machinery: three in the TIM23 and two in the TIM22 pathways and one in the disulfide relay system."
      explanation: Places TIMM50-associated disease within nuclear-encoded defects of the mitochondrial protein import machinery (TIM23 pathway).
notes: >-
  No GeneReviews chapter or cached Orphanet record names this disorder or
  TIMM50. ClinGen's General Inborn Errors of Metabolism Gene Curation Expert
  Panel classifies the TIMM50-MGCA9 relationship as Definitive (CCID:006370).
  The disease is defined by a small number of families (Bedouin, Arab, Italian,
  Spanish, Iranian and Australian probands), so frequency bands are omitted for
  most phenotypes. Reported but not captured here because no cached text
  supports them: one patient's dilated cardiomyopathy improved with digoxin,
  and his course to age 17 included dystonia and wheelchair dependence (Tort
  2019 full text).

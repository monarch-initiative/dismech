      snippet: We report the results of the genomic investigation of a new form of epileptic encephalopathy with 3MGA and variable complex V deficiency in four patients originating from two unrelated families.
      explanation: Infantile-onset epileptic encephalopathy and severe neurodevelopmental disability are the core clinical presentation, placing the disorder in Harrison's neurologic Part.

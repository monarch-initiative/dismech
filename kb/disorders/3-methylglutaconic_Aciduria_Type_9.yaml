    snippet: Brain MRI at 3 years disclosed mild generalized atrophy and at 10 years supratentorial atrophy, mainly of the white matter and symmetrical abnormally high T2/low T1 signal intensity in the lentiform nuclei bilaterally
    explanation: Serial brain MRI characterizes white matter atrophy and bilateral lentiform nuclei lesions.
- name: Skeletal Muscle Biopsy and Respiratory Chain Assay
  description: >-
    Skeletal muscle biopsy with mitochondrial respiratory chain enzyme assays
    and ultrastructural examination can reveal complex V or combined OXPHOS
    deficiency and aberrant cristae, although normal muscle respiratory chain
    enzyme activity has been reported in some patients.
  diagnosis_term:
    preferred_term: Muscle Biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:27573165
    reference_title: Mitochondrial epileptic encephalopathy, 3-methylglutaconic aciduria and variable complex V deficiency associated with TIMM50 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The activities of the enzymatic complexes of the mitochondrial respiratory chain were determined in isolated mitochondria from frozen muscle of patient B-II-3 obtained at 7 years of age. This study disclosed normal activities of complex I–IV whereas the activity of complex V (measured as oligomycin sensitive Mg2+ATPase in the presence of dinitrophenol) was reduced to 54% of the control mean normalized to citrate synthase activity."
    explanation: Muscle biopsy respiratory chain assay demonstrated isolated complex V reduction (54% of control mean) with preserved complexes I–IV in an affected patient.
  - reference: PMID:27573165
    reference_title: Mitochondrial epileptic encephalopathy, 3-methylglutaconic aciduria and variable complex V deficiency associated with TIMM50 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzymatic activities of the mitochondrial respiratory chain complexes I–V in mitochondria obtained from fresh muscle at 2 years of age, were essentially normal also when normalized to citrate synthase (a mitochondrial control enzyme)."
    explanation: Fresh muscle biopsy mitochondria in another affected patient showed normal complex I–V activities, documenting variable muscle respiratory chain assay findings.
treatments:
- name: Antiseizure Pharmacotherapy
  description: >-
    Seizures are treated with standard antiseizure therapy; in index patients
    ACTH followed by vigabatrin, topiramate, or valproate controlled infantile
    spasms and hypsarrhythmia, although underlying neurodevelopmental impairment
    persisted. A separate case report describes resolution of epileptic spasms
    with vigabatrin (PMID:32369862, a letter with no abstract, so not cited
    directly here).

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 4 months EEG revealed hypsarrhythmia; therapy with ACTH was initiated with favorable response
    explanation: EEG identified hypsarrhythmia during the diagnostic evaluation of infantile spasms at 4 months of age.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI assesses structural neuroimaging abnormalities including
    ventricular dilatation, cerebral white matter atrophy, and symmetric basal
    ganglia or brainstem T2 hyperintensities.
  diagnosis_term:
    preferred_term: Brain Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging

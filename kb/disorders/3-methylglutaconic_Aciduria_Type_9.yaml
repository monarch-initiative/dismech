      quote_role: BACKGROUND
      snippet: MGCA9 patients present with a combined deficiency of the mitochondrial oxidative phosphorylation (OXPHOS) complexes (I-V) that are responsible for aerobic energy production.
      explanation: Inborn error of mitochondrial protein import and energy metabolism with 3-methylglutaconic aciduria, covered under metabolism in Harrison's.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:

    evidence:
    - reference: PMID:38828998
      reference_title: Reduced Protein Import via TIM23 SORT Drives Disease Pathology in TIMM50-Associated Mitochondrial Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Pathological variants of the core TIM23 complex subunits TIMM23 and TIMM17A/B have not yet been described, but several reported cases of pathogenic variants in TIMM50 have been connected to the mitochondrial disease 3-methylglutaconic aciduria, type IX (MGCA9; MIM: 617698)"
      explanation: Biallelic TIMM50 defects disrupt inner mitochondrial membrane TIM23-mediated protein import, cristae organization, and oxidative phosphorylation.
  icimd_category:
  - classification_value: mitochondrial_protein_import
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      mitochondrial protein import" under category 11 "Other disorders of
      mitochondrial function". TIMM50 is a core receptor/translocase subunit
      of the inner-membrane TIM23 presequence import complex.
    evidence:

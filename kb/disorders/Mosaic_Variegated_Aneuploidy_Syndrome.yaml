    explanation: This clinical management statement directly supports tumor surveillance, especially for BUB1B-related MVA.
notes: >-
  The MONDO series under MONDO:0000141 has seven members but only five of them
  carry the MVA name. OMIM gives Atelis syndrome 1 (OMIM 620184,
  MONDO:0859575) and Atelis syndrome 2 (OMIM 620185, MONDO:0859576) the
  alternative titles MOSAIC VARIEGATED ANEUPLOIDY SYNDROME 5 and MOSAIC
  VARIEGATED ANEUPLOIDY SYNDROME 6 (NCBI MedGen concepts C5774281 and
  C5774282, read 2026-09-25), while MONDO carries no exact synonym recording
  either name. A synonym-inclusive OLS4 search of MONDO for "mosaic variegated
  aneuploidy" run on 2026-09-25 therefore returns members 1, 2, 3, 4 and 7
  plus the parent, and misses both Atelis terms; the series is complete only
  when read through the OMIM titles. Atelis syndrome 1 also sits under a second
  parent, MONDO:0859393 Atelis syndrome, which the MVA subtree walk does not
  reach.

  MONDO:0859329 (MVA4) is the one member of the series carrying no
  RO:0004003 has-material-basis-in-germline-mutation-in edge; every other
  member does, checked against the MONDO SQLite build on 2026-09-25. Its
  CENATAC assignment here therefore rests on the OMIM 620153 / MedGen
  C5774267 record (cytogenetic location 11q23.3, matching CENATAC at 11q23.3
  in HGNC), the ClinVar variant submissions filed against that concept, and
  the CENATAC gene-discovery report cited in the CENATAC records above.

- name: Minor spliceosome AT-AC intron splicing failure
  description: >
    CENATAC is a component of the minor, U12-dependent spliceosome and promotes
    excision of a rare minor-intron subtype carrying AT-AN splice sites.
    Biallelic truncating CENATAC variants, or expression of the disease mutants,
    leave those introns retained, which is the molecular lesion in
    CENATAC-related MVA.
  genes:
  - preferred_term: CENATAC
    term:
      id: hgnc:30460
      label: CENATAC
  biological_processes:
  - preferred_term: minor (U12-dependent) spliceosomal mRNA splicing
    modifier: DECREASED
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  evidence:
  - reference: PMID:34009673
    reference_title: "Chromosomal instability by mutations in the novel minor spliceosome component CENATAC."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that CENATAC is a novel component of the minor (U12-dependent) spliceosome that promotes splicing of a specific, rare minor intron subtype."
    explanation: Places CENATAC in the minor spliceosome and identifies minor-intron splicing as the process it supports.
  - reference: PMID:34009673
    reference_title: "Chromosomal instability by mutations in the novel minor spliceosome component CENATAC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through exome sequencing of patients with constitutional mosaic aneuploidy, we identified biallelic truncating mutations in CENATAC (CCDC84)."
    explanation: Ties the biallelic truncating CENATAC genotype to patients with constitutional mosaic aneuploidy.
  downstream:
  - target: Chromosome segregation errors and mosaic aneuploidy
    description: >
      The authors present chromosome segregation errors as the route from the
      minor-intron splicing defect to constitutional aneuploidy, and state the
      link as suggested rather than established.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34009673
      reference_title: "Chromosomal instability by mutations in the novel minor spliceosome component CENATAC."
      supports: SUPPORT

  description: >
    Biallelic SLF2 variants cause a microcephalic growth-restriction disorder
    with cardiac abnormalities and anemia whose cytogenetic signature is
    segmented and dicentric chromosomes with mosaic variegated hyperploidy. The
    lesion is in the RAD18-SLF1/2-SMC5/6 genome-stability pathway, so the
    mechanism is replication stress and loss of sister chromatid cohesion rather
    than spindle assembly checkpoint failure.

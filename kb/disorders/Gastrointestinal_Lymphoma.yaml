name: Gastrointestinal Lymphoma
creation_date: "2026-08-18T13:20:00Z"
description: >-
  Gastrointestinal lymphoma is a non-Hodgkin (rarely Hodgkin) lymphoma arising in
  the digestive tract with the bulk of disease localized to that site. The
  gastrointestinal tract is the commonest extranodal site of lymphoma; within it
  the stomach is most often involved, followed by the small intestine and the
  ileocecal region, and diffuse large B-cell lymphoma is the commonest histologic
  type at essentially every site. What distinguishes gastrointestinal lymphoma
  from nodal lymphoma is not a distinct histology but the route by which it
  arises: sustained, site-restricted antigenic stimulation of gut mucosal
  lymphoid tissue. Chronic Helicobacter pylori gastritis raises the risk of
  gastric — but specifically not non-gastric — non-Hodgkin lymphoma; coeliac
  disease drives the intraepithelial T lymphocytes of the small bowel toward
  enteropathy-associated T-cell lymphoma; and immunoproliferative small
  intestinal disease (alpha heavy chain disease) arises in chronically infected
  small bowel. Because the disease is driven from outside the tumour cell in its
  early, antigen-dependent phase, removing the antigen can be curative — the
  basis for treating early gastric lymphoma with antibiotics rather than
  cytotoxic therapy. Later acquisition of transforming genetic lesions renders
  growth antigen-independent and antigen-directed therapy ineffective.
categories:
- Neoplastic
- Hematologic Malignancy
- Non-Hodgkin Lymphoma
parents:
- Lymphoma
- Digestive system cancer
disease_term:
  preferred_term: gastrointestinal lymphoma
  term:
    id: MONDO:0004699
    label: gastrointestinal lymphoma
notes: >-
  SUBTYPE AXIS (curation decision). MONDO offers three cuts through this
  concept: anatomic site (gastric, small intestine, colon, esophagus, rectum
  lymphoma), histology (MALT, DLBCL, mantle cell, Burkitt, EATL), and
  site+histology leaves (e.g. MONDO:0006226 gastric MALT lymphoma,
  MONDO:0006158 colorectal DLBCL). This entry models the ANATOMIC SITE axis
  only, and deliberately does not mix the three. Reasons: (i) site is the axis
  that constitutes the concept — MONDO defines gastrointestinal lymphoma as the
  intersection of lymphoma with location in the digestive system, so the site
  children are the immediate specializations of the defining property;
  (ii) site subtypes partition the disease cleanly, since a primary tumour has
  one primary site, whereas histology does not partition it and the
  site+histology leaves overlap the site subtypes (gastric MALT lymphoma is a
  proper part of gastric lymphoma), which is exactly the query-breaking mixture
  to avoid; (iii) the histology axis is already curated as standalone Disease
  entries — MALT_Lymphoma, Diffuse_Large_B_Cell_Lymphoma, Mantle_Cell_Lymphoma,
  Peripheral_T_Cell_Lymphoma — collected by the B-Cell_Non-Hodgkin_Lymphoma
  grouping, so re-listing them here as subtypes would duplicate rather than add.
  Histology is instead carried as prose and evidence on this entry and on the
  site subtypes.

  SCOPE. Restricted to the tubular gastrointestinal tract, matching clinical
  usage of "primary gastrointestinal lymphoma". The five site subtypes curated
  here (oesophagus, stomach, small intestine, colon, rectum) were selected by
  prevalence and are NOT an exhaustive enumeration of the tubular-GI
  descendants of MONDO:0004699: MONDO:0002034 cecum lymphoma, MONDO:0001237
  appendix lymphoma and MONDO:0001888 anus lymphoma are also tubular-GI
  descendants and are not modelled as separate subtypes. The cecum omission is
  the one worth flagging, since this entry cites the ileocecal region as the
  third commonest site; ileocecal disease is carried under the Small Intestine
  and Colon subtypes rather than as its own node. MONDO:0004699 has further
  descendants covering the accessory digestive organs (liver, pancreas,
  gallbladder lymphoma) and Waldeyer's ring (MONDO:0044884 tonsillar lymphoma)
  because its logical definition uses the whole digestive system
  (UBERON:0001007); those are outside the tubular-tract scope, and tonsillar
  lymphoma already has its own entry (Primary_Tonsillar_Lymphoma).
  MONDO:0002966 and MONDO:0004104 are splenic manifestations of prolymphocytic
  and hairy cell leukaemia and are out of scope entirely — they are not
  gastrointestinal lymphomas.

  CELL TYPE IMPRECISION (on the record, deliberately not "fixed"). The
  Antigen-Driven Clonal Lymphoid Expansion node is annotated with CL:0009060,
  whose canonical label is "marginal zone B cell of lymph node" — anatomically
  wrong for gut MALT, where the cell is not in a lymph node. CL currently
  offers nothing better: the only sibling is CL:0000845 marginal zone B cell of
  spleen, and there is no mucosa-associated marginal zone B cell term. The term
  is retained for consistency with the existing MALT_Lymphoma precedent, and
  the preferred_term is written as the unqualified "marginal zone B cell" so
  the display does not assert the nodal location. This is recorded here rather
  than left looking settled; a CL new-term request for a mucosa-associated
  marginal zone B cell would resolve it.

  RELATION TO EXISTING ENTRIES. This entry is the anatomic/mechanistic umbrella
  and cross-references rather than duplicates the histology entries. The
  H. pylori-driven MALT arm is curated in depth in MALT_Lymphoma (including the
  t(11;18)/BIRC3::MALT1 translocation biology); what is added here is the
  site-specificity of the antigen drive and the shared final common path by
  which any gut lymphoma produces bleeding, obstruction and perforation.

  GENETIC SCOPE. The genetic: section here is deliberately restricted to the
  gastrointestinal T-cell arm (EATL and MEITL) and to the coeliac HLA
  susceptibility haplotype that gates it. The B-cell/MALT genetics —
  t(11;18)(q21;q21) and the BIRC3::MALT1 fusion above all — are curated in
  MALT_Lymphoma and are referenced from the transformation node rather than
  duplicated. The T-cell genetics have no such home: there is no EATL or MEITL
  entry anywhere in kb/disorders/, so leaving them out would leave them
  uncurated in the KB entirely, which is why they are carried here.

  MODULE CONFORMANCE. Two nodes conform to tumor_promoting_inflammation
  (Chronic Inflammatory Stimulus, Pro-Tumorigenic Inflammatory
  Microenvironment). Conformance to the module's third node,
  "Hallmark-Promoting Inflammatory Output", is deliberately NOT declared: that
  node models bioactive molecules supplied by the inflammatory microenvironment
  to the tumour, whereas the corresponding node here ("Transformation to
  Antigen-Independent Lymphoma") models an acquired tumour-cell-intrinsic
  genetic lesion that uncouples growth from that microenvironment. Declaring
  conformance would misstate the mechanism.
has_subtypes:
- name: Gastric
  display_name: Gastric Lymphoma
  description: >-
    Lymphoma of the stomach, the commonest site of gastrointestinal lymphoma.
    Histologically dominated by diffuse large B-cell lymphoma and by
    extranodal marginal zone (MALT) lymphoma; the latter is the arm most
    tightly linked to chronic Helicobacter pylori infection and the one in
    which antibiotic eradication alone can induce remission. Gastric mantle
    cell lymphoma (MONDO:0006225) is a rarer site+histology combination not
    modelled as a separate subtype here.
  subtype_term:
    preferred_term: gastric lymphoma
    term:
      id: MONDO:0001059
      label: gastric lymphoma
  evidence:
  - reference: PMID:33618613
    reference_title: "A 10-year cohort study of 175 primary gastrointestinal lymphoma cases in Thailand: clinical features and outcomes in the immunochemotherapy era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The stomach was the most common site of gastrointestinal (GI) organ involvement by lymphoma (38.9%), followed by the small intestine (23.4%)"
    explanation: Cohort of 175 primary gastrointestinal lymphomas quantifies the stomach as the most frequently involved site.
- name: Small Intestine
  display_name: Small Intestine Lymphoma
  description: >-
    Lymphoma of the small bowel, the second commonest gastrointestinal site.
    It carries the two distinctive non-gastric antigen-driven entities:
    enteropathy-associated T-cell lymphoma arising on a background of coeliac
    disease, and immunoproliferative small intestinal disease (alpha heavy
    chain disease). Small-bowel disease is disproportionately responsible for
    obstruction and perforation because the lumen is narrow and the wall thin.
  subtype_term:
    preferred_term: small intestine lymphoma
    term:
      id: MONDO:0001852
      label: small intestine lymphoma
  evidence:
  - reference: PMID:21390139
    reference_title: "Primary gastrointestinal lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most frequent sites in order of its occurrence are the stomach followed by small intestine and ileocecal region"
    explanation: Places the small intestine second in the site distribution of gastrointestinal lymphoma.
- name: Colon
  display_name: Colon Lymphoma
  description: >-
    Lymphoma of the colon, most often diffuse large B-cell lymphoma, with
    colonic MALT lymphoma (MONDO:0006154) and colonic Burkitt lymphoma
    (MONDO:0006150) as recognized but uncommon site+histology combinations.
    Rare in absolute terms but of rising recorded incidence, with survival
    improving as management has shifted from resection toward systemic therapy.
  subtype_term:
    preferred_term: colon lymphoma
    term:
      id: MONDO:0002035
      label: colon lymphoma
  evidence:
  - reference: PMID:33178655
    reference_title: "Changes in Incidence and Survival by Decade of Patients With Primary Colorectal Lymphoma: A SEER Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PCL incidence increased from 1.4 per 1 000 000 people in 1973 to 3.5 in 2014"
    explanation: SEER analysis documents the low absolute incidence of primary colorectal lymphoma and its rise over four decades.
- name: Esophagus
  display_name: Esophagus Lymphoma
  description: >-
    Lymphoma of the oesophagus, the rarest tubular gastrointestinal site.
    Presents with dysphagia and weight loss; diffuse large B-cell lymphoma
    predominates, with occasional low-grade MALT lymphoma.
  subtype_term:
    preferred_term: esophagus lymphoma
    term:
      id: MONDO:0001188
      label: esophagus lymphoma
  evidence:
  - reference: PMID:36756091
    reference_title: "Primary Esophageal Lymphoma: A Histopathological Experience from Two Tertiary Hospitals, Western Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PEL is an extremely rare disease with male predominance. DLBCL is the most common pathological type in our community."
    explanation: Two-centre series over twenty years yielded only eight cases, establishing both the rarity of primary oesophageal lymphoma and DLBCL predominance.
- name: Rectum
  display_name: Rectum Lymphoma
  description: >-
    Lymphoma of the rectum, rare in adults and very rare in children. Grouped
    with colonic disease as colorectal lymphoma (MONDO:0024656) in most
    epidemiological series, including the SEER analysis cited for the colon
    subtype.
  subtype_term:
    preferred_term: rectum lymphoma
    term:
      id: MONDO:0002166
      label: rectum lymphoma
  evidence:
  - reference: PMID:35125760
    reference_title: "Primary Rectal Lymphoma: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rectum as primary site for lymphoma is rare in adults and extremely rare in children."
    explanation: States the rarity of the rectum as a primary lymphoma site.
pathophysiology:
- name: Chronic Mucosal Antigenic Stimulation
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  biological_scale: TISSUE
  description: >-
    A persistent, site-restricted antigenic stimulus drives chronic inflammation
    in gastrointestinal mucosa. The stimuli are organ-specific rather than
    systemic: Helicobacter pylori gastritis in the stomach, dietary gluten in
    coeliac disease in the small bowel, and chronic small-bowel infection in
    immunoproliferative small intestinal disease. The site-specificity is the
    defining feature and is directly evidenced: prior H. pylori infection raises
    the risk of gastric non-Hodgkin lymphoma roughly six-fold while conferring
    no measurable risk of non-gastric non-Hodgkin lymphoma. This is the
    disorder-specific substitution for the module's generic chronic
    inflammatory trigger.
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  - preferred_term: intestine
    term:
      id: UBERON:0000160
      label: intestine
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:8145781
    reference_title: "Helicobacter pylori infection and gastric lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with gastric lymphoma were significantly more likely than matched controls to have evidence of previous H. pylori infection (matched odds ratio, 6.3; 95 percent confidence interval, 2.0 to 19.9)."
    explanation: Nested case-control study within 230,593 prospectively followed participants quantifies chronic H. pylori infection as an antecedent risk factor for gastric lymphoma.
  - reference: PMID:8145781
    reference_title: "Helicobacter pylori infection and gastric lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-Hodgkin's lymphoma affecting the stomach, but not other sites, is associated with previous H. pylori infection."
    explanation: Establishes that the antigen drive is site-restricted, the feature that separates gastrointestinal from nodal lymphomagenesis in this model.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "EATL is an aggressive T-cell non-Hodgkin lymphoma with poor prognosis and is largely localized to the small intestine. EATL is closely associated with coeliac disease (CD)"
    explanation: Supplies the small-bowel, T-cell counterpart of the same chronic-antigen trigger. Evidence source is OTHER because this is a review article.
  - reference: PMID:29372346
    reference_title: "Heavy Chain Disease of the Small Bowel."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A link between Campylobacter jejuni infection and IPSID has been established, but there is controversy as to the role played by this organism in disease pathogenesis."
    explanation: >-
      Supports a third chronic-infection trigger in the small bowel, but is
      marked PARTIAL because the review states explicitly that the organism's
      causal role remains contested. Evidence source is OTHER because this is a
      review article.
  downstream:
  - target: Pro-Tumorigenic Mucosal Lymphoid Microenvironment
    description: >-
      Sustained antigenic stimulation recruits and organizes a chronic mucosal
      immune infiltrate at the future tumour site.
    evidence:
    - reference: PMID:20303878
      reference_title: "Immunity, inflammation, and cancer."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "tumorigenic pathogens subvert host immunity and establish persistent infections associated with low grade but chronic inflammation"
      explanation: >-
        States the general step this edge asserts — a persistent infectious
        antigenic stimulus establishing a chronic inflammatory infiltrate that
        precedes tumour development. Evidence source is OTHER because this is a
        review article.
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RCDII is characterized by unresponsiveness to a GFD, providing a chronic inflammatory environment, which promotes genotoxic stress, ultimately leading to malignant transformation"
      explanation: >-
        The small-bowel instance of the same edge: continued gluten exposure in
        a patient not responding to a gluten-free diet is what supplies the
        chronic inflammatory environment modelled by the downstream node.
        Evidence source is OTHER because this is a review article.
- name: Pro-Tumorigenic Mucosal Lymphoid Microenvironment
  conforms_to: "tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory Microenvironment"
  biological_scale: TISSUE
  description: >-
    Chronic stimulation organizes lymphoid tissue in mucosa that normally
    contains little or none — acquired mucosa-associated lymphoid tissue in the
    H. pylori-infected stomach — together with macrophages and other innate
    cells and a cytokine-rich milieu. This infiltrate is not a bystander: the
    mucosal immune microenvironment actively enhances neoplastic transformation
    of the resident lymphocytes. It is the disorder-specific substitution for
    the module's central pro-tumorigenic inflammatory microenvironment node.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: positive regulation of cytokine production
    modifier: INCREASED
    term:
      id: GO:0001819
      label: positive regulation of cytokine production
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The immune microenvironment of mucosal cells within the small intestine enhances the process of neoplastic transformation of IELs into EATL."
    explanation: States directly that the mucosal immune microenvironment promotes neoplastic transformation, the claim this node makes. Evidence source is OTHER because this is a review article.
  - reference: PMID:20303878
    reference_title: "Immunity, inflammation, and cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Immune cells that infiltrate tumors engage in an extensive and dynamic crosstalk with cancer cells"
    explanation: The general infiltrating-immune-cell/tumour-cell crosstalk that this node specializes to gut mucosa, and the evidence the parent module node rests on. Evidence source is OTHER because this is a review article.
  downstream:
  - target: Antigen-Driven Clonal Lymphoid Expansion
    description: >-
      The organized mucosal infiltrate supplies the antigen and accessory-cell
      signals that select and expand a lymphoid clone.
    evidence:
    - reference: PMID:21568677
      reference_title: "Protease activity of the API2-MALT1 fusion oncoprotein in MALT lymphoma development and treatment."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Gastric mucosa-associated lymphoid tissue (MALT) lymphoma is a prototypical cancer that occurs in the setting of chronic inflammation"
      explanation: >-
        Marked PARTIAL: establishes that the clonal MALT lymphoma of this
        downstream node arises specifically in the chronic-inflammatory setting
        modelled by the upstream node, but does not itself demonstrate that the
        infiltrate supplies the accessory-cell signals that select the clone.
  - target: IL-15-Driven JAK-STAT Activation in Intraepithelial Lymphocytes
    description: >-
      In the coeliac small bowel the same microenvironment supplies the IL-15
      that deregulates intraepithelial lymphocyte signalling.
    evidence:
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The mechanism of this uncontrolled chronic antigenic stimulation is facilitated by the IL-15Rα, which can bind IL-15 and form enduring complexes at the cell membrane, subsequently activating RCDII IELs"
      explanation: >-
        States the edge directly: IL-15 held in the inflamed mucosal
        microenvironment acts through IL-15Rα on intraepithelial lymphocytes to
        activate them. The statement sits in the body of this full-text-cached
        review rather than in its abstract. Evidence source is OTHER because
        this is a review article.
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Epithelial-derived IL-15 plays an important role in the expansion of aberrant cell population and its subsequent conversion to EATL."
      explanation: >-
        Identifies the mucosal epithelium as the source of the IL-15 acting on
        the intraepithelial lymphocyte compartment, which is what makes this a
        microenvironment-to-lymphocyte edge rather than a cell-autonomous step.
        Full-text statement, not abstract. Evidence source is OTHER because this
        is a review article.
- name: Antigen-Driven Clonal Lymphoid Expansion
  biological_scale: CELLULAR
  description: >-
    Chronic antigen-receptor engagement plus accessory-cell help selects and
    expands a clonal lymphoid population within the mucosa. Growth at this stage
    is still driven from outside the tumour cell and therefore still dependent
    on the antigen — the property that makes early, antigen-dependent gastric
    lymphoma curable by eradicating the organism rather than by cytotoxic
    therapy. The B-cell (MALT) arm of this step is curated in depth in the
    MALT_Lymphoma entry.
  cell_types:
  - preferred_term: marginal zone B cell
    term:
      id: CL:0009060
      label: marginal zone B cell of lymph node
  biological_processes:
  - preferred_term: B cell receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
  - preferred_term: B cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042100
      label: B cell proliferation
  evidence:
  - reference: PMID:21568677
    reference_title: "Protease activity of the API2-MALT1 fusion oncoprotein in MALT lymphoma development and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most gastric MALT lymphomas require ongoing antigenic stimulation for continued tumor growth, and Stage I disease is usually cured by eradicating the causative microorganism, Helicobacter pylori, with antibiotics."
    explanation: Establishes that expansion at this stage remains dependent on continuing antigenic stimulation, which is what makes antigen removal curative.
  downstream:
  - target: Transformation to Antigen-Independent Lymphoma
    description: >-
      Prolonged proliferation permits acquisition of transforming genetic
      lesions that uncouple growth from the antigen.
    evidence:
    - reference: PMID:21568677
      reference_title: "Protease activity of the API2-MALT1 fusion oncoprotein in MALT lymphoma development and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in a subset of MALT lymphomas, chromosomal translocations are acquired that render the lymphoma antigen-independent"
      explanation: >-
        States this edge exactly — the antigen-dependent clone acquires
        chromosomal translocations that make it antigen-independent. Same quote
        already verified on the downstream node itself; carried here because the
        causal edge is its own claim.
  - target: Mucosal and Transmural Lymphomatous Infiltration
    description: >-
      The expanding clone occupies the mucosa and submucosa of the involved gut
      segment. Progression to full-thickness, wall-destroying infiltration is
      carried on the edge from the transformation node rather than on this one.
    evidence:
    - reference: PMID:36756091
      reference_title: "Primary Esophageal Lymphoma: A Histopathological Experience from Two Tertiary Hospitals, Western Saudi Arabia."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "MALT lymphoma is composed of submucosal proliferation of small centrocyte-like cells."
      explanation: >-
        Marked PARTIAL, and the weakest of this entry's edge citations: the
        histopathology series shows that the low-grade antigen-driven clone
        modelled by the upstream node presents as a proliferation occupying the
        submucosa, which is why the edge description was narrowed to mucosal and
        submucosal occupation. It does not evidence transmural progression, and
        no cached source states that step for the antigen-dependent stage.
- name: IL-15-Driven JAK-STAT Activation in Intraepithelial Lymphocytes
  biological_scale: CELLULAR
  description: >-
    The small-bowel T-cell arm. In coeliac disease the inflamed mucosa
    over-produces IL-15, which acts on receptors on intraepithelial
    lymphocytes and deregulates JAK-STAT signalling; these intraepithelial
    lymphocytes are the postulated cell of origin of enteropathy-associated
    T-cell lymphoma, and JAK/STAT pathway mutations have been associated with
    the type II refractory coeliac disease-derived form. This is the mechanistic
    reason a T-cell lymphoma arises specifically in the gut rather than in nodes.
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  cell_types:
  - preferred_term: intestinal intraepithelial lymphocyte
    term:
      id: CL:0020035
      label: intestinal intraepithelial lymphocyte
  biological_processes:
  - preferred_term: JAK-STAT signalling
    modifier: INCREASED
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  - preferred_term: T cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cytokines such as IL-15 can activate and crucially deregulate the JAK-STAT signaling pathway by binding to receptors on the surface of IELs."
    explanation: States the IL-15 to JAK-STAT deregulation step in intraepithelial lymphocytes modelled by this node. Evidence source is OTHER because this is a review article.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The cells of origin of EATL has been postulated to be normal small intestinal intraepithelial T-lymphocytes (IELs)"
    explanation: Identifies the intraepithelial lymphocyte as the cell of origin annotated on this node. Evidence source is OTHER because this is a review article.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, mutations in the JAK/STAT pathway have been associated with RCDII-derived EATL."
    explanation: >-
      Supports the JAK/STAT-mutation clause of this node's description. Note the
      source claims association only — it does not report the mutations as
      recurrent or establish them as activating — so the description was softened
      to match rather than the stronger claim being left uncited. Evidence source
      is OTHER because this is a review article.
  downstream:
  - target: Transformation to Antigen-Independent Lymphoma
    description: >-
      Deregulated JAK-STAT signalling contributes to overt transformation of
      the intraepithelial lymphocyte compartment.
    evidence:
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Ultimately, this results in the inhibition of elimination and enables the acquisition of mutations and malignant transformation into EATL"
      explanation: >-
        Supports the causal step from deregulated IL-15/JAK-STAT signalling to
        malignant transformation of the intraepithelial lymphocyte compartment.
        Marked PARTIAL because the source establishes malignant transformation
        but does not itself assert that the resulting tumour is
        antigen-independent, which is the further claim carried by the target
        node's name. Full-text statement, not abstract. Evidence source is OTHER
        because this is a review article.
- name: Transformation to Antigen-Independent Lymphoma
  biological_scale: MOLECULAR
  description: >-
    Acquisition of transforming genetic lesions during prolonged
    antigen-driven proliferation uncouples growth from the initiating stimulus.
    In the gastric MALT arm the paradigmatic lesions are translocations that
    constitutively activate NF-kB, above all t(11;18)(q21;q21) generating
    BIRC3::MALT1; in the coeliac arm they are JAK/STAT pathway mutations. The
    clinical corollary is direct and is why this node matters for management:
    once the tumour is antigen-independent, removing the antigen no longer
    treats it. The translocation biology itself is curated in MALT_Lymphoma and
    is referenced rather than duplicated here.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:21568677
    reference_title: "Protease activity of the API2-MALT1 fusion oncoprotein in MALT lymphoma development and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a subset of MALT lymphomas, chromosomal translocations are acquired that render the lymphoma antigen-independent. The recurrent translocation t(11;18)(q21;q21) is associated with failure to respond to antibiotic therapy and increased rate of dissemination."
    explanation: Establishes both the acquired lesion and its clinical consequence, loss of response to antigen-directed therapy.
  - reference: PMID:29372346
    reference_title: "Heavy Chain Disease of the Small Bowel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IPSID is typically regarded as a pre-lymphomatous condition with eventual progression to frank lymphoma"

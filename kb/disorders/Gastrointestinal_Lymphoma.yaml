- name: HLA-DQ2.5 haplotype
  gene_term:
    preferred_term: HLA-DQB1 (HLA-DQ2.5 haplotype, with HLA-DQA1)
    term:
      id: hgnc:4944
      label: HLA-DQB1
  association: Germline HLA susceptibility haplotype for coeliac disease and its progression to EATL
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  subtype: Small Intestine
  notes: >-
    The coeliac-disease HLA class II risk haplotype. This is a germline
    susceptibility/risk association, NOT a somatic driver: the haplotype is a
    common population variant that sets the risk of coeliac disease and of its
    malignant evolution, and is neither necessary nor sufficient for lymphoma.
    The gene_term slot is single-valued, so it is bound to HLA-DQB1; the
    HLA-DQ2.5 heterodimer is encoded jointly by HLA-DQA1 (hgnc:4942) and
    HLA-DQB1, and neither locus alone names the haplotype. The reported 53.3% is
    the proportion of EATL patients who are HLA-DQ2.5 homozygous — a frequency
    among cases, not a relative risk, an attributable fraction, or a per-gene
    case fraction — so it is not recorded in frequency or case_fractions.
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In one systematic review, HLA-DQ2.5 homozygosity was found in 53.3% of patients with EATL and 44.1% of patients with RCDII"
    explanation: >-
      Quantifies HLA-DQ2.5 homozygosity among EATL and RCDII patients. Full-text
      statement, not abstract. Evidence source is OTHER because this is a review
      article.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, there is a strong correlation between HLA-DQ2.5 homozygosity and the development of EATL"
    explanation: >-
      States the correlation between the haplotype and EATL development,
      supporting the SUSCEPTIBILITY relationship type — the source claims a
      correlation, which is why this is curated as risk rather than causation.
      Full-text statement, not abstract. Evidence source is OTHER because this
      is a review article.
environmental:
- name: Chronic Helicobacter pylori infection
  description: >-
    Persistent gastric colonization by Helicobacter pylori, which induces the
    acquired mucosa-associated lymphoid tissue on which gastric lymphoma
    develops. The exposure is the archetype of a site-restricted antigenic
    drive: it raises gastric lymphoma risk about six-fold while conferring no
    detectable risk of lymphoma at other sites.
  effect: Increases risk of gastric lymphoma
  exposure_term:
    preferred_term: exposure to Helicobacter pylori
    term:
      id: ECTO:3000003
      label: exposure to Helicobacter pylori
  influences_mechanisms:
  - target: Chronic Mucosal Antigenic Stimulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic H. pylori gastritis is the route by which sustained mucosal
      antigenic stimulation is established in the stomach.
    evidence:
    - reference: PMID:8145781
      reference_title: "Helicobacter pylori infection and gastric lymphoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with gastric lymphoma were significantly more likely than matched controls to have evidence of previous H. pylori infection (matched odds ratio, 6.3; 95 percent confidence interval, 2.0 to 19.9)."
      explanation: Prospective nested case-control evidence that antecedent H. pylori infection raises gastric lymphoma risk, supporting this exposure as the trigger of the mucosal antigenic-stimulation node.
    - reference: PMID:8145781
      reference_title: "Helicobacter pylori infection and gastric lymphoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "No association was found between nongastric non-Hodgkin's lymphoma and previous H. pylori infection"
      explanation: The internal negative control showing the effect is confined to the site of infection, which is what makes this a gastrointestinal rather than a systemic lymphomagenic exposure.
  evidence:
  - reference: PMID:37122607
    reference_title: "Effectiveness of Helicobacter pylori eradication in the treatment of early-stage gastric mucosa-associated lymphoid tissue lymphoma: An up-to-date meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled CR of H. pylori-positive early-stage GML after bacterial eradication was 75.18% (95%CI: 70.45%-79.91%)."
    explanation: Regression of lymphoma on removing the organism is the strongest evidence that the exposure is causal rather than merely associated.
- name: Dietary gluten exposure in coeliac disease
  description: >-
    Continued exposure to dietary gluten in a genetically susceptible
    (HLA-DQ2/DQ8) individual sustains the coeliac enteropathy on which
    enteropathy-associated T-cell lymphoma arises, particularly via type II
    refractory coeliac disease.
  effect: Increases risk of enteropathy-associated T-cell lymphoma
  notes: >-
    Deliberately left without an exposure_term. ECTO was searched
    (sqlite:obo:ecto) and contains no term for gluten or gluten-containing-food
    exposure. Per the dismech terms rule, no term is preferred to a bad one.
  influences_mechanisms:
  - target: Chronic Mucosal Antigenic Stimulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Gluten-driven coeliac enteropathy is the route by which sustained mucosal
      antigenic stimulation is established in the small bowel.
    evidence:
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "EATL is closely associated with coeliac disease (CD) and is seen mostly in patients originating from Northern Europe."
      explanation: Links the coeliac enteropathy to the small-bowel lymphoma modelled downstream of this node. Evidence source is OTHER because this is a review article.
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Although EATL can occur de novo, individuals with RCDII are at a higher risk of developing EATL."
      explanation: Identifies refractory coeliac disease type II as the high-risk intermediate on this exposure route. Evidence source is OTHER because this is a review article.
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, poor adherence to a GFD, HLA-DQ2 homozygosity, and late diagnosis of CD are recognized as risk factors for the malignant evolution of CD"
    explanation: >-
      Poor adherence to a gluten-free diet is continued gluten exposure, so
      naming it a risk factor for malignant evolution is the most direct
      available support for treating the exposure itself — rather than coeliac
      disease alone — as the modifiable driver. Evidence source is OTHER because
      this is a review article.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Although the duration of gluten diet exposure plays an important role in EATL pathogenesis via the enhancement of inflammatory signaling pathways mediated by CD4+ T-cells, many cases of EATL arise despite a strict GFD"
    explanation: >-
      Recorded as PARTIAL because the source supports and bounds the claim in
      one sentence: exposure duration matters mechanistically, but a strict
      gluten-free diet does not abolish EATL risk. Removing this exposure is
      therefore not curative, which is the honest limit on the eradication
      analogy drawn from the H. pylori arm.
- name: Chronic small-bowel bacterial infection in immunoproliferative small intestinal disease
  description: >-
    Chronic small-intestinal infection, with Campylobacter jejuni the organism
    most often implicated, associated with immunoproliferative small intestinal
    disease (alpha heavy chain disease) in areas of poor sanitation. IPSID
    behaves as a pre-lymphomatous lesion that can regress on antibiotics and can
    progress to overt small-bowel lymphoma.
  effect: Associated with immunoproliferative small intestinal disease and small-bowel lymphoma
  notes: >-
    Deliberately left without an exposure_term. ECTO was searched
    (sqlite:obo:ecto) and contains no exposure term for Campylobacter jejuni.
    The organism's causal role is explicitly contested in the cited review, so
    the mechanism link is recorded as PREDISPOSES rather than TRIGGERS, with
    causal_link_type UNKNOWN, and the controversy is carried as a discussion.
  influences_mechanisms:
  - target: Chronic Mucosal Antigenic Stimulation
    environmental_effect: PREDISPOSES
    causal_link_type: UNKNOWN
    description: >-
      Chronic small-bowel infection is associated with the sustained mucosal
      antigenic stimulation underlying IPSID, but the causal contribution of the
      implicated organism is not settled.
    evidence:
    - reference: PMID:29372346
      reference_title: "Heavy Chain Disease of the Small Bowel."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "A link between Campylobacter jejuni infection and IPSID has been established, but there is controversy as to the role played by this organism in disease pathogenesis."
      explanation: >-
        Supports an established association while explicitly withholding a
        causal claim, which is why this link is PREDISPOSES and the evidence is
        PARTIAL. Evidence source is OTHER because this is a review article.
  evidence:
  - reference: PMID:29372346
    reference_title: "Heavy Chain Disease of the Small Bowel."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "IPSID is typically regarded as a pre-lymphomatous condition with eventual progression to frank lymphoma; however, recent reports of longstanding non-progressive cases have expanded its clinical spectrum."
    explanation: >-
      Supports the exposure-associated lesion being pre-lymphomatous, which is
      what connects this exposure to small-bowel lymphoma rather than to IPSID
      alone. PARTIAL because the same sentence records non-progressive cases, so
      progression is characteristic but not obligate — consistent with this
      entry's PREDISPOSES / UNKNOWN framing. Evidence source is OTHER because
      this is a review article.
diagnosis:
- name: Endoscopic biopsy with histopathological analysis
  description: >-
    The confirmatory test. Because lymphomatous infiltration of the gut wall
    produces a presentation and a radiological appearance indistinguishable
    from other benign and malignant gastrointestinal disease, definitive
    diagnosis requires tissue: endoscopic biopsy of the lesion with
    histopathological analysis and immunophenotyping. A first biopsy is not
    invariably diagnostic — repeat biopsy, or in a minority of cases surgical
    resection, may be needed — which matters clinically because the differential
    it must resolve includes carcinoma.
  diagnosis_term:
    preferred_term: endoscopic biopsy of the gastrointestinal lesion
    term:
      id: NCIT:C15389
      label: Endoscopic Biopsy
  results: >-
    Histopathology and immunophenotype establishing lymphoma and its lineage
    and subtype (most often diffuse large B-cell or extranodal marginal zone
    MALT lymphoma).
  evidence:
  - reference: PMID:21390139
    reference_title: "Primary gastrointestinal lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they are not specific, thus mandating histopathological analysis for its definitive diagnosis"
    explanation: States that imaging features are non-specific and that histopathological analysis is required for definitive diagnosis, which is the claim this diagnostic entry makes.
  - reference: PMID:36756091
    reference_title: "Primary Esophageal Lymphoma: A Histopathological Experience from Two Tertiary Hospitals, Western Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six cases were diagnosed based on endoscopic biopsies and two after resection."
    explanation: Documents endoscopic biopsy as the route to diagnosis in the majority of a consecutive series, with resection needed in the remainder.
  - reference: PMID:36756091
    reference_title: "Primary Esophageal Lymphoma: A Histopathological Experience from Two Tertiary Hospitals, Western Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first biopsies were diagnostic in five of them, and repeated biopsies were required to make the diagnosis in one case."
    explanation: Supports the caveat curated here that a first endoscopic biopsy is not invariably diagnostic and may need repeating.
  - reference: PMID:35125760
    reference_title: "Primary Rectal Lymphoma: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it may be difficult to distinguish the primary adenocarcinoma of the colon/rectum on radiology and biopsy is therefore crucial"
    explanation: Names the specific differential — colorectal adenocarcinoma — that radiology cannot resolve and biopsy must.
- name: Helicobacter pylori testing
  description: >-
    Determination of H. pylori status in gastric lymphoma. This is not a
    diagnostic test for the lymphoma itself but the test that GATES first-line
    therapy: eradication is recommended as the initial treatment of early-stage
    gastric MALT lymphoma, and the entire evidence base for that recommendation
    is drawn from H. pylori-positive patients, so a patient cannot be assigned
    to antigen-removal therapy without it.
  diagnosis_term:
    preferred_term: Helicobacter pylori testing
    term:
      id: NCIT:C189536
      label: Helicobacter pylori Measurement
  results: H. pylori positive or negative status in a patient with gastric lymphoma.
  notes: >-
    Curated as the gate on treatment 1 (Helicobacter pylori Eradication) rather
    than as a confirmatory test for lymphoma. The cached sources establish that
    the eradication evidence base is restricted to H. pylori-positive
    early-stage disease; they do not compare the individual assays (urea breath
    test, stool antigen, histology, serology), so no specific method is asserted
    and the NCIT term is left at the general measurement level.
  evidence:
  - reference: PMID:37122607
    reference_title: "Effectiveness of Helicobacter pylori eradication in the treatment of early-stage gastric mucosa-associated lymphoid tissue lymphoma: An up-to-date meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prospective and retrospective observational studies evaluating the CR of early-stage GML following bacterial eradication in H. pylori-positive patients."
    explanation: The meta-analysis eligibility criterion shows the eradication evidence base is defined by H. pylori-positive status, which is what makes testing the gate on that therapy.
  - reference: PMID:37122607
    reference_title: "Effectiveness of Helicobacter pylori eradication in the treatment of early-stage gastric mucosa-associated lymphoid tissue lymphoma: An up-to-date meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical practice guidelines currently recommend H. pylori eradication as the preferred initial treatment for early-stage GML."
    explanation: Establishes the treatment that this test gates.
- name: Staging and extent-of-disease workup
  description: >-
    Assessment of disease extent once lymphoma is confirmed. Stage is
    load-bearing for management in this disease — antigen-removal therapy is
    offered for early-stage gastric disease and systemic therapy for advanced
    disease — and cross-sectional and functional imaging with histologic
    identification of lesions is what establishes it. The workup described for
    the small-bowel T-cell arm comprises magnetic resonance enteroclysis,
    positron emission tomography, and histologic identification of lesions.
  diagnosis_term:
    preferred_term: positron emission tomography as part of the staging workup
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  results: Anatomic extent of disease, used to assign stage and select between antigen-directed and systemic therapy.
  notes: >-
    The NCIT term binds the positron emission tomography component only; the
    cached source names magnetic resonance enteroclysis in the same workup, and
    NCIT has no enteroclysis term (searched via sqlite:obo:ncit). No formal
    staging system is asserted here: a stages: section using the Lugano
    classification would be the right home for that and is deliberately left to
    separate work rather than invented from these sources.
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An extensive clinical diagnostic workup involves magnetic resonance enteroclysis, a positron emission tomography scan, and a histologic identification of lesions present"
    explanation: >-
      Enumerates the diagnostic and staging workup curated here. Stated for the
      enteropathy-associated T-cell arm, and the statement sits in the body of
      this full-text-cached review rather than in its abstract. Evidence source
      is OTHER because this is a review article.
  - reference: PMID:26988370
    reference_title: "Anatomic distribution, clinical features, and survival data of 87 cases primary gastrointestinal lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis showed that clinical stage and sources of cells were the significant independent prognostic factors."
    explanation: Establishes that clinical stage is an independent prognostic factor in primary gastrointestinal lymphoma, which is why extent-of-disease assessment is curated as a distinct diagnostic step.
treatments:
- name: Helicobacter pylori Eradication
  description: >-
    Antibiotic eradication of H. pylori is first-line therapy for early-stage
    H. pylori-positive gastric MALT lymphoma and induces complete remission in
    about three quarters of such patients. It is the clearest demonstration in
    oncology that removing a driving antigen can cure a lymphoma, and it works
    only while the tumour remains antigen-dependent — the t(11;18)-positive,
    antigen-independent tumours modelled by the transformation node do not
    respond.
  context: Gastric subtype; early-stage, H. pylori-positive disease.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Chronic Mucosal Antigenic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Eradicating the organism removes the antigenic stimulus that sustains the
      antigen-dependent phase of the disease.
    evidence:
    - reference: PMID:21568677
      reference_title: "Protease activity of the API2-MALT1 fusion oncoprotein in MALT lymphoma development and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most gastric MALT lymphomas require ongoing antigenic stimulation for continued tumor growth, and Stage I disease is usually cured by eradicating the causative microorganism, Helicobacter pylori, with antibiotics."
      explanation: Directly links removal of the antigenic stimulus to cure of early-stage disease, the mechanism this treatment edge asserts.
  evidence:
  - reference: PMID:37122607
    reference_title: "Effectiveness of Helicobacter pylori eradication in the treatment of early-stage gastric mucosa-associated lymphoid tissue lymphoma: An up-to-date meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled CR of H. pylori-positive early-stage GML after bacterial eradication was 75.18% (95%CI: 70.45%-79.91%)."
    explanation: Meta-analysis quantifies complete remission after eradication in early-stage H. pylori-positive gastric MALT lymphoma.
  - reference: PMID:37122607
    reference_title: "Effectiveness of Helicobacter pylori eradication in the treatment of early-stage gastric mucosa-associated lymphoid tissue lymphoma: An up-to-date meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-regression analysis identified statistically significant effect modifiers, including the proportion of patients with t(11;18)(q21;q21)-positive GML and the risk of bias in each study."
    explanation: Shows that t(11;18) positivity modifies response, consistent with loss of antigen dependence after transformation.
- name: Rituximab-Containing Immunochemotherapy
  description: >-
    Anti-CD20 immunochemotherapy, typically R-CHOP, is standard systemic therapy
    for aggressive B-cell gastrointestinal lymphoma, which is predominantly
    diffuse large B-cell lymphoma. Its adoption is associated with improved
    overall survival in primary gastrointestinal lymphoma cohorts.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  regimen_term:
    preferred_term: R-CHOP regimen
    term:
      id: NCIT:C9760
      label: R-CHOP Regimen
  target_mechanisms:
  - target: Transformation to Antigen-Independent Lymphoma
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic immunochemotherapy targets the transformed, antigen-independent
      lymphoma clone, which no longer responds to removal of the initiating
      antigen.
    evidence:
    - reference: PMID:33618613
      reference_title: "A 10-year cohort study of 175 primary gastrointestinal lymphoma cases in Thailand: clinical features and outcomes in the immunochemotherapy era."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The probability of having a better OS was demonstrated in patients with a good performance status who received a rituximab-containing regimen."
      explanation: Associates rituximab-containing therapy with improved survival in primary gastrointestinal lymphoma, the population dominated by transformed aggressive disease.
  evidence:
  - reference: PMID:33618613
    reference_title: "A 10-year cohort study of 175 primary gastrointestinal lymphoma cases in Thailand: clinical features and outcomes in the immunochemotherapy era."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse large B-cell lymphoma (DLBCL) had the highest proportion of PGIL, accounting for 61.1%."
    explanation: Establishes that the majority of primary gastrointestinal lymphoma is DLBCL, the histology for which rituximab-containing immunochemotherapy is standard.
- name: Surgical Resection
  description: >-
    Surgery is no longer primary therapy for most gastrointestinal lymphoma but
    remains necessary for obstruction, perforation and uncontrolled bleeding,
    and is still commonly used in small-bowel disease. Its role has declined
    steadily as systemic therapy has improved.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Mucosal and Transmural Lymphomatous Infiltration
    treatment_effect: INHIBITS
    description: >-
      Resection removes the infiltrated gut segment responsible for obstruction,
      perforation and bleeding.
    evidence:
    - reference: PMID:33178655
      reference_title: "Changes in Incidence and Survival by Decade of Patients With Primary Colorectal Lymphoma: A SEER Analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the proportion of patients who received surgical therapy decreased gradually from 83.3-100 to 47.7-52.6% throughout the studied time period."
      explanation: >-
        Marked PARTIAL: documents that resection of the involved bowel segment
        remains in substantial use while its share has fallen, but does not
        itself measure the effect of resection on the infiltration node.
  evidence:
  - reference: PMID:33178655
    reference_title: "Changes in Incidence and Survival by Decade of Patients With Primary Colorectal Lymphoma: A SEER Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5-year CSS of PCL increased continuously, while the rate of surgical resection decreased steadily."
    explanation: Documents the declining role of surgery alongside improving survival with systemic therapy.
- name: Gluten-Free Diet
  description: >-
    Strict lifelong gluten exclusion is the treatment of coeliac disease and
    removes the antigenic drive underlying enteropathy-associated T-cell
    lymphoma. It is included here as the small-bowel counterpart of H. pylori
    eradication — antigen removal acting on the same trigger node — and not as
    a treatment for established lymphoma, for which it is not sufficient.
  context: Small Intestine subtype; coeliac-associated disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Chronic Mucosal Antigenic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Removing dietary gluten withdraws the antigenic stimulus sustaining the
      coeliac enteropathy on which EATL arises.
    evidence:
    - reference: PMID:37627888
      reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "EATL is closely associated with coeliac disease (CD) and is seen mostly in patients originating from Northern Europe."
      explanation: >-
        Marked PARTIAL: the review establishes the coeliac-disease dependence
        that makes gluten withdrawal the corresponding antigen-removal
        intervention, but does not report a trial of gluten exclusion as
        lymphoma prophylaxis or therapy. Evidence source is OTHER because this
        is a review article.
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CD is an autoimmune disease of the small intestine caused by exposure to gluten in a genetically susceptible individual"
    explanation: >-
      Establishes gluten exposure as the cause of the coeliac enteropathy that
      this intervention removes, which is the rationale for curating gluten
      exclusion as the small-bowel antigen-removal counterpart of H. pylori
      eradication. Full-text statement, not abstract. Evidence source is OTHER
      because this is a review article.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "many cases of EATL arise despite a strict GFD"
    explanation: >-
      Recorded as PARTIAL, and deliberately paired with the item above so the
      treatment is not left looking curative: unlike H. pylori eradication,
      gluten withdrawal does not abolish the lymphoma risk. This is the honest
      bound on the antigen-removal analogy and is why the treatment description
      states it is not sufficient for established lymphoma. Full-text statement,
      not abstract. Evidence source is OTHER because this is a review article.
discussions:
- discussion_id: gi_lymphoma_disease_vs_grouping
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should gastrointestinal lymphoma be modelled as a Disease entry with
    anatomic-site has_subtypes, or as a Grouping over the already-curated
    histology entries (MALT_Lymphoma, Diffuse_Large_B_Cell_Lymphoma,
    Mantle_Cell_Lymphoma, Peripheral_T_Cell_Lymphoma)?
  rationale: >-
    A dismech Grouping is an explicit union that points DOWN at its members and
    asserts that each listed member IS a member of the grouping. That assertion
    fails for the histology entries: MALT lymphoma also arises in lung, ocular
    adnexa, salivary gland and thyroid, and DLBCL, mantle cell and peripheral
    T-cell lymphoma are overwhelmingly nodal diseases. Listing them as members
    would assert that MALT_Lymphoma is-a gastrointestinal lymphoma, which is
    false; only their gastrointestinal-site restrictions are members, and those
    are not curated as separate entries. The site children that ARE genuine
    members (gastric, small intestine, colon, oesophagus, rectum lymphoma) do
    not exist as Disease entries either, so a Grouping over them would have no
    members to point at.

    The entry also carries a real, shared, non-trivial mechanism of its own —
    site-restricted antigen-driven chronic stimulation, evidenced by the
    gastric-versus-non-gastric contrast in the H. pylori risk data — which is a
    Disease-entry pathograph, not a membership union. A Grouping has no
    pathophysiology slot and could not hold it.
  resolution_note: >-
    Resolved as a Disease entry with anatomic-site has_subtypes, matching the
    priority dashboard's CURATE_ROOT_WITH_SUBTYPES recommendation and the
    Primary_Tonsillar_Lymphoma precedent for a site-defined lymphoma Disease
    entry. Revisit if the individual site lymphomas are ever curated as
    standalone Disease entries, at which point a Grouping over those five would
    become well-formed and this entry could be reduced to their shared
    mechanism.
  posed_by: claude-code
  posed_date: "2026-08-18T00:00:00Z"
  resolved_date: "2026-08-18T00:00:00Z"
- discussion_id: gi_lymphoma_ipsid_campylobacter_causality
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#Chronic Mucosal Antigenic Stimulation"
  prompt: >-
    Is Campylobacter jejuni a causal driver of immunoproliferative small
    intestinal disease, or an associated coloniser of an already-abnormal small
    bowel?
  rationale: >-
    The association is established and IPSID can regress on antibiotics, which
    parallels the H. pylori/gastric MALT paradigm and would make it a second
    antigen-driven, antibiotic-reversible gastrointestinal lymphoma. But the
    cited review states explicitly that the organism's pathogenetic role is
    contested, and IPSID occurs in settings of heavy polymicrobial exposure
    where response to broad-spectrum antibiotics does not identify a single
    organism. The distinction matters for this entry because it determines
    whether the exposure link is TRIGGERS or PREDISPOSES; it is currently
    curated as PREDISPOSES with PARTIAL evidence.
  proposed_experiments:
  - experiment_id: gi_lymphoma_ipsid_targeted_antibiotic_cohort
    name: Organism-directed versus broad-spectrum antibiotic therapy in IPSID
    description: >-
      A prospective cohort in an IPSID-endemic region testing whether
      Campylobacter jejuni-directed therapy outperforms broad-spectrum
      antibiotics for histological remission, with molecular detection of the
      organism in small-bowel biopsies before and after treatment.
  evidence:
  - reference: PMID:29372346
    reference_title: "Heavy Chain Disease of the Small Bowel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A link between Campylobacter jejuni infection and IPSID has been established, but there is controversy as to the role played by this organism in disease pathogenesis."
    explanation: The review states the controversy that this discussion records. Evidence source is OTHER because this is a review article.
  posed_by: claude-code
  posed_date: "2026-08-18T00:00:00Z"

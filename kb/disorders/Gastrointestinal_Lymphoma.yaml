genetic:
- name: JAK1
  gene_term:
    preferred_term: JAK1
    term:
      id: hgnc:6190
      label: JAK1
  association: Somatic driver of the JAK/STAT axis in EATL and refractory coeliac disease type II
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Gain-of-function mutation of JAK1, one of the two commonest lesions of the
    JAK/STAT axis in the gastrointestinal T-cell arm. The functional consequence
    reported is hyper-responsiveness of the aberrant intraepithelial lymphocyte
    to IL-15, which is the mechanism by which the mutant clone outgrows its
    normal polyclonal neighbours. Curated from the full-text body of
    PMID:37627888 rather than its abstract, which mentions JAK/STAT mutation
    only in general terms. The cited source is a narrative review, not a primary
    sequencing cohort, so no mutation frequency is asserted here.
  evidence:
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The acquisition of these mutations by IELs allows them to progressively expand at the expense of other IELs, as JAK1 or STAT3 gain-of-function mutations garner the cells with hyper-responsiveness to IL-15"
    explanation: >-
      Names JAK1 gain-of-function mutation and gives its functional consequence,
      IL-15 hyper-responsiveness driving clonal outgrowth. The statement sits in
      the body of this full-text-cached review, not in its abstract. Evidence
      source is OTHER because this is a review article.
  - reference: PMID:37627888
    reference_title: "Update on the Pathogenesis of Enteropathy-Associated T-Cell Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The JAK/STAT pathway is considered to be among the most commonly mutated signaling pathways in EATL pathogenesis"
    explanation: >-
      Places the pathway among the most commonly mutated in this disease,
      supporting its curation as a driver rather than an incidental finding.
      Full-text statement, not abstract. Evidence source is OTHER because this
      is a review article.

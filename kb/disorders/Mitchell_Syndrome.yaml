            snippet: "ACOX1 | HGNC:119 | Mitchell syndrome | MONDO:0030073 | AD | Definitive"
            explanation: ClinGen Peroxisomal Disorders GCEP classifies ACOX1 - Mitchell syndrome (AD) as Definitive.
    variants:

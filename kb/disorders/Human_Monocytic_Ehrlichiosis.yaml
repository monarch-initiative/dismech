name: Human Monocytic Ehrlichiosis
creation_date: "2026-09-25T10:29:22Z"
category: Infectious Disease
parents:
- Tick-borne disease
- Ehrlichiosis
synonyms:
- HME
- Human ehrlichiosis due to Ehrlichia chaffeensis
- Human ehrlichial infection, human monocytic type
description: >-
  Human monocytic ehrlichiosis is an acute Lone Star tick-borne bacterial
  infection caused by the obligate intracellular bacterium Ehrlichia
  chaffeensis. The organism infects monocytes and macrophages, proliferates in
  cytoplasmic membrane-bound morulae, uses type IV secretion effectors to
  preserve its intracellular niche and acquire iron, and produces a febrile
  illness with thrombocytopenia, leukopenia, and elevated hepatic
  transaminases.
disease_term:
  preferred_term: human monocytic ehrlichiosis
  term:
    id: MONDO:0000225
    label: human monocytic ehrlichiosis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:39093857
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human monocytotropic ehrlichiosis (HME) is a tick-borne bacterial
        infection caused by Ehrlichia chaffeensis.
      explanation: >-
        The systematic review defines HME as a tick-borne E. chaffeensis
        infection, supporting placement under Harrison's infectious-diseases
        part.
pathophysiology:
- name: Amblyomma-Borne Ehrlichia Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infected Amblyomma americanum ticks inoculate E. chaffeensis and initiate
    the mononuclear-phagocyte infection that defines HME.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Mononuclear Phagocyte Ehrlichia Entry
    causal_link_type: DIRECT
    description: >-
      Tick inoculation exposes monocytes and macrophages to E. chaffeensis
      organisms capable of intracellular replication.
  evidence:
  - reference: PMID:12525424
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ehrlichia chaffeensis is an obligately intracellular, tick-transmitted
      bacterium that is maintained in nature in a cycle involving at least one
      and perhaps several vertebrate reservoir hosts.
    explanation: >-
      Review evidence establishes E. chaffeensis as the tick-transmitted
      obligate intracellular organism initiating HME. Evidence source is OTHER
      because this is a review.
  - reference: PMID:12525424
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This animal serves as a keystone host for all life stages of the principal
      tick vector (Amblyomma americanum) and is perhaps the most important
      vertebrate reservoir host for E. chaffeensis.
    explanation: >-
      Identifies Amblyomma americanum, the Lone Star tick, as the principal
      tick vector of E. chaffeensis.

- name: Mononuclear Phagocyte Ehrlichia Entry
  biological_scale: CELLULAR
  description: >-
    E. chaffeensis predominantly infects monocytes and tissue macrophages, then
    multiplies in cytoplasmic membrane-bound vacuoles that contain clusters of
    bacteria called morulae.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Ehrlichia Vacuolar Niche
    causal_link_type: DIRECT
    description: >-
      Entry into the mononuclear-phagocyte lineage creates a host cell
      compartment in which the organism can preserve an early-endosome-like
      vacuole.
  evidence:
  - reference: PMID:27172113
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      E. chaffeensis, the pathogen that causes human monocytic ehrlichiosis,
      predominantly infects monocytes and tissue macrophages
    explanation: >-
      CDC national recommendations identify monocytes and macrophages as the
      predominant E. chaffeensis host cells. Evidence source is OTHER because
      this is a national recommendations report.

- name: Ehrlichia Vacuolar Niche
  biological_scale: CELLULAR
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  description: >-
    E. chaffeensis replicates in membrane-bound vacuoles that resemble early
    endosomes, sequestering the organism inside host phagocytes where it can
    deploy type IV secretion effectors.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Etf-2 RAB5 Vacuole Maturation Arrest
    causal_link_type: DIRECT
    description: >-
      Vacuolar E. chaffeensis delivers Etf-2 to RAB5-GTP on the
      organism-containing vacuole.
  - target: Etf-3 Ferritinophagy Iron Acquisition
    causal_link_type: DIRECT
    description: >-
      Vacuolar infection delivers Etf-3, which redirects host ferritin to
      ferritinophagy.
  - target: Ehrlichia Ribosomal Translation (Doxycycline Target)
    description: >-
      Intracellular E. chaffeensis remains dependent on bacterial ribosomal
      translation.
  evidence:
  - reference: PMID:27172113
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The organisms multiply in cytoplasmic membrane-bound vacuoles, forming
      tightly packed clusters of bacteria called morulae.
    explanation: >-
      CDC national recommendations describe E. chaffeensis multiplication in
      membrane-bound cytoplasmic morulae. Evidence source is OTHER because this
      is a national recommendations report.
  - reference: PMID:40797321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      E. chaffeensis replicates in membrane-bound vacuoles resembling early
      endosomes in human monocytes/macrophages.
    explanation: >-
      Establishes the early-endosome-like vacuole as the replicative
      compartment within human monocytes and macrophages.

- name: Etf-2 RAB5 Vacuole Maturation Arrest
  biological_scale: CELLULAR
  description: >-
    The type IV secretion effector Etf-2 binds RAB5-GTP on
    E. chaffeensis-containing vacuoles and delays their maturation into late
    endosomes, preserving the replicative niche.
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    modifier: INCREASED
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Mononuclear Ehrlichia Persistence
    causal_link_type: DIRECT
    description: >-
      Blocking RAB5-dependent vacuole maturation helps intracellular
      E. chaffeensis avoid progression toward a degradative compartment.
  evidence:
  - reference: PMID:40797321
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The type IV secretion system effector Ehrlichia translocated factor-2
      (Etf-2) directly binds to RAB5-GTP on E. chaffeensis-containing vacuoles.
      Consequently, Etf-2 hinders the engagement of RAB5 GTPase-activating
      protein with RAB5-GTP, delays maturation of Ehrlichia vacuoles to late
      endosomes, thus facilitates infection.
    explanation: >-
      Mechanistically links the Etf-2 effector to RAB5-GTP binding and delayed
      maturation of E. chaffeensis vacuoles.

- name: Etf-3 Ferritinophagy Iron Acquisition
  biological_scale: CELLULAR
  description: >-
    The Etf-3 type IV secretion effector binds host ferritin light chain and
    induces ferritinophagy, increasing the labile iron pool available for
    intracellular ehrlichial proliferation.
  biological_processes:
  - preferred_term: ferritinophagy
    modifier: INCREASED
    term:
      id: GO:7770069
      label: ferritinophagy
  downstream:
  - target: Mononuclear Ehrlichia Persistence
    causal_link_type: DIRECT
    description: >-
      Ferritinophagy-derived labile iron supports intracellular Ehrlichia
      proliferation.
  evidence:
  - reference: PMID:39705831
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ehrlichia translocated factor-3 (Etf-3) is a type IV secretion system
      effector that binds host-cell ferritin light chain and induces
      ferritinophagy, thus increasing cellular labile iron pool for Ehrlichia
      proliferation.
    explanation: >-
      Establishes the Etf-3 ferritinophagy effector pathway that expands
      cytosolic labile iron for ehrlichial growth.

- name: Mononuclear Ehrlichia Persistence
  biological_scale: CELLULAR
  description: >-
    Effector-mediated preservation of the early-endosome-like vacuole and
    diversion of ferritin iron allow E. chaffeensis to persist and amplify
    inside infected monocytes and macrophages.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: INCREASED
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: TNF-Neutrophil Immunopathology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persistent monocytotropic infection elicits T-cell and neutrophil
      inflammatory responses that can become injurious in severe disease.
  - target: Acute Febrile Cytopenic HME
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intracellular replication and inflammatory host responses produce the
      characteristic fever, cytopenias, and elevated hepatic transaminases.
  evidence:
  - reference: PMID:39705831
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ehrlichia chaffeensis is an obligatory intracellular bacterium that
      infects monocytes and macrophages and causes human monocytic
      ehrlichiosis.
    explanation: >-
      Connects E. chaffeensis intracellular infection of monocytes/macrophages
      to the human disease.

- name: TNF-Neutrophil Immunopathology
  biological_scale: CELLULAR
  description: >-
    In fatal monocytotropic ehrlichiosis models, excessive TNF-alpha-producing
    CD8 T-cell responses and neutrophils amplify immune-mediated liver injury
    and toxic-shock-like disease.
  biological_processes:
  - preferred_term: tumor necrosis factor production
    modifier: INCREASED
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  downstream:
  - target: Acute Febrile Cytopenic HME
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated TNF-rich and neutrophil-amplified inflammation contributes to
      the severe systemic inflammatory arm of HME.
  evidence:
  - reference: PMID:14734762
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, uncontrolled TNF-alpha production by CD8(+) T cells
      together with a weak CD4(+) Th1 cell response are associated with
      immunopathology and failure to clear IOE in the fatal model of HME.
    explanation: >-
      Mouse-model evidence links fatal monocytotropic ehrlichiosis to
      dysregulated TNF-alpha-producing CD8 T-cell inflammation.
  - reference: PMID:23478316
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      depletion of neutrophils from lethally infected mice enhanced bacterial
      elimination, decreased immune-mediated pathology, and prolonged survival.
    explanation: >-
      Mouse-model evidence identifies neutrophils as amplifiers of
      immune-mediated pathology during fatal Ehrlichia infection.

- name: Acute Febrile Cytopenic HME
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The organism-level syndrome presents as an undifferentiated fever with
    thrombocytopenia, leukopenia, and elevated hepatic transaminases; severe
    cases may progress to ARDS, acute renal failure, multi-organ failure, or
    secondary hemophagocytic lymphohistiocytosis.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Leukopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Acute Respiratory Distress Syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hemophagocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HME primarily presents as an unspecific febrile illness (95% of the
      cases), often accompanied by thrombocytopenia (79.1% of the cases),
      leukopenia (57.8% of the cases), and abnormal liver function tests (68.1%
      of the cases).
    explanation: >-
      Pooled human systematic-review data identify the febrile, cytopenic, and
      hepatic-laboratory syndrome that characterizes HME.

- name: Ehrlichia Ribosomal Translation (Doxycycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
    Ribosome
  description: >-
    E. chaffeensis depends on bacterial 70S-ribosome translation; doxycycline
    exploits this vulnerability by binding the 30S ribosomal subunit and
    arresting bacterial protein synthesis.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence for the bacterial ribosome as an antibiotic target,
      supporting this conserved therapeutic-vulnerability node.

- name: Cell-Penetrant Antimicrobial Requirement
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    intracellular_pathogen_persistence#Requirement for Cell-Penetrant
    Antimicrobials
  description: >-
    Because E. chaffeensis replicates inside monocytes and macrophages, HME
    treatment must use agents that achieve intracellular concentrations rather
    than poorly cell-penetrant antibiotics.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Review evidence establishing intracellular drug accumulation as the
      pharmacologic requirement this HME node conforms to.
phenotypes:
- name: Fever
  description: >-
    Fever is the dominant presentation of HME, reported in 95% of reviewed
    cases.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HME primarily presents as an unspecific febrile illness (95% of the
      cases), often accompanied by thrombocytopenia (79.1% of the cases),
      leukopenia (57.8% of the cases), and abnormal liver function tests (68.1%
      of the cases).
    explanation: >-
      The systematic review found fever in 95% of HME cases, supporting a
      very-frequent fever phenotype.

- name: Thrombocytopenia
  description: >-
    Thrombocytopenia is frequent in HME and was reported in 79.1% of reviewed
    cases.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HME primarily presents as an unspecific febrile illness (95% of the
      cases), often accompanied by thrombocytopenia (79.1% of the cases),
      leukopenia (57.8% of the cases), and abnormal liver function tests (68.1%
      of the cases).
    explanation: >-
      The systematic review found thrombocytopenia in 79.1% of HME cases,
      just below the 80% very-frequent threshold.

- name: Leukopenia
  description: >-
    Leukopenia is frequent in HME and was reported in 57.8% of reviewed cases.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Leukopenia
    term:
      id: HP:0001882
      label: Decreased total leukocyte count
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HME primarily presents as an unspecific febrile illness (95% of the
      cases), often accompanied by thrombocytopenia (79.1% of the cases),
      leukopenia (57.8% of the cases), and abnormal liver function tests (68.1%
      of the cases).
    explanation: >-
      The systematic review found leukopenia in 57.8% of HME cases, within the
      30-79% frequent band.

- name: Elevated Hepatic Transaminases
  description: >-
    Abnormal liver function tests are frequent in HME; the HPO binding captures
    the common elevated-transaminase manifestation of this laboratory
    abnormality.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Elevated hepatic transaminases
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HME primarily presents as an unspecific febrile illness (95% of the
      cases), often accompanied by thrombocytopenia (79.1% of the cases),
      leukopenia (57.8% of the cases), and abnormal liver function tests (68.1%
      of the cases).
    explanation: >-
      The systematic review found abnormal liver function tests in 68.1% of HME
      cases; elevated circulating hepatic transaminases are the HPO-bound
      laboratory abnormality represented by that clinical phrasing.

- name: Acute Respiratory Distress Syndrome
  description: >-
    ARDS is an occasional severe complication of HME, with higher reported
    incidence in immunocompromised than immunocompetent patients.
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of complications is higher in immunocompromized compared to
      immunocompetent cases, with ARDS (34% vs 19.8%), acute renal failure (34%
      vs 15.8%), multi organ failure (26% vs 14.9%), and secondary
      hemophagocytic lymphohistiocytosis (26% vs 14.9%) being the most frequent
      reported.
    explanation: >-
      The systematic review identified ARDS as a recurrent HME complication,
      with a higher proportion among immunocompromised reviewed cases.

- name: Hemophagocytosis
  description: >-
    HME can trigger secondary hemophagocytic lymphohistiocytosis, particularly
    among severe reported cases.
  phenotype_term:
    preferred_term: Hemophagocytosis
    term:
      id: HP:0012156
      label: Hemophagocytosis
  evidence:
  - reference: PMID:39093857
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of complications is higher in immunocompromized compared to
      immunocompetent cases, with ARDS (34% vs 19.8%), acute renal failure (34%
      vs 15.8%), multi organ failure (26% vs 14.9%), and secondary
      hemophagocytic lymphohistiocytosis (26% vs 14.9%) being the most frequent
      reported.
    explanation: >-
      The systematic review identified secondary HLH as a recurrent severe HME
      complication; hemophagocytosis is the HPO histologic process represented
      by that syndrome.

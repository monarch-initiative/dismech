diagnosis:
- name: Ehrlichiosis Laboratory Confirmation
  description: >-
    Suspected HME should be treated empirically while etiologic confirmation is
    pursued by methods such as blood PCR, smear examination, culture, or
    serologic testing.
  evidence:
  - reference: PMID:17582569
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once an ehrlichiosis is suspected on historical and clinical grounds,
      doxycycline treatment should be initiated concurrently with attempts at
      etiologic confirmation using laboratory methods such as blood smear
      examination, polymerase chain reaction, culture, and serologic tests.
    explanation: >-
      Review evidence supports pursuing PCR, smear, culture, or serology for
      laboratory confirmation while empirically treating suspected HME.
treatments:
- name: Doxycycline
  description: >-
    First-line tetracycline pharmacotherapy for suspected or confirmed HME.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Ehrlichia Ribosomal Translation (Doxycycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits the Ehrlichia 30S ribosomal subunit, shutting down
      bacterial protein synthesis.
  - target: Cell-Penetrant Antimicrobial Requirement
    treatment_effect: BYPASSES
    description: >-
      Doxycycline satisfies the cell-penetrant-drug requirement for an organism
      that replicates inside monocytes and macrophages.
    evidence:
    - reference: PMID:27172113
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Doxycycline is the drug of choice for treatment of all tickborne
        rickettsial diseases in patients of all ages, including children aged <8
        years
      explanation: >-
        National recommendations for tickborne rickettsial diseases,
        ehrlichioses, and anaplasmosis establish doxycycline as first-line
        cell-penetrant therapy. Evidence source is OTHER as this is a national
        recommendations report.
  evidence:
  - reference: PMID:27172113

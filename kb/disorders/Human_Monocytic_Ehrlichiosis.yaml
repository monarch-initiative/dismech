    snippet: "Human monocytic ehrlichiosis and anaplasmosis are life threatening diseases with estimated case fatality rates of 2.7 and 0.3%, respectively."
    explanation: The working-group report estimates the HME case-fatality rate at 2.7%.
treatments:
- name: Doxycycline
  description: >-
    First-line tetracycline pharmacotherapy for suspected or confirmed HME.
  therapeutic_modality: SMALL_MOLECULE

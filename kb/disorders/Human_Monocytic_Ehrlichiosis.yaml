- name: Ehrlichia chaffeensis
  description: >-
    Obligate intracellular Anaplasmataceae bacterium with tropism for human
    monocytes and macrophages.
  infectious_agent_term:
    preferred_term: Ehrlichia chaffeensis
    term:
      id: NCBITaxon:945
      label: Ehrlichia chaffeensis
  evidence:
  - reference: PMID:39093857
    reference_title: "Human monocytotropic ehrlichiosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human monocytotropic ehrlichiosis (HME) is a tick-borne bacterial
      infection caused by Ehrlichia chaffeensis.
    explanation: >-
      Establishes E. chaffeensis as the bacterial agent of human HME.
transmission:
- name: Amblyomma Tick Bite Transmission
  description: >-
    HME is transmitted by the bite of infected Lone Star ticks, Amblyomma
    americanum.
  evidence:
  - reference: PMID:12525424
    reference_title: "Ehrlichia chaffeensis: a prototypical emerging pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This animal serves as a keystone host for all life stages of the principal
      tick vector (Amblyomma americanum) and is perhaps the most important
      vertebrate reservoir host for E. chaffeensis.
    explanation: >-
      Review evidence identifies Amblyomma americanum as the principal vector of
      E. chaffeensis. Evidence source is OTHER because this is a review.
- name: Transfusion and Transplant Transmission
  description: >-
    E. chaffeensis can also be transmitted through blood transfusion or organ
    transplantation, including donor-derived infection.
  evidence:
  - reference: PMID:34670661
    reference_title: Ehrlichiosis and Anaplasmosis among Transfusion and Transplant Recipients in the United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 132 cases during 1997-2020, 12 transfusion-associated cases and 120 cases in transplant recipients; 8 cases were donor-derived"
    explanation: The US review documents transfusion- and transplant-associated ehrlichiosis/anaplasmosis, including donor-derived cases.
diagnosis:
- name: Ehrlichiosis Laboratory Confirmation
  description: >-
    Suspected HME should be treated empirically while etiologic confirmation is
    pursued by methods such as blood PCR, smear examination, culture, or
    serologic testing.
  evidence:
  - reference: PMID:17582569
    reference_title: "Ehrlichioses in humans: epidemiology, clinical presentation, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once an ehrlichiosis is suspected on historical and clinical grounds,
      doxycycline treatment should be initiated concurrently with attempts at
      etiologic confirmation using laboratory methods such as blood smear
      examination, polymerase chain reaction, culture, and serologic tests.
    explanation: >-
      Review synthesis supporting PCR, smear, culture, or serology for
      laboratory confirmation while empirically treating suspected HME.

animal_models:
- name: IOE (Ehrlichia sp. HF) fatal murine ehrlichiosis
  species: Mouse
  publication: PMID:33407096
  description: >-
    Ehrlichia sp. HF (the Ixodes ovatus Ehrlichia, IOE) causes acute fatal
    infection in laboratory mice that resembles fatal human monocytic
    ehrlichiosis, providing the model for the TNF/neutrophil immunopathology arm.
  modeled_mechanisms:
  - target: TNF-Neutrophil Immunopathology
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The IOE mouse reproduces the dysregulated TNF-alpha CD8 T-cell and
      neutrophil-amplified immunopathology of fatal human ehrlichiosis.
    limitations: >-
      The infecting organism is Ehrlichia sp. HF (IOE), not E. chaffeensis, so
      the immunopathology is a surrogate-species model of human HME.
    evidence:
    - reference: PMID:33407096
      reference_title: "Comparative Analysis of Genome of Ehrlichia sp. HF, a Model Bacterium to Study Fatal Human Ehrlichiosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "causes acute fatal infection in laboratory mice that resembles acute fatal human monocytic ehrlichiosis caused by Ehrlichia chaffeensis"
      explanation: Establishes the IOE mouse as a model of fatal human monocytic ehrlichiosis.
    - reference: PMID:14734762
      reference_title: "Overproduction of TNF-alpha by CD8+ type 1 cells and down-regulation of IFN-gamma production by CD4+ Th1 cells contribute to toxic shock-like syndrome in an animal model of fatal monocytotropic ehrlichiosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, uncontrolled TNF-alpha production by CD8(+) T cells
        together with a weak CD4(+) Th1 cell response are associated with
        immunopathology and failure to clear IOE in the fatal model of HME.
      explanation: The IOE model links dysregulated CD8 TNF-alpha responses to fatal-ehrlichiosis immunopathology.

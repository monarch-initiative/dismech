    reference_title: "Development of mRNA-lipid nanoparticle intrabodies against rickettsial infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      E. chaffeensis replicates in membrane-bound vacuoles resembling early
      endosomes in human monocytes/macrophages.
    explanation: >-
      Establishes the early-endosome-like vacuole as the replicative
      compartment within human monocytes and macrophages.

- name: Etf-2 RAB5 Vacuole Maturation Arrest
  biological_scale: CELLULAR
  description: >-
    The type IV secretion effector Etf-2 binds RAB5-GTP on
    E. chaffeensis-containing vacuoles and delays their maturation into late
    endosomes, preserving the replicative niche.
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host phagosome maturation
    modifier: INCREASED
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  downstream:
  - target: Mononuclear Ehrlichia Persistence
    causal_link_type: DIRECT
    description: >-
      Blocking RAB5-dependent vacuole maturation helps intracellular
      E. chaffeensis avoid progression toward a degradative compartment.
  evidence:
  - reference: PMID:40797321
    reference_title: "Development of mRNA-lipid nanoparticle intrabodies against rickettsial infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The type IV secretion system effector Ehrlichia translocated factor-2
      (Etf-2) directly binds to RAB5-GTP on E. chaffeensis-containing vacuoles.
      Consequently, Etf-2 hinders the engagement of RAB5 GTPase-activating
      protein with RAB5-GTP, delays maturation of Ehrlichia vacuoles to late
      endosomes, thus facilitates infection.
    explanation: >-
      Mechanistically links the Etf-2 effector to RAB5-GTP binding and delayed
      maturation of E. chaffeensis vacuoles.

- name: Etf-3 Ferritinophagy Iron Acquisition
  biological_scale: CELLULAR
  description: >-
    The Etf-3 type IV secretion effector binds host ferritin light chain and
    induces ferritinophagy, increasing the labile iron pool available for
    intracellular ehrlichial proliferation.
  biological_processes:
  - preferred_term: ferritinophagy
    modifier: INCREASED
    term:
      id: GO:7770069
      label: ferritinophagy
  downstream:
  - target: Mononuclear Ehrlichia Persistence
    causal_link_type: DIRECT
    description: >-
      Ferritinophagy-derived labile iron supports intracellular Ehrlichia
      proliferation.
  evidence:
  - reference: PMID:39705831
    reference_title: "Development of Etf-3-specific nanobodies to prevent Ehrlichia infection and LNP-mRNA delivery in cellular and murine models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ehrlichia translocated factor-3 (Etf-3) is a type IV secretion system
      effector that binds host-cell ferritin light chain and induces
      ferritinophagy, thus increasing cellular labile iron pool for Ehrlichia
      proliferation.
    explanation: >-
      Establishes the Etf-3 ferritinophagy effector pathway that expands
      cytosolic labile iron for ehrlichial growth.

- name: Mononuclear Ehrlichia Persistence
  biological_scale: CELLULAR
  description: >-
    Effector-mediated preservation of the early-endosome-like vacuole and
    diversion of ferritin iron allow E. chaffeensis to persist and amplify
    inside infected monocytes and macrophages.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: INCREASED
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: TNF-Neutrophil Immunopathology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persistent monocytotropic infection elicits T-cell and neutrophil
      inflammatory responses that can become injurious in severe disease.
  - target: Acute Febrile Cytopenic HME
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intracellular replication and inflammatory host responses produce the
      characteristic fever, cytopenias, and elevated hepatic transaminases.
  evidence:
  - reference: PMID:39705831
    reference_title: "Development of Etf-3-specific nanobodies to prevent Ehrlichia infection and LNP-mRNA delivery in cellular and murine models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ehrlichia chaffeensis is an obligatory intracellular bacterium that
      infects monocytes and macrophages and causes human monocytic
      ehrlichiosis.
    explanation: >-
      Connects E. chaffeensis intracellular infection of monocytes/macrophages
      to the human disease.

- name: TNF-Neutrophil Immunopathology
  biological_scale: CELLULAR
  description: >-
    In fatal monocytotropic ehrlichiosis models, excessive TNF-alpha-producing
    CD8 T-cell responses and neutrophils amplify immune-mediated liver injury
    and toxic-shock-like disease.
  biological_processes:
  - preferred_term: tumor necrosis factor production
    modifier: INCREASED
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  downstream:
  - target: Acute Febrile Cytopenic HME
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated TNF-rich and neutrophil-amplified inflammation contributes to
      the severe systemic inflammatory arm of HME.
  evidence:
  - reference: PMID:14734762
    reference_title: "Overproduction of TNF-alpha by CD8+ type 1 cells and down-regulation of IFN-gamma production by CD4+ Th1 cells contribute to toxic shock-like syndrome in an animal model of fatal monocytotropic ehrlichiosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, uncontrolled TNF-alpha production by CD8(+) T cells
      together with a weak CD4(+) Th1 cell response are associated with
      immunopathology and failure to clear IOE in the fatal model of HME.
    explanation: >-
      Mouse-model evidence links fatal monocytotropic ehrlichiosis to
      dysregulated TNF-alpha-producing CD8 T-cell inflammation.
  - reference: PMID:23478316
    reference_title: "Neutrophils mediate immunopathology and negatively regulate protective immune responses during fatal bacterial infection-induced toxic shock."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      depletion of neutrophils from lethally infected mice enhanced bacterial
      elimination, decreased immune-mediated pathology, and prolonged survival.
    explanation: >-
      Mouse-model evidence identifies neutrophils as amplifiers of
      immune-mediated pathology during fatal Ehrlichia infection.

- name: Acute Febrile Cytopenic HME
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The organism-level syndrome presents as an undifferentiated fever with
    thrombocytopenia, leukopenia, and elevated hepatic transaminases; severe
    cases may progress to ARDS, acute renal failure, multi-organ failure, or
    secondary hemophagocytic lymphohistiocytosis.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Leukopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia

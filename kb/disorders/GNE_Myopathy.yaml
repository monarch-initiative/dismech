name: GNE Myopathy
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Distal Myopathy
- Congenital Disorder of Glycosylation
disease_term:
  preferred_term: GNE Myopathy
  term:
    id: MONDO:0011603
    label: GNE myopathy
synonyms:
- Nonaka myopathy
- distal myopathy with rimmed vacuoles
- DMRV
- hereditary inclusion body myopathy type 2
- IBM2
- quadriceps-sparing myopathy
- inclusion body myopathy, autosomal recessive
description: >-
  GNE myopathy is an ultra-rare, adult-onset, autosomal recessive skeletal muscle
  disease caused by biallelic hypomorphic variants in GNE, the gene encoding the
  bifunctional enzyme that runs the first two committed steps of sialic acid
  biosynthesis. Think of it as a factory whose front-end sugar line is throttled:
  the cell can still make some sialic acid, but not enough, and the tissue least
  forgiving of the shortfall turns out to be skeletal muscle. Patients present in
  their twenties or thirties with bilateral foot drop from anterior tibialis
  weakness, then decline distally to proximally over decades, with the striking
  and diagnostically load-bearing quirk that the quadriceps is spared until very
  late. That sparing now has a biochemical explanation: normal quadriceps
  ordinarily runs on markedly less free sialic acid than gastrocnemius, so it has
  less to lose. Muscle histology shows rimmed vacuoles, which are accumulated
  autophagic material rather than vacuoles in the naive sense, plus deposits
  immunoreactive to beta-amyloid, ubiquitin, and tau, and, crucially, no
  inflammation. That last negative is what separates this from sporadic inclusion
  body myositis, a naming collision that has cost the field real confusion. Oral
  sialic acid replacement failed a Class I phase 3 trial in the West and was
  approved in Japan in 2024 on a narrower and more equivocal evidence base; the
  entry records both.
has_subtypes:
- name: Epimerase-domain
  display_name: Epimerase-domain variant genotypes
  description: >-
    Genotypes with variants affecting the UDP-N-acetylglucosamine 2-epimerase
    domain. The distinction from kinase-domain genotypes is therapeutically
    consequential rather than cosmetic: N-acetylmannosamine enters the pathway
    downstream of the epimerase step and so bypasses an epimerase block, and it
    also restored sialic acid synthesis in patients homozygous for kinase-domain
    variants. Not a formally recognized clinical classification.
- name: Kinase-domain
  display_name: Kinase-domain variant genotypes
  description: >-
    Genotypes with variants affecting the N-acetylmannosamine kinase domain.
    Recorded separately because the phase 1 N-acetylmannosamine study explicitly
    showed restored intracellular sialic acid biosynthesis in subjects homozygous
    for kinase-domain variants, which was not a foregone conclusion for a
    precursor entering upstream of that step.
  evidence:
  - reference: PMID:28641925
    reference_title: "Safety, pharmacokinetics and sialic acid production after oral administration of N-acetylmannosamine (ManNAc) to subjects with GNE myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that Neu5Ac is known to have a short half-life, the prolonged elevation of Neu5Ac after a single dose of ManNAc suggests that intracellular biosynthesis of sialic acid was restored in subjects with GNE myopathy, including those homozygous for mutations in the kinase domain."
    explanation: >-
      Establishes that the kinase-domain genotype is a separately relevant
      pharmacological category, and that the precursor works in it.
pathophysiology:
- name: Biallelic Hypomorphic GNE Variants and Enzymatic Block
  biological_scale: MOLECULAR
  description: >-
    GNE encodes one polypeptide carrying two enzyme activities, UDP-GlcNAc
    2-epimerase and N-acetylmannosamine kinase, which together run the first
    committed and rate-limiting steps of sialic acid synthesis. Biallelic
    hypomorphic variants, predominantly missense and distributed across both
    catalytic domains, reduce that throughput. The variants must be hypomorphic
    rather than null: Gne knockout is embryonic lethal in mouse, so every
    surviving human genotype retains residual enzyme activity, and that is why
    curating these alleles as complete loss of function overstates the lesion.
  genes:
  - preferred_term: GNE
    term:
      id: hgnc:23657
      label: GNE
  molecular_functions:
  - preferred_term: UDP-N-acetylglucosamine 2-epimerase activity
    term:
      id: GO:0008761
      label: UDP-N-acetylglucosamine 2-epimerase activity
    modifier: DECREASED
  - preferred_term: N-acetylmannosamine kinase activity
    term:
      id: GO:0009384
      label: N-acylmannosamine kinase activity
    modifier: DECREASED
  downstream:
  - target: Free Sialic Acid Depletion
    description: >-
      Reduced throughput of the first committed steps depletes the free sialic
      acid pool in serum and, far more severely, in muscle.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11528398
    reference_title: "The UDP-N-acetylglucosamine 2-epimerase/N-acetylmannosamine kinase gene is mutated in recessive hereditary inclusion body myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that GNE is the gene responsible for recessive HIBM."
    explanation: >-
      The gene-identification study establishing GNE as causative.
  - reference: PMID:39332896
    reference_title: Novel variants and genotype-phenotype correlation in a multicentre cohort of GNE myopathy in China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense variants predominantly located in the epimerase/kinase domain coding region, indicating the impairment of catalytic function as a key pathogenic consequence."
    explanation: >-
      Establishes that the variant spectrum is dominated by missense changes in
      the catalytic domains, so the lesion is impaired catalysis.
  - reference: PMID:17704511
    reference_title: A Gne knockout mouse expressing human GNE D176V mutation develops features similar to distal myopathy with rimmed vacuoles or hereditary inclusion body myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We knocked out the Gne gene in mice but this resulted in embryonic lethality."
    explanation: >-
      Embryonic lethality of the null establishes that surviving human genotypes
      must be hypomorphic rather than complete loss of function.
- name: Free Sialic Acid Depletion
  biological_scale: MOLECULAR
  description: >-
    The best-quantified node in the disease, and the one that also explains its
    most distinctive clinical sign. Serum free sialic acid is 18% below
    age-matched controls, but muscle free sialic acid is down 72 to 85%, so the
    deficit is far more severe in the tissue that gets sick. The quadriceps
    sparing rule falls out of the same measurements: normal quadriceps already
    runs on 39% less free sialic acid than normal gastrocnemius, so it has less
    to lose when supply is throttled.
  biological_processes:
  - preferred_term: N-acetylneuraminate biosynthetic process
    term:
      id: GO:0046380
      label: N-acetylneuraminate biosynthetic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: N-acetylneuraminic acid
    term:
      id: CHEBI:17012
      label: N-acetylneuraminic acid
    modifier: DECREASED
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Hyposialylation of Muscle Glycoproteins
    description: >-
      A depleted free sialic acid pool leaves muscle glycoproteins
      undersialylated.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28267778
    reference_title: Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy and in a mouse model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results show that serum and muscle free SA is severely reduced in GNEM, which is consistent with the biochemical defect in SA synthesis associated with GNE mutations."
    explanation: >-
      Quantitative confirmation that the free sialic acid pool is severely
      depleted in patients, in serum and muscle.
  - reference: PMID:28267778
    reference_title: Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy and in a mouse model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A lower SA requirement for quadriceps may be linked to the reported quadriceps sparing in GNEM."
    explanation: >-
      Offers the biochemical explanation for quadriceps sparing, grounded in
      measured differences in normal muscle rather than in the disease.
  - reference: PMID:17704511
    reference_title: A Gne knockout mouse expressing human GNE D176V mutation develops features similar to distal myopathy with rimmed vacuoles or hereditary inclusion body myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, these mice exhibit marked hyposialylation in serum, muscle and other organs."
    explanation: >-
      The mouse model reproduces the systemic hyposialylation, which is the
      starting point of the tissue-restriction paradox.
- name: Hyposialylation of Muscle Glycoproteins
  biological_scale: MOLECULAR
  description: >-
    Muscle glycoproteins carry less sialic acid than they should. Two things
    should be said carefully here. First, the specific glycoprotein target or
    targets whose undersialylation is actually pathogenic have not been
    definitively identified, and the sialic acid measurements themselves hint
    that the set is small: total sialic acid differences between patients and
    controls were less distinct and more variable than the free pool differences.
    Second, that hyposialylation is causal rather than incidental was established
    by rescue in the mouse, and the authors of that rescue were careful to call it
    one of the key factors rather than the whole story.
  biological_processes:
  - preferred_term: protein sialylation
    term:
      id: GO:1990743
      label: protein sialylation
    modifier: DECREASED
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Autophagic Block and Proteostasis Failure
    description: >-
      Undersialylated muscle is where the downstream proteostasis failure and
      rimmed vacuole formation occur. The steps connecting the sialylation
      deficit to the autophagy block are not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myofiber Atrophy and Degeneration
    description: >-
      Hyposialylation is causally upstream of the atrophy and weakness, as shown
      by complete prevention of both in the mouse when sialic acid metabolites are
      supplied.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19448634
    reference_title: Prophylactic treatment with sialic acid metabolites precludes the development of the myopathic phenotype in the DMRV-hIBM mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By showing that muscle atrophy and weakness are completely prevented in a mouse model of DMRV-hIBM after treatment with sialic acid metabolites orally, we provide evidence that hyposialylation is indeed one of the key factors in the pathomechanism of DMRV-hIBM."
    explanation: >-
      The pivotal causality proof, quoted with the authors' own hedge that
      hyposialylation is one of the key factors rather than the sole cause.
  - reference: PMID:28267778
    reference_title: Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy and in a mouse model.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Differences in mean total SA levels in muscle from patients compared with normal controls were less distinct and more variable between different muscles, suggesting a small subset of sialylation targets could be responsible for the pathogenesis of GNEM."
    explanation: >-
      Suggests the pathogenic target set is narrow. PARTIAL because it is an
      inference the authors themselves frame as a suggestion, and no specific
      target glycoprotein is identified.
  - reference: PMID:41082181
    reference_title: "Decoding GNE Myopathy: From Molecular Basis to Therapeutic Advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deficient GNE enzyme activity results in decreased production of sialic acid and subsequent hyposialylation of muscle glycoproteins, ultimately leading to progressive muscle degeneration and characteristic histopathological changes."
    explanation: >-
      States the canonical chain from enzyme deficiency through hyposialylation to
      degeneration.
- name: Autophagic Block and Proteostasis Failure
  biological_scale: CELLULAR
  description: >-
    Rimmed vacuoles are not vacuoles in the naive sense; they are accumulated
    autophagic material, and recent isogenic-model work supplies an actual
    signaling chain for why the material accumulates. Excessive extracellular
    matrix production drives aberrant activation of a noncanonical AKT-mTORC1
    pathway, which phosphorylates and inhibits ULK1 and so suppresses autophagy
    initiation. Reactivating autophagy by PI3K inhibition restores ULK1 activity
    in patient-derived neuromuscular organoids, which is what makes this a causal
    chain rather than a correlation.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Amyloid and Misfolded Protein Accumulation
    description: >-
      Suppressed autophagic clearance permits accumulation of aggregation-prone
      protein within myofibers.
    causal_link_type: DIRECT
  - target: Rimmed Vacuoles
    description: >-
      The accumulated autophagic material is what is seen histologically as
      rimmed vacuoles.
  evidence:
  - reference: PMID:41963465
    reference_title: Defective autophagy in GNE myopathy is rescued by inhibition of noncanonical Akt-mTORC1 activation across multiple isogenic models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By performing transcriptome analysis on two independent GNE myoblast models derived from human pluripotent stem cells, we identified multiple autophagy-related gene sets as pathogenic signatures of GNE myopathy."
    explanation: >-
      Establishes autophagy dysregulation as a transcriptional signature across
      two independent human stem-cell-derived models.
  - reference: PMID:41963465
    reference_title: Defective autophagy in GNE myopathy is rescued by inhibition of noncanonical Akt-mTORC1 activation across multiple isogenic models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "induces inhibitory phosphorylation of ULK1, thereby suppressing autophagy initiation."
    explanation: >-
      Names the specific inhibitory step, ULK1 phosphorylation, that blocks
      autophagy initiation in this disease.
- name: Amyloid and Misfolded Protein Accumulation
  biological_scale: CELLULAR
  description: >-
    Myofibers accumulate congophilic material immunoreactive to beta-amyloid,
    lysosomal proteins, ubiquitin, and tau. The mouse model established the
    temporal ordering, which is the mechanistically interesting part: beta-amyloid
    deposition appears at 32 weeks and clearly precedes rimmed vacuole formation
    at 42 weeks. Whether the amyloid is mechanistically upstream of the atrophy or
    a downstream marker of failed clearance remains unsettled, and this entry does
    not decide it.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Deposits Immunoreactive to Beta-Amyloid Protein
    description: >-
      The accumulated material is detected histologically as beta-amyloid
      immunoreactive deposits.
  - target: Myofiber Atrophy and Degeneration
    description: >-
      Accumulated misfolded protein accompanies and plausibly contributes to
      myofiber degeneration, though its causal weight is unsettled and no
      intermediate steps are established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17704511
    reference_title: A Gne knockout mouse expressing human GNE D176V mutation develops features similar to distal myopathy with rimmed vacuoles or hereditary inclusion body myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A compelling finding is the development of beta-amyloid deposition in myofibers by 32 weeks, which clearly precedes RV formation at 42 weeks."
    explanation: >-
      Establishes that amyloid deposition precedes rimmed vacuole formation, which
      is the temporal ordering that constrains any causal model.
  - reference: PMID:17704511
    reference_title: A Gne knockout mouse expressing human GNE D176V mutation develops features similar to distal myopathy with rimmed vacuoles or hereditary inclusion body myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is pathologically characterized by the presence of rimmed vacuoles (RVs), especially in atrophic fibers, which also occasionally contain congophilic materials that are immunoreactive to beta-amyloid, lysosomal proteins, ubiquitin and tau proteins."
    explanation: >-
      Describes the composition of the inclusions. Tagged MODEL_ORGANISM because
      evidence_source classifies the publication's study type rather than the
      topic of the quoted sentence, and this is a mouse transgenic study whose
      opening prose describes the human disease.
- name: Myofiber Atrophy and Degeneration
  biological_scale: TISSUE
  description: >-
    The tissue endpoint: progressive myofiber atrophy and degeneration with
    angular fibers and increased fiber-size variability, without inflammation.
    Distribution is the diagnostic signature. Weakness starts in the anterior
    compartment of the lower leg, progresses to the posterior compartment, then
    hamstrings, then hip girdle, and the quadriceps is relatively spared until
    late. End-stage tissue outcomes are fibrosis and fatty replacement.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Foot Dorsiflexor Weakness
    description: >-
      Anterior tibialis involvement produces the presenting bilateral foot drop.
  - target: Distal Lower Limb Muscle Weakness
    description: Distal lower limb muscles are affected first and worst.
  - target: Distal Amyotrophy
    description: Progressive wasting accompanies the distal weakness.
  - target: Steppage Gait
    description: Foot drop produces a steppage gait.
  - target: Proximal Muscle Weakness
    description: >-
      Hip girdle weakness follows years to decades after onset.
  - target: Loss of Ambulation
    description: >-
      Progressive weakness leads to wheelchair dependence roughly ten to twenty
      years after onset.
  - target: Increased Variability in Muscle Fiber Diameter
    description: Histologic correlate of the atrophic process.
  - target: Elevated Circulating Creatine Kinase Concentration
    description: >-
      Myofiber degeneration releases creatine kinase, though only to normal or
      mildly elevated levels.
  - target: Respiratory Insufficiency Due to Muscle Weakness
    description: >-
      Respiratory muscle involvement appears late, and forced vital capacity
      declines measurably in non-ambulant patients.
  evidence:
  - reference: PMID:30338442
    reference_title: "GNE Myopathy: Etiology, Diagnosis, and Therapeutic Challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease slowly progresses over the next decades to involve skeletal muscles throughout the body, with relative sparing of the quadriceps until late stages of the disease."
    explanation: >-
      Establishes the progression pattern and the quadriceps sparing that defines
      it.
  - reference: PMID:20301439
    reference_title: GNE Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower-extremity muscle involvement progresses from the anterior to the posterior compartment of the lower leg, followed by hamstrings, then hip girdle muscles, with relative sparing of the quadriceps."
    explanation: >-
      GeneReviews states the compartment-by-compartment progression sequence.

    Uniform polygonal tumor cells with clear glycogen-rich cytoplasm and central
    nuclei arranged in sheets or nests separated by fibrous septa containing a
    lymphocytic infiltrate; expresses OCT3/4, SALL4, CD117, and SOX17.
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT include seminoma, embryonal carcinoma, choriocarcinoma, postpubertal-type teratoma and postpubertal-type YST
    explanation: >-
      Confirms seminoma as a primary histologic pattern of type II TGCT.
- name: Schiller-Duval Bodies in Yolk Sac Tumor Component
  finding_term:
    preferred_term: Schiller-Duval Body
    term:
      id: NCIT:C54124
      label: Schiller-Duval Body
  description: >-
    Perivascular glomeruloid structures lined by primitive endodermal tumor cells

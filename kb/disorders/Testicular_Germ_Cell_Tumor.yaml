  evidence:
  - reference: PMID:38541652
    reference_title: "RAS/Mitogen-Activated Protein Kinase Signaling Pathway in Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several genomic and transcriptomic assays have identified a few significantly
      mutated somatic genes, primarily KIT and K-RAS
    explanation: >-
      Identifies KIT as one of the primary significantly mutated somatic driver genes
      in TGCTs.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating mutations and frequent 12p copy-number gain (~80% of TGCTs)
  features: Codon 12 activating mutations; amplified via isochromosome 12p
  evidence:
  - reference: PMID:38541652
    reference_title: "RAS/Mitogen-Activated Protein Kinase Signaling Pathway in Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several genomic and transcriptomic assays have identified a few significantly
      mutated somatic genes, primarily KIT and K-RAS
    explanation: >-
      Identifies K-RAS as one of the primary significantly mutated somatic driver
      genes in TGCTs.
- name: Isochromosome 12p
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Present in >80% of TGCTs (with alternative 12p gains in remaining GCNIS-derived cases)
  features: >-
    Most consistent cytogenetic abnormality of GCNIS-derived TGCT; short arm of
    chromosome 12 harbors KRAS, CCND2, NANOG, and LDHB
  notes: >-
    Arm-level cytogenetic alteration rather than a single-gene locus; pathognomonic
    for GCNIS-derived TGCT.
  evidence:
  - reference: PMID:37175579
    reference_title: "Breaking the Mold: Epigenetics and Genomics Approaches Addressing Novel Treatments and Chemoresponse in TGCT Patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the most common abnormality is the presence of a 12p isochromosome (i(12p)), which affects more than 80% of TGCTs
    explanation: >-
      Confirms isochromosome 12p in >80% of TGCTs.
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detection of gain of the short arm of chromosome 12 is diagnostic to differentiate between non-GCNIS versus GCNIS related GCTs and supportive to the germ cell origin of both primary and metastatic tumors.
    explanation: >-
      Establishes 12p gain as the diagnostic cytogenetic hallmark of GCNIS-related
      TGCT.
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: MODIFIER
  variant_origin: SOMATIC
  association: Wild-type in most TGCTs; somatic mutations enriched in platinum-refractory or somatic-type malignant disease
  features: >-
    Wild-type p53 enables strong apoptotic response to cisplatin; somatic TP53
    mutations or MDM2 amplification confer cisplatin resistance
  evidence:
  - reference: PMID:37891379
    reference_title: "Strong apoptotic response of testis tumor cells following cisplatin treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting experiments revealed p53 to be induced in TTC, but not bladder
      cancer cells following cisplatin
    explanation: >-
      Demonstrates functional p53 induction in testis tumor cells after cisplatin
      treatment, consistent with wild-type p53 in most TGCTs.
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations associated with the formation of a somatic-type malignancy and/or the
      development of cisplatin resistance include TP53 mutations or MDM2 gene
      amplifications as well as epigenetic alterations.
    explanation: >-
      Confirms somatic TP53 mutations as a modifier driving cisplatin resistance and
      somatic-type malignant transformation in TGCT.
environmental:
- name: Cryptorchidism
  description: >-
    Undescended testis is the strongest established developmental risk factor,
    conferring an approximately four-fold increased risk of TGCT.
  effect: Strong developmental risk factor for TGCT
  evidence:
  - reference: PMID:17476009
    reference_title: "Age at surgery for undescended testis and risk of testicular cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Undescended testis, which is a risk factor for testicular cancer, is usually treated surgically, but whether the age at treatment has any effect on the risk is unclear."
    explanation: >-
      A 16,983-patient Swedish cohort study establishing undescended testis
      (cryptorchidism) as a risk factor for testicular cancer.
- name: Testicular Dysgenesis Syndrome
  description: >-
    TGCTs may arise as part of testicular dysgenesis syndrome, a cluster of male
    reproductive disorders including cryptorchidism, hypospadias, and impaired
    spermatogenesis linked to disrupted fetal testicular development and adverse
    prenatal environmental influences.
  effect: Associated developmental syndrome sharing fetal gonadal etiology
  influences_mechanisms:
  - target: Germ Cell Neoplasia In Situ (GCNIS)
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disrupted fetal testicular development in testicular dysgenesis syndrome impairs
      primordial germ cell/gonocyte maturation and predisposes to testicular cancer.
    evidence:
    - reference: PMID:11331648
      reference_title: "Testicular dysgenesis syndrome: an increasingly common developmental disorder with environmental aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This article summarizes existing evidence supporting a new concept that poor semen quality, testis cancer, undescended testis and hypospadias are symptoms of one underlying entity, the testicular dysgenesis syndrome (TDS), which may be increasingly common due to adverse environmental influences."
      explanation: >-
        Links adverse environmental influences and testicular dysgenesis syndrome to
        testis cancer pathogenesis.
  evidence:
  - reference: PMID:11331648
    reference_title: "Testicular dysgenesis syndrome: an increasingly common developmental disorder with environmental aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article summarizes existing evidence supporting a new concept that poor semen quality, testis cancer, undescended testis and hypospadias are symptoms of one underlying entity, the testicular dysgenesis syndrome (TDS), which may be increasingly common due to adverse environmental influences."
    explanation: >-
      Establishes the testicular dysgenesis syndrome concept that groups testicular
      cancer with cryptorchidism, hypospadias, and impaired spermatogenesis as
      symptoms of one underlying developmental disorder.
treatments:
- name: Radical Inguinal Orchiectomy
  description: >-
    Radical inguinal orchiectomy with spermatic cord ligation at the internal
    inguinal ring is the mandatory primary diagnostic and therapeutic procedure for
    suspected TGCT, curing ~75-80% of clinical stage I tumors alone. Trans-scrotal
    biopsy is contraindicated due to scrotal lymphatic violation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: radical inguinal orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  target_mechanisms:
  - target: Isochromosome 12p and Genomic Amplification
    treatment_effect: INHIBITS
    description: >-
      Surgical excision removes the primary invasive testicular tumor population.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inguinal orchiectomy is the main diagnostic procedure, and is also curative for most localized tumors, while patients with unfavorable risk factors for recurrence, or those who are unable or unwilling to undergo close follow-up, may require adjuvant treatment.
    explanation: >-
      Clinical practice guideline confirming inguinal orchiectomy as both the main
      diagnostic procedure and curative treatment for most localized TGCTs.
  - reference: PMID:31582176
    reference_title: "Current management of stage I testicular germ cell tumors in a French cancer institute. A practice analysis over the 10 past years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orchiectomy alone cure 80% of stage I.
    explanation: >-
      Quantifies the ~80% cure rate of stage I TGCT with orchiectomy alone.
- name: BEP Chemotherapy
  description: >-
    Bleomycin, etoposide, and cisplatin (BEP) is the standard first-line systemic
    chemotherapy regimen for metastatic TGCT (three cycles for IGCCCG good-prognosis
    disease and four cycles for intermediate/poor-prognosis disease) and an adjuvant
    option (one cycle) for high-risk stage I NSGCT, curing >80% of metastatic cases.
  therapeutic_modality: SMALL_MOLECULE
  regimen_term:
    preferred_term: BEP Regimen
    term:
      id: NCIT:C63488
      label: BEP Regimen
  treatment_term:
    preferred_term: BEP chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  target_mechanisms:
  - target: Cisplatin Sensitivity and DNA Damage Response
    treatment_effect: ACTIVATES
    description: >-
      Cisplatin DNA crosslinks combined with etoposide and bleomycin DNA damage
      trigger p53-dependent extrinsic and mitochondrial apoptosis in NER-deficient
      TGCT cells.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The standard therapy for patients with good prognosis is three cycles of chemotherapy BEP.
    explanation: >-
      Establishes three cycles of BEP as standard first-line therapy for good-risk
      metastatic TGCT.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The standard therapy for patients with intermediate and poor risk patients consists of four cycles of BEP chemotherapy.
    explanation: >-
      Establishes four cycles of BEP as standard first-line therapy for intermediate-
      and poor-risk metastatic TGCT.
  - reference: PMID:37891379
    reference_title: "Strong apoptotic response of testis tumor cells following cisplatin treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      metastatic testicular germ cell tumors (TGCT) are cured in over 80% of
      patients using cisplatin-based combination therapy
    explanation: >-
      Confirms the >80% cure rate with cisplatin-based combination therapy for
      metastatic TGCT.
  - reference: PMID:37820296
    reference_title: "Adolescent and Young Adult Germ Cell Tumors: Epidemiology, Genomics, Treatment, and Survivorship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Excellent outcomes, even in widely metastatic disease using cisplatin-based
      chemotherapy, can be achieved since Einhorn and Donohue's landmark 1977 study
      in TGCT
    explanation: >-
      Confirms excellent outcomes with cisplatin-based chemotherapy in metastatic
      TGCT.
- name: Surveillance
  description: >-
    Active surveillance is the preferred post-orchiectomy strategy for most clinical
    stage I seminoma and NSGCT patients, avoiding overtreatment and long-term
    adjuvant toxicity while preserving near-100% disease-specific survival through
    curative salvage therapy upon relapse (~15-20%).
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: active surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37967143
    reference_title: "Detection of Recurrence through microRNA-371a-3p Serum Levels in a Follow-up of Stage I Testicular Germ Cell Tumors in the DRKS-00019223 Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      258 patients with testicular CSI GCT were prospectively followed by
      surveillance for a median time of 18 months with serial measurements of serum
      M371 levels, in addition to standard diagnostic techniques
    explanation: >-
      Describes prospective surveillance protocol for stage I TGCT.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with stage I testicular germ-cell tumors, both active surveillance and adjuvant chemotherapy are acceptable options following orchiectomy, with no difference in overall survival.
    explanation: >-
      Guideline recommendation supporting active surveillance after orchiectomy in
      stage I TGCT with equivalent overall survival.
- name: Radiation Therapy
  description: >-
    Para-aortic adjuvant radiation therapy is an active option for seminoma due to
    its high radiosensitivity, though contemporary guidelines reserve adjuvant
    stage I radiotherapy for cases where chemotherapy is contraindicated because of
    long-term second malignancy risk.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Due to the increased risk of second malignancies, low-dose reduced paraaortic adjuvant radiotherapy should only be recommended if chemotherapy is contraindicated
    explanation: >-
      Defines the contemporary restricted role of para-aortic adjuvant radiotherapy
      in seminoma management.
- name: Retroperitoneal Lymph Node Dissection (RPLND)
  description: >-
    Surgical resection of residual retroperitoneal lymph nodes (>=1 cm) after
    chemotherapy is mandatory in marker-negative NSGCT to remove chemoresistant
    teratoma or viable tumor, and is a selective option in clinical stage I NSGCT
    with contraindications to adjuvant BEP.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: retroperitoneal lymph node dissection
    term:
      id: NCIT:C15275
      label: Lymphadenectomy
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with NSGCT and post-chemotherapy negative tumor markers, FDG-PET CT is not recommended, and all residual retroperitoneal lymph nodes ≥1 cm or residual masses in other locations should be resected if technically feasible
    explanation: >-
      Guideline recommendation establishing post-chemotherapy surgical resection of
      residual retroperitoneal nodal masses >=1 cm in NSGCT.
- name: MEK Inhibition (Trametinib) in NF1-Mutant Metastatic GCT
  description: >-
    Single-patient report of trametinib given to a platinum-refractory metastatic
    non-seminomatous GCT carrying a pathogenic NF1 frameshift, selected by
    comprehensive genomic profiling. AFP normalized for about 6 months before
    progression. Evidence is one case, so the response is possible but unproven.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
  target_mechanisms:
  - target: KIT/RAS Signaling Activation
    treatment_effect: INHIBITS
    description: >-
      Trametinib inhibits MEK1/2 downstream of hyperactivated RAS-MAPK signaling.
  evidence:
  - reference: PMID:42428031
    reference_title: "Metastatic Testicular Germ Cell Tumor in a Patient With Neurofibromatosis Type 1: Treatment With Trametinib Based on NF1 Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report of trametinib for a metastatic GCT with an NF1
      mutation, suggesting a possible but limited treatment effect.
    explanation: >-
      Single-case report of MEK inhibition with trametinib in an NF1-mutant
      metastatic GCT, describing a possible but limited response.

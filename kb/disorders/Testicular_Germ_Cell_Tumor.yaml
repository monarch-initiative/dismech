has_subtypes:
- name: Seminoma
  description: >-
    Pure seminoma accounts for approximately 50-55% of TGCTs. It arises from
    undifferentiated germ cells, is characterized by sheets of uniform cells with
    clear cytoplasm and central nuclei, and frequently contains lymphocytic infiltrates.
    Seminomas are highly radiosensitive and chemosensitive with excellent prognosis.
    Seminoma expresses an iPSC panel with OCT4/POU5F1, SOX17, KLF4, and MYC.
  subtype_frequency: "50-55%"
  evidence:
  - reference: PMID:36835562
    reference_title: "Epigenetic Regulation of Driver Genes in Testicular Tumorigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a seminoma subtype expresses an induced pluripotent stem cell (iPSC) panel
      with four upregulated genes, OCT4/POU5F1, SOX17, KLF4, and MYC
    explanation: >-
      Confirms the pluripotency gene expression panel characteristic of seminoma
      subtype.
- name: Embryonal Carcinoma
  subtype_term:
    preferred_term: testicular embryonal carcinoma
    term:
      id: MONDO:0006446
      label: testicular embryonal carcinoma
  description: >-
    Embryonal carcinoma is a highly aggressive NSGCT component showing primitive
    epithelial differentiation. It can differentiate into other germ cell tumor types
    and is commonly found as a component of mixed germ cell tumors. EC expresses
    OCT4/POU5F1, SOX2, LIN28, and NANOG and can reprogram cells into iPSC.
  subtype_frequency: "20-40% as component"
  evidence:
  - reference: PMID:36835562
    reference_title: "Epigenetic Regulation of Driver Genes in Testicular Tumorigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      embryonal carcinoma (EC) has four upregulated genes, OCT4/POU5F1, SOX2, LIN28,
      and NANOG. The EC panel can reprogram cells into iPSC, and both iPSC and EC can
      differentiate into teratoma
    explanation: >-
      Confirms EC pluripotency markers and its differentiation potential into
      teratoma.
- name: Yolk Sac Tumor
  description: >-
    Yolk sac tumor (endodermal sinus tumor) recapitulates extraembryonic yolk sac
    structures. Postpubertal testicular yolk sac tumor arises as a GCNIS-derived
    differentiation lineage of embryonal carcinoma (whereas prepubertal type I yolk
    sac tumor is GCNIS-independent), produces alpha-fetoprotein (AFP), and shows
    characteristic Schiller-Duval bodies.
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT include seminoma, embryonal carcinoma, choriocarcinoma, postpubertal-type teratoma and postpubertal-type YST
    explanation: >-
      Places postpubertal yolk sac tumor among the canonical GCNIS-derived type II
      testicular germ cell tumor subtypes.
  - reference: PMID:37175579
    reference_title: "Breaking the Mold: Epigenetics and Genomics Approaches Addressing Novel Treatments and Chemoresponse in TGCT Patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These cells maintain pluripotent properties, and EC can give rise to the rest of the tumor subtypes of the NS category: yolk sac tumors, choriocarcinoma, and teratoma
    explanation: >-
      Establishes yolk sac tumor as one of the non-seminomatous subtypes arising
      through differentiation from pluripotent embryonal carcinoma.
- name: Choriocarcinoma
  description: >-
    Choriocarcinoma is a rare but highly aggressive NSGCT that shows extraembryonic
    trophoblastic differentiation with syncytiotrophoblasts and cytotrophoblasts.
    It produces high levels of beta-hCG and has a propensity for early hematogenous
    metastasis.
  subtype_frequency: "1-3%"
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT include seminoma, embryonal carcinoma, choriocarcinoma, postpubertal-type teratoma and postpubertal-type YST
    explanation: >-
      Confirms choriocarcinoma as one of the canonical type II testicular germ cell
      tumor subtypes.
- name: Teratoma
  description: >-
    Teratoma contains differentiated tissues from ectoderm, mesoderm, and/or endoderm.
    In postpubertal males, teratoma is GCNIS-derived and malignant despite benign-appearing
    cytoarchitecture, with potential for metastasis and somatic-type malignant
    transformation. Mature teratomas are intrinsically resistant to cisplatin-based
    chemotherapy and require surgical resection.
  evidence:
  - reference: PMID:37175579
    reference_title: "Breaking the Mold: Epigenetics and Genomics Approaches Addressing Novel Treatments and Chemoresponse in TGCT Patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mature teratomas showing the highest degrees of differentiation are recognized as the most chemotherapy-resistant TGCT cases
    explanation: >-
      Establishes mature teratoma as the differentiated, chemotherapy-resistant
      non-seminomatous subtype of TGCT.
pathophysiology:
- name: Germ Cell Neoplasia In Situ (GCNIS)
  biological_scale: CELLULAR
  description: >-
    Nearly all postpubertal (type II) TGCTs arise from germ cell neoplasia in situ
    (GCNIS, formerly carcinoma in situ or intratubular germ cell neoplasia
    unclassified). GCNIS cells resemble fetal gonocytes/primordial germ cells that
    failed to mature normally during embryonic testicular development, remain dormant
    within seminiferous tubules until puberty, and subsequently accumulate chromosomal
    abnormalities that drive progression to invasive TGCT.
  locations:
  - preferred_term: testis
    term:
      id: UBERON:0000473
      label: testis
  cell_types:
  - preferred_term: primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: germ cell development
    modifier: ABNORMAL
    term:
      id: GO:0007281
      label: germ cell development
  evidence:
  - reference: PMID:38922953
    reference_title: "Pathogenesis and pathobiology of testicular germ cell tumours: a view from a developmental biological perspective with guidelines for pathological diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type II GCT develop from a non-invasive germ cell neoplasia in situ (GCNIS) and show an isochromosome 12p (i12p) or gain of 12p material as a common and characteristic molecular alteration.
    explanation: >-
      Establishes GCNIS as the non-invasive precursor lesion of postpubertal type II
      testicular germ cell tumors.
  - reference: PMID:38791003
    reference_title: "Recent Advancements in Research on DNA Methylation and Testicular Germ Cell Tumors: Unveiling the Intricate Relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      epigenetics has recently come into the spotlight as a major factor in TGCT
      initiation, progression, and even resistance to treatment
    explanation: >-
      Supports epigenetic dysregulation in GCNIS initiation and progression to
      invasive TGCT.
  downstream:
  - target: Isochromosome 12p and Genomic Amplification
    description: GCNIS acquires i(12p) or 12p copy-number gain during progression to invasive TGCT
    evidence:
    - reference: PMID:41384700
      reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is thought that the isochromosome 12p develops during the progression of a GCNIS to an invasive TGCT.
      explanation: >-
        Directly supports acquisition of isochromosome 12p during the transition
        from non-invasive GCNIS to invasive TGCT.

name: Testicular Germ Cell Tumor
creation_date: "2026-03-06T00:00:00Z"
description: >-
  Testicular germ cell tumors (TGCTs) are the most common solid malignancies in young men
  aged 15-39 years. Postpubertal (type II) TGCTs arise from germ cell neoplasia in situ
  (GCNIS), a preinvasive lesion of arrested fetal gonocytes, and are broadly classified into
  seminomas and non-seminomatous germ cell tumors (NSGCTs), which include embryonal carcinoma,
  yolk sac tumor, choriocarcinoma, and teratoma. A hallmark cytogenetic abnormality is
  isochromosome 12p [i(12p)] or 12p overrepresentation, present in virtually all GCNIS-derived
  cases, while seminomas frequently harbor somatic KIT and KRAS mutations. TGCTs are highly
  chemosensitive, with cisplatin-based regimens (particularly BEP: bleomycin, etoposide,
  cisplatin) achieving cure rates exceeding 80% even in metastatic disease. Serum tumor markers
  (AFP, beta-hCG, LDH) are critical for diagnosis, IGCCCG risk stratification, and monitoring
  treatment response, while circulating miR-371a-3p has emerged as a high-accuracy biomarker
  for viable non-teratomatous disease.
synonyms:
- TGCT
- germ cell tumor of testis
- germ cell tumor of the testis
- testicular germ cell neoplasm

    post-chemotherapy retroperitoneal masses.
  evidence:
  - reference: PMID:37175579
    reference_title: "Breaking the Mold: Epigenetics and Genomics Approaches Addressing Novel Treatments and Chemoresponse in TGCT Patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mature teratomas showing the highest degrees of differentiation are recognized as the most chemotherapy-resistant TGCT cases
    explanation: >-
      Confirms differentiated teratomatous histology and its resistance to
      cisplatin-based chemotherapy.
- name: Germ Cell Tumor Immunohistochemical Panel (OCT3/4, SALL4, CD117, CD30)
  diagnostic: true
  description: >-
    Diagnostic immunohistochemical panel used on radical orchiectomy specimens to
    confirm GCNIS and distinguish seminoma (OCT3/4+, CD117+, SOX17+, CD30-) from
    embryonal carcinoma (OCT3/4+, SOX2+, CD30+) and extraembryonic components.
  evidence:
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the most commonly used immunomarker panel includes OCT3/4, placental alkaline
      phosphate, D2-40, SALL4, CD117, and CD30 for GCTs and the documentation of germ
      cell neoplasia in situ (GCNIS)
    explanation: >-
      ISUP consensus recommendation establishing the core immunohistochemical panel
      for TGCT subtype classification and GCNIS documentation.
phenotypes:
- category: Neoplastic
  name: Testicular Mass
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    A solid, painless or mildly tender unilateral testicular nodule or mass is the
    cardinal clinical presentation of TGCT, the most common malignancy in men aged
    15-39 years.
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TGCT should be suspected in any male with a solid, painless testicular nodule. A history of cryptorchidism or atrophic testes may be present.
    explanation: >-
      Clinical practice guideline identifying a solid painless testicular nodule as
      the presenting sign of TGCT.
  - reference: PMID:37820296
    reference_title: "Adolescent and Young Adult Germ Cell Tumors: Epidemiology, Genomics, Treatment, and Survivorship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testicular GCTs (TGCTs) are the most common cancers in 15- to 39-year-old men
    explanation: >-
      Confirms TGCTs are the most common cancers in young adult men.
- category: Biochemical
  name: Elevated Serum Alpha-Fetoprotein
  frequency: OCCASIONAL
  description: >-
    Circulating AFP is elevated in ~25.6% of all TGCT patients and ~60.1% of
    non-seminomas (reflecting yolk sac tumor or embryonal carcinoma elements),
    whereas pure seminoma and pure choriocarcinoma do not secrete AFP; an elevated
    AFP mandates management as NSGCT.
  phenotype_term:
    preferred_term: Elevated alpha-fetoprotein
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  evidence:
  - reference: PMID:31275973
    reference_title: "Serum Tumour Markers in Testicular Germ Cell Tumours: Frequencies of Elevated Levels and Extents of Marker Elevation Are Significantly Associated with Clinical Parameters and with Response to Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all GCT patients, the frequencies of elevated levels of bHCG, AFP, LDH, and bHCG or AFP were 37.9%, 25.6%, 32.9%, and 47.6%; in pure seminomas 28%, 2.8%, 29.1%, and 30.3%; and in nonseminoma 53.0%, 60.1%, 38.7%, and 73.8%.
    explanation: >-
      422-patient TGCT cohort quantifying serum AFP elevation at 25.6% overall and
      60.1% in non-seminomatous TGCT.
- category: Biochemical
  name: Elevated Serum Beta-hCG
  frequency: FREQUENT
  description: >-
    Circulating beta-hCG is elevated in ~37.9% of all TGCT patients (~53.0% of
    non-seminomas, especially choriocarcinoma, and up to ~20-28% of pure seminomas
    containing syncytiotrophoblastic giant cells).
  phenotype_term:
    preferred_term: Elevated serum beta-hCG
    term:
      id: HP:6000485
      label: Elevated circulating beta chorionic gonadotropin concentration
  evidence:
  - reference: PMID:31275973
    reference_title: "Serum Tumour Markers in Testicular Germ Cell Tumours: Frequencies of Elevated Levels and Extents of Marker Elevation Are Significantly Associated with Clinical Parameters and with Response to Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all GCT patients, the frequencies of elevated levels of bHCG, AFP, LDH, and bHCG or AFP were 37.9%, 25.6%, 32.9%, and 47.6%; in pure seminomas 28%, 2.8%, 29.1%, and 30.3%; and in nonseminoma 53.0%, 60.1%, 38.7%, and 73.8%.
    explanation: >-
      Quantifies elevated serum beta-hCG at 37.9% across all TGCTs, 28% in pure
      seminoma, and 53.0% in non-seminoma.
- category: Biochemical
  name: Elevated Serum LDH
  frequency: FREQUENT
  description: >-
    Serum lactate dehydrogenase (particularly LDH-1 encoded by LDHB on 12p) is
    elevated in ~32.9% of TGCT patients and correlates with tumor burden and IGCCCG
    risk group.
  phenotype_term:
    preferred_term: Increased serum LDH
    term:
      id: HP:0025435
      label: Increased circulating lactate dehydrogenase concentration
  reports_on:
  - target: Isochromosome 12p and Genomic Amplification
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Elevated serum LDH-1 reflects tumor burden and 12p copy-number gain (LDHB maps
      to chromosome 12p).
  evidence:
  - reference: PMID:31275973
    reference_title: "Serum Tumour Markers in Testicular Germ Cell Tumours: Frequencies of Elevated Levels and Extents of Marker Elevation Are Significantly Associated with Clinical Parameters and with Response to Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all GCT patients, the frequencies of elevated levels of bHCG, AFP, LDH, and bHCG or AFP were 37.9%, 25.6%, 32.9%, and 47.6%; in pure seminomas 28%, 2.8%, 29.1%, and 30.3%; and in nonseminoma 53.0%, 60.1%, 38.7%, and 73.8%.
    explanation: >-
      Quantifies serum LDH elevation at 32.9% across all TGCT patients (29.1% in
      pure seminoma and 38.7% in non-seminoma).
- category: Endocrine
  name: Gynecomastia
  frequency: OCCASIONAL
  description: >-
    Gynecomastia occurs as an endocrine paraneoplastic manifestation, particularly in
    beta-hCG-secreting or metastatic TGCT (where ~10% of patients present with
    symptoms of metastatic or paraneoplastic disease).
  phenotype_term:
    preferred_term: Gynecomastia
    term:
      id: HP:0000771
      label: Gynecomastia
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      have symptoms of metastatic disease such as lumbar back pain, lower extremity swelling, dyspnea, cough, neck mass enlargement, gynecomastia
    explanation: >-
      Clinical guideline listing gynecomastia among recognized systemic/metastatic
      presenting manifestations of TGCT.
- category: Reproductive
  name: Cryptorchidism (Risk Factor)
  description: >-
    History of cryptorchidism (undescended testis) is a major developmental
    predisposing condition associated with an approximately four-fold increased risk
    of TGCT; prepubertal orchiopexy reduces but does not eliminate risk.
  phenotype_term:
    preferred_term: Cryptorchidism
    term:
      id: HP:0000028
      label: Cryptorchidism
  evidence:
  - reference: PMID:23423470
    reference_title: "Cryptorchidism and testicular germ cell tumors: comprehensive meta-analysis reveals that association between these conditions diminished over time and is modified by clinical characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      history of CO is associated with four-fold increased TGCT risk [RR = 4.1(95% CI = 3.6-4.7)]
    explanation: >-
      Meta-analysis quantifying a 4.1-fold increased risk of TGCT in males with a
      history of cryptorchidism.
biochemical:
- name: Alpha-Fetoprotein (AFP)
  biomarker_term:
    preferred_term: Alpha-Fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  presence: Elevated in yolk sac tumor and embryonal carcinoma (~60% of NSGCTs)
  notes: >-
    Never elevated in pure seminoma or pure choriocarcinoma; post-orchiectomy
    serum half-life is 5-7 days.
  readouts:
  - target: Epigenetic Regulation of Subtype Identity
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated serum AFP indicates non-seminomatous (yolk sac or embryonal carcinoma)
      differentiation and excludes pure seminoma.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AFP and/or bHCG are elevated in about 85% of NSGCTs, even in localized tumors. By contrast, serum bHCG is elevated in less than 20% of testicular seminomas, and AFP is not elevated in pure seminomas
    explanation: >-
      Establishes the diagnostic subtype specificity of serum AFP in TGCT.
- name: Beta-Human Chorionic Gonadotropin (beta-hCG)
  biomarker_term:
    preferred_term: Human Chorionic Gonadotropin
    term:
      id: NCIT:C2275
      label: Human Chorionic Gonadotropin
  presence: Markedly elevated in choriocarcinoma; elevated in ~53% of NSGCTs and ~15-28% of seminomas
  notes: >-
    Post-orchiectomy serum half-life is 1-3 days; persistent elevation or inadequate
    on-treatment decline indicates residual disease or adverse prognosis.
  readouts:
  - target: Epigenetic Regulation of Subtype Identity
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Reflects trophoblastic/syncytiotrophoblastic tumor burden for IGCCCG staging
      and post-orchiectomy/chemotherapy kinetic monitoring.
  evidence:
  - reference: PMID:31275973
    reference_title: "Serum Tumour Markers in Testicular Germ Cell Tumours: Frequencies of Elevated Levels and Extents of Marker Elevation Are Significantly Associated with Clinical Parameters and with Response to Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all GCT patients, the frequencies of elevated levels of bHCG, AFP, LDH, and bHCG or AFP were 37.9%, 25.6%, 32.9%, and 47.6%; in pure seminomas 28%, 2.8%, 29.1%, and 30.3%; and in nonseminoma 53.0%, 60.1%, 38.7%, and 73.8%.
    explanation: >-
      Quantifies pre-treatment serum beta-hCG elevation frequencies across TGCT
      histologic groups.
- name: Lactate Dehydrogenase (LDH)
  biomarker_term:
    preferred_term: Lactate Dehydrogenase
    term:
      id: NCIT:C25184
      label: Lactate Dehydrogenase
  presence: Elevated proportional to tumor burden in ~33% of TGCT patients
  notes: >-
    Non-specific marker included in TNM S-staging and IGCCCG risk classification;
    LDH-1 tetramer derives from LDHB on chromosome 12p.
  readouts:
  - target: Isochromosome 12p and Genomic Amplification
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Serum LDH-1 correlates with overall tumor burden and 12p LDHB copy-number gain.
  evidence:
  - reference: PMID:36835562
    reference_title: "Epigenetic Regulation of Driver Genes in Testicular Tumorigenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with other malignancies, patients with TGCT have a unique isoenzyme pattern for serum lactate dehydrogenase (S-LDH) with an unusually high LDH isoenzyme 1 activity (S-LDH-1) ... LDH-1 is a tetramer of four LDHB subunits, generated from LDHB on the short arm of chromosome 12, 12p
    explanation: >-
      Explains the elevated S-LDH-1 isoenzyme profile of TGCT via chromosome 12p
      LDHB expression.
- name: microRNA-371a-3p (miR-371a-3p)
  biomarker_term:
    preferred_term: MicroRNA 371a-3p
    term:
      id: NCIT:C177289
      label: MicroRNA 371a-3p
  presence: Elevated in serum of patients with viable non-teratomatous TGCT
  notes: >-
    Demonstrates ~90-92% overall sensitivity and 100% sensitivity / 96.3% specificity
    for stage I relapse detection in prospective follow-up; does not detect mature
    teratoma.
  readouts:
  - target: Testicular Mass
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Circulating miR-371a-3p tracks viable non-teratomatous germ cell tumor burden
      and early recurrence during stage I surveillance.
  evidence:
  - reference: PMID:37967143
    reference_title: "Detection of Recurrence through microRNA-371a-3p Serum Levels in a Follow-up of Stage I Testicular Germ Cell Tumors in the DRKS-00019223 Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      area under the ROC curve of 0.993, sensitivity 100%, specificity 96.3%,
      positive predictive value 83%, negative predictive value 100%
    explanation: >-
      Prospective multicenter study demonstrating superior diagnostic performance
      of miR-371a-3p for TGCT relapse detection.
  - reference: DOI:10.3390/jcm13237448
    reference_title: "Current and Evolving Biomarkers in the Diagnosis and Management of Testicular Germ Cell Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      miR371a-3p has been identified as a promising biomarker with sensitivity and
      specificity of approximately 90–92% and 84–86%, respectively
    explanation: >-
      Summarizes overall diagnostic sensitivity and specificity of circulating
      miR-371a-3p in TGCT.
diagnosis:
- name: Bilateral Testicular Ultrasound
  description: >-
    High-frequency bilateral scrotal ultrasonography is mandatory to confirm an
    intratesticular mass and evaluate the contralateral testis for synchronous tumor
    or atrophy.
  diagnosis_term:
    preferred_term: Diagnostic Ultrasound
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis, staging and risk assessment is based on a testicular ultrasound, pre- and post-orchiectomy AFP, BHCG and LDH, and a thoraco-abdominopelvic CT scan.
    explanation: >-
      Clinical practice guideline establishing testicular ultrasound as part of the
      mandatory initial diagnostic workup.
- name: Radical Inguinal Orchiectomy Histopathologic Assessment
  description: >-
    Pathologic examination of the entire testis from radical inguinal orchiectomy
    establishes WHO histologic subtype, GCNIS presence, rete testis or
    lymphovascular invasion, and local pathologic T stage; trans-scrotal biopsy is
    contraindicated.
  diagnosis_term:
    preferred_term: Orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Radical inguinal orchiectomy is mandatory to provide local tumor control and to establish the histopathologic subtypes, presence of in situ neoplasia, vascular lymphatic or rete testis invasion and spread beyond the tunica albuginea
    explanation: >-
      Establishes radical inguinal orchiectomy as the mandatory diagnostic specimen
      for TGCT histologic classification and pathologic risk assessment.
- name: Pre- and Post-Orchiectomy Serum Tumor Marker Panel (AFP, beta-hCG, LDH)
  markers: AFP, beta-hCG, LDH
  description: >-
    Serial measurement of serum AFP, beta-hCG, and LDH before and after orchiectomy
    supports subtype attribution (any AFP elevation excludes pure seminoma), TNM
    S-category assignment, and IGCCCG prognostic group classification.
  diagnosis_term:
    preferred_term: Alpha-fetoprotein Measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis, staging and risk assessment is based on a testicular ultrasound, pre- and post-orchiectomy AFP, BHCG and LDH, and a thoraco-abdominopelvic CT scan.
    explanation: >-
      Confirms pre- and post-orchiectomy AFP, beta-hCG, and LDH measurement as
      mandatory for TGCT diagnosis, staging, and risk assessment.
- name: Thoraco-Abdominopelvic Computed Tomography and IGCCCG Staging
  description: >-
    Contrast-enhanced CT of the thorax, abdomen, and pelvis evaluates retroperitoneal
    nodal and visceral metastases and, combined with post-orchiectomy serum markers,
    assigns AJCC TNM stage and IGCCCG prognostic risk group.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with persistent markers after orchiectomy or advanced disease at
      diagnosis should be staged and classified according to the IGCCCG
      prognostic classification.
    explanation: >-
      Supports cross-sectional staging and IGCCCG prognostic classification in
      persistent-marker or metastatic TGCT.
- name: Chromosome 12p Gain Molecular Cytogenetic Testing
  description: >-
    Fluorescence in situ hybridization or copy-number testing for isochromosome 12p
    or 12p amplification differentiates GCNIS-derived TGCTs from non-GCNIS tumors and
    confirms germ cell origin in diagnostically challenging or metastatic lesions.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detection of gain of the short arm of chromosome 12 is diagnostic to differentiate between non-GCNIS versus GCNIS related GCTs and supportive to the germ cell origin of both primary and metastatic tumors.
    explanation: >-
      ISUP consensus recommendation establishing chromosome 12p gain testing as
      diagnostic for GCNIS-related TGCTs and germ cell origin.
genetic:
- name: KIT
  gene_term:
    preferred_term: KIT
    term:

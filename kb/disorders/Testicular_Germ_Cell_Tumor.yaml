- name: Postpubertal Teratoma Differentiation
  finding_term:
    preferred_term: Teratoma
    term:
      id: NCIT:C3403
      label: Teratoma
  description: >-
    Somatic germ-layer tissues (ectoderm, mesoderm, endoderm) present in pure

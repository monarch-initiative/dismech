genetic:
- name: HOXD13 Homeodomain Missense Variants
  gene_term:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  association: Causative in a minority of cases
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Ser308Cys and Ile314Leu, both inside the homeodomain, were reported in two
    families with limb phenotypes overlapping types D and E, and this is the
    attribution the ISDS nosology carries for type D. Most BDD in the general
    population has no identified molecular cause; the review literature as
    recently as 2008 recorded no gene or locus for BDD.
  evidence:
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both are associated with distinctive limb phenotypes in which brachydactyly of specific metacarpals, metatarsals, and phalangeal bones is the most constant feature, exhibiting overlap with brachydactyly types D and E."
    explanation: The primary human genetic evidence linking HOXD13 to type D/E phenotypes.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: REFUTE
    evidence_source: OTHER
    snippet: "no gene or locus for BDD has yet been identified."
    explanation: >-
      A 2008 review states no BDD gene had been identified, which is why the
      HOXD13 attribution should not be read as accounting for population BDD.
- name: 7p15 Susceptibility Locus
  association: Linkage to a combined BDD/BDE phenotype
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    A variance-components genome scan of 1,722 genotyped members of a Nepali
    extended pedigree found significant linkage of the combined BDD/BDE trait to
    7p21-7p14, peaking at 7p15 — away from the HOXD cluster on 2q31. Candidate
    genes in the interval include TWIST and the HOXA cluster. The causal variant
    has not been identified, so this is a mapped locus rather than a gene.
  evidence:
  - reference: PMID:24022874
    reference_title: Nonsyndromic brachydactyly type D and type E mapped to 7p15 in healthy children and adults from the Jirel ethnic group in eastern Nepal.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant linkage of BDD/BDE was found to markers on chromosome 7p21-7p14 (peak LOD score = 3.74 at 7p15 between markers D7S493 and D7S516)."
    explanation: Establishes a significant linkage signal outside the HOXD cluster.
  - reference: PMID:24022874
    reference_title: Nonsyndromic brachydactyly type D and type E mapped to 7p15 in healthy children and adults from the Jirel ethnic group in eastern Nepal.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Possible positional candidate genes in the one-lod support interval of this QTL include TWIST and the HOXA1-A13 cluster."
    explanation: Names the candidate genes under the linkage peak; no causal variant was reported.
diagnosis:
- name: Clinical-radiographic diagnosis
  description: >-
    Clinical inspection and hand radiographs showing a short broad distal phalanx
    of one or both thumbs, with the rest of the hand normal. Molecular testing is
    not routine because the trait is common and usually unexplained; where it
    matters, HOXD13 is the candidate the nosology names. The main diagnostic task
    is separating isolated BDD from a syndromic short thumb.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  results: >-
    Short broad distal phalanx of the thumb, unilateral or bilateral, on
    clinical evaluation and radiographs.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical evaluation and radiographs show a broad and short distal phalanx of thumbs, unilateral or bilateral."
    explanation: States the diagnostic method and finding for BDD.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is clinical, anthropometric and radiological."
    explanation: Establishes the clinical-radiographic basis of brachydactyly diagnosis.
treatments:
- name: Observation and Reassurance
  description: >-
    BDD is common, does not impair thumb function in most people, and needs no
    treatment; the appropriate management for the majority is recognition and
    reassurance rather than intervention.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35722929
    reference_title: Aesthetic correction of short nail deformity in congenital brachydactyly Type D by distraction lengthening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the thumb function is often unaffected, some patients seek surgery for cosmetic improvement."
    explanation: Confirms that function is usually preserved, so intervention is elective.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is no specific management or treatment that is applicable to all forms of brachydactyly."
    explanation: Supports a management approach directed by symptoms rather than by diagnosis.
- name: Distraction Lengthening for Nail Deformity
  description: >-
    Distraction lengthening of the short distal phalanx is an elective,
    cosmesis-directed procedure. In the largest reported series — 163 thumbs in 95
    patients — mean thumbnail length rose from 9 mm to 15 mm and the nail
    length-to-width ratio normalised, without loss of thumb function or a visible
    scar.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:35722929
    reference_title: Aesthetic correction of short nail deformity in congenital brachydactyly Type D by distraction lengthening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean thumbnail length improved from 9 mm to 15 mm, with a mean percentage increase of 62%."
    explanation: Quantifies the anatomical result of distraction lengthening in 95 patients.
  - reference: PMID:35722929
    reference_title: Aesthetic correction of short nail deformity in congenital brachydactyly Type D by distraction lengthening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that aesthetic correction of short nail deformity in brachydactyly Type D can be achieved by distraction lengthening with high satisfaction and without functional impairment."
    explanation: States the authors' overall outcome assessment for the procedure.

pathophysiology:
- name: Altered HOXD13 Homeodomain DNA Binding
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    HOXD13 is the most 5' gene of the HOXD cluster and encodes a homeodomain
    transcription factor that patterns the autopod. Most HOXD13 disease alleles
    are polyalanine expansions or frameshifts causing synpolydactyly; the two
    substitutions associated with type D and type E phenotypes instead sit inside
    the homeodomain itself. In vitro, Ile314Leu — at homeodomain position 47 —
    does not simply lose DNA binding but rebalances it, gaining affinity for a
    TTAC core target while losing affinity for TTAT. A mixed gain and loss of
    target selectivity, rather than a dosage change, is what distinguishes this
    allele class from the synpolydactyly alleles of the same gene.
  gene:
    preferred_term: HOXD13
    term:
      id: hgnc:5136
      label: HOXD13
  biological_processes:
  - preferred_term: Regulation of Transcription by RNA Polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  molecular_functions:
  - preferred_term: DNA-binding Transcription Factor Activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe two mutations of HOXD13 (923C-->G encoding Ser308Cys and 940A-->C encoding Ile314Leu) that cause missense substitutions within the homeodomain."
    explanation: Identifies the homeodomain missense alleles associated with the type D/E phenotypes.
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the Ile314Leu mutation (which resides at the 47th position of the homeodomain) exhibited increased affinity for a target containing the core recognition sequence 5'-TTAC-3' but decreased affinity for a 5'-TTAT-3' target"
    explanation: Shows the allele rebalances rather than abolishes target-site binding.
  - reference: PMID:12649808
    reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "No consistent differences were found for the Ser308Cys mutation compared with the wild type"
    explanation: >-
      A negative in vitro result for the second allele; recorded as PARTIAL
      because it shows the DNA-binding model does not account for both variants.
  downstream:
  - target: Premature Closure of the Thumb Distal Phalangeal Epiphysis
    description: >-
      Deregulated autopod patterning changes the growth trajectory of the thumb
      terminal segment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12649808
      reference_title: Missense mutations in the homeodomain of HOXD13 are associated with brachydactyly types D and E.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both are associated with distinctive limb phenotypes in which brachydactyly of specific metacarpals, metatarsals, and phalangeal bones is the most constant feature, exhibiting overlap with brachydactyly types D and E."
      explanation: Connects the HOXD13 homeodomain alleles to the type D/E digital phenotypes.
- name: Premature Closure of the Thumb Distal Phalangeal Epiphysis
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: TISSUE
  description: >
    Unlike the type A-C brachydactylies, in which a phalangeal segment fails to
    form or to segment properly, the type D thumb has all its segments — the
    distal phalanx simply stops growing early. Investigations attribute the short
    distal phalanx to early closure of its epiphysis; the base of the shortened
    phalanx is broader than the proximal phalangeal surface it articulates with,
    and the distal end is often hyperplastic. The mechanism is therefore one of
    growth-plate timing in a single skeletal element rather than of segment
    specification.
  biological_processes:
  - preferred_term: Endochondral Ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: ABNORMAL
  - preferred_term: Chondrocyte Proliferation
    term:
      id: GO:0035988
      label: chondrocyte proliferation
    modifier: DECREASED
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other investigations confirmed that the short distal pha- lanx of the thumb results from early closure of its epiphy- ses."
    explanation: >-
      Identifies premature epiphyseal closure as the proximate mechanism. The
      quote preserves the hyphenated line breaks of the cached full text
      ("pha- lanx", "epiphy- ses"), which are a PDF artifact, not the source's
      own wording.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has been noted that the base of the distal phalanx is broader than the surface of the proximal phalanx to which it articulates, and that the distal end of the bone often shows some hyperplasia."
    explanation: Describes the characteristic broad, hyperplastic morphology of the shortened phalanx.
  downstream:
  - target: Short Broad Distal Phalanx of the Thumb
    description: >-
      Early epiphyseal fusion leaves a short, broad terminal thumb segment with a
      correspondingly short broad nail.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35722929
      reference_title: Aesthetic correction of short nail deformity in congenital brachydactyly Type D by distraction lengthening.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brachydactyly Type D is a congenital condition of the thumb in which there is a short and broad thumbnail."
      explanation: States the realised thumb and nail morphology.
- name: Short Broad Distal Phalanx of the Thumb
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised phenotype: a short, broad distal phalanx of the thumb,
    unilateral or bilateral, giving the characteristic short wide thumbnail.
    Great toes may be affected in the same way, and the distal phalanges of other
    digits are sometimes broad and short — the serially homologous echo of the
    same lesion. Thumb function is typically unaffected, which is why the
    presentation is usually cosmetic.
  biological_processes:
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristically, the distal phalanx of the thumb alone is shortened."
    explanation: Defines the isolated distal-thumb involvement that names the type.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The distal phalanges of other digits may also be broad and short. Great toes may be similarly affected."
    explanation: Documents the serially homologous involvement of other digits and the great toes.
  downstream:
  - target: Type D Brachydactyly
    causal_link_type: DIRECT
  - target: Short Distal Phalanx of the Thumb
    causal_link_type: DIRECT
  - target: Broad Distal Phalanx of the Thumb
    causal_link_type: DIRECT
  - target: Short Distal Phalanx of the Hallux
    causal_link_type: DIRECT
  - target: Broad Distal Phalanx of the Hallux
    causal_link_type: DIRECT

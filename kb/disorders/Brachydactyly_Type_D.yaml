name: Brachydactyly Type D
synonyms:
- BDD
- Stub thumb
- Clubbed thumb
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type D ("stub thumb") is shortening and broadening of the distal
  phalanx of the thumb, unilateral or bilateral, with the rest of the hand
  essentially normal. It is by far the most common isolated brachydactyly
  together with type A3 — reported at 0.41% to 4.0% depending on population, and
  at 3.55% in a large genotyped Nepali cohort — which sets it apart from every
  other entity in the isolated brachydactyly group: those are known from a
  handful of pedigrees, this one is a recognisable normal-population variant that
  rarely reaches medical attention except for the short broad thumbnail. The
  short distal phalanx results from premature closure of its epiphysis rather
  than from failure to form a segment. Inheritance is autosomal dominant with
  reduced penetrance, and the molecular basis is largely unresolved: HOXD13
  homeodomain missense substitutions produce limb phenotypes overlapping types D
  and E, which is the attribution the ISDS nosology records, but a genome-wide
  linkage scan of a combined BDD/BDE phenotype mapped instead to 7p15, so more
  than one locus is likely.

inheritance:
- name: Autosomal Dominant with Reduced Penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with reduced penetrance and frequent unilateral
    expression. Heritability of the combined BDD/BDE phenotype was estimated at
    0.89 in a large extended Nepali pedigree, so the trait is strongly genetic
    even where a specific allele has not been found.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In isolated brachydactyly, the inheritance is mostly autosomal dominant with variable expressivity"
    explanation: Establishes the dominant, variably expressed inheritance pattern of isolated brachydactyly.
  - reference: PMID:24022874
    reference_title: Nonsyndromic brachydactyly type D and type E mapped to 7p15 in healthy children and adults from the Jirel ethnic group in eastern Nepal.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The additive genetic heritability of BDD/BDE was highly significant"
    explanation: A large extended pedigree establishes strong additive genetic determination of the trait.
classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly type D (HOXD13; OMIM 113200). The HOXD13 attribution follows
      the nosology; note that most BDD is not molecularly solved and that the one
      genome-wide scan of a combined BDD/BDE phenotype implicated 7p15 rather
      than the HOXD cluster. The 2019 revision (PMID:31633310) placed type D in
      group 37 "Brachydactylies (without extraskeletal manifestations)". Per-row
      re-verification against the 2023 Table 1 is tracked in
      monarch-initiative/dismech#7867.

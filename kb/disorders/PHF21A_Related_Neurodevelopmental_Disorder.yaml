genetic:
  - name: PHF21A
    relationship_type: CAUSATIVE
    variant_origin: DE_NOVO
    gene_term:
      preferred_term: PHF21A
      term:
        id: hgnc:24156
        label: PHF21A
    notes: >-
      Heterozygous loss of function, overwhelmingly de novo. Reported variant
      classes are frameshift, nonsense, and a missense change in the AT-hook
      domain; six of seven in the defining cohort truncate a C-terminal
      intrinsically disordered region, which the authors take as evidence that
      the region is functionally important.

      Two distinct lesion types support the same conclusion and should not be
      conflated: balanced translocations that disrupt the gene without deleting
      neighbours, and intragenic point mutations. Both isolate PHF21A from the
      Potocki-Shaffer interval, which is why this entry can attribute the
      phenotype to one gene.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We have identified seven heterozygous coding mutations, among which
          six are de novo
        explanation: >-
          The cohort and its inheritance pattern.
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          PHF21A has been associated with intellectual disability and
          craniofacial anomalies based on its deletion in the Potocki-Shaffer
          syndrome region at 11p11.2 and its disruption in three patients with
          balanced translocations
        explanation: >-
          The evidence structure that makes single-gene attribution possible,
          which is the scope argument recorded in the entry's top-level notes.
prevalence:
  - population: Published cases worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      Seven unrelated individuals in the defining cohort, preceded by three
      translocation patients and a small number of earlier point-mutation
      reports. No point prevalence has been estimated. Recorded as a case count
      rather than a rate, because there is no denominator.
    evidence:
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Here, we analyze genomic data from seven unrelated individuals with
          mutations in PHF21A
        explanation: >-
          The cohort size, quoted so the figure stays attached to its study.
discussions:
  - discussion_id: phf21a_dosage_to_transcription
    kind: KNOWLEDGE_GAP
    prompt: >-
      Does heterozygous PHF21A loss actually de-repress LSD1-CoREST target genes
      in human neurons, and which targets account for the craniofacial features
      as distinct from the neurodevelopmental ones?
    attaches_to:
      - pathophysiology#De-repression of LSD1-CoREST Target Genes
      - pathophysiology#Neurodevelopmental and Craniofacial Consequences
    rationale: >-
      The de-repression evidence is a knockdown in cell lines, which establishes
      the direction of the effect but not its magnitude at half dosage - and
      haploinsufficiency is precisely a claim about half dosage. No cited work
      measures LSD1 target expression in patient-derived neurons.

      The craniofacial half is less explained still. The pathograph reaches
      facial dysmorphism from a transcriptional node without naming a single
      target that would produce it, and neural crest is not mentioned anywhere
      in the cited evidence. That is an honest gap rather than a modelling
      choice: a chromatin reader expressed in fetal brain does not by itself
      account for a facial phenotype.

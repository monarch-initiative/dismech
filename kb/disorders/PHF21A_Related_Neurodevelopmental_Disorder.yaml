genetic:
  - name: PHF21A
    relationship_type: CAUSATIVE
    variant_origin: DE_NOVO
    gene_term:
      preferred_term: PHF21A
      term:
        id: hgnc:24156
        label: PHF21A
    notes: >-
      Heterozygous loss of function, overwhelmingly de novo. Reported variant
      classes are frameshift, nonsense, and a missense change in the AT-hook
      domain; six of seven in the defining cohort truncate a C-terminal
      intrinsically disordered region, which the authors take as evidence that
      the region is functionally important.

      Two distinct lesion types support the same conclusion and should not be
      conflated: balanced translocations that disrupt the gene without deleting
      neighbours, and intragenic point mutations. Both isolate PHF21A from the
      Potocki-Shaffer interval, which is why this entry can attribute the
      phenotype to one gene.

      Not curated: gnomAD loss-of-function constraint. The deep-research report
      gives pLI 1.00, LOEUF 0.221 and 11 observed against 82.5 expected LoF
      alleles, which would be independent population-scale support for
      haploinsufficiency. It is left out because no cited publication in this
      entry states those figures, so there is nothing to attach an exact-quote
      snippet to; importing them from a research report would be asserting a
      number from an uncitable source. A curator with access to a gnomAD
      release citation should add it.
    variants:
      - name: Variant class distribution across the reported cohort
        type: Frameshift, nonsense and missense
        clinical_significance: PATHOGENIC
        description: >-
          Truncating variants dominate. Across twelve patients: frameshift 7,
          nonsense 4, missense 1. Every variant reported so far is de novo and
          heterozygous, which is the population-level form of the
          haploinsufficiency claim the whole entry rests on.
        evidence:
          - reference: PMID:37633153
            reference_title: "De novo variants in PHF21A cause intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures: A case report and literature review."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              The most common types of variants were frameshift variants (7/12,
              58.33%), followed by nonsense variants (4/12, 33.33%) and missense
              variants (1/12, 8.33%)
            explanation: >-
              The class distribution with its denominator.
          - reference: PMID:37633153
            reference_title: "De novo variants in PHF21A cause intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures: A case report and literature review."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              All of the variants (100%) were de novo heterozygous variants
            explanation: >-
              Establishes the de novo pattern quantitatively rather than as the
              qualitative "overwhelmingly de novo" the notes previously carried.
      - name: p.Arg580* recurrent variant
        type: Nonsense
        clinical_significance: PATHOGENIC
        description: >-
          A recurrent nonsense change carried by a quarter of reported patients,
          and by two of the seven in the defining cohort. It is the one place a
          genotype-phenotype correlation could have been tested in this disease,
          and the answer was negative: patients with the same variant differ
          phenotypically. That is recorded because it is informative - it argues
          against variant identity being the main driver of severity - and not
          because the correlation is still open.
        evidence:
          - reference: PMID:37633153
            reference_title: "De novo variants in PHF21A cause intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures: A case report and literature review."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              Three of the 12 patients (25%) had the same variant (p.Arg580*)
            explanation: >-
              The recurrence and its share of the cohort.
          - reference: PMID:37633153
            reference_title: "De novo variants in PHF21A cause intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures: A case report and literature review."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              Genotype-phenotype relationships for IDDBCS were uncertain, as
              phenotypic variability was observed among patients with the same
              variant (p.Arg580*)
            explanation: >-
              The negative result at the recurrent allele. Quoted rather than
              paraphrased because it bounds what the variant catalog can be used
              to predict.

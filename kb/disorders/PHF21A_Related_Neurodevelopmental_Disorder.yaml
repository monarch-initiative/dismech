discussions:
  - discussion_id: phf21a_dosage_to_transcription
    kind: KNOWLEDGE_GAP
    prompt: >-
      Does heterozygous PHF21A loss actually de-repress LSD1-CoREST target genes
      in human neurons, and which targets account for the craniofacial features
      as distinct from the neurodevelopmental ones?
    attaches_to:
      - pathophysiology#De-repression of LSD1-CoREST Target Genes
      - pathophysiology#Neurodevelopmental and Craniofacial Consequences
    rationale: >-
      Narrowed. An earlier revision of this gap said no cited work measured
      LSD1 target expression in patient cells, which was wrong: PMID:22770980
      measured SCN3A de-repression and reduced LSD1 promoter occupancy in
      lymphoblastoid lines from two translocation patients, and that paper was
      cached in this repository the whole time. The gap that remains is real but
      smaller. Lymphoblastoid cells are not neurons; the measurement is in a
      lineage that does not express the phenotype, at two named targets rather
      than transcriptome-wide, and the magnitude of the effect at half dosage in
      a developing human neuron is still unmeasured.

      The craniofacial half is now partly answered too, and in the same paper.
      Zebrafish phf21a suppression produces craniofacial abnormalities together
      with neuronal apoptosis, and the murine and zebrafish orthologs are
      expressed consistently with a role in craniofacial development. So the
      facial phenotype is no longer reached only by inference from a brain
      expression pattern. What is still missing is the mechanism between them:
      no cited work names a transcriptional target that would produce the facial
      features, and neural crest appears nowhere in the cited evidence. A
      morphant establishes that the gene is needed for craniofacial development;
      it does not say which LSD1-CoREST target genes carry that requirement.
    proposed_experiments:
      - experiment_id: phf21a_patient_neuron_transcriptome
        name: Transcriptome and LSD1 occupancy in PHF21A-heterozygous patient iPSC neurons
        description: >-
          Differentiate neurons from PHF21A-heterozygous patient iPSCs and
          profile expression against isogenic controls, with LSD1 and BHC80
          chromatin occupancy at the de-repressed loci. This measures the
          transcriptional consequence at the right dose, in the right lineage,
          transcriptome-wide - which is the three things the lymphoblastoid
          result does not do.
        would_support:
          - pathophysiology#De-repression of LSD1-CoREST Target Genes
        supporting_outcome:
          - Neuronal LSD1-CoREST targets, SCN3A among them, are expressed above
            isogenic control levels in heterozygous neurons, with reduced LSD1
            occupancy at the same loci.
        refuting_outcome:
          - Heterozygous neurons show no consistent de-repression of LSD1-CoREST
            targets, which would place the pathogenic step somewhere other than
            the transcriptional node this pathograph asserts.
animal_models:
  - name: Zebrafish phf21a morphant
    species: Zebrafish
    genotype: phf21a ortholog suppression (morpholino knockdown)
    publication: PMID:22770980
    description: >-
      Suppression of the zebrafish PHF21A ortholog produces craniofacial
      abnormalities and neuronal apoptosis together - the two arms of the human
      syndrome in one animal. This is the only model evidence in the entry and
      it is the reason the craniofacial arm of the pathograph is not purely
      inferential.
    modeled_mechanisms:
      - target: Neurodevelopmental and Craniofacial Consequences
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: >-
          Reproduces the co-occurrence of craniofacial and neuronal phenotypes
          that defines the human disorder.
        limitations: >-
          Fidelity is LOW for reasons that are not incidental. A morpholino
          knockdown is a transient, dose-uncontrolled suppression and is not the
          stable heterozygous state of the human disease, so it cannot speak to
          the dosage question this entry turns on. Zebrafish craniofacial
          development is not homologous to human facial morphogenesis at the
          level the dysmorphism is described. And neuronal apoptosis is not a
          reported feature of the human disorder - it is a cellular readout in
          the fish, not a recapitulation of intellectual disability.
        evidence:
          - reference: PMID:22770980
            reference_title: "Translocations disrupting PHF21A in the Potocki-Shaffer-syndrome region are associated with intellectual disability and craniofacial anomalies."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              PHF21A encodes a plant homeodomain finger protein whose murine and
              zebrafish orthologs are both expressed in a manner consistent with
              a function in neurofacial and craniofacial development, and
              suppression of the latter led to both craniofacial abnormalities
              and neuronal apoptosis
            explanation: >-
              Both the expression pattern and the loss-of-function result, in one
              sentence. It is the basis for treating the model as informative for
              the craniofacial arm rather than only the neurological one.
diagnosis:
  - name: Molecular Diagnosis by Exome Sequencing
    description: >-
      Diagnosis is molecular and there is no biochemical marker. What matters
      here beyond the sequencing itself is the distinction the entry's scope
      argument rests on: an intragenic PHF21A variant is a different lesion from
      an 11p11.2 deletion, and a deletion is a different lesion again from a
      balanced translocation that disrupts the gene without removing its
      neighbours. Sequencing finds the first; chromosomal microarray finds the
      second and is normal in the third. A patient whose disease is the
      contiguous-gene deletion is not, for the purposes of this entry, a patient
      with this disease.
    diagnosis_term:
      preferred_term: whole exome sequencing
      term:
        id: NCIT:C101295
        label: Whole Exome Sequencing
    evidence:
      - reference: PMID:37528014
        reference_title: "[A case of intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures caused by PHF21A gene variation and review of literature]."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Whole exome sequencing showed a de novo heterogeneous variant, PHF21A
          (NM_001101802.1): c.54+1G>A
        explanation: >-
          Exome sequencing as the diagnostic route in a reported case, with the
          transcript reference the variant is called against.
treatments:
  - name: Vigabatrin for Infantile Spasms
    description: >-
      One reported patient with infantile spasms did not respond to
      adrenocorticotropic hormone and responded well to vigabatrin. This is a
      single observation, not a trial, and it is recorded because it is
      specific: the epilepsy in this disorder is disproportionately infantile
      epileptic spasm syndrome, which is a seizure type with its own drug
      preferences, so the observation is at least aimed at the right target.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: vigabatrin
          term:
            id: CHEBI:63638
            label: vigabatrin
    evidence:
      - reference: PMID:37528014
        reference_title: "[A case of intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures caused by PHF21A gene variation and review of literature]."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a series of spastic seizures with no reaction to adrenocorticotropic
          hormone but a good response to vigabatrin
        explanation: >-
          Graded PARTIAL because it is one patient in a case report. It supports
          the observation having been made; it does not support vigabatrin as an
          established treatment for this disorder.
  - name: Antiseizure Medication
    description: >-
      Seizure control is achieved in a minority of the encephalopathic subset,
      which is the practical reason the epileptic encephalopathy record exists
      separately from the seizure record.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    evidence:
      - reference: PMID:37633153
        reference_title: "De novo variants in PHF21A cause intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures: A case report and literature review."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The seizures of 2 patients (2/5, 40%) were controlled by antiseizure
          medications
        explanation: >-
          Quantifies the response rate in the DEE subset, and quantifies it as a
          minority - which is the clinically consequential half of the finding.

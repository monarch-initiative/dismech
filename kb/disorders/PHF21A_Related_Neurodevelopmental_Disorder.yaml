name: PHF21A Related Neurodevelopmental Disorder
creation_date: "2026-08-28T21:20:00Z"
category: Mendelian
description: >-
  PHF21A-related neurodevelopmental disorder, formally intellectual
  developmental disorder with behavioral abnormalities and craniofacial
  dysmorphism with or without seizures, is an autosomal dominant condition
  caused by heterozygous loss of function in PHF21A. Nearly all reported
  variants are de novo and the mechanism is haploinsufficiency.

  PHF21A encodes BHC80, a component of the LSD1-CoREST histone demethylase
  complex, and its molecular job is an unusual one: its PHD finger reads the
  absence of a modification. It binds unmethylated histone H3 lysine 4, and that
  binding is abolished when H3K4 is methylated. Losing one copy therefore
  degrades the complex's ability to recognise unmodified chromatin and
  de-represses its target genes. PHF21A is highly expressed in fetal brain,
  which is where a dose-sensitive chromatin reader would be expected to matter.
parents:
  - Neurodevelopmental Disorder
synonyms:
  - IDDBCS
  - intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures
  - BHC80-related neurodevelopmental disorder
  - PHF21A haploinsufficiency
disease_term:
  preferred_term: intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures
  term:
    id: MONDO:0032883
    label: intellectual developmental disorder with behavioral abnormalities and craniofacial dysmorphism with or without seizures
notes: >-
  Scope, and it is the call this entry turns on. PHF21A lies at 11p11.2, inside
  the interval deleted in Potocki-Shaffer syndrome, so part of the literature
  describes this phenotype in a contiguous-gene context where several genes are
  missing at once. An entry that drew on that literature indiscriminately would
  attribute features of a multigene deletion to a single gene.

  What makes the single-gene attribution safe here is a specific class of
  evidence: patients whose PHF21A is disrupted by a balanced translocation, and
  patients with heterozygous point mutations. In both, PHF21A is affected and its
  neighbours are not. This entry is built on those, and the Potocki-Shaffer
  deletion literature is used only for context, never as the source of a
  phenotype. This is the same discipline the MBD5 entry needed against the EPC2
  co-deletion.

  Evidence base and frequencies. An earlier revision of this entry said no
  phenotype could carry a frequency because the denominator did not support one.
  That was wrong twice over. The defining cohort publication is cached here as
  full text and its Table 1 is a complete per-patient clinical-features matrix
  for all seven patients; and three later series - 12, 13 and 15 patients - take
  the literature to roughly forty individuals. Frequencies are now recorded, each
  bound to a quote stating a figure for that named phenotype.

  Two limits on those frequencies are worth stating rather than leaving for a
  reader to discover. First, the series overlap: the 12-, 13- and 15-patient
  cohorts are reviews that re-count previously reported patients, so the bands
  are not independent replications and forty is an upper bound on distinct
  individuals, not a count of them. Second, the OCR of Table 1 renders the
  plus-minus columns unambiguously for the neurological rows and ambiguously for
  the digital ones - so the digital anomalies are curated from the conclusion
  sentence with no frequency, rather than from a column that cannot be counted.

  Treatments. Also revised. The earlier note said no cited reference stated a
  protocol quotable exactly; that was true of the two references the entry then
  cited and false of the ones already sitting in this repository. The section now
  records the vigabatrin response in infantile spasms and the response rate to
  antiseizure medication, both graded to the strength of a single case report and
  a small subset respectively. There is still no disease-modifying therapy.

inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Dominant by haploinsufficiency, and overwhelmingly de novo - which is what
      makes recurrence risk low for parents of an affected child but 50% for
      that child's own offspring.
    evidence:
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We have identified seven heterozygous coding mutations, among which
          six are de novo
        explanation: >-
          Establishes both the heterozygous state and the de novo
          predominance - six of seven, which is a proportion rather than a
          rule, and the entry says "overwhelmingly" rather than "always" for
          that reason.
pathophysiology:
  - name: PHF21A Haploinsufficiency
    biological_scale: MOLECULAR
    description: >-
      One functional copy of PHF21A is not enough. The defining cohort's
      variants are frameshifts, a nonsense change and a missense change in the
      AT-hook domain, and six of the seven truncate a C-terminal intrinsically
      disordered region.
    genes:
      - preferred_term: PHF21A
        term:
          id: hgnc:24156
          label: PHF21A
    downstream:
      - target: Impaired Reading of Unmethylated H3K4
    evidence:
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          suggesting that haploinsufficiency is the likely underlying mechanism
          in the phenotype of seven patients
        explanation: >-
          States the mechanism as the authors' inference. The entry keeps their
          hedge - "likely" - rather than promoting it to an established
          mechanism.
  - name: Impaired Reading of Unmethylated H3K4
    biological_scale: MOLECULAR
    description: >-
      BHC80's PHD finger binds histone H3 only when lysine 4 is unmethylated,
      and methylation of H3K4 abolishes that binding. The protein is a reader of
      an absence, which is what makes its dosage sensitivity interesting: half
      as much reader means the unmodified state is recognised less reliably.

      This node is graded IN_VITRO throughout. The binding, the structure and
      the knockdown are all cell and crystal work; no cited source demonstrates
      any of it in patient cells.

      No cell type is annotated, deliberately. Both evidence items are HeLa and
      crystal work, so a neuron annotation here would assert a cell-type scope
      the evidence does not reach. The downstream node carries the neuronal
      claim, where the patient lymphoblastoid data and the fetal-brain
      expression give it a basis.
    downstream:
      - target: De-repression of LSD1-CoREST Target Genes
    evidence:
      - reference: PMID:17687328
        reference_title: "Recognition of unmethylated histone H3 lysine 4 links BHC80 to LSD1-mediated gene repression."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the PHD finger of BHC80 binds unmethylated H3K4 (H3K4me0), and this
          interaction is specifically abrogated by methylation of H3K4
        explanation: >-
          The molecular function this node claims is impaired, stated with its
          specificity - it is the unmethylated state that is read.
      - reference: PMID:17687328
        reference_title: "Recognition of unmethylated histone H3 lysine 4 links BHC80 to LSD1-mediated gene repression."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          BHC80 and LSD1 depend reciprocally on one another to associate with
          chromatin
        explanation: >-
          The reciprocity matters for a dosage argument: less BHC80 does not
          merely remove one subunit's contribution, it impairs LSD1's own
          chromatin association.
  - name: De-repression of LSD1-CoREST Target Genes
    biological_scale: CELLULAR
    description: >-
      Genes normally repressed by the LSD1 complex are expressed when BHC80 is
      reduced. In fetal brain, where PHF21A is highly expressed, that is the
      transcriptional insult the neurodevelopmental phenotype is attributed to.

      The claim is directional, so the annotation is: repression is reduced
      (GO:0000122, DECREASED) rather than transcription being unspecifically
      dysregulated.

      A named target exists and it is a neuronal one. In lymphoblastoid lines
      from two translocation patients, SCN3A is de-repressed and LSD1 occupancy
      at its promoter is reduced - the failure measured at the promoter of the
      gene, in cells from people who have the disease, rather than only in a
      knockdown. SCN3A is a neuronal sodium channel, which is the closest the
      cited evidence comes to connecting this node to the seizure phenotype;
      the entry stops at noting the identity of the gene rather than asserting
      the connection, because nothing cited measures SCN3A in patient neurons or
      relates its expression to seizures in these individuals.
    biological_processes:
      - preferred_term: negative regulation of transcription by RNA polymerase II
        term:
          id: GO:0000122
          label: negative regulation of transcription by RNA polymerase II
        modifier: DECREASED
    downstream:
      - target: Neurodevelopmental and Craniofacial Consequences
    evidence:
      - reference: PMID:17687328
        reference_title: "Recognition of unmethylated histone H3 lysine 4 links BHC80 to LSD1-mediated gene repression."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Knockdown of BHC80 by RNA inhibition results in the de-repression of
          LSD1 target genes
        explanation: >-
          The direct evidence for this node. Note it is a knockdown in cells,
          not a heterozygous state in a patient, so the direction is established
          and the magnitude at half dosage is not.
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          PHF21A is highly expressed in the human fetal brain, which is
          consistent with the neurodevelopmental phenotype
        explanation: >-
          Supplies the expression context that makes a general chromatin
          mechanism land on the brain. Quoted with the authors' own
          "consistent with", which is weaker than a demonstration.
      - reference: PMID:22770980
        reference_title: "Translocations disrupting PHF21A in the Potocki-Shaffer-syndrome region are associated with intellectual disability and craniofacial anomalies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In lymphoblastoid cell lines from two translocation subjects in whom
          PHF21A was directly disrupted by the respective breakpoints, we
          observed derepression of the neuronal gene SCN3A and reduced LSD1
          occupancy at the SCN3A promoter
        explanation: >-
          The strongest evidence for this node, and the only item measured in
          cells from affected people rather than in a knockdown. It gives both
          halves of the mechanism - the de-repression and the reduced LSD1
          occupancy that explains it - at a named neuronal target. Graded
          IN_VITRO because the measurement is in cultured lymphoblastoid lines;
          the cells are patient-derived but the assay is not a clinical
          observation.
  - name: Neurodevelopmental and Craniofacial Consequences
    biological_scale: ORGANISM
    description: >-
      The clinical syndrome: intellectual disability with behavioural
      abnormalities and craniofacial dysmorphism, with seizures, hypotonia and
      autism in a substantial share of patients.

      Two groups of phenotypes hang off this node with a weaker claim than the
      neurological ones, and the node does not pretend otherwise. Postnatal
      overgrowth and the digital anomalies are established as features of the
      disorder and are attributable to PHF21A by the same translocation and
      point-mutation logic as the rest, but nothing cited connects either to the
      transcriptional mechanism upstream. Their edges assert that they are part
      of the syndrome, not that this pathograph explains them.
    downstream:
      - target: phenotypes#Intellectual Disability
      - target: phenotypes#Autism
      - target: phenotypes#Seizure
      - target: phenotypes#Hypotonia
      - target: phenotypes#Abnormal Facial Shape
      - target: phenotypes#Delayed Speech and Language Development
      - target: phenotypes#Global Developmental Delay
      - target: phenotypes#Atypical Behavior
      - target: phenotypes#Attention Deficit Hyperactivity Disorder
      - target: phenotypes#Epileptic Encephalopathy
      - target: phenotypes#Postnatal Overgrowth
      - target: phenotypes#Tapered Finger
      - target: phenotypes#Clinodactyly
      - target: phenotypes#Syndactyly
    evidence:
      - reference: PMID:31649809
        reference_title: "Disruption of PHF21A causes syndromic intellectual disability with craniofacial anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our results extend the phenotypic spectrum of PHF21A mutations by
          adding autism spectrum disorder, epilepsy, hypotonia, and
          neurobehavioral problems
        explanation: >-
          Names four of the six phenotypes reached from this node, and does so
          for point-mutation patients rather than deletion patients - which is
          what makes them attributable to PHF21A alone.

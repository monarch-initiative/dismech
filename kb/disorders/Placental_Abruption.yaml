parents:
- Placental disease
- Obstetric hemorrhage
- Ischemic placental disease
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1000.0
  notes: >
    Roughly 1% of pregnancies; the denominator is pregnancies, not the general
    population, so this figure is a per-pregnancy occurrence rate. Worth noting
    against the common impression of abruption as a preterm catastrophe: nearly
    half of all abruptions occur at term.
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental abruption complicates about 1% of pregnancies and is a leading cause of vaginal bleeding in the latter half of pregnancy."
    explanation: States the approximate per-pregnancy occurrence rate.
  - reference: PMID:37164498
    reference_title: "Placental abruption at near-term and term gestations: pathophysiology, epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruption occurs in 0.6% to 1.2% of all pregnancies, with nearly half of abruption occurring at term gestations."
    explanation: Gives a tighter occurrence range and the gestational-age distribution, roughly half at term.
- population: Nordic countries and United States
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 380.0
  rate_high: 1000.0
  notes: >
    Reported range 0.38-0.51% in the Nordic countries versus 0.6-1.0% in the
    USA, indicating real geographic variation in either incidence or
    ascertainment.
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence is lower in the Nordic countries (0.38-0.51%) compared with the USA (0.6-1.0%)."
    explanation: Gives the region-stratified prevalence range.
clinical_burden:
  burden_level: HIGH
  rationale: >
    Abruption is a disproportionate contributor to adverse perinatal outcome
    relative to its frequency, accounting for around a tenth of preterm births
    and up to a fifth of perinatal deaths in developed countries, with maternal
    mortality several-fold above baseline.
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In developed countries, approximately 10% of all preterm births and 10-20% of all perinatal deaths are caused by placental abruption."
    explanation: Quantifies the population-level contribution of abruption to preterm birth and perinatal death.
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal death is rare but seven times higher than the overall maternal mortality rate."
    explanation: Quantifies excess maternal mortality.
pathophysiology:
- name: Decidual Vasculopathy and Spiral Artery Failure
  role: trigger
  biological_scale: TISSUE
  description: >
    Shallow extravillous trophoblast invasion leaves the maternal spiral
    arteries incompletely converted into low-resistance, high-capacity vessels.
    The retained muscular, high-resistance vasculature produces chronic
    uteroplacental ischemia and predisposes the decidual vascular bed to
    atherosis, thrombosis and necrosis. This is the shared upstream lesion of
    ischemic placental disease, which is why abruption, preeclampsia and fetal
    growth restriction cluster in the same pregnancies.
  cell_types:
  - preferred_term: extravillous trophoblast
    term:
      id: CL:0008036
      label: extravillous trophoblast
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  locations:
  - preferred_term: uterine spiral artery
    term:
      id: UBERON:0015171
      label: uterine spiral artery
  downstream:
  - target: Decidual Hemorrhage and Retroplacental Hematoma Formation
    description: >
      Chronically ischemic, structurally abnormal decidual vessels are prone to
      rupture, which is the initiating event of the hematoma.
    evidence:
    - reference: PMID:19720393
      reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Shallow trophoblast invasion impedes decidual vascular conversion, producing an inadequate uteroplacental blood flow that elicits abruption-related placental ischemia."
      explanation: Places failed spiral artery conversion upstream of abruption-related ischemia.
  evidence:
  - reference: PMID:39641171
    reference_title: "Ischemic Placental Disease: Epidemiology and Impact on Maternal and Offspring Health Along the Life Course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The unifying pathophysiological mechanism that precedes all 3 complications is uteroplacental ischemia as a consequence of inadequate (or failure of) physiological transformation of the maternal uterine spiral arteries, endothelial cell dysfunction, and increased oxidative stress."
    explanation: Identifies failed spiral artery transformation as the shared upstream mechanism of abruption within ischemic placental disease.
  - reference: PMID:19897298
    reference_title: "Diagnosis of placental abruption: relationship between clinical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic lesions included chronic deciduitis, decidual necrosis, decidual vasculopathy, placental infarctions, villous mal-development (delayed or accelerated maturation), hemosiderin deposition, intervillous thrombus, and chronic villitis."
    explanation: Documents decidual vasculopathy and decidual necrosis among the chronic lesions profiled in clinically diagnosed abruption.
- name: Decidual Hemorrhage and Retroplacental Hematoma Formation
  role: central_effector
  biological_scale: TISSUE
  description: >
    Rupture of a diseased decidual vessel bleeds into the decidua basalis. The
    accumulating blood dissects along the plane between the placental basal
    plate and the uterine wall, forming a retroplacental hematoma whose
    expansion progressively levers the placenta away from its attachment. The
    same process occurring in the decidua parietalis produces a retrochorionic
    hematoma. Bleeding may track down to the cervix and present as vaginal
    bleeding, or remain concealed behind the placenta.
  cell_types:
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  locations:
  - preferred_term: decidua basalis
    term:
      id: UBERON:0000453
      label: decidua basalis
  downstream:
  - target: Placental Separation and Loss of Exchange Surface
    description: >
      The expanding hematoma occupies a closed space and mechanically strips
      the placenta from the uterine wall.
    evidence:
    - reference: PMID:19897298
      reference_title: "Diagnosis of placental abruption: relationship between clinical and histopathological findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pathological criteria for abruption diagnosis included hematoma, fibrin deposition, compressed villi, and hemosiderin-laden histiocytes in cases with older hematomas."
      explanation: Compressed villi adjacent to hematoma are the histological signature of the hematoma mechanically displacing placental tissue.
  - target: Decidual Tissue Factor Exposure and Thrombin Generation
    description: >
      Hemorrhage into the decidua brings plasma factor VII into contact with
      the very high constitutive tissue factor of decidual cells.
    evidence:
    - reference: PMID:21040617
      reference_title: "Novel insights into molecular mechanisms of abruption-induced preterm birth."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Abruptions are associated with excess thrombin generated from decidual-cell-expressed tissue factor."
      explanation: Directly links the decidual hemorrhage of abruption to excess thrombin generation.
  evidence:
  - reference: PMID:21890016
    reference_title: "Abruption-associated prematurity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic, subacute decidual hemorrhage (ie, abruptio placenta and retrochorionic hematoma formation) is an important contributor to preterm parturition."
    explanation: Identifies decidual hemorrhage with hematoma formation as the core lesion.
- name: Placental Separation and Loss of Exchange Surface
  role: effector
  biological_scale: TISSUE
  description: >
    Mechanical separation removes functional villous surface from maternal
    perfusion. Because the fetus depends entirely on intervillous blood flow
    for oxygen, loss of exchange area translates directly into fetal
    hypoxemia, and the fraction of placenta detached is the main determinant
    of fetal outcome.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  downstream:
  - target: Fetal Hypoxic-Ischemic Injury
    description: >
      Loss of gas-exchange surface produces acute fetal hypoxemia, with the
      detached fraction determining severity.
    evidence:
    - reference: PMID:17012465
      reference_title: "Placental abruption."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Abruption involving more than 50% of the placenta is frequently associated with fetal death."
      explanation: Establishes the dose-response between separated placental area and fetal death.
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maternal effect of abruption depends primarily on its severity, whereas its effect on the fetus is determined both by its severity and the gestational age at which it occurs."
    explanation: Separates the maternal and fetal determinants of outcome after placental separation.
- name: Decidual Tissue Factor Exposure and Thrombin Generation
  role: amplifier
  biological_scale: MOLECULAR
  description: >
    Decidual cells express the highest levels of tissue factor of any cell type
    at the maternal-fetal interface, a constitutive hemostatic envelope that
    normally protects against bleeding during trophoblast invasion and
    delivery. When hemorrhage occurs, that same tissue factor binds plasma
    factor VII and generates thrombin in large excess. Thrombin then acts
    through protease-activated receptors as a signaling molecule rather than
    only as a clotting enzyme, which is what converts a local bleed into
    preterm labor, membrane rupture, and systemic coagulopathy.
  cell_types:
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  biological_processes:
  - preferred_term: blood coagulation, extrinsic pathway
    term:
      id: GO:0007598
      label: blood coagulation, extrinsic pathway
    modifier: INCREASED
  - preferred_term: thrombin-activated receptor signaling pathway
    term:
      id: GO:0070493
      label: thrombin-activated receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Thrombin-Driven Myometrial Contraction and Membrane Weakening
    description: >
      Thrombin signals through protease-activated receptors on myometrium and
      decidua to drive contraction and matrix degradation.
    evidence:
    - reference: PMID:21890016
      reference_title: "Abruption-associated prematurity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Such hemorrhage induces thrombin from decidual tissue factor, which plays a pivotal role in the development of preterm premature rupture of membranes and preterm delivery by acting through protease-activated receptors to promote the production of pro-inflammatory cytokines, and matrix-degrading metalloproteinases."
      explanation: Specifies the PAR-mediated route from decidual thrombin to membrane rupture and preterm delivery.
  - target: Consumptive Coagulopathy and Maternal Hemorrhagic Shock
    description: >
      Sustained thrombin generation consumes fibrinogen and clotting factors,
      producing the profound hypofibrinogenemia characteristic of severe
      abruption.
    evidence:
    - reference: PMID:19720393
      reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The extent of thrombin generation due to DC-expressed TF is indicated by the profound hypofibrinogenemia attendant severe abruption"
      explanation: Links the magnitude of decidual thrombin generation to the consumptive hypofibrinogenemia of severe abruption.
  evidence:
  - reference: PMID:19720393
    reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the cell types at the maternal fetal interface at term, TF expression is highest in decidual cells indicating that this TF meets the hemostatic demands of labor and delivery."
    explanation: Establishes decidual cells as the dominant tissue factor source at the maternal-fetal interface.
  - reference: PMID:19720393
    reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In human pregnancy, decidual cell-expressed TF prevents decidual hemorrhage (abruption)."
    explanation: States the normal protective role of decidual tissue factor, the physiology that abruption subverts.
- name: Thrombin-Driven Myometrial Contraction and Membrane Weakening
  role: amplifier
  biological_scale: CELLULAR
  description: >
    Thrombin generated by the hematoma is a direct uterotonic. It activates
    PAR1 on myometrial cells, driving contraction both by direct myosin light
    chain phosphorylation and indirectly by inducing prostaglandin synthesis.
    In parallel, thrombin upregulates decidual matrix metalloproteinases and
    interleukin-8, recruiting neutrophils whose proteases degrade the
    collagen-rich amnion and choriodecidua. The two arms together explain the
    painful uterine hypertonus of acute abruption and the strong association of
    abruption with preterm labor and preterm premature rupture of membranes.
  cell_types:
  - preferred_term: myometrial cell
    term:
      id: CL:0002366
      label: myometrial cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: uterine smooth muscle contraction
    term:
      id: GO:0070471
      label: uterine smooth muscle contraction
    modifier: INCREASED
  - preferred_term: prostaglandin biosynthetic process
    term:
      id: GO:0001516
      label: prostaglandin biosynthetic process
    modifier: INCREASED
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  locations:
  - preferred_term: myometrium
    term:
      id: UBERON:0001296
      label: myometrium
  evidence:
  - reference: PMID:32365105
    reference_title: "Mechanisms of thrombin-Induced myometrial contractions: Potential targets of progesterone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histologic studies of placental abruption, as a representative intrauterine bleeding, revealed that thrombin was expressed within the infiltrating hemorrhage and that thrombin receptor (protease-activated receptor 1, PAR1) was highly expressed in myometrial cells surrounding the hemorrhage"
    explanation: >
      Localizes thrombin to the abruption hemorrhage and PAR1 to the adjacent
      myometrium in human tissue, the anatomical basis of the uterotonic effect.
      Classified HUMAN_CLINICAL rather than IN_VITRO because this specific
      finding comes from histology of human abruption specimens; the cultured
      myometrial cell experiments from the same paper are curated separately as
      IN_VITRO.
  - reference: PMID:32365105
    reference_title: "Mechanisms of thrombin-Induced myometrial contractions: Potential targets of progesterone."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "thrombin induces myometrial contractions by two mechanisms, including direct activation of myosin and indirect increases in prostaglandin synthesis"
    explanation: Defines the two parallel routes by which thrombin drives myometrial contraction.
  - reference: PMID:19720393
    reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thrombin acts as an autocrine/paracrine mediator that degrades these ECMs by augmenting decidual cell expression of: 1) matrix metalloproteinases and 2) interleukin-8, a key mediator of abruption-associated decidual infiltration of neutrophils, which express several ECM degrading proteases."
    explanation: Specifies the MMP and IL-8/neutrophil route from thrombin to fetal membrane matrix degradation.
  - reference: PMID:31955792
    reference_title: "Thrombin-Induced Decidual Colony-Stimulating Factor-2 Promotes Abruption-Related Preterm Birth by Weakening Fetal Membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thrombin enhanced CSF-2 secretion in TDC cultures fourfold (P < 0.05); MPA reduced this effect."
    explanation: Adds a thrombin-induced decidual CSF-2 paracrine arm to fetal membrane weakening.
- name: Consumptive Coagulopathy and Maternal Hemorrhagic Shock
  role: consequence
  biological_scale: ORGANISM
  description: >
    Sustained thrombin generation plus release of placental procoagulant
    material consumes fibrinogen, platelets and clotting factors faster than
    they are replaced, producing disseminated intravascular coagulation. This
    converts a local placental problem into systemic maternal hemorrhage.
    Because a substantial share of the blood loss can be concealed behind the
    placenta, visible bleeding underestimates the true deficit and the degree
    of shock is often out of proportion to what is seen.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal risks include obstetric hemorrhage, need for blood transfusions, emergency hysterectomy, disseminated intravascular coagulopathy and renal failure."
    explanation: Enumerates the maternal consequences of the consumptive coagulopathy and hemorrhage.
- name: Fetal Hypoxic-Ischemic Injury
  role: consequence
  biological_scale: ORGANISM
  description: >
    Acute reduction in placental gas exchange produces fetal hypoxemia,
    acidemia and a non-reassuring heart rate pattern. If separation is
    extensive or delivery is delayed, the result is perinatal asphyxia with
    intraventricular hemorrhage, periventricular leukomalacia and cerebral
    palsy in survivors, or intrauterine fetal death.
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  evidence:
  - reference: PMID:21890016
    reference_title: "Abruption-associated prematurity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting neonates exhibit increased rates of perinatal asphyxia, intraventricular hemorrhage, periventricular leukomalacia, cerebral palsy and mortality, compared with age-matched controls."
    explanation: Enumerates the hypoxic-ischemic sequelae in surviving neonates.
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perinatal consequences include low birthweight, preterm delivery, asphyxia, stillbirth and perinatal death."
    explanation: Lists the perinatal outcomes attributable to abruption.
mechanistic_hypotheses:
- hypothesis_group_id: chronic_ischemic_placental_disease
  hypothesis_label: Abruption as the end-stage of chronic ischemic placental disease
  status: CANONICAL
  description: >
    Under this model abruption is not an acute accident but the terminal event
    of a chronic uteroplacental vascular disease that begins with failed spiral
    artery transformation early in pregnancy. Supporting evidence includes the
    excess of chronic decidual lesions in abruption placentas, the elevated
    abruption risk conferred by bleeding earlier in pregnancy, and the
    co-clustering of abruption with preeclampsia and fetal growth restriction.
  evidence:
  - reference: PMID:16513243
    reference_title: "Evidence of placental abruption as a chronic process: associations with vaginal bleeding early in pregnancy and placental lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians widely regard placental abruption as an acute event, though accumulating data point towards abruption being the end-result of chronic processes early in pregnancy, and perhaps even extending to conception."
    explanation: States the chronic-process model directly.
  - reference: PMID:16513243
    reference_title: "Evidence of placental abruption as a chronic process: associations with vaginal bleeding early in pregnancy and placental lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the increased risk associated with placental lesions, especially chronic inflammatory lesions, even in the absence of early vaginal bleeding, suggests that prolonged inflammation may be implicated in placental abruption"
    explanation: Provides the histological argument that chronic inflammation precedes abruption independent of early bleeding.
  - reference: PMID:37164498
    reference_title: "Placental abruption at near-term and term gestations: pathophysiology, epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discuss the interaction of chronic processes (decidual and uteroplacental vasculopathy) and acute processes (shearing forces applied to the abdomen) that underlie the pathophysiology."
    explanation: >
      States the two-component model explicitly, and is the reason this entry
      keeps both the chronic decidual vasculopathy trigger and the acute
      mechanical arm captured under abdominal trauma. The chronic model is not
      a replacement for the acute one; abruption arises where a chronically
      fragile decidual bed meets an acute insult.
phenotypes:
- name: Antepartum Hemorrhage
  category: Clinical
  description: >
    Vaginal bleeding after 20 weeks of gestation, classically dark and
    non-clotting. Bleeding may be concealed behind the placenta, so visible
    blood loss can badly underestimate the true deficit.
  phenotype_term:
    preferred_term: Antepartum hemorrhage
    term:
      id: HP:0025328
      label: Antepartum hemorrhage
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental abruption complicates about 1% of pregnancies and is a leading cause of vaginal bleeding in the latter half of pregnancy."
    explanation: Establishes antepartum vaginal bleeding as the cardinal presenting feature.
- name: Placental Separation
  category: Clinical
  description: >
    Premature detachment of the placenta from the uterine wall before delivery,
    the defining lesion of the disorder.
  phenotype_term:
    preferred_term: Placental abruption
    term:
      id: HP:0011419
      label: Placental abruption
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental abruption, classically defined as a premature separation of the placenta before delivery, is one of the leading causes of vaginal bleeding in the second half of pregnancy."
    explanation: Provides the definitional statement of premature placental separation.
- name: Abdominal Pain
  category: Clinical
  description: >
    Abdominal and back pain accompanying the bleeding, arising from the
    distending retroplacental hematoma and from thrombin-driven uterine
    contraction. Pain is the feature that most usefully separates abruption
    from placenta previa at the bedside.
  phenotype_term:
    preferred_term: Abdominal pain
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: PMID:37164498
    reference_title: "Placental abruption at near-term and term gestations: pathophysiology, epidemiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestations of abruption typically include vaginal bleeding and abdominal pain with a wide variety of abnormal fetal heart rate patterns."
    explanation: Names abdominal pain as a typical clinical manifestation alongside bleeding and abnormal fetal heart rate patterns.
- name: Uterine Hypertonicity
  category: Clinical
  description: >
    Painful, tetanically contracted uterus, classically described as
    board-like in severe abruption. Mechanistically this is the myometrial
    consequence of thrombin acting on PAR1 rather than simply a response to
    pain. Deliberately left without an ontology binding: HPO has no term for
    uterine hypertonus or tetanic uterine contraction, and binding to a
    generic pain or contraction term would be less accurate than leaving it
    unbound.
  evidence:
  - reference: PMID:19897298
    reference_title: "Diagnosis of placental abruption: relationship between clinical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vaginal bleeding accompanied by nonreassuring fetal status or uterine hypertonicity"
    explanation: Quotes the clinical diagnostic criterion naming uterine hypertonicity alongside bleeding.
- name: Non-Reassuring Fetal Status
  category: Clinical
  description: >
    Abnormal fetal heart rate patterns reflecting acute reduction in placental
    gas exchange, ranging through decelerations to a Category III tracing or
    absent fetal heart tones. Present on admission in the large majority of
    abruptions that go on to cause cerebral palsy.
  phenotype_term:
    preferred_term: Fetal distress
    term:
      id: HP:0025116
      label: Fetal distress
  evidence:
  - reference: PMID:19897298
    reference_title: "Diagnosis of placental abruption: relationship between clinical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vaginal bleeding accompanied by nonreassuring fetal status or uterine hypertonicity"
    explanation: Quotes the clinical diagnostic criterion naming non-reassuring fetal status alongside bleeding.
  - reference: PMID:22805996
    reference_title: "Clinical features of abruptio placentae as a prominent cause of cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these 28 women, 22 (79%) exhibited non-reassuring fetal status on admission to obstetric facilities"
    explanation: Quantifies how often non-reassuring fetal status is already present at presentation in abruptions that cause cerebral palsy.
- name: Back Pain
  category: Clinical
  description: >
    Back pain accompanying or replacing abdominal pain, characteristic of a
    posteriorly implanted placenta where the hematoma is not palpable
    anteriorly and the presentation is easily mistaken for musculoskeletal
    pain.
  phenotype_term:
    preferred_term: Back pain
    term:
      id: HP:0003418
      label: Back pain
  evidence:
  - reference: PMID:22805996
    reference_title: "Clinical features of abruptio placentae as a prominent cause of cerebral palsy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "strong abdominal pain and/or profuse vaginal bleeding occurred 159 ± 99 min prior to admission to an obstetric facility"
    explanation: >
      Documents severe truncal pain as the presenting symptom preceding
      admission. Marked PARTIAL because the source specifies abdominal pain;
      the back-pain presentation of posterior abruption is clinical convention
      rather than a quantified finding in this cohort.
- name: Cerebral Palsy
  category: Clinical
  description: >
    Permanent motor disability in surviving neonates following intrapartum
    hypoxic-ischemic injury. Abruption is not merely one cause among many
    here: in a national review of hypoxia-attributed cerebral palsy it was the
    single largest identifiable contributor, which is the strongest available
    argument for treating abruption as a neurological as well as an obstetric
    emergency.
  phenotype_term:
    preferred_term: Cerebral palsy
    term:
      id: HP:0100021
      label: Cerebral palsy
  evidence:
  - reference: PMID:22805996
    reference_title: "Clinical features of abruptio placentae as a prominent cause of cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruptio placenta was responsible for 28 (26%) of the 107 CP infants, and was the single leading causative factor of CP."
    explanation: Quantifies abruption as the leading identifiable cause of hypoxia-attributed cerebral palsy in a national review.
- name: Preterm Premature Rupture of Membranes
  category: Clinical
  description: >
    Rupture of the fetal membranes before 37 weeks and before labor onset.
    This is the direct clinical readout of the entry's own thrombin-driven
    membrane-weakening mechanism, and the relationship is bidirectional:
    PPROM is both a consequence of decidual hemorrhage and a listed risk
    factor for subsequent abruption.
  phenotype_term:
    preferred_term: Preterm premature rupture of membranes
    term:
      id: HP:6000310
      label: Preterm premature rupture of membranes
  evidence:
  - reference: PMID:31955792
    reference_title: "Thrombin-Induced Decidual Colony-Stimulating Factor-2 Promotes Abruption-Related Preterm Birth by Weakening Fetal Membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm premature rupture of membranes (PPROM) and thrombin generation by decidual cell-expressed tissue factor often accompany abruptions."
    explanation: States the co-occurrence of PPROM with abruption and decidual thrombin generation.
  - reference: PMID:16251427
    reference_title: "Mechanisms of abruption-induced premature rupture of the fetal membranes: thrombin-enhanced interleukin-8 expression in term decidua."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruptions were associated with a marked decidual neutrophil infiltration that peaked after PPROM, whereas decidua from gestational age-matched controls were virtually devoid of neutrophils."
    explanation: Links abruption to PPROM through decidual neutrophil infiltration, with a gestational-age-matched control comparison.
- name: Preterm Birth
  category: Clinical
  description: >
    Delivery before 37 weeks, both spontaneous (thrombin-driven preterm labor
    and membrane rupture) and iatrogenic (emergency delivery for maternal or
    fetal compromise). Abruption accounts for roughly a tenth of all preterm
    births in developed countries.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In developed countries, approximately 10% of all preterm births and 10-20% of all perinatal deaths are caused by placental abruption."
    explanation: Supports the association between abruption and preterm delivery at population scale.
  - reference: PMID:31955792
    reference_title: "Thrombin-Induced Decidual Colony-Stimulating Factor-2 Promotes Abruption-Related Preterm Birth by Weakening Fetal Membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm premature rupture of membranes (PPROM) and thrombin generation by decidual cell-expressed tissue factor often accompany abruptions."
    explanation: Links abruption to preterm premature rupture of membranes as a route to preterm birth.
- name: Disseminated Intravascular Coagulation
  category: Clinical
  description: >
    Consumptive coagulopathy driven by massive decidual tissue factor exposure,
    the principal cause of severe maternal morbidity in abruption.
  phenotype_term:
    preferred_term: Disseminated intravascular coagulation
    term:
      id: HP:0005521
      label: Disseminated intravascular coagulation
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal risks include obstetric hemorrhage, need for blood transfusions, emergency hysterectomy, disseminated intravascular coagulopathy and renal failure."
    explanation: Lists disseminated intravascular coagulopathy among the maternal risks of abruption.
- name: Acute Kidney Injury
  category: Clinical
  description: >
    Acute kidney injury from the combination of hypovolemia, hypoperfusion and
    microvascular fibrin deposition during severe abruption. Bound to the acute
    term rather than the generic renal-insufficiency parent, since the injury
    here is characteristically abrupt and hemodynamic.
  phenotype_term:
    preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal risks include obstetric hemorrhage, need for blood transfusions, emergency hysterectomy, disseminated intravascular coagulopathy and renal failure."
    explanation: Lists renal failure among the maternal risks of abruption.
- name: Stillbirth
  category: Clinical
  description: >
    Intrauterine fetal death from acute placental insufficiency; abruption is
    among the leading identifiable causes of stillbirth. Deliberately left
    without an ontology binding because the HPO term for stillbirth
    (HP:0003826) sits outside the HP:0000118 phenotypic-abnormality subtree
    that the PhenotypeTerm dynamic enum is reachable from, so it cannot
    currently be bound here.
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perinatal consequences include low birthweight, preterm delivery, asphyxia, stillbirth and perinatal death."
    explanation: Lists stillbirth among the perinatal consequences of abruption.
- name: Neonatal Asphyxia
  category: Clinical
  description: >
    Perinatal asphyxia with severe acidemia in the delivered neonate, the
    immediate physiological expression of the interrupted gas exchange.
    Umbilical arterial pH in abruption-related cerebral palsy averages well
    below 6.8, at the extreme end of what is survivable.
  phenotype_term:
    preferred_term: Neonatal asphyxia
    term:
      id: HP:0012768
      label: Neonatal asphyxia
  evidence:
  - reference: PMID:22805996
    reference_title: "Clinical features of abruptio placentae as a prominent cause of cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had neonates with umbilical cord arterial blood pH (base excess) of 6.728 ± 0.164"
    explanation: Quantifies the depth of neonatal acidemia in abruption-related cerebral palsy.
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perinatal consequences include low birthweight, preterm delivery, asphyxia, stillbirth and perinatal death."
    explanation: Lists asphyxia among the perinatal consequences of abruption.
- name: Low Birth Weight
  category: Clinical
  description: >
    Reduced birthweight reflecting both prematurity and the chronic
    uteroplacental insufficiency that precedes abruption. Bound to the closest
    available HPO concept, Small for gestational age, since HPO has no distinct
    low-birthweight phenotype term.
  phenotype_term:
    preferred_term: Small for gestational age
    term:
      id: HP:0001518
      label: Small for gestational age
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perinatal consequences include low birthweight, preterm delivery, asphyxia, stillbirth and perinatal death."
    explanation: Lists low birthweight among the perinatal consequences of abruption.
histopathology:
- name: Retroplacental Hematoma with Compressed Villi
  description: >
    The histological signature of abruption is a retroplacental hematoma with
    adjacent fibrin deposition and compressed villi; in older lesions,
    hemosiderin-laden histiocytes mark the age of the bleed.
  evidence:
  - reference: PMID:19897298
    reference_title: "Diagnosis of placental abruption: relationship between clinical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathological criteria for abruption diagnosis included hematoma, fibrin deposition, compressed villi, and hemosiderin-laden histiocytes in cases with older hematomas."
    explanation: States the histopathological diagnostic criteria for abruption.
- name: Chronic Decidual Lesions
  description: >
    Beyond the acute hematoma, abruption placentas carry an excess of chronic
    lesions including chronic deciduitis, decidual necrosis, decidual
    vasculopathy and placental infarction, supporting the chronic ischemic
    disease model.
  evidence:
  - reference: PMID:19897298
    reference_title: "Diagnosis of placental abruption: relationship between clinical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic lesions included chronic deciduitis, decidual necrosis, decidual vasculopathy, placental infarctions, villous mal-development (delayed or accelerated maturation), hemosiderin deposition, intervillous thrombus, and chronic villitis."
    explanation: Enumerates the chronic histological lesions profiled in clinical abruption.
- name: Couvelaire Uterus
  description: >
    Uteroplacental apoplexy: in the most severe abruptions blood extravasates
    into and through the myometrium and out to the broad ligament or
    peritoneum, giving the uterus a blue-purple discoloration. The clinical
    significance is that a myometrium infiltrated with blood contracts poorly,
    which is how a placental problem becomes intractable postpartum hemorrhage
    and, sometimes, the reason for emergency hysterectomy.
  evidence:
  - reference: PMID:35880101
    reference_title: "Multimodal postpartum imaging of a severe case of Couvelaire uterus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical abruption represents a spectrum from mild to the most severe form, in which blood can extravasate into or through the myometrium, the broad ligament, or the peritoneum, causing the uterus and surrounding structures to take on a blue discoloration."
    explanation: Describes the Couvelaire uterus as the severe end of the abruption spectrum, defined by myometrial blood extravasation.
- name: Decidual Neutrophil Infiltration
  description: >
    Marked neutrophil infiltration of the decidua, co-localizing with fibrin
    deposition and peaking after membrane rupture. The control comparison is
    what makes this finding compelling: gestational-age-matched control decidua
    is essentially free of neutrophils, so this is not a background feature of
    late gestation but a specific consequence of decidual hemorrhage. It is the
    histological footprint of the thrombin-to-IL-8 arm of the mechanism.
  evidence:
  - reference: PMID:16251427
    reference_title: "Mechanisms of abruption-induced premature rupture of the fetal membranes: thrombin-enhanced interleukin-8 expression in term decidua."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruptions were associated with a marked decidual neutrophil infiltration that peaked after PPROM, whereas decidua from gestational age-matched controls were virtually devoid of neutrophils."
    explanation: Documents the neutrophil infiltrate with an explicit gestational-age-matched control comparison.
  - reference: PMID:16251427
    reference_title: "Mechanisms of abruption-induced premature rupture of the fetal membranes: thrombin-enhanced interleukin-8 expression in term decidua."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutrophil infiltrates co-localized with fibrin deposition."
    explanation: Establishes the spatial association between the neutrophil infiltrate and fibrin, linking the inflammatory and coagulation arms.
- name: Maternal Vascular Malperfusion (Amsterdam Terminology)
  description: >
    The chronic-arm signature on placental examination: decidual arteriopathy
    and atherosis, accelerated villous maturation, infarcts and retroplacental
    hemorrhage. Reporting these under the Amsterdam Placental Workshop Group
    consensus terminology is what makes abruption histology comparable across
    centres, and the absence of such a standard is part of why the
    epidemiological literature is so heterogeneous.
  evidence:
  - reference: PMID:27223167
    reference_title: "Sampling and Definitions of Placental Lesions: Amsterdam Placental Workshop Group Consensus Statement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The terminology and microscopic descriptions for maternal vascular malperfusion, fetal vascular malperfusion, delayed villous maturation, patterns of ascending intrauterine infection, and villitis of unknown etiology were agreed upon."
    explanation: Establishes maternal vascular malperfusion as a consensus-defined lesion category applicable to abruption placentas.
diagnosis:
- name: Clinical Diagnosis of Abruption
  description: >
    Abruption is a clinical diagnosis based on vaginal bleeding, uterine
    hypertonicity or tenderness, and non-reassuring fetal status. Imaging is
    confirmatory at best: a normal ultrasound does not exclude abruption
    because fresh retroplacental blood is often isoechoic with placenta.
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of abruption is a clinical one, and ultrasonography and the Kleihauer-Betke test are of limited value."
    explanation: States that abruption is diagnosed clinically and that ultrasound and Kleihauer-Betke testing have limited diagnostic value.
  - reference: PMID:12164566
    reference_title: "Clinical utility of sonography in the diagnosis and treatment of placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the sensitivity, specificity, and positive and negative predictive values of sonography were 24%, 96%, 88%, and 53%, respectively"
    explanation: Quantifies the poor sensitivity but high specificity of ultrasound, which is why a negative scan cannot exclude abruption.
  - reference: PMID:12164566
    reference_title: "Clinical utility of sonography in the diagnosis and treatment of placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sonography is not sensitive for detection of placental abruption, but a positive finding is associated with more aggressive management and worse neonatal outcome."
    explanation: States the asymmetric diagnostic value of ultrasound, useful when positive and uninformative when negative.
biochemical:
- name: Fibrinogen
  notes: >
    The single most useful laboratory marker in abruption, and the one whose
    interpretation is most often got wrong. Pregnancy roughly doubles baseline
    fibrinogen, so a value inside the ordinary non-pregnant reference interval
    is already abnormally low in a bleeding obstetric patient. Because decidual
    tissue factor drives sustained thrombin generation, fibrinogen is consumed
    early, which makes it both a diagnostic marker of consumptive coagulopathy
    and the best available predictor of progression to severe hemorrhage.
  reference_ranges:
  - lower_bound: 4.0
    unit: g/L
    population: third-trimester pregnancy
    notes: >
      One-sided by design: the clinically meaningful question in obstetric
      hemorrhage is how far fibrinogen has fallen, not whether it is elevated.

      Boundary caveat. The source states its thresholds as strictly greater
      than 4 g/L and less than or equal to 2 g/L, whereas interpretation_bands
      use half-open intervals with an inclusive lower bound and an exclusive
      upper bound. The conventions therefore disagree at exactly two values: as
      encoded, 4.0 falls in the reassuring band and 2.0 falls in the middle
      band, whereas the source would place 4.0 outside its high-NPV group and
      2.0 inside its 100%-PPV group. At those two exact values follow the
      source, not the band edge. The bands are deliberately not nudged to force
      agreement, since that would require boundary numbers that appear nowhere
      in the literature.

      No loinc_term is bound because this project has no configured LOINC
      adapter, so a LOINC code could not be verified against an authoritative
      source. Per the guidance that a precise descriptor with no term beats a
      plausible but unverified one, the code is omitted rather than guessed;
      adding a LOINC adapter to conf/oak_config.yaml would let this be filled
      in properly.
    evidence:
    - reference: PMID:17087729
      reference_title: "The decrease of fibrinogen is an early predictor of the severity of postpartum hemorrhage."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The negative predictive value of a fibrinogen concentration >4 gL(-1) was 79% and the positive predictive value of a concentration <or=2 gL(-1) was 100%."
      explanation: >
        Anchors the 4 g/L threshold as the level above which severe hemorrhage
        becomes unlikely. Marked PARTIAL because the cohort is postpartum
        hemorrhage generally rather than abruption specifically, though
        abruption is a major cause of the consumptive coagulopathy studied.
    interpretation_bands:
    - name: Reassuring
      lower_bound: 4.0
      unit: g/L
      abnormal_flag: NORMAL
      interpretation: >
        Severe hemorrhage unlikely; negative predictive value about 79% in the
        source cohort.
    - name: Falling, consumption underway
      lower_bound: 2.0
      upper_bound: 4.0
      unit: g/L
      abnormal_flag: LOW
      severity: MODERATE
      interpretation: >
        Within or below the non-pregnant reference interval and therefore
        inappropriately low for pregnancy; indicates active consumption and
        rising risk of severe hemorrhage.
    - name: Critical consumptive coagulopathy
      upper_bound: 2.0
      unit: g/L
      abnormal_flag: CRITICAL_LOW
      severity: SEVERE
      interpretation: >
        Positive predictive value for severe postpartum hemorrhage was 100% at
        or below this level in the source cohort; mandates immediate fibrinogen
        replacement.
  evidence:
  - reference: PMID:17087729
    reference_title: "The decrease of fibrinogen is an early predictor of the severity of postpartum hemorrhage."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In multivariate analysis, from H0 to H4, fibrinogen was the only marker associated with the occurrence of severe PPH."
    explanation: >
      Establishes fibrinogen as the only independently predictive coagulation
      marker. PARTIAL because the cohort is obstetric hemorrhage broadly rather
      than abruption alone.
  - reference: PMID:19720393
    reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The extent of thrombin generation due to DC-expressed TF is indicated by the profound hypofibrinogenemia attendant severe abruption"
    explanation: Ties the hypofibrinogenemia specifically to decidual tissue factor-driven thrombin generation in abruption.
- name: Kleihauer-Betke Test
  notes: >
    Quantifies fetomaternal hemorrhage by counting fetal cells in the maternal
    circulation. Its value in abruption is not diagnostic but dosimetric: it is
    used in Rh-negative patients to size the anti-D immune globulin dose. As a
    diagnostic test for abruption itself it performs poorly.
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of abruption is a clinical one, and ultrasonography and the Kleihauer-Betke test are of limited value."
    explanation: States the limited diagnostic value of the Kleihauer-Betke test in abruption.
clinical_trials:
- name: NCT05840471
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >
    Double-blind multicenter randomized trial of tranexamic acid in pregnant
    women with abruptio placenta, n=116. One of very few interventional trials
    with abruption itself as the enrolling condition.
  target_phenotypes:
  - preferred_term: Antepartum hemorrhage
    term:
      id: HP:0025328
      label: Antepartum hemorrhage
  evidence:
  - reference: clinicaltrials:NCT05840471
    reference_title: "Tranexamic Acid in Pregnant Women With Abruptio Placenta: A Double-blind, Multicenter Randomized Clinical Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruptio placenta is one of the common causes of antepartum haemorrhage which is more common in the second half of pregnancy and causes a high maternal and neonatal morbidity and mortality"
    explanation: Trial rationale, confirming abruption-associated antepartum hemorrhage as the target condition.
- name: NCT00186069
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >
    Randomized double-blind trial of magnesium sulfate tocolysis versus
    intravenous saline for suspected placental abruption, n=30. Small, but
    directly addresses the contested question of whether tocolysis is safe in
    suspected abruption.
  target_phenotypes:
  - preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  evidence:
  - reference: clinicaltrials:NCT00186069
    reference_title: "Randomized, Double Blind Trial of Magnesium Sulfate Tocolysis Versus Intravenous Saline for Suspected Placental Abruption"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To evaluate the safety and efficacy of magnesium sulfate for preterm suspected abruption."
    explanation: States the trial objective, magnesium sulfate in suspected preterm abruption.
- name: NCT03782168
  status: TERMINATED
  description: >
    Prospective study of plasma micro-particles and angiogenic markers as
    biomarkers of placental abruption. Terminated after enrolling a single
    participant. Curated deliberately as a negative result: together with
    NCT01279369 it is direct evidence that biomarker-based abruption
    prediction has a track record of failing to recruit or complete, which is
    part of why no validated predictive test exists.
  evidence:
  - reference: clinicaltrials:NCT03782168
    reference_title: "Plasma Concentration of Biological Markers in Placental Abruption"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary outcome variables will include the total number of micro-particles, the number of micro-particles from each cell line (platelet, placental, endothelial etc.), and protein markers"
    explanation: Documents the biomarker-prediction aim of this terminated study.
- name: NCT01279369
  status: TERMINATED
  description: >
    Study of cervicovaginal fetal fibronectin to predict preterm delivery due
    to abruption after minor maternal trauma. Terminated after enrolling three
    participants.
  evidence:
  - reference: clinicaltrials:NCT01279369
    reference_title: "The Use of Fetal Fibronectin (fFN) in Predicting Preterm Delivery Due to Abruptio Placenta in Patients With Minor Maternal Trauma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to determine if the presence of fetal fibronectin in the cervicovaginal secretions of pregnant patients with minor maternal trauma predicts impending preterm delivery due to abruptio placenta."
    explanation: Documents the predictive-biomarker aim of this terminated study.
- name: NCT02299414
  phase: PHASE_IV
  status: COMPLETED
  description: >
    The CHAP trial, n=2408: antihypertensive treatment of mild chronic
    hypertension in pregnancy. Relevant here as prevention rather than
    treatment, since chronic hypertension is among the strongest graded
    abruption risk factors and CHAP tested whether treating it changes
    placental outcomes.
  evidence:
  - reference: clinicaltrials:NCT02299414
    reference_title: "A Pragmatic Multicenter Randomized Clinical Trial (RCT) of Antihypertensive Therapy for Mild Chronic Hypertension During Pregnancy: Chronic Hypertension and Pregnancy (CHAP) Project"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate whether a blood pressure treatment strategy during pregnancy to achieve targets that are recommended for non-pregnant reproductive-age adults"
    explanation: >
      States the trial objective of tighter blood-pressure control in
      pregnancy. PARTIAL because abruption is a component outcome rather than
      the primary endpoint, so this supports the prevention rationale rather
      than an abruption-specific treatment effect.
stages:
- name: Sher Class 0
  description: >
    Asymptomatic. The retroplacental clot is found only on inspection of the
    placenta after delivery, with no antenatal clinical suspicion. Corresponds
    to partial or marginal separation.
  notes: >
    Sher grading (equivalently the older Page 0-3 scheme) is the conventional
    severity classification. It is curated here as ordered severity stages
    rather than as subtypes, because the classes are a graded continuum of one
    process rather than mechanistically distinct entities. No evidence items
    are attached to the stage definitions: the originating paper, Sher G, "A
    rational basis for the management of abruptio placentae", J Reprod Med
    1978 (PMID:722694), has no abstract indexed in PubMed, so no snippet can be
    verified against a cached reference. Rather than fabricate a quote or
    attribute the grading to a secondary source that merely restates it, the
    citation is recorded in the top-level references block and the stage
    descriptions are left unevidenced.
- name: Sher Class 1
  description: >
    Mild. Minimal or absent vaginal bleeding, slight uterine tenderness, normal
    maternal vital signs, no coagulopathy and no fetal distress. Corresponds to
    partial or marginal separation.
- name: Sher Class 2
  description: >
    Moderate. None-to-moderate vaginal bleeding, significant uterine tenderness
    with tetanic contractions, maternal tachycardia with orthostatic change,
    hypofibrinogenemia, and fetal distress with a living fetus. Corresponds to
    more complete or central separation.
- name: Sher Class 3
  description: >
    Severe. Minimal-to-heavy bleeding, board-like tetanic uterus, maternal
    shock, overt coagulopathy, and fetal death. Corresponds to complete or
    central separation.
genetic:
- name: No Mendelian gene
  notes: >
    Stated affirmatively rather than left blank: placental abruption has no
    Mendelian form, no OMIM phenotype entry, and no gene with definitive
    ClinGen gene-disease validity. Susceptibility is polygenic and, unusually,
    involves two genomes, since maternal and fetal/placental genotypes both
    contribute. An empty genetic block would otherwise read as an uncurated
    section rather than a real negative finding.
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:29884306
    reference_title: "Genetic variations and risk of placental abruption: A genome-wide association study and meta-analysis of genome-wide association studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accumulating epidemiological evidence points to strong genetic susceptibility to placental abruption (PA). However, characterization of genes associated with PA remains incomplete."
    explanation: Establishes that genetic susceptibility exists but that no gene characterization is complete, supporting the absence of a causal Mendelian gene.
- name: F5
  notes: >
    Factor V Leiden. Heterozygous FVL is significantly associated with
    placental abruption in the TREATS meta-analysis (Figure 9, z = 2.12,
    p = 0.03). The homozygous subgroup is not significant, but that estimate
    rests on three cases and is not evidence against the heterozygous
    association. Screening caveat, which is about clinical utility rather than
    about the validity of the association: thrombophilia panels are not
    recommended for placenta-mediated pregnancy complications, so this entry
    records FVL as a susceptibility factor without implying that testing for it
    is indicated.
  gene_term:
    preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:16595080
    reference_title: "Screening for thrombophilia in high-risk situations: systematic review and cost-effectiveness analysis. The Thrombosis: Risk and Economic Assessment of Thrombophilia Screening (TREATS) study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant risks for individual thrombophilic defects were also established for early, recurrent and late pregnancy loss; preeclampsia; placental abruption; and intrauterine growth restriction."
    explanation: States that significant abruption risk was established for individual thrombophilic defects in this meta-analysis.
  - reference: PMID:16595080
    reference_title: "Screening for thrombophilia in high-risk situations: systematic review and cost-effectiveness analysis. The Thrombosis: Risk and Economic Assessment of Thrombophilia Screening (TREATS) study."

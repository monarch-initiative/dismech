        label: magnesium sulfate
  evidence:
  - reference: clinicaltrials:NCT00186069
    reference_title: "Randomized, Double Blind Trial of Magnesium Sulfate Tocolysis Versus Intravenous Saline for Suspected Placental Abruption"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "To evaluate the safety and efficacy of magnesium sulfate for preterm suspected abruption."
    explanation: >
      Documents magnesium sulfate being formally trialled in suspected preterm
      abruption. Marked PARTIAL because the trial tested tocolysis rather than
      the neuroprotective indication, and enrolled only 30 participants.
- name: Tranexamic Acid
  description: >
    Antifibrinolytic adjunct for obstetric hemorrhage. Mechanistically coherent
    here, since the coagulopathy of abruption involves fibrinolysis alongside
    factor consumption, but the abruption-specific evidence base is a single
    small trial and the effect should not be overstated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Consumptive Coagulopathy and Maternal Hemorrhagic Shock
    treatment_effect: INHIBITS
    description: >
      Inhibits fibrinolysis, opposing the breakdown of what clot remains during
      consumptive coagulopathy.
  evidence:
  - reference: clinicaltrials:NCT05840471
    reference_title: "Tranexamic Acid in Pregnant Women With Abruptio Placenta: A Double-blind, Multicenter Randomized Clinical Trial"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruptio placenta is one of the common causes of antepartum haemorrhage which is more common in the second half of pregnancy and causes a high maternal and neonatal morbidity and mortality"
    explanation: >
      Trial rationale for tranexamic acid in abruption. PARTIAL because this
      quotes the enrolling rationale rather than a reported treatment effect.
- name: Induction of Labor and Vaginal Delivery
  description: >
    Where fetal demise has already occurred, or where the mother is stable and
    the fetus is not compromised, vaginal delivery is the preferred route.
    Aggressive correction of coagulopathy accompanies it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Induction of Labor
    term:
      id: NCIT:C92814
      label: Induction of Labor
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cases where fetal demise has occurred, vaginal delivery is preferable."
    explanation: States the preferred delivery route after fetal demise.
- name: Emergency Hysterectomy
  description: >
    Last-resort surgical control of uncontrollable postpartum hemorrhage,
    sometimes required after severe abruption with a Couvelaire uterus that
    will not contract. Carries permanent loss of fertility.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Hysterectomy
    term:
      id: NCIT:C15256
      label: Hysterectomy
  evidence:
  - reference: PMID:21241259
    reference_title: "Placental abruption: epidemiology, risk factors and consequences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal risks include obstetric hemorrhage, need for blood transfusions, emergency hysterectomy, disseminated intravascular coagulopathy and renal failure."
    explanation: Documents emergency hysterectomy as a recognised maternal outcome and intervention in abruption.
- name: Expectant Management with Surveillance
  description: >
    In selected stable cases remote from term, or at term with reassuring
    maternal and fetal status, expectant management with close monitoring and
    readiness for rapid delivery is reasonable. Management is individualised by
    severity and gestational age rather than protocolised. In practice the
    window bought by expectant management is used to give antenatal
    corticosteroids and, before early preterm delivery, magnesium sulfate for
    fetal neuroprotection. Tocolysis is controversial and generally avoided
    when there is fetal compromise.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management of abruption should be individualized on a case-by-case basis depending on the severity of the abruption and the gestational age at which it occurs."
    explanation: States the individualised management principle.
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abruption at extremely preterm gestations may be managed conservatively in selected stable cases, with close monitoring and rapid delivery should deterioration occur"
    explanation: Supports conservative management with surveillance in selected stable preterm cases.
discussions:
- discussion_id: gap_abruption_no_high_quality_risk_factor_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can any risk factor for placental abruption be established at class I or II
    evidence, given that a formal umbrella review of the entire meta-analytic
    literature graded every candidate as class III or weaker?
  rationale: >-
    This is the single most important epistemic caveat attached to this entry.
    The effect sizes curated in the environmental section are real and
    reproducible, but the umbrella review that formally graded them found no
    factor reaching high-quality evidence. Every risk-factor estimate here
    should therefore be read as suggestive rather than established. A
    contributing cause is the absence of a uniform case definition across the
    epidemiological literature, which makes cohorts non-comparable.
  attaches_to:
  - pathophysiology#Decidual Vasculopathy and Spiral Artery Failure
  evidence:
  - reference: PMID:35365209
    reference_title: "The environmental risk factors prior to conception associated with placental abruption: an umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no risk factor in the present umbrella review with the high level of evidence (class I or II)."
    explanation: States the negative finding directly.
  - reference: PMID:35365209
    reference_title: "The environmental risk factors prior to conception associated with placental abruption: an umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the current meta-analytic associations cannot disentangle the complex etiology of placental abruption mainly due to their low quality of evidence"
    explanation: States that the aetiology cannot be resolved from the current evidence base.
  - reference: PMID:40140972
    reference_title: "Independent risk factors for placental abruption: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, methodological inconsistencies and publication bias in the current studies may affect the reliability of the meta-analysis results."
    explanation: Independently flags methodological inconsistency and publication bias in the same literature.
- discussion_id: gap_abruption_gwas_single_ancestry
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the suggestive ABCC8/KCNJ11, ADAM12, CTNND2, ZNF28 and IRX1 associations
    replicate at genome-wide significance in ancestries other than the Peruvian
    cohorts in which they were discovered, and does any have a demonstrable
    functional consequence?
  rationale: >-
    All curated susceptibility loci come from a single-ancestry study and are
    suggestive rather than genome-wide significant. None has a demonstrated
    molecular mechanism. Transferability to other ancestries is unestablished,
    so these should not be treated as validated susceptibility genes.
  attaches_to:
  - pathophysiology#Decidual Vasculopathy and Spiral Artery Failure
  evidence:
  - reference: PMID:29884306
    reference_title: "Genetic variations and risk of placental abruption: A genome-wide association study and meta-analysis of genome-wide association studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants of the Placental Abruption Genetic Epidemiology (PAGE) study, a population based case-control study of PA conducted in Lima, Peru"
    explanation: Establishes the single-ancestry Peruvian source population of the discovery cohort.
- discussion_id: gap_abruption_no_antenatal_diagnostic_test
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can any antenatal test identify placental abruption reliably enough to
    change management, given that ultrasound has roughly 24% sensitivity and no
    externally validated prediction model exists?
  rationale: >-
    Abruption remains a clinical diagnosis of exclusion in real time. The
    consequence is that the condition is frequently recognised only once fetal
    compromise is already present, which places a hard ceiling on how much
    outcome improvement is achievable through earlier intervention. A
    sensitive antenatal test would be the highest-value advance in this
    disease.
  attaches_to:
  - pathophysiology#Decidual Hemorrhage and Retroplacental Hematoma Formation
  evidence:
  - reference: PMID:12164566
    reference_title: "Clinical utility of sonography in the diagnosis and treatment of placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sonography is not sensitive for detection of placental abruption, but a positive finding is associated with more aggressive management and worse neonatal outcome."
    explanation: Documents the insensitivity of the only widely available antenatal imaging test.
- discussion_id: mismatch_abruption_no_animal_model_of_trophoblast_invasion
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can the decidual mechanism of abruption be modelled in any non-human
    species, given that the depth of extravillous trophoblast invasion and the
    extent of the decidualization reaction seen in humans are not reproduced in
    standard laboratory animals?
  rationale: >-
    The upstream lesion of this entry is failure of deep trophoblast-mediated
    spiral artery conversion, a process whose human form is unusually extensive
    among species with hemochorial placentation. Model organisms therefore
    cannot reproduce the trigger node, which is why essentially all mechanistic
    evidence in this entry comes from human tissue and human decidual cell
    culture rather than in vivo models. A separate constraint is that mice lack
    a CXCL8/IL-8 ortholog, so the thrombin to IL-8 to neutrophil arm of
    membrane weakening cannot be modelled directly in mouse.
  attaches_to:
  - pathophysiology#Decidual Vasculopathy and Spiral Artery Failure
  - pathophysiology#Thrombin-Driven Myometrial Contraction and Membrane Weakening
  evidence:
  - reference: PMID:19720393
    reference_title: "Involvement of human decidual cell-expressed tissue factor in uterine hemostasis and abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among species with a hemochorial placenta, human endometrium exhibits the most extensive DZ reaction and human EVT are the most intrinsically invasive"
    explanation: >
      States that the human decidualization reaction and trophoblast
      invasiveness exceed those of other hemochorial species, which is the
      basis of the model-organism limitation.
differential_diagnoses:
- name: Placenta Previa
  description: >
    The other major cause of antepartum hemorrhage. Previa classically produces
    painless bright red bleeding with a soft uterus, whereas abruption produces
    painful bleeding with a tender, hypertonic uterus. The decisive practical
    difference is imaging: previa is reliably identified by transvaginal
    ultrasound, whereas ultrasound has roughly 24% sensitivity for abruption,
    so a normal scan effectively rules out previa but not abruption. Note that
    previa is also a risk factor for abruption, so the two are not mutually
    exclusive.
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placenta previa, placenta accreta, and vasa previa are important causes of bleeding in the second half of pregnancy and in labor."
    explanation: Establishes placenta previa as a competing cause of second-half-of-pregnancy bleeding, the differential-diagnosis relationship.
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnostic modality of choice for placenta previa is transvaginal ultrasonography"
    explanation: >
      Documents that previa is reliably diagnosed by ultrasound, in contrast to
      abruption, which is the practical basis for discriminating the two.
- name: Vasa Previa
  description: >
    A rarer cause of antepartum bleeding in which unprotected fetal vessels
    cross the membranes over the cervical os. Distinguished from abruption by
    the fact that the blood lost is fetal rather than maternal, so even modest
    volumes cause rapid fetal exsanguination without maternal instability.
  evidence:
  - reference: PMID:16582134
    reference_title: "Placenta previa, placenta accreta, and vasa previa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placenta previa, placenta accreta, and vasa previa are important causes of bleeding in the second half of pregnancy and in labor."
    explanation: Establishes vasa previa as a competing cause of second-half-of-pregnancy bleeding.
notes: >
  Ontology note: MONDO:0004846 currently carries the definition "Vaginal
  bleeding preceding the 20th week of gestation" (inherited from NCIT:P378),
  which is incorrect. Abruption is separation of a normally implanted placenta
  in the second half of pregnancy; bleeding before 20 weeks is classified as
  threatened or spontaneous abortion. The HPO definition for HP:0011419
  ("Separation of the placenta from the uterus wall before delivery") is
  correct, as is the Tikkanen definition quoted in this entry. This
  discrepancy should be reported upstream to MONDO.

  Curation note on Xogenesis: the terminal output of the core mechanism is the
  formation of a pathological anatomical structure, the retroplacental
  hematoma, at UBERON:0000453 decidua basalis. In the OGMS framing this is an
  OGMS:0000078 pathological anatomical structure arising by OGMS:0000081
  pathological derivation, process genus OGMS:0000061. No MPATH species term is
  recorded, as MPATH is deprecated for this project. If a hematoma-forming
  mechanism module is later factored out, this entry is a candidate conformer
  alongside the existing thrombogenesis module.

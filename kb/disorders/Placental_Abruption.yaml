- name: Magnesium Sulfate for Fetal Neuroprotection
  description: >
    Magnesium sulfate given before anticipated early preterm delivery to reduce
    the risk of cerebral palsy, and separately trialled as a tocolytic in
    suspected abruption. Given that abruption is the single leading identifiable
    cause of hypoxia-attributed cerebral palsy, the neuroprotective indication
    is unusually well aligned with this disease's dominant fetal harm.

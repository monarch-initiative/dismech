- name: Prior Cesarean Delivery
  influences_mechanisms:
  - target: Decidual Vasculopathy and Spiral Artery Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A uterine scar supports poorer decidualisation and placentation at the
      implantation site in a later pregnancy. The effect is modest and the
      mediating step is not established in the cited meta-analysis.
    evidence:
    - reference: PMID:29360829
      reference_title: "Long-term risks and benefits associated with cesarean delivery for mother, baby, and subsequent pregnancies: Systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "and placental abruption (OR 1.38, 1.27 to 1.49; n = 5,667,160; 6 studies)"
      explanation: >-
        Reports an odds ratio of 1.38 for abruption after prior caesarean
        delivery across more than five million pregnancies, a modest but
        precisely estimated association.
  description: >
    A previous cesarean delivery raises abruption risk in subsequent
    pregnancies, alongside larger increases in placenta previa and placenta
    accreta, consistent with a scarred, abnormally decidualized implantation
    bed.
  evidence:

      explanation: >-
        Reports a relative risk of 4.55 for abruption with cocaine use, the
        strongest exposure association in this entry.
  description: >
    Cocaine produces acute vasoconstriction and hypertensive surges. It carries
    the largest reported effect size of any graded risk factor in the umbrella

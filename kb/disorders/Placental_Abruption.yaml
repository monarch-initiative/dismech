- name: Abdominal Trauma
  influences_mechanisms:
  - target: Decidual Hemorrhage and Retroplacental Hematoma Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The one mechanically distinct cause in this entry. Blunt force shears
      the relatively inelastic placenta away from the elastic uterine wall,
      tearing decidual vessels directly, so it produces the hematoma without
      any preceding vasculopathy.
    evidence:
    - reference: PMID:17012465
      reference_title: "Placental abruption."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Risk factors for abruption include prior abruption, smoking, trauma, cocaine use, multifetal gestation, hypertension, preeclampsia, thrombophilias, advanced maternal age, preterm premature rupture of the membranes, intrauterine infections, and hydramnios."
      explanation: >-
        Names trauma among the established risk factors for abruption, the
        direct mechanical route to decidual haemorrhage.
  description: >
    Blunt abdominal trauma, including motor vehicle collisions and intimate
    partner violence, shears the elastic uterus against the relatively
    inelastic placenta.
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors for abruption include prior abruption, smoking, trauma, cocaine use, multifetal gestation, hypertension, preeclampsia, thrombophilias, advanced maternal age, preterm premature rupture of the membranes, intrauterine infections, and hydramnios."
    explanation: Lists trauma among the established risk factors for abruption.
- name: Hypertensive Disorders of Pregnancy
  influences_mechanisms:
  - target: Decidual Vasculopathy and Spiral Artery Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Preeclampsia and abruption share defective spiral artery remodelling as
      a substrate, so hypertensive disease marks a placenta already
      predisposed rather than acting as an external insult.
    evidence:
    - reference: PMID:17012465
      reference_title: "Placental abruption."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Risk factors for abruption include prior abruption, smoking, trauma, cocaine use, multifetal gestation, hypertension, preeclampsia, thrombophilias, advanced maternal age, preterm premature rupture of the membranes, intrauterine infections, and hydramnios."
      explanation: >-
        Names hypertension and preeclampsia among the established risk factors
        for abruption.
  description: >
    Chronic hypertension and preeclampsia both raise abruption risk,
    consistent with the shared decidual vascular lesion of ischemic placental
    disease.
  evidence:
  - reference: PMID:17012465
    reference_title: "Placental abruption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk factors for abruption include prior abruption, smoking, trauma, cocaine use, multifetal gestation, hypertension, preeclampsia, thrombophilias, advanced maternal age, preterm premature rupture of the membranes, intrauterine infections, and hydramnios."
    explanation: Lists hypertension and preeclampsia among the established risk factors for abruption.
- name: Prior Abruption
  influences_mechanisms:
  - target: Decidual Vasculopathy and Spiral Artery Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Not an exposure at all but a marker of persisting susceptibility: a
      previous abruption reveals an underlying vascular predisposition that
      remains present in the next pregnancy. Recorded because recurrence risk
      is the single strongest predictor in this entry.
    evidence:
    - reference: PMID:38366767
      reference_title: "Placental abruption: Incidence and risk of recurrence in subsequent pregnancies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Rates of abruption in the second birth among individuals with and without previous placental abruption were 3.35% and 0.66%, respectively"
      explanation: >-
        Reports abruption in 3.35% of second births after a previous abruption
        versus 0.66% without, a fivefold recurrence indicating persistent
        susceptibility rather than a repeated exposure.
  description: >
    A previous abruption is among the strongest predictors of recurrence,
    consistent with a persistent underlying maternal vascular phenotype rather
    than a one-off accident. Recurrence risk is roughly five-fold, which is the
    single most important piece of evidence for the chronic-disease rather than
    accident model, and the basis for counselling in a subsequent pregnancy.
  evidence:

- name: Antenatal Corticosteroid Therapy
  description: >
    Betamethasone or dexamethasone given for fetal lung maturation when preterm
    delivery is anticipated and the maternal-fetal condition permits a delay.
    This is the main reason to attempt expectant management at all in a stable
    preterm abruption, since the fetal benefit of the steroid course has to be
    weighed against the risk of the separation extending.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

progression:
- phase: Long-term maternal cerebrovascular risk
  age_range: Years to decades after the affected pregnancy
  notes: >
    Abruption is followed by elevated long-term maternal cerebrovascular risk,
    paralleling the pattern already recognised after preeclampsia. As with
    preeclampsia, this records the association without asserting that the acute
    abruption itself causes the later stroke; shared antecedent vascular
    susceptibility is an equally consistent explanation.
  evidence:
  - reference: PMID:31420459
    reference_title: "Cerebrovascular disease after placental abruption: A population-based prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abruption was associated with increased rates of nonfatal ischemic stroke (HR 1.4, 95% CI 1.1-1.7) and hemorrhagic stroke (HR 1.4, 95% CI 1.1-1.9)."
    explanation: >
      Reports the effect sizes for both stroke subtypes in a Danish population
      cohort. Notably the hazard ratio is the same for ischemic and hemorrhagic
      stroke, which argues for a systemic vascular diathesis rather than a
      specifically thrombotic one.
  - reference: PMID:31420459
    reference_title: "Cerebrovascular disease after placental abruption: A population-based prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disruption of the hemostatic system manifesting as ischemia and hemorrhage may indicate shared etiologies between abruption and cerebrovascular complications."
    explanation: >
      States the shared-etiology interpretation, supporting the framing of this
      progression item as an association rather than a causal sequela.
treatments:
- name: Emergency Cesarean Delivery
  description: >
    Prompt cesarean delivery is indicated when there is maternal or fetal
    compromise at a viable gestational age. Delivery removes the source of both
    the hemorrhage and the procoagulant load. Where fetal demise has already
    occurred, vaginal delivery is preferred.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Emergency Cesarean Delivery
    term:
      id: NCIT:C92772
      label: Emergency Cesarean Delivery
  target_mechanisms:
  - target: Placental Separation and Loss of Exchange Surface
    treatment_effect: INHIBITS
    description: >

  exposure_term:
    preferred_term: exposure to cocaine
    term:
      id: ECTO:9000265
      label: exposure to cocaine
  influences_mechanisms:
  - target: Decidual Vasculopathy and Spiral Artery Failure
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cocaine is thought to reach this node through acute vasoconstriction and
      hypertensive surges in the uteroplacental circulation, but nothing in this
      entry evidences that intermediate, so it is marked unknown on the same
      standard applied to smoking here. Its relative risk is the largest of the
      exposures in this entry.

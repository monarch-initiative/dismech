    snippet: "Positive sonographic findings were univariately associated with 2- to 3-fold greater subsequent tocolysis, betamethasone use, duration of hospitalization, follow-up sonograms, preterm delivery, low birth weight, and neonatal intensive care unit admission."
    explanation: >
      Documents betamethasone administration as part of real-world management

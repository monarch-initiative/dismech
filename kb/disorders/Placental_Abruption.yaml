environmental:
- name: Cigarette Smoking
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  influences_mechanisms:
  - target: Decidual Vasculopathy and Spiral Artery Failure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Smoking roughly doubles risk and is thought to act through chronic
      vasoconstriction and decidual ischaemia, but the cited evidence is
      epidemiological and identifies no mediating step. Its population impact
      is large because exposure is common, not because the individual effect
      is.
    evidence:
    - reference: PMID:10214847
      reference_title: "Incidence of placental abruption in relation to cigarette smoking and hypertensive disorders during pregnancy: a meta-analysis of observational studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Smoking was associated with a 90% increase in the risk of placental abruption"
      explanation: >-
        Reports a 90% increase in abruption risk with smoking, an
        epidemiological association without a demonstrated mechanism.
  description: >
    Maternal smoking is the best-quantified modifiable risk factor for
    abruption, plausibly acting through vasoconstriction and chronic decidual
    ischemia and necrosis. It is notable for a large population attributable
    fraction and for super-additive interaction with hypertensive disorders of
    pregnancy, the cleanest documented exposure-exposure interaction in this
    disease.
  evidence:
  - reference: PMID:10214847
    reference_title: "Incidence of placental abruption in relation to cigarette smoking and hypertensive disorders during pregnancy: a meta-analysis of observational studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Smoking was associated with a 90% increase in the risk of placental abruption"
    explanation: Quantifies the smoking-abruption association in a meta-analysis of 13 studies.
  - reference: PMID:10214847
    reference_title: "Incidence of placental abruption in relation to cigarette smoking and hypertensive disorders during pregnancy: a meta-analysis of observational studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pooled population attributable risk percentage for each stratum ranged between 15% and 25%, implying that 15-25% of placental abruption episodes are attributable to cigarette smoking."
    explanation: Quantifies the population attributable fraction of abruption due to smoking.
  - reference: PMID:10214847
    reference_title: "Incidence of placental abruption in relation to cigarette smoking and hypertensive disorders during pregnancy: a meta-analysis of observational studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the presence of smoking, the risk of abruption was further increased due to chronic hypertension, mild or severe preeclampsia, or chronic hypertension with superimposed preeclampsia."
    explanation: Documents interaction between smoking and hypertensive disorders of pregnancy on abruption risk.
  - reference: PMID:35365209
    reference_title: "The environmental risk factors prior to conception associated with placental abruption: an umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "maternal smoking (OR 1.80, 95% CI 1.75-1.85)"
    explanation: Gives the umbrella-review pooled effect size for maternal smoking, graded class III (suggestive).

    reference_title: "Clinically relevant mouse models of Charcot-Marie-Tooth type 2S."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Phenotypic characterization of the homozygous models found progressive peripheral motor and sensory axonal degeneration."
    explanation: Direct demonstration of axonal degeneration in CMT2S models.
  - reference: PMID:25568292
    reference_title: "Recessive truncating IGHMBP2 mutations presenting as axonal sensorimotor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had a predominantly axonal sensorimotor neuropathy with subsequent muscle atrophy, but without obvious sensory symptoms."
    explanation: Human electrophysiological and clinical correlate.
- name: Neuromuscular Junction Denervation and Distal Muscle Atrophy
  description: >
    Loss of motor axons denervates neuromuscular junctions, causing neurogenic distal muscle
    atrophy, weakness, foot deformity and gait impairment. In compound heterozygous
    Ighmbp2 D564N/H922Y mice NMJ denervation and reduced fibre area are marked, whereas the
    CMT2S-like H922Y homozygote shows minimal NMJ changes even at six months; patient-derived
    neuromuscular co-cultures show high fatigue and chaotic tetanus that are rescued by
    restoring IGHMBP2.
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Length-Dependent Nerve Fiber Dysfunction"
  biological_processes:
  - preferred_term: neuromuscular junction development
    term:
      id: GO:0007528
      label: neuromuscular junction development
    modifier: ABNORMAL
  downstream:
  - target: Distal muscle weakness
    causal_link_type: DIRECT
  - target: Distal amyotrophy
    causal_link_type: DIRECT
  - target: Foot dorsiflexor weakness
    causal_link_type: DIRECT

- name: ABT1 augmentation (preclinical)
  description: >-
    Intracerebroventricular scAAV9-Abt1 extended median survival from 19 to 22 days at the lower tested
    dose and reduced NMJ denervation in FVB-nmd SMARD1 mice. It did not increase full-length IGHMBP2 protein
    or correct splicing. Purified-protein assays support stimulation of residual helicase activity, although
    IGHMBP2-independent effects were not excluded. Benefit in CMT2S remains a hypothesis.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy

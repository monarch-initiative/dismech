    directness: INDIRECT
clinical_trials:
- name: NCT05152823
  phase: PHASE_I
  status: ENROLLING_BY_INVITATION
  description: >-
    Phase I/IIa open-label, single-group trial of one intrathecal AAV9-IGHMBP2 dose. The ClinicalTrials.gov
    record updated 2026-10-30 lists enrolling by invitation, ages 2 months to 14 years and estimated enrollment
    of 10. The schema phase field records phase I; the registry also lists phase II. Trial registration
    does not establish clinical efficacy.
  evidence:
  - reference: clinicaltrials:NCT05152823
    reference_title: "Phase I/IIa Intrathecal Gene Delivery Clinical Trial for IGHMBP2-Related Diseases"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Open-label, single intrathecal injection study of a AAV9 vector carrying the IGHMBP2 gene for IGHMBP2-related diseases."
    explanation: Trial registration summary.
diagnosis:
- name: Molecular genetic testing for biallelic IGHMBP2 variants
  description: >
    IGHMBP2 screening is recommended for early-onset, sporadic or autosomal recessive axonal
    CMT2, and should not be withheld in the absence of respiratory symptoms.
  evidence:
  - reference: PMID:28065684
    reference_title: "IGHMBP2-related clinical and genetic features in a cohort of Chinese Charcot-Marie-Tooth disease type 2 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, mutation screening of IGHMBP2 should be especially considered in AR-CMT2 and sporadic CMT2 patients."
    explanation: Testing recommendation.
  - reference: PMID:25568292
    reference_title: "Recessive truncating IGHMBP2 mutations presenting as axonal sensorimotor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in IGHMBP2 should be considered in the molecular genetic workup of patients with hereditary sensorimotor neuropathies, even in the absence of respiratory symptoms."
    explanation: Extends testing to patients without respiratory involvement.
- name: Nerve conduction studies
  description: Nerve conduction studies establish the predominantly axonal sensorimotor pattern; this electrophysiological classification is not specific to IGHMBP2.
  evidence:
  - reference: PMID:28202949
    reference_title: "Clinical diversity caused by novel IGHMBP2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients presented with childhood-onset axonal predominant sensorimotor polyneuropathies"
    explanation: Electrophysiological classification.
- name: Recognition of acute Guillain-Barre-like presentations
  description: >-
    Two IGHMBP2-affected siblings had acute motor and sensory axonal neuropathy, cauda equina enhancement
    and elevated CSF protein. The authors considered superimposed immune neuropathy in one case after
    an initial IVIG response; the report does not prove that every acute finding was caused solely by
    the inherited neuropathy.
  evidence:
  - reference: PMID:41468720
    reference_title: "Phenotypic continuum in IGHMBP2-related disorders: a portfolio of cases from typical to Guillain-Barré syndrome-like presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 3 and 4, two siblings, presented with a Guillain-Barré syndrome-like phenotype, cauda equina enhancement on spinal neuroimaging, elevated cerebrospinal fluid protein, and electromyography revealing acute motor and sensory axonal neuropathy."
    explanation: Atypical presentation relevant to diagnosis.
  - reference: PMID:41468720
    reference_title: "Phenotypic continuum in IGHMBP2-related disorders: a portfolio of cases from typical to Guillain-Barré syndrome-like presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite an initial response to intravenous immunoglobulin, previous symptoms in Case 3 led to consideration of an immune-mediated neuropathy superimposed on a genetic background.
    explanation: Preserves the authors’ acquired-neuropathy interpretation.
- name: Genome and RNA analysis for unresolved splice alleles
  description: >-
    A deep intronic IGHMBP2 allele was identified by genome sequencing and its pseudoexon effect confirmed
    in patient cells. These methods can resolve splice defects beyond coding-region testing; they are
    not a population screening assay.
  evidence:
  - reference: PMID:40060931
    reference_title: Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We confirmed the previously identified IGHMBP2 cryptic splice site variant in the patient’s DNA, noncoding variant c.1235 + 894C>A, deep in intron 8.
    explanation: Whole-genome confirmation of the intronic allele in patient cells.
  - reference: PMID:40060931
    reference_title: Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The consequence of this variant is incorporation of a pseudoexon and loss of open reading frame, leading to NMD. This is confirmed by cDNA amplification of cycloheximide-treated patient cells as shown in Figures S2A–S2D. The intronic retention is 182 base pairs (bp).
    explanation: Patient-cell cDNA analysis supports pseudoexon inclusion, frame disruption and transcript decay.
- name: Respiratory follow-up
  description: Lifelong respiratory surveillance is advised because respiratory weakness can appear years after neuropathy onset.
  evidence:
  - reference: PMID:30409445
    reference_title: "Charcot Marie Tooth disease type 2S with late onset diaphragmatic weakness: An atypical case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 9 years, he developed diaphragmatic weakness, following which he was established on non-invasive ventilation. Our case emphasizes the importance of life long respiratory surveillance for patients with CMT2S and expands the phenotype of this condition."
    explanation: Basis for surveillance and ventilatory support.
differential_diagnoses:
- name: Spinal muscular atrophy with respiratory distress type 1
  description: >-
    SMARD1 is the severe allelic presentation, typically with early respiratory distress and diaphragmatic
    involvement. Respiratory timing and the clinical course help distinguish presentations, but the spectrum
    overlaps and identical genotypes can yield different outcomes.
  distinguishing_features:
  - Infantile diaphragmatic paralysis and respiratory distress
  - Low birth weight, weak cry, reduced spontaneous movement
  evidence:
  - reference: PMID:28202949
    reference_title: "Clinical diversity caused by novel IGHMBP2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the other case was diagnosed with SMARD1, manifesting as low birth weight, weak cry, reduced spontaneous movement and developed respiratory distress 4 months after birth"
    explanation: Contrasting SMARD1 presentation in the same cohort.
  - reference: PMID:27450922
    reference_title: "Clinical and molecular characteristics in three families with biallelic mutations in IGHMBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, clinical phenotypes differed markedly as the elder with sensorimotor axonal neuropathy had still unaffected respiratory function at 4.5 years, whereas the younger presented as infantile spinal muscular atrophy and died from relentless respiratory failure at 11 months."
    explanation: Intrafamilial SMARD1/CMT2S discordance with identical genotype.
- name: Guillain-Barre syndrome
  description: Acute-onset CMT2S with CSF protein elevation and root enhancement can mimic an immune axonal neuropathy.
  distinguishing_features:
  - Family history or preceding chronic deficits
  - Biallelic IGHMBP2 variants
  evidence:
  - reference: PMID:41468720
    reference_title: "Phenotypic continuum in IGHMBP2-related disorders: a portfolio of cases from typical to Guillain-Barré syndrome-like presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the list of overlapping genetic and acquired neuropathies now also includes IGHMBP2-related CMT2S."
    explanation: Recognised mimic.
animal_models:
- name: Ighmbp2 E365del and Y918C knock-in mice
  species: Mouse
  genotype: Ighmbp2 p.Glu365del homozygous; Ighmbp2 p.Tyr918Cys (human CMT2S allele) homozygous
  publication: PMID:36413117
  description: >
    The first CMT2S mouse models, generated by CRISPR-Cas9; both show progressive peripheral motor and
    sensory axonal degeneration with motor deficits; E365del mice develop mechanical allodynia, and femoral
    nerve axon loss reduces conduction velocity in Y918C but not E365del mice.
  modeled_mechanisms:
  - target: Motor and Sensory Axonal Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Progressive femoral motor and sensory axonal degeneration with motor and sensory behavioural deficits.
    limitations: >-
      Engineered mouse alleles; human foot deformities and disability trajectories are not established
      by these assays. Conduction-velocity effects differ between alleles.
    readouts:
    - name: Femoral motor and sensory axon counts
      target: Motor and Sensory Axonal Degeneration
      direction: DECREASED
      interpretation: Structural readout of the axonal degeneration node.
      evidence:
      - reference: PMID:36413117
        reference_title: "Clinically relevant mouse models of Charcot-Marie-Tooth type 2S."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analysis of femoral motor and sensory nerves identified axonal degeneration, which does not impact nerve conduction velocities in E365del mice, but it does so in the Y918C model."
        explanation: Reports the nerve histology readout.
    evidence:
    - reference: PMID:36413117
      reference_title: "Clinically relevant mouse models of Charcot-Marie-Tooth type 2S."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Based on these results, the E365del mutant mouse, and the human allele knock-in, Y918C, represent mouse models with the hallmark phenotypes of CMT2S, which will be critical for understanding the pathogenic mechanisms of IGHMBP2."
      explanation: Authors' assessment of model relevance.
- name: Ighmbp2 H922Y homozygous mice
  species: Mouse
  genotype: Ighmbp2 p.His922Tyr homozygous
  publication: PMID:39461706
  description: >-
    CMT2S-like model with preserved survival during observation, no persistent respiratory deficit, late
    motor impairment and age-dependent muscle fiber changes. NMJ loss is modest and muscle-specific at
    P180. The D564N/H922Y compound heterozygote studied alongside it has a more severe, variable spectrum
    and is not interchangeable with this model.
  modeled_mechanisms:
  - target: Distal Neuromuscular Junction Denervation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Late, modest NMJ changes in the CMT2S-like homozygote.
    limitations: >-
      Limited endplate changes in selected muscles; this model does not reproduce the severe early denervation
      of the compound heterozygote or all human CMT2S manifestations.
    readouts:
    - name: Neuromuscular junction innervation
      target: Distal Neuromuscular Junction Denervation
      direction: DECREASED
      interpretation: Anatomical endplate occupancy in H922Y homozygotes, with a modest late decrease in gastrocnemius innervation.
      evidence:
      - reference: PMID:39461706
        reference_title: "Ighmbp2 mutations and disease pathology: Defining differences that differentiate SMARD1 and CMT2S."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, Ighmbp2H922Y/H922Y limb muscle fibers demonstrated an increase in muscle fiber area followed by a reduction while changes in NMJ innervation were minimal even at P180."
        explanation: Reports the NMJ readout in the CMT2S-like model.
    evidence:
    - reference: PMID:39461706
      reference_title: "Ighmbp2 mutations and disease pathology: Defining differences that differentiate SMARD1 and CMT2S."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Significant to our understanding of IGHMBP2 function, we demonstrate that there is a direct correlation between disease pathogenesis associated with these IGHMBP2 patient mutations and IGHMBP2 biochemical activity."
      explanation: Reports an activity–severity correlation for the tested alleles; it does not establish a universal predictor across IGHMBP2 genotypes.
experimental_models:
- name: Patient iPSC motor neuron–healthy muscle NMJ chip
  experimental_model_type: ORGAN_ON_CHIP
  description: >-
    Motor neurons differentiated from one patient’s reprogrammed iPSCs are co-cultured with healthy iPSC-derived
    skeletal muscle in a dual-chamber NMJ platform. Separate fibroblast assays measure splice and protein
    rescue. The chip measures functional fatigue and tetanus responses after VCA-894A.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:40060931
  modeled_mechanisms:
  - target: Impaired Neuromuscular Junction Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: NMJ fatigue and chaotic tetanus in patient-derived cells, rescued by ASO-mediated IGHMBP2 restoration.
    limitations: >-
      An in vitro NMJ functional assay from one patient genotype; it does not model axonal
      length dependence or the in vivo denervation process.
    evidence:
    - reference: PMID:40060931
      reference_title: "Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Neuromuscular junction analyses revealed high fatigue and chaotic tetanus formulation in untreated patient cells."
      explanation: Reports the NMJ phenotype in the patient-derived system.
    - reference: PMID:40060931
      reference_title: Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: MNs differentiated from the CMT2S iPSC line, as well as those from healthy control iPSCs (WT-MNs), were integrated into a dual-chamber NMJ platform in the co-culture with WT iPSC-derived SkM myofibers (iPSC-SkM) in a defined serum-free medium after CMT2S characterization.
      explanation: Defines the patient-neuron/healthy-muscle composition.

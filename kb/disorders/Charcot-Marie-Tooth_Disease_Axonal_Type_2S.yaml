discussions:
- discussion_id: cmt2s_rna_process_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Global Translation
  - pathophysiology#Proposed Pre-rRNA Processing Defect
  prompt: >-
    Which IGHMBP2-dependent RNA processes drive peripheral axon degeneration, and which factors explain
    the variable respiratory phenotype?
  rationale: >-
    Patient genotype–phenotype discordance limits a universal residual-activity threshold. Pre-rRNA processing
    is proposed, whereas translation suppression and ISR activation have been measured in K562 cells.
    The disease-relevant neuronal sequence and the role of respiratory motor-neuron vulnerability remain
    unresolved.
  evidence:
  - reference: PMID:39119929
    reference_title: "The molecular mechanisms that underlie IGHMBP2-related diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than 20 years after the link between IGHMBP2 and SMARD1 was revealed, and 10 years after the discovery of the association between IGHMBP2 and CMT2S, the pathogenic mechanism of these diseases is still not well defined."
    explanation: Review statement of the mechanistic gap.
references:
- reference: PMID:20301532
  title: "Charcot-Marie-Tooth Hereditary Neuropathy Overview."
  tags:
  - GeneReviews
- reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
  title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
  tags:
  - GeneReviews
notes: >-
  CMT2S is the axonal-neuropathy presentation within the IGHMBP2 spectrum; severe infantile respiratory
  involvement favors SMARD1, but neither genotype nor a universal residual-activity cutoff cleanly separates
  them. Phenotypes here are supported by CMT2S clinical reports and disease-specific synthesis. The GeneReviews
  Overview PubMed abstract is only a purpose statement and is not a CMT2S phenotype baseline; the full
  Bookshelf chapter supports general CMT care and recessive counseling. Small referral series and initial-symptom
  counts do not establish population prevalence, penetrance or lifetime phenotype frequencies. Experimental
  findings are identified by their system and are not evidence of established clinical efficacy.

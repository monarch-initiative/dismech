name: Charcot-Marie-Tooth Disease Axonal Type 2S
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- CMT2S
- AR-CMT2S
- Autosomal recessive axonal Charcot-Marie-Tooth disease type 2S
- IGHMBP2-related axonal neuropathy
- Charcot-Marie-Tooth neuropathy type 2S
description: >-
  Charcot-Marie-Tooth disease axonal type 2S (CMT2S; OMIM #616155) is an autosomal recessive, progressive
  axonal sensorimotor neuropathy caused by biallelic IGHMBP2 variants. Distal weakness and wasting, gait
  impairment, foot deformity and sensory involvement usually begin in childhood, with variable disability.
  IGHMBP2 encodes an ATP-dependent DNA/RNA helicase implicated in translation and RNA metabolism. Residual
  abundance and biochemical activity differ between tested alleles, but do not define a universal threshold
  separating CMT2S from the allelic disorder SMARD1: the same genotype can produce different clinical
  courses. Respiratory function is often preserved, although later diaphragmatic weakness is documented.
  Care is supportive; AAV9-IGHMBP2 gene replacement is being evaluated in NCT05152823, and a variant-specific
  splice-correcting antisense oligonucleotide has preclinical evidence.

    reference_title: "Clinical and molecular characteristics in three families with biallelic mutations in IGHMBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation in Patients 1 and 3 were consistent with SMARD1, whereas Patients 2 and 4 were in agreement with CMT2S."
    explanation: Illustrates the intrafamilial phenotypic range relevant to counselling.

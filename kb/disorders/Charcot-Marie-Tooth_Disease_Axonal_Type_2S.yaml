- name: Physiotherapy, orthoses and rehabilitation
  description: >
    Care is supportive and extrapolated from general CMT practice: individualised physiotherapy,
    occupational therapy, ankle-foot orthoses and mobility aids, pain management, and orthopaedic
    correction of fixed foot deformity or scoliosis after specialist assessment.
  therapeutic_modality: BEHAVIORAL

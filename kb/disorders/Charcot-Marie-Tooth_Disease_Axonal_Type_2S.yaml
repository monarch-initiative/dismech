discussions:
- discussion_id: cmt2s_rna_process_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disturbed Ribosome Biogenesis and Translation
  prompt: >
    Which IGHMBP2-dependent RNA process (pre-rRNA processing, tRNA metabolism, translation,
    mRNA export) is rate-limiting in long peripheral axons, and why does partial loss spare
    respiratory motor neurons while abolished activity does not?
  rationale: >
    IGHMBP2 has several proposed roles in gene expression and the field has not determined
    which, when dysregulated, causes neurodegeneration; the residual-activity threshold that
    separates CMT2S from SMARD1 is established at the biochemical level but its cellular basis
    in neuron subtypes is not.
  evidence:
  - reference: PMID:39119929
    reference_title: "The molecular mechanisms that underlie IGHMBP2-related diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than 20 years after the link between IGHMBP2 and SMARD1 was revealed, and 10 years after the discovery of the association between IGHMBP2 and CMT2S, the pathogenic mechanism of these diseases is still not well defined."
    explanation: Review statement of the mechanistic gap.
references:
- reference: PMID:20301532
  title: "Charcot-Marie-Tooth Hereditary Neuropathy Overview."
  tags:
  - GeneReviews
notes: >
  Curated as a separate Disease entry from the allelic Spinal_Muscular_Atrophy_with_Respiratory_Distress_Type_1
  (stub entry_type decision: DISEASE), distinguished by residual-activity genotype-phenotype
  correlation, preserved respiration and a chronic axonal-neuropathy course. Conforms to the
  peripheral_axonal_degeneration module. Sources: the 2014-2017 cohort papers (PMID:25568292,
  PMID:27450922, PMID:28202949, PMID:28065684), the 2022 systematic cohort (PMID:35660062),
  the CMT2S mouse models (PMID:36413117, PMID:39461706), biochemical genotype-phenotype work
  (PMID:38403020, PMID:36480289), the 2024 mechanism review (PMID:39119929), therapeutic
  development (PMID:40060931, PMID:41486111, NCT05152823) and atypical presentations
  (PMID:30409445, PMID:41468720). Deep research: Edison/falcon report
  research/Charcot-Marie-Tooth_Disease_Axonal_Type_2S-deep-research-falcon.md (10/10 references
  verified, 36/38 terms verified, preflight-dr PASS); its phenotype table and mechanism chain
  were cross-checked. The report's suggested GO term for axon maintenance (GO:0023055) is
  obsolete and was not used. There is no CMT2S-specific GeneReviews chapter; the
  Charcot-Marie-Tooth Hereditary Neuropathy Overview is tagged. Scoliosis and areflexia are
  described in reviews but had no quotable abstract-level evidence and are omitted.

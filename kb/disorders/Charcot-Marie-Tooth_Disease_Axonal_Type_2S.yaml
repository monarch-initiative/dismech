pathophysiology:
- name: Biallelic Hypomorphic IGHMBP2 Variants
  description: >
    CMT2S alleles reduce, but do not abolish, IGHMBP2 abundance and its ATP-dependent
    DNA/RNA helicase activity. Association with the activator ABT1 stimulates IGHMBP2 ATPase
    and helicase activity, and CMT2S variants such as p.His924Tyr retain ABT1 association and
    substantial activity, whereas SMARD1 variants such as p.Asp565Asn lose it; in compound
    heterozygotes the summed activity of the two mutant proteins predicts severity. This
    residual-activity threshold is the disorder-specific insult to peripheral neurons.
  biological_scale: MOLECULAR
  conforms_to: "peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells"
  molecular_functions:
  - preferred_term: DNA/RNA helicase activity
    term:
      id: GO:0003678
      label: DNA helicase activity
    modifier: DECREASED
  - preferred_term: RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: DECREASED
  downstream:
  - target: Disturbed Ribosome Biogenesis and Translation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36480289
      reference_title: "ABT1 modifies SMARD1 pathology via interactions with IGHMBP2 and stimulation of ATPase and helicase activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The IGHMBP2/ABT1 complex interacts with the 47S pre-rRNA 5' external transcribed spacer and U3 small nucleolar RNA (snoRNA), suggesting that the IGHMBP2/ABT1 complex is important for pre-rRNA processing."
      explanation: Links helicase function to pre-rRNA processing.
  evidence:
  - reference: PMID:38403020
    reference_title: "The contribution and therapeutic implications of IGHMBP2 mutations on IGHMBP2 biochemical activity and ABT1 association."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For the first time, we demonstrate a correlation between the altered IGHMBP2 biochemical activity associated with the D565N and H924Y mutations and disease severity and pathology in patients and our Ighmbp2 mouse models."
    explanation: Residual activity determines severity along the SMARD1-CMT2S continuum.
  - reference: PMID:38403020
    reference_title: "The contribution and therapeutic implications of IGHMBP2 mutations on IGHMBP2 biochemical activity and ABT1 association."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the context of the compound heterozygous patient, we demonstrate that the total biochemical activity associated with IGHMBP2-D565N and IGHMBP2-H924Y proteins is improved over IGHMBP2-D565N alone."
    explanation: Summed activity of two alleles explains compound heterozygous phenotypes.
  - reference: PMID:39119929
    reference_title: "The molecular mechanisms that underlie IGHMBP2-related diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The discovery that IGHMBP2 functions as an RNA/DNA helicase was an important step, but it did not reveal the pathogenic mechanism."
    explanation: Review framing of the helicase function and the open mechanism question.
- name: Disturbed Ribosome Biogenesis and Translation
  description: >
    IGHMBP2, with ABT1, binds the 47S pre-rRNA 5' external transcribed spacer and U3 snoRNA,
    implicating it in pre-rRNA processing; it is also associated with tRNA and translation
    machinery. Loss of activity is proposed to impair ribosome biogenesis and translation,
    with a low-grade integrated stress response in knockout cells, but which of IGHMBP2's
    RNA-metabolic roles drives neuronal pathology is unresolved.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: rRNA processing
    term:
      id: GO:0006364
      label: rRNA processing
    modifier: DYSREGULATED
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  downstream:
  - target: Motor and Sensory Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36480289
    reference_title: "ABT1 modifies SMARD1 pathology via interactions with IGHMBP2 and stimulation of ATPase and helicase activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We provide a mechanism proposing that ABT1 decreases disease pathology in FVB-Ighmbp2nmd/nmd mutants by optimizing IGHMBP2 biochemical activity (ATPase and helicase activity). Our studies provide insight into SMARD1 pathogenesis, suggesting that ABT1 modifies IGHMBP2 activity as a means to regulate pre-rRNA processing."
    explanation: Proposes pre-rRNA processing as the affected pathway.
  - reference: PMID:39119929
    reference_title: "The molecular mechanisms that underlie IGHMBP2-related diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IGHMBP2 appears to be a multifunctional factor involved in several cellular processes that regulate gene expression. It is difficult to determine which processes, when dysregulated, lead to pathology."
    explanation: Records the unresolved link between RNA functions and pathology.
- name: Motor and Sensory Axonal Degeneration
  description: >
    Long peripheral motor and sensory axons degenerate progressively, producing an axonal
    neuropathy with reduced amplitudes and largely preserved conduction velocities; CMT2S
    knock-in mice show progressive motor and sensory axonal degeneration in femoral nerves with
    motor deficits and mechanical allodynia. In contrast to SMARD1, spinal alpha-motor neurons
    supplying the diaphragm are relatively spared.
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Neuromuscular Junction Denervation and Distal Muscle Atrophy
    causal_link_type: DIRECT
  - target: Peripheral axonal neuropathy
    causal_link_type: DIRECT
  - target: Sensory neuropathy
    causal_link_type: DIRECT
  - target: Abnormal autonomic nervous system physiology
    causal_link_type: DIRECT
  evidence:

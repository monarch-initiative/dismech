  - target: Gait disturbance
    causal_link_type: DIRECT
  - target: Motor delay
    causal_link_type: DIRECT
  - target: Diaphragmatic weakness
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39461706
    reference_title: "Ighmbp2 mutations and disease pathology: Defining differences that differentiate SMARD1 and CMT2S."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There was decreased limb skeletal muscle fiber area and increased neuromuscular junction (NMJ) denervation in Ighmbp2D564N/H922Y mice."
    explanation: NMJ denervation and muscle atrophy in the compound heterozygous model.
  - reference: PMID:39461706
    reference_title: "Ighmbp2 mutations and disease pathology: Defining differences that differentiate SMARD1 and CMT2S."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with CMT2S, Ighmbp2H922Y/H922Y mice did not have altered lifespans nor respiratory pathology."
    explanation: The CMT2S-like allele spares respiration and lifespan.
  - reference: PMID:40060931
    reference_title: "Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Neuromuscular junction analyses revealed high fatigue and chaotic tetanus formulation in untreated patient cells. We demonstrate rescue of NMJ function following ASO treatment, captured by a reduction in fatigue and chaotic tetanus responses."
    explanation: Patient-derived NMJ dysfunction and its rescue by IGHMBP2 restoration.

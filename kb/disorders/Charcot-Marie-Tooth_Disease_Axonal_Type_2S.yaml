    reference_title: "Charcot Marie Tooth disease type 2S with late onset diaphragmatic weakness: An atypical case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 9 years, he developed diaphragmatic weakness, following which he was established on non-invasive ventilation. Our case emphasizes the importance of life long respiratory surveillance for patients with CMT2S and expands the phenotype of this condition."
    explanation: Basis for surveillance and ventilatory support.
- name: Intrathecal AAV9-IGHMBP2 gene therapy (investigational)
  description: >
    Single intrathecal AAV9-IGHMBP2 delivery is in a phase I/IIa trial enrolling genetically
    confirmed SMARD1 or CMT2S (NCT05152823). In the SMARD1 mouse, optimised AAV9-IGHMBP2
    vectors rescued survival, motor function, motor neurons and neuromuscular junctions and
    resolved spinal cord inflammatory changes, with a truncated MeCP2 (P546) promoter giving
    superior long-term efficacy and safety.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic Hypomorphic IGHMBP2 Variants
    description: Restores IGHMBP2 expression in motor neurons irrespective of genotype.
  evidence:
  - reference: PMID:41486111
    reference_title: "AAV9 gene therapy optimization for SMARD1/CMT2S: safety and long-term efficacy comparison of two vectors in a SMARD1 preclinical model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Corroborating previous findings, both constructs effectively rescued the pathological phenotype, significantly improving survival, body weight, and motor function while preserving motor neurons and neuromuscular junctions."
    explanation: Preclinical efficacy in the IGHMBP2-deficient mouse.
  - reference: clinicaltrials:NCT05152823
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Open-label, single intrathecal injection study of a AAV9 vector carrying the IGHMBP2 gene for IGHMBP2-related diseases."
    explanation: Registered trial covering IGHMBP2-related diseases including CMT2S.
- name: Personalised splice-correcting antisense oligonucleotide (preclinical)
  description: >
    For a compound heterozygous patient with a deep intronic cryptic-splice variant, a 19-mer
    antisense oligonucleotide blocking the cryptic acceptor restored wild-type transcript,
    raised IGHMBP2 protein by over 50% in fibroblasts, rescued neuromuscular junction function
    in vitro and was well tolerated intrathecally in rats; an N-of-1 strategy applicable only
    to that variant class.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: IGHMBP2
      term:
        id: hgnc:5542
        label: IGHMBP2
    target_transcript: IGHMBP2 pre-mRNA deep intronic cryptic splice acceptor
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Biallelic Hypomorphic IGHMBP2 Variants
    description: Blocks a variant-created cryptic splice site so that normally spliced, stable IGHMBP2 transcript is restored.
  evidence:
  - reference: PMID:40060931
    reference_title: "Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ASO treatment of patient fibroblasts significantly increased the ratio of restored wild-type transcript to cryptic exon-containing transcript and resulted in over a 50% increase in IGHMBP2 protein levels."
    explanation: Molecular rescue in patient cells.
- name: ABT1 augmentation (preclinical)
  description: >
    Intracerebroventricular scAAV9-Abt1 reduced disease pathology, extended lifespan and
    decreased neuromuscular junction denervation in the SMARD1-nmd mouse by stimulating the
    ATPase and helicase activity of residual IGHMBP2; a modifier-based strategy potentially
    suited to hypomorphic CMT2S alleles.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic Hypomorphic IGHMBP2 Variants
    description: Increases the activity of residual mutant IGHMBP2 through its activator ABT1.
  evidence:
  - reference: PMID:36480289
    reference_title: "ABT1 modifies SMARD1 pathology via interactions with IGHMBP2 and stimulation of ATPase and helicase activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intracerebroventricular injection of scAAV9-Abt1 decreases FVB-Ighmbp2nmd/nmd disease pathology, significantly increases lifespan, and substantially decreases neuromuscular junction denervation."
    explanation: Preclinical proof of the modifier approach.
- name: Genetic counseling
  description: Autosomal recessive counselling with a 25% recurrence risk; the SMARD1-CMT2S continuum within a sibship should be explained.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

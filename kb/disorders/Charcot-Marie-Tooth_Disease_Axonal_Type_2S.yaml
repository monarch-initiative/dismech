    evidence_source: MODEL_ORGANISM
    snippet: "Effects were limited to transient clinical signs following administration of 0.35 mg VCA-894A (abnormal gait, low carriage, incoordination, limited usage of the hindlimbs, decreased muscle tone, partly closed eyes, erected fur, and decreased activity) and microscopic findings in the brain, spinal cord (included injection site), dorsal root ganglion, nerve roots, and kidneys, which were noted unremarkable."

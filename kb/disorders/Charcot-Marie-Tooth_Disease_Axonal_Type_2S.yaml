    evidence_source: MODEL_ORGANISM
    snippet: "Intracerebroventricular injection of scAAV9-Abt1 decreases FVB-Ighmbp2nmd/nmd disease pathology, significantly increases lifespan, and substantially decreases neuromuscular junction denervation."

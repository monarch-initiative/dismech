prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty-five patients from 34 families with 47 distinct variants reported between 2014 and
    2022. IGHMBP2 was the most frequent cause of autosomal recessive CMT2 in a Chinese cohort
    of 178 CMT2 families and accounted for about 1.6% of axonal CMT in a Japanese series.
  evidence:
  - reference: PMID:35660062
    reference_title: "Clinical and genetic features of Charcot-Marie-Tooth disease patients with IGHMBP2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From 2014 to 2022, 34 AR-CMT2S families, including 45 patients and 47 different mutations, were reported."
    explanation: Literature case count.
  - reference: PMID:28202949
    reference_title: "Clinical diversity caused by novel IGHMBP2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present the original report of CMT type 2S in Japan, and illustrate that recessive IGHMBP2 variants account for ~1.6% of axonal CMT in our cohort."
    explanation: Share of axonal CMT attributable to IGHMBP2 in a diagnostic cohort.
  - reference: PMID:28065684
    reference_title: "IGHMBP2-related clinical and genetic features in a cohort of Chinese Charcot-Marie-Tooth disease type 2 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found four families with autosomal recessive IGHMBP2 mutations, and the frequency of IGHMBP2 mutations is 6.5% in CMT2 without dominant inheritance."
    explanation: Frequency among non-dominant CMT2.
progression:
- phase: Infantile or childhood onset
  notes: >-
    Onset ranges from the first months of life to 20 years (mean 3.8 years), with about half
    presenting before age two with weakness, delayed milestones, foot deformity, gait
    disturbance or foot drop; the course is slowly progressive with distal-to-proximal
    spread and preserved respiratory function in most patients.
  evidence:
  - reference: PMID:35660062
    reference_title: "Clinical and genetic features of Charcot-Marie-Tooth disease patients with IGHMBP2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at onset ranged from 0.11 years to 20 years (mean±SD: 3.76±3.93 years) and the infantile (0-2 years) onset group accounted for the most patients (51.1%)."
    explanation: Age-of-onset distribution across reported patients.
  - reference: PMID:25568292
    reference_title: "Recessive truncating IGHMBP2 mutations presenting as axonal sensorimotor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one patient required nocturnal mask ventilation, while 4 others maintained normal respiratory function by the age of 14, 18, 22, and 37 years. Three patients were still able to walk independently."
    explanation: Long-term respiratory and ambulatory course.
- phase: Late respiratory involvement (rare)
  notes: >-
    Diaphragmatic weakness can emerge years after onset in patients with an otherwise typical
    CMT2S course, requiring non-invasive ventilation; lifelong respiratory surveillance is
    recommended.
  evidence:
  - reference: PMID:30409445
    reference_title: "Charcot Marie Tooth disease type 2S with late onset diaphragmatic weakness: An atypical case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 9 years, he developed diaphragmatic weakness, following which he was established on non-invasive ventilation. Our case emphasizes the importance of life long respiratory surveillance for patients with CMT2S and expands the phenotype of this condition."
    explanation: Documents late diaphragmatic weakness in CMT2S.
genetic:
- name: IGHMBP2
  gene_term:
    preferred_term: IGHMBP2
    term:
      id: hgnc:5542
      label: IGHMBP2
  relationship_type: CAUSATIVE
  notes: >
    Biallelic IGHMBP2 (11q13.3) variants cause CMT2S; the same gene causes SMARD1, and
    compound heterozygotes for one severe and one milder allele can present with either
    phenotype, even within a sibship. Two-thirds of reported CMT2S variants are missense changes
    clustering in the helicase and ATPase domains and one-third are presumed loss-of-function
    (nonsense, frameshift, splice) alleles; missense changes near the RNA-binding channel or the
    nucleotide-binding pocket may be associated with more severe outcomes. Residual protein
    level and biochemical (ATPase/helicase) activity correlate with the SMARD1-versus-CMT2S
    outcome. Deep intronic variants activating cryptic splice sites are a recognised class.
  variants:
  - name: c.2770C>T (p.His924Tyr)
    description: >
      CMT2S-associated missense variant in the C-terminal region; alters IGHMBP2 activity to a
      lesser extent than the SMARD1 variant p.Asp565Asn while maintaining association with
      ABT1, and the equivalent H922Y knock-in mouse has a normal lifespan without respiratory
      pathology, modelling the CMT2S end of the spectrum.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38403020
      reference_title: "The contribution and therapeutic implications of IGHMBP2 mutations on IGHMBP2 biochemical activity and ABT1 association."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The IGHMBP2-D565N mutation has been identified in SMARD1 patients, while the IGHMBP2-H924Y mutation has been identified in CMT2S patients."
      explanation: Assigns the variant to the CMT2S phenotype.
    - reference: PMID:38403020
      reference_title: "The contribution and therapeutic implications of IGHMBP2 mutations on IGHMBP2 biochemical activity and ABT1 association."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The H924Y mutation alters IGHMBP2 activity to a lesser extent while maintaining association with ABT1."
      explanation: Biochemical basis for the milder phenotype.
  - name: c.1156T>C (p.Trp386Arg) / c.2747G>A (p.Cys916Tyr)
    description: Compound heterozygous missense variants in a boy with CMT2S who developed diaphragmatic weakness at 9 years.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30409445
      reference_title: "Charcot Marie Tooth disease type 2S with late onset diaphragmatic weakness: An atypical case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic testing revealed two heterozygous variants in the IGHMBP2 gene: c.1156 T > C p.(Trp386Arg) in exon 8 and c.2747G > A p.(Cys916Tyr) in exon 14, that were inherited from his father and mother respectively."
      explanation: Reports the variants and their segregation.
  evidence:
  - reference: PMID:25568292
    reference_title: "Recessive truncating IGHMBP2 mutations presenting as axonal sensorimotor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on 5 patients with neuropathy from 3 families who carried truncating mutations in IGHMBP2. Contrary to the \"classic\" phenotype, they did not manifest with respiratory distress, but with progressive sensorimotor neuropathy."
    explanation: Establishes IGHMBP2 as a cause of axonal neuropathy without respiratory distress.
  - reference: PMID:35660062
    reference_title: "Clinical and genetic features of Charcot-Marie-Tooth disease patients with IGHMBP2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One third of identified mutations represented presumed loss-of-function variants (nonsense, frameshift and splicing), while two-thirds were missense changes which clustered in the helicase and ATPase domains."
    explanation: Variant spectrum.
  - reference: PMID:27450922
    reference_title: "Clinical and molecular characteristics in three families with biallelic mutations in IGHMBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, clinical phenotypes differed markedly as the elder with sensorimotor axonal neuropathy had still unaffected respiratory function at 4.5 years, whereas the younger presented as infantile spinal muscular atrophy and died from relentless respiratory failure at 11 months."
    explanation: Intrafamilial SMARD1/CMT2S discordance with identical genotype.

name: Charcot-Marie-Tooth Disease Axonal Type 2S
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- CMT2S
- AR-CMT2S
- Autosomal recessive axonal Charcot-Marie-Tooth disease type 2S
- IGHMBP2-related axonal neuropathy
- Charcot-Marie-Tooth neuropathy type 2S
description: >
  Charcot-Marie-Tooth disease axonal type 2S (CMT2S; OMIM #616155) is an autosomal recessive,
  slowly progressive, length-dependent axonal sensorimotor neuropathy caused by biallelic
  variants in IGHMBP2, which encodes immunoglobulin mu-binding protein 2, a ubiquitously
  expressed UPF1-like ATP-dependent DNA/RNA helicase implicated in ribosome biogenesis and
  translation. It is the milder allelic counterpart of spinal muscular atrophy with respiratory
  distress type 1 (SMARD1): variants that retain residual IGHMBP2 abundance and biochemical
  activity spare the diaphragm and phrenic motor neurons and produce CMT2S, whereas those that
  abolish activity cause infantile diaphragmatic paralysis and death. Onset is usually in
  infancy or early childhood (mean about 3.8 years) with distal weakness, delayed milestones,
  foot deformity, gait disturbance and foot drop, progressing to distal amyotrophy with mild
  sensory and occasional autonomic involvement; electrophysiology shows reduced motor and
  sensory amplitudes with preserved conduction velocities. Respiratory function is normally
  preserved, but late diaphragmatic weakness and acute Guillain-Barre-like presentations are
  reported, so respiratory surveillance is advised. About two-thirds of reported variants are
  missense changes clustering in the helicase and ATPase domains and a third are truncating.
  Dedicated knock-in mouse models reproduce progressive motor and sensory axonal degeneration,
  and neuromuscular junction denervation correlates with residual IGHMBP2 activity. Care is
  supportive and rehabilitative; an intrathecal AAV9-IGHMBP2 gene therapy trial enrolling both
  SMARD1 and CMT2S (NCT05152823) and a personalised splice-correcting antisense
  oligonucleotide are in development.

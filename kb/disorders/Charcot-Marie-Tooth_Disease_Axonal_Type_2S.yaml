    directness: INDIRECT
  - reference: PMID:36480289
    reference_title: ABT1 modifies SMARD1 pathology via interactions with IGHMBP2 and stimulation of ATPase and helicase activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Survival analyses demonstrate a median survival for Ighmbp2nmd/nmd mice of 19 days, while mutant mice injected with scAAV9-Abt1 at 1.5 × 1011 viral genomes had a median survival of 22 days, and mutant mice injected with scAAV9-Abt1 at 4 × 1011 viral genomes survived to 21 days.
    explanation: Dose-specific survival in SMARD1 mice, not CMT2S clinical efficacy.
- name: Genetic counseling
  description: >-
    When both parents carry a pathogenic IGHMBP2 allele, each pregnancy has a 25% chance of a child inheriting
    both variants. Severity and the CMT2S-versus-SMARD1 course cannot be predicted precisely from that
    recurrence risk. Familial variants allow carrier, prenatal and preimplantation testing.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27450922
    reference_title: "Clinical and molecular characteristics in three families with biallelic mutations in IGHMBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation in Patients 1 and 3 were consistent with SMARD1, whereas Patients 2 and 4 were in agreement with CMT2S."
    explanation: Illustrates the intrafamilial phenotypic range relevant to counselling.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: Autosomal recessive CMT counseling, applied when both parents are carriers.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once the CMT-related pathogenic variant(s) have been identified in an affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: General CMT reproductive testing after identification of familial variants.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Avoidance of neurotoxic medication exposure
  description: >-
    General CMT guidance identifies vincristine as particularly hazardous to peripheral nerves. This is
    a care precaution for people with inherited neuropathy.
  therapeutic_modality: OTHER
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Chemotherapy for cancer that includes vincristine may be especially damaging to peripheral nerves and severely worsen CMT
    explanation: Broader CMT precaution.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- name: Neuropathic Pain Management
  description: >-
    Identify the source of pain and consider symptomatic neuropathic-pain treatment. Current CMT GeneReviews guidance
    names tricyclic antidepressants, carbamazepine and gabapentin. This is general-CMT guidance rather than demonstrated
    CMT2S-specific efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gabapentin
      term:
        id: CHEBI:42797
        label: gabapentin
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Neuropathic pain may respond to tricyclic antidepressants or drugs such as carbamazepine or gabapentin.
    explanation: >-
      Current CMT overview names these symptomatic options; it does not establish genotype-specific efficacy.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Weight management
  description: Avoidance of obesity is part of general CMT supportive care, extrapolated to CMT2S to reduce the additional burden on mobility.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Obesity is to be avoided because it makes walking more difficult.
    explanation: 'General CMT guidance to limit an additional burden on walking.'

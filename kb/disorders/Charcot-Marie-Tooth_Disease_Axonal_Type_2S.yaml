      label: Distal muscle weakness
- name: Respiratory surveillance and non-invasive ventilation
  description: >
    Lifelong respiratory surveillance is advised because diaphragmatic weakness can appear
    years after onset; non-invasive ventilation is instituted when it does.
  therapeutic_modality: DEVICE

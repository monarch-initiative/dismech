  - target: Chronic Integrated Stress Response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Models a cellular response to IGHMBP2 depletion.
    limitations: Non-neuronal transformed cells with engineered deletion; patient axonal relevance and therapeutic benefit are unproven.
    evidence:
    - reference: PMID:38803225
      reference_title: IGHMBP2 deletion suppresses translation and activates the integrated stress response.

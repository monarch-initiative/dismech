diagnosis:
- name: Molecular genetic testing for biallelic IGHMBP2 variants
  description: >
    IGHMBP2 screening is recommended for early-onset, sporadic or autosomal recessive axonal
    CMT2, and should not be withheld in the absence of respiratory symptoms.
  evidence:
  - reference: PMID:28065684
    reference_title: "IGHMBP2-related clinical and genetic features in a cohort of Chinese Charcot-Marie-Tooth disease type 2 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, mutation screening of IGHMBP2 should be especially considered in AR-CMT2 and sporadic CMT2 patients."
    explanation: Testing recommendation.
  - reference: PMID:25568292
    reference_title: "Recessive truncating IGHMBP2 mutations presenting as axonal sensorimotor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in IGHMBP2 should be considered in the molecular genetic workup of patients with hereditary sensorimotor neuropathies, even in the absence of respiratory symptoms."
    explanation: Extends testing to patients without respiratory involvement.
- name: Nerve conduction studies
  description: Reduced motor and sensory amplitudes with relatively preserved conduction velocities confirm an axonal sensorimotor neuropathy.
  evidence:
  - reference: PMID:28202949
    reference_title: "Clinical diversity caused by novel IGHMBP2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients presented with childhood-onset axonal predominant sensorimotor polyneuropathies"
    explanation: Electrophysiological classification.
- name: Recognition of acute Guillain-Barre-like presentations
  description: >
    Acute motor and sensory axonal neuropathy with cauda equina enhancement and raised CSF
    protein has been reported as the presentation of CMT2S, so genetic testing should be
    considered when an apparent immune neuropathy has an atypical course.
  evidence:
  - reference: PMID:41468720
    reference_title: "Phenotypic continuum in IGHMBP2-related disorders: a portfolio of cases from typical to Guillain-Barré syndrome-like presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 3 and 4, two siblings, presented with a Guillain-Barré syndrome-like phenotype, cauda equina enhancement on spinal neuroimaging, elevated cerebrospinal fluid protein, and electromyography revealing acute motor and sensory axonal neuropathy."
    explanation: Atypical presentation relevant to diagnosis.
differential_diagnoses:
- name: Spinal muscular atrophy with respiratory distress type 1
  description: >
    The severe allelic disorder: infantile axonal neuropathy with diaphragmatic paralysis and
    death usually before one year. Distinguished by early respiratory failure and abolished
    IGHMBP2 activity; the same genotype can produce either phenotype within a family.
  distinguishing_features:
  - Infantile diaphragmatic paralysis and respiratory distress
  - Low birth weight, weak cry, reduced spontaneous movement
  - Alleles with abolished IGHMBP2 ATPase/helicase activity
  evidence:
  - reference: PMID:28202949
    reference_title: "Clinical diversity caused by novel IGHMBP2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the other case was diagnosed with SMARD1, manifesting as low birth weight, weak cry, reduced spontaneous movement and developed respiratory distress 4 months after birth"
    explanation: Contrasting SMARD1 presentation in the same cohort.
- name: Guillain-Barre syndrome
  description: Acute-onset CMT2S with CSF protein elevation and root enhancement can mimic an immune axonal neuropathy.
  distinguishing_features:
  - Family history or preceding chronic deficits
  - Biallelic IGHMBP2 variants
  evidence:
  - reference: PMID:41468720
    reference_title: "Phenotypic continuum in IGHMBP2-related disorders: a portfolio of cases from typical to Guillain-Barré syndrome-like presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the list of overlapping genetic and acquired neuropathies now also includes IGHMBP2-related CMT2S."
    explanation: Recognised mimic.
animal_models:
- name: Ighmbp2 E365del and Y918C knock-in mice
  species: Mouse
  genotype: Ighmbp2 p.Glu365del homozygous; Ighmbp2 p.Tyr918Cys (human CMT2S allele) homozygous
  publication: PMID:36413117
  description: >
    The first CMT2S mouse models, generated by CRISPR-Cas9; both show progressive peripheral
    motor and sensory axonal degeneration with motor deficits and normal survival, E365del mice
    develop mechanical allodynia, and femoral nerve axon loss reduces conduction velocity in
    Y918C but not E365del mice.
  modeled_mechanisms:
  - target: Motor and Sensory Axonal Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Progressive femoral motor and sensory axonal degeneration with motor and sensory behavioural deficits.
    limitations: >-
      Engineered alleles with a short murine lifespan; foot deformity and the human disability
      trajectory are not reproduced, and conduction-velocity effects differ between alleles.
    readouts:
    - name: Femoral motor and sensory axon counts
      target: Motor and Sensory Axonal Degeneration
      direction: DECREASED
      interpretation: Structural readout of the axonal degeneration node.
      evidence:
      - reference: PMID:36413117
        reference_title: "Clinically relevant mouse models of Charcot-Marie-Tooth type 2S."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analysis of femoral motor and sensory nerves identified axonal degeneration, which does not impact nerve conduction velocities in E365del mice, but it does so in the Y918C model."
        explanation: Reports the nerve histology readout.
    evidence:
    - reference: PMID:36413117
      reference_title: "Clinically relevant mouse models of Charcot-Marie-Tooth type 2S."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Based on these results, the E365del mutant mouse, and the human allele knock-in, Y918C, represent mouse models with the hallmark phenotypes of CMT2S, which will be critical for understanding the pathogenic mechanisms of IGHMBP2."
      explanation: Authors' assessment of model relevance.
- name: Ighmbp2 H922Y and D564N/H922Y mice
  species: Mouse
  genotype: Ighmbp2 p.His922Tyr homozygous (CMT2S allele); Ighmbp2 p.Asp564Asn/p.His922Tyr compound heterozygous
  publication: PMID:39461706
  description: >
    Patient-mutation models spanning the continuum: H922Y homozygotes have normal lifespan
    and no respiratory pathology with minimal NMJ change, whereas D564N/H922Y compound
    heterozygotes show early motor deficits, reduced fibre area, NMJ denervation and a
    bimodal lifespan predicted by early respiratory pathology, with severity tracking
    IGHMBP2 biochemical activity.
  modeled_mechanisms:
  - target: Neuromuscular Junction Denervation and Distal Muscle Atrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: NMJ denervation is marked in the compound heterozygote but minimal in the CMT2S-like homozygote.
    limitations: >-
      The pure CMT2S allele produces little NMJ pathology by six months, so the distal
      denervation of human CMT2S is best represented by the compound heterozygote, which
      carries a SMARD1 allele.
    readouts:
    - name: Neuromuscular junction innervation
      target: Neuromuscular Junction Denervation and Distal Muscle Atrophy
      direction: DECREASED
      interpretation: Denervation in D564N/H922Y mice; minimal change in H922Y homozygotes.
      evidence:
      - reference: PMID:39461706
        reference_title: "Ighmbp2 mutations and disease pathology: Defining differences that differentiate SMARD1 and CMT2S."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, Ighmbp2H922Y/H922Y limb muscle fibers demonstrated an increase in muscle fiber area followed by a reduction while changes in NMJ innervation were minimal even at P180."
        explanation: Reports the NMJ readout in the CMT2S-like model.
    evidence:
    - reference: PMID:39461706
      reference_title: "Ighmbp2 mutations and disease pathology: Defining differences that differentiate SMARD1 and CMT2S."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Significant to our understanding of IGHMBP2 function, we demonstrate that there is a direct correlation between disease pathogenesis associated with these IGHMBP2 patient mutations and IGHMBP2 biochemical activity."
      explanation: Establishes the activity-severity correlation the models are used for.

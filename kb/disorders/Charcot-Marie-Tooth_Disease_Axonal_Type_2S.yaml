- name: Personalised splice-correcting antisense oligonucleotide (preclinical)
  description: >
    VCA-894A, an n-of-1 antisense oligonucleotide for one compound heterozygous patient whose paternal allele carries
    a deep intronic variant (c.1235+894C>A) that creates a cryptic splice acceptor, so that allele's transcript
    is degraded by nonsense-mediated decay. The ASO blocks the cryptic acceptor to restore normal splicing, which
    recovers transcript from the otherwise-silent allele. In patient fibroblasts it restored wild-type transcript
    and raised IGHMBP2 protein by over 50%; in a chip with patient-derived iPSC motor neurons and healthy iPSC-derived
    muscle it reduced fatigue and chaotic tetanus. It is a 19-mer with phosphorothioate and 2'-O-MOE chemistry,
    matching the backbone and sugar chemistry of nusinersen, and intrathecal dosing was tolerated in a 3-month rat
    study with the highest dose as the NOAEL. Preclinical, and specific to this variant: it targets the sequence
    around c.1235+894C>A, so its intended application is variant-specific.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: IGHMBP2
      term:
        id: hgnc:5542
        label: IGHMBP2
    target_transcript: IGHMBP2 pre-mRNA cryptic splice acceptor created by c.1235+894C>A in intron 8
    oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
  delivery_system:
    delivery_platform: UNFORMULATED
    targeting_ligand: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: VCA-894A
      term:
        id: NCIT:C1291
        label: Antisense Oligonucleotides
  target_mechanisms:
  - target: Intron-8 Pseudoexon Inclusion
    treatment_effect: INHIBITS
    description: Blocks a variant-created cryptic splice site so that normally spliced, stable IGHMBP2 transcript is restored.
  evidence:
  - reference: PMID:40060931
    reference_title: "Potential ASO-based personalized treatment for Charcot-Marie-Tooth disease type 2S."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ASO treatment of patient fibroblasts significantly increased the ratio of restored wild-type transcript to cryptic exon-containing transcript and resulted in over a 50% increase in IGHMBP2 protein levels."
    explanation: Molecular rescue in patient cells.

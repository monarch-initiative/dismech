  downstream:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    description: Risk alleles in HLA-DRB1 and BTNL2 alter MHC class II antigen presentation and T-cell co-inhibition, lowering the threshold for an exaggerated CD4+ T-cell response to a triggering antigen.
    causal_link_type: DIRECT
    hypothesis_groups:
    - antigen_persistence_granuloma_chronicity_model
    - vimentin_autoimmunity_model
  - target: Self-Antigen Vimentin Presentation by HLA-DRB1*03
    description: In the vimentin autoimmunity model specifically, the HLA-DRB1*03 risk allele presents the self-peptide vimentin (Vim)429-443 to the restricted Valpha2.3/Vbeta22 CD4+ T-cell repertoire - the model-distinguishing self-antigen presentation step.
    causal_link_type: DIRECT
    hypothesis_groups:
    - vimentin_autoimmunity_model
- name: Self-Antigen Vimentin Presentation by HLA-DRB1*03
  biological_scale: MOLECULAR
  description: >
    Vimentin-specific arm of antigen presentation (the step that distinguishes
    the vimentin autoimmunity model from the persistent-microbial-antigen model):
    HLA-DRB1*03 presents the self-peptide vimentin (Vim)429-443
    (DSLPLVDTHSKRTLL) to a public, clonally restricted Valpha2.3/Vbeta22 CD4+
    T-cell receptor repertoire found in the lungs of essentially all
    HLA-DRB1*03+ patients, with molecular modelling supporting a precise fit of
    the peptide to both the HLA cleft and the restricted TCR.
  evidence:
  - reference: PMID:26585430
    reference_title: "T-cell receptor-HLA-DRB1 associations suggest specific antigens in pulmonary sarcoidosis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular modelling revealed specific T-cell receptor-HLA-DRB1*03-peptide interactions, with a previously identified, sarcoidosis-associated vimentin peptide, (Vim)429-443 DSLPLVDTHSKRTLL, matching both the HLA peptide-binding cleft and distinct T-cell receptor features perfectly."
    explanation: Molecular modelling supports HLA-DRB1*03 presentation of the vimentin Vim429-443 peptide to the restricted TCR, the self-antigen presentation step unique to this model.
  - reference: PMID:26585430
    reference_title: "T-cell receptor-HLA-DRB1 associations suggest specific antigens in pulmonary sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Simultaneous expression of Vα2.3 with the Vβ22 chain was identified in the lungs of all HLA-DRB1*03(+) patients."
    explanation: Documents the restricted Valpha2.3/Vbeta22 CD4+ T-cell repertoire in the lungs of HLA-DRB1*03+ patients that recognizes the presented vimentin peptide.
  - reference: PMID:17975675
    reference_title: "Identification of HLA-DR-bound peptides presented by human bronchoalveolar lavage cells in sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 78 amino acid sequences from self proteins presented in the lungs of sarcoidosis patients, some of which were well-known autoantigens such as vimentin and ATP synthase."
    explanation: Direct physical-presentation evidence - acid-eluted HLA-DR peptides from DRB1*0301+ patient BAL cells include vimentin, substantiating the presentation step beyond molecular modelling (and consistent with the multi-antigen milieu, since ATP synthase is co-presented).

- accession: ega:EGAS00001006133
  title: Discriminating Th17.1 cell driven sarcoidosis-like inflammation from relapse after anti-BCMA CAR T cells in multiple myeloma
  description: We present a case study on sarcoidosis-like flare-up after Idecabtagen Vicleucel (Ide-cel), a BCMA targeting CAR T cell therapy, and identified a Th17.1 driven autoimmune mechanism as the biological underpinning of this phenomenon using single-cell RNA-seq analysis. Furthermore, single-cell RNA-seq allowed to discriminate between immune-mediated changes and true relapse after CAR T cell treatment.

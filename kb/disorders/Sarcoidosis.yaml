biochemical:
- name: Elevated ACE
  presence: Elevated
  context: Serum angiotensin-converting enzyme often elevated but not specific for diagnosis
  evidence:
  - reference: PMID:36778180
    reference_title: "Sarcoidosis in Johannesburg, South Africa: A retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Raised angiotensin-converting enzyme (ACE) levels were found in 56.8% of patients."
    explanation: This retrospective cohort directly supports frequent elevation of serum ACE in sarcoidosis while remaining compatible with its limited diagnostic specificity.
- name: Hypercalcemia
  presence: Elevated
  context: Due to ectopic 1,25-dihydroxyvitamin D (calcitriol) production by granuloma macrophages
  evidence:
  - reference: PMID:24663253
    reference_title: "Serum vitamin D levels may not reflect tissue-level vitamin D in sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypercalcemia in sarcoidosis is due to three mechanistic reasons: (1) systemic conversion of 25-hydroxyvitamin D to 1,25-dihydroxyvitamin D by the enzyme 1-alpha hydroxylase produced by activated monocyte/macrophage system, (2) production of parathormone-related peptide (PTHrP) by the sarcoid granuloma, (3) tissue-level conversion of 25-hydroxyvitamin D to 1,25-dihydroxyvitamin D by 1-alphahydroxylase produced by local monocyte/macrophage system in the sarcoid granuloma."
    explanation: This case-based report explicitly supports hypercalcemia in sarcoidosis and ties it to macrophage-driven calcitriol dysregulation within granulomatous tissue.
- name: Elevated Inflammatory Markers
  presence: Elevated
  context: ESR and CRP may be elevated during active disease
  evidence:
  - reference: PMID:32407763
    reference_title: "Serum angiotensin converting enzyme, Erythrocyte sedimentation rate and high sensitive-C reactive protein levels in diagnosis of cardiac sarcoidosis- where do we stand?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, ESR and Hs-CRP emerges to be more sensitive markers of active CS."
    explanation: This study directly supports ESR and CRP elevation in active cardiac sarcoidosis, partially supporting their broader use as inflammatory activity markers in sarcoidosis.
- name: Elevated Soluble IL-2 Receptor
  presence: Elevated
  context: >
    Serum soluble interleukin-2 receptor (sIL-2R) is shed by activated T cells and
    reflects the Th1/Th17.1 activation that drives granulomatous inflammation. It
    serves as a marker of disease activity and outperforms serum ACE for
    establishing the diagnosis (sensitivity 88%, specificity 85% versus 62%/76%
    for ACE).
  evidence:
  - reference: PMID:31622413
    reference_title: "Sensitivity and specificity of serum soluble interleukin-2 receptor for diagnosing sarcoidosis in a population of patients suspected of sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The soluble interleukin 2 receptor (sIL-2R) has been proposed as a marker of disease activity in patients with sarcoidosis."
    explanation: Establishes sIL-2R as a recognized activity biomarker in sarcoidosis, mechanistically linked to the activated T-cell compartment.
  - reference: PMID:31622413
    reference_title: "Sensitivity and specificity of serum soluble interleukin-2 receptor for diagnosing sarcoidosis in a population of patients suspected of sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sensitivity and specificity of serum soluble interleukin 2 receptor levels to detect sarcoidosis were 88% and 85%. The sensitivity and specificity of ACE were 62% and 76%."
    explanation: Quantifies the superior diagnostic performance of sIL-2R over serum ACE in patients suspected of sarcoidosis.
- name: Elevated BAL CD4/CD8 Ratio
  presence: Elevated
  context: >
    An elevated bronchoalveolar lavage (BAL) CD4/CD8 T-cell ratio reflects the
    lung-compartmentalized, oligoclonal CD4+ T-cell alveolitis of sarcoidosis. An
    elevated ratio (an optimal cutoff of 3.7 was reported in one comparative
    series, close to the classic >3.5 threshold) is a high-specificity supportive
    finding that helps distinguish sarcoidosis from tuberculosis, idiopathic
    pulmonary fibrosis, and other interstitial lung diseases, though sensitivity
    is limited.
  evidence:
  - reference: PMID:39976519
    reference_title: "Diagnostic Power of the CD4+/CD8+ Ratio and the Expression of Activation and Memory Markers in Differentiating Sarcoidosis from Tuberculosis, Idiopathic Pulmonary Fibrosis, and Other Interstitial Lung Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcoidosis exhibited a significantly higher CD4/CD8 ratio compared to those with TB, IPF, and Other-ILDs. An optimal cutoff value of 3.7 for the CD4/CD8 ratio in sarcoidosis with an area under the ROC curve (AUC) of 0.7%, had a specificity of 96.8%, and a sensitivity of 43.2%."
    explanation: Demonstrates the BAL CD4/CD8 ratio as a high-specificity, low-sensitivity discriminator of sarcoidosis from other interstitial lung diseases.
genetic:
- name: HLA-DRB1 Variants
  association: Susceptibility
  notes: HLA-DRB1 alleles are associated with susceptibility and disease course; DRB1*03 has been linked to resolving disease (Lofgren) in some populations.
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  evidence:
  - reference: PMID:25506722
    reference_title: "Association of HLA-DRB1 with Sarcoidosis Susceptibility and Progression in African Americans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study has identified DRB1*03:01 and *03:02 as novel alleles associated with disease susceptibility and course in African Americans."
    explanation: This large genetic association study directly supports HLA-DRB1 variation as a determinant of sarcoidosis susceptibility and clinical course.
- name: BTNL2 Variants
  association: Susceptibility
  notes: BTNL2 rs2076530 A-allele variation is associated with increased sarcoidosis risk.
  gene_term:
    preferred_term: BTNL2
    term:
      id: hgnc:1142
      label: BTNL2
  evidence:
  - reference: PMID:21410903
    reference_title: "The BTNL2 A allele variant is frequent in Danish patients with sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BTNL2 A allele variant occurs with a high frequency in Danish patients with sarcoidosis and the AA genotype is associated with a ~threefold higher risk of sarcoidosis than the GG genotype."
    explanation: This case-control study directly supports BTNL2 variation as a sarcoidosis susceptibility factor.
  - reference: PMID:15735647
    reference_title: "Sarcoidosis is associated with a truncating splice site mutation in BTNL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The G --> A transition constituting rs2076530 leads to the use of a cryptic splice site located 4 bp upstream of the affected wild-type donor site. Transcripts of the risk-associated allele have a premature stop in the spliced mRNA. The resulting protein lacks the C-terminal IgC domain and transmembrane helix, thereby disrupting the membrane localization of the protein"
    explanation: Defines the molecular consequence - the A risk allele creates a cryptic splice site producing a truncated BTNL2 protein lacking the membrane anchor, reducing T-cell co-inhibitory signalling.
- name: ANXA11 Variants
  association: Susceptibility
  notes: ANXA11 R230C (rs1049550) is a missense variant identified by GWAS as a major sarcoidosis susceptibility factor; the protective allele also lowers risk in independent cohorts. ANXA11 governs apoptosis and proliferation, processes implicated in macrophage granuloma maintenance. Subset analyses link ANXA11 SNPs to sarcoidosis-associated uveitis.
  gene_term:
    preferred_term: ANXA11
    term:
      id: hgnc:535
      label: ANXA11
  evidence:
  - reference: PMID:19165924
    reference_title: "Genome-wide association study identifies ANXA11 as a new susceptibility locus for sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The strongest association signal maps to the ANXA11 (annexin A11) gene on chromosome 10q22.3."
    explanation: Original GWAS implicating ANXA11 as a sarcoidosis susceptibility locus.
  - reference: PMID:32552203
    reference_title: "Association of TGF-β3 and ANXA11 with pulmonary sarcoidosis in Greek population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It also confirms previously reported 'protective' association between sarcoidosis and functional variant ANXA11 rs1049550*A."
    explanation: Independent replication in a Greek cohort confirms the protective association of the ANXA11 rs1049550 A allele, reinforcing the locus.
  - reference: PMID:29416296
    reference_title: "Association of genetic variants in RAB23 and ANXA11 with uveitis in sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SNPs rs1040461 and rs61860052, in ras-related protein RAS23 (RAB23) and annexin A11 (ANXA11) genes, respectively, were associated with sarcoidosis-associated uveitis."
    explanation: Subgroup analysis links ANXA11 variation specifically to the uveitis phenotype, providing a genotype-phenotype edge from genetic susceptibility to ocular manifestation.
- name: NOTCH4 Variants
  association: Susceptibility
  notes: NOTCH4 reached genome-wide significance in African American sarcoidosis GWAS, independent of other MHC region loci.
  gene_term:
    preferred_term: NOTCH4
    term:
      id: hgnc:7884
      label: NOTCH4
  evidence:
  - reference: PMID:22952805
    reference_title: "Genome-wide association study of African and European Americans implicates multiple shared and ethnic specific loci in sarcoidosis susceptibility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel sarcoidosis-associated locus, NOTCH4, that reached genome-wide significance in the combined AA samples (rs715299, P(AA-meta) = 6.51 × 10(-10)) and demonstrated the independence of this locus from others in the MHC region in the same sample."
    explanation: GWAS in African Americans identifies NOTCH4 as a genome-wide significant sarcoidosis susceptibility locus independent of other MHC loci.
- name: IL27RA Variants
  association: Susceptibility
  notes: IL27RA variants have been associated with sarcoidosis susceptibility; IL-27 receptor signalling modulates Th1/Th17 balance relevant to granulomatous inflammation.
  gene_term:
    preferred_term: IL27RA
    term:
      id: hgnc:17290
      label: IL27RA
  evidence:
  - reference: PMID:31273209
    reference_title: "Sarcoidosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Genetic factors affect not only the risk of developing sarcoidosis but also the disease course, which is highly variable and difficult to predict."
    explanation: Nature Reviews Disease Primers review supports a polygenic contribution to sarcoidosis susceptibility including cytokine receptor variants; IL27RA is one of the implicated loci.
- name: TSC2 / mTORC1 Pathway
  association: Mechanistic
  notes: Reduced TSC1/TSC2 function or increased upstream PI3K-Akt signalling de-represses mTORC1 in macrophages, producing CDK4-driven proliferation and granuloma formation. This pathway is functionally implicated in sarcoidosis progression rather than acting as a Mendelian risk gene.
  gene_term:
    preferred_term: TSC2
    term:
      id: hgnc:12363
      label: TSC2
  evidence:
  - reference: PMID:28092373
    reference_title: "Chronic signaling via the metabolic checkpoint kinase mTORC1 induces macrophage granuloma formation and marks sarcoidosis progression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TSC2-deficient macrophages formed mTORC1-dependent granulomatous structures in vitro and showed constitutive proliferation that was mediated by the neo-expression of cyclin-dependent kinase 4 (CDK4)."
    explanation: Defines the molecular mechanism by which TSC2 loss in macrophages activates mTORC1 and induces CDK4-driven granulomatous proliferation, the macrophage-intrinsic engine of sarcoid granuloma maintenance.
environmental:
- name: Occupational Exposures
  influences_mechanisms:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sarcoidosis needs an antigen, and the inhaled inorganic dusts with the
      strongest and most consistent associations are the leading candidates
      for it. Whether they act as the antigen itself or as an adjuvant
      unmasking a self-antigen is unresolved, which is why the link is
      indirect.
    evidence:
    - reference: PMID:35156713
      reference_title: "Sarcoidosis in Northern Ontario hard-rock miners: A case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Occupational exposures for which associations are strongest and most consistent are silica and other inorganic dusts, World Trade Center (WTC) dust, and metals."
      explanation: >-
        Identifies silica, other inorganic dusts and World Trade Center dust
        as the occupational exposures with the strongest and most consistent
        associations with the disease.
  notes: Associations have been reported with silica, other inorganic dusts, metals, and related occupational dust exposures.
  evidence:
  - reference: PMID:35156713
    reference_title: "Sarcoidosis in Northern Ontario hard-rock miners: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Occupational exposures for which associations are strongest and most consistent are silica and other inorganic dusts, World Trade Center (WTC) dust, and metals."
    explanation: This occupational case series review directly supports industrial dust and metal exposure as relevant environmental associations in sarcoidosis.
  - reference: PMID:41963075
    reference_title: "Occupational exposure to toxic particles and risk of pulmonary sarcoidosis: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The results suggested that occupational silica, pesticides, mould/mildew
      and World Trade Center ((WTC) dust exposures were associated with
      increased odds of pulmonary sarcoidosis. Sensitivity analysis confirmed
      the robustness of the association for WTC dust and mould, whereas the risk
      associated with silica appeared attenuated in high-quality studies.
      However, gold exposure was identified as a protective factor.
    explanation: >-
      This systematic review and meta-analysis supports class-specific
      occupational associations while showing sensitivity to study quality and
      heterogeneity. It does not identify an initiating trigger mechanism.
- name: Microbial Bioaerosol and Musty-Odor Work Environments
  influences_mechanisms:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inhaled microbial bioaerosol is the organic counterpart of the inorganic
      dust route, supplying antigen to the same T-cell activation step.
    evidence:
    - reference: PMID:15347561
      reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In multivariable modeling, we observed elevated ORs for work in areas with musty odors (OR 1.62, CI 1.24-2.11) and with occupational exposure to insecticides (OR 1.61, CI 1.13-2.28), and a decreased OR related to ever smoking cigarettes (OR 0.65, CI 0.51-0.82)."
      explanation: >-
        Reports an elevated odds ratio of 1.62 for work in areas with musty
        odours, an inhaled microbial bioaerosol exposure.
  notes: >-
    ACCESS found modest associations with reported mold/mildew or musty-odor
    work environments (adjusted OR 1.62, CI 1.24-2.11); these observations do
    not establish a specific organism, antigen, or causal exposure pathway.
  evidence:
  - reference: PMID:15347561
    reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariable modeling, we observed elevated ORs for work in areas with
      musty odors (OR 1.62, CI 1.24-2.11) and with occupational exposure to
      insecticides (OR 1.61, CI 1.13-2.28), and a decreased OR related to ever
      smoking cigarettes (OR 0.65, CI 0.51-0.82).
    explanation: >-
      The matched ACCESS case-control study supports an association with
      reported microbial-bioaerosol work environments, not a causal bioaerosol
      species or mechanism.
- name: Occupational Insecticide Exposure
  exposure_term:
    preferred_term: exposure to insecticide
    term:
      id: ECTO:9000089
      label: exposure to insecticide
  influences_mechanisms:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Insecticide exposure is an established risk factor but is not a
      plausible antigen in the way dust or bioaerosol is; it is graded as
      predisposing, and its effect is reported to depend on genetic
      background.
    evidence:
    - reference: PMID:30793815
      reference_title: "Extended methods for gene-environment-wide interaction scans in studies of admixed individuals with varying degrees of relationships."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We applied the proposed method to conduct a GEWIS of a known sarcoidosis risk factor (insecticide exposure) and risk of sarcoidosis in African Americans and identified two novel loci with suggestive evidence of G × E interaction."
      explanation: >-
        Treats insecticide exposure as a known sarcoidosis risk factor in a
        gene-environment interaction study, an established association whose
        action is modified by genotype.
  notes: >-
    ACCESS found a modest adjusted association with occupational insecticide
    exposure; questionnaire ascertainment and residual confounding limit causal
    interpretation.
  evidence:
  - reference: PMID:15347561
    reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariable modeling, we observed elevated ORs for work in areas with
      musty odors (OR 1.62, CI 1.24-2.11) and with occupational exposure to
      insecticides (OR 1.61, CI 1.13-2.28), and a decreased OR related to ever
      smoking cigarettes (OR 0.65, CI 0.51-0.82).
    explanation: >-
      The adjusted ACCESS estimate supports an epidemiologic association, not
      proof that insecticides initiate sarcoidosis or use a defined immune
      pathway.
  - reference: PMID:30793815
    reference_title: Extended methods for gene-environment-wide interaction scans in studies of admixed individuals with varying degrees of relationships.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We applied the proposed method to conduct a GEWIS of a known sarcoidosis
      risk factor (insecticide exposure) and risk of sarcoidosis in African
      Americans and identified two novel loci with suggestive evidence of G × E
      interaction.
    explanation: >-
      This analysis identifies two suggestive insecticide-by-locus interaction
      leads in one African American study population. It does not establish
      insecticide causality, replicate the specific ACCESS HLA-exposure pairs,
      or define an immune pathway.
- name: Agricultural Employment
  influences_mechanisms:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An occupational setting rather than an exposure, bundling insecticide,
      organic dust and bioaerosol contact. It raises the chance of
      encountering a candidate antigen without specifying which.
    evidence:
    - reference: PMID:15347561
      reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified several exposures associated with sarcoidosis risk, including insecticides, agricultural employment, and microbial bioaerosols."
      explanation: >-
        Lists agricultural employment among the exposures associated with
        sarcoidosis risk, a setting that aggregates several candidate
        exposures.
  notes: >-
    Agricultural employment was associated with sarcoidosis in ACCESS (OR 1.46,
    CI 1.13-1.89), but the occupation aggregates heterogeneous chemical, dust,
    and bioaerosol exposures.
  evidence:
  - reference: PMID:15347561
    reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified several exposures associated with sarcoidosis risk,
      including insecticides, agricultural employment, and microbial
      bioaerosols.
    explanation: >-
      The ACCESS association identifies agricultural employment as an exposure
      lead but does not resolve which correlated exposure, if any, is causal.
- name: Cigarette Smoking History
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  influences_mechanisms:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One of the few well-replicated inverse associations in respiratory
      disease: smoking is consistently less common among sarcoidosis cases
      than controls. Recorded as protective because that is the direction the
      data show, with the caveat that confounding by ascertainment is not
      excluded and no protective mechanism is established.
    evidence:
    - reference: PMID:15347561
      reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A history of ever smoking cigarettes was less frequent among cases than control subjects (OR 0.62, CI 0.50-0.77)."
      explanation: >-
        Reports ever-smoking as significantly less frequent among cases than
        controls, an odds ratio of 0.62 indicating an inverse association
        rather than a risk.
  notes: >-
    Ever-smoking history was inversely associated with sarcoidosis in ACCESS.
    Separately, a Swedish case-control study reported subgroup-specific additive
    interactions between smoking and variants in FCRL1 in Löfgren syndrome and
    IL23R in non-Löfgren disease. This genotype-conditional signal is not
    equivalent to a marginal smoking effect; neither observational result
    establishes a causal protective or harmful effect of smoking.
  evidence:
  - reference: PMID:15347561
    reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A history of ever smoking cigarettes was less frequent among cases than
      control subjects (OR 0.62, CI 0.50-0.77).
    explanation: >-
      ACCESS documents an inverse case-control association, which may reflect
      biological effects, selection, behavior change, or confounding and does
      not support recommending smoking.
  - reference: PMID:31819081
    reference_title: A Gene-Environment Interaction Between Smoking and Gene polymorphisms Provides a High Risk of Two Subgroups of Sarcoidosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessment of smoking effects with inclusion of genetic information
      revealed 53 (in LS) and 34 (in non-LS) SNP-smoking additive interactions
      at false discovery rate (FDR) below 5%. The lead signals interacting with
      smoking were rs12132140 (AP = 0.56, 95% CI = 0.22-0.90), p = 1.28e-03) in
      FCRL1 for LS and rs61780312 (AP = 0.62, 95% CI = 0.28-0.90), p = 3e-04) in
      IL23R for non-LS.
    explanation: >-
      The FCRL1 and IL23R findings are genotype-conditional joint interaction
      signals from one cohort, not a marginal estimate like the inverse ACCESS
      association. They qualify interpretation of smoking history without
      establishing that smoking is protective or harmful across genotypes.
- name: Infectious Triggers
  influences_mechanisms:
  - target: Antigen Recognition and CD4+ T-Cell Activation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mycobacterial and propionibacterial antigens are the most-studied
      candidate antigens, consistent with a granulomatous response to
      persistent poorly degradable material. No organism has been established
      as causal, so the intermediates are left unknown.
    evidence:
    - reference: PMID:22596102
      reference_title: "Localization of propionibacterium acnes in granulomas supports a possible etiologic link between sarcoidosis and the bacterium."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mycobacterial and propionibacterial organisms are the most commonly implicated potential etiologic agents."
      explanation: >-
        Names mycobacterial and propionibacterial organisms as the most
        commonly implicated potential etiologic agents, candidate antigens
        rather than proven causes.
  notes: Mycobacterial and propionibacterial antigens have been implicated as potential triggers
  evidence:
  - reference: PMID:22596102
    reference_title: "Localization of propionibacterium acnes in granulomas supports a possible etiologic link between sarcoidosis and the bacterium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mycobacterial and propionibacterial organisms are the most commonly implicated potential etiologic agents."
    explanation: This pathology study directly supports mycobacterial and propionibacterial organisms as leading infectious candidates in sarcoidosis pathogenesis.
treatments:
- name: Corticosteroid Therapy
  description: >
    First-line treatment for symptomatic sarcoidosis. Prednisone typically
    initiated at 20-40mg daily with gradual taper over months. Effective
    for most organ manifestations.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  evidence:
  - reference: PMID:31485575
    reference_title: "Clinical Manifestations, Diagnosis, and Treatment of Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucocorticoids are the cornerstone of treatment of sarcoidosis even though evidence from randomized controlled studies is lacking."
    explanation: This Mayo Clinic review establishes glucocorticoids as the cornerstone of sarcoidosis treatment.
  - reference: PMID:38227868
    reference_title: "Sarcoidosis: Evaluation and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticosteroids are the initial treatment for active disease, with refractory cases often requiring immunosuppressive or biologic therapies."
    explanation: This 2024 review confirms corticosteroids as first-line initial treatment for active sarcoidosis.
- name: Methotrexate
  description: >
    Most commonly used steroid-sparing agent for chronic sarcoidosis. Allows
    reduction of corticosteroid dose while maintaining disease control. The
    PREDMETH trial (NEJM 2025) demonstrated noninferiority of methotrexate to
    prednisone for 24-week change in % predicted FVC, supporting methotrexate
    as a first-line option in selected patients.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: Th17.1 Polarization and IFN-gamma Production
    treatment_effect: INHIBITS
    description: Methotrexate suppresses pathogenic Th17/Th17.1 effector responses central to granuloma maintenance.
  evidence:
  - reference: PMID:41095908
    reference_title: "Immunosuppressive Therapies in Pulmonary Sarcoidosis: A Practical, Evidence-Based Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antimetabolites such as methotrexate, azathioprine, mycophenolate mofetil, and leflunomide are commonly used second-line therapies."
    explanation: This evidence-based review directly supports methotrexate as a standard second-line steroid-sparing therapy in pulmonary sarcoidosis.
  - reference: PMID:40387020
    reference_title: "First-Line Treatment of Pulmonary Sarcoidosis with Prednisone or Methotrexate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methotrexate was noninferior to prednisone with regard to the primary end point, with an adjusted between-group difference of -1.17 percentage points (95% CI, -4.27 to 1.93)."
    explanation: The PREDMETH NEJM 2025 noninferiority trial demonstrates methotrexate is noninferior to prednisone for FVC change in pulmonary sarcoidosis, supporting methotrexate as a viable first-line alternative.
- name: Anti-TNF Therapy
  description: >
    Anti-TNF agents, particularly infliximab, are used for refractory
    sarcoidosis when corticosteroids and steroid-sparing agents are
    insufficient. Because TNF is a non-redundant amplifier of macrophage
    recruitment and granuloma maintenance, its neutralization impairs
    granuloma integrity - the granuloma-formation-module drug-target pattern.
    This benefit carries a class boxed warning for reactivation of latent
    tuberculosis, where TNF blockade dissolves protective granulomas.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: biologic therapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: infliximab
      term:
        id: NCIT:C1789
        label: Infliximab
  target_mechanisms:
  - target: Macrophage Activation and mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: TNF neutralization removes a non-redundant amplifier of macrophage recruitment and activation, impairing granuloma initiation and maintenance.
  evidence:
  - reference: PMID:41095908
    reference_title: "Immunosuppressive Therapies in Pulmonary Sarcoidosis: A Practical, Evidence-Based Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For refractory disease, particularly in those with metabolically active lesions on FDG-PET, anti-tumor necrosis factor (TNF) agents like infliximab may be effective but carry risks of serious adverse effects."
    explanation: This evidence-based review directly supports anti-TNF therapy, especially infliximab, as an option for refractory sarcoidosis.
- name: JAK Inhibitor Therapy
  description: >
    Janus kinase inhibitors (tofacitinib, ruxolitinib) are emerging
    steroid-sparing options that target IFN-gamma/JAK-STAT signalling
    downstream of Th17.1 cells. Pilot studies in corticosteroid-dependent and
    cutaneous sarcoidosis report benefit; larger trials are ongoing.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Th17.1 Polarization and IFN-gamma Production
    treatment_effect: INHIBITS
    description: JAK inhibitors block IFN-gamma/JAK-STAT signalling, attenuating the Th17.1-driven IFN-gamma feedback that sustains granulomatous inflammation.
  evidence:
  - reference: PMID:33825964
    reference_title: "Tofacitinib as a Steroid-Sparing Therapy in Pulmonary Sarcoidosis, an Open-Label Prospective Proof-of-Concept Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this proof-of-concept study, the addition of a JAK-inhibitor allowed 60% of patients with pulmonary sarcoidosis to successfully taper corticosteroids."
    explanation: Open-label proof-of-concept trial (NCT03793439) demonstrates tofacitinib enables steroid tapering in corticosteroid-dependent pulmonary sarcoidosis, supporting JAK inhibitors as a steroid-sparing option.
- name: mTOR Inhibitor Therapy (Investigational)
  description: >
    Inhibition of mTORC1 with rapamycin/everolimus completely resolved
    granulomas in Tsc2-deficient mouse models and successful single-patient
    use of rapamycin has been reported. Currently investigational in human
    sarcoidosis but mechanistically targeted at the macrophage-intrinsic
    granuloma maintenance arm.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Macrophage Activation and mTORC1 Hyperactivation
    treatment_effect: INHIBITS
    description: Rapamycin/everolimus directly inhibit the mTORC1 signalling that drives macrophage proliferation and granuloma maintenance.
  evidence:
  - reference: PMID:28092373
    reference_title: "Chronic signaling via the metabolic checkpoint kinase mTORC1 induces macrophage granuloma formation and marks sarcoidosis progression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of mTORC1 induced apoptosis and completely resolved granulomas in myeloid TSC2-deficient mice."
    explanation: Pharmacologic mTORC1 inhibition resolves granulomas in a sarcoid-like animal model, providing the rationale for mTOR-targeted human therapy.
discussions:
- discussion_id: gap_sarcoidosis_antigen_persistence_resolution
  prompt: >-
    Which antigenic triggers and host immune-cell circuits determine whether a
    sarcoidosis granuloma resolves, persists as chronic inflammatory disease, or
    transitions to fibrotic organ damage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
  - pathophysiology#Th17.1 Polarization and IFN-gamma Production
  - pathophysiology#Macrophage Activation and mTORC1 Hyperactivation
  - pathophysiology#Granuloma Formation
  - pathophysiology#Fibrotic Tissue Remodeling
  rationale: >-
    The entry captures a plausible antigen-driven CD4 T-cell, Th17.1, Treg,
    macrophage, and mTORC1 cascade, but the disease-defining upstream antigen
    remains unknown and the switch from spontaneous resolution to chronic
    granuloma persistence or fibrosis is not causally resolved. This matters
    because current treatment suppresses granulomatous inflammation after organ
    dysfunction appears; it does not yet stratify patients by antigen source,
    antigen clearance, granuloma metabolic state, or fibrotic transition risk.
  proposed_experiments:
  - experiment_id: exp_sarcoidosis_longitudinal_granuloma_resolution_map
    name: Longitudinal sarcoidosis granuloma antigen and resolution map
    description: >-
      Profile newly diagnosed sarcoidosis patients with paired bronchoalveolar
      lavage, blood, and when clinically obtained granuloma biopsies at
      diagnosis and follow-up. Combine antigen discovery
      (mycobacterial/propionibacterial/environmental peptide and nucleic-acid
      panels), TCR clonotype tracking, spatial single-cell transcriptomics, and
      perturbation of patient-derived macrophage/T-cell cultures with antigen
      withdrawal, Treg-restoring conditions, IFN-gamma/JAK blockade, and mTORC1
      inhibition. Compare patients who spontaneously remit with those who
      develop chronic pulmonary disease or fibrosis.
    experiment_type:
      preferred_term: longitudinal human granuloma perturbation experiment
    model_systems:
    - name: Patient-derived pulmonary sarcoidosis immune-cell culture
      description: >-
        Paired bronchoalveolar lavage and biopsy-derived macrophage-lineage
        cells, CD4+ T cells, and fibroblast-containing granuloma explant or
        coculture systems from remitting and chronic/progressive sarcoidosis
        patients.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: lung
        term:
          id: UBERON:0002048
          label: lung
      cell_types:
      - preferred_term: alveolar macrophage
        term:
          id: CL:0000583
          label: alveolar macrophage
      - preferred_term: CD4-positive helper T cell
        term:
          id: CL:0000492
          label: CD4-positive helper T cell
      - preferred_term: fibroblast
        term:
          id: CL:0000057
          label: fibroblast
    perturbations:
    - name: Antigen candidate exposure and withdrawal
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Test whether candidate microbial, self, or environmental antigens
        maintain TCR clonotype activation and granuloma-like organization, and
        whether withdrawal collapses the inflammatory program.
      effect: antigen presence versus clearance
    - name: mTORC1 and IFN-gamma/JAK pathway blockade
      target: pathophysiology#Macrophage Activation and mTORC1 Hyperactivation
      description: >-
        Compare rapamycin/everolimus-like mTORC1 inhibition and JAK blockade
        for their ability to induce macrophage apoptosis, reduce glycolytic
        granuloma-state markers, and interrupt Th17.1-macrophage feedback.
      effect: decreased granuloma persistence signaling
    readouts:
    - name: Antigen-specific TCR clonotype persistence
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Persistence or contraction of antigen-reactive CD4+ T-cell clonotypes
        over time and after antigen withdrawal in culture.
    - name: Progressive macrophage metabolic state
      target: pathophysiology#Macrophage Activation and mTORC1 Hyperactivation
      description: >-
        p-S6, Ki-67, glycolysis, and apoptosis readouts that distinguish
        remitting from chronic/progressive granuloma macrophages.
    - name: Fibrotic transition signal
      target: pathophysiology#Fibrotic Tissue Remodeling
      description: >-
        Spatial TGF-beta signaling, fibroblast activation, extracellular matrix
        organization, and pulmonary-function trajectory used to determine
        whether persistent granuloma circuits predict fibrotic organ damage.
    decision_criterion: >-
      The antigen-persistence model would be strengthened if remitting patients
      show antigen-reactive clonotype contraction and loss of macrophage
      mTORC1/glycolytic signals, while chronic or fibrotic patients retain
      antigen-reactive clonotypes, Th17.1/Treg imbalance, macrophage p-S6/Ki-67
      activity, and fibroblast activation despite standard immunosuppression.
  evidence:
  - reference: PMID:31273209
    reference_title: "Sarcoidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease develops in genetically predisposed individuals with exposure to an as-yet unknown antigen."
    explanation: >
      Establishes unknown antigen identity as a central unresolved upstream
      causal step.
  - reference: PMID:33329511
    reference_title: "Treatment of Sarcoidosis: A Multidisciplinary Approach."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Over half of patients with sarcoidosis will incur spontaneous resolution or never have clinical manifestations of the disease, whereas the remaining half will experience a more chronic course, often requiring treatment."
    explanation: >
      Supports the resolution-versus-chronicity split that the proposed
      longitudinal experiment is designed to distinguish.
  - reference: PMID:38165044
    reference_title: "Immune mechanisms of granuloma formation in sarcoidosis and tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite major steps in understanding the cause of this disease, many questions remain."
    explanation: >
      Recent mechanistic review explicitly frames granuloma-cause and
      granuloma-mechanism uncertainty as an active knowledge gap.
- discussion_id: gap_sarcoidosis_exposure_genotype_trigger_mechanism
  prompt: >-
    Which inhaled exposure classes, host genotypes, innate sensors, and
    HLA-restricted antigens form a reproducible causal chain from exposure to
    CD4+ T-cell polarization and pulmonary granuloma initiation in idiopathic
    sarcoidosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - environmental#Occupational Exposures
  - pathophysiology#Genetic Susceptibility
  - pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
  - pathophysiology#Th17.1 Polarization and IFN-gamma Production
  - pathophysiology#Granuloma Formation
  rationale: >-
    Case-control studies associate several bioaerosol and inorganic-particle
    exposures with sarcoidosis, and host genetic susceptibility is well
    established, but association does not identify an initiating antigen or
    receptor. The published ACCESS HLA-by-exposure leads use exploratory
    thresholds and lack independent replication. Separate single-cohort
    genome-wide analyses report smoking interactions at FCRL1 and IL23R and
    suggestive insecticide interactions at two loci, but neither independently
    replicates the ACCESS pairs or supplies the missing mechanism; a WTC cohort
    did not detect interaction with its exposure-degree measure. No
    non-beryllium exposure has been linked in idiopathic sarcoidosis through a
    defined sensor, HLA-presented antigen, antigen-specific CD4 response, and
    granuloma phenotype. Exposure-defined mimics such as chronic beryllium
    disease must be excluded rather than generalized to idiopathic disease. The
    required epidemiologic interaction and cellular causal chain should
    therefore be tested separately and then connected only if both replicate.
  proposed_experiments:
  - experiment_id: exp_sarcoidosis_exposure_hla_interaction_replication
    name: Preregistered exposure-by-HLA replication in incident pulmonary sarcoidosis
    description: >-
      Enroll treatment-naive incident pulmonary-sarcoidosis cases and matched
      controls in two independent, ancestry-diverse cohorts. Ascertain
      prespecified mold/microbial-bioaerosol, insecticide, silica/inorganic-dust,
      and WTC-like mixed-particle exposures with blinded industrial-hygiene
      review, job-exposure matrices, and quantitative duration or dose rather
      than case-only recall. Exclude or separately adjudicate chronic beryllium
      disease with exposure history and beryllium lymphocyte proliferation
      testing when appropriate, as well as silicosis and hypersensitivity
      pneumonitis. Genotype HLA class II and established risk loci. Estimate
      exposure main effects and additive and multiplicative
      genotype-by-exposure interactions with ancestry, smoking, occupation,
      geography, and socioeconomic confounders prespecified; replicate each
      exposure-allele pair and phenotype stratum before mechanistic follow-up.
    experiment_type:
      preferred_term: prospective exposure-genotype interaction study
    readouts:
    - name: Exposure-class association
      target: environmental#Occupational Exposures
      description: >-
        Exposure-specific adjusted effect estimates with dose-response,
        temporality, negative-control exposures, and between-cohort replication.
      direction: THRESHOLD_DEPENDENT
      interpretation: >-
        A modest main effect can prioritize an exposure class but cannot alone
        establish a trigger mechanism.
    - name: Replicated genotype-by-exposure interaction
      target: pathophysiology#Genetic Susceptibility
      description: >-
        Prespecified additive and multiplicative interaction estimates for each
        HLA or non-HLA risk allele and exposure class, including confidence
        intervals and independent-cohort replication.
      direction: THRESHOLD_DEPENDENT
      interpretation: >-
        Only a replicated interaction with exposure preceding disease
        prioritizes a specific host-exposure pair for the cellular experiment.
    - name: Incident granulomatous disease phenotype
      target: pathophysiology#Granuloma Formation
      description: >-
        Centrally adjudicated incident pulmonary sarcoidosis, organ pattern, and
        Löfgren versus non-Löfgren presentation and acute-resolving versus
        chronic or fibrotic course.
      direction: POSITIVE
    controls:
    - name: Exposed unaffected controls
      description: >-
        Participants with comparable measured exposure and ancestry who do not
        develop sarcoidosis, separating exposure from disease response.
    - name: Genetically matched unexposed controls
      description: >-
        Participants carrying the candidate allele without the candidate
        exposure, separating genotype from the interaction.
    - name: Negative-control exposure and allele pairs
      description: >-
        Prespecified unrelated exposures and alleles used to detect recall,
        occupational, ancestry, or multiple-testing artifacts.
    decision_criterion: >-
      The gene-environment arm is supported only when the same prespecified
      exposure-allele pair shows exposure-before-disease temporality, a
      corrected interaction effect beyond both main effects, a compatible
      dose-response, and directionally consistent replication. Main effects
      without interaction support only separate exposure and host-risk nodes.
      A well-powered null interaction across both cohorts would weaken that
      specific pair, not exclude other exposures, alleles, or non-genetic
      susceptibility.
    would_support:
    - mechanistic_hypothesis#environmental_exposure_host_susceptibility_trigger_model
  - experiment_id: exp_sarcoidosis_exposure_sensor_hla_causal_chain
    name: Exposure-matched sensor-to-HLA-to-CD4 pulmonary causal-chain assay
    description: >-
      For exposure-allele pairs that replicate epidemiologically, compare
      bronchoalveolar antigen-presenting cells and autologous CD4+ T cells from
      treatment-naive pulmonary-sarcoidosis cases, exposed unaffected controls,
      and allele-matched unexposed controls. Apply chemically and
      microbiologically characterized matched and mismatched exposure
      preparations in a short time course. Use orthogonal blockade or editing
      of response-nominated innate sensors and HLA class II, then measure early
      antigen-presenting-cell responses, HLA-bound peptides, antigen-specific
      TCR activation, Th1/Th17.1 polarization, and granuloma-like organization.
      Advance only exposure preparations that are endotoxin-controlled,
      noncytotoxic, and reproducible across donors.
    experiment_type:
      preferred_term: exposure-stratified pulmonary immune-cell perturbation assay
    model_systems:
    - name: Autologous alveolar antigen-presenting-cell and CD4+ T-cell coculture
      description: >-
        Bronchoalveolar macrophage or dendritic-cell preparations cocultured
        with autologous CD4+ T cells from cases and matched control groups.
      experimental_model_type: CO_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: lung
        term:
          id: UBERON:0002048
          label: lung
      cell_types:
      - preferred_term: alveolar macrophage
        term:
          id: CL:0000583
          label: alveolar macrophage
      - preferred_term: conventional dendritic cell
        term:
          id: CL:0000990
          label: conventional dendritic cell
      - preferred_term: CD4-positive helper T cell
        term:
          id: CL:0000492
          label: CD4-positive helper T cell
    perturbations:
    - name: Matched and mismatched exposure challenge
      target: environmental#Occupational Exposures
      description: >-
        Compare the epidemiologically matched exposure preparation with other
        exposure classes, vehicle, and dose-matched particle or bioaerosol
        controls.
      effect: exposure-class-specific challenge
    - name: Candidate innate-sensor loss or blockade
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Perturb only sensors nominated by an early reproducible response, using
        genetic and pharmacologic approaches with on-target rescue where
        feasible.
      effect: reduced candidate exposure sensing
    - name: HLA class II blockade
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Block the implicated HLA-DR or HLA-DP presentation step and compare it
        with isotype and irrelevant-HLA controls.
      effect: reduced HLA-restricted antigen presentation
    readouts:
    - name: Early antigen-presenting-cell response
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Time-resolved uptake, viability, sensor-proximal signaling, cytokines,
        costimulatory state, and HLA class II surface abundance before T-cell
        activation.
      direction: POSITIVE
    - name: Exposure-linked HLA immunopeptidome and TCR response
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Exposure-derived or exposure-modified-self HLA-bound peptides,
        peptide-specific tetramer responses, and activation of expanded
        granuloma-linked TCR clonotypes.
      direction: POSITIVE
    - name: CD4+ T-cell polarization
      target: pathophysiology#Th17.1 Polarization and IFN-gamma Production
      description: >-
        Antigen-specific IFN-gamma/IL-17A production, Th1/Th17.1 state, and Treg
        balance after matched versus mismatched challenge.
      direction: POSITIVE
    - name: Granuloma-like organization
      target: pathophysiology#Granuloma Formation
      description: >-
        Multicellular aggregate formation, macrophage epithelioid state, and
        spatial T-cell/macrophage organization distinguished from nonspecific
        toxicity or foreign-body aggregation.
      direction: POSITIVE
    controls:
    - name: Exposed unaffected donor cells
      description: >-
        Tests whether the candidate response is a generic consequence of
        exposure rather than a disease- or susceptibility-linked response.
    - name: Allele-matched unexposed donor cells
      description: Separates the candidate HLA background from prior exposure.
    - name: Endotoxin, viability, and generic-particle controls
      description: >-
        Exclude contaminant-driven innate activation, cytotoxicity, and
        nonspecific foreign-body aggregation.
    - name: Matched versus mismatched exposure and HLA controls
      description: >-
        Test the exposure and restriction-element specificity required by the
        hypothesis rather than generic immune hyperreactivity.
    - name: Granulomatous disease controls
      description: >-
        Include exposure-defined chronic beryllium disease, silicosis, and
        hypersensitivity pneumonitis samples where available to distinguish an
        idiopathic-sarcoidosis response from known exposure diseases or generic
        granulomatous inflammation.
    decision_criterion: >-
      A specific trigger chain is supported only if a replicated
      exposure-allele pair produces an early, noncytotoxic
      exposure-class-specific antigen-presenting-cell response; yields a
      defined HLA-bound antigen or modified-self peptide and cognate TCR
      activation; precedes CD4 polarization and granuloma-like organization;
      and loses those downstream readouts after orthogonal sensor and
      restriction-element perturbation. Generic inflammation, aggregation
      without antigen-specific T-cell activation, a response shared by exposed
      unaffected controls, or microbial-antigen responses independent of the
      recorded exposure would favor toxicity, foreign-body, or
      antigen-persistence alternatives. Failure after adequate target
      engagement weakens only the tested exposure-sensor-HLA chain.
    would_support:
    - mechanistic_hypothesis#environmental_exposure_host_susceptibility_trigger_model
    evidence:
    - reference: PMID:30134122
      reference_title: "IL-13-regulated Macrophage Polarization during Granuloma Formation in an In Vitro Human Sarcoidosis Model."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Compared with identically treated PBMCs of control subjects (n = 5),
        purified protein derivative-treated sarcoidosis PBMCs (n = 6) were
        distinguished by the formation of cellular aggregates resembling
        granulomas.
      explanation: >-
        This small patient-cell study provides feasibility precedent for
        case-control antigen challenge and granuloma-like readouts, not evidence
        for a particular environmental exposure in vivo.
  evidence:
  - reference: PMID:42471775
    reference_title: "Current understanding of environmental exposures and sarcoidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several environmental exposures are associated with a risk for
      sarcoidosis, but their exact role is incompletely understood.
    explanation: >-
      The source review states the unresolved causal role that defines this
      knowledge gap.
  - reference: PMID:15347561
    reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study did not identify a single, predominant cause of sarcoidosis. We
      identified several exposures associated with sarcoidosis risk, including
      insecticides, agricultural employment, and microbial bioaerosols.
    explanation: >-
      The primary ACCESS study supplies exposure-class associations while
      explicitly failing to identify one cause or a mechanistic chain.
  - reference: PMID:19382531
    reference_title: "HLA and environmental interactions in sarcoidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant interaction was observed between HLA DRB1*1101 and
      insecticide exposure at work (p < 0.10) and suggestive interaction was
      observed between HLA DRB1*1101 and exposure to mold and musty odors and
      DRB1*1501 and insecticide exposure at work (P < 0.15).
    explanation: >-
      These exploratory interaction thresholds motivate preregistered
      replication but are insufficient for a causal exposure-allele edge.
  - reference: PMID:25305207
    reference_title: "Genetic susceptibility to beryllium: a case-referent study of men and women of working age with sarcoidosis or other chronic lung disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No increase in sarcoidosis was seen with either Glu69 or beryllium
      exposure (none, <10, ≥10 years) as main effects: longer duration in
      possible beryllium jobs was related to COPD. In Glu69 positive men with
      exposure ≥10 years, the trend towards increasing rate of COPD was
      reversed, and a significant interaction of duration of exposure and Glu69
      was detected (OR=4.51 95% CI 1.17 to 17.48).
    explanation: >-
      The main-effect nulls plus the duration-by-Glu69 interaction point to
      possible chronic beryllium disease misclassified as sarcoidosis and
      justify exposure history and beryllium lymphocyte proliferation testing.
      They neither validate the idiopathic trigger model nor broadly refute
      gene-environment interaction.
  - reference: PMID:31126090
    reference_title: "Genetic Variants Associated with FDNY WTC-Related Sarcoidosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our secondary analysis, we did not find statistical evidence of an
      interaction between common variants and the degree of WTC exposure.
    explanation: >-
      The null result constrains a dose-dependent WTC gene-exposure interaction
      and requires candidate pairs to replicate in adequately powered cohorts.
  - reference: PMID:20813038
    reference_title: "No evidence of altered alveolar macrophage polarization, but reduced expression of TLR2, in bronchoalveolar lavage cells in sarcoidosis."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Overall, there was no evidence for alveolar macrophage polarization in
      sarcoidosis. However, there was a reduced TLR2 mRNA expression in patients
      with Löfgren's syndrome, which may be of relevance for macrophage
      interactions with a postulated sarcoidosis pathogen, and for the
      characteristics of the ensuing T cell response.
    explanation: >-
      These bronchoalveolar observations constrain a uniform macrophage
      polarization or TLR2-expression account. They do not exclude other PRRs
      or an exposure-specific sensing program and therefore do not justify a
      TLR2 trigger edge.
- discussion_id: gap_sarcoidosis_immunologic_paradox_anergy_vs_activation
  prompt: >-
    Why does sarcoidosis combine vigorous compartmentalized granulomatous CD4+
    Th1/Th17.1 activity at disease sites with peripheral T-cell lymphopenia,
    anergy, and PD-1+ exhaustion, and would restoring exhausted T-cell function
    promote resolution or instead intensify granulomatous inflammation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
  - pathophysiology#Th17.1 Polarization and IFN-gamma Production
  rationale: >-
    Sarcoidosis presents a long-standing immunologic paradox: an exaggerated,
    IFN-gamma-rich local granulomatous CD4+ T-cell response coexists with
    systemic hyporesponsiveness - cutaneous anergy, peripheral CD4+ lymphopenia,
    reduced proliferation on TCR stimulation, and PD-1+ exhaustion markers. This
    matters therapeutically and is directionally unresolved: CD4+ T-cell
    exhaustion reverses in patients who spontaneously remit (suggesting
    exhaustion tracks with, and may even favor, resolution), yet
    checkpoint-inhibitor cancer therapy that reverses T-cell exhaustion can
    precipitate sarcoid-like granulomatous reactions. Whether checkpoint
    restoration would clear persistent antigen and resolve disease or instead
    reignite granuloma formation is unknown, and the entry's antigen/T-cell
    nodes do not currently capture this exhaustion axis.
  proposed_experiments:
  - experiment_id: exp_sarcoidosis_tcell_exhaustion_resolution_tracking
    name: Longitudinal T-cell exhaustion versus resolution tracking with ex vivo checkpoint modulation
    description: >-
      In newly diagnosed sarcoidosis patients, serially phenotype paired
      peripheral-blood and bronchoalveolar-lavage CD4+ T cells for exhaustion
      (PD-1, TIM-3, LAG-3), proliferative capacity, Th1/Th17.1 cytokine output,
      and apoptosis, stratifying by subsequent spontaneous resolution versus
      chronic/progressive course. In parallel, apply ex vivo PD-1/PD-L1 blockade
      to patient-derived cells and PBMC granuloma-in-a-dish models to test
      whether reversing exhaustion enhances antigen clearance or amplifies
      granuloma formation.
    experiment_type:
      preferred_term: longitudinal immunophenotyping with ex vivo checkpoint perturbation
    model_systems:
    - name: Paired blood and BAL CD4+ T cells with PBMC granuloma model
      description: >-
        Serial peripheral-blood and bronchoalveolar-lavage CD4+ T cells from
        remitting and chronic sarcoidosis patients, plus autologous PBMC-derived
        granuloma-in-a-dish cultures for checkpoint-modulation readouts.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: lung
        term:
          id: UBERON:0002048
          label: lung
      cell_types:
      - preferred_term: CD4-positive helper T cell
        term:
          id: CL:0000492
          label: CD4-positive helper T cell
    readouts:
    - name: T-cell exhaustion trajectory versus clinical course
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        PD-1/TIM-3/LAG-3 expression, proliferative capacity, and apoptosis over
        time, compared between patients who spontaneously resolve and those who
        progress.
    - name: Effect of checkpoint blockade on granuloma output
      target: pathophysiology#Th17.1 Polarization and IFN-gamma Production
      description: >-
        Change in Th17.1/IFN-gamma output and granuloma-like aggregate
        formation after ex vivo PD-1/PD-L1 blockade, to determine whether
        exhaustion reversal favors resolution or amplifies granulomatous
        inflammation.
    decision_criterion: >-
      The exhaustion axis would be clarified if spontaneous resolvers show
      reversal of the exhaustion phenotype with restored antigen clearance,
      while ex vivo checkpoint blockade in chronic-disease cells amplifies
      Th17.1/IFN-gamma output and granuloma formation - indicating exhaustion is
      a brake whose removal is pathogenic rather than therapeutic in established
      disease.
  evidence:
  - reference: PMID:29234685
    reference_title: "Local and Systemic CD4(+) T Cell Exhaustion Reverses with Clinical Resolution of Pulmonary Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sarcoidosis CD4+ T cells demonstrated reductions in Th1 cytokine expression, proliferative capacity (p < 0.05), enhanced apoptosis (p < 0.01), and increased PD-1 expression (p < 0.001)."
    explanation: >
      Quantifies the peripheral/systemic arm of the paradox - reduced
      proliferation, cytokine output, and increased PD-1 exhaustion markers on
      sarcoidosis CD4+ T cells despite active granulomatous disease.
  - reference: PMID:29234685
    reference_title: "Local and Systemic CD4(+) T Cell Exhaustion Reverses with Clinical Resolution of Pulmonary Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reversal of CD4+ T cell exhaustion was observed in subjects undergoing spontaneous resolution"
    explanation: >
      Directly links reversal of the exhaustion phenotype to spontaneous
      clinical resolution, framing the central unresolved directional question
      of whether exhaustion is protective or pathogenic.
- discussion_id: gap_sarcoidosis_dr3_antigen_identity_and_resolution_paradox
  prompt: >-
    Is the disease-defining sarcoidosis antigen self (vimentin) or foreign
    (mycobacterial mKatG), or is there no true dichotomy because one
    HLA-DRB1*03-restricted public TCR recognizes several antigens - and why does
    HLA-DRB1*03, the allele anchoring the antigen-specific response, predict
    spontaneous resolution rather than chronic disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
  rationale: >-
    A 2026 OpenScientist hypothesis-search of the vimentin_autoimmunity_model
    surfaced two coupled unknowns. First, the antigen identity is unresolved and
    the self-versus-foreign framing may be false: the DR3+ sarcoid lung presents
    a milieu of antigens, but only the vimentin T-cell response is demonstrably
    HLA-DRB1*03-restricted, whereas responses to ATP synthase and lysyl-tRNA
    synthetase also occur in DR3-negative patients and the microbial antigen
    mKatG is documented as a tissue antigen whose relationship to the
    Valpha2.3/Vbeta22 repertoire has not been directly tested. Whether these
    antigens converge on the same public clone is unknown, and the
    molecular-mimicry bridge that would unify self and foreign is unsupported at
    the linear-sequence level. Second, and paradoxically,
    HLA-DRB1*03 - the allele that anchors this antigen-specific response - is a
    dominant good-prognosis allele predicting spontaneous resolution, which is
    hard to reconcile with classic self-perpetuating autoimmunity and instead
    favors an antigen-recognition-coupled-to-effective-clearance model. Resolving
    the antigen identity and the resolution paradox would determine whether the
    DR3-restricted response is a driver to be suppressed or a clearance program to
    be supported.
  proposed_experiments:
  - experiment_id: exp_sarcoidosis_dr3_tetramer_antigen_ranking
    name: HLA-DR3 tetramer multi-antigen ranking against clinical course
    description: >-
      In HLA-DRB1*03+ patients stratified by Lofgren/resolving versus
      non-resolving course (and DR3+ healthy controls), quantify the frequency
      and avidity of CD4+ T cells binding HLA-DR3 tetramers loaded in parallel
      with vimentin (Vim429-443), ATP synthase, lysyl-tRNA synthetase, and mKatG
      peptides, using paired bronchoalveolar-lavage and blood samples, and relate
      antigen-specific frequencies to spontaneous resolution versus progression.
    experiment_type:
      preferred_term: HLA class II tetramer antigen-ranking study
    model_systems:
    - name: HLA-DRB1*03+ sarcoidosis BAL and blood CD4+ T cells
      description: >-
        Paired bronchoalveolar-lavage and peripheral-blood CD4+ T cells from
        HLA-DRB1*03+ resolving and non-resolving sarcoidosis patients and DR3+
        controls, interrogated with a panel of DR3 peptide tetramers.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: lung
        term:
          id: UBERON:0002048
          label: lung
      cell_types:
      - preferred_term: CD4-positive helper T cell
        term:
          id: CL:0000492
          label: CD4-positive helper T cell
    readouts:
    - name: Antigen-specific tetramer frequency versus disease course
      target: pathophysiology#Antigen Recognition and CD4+ T-Cell Activation
      description: >-
        Relative frequency and avidity of vimentin-, ATP-synthase-,
        lysyl-tRNA-synthetase-, and mKatG-tetramer+ CD4+ T cells, compared between resolving
        and non-resolving DR3+ patients, testing whether any single antigen
        dominates and whether antigen-reactivity tracks with resolution.
    decision_criterion: >-
      The single-antigen vimentin model would be supported if vimentin-tetramer+
      cells dominate and predict outcome; the shared multi-antigen program would
      be supported if several antigens engage the restricted TCR at comparable
      frequency; and the clearance reframing would be supported if higher
      antigen-specific frequencies track with spontaneous resolution rather than
      progression.
  evidence:
  - reference: PMID:19786367
    reference_title: "Autoimmune T cell responses to antigenic peptides presented by bronchoalveolar lavage cell HLA-DR molecules in sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BAL T cell responses against peptides derived from ATP synthase or from lysyl-tRNA synthetase were detected in DRB10301(pos) as well as DRB10301(neg) patients"
    explanation: >
      Documents multiple HLA-DR-presented antigens beyond vimentin, motivating
      the shared multi-antigen framing over a single disease-defining antigen.
  - reference: PMID:15753209
    reference_title: "Mycobacterial catalase-peroxidase is a tissue antigen and target of the adaptive immune response in systemic sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that remnant mycobacterial catalase-peroxidase is one target of the adaptive immune response driving granulomatous inflammation in sarcoidosis"
    explanation: >
      Establishes a microbial antigen (mKatG) as a competing target of the same
      adaptive response, the foreign-antigen pole of the unresolved antigen-identity
      question.
  - reference: PMID:20187937
    reference_title: "Different HLA-DRB1 allele distributions in distinct clinical subgroups of sarcoidosis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DRB1*07, DRB1*14 and DRB1*15 generally associated with, while DRB1*01 and DRB1*03 protected against, a non-resolving disease"
    explanation: >
      Quantifies the resolution paradox: DR3 protects against non-resolving
      disease, the observation the proposed experiment is designed to reconcile
      with an antigen-specific mechanism.
- discussion_id: gap_sarcoidosis_vimentin_mouse_model_translational_validity
  prompt: >-
    Does the vimentin-immunization-plus-vimentin-bead mouse granuloma model
    reflect the mechanism of spontaneous human sarcoidosis, or does forced
    immunization and particulate bead challenge bypass the (unknown) natural
    initiating events - i.e., is vimentin a genuine initiating autoantigen in
    humans or only sufficient to drive granulomas once immunity is artificially
    established?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Self-Antigen Vimentin Presentation by HLA-DRB1*03
  - pathophysiology#Granuloma Formation
  rationale: >-
    PMID:35434591 is the only causal (rather than associative) support for the
    vimentin autoimmunity model: vimentin-immunized mice challenged with
    vimentin-coated beads develop sarcoid-like Th1/Th17 lung granulomas. This is
    genuine mechanistic evidence that anti-vimentin immunity is sufficient to
    produce sarcoid-like pathology, but its translational validity is uncertain -
    the model requires deliberate immunization against vimentin plus an
    intravenous particulate (bead) challenge, neither of which is a documented
    step in spontaneous human disease, and the model also engaged ILC2/TH2
    programs not central to human sarcoid granulomas. Per the KB convention this
    is a HUMAN_MODEL_MISMATCH (model evidence exists; human translational
    validity is the open question), not a generic knowledge gap: the question is
    not whether vimentin autoimmunity can cause granulomas but whether it
    initiates them in humans.
  proposed_experiments:
  - experiment_id: exp_sarcoidosis_vimentin_natural_initiation_test
    name: Test for spontaneous anti-vimentin priming preceding human sarcoidosis
    description: >-
      In pre-symptomatic or incident human cohorts (e.g. HLA-DRB1*03+
      individuals, or biobank samples predating diagnosis), determine whether
      anti-vimentin T-/B-cell responses and Valpha2.3/Vbeta22 clonal expansion
      arise before clinical granulomatous disease and without an obvious
      immunizing event, and whether they track antigen exposure. In parallel,
      develop a spontaneous (non-immunization, non-bead) model or ex vivo human
      granuloma-in-a-dish system to test whether endogenously processed vimentin
      is sufficient to nucleate granuloma formation.
    experiment_type:
      preferred_term: pre-symptomatic cohort plus spontaneous-model translational test
    model_systems:
    - name: Pre-diagnosis human cohort and non-immunization granuloma model
      description: >-
        Incident/pre-symptomatic HLA-DRB1*03+ human samples paired with a
        spontaneous or ex vivo human granuloma model that does not rely on forced
        vimentin immunization or particulate bead challenge.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: lung
        term:
          id: UBERON:0002048
          label: lung
      cell_types:
      - preferred_term: CD4-positive helper T cell
        term:
          id: CL:0000492
          label: CD4-positive helper T cell
    readouts:
    - name: Temporal order of anti-vimentin immunity versus disease onset
      target: pathophysiology#Self-Antigen Vimentin Presentation by HLA-DRB1*03
      description: >-
        Whether anti-vimentin T-/B-cell reactivity and Valpha2.3/Vbeta22 clonal
        expansion precede clinical granulomatous disease in humans without a
        deliberate immunizing event.
    decision_criterion: >-
      The mouse model's translational validity would be supported if
      anti-vimentin immunity and the restricted clone arise spontaneously before
      human disease onset and endogenous vimentin nucleates granulomas without
      artificial immunization/bead challenge; it would be undercut if
      anti-vimentin responses are only a downstream consequence of established
      granulomatous tissue damage.
  evidence:
  - reference: PMID:35434591
    reference_title: "Systemic immune response to vimentin and granuloma formation in a model of pulmonary sarcoidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Vimentin-immunized mice developed lung granulomas following intravenous challenge with vimentin-coated beads."
    explanation: >
      The causal mouse result whose translational validity to spontaneous human
      sarcoidosis this HUMAN_MODEL_MISMATCH discussion frames as the open
      question - it requires deliberate immunization and bead challenge.
datasets:
- accession: geo:GSE302854
  title: Differential Transcriptome Features of Peripheral Blood Mononuclear Cells in Pulmonary Sarcoidosis with and without Extrapulmonary Lesions
  description: Sarcoidosis is a systemic granulomatous disease of unknown etiology. Pulmonary sarcoidosis with extrapulmonary lesions (EPL), especially in cardiac sarcoidosis, is associated with poor prognosis. The transcriptome features of peripheral blood mononuclear cells (PBMCs) could be crucial in sarcoidosis pathogenesis. However, the gene expression characteristics associated with EPL development in pulmonary sarcoidosis remain unknown. Therefore, we investigated gene expression patterns associated with the development of EPL in pulmonary sarcoidosis. First, we conducted trascriptome analysis between patients with pulmonary sarcoidosis and healthy controls.

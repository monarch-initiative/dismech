    explanation: German epidemiologic data supporting European prevalence estimate.
  - reference: ORPHA:797
    reference_title: "Sarcoidosis (Orphanet structured-database record)"
    supports: SUPPORT
    snippet: "A rare multisystemic, autoinflammatory disorder of unknown etiology characterized by the formation of immune, non-caseating granulomas in any organ(s), leading to variable clinical symptoms and severity."
    explanation: Orphanet classifies sarcoidosis as a rare multisystemic autoinflammatory disorder.
inheritance:
- name: Polygenic susceptibility
  description: Sarcoidosis is not a Mendelian disorder but shows familial clustering with polygenic susceptibility (HLA-DRB1, BTNL2, ANXA11). Risk is increased in first-degree relatives.
  evidence:
  - reference: PMID:27454307
    reference_title: "[Epidemiology and Clinical Presentation of Sarcoidosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial clusters can occur."
    explanation: Familial clustering supports genetic predisposition without Mendelian inheritance.
has_subtypes:
- name: Pulmonary Sarcoidosis
  description: Most common form, affecting lungs and hilar lymph nodes; staged by chest radiograph findings.
- name: Cardiac Sarcoidosis
  description: Myocardial granulomas causing conduction abnormalities, heart failure, or sudden death.
- name: Neurosarcoidosis
  description: CNS involvement causing cranial neuropathies, meningitis, or mass lesions.
- name: Cutaneous Sarcoidosis
  description: Skin manifestations including erythema nodosum, lupus pernio, and papular lesions.
mechanistic_hypotheses:
- hypothesis_group_id: antigen_persistence_granuloma_chronicity_model
  hypothesis_label: Antigen Persistence / Th17.1 / mTORC1 Granuloma Chronicity Model
  status: EMERGING
  applies_to_subtypes:
  - Pulmonary Sarcoidosis
  description: >-
    Sarcoidosis is modeled as a genetically conditioned, antigen-driven
    granulomatous immune response in which poorly degradable or repeatedly
    encountered antigens are presented by macrophage-lineage antigen-presenting
    cells to CD4+ T cells. The activated T-cell compartment polarizes toward
    IFN-gamma-producing Th17.1/Th1-like effector states while regulatory T-cell
    restraint is insufficient. This cytokine circuit recruits and activates
    macrophages, promotes epithelioid and multinucleated giant-cell granuloma
    architecture, and intersects with macrophage-intrinsic metabolic programs
    such as mTORC1 activation. Resolution is hypothesized to require antigen
    clearance or sequestration plus restoration of regulatory and apoptotic
    checkpoints; chronic disease and fibrosis occur when antigen persistence,
    Th17.1 feedback, macrophage survival/proliferation, and tissue-repair
    programs remain engaged.
  notes: >-
    Retained as EMERGING after the 2026 OpenScientist hypothesis-search report (kb/hypotheses/Sarcoidosis/antigen_persistence_granuloma_chronicity_model/openscientist.md).
    The report judged the model partially supported: antigen-driven CD4 T-cell responses,
    Th17.1/Treg imbalance, and macrophage mTORC1 granuloma biology are individually
    well supported, but the integrated Th17.1-to-macrophage mTORC1 link remains unproven
    and fibrosis may diverge through distinct profibrotic/EMT-like tissue-remodeling
    programs. Best current fit is non-Lofgren, chronic/progressive pulmonary sarcoidosis
    rather than all sarcoidosis phenotypes. The cutaneous CLEAR trial is retained
    only as cross-organ discordance against the negative pulmonary trial; it does
    not extend the machine-readable hypothesis scope beyond Pulmonary Sarcoidosis.
    This model deliberately leaves the antigen source open; the competing vimentin_autoimmunity_model
    proposes a self-antigen rather than persistent microbial antigen as the disease-defining
    trigger, and the two are not mutually exclusive because molecular mimicry could
    unify them.
  evidence:
  - reference: PMID:38165044
    reference_title: "Immune mechanisms of granuloma formation in sarcoidosis and tuberculosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Sarcoidosis is a complex immune-mediated disease characterized by clusters of immune cells called granulomas."
    explanation: >
      Recent mechanistic review used as the seed reference for the
      hypothesis-search deep-research run and for the antigen/T-cell/macrophage
      granuloma-chronicity framing.
  - reference: PMID:31273209
    reference_title: "Sarcoidosis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The disease develops in genetically predisposed individuals with exposure to an as-yet unknown antigen."
    explanation: >
      Nature Reviews Disease Primers review supports the central upstream
      premise of this hypothesis: genetically predisposed patients encounter an
      unknown antigenic trigger.
  - reference: PMID:23863960
    reference_title: "Oral antimycobacterial therapy in chronic cutaneous sarcoidosis: a randomized, single-masked, placebo-controlled study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the primary end point of change in lesion size, as evidenced by a
      reduction in lesion diameter and number of granulomas, 7 of 10 patients
      randomized to the CLEAR regimen met this benchmark compared with 0 of 7
      randomized to placebo (P = .01, Fisher exact test).
    explanation: >-
      This small cutaneous-sarcoidosis trial supplies organ-specific clinical
      support for an antimicrobial-responsive process, but antibiotic
      immunomodulation, the small analyzed sample, and lack of organism
      identification prevent inference that viable mycobacteria maintain
      pulmonary granulomas.
  - reference: PMID:33387486
    reference_title: "Phase II Investigation of the Efficacy of Antimycobacterial Therapy in Chronic Pulmonary Sarcoidosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite a significant decline in ESAT-6 immune responses, a 16-week CLEAR
      regimen provided no physiological benefit in FVC or 6MWD among patients
      with sarcoidosis.
    explanation: >-
      The multicenter placebo-controlled pulmonary trial weakens a
      viable, therapeutically eradicable mycobacterial-persistence account:
      immune reactivity fell without pulmonary physiological benefit. It does
      not exclude nonviable antigen remnants, other antigen classes, or a
      persistence mechanism confined to another organ or molecular subgroup.
- hypothesis_group_id: vimentin_autoimmunity_model
  hypothesis_label: Vimentin Autoantigen / HLA-DRB1*03 Autoimmunity Model
  status: EMERGING
  applies_to_subtypes:
  - Pulmonary Sarcoidosis
  description: >-
    An alternative to the persistent-microbial-antigen premise: in a subset of
    patients - most clearly the HLA-DRB1*03+ Lofgren phenotype - the
    disease-defining antigen is a self-protein rather than a foreign one, with
    the cytoskeletal protein vimentin as the leading candidate autoantigen.
    HLA-DRB1*03 presents vimentin-derived peptides to a strikingly restricted
    CD4+ T-cell receptor repertoire (Valpha2.3/Vbeta22), and linked T- and
    B-cell autoreactivity to vimentin is demonstrable in situ in the sarcoid
    lung. Under this model sarcoidosis (or at least its resolving
    HLA-restricted form) is better understood as an antigen-specific autoimmune
    disease. Rather than a strict self-versus-foreign dichotomy, the
    best-supported reading (2026 OpenScientist hypothesis-search report) is a
    multi-antigen milieu in the DR3+ sarcoid lung: HLA-DR molecules present
    several self-peptides, but only the vimentin response is demonstrably
    HLA-DRB1*03-restricted, whereas T-cell responses to ATP synthase and
    lysyl-tRNA synthetase also occur in DR3-negative patients, and the microbial
    antigen mycobacterial catalase-peroxidase (mKatG) is an independently
    documented tissue antigen whose relationship to the Valpha2.3/Vbeta22
    repertoire has not been directly tested. Vimentin is thus one prominent
    antigen among several rather than the unique disease initiator. The
    downstream CD4+ T-cell activation and Th17.1 effector chain is shared with
    the antigen-persistence model, and a direct molecular-mimicry bridge between
    vimentin and mycobacterial proteins remains speculative and is not supported
    at the linear-sequence level.
  notes: >-
    Held at EMERGING: the vimentin-autoantigen and HLA-DRB1*03/Valpha2.3-Vbeta22
    associations are well documented for pulmonary/Lofgren sarcoidosis, but
    vimentin is not proven to be the (or a) universal disease-initiating antigen,
    and the model is best supported in HLA-DRB1*03+ patients rather than across
    all sarcoidosis. Two caveats from the OpenScientist hypothesis-search report
    (kb/hypotheses/Sarcoidosis/vimentin_autoimmunity_model/openscientist.md;
    assessment sidecar under that directory's assessments/): (1) anti-vimentin
    autoreactivity is not sarcoidosis-specific (also in lupus nephritis and, as
    anti-citrullinated vimentin, rheumatoid arthritis), weakening its role as a
    disease-defining antigen; and (2) the resolution paradox - HLA-DRB1*03, the
    allele anchoring the model, is a dominant good-prognosis allele predicting
    spontaneous resolution, better fitting antigen recognition coupled to
    effective clearance than a self-perpetuating chronic autoimmune attack.
  evidence:
  - reference: PMID:30038611
    reference_title: "In Situ Humoral Immunity to Vimentin in HLA-DRB1*03(+) Patients With Pulmonary Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vimentin has been implicated in pulmonary sarcoidosis as a T-cell autoantigen"
    explanation: >
      Directly establishes vimentin as an implicated T-cell autoantigen in
      pulmonary sarcoidosis in the HLA-DRB1*03 / restricted-TCR / Lofgren
      context, the central premise of this alternative hypothesis.
  - reference: PMID:30038611
    reference_title: "In Situ Humoral Immunity to Vimentin in HLA-DRB1*03(+) Patients With Pulmonary Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "linked in situ recognition of vimentin by both T- and B-cells in HLA-DRB1*03+ sarcoidosis patients"
    explanation: >
      Demonstrates coordinated T- and B-cell autoreactivity to vimentin within
      the HLA-DRB1*03+ sarcoid lung, supporting an antigen-specific autoimmune
      mechanism rather than a purely foreign-antigen response.
  - reference: PMID:26585430
    reference_title: "T-cell receptor-HLA-DRB1 associations suggest specific antigens in pulmonary sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Simultaneous expression of Vα2.3 with the Vβ22 chain was identified in the lungs of all HLA-DRB1*03(+) patients."
    explanation: Directly documents the restricted Vα2.3/Vβ22 CD4+ T-cell receptor repertoire in HLA-DRB1*03-positive pulmonary sarcoidosis.
  - reference: PMID:26585430
    reference_title: "T-cell receptor-HLA-DRB1 associations suggest specific antigens in pulmonary sarcoidosis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular modelling revealed specific T-cell receptor-HLA-DRB1*03-peptide interactions, with a previously identified, sarcoidosis-associated vimentin peptide, (Vim)429-443 DSLPLVDTHSKRTLL, matching both the HLA peptide-binding cleft and distinct T-cell receptor features perfectly."
    explanation: Molecular modeling directly supports compatibility of the vimentin peptide with both the HLA-DRB1*03 binding cleft and the restricted TCR.
  - reference: PMID:35434591
    reference_title: "Systemic immune response to vimentin and granuloma formation in a model of pulmonary sarcoidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Vimentin-immunized mice developed lung granulomas following intravenous challenge with vimentin-coated beads."
    explanation: >
      Rare causal support: immunization against vimentin plus vimentin-bead
      challenge is sufficient to produce sarcoid-like Th1/Th17 lung granulomas in
      mice, moving vimentin from correlate toward trigger (model-organism; a bead
      model is not spontaneous human disease).
  - reference: PMID:19786367
    reference_title: "Autoimmune T cell responses to antigenic peptides presented by bronchoalveolar lavage cell HLA-DR molecules in sarcoidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "there were strong T cell responses to a peptide derived from the cytoskeletal protein vimentin in 6 out of 11 DRB10301(pos) patients with active disease but not in patients with other HLA types"
    explanation: >
      Supports the HLA-DRB1*03-restricted vimentin T-cell response (present in
      DRB1*0301+ but not other-HLA patients), while the same study finds ATP
      synthase and lysyl-tRNA synthetase responses in DR3-negative patients too -
      so only the vimentin response is DR3-restricted, and vimentin is one of
      several DR-presented antigens rather than the unique trigger.
  - reference: PMID:15753209
    reference_title: "Mycobacterial catalase-peroxidase is a tissue antigen and target of the adaptive immune response in systemic sarcoidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that remnant mycobacterial catalase-peroxidase is one target of the adaptive immune response driving granulomatous inflammation in sarcoidosis"
    explanation: >
      Competing foreign-antigen evidence: mKatG is an independently documented
      sarcoid tissue antigen and adaptive-immune target (tissue proteomics plus
      anti-mKatG IgG; no TCR/HLA-restriction data), qualifying the
      self-antigen-only framing. Its relationship to the Valpha2.3/Vbeta22 public
      clone has not been directly tested, so it supports a multi-antigen milieu
      rather than a single DR3-restricted cross-reactive response.
  - reference: PMID:20187937
    reference_title: "Different HLA-DRB1 allele distributions in distinct clinical subgroups of sarcoidosis patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical influence of DRB1*03 (good prognosis) dominated over that of DRB1*15 (bad prognosis)"
    explanation: >
      The resolution paradox: HLA-DRB1*03, the allele anchoring this model,
      predicts good prognosis / spontaneous resolution, which is difficult to
      reconcile with a chronic self-perpetuating autoimmune mechanism.
- hypothesis_group_id: environmental_exposure_host_susceptibility_trigger_model
  hypothesis_label: Environmental Exposure × Host Susceptibility Trigger Model
  status: EMERGING
  applies_to_subtypes:
  - Pulmonary Sarcoidosis
  description: >-
    Specific inhaled bioaerosols and inorganic particles are associated with
    pulmonary-sarcoidosis risk. The hypothesis is that, in a subset of
    susceptible hosts, a particular exposure initiates disease through an
    exposure-specific innate-sensing or antigen-presentation program that
    changes CD4+ T-cell polarization. HLA and other immune-risk alleles may
    modify that response and the resulting phenotype. This upstream model
    complements the antigen-persistence/granuloma-chronicity model; it does not
    assert that distinct exposure classes share one receptor or pathway. The
    exposure-to-sensor/presentation bridge and exposure-by-genotype
    combinations remain unproven.
  notes: >-
    Retained as EMERGING after the 2026 disease-level and focused
    OpenScientist reports
    (research/Sarcoidosis-deep-research-openscientist.md and
    kb/hypotheses/Sarcoidosis/environmental_exposure_host_susceptibility_trigger_model/openscientist.md).
    Human data support modest exposure associations and host-genetic main
    effects. Direct ACCESS HLA-by-exposure signals remain exploratory and
    unreplicated; separate single-cohort genome-wide analyses report
    smoking-by-locus and insecticide-by-locus interactions, but do not replicate
    the ACCESS pairs. A WTC study found no interaction with its exposure-degree
    measure, and no exposure-specific sensor-to-CD4 mechanism has been shown in
    idiopathic sarcoidosis. Beryllium-associated granulomatous disease is a
    separate exposure-defined differential diagnosis, not evidence that its
    HLA-restricted mechanism operates in idiopathic pulmonary sarcoidosis. No
    exposure-specific causal edge is curated.
  evidence:
  - reference: PMID:15347561
    reference_title: "A case control etiologic study of sarcoidosis: environmental and occupational risk factors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariable modeling, we observed elevated ORs for work in areas with
      musty odors (OR 1.62, CI 1.24-2.11) and with occupational exposure to
      insecticides (OR 1.61, CI 1.13-2.28), and a decreased OR related to ever
      smoking cigarettes (OR 0.65, CI 0.51-0.82).
    explanation: >-
      The matched ACCESS case-control study supports modest, exposure-class
      associations, not a specific initiating antigen, receptor, or causal
      pathway; questionnaire exposure ascertainment and residual confounding
      remain limitations.
  - reference: PMID:19382531
    reference_title: HLA and environmental interactions in sarcoidosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant interaction was observed between HLA DRB1*1101 and
      insecticide exposure at work (p < 0.10) and suggestive interaction was
      observed between HLA DRB1*1101 and exposure to mold and musty odors and
      DRB1*1501 and insecticide exposure at work (P < 0.15).
    explanation: >-
      The ACCESS case-control analysis provides exposure-by-HLA leads, but its
      exploratory significance thresholds and phenotype stratification require
      independent replication before these pairs are modeled as causal.
  - reference: PMID:31819081
    reference_title: A Gene-Environment Interaction Between Smoking and Gene polymorphisms Provides a High Risk of Two Subgroups of Sarcoidosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessment of smoking effects with inclusion of genetic information
      revealed 53 (in LS) and 34 (in non-LS) SNP-smoking additive interactions
      at false discovery rate (FDR) below 5%. The lead signals interacting with
      smoking were rs12132140 (AP = 0.56, 95% CI = 0.22-0.90), p = 1.28e-03) in
      FCRL1 for LS and rs61780312 (AP = 0.62, 95% CI = 0.28-0.90), p = 3e-04) in
      IL23R for non-LS.
    explanation: >-
      This Swedish case-control study supports subgroup-specific,
      genotype-dependent smoking interactions in one cohort. It does not
      replicate the ACCESS HLA-exposure pairs, identify an initiating antigen
      or sensor, or establish a causal smoking effect; independent and
      functional replication remain necessary.
  - reference: PMID:30793815
    reference_title: Extended methods for gene-environment-wide interaction scans in studies of admixed individuals with varying degrees of relationships.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We applied the proposed method to conduct a GEWIS of a known sarcoidosis
      risk factor (insecticide exposure) and risk of sarcoidosis in African
      Americans and identified two novel loci with suggestive evidence of G × E
      interaction.
    explanation: >-
      The African American GEWIS supplies a broader insecticide-by-locus lead,
      but the evidence was explicitly suggestive and does not replicate the
      specific ACCESS HLA-exposure pairs or define an exposure-to-immune
      mechanism.
  - reference: PMID:32941653
    reference_title: Simultaneous testing of immunological sensitization to multiple antigens in sarcoidosis reveals an association with inorganic antigens specifically related to a fibrotic phenotype.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significantly higher percentage of sarcoidosis patients (27·6%) than
      controls (4·2%) had an immunological response to metals or silica
      (P = 0·014). A higher percentage of these sarcoidosis patients showed
      fibrosis on chest X-ray 5 years after the diagnosis (69·2 versus 30·3%,
      P = 0·016).
    explanation: >-
      In the tested inorganic-antigen subset (105 patients and 24 controls),
      ELISPOT sensitization was associated with later radiographic fibrosis and
      therefore supplies a phenotype-stratification lead. Sensitization is not
      verified exposure, a genotype interaction, proof of disease initiation,
      or causal evidence.
pathophysiology:
- name: Genetic Susceptibility
  description: >
    Sarcoidosis is a polygenic immune disorder. Risk-associated variants in HLA
    class II (DRB1 lineages), the truncating splice variant rs2076530 in BTNL2
    (a T-cell co-inhibitory butyrophilin-like immunoglobulin superfamily member),
    the missense ANXA11 R230C (rs1049550), NOTCH4, and IL27RA collectively shift
    antigen presentation, T-cell co-stimulation/inhibition, and macrophage
    apoptosis thresholds, predisposing to exaggerated granulomatous response on
    antigen encounter.
  evidence:
  - reference: PMID:15735647
    reference_title: "Sarcoidosis is associated with a truncating splice site mutation in BTNL2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The G --> A transition constituting rs2076530 leads to the use of a cryptic splice site located 4 bp upstream of the affected wild-type donor site. Transcripts of the risk-associated allele have a premature stop in the spliced mRNA. The resulting protein lacks the C-terminal IgC domain and transmembrane helix, thereby disrupting the membrane localization of the protein"
    explanation: This case-control SNP scan identifies the truncating BTNL2 splice variant rs2076530 as a sarcoidosis risk factor independent of HLA-DRB1, with a defined molecular consequence (loss of membrane-anchored co-inhibitory protein).
  - reference: PMID:19165924
    reference_title: "Genome-wide association study identifies ANXA11 as a new susceptibility locus for sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The strongest association signal maps to the ANXA11 (annexin A11) gene on chromosome 10q22.3."
    explanation: GWAS plus replication establishes ANXA11 as a major sarcoidosis susceptibility locus; the lead missense R230C (rs1049550) variant defined in this work is the molecular entry point for the apoptosis/proliferation arm of the pathograph.
  - reference: PMID:19165924
    reference_title: "Genome-wide association study identifies ANXA11 as a new susceptibility locus for sarcoidosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Annexin A11 has complex and essential functions in several biological pathways, including apoptosis and proliferation."
    explanation: Functional context for why ANXA11 risk variants are mechanistically relevant - the gene regulates apoptosis and proliferation, which are precisely the macrophage processes dysregulated in granuloma maintenance.

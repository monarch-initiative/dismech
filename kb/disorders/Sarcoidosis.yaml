- accession: geo:GSE288459
  title: Single Cell Transcriptome Signatures of Sarcoidosis in Lung Immune Cell Populations
  description: 'Rationale: To identify cell specific molecular changes associated with sarcoidosis risk and progression, we aimed to characterize the cellular composition, gene expression patterns, and cell-cell interactions in BAL cells from patients with sarcoidosis (both progressive and non-progressive) and healthy controls. Methods: Single cell RNA-seq data were collected on 12 sarcoidosis and 4 control participants. We combined scRNA-seq data from these participants with our previously collected data on 4 sarcoidosis and 10 control participants for a final sample size of 16 sarcoidosis cases (8 progressive and 8 non-progressive) and 14 controls.'

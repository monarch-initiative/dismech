- accession: ega:EGAS00001006970
  title: Single-cell RNA-seq and spatial transcriptomics data for the sarcoidosis baseline project
  description: Granulomas are lumps of immune cells that can form in various organs. Most granulomas appear unstructured, yet they have some resemblance to lymphoid organ formation. To better understand granuloma formation, we performed single-cell sequencing and spatial transcriptomics on granulomas from patients with sarcoidosis and bioinformatically reconstructed the underlying gene-regulatory networks. We discovered an immune stimulatory environment in granulomas that repurposed transcriptional programs associated with lymphoid organ development.

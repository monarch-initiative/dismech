- accession: geo:GSE328831
  title: Bulk RNA-seq of laser-microdissected granuloma and adjacent non-granuloma regions from FFPE lung tissues of pulmonary sarcoidosis
  description: Sarcoidosis is a systemic granulomatous disease with heterogeneous organ involvement and clinical outcomes. To characterize transcriptional features associated with pulmonary sarcoid granulomas, we performed bulk RNA sequencing of laser-microdissected granuloma regions and adjacent non-granuloma regions from formalin-fixed paraffin-embedded (FFPE) lung tissue specimens obtained from patients with pulmonary sarcoidosis. The dataset includes paired regional samples derived from clinically obtained lung specimens. These data provide a resource for investigating localized gene expression differences associated with granuloma formation in pulmonary sarcoidosis.

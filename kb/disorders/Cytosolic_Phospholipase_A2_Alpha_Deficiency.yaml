    explanation: Reduced phospholipase A2 activity in patient platelets.
  downstream:
  - target: Deficient Stimulus-Coupled Arachidonic Acid Release
    causal_link_type: DIRECT
    hypothesis_groups:
    - arachidonate_release_failure
    evidence:
    - reference: PMID:21247147
      reference_title: Functional characterization of mutations in inherited human cPLA₂ deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results define how the mutations negatively influence cPLA(2)α function and explain the inability of the proband to release arachidonic acid for eicosanoid production."
      explanation: Links the enzyme defect to failed arachidonate release.

- name: Deficient Stimulus-Coupled Arachidonic Acid Release
  biological_scale: MOLECULAR
  description: >
    cPLA2alpha catalyses the first step of the arachidonic acid cascade.
    Without it, stimulated cells cannot liberate arachidonic acid from membrane
    phospholipids, so cyclooxygenase and lipoxygenase products fall together.
    The defect is upstream of the cyclooxygenases: patient platelets aggregate
    normally when arachidonic acid is supplied directly.
  biological_processes:
  - preferred_term: arachidonic acid metabolic process
    modifier: DECREASED
    term:
      id: GO:0019369
      label: arachidonate metabolic process
  chemical_entities:
  - preferred_term: arachidonic acid
    term:
      id: CHEBI:15843
      label: arachidonic acid
  evidence:
  - reference: PMID:18451993
    reference_title: "Inherited human cPLA(2alpha) deficiency is associated with impaired eicosanoid biosynthesis, small intestinal ulceration, and platelet dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of thromboxane B2 and 12-hydroxyeicosatetraenoic acid produced by platelets and leukotriene B4 released from calcium ionophore-activated blood were markedly reduced, indicating defective enzymatic release of the arachidonic acid substrate for the corresponding cyclooxygenase and lipoxygenases."
    explanation: Concurrent loss of cyclooxygenase and lipoxygenase products localises the block to substrate release.
  - reference: PMID:26183771
    reference_title: "Inherited human group IVA cytosolic phospholipase A2 deficiency abolishes platelet, endothelial, and leucocyte eicosanoid generation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies constitute a definitive account, demonstrating the fundamental role of cPLA2α to eicosanoid formation and cellular responses within the human circulation."
    explanation: Comprehensive eicosanoid profiling of homozygous patients confirms the global substrate-release defect.
  downstream:
  - target: Loss of Platelet Thromboxane A2 Generation
    causal_link_type: DIRECT
    hypothesis_groups:
    - arachidonate_release_failure
    evidence:
    - reference: PMID:26183771
      reference_title: "Inherited human group IVA cytosolic phospholipase A2 deficiency abolishes platelet, endothelial, and leucocyte eicosanoid generation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Absence of cPLA2α almost abolished eicosanoid synthesis in platelets (e.g., thromboxane A2, control 20.5 ± 1.4 ng/ml vs. patient 0.1 ng/ml)"
      explanation: Quantifies the loss of platelet thromboxane A2 caused by absent cPLA2alpha.
  - target: Reduced Gastrointestinal Mucosal Prostaglandin Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - arachidonate_release_failure
    evidence:
    - reference: PMID:42046811
      reference_title: "What we know about prostaglandin pathway dysfunction in chronic enteropathies: From endoscopy to molecular diagnosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mutations in PLA2G4A that result in loss of function lead to an absolute deficiency of PGE2 synthesis and consequent intestinal mucosal damage."
      explanation: Review synthesis linking loss of arachidonate supply to mucosal PGE2 deficiency.
    - reference: PMID:26183771
      reference_title: "Inherited human group IVA cytosolic phospholipase A2 deficiency abolishes platelet, endothelial, and leucocyte eicosanoid generation."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "For example, prostacyclin metabolites were strongly reduced (18.4% of control) in patients lacking cPLA2α, whereas PGE2 metabolites (77.8% of control) were similar to healthy volunteer levels."
      explanation: >-
        Contradicts the review's word "absolute": whole-body PGE2 output,
        measured as urinary metabolites, was near normal in homozygous
        patients, so other routes supply some PGE2 systemically. This does not
        exclude a local mucosal deficit, which was not measured.
  - target: Deficient Leukocyte Leukotriene Biosynthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - arachidonate_release_failure
    evidence:
    - reference: PMID:19148786
      reference_title: The enteropathy of prostaglandin deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LTB4 biosynthesis by ionophore-activated leukocytes was only 3% of controls, and urinary LTE4 was undetectable."
      explanation: Lipoxygenase output is lost along with cyclooxygenase output.


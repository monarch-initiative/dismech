name: Cytosolic Phospholipase A2 Alpha Deficiency
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: cytosolic phospholipase-A2 alpha deficiency associated bleeding disorder
  term:
    id: MONDO:0018794
    label: cytosolic phospholipase-A2 alpha deficiency associated bleeding disorder
description: >
  Cytosolic phospholipase A2 alpha (cPLA2alpha) deficiency is an autosomal
  recessive disorder of eicosanoid biosynthesis caused by biallelic
  loss-of-function variants in PLA2G4A. cPLA2alpha is the enzyme that releases
  arachidonic acid from membrane phospholipids when a cell is stimulated, and
  so supplies the substrate for every downstream cyclooxygenase and
  lipoxygenase product. When it is missing, platelets, leukocytes and
  endothelial cells make little thromboxane, prostaglandin or leukotriene,
  even though the downstream enzymes are intact.

  The disease has two arms that follow from that single block. In platelets,
  loss of agonist-driven thromboxane A2 generation removes the autocrine
  amplification loop, giving impaired aggregation and dense-granule secretion
  to ADP and collagen with a normal response to exogenous arachidonic acid,
  and a mucocutaneous and post-procedural bleeding tendency. In the gut, loss
  of mucosal prostaglandin synthesis produces a phenotype that resembles
  lifelong NSAID enteropathy: recurrent ulcers of the small intestine (and in
  some families the stomach and duodenum), gastrointestinal blood loss and
  anaemia, perforation, and stenosing strictures that need repeated resection.
  Onset of the intestinal disease is usually in early childhood.

  The intestinal phenotype was first recognised as cryptogenic multifocal
  ulcerous stenosing enteritis (CMUSE), a clinically defined entity of
  previously unknown cause. Homozygous PLA2G4A loss of function explains CMUSE
  in some families, but not all CMUSE is PLA2G4A-related, so this entry treats
  CMUSE as a related clinical diagnosis rather than as a synonym (see
  `mappings`). Five patients in three families carry biallelic variants
  that this entry accepts as causal.
synonyms:
- cytosolic phospholipase-A2 alpha deficiency associated bleeding disorder
- PLA2G4A-related platelet dysfunction
- platelet dysfunction due to cytosolic phospholipase-A2 alpha deficiency
- cPLA2alpha deficiency
- group IVA cytosolic phospholipase A2 deficiency
- chronic enteropathy associated with PLA2G4A
- CEAP
parents:
- Inherited platelet function disorder
- Inherited blood coagulation disorder
- Intestinal disorder
notes: >
  Scope relative to CMUSE. MONDO:0018765 (cryptogenic multifocal ulcerous
  stenosing enteritis) is a separate, clinically defined concept with no
  dismech entry at the time of writing. It is recorded under
  `mappings.mondo_mappings` with `skos:relatedMatch` rather than exactMatch or
  narrowMatch, because the literature states that PLA2G4A variants are not the
  sole cause of CMUSE and that most CMUSE cases have not been tested for this
  gene, and a second genetic cause of an overlapping enteropathy (SLCO2A1) is
  established. The intestinal pathophysiology here is curated only for
  PLA2G4A-deficient patients.

  Variants not counted as causal. Two published Chinese reports attribute
  small-intestinal ulcers to PLA2G4A variants that are either a common
  polymorphism or a single heterozygous missense change; a 2026 review argues
  the former does not affect enzyme function. Neither is used here as evidence
  for the disease.

  Factor XI. The Italian family carrying homozygous p.Asp575His also had mildly
  reduced factor XI levels in three members. This is treated as a
  family-specific finding and is not attributed to cPLA2alpha deficiency.

  No GeneReviews chapter names this disease.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018765
      label: cryptogenic multifocal ulcerous stenosing enteritis
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      Clinically defined small-bowel ulcer-stricture syndrome of which
      homozygous PLA2G4A loss of function is one documented cause; not all
      CMUSE is cPLA2alpha deficiency, so the relation is not subsumption.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Affected individuals are homozygous (Serbian siblings with a splice-site
    deletion; Italian twins with p.Asp575His) or compound heterozygous (the
    first American proband, p.Ser111Pro and p.Arg485His). In the Italian
    kindred some heterozygous relatives had gastrointestinal ulcers but none
    had a bleeding diathesis, so heterozygosity may confer a partial gastric
    phenotype without the full disease.
  evidence:
  - reference: PMID:23268370
    reference_title: Cryptogenic multifocal ulcerating stenosing enteritis associated with homozygous deletion mutations in cytosolic phospholipase A2-α.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated the genetic basis of this autosomal recessive condition in a pair of affected siblings who have 40-year histories of catastrophic gastrointestinal and extraintestinal disease."
    explanation: States autosomal recessive inheritance in the family in which the homozygous PLA2G4A deletion was found.
  - reference: PMID:21247147
    reference_title: Functional characterization of mutations in inherited human cPLA₂ deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We previously described a patient deficient in cPLA(2)α activity, which was associated with mutations in both alleles encoding the enzyme."
    explanation: Biallelic variants in the first described proband.
  - reference: PMID:25102815
    reference_title: Bleeding diathesis and gastro-duodenal ulcers in inherited cytosolic phospholipase-A2 alpha deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GI ulcers affected 5/14 heterozygous (< 40 years) and 1/16 wild-type homozygous (> 60 years) family members; none had bleeding diathesis."
    explanation: >-
      Bleeding is confined to homozygotes, while some heterozygous relatives
      have ulcers, which is the basis for describing heterozygotes as possibly
      partially affected in the gut.
mechanistic_hypotheses:
- hypothesis_group_id: arachidonate_release_failure
  hypothesis_label: Failure of cPLA2alpha-Dependent Arachidonic Acid Release
  status: CANONICAL
  description: >-
    Loss of cPLA2alpha removes stimulus-coupled release of arachidonic acid,
    starving cyclooxygenase and lipoxygenase pathways of substrate. In
    platelets this abolishes thromboxane A2 amplification and causes a
    platelet function defect; in the gastrointestinal mucosa it removes
    cytoprotective prostaglandins and causes NSAID-like ulceration with
    secondary stricturing. CANONICAL because the biochemical signature (low
    eicosanoids with a normal response to exogenous arachidonic acid), the
    enzymology of the patient variants and absent protein in patient tissue
    agree across independent families. The mucosal arm rests partly on
    analogy with NSAID injury, since mucosal prostaglandin content has not
    been measured in patient tissue.
pathophysiology:
- name: PLA2G4A Biallelic Loss-of-Function Variants
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >
    Germline biallelic PLA2G4A variants on 1q31.1. Reported alleles are
    private to families: a homozygous 4 bp deletion at the exon 17 splice donor
    (p.V707fsX10) in Serbian siblings, homozygous c.1723G>C (p.Asp575His) in
    Italian twins, and compound heterozygous p.Ser111Pro with p.Arg485His (on
    the allele carrying the common p.Lys651Arg polymorphism) in an American
    man.
  genes:
  - preferred_term: PLA2G4A
    term:
      id: hgnc:9035
      label: PLA2G4A
    modifier: DECREASED
  molecular_functions:
  - preferred_term: phospholipase A2 activity
    modifier: DECREASED
    term:
      id: GO:0004623
      label: A2-type glycerophospholipase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in two of three published families; the third is compound
      heterozygous. Both configurations abolish enzyme function.
  evidence:
  - reference: PMID:23268370
    reference_title: Cryptogenic multifocal ulcerating stenosing enteritis associated with homozygous deletion mutations in cytosolic phospholipase A2-α.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Insertion/deletion variation analysis revealed the presence of a homozygous 4 bp deletion (g.155574_77delGTAA) in the PLA2G4A gene, located in the splice donor site directly after exon 17 (the penultimate exon) of the gene in both affected siblings."
    explanation: Homozygous truncating PLA2G4A variant in the CMUSE family.
  - reference: PMID:25102815
    reference_title: Bleeding diathesis and gastro-duodenal ulcers in inherited cytosolic phospholipase-A2 alpha deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were homozygous for 1723G>C transition in PLA2G4A gene, which changed the codon for Asp575 to His."
    explanation: Homozygous missense variant in the Italian twins.
  - reference: PMID:18451993
    reference_title: "Inherited human cPLA(2alpha) deficiency is associated with impaired eicosanoid biosynthesis, small intestinal ulceration, and platelet dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two heterozygous single base pair mutations and a known SNP were found in the coding regions of the patient's cPLA2alpha genes (p.[Ser111Pro]+[Arg485His; Lys651Arg])."
    explanation: Compound heterozygous variants in the first proband.
  downstream:
  - target: Loss of cPLA2alpha Protein or Catalytic Activity
    causal_link_type: DIRECT
    hypothesis_groups:
    - arachidonate_release_failure
    evidence:
    - reference: PMID:21247147
      reference_title: Functional characterization of mutations in inherited human cPLA₂ deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, our results show that the S111P mutation hampers calcium binding and membrane translocation without affecting the catalytic activity, and that the mutation R485H does not affect membrane translocation but blocks catalytic activity that leads to inactivation of the enzyme."
      explanation: Each allele of the compound heterozygote inactivates the enzyme by a different route.


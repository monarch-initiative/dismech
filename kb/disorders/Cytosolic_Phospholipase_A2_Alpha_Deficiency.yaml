      reference_title: The enteropathy of prostaglandin deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Serum thromboxane B2 (TxB2) production was 4.6% of normal controls (P<0.006), and serum 12-HETE was 1.3% of controls (P<0.005)."
      explanation: Quantified loss of serum thromboxane B2.
- name: Urinary prostacyclin metabolites
  presence: DECREASED
  context: >-
    Urinary prostacyclin metabolites fell to about a fifth of control, whereas
    urinary PGE2 metabolites were near normal, showing that the systemic
    eicosanoid deficit is selective.
  readouts:
  - target: Deficient Stimulus-Coupled Arachidonic Acid Release
    relationship: READOUT_OF
    direction: NEGATIVE
    evidence:
    - reference: PMID:26183771
      reference_title: "Inherited human group IVA cytosolic phospholipase A2 deficiency abolishes platelet, endothelial, and leucocyte eicosanoid generation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For example, prostacyclin metabolites were strongly reduced (18.4% of control) in patients lacking cPLA2α, whereas PGE2 metabolites (77.8% of control) were similar to healthy volunteer levels."
      explanation: Selective reduction of urinary prostacyclin metabolites.

genetic:
- name: PLA2G4A
  notes: >
    Phospholipase A2 group IVA on 1q31.1, encoding the 749-residue
    calcium-dependent cytosolic phospholipase A2 alpha. Only a handful of
    families are published and all alleles are private; no ClinGen
    gene-disease validity classification is recorded.
  gene_term:
    preferred_term: PLA2G4A
    term:
      id: hgnc:9035
      label: PLA2G4A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23268370
    reference_title: Cryptogenic multifocal ulcerating stenosing enteritis associated with homozygous deletion mutations in cytosolic phospholipase A2-α.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified mutations in PLA2G4A as a cause of CMUSE in two affected siblings."
    explanation: Gene-disease association by homozygosity mapping and exome sequencing.
  - reference: PMID:42046811
    reference_title: "What we know about prostaglandin pathway dysfunction in chronic enteropathies: From endoscopy to molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although PLA2G4A mutations have long been linked to small intestinal ulcers, to date, only seven confirmed patients can be classified as CEAP (Tables 3 and 4), and most documented cases of CMUSE/CNSU remain untested for this gene."
    explanation: >-
      States the size of the published series. The review's seven include two
      Chinese cases (a common polymorphism and a single heterozygous variant)
      that this entry does not accept, leaving five patients in three
      families.

animal_models:
- name: Pla2g4a knockout mouse
  species: Mouse
  genotype: Pla2g4a-/- (germline gene-targeted null)
  publication: PMID:12432909
  description: >
    Germline cPLA2alpha-null mice grow normally but show intestinal ulcerative
    lesions, a renal concentration defect, reduced fertility with impaired
    parturition, and much lower prostaglandin and leukotriene output from
    primary cells. The renal and reproductive phenotypes have not been
    reported in the few human patients.
  modeled_mechanisms:
  - target: Gastrointestinal Mucosal Ulceration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Spontaneous intestinal ulcerative lesions in the null mouse parallel the
      human small-bowel ulcers.
    limitations: >-
      The mouse lesions are described only briefly in a review, with no
      report here of stricturing, perforation or bleeding, which dominate the
      human disease; the mouse also has renal and reproductive phenotypes not
      seen in patients, so organ dependence on cPLA2alpha may differ between
      species.
    evidence:
    - reference: PMID:12432909
      reference_title: Roles for cytosolic phospholipase A2alpha as revealed by gene-targeted mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Close examinations have revealed a renal concentration defect and intestinal ulcerative lesions."
      explanation: Null mice develop intestinal ulcers, supporting the model's relevance to the mucosal arm.
  - target: Deficient Stimulus-Coupled Arachidonic Acid Release
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Cells from null mice make much less prostaglandin and leukotriene,
      the same global eicosanoid deficit seen in patient cells.
    evidence:
    - reference: PMID:12432909
      reference_title: Roles for cytosolic phospholipase A2alpha as revealed by gene-targeted mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Primary cultured cells prepared from cytosolic phospholipase A2alpha-deficient mice produce significantly smaller amounts of prostaglandins and leukotrienes."
      explanation: Reproduces the human eicosanoid-release defect in mouse cells.


- name: Proton Pump Inhibitors
  description: >
    Ineffective in all documented cases, because the small-intestinal injury
    is not acid-driven. Recorded so the negative experience is visible.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:42046811
    reference_title: "What we know about prostaglandin pathway dysfunction in chronic enteropathies: From endoscopy to molecular diagnosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Because small intestinal bleeding is not an acid-related disorder, PPIs have been ineffective in all documented cases."
    explanation: Refutes efficacy of acid suppression for the small-bowel disease.


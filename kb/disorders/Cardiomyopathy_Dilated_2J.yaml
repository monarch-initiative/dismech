prevalence:
- population: Reported patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three patients from three unrelated families, in one 2023 paper. Two of the
    three had already appeared as candidates in an earlier consanguineous
    pediatric-cardiomyopathy cohort. No population estimate exists for CMD2J and
    none can be built from three ascertained families.

    For the denominator rather than for this entity: pediatric cardiomyopathy as
    a whole is estimated at about 1 in 100,000 children per year, and dilated
    cardiomyopathy is its commonest subtype. FLII is one gene among many within
    that, and it was only established as a cause in 2023 - so the published
    count is a floor.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified 3 unrelated patients with early-onset DCM and biallelic
      variants in the FLII gene, including 1 nonconsanguineous family of Dutch
      ancestry and 2 consanguineous families of Saudi Arabian ancestry
    explanation: >-
      The size and structure of the founding cohort.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Pediatric CM is estimated to occur in 1 in 100,000 children per year.
    explanation: >-
      The incidence of the disease class, which is the denominator - not of this
      entity.
diagnosis:
- name: Exome or Genome Sequencing in Idiopathic Early-Onset Dilated Cardiomyopathy
  description: >-
    CMD2J is reached by broad sequencing in an infant with idiopathic dilated
    cardiomyopathy, not by clinical suspicion: the phenotype has no feature that
    points at FLII specifically. Two of the three families were found by
    family-based whole-exome sequencing, and the third by the same approach in a
    non-consanguineous family.

    Two practical points for a laboratory encountering a novel FLII variant.
    The absence of extracardiac features is informative - it argues against the
    syndromic and metabolic causes that dominate the infantile dilated
    cardiomyopathy differential. And the parents should be screened
    echocardiographically as well as genotyped: in all three families the
    heterozygous parents were clinically unaffected, which is the observation
    that supports a recessive interpretation of a novel biallelic genotype.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      No additional extracardiac features were detected.
    explanation: >-
      The cardiac-restricted phenotype, which is what narrows the differential.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Each of the parents was heterozygous for one of the FLII variants. None of
      the parents showed clinical signs of DCM at cardiac screening.
    explanation: >-
      The parental screening that makes a novel biallelic FLII genotype
      interpretable.
  - reference: PMID:20301486
    reference_title: Dilated Cardiomyopathy Overview.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Provide the evaluation strategy of a proband with nonsyndromic DCM
    explanation: >-
      The GeneReviews dilated cardiomyopathy overview states that its purpose is
      to set out the proband evaluation strategy for nonsyndromic dilated
      cardiomyopathy, which is the workup an infant reaches CMD2J through.
      Graded OTHER because the source is an expert overview, and INDIRECT
      because the chapter is disease-level and says nothing about FLII.
differential_diagnoses:
- name: Other genetic causes of infantile dilated cardiomyopathy
  description: >-
    An infant presenting at two to five months with a severely reduced ejection
    fraction has a long differential spanning sarcomeric, cytoskeletal,
    mitochondrial, metabolic and syndromic causes, and CMD2J is not clinically
    separable from them - only by genotype. What narrows the list here is the
    absence of extracardiac features and the absence of arrhythmia, which
    together argue against the metabolic and channelopathy-adjacent causes.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Pediatric cardiomyopathy (CM) corresponds to a group of clinically and
      genetically heterogeneous structural and functional disorders affecting the
      myocardium.
    explanation: >-
      Establishes the heterogeneity that makes this a genotype-level
      differential. Indirect: a class-level statement.
- name: Dilated cardiomyopathy 2G (LMOD2)
  description: >-
    Worth separating out from the general differential, because the two entities
    are mechanistically linked rather than merely adjacent. LMOD2 lengthens
    sarcomeric thin filaments; flightless-I, in mouse, sets their length with
    tropomodulin-1, and leiomodin-2 overexpression partially rescues cardiac
    Flii deletion. Both present as severe early-onset recessive dilated
    cardiomyopathy.

    Clinically they separate on course rather than on presentation: CMD2G is
    frequently lethal in the first weeks to months, whereas all three CMD2J
    patients were alive and stable or improved at two to nine years. That is
    three patients against a small series, so it is a difference to watch rather
    than a rule.
  evidence:
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Indeed, overexpression of leiomodin-2 in the heart, which lengthens the
      actin-containing thin filaments, partially rescued disease due to
      heart-specific deletion of Flii.
    explanation: >-
      The experimental link between the two entities' gene products.
discussions:
- discussion_id: cmd2j_mechanism_measured_in_severe_allele_not_patient_allele
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the patients' hypomorphic FLII alleles disturb cardiomyocyte
    adhesion-complex patterning and Notch/Hippo signalling, or are those
    findings properties of a severe truncating allele that the patient alleles
    do not reach?
  attaches_to:
  - "pathophysiology#Cardiomyocyte Cell Adhesion Complex Failure"
  - "pathophysiology#Dysregulated Notch and Hippo Signaling"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence exists and is good - it just comes from the wrong allele. The
    vinculin dispersal, the reduced Notch reporter expression and the reduced
    nuclear Taz were all measured in the fliiD110fs severe truncating line. The
    patient-mimicking knock-ins carry the myofibrillar and contractile
    phenotypes, and were not assayed for adhesion patterning or signalling.

    The paper is explicit about why: the biallelic patient variants were expected
    to be hypomorphic and to give subtle phenotypic differences, which is
    precisely what makes the severe line the practical vehicle for mechanism.
    That is a reasonable experimental choice and a real limitation at the same
    time, and the two should not be conflated.

    What is at stake is not academic. If adhesion-complex patterning fails only
    at severe loss of function, then the patients' disease is principally a
    myofibrillar and thin-filament one, and the title claim of the defining paper
    over-reaches for this entity. If it fails at hypomorphic dosage too, then
    CMD2J is genuinely an adhesion disease and belongs alongside the
    intercalated-disc cardiomyopathies rather than the sarcomeric ones.
  proposed_experiments:
  - experiment_id: exp_cmd2j_vinculin_in_patient_allele_zebrafish
    name: Assay adhesion-complex patterning in the patient-mimicking zebrafish lines
    description: >-
      Cross the fliiR1230C/R1230C and fliiS449fs/R1158W lines into the
      Tg myl7:vcla-EGFP background and quantify focal concentration of
      vinculin-EGFP at the lateral cardiomyocyte membrane against wild-type
      siblings, using the same quantification applied to the severe line. Repeat
      for the Notch reporter and for nuclear Wwtr1/Taz. A negative result in the
      hypomorphic lines would be as informative as a positive one.
- discussion_id: cmd2j_two_genetic_claims_about_flii
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is thin-filament shortening part of the mechanism of recessive CMD2J, or a
    property of the separate common-variant FLII association with cardiac
    remodelling?
  attaches_to:
  - "pathophysiology#Sarcomeric Thin Filament Shortening"
  rationale: >-
    Two independent 2023 papers put FLII in the heart, and they do not describe
    the same genetic situation. One reports biallelic hypomorphic variants
    causing infantile recessive dilated cardiomyopathy in three families. The
    other reports a common variant, R1243H, associated with cardiac remodelling
    in genome-wide association studies, and studies it in cardiac-deletion and
    knock-in mice, where the mechanism is thin-filament shortening with
    tropomodulin-1.

    It would be easy, and wrong, to read across. Nobody has measured sarcomeric
    thin-filament length in a CMD2J patient's myocardium, in patient-derived
    cardiomyocytes, or in the patient-mimicking zebrafish; and the defining paper
    does not report it. Equally, nobody has shown that the mouse mechanism does
    *not* operate in the patients - the measurement simply has not been made.

    The question is worth resolving beyond tidiness, because it would say which
    disease family CMD2J belongs to. If thin-filament length is the operative
    lesion, CMD2J is a thin-filament cardiomyopathy adjacent to the LMOD2 and
    TMOD1 diseases, and leiomodin-2 biology becomes a rational therapeutic
    direction. If it is not, the entity is a morphogenetic and adhesion disease
    that happens to share a gene with a common remodelling variant.
  proposed_experiments:
  - experiment_id: exp_cmd2j_thin_filament_length_patient_cells
    name: Measure thin-filament length in CMD2J patient-derived cardiomyocytes
    description: >-
      Derive induced pluripotent stem cell cardiomyocytes from a patient with
      biallelic FLII variants, or use the patient-mimicking zebrafish, and
      measure sarcomeric actin thin-filament length by super-resolution imaging
      against isogenic controls, alongside tropomodulin-1 and leiomodin-2
      localisation. Test whether leiomodin-2 overexpression rescues contractile
      function as it does in the mouse deletion model.

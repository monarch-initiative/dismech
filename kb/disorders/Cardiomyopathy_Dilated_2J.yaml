phenotypes:
- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: >-
    The defining phenotype, present in all three reported patients and the
    reason each came to attention. Onset was within the first year of life in
    every case, between two and five months.

    No frequency band is recorded. Three patients is not a denominator, and the
    cohort was ascertained by starting from children who already had idiopathic
    early-onset dilated cardiomyopathy - so "3 of 3" describes the entry
    criterion of the study rather than the penetrance of the genotype.
  phenotype_term:

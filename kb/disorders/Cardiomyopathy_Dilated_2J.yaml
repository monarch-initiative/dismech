- name: Genomic testing and variant interpretation
  description: Family-based exome sequencing identified the variants, with Sanger confirmation and parental segregation. Consider FLII in the broader genetic differential of infantile DCM, while recognizing Moderate gene-disease validity and avoiding diagnosis from uncertain variants alone. Normal extracardiac examination does not exclude metabolic, mitochondrial or other genetic causes.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sanger sequencing was used to verify all identified variants and test other family members.
    explanation: The report establishes variant confirmation and segregation.

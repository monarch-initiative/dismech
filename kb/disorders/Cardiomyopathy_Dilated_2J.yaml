name: Dilated Cardiomyopathy 2J
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: cardiomyopathy, dilated, 2j
  term:
    id: MONDO:0957984
    label: cardiomyopathy, dilated, 2j
synonyms:
- CMD2J
- cardiomyopathy, dilated, 2J
- FLII-related dilated cardiomyopathy
- flightless-I dilated cardiomyopathy
- FLII-related pediatric cardiomyopathy
description: >-
  Dilated cardiomyopathy 2J (CMD2J, OMIM 620635) is the recessive,
  early-infantile dilated cardiomyopathy caused by biallelic variants in FLII,
  which encodes flightless-I, a gelsolin-superfamily actin-remodelling protein.
  It was defined in 2023 in three unrelated families - one non-consanguineous
  Dutch, two consanguineous Saudi Arabian - whose children all presented within
  the first year of life, between two and five months, with severely reduced
  left ventricular ejection fractions of 23 to 32 percent and no extracardiac
  features.

  What makes the entity mechanistically interesting is that flightless-I is not
  a sarcomeric protein in the usual sense. It sits at the junction of three
  things a developing ventricle needs at once: it organises myofibrils, it is
  required for cardiomyocyte cell-adhesion complexes to concentrate into foci
  rather than smear along the membrane, and its loss dysregulates Notch and
  Hippo signalling in the compact myocardium. In zebrafish carrying the
  patients' own variants, knocked in by CRISPR/Cas9, all three arms fail
  together and the ventricle trabeculates poorly. So this is a cardiomyopathy of
  ventricular chamber *morphogenesis* as much as of contraction - which fits an
  onset within months of birth better than a purely sarcomeric lesion would.

  Independent mouse work reached the heart from a different direction and adds a
  fourth arm. A common FLII variant, R1243H, had turned up in cardiac-remodelling
  genome-wide association studies; knock-in and cardiac-deletion mice showed that
  Flii binds the sarcomeric actin thin filament and sets its length, acting with
  tropomodulin-1, and that Flii-deleted hearts develop cardiomyopathy through
  thin-filament shortening. Overexpressing leiomodin-2, which lengthens thin
  filaments, partially rescued them - which ties this entry directly to dilated
  cardiomyopathy 2G, the LMOD2 disease curated here, at the level of the same
  physical parameter approached from opposite sides.

  The two literatures should not be merged carelessly, and this entry keeps them
  apart. The human disease is recessive, biallelic, and infantile; the R1243H
  work concerns a common variant conferring population-level remodelling risk in
  the heterozygous state. They agree that flightless-I dosage matters to the
  myocardium; they are not the same genetic claim.
parents:
- Dilated Cardiomyopathy
- Genetic Disorder
classifications:

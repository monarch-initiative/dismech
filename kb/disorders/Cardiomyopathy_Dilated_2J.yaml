      adhesion complexes, but it also results in the dysregulation of
      DCM-related signaling pathways during ventricular chamber morphogenesis
    explanation: >-
      The authors' summary of the three consequences this node branches into.
  downstream:
  - target: Myofibril Disorganization
    causal_link_type: DIRECT
  - target: Cardiomyocyte Cell Adhesion Complex Failure
    causal_link_type: DIRECT
  - target: Dysregulated Notch and Hippo Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Typed with unknown intermediates because the signalling changes were
      measured as endpoints - reduced Notch reporter expression, reduced nuclear
      Taz - without the steps connecting them to loss of an actin-remodelling
      protein being established.
  - target: Sarcomeric Thin Filament Shortening
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Typed with unknown intermediates, and note it comes from a different

differential_diagnoses:
- name: Other genetic causes of infantile dilated cardiomyopathy
  description: Other sarcomeric, cytoskeletal, mitochondrial, metabolic and syndromic causes of infantile DCM can overlap clinically. Absence of extracardiac findings or arrhythmia in a small series does not exclude these alternatives.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: Pediatric cardiomyopathy (CM) corresponds to a group of clinically and genetically heterogeneous structural and functional disorders affecting the myocardium.
    explanation: 'Establishes the heterogeneity that makes this a genotype-level differential. Indirect: a class-level statement.'
- name: Dilated cardiomyopathy 2G (LMOD2)
  description: LMOD2-related CMD2G is another recessive infantile DCM. LMOD2 overexpression partially rescues cardiac Flii deletion in mice, but this does not establish identical mechanisms or a reliable prognostic distinction between the small human cohorts.
  evidence:
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Indeed, overexpression of leiomodin-2 in the heart, which lengthens the actin-containing thin filaments, partially rescued disease due to heart-specific deletion of Flii.
    explanation: The experimental link between the two entities' gene products.
discussions:
- discussion_id: cmd2j_mechanism_measured_in_severe_allele_not_patient_allele
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Do the patients' hypomorphic FLII alleles disturb cardiomyocyte adhesion-complex patterning and Notch/Hippo signalling, or are those findings properties of a severe truncating allele that the patient alleles do not reach?
  attaches_to:
  - pathophysiology#Cardiomyocyte Cell Adhesion Complex Failure
  - pathophysiology#Reduced Notch Signaling
  - pathophysiology#Reduced Nuclear TAZ Localization
  rationale: Vinculin/cadherin patterning, Notch reporter activity and TAZ localization were measured in severe D110fs larvae. Patient-equivalent genotypes reproduce cardiac dysfunction and, for R1230C, structural defects; the corresponding adhesion and signaling assays remain unperformed. The relative contributions of these processes may overlap rather than define mutually exclusive disease classes.
  proposed_experiments:
  - experiment_id: exp_cmd2j_vinculin_in_patient_allele_zebrafish
    name: Assay adhesion-complex patterning in the patient-mimicking zebrafish lines
    description: Cross the fliiR1230C/R1230C and fliiS449fs/R1158W lines into the Tg myl7:vcla-EGFP background and quantify focal concentration of vinculin-EGFP at the lateral cardiomyocyte membrane against wild-type siblings, using the same quantification applied to the severe line. Repeat for the Notch reporter and for nuclear Wwtr1/Taz. A negative result in the hypomorphic lines would be as informative as a positive one.
- discussion_id: cmd2j_two_genetic_claims_about_flii
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Is thin-filament shortening part of the mechanism of recessive CMD2J, or a property of the separate common-variant FLII association with cardiac remodelling?
  attaches_to:
  - pathophysiology#Sarcomeric Thin Filament Shortening
  rationale: Mouse cardiac deletion and R1245H perturb thin-filament length and contractile function. These are distinct genotypes from recessive human CMD2J. Measuring filament length in human or patient-equivalent models would test whether this mechanism contributes alongside adhesion and developmental effects.
  proposed_experiments:
  - experiment_id: exp_cmd2j_thin_filament_length_patient_cells
    name: Measure thin-filament length in CMD2J patient-derived cardiomyocytes
    description: Derive induced pluripotent stem cell cardiomyocytes from a patient with biallelic FLII variants, or use the patient-mimicking zebrafish, and measure sarcomeric actin thin-filament length by super-resolution imaging against isogenic controls, alongside tropomodulin-1 and leiomodin-2 localisation. Test whether leiomodin-2 overexpression rescues contractile function as it does in the mouse deletion model.
  evidence:
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: identified nominal associations between the FLII rs8821 variant and multiple cardiovascular diseases and phenotypes in humans
    explanation: Population associations are nominal and concern a separate susceptibility allele.

- name: Myofibril Disorganization
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Zebrafish carrying a patient-mimicking FLII missense allele have myofibrils
    and intercalated discs that are less densely packed and irregularly
    oriented, on transmission electron microscopy. The severe truncating line is
    worse still, with poorly defined filament organisation - a dose relationship
    that supports reading the patients' alleles as hypomorphic rather than null.

    directness: INDIRECT
    snippet: >-
      FLII, a member of the gelsolin superfamily, was initially described to be
      involved in the regulation of actin dynamics
    explanation: >-
      Identifies the protein family and its canonical function. Indirect: it
      states background biology rather than a finding in this disease.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      these data show that Flii dysfunction not only affects structural

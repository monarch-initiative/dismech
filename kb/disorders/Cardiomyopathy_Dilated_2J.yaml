  category: Cardiovascular
  description: >-
    Reported in one of the three patients (patient 2-II:1). One patient of
    three, so no frequency band; and a secundum atrial septal defect is common
    enough in the general infant population that a single occurrence cannot
    establish it as part of this syndrome. It is curated because it is a
    structural cardiac malformation in a disorder whose mechanism is
    morphogenetic, which makes it worth watching for in the next patient rather
    than dismissing as coincidence.

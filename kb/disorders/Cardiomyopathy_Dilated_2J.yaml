  downstream:
  - target: Impaired Ventricular Contractility
    causal_link_type: DIRECT
- name: Cardiomyocyte Cell Adhesion Complex Failure
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The finding the defining paper puts in its own title, and the one that
    separates flightless-I from an ordinary sarcomeric protein. Vinculin, imaged
    live as a fusion protein in zebrafish cardiomyocytes, normally concentrates
    into discrete foci at the lateral membrane. In flii mutants it is dispersed
    along the membrane instead. The adhesion machinery is present but no longer
    organised into the discrete anchor points a cardiomyocyte needs to transmit
    force to its neighbours.

    Note what this claim rests on. The dispersal was measured in the severe
    truncating line, not in the patient-mimicking knock-in - so the strength of
    the evidence here is for flightless-I's role in adhesion-complex patterning,
    with the extension to the hypomorphic patient alleles resting on the shared
    myofibrillar and contractile phenotype rather than on a vinculin measurement
    in those animals.
  biological_processes:
  - preferred_term: cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      in flii+/? siblings, Vcl-EGFP was distinctly concentrated in foci (Figure
      6A, left panel), whereas in fliiD110fs/D110fs embryos, Vcl-EGFP was
      dispersed throughout the lateral cardiomyocyte membranes
    explanation: >-
      The direct in-vivo observation of adhesion-complex mispatterning, in the
      severe truncating zebrafish line.
  downstream:
  - target: Impaired Ventricular Contractility
    causal_link_type: DIRECT
  - target: Defective Ventricular Trabeculation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Dysregulated Notch and Hippo Signaling
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Two developmental signalling pathways, both independently linked to
    trabeculation and to dilated cardiomyopathy, are disturbed in flii-deficient
    myocardium. Notch reporter expression is strongly reduced in compact-layer
    cardiomyocytes while being preserved in the atrioventricular canal and
    outflow tract - a regionally specific loss rather than a global one. Nuclear
    localisation of the Hippo effector Wwtr1/Taz is strongly reduced in the same
    ventricular myocardium.

    Marked PROVISIONAL for two reasons that should not be collapsed. Both
    measurements come from the severe truncating zebrafish line rather than from
    the patient-mimicking alleles; and both are readouts, not mechanisms - what
    connects loss of an actin-remodelling protein to reduced Notch reporter
    activity and to Taz nuclear exclusion is not established here. The likely
    bridge is mechanotransduction, since Taz is a mechanosensitive effector and
    the myofibrillar and adhesion lesions upstream both change how force is
    generated and transmitted; but that is reasoning, not a result in this
    paper, and it is stated as such.
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  - preferred_term: hippo signaling
    modifier: DYSREGULATED
    term:
      id: GO:0035329
      label: hippo signaling
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Notch reporter expression was present in the AVC and OFT of
      fliiD110fs/D110fs larvae, it was strongly reduced in compact layer
      cardiomyocytes of the mutants
    explanation: >-
      The regionally specific loss of Notch reporter activity in the compact
      myocardium.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Immunohistochemical analyses showed that Wwtr1/Taz nuclear localization
      was strongly reduced in the fliiD110fs/D110f ventricular myocardium at 60
      hpf
    explanation: >-
      The Hippo-arm measurement. The source's spelling of the genotype is
      retained in the quote.
  downstream:
  - target: Defective Ventricular Trabeculation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Sarcomeric Thin Filament Shortening
  biological_scale: MOLECULAR
  role: modulator
  mechanism_confidence: PROVISIONAL
  description: >-
    A fourth arm, reached from a different direction and in a different genetic
    model. Mouse work driven by a common FLII variant found in cardiac-remodelling
    genome-wide association studies showed that Flii binds the sarcomeric actin
    thin filament and influences its length, acting together with
    tropomodulin-1, and that deleting Flii from the heart - or introducing the
    R1245H substitution - causes cardiomyopathy through thin-filament shortening.

    The rescue is the part that makes this more than an association: overexpressing
    leiomodin-2, which lengthens thin filaments, partially rescued the disease
    caused by cardiac Flii deletion. That is a manipulation of the proposed
    mechanism reversing the phenotype, which is stronger evidence than a
    correlation - and it links this entry to dilated cardiomyopathy 2G, the
    LMOD2 disease, at the level of one shared physical parameter.

    PROVISIONAL for this entity all the same, and the reason is genetic rather
    than experimental. The mouse work concerns a common heterozygous-state
    variant and a cardiac-specific deletion; CMD2J is a recessive disease of
    biallelic hypomorphic alleles in infants. Thin-filament length has not been
    measured in a CMD2J patient or in the patient-mimicking zebrafish, and the
    defining paper does not report it.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Deletion of Flii from the heart, or mice with the R1245H amino acid
      substitution, show cardiomyopathy due to shortening of the actin thin
      filaments.
    explanation: >-
      The thin-filament mechanism and the cardiomyopathy it produces in mouse.
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Mechanistically, Flii is a known actin binding protein that we show
      associates with tropomodulin-1 (TMOD1) to regulate sarcomere thin filament
      length.
    explanation: >-
      The molecular partnership through which flightless-I is proposed to set
      thin-filament length.
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Indeed, overexpression of leiomodin-2 in the heart, which lengthens the
      actin-containing thin filaments, partially rescued disease due to
      heart-specific deletion of Flii.
    explanation: >-
      The rescue experiment, which tests the thin-filament-length mechanism
      rather than merely observing it, and which connects this entity to the
      LMOD2 disease curated as dilated cardiomyopathy 2G.
  downstream:
  - target: Impaired Ventricular Contractility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Defective Ventricular Trabeculation
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Trabeculation is how the embryonic ventricle builds the muscular complexity
    it needs before a coronary circulation exists. In flii mutant zebrafish it
    fails: the patient-mimicking line has less organised, more primitive
    trabeculae, and the severe truncating line has almost none, together with
    cardiomyocytes extruding toward the abluminal side of the ventricle.

    This node is why CMD2J reads as a morphogenetic disease rather than a
    degenerative one. A ventricle that never trabeculated properly starts life
    with a structural deficit, which is consistent with presentation at two to
    five months rather than in later childhood.
  biological_processes:
  - preferred_term: heart morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003007
      label: heart morphogenesis
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      we provided insights into the function of Flii during ventricular chamber
      morphogenesis in vivo, including myofibril organization and cardiomyocyte
      cell adhesion, as well as trabeculation
    explanation: >-
      Places trabeculation among the processes flightless-I is required for.
  downstream:
  - target: Impaired Ventricular Contractility
    causal_link_type: DIRECT
- name: Impaired Ventricular Contractility
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The convergence point, and the thing measured in both species. Dilated
    cardiomyopathy is by definition ventricular dilation with impaired
    myocardial contractility, and the zebrafish carrying the patients' own
    variants reproduced key functional abnormalities of the heart seen in the
    patients.

    Note this node is tagged ORGANISM rather than TISSUE: the claim is about
    whole-heart pump function, which is what the ejection fraction measures and
    what the patients present with, rather than about the state of the
    myocardial tissue.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Dilated CM (DCM), characterized by ventricular dilation and impaired
      myocardial contractility, is the most prevalent subtype among children
    explanation: >-
      The definition of the phenotype this node names. Indirect: it defines
      dilated cardiomyopathy in general, not this entity's physiology.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      We demonstrated that patient-specific FLII variants, when brought into the
      zebrafish genome using CRISPR/Cas9 genome editing, resulted in the

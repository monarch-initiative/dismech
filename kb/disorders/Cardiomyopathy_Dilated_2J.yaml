  preferred_term: cardiomyopathy, dilated, 2j
  term:
    id: MONDO:0957984
    label: cardiomyopathy, dilated, 2j
synonyms:
- CMD2J
- cardiomyopathy, dilated, 2J
- FLII-related dilated cardiomyopathy
- flightless-I dilated cardiomyopathy
- FLII-related pediatric cardiomyopathy
description: Dilated cardiomyopathy 2J is an autosomal recessive infantile cardiomyopathy associated with biallelic FLII variants. Three children from three unrelated families presented at 2–5 months without additional extracardiac features and were alive with stable or improved cardiac function at ages 2–9 years. ClinGen rates the gene-disease relationship Moderate. Patient-mimicking zebrafish show impaired ventricular contraction; myofibrillar disorganization and abnormal trabeculation were examined in the homozygous missense line. Adhesion-complex and Notch/TAZ measurements instead come from a severe truncating zebrafish line. Independent mouse work implicates thin-filament shortening, but it uses cardiac deletion or the separate R1243H susceptibility variant and does not establish that mechanism in human CMD2J.
parents:
- Dilated Cardiomyopathy
- Genetic Disorder
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: The 2023 clinical series contains three children, including two families previously reported in 2020; these publications must not be counted as independent cohorts. Phenotype observations and childhood follow-up do not establish penetrance, population frequencies or adult prognosis. General GeneReviews and ISHLT recommendations are extrapolated clinical guidance, without FLII-specific treatment-response evidence. Human p.Arg1240Cys in CMD2J is distinct from p.Arg1243His (rs8821), whose nominal population associations and mouse models concern susceptibility. Table 1 specifies c.2020C>G, p.Leu674Val for family 2; the corresponding allele was not modeled in zebrafish.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Biallelic variants segregated with disease in three families. Parents were heterozygous and had no clinical signs of DCM at the reported cardiac screening. This supports recessive inheritance but does not establish lifelong absence of risk in carriers.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Each of the parents was heterozygous for one of the FLII variants. None of the parents showed clinical signs of DCM at cardiac screening.
    explanation: Parental segregation and normal screening support the reported recessive relationship; normal screening alone does not exclude reduced-penetrance effects.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: We identified 3 unrelated patients with early-onset DCM and biallelic variants in the FLII gene, including 1 nonconsanguineous family of Dutch ancestry and 2 consanguineous families of Saudi Arabian ancestry
    explanation: Biallelic genotypes in three unrelated families, two of them consanguineous.

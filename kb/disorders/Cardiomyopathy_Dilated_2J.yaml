- name: flii D110fs severe truncating zebrafish
  species: Zebrafish
  genotype: flii D110fs homozygous premature stop in exon 5, lacking functional gelsolin domains
  publication: PMID:37561591
  description: Severe D110fs truncation removes substantial protein including gelsolin domains. This line carries adhesion, Notch and TAZ assays and a more severe structural phenotype than the patient-equivalent alleles.
  modeled_mechanisms:
  - target: Cardiomyocyte Cell Adhesion Complex Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Live imaging of a vinculin-EGFP fusion shows the protein dispersed along the lateral cardiomyocyte membrane instead of concentrated into foci.
    limitations: This is a severe truncating allele, not a patient allele. It demonstrates what flightless-I does for adhesion-complex patterning; it does not show that the patients' hypomorphic alleles disturb vinculin in the same way, which was not measured.
    readouts:
    - name: Vinculin-EGFP focal concentration at the lateral membrane
      target: Cardiomyocyte Cell Adhesion Complex Failure
      direction: DECREASED
      interpretation: Loss of focal concentration, with the protein present but dispersed, is a patterning failure rather than a loss of the adhesion machinery.
      evidence:
      - reference: PMID:37561591
        reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: in flii+/? siblings, Vcl-EGFP was distinctly concentrated in foci (Figure 6A, left panel), whereas in fliiD110fs/D110fs embryos, Vcl-EGFP was dispersed throughout the lateral cardiomyocyte membranes
        explanation: The imaging measurement behind this readout.
    - name: Cadherin2-GFP focal distribution at cell-cell junctions
      target: Cardiomyocyte Cell Adhesion Complex Failure
      direction: DECREASED
      interpretation: A second, independent junctional protein shows the same patterning failure - uniform smear along the junction instead of discrete foci - which is what distinguishes a general adhesion-complex localisation defect from a vinculin-specific one. The authors ran this experiment for exactly that reason.
      evidence:
      - reference: PMID:37561591
        reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: mutant larvae displayed uniform distribution of cadherin2-GFP expression along the cell-cell junctions in contrast to the cadherin foci present in flii+/? siblings
        explanation: The second imaging measurement behind this node, on cadherin2 rather than vinculin.
    evidence:
    - reference: PMID:37561591
      reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: these data show that Flii dysfunction not only affects structural components of the ventricular myocardium, including myofibrils and cell adhesion complexes, but it also results in the dysregulation of DCM-related signaling pathways during ventricular chamber morphogenesis
      explanation: 'Supports treating this line as informative for the adhesion node. Indirect: a summary across the paper''s models, not a statement about this line alone.'
    model_scale: CELLULAR
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: The severe D110fs truncation is not one of the reported human hypomorphic CMD2J genotypes; this assay cannot establish the same effect in those alleles.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Vinculin and cadherin patterning was imaged in embryonic zebrafish myocardium; the corresponding spatial organization in human infant cardiomyocytes has not been measured.

genetic:
- name: FLII
  gene_term:
    preferred_term: FLII
    term:
      id: hgnc:3750
      label: FLII
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    FLII encodes flightless-I, a gelsolin-superfamily actin-remodelling protein
    with an N-terminal leucine-rich repeat domain and C-terminal gelsolin-like
    domains. Four alleles are reported across the three families: one predicted
    premature stop, three missense changes at conserved residues, all rare or
    absent in gnomAD.

    Reading the FLII literature needs one distinction held firmly. There are two
    separate genetic claims about FLII and the heart, and conflating them would
    misstate both. This entry - CMD2J - is the recessive, biallelic, infantile
    disease. Separately, a common FLII variant, R1243H, was associated with
    cardiac remodelling in genome-wide association studies and studied in mice;
    that is a population-level risk allele acting in the heterozygous state, not
    a cause of CMD2J. Both bodies of work are cited here, and only the first
    establishes this entity.

    Two of the three families were previously published in a consanguineous
    pediatric-cardiomyopathy cohort, where FLII appeared as a candidate gene
    without functional validation. The 2023 paper is what converted the candidate
    into a gene-disease relationship, by adding a third independent family and
    modelling the patients' own alleles in zebrafish.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Taken together, our data provide experimental evidence for a role for FLII
      in the pathogenesis of pediatric CM and report biallelic variants as a
      genetic cause of pediatric CM.
    explanation: >-
      The gene-disease claim as the authors state it.
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      we identified a variant in the Flightless-I homolog (FLII) gene that
      generates a R1243H missense change and predisposes to cardiac remodeling
      across multiple previous human genome-wide association studies (GWAS)
    explanation: >-
      The separate, common-variant association with cardiac remodelling.
      Indirect for CMD2J: it is a population risk allele in the heterozygous
      state, and is cited here to keep the two FLII genetic claims distinct
      rather than to support this entity's cause.
  - reference: PMID:32870709
    reference_title: Categorized Genetic Analysis in Childhood-Onset Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Homozygous variants were also detected in 7 novel candidates (ACACB,
      AASDH, CASZ1, FLII, RHBDF1, RPL3L, ULK1).
    explanation: >-
      The earlier consanguineous childhood-onset cardiomyopathy cohort in which
      FLII first appeared, as one of seven homozygous novel candidate genes.
      Indirect: it is a candidate-gene listing without functional validation,
      and does not by itself establish the gene-disease relationship - which is
      exactly the distinction this entry's notes draw.

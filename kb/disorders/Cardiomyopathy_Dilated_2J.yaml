- name: Sarcomeric Thin Filament Shortening
  biological_scale: MOLECULAR
  role: modulator
  mechanism_confidence: PROVISIONAL
  description: Cardiac Flii deletion and homozygous R1245H knock-in mice have shortened thin filaments. Wild-type Flii interacts with TMOD1 through its gelsolin-like domain; R1245H disrupts interaction and localization. AAV9-LMOD2 partially rescues the deletion phenotype. These experiments concern different genotypes from CMD2J, and thin-filament length has not been measured in the reported patients or their zebrafish alleles.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Deletion of Flii from the heart, or mice with the R1245H amino acid substitution, show cardiomyopathy due to shortening of the actin thin filaments.
    explanation: The thin-filament mechanism and the cardiomyopathy it produces in mouse.
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: Mechanistically, Flii is a known actin binding protein that we show associates with tropomodulin-1 (TMOD1) to regulate sarcomere thin filament length.
    explanation: The molecular partnership through which flightless-I is proposed to set thin-filament length.
  - reference: PMID:37126682
    reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: Indeed, overexpression of leiomodin-2 in the heart, which lengthens the actin-containing thin filaments, partially rescued disease due to heart-specific deletion of Flii.
    explanation: The rescue experiment, which tests the thin-filament-length mechanism rather than merely observing it, and which connects this entity to the LMOD2 disease curated as dilated cardiomyopathy 2G.
  downstream:
  - target: Impaired Ventricular Contractility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - flii_thin_filaments

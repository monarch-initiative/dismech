- name: flii R1230C knock-in zebrafish (patient-mimicking missense)
  species: Zebrafish
  genotype: flii R1230C homozygous, the zebrafish equivalent of the patient allele p.(R1240C)
  publication: PMID:37561591
  description: Homozygous flii R1230C models human p.Arg1240Cys from family 3. Larvae survive to adulthood and show reduced contractility, disorganized myofibrils and abnormal trabeculation.
  modeled_mechanisms:
  - target: Myofibril Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Transmission electron microscopy shows less densely packed, irregularly oriented myofibrils and intercalated discs, in an animal carrying the knocked-in equivalent of a patient's own allele.
    limitations: The fish larval heart differs from human infant myocardium; this assay does not establish human tissue pathology or long-term clinical prognosis.
    readouts:
    - name: Myofibril and intercalated disc ultrastructure
      target: Myofibril Disorganization
      direction: ALTERED
      interpretation: Loss of the dense, regular packing seen in wild-type larvae is the structural correlate of this node.
      evidence:
      - reference: PMID:37561591
        reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: myofibrils and intercalated discs of fliiR1230C/R1230C larvae were less densely packed and irregularly oriented
        explanation: The ultrastructural measurement behind this readout.
    evidence:
    - reference: PMID:37561591
      reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: We demonstrated that patient-specific FLII variants, when brought into the zebrafish genome using CRISPR/Cas9 genome editing, resulted in the manifestation of key aspects of morphological and functional abnormalities of the heart, as observed in our patients.
      explanation: Supports treating this line as informative for the patients' cardiac phenotype, which is the claim the link makes.
    model_scale: CELLULAR
    divergences:

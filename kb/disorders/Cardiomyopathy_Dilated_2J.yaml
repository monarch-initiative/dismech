    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: AAV9-LMOD2 rescue was measured in postnatal mice; its delivery, developmental timing and functional response have not been established in human infants.
- name: Flii R1245H knock-in mouse
  species: Mouse
  genotype: Flii R1245H/+ and Flii R1245H/R1245H
  publication: PMID:37126682
  description: Models human rs8821 p.Arg1243His, a separate susceptibility allele. Homozygotes have reduced function and thin-filament length at 16 weeks; both genotypes have reduced function at 52 weeks. Homozygotes fare worse after pressure overload. These findings do not establish a dominant CMD2J subtype.
  modeled_mechanisms:
  - target: Sarcomeric Thin Filament Shortening
    model_scale: MOLECULAR
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: The syntenic susceptibility variant changes thin-filament length.
    limitations: The susceptibility variant differs from the recessive CMD2J alleles.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: R1245H models human rs8821 p.Arg1243His susceptibility, not the distinct recessive CMD2J alleles, including p.Arg1240Cys.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Thin-filament length was measured in mouse myocardium; corresponding measurements in human CMD2J tissue are unavailable.
    evidence:
    - reference: PMID:37126682
      reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: sham mice at 16 wk of age showed reduced thin filament length in the hearts of FliiR1245H/R1245H homozygous mice
      explanation: The syntenic susceptibility variant changes thin-filament length.
- name: Adult inducible cardiac Flii knockout mouse
  species: Mouse
  genotype: Flii floxed/floxed; alphaMHC-MerCreMer, tamoxifen from 4 weeks
  publication: PMID:37126682
  description: Inducible deletion tests myocardial maintenance after early development. Hearts develop hypertrophy and have greater pressure-overload-induced disease; this argues against an exclusively embryonic role for Flii.
  modeled_mechanisms:
  - target: Heart Failure
    model_scale: ORGANISM
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Adult cardiac deletion sensitizes mice to pressure-overload heart failure.
    limitations: Adult deletion plus imposed pressure overload differs from spontaneous infantile CMD2J.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: Induced cardiac deletion plus transverse aortic constriction differs from germline biallelic variants with spontaneous infantile presentation.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Heart failure was measured after pressure overload in mice; this experiment does not establish the clinical course or treatment response of infants with CMD2J.
    evidence:
    - reference: PMID:37126682
      reference_title: A human FLII gene variant alters sarcomeric actin thin filament length and predisposes to cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: with 3 wk of TAC stimulation there was significantly greater hypertrophy that transitioned into HF indicated by lung congestion
      explanation: Adult cardiac deletion sensitizes mice to pressure-overload heart failure.
progression:
- phase: Presentation in early infancy
  age_range: 2-5 months
  notes: All three patients presented between two and five months of age with signs of dilated cardiomyopathy and a severely reduced ejection fraction of 23 to 32 percent.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: 'All patients presented with signs of DCM within the first year of life (age range: 2–5 months) with severely reduced left ventricular ejection fraction (LVEF) (range 23%–32%).'
    explanation: The presenting phase in all three patients.
- phase: Stabilisation or improvement in childhood
  age_range: 2-9 years
  notes: At last reported follow-up, ages 2–9 years, all three children were alive with stable or improved cardiac function. Supplemental Table 1 records LVEF 33%, 58% and 34% respectively. These outcomes do not establish survival rates or adult natural history.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: At last follow-up (age range 2–9 years), all patients were alive and showed either stable disease or improved cardiac function.
    explanation: The follow-up outcome in all three patients.
  - reference: url:https://insight.jci.org/articles/view/168247/sd/pdf/render/1
    reference_title: https://insight.jci.org/articles/view/168247/sd/pdf/render/1
    supports: SUPPORT

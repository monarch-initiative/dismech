notes: >-
  Curation level. CMD2J is curated as a standalone entry, in line with how this
  knowledge base already handles the numbered dilated-cardiomyopathy loci -
  CMD2G (LMOD2), CMD1GG (SDHA), CMD1R (ACTC1) and many others are separate
  files. It is a distinct gene with a distinct mechanism and a distinct
  inheritance pattern from its neighbours, not a severity band on a parent
  entry.

  The whole entity rests on one paper and three patients. Everything clinical
  here comes from that report, and the numerators are given per phenotype
  because with three patients a percentage would be theatre. No frequency band
  is recorded on any phenotype for the same reason.

  Two sources, two genetic claims, kept separate. The defining paper reports
  biallelic, recessive, infantile disease. The mouse and GWAS paper concerns
  R1243H, a common variant associated with cardiac remodelling in the general
  population, studied in heterozygous-equivalent knock-in and in cardiac-specific
  deletion mice. Both are cited here, but only the first establishes CMD2J. The
  thin-filament-length mechanism is drawn from the second and is marked
  PROVISIONAL in this entry precisely because it has not been shown in a patient
  with biallelic FLII variants.

  The LMOD2 connection is real and is worth following. In the mouse work,
  overexpressing leiomodin-2 partially rescued cardiomyopathy caused by cardiac
  Flii deletion. Leiomodin-2 is the gene of dilated cardiomyopathy 2G, curated
  in this knowledge base as a thin-filament-length disease. That two of the
  numbered DCM loci converge on the same physical parameter - from opposite
  directions, one shortening and one failing to elongate - is the kind of
  observation a grouping could be built on later. It is recorded here rather
  than acted on.

  What this entry does not contain. No `treatments:` block: nothing has been
  published on treating CMD2J specifically, and importing standard heart-failure
  management would put therapies in the exported graph that no FLII patient has
  been reported to receive. No `biochemical:` block: no biomarker distinguishes
  this entity. Both absences are decisions, not gaps in the search.

  Two phenotypes are deliberately left unwired in the pathograph - the secundum
  atrial septal defect and the tachycardia - each with its reason recorded in
  its own `notes:`. Neither is an oversight.

  GeneReviews scope. There is no FLII-specific GeneReviews chapter, but the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486) applies and
  is tagged accordingly in `references`. Its indexed PubMed record is
  content_type abstract_only and carries only the chapter's purpose statement -
  not the Clinical Characteristics, Management, Genetic Counseling or
  Surveillance sections - so section-by-section GeneReviews mining is not
  possible from the cache. The one substantive sentence it does carry, on the
  proband evaluation strategy for nonsyndromic dilated cardiomyopathy, is
  quoted on the sequencing `diagnosis` entry; nothing else in the chapter is
  quotable. This follows the disposition already taken by the numbered-series
  peers `Cardiomyopathy_Dilated_2G`, `Cardiomyopathy_Dilated_100`,
  `Dilated_Cardiomyopathy_1AA` and `Dilated_Cardiomyopathy_1EE`, none of which
  has a gene-specific chapter either. The clinical baseline for this entry is
  therefore built entirely from the defining primary report.

  On the deep-research report committed with this entry. A falcon report was run
  with a disambiguating query naming FLII, the OMIM number and the recessive
  biallelic mechanism. `just preflight-dr` PASSed - FLII mentioned 45 times, the
  report's OMIM number matching MONDO's cross-reference - and the report
  independently reached this entry's framing, including the point this entry is
  most careful about: it states explicitly that the rs8821 p.Arg1243His
  susceptibility allele studied in adults and mice is not one of the four family
  alleles that define CMD2J.

  Two of its details are recorded here as uncited leads rather than curated,
  because they come from the defining paper's Table 1 rather than from any text
  that can be quoted against the cached record: two of the three patients
  presented with overt heart failure and one with a tachyarrhythmia, and the
  ages at last review were 2, 6 and 9 years. Heart failure is consequently not
  curated as a phenotype here, although it plainly belongs in the entity - a
  curator with the table in front of them should add it.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All three reported patients carry two FLII variants, and in each family the
    parents were heterozygous carriers with no clinical evidence of dilated
    cardiomyopathy on cardiac screening. Two of the three families were
    consanguineous. That combination - biallelic affected children, screened
    unaffected heterozygous parents - is the segregation evidence for
    recessiveness, and it is unusually complete for an entity defined on three
    families.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Each of the parents was heterozygous for one of the FLII variants. None of
      the parents showed clinical signs of DCM at cardiac screening.
    explanation: >-
      Carrier parents screened and unaffected, which is what distinguishes
      recessive inheritance from reduced-penetrance dominant inheritance here.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified 3 unrelated patients with early-onset DCM and biallelic
      variants in the FLII gene, including 1 nonconsanguineous family of Dutch
      ancestry and 2 consanguineous families of Saudi Arabian ancestry
    explanation: >-
      Biallelic genotypes in three unrelated families, two of them
      consanguineous.
pathophysiology:
- name: Biallelic FLII Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. Four variants were found across the three families:
    one predicted to introduce a premature stop codon, three missense changes at
    highly conserved residues. All were absent from gnomAD or present at very
    low frequency in the heterozygous state.

    The authors expected the mechanism to be hypomorphic rather than null, and
    that expectation is load-bearing for the whole entry: complete loss of FLII
    function is embryonic-lethal in Drosophila, zebrafish and mouse, so a viable
    human recessive disease has to involve alleles that leave some protein
    working. The zebrafish modelling is built around that distinction, with the
    patient-mimicking knock-ins compared against a pre-existing severe truncating
    line.
  genes:
  - preferred_term: FLII
    term:
      id: hgnc:3750
      label: FLII
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Curated as partial rather than complete loss of function on the authors'
      own reasoning - null FLII is embryonic-lethal across three model species,
      and these patients are alive with a cardiac-restricted phenotype - and on
      the zebrafish result that the patient-mimicking alleles give a milder
      phenotype than the severe truncating line. Note this is an inference about
      the alleles' consequence, not a direct measurement of residual
      flightless-I protein in a patient.
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Here, we identified biallelic variants in the highly conserved
      flightless-I (FLII) gene in 3 families with idiopathic, early-onset
      dilated CM.
    explanation: >-
      The gene-disease assignment that defines this entity.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      1 of the variants was predicted to result in a premature stop codon, and
      the other 3 variants were missense, affecting highly conserved amino acids
    explanation: >-
      The allelic spectrum across the three families.
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Gene knockout of FLII homologs leads to embryonic lethality in Drosophila,
      zebrafish, and mouse
    explanation: >-
      Establishes that complete FLII loss is not survivable, which is the basis
      for reading the patients' alleles as hypomorphic. Indirect: it is a
      cross-species statement about null alleles, not a measurement on these
      variants.
  downstream:
  - target: Reduced Flightless-I Function in Cardiomyocytes
    causal_link_type: DIRECT
- name: Reduced Flightless-I Function in Cardiomyocytes
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Flightless-I is a member of the gelsolin superfamily and was first described
    as a regulator of actin dynamics; it also localises at cell-adhesion sites.
    In the heart that combination gives it several jobs at once, and the three
    edges out of this node are the three the defining paper measured, with a
    fourth added from independent mouse work.

    The authors' own summary of what the protein turned out to be doing is worth
    keeping intact rather than paraphrasing: Flii dysfunction affects the
    structural components of the ventricular myocardium - myofibrils and cell
    adhesion complexes - *and* dysregulates DCM-related signalling pathways
    during ventricular chamber morphogenesis. This is not a protein with one
    downstream consequence.
  biological_processes:

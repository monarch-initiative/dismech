  - preferred_term: myofibril assembly
    modifier: DECREASED
    term:
      id: GO:0030239
      label: myofibril assembly
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      myofibrils and intercalated discs of fliiR1230C/R1230C larvae were less
      densely packed and irregularly oriented
    explanation: >-
      The ultrastructural measurement, in the zebrafish line carrying the

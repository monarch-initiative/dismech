    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: At 96 hpf, Notch reporter signal is reduced in compact-layer ventricular cardiomyocytes of severe D110fs larvae but retained in the atrioventricular canal and outflow tract. This regional reporter result has not been established in patient-equivalent alleles or human tissue.

    Deliberately not wired into the pathograph. No node in this entry causes
    atrial septation to fail: the morphogenetic lesion that is evidenced here is
    ventricular - trabeculation, myofibril organisation, cardiomyocyte adhesion
    in the ventricular wall - and nothing in either source connects flightless-I

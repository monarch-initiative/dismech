- name: FLII
  gene_term:
    preferred_term: FLII
    term:
      id: hgnc:3750
      label: FLII
  variant_origin: GERMLINE
  presence: PRESENT
  notes: 'Four variants were reported using NM_002018.3: family 1 carried c.1360C>T (p.Gln454Ter) and c.3502C>T (p.Arg1168Trp) in trans; family 2 was homozygous for c.2020C>G (p.Leu674Val); family 3 was homozygous for c.3718C>T (p.Arg1240Cys). Human functional consequences are inferred from segregation, predictions and models, rather than measured residual protein in patients. The 2020 and 2023 reports overlap in two families. The separate rs8821 association is not evidence of recessive CMD2J causation.'
  evidence:
  - reference: PMID:37561591
    reference_title: Biallelic variants in FLII cause pediatric cardiomyopathy by disrupting cardiomyocyte cell adhesion and myofibril organization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Taken together, our data provide experimental evidence for a role for FLII in the pathogenesis of pediatric CM and report biallelic variants as a genetic cause of pediatric CM.
    explanation: The gene-disease claim as the authors state it.
  - reference: PMID:32870709
    reference_title: Categorized Genetic Analysis in Childhood-Onset Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: Homozygous variants were also detected in 7 novel candidates (ACACB, AASDH, CASZ1, FLII, RHBDF1, RPL3L, ULK1).
    explanation: 'The earlier consanguineous childhood-onset cardiomyopathy cohort in which FLII first appeared, as one of seven homozygous novel candidate genes. Indirect: it is a candidate-gene listing without functional validation, and does not by itself establish the gene-disease relationship - which is exactly the distinction this entry''s notes draw.'

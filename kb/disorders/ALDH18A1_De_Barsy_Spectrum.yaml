name: ALDH18A1-Related Spastic Paraplegia and Neurocutaneous Spectrum
creation_date: "2026-04-04T00:00:00Z"
category: Mendelian
description: >
  Pathogenic variants in ALDH18A1, which encodes mitochondrial
  delta-1-pyrroline-5-carboxylate synthase (P5CS), cause a continuum of spastic
  paraplegia and neurocutaneous disease. This record curates three branches:
  autosomal dominant spastic paraplegia type 9A (SPG9A), autosomal recessive
  spastic paraplegia type 9B (SPG9B), and autosomal recessive cutis laxa type 3A
  (ARCL3A, De Barsy syndrome). ALDH18A1-related autosomal dominant cutis laxa
  (ADCL3) is a fourth branch curated separately. Disease-associated variants
  reduce P5CS function through variant-dependent effects on enzyme activity,
  oligomerization, protein abundance, or stability. Plasma proline, ornithine,
  citrulline, and arginine can be low in some genotypes but normal in others.
disease_term:
  preferred_term: P5CS deficiency
  term:
    id: MONDO:0100126
    label: P5CS deficiency
synonyms:
- SPG9A
- SPG9B
- Autosomal recessive cutis laxa type 3A
- ARCL3A
- De Barsy syndrome due to ALDH18A1
- P5CS deficiency
parents:
- Hereditary Spastic Paraplegia
- Metabolic Disease
- Neurodegenerative Disease
notes: >-
  This three-branch boundary is a project modeling decision, not a canonical
  external clinical grouping. The focused P5CS-deficiency review describes four
  ALDH18A1 syndromes on one continuum: SPG9A, SPG9B, ADCL3, and ARCL3A. To avoid
  duplicating the dedicated ALDH18A1_Cutis_Laxa.yaml record, this file uses the
  umbrella MONDO term P5CS deficiency (MONDO:0100126) as the entry-level
  disease_term covering SPG9A, SPG9B, and ARCL3A, while leaving ADCL3 to the
  adjacent record. Each branch is additionally grounded by its own
  subtype_term: SPG9A (MONDO:0011006), SPG9B (MONDO:0014702), and ARCL3A
  (MONDO:0009053, ALDH18A1-related de Barsy syndrome), so the subtype-level
  disease identities are machine-resolvable and not only described here.
has_subtypes:
- name: SPG9A
  display_name: Spastic Paraplegia 9A (Autosomal Dominant)
  subtype_term:
    preferred_term: Spastic paraplegia 9A, autosomal dominant
    term:
      id: MONDO:0011006
      label: hereditary spastic paraplegia 9A
  description: >
    Autosomal dominant hereditary spastic paraplegia caused by heterozygous
    ALDH18A1 pathogenic variants. Presentations range from pure to complex HSP;
    age at onset and additional findings, including cognitive involvement, are
    variable. Reduced P5CS function is established, while dominant-negative
    action is a proposed mechanism for dominant variants rather than a universal
    property of every SPG9A allele.
  evidence:
  - reference: PMID:26026163
    reference_title: "Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      identified monoallelic ALDH18A1 mutations segregating in three independent
      families with autosomal dominant pure or complex hereditary spastic paraplegia,
      as well as in two sporadic patients.
    explanation: Establishes SPG9A as an autosomal dominant form of ALDH18A1-related spastic paraplegia.
- name: SPG9B
  display_name: Spastic Paraplegia 9B (Autosomal Recessive)
  subtype_term:
    preferred_term: Spastic paraplegia 9B, autosomal recessive
    term:
      id: MONDO:0014702
      label: autosomal recessive complex spastic paraplegia type 9B
  description: >
    Autosomal recessive hereditary spastic paraplegia caused by biallelic
    ALDH18A1 pathogenic variants. Many reported cases have earlier onset and
    more complex neurologic disease than SPG9A, but later-onset SPG9B without
    cognitive impairment is documented. Published SPG9 cohorts did not have the
    cutis laxa, joint laxity, or hernia phenotype that defines the cutis-laxa
    branches.
  evidence:
  - reference: PMID:31402623
    reference_title: "P5CS expression study in a new family with ALDH18A1-associated hereditary spastic paraplegia SPG9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      conclude that both mutations are disease-causing, that SPG9B associates with
      partial P5CS deficiency and that it is clinically more severe than SPG9A, as
      reflected in onset age, disability, cognitive status, growth, and dysmorphic
      traits.
    explanation: Early series found SPG9B generally more severe than SPG9A, without making this absolute for every genotype.
  - reference: PMID:34093392
    reference_title: Novel Compound Missense and Intronic Splicing Mutation in ALDH18A1 Causes Autosomal Recessive Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG9B patients in our cohort presented with milder symptoms, i.e., later age at onset and without cognitive impairment.
    explanation: A later family establishes that SPG9B severity and cognitive involvement are variable.
- name: ARCL3A
  display_name: Autosomal Recessive Cutis Laxa Type 3A (De Barsy Syndrome)
  subtype_term:
    preferred_term: ALDH18A1-related de Barsy syndrome
    term:
      id: MONDO:0009053
      label: ALDH18A1-related de Barsy syndrome
  description: >
    Biallelic ALDH18A1 pathogenic variants cause an autosomal recessive
    neurocutaneous disorder with thin or lax skin, joint laxity, growth and
    neurodevelopmental impairment, and variable cataracts, microcephaly, and
    pyramidal findings. Variant effects range from reduced P5CS stability or
    activity to absent protein.
  evidence:
  - reference: PMID:25077174
    reference_title: Loss of ALDH18A1 function is associated with a cellular lipid droplet phenotype suggesting a link between autosomal recessive cutis laxa type 3A and Warburg Micro syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive cutis laxa type 3A is caused by mutations in ALDH18A1, a
      gene encoding the mitochondrial enzyme Δ(1)-pyrroline-5-carboxylate synthase
      (P5CS).
    explanation: Establishes ARCL3A as the biallelic ALDH18A1 cutis-laxa branch.
inheritance:
- name: Autosomal Dominant (SPG9A)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous ALDH18A1 pathogenic variants cause SPG9A and segregate with
    autosomal dominant pure or complex hereditary spastic paraplegia.
  evidence:
  - reference: PMID:26026163
    reference_title: "Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      identified monoallelic ALDH18A1 mutations segregating in three independent
      families with autosomal dominant pure or complex hereditary spastic paraplegia,
    explanation: Identifies monoallelic ALDH18A1 mutations in autosomal dominant pedigrees.
- name: Autosomal Recessive (SPG9B / ARCL3A)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic ALDH18A1 pathogenic variants cause SPG9B and ARCL3A. Their
    functional effects are variable, ranging from hypomorphic alleles with
    residual P5CS activity to variants associated with absent or unstable
    protein. For the ARCL3A branch, when both parents are heterozygous, each sib
    has a 25% chance of being affected, a 50% chance of being heterozygous, and
    a 25% chance of being unaffected and not a carrier.
  evidence:
  - reference: PMID:26026163
    reference_title: "Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      families with autosomal recessive transmission of ALDH18A1 mutations, and
      predominant complex hereditary spastic paraplegia with marked cognitive
      impairment, without any cutaneous abnormality.
    explanation: Identifies biallelic ALDH18A1 mutations in autosomal recessive spastic paraplegia families.
  - reference: PMID:24767728
    reference_title: "Cutis laxa, fat pads and retinopathy due to ALDH18A1 mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Autosomal recessive cutis laxa (ARCL) is a connective tissue disorder
      characterized by wrinkled, inelastic skin, frequently associated with a
      neurologic involvement and multisystem disease.
    explanation: Confirms autosomal recessive inheritance for ALDH18A1-related cutis laxa.
  - reference: PMID:41570168
    reference_title: "Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for a pathogenic variant, each sib
      of an individual with PYCR1- or ALDH18A1-related ARCL has at conception a 25%
      chance of being affected, a 50% chance of being heterozygous, and a 25% chance
      of being unaffected and not a carrier.
    explanation: >-
      GeneReviews supplies the recurrence-risk figures for the in-scope
      ALDH18A1-related ARCL3A branch; SPG9B inheritance is supported separately
      by its disease-specific evidence above.
genetic:
- name: ALDH18A1
  gene_term:
    preferred_term: ALDH18A1
    term:
      id: hgnc:9722
      label: ALDH18A1
  association: Causative
  features: >
    ALDH18A1 encodes the bifunctional mitochondrial enzyme P5CS (delta-1-pyrroline-
    5-carboxylate synthetase) composed of glutamate 5-kinase (G5K) and
    gamma-glutamyl phosphate reductase (G5PR) domains. Mutations in either domain
    can cause disease. Reduced P5CS function is the shared mechanism, but the
    molecular effect and residual activity are variant dependent. Dominant-negative
    action is proposed for dominant variants. Low plasma amino acids have been
    reported for some variants, whereas other molecularly confirmed cases have
    normal profiles; domain location is therefore not a reliable diagnostic rule.
  inheritance:
  - name: Autosomal Dominant
    evidence:
    - reference: PMID:26026163
      reference_title: Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        identified monoallelic ALDH18A1 mutations segregating in three independent
        families with autosomal dominant pure or complex hereditary spastic paraplegia,
      explanation: Supports dominant ALDH18A1 inheritance for SPG9A.
  - name: Autosomal Recessive
    evidence:
    - reference: PMID:26026163
      reference_title: Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        families with autosomal recessive transmission of ALDH18A1 mutations, and
        predominant complex hereditary spastic paraplegia with marked cognitive
        impairment, without any cutaneous abnormality.
      explanation: Supports recessive ALDH18A1 inheritance for SPG9B.
  evidence:
  - reference: PMID:29754261
    reference_title: "Compound heterozygous mutations in two different domains of ALDH18A1 do not affect the amino acid levels in a patient with hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Mutations in ALDH18A1 can cause autosomal recessive and dominant hereditary
      spastic paraplegia and autosomal recessive and dominant cutis laxa.
    explanation: Establishes that ALDH18A1 mutations cause both dominant and recessive forms of spastic paraplegia and cutis laxa.
  - reference: PMID:26026163
    reference_title: "Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      catalyses the first and common step of proline and ornithine biosynthesis from
      glutamate.
    explanation: Defines the enzymatic function of the ALDH18A1 gene product.
  - reference: CGGV:assertion_7bfbe962-beb3-4553-9909-a83a3aac2d55-2021-05-18T211134.377Z
    reference_title: "ALDH18A1 / P5CS deficiency (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ALDH18A1 | HGNC:9722 | P5CS deficiency | MONDO:0100126 | SD | Definitive"
    explanation: ClinGen classifies the ALDH18A1-P5CS deficiency gene-disease relationship as definitive with semidominant inheritance.
mechanistic_hypotheses:
- hypothesis_group_id: variant_dependent_p5cs_loss_model
  hypothesis_label: Variant-Dependent P5CS Loss-of-Function Model
  status: CANONICAL
  description: >-
    The shared mechanism across ALDH18A1 disorders is decreased P5CS function,
    but different variants impair activity, oligomer incorporation, abundance,
    stability, or splicing to different degrees. This model does not assume that
    every dominant or biallelic variant has the same molecular effect.
  evidence:
  - reference: PMID:32017139
    reference_title: "Δ(1) -Pyrroline-5-carboxylate synthetase deficiency: An emergent multifaceted urea cycle-related disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the four syndromes share the same pathogenic mechanisms based on decreased P5CS function.
    explanation: The focused review identifies decreased P5CS function as the common mechanism across all four branches.
- hypothesis_group_id: dominant_negative_spg9a_model
  hypothesis_label: Proposed Dominant-Negative SPG9A Model
  status: EMERGING
  applies_to_subtypes:
  - SPG9A
  description: >-
    Some heterozygous variants may impair the homooligomeric P5CS complex through
    a dominant-negative effect. This remains a variant-dependent proposal and is
    not generalized to every SPG9A allele.
  evidence:
  - reference: PMID:32017139
    reference_title: "Δ(1) -Pyrroline-5-carboxylate synthetase deficiency: An emergent multifaceted urea cycle-related disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the dominant mutations cause loss-of-function by dominant-negative mechanisms.
    explanation: The review supports the dominant-negative model, retained here as emerging because variant-level proof is incomplete.
- hypothesis_group_id: downstream_tissue_consequence_model
  hypothesis_label: Downstream Neural and Connective-Tissue Consequence Model
  status: EMERGING
  description: >-
    Reduced P5CS function is associated with corticospinal and neurocutaneous
    phenotypes, but the intervening tissue mechanisms are incompletely resolved.
    Fibroblast metabolomic, extracellular-matrix transcript, and lipid-droplet
    findings are retained as genotype-specific observations rather than proven
    causal bridges to individual clinical features.
  evidence:
  - reference: PMID:36067040
    reference_title: Functional assessment of homozygous ALDH18A1 variants reveals alterations in amino acid and antioxidant metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RNA sequencing of patient fibroblasts revealed transcript abundance changes in several metabolic and extracellular matrix-related genes, adding further insight into pathogenic processes associated with impaired P5CS function.
    explanation: Supports downstream cellular associations while leaving tissue-level causation unresolved.

diagnosis:
- name: Molecular Genetic Confirmation
  description: >-
    Confirmation centers on pathogenic ALDH18A1 variant identification, with
    zygosity, variant association, segregation, and phenotype interpreted
    together. A heterozygous HSP-associated pathogenic variant in a compatible
    SPG9 phenotype supports SPG9A, whereas biallelic pathogenic variants support
    SPG9B or ARCL3A according to clinical context. Heterozygosity alone does not
    distinguish SPG9A from the separately curated ADCL3 branch.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    Pathogenic ALDH18A1 variant(s), variant-disease association, zygosity,
    segregation, and phenotype consistent with the suspected SPG9A, SPG9B, or
    ARCL3A branch support the molecular diagnosis.
  evidence:
  - reference: PMID:32017139
    reference_title: "Δ(1) -Pyrroline-5-carboxylate synthetase deficiency: An emergent multifaceted urea cycle-related disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 2015 to 2016, an upper motor neuron syndrome (spastic
      paraparesis/paraplegia SPG9) complicated with some traits of the
      neurocutaneous syndrome, although without report of cutis laxa, joint laxity, or
      herniae, was associated with monoallelic or biallelic ALDH18A1 mutations with,
      respectively, dominant and recessive inheritance.
    explanation: >-
      The focused P5CS-deficiency review ties monoallelic and biallelic ALDH18A1
      variants to the dominant and recessive SPG9 branches, respectively.
  - reference: PMID:41570168
    reference_title: "Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DIAGNOSIS/TESTING: The diagnosis of a neurocutaneous disorder due a to
      mitochondrial proline synthesis defect can be established in a proband with
      characteristic clinical findings and identification of biallelic ALDH18A1 or
      PYCR1 pathogenic variants or a de novo ALDH18A1 pathogenic variant associated
      with ALDH18A1-related ADCL.
    explanation: >-
      GeneReviews establishes molecular confirmation with biallelic ALDH18A1
      pathogenic variants for the autosomal recessive neurocutaneous branch.
- name: Plasma Amino Acid Chromatography (Supportive)
  description: >-
    Plasma amino-acid chromatography is an optional supportive test. Low
    ornithine, citrulline, arginine, and proline can support P5CS deficiency,
    particularly in some SPG9A genotypes, but sensitivity is limited and normal
    values do not exclude molecularly confirmed ALDH18A1 disease.
  diagnosis_term:
    preferred_term: biomarker analysis
    term:
      id: NCIT:C63333
      label: Biomarker Analysis
  results: >-
    A low amino-acid profile supports P5CS deficiency; a normal profile is
    non-exclusionary and should not stop molecular testing or variant assessment.
  evidence:
  - reference: PMID:26026163
    reference_title: "Alteration of ornithine metabolism leads to dominant and recessive hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we therefore suggest including
      amino acid chromatography in the clinico-genetic work-up of hereditary spastic
      paraplegia, particularly in dominant cases, as the associated phenotype is not
      distinct from other causative genes.
    explanation: >-
      The original SPG9 study recommends amino-acid chromatography as a
      supportive component of the clinico-genetic work-up.
  - reference: PMID:29754261
    reference_title: "Compound heterozygous mutations in two different domains of ALDH18A1 do not affect the amino acid levels in a patient with hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This young man has spastic paraplegia with onset in
      childhood and temporal lobe epilepsy, but normal levels of proline, ornithine
      and arginine.
    explanation: >-
      A molecularly confirmed recessive SPG9 case had normal plasma amino acids,
      demonstrating that a normal result does not exclude the disorder.
treatments:
- name: Subtype-Bounded Genetic Counseling
  description: >-
    Counseling should distinguish heterozygous autosomal dominant SPG9A from
    biallelic autosomal recessive SPG9B and ARCL3A. Recurrence assessment and
    family testing should be based on the identified variant(s), zygosity, and
    segregation rather than applying a single risk model across the spectrum.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32017139
    reference_title: "Δ(1) -Pyrroline-5-carboxylate synthetase deficiency: An emergent multifaceted urea cycle-related disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 2015 to 2016, an upper motor neuron syndrome
      (spastic paraparesis/paraplegia SPG9) complicated with some traits of the
      neurocutaneous syndrome, although without report of cutis laxa, joint laxity, or
      herniae, was associated with monoallelic or biallelic ALDH18A1 mutations with,
      respectively, dominant and recessive inheritance.
    explanation: >-
      The review directly distinguishes dominant monoallelic from recessive
      biallelic SPG9 and supports inheritance-aware counseling.
- name: ARCL3A Multidisciplinary Supportive Care
  description: >-
    For the ARCL3A neurocutaneous branch, care is multidisciplinary and
    manifestation-directed, including speech and developmental support, physical
    therapy and mobility assistance, orthopedic care, ophthalmologic care, and
    routine treatment of associated neurologic findings. Arginine supplementation
    has been described only in a limited number of individuals with abnormal serum
    amino acids, and clinical benefit remains unconfirmed; it is not established
    disease-modifying therapy. These GeneReviews recommendations are not
    extrapolated here into a formal SPG9A/SPG9B management schedule.
  context: ARCL3A neurocutaneous branch
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41570168
    reference_title: "Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MANAGEMENT: Treatment of manifestations: Prelingual speech therapy to improve
      swallowing and speech development; routine treatment of epilepsy; in those with
      abnormal serum amino acids (low ornithine, citrulline, arginine),
      supplementation with arginine has been described in a limited number of
      individuals, but clinical benefit remains to be confirmed; physical therapy for
      motor delays and spastic diplegia; mobility devices for spastic diplegia;
      treatment of hip dislocation, scoliosis, and joint contractures per orthopedist;
    explanation: >-
      GeneReviews supports multidisciplinary manifestation-directed care and
      explicitly states that arginine experience is limited and benefit unconfirmed.
  - reference: PMID:22170564
    reference_title: "Understanding pyrroline-5-carboxylate synthetase deficiency: clinical, molecular, functional, and expression studies, structure-based analysis, and novel therapy with arginine."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MR spectroscopy revealed decreased brain creatine, which normalized after sustained
      arginine supplementation, with improvement of neurodevelopmental and metabolic
      parameters, suggesting a pathogenic role of brain creatine decrease and the
      value of arginine therapy.
    explanation: >-
      A single-patient report provides a limited positive signal for arginine,
      while the later review states that clinical benefit remains unconfirmed.

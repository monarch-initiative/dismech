  description: >-
    A full skeletal survey is what establishes that the phenotype is a
    spondyloepimetaphyseal dysplasia rather than a non-syndromic short stature,
    and it is what carries most of the discriminating findings in this disease -
    platyspondyly with rectangular vertebral bodies and irregular endplates,
    wide metaphyses, small irregular epiphyses, shallow acetabula and
    brachydactyly. It cannot distinguish SEMD-ACAN from the other SEMDs on its
    own; it places the patient in the category that then gets sequenced.
  diagnosis_term:

genetic:
- name: ACAN
  notes: >-
    Encodes the aggrecan core protein. The recessive disease described here is
    caused by variants affecting aggrecan: the founding family is homozygous for
    a G3 C-type lectin domain substitution, and the second patient carries two
    missense variants in the CS1 and CS2 glycosaminoglycan-attachment domains.
    ACAN is allelic
    across a wide range: heterozygous variants cause dominant spondyloepiphyseal
    dysplasia Kimberley type and familial osteochondritis dissecans, and common
    variation at the locus associates with normal height. This entry is scoped to
    the recessive aggrecan-type SEMD and does not absorb those.
  gene_term:
    preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These genes were assessed and ranked by cartilage selectivity with
      whole-genome microarray data, revealing only two genes, encoding aggrecan
      and chondroitin sulfate proteoglycan 4, that were selectively expressed in
      cartilage.
    explanation: >-
      Records how ACAN was identified from within the mapped interval, which is
      what makes the assignment more than positional.
  - reference: PMID:28804204
    reference_title: ACAN mutations as a cause of familial short stature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      At least 25 pathological ACAN mutations have been identified in patients
      with highly variable phenotypes of syndromic or non-syndromic short
      stature.
    explanation: >-
      Establishes the breadth of the ACAN allelic series, which is the reason
      this entry states its scope explicitly. Graded OTHER as a review.
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants in the ACAN gene were both missense mutations (c.4138G>T,
      p.1380V>F, and c.5061T>A, p.1687S>R) and had been tested for mutational
      effects using the amino acid substitution prediction tool, Mutation Taster
    explanation: >-
      Records the second family's two variants in the notation the source uses,
      together with the fact that their consequence was predicted rather than
      measured. Quoted verbatim, including the paper's non-standard protein
      notation, because a curator-normalized form would not be a quote.
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient’s father and mother had already died, and his siblings refused
      genetic tests; hence, we could not obtain samples from them.
    explanation: >-
      Records that phase could not be established for the second family, which
      is why the recessive assignment there rests on the phenotype and the gene
      rather than on segregation.

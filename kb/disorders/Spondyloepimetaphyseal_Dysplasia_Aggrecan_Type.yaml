discussions:
- discussion_id: semd_acan_genotype_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the domain location of the ACAN variants explain the difference in
    severity between the two reported families, and what would it take to show
    that it does?
  rationale: >-
    The original siblings reached 66-71 cm; the second patient reached 118.3 cm,
    had a normal face, and lived independently to 45. That is a very large
    difference for one ultra-rare Mendelian disorder, and the source does offer
    an explanation for it: the founding family is homozygous for a C-type lectin
    domain substitution, the second patient carries two variants in the CS1 and
    CS2 domains, and the paper states that these different mutation patterns
    account for the phenotypic difference. The gap is that nothing functional
    stands behind that attribution. The CS-domain variants were assessed with
    Mutation Taster and conservation, not expressed or assayed; no comparison
    against p.D2267N has been made; the parents had died and the siblings
    refused testing, so the variants could not be shown to be in trans; and the
    authors' own claim is hedged as speculation. Resolving it needs the same
    binding and matrix-assembly work that was done for p.D2267N applied to the
    CS-domain alleles, or a third family. Until then the entry carries a
    severity range and a domain-location hypothesis, not a genotype-phenotype
    rule.
  attaches_to:
  - pathophysiology#Biallelic ACAN Variants Disrupting Aggrecan Function
  - phenotypes#Severe short stature
- discussion_id: semd_acan_binding_partner_scope
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is loss of tenascin-C binding sufficient to explain the skeletal phenotype,
    or is the pathogenic effect the loss of several G3 lectin-domain
    interactions at once?
  rationale: >-
    The binding defect was measured against tenascin-C, and that is the evidence
    the pathograph carries. But the same domain binds tenascin-R, fibulin-1,
    fibulin-2 and fibrillin-1 in the same calcium-dependent way, and a
    calcium-coordinating substitution has no obvious reason to be selective. The
    entry names tenascin-C because that is what was measured, not because the
    others were excluded, and this discussion records that distinction so the
    single-partner framing is not read as an established fact.
  attaches_to:
  - pathophysiology#Impaired Calcium-Dependent Binding of the G3 Domain to Tenascin-C
notes: >-
  Curated from a Perplexity deep-research report used as a lead only. The report
  cites 19 sources, of which its reference_validation could check 6 - all
  resolved, 4 judged on topic. Its term_validation reported 8 of 33 checked
  labels naming a different term than the report claimed, so its CURIEs were not
  reused and every binding here was resolved through OAK. All references were
  resolved to PMIDs (from the report's PMC URLs via the NCBI ID converter),
  fetched into references_cache, and quoted from the fetched text. The open PR
  #9082 curating RSPRY1-related SEMD covers a different gene and a different
  MONDO term; there is no overlap.
review_notes: >-
  Three things a reviewer should look at. First, the two reported families do
  not carry the same lesion - the founding family is homozygous for a G3 C-type
  lectin domain substitution with binding data behind it, while the second
  patient carries two CS-domain missense variants supported only by Mutation
  Taster and conservation, with no parental samples available to establish
  phase. The trigger node is therefore named for the gene rather than the
  domain, the mechanistic arms below it are marked as established for the
  lectin-domain allele only, and the semd_acan_genotype_severity discussion
  records that the source's domain-location explanation for the severity
  difference has no functional data behind it. Second, the mechanism is
  deliberately not modelled as aggrecan deficiency: the founding study showed the mutant G3 domain
  traffics and is secreted normally, and that negative result is given its own
  pathophysiology node because it is what excludes the mechanism a reader would
  otherwise assume. Third, tenascin-C is named as the binding partner because it
  is the one measured by surface plasmon resonance, not because the other
  lectin-domain partners were excluded; a discussion records that explicitly so
  the node is not over-read.

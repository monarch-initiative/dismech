name: Spondyloepimetaphyseal Dysplasia Aggrecan Type
creation_date: "2026-09-01T13:40:21Z"
category: Mendelian
parents:
- Spondyloepimetaphyseal Dysplasia
- Cartilage Extracellular Matrix Disorder
disease_term:
  preferred_term: spondyloepimetaphyseal dysplasia, aggrecan type
  term:
    id: MONDO:0013014
    label: spondyloepimetaphyseal dysplasia, aggrecan type
synonyms:
- SEMD aggrecan type
- SEMD-ACAN
- SEMDAG
description: >-
  Spondyloepimetaphyseal dysplasia, aggrecan type is a recessive skeletal
  dysplasia caused by biallelic ACAN variants, presenting with severe
  disproportionate short stature and combined vertebral, epiphyseal and
  metaphyseal abnormality. Aggrecan is the proteoglycan that gives cartilage its
  compressive stiffness, so the naive expectation is that this disease is
  aggrecan deficiency. The founding family says otherwise, and that is what makes
  the entry mechanistically interesting: the causal variant is a single missense
  substitution, p.D2267N, in the C-type lectin domain of aggrecan's C-terminal
  G3 domain. Expression work showed the mutant protein still trafficked and was
  secreted normally; what changed was the calcium-dependent binding of that
  domain to tenascin-C, measured by surface plasmon resonance. The lesion is
  therefore in how aggrecan is anchored into the matrix network, not in how much
  of it there is. ACAN is allelic across a wide severity range - heterozygous
  variants cause dominant SED Kimberley type, familial osteochondritis dissecans,
  and idiopathic short stature - and this entry is scoped to the recessive
  aggrecan-type SEMD, relating the others rather than absorbing them. Only two
  families have been reported, and the second is substantially milder than the
  first.
pathophysiology:
- name: Biallelic ACAN Variants Affecting the G3 C-Type Lectin Domain
  description: >-
    The founding lesion is homozygosity for c.6799G>A, predicting p.D2267N in the
    C-type lectin domain of aggrecan's G3 domain. The identification is worth
    recording because it constrains what kind of mechanism this is: the locus was
    mapped by identity-by-descent to a 17.4 Mb interval containing 296 genes, and
    ranking those genes by cartilage-selective expression left only two, of which
    ACAN was one. The substituted residue is predicted to coordinate a calcium
    ion that shapes the binding loops of the lectin domain.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of aggrecan complementary DNA from an affected individual
      revealed homozygosity for a missense mutation (c.6799G --> A) that predicts
      a p.D2267N amino acid substitution in the C-type lectin domain within the
      G3 domain of aggrecan.
    explanation: >-
      Identifies the causal variant and its precise position within the protein,
      which is what the rest of the pathograph depends on.
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The D2267 residue is predicted to coordinate binding of a calcium ion,
      which influences the conformational binding loops of the C-type lectin
      domain that mediate interactions with tenascins and other
      extracellular-matrix proteins.
    explanation: >-
      Gives the structural reason the substitution should affect binding rather
      than abundance, which is the hypothesis the next node tests.
  downstream:
  - target: Preserved Aggrecan Synthesis and Secretion
    causal_link_type: DIRECT
    description: >-
      The mutant G3 domain was expressed to test whether the substitution acts by
      disrupting protein production.
  - target: Impaired Calcium-Dependent Binding of the G3 Domain to Tenascin-C
    causal_link_type: DIRECT
    description: >-
      The substitution alters the calcium-coordinating residue in the binding
      loop.
- name: Preserved Aggrecan Synthesis and Secretion
  description: >-
    A negative result, and a load-bearing one. Expressing normal and mutant G3
    domains in mammalian cells showed the mutation created a new functional
    N-glycosylation site but did not impair trafficking or secretion. That rules
    out the mechanisms this disease would otherwise be assumed to have -
    haploinsufficiency, retention in the endoplasmic reticulum, degradation of a
    misfolded product - and forces the mechanism onto what the secreted protein
    then fails to do.
  role: mechanism
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the normal and mutant G3 domains in mammalian cells showed
      that the mutation created a functional N-glycosylation site but did not
      adversely affect protein trafficking and secretion.
    explanation: >-
      Directly excludes a secretion or trafficking defect, which is what makes
      this node a genuine constraint on the mechanism rather than a detail.
  notes: >-
    Recorded as a distinct node rather than folded into the description because
    it is the experiment that excludes the obvious alternative mechanism. A
    reader who assumes aggrecan deficiency will otherwise mis-model this disease.
- name: Impaired Calcium-Dependent Binding of the G3 Domain to Tenascin-C
  description: >-
    The functional lesion. Surface plasmon resonance showed the substitution
    changes both the affinity and the kinetics of the interaction between the
    aggrecan G3 domain and tenascin-C. The G3 lectin domain is how aggrecan
    engages the wider matrix network - tenascin-R and tenascin-C, fibulins,
    fibrillin-1 - all in a calcium-dependent manner, so a change at the
    calcium-coordinating residue degrades the anchoring rather than the molecule.
  role: mechanism
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TNC
    term:
      id: hgnc:5318
      label: TNC
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Surface-plasmon-resonance studies showed that the mutation influenced the
      binding and kinetics of the interactions between the aggrecan G3 domain and
      tenascin-C.
    explanation: >-
      The direct biophysical measurement of the binding defect, on the specific
      interaction this node names.
  downstream:
  - target: Disorganized Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Aggrecan that cannot engage its matrix partners normally cannot be
      integrated into the network the same way.
- name: Disorganized Cartilage Extracellular Matrix
  description: >-
    Aggrecan is the major proteoglycan of growth-plate and articular cartilage
    and provides the hydrated gel that gives the tissue its load-bearing
    properties. Degrading how it is anchored degrades the matrix as a mechanical
    structure, which is the level at which a molecular binding defect becomes a
    tissue phenotype.
  role: mechanism
  biological_scale: TISSUE
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  evidence:
  - reference: PMID:28804204
    reference_title: ACAN mutations as a cause of familial short stature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Aggrecan provides the hydrated gel structure important for the load-bearing
      properties of joints and plays a key role in cartilage and bone
      morphogenesis.
    explanation: >-
      States aggrecan's structural role in the matrix, which is the function this
      node asserts is degraded. Graded OTHER because the source is a narrative
      review rather than a primary study.
  downstream:
  - target: Impaired Endochondral Ossification at the Growth Plate
    causal_link_type: DIRECT
    description: >-
      Growth-plate cartilage is the template for endochondral bone growth, so a
      defective matrix there limits linear growth.
- name: Impaired Endochondral Ossification at the Growth Plate
  description: >-
    Linear bone growth is produced by chondrocyte division and matrix production
    at the growth plate, then replacement of that cartilage by bone. A defective
    matrix compromises both the template and the mechanical environment the
    chondrocytes work in. Because the vertebral bodies, epiphyses and metaphyses
    are all sites of endochondral growth, one lesion at this node produces the
    combined spondylar, epiphyseal and metaphyseal picture the disease is named
    for - which is why this is a single dysplasia rather than three coincident
    ones.
  role: consequence
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  - preferred_term: growth plate cartilage development
    modifier: ABNORMAL
    term:
      id: GO:0003417
      label: growth plate cartilage development
  locations:
  - preferred_term: epiphysis
    term:
      id: UBERON:0001437
      label: epiphysis
  - preferred_term: metaphysis
    term:
      id: UBERON:0001438
      label: metaphysis
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings identify an autosomal-recessive skeletal dysplasia and a
      significant role for the aggrecan C-type lectin domain in regulating
      endochondral ossification and, thereby, height.
    explanation: >-
      The authors' own causal statement linking the lectin domain through
      endochondral ossification to stature, which is exactly the step this node
      represents.
  - reference: PMID:28804204
    reference_title: ACAN mutations as a cause of familial short stature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Linear bone growth is determined by the division and growth of
      matrix-producing
      chondrocytes at the growth plate.
    explanation: >-
      Establishes the growth plate as the site where matrix quality translates
      into stature. Graded OTHER as a review.
  downstream:
  - target: Severe short stature
    causal_link_type: DIRECT
    description: >-
      Reduced long bone and vertebral growth.
  - target: Platyspondyly
    causal_link_type: DIRECT
    description: >-
      Vertebral body growth plates are affected alongside the long bones.
  - target: Metaphyseal widening
    causal_link_type: DIRECT
    description: >-
      Disordered metaphyseal modelling.
  - target: Brachydactyly
    causal_link_type: DIRECT
    description: >-
      The short tubular bones of the hand are affected disproportionately.
  - target: Osteoarthritis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A defective articular cartilage matrix predisposes to premature
      degenerative joint disease; the intervening years of loading are omitted.
phenotypes:
- name: Severe short stature
  category: Growth
  description: >-
    Disproportionate and micromelic, with acromesomelic limb shortening. The
    severity differs sharply between the two reported families: 66-71 cm in the
    three original siblings, against 118.3 cm (-9.1 SD) in the second patient.
    Both are severe, but they are not the same disease severity, and the entry
    does not average them.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Severe short stature
    term:
      id: HP:0003510
      label: Severe short stature
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of a nuclear family with three affected offspring identified an
      autosomal-recessive form of spondyloepimetaphyseal dysplasia characterized
      by severe short stature and a unique constellation of radiographic
      findings.
    explanation: >-
      Establishes severe short stature as the defining clinical feature in the
      original family.
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At our first examination, his height was 118.3 cm (−9.1 SD), his weight was
      38.9 kg (−2.3 SD)
    explanation: >-
      Gives the measured stature in the second reported patient, which is the
      basis for describing the severity range rather than a single figure.
- name: Disproportionate short stature
  category: Growth
  description: >-
    The proportion is micromelic despite the spondylar involvement, with
    acromesomelic shortening of the limbs. That combination is part of what
    distinguishes this dysplasia radiographically.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Disproportionate short stature
    term:
      id: HP:0003498
      label: Disproportionate short stature
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He showed acromesomelic shortening of the limbs and relative macrocephaly.
    explanation: >-
      Records the limb-shortening pattern that makes the stature disproportionate
      rather than uniformly reduced.
- name: Platyspondyly
  category: Skeletal
  description: >-
    Moderate, with rectangular vertebral bodies and irregular endplates. It is
    the spondylar component of the spondylo-epi-metaphyseal triad.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Platyspondyly
    term:
      id: HP:0000926
      label: Platyspondyly
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The spine showed moderate platyspondyly with cervical lordosis and
      thoracolumbar kyphosis.
    explanation: >-
      Records platyspondyly and the associated spinal curvature in the second
      patient.
- name: Metaphyseal widening
  category: Skeletal
  description: >-
    Metaphyseal flaring of short, relatively broad long bones - the metaphyseal
    component of the triad, and one of the radiological hallmarks reported in the
    original family.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Metaphyseal widening
    term:
      id: HP:0003016
      label: Metaphyseal widening
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The long bones were short and relatively broad, with metaphyseal flaring.
    explanation: >-
      Describes the metaphyseal abnormality directly.
- name: Abnormal epiphysis morphology
  category: Skeletal
  description: >-
    Small, irregular epiphyses of the long bones - the epiphyseal component,
    reported as a radiological hallmark of the original family.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Abnormal epiphysis morphology
    term:
      id: HP:0005930
      label: Abnormal epiphysis morphology
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The radiological hallmarks included moderate platyspondyly with rectangular
      vertebral bodies, wide metaphyses and small, irregular epiphyses, multiple
      clefts of the cervical spine, and bradydactyly with accessory carpal
      ossification centers.
    explanation: >-
      Enumerates the radiological hallmarks including the epiphyseal
      abnormality. The typographical error in "bradydactyly" is present in the
      source and is preserved so the quote stays exact.
- name: Brachydactyly
  category: Skeletal
  description: >-
    Severe in the original family, with short broad thumbs, horizontal nails,
    telescoping interphalangeal joints and accessory carpal ossification centres;
    generalized but less extreme in the second patient.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Brachydactyly
    term:
      id: HP:0001156
      label: Brachydactyly
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brachydactyly was very severe, with short, broad thumbs, horizontal nails,
      and telescoping interphalangeal joints.
    explanation: >-
      Describes the hand phenotype in the original family in the detail that
      makes it distinctive.
- name: Relative macrocephaly
  category: Craniofacial
  description: >-
    Present in both reports, and relative rather than absolute - the head is
    normally grown while the rest of the skeleton is not, which is what the
    growth-plate localisation of the defect predicts.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Relative macrocephaly
    term:
      id: HP:0004482
      label: Relative macrocephaly
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He showed acromesomelic shortening of the limbs and relative macrocephaly.
    explanation: >-
      Records relative macrocephaly in the second patient.
- name: Midface retrusion
  category: Craniofacial
  description: >-
    Severe in the original family, along with relative prognathism and low-set
    ears. Notably absent in the second patient, whose face was described as
    normal - so the craniofacial component is not an obligate part of the
    syndrome.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Midface retrusion
    term:
      id: HP:0011800
      label: Midface retrusion
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had no midface hypoplasia, prognathism, or low-set ears.
    explanation: >-
      A negative finding in the second patient, quoted because it is what
      establishes the craniofacial features as variable rather than defining.
- name: Osteoarthritis
  category: Skeletal
  description: >-
    Premature degenerative joint disease, significant at the hips by middle age
    in the second patient. It is the expected long-term consequence of a
    defective articular cartilage matrix, and the reason follow-up in this
    disease is orthopaedic as much as endocrine.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Osteoarthritis
    term:
      id: HP:0002758
      label: Osteoarthritis
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Degenerative joint disease of the large joints, particularly of the hip,
      was significant.
    explanation: >-
      Documents the degenerative joint involvement recorded here.
- name: Genu valgum
  category: Skeletal
  description: >-
    Required surgical correction in the second patient, and an example of the
    orthopaedic burden this disease carries beyond stature itself.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Genu valgum
    term:
      id: HP:0002857
      label: Genu valgum
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He underwent surgical correction for genu valgum.
    explanation: >-
      Records the deformity and that it was severe enough to operate on.
genetic:
- name: ACAN
  notes: >-
    Encodes the aggrecan core protein. The recessive disease described here is
    caused by variants affecting the G3 C-type lectin domain. ACAN is allelic
    across a wide range: heterozygous variants cause dominant spondyloepiphyseal
    dysplasia Kimberley type and familial osteochondritis dissecans, and common
    variation at the locus associates with normal height. This entry is scoped to
    the recessive aggrecan-type SEMD and does not absorb those.
  gene_term:
    preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These genes were assessed and ranked by cartilage selectivity with
      whole-genome microarray data, revealing only two genes, encoding aggrecan
      and chondroitin sulfate proteoglycan 4, that were selectively expressed in
      cartilage.
    explanation: >-
      Records how ACAN was identified from within the mapped interval, which is
      what makes the assignment more than positional.
  - reference: PMID:28804204
    reference_title: ACAN mutations as a cause of familial short stature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      At least 25 pathological ACAN mutations have been identified in patients
      with highly variable phenotypes of syndromic or non-syndromic short
      stature.
    explanation: >-
      Establishes the breadth of the ACAN allelic series, which is the reason
      this entry states its scope explicitly. Graded OTHER as a review.
inheritance:
- name: Autosomal recessive
  description: >-
    Autosomal recessive, established in the founding family by homozygosity for a
    haplotype identical by descent between affected siblings. The second reported
    patient was born to non-consanguineous parents with normal-height relatives,
    consistent with compound heterozygosity for two ACAN variants rather than
    homozygosity for one.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19110214
    reference_title: >-
      A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense
      mutation affecting the C-type lectin domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity for a haplotype that was identical by descent between two of
      the affected individuals identified a locus for the disease gene within a
      17.4 Mb interval on chromosome 15
    explanation: >-
      The mapping evidence that establishes recessive inheritance in the founding
      family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two families reported in total: three affected siblings in the original
    report and one unrelated adult in the second. No prevalence estimate exists.
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SEMD-ACAN is a newly recognized autosomal recessive form of SEMD. Only one
      affected family has been reported to date, and here, we have reported the
      second case.
    explanation: >-
      States the total reported case count at the time of the second report,
      which is the basis for the ultra-rare classification.
progression:
- phase: Presentation
  notes: >-
    Birth measurements were within the normal range in the second patient, and
    short stature came to attention at six years of age - so the growth failure
    is postnatal rather than congenital, which is what a growth-plate mechanism
    predicts. The original family's severity suggests earlier recognition there.
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His birth weight and length were reported to be within the normal range.
    explanation: >-
      Establishes that birth size was normal, which is what makes the growth
      failure postnatal.
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 6 years of age, his short stature attracted attention
    explanation: >-
      Gives the age at which growth failure became apparent, quoted separately
      because it is not contiguous with the birth-size sentence in the source.
- phase: Adult course
  notes: >-
    The second patient reached 45 in good general health and living
    independently, with the main burdens being stature, degenerative joint
    disease and the consequences of orthopaedic deformity. The disease is
    disabling rather than life-limiting on this evidence, though two families is
    a thin basis for a prognosis.
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other than his short stature and essential hypertension that began to
      manifest in adulthood, he has been healthy and living independently.
    explanation: >-
      Records the adult functional outcome in the only patient followed to middle
      age.
treatments:
- name: Orthopedic Surgical Correction of Limb Deformity
  description: >-
    Correction of angular deformity such as genu valgum. It addresses the
    mechanical consequences of disordered growth and does nothing to the matrix
    defect, which is the only kind of intervention this disease currently has.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:30124491
    reference_title: >-
      The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
      milder phenotype than originally reported.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He underwent surgical correction for genu valgum.
    explanation: >-
      The only treatment documented in either report, recorded as what was
      actually done rather than as a recommendation.
  target_mechanisms:
  - target: Genu valgum
    treatment_effect: BYPASSES
    description: >-
      Realigns the limb mechanically. Targeted at the phenotype because the
      operation acts on the deformity, not on any node in the mechanism.
    evidence:
    - reference: PMID:30124491
      reference_title: >-
        The second report on spondyloepimetaphyseal dysplasia, aggrecan type: a
        milder phenotype than originally reported.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        He underwent surgical correction for genu valgum.
      explanation: >-
        Supports the target. Marked INDIRECT because the report records that the
        operation happened, not a measured outcome from it.
  notes: >-
    No other treatment is listed because neither report describes one. Growth
    hormone has been used in other ACAN-related short stature, but nothing in the
    sources used here evaluates it in the recessive aggrecan-type SEMD, and
    importing it would be an extrapolation across a different disease severity
    and a different allele class.
differential_diagnoses:
- name: Spondyloepiphyseal dysplasia, Kimberley type
  description: >-
    The dominant ACAN disorder - allelic, milder, and caused by heterozygous
    variants. It is the same gene at a different dose and is the closest relative
    of this entry rather than a mimic.
- name: Spondyloepiphyseal dysplasia congenita
  description: >-
    COL2A1-related, with congenital rather than postnatal onset of growth failure
    and with the ocular and hearing involvement that type II collagenopathies
    carry and this disease does not.
- name: Familial osteochondritis dissecans
  description: >-
    Also caused by a missense variant in the ACAN C-type lectin domain, but
    dominant and confined to short stature with joint disease. Its existence is
    what makes the recessive/dominant distinction at this domain worth stating
    explicitly.
- name: Osteogenesis imperfecta
  description: >-
    The second patient carried this diagnosis for decades before genetic testing.
    Recorded here because that misdiagnosis is the practical differential, not a
    theoretical one.
discussions:
- discussion_id: semd_acan_genotype_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    What accounts for the difference in severity between the two reported
    families, given that both are recessive ACAN disease affecting the same
    protein?
  rationale: >-
    The original siblings reached 66-71 cm; the second patient reached 118.3 cm,
    had a normal face, and lived independently to 45. That is a very large
    difference for one ultra-rare Mendelian disorder. The obvious candidate is
    allele class - homozygosity for a single missense substitution versus two
    different variants - but with two families reported there is no way to test
    it, and no functional comparison of the second patient's variants against
    p.D2267N has been done. Until there is, the entry describes a severity range
    rather than a severity.
  attaches_to:
  - pathophysiology#Biallelic ACAN Variants Affecting the G3 C-Type Lectin Domain
  - phenotypes#Severe short stature
- discussion_id: semd_acan_binding_partner_scope
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is loss of tenascin-C binding sufficient to explain the skeletal phenotype,
    or is the pathogenic effect the loss of several G3 lectin-domain
    interactions at once?
  rationale: >-
    The binding defect was measured against tenascin-C, and that is the evidence
    the pathograph carries. But the same domain binds tenascin-R, fibulin-1,
    fibulin-2 and fibrillin-1 in the same calcium-dependent way, and a
    calcium-coordinating substitution has no obvious reason to be selective. The
    entry names tenascin-C because that is what was measured, not because the
    others were excluded, and this discussion records that distinction so the
    single-partner framing is not read as an established fact.
  attaches_to:
  - pathophysiology#Impaired Calcium-Dependent Binding of the G3 Domain to Tenascin-C
notes: >-
  Curated from a Perplexity deep-research report used as a lead only. The report
  cites 19 sources, of which its reference_validation could check 6 - all
  resolved, 4 judged on topic. Its term_validation reported 8 of 33 checked
  labels naming a different term than the report claimed, so its CURIEs were not
  reused and every binding here was resolved through OAK. All references were
  resolved to PMIDs (from the report's PMC URLs via the NCBI ID converter),
  fetched into references_cache, and quoted from the fetched text. The open PR
  #9082 curating RSPRY1-related SEMD covers a different gene and a different
  MONDO term; there is no overlap.
review_notes: >-
  Two things a reviewer should look at. First, the mechanism is deliberately not
  modelled as aggrecan deficiency: the founding study showed the mutant G3 domain
  traffics and is secreted normally, and that negative result is given its own
  pathophysiology node because it is what excludes the mechanism a reader would
  otherwise assume. Second, tenascin-C is named as the binding partner because it
  is the one measured by surface plasmon resonance, not because the other
  lectin-domain partners were excluded; a discussion records that explicitly so
  the node is not over-read.

treatments:
- name: Red Cell Transfusion
  description: >
    Regular or intermittent red-cell transfusions treat symptomatic anemia,
    especially in severe or transfusion-dependent disease and in the newborn
    period; they contribute to iron overload requiring monitoring and chelation.
  treatment_term:
    preferred_term: red blood cell transfusion
    term:
      id: MAXO:0000756
      label: blood transfusion
  evidence:
  - reference: PMID:32702739
    reference_title: "Management of pyruvate kinase deficiency in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approaches are supportive and include transfusions, splenectomy, and chelation"
    explanation: Transfusion is a core supportive treatment for PKD.
- name: Splenectomy
  description: >
    Splenectomy reduces the rate of extravascular (splenic) hemolysis, decreasing
    transfusion requirements and anemia-related symptoms; it typically raises
    hemoglobin and reticulocyte counts.
  treatment_term:
    preferred_term: splenectomy
    term:
      id: MAXO:0001077
      label: splenectomy
  evidence:
  - reference: PMID:26087744
    reference_title: "Erythrocyte pyruvate kinase deficiency: 2015 status report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "splenectomy to decrease transfusion requirements"
    explanation: Splenectomy is used to decrease transfusion requirements and hemolysis-related symptoms in PKD.
- name: Iron Chelation Therapy
  description: >
    Iron chelation (e.g., deferasirox, deferiprone, or deferoxamine) manages the
    iron overload that arises from chronic hemolysis and transfusion, including
    in non-regularly transfused patients.
  treatment_term:

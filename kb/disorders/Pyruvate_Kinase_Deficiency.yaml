- name: Premature Splenic Destruction of Metabolically Damaged Erythrocytes
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  description: >
    The metabolically damaged, ATP-depleted erythrocytes are prematurely cleared
    from the circulation, predominantly by macrophages of the spleen
    (extravascular hemolysis). This shortens erythrocyte lifespan and drives the
    chronic hemolytic anemia; the resulting splenic workload and reticuloendothelial
    activity underlie splenomegaly and the therapeutic rationale for splenectomy.
  cell_types:

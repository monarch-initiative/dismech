      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "glycolytic pathway that causes congenital nonspherocytic hemolytic anemia"
      explanation: PKD is described as an autosomal-recessive glycolytic enzyme defect causing congenital nonspherocytic hemolytic anemia.
  features: >
    Biallelic (homozygous or compound-heterozygous) PKLR variants cause red-cell
    pyruvate kinase deficiency. PKLR is on chromosome 1 and encodes the R-type
    (erythrocyte) and L-type (liver) pyruvate kinase isozymes via
    tissue-specific promoters; more than 150 pathogenic variants have been
    reported, spanning missense, nonsense, splicing, and small
    insertion/deletion changes, and this allelic heterogeneity contributes to
    the wide clinical spectrum. Confirmatory diagnosis requires demonstrating
    two pathogenic PKLR variants (a criterion used to define cases in the
    Natural History Study).

pathophysiology:
- name: Erythrocyte Pyruvate Kinase Loss of Function
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Reduced Erythrocyte Integrity"
  description: >
    Biallelic loss-of-function or missense variants in PKLR reduce the activity
    of the red-cell (R-type) pyruvate kinase isozyme, the enzyme catalyzing the
    final, ATP-generating step of glycolysis (phosphoenolpyruvate → pyruvate).
    PKLR is located on chromosome 1, and more than 150 different mutations in it
    have been associated with PK deficiency, giving a wide spectrum of residual
    enzyme activity that underlies the clinical heterogeneity. This is the
    disease-specific lesion that reduces erythrocyte metabolic integrity, the
    generic entry point of the conserved hemolytic-anemia module.

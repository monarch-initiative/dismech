- name: Erythrocyte ATP Depletion and 2,3-DPG Accumulation
  description: >
    Because the mature erythrocyte has no mitochondria and relies entirely on
    glycolysis for ATP, the block at the pyruvate kinase step depletes red-cell
    ATP and leads to accumulation of the upstream intermediates, most
    characteristically 2,3-diphosphoglycerate (2,3-DPG). ATP depletion
    compromises cation-pump-dependent volume and membrane homeostasis, producing
    a rigid, metabolically damaged erythrocyte that is marked for destruction.
    The 2,3-DPG rise shifts the hemoglobin-oxygen dissociation curve, partly
    mitigating the functional impact of anemia.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte

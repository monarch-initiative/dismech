name: Pyruvate Kinase Deficiency
category: Mendelian
creation_date: "2026-07-07T00:00:00Z"
synonyms:
- PK deficiency
- PKD
- Red cell pyruvate kinase deficiency
- Erythrocyte pyruvate kinase deficiency
- Hemolytic anemia due to red cell pyruvate kinase deficiency
- PKLR-related pyruvate kinase deficiency
- Congenital nonspherocytic hemolytic anemia due to pyruvate kinase deficiency
description: >
  Pyruvate kinase deficiency (PKD) is an autosomal-recessive inborn error of
  erythrocyte glycolysis caused by biallelic loss-of-function variants in PKLR,
  the gene encoding the liver/red-cell (R-type) isozyme of pyruvate kinase. It
  is the most frequent enzyme defect of the glycolytic pathway causing
  hereditary nonspherocytic hemolytic anemia. Pyruvate kinase catalyzes the
  final, ATP-generating step of glycolysis (phosphoenolpyruvate → pyruvate with
  transfer of a phosphate to ADP). Because the mature erythrocyte lacks
  mitochondria and depends entirely on glycolysis for its ATP, reduced pyruvate
  kinase activity depletes red-cell ATP and causes accumulation of the upstream
  intermediate 2,3-diphosphoglycerate; the ATP-starved, metabolically
  compromised erythrocytes are recognized and prematurely destroyed
  (predominantly by splenic macrophages), shortening red-cell lifespan and
  producing chronic hemolysis. The clinical severity is highly variable, ranging
  from fully compensated hemolysis without overt anemia to life-threatening
  neonatal anemia and jaundice requiring exchange transfusion, and even fetal
  hydrops. Long-term sequelae — iron overload (which occurs even in
  non-transfused patients), bilirubin gallstones, splenomegaly, and
  extramedullary hematopoiesis — arise from the chronic hemolytic state and its
  management. Historically treated only supportively (transfusion, splenectomy,
  chelation), PKD is now also targeted by mitapivat, an oral small-molecule
  allosteric activator of pyruvate kinase.

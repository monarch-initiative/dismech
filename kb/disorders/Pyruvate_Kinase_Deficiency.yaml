biochemical:
- name: 2,3-diphosphoglycerate (2,3-DPG)
  presence: Increased
  notes: >
    The block at the pyruvate kinase step causes accumulation of the upstream
    glycolytic intermediate 2,3-DPG in the erythrocyte, which shifts the
    hemoglobin-oxygen dissociation curve rightward and partially compensates for
    the reduced oxygen-carrying capacity. Erythrocyte ATP is correspondingly
    reduced. (Curated from the described mechanism; no citable exact-quote
    snippet retained for the metabolite level.)

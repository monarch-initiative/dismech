name: Autosomal Recessive Nonsyndromic Hearing Loss 98
creation_date: "2026-08-28T20:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 98
  term:
    id: MONDO:0013929
    label: autosomal recessive nonsyndromic hearing loss 98
synonyms:
- DFNB98
- deafness, autosomal recessive 98
- TSPEAR-related autosomal recessive nonsyndromic hearing loss
- autosomal recessive nonsyndromic deafness 98
description: >-
  DFNB98 is the proposition that biallelic TSPEAR variants cause isolated congenital
  sensorineural deafness. It was named in 2012 from one consanguineous Iranian family, and it
  is the weakest-supported of the DFNB loci curated here: the ClinGen Hearing Loss Gene
  Curation Expert Panel classifies TSPEAR-nonsyndromic hearing loss as Disputed, and
  reaffirmed that classification on review in 2024.

  The dispute is not a matter of thin evidence. It is that the evidence points somewhere
  else. TSPEAR unambiguously causes autosomal recessive ectodermal dysplasia 14, a
  predominantly dental disease; that relationship is replicated across cohorts and supported
  by functional work in enamel-knot biology. A 2021 cohort of thirteen individuals with
  biallelic TSPEAR variants found hearing loss in three, and every one of the three also
  carried variants in TMPRSS3, GJB2 or GJB6 - genes that are themselves ordinary causes of
  the phenotype. A 2026 cohort of eleven patients from seven families found tooth
  abnormalities in all of them and hearing loss in none, and states flatly that hearing loss
  is not a feature of the disease. A CRISPR mouse carrying a TSPEAR frameshift has normal
  stereocilia and normal auditory function.

  What survives is a small set of isolated-deafness cases, including a 2026 Iranian child
  with profound bilateral loss and explicitly normal teeth, skin, hair and nails, and the
  original family's finding that TSPEAR protein sits at the surface of the hair bundle. That
  is enough to keep the entity in view and not enough to call it established.

  This entry is curated as a disease whose causal claim is contested, not as a disease with
  a settled mechanism. The pathophysiology chain below is grouped under a named mechanistic
  hypothesis rather than asserted as canonical, the gene carries relationship_type DISPUTED,
  the refuting evidence is cited in the same sections as the supporting evidence, and the
  mouse is recorded as FAILS_TO_RECAPITULATE.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


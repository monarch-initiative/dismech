prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists and none can be constructed, because the numerator is
    exactly the set of cases whose causal attribution is in dispute. Five unique variants in
    four probands across four publications were counted by the ClinGen review, of which the
    isolated-deafness cases are a subset.

    Carrier rates for TSPEAR loss-of-function alleles have been published - roughly 1 in 140
    in non-Finnish Europeans - but those are ectodermal dysplasia 14 carrier rates and must
    not be read across to DFNB98. They are recorded in the differential diagnosis section
    where they belong.
  evidence:
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At least 5 unique variants (3 frameshift, 1 nonsense, 1 silent variant in splice
      consensus sequence) have been reported in at least 4 probands in 4 publications
    explanation: >-
      The published case count assembled by the expert panel, which is the whole numerator
      available.

mechanistic_hypotheses:
- hypothesis_group_id: tspear_hair_bundle_deafness
  hypothesis_label: >-
    Loss of secreted TSPEAR from the hair bundle surface causes isolated sensorineural
    deafness
  status: ALTERNATIVE
  description: >-
    The proposed mechanism of DFNB98, and the reason it is a hypothesis group rather than the
    entry's canonical model. TSPEAR is a secreted protein built from a thrombospondin-type
    laminin G domain followed by seven epilepsy-associated repeats that fold into a
    beta-propeller. In the founding study the transcript was found in mouse cochlea and the
    protein was localised by immunofluorescence to the surface of the hair bundles of sensory
    cells, while the human truncating allele blocked secretion of the protein from
    transfected cells. From those two observations the argument runs: no secretion, no
    TSPEAR at the bundle surface, no functioning bundle, deafness.

    Every causal edge in the pathophysiology section below opts into this group, because
    every one of them is part of that argument rather than an independently established step.
    Nothing has connected the missing protein to a measured auditory deficit in any organism.
    The one animal that has been made and tested - a mouse carrying a TSPEAR frameshift -
    hears normally and has normal stereocilia.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only the larger Tspear transcript was found in the cochlea, and the protein was
      detected by immunofluorescence at the surface of the hair bundles of sensory cells.
    explanation: >-
      The expression and localisation observation the hypothesis is built on. Mouse tissue,
      hence MODEL_ORGANISM.
  - reference: PMID:40716589
    reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intriguingly, stereociliary morphology and auditory function remain unaffected in
      TSPEAR S475TfsX79 mutant mice.
    explanation: >-
      The direct test of the hypothesis, in the organism where the localisation was
      established, with a negative result at both the structural and functional level.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the role of TSPEAR in auditory processes is unclear.
    explanation: >-
      The 2026 cohort's own framing of the auditory question before it went looking, which is
      the state of the hypothesis this group is named for.

pathophysiology:

- name: Biallelic TSPEAR Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The founding allele is a homozygous frameshift, c.1726G>T+c.1728delC, predicting
    p.V576LfsX37, found in three affected siblings of a consanguineous Iranian family with
    congenital profound deafness. TSPEAR is alternatively spliced into 522- and
    669-residue isoforms and the frameshift affects both.

    Later isolated-deafness reports carry different alleles: a homozygous missense
    c.668C>T p.Ser223Leu in a 2026 Iranian case, and compound heterozygous variants in a 2024
    Chinese family. Nothing links the allele class to whether hearing loss appears, which is
    part of why the relationship remains contested.
  genetic_context:
    gene:
      preferred_term: TSPEAR
      term:
        id: hgnc:1268
        label: TSPEAR
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in the founding family and in the isolated-deafness case reports, all of
      which are consanguineous. Typed LOSS_OF_FUNCTION for the frameshift alleles on the
      strength of the measured secretion failure; the missense alleles are not
      functionally characterised.
  downstream:
  - target: Failure of TSPEAR Secretion
    causal_link_type: DIRECT
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      The truncating allele prevents the protein leaving the cell. This is the one step of
      the chain with a direct measurement behind it.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing allowed us to identify a homozygous frame-shifting mutation
      (c.1726G>T+c.1728delC) in the gene TSPEAR (thrombospondin-type laminin G domain and EAR
      repeats).
    explanation: >-
      The founding allele and the family it was found in.
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, a novel homozygous pathogenic variant in thrombospondin type laminin G
      domain and epilepsy associated repeats was identified (NM_144991.3: c.668C
    explanation: >-
      A second, independent isolated-deafness allele. The quote stops mid-variant because the
      source contains a thin space inside the nucleotide change.
  - reference: PMID:34795337
    reference_title: Comprehensive molecular-genetic analysis of mid-frequency sensorineural hearing loss.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In eight additional probands, eight candidate VUS variants were detected in five genes
      (DIAPH1, MYO7A, TECTA, TMC1, TSPEAR).
    explanation: >-
      A TSPEAR variant found in a hearing-loss cohort and classified as a variant of
      uncertain significance rather than as the cause. Graded PARTIAL because it puts a
      TSPEAR variant in a deaf proband while declining to call it causal.

- name: Failure of TSPEAR Secretion
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    TSPEAR is a secreted extracellular-matrix protein, so where it acts depends on it getting
    out of the cell. Cells transfected with the mutated gene did not secrete the encoded
    protein. This is an in vitro result in a heterologous cell line, not a measurement in
    hair cells, and the entry does not claim more than that.
  biological_processes:
  - preferred_term: secretion of TSPEAR into the extracellular matrix
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  downstream:
  - target: Loss of TSPEAR from the Hair Bundle Surface
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      A protein that is not secreted cannot reach the extracellular surface where it was
      localised. The inference is reasonable and it is an inference; nobody has shown absence
      of TSPEAR from the bundle in a patient or in a model carrying the human allele.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This truncating mutation (p.V576LfsX37) impeded the secretion of the encoded protein by
      cells transfected with the mutated gene.
    explanation: >-
      The secretion assay. Graded IN_VITRO because it is a transfected-cell experiment, even
      though it is reported in a clinical genetics paper.

- name: Loss of TSPEAR from the Hair Bundle Surface
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The proposed site of action. In mouse cochlea the protein was detected at the surface of
    the hair bundles of sensory cells, and TSPEAR belongs to a protein family - the EAR
    repeat proteins, which also includes LGI1, LGI2 and VLGR1 - whose other members are
    implicated in auditory and audiogenic phenotypes. The family argument is suggestive
    context; it is not evidence about TSPEAR.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  downstream:
  - target: Impaired Cochlear Sound Transduction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      The step with no measurement behind it in any species. It is the gap the mouse was
      built to close, and the mouse came back negative.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only the larger Tspear transcript was found in the cochlea, and the protein was
      detected by immunofluorescence at the surface of the hair bundles of sensory cells.
    explanation: >-
      The localisation on which the site of action rests.
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations demonstrate that EAR-containing proteins are essential for the
      development and function of the auditory system.
    explanation: >-
      The protein-family argument, graded PARTIAL because it is a statement about a family of
      four proteins and not a demonstration about TSPEAR itself.
  - reference: PMID:40716589
    reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intriguingly, stereociliary morphology and auditory function remain unaffected in
      TSPEAR S475TfsX79 mutant mice.
    explanation: >-
      Stereociliary morphology is normal in a mouse carrying a TSPEAR frameshift, which
      argues directly against a hair-bundle structural role.

- name: Impaired Cochlear Sound Transduction
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. In the founding family auditory testing implicated at least a
    cochlear defect, and in the 2026 case there was no auditory brainstem response at all
    with a flat pure-tone audiogram. Whether TSPEAR loss is what produced it is the disputed
    question, not a step that can be inferred from the nodes above.
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Auditory tests implicated at least a cochlear defect in these patients.
    explanation: >-
      Locates the lesion in the cochlea in the founding family.
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the individuals displaying hearing loss, all have additional variants in other
      hearing-loss-associated genes, specifically TMPRSS3, GJB2, and GJB6, that present
      competing candidates for their hearing loss phenotype.
    explanation: >-
      The central refuting observation from the 2021 cohort: every biallelic-TSPEAR
      individual with hearing loss had an ordinary alternative explanation for it.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the individuals had hearing loss.
    explanation: >-
      A second, independent cohort in which nobody with biallelic TSPEAR variants was deaf.
      This is the strongest single observation against the endpoint node, because it is an
      absence of the phenotype rather than a competing explanation for it.

phenotypes:

- category: Otologic
  name: Congenital Profound Sensorineural Hearing Loss
  frequency: FREQUENT
  severity: SEVERE
  description: >-
    Bilateral, congenital and profound in the reported isolated-deafness cases. The 2026
    Iranian child had a flat audiogram in both ears and no auditory brainstem response.

    Frequency is FREQUENT rather than OBLIGATE deliberately. In a biallelic-TSPEAR cohort
    assembled without ascertaining on deafness, hearing loss was present in three of thirteen
    individuals and was attributable to another gene in all three. This phenotype is the
    defining feature of the ascertained cases and is not a feature of biallelic TSPEAR
    genotypes generally.
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a consanguineous Iranian family affected by congenital profound sensorineural
      deafness segregating in an autosomal recessive mode.
    explanation: >-
      The founding phenotype description.
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we report a patient presenting with bilateral profound sensorineural hearing
      loss.
    explanation: >-
      An independent case with the same severity.
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly all of these newly reported individuals (11/13) have phenotypes that include
      tooth agenesis or ectodermal dysplasia, while three newly reported individuals have
      hearing loss.
    explanation: >-
      The denominator that makes this phenotype FREQUENT rather than obligate: most people
      with biallelic TSPEAR variants do not have hearing loss.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrate that individuals with biallelic variants in TSPEAR show
      complete penetrance for dental manifestations, but not for other ectodermal
      abnormalities.
    explanation: >-
      The 2026 cohort's penetrance finding. Eleven biallelic individuals across seven
      families were fully penetrant for teeth and none was deaf, which roughly doubles the
      published denominator against which this phenotype's frequency has to be read.

- category: Otologic
  name: Absent Auditory Brainstem Response
  frequency: OCCASIONAL
  description: >-
    Recorded in the 2026 case, where the pure-tone audiogram was flat and there was no
    response on auditory brainstem testing. One case, so occasional rather than a
    characteristic finding.
  phenotype_term:
    preferred_term: Abnormal auditory evoked potentials
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was a 6-year-old Iranian girl of Fars ethnicity, born to a consanguineous
      marriage, who had flat audiogram in pure tone audiometry obtained from both ears and
      absence of any response in auditory brain response.
    explanation: >-
      The audiological findings in the one case where they are reported in detail.

- category: Dental
  name: Dental and Oral Findings in Some Reported Hearing-Loss Cases
  frequency: OCCASIONAL
  description: >-
    Not every case reported under the DFNB98 heading is genuinely nonsyndromic. The 2024
    Chinese proband with compound heterozygous TSPEAR variants and congenital sensorineural
    hearing loss also had dental caries, ankyloglossia and a heart-shaped tongue.

    This is recorded rather than filtered out, because it is precisely the observation that
    keeps the two TSPEAR entities entangled: a case with both hearing loss and oral findings
    can be read as DFNB98 with incidental dental disease or as ectodermal dysplasia 14 with
    hearing loss, and the published report does not settle which.
  phenotype_term:
    preferred_term: Abnormal tongue morphology
    term:
      id: HP:0000157
      label: Abnormality of the tongue
  evidence:
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband also demonstrated dental caries (Figure
    explanation: >-
      Records that this hearing-loss proband also had oral findings. The quote is truncated
      at a non-breaking space in the source.

genetic:

- name: TSPEAR
  gene_term:
    preferred_term: TSPEAR
    term:
      id: hgnc:1268
      label: TSPEAR
  relationship_type: DISPUTED
  notes: >-
    Typed DISPUTED rather than CAUSATIVE, matching the ClinGen Hearing Loss Gene Curation
    Expert Panel's own classification. This is the deliberate content of the entry: a reader
    or a downstream query that treats a biallelic TSPEAR finding as a molecular diagnosis of
    deafness would be going beyond what the field currently supports.

    TSPEAR encodes a secreted protein of the extracellular matrix - a thrombospondin-type
    laminin G domain followed by seven epilepsy-associated repeats forming a beta-propeller -
    and is one of six mammalian EAR-domain proteins. Its established disease association is
    ectodermal dysplasia 14, which is a different entity and is not curated here.
  evidence:
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      More evidence is needed to either support or refute the role TSPEAR plays in this
      disease.
    explanation: >-
      The expert panel's statement of what the classification means, which is what DISPUTED
      encodes here.
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Another nonsense variant that was observed as a homozygous variant in a proband was
      found to be heterozygous in the proband’s affected sibling and unaffected mother
    explanation: >-
      A non-segregation observation, which is the strongest single piece of case-level
      evidence against the relationship.
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When presented alongside previous reports, the overall evidence supports the
      association of TSPEAR variants with ectodermal dysplasia and tooth agenesis features
      but creates significant doubt as to whether TSPEAR variants are a monogenic cause of
      hearing loss.
    explanation: >-
      The 2021 cohort study's own conclusion, stated in terms of monogenic causation, which
      is exactly the claim DFNB98 makes.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TSPEAR-related disorder is more common than previously thought, while hearing loss is
      not a feature of the disease.
    explanation: >-
      The most recent and most direct statement against the relationship, from a cohort in
      which every affected individual had dental findings and none had hearing loss. It
      postdates the 2024 ClinGen re-review.
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing allowed us to identify a homozygous frame-shifting mutation
      (c.1726G>T+c.1728delC) in the gene TSPEAR (thrombospondin-type laminin G domain and EAR
      repeats).
    explanation: >-
      The founding association, kept alongside the refuting items rather than displaced by
      them.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Where the phenotype has been reported it is in homozygous probands from consanguineous
    families, or in one compound heterozygote. The mode of inheritance is not the contested
    part of DFNB98; whether the genotype causes the phenotype is.

    One published proband did not segregate: a homozygous nonsense variant was heterozygous
    in an affected sibling and in the unaffected mother. That single observation does more
    damage to the causal claim than the family count does good.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a consanguineous Iranian family affected by congenital profound sensorineural
      deafness segregating in an autosomal recessive mode.
    explanation: >-
      Recessive segregation in the founding family.

animal_models:

- name: Tspear S475TfsX79 CRISPR mouse
  species: Mouse
  genotype: Tspear S475TfsX79 frameshift, generated by CRISPR/Cas9 genome editing
  publication: PMID:40716589
  description: >-
    The only mouse model of a TSPEAR frameshift, and the experiment that was needed. It is
    negative on every axis TSPEAR has been claimed to matter for: stereociliary morphology,
    auditory function, tooth morphology and hair development are all normal.

    It is not entirely a null result. The mutation does perturb Notch and Wnt signalling -
    Notch1 and downstream targets are down, Heyl is up in skin, and Wnt4 is elevated in both
    skin and inner ear - so TSPEAR is doing something molecularly in the ear without that
    something producing a hearing phenotype in this animal.
  modeled_mechanisms:
  - target: Loss of TSPEAR from the Hair Bundle Surface
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      A mouse carrying a TSPEAR frameshift has normal stereocilia and normal hearing. The
      proposed hair-bundle mechanism of DFNB98 predicts neither.
    limitations: >-
      The mouse allele S475TfsX79 is not the human founding allele p.V576LfsX37; both are
      frameshifts but they truncate at different points, so a residual-function argument for
      the mouse allele has not been formally excluded. The founding human variant has never
      been knocked in. Mouse and human cochleae also differ, and a family of six EAR-domain
      proteins offers scope for compensation that has not been tested. Fidelity is therefore
      MODERATE rather than HIGH: the negative result is real and directly relevant, and it is
      not the same allele in the same species as the patients.
    readouts:
    - name: Stereociliary morphology
      target: Loss of TSPEAR from the Hair Bundle Surface
      direction: UNCHANGED
      interpretation: >-
        Hair bundle structure is normal in the absence of functional TSPEAR, which is the
        opposite of what a surface-of-the-bundle structural role predicts. A deliberate
        negative result, not a missing measurement.
      evidence:
      - reference: PMID:40716589
        reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Intriguingly, stereociliary morphology and auditory function remain unaffected in
          TSPEAR S475TfsX79 mutant mice.
        explanation: >-
          The morphological measurement behind this readout.
    - name: Auditory function
      target: Loss of TSPEAR from the Hair Bundle Surface
      direction: UNCHANGED
      interpretation: >-
        Hearing is normal. This is the measurement DFNB98 most needed and it came back
        against the hypothesis.
      evidence:
      - reference: PMID:40716589
        reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In conclusion, our data demonstrate that TSPEAR S475TfsX79 mutation does not
          compromise auditory function, tooth morphology, or hair development in mice, but
          TSPEAR may modulate both Notch and Wnt signaling pathways in the mouse.
        explanation: >-
          The paper's own conclusion on auditory function.
    - name: Notch and Wnt pathway signalling in skin and inner ear
      target: Loss of TSPEAR from the Hair Bundle Surface
      direction: ALTERED
      interpretation: >-
        Pathway signalling is perturbed even though the organ phenotypes are not, so the
        protein is functional in the ear without being required for hearing in this animal.
      evidence:
      - reference: PMID:40716589
        reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nevertheless, the S475TfsX79 mutation appears to perturb both Notch and Wnt
          signaling pathways.
        explanation: >-
          The molecular readout that keeps this from being a pure null result.
    evidence:
    - reference: PMID:40716589
      reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although tooth abnormalities and a reduced capacity for caudal fin regeneration were
        observed in the Tspeara-/-;Tspearb-/- knockout zebrafish model, there have been no
        reports of the Tspear knockout mouse model to date, which hampers further
        investigation of its physiological role.
      explanation: >-
        Establishes that this is the first mouse to test the question, and notes that the
        pre-existing zebrafish model produced a dental rather than an auditory phenotype -
        which is the ectodermal dysplasia entity, not this one.

diagnosis:
- name: Genetic testing, interpreted against the disputed gene-disease relationship
  description: >-
    There is no clinical or audiological finding that identifies DFNB98; the label follows
    from a genotype. The consequence of the Disputed classification is that finding biallelic
    TSPEAR variants in a deaf patient is the beginning of the analysis rather than the end of
    it.

    Two things follow concretely. Established hearing-loss genes must be excluded before the
    TSPEAR finding is accepted, because the cohort that tested this found competing variants
    in TMPRSS3, GJB2 and GJB6 in every deaf biallelic-TSPEAR individual. And the patient
    should be examined for dental and ectodermal features, because the established TSPEAR
    disease is a dental one and its recognition changes the counselling.
  evidence:
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the individuals displaying hearing loss, all have additional variants in other
      hearing-loss-associated genes, specifically TMPRSS3, GJB2, and GJB6, that present
      competing candidates for their hearing loss phenotype.
    explanation: >-
      Names the specific competing genes that this recommendation exists to exclude.

- name: Examination for dental and ectodermal features
  description: >-
    Absence of ectodermal findings is what makes a case a DFNB98 case rather than an
    ectodermal dysplasia 14 case with deafness alongside, so it has to be looked for
    deliberately rather than assumed from a referral for hearing loss. In the 2026 report the
    teeth, skin, hair and nails were each examined and found normal, and the authors note
    that a purely auditory presentation is uncommon among published TSPEAR cases.

    The schema has no way to record an examined-and-absent phenotype, so this is curated here
    as the examination it is rather than as an absent phenotype in the phenotype list.
  evidence:
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We examined the patient for any form of ectodermal dysplasia or malformation in teeth,
      skin, hair, and nail and they were in normal figuration.
    explanation: >-
      A deliberate examination for ectodermal features that found none, which is what
      qualifies the case as nonsyndromic.
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutation presenting solely with hearing issues and lack of any ectodermal dysplasia was
      rare based on the review of previously reported cases.
    explanation: >-
      Qualifies the finding by stating that the isolated presentation is uncommon in the
      published series.

differential_diagnoses:
- name: TSPEAR-related autosomal recessive ectodermal dysplasia 14 (ARED14/ECTD14)
  description: >-
    The established TSPEAR disease, and the entity a biallelic TSPEAR result most likely
    belongs to. It is primarily dental - conical tooth cusps and hypodontia - and it is
    supported by replicated cohorts, founder-variant epidemiology, and functional work
    placing Tspear expression in the enamel knot with a zebrafish double knockout that
    reproduces the dental phenotype.

    It is also common. The non-Finnish European carrier rate for TSPEAR loss-of-function
    alleles is about 1 in 140, which makes ARED14 one of the commonest autosomal recessive
    ectodermal dysplasias. That number belongs to this entity and not to DFNB98; it is quoted
    here so it is not mistaken for a DFNB98 prevalence.

    This is a differential rather than a subtype relationship. ECTD14 has its own OMIM entry
    and its own MONDO term, and dismech does not currently curate it.
  evidence:
  - reference: PMID:37009414
    reference_title: "Clinical, genetic, epidemiologic, evolutionary, and functional delineation of TSPEAR-related autosomal recessive ectodermal dysplasia 14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combining data from new and previously published individuals established that ARED14 is
      primarily characterized by dental anomalies such as conical tooth cusps and hypodontia,
      like those seen in individuals with WNT10A-related odontoonychodermal dysplasia.
    explanation: >-
      Defines the differential entity by the features that separate it from an isolated
      hearing loss.
  - reference: PMID:37009414
    reference_title: "Clinical, genetic, epidemiologic, evolutionary, and functional delineation of TSPEAR-related autosomal recessive ectodermal dysplasia 14."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Analysis of gnomAD data showed that the non-Finnish European population TSPEAR
      gene-carrier rate is ∼1/140, making it one of the commonest AREDs.
    explanation: >-
      The carrier rate, attributed to the ectodermal entity where it was derived. Graded
      COMPUTATIONAL because it is a population-database analysis rather than a clinical
      observation.

- name: TMPRSS3-, GJB2- and GJB6-related nonsyndromic hearing loss
  description: >-
    The three genes that turned up as competing explanations in every deaf individual with
    biallelic TSPEAR variants in the cohort study. They are ordinary, common causes of
    recessive nonsyndromic hearing loss, and they are the reason a TSPEAR finding cannot be
    accepted without excluding them. This is not an abstract caution: it is what the largest
    study of the question actually found.
  evidence:
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the individuals displaying hearing loss, all have additional variants in other
      hearing-loss-associated genes, specifically TMPRSS3, GJB2, and GJB6, that present
      competing candidates for their hearing loss phenotype.
    explanation: >-
      Names the three differential genes and reports how often they were the better
      candidate.

discussions:

- discussion_id: gap_tspear_hearing_gene_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TSPEAR
  - mechanistic_hypotheses#tspear_hair_bundle_deafness
  prompt: >-
    Do biallelic TSPEAR variants cause isolated hearing loss at all, or is DFNB98 a
    misattribution of deafness that other genes explain?
  rationale: >-
    This is the entity's central open question, not a detail within it. The founding family
    remains unexplained by anything else. Two later isolated-deafness reports exist, one with
    teeth, skin, hair and nails specifically examined and normal. Against that: a
    thirteen-person biallelic cohort in which every deaf individual had a competing variant
    in TMPRSS3, GJB2 or GJB6; a non-segregating nonsense allele; a TSPEAR variant classified
    as a VUS rather than causal in a mid-frequency hearing-loss series; and a ClinGen
    re-review in 2024 that saw the newer cases and left the classification at Disputed.

    Two readings fit all of that. Either TSPEAR causes hearing loss with low penetrance or
    only for particular alleles, and the cohort study's competing variants are coincidental
    in a genetically noisy phenotype; or TSPEAR does not cause hearing loss and the reported
    cases are unexplained deafness in people who happen to carry a common
    ectodermal-dysplasia allele - which at a carrier rate near 1 in 140 will happen by chance
    reasonably often.

    The second study has now partly been done - the 2026 cohort was ascertained on the dental
    phenotype and reports hearing status - and it came back negative. What is still missing is
    a comprehensive hearing-loss panel sequenced in every reported isolated-deafness TSPEAR
    case, which is the half that would say whether the positive reports have competing
    explanations too.
  proposed_experiments:
  - experiment_id: tspear_unselected_hearing_ascertainment
    name: Audiometry in an unselected biallelic-TSPEAR series ascertained on dental phenotype
    description: >-
      Recruit individuals with biallelic TSPEAR variants ascertained through ectodermal
      dysplasia 14 rather than through deafness, and measure hearing formally in all of them
      with pure-tone audiometry, otoacoustic emissions and auditory brainstem responses.
      Sequence a comprehensive hearing-loss panel in anyone found to be affected.
    would_support:
    - genetic#TSPEAR
    supporting_outcome:
    - >-
      Hearing loss occurs in the dental-ascertained series above population rate and without
      competing variants in established hearing-loss genes, which would establish a real if
      incompletely penetrant TSPEAR auditory phenotype and would move the gene from DISPUTED.
    refuting_outcome:
    - >-
      Hearing is normal across the dental-ascertained series, or the affected minority all
      carry competing variants, which would confirm DFNB98 as a misattribution and make the
      right curation outcome retirement of the entity rather than this contested entry.

- discussion_id: mismatch_tspear_mouse_hears_normally
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Tspear S475TfsX79 CRISPR mouse
  - pathophysiology#Loss of TSPEAR from the Hair Bundle Surface
  prompt: >-
    Why does a mouse carrying a TSPEAR frameshift hear normally and have normal stereocilia,
    when TSPEAR protein was localised to the hair bundle surface in that same species?
  rationale: >-
    This is a mismatch rather than a gap: the model exists, the measurements were made, and
    they disagree with the human claim. Both observations come from mouse cochlea, so this is
    not even a species argument in the usual sense - the localisation that motivates the
    mechanism and the negative functional test are in the same animal.

    Three readings are live and the published work does not choose between them. The mouse
    allele is a different frameshift from the human founding allele and may retain function
    the human allele does not. Mouse may compensate through one of the other five mammalian
    EAR-domain proteins in a way human cochlea does not. Or TSPEAR is genuinely not required
    for hearing and the localisation, while real, is not load-bearing - which is also what
    the human cohort data suggest.

    The stake is that the localisation result is the whole mechanistic content of DFNB98. If
    it does not survive, the entity has a genotype and a phenotype and nothing joining them.
  proposed_experiments:
  - experiment_id: tspear_human_allele_knockin_mouse
    name: Knock-in of the human p.V576LfsX37 allele with EAR-paralogue compensation testing
    description: >-
      Generate a mouse carrying the exact founding human TSPEAR allele rather than a
      different frameshift, phenotype hearing and stereocilia, and in parallel measure
      expression of the other mammalian EAR-domain proteins in mouse and human cochlea to
      test whether paralogue compensation could mask a phenotype in mouse.
    would_support:
    - pathophysiology#Loss of TSPEAR from the Hair Bundle Surface
    supporting_outcome:
    - >-
      The human allele produces hearing loss in mouse where S475TfsX79 does not, which would
      make the negative result allele-specific and restore the hair-bundle mechanism.
    refuting_outcome:
    - >-
      The human allele also leaves hearing intact, and paralogue expression is comparable
      across species, which would leave no mechanistic account of DFNB98 standing and would
      substantially strengthen the case for retiring the entity.

notes: >-
  Named entity check, and it is the whole problem with this entry. TSPEAR causes two things
  and one of them is not this. Autosomal recessive ectodermal dysplasia 14 is the established
  TSPEAR disease, it is primarily dental, and its literature is larger than DFNB98's. Every
  citation in this entry was checked for whether it is about the hearing phenotype. Nothing
  about tooth agenesis, conical cusps, enamel knots, hypohidrosis or sparse hair was curated
  as a DFNB98 phenotype; that material appears only in the differential diagnoses section,
  attributed to ECTD14. The ECTD14 carrier rate of about 1 in 140 is quoted there for the
  same reason - so it is not later mistaken for a DFNB98 figure.

  The one place the boundary genuinely blurs is the 2024 Chinese proband, who had congenital
  sensorineural hearing loss and also dental caries, ankyloglossia and a heart-shaped tongue.
  That case is recorded with its oral findings rather than being tidied into one entity or
  the other, because the published report does not resolve it either.

  What is not cited. A larger 2023 TSPEAR delineation study is reported at second hand to
  state that evidence is insufficient to link TSPEAR to recessive hearing loss. Only its
  abstract is retrievable and the abstract does not contain that statement, so the claim is
  not quoted anywhere in this entry. The refuting case is made instead from sources whose
  text is in the cache: the 2021 cohort study, the ClinGen assertion, and the mouse.

  Evidence grading. The secretion assay in the founding paper is graded IN_VITRO and the
  cochlear expression work in the same paper is graded MODEL_ORGANISM, because
  evidence_source describes the experiment rather than the publication it appears in. The
  gnomAD carrier-rate analysis is graded COMPUTATIONAL for the same reason.

  Why this is curated at all. A Disputed gene-disease relationship is a fact worth recording
  in a mechanism knowledge base, and recording it here is more useful than leaving MONDO's
  term uncurated for someone to take at face value. The alternative - marking the stub
  OUT_OF_SCOPE - would have deleted the dispute along with the entity.


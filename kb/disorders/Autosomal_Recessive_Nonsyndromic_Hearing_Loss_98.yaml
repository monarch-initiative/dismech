prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No reliable population prevalence or hearing-loss penetrance estimate is established. The 2024 ClinGen review
    counted at least five distinct variants in at least four probands across four publications; this is a dated
    evidence summary, not an exhaustive current census. TSPEAR carrier-rate estimates for ectodermal dysplasia 14
    do not estimate the prevalence of DFNB98.
  evidence:
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At least 5 unique variants (3 frameshift, 1 nonsense, 1 silent variant in splice
      consensus sequence) have been reported in at least 4 probands in 4 publications
    explanation: >-
      This is the case-evidence count in the October 2024 expert review; it does not include all subsequent reports
      or provide a population denominator.

mechanistic_hypotheses:
- hypothesis_group_id: tspear_hair_bundle_deafness
  hypothesis_label: >-
    Loss of secreted TSPEAR from the hair bundle surface causes isolated sensorineural
    deafness
  status: ALTERNATIVE
  description: >-
    The proposed auditory mechanism links defective secretion of the founding truncating allele to reduced TSPEAR
    availability at the hair-bundle surface and impaired cochlear function. Secretion impairment was measured in
    transfected cells, whereas localization was examined in mouse sensory cells. These separate observations do
    not demonstrate loss of bundle-localized protein or a causal auditory defect in the human variant carriers.
    Preserved hearing and stereociliary morphology in S475TfsX79 mice challenge a general frameshift mechanism,
    with allele and species limitations.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only the larger Tspear transcript was found in the cochlea, and the protein was
      detected by immunofluorescence at the surface of the hair bundles of sensory cells.
    explanation: >-
      The expression and localisation observation the hypothesis is built on. Mouse tissue,
      hence MODEL_ORGANISM.
  - reference: PMID:40716589
    reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intriguingly, stereociliary morphology and auditory function remain unaffected in
      TSPEAR S475TfsX79 mutant mice.
    explanation: >-
      Preserved stereociliary morphology and hearing challenge a general auditory frameshift mechanism in mice.
      This allele differs from the founding human allele, so the result does not directly test every human genotype.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the role of TSPEAR in auditory processes is unclear.
    explanation: >-
      This introductory statement identifies uncertainty rather than reporting a negative experiment. The cohort
      observations are represented separately.

pathophysiology:
- name: Homozygous Founding TSPEAR Frameshift Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The founding family carried the homozygous combined allele c.1726G>T+c.1728delC, reported as p.V576LfsX37 in
    2012 and as c.1726_1728delGTCinsTT, p.Val576Leufs*38 in later literature. This node describes that allele and
    its secretion experiment, not the unassayed missense alleles in subsequent candidate cases.
  genetic_context:
    gene:
      preferred_term: TSPEAR
      term:
        id: hgnc:1268
        label: TSPEAR
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygosity and impaired secretion are documented for the founding allele. This does not establish complete
      loss of every protein function or extend a loss-of-function classification to unassayed missense variants.
  downstream:
  - target: Failure of TSPEAR Secretion
    causal_link_type: DIRECT
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      The founding truncating allele impaired protein secretion in transfected cells. This directly tested step
      does not establish its downstream auditory consequences.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing allowed us to identify a homozygous frame-shifting mutation
      (c.1726G>T+c.1728delC) in the gene TSPEAR (thrombospondin-type laminin G domain and EAR
      repeats).
    explanation: >-
      The founding allele and the family it was found in.
- name: Failure of TSPEAR Secretion
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The founding truncating allele impaired TSPEAR secretion in transfected cells. This heterologous assay establishes
    a protein-trafficking effect under its experimental conditions, not a measurement of secretion or auditory function
    in patient hair cells.
  biological_processes:
  - preferred_term: secretion of TSPEAR into the extracellular matrix
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  downstream:
  - target: Loss of TSPEAR from the Hair Bundle Surface
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      Reduced secretion could reduce extracellular TSPEAR availability at the hair-bundle surface. Neither mutant
      bundle localization nor the functional consequences of reduced localization were directly measured in the
      cited human-allele experiment.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This truncating mutation (p.V576LfsX37) impeded the secretion of the encoded protein by
      cells transfected with the mutated gene.
    explanation: >-
      The secretion assay. Graded IN_VITRO because it is a transfected-cell experiment, even
      though it is reported in a clinical genetics paper.

- name: Loss of TSPEAR from the Hair Bundle Surface
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Mouse immunofluorescence localized TSPEAR to sensory-cell hair bundles. Reduced availability at this surface
    is a proposed consequence of impaired secretion, not a measured lesion in patients or in a model carrying the
    founding human allele. Localization does not establish an indispensable structural or transduction function.
  cell_types:
  - preferred_term: cochlear sensory hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  downstream:
  - target: Impaired Cochlear Sound Transduction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      A connection between reduced bundle-localized TSPEAR and impaired auditory function remains hypothetical.
      Normal hearing in the S475TfsX79 model is contrary evidence for a general frameshift effect, with allele and
      species limits.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Only the larger Tspear transcript was found in the cochlea, and the protein was
      detected by immunofluorescence at the surface of the hair bundles of sensory cells.
    explanation: >-
      This supports localization in normal mouse tissue, not loss of protein from a mutant bundle.
  - reference: PMID:40716589
    reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intriguingly, stereociliary morphology and auditory function remain unaffected in
      TSPEAR S475TfsX79 mutant mice.
    explanation: >-
      Normal morphology and hearing in this different frameshift model challenge a general auditory defect but do
      not measure TSPEAR localization at the bundle surface.

- name: Impaired Cochlear Sound Transduction
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Audiological testing in the founding family indicated at least a cochlear defect. The six-year-old p.Ser223Leu
    proband had absent ABR and severe bilateral hearing loss; the Chinese proband had measurable ABR thresholds
    and absent otoacoustic emissions. These findings establish auditory impairment in reported cases without resolving
    TSPEAR causality.
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  downstream:
  - target: Sensorineural Hearing Loss in Reported TSPEAR Cases
    causal_link_type: DIRECT
    hypothesis_groups:
    - tspear_hair_bundle_deafness
    description: >-
      Impaired cochlear function produces hearing loss, but attribution of that dysfunction to the upstream TSPEAR
      hypothesis remains disputed.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Auditory tests implicated at least a cochlear defect in these patients.
    explanation: >-
      Locates the lesion in the cochlea in the founding family.
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the individuals displaying hearing loss, all have additional variants in other
      hearing-loss-associated genes, specifically TMPRSS3, GJB2, and GJB6, that present
      competing candidates for their hearing loss phenotype.
    explanation: >-
      All three newly reported hearing-loss cases carried competing variants. Their evidence strengths differ: some
      remain VUS, so alternative causality is not established uniformly.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the individuals had hearing loss.
    explanation: >-
      The dental-ascertained cohort had no clinical hearing concerns in 11 individuals; the full text reports normal
      audiometry in only four. This challenges general hearing-loss penetrance but does not exclude allele-specific
      effects.

phenotypes:
- category: Otologic
  name: Sensorineural Hearing Loss in Reported TSPEAR Cases
  description: >-
    Reported candidate TSPEAR cases include congenital profound hearing loss in the founding family and bilateral
    severe-to-profound loss in a six-year-old Iranian girl. Hearing loss is not uniformly profound: the Chinese
    proband had bilateral ABR thresholds of 65 dBnHL at six months and 80 dBnHL at six years. These clinical observations
    do not establish TSPEAR causality. Mixed hearing-loss and dental referrals, uncertain variants and incomplete
    audiometry preclude a disease-wide phenotype frequency.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a consanguineous Iranian family affected by congenital profound sensorineural
      deafness segregating in an autosomal recessive mode.
    explanation: >-
      The founding phenotype description.
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we report a patient presenting with bilateral profound sensorineural hearing
      loss.
    explanation: >-
      An independent case with the same severity.
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her hearing thresholds at 6 months were 65 dBnHL in both ears with normal acoustic impedance results, and
      then she was diagnosed with congenital sensorineural hearing loss.
    explanation: >-
      The reported hearing impairment is less severe than the profound loss in the founding family; the two TSPEAR
      missense variants were classified as VUS.
- category: Otologic
  name: Absent Auditory Brainstem Response
  description: >-
    Absent auditory brainstem responses and a flat pure-tone audiogram were reported in the six-year-old girl with
    homozygous p.Ser223Leu. Other reported cases had measurable ABR thresholds; no frequency estimate is established.
  phenotype_term:
    preferred_term: Abnormal auditory evoked potentials
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was a 6-year-old Iranian girl of Fars ethnicity, born to a consanguineous
      marriage, who had flat audiogram in pure tone audiometry obtained from both ears and
      absence of any response in auditory brain response.
    explanation: >-
      This describes the 2026 proband, not a universal finding in candidate TSPEAR-associated hearing loss.

- category: Dental
  name: Ankyloglossia in the Chinese Proband
  description: >-
    The Chinese proband with two TSPEAR missense VUS had ankyloglossia, a heart-shaped tongue and dental caries.
    Tongue restriction and speech difficulty persisted after three corrective operations. These are case-level observations;
    they do not establish an ectodermal-dysplasia diagnosis or a general DFNB98 oral phenotype.
  phenotype_term:
    preferred_term: Ankyloglossia
    term:
      id: HP:0010296
      label: Ankyloglossia
  evidence:
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband also demonstrated dental caries (Figure 1A), ankyloglossia (Figure 1B), and heart‐shaped tongue
      (Figure 1C).
    explanation: >-
      The primary case report directly names the tongue abnormality; causal attribution to TSPEAR remains uncertain.

- name: Progressive Hearing Loss in the Chinese Proband
  category: Otologic
  description: >-
    Serial ABR thresholds in one child increased from 65 dBnHL bilaterally at six months to 80 dBnHL at six years.
    This documents worsening in that case, not a progression rate or established natural history for TSPEAR-related
    hearing loss.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An ABR test conducted at the age of 6 years showed that hearing thresholds of both ears were 80 dBnHL.
    explanation: >-
      The later measurement follows bilateral thresholds of 65 dBnHL at six months in the same report.
- name: Absent Otoacoustic Emissions in the Chinese Proband
  category: Otologic
  description: >-
    Bilateral distortion-product otoacoustic emissions were absent in the reported Chinese child; this clinical
    result does not establish a TSPEAR-specific cellular lesion.
  phenotype_term:
    preferred_term: Absent otoacoustic emissions
    term:
      id: HP:6000182
      label: Absent otoacoustic emissions
  evidence:
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distortion product otoacoustic emission was not elicited on both sides.
    explanation: >-
      Direct audiological finding in a single candidate case.
- name: Enlarged Vestibular Aqueduct in a Reported Family
  category: Otologic
  description: >-
    Enlarged vestibular aqueduct accompanied childhood-onset hearing loss in the family with p.Pro522= and p.Tyr559CysfsTer134
    variants summarized in the 2021 cohort paper. This is a reported case feature rather than an established TSPEAR-specific
    malformation.
  phenotype_term:
    preferred_term: Enlarged vestibular aqueduct
    term:
      id: HP:0011387
      label: Enlarged vestibular aqueduct
  evidence:
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a 2016 report describing siblings with childhood onset, nonsyndromic, bilateral hearing loss, EVA, and compound
      heterozygous TSPEAR variants
    explanation: >-
      The later cohort paper summarizes the reported family; gene attribution remains disputed.
    directness: INDIRECT
- name: Speech Difficulties in Reported Cases
  category: Neurologic
  description: >-
    The six-year-old Iranian child had speech difficulties interfering with school performance after prelingual
    hearing loss. The Chinese child also had persistent speech difficulty with ankyloglossia despite corrective
    surgery. These observations do not establish a primary neurological TSPEAR phenotype.
  phenotype_term:
    preferred_term: Poor speech
    term:
      id: HP:0002465
      label: Poor speech
  evidence:
  - reference: PMID:41486137
    reference_title: 'A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After the occurrence of this prelingual form of profound hearing loss, she had also speech disorders interfering
      with normal school performance.
    explanation: >-
      The case describes speech and educational effects without establishing a separate developmental syndrome.
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After three corrective surgeries, her tongue was still difficult to stick out and her speech was still compromised.
    explanation: >-
      Tongue restriction and hearing impairment may both be relevant; the report does not quantify their individual
      contributions.
genetic:
- name: TSPEAR
  gene_term:
    preferred_term: TSPEAR
    term:
      id: hgnc:1268
      label: TSPEAR
  relationship_type: DISPUTED
  notes: >-
    TSPEAR encodes a secreted protein containing a thrombospondin-type laminin G domain and seven epilepsy-associated
    repeats. Its association with nonsyndromic hearing loss remains Disputed. A biallelic candidate genotype alone
    does not establish a molecular explanation for hearing loss. TSPEAR-related ectodermal dysplasia 14 is a distinct,
    better-supported association.
  evidence:
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: >-
      More evidence is needed to either support or refute the role TSPEAR plays in this
      disease.
    explanation: >-
      The panel explicitly describes unresolved causality; this sentence alone is not an experimental refutation.
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Another nonsense variant that was observed as a homozygous variant in a proband was
      found to be heterozygous in the proband’s affected sibling and unaffected mother
    explanation: >-
      Discordant TSPEAR zygosity in similarly affected siblings weakens simple recessive segregation in this family.
  - reference: CGGV:assertion_f0928b06-d3bb-41fe-8222-d7f0e6c0a25a-2024-10-31T160000.000Z
    reference_title: TSPEAR / nonsyndromic genetic hearing loss (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      A frameshift variant that was reported in 2 probands and segregated in 2 additional
      family members (PMID: 22678063, 37561809) has also been reported in 2 families with
      ectodermal dysplasia and normal hearing (PMID: 27736875).
    explanation: >-
      The ClinGen summary cites normal-hearing ectodermal families as conflicting evidence. The primary 2016 paper
      documents the founding combined genotype in family A and normal audiometry in families A and C; family C carried
      different missense variants.
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When presented alongside previous reports, the overall evidence supports the
      association of TSPEAR variants with ectodermal dysplasia and tooth agenesis features
      but creates significant doubt as to whether TSPEAR variants are a monogenic cause of
      hearing loss.
    explanation: >-
      The 2021 cohort study's own conclusion, stated in terms of monogenic causation, which
      is exactly the claim DFNB98 makes.
  - reference: PMID:41195743
    reference_title: "Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TSPEAR-related disorder is more common than previously thought, while hearing loss is
      not a feature of the disease.
    explanation: >-
      The dental-ascertained cohort had no clinical hearing concerns in 11 individuals; the full text reports normal
      audiometry in only four. This challenges general hearing-loss penetrance but does not exclude allele-specific
      effects.
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing allowed us to identify a homozygous frame-shifting mutation
      (c.1726G>T+c.1728delC) in the gene TSPEAR (thrombospondin-type laminin G domain and EAR
      repeats).
    explanation: >-
      The founding association, kept alongside the refuting items rather than displaced by
      them.

  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10174155/1/1-s2.0-S2666247723000180-main.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10174155/1/1-s2.0-S2666247723000180-main.pdf
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, none of the affected individuals in our cohort were reported with sensorineural hearing impairment.
    explanation: >-
      Clinical, genetic, epidemiologic, evolutionary, and functional delineation of TSPEAR-related autosomal recessive
      ectodermal dysplasia 14. The 2023 study described 11 new individuals and combined phenotypes from 30 dental/ectodermal
      cases. Absence of reported hearing impairment in this ascertained cohort is conflicting evidence, not a population
      penetrance estimate.
  - reference: url:https://flore.unifi.it/retrieve/7d92d0aa-e251-46f0-8555-6584ec139e54/Vergani%20et%20al%202025%20TSPEAR.pdf
    reference_title: 'https://flore.unifi.it/retrieve/7d92d0aa-e251-46f0-8555-6584ec139e54/Vergani%20et%20al%202025%20TSPEAR.pdf'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiometric testing was performed in 4/11 patients with normal results in all.
    explanation: >-
      Genotypes and Phenotypes of Patients With TSPEAR-Related Disorder: Evidence of a Predominant Dental Phenotype.
      The full text distinguishes four formally tested individuals from the seven assessed clinically. The cohort
      was selected for ectodermal manifestations or tooth agenesis; it cannot establish that hearing loss never
      occurs with TSPEAR variants.
  - reference: PMID:27736875
    reference_title: Mutations in TSPEAR, Encoding a Regulator of Notch Signaling, Affect Tooth and Hair Follicle Morphogenesis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, this mutation was identified in the present study in a homozygous state in 2 different patients with
      hypotrichosis, hypodontia and normal hearing (Fig 1A).
    explanation: >-
      The 2016 study reports normal hearing in patients carrying the previously implicated deletion. Its clinical
      section specifies normal audiometry for families A and C; this observation challenges obligatory deafness
      from the founding genotype.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance was proposed from the founding pedigree. Subsequent reports include homozygous
    and compound heterozygous candidate genotypes, but gene-disease validity remains disputed. In the mid-frequency
    hearing-loss family, the p.Glu624Ter proband was homozygous while his similarly affected sister was heterozygous,
    weakening simple recessive segregation of this allele with hearing loss.
  evidence:
  - reference: PMID:22678063
    reference_title: Defect in the gene encoding the EAR/EPTP domain-containing protein TSPEAR causes DFNB98 profound deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a consanguineous Iranian family affected by congenital profound sensorineural
      deafness segregating in an autosomal recessive mode.
    explanation: >-
      Recessive segregation in the founding family.

animal_models:
- name: Tspear S475TfsX79 CRISPR mouse
  species: Mouse
  genotype: Tspear S475TfsX79 frameshift, generated by CRISPR/Cas9 genome editing
  publication: PMID:40716589
  description: >-
    CRISPR-generated Tspear S475TfsX79 mice had preserved auditory function, stereociliary morphology, tooth morphology
    and hair development. The abstract reports reduced Notch1 and several downstream targets and increased Heyl
    in skin, plus increased Wnt4 in skin and inner ear. These tissue-specific molecular changes do not establish
    a Notch-mediated auditory lesion. The tested allele differs from the founding human allele; complete functional
    absence and human hearing penetrance cannot be inferred from the frameshift designation alone.
  modeled_mechanisms:
  - target: Impaired Cochlear Sound Transduction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      This mouse challenges the proposed auditory consequence of TSPEAR disruption because hearing remained intact.
    limitations: >-
      S475TfsX79 differs from the human founding allele. The available abstract does not establish the amount or
      activity of residual protein, test ages, or sensitivity to subtle deficits. Species-dependent effects and
      compensation remain hypotheses.
    readouts:
    - name: Auditory function
      target: Impaired Cochlear Sound Transduction
      direction: UNCHANGED
      interpretation: >-
        The reported auditory measurements did not show impairment under the conditions examined; this is a measured
        negative finding for this model.
      evidence:
      - reference: PMID:40716589
        reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Intriguingly, stereociliary morphology and auditory function remain unaffected in TSPEAR S475TfsX79 mutant
          mice.
        explanation: >-
          The specific mouse frameshift did not reproduce the predicted auditory dysfunction or bundle malformation.
          This does not establish that every human allele is functionally equivalent.
    evidence:
    - reference: PMID:40716589
      reference_title: TSPEAR S475TfsX79 mutation does not affect auditory function, tooth morphology or hair development in mice.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Intriguingly, stereociliary morphology and auditory function remain unaffected in TSPEAR S475TfsX79 mutant
        mice.
      explanation: >-
        The absence of auditory impairment supports a FAILS_TO_RECAPITULATE link to the proposed cochlear dysfunction.
        Allele differences and the limited assay information in the abstract constrain extrapolation to human disease.
diagnosis:
- name: Genetic testing, interpreted against the disputed gene-disease relationship
  description: >-
    Use comprehensive hearing-loss genetic testing with clinical correlation, segregation analysis and assessment
    of technical limitations. TSPEAR variants alone do not establish a hearing-loss diagnosis, and negative results
    for established genes do not prove TSPEAR causality. Competing TMPRSS3, GJB2 and GJB6 findings in reported cases
    require variant-specific interpretation rather than automatic attribution.
  evidence:
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the individuals displaying hearing loss, all have additional variants in other
      hearing-loss-associated genes, specifically TMPRSS3, GJB2, and GJB6, that present
      competing candidates for their hearing loss phenotype.
    explanation: >-
      The cohort identified competing candidates; these included both uncertain and likely pathogenic findings,
      not three uniformly solved alternative diagnoses.

  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A multigene hearing loss panel ... can often identify the cause of genetic hearing loss while limiting identification
      of pathogenic variants and variants of ... uncertain significance ... in genes that are irrelevant to the
      underlying
    explanation: >-
      General guidance supports broad hearing-loss testing rather than isolated TSPEAR testing.
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of variant(s) of ... uncertain significance ... cannot be used to confirm or rule out the
      diagnosis.
    explanation: >-
      Interpretation uncertainty must be preserved when considering candidate TSPEAR alleles.
    directness: INDIRECT
- name: Examination for dental and ectodermal features
  description: >-
    Examine teeth, hair, nails, skin and sweating when TSPEAR variants are detected. Dental anomalies may indicate
    a separate TSPEAR-related ectodermal disorder; their absence does not validate a TSPEAR hearing-loss diagnosis.
    The six-year-old p.Ser223Leu proband had no abnormalities of teeth, skin, hair or nails on the reported examination.
  evidence:
  - reference: PMID:41486137
    reference_title: "A novel pathogenic mutation in TSPEAR associated with sensorineural hearing loss: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We examined the patient for any form of ectodermal dysplasia or malformation in teeth,
      skin, hair, and nail and they were in normal figuration.
    explanation: >-
      The report documents clinically normal ectodermal structures in this child; it does not establish lifelong
      absence or gene causality.
differential_diagnoses:
- name: TSPEAR-related autosomal recessive ectodermal dysplasia 14 (ARED14/ECTD14)
  description: >-
    TSPEAR-related ectodermal dysplasia 14 has a predominantly dental phenotype, including conical teeth and hypodontia
    or oligodontia, sometimes with hair, nail or sweating abnormalities. It is distinct from the disputed nonsyndromic
    hearing-loss association. Published population estimates of TSPEAR deleterious-allele carrier frequency concern
    this dental/ectodermal association and include predicted deleterious missense alleles, not only truncating variants.
  evidence:
  - reference: PMID:37009414
    reference_title: "Clinical, genetic, epidemiologic, evolutionary, and functional delineation of TSPEAR-related autosomal recessive ectodermal dysplasia 14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combining data from new and previously published individuals established that ARED14 is
      primarily characterized by dental anomalies such as conical tooth cusps and hypodontia,
      like those seen in individuals with WNT10A-related odontoonychodermal dysplasia.
    explanation: >-
      Defines the differential entity by the features that separate it from an isolated
      hearing loss.
  - reference: PMID:37009414
    reference_title: "Clinical, genetic, epidemiologic, evolutionary, and functional delineation of TSPEAR-related autosomal recessive ectodermal dysplasia 14."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Analysis of gnomAD data showed that the non-Finnish European population TSPEAR
      gene-carrier rate is ∼1/140, making it one of the commonest AREDs.
    explanation: >-
      The carrier rate, attributed to the ectodermal entity where it was derived. Graded
      COMPUTATIONAL because it is a population-database analysis rather than a clinical
      observation.

- name: TMPRSS3-, GJB2- and GJB6-related nonsyndromic hearing loss
  description: >-
    Established hearing-loss genes remain relevant when TSPEAR variants are found. In the 2021 cohort, one hearing-loss
    case carried VUS in both TSPEAR and TMPRSS3, another carried a TSPEAR VUS and a TMPRSS3 variant judged likely
    pathogenic, and a third had TSPEAR variants together with a GJB2 frameshift and a GJB6-region deletion. These
    findings warrant case-specific review of phase, classification and assay coverage.
  evidence:
  - reference: PMID:34042254
    reference_title: "TSPEAR variants are primarily associated with ectodermal dysplasia and tooth agenesis but not hearing loss: A novel cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the individuals displaying hearing loss, all have additional variants in other
      hearing-loss-associated genes, specifically TMPRSS3, GJB2, and GJB6, that present
      competing candidates for their hearing loss phenotype.
    explanation: >-
      These are competing genetic findings in the three newly described hearing-loss cases; they do not uniformly
      establish an alternative molecular diagnosis.

discussions:
- discussion_id: gap_tspear_hearing_gene_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TSPEAR
  - mechanistic_hypotheses#tspear_hair_bundle_deafness
  prompt: >-
    Which, if any, TSPEAR genotypes confer hearing-loss risk independently of other genetic or acquired causes?
  rationale: >-
    Human reports combine segregation evidence, VUS, competing hearing-loss variants and a family with discordant
    TSPEAR zygosity among similarly affected siblings. Dental cohorts include people without hearing concerns, but
    audiometric ascertainment is incomplete in some studies. These observations leave allele-specific effects, reduced
    penetrance and alternative etiologies unresolved.
  proposed_experiments:
  - experiment_id: tspear_unselected_hearing_ascertainment
    name: Standardized audiometry and genomic reassessment across TSPEAR genotypes
    description: >-
      Recruit a genotype-defined series from hearing-loss and dental referrals with documented ascertainment. Obtain
      age-appropriate audiometry, otoacoustic emissions and ABR where indicated, and reassess genomic data for competing
      causes, phase, CNVs and noncoding variants. Compare hearing outcomes with suitable controls and stratify by
      allele.
    would_support:
    - genetic#TSPEAR
    supporting_outcome:
    - >-
      Replicated enrichment of hearing impairment for a particular genotype, with segregation and functional support
      and without a stronger competing explanation, would strengthen an allele-specific auditory association.
    refuting_outcome:
    - >-
      Normal hearing across adequately assessed carriers or identification of better-supported alternative causes
      would weaken the auditory association. Neither result alone predetermines an expert-panel classification or
      ontology action.
- discussion_id: mismatch_tspear_mouse_hears_normally
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Tspear S475TfsX79 CRISPR mouse
  - pathophysiology#Loss of TSPEAR from the Hair Bundle Surface
  prompt: >-
    How do the molecular and auditory effects of the human founding allele compare with the mouse S475TfsX79 allele?
  rationale: >-
    Normal hearing in the S475TfsX79 mouse contrasts with reported hearing loss in human variant carriers. Localization
    in normal mouse hair bundles is not proof of essential function, and the two alleles may differ in residual
    protein, secretion or compensation. Direct allele comparisons are needed before extrapolating this negative
    model result to every human TSPEAR genotype.
  proposed_experiments:
  - experiment_id: tspear_human_allele_knockin_mouse
    name: Knock-in of the human p.V576LfsX37 allele with EAR-paralogue compensation testing
    description: >-
      Compare the human founding allele with S475TfsX79 in matched genetic backgrounds, measuring transcript and
      protein abundance, secretion and bundle localization alongside auditory thresholds and stereociliary morphology.
      Assess proposed compensatory expression rather than assuming it.
    would_support:
    - pathophysiology#Loss of TSPEAR from the Hair Bundle Surface
    supporting_outcome:
    - >-
      An allele-dependent loss of secretion and bundle localization accompanied by an auditory deficit would support
      the proposed chain, with human relevance still requiring clinical corroboration.
    refuting_outcome:
    - >-
      Preserved hearing despite verified comparable disruption would weaken this proposed auditory mechanism under
      the tested conditions without excluding all possible allele- or species-specific effects.
notes: >-
  The clinical findings described here come from published hearing-loss cases with TSPEAR variants whose causal
  attribution remains disputed. Dental cohorts, computational structural analyses and ectodermal-development models
  provide comparative evidence; their phenotypes and carrier frequencies should not be treated as DFNB98 natural
  history.


    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hearing aids (sound amplification), ... customized by an audiologist to the degree and frequency of hearing
      loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: >-
      General guidance supports individualized amplification; it is not a DFNB98 outcome study.
    directness: INDIRECT
  - reference: PMID:39720278
    reference_title: Novel compound heterozygous variants in the TSPEAR gene causing autosomal recessive hearing loss in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband received bilateral hearing aids when she was 6 months old. According to her parents, she was able
      to respond normally to the minor sounds after wearing hearing aids.
    explanation: >-
      The reported response comes from parental observation; standardized aided speech outcomes were not supplied.

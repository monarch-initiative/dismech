treatments:
- name: Hearing Aids
  therapeutic_modality: DEVICE
  description: >-
    Individualize amplification according to audiometry, aided benefit and communication needs. The Chinese child
    with two TSPEAR VUS received bilateral hearing aids at six months; her parents reported improved responses to
    quiet sounds. This is a subjective single-case observation, not a genotype-specific efficacy estimate.
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:

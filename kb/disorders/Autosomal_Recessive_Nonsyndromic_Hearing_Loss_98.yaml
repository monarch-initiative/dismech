      Luciferase activity in TSPEAR down-regulated cells was significantly decreased as compared with control cells,
      supporting a role for TSPEAR in the regulation of Notch signaling (Fig 3E).
    explanation: >-
      The measured Notch response comes from the transfected HaCaT system; it is not an inner-ear readout.
  - reference: PMID:27736875
    reference_title: Mutations in TSPEAR, Encoding a Regulator of Notch Signaling, Affect Tooth and Hair Follicle Morphogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO

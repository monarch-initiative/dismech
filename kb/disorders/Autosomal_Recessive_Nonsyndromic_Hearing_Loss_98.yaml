name: Autosomal Recessive Nonsyndromic Hearing Loss 98
creation_date: "2026-08-28T20:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 98
  term:
    id: MONDO:0013929
    label: autosomal recessive nonsyndromic hearing loss 98
synonyms:
- DFNB98
- deafness, autosomal recessive 98
- TSPEAR-related autosomal recessive nonsyndromic hearing loss
- autosomal recessive nonsyndromic deafness 98
description: >-
  DFNB98 denotes a proposed autosomal recessive sensorineural hearing-loss association with TSPEAR. The founding
  report described congenital profound deafness in a consanguineous Iranian family, but ClinGen retained a Disputed
  classification for TSPEAR-related nonsyndromic hearing loss in October 2024. Later hearing-loss reports include
  candidate variants and incomplete segregation, while other individuals carrying biallelic TSPEAR variants have
  dental or ectodermal findings without hearing loss. A Tspear S475TfsX79 mouse also had preserved auditory function.
  These observations challenge a general auditory loss-of-function mechanism without proving that every reported
  hearing-loss association is incidental. The reported clinical findings and proposed mechanism require interpretation
  separately from the better-supported TSPEAR-related ectodermal dysplasia 14 association.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


- name: TSPEAR siRNA in keratinocytes and hair-follicle organ cultures
  experimental_model_type: OTHER
  publication: PMID:27736875
  description: >-
    Comparative ectodermal-development experiments used primary human keratinocytes, a DLL1-stimulated HaCaT Notch
    reporter, and ex vivo skin strips from K14-H2B-GFP mice. Tspear was silenced by siRNA in the explants; K14-Cre
    generated the fluorescent lineage reporter, not a conditional Tspear knockout. Reduced Notch reporter activity
    and hair-follicle apoptosis support an ectodermal function but do not demonstrate an auditory causal pathway.
  evidence:
  - reference: PMID:27736875
    reference_title: Mutations in TSPEAR, Encoding a Regulator of Notch Signaling, Affect Tooth and Hair Follicle Morphogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO

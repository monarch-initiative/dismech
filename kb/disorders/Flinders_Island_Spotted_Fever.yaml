transmission:
- name: Reptile tick bite inoculation
  description: >-
    Humans acquire Flinders Island spotted fever when reptile-associated hard
    ticks bite and inoculate R. honei into skin.
  evidence:
  - reference: PMID:14628950
    reference_title: >-
      Aponomma hydrosauri, the reptile-associated tick reservoir of Rickettsia
      honei on Flinders Island, Australia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The tick Aponomma hydrosauri is associated with reptiles and is the
      arthropod reservoir for this rickettsia on Flinders Island.
    explanation: >-
      The tick survey identifies the reptile-associated Flinders Island vector
      and reservoir that seeds human tick exposure.

epidemiology:
- name: Southeastern Australian reptile-tick exposure
  description: >-
    FISF risk follows exposure to reptile-associated tick habitats in Flinders
    Island and southeastern Australia, including documented cases outside
    Flinders Island on Schouten Island and in southeastern South Australia.
  factors:
  - southeastern Australia tick exposure
  - reptile tick exposure
  evidence:
  - reference: PMID:16175900
    reference_title: "Not only 'Flinders Island' spotted fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases show that FISF extends beyond Flinders Island and most likely
      has the same distribution across south-east Australia as its vector, the
      reptile tick Aponomma hydrosauri.
    explanation: >-
      The southeastern Australian case report series extends FISF geography
      beyond Flinders Island and ties risk to the reptile-tick vector range.
  - reference: PMID:17553271
    reference_title: >-
      Flinders Island spotted fever rickettsioses caused by "marmionii" strain
      of Rickettsia honei, Eastern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cases were most prevalent in autumn and from eastern Australia, including
      Queensland, Tasmania, and South Australia.
    explanation: >-
      The R. honei marmionii series documents seasonal eastern-Australian
      occurrence.

progression:
- phase: Acute spotted-fever illness
  notes: >-
    The original Flinders Island syndrome was an acute spotted-fever-like
    illness with fever, headache, myalgia, arthralgia, cough, rash, and focal
    skin lesions over a 17-year island series; later eastern Australian R. honei
    marmionii cases had similar acute fever-rash illness and were most common
    in autumn.
  evidence:
  - reference: PMID:1986207
    reference_title: >-
      Flinders Island spotted fever: a newly recognised endemic focus of tick
      typhus in Bass Strait. Part 1. Clinical and epidemiological features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty six cases of a spotted-fever-like illness have been identified
      over a 17 year period in the population of about 1000 of Flinders Island,
      Tasmania.
    explanation: >-
      The founding clinical series describes repeated acute spotted-fever-like
      illness in the Flinders Island population.

pathophysiology:
- name: Reptile Tick-Borne Rickettsia honei Inoculation
  role: trigger
  description: >-
    Feeding reptile-associated ticks carrying R. honei inoculate spotted-fever
    group rickettsiae into the human dermis and initiate local infection at the
    arthropod attachment site.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  evidence:
  - reference: PMID:14628950
    reference_title: >-
      Aponomma hydrosauri, the reptile-associated tick reservoir of Rickettsia
      honei on Flinders Island, Australia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickettsia honei is the etiologic agent of Flinders Island (Australia)
      spotted fever.
    explanation: >-
      The tick ecology study links the Flinders Island reptile tick reservoir
      to the etiologic agent of human FISF.
  downstream:
  - target: Dermal Mononuclear Phagocyte Rickettsia honei Infection
    causal_link_type: DIRECT
    description: >-
      Tick inoculation deposits R. honei in skin, where early vector-borne
      rickettsial infection begins in dermal phagocytes.

- name: Dermal Mononuclear Phagocyte Rickettsia honei Infection
  role: primary_infection
  description: >-
    After tick inoculation, pathogenic rickettsiae enter macrophages or
    dendritic cells in the dermis before spreading through lymphatics toward
    systemic endothelial sites.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathogenic sequence of events that occur in rickettsial infection
      begins with the entry of organisms inoculated by the feeding tick or mite
      or scratched into the skin from infected louse or flea feces deposited on
      the skin. The initial target cells of infection are CD68+ cells
      (macrophages and/or dendritic cells)
    explanation: >-
      The rickettsial pathogenesis review places macrophages or dendritic cells
      at the start of vector-inoculated spotted-fever infection.
  downstream:
  - target: Rickettsial Lymphatic Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rickettsiae disseminate from the skin inoculation site through lymphatics.
  - target: Eschar
    causal_link_type: DIRECT
    description: Local inoculation-site infection can necrose into an eschar.

- name: Rickettsial Lymphatic Dissemination
  role: effector
  description: >-
    Rickettsiae spread from the skin inoculation site through lymphatic vessels
    to draining lymph nodes before hematogenous seeding of the vascular
    endothelium.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The rickettsiae then spread via lymphatic vessels to the regional lymph
      nodes as has been observed vividly in the lymphangitis associated with R.
      sibirica mongolitimoniae infection
    explanation: >-
      The review uses another SFG rickettsiosis to support lymphatic spread
      between the inoculation eschar and hematogenous endothelial infection.
  downstream:
  - target: Endothelial Cell Rickettsia honei Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Lymphatic spread precedes systemic endothelial seeding.
  - target: Regional Lymphadenopathy
    causal_link_type: DIRECT
    description: Drainage from the infected inoculation site enlarges regional lymph nodes.

- name: Endothelial Cell Rickettsia honei Infection
  role: effector
  description: >-
    Hematogenously disseminated pathogenic Rickettsia species mainly infect
    endothelial cells lining the small and medium blood vessels.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:19327117
    reference_title: Host-cell interactions with pathogenic Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some of the most common phenotypic characteristics of Rickettsia include
      their strict intracellular location and lifecycle association with
      arthropods.
    explanation: >-
      The review establishes the obligate intracellular lifestyle shared by
      pathogenic Rickettsia species.
  - reference: PMID:19327117
    reference_title: Host-cell interactions with pathogenic Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although pathogenic Rickettsiae are able to infect and replicate in a
      number of different cell types in vitro, a unique property during in vivo
      infection is their affinity for vascular endothelial cells (ECs) lining
      small and medium-sized blood vessels in humans and in established animal
      models of infection
    explanation: >-
      The review identifies vascular endothelial cells as the main in-vivo
      target for pathogenic rickettsial infection.
  downstream:
  - target: Rickettsial Vasculitis
    causal_link_type: DIRECT
    description: Endothelial rickettsial infection drives vascular inflammation.

- name: Rickettsial Vasculitis
  role: vascular_response
  description: >-
    Rickettsial endothelial infection and activation inflame small vessels and
    increase vascular permeability, producing the systemic fever and cutaneous
    rash of Flinders Island spotted fever.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: positive regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
  evidence:
  - reference: PMID:19327117
    reference_title: Host-cell interactions with pathogenic Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As the major target of pathogenic Rickettsiae is the endothelium lining of
      vital organs in humans, a majority of sequelae reflect infection-induced
      damage to the vascular system.
    explanation: >-
      The pathogenesis review connects endothelial infection with rickettsial
      vascular injury.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial inflammation produces fever.
  - target: Maculopapular and Petechial Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous rickettsial vasculitis produces the exanthem.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial inflammation contributes to headache.
  - target: Arthralgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The acute inflammatory syndrome produces joint pain.
  - target: Myalgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The acute inflammatory syndrome produces muscle pain.
  - target: Cough
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rickettsial systemic illness can include respiratory symptoms.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    R. honei, like other bacteria, depends on ribosomal translation of its mRNA,
    making the bacterial ribosome the conserved antibiotic target for
    doxycycline therapy.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence establishes the bacterial ribosome as the conserved target
      class for tetracyclines such as doxycycline.

- name: Intracytosolic Rickettsia honei Niche
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >-
    Rickettsia species reside free in the host-cell cytosol and exploit host
    metabolites, so effective FISF therapy must reach the intracellular
    bacterial compartment.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Rickettsial Ribosomal Translation
    causal_link_type: DIRECT
    description: Intracytosolic R. honei remains dependent on bacterial protein synthesis.
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many
      necessary components via transport mechanisms instead of maintaining genes
      for synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The review supports the free cytosolic niche for pathogenic Rickettsia
      species, including R. honei.


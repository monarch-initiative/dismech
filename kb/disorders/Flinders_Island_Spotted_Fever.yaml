name: Flinders Island Spotted Fever
creation_date: "2026-09-28T05:11:14Z"
category: Infectious Disease
description: >-
  Flinders Island spotted fever is an acute tick-borne spotted-fever-group
  rickettsiosis caused by the obligately intracellular bacterium Rickettsia
  honei in southern and eastern Australia. Reptile-associated Bothriocroton,
  formerly Aponomma, ticks maintain R. honei transovarially and inoculate the
  organism into human skin, where local infection can create an eschar before
  dissemination reaches vascular endothelium. The resulting rickettsial
  vasculitis accounts for the characteristic fever, headache,
  maculopapular-to-petechial rash, myalgia, arthralgia, and occasional
  lymphadenopathy.
disease_term:
  preferred_term: Flinders Island spotted fever
  term:
    id: MONDO:0000232
    label: Flinders island spotted fever
parents:
- Spotted fever rickettsiosis
synonyms:
- Rickettsia honei infection
- Flinders Island spotted fever rickettsiosis

references:
- reference: PMID:22815457
  title: Genomic comparison of Rickettsia honei strain RBT and other Rickettsia Species.
  found_in:
  - Flinders_Island_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      Rickettsia honei strain RB(T), the agent of Flinders Island spotted
      fever, was isolated from a febrile human patient on Flinders Island.
    supporting_text: >-
      Rickettsia honei strain RB(T) was isolated from a febrile patient on
      Flinders Island, Australia, in 1991 and has been demonstrated to be the
      agent of Flinders Island spotted fever, a disease transmitted to humans by
      ticks.
- reference: PMID:14628950
  title: >-
    Aponomma hydrosauri, the reptile-associated tick reservoir of Rickettsia
    honei on Flinders Island, Australia.
  found_in:
  - Flinders_Island_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      Aponomma hydrosauri ticks act as the Flinders Island arthropod reservoir
      for R. honei and maintain the rickettsia by vertical transmission.
    supporting_text: >-
      The tick Aponomma hydrosauri is associated with reptiles and is the
      arthropod reservoir for this rickettsia on Flinders Island.
- reference: PMID:17553271
  title: >-
    Flinders Island spotted fever rickettsioses caused by "marmionii" strain of
    Rickettsia honei, Eastern Australia.
  found_in:
  - Flinders_Island_Spotted_Fever-deep-research-openscientist.md
  findings:
  - statement: >-
      Eastern Australian FISF-like R. honei marmionii infections cause acute
      fever, headache, arthralgia, myalgia, cough, maculopapular or petechial
      rash, nausea, pharyngitis, lymphadenopathy, and eschar.
    supporting_text: >-
      We describe 7 cases of a rickettsiosis with an acute onset and symptoms
      of fever (100%), headache (71%), arthralgia (43%), myalgia (43%), cough
      (43%), maculopapular/petechial rash (43%), nausea (29%), pharyngitis
      (29%), lymphadenopathy (29%), and eschar (29%).


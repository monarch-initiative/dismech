  description: >-
    Local necrosis at the infected tick bite can produce a focal eschar or skin
    lesion.
  phenotype_term:
    preferred_term: Eschar
    term:
      id: HP:6000793
      label: Eschar
  evidence:
  - reference: PMID:17553271
    reference_title: >-
      Flinders Island spotted fever rickettsioses caused by "marmionii" strain
      of Rickettsia honei, Eastern Australia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 7 cases of a rickettsiosis with an acute onset and symptoms of
      fever (100%), headache (71%), arthralgia (43%), myalgia (43%), cough
      (43%), maculopapular/petechial rash (43%), nausea (29%), pharyngitis
      (29%), lymphadenopathy (29%), and eschar (29%).
    explanation: Eschar occurred in two of seven eastern Australian R. honei cases.
  - reference: PMID:1986207
    reference_title: >-
      Flinders Island spotted fever: a newly recognised endemic focus of tick
      typhus in Bass Strait. Part 1. Clinical and epidemiological features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve cases had a focal skin lesions. Available evidence implicates
      ticks as the vector.
    explanation: >-
      The founding Flinders Island case series reported focal skin lesions in
      nearly half of cases.

diagnosis:
- name: Rickettsial PCR on eschar specimens
  description: >-
    PCR of an unroofed eschar swab or an eschar biopsy can detect
    spotted-fever-group rickettsial DNA during early eschar-associated illness
    and can be followed by sequencing for species-level confirmation.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: A positive PCR from an eschar swab or biopsy supports early molecular confirmation.
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses,
      and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eschar Swab of unroofed eschar SFG rickettsiae PCR"
    explanation: >-
      The CDC diagnostic table lists PCR from an unroofed eschar swab as a
      spotted-fever-group rickettsiosis molecular test.

- name: Indirect immunofluorescence assay serology
  description: >-
    Indirect immunofluorescence using a spotted-fever-group panel can support
    recent R. honei infection by seroconversion or a rising titer, but
    cross-reaction across SFG Rickettsia antigens limits species assignment.
  results: >-
    Seroconversion or a fourfold rise supports recent spotted-fever-group
    rickettsial infection; PCR or sequencing is needed for species-level
    confirmation.
  evidence:
  - reference: PMID:1898756
    reference_title: >-
      Flinders Island spotted fever: a newly recognised endemic focus of tick
      typhus in Bass Strait. Part 2. Serological investigations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In seven of the 26 patients (27%) seroconversion was demonstrated by
      means of Weil-Felix tests, confirming recent infection.
    explanation: >-
      The founding serologic investigation documented seroconversion among
      symptomatic Flinders Island patients.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is first-line empiric therapy for suspected tick-borne
    rickettsial disease, including FISF, because it inhibits rickettsial
    ribosomal translation and reaches the host-cell cytosol where R. honei
    resides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: Doxycycline blocks rickettsial protein synthesis at the ribosome.
  - target: Intracytosolic Rickettsia honei Niche
    treatment_effect: BYPASSES
    description: Doxycycline can reach the cytosolic rickettsial compartment.
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses,
      and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne
      rickettsial diseases in patients of all ages, including children aged <8
      years, and should be initiated immediately in persons with signs and
      symptoms suggestive of rickettsial disease
    explanation: >-
      Flinders Island spotted fever is a tick-borne rickettsial disease, so
      this CDC first-line treatment recommendation covers empiric therapy for
      suspected FISF.

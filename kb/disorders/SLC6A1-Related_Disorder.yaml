name: SLC6A1-Related Neurodevelopmental Disorder
creation_date: "2026-07-25T00:00:00Z"
description: >-
  A gene-anchored, autosomal dominant neurodevelopmental disorder caused by
  heterozygous loss-of-function variants in SLC6A1, which encodes GAT-1, the
  sodium- and chloride-dependent GABA transporter 1 responsible for reuptake of
  the inhibitory neurotransmitter GABA from the synapse into presynaptic neurons
  and surrounding astrocytes. Most pathogenic missense variants misfold and are
  retained in the endoplasmic reticulum, reducing GAT-1 cell-surface expression
  and GABA reuptake; truncating variants act through haploinsufficiency. The
  resulting disturbance of GABA homeostasis and inhibitory neurotransmission
  produces a characteristic generalized epilepsy - classically epilepsy with
  myoclonic-atonic seizures (Doose-like) and childhood absence epilepsy -
  together with developmental delay/intellectual disability, autism spectrum
  disorder, hypotonia, and movement abnormalities (tremor, ataxia,
  stereotypies). This entry models the SLC6A1/GAT-1 gene-specific mechanism and
  is distinct from the phenotype-level, genetically heterogeneous Epilepsy with
  Myoclonic-Atonic Seizures (Doose syndrome) entry, of which SLC6A1 is the
  best-established single-gene cause.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epilepsy
synonyms:
- SLC6A1-related disorder
- SLC6A1-NDD
- SLC6A1-related epilepsy
- GAT-1 encephalopathy
- Myoclonic-atonic epilepsy, SLC6A1-related

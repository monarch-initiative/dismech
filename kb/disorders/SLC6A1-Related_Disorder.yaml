pathophysiology:
- name: SLC6A1 Variant and GAT-1 Loss of Function
  description: >-
    Heterozygous SLC6A1 variants impair GAT-1, the major sodium/chloride-dependent
    GABA transporter of the brain. Truncating variants (nonsense, frameshift,
    splice-site) reduce functional GAT-1 dose through haploinsufficiency, while
    most disease missense variants misfold and are retained in the endoplasmic
    reticulum with subsequent degradation, lowering cell-surface transporter
    expression. Both routes converge on partial or complete loss of GAT-1
    function. This node captures the single molecular trigger - the variant and
    the resulting transporter loss of function.
  role: trigger
  gene:
    preferred_term: SLC6A1
    term:
      id: hgnc:11042
      label: SLC6A1
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  - preferred_term: astrocyte

    term:
      id: GO:0098810
      label: neurotransmitter reuptake
    modifier: DECREASED
  - preferred_term: gamma-aminobutyric acid transport
    term:
      id: GO:0015812
      label: gamma-aminobutyric acid transport
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Its encoded GABA transporter 1 (GAT-1) is responsible for the reuptake of
      GABA into presynaptic neurons and glia, thereby modulating neurotransmission.
    explanation: >-
      Establishes GAT-1-mediated GABA reuptake into neurons and glia as the step
      that modulates neurotransmission and is impaired in the disorder.
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GAT-1 is expressed globally in the brain, in both astrocytes and neurons.
    explanation: >-
      Supports the dual astrocytic and neuronal localization of GAT-1 whose loss
      disrupts GABA homeostasis at both compartments.
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The GABA uptake function of GAT-1 in neurons cannot be compensated for by
      other GABA transporters, while the function in glia can be partially replaced
      by GABA transporter 3.
    explanation: >-
      Explains why neuronal GAT-1 loss is non-redundant, so impaired reuptake
      directly disrupts inhibitory GABA homeostasis.
  downstream:

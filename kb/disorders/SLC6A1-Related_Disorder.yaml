discussions:
- discussion_id: gap_slc6a1_gat1_rescue_human_translation
  prompt: >-
    Does restoring GAT-1 function - by genetic dose restoration (e.g. antisense
    or gene-based upregulation) or by pharmacological/chaperone rescue of
    misfolded, ER-retained transporter - translate from patient iPSC-derived
    astrocytes and neurons into clinical benefit in humans with SLC6A1-NDD?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#SLC6A1 Variant and GAT-1 Loss of Function
  - pathophysiology#Impaired GABA Reuptake and Disrupted GABA Homeostasis
  rationale: >-
    In vitro model evidence exists: patient iPSC-derived astrocytes and neurons
    show that reduced GABA uptake is caused by misfolding, ER retention, and
    degradation of variant GAT-1, and the authors conclude that boosting
    transporter function by genetic or pharmacological approaches would be
    beneficial. The open question is translational fidelity - whether restoring
    surface GAT-1 in cultured patient cells predicts clinical improvement in
    seizures and, especially, in the seizure-independent neurodevelopmental
    features, which may depend on early developmental windows that a mature-cell
    rescue cannot recapitulate. Whether haploinsufficiency versus a
    misfolding-driven dominant effect predominates also gates which strategy
    (dose restoration versus chaperone/proteostasis) is optimal.
  evidence:
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This study provides critical insight into therapeutic developments for
      SLC6A1 variant-mediated disorders and implicates that boosting transporter
      function by either genetic or pharmacological approaches would be beneficial.
    explanation: >-
      Establishes the iPSC-model-derived therapeutic rationale (GAT-1 boosting)
      whose translation to human clinical benefit is the open question.
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the loss of GABA uptake function and endoplasmic reticulum retention is
      consistent across induced pluripotent stem cell-derived cell types, including
      astrocytes and neurons, for the surveyed variants.
    explanation: >-
      Documents the iPSC-derived cellular model in which GAT-1 loss and ER
      retention - and thus candidate rescue - are demonstrated.
  proposed_experiments:
  - experiment_id: exp_slc6a1_gat1_rescue_translation
    name: GAT-1 rescue translation from iPSC models to in vivo readouts
    description: >-
      Test whether genetic dose restoration and chemical-chaperone rescue that
      restore surface GAT-1 and GABA uptake in patient iPSC-derived astrocytes and
      neurons also correct network inhibition and seizure/behavioral phenotypes in
      an SLC6A1 haploinsufficient in vivo model, and whether efficacy depends on the
      developmental timing of the intervention.
    experiment_type:
      preferred_term: cross-model therapeutic rescue experiment
    perturbations:
    - name: GAT-1 dose restoration and chaperone rescue
      target: pathophysiology#Impaired GABA Reuptake and Disrupted GABA Homeostasis
      genes:
      - preferred_term: SLC6A1
        term:
          id: hgnc:11042
          label: SLC6A1
      description: >-
        Apply genetic upregulation and chemical-chaperone treatment to patient
        iPSC-derived cells and to an SLC6A1 haploinsufficient in vivo model at
        different developmental time points.
    readouts:
    - name: Surface GAT-1, GABA uptake, and network inhibition
      target: pathophysiology#Impaired GABA Reuptake and Disrupted GABA Homeostasis
      biological_processes:
      - preferred_term: gamma-aminobutyric acid transport
        term:
          id: GO:0015812
          label: gamma-aminobutyric acid transport
        modifier: INCREASED
      assays:
      - preferred_term: radiolabeled GABA uptake assay
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Wild-type and isogenic-corrected cells
      description: Wild-type and CRISPR-corrected isogenic lines as references.
    - name: Vehicle versus chaperone
      description: Matched untreated versus chemical-chaperone-treated conditions.
    decision_criterion: >-
      Translation is supported if rescue that restores surface GAT-1 and GABA
      uptake in patient cells also improves in vivo inhibition and
      seizure/behavioral phenotypes; a mismatch is supported if cellular rescue
      fails to translate or is effective only within a narrow developmental window.
    would_support:
    - pathophysiology#Impaired GABA Reuptake and Disrupted GABA Homeostasis
- discussion_id: gap_slc6a1_haploinsufficiency_vs_dominant_negative
  prompt: >-
    Is SLC6A1-NDD a pure loss-of-dose (haploinsufficiency) disorder, or do
    misfolded, ER-retained missense GAT-1 mutants additionally act
    dominant-negatively by co-assembling with and retaining wild-type GAT-1 below
    hemizygous levels, and does the answer differ by variant class with
    consequences for therapy choice?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#SLC6A1 Variant and GAT-1 Loss of Function
  rationale: >-
    Truncating SLC6A1 variants plausibly act through simple haploinsufficiency,
    but most disease variants are missense, and functional studies show they
    misfold and are retained in the endoplasmic reticulum - a route that, as seen
    for GABAA-receptor subunits, can co-deplete wild-type protein and produce a
    dominant-negative effect exceeding loss of one allele. Whether this occurs for
    GAT-1, and how strongly it varies by variant, is unresolved and directly gates
    therapy: pure haploinsufficiency favors dose-restoration (e.g. antisense
    upregulation of the wild-type allele), whereas a dominant-negative
    misfolding mechanism favors chaperone/proteostasis rescue or allele-selective
    approaches.
  evidence:
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results resemble findings from pathogenic variants in other genes
      affecting the GABA pathway, such as GABAA receptors.
    explanation: >-
      Draws the parallel to GABAA-receptor variants, for which misfolding and
      wild-type co-retention (a dominant-negative route) are established, framing
      the open haploinsufficiency-versus-dominant-negative question for GAT-1.

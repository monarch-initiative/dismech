    term:
      id: GO:0006836
      label: neurotransmitter transport
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GAT-1, encoded by SLC6A1, is one of the major gamma-aminobutyric acid
      (GABA) transporters in the brain and is responsible for re-uptake of GABA
      from the synapse.
    explanation: >-
      Establishes GAT-1/SLC6A1 as a principal brain GABA transporter mediating
      synaptic GABA reuptake, the function lost in this disorder.
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all of which most likely lead to loss of function of GAT-1 and thus reduced
      GABA re-uptake from the synapse.
    explanation: >-
      Identifies loss of GAT-1 function and reduced GABA reuptake as the direct
      consequence of the identified SLC6A1 variants.
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The reduced GABA uptake appears to be due to reduced cell surface expression
      of the variant transporter caused by variant protein misfolding, endoplasmic
      reticulum retention, and subsequent degradation.
    explanation: >-
      Defines the molecular route to loss of function for missense variants -
      misfolding, ER retention, and degradation reducing surface GAT-1.
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that a partial or complete loss-of-function represents a common
      disease mechanism, although the extent of GABA uptake reduction is variable.
    explanation: >-
      Confirms partial-to-complete GAT-1 loss of function as the shared mechanism
      across SLC6A1 variants in patient-derived cells.
  downstream:
  - target: Impaired GABA Reuptake and Disrupted GABA Homeostasis
    causal_link_type: DIRECT
- name: Impaired GABA Reuptake and Disrupted GABA Homeostasis
  description: >-
    Loss of surface GAT-1 reduces clearance of synaptic and extrasynaptic GABA by
    both presynaptic GABAergic neurons and surrounding astrocytes, dysregulating
    GABA homeostasis. Because neuronal GAT-1 reuptake cannot be compensated by
    other GABA transporters (astrocytic GAT-1 is only partly covered by GAT-3),
    the net effect is a disturbance of the timing and tonic level of GABAergic
    inhibition. This node captures the single functional consequence - impaired
    GABA reuptake and disrupted GABA homeostasis.
  role: central_effector
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:

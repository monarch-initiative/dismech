mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014633
      label: epilepsy with myoclonic atonic seizures
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0014633 is equivalentTo OMIM:616421, whose definition states the
      disorder "has material basis in heterozygous mutation in the SLC6A1 gene
      on chromosome 3p25" - i.e. this is the gene-anchored SLC6A1 disease
      concept, not merely the phenotype label. No separate SLC6A1-specific
      neurodevelopmental-disorder MONDO term exists at the time of curation. The
      phenotype-level, genetically heterogeneous Epilepsy with Myoclonic-Atonic
      Seizures (Doose syndrome) entry maps to the same MONDO term at the clinical
      syndrome altitude; this entry uses it at the gene/mechanism altitude.

  gene_term:
    preferred_term: SLC6A1
    term:
      id: hgnc:11042
      label: SLC6A1
  association: Loss-of-Function Variants
  presence: Positive
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant (De Novo)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Heterozygous SLC6A1 variants cause disease through loss of GAT-1 function.
    The spectrum includes truncating variants (nonsense, frameshift, splice-site)
    acting via haploinsufficiency and predominantly missense variants that misfold
    and are retained in the endoplasmic reticulum, reducing surface transporter
    expression. In the Simons Searchlight registry, carriers had predominantly
    missense or nonsense variants.
  evidence:
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      targeted resequencing of 644 individuals with epileptic encephalopathies led
      to the identification of six SLC6A1 mutations in seven individuals
    explanation: >-
      Original identification of heterozygous SLC6A1 variants as a cause of
      epileptic encephalopathy with myoclonic-atonic seizures.
  - reference: PMID:35761184
    reference_title: "Consistency of parent-report SLC6A1 data in Simons Searchlight with Provider-Based Publications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carriers in Searchlight had 83 unique pathogenic or likely pathogenic
      variants in SLC6A1, which were predominantly missense or nonsense variants.
    explanation: >-
      Documents the predominantly missense/nonsense SLC6A1 variant spectrum in a
      standardized patient registry.

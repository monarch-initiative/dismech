prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    SLC6A1-NDD is a rare, recently delineated single-gene neurodevelopmental
    disorder; a precise population prevalence has not been established. In the
    discovery cohort, pathogenic SLC6A1 variants accounted for about 4% of
    otherwise unsolved myoclonic-atonic epilepsy cases.
  evidence:
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathogenic mutations occurred in 6/160 individuals with MAE, accounting for
      ~4% of unsolved MAE cases.
    explanation: >-
      Quantifies the SLC6A1 contribution to myoclonic-atonic epilepsy in the
      discovery cohort, supporting the disorder's rarity.

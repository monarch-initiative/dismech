- name: Thalamocortical Excitation-Inhibition Imbalance and Generalized Seizures
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Disrupted GABAergic inhibition destabilizes the excitatory/inhibitory balance
    of thalamocortical circuits, producing neuronal hyperexcitability and
    hypersynchronous discharges that manifest as generalized spike-wave activity
    and generalized seizures - classically myoclonic-atonic and absence seizures.
    Individuals with SLC6A1 variants share electrophysiological features with
    Gat1-deficient mice, including spontaneous spike-wave discharges.

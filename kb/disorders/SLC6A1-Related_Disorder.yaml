- name: Impaired GABAergic Signaling in Neurodevelopment
  description: >-
    SLC6A1 is expressed in the developing brain even before the CNS is fully
    formed, and GABAergic signaling has trophic, developmental roles beyond fast
    inhibition. Impaired GAT-1 function therefore perturbs GABAergic signaling
    during neurodevelopment, contributing to the broad, seizure-independent
    neurodevelopmental phenotype - developmental delay/intellectual disability and
    autism spectrum disorder. This node captures the single developmental
    consequence of disrupted GABAergic signaling.
  role: effector
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: ABNORMAL
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:34028503
    reference_title: "Common molecular mechanisms of SLC6A1 variant-mediated neurodevelopmental disorders in astrocytes and neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Solute carrier family 6 member 1 (SLC6A1) is abundantly expressed in the
      developing brain even before the CNS is formed.
    explanation: >-
      Supports an early developmental role for SLC6A1/GAT-1, consistent with a
      neurodevelopmental phenotype arising from disrupted GABAergic signaling.
  - reference: PMID:35761184
    reference_title: "Consistency of parent-report SLC6A1 data in Simons Searchlight with Provider-Based Publications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotypic spectrum is broad and includes developmental delay, epilepsy,
      and autism or autistic traits.
    explanation: >-
      Documents the broad neurodevelopmental phenotype (developmental delay,
      autism) that accompanies the epilepsy in SLC6A1-related disorder.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Autism Spectrum Disorder

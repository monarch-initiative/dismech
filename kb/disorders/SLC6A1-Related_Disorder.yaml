- name: EEG and Seizure Phenotyping
  description: >-
    EEG documents the generalized epilepsy - typically generalized spike-and-wave
    activity - and characterizes the myoclonic-atonic and absence seizure types,
    guiding antiseizure treatment.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: MAXO:0000932
      label: electroencephalography
  results: Generalized spike-and-wave discharges support the generalized epilepsy.
differential_diagnoses:
- name: Epilepsy with Myoclonic-Atonic Seizures (Doose syndrome), other genetic causes
  description: >-
    Epilepsy with myoclonic-atonic seizures (Doose syndrome) is a genetically
    heterogeneous clinical syndrome for which SLC6A1 is the best-established single
    gene; other cases involve SCN1A, SCN1B, GABRG2 and the GEFS+ spectrum or have
    complex/polygenic architecture. This SLC6A1 gene-anchored entry is one
    molecular cause of that clinical syndrome.
  distinguishing_features:
  - A heterozygous loss-of-function SLC6A1 variant favors SLC6A1-NDD.
  - Absence of an SLC6A1 variant, or a variant in another epilepsy gene, favors a
    non-SLC6A1 cause of the Doose-syndrome phenotype.
  evidence:
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathogenic mutations occurred in 6/160 individuals with MAE, accounting for
      ~4% of unsolved MAE cases.
    explanation: >-
      Shows SLC6A1 accounts for a minority of myoclonic-atonic epilepsy cases, so
      the Doose-syndrome phenotype has other genetic causes.
- name: Other GABAergic-pathway developmental and epileptic encephalopathies
  description: >-
    Developmental and epileptic encephalopathies caused by other GABA-pathway
    genes (e.g. GABRA1, GABRB3, GABRG2 encoding GABAA-receptor subunits) share
    impaired GABAergic inhibition and overlapping generalized epilepsy and are
    distinguished by molecular testing.
  distinguishing_features:
  - An SLC6A1 variant favors this disorder.
  - A GABAA-receptor-subunit gene variant favors the corresponding channelopathy.
progression:
- phase: Early childhood
  notes: >-
    Onset is typically in early childhood with generalized seizures
    (myoclonic-atonic and absence) in a child with emerging developmental delay, hypotonia,
    and language delay.
  evidence:
  - reference: PMID:25865495
    reference_title: "Mutations in the GABA Transporter SLC6A1 Cause Epilepsy with Myoclonic-Atonic Seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all of whom have epilepsy with myoclonic-atonic seizures (MAE).
    explanation: >-
      Anchors the early-childhood myoclonic-atonic epilepsy presentation of the
      disorder.
- phase: Later childhood to adulthood
  notes: >-
    Seizures may improve over time in some individuals, while the
    neurodevelopmental features - intellectual disability, autism spectrum
    disorder, and behavioral difficulties - persist as the dominant long-term
    burden.
  evidence:
  - reference: PMID:35761184
    reference_title: "Consistency of parent-report SLC6A1 data in Simons Searchlight with Provider-Based Publications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotypic spectrum is broad and includes developmental delay, epilepsy,
      and autism or autistic traits.
    explanation: >-
      Documents the persistent neurodevelopmental features that dominate the
      long-term course.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with antiseizure medications, generally broad-spectrum
    agents appropriate for generalized epilepsy. Levetiracetam is frequently used
    but is poorly tolerated in SLC6A1-NDD because of behavioral side effects at
    higher rates than in the general population, so alternatives are often
    considered.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

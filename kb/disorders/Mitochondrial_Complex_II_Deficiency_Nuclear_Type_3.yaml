classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  mechanistic_category:
  - classification_value: mitochondrial disease
  icimd_category:
  - classification_value: complex_ii_subunits_and_assembly_factors
    notes: >-
      ICIMD nuclear-encoded oxidative phosphorylation category: complex II

name: Mitochondrial Complex II Deficiency, Nuclear Type 3
category: Mendelian
creation_date: "2026-10-20T00:00:00Z"
synonyms:
- MC2DN3
- SDHD-related nuclear type mitochondrial complex II deficiency
- mitochondrial complex II deficiency, nuclear type 3
- mitochondrial complex 2 deficiency, nuclear type 3
description: >
  Mitochondrial complex II deficiency, nuclear type 3 (MC2DN3) is an autosomal
  recessive mitochondrial respiratory-chain disorder caused by biallelic
  pathogenic variants in SDHD, which encodes one of the two small hydrophobic
  subunits that anchor the catalytic SDHA/SDHB dimer of succinate dehydrogenase
  (complex II) to the inner mitochondrial membrane. Recessive SDHD variants
  reduce steady-state levels of SDH subunits and impair assembly of complex II,
  leaving an isolated complex II deficiency that disrupts both succinate
  oxidation in the tricarboxylic acid cycle and electron transfer to ubiquinone.
  The reported phenotype is a variable multisystem mitochondrial disease:
  early-onset progressive encephalomyopathy with developmental delay or
  regression, severe to profound intellectual disability, hypotonia, seizures,
  nystagmus, optic atrophy, progressive microcephaly and raised lactate with
  urinary excretion of Krebs-cycle intermediates, and/or cardiomyopathy ranging
  from fatal prenatal-onset hypertrophic cardiomyopathy with left ventricular
  non-compaction to childhood dilated cardiomyopathy. Only a handful of
  families have been described. The disorder is distinct from the autosomal
  dominant, paternally transmitted SDHD-related hereditary
  paraganglioma-pheochromocytoma syndrome (PGL1), which is caused by monoallelic
  germline SDHD loss with somatic loss of the second allele in tumours; none of
  the recessive complex II deficiency alleles reported so far has been
  linked to tumourigenesis.

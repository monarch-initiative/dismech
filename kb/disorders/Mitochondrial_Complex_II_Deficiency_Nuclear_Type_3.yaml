biochemical:
- name: Reduced succinate dehydrogenase (complex II) enzyme activity
  presence: DECREASED
  context: >
    Spectrophotometric assay of skeletal muscle shows an isolated complex II
    defect (about 30% residual activity relative to citrate synthase in the
    neonatal p.Asp92Gly case), and SDH histochemistry shows a global reduction
    of staining. Fibroblast assays can be normal, as in one Palestinian sibling,
    so muscle is the informative tissue.
  evidence:
  - reference: PMID:26008905
    reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histochemical analysis of fresh-frozen muscle biopsy sections revealed a global reduction of succinate dehydrogenase (complex II) activity compared to aged-matched control samples"
    explanation: SDH histochemistry of patient muscle shows globally reduced complex II activity.
  - reference: PMID:34012134
    reference_title: "Consolidating biallelic SDHD variants as a cause of mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normal respiratory chain complexes II-IV in fibroblast homogenate"
    explanation: One affected sibling had normal complex II activity in fibroblasts, showing that a normal fibroblast assay does not exclude the disease.

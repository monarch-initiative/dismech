      term:
        id: hgnc:10683
        label: SDHD
    evidence:
    - reference: PMID:26008905
      reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we were able to confirm that the p.(Asp92Gly) mutation causes a more severe oxidative growth phenotype than the p.(Asp92Tyr) mutant, and provides functional evidence to support the pathogenicity of the patient's SDHD mutation."
      explanation: Yeast modelling supports pathogenicity of p.Asp92Gly and shows it is more severe than the paraganglioma allele at the same residue.
  features: >
    Biallelic SDHD variants cause nuclear type 3 complex II deficiency. All
    three reported alleles are missense or stop-loss changes predicted to
    disrupt the transmembrane anchor rather than null alleles. Monoallelic
    germline SDHD loss causes a different disease, paternally transmitted
    hereditary paraganglioma-pheochromocytoma (PGL1).
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Affected individuals are homozygous or compound heterozygous for SDHD variants; carrier parents are unaffected.
  evidence:
  - reference: PMID:26008905
    reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results from parental carrier testing were consistent with an autosomal recessive inheritance pattern, with each parent harbouring a heterozygous c.275A>G, p.(Asp92Gly) SDHD variant"
    explanation: Segregation in the p.Asp92Gly family is consistent with autosomal recessive inheritance.
  - reference: PMID:33162331
    reference_title: "The genetic basis of isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a mitochondrial disease presentation, almost exclusively due to bi-allelic recessive variants and associated with an isolated complex II deficiency"
    explanation: The review of all reported complex II deficiency patients describes the mitochondrial disease presentation as due to biallelic recessive variants.
animal_models:
- name: Sdhd knockout mouse
  species: Mouse
  genotype: Sdhd constitutive null allele (Sdhd-/- and Sdhd+/-)
  publication: PMID:15572694
  description: >
    Constitutive Sdhd knockout mouse. Homozygous null embryos die early in
    development, and heterozygotes have a general, uncompensated reduction of
    succinate dehydrogenase activity without major physiological dysfunction,
    apart from carotid body glomus cell overactivity. It shows that SDHD is
    essential and that loss of one allele lowers SDH activity, but neither
    genotype reproduces the recessive human encephalomyopathy or
    cardiomyopathy.
  evidence:
  - reference: PMID:15572694
    reference_title: "The mitochondrial SDHD gene is required for early embryogenesis, and its partial deficiency results in persistent carotid body glomus cell activation with full responsiveness to hypoxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous SDHD(+/-) mice show a general, noncompensated deficiency of succinate dehydrogenase activity without alterations in body weight or major physiological dysfunction."
    explanation: Heterozygous Sdhd loss lowers SDH activity in the mouse without producing disease.
  modeled_mechanisms:
  - target: SDHD Loss and Impaired Complex II Assembly
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Sdhd loss lowers SDH activity, but no viable genotype reproduces the
      human disease: the null is embryonic-lethal and the heterozygote is
      largely asymptomatic.
    limitations: >-
      Patients carry biallelic missense or stop-loss alleles that leave some
      residual complex II, whereas the model removes the gene entirely. No
      hypomorphic, knock-in or tissue-specific Sdhd model of the recessive
      encephalomyopathy or cardiomyopathy is cited here.
    evidence:
    - reference: PMID:15572694
      reference_title: "The mitochondrial SDHD gene is required for early embryogenesis, and its partial deficiency results in persistent carotid body glomus cell activation with full responsiveness to hypoxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous SDHD(-/-) animals die at early embryonic stages."
      explanation: Complete Sdhd loss is lethal before birth, so the null model cannot reproduce the postnatal human disease caused by hypomorphic biallelic alleles.
discussions:
- discussion_id: sdhd_carrier_tumour_risk
  prompt: >-
    Do heterozygous carriers of the SDHD alleles that cause recessive complex II
    deficiency (p.Glu69Lys, p.Asp92Gly, the stop-loss extension) carry an
    increased risk of paraganglioma or pheochromocytoma, and does tumour
    surveillance benefit them?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#SDHD biallelic pathogenic variants
  rationale: >-
    Monoallelic loss-of-function SDHD variants cause paternally transmitted
    paraganglioma, and p.Asp92Gly affects the same residue as the Dutch founder
    paraganglioma allele p.Asp92Tyr. None of the recessive alleles has yet been
    found in a tumour, and the affected families have no tumours, but the
    families studied are few and young. Clinicians caring for the p.Asp92Gly
    family recommended surveillance on precaution only.
  evidence:
  - reference: PMID:34012134
    reference_title: "Consolidating biallelic SDHD variants as a cause of mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the three SDHD variants associated with mitochondrial complex II deficiency have been previously linked to tumourigenesis, including in this extended Palestinian family"
    explanation: States that no tumour has been linked to the recessive SDHD alleles so far.
  - reference: PMID:26008905
    reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is unclear whether germline carriers of the p.(Asp92Gly) SDHD mutation are at elevated risk of HNPGL and despite no tumours having been reported in the family, it is the opinion of their clinicians that surveillance was advisable and is ongoing."
    explanation: States that carrier tumour risk is unknown and surveillance is precautionary.
- discussion_id: sdhd_complex_ii_no_disease_specific_therapy
  prompt: >-
    Is there any treatment that modifies the course of SDHD-related complex II
    deficiency? Riboflavin has been tried in other complex II-deficient
    children, but no SDHD patient has a reported treatment trial.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  rationale: >-
    The literature on recessive SDHD disease consists of three case reports
    covering six patients, none of which reports a therapeutic intervention, so
    the treatments section is deliberately empty. Riboflavin, the precursor of
    the FAD cofactor carried by the SDHA flavoprotein, has been given
    empirically to children with isolated complex II deficiency of unstated
    genotype, with stabilization in some. Whether it could help a defect of the
    SDHD membrane-anchor subunit, which does not carry FAD, is unknown.
  evidence:
  - reference: PMID:16737791
    reference_title: "Effects of riboflavin in children with complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two patients with early-onset leukoencephalopathy, neurological condition remained stable or even moderately improved."
    explanation: Riboflavin was associated with clinical stabilization in complex II-deficient children whose genotypes the abstract does not report; no SDHD patient has been treated in this way.

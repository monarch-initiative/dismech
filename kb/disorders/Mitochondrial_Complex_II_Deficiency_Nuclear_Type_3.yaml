      this category.
prevalence:
- measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    No population prevalence estimate exists. Isolated complex II deficiency
    accounts for only 2-4% of oxidative phosphorylation defects, and recessive
    SDHD disease had been reported in one Swiss child, one Irish neonate and
    one extended Palestinian family (four affected children) when it was
    consolidated as a disease gene in 2021.
  evidence:
  - reference: PMID:34012134
    reference_title: "Consolidating biallelic SDHD variants as a cause of mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, only two individuals with candidate biallelic SDHD variants and isolated complex II deficiency have been reported"
    explanation: States how few patients with recessive SDHD complex II deficiency had been reported before this family.
  - reference: PMID:34012134
    reference_title: "Consolidating biallelic SDHD variants as a cause of mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Complex II deficiency is rare accounting for only 2–4% of OXPHOS defects"
    explanation: Places isolated complex II deficiency, of which SDHD disease is a small subset, among the rarest OXPHOS defects.
pathophysiology:
- name: SDHD Loss and Impaired Complex II Assembly
  biological_scale: MOLECULAR
  description: >
    Biallelic SDHD variants (missense substitutions in the transmembrane
    helices, or a stop-loss extension) destabilize the membrane-anchor subunit
    of succinate dehydrogenase. Patient tissue shows reduced steady-state levels
    of SDHD and of the catalytic SDHA subunit and less fully assembled complex
    II, consistent with degradation of subunits that cannot be incorporated into
    the holoenzyme.
  genes:
  - preferred_term: SDHD
    term:
      id: hgnc:10683
      label: SDHD
  molecular_functions:
  - preferred_term: succinate dehydrogenase (quinone) activity
    term:
      id: GO:0008177
      label: succinate dehydrogenase (quinone) activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: respiratory chain complex II assembly
    term:
      id: GO:0034552
      label: respiratory chain complex II assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:24367056
    reference_title: "Mutations in SDHD lead to autosomal recessive encephalomyopathy and isolated mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Native polyacrylamide gel electrophoresis and western blotting demonstrated an impaired complex II assembly."
    explanation: Shows that compound heterozygous SDHD variants impair complex II assembly in patient material.
  - reference: PMID:26008905
    reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blotting of patient muscle homogenates revealed a reduction in the steady-state levels evident for not only SDHD, but also for SDHA."
    explanation: Homozygous SDHD p.Asp92Gly reduces steady-state levels of both SDHD and the catalytic SDHA subunit in patient muscle.
  downstream:
  - target: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
    causal_link_type: DIRECT
    description: Less assembled complex II lowers succinate:ubiquinone oxidoreductase capacity.
- name: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
  biological_scale: MOLECULAR
  description: >
    Deficient complex II activity impairs oxidation of succinate to fumarate
    and the transfer of the resulting electrons to ubiquinone, disrupting the
    single enzyme that links the tricarboxylic acid cycle to the respiratory
    electron transport chain. Residual complex II activity in patient muscle was
    about 30% of control with complexes I, III and IV normal, and the
    equivalent yeast sdh4 substitution abolishes oxidative growth.
  biological_processes:
  - preferred_term: mitochondrial electron transport, succinate to ubiquinone
    term:
      id: GO:0006121
      label: mitochondrial electron transport, succinate to ubiquinone
    modifier: DECREASED
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:26008905
    reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analysis of his skeletal muscle biopsy revealed evidence of a severe isolated complex II deficiency"
    explanation: Documents an isolated complex II enzymatic defect in the muscle of a patient homozygous for SDHD p.Asp92Gly.
  - reference: PMID:26008905
    reference_title: "A recessive homozygous p.Asp92Gly SDHD mutation causes prenatal cardiomyopathy and a severe mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with the reduction of SDHD steady-state levels and fully assembled complex II found in our patient, the p.(Asp92Gly) mutation was detrimental to both oxidative growth and succinate dehydrogenase activity in yeast."
    explanation: Yeast carrying the equivalent sdh4 substitution lose succinate dehydrogenase activity and oxidative growth, supporting the catalytic consequence of the human variant.
  downstream:
  - target: Bioenergetic Failure and Multisystem Energy Deficit
    causal_link_type: DIRECT
    description: Loss of succinate-driven electron flow reduces oxidative ATP synthesis.
  - target: Decreased activity of mitochondrial complex II
    causal_link_type: DIRECT
    description: The enzymatic defect is directly measurable as reduced complex II activity in muscle.
  - target: Urinary excretion of Krebs cycle intermediates
    causal_link_type: DIRECT
    description: A block at succinate oxidation causes Krebs-cycle intermediates to accumulate and spill into urine.
- name: Bioenergetic Failure and Multisystem Energy Deficit
  biological_scale: CELLULAR
  description: >
    Reduced electron flux through the respiratory chain lowers oxidative
    phosphorylation and shifts metabolism toward anaerobic glycolysis, raising
    lactate. Tissues most dependent on oxidative phosphorylation (brain, optic
    nerve, heart and skeletal muscle) are preferentially affected, giving the
    encephalomyopathic and cardiomyopathic presentations.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:34012134
    reference_title: "Consolidating biallelic SDHD variants as a cause of mitochondrial complex II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "explaining why common findings include optic atrophy, leukoencephalopathy, myopathy, cardiomyopathy and Leigh syndrome"
    explanation: Explains the tissue distribution of SDHD complex II deficiency by the oxidative-phosphorylation dependence of the affected organs; a general mitochondrial-disease statement applied to this disorder.
  downstream:
  - target: Mitochondrial encephalomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Neuronal and muscle energy failure produces progressive encephalomyopathy.
  - target: Developmental regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Energy deficit, unmasked by infection, fasting or surgery, causes episodes of neurodevelopmental regression.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic cerebral energy failure from infancy impairs neurodevelopment.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Central and muscular energy failure lowers muscle tone.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cortical energy failure lowers the seizure threshold.
  - target: Optic atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Retinal ganglion cells and optic nerve axons are highly dependent on oxidative phosphorylation.
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Visual-pathway and brainstem involvement produce nystagmus.
  - target: Progressive microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired postnatal brain growth under chronic energy deficit.
  - target: Hypertrophic cardiomyopathy with left ventricular non-compaction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cardiomyocyte energy failure from fetal life drives prenatal-onset hypertrophic non-compaction cardiomyopathy.
  - target: Dilated cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic cardiomyocyte energy failure drives later-onset dilated cardiomyopathy in some patients.
  - target: Elevated circulating lactate
    causal_link_type: DIRECT
    description: Reduced oxidative phosphorylation diverts pyruvate to lactate.

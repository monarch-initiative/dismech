genetic:
- name: 17q24.3 Boundary-Crossing Duplication
  gene_term:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A tandem duplication at 17q24.3 spanning the SOX9/KCNJ TAD boundary and
    including the KCNJ2 and KCNJ16 coding sequences plus SOX9 upstream
    regulatory sequence. Four overlapping duplications in an approximately 2 Mb
    interval were reported in the original four families, and a 1.9 Mb
    duplication in a later Chinese family. Because the lesion is a copy-number
    variant with a regulatory mechanism, exome sequencing is negative — the
    Chinese family was solved only after array CGH. KCNJ2 coding mutations cause
    Andersen-Tawil syndrome, an unrelated phenotype.
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both whole-exome sequencing and microarray-based comparative genomic hybridization (CGH) were performed on this family and the results of copy number variation (CNV) were verified by quantitative real-time PCR (qPCR)."
    explanation: Documents the testing strategy that identified the copy-number lesion.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, through whole-exome sequencing (WES), we detected no pathogenic mutations in genes conferred to bone development."
    explanation: Explains why sequencing alone does not diagnose this disorder.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, our findings suggest that 17q24.3 duplication is the genetic cause of brachydactyly-anonychia in this family, which support the prior report that brachydactyly-anonychia is associated with 17q24.3 duplication, and further indicates the pathogenic correlation between BD and CNVs."
    explanation: Independent replication of the 17q24.3 duplication as the cause.
variants:
- name: POSTRE Table 1 Nr3 17q24.3 duplication
  variant_type: duplication
  genomic_contexts:
  - coding sequence
  - intergenic region
  gene:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  regulatory_target_gene:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  regulatory_category: GOE
  description: >-
    Approximately 2.02 Mb duplication represented in POSTRE Table 1 patient
    Nr3 and Supplementary Data 3 as hg19 chr17:68020547-70038208, attributed
    there to the Cooks syndrome patient in Franke et al. (2016). These are
    POSTRE-reported interval bounds, not independently verified
    nucleotide-resolved junctions or a newly identified patient. The interval contains
    KCNJ2 and KCNJ16 coding sequence and intergenic regulatory sequence 5'
    of SOX9, while sparing SOX9 itself. KCNJ2 is both physically duplicated
    and the regulatory target. The pathogenic model is enhancer adoption
    within a neo-TAD, supported by patient-fibroblast chromatin contacts and
    corresponding engineered mouse alleles with ectopic digit expression.
    The GOE assignment uses the mouse spatial-expression evidence; it is
    not a claim that POSTRE experimentally measured this patient's expression.
  evidence:
  - reference: PMID:36999617
    reference_title: 'POSTRE: a tool to predict the pathological effects of human structural variants.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The coordinates of the SVs in positive control patients (Table 1 and Table 2)"
    explanation: >-
      Table 1 Nr3, Supplementary Data 3 Table1_SVs, and the authors'
      testFiles/Table1_LongRange_SVs.tsv agree on the hg19 interval
      chr17:68020547-70038208, duplication, KCNJ2, limb phenotype, and
      Franke et al. source. POSTRE is the secondary coordinate and case
      index here, not the source of experimental proof.
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "However, incorporation of the next flanking gene, Kcnj2, in the neo-TAD resulted in ectopic contacts of Kcnj2 with the duplicated part of the Sox9 regulatory region, consecutive misexpression of Kcnj2, and a limb malformation phenotype."
    explanation: >-
      Primary experimental evidence supports the mechanism of the corresponding
      duplication class. The mouse Dup-C and Dup-C2 alleles are engineered
      models, not the human hg19 allele; patient fibroblast 4C-seq separately
      supports the ectopic contacts. The paper's main text does not resolve
      the POSTRE coordinate pair to nucleotide-level human junctions.
  functional_effects:
  - function: Neo-TAD formation across the SOX9/KCNJ boundary
    type: Regulatory structural rearrangement
    regulatory_element_type: TAD_BOUNDARY
    regulatory_mechanism: Boundary-crossing tandem duplication and neo-TAD formation
    description: >-
      Duplicated parts of the adjacent regulatory domains form an insulated
      neo-TAD containing KCNJ2 and SOX9 regulatory sequence. This is domain
      reorganization rather than deletion of the boundary sequence.
  - function: Ectopic KCNJ2 expression in developing digits
    type: Regulatory gain of ectopic expression
    regulatory_category: GOE
    regulatory_element_type: ENHANCER
    affected_developmental_stage: Embryonic digit development; mouse limb assays at E12.5 and E17.5
    regulatory_mechanism: Enhancer adoption from the duplicated SOX9 regulatory landscape
    description: >-
      Kcnj2 adopts a Sox9-like digit expression pattern in the corresponding
      mouse duplication model. Expression and phenotype controls distinguish
      this effect from an extra Kcnj2 copy within its original regulatory
      domain; no altered intrinsic potassium-channel activity is established.
diagnosis:
- name: Copy-number diagnosis after a negative exome
  description: >-
    Recognised clinically by absent nails with hypoplastic or absent distal
    phalanges across most digits of hands and feet in an otherwise normal child.
    Confirmation requires copy-number analysis — chromosomal microarray or array
    CGH, verified by qPCR — because the lesion is a noncoding-boundary
    duplication that exome sequencing does not detect. A negative gene panel is
    expected and should not stop the workup.
  diagnosis_term:
    preferred_term: array comparative genomic hybridization
    term:
      id: NCIT:C198497
      label: Array-based Comparative Genomic Hybridization
  results: >-
    A 17q24.3 duplication spanning the SOX9/KCNJ TAD boundary, with normal
    exome sequencing.
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because some CNVs, including deletions and duplications, cannot be readily detected by WES, we also employed comparative genomic hybridization (CGH) for CNV analysis on this family."
    explanation: States why copy-number analysis is required after a negative exome.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We next confirmed this duplication by qPCR"
    explanation: Documents qPCR as the confirmatory step for the array finding.
treatments:

- name: Apical Digit Malformation with Anonychia
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation is confined to the apical digital structures:
    hypoplasia or absence of distal phalanges with absent or dystrophic nails,
    typically in more than half the digits of both hands and feet, and thumbs
    that may appear digitalized. Because the terminal phalanx and the nail unit
    develop together, the anonychia is part of the same apical lesion rather than
    a separate ectodermal defect. Nothing outside the autopod is affected — no
    short stature, no developmental delay, no other skeletal abnormality, and
    none of the Andersen-Tawil phenotype that KCNJ2 coding mutations produce.
  biological_processes:
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had the normal stature as well as intellectual development and no other skeletal abnormality"
    explanation: Confirms the malformation is confined to the digits.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "brachydactyly-anonychia but no any phenotypes related to Andersen"
    explanation: >-
      Affected individuals lack the Andersen-Tawil phenotype, consistent with a
      tissue-restricted misexpression mechanism rather than altered channel
      function everywhere.
  downstream:
  - target: Anonychia
    causal_link_type: DIRECT
  - target: Aplasia or Hypoplasia of the Distal Phalanges of the Hand
    causal_link_type: DIRECT
  - target: Aplasia or Hypoplasia of the Middle Phalanges of the Hand
    causal_link_type: DIRECT
  - target: Aplasia or Hypoplasia of the Distal Phalanges of the Toes
    causal_link_type: DIRECT
  - target: Brachydactyly
    causal_link_type: DIRECT

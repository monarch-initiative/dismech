pathophysiology:
- name: Boundary-Crossing Duplication at 17q24.3
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: KCNJ2
      term:
        id: hgnc:6263
        label: KCNJ2
    variant_type: duplication
    genomic_contexts:
    - coding sequence
    - intergenic region
    variant_origin: GERMLINE
    description: >-
      Tandem duplications include KCNJ2 coding sequence and intergenic SOX9
      regulatory sequence, crossing the boundary between their TADs while
      sparing SOX9 coding sequence. The POSTRE Table 1 Nr3 interval is one
      reported example of this lesion class.
  description: >-
    Boundary-crossing duplications at 17q24.3 copy KCNJ2 and neighboring
    noncoding regulatory sequence. The original Cooks duplications also
    include KCNJ16. Their regulatory consequence depends on the extent of
    the duplicated interval. In the experimental mouse series, duplicating
    Kcnj2 and Kcnj16 within their original TAD did not produce the digit
    phenotype, whereas incorporation of Kcnj2 into a neo-TAD with Sox9
    regulatory sequence did. This distinguishes the pathogenic regulatory
    rearrangement from gene copy-number gain alone.
  gene:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which is involved in two coding regions of KCNJ2 and KCNJ16"
    explanation: Defines the coding content of the independently reported Chinese-family duplication.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To further verify the potential pathogenicity of this CNV, we conducted qPCR analysis to screen for this duplicated region in 500 normal controls and no one carried this variation."
    explanation: Control screening supports the duplication as pathogenic rather than a common variant.
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Duplications of non-coding DNA within the mouse Sox9 TAD (intra-TAD) that cause female to male sex reversal in humans, showed increased contact of the duplicated regions within the TAD, but no change in the overall TAD structure."
    explanation: >-
      The full experimental series distinguishes intra-TAD duplications from
      boundary-crossing duplications. Dup-K1 and Dup-K2 mice duplicate the
      Kcnj genes within their original domain without the Cooks digit phenotype.
  - reference: PMID:34821995
    reference_title: A novel complex genomic rearrangement affecting the KCNJ2 regulatory region causes a variant of Cooks syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cooks syndrome (CS) is an ultrarare limb malformation due to in tandem microduplications involving KCNJ2 and extending to the 5' regulatory element of SOX9."
    explanation: Independent statement of the duplication class associated with Cooks syndrome.
  downstream:
  - target: Neo-TAD Formation and Ectopic KCNJ2 Enhancer Contact
    description: >-
      The boundary-crossing duplicated interval forms an insulated chromatin
      domain containing KCNJ2 and duplicated SOX9 regulatory sequence.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27706140
      reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, overlapping duplications that extended over the next boundary into the neighbouring TAD (inter-TAD), resulted in the formation of a new chromatin domain (neo-TAD) that was isolated from the rest of the genome."
      explanation: Capture Hi-C in engineered mouse limb buds demonstrates neo-TAD formation.
- name: Neo-TAD Formation and Ectopic KCNJ2 Enhancer Contact
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The duplicated KCNJ2 gene occupies the neo-TAD together with part of the
    SOX9 regulatory landscape. Capture Hi-C and 4C-seq in engineered Dup-C
    mouse limb buds demonstrate new contacts within this domain; patient
    fibroblast 4C-seq also demonstrates ectopic KCNJ2 contacts with the
    duplicated SOX9 regulatory region. SOX9 itself remains outside the
    duplication. A gene-free neo-TAD in the Dup-L control is phenotypically
    silent, so domain formation alone is insufficient for the limb phenotype.
    The contact measurements are distinct from the expression assays below.
  gene:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  biological_processes:
  - preferred_term: KCNJ2 enhancer-promoter contacts within the neo-TAD
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, incorporation of the next flanking gene, Kcnj2, in the neo-TAD resulted in ectopic contacts of Kcnj2 with the duplicated part of the Sox9 regulatory region, consecutive misexpression of Kcnj2, and a limb malformation phenotype."
    explanation: >-
      The engineered Dup-C mouse provides direct chromatin-contact evidence;
      the full paper separately reports corresponding 4C-seq contacts in
      cultured fibroblasts from an affected individual (Extended Data Figure 6).
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As a consequence of this insulation, inter-TAD duplications had no phenotypic effect."
    explanation: >-
      The Dup-L control forms a neo-TAD without capturing Kcnj2 or Kcnj16
      and has no digit phenotype; this does not describe the pathogenic Dup-C allele.
  downstream:
  - target: Ectopic KCNJ2 Expression in Developing Digits
    description: >-
      Contact with the duplicated Sox9 regulatory landscape drives a Sox9-like
      Kcnj2 expression pattern in the developing digits of Dup-C mice.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27706140
      reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ectopic contacts of Kcnj2 with the duplicated part of the Sox9 regulatory region, consecutive misexpression of Kcnj2"
      explanation: >-
        Chromatin-contact assays and whole-mount in situ hybridization link
        the new regulatory contacts to ectopic digit expression in the mouse model.
- name: Ectopic KCNJ2 Expression in Developing Digits
  role: central_effector
  biological_scale: MOLECULAR
  regulatory_category: GOE
  mechanism_confidence: ESTABLISHED
  description: >-
    Whole-mount in situ hybridization in Dup-C mice shows Kcnj2 expression
    in the digit anlagen with a Sox9-like spatial pattern. Limb-bud RNA-seq
    at E12.5 and E17.5 also shows increased Kcnj2 expression, while Sox9 and
    Kcnj16 remain unchanged. The spatially ectopic expression supports GOE;
    the quantitative increase alone would not. A Dup-C2 allele including
    Kcnj2 but not Kcnj16 also produces the digit phenotype. These are model
    measurements, not direct expression measurements from human embryonic
    digits, and they do not demonstrate altered intrinsic channel activity.
  gene:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  biological_processes:
  - preferred_term: gene expression
    term:

classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly with anonychia (Cooks syndrome, KCNJ2). The placement in the
      "isolated" rather than the "as part of syndromes" group is deliberate
      despite the eponym: the phenotype is confined to the apical digital
      structures, with normal stature, normal development, and no other skeletal
      abnormality. Anonychia here is part of the apical digit malformation — nail
      and terminal phalanx form as one unit — not an extraskeletal feature. The
      2019 revision (PMID:31633310) placed it in group 37 "Brachydactylies
      (without extraskeletal manifestations)". Per-row re-verification against
      the 2023 Table 1 is tracked in monarch-initiative/dismech#7867.

    modifier: INCREASED
  evidence:
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "consecutive misexpression of Kcnj2, and a limb malformation phenotype."
    explanation: >-
      Figure 3 and the accompanying expression assays demonstrate ectopic
      Kcnj2 in developing digits, supporting regulatory GOE in the model.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "17q24.3 duplications disrupt the boundary between SOX9 TAD and KCNJ TAD, leading to overexpression of Kcnj2 in the digit anlagen and limb buds"
    explanation: >-
      This clinical report summarizes the earlier mouse mechanism; it is not
      an independent expression experiment in the Chinese family's limb tissue.
  downstream:
  - target: Apical Digit Malformation with Anonychia
    description: >-
      Ectopic Kcnj2 expression is associated with abnormal terminal phalanges
      and nail development in the duplication model. The intervening cellular
      mechanism remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

name: Cooks Syndrome
synonyms:
- Brachydactyly-anonychia
- Anonychia-onychodystrophy with hypoplasia or absence of distal phalanges
- ODP
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Cooks syndrome is an isolated malformation of the apical structures of the
  digits: absent or dysplastic nails together with hypoplasia or absence of the
  distal phalanges, usually affecting more than half the digits of hands and
  feet, with thumbs that may look "digitalized". Despite the eponym it is not a
  multisystem syndrome — reported patients have normal stature, normal
  intellectual development, and no other skeletal abnormality — which is why the
  ISDS nosology places it with the isolated brachydactylies rather than the
  syndromic ones.

  A well-studied cause is a tandem duplication at 17q24.3 that includes KCNJ2
  coding sequence and SOX9 regulatory sequence while sparing SOX9 itself.
  Boundary-crossing duplication forms a neo-TAD that exposes KCNJ2 to the
  duplicated SOX9 regulatory landscape. Patient-fibroblast chromatin contacts
  and engineered mouse limb-expression assays support this mechanism, with
  ectopic Kcnj2 expression in developing mouse digits. Thus the regulatory
  consequence is distinct from the coding overlap or copy-number gain.
  A complex 1;17 translocation has also been reported with a Cooks-like
  phenotype; its embryonic limb-expression consequence remains unresolved.

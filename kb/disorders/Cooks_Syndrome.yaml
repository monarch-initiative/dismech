classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly with anonychia (Cooks syndrome, KCNJ2). The placement in the
      "isolated" rather than the "as part of syndromes" group is deliberate
      despite the eponym: the phenotype is confined to the apical digital
      structures, with normal stature, normal development, and no other skeletal
      abnormality. Anonychia here is part of the apical digit malformation — nail
      and terminal phalanx form as one unit — not an extraskeletal feature. The
      2019 revision (PMID:31633310) placed it in group 37 "Brachydactylies
      (without extraskeletal manifestations)". Per-row re-verification against
      the 2023 Table 1 is tracked in monarch-initiative/dismech#7867.
prevalence:
- population: Reported families worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Extremely rare. Seven affected individuals in four families were reported in
    the original genomic series in 2009, with essentially no further reports
    until a single Chinese family in 2020.
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reported seven affected individuals representing BD as well as absent nails in all digits"
    explanation: Records the size of the original case series.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since then, no other studies have reported this disease any more."
    explanation: States the near-absence of further reports in the intervening decade.
  - reference: PMID:34821995
    reference_title: A novel complex genomic rearrangement affecting the KCNJ2 regulatory region causes a variant of Cooks syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, six CS families were resolved at the molecular level."
    explanation: Gives the running total of molecularly resolved Cooks syndrome families as of 2022.
pathophysiology:
- name: Boundary-Crossing Duplication at 17q24.3
  role: trigger
  biological_scale: MOLECULAR
  description: >
    The causal lesion is a tandem duplication of roughly 1-2 Mb at 17q24.3 that
    contains the coding sequences of KCNJ2 and KCNJ16 together with noncoding
    regulatory sequence 5' of SOX9. What matters is not the extra copy of any
    gene but where the duplication starts and stops: it spans the boundary
    between the SOX9 TAD and the neighbouring KCNJ TAD. Duplications confined
    within the SOX9 TAD produce a different disease (sex reversal), and
    duplications that stay inside a single boundary can be phenotypically silent
    — so the pathogenicity is a property of the breakpoints relative to TAD
    architecture, not of dosage.
  gene:
    preferred_term: KCNJ2
    term:
      id: hgnc:6263
      label: KCNJ2
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which is involved in two coding regions of KCNJ2 and KCNJ16"
    explanation: Defines the gene content of the duplicated interval.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To further verify the potential pathogenicity of this CNV, we conducted qPCR analysis to screen for this duplicated region in 500 normal controls and no one carried this variation."
    explanation: Control screening supports the duplication as pathogenic rather than a common variant.
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Duplications of non-coding DNA within the mouse Sox9 TAD (intra-TAD) that cause female to male sex reversal in humans, showed increased contact of the duplicated regions within the TAD, but no change in the overall TAD structure."
    explanation: >-
      Establishes that a duplication contained within the SOX9 TAD gives a
      different phenotype, so breakpoint position relative to the boundary is
      what matters.
  - reference: PMID:34821995
    reference_title: A novel complex genomic rearrangement affecting the KCNJ2 regulatory region causes a variant of Cooks syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cooks syndrome (CS) is an ultrarare limb malformation due to in tandem microduplications involving KCNJ2 and extending to the 5' regulatory element of SOX9."
    explanation: Independent statement of the duplication class that defines Cooks syndrome.
  - reference: PMID:34821995
    reference_title: A novel complex genomic rearrangement affecting the KCNJ2 regulatory region causes a variant of Cooks syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a unique case of CS associated with a de novo 1;17 translocation affecting the KCNJ2 locus."
    explanation: >-
      A non-duplication rearrangement producing the same phenotype; PARTIAL
      because it shows the duplication is not the only route to Cooks syndrome
      and so widens the lesion class this node describes.
  downstream:
  - target: Neo-TAD Formation and Ectopic KCNJ2 Enhancer Contact
    description: >-
      A duplication extending past the TAD boundary reorganises the local
      chromatin into a new self-contained domain.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27706140
      reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, overlapping duplications that extended over the next boundary into the neighbouring TAD (inter-TAD), resulted in the formation of a new chromatin domain (neo-TAD) that was isolated from the rest of the genome."
      explanation: Shows boundary-crossing duplications generate a neo-TAD.
- name: Neo-TAD Formation and Ectopic KCNJ2 Enhancer Contact
  role: central_effector
  biological_scale: MOLECULAR
  description: >
    Inside the neo-TAD, KCNJ2 comes to lie in the same insulated compartment as
    the duplicated portion of the SOX9 regulatory landscape. Capture Hi-C and
    4C-seq show ectopic contacts between KCNJ2 and those enhancers. The
    consequence is tissue-specific misexpression: KCNJ2 is switched on in the
    digit anlagen and limb buds, where SOX9 enhancers are active and where KCNJ2
    is normally silent. A neo-TAD that does not capture a gene has no phenotypic
    effect, which is the control that identifies gene capture, rather than
    domain formation itself, as the pathogenic step.
  gene:
    preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  biological_processes:
  - preferred_term: Regulation of Transcription by RNA Polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  molecular_functions:
  - preferred_term: Inward Rectifier Potassium Channel Activity
    term:
      id: GO:0005242
      label: inward rectifier potassium channel activity
    modifier: INCREASED
  evidence:
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, incorporation of the next flanking gene, Kcnj2, in the neo-TAD resulted in ectopic contacts of Kcnj2 with the duplicated part of the Sox9 regulatory region, consecutive misexpression of Kcnj2, and a limb malformation phenotype."
    explanation: >-
      The central mechanistic result — gene capture into the neo-TAD drives
      KCNJ2 misexpression and limb malformation.
  - reference: PMID:27706140
    reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As a consequence of this insulation, inter-TAD duplications had no phenotypic effect."
    explanation: >-
      The negative control: forming a neo-TAD without capturing a gene produces
      no phenotype, isolating gene capture as the pathogenic step.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "17q24.3 duplications disrupt the boundary between SOX9 TAD and KCNJ TAD, leading to overexpression of Kcnj2 in the digit anlagen and limb buds"
    explanation: Restates the boundary-disruption-to-misexpression mechanism for the human duplication.
  - reference: PMID:34821995
    reference_title: A novel complex genomic rearrangement affecting the KCNJ2 regulatory region causes a variant of Cooks syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene expression analysis demonstrated downregulation of KCNJ2 in both patient's blood cells and cultured skin fibroblasts."
    explanation: >-
      A complication for the simple overexpression model: in the translocation
      case KCNJ2 was *down*-regulated in accessible tissues, with the breakpoint
      separating KCNJ2 from a putative enhancer. Recorded as PARTIAL because
      blood and fibroblasts are not the digit anlagen, so this does not
      contradict limb-specific misexpression - but it does mean the direction of
      the KCNJ2 dysregulation that matters for the limb is not settled.
  - reference: PMID:34821995
    reference_title: A novel complex genomic rearrangement affecting the KCNJ2 regulatory region causes a variant of Cooks syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that a complex rearrangement falling in the 5' of KCNJ2 may mimic the developmental consequences of in tandem duplications affecting the SOX9-KCNJ2/Sox9-Kcnj2 locus."
    explanation: >-
      The authors converge on the same conclusion by a different lesion: what
      matters is disturbance of the KCNJ2 regulatory landscape.
  downstream:
  - target: Apical Digit Malformation with Anonychia
    description: >-
      Ectopic KCNJ2 activity in the digit anlagen disturbs formation of the
      terminal phalanx and its nail unit.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32583964
      reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our findings suggest that 17q24.3 duplication is the genetic cause of brachydactyly-anonychia in this family"
      explanation: Links the duplication to the digital phenotype in an independent family.
- name: Apical Digit Malformation with Anonychia
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation is confined to the apical digital structures:
    hypoplasia or absence of distal phalanges with absent or dystrophic nails,
    typically in more than half the digits of both hands and feet, and thumbs
    that may appear digitalized. Because the terminal phalanx and the nail unit
    develop together, the anonychia is part of the same apical lesion rather than
    a separate ectodermal defect. Nothing outside the autopod is affected — no
    short stature, no developmental delay, no other skeletal abnormality, and
    none of the Andersen-Tawil phenotype that KCNJ2 coding mutations produce.
  biological_processes:
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had the normal stature as well as intellectual development and no other skeletal abnormality"
    explanation: Confirms the malformation is confined to the digits.
  - reference: PMID:32583964
    reference_title: A 17q24.3 duplication identified in a large Chinese family with brachydactyly-anonychia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "brachydactyly-anonychia but no any phenotypes related to Andersen"
    explanation: >-
      Affected individuals lack the Andersen-Tawil phenotype, consistent with a
      tissue-restricted misexpression mechanism rather than altered channel
      function everywhere.
  downstream:
  - target: Anonychia
    causal_link_type: DIRECT
  - target: Aplasia or Hypoplasia of the Distal Phalanges of the Hand
    causal_link_type: DIRECT
  - target: Aplasia or Hypoplasia of the Middle Phalanges of the Hand
    causal_link_type: DIRECT
  - target: Aplasia or Hypoplasia of the Distal Phalanges of the Toes
    causal_link_type: DIRECT
  - target: Brachydactyly
    causal_link_type: DIRECT

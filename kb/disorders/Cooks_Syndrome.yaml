name: Cooks Syndrome
synonyms:
- Brachydactyly-anonychia
- Anonychia-onychodystrophy with hypoplasia or absence of distal phalanges
- ODP
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Cooks syndrome is an isolated malformation of the apical structures of the
  digits: absent or dysplastic nails together with hypoplasia or absence of the
  distal phalanges, usually affecting more than half the digits of hands and
  feet, with thumbs that may look "digitalized". Despite the eponym it is not a
  multisystem syndrome — reported patients have normal stature, normal
  intellectual development, and no other skeletal abnormality — which is why the
  ISDS nosology places it with the isolated brachydactylies rather than the
  syndromic ones.

  Its mechanistic interest is out of proportion to its rarity. Cooks syndrome is
  caused not by a coding variant but by duplications at 17q24.3 that cross the
  boundary between the SOX9 topologically associating domain and the neighbouring
  KCNJ domain. Chromosome conformation capture showed that such a
  boundary-crossing duplication builds an entirely new chromatin domain — a
  neo-TAD — which captures KCNJ2 and exposes it to SOX9 limb enhancers, so KCNJ2
  is misexpressed in the digit anlagen. The gene is an inward-rectifier potassium
  channel whose coding mutations cause Andersen-Tawil syndrome; here the channel
  is structurally normal and simply switched on in the wrong tissue, and affected
  individuals have none of the Andersen-Tawil phenotype. Cooks syndrome is
  therefore one of the clearest human demonstrations that where a gene is
  expressed, set by three-dimensional genome architecture, can be the disease
  mechanism.

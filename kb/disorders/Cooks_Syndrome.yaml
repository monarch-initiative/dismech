    Counseling for autosomal dominant transmission of a copy-number variant,
    including the point that the phenotype is confined to the digits and carries
    no Andersen-Tawil cardiac or neuromuscular risk despite involving KCNJ2.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knock-in mice showed tissue and cell vulnerability consistent with Wnt-signaling intensity and individual and collective functions of Wnts in embryogenesis."
    explanation: >-
      In knock-in mice, which tissues fail tracks their dependence on Wnt
      signaling.

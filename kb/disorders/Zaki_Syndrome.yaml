treatments:
- name: Prenatal Wnt agonist (preclinical)
  description: >-
    A small-molecule Wnt agonist given to pregnant knock-in mice partially
    restored embryonic development. It acts downstream of the secretion
    defect. The cited abstract does not name the agent, so no
    therapeutic_agent is bound. It has not been tried in patients.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: prenatal Wnt agonist pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Deficient Developmental Wnt Signaling
    description: Activates Wnt signaling downstream of the secretion defect.
  evidence:
  - reference: PMID:34587386
    reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Administration of a pharmacologic Wnt agonist partially restored embryonic development."
    explanation: Partial prenatal rescue in knock-in mice.
- name: 4-Phenylbutyric acid (preclinical)
  description: >-
    The chemical chaperone 4-phenylbutyric acid restored the reduced levels of
    mutant WLS protein in cells. It acts on the unstable protein itself. It
    has not been tested in animals or patients.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemical chaperone pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-phenylbutyric acid
      term:
        id: CHEBI:41500
        label: 4-phenylbutyric acid
  target_mechanisms:
  - target: Biallelic WLS Hypomorphic Variants
    description: Restores the reduced level of mutant WLS protein.
  evidence:
  - reference: PMID:37005218
    reference_title: "Compound heterozygous variants in WLS gene causes Zaki syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that the decreased mutant WLS expression can be rescued by 4-Phenylbutyric acid (4-PBA)."
    explanation: A chemical chaperone restores mutant WLS levels in vitro.
animal_models:
- name: Wls patient-variant knock-in mice
  species: Mouse
  genotype: Wls knock-in of two patient missense alleles (two lines)
  publication: PMID:34587386
  description: Two knock-in lines, each carrying one patient WLS variant.
  modeled_mechanisms:
  - target: Deficient Developmental Wnt Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Tissue defects follow each tissue's Wnt dependence, and a Wnt agonist
      partially rescues development.
    limitations: >-
      Mouse embryology differs from human, and only the abstract of the source
      is cached, so the specific tissue readouts are not curated.
    evidence:
    - reference: PMID:34587386
      reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knock-in mice showed tissue and cell vulnerability consistent with Wnt-signaling intensity and individual and collective functions of Wnts in embryogenesis."
      explanation: Mice reproduce the Wnt-dependence pattern.

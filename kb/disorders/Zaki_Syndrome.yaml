pathophysiology:
- name: Biallelic WLS Hypomorphic Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaging WLS alleles are inherited. Most are missense variants in the
    transmembrane domains or near the C-terminal endoplasmic-reticulum
    targeting motif. They lower WLS protein stability, and p.Tyr478Cys has
    recurred in five patients.
  genes:
  - preferred_term: WLS
    term:
      id: hgnc:30238
      label: WLS
  molecular_functions:
  - preferred_term: Wnt-protein binding
    term:
      id: GO:0017147
      label: Wnt-protein binding
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:34587386
    reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous mutations in WLS, which encodes the Wnt ligand secretion mediator (also known as Wntless or WLS) in 10 affected persons from 5 unrelated families."
    explanation: Discovery of biallelic WLS variants in five families.
  - reference: PMID:34587386
    reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutations affected WLS protein stability and Wnt signaling."
    explanation: The patient alleles destabilize WLS.
  downstream:
  - target: Reduced Wnt Ligand Secretion
    causal_link_type: DIRECT
    description: >-
      Less WLS means less transport of lipid-modified Wnt proteins to the cell
      surface.
    evidence:
    - reference: PMID:37005218
      reference_title: "Compound heterozygous variants in WLS gene causes Zaki syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro functional characterization showed that the two variants led to decreased WLS production and secretion of WNT3A, eventually affecting the WNT signal."
      explanation: Patient alleles reduce WLS and WNT3A secretion.
- name: Reduced Wnt Ligand Secretion
  biological_scale: CELLULAR
  description: >-
    WLS is the only known route for secreting Wnt proteins, so the
    hypomorphic alleles reduce secretion of several Wnt ligands at once,
    including WNT3A.
  biological_processes:
  - preferred_term: Wnt protein secretion
    term:
      id: GO:0061355
      label: Wnt protein secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:34587386
    reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "(The Wnt ligand secretion mediator is essential for the secretion of all Wnt proteins.)"
    explanation: >-
      Background statement of WLS function, which explains why one gene
      affects many Wnt-dependent tissues.
  - reference: PMID:37005218
    reference_title: "Compound heterozygous variants in WLS gene causes Zaki syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional characterization showed that the two variants led to decreased WLS production and secretion of WNT3A, eventually affecting the WNT signal."
    explanation: Measured reduction in WNT3A secretion with patient alleles.
  downstream:
  - target: Deficient Developmental Wnt Signaling
    causal_link_type: DIRECT
    description: >-
      Less secreted Wnt reduces Wnt signaling in receiving tissues during
      embryogenesis.
    evidence:
    - reference: PMID:34587386
      reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutations affected WLS protein stability and Wnt signaling."
      explanation: Patient alleles reduce downstream Wnt signaling.
- name: Deficient Developmental Wnt Signaling
  biological_scale: TISSUE
  description: >-
    Each tissue is affected according to how strongly it depends on Wnt
    signaling during development, which explains the variable multi-organ
    pattern. Brain growth, limb patterning, eye, kidney, heart, hair and teeth
    are all Wnt-dependent.

genetic:
- name: WLS
  gene_term:
    preferred_term: WLS
    term:
      id: hgnc:30238
      label: WLS
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    WLS (1p31.3; also called Wntless, EVI or GPR177) encodes the multi-pass
    membrane cargo receptor that escorts palmitoleated Wnt proteins through the
    secretory pathway. Zaki syndrome is the only recessive disease known to be
    caused by WLS variants.
  evidence:
  - reference: PMID:36374649
    reference_title: "Mutations in the WLS are associated with dental anomalies, torus palatinus, and torus mandibularis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Biallelic pathogenic variants in WLS are implicated in autosomal recessive Zaki syndrome (ZKS; MIM 619648), the only genetic condition known to be caused by pathogenic variants in WLS."
    explanation: Background statement tying WLS to Zaki syndrome.
  - reference: PMID:34587386
    reference_title: "A Human Pleiotropic Multiorgan Condition Caused by Deficient Wnt Secretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified homozygous mutations in WLS, which encodes the Wnt ligand secretion mediator (also known as Wntless or WLS) in 10 affected persons from 5 unrelated families."
    explanation: Five unrelated families with biallelic WLS variants.
  variants:
  - name: NM_024911.7:c.1433A>G (p.Tyr478Cys)
    type: MISSENSE
    description: >-
      Recurrent allele, homozygous in five patients across more than one
      ancestry. It is the same residue as p.Tyr476Cys on NM_001002292: both
      RefSeq proteins carry the motif FFTGIY once, with the tyrosine at 476 in
      the 543-residue NM_001002292 product and at 478 in the 541-residue
      NM_024911.7 product, and the cDNA positions differ by the same 6 nt.
    evidence:
    - reference: PMID:42641982
      reference_title: "WLS-related Zaki syndrome: New clinical features and evidence for p.(Tyr478Cys) variant as a possible mutational hotspot."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She represents the fifth ZKS patient identified with this variant, indicating a possible mutational hotspot."
      explanation: Fifth patient homozygous for p.Tyr478Cys.
  - name: c.1579G>A (p.Gly527Arg)
    type: MISSENSE
    description: Homozygous in a boy with a severe phenotype.
    evidence:
    - reference: PMID:37106064
      reference_title: "Expanding the phenotypic spectrum and clinical severity associated with WLS gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a likely disease-causing variant in WLS (c.1579G>A, p.Gly527Arg) in a boy presented with a broad range of MCA including microcephaly, facial dysmorphism, alopecia, ophthalmologic anomalies, and complete soft tissue syndactyly."
      explanation: Reports the allele and phenotype.
  - name: c.1427A>G (p.Tyr476Cys) and c.415C>T (p.Arg139Cys)
    type: COMPOUND_HETEROZYGOUS
    description: >-
      Compound heterozygous in a Chinese boy. p.Tyr476Cys on NM_001002292 is
      the recurrent p.Tyr478Cys allele on NM_024911.7 (c.1433A>G), so this
      patient carries the hotspot allele in trans with p.Arg139Cys.
    evidence:
    - reference: PMID:37005218
      reference_title: "Compound heterozygous variants in WLS gene causes Zaki syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome gene sequencing (WES) identified compound heterozygous variants in the WLS gene (c.1427A > G; p.Tyr476Cys and c.415C > T, p.Arg139Cys; NM_001002292) in a 16-year-old boy presenting with facial dysmorphism, astigmatism, renal agenesis, and cryptorchidism."
      explanation: Reports the two alleles.
  - name: c.271G>A (p.Val91Met) and c.1279-1G>C
    type: COMPOUND_HETEROZYGOUS
    description: Missense and splice-acceptor alleles in an infant diagnosed early.
    evidence:
    - reference: PMID:40618129
      reference_title: "Early diagnosed Zaki syndrome: identification of two novel WLS variants and a literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A missense variant c.271G > A (p.Val91Met) and a splice site variant c.1279-1G > C in the WLS gene were identified."
      explanation: Reports the two alleles.

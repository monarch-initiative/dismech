name: Zaki Syndrome
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  Zaki syndrome (ZKS) is an ultra-rare autosomal recessive multiple congenital
  anomaly syndrome caused by biallelic variants in WLS, which encodes Wntless,
  the transmembrane cargo receptor that carries lipid-modified Wnt proteins
  from the endoplasmic reticulum and Golgi to the cell surface. WLS is needed to
  secrete every Wnt ligand, so its loss affects many developmental programs at
  once. The reported alleles are mostly missense variants that destabilize WLS
  and reduce, rather than abolish, Wnt secretion. Affected individuals have
  developmental delay or intellectual disability, postnatal microcephaly,
  short stature, a recognizable face with a wide mouth, alopecia, and
  variable eye, limb, renal, cardiac, dental and skeletal malformations,
  including iris coloboma, toe syndactyly, renal agenesis and heart defects.
  Knock-in mice reproduce tissue-specific developmental defects that follow
  each tissue's dependence on Wnt signaling, and a Wnt agonist given during
  pregnancy partially restored embryonic development in mice. It is distinct
  from Zaki-Gleeson syndrome, a DDX59-related disorder.
notes: >-
  The entry is anchored on MONDO:0859209 (OMIM 619648) and WLS (hgnc:30238).
  Zaki-Gleeson syndrome (OMIM 614407, MONDO:0013735, DDX59) shares the eponym
  and is a different disease; none of its sources is cited here.

  About fourteen patients have been reported. A 2025 literature review
  (PMID:40618129) tabulates feature frequencies across 13 of them, but only its
  abstract is cached, so no frequency band is recorded and each phenotype is
  supported by the patient reports that describe it.

  Cupped ears, sparse scalp hair, high-arched palate, short philtrum, wide
  nose, strabismus and corpus callosum or cerebellar vermis hypoplasia are
  listed among frequent features in the deep-research report, which takes
  them from the PMID:40618129 review table. None is named in any cached
  abstract. The review is open access (PMC12229024), but just fetch-reference
  PMID:40618129 cached the abstract only and just fetch-reference
  DOI:10.1186/s13052-025-02067-8 returned no text, so these features are not
  curated.

  The review abstract also links transmembrane missense variants to fewer
  cases of long fingers or toes. That phrase does not say which digits, and
  HPO has separate terms for long fingers and long toes, so it is not
  curated as a phenotype.

  Heterozygous WLS missense variants have been reported in patients with
  dental anomalies and oral exostoses (PMID:36374649). That is a carrier
  observation outside this recessive syndrome and is not curated as a
  phenotype here.

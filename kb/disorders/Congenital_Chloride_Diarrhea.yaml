diagnosis:
- name: Stool electrolyte measurement
  description: >-
    Measurement of fecal chloride, sodium and potassium is the decisive test: a
    stool chloride concentration exceeding the sum of stool sodium and potassium
    establishes the diagnosis. It should be interpreted alongside serum
    electrolytes and blood gas, which show the characteristic hypochloremic
    hypokalemic metabolic alkalosis.
  evidence:
  - reference: PMID:35127600
    reference_title: "Step-Up Approach for Sodium Butyrate Treatment in Children With Congenital Chloride Diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sure diagnosis of CLD was based on the results of full anamnestic,
      clinical and laboratory evaluation (including the evaluation of fecal Na+,
      Cl-, and K+), and the result of the molecular analysis.
    explanation: >-
      States the diagnostic algorithm used at an international reference centre:
      fecal electrolyte evaluation together with molecular analysis.
- name: SLC26A3 sequencing
  description: >-
    Molecular confirmation by SLC26A3 sequencing. Genotype is clinically useful
    beyond confirmation, because response to butyrate therapy is
    genotype-dependent.
  evidence:
  - reference: PMID:24350656
    reference_title: "Genotype-dependency of butyrate efficacy in children with congenital chloride diarrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

      with the development of metabolic alkalosis, electrolytes imbalance,
      failure to thrive, psycho-motor delay and even death
    explanation: >-
      Names the full systemic consequence set of this node - metabolic alkalosis,
      electrolyte imbalance, failure to thrive, psychomotor delay and mortality -
      and attributes it to volume contraction from the diarrhea.
  downstream:
  - target: Chloride-Rich Watery Diarrhea and Its Consequences
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Chloride-Rich Watery Diarrhea and Its Consequences
  conforms_to: "electrolyte_transport_related_diarrhea#Electrolyte Crisis, Growth Failure and Long-Term Morbidity"
  description: >-
    The clinical output. Lifelong profuse watery diarrhea whose stool chloride
    concentration exceeds the sum of stool sodium and potassium - the finding that
    clinches the diagnosis. Untreated, volume contraction and electrolyte
    depletion cause failure to thrive, psychomotor delay, renal impairment from
    chronic hypovolemia and hypokalemia, and death. Treated with salt
    substitution, electrolytes normalise and survival and growth are good, but
    stool volume remains high, so quality of life is dominated by the number of
    daily evacuations and by fecal incontinence.
  role: consequence
  biological_scale: ORGANISM

genetic:
- name: SLC26A3 loss-of-function variants
  gene_term:
    preferred_term: SLC26A3
    term:
      id: hgnc:3018
      label: SLC26A3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic SLC26A3 variants reduce or abolish DRA chloride/bicarbonate
    exchange. The originally reported alleles were two missense variants
    (V317del and H124L) and a frameshift (344delT); the V317 deletion is the
    Finnish founder allele, supported by the population history of Finland.
    Genotype matters therapeutically as well as diagnostically: response to oral
    butyrate is genotype-dependent, best in patients carrying missense and
    deletion variants, consistent with butyrate acting partly by rescuing
    mistrafficking or misfolding of a residual protein rather than by replacing
    an absent one.
  evidence:
  - reference: PMID:8896562
    reference_title: "Mutations of the Down-regulated in adenoma (DRA) gene cause congenital chloride diarrhoea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report segregation of two missense mutations, delta V317 and H124L, and
      one frameshift mutation, 344delT, of DRA in 32 Finnish and four Polish CLD
      patients
    explanation: >-
      The gene-discovery report identifying the causative DRA/SLC26A3 variants
      and their segregation in Finnish and Polish patients.
  - reference: PMID:8896562
    reference_title: "Mutations of the Down-regulated in adenoma (DRA) gene cause congenital chloride diarrhoea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that DRA is an intestinal anion transport molecule that causes
      chloride diarrhoea when mutated.
    explanation: >-
      States the causal conclusion linking the gene to the disease phenotype.
pathophysiology:
- name: Loss of Apical DRA Chloride/Bicarbonate Exchange
  conforms_to: "electrolyte_transport_related_diarrhea#Loss of an Apical Intestinal Electrolyte Transport Step"
  description: >-
    The initiating lesion. DRA (SLC26A3) is a sodium-independent
    chloride/bicarbonate exchanger expressed at the apical membrane of
    differentiated ileal and colonic epithelium, where it performs the major
    chloride-absorbing step of the intestine, taking up luminal chloride in
    exchange for bicarbonate. Biallelic loss-of-function variants abolish or
    severely reduce this exchange. Notably, transcript expression can be
    preserved - the Finnish V317del allele is expressed at normal levels - so the
    lesion is loss of transport function at the apical membrane rather than loss
    of the gene product, which is what makes pharmacological rescue of residual
    protein conceivable.

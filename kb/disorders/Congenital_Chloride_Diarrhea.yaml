notes: >-
  CLD is the prototype of the electrolyte-transport-related class of congenital
  diarrheas and enteropathies. It deliberately does NOT conform to the
  diet_induced_osmotic_diarrhea module. Although the retained luminal chloride is
  osmotically active and older literature calls the diarrhea "osmotic", the
  module models substrate-specific failure to handle an ingested NUTRIENT, whose
  defining feature is remission on dietary elimination of that nutrient; here the
  failed step handles an ion, the diarrhea is independent of feeding, and no
  dietary elimination abolishes it. The current CODE nosology (PMID:29654747)
  separates these two classes for exactly this reason and gives congenital
  chloride diarrhea as its example of the electrolyte-transport class. Note that
  the same source also cautions that the older "secretory" label is imprecise
  here, since the primary lesion is loss of chloride ABSORPTION rather than
  active anion secretion - which is why the MONDO label "congenital secretory
  chloride diarrhoea 1" is retained as the disease_term but the entry text
  describes the mechanism as absorptive failure. The mirror-image disorder is
  congenital sodium diarrhea (SLC9A3/GUCY2C), where loss of sodium/proton
  exchange produces metabolic acidosis instead of alkalosis. Both are curated as
  conformers of the electrolyte_transport_related_diarrhea module, which factors
  out the shared chain and treats the opposite acid-base directions as a
  predicted consequence of which transporter's coupling partner is lost.

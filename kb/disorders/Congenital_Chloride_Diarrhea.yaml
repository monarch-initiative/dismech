name: Congenital Chloride Diarrhea
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- CLD
- CCD
- congenital chloridorrhea
- Darrow-Gamble disease
- congenital secretory chloride diarrhea 1
description: >-
  Congenital chloride diarrhea (CLD) is a rare autosomal recessive congenital
  diarrhea caused by biallelic loss-of-function variants in SLC26A3, which
  encodes the apical sodium-independent chloride/bicarbonate exchanger DRA
  ("down-regulated in adenoma") of the ileal and colonic epithelium. It is the
  prototype of the electrolyte-transport-related class of congenital diarrheas
  and enteropathies, a class kept separate in the current nosology from the
  diet-induced (osmotic) congenital diarrheas: here the transport step that fails
  handles an ion rather than an ingested nutrient, so the diarrhea is entirely
  independent of what the infant is fed and cannot be treated by dietary
  elimination. Loss of DRA abolishes intestinal chloride absorption, so chloride
  is retained in the lumen and carries water with it, while the coupled
  bicarbonate secretion that DRA normally performs also fails. The result is a
  distinctive and diagnostically decisive biochemical signature: profuse watery
  stool with a chloride concentration exceeding the sum of sodium and potassium,
  together with hypochloremia, hyponatremia, hypokalemia and metabolic ALKALOSIS
  - the opposite acid-base derangement to the metabolic acidosis of congenital
  sodium diarrhea, its mirror-image disorder. Disease begins in utero: failure to
  absorb intestinal fluid causes fetal bowel dilatation and marked polyhydramnios,
  frequently with premature birth, and the neonate can be mistaken for having
  intestinal obstruction because the watery stool is passed as apparent urine.
  Lifelong oral salt substitution (sodium chloride and potassium chloride) is
  life-saving and normalises electrolytes, but does not reduce stool volume; oral
  sodium butyrate can reduce diarrhea severity in a genotype-dependent manner.

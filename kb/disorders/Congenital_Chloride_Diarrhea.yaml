- name: Systemic Electrolyte Depletion and Metabolic Alkalosis
  conforms_to: "electrolyte_transport_related_diarrhea#Ion-Specific Systemic Depletion and Acid-Base Derangement"
  description: >-
    The systemic arm, and the source of the disorder's diagnostic signature. Two
    processes combine. Stool loss of chloride, sodium and potassium depletes each
    ion, producing hypochloremia, hyponatremia and hypokalemia. Separately, DRA
    normally secretes bicarbonate into the lumen in exchange for the chloride it
    absorbs; when the exchanger fails, that bicarbonate is retained in the body.
    Retained bicarbonate plus chloride depletion plus volume-contraction-driven
    secondary hyperaldosteronism produce a hypochloremic, hypokalemic metabolic
    ALKALOSIS. This is the mirror image of congenital sodium diarrhea, in which
    failure of sodium/proton exchange causes metabolic ACIDOSIS, and the acid-base
    direction is what distinguishes the two at the bedside.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Bicarbonate secretion into the intestinal lumen
    term:
      id: GO:0015701
      label: bicarbonate transport
    modifier: DECREASED

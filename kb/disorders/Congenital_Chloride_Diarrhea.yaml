      CLD.
    explanation: >-
      Supports genotyping as therapeutically informative, not merely
      confirmatory.
treatments:
- name: Oral Salt Substitution
  description: >-
    Lifelong oral sodium chloride and potassium chloride substitution is the
    life-saving mainstay of treatment. It replaces the ions lost in stool,
    restoring electrolyte balance and preventing metabolic alkalosis, and it
    transforms the prognosis of a disorder that is otherwise fatal. Its
    limitation is precise and important: it corrects the systemic consequences
    without acting on the intestinal transport defect, so stool volume is
    unchanged and the daily burden of diarrhea persists.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Systemic Electrolyte Depletion and Metabolic Alkalosis
    treatment_effect: INHIBITS
    description: >-
      Replacing chloride, sodium and potassium orally offsets fecal losses and
      prevents the electrolyte depletion and alkalosis, acting on the systemic
      arm only and leaving the luminal transport defect untouched.
    evidence:
    - reference: PMID:35127600
      reference_title: "Step-Up Approach for Sodium Butyrate Treatment in Children With Congenital Chloride Diarrhea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Oral salt substitutive therapy is a life-saving therapy: it improves the
        outcome, leads to electrolytes balance, reduces the risk of developing
        metabolic alkalosis, but has no effect on symptoms' severity
      explanation: >-
        States exactly the scope and the limit of this treatment: life-saving and
        electrolyte-normalising, but without effect on diarrhea severity - which
        is why it is modelled as acting on the systemic node rather than the
        central effector.
- name: Oral Sodium Butyrate
  description: >-
    Oral sodium butyrate is the only therapy that reduces diarrhea severity
    itself. It acts by two routes: a DRA-independent route in which butyrate
    uptake stimulates the alternative anion exchanger PAT-1 and the sodium/proton
    exchangers NHE2 and NHE3 while inhibiting NKCC1, and a DRA-dependent route in
    which it increases SLC26A3 transcription and translation and reduces DRA
    mistrafficking and misfolding. Efficacy is genotype-dependent, best in
    patients with missense and deletion variants - consistent with rescue of
    residual protein - and some patients experience worsening at the standard
    100 mg/kg/day dose. In those patients a step-up schedule from 50 mg/kg/day
    with weekly 25 mg/kg/day increments has restored responsiveness.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: butyrate
      term:
        id: CHEBI:17968
        label: butyrate
  target_mechanisms:
  - target: Loss of Apical DRA Chloride/Bicarbonate Exchange
    treatment_effect: ACTIVATES
    description: >-
      Butyrate increases SLC26A3 expression and reduces DRA mistrafficking and
      misfolding, partially restoring the failed apical exchange step, and in
      parallel stimulates alternative chloride-absorbing transporters.
    evidence:
    - reference: PMID:24350656
      reference_title: "Genotype-dependency of butyrate efficacy in children with congenital chloride diarrhea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The effect of butyrate is related in part on a different modulation of
        the expression of the two main apical membrane Cl- exchangers of
        epithelial cells, members of the SLC26 anion family.
      explanation: >-
        Attributes butyrate's effect to modulation of the two apical SLC26
        chloride exchangers, supporting action on the trigger node.
    - reference: PMID:24350656
      reference_title: "Genotype-dependency of butyrate efficacy in children with congenital chloride diarrhea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The best response was observed in subjects with missense and deletion
        mutations.
      explanation: >-
        Documents the genotype dependence of the response, consistent with rescue
        of residual mutant protein rather than replacement of an absent one.
  - target: Chloride-Rich Watery Diarrhea and Its Consequences
    treatment_effect: INHIBITS
    description: >-
      Clinically, butyrate reduces diarrhea severity, the effect that
      distinguishes it from salt substitution.
    evidence:
    - reference: PMID:35127600
      reference_title: "Step-Up Approach for Sodium Butyrate Treatment in Children With Congenital Chloride Diarrhea."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The step-up therapeutic approach resulted effective in limiting diarrhea
        severity in all our three previously unresponsive CLD patients.
      explanation: >-
        Reports reduction in diarrhea severity with the step-up butyrate
        schedule in patients previously unresponsive to standard dosing.

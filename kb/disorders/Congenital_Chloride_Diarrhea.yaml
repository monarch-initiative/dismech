- name: Luminal Chloride Retention and Failure of Intestinal Fluid Absorption
  conforms_to: "electrolyte_transport_related_diarrhea#Luminal Electrolyte Retention and Failure of Net Ion Absorption"
  description: >-
    The rate-limiting step. Chloride that cannot be absorbed accumulates in the
    ileal and colonic lumen as an osmotically active anion, obligating water
    retention and abolishing the net fluid absorption that normally occurs across
    the distal intestine. Because the failed step handles an ion rather than an
    ingested nutrient, luminal chloride load is set by secretion and diet-salt
    intake rather than by any single dietary constituent - which is why, unlike
    the diet-induced congenital diarrheas, the diarrhea cannot be abolished by
    eliminating a food. Fluid loss begins in fetal life, producing dilated fetal
    bowel loops and marked polyhydramnios.

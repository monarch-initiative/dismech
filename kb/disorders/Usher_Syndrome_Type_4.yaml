    explanation: Documents photophobia in a confirmed ARSG homozygote.

genetic:
- name: ARSG
  gene_term:
    preferred_term: ARSG
    term:
      id: hgnc:24102
      label: ARSG
  relationship_type: CAUSATIVE
  association: >-
    Biallelic ARSG variants cause Usher syndrome type 4. The allelic spectrum spans
    missense, nonsense and splice variants; every allele subjected to functional
    testing has shown complete loss of sulfatase activity, and some additionally fail
    to reach the lysosome. Two founder effects are apparent rather than one: p.D45Y
    accounts for the Yemenite Jewish families in which the disease was first delineated,
    and p.(Arg384Trp) recurs among subjects of Portuguese descent. The gene had been known
    as a lysosomal sulfatase from animal work for years before any human disease was
    attached to it.
  evidence:
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity for ARSG-p.D45Y in humans leads to protein dysfunction, causing
      an atypical combination of late-onset Usher syndrome."
    explanation: Establishes the causal gene-disease relationship.
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe nine new subjects and the clinical description of four cases
      with the USH IV phenotype bearing seven novel and two known pathogenic variants."
    explanation: Documents the widening allelic spectrum beyond the founder variant.
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "novel variant c.1150C>T, p.(Arg384Trp), also present in subjects 4, 5, and 6,
      all from Portuguese descent"
    explanation: >-
      Documents the second, Portuguese founder allele. No case fraction is curated from this,
      because the shared-descent grouping is described narratively rather than as a
      denominator-bearing cohort statistic.

diagnosis:
- name: Molecular Genetic Testing of ARSG
  description: >-
    Sequencing of ARSG establishes the diagnosis. Because the retinal phenotype can
    present as an apparently isolated inherited retinal disease years before hearing
    loss appears, ARSG belongs on retinal dystrophy gene panels and not only on Usher
    panels - testing keyed to a deaf-blindness presentation will miss patients during
    the interval when only the eye is affected.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, testing of ARSG should be considered for the genetic work-up of
      apparent isolated inherited retinal diseases."
    explanation: The cited authors' own recommendation for how ARSG testing should be deployed.

- name: Vestibular Function Testing
  description: >-
    Formal vestibular assessment. Its purpose here is to document an absence: preserved
    vestibular function is the finding that separates USH4 from USH1, where areflexia is
    characteristic. The entry asserts that sparing in its phenotype descriptions and
    differentials, so the test that establishes it belongs in the workup. No NCIT
    clinical-action term for vestibular function testing could be verified, so the term
    binding is omitted rather than approximated.
  diagnosis_term:
    preferred_term: vestibular function testing
  evidence:
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This distinct type of USH is characterized by late-onset RP with predominantly
      pericentral and macular changes, and late onset SNHL without vestibular dysfunction."
    explanation: >-
      Establishes preserved vestibular function as a defining feature, and therefore as
      something a workup must positively document.

- name: Arylsulfatase G Enzyme Activity Assay
  description: >-
    Functional confirmation that a variant abolishes sulfatase activity. This is the direct
    readout for the pathophysiology node above, and it is what turned a series of missense
    variants of uncertain significance into demonstrated nulls across the published
    cohorts. No suitable NCIT clinical-action term could be verified for a sulfatase
    activity assay, so the term binding is omitted.
  diagnosis_term:
    preferred_term: arylsulfatase G enzyme activity assay
  evidence:
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional experiments indicated a loss of sulfatase activity of the mutant
      proteins."
    explanation: Demonstrates the assay's use as functional confirmation of pathogenicity.

- name: Retinal Imaging and Electrophysiology
  description: >-
    Optical coherence tomography, fundus autofluorescence and electroretinography
    characterise the retinal disease. OCT shows loss of the outer retinal layers with
    relative foveal sparing early on; the ring of atrophy along the arcades is what makes
    the imaging phenotype suggestive enough to prompt ARSG testing in an apparently
    isolated retinal dystrophy.
  diagnosis_term:
    preferred_term: Optical Coherence Tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  evidence:
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OCT showed complete loss of the outer retinal layers."
    explanation: Documents optical coherence tomography findings in a molecularly confirmed subject.

treatments:
- name: Supportive Sensory Management
  description: >-
    No disease-modifying therapy exists for USH4. Management is sensory support -
    low-vision rehabilitation, hearing amplification and, where hearing loss is
    severe, cochlear implantation - together with genetic counselling. No treatment
    is curated with a target_mechanisms link because nothing available acts on any
    node of the mechanism above; recording a supportive measure as though it engaged
    the pathway would misrepresent it.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation

- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling, with the specific wrinkle that late onset means
    an affected individual has usually completed reproduction before diagnosis, and
    that ARSG carriers are ascertained through retinal disease rather than through
    deaf-blindness.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

differential_diagnoses:
- name: Usher syndrome types 1, 2 and 3
  description: >-
    The classical Usher types. Distinguished from USH4 by much earlier onset (first
    or second decade), by the genes involved (stereocilia and connecting-cilium
    proteins rather than a lysosomal sulfatase), and in type 1 by vestibular areflexia.
  distinguishing_features:
  - USH4 onset is in the fourth decade for both vision and hearing, versus the first or second decade in types 1-3
  - Vestibular function is preserved in USH4
  - The retinal atrophy is pericentral and macular rather than mid-peripheral
  evidence:
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This distinct type of USH is characterized by late-onset RP with predominantly
      pericentral and macular changes, and late onset SNHL without vestibular dysfunction."
    explanation: >-
      States the three features that separate USH4 from the classical types - late onset,
      pericentral/macular retinal distribution, and preserved vestibular function. The
      contrasting early-onset and vestibular-areflexia features of types 1-3 appear in this
      paper's introduction rather than its abstract, so they are stated as curator prose in
      distinguishing_features and are not attributed to a snippet here.

- name: Mucopolysaccharidosis type IIIE
  description: >-
    Not a mimic but a competing classification of the same molecular defect. Arsg-null
    mice accumulate heparan sulfate in brain and viscera and are designated MPS IIIE;
    whether human ARSG deficiency should carry that label instead of, or alongside,
    USH4 is actively debated. Humans do not show the somatic features of a
    mucopolysaccharidosis, which is the main argument against.
  distinguishing_features:
  - MPS IIIE has been described only in animal models, never established in humans
  - Human ARSG patients lack coarse facies, dysostosis multiplex and organomegaly
  - The human presentation is confined to retina and cochlea
  evidence:
  - reference: PMID:39202222
    reference_title: "Mucopolysaccharidosis Type IIIE: A Real Human Disease or a Diagnostic Pitfall?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This type of MPS, associated with pathogenic variants in the ARSG gene, has
      thus far been described only in the context of animal models. However, pathogenic
      variants in this gene also occur in humans, but are linked to a different disorder,
      Usher syndrome (USH) type IV, which is sparking increasing debate."
    explanation: States the nosological dispute and that MPS IIIE is so far animal-only.

- name: Isolated inherited retinal disease
  description: >-
    Because hearing loss can follow the retinal disease by a decade or more, USH4
    presents for a substantial period as a non-syndromic retinal dystrophy. This is
    the practical differential most likely to cause a missed diagnosis.
  distinguishing_features:
  - The pericentral ring of atrophy along the arcades is characteristic and should prompt ARSG testing
  - Hearing loss may not yet have developed at the time of retinal presentation
  evidence:
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings highlight that USH IV likely has been underdiagnosed and
      emphasize the need to test molecularly unresolved subjects with deafblindness syndrome."
    explanation: The authors' statement that the subtype is under-ascertained.

animal_models:
- name: Arsg knockout mouse
  species: Mouse
  genotype: Arsg-null
  publication: PMID:26975023
  description: >-
    The Arsg-null mouse is both the model on which the MPS IIIE designation rests and the
    best available model of the retinal disease. Systemically it stores heparan sulfate in
    central nervous system and viscera. In the retina it loses more than half its
    photoreceptors by 24 months, with reactive astrogliosis and an outer-retinal
    microgliosis - and, importantly, without any storage vacuoles. Its retinal arm matches
    the human disease closely; its systemic storage arm does not match it at all.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Progressive, quantified photoreceptor loss with reactive gliosis - the arm of the
      human disease this model reproduces well, and the reason it is the reference model
      for USH4 retinal degeneration rather than for the mucopolysaccharidosis it is named
      after.
    limitations: >-
      Onset and tempo are murine, and the mouse shows no storage vacuoles in the retina,
      so a therapy endpoint defined by clearing retinal storage would have nothing to
      measure in this model.
    readouts:
    - name: Photoreceptor cell number
      target: Photoreceptor Degeneration
      direction: DECREASED
      interpretation: Quantitative structural correlate of the photoreceptor degeneration node.
      evidence:
      - reference: PMID:26975023
        reference_title: "Degeneration of Photoreceptor Cells in Arylsulfatase G-Deficient Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Arsg knockout mice showed a progressive degeneration of photoreceptor cells
          starting between 1 and 6 months of age, resulting in the loss of more than 50% of
          photoreceptor cells in 24-month-old mice."
        explanation: Reports the quantified photoreceptor counts grounding this readout.
    evidence:
    - reference: PMID:26975023
      reference_title: "Degeneration of Photoreceptor Cells in Arylsulfatase G-Deficient Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To our knowledge, this is the first study demonstrating that ARSG deficiency
        results in progressive photoreceptor degeneration and dysregulation of various
        lysosomal proteins."
      explanation: >-
        Establishes this model as the primary demonstration that ARSG loss causes
        photoreceptor degeneration.
  - target: Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the enzymatic block and demonstrates that it causes lysosomal heparan
      sulfate storage - but at a severity and tissue distribution never observed in
      human ARSG deficiency.
    limitations: >-
      Storage is generalised, involving brain, liver and kidney, whereas humans with
      biallelic ARSG variants show no evidence of generalised lysosomal storage. Using
      the mouse to predict human systemic disease would therefore overstate the
      phenotype substantially.
    evidence:
    - reference: PMID:39202222
      reference_title: "Mucopolysaccharidosis Type IIIE: A Real Human Disease or a Diagnostic Pitfall?"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Arsg dysfunction and the deficiency of the corresponding enzyme led to
        HS accumulation in lysosomes"
      explanation: Establishes that the mouse model reproduces the lysosomal storage block.
    - reference: PMID:39202222
      reference_title: "Mucopolysaccharidosis Type IIIE: A Real Human Disease or a Diagnostic Pitfall?"
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "HS storage was evident in both CNS and somatic organs, like the liver and kidney"
      explanation: >-
        Documents the generalised distribution of storage in the mouse, which is the
        respect in which it diverges from the human disease.

- name: ARSG-mutant American Staffordshire Terrier
  species: Dog
  genotype: ARSG c.296G>A (p.R99H) homozygous
  publication: PMID:41295716
  description: >-
    A naturally occurring canine ARSG disease carrying p.R99H - the same substitution
    since found homozygous in a human patient. Dogs develop late-onset progressive
    ataxia, cerebellar atrophy, Purkinje cell loss and autofluorescent storage, and
    were proposed as a neuronal ceroid lipofuscinosis. Electroretinography has now
    shown that they also have rod and cone dysfunction, bringing the retinal arm into
    line with the human disease while the neurological arm remains unmatched.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Affected dogs showing ataxia had attenuated ERG amplitudes indicating rod and cone
      photoreceptor dysfunction, and autofluorescent inclusions were found in retinal
      pigment epithelium and ganglion cell layer.
    limitations: >-
      Retinal dysfunction in the dog was detected only alongside, and apparently not
      before, neurological signs, and the storage material is autofluorescent inclusion
      body rather than the human lesion, for which no retinal histopathology exists.
    readouts:
    - name: Electroretinogram amplitude
      target: Photoreceptor Degeneration
      direction: DECREASED
      interpretation: Functional correlate of rod and cone photoreceptor loss in the canine model.
      evidence:
      - reference: PMID:41295716
        reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Three affected dogs that were exhibiting signs of ataxia had attenuated
          electroretinogram (ERG) amplitudes indicative of rod and cone photoreceptor dysfunction"
        explanation: Reports the ERG measurement grounding this readout.
    evidence:
    - reference: PMID:41295716
      reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Autofluorescent inclusions were observed in the retinal pigment epithelium and
        retinal ganglion cell layer of two affected dogs that were euthanized due to
        neurological disease progression."
      explanation: Establishes retinal involvement in the canine model at the tissue level.
  - target: Late-Onset Deaf-Blindness
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The canine disease is dominated by progressive ataxia and cerebellar degeneration.
      The human disease has essentially no neurological component, and the defining human
      endpoint - combined late-onset visual and auditory loss - is not what the dogs
      present with.
    limitations: >-
      This is the sharpest available statement of the species divergence, because it is
      variant-matched: a human homozygous for the very same p.R99H allele that makes these
      dogs ataxic had no neurological signs at age 74. The dog therefore cannot be used
      to model the human clinical course, and a therapeutic endpoint validated in dogs
      (ataxia) has no human counterpart.
    evidence:
    - reference: PMID:41295716
      reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast to ASTs and mice with ARSG mutations, human patients generally do
        not exhibit neurological involvement, with the exception of two patients reported to
        have mild cerebellar atrophy without ataxia"
      explanation: >-
        States directly that the neurological phenotype of the canine and murine models is
        not reproduced in human patients.
    - reference: PMID:41295716
      reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Neither patient exhibited any neurologic signs as of age 74 (homozygous
        patient) and age 55 (heterozygous patient)."
      explanation: >-
        The variant-matched human observation: a p.R99H homozygote, same allele as the
        affected dogs, was neurologically normal at 74.

discussions:
- discussion_id: mismatch_arsg_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
  prompt: >-
    Why does the same enzymatic block produce generalised lysosomal storage with
    neurodegeneration in mouse and dog, but disease confined to retina and cochlea in
    humans - even for carriers of the identical p.R99H allele?
  rationale: >-
    This is not the usual model-fidelity caveat, where a model shows a milder or partial
    version of the human disease. Here the models show a substantially different and in
    some respects more severe disease, and the discrepancy is anchored at the level of a
    single shared variant. A human homozygous for p.R99H was neurologically intact at 74
    while dogs homozygous for the same substitution lose the ability to stand. Any
    explanation has to account for that: candidate reasons include species differences
    in heparan sulfate 3-O-sulfation load, redundancy from another sulfatase in humans,
    lifespan and cell-turnover differences, or simply that the human neurological
    phenotype is subclinical - the two reported patients with mild cerebellar atrophy
    but no ataxia are the only hint of the latter. Which is true determines whether human
    USH4 should be watched for late neurological decline, and whether the mouse and dog
    can serve as preclinical models for a therapy aimed at the human disease.
  proposed_experiments:
  - experiment_id: exp_arsg_neuroimaging_cohort
    name: Systematic neurological and cerebellar imaging of an ARSG cohort
    description: >-
      Prospectively image the cerebellum and perform standardised neurological
      examination across the reported ARSG cohort, stratified by age and genotype. Two
      patients with mild cerebellar atrophy without ataxia have been noted incidentally;
      only systematic assessment can establish whether subclinical cerebellar involvement
      is the rule and simply never reaches the threshold that ataxia in dogs does.
  - experiment_id: exp_arsg_substrate_load_comparison
    name: Cross-species quantification of 3-O-sulfated heparan sulfate substrate load
    description: >-
      Measure 3-O-sulfated heparan sulfate content and the activity of the other eight
      enzymes of the pathway in matched human, canine and murine tissues. If human
      neural tissue simply presents less of the ARSG-dependent substrate, or has greater
      redundancy at that step, the species divergence would be explained without invoking
      a difference in the enzyme itself.

- discussion_id: controversy_mps_iiie_versus_usher_iv
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
  prompt: >-
    Should human ARSG deficiency be classified as Usher syndrome type 4, as a thirteenth
    mucopolysaccharidosis (MPS IIIE), or as both?
  rationale: >-
    ARSG is unambiguously a lysosomal sulfatase acting in heparan sulfate degradation,
    which is the definitional criterion for a mucopolysaccharidosis, and the animal models
    store glycosaminoglycan exactly as an MPS should. Against that, the human phenotype
    has none of the somatic hallmarks of an MPS - no coarse facies, no dysostosis
    multiplex, no organomegaly - and human GAG accumulation has not been demonstrated. The
    disease was therefore named for what it looks like clinically rather than for the
    pathway it disrupts. This entry curates it as USH4, following MONDO and OMIM, while
    recording that the classification is contested rather than settled; the practical
    stake is whether these patients should be enrolled in MPS natural-history studies and
    offered MPS-directed therapies.
  proposed_experiments:
  - experiment_id: exp_human_gag_storage_assessment
    name: Direct assessment of glycosaminoglycan storage in ARSG-deficient humans
    description: >-
      Measure urinary and tissue glycosaminoglycans, and specifically 3-O-sulfated
      heparan sulfate species, in molecularly confirmed ARSG patients against matched
      controls. The MPS IIIE argument currently rests on the animal models plus the
      enzyme's known function; a direct negative result in humans would largely settle it,
      and a positive one would reopen the therapeutic question.

notes: >-
  Epidemiology. USH4 is ultra-rare and under-ascertained: roughly 31 cases had been
  reported by 2025, and the largest single addition - nine subjects in 2024 - increased
  the known total by more than 30%, which indicates how incomplete ascertainment remains.
  No population prevalence estimate exists for the subtype itself, so none is curated;
  the available figures are for Usher syndrome as a whole.

  No GeneReviews chapter exists for USH4 or ARSG. This was checked directly rather than
  assumed: a PubMed search for ARSG in GeneReviews returns nothing, and the two Usher
  GeneReviews chapters that do exist (PMID:20301442 and PMID:20301515) cover types I and
  II and contain no mention of ARSG, USH4 or type IV. The mandatory GeneReviews baseline
  therefore does not apply here, and neither chapter is cited, since quoting a type I or
  type II chapter in support of a type 4 claim would be evidence from the wrong disease.

  No frequency bands are assigned to any phenotype in this entry. With roughly 31 reported
  cases and no systematic cohort denominator, a band would imply a precision the literature
  does not have.

  The absence of vestibular dysfunction is diagnostically important and is stated in the
  descriptions and differentials, but is deliberately not curated as a phenotype: it is a
  negative finding, and the schema's phenotype list is for features that are present.


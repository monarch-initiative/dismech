name: Usher Syndrome Type 4
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
description: >-
  Usher syndrome type 4 (USH4, OMIM 618144) is an ultra-rare autosomal recessive
  deaf-blindness syndrome caused by biallelic loss-of-function variants in ARSG,
  which encodes the lysosomal sulfatase arylsulfatase G. ARSG removes 3-O-sulfate
  from glucosamine residues during the nine-enzyme lysosomal degradation of
  heparan sulfate, so USH4 is mechanistically a defect of glycosaminoglycan
  catabolism rather than of the stereocilia/photoreceptor-connecting-cilium
  machinery that underlies Usher types 1-3.

  Three features separate it clinically from the classical types: onset is
  strikingly late, typically in the fourth decade rather than in childhood; the
  retinal disease is pericentral and macular, with ring-shaped atrophy along the
  vascular arcades encircling the fovea; and vestibular function is spared. It
  was recognised only in 2018 and remains under-ascertained - a 2024 series that
  added nine subjects expanded the known case count by more than 30%.

  The gene's cross-species behaviour is the entry's central puzzle. Arsg-null
  mice accumulate heparan sulfate in brain, liver and kidney and are classified
  as mucopolysaccharidosis IIIE; ARSG-mutant dogs develop ataxia, cerebellar
  atrophy and autofluorescent storage and were proposed as a neuronal ceroid
  lipofuscinosis. Humans carrying the same lesions get neither. That divergence
  is curated here as a HUMAN_MODEL_MISMATCH and as an open nosological
  CONTROVERSY, not resolved in favour of either reading.
disease_term:
  preferred_term: Usher syndrome, type 4
  term:
    id: MONDO:0029141
    label: Usher syndrome, type 4
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    USH4 segregates as an autosomal recessive trait. Affected individuals are
    homozygous or compound heterozygous for ARSG variants; the first-described
    families carried a homozygous founder allele and were consanguineous or from
    a genetically isolated population.
  evidence:
  - reference: PMID:33300174
    reference_title: "New clinical and molecular evidence linking mutations in ARSG to Usher syndrome type IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified three novel pathogenic variants in ARSG, which segregated
      recessively with the disease in two families from Portugal"
    explanation: States recessive segregation of ARSG variants in two independent families.

pathophysiology:
- name: Biallelic ARSG Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous variants in ARSG (hgnc:24102) are the
    initiating lesion. Reported alleles include missense changes affecting the
    catalytic site, nonsense and splice alleles. The founder allele in the first
    families, c.133G>T (p.D45Y), alters a fully conserved residue of the enzyme's
    catalytic site.
  downstream:
  - target: Abolished Arylsulfatase G Sulfatase Activity
    causal_link_type: DIRECT
  - target: Failed Lysosomal Targeting with ER Retention
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous founder missense variant, c.133G>T (p.D45Y)
      in arylsulfatase G (ARSG)"
    explanation: Identifies the founding biallelic ARSG lesion.
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The identified variant affected a fully conserved amino acid that is
      part of the catalytic site of the enzyme."
    explanation: Locates the founder variant in the catalytic site, explaining loss of activity.

- name: Abolished Arylsulfatase G Sulfatase Activity
  biological_scale: MOLECULAR
  description: >-
    USH4 alleles tested functionally show complete loss of sulfatase activity, not
    a graded reduction. This has held across independently ascertained cohorts and
    across missense, nonsense and splice alleles, which is why the disease behaves
    as a clean enzyme-null state.
  molecular_functions:
  - preferred_term: arylsulfatase G sulfatase activity
    term:
      id: GO:0008484
      label: sulfuric ester hydrolase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis of the wild-type and mutant proteins showed no basal
      activity of p.D45Y."
    explanation: Direct demonstration that the founder allele abolishes enzyme activity.
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional experiments indicated the complete loss of sulfatase enzymatic
      activity upon ectopic expression of mutated ARSG cDNA."
    explanation: Confirms complete loss of activity across a further set of nine subjects' alleles.
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional experiments indicated a loss of sulfatase activity of the mutant
      proteins."
    explanation: Independent replication of the enzyme-null result in three unrelated subjects.

- name: Failed Lysosomal Targeting with ER Retention
  biological_scale: CELLULAR
  description: >-
    A second, parallel route to the same end point. Some pathogenic ARSG variants
    do not merely inactivate the enzyme in place - they prevent it reaching the
    lysosome at all, leaving the protein retained in the endoplasmic reticulum.
    Curated as its own node rather than folded into catalytic loss because it is a
    distinct molecular failure that would not be corrected by a strategy aimed
    only at restoring catalysis.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: protein localization to lysosome
    term:
      id: GO:0061462
      label: protein localization to lysosome
    modifier: DECREASED
  downstream:
  - target: Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33300174
    reference_title: "New clinical and molecular evidence linking mutations in ARSG to Usher syndrome type IV."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these pathogenic variants abolish the sulfatase activity of the Arylsulfatase
      G enzyme and impede the appropriate lysosomal localization of the protein product,
      which appears to be retained in the endoplasmic reticulum"
    explanation: >-
      Establishes mislocalization with ER retention as a mechanism accompanying
      catalytic loss for these alleles.

- name: Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
  biological_scale: CELLULAR
  description: >-
    ARSG catalyses one obligate step in the nine-enzyme lysosomal heparan sulfate
    degradation pathway: removal of 3-O-sulfate from glucosamine. Losing it stalls
    the sequential catabolic chain at that residue. In mouse and dog this produces
    frank, generalised storage; in humans no generalised storage phenotype has been
    demonstrated, which is why the downstream node here is confined to the retina
    and cochlea.
  biological_processes:
  - preferred_term: heparan sulfate proteoglycan catabolic process
    term:
      id: GO:0030200
      label: heparan sulfate proteoglycan catabolic process
    modifier: DECREASED
  downstream:
  - target: RPE-Restricted ARSG Loss
    causal_link_type: DIRECT
  - target: Cochlear Sensory Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34405855
    reference_title: "Decoding the consecutive lysosomal degradation of 3-O-sulfate containing heparan sulfate by Arylsulfatase G (ARSG)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Within this degradation pathway, Arylsulfatase G (ARSG) is critical for
      removing 3-O-sulfate from glucosamine, and mutations in ARSG are causative for
      Usher syndrome type IV."
    explanation: Defines the precise enzymatic step ARSG performs and links its loss to USH4.
  - reference: PMID:34405855
    reference_title: "Decoding the consecutive lysosomal degradation of 3-O-sulfate containing heparan sulfate by Arylsulfatase G (ARSG)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The lysosomal degradation of heparan sulfate is mediated by the concerted
      action of nine different enzymes."
    explanation: Establishes that ARSG acts within an obligate multi-enzyme sequential pathway.

- name: RPE-Restricted ARSG Loss
  biological_scale: CELLULAR
  description: >-
    In the retina, ARSG is not expressed where the disease is seen. In wild-type mouse
    retina the protein is detectable only in the retinal pigment epithelium, yet it is the
    photoreceptors that degenerate - so the photoreceptor loss is cell-non-autonomous,
    driven from the RPE.

    What the RPE does next is genuinely unresolved, and the two available species disagree.
    In Arsg-null mice the RPE is morphologically normal on electron microscopy and no
    storage vacuoles are found anywhere in the retina, which argues against a simple
    storage-crushes-the-RPE account. In ARSG-mutant dogs the RPE does accumulate
    autofluorescent storage bodies. The proposal that this perturbs the RPE-photoreceptor
    interactions required for photoreceptor maintenance is exactly that - the canine study
    states that the mechanism "remains to be elucidated". The node is therefore curated for
    what is established, the RPE-restricted site of action, with the downstream edge left
    as having unknown intermediates.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26975023
    reference_title: "Degeneration of Photoreceptor Cells in Arylsulfatase G-Deficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Of note, expression of ARSG protein in wild-type mice was detectable only in
      the RPE which, however, appeared morphologically unaffected in knockout mice at the
      electron microscopic level."
    explanation: >-
      Establishes both halves of this node: ARSG acts in the RPE rather than in
      photoreceptors, and the RPE nonetheless looks normal, so the mechanism is not simple
      RPE storage pathology.
  - reference: PMID:26975023
    reference_title: "Degeneration of Photoreceptor Cells in Arylsulfatase G-Deficient Mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Electron microscopic analyses of retinas revealed no evidence for the presence
      of storage vacuoles."
    explanation: >-
      Curated as PARTIAL because it is a negative finding that constrains the mechanism
      rather than supporting a positive one - it argues against storage-driven retinal
      degeneration in the mouse.
  - reference: PMID:41295716
    reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "the finding that the RPE of affected dogs accumulated autofluorescent storage
      bodies suggests that disease-related RPE pathology may alter the RPE–photoreceptor
      cell interactions that are necessary for maintaining normal photoreceptor cell
      functions"
    explanation: >-
      The canine counterpart, curated as PARTIAL because the same paragraph states the
      mechanism remains to be elucidated and because canine RPE storage is not seen in the
      mouse.

- name: Photoreceptor Degeneration
  biological_scale: CELLULAR
  description: >-
    Rod and cone photoreceptors degenerate, producing a rod-cone dystrophy. The
    intermediate steps between stalled heparan sulfate catabolism and photoreceptor
    death are not established in human tissue, so the incoming edge is curated as
    having unknown intermediates.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Pericentral and Macular Retinal Atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This subtype was assigned as \"USH IV\" with a late onset of RP and usually
      late-onset progressive SNHL without vestibular involvement."
    explanation: Establishes retinitis pigmentosa (rod-cone dystrophy) as the retinal phenotype of USH4.

- name: Pericentral and Macular Retinal Atrophy
  biological_scale: TISSUE
  description: >-
    The distinctive structural lesion of USH4: ring-shaped atrophy running along the
    vascular arcades and encircling the fovea, giving a ring scotoma. The pattern is
    pericentral and macular rather than the mid-peripheral bone-spicule pattern of
    typical retinitis pigmentosa, and it is specific enough that it can suggest ARSG
    testing in an apparently isolated retinal dystrophy.
  downstream:
  - target: Late-Onset Deaf-Blindness
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients shared a distinctive retinal phenotype with ring-shaped atrophy
      along the arcades engirdling the fovea, resulting in ring scotoma."
    explanation: Describes the characteristic retinal lesion in all five founding patients.
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This distinct type of USH is characterized by late-onset RP with predominantly
      pericentral and macular changes, and late onset SNHL without vestibular dysfunction."
    explanation: Independent confirmation of the pericentral/macular distribution.

- name: Cochlear Sensory Dysfunction
  biological_scale: TISSUE
  description: >-
    Progressive sensorineural hearing loss develops, typically after the retinal
    disease and usually in the fifth decade or later. Vestibular function is
    preserved - the labyrinth is spared even though the cochlea is not. No human
    cochlear histopathology is available for USH4, so the cell-type annotation
    below is the expected sensory target rather than a demonstrated site of injury.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  downstream:
  - target: Late-Onset Deaf-Blindness
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, patients developed moderate to severe sensorineural hearing loss."
    explanation: Establishes sensorineural hearing loss in the founding cohort.

- name: Late-Onset Deaf-Blindness
  biological_scale: ORGANISM
  description: >-
    The combined sensory endpoint. What distinguishes USH4 from every other Usher
    type is when it arrives: both the visual and the auditory loss begin around the
    fourth decade, rather than in the first or second as in types 1-3. A patient can
    therefore complete education and working life before either deficit declares
    itself.
  evidence:
  - reference: PMID:29300381
    reference_title: "A homozygous founder missense variant in arylsulfatase G abolishes its enzymatic activity causing atypical Usher syndrome in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both vision and hearing loss appeared around the age of 40 years."
    explanation: Establishes the late, near-simultaneous onset that defines the subtype.
  - reference: PMID:33300174
    reference_title: "New clinical and molecular evidence linking mutations in ARSG to Usher syndrome type IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probands were affected with retinitis pigmentosa and sensorineural hearing
      loss, generally with an onset of symptoms in their fourth decade of life."
    explanation: Independent replication of fourth-decade onset in Portuguese families.

phenotypes:
- category: Ophthalmological
  name: Rod-Cone Dystrophy
  description: >-
    Progressive rod-cone dystrophy (retinitis pigmentosa) with late onset. Present in
    essentially all reported subjects and usually the presenting problem.
  phenotype_term:
    preferred_term: Rod-cone dystrophy
    term:
      id: HP:0000510
      label: Rod-cone dystrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:41295716
    reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of these patients display hearing loss and rod-cone dystrophy."
    explanation: States rod-cone dystrophy as the dominant retinal phenotype across reported ARSG cases.

- category: Ophthalmological
  name: Pericentral Retinitis Pigmentosa
  description: >-
    The retinal degeneration is distributed pericentrally and at the macula, producing
    ring-shaped atrophy along the arcades rather than the mid-peripheral pattern of
    typical RP.
  phenotype_term:
    preferred_term: Pericentral retinitis pigmentosa
    term:
      id: HP:0007947
      label: Pericentral retinitis pigmentosa
  evidence:
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This distinct type of USH is characterized by late-onset RP with predominantly
      pericentral and macular changes, and late onset SNHL without vestibular dysfunction."
    explanation: Directly states the pericentral and macular distribution of the retinopathy.

- category: Ophthalmological
  name: Bone Spicule Pigmentation
  description: >-
    Intraretinal bone spicule pigmentation, distributed peripherally around the ring of
    atrophy and best seen nasally and superior to the optic disc - a different distribution
    from the mid-peripheral pattern of typical retinitis pigmentosa.
  phenotype_term:
    preferred_term: Intraretinal bone spicule pigmentation
    term:
      id: HP:0007737
      label: Spicular pigmentation of the retina
  evidence:
  - reference: PMID:35226187
    reference_title: "Usher syndrome type IV: clinically and molecularly confirmed by novel ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The retinal phenotype is characterized by a specific distribution of atrophy
      around the arcades, peripherally surrounded by intraretinal bone spicules best
      appreciated nasally and superior to the disc."
    explanation: Describes the bone spicule pigmentation and its characteristic distribution.

- category: Audiological
  name: Progressive Sensorineural Hearing Impairment
  description: >-
    Progressive sensorineural hearing loss, generally later in onset than the retinal
    disease and without vestibular involvement.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:39199020
    reference_title: "Expanding the genetic landscape of Usher syndrome type IV caused by pathogenic ARSG variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This subtype was assigned as \"USH IV\" with a late onset of RP and usually
      late-onset progressive SNHL without vestibular involvement."
    explanation: States the progressive, late-onset character of the hearing loss.

- category: Ophthalmological
  name: Nyctalopia
  description: >-
    Night blindness, the usual first symptom of the rod-predominant phase, reported
    from the early forties in a molecularly confirmed homozygote.
  phenotype_term:
    preferred_term: Nyctalopia
    term:
      id: HP:0000662
      label: Nyctalopia
  evidence:
  - reference: PMID:41295716
    reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous p.R99H patient reported night blindness and photophobia
      starting in his early 40s and progressive hearing loss starting in his 50s."
    explanation: Documents night blindness with age of onset in a confirmed ARSG homozygote.

- category: Ophthalmological
  name: Photophobia
  description: Photophobia reported alongside night blindness in the fourth decade.
  phenotype_term:
    preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:41295716
    reference_title: "Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset Neurodegenerative Disease Associated with an ARSG Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous p.R99H patient reported night blindness and photophobia

name: Infective Endocarditis
creation_date: "2026-08-10T00:20:00Z"
category: Infectious
disease_term:
  preferred_term: infective endocarditis
  term:
    id: MONDO:0000565
    label: infective endocarditis
description: >
  Microbial infection of the endocardial surface, characteristically of a valve, producing a
  vegetation of fibrin, platelets, and organisms. The disease is best understood as an infection
  that requires a thrombus first. A sterile platelet-fibrin clot forms on injured endothelium and
  only then is seeded from the bloodstream, which is why the organism alone is not sufficient and
  why the anatomical substrate matters as much as the bacteraemia. That same fibrin scaffold then
  shields the organisms from phagocytes and from antibiotic penetration, which is why treatment
  takes weeks rather than days and why surgery is sometimes the only option.
parents:
- endocardial disease
- bacterial infectious disease

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Curated under cardiovascular disease because the lesion, its haemodynamic consequences, and
      its surgical management are cardiac. It is equally an infectious disease, and the
      antimicrobial half of its management follows infectious disease logic rather than cardiac
      logic.

has_subtypes:
- name: Left-sided native valve
  display_name: Left-sided native valve endocarditis
  description: >
    The commonest form, affecting mitral and aortic valves on a previously abnormal or normal
    valve. It carries the embolic stroke risk, because vegetation fragments enter the systemic
    circulation, and it is the population in which oral step-down therapy was tested.
- name: Right-sided
  display_name: Right-sided endocarditis, typically tricuspid
  description: >
    Strongly associated with injection drug use, and mechanistically distinct in a way the entry's
    own prose already argued. It commonly occurs on a structurally normal valve, embolises to the
    lungs rather than the brain, and generally carries a better prognosis with medical therapy
    alone. Modelling it as a subtype rather than a variant reflects that the differences are in
    substrate, embolic destination, and outcome together.
- name: Prosthetic valve
  display_name: Prosthetic valve endocarditis
  description: >
    Infection on implanted material, where biofilm on a foreign surface makes medical cure less
    likely and perivalvular extension more common. Prosthetic involvement is an independent
    predictor of in-hospital death.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prosthetic valve involvement (odds ratio, 1.47; 95% confidence interval, 1.13-1.90)"
    explanation: Quantifies prosthetic involvement as an independent predictor of in-hospital mortality with a confidence interval.

infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >
    Now the most common cause, displacing the streptococci of the older literature. It matters
    mechanistically and not just epidemiologically: it binds host matrix proteins efficiently,
    forms biofilm readily, and can affect structurally normal valves, which is the observation that
    strains the otherwise clean thrombus-first model curated in this entry.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staphylococcus aureus was the most common pathogen (31.2%)."
    explanation: Quantifies its share in a prospective cohort of 2781 patients across 25 countries.

- name: Streptococcus sanguinis
  infectious_agent_term:
    preferred_term: Streptococcus sanguinis
    term:
      id: NCBITaxon:1305
      label: Streptococcus sanguinis
  description: >
    Representative of the viridans group streptococci, the classical cause of subacute disease
    seeded from the oral cavity. This is the organism group behind the dental prophylaxis argument
    curated as a controversy in this entry.

- name: Enterococcus faecalis
  infectious_agent_term:
    preferred_term: Enterococcus faecalis
    term:
      id: NCBITaxon:1351
      label: Enterococcus faecalis
  description: >
    A growing cause, particularly in older patients and after genitourinary or gastrointestinal
    procedures, and one of the four organism groups for which oral step-down therapy was tested.

pathophysiology:
- name: Endothelial injury and sterile thrombus formation
  biological_scale: TISSUE
  conforms_to: "thrombogenesis#Platelet Adhesion, Activation, and Aggregation"
  description: >
    Turbulent flow across an abnormal valve, mechanical irritation from a catheter or prosthetic
    material, or inflammatory injury exposes subendothelial matrix. Platelets adhere and the
    coagulation cascade activates, producing a sterile fibrin-platelet thrombus known as
    non-bacterial thrombotic endocarditis. This step is entirely non-infectious, and it is the
    reason a structurally abnormal valve is a risk factor for an infectious disease.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: INCREASED
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  locations:
  - preferred_term: endocardium
    term:
      id: UBERON:0002165
      label: endocardium
  evidence:
  - reference: PMID:40422904
    reference_title: Staphylococcus aureus Endocarditis Immunothrombosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "cardiac damage results in the unveiling of the subendothelial matrix and the accumulation of von Willebrand factor (VWF) and fibrin, thereby enabling Staphylococcus aureus to bind directly to the valve leaflets"
    explanation: >
      Describes the sequence this node asserts — injury exposes subendothelial matrix, on which a
      fibrin-rich thrombus accumulates and becomes the substrate for organisms to bind.
  downstream:
  - target: Microbial adherence to the sterile thrombus
    causal_link_type: DIRECT
    description: >
      The fibrin-platelet surface provides the binding substrate that circulating organisms
      require in order to establish infection.

- name: Transient bacteraemia
  biological_scale: ORGANISM
  description: >
    Organisms enter the bloodstream from dental or mucosal manipulation, injection drug use,
    intravascular catheters, or gut translocation. Bacteraemia is common and endocarditis is rare,
    which is the observation that makes the sterile thrombus a necessary condition rather than an
    incidental finding, and which undermines the intuitive case for antibiotic prophylaxis before
    dental procedures.
  downstream:
  - target: Microbial adherence to the sterile thrombus
    causal_link_type: DIRECT
    description: >
      Circulating organisms must be present at the same time as a receptive surface.

- name: Microbial adherence to the sterile thrombus
  biological_scale: MOLECULAR
  description: >
    Organisms bind the thrombus through surface adhesins that recognise host matrix proteins,
    principally fibrinogen and fibronectin. Staphylococcus aureus is particularly effective at
    this and is now the leading cause in much of the world, displacing the streptococci of the
    older literature.
  biological_processes:
  - preferred_term: cell adhesion involved in biofilm formation
    term:
      id: GO:0043708
      label: cell adhesion involved in biofilm formation
    modifier: INCREASED
  downstream:
  - target: Vegetation maturation with biofilm-like protection
    causal_link_type: DIRECT
    description: >
      Adherent organisms proliferate within the fibrin matrix rather than being cleared.
  evidence:
  - reference: PMID:40422904
    reference_title: "Staphylococcus aureus Endocarditis Immunothrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have indicated a shift in the predominant pathogens of concern, with Streptococcus sp. a being superseded by Staphylococcus sp. and Enterococcus sp. as the leading causes of concern."
    explanation: Documents the shift in causative organism, which matters mechanistically because the newer dominant organism binds and persists differently from the streptococci it displaced.

- name: Vegetation maturation with biofilm-like protection
  biological_scale: TISSUE
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  description: >
    Continued platelet and fibrin recruitment builds a friable mass of fibrin, platelets,
    inflammatory cells, and dense microbial colonies. The scaffold physically excludes phagocytes
    and impedes antibiotic penetration, so organisms persist at high density in a site the immune
    system cannot reach. This is the single fact that governs treatment: it is why therapy is
    measured in weeks, why bactericidal agents are required, and why a sufficiently established
    vegetation may not be curable without excising it.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: endocardium
    term:
      id: UBERON:0002165
      label: endocardium
  downstream:
  - target: Local valvular and perivalvular destruction
    causal_link_type: DIRECT
    description: >
      Ongoing infection at the valve destroys the tissue it sits on.
  - target: Systemic embolization of vegetation fragments
    causal_link_type: DIRECT
    description: >
      The vegetation is friable and fragments detach into the circulation.
  - target: Innate immune activation and systemic inflammatory response
    causal_link_type: DIRECT
    description: >
      Persistent high-density infection drives a sustained systemic inflammatory response.
  evidence:
  - reference: PMID:40422904
    reference_title: "Staphylococcus aureus Endocarditis Immunothrombosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This shift is of concern as it is associated with Staphylococcus Aureus which has a high virulence rate and a tendency to form a biofilm, meaning that non-surgical therapy may not be effective."
    explanation: States both the biofilm behaviour this node describes and its therapeutic consequence, namely that medical therapy alone may fail, which is the claim that justifies curating surgery as a mechanism-directed treatment rather than a last resort.

- name: Innate immune activation and systemic inflammatory response
  biological_scale: CELLULAR
  description: >
    Pathogen-associated molecular patterns engage pattern recognition receptors on monocytes and
    endothelium, driving cytokine release and inflammasome activation. This produces the fever and
    systemic features, and contributes to the immune complex phenomena seen in skin, retina, and
    kidney.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:40422904
    reference_title: Staphylococcus aureus Endocarditis Immunothrombosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Infective endocarditis is a good example of immunothrombosis, where the coagulation system, innate immunity and the function of coagulation in isolating and eliminating pathogens interact."
    explanation: >
      Places innate immune activation at the centre of this disease's pathogenesis rather than
      treating it as a bystander response, which is what this node asserts.

- name: Local valvular and perivalvular destruction
  biological_scale: TISSUE
  description: >
    Leaflet perforation and chordal rupture produce acute regurgitation. Extension beyond the
    annulus produces abscess, pseudoaneurysm, or fistula, and involvement of the conduction system
    produces heart block. Acute regurgitation is poorly tolerated because the ventricle has had no
    time to remodel, which is why this disease can decompensate over hours.
  downstream:
  - target: Heart failure and haemodynamic decompensation
    causal_link_type: DIRECT
    description: >
      Acute valvular incompetence imposes a sudden volume load on an unprepared ventricle.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following complications were common: stroke (16.9%), embolization other than stroke (22.6%), heart failure (32.3%), and intracardiac abscess (14.4%)."
    explanation: >
      Intracardiac abscess in 14.4% of a 2781-patient international cohort is perivalvular
      extension beyond the leaflet, which is the destructive process this node describes.

- name: Systemic embolization of vegetation fragments
  biological_scale: ORGANISM
  conforms_to: "thrombogenesis#Thrombotic Vascular Occlusion and Ischemic Tissue Injury"
  description: >
    Conformance here needs justifying, because the thrombogenesis module explicitly excludes
    nonthrombotic emboli. The claim is that a septic vegetation is not a nonthrombotic embolus. It
    is a fibrin-platelet thrombus with organisms in it, formed by the same platelet and coagulation
    machinery the module models, and the vascular occlusion and downstream ischaemic injury it
    causes are thrombotic in exactly the module's sense. The infection changes what is inside the
    thrombus and adds a septic dimension to the resulting infarct; it does not change the
    occlusive mechanism. Fragments embolise to brain, spleen, kidneys, and extremities, producing
    stroke, infarction,
    mycotic aneurysm, and peripheral lesions. Embolic stroke is both a major cause of morbidity
    and a complication that constrains surgery, since anticoagulation and cardiopulmonary bypass
    carry haemorrhagic risk in a recently infarcted brain.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following complications were common: stroke (16.9%), embolization other than stroke (22.6%), heart failure (32.3%), and intracardiac abscess (14.4%)."
    explanation: >
      Stroke in 16.9% and non-stroke embolization in 22.6% of a 2781-patient international cohort
      quantify the systemic embolic burden this node asserts.
  downstream:
  - target: Heart failure and haemodynamic decompensation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Systemic embolic and septic injury compounds cardiac decompensation.

- name: Heart failure and haemodynamic decompensation
  biological_scale: ORGANISM
  description: >
    The terminal common pathway and the dominant determinant of early mortality, arising from
    acute regurgitation, myocardial abscess, conduction disturbance, and sepsis together.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prospective cohort study of 2781 adults with definite IE who were admitted to 58 hospitals in 25 countries from June 1, 2000, through September 1, 2005."
    explanation: Establishes the scale and international scope of the cohort that characterises modern outcomes in this disease.

phenotypes:
- category: Clinical
  name: Fever
  description: >
    The most common presenting feature, arising from the systemic inflammatory response to
    persistent high-density infection.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever

- category: Clinical
  name: Heart murmur
  description: >
    Reflects valvular regurgitation from leaflet destruction. A new or changing murmur in a febrile
    patient is the classic combination that should raise the diagnosis.
  phenotype_term:
    preferred_term: Heart murmur
    term:
      id: HP:0030148
      label: Heart murmur

- category: Clinical
  name: Congestive heart failure
  description: >
    Usually from acute valvular regurgitation, and the dominant predictor of early mortality.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  frequency: FREQUENT
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following complications were common: stroke (16.9%), embolization other than stroke (22.6%), heart failure (32.3%), and intracardiac abscess (14.4%)."
    explanation: Gives heart failure at 32.3 percent, which sits in the FREQUENT band of 30 to 79 percent.

- category: Clinical
  name: Stroke
  description: >
    Embolic, from vegetation fragments reaching the cerebral circulation. It is among the most
    consequential complications because it also complicates the decision to operate.
  phenotype_term:
    preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following complications were common: stroke (16.9%), embolization other than stroke (22.6%), heart failure (32.3%), and intracardiac abscess (14.4%)."
    explanation: Gives stroke at 16.9 percent, which sits in the OCCASIONAL band of 5 to 29 percent.

- category: Clinical
  name: Splenomegaly
  description: >
    A classic finding of subacute disease, reflecting chronic immune stimulation and splenic
    embolic involvement.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly

- category: Laboratory
  name: Haematuria
  description: >
    From renal embolic infarction or from immune complex glomerulonephritis, which are two
    different mechanisms producing the same finding.
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria

- category: Clinical
  name: Intracardiac abscess
  description: >
    Perivalvular extension of infection beyond the annulus, which is both a marker of uncontrolled
    infection and an indication for surgery. It is also a strong independent predictor of death.
  phenotype_term:
    preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following complications were common: stroke (16.9%), embolization other than stroke (22.6%), heart failure (32.3%), and intracardiac abscess (14.4%)."
    explanation: Gives intracardiac abscess at 14.4 percent, in the OCCASIONAL band. The phenotype is bound to a general cardiac morphology term because HPO has no perivalvular abscess concept.

- category: Clinical
  name: Mitral regurgitation
  description: >
    Acute regurgitation from leaflet perforation or chordal rupture, poorly tolerated because the
    ventricle and atrium have not had time to adapt.
  phenotype_term:
    preferred_term: Mitral regurgitation
    term:
      id: HP:0001653
      label: Mitral regurgitation

- category: Clinical
  name: Aortic regurgitation
  description: >
    The aortic equivalent, and the lesion most likely to precipitate rapid decompensation.
  phenotype_term:
    preferred_term: Aortic regurgitation
    term:
      id: HP:0001659
      label: Aortic regurgitation

environmental:
- name: Injection drug use
  exposure_term:
    preferred_term: injection drug use
    term:
      id: ECTO:6000007
      label: exposure to substance abuse
  description: >
    A major and growing route of entry, and the one that most changes the shape of the disease.
    It delivers organisms, predominantly Staphylococcus aureus, directly and repeatedly into the
    venous circulation, which is why it characteristically produces right-sided tricuspid disease
    in a structurally normal heart, unlike almost every other form of this illness.
  evidence:
  - reference: PMID:26700022
    reference_title: "A Retrospective Review: Significance of Vegetation Size in Injection Drug Users with Right-Sided Infective Endocarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the remaining 40 evaluable medically treated patients (median age 28, range 20-55), 37 (93%) cultured methicillin-sensitive S. aureus and all had tricuspid valve involvement."
    explanation: >
      A consecutive series of injection drug users with native-valve endocarditis in which
      essentially every case was tricuspid and almost every case was S. aureus, which is the
      organism-and-valve pattern this exposure entry claims injection drug use produces.
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although intravenous drug use remains important (10%), the most common predisposing conditions were related to valvular heart disease."
    explanation: >
      A 2781-patient international cohort confirms injection drug use as a predisposing exposure
      but puts it at 10% of cases, so it supports the exposure while qualifying the entry's
      "major and growing" framing, which holds regionally rather than worldwide.
  influences_mechanisms:
  - target: Transient bacteraemia
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      Repeated non-sterile injection introduces organisms directly into the bloodstream.
    evidence:
    - reference: PMID:26700022
      reference_title: "A Retrospective Review: Significance of Vegetation Size in Injection Drug Users with Right-Sided Infective Endocarditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the remaining 40 evaluable medically treated patients (median age 28, range 20-55), 37 (93%) cultured methicillin-sensitive S. aureus and all had tricuspid valve involvement."
      explanation: >
        Right-sided, skin-flora disease in a young cohort is the signature of organisms entering
        the venous circulation directly, which is the bacteraemia step this edge asserts.
  notes: >
    ECTO:6000007 (exposure to substance abuse) is the closest available term and is bound as an
    approximation only. The exposure hierarchy has no term expressing injection drug use as a
    route of microbial entry, so the bound term asserts the pharmacological/behavioural exposure
    rather than the microbiological one that actually matters here.

- name: Intravascular catheters and prosthetic material
  description: >
    Healthcare-associated disease is now a substantial share of cases. Indwelling catheters,
    prosthetic valves, and cardiac implantable devices supply both the endothelial injury and the
    portal of entry, which is why the epidemiology has shifted with the increasing use of these
    devices in an ageing population.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent health care exposure was found in one-quarter of patients."
    explanation: >
      Quantifies the entry's claim that healthcare contact — the setting in which indwelling
      catheters, prosthetic valves, and cardiac devices are placed — accounts for a substantial
      share of contemporary cases.
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic intravenous access was as common as intravenous drug use in the overall cohort"
    explanation: >
      Places indwelling intravascular access on the same footing as injection drug use as a
      predisposing exposure, which is why this entry is curated separately rather than as a
      footnote to the healthcare-associated epidemiology.
  influences_mechanisms:
  - target: Endothelial injury and sterile thrombus formation
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >
      Mechanical irritation from intravascular material injures endothelium and provides a
      non-endothelialised surface on which thrombus forms.
    evidence:
    - reference: PMID:31941729
      reference_title: "Infective endocarditis: A contemporary update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With an ageing population and increasing use of implantable cardiac devices and heart valves, the epidemiology of IE has changed."
      explanation: States that device use and population ageing have changed who gets this disease, which is the claim this exposure entry makes.
  notes: >
    No ECTO term is bound, for the same reason as the injection drug use entry.

treatments:
- name: Prolonged intravenous antibiotic therapy
  description: >
    Bactericidal antibiotics for four to six weeks, the duration being dictated by the biofilm
    protection of the vegetation rather than by the organism's intrinsic susceptibility. This is
    the definitional treatment of the disease and the reason it carries such a burden of
    hospitalisation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Vegetation maturation with biofilm-like protection
    treatment_effect: INHIBITS
    description: >
      Sustained bactericidal exposure is required to sterilise organisms shielded within the
      fibrin scaffold.
    evidence:
    - reference: PMID:30152252
      reference_title: "Partial Oral versus Intravenous Antibiotic Treatment of Endocarditis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with infective endocarditis on the left side of the heart are typically treated with intravenous antibiotic agents for up to 6 weeks."
      explanation: States the standard of care that this treatment represents, and the duration that the biofilm mechanism accounts for.

- name: Partial oral antibiotic therapy after stabilisation
  description: >
    A step-down to oral antibiotics once the patient is stable, tested against continued
    intravenous therapy in a randomised noninferiority trial. It is curated because it changes the
    practical shape of the illness rather than its biology, converting weeks of hospitalisation
    into outpatient treatment for suitable patients. It applies to stabilised left-sided disease
    caused by specific organisms, not to everyone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Vegetation maturation with biofilm-like protection
    treatment_effect: INHIBITS
    description: >
      The antimicrobial target is unchanged; only the route and setting differ.
  evidence:
  - reference: PMID:30152252
    reference_title: "Partial Oral versus Intravenous Antibiotic Treatment of Endocarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a randomized, noninferiority, multicenter trial, we assigned 400 adults in stable condition who had endocarditis on the left side of the heart caused by streptococcus, Enterococcus faecalis, Staphylococcus aureus, or coagulase-negative staphylococci and who were being treated with intravenous antibiotics to continue intravenous treatment (199 patients) or to switch to oral antibiotic treatment (201 patients)."
    explanation: Describes the trial design and its eligibility restrictions, namely stabilised left-sided disease caused by four named organism groups, which is what bounds how far this result generalises.

- name: Valve surgery
  description: >
    Excision of infected tissue with valve repair or replacement, indicated for heart failure,
    uncontrolled infection, abscess, or a high embolic risk. Surgery is curated here as
    mechanism-directed rather than as rescue, because removing the vegetation removes the
    protected compartment that antibiotics cannot reliably reach. Timing is genuinely difficult
    when embolic stroke has already occurred, since bypass and anticoagulation carry haemorrhagic
    risk in a recently infarcted brain.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Vegetation maturation with biofilm-like protection
    treatment_effect: BYPASSES
    description: >
      Excision physically removes the biofilm-protected compartment rather than attempting to
      penetrate it.
    evidence:
    - reference: PMID:40422904
      reference_title: "Staphylococcus aureus Endocarditis Immunothrombosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "which has a high virulence rate and a tendency to form a biofilm, meaning that non-surgical therapy may not be effective"
      explanation: States that biofilm formation can make medical therapy ineffective, which is the mechanistic rationale for surgery acting where antibiotics cannot.
  - target: Local valvular and perivalvular destruction
    treatment_effect: BYPASSES
    description: >
      Repair or replacement restores valve competence after the tissue has been destroyed.
  evidence:
  - reference: PMID:31832353
    reference_title: "Current AATS guidelines on surgical treatment of infective endocarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical scenarios in IE are often complex, requiring prompt diagnosis, early institution of antibiotics, and decision-making related to complications, including risk of embolism and timing of surgery when indicated."
    explanation: States the surgical decision problem this treatment sits inside, and names embolic risk and timing as the factors that govern it, which is the judgement the entry describes.
  - reference: PMID:31832353
    reference_title: "Current AATS guidelines on surgical treatment of infective endocarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The importance of an early, multispecialty team approach to patients with IE is emphasized."
    explanation: Records the guideline emphasis on team-based decision-making, which is the practical answer to a timing question that no single specialty can resolve alone.

- name: Antibiotic prophylaxis before dental procedures
  description: >
    Given to high-risk patients before certain dental procedures on the reasoning that procedural
    bacteraemia seeds the valve. The evidence for it is weak, and this treatment is curated
    principally to record that. The mechanistic case is intuitive and the empirical case is not
    established, and the discrepancy is instructive rather than embarrassing, because everyday
    bacteraemia from chewing and brushing plausibly dwarfs the procedural contribution.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Transient bacteraemia
    treatment_effect: INHIBITS
    description: >
      Prophylaxis aims to suppress procedural bacteraemia before it can seed a receptive surface.
    evidence:
    - reference: PMID:28213367
      reference_title: "Antibiotic prophylaxis for infective endocarditis: a systematic review and meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The evidence base for the use of AP is limited, heterogeneous and the methodological quality of many studies is poor. Postprocedural bacteraemia is not a good surrogate endpoint for IE."
      explanation: PARTIAL, and deliberately so. It does not refute the practice but establishes that the evidence cannot support it, and it specifically undermines the surrogate endpoint on which the mechanistic argument rests.
  evidence:
  - reference: PMID:28213367
    reference_title: "Antibiotic prophylaxis for infective endocarditis: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the logistical challenges of a randomised trial, high-quality case-control studies would help to evaluate the role of dental procedures in causing IE and the efficacy of AP in its prevention."
    explanation: PARTIAL. The authors' own statement that the question remains open and that a randomised trial is impractical, which is why this is likely to stay unresolved.

diagnosis:
- name: Duke-ISCVID criteria
  description: >
    The 2023 revision of the Duke criteria, combining microbiological, imaging, and clinical
    findings. Successive revisions have broadened the imaging component and the accepted organism
    list, reflecting both better imaging and the shift in causative organisms.
  evidence:
  - reference: PMID:37138445
    reference_title: "The 2023 Duke-International Society for Cardiovascular Infectious Diseases Criteria for Infective Endocarditis: Updating the Modified Duke Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting 2023 Duke-ISCVID IE Criteria propose significant changes, including new microbiology diagnostics (enzyme immunoassay for Bartonella species, polymerase chain reaction, amplicon/metagenomic sequencing, in situ hybridization), imaging (positron emission computed tomography with 18F-fluorodeoxyglucose, cardiac computed tomography), and inclusion of intraoperative inspection as a new Major Clinical Criterion."
    explanation: Enumerates the substantive changes in the 2023 revision, including the imaging modalities and molecular microbiology that were added, which is what makes this a revision rather than a restatement.

- name: Blood cultures
  description: >
    Multiple sets before antibiotics. The continuous nature of the bacteraemia, which follows from
    organisms proliferating on an intravascular surface, is what makes cultures drawn at any time
    informative and is itself a diagnostic clue.

- name: Echocardiography
  description: >
    Transthoracic and, where suspicion persists, transoesophageal imaging to demonstrate the
    vegetation, valvular destruction, and perivalvular extension. Transoesophageal imaging is
    substantially more sensitive, particularly for prosthetic valves and abscess.

progression:
- phase: Acute presentation
  notes: >
    Staphylococcus aureus disease presents over days with high fever, rapid valve destruction, and
    early embolic complications. Most patients in contemporary cohorts present early rather than
    with the classical indolent illness.
  evidence:
  - reference: PMID:19273776
    reference_title: "Clinical presentation, etiology, and outcome of infective endocarditis in the 21st century: the International Collaboration on Endocarditis-Prospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients (77.0%) presented early in the disease (<30 days) with few of the classic clinical hallmarks of IE."
    explanation: Quantifies early presentation as the norm in the modern cohort and states that the classic hallmarks are usually absent, which is a direct departure from the textbook subacute description.

- phase: Subacute presentation
  notes: >
    Viridans streptococcal and enterococcal disease can evolve over weeks to months with low-grade
    fever, weight loss, and immune phenomena, the classical picture from which the older
    descriptions of this disease derive.

- phase: Complication and decompensation
  notes: >
    Heart failure from acute regurgitation, embolic stroke, perivalvular abscess with heart block,
    and sepsis. This is the phase in which the decision to operate is usually made, and in which
    the competing risks of operating and of waiting are hardest to weigh.

prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  notes: >
    A rare disease with high mortality. The class here is coarse because no cited source in this
    entry states a rate.
  evidence:
  - reference: PMID:31941729
    reference_title: "Infective endocarditis: A contemporary update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Infective endocarditis (IE) remains a rare condition but one with high associated morbidity and mortality."
    explanation: PARTIAL. Establishes rarity and severity but states no rate, so the class is coarse and no numeric figure is asserted.

differential_diagnoses:
- name: Rheumatic heart disease
  description: >
    The essential distinction, and it runs both ways. Rheumatic disease is a post-infectious
    autoimmune sequela in which the organism is absent from the valve, whereas this is an active
    infection of it. They are also linked, since a rheumatic valve is exactly the kind of abnormal
    surface on which this disease establishes itself.
- name: Non-bacterial thrombotic endocarditis
  description: >
    Not merely a differential but the precursor lesion of this disease. Sterile vegetations occur
    in malignancy and antiphospholipid syndrome and are indistinguishable on imaging; the
    distinction is microbiological.
- name: Systemic lupus erythematosus with Libman-Sacks endocarditis
  description: >
    Produces sterile valvular vegetations with fever and multisystem features, and can be
    clinically indistinguishable without negative blood cultures and serology.

discussions:
- discussion_id: prophylaxis_mechanism_evidence_gap
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Should antibiotic prophylaxis be given before dental procedures, when the mechanism is
    plausible but the evidence does not support it and a definitive trial is impractical?
  rationale: >
    The mechanistic argument is straightforward. Dental procedures cause bacteraemia, bacteraemia
    seeds a receptive endocardial surface, so suppressing the bacteraemia should prevent the
    disease. Practice guidelines have progressively narrowed the indication anyway, because the
    evidence never supported the inference. A systematic review found the evidence base limited and
    heterogeneous and, more damagingly, concluded that post-procedural bacteraemia is not a good
    surrogate for the disease, which removes the empirical link the mechanistic argument depends
    on. The plausible explanation is that cumulative everyday bacteraemia from chewing and tooth
    brushing dwarfs the procedural contribution, in which case prophylaxis targets a negligible
    fraction of exposure. This entry curates the practice with its own contradicting evidence
    attached rather than omitting it, because omission would leave the mechanistic argument
    looking unopposed. The question is unlikely to be settled, since the authors themselves note
    that a randomised trial is logistically impractical for so rare an outcome.
  attaches_to:
  - pathophysiology#Transient bacteraemia
  - treatments#Antibiotic prophylaxis before dental procedures
  evidence:
  - reference: PMID:28213367
    reference_title: "Antibiotic prophylaxis for infective endocarditis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The evidence base for the use of AP is limited, heterogeneous and the methodological quality of many studies is poor. Postprocedural bacteraemia is not a good surrogate endpoint for IE."
    explanation: Establishes both that the direct evidence is inadequate and that the surrogate endpoint underpinning the mechanistic case is invalid.
  - reference: PMID:28213367
    reference_title: "Antibiotic prophylaxis for infective endocarditis: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the logistical challenges of a randomised trial, high-quality case-control studies would help to evaluate the role of dental procedures in causing IE and the efficacy of AP in its prevention."
    explanation: PARTIAL. States why the question is likely to remain open and what design could still address it, which is what makes this a standing controversy rather than a resolved negative.
  proposed_experiments:
  - experiment_id: exp_ie_prophylaxis_case_control
    name: Large linked-records case-control study of dental procedures and subsequent infective endocarditis
    description: >-
      Use linked dental and hospital records at national scale to compare recent invasive dental
      procedure exposure between incident cases and matched controls, stratified by cardiac risk
      category and prophylaxis receipt. The decision criterion is whether procedure exposure is
      associated with disease at all. If it is not, the mechanistic rationale for prophylaxis fails
      at its first step, and no trial is needed.

- discussion_id: the_thrombus_comes_first
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Is a pre-existing sterile thrombus a strict requirement for infection, and can the initiating
    endothelial injury be identified prospectively?
  rationale: >
    The standard model holds that infection requires a sterile platelet-fibrin thrombus to seed,
    which explains why bacteraemia is common and this disease is rare, why abnormal valves are the
    substrate, and why prosthetic material carries such risk. It is also why three nodes of this
    entry conform to the thrombogenesis module even though the disease is infectious. The model is
    hard to observe directly in humans, because the sterile lesion is asymptomatic and is found
    only incidentally or at autopsy, so the requirement is inferred from animal models and from the
    epidemiology rather than demonstrated prospectively. Two things follow if it is strictly true.
    Identifying who carries a sterile vegetation would identify who is actually at risk, which is
    a far better targeting strategy than the current one based on valve category. And Staphylococcus
    aureus, which can infect apparently normal valves, would need either an unrecognised
    microscopic thrombus or a genuinely distinct route of invasion, and which of those is correct
    is not settled.
  attaches_to:
  - pathophysiology#Endothelial injury and sterile thrombus formation
  - pathophysiology#Microbial adherence to the sterile thrombus
  evidence:
  - reference: PMID:40422904
    reference_title: "Staphylococcus aureus Endocarditis Immunothrombosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This shift is of concern as it is associated with Staphylococcus Aureus which has a high virulence rate and a tendency to form a biofilm"
    explanation: PARTIAL. The rise of a highly virulent organism able to affect structurally normal valves is what makes the strictness of the thrombus-first requirement an open rather than a settled question.
  proposed_experiments:
  - experiment_id: exp_nbte_imaging_cohort
    name: Prospective high-resolution imaging for subclinical sterile vegetations in high-risk cohorts
    description: >-
      Image high-risk cohorts, including patients with prosthetic valves and long-term indwelling
      catheters, with high-resolution transoesophageal echocardiography or molecular imaging, and
      follow them for incident infective endocarditis. The decision criterion is whether detectable
      subclinical sterile vegetation predicts subsequent infection. If it does, risk targeting can
      move from valve category to the lesion itself.

notes: >
  Deep-research provenance. Curated from a claude_code deep-research report treated as leads only.

  Deep-research reference errors caught. Three PMIDs appearing in the report were fetched and found
  to be unrelated to this disease. PMID:25360655 is cited in the report as a study of genetic
  variants in inflammatory response genes in infective endocarditis, and the paper with that
  identifier is about establishment of animal models with coronary microcirculation. PMID:21969557
  is a paper on 9-cis-epoxycarotenoid dioxygenase in Arabidopsis thaliana seeds, and PMID:19717591
  is about FlhF GTPase activity in flagellar gene regulation. None is cited in this entry. Five
  replacement references were found by direct PubMed search and verified before use.

  Module conformance. Three nodes conform to thrombogenesis, at platelet adhesion, at fibrin-platelet
  thrombus formation, and at thrombotic occlusion with ischaemic injury. That an infectious disease
  conforms to a thrombosis module is the substantive claim of this entry rather than an artefact of
  convenience, since the sterile thrombus is a precondition for the infection rather than a
  consequence of it.

  Curated negative. Antibiotic prophylaxis before dental procedures is curated together with the
  systematic review that undermines it, including the finding that post-procedural bacteraemia is
  not a valid surrogate endpoint. The practice is recorded rather than omitted precisely so that
  the contradicting evidence has something to attach to.

  Corrected provenance claims. An earlier revision of this entry asserted that the cached abstracts
  for the partial oral therapy trial and the ICE-PCS cohort were truncated, and that the
  Duke-ISCVID record contained no abstract body. All three claims were false. The caches are
  complete, and the apparent truncation was an artefact of a fixed-width extraction window used
  during curation rather than anything in the cache. Every affected snippet has been re-quoted at
  sentence boundaries from the full cached text, which in the Duke-ISCVID case replaced a
  title-only snippet carrying no evidentiary content with the sentence enumerating the actual
  changes in the 2023 revision.

  One fetched reference is deliberately not cited. PMID:35139280, the five-year outcomes of the
  partial oral therapy trial, is a research letter whose cached record contains citation metadata
  and no abstract body. Citing it would require a title-only snippet carrying no evidentiary
  content, which is the defect corrected elsewhere in this entry, so the five-year durability of
  that result is not asserted here.

  Absent bindings. No ECTO terms are bound for injection drug use or for intravascular catheters as
  exposures, because the hierarchy has no term expressing either as a route of microbial entry, and
  the available drug-exposure terms would assert a pharmacological exposure rather than the
  microbiological one that matters here.

  NEC preflight returned SKIP, since MONDO records no causal gene for this infectious disease. The
  manual fallback was run. The preflight also reported an OMIM identifier of 154700 from the report,
  which is Marfan syndrome; inspection showed the report cites it correctly and explicitly as a
  predisposing condition several causal steps removed from the infection, not as an identifier for
  this disease, so it is not an identity mismatch.

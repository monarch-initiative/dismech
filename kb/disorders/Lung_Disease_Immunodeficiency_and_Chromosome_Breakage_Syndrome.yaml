      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This work associates missense mutations in NSMCE3 with an autosomal recessive chromosome breakage syndrome that leads to defective T and B cell function and acute respiratory distress syndrome in early childhood."
      explanation: >-
        Defines LICS as a monogenic autosomal recessive chromosome breakage
        syndrome, which places it in the genetics Part.

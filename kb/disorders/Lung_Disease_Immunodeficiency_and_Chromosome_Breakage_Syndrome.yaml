mechanistic_hypotheses:
- hypothesis_group_id: immunodeficiency_triggered_lung_injury
  hypothesis_label: Viral pneumonia in combined immunodeficiency triggers the lung injury
  status: ALTERNATIVE
  description: >-
    The founding report linked the lung disease to viral pneumonia in infants with
    a combined T and B cell defect. This motivated a trial of haematopoietic stem
    cell transplantation, which did not prevent fatal lung disease. Five later
    patients developed the same course without infection and with normal immune
    evaluations, so the immune defect is at most a contributing factor in some
    patients.
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder, designated LICS, which expands the spectrum of chromosomal breakage syndromes, is associated with progressive, severe PARDS following viral pneumonia, resulting in death in early childhood of the affected individuals described here."
    explanation: The founding report's association of the lung disease with preceding viral pneumonia.
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we present five recently identified LICS patients who developed fatal lung disease without signs of infection and who expressed a variable immunological phenotype."
    explanation: Fatal lung disease without infection argues against an obligatory infectious trigger.
- hypothesis_group_id: intrinsic_systemic_lung_disease
  hypothesis_label: SMC5/6 destabilization causes lung injury independently of the immune defect
  status: EMERGING
  description: >-
    The later series reframed LICS as a childhood interstitial lung disease of
    undefined etiology driven by the systemic SMC5/6 defect rather than by
    immunodeficiency. Candidate routes named in the literature, none tested in lung
    tissue, include a specific consequence of losing the NSMCE3-NSMCE4 interface,
    and loss of the SMC5/6 complex's role in silencing transcription from viral
    circular DNA genomes, which could permit exaggerated viral or inflammatory
    responses.
  evidence:
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lung transplantation was also shown not to be beneficial in LICS ... likely because of the underlying systemic nature of this disorder."
    explanation: Authors attribute treatment failure to a systemic, not purely immune, disease.
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Data on the function of the SMC5/6 complex suggests it plays a role in prevention of transcription from viral circular DNA genomes and that it thereby has a suppressive role in the development of viral infections and inflammatory processes"
    explanation: >-
      Background statement of a candidate route; the cited work is on viral
      restriction in other systems, not on LICS lung tissue.

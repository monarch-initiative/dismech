- name: Progressive Diffuse Alveolar Damage and Interstitial Lung Injury
  biological_scale: TISSUE
  description: >-
    The defining and fatal lesion. Lung biopsy and autopsy show diffuse alveolar
    damage with hyaline membranes, interstitial pneumonitis with lymphocyte-rich
    infiltrates, organizing pneumonia (including acute fibrinoid and organizing
    pneumonia), metaplastic squamous alveolar epithelium, lobular fibrosis and
    remodeling, and bronchiolitis obliterans, usually without evidence of active
    infection. Air leak (pneumomediastinum, pneumothorax, subcutaneous emphysema)
    complicates the course. Macrophage activation syndrome was not found. The
    authors attribute the failure of lung transplantation to the systemic nature of
    the disorder.

      explanation: >-
        The IUIS 2024 classification row for NSMCE3 deficiency in the DNA repair
        defect subtable of the syndromic combined immunodeficiency table.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Affected children are homozygous or compound heterozygous for NSMCE3 missense
    variants and their parents are healthy heterozygous carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous and compound heterozygous mutations were found in 2 independent kindreds, in which 4 children died in early childhood after developing rapidly progressive pulmonary disease following viral pneumonia."
    explanation: Biallelic variants in affected children of two unrelated kindreds.
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autosomal recessive lung disease immuno-deficiency and chromosome breakage syndrome (LICS), caused by missense mutations in NSMCE3, was first described in 2016 [1]."
    explanation: Independent series restating the autosomal recessive mode of inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Nine patients had been reported by 2021 (four in the founding report and five
    in the Dutch follow-up series, all homozygous or compound heterozygous for
    NSMCE3 missense variants). A further single case, an 11-year-old boy with fatal
    lung disease, was reported in 2025 (PMID:40728043); that report has no
    abstract in PubMed and is not quoted here.
  evidence:
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until now, 9 patients with LICS were reported."
    explanation: Literature case count as of the 2021 series.
- population: Netherlands (Genome of the Netherlands, 500 unrelated individuals)
  measure_type: CARRIER_FREQUENCY
  rate_per_100000: 600.0
  notes: >-
    Carrier frequency of the single recurrent NSMCE3 c.790C>T (p.Leu264Phe) allele,
    not of all pathogenic NSMCE3 alleles: observed heterozygous 3 times in 500
    unrelated Dutch individuals (allele frequency 0.003). All five patients of the
    2021 series were homozygous for this allele. The ExAC European heterozygous
    allele frequency was far lower (4.5 x 10^-5).
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the Genome of the Netherlands (GoNL) study, the variant has been observed in the heterozygous state 3 times in 500 unrelated individuals, indicating an allele frequency of 0.003 in the Netherlands (19), showing that the variant is not uncommon in the Dutch population."
    explanation: Source of the Dutch carrier count for c.790C>T.
progression:
- phase: Infantile failure to thrive and motor delay
  age_range: Birth to about 10 months
  notes: >-
    Feeding problems and failure to thrive start in early infancy, sometimes from
    birth, with mild motor delay; respiratory symptoms are absent or mild at this
    stage.
  evidence:
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Features of early onset FTT, including feeding difficulties and delayed motor milestones were present in all patients except patient E."
    explanation: Early-onset failure to thrive and motor delay as the first phase.
- phase: Acute fatal pulmonary decompensation
  age_range: About 10 to 14 months
  notes: >-
    Rapidly progressive pediatric ARDS with irreversible diffuse alveolar damage,
    usually fatal within weeks despite mechanical ventilation and corticosteroids.
  evidence:
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in addition to previously reported features of early onset (severe) FTT, (mild) motor developmental delay, and acute pulmonary disease around 10-14 months of age with irreversible DAD"
    explanation: States the typical age window of the acute pulmonary phase.
- phase: Chronic pulmonary course
  age_range: Up to 6.5 years
  notes: >-
    One patient had interstitial lung disease from about 2 years of age, later with
    hypoxemia and digital clubbing, and died of respiratory failure at 6.5 years.
  evidence:
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This relatively long survival of a patient with LICS is of clinical importance as it indicates that, apart from the acute and fatal course presenting around 10-14 months, a more chronic form exists as well."
    explanation: Establishes a chronic course alongside the acute infantile one.
pathophysiology:
- name: NSMCE3 Missense Protein Destabilization
  biological_scale: MOLECULAR
  description: >-
    The patient missense variants sit in the C-terminal winged-helix B domain
    (p.Pro209Leu) and its extension (p.Leu264Phe) of NSMCE3. Both abolish binding
    to NSMCE4, and p.Pro209Leu also strongly reduces binding to NSMCE1 and makes the
    recombinant protein prone to C-terminal truncation. Endogenous NSMCE3 falls
    below the detection limit in patient fibroblasts; because loss of other SMC5/6
    subunits is embryonic lethal in mice, the authors infer that some NSMCE3
    persists at low level.
  genetic_context:
    gene:
      preferred_term: NSMCE3
      term:
        id: hgnc:7677
        label: NSMCE3
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic missense variants, homozygous p.Leu264Phe or compound heterozygous
      p.Leu264Phe/p.Pro209Leu. Partial rather than complete loss of function is the
      authors' inference from the embryonic lethality of SMC6 and NSMCE2 loss in
      mice; residual NSMCE3 was not directly measured.
  molecular_functions:
  - preferred_term: double-stranded DNA binding by the NSE1/NSE3/NSE4 module
    modifier: DECREASED
    term:
      id: GO:0003690
      label: double-stranded DNA binding
    description: >-
      NSE3 binds double-stranded DNA through its C-terminal winged-helix B domain,
      the domain carrying both patient variants, and this binding is needed to load
      SMC5/6 onto chromatin in fission yeast. Reduced DNA binding by the patient
      alleles is inferred from their location and from the loss of the module, not
      measured directly.
  genes:
  - preferred_term: NSMCE3
    term:
      id: hgnc:7677
      label: NSMCE3
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Leu264Phe mutation of the affected individuals A-D abolished binding of NSMCE3 to NSMCE4, while its interaction with NSMCE1 was only mildly affected."
    explanation: Yeast two-hybrid interaction mapping of the recurrent patient allele.
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NSMCE3 levels in both patient fibroblasts were dramatically reduced to levels that were below the level of detection in our assay."
    explanation: Loss of detectable NSMCE3 protein in fibroblasts from both kindreds.
  - reference: PMID:26446992
    reference_title: "Chromatin association of the SMC5/6 complex is dependent on binding of its NSE3 subunit to DNA."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Here we present evidence that the NSE1/NSE3/NSE4 sub-complex of SMC5/6 binds to double-stranded DNA without any preference for DNA-replication/recombination intermediates."
    explanation: >-
      Establishes the double-stranded DNA binding activity of the module NSE3
      belongs to; this study used recombinant proteins and fission yeast, not
      patient alleles.
  - reference: PMID:26446992
    reference_title: "Chromatin association of the SMC5/6 complex is dependent on binding of its NSE3 subunit to DNA."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "C-terminal part of NSE3 contains the putative DNA-binding winged helix B (WH-B) domain with conserved basic residues."
    explanation: >-
      Places the DNA-binding surface in the winged-helix B domain, where both LICS
      missense variants lie.
  downstream:
  - target: SMC5/6 Complex Destabilization
    causal_link_type: DIRECT
    description: >-
      Loss of the NSMCE3-NSMCE4 interface weakens the subcomplex that bridges the
      SMC5 and SMC6 subunits, so the complex as a whole is destabilized.
    evidence:
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Together these data show that the identified missense variants in NSMCE3 destabilize NSMCE3 and the SMC5/6 complex."
      explanation: Links the NSMCE3 variants directly to destabilization of the complex.
- name: SMC5/6 Complex Destabilization
  biological_scale: MOLECULAR
  description: >-
    In patient fibroblasts from both kindreds SMC5 and SMC6 protein levels are
    significantly reduced along with NSMCE3, and p.Leu264Phe NSMCE3 is poorly
    incorporated into the native complex. The destabilization is much more severe
    than that caused by the truncating NSMCE2 allele of the related primordial
    dwarfism syndrome.
  genes:
  - preferred_term: NSMCE3
    term:
      id: hgnc:7677
      label: NSMCE3
  protein_complexes:
  - preferred_term: SMC5/6 complex
    term:
      id: GO:0030915
      label: Smc5-Smc6 complex
    modifier: DECREASED
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition to NSMCE3, levels of the complex subunits SMC5 and SMC6 were also significantly reduced, indicating that the stability of the SMC5/6 protein complex is compromised in affected individuals of both kindreds"
    explanation: Reduced SMC5 and SMC6 in patient fibroblasts from both families.
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with the destabilization of the complex seen in patient cells, the Leu264Phe variant showed reduced incorporation into the native SMC5/6 complex"
    explanation: Reduced assembly of the mutant subunit into the endogenous complex in U2OS cells.
  downstream:
  - target: Defective Homologous Recombination Repair
    causal_link_type: DIRECT
    description: >-
      The SMC5/6 complex resolves recombination intermediates; its destabilization
      impairs double-strand break repair by homologous recombination while sparing
      nonhomologous end joining.
    evidence:
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In cells from affected individual B, the destabilization of the SMC5/6 complex resulted in defective DNA repair by HR but not by NHEJ."
      explanation: Direct statement of the complex-to-HR-defect link in patient cells.
  - target: Impaired Recovery from Replication Stress
    causal_link_type: DIRECT
    description: >-
      Loss of SMC5/6 function prevents restart of DNA replication after a
      hydroxyurea block, a defect shared with NSMCE2-deficient cells.
    evidence:
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The lack of recovery from replication stress is also seen in cells mutated in NSMCE2 (10), showing it to be a common consequence of misregulation of the SMC5/6 complex."
      explanation: Places the replication-recovery defect downstream of SMC5/6 misregulation.
  - target: Progressive Diffuse Alveolar Damage and Interstitial Lung Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - intrinsic_systemic_lung_disease
    description: >-
      Lung injury that develops without preceding infection and with normal immune
      studies suggests a route from SMC5/6 loss to alveolar damage that does not
      pass through the immune defect. The cell type and intermediate steps are
      unknown; the founding authors speculated that loss of the NSMCE3-NSMCE4
      interface specifically underlies the pulmonary phenotype.
    evidence:
    - reference: PMID:33741030
      reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings suggest that the immunological abnormalities can be limited and do not fully explain the LICS phenotype."
      explanation: Clinical argument that the lung disease is not fully explained by the immune defect.
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As both mutations in NSMCE3 disrupt the interaction with NSMCE4, we speculate that such mutations specifically result in the pulmonary phenotype that we have observed."
      explanation: The founding report's own speculation linking the specific molecular lesion to the lung phenotype.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure to thrive precedes the lung disease and is present in nearly all
      patients; no source traces its mechanism. The founding authors attribute the
      more severe growth impairment in the compound heterozygous siblings to the
      more damaging p.Pro209Leu allele.
  - target: Feeding difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reported from early infancy; mechanism not studied.
  - target: Small for gestational age
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Prenatal growth restriction in some patients; mechanism not studied.
  - target: Motor delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mild motor delay in infancy; mechanism not studied.
  - target: Axial hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reported in the founding kindred; mechanism not studied.
  - target: Eczema
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reported in the founding kindred; mechanism not studied.
  - target: Hepatomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reported in two patients of the 2021 series; the authors describe its etiology as unknown.
  - target: Abnormal glucose homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypo- and hyperglycemia in several patients; the authors consider both poor
      intake or critical illness and a possible SMC5/6 role in insulin metabolism.
- name: Defective Homologous Recombination Repair
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts repair double-strand breaks normally in G1 (nonhomologous
    end joining intact) but, like BRCA2-deficient cells, fail to complete the slow
    repair fraction in G2 that depends on homologous recombination, and they are
    modestly hypersensitive to agents producing different types of DNA damage.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient cells showed chromosome rearrangements, micronuclei, sensitivity to replication stress and DNA damage, and defective homologous recombination."
    explanation: Summary of the cellular phenotype including the HR defect.
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "showed that repair kinetics in G1 cells were unaffected, consistent with proficient nonhomologous end joining (NHEJ)"
    explanation: Shows the repair defect is restricted to HR, with NHEJ preserved.
  downstream:
  - target: Chromosomal Instability
    causal_link_type: DIRECT
    description: Unrepaired recombination intermediates and breaks give rise to chromosome breakage and rearrangement.
    evidence:
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lymphocytes of affected individuals showed increased chromosomal breakage, and fibroblasts were sensitive to DNA-damaging agents."
      explanation: Chromosome breakage alongside DNA-damage sensitivity in patient cells.
  - target: Increased sensitivity to ionizing radiation
    causal_link_type: DIRECT
    description: An HR defect leaves cells unable to repair a fraction of radiation-induced double-strand breaks.
  - target: Combined T and B Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors attribute the lymphocyte proliferation defect to the HR defect.
      T cell loss could alternatively reflect increased apoptosis or reduced thymic
      output. V(D)J recombination, which depends on NHEJ, appears intact.
    evidence:
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The underlying lymphocyte proliferation defect is consistent with the destabilization of the SMC5/6 complex seen in fibroblasts and consequential defect in HR (32)."
      explanation: >-
        Authors' proposed link from the HR defect to lymphocyte dysfunction,
        inferred from fibroblast data rather than shown in lymphocytes.
- name: Impaired Recovery from Replication Stress
  biological_scale: CELLULAR
  description: >-
    After release from a hydroxyurea block, DNA replication recovers fully in
    control fibroblasts but not in patient fibroblasts, although similar fractions
    of cells arrest in S phase. Wild-type NSMCE3 restores recovery and the
    p.Leu264Phe protein does not. This was the most pronounced cellular defect.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: replication fork processing
    modifier: DECREASED
    term:
      id: GO:0031297
      label: replication fork processing
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The defect was restored by expression of normal NSMCE3 protein but not with the mutant protein (p.Leu264Phe), thus confirming that the replication recovery defect results from the NSMCE3 mutation"
    explanation: Complementation shows the replication-recovery defect is caused by the patient allele.
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistently, in multiple experiments, the most dramatically altered response was seen in response to hydroxyurea (HU), a DNA replication inhibitor."
    explanation: Replication stress is the most strongly affected response in patient cells.
  downstream:
  - target: Chromosomal Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Stalled forks that are not rescued by HR-dependent restart are a recognised
      source of breaks, which would contribute to micronuclei and chromosome
      rearrangement; this step was not measured directly in patient cells.
    evidence:
    - reference: PMID:27427983
      reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "HR is required to stabilize stalled forks and rescue replication (31)."
      explanation: Background statement linking HR to rescue of stalled replication forks.
- name: Chromosomal Instability
  biological_scale: CELLULAR
  description: >-
    Patient cells show stochastic chromosome rearrangements, chromosome breaks and
    de novo supernumerary marker chromosomes in lymphocytes, and micronuclei in
    about 20% of fibroblasts, a level similar to ATM-deficient cells. Array CGH of
    blood DNA shows no gains or losses, consistent with stochastic rather than
    clonal imbalances. A blood karyotype can be normal outside acute illness.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Approximately 20% of cells contained micronuclei, which is similar to levels seen in ATM fibroblasts (Figure 3A) and to cells with mutations in NSMCE2, which encodes another component of the SMC5/6 complex (10)."
    explanation: Quantifies micronucleus formation in patient fibroblasts.
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Karyotyping of cultured peripheral lymphocytes drawn either before (individual A) or during illness (individual B) revealed multiple de novo supernumerary marker chromosomes with or without additional de novo chromosome rearrangements"
    explanation: Clinical cytogenetic finding in patient lymphocytes.
  downstream:
  - target: Chromosome breakage
    causal_link_type: DIRECT
    description: The cytogenetic readout of the instability.
- name: Combined T and B Cell Dysfunction
  biological_scale: CELLULAR
  description: >-
    In the founding kindreds T cell numbers were low, recall-antigen T cell
    proliferation absent or decreased, and specific antibody responses to
    vaccination poor, while B cell numbers and IgG and IgA were normal and IgM
    raised; thymic hypo- or aplasia was found in two patients. The immune defect is
    variable: most patients of the later Dutch series had normal T cell counts and
    proliferation and no recurrent infections. Normal B cell counts argue against a
    V(D)J recombination defect.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

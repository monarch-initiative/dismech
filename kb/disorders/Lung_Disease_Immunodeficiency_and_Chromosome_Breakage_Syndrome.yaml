name: Lung Disease, Immunodeficiency, and Chromosome Breakage Syndrome
creation_date: "2026-10-12T14:48:06Z"
category: Mendelian
description: >-
  Lung disease, immunodeficiency, and chromosome breakage syndrome (LICS; OMIM
  617241) is an ultra-rare autosomal recessive chromosome breakage syndrome caused
  by biallelic missense variants in NSMCE3 (also known as NDNL2), which encodes the
  MAGE-family NSE3 subunit of the SMC5/6 structural-maintenance-of-chromosomes
  complex. The patient missense alleles weaken NSMCE3 binding to NSMCE4 and
  NSMCE1 and destabilize the whole SMC5/6 complex, so that patient cells show
  defective homologous recombination, failure to recover from replication stress,
  micronuclei, stochastic chromosome rearrangements and radiosensitivity.

  Affected infants have failure to thrive, feeding difficulties and mild motor
  delay, and then, typically between about 10 and 14 months of age, develop rapidly
  progressive, irreversible lung disease presenting as pediatric acute respiratory
  distress syndrome with diffuse alveolar damage, interstitial pneumonitis and
  fibrosis, complicated by pneumomediastinum and pneumothorax; nearly all reported
  patients died in early childhood, one surviving to 6.5 years with a more chronic
  course. The founding report described combined T and B cell immunodeficiency and
  lung decompensation after viral pneumonia, but a later series of five patients
  had normal or near-normal immune studies and no preceding infection, so whether
  the immune defect drives the lung injury is unresolved. Neither haematopoietic
  stem cell transplantation nor lung transplantation has been curative.

- name: Nijmegen breakage syndrome
  description: >-
    Chromosome breakage syndrome with combined immunodeficiency and
    radiosensitivity. The founding authors contrast it with LICS on B cell counts
    and V(D)J recombination, which are defective in NBS and normal in LICS.
  disease_term:
    preferred_term: Nijmegen breakage syndrome
    term:
      id: MONDO:0009623
      label: Nijmegen breakage syndrome
  evidence:

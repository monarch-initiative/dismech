genetic:
- name: NSMCE3
  association: >-
    Causal biallelic missense variants that destabilize NSMCE3 and the SMC5/6
    complex. Two alleles are reported, the recurrent c.790C>T (p.Leu264Phe) and
    p.Pro209Leu, both in the C-terminal winged-helix region that contacts NSMCE4.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NSMCE3
    term:
      id: hgnc:7677
      label: NSMCE3
  notes: >-
    NSMCE3 was previously named NDNL2 and is also listed as MAGEG1. It lies in the
    15q11.2-q13 region identified by homozygosity mapping in the first Dutch
    kindred.
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing revealed biallelic missense mutations in the NSMCE3 (also known as NDNL2) gene, which encodes a subunit of the SMC5/6 complex that is essential for DNA damage response and chromosome segregation."
    explanation: Identifies NSMCE3 as the disease gene.
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted genetic testing revealed homozygosity for the NSMCE3 (NM_138704.3):c.790C > T mutation."
    explanation: Independent confirmation in a further kindred.
variants:
- name: NSMCE3 c.790C>T (p.Leu264Phe)
  description: >-
    Recurrent missense variant in the winged-helix B extension of NSMCE3
    (rs199905054), found homozygous in both Dutch kindreds and in trans with
    p.Pro209Leu in the US kindred. It abolishes NSMCE4 binding, mildly weakens
    NSMCE1 binding and reduces incorporation into the SMC5/6 complex, and it fails
    to rescue the replication-recovery defect. It was seen heterozygous in 3 of 500
    unrelated Dutch individuals.
  gene:
    preferred_term: NSMCE3
    term:
      id: hgnc:7677
      label: NSMCE3
  variant_type: single nucleotide variant
  clinical_significance: LIKELY_PATHOGENIC

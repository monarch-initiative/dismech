    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals share some clinical features with individuals with Nijmegen breakage syndrome (NBS) and AT chromosomal breakage syndrome"
    explanation: Clinical overlap noted by the founding authors.
- name: Ataxia telangiectasia
  description: >-
    Shares radiosensitivity, chromosome instability, thymic hypoplasia and
    combined immunodeficiency, and interstitial lung disease is described in it.
    In LICS B cell counts are normal and V(D)J recombination appears intact, and
    ATM protein was only partly reduced in a patient cell line.
  disease_term:
    preferred_term: ataxia telangiectasia
    term:
      id: MONDO:0008840
      label: ataxia telangiectasia
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that in the 4 affected individuals B cell counts were normal indicates proper efflux from the bone marrow, which is defective in AT and NBS (40, 41)."
    explanation: Distinguishing immunological feature from AT and NBS.
- name: NSMCE2-related primordial dwarfism with insulin resistance
  description: >-
    Disorder of another SMC5/6 subunit (the NSMCE2 SUMO ligase) with severe
    growth failure, extreme insulin resistance and gonadal failure and only mild
    chromosome instability; the SMC5/6 destabilization is milder than in LICS.
  evidence:
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, patients with primordial dwarfism, extreme insulin resistance, gonadal failure, and signs of mild spontaneous chromosome instability were identified as carrying mutations in NSMCE2, which encodes the SUMO ligase subunit of the SMC5/6 complex (10)."
    explanation: Describes the related NSMCE2 phenotype that the authors contrast with LICS.
- name: SLF2- and SMC5-related Atelis syndrome
  description: >-
    Disorder of an SMC5/6 core subunit and its loader with segmented chromosomes
    and mosaic variegated hyperploidy; one reported patient developed severe
    pulmonary disease resembling LICS.
  evidence:
  - reference: PMID:36333305
    reference_title: "Pathogenic variants in SLF2 and SMC5 cause segmented chromosomes and mosaic variegated hyperploidy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one patient (P3) developed severe pulmonary disease similar to patients with variants in the SMC5/6 complex subunit NSMCE3"
    explanation: Lung disease overlap between SMC5/6 pathway disorders.
discussions:
- discussion_id: lics_lung_injury_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does SMC5/6 destabilization cause diffuse alveolar damage in infancy, and
    what part, if any, does the variable combined immunodeficiency play?
  attaches_to:
  - pathophysiology#Progressive Diffuse Alveolar Damage and Interstitial Lung Injury
  - mechanistic_hypotheses#immunodeficiency_triggered_lung_injury
  - mechanistic_hypotheses#intrinsic_systemic_lung_disease
  rationale: >-
    The founding report linked the lung disease to viral pneumonia in
    immunodeficient infants, but five later patients died of the same lung disease
    with normal immune studies and no infection, and stem cell transplantation did
    not prevent it. None of the cited studies examined which lung cell type is
    affected, whether alveolar epithelial cells accumulate DNA damage, or whether
    loss of SMC5/6 restriction of viral episomes contributes.
  evidence:
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although it is known that NSMCE3 is part of the SMC5-SMC6 complex involved in DNA repair, the exact pathophysiology of LICS has not yet been elucidated."
    explanation: Authors state the pathophysiology is unexplained.
notes: >-
  The MONDO label for this term carries a trailing semicolon, copied here exactly
  as MONDO serves it. A 2025 single-patient report (PMID:40728043, an 11-year-old
  boy with fatal lung disease) would extend the reported survival but has no
  PubMed abstract and could not be quoted, so its details are not curated. One
  founding patient developed bone marrow failure after lung transplantation; as a
  single post-transplant observation it is not curated as a disease feature. No
  malignancy has been reported, but all patients died young, so cancer
  predisposition cannot be assessed. The cancer- and aging-framed genome
  instability modules (genome_instability_mutation, genomic_instability_aging) were
  considered for conforms_to and not used, because LICS has neither a tumour nor a
  progeroid phenotype.

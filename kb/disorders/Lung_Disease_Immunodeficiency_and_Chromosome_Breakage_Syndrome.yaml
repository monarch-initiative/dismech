    evidence_source: HUMAN_CLINICAL
    snippet: "Autopsy showed prolonged diffuse alveolar damage (DAD) as seen in the advanced stage of acute severe interstitial pneumonitis (IP) or pediatric acute respiratory distress syndrome (PARDS) without signs of infection"
    explanation: Autopsy pathology of the lung lesion, without infection.
  - reference: PMID:27427983
    reference_title: "Destabilized SMC5/6 complex leads to chromosome breakage syndrome with severe lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autopsy findings revealed acute eosinophilic pneumonia, diffuse alveolar damage, extensive lobular fibrosis, bronchiolitis obliterans, and organizing pneumonia."
    explanation: Autopsy pathology in a founding US patient.
  - reference: PMID:33741030
    reference_title: "New insights in phenotype and treatment of lung disease immuno-deficiency and chromosome breakage syndrome (LICS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the disease periods where patients suffered from progressive and fatal pulmonary diseases, we found no evidence for macrophage activation syndrome (MAS)."
    explanation: Argues against macrophage activation syndrome as the driver of the lung injury.

genetic:
- name: MYOCD
  association: Heterozygous truncation/missense/microdeletion in familial PBS with megabladder
  gene_term:
    preferred_term: MYOCD
    term:
      id: hgnc:16067
      label: MYOCD
  relationship_type: CAUSATIVE
  notes: >
    MYOCD (myocardin) is a smooth- and cardiac-specific master transcriptional
    coactivator. Heterozygous truncating/missense variants or microdeletions were
    identified in affected males from multiple PBS families with megabladder, and
    genetically engineered compound-heterozygous mutant mice reproduce the
    megabladder phenotype, making MYOCD one of the better-supported PBS genes.
  evidence:
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with megabladder harboring heterozygous truncation or missense mutations or microdeletion in the MYOCD gene"
    explanation: Reports MYOCD variants in affected males across multiple PBS families with megabladder.
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "genetically engineered compound heterozygous mutant mouse models with altered MYOCD production that had the megabladder phenotype"
    explanation: Engineered MYOCD-mutant mice reproduce the megabladder phenotype, supporting causality.
- name: CHRM3
  association: Biallelic loss-of-function causing a prune-belly-like congenital bladder disorder
  gene_term:
    preferred_term: CHRM3
    term:
      id: hgnc:1952
      label: CHRM3
  relationship_type: UNKNOWN
  notes: >
    CHRM3 encodes the M3 muscarinic acetylcholine receptor, the principal
    mediator of detrusor smooth-muscle contraction. Biallelic (homozygous)
    loss-of-function variants cause an autosomal recessive familial congenital
    bladder malformation with a prune-belly-like syndrome; Chrm3-null mice
    phenocopy the megacystis phenotype. Because the reported human entity is
    explicitly prune-belly-like rather than unequivocal classic PBS, its
    relationship to MONDO:0007032 remains uncertain.
  evidence:
  - reference: PMID:22077972
    reference_title: "Muscarinic Acetylcholine Receptor M3 Mutation Causes Urinary Bladder Disease and a Prune-Belly-like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscarinic acetylcholine receptor M3 (CHRM3) (1q41-q44) homozygous frameshift"
    explanation: Reports a homozygous CHRM3 frameshift mutation in familial bladder malformation with a prune-belly-like syndrome.
  - reference: PMID:22077972
    reference_title: "Muscarinic Acetylcholine Receptor M3 Mutation Causes Urinary Bladder Disease and a Prune-Belly-like Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "strikingly phenocopies Chrm3 null \nmutant mice"
    explanation: Chrm3-null mice phenocopy the human phenotype, supporting CHRM3 causality.
- name: FLNA
  association: Candidate X-linked hemizygous missense variants in surviving males
  gene_term:
    preferred_term: FLNA
    term:
      id: hgnc:3754
      label: FLNA
  relationship_type: UNKNOWN
  notes: >
    Hemizygous missense variants in the X-linked filamin A gene (FLNA) were
    identified in three surviving males with PBS. FLNA encodes an
    actin-crosslinking mechanosensing scaffold in smooth muscle. The study
    reported no recurrent variant, lacked patient-derived functional tissue and
    a PBS mouse model, and described FLNA as a proposed candidate gene; the
    association therefore remains provisional.
  evidence:
  - reference: PMID:32085749
    reference_title: "Prune belly syndrome in surviving males can be caused by Hemizygous missense mutations in the X-linked Filamin A gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prune belly syndrome in surviving males can be caused by Hemizygous missense \nmutations in the X-linked Filamin A gene"
    explanation: Reports X-linked FLNA hemizygous missense variants as a cause of PBS in surviving males.
- name: PIEZO1
  association: Candidate causal biallelic loss-of-function variant
  gene_term:
    preferred_term: PIEZO1
    term:
      id: hgnc:28993
      label: PIEZO1
  relationship_type: UNKNOWN
  notes: >
    Compound-heterozygous loss-of-function variants in the mechanosensitive
    cation channel PIEZO1 were identified in a PBS patient by whole-exome
    sequencing, with functional studies showing reduced pressure-induced channel
    activity that could be rescued in vitro by the PIEZO1 activator Yoda1.
    Reported as a candidate causal gene from a single family.
  evidence:
  - reference: PMID:38184690
    reference_title: "PIEZO1 loss-of-function compound heterozygous mutations in the rare congenital human disorder Prune Belly Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIEZO1 mutations may be causal for PBS"
    explanation: Reports PIEZO1 loss-of-function variants as candidate causal lesions for PBS.
- name: HNF1B
  association: Candidate gene; 17q12 deletions in rare cases
  gene_term:
    preferred_term: HNF1B
    term:
      id: hgnc:11630
      label: HNF1B
  relationship_type: DISPUTED
  notes: >
    HNF1B (TCF2) is a candidate gene: rare cases of PBS carry chromosome 17q12
    deletions encompassing HNF1B, but large-scale screening found functionally
    significant HNF1B point mutations to be uncommon.
  evidence:
  - reference: PMID:22114815
    reference_title: "Genetic basis of prune belly syndrome: screening for HNF1β gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "chromosome 17q12 deletions encompassing the HNF1β gene"
    explanation: 17q12 deletions encompassing HNF1B make it a candidate gene for PBS.
  - reference: PMID:22114815
    reference_title: "Genetic basis of prune belly syndrome: screening for HNF1β gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "functionally \nsignificant HNF1β mutations are uncommon in prune belly syndrome"
    explanation: Large-scale screening argues against functionally significant HNF1B point mutations as a common cause.

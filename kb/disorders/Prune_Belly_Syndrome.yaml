inheritance:
- name: Predominantly sporadic occurrence
  description: >
    Most cases of prune belly syndrome are sporadic and occur in individuals
    with a normal karyotype, with a strong male predominance. Familial
    clustering, twin concordance, and rare single-gene and chromosomal findings
    indicate genetic heterogeneity rather than a single Mendelian mode of
    inheritance.
  evidence:
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases of PBS are sporadic and have a normal karyotype, with 95% patients being male."
    explanation: Establishes the predominantly sporadic occurrence and male predominance.
  - reference: PMID:38879764
    reference_title: "Prune-belly Syndrome: An Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital and genetically \nheterogeneous disease"
    explanation: PBS is described as a congenital and genetically heterogeneous disease.

- name: Fetal lower urinary tract obstruction and bladder distension
  description: >
    Functional or anatomic obstruction of the fetal lower urinary tract causes
    marked bladder distension and elevated intravesical pressure. Under the
    obstruction theory, the distended bladder mechanically disrupts the anterior
    abdominal wall, impedes testicular descent, and transmits back-pressure to
    the upper tracts.

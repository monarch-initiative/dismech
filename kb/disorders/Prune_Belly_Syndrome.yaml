- name: Primary mesodermal developmental arrest
  description: >
    Under the mesodermal-arrest hypothesis, abnormal somatic and splanchnic
    mesoderm development during weeks 6-10 impairs formation of the abdominal
    wall, urinary-tract musculature, and gubernaculum.

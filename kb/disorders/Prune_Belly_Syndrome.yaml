name: Prune Belly Syndrome
category: Complex
creation_date: "2026-07-19T00:00:00Z"
synonyms:
- Eagle-Barrett syndrome
- Triad syndrome
- Abdominal muscle deficiency syndrome
- Obrinsky syndrome
description: >
  Prune belly syndrome (PBS), also called Eagle-Barrett syndrome or triad
  syndrome, is a rare congenital disorder classically defined by a triad of
  deficiency or absence of the anterior abdominal wall musculature, urinary
  tract abnormalities (a massively dilated poorly contractile bladder, dilated
  tortuous ureters, hydronephrosis, and vesicoureteral reflux), and bilateral
  intra-abdominal cryptorchidism in males. The wrinkled, lax appearance of the
  neonatal abdominal wall gives the syndrome its name. PBS occurs predominantly
  in males, most cases are sporadic with a normal karyotype, and it is a member
  of the group of fetal lower urinary tract obstruction (LUTO)-associated
  disorders. Severity spans a wide spectrum, from stillbirth or early neonatal
  death from pulmonary and renal insufficiency to milder phenotypes with
  near-normal renal function. The etiology remains unknown; the two principal
  pathogenic hypotheses are a primary urethral-obstruction / bladder-distension
  mechanism and a primary mesodermal developmental defect, and recent work
  implicates disordered genitourinary smooth-muscle myogenesis.

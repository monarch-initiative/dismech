      id: GO:0048745
      label: smooth muscle tissue development
  genes:
  - preferred_term: MYOCD
    term:
      id: hgnc:16067
      label: MYOCD
  evidence:
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2019, Houwelinget al.11published a series of 4 unrelated multiplex
      families (7 affected males from 3 families) with megabladder harboring
      heterozygous truncation or missense mutations or microdeletion in the
      MYOCD gene.
    explanation: Reports MYOCD variants in multiple affected families.
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, the authors showed two genetically engineered compound
      heterozygous mutant mouse models with altered MYOCD production that had
      the megabladder phenotype.
    explanation: Mutant mouse models reproduce megabladder.
  downstream:
  - target: Abnormal genitourinary smooth-muscle development
    description: Altered MYOCD production is proposed to impair smooth-muscle differentiation in the urinary tract.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered serum response factor-dependent transcription
    evidence:
    - reference: PMID:34016542
      reference_title: "Modern management of and update on prune belly syndrome."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        MYOCD is a critical smooth- and cardiac-specific master regulatory
        cofactor of serum response factor that binds promoters and activates
        transcription of many smooth muscle genes, leading to vascular and
        visceral smooth muscle cell differentiation in during embryonic development.
      explanation: Establishes MYOCD's role in the transcriptional program for embryonic smooth-muscle differentiation.
- name: Impaired PIEZO1-mediated pressure sensing
  description: >
    Compound-heterozygous PIEZO1 variants reported in one PBS patient reduce
    pressure-induced channel open probability without changing single-channel
    current, indicating impaired mechanosensation.
  locations:
  - preferred_term: lower urinary tract
    term:
      id: UBERON:0001556
      label: lower urinary tract
  genes:
  - preferred_term: PIEZO1
    term:
      id: hgnc:28993
      label: PIEZO1
  evidence:
  - reference: PMID:38184690
    reference_title: "PIEZO1 loss-of-function compound heterozygous mutations in the rare congenital human disorder Prune Belly Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      loss-of-function characteristics in the pressure-induced normalized open
      probability (NPo) of the channel, while no change is observed in
      single-channel currents. Furthermore, Yoda1, a PIEZO1 activator, can
      rescue the NPo defect of the PBS mutant channels.
    explanation: Functional analysis directly demonstrates defective pressure-induced channel opening and in-vitro rescue.
  downstream:
  - target: Poor urinary-tract contractility
    description: Impaired pressure sensing is a candidate route to dysfunctional lower-urinary-tract smooth muscle.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38184690
      reference_title: "PIEZO1 loss-of-function compound heterozygous mutations in the rare congenital human disorder Prune Belly Syndrome."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        PIEZO1 is a cation-selective channel activated by various mechanical
        forces and widely expressed throughout the lower urinary tract.
      explanation: Supports lower-urinary-tract localization and mechanosensory function, while the contractility bridge remains incompletely resolved.

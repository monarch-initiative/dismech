- name: Urinary tract dilation and dysfunction
  description: >
    The hallmark urinary phenotype is a variably severe dilation of the entire
    urinary tract: a large poorly contractile bladder, dilated tortuous ureters,
    hydronephrosis, and high-grade vesicoureteral reflux, predisposing to
    urinary stasis, infection, and progressive renal injury.

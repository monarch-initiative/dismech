genetic:
- name: MYOCD
  association: Heterozygous truncation/missense/microdeletion in familial PBS with megabladder
  gene_term:
    preferred_term: MYOCD
    term:
      id: hgnc:16067
      label: MYOCD
  relationship_type: CAUSATIVE
  notes: >
    MYOCD (myocardin) is a smooth- and cardiac-specific master transcriptional
    coactivator. Heterozygous truncating/missense variants or microdeletions were
    identified in affected males from multiple PBS families with megabladder, and
    genetically engineered compound-heterozygous mutant mice reproduce the
    megabladder phenotype, making MYOCD one of the better-supported PBS genes.
  evidence:
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with megabladder harboring heterozygous truncation or missense mutations or microdeletion in the MYOCD gene"
    explanation: Reports MYOCD variants in affected males across multiple PBS families with megabladder.
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "genetically engineered compound heterozygous mutant mouse models with altered MYOCD production that had the megabladder phenotype"
    explanation: Engineered MYOCD-mutant mice reproduce the megabladder phenotype, supporting causality.
- name: CHRM3
  association: Biallelic loss-of-function causing prune-belly-like syndrome
  gene_term:
    preferred_term: CHRM3
    term:
      id: hgnc:1952
      label: CHRM3
  relationship_type: CAUSATIVE
  notes: >
    CHRM3 encodes the M3 muscarinic acetylcholine receptor, the principal
    mediator of detrusor smooth-muscle contraction. Biallelic (homozygous)
    loss-of-function variants cause an autosomal recessive familial congenital
    bladder malformation with a prune-belly-like syndrome; Chrm3-null mice
    phenocopy the megacystis phenotype, supporting causality. MONDO also links
    CHRM3 to prune belly syndrome.
  evidence:
  - reference: PMID:22077972
    reference_title: "Muscarinic Acetylcholine Receptor M3 Mutation Causes Urinary Bladder Disease and a Prune-Belly-like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscarinic acetylcholine receptor M3 (CHRM3) (1q41-q44) homozygous frameshift"
    explanation: Reports a homozygous CHRM3 frameshift mutation in familial bladder malformation with a prune-belly-like syndrome.
  - reference: PMID:22077972
    reference_title: "Muscarinic Acetylcholine Receptor M3 Mutation Causes Urinary Bladder Disease and a Prune-Belly-like Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "strikingly phenocopies Chrm3 null \nmutant mice"
    explanation: Chrm3-null mice phenocopy the human phenotype, supporting CHRM3 causality.
- name: FLNA
  association: X-linked hemizygous missense variants in surviving males
  gene_term:
    preferred_term: FLNA
    term:
      id: hgnc:3754
      label: FLNA
  relationship_type: CAUSATIVE
  notes: >
    Hemizygous missense variants in the X-linked filamin A gene (FLNA) were
    identified in surviving adult males with PBS. FLNA encodes an actin-crosslinking
    mechanosensing scaffold in smooth muscle; this is the first reported X-linked
    PBS mechanism and is of particular interest given the strong male predominance.
  evidence:
  - reference: PMID:32085749
    reference_title: "Prune belly syndrome in surviving males can be caused by Hemizygous missense mutations in the X-linked Filamin A gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prune belly syndrome in surviving males can be caused by Hemizygous missense \nmutations in the X-linked Filamin A gene"
    explanation: Reports X-linked FLNA hemizygous missense variants as a cause of PBS in surviving males.
- name: PIEZO1
  association: Candidate causal biallelic loss-of-function variant
  gene_term:
    preferred_term: PIEZO1
    term:
      id: hgnc:28993
      label: PIEZO1
  relationship_type: SUSCEPTIBILITY
  notes: >
    Compound-heterozygous loss-of-function variants in the mechanosensitive

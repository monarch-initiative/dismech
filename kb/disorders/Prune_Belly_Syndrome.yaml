mechanistic_hypotheses:
- hypothesis_group_id: urethral_obstruction_theory
  hypothesis_label: Urethral obstruction / bladder-distension theory
  status: EMERGING
  description: >
    Transient fetal urethral obstruction (or functional lower urinary tract
    obstruction) causes massive bladder distension and ascites, which
    secondarily damages the developing abdominal wall musculature, prevents
    testicular descent, and produces upper-tract dilation and renal dysplasia.
    This is one of the two long-standing competing explanations for the triad.
  evidence:
  - reference: PMID:38879764
    reference_title: "Prune-belly Syndrome: An Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "numerous theories, mutations, \nand genetic disturbances have been proposed to explain the origin of PBS"
    explanation: The urethral-obstruction theory is one of the competing etiologic theories reviewed for PBS.
- hypothesis_group_id: mesodermal_defect_theory
  hypothesis_label: Primary mesodermal developmental defect theory
  status: EMERGING
  description: >
    A primary defect of intermediate/lateral-plate mesoderm between the 6th and
    10th weeks of gestation simultaneously impairs abdominal wall muscle, the
    genitourinary smooth muscle and urinary tract, and gonadal descent,
    accounting for the triad without requiring mechanical obstruction. Recent
    identification of variants in genes regulating genitourinary myogenesis
    supports a primary developmental-myopathic mechanism.
  evidence:
  - reference: PMID:34016542
    reference_title: "Modern management of and update on prune belly syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in known genes that regulate embryonic \ngenitourinary myogenesis have been identified"
    explanation: Identification of genitourinary-myogenesis genes supports a primary developmental-myopathic (mesodermal) mechanism.
pathophysiology:
- name: Disordered genitourinary smooth-muscle myogenesis
  description: >
    A developmental defect of the smooth muscle of the lower urinary tract
    produces a thin-walled, poorly contractile bladder and dilated ureters.
    Candidate genes regulating embryonic genitourinary myogenesis have been
    identified, including a compound-heterozygous loss-of-function variant in
    the mechanosensitive cation channel PIEZO1, supporting a primary
    myopathic/developmental mechanism rather than purely mechanical obstruction.

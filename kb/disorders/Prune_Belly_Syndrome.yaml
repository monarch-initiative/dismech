- name: MYOCD-associated impaired smooth-muscle differentiation
  description: >
    MYOCD is a master transcriptional coactivator for smooth-muscle
    differentiation. PBS/megabladder-associated MYOCD variants and mutant mouse
    models implicate impaired embryonic smooth-muscle differentiation in a
    subset of cases.

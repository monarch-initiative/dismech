mechanistic_hypotheses:
- hypothesis_group_id: urethral_obstruction_theory
  hypothesis_label: Urethral obstruction / bladder-distension theory
  status: EMERGING
  description: >
    Transient fetal urethral obstruction (or functional lower urinary tract
    obstruction) causes massive bladder distension and ascites, which
    secondarily damages the developing abdominal wall musculature, prevents
    testicular descent, and produces upper-tract dilation and renal dysplasia.
    This is one of the two long-standing competing explanations for the triad.
  evidence:
  - reference: PMID:22114815
    reference_title: "Genetic basis of prune belly syndrome: screening for HNF1β gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the second theory, involving in utero bladder obstruction, a
      hypoplastic/dysplastic prostate or abnormal urethra prevents urine
      passage. This obstruction of urine flow causes bladder, ureteral and renal
      distention with secondary abdominal wall and urinary muscle maldevelopment.
    explanation: Directly states the proposed obstruction mechanism and its downstream developmental effects.
- hypothesis_group_id: mesodermal_defect_theory
  hypothesis_label: Primary mesodermal developmental defect theory
  status: EMERGING
  description: >
    A primary defect of intermediate/lateral-plate mesoderm between the 6th and
    10th weeks of gestation simultaneously impairs abdominal wall muscle, the
    genitourinary smooth muscle and urinary tract, and gonadal descent,
    accounting for the triad without requiring mechanical obstruction. Recent
    identification of variants in genes regulating genitourinary myogenesis
    supports a primary developmental-myopathic mechanism.
  evidence:
  - reference: PMID:22114815
    reference_title: "Genetic basis of prune belly syndrome: screening for HNF1β gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first theory, known as the theory of mesodermal arrest, an unknown
      primary defect in the development of the lateral plate mesoderm between 6
      and 10 weeks of gestation produces primary maldevelopment of the abdominal
      wall and urinary tract musculature.
    explanation: Directly states the timing and structures implicated by the mesodermal-arrest hypothesis.

- name: Clinical Suspicion
  description: >-
    Suspected in a child with early-onset, mainly facial poikiloderma together with hypotrichosis, hypohidrosis,
    triceps surae contractures or progressive muscle weakness; most patients in the main series were first suspected
    of Rothmund-Thomson syndrome. Restrictive lung disease or pulmonary fibrosis, exocrine pancreatic insufficiency
    and liver impairment support the suspicion.

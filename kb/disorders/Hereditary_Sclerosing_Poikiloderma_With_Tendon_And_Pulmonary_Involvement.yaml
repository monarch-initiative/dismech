pathophysiology:
- name: FAM111B Protease Gain of Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous FAM111B missense variants, and one in-frame deletion, cluster in or near the C-terminal trypsin-like
    peptidase domain at surface-exposed positions on its periphery. Disease-associated mutants, including p.Ser628Asn,
    show markedly elevated autoproteolytic activity, which is interpreted as release of inhibitory constraints on the
    protease. A later study describes the disorder as dominant negative; the two readings are not reconciled.
  genes:

  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: FAM111B Protease Gain of Function
  evidence:
  - reference: PMID:32776417
    reference_title: FAM111 protease activity undermines cellular fitness and is amplified by gain-of-function mutations in human disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Our collective results suggest a potential of specific inhibitors of FAM111A or FAM111B catalytic activity as a
      rational treatment strategy for patients with fibrosing poikiloderma, gracile bone dysplasia, or Kenny-Caffey
      syndrome caused by mutations in these proteases.
    explanation: Rationale from catalytic-dead rescue in cells; not a tested therapy.
  - reference: PMID:36102338
    reference_title: Hereditary fibrosing poikiloderma (POIKTMP syndrome) report of a new mutation and review of the literature.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Specific inhibition of catalytic activity might be a future strategy to halt progression of this otherwise
      untreatable disease.
    explanation: Clinical review proposing the same strategy.
experimental_models:
- name: Inducible GFP-FAM111B patient-allele U2OS cells
  experimental_model_type: CELL_LINE
  description: >-
    U2OS osteosarcoma cell lines inducibly expressing GFP-tagged wild-type or disease-associated FAM111B, including
    alleles combined with the catalytically inactive D544N substitution.
  publication: PMID:32776417
  modeled_mechanisms:
  - target: Displacement of Replication and Transcription Factors from Chromatin
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      A transformed cancer cell line rather than skin, muscle, lung or pancreatic cells, so it shows the cellular
      toxicity of the mutant protease but not which tissue cells are affected or how fibrosis follows.
    evidence:
    - reference: PMID:32776417
      reference_title: FAM111 protease activity undermines cellular fitness and is amplified by gain-of-function mutations in human disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the expression of a FAM111B disease mutant promoted dissociation of RFC1, PCNA, and RPB1 from chromatin
      explanation: The model reproduces the chromatin effects of patient alleles.
- name: FAM111B-deficient U2OS and MCF7 cells
  experimental_model_type: CELL_LINE
  description: FAM111B knockout or depleted U2OS and MCF7 cells, plus cells expressing disease-mutant FAM111B.
  publication: PMID:37342232
  modeled_mechanisms:
  - target: Telomere Shortening and Genomic Instability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      Loss of FAM111B rather than a heterozygous patient allele, in cancer cell lines; whether patient alleles shorten
      telomeres was not tested.
    evidence:
    - reference: PMID:37342232
      reference_title: Loss of FAM111B protease mutated in hereditary fibrosing poikiloderma negatively regulates telomere length.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Even though FAM111B-deficient cells were proficient in DNA repair, they showed hallmarks of genomic
        instability such as increased levels of micronuclei and ultra-fine DNA bridges.
      explanation: Genomic-instability phenotypes in deficient cells.

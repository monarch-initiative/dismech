notes: >-
  No incidence or prevalence has been published; the GeneReviews chapter states that the prevalence is unknown, and
  published figures are literature case counts (about 30 patients in a 2022 liver review, 17 adults in a 2021
  chromosomal-instability study). Most phenotype frequencies come from one series of 15 affected individuals in ten
  families, several of them children who may still develop the adult-onset features, so the frequencies understate
  late manifestations. Two mechanistic readings coexist in the literature: an inducible-expression study shows
  amplified protease activity of disease mutants (gain of function), while a later study describes the disorder as
  dominant negative and reports telomere and genomic-instability phenotypes in FAM111B-deficient cells, and the
  GeneReviews chapter (last revised 2021) also describes a likely dominant-negative mechanism. The step from
  the cellular defect to organ fibrosis and fatty replacement has not been shown in any tissue or animal model; no
  POIKTMP animal model has been published.

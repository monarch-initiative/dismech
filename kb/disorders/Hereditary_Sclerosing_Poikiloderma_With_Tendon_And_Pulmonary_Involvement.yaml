name: Hereditary Sclerosing Poikiloderma With Tendon And Pulmonary Involvement
description: >-
  Autosomal dominant multisystem fibrosing genodermatosis (POIKTMP) caused by heterozygous germline missense or small
  in-frame variants in FAM111B, which encodes a nuclear trypsin-like serine protease. The disease variants cluster at
  the periphery of the protease domain, and disease-associated mutants show amplified proteolytic activity that
  displaces DNA replication and transcription factors from chromatin and triggers caspase-dependent apoptosis in
  cultured cells. Poikiloderma begins in the first months of life and is accompanied by sparse hair, hypohidrosis
  with heat intolerance, lymphedema and eczema-like lesions. Triceps surae contractures shortening the Achilles tendon
  appear in childhood, followed in most patients by progressive proximal and distal weakness with fibroadipose
  replacement of skeletal muscle. Lung function is restrictive, from respiratory muscle weakness, interstitial
  fibrosis or both, and pulmonary fibrosis in adulthood can be fatal within a few years of respiratory symptoms.
  Exocrine pancreatic insufficiency from pancreatic atrophy with fatty replacement, liver disease ranging from
  transaminase elevation to cirrhosis, growth retardation and cataract occur in some patients. Autopsy shows fibrosis
  and fatty degeneration across many organs. Pancreatic adenocarcinoma has been reported in a small number of adults.
  About half of cases are de novo.

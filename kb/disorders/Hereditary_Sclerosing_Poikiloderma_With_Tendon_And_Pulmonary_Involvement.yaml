    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      POIKTMP is inherited in an autosomal dominant manner. In approximately 50% of affected individuals, the FAM111B
      pathogenic variant is inherited and in approximately 50% it is de novo.
    explanation: GeneReviews inheritance statement with de novo fraction.

genetic:
- name: FAM111B
  gene_term:
    preferred_term: FAM111B
    term:
      id: hgnc:24200
      label: FAM111B
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous germline variants, inherited in about half of affected individuals and de novo in the other half.
    Most are missense variants clustered at codons 621 to 629 near the C-terminal trypsin-like peptidase domain; a
    second group lies around codons 416 to 430 (p.Phe416Ser, p.Lys421del, p.Gln430Pro). The original variants were
    absent from public databases and from 388 ethnically matched controls. In the main series, variants at codons 625,
    627 and 628 were associated with earlier onset and more severe disease than those at codons 430 and 621, a
    preliminary observation from a small number of patients. No deletion or duplication has been reported.
  evidence:
  - reference: PMID:24268661
    reference_title: Mutations in FAM111B cause hereditary fibrosing poikiloderma with tendon contracture, myopathy, and pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation segregated with the disease in one large pedigree, and mutations were de novo in two other pedigrees.
    explanation: Segregation and de novo occurrence establishing causality.
  - reference: PMID:24268661
    reference_title: Mutations in FAM111B cause hereditary fibrosing poikiloderma with tendon contracture, myopathy, and pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three mutations were absent from public databases and were not observed on Sanger sequencing of 388
      ethnically matched control subjects.
    explanation: Absence from controls.
  - reference: PMID:26471370
    reference_title: Expanding the clinical spectrum of hereditary fibrosing poikiloderma with tendon contractures, myopathy and pulmonary fibrosis due to FAM111B mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HFP with tendon contractures, myopathy and pulmonary fibrosis, is a multisystemic disorder due to autosomal
      dominant FAM111B mutations.
    explanation: Replication in a ten-family series.
  variants:
  - name: c.1879A>G p.(Arg627Gly)
    description: >-
      Recurrent missense variant, de novo in the first French patient and found in further unrelated families; the
      two Italian patients with lymphocyte chromosomal instability carry it.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34358284
      reference_title: "Spontaneous chromosomal instability in peripheral blood lymphocytes from two molecularly confirmed Italian patients with Hereditary Fibrosis Poikiloderma: insights into cancer predisposition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the suggestive matching with the autosomal dominant syndrome Poikiloderma, Hereditary Fibrosing with Tendon
        Contracture, Myopathy and Pulmonary fibrosis (POIKTMP) was confirmed by identification of the c.1879A>G
        (p.Arg627Gly) alteration in FAM111B.
      explanation: The variant in two further unrelated patients.
  - name: c.1883G>A p.(Ser628Asn)
    description: >-
      Recurrent missense variant; the recombinant mutant protein has markedly elevated autoproteolytic activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32776417
      reference_title: FAM111 protease activity undermines cellular fitness and is amplified by gain-of-function mutations in human disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        a disease-associated FAM111B S628N mutant displayed markedly elevated auto-proteolytic activity in vitro
      explanation: Functional evidence of gain of function for this allele.
  - name: c.1261_1263delAAG p.(Lys421del)
    description: >-
      In-frame deletion outside the protease-domain hotspot, segregating in a family whose leading feature was
      exocrine pancreatic dysfunction; GeneReviews notes that variants in this region may be associated with a less
      severe extracutaneous phenotype.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26495788
      reference_title: FAM111B Mutation Is Associated With Inherited Exocrine Pancreatic Dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A heterozygous germline in-frame deletion in the gene FAM111B (c.1261_1263delAAG, p.Lys421del) cosegregated
        with the phenotype: the variant was present in all affected relatives genotyped and absent in all unaffected
        relatives genotyped.
      explanation: Cosegregation in a multigenerational family.
  - name: c.1886T>G p.(Phe629Cys)
    description: De novo missense variant in an adult with cirrhosis and steroid-responsive interstitial pneumonia.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35601499
      reference_title: "Case Report: Hereditary Fibrosing Poikiloderma With Tendon Contractures, Myopathy, and Pulmonary Fibrosis (POIKTMP) Presenting With Liver Cirrhosis and Steroid-Responsive Interstitial Pneumonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutation analysis of FAM111B revealed a novel and de novo heterozygous missense mutation, c.1886T > G
        (p(Phe629Cys)), through which we were able to diagnose the patient with POIKTMP.
      explanation: De novo variant at the 621-629 cluster.

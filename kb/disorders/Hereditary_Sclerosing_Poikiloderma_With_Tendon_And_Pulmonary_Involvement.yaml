    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key features consist of: (i) early-onset poikiloderma, hypotrichosis and hypohidrosis; (ii) multiple
      contractures, in particular triceps surae muscle contractures; (iii) diffuse progressive muscular weakness; (iv)
      pulmonary fibrosis in adulthood and (v) other features including exocrine pancreatic insufficiency, liver
      impairment and growth retardation.
    explanation: Clinical features defined in the main series.
- name: Molecular Genetic Testing of FAM111B
  description: >-
    The diagnosis is established by a heterozygous pathogenic FAM111B variant in a proband with early-onset
    poikiloderma and other findings, especially contractures or weakness. Single-gene sequencing or a multigene panel
    is used when the phenotype is recognized, exome or genome sequencing when it is not. Deletion/duplication analysis
    is unlikely to help, as no intragenic deletion or duplication has been reported.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing

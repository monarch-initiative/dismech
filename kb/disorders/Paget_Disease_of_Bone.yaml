    term:
      id: UBERON:0001474
      label: bone element
  downstream:
  - target: Disorganised Compensatory Bone Formation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30671590
    reference_title: Paget's Disease of Bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: characterized by increased osteoclast-mediated bone resorption and a subsequent compensatory increase
      in bone formation
    explanation: States the resorption step and its temporal relationship to the formation step that follows.
- name: Disorganised Compensatory Bone Formation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: Osteoblasts respond to the resorption by forming bone rapidly and without the normal lamellar
    organisation. The result is the mosaic of woven and lamellar bone with irregular cement lines that is the
    pathological signature. The osteoblast is behaving normally here - it is coupling to resorption as it should
    - which is why the disease is properly described as osteoclast-driven rather than as a disorder of formation.
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  downstream:
  - target: Expanded Structurally Weak Hypervascular Bone
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30671590
    reference_title: Paget's Disease of Bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a subsequent compensatory increase in bone formation, resulting in a disorganized mosaic of woven
      and lamellar bone at one or more affected skeletal sites
    explanation: Describes both the compensatory formation and the mosaic tissue architecture it produces.
- name: Expanded Structurally Weak Hypervascular Bone
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: 'The remodelled bone is enlarged in diameter, mechanically inferior and highly vascular. That
    combination generates the entire clinical burden: pain, bowing deformity of weight-bearing long bones,
    secondary osteoarthritis at adjacent joints, pathological fracture, cranial nerve compression with hearing
    loss where the skull is involved, and - in extensive polyostotic disease - a high-output cardiac state
    from the vascularity. Rarely the same site undergoes neoplastic transformation.'
  locations:
  - preferred_term: bony pelvis
    term:
      id: UBERON:0001270
      label: bony pelvis
  - preferred_term: femur
    term:
      id: UBERON:0000981
      label: femur
  - preferred_term: cranium
    term:
      id: UBERON:0003128
      label: cranium
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:
  - reference: PMID:30671590
    reference_title: Paget's Disease of Bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a result, bone pain, noticeable deformities, arthritis at adjacent joints, and fractures can
      occur.
    explanation: Enumerates the clinical consequences that follow from the abnormal bone at this node.
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder predominantly affects the axial skeleton, with the highest incidence observed in
      the pelvis (70%), femur (55%), lumbar spine (53%), cranium (42%), and tibia (32%).
    explanation: Gives the skeletal distribution recorded in this node's locations.
  - reference: PMID:30671590
    reference_title: Paget's Disease of Bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In a small proportion of cases neoplastic degeneration in osteosarcoma, or, less frequently, giant
      cell tumor has been also described at PDB sites.
    explanation: Establishes neoplastic transformation as an outcome arising at pagetic sites.
phenotypes:
- category: Musculoskeletal
  name: Pagetic Bone Pain
  frequency: FREQUENT
  description: The commonest symptom when the disease is symptomatic at all, reported by about half of patients.
    Notably it is the one clinical feature that has not become less common as the disease has otherwise grown
    milder.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
  evidence:

has_subtypes:
- name: SQSTM1-related
  display_name: SQSTM1/p62-related Paget disease (PDB2)
  description: The commonest genetic form. Variants affect the ubiquitin-associated (UBA) domain of SQSTM1,
    recurrently p.Pro392Leu, and are found in both familial and sporadic disease. They are associated with
    more severe and more extensive clinical expression than sporadic disease without an identified variant.
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations affecting the UBA domain of SQSTM1 have been detected in both familial and sporadic
      PDB cases, and these mutations are often associated with severe clinical expression.
    explanation: Establishes the UBA-domain localisation and the severity association that define this subtype.
- name: ZNF687-related
  display_name: ZNF687-related Paget disease (PDB6)
  description: A rarer germline cause associated with severe, early-onset, polyostotic disease and a predisposition
    to giant cell tumour arising in pagetic bone.
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Germline mutations in other genes such as TNFRSF11A, ZNF687 and PFN1, have also been associated
      with the development of the disease.
    explanation: Names ZNF687 among the established germline causes beyond SQSTM1.
inheritance:
- name: Autosomal dominant with incomplete age-dependent penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Familial clustering is common and SQSTM1-linked families segregate the variant dominantly, but
    penetrance is incomplete and rises with age, and expressivity varies within families. That variable expressivity
    is itself part of the argument for an environmental co-factor, since relatives sharing the same allele
    do not share the same disease.
  evidence:
  - reference: PMID:30671590
    reference_title: Paget's Disease of Bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the focal nature of lesions, the decline in prevalence rates, and the incomplete penetrance of
      the disease among family members suggest that one or more environmental triggers may play a role in the
      pathophysiology of PDB
    explanation: States the incomplete penetrance among family members and the inference drawn from it.
- name: Complex polygenic susceptibility
  description: Beyond the monogenic families, common variants at seven loci - CSF1, OPTN, TNFRSF11A, TM7SF4/DCSTAMP,
    PML, RIN3 and NUP205 - contribute to risk. Most act on osteoclast differentiation or fusion, which is the
    same pathway the monogenic causes reach by a different route.
  evidence:
  - reference: PMID:21623375
    reference_title: Genome-wide association identifies three new susceptibility loci for Paget's disease of
      bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we extended this study, identified three new loci and confirmed their association with PDB
      in 2,215 affected individuals (cases) and 4,370 controls from seven independent populations.
    explanation: The association study establishing the common-variant contribution to risk.
pathophysiology:
- name: SQSTM1 UBA-Domain Variant Impairs Selective Autophagy
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: p62/sequestosome-1 uses its UBA domain to bind ubiquitinated cargo, which is how it links that
    cargo both to autophagic degradation and to NF-kB signalling. UBA-domain variants impair ubiquitin binding,
    so damaged protein is cleared less efficiently and the NF-kB arm loses a regulator. The consequence is
    a corruption of two coupled housekeeping functions rather than the loss of a single enzyme activity, which
    is part of why the resulting disease is focal and late rather than congenital and generalised.
  genetic_context:
    gene:
      preferred_term: SQSTM1
      term:
        id: hgnc:11280
        label: SQSTM1
  biological_processes:
  - preferred_term: autophagy
    modifier: ABNORMAL
    term:
      id: GO:0006914
      label: autophagy
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
  cell_types:

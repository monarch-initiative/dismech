    reference_title: 'Sarcomas arising in Paget disease of bone: a clinicopathologic analysis of 70 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Survival ranged from 1 month to 20 years, with a 5-year survival rate of 10%.
    explanation: The survival figure quoted in this entry.
  - reference: PMID:17550323
    reference_title: 'Sarcomas arising in Paget disease of bone: a clinicopathologic analysis of 70 cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There is no significant correlation between the number of bones involved with Paget disease or
      the duration of disease and development of Paget sarcoma.
    explanation: The negative result behind this entry's statement that sarcoma risk is not predictable from
      disease burden.

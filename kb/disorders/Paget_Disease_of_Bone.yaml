    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The p62 protein plays a crucial role in autophagy, a process involved in removing damaged cellular
      components. When this function is compromised, it can lead to the accumulation of damaged proteins in
      bone cells.
    explanation: States the autophagic function of p62 and the consequence of losing it in bone cells.
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations affecting the UBA domain of SQSTM1 have been detected in both familial and sporadic
      PDB cases
    explanation: Localises the disease-causing variants to the UBA domain this node is about.
- name: Osteoclast Precursor Hypersensitivity to RANKL
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: 'Osteoclast differentiation is governed by the RANK-RANKL-OPG triad: RANKL from osteoblasts
    and marrow stroma drives differentiation through RANK on precursors, and OPG restrains it as a decoy receptor.
    Pagetic precursors are hypersensitive to RANKL, and the susceptibility loci that emerged from association
    studies sit largely in this pathway - RANK itself, CSF1, and DCSTAMP, which mediates precursor fusion.
    The most direct evidence that this axis is the disease''s centre of gravity comes from a different disease:
    loss of OPG causes juvenile Paget disease, a generalised recessive disorder of the same remodelling machinery.'
  biological_processes:
  - preferred_term: positive regulation of osteoclast differentiation
    modifier: INCREASED
    term:
      id: GO:0045672
      label: positive regulation of osteoclast differentiation
  cell_types:
  - preferred_term: osteoclast precursor
    term:
      id: CL:0000092
      label: osteoclast
  downstream:
  - target: Giant Hypernucleated Hyperactive Osteoclasts
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: OPG, a decoy receptor, binds to RANKL to prevent RANK binding. Thereby, OPG suppresses the differentiation
      of osteoclasts.
    explanation: Describes the regulatory triad whose balance this node concerns.
  - reference: PMID:21623375
    reference_title: Genome-wide association identifies three new susceptibility loci for Paget's disease of
      bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We previously identified variants at the CSF1, OPTN and TNFRSF11A loci as risk factors for PDB
      by genome-wide association study.
    explanation: Places the susceptibility loci in the osteoclast differentiation pathway described here.
- name: Giant Hypernucleated Hyperactive Osteoclasts
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: The cellular signature of the disease, and the finding that makes a pagetic biopsy recognisable.
    Osteoclasts at affected sites are larger, more numerous and contain many more nuclei than normal, and they
    carry characteristic nuclear inclusion bodies. Everything downstream is a consequence of what these cells
    do; nothing about the osteoblast is primarily abnormal.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  downstream:
  - target: Focal Accelerated Bone Resorption
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This results in increased bone remodeling and mass, with the osteoclasts being larger in size,
      number, and with more nuclei compared to normal cells
    explanation: The direct description of the abnormal osteoclast morphology this node names.
- name: Focal Accelerated Bone Resorption
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: 'Intense, localised resorption produces the early lytic phase - osteoporosis circumscripta in
    the skull, and in long bones an advancing flame-shaped lytic front that begins at one end and travels along
    the shaft. The focality is the part that is still unexplained: the genetic lesion is in every cell, but
    only a few sites are affected, and lesions do not cross joint spaces.'
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  locations:

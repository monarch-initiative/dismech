    reference_title: 'Decline in clinical severity of Paget''s disease of bone: Comparison between a contemporary
      cohort and a historical cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no significant difference for pagetic bone pain (52.0 % vs. 52.6 %; p = 1.0000)
    explanation: Gives the frequency in both cohorts and, in doing so, shows pain did not decline with the
      rest of the phenotype.
- category: Laboratory
  name: Elevated Serum Alkaline Phosphatase
  frequency: VERY_FREQUENT
  description: The biochemical hallmark and the usual route to diagnosis, since around 70% of patients are
    asymptomatic and come to attention through an incidental ALP elevation. It tracks disease activity and
    extent, which is what makes it usable for monitoring as well as detection.
  phenotype_term:
    preferred_term: Elevated circulating alkaline phosphatase concentration
    term:
      id: HP:0003155
      label: Elevated circulating alkaline phosphatase concentration
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In around 70% of patients, PDB is asymptomatic and is typically discovered incidentally through
      elevated alkaline phosphatase (ALP) values
    explanation: Establishes both the asymptomatic majority and ALP elevation as the route to detection.
- category: Musculoskeletal
  name: Bone Deformity
  frequency: OCCASIONAL
  description: 'Bowing of weight-bearing long bones, skull enlargement and kyphosis. This is among the features
    that has declined most sharply: 13% of a contemporary Quebec cohort versus 54% of the historical one.'

environmental:
- name: Unidentified declining environmental exposure
  description: Something in the environment is required, and it is going away. Standardised UK incidence fell
    from 0.75 to 0.20 per 10,000 person-years between 1999 and 2015 - far too fast to be genetic drift - and
    the same decline has been reported in other countries. Together with the focality of lesions and the incomplete
    penetrance within families, this is the case for an environmental co-factor acting on a genetically susceptible
    osteoclast lineage. Its identity is unknown. The long-standing paramyxovirus hypothesis is discussed separately
    and is not currently supported.
  influences_mechanisms:
  - target: Osteoclast Precursor Hypersensitivity to RANKL
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Modelled as the second hit that converts inherited susceptibility into focal disease. The
      link is inferred from epidemiology and penetrance, not from a demonstrated exposure-to-osteoclast mechanism,
      and the target is the pathway the genetics implicate rather than a measured one.
    evidence:
    - reference: PMID:30671590
      reference_title: Paget's Disease of Bone.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: The exact nature of these triggers and how they might interact with the genetic factors are
        less understood
      explanation: PARTIAL by design - the source states that the interaction between trigger and genotype
        is not understood, which is precisely the strength this link should carry.
  evidence:
  - reference: PMID:33742666
    reference_title: 'Incidence of Paget''s disease of bone in the UK: evidence of a continuing decline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The reason for the decline in incidence remains unknown, although the rapidity of change points
      to an alteration in one or more environmental determinants.
    explanation: The epidemiological argument for an environmental determinant, and for its being unidentified.
  - reference: PMID:33742666
    reference_title: 'Incidence of Paget''s disease of bone in the UK: evidence of a continuing decline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The overall standardized incidence decreased from 0.75/10 000 person-years in 1999 to 0.20/10
      000 person-years in 2015.
    explanation: Quantifies the decline this entry rests on.
  notes: No exposure_term is bound because the exposure is not identified. ECTO cannot represent "an unknown
    environmental determinant", and binding a speculative term (a paramyxovirus exposure, coal smoke, livestock
    contact) would assert something the evidence does not support.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1500.0
  rate_low: 1500.0
  rate_high: 8300.0
  notes: Reported as a 1.5%-8.3% prevalence range, normalised here to 1,500-8,300 per 100,000 with the lower

- category: Neoplastic
  name: Sarcomatous Transformation
  frequency: VERY_RARE
  description: Osteosarcoma arising within pagetic bone. Rare, high-grade, and with a dismal prognosis - 5-year
    survival around 10%. It arises in older men, predominantly in the axial skeleton and pelvis, and notably
    does not correlate with how much bone is involved or how long the disease has been present, so it cannot
    be predicted from disease burden.

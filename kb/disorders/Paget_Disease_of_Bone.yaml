name: Paget Disease of Bone
creation_date: '2026-08-28T22:30:00Z'
category: Complex
description: 'Paget disease of bone is a focal disorder of remodelling. Its defining lesion is the osteoclast:
  in affected sites the osteoclasts are larger, more numerous and carry far more nuclei than normal, and they
  resorb bone at a rate the skeleton is not built to sustain. Osteoblasts then respond normally to an abnormal
  stimulus, laying down bone fast and without organisation, so the resorbed site is replaced by a mosaic of
  woven and lamellar bone that is expanded, hypervascular and mechanically inferior.

  Two features make it unlike most metabolic bone disease. It is focal - a germline SQSTM1 variant is present
  in every cell, yet lesions appear at a handful of sites and characteristically do not cross joints - and
  it is disappearing. UK standardised incidence fell by roughly two thirds between 1999 and 2015, over a period
  far too short for the gene pool to have changed. Both observations point the same way: the genetics set susceptibility
  and something environmental, still unidentified, decides where and whether disease occurs.

  The therapeutic story contains a genuine surprise, and it is the reason this entry separates the biochemical
  target from the clinical one. A single 5 mg infusion of zoledronic acid suppresses bone turnover more durably
  than any earlier bisphosphonate - one relapse in 152 patients over 6.5 years. But when normalising turnover
  was tested directly against treating symptoms in a 502-patient randomised trial, it produced no reduction
  in fracture, no fewer orthopaedic procedures, and no better quality of life. Excellent control of the biochemistry
  is achievable and is not, by itself, the point.'

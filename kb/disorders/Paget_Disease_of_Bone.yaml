notes: 'Scope. This entry covers classic adult-onset Paget disease of bone. MONDO places five descendants under
  MONDO:0005382, and they do not all belong in one entry. PDB2, PDB3, PDB4 and PDB6 are genetic loci for the
  same disease and are handled as has_subtypes here (only those with evidence in the reviewed literature are
  recorded). Juvenile Paget disease (MONDO:0009394) is excluded: it is autosomal recessive, usually from biallelic
  loss of TNFRSF11B/osteoprotegerin, presents in infancy, and is generalised rather than focal. It is a different
  disease that shares a pathway, and it keeps its own curation stub.

  Deep research. Curated with a single OpenScientist deep-research report (research/Paget_Disease_of_Bone-deep-research-openscientist.md).
  Its reference validation reported needs_review with three unsupported quotes (PMID:38963497, PMID:33768371,
  PMID:21515589); no quoted material from those three was reused here. Its term validation flagged HP:0002750,
  which the report labelled "Abnormal long bone morphology" but which HPO calls "Delayed skeletal maturation";
  the deformity phenotype in this entry is bound to HP:0006487 (Bowing of the long bones) instead. A second
  term error not caught by the report''s own validation was found during curation: the report suggested UBERON:0000033
  for skull, which is "head"; this entry uses UBERON:0003128 (cranium).'

diagnosis:
- name: Serum Total Alkaline Phosphatase
  description: The first-line biochemical test, used both to detect disease and to follow activity. Not specific
    - it rises in liver disease and pregnancy, so bone-specific ALP is used where those confound - and not
    perfectly sensitive, since limited monostotic disease can be biochemically silent.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, ALP levels can also be elevated in other conditions, such as liver disease or during
      pregnancy, making additional tests necessary for diagnosis confirmation
    explanation: States the specificity limitation that this entry describes.
- name: Radionuclide Bone Scintigraphy
  description: 'Technetium-99m bone scan, used after diagnosis to map the full extent of skeletal involvement.
    It answers a different question from the radiograph: the X-ray characterises a lesion, the scan finds the
    others.'
  diagnosis_term:
    preferred_term: radionuclide imaging
    term:
      id: NCIT:C62667
      label: Radionuclide Imaging
  evidence:
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: A set of plain X-rays and bone scintigraphy are used to evaluate PDB, but bone scintigraphy may
      be negative in some cases.
    explanation: PARTIAL because the source establishes scintigraphy's role in evaluation while noting it can
      be falsely negative, rather than reporting a sensitivity figure for extent mapping.
treatments:
- name: Zoledronic Acid
  therapeutic_modality: SMALL_MOLECULE
  description: A single 5 mg intravenous infusion, and the most effective bisphosphonate tested in this disease
    by a wide margin. Therapeutic response was 97% against 45% for pamidronate in a head-to-head randomised
    comparison, and over 6.5 years of follow-up without retreatment relapse occurred in 1 of 152 patients given
    zoledronate against 23 of 115 given risedronate.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Giant Hypernucleated Hyperactive Osteoclasts
    treatment_effect: INHIBITS
    description: Acts on the osteoclast directly, which is why it works so well on the biochemistry - it targets
      the cell that drives the whole pathograph.
  evidence:
  - reference: PMID:17605632
    reference_title: Comparison of different intravenous bisphosphonate regimens for Paget's disease of bone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At 6 mo, 97% of patients receiving zoledronate had a therapeutic response compared with 45% of
      patients receiving pamidronate.
    explanation: The head-to-head randomised comparison behind the response figures quoted here.
  - reference: PMID:21638319
    reference_title: 'A single infusion of zoledronic acid produces sustained remissions in Paget disease:
      data to 6.5 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapse rates were substantially greater in the risedronate group (23 of 115, 20%) than in those
      treated with zoledronic acid (1 of 152, 0.7%, p < .001)
    explanation: The long-term durability result quoted in this entry.
- name: Symptom-Directed Rather Than Turnover-Directed Management
  therapeutic_modality: OTHER
  description: This is a treatment-strategy entry rather than an agent, because the strategy question has been
    answered directly and the answer is counterintuitive. The PRISM-EZ trial randomised 502 patients to intensive
    bisphosphonate therapy aimed at normalising bone turnover versus bisphosphonates given only for pain. Intensive
    treatment achieved markedly better biochemistry and produced no reduction in fracture, no fewer orthopaedic
    procedures, and no better quality of life - with a non-significant increase in fractures, orthopaedic events
    and serious adverse events. In established disease, therefore, the target is symptoms, not the ALP.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Expanded Structurally Weak Hypervascular Bone
    treatment_effect: MODULATES
    description: Addresses the clinical consequences of the abnormal bone rather than the remodelling rate
      that produces it.
  evidence:
  - reference: PMID:28176386
    reference_title: 'Long-Term Randomized Trial of Intensive Versus Symptomatic Management in Paget''s Disease
      of Bone: The PRISM-EZ Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were no clinically important differences in quality of life measures or bone pain between
      the treatment groups.
    explanation: The primary comparative result on symptoms and quality of life.
  - reference: PMID:28176386
    reference_title: 'Long-Term Randomized Trial of Intensive Versus Symptomatic Management in Paget''s Disease
      of Bone: The PRISM-EZ Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The results of this study suggest that in patients with established PDB, bisphosphonate therapy
      should focus on control of symptoms rather than suppression of bone turnover.
    explanation: The trial's own conclusion, which is the strategy this entry records.
discussions:
- discussion_id: pdb_environmental_trigger_unidentified
  kind: KNOWLEDGE_GAP
  attaches_to:
  - environmental#Unidentified declining environmental exposure
  - pathophysiology#Focal Accelerated Bone Resorption
  prompt: What is the environmental exposure whose withdrawal is making Paget disease disappear, and is the
    paramyxovirus hypothesis dead?
  rationale: 'Three observations demand an environmental co-factor and none identifies it. Incidence has fallen
    by roughly two thirds in the UK in sixteen years and similarly elsewhere; lesions are focal despite a germline
    variant in every cell; and penetrance within SQSTM1 families is incomplete. A purely genetic account explains
    none of these.

    The candidate that has absorbed most of the effort is chronic paramyxovirus infection of the osteoclast
    - measles, RSV or canine distemper virus - and it has not held up. Measles RNA was reported in pagetic
    osteoclasts by in-situ hybridisation, but PCR failed to find paramyxovirus sequence in pagetic bone, pet
    ownership was not a risk factor, and a serological study of several hundred patients found no elevation
    of measles, distemper or RSV antibodies. The weight of evidence is against it. Weaker recent candidates
    - rural residence and breeding-cattle density, historical domestic coal burning - are ecological correlations
    without a mechanism.

    This gap is unusually well posed and unusually urgent, because the exposure is disappearing on its own.
    Whatever it is, the population of people who encountered it is ageing out, and the natural experiment that
    could identify it is closing.'
  proposed_experiments:
  - experiment_id: pdb_birth_cohort_exposure_reconstruction
    name: Birth-cohort exposure reconstruction in declining-incidence populations
    description: Use the steep incidence gradient across birth cohorts in populations with good historical
      exposure records to test candidate exposures - domestic solid-fuel combustion, livestock contact, childhood
      infection history - against year and place of birth rather than against current residence, since the
      relevant exposure is likely to be decades before diagnosis.
    would_support:
    - environmental#Unidentified declining environmental exposure
    supporting_outcome:
    - A candidate exposure whose historical prevalence tracks the birth-cohort incidence gradient in more than
      one country, with a dose-response relationship.
    refuting_outcome:
    - No candidate exposure tracks the cohort gradient, which would move the explanation toward a change in
      diagnostic practice or ascertainment rather than a change in biology.
- discussion_id: pdb_biochemical_remission_is_not_clinical_benefit
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Zoledronic Acid
  - treatments#Symptom-Directed Rather Than Turnover-Directed Management
  prompt: Why does suppressing bone turnover so effectively fail to improve fractures, orthopaedic outcomes
    or quality of life?
  rationale: 'Zoledronic acid does what it is supposed to do: it suppresses the osteoclast, normalises ALP
    in most patients, and holds that for years. If the pagetic burden were caused by ongoing high turnover,
    that should translate into fewer fractures and better function. In PRISM-EZ it did not, and the point estimates
    for fracture and orthopaedic procedures moved the wrong way.

    The most economical explanation is that the damage is architectural and already done. Once a site has been
    remodelled into expanded mosaic bone, the mechanical deficit is a property of the tissue, not of the rate
    at which it is turning over, and stopping the turnover does not restore the architecture. If that is right,
    the interesting question is not whether to suppress turnover but whether there is an earlier window - before
    a lesion has remodelled - in which suppression would matter. That has never been tested, because trials
    enrol patients with established disease and asymptomatic early disease is not systematically identified.

    A second possibility, harder to exclude, is that suppressed turnover impairs repair of microdamage in already-abnormal
    bone, which would explain the direction of the non-significant fracture excess rather than dismissing it
    as noise.'

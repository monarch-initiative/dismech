    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Glycemic load is proposed to act through insulin and IGF-1 signalling.
      IGF-1 is the half of that this node names, alongside androgen; insulin
      is the proposed route to it and is not named there. The evidence points
      both ways and both directions are carried here rather than only the
      supporting one: an intervention comparison favouring low glycemic load,
      and a systematic review that found no clear dietary effect. Recorded as
      a modifier of lesion burden, not a cause of acne.
    evidence:
    - reference: PMID:32748305
      reference_title: "Effects of Diet on Acne and Its Response to Treatment."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "individuals with acne who consume diets with a low glycemic load have reduced acne lesions compared with individuals on high glycemic load diets."
      explanation: >-
        Reports fewer acne lesions on low glycemic load diets than on high
        ones. Limited intervention evidence, which is why this stays partial.
    - reference: PMID:23210645
      reference_title: "Epidemiology of acne vulgaris."
      supports: REFUTE
      evidence_source: OTHER
      snippet: "A systematic review in 2005 found no clear evidence of dietary components increasing acne risk."
      explanation: >-
        A 2005 systematic review found no clear evidence that dietary
        components increase acne risk. Carried on this link, at its existing
        refuting grade, so the contrary evidence travels with the claim rather
        than sitting apart from it.
  description: >-

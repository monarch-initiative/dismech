name: Acne Vulgaris
creation_date: '2026-01-23T23:13:39Z'
description: >-
  Acne vulgaris is a chronic inflammatory disorder of the pilosebaceous unit,
  usually affecting the face and trunk, that produces comedones with variable
  papules, pustules, nodules, pigmentary sequelae, and scarring. The canonical
  model involves interacting follicular differentiation and keratinization,
  androgen-responsive sebaceous activity, Cutibacterium acnes community or
  strain-dependent immune signaling, and inflammation rather than a simple
  bacterial infection. Recent human genetics and spatial-transcriptomic data
  additionally prioritize follicular stem/progenitor maintenance, cellular
  migration, and lesion-state-specific sebaceous differentiation, so the
  ordering of the major processes remains incompletely resolved.
category: Complex
parents:
- Inflammatory skin disease
- Pilosebaceous unit disorder

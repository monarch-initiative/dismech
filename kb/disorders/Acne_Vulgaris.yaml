inheritance:
- name: Polygenic inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Common acne has high familial heritability and a polygenic, multifactorial
    architecture. No single-gene Mendelian model explains acne vulgaris in the
    general population.
  evidence:
  - reference: PMID:37662507
    reference_title: "Genetic Variants Associated with Acne Vulgaris."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The phenomenon is influenced by polygenic inheritance or can be ascribed to the interplay between multiple genes and environmental factors."
    explanation: The genetics review explicitly characterizes acne as polygenic and multifactorial.
  - reference: PMID:23210645
    reference_title: "Epidemiology of acne vulgaris."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The heritability of acne is almost 80% in first-degree relatives."
    explanation: Familial epidemiology supports a substantial inherited component without identifying a Mendelian cause.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_pilosebaceous_interaction
  hypothesis_label: Canonical Multifactorial Pilosebaceous Model
  status: CANONICAL
  description: >-
    Follicular keratinization, androgen-responsive sebaceous activity, microbial
    community or strain effects, and innate/adaptive inflammation interact to
    produce acne lesions. These processes need not occur in one invariant linear
    order.
  evidence:
  - reference: DOI:10.1007/s13555-023-01079-8
    reference_title: "The Microbiome and Acne: Perspectives for Treatment"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "C. acnes acts in interplay with three other major patho-genetic factors, namely androgen-dependent hyperseborrhea, follicular keratinocyte hyper-proliferation, and inﬂammation [ 10, 11]."
    explanation: The review describes the canonical factors as interacting contributors.
- hypothesis_group_id: follicular_lineage_dysregulation
  hypothesis_label: Follicular Stem/Progenitor and Differentiation Model
  status: EMERGING
  description: >-
    Polygenic susceptibility may primarily disturb follicular stem/progenitor
    maintenance, cell migration, and pilosebaceous differentiation, with
    keratinization, sebaceous-state changes, and inflammation emerging in
    lesion-specific combinations.
  evidence:
  - reference: PMID:40689430
    reference_title: "The Genetics of Acne."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both GWAS and single gene disorders unequivocally indicate stem/progenitor cell maintenance and cellular migration as the most important processes in the pathogenesis of acne."
    explanation: A recent genetics synthesis proposes follicular lineage maintenance and migration as central mechanisms.
  - reference: GEO:GSE301280
    reference_title: "Spatial transcriptomics reveals dysfunctional lipid metabolism and abnormal pilosebaceous differentiation in acne vulgaris"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both lesion types exhibit increased AP-1 transcription factors and elevated FABP5, a chaperone that blunts retinoic acid receptor signaling."
    explanation: Human spatial data identify differentiation and retinoid-signaling abnormalities across lesion states.

diagnosis:
- name: Clinical lesion-pattern and severity assessment
  description: >-
    Diagnosis is usually clinical, based on comedonal, inflammatory, mixed, or
    nodulocystic morphology; face and/or trunk distribution; and severity,
    scarring, erythema, or hyperpigmentation. Most patients do not need routine
    laboratory or microbiologic testing, although selected presentations may
    warrant additional evaluation.
  evidence:
  - reference: PMID:34812859
    reference_title: "Management of Acne Vulgaris: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acne vulgaris is classified based on patient age, lesion morphology (comedonal, inflammatory, mixed, nodulocystic), distribution (location on face, trunk, or both), and severity (extent, presence or absence of scarring, postinflammatory erythema, or hyperpigmentation)."
    explanation: The review describes the clinical dimensions used to recognize and classify acne.
  - reference: PMID:34812859
    reference_title: "Management of Acne Vulgaris: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although most acne does not require specific medical evaluation, medical workup is sometimes warranted."
    explanation: Routine testing is unnecessary for typical acne, with targeted workup reserved for selected cases.

  distinguishing_features:
  - Persistent central facial erythema, flushing, or telangiectasia favors rosacea.
  - Burning or stinging and ocular or phymatous features favor rosacea over acne.
  evidence:
  - reference: PMID:28150107
    reference_title: "Acne and Rosacea."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rosacea is a chronic facial inflammatory dermatosis characterized by flushing (or transient facial erythema), persistent central facial erythema, inflammatory papules/pustules, and telangiectasia."
    explanation: The review provides the main rosacea features that distinguish it from acne.
- name: Folliculitis
  disease_term:
    preferred_term: folliculitis
    term:
      id: MONDO:0006552
      label: folliculitis
  description: Follicular papules or pustules, especially on the trunk or extremities, can resemble inflammatory acne.
  distinguishing_features:
  - A predominantly truncal or extremity follicular pustular eruption warrants evaluation for folliculitis rather than assuming acne.
  - The complete lesion pattern and distribution, including whether comedones are present, guide clinical distinction.
  evidence:
  - reference: PMID:12113648
    reference_title: "Pustular skin disorders: diagnosis and treatment."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Localized pustular eruptions are seen on the hands and feet in adults with pustulosis palmaris et plantaris and acrodermatitis continua (both of which may be variants of psoriasis); on the face in patients with acne vulgaris, rosacea, and perioral dermatitis; and on the trunk and/or extremities in patients with folliculitis."
    explanation: The review documents overlapping pustular morphology with a distribution that can help distinguish folliculitis.
discussions:
- discussion_id: acne_pathogenic_ordering
  prompt: >-
    How do follicular lineage state, sebaceous activity, microbial community
    structure, and inflammation vary across non-lesional skin, microcomedones,
    comedones, papules, and pustules, and which changes are causal initiators?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Pilosebaceous Differentiation
  - pathophysiology#Lesion-Context-Dependent Sebaceous Lipid Dysregulation
  - pathophysiology#C. acnes Community and Strain-Dependent Immune Signaling
  - pathophysiology#Early and Sustained Pilosebaceous Inflammation
  rationale: >-
    The traditional four-factor account remains clinically useful, but early
    inflammation, lesion-specific sebogenesis, strain-level microbiome effects,
    and new genetics all argue against a universal linear sequence from sebum
    through bacteria to inflammation. Cross-sectional tissue studies cannot establish
    temporal order. Longitudinal and paired spatial/single-cell sampling across
    lesion stages is needed to distinguish causes from responses.
  evidence:
  - reference: PMID:40689430
    reference_title: "The Genetics of Acne."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are, however, several problems with this supposed sequence of events"
    explanation: The genetics review explicitly challenges the conventional causal ordering.
  - reference: GEO:GSE301280
    reference_title: "Spatial transcriptomics reveals dysfunctional lipid metabolism and abnormal pilosebaceous differentiation in acne vulgaris"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "comedonal skin upregulates sebogenesis genes, whereas pustular skin downregulates sebogenesis."
    explanation: Lesion-state divergence argues against uniform sebaceous overproduction across acne.
  - reference: PMID:24062871
    reference_title: "The role of inflammation in the pathology of acne."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "evidence has emerged supporting a role for inflammation at all stages of acne lesion development, perhaps subclinically even before comedo formation"
    explanation: Early inflammation makes a strictly late inflammatory stage implausible.
notes: |
  Acne vulgaris is modeled as non-infectious; C. acnes is retained only as a
  commensal, community- and strain-dependent mechanistic contributor. Small,
  ancestry-limited candidate-polymorphism studies are not promoted to causal or
  susceptibility-gene assertions because replication is insufficient. The
  treatment list emphasizes evidence-based pharmacologic care from the 2024 AAD
  guideline; isolated peels, light/laser devices, photodynamic therapy,
  platelet-rich plasma, and post-procedure recovery products were removed rather
  than exported as established treatments of acne. The European self-report and global
  burden estimates are not interchangeable with self-reported online survey
  prevalence because ascertainment and case definitions differ.

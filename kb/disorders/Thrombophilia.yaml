animal_models:
- name: Platelet-specific Pros1 knockout mouse (Pros1lox/loxPf4-Cre+)
  species: Mouse
  genotype: Pros1lox/loxPf4-Cre+ (platelet lineage-restricted Pros1 deletion via Platelet factor 4-Cre)
  publication: DOI:10.1182/blood.2019003630
  description: >-
    A conditional knockout that eliminates protein S expression specifically
    in platelets (and their megakaryocyte precursors) while sparing the
    systemic, largely hepatocyte-derived plasma protein S pool.
  modeled_mechanisms:
  - target: Protein S Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of platelet-derived protein S increases venous thrombus
      propensity by impairing its cofactor role for activated protein C and
      tissue factor pathway inhibitor, limiting factor X activation and
      thrombin generation within the growing thrombus at low shear rates.
      It does not increase arterial thrombosis propensity, unlike the
      systemic human deficiency, which is not restricted to a low-shear
      vascular bed.
    limitations: >-
      This model isolates only the platelet-derived pool of protein S via a
      platelet-lineage-restricted knockout; it does not reproduce the
      systemic (predominantly hepatocyte-synthesized) protein S deficiency
      that defines the human hereditary disorder, so its venous-versus-arterial
      selectivity may not generalize to human patients with global protein S
      deficiency.
    readouts:
    - name: Venous (vena cava) thrombus propensity
      target: Protein S Deficiency
      direction: INCREASED
      interpretation: >-
        Platelet protein S loss increases thrombus formation at low shear
        (vena cava) but not at high shear (carotid artery), consistent with
        a cofactor role for APC/TFPI-mediated factor X control specifically
        within the growing venous thrombus.
      evidence:
      - reference: DOI:10.1182/blood.2019003630
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "inactivation of PSplt expression using the Platelet factor 4 (Pf4)-Cre transgene (Pros1lox/loxPf4-Cre+) in mice promotes thrombus propensity in the vena cava, where shear rates are low, but not in the carotid artery, where shear rates are high"
        explanation: Directly reports the venous-specific thrombus-propensity phenotype of the platelet Pros1 knockout mouse.
  evidence:
  - reference: DOI:10.1182/blood.2019003630
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within the growing thrombus"
    explanation: >-
      Establishes the mechanistic role of platelet-derived protein S as an
      APC/TFPI cofactor limiting thrombin generation, informative for the
      protein S deficiency node even though it isolates only the
      platelet-derived pool.

treatments:
- name: Acute Anticoagulation via Heparin-Potentiated Antithrombin
  description: >-
    Therapeutic unfractionated or low-molecular-weight heparin potentiates
    antithrombin-mediated inhibition of thrombin and factor Xa. Because
    heparin's mechanism depends on antithrombin, its anticoagulant effect
    can be attenuated in antithrombin deficiency; antithrombin concentrate
    replacement (below) addresses this specifically. Agent, dose, and
    duration are individualized to the clinical circumstances.
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: low molecular weight heparin
      term:
        id: NCIT:C2578
        label: Low Molecular Weight Heparin
  target_mechanisms:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    treatment_effect: INHIBITS
    description: >-
      Heparin-enhanced antithrombin activity inhibits thrombin and factor
      Xa, suppressing the coagulation reactions that generate and stabilize
      fibrin.
  evidence:
  - reference: PMID:20301542
    reference_title: Factor V Leiden Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first acute venous thrombosis is treated according to current guidelines."
    explanation: GeneReviews establishes standard-guideline anticoagulation as first-line management of acute VTE in this disease.
- name: Long-Term Oral Anticoagulation with Heparin-Bridged Initiation
  description: >-
    Long-term oral anticoagulation (vitamin K antagonists such as warfarin,
    or direct oral anticoagulants) reduces the risk of recurrent venous
    thromboembolism; duration is individualized to the risk of recurrence
    versus bleeding. When warfarin is used, initiation should be bridged
    with heparin and avoid high loading doses, because unbridged warfarin
    initiation can precipitate warfarin-induced skin necrosis, particularly
    in protein C or protein S deficiency (see Warfarin-Induced Transient
    Anticoagulant Depletion). Direct oral anticoagulants avoid this
    mechanism and are an emerging alternative in this setting.
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
  target_mechanisms:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    treatment_effect: INHIBITS
    description: >-
      Vitamin K antagonism or direct factor Xa/thrombin inhibition
      suppresses ongoing coagulation-cascade activation, reducing the risk
      of recurrent thrombus formation.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    treatment_effect: BYPASSES
    description: >-
      Heparin bridging during warfarin initiation, or use of a direct oral
      anticoagulant instead of warfarin, avoids the transient protein C/S
      depletion window that can precipitate skin necrosis.
  evidence:
  - reference: PMID:20301542
    reference_title: Factor V Leiden Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The duration of oral anticoagulation therapy should be based on an assessment of the risks for VTE recurrence and anticoagulant-related bleeding."
    explanation: GeneReviews frames long-term anticoagulation duration around the recurrence-versus-bleeding risk tradeoff.
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct oral anticoagulants (DOACs) like rivaroxaban and apixaban are emerging alternatives due to favorable pharmacokinetics"
    explanation: Identifies DOACs as an emerging alternative that avoids the warfarin-specific transient hypercoagulable window.
- name: Antithrombin Concentrate Replacement Therapy
  description: >-
    Human antithrombin III concentrate directly restores antithrombin
    activity in hereditary antithrombin deficiency, used during high-risk
    periods (surgery, pregnancy, peripartum) or for treatment/prevention of
    thromboembolism when heparin-potentiated endogenous antithrombin is
    insufficient because the endogenous pool itself is deficient.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antithrombin III (human)

name: Thrombophilia
creation_date: "2026-08-26T00:00:00Z"
category: Complex
synonyms:
- hypercoagulability
- hypercoagulable state
- prothrombotic state
- excessive blood clotting
parents:
- Blood Coagulation Disease
description: >-
  An inherited or acquired shift of hemostasis toward thrombosis, most often
  manifesting as venous thromboembolism (deep vein thrombosis and pulmonary
  embolism). This entry models the root concept plus the five classic
  hereditary subtypes: factor V Leiden (activated protein C resistance),
  prothrombin G20210A, and deficiencies of antithrombin, protein C, and
  protein S. Each subtype reflects either a gain of procoagulant function
  (factor V Leiden, prothrombin G20210A) or a loss of natural anticoagulant
  function (antithrombin, protein C, protein S deficiency), and all five
  converge on the same downstream coagulation-activation and thrombus-formation
  pathway. Acquired, antiphospholipid-antibody-mediated thrombophilia is a
  mechanistically distinct, autoimmune disease already modeled in
  Antiphospholipid_Syndrome.yaml and is cross-referenced rather than
  duplicated here. Penetrance is incomplete and strongly modified by
  transient exposures (surgery, immobility, pregnancy, estrogen, cancer,
  inflammation), so a hereditary thrombophilia genotype is a risk factor for,
  not a guarantee of, clinical thrombosis.
notes: >-
  Current expert guidance (ASH 2023, BSH 2022) favors selective, action-oriented
  thrombophilia testing rather than broad panel screening: testing is
  discouraged after clearly provoked VTE or before starting combined oral
  contraceptives, and is reserved for situations where the result would
  change management (e.g., anticoagulation duration after a major transient
  or hormonal risk factor, or selected cerebral/splanchnic thrombosis).
  MTHFR polymorphisms (C677T, A1298C) are not included among the classic
  thrombophilias modeled here because they are not associated with a
  clinically meaningful increase in VTE risk and are explicitly discouraged
  as thrombophilia markers by current guidelines (PMID:40429442).

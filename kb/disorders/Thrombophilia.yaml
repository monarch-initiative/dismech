        id: NCIT:C136824
        label: Therapeutic Human Antithrombin-III
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Antithrombin Deficiency
    treatment_effect: RESTORES
    description: >-
      Exogenous antithrombin concentrate directly restores plasma
      antithrombin activity, re-establishing serpin-mediated inhibition of
      thrombin and factor Xa.
  evidence:
  - reference: PMID:41706600
    reference_title: "Hereditary Antithrombin Deficiency in Pediatric Patients: Pathophysiology, Clinical Features, Diagnosis, and Antithrombin Replacement Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In August 2025, the U.S. Food and Drug Administration (FDA) approved an expanded indication for antithrombin III concentrate (human) to include pediatric patients with hATD, representing the first product specifically approved for this population."
    explanation: Documents the FDA-approved indication for antithrombin concentrate replacement therapy in hereditary antithrombin deficiency.


has_subtypes:
- name: Factor V Leiden Thrombophilia
  display_name: Factor V Leiden Thrombophilia (Activated Protein C Resistance)
  subtype_term:
    preferred_term: factor V Leiden thrombophilia
    term:
      id: MONDO:0008560
      label: thrombophilia due to activated protein C resistance
  description: >-
    The most common hereditary thrombophilia, caused by an F5 c.1601G>A
    (p.Arg534Gln; legacy p.Arg506Gln/1691G>A) missense variant that removes
    one of the proteolytic cleavage sites activated protein C (APC) uses to
    inactivate factor Va, rendering factor Va resistant to APC and prolonging
    procoagulant activity.
  genes:
  - preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
  evidence:
  - reference: PMID:20301542
    reference_title: Factor V Leiden Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of factor V Leiden thrombophilia is established in a proband by identification of a heterozygous or homozygous c.1601G>A (p.Arg534Gln) variant in F5 on molecular genetic testing."
    explanation: GeneReviews establishes the causal F5 variant and diagnostic criterion for this subtype.
  - reference: PMID:20301542
    reference_title: Factor V Leiden Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor V Leiden thrombophilia is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the inheritance pattern for this subtype.
- name: Prothrombin G20210A Thrombophilia
  display_name: Prothrombin G20210A Thrombophilia
  subtype_term:
    preferred_term: prothrombin G20210A thrombophilia
    term:
      id: MONDO:0008559
      label: thrombophilia due to thrombin defect
  description: >-
    The second most common hereditary thrombophilia, caused by an F2
    c.*97G>A (legacy g.20210G>A) variant in the prothrombin 3' untranslated
    region that increases prothrombin mRNA processing efficiency and raises
    circulating prothrombin concentration, expanding the substrate available
    for thrombin generation.
  genes:
  - preferred_term: F2
    term:
      id: hgnc:3535
      label: F2
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
  evidence:
  - reference: PMID:20301327
    reference_title: Prothrombin Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of prothrombin thrombophilia is established in a proband by identification of a heterozygous or homozygous 20210G>A variant (also known as c.*97G>A) in F2, the gene encoding prothrombin."
    explanation: GeneReviews establishes the causal F2 variant and diagnostic criterion for this subtype.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second most common cause of hereditary thrombophilia is the FII G20210A mutation occurring in the FII gene where guanine is replaced by adenine at position 20210 in the FII gene, resulting in an increased synthesis of FII"
    explanation: Describes the variant and its consequence of increased prothrombin (FII) synthesis.

    explanation: Supports natural-anticoagulant deficiencies as recognized VTE risk factors; the cohort's own events were dominated by usual-site VTE, so support for the unusual cerebral-sinus site specifically is partial.
- name: Resistance to Activated Protein C
  category: Laboratory
  subtype: Factor V Leiden Thrombophilia
  phenotype_term:

    evidence_source: HUMAN_CLINICAL
    snippet: "The review highlights that WSN predominantly affects middle-aged women and is often associated with protein C or S deficiency, initiation of high-dose warfarin without appropriate heparin bridging, and other thrombophilic disorders."
    explanation: Directly links this phenotype to underlying protein C or protein S deficiency and unbridged warfarin initiation.
- name: Neonatal Purpura Fulminans

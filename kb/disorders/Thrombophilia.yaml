    snippet: "PS functional activity assays measure the biological activity of PS by assessing its ability to function as a cofactor for APC in the inactivation of FVa and FVIIIa."
    explanation: Establishes reduced protein S activity as the diagnostic laboratory phenotype.
- name: Recurrent Pregnancy Loss
  category: Physical
  phenotype_term:
    preferred_term: Recurrent pregnancy loss
  description: >-
    An association between hereditary thrombophilia (particularly factor V
    Leiden, prothrombin G20210A, and protein S deficiency) and recurrent
    pregnancy loss has been reported, though the association is
    heterogeneous across studies and confounded by selection bias, and
    routine thrombophilia testing after pregnancy loss is not uniformly
    recommended.
  evidence:
  - reference: PMID:38674167
    reference_title: Risk Factors of Thrombophilia-Related Mutations for Early and Late Pregnancy Loss.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "With an odds ratios of 2.44 for FVL, 2.08 for PT, and a notably high 3.45 for protein S deficiency, their findings underscore the substantial impact of these genetic factors on RPL."
    explanation: Quantifies the association between the three thrombophilia subtypes and recurrent pregnancy loss; support is partial because the association is heterogeneous across the broader literature and causality is not established.
- name: Warfarin-Induced Skin Necrosis
  category: Physical

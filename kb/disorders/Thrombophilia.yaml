      label: exposure to oral contraceptive
  description: >-
    Estrogen-containing hormonal contraception supplies a "second hit" that
    can precipitate venous thromboembolism in carriers of an otherwise
    silent hereditary thrombophilia genotype.
  influences_mechanisms:
  - target: Pathological Venous Thrombus Formation
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Estrogen exposure amplifies the venous thrombosis risk of an
      underlying hereditary thrombophilia genotype.
    evidence:
    - reference: PMID:20301542
      reference_title: Factor V Leiden Thrombophilia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Women with a history of VTE who are heterozygous for the factor V Leiden variant and women homozygous for the factor V Leiden variant with or without prior VTE should avoid estrogen-containing contraception and HRT."
      explanation: GeneReviews management guidance directly reflects the exacerbating effect of estrogen exposure in factor V Leiden carriers.
  evidence:
  - reference: PMID:20301327
    reference_title: Prothrombin Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women heterozygous for 20210G>A with a history of VTE and women homozygous for 20210G>A with or without prior VTE should avoid estrogen-containing contraception and hormone replacement therapy (HRT)."

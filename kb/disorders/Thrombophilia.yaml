- name: Warfarin-Induced Transient Anticoagulant Depletion
  subtypes:
  - Protein C Deficiency
  - Protein S Deficiency
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Because protein C and protein S have short plasma half-lives (protein C
    approximately 8 hours) relative to the procoagulant vitamin K-dependent
    clotting factors (24-72 hours), initiating vitamin K antagonist therapy
    (warfarin) without heparin bridging causes their activity to fall faster
    than that of the procoagulant factors, producing a paradoxical transient
    hypercoagulable state. This is proportionally more severe when baseline
    protein C or protein S activity is already reduced by hereditary
    deficiency, and can precipitate microvascular thrombosis and skin
    necrosis.
  evidence:
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initiation of warfarin therapy leads to a rapid decline in protein C and protein S levels due to their relatively short half-lives (protein C ~8 h), in contrast to other vitamin K-dependent clotting factors such as factors II, IX, and X (24–72 h)"
    explanation: Directly describes the differential half-life mechanism that produces the transient hypercoagulable state.
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This creates a transient hypercoagulable state, especially in individuals with underlying deficiencies, predisposing them to microvascular thrombosis and subsequent skin necrosis"
    explanation: Links the transient hypercoagulable state to microvascular thrombosis and skin necrosis, particularly in individuals with underlying protein C/S deficiency.
  downstream:
  - target: Warfarin-Induced Skin Necrosis
    causal_link_type: DIRECT

phenotypes:

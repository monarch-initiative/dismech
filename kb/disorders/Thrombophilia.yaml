    reference_title: Protein C Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein C (PC) deficiency is a heritable or acquired risk factor for thrombophilia, with presentations varying from asymptomatic to venous thromboembolism to neonatal purpura fulminans, a life-threatening disorder."
    explanation: Establishes the clinical spectrum of this subtype from asymptomatic carriage to neonatal purpura fulminans.
  - reference: PMID:30702334
    reference_title: Protein C Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    explanation: GeneReviews frames management around the risk of VTE recurrence.
- name: Cerebral Venous Sinus Thrombosis
  category: Physical
  phenotype_term:
    preferred_term: Cerebral venous sinus thrombosis
    term:
      id: HP:0033724
      label: Cerebral venous sinus thrombosis
  description: >-

      label: hereditary thrombophilia due to congenital protein C deficiency
  description: >-
    A hereditary thrombophilia caused by PROC variants that reduce the level
    or function of protein C, a vitamin K-dependent zymogen that, once
    activated on the endothelial surface, inactivates factors Va and VIIIa.
    Severe (typically homozygous or compound heterozygous) deficiency can
    present as neonatal purpura fulminans.
  genes:
  - preferred_term: PROC
    term:
      id: hgnc:9451
      label: PROC
  inheritance:
  - name: Autosomal dominant inheritance

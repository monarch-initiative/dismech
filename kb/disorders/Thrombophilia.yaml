pathophysiology:
- name: Factor V Leiden-Mediated Activated Protein C Resistance
  subtypes:
  - Factor V Leiden Thrombophilia
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The F5 p.Arg534Gln (Leiden) variant abolishes an APC cleavage site on
    factor Va, so factor Va escapes proteolytic inactivation by activated
    protein C and remains procoagulant for longer than normal, sustaining
    prothrombinase activity and thrombin generation.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Arg506Gln mutation impairs the normal inactivation of FVa by APC, leading to an increased thrombin generation and a hypercoagulable state."
    explanation: Directly describes the molecular mechanism by which the Leiden variant increases thrombin generation.
  - reference: PMID:26492443
    reference_title: Factor V Leiden.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor V Leiden (FVLeiden ) is a common hereditary thrombophilia that causes activated protein C (APC) resistance."
    explanation: Confirms the APC-resistance mechanism and establishes this as a common hereditary thrombophilia.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Persistently active factor Va sustains prothrombinase complex activity,
      amplifying thrombin generation and downstream fibrin formation.
- name: Prothrombin G20210A-Associated Increased Prothrombin Synthesis
  subtypes:
  - Prothrombin G20210A Thrombophilia
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The F2 c.*97G>A 3' UTR variant increases prothrombin mRNA processing
    efficiency, raising steady-state plasma prothrombin concentration and
    expanding the substrate pool available for thrombin generation.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second most common cause of hereditary thrombophilia is the FII G20210A mutation occurring in the FII gene where guanine is replaced by adenine at position 20210 in the FII gene, resulting in an increased synthesis of FII"
    explanation: Directly describes the molecular consequence of the variant on prothrombin (FII) synthesis.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Elevated circulating prothrombin increases the substrate available to
      the prothrombinase complex, amplifying thrombin generation.
- name: Antithrombin Deficiency
  subtypes:
  - Antithrombin III Deficiency
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Reduced antithrombin level (type I) or function (type II) impairs
    serpin-mediated inhibition of thrombin, factor Xa, and other activated
    serine protease coagulation factors, removing a principal brake on the
    coagulation cascade.
  biological_processes:
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:41706600
    reference_title: "Hereditary Antithrombin Deficiency in Pediatric Patients: Pathophysiology, Clinical Features, Diagnosis, and Antithrombin Replacement Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antithrombin (AT), a glycoprotein, plays a key role in anticoagulation by inhibiting coagulation proteases."
    explanation: Establishes antithrombin's normal anticoagulant role, the loss of which defines this node.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antithrombin is a physiological natural anticoagulant. It belongs to the family of serine protease inhibitors (serpin), and it targets procoagulant serine proteases, such as activated FII, FIX, FX, and FXI, reducing clot formation."
    explanation: Describes the serpin mechanism and the range of coagulation proteases antithrombin normally inhibits.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Loss of antithrombin-mediated inhibition of thrombin and factor Xa
      permits unchecked amplification of the coagulation cascade.
- name: Protein C Deficiency
  subtypes:
  - Protein C Deficiency
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  description: >-
    Reduced level or function of protein C impairs generation of activated
    protein C (APC) on the thrombomodulin/endothelial protein C receptor
    complex, so APC-mediated proteolytic inactivation of factors Va and
    VIIIa is diminished and their procoagulant activity persists.
  biological_processes:
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is synthesized in hepatocytes and circulates as a heterodimeric complex composed of heavy and light chains."
    explanation: Establishes hepatocyte synthesis of protein C, supporting the cell-type binding on this node.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "APC exerts its anticoagulant function by interacting with PS as a cofactor, inactivating key coagulation factors. Specifically, APC cleaves FVa at Arg534, Arg334, and Arg707, effectively downregulating thrombin generation."
    explanation: Describes the normal APC-mediated inactivation of factor Va that is diminished when protein C is deficient.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A deficiency in PC leads to a hypercoagulable state, increasing the risk of VTE, including DVT and PE."
    explanation: Directly links protein C deficiency to a hypercoagulable state and venous thromboembolism.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Diminished APC-mediated inactivation of factors Va and VIIIa allows
      sustained prothrombinase and intrinsic tenase activity, amplifying
      thrombin generation.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    causal_link_type: DIRECT
    description: >-
      Because protein C has a short plasma half-life, a deficient baseline
      makes the transient post-warfarin-initiation fall in protein C
      activity proportionally more severe.
    evidence:
    - reference: PMID:41180656
      reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Protein C deficiency, most commonly implicated in WSN, is typically inherited in an autosomal dominant pattern."
      explanation: Identifies protein C deficiency as the most common predisposing condition for warfarin-induced skin necrosis.
- name: Protein S Deficiency
  subtypes:
  - Protein S Deficiency
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Reduced level or free/functional activity of protein S diminishes its
    cofactor support for APC-mediated inactivation of factors Va and VIIIa
    (and, independently, for tissue factor pathway inhibitor), so procoagulant
    factor activity persists longer than normal.
  biological_processes:
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein C and protein S are vitamin K-dependent glycoproteins that function as critical anticoagulants by regulating the coagulation cascade."
    explanation: Establishes protein S as a vitamin K-dependent anticoagulant regulator of the coagulation cascade.
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein S enhances the anticoagulant effect of protein C by serving as its cofactor; thus, deficiency in either protein leads to impaired inactivation of factors Va and VIIIa, fostering a prothrombotic state"
    explanation: Directly describes the cofactor mechanism and its loss in protein S deficiency.
  - reference: DOI:10.1182/blood.2019003630
    reference_title: Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within the growing thrombus"
    explanation: Mouse model evidence for the dual APC/TFPI cofactor mechanism of protein S in limiting venous thrombin generation.
  downstream:
  - target: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Diminished APC-cofactor activity allows sustained factor Va/VIIIa
      activity and amplified thrombin generation, particularly under the
      low-shear conditions of venous flow.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    causal_link_type: DIRECT
    description: >-
      Because protein S has a short plasma half-life relative to the
      procoagulant vitamin K-dependent factors, a deficient baseline makes
      the transient post-warfarin-initiation fall in protein S activity
      proportionally more severe.
- name: Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation"
  description: >-
    The shared downstream convergence point for all five hereditary
    thrombophilia subtypes: whichever specific gain of procoagulant or loss
    of anticoagulant function is present, the net effect is unchecked
    thrombin generation and thrombin-driven crosslinking of fibrinogen into
    an insoluble fibrin network.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  - preferred_term: fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:39167180
    reference_title: "Venous thromboembolism risk in adults with hereditary thrombophilia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest risk was associated with homozygous FVL (OR 5.58, 95% CI 4.61-6.74), homozygous FII (OR 5.16, 95% CI 3.12-8.52), and compound heterozygosity (OR 4.64, 95% CI 2.25-9.58)."
    explanation: Quantifies the elevated VTE risk conferred by the highest-risk genotypes among the classic thrombophilias.
  - reference: PMID:39167180
    reference_title: "Venous thromboembolism risk in adults with hereditary thrombophilia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC (OR 3.23, 95% CI 2.05-5.08), PS (OR 3.01, 95% CI 2.26-4.02), and AT deficiency (OR 4.01, 95% CI 2.50-6.44) demonstrated an intermediate VTE risk."
    explanation: Quantifies the elevated VTE risk conferred by the three natural-anticoagulant-deficiency subtypes.
  - reference: DOI:10.1161/JAHA.121.023018
    reference_title: "Classic Thrombophilias and Thrombotic Risk Among Middle‐Aged and Older Adults: A Population‐Based Cohort Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5 classic thrombophilias are associated with a dose‐graded risk of VTE in middle‐aged and older adults."
    explanation: A population cohort study confirms that thrombotic risk scales with the number of classic thrombophilia variants carried, consistent with convergence on one shared downstream effector.
  downstream:
  - target: Pathological Venous Thrombus Formation
    causal_link_type: DIRECT
    description: >-
      Thrombin-driven fibrin formation, together with platelet participation,
      builds the crosslinked fibrin-platelet scaffold of a pathological
      intravascular venous thrombus.

    common clinical manifestation of hereditary thrombophilia.
  evidence:
  - reference: PMID:20301542
    reference_title: Factor V Leiden Thrombophilia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor V Leiden thrombophilia is characterized by venous thromboembolism (VTE) manifesting most commonly in adults as deep vein thrombosis (DVT) in the legs or pulmonary embolism."
    explanation: GeneReviews identifies DVT of the legs as the most common manifestation.

treatments:
- name: Multidisciplinary Supportive Care
  therapeutic_modality: OTHER
  description: >-
    No disease-modifying therapy is approved for MLIV. Management is multidisciplinary and
    supportive, encompassing developmental and speech services, visual-impairment accommodations
    and ocular lubrication, surgical strabismus correction, antiseizure medication when needed,
    feeding support or gastrostomy for dysphagia, annual surveillance (neurologic, ophthalmic,
    feeding/growth, cystatin C renal function, CBC and iron studies), and avoidance of
    chloroquine.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

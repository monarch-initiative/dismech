name: Mucolipidosis Type IV
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Mucolipidosis type IV (MLIV) is an ultra-rare, autosomal recessive lysosomal storage
  disorder caused by biallelic loss-of-function variants in MCOLN1 encoding the
  endolysosomal nonselective cation channel TRPML1 (mucolipin-1). Channel dysfunction impairs
  lysosomal divalent cation release, autophagy, and endolysosomal membrane trafficking,
  producing macromolecular lysosomal storage, early-onset hypomyelinating leukodystrophy with
  hypoplasia of the corpus callosum, glial activation, progressive corticospinal and retinal
  degeneration, corneal clouding, and constitutive parietal-cell achlorhydria with elevated
  plasma gastrin. Affected individuals present in infancy with axial hypotonia, severe
  psychomotor delay, and visual impairment, followed in adolescence by progressive spastic
  quadriparesis and blindness; management is supportive and symptomatic.
category: Mendelian

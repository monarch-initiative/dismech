pathophysiology:
- name: TRPML1 Endolysosomal Cation Channel Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in MCOLN1 abolish or severely reduce the activity of
    TRPML1 (mucolipin-1), a nonselective divalent-cation channel localized to late endosomes
    and lysosomes that mediates efflux of Ca2+, Fe2+, and Zn2+ into the cytosol.

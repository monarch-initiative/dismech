- name: Hypomyelinating Leukodystrophy, Glial Activation, and Corticospinal Degeneration
  conforms_to: "lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and Neuroinflammation"
  biological_scale: TISSUE
  description: >-
    Loss of TRPML1 in the central nervous system impairs oligodendrocyte maturation and myelin
    formation—producing early-onset hypomyelinating leukodystrophy with marked corpus callosum
    hypoplasia—accompanied by pro-inflammatory activation of astrocytes and microglia and
    subsequent progressive degeneration of descending corticospinal tracts and cerebellum.

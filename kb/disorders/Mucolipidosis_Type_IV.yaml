  variants:
  - name: c.406-2A>G
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Major Ashkenazi Jewish founder splice-acceptor substitution accounting for
      77% of Ashkenazi Jewish MLIV alleles and introducing premature termination
      of TRPML1 translation.
    evidence:
    - reference: PMID:32604955
      reference_title: "Neuropathophysiology, Genetic Profile, and Clinical Manifestation of Mucolipidosis IV-A Review and Case Series."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The most common (founder) mutation (called major AJ variant), which accounts for 77%, is a splice site c.406-2A>G substitution and introduces a premature termination of the ML-1 translation."
      explanation: "Establishes c.406-2A>G as the major Ashkenazi Jewish founder splice-site variant (77% of AJ alleles)."
  - name: c.-1015_789del
    variant_type: deletion
    clinical_significance: PATHOGENIC
    description: >-
      Minor Ashkenazi Jewish founder 5'-end and exon 1-7 deletion accounting for
      18% of Ashkenazi Jewish MLIV alleles; together with c.406-2A>G, the two
      founder alleles account for 95% of Ashkenazi Jewish MLIV cases.
    evidence:
    - reference: PMID:32604955
      reference_title: "Neuropathophysiology, Genetic Profile, and Clinical Manifestation of Mucolipidosis IV-A Review and Case Series."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The other common mutation, which comprises 18%, is a large gene deletion c.-1015_789del called minor AJ variant."
      explanation: "Establishes c.-1015_789del as the minor Ashkenazi Jewish founder deletion (18% of AJ alleles)."
  evidence:
  - reference: PMID:20301393
    reference_title: "Mucolipidosis IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in MCOLN1 confirms the diagnosis."
    explanation: "Establishes biallelic pathogenic variants in MCOLN1 as causative for mucolipidosis type IV."

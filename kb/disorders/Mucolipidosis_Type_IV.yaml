      label: calcium ion transport
    modifier: DECREASED
  evidence:
  - reference: PMID:38522082
    reference_title: "MCOLN1/TRPML1 in the lysosome: a promising target for autophagy modulation in diverse diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MCOLN1/TRPML1 is a nonselective cationic channel specifically localized to the late endosome and lysosome. With its property of mediating the release of several divalent cations such as Ca2+, Zn2+ and Fe2+ from the lysosome to the cytosol, MCOLN1 plays a pivotal role in regulating a variety of cellular events including endocytosis, exocytosis, lysosomal biogenesis, lysosome reformation, and especially in Macroautophagy/autophagy."
    explanation: "Defines MCOLN1/TRPML1 as the late-endosomal/lysosomal divalent cation channel regulating lysosomal calcium/metal efflux and membrane dynamics."
  downstream:
  - target: Impaired Autophagic-Lysosomal Trafficking and Substrate Storage
    causal_link_type: DIRECT
    description: Loss of TRPML1-mediated endolysosomal cation efflux impairs autophagosomal-endosomal trafficking, lysosome reformation, and substrate clearance.
  - target: Gastric Parietal Cell Dysfunction and Constitutive Achlorhydria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired endolysosomal and tubulovesicular membrane trafficking in gastric parietal cells
    description: Loss of TRPML1 in gastric parietal cells impairs hydrochloric acid secretion into the gastric lumen.

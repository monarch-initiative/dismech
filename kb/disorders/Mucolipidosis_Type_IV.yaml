has_subtypes:
- name: Typical
  display_name: Typical Mucolipidosis Type IV
  description: >-
    Classic severe form accounting for approximately 95% of affected individuals,
    caused by biallelic null or near-null MCOLN1 variants and characterized by
    infantile severe psychomotor delay, hypomyelinating leukodystrophy, corneal
    clouding, progressive retinal degeneration, achlorhydria with hypergastrinemia,
    and adolescent-onset progressive spastic quadriparesis.
  evidence:
  - reference: PMID:20301393
    reference_title: "Mucolipidosis IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with MLIV typically present by the end of the first year of life with delayed developmental milestones (due to a developmental brain abnormality) and impaired vision (resulting from a combination of corneal clouding and retinal degeneration)."
    explanation: "Defines the classic infantile neurodevelopmental and dual ocular presentation of typical MLIV."
  - reference: PMID:33965501
    reference_title: "Progress in elucidating pathophysiology of mucolipidosis IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of functional TRPML1 protein (typical form), the disease course is characterized by a hypomyelinating leukodystrophy with brain iron accumulation that manifests with severely impaired psychomotor development, and later onset, gradual neurological decline paralleled by cerebellar degeneration and neuroaxonal injury"
    explanation: "Characterizes typical MLIV arising from complete loss of TRPML1 channel function."
- name: Atypical
  display_name: Atypical Mucolipidosis Type IV
  description: >-
    Attenuated form accounting for approximately 5% of affected individuals,
    often associated with hypomorphic MCOLN1 variants retaining residual TRPML1
    channel activity, manifesting with milder psychomotor impairment or isolated
    progressive retinal degeneration alongside constitutive achlorhydria.
  evidence:
  - reference: PMID:20301393
    reference_title: "Mucolipidosis IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 5% of individuals have atypical MLIV, manifesting with less severe psychomotor impairment, but still exhibiting progressive retinal degeneration and achlorhydria."
    explanation: "Establishes the ~5% atypical MLIV subtype with milder psychomotor impairment and preserved retinal/gastric involvement."
  - reference: PMID:33965501
    reference_title: "Progress in elucidating pathophysiology of mucolipidosis IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the mildest form of disease (atypical form), in which residual TRPML1 activity can be demonstrated, an isolated retinal dystrophy develops across the first decade of life."
    explanation: "Links atypical MLIV to residual TRPML1 channel activity and isolated or predominant retinal dystrophy."

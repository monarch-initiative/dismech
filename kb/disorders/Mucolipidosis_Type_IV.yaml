pathophysiology:
- name: TRPML1 Endolysosomal Cation Channel Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in MCOLN1 abolish or severely reduce the activity of
    TRPML1 (mucolipin-1), a nonselective divalent-cation channel localized to late endosomes
    and lysosomes that mediates efflux of Ca2+, Fe2+, and Zn2+ into the cytosol.
  gene:
    preferred_term: MCOLN1
    term:
      id: hgnc:13356
      label: MCOLN1
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  molecular_functions:
  - preferred_term: calcium channel activity
    term:
      id: GO:0005262
      label: calcium channel activity
    modifier: DECREASED
  - preferred_term: monoatomic cation channel activity
    term:
      id: GO:0005261
      label: monoatomic cation channel activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: calcium ion transport
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: DECREASED
  evidence:
  - reference: PMID:38522082
    reference_title: "MCOLN1/TRPML1 in the lysosome: a promising target for autophagy modulation in diverse diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MCOLN1/TRPML1 is a nonselective cationic channel specifically localized to the late endosome and lysosome. With its property of mediating the release of several divalent cations such as Ca2+, Zn2+ and Fe2+ from the lysosome to the cytosol, MCOLN1 plays a pivotal role in regulating a variety of cellular events including endocytosis, exocytosis, lysosomal biogenesis, lysosome reformation, and especially in Macroautophagy/autophagy."
    explanation: "Defines MCOLN1/TRPML1 as the late-endosomal/lysosomal divalent cation channel regulating lysosomal calcium/metal efflux and membrane dynamics."
  downstream:
  - target: Polymorphic Lysosomal Substrate Storage
    causal_link_type: DIRECT
    description: Loss of TRPML1-mediated endolysosomal cation efflux impairs autophagosomal-endosomal trafficking, lysosome reformation, and substrate clearance.
  - target: Gastric Parietal Cell Acid-Secretion Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired endolysosomal and tubulovesicular membrane trafficking in gastric parietal cells
    description: Loss of TRPML1 in gastric parietal cells impairs hydrochloric acid secretion into the gastric lumen.
- name: Polymorphic Lysosomal Substrate Storage
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Defective TRPML1 channel function disrupts endosomal and autophagosomal trafficking,
    lysosome reformation, lysosomal exocytosis, and intracellular Fe2+ mobilization, causing
    polymorphic macromolecular and lipid storage inclusions to accumulate within lysosomes
    across neural and epithelial cells.

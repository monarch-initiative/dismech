- name: Investigational Systemic AAV-MCOLN1 Gene Therapy (Preclinical)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Preclinical systemic gene replacement therapy using blood-brain
    barrier-penetrant AAV vectors (such as AAV.CPP.16-MCOLN1) restores MCOLN1
    expression across brain and peripheral tissues, attenuates CNS gliosis and
    storage pathology, rescues neuromotor function, and prevents hindlimb
    paralysis in symptomatic Mcoln1-/- mice; human clinical efficacy has not yet
    been established.
  notes: >-
    Preclinical proof-of-concept in Mcoln1-/- mice only; no AAV-MCOLN1 vector is
    clinically approved for human MLIV.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: TRPML1 Endolysosomal Cation Channel Loss of Function
    treatment_effect: RESTORES
    description: "AAV-mediated MCOLN1 cDNA transfer restores functional TRPML1 channel expression in transduced CNS and peripheral cells."
  evidence:
  - reference: PMID:38934011
    reference_title: "A blood-brain barrier-penetrant AAV gene therapy improves neurological function in symptomatic mucolipidosis IV mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Systemic administration of CPP16-MCOLN1 in adult symptomatic Mcoln1 -/- mice at a dose of 1e12 vg per mouse resulted in MCOLN1 expression in the brain and peripheral tissues, alleviated brain pathology, rescued neuromotor function, and completely prevented paralysis."
    explanation: "Demonstrates preclinical neuromotor and neuropathological rescue by systemic BBB-penetrant AAV-MCOLN1 gene transfer in symptomatic MLIV mice."
definitions:
- name: Clinical case definition of mucolipidosis type IV
  definition_type: CASE_DEFINITION
  description: >-
    Mucolipidosis type IV is defined by biallelic MCOLN1 loss-of-function variants abolishing
    the TRPML1 endolysosomal channel, with autophagic-lysosomal failure, lysosomal storage,
    severe psychomotor delay, progressive visual impairment, and achlorhydria.
  scope: Disease-level case definition for MCOLN1/TRPML1-related mucolipidosis type IV.
  evidence:
  - reference: PMID:20301393
    reference_title: "Mucolipidosis IV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mucolipidosis IV (MLIV) is an ultra-rare lysosomal storage disorder characterized by severe psychomotor delay, progressive visual impairment, and achlorhydria."
    explanation: "Anchors the case definition in MLIV's defining clinical triad."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of functional TRPML1 protein (typical form), the disease course is characterized by a hypomyelinating leukodystrophy with brain iron accumulation that manifests with severely impaired psychomotor development, and later onset, gradual neurological decline paralleled by cerebellar degeneration and neuroaxonal injury"
    explanation: "Establishes hypomyelinating leukodystrophy, brain iron dysregulation, and progressive cerebellar/neuroaxonal degeneration in human MLIV."
  - reference: PMID:33965501
    reference_title: "Progress in elucidating pathophysiology of mucolipidosis IV."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Studies using the Mcoln1−/− mouse model have revealed that microglial activation and astrocyte reactivity are early and prominent brain pathological features occurring prior to onset of neurologic dysfunction in these mice"
    explanation: "Demonstrates early pro-inflammatory microglial and astrocyte activation in the Mcoln1-null brain."

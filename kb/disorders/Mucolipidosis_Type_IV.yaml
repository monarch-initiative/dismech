    snippet: "Treatment of manifestations: Developmental and educational services including speech therapy; physical therapy and bracing for hypotonia and spasticity; intramuscular botulinum toxin injections or oral medications for muscle spasticity and rigidity as needed; anti-seizure medication as needed; surgical correction of strabismus; high-contrast black and white materials for those with visual impairment; topical lubricating eye drops, artificial tears, gels, or ointments for ocular irritation; feeding therapy and/or gastrostomy tube placement may be required for persistent feeding issues"
    explanation: "Summarizes the standard multidisciplinary supportive care interventions for MLIV manifestations."
  - reference: PMID:20301393

    causal_link_type: DIRECT
    description: >-
      Marrow failure contributes the haematopoietic arm of the plus phenotype.

- name: Progressive Multisystem Disease With Plus Features
  description: >-
    The clinical endpoint is a rapidly progressive multisystem disease that
    looks like a mucopolysaccharidosis - coarse facial features, skeletal
    abnormalities/dysostosis multiplex, hepatosplenomegaly, respiratory problems,
    developmental delay and excess urinary GAG - with, superimposed on it,
    congenital heart defects and renal and haematopoietic disease that are not
    typical of conventional MPS. For the p.Arg498Trp founder form the outcome is
    fatal cardiorespiratory failure at 10-20 months.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "lysosomal_substrate_accumulation#Progressive Multisystem and Neurodegenerative Disease"
  evidence:
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified several Yakut patients showing typical manifestations of MPS: coarse facial features, skeletal abnormalities, hepatosplenomegaly, respiratory problems, mental retardation, and excess secretion of urinary GAG."
    explanation: >-
      Enumerates the MPS-like arm of the multisystem phenotype.
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, most patients developed heart, kidney, and hematopoietic disorders, which are not typical symptoms for conventional MPS, leading to a fatal outcome between 1 and 2-years old."
    explanation: >-
      Enumerates the "plus" arm - cardiac, renal and haematopoietic disease - and
      the fatal infantile outcome.
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease is very severe, prognosis is unfavorable and most of patients died at age of 10-20 months."
    explanation: >-
      Quantifies the natural history endpoint for the severe founder form.

- name: Bone Marrow Hypoplasia and Peripheral Cytopenias
  description: >-
    The haematopoietic system is the second discriminating "plus" target.
    Progressive anaemia and thrombocytopenia develop and correlate with
    histologically hypoplastic bone marrow; neutropenia/leukopenia, coagulation
    abnormalities and platelet dysfunction are also reported. Secondary
    haemophagocytic lymphohistiocytosis has occurred in at least one
    longer-surviving patient.
  role: effector
  biological_scale: TISSUE
  notes: >-
    Deliberately carries no conforms_to, in explicit contrast to the renal
    podocyte node. MPSPS marrow is hypoplastic but contains NO storage cells
    (PMID:31936524), so mapping it to the module's storage-cell cytotoxicity
    node would be wrong: the cytopenias are not a storage-cell phenomenon and
    their mechanism remains unexplained.
  locations:

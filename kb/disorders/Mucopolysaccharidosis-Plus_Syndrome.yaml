genetic:
- name: VPS33A
  gene_term:
    preferred_term: VPS33A
    term:
      id: hgnc:18179
      label: VPS33A
  relationship_type: CAUSATIVE
  association: >-
    Biallelic missense variants in VPS33A (12q24.31), encoding a core
    Sec1/Munc18-family subunit of the HOPS and CORVET membrane-tethering
    complexes, cause MPSPS. Two variants are established: the recurrent founder
    allele c.1492C>T (p.Arg498Trp), homozygous in essentially all reported
    patients and associated with the severe infantile form, and c.599G>C
    (p.Arg200Pro), reported homozygous in two patients with an attenuated
    juvenile course. Both act as hypomorphic loss of function via protein
    destabilisation and proteasomal degradation.
  variant_origin: GERMLINE
  notes: >-
    Variant class and mechanism: both known alleles are germline homozygous
    MISSENSE substitutions in conserved regions, acting as hypomorphic loss of
    function through protein instability - NOT nonsense, frameshift, whole-gene
    deletion, gain of function or dominant negative. No CNV, structural,
    somatic or mosaic mechanism has been implicated, and no modifier gene is
    known. Because VPS33A is a shared core subunit, the molecular consequence
    extends beyond VPS33A itself: patient cells show secondary reduction of the
    other HOPS/CORVET components (VPS18, VPS41), so a single missense allele
    depletes two multi-subunit complexes.
    Penetrance and genotype-phenotype: penetrance of homozygous p.Arg498Trp
    appears complete in reported families, with no formal age-dependent
    penetrance estimate published. The genotype-phenotype correlation is the
    clearest feature of the MPSPS genetics - p.Arg498Trp gives the lethal
    infantile disease while p.Arg200Pro gives an attenuated juvenile course,
    attributed to appreciable RESIDUAL endosomal-lysosomal trafficking rather
    than to any qualitative difference in mechanism. Caveat: the p.Arg200Pro
    correlation rests on only two reported patients.
    Founder allele: p.Arg498Trp is a Yakut founder allele with a carrier
    frequency of 1:81 and a birth incidence of about 1 per 12,100 in that
    population (see prevalence). Consanguinity is not required - the original
    Yakut series comprised children of healthy, non-consanguineous parents -
    although the two Turkish patients were born to first cousins.
  evidence:
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed that the missense mutation reduced the abundance of full-length VPS33A and other components of the HOPS and CORVET complexes."
    explanation: >-
      Supports the statement that the missense allele depletes not only VPS33A
      but the other HOPS/CORVET components, the molecular basis for the
      disproportionate effect of a single missense change.
  - reference: PMID:36153662
    reference_title: "Juvenile mucopolysaccharidosis plus disease caused by a missense mutation in VPS33A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge this is the first report of an attenuated juvenile form of VPS33A insufficiency characterized by appreciable residual endosomal-lysosomal trafficking and a milder mucopolysaccharidosis plus than the disease in infants."
    explanation: >-
      Supports the genotype-phenotype correlation: residual trafficking capacity
      distinguishes the attenuated p.Arg200Pro course from the lethal infantile
      p.Arg498Trp disease.
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome and Sanger sequencing, we identified homozygous c.1492C > T (p.Arg498Trp) mutations in the VPS33A gene of 13 patients."
    explanation: >-
      Original gene discovery: homozygous VPS33A p.Arg498Trp in 13 patients by
      exome and Sanger sequencing.
  - reference: PMID:36232726
    reference_title: "Mucopolysaccharidosis-Plus Syndrome: Report on a Polish Patient with a Novel VPS33A Variant with Comparison with Other Described Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to now, a total number of 39 patients have been reported; in all of them, the c.1492C>T (p.Arg498Trp) variant of the VPS33A gene was detected."
    explanation: >-
      Confirms p.Arg498Trp as the recurrent allele across the whole reported
      cohort at that time.
  - reference: PMID:36153662
    reference_title: "Juvenile mucopolysaccharidosis plus disease caused by a missense mutation in VPS33A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe an attenuated juvenile form of VPS33A-related syndrome-mucopolysaccharidosis plus in a man who is homozygous for a hitherto unknown missense mutation (NM_022916.4: c.599 G>C; NP_075067.2:p. Arg200Pro) in a conserved region of the VPS33A gene."
    explanation: >-
      Establishes the second pathogenic VPS33A allele and its association with the
      attenuated juvenile phenotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    MPSPS is ultra-rare. Reported patient counts have risen from 19 (2020) to 24
    (2022) to 39-41 (2022-2024) as the entity has become recognised. Orphanet
    prevalence was not cited here because the local Orphadata snapshot could not
    be refreshed at curation time (known repo issue); a qualitative band is used
    instead.
  evidence:
  - reference: PMID:39273517
    reference_title: "Mucopolysaccharidosis-Plus Syndrome: Is This a Type of Mucopolysaccharidosis or a Separate Kind of Metabolic Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, it has been described in 41 patients."
    explanation: >-
      Total reported patient count as of the 2024 review, supporting the
      ultra-rare band.
- population: Yakut (Sakha) population, Siberia
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 8.3
  notes: >-
    Strong founder effect for c.1492C>T (p.Arg498Trp) in the Yakut population of
    the Sakha Republic. The reported incidence of 1 per 12,100 births normalises
    to 8.3 per 100,000. Cases outside Yakutia have been reported from Turkey,
    Poland and Israel, so MPSPS is not exclusively a Yakut disease.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence rate of MPSPS in Yakuts population is predicted as 1 per 12,100 birth."
    explanation: >-
      Source for the Yakut birth-prevalence figure; 1/12,100 = 8.3 per 100,000.
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen patients with MPSPS have been identified: seventeen patients were found among the Yakut population (Russia) and two patients from Turkey."
    explanation: >-
      Documents the marked Yakut concentration alongside unrelated Turkish
      patients.
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by the defect in a conserved region of the VPS33A gene on human chromosome 12q24.31, occurs in Yakuts-a nomadic Turkic ethnic group of Southern Siberia"
    explanation: >-
      Identifies the founder population in which the disorder was first
      recognised.
- population: Yakut (Sakha) population, Siberia
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1234.6
  notes: >-
    Carrier (heterozygote) allele frequency of the p.Arg498Trp founder variant
    in the Yakut population is reported as 1:81, i.e. about 1,235 per 100,000.
    This is the population-genetic basis for targeted cascade and community
    carrier screening in Yakut families, and is a population-specific figure
    with no bearing on global frequency.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified extremely high allele frequency in this population (1:81)"
    explanation: >-
      Source for the Yakut founder-allele carrier frequency.
diagnosis:
- name: Clinical and biochemical suspicion of MPSPS
  description: >-
    MPSPS is suspected when an infant has an MPS-like phenotype (coarse facies,
    dysostosis multiplex, hepatosplenomegaly, developmental delay) with
    excessive urinary GAG excretion BUT normal activity of the lysosomal
    enzymes. The negative enzyme panel is the discriminator, and it is also why
    MPSPS cannot be detected by any enzyme-based newborn screen: there is no
    deficient hydrolase to assay.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finding of MPS-like phenotype and excess secretion of urinary GAGs without deficiency in the activity of lysosomal enzymes is the basis for suspicion of MPSPS."
    explanation: >-
      States the diagnostic triad that raises suspicion of MPSPS, including the
      pivotal normal-enzyme finding.
- name: Molecular confirmation by VPS33A sequencing
  description: >-
    Diagnosis is confirmed by molecular testing of VPS33A - targeted testing for
    p.Arg498Trp in Yakut families or where the familial variant is known,
    otherwise a lysosomal-storage/vesicular-trafficking panel or exome
    sequencing. Whole exome sequencing is what originally identified the gene.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis generally requires evidence of clinical picture similar to MPS and molecular genetic testing."
    explanation: >-
      Establishes molecular genetic testing as the confirmatory diagnostic step.
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome and Sanger sequencing, we identified homozygous c.1492C > T (p.Arg498Trp) mutations in the VPS33A gene of 13 patients."
    explanation: >-
      Documents the sequencing approaches by which the causal variant is
      identified.
histopathology:
- name: Glomerular destruction by foamy podocytes
  description: >-
    Renal histology in MPSPS shows extensive destruction of glomerular
    structures by foamy (storage-laden) podocytes, with segmental sclerosis,
    periglomerular fibrosis and inflammatory cell infiltration. The foamy
    podocyte is the one unambiguous storage cell described in MPSPS.
  evidence:
  - reference: PMID:35628659
    reference_title: "Hematopoietic Disorders, Renal Impairment and Growth in Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological analyses of MPSPS kidneys similarly suggest the extensive destruction of glomerular structures by foamy podocytes."
    explanation: >-
      Primary histological description of the renal lesion.
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal biopsy showed segmental sclerosis, periglomerular fibrosis and inflammatory cell infiltration."
    explanation: >-
      Adds the sclerotic, fibrotic and inflammatory components of the renal
      biopsy picture.
- name: Hypoplastic bone marrow without storage cells
  description: >-
    Marrow histology shows hypoplasia but, notably, NO storage cells - a key
    negative that distinguishes the MPSPS cytopenias from a storage-cell
    infiltration mechanism and leaves them mechanistically unexplained.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow aspiration analysis showed hypoplastic bone marrow without any storage cells."
    explanation: >-
      Documents marrow hypoplasia together with the explicit absence of storage
      cells.
progression:
- phase: Prenatal
  notes: >-
    Prenatal findings can include ascites and increased prenasal, nasal or
    nuchal thickness on second-trimester ultrasonography, and congenital cardiac
    valve abnormalities. Many affected newborns are delivered at term with
    normal Apgar scores.
  evidence:
  - reference: PMID:37628632
    reference_title: "Prenatal Diagnosis of Mucopolysaccharidosis-Plus Syndrome (MPSPS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During their pregnancies, both women underwent prenatal ultrasonography, which revealed increased prenasal thickness during the second trimester."
    explanation: >-
      Documents the second-trimester sonographic marker.
- phase: Early infantile onset
  subtype: Infantile
  age_range: 2-6 months
  notes: >-
    Respiratory symptoms typically emerge at 2-6 months of age, with recurrent
    infections and bronchial obstruction, followed by the MPS-like facies and
    dysostosis. Growth begins to decline in some patients at around six months
    to one year.
  evidence:
  - reference: PMID:35628659
    reference_title: "Hematopoietic Disorders, Renal Impairment and Growth in Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Height and weight did not significantly deviate from the average, but in some cases, growth began to decline at around six months or one year of age."
    explanation: >-
      Documents the timing of growth decline, and notes that growth is otherwise
      largely preserved.
- phase: Rapid multisystem progression
  subtype: Infantile
  notes: >-
    Cardiac disease can progress from moderate to severe within only 3-4 months,
    in parallel with worsening renal and haematopoietic involvement.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitral and tricuspid valve defects and pulmonary hypertension progressed from moderate to severe within 3"
    explanation: >-
      Quantifies the pace of cardiac deterioration.
- phase: Terminal
  subtype: Infantile
  age_range: 10-20 months
  notes: >-
    Death from cardiorespiratory failure typically occurs at 10-20 months in the
    p.Arg498Trp founder form. The p.Arg200Pro juvenile form survives far longer
    (one patient followed over 12 years).
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease is very severe, prognosis is unfavorable and most of patients died at age of 10-20 months."
    explanation: >-
      Reports the typical age at death for the severe founder form.
treatments:
- name: Supportive and symptomatic care
  description: >-
    There is no approved disease-modifying therapy for MPSPS, and enzyme
    replacement is not a logical strategy because no single hydrolase is
    deficient. Management is multidisciplinary and supportive: airway clearance,
    oxygen and ventilatory support, prompt antibiotics for respiratory
    infection, nutritional and developmental support, standard cardiac and renal
    management, transfusion for significant cytopenia, and surveillance of
    cardiac, renal, respiratory, haematologic, hearing and vision status.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently there is no specific therapy for this disease and clinical management is limited to supportive and symptomatic treatment."
    explanation: >-
      States that no specific therapy exists and management is supportive and
      symptomatic.
- name: Respiratory support and anti-infective therapy
  description: >-
    Airway clearance and bronchial drainage, supplemental oxygen and ventilatory
    support as required, and prompt antibiotics for bacterial respiratory
    infection. This is the highest-yield supportive axis because recurrent
    respiratory infection from 2-6 months of age is the usual presenting problem
    and cardiorespiratory failure is the usual mode of death.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently there is no specific therapy for this disease and clinical management is limited to supportive and symptomatic treatment."
    explanation: >-
      Supports supportive/symptomatic management as the standard of care. Marked
      PARTIAL because the quoted sentence establishes the supportive-care
      principle without itemising the specific respiratory interventions.
- name: Transfusion support for cytopenias
  description: >-
    Red-cell or platelet transfusion for clinically significant anaemia or
    thrombocytopenia arising from the hypoplastic marrow. Purely supportive: it
    does not address the underlying marrow hypoplasia, whose mechanism is
    unexplained given the documented absence of marrow storage cells.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  evidence:
  - reference: PMID:35628659
    reference_title: "Hematopoietic Disorders, Renal Impairment and Growth in Mucopolysaccharidosis-Plus Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A series of blood tests indicate hematopoietic symptoms including progressive anemia and thrombocytopenia, which correlate with histological observations of hypoplastic bone marrow."
    explanation: >-
      Establishes the progressive anaemia and thrombocytopenia that create the
      transfusion requirement. Marked PARTIAL because it documents the
      indication rather than reporting transfusion outcomes.
- name: Prolonged corticosteroid therapy for secondary HLH
  description: >-
    In a single unusually long-surviving child who developed secondary
    haemophagocytic lymphohistiocytosis at two years of age, steroids treated the
    HLH successfully and a very prolonged course was associated with
    stabilisation of general and haematological status. This is a single case
    report; corticosteroids are NOT established MPSPS therapy and the authors
    themselves state the approach deserves further investigation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:35327996
    reference_title: "Mucopolysaccharidosis-Plus Syndrome, a Rapidly Progressive Disease: Favorable Impact of a Very Prolonged Steroid Treatment on the Clinical Course in a Child."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The prolonged steroid treatment allowed a stabilization of his general and hematological conditions and probably determined an improvement of his psychomotor milestones and new neurological acquisitions with an improvement of quality of life."
    explanation: >-
      Reports the observed benefit. Marked PARTIAL because this is a single
      uncontrolled case and the authors describe the effect as probable.
- name: Genetic counselling and prenatal diagnosis
  description: >-
    Because MPSPS is autosomal recessive with a defined founder allele, cascade
    carrier testing, nondirective counselling and targeted prenatal diagnosis
    (chorionic villus/placental biopsy DNA when the familial variant is known)
    are the principal preventive options. Increased prenasal thickness on
    second-trimester ultrasonography can prompt testing in families with no known
    history.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37628632
    reference_title: "Prenatal Diagnosis of Mucopolysaccharidosis-Plus Syndrome (MPSPS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, a placental biopsy was performed, leading to an early diagnosis of MPSPS."
    explanation: >-
      Demonstrates feasibility of targeted prenatal molecular diagnosis once
      parental carrier status is known.
  - reference: PMID:37628632
    reference_title: "Prenatal Diagnosis of Mucopolysaccharidosis-Plus Syndrome (MPSPS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During their pregnancies, both women underwent prenatal ultrasonography, which revealed increased prenasal thickness during the second trimester."
    explanation: >-
      Identifies the sonographic marker that can trigger prenatal genetic testing.
- name: Proteasome and protein-degradation modulation (experimental)
  description: >-
    Because the disease mechanism is destabilisation and degradation of a
    partially functional VPS33A protein rather than absence of catalytic
    activity, raising the steady-state level of the mutant protein is a rational
    strategy. In patient-derived fibroblasts the proteasome inhibitor bortezomib
    (and, separately, the glucosylceramide-synthase inhibitor eliglustat)
    partially corrected the lactosylceramide trafficking defect, and the
    proteasome inhibitor genistein combined with the ERAD inhibitor ambroxol
    raised mutant VPS33A levels and corrected GAG, endosomal-marker and
    cytoskeletal defects. All of this is IN VITRO only. No clinical trial exists,
    and bortezomib's toxicity makes off-label use unsupported outside formal
    research.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Exposure of patient-derived fibroblasts to the clinically approved proteasome inhibitor, bortezomib, or inhibition of glucosylceramide synthesis with eliglustat, partially corrected the impaired lactosylceramide trafficking defect and immediately suggest therapeutic avenues to explore in this fatal orphan disease."
    explanation: >-
      Reports partial in vitro correction of a trafficking defect. Marked PARTIAL
      because this is a cell-culture result with no clinical evidence of benefit.
  - reference: PMID:41310305
    reference_title: "The use of genistein and ambroxol may be an effective approach in correcting cellular dysfunctions of mucopolysaccharidosis-plus syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "we demonstrated that treatment with genistein and ambroxol resulted in elevation of the mutant VPS33A protein level, as well as in improvement or correction of various previously reported cellular defects, including GAG levels, endosomal markers, and cytoskeleton elements"
    explanation: >-
      Reports in vitro rescue of mutant VPS33A abundance and multiple downstream
      cellular defects. Marked PARTIAL because the evidence is a single
      patient-derived fibroblast line with no clinical data.
discussions:
- discussion_id: mpsps_nosology
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should MPSPS be classified as a type of mucopolysaccharidosis, or as a
    distinct vesicular-trafficking metabolic disease that phenocopies one?
  attaches_to:
  - "pathophysiology#Glycosaminoglycan Accumulation With Normal Lysosomal Hydrolase Activity"
  rationale: >-
    GAG storage and MPS-like clinical features argue for inclusion among the
    mucopolysaccharidoses; normal lysosomal GAG-hydrolase activity and a primary
    membrane-tethering/trafficking lesion argue for a separate entity. The
    question is not merely terminological: it determines whether MPSPS belongs in
    the Mucopolysaccharidoses grouping (whose rationale requires deficiency of
    a GAG-degrading enzyme) and whether newborn screening by enzyme assay could
    ever detect it. This entry takes the position that MPSPS is a lysosomal
    storage disorder reached by a trafficking route, hence downstream-only
    conformance to lysosomal_substrate_accumulation and no MPS-grouping
    membership on the criteria as currently written.
  evidence:
  - reference: PMID:39273517
    reference_title: "Mucopolysaccharidosis-Plus Syndrome: Is This a Type of Mucopolysaccharidosis or a Separate Kind of Metabolic Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Moreover, we asked the question whether MPSPS should be classified as a type of MPS or a separate disease, as contrary to 'classical' MPS types, despite GAG accumulation, no defects in lysosomal enzymes responsible for degradation of these compounds could be detected in MPSPS."
    explanation: >-
      The 2024 review poses exactly this nosological question and states the
      reason it is unresolved.
- discussion_id: mpsps_autophagy_discrepancy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is autophagic flux genuinely impaired in MPSPS, or is the reported autophagy
    abnormality specific to the p.Arg200Pro variant or to assay conditions?
  attaches_to:
  - "pathophysiology#Endolysosomal Compartment Expansion and Over-Acidification"
  rationale: >-
    The original p.Arg498Trp study explicitly reported that the mutation did NOT
    affect the endocytic or autophagic pathways in patient skin fibroblasts,
    whereas a later study of p.Arg200Pro fibroblasts found elevated LC3-II and
    p62, indicating a block in autophagic flux. Because HOPS is required for
    autophagosome-lysosome fusion, an autophagy defect is mechanistically
    expected, making the negative result surprising. Resolving this matters for
    whether the Autophagic-Lysosomal Dysfunction conformance asserted here is
    correct for both variants, and for whether autophagy-modulating therapy is
    rational.
  proposed_experiments:
  - experiment_id: mpsps_autophagic_flux_headtohead
    name: Head-to-head autophagic flux assay across both VPS33A genotypes
    description: >-
      Side-by-side autophagic-flux assay (LC3-II turnover with and without
      bafilomycin A1, plus p62 and tandem mRFP-GFP-LC3 reporter) in p.Arg498Trp
      and p.Arg200Pro patient fibroblasts and isogenic knock-in controls, under
      identical starvation and basal conditions.
  - experiment_id: mpsps_autophagosome_lysosome_fusion_imaging
    name: Live-cell imaging of autophagosome-lysosome fusion
    description: >-
      Quantify autophagosome-lysosome fusion directly by live-cell imaging of
      LC3 and LAMP1 colocalisation in both genotypes, to distinguish a fusion
      block from altered autophagosome biogenesis.
  evidence:
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "VPS33A is involved in endocytic and autophagic pathways, but the identified mutation did not affect either of these pathways."
    explanation: >-
      The negative finding in p.Arg498Trp fibroblasts that generates the
      discrepancy.
  - reference: PMID:40758165
    reference_title: "Cellular and molecular changes in mucopolysaccharidosis-plus syndrome caused by a homozygous c.599G > C (p.Arg200Pro) variant of the VPS33A gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "elevated levels of the LC3-II and p62 proteins (autophagy markers)"
    explanation: >-
      The positive autophagy-marker finding in p.Arg200Pro fibroblasts that
      conflicts with the earlier negative result.
- discussion_id: mpsps_no_organ_level_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every mechanistic result in MPSPS comes from patient skin fibroblasts or
    transfected HeLa cells - can findings in these systems be assumed to explain
    the cardiac, renal, marrow and neurodevelopmental disease that actually kills
    affected children, when no knock-in animal or organ-level human model exists?
  attaches_to:
  - "pathophysiology#Progressive Multisystem Disease With Plus Features"
  rationale: >-
    Patient-derived skin fibroblasts and HeLa cells reproduce VPS33A depletion,
    HOPS/CORVET loss, endolysosomal disorganisation and trafficking defects, but
    they cannot model the cardiorespiratory, renal-podocyte, marrow-hypoplasia or
    neurodevelopmental phenotypes. In particular the causal edge from GAG storage
    to congenital heart disease is asserted clinically but has never been
    demonstrated experimentally in any system, and the in vitro drug rescues
    (bortezomib, eliglustat, genistein/ambroxol) are all fibroblast readouts of
    uncertain organ-level relevance. No validated VPS33A p.Arg498Trp knock-in
    mouse, zebrafish, organoid or iPSC model recapitulating the human syndrome
    has been reported.
  proposed_experiments:
  - experiment_id: mpsps_knockin_mouse
    name: Vps33a p.Arg498Trp knock-in mouse phenotyping
    description: >-
      Generate and phenotype a Vps33a p.Arg498Trp knock-in mouse, with
      longitudinal echocardiography, urinary protein quantification, renal
      histology for foamy podocytes, and marrow cellularity, to test whether the
      plus features are cell-autonomous consequences of the tethering defect.
  - experiment_id: mpsps_ipsc_organ_models
    name: Patient iPSC-derived cardiac, kidney and haematopoietic models
    description: >-
      Differentiate patient iPSCs to cardiomyocytes, kidney organoids and
      haematopoietic progenitors to determine which plus features arise
      cell-autonomously versus secondarily to systemic storage, and to retest the
      candidate drugs in a disease-relevant cell type.

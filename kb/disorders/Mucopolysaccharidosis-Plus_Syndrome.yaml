- name: Lysosomal hydrolase activity panel
  notes: >-
    The activities of the known GAG-degrading lysosomal enzymes are NORMAL in
    MPSPS. This is the pivotal negative finding that separates MPSPS from every
    classical mucopolysaccharidosis and the reason affected children cannot be
    diagnosed enzymatically. Lysosphingolipid concentrations in dried blood spot
    are likewise normal.

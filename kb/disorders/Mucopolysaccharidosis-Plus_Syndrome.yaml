notes: >-
  NOSOLOGY AND MODULE CONFORMANCE. MPSPS is the KB's worked example of "storage
  without a catabolic block", and the conforms_to annotations here are
  deliberately PARTIAL and DOWNSTREAM-ONLY against
  lysosomal_substrate_accumulation. The module's trigger node ("Lysosomal
  Hydrolase or Cofactor Deficiency") models loss of a catabolic step, and its
  trigger-to-accumulation edge reads "Loss of the catabolic step leaves the
  substrate undegraded". That is NOT what happens in MPSPS: every cognate
  lysosomal hydrolase retains normal activity (PMID:31070736, PMID:39273517,
  PMID:36232726). Instead, low abundance of destabilised VPS33A depletes the
  HOPS/CORVET tethering complexes, so endosome-lysosome fusion fails and GAGs
  are inefficiently DELIVERED to the compartment where their intact enzymes
  reside (PMID:40758165, PMID:41310305). The three upstream nodes here (VPS33A
  destabilisation; HOPS/CORVET tethering complex depletion; impaired
  endosome-lysosome tethering and fusion) therefore carry no conforms_to — the
  disease reaches the shared cascade by a genuinely different route. Conformance
  is asserted from the GAG-accumulation node onward, on four nodes: the
  accumulation node, the endolysosomal dysfunction node, the renal
  podocyte-storage node (the module's storage-cell arm) and the terminal
  multisystem node. Of the two organ-level "plus" nodes, only the renal one
  conforms: MPSPS marrow is hypoplastic but explicitly contains no storage cells
  (PMID:31936524), so the marrow node is deliberately NOT mapped to the module's
  storage-cell node — the cytopenias are not a storage-cell phenomenon.
  GROUPING MEMBERSHIP. Both groupings are boundary cases, and this entry asserts
  membership in neither. Against kb/groupings/Lysosomal_Storage_Disorders.yaml
  (NECESSARY_AND_SUFFICIENT on lysosomal_substrate_accumulation#Lysosomal
  Substrate Accumulation) MPSPS satisfies the criterion as the checker evaluates
  it, via the accumulation node declared below, and does surface as a candidate
  member — consistent with MONDO placing MPSPS under MONDO:0800088 "lysosomal
  storage disease with skeletal involvement". But that criterion's own wording
  requires accumulation "within the lysosome", and the best current cell biology
  says MPSPS storage is pre-lysosomal: heparan sulphate shows only weak
  colocalisation with LysoTracker and appears to be trapped in endosomes rather
  than delivered to lysosomes (PMID:40758165). The candidate flag should
  therefore be reviewed by a human curator rather than auto-accepted. Against
  kb/groupings/Mucopolysaccharidoses.yaml MPSPS is a genuine boundary case: it
  satisfies the module criterion and the coarse-facies/dysostosis phenotype
  criterion, but the grouping's own rationale states that "every member is
  caused by deficiency of a lysosomal GAG-degrading enzyme", which MPSPS is not.
  On the criteria as currently written MPSPS should NOT be added to the MPS
  grouping without an explicit rationale amendment. Neither grouping file was
  edited by this curation. The same debate is live in the primary literature —
  PMID:39273517 is titled "Is This a Type of Mucopolysaccharidosis or a Separate
  Kind of Metabolic Disease?" — and is recorded as a discussion below.
  For the same reason, classifications.lysosomal_storage_category is left
  unset: the closest enum value, mucopolysaccharidosis, presupposes the
  GAG-hydrolase deficiency that MPSPS lacks.
  DISAMBIGUATION. VPS33A (HGNC:18179, 12q24.31) is NOT VPS33B, whose biallelic
  variants cause arthrogryposis-renal dysfunction-cholestasis (ARC) syndrome.
  Biallelic VPS16 and VPS41 disorders are mechanistically related HOPS/CORVET
  diseases and are relevant differentials, but they are separate entities and no
  VPS16/VPS41 evidence is used in this entry.
  No GeneReviews chapter exists for MPSPS or VPS33A (PubMed searched
  2026-08-01), so the GeneReviews phenotype baseline step was not applicable.
  In its place, the Vasilev/Sukhomyasova/Otomo 2020 review (PMID:31936524,
  tagged in the top-level references block) was used as the systematic
  phenotype baseline: its organ-system tables are the source of the
  craniofacial, skeletal, cardiovascular, neurological, renal and
  immunological features curated below.
  SUBTYPE IDENTIFIERS. The Infantile and Juvenile subtypes carry no
  disease_term. Neither has a distinct MONDO, OMIM or Orphanet identifier -
  MONDO:0015012 / OMIM:617303 / ORPHA:505248 all denote MPSPS as a single
  entity, and the juvenile form rests on only two reported patients. The
  subtypes are therefore curated as allele-defined clinical forms
  (p.Arg498Trp vs p.Arg200Pro), not as separately coded diseases.
  DECLINED PHENOTYPE: hearing impairment. It was considered and rejected. The
  sentence naming hearing loss in PMID:35628659 describes CONVENTIONAL MPS
  ("Conventional MPS ... display various multisystemic symptoms-including ...
  hearing loss"), explicitly as the contrast class to MPSPS; and the "hearing
  loss" mention in PMID:31936524 belongs to a paragraph about VPS33B ARC/ARKID
  syndromes, a different gene. Neither supports hearing impairment IN MPSPS, so
  no such phenotype is asserted.
  Early death (10-20 months in the founder form) is captured in the description,
  the Infantile subtype and the terminal pathophysiology node rather than as a
  phenotype entry, because HP:0001522 "Death in infancy" sits under HP:0011420
  "Age of death" and is outside the PhenotypeTerm enum used by this schema.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    MPSPS is inherited in an autosomal recessive manner. Affected individuals
    are homozygous for a VPS33A missense variant; in the Yakut founder
    population, parents are typically healthy heterozygous carriers and
    consanguinity is not required.
  evidence:
  - reference: PMID:31936524
    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPSPS, whose pathophysiology is not elucidated, is an autosomal recessive multisystem disorder caused by a specific mutation p.R498W in the VPS33A gene."
    explanation: >-
      States the autosomal recessive mode of inheritance and the causal VPS33A
      p.R498W variant.
has_subtypes:
- name: Infantile
  display_name: Severe infantile MPSPS (p.Arg498Trp founder form)
  description: >-
    The classical and by far the commonest form, caused by homozygous VPS33A
    c.1492C>T (p.Arg498Trp). Presentation is in the first months of life with
    MPS-like facies and dysostosis together with congenital heart disease,
    renal and haematopoietic involvement; death from cardiorespiratory failure
    typically occurs at 10-20 months. 39 of the first 41 reported patients
    carried this variant.
  evidence:
  - reference: PMID:36232726
    reference_title: "Mucopolysaccharidosis-Plus Syndrome: Report on a Polish Patient with a Novel VPS33A Variant with Comparison with Other Described Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to now, a total number of 39 patients have been reported; in all of them, the c.1492C>T (p.Arg498Trp) variant of the VPS33A gene was detected."
    explanation: >-
      Establishes p.Arg498Trp as the recurrent variant accounting for essentially
      all reported MPSPS patients at that time.
- name: Juvenile
  display_name: Attenuated juvenile MPSPS (p.Arg200Pro)
  description: >-
    An attenuated, longer-surviving form described in two unrelated patients
    homozygous for VPS33A c.599G>C (p.Arg200Pro), with appreciable residual
    endosomal-lysosomal trafficking. Reported features include normal growth,
    fetal ascites that resolved spontaneously, recurrent joint effusion and
    peripheral oedema.
  evidence:
  - reference: PMID:36153662
    reference_title: "Juvenile mucopolysaccharidosis plus disease caused by a missense mutation in VPS33A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge this is the first report of an attenuated juvenile form of VPS33A insufficiency characterized by appreciable residual endosomal-lysosomal trafficking and a milder mucopolysaccharidosis plus than the disease in infants."
    explanation: >-
      Defines the attenuated juvenile subtype and attributes its milder course to
      residual endosomal-lysosomal trafficking capacity.
pathophysiology:
- name: VPS33A Missense Variant Destabilisation and Proteasomal Degradation
  description: >-
    Biallelic missense variants in VPS33A destabilise the folded protein and
    target it for proteasomal degradation, so the steady-state intracellular
    abundance of intact full-length VPS33A falls. The 3D crystal structure of
    human VPS33A predicts that replacement of arginine 498 by tryptophan
    de-stabilises folding; the same instability-plus-degradation mechanism is
    documented for the juvenile p.Arg200Pro variant. The functional consequence
    is hypomorphic loss of function through protein instability, not gain of
    function or dominant-negative activity, and mutant protein can be rescued
    by proteasome inhibition.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: VPS33A
    term:
      id: hgnc:18179
      label: VPS33A
  notes: >-
    Deliberately carries no conforms_to. This trigger is a chaperone/tethering
    protein-stability defect, not the hydrolase-or-cofactor catabolic deficiency
    that the lysosomal_substrate_accumulation module's trigger node models.
  evidence:
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 3D crystal structure of human VPS33A predicts that replacement of arginine 498 by tryptophan will de-stabilize VPS33A folding."
    explanation: >-
      Structural basis for destabilisation of VPS33A by the founder p.Arg498Trp
      substitution.
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that the disease is due to diminished intracellular abundance of intact VPS33A."
    explanation: >-
      States the proposed proximal disease mechanism: reduced abundance of intact
      VPS33A rather than an altered catalytic activity.
  - reference: PMID:36153662
    reference_title: "Juvenile mucopolysaccharidosis plus disease caused by a missense mutation in VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed decreased abundance of VPS33A in patient derived fibroblasts and provided evidence that the p.Arg200Pro mutation leads to destablization of the protein and proteasomal degradation."
    explanation: >-
      Confirms the same destabilisation-and-proteasomal-degradation mechanism for
      the second, juvenile-associated VPS33A variant.
  downstream:
  - target: HOPS and CORVET Tethering Complex Depletion
    causal_link_type: DIRECT
    description: >-
      Loss of intact VPS33A, a core subunit of both complexes, secondarily
      lowers the abundance of the other HOPS and CORVET components.

- name: HOPS and CORVET Tethering Complex Depletion
  description: >-
    VPS33A is a core component of the class C core vacuole/endosome tethering
    (CORVET) and the homotypic fusion and protein sorting (HOPS) complexes,
    which have essential functions in the endocytic pathway. Because VPS33A is
    shared by both complexes, its depletion is not isolated: patient cells show
    reduced abundance of the other HOPS and CORVET components as well, so both
    the early-endosome (CORVET) and late-endosome/lysosome (HOPS) tethering
    arms are simultaneously compromised.
  role: amplifier
  biological_scale: MOLECULAR
  protein_complexes:
  - preferred_term: HOPS complex
    term:
      id: GO:0030897
      label: HOPS complex
    modifier: DECREASED
  - preferred_term: CORVET complex
    term:
      id: GO:0033263
      label: CORVET complex
    modifier: DECREASED
  evidence:
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "VPS33A is a core component of the class C core vacuole/endosome tethering (CORVET) and the homotypic fusion and protein sorting (HOPS) complexes, which have essential functions in the endocytic pathway."
    explanation: >-
      Establishes VPS33A as a shared core subunit of both HOPS and CORVET, the
      structural reason a single-gene lesion depletes two tethering complexes.
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed that the missense mutation reduced the abundance of full-length VPS33A and other components of the HOPS and CORVET complexes."
    explanation: >-
      Directly documents secondary depletion of the other HOPS/CORVET components
      in cells carrying the mutant VPS33A.
  - reference: PMID:36153662
    reference_title: "Juvenile mucopolysaccharidosis plus disease caused by a missense mutation in VPS33A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare and fatal disease resembling mucopolysaccharidosis in infants, is caused by impaired intracellular endocytic trafficking due to deficiency of core components of the intracellular membrane-tethering protein complexes, HOPS, and CORVET."
    explanation: >-
      Frames the disease itself as a deficiency of HOPS/CORVET core components
      causing impaired endocytic trafficking. Evidence source is OTHER because
      this is the paper's framing/background sentence rather than a report of its
      own patient or experimental data.
  downstream:
  - target: Impaired Endosome-Lysosome Tethering and Fusion
    causal_link_type: DIRECT
    description: >-
      Depletion of the tethering complexes impairs the membrane tethering and
      fusion steps of the endocytic route to the lysosome.

- name: Impaired Endosome-Lysosome Tethering and Fusion
  description: >-
    With HOPS and CORVET depleted, the tethering and fusion events that carry
    endocytic cargo from early through late endosomes into the lysosome become
    inefficient. Patient fibroblasts show vacuolation with disordered
    endosomal/lysosomal compartments, elevated EEA1 (required at early/late
    endosome fusion and early-endosome sorting), altered Golgi morphology, and
    abnormal endocytic trafficking of lactosylceramide and other
    glycosphingolipids. This node is the mechanistic pivot of MPSPS: it is a
    delivery failure upstream of catabolism, not a catabolic block, and it is
    what distinguishes MPSPS from every classical mucopolysaccharidosis.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: endosome to lysosome transport
    term:
      id: GO:0008333
      label: endosome to lysosome transport
    modifier: DECREASED
  - preferred_term: vesicle fusion
    term:
      id: GO:0006906
      label: vesicle fusion
    modifier: DECREASED
  - preferred_term: endosome organization
    term:
      id: GO:0007032
      label: endosome organization
    modifier: DYSREGULATED
  cellular_components:
  - preferred_term: late endosome
    term:
      id: GO:0005770
      label: late endosome
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  notes: >-
    Deliberately carries no conforms_to. This is the distinctive upstream route
    by which MPSPS reaches lysosomal-storage biology, and it has no counterpart
    in the lysosomal_substrate_accumulation module chain.
  evidence:
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that cultured fibroblasts from patients with this disorder have morphological changes: vacuolation with disordered endosomal/lysosomal compartments"
    explanation: >-
      Documents the disordered endosomal/lysosomal compartments and vacuolation
      in patient-derived cells.
  - reference: PMID:40758165
    reference_title: "Cellular and molecular changes in mucopolysaccharidosis-plus syndrome caused by a homozygous c.599G > C (p.Arg200Pro) variant of the VPS33A gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "indicated specific changes in cellular vacuoles, elevated levels of the EEA1 protein"
    explanation: >-
      Independent cell-biological confirmation of a disturbed endosomal
      compartment, with elevated EEA1 marking the early/late endosome fusion and
      sorting step.
  - reference: PMID:41310305
    reference_title: "The use of genistein and ambroxol may be an effective approach in correcting cellular dysfunctions of mucopolysaccharidosis-plus syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recent works demonstrated that low abundance of mutated VPS33A causes defective endosomal trafficking, resulting in poor delivery of GAGs (and perhaps also other compounds) to lysosomes, preventing their effective turnover."
    explanation: >-
      States the pivotal causal step explicitly: low VPS33A causes defective
      endosomal trafficking and poor delivery of GAGs to lysosomes, preventing
      turnover - a delivery failure rather than a catabolic block. Evidence
      source is OTHER because this sentence is the paper's background synthesis
      of prior work, not a result of its own experiments.
  downstream:
  - target: Glycosaminoglycan Accumulation With Normal Lysosomal Hydrolase Activity
    causal_link_type: DIRECT
    description: >-
      GAGs that are not efficiently delivered to the lysosome are not turned
      over and accumulate in cells, despite intact degradative enzymes.
  - target: Endolysosomal Compartment Expansion and Over-Acidification
    causal_link_type: DIRECT
    description: >-
      Failed fusion leaves an expanded, abnormally acidified endolysosomal
      compartment.

- name: Glycosaminoglycan Accumulation With Normal Lysosomal Hydrolase Activity
  description: >-
    Heparan, dermatan and (variably) chondroitin sulphate accumulate and are
    excreted in excess in the urine, and plasma heparan sulphate is
    extraordinarily elevated - around 60 times the normal reference range and
    six times the level seen in classical MPS patients. Sialylated conjugates,
    sialooligosaccharides, elevated beta-D-galactosylsphingosine and cholesterol
    and sphingolipid abnormalities are also reported. The defining biochemical
    signature of MPSPS is that all of this occurs with entirely normal activity
    of the cognate lysosomal hydrolases: it is substrate accumulation without an
    enzyme deficiency.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_processes:
  - preferred_term: glycosaminoglycan catabolic process
    term:
      id: GO:0006027
      label: glycosaminoglycan catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: glycosaminoglycan
    term:
      id: CHEBI:18085
      label: glycosaminoglycan
    modifier: INCREASED
  notes: >-
    This is the one node where MPSPS genuinely converges on the
    lysosomal_substrate_accumulation module, and it is the reason conforms_to
    is asserted here but not on the three upstream nodes. Two departures from
    the module must be read alongside the conformance. First, the cause: the
    module's accumulation node presumes the substrate arrived at the lysosome
    and could not be degraded, whereas in MPSPS the substrate is poorly
    delivered. Second - and more consequentially - the COMPARTMENT may differ.
    The module (and the Lysosomal_Storage_Disorders grouping criterion) specify
    accumulation "within the lysosomal lumen", but in MPSPS fibroblasts heparan
    sulphate shows only weak colocalisation with LysoTracker and is interpreted
    as trapped in endosomes rather than delivered to lysosomes (PMID:40758165).
    Conformance is asserted because the disease-level endpoint - progressive
    intracellular storage of an undegraded macromolecule driving secondary
    endolysosomal dysfunction and multisystem disease - is the same, but it
    should NOT be read as asserting classical intralysosomal storage. This is
    the single most interesting unresolved detail in MPSPS cell biology and is
    the reason the grouping membership question stays open.
  evidence:
  - reference: PMID:39273517
    reference_title: "Mucopolysaccharidosis-Plus Syndrome: Is This a Type of Mucopolysaccharidosis or a Separate Kind of Metabolic Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with MPSPS exhibited excessive excretion of glycosaminoglycans (GAGs) in the urine and exceptionally high levels of heparan sulfate in the plasma, but the accumulation of substrates is not caused by a decrease in the activity of any lysosomal enzymes."
    explanation: >-
      The single most important statement for this entry: GAG storage occurs
      without any decrease in lysosomal enzyme activity. Evidence source is OTHER
      because this is a focused review synthesising several study types.
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They showed extremely high levels of plasma heparan sulphate (HS, one of GAG); 60 times the normal reference range and 6 times that of MPS patients."
    explanation: >-
      Quantifies the magnitude of heparan sulphate accumulation in MPSPS, which
      exceeds that of classical MPS.
  - reference: PMID:28013294
    reference_title: "Mutation in VPS33A affects metabolism of glycosaminoglycans: a new type of mucopolysaccharidosis with severe systemic symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hence propose a new type of MPS that is not caused by an enzymatic deficiency."
    explanation: >-
      The original description explicitly frames MPSPS as an MPS-like storage
      disease that is not caused by an enzymatic deficiency.
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urine glycosaminoglycan studies revealed a pathological excess of sialylated conjugates as well as dermatan and heparan sulphate."
    explanation: >-
      Characterises the stored/excreted species as dermatan and heparan sulphate
      plus sialylated conjugates.
  - reference: PMID:31070736
    reference_title: "The lysosomal disease caused by mutant VPS33A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lipidomic screening showed elevated β-D-galactosylsphingosine with unimpaired activity of cognate lysosomal hydrolases."
    explanation: >-
      Documents accumulation of a lipid species alongside explicitly unimpaired
      cognate lysosomal hydrolase activity.
  - reference: PMID:40758165
    reference_title: "Cellular and molecular changes in mucopolysaccharidosis-plus syndrome caused by a homozygous c.599G > C (p.Arg200Pro) variant of the VPS33A gene."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "a weak HS colocalisation with LysoTracker Red"
    explanation: >-
      Qualifies the conformance asserted on this node: heparan sulphate shows
      only weak colocalisation with an acidic-lysosome marker in MPSPS
      fibroblasts, so the storage compartment may be endosomal rather than the
      lysosomal lumen the module's accumulation node presumes. Marked PARTIAL
      because it supports storage while contradicting its classical localisation.
  downstream:
  - target: Progressive Multisystem Disease With Plus Features
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Progressive intracellular storage across many tissues produces the
      MPS-like plus multisystem clinical picture.

- name: Endolysosomal Compartment Expansion and Over-Acidification
  description: >-
    Failed tethering and fusion leave an expanded endocytic compartment that is
    abnormally acidified. Lysosomal over-acidification was detected in
    patient-derived and VPS33A-depleted cells in the original description, and
    increased endolysosomal acidification with an expanded endocytic compartment
    was independently confirmed in the juvenile p.Arg200Pro form. Autophagy
    markers LC3-II and p62 are elevated in p.Arg200Pro fibroblasts, indicating a
    block in autophagic flux, though the original p.Arg498Trp study did not
    detect an autophagic defect (see the autophagy-discrepancy discussion below).
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Autophagic-Lysosomal Dysfunction and Secondary Cascade"
  biological_processes:
  - preferred_term: lysosomal lumen acidification
    term:
      id: GO:0007042
      label: lysosomal lumen acidification
    modifier: INCREASED
  - preferred_term: autophagy

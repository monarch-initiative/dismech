    autophagic-lysosomal dysfunction strictly downstream of substrate
    accumulation, whereas here over-acidification and accumulation are parallel
    consequences of the same tethering failure, and PMID:40758165 explicitly
    entertains over-acidification as a candidate primary mechanism rather than a

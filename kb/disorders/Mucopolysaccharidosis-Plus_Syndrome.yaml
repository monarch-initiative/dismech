name: Mucopolysaccharidosis-Plus Syndrome
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  Mucopolysaccharidosis-plus syndrome (MPSPS) is an ultra-rare autosomal
  recessive multisystem disorder caused by biallelic variants in VPS33A, a core
  Sec1/Munc18-family subunit of both the HOPS (homotypic fusion and protein
  sorting) and CORVET (class C core vacuole/endosome tethering) membrane
  tethering complexes that mediate endosome-lysosome fusion. Clinically it
  phenocopies a mucopolysaccharidosis — coarse facial features, dysostosis
  multiplex, hepatosplenomegaly, developmental delay and excessive urinary
  glycosaminoglycan (GAG) excretion, with plasma heparan sulphate reaching
  roughly 60 times the normal reference range — yet the activities of every
  known GAG-degrading lysosomal hydrolase are normal. MPSPS is therefore
  storage disease without an enzyme deficiency: a membrane-tethering and
  trafficking failure rather than a catabolic block. Superimposed on the
  MPS-like picture are the "plus" features atypical for classical MPS: severe
  congenital heart disease, renal involvement with nephrotic-range proteinuria
  and foamy podocytes, and haematopoietic abnormalities (anaemia,
  thrombocytopenia, hypoplastic marrow). The severe infantile form is caused by
  the recurrent founder variant c.1492C>T (p.Arg498Trp), which is strongly
  enriched in the Yakut (Sakha) population of Siberia but has also been
  reported in Turkish and other unrelated families; affected children usually
  die of cardiorespiratory failure at 10-20 months. A second, attenuated
  juvenile form is associated with the homozygous c.599G>C (p.Arg200Pro)
  variant. No disease-modifying therapy exists.
classifications:
  icimd_category:
  - classification_value: vesicular_trafficking
    notes: >-
      ICIMD "Disorders of vesicular trafficking" is the mechanistically honest
      assignment: the primary lesion is loss of a HOPS/CORVET membrane-tethering
      subunit, not loss of a degradative enzyme. Deliberately NOT classified
      under the ICIMD "glycosaminoglycan degradation" group, despite the GAG
      storage phenotype, because no GAG-degrading hydrolase is deficient.
  isds_skeletal_category:
  - classification_value: lysosomal_storage_with_skeletal_involvement
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 27 "Lysosomal
      storage diseases with skeletal involvement (dysostosis multiplex group)";
      listed as "Mucopolysaccharidosis-plus syndrome (VPS33A deficiency)".

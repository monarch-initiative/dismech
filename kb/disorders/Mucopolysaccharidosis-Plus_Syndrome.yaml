- name: Congenital heart defect
  category: Cardiovascular
  description: >-
    Congenital heart disease is one of the defining "plus" features of MPSPS and
    is not typical of conventional mucopolysaccharidosis. Cardiac disease can
    progress from moderate to severe within 3-4 months and contributes to early
    mortality. This entry is the umbrella covering the sources' generic
    "congenital heart defects" statements, where no individual lesion is
    specified; the specifically named lesions (PDA, ASD, tricuspid and mitral
    insufficiency, ventricular hypertrophy, pulmonary hypertension) are each
    curated as their own phenotype below.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  notes: >-
    TERM BINDING - do not re-litigate. HP:0001627 is retained deliberately, and
    the preferred_term/label divergence is correct, not an error: "Congenital
    heart defect" and "Congenital heart defects" are both EXACT synonyms of
    HP:0001627 (verified with OAK), so the term does carry congenital semantics
    even though its primary label does not say so. A review pass suggested
    re-binding on the grounds that HP:0001627 is a bare morphology parent
    "with no congenital semantics"; that premise is factually wrong and was
    rejected. What the review got right was a separate SPECIFICITY point, which
    has been acted on: wherever the cited source names an individual lesion, a
    specific HPO term is now curated for it. This umbrella is kept only for the
    generic statements ("Most patients developed congenital heart defects"),
    because descending to a specific lesion there would assert something the
    paper does not report.

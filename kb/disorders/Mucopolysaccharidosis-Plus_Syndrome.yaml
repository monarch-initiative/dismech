    reference_title: "Mucopolysaccharidosis-Plus Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow aspiration analysis showed hypoplastic bone marrow without any storage cells."
    explanation: >-
      Key negative finding: the marrow is hypoplastic yet free of storage cells,

      label: Molecular Analysis
  evidence:
  - reference: PMID:41818954
    reference_title: "TTC19-related mitochondrial complex III deficiency: Clinical and genetic characterization of 10 patients from 5 unrelated Arab families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cohort, exome sequencing (ES) identified three distinct pathogenic
      variants in the TTC19 gene across the five unrelated families
    explanation: Documents exome sequencing as the diagnostic route in the cohort.
- name: Brain MRI Pattern Recognition
  description: >-
    The imaging pattern is distinctive enough to raise the diagnosis: striatal
    lesions, brainstem involvement, cerebellar atrophy and hypertrophic olivary
    degeneration, the last of which was present in every patient reported at the
    time of a 2015 literature review.
  diagnosis_term:

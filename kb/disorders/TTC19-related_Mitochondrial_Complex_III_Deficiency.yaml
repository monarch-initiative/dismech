name: TTC19-related mitochondrial complex III deficiency
creation_date: "2026-08-24T22:20:00Z"
category: Mendelian
description: >-
  Mitochondrial complex III deficiency, nuclear type 2 (MC3DN2) is an autosomal
  recessive progressive neurodegenerative disease caused by biallelic
  loss-of-function variants in TTC19. TTC19 is not a conventional assembly
  factor: it binds the fully assembled complex III dimer after the iron-sulfur
  Rieske protein UQCRFS1 has been incorporated, and its role is to clear the
  N-terminal polypeptides that in situ maturation of UQCRFS1 leaves bound to the
  holocomplex. Without TTC19 those fragments accumulate inside complex III and
  compromise it structurally and functionally, reducing quinol-cytochrome c
  oxidoreductase activity and raising reactive oxygen species production. The
  clinical picture is a Leigh or Leigh-like neurodegeneration with striatal and
  brainstem lesions, cerebellar atrophy, and the distinctive finding of
  hypertrophic olivary degeneration; children typically show non-specific
  developmental delay followed by regression, ataxia, dystonia and loss of
  speech, either as a chronic progressive decline or as acute Leigh episodes
  with stepwise deterioration. No approved disease-modifying therapy exists.
disease_term:
  preferred_term: mitochondrial complex III deficiency nuclear type 2
  term:
    id: MONDO:0014063
    label: mitochondrial complex III deficiency nuclear type 2
parents:
- mitochondrial complex III deficiency, nuclear type
synonyms:
- mitochondrial complex III deficiency nuclear type 2
- MC3DN2
- TTC19 deficiency
- TTC19-related mitochondrial disease
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic TTC19 variants. Homozygous nonsense variants were
    identified in the founding consanguineous families, and homozygous missense,
    frameshift and in-frame deletion alleles have since been reported.
  evidence:
  - reference: PMID:21278747
    reference_title: "Mutations in TTC19 cause mitochondrial complex III deficiency and neurological impairment in humans and flies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous nonsense mutation in the gene encoding
      tetratricopeptide 19 (TTC19) in individuals from two families affected by
      progressive encephalopathy associated with profound cIII deficiency and
      accumulation of cIII-specific assembly intermediates.
    explanation: >-
      Homozygous nonsense variants in two independent families establish
      autosomal recessive inheritance.
notes: >-
  **The mechanism was revised after the disease was described, and the entry
  curates the revision rather than the original framing.** PMID:21278747 named
  TTC19 "a putative cIII assembly factor" on the strength of its physical
  association with complex III and the accumulation of assembly intermediates in
  patients. PMID:28673544 then showed that TTC19 binds the complex *after* the
  Rieske protein has been incorporated, and that what it actually does is remove
  the UQCRFS1 N-terminal fragments that maturation leaves behind. The
  pathophysiology chain here follows the 2017 mechanism, and the trigger node
  says explicitly that "assembly factor" is the earlier and less accurate
  description. Curating the disorder as a defect of *assembly* would misplace
  the lesion by one step and make the accumulating fragments look like a
  by-product rather than the proximate cause.

  **Normal complex III activity does not exclude the diagnosis**, and this is
  curated as a diagnostic caveat with its own evidence: PMID:25887401 reports a
  patient with normal complex III activity in two independent muscle biopsies.
  Enzymology is therefore not a rule-out, and the biochemical phenotype node is
  worded accordingly.

  **The NEC preflight returned WARN for this entry's research report, and that
  warning was acted on.** UQCRC2 was mentioned 49 times against TTC19's 178.
  UQCRC2 causes mitochondrial complex III deficiency nuclear type 5, a different
  MONDO entity. No UQCRC2 content was carried into this entry, and no claim here
  rests on a source about that gene. The report's OMIM list also included 124000
  alongside the correct 615157.

  **Pyocyanin is curated as a mechanism, not as a treatment option.** It is an
  experimental bacterial redox cycler shown to shunt electrons past a defective
  complex III in patient fibroblasts and in fly and zebrafish models. There is no
  human trial, and the only mammalian in vivo data cited is a two-month toxicity
  study in control mice. It is entered with `treatment_effect: BYPASSES` because
  that is exactly what it does mechanistically, and the entry states the
  evidence level in the treatment description so it cannot be read as clinical
  guidance.

  Research input: `research/Mitochondrial_Complex_III_Deficiency_Nuclear_Type_2-deep-research-perplexity.md`.
  It returned no PMIDs in its body, so all six references were located
  independently in PubMed and fetched with `just fetch-reference`.
pathophysiology:
- name: TTC19 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function TTC19 variants remove the protein or its function.
    TTC19 is embedded in the inner mitochondrial membrane as part of
    high-molecular-weight complexes, one of which coincides with complex III, and
    it interacts with complex III physically. It was originally described as a
    putative complex III assembly factor; the more precise account established
    later is that it acts on the already-assembled complex, which is how this
    entry models it.
  genes:
  - preferred_term: TTC19
    term:
      id: hgnc:26006
      label: TTC19
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:21278747
    reference_title: "Mutations in TTC19 cause mitochondrial complex III deficiency and neurological impairment in humans and flies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that TTC19 is embedded in the inner mitochondrial membrane
      as part of two high-molecular-weight complexes, one of which coincides with
      cIII. We then showed a physical interaction between TTC19 and cIII by
      coimmunoprecipitation.
    explanation: >-
      Establishes the submitochondrial localization and the physical association
      with complex III.
  - reference: PMID:41818954
    reference_title: "TTC19-related mitochondrial complex III deficiency: Clinical and genetic characterization of 10 patients from 5 unrelated Arab families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cohort, exome sequencing (ES) identified three distinct pathogenic
      variants in the TTC19 gene across the five unrelated families, highlighting
      both genetic heterogeneity and regional clustering.
    explanation: >-
      Recent multi-family cohort confirming allelic heterogeneity of pathogenic
      TTC19 variants.
  downstream:
  - target: Failure to Clear UQCRFS1 N-Terminal Fragments from Complex III
    description: >-
      Loss of TTC19 removes the activity that normally clears the UQCRFS1
      maturation fragments retained by the holocomplex.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28673544
      reference_title: "TTC19 Plays a Husbandry Role on UQCRFS1 Turnover in the Biogenesis of Mitochondrial Respiratory Complex III."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that, in normal conditions, these UQCRFS1 fragments are rapidly
        removed, but when TTC19 is absent they accumulate within complex III,
        causing its structural and functional impairment.
      explanation: >-
        Directly demonstrates that absence of TTC19 is what allows the fragments
        to accumulate.
- name: Failure to Clear UQCRFS1 N-Terminal Fragments from Complex III
  biological_scale: MOLECULAR
  description: >-
    TTC19 binds the fully assembled complex III dimer, that is after
    incorporation of the iron-sulfur Rieske protein UQCRFS1. In situ maturation
    of UQCRFS1 generates N-terminal polypeptides that remain bound to
    holocomplex III and are normally cleared rapidly. Without TTC19 they are
    retained inside the complex. This is a post-assembly housekeeping failure,
    not a failure to build the complex, which is the distinction that separates
    TTC19 from BCS1L and LYRM7.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex III assembly
    term:
      id: GO:0034551
      label: mitochondrial respiratory chain complex III assembly
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28673544
    reference_title: "TTC19 Plays a Husbandry Role on UQCRFS1 Turnover in the Biogenesis of Mitochondrial Respiratory Complex III."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrate that TTC19 binds to the fully assembled complex III dimer,
      i.e., after the incorporation of the iron-sulfur Rieske protein (UQCRFS1).
      The in situ maturation of UQCRFS1 produces N-terminal polypeptides, which
      remain bound to holocomplex III.
    explanation: >-
      Establishes both the timing of TTC19 binding and the origin of the retained
      fragments, which is what makes this a post-assembly defect.
  downstream:
  - target: Complex III Structural and Functional Impairment
    description: >-
      Fragments retained within the holocomplex compromise its structure and
      catalytic function.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28673544
      reference_title: "TTC19 Plays a Husbandry Role on UQCRFS1 Turnover in the Biogenesis of Mitochondrial Respiratory Complex III."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        when TTC19 is absent they accumulate within complex III, causing its
        structural and functional impairment
      explanation: Names the structural and functional consequence directly.
- name: Complex III Structural and Functional Impairment
  biological_scale: CELLULAR
  description: >-
    Quinol-cytochrome c oxidoreductase activity falls, complex III-specific
    assembly intermediates accumulate, and reactive oxygen species production
    rises. In the mouse knockout the biochemical phenotype is accompanied by
    progressive neurological and metabolic decline. Importantly, the enzymatic
    defect is not always measurable: one reported patient had normal complex III
    activity in two independent muscle biopsies.
  molecular_functions:
  - preferred_term: quinol-cytochrome-c reductase activity
    term:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28673544
    reference_title: "TTC19 Plays a Husbandry Role on UQCRFS1 Turnover in the Biogenesis of Mitochondrial Respiratory Complex III."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mouse model that shows progressive neurological and metabolic decline,
      decreased complex III activity, and increased production of reactive oxygen
      species
    explanation: >-
      Establishes reduced complex III activity and raised ROS in a mouse knockout,
      alongside the progressive phenotype.
  - reference: PMID:25887401
    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, one patient revealed normal activities of MRC complex III in two
      independent muscle biopsies.
    explanation: >-
      Qualifies the node: the biochemical defect is not detectable in every
      patient or every tissue, which is why this item is PARTIAL and why the
      diagnostic section carries an explicit caveat.
  downstream:
  - target: Progressive Neurodegeneration with Leigh-like Lesions
    description: >-
      Impaired oxidative phosphorylation is most damaging in high-energy-demand
      tissue, and the brain bears the disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21278747
      reference_title: "Mutations in TTC19 cause mitochondrial complex III deficiency and neurological impairment in humans and flies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TTC19 is a putative cIII assembly factor whose disruption is associated
        with severe neurological abnormalities in humans and flies.
      explanation: >-
        Links TTC19 disruption to the neurological phenotype across two species.
        Quoted as the paper's own summary; note the "assembly factor" wording is
        the 2011 framing, superseded by PMID:28673544.
- name: Progressive Neurodegeneration with Leigh-like Lesions
  biological_scale: ORGANISM
  description: >-
    A progressive neurodegenerative course with a characteristic lesion
    distribution: striatal (putamen and caudate) lesions, brainstem involvement,
    cerebellar atrophy and hypertrophic olivary degeneration. Two clinical
    patterns are recognised — chronic progressive decline, and acute or subacute
    Leigh episodes producing stepwise deterioration — and some patients are
    stable between episodes. Onset is typically in childhood with non-specific
    developmental delay and hypotonia, followed by regression, ataxia, dystonia
    and loss of speech.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:42480132
    reference_title: "TTC19-related mitochondrial disease: A characteristic neuroimaging signature?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging consistently revealed striatal lesions in all patients and
      brainstem involvement in almost all of them.
    explanation: >-
      Establishes the lesion distribution across an 11-patient multicentre
      cohort with centrally reviewed MRI.
  - reference: PMID:42480132
    reference_title: "TTC19-related mitochondrial disease: A characteristic neuroimaging signature?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients exhibited two distinct clinical patterns: progressive
      neurodegenerative disease (chronic Leigh syndrome) and acute/subacute Leigh
      syndrome.
    explanation: Establishes the two clinical courses curated in this node.
  - reference: PMID:25887401
    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patterns consistent with Leigh or Leigh-like syndrome were found in almost
      all, hypertrophic olivary nucleus degeneration in all patients reported so
      far
    explanation: >-
      Establishes the Leigh-like pattern and the hypertrophic olivary degeneration
      that distinguishes this disorder radiologically.

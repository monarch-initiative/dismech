- name: Respiratory Chain Enzymology
  description: >-
    Complex III activity in muscle is commonly reduced, but a normal result does
    not exclude the diagnosis: one reported patient had normal complex III
    activity in two independent muscle biopsies. Enzymology should therefore be
    treated as supportive rather than as a rule-out test.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:25887401
    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal MRC complex III activity does not exclude the diagnosis.
    explanation: >-
      The source's own conclusion, and the reason this entry does not treat
      enzymology as a rule-out.
treatments:
- name: Pyocyanin Electron Shunt (experimental, preclinical only)
  description: >-
    Pyocyanin is a bacterial redox cycler that can substitute for the redox
    function of complex III, acting as an electron shunt around the defective
    enzyme. In fibroblasts from patients carrying TTC19, BCS1L or LYRM7 variants
    it restored respiration and increased ATP production at sub-micromolar
    concentrations, and it improved movement in TTC19 fly and zebrafish models.
    THIS IS NOT A CLINICAL TREATMENT. There is no human study; the only mammalian
    in vivo data cited is a two-month administration to control mice showing no
    toxicity. It is curated because the bypass mechanism is a real and
    well-evidenced property of the pathway, not because it is an option for
    patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Complex III Structural and Functional Impairment
    treatment_effect: BYPASSES
    description: >-
      Pyocyanin transfers electrons past the impaired complex, restoring
      respiratory flux without repairing the complex itself.
    evidence:
    - reference: PMID:33833234
      reference_title: "Exploiting pyocyanin to treat mitochondrial disease due to respiratory complex III dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that pyocyanin, a bacterial redox cycler, can replace the redox
        functions of complex III, acting as an electron shunt.
      explanation: >-
        States the bypass mechanism that justifies the BYPASSES treatment effect.
  evidence:
  - reference: PMID:33833234
    reference_title: "Exploiting pyocyanin to treat mitochondrial disease due to respiratory complex III dysfunction."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Sub-μM pyocyanin was harmless, restored respiration and increased ATP
      production in fibroblasts from five patients harboring pathogenic mutations
      in TTC19, BCS1L or LYRM7, involved in assembly/stabilization of complex III.
    explanation: >-
      Patient-derived fibroblasts including TTC19 cases. PARTIAL rather than
      SUPPORT because the claim being evaluated is therapeutic usefulness, and the
      evidence is cellular and animal only.
discussions:
- discussion_id: gap_ttc19_genotype_phenotype_and_enzymology_discordance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Complex III Structural and Functional Impairment
  prompt: >-
    Why do some TTC19 patients have normal muscle complex III activity, and why
    does severity vary so widely — including a homozygous sibling who was only
    mildly affected?
  rationale: >-
    Two observations in the same report resist the simple model that residual
    complex III activity sets severity. PMID:25887401 found normal complex III
    activity in two independent muscle biopsies from a patient with the disease,
    and separately reported that the younger sister of a severely affected
    patient, homozygous for the same variant, showed only mild motor delay and
    hypotonia. PMID:42480132 adds that some patients remain stable between acute
    episodes while others decline continuously. Together these mean neither
    genotype nor muscle enzymology predicts the course, and the tissue in which
    the biochemical lesion matters may not be the tissue that is biopsied. This
    is not merely academic: enzymology is still used as a rule-out in practice,
    and the paper says explicitly that it should not be.
  proposed_experiments:
  - experiment_id: exp_ttc19_tissue_specific_enzymology
    name: Tissue-comparative complex III activity and UQCRFS1 fragment load
    description: >-
      Measure complex III activity and, separately, the abundance of retained
      UQCRFS1 N-terminal fragments in muscle, fibroblasts and, where available,
      post-mortem brain from the same TTC19 patients, including one with normal
      muscle enzymology.
    decision_criterion: >-
      Fragment load tracking disease severity where activity does not would make
      the retained fragment, rather than residual catalytic activity, the
      measurable disease marker, and would explain the normal-enzymology cases.
  - experiment_id: exp_ttc19_intrafamilial_modifier_search
    name: Modifier analysis in discordant same-genotype siblings
    description: >-
      Compare genomes and mitochondrial haplogroups of the severely and mildly
      affected siblings homozygous for the same TTC19 variant, and of other
      intrafamilial discordant pairs, to test for a nuclear or mitochondrial
      modifier of severity.
    decision_criterion: >-
      A recurrent modifier across independent discordant pairs would give a
      prognostic marker; its absence would push the explanation towards stochastic
      or environmental triggering of the acute Leigh episodes.

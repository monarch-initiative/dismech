genetic:
- name: TTC19
  gene_term:
    preferred_term: TTC19
    term:
      id: hgnc:26006
      label: TTC19
  association: Biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  features: >-
    Reported alleles include homozygous nonsense variants in the founding
    families, homozygous missense variants (c.544T>C p.Leu185Pro, c.917T>C
    p.Leu324Pro), a recurrent frameshift deletion, and an in-frame deletion
    removing ten amino acids. A recent cohort of ten patients from five unrelated
    Arab families identified three distinct pathogenic variants with regional
    clustering, including a recurrent p.Tyr260 termination allele shared by three
    independent Syrian families.
  evidence:
  - reference: PMID:25887401
    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified homozygous mutations in all three index cases, in two families
      novel missense mutations (c.544 T > C/p.Leu185Pro; c.917 T > C/p.Leu324Pro).
    explanation: Documents the missense alleles and their homozygous state.
  - reference: PMID:41818954
    reference_title: "TTC19-related mitochondrial complex III deficiency: Clinical and genetic characterization of 10 patients from 5 unrelated Arab families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 10 patients from five unrelated Arab families, all presenting with
      variable severity of a progressive neurodegenerative disorder characterized
      by loss of ambulation, speech impairment, and cognitive regression.
    explanation: >-
      The largest reported cohort, establishing the phenotype across ten patients
      and five families.
progression:
- phase: Non-specific infantile presentation
  notes: >-
    Muscular hypotonia and global developmental delay without distinguishing
    features, which is why diagnosis is typically delayed.
  evidence:
  - reference: PMID:25887401
    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients from three unrelated families presenting with initially unspecific
      clinical signs of muscular hypotonia and global developmental delay
    explanation: Establishes the non-specific opening phase.
- phase: Regression and neurological deterioration
  notes: >-
    Regression with ataxia, dystonia, loss of speech and progressive cerebellar,
    basal ganglia and brainstem involvement. Deterioration may be continuous or
    stepwise via acute Leigh episodes; in the most severely affected reported
    patients it progresses to a vegetative state.
  evidence:
  - reference: PMID:25887401
    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, neurological deterioration leading to a vegetative state
      occurs.
    explanation: Documents the endpoint of the progressive course.
  - reference: PMID:42480132
    reference_title: "TTC19-related mitochondrial disease: A characteristic neuroimaging signature?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease progression varied, with patients experiencing progressive
      decline, stepwise declines and others remaining stable between episodes.
    explanation: >-
      Qualifies the course: not all patients decline continuously, and some are
      stable between acute episodes.

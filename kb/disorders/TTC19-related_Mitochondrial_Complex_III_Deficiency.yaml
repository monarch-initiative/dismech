    reference_title: "Mutations in TTC19: expanding the molecular, clinical and biochemical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTC19 deficient patients do show characteristic clinical and neuroimaging

pathophysiology:
- name: Biallelic DOCK8 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous DOCK8 variants — most often large
    intragenic or subtelomeric 9p24.3 deletions, but also frameshift, nonsense
    and splice-site changes — abolish DOCK8 protein in lymphocytes. The locus is
    rich in repetitive sequence, which predisposes both to the germline
    deletions that dominate the mutational spectrum and to the somatic
    recombination-mediated repair seen in some patients.
  molecular_functions:
  - preferred_term: DOCK8 guanine nucleotide exchange factor activity
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:19776401
    reference_title: "Combined immunodeficiency associated with DOCK8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel homozygous or compound heterozygous \ndeletions and point mutations in the gene encoding the dedicator of cytokinesis \n8 protein (DOCK8) led to the absence of DOCK8 protein in lymphocytes."
    explanation: >-
      Establishes biallelic DOCK8 variants as the initiating lesion and absence
      of DOCK8 protein in lymphocytes as its immediate molecular consequence.
  - reference: PMID:20004785
    reference_title: "Large deletions and point mutations involving the dedicator of cytokinesis 8 (DOCK8) in the autosomal-recessive form of hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subtelomeric biallelic microdeletions were identified in 5 patients at \nthe terminus of chromosome 9p."
    explanation: >-
      Documents the large biallelic deletions at 9p24.3 that account for much of
      the mutational spectrum.
  - reference: PMID:30565250
    reference_title: "Insights into immunity from clinical and basic science studies of DOCK8 immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The DOCK8 locus has many repetitive sequence elements that predispose to the generation of large germline deletions as well as recombination-mediated somatic DNA repair."
    explanation: >-
      Explains why deletions dominate the mutational spectrum, and why somatic
      reversion occurs at this locus.
  downstream:
  - target: Loss of CDC42 Activation at the Leading-Edge Membrane
    causal_link_type: DIRECT
  - target: Impaired DOCK8-Dependent STAT3 Activation
    causal_link_type: DIRECT
- name: Loss of CDC42 Activation at the Leading-Edge Membrane
  biological_scale: MOLECULAR
  description: >-
    DOCK8 is a CDC42-specific atypical guanine nucleotide exchange factor whose
    DHR-2 domain loads GTP onto CDC42. Its DHR-1 (C2-like) domain targets it to
    phosphoinositide-rich membrane, so DOCK8 acts locally rather than globally:
    in its absence, bulk cellular CDC42-GTP is unchanged but CDC42 activation at
    the leading-edge membrane fails, and with it amoeboid polarization.
  biological_processes:
  - preferred_term: CDC42 activation at the leading-edge membrane
    term:
      id: GO:0032489
      label: regulation of Cdc42 protein signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:22461490
    reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that DOCK8 is a Cdc42-specific guanine nucleotide exchange factor that is critical for interstitial DC migration"
    explanation: >-
      Identifies CDC42 as the GTPase DOCK8 activates, establishing the
      biochemical step lost in the disease.
  - reference: PMID:22461490
    reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DOCK8 deficiency did not affect global Cdc42 activity. However, Cdc42 activation at the leading edge membrane was impaired in DOCK8-deficient DCs, resulting in a severe defect in amoeboid polarization and migration."
    explanation: >-
      Shows the defect is spatial rather than global — local leading-edge CDC42
      activation is lost while bulk CDC42-GTP is preserved.
  downstream:
  - target: Cortical Actin Cytoskeleton Dysregulation in Leukocytes
    causal_link_type: DIRECT
- name: Cortical Actin Cytoskeleton Dysregulation in Leukocytes
  biological_scale: CELLULAR
  description: >-
    CDC42-GTP activates WASP and, through the Arp2/3 complex, nucleates cortical
    F-actin. DOCK8 sits in a macromolecular complex with WASP and with talin,
    linking actin nucleation to integrin-mediated adhesion. Without DOCK8 the
    leukocyte cannot build or reorganize the cortical actin network on demand,
    which is the single shared lesion behind every downstream immune-cell
    defect in this disease.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  biological_processes:
  - preferred_term: cortical actin cytoskeleton organization
    term:
      id: GO:0030866
      label: cortical actin cytoskeleton organization
    modifier: DECREASED
  evidence:
  - reference: PMID:28625885
    reference_title: "DOCK8 deficiency: Insights into pathophysiology, clinical features and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is caused by loss of function mutations in DOCK8, encoding a guanine nucleotide exchange factor highly expressed in lymphocytes that regulates the actin cytoskeleton."
    explanation: >-
      States the core molecular lesion — loss of a lymphocyte GEF that regulates
      the actin cytoskeleton.
  - reference: PMID:23455509
    reference_title: "Dedicator of cytokinesis 8 interacts with talin and Wiskott-Aldrich syndrome protein to regulate NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that DOCK8 exists in a macromolecular complex with the Wiskott-Aldrich syndrome protein, an actin nucleation-promoting factor activated by CDC42, as well as talin, which is required for integrin-mediated adhesion"
    explanation: >-
      Places DOCK8 physically in the WASP/talin machinery that couples actin
      nucleation to integrin adhesion, explaining the breadth of the defect.
  downstream:
  - target: Lymphocyte Cytothripsis During Interstitial Migration
    causal_link_type: DIRECT
  - target: Impaired Dendritic Cell Interstitial Migration
    causal_link_type: DIRECT
  - target: Defective NK Cell Lytic Immunological Synapse
    causal_link_type: DIRECT
  - target: Defective B Cell Immunological Synapse and Germinal Centre Persistence
    causal_link_type: DIRECT
- name: Lymphocyte Cytothripsis During Interstitial Migration
  biological_scale: CELLULAR
  description: >-
    When DOCK8-deficient T and NK cells squeeze through confined,
    collagen-dense tissue such as dermis, they cannot maintain shape integrity.
    Chemotaxis itself is preserved, but the cells develop abnormal shape and
    nuclear deformation and rupture, dying by a distinctive catastrophic mode
    the discovering authors named cytothripsis. This is the mechanism that
    singles out the skin — where collagen makes up as much as a third of the
    wet weight — as the organ where DOCK8 deficiency fails first.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: leukocyte migration through dense interstitium
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: ABNORMAL
  - preferred_term: catastrophic lymphocyte death during confined migration
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:25422492
    reference_title: "DOCK8 regulates lymphocyte shape integrity for skin antiviral immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that when DOCK8-deficient T and NK cells migrate through confined spaces, they develop cell shape and nuclear deformation abnormalities that do not impair chemotaxis but contribute to a distinct form of catastrophic cell death we term cytothripsis."
    explanation: >-
      Defines cytothripsis and shows it is a shape-integrity failure specific to
      confined migration, not a chemotaxis defect.
  - reference: PMID:25422492
    reference_title: "DOCK8 regulates lymphocyte shape integrity for skin antiviral immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Such defects arise during lymphocyte migration in collagen-dense tissues when DOCK8, through CDC42 and p21-activated kinase (PAK), is unavailable to coordinate cytoskeletal structures."
    explanation: >-
      Ties cytothripsis to the CDC42/PAK-dependent cytoskeletal coordination
      lost in DOCK8 deficiency, and to collagen-dense tissue specifically.
  downstream:
  - target: Loss of Skin-Resident Memory CD8 T Cells
    causal_link_type: DIRECT
  - target: Impaired CD8 T Cell Survival and Memory
    causal_link_type: DIRECT
- name: Loss of Skin-Resident Memory CD8 T Cells
  biological_scale: TISSUE
  description: >-
    Because DOCK8-deficient cytotoxic T cells die crossing the dermis, the
    long-lived skin-resident memory CD8 T-cell pool that normally polices
    cutaneous herpesvirus reactivation is never established.
  cell_types:
  - preferred_term: skin-resident memory CD8 T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell

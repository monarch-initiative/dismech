diagnosis:
- name: Intracellular DOCK8 protein staining by flow cytometry
  description: >-
    Because nearly all patients lack DOCK8 protein entirely, intracellular
    staining for DOCK8 on peripheral blood mononuclear cells is a fast screen
    that avoids immunoblotting or sequencing. It also detects carriers and can
    track lineage-specific DOCK8 expression after transplantation. Residual
    expression does not exclude the diagnosis: somatic reversion restores DOCK8
    in some antigen-experienced T and NK cells.
  diagnosis_term:
    preferred_term: flow cytometry for intracellular DOCK8 expression
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: Absent or markedly reduced intracellular DOCK8 protein
  evidence:
  - reference: PMID:24698323
    reference_title: "Flow cytometry diagnosis of dedicator of cytokinesis 8 (DOCK8) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present here a flow cytometry assay that could facilitate the diagnosis of DOCK8 deficiency, detection of carrier status, and investigation of lineage-specific DOCK8 expression following HCT."
    explanation: Describes the assay and the three purposes it serves.
  - reference: PMID:24698323
    reference_title: "Flow cytometry diagnosis of dedicator of cytokinesis 8 (DOCK8) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority of DOCK8-deficient patients lack DOCK8 expression and many have deletions in the DOCK8 gene."
    explanation: >-
      Explains why an absent-protein screen has high yield in this disease,
      unlike diseases dominated by missense variants.
  - reference: PMID:24797421
    reference_title: "Somatic reversion in dedicator of cytokinesis 8 immunodeficiency modulates disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOCK8 expression was restored primarily within antigen-experienced T cells or natural killer cells but less so in naive T or B cells."
    explanation: >-
      Documents the lineage-restricted residual expression that can confound a
      protein-based screen in revertant patients.
- name: Copy-number-aware molecular genetic testing
  description: >-
    Sequencing alone is not sufficient. Large intragenic and subtelomeric 9p24.3
    deletions account for a large share of pathogenic alleles, so the diagnostic
    approach must include copy-number analysis (array CGH, SNP array, or
    exome/genome sequencing with CNV calling) alongside sequence analysis.
  diagnosis_term:
    preferred_term: molecular genetic testing with copy-number analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic loss-of-function DOCK8 variants, frequently large deletions
  evidence:
  - reference: PMID:19776401
    reference_title: "Combined immunodeficiency associated with DOCK8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed comparative genomic hybridization arrays and targeted gene sequencing."
    explanation: >-
      Shows that the disease-defining diagnoses required copy-number analysis in
      combination with sequencing.
  - reference: PMID:20004785
    reference_title: "Large deletions and point mutations involving the dedicator of cytokinesis 8 (DOCK8) in the autosomal-recessive form of hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed genome-wide single nucleotide polymorphism analysis for 9 \npatients with autosomal-recessive hyper-IgE syndrome to locate copy number \nvariations and homozygous haplotypes."
    explanation: >-
      Confirms copy-number analysis as the method that identified the causative
      deletions.
- name: Clinical discrimination from STAT3-HIES
  description: >-
    Before molecular confirmation, a small set of clinical features separates
    DOCK8 from STAT3 deficiency: severe viral infection, allergy and low IgM
    favour DOCK8; pneumatoceles, retained primary teeth and minimal-trauma
    fractures favour STAT3.
  evidence:
  - reference: PMID:25724123
    reference_title: "The extended clinical phenotype of 64 patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOCK8 deficiency is likely in patients with severe viral infections, allergies, and/or low IgM levels who have a diagnosis of HIES plus hypereosinophilia and upper respiratory tract infections in the absence of parenchymal lung abnormalities, retained primary teeth, and minimal trauma fractures."
    explanation: >-
      States the clinical discriminator derived from a support-vector-machine
      comparison of DOCK8-, STAT3- and mutation-negative AR-HIES patients.
  - reference: PMID:25724123
    reference_title: "The extended clinical phenotype of 64 patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A combination of 5 clinical features was helpful in distinguishing patients with DOCK8 mutations from those with STAT3 mutations."
    explanation: Confirms that a compact clinical feature set discriminates the two HIES forms.
differential_diagnoses:
- name: Autosomal dominant hyper-IgE syndrome (STAT3-HIES)
  disease_term:
    preferred_term: STAT3 hyper-IgE syndrome
    term:
      id: MONDO:0007818
      label: hyper-IgE recurrent infection syndrome 1, autosomal dominant
  description: >-
    The other hyper-IgE syndrome, and the main differential. Both share
    eczematoid dermatitis, staphylococcal skin abscess, recurrent pneumonia,
    candidiasis, very high IgE and eosinophilia — the Th17 defect common to
    both explains that overlap, and in DOCK8 deficiency it runs through the same
    STAT3 node. They separate on what each adds. STAT3-HIES adds non-immune
    connective-tissue, skeletal, dental and vascular features plus
    pneumatoceles; DOCK8 deficiency adds severe cutaneous viral infection,
    severe allergy, low IgM, early virus-driven malignancy and cerebral
    vasculopathy, and lacks the connective-tissue features.
  distinguishing_features:
  - >-
      DOCK8: severe refractory cutaneous viral infection, food allergy, low IgM,
      early squamous cell carcinoma and lymphoma, CNS vasculitis; autosomal
      recessive. STAT3: pneumatoceles, retained primary teeth, minimal-trauma
      fracture, scoliosis, characteristic facies; autosomal dominant.
  evidence:
  - reference: PMID:25724123
    reference_title: "The extended clinical phenotype of 64 patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to STAT3 deficiency, there were few pneumatoceles, bone fractures, and teething problems."
    explanation: >-
      States the features that are present in STAT3-HIES and largely absent in
      DOCK8 deficiency.
  - reference: PMID:27350570
    reference_title: "Dedicator of cytokinesis 8 regulates signal transducer and activator of transcription 3 activation and promotes T(H)17 cell differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DOCK8 interacts with STAT3 and regulates its activation and the outcome of STAT3-dependent TH17 differentiation. These findings might explain the phenotypic overlap between DOCK8 deficiency and autosomal dominant HIES."
    explanation: >-
      Gives the mechanistic reason the two diseases overlap, which is why the
      differential is clinically hard rather than merely superficial.
- name: Severe atopic dermatitis with hyper-IgE
  disease_term:
    preferred_term: atopic eczema
    term:
      id: MONDO:0004980
      label: atopic eczema
  description: >-
    Ordinary severe atopic dermatitis can reach very high IgE levels and
    recurrent skin infection, and is far commoner. What it does not produce is
    the combination with refractory cutaneous viral infection, low IgM, impaired
    specific antibody responses and virus-driven malignancy.
  distinguishing_features:
  - >-
      Atopic dermatitis lacks the combined immune defect: specific antibody
      responses, IgM, T-cell counts and NK function are normal, and refractory
      HPV/molluscum disease and early malignancy do not occur.
  evidence:
  - reference: PMID:25724123
    reference_title: "The extended clinical phenotype of 64 patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOCK8-deficient patients had median IgE levels of 5201 IU, high eosinophil levels of usually at least 800/μL (92% of patients), and low IgM levels (62%)."
    explanation: >-
      Low IgM alongside the atopic laboratory profile is the finding that points
      away from uncomplicated atopic dermatitis.
- name: Wiskott-Aldrich syndrome
  disease_term:
    preferred_term: Wiskott-Aldrich syndrome
    term:
      id: MONDO:0010518
      label: Wiskott-Aldrich syndrome
  description: >-
    The other classic actin-cytoskeleton inborn error of immunity, and
    mechanistically the closest neighbour: WASP is the actin nucleation-promoting
    factor that CDC42 — and therefore DOCK8 — activates, and DOCK8 sits in a
    complex with it. WAS likewise couples eczema with elevated IgE and recurrent
    infection. It is X-linked and adds microthrombocytopenia, which DOCK8
    deficiency does not cause.
  distinguishing_features:
  - >-
      WAS is X-linked and features small-platelet thrombocytopenia with bleeding
      from infancy. DOCK8 deficiency is autosomal recessive with normal platelets,
      and is dominated by refractory cutaneous viral infection and severe food
      allergy.
  evidence:
  - reference: PMID:23455509
    reference_title: "Dedicator of cytokinesis 8 interacts with talin and Wiskott-Aldrich syndrome protein to regulate NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that DOCK8 exists in a macromolecular complex with the Wiskott-Aldrich syndrome protein, an actin nucleation-promoting factor activated by CDC42, as well as talin, which is required for integrin-mediated adhesion"
    explanation: >-
      Establishes the shared molecular pathway that makes these two diseases
      mechanistic neighbours and clinical mimics.
- name: Chronic mucocutaneous candidiasis
  disease_term:
    preferred_term: chronic mucocutaneous candidiasis
    term:
      id: MONDO:0015279
      label: chronic mucocutaneous candidiasis
  description: >-
    DOCK8 deficiency is one of the genetic causes of a CMC picture, through its
    Th17 differentiation block. What distinguishes it is that the candidiasis is
    one feature of a broad combined immunodeficiency rather than an isolated
    IL-17-axis lesion: the DOCK8 patient additionally has refractory cutaneous
    viral infection, severe atopy, humoral failure and malignancy risk.
  distinguishing_features:
  - >-
      Isolated IL-17-axis defects (IL17F, IL17RA, IL17RC, ACT1/TRAF3IP2, RORC)
      produce a narrow mucocutaneous fungal phenotype and little else. DOCK8
      deficiency produces a broad combined immunodeficiency in which candidiasis
      is one component.
  evidence:
  - reference: PMID:27350570
    reference_title: "Dedicator of cytokinesis 8 regulates signal transducer and activator of transcription 3 activation and promotes T(H)17 cell differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There was a profound block in the differentiation of DOCK8-deficient naive CD4+ T"
    explanation: >-
      Documents the Th17 differentiation block that places DOCK8 deficiency
      among the genetic causes of chronic mucocutaneous candidiasis.
animal_models:
- name: Dock8 ENU point-mutant mouse (captain morgan / primurus)
  species: Mus musculus
  genotype: Dock8 cpm/cpm or pri/pri (ENU-induced recessive loss-of-function)
  background: C57BL/6
  category: Chemical mutagenesis (ENU) forward-genetic screen
  publication: PMID:19898472
  description: >-
    Two independent recessive ENU alleles recovered from a forward-genetic
    screen for mice that mount a normal first wave of antibody but fail to
    mature or sustain the response. They identified DOCK8 as a humoral-immunity
    gene before the human disease gene was known, and they model the B-cell arm
    specifically.
  genes:
  - preferred_term: DOCK8
    term:
      id: hgnc:19191
      label: DOCK8
  modeled_mechanisms:
  - target: Defective B Cell Immunological Synapse and Germinal Centre Persistence
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Mutant B cells fail to form marginal-zone B cells, fail to persist in
      germinal centres, and fail to accumulate ICAM-1 in the immunological
      synapse while other BCR signalling is intact.
    limitations: >-
      These are point mutants rather than the large deletions that dominate the
      human mutational spectrum, and the screen selected specifically for a
      humoral phenotype, so the model speaks to the B-cell arm rather than to
      the cutaneous viral or atopic arms of the human disease.
    readouts:
    - name: Germinal centre persistence and affinity maturation
      target: Defective B Cell Immunological Synapse and Germinal Centre Persistence
      direction: DECREASED
      interpretation: >-
        Structural and functional correlate of the germinal-centre failure node.
      evidence:
      - reference: PMID:19898472
        reference_title: "Dock8 mutations cripple B cell immunological synapses, germinal centers and long-lived antibody production."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "DOCK8-mutant B cells were unable to form marginal zone B cells or to persist in germinal centers and undergo affinity maturation."
        explanation: Reports the germinal-centre and marginal-zone measurement in the mutant mice.
    - name: ICAM-1 accumulation in the B cell immunological synapse
      target: Defective B Cell Immunological Synapse and Germinal Centre Persistence
      direction: DECREASED
      interpretation: The synapse-organization measurement that explains the germinal-centre failure.
      evidence:
      - reference: PMID:19898472
        reference_title: "Dock8 mutations cripple B cell immunological synapses, germinal centers and long-lived antibody production."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Dock8 mutations disrupted accumulation of the integrin ligand ICAM-1 in the B cell immunological synapse but did not alter other aspects of B cell antigen receptor signaling."
        explanation: Reports the ICAM-1 synapse measurement and its specificity.
    evidence:
    - reference: PMID:19898472
      reference_title: "Dock8 mutations cripple B cell immunological synapses, germinal centers and long-lived antibody production."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Two recessive mutations that disrupted antibody response maturation (Fig. 1a,b) were propagated from independent pedigrees and denoted captain morgan (cpm) and primurus (pri)."
      explanation: >-
        Identifies the two alleles and the phenotype they were selected for,
        supporting the model as informative for the humoral node.
- name: Dock8 knockout mouse
  species: Mus musculus
  genotype: Dock8 knockout
  publication: PMID:22461490
  description: >-
    Targeted Dock8 knockout used to establish the dendritic-cell migration
    defect and to show that DOCK8 acts as a spatially restricted CDC42 activator
    rather than a global one.
  genes:
  - preferred_term: DOCK8
    term:
      id: hgnc:19191
      label: DOCK8
  modeled_mechanisms:
  - target: Impaired Dendritic Cell Interstitial Migration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Knockout dendritic cells migrate normally in two dimensions but cannot
      crawl through three-dimensional fibrillar networks or transmigrate the
      subcapsular sinus floor, and do not accumulate in the lymph node
      parenchyma for T-cell priming.
    limitations: >-
      The human dendritic-cell phenotype is inferred from this mouse; equivalent
      in vivo lymph-node imaging is not available in patients.
    readouts:
    - name: Dendritic cell accumulation in the lymph node parenchyma
      target: Impaired Dendritic Cell Interstitial Migration
      direction: DECREASED
      interpretation: Direct measurement of the priming failure this node predicts.
      evidence:
      - reference: PMID:22461490
        reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "By generating the knockout mice, we found that in the absence of DOCK8, DCs failed to accumulate in the lymph node parenchyma for T-cell priming."
        explanation: Reports the lymph-node accumulation measurement in the knockout.
    - name: Leading-edge CDC42 activation in migrating dendritic cells
      target: Impaired Dendritic Cell Interstitial Migration
      direction: DECREASED
      interpretation: >-
        Localizes the defect to spatial CDC42 activation rather than to total
        CDC42-GTP.
      evidence:
      - reference: PMID:22461490
        reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cdc42 activation at the leading edge membrane was impaired in DOCK8-deficient DCs, resulting in a severe defect in amoeboid polarization and migration."
        explanation: Reports the leading-edge CDC42 measurement.
    evidence:
    - reference: PMID:22461490
      reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Therefore, DOCK8 regulates interstitial DC migration by controlling Cdc42 activity spatially."
      explanation: >-
        States the mechanistic conclusion the knockout establishes, supporting
        the model as informative for this node.
- name: Dock8 mutant mouse CD8 T cell compartment
  species: Mus musculus
  genotype: Dock8 loss-of-function mutant
  publication: PMID:22006977
  description: >-
    Used in parallel with patient cells to separate cell-intrinsic from
    extrinsic causes of the CD8 defect, and to show the failure is of memory
    persistence rather than of primary expansion.
  genes:
  - preferred_term: DOCK8
    term:
      id: hgnc:19191
      label: DOCK8
  modeled_mechanisms:
  - target: Impaired CD8 T Cell Survival and Memory
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Mutant mice reproduce the human loss of circulating naive CD8 T cells, and
      add what patient studies cannot show: that the defect is cell-autonomous
      and primarily postthymic, and that primary clonal expansion is near-normal
      while memory persistence and recall fail.
    limitations: >-
      Recall was assayed after recombinant influenza infection rather than after
      the cutaneous herpesvirus challenge that dominates human disease, so the
      link from this readout to the skin phenotype is inferential.
    readouts:
    - name: Memory CD8 T cell persistence and recall after influenza challenge
      target: Impaired CD8 T Cell Survival and Memory
      direction: DECREASED
      interpretation: >-
        Distinguishes a memory-maintenance failure from a priming or expansion
        failure.
      evidence:
      - reference: PMID:22006977
        reference_title: "DOCK8 deficiency impairs CD8 T cell survival and function in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although DOCK8 mutant T cells underwent near-normal primary clonal expansion after primary infection with recombinant influenza virus in vivo, they showed greatly reduced memory cell persistence and recall."
        explanation: Reports the memory-persistence and recall measurement.
    evidence:
    - reference: PMID:22006977
      reference_title: "DOCK8 deficiency impairs CD8 T cell survival and function in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Analyses in mice revealed the CD8 T cell abnormalities to be cell autonomous and primarily postthymic."
      explanation: >-
        Establishes what the mouse adds over the patient data — that the defect
        is cell-intrinsic — supporting the model as informative for this node.

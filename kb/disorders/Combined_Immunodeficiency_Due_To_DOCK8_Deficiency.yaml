    reference_title: "Combined immunodeficiency associated with DOCK8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extensive and \npersistent infections with molluscum contagiosum; and human papillomavirus \ninfections."
    explanation: >-
      Documents persistent rather than self-limited infection by the
      cutaneotropic DNA viruses in the disease-defining cohort.
  - reference: PMID:30565250
    reference_title: "Insights into immunity from clinical and basic science studies of DOCK8 immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "profound susceptibility to virus infections of the skin, with associated skin cancers"
    explanation: >-
      Links the persistent cutaneous viral infection directly to the skin

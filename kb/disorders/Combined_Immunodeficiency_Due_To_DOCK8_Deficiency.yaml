- name: Impaired CD8 T Cell Survival and Memory
  biological_scale: CELLULAR
  description: >-
    Beyond cytothripsis, DOCK8-null naive CD8 T cells are intrinsically
    short-lived, polarize LFA-1 poorly at the synapse with dendritic cells, and
    are delayed in their first division. Primary clonal expansion after
    infection is near-normal, but memory persistence and recall are severely
    reduced — so the compartment that should contain reactivating persistent
    viruses is not maintained. In patients, circulating CD8 T cells are reduced
    and skewed to an exhausted CD45RA+CCR7- phenotype.

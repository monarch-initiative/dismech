  - reference: PMID:23455509
    reference_title: "Dedicator of cytokinesis 8 interacts with talin and Wiskott-Aldrich syndrome protein to regulate NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NK cells depleted of DOCK8 showed defective conjugate formation, along with decreased polarization of LFA-1, F-actin, and cytolytic granules toward the cytotoxic synapse"
    explanation: >-

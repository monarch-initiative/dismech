  evidence:
  - reference: PMID:25627830
    reference_title: "DOCK8 deficiency: clinical and immunological phenotype and treatment options - a review of 136 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapeutic measures included antiviral and antibacterial prophylaxis, immunoglobulin replacement and HSCT."
    explanation: >-
      Records immunoglobulin replacement as a standard therapeutic measure in
      the largest published cohort.

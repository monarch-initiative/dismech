- name: Impaired Dendritic Cell Interstitial Migration
  biological_scale: CELLULAR
  description: >-
    DOCK8-deficient dendritic cells migrate normally on flat two-dimensional
    surfaces but cannot crawl through three-dimensional fibrillar networks or
    transmigrate the subcapsular sinus floor, so they fail to reach the lymph
    node parenchyma where they would prime T cells. Antigen collected in skin
    therefore never reaches the T-cell zone efficiently.
  cell_types:
  - preferred_term: conventional dendritic cell
    term:
      id: CL:0000990
      label: conventional dendritic cell
  biological_processes:
  - preferred_term: interstitial dendritic cell migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: DECREASED
  evidence:
  - reference: PMID:22461490
    reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By generating the knockout mice, we found that in the absence of DOCK8, DCs failed to accumulate in the lymph node parenchyma for T-cell priming."
    explanation: >-
      Shows DOCK8-null dendritic cells do not reach the site where T-cell
      priming occurs.
  - reference: PMID:22461490
    reference_title: "DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during immune responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although DOCK8-deficient DCs migrated normally on 2-dimensional surfaces, DOCK8 was required for DCs to crawl within 3-dimensional fibrillar networks and to transmigrate through the subcapsular sinus floor."
    explanation: >-
      Establishes that the defect is specific to three-dimensional interstitial
      migration, mirroring the lymphocyte shape-integrity lesion.
  downstream:
  - target: Failure of Cutaneous Antiviral Immunosurveillance
    causal_link_type: DIRECT
- name: Defective NK Cell Lytic Immunological Synapse
  biological_scale: CELLULAR
  description: >-
    NK-cell killing requires focused F-actin accumulation at the lytic
    immunological synapse, driven by CDC42-activated WASP. DOCK8-deficient NK
    cells retain normal total F-actin but cannot concentrate it at the synapse,
    form defective conjugates, and fail to polarize LFA-1 and cytolytic granules
    toward the target. Cytotoxicity is reduced and is not rescued by IL-2.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: lytic immunological synapse formation
    term:
      id: GO:0001771
      label: immunological synapse formation
    modifier: DECREASED
  - preferred_term: natural killer cell mediated cytotoxicity
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
    modifier: DECREASED
  evidence:
  - reference: PMID:23380217
    reference_title: "Defective actin accumulation impairs human natural killer cell function in patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOCK8 deficiency impaired F-actin accumulation at the lytic immunologic synapse without affecting overall NK cell F-actin content."
    explanation: >-
      Localizes the NK defect precisely to synaptic F-actin accumulation rather
      than to a global actin deficit.
  - reference: PMID:23380217
    reference_title: "Defective actin accumulation impairs human natural killer cell function in patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOCK8-deficient patients' NK cells and DOCK8 knockdown cell lines all had decreased NK cell cytotoxicity, which could not be restored after IL-2 stimulation."
    explanation: >-
      Documents the functional consequence in patient cells, and that it is not

    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous)
    loss-of-function DOCK8 variants. Heterozygous carriers are unaffected.
    Parental consanguinity is common in reported pedigrees.
  evidence:
  - reference: PMID:19776401

- name: Defective B Cell Immunological Synapse and Germinal Centre Persistence
  biological_scale: CELLULAR
  description: >-
    DOCK8-mutant B cells fail to accumulate the integrin ligand ICAM-1 in the
    immunological synapse while other aspects of B-cell receptor signalling
    remain intact. They cannot form marginal-zone B cells, cannot persist in
    germinal centres, and do not undergo affinity maturation — a synapse
    organisation defect rather than a signalling-cascade defect.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: B cell immunological synapse formation
    term:
      id: GO:0001771
      label: immunological synapse formation
    modifier: DECREASED
  - preferred_term: germinal center B cell differentiation
    term:
      id: GO:0002314
      label: germinal center B cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:19898472
    reference_title: "Dock8 mutations cripple B cell immunological synapses, germinal centers and long-lived antibody production."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DOCK8-mutant B cells were unable to form marginal zone B cells or to persist in germinal centers and undergo affinity maturation."
    explanation: >-
      Establishes the germinal-centre and marginal-zone failure that underlies
      the humoral defect.
  - reference: PMID:19898472
    reference_title: "Dock8 mutations cripple B cell immunological synapses, germinal centers and long-lived antibody production."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dock8 mutations disrupted accumulation of the integrin ligand ICAM-1 in the B cell immunological synapse but did not alter other aspects of B cell antigen receptor signaling."
    explanation: >-
      Localizes the B-cell lesion to synapse organization, consistent with the
      shared cytoskeletal mechanism rather than a BCR-signalling defect.
  downstream:
  - target: Impaired Humoral Memory and Specific Antibody Responses
    causal_link_type: DIRECT
- name: Impaired Humoral Memory and Specific Antibody Responses
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The germinal-centre failure translates into poor long-lived antibody
    production: fewer than half of tested patients mount normal specific
    antibody responses to recall antigens, and low serum IgM is characteristic.
    This is the arm of the combined defect that produces the recurrent
    encapsulated-organism sinopulmonary infection and chronic otitis media.
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: DECREASED
  evidence:
  - reference: PMID:25724123
    reference_title: "The extended clinical phenotype of 64 patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fewer than half of the patients tested produced normal specific antibody responses to recall antigens."
    explanation: >-
      Quantifies the humoral failure in the largest genetically confirmed
      phenotype series.
  - reference: PMID:19898472
    reference_title: "Dock8 mutations cripple B cell immunological synapses, germinal centers and long-lived antibody production."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Humoral immunodeficiency due to Dock8 mutation provides evidence that organization of the immunological synapse is critical for signaling the survival of B cell subsets required for long-lasting immunity."
    explanation: >-
      States the causal claim from synapse organization to loss of long-lasting
      humoral immunity.
  downstream:
  - target: Recurrent respiratory infections
    causal_link_type: DIRECT
  - target: Otitis media
    causal_link_type: DIRECT
  - target: Decreased circulating total IgM
    causal_link_type: DIRECT
- name: Impaired DOCK8-Dependent STAT3 Activation
  biological_scale: MOLECULAR
  description: >-
    DOCK8 is not only a GEF. It associates constitutively with STAT3
    independently of GEF activity, and — in a GEF-activity-dependent manner —
    promotes STAT3 phosphorylation, nuclear translocation, and STAT3-dependent
    gene expression. This second, non-cytoskeletal function is why an actin
    disorder produces part of the phenotype of a STAT3 transcription-factor
    disorder.
  biological_processes:
  - preferred_term: STAT3 signaling downstream of cytokine receptors
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:27350570
    reference_title: "Dedicator of cytokinesis 8 regulates signal transducer and activator of transcription 3 activation and promotes T(H)17 cell differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DOCK8 constitutively associated with STAT3 independent of GEF activity, whereas it regulated STAT3 phosphorylation in a GEF activity-dependent manner. DOCK8 also promoted STAT3 translocation to the nucleus and induction of STAT3-dependent gene expression."
    explanation: >-
      Establishes the direct DOCK8-STAT3 interaction and DOCK8's requirement for
      full STAT3 activation.
  - reference: PMID:28625885
    reference_title: "DOCK8 deficiency: Insights into pathophysiology, clinical features and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additional roles of DOCK8 have also emerged, including regulating MyD88-dependent Toll-like receptor signaling and the activation of the transcription factor STAT3."
    explanation: >-
      Confirms STAT3 activation as an established non-cytoskeletal DOCK8
      function.
  downstream:
  - target: Th17 Differentiation Block
    causal_link_type: DIRECT
  - target: Th2 Skewing and IgE Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Th17 Differentiation Block
  biological_scale: CELLULAR
  description: >-
    Naive CD4 T cells from DOCK8-deficient patients are profoundly blocked in
    differentiating to Th17 cells, and a missense variant that disrupts GEF
    activity while sparing protein expression reproduces the block — tying the
    defect to catalytic function rather than to a scaffolding role alone. The
    resulting collapse of IL-17/IL-22 mucocutaneous defence is the shared
    mechanism behind the candidiasis and staphylococcal susceptibility that
    DOCK8 deficiency and STAT3-HIES have in common.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:27350570
    reference_title: "Dedicator of cytokinesis 8 regulates signal transducer and activator of transcription 3 activation and promotes T(H)17 cell differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A missense mutation that disrupts DOCK8 guanine nucleotide exchange factor (GEF) activity while sparing protein expression also impaired TH17 cell differentiation."
    explanation: >-
      Shows the Th17 block depends on DOCK8 catalytic GEF activity, separating
      it from loss of the protein as a scaffold.
  - reference: PMID:27350570
    reference_title: "Dedicator of cytokinesis 8 regulates signal transducer and activator of transcription 3 activation and promotes T(H)17 cell differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DOCK8 interacts with STAT3 and regulates its activation and the outcome of STAT3-dependent TH17 differentiation. These findings might explain the phenotypic overlap between DOCK8 deficiency and autosomal dominant HIES."
    explanation: >-
      Connects the STAT3 defect to the Th17 block and to the clinical overlap
      with STAT3-HIES.
  - reference: PMID:20004785
    reference_title: "Large deletions and point mutations involving the dedicator of cytokinesis 8 (DOCK8) in the autosomal-recessive form of hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "defective \nT-cell activation and T(h)17 cell differentiation"
    explanation: >-
      Independently documents the Th17 differentiation defect in
      DOCK8-deficient patients.
  downstream:
  - target: Chronic mucocutaneous candidiasis
    causal_link_type: DIRECT
  - target: Recurrent respiratory infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Th2 Skewing and IgE Dysregulation
  role: consequence
  biological_scale: ORGANISM
  description: >-
    With Th17 and Th1 output constrained, T-helper differentiation skews toward
    Th2, and eosinophil homeostasis and IgE regulation are disturbed. The result
    is the atopic arm of the disease — early severe eczema, extreme total IgE,
    hypereosinophilia and IgE-mediated food allergy — and it is the arm that
    responds least reliably to transplantation.
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
    modifier: INCREASED
  - preferred_term: immunoglobulin E production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  evidence:
  - reference: PMID:20004785
    reference_title: "Large deletions and point mutations involving the dedicator of cytokinesis 8 (DOCK8) in the autosomal-recessive form of hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired eosinophil \nhomeostasis and dysregulation of IgE."
    explanation: >-
      Documents disordered eosinophil homeostasis and IgE regulation as part of
      the DOCK8-deficiency phenotype.
  - reference: PMID:30565250
    reference_title: "Insights into immunity from clinical and basic science studies of DOCK8 immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loss of DOCK8 also causes immune deficits through other mechanisms including a milder generalized cell survival defect and skewing of T helper cell subsets."
    explanation: >-
      States T-helper subset skewing as an established consequence of DOCK8
      loss, distinct from the migration/shape mechanism.
  downstream:

name: Combined Immunodeficiency Due To DOCK8 Deficiency
creation_date: "2026-09-11T00:00:00Z"
category: Mendelian
synonyms:
- DOCK8 deficiency
- DOCK8 immunodeficiency syndrome
- Autosomal recessive hyper-IgE syndrome
- AR-HIES
- Hyper-IgE recurrent infection syndrome 2, autosomal recessive
- HIES2
- Combined immunodeficiency due to dedicator of cytokinesis 8 protein deficiency
disease_term:
  preferred_term: Combined immunodeficiency due to DOCK8 deficiency
  term:
    id: MONDO:0009478
    label: combined immunodeficiency due to DOCK8 deficiency
parents:
- Combined immunodeficiency
- Primary Immunodeficiency
description: >-
  Combined immunodeficiency due to DOCK8 deficiency is an autosomal recessive
  inborn error of immunity caused by biallelic loss-of-function variants in
  DOCK8, and is the principal genetic cause of the autosomal recessive form of
  hyper-IgE syndrome (AR-HIES). DOCK8 is an atypical guanine nucleotide exchange
  factor that activates the Rho-family GTPase CDC42 at the leading-edge membrane
  of migrating and synapsing leukocytes. Without it, lymphocytes cannot
  coordinate the cortical actin cytoskeleton: CD8 T cells and NK cells moving
  through collagen-dense tissue such as dermis undergo catastrophic shape
  rupture and die (cytothripsis), dendritic cells fail to crawl through
  three-dimensional interstitium to prime T cells in lymph nodes, NK cells fail
  to build a lytic immunological synapse, and B cells fail to organize the
  integrin-containing immune synapse needed for marginal-zone and germinal
  centre persistence. DOCK8 additionally binds STAT3 and is required for its
  full activation, which is why the disease phenocopies part of STAT3-HIES. The
  clinical result is a triad of recurrent sinopulmonary bacterial infection,
  severe and recalcitrant cutaneous viral infection (molluscum contagiosum,
  HPV warts, HSV, VZV), and severe atopy with markedly elevated serum IgE,
  eosinophilia and food allergy, on a background of virus-driven malignancy and
  cerebral vasculopathy. Unlike STAT3-HIES it spares the connective-tissue,
  skeletal, dental and pneumatocele features. Natural history is poor —
  survival falls to roughly a third by age 30 without intervention — and
  allogeneic haematopoietic stem cell transplantation is the only curative
  therapy.

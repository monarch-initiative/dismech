- name: Cerebral Vasculopathy
  biological_scale: TISSUE
  description: >-
    A distinctive non-infectious complication: cerebral vasculitis, arterial
    aneurysm, infarction and intracranial haemorrhage in young patients. The
    mechanism is not settled. VZV-associated vasculopathy is the leading
    proposal, which would place it downstream of the same failure of cutaneous
    and systemic antiviral control; a direct vascular role for DOCK8 has not
    been demonstrated.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:25627830
    reference_title: "DOCK8 deficiency: clinical and immunological phenotype and treatment options - a review of 136 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe non-infectious cerebral events occurred in 14/136 (10 %)"
    explanation: >-
      Quantifies the frequency of severe non-infectious cerebral events in the
      largest published cohort.
  - reference: PMID:30565250
    reference_title: "Insights into immunity from clinical and basic science studies of DOCK8 immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The severe virus infections of the skin, and probably also VZV-associated vasculopathy, reflect an important function of DOCK8, which is normally required to maintain lymphocyte shape integrity as the cells migrate through dense tissues."
    explanation: >-
      Proposes VZV-associated vasculopathy as the link between the shape-integrity
      lesion and the cerebral disease. The authors hedge ("probably"), so this
      supports the proposed mechanism without establishing it.
  downstream:
  - target: Stroke
    causal_link_type: DIRECT

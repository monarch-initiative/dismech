genetic:
- name: DOCK8
  gene_term:
    preferred_term: DOCK8
    term:
      id: hgnc:19191
      label: DOCK8
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic loss-of-function variants in DOCK8 (9p24.3) cause the disease.
    DOCK8 encodes an atypical guanine nucleotide exchange factor for CDC42 that
    is expressed almost exclusively in immune cells. Nearly all reported alleles
    are null: large intragenic or whole-gene deletions and complex
    rearrangements predominate, with frameshift, nonsense and splice-site point
    mutations accounting for most of the remainder and missense variants being
    rare. The locus is unusually rich in repetitive sequence, which explains
    both the deletion-heavy mutational spectrum and the somatic
    recombination-mediated reversion seen in a substantial minority of patients.
  notes: >-
    HGNC identifier verified against the HGNC REST API (rest.genenames.org),
    which returns hgnc_id HGNC:19191, symbol DOCK8, name "dedicator of
    cytokinesis 8", location 9p24.3, NCBI Gene 81704, UniProt Q8NF50. The
    lowercase `hgnc:` form is this repository's convention. The same CURIE is
    already bound to DOCK8 in kb/disorders/Chronic_Mucocutaneous_Candidiasis.yaml.
  evidence:
  - reference: PMID:19776401
    reference_title: "Combined immunodeficiency associated with DOCK8 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel homozygous or compound heterozygous \ndeletions and point mutations in the gene encoding the dedicator of cytokinesis \n8 protein (DOCK8) led to the absence of DOCK8 protein in lymphocytes."
    explanation: >-
      Establishes DOCK8 as the causative gene and loss of DOCK8 protein as the
      functional consequence.
  - reference: PMID:20004785
    reference_title: "Large deletions and point mutations involving the dedicator of cytokinesis 8 (DOCK8) in the autosomal-recessive form of hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of patients without large \ndeletions revealed 16 patients from 9 unrelated families with distinct \nhomozygous mutations in DOCK8 causing premature termination, frameshift, splice \nsite disruption, and single exon deletions and microdeletions."
    explanation: >-
      Characterizes the non-deletion end of the mutational spectrum as
      uniformly truncating or splice-disrupting.
  - reference: PMID:30565250
    reference_title: "Insights into immunity from clinical and basic science studies of DOCK8 immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The DOCK8 locus has many repetitive sequence elements that predispose to the generation of large germline deletions as well as recombination-mediated somatic DNA repair."
    explanation: >-
      Explains the deletion-dominated spectrum and the propensity to somatic
      reversion as consequences of the same locus architecture.
- name: DOCK8 somatic reversion
  gene_term:
    preferred_term: DOCK8
    term:
      id: hgnc:19191
      label: DOCK8
  relationship_type: MODIFIER
  variant_origin: SOMATIC
  association: >-
    Somatic repair of the germline DOCK8 lesion — by second-site mutation,
    original-site back mutation, gene conversion or intragenic crossover —
    restores DOCK8 expression in a subset of lymphocytes, preferentially
    antigen-experienced T cells and NK cells rather than naive T or B cells.
    Revertant patients are older and have milder allergic disease, but infection
    susceptibility persists and reversion is not curative. It is the principal
    known within-patient modifier of disease severity, and is a further reason
    to interpret residual DOCK8 protein on a flow-cytometry assay carefully.
  evidence:
  - reference: PMID:24797421
    reference_title: "Somatic reversion in dedicator of cytokinesis 8 immunodeficiency modulates disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 17 of 34 DOCK8-deficient patients who had germline mutations with variable degrees of reversion caused by somatic repair."
    explanation: Quantifies how often somatic reversion occurs in a referral cohort.
  - reference: PMID:24797421
    reference_title: "Somatic reversion in dedicator of cytokinesis 8 immunodeficiency modulates disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic repair of the DOCK8 mutations resulted from second-site mutation, original-site mutation, gene conversion, and intragenic crossover."
    explanation: Lists the molecular mechanisms of reversion.
  - reference: PMID:24797421
    reference_title: "Somatic reversion in dedicator of cytokinesis 8 immunodeficiency modulates disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who had reversions were older and had less severe allergic disease, although infection susceptibility persisted. No patients were cured without hematopoietic cell transplantation."
    explanation: >-
      Establishes reversion as a partial severity modifier that does not
      substitute for curative therapy.
progression:
- phase: Infancy and early childhood
  notes: >-
    Presentation is with severe eczematous dermatitis and recurrent bacterial
    skin and sinopulmonary infection, usually within the first year of life,
    accompanied by very high IgE, eosinophilia and emerging food allergy.
  evidence:
  - reference: PMID:24797421
    reference_title: "Somatic reversion in dedicator of cytokinesis 8 immunodeficiency modulates disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typically, patients develop diffuse eczematous dermatitis with bacterial skin infections early in life, along with respiratory tract infections and severe food allergies"
    explanation: Describes the early-life presenting picture.
- phase: Later childhood and adolescence
  notes: >-
    Cutaneous viral disease expands and becomes refractory, bronchiectasis
    accrues from repeated pneumonia, and the first malignancies and cerebral
    events appear. Malignancy in the largest cohort was diagnosed at a median
    age of 12 years.
  evidence:
  - reference: PMID:25627830
    reference_title: "DOCK8 deficiency: clinical and immunological phenotype and treatment options - a review of 136 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malignancy was diagnosed in 23/136 (17 %) patients (11 hematological and 9 epithelial cancers, 5 other malignancies) at a median age of 12 years."
    explanation: Places the onset of malignancy in later childhood.
- phase: Young adulthood without transplantation
  notes: >-
    Cumulative mortality from infection, cancer and cerebrovascular events.
    Only about a third of patients reach 30 years without transplantation, and
    event-free survival is 4% at that age.
  evidence:
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only about a third of patients reach the age of 30 years without hematopoietic stem cell transplantation"
    explanation: >-
      Gives the untransplanted survival to age 30, restating the Aydin 2015
      natural-history curve without the bracketed censoring clause.
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "about 75% develop severe, life-threatening disease complications before the age of 20 years"
    explanation: Quantifies severe complications accrued before adulthood.
  - reference: PMID:25627830
    reference_title: "DOCK8 deficiency: clinical and immunological phenotype and treatment options - a review of 136 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Event free survival was 44, 18 and 4 % at the same time points if events were defined as death, life-threatening infections, malignancy or cerebral complications such as CNS vasculitis or stroke."
    explanation: Gives event-free survival, the measure that captures the accumulating complication burden.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated DOCK8 deficiency is a fatal disease of childhood and young
    adulthood. Two thirds of patients are dead by 30 years censored for
    transplantation, 58% experience a severe life-threatening infection, 17%
    develop a malignancy at a median age of 12, and 10% suffer a severe
    non-infectious cerebral event. Mortality in the genetically confirmed
    phenotype series was 34%. Between these events, chronic disfiguring skin
    disease, multiple food allergies and repeated hospitalization dominate daily
    life.
  evidence:
  - reference: PMID:25627830
    reference_title: "DOCK8 deficiency: clinical and immunological phenotype and treatment options - a review of 136 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe, life-threatening infections were observed in 79/136 (58 %); severe non-infectious cerebral events occurred in 14/136 (10 %)."
    explanation: Quantifies the severe-event burden in the largest cohort.
  - reference: PMID:25724123
    reference_title: "The extended clinical phenotype of 64 patients with dedicator of cytokinesis 8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality was high (34%)."
    explanation: Gives crude mortality in the genetically confirmed phenotype series.
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Natural disease outcome is dismal, but allogeneic hematopoietic stem cell transplantation (HSCT) can cure the disease."
    explanation: Summarizes the untreated prognosis and the availability of curative therapy.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative therapy. Because DOCK8 is expressed almost exclusively in
    haematopoietic cells, replacing the haematopoietic compartment corrects the
    lesion at its source. In an 81-patient international cohort transplanted at
    a median age of 9.7 years, 84% were alive after a median 26 months, with 89%
    survival after matched-related and 81% after matched-unrelated grafts.
    Transplantation restores lymphocyte differentiation and function and lowers
    total and allergen-specific IgE over time. Manifestations do not all respond
    equally: eczema, infections and mollusca resolve faster than food allergies
    or failure to thrive, and food allergy may persist.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Biallelic DOCK8 Loss of Function
    description: >-
      Donor-derived haematopoiesis supplies DOCK8-sufficient lymphocytes,
      dendritic cells and NK cells, correcting the initiating molecular lesion
      in the compartment where DOCK8 is expressed.
    evidence:
    - reference: PMID:31021819
      reference_title: "Hematopoietic stem cell transplant effectively rescues lymphocyte differentiation and function in DOCK8-deficient patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HSCT improved, abnormal lymphocyte function in DOCK8-deficient patients."
      explanation: >-
        Demonstrates that transplantation corrects the lymphocyte functional
        defects that follow from loss of DOCK8.
  evidence:
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT is curative in most DOCK8-deficient patients, confirming this approach as the treatment of choice."
    explanation: Establishes transplantation as the curative treatment of choice.
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 81 patients from 22 centers transplanted at a median age of 9.7 years (range, 0.7-27.2 years) between 1995 and 2015. After median follow-up of 26 months (range, 3-135 months), 68 (84%) patients are alive."
    explanation: Gives the survival outcome in the largest transplant cohort.
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Not all disease manifestations responded equally well to HSCT: eczema, infections, and mollusca resolved quicker than food allergies or failure to thrive."
    explanation: >-
      Records the differential response, which is the main caveat when
      counselling families about cure.
  - reference: PMID:31021819
    reference_title: "Hematopoietic stem cell transplant effectively rescues lymphocyte differentiation and function in DOCK8-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated total and allergen-specific IgE in DOCK8-deficient patients decreased over time following HSCT."
    explanation: Shows the atopic laboratory phenotype also improves after transplantation.
  notes: >-
    Interpreting per-manifestation response is complicated by somatic reversion,
    which can independently soften the allergic phenotype (see the DOCK8 somatic
    reversion genetic record).
- name: Reduced-Toxicity Conditioning
  description: >-
    Conditioning intensity is the modifiable variable with the clearest effect
    on transplant survival in this disease. Reduced-toxicity regimens built on
    treosulfan or reduced-dose busulfan gave 97% survival against 78% for fully
    myeloablative busulfan-based conditioning. Younger age at transplant also
    favours survival, which argues for referral before complications accrue.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: reduced-intensity transplant conditioning
    term:
      id: NCIT:C116471
      label: Reduced-Intensity Transplant Conditioning Procedure
  evidence:
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced-toxicity conditioning based on either treosulfan or reduced-dose busulfan resulted in superior survival compared with fully myeloablative busulfan-based regimens"
    explanation: >-
      Establishes reduced-toxicity conditioning as the regimen associated with
      better survival in DOCK8 deficiency.
  - reference: PMID:30391550
    reference_title: "Hematopoietic Stem Cell Transplantation as Treatment for Patients with DOCK8 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT using a reduced-toxicity regimen may offer the best chance for survival."
    explanation: States the authors' conclusion on regimen choice.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Replaces the specific antibody the patient cannot make, addressing the
    humoral arm of the combined defect. A standard bridging measure before
    transplantation.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:

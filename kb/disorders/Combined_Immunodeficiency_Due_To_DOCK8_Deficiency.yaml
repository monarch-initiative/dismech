- name: Persistent Cutaneotropic and Oncogenic DNA Virus Infection
  conforms_to: "viral_oncogenesis#Persistent Oncogenic Virus Infection"
  biological_scale: ORGANISM
  description: >-
    Viruses that a competent immune system keeps latent and subclinical instead
    replicate continuously and spread: HPV, molluscum contagiosum virus, HSV and
    VZV in skin, and EBV in the B-cell compartment. Persistent infection by
    oncogenic members of this set — high-risk HPV at cutaneous and anogenital
    sites, EBV in B cells — is the reservoir from which the virus-driven
    malignancies of DOCK8 deficiency arise, which is the module trigger this
    node conforms to. The entry does not curate the downstream
    oncoprotein/tumour-suppressor steps of the module; the virally driven
    cancers are recorded as phenotypes.
  biological_processes:
  - preferred_term: persistence of cutaneotropic and oncogenic DNA viruses
    term:
      id: GO:0019042
      label: viral latency
    modifier: INCREASED

genetic:
- name: PRIM1
  gene_term:
    preferred_term: PRIM1
    term:
      id: hgnc:9369
      label: PRIM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  review_notes: >-
    `relationship_type: CAUSATIVE` is recorded with a caveat. The schema
    defines CAUSATIVE as ClinGen Definitive or Strong, and ClinGen rates this
    pair Moderate, the tier copied into `gene_disease_validity` below. PRIM1 is
    the only gene associated with this disease, segregation and patient-cell
    functional data with wild-type rescue support it, and
    `GeneDiseaseRelationshipEnum` has no value between CAUSATIVE and DISPUTED
    that would carry a Moderate tier.
  notes: >-
    Four alleles are reported. c.638+36C>G (p.Lys214Serfs*21) is recurrent and
    homozygous in six probands, four of them from one country; in the
    original three families it lies on a shared haplotype. c.103+1G>T
    (in-frame V35insDGV) and the missense c.901T>C (p.Cys301Arg) were found in
    trans in one proband, and c.103+2T>G (in-frame three-amino-acid insertion)
    is homozygous in the mildest reported patient.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_56859937-d536-48e8-915d-2f2b7ff07c74-2025-03-20T160000.000Z
    evidence:
    - reference: CGGV:assertion_56859937-d536-48e8-915d-2f2b7ff07c74-2025-03-20T160000.000Z
      reference_title: "PRIM1 / primordial dwarfism-immunodeficiency-lipodystrophy syndrome (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PRIM1 | HGNC:9369 | primordial dwarfism-immunodeficiency-lipodystrophy syndrome | MONDO:0859276 | AR | Moderate"
      explanation: The ClinGen SCID-CID GCEP classifies the PRIM1 relationship as Moderate.
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a variant classification agnostic approach, biallelic mutations in PRIM1 were identified in five individuals."
    explanation: Establishes PRIM1 as the causal gene.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supporting its pathogenicity, the intronic PRIM1 variant was significantly enriched in our microcephalic dwarfism cohort in comparison with the Genome Aggregation Database"
    explanation: Population enrichment of the recurrent intronic allele supports pathogenicity.

diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    The disease was found by exome and genome sequencing of families with
    microcephalic dwarfism. Two of the four known alleles lie outside the
    canonical splice dinucleotide or are deep intronic, and the defining
    report notes that such hypomorphic alleles may not be flagged by variant
    classifiers, so a non-diagnostic first pass should be reanalysed with
    attention to PRIM1 splice variants.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed whole-genome (WGS) and whole-exome (WES) sequence data from 220 families with microcephalic dwarfism spectrum disorders"
    explanation: The patients were identified by genome-scale sequencing.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypomorphic alleles such as this may not be annotated as deleterious by variant classifiers"
    explanation: Supports the caution about intronic splice alleles.

treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    The milder 2024 patient had no further severe infection once
    immunoglobulin replacement started, and the authors recommend it, together
    with monitoring for bronchiectasis and liver cirrhosis. Some patients
    received it and still died of lung and liver disease, so it addresses the
    antibody deficiency and not the whole disease.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: B-Cell Lymphopenia and Humoral Immunodeficiency
    description: Replaces the antibodies the deficient B-cell compartment cannot make.
  evidence:
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the initiation of immunoglobulin replacement therapy (IRT), no further severe infections have occurred."
    explanation: Reports freedom from severe infection on IRT in one patient.
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRIM1-deficient patients benefit from IRT and should regularly be monitored for signs of chronic lung disease including bronchiectasis and liver cirrhosis."
    explanation: The authors' management recommendation.
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lethal early-onset lung and liver disease remained insufficiently explained by the observed hypo-/ agammaglobulinemia, which was treated by IRT in some patients"
    explanation: >-
      Records that some patients died of lung and liver disease despite IRT,
      which limits what the treatment can be expected to do.


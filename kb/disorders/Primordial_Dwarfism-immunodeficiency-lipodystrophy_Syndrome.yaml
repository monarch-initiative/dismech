name: Primordial Dwarfism-immunodeficiency-lipodystrophy Syndrome
creation_date: "2026-11-22T07:30:00Z"
category: Mendelian
disease_term:
  preferred_term: primordial dwarfism-immunodeficiency-lipodystrophy syndrome
  term:
    id: MONDO:0859276
    label: primordial dwarfism-immunodeficiency-lipodystrophy syndrome
description: >
  Primordial dwarfism-immunodeficiency-lipodystrophy syndrome (PDIL; OMIM
  620005) is an ultra-rare autosomal recessive microcephalic primordial
  dwarfism caused by biallelic hypomorphic variants in PRIM1, which encodes the
  49 kDa catalytic subunit of DNA primase. Primase synthesises the short RNA
  primers that start DNA synthesis at replication origins and on every Okazaki
  fragment, before handing them to DNA polymerase alpha. Patient alleles are
  splice-altering or missense variants that lower PRIM1 protein to a fraction
  of normal; complete loss is not compatible with life. Patient cells show
  replication fork asymmetry, increased inter-origin distances, replication
  stress, a lengthened S phase and slow proliferation, which the defining
  report offers as the explanation for extreme pre- and postnatal growth
  failure with microcephaly.

  The clinical picture adds three features to the growth failure: absence of
  subcutaneous fat, a distinctive face (prominent forehead, triangular face,
  blepharophimosis, small low-set ears), and haematological and immune
  dysfunction with hypo- or agammaglobulinaemia, B-cell lymphopenia and
  intermittent anaemia and thrombocytopenia. Most reported children died in
  infancy or early childhood of respiratory or gastrointestinal infection, and
  several had hepatic fibrosis or cirrhosis at post-mortem. A milder,
  normocephalic case with a different splice allele shows that the severity of
  the immune defect does not track the severity of the syndromic features.

synonyms:
  - PDIL
  - PDIL syndrome
  - PRIM1 deficiency

notes: >
  Ultra-rare. ClinGen's 2025 curation counts eight probands from six families
  across the two publications that report patients (Parry et al. 2020, five
  individuals; Toskov et al. 2024, three individuals). Every phenotype below is
  therefore described with a count out of the reported patients, and no
  `frequency` value is set: a percentage computed from five or eight children
  would claim a precision the data do not have.

  The entry keeps the MONDO and OMIM label. No `PRIM1-related` name is
  established (MONDO records no synonym of that form, and there is no
  GeneReviews chapter), and the MONDO label is already specific to the PRIM1
  syndrome, so it passes the scope test.

  No `conforms_to` was declared. The nearest module,
  `dna_damage_checkpoint_arrest`, models pathology produced by an active
  checkpoint-enforced arrest of progenitors. The defining report found no
  increase in p21-positive or cleaved caspase-3-positive patient cells and
  states that S-phase checkpoint activation remains to be determined; it
  attributes the hypoproliferation to slowed cell-cycle progression instead.
  Conforming would assert the checkpoint step that the source declines to
  assert. As with the GINS1 entry, this entry would be a natural conformer of
  a replication-insufficiency module facing development, if one is created.

  Lipodystrophy is recorded as a phenotype but is not wired to a mechanism
  node. The defining report notes only that it parallels the lipodystrophy of
  POLD1 catalytic-site deletion; it does not show that the fat deficit follows
  from impaired proliferation of adipocyte precursors, and the deep-research
  report that proposes that link offers it as an inference.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE

  notes: >-
    Eight probands from six families in two publications, per the ClinGen
    curation of 2025. No incidence or prevalence estimate exists.
  evidence:
  - reference: CGGV:assertion_56859937-d536-48e8-915d-2f2b7ff07c74-2025-03-20T160000.000Z
    reference_title: "PRIM1 / primordial dwarfism-immunodeficiency-lipodystrophy syndrome (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A total of 4 variants (3 splicing and 1 missense) have been reported in eight probands from six families in two publications that were included in this curation"
    explanation: >-
      ClinGen's count of the published cohort and of the distinct variants.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Affected individuals are homozygous or compound heterozygous for PRIM1
    variants, and heterozygous carrier parents are unaffected.
  evidence:
  - reference: CGGV:assertion_56859937-d536-48e8-915d-2f2b7ff07c74-2025-03-20T160000.000Z
    reference_title: "PRIM1 / primordial dwarfism-immunodeficiency-lipodystrophy syndrome (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In all reported cases, parents who carry a heterozygous PRIM1 variant are clinically unaffected."
    explanation: >-
      Unaffected heterozygous parents across all reported families are the
      recessive pattern.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a variant classification agnostic approach, biallelic mutations in PRIM1 were identified in five individuals."
    explanation: >-
      The defining series identified biallelic variants in every affected
      individual.

mechanistic_hypotheses:
- hypothesis_group_id: replication_insufficiency_hypocellularity
  hypothesis_label: Insufficient primase activity slows replication and proliferation, producing hypocellular growth failure
  status: CANONICAL
  description: >
    Reduced PRIM1 lowers primer synthesis, so cells fire fewer origins and
    stall forks on the lagging strand; S phase lengthens, proliferation slows,
    and tissues built during development end up with too few cells. This is
    the model the defining report proposes for the growth failure and
    microcephaly, with patient-cell evidence for each cellular step.
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The ensuing delay to the cell cycle and reduced cellular proliferation provides a likely mechanism for the resulting “hypocellular” microcephalic dwarfism."
    explanation: >-
      The authors' own statement of the causal model linking the cellular
      defect to the clinical growth phenotype.
- hypothesis_group_id: replication_stress_interferon_inflammation
  hypothesis_label: Replication stress drives type I interferon activation that injures lung and liver
  status: EMERGING
  description: >
    Hypo- or agammaglobulinaemia does not fully explain the lethal early lung
    and liver disease, part of which occurred under immunoglobulin replacement.
    By analogy with POLA1 deficiency, DNA metabolites from stalled forks might
    activate nucleic-acid sensors and a type I interferon response. Patients
    show intermittently raised interferon signatures, but no consistent
    pattern, so the hypothesis is unproven.
  evidence:
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, all 3 patients showed variable, but intermittently excessive Type I interferon signatures."
    explanation: >-
      The patient-level observation the hypothesis rests on.
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there was no clear pattern of the peripheral blood type I interferon signature that allowed a firm conclusion"
    explanation: >-
      The same authors state that the interferon data do not establish the
      mechanism, which is why the status is EMERGING.

pathophysiology:
- name: Biallelic Hypomorphic PRIM1 Variants
  biological_scale: MOLECULAR
  description: >
    Patients are homozygous for one of two splice-donor variants
    (c.638+36C>G, which creates a cryptic donor and a frameshift; c.103+2T>G,
    which inserts three amino acids in frame) or compound heterozygous for
    c.103+1G>T and the missense p.Cys301Arg. Every allele lowers PRIM1 protein
    without removing it entirely: full-length protein was 9-14% of wild type
    in c.638+36C>G cells, the C301R and V35insDGV products reached 25% and 52%
    in a reporter assay, and c.103+2T>G cells retained reduced protein.
  genes:
  - preferred_term: PRIM1
    term:
      id: hgnc:9369
      label: PRIM1
    modifier: DECREASED
  molecular_functions:
  - preferred_term: DNA primase activity (DNA-templated RNA primer synthesis)
    modifier: DECREASED
    term:
      id: GO:0003899
      label: DNA-directed RNA polymerase activity
  genetic_context:
    description: >-
      Homozygous or compound heterozygous splice-altering and missense PRIM1
      alleles that each retain some function. The mouse knockout is embryonic
      lethal, so a fully null genotype is not expected among patients.
      Zygosity is recorded as homozygous, the genotype of seven of the eight
      reported probands.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRIM1 protein levels were markedly reduced in patient cells, accompanied by replication fork asymmetry, increased interorigin distances, replication stress, and prolonged S-phase duration."
    explanation: >-
      Patient cells carry markedly reduced PRIM1 protein.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, these experiments confirmed that both variants have functional impact on the PRIM1 protein, that in combination would still leave residual PRIM1 activity."
    explanation: >-
      The compound heterozygous genotype is partial, not null, loss of
      function.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "like other replisome components, knockout in mice is lethal during embryogenesis"
    explanation: >-
      Embryonic lethality of the mouse knockout is why disease alleles must be
      hypomorphic.
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Indeed, immunoblotting showed a markedly reduced, but residual expression of the PRIM1 protein"
    explanation: >-
      The milder c.103+2T>G allele also leaves reduced but residual protein.
  downstream:
  - target: Deficient DNA Primase Primer Synthesis
    description: Less PRIM1 protein means less primase activity for primer synthesis.

- name: Deficient DNA Primase Primer Synthesis
  biological_scale: MOLECULAR
  description: >
    PRIM1 is the catalytic subunit of the primase heterodimer, which forms a
    heterotetramer with the two DNA polymerase alpha subunits. It synthesises
    the RNA primers needed to start replication at origins and to start each
    Okazaki fragment. Depleting it is expected to reduce the efficiency of
    replication; the C301R substitution also sits next to the catalytic
    residue R304, and the equivalent change was lethal in yeast Pri1p.
  cellular_components:
  - preferred_term: DNA polymerase alpha-primase complex
    term:
      id: GO:0005658
      label: alpha DNA polymerase:primase complex
  biological_processes:
  - preferred_term: DNA replication, synthesis of primer
    modifier: DECREASED
    term:
      id: GO:0006269
      label: DNA replication, synthesis of primer
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "PRIM1 is responsible for the synthesis of short RNA primers required for the initiation of DNA replication and Okazaki fragment synthesis, before handover of these primers to Pol α for DNA synthesis"
    explanation: >-
      Background statement of PRIM1's normal function, which is why loss of
      protein translates into a primer-synthesis defect.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with this, the L309R mutation was lethal in yeast"
    explanation: >-
      The equivalent substitution in yeast Pri1p is lethal, indicating that
      the C301R change damages primase function and not only protein level.
  downstream:
  - target: Impaired Replication Initiation and Fork Progression
    description: Too few primers reduce origin firing and stall lagging-strand forks.

- name: Impaired Replication Initiation and Fork Progression
  biological_scale: CELLULAR
  description: >
    DNA fibre combing of patient fibroblasts and lymphoblastoid cells shows
    normal fork speed but marked fork asymmetry, indicating frequent fork
    stalling and restart, and longer inter-origin distances (median 152 kb
    against 113 kb), indicating fewer origins fired. The pattern resembles
    that of POLE-deficient cells.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: DNA replication initiation
    modifier: DECREASED
    term:
      id: GO:0006270
      label: DNA replication initiation
  - preferred_term: lagging strand elongation
    modifier: DECREASED
    term:
      id: GO:0006273
      label: lagging strand elongation
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased interorigin distances were also observed (median IOD 152 kb vs. 113 kb, P < 0.001)"
    explanation: >-
      Longer inter-origin distances in patient fibroblasts indicate reduced
      origin firing.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, these findings were consistent with impaired replication fork formation and increased replication fork stalling in PRIM1-deficient cells."
    explanation: >-
      The authors' summary of the fibre-combing results.
  downstream:
  - target: Replication Stress
    description: Stalled forks expose single-stranded DNA and generate replication stress.
  - target: Prolonged S Phase and Impaired Cell Proliferation
    description: Fewer active origins and stalled forks lengthen the time needed to copy the genome.

- name: Replication Stress
  biological_scale: CELLULAR
  description: >
    Patient fibroblasts in S phase carry raised gamma-H2AX and more
    chromatin-bound RPA, markers of endogenous replication stress. Whether this
    activates the S-phase checkpoint has not been determined.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "γH2AX levels, a marker of DNA damage, were significantly increased in patient fibroblasts during S phase (Fig. 4H), as were levels of chromatin bound RPA (Supplemental Fig. S7), consistent with the presence of endogenous replication stress."
    explanation: >-
      Direct measurement of replication-stress markers in patient cells.
  downstream:
  - target: Persistent Inflammatory State
    description: >-
      Hypothesised: DNA metabolites from stalled forks may activate
      nucleic-acid sensors and a type I interferon response. Not demonstrated.
    hypothesis_groups:
    - replication_stress_interferon_inflammation
    evidence:
    - reference: PMID:38773012
      reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We highlight a potential contribution of pathological type I interferon activation to disease pathogenesis which warrants further investigations."
      explanation: >-
        The authors propose the link as a possibility to be tested, not a
        finding.

- name: Prolonged S Phase and Impaired Cell Proliferation
  biological_scale: CELLULAR
  description: >
    Patient fibroblasts double in about 49 hours against 23-27 hours for
    controls, and S phase lasts 16.6 hours against 6-7 hours. Wild-type PRIM1,
    but not C301R, rescues the long S phase. There was no increase in
    apoptotic or p21-positive cells, so the authors attribute the slow growth
    to delayed cell-cycle progression rather than cell death or cell-cycle
    exit. T-cell blasts from the milder 2024 patient instead showed more cells
    in S phase, which the authors suggest may reflect the same replication
    impairment in a faster-dividing cell type.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation by transient transfection of wild-type, but not C301R mutant PRIM1 confirmed that the lengthened S-phase was specifically due to PRIM1 deficiency in patient cells"
    explanation: >-
      Rescue by wild-type PRIM1 ties the lengthened S phase to PRIM1
      deficiency.
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We therefore concluded that the hypoproliferative phenotype was most likely the consequence of delayed cell cycle progression rather than increased apoptosis or cell cycle exit."
    explanation: >-
      Places the proliferative defect in cell-cycle delay rather than in cell
      loss.
  downstream:
  - target: Hypocellular Developmental Growth Failure
    description: Slow proliferation during development leaves tissues with too few cells.
    hypothesis_groups:
    - replication_insufficiency_hypocellularity
    evidence:
    - reference: PMID:33060134
      reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Consequently, cell proliferation was markedly impaired, explaining the patients' extreme growth failure."
      explanation: >-
        The defining report links the proliferation defect to the clinical
        growth failure.
  - target: B-Cell Lymphopenia and Humoral Immunodeficiency
    description: >-
      Inferred. A proliferation defect in B-cell precursors is the obvious
      candidate explanation for the B-cell deficiency, but it has not been
      shown, and the selectivity for B cells over other lineages is
      unexplained.

- name: Hypocellular Developmental Growth Failure
  biological_scale: ORGANISM
  description: >
    The developmental consequence of slow proliferation: extreme
    intrauterine and postnatal growth restriction with microcephaly and a
    simplified gyral pattern on brain imaging.
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All had extreme growth failure, with in utero growth retardation (birth weight −3.4 ± 0.6 SD) and severe postnatal growth restriction (height −8.8 ± 2.0 SD)"
    explanation: >-
      Quantifies the growth failure across the five patients.
  downstream:
  - target: Intrauterine Growth Retardation
    description: Growth failure begins in utero.
  - target: Severe Short Stature
    description: Growth failure continues postnatally.
  - target: Microcephaly
    description: The brain is reduced along with body size.
  - target: Simplified Gyral Pattern
    description: Neuroimaging shows microcephaly with simplified gyri.

- name: B-Cell Lymphopenia and Humoral Immunodeficiency
  biological_scale: CELLULAR
  description: >
    All five original patients had hypo- or agammaglobulinaemia, and B-cell
    lymphopenia is the lymphocyte defect common to the reported cases. In the
    milder 2024 patient it was the only lymphocyte abnormality found: T-cell
    counts, repertoire and proliferation and NK-cell number and function were
    normal. The severity of the B-cell deficiency does not follow the
    severity of the syndromic features.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, despite the widespread expression of PRIM1 in immune cells, the isolated B cell lymphopenia was the only feature of a lymphocyte immunodeficiency that we could detect in P1."
    explanation: >-
      Establishes the B-cell lineage as the selectively affected lymphocyte
      compartment.
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, the B-cell deficiency in PRIM1-deficiency is markedly variable and the severity of syndromic manifestations is not predictive of the immunological phenotype."
    explanation: >-
      The immune arm varies independently of the growth arm.
  downstream:
  - target: Decreased Total B Cell Count
    description: The lesion is measured as a low circulating B-cell count.
  - target: Hypo- or Agammaglobulinemia
    description: Too few B cells produce too little immunoglobulin.
  - target: Recurrent Respiratory Infections
    description: Antibody deficiency leaves the airways open to recurrent infection.
  - target: Sepsis
    description: Antibody deficiency predisposes to invasive bacterial infection.
  - target: Pneumonia
    description: >-
      Antibody deficiency leaves children open to pneumonia, the usual
      terminal event. The defining report says the early mortality might be
      accounted for by the antibody deficiency, while noting that other
      processes may have contributed.
    evidence:
    - reference: PMID:33060134
      reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "While this might be accounted for by the significant B-cell lymphopenia and accompanying hypo/agammaglobinemia, other disease processes may have also contributed."
      explanation: >-
        The authors attribute the infection-related mortality to the antibody
        deficiency tentatively, which is why the edge is marked indirect.

- name: Persistent Inflammatory State
  biological_scale: ORGANISM
  description: >
    Chronic lung disease, recurrent diarrhoea and liver dysfunction are not
    fully explained by antibody deficiency, and the authors of both case
    reports suggest a persisting inflammatory process, possibly interferon
    driven. Hepatic fibrosis or cirrhosis at post-mortem in three patients is
    read by the defining report as evidence of preceding chronic liver
    inflammation.
  evidence:
  - reference: PMID:33060134
    reference_title: "PRIM1 deficiency causes a distinctive primordial dwarfism syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic lung disease, recurrent diarrhea, and liver dysfunction could also reflect a persisting inflammatory state."
    explanation: >-
      The defining report proposes the inflammatory state as an explanation
      for the organ disease, without demonstrating it.
  downstream:
  - target: Chronic Lung Disease
    description: Proposed source of the chronic respiratory disease.
    hypothesis_groups:
    - replication_stress_interferon_inflammation
  - target: Hepatic Fibrosis and Cirrhosis
    description: Chronic liver inflammation preceding fibrosis and cirrhosis.
    hypothesis_groups:
    - replication_stress_interferon_inflammation
  - target: Recurrent Diarrhea
    description: Proposed source of the recurrent diarrhoea.
    hypothesis_groups:
    - replication_stress_interferon_inflammation

discussions:
- discussion_id: prim1_b_cell_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#B-Cell Lymphopenia and Humoral Immunodeficiency
  prompt: >-
    Why does deficiency of a primase expressed in every dividing cell remove
    B cells while sparing T- and NK-cell numbers and function, and why does
    the B-cell deficit not track the severity of the growth phenotype?
  rationale: >-
    Until this is answered, the edge from impaired proliferation to B-cell
    lymphopenia is an inference rather than a demonstrated mechanism. The
    mildest patient has the most severe B-cell deficit, which argues against a
    simple dose-dependent proliferation model.
  evidence:
  - reference: PMID:38773012
    reference_title: "Variable Syndromic Immunodeficiency in Patients with Biallelic PRIM1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reason for this difference and the mechanistic basis of the selective B cell defect caused by deficiency of the widely expressed PRIM1 protein remains unclear."
    explanation: The source states directly that the B-cell selectivity is unexplained.


name: Inclusion Conjunctivitis
creation_date: "2026-09-30T10:00:51Z"
updated_date: "2026-11-03T00:00:00Z"
description: >-
  Inclusion conjunctivitis is a sporadic oculogenital Chlamydia trachomatis
  infection in which serovar D-K elementary bodies reach the conjunctiva during
  adult exposure to infected genital secretions or neonatal exposure during
  delivery, enter conjunctival epithelial cells, replicate inside intracellular
  inclusions through the chlamydial elementary-body/reticulate-body cycle, and
  elicit subacute or chronic follicular conjunctivitis.
category: Infectious Disease
disease_term:
  preferred_term: inclusion conjunctivitis
  term:
    id: MONDO:0005808
    label: inclusion conjunctivitis
parents:
- Chlamydia trachomatis infectious disease
- Bacterial conjunctivitis
synonyms:
- Adult inclusion conjunctivitis
- Chlamydial conjunctivitis
- Chlamydial ophthalmia neonatorum
- Neonatal chlamydial conjunctivitis
- Paratrachoma
infectious_agent:
- name: Chlamydia trachomatis
  description: >-
    Oculogenital C. trachomatis serovars D-K cause adult inclusion conjunctivitis
    and neonatal chlamydial conjunctivitis, sharing the genital reservoir that
    also causes sexually transmitted urogenital chlamydia.
  infectious_agent_term:
    preferred_term: Chlamydia trachomatis
    term:
      id: NCBITaxon:813
      label: Chlamydia trachomatis
  evidence:
  - reference: PMID:23692878
    reference_title: >-
      [Purulent keratoconjunctivitis due to Neisseria gonorrhoeae and Chlamydia
      trachomatis coinfection].
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inclusion conjunctivitis caused by the serovars D-K of Chlamydia
      trachomatis also affects the sexually active population.
    explanation: >-
      The case report background identifies C. trachomatis serovars D-K as the
      organismal cause of adult inclusion conjunctivitis.
agent_life_cycle:
  description: >-
    C. trachomatis is modeled with humans as the relevant host and without an
    arthropod vector. Infectious elementary bodies are deposited on conjunctival
    epithelium, enter conjunctival epithelial cells, convert inside a
    membrane-bound chlamydial inclusion into noninfectious reticulate bodies,
    replicate, and then redifferentiate into elementary bodies that are released
    to infect neighboring epithelial cells.
  hosts:
  - preferred_term: human
    role: obligate human reservoir and mucosal host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  life_cycle_stages:
  - name: Elementary-body entry into conjunctival epithelial cells
    description: >-
      The elementary body is the infectious extracellular form that is taken up
      by a eukaryotic epithelial host cell and establishes the intracellular
      chlamydial inclusion.
    evidence:
    - reference: PMID:35703434
      reference_title: Differential Effects of Small Molecule Inhibitors on the Intracellular Chlamydia Infection.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        The infection begins with uptake of an elementary body (EB), the
        infectious form of the bacterium, into a eukaryotic host cell.
      explanation: >-
        Supports the entry stage of the conserved chlamydial developmental cycle
        that C. trachomatis uses after ocular inoculation.
  - name: Reticulate-body replication and elementary-body redifferentiation
    description: >-
      Within the inclusion, the elementary body differentiates into the
      replicative reticulate body; reticulate bodies then proliferate and convert
      back to elementary bodies able to infect new host cells.
    evidence:
    - reference: PMID:36385643
      reference_title: Impact of nutrients on the function of the chlamydial Rsb partner switching mechanism.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        Chlamydia undergo a biphasic developmental cycle alternating between the
        infectious elementary body (EB) and the replicative reticulate body (RB).
      explanation: >-
        Supports the EB-RB alternation recorded as the intracellular replicative
        stage for C. trachomatis ocular infection.
  evidence:
  - reference: PMID:35703434
    reference_title: Differential Effects of Small Molecule Inhibitors on the Intracellular Chlamydia Infection.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      Chlamydia are obligate intracellular bacteria that reside within a
      membrane-bound compartment called the chlamydial inclusion inside a
      eukaryotic host cell.
    explanation: >-
      Establishes that Chlamydia spp. complete their developmental cycle inside
      a host-cell chlamydial inclusion.
  notes: >-
    No vector or nonhuman reservoir is recorded for C. trachomatis inclusion
    conjunctivitis; the guinea-pig C. caviae system is useful experimentally but
    is not a natural reservoir for human ocular C. trachomatis infection.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Sexually linked genital-to-ocular transmission
  description: >-
    In adults, oculogenital C. trachomatis serovars D-K are acquired in the
    genital tract by sexual transmission and can reach the conjunctiva from
    infected genital secretions, producing adult inclusion conjunctivitis as an
    ocular complication of a sexually transmitted genital reservoir.
  evidence:
  - reference: PMID:7427689
    reference_title: Epidemiology of infection by serotypes D to K of chlamydia trachomatis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Chlamydial conjunctivitis (in the newborn baby or the adult) in the
      developed world is a complication of sexually transmitted genital infection
      by C trachomatis and it indicates a large reservoir of such infections.
    explanation: >-
      A review of serotypes D-K explicitly links adult chlamydial conjunctivitis
      to a sexually transmitted genital C. trachomatis reservoir.
- name: Perinatal conjunctival exposure
  description: >-
    Newborn conjunctiva can be inoculated with maternal genital C. trachomatis
    during delivery, causing neonatal inclusion conjunctivitis.
  evidence:
  - reference: PMID:22216551
    reference_title: Chlamydia trachomatis and pregnancy.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      If transmitted to the newborn during delivery, this pathogen can cause
      conjunctivitis or, occasionally, neonatal pneumonia.
    explanation: >-
      States the delivery route through which maternal C. trachomatis can
      produce neonatal conjunctivitis.
progression:
- phase: Persistent untreated conjunctival infection
  subtype: Adult inclusion conjunctivitis
  notes: >-
    Adult chlamydial eye infection can be prolonged when it is not recognized
    and treated effectively.
  evidence:
  - reference: PMID:3838901
    reference_title: Prevalence of chlamydial eye infection in patients attending an eye clinic, a VD clinic, and in healthy persons.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A prolonged course can be expected in chlamydial eye infection if the
      condition is unrecognised and effective treatment delayed.
    explanation: >-
      Supports persistence as the consequence of delayed recognition and
      treatment in adult chlamydial conjunctivitis.
pathophysiology:
- name: Conjunctival elementary-body uptake
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Infectious C. trachomatis elementary bodies are deposited onto the
    conjunctiva and taken up by conjunctival epithelial cells, initiating the
    intracellular ocular infection.
  cell_types:
  - preferred_term: conjunctival epithelial cell
    term:
      id: CL:1000432
      label: conjunctival epithelial cell
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  evidence:
  - reference: PMID:35703434
    reference_title: Differential Effects of Small Molecule Inhibitors on the Intracellular Chlamydia Infection.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      The infection begins with uptake of an elementary body (EB), the infectious
      form of the bacterium, into a eukaryotic host cell.
    explanation: >-
      Supports the initial C. trachomatis elementary-body uptake step; the
      conjunctival epithelial location is inferred from the ocular disease site.
  downstream:
  - target: Chlamydial inclusion replication cycle
    causal_link_type: DIRECT
    description: >-
      Internalized elementary bodies establish chlamydial inclusions and convert
      into replicative reticulate bodies.
    evidence:
    - reference: PMID:35703434
      reference_title: Differential Effects of Small Molecule Inhibitors on the Intracellular Chlamydia Infection.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        The infection begins with uptake of an elementary body (EB), the infectious
        form of the bacterium, into a eukaryotic host cell.
      explanation: >-
        The conserved chlamydial entry step is directly upstream of the
        intracellular inclusion cycle.
- name: Chlamydial inclusion replication cycle
  biological_scale: CELLULAR
  description: >-
    C. trachomatis replicates within a membrane-bound inclusion by alternating
    between infectious elementary bodies and replicative reticulate bodies; this
    expands the infected conjunctival epithelial-cell population.
  cell_types:
  - preferred_term: conjunctival epithelial cell
    term:
      id: CL:1000432
      label: conjunctival epithelial cell
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  evidence:
  - reference: PMID:35703434
    reference_title: Differential Effects of Small Molecule Inhibitors on the Intracellular Chlamydia Infection.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      Chlamydia are obligate intracellular bacteria that reside within a
      membrane-bound compartment called the chlamydial inclusion inside a
      eukaryotic host cell.
    explanation: >-
      Supports the membrane-bound chlamydial inclusion as the intracellular site
      of replication.
  - reference: PMID:36385643
    reference_title: Impact of nutrients on the function of the chlamydial Rsb partner switching mechanism.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      Chlamydia undergo a biphasic developmental cycle alternating between the
      infectious elementary body (EB) and the replicative reticulate body (RB).
    explanation: >-
      Supports the EB-RB cycle through which intracellular C. trachomatis expands.
  downstream:
  - target: Chlamydial ocular inflammatory pathology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Infected epithelial cells and chlamydial antigens recruit acute inflammatory cells.
    - Neutrophil- and T-cell-rich inflammation damages the conjunctival mucosa.
    description: >-
      Intracellular chlamydial growth and antigen release recruit inflammatory
      leukocytes that convert infection into visible follicular conjunctivitis.
    evidence:
    - reference: PMID:21402767
      reference_title: Essential role for neutrophils in pathogenesis and adaptive immunity in Chlamydia caviae ocular infections.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Results showed that neutrophil depletion dramatically decreased ocular
        pathology, both clinically and histologically.
      explanation: >-
        In the guinea-pig C. caviae ocular model, neutrophil depletion attenuated
        ocular pathology, supporting inflammatory cells as mediators between
        chlamydial infection and tissue disease.
- name: Chlamydial ocular inflammatory pathology
  biological_scale: TISSUE
  description: >-
    Ocular chlamydial infection recruits inflammatory effector cells into the
    conjunctiva; guinea-pig C. caviae experiments support neutrophils as causal
    contributors to primary ocular chlamydial pathology, and human cohorts
    document the resulting subacute or chronic follicular/papillary conjunctivitis.
  locations:
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:21402767
    reference_title: Essential role for neutrophils in pathogenesis and adaptive immunity in Chlamydia caviae ocular infections.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The adaptive response was also altered, with increased C. caviae-specific
      IgA titers in tears and serum and decreased numbers of CD4+ and CD8+ T
      cells in infected conjunctivae.
    explanation: >-
      The animal-model result supports adaptive inflammatory-cell recruitment in
      infected conjunctivae downstream of chlamydial ocular infection.
  - reference: PMID:42350099
    reference_title: "Clinical characteristics and ompA serovar correlation in adult inclusion conjunctivitis: a cohort study in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients presented with subacute or chronic conjunctivitis with variable
      conjunctival hyperaemia, follicular reaction, papillary hypertrophy and
      discharge.
    explanation: >-
      In a laboratory-confirmed adult inclusion conjunctivitis cohort, ocular
      inflammation presented as subacute or chronic conjunctivitis with follicular
      and papillary reactions.
phenotypes:
- name: Follicular conjunctivitis
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Follicular conjunctivitis
    term:
      id: HP:6001385
      label: Follicular conjunctivitis
  evidence:
  - reference: PMID:24047438
    reference_title: Evaluation of single-dose azithromycin versus standard azithromycin/doxycycline treatment and clinical assessment of regression course in patients with adult inclusion conjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Follicles were the most common clinical sign with the earliest regression
      after successful treatment.
    explanation: >-
      In an adult inclusion conjunctivitis treatment trial, follicles were the
      most common recorded clinical sign.
- name: Conjunctival inflammation
  category: Ophthalmologic
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Conjunctivitis
    term:
      id: HP:0000509
      label: Conjunctivitis
  evidence:
  - reference: PMID:24047438
    reference_title: Evaluation of single-dose azithromycin versus standard azithromycin/doxycycline treatment and clinical assessment of regression course in patients with adult inclusion conjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-three consecutive adults, with symptoms and signs of chronic
      conjunctivitis and positive Polymerase Chain Reaction (PCR) for chlamydia,
      were randomly assigned in four treatment groups
    explanation: >-
      The trial enrolled PCR-confirmed adult inclusion conjunctivitis patients
      with clinical conjunctivitis.
diagnosis:
- name: Conjunctival nucleic-acid amplification testing
  description: >-
    PCR or another NAAT on conjunctival swabs is used to confirm neonatal or
    adult ocular C. trachomatis infection and is more sensitive than Giemsa
    staining for neonatal chlamydial conjunctivitis.
  diagnosis_term:
    preferred_term: Nucleic Acid Amplification Test
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:22369307
    reference_title: The use of polymerase chain reaction assay versus cell culture in detecting neonatal chlamydial conjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cell cultures were positive for C. trachomatis in 31 (12.9%) neonates, C.
      trachomatis was positive in 40 (16.6%) neonates by PCR and 18 (7.5%) by
      Giemsa staining.
    explanation: >-
      Directly compares neonatal conjunctival testing modalities and shows that
      PCR detected more C. trachomatis infections than culture or Giemsa staining.
  - reference: PMID:22369307
    reference_title: The use of polymerase chain reaction assay versus cell culture in detecting neonatal chlamydial conjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High sensitivity (100%) and specificity (95.7%) of PCR as compared to
      culture makes it a proper diagnostic method for the detection of C.
      trachomatis.
    explanation: >-
      Quantifies PCR performance against culture in suspected neonatal
      chlamydial conjunctivitis.
- name: Persistent follicular conjunctivitis clinical suspicion
  description: >-
    Persistent or therapy-resistant conjunctivitis, especially with conjunctival
    follicles, should prompt conjunctival sampling for C. trachomatis testing
    rather than prolonged empiric topical treatment.
  evidence:
  - reference: PMID:28443807
    reference_title: "[Persistent, therapy-resistant conjunctivitis: consider infection with Chlamydia trachomatis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases illustrate that when a patient presents with persistent,
      therapy-resistant conjunctivitis, particularly if conjunctival follicles
      are present, chlamydial conjunctivitis should be considered and conjunctival
      swabs should be taken, no matter what the age of the patient.
    explanation: >-
      Supports testing for C. trachomatis when chronic follicular conjunctivitis
      does not respond to ordinary topical therapy.
treatments:
- name: Systemic antichlamydial therapy
  description: >-
    Chlamydial conjunctivitis requires systemic antibiotic therapy rather than
    topical-only bacterial-conjunctivitis treatment; oral azithromycin and
    doxycycline are adult inclusion-conjunctivitis regimens.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:37977204
    reference_title: >-
      [Bacterial Conjunctivitis: Current Aspects of Diagnosis and Therapy].
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      gonococcal and chlamydial conjunctivitis warrant systemic antibiotics due
      to their potential for severe complications.
    explanation: >-
      Supports systemic rather than topical-only antibiotic therapy for
      chlamydial conjunctivitis.
  - reference: PMID:24047438
    reference_title: Evaluation of single-dose azithromycin versus standard azithromycin/doxycycline treatment and clinical assessment of regression course in patients with adult inclusion conjunctivitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-dose azithromycin should be considered as equally reliable treatment
      option, comparing to long-term alternative regimens for AIC.
    explanation: >-
      Supports single-dose oral azithromycin as an adult inclusion conjunctivitis
      regimen compared with longer azithromycin or doxycycline regimens.
review_notes: >-
  Deliberately lumped. This entry covers adult and neonatal inclusion
  conjunctivitis caused by oculogenital C. trachomatis serovars D-K. It excludes
  trachoma, the chronic blinding conjunctival infection caused by serovars A-C
  and represented separately at MONDO:0001249, and it does not model
  C. caviae guinea-pig inclusion conjunctivitis as a human infectious agent. The
  OpenScientist report also collected neonatal prevention literature, but no
  prevention entry is modeled because the current Disease schema has
  transmission, diagnosis, and treatment slots without a top-level prevention
  slot.

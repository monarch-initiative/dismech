  - target: Lipoic Acid Synthase Deficiency
    causal_link_type: DIRECT
  - target: Mitochondrial Aconitase Deficiency
    causal_link_type: DIRECT
- name: Respiratory Complex I and II Deficiency
  description: >
    Combined or isolated deficiency of complexes I and II in skeletal muscle, with SDHB

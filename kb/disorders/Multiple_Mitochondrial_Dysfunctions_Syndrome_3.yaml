- name: Glycine Cleavage System Failure
  description: >
    The H protein of the glycine cleavage system carries the lipoyl arm that shuttles the
    aminomethyl intermediate, so unlipoylated H protein stops glycine cleavage and glycine
    accumulates in blood and cerebrospinal fluid.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: glycine decarboxylation via glycine cleavage system
    modifier: DECREASED
    term:
      id: GO:0019464

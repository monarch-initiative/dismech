diagnosis:
- name: Respiratory chain enzymology with lipoylation immunoblot
  description: >
    Combined or isolated complex I and II deficiency in skeletal muscle, together with
    absent protein lipoylation on immunoblot, is the biochemical signature that points to
    the Fe-S assembly pathway; the normal complex III and IV activities and preserved
    ferrochelatase distinguish a late [4Fe-4S] defect from an early ISC one. Fibroblasts
    are a usable diagnostic tissue for this gene.
  evidence:
  - reference: PMID:25971455
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes fatal infantile leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination of these findings was suggestive for a defect in the iron-sulfur (Fe/S) protein assembly pathway."
    explanation: The enzyme-plus-lipoylation pattern directs testing to the Fe-S pathway.
  - reference: PMID:28803783
    reference_title: "Impact of mutations within the [Fe-S] cluster or the lipoic acid biosynthesis pathways on mitochondrial protein expression profiles in fibroblasts from patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirm that the fibroblast is a good cellular model to study these deficiencies"
    explanation: Fibroblasts are an adequate diagnostic tissue for this group, unlike in some other ISC disorders.
- name: Exome or genome sequencing
  description: Exome sequencing, often with homozygosity mapping in consanguineous families, establishes the molecular diagnosis.
  evidence:
  - reference: PMID:25971455
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes fatal infantile leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping, whole exome sequencing, and functional studies were used to define the underlying molecular defect."
    explanation: The diagnostic route used in a reported patient.

name: Multiple Mitochondrial Dysfunctions Syndrome 3
category: Mendelian
creation_date: "2026-11-19T04:30:00Z"
synonyms:
- MMDS3
- IBA57 deficiency
- IBA57 fatal multiple mitochondrial dysfunctions syndrome
- Hypotonia-cerebral atrophy-hyperglycinemia syndrome
description: >
  Multiple mitochondrial dysfunctions syndrome 3 (MMDS3) is an autosomal recessive
  mitochondrial disorder caused by biallelic variants in IBA57, a late-acting factor of
  mitochondrial iron-sulfur cluster assembly. IBA57 binds ISCA2 through a bridging
  [2Fe-2S] cluster and, with ISCA1, carries out the reductive fusion of two [2Fe-2S]
  clusters into the [4Fe-4S] clusters that respiratory complexes I and II, mitochondrial
  aconitase and lipoic acid synthase require. Because the lesion is specific to that
  late step, [2Fe-2S] proteins such as ferrochelatase are spared, while loss of lipoic
  acid synthase strips the lipoyl cofactor from pyruvate dehydrogenase, 2-oxoglutarate
  dehydrogenase, branched-chain ketoacid dehydrogenase and the glycine cleavage H
  protein. A 2024 pooled analysis sorts the 46 reported MMDS3 patients into three subtypes
  by age at onset: neonatal, with hypotonia, respiratory distress and death within three
  months; infantile, the largest group, with motor regression and cavitating
  leukoencephalopathy that then stabilizes; and childhood, in which visual impairment is
  commonest. The separately numbered allelic disorder SPG74, a slowly progressive spastic
  paraplegia with optic atrophy, is curated elsewhere in dismech and is not one of these
  three subtypes.
disease_term:
  preferred_term: multiple mitochondrial dysfunctions syndrome 3
  term:
    id: MONDO:0014132
    label: multiple mitochondrial dysfunctions syndrome 3
parents:
- Fatal Multiple Mitochondrial Dysfunctions Syndrome
- Mitochondrial iron-sulfur cluster assembly disorder
notes: >-
  No GeneReviews chapter covers IBA57 (PubMed search `IBA57[TIAB] AND genereviews[book]
  NOT retired[TI]` returned 0 on 2026-11-19), so the phenotype baseline comes from the
  published case series: the two perinatally lethal index siblings (PMID:23462291), a
  fatal infantile leukodystrophy patient (PMID:25971455), four patients with variable
  phenotypes (PMID:27785568), eleven children with cavitating leukoencephalopathy
  (PMID:28671726) and a pooled analysis of 61 IBA57 patients of whom 46 had MMDS3
  (PMID:39227420).
  SPG74 (MONDO:0014644, OMIM 616451) is an allelic disorder of the same gene and is
  deliberately **not** curated in this entry: it has its own MONDO term, it is already
  covered in `kb/disorders/Complex_Hereditary_Spastic_Paraplegia.yaml`, and its milder
  course is attributed to higher residual IBA57 protein. Papers describing SPG74
  families are cited here only for mechanism, never for MMDS3 phenotypes.
  Phenotype frequencies are given only where a source states a count or proportion;
  elsewhere they are omitted.
  The three `has_subtypes` rows carry no `subtype_term`, which the structural test reports
  as a warning. That is deliberate: they are the onset bands a 2024 pooled analysis
  proposed (neonatal, infantile, childhood), not ontology concepts, and MONDO has no term
  for any of them. They are recorded as subtypes rather than only as `progression` phases
  because the pooled analysis reports phenotype frequencies per band, which the
  `subtype:` foreign key can then stratify.
  ClinGen rates IBA57 Definitive, but against the generic parent term
  `MONDO:0044970 mitochondrial disease`, not against MMDS3, so by the
  gene-disease-validity rule that assertion is for a different pair and is not recorded
  in `gene_disease_validity` here.
has_subtypes:
- name: Neonatal
  display_name: Neonatal subtype (onset under 1 month)
  description: >-
    Onset in the first month, with hypotonia and respiratory distress in every patient and
    death within three months. Seven of the 46 pooled patients. The recurrent p.Gln314Pro
    allele occurred only in this subtype.
  evidence:
  - reference: PMID:39227420
    reference_title: "Phenotypic spectrum of iron-sulfur cluster assembly gene IBA57 mutations: c.286 T > C identified as a hotspot mutation in Chinese patients with a stable natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neonatal subtype (< 1 month, N = 7)"
    explanation: Defines the subtype and its size in the pooled cohort.
- name: Infantile
  display_name: Infantile subtype (onset 1 month to 1 year)
  description: >-
    Onset between one month and one year, the largest group at 24 of 46 patients, presenting
    with motor regression and cavitating leukoencephalopathy that stabilizes after the acute
    phase.
  evidence:
  - reference: PMID:39227420
    reference_title: "Phenotypic spectrum of iron-sulfur cluster assembly gene IBA57 mutations: c.286 T > C identified as a hotspot mutation in Chinese patients with a stable natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "infant subtype (1 month-1 year, N = 24)"
    explanation: Defines the subtype and its size in the pooled cohort.
- name: Childhood
  display_name: Childhood subtype (onset over 1 year)
  description: >-
    Onset after the first year, 15 of 46 patients, in whom visual impairment is the most
    prevalent feature. This is a subtype of MMDS3 and is distinct from the separately
    numbered allelic disorder SPG74.
  evidence:
  - reference: PMID:39227420
    reference_title: "Phenotypic spectrum of iron-sulfur cluster assembly gene IBA57 mutations: c.286 T > C identified as a hotspot mutation in Chinese patients with a stable natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "childhood subtype (> 1 year, N = 15)"
    explanation: Defines the subtype and its size in the pooled cohort.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic IBA57 variants: homozygous in consanguineous families, compound
    heterozygous in others, with unaffected heterozygous parents.
  evidence:
  - reference: PMID:23462291
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes severe myopathy and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two siblings from consanguineous parents died perinatally with a condition characterized by generalized hypotonia"
    explanation: Affected siblings of consanguineous parents in the index family.
  - reference: PMID:28913435
    reference_title: "IBA57 mutations abrogate iron-sulfur cluster assembly leading to cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and identified compound heterozygosity for the IBA57 gene, which encodes the mitochondrial iron-sulfur protein assembly factor"
    explanation: Compound heterozygous genotypes in a second cohort.
prevalence:
- population: Global reported patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2024 pooled analysis assembled 61 patients with IBA57 variants, of whom 46 had the
    MMDS3 phenotype and 15 the allelic SPG74 phenotype. Chinese patients made up the
    majority of the pooled cohort.
  evidence:
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen cases with IBA57 mutations have been reported to date."
    explanation: Case count as of 2017, before the larger series.
- population: Chinese patients in the pooled IBA57 cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The recurrent c.286T>C (p.Tyr96His) allele accounts for most Chinese patients and is
    associated with a milder course and lower mortality.
  evidence:
  - reference: PMID:39227420
    reference_title: "Phenotypic spectrum of iron-sulfur cluster assembly gene IBA57 mutations: c.286 T > C identified as a hotspot mutation in Chinese patients with a stable natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.286 T > C mutation was reported in 85.2% of Chinese patients"
    explanation: A recurrent allele dominates the Chinese patient population.
progression:
- phase: Perinatal lethal presentation
  age_range: Prenatal to neonatal
  notes: >-
    Generalized hypotonia, respiratory insufficiency, arthrogryposis, microcephaly and
    congenital brain malformation, with death in the perinatal period. This is the form
    associated with essentially no functional IBA57 protein.
  evidence:
  - reference: PMID:23462291
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes severe myopathy and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two siblings from consanguineous parents died perinatally with a condition characterized by generalized hypotonia, respiratory insufficiency, arthrogryposis, microcephaly, congenital brain malformations and hyperglycinemia."
    explanation: The index siblings' perinatally lethal course.
- phase: Infantile motor regression
  age_range: Infancy, median onset 9 months
  notes: >-
    Acute or subacute loss of motor skills with cavitating white-matter lesions.
    Neurological deterioration reaches its worst within about four months of onset.
  evidence:
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of onset was 9 months, with an initial presentation of motor regression."
    explanation: Median onset and presenting feature of the infantile form.
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deterioration of neurological function reached its peak within 4 months."
    explanation: Time course of the acute phase.
- phase: Post-regression stabilization with residual handicap
  age_range: Childhood onward
  notes: >-
    After the acute phase the course stabilizes, with cavitation and restricted
    diffusion giving way to atrophy on imaging, and severe motor handicap in about half
    of survivors.
  evidence:
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases survived and remained stable."
    explanation: The infantile cohort stabilized rather than progressing.
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe motor handicap was observed in 50.0% of the patients"
    explanation: Residual disability after stabilization.
pathophysiology:
- name: Biallelic IBA57 Variants
  description: >
    Biallelic germline IBA57 variants: missense, frameshift, nonsense, splice and small
    in-frame duplications. Reported alleles include p.Gln314Pro in the perinatally lethal
    index family, p.Arg146Trp in fatal infantile leukodystrophy, and the recurrent
    p.Tyr96His of the Chinese cohort.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: IBA57
    term:
      id: hgnc:27302
      label: IBA57
  evidence:
  - reference: PMID:23462291
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes severe myopathy and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of IBA57 revealed the homozygous mutation c.941A > C, p.Gln314Pro."
    explanation: The founding homozygous variant.
  downstream:
  - target: Excessive Proteolytic Degradation of IBA57
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23462291
      reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes severe myopathy and encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As a result of the mutation, IBA57 protein was excessively degraded, an effect ameliorated by protease inhibitors."
      explanation: The variant protein is degraded, and protease inhibition rescues it.
- name: Excessive Proteolytic Degradation of IBA57
  description: >
    The variant protein is turned over faster than it is made, so IBA57 is severely
    reduced in patient skeletal muscle, fibroblasts and myoblasts. For the index allele
    the authors concluded that degradation below a critical level, rather than the
    residual catalytic impairment, is the main pathogenic event.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: IBA57
    term:
      id: hgnc:27302
      label: IBA57
  evidence:
  - reference: PMID:23462291
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes severe myopathy and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severely decreased amounts of IBA57 protein were observed in skeletal muscle and cultured skin fibroblasts from the affected subjects."
    explanation: IBA57 protein is severely reduced in patient tissue.
  - reference: PMID:23462291
    reference_title: "Mutation of the iron-sulfur cluster assembly gene IBA57 causes severe myopathy and encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we propose that the mutation leads to partial functional impairment of IBA57, yet the major pathogenic impact is due to its proteolytic degradation below physiologically critical levels"
    explanation: Degradation rather than catalytic impairment is the dominant mechanism for this allele.
  downstream:
  - target: Loss of the [2Fe-2S]-Bridged ISCA2-IBA57 Complex
    causal_link_type: DIRECT
- name: Loss of the [2Fe-2S]-Bridged ISCA2-IBA57 Complex
  description: >
    IBA57 and ISCA2 form a heterodimer held together by a bridging [2Fe-2S] cluster.
    Cluster binding is required for the complex to form, through a conserved IBA57
    cysteine and three conserved ISCA cysteines, and the assembled complex can reactivate
    apo-aconitase in vitro. With IBA57 depleted the complex cannot form.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ISCA2
    term:
      id: hgnc:19857
      label: ISCA2
  - preferred_term: IBA57
    term:
      id: hgnc:27302
      label: IBA57
  cellular_components:
  - preferred_term: iron-sulfur cluster assembly complex
    term:
      id: GO:1990229
      label: iron-sulfur cluster assembly complex
  evidence:
  - reference: PMID:30269484
    reference_title: "IBA57 Recruits ISCA2 to Form a [2Fe-2S] Cluster-Mediated Complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the cysteine of the conserved motif characterizing IBA57 protein family and the three conserved cysteines of the ISCA protein family act as cluster ligands"
    explanation: Defines the complex IBA57 must form and its cluster requirement.
  downstream:
  - target: Failure of Reductive [2Fe-2S] Fusion into [4Fe-4S] Clusters
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32817474
      reference_title: "Mitochondrial [4Fe-4S] protein assembly involves reductive [2Fe-2S] cluster fusion on ISCA1-ISCA2 by electron flow from ferredoxin FDX2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "cluster fusion on ISCA1-ISCA2 in an IBA57-dependent fashion"
      explanation: The fusion reaction depends on IBA57, so loss of the complex blocks it.
- name: Failure of Reductive [2Fe-2S] Fusion into [4Fe-4S] Clusters
  description: >
    The third phase of mitochondrial cluster assembly converts two [2Fe-2S] clusters,
    delivered from GLRX5, into a [4Fe-4S] cluster on ISCA1-ISCA2, using electrons from
    ferredoxin FDX2 and its reductase FDXR, with IBA57 required. This is the
    rate-limiting step the disease removes, and it is specific: [2Fe-2S] cluster transfer
    to [2Fe-2S] apoproteins happens spontaneously and does not need these factors.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:
  - preferred_term: "[4Fe-4S] cluster assembly"
    modifier: DECREASED
    term:
      id: GO:0044572
      label: "[4Fe-4S] cluster assembly"
  evidence:
  - reference: PMID:22323289
    reference_title: "The human mitochondrial ISCA1, ISCA2, and IBA57 proteins are required for [4Fe-4S] protein maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ISCA1, ISCA2, and IBA57 are specifically involved in the maturation of mitochondrial"
    explanation: Places IBA57 at the late [4Fe-4S] maturation step.
  - reference: PMID:28803783
    reference_title: "Impact of mutations within the [Fe-S] cluster or the lipoic acid biosynthesis pathways on mitochondrial protein expression profiles in fibroblasts from patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirm that NFU1, BOLA3, ISCA2 and IBA57 operate in the maturation of"
    explanation: Patient fibroblast profiling confirms the step is [4Fe-4S]-specific.
  downstream:
  - target: Reduced NFU1 Protein Level
    causal_link_type: DIRECT
  - target: Deficiency of Mitochondrial [4Fe-4S] Client Enzymes
    causal_link_type: DIRECT
- name: Reduced NFU1 Protein Level
  description: >
    NFU1, the carrier that hands [4Fe-4S] clusters to succinate dehydrogenase and lipoic
    acid synthase, is itself reduced when IBA57 is deficient. This places part of the
    client loss downstream of a second, dependent carrier rather than directly on IBA57,
    and is why MMDS3 and MMDS1 (NFU1) share a biochemical signature.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NFU1
    term:
      id: hgnc:16287
      label: NFU1
  evidence:
  - reference: PMID:28913435
    reference_title: "IBA57 mutations abrogate iron-sulfur cluster assembly leading to cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, NFU1 protein expression was also decreased, which is required for the assembly of a subset of iron-sulfur proteins to SDH and LIAS in the mitochondrial ISC assembly system."
    explanation: NFU1 falls in IBA57-deficient patient cells.
  - reference: PMID:28913435
    reference_title: "IBA57 mutations abrogate iron-sulfur cluster assembly leading to cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in IBA57 essentially regulate NFU1 expression, and aberrant NFU1 ultimately affects SDH activity and LIAS expression in the ISC biogenesis pathway."
    explanation: The authors route the SDH and LIAS loss through NFU1.
  downstream:
  - target: Deficiency of Mitochondrial [4Fe-4S] Client Enzymes
    causal_link_type: DIRECT
- name: Deficiency of Mitochondrial [4Fe-4S] Client Enzymes
  description: >
    The [4Fe-4S] clients lose activity together: respiratory complex I, succinate
    dehydrogenase subunit B of complex II, mitochondrial aconitase, and lipoic acid
    synthase. [2Fe-2S] clients are spared, so ferrochelatase activity and cellular heme
    content stay normal, which separates MMDS3 from the early-step ISC disorders.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:22323289
    reference_title: "The human mitochondrial ISCA1, ISCA2, and IBA57 proteins are required for [4Fe-4S] protein maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "including aconitase, respiratory complex I, and lipoic acid synthase, were diminished following depletion of the three proteins"
    explanation: Names the client enzymes lost on IBA57 depletion.
  - reference: PMID:22323289
    reference_title: "The human mitochondrial ISCA1, ISCA2, and IBA57 proteins are required for [4Fe-4S] protein maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enzyme ferrochelatase and cellular heme content were unaffected"
    explanation: Establishes the sparing of [2Fe-2S] clients.
  downstream:
  - target: Respiratory Complex I and II Deficiency

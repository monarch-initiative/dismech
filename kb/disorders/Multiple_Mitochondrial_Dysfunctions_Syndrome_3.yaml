- name: Mitochondrial Structural Damage
  description: >
    Depletion of IBA57 leaves mitochondria massively swollen and enlarged with almost no
    cristae, so the organelle's architecture fails as well as its chemistry.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:22323289
    reference_title: "The human mitochondrial ISCA1, ISCA2, and IBA57 proteins are required for [4Fe-4S] protein maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depleted cells contained massively swollen and enlarged mitochondria that were virtually devoid of cristae membranes, demonstrating the importance of these proteins for mitochondrial biogenesis."
    explanation: Loss of IBA57 destroys mitochondrial ultrastructure.
  downstream:
  - target: White Matter Energy Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mitochondria without cristae cannot support oxidative metabolism, which compounds
      the enzyme deficiency in the tissue least able to tolerate it. The step is an
      inference from the cell-culture morphology to the tissue lesion.
- name: White Matter Energy Failure
  description: >
    Myelinating oligodendrocytes and the white matter they maintain are the tissue least
    able to tolerate the combined respiratory chain and citric-acid-cycle block. The
    result is cavitating leukodystrophy of periventricular and central white matter, with
    restricted diffusion at the peak and atrophy in recovery. The selective vulnerability
    of white matter is inferred from the imaging pattern rather than measured in tissue.

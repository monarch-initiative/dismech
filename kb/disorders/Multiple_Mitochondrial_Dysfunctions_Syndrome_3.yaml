genetic:
- name: IBA57
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: IBA57
    term:
      id: hgnc:27302
      label: IBA57
  variant_origin: GERMLINE
  notes: >
    Reported alleles include c.941A>C p.(Gln314Pro) in the perinatally lethal index
    family, c.436C>T p.(Arg146Trp) in fatal infantile leukodystrophy, and the recurrent
    c.286T>C p.(Tyr96His), which accounts for most Chinese patients and carries a milder
    course. Mutation classes include missense, frameshift, nonsense, splice and small
    in-frame duplications; all are loss of function or hypomorphic, and heterozygous
    carriers are unaffected. ClinGen rates IBA57 Definitive for the parent concept
    mitochondrial disease (MONDO:0044970) rather than for MMDS3, so that assertion is
    not recorded here.
  evidence:

- name: Lipoic Acid Synthase Deficiency
  description: >
    Lipoic acid synthase is a radical SAM enzyme carrying a [4Fe-4S] cluster that is
    consumed to make the lipoyl cofactor. Its loss leaves the E2 subunits of the
    2-oxoacid dehydrogenases and the glycine cleavage H protein without lipoate.
  biological_scale: MOLECULAR

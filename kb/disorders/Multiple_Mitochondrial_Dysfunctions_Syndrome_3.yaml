  description: LYRM4 (ISD11) deficiency, an early-step ISC defect in the same pathway.
  disease_term:
    preferred_term: combined oxidative phosphorylation deficiency 19
    term:
      id: MONDO:0014269
      label: combined oxidative phosphorylation deficiency 19
  distinguishing_features:
  - Complex III, both aconitases and ferrochelatase are also deficient, because the block is at the first step rather than the late fusion step
discussions:
- discussion_id: mmds3_nfu1_dependency_direction
  prompt: >-
    How much of the enzyme deficiency in IBA57 disease is caused directly by failed
    cluster fusion, and how much runs through the secondary loss of NFU1?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced NFU1 Protein Level
  - pathophysiology#Failure of Reductive [2Fe-2S] Fusion into [4Fe-4S] Clusters
  rationale: >-
    One patient study found NFU1 protein reduced in IBA57-deficient cells and concluded
    that IBA57 defects regulate NFU1 expression, with the loss of succinate dehydrogenase
    activity and lipoic acid synthase following from the aberrant NFU1 rather than
    directly from IBA57. Reconstitution work places IBA57 upstream in the fusion
    reaction itself, where NFU1 is a separate carrier. The two readings are not
    exclusive, and the entry keeps both edges, but the share each path carries is
    unmeasured. It matters for interpretation: if most of the client loss is routed
    through NFU1, then MMDS1 and MMDS3 are nearer to one disease than their separate
    numbers suggest, and a therapy that stabilized NFU1 would be expected to help both.
  evidence:
  - reference: PMID:28913435
    reference_title: "IBA57 mutations abrogate iron-sulfur cluster assembly leading to cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in IBA57 essentially regulate NFU1 expression, and aberrant NFU1 ultimately affects SDH activity and LIAS expression in the ISC biogenesis pathway."
    explanation: Attributes the client loss to the secondary NFU1 deficiency.
  - reference: PMID:28803783
    reference_title: "Impact of mutations within the [Fe-S] cluster or the lipoic acid biosynthesis pathways on mitochondrial protein expression profiles in fibroblasts from patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our work suggests a functional difference between IBA57 and other proteins involved in maturation of"
    explanation: Patient fibroblast profiling finds IBA57 behaving differently from the other factors in the group, which argues against a single shared route.
  proposed_experiments:
  - experiment_id: mmds3_nfu1_epistasis
    name: NFU1 over-expression epistasis in IBA57-deficient cells
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      In IBA57-knockout cells, over-express NFU1 to restore its level without restoring
      IBA57, then measure SDHB, lipoic acid synthase, protein lipoylation, aconitase
      activity and complex I and II activity. Compare with the same measurements after
      IBA57 rescue.
    would_support:
    - pathophysiology#Reduced NFU1 Protein Level
    supporting_outcome:
    - NFU1 restoration alone recovers succinate dehydrogenase and lipoylation, which would place most of the client loss downstream of NFU1
    refuting_outcome:
    - NFU1 restoration changes nothing while IBA57 rescue recovers everything, which would make the NFU1 fall a passive consequence rather than a mechanistic step
- discussion_id: mmds3_white_matter_selectivity
  prompt: >-
    Why does a cell-autonomous defect in every mitochondrion produce cavitating injury
    confined to periventricular and central white matter, and why does it then stop?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#White Matter Energy Failure
  - phenotypes#Cavitating leukodystrophy
  rationale: >-
    The biochemical lesion is present in every tissue, yet the imaging injury is
    restricted to white matter and the clinical course stabilizes after about four
    months rather than progressing. Neither the regional selectivity nor the plateau is
    explained. Candidates include a developmental window in which myelinating
    oligodendrocytes have their highest demand for lipoate-dependent and respiratory
    enzymes, a vulnerability that passes once myelination is complete, and a threshold
    effect in which the surviving oligodendrocyte population is sufficient for
    maintenance but not for active myelination. No tissue study addresses this, and the
    edge from the enzyme deficiency to white-matter failure is therefore recorded with
    unknown intermediates.
  evidence:
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deterioration of neurological function reached its peak within 4 months."
    explanation: The injury is time-limited rather than relentlessly progressive, which a constant enzyme deficiency does not explain on its own.
  - reference: PMID:28671726
    reference_title: "Phenotypic spectrum of mutations in IBA57, a candidate gene for cavitating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases survived and remained stable."
    explanation: Stabilization after the acute phase is the observation needing a mechanism.
  proposed_experiments:
  - experiment_id: mmds3_oligodendrocyte_window
    name: Developmental-stage comparison in IBA57-deficient oligodendrocyte cultures
    experiment_design: DESCRIPTIVE_PROFILING
    executability: SPECIFIED
    description: >-
      Differentiate IBA57-knockout and isogenic control human iPSC-derived
      oligodendrocyte progenitors through myelination in vitro, and measure survival,
      lipoylation, complex I and II activity and myelin protein output at the progenitor,
      actively myelinating and mature stages, alongside neurons and astrocytes from the
      same line.
    would_support:
    - pathophysiology#White Matter Energy Failure
    supporting_outcome:
    - Loss of viability or lipoylation is confined to the actively myelinating stage and to the oligodendrocyte lineage, which would supply both the regional selectivity and the plateau
    refuting_outcome:
    - Equal impairment at all stages and across cell types, which would move the explanation to a non-cell-autonomous or vascular cause
- discussion_id: mmds3_genotype_severity_gradient
  prompt: >-
    Does residual IBA57 protein level account for the whole span from perinatal death to
    an almost asymptomatic adult, and is the recurrent Chinese allele mild for that
    reason?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Excessive Proteolytic Degradation of IBA57
  - pathophysiology#Biallelic IBA57 Variants
  rationale: >-
    A residual-protein model fits what is published: the index allele leaves essentially
    no functional protein and killed both siblings perinatally, while an SPG74 family
    with a roughly ten-fold reduction but intact protein had a childhood-onset course
    extending into late adulthood. The recurrent c.286T>C allele carries lower mortality
    in the pooled cohort, consistent with a mild hypomorph. Two things are missing. No
    study has quantified residual IBA57 across alleles on one platform, so the gradient
    is assembled from separate papers with different assays. And the model cannot
    explain within-family discordance, where two brothers with identical compound
    heterozygous genotypes diverged after one had a febrile illness, which points to a
    second, non-genetic determinant.
  evidence:
  - reference: PMID:25609768
    reference_title: "Fe/S protein assembly gene IBA57 mutation causes hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lymphoblasts contained 10-fold-lower levels of wild-type, but no signs of truncated IBA57 protein."
    explanation: Quantifies the residual protein in the mild allelic family.
  - reference: PMID:30258207
    reference_title: "Expanding the phenotype of IBA57 mutations: related leukodystrophy can remain asymptomatic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he then developed a rapidly progressive spastic paraparesis following a febrile illness"
    explanation: Two brothers with the same genotype diverged after a febrile illness, which residual protein level alone cannot explain.
  - reference: PMID:39227420
    reference_title: "Phenotypic spectrum of iron-sulfur cluster assembly gene IBA57 mutations: c.286 T > C identified as a hotspot mutation in Chinese patients with a stable natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.286 T > C mutation was reported in 85.2% of Chinese patients"
    explanation: Identifies the recurrent allele whose mildness the hypothesis would explain.
  proposed_experiments:
  - experiment_id: mmds3_allele_residual_protein_panel
    name: Single-platform residual IBA57 panel across reported alleles
    experiment_design: TARGETED_PERTURBATION
    executability: SPECIFIED
    description: >-
      Express each reported IBA57 allele in an IBA57-knockout human cell line, and on one
      platform measure steady-state IBA57 level, its half-life with and without protease
      inhibition, ISCA2 co-retention, protein lipoylation and complex I and II activity.
      Rank compound genotypes by summed residual protein and compare with the clinical
      severity recorded in the pooled cohort.
    would_support:
    - pathophysiology#Excessive Proteolytic Degradation of IBA57
    supporting_outcome:
    - Residual protein ranks the genotypes in the same order as clinical severity, with the recurrent c.286T>C allele near the top
    refuting_outcome:
    - No monotonic relation between residual protein and severity, which would require a determinant beyond protein level, consistent with the within-family discordance

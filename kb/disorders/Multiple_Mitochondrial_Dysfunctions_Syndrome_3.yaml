  - reference: PMID:27785568
    reference_title: "Novel mutations in IBA57 are associated with leukodystrophy and variable clinical phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "characterized by lactic acidosis, hyperglycinemia, multiple defects of the respiratory chain complexes, and impairment of four lipoic acid-dependent enzymes"
    explanation: Places the H protein of the glycine cleavage system among the lipoate-dependent enzymes impaired in this disease group.
  downstream:
  - target: Hyperglycinemia
- name: 2-Oxoacid Dehydrogenase Deficiency
  description: >
    Pyruvate dehydrogenase, 2-oxoglutarate dehydrogenase and branched-chain ketoacid
    dehydrogenase lose activity without their lipoyl cofactor, blocking entry into and
    flux through the citric acid cycle and diverting pyruvate to lactate.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:27785568

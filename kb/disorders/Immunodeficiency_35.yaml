inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic TYK2 variants. Most reported patients are homozygous and born to
    consanguineous parents; heterozygous relatives are healthy. Penetrance is
    incomplete and is partly exposure-dependent, since a substantial share of
    the mycobacterial disease in this disorder follows BCG vaccination.
  evidence:
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven other TYK2-deficient patients from five families and four different ethnic groups. These patients were homozygous for one of five null mutations, different from that seen in P1. They displayed mycobacterial and/or viral infections, but no HIES.
    explanation: >-
      Establishes the recessive homozygous-null genotype across five unrelated
      families and the phenotype that follows from it.
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete clinical penetrance has been observed for mycobacterial and viral diseases, as 48% and 60% of patients, respectively, develop these diseases.
    explanation: >-
      Quantifies the incomplete penetrance of the two defining infectious
      phenotypes.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists for complete TYK2 deficiency. Twenty-five
    patients had been reported by 2022. A separate statement puts inherited
    IL-12Rbeta1 and TYK2 deficiencies each at under 1 in 600,000, but that
    figure is offered as an order-of-magnitude comparison against a common
    tuberculosis-susceptibility allele rather than as a measured prevalence, so
    no numeric rate is recorded here.
  evidence:
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 25 known patients with complete TYK2 deficiency (including 15 previously reported and 10 reported herein) have suffered from intramacrophagic infections (mostly due to mycobacteria) or viral infections (mostly due to herpesviruses) or both.
    explanation: >-
      The published case count, standing in for a population prevalence estimate
      that has never been made.
  - reference: PMID:30578352
    reference_title: Tuberculosis and impaired IL-23-dependent IFN-γ immunity in humans homozygous for a common TYK2 missense variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inherited IL-12Rβ1 and TYK2 deficiencies impair both IL-12- and IL-23-dependent IFN-γ immunity and are rare monogenic causes of tuberculosis, each found in less than 1/600,000 individuals.
    explanation: >-
      The only order-of-magnitude frequency statement available, quoted here for
      the record without being converted into a rate.
pathophysiology:
- name: Biallelic TYK2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift and splice variants on both TYK2 alleles. Most abolish
    protein production outright; a smaller group produces a detectable protein
    that is catalytically dead across all TYK2-dependent pathways. Both are
    counted as complete deficiency because the cellular phenotype is the same,
    and both are distinct from the hypomorphic missense alleles that impair
    IL-23 signalling alone.
  genes:
  - preferred_term: TYK2
    term:
      id: hgnc:12440
      label: TYK2
  evidence:
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven other TYK2-deficient patients from five families and four different ethnic groups. These patients were homozygous for one of five null mutations, different from that seen in P1. They displayed mycobacterial and/or viral infections, but no HIES.
    explanation: >-
      Documents the null-allele class that defines complete deficiency.
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete TYK2 deficiency was first described in 2006 in a single patient, and five forms of AR TYK2 deficiency have now been described in 25 patients: (1) complete without and (2) with residual expression, (3) partial deficiency affecting all pathways, partial deficiency affecting specifically IL-23 signaling due to (4) rare and (5) common variants.
    explanation: >-
      Sets out the five recognised forms and identifies which two of them are
      complete deficiency, the scope of this entry.
  downstream:
  - target: Loss of TYK2 Kinase Activity
    description: >-
      A null or catalytically dead allele on both chromosomes removes the
      kinase activity of TYK2 from every cell.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17088085
      reference_title: Human tyrosine kinase 2 deficiency reveals its requisite roles in multiple cytokine signals involved in innate and acquired immunity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The cytokine signals were successfully restored by transducing the intact Tyk2 gene.
      explanation: >-
        Complementation of the patient's cells with wild-type TYK2 restores the
        signalling defects, establishing that the variant genotype is what
        abolishes TYK2 function.
- name: Loss of TYK2 Kinase Activity
  biological_scale: MOLECULAR
  description: >-
    TYK2 is a non-receptor tyrosine kinase that pairs with JAK1 or JAK2 on the
    receptors for type I interferons, IL-12, IL-23 and IL-10 and phosphorylates
    the receptor and the STATs recruited to it. In complete deficiency that
    catalytic activity is gone, whether because no protein is made or because
    the protein made cannot phosphorylate. The consequences are pathway-shared
    rather than pathway-specific, which is why one gene defect produces two
    otherwise unrelated infectious susceptibilities.
  molecular_functions:
  - preferred_term: tyrosine kinase 2 catalytic activity
    modifier: ABSENT
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
  evidence:
  - reference: PMID:17088085
    reference_title: Human tyrosine kinase 2 deficiency reveals its requisite roles in multiple cytokine signals involved in innate and acquired immunity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The patient's cells displayed defects in multiple cytokine signaling pathways including those for type I interferon (IFN), interleukin (IL)-6, IL-10, IL-12, and IL-23.
    explanation: >-
      The original demonstration that one TYK2 genotype disables several
      cytokine pathways simultaneously.
  downstream:
  - target: Destabilised Cytokine Receptor Surface Expression
    description: >-
      Beyond phosphorylating substrates, TYK2 acts as a chaperone that holds its
      partner receptor chains at the cell surface; losing the protein loses that
      function too.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TYK2 deficiency is known to reduce the stability of the surface receptors IFN-αR1, IL-12Rβ1, and IL-10R2, by disrupting TYK2-dependent scaffolding functions.
      explanation: >-
        Names the three receptor chains destabilised by loss of the TYK2
        scaffold.
  - target: Impaired Type I Interferon Signaling
    description: >-
      TYK2 is the kinase on IFNAR1; without it the type I interferon receptor
      transduces poorly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human cells homozygous for rare loss-of-expression (LOE) TYK2 alleles have impaired, but not abolished, cellular responses to IFN-α/β (underlying viral diseases in the patients) and to IL-12 and IL-23 (underlying mycobacterial diseases).
      explanation: >-
        Measures the type I interferon response defect in cells carrying
        complete-deficiency alleles, and records that it is partial.
  - target: Impaired IL-12 and IL-23 Signaling
    description: >-
      TYK2 pairs with JAK2 on IL-12Rbeta1, the shared chain of the IL-12 and
      IL-23 receptors, so both cytokines lose signal together.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human cells homozygous for rare loss-of-expression (LOE) TYK2 alleles have impaired, but not abolished, cellular responses to IFN-α/β (underlying viral diseases in the patients) and to IL-12 and IL-23 (underlying mycobacterial diseases).
      explanation: >-
        The same measurement establishes the IL-12 and IL-23 arm of the defect.
  - target: Impaired IL-10 Signaling
    description: >-
      IL-10R2 is a TYK2-associated chain, so IL-10 responses fall as well; this
      branch has no established clinical consequence.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26304966
      reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All eight TYK2-deficient patients displayed impaired but not abolished cellular responses to (a) IL-12 and IFN-α/β, accounting for mycobacterial and viral infections, respectively; (b) IL-23, with normal proportions of circulating IL-17(+) T cells, accounting for their apparent lack of mucocutaneous candidiasis; and (c) IL-10, with no overt clinical consequences, including a lack of inflammatory bowel disease.
      explanation: >-
        Records the IL-10 response defect and its clinical silence in the same
        measurement series.
- name: Destabilised Cytokine Receptor Surface Expression
  biological_scale: MOLECULAR
  description: >-
    A second, non-catalytic consequence of losing the protein. TYK2 stabilises
    IFN-alphaR1, IL-12Rbeta1 and IL-10R2 at the plasma membrane, so complete
    deficiency reduces the amount of receptor available as well as the ability
    to signal through it. This is the part of the lesion that the common P1104A
    allele does not share: P1104A is catalytically dead but docks and scaffolds
    normally.
  evidence:
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TYK2 deficiency is known to reduce the stability of the surface receptors IFN-αR1, IL-12Rβ1, and IL-10R2, by disrupting TYK2-dependent scaffolding functions.
    explanation: >-
      The scaffolding function and the three receptors that depend on it.
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The P1104A variant affects the enzymatic activity of TYK2 but has no impact on its scaffolding function or capacity to be phosphorylated as a substrate.
    explanation: >-
      Establishes that the scaffolding lesion is specific to complete deficiency
      and absent in the common hypomorphic allele.
  downstream:
  - target: Impaired Type I Interferon Signaling
    description: >-
      Less IFN-alphaR1 at the surface compounds the loss of kinase activity on
      the receptor that remains.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TYK2 deficiency is known to reduce the stability of the surface receptors IFN-αR1, IL-12Rβ1, and IL-10R2, by disrupting TYK2-dependent scaffolding functions.
      explanation: >-
        IFN-alphaR1 is named among the destabilised receptors.
  - target: Impaired IL-12 and IL-23 Signaling
    description: >-
      IL-12Rbeta1 is the shared receptor chain for both cytokines and is
      destabilised by the same mechanism.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        TYK2 deficiency is known to reduce the stability of the surface receptors IFN-αR1, IL-12Rβ1, and IL-10R2, by disrupting TYK2-dependent scaffolding functions.
      explanation: >-
        IL-12Rbeta1 is named among the destabilised receptors.
- name: Impaired Type I Interferon Signaling
  biological_scale: CELLULAR
  description: >-
    Responses to IFN-alpha and IFN-beta are reduced across leukocyte and
    non-haematopoietic compartments. The defect is partial rather than absolute,
    which is consistent with the clinical picture: patients are not
    uniformly overwhelmed by every virus, but they suffer unusually severe
    disease with herpesviruses and respiratory viruses, and some have had
    adverse reactions to live attenuated vaccines. Responses to type III
    interferon (IFN-lambda) were normal in the cells assayed in the 2015 series,
    so the antiviral deficit is described as specifically a type I interferon
    deficit - but that generalisation does not hold across cell types, which is
    curated as an open question below.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human cells homozygous for rare loss-of-expression (LOE) TYK2 alleles have impaired, but not abolished, cellular responses to IFN-α/β (underlying viral diseases in the patients) and to IL-12 and IL-23 (underlying mycobacterial diseases).
    explanation: >-
      The measured type I interferon response defect, stated as impaired rather
      than abolished.
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cellular responses to IL-21, IL-27, IFN-γ, IL-28/29 (IFN-λ), and leukemia inhibitory factor (LIF) were normal.
    explanation: >-
      Shows that type III interferon and interferon-gamma responses were normal
      in the cells assayed, which is the basis for confining the antiviral lesion
      to type I interferon. See the type III interferon discussion for the
      cell-type-dependent exception.
  downstream:
  - target: Failure of Cell-Intrinsic Antiviral Defence
    description: >-
      Type I interferon signalling is the pathway that installs the
      interferon-stimulated antiviral programme, so weakening it weakens
      cell-intrinsic viral control.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Poor responses to IFN-α/β in most if not all cell types underlie viral diseases, whereas poor IFN-γ induction in lymphocytes stimulated with IL-12 or IL-23 underlies mycobacterial diseases.
      explanation: >-
        States the causal assignment of viral disease to the type I interferon
        branch.
- name: Impaired IL-12 and IL-23 Signaling
  biological_scale: CELLULAR
  description: >-
    IL-12 and IL-23 share the IL-12Rbeta1 chain and both use TYK2 with JAK2, so
    both are impaired together. The functional consequence measured in patient
    peripheral blood mononuclear cells is reduced interferon-gamma output on
    stimulation with either cytokine. IL-23-driven IL-17 induction is also weak,
    which accounts for the candidal disease seen in some patients, though
    circulating IL-17-positive T-cell proportions can be normal.
  biological_processes:
  - preferred_term: interleukin-12-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035722
      label: interleukin-12-mediated signaling pathway
  - preferred_term: interleukin-23-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038155
      label: interleukin-23-mediated signaling pathway
  evidence:
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, patients with complete TYK2 deficiency displayed impaired IL-12– and IL-23–mediated IFN-γ production
    explanation: >-
      The direct measurement in patients with complete deficiency, distinguishing
      them from the forms in which only IL-23 signalling is affected.
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their IL-23–dependent induction of IL-17 is also weak, accounting for their fungal diseases (Candida).
    explanation: >-
      The IL-17 arm of the same signalling defect and the fungal disease
      attributed to it.
  downstream:
  - target: Deficient Interferon-Gamma Induction in Lymphocytes
    description: >-
      IL-12 and IL-23 are the cytokines that instruct lymphocytes to make
      interferon-gamma; impairing both reduces that output.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, patients with complete TYK2 deficiency displayed impaired IL-12– and IL-23–mediated IFN-γ production
      explanation: >-
        Links the receptor-level defect to reduced interferon-gamma production.
- name: Impaired IL-10 Signaling
  biological_scale: CELLULAR
  description: >-
    IL-10R2 is TYK2-associated, so IL-10 responses are reduced alongside the
    others. No clinical consequence has been established for this branch: unlike
    IL-10 receptor deficiency, TYK2-deficient patients do not develop
    very-early-onset inflammatory bowel disease. It is curated as a node because
    it is a measured, reproducible part of the cellular phenotype and is used
    diagnostically, not because it is thought to cause disease; it therefore has
    no downstream edge.
  biological_processes:
  - preferred_term: interleukin-10-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0140105
      label: interleukin-10-mediated signaling pathway
  evidence:
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All eight TYK2-deficient patients displayed impaired but not abolished cellular responses to (a) IL-12 and IFN-α/β, accounting for mycobacterial and viral infections, respectively; (b) IL-23, with normal proportions of circulating IL-17(+) T cells, accounting for their apparent lack of mucocutaneous candidiasis; and (c) IL-10, with no overt clinical consequences, including a lack of inflammatory bowel disease.
    explanation: >-
      Records both the IL-10 signalling defect and the absence of an attributable
      clinical phenotype.
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired responses to IL-10 seem to be clinically silent.
    explanation: >-
      Independent restatement that this branch carries no known clinical
      consequence.
- name: Deficient Interferon-Gamma Induction in Lymphocytes
  biological_scale: CELLULAR
  description: >-
    Peripheral blood mononuclear cells from patients make less interferon-gamma
    when stimulated with IL-12 or IL-23. This is the convergence point of the
    mycobacterial branch: the 2022 analysis showed that impaired
    IL-23-dependent interferon-gamma induction is the single defect shared by
    every form of TYK2 deficiency that causes mycobacterial disease, whether the
    protein is absent, present but catalytically dead, or merely hypomorphic.
    In complete deficiency the IL-12-dependent arm fails as well, and the
    additional loss is associated with more severe mycobacterial disease.
  biological_processes:
  - preferred_term: positive regulation of interferon-gamma production
    modifier: DECREASED
    term:
      id: GO:0032729
      label: positive regulation of type II interferon production
  cell_types:
  - preferred_term: mature alpha-beta T cell
    term:
      id: CL:0000791
      label: mature alpha-beta T cell
  - preferred_term: natural killer cell
    term:

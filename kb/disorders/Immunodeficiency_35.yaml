      Tyk2 deficiency TYK2 AR 611521 M + LI mpaired cellular responses to IL-10, IL-12, IL-23, and type I IFNs Susceptibility to intracellular bacteria (mycobacteria, Salmonella), and viruses
    explanation: >-
      The IUIS row records susceptibility to intracellular bacteria including

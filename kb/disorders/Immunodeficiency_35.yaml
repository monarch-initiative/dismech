- name: Failure of Cell-Intrinsic Antiviral Defence
  biological_scale: CELLULAR
  description: >-
    Without an adequate type I interferon response, cells do not install the
    interferon-stimulated gene programme that restricts viral replication.
    Reported consequences span herpesviruses, respiratory viruses and live
    attenuated vaccine strains, and in one patient extended to
    Epstein-Barr-virus-driven lymphoma and encephalitis with a neurotropic
    bunyavirus.
  biological_processes:
  - preferred_term: defense response to virus
    modifier: DECREASED
    term:
      id: GO:0051607
      label: defense response to virus
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired responses to type I IFNs underlie severe viral diseases, including COVID-19 pneumonia, influenza pneumonia, herpes simplex encephalitis, and adverse reactions to live attenuated vaccines.
    explanation: >-
      Enumerates the viral disease spectrum attributed to the type I interferon
      defect.
  - reference: PMID:37695435
    reference_title: "A Novel Homozygous Mutation Causing Complete TYK2 Deficiency, with Severe Respiratory Viral Infections, EBV-Driven Lymphoma, and Jamestown Canyon Viral Encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a 4-year-old female with severe respiratory viral infections, EBV-driven Burkitt-like lymphoma, and infection with the neurotropic Jamestown Canyon virus.
    explanation: >-
      The most severe reported viral phenotype in complete TYK2 deficiency.
phenotypes:
- name: Mycobacterial disease
  category: Immunologic
  diagnostic: true
  frequency: FREQUENT
  description: >-
    Disseminated or refractory disease with weakly virulent mycobacteria - BCG
    vaccine strain and environmental species - and with Mycobacterium
    tuberculosis. Reported in about 48% of patients, so it is common but not
    obligate, and its occurrence depends partly on whether the patient was
    vaccinated with BCG.
  phenotype_term:
    preferred_term: Recurrent mycobacterial infections
    term:
      id: HP:0011274
      label: Recurrent mycobacterial infections
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete clinical penetrance has been observed for mycobacterial and viral diseases, as 48% and 60% of patients, respectively, develop these diseases.
    explanation: >-
      The 48% figure that places this phenotype in the frequent band.
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The core clinical phenotype of TYK2 deficiency is mycobacterial and/or viral infections, caused by impaired responses to IL-12 and IFN-α/β.
    explanation: >-
      Establishes mycobacterial infection as one of the two core clinical
      features.
- name: BCG disease
  category: Immunologic
  description: >-
    Local or disseminated disease caused by the live attenuated Mycobacterium
    bovis BCG vaccine. It is the commonest single mycobacterial presentation and
    the usual route to diagnosis in countries with universal BCG vaccination,
    where it is regularly mistaken for chronic granulomatous disease.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  evidence:
  - reference: PMID:41465118
    reference_title: "TYK2 Deficiency Presenting as Refractory Disseminated BCG/Tuberculosis Infection in a Kazakh Child: A Case Report with Genetic Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical overlap with chronic granulomatous disease (CGD) and other granulomatous disorders complicates diagnosis, particularly in nations where universal BCG vaccination is instituted.
    explanation: >-
      Records both the BCG-vaccination context and the misdiagnosis it invites.
- name: Severe or recurrent viral infection
  category: Immunologic
  diagnostic: true
  frequency: FREQUENT
  description: >-
    Unusually severe disease with herpesviruses and respiratory viruses -
    herpes simplex including encephalitis, varicella-zoster, molluscum
    contagiosum, parainfluenza, influenza and COVID-19 pneumonia - and adverse
    reactions to live attenuated viral vaccines. Reported in about 60% of
    patients.
  phenotype_term:
    preferred_term: Recurrent viral infections
    term:
      id: HP:0004429
      label: Recurrent viral infections
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired responses to type I IFNs underlie severe viral diseases, including COVID-19 pneumonia, influenza pneumonia, herpes simplex encephalitis, and adverse reactions to live attenuated vaccines.
    explanation: >-
      The viral disease spectrum and its mechanistic attribution.
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete clinical penetrance has been observed for mycobacterial and viral diseases, as 48% and 60% of patients, respectively, develop these diseases.
    explanation: >-
      The 60% figure that places this phenotype in the frequent band.
- name: Normal peripheral blood immunophenotype
  category: Immunologic
  diagnostic: true
  description: >-
    A negative finding with diagnostic weight. Deep immunophenotyping of
    TYK2-deficient patients showed normal numbers and proportions of T-cell,
    innate-like T-cell, innate lymphoid, monocyte and dendritic-cell subsets, so
    routine lymphocyte subset counts do not flag this disorder and a normal
    result must not be taken to exclude it. No HP term is bound: the claim is
    the absence of an abnormality, and binding a phenotype term would assert one.
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deep immunophenotyping revealed no peripheral blood mononuclear cells (PBMC) abnormalities in patients with the various forms of TYK2 deficiency, indicating the presence of normal numbers and percentages of the different myeloid and lymphoid cell subsets
    explanation: >-
      States the normal immunophenotype across the forms of TYK2 deficiency.
- name: Elevated serum IgE with eczema
  category: Immunologic
  frequency: VERY_RARE
  description: >-
    The feature that gave the disorder its original name and that later work
    removed from it. The 2006 index patient had atopic dermatitis, high IgE and
    staphylococcal abscesses and was diagnosed clinically with hyper-IgE
    syndrome; none of the seven patients reported in 2015 had any of this, and
    their cells responded normally to IL-6. Hyper-IgE syndrome is therefore not
    an intrinsic feature of TYK2 deficiency, and this phenotype is curated only
    to record that the historical label was wrong.
  phenotype_term:
    preferred_term: Increased circulating IgE concentration
    term:
      id: HP:0003212
      label: Increased circulating IgE concentration
  evidence:
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive, complete TYK2 deficiency was previously described in a patient (P1) with intracellular bacterial and viral infections and features of hyper-IgE syndrome (HIES), including atopic dermatitis, high serum IgE levels, and staphylococcal abscesses.
    explanation: >-
      Documents the features in the single patient in whom they occurred.
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, impaired IL-6 responses and HIES do not appear to be intrinsic features of TYK2 deficiency in humans.
    explanation: >-
      Refutes hyper-IgE syndrome as a feature of the disorder, which is why this
      phenotype is banded very rare rather than treated as characteristic.
- name: Mucocutaneous candidiasis
  category: Immunologic
  frequency: OCCASIONAL
  description: >-
    Candidal disease occurs in some patients and is attributed to the weak
    IL-23-dependent induction of IL-17. It is not a consistent feature: the 2015
    series specifically noted its apparent absence alongside normal proportions
    of circulating IL-17-positive T cells, so the IL-17 deficit is functional
    rather than numerical and does not always translate into disease.
  phenotype_term:
    preferred_term: Chronic mucocutaneous candidiasis
    term:
      id: HP:0002728
      label: Chronic mucocutaneous candidiasis
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their IL-23–dependent induction of IL-17 is also weak, accounting for their fungal diseases (Candida).
    explanation: >-
      Attributes candidal disease in these patients to the IL-17 induction
      defect.
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All eight TYK2-deficient patients displayed impaired but not abolished cellular responses to (a) IL-12 and IFN-α/β, accounting for mycobacterial and viral infections, respectively; (b) IL-23, with normal proportions of circulating IL-17(+) T cells, accounting for their apparent lack of mucocutaneous candidiasis; and (c) IL-10, with no overt clinical consequences, including a lack of inflammatory bowel disease.
    explanation: >-
      The counterweight: in the eight patients assayed, IL-17-positive T-cell
      proportions were normal and candidiasis was apparently absent.
genetic:
- name: TYK2
  association: Causal biallelic variant
  gene_term:
    preferred_term: TYK2
    term:
      id: hgnc:12440
      label: TYK2
  notes: >-
    Complete deficiency covers two of the five recognised forms of autosomal
    recessive TYK2 deficiency: loss-of-expression alleles that abolish protein
    production, and rare alleles such as G1010D that leave a detectable but
    catalytically dead protein. The other three forms are partial and are not
    curated here. Reported complete-deficiency alleles include the nonsense
    changes c.745C>T (p.R249*) and c.3388C>T (p.Arg1130*), splice variants, and
    frameshifts; the reported alleles are private to individual families rather
    than recurrent.
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete TYK2 deficiency was first described in 2006 in a single patient, and five forms of AR TYK2 deficiency have now been described in 25 patients: (1) complete without and (2) with residual expression, (3) partial deficiency affecting all pathways, partial deficiency affecting specifically IL-23 signaling due to (4) rare and (5) common variants.
    explanation: >-
      Enumerates the five forms and identifies the two that constitute complete
      deficiency.
  - reference: PMID:37695435
    reference_title: "A Novel Homozygous Mutation Causing Complete TYK2 Deficiency, with Severe Respiratory Viral Infections, EBV-Driven Lymphoma, and Jamestown Canyon Viral Encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel, homozygous c.745C > T (p.R249*) variant was found in TYK2.
    explanation: >-
      A representative nonsense allele causing complete deficiency.
environmental:
- name: Bacille Calmette-Guerin vaccination
  description: >-
    Live attenuated Mycobacterium bovis BCG, given routinely in most
    tuberculosis-endemic countries in the first days of life. In this disorder
    it is not a neutral exposure: it supplies the mycobacterium that the
    unarmed macrophage compartment cannot contain, and BCG disease is the
    commonest single mycobacterial manifestation. Several reported patients have
    asymptomatic homozygous siblings who were simply never vaccinated, which is
    the clearest available demonstration that this exposure gates the phenotype
    rather than merely accompanying it.
  effect: >-
    Triggers local or disseminated mycobacterial disease in individuals who
    cannot activate macrophages through the interferon-gamma axis.
  influences_mechanisms:
  - target: Inadequate Macrophage Control of Intramacrophagic Pathogens
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Vaccination introduces a live mycobacterium into a host whose macrophages
      cannot be adequately licensed to kill it.
    evidence:
    - reference: PMID:41465118
      reference_title: "TYK2 Deficiency Presenting as Refractory Disseminated BCG/Tuberculosis Infection in a Kazakh Child: A Case Report with Genetic Confirmation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical overlap with chronic granulomatous disease (CGD) and other granulomatous disorders complicates diagnosis, particularly in nations where universal BCG vaccination is instituted.
      explanation: >-
        Places the disease in the universal-BCG-vaccination setting in which the
        exposure is delivered.
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired responses to type I IFNs underlie severe viral diseases, including COVID-19 pneumonia, influenza pneumonia, herpes simplex encephalitis, and adverse reactions to live attenuated vaccines.
    explanation: >-
      Records that live attenuated vaccines are a recognised hazard in this
      disorder; BCG is the live vaccine implicated in its mycobacterial arm.
  notes: >-
    No ECTO exposure term is bound. ECTO was searched for a vaccination-exposure
    class covering administration of a live attenuated bacterial vaccine and none
    was found that names the exposure rather than the vaccine substance, so the
    entry is left with free text rather than a term chosen for the sake of having
    one.

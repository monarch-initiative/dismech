name: Immunodeficiency 35
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
synonyms:
- IMD35
- immunodeficiency type 35
- tyrosine kinase 2 deficiency
- TYK2 deficiency
- complete TYK2 deficiency
- susceptibility to infection due to TYK2 deficiency
- autosomal recessive hyper-IgE syndrome due to TYK2 deficiency
- HIES with atypical Mycobacteriosis, autosomal recessive
description: >-
  Immunodeficiency 35 is an ultra-rare autosomal recessive inborn error of
  immunity caused by biallelic loss-of-function variants in TYK2, the gene
  encoding tyrosine kinase 2. TYK2 is one of the four human Janus kinases and
  sits on the receptors for type I interferons, interleukin-12, interleukin-23
  and interleukin-10. Losing it therefore removes one shared component from
  four otherwise independent cytokine circuits at once, and the clinical
  picture is the sum of the two circuits that matter for host defence: poor
  responses to IL-12 and IL-23 leave interferon-gamma induction in lymphocytes
  too weak to arm macrophages against intramacrophagic pathogens, giving
  mycobacterial disease, and poor responses to type I interferon leave cells
  unable to mount an intrinsic antiviral programme, giving severe viral
  disease. Impaired IL-10 responses appear to be clinically silent.

  This entry covers complete TYK2 deficiency only. That boundary is the main
  curation decision here, because the same gene carries a common hypomorphic
  missense allele, P1104A, which is homozygous in roughly one in six hundred
  Europeans, impairs IL-23 signalling alone, and is a common monogenic
  aetiology of tuberculosis rather than a Mendelian immunodeficiency. The
  IUIS nosology lists the two as separate entities, and the mechanistic
  literature separates them cleanly: complete deficiency compromises type I
  interferon, IL-12, IL-23 and IL-10 responses together, whereas P1104A
  homozygosity spares IFN-alpha, IL-10 and IL-12. The large pharmacological
  TYK2-inhibitor literature is likewise about deliberate partial inhibition of
  this kinase in autoimmune disease and says nothing about congenital complete
  loss.

  The first patient, reported in 2006, was diagnosed clinically with hyper-IgE
  syndrome, and TYK2 deficiency was for several years described as a form of
  autosomal recessive hyper-IgE syndrome. A 2015 series of seven further
  patients overturned that: none had hyper-IgE syndrome, their cells responded
  normally to IL-6, and the phenotype was redefined as mycobacterial and/or
  viral infection. Twenty-five patients with complete deficiency have been
  reported. Penetrance is incomplete - mycobacterial disease occurs in about
  half and viral disease in about three-fifths - and asymptomatic homozygotes
  are on record, in some cases siblings of severely affected probands who were
  simply never given BCG.

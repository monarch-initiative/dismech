- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    Replacing the haematopoietic compartment restores TYK2 in the cells that
    matter for the mycobacterial and viral branches. One patient transplanted
    from unrelated donors was followed for four years with reduced infection
    burden and restored JAK/STAT responses, at the cost of chronic
    graft-versus-host disease. It is not established therapy: the evidence is a
    single reported patient.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of TYK2 Kinase Activity
    treatment_effect: RESTORES
    description: >-
      Donor-derived cells carry wild-type TYK2, so the kinase is restored in the
      haematopoietic compartment; non-haematopoietic cells remain deficient.
    evidence:
    - reference: PMID:38896258
      reference_title: Successful Immune Reconstitution in a Patient with a TYK2 Deficiency after Allogeneic Stem Cell Transplantation from Unrelated Donors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found that HSCT significantly reduced the incidence of severe infections, restored normal TKY2 levels, and reversed defects such as impaired JAK/STAT signaling in response to interferon-α or interleukin-10 treatment.
      explanation: >-
        Measures restoration of TYK2 protein and of the downstream signalling
        defects after transplantation.
  evidence:
  - reference: PMID:38896258
    reference_title: Successful Immune Reconstitution in a Patient with a TYK2 Deficiency after Allogeneic Stem Cell Transplantation from Unrelated Donors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that HSCT is a feasible strategy for reconstituting the immune system in TYK2-deficient patients; however, the factors associated with GVHD and autoimmune thyroiditis development in TYK2-deficient patients undergoing HSCT warrant further investigation.
    explanation: >-

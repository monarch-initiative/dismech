differential_diagnoses:
- name: TYK2 P1104A homozygosity
  description: >-
    The same gene, a different entity. P1104A is a common hypomorphic missense
    allele - homozygous in roughly one in six hundred Europeans - that is
    catalytically dead but docks and scaffolds normally, and that selectively
    disrupts IL-23 signalling while sparing IFN-alpha, IL-10 and IL-12. Its
    clinical expression is tuberculosis, and more rarely mycobacterial disease,
    without viral disease. The IUIS nosology lists it as a separate entity from
    Tyk2 deficiency. It is the differential that matters most here, because a
    literature search on TYK2 returns far more on this allele than on complete
    deficiency.
  distinguishing_features:
  - Normal cellular responses to IFN-alpha, IL-10 and IL-12, with only IL-23 impaired
  - Normal TYK2 scaffolding of IFN-alphaR1, IL-12Rbeta1 and IL-10R2
  - Tuberculosis rather than viral disease as the clinical expression
  - Allele frequency in the general population, not a private family variant
  evidence:
  - reference: PMID:30578352
    reference_title: Tuberculosis and impaired IL-23-dependent IFN-γ immunity in humans homozygous for a common TYK2 missense variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Surprisingly, we also show that TYK2 P1104A impairs cellular responses to IL-23, but not to IFN-α, IL-10, or even IL-12, which, like IL-23, induces IFN-γ via activation of TYK2 and JAK2.
    explanation: >-
      The cellular measurement that separates the two entities: three of the four
      TYK2-dependent responses are preserved in P1104A homozygotes.
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two types of inherited TYK2 deficiencies are known: AR complete deficiency underlying MSMD (and more rarely TB) and/or viral diseases, and homozygosity for P1104A deficiency underlying TB (and more rarely MSMD) without viral diseases.
    explanation: >-
      The clinical statement of the same boundary, including the presence or
      absence of viral disease.
- name: Interleukin-12 receptor beta-1 deficiency
  description: >-
    The commonest genetic cause of Mendelian susceptibility to mycobacterial
    disease and the closest phenocopy of the mycobacterial arm of this disorder.
    IL-12Rbeta1 is the receptor chain TYK2 sits on, so both defects impair
    IL-12- and IL-23-driven interferon-gamma production - but in IL-12Rbeta1
    deficiency that production is abolished rather than reduced, and type I
    interferon signalling is intact, so there is no viral susceptibility.
  distinguishing_features:
  - Interferon-gamma production abolished rather than impaired
  - Intact type I interferon responses and no severe viral disease
  - Biallelic IL12RB1 rather than TYK2 variants
  evidence:
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whereas IL-12– and IL-23–mediated IFN-γ production was completely abolished in the IL-12Rβ1–deficient patient.
    explanation: >-
      Contrasts the abolished production in IL-12Rbeta1 deficiency with the
      merely impaired production in TYK2 deficiency, measured side by side.
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance is probably higher in patients with AR TYK2 deficiency and impaired cellular responses to both IL-12 and IL-23, and even higher in patients with IL-12Rβ1 deficiency with abolished responses to both cytokines
    explanation: >-
      Places the two disorders on the same axis, with IL-12Rbeta1 deficiency the
      more penetrant because its cytokine responses are abolished rather than
      reduced.
- name: Chronic granulomatous disease
  description: >-
    The disorder TYK2 deficiency is most often mistaken for in practice, because
    both present with granulomatous disease after BCG in an infant. The
    discriminator is the phagocyte oxidative burst, which is normal here and
    absent in chronic granulomatous disease.
  distinguishing_features:
  - Normal neutrophil oxidative burst on dihydrorhodamine or nitroblue tetrazolium testing
  - Viral as well as mycobacterial susceptibility
  evidence:
  - reference: PMID:41465118
    reference_title: "TYK2 Deficiency Presenting as Refractory Disseminated BCG/Tuberculosis Infection in a Kazakh Child: A Case Report with Genetic Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical overlap with chronic granulomatous disease (CGD) and other granulomatous disorders complicates diagnosis, particularly in nations where universal BCG vaccination is instituted.
    explanation: >-
      States the diagnostic confusion directly.
animal_models:
- name: Tyk2-deficient mouse
  species: Mouse
  genotype: Tyk2 null (germline knockout)
  publication: PMID:11070173
  description: >-
    Germline Tyk2 knockout mice, generated independently by two groups in 2000.
    They are viable and developmentally normal, and they reproduce the
    partial-signalling character of the human disorder rather than a complete
    block - which is the property that makes them informative and also the
    property that limits them. Where the mouse and the human diverge is IL-10
    and IL-6: mouse responses to both are normal, whereas the human deficiency
    impairs IL-10 signalling, and the original human patient had an IL-6 defect
    as well.
  modeled_mechanisms:
  - target: Impaired Type I Interferon Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces the partial, dose-dependent character of the human
      type I interferon defect: low-dose IFN-alpha fails to signal while high
      concentrations still transduce fully.
    limitations: >-
      The residual signalling is more evident in the mouse than in patients, and
      the antiviral phenotype is elicited by high-dose experimental challenge
      with vaccinia and LCMV rather than by the herpesviruses and respiratory
      viruses that affect patients.
    readouts:
    - name: Vaccinia virus clearance and LCMV-specific T-cell response
      target: Impaired Type I Interferon Signaling
      direction: DECREASED
      interpretation: >-
        Functional antiviral consequence of the type I interferon signalling
        defect in the model.
      evidence:
      - reference: PMID:11070173
        reference_title: Partial impairment of cytokine responses in Tyk2-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tyk2-/- mice are unable to clear vaccinia virus and show a reduced T cell response after LCMV challenge.
        explanation: >-
          The measured antiviral failure in the knockout.
    evidence:
    - reference: PMID:11070174
      reference_title: Tyk2 plays a restricted role in IFN alpha signaling, although it is required for IL-12-mediated T cell function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Tyk2-deficient mice show no overt developmental abnormalities; however, they display a lack of responsiveness to a small amount of IFNalpha, although a high concentration of IFNalpha can fully transduce its signal even in the absence of tyk2.
      explanation: >-
        Establishes that the model has a partial, dose-dependent type I
        interferon defect rather than an absolute one.
  - target: Impaired IL-12 and IL-23 Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      IL-12-driven T-cell function is defective in the knockout, matching the
      IL-12 arm of the human lesion, and the macrophages fail an
      activation-dependent effector readout.
    limitations: >-
      The mouse experiments predate the recognition that IL-23-dependent
      interferon-gamma induction is the defect shared by all human forms, and
      they measure IL-12-driven T-cell function and nitric oxide production
      rather than IL-23-driven interferon-gamma output, so the specific human
      convergence point is not directly modelled.
    readouts:
    - name: IL-12-induced T-cell function
      target: Impaired IL-12 and IL-23 Signaling
      direction: DECREASED
      interpretation: >-
        The IL-12 signalling arm of the human lesion is present in the mouse.
      evidence:
      - reference: PMID:11070174
        reference_title: Tyk2 plays a restricted role in IFN alpha signaling, although it is required for IL-12-mediated T cell function.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, IL-12-induced T cell function is defective in these mice.
        explanation: >-
          Direct measurement of the IL-12 response defect.
    - name: Lipopolysaccharide-induced macrophage nitric oxide production
      target: Impaired IL-12 and IL-23 Signaling
      direction: DECREASED
      interpretation: >-
        A macrophage effector readout that fails downstream of the same
        signalling lesion.
      evidence:
      - reference: PMID:11070173
        reference_title: Partial impairment of cytokine responses in Tyk2-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tyk2-/- macrophages fail to produce nitric oxide upon lipopolysaccharide induction.
        explanation: >-
          The measured macrophage effector failure.
    evidence:
    - reference: PMID:11070173
      reference_title: Partial impairment of cytokine responses in Tyk2-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to other Jaks, where inactivation leads to a complete loss of the respective cytokine receptor signal, Tyk2-/- mice display reduced responses to IFNalpha/beta and IL-12 and a selective deficiency in Stat3 activation in these pathways.
      explanation: >-
        Establishes the partial character of the signalling defect that makes
        this model informative for TYK2 rather than for the other Janus kinases.
  - target: Impaired IL-10 Signaling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Tyk2-deficient mice respond normally to IL-10, whereas the IL-10 response
      is impaired in every human patient assayed. The mouse cannot be used to
      study this branch.
    limitations: >-
      The species difference is not a matter of degree: mouse IL-10 responses are
      reported as normal, so there is no defect in the model to characterise. The
      same holds for IL-6, where the mouse is normal and the human index patient
      was not. The original human report drew exactly this contrast, noting that
      the human requirement for TYK2 across cytokine pathways differs
      substantially from the mouse.
    evidence:
    - reference: PMID:11070174
      reference_title: Tyk2 plays a restricted role in IFN alpha signaling, although it is required for IL-12-mediated T cell function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, these mice respond normally to IL-6 and IL-10, both of which activate tyk2 in vitro.
      explanation: >-
        The measurement showing the mouse has no IL-10 or IL-6 defect to model.
    - reference: PMID:17088085
      reference_title: Human tyrosine kinase 2 deficiency reveals its requisite roles in multiple cytokine signals involved in innate and acquired immunity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This study identifies human Tyk2 deficiency and demonstrates that Tyk2 plays obligatory roles in multiple cytokine signals involved in innate and acquired immunity of humans, which differs substantially from Tyk2 function in mice.
      explanation: >-
        The authors' own statement of the species divergence in TYK2 pathway
        dependence.
  evidence:
  - reference: PMID:11070174
    reference_title: Tyk2 plays a restricted role in IFN alpha signaling, although it is required for IL-12-mediated T cell function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These observations demonstrate that tyk2 plays only a restricted role in mediating IFNalpha-dependent signaling while being required in mediating IL-12-dependent biological responses.
    explanation: >-
      The summary of what this model does and does not establish about TYK2
      pathway dependence.
discussions:
- discussion_id: gap_tyk2_complete_vs_hypomorph_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Where does complete TYK2 deficiency end and partial TYK2 deficiency begin,
    given that the mechanism now held to explain mycobacterial disease is shared
    by both?
  attaches_to:
  - genetic#TYK2
  - pathophysiology#Deficient Interferon-Gamma Induction in Lymphocytes
  rationale: >-
    The 2022 analysis showed that impaired IL-23-dependent interferon-gamma
    induction is the only mechanism of mycobacterial disease common to all five
    forms of autosomal recessive TYK2 deficiency, from complete loss of
    expression through to homozygosity for the common P1104A allele. That result
    is what makes the boundary awkward. For the mycobacterial phenotype the two
    ends of the spectrum are mechanistically continuous, and the reasons for
    keeping them apart are that complete deficiency additionally loses type I
    interferon, IL-12 and IL-10 signalling and the scaffolding function, and that
    only complete deficiency produces viral disease. Those are real differences
    and the IUIS nosology encodes them as separate entities, so this entry is
    confined to complete deficiency. But the line is drawn on the extra
    pathways, not on the mechanism the two share, and no study has tested whether
    the mycobacterial disease seen in a complete-deficiency patient differs in
    kind from that seen in a P1104A homozygote once exposure is matched. Until
    it does, the question of whether these should be one graded entity or two is
    open, and this entry records that rather than settling it. Note also that the
    intermediate forms complicate any purely genetic rule: G1010D produces a
    detectable protein that is nonetheless loss-of-function across all pathways
    and is counted as complete deficiency, while R864C produces a hypomorph that
    is not.
  evidence:
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impairment of the IL-23-dependent induction of IFN-γ is the only mechanism of mycobacterial disease common to patients with complete TYK2 deficiency with or without TYK2 expression, partial TYK2 deficiency across signaling pathways, or rare or common partial TYK2 deficiency specific for IL-23 signaling.
    explanation: >-
      The result that makes the boundary a genuine question: one mechanism spans
      the whole spectrum.
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two types of inherited TYK2 deficiencies are known: AR complete deficiency underlying MSMD (and more rarely TB) and/or viral diseases, and homozygosity for P1104A deficiency underlying TB (and more rarely MSMD) without viral diseases.
    explanation: >-
      The clinical grounds on which the same authors nonetheless keep the two
      apart, which is the position this entry adopts.
- discussion_id: mismatch_tyk2_type_iii_interferon
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does type III interferon signalling actually require TYK2 in human cells, and
    if it does so only in some cell types, what does that mean for the antiviral
    phenotype of complete TYK2 deficiency?
  attaches_to:
  - pathophysiology#Impaired Type I Interferon Signaling
  rationale: >-
    TYK2 is constitutively associated with IL-10R2, one of the two chains of the
    type III interferon receptor, so on the receptor architecture alone
    IFN-lambda signalling ought to fail in complete deficiency. The 2015 patient
    series found responses to IL-28/IL-29 normal, and this entry follows that in
    confining the antiviral lesion to type I interferon. But the cell-line
    evidence does not agree with itself: SV40-transformed fibroblasts from
    patients with complete TYK2 deficiency respond very weakly to type III
    interferon while their EBV-transformed B cells respond normally, and a
    TYK2-knockout HAP1 line responds normally to IFN-lambda1. The result is
    therefore cell-type-dependent, and every observation on either side comes
    from a transformed line rather than from a primary cell or a clinical
    outcome. Whether the discrepancy reflects real tissue-specific redundancy -
    with JAK1, or with the JAK2 phosphorylation that type III but not type I
    interferons trigger, taking over - or an artefact of transformation is
    unresolved. It matters because the epithelial surfaces where type III
    interferon does most of its work are exactly the surfaces on which these
    patients get their respiratory viral disease, and no patient-derived
    epithelial system has been tested.
  evidence:
  - reference: PMID:38781720
    reference_title: "In search of a function for human type III interferons: insights from inherited and acquired deficits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, for complete TYK2 deficiency, SV40-transformed fibroblasts have very weak responses, whereas EBV-B cells respond normally
    explanation: >-
      The cell-type discrepancy itself, measured in two transformed lines from
      patients with complete deficiency.
  - reference: PMID:38781720
    reference_title: "In search of a function for human type III interferons: insights from inherited and acquired deficits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The response to IFN-λ1 in HAP1-TYK2KO cells is normal, suggesting that type III IFN signaling may be TYK2-independent, at least in some cell types
    explanation: >-
      An engineered knockout line supporting TYK2-independence, with the authors'
      own cell-type caveat attached.
  - reference: PMID:38781720
    reference_title: "In search of a function for human type III interferons: insights from inherited and acquired deficits."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ligand-receptor interaction triggers the activation of JAK1 and TYK2, constitutively associated with IFNLR1 and IL10RB, respectively, leading to the heterodimerization of STAT1/STAT2, which, together with IRF9, form the ISGF3 transcription complex
    explanation: >-
      The receptor architecture that predicts a type III interferon defect, which
      is what makes the normal responses surprising.
  - reference: PMID:26304966
    reference_title: "Human TYK2 deficiency: Mycobacterial and viral infections without hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cellular responses to IL-21, IL-27, IFN-γ, IL-28/29 (IFN-λ), and leukemia inhibitory factor (LIF) were normal.
    explanation: >-
      The patient-cell result this entry follows, which the cell-line data
      qualify rather than overturn.
- discussion_id: gap_tyk2_penetrance_determinants
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a person homozygous for a TYK2 null allele develops
    mycobacterial disease, viral disease, both, or nothing at all?
  attaches_to:
  - phenotypes#Mycobacterial disease
  - phenotypes#Severe or recurrent viral infection
  rationale: >-
    Penetrance is incomplete for both defining phenotypes - roughly half of
    patients develop mycobacterial disease and three-fifths viral disease - and
    asymptomatic homozygous adults are on record, including siblings of severely
    affected probands. Exposure explains part of it, since several asymptomatic
    homozygotes were never given BCG and BCG disease is the commonest
    mycobacterial presentation, and the environmental link curated here records
    that. It does not explain the viral arm, where exposure to herpesviruses and
    respiratory viruses is effectively universal and yet two of five siblings in
    one family had hypoxaemic COVID-19 pneumonia while another was asymptomatic
    after infection. No modifier has been identified, and with twenty-five
    reported patients there is no cohort in which one could be sought.
  evidence:
  - reference: PMID:40949057
    reference_title: Mepolizumab treatment in a child with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete clinical penetrance has been observed for mycobacterial and viral diseases, as 48% and 60% of patients, respectively, develop these diseases.
    explanation: >-
      Quantifies the incomplete penetrance that the gap is about.
  - reference: PMID:36094518
    reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in patients with inherited TYK2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four of these 19 patients with biallelic TYK2 variants presented only intramacrophagic infections, six had viral diseases only, seven had combinations of viral, mycobacterial, and fungal diseases, and two were asymptomatic.
    explanation: >-
      The distribution of clinical outcomes across one cohort, including the
      asymptomatic homozygotes.
clinical_trials: []
datasets: []
notes: >-
  Scope. This entry covers complete autosomal recessive TYK2 deficiency:
  loss-of-expression alleles, and rare alleles producing a detectable protein
  that is loss-of-function across all TYK2-dependent pathways. It deliberately
  excludes the three partial forms, above all homozygosity for the common P1104A
  allele, which is curated only as a differential diagnosis and in the boundary
  knowledge gap. Three literatures that a search on this gene returns were
  screened out rather than used: TYK2 as a GWAS susceptibility locus in
  autoimmune disease, TYK2 as a pathway member in unrelated cytokine disorders,
  and the pharmacological TYK2-inhibitor literature. None of them reports a
  patient with biallelic complete loss, and each citation used here was checked
  to be about such a patient or about a cell or mouse carrying that lesion.

  Evidence-source convention. Sentences whose subject is a patient's clinical
  state, the case count, penetrance, or the genotype found on sequencing are
  graded HUMAN_CLINICAL. Sentences reporting a measurement made on cultured
  patient cells, transduced cell lines or fibroblasts - phospho-STAT responses,
  cytokine-stimulated interferon-gamma production, receptor surface expression,
  complementation with wild-type TYK2 - are graded IN_VITRO even when they appear
  in a clinical paper. Mouse data are MODEL_ORGANISM, and the IUIS classification
  table is OTHER.

  Where a snippet is drawn from a cached PDF extraction it reproduces that text
  verbatim as exact-quote validation requires, including artefacts of the
  extraction: the IUIS table rows carry column runs such as "M + LI mpaired"
  where a line break fell inside a word. Entry prose uses ordinary spellings.

  Module conformance declined. `innate_antiviral_interferon_response#Type I and
  III Interferon Induction and JAK-STAT Signaling` was considered for the
  antiviral branch and not used. That module node bundles interferon *induction*
  (GO:0032606) with JAK-STAT signalling, and induction is not impaired in TYK2
  deficiency - only the response to interferon already made. Declaring
  conformance would assert a lesion the disease does not have. A narrower
  module covering JAK-STAT loss of signalling downstream of a cytokine receptor
  does not currently exist in `kb/modules/`; TYK2 deficiency would be a
  reasonable first conformer if one is created.

  Not curated. No biochemical block: the disorder has no characteristic routine
  laboratory abnormality, and the diagnostic assays are functional signalling
  tests rather than analyte measurements, which are curated under diagnosis. No
  datasets or clinical trials: none specific to complete TYK2 deficiency were
  identified. No prevalence rate, for the reason given in the prevalence record.

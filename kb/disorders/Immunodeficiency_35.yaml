- name: Inadequate Macrophage Control of Intramacrophagic Pathogens
  biological_scale: CELLULAR
  description: >-
    Macrophages that are not adequately activated cannot restrict weakly
    virulent mycobacteria such as BCG and environmental species, nor
    Mycobacterium tuberculosis, nor other intramacrophagic organisms such as
    Salmonella. The clinical result is disseminated or refractory mycobacterial
    disease, most often after BCG vaccination in countries where it is
    routinely given.
  biological_processes:

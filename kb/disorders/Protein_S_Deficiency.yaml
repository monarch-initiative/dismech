biochemical:
- name: Free Protein S Antigen
  biomarker_term:
    preferred_term: Free Protein S Measurement
    term:
      id: NCIT:C122142
      label: Free Protein S Measurement
  presence: Decreased
  context: >-
    Free protein S antigen measures the functionally active, non-C4BP-bound
    fraction (~40% of total) and is the most reliable screening measurement: it
    is reduced in Types I and III. Interpretation is sex- and age-stratified
    (women have lower free and total protein S than men) and results are repeated
    in stable conditions off pregnancy, hormonal therapy, acute thrombosis, and
    anticoagulation.
  readouts:
  - target: Reduced Protein S Cofactor Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Lower free protein S antigen tracks with lower anticoagulant cofactor
      activity; the free fraction is the functionally active pool.
    evidence:
    - reference: PMID:40429442
      reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The free form is functionally active."
      explanation: Establishes free protein S antigen as the functionally active fraction that reports on cofactor activity.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, women generally have lower total and free protein S levels than men. Total PS levels increase with age, particularly in women, due to hormonal variations, whereas free PS levels remain stable over time."
    explanation: Establishes the sex- and age-dependence of protein S antigen levels, which stratifies reference-range interpretation.
- name: Total Protein S Antigen
  biomarker_term:
    preferred_term: Protein S Measurement
    term:
      id: NCIT:C100436
      label: Protein S Measurement
  presence: Decreased or normal
  context: >-
    Total protein S antigen (free plus C4BP-bound) is reduced in Type I
    (quantitative) deficiency but normal in Types II and III, so it detects Type
    I but misses the qualitative and selective-free subtypes.
  readouts:
  - target: Reduced Protein S Cofactor Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A low total protein S antigen indicates quantitative (Type I) deficiency;
      a normal total with reduced activity indicates Type II/III.
    evidence:
    - reference: PMID:40429442
      reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "type 1 (quantitative deficiency), characterized by low levels of total protein S (TPS) and free protein S (FPS), along with reduced protein S activity"
      explanation: Total protein S antigen is reduced in Type I deficiency, the readout distinguishing quantitative from qualitative subtypes.
diagnosis:
- name: "Protein S Deficiency: Free Antigen and Functional Activity Assay"
  description: >-
    Protein S functional activity is assessed by its ability to act as an APC
    cofactor in inactivating factors Va and VIIIa; free and total protein S
    antigen are measured separately by immunoassay. Free protein S antigen is
    the most reliable screen because it reflects the functionally active,
    non-C4BP-bound fraction; total antigen detects Type I but not Type II or III.
    Reference ranges are sex-, age-, and pregnancy-dependent (women have lower
    total and free protein S than men; total protein S rises with age), so
    results must be interpreted against stratified ranges and repeated outside
    pregnancy, hormonal therapy, acute thrombosis, and anticoagulation. Factor V
    Leiden can cause falsely low functional protein S in older clot-based assays.
  diagnosis_term:
    preferred_term: coagulation study
    term:
      id: NCIT:C62662
      label: Coagulation Study
  results: Reduced free and/or total protein S antigen, or reduced protein S functional activity with normal antigen (Type II/III).
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PS functional activity assays measure the biological activity of PS by assessing its ability to function as a cofactor for APC in the inactivation of FVa and FVIIIa."
    explanation: Directly describes the functional-cofactor basis of the protein S activity assay.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, women generally have lower total and free protein S levels than men. Total PS levels increase with age, particularly in women, due to hormonal variations, whereas free PS levels remain stable over time."
    explanation: Establishes the sex- and age-dependence of protein S reference ranges.
- name: "PROS1 Molecular Genetic Testing"
  description: >-
    After a functional/antigen abnormality is confirmed and acquired causes are
    excluded, PROS1 sequencing confirms hereditary deficiency; the ISTH maintains
    a registry of documented PROS1 mutations. Because many acquired and
    physiologic states lower protein S, laboratory testing must be repeated in
    stable conditions before a hereditary diagnosis is made. (Note: the exact
    ISTH-SSC criterion of two abnormal results >=4 weeks apart, and large-deletion
    detection by MLPA, are standard practice but are not stated in this entry's
    cited review and are therefore not asserted here with a snippet.)
  diagnosis_term:
    preferred_term: PROS1 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A pathogenic or likely-pathogenic PROS1 variant confirms hereditary protein S deficiency.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After ruling out acquired causes and if a hereditary deficiency is suspected, PROS1 genetic testing should be performed."
    explanation: Establishes PROS1 sequencing as the confirmatory molecular test after acquired causes are excluded.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, repeat testing in stable conditions is recommended."
    explanation: Establishes the requirement to repeat testing in stable conditions before a hereditary diagnosis.
treatments:
- name: Long-Term Anticoagulation with Heparin-Bridged Initiation
  description: >-
    Anticoagulation (a vitamin K antagonist such as warfarin, or a direct oral
    anticoagulant such as rivaroxaban) reduces the risk of recurrent venous
    thromboembolism; duration is individualized to recurrence versus bleeding
    risk. When warfarin is used, initiation should be bridged with heparin and
    avoid high loading doses, because unbridged warfarin can precipitate
    warfarin-induced skin necrosis in protein S (or protein C) deficiency. Direct
    oral anticoagulants avoid this mechanism and are an alternative, including in
    severe deficiency with recurrent warfarin necrosis.
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Unopposed Thrombin Generation and Fibrin Formation
    treatment_effect: INHIBITS
    description: >-
      Vitamin K antagonism or direct factor Xa inhibition suppresses ongoing
      coagulation-cascade activation, reducing the risk of recurrent thrombosis.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    treatment_effect: BYPASSES
    description: >-
      Heparin bridging during warfarin initiation, or use of a direct oral
      anticoagulant instead of warfarin, avoids the transient protein C/S
      depletion window that can precipitate skin necrosis.
  evidence:
  - reference: PMID:24144709
    reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The switch of anticoagulant therapy from warfarin to rivaroxaban, a direct inhibitor of activated factor X that does not inhibit other vitamin K-dependent proteins, resulted in the disappearance of skin necrosis at 1 year of follow-up."
    explanation: Documents a direct oral anticoagulant as an effective alternative avoiding warfarin-induced skin necrosis in severe protein S deficiency.
  - reference: PMID:24144709
    reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rivaroxaban may be considered as a valid anticoagulant alternative in patients with severe inherited protein S deficiency and warfarin-induced skin necrosis."
    explanation: States the therapeutic recommendation for a direct oral anticoagulant in this setting.
- name: Pregnancy Thromboprophylaxis with Low-Molecular-Weight Heparin
  description: >-
    Pregnancy is the single highest-risk window in hereditary thrombophilia.
    Low-molecular-weight heparin is the preferred antepartum and postpartum
    thromboprophylaxis because it does not cross the placenta; obstetric risk
    schemes (e.g., RCOG) that incorporate inherited thrombophilia guide when it
    is indicated. Vitamin K antagonists are generally avoided in pregnancy (and
    carry the additional protein S-specific skin-necrosis risk noted above).
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: low-molecular-weight heparin
      term:
        id: NCIT:C2578
        label: Low Molecular Weight Heparin
  target_mechanisms:
  - target: Venous Thrombus Formation
    treatment_effect: INHIBITS
    description: >-
      LMWH prophylaxis suppresses thrombin generation and venous thrombus
      formation during the high-risk peripartum period.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "potentially indicating the need for low-molecular-weight heparin prophylaxis"
    explanation: Obstetric risk schemes incorporating inherited thrombophilia indicate LMWH prophylaxis in pregnancy.

animal_models:
- name: Platelet-specific Pros1 knockout mouse (Pros1lox/loxPf4-Cre+)
  species: Mouse
  genotype: Pros1lox/loxPf4-Cre+ (platelet lineage-restricted Pros1 deletion via Platelet factor 4-Cre)
  publication: DOI:10.1182/blood.2019003630
  description: >-
    A conditional knockout that eliminates protein S expression specifically in
    platelets (and their megakaryocyte precursors) while sparing the systemic,
    largely hepatocyte-derived plasma protein S pool.
  modeled_mechanisms:
  - target: Reduced Protein S Cofactor Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of platelet-derived protein S increases venous thrombus propensity by
      impairing its cofactor role for APC and TFPI, limiting factor X activation
      and thrombin generation within the growing thrombus at low shear rates. It
      does not increase arterial thrombosis propensity, unlike systemic human
      deficiency.
    limitations: >-
      This model isolates only the platelet-derived pool of protein S via a
      platelet-lineage-restricted knockout; it does not reproduce the systemic
      (predominantly hepatocyte-synthesized) protein S deficiency that defines
      the human hereditary disorder, so its venous-versus-arterial selectivity
      may not generalize to human global protein S deficiency.
    readouts:
    - name: Venous (vena cava) thrombus propensity
      target: Reduced Protein S Cofactor Activity
      direction: INCREASED
      interpretation: >-
        Platelet protein S loss increases thrombus formation at low shear (vena
        cava) but not at high shear (carotid artery), consistent with a cofactor
        role for APC/TFPI-mediated factor X control within the growing venous
        thrombus.
      evidence:
      - reference: DOI:10.1182/blood.2019003630
        reference_title: "Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "inactivation of PSplt expression using the Platelet factor 4 (Pf4)-Cre transgene (Pros1lox/loxPf4-Cre+) in mice promotes thrombus propensity in the vena cava, where shear rates are low, but not in the carotid artery, where shear rates are high"
        explanation: Directly reports the venous-specific thrombus-propensity phenotype of the platelet Pros1 knockout mouse.
  evidence:
  - reference: DOI:10.1182/blood.2019003630
    reference_title: "Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within the growing thrombus"
    explanation: >-
      Establishes the mechanistic role of protein S as an APC/TFPI cofactor
      limiting thrombin generation, informative for the reduced-cofactor node
      even though it isolates only the platelet-derived pool.
- name: Global Pros1 knockout mouse (Pros1-/-)
  species: Mouse
  genotype: Pros1-/- (constitutive whole-body Pros1 deletion)
  publication: PMID:19729839
  description: >-
    Constitutive whole-body protein S null mouse - the closest model of the
    near-total protein S loss of the human biallelic (severe autosomal recessive)
    form.
  modeled_mechanisms:
  - target: Reduced Protein S Cofactor Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete protein S loss produces a fulminant coagulopathy with accelerated
      thrombin generation, including an activated-protein-C-independent component,
      modeling the anticoagulant-cofactor failure of severe deficiency.
    limitations: >-
      Pros1-/- mice die in utero from fulminant coagulopathy, whereas human
      biallelic neonates survive to present with purpura fulminans, so the model
      captures the coagulopathic severity but not the surviving neonatal course;
      it also shows vascular dysgenesis that is not part of the human hereditary
      thrombophilia phenotype.
    readouts:
    - name: Plasma thrombin generation (aPC-independent component)
      target: Reduced Protein S Cofactor Activity
      direction: INCREASED
      interpretation: >-
        Accelerated thrombin generation in Pros1+/- plasma independent of aPC is
        in vivo evidence for an aPC-independent anticoagulant role of protein S,
        informative for the APC-versus-TFPI cofactor partition.
      evidence:
      - reference: PMID:19729839
        reference_title: Lack of protein S in mice causes embryonic lethal coagulopathy and vascular dysgenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "plasma from Pros1+/- heterozygous mice exhibited accelerated thrombin generation independent of aPC"
        explanation: Reports the aPC-independent accelerated thrombin generation readout of the protein S null model.
  evidence:
  - reference: PMID:19729839
    reference_title: Lack of protein S in mice causes embryonic lethal coagulopathy and vascular dysgenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "all Pros1-/- mice die in utero,from a fulminant coagulopathy and associated hemorrhages"
    explanation: Establishes the near-total protein S loss model as an informative, if embryonic-lethal, correlate of the severe biallelic human form.
- name: Protein S K196E (Tokushima) knock-in mouse
  species: Mouse
  genotype: Pros1 p.Lys196Glu (K196E) knock-in
  publication: PMID:26251307
  description: >-
    Knock-in of the Japanese founder variant PROS1 p.Lys196Glu ("PS Tokushima")
    into the endogenous mouse Pros1 locus. Mice grow normally with normal protein
    S antigen but reduced APC-cofactor activity and exacerbated venous thrombosis.
  modeled_mechanisms:
  - target: Reduced Protein S Cofactor Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces a qualitative (Type II-like) defect: normal protein S antigen
      with selectively reduced APC-cofactor activity, and increased susceptibility
      to venous thrombosis.
    limitations: >-
      Mouse plasma has no detectable protein S TFPI-cofactor activity, so this
      model cannot test whether K196E dissociates the APC-cofactor from the
      TFPI-cofactor pathway; the model also does not aggravate ischemic stroke.
    readouts:
    - name: Plasma APC-cofactor activity
      target: Reduced Protein S Cofactor Activity
      direction: DECREASED
      interpretation: >-
        The K196E mutant retains normal antigen but has selectively reduced APC
        anticoagulant cofactor activity - the molecular correlate of the reduced
        cofactor node.
      evidence:
      - reference: PMID:26251307
        reference_title: Exacerbated venous thromboembolism in mice carrying a protein S K196E mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the purified PS-K196E mutant had 49% to 60% of normal PS APC cofactor activity."
        explanation: Quantifies the selective reduction in APC-cofactor activity of the K196E protein.
    - name: Venous thrombosis susceptibility
      target: Reduced Protein S Cofactor Activity
      direction: INCREASED
      interpretation: >-
        K196E and heterozygous PS-deficient mice form larger venous thrombi and
        die more from induced pulmonary embolism than wild-type mice.
      evidence:
      - reference: PMID:26251307
        reference_title: Exacerbated venous thromboembolism in mice carrying a protein S K196E mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice carrying a protein S-K196E mutation or heterozygous protein S deficiency were more vulnerable to venous thrombosis than wild-type mice."
        explanation: Reports increased venous thrombosis susceptibility, grounding the exacerbated-VTE phenotype of this model.
  evidence:
  - reference: PMID:26251307
    reference_title: Exacerbated venous thromboembolism in mice carrying a protein S K196E mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PS-K196E mice grew normally but had decreased activated protein C cofactor activity in plasma."
    explanation: Establishes the K196E knock-in as an informative model of a qualitative reduced-APC-cofactor defect.
discussions:
- discussion_id: ps_cofactor_pathway_partition
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Protein S Cofactor Activity
  prompt: >-
    How much of protein S's in vivo anticoagulant effect in human hereditary
    deficiency is mediated through the APC-cofactor pathway versus the
    APC-independent TFPI-cofactor pathway, and does this partition differ across
    Type I/II/III subtypes and disease severity?
  rationale: >-
    Protein S has two mechanistically distinct anticoagulant cofactor roles (APC
    and TFPI). The global Pros1-/- model shows an aPC-independent component of
    accelerated thrombin generation (animal_models#Global Pros1 knockout mouse
    (Pros1-/-)), and the p.Lys196Glu knock-in model selectively reduces
    APC-cofactor activity (animal_models#Protein S K196E (Tokushima) knock-in
    mouse). But the K196E model cannot resolve the partition, because protein S
    TFPI-cofactor activity is not detectable in mouse plasma; the human claim of
    preserved TFPI-cofactor activity in K196E rests on human/biochemical data.
    The relative contribution of the two pathways in human hereditary deficiency,
    and its dependence on ISTH Type I/II/III subtype and severity, is unresolved.

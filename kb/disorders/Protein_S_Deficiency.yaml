- name: Warfarin-Induced Skin Necrosis
  category: Physical
  phenotype_term:
    preferred_term: Warfarin-induced skin necrosis
    term:
      id: HP:0001038
      label: Warfarin-induced skin necrosis
  description: >-
    An uncommon but serious complication of vitamin K antagonist initiation,
    classically linked to protein C deficiency and rarely to congenital protein
    S deficiency.
  evidence:
  - reference: PMID:9885367
    reference_title: "Recurrent warfarin-induced skin necrosis in kindreds with protein S deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although protein C deficiency is the most common underlying hypercoagulable state reportedly associated with warfarin skin necrosis, very few cases have been linked to congenital protein S deficiency."
    explanation: Establishes warfarin-induced skin necrosis as a recognized complication of congenital protein S deficiency.
genetic:
- name: PROS1
  gene_term:
    preferred_term: PROS1
    term:
      id: hgnc:9456
      label: PROS1
  relationship_type: CAUSATIVE
  association: >-
    Loss-of-function PROS1 variants cause hereditary protein S deficiency.
    Heterozygous variants cause the common, incompletely penetrant autosomal
    dominant form (THPH5); biallelic variants cause the severe autosomal
    recessive neonatal form (THPH6). More than 200 distinct PROS1 variants
    have been reported, predominantly point mutations, including transversions
    producing a premature stop codon and a truncated, nonfunctional protein.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    description: >-
      Heterozygous PROS1 variants cause the common, incompletely penetrant mild
      deficiency.
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Homozygous or compound heterozygous PROS1 variants cause a severe,
      life-threatening deficiency presenting as neonatal purpura fulminans.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the PROS1 gene are responsible for congenital PS deficiency"
    explanation: Establishes PROS1 as the causal gene for congenital protein S deficiency.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 200 different PROS1 mutations have been identified, giving rise to distinct forms of PS deficiency."
    explanation: Documents the allelic heterogeneity of PROS1 variants.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous mutation typically exhibit a mild PS deficiency, whereas homozygous or compound heterozygous mutations result in severe PS deficiency, which can lead to life-threatening thrombotic complications."
    explanation: Establishes the dominant-mild versus biallelic-severe genotype-phenotype relationship.
- name: F5
  gene_term:
    preferred_term: F5
    term:
      id: hgnc:3542
      label: F5
  relationship_type: MODIFIER
  association: >-
    Co-inheritance of the factor V Leiden variant (F5 c.1601G>A, p.Arg534Gln;
    legacy R506Q) is a common second thrombophilic hit in PROS1-deficient
    families and sharply raises thrombotic risk and lowers age at first event.
    Factor V Leiden was present in 29-38% of symptomatic protein S-deficient
    probands across two family studies; in sibships co-segregating both defects,
    80% of double-carriers were symptomatic; and mean age at first thrombosis was
    18.4 years in combined-defect carriers versus 32.6 years with a single defect.
  notes: >-
    The co-inheritance effect-size magnitudes (co-segregation rate, age at first
    event) are carried in the association text and the evidence snippets rather
    than a structured numeric field, because the Genetic class has no dedicated
    per-modifier odds-ratio / effect-size slot.
  evidence:
  - reference: PMID:8584987
    reference_title: "Factor V Leiden: an additional risk factor for thrombosis in protein S deficient families?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In sibships where both abnormalities were segregating, the percentage of symptomatic individuals with both abnormalities was 80%."
    explanation: Quantifies the fraction of symptomatic double-carriers when factor V Leiden co-segregates with protein S deficiency.
  - reference: PMID:8584987
    reference_title: "Factor V Leiden: an additional risk factor for thrombosis in protein S deficient families?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 16 symptomatic protein S deficient probands the prevalence of the FV Leiden mutation was high (38%)."
    explanation: Documents the high factor V Leiden prevalence among symptomatic protein S-deficient probands (selection reflects familial thrombosis referral).
  - reference: PMID:9607123
    reference_title: "Clinical features of thrombophilia in families with gene defects in protein C or protein S combined with factor V Leiden."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at first thrombosis was significantly lower (P < 0.001) in the ten propositi with a combined genetic defect (mean age 18.4 +/- 6.6 years) than in those with a single defect (mean age 32.6 +/- 10.4 years)."
    explanation: Quantifies the earlier age at first thrombosis when a second defect (factor V Leiden) is co-inherited with protein C/S deficiency.

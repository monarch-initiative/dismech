name: Protein S Deficiency
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- hereditary protein S deficiency
- congenital protein S deficiency
- PROS1-related thrombophilia
- THPH5
- thrombophilia due to protein S deficiency, autosomal dominant
parents:
- Thrombophilia
description: >-
  A single-gene hereditary thrombophilia caused by loss-of-function variants in
  PROS1, the gene encoding protein S. Protein S is a vitamin K-dependent plasma
  glycoprotein that acts as a non-enzymatic cofactor for activated protein C
  (APC) in the proteolytic inactivation of coagulation factors Va and VIIIa, and,
  independently of APC, as a cofactor for tissue factor pathway inhibitor (TFPI).
  Roughly 60% of circulating protein S is bound to C4b-binding protein and is
  anticoagulantly inactive; only the free fraction (~40%) is functionally active.
  Reduced free/functional protein S weakens down-regulation of the coagulation
  cascade, favoring unopposed thrombin generation and predisposing to venous
  thromboembolism (deep vein thrombosis and pulmonary embolism). The common
  heterozygous form is autosomal dominant with incomplete penetrance; biallelic
  (homozygous or compound heterozygous) deficiency causes a severe neonatal
  presentation with purpura fulminans and massive venous thrombosis. Laboratory
  ISTH subtypes are Type I (quantitative), Type II (qualitative/dysfunctional),
  and Type III (selective free-protein-S deficiency).
notes: >-
  Scope: this entry covers PROS1-driven (hereditary) protein S deficiency
  specifically. It is a distinct single-gene Mendelian thrombophilia (THPH5,
  OMIM #612336; the severe autosomal recessive biallelic form is THPH6, OMIM
  #614514) and is deliberately kept separate from the general Thrombophilia
  umbrella entry (kb/disorders/Thrombophilia.yaml), which models the root
  hypercoagulable concept together with the five classic hereditary subtypes
  (factor V Leiden, prothrombin G20210A, and antithrombin, protein C, and
  protein S deficiencies). Acquired protein S deficiency (warfarin, vitamin K
  deficiency, liver disease, nephrotic syndrome, DIC, pregnancy, estrogen
  therapy, SLE, HIV) is mechanistically distinct and is noted here as a
  differential-diagnostic consideration rather than curated as PROS1 disease.
  Neonatal purpura fulminans in the severe biallelic form is managed acutely
  with fresh frozen plasma or protein S-containing plasma concentrate per
  clinical reviews (StatPearls, NORD; tertiary sources, not independently
  verified in this entry's evidence).
disease_term:
  preferred_term: hereditary protein S deficiency
  term:
    id: MONDO:0012868
    label: thrombophilia due to protein S deficiency, autosomal dominant
has_subtypes:
- name: Type I
  display_name: Type I (quantitative deficiency)
  description: >-
    Quantitative deficiency: reduced total protein S antigen, reduced free
    protein S antigen, and reduced protein S functional activity. One of the two
    most commonly encountered phenotypes clinically.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type 1 (quantitative deficiency), characterized by low levels of total protein S (TPS) and free protein S (FPS), along with reduced protein S activity"
    explanation: ISTH classification defining Type I quantitative protein S deficiency.
- name: Type II
  display_name: Type II (qualitative/dysfunctional)
  description: >-
    Qualitative (functional) deficiency: normal total and free protein S
    antigen but decreased protein S functional activity, indicating a
    dysfunctional protein. The rarest of the three subtypes; the Japanese
    founder variant PROS1 p.Lys196Glu ("PS Tokushima") is a classic example.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type 2 (functional deficiency, also known as type 2b), characterized by normal levels of TPS and FPS, but with decreased protein S activity, indicating a functional defect"
    explanation: ISTH classification defining Type II qualitative protein S deficiency.
- name: Type III
  display_name: Type III (selective free-protein-S deficiency)
  description: >-
    Selective free-protein-S deficiency: normal total protein S antigen but
    reduced free protein S antigen and reduced activity, reflecting an abnormal
    partitioning between the free and C4b-binding-protein-bound fractions. Along
    with Type I, one of the two most common phenotypes.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type 3 (selective free protein s deficiency, also known as type 2a), characterized by normal TPS levels but reduced FPS and PS activity"
    explanation: ISTH classification defining Type III selective free-protein-S deficiency.
pathophysiology:
- name: Reduced Protein S Cofactor Activity
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function PROS1 variants reduce the level or function of protein S, a
    hepatocyte-synthesized vitamin K-dependent glycoprotein that is a
    non-enzymatic cofactor for activated protein C (APC) in the inactivation of
    factors Va and VIIIa and, independently, for tissue factor pathway inhibitor
    (TFPI). Reduced free/functional protein S diminishes this anticoagulant
    cofactor activity.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  molecular_functions:
  - preferred_term: enzyme regulator activity
    term:
      id: GO:0030234
      label: enzyme regulator activity
    modifier: DECREASED
  evidence:
  - reference: PMID:42429079
    reference_title: "Protein S: a vitamin K-dependent factor bridging haemostasis, tissue homeostasis and cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein S (PROS1) is a vitamin K-dependent plasma glycoprotein that was originally described as a non-enzymatic cofactor of activated protein C in the regulation of blood coagulation."
    explanation: Establishes the causal gene and the classic non-enzymatic APC-cofactor role of protein S.
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein S enhances the anticoagulant effect of protein C by serving as its cofactor; thus, deficiency in either protein leads to impaired inactivation of factors Va and VIIIa, fostering a prothrombotic state"
    explanation: Directly describes the cofactor mechanism and the prothrombotic consequence of its loss.
  - reference: DOI:10.1182/blood.2019003630
    reference_title: Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within the growing thrombus"
    explanation: Mouse-model evidence for the dual APC/TFPI cofactor mechanism of protein S in limiting thrombin generation.
  downstream:
  - target: Unopposed Thrombin Generation and Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Diminished APC/TFPI cofactor activity allows sustained factor Va/VIIIa and
      factor Xa activity, amplifying thrombin generation.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    causal_link_type: DIRECT
    description: >-
      A deficient protein S baseline makes the transient post-warfarin fall in
      protein S (and protein C) activity proportionally more severe on
      initiation of a vitamin K antagonist.

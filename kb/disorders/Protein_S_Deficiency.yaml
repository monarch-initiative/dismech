diagnosis:
- name: "Protein S Deficiency: Free Antigen and Functional Activity Assay"
  description: >-
    Protein S functional activity is assessed by its ability to act as an APC
    cofactor in inactivating factors Va and VIIIa; free and total protein S
    antigen are measured separately by immunoassay. Free protein S antigen is
    the most reliable screen because it reflects the functionally active,
    non-C4BP-bound fraction; total antigen detects Type I but not Type II or III.
    Reference ranges are sex-, age-, and pregnancy-dependent (women have lower
    total and free protein S than men; total protein S rises with age), so
    results must be interpreted against stratified ranges and repeated outside
    pregnancy, hormonal therapy, acute thrombosis, and anticoagulation. Factor V
    Leiden can cause falsely low functional protein S in older clot-based assays.
  diagnosis_term:
    preferred_term: coagulation study
    term:
      id: NCIT:C62662
      label: Coagulation Study
  results: Reduced free and/or total protein S antigen, or reduced protein S functional activity with normal antigen (Type II/III).
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PS functional activity assays measure the biological activity of PS by assessing its ability to function as a cofactor for APC in the inactivation of FVa and FVIIIa."
    explanation: Directly describes the functional-cofactor basis of the protein S activity assay.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, women generally have lower total and free protein S levels than men. Total PS levels increase with age, particularly in women, due to hormonal variations, whereas free PS levels remain stable over time."
    explanation: Establishes the sex- and age-dependence of protein S reference ranges.
treatments:
- name: Long-Term Anticoagulation with Heparin-Bridged Initiation
  description: >-
    Anticoagulation (a vitamin K antagonist such as warfarin, or a direct oral
    anticoagulant such as rivaroxaban) reduces the risk of recurrent venous
    thromboembolism; duration is individualized to recurrence versus bleeding
    risk. When warfarin is used, initiation should be bridged with heparin and
    avoid high loading doses, because unbridged warfarin can precipitate
    warfarin-induced skin necrosis in protein S (or protein C) deficiency. Direct
    oral anticoagulants avoid this mechanism and are an alternative, including in
    severe deficiency with recurrent warfarin necrosis.
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Unopposed Thrombin Generation and Fibrin Formation
    treatment_effect: INHIBITS
    description: >-
      Vitamin K antagonism or direct factor Xa inhibition suppresses ongoing
      coagulation-cascade activation, reducing the risk of recurrent thrombosis.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    treatment_effect: BYPASSES
    description: >-
      Heparin bridging during warfarin initiation, or use of a direct oral
      anticoagulant instead of warfarin, avoids the transient protein C/S
      depletion window that can precipitate skin necrosis.
  evidence:
  - reference: PMID:24144709
    reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The switch of anticoagulant therapy from warfarin to rivaroxaban, a direct inhibitor of activated factor X that does not inhibit other vitamin K-dependent proteins, resulted in the disappearance of skin necrosis at 1 year of follow-up."
    explanation: Documents a direct oral anticoagulant as an effective alternative avoiding warfarin-induced skin necrosis in severe protein S deficiency.
  - reference: PMID:24144709
    reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rivaroxaban may be considered as a valid anticoagulant alternative in patients with severe inherited protein S deficiency and warfarin-induced skin necrosis."
    explanation: States the therapeutic recommendation for a direct oral anticoagulant in this setting.

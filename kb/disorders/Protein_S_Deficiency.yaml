animal_models:
- name: Platelet-specific Pros1 knockout mouse (Pros1lox/loxPf4-Cre+)
  species: Mouse
  genotype: Pros1lox/loxPf4-Cre+ (platelet lineage-restricted Pros1 deletion via Platelet factor 4-Cre)
  publication: DOI:10.1182/blood.2019003630
  description: >-
    A conditional knockout that eliminates protein S expression specifically in
    platelets (and their megakaryocyte precursors) while sparing the systemic,
    largely hepatocyte-derived plasma protein S pool.
  modeled_mechanisms:
  - target: Reduced Protein S Cofactor Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of platelet-derived protein S increases venous thrombus propensity by
      impairing its cofactor role for APC and TFPI, limiting factor X activation
      and thrombin generation within the growing thrombus at low shear rates. It
      does not increase arterial thrombosis propensity, unlike systemic human
      deficiency.
    limitations: >-
      This model isolates only the platelet-derived pool of protein S via a
      platelet-lineage-restricted knockout; it does not reproduce the systemic
      (predominantly hepatocyte-synthesized) protein S deficiency that defines
      the human hereditary disorder, so its venous-versus-arterial selectivity
      may not generalize to human global protein S deficiency.
    readouts:
    - name: Venous (vena cava) thrombus propensity
      target: Reduced Protein S Cofactor Activity
      direction: INCREASED
      interpretation: >-
        Platelet protein S loss increases thrombus formation at low shear (vena
        cava) but not at high shear (carotid artery), consistent with a cofactor
        role for APC/TFPI-mediated factor X control within the growing venous
        thrombus.
      evidence:
      - reference: DOI:10.1182/blood.2019003630
        reference_title: "Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "inactivation of PSplt expression using the Platelet factor 4 (Pf4)-Cre transgene (Pros1lox/loxPf4-Cre+) in mice promotes thrombus propensity in the vena cava, where shear rates are low, but not in the carotid artery, where shear rates are high"
        explanation: Directly reports the venous-specific thrombus-propensity phenotype of the platelet Pros1 knockout mouse.
  evidence:
  - reference: DOI:10.1182/blood.2019003630
    reference_title: "Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within the growing thrombus"
    explanation: >-
      Establishes the mechanistic role of protein S as an APC/TFPI cofactor
      limiting thrombin generation, informative for the reduced-cofactor node
      even though it isolates only the platelet-derived pool.
discussions:
- discussion_id: ps_cofactor_pathway_partition
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Protein S Cofactor Activity
  prompt: >-
    How much of protein S's in vivo anticoagulant effect in human hereditary
    deficiency is mediated through the APC-cofactor pathway versus the
    APC-independent TFPI-cofactor pathway, and does this partition differ across
    Type I/II/III subtypes and disease severity?
  rationale: >-
    Protein S has two mechanistically distinct anticoagulant cofactor roles (APC
    and TFPI). Mouse and biochemical data show both matter, and the Japanese
    p.Lys196Glu variant dissociates them (reduced APC-cofactor but preserved
    TFPI-cofactor activity), but the relative contribution in human hereditary
    deficiency and its subtype dependence is not resolved.

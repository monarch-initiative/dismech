name: Protein S Deficiency
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- hereditary protein S deficiency
- congenital protein S deficiency
- PROS1-related thrombophilia
- THPH5
- thrombophilia due to protein S deficiency, autosomal dominant
parents:
- Thrombophilia
description: >-
  A single-gene hereditary thrombophilia caused by loss-of-function variants in
  PROS1, the gene encoding protein S. Protein S is a vitamin K-dependent plasma
  glycoprotein that acts as a non-enzymatic cofactor for activated protein C
  (APC) in the proteolytic inactivation of coagulation factors Va and VIIIa, and,
  independently of APC, as a cofactor for tissue factor pathway inhibitor (TFPI).
  Roughly 60% of circulating protein S is bound to C4b-binding protein and is
  anticoagulantly inactive; only the free fraction (~40%) is functionally active.
  Reduced free/functional protein S weakens down-regulation of the coagulation
  cascade, favoring unopposed thrombin generation and predisposing to venous
  thromboembolism (deep vein thrombosis and pulmonary embolism). The common
  heterozygous form is autosomal dominant with incomplete penetrance; biallelic
  (homozygous or compound heterozygous) deficiency causes a severe neonatal
  presentation with purpura fulminans and massive venous thrombosis. Laboratory
  ISTH subtypes are Type I (quantitative), Type II (qualitative/dysfunctional),
  and Type III (selective free-protein-S deficiency).
notes: >-
  Scope: this entry covers PROS1-driven (hereditary) protein S deficiency
  specifically. It is a distinct single-gene Mendelian thrombophilia (THPH5,
  OMIM #612336; the severe autosomal recessive biallelic form is THPH6, OMIM
  #614514) and is deliberately kept separate from the general Thrombophilia
  umbrella entry (kb/disorders/Thrombophilia.yaml), which models the root
  hypercoagulable concept together with the five classic hereditary subtypes
  (factor V Leiden, prothrombin G20210A, and antithrombin, protein C, and
  protein S deficiencies). Acquired protein S deficiency (warfarin, vitamin K
  deficiency, liver disease, nephrotic syndrome, DIC, pregnancy, estrogen
  therapy, SLE, HIV) is mechanistically distinct and is noted here as a
  differential-diagnostic consideration rather than curated as PROS1 disease.
  Neonatal purpura fulminans in the severe biallelic form is managed acutely
  with fresh frozen plasma or protein S-containing plasma concentrate per
  clinical reviews (StatPearls, NORD; tertiary sources, not independently
  verified in this entry's evidence).

  MONDO scope: disease_term is MONDO:0012868 (the autosomal dominant form,
  THPH5). The entry also curates the severe biallelic form, so
  MONDO:0013791 (thrombophilia due to protein S deficiency, autosomal
  recessive; THPH6) is carried in mappings.mondo_mappings at
  skos:narrowMatch to retire that concept from the curation queue rather than
  leaving it unanchored. The broader parent concept MONDO:0019144 (hereditary
  thrombophilia due to congenital protein S deficiency) is deliberately NOT
  reused as disease_term here because it is already the subtype_term of the
  Protein S Deficiency subtype in kb/disorders/Thrombophilia.yaml; keeping the
  AD leaf as this entry's anchor and mapping the AR leaf avoids the two files
  silently claiming overlapping ontology scope.
disease_term:
  preferred_term: hereditary protein S deficiency
  term:
    id: MONDO:0012868
    label: thrombophilia due to protein S deficiency, autosomal dominant
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013791
      label: thrombophilia due to protein S deficiency, autosomal recessive
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      The severe biallelic form (THPH6, OMIM #614514) is curated within this
      entry (AR inheritance block, Neonatal Purpura Fulminans, homozygous-patient
      evidence). Mapped at narrowMatch so the AR MONDO leaf is anchored and
      retired from the curation queue while the AD leaf remains the primary
      disease_term.
has_subtypes:
- name: Type I
  display_name: Type I (quantitative deficiency)
  description: >-
    Quantitative deficiency: reduced total protein S antigen, reduced free
    protein S antigen, and reduced protein S functional activity. One of the two
    most commonly encountered phenotypes clinically.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type 1 (quantitative deficiency), characterized by low levels of total protein S (TPS) and free protein S (FPS), along with reduced protein S activity"
    explanation: ISTH classification defining Type I quantitative protein S deficiency.
- name: Type II
  display_name: Type II (qualitative/dysfunctional)
  description: >-
    Qualitative (functional) deficiency: normal total and free protein S
    antigen but decreased protein S functional activity, indicating a
    dysfunctional protein. The rarest of the three subtypes; the Japanese
    founder variant PROS1 p.Lys196Glu ("PS Tokushima") is a classic example.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type 2 (functional deficiency, also known as type 2b), characterized by normal levels of TPS and FPS, but with decreased protein S activity, indicating a functional defect"
    explanation: ISTH classification defining Type II qualitative protein S deficiency.
- name: Type III
  display_name: Type III (selective free-protein-S deficiency)
  description: >-
    Selective free-protein-S deficiency: normal total protein S antigen but
    reduced free protein S antigen and reduced activity, reflecting an abnormal
    partitioning between the free and C4b-binding-protein-bound fractions. Along
    with Type I, one of the two most common phenotypes.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type 3 (selective free protein s deficiency, also known as type 2a), characterized by normal TPS levels but reduced FPS and PS activity"
    explanation: ISTH classification defining Type III selective free-protein-S deficiency.
- name: Severe AR
  display_name: Severe Autosomal Recessive (Biallelic) Deficiency
  description: >-
    The severe biallelic (homozygous or compound heterozygous) form (THPH6,
    OMIM #614514, MONDO:0013791). In contrast to the common heterozygous
    autosomal dominant form, near-total loss of protein S activity presents in
    the neonatal period with purpura fulminans - disseminated microvascular
    thrombosis with hemorrhagic skin necrosis - and massive venous thrombosis.
    This clinical AD-mild / AR-severe axis is orthogonal to the ISTH laboratory
    Types I/II/III above.
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous mutation presents with thrombotic events in early infancy and is often life-threatening"
    explanation: Defines the severe biallelic form as an early-infancy, life-threatening entity distinct from the mild heterozygous form.
pathophysiology:
- name: Reduced Protein S Cofactor Activity
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function PROS1 variants reduce the level or function of protein S, a
    hepatocyte-synthesized vitamin K-dependent glycoprotein that is a
    non-enzymatic cofactor for activated protein C (APC) in the inactivation of
    factors Va and VIIIa and, independently, for tissue factor pathway inhibitor
    (TFPI). Reduced free/functional protein S diminishes this anticoagulant
    cofactor activity.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  molecular_functions:
  - preferred_term: APC anticoagulant cofactor (enzyme activator) activity
    term:
      id: GO:0008047
      label: enzyme activator activity
    modifier: DECREASED
  evidence:
  - reference: PMID:42429079
    reference_title: "Protein S: a vitamin K-dependent factor bridging haemostasis, tissue homeostasis and cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein S (PROS1) is a vitamin K-dependent plasma glycoprotein that was originally described as a non-enzymatic cofactor of activated protein C in the regulation of blood coagulation."
    explanation: Establishes the causal gene and the classic non-enzymatic APC-cofactor role of protein S.
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein S enhances the anticoagulant effect of protein C by serving as its cofactor; thus, deficiency in either protein leads to impaired inactivation of factors Va and VIIIa, fostering a prothrombotic state"
    explanation: Directly describes the cofactor mechanism and the prothrombotic consequence of its loss.
  - reference: DOI:10.1182/blood.2019003630
    reference_title: Platelet protein S limits venous but not arterial thrombosis propensity by controlling coagulation in the thrombus
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within the growing thrombus"
    explanation: Mouse-model evidence for the dual APC/TFPI cofactor mechanism of protein S in limiting thrombin generation.
  downstream:
  - target: Unopposed Thrombin Generation and Fibrin Formation
    causal_link_type: DIRECT
    description: >-
      Diminished APC/TFPI cofactor activity allows sustained factor Va/VIIIa and
      factor Xa activity, amplifying thrombin generation.
  - target: Reduced Protein S Activity
    causal_link_type: DIRECT
    description: >-
      Reduced protein S cofactor function is measured directly as reduced protein
      S functional (APC-cofactor) activity - the diagnostic laboratory readout of
      this molecular defect.
    evidence:
    - reference: PMID:40429442
      reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PS functional activity assays measure the biological activity of PS by assessing its ability to function as a cofactor for APC in the inactivation of FVa and FVIIIa."
      explanation: The functional activity assay reads out the reduced APC-cofactor activity of this molecular node.
  - target: Warfarin-Induced Transient Anticoagulant Depletion
    causal_link_type: DIRECT
    description: >-
      A deficient protein S baseline makes the transient post-warfarin fall in
      protein S (and protein C) activity proportionally more severe on
      initiation of a vitamin K antagonist.
- name: Unopposed Thrombin Generation and Fibrin Formation
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation"
  description: >-
    With natural anticoagulant down-regulation weakened, the coagulation cascade
    proceeds toward unchecked thrombin generation and thrombin-driven conversion
    of fibrinogen into an insoluble fibrin network.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  - preferred_term: fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:41180656
    reference_title: "Warfarin-induced skin necrosis: a narrative review of clinical features, risk factors, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein C and protein S are vitamin K-dependent glycoproteins that function as critical anticoagulants by regulating the coagulation cascade."
    explanation: Establishes protein S as a critical anticoagulant regulator whose loss releases coagulation-cascade activity.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The coagulation cascade, composed of intrinsic and extrinsic pathways, culminates in the activation of thrombin, which converts fibrinogen to fibrin"
    explanation: Describes the thrombin-driven fibrin-formation step that this node represents.
  downstream:
  - target: Venous Thrombus Formation
    causal_link_type: DIRECT
    description: >-
      Excess thrombin and fibrin, particularly under the low-shear conditions of
      venous flow, drive pathological venous thrombus formation.
  - target: Disseminated Microvascular Thrombosis
    causal_link_type: DIRECT
    description: >-
      In severe biallelic deficiency the near-total loss of anticoagulant control
      drives widespread small-vessel (microvascular) fibrin thrombosis, distinct
      from the large-vein thrombus of the common heterozygous form.
    evidence:
    - reference: PMID:24144709
      reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She developed purpura fulminans at birth and a catheter-related venous thrombosis complicated by massive pulmonary embolism at the sixth day of life."
      explanation: Documents the disseminated microvascular thrombosis (purpura fulminans) of severe biallelic deficiency, a distinct downstream branch from large-vein thrombus.
- name: Venous Thrombus Formation
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  description: >-
    Formation of a pathological intravascular fibrin-platelet thrombus, most
    often in the deep veins of the lower extremities, which may propagate or
    embolize to the pulmonary arteries.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A deficiency in PS disrupts normal coagulation control, leading to an increased risk of thrombophilia and VTE due to an excessive blood clot formation"
    explanation: Directly links reduced protein S to excessive clot formation and venous thromboembolism.
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fibrin serves as the structural framework of the thrombus, stabilizing platelet aggregates and incorporating red blood cells."
    explanation: Describes the fibrin-platelet composition of the thrombus this node represents.
  downstream:
  - target: Deep venous thrombosis
    causal_link_type: DIRECT
    description: A lower-extremity deep venous thrombus is the most common clinical manifestation.
  - target: Pulmonary embolism
    causal_link_type: DIRECT
    description: A venous thrombus may dislodge and embolize to the pulmonary arteries.
  - target: Superficial thrombophlebitis
    causal_link_type: DIRECT
    description: >-
      Superficial-vein thrombosis (thrombophlebitis) is a frequent parallel
      venous manifestation of the same hypercoagulable state, second in frequency
      only to deep venous thrombosis among symptomatic carriers.
    evidence:
    - reference: PMID:2952034
      reference_title: "Hereditary protein S deficiency: clinical manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most symptomatic patients had various combinations of deep venous thrombosis (74%), superficial thrombophlebitis (72%), and pulmonary embolism (38%)"
      explanation: Documents superficial thrombophlebitis as a high-frequency venous manifestation in hereditary protein S deficiency.
- name: Disseminated Microvascular Thrombosis
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Widespread small-vessel (microvascular) fibrin thrombosis of the skin and
    other tissues in severe biallelic protein S deficiency, the lesion
    underlying neonatal purpura fulminans. Distinct from the large-vein
    fibrin-platelet thrombus of the common heterozygous form.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
    modifier: INCREASED
  evidence:
  - reference: PMID:40429442
    reference_title: "From Circulating Biomarkers to Polymorphic Variants: A Narrative Review of Challenges in Thrombophilia Evaluation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous mutation presents with thrombotic events in early infancy and is often life-threatening"
    explanation: Establishes the severe, early-onset thrombotic process of biallelic deficiency that manifests as microvascular purpura fulminans.
  downstream:
  - target: Neonatal Purpura Fulminans
    causal_link_type: DIRECT
    description: >-
      Disseminated microvascular thrombosis produces the hemorrhagic skin
      necrosis of neonatal purpura fulminans.
    evidence:
    - reference: PMID:24144709
      reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a case of a 6-year-old girl with severe protein S deficiency due to a homozygous mutation and recurrent episodes of skin necrosis. She developed purpura fulminans at birth"
      explanation: Links the microvascular thrombotic process of severe deficiency to the purpura fulminans / skin necrosis phenotype.
- name: Warfarin-Induced Transient Anticoagulant Depletion
  role: modifier
  biological_scale: MOLECULAR
  description: >-
    Because protein S (and protein C) have short plasma half-lives relative to
    the procoagulant vitamin K-dependent factors, initiating a vitamin K
    antagonist transiently deepens the anticoagulant deficit before procoagulant
    factors fall, producing a brief hypercoagulable window that can precipitate
    microvascular skin necrosis in an already-deficient patient.
  biological_processes:
  - preferred_term: negative regulation of blood coagulation
    term:
      id: GO:0030195
      label: negative regulation of blood coagulation
    modifier: DECREASED
  evidence:
  - reference: PMID:9885367
    reference_title: "Recurrent warfarin-induced skin necrosis in kindreds with protein S deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coumarin skin necrosis occurs almost exclusively in patients with venous thrombosis between the 3rd and 10th day after beginning anticoagulation."
    explanation: Establishes the early-initiation timing window of the warfarin-induced hypercoagulable state.
  - reference: PMID:24144709
    reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitamin K antagonists decrease plasma level of vitamin K-dependent coagulation proteins, including the natural anticoagulant protein C."
    explanation: Documents the vitamin K antagonist-driven fall in natural anticoagulants underlying this node.
  downstream:
  - target: Warfarin-Induced Skin Necrosis
    causal_link_type: DIRECT
    description: >-
      The transient hypercoagulable window drives microvascular thrombosis of
      the skin and subcutaneous fat.
phenotypes:
- name: Deep venous thrombosis
  category: Physical
  phenotype_term:
    preferred_term: Deep venous thrombosis
    term:
      id: HP:0002625
      label: Deep venous thrombosis
  frequency: Most common manifestation; ~74% of symptomatic carriers in the classic family series.
  description: >-
    Deep vein thrombosis, typically of the lower extremities, is the most common
    clinical manifestation of hereditary protein S deficiency. (About half of
    heterozygous carriers develop venous thromboembolism overall over their
    lifetime - a composite VTE endpoint stated at the disease level in the
    inheritance block.)
  evidence:
  - reference: PMID:2952034
    reference_title: "Hereditary protein S deficiency: clinical manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most symptomatic patients had various combinations of deep venous thrombosis (74%), superficial thrombophlebitis (72%), and pulmonary embolism (38%)"
    explanation: Quantifies deep venous thrombosis as the most frequent manifestation among symptomatic carriers.
- name: Superficial thrombophlebitis
  category: Physical
  phenotype_term:
    preferred_term: Superficial thrombophlebitis
    term:
      id: HP:0002638
      label: Superficial thrombophlebitis
  frequency: ~72% of symptomatic carriers in the classic family series; second only to deep venous thrombosis.
  description: >-
    Superficial-vein thrombophlebitis is a frequent venous manifestation of
    hereditary protein S deficiency, second in frequency only to deep venous
    thrombosis among symptomatic carriers.
  evidence:
  - reference: PMID:2952034
    reference_title: "Hereditary protein S deficiency: clinical manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most symptomatic patients had various combinations of deep venous thrombosis (74%), superficial thrombophlebitis (72%), and pulmonary embolism (38%)"
    explanation: Quantifies superficial thrombophlebitis frequency among symptomatic protein S-deficient patients.
- name: Pulmonary embolism
  category: Physical
  phenotype_term:
    preferred_term: Pulmonary embolism
    term:
      id: HP:0002204
      label: Pulmonary embolism
  description: >-
    Pulmonary embolism results from embolization of a venous thrombus and can be
    life-threatening, including in the severe neonatal form.
  evidence:
  - reference: PMID:24144709
    reference_title: Anticoagulant treatment with rivaroxaban in severe protein S deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She developed purpura fulminans at birth and a catheter-related venous thrombosis complicated by massive pulmonary embolism at the sixth day of life."
    explanation: Documents massive pulmonary embolism in a patient with severe (homozygous) protein S deficiency.
- name: Neonatal Purpura Fulminans
  category: Physical
  subtype: Severe AR
  phenotype_term:
    preferred_term: Neonatal purpura fulminans
    term:
      id: HP:0000979
      label: Purpura
  description: >-
    Severe biallelic (homozygous or compound heterozygous) protein S deficiency
    presents in the neonatal period with purpura fulminans - widespread

differential_diagnoses:
- name: LCAT deficiency and fish-eye disease
  description: Inherited severe HDL deficiency with prominent corneal disease; complete LCAT deficiency can include renal disease.
  distinguishing_features:
  - ABCA1 testing, the orange-tonsil/neuropathy pattern and assessment of LCAT deficiency help distinguish these conditions.
  evidence:
  - reference: PMID:33994407
    reference_title: Current Diagnosis and Management of Tangier Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LCAT deficiency, apoA-I deficiency and secondary hypo-HDL-cholesterolemia
    explanation: >-
      The diagnostic criteria require exclusion of alternative causes of severe HDL deficiency.
- name: Apolipoprotein A-I deficiency
  description: APOA1-related severe HDL/apoA-I deficiency is an alternative inherited cause of low HDL.
  distinguishing_features:
  - Evaluate APOA1 and the clinical pattern rather than diagnosing Tangier disease from HDL concentration alone.
  evidence:
  - reference: PMID:33994407
    reference_title: Current Diagnosis and Management of Tangier Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LCAT deficiency, apoA-I deficiency and secondary hypo-HDL-cholesterolemia
    explanation: >-
      The diagnostic criteria require exclusion of alternative causes of severe HDL deficiency.
- name: Secondary severe HDL deficiency
  description: Severe liver disease and drug effects can produce marked HDL reduction.
  distinguishing_features:
  - Review liver disease and medication history before attributing low HDL to ABCA1 deficiency.
  evidence:
  - reference: PMID:33994407
    reference_title: Current Diagnosis and Management of Tangier Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Care should be taken to exclude secondary hypo-HDL-cholesterolemia, such as in severe liver diseases, especially liver cirrhosis, and drug-induced hypo-HDL-cholesterolemia
    explanation: >-
      The management review describes acquired biochemical phenocopies.

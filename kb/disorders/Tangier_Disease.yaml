mechanistic_hypotheses:
- hypothesis_group_id: canonical_abca1_hdl_efflux_model
  hypothesis_label: Canonical ABCA1 HDL Efflux Model
  status: CANONICAL
  description: >
    Biallelic ABCA1 pathogenic variants impair apolipoprotein-mediated
    phospholipid and cholesterol efflux, blocking nascent HDL formation.
    Cellular cholesterol export falls in macrophages, Schwann cells, and other
    peripheral cells, leading to cholesteryl ester storage in tissues and a
    combination of reticuloendothelial, neurologic, biochemical, and vascular
    manifestations.
  notes: >-
    Retain CANONICAL for ABCA1 loss and impaired lipid efflux. The OpenScientist report is assessed in assessments/openscientist-assessment-by-codex.yaml beside the report. Human inflammasome-associated cytokines, experimental membrane signaling, sphingolipid depletion, platelet defects, and impaired insulin secretion extend the model with different evidence strengths. NLRP3/NETosis causality primarily comes from combined Abca1/Abcg1-deficient mice; plasma S1P loss was demonstrated in hepatic knockout mice, while one Tangier patient had low total sphingolipids. Neither establishes the quantitative clinical contribution. PMP22 interaction and HSPC expansion require disease/context qualifications. The report missed an existing miglustat n-of-1 trial and GenCC assertions.
  evidence:
  - reference: PMID:33994407
    reference_title: "Current Diagnosis and Management of Tangier Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by a dysfunctional mutation of the ATP-binding cassette transporter A1 (ABCA1) gene, the mandatory gene for generation of HDL particles from cellular cholesterol and phospholipids, and it appears in an autosomal recessive hereditary profile."
    explanation: This review links ABCA1 to HDL particle generation from cellular lipid export.
  - reference: PMID:33994407
    reference_title: "Current Diagnosis and Management of Tangier Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cholesterol therefore accumulates in these cells, causing orange-colored pharyngeal tonsillar swelling, corneal opacity, hepatosplenomegaly, lymphadenopathy and peripheral neuropathy."
    explanation: This review summarizes the downstream tissue-storage phenotype.
  - reference: PMID:28602350
    reference_title: "Structure of the Human Lipid Exporter ABCA1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations of human ABCA1 are associated with Tangier disease and familial HDL deficiency."
    explanation: >
      Cryo-EM structural biology directly connects ABCA1 to Tangier disease
      and provides an atomic-resolution framework for interpreting the
      diverse mutations that cause loss of cholesterol/phospholipid efflux.
  - reference: PMID:40617357
    reference_title: "Functional characterization of genetic variants affecting the intracellular domains of ATP-binding cassette transporter A1 (ABCA1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we have characterized 74 variants affecting the intracellular domains of ABCA1 by assessing cholesterol efflux activity"
    explanation: >
      Large-scale in vitro variant characterization shows that cholesterol
      efflux activity stratifies ABCA1 variants by pathogenicity, providing
      functional support for efflux failure as the canonical mechanism.
  - reference: PMID:20418488
    reference_title: "A functional ABCA1 gene variant is associated with low HDL-cholesterol levels and shows evidence of positive selection in Native Americans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells expressing the C230 allele showed a 27% cholesterol efflux reduction (P< 0.001)"
    explanation: >-
      Common R230C variation supports an efflux/HDL relationship in populations; it is not proof that this allele causes recessive Tangier disease.
  - reference: PMID:12771001
    reference_title: "Restoration of endothelial function by increasing high-density lipoprotein in subjects with isolated low high-density lipoprotein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infusion of apoA-I/PC disks increased plasma HDL to 1.3+/-0.4 mmol/L in ABCA1 heterozygotes, which resulted in"
    explanation: >-
      Acute infusion improved endothelial responses in nine ABCA1 heterozygotes. This is physiological evidence in carriers, not demonstrated treatment efficacy for biallelic Tangier disease or long-term clinical events.
  - reference: PMID:29588315
    reference_title: "Cholesterol Efflux Pathways Suppress Inflammasome Activation, NETosis, and Atherogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with Tangier disease, who have increased myeloid cholesterol content, showed markers of inflammasome activation"
    explanation: >-
      Tangier plasma IL-1β and IL-18 elevations support inflammasome relevance. NLRP3-specific perturbation and plaque NETosis evidence came from combined myeloid Abca1/Abcg1-deficient mice, not a human intervention.
  - reference: PMID:37601634
    reference_title: "Hepatocyte ABCA1 deficiency is associated with reduced HDL sphingolipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "drastic reduction of total SL levels in plasma of a Tangier patient with compound heterozygosity for mutations in ABCA1"
    explanation: >-
      One Tangier patient had reduced total plasma sphingolipids. ApoM/S1P reduction was measured in hepatic Abca1 knockout mice; human S1P-specific depletion and clinical mediation are not established by this observation.
  - reference: PMID:38979632
    reference_title: "Roles for PMP22 in Schwann cell cholesterol homeostasis in health and disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PMP22 and ABCA1 in cholesterol efflux"
    explanation: >-
      This review motivates a Schwann-cell mechanism. Primary mouse/Schwann-cell experiments demonstrate reciprocal PMP22/ABCA1 trafficking abnormalities; their contribution to human neuropathy remains unquantified.
  - reference: PMID:11950702
    reference_title: "Increased atherosclerosis in hyperlipidemic mice with inactivation of ABCA1 in macrophages."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the selective inactivation of ABCA1 in macrophages markedly increased atherosclerosis and foam cell accumulation"
    explanation: >
      Qualifies the cardiovascular component of the canonical model by
      dissecting macrophage-specific from total-body ABCA1 loss; total ABCA1
      knockout did not accelerate atherosclerosis owing to concurrent LDL
      reduction, whereas macrophage-specific loss did.
  - reference: PMID:29582519
    reference_title: "Peripheral neuropathy in Tangier disease: A literature review and assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Syringomyelia-like neuropathy subtype (52.4%) was more frequent than multifocal sensorial and motor neuropathy subtype (26.2%)"
    explanation: >-
      A selected review of 54 patients with neuropathy supports four patterns; subtype percentages cannot be generalized to all Tangier patients.
- hypothesis_group_id: inflammatory_amplification
  hypothesis_label: Inflammasome and membrane signaling amplify the efflux defect
  status: EMERGING
  description: >-
    Macrophage free-cholesterol accumulation enhances inflammatory signaling. NLRP3/NETosis intervention evidence comes mainly from combined Abca1/Abcg1-deficient hyperlipidemic mice; Tangier patient plasma cytokines provide clinical relevance without proving the whole chain.
  evidence:
  - reference: PMID:29588315
    reference_title: Cholesterol Efflux Pathways Suppress Inflammasome Activation, NETosis, and Atherogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with Tangier disease, who carry loss-of-function mutations in ABCA1 and have increased myeloid cholesterol content, showed a marked increase in plasma IL-1β and IL-18 levels.
    explanation: >-
      Human cytokine observations support relevance but do not prove NLRP3 specificity, NETosis, or therapeutic response.
  - reference: PMID:29588315
    reference_title: Cholesterol Efflux Pathways Suppress Inflammasome Activation, NETosis, and Atherogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Nlrp3 or Caspase-1/11 deficiency decreased atherosclerotic lesion size in myeloid Abca1/g1-deficient Ldlr-/- mice.
    explanation: >-
      Genetic intervention supports an inflammasome contribution in a combined-transporter and hyperlipidemic mouse model.
- hypothesis_group_id: schwann_lipid_protein_homeostasis
  hypothesis_label: Schwann-cell lipid and PMP22 homeostasis
  status: EMERGING
  description: >-
    Reciprocal ABCA1/PMP22 interactions couple lipid trafficking to peripheral myelin protein processing. Mouse and Schwann-cell experiments support this extension, while human clinical severity and allele-specific mediation remain unresolved.
  evidence:
  - reference: PMID:31061090
    reference_title: PMP22 Regulates Cholesterol Trafficking and ABCA1-Mediated Cholesterol Efflux.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In nerves from ABCA1 KO mice, the expression of PMP22 was significantly elevated and the subcellular processing of the overproduced protein was aberrant.
    explanation: >-
      Primary Abca1-null nerve experiments support altered PMP22 processing; human variant-specific clinical causation remains unresolved.
pathophysiology:
- name: ABCA1 Dysfunction
  description: >
    Disease-causing germline ABCA1 variants impair the ATP-binding cassette
    transporter required for apolipoprotein-mediated cellular lipid export.
    Human genetic studies identified ABCA1 mutations in Tangier disease kindreds,
    and cell-based studies show that ABCA1 promotes phospholipid and cholesterol
    efflux by loading apoA-I with lipids.

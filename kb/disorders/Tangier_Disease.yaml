- name: Impaired HDL Biogenesis
  description: >-
    Impaired ABCA1-dependent apoA-I lipidation reduces nascent HDL production. Reduced circulating HDL is a systemic consequence; cellular storage is also driven directly by deficient local export and should not be attributed to low HDL concentration alone. Rapid apoA-I catabolism further contributes to the low circulating apolipoprotein concentration.

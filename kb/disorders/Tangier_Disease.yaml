    explanation: In vitro evidence supports ABCA1 as a transporter involved in apoA-I lipid loading.
  downstream:
  - target: Impaired Cellular Lipid Efflux
    description: >-
      Loss of functional ABCA1 reduces apolipoprotein-mediated lipid export.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10525055
      reference_title: The Tangier disease gene product ABC1 controls the cellular apolipoprotein-mediated lipid removal pathway.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Blocking the expression or activity of ABC1 reduces apolipoprotein-mediated lipid efflux from cultured cells, and increasing expression of ABC1 enhances it.
      explanation: >-
        Bidirectional expression/activity perturbations establish the proximal cellular efflux defect.
  - target: Platelet Dense-Granule Maturation Defect
    description: >-
      ABCA1 deficiency perturbs platelet granule maturation; specific intervening membrane-trafficking steps remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15163665
      reference_title: Impaired platelet activation in familial high density lipoprotein deficiency (Tangier disease).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The electron microscopy of Tangier platelets revealed reduced numbers of dense bodies and the presence of giant granules typically encountered in platelets from Chediak-Higashi syndrome.
      explanation: >-
        Patient platelet ultrastructure identifies a dense-granule maturation abnormality; the detailed lipid-to-organelle mechanism is unresolved.
  - target: Impaired Glucose-Stimulated Insulin Secretion
    description: >-
      ABCA1 deficiency associates with impaired insulin release; beta-cell cholesterol handling is a candidate intermediary, not directly measured in the four-patient OGTT study.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19556721
      reference_title: Impaired insulin secretion in four Tangier disease patients with ABCA1 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The calculated insulinogenic index was significantly lower in TD patients than in non-diabetic controls (0.055+/-0.034 vs 0.775+/-0.538, mean+/-SD, p<0.05, respectively).
      explanation: >-
        Four Japanese patients underwent OGTT; impaired insulin response is supported, but universal diabetes or prevalence cannot be inferred.
  - target: Abnormal PMP22 Processing
    description: >-
      Abca1 deletion in mice changes PMP22 abundance and maturation in peripheral nerves.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31061090

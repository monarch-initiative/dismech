discussions:
- discussion_id: context_limits
  kind: KNOWLEDGE_GAP
  prompt: Which experimental extensions of ABCA1 dysfunction determine human clinical severity?
  attaches_to:
  - pathophysiology#Impaired Cellular Lipid Efflux
  - pathophysiology#Myeloid Inflammasome Activation
  - pathophysiology#Peripheral Nerve Dysfunction
  - pathophysiology#Abnormal PMP22 Processing
  rationale: >-
    Human S1P signaling effects remain unquantified; one Tangier plasma sample established low total sphingolipids, while apoM/S1P results came from hepatic knockout mice. PMP22/ABCA1 interactions support nerve-cell lipid homeostasis but do not prove that disrupted binding explains all neuropathy. HSPC myeloproliferation cited by OpenScientist arose in rheumatoid-arthritis models with multiple altered efflux genes and remains untested in Tangier patients. These are mechanistic leads rather than established universal clinical branches.
  evidence:
  - reference: PMID:37601634
    reference_title: Hepatocyte ABCA1 deficiency is associated with reduced HDL sphingolipids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we report a drastic reduction of total SL levels in plasma of a Tangier patient with compound heterozygosity for mutations in ABCA1.
    explanation: >-
      One-patient plasma lipidomics supports sphingolipid depletion; S1P-specific reduction in this paper was shown in hepatic knockout mice.
  - reference: PMID:31061090
    reference_title: PMP22 Regulates Cholesterol Trafficking and ABCA1-Mediated Cholesterol Efflux.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In nerves from ABCA1 KO mice, the expression of PMP22 was significantly elevated and the subcellular processing of the overproduced protein was aberrant.
    explanation: >-
      Primary Abca1-null nerve experiments support altered PMP22 processing; human variant-specific clinical causation remains unresolved.
  - reference: PMID:29905812
    reference_title: Defective cholesterol metabolism in haematopoietic stem cells promotes monocyte-driven atherosclerosis in rheumatoid arthritis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: HSPCs expansion was associated with an increase in the cholesterol content, due to a down-regulation of cholesterol efflux genes, Apoe, Abca1, and Abcg1.
    explanation: >-
      The RA model includes several downregulated efflux genes and is not direct Tangier HSPC evidence.
- discussion_id: unresolved_distal_manifestations
  kind: KNOWLEDGE_GAP
  prompt: What links the ABCA1 defect to less-characterized hematologic and distal manifestations?
  attaches_to:
  - phenotypes#Dry skin
  - phenotypes#Nail dystrophy
  - phenotypes#Ectropion
  - phenotypes#Abdominal pain
  - phenotypes#Left ventricular hypertrophy
  - phenotypes#Reticulocytosis
  - phenotypes#Stomatocytosis
  - phenotypes#Hemolytic anemia
  - phenotypes#Anemia
  rationale: >-
    Orphanet and GeneReviews record these manifestations, but the phenotype lists do not establish that tissue storage causes each one. In particular, the reported red-cell abnormalities and the association of splenomegaly with reticulocyte hyperplasia do not resolve the causal intermediates for anemia, hemolytic anemia, stomatocytosis, or reticulocytosis. Their clinical annotations are retained without assigning a storage-to-red-cell causal chain; the previously removed anemia edge lacked that support. The syringomyelia annotation is replaced with the documented syringomyelia-like peripheral neuropathy pattern; a spinal cord cavity requires separate evidence.

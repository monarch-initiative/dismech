  description: >-
    When both parents carry a pathogenic ABCA1 allele, each pregnancy has a 25% affected, 50% carrier and 25% noncarrier probability. Carrier biochemical HDL reduction is distinguishable from the biallelic clinical disorder; recurrence changes if a parent is affected.

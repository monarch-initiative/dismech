- name: Platelet Dense Granule Maturation Defect
  description: >
    ABCA1 is expressed in human platelets, and Tangier platelets fail to mature
    dense bodies normally. Electron microscopy shows reduced dense-body numbers
    and giant granules of the kind seen in Chediak-Higashi syndrome, and dense
    body content release is impaired, which in turn blunts activation by
    collagen and by low thrombin concentrations while leaving ADP responses,
    surface receptor levels and proximal collagen signalling intact. Note that
    the same study measured collagen-induced cholesterol and phosphatidylserine
    redistribution in Tangier platelets and found it unaltered, so the granule
    defect should not be described as a consequence of altered intracellular
    cholesterol distribution.
  biological_scale: CELLULAR
  cell_types:

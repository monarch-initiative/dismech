- name: Myeloid Inflammasome Activation
  description: >
    Cholesterol accumulating in ABCA1-deficient myeloid cells activates the
    NLRP3 inflammasome. Patients with Tangier disease carry raised plasma
    IL-1beta and IL-18, so this inflammatory layer is observed in the human
    disease rather than only inferred from a model. The onward steps, meaning
    caspase-1 cleavage in neutrophils, neutrophil recruitment, neutrophil
    extracellular trap formation within plaque, and larger lesions, are so far
    demonstrated only in mice lacking both Abca1 and Abcg1 in myeloid cells.
    This node therefore qualifies the cholesterol-storage account of vascular
    disease in Tangier disease rather than replacing it.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  - preferred_term: neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
    modifier: INCREASED
  evidence:
  - reference: PMID:29588315
    reference_title: "Cholesterol Efflux Pathways Suppress Inflammasome Activation, NETosis, and Atherogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with Tangier disease, who carry loss-of-function mutations in ABCA1 and have increased myeloid cholesterol content, showed a marked increase in plasma IL-1β and IL-18 levels."
    explanation: >
      A case-control human measurement that places inflammasome activation in
      Tangier disease itself, and is the reason this node is curated for the
      human disease rather than left as a model-organism observation.
  - reference: PMID:36537208
    reference_title: "Cholesterol accumulation in macrophages drives NETosis in atherosclerotic plaques via IL-1β secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Macrophage, but not neutrophil Abca1/g1 deficiency activated inflammasomes in macrophages and neutrophils, reflected by caspase-1 cleavage, and induced NETosis in plaques."
    explanation: >
      Cell-type dissection in mice locating the initiating defect in macrophages
      and showing that neutrophil inflammasome activation and NET formation are
      driven cell-extrinsically.
  - reference: PMID:18552351
    reference_title: "Increased cellular free cholesterol in macrophage-specific Abca1 knock-out mice enhances pro-inflammatory response of macrophages."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lipopolysaccharide (LPS)-treated Abca1(-)(M)(/-)(M) macrophages exhibited enhanced expression of pro-inflammatory cytokines and increased activation of the NF-kappaB and MAPK pathways"
    explanation: >
      Supplies the membrane-level account of why ABCA1 loss is pro-inflammatory:
      free cholesterol enriches lipid rafts and amplifies receptor-proximal
      signalling, an effect reversed by cholesterol depletion.
  downstream:
  - target: Accelerated atherosclerosis
    description: >
      Inflammasome activation contributes to atherosclerosis over and above
      lipid deposition, but the lesion-size evidence for that increment is
      murine.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - caspase-1 cleavage with IL-1beta and IL-18 secretion
    - neutrophil recruitment and neutrophil extracellular trap formation in plaque
    evidence:
    - reference: PMID:29588315
      reference_title: "Cholesterol Efflux Pathways Suppress Inflammasome Activation, NETosis, and Atherogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nlrp3 or Caspase-1/11 deficiency decreased atherosclerotic lesion size in myeloid Abca1/g1-deficient Ldlr-/- mice."
      explanation: >
        Genetic epistasis showing the inflammasome is required for the excess
        atherosclerosis seen on myeloid cholesterol-transporter loss, in mice.
    - reference: PMID:36537208
      reference_title: "Cholesterol accumulation in macrophages drives NETosis in atherosclerotic plaques via IL-1β secretion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NETosis was suppressed by administering an interleukin (IL)-1β neutralizing antibody."
      explanation: >
        Pharmacological interruption of the IL-1beta step removes plaque NETosis,
        identifying a separable and druggable limb of the inflammatory arm.

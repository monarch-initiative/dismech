- name: Miglustat investigation
  description: >-
    A 2014 withdrawal/rechallenge case and the MUSTANG nonrandomized n-of-1 ABAB study suggest possible neuropathy benefit. MUSTANG did not meet prespecified clinical-difference thresholds during the crossover phase; 21-month continuation improvement and blood-cell biomarker changes remain uncontrolled. The disease-specific therapeutic mechanism and general efficacy are unresolved.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: miglustat
      term:
        id: CHEBI:50381
        label: miglustat
  evidence:
  - reference: PMID:41212481
    reference_title: 'Miglustat as a Treatment for Adults with Tangier Disease Neuropathy: The MUSTANG N-of-1 Trial with 21 months Clinical Observation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: None of the co-primary endpoint differences reached our pre-determined level of clinical difference.
    explanation: >-
      MUSTANG found small clinical signals and later extension improvement, but failed prespecified clinical-difference thresholds; one unblinded nonrandomized ABAB patient cannot establish general efficacy.
  - reference: PMID:25227739
    reference_title: Effects of miglustat treatment in a patient affected by an atypical form of Tangier disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mechanisms by which miglustat ameliorates at least some clinical manifestations of TD needs to be further investigated.
    explanation: >-
      The initial case generated a treatment hypothesis without establishing mechanism or population efficacy.
  therapeutic_modality: SMALL_MOLECULE

  notes: >-
    NCIT was searched through OAK/OLS on 2026-09-05. Surveillance (C15719) denotes systematic health-data collection, Patient Observation (C15722) implies withholding treatment, and Disease Screening (C15419) concerns detection of usually asymptomatic disease. No single precise action term was selected for this combination of established-disease follow-up and complication precautions.
  description: >-

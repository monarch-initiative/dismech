discussions:
- discussion_id: td_genotype_neuropathy_subtype_gap
  prompt: >-
    What determines which of the four Tangier neuropathy subtypes a patient
    develops, given that ABCA1 genotype alone does not predict it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cholesteryl Ester Tissue Storage
  - phenotypes#Peripheral axonal neuropathy
  rationale: >-
    The published neuropathy phenotype is heterogeneous in a way the storage
    model does not currently explain: a review of 54 patients sorted them into
    syringomyelia-like, multifocal sensorimotor, focal and distal symmetric
    subtypes in very unequal proportions, and dizygous twins sharing an ABCA1
    genotype have been reported with markedly different severity. No systematic
    genotype-to-subtype correlation study was located. Resolving this needs a
    registry linking variant type and position, residual efflux activity in
    patient cells, nerve conduction pattern and modifier-gene sequencing.
  evidence:
  - reference: PMID:29582519
    reference_title: "Peripheral neuropathy in Tangier disease: A literature review and assessment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Syringomyelia-like neuropathy subtype (52.4%) was more frequent than multifocal sensorial and motor neuropathy subtype (26.2%)"
    explanation: >
      Documents the subtype spread that the current single-node storage account
      of neuropathy does not resolve.
  notes: >-
    Surfaced as Gap 1 by the 2026 openscientist hypothesis-search report for
    canonical_abca1_hdl_efflux_model.
- discussion_id: td_s1p_signaling_contribution_gap
  prompt: >-
    How much of the vascular and neurological disease in Tangier disease is
    attributable to loss of HDL-carried sphingosine-1-phosphate signalling
    rather than to cellular cholesterol storage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired HDL Biogenesis
  - mechanistic_hypotheses#canonical_abca1_hdl_efflux_model
  rationale: >-
    The two halves of this claim come from different experiments and neither
    closes the loop. Total plasma sphingolipids were drastically reduced in one
    Tangier patient with compound heterozygous ABCA1 mutations, but S1P itself
    was not measured in that patient; apoM and S1P reductions were shown only in
    hepatocyte-specific Abca1 knockout mice. So no S1P value has been reported
    for any person with Tangier disease, and the onward step to vascular or
    neurological injury is untested in either species. Sphingolipidomic
    profiling of a patient series, read out against endothelial function and
    neuropathy severity, is what would settle whether this is a parallel
    mechanism or a bystander finding.
  evidence:
  - reference: PMID:37601634
    reference_title: "Hepatocyte ABCA1 deficiency is associated with reduced HDL sphingolipids."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In parallel, apoM and sphingosine-1-phosphate (S1P) levels were reduced in plasma of Abca1 HSKO mice."
    explanation: >
      The S1P limb of the claim rests on liver-specific knockout mice, not on
      the Tangier patient reported in the same paper.
  - reference: PMID:37601634
    reference_title: "Hepatocyte ABCA1 deficiency is associated with reduced HDL sphingolipids."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whether plasma sphingolipids are reduced in Tangier disease and to what extent hepatic ABCA1 contributes to plasma sphingolipid (SL) levels is unknown."
    explanation: >
      The authors state the gap themselves in framing the study.
  proposed_experiments:
  - experiment_id: td_sphingolipidomic_profiling
    name: Plasma sphingolipidomics in a Tangier disease patient series
    description: >-
      Measure S1P, apoM, ceramides and total sphingolipids in at least ten
      genotyped Tangier patients against matched controls, and correlate each
      with flow-mediated dilation and with neuropathy severity.
    decision_criterion: >-
      Whether S1P tracks vascular or neurological measures after adjustment for
      cholesterol efflux capacity.
    would_support:
    - pathophysiology#Impaired HDL Biogenesis
    supporting_outcome: >-
      S1P is reduced across the series and correlates with impaired endothelial
      function independently of efflux capacity, establishing signalling-lipid
      loss as a separate arm of the mechanism.
    refuting_outcome: >-
      S1P is preserved, or varies without relation to vascular or neurological
      measures, leaving the single-patient sphingolipid observation as an
      incidental finding.
  notes: >-
    Surfaced as Gap 2 and Alternative Model B by the 2026 openscientist
    hypothesis-search report for canonical_abca1_hdl_efflux_model.
- discussion_id: td_hspc_myeloproliferation_human_gap
  prompt: >-
    Does haematopoietic progenitor cholesterol accumulation drive myeloid
    expansion in Tangier disease, or is that pathway specific to the
    inflammation-driven models in which it was described?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cholesteryl Ester Tissue Storage
  - pathophysiology#Myeloid Inflammasome Activation
  rationale: >-
    The supporting work is in two mouse models of rheumatoid arthritis, where
    systemic inflammation is the upstream cause and downregulation of Apoe,
    Abca1 and Abcg1 is a downstream consequence associated with progenitor
    cholesterol accumulation and myeloid expansion. Germline biallelic ABCA1
    loss inverts that causal ordering and lacks the inflammatory trigger, so
    the pathway cannot simply be transplanted into Tangier disease. No human
    Tangier study of progenitor biology or bone marrow was located. Flow
    cytometry and colony-forming assays on Tangier CD34+ cells, with filipin
    staining for cholesterol content, would test it directly.
  evidence:
  - reference: PMID:29905812
    reference_title: "Defective cholesterol metabolism in haematopoietic stem cells promotes monocyte-driven atherosclerosis in rheumatoid arthritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HSPCs expansion was associated with an increase in the cholesterol content, due to a down-regulation of cholesterol efflux genes, Apoe, Abca1, and Abcg1."
    explanation: >
      Establishes the progenitor pathway in an arthritis model, and in doing so
      shows that efflux-gene loss there is acquired and inflammation-driven
      rather than germline.
  proposed_experiments:
  - experiment_id: td_hspc_flow_cytometry
    name: Haematopoietic progenitor analysis in Tangier disease
    description: >-
      Flow cytometry of CD34+ progenitors from Tangier patients or obligate
      carriers, with colony-forming assays and filipin staining for cellular
      cholesterol.
    would_support:
    - pathophysiology#Cholesteryl Ester Tissue Storage
    supporting_outcome: >-
      Tangier progenitors show cholesterol accumulation, increased proliferation
      and myeloid-biased output, supporting a feed-forward supply of monocytes
      into tissue macrophage pools.
    refuting_outcome: >-
      Progenitor cholesterol content and myeloid output are normal, confining
      the pathway to inflammation-driven acquired efflux-gene suppression.
  notes: >-
    Surfaced as Gap 3 and Alternative Model D by the 2026 openscientist
    hypothesis-search report for canonical_abca1_hdl_efflux_model, which itself
    labels the model speculative for Tangier disease.
- discussion_id: td_inflammasome_netosis_human_translation_gap
  prompt: >-
    Beyond raised plasma IL-1beta and IL-18, does the inflammasome to NETosis
    limb operate in human Tangier plaque, and is it universal across ABCA1
    genotypes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Myeloid Inflammasome Activation
  - phenotypes#Accelerated atherosclerosis
  rationale: >-
    The human observation in Tangier disease is a plasma cytokine measurement.
    Everything downstream of it, meaning caspase-1 cleavage in neutrophils,
    neutrophil recruitment, NET formation in plaque and the increment in lesion
    size, is demonstrated in mice with combined myeloid Abca1 and Abcg1
    deficiency on an Ldlr-null background. That is neither isolated ABCA1 loss
    nor human tissue. It is also unknown whether inflammasome activation is
    present in every Tangier patient or varies with variant type and residual
    efflux activity. An inflammasome biomarker panel across available patients,
    and ultimately an anti-IL-1beta pilot, would separate the inflammatory
    contribution from passive lipid deposition.
  evidence:
  - reference: PMID:36537208
    reference_title: "Cholesterol accumulation in macrophages drives NETosis in atherosclerotic plaques via IL-1β secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Macrophage, but not neutrophil Abca1/g1 deficiency activated inflammasomes in macrophages and neutrophils, reflected by caspase-1 cleavage, and induced NETosis in plaques."
    explanation: >
      The NETosis limb is characterised only in a double-transporter knockout
      mouse, which is the mismatch this discussion records.
  proposed_experiments:
  - experiment_id: td_inflammasome_biomarker_panel
    name: Inflammasome and NET biomarker panel across Tangier patients
    description: >-
      Measure IL-18, IL-1beta, caspase-1 activity, citrullinated histone H3 and
      MPO-DNA complexes across available Tangier patients, stratified by ABCA1
      variant class and residual cholesterol efflux activity.
    decision_criterion: >-
      Whether inflammasome and NET markers are elevated in all patients or only
      in a genotype- or efflux-defined subset.
    would_support:
    - pathophysiology#Myeloid Inflammasome Activation
    supporting_outcome: >-
      Inflammasome and NET markers are consistently elevated and track residual
      efflux activity, supporting a universal inflammatory arm proportional to
      the transport defect.
    refuting_outcome: >-
      Markers are elevated only sporadically and do not track efflux activity,
      indicating the plasma cytokine finding reflects a subset or a confounder
      rather than a general mechanism.
  notes: >-
    Recorded during assessment of the 2026 openscientist hypothesis-search
    report, which graded this whole axis as confirmed in Tangier patients; the
    human evidence covers only its first step.
- discussion_id: td_compound_heterozygote_penetrance_gap
  prompt: >-
    Why do some ABCA1 compound heterozygotes lack overt Tangier manifestations,
    and what threshold of residual transporter activity separates them from
    affected patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#Biallelic ABCA1 Pathogenic Variants
  rationale: >-
    Two reported compound heterozygotes for ABCA1 mutations had no overt
    clinical manifestations of Tangier disease, and the authors of that survey
    conclude that asymptomatic patients may simply be overlooked and that
    genotyping is biased toward carriers who present with premature coronary
    disease. Neither residual efflux activity nor modifier genotype has been
    measured in such individuals, so it is unclear whether the explanation is
    hypomorphic alleles, protective modifiers or ascertainment. Exome
    sequencing plus efflux assays in patient fibroblasts or macrophages,
    comparing asymptomatic with symptomatic compound heterozygotes, would
    distinguish these.
  evidence:
  - reference: PMID:15019541
    reference_title: "Familial HDL deficiency due to ABCA1 gene mutations with or without other genetic lipoprotein disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two subjects found to be compound heterozygotes for ABCA1 mutations did not have overt clinical manifestations of TD."
    explanation: >
      Direct human observation of incomplete penetrance in biallelic ABCA1
      carriers.
  notes: >-
    Surfaced as Gap 5 by the 2026 openscientist hypothesis-search report for
    canonical_abca1_hdl_efflux_model.
- discussion_id: td_no_interventional_trial_evidence_gap
  prompt: >-
    Is there any disease-modifying therapy for Tangier disease, and by what
    mechanism does miglustat improve neurological signs in the one patient in
    whom it was tried?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  rationale: >-
    Every treatment curated for this entry manages complications rather than the
    transport defect. The only reported disease-directed attempt is miglustat in
    a single patient, given initially under a mistaken diagnosis of
    Niemann-Pick C, where neurological signs normalised, deteriorated on
    withdrawal and recovered on rechallenge. That on-off-on sequence is
    unusually informative for an n of 1, but the mechanism is unexplained and no
    interventional trial in Tangier disease was located. Treating ABCA1-null
    Schwann cell cultures or ABCA1 knockout mice with miglustat and reading out
    glycosphingolipid levels, cholesterol distribution and myelin integrity
    would identify what is being corrected.
  evidence:
  - reference: PMID:25227739
    reference_title: "Effects of miglustat treatment in a patient affected by an atypical form of Tangier disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mechanisms by which miglustat ameliorates at least some clinical manifestations of TD needs to be further investigated."
    explanation: >
      The case report's own conclusion records the unexplained mechanism behind
      the single positive therapeutic observation.
  notes: >-
    Surfaced as Gap 6 and Discriminating Test 5 by the 2026 openscientist
    hypothesis-search report for canonical_abca1_hdl_efflux_model. Miglustat is
    deliberately not curated as a treatment here: one patient, an off-target
    indication, and no proposed mechanism do not meet the bar for a treatment
    entry.

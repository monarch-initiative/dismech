- category: Ophthalmological
  name: Peripheral Visual Field Loss Preceding Central Loss
  description: >-
    The most distinctive feature of this entity, and the one the defining paper
    presents as discriminating. In every other inherited optic neuropathy the
    field defect begins centrally and spreads outward; here it began at the
    periphery and moved inward, sparing some central acuity even late. That is a
    testable clinical marker, and it is the reason the authors recommend
    screening MIEF1 specifically in patients with severe peripheral field
    alteration.
  phenotype_term:
    preferred_term: Constriction of peripheral visual field
    term:
      id: HP:0001133
      label: Constriction of peripheral visual field
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirdly, both cases examined here showed that the disease progressed from
      the peripheral to the central visual field, still preserving some visual
      acuity in the left eye of the first patient. This is in contrast with all
      the reports of ION cases, in which the alteration of the visual field
      occurs and evolves from the center to the periphery.
    explanation: >-
      States both the finding and the contrast with every other inherited optic
      neuropathy, which is what makes it discriminating.
- category: Ophthalmological
  name: Reduced Visual Acuity
  description: >-
    Sudden and painless in both patients, without the optic disc elevation or
    oedema seen in other autosomal optic neuropathies - a presentation that
    resembles Leber hereditary optic neuropathy and is a route to
    misdiagnosis.
  phenotype_term:

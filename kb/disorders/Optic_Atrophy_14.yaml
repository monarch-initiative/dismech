genetic:
- name: MIEF1
  gene_term:
    preferred_term: MIEF1
    term:
      id: hgnc:25979
      label: MIEF1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    MIEF1 encodes MID51, also written MiD51; the gene is sometimes referred to by
    the protein name, and its paralogue MIEF2 encodes MID49. Only two disease
    alleles are known: c.718T>A p.(Tyr240Asn), absent from databases, in exon 6;
    and c.436C>T p.(Arg146Trp), rs778124994, in exon 5, at a gnomAD frequency of
    1.99e-5.

    A transcription error in the source, flagged so it is not propagated. The
    figure legend describing the second variant states that c.436C>T is
    "localized at position 416 of the MID51 protein" while naming the change
    p.R146W in the same sentence; 146 is the position consistent with the
    nucleotide change, the sequence alignment, and every other mention in the
    paper. Read 416 as a typographical error for 146.

    What is not known about this gene's variants. There is no reported MIEF1
    variant that is *not* disease-associated in a patient with optic neuropathy,
    no missense-constraint analysis, and no second family - so a new MIEF1
    missense variant found in a patient with optic atrophy has essentially no
    gene-specific precedent to be interpreted against, beyond whether it falls in
    the DRP1-binding loop.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first individual harbored a c.718 T > A variant, not referenced in any
      database, and the second individual harbored a c.436C > T variant, referred
      to as rs778124994, with a frequency of 1.99e-5 in GnomAD database.
    explanation: >-
      The two alleles and their population frequencies.
  - reference: PMID:36044022
    reference_title: "Mid51/Fis1 mitochondrial oligomerization complex drives lysosomal untethering and network dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mid51(Y240N), located in its Drp1-binding domain, was linked to dominant
      optic atrophy
    explanation: >-
      Independent confirmation of the variant's domain assignment by a second
      group.
prevalence:
- population: French inherited optic neuropathy cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two patients, both women, from a cohort of 200 individuals in France with
    inherited optic neuropathy who had already been screened negative for OPA1,
    OPA3, WFS1 and the three primary LHON mitochondrial-DNA mutations. No further
    MIEF1 patient has been published.

    The fraction - two of two hundred, or one percent - is a diagnostic yield
    within an already-selected undiagnosed cohort, not a prevalence and not the
    share of inherited optic neuropathy attributable to MIEF1. The cohort was
    enriched for cases that the common genes had failed to explain, which inflates
    any rare gene's apparent share, and the panel covered only 22 genes, which
    means an unknown fraction of those 200 remain undiagnosed for reasons the
    study could not see.

    A larger unselected series from the same French diagnostic service puts an
    upper bound on the gene's importance. Sequencing 87 nuclear genes plus the
    Leber mitochondrial-DNA mutations in 2,186 probands referred for suspected
    hereditary optic neuropathy reached a diagnosis in 30 percent, and ten genes
    accounted for more than 96 percent of those diagnoses. MIEF1 is not among
    those ten. Eleven further genes, each under one percent of cases, together
    explained 17 individuals in the whole series - so whatever share MIEF1 holds
    lies inside that residue.

    Note what this does *not* add: patients. The 2023 series comes from the same
    Angers reference centre and shares five authors with the 2021 MIEF1 report,
    including its first author, so any MIEF1 case within it is presumptively one
    of the two already reported rather than a new one. This entry counts two
    patients in total.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two hundred individuals in France affected by an ION were included in this
      study. None of the individuals included had a molecular diagnosis after
      screening for pathogenic variants in OPA1, OPA3 and WFS1 exonic sequences
      and LHON-associated mtDNA mutations.
    explanation: >-
      The cohort and its prior-exclusion criteria, which is what makes the
      two-in-two-hundred figure a yield rather than a prevalence.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two individuals (Fig. 1) harboring a MIEF1 heterozygous
      variant, which were confirmed by Sanger sequencing
    explanation: >-
      The two patients found.
  - reference: PMID:36317462
    reference_title: "The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified top 10 nuclear genes included OPA1, WFS1, ACO2, SPG7, MFN2,
      AFG3L2, RTN4IP1, TMEM126A, NR2F1 and FDXR.
    explanation: >-
      MIEF1 is absent from the ten genes that account for more than 96 percent of
      nuclear hereditary optic neuropathy diagnoses in a 2,186-proband series,
      which bounds how common it can be.
  - reference: PMID:36317462
    reference_title: "The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven additional genes, each accounting for less than 1% of cases, were
      identified in 17 individuals.
    explanation: >-
      Quantifies the residue outside the top ten - 17 individuals across eleven
      genes - which is the population any MIEF1 share must come from. The
      abstract does not name those eleven genes, so this entry does not assert
      that MIEF1 is one of them.
experimental_models:
- name: MID51 variant expression in HeLa cells
  experimental_model_type: CELL_LINE
  description: >-
    Transient expression of mCherry- or myc-tagged wild-type, p.Y240N and
    p.R146W MID51 in HeLa cells, assayed by live confocal microscopy for
    localisation, by immunoprecipitation and immunoblot for oligomerisation, and
    by photoactivatable matrix probe for fusion events. This is the entire
    functional evidence base for the disease, and it is the same system in which
    the independent group later mapped the DRP1-recruitment defect.
  modeled_mechanisms:
  - target: Disrupted Mitochondrial Network Dynamics
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      The assay demonstrates that both patient variants abolish MID51's normal
      effect on mitochondrial network dynamics, which is the disease's proposed
      cellular lesion.
    limitations: >-
      Three limitations, and they compound. The cell is a cervical
      adenocarcinoma line, not a retinal ganglion cell, and the selective
      vulnerability of that neuron is the whole unexplained part of the disease.
      The variants are expressed transiently from a plasmid on top of endogenous
      wild-type MID51 rather than from the endogenous locus, and the cited review
      states explicitly that heterologous overexpression and increased endogenous
      MiD have opposite effects on the network - so the assay's baseline is a
      condition that does not occur in a patient. And the readout is a
      difference from overexpressed wild-type MID51, not from an untransfected
      cell, which measures loss of an overexpression artefact's effect rather
      than the variant's effect on a normal cell. Fidelity is graded LOW on that
      basis.
    readouts:
    - name: Mitochondrial fusion events after mito-PAGFP photoactivation
      target: Disrupted Mitochondrial Network Dynamics
      direction: DECREASED
      interpretation: >-
        Both mutants gave significantly fewer fusion events than wild-type MID51,
        which is the quantitative basis for the disease's cellular claim.
      evidence:
      - reference: PMID:33632269
        reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In contrast, both MID51 p.Y240N and p.R146W mutants resulted in
          significantly decreased mitochondrial fusion events and disrupted
          mitochondrial network dynamics, as compared to wild-type MID51 (Fig.
          3j-m).
        explanation: >-
          The fusion-event measurement underlying this readout.
    evidence:
    - reference: PMID:33632269
      reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Together, these results show that MIEF1 mutations linked to optic
        neuropathy preferentially disrupt the ability of MID51 to regulate
        mitochondrial fission/fusion dynamics.
      explanation: >-
        The authors' conclusion from this model, which is what makes it
        informative for this node.
  - target: Preserved MID51 Localisation and Oligomerisation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The same system was used to test, and exclude, mislocalisation and
      oligomerisation defects. Graded MEASURES rather than RECAPITULATES because
      the informative result is a negative one: the model establishes that two
      candidate mechanisms are absent.
    limitations: >-
      A negative result in an overexpression system is weaker than a positive
      one, because excess wild-type protein could mask a partial folding or
      trafficking defect. The oligomerisation assay in particular scores tagged
      protein pulled down from a transfected cell, not the endogenous complex.
    readouts:
    - name: MID51 oligomer to monomer ratio by immunoprecipitation
      target: Preserved MID51 Localisation and Oligomerisation
      direction: UNCHANGED
      interpretation: >-
        Mutant and wild-type MID51 formed dimers, tetramers and
        high-molecular-weight species in similar ratios - a real negative
        result, recorded as such.
      evidence:
      - reference: PMID:33632269
        reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Similarly, we found that both mutant proteins MID51 p.Y240N (Fig. 3d-f)
          and MID51 p.R146W (Fig. 3g-i) also showed similar oligomerization
          patterns to wild-type MID51 (Fig. 3c), with similar ratios of each
          oligomeric species to monomer levels.
        explanation: >-
          The oligomerisation measurement underlying this readout.
    evidence:
    - reference: PMID:33632269
      reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We next investigated whether MIEF1 variants disrupted the ability of
        MID51 to self-oligomerize.
      explanation: >-
        Establishes that the model was applied to this question, which is what
        makes its negative result usable.
diagnosis:
- name: Recognising the Reversed Visual Field Pattern and Sequencing MIEF1
  description: >-
    The practical content of this entity is a pattern-recognition rule. An adult
    with sudden painless bilateral visual loss, pale non-swollen optic discs,
    abnormal visual evoked potentials with normal electroretinograms, and a field
    defect that started at the *periphery*, who is negative for OPA1, OPA3, WFS1
    and the LHON mitochondrial-DNA mutations, is the patient in whom MIEF1 should
    be sequenced. The defining paper makes exactly that recommendation.

    Two negatives are part of the workup and were done in both reported patients:
    glaucoma was excluded, and serology for anti-aquaporin-4 and
    anti-myelin-oligodendrocyte-glycoprotein antibodies was negative. Both are important because a sudden
    painless optic neuropathy in a middle-aged woman is more often an acquired
    inflammatory one than a genetic one.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together, our work should prompt the molecular screening of MIEF1 in ION
      individuals with severe alterations of the peripheral visual field
    explanation: >-
      The authors' own screening recommendation, which is the diagnostic content
      of this entity.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At initial assessments, neither of the two individuals had symptoms or
      immunological profiles compatible with Glaucoma, Neuro Myelitis Optica or
      myelin oligodendrocyte glycoprotein optic neuritis.
    explanation: >-
      The acquired causes that were excluded before a genetic diagnosis was
      pursued.
differential_diagnoses:
- name: OPA1-related dominant optic atrophy and the other mitochondrial-dynamics optic neuropathies
  description: >-
    The genes are neighbours in mechanism and separable on presentation. OPA1
    accounts for most dominant optic atrophy, with more than 400 pathogenic
    variants described, and typically declares itself in the first two decades
    with insidious central visual loss. MFN2 and OPA3 act on fusion; SPG7 and
    AFG3L2 act indirectly through OPA1 processing; DNM1L acts on fission from the
    other side of the balance. MIEF1 is distinguished from all of them by adult
    onset, sudden painless acuity loss, and peripheral-first field loss - and, if
    those fail, by sequencing.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In dominant optic atrophy (DOA, MIM165500), it is now well established that
      mutations in genes involved in mitochondrial dynamics such as OPA1
      (MIM#605290) are the main cause of the disease. More than 400 distinct
      pathogenic variants have been described in OPA1
    explanation: >-
      Establishes OPA1 as the dominant-optic-atrophy differential's largest
      component.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interestingly, DNM1L mutations resulting in excessive mitochondrial fusion
      have also been identified in patients with a similar ophthalmological
      presentation
    explanation: >-
      Places a fission-side gene in the same clinical territory as the
      fusion-side ones.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      thus providing evidence that alterations of both fusion and fission
      compromise retinal ganglion cell survival
    explanation: >-
      The principle that unites the differential: imbalance in either direction
      damages the same neuron, which is why MIEF1 belongs in this list despite
      acting on the opposite side from OPA1.
- name: Leber hereditary optic neuropathy
  description: >-
    The most consequential differential, because MIEF1 disease imitates it. Both
    present with sudden painless bilateral visual loss; LHON is maternally
    transmitted through mitochondrial-DNA mutations and typically shows optic
    disc elevation and peripapillary telangiectasia in the acute phase, which
    these patients did not have. Both reported MIEF1 patients had been screened
    for the three primary LHON mutations and were negative, which is why they
    were in the undiagnosed cohort at all.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Secondly, both patients complained of a rather sudden painless loss of
      visual acuity, similar to those observed in maternally inherited LHON,
      although without optic disk elevation or edema
    explanation: >-
      States the resemblance and the one clinical feature that separates them.
- name: Acquired optic neuropathies - glaucoma, neuromyelitis optica, MOG-antibody optic neuritis
  description: >-
    Not genetic, but the practical differential for an adult presenting this way,
    and the one the reported patients were worked up for. Peripheral-first field
    loss with excavated discs is also the pattern of glaucoma, which makes normal
    intraocular pressure - documented in the second patient - a load-bearing
    observation rather than a formality.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She presented with pale and excavated optic disks (Fig. 1a, right) with
      normal intra-ocular pressure (IOP: RE: 9 and LE: 10 mmHg).
    explanation: >-
      Excavated discs with normal pressure, which is what separates this from
      glaucoma.
discussions:
- discussion_id: opa14_gene_disease_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the MIEF1-optic atrophy association established, and would it survive a
    formal gene-disease validity assessment?
  attaches_to:
  - "genetic#MIEF1"
  - "pathophysiology#Heterozygous MIEF1 Missense Variant"
  rationale: >-
    This is the first thing a reader of this entry should know, and the entry is
    written around it rather than despite it.

    The whole human evidence base is two unrelated women from one cohort, each
    heterozygous for a different missense variant. No affected relative is
    described, no segregation is reported, and no second family has been
    published in the five years since. One of the two variants, p.R146W, is
    rs778124994 and present in gnomAD, and lies in a domain the paper itself
    describes as having no known function. Functional support is transient
    overexpression in HeLa cells, measured against overexpressed wild-type rather
    than against an untransfected baseline.

    None of that means the association is wrong. The independent replication of
    the p.Y240N DRP1-binding defect by a second laboratory is real support, the
    clinical phenotype is genuinely unusual in a way that would be odd to arrive
    at by chance, and the gene sits squarely in a pathway whose other members
    cause the same disease. It means the association is *provisional*, which is
    how the pathophysiology nodes here are graded and why no
    treatment or prognosis content is curated.

    The concrete thing that would settle it is a second family with segregation,
    or a formal ClinGen gene-disease validity curation. Neither exists. Until one
    does, a curator should resist the pull to write this entry as though the
    entity were secure because it has a MONDO identifier and an OMIM number -
    those record that a claim was made, not that it was replicated.
  proposed_experiments:
  - experiment_id: exp_opa14_second_family
    name: Segregation in additional MIEF1 families
    description: >-
      Screen MIEF1 in inherited-optic-neuropathy cohorts that are unsolved after
      OPA1 and mitochondrial-DNA testing, prioritising patients with
      peripheral-onset field loss, and test segregation in any family found. Two
      informative meioses would do more for this entity than any further cell
      biology.
- discussion_id: opa14_hela_overexpression_is_the_whole_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the loss of MID51's network-modulating effect seen in overexpressing
    HeLa cells describe what happens in a heterozygous patient's retinal ganglion
    cell?
  attaches_to:
  - "pathophysiology#Disrupted Mitochondrial Network Dynamics"
  - "experimental_models#MID51 variant expression in HeLa cells"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    experiments exist and are well executed; what is untested is their
    relationship to the disease.

    The specific mismatch is not just the usual cell-line caveat. The review
    cited by this entry states that heterologous MiD overexpression sequesters
    inactive DRP1 and promotes fusion, whereas increased *endogenous* MiD
    promotes fission - the two conditions have opposite effects on the network.
    The assay therefore measures the mutants' failure to reproduce an
    overexpression phenotype, in a condition that does not occur in a patient, in
    a cervical adenocarcinoma line, against a background of intact endogenous
    wild-type MID51. What a patient has is one wild-type and one variant allele
    at the endogenous locus in a retinal ganglion cell.

    Whether that matters is genuinely open. It is entirely possible that the
    variants are simple loss-of-function alleles and the overexpression assay
    reads that out faithfully. It is also possible that the heterozygous
    phenotype involves the mutant protein interfering with the wild-type one,
    which this design cannot see, and which would change
    `functional_impact_category` on the trigger node from LOSS_OF_FUNCTION to
    DOMINANT_NEGATIVE.

    Note also that nothing about the retinal ganglion cell's selective
    vulnerability is addressed by any model of this disease. That is a gap shared
    with the entire dominant-optic-atrophy field rather than a MIEF1-specific
    one, which is why it is stated on the causal edge rather than made a separate
    discussion here.
  proposed_experiments:
  - experiment_id: exp_opa14_knockin_rgc
    name: Endogenous-locus MIEF1 variants in human retinal ganglion cells
    description: >-
      Knock the p.Y240N and p.R146W variants into the endogenous MIEF1 locus of
      induced pluripotent stem cells, heterozygously, differentiate to retinal
      ganglion cells, and measure mitochondrial morphology, network dynamics,
      axonal transport and survival against isogenic controls. Include a
      homozygous arm to distinguish haploinsufficiency from a dominant-negative
      effect.
- discussion_id: opa14_pathway_selectivity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does the optic-atrophy variant spare the mitochondria-lysosome contact
    pathway that MID51 also controls, and does that selectivity explain why the
    disease is confined to the optic nerve?
  attaches_to:
  - "pathophysiology#Impaired DRP1 Recruitment to the Outer Mitochondrial Membrane"
  rationale: >-
    An unusually clean natural experiment sits inside this gene, and it has not
    been followed up.

    MID51 has two separable jobs. Through its DRP1-binding loop it recruits DRP1
    and drives mitochondrial fission. Through a distinct oligomerisation
    interface, in complex with Fis1, it drives lysosomal untethering by way of
    Rab7 GTP hydrolysis at mitochondria-lysosome contact sites. The
    optic-atrophy variant p.Y240N hits the first and, in direct experiments,
    leaves the second untouched - it still forms a complex with Fis1 and does not
    misregulate lysosomal tethering. A different variant in the oligomerisation
    interface, p.R169W, does the reverse, and has been tentatively linked to
    Parkinson's disease rather than to optic atrophy.

    So one gene appears to produce two different neurological diseases through
    two separable interfaces, with a clean dissociation demonstrated in the same
    experiments. If that holds, it is a strong hypothesis for why MIEF1 disease
    is confined to the optic nerve rather than being a broader neurodegenerative
    syndrome.

    Two cautions before it is treated as established. The Parkinson's link for
    p.R169W is described in the source as potential rather than demonstrated, so
    half the dissociation rests on a tentative clinical association. And the
    optic-atrophy arm rests on p.Y240N alone; p.R146W has never been tested in
    the lysosomal assays, so it is unknown whether the second optic-atrophy
    allele shows the same selectivity.
  proposed_experiments:
  - experiment_id: exp_opa14_second_allele_lysosomal_assay
    name: Test p.R146W in the mitochondria-lysosome contact assays
    description: >-
      Apply the inter-lysosomal untethering and Rab7 GTP hydrolysis assays to the
      second optic-atrophy allele p.R146W, alongside p.Y240N and p.R169W. If
      p.R146W also spares the lysosomal arm, the interface-to-disease mapping
      becomes a property of the phenotype rather than of one variant.
notes: >-
  On conformance, which this entry deliberately does not declare. The obvious
  candidate module is `mitochondrial_dysfunction`, and it does not fit: its nodes
  are age-related mitochondrial damage and mtDNA mutation, bioenergetic decline
  and oxidative stress, impaired mitophagy and quality control, mitochondrial
  contribution to senescence and inflammation, and age-related tissue
  dysfunction. None of them is about fission-fusion balance, and no bioenergetic,
  reactive-oxygen or mitophagy measurement exists for MIEF1, so declaring
  conformance to the bioenergetic node would assert an unmeasured claim in order
  to gain a link.

  What is missing is a mitochondrial-dynamics module. The genes that would
  populate it are named in this entry's own differential - OPA1, MFN2, OPA3,
  DNM1L, MFF, SPG7, AFG3L2, YME1L1 and MIEF1 - and they converge on one node,
  that regulated fission-fusion balance is required for retinal ganglion cell
  survival, with the striking property that imbalance in either direction
  produces the same disease. Creating that module is a larger piece of work than
  a single-disease entry should contain, and it should be created from the OPA1
  and DNM1L literature rather than from this two-patient entity. Recorded here so
  the absence is a decision rather than an oversight.

  On what is not curated. There is no `treatments:` block, no `progression:`
  block beyond what the phenotype descriptions carry, and no `animal_models:`
  block. No therapy has been reported or trialled for MIEF1 disease; no natural
  history study exists beyond the two individual descriptions; and no MIEF1
  animal model exists in any species. The idebenone literature for Leber
  hereditary optic neuropathy and the general dominant-optic-atrophy management
  literature are both close enough to look importable, and importing either would
  attribute to two patients an experience recorded only in people with other
  genotypes.

  On the deep-research report committed with this entry. It was used as a lead
  and one of its claims did not survive checking, which is recorded here because
  the number is the kind that gets copied. The report states that MIEF1 accounted
  for about 1.08 percent of positive optic atrophy diagnoses in the 2,186-proband
  series; that series' abstract says the genes outside its top ten each account
  for *less than* one percent, and does not name MIEF1 at all. The bound curated
  in the prevalence block is the one the abstract supports, not the report's
  figure. Its Named Entity Confusion preflight passes cleanly (MIEF1 mentioned 47
  times, next gene OPA1 at 3).

  On the direction of the cellular phenotype. The measured result is that
  wild-type MID51 overexpression increases mitochondrial fusion and the mutants
  do not. It is tempting to compress that into "MIEF1 variants cause
  mitochondrial fragmentation" or "cause hyperfusion"; neither is supported.
  Nothing has been measured in a patient's cells, and the direction of the effect
  in the assay is a property of the overexpression system rather than of the
  disease. The node states the loss of modulation and stops there.

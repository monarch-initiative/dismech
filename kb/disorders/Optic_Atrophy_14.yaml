name: Optic Atrophy 14
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Optic atrophy 14
  term:
    id: MONDO:0957824
    label: optic atrophy 14
description: >-
  Optic atrophy 14 (OPA14) is a dominantly inherited optic neuropathy caused by
  heterozygous missense variants in MIEF1, which encodes MID51 - an outer
  mitochondrial membrane protein that recruits the fission GTPase DRP1 to the
  organelle. It sits in the same axis as the other dominant optic atrophies:
  OPA1, MFN2 and OPA3 act on mitochondrial fusion, DNM1L on fission, and MIEF1 on
  the adaptor layer that decides where and when DRP1 acts. What unites them is
  not fission or fusion in particular but the *regulation* of the balance, and
  the retinal ganglion cell's apparent inability to tolerate its loss in either
  direction.

  The molecular result is unusually specific and is worth stating as a set of
  negatives. The two disease variants do not stop MID51 reaching the outer
  mitochondrial membrane, and they do not stop it oligomerising - the two things
  a missense variant in a membrane adaptor might most obviously be expected to
  do. What they do is abolish MID51's effect on the network: expressing wild-type
  MID51 increases mitochondrial fusion events, and expressing either mutant does
  not. Independent work locates the lesion one step further in, showing that the
  p.Y240N variant sits in the DRP1-binding loop, disrupts DRP1 recruitment while
  leaving MID51-Fis1 oligomerisation intact, and selectively inhibits DRP1 GTP
  hydrolysis - and, in the same experiments, leaves the mitochondria-lysosome
  contact pathway that MID51 also governs entirely alone.

  Clinically it is an outlier among the dominant optic atrophies in three
  respects that the defining paper sets out deliberately: onset in adulthood
  rather than in the first two decades, a sudden painless loss of acuity that
  looks like Leber hereditary optic neuropathy rather than the insidious decline
  of OPA1 disease, and - most distinctively - visual field loss that starts at
  the periphery and moves inward, the reverse of every other inherited optic
  neuropathy.

  The evidence base is two women, aged 55 and 47, from one French cohort of 200,
  with no reported family segregation and functional support from transient
  overexpression in HeLa cells. That is thin for a gene-disease assertion, and
  the entry says so rather than writing around it.

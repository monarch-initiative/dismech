inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Both reported patients are heterozygous for a MIEF1 missense variant, and the
    disease is described throughout the defining paper as dominant.

    What that rests on should be stated plainly, because it is not a segregation
    analysis. The two patients are unrelated women ascertained separately from a
    200-person cohort; no affected relative, no pedigree and no transmission is
    described in the accessible text. Dominance is inferred from heterozygosity
    plus rarity plus an in vitro functional effect - which is a reasonable
    inference and is not the same as a demonstration. The gene-disease validity
    question this raises is an open discussion below.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using targeted sequencing of genes involved in mitochondrial dynamics, we
      report the first heterozygous variants in MIEF1 linked to disease, which
      cause an unusual form of late-onset progressive optic neuropathy
      characterized by the initial loss of peripheral visual fields.
    explanation: >-
      Establishes heterozygosity and the dominant framing of the entity.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, SNP array analyses revealed no chromosomal abnormality, no
      copy number variation and no large region of homozygosity that might have
      indicated a consanguinity.
    explanation: >-
      Graded PARTIAL: it excludes a recessive explanation by consanguinity, which
      supports the dominant model indirectly, but it is not segregation evidence
      and no segregation is reported.
pathophysiology:
- name: Heterozygous MIEF1 Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  description: >-
    Two variants, one per patient. c.718T>A gives p.Y240N, which lies in MID51's
    DRP1-binding region; c.436C>T gives p.R146W, in a domain conserved with MID49
    but of no known function. Neither is in the transmembrane domain that anchors
    MID51 in the outer membrane, and neither is at a residue previously shown to
    mediate oligomerisation - which is what makes the functional results below
    interpretable rather than merely negative.

    Marked PROVISIONAL rather than ESTABLISHED because the pathogenicity argument
    is rarity plus in silico prediction plus an in vitro effect, in two unrelated
    singletons. The p.Y240N variant is absent from databases; p.R146W is
    rs778124994 at a gnomAD frequency of about 2 in 100,000, which is rare but
    not private.
  genes:
  - preferred_term: MIEF1
    term:
      id: hgnc:25979
      label: MIEF1
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    description: >-
      Curated as LOSS_OF_FUNCTION, and the choice needs its reasoning stated
      because the alternatives are live. The measured effect is that the mutants
      fail to do what wild-type MID51 does - wild-type expression increases
      fusion events, mutant expression does not - which is loss of a normal
      activity, and the follow-up work attributes it specifically to loss of DRP1
      recruitment. DOMINANT_NEGATIVE is the obvious competing hypothesis for a
      heterozygous missense variant in an oligomeric adaptor, and it has not been
      excluded: no experiment reported here tests the mutant against wild-type
      MID51 in the same cell, and the assays are transient overexpression rather
      than expression from the endogenous locus. If a dominant-negative
      mechanism is later demonstrated, this slot should change.
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These variants lead to the p.Y240N and the p.R146W amino-acid changes in
      MID51, respectively, with p.Y240N located in a DRP1 binding domain, and
      p.R146W located in another domain conserved within MID49, but without known
      function
    explanation: >-
      Names both variants and locates them on the protein, which is what the
      mechanism below turns on.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, neither disease-linked mutations (p.Y240N or p.R146W) are
      located in MID51's transmembrane domain which mediates its outer
      mitochondrial membrane localization (residues 1 to 48)
    explanation: >-
      Establishes that the variants are positioned to spare localisation, which
      is what the experiments then confirm. The quote stops at the bracketed
      citation marker; the same sentence continues to make the equivalent point
      about the oligomerisation residues.
  downstream:
  - target: Preserved MID51 Localisation and Oligomerisation
    causal_link_type: DIRECT
  - target: Impaired DRP1 Recruitment to the Outer Mitochondrial Membrane
    causal_link_type: DIRECT
- name: Preserved MID51 Localisation and Oligomerisation
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: ESTABLISHED
  description: >-
    A node that records what the disease is not, because two obvious mechanisms
    were tested and excluded, and excluding them is what makes the positive
    finding meaningful.

    Both mutant proteins localise to the mitochondrial network in live cells just
    as wild-type MID51 does, so this is not a mislocalisation disease. Both form
    dimers, tetramers and high-molecular-weight species in the same ratios as
    wild-type, so it is not an oligomerisation disease either. A curator adding
    to this entry should not later attach a mislocalisation or
    misassembly mechanism to it without new data; these were looked for and were
    not there.
  cellular_components:
  - preferred_term: mitochondrial outer membrane
    term:
      id: GO:0005741
      label: mitochondrial outer membrane
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      This was also true for mutant MID51 p.Y240N and p.R146W proteins, which
      also localized to the mitochondrial network in live cells (Fig. 3a, b),
      demonstrating that these MIEF1 missense variants linked to optic neuropathy
      do not alter MID51's mitochondrial localization.
    explanation: >-
      Curated as REFUTE against a mislocalisation mechanism, which this node
      exists to exclude.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Thus, these MIEF1 missense variants linked to optic neuropathy do not
      significantly disrupt the oligomerization of MID51.
    explanation: >-
      Curated as REFUTE against an oligomerisation mechanism.
- name: Impaired DRP1 Recruitment to the Outer Mitochondrial Membrane
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The proposed molecular lesion. MID51's job is to recruit DRP1, a
    dynamin-related GTPase that has no membrane-binding domain of its own, onto
    the outer mitochondrial membrane so that it can constrict and divide the
    organelle. The p.Y240 residue sits in the loop that binds DRP1, and
    independent work concludes that the p.Y240N variant disrupts DRP1 recruitment
    while leaving MID51 oligomerisation intact, with the downstream consequence
    of selectively inhibiting DRP1 GTP hydrolysis.

    Marked PROVISIONAL for a specific reason, not as a general hedge. The DRP1
    recruitment claim is well evidenced for p.Y240N, whose position in the
    binding loop predicts it. It is *not* evidenced for p.R146W, which lies in a
    domain of unknown function outside the DRP1-binding region, and for which no
    DRP1 experiment has been reported. Both variants produce the same network
    phenotype at the node below, so either p.R146W reaches it by the same route
    for a reason nobody has identified, or the two alleles converge from
    different molecular starting points. Nothing published distinguishes these.
  molecular_functions:
  - preferred_term: DRP1 recruitment activity of MID51
    term:
      id: GO:0005515
      label: protein binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36044022
    reference_title: "Mid51/Fis1 mitochondrial oligomerization complex drives lysosomal untethering and network dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mid51(Y240N) Drp1-binding domain mutant which is linked to dominant optic
      atrophy disrupts Drp1 recruitment but not Mid51 oligomerization, leading to
      the selective inhibition of Drp1 GTP hydrolysis
    explanation: >-
      The specific molecular claim of this node, from an independent laboratory
      studying the same variant.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our findings that Mid51 optic neuropathy-linked variants disrupt
      mitochondrial fission/fusion dynamics but not its localization or
      oligomerization are consistent with the fact that p.Y240 is a residue
      located in the loop region (residues 238-242) critical for DRP1 binding
    explanation: >-
      The structural argument that motivates this node. Graded OTHER because it
      is the authors' interpretation of prior structural work rather than an
      experiment they performed.
  downstream:
  - target: Disrupted Mitochondrial Network Dynamics
    causal_link_type: DIRECT
- name: Disrupted Mitochondrial Network Dynamics
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The measured cellular phenotype, and the strongest evidence in the entity.
    Using a photoactivatable matrix probe to count fusion events between
    mitochondria in live cells, wild-type MID51 expression increased the rate of
    fusion, and both mutants significantly decreased it relative to wild-type.

    Read the direction carefully, because it is counterintuitive. MID51 is a
    *fission* adaptor, yet overexpressing wild-type MID51 increases *fusion* -
    the established explanation being that excess MID51 sequesters DRP1 in an
    inactive state on the outer membrane, so the net effect of more adaptor is
    less fission. The mutants fail to produce that effect. So what the assay
    measures directly is the loss of MID51's ability to modulate the network at
    all, not a shift toward either fission or fusion in the patient. The entry
    deliberately does not claim that patients' mitochondria are fragmented or
    elongated: nobody has looked at a patient's cells.
  biological_processes:
  - preferred_term: mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, both MID51 p.Y240N and p.R146W mutants resulted in
      significantly decreased mitochondrial fusion events and disrupted
      mitochondrial network dynamics, as compared to wild-type MID51 (Fig. 3j-m).
    explanation: >-
      The primary quantitative result for both variants.
  - reference: PMID:27660309
    reference_title: "The role of Drp1 adaptor proteins MiD49 and MiD51 in mitochondrial fission: implications for human disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Heterologous MiD overexpression sequesters inactive Drp1 on the OMM,
      promoting fusion; conversely, increased endogenous MiD creates focused Drp1
      multimers that optimize OMM scission.
    explanation: >-
      Explains why overexpressing a fission adaptor increases fusion, which is
      what makes the assay's direction interpretable. It is also the reason this
      node stops short of claiming a network phenotype in patients: the review
      states that the overexpression and endogenous situations differ.
  downstream:
  - target: Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Why disrupted mitochondrial dynamics kills retinal ganglion cells in
      particular is the unsolved question of the whole dominant-optic-atrophy
      field, not a gap specific to MIEF1. No intermediate step has been
      demonstrated for this gene.
- name: Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
  biological_scale: TISSUE
  role: outcome
  mechanism_confidence: PROVISIONAL
  description: >-
    The clinical endpoint. Both patients had pale, moderately excavated optic
    disks with a normal retina, strongly abnormal visual evoked potentials, and -
    in the patient who had optical coherence tomography - retinal nerve fibre
    layer collapse in all quadrants of both eyes. The retinal nerve fibre layer
    is the retinal ganglion cell axon layer, so its loss is the closest available
    measurement of the cellular claim in this node's title.

    Marked PROVISIONAL because ganglion cell death itself is inferred, not
    observed: no tissue from a MIEF1 patient has been examined. What is observed
    is optic disc pallor plus axon-layer thinning plus conduction failure, which
    is the standard clinical basis for inferring ganglion cell loss in the
    inherited optic neuropathies.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  evidence:
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At fundus examination, both individuals had normal retina, but presented
      pale and moderately excavated optic disks (Fig. 1a).
    explanation: >-
      The optic nerve finding, with a normal retina excluding a retinal
      dystrophy.
  - reference: PMID:33632269
    reference_title: "Dominant mutations in MIEF1 affect mitochondrial dynamics and cause a singular late onset optic neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      OCT (optical coherence tomography) examination revealed collapsed RNFL
      (retinal nerve fiber layer) in all quadrants in both eyes (Fig. 1c).
    explanation: >-
      Axon-layer loss, the measurable correlate of retinal ganglion cell
      degeneration.

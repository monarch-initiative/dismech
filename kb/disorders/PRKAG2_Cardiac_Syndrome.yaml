phenotypes:
- category: Cardiovascular
  name: Ventricular pre-excitation
  diagnostic: true
  frequency: FREQUENT
  description: >-
    A short PR interval with a delta wave on the surface ECG, reflecting
    conduction over accessory atrioventricular connections. Present in about a
    third of carriers at first assessment and reaching a cumulative risk of
    roughly 70 percent by age 40 in a time-to-event analysis. In combination with
    unexplained left ventricular hypertrophy this is the single most useful
    pointer away from sarcomeric HCM and toward a glycogen storage
    cardiomyopathy.
  phenotype_term:
    preferred_term: Ventricular preexcitation
    term:
      id: HP:0004309
      label: Ventricular preexcitation
  evidence:
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty patients (33%) had ventricular pre-excitation or had undergone accessory pathway ablation"
    explanation: >-
      Supports both the phenotype and the FREQUENT band, since 33 percent falls
      in the 30-79 percent HPO range.
  - reference: PMID:28431061
    reference_title: "High prevalence of arrhythmic and myocardial complications in patients with cardiac glycogenosis due to PRKAG2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the total cohort, at 40 years of age, the risk of developing HCM was 61%, VPE 70%, conduction block 22%, and sudden cardiac death (SCD) 20%."
    explanation: >-
      Independent time-to-event estimate of 70 percent cumulative pre-excitation
      risk by age 40, corroborating the FREQUENT band.

- category: Cardiovascular
  name: Wolff-Parkinson-White syndrome
  description: >-
    Ventricular pre-excitation accompanied by symptomatic tachyarrhythmia. In
    PRKAG2 families WPW characteristically manifests early in life, is often the
    presenting feature, and can occur without any hypertrophy at all - a
    childhood-onset, hypertrophy-free presentation is documented for the
    p.Arg531Gly allele. Frequency is deliberately omitted: the cohort figures
    quantify pre-excitation on ECG rather than the clinical WPW syndrome, and no
    verified source separates the two.
  phenotype_term:
    preferred_term: Wolff-Parkinson-White syndrome
    term:
      id: HP:0001716
      label: Wolff-Parkinson-White syndrome
  evidence:

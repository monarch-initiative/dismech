- name: Progressive Contractile Dysfunction
  biological_scale: ORGANISM
  role: effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  description: >-
    Over years to decades the hypertrophic phase is followed in a substantial
    minority by declining pump function - a transition sometimes described as a
    burned-out, dilated phase. At this point the disease converges on the generic
    structural-cardiomyopathy pathway, which is why conformance to the
    maladaptive-remodeling module is declared HERE and not at the upstream
    hypertrophy node: the earlier increase in wall thickness is storage mass, not
    neurohormonally driven remodeling.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Heart contraction

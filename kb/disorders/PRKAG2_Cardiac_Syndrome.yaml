      MONDO:0010946 (CMH6; OMIM:600858; synonyms "CMH6", "PRKAG2 hypertrophic
      cardiomyopathy", "cardiomyopathy, familial hypertrophic, 6") is the
      OMIM-derived, disease-series-by-gene sibling name for the same PRKAG2
      biology, and MONDO asserts it as a direct subclass of MONDO:0800484
      ("is_a: MONDO:0800484 ! PRKAG2-related cardiomyopathy", verified with
      `runoak -i sqlite:obo:mondo info MONDO:0010946 -O obo`). Its own MONDO
      definition is the pure gene-series template - "Any hypertrophic
      cardiomyopathy in which the cause of the disease is a mutation in the
      PRKAG2 gene" - which asserts no mechanism or phenotype beyond the gene,
      so it adds no curatable content over this entry. It is recorded here as
      a narrowMatch (the CMH-numbered-series framing of PRKAG2 disease) rather
      than curated as a separate dismech Disease; see the CMH6 paragraph in
      `notes` for the split rationale.

notes: >-
  SCOPE AND ENTITY IDENTITY. This entry models PRKAG2-related cardiac
  glycogenosis under MONDO:0800484 ("PRKAG2-related cardiomyopathy"; synonym
  "PRKAG2 cardiac syndrome"), whose MONDO definition - "variable cardiac
  hypertrophy, ventricular pre-excitation, and aberrant glycogen storage in the
  cardiac tissue due to a pathogenic variant in PRKAG2" - is exactly the entity
  curated here, and which carries the gene association RO:0004003 HGNC:9386
  (PRKAG2).

  CMH6 / MONDO:0010946 IS SUBSUMED HERE - NO SEPARATE ENTRY. A subsequent
  curation request targeted "hypertrophic cardiomyopathy 6" (MONDO:0010946,
  CMH6, OMIM:600858, gene PRKAG2) as if it were an uncurated disease. It is
  not a distinct disease from the one modeled here. MONDO asserts
  "is_a: MONDO:0800484 ! PRKAG2-related cardiomyopathy" on MONDO:0010946, and
  MONDO:0010946's definition is the bare disease-series-by-gene template ("Any
  hypertrophic cardiomyopathy in which the cause of the disease is a mutation
  in the PRKAG2 gene"), generated from the OMIM CMH-numbered series rather
  than authored against distinguishing biology. The two MONDO classes are
  therefore two names - one ClinGen-authored and mechanism-bearing, one
  OMIM-series and gene-only - for a single entity: same gene (PRKAG2/HGNC:9386),
  same CBS-domain gain-of-function alleles, same glycogen/polyglucosan storage,
  same WPW-plus-conduction-disease triad, same management. Nothing in
  MONDO:0010946 licenses a pathophysiology node, phenotype, or treatment that
  is not already curated in this file. Creating a parallel
  `Hypertrophic_Cardiomyopathy_6` entry would fragment PRKAG2 disease across
  two files with duplicated evidence and no mechanistic distinction, so
  MONDO:0010946 is instead recorded as a `skos:narrowMatch` in `mappings` and
  its OMIM/DOID-side names (CMH6; "cardiomyopathy, familial hypertrophic, 6";
  "PRKAG2 hypertrophic cardiomyopathy") are carried in `synonyms` so lookups
  by the CMH6 name resolve here. Note the naming trap this closes: CMH6's
  label places PRKAG2 disease inside the hypertrophic-cardiomyopathy numbered
  series alongside genuinely sarcomeric members (CMH1/MYH7, CMH4/MYBPC3,
  CMH3/TPM1, CMH7/TNNI3), which is precisely the sarcomeric-HCM conflation the
  LUMP-VS-SPLIT paragraph below rejects on mechanistic grounds. The series
  membership is a nosological artifact of OMIM's numbering, not a claim that
  PRKAG2 disease is a sarcomeropathy.

  NAMED-ENTITY-CONFUSION (NEC) FINDING. The curation request that produced this
  entry named "cardiomyopathy, familial hypertrophic, 29, with polyglucosan
  bodies" / MONDO:0859372 as the target, but described PRKAG2 biology throughout
  (gene, CBS-domain alleles, WPW triad, annulus fibrosus mechanism). The NEC
  preflight (`runoak -i sqlite:obo:mondo info MONDO:0859372 -O obo`) shows that
  MONDO:0859372 is CMH29, OMIM:620236, carrying the gene association RO:0004003
  HGNC:25947 - that is KLHL24, not PRKAG2. The two are distinct diseases that
  were conflated because both feature myocardial polyglucosan. A gene-frequency
  check of the deep-research report corroborates this: PRKAG2 is mentioned 53
  times and KLHL24 zero times, so the report (and the curation intent) is
  unambiguously about PRKAG2. MONDO:0859372 / KLHL24-related CMH29 remains
  UNCURATED in dismech and is available as a separate future entry; nothing in
  this file should be read as covering it. The CMH numbered series (CMH1-CMH30)
  is a documented high-NEC-risk class, and this is a worked instance of it.

  LUMP-VS-SPLIT versus sarcomeric HCM. `kb/disorders/Hypertrophic_Cardiomyopathy.yaml`
  already covers sarcomere-protein-gene HCM. PRKAG2 cardiac syndrome is
  deliberately kept SPLIT from it rather than folded in as a subtype, because the
  two share only the gross phenotype (increased left ventricular wall thickness)
  and differ at every mechanistic level that dismech models: the primary lesion
  (nucleotide-sensing regulatory subunit vs. contractile sarcomere protein), the
  proximate cause of the increased mass (intracellular glycogen and water vs.
  myocyte hypertrophy with disarray), the histopathology (vacuolated myocytes
  with diastase-resistant polyglucosan and minimal fibrosis vs. myofibre disarray
  with interstitial fibrosis), the characteristic electrophysiology (anatomically
  mediated accessory atrioventricular connections plus degenerative conduction
  disease, both atypical of sarcomeric HCM), and the management implications
  (early pacing, accessory-pathway ablation, and transplant referral rather than
  sarcomere-directed therapy). Arad et al. explicitly established this
  distinction (PMID:15673802, PMID:11827995). The other two classic
  hypertrophy-with-pre-excitation phenocopies are also separate entries:
  `Danon_disease` (LAMP2, X-linked, lysosomal, with retinopathy and skeletal
  myopathy) and `Fabry_Disease` (GLA, X-linked, glycosphingolipid rather than
  glycogen storage, with systemic angiokeratoma/renal/neuropathic features).

  MODULE CONFORMANCE DECISIONS. Two cardiac mechanism modules were evaluated.
  (1) `cardiac_ion_channel_repolarization` - NOT conformed to. That module models
  arrhythmia arising from ion-channel/calcium-handling variants altering action
  potential duration in structurally normal hearts. PRKAG2 pre-excitation is
  anatomical, not electrophysiological in that sense: the substrate is a physical
  breach of the annulus fibrosus by glycogen-engorged myocytes creating
  microscopic atrioventricular muscle continuity (PMID:12782567), and the
  bradyarrhythmia arm is degenerative conduction-tissue infiltration, not
  pacemaker-channel loss of function. Declaring conformance would misrepresent
  the mechanism. An emerging AMPK-gamma2/myosin calcium-handling arm
  (PMID:42422944) does touch action-potential and calcium-transient duration, but
  it is a zebrafish finding under an EMERGING hypothesis and is too preliminary
  to anchor a module conformance claim.
  (2) `cardiomyopathy_maladaptive_remodeling` - conformed to PARTIALLY, only at
  the two late nodes. The module's upstream chain (primary contractile insult to
  neurohormonal activation to ventricular remodeling) does not describe PRKAG2
  hypertrophy, which is storage-driven mass accrual - "excess glycogen storage
  and water in cardiomyocytes appear to account for increased cardiac mass"
  (PMID:11827995) - not neurohormonally driven remodeling of a failing ventricle.
  But the late course does converge on the module: after decades the hypertrophic
  phase gives way to progressive contractile dysfunction, heart failure
  admission, transplantation, and death (PMID:32646569). Conformance is therefore
  declared only on "Progressive Contractile Dysfunction" and "Advanced Heart
  Failure and End-Stage Cardiomyopathy".

  DEEP RESEARCH PROVENANCE. A Claude Code deep-research report was generated
  (`research/PRKAG2_Cardiac_Syndrome-deep-research-claude_code.md`) and used as a
  lead-generation source only. Two of its assertions were checked against
  authoritative sources and REJECTED: it gave the PRKAG2 HGNC ID as HGNC:9385
  (OAK confirms hgnc:9386), and it described the biopsy glycogen as
  "diastase-sensitive" (the primary source, PMID:11827995, reports the inclusions
  as PAS-positive and diastase-RESISTANT, i.e. polyglucosan - which is the whole
  diagnostic point). It also asserted flatly that all PRKAG2 variants are
  gain-of-function; this entry does not take that side (see
  `mechanistic_hypotheses`). Every PMID and snippet in this file was
  independently fetched and verified against the cached reference.

  EXTRACARDIAC SCOPE. The disease is cardiac-dominant, but this entry does NOT
  claim the phenotype is cardiac-exclusive. A neurocognitive/psychiatric cluster
  and an obstetric cluster are curated below from the single study that reports
  them systematically (PMID:39082507, a 66-member Brazilian p.K290I kindred
  followed 18 years), with the single-kindred provenance stated on each entry and
  no `frequency:` band asserted, because the paper's denominators mix carriers,
  pregnancies, and deliveries and a band cannot be read off it without inventing a
  denominator. Two further extracardiac signals named in the deep-research report
  are deliberately NOT curated: (i) skeletal-muscle glycogen storage/myopathy,
  which the report itself describes as inconsistently observed and absent from the
  Brazilian cohort, and for which no primary paper with a quotable PRKAG2-specific
  abstract sentence was located; and (ii) liver cirrhosis, a single-family
  observation the report cites only as a PMC link with no PMID. Both are recorded
  here as known gaps rather than curated on weak sourcing.

  HPO TERM-SEARCH RECORD for the obstetric cluster, all run 2026-08-01 with
  `uv run runoak -i sqlite:obo:hp`. (1) `search 'l~abortion'` returns exactly two
  classes, HP:0030449 (Therapeutic abortion) and HP:0200067 (Recurrent spontaneous
  abortion); there is no generic "spontaneous abortion" class. HP:0200067 was
  audited and rejected on two grounds - the source reports two abortions across a
  whole kindred rather than recurrent loss in one individual, and `ancestors
  HP:0200067 -p i` places it under HP:0032443 (Past medical history), not under
  HP:0000118, so it is not a legal `PhenotypeTerm` value in this schema. (2)
  `search 'l~neonatal death'`, `'l~death in infancy'`, `'l~perinatal death'`, and
  `'l~fetal death'` together return only HP:0003811 (Neonatal death) and
  HP:0001522 (Death in infancy); `ancestors` shows both sit under HP:0040006
  (Mortality/Aging) in the Clinical-modifier subontology, which is likewise not
  reachable from HP:0000118. HP:0003811 was tried first and rejected by `just
  validate-terms` for exactly this reason. (3) The operative-delivery component
  does have a usable class: `ancestors HP:0011411 -p i` resolves through
  HP:0001787 (Abnormal delivery) and HP:0001197 to HP:0000118. The obstetric
  phenotype is therefore anchored on HP:0001787, with the pregnancy-loss and
  neonatal-death observations carried in its description. This is an HPO/schema
  coverage limitation, not an absence of evidence.

  PREVALENCE SCOPE. A second `prevalence` record now carries the referral-cohort
  figure (0.23-1% among patients with left ventricular hypertrophy, PMID:39273120)
  alongside the original UNKNOWN population-prevalence record. The two are not the
  same quantity and are deliberately kept as separate records rather than merged.

has_subtypes:
- name: Lethal Congenital
  display_name: Lethal congenital cardiac glycogenosis (OMIM 261740)
  subtype_term:
    preferred_term: lethal congenital glycogen storage disease of heart
    term:
      id: MONDO:0009867
      label: lethal congenital glycogen storage disease of heart
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0009867
        label: lethal congenital glycogen storage disease of heart
      mapping_predicate: skos:exactMatch
      mapping_source: OMIM:261740
      mapping_justification: >-
        NEC-checked with `runoak -i sqlite:obo:mondo info MONDO:0009867 -O obo`
        (2026-08-01). MONDO:0009867 carries xref OMIM:261740, is asserted `is_a
        MONDO:0800484` (the parent entity of this entry), and has the gene
        association RO:0004003 HGNC:9386 - PRKAG2, not another gene. It is
        therefore the correct MONDO node for the lethal congenital form and is a
        genuine child of the curated disease, unlike MONDO:0859372 (KLHL24/CMH29),
        which is documented above as a rejected mapping.
  description: >-
    The severe end of the PRKAG2 severity spectrum, and the form that makes this
    disease's genotype-phenotype axis prognostically consequential. Recurrent
    heterozygous p.Arg531Gln (R531Q) substitutions in the third CBS domain produce
    a massive non-lysosomal cardiac glycogenosis with symptomatic onset already in
    fetal life and a rapidly fatal course, rather than the juvenile-to-adult
    presentation of the classic triad. The molecular lesion is the same class of
    nucleotide-sensing defect as in the milder alleles, but quantitatively far more
    extreme - the R531Q protein loses AMP and ATP binding affinity by more than two
    orders of magnitude while gaining basal kinase activity, and the authors of the
    defining study explicitly describe the classic hypertrophic-cardiomyopathy
    alleles as producing perturbations "similar to--but less severe than" R531Q.
    Note the striking allelic contrast at the same codon: p.Arg531Gly causes
    childhood-onset pre-excitation and conduction disease WITHOUT hypertrophy
    (curated under `genetic.variants`), so residue 531 alone spans the full range
    from a hypertrophy-free electrical phenotype to neonatal death. Historically
    this form was misattributed to a heart-specific phosphorylase kinase
    deficiency; the defining study found no phosphorylase kinase mutations and
    reassigned the aetiology to PRKAG2, which is why MONDO:0009867 still carries
    "phosphorylase kinase deficiency of heart" as a synonym.
  genes:
  - preferred_term: PRKAG2
    term:
      id: hgnc:9386
      label: PRKAG2
  evidence:
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent heterozygous R531Q missense mutations in PRKAG2 give rise to a massive nonlysosomal cardiac glycogenosis of fetal symptomatic onset and rapidly fatal course, constituting a genotypically and clinically distinct variant of hypertrophic cardiomyopathy with Wolff-Parkinson-White syndrome"
    explanation: >-
      Establishes the lethal congenital form as a distinct, R531Q-associated
      severity extreme of PRKAG2 disease with fetal onset and a rapidly fatal
      course.
  - reference: PMID:15877279
    reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fatal congenital nonlysosomal cardiac glycogenosis has been attributed to a subtype of phosphorylase kinase deficiency, but the underlying genes and mutations have not been identified."
    explanation: >-
      Documents the historical phosphorylase-kinase-deficiency attribution that
      the same study overturns, explaining the surviving MONDO/OMIM synonym.

mechanistic_hypotheses:
- hypothesis_group_id: constitutive_ampk_activation
  hypothesis_label: Constitutive/Inappropriate AMPK Activation Model
  status: ALTERNATIVE
  description: >-
    CBS-domain variants relieve the normal adenine-nucleotide-dependent
    autoinhibition of the AMPK heterotrimer, leaving the kinase inappropriately
    active in the ATP-replete cardiomyocyte. Chronic AMPK activity drives GLUT4
    translocation, glucose uptake, and glycogen synthase activity, so glycogen
    accumulates. This is the model supported by the yeast Snf4 two-hybrid data
    and by the N488I transgenic mouse, which shows elevated cardiac AMPK activity
    together with 30-fold glycogen accumulation.
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We interpret these data to indicate that Thr400Asn and Asn488Ile mutations produce nonphysiologic, constitutive activation of AMP kinase."
    explanation: >-
      Human PRKAG2 substitutions engineered into the yeast orthologue Snf4
      produced glucose-insensitive Snf1-Snf4 interaction, interpreted by the
      authors as constitutive kinase activation. Evidence source is IN_VITRO
      because this is a yeast two-hybrid/reporter assay, not an animal study.
  - reference: PMID:12782567
    reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transgenic mutant mice showed elevated AMP-activated protein kinase activity, accumulated large amounts of cardiac glycogen (30-fold above normal), developed dramatic left ventricular hypertrophy, and exhibited ventricular preexcitation and sinus node dysfunction."
    explanation: >-
      The N488I transgenic mouse directly couples elevated cardiac AMPK activity
      to massive glycogen accumulation and the full clinical triad, the central
      prediction of the activation model. Evidence source is MODEL_ORGANISM
      because this is transgenic mouse work.
- hypothesis_group_id: ampk_loss_of_function
  hypothesis_label: Impaired AMP Sensing / Loss-of-Function Model
  status: ALTERNATIVE
  description: >-
    The same CBS-domain variants can be read as damaging the AMP-binding site
    rather than releasing autoinhibition, so the kinase loses its ability to be
    activated by rising AMP. Purified mutant complexes are not constitutively
    active but show markedly reduced AMP dependence, and the R302Q transgenic
    mouse - which reproduces the full human phenotype including inducible
    orthodromic atrioventricular reentrant tachycardia - has significantly
    REDUCED cardiac AMPK activity. This is the direct opposite of the activation
    model, and the field has not resolved which applies, or whether the direction
    is variant-, tissue-, and developmental-stage-specific.
  evidence:
  - reference: PMID:12397075
    reference_title: "Functional analysis of mutations in the gamma 2 subunit of AMP-activated protein kinase associated with cardiac hypertrophy and Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in the absence of an appropriate stimulus the mutant complexes, like the wild-type complex, exist in an inactive form demonstrating that the mutations do not lead to constitutive activation of the kinase"
    explanation: >-
      Direct biochemical assay of reconstituted mutant AMPK complexes refutes
      constitutive activation and instead localises the defect to AMP
      responsiveness, the core claim of the loss-of-function model.
  - reference: PMID:15611370
    reference_title: "Transgenic mouse model of ventricular preexcitation and atrioventricular reentrant tachycardia induced by an AMP-activated protein kinase loss-of-function mutation responsible for Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Enzymatic activity of AMPK in the mutant heart was significantly reduced (0.009+/-0.003 versus 0.025+/-0.001 nmol x min(-1) x g(-1) in nontransgenic mice), presumably owing to the mutation disrupting the AMP binding site."
    explanation: >-
      In the R302Q transgenic mouse, which phenocopies the human disease, cardiac
      AMPK activity is reduced rather than elevated, attributed by the authors to
      disruption of the AMP binding site. Evidence source is MODEL_ORGANISM
      because this is transgenic mouse work.
  - reference: PMID:12397075
    reference_title: "Functional analysis of mutations in the gamma 2 subunit of AMP-activated protein kinase associated with cardiac hypertrophy and Wolff-Parkinson-White syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These results indicate that mutations in gamma(2) have different effects on AMPK function, suggesting that they may lead to abnormal development of the heart through distinct mechanisms."
    explanation: >-
      Supports the reconciling possibility that different PRKAG2 variants act by
      genuinely different mechanisms, rather than one direction being correct for
      all of them. Marked PARTIAL because it argues against a single unified
      model rather than affirmatively supporting the loss-of-function direction.
- hypothesis_group_id: glycogen_independent_myosin_interaction
  hypothesis_label: Glycogen-Independent AMPK-gamma2/Myosin Interaction Model
  status: EMERGING
  description: >-
    A recent transgenic zebrafish study reports that variant AMPK-gamma2 binds
    myosin more avidly and relocalises to the myofilament, producing hypertrophy
    and electrophysiological abnormalities (slowed conduction, prolonged action
    potential and calcium-transient duration) at a developmental stage BEFORE any
    glycogen has accumulated, and not rescued by AMPK activation. If it holds in
    mammals, this would mean glycogen storage is not the sole proximate cause of
    the cardiac phenotype and would add a myofilament calcium-handling arm
    upstream of, or parallel to, the storage cascade. Preliminary and not yet
    replicated in human tissue.
  evidence:
  - reference: PMID:42422944
    reference_title: "AMPKγ2 Regulates Cardiac Hypertrophy and Arrhythmias via Interacting With Myosin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The PRKAG2 variant altered cardiac excitability, contractility, and Ca2+ handling during cardiogenesis, independent of glycogen accumulation."
    explanation: >-
      States the model's defining claim: a glycogen-independent route from the
      PRKAG2 variant to the cardiac electrical and contractile phenotype.
      Evidence source is MODEL_ORGANISM because this is transgenic zebrafish work.
  - reference: PMID:42422944
    reference_title: "AMPKγ2 Regulates Cardiac Hypertrophy and Arrhythmias via Interacting With Myosin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proximity ligation assays and coimmunoprecipitation identified a physical interaction between AMPKγ2 and myosin, enhanced by the R299Q variant and accompanied by increased AMPKγ2 localization to the myofilament."
    explanation: >-
      Provides the proposed molecular basis - variant-enhanced AMPK-gamma2
      binding to myosin with myofilament relocalisation. Evidence source is
      IN_VITRO rather than MODEL_ORGANISM because proximity ligation and
      co-immunoprecipitation are biochemical assays performed on harvested
      tissue outside the organism, even though the tissue came from transgenic
      zebrafish.

pathophysiology:
- name: PRKAG2 Missense Variant in the AMPK Gamma-2 CBS Domains
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous germline missense variant in PRKAG2 alters a highly conserved
    residue within, or immediately adjacent to, the tandem
    cystathionine-beta-synthase (CBS/Bateman) domains of the AMPK gamma-2
    regulatory subunit. These
    domains constitute the adenine-nucleotide-sensing module that binds AMP, ADP,
    and ATP competitively and thereby sets the activation state of the alpha
    catalytic subunit. Recurrent alleles include p.Arg302Gln (the most frequently
    reported, in CBS1), p.Asn488Ile, p.Thr400Asn, and p.Arg531Gly. The variants
    do not abolish assembly of the heterotrimer; they corrupt its
    nucleotide-dependent regulation.
  gene:
    preferred_term: PRKAG2
    term:
      id: hgnc:9386
      label: PRKAG2
  molecular_functions:
  - preferred_term: AMP binding by the gamma-2 CBS domains
    term:
      id: GO:0016208
      label: AMP binding
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:11407343
    reference_title: "Identification of a gene responsible for familial Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense mutation in the gene that encodes the gamma2 regulatory subunit of AMP-activated protein kinase (PRKAG2). The mutation results in the substitution of glutamine for arginine at residue 302 in the protein."
    explanation: >-
      The original linkage study identifying PRKAG2 p.Arg302Gln as the cause of
      familial ventricular pre-excitation with hypertrophy.
  - reference: PMID:12397075
    reference_title: "Functional analysis of mutations in the gamma 2 subunit of AMP-activated protein kinase associated with cardiac hypertrophy and Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two of these mutations lead to a marked decrease in AMP dependence, whereas the third reduces AMP sensitivity. These findings suggest that the CBS domains play an important role in AMP-binding within the complex."
    explanation: >-
      Localises the functional lesion of the disease-causing variants to AMP
      binding within the CBS domains, the defining feature of this node.
  downstream:
  - target: Dysregulated AMPK Nucleotide Sensing
    causal_link_type: DIRECT
    description: >-
      Corruption of the CBS nucleotide-binding module directly deranges the
      allosteric regulation of the AMPK heterotrimer.

- name: Dysregulated AMPK Nucleotide Sensing
  biological_scale: MOLECULAR
  role: central_effector
  description: >-

name: PRKAG2 Cardiac Syndrome
creation_date: "2026-07-31T00:00:00Z"
synonyms:
- PRKAG2 syndrome
- PRKAG2 cardiomyopathy
- PRKAG2-related cardiomyopathy
- Glycogen storage cardiomyopathy due to PRKAG2 mutation
- Familial Wolff-Parkinson-White syndrome with cardiac hypertrophy
- Hypertrophic cardiomyopathy 6
- CMH6
- PRKAG2 hypertrophic cardiomyopathy
- Cardiomyopathy, familial hypertrophic, 6
description: >-
  PRKAG2 cardiac syndrome is a rare autosomal dominant, non-lysosomal glycogen
  storage disease of the heart caused by missense variants in PRKAG2, which
  encodes the gamma-2 regulatory subunit of AMP-activated protein kinase (AMPK).
  Variants cluster in the tandem cystathionine-beta-synthase (CBS) domains that
  form the adenine-nucleotide-sensing module of the gamma subunit, disrupting
  normal AMP/ADP/ATP-dependent regulation of the kinase. The result is excessive
  accumulation of glycogen and polyglucosan (amylopectin-like) material inside
  cardiomyocytes, which produces the disease's characteristic clinical triad:
  left ventricular hypertrophy that mimics sarcomeric hypertrophic
  cardiomyopathy, ventricular pre-excitation (Wolff-Parkinson-White syndrome)
  arising from glycogen-laden myocytes breaching the annulus fibrosus, and
  progressive degenerative conduction-system disease leading to atrioventricular
  block and early pacemaker dependence. It is a genocopy - not a form - of
  sarcomeric hypertrophic cardiomyopathy, and endomyocardial biopsy separates the
  two: PRKAG2 hearts show vacuolated myocytes with PAS-positive,
  diastase-resistant polyglucosan inclusions, minimal fibrosis, and an absence of
  the myofibre disarray that defines sarcomeric HCM.
category: Mendelian
parents:
- Cardiovascular Disease
- Genetic Disorder
- Metabolic Disorder
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  icimd_category:
  - classification_value: glycogen_metabolism
    notes: >-
      PRKAG2 cardiac syndrome is a non-lysosomal cardiac glycogenosis: the
      primary biochemical lesion is dysregulated AMPK control of myocardial
      glycogen synthesis, producing intracytoplasmic glycogen and polyglucosan
      storage. It is distinguished from the enzyme-deficiency glycogen storage
      diseases (Pompe/GAA, GSD IV/GBE1) and from the lysosomal trafficking
      defect of Danon disease (LAMP2), which are separate entries.

- name: Enhanced AMPK-gamma2/Myosin Interaction
  biological_scale: MOLECULAR
  role: alternative_effector
  description: >-
    Under the emerging glycogen-independent model, variant AMPK-gamma2 binds
    myosin more strongly and relocalises to the myofilament. The proposed
    consequence is retention of calcium at the myofilament, reducing the free
    cytosolic calcium available for sodium/calcium-exchanger extrusion and
    thereby prolonging the calcium transient and action potential. This arm is
    reported only in transgenic zebrafish and is curated as EMERGING; it is not
    asserted as an established human mechanism.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:

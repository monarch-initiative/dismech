- name: Disruption of the Annulus Fibrosus by Glycogen-Laden Myocytes
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The annulus fibrosus of the cardiac skeleton is the fibrous ring that
    electrically insulates the atria from the ventricles, restricting normal
    atrioventricular conduction to the AV node. Glycogen-engorged cardiomyocytes
    breach this ring, creating microscopic strands of muscle continuity across
    it. This is the single most mechanistically distinctive feature of PRKAG2
    disease: the pre-excitation is ANATOMICAL in origin - a failure of insulation
    - rather than a morphologically discrete accessory bundle as in idiopathic
    Wolff-Parkinson-White syndrome, and rather than an ion-channel abnormality.
    The same mechanism was proposed to explain pre-excitation in other glycogen
    storage cardiomyopathies including Pompe and Danon disease.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: Annulus fibrosus of the heart
    term:
      id: UBERON:0004292
      label: cardiac skeleton
  evidence:
  - reference: PMID:12782567
    reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

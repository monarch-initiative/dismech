    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recently, we identified the genetic cause of a familial arrhythmogenic syndrome characterized by ventricular preexcitation and tachyarrhythmias (Wolff-Parkinson-White syndrome), progressive conduction system disease, and cardiac hypertrophy."
    explanation: >-
      Names WPW as a defining component of the PRKAG2 triad. Evidence source is
      OTHER because this is a narrative review summarising the authors' prior
      work rather than reporting primary data.
  - reference: PMID:11748095

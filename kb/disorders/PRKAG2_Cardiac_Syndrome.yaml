histopathology:
- name: PAS-positive, diastase-resistant polyglucosan inclusions in cardiomyocytes
  diagnostic: true
  description: >-
    The defining microscopic finding of PRKAG2 cardiac syndrome. Cardiomyocyte
    vacuoles contain granular material that stains strongly with periodic
    acid-Schiff and, critically, RESISTS diastase digestion. Diastase removes
    ordinary glycogen; resistance therefore identifies the stored material as
    polyglucosan (an amylopectin-like, poorly branched, poorly soluble
    polysaccharide) rather than simple glycogen. Electron microscopy confirms
    densely packed granular and fibrillar electron-dense material characteristic
    of amylopectin. This single stain pair separates PRKAG2 disease from
    sarcomeric HCM and, together with the clinical context, from Danon and Pompe
    disease.
  finding_term:
    preferred_term: PAS-positive diastase-resistant polyglucosan inclusion
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was diastase-resistant, a pattern that is characteristic of polyglucan"
    explanation: >-
      Establishes diastase resistance of the PAS-positive inclusions in human
      PRKAG2 cardiac specimens, identifying the stored material as polyglucosan.
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "features that are characteristic of amylopectin, a nonsoluble product of glycogen metabolism"
    explanation: >-
      Ultrastructural confirmation that the inclusions have the features of
      amylopectin, corroborating the histochemical finding.

- name: Vacuolated cardiomyocytes
  diagnostic: true
  description: >-
    Large isolated cytosolic vacuoles within enlarged cardiomyocytes, present in
    every human specimen examined in the defining pathological series. The
    vacuoles are non-lysosomal, distinguishing the storage compartment from that
    of Danon disease (autophagic vacuoles with sarcolemmal features) and Pompe
    disease (lysosomal).
  finding_term:
    preferred_term: cardiomyocyte cytoplasmic vacuolation
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all five specimens demonstrated isolated, large cytosolic vacuoles in cardiomyocytes"
    explanation: >-
      Documents the vacuolation in all five human PRKAG2 cardiac specimens
      examined.

- name: Absence of myofibre disarray
  diagnostic: true
  description: >-
    Myofibre (myocyte) disarray, the histological signature of sarcomeric
    hypertrophic cardiomyopathy, is ABSENT in PRKAG2 hearts, and interstitial
    fibrosis is minimal and focal. This negative finding carries as much
    diagnostic weight as the positive storage findings, and is the histological
    basis for treating PRKAG2 disease as a genocopy of HCM rather than a form of
    it.
  finding_term:
    preferred_term: absence of myofibre disarray
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "myofiber disarray, the characteristic feature of HCM, was not detected in any sample"
    explanation: >-
      Direct statement that the defining histological feature of sarcomeric HCM
      is absent from PRKAG2 cardiac specimens.
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interstitial fibrosis was minimal and focal."
    explanation: >-
      Documents the minimal fibrosis that accompanies the absence of disarray,
      further separating PRKAG2 disease from sarcomeric HCM.

- name: Positive glycogen staining on endomyocardial biopsy
  description: >-
    In life, endomyocardial biopsy demonstrating positive glycogen staining
    supports the diagnosis of a cardiac glycogenosis in a patient with otherwise
    unexplained hypertrophy.
  finding_term:
    preferred_term: glycogen-positive staining
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:40149727
    reference_title: "PRKAG2 Syndrome: Clinical Features, Imaging Findings and Cardiac Events."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the EMB of one of the patients, staining for glycogen deposits was positive."
    explanation: >-
      Contemporary cohort documenting positive glycogen staining on
      endomyocardial biopsy in a PRKAG2 carrier.

genetic:
- name: PRKAG2
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PRKAG2
    term:
      id: hgnc:9386
      label: PRKAG2
  notes: >-
    PRKAG2 (7q36.1) encodes the gamma-2 regulatory subunit of AMP-activated
    protein kinase. Essentially all reported disease-causing variants are
    heterozygous missense substitutions affecting the tandem CBS (Bateman)
    domains that bind AMP, ADP, and ATP; truncating and loss-of-expression
    alleles are not an established mechanism, consistent with a dominant
    mechanism acting through an altered rather than absent protein. De novo
    variants are reported.
  case_fractions:
  - population: Patients with increased left ventricular wall thickness AND ECG ventricular pre-excitation
    case_fraction_percent: 29.2
    cohort_size: 24
    notes: >-
      Seven of 24 probands selected for the combination of increased wall
      thickness plus pre-excitation carried a PRKAG2 variant (a further four
      carried LAMP2 variants). This enrichment is the empirical basis for
      prioritising PRKAG2 testing in exactly this clinical subgroup, and stands
      in sharp contrast to the yield in hypertrophy without pre-excitation.
    evidence:
    - reference: PMID:15673802
      reference_title: "Glycogen storage diseases presenting as hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analyses of 24 subjects with increased left ventricular wall thickness and electrocardiograms suggesting ventricular preexcitation revealed four LAMP2 and seven PRKAG2 mutations."
      explanation: >-
        Gives the numerator and denominator (7 of 24) for the PRKAG2 case
        fraction in the hypertrophy-plus-pre-excitation subgroup.
  - population: Patients with massive left ventricular hypertrophy WITHOUT electrophysiological abnormalities
    case_fraction_percent: 0.0
    cohort_size: 20
    notes: >-
      No PRKAG2 (or LAMP2) variant was found in 20 subjects with wall thickness
      of 30 mm or more but no electrophysiological abnormality - the negative
      control that shows the diagnostic yield is driven by the electrophysiology,
      not by the severity of the hypertrophy.
    evidence:
    - reference: PMID:15673802
      reference_title: "Glycogen storage diseases presenting as hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analyses of 20 subjects with massive hypertrophy (left ventricular wall thickness, > or =30 mm) but without electrophysiological abnormalities revealed mutations in neither LAMP2 nor PRKAG2."
      explanation: >-
        Establishes a zero case fraction in severe hypertrophy lacking
        electrophysiological abnormality.
  variants:
  - name: p.Arg302Gln
    description: >-
      The most frequently reported PRKAG2 allele, affecting the first CBS domain.
      Identified in the original linkage study of familial Wolff-Parkinson-White
      syndrome with hypertrophy and recurrent across many unrelated families and
      populations. It is the allele modelled by the R302Q transgenic mouse.
    evidence:
    - reference: PMID:11407343
      reference_title: "Identification of a gene responsible for familial Wolff-Parkinson-White syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a missense mutation in the gene that encodes the gamma2 regulatory subunit of AMP-activated protein kinase (PRKAG2). The mutation results in the substitution of glutamine for arginine at residue 302 in the protein."
      explanation: >-
        Original identification of p.Arg302Gln as the cause of the familial
        syndrome.
  - name: p.Asn488Ile
    description: >-
      A recurrent allele lying in the linker region between CBS domains, and the
      variant expressed in the principal transgenic mouse model. Segregated with
      disease in study families.
    evidence:
    - reference: PMID:12782567
      reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we constructed transgenic mice overexpressing the PRKAG2 cDNA with or without a missense N488I human mutation"
      explanation: >-
        Establishes p.Asn488Ile as the human variant modelled in the defining
        transgenic mouse study.
  - name: p.Thr400Asn
    description: >-
      A CBS-domain allele found in a proband with no other affected family
      members and possibly de novo. Together with p.Asn488Ile it is one of the
      two substitutions whose yeast-orthologue equivalents produced
      glucose-insensitive Snf1-Snf4 interaction.
    evidence:
    - reference: PMID:11827995
      reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We interpret these data to indicate that Thr400Asn and Asn488Ile mutations produce nonphysiologic, constitutive activation of AMP kinase."
      explanation: >-
        Functional characterisation of p.Thr400Asn in the yeast orthologue
        system.
  - name: p.Arg531Gly
    description: >-
      A CBS-domain allele causing childhood-onset ventricular pre-excitation,
      early atrial fibrillation, and conduction disease WITHOUT cardiac
      hypertrophy - evidence that the electrical phenotype can be fully
      dissociated from the hypertrophic one. Absent from 150 unrelated controls.
    evidence:
    - reference: PMID:11748095
      reference_title: "Novel PRKAG2 mutation responsible for the genetic syndrome of ventricular preexcitation and conduction system disease with childhood onset and absence of cardiac hypertrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A missense mutation, Arg531Gly, was identified in all affected individuals but was absent in 150 unrelated individuals."
      explanation: >-
        Establishes segregation and control absence for p.Arg531Gly.
    - reference: PMID:11748095
      reference_title: "Novel PRKAG2 mutation responsible for the genetic syndrome of ventricular preexcitation and conduction system disease with childhood onset and absence of cardiac hypertrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We now report a novel mutation in PRKAG2 causing Wolff-Parkinson-White syndrome and conduction system disease with onset in childhood and the absence of cardiac hypertrophy."
      explanation: >-
        Documents the hypertrophy-free, childhood-onset presentation of this
        allele.
  - name: p.Arg531Gln
    description: >-
      The recurrent CBS3-domain allele of the lethal congenital form (see
      `has_subtypes` "Lethal Congenital", MONDO:0009867 / OMIM:261740). Found as an
      identical de-novo-appearing heterozygous substitution in three of five
      sporadic, unrelated infants with fatal congenital non-lysosomal cardiac
      glycogenosis. Biochemically it is the most extreme PRKAG2 allele
      characterised: the recombinant protein loses AMP and ATP binding affinity by
      more than 100-fold while showing enhanced basal kinase activity. The same
      study frames the classic juvenile-to-adult PRKAG2 alleles as producing
      qualitatively similar but less severe molecular perturbations, which is the
      quantitative basis for the severity spectrum. Contrast p.Arg531Gly at the
      identical codon, which causes hypertrophy-free childhood-onset
      pre-excitation - residue 531 alone spans the full clinical range of the
      disease.
    evidence:
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in three of five patients, we identified identical heterozygous R531Q missense mutations of the PRKAG2 gene"
      explanation: >-
        Establishes p.Arg531Gln as a recurrent allele in sporadic fatal congenital
        cardiac glycogenosis, with the numerator and denominator of that series.
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Biochemical characterization of the recombinant R531Q mutant protein showed >100-fold reduction of binding affinities for the regulatory nucleotides AMP and ATP but an enhanced basal activity"
      explanation: >-
        Recombinant-protein assay quantifying the nucleotide-binding defect and
        raised basal activity of p.Arg531Gln; cell-free biochemistry, hence
        IN_VITRO rather than HUMAN_CLINICAL.
    - reference: PMID:15877279
      reference_title: "Fatal congenital heart glycogenosis caused by a recurrent activating R531Q mutation in the gamma 2-subunit of AMP-activated protein kinase (PRKAG2), not by phosphorylase kinase deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "molecular perturbations that are similar to--but less severe than--those observed for the R531Q mutation"
      explanation: >-
        The study's own cross-allele comparison, which is the stated basis for
        placing p.Arg531Gln at the severe extreme of a continuous PRKAG2 severity
        spectrum rather than treating it as a mechanistically separate disease.
        Classified OTHER because it is the authors' comparative interpretation
        across their biochemical and the prior clinical literature, not a single
        study arm.
  evidence:
  - reference: PMID:11407343
    reference_title: "Identification of a gene responsible for familial Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a missense mutation in the gene that encodes the gamma2 regulatory subunit of AMP-activated protein kinase (PRKAG2). The mutation results in the substitution of glutamine for arginine at residue 302 in the protein."
    explanation: >-
      Establishes PRKAG2 as the causative gene by positional cloning in two
      independent families.

inheritance:
- name: Autosomal dominant
  description: >-
    PRKAG2 cardiac syndrome segregates as an autosomal dominant trait with
    variable expressivity and age-dependent penetrance. Affected individuals are
    heterozygous for a missense variant; de novo occurrence is reported.
    Expressivity within a single family ranges from isolated pre-excitation
    without hypertrophy to progressive hypertrophy with early pacing and heart
    failure.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:11407343
    reference_title: "Identification of a gene responsible for familial Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two families in which the Wolff-Parkinson-White syndrome segregated as an autosomal dominant disorder."
    explanation: >-
      Direct statement of autosomal dominant segregation in the founding linkage
      study.
  - reference: PMID:28431061
    reference_title: "High prevalence of arrhythmic and myocardial complications in patients with cardiac glycogenosis due to PRKAG2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are responsible for an autosomal dominant glycogenosis with a cardiac presentation, associating hypertrophic cardiomyopathy (HCM), ventricular pre-excitation (VPE), and progressive heart block"
    explanation: >-
      Independent confirmation of the autosomal dominant mode alongside the
      clinical triad.

prevalence:
- population: Patients with increased left ventricular wall thickness and ECG ventricular pre-excitation
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    True population prevalence of PRKAG2 cardiac syndrome is not established; the
    disease is ultra-rare and no population-based estimate exists. What IS
    quantified is the diagnostic yield within clinically selected subgroups,
    which is the epidemiological figure that actually drives practice - see the
    structured `case_fractions` under `genetic` for the 7-of-24 yield in
    hypertrophy plus pre-excitation and the 0-of-20 yield in severe hypertrophy
    without electrophysiological abnormality. `measure_type` and
    `prevalence_class` are recorded as UNKNOWN rather than guessed, because a
    diagnostic yield in a referral subgroup is not a population prevalence and
    the two must not be conflated.
  evidence:
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only a small number of cases have been reported to date, and the natural history of the disease is poorly understood."
    explanation: >-
      Supports the characterisation of the disease as ultra-rare with an
      unestablished population prevalence, as of the largest cohort study.
- population: Patients with left ventricular hypertrophy (clinical referral population, not the general population)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 230.0
  rate_high: 1000.0
  notes: >-
    Verbatim source phrasing: "Its estimated prevalence among patients with LVH
    ranges from 0.23 to about 1%, but it is likely an underdiagnosed condition."
    0.23-1 percent converts to 230-1000 cases per 100,000 OF THAT REFERRAL
    POPULATION, which is why `prevalence_class` falls in the ABOVE_1_IN_1000 tier
    even though the disease is ultra-rare in the general population. This record is
    deliberately kept SEPARATE from the UNKNOWN population-prevalence record above
    and must not be read as a population rate: the denominator is people already
    selected for having left ventricular hypertrophy, so the figure is a diagnostic
    yield in a referral cohort. Provenance caveat: the source is a case report with
    literature review and states the range as an estimate synthesised from the
    literature, not as a primary cohort measurement; `evidence_source` is therefore
    OTHER. No single-cohort primary measurement giving a clean PRKAG2-specific
    numerator and denominator in an unselected HCM population was located
    (PubMed 2026-08-01, "PRKAG2 prevalence hypertrophic cardiomyopathy cohort" and
    a Europe PMC full-text search for PRKAG2 AND "0.23%"): the candidates audited
    and rejected were PMID:28771489, which pools PRKAG2 with five other minor genes
    into a single count of 12 patients; PMID:30775854, which pools GLA and PRKAG2
    into a single count of three patients; and PMID:41998504, whose "0.7% of the
    cohort" is internally inconsistent with its own denominators (the companion
    TTR/GLA percentages in the same sentence reconcile only against the 453
    positive samples, not the 2068 tested patients), so quoting it would require
    inventing a denominator.
  evidence:
  - reference: PMID:39273120
    reference_title: "When Paying Attention Pays Back: Missense Mutation c.1006G>A p. (Val336Ile) in PRKAG2 Gene Causing Left Ventricular Hypertrophy and Conduction Abnormalities in a Caucasian Patient: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Its estimated prevalence among patients with LVH ranges from 0.23 to about 1%, but it is likely an underdiagnosed condition."
    explanation: >-
      States the referral-population prevalence range and its denominator
      (patients with left ventricular hypertrophy) directly, and simultaneously
      flags underdiagnosis, which is why the range is not promoted to a population
      prevalence. Graded OTHER because it is a narrative literature-review estimate
      in a case report rather than primary cohort data.

diagnosis:
- name: Twelve-lead electrocardiography
  description: >-
    The first and highest-yield test. A short PR interval with a delta wave
    identifies ventricular pre-excitation; serial ECGs show progressive PR
    prolongation and increasing degrees of atrioventricular block, and may show
    sinus bradycardia or atrial fibrillation. Pre-excitation or early conduction
    disease in a patient carrying a label of hypertrophic cardiomyopathy is the
    trigger to consider PRKAG2 disease.
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:15673802
    reference_title: "Glycogen storage diseases presenting as hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The glycogen-storage cardiomyopathy produced by LAMP2 or PRKAG2 mutations resembles hypertrophic cardiomyopathy but is distinguished by electrophysiological abnormalities, particularly ventricular preexcitation."
    explanation: >-
      Establishes the electrocardiographic finding of pre-excitation as the
      discriminator between glycogen storage cardiomyopathy and sarcomeric HCM.
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classical features of pre-excitation and severe LVH are not uniformly present, and diagnosis should be considered in patients with LVH who develop atrial fibrillation or require permanent pacemakers at a young age."
    explanation: >-
      Defines the electrocardiographic and clinical triggers that should prompt
      diagnostic consideration of PRKAG2 syndrome, and warns that their absence
      does not exclude it.

- name: Echocardiography
  description: >-
    Documents and quantifies left ventricular hypertrophy and tracks the later
    fall in ejection fraction as the disease enters its contractile-failure
    phase. Echocardiography establishes that hypertrophy is present but cannot by
    itself distinguish PRKAG2 disease from sarcomeric HCM.
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:40149727
    reference_title: "PRKAG2 Syndrome: Clinical Features, Imaging Findings and Cardiac Events."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac involvement was assessed by electrocardiography, echocardiography, cardiac magnetic resonance imaging, and endomyocardial biopsy (EMB)."
    explanation: >-
      Documents echocardiography as part of the standard assessment of cardiac
      involvement in a PRKAG2 cohort.

- name: Cardiac magnetic resonance imaging
  description: >-
    Characterises myocardial tissue, quantifies hypertrophy and the distribution
    of wall thickening, and assesses late gadolinium enhancement. Because PRKAG2
    hearts have minimal fibrosis, unlike sarcomeric HCM, tissue characterisation
    can contribute to the differential, although it is not on its own definitive.
  diagnosis_term:
    preferred_term: Cardiac magnetic resonance imaging
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  evidence:
  - reference: PMID:40149727
    reference_title: "PRKAG2 Syndrome: Clinical Features, Imaging Findings and Cardiac Events."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac involvement was assessed by electrocardiography, echocardiography, cardiac magnetic resonance imaging, and endomyocardial biopsy (EMB)."
    explanation: >-
      Documents cardiac MRI as part of the standard diagnostic assessment in a
      PRKAG2 cohort.

- name: Endomyocardial biopsy
  description: >-
    Provides the histological confirmation: vacuolated cardiomyocytes containing
    PAS-positive, diastase-resistant polyglucosan, with minimal fibrosis and NO
    myofibre disarray. Biopsy is not required when genetic testing is
    informative, but it resolves ambiguous cases and remains the reference
    standard for demonstrating cardiac storage.
  diagnosis_term:
    preferred_term: Endomyocardial biopsy
    term:
      id: NCIT:C51674
      label: Endomyocardial Biopsy
  evidence:
  - reference: PMID:40149727
    reference_title: "PRKAG2 Syndrome: Clinical Features, Imaging Findings and Cardiac Events."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the EMB of one of the patients, staining for glycogen deposits was positive."
    explanation: >-
      Demonstrates the diagnostic use of endomyocardial biopsy to show cardiac
      glycogen storage in a PRKAG2 carrier.
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "myofiber disarray, the characteristic feature of HCM, was not detected in any sample"
    explanation: >-
      Establishes the key negative biopsy finding that separates PRKAG2 disease
      from sarcomeric HCM.

- name: PRKAG2 genetic testing
  description: >-
    Molecular confirmation by PRKAG2 sequencing, in practice usually within a
    hypertrophic-cardiomyopathy or cardiomyopathy gene panel that also covers the
    sarcomere genes and the other storage-cardiomyopathy genes (LAMP2 for Danon
    disease, GAA for Pompe disease, GLA for Fabry disease). Yield is concentrated
    in the hypertrophy-plus-pre-excitation subgroup, where roughly one in three
    probands carries a PRKAG2 variant, and is essentially nil in severe
    hypertrophy without electrophysiological abnormality. A confirmed variant
    enables cascade testing of at-risk relatives.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:15673802
    reference_title: "Glycogen storage diseases presenting as hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses of 24 subjects with increased left ventricular wall thickness and electrocardiograms suggesting ventricular preexcitation revealed four LAMP2 and seven PRKAG2 mutations."
    explanation: >-
      Quantifies the genetic-testing yield in the clinically enriched subgroup
      that should be prioritised for PRKAG2 sequencing.
  - reference: PMID:15673802
    reference_title: "Glycogen storage diseases presenting as hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses of 20 subjects with massive hypertrophy (left ventricular wall thickness, > or =30 mm) but without electrophysiological abnormalities revealed mutations in neither LAMP2 nor PRKAG2."
    explanation: >-
      Demonstrates the near-zero yield when electrophysiological abnormality is
      absent, defining who should NOT be prioritised for this test.

treatments:
- name: Permanent pacemaker implantation
  therapeutic_modality: DEVICE
  description: >-
    The mainstay intervention for the conduction-disease arm. Progressive
    atrioventricular block and symptomatic bradycardia require permanent pacing,
    typically at a strikingly young age - a median in the mid-thirties in the
    largest cohort, and about a third of affected individuals in early series.
    Pacing does not modify the underlying storage process; it substitutes for the
    degenerating conduction system.
  treatment_term:
    preferred_term: Pacemaker placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Progressive Atrioventricular Block and Bradyarrhythmia
    treatment_effect: BYPASSES
    description: >-
      Artificial pacing restores an adequate ventricular rate by providing an
      alternative activation source; it circumvents the diseased conduction
      tissue rather than reversing its degeneration.
  target_phenotypes:
  - preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
  - preferred_term: Sinus bradycardia
    term:
      id: HP:0001688
      label: Sinus bradycardia
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sinus bradycardia and/or variable degrees of atrioventricular block resulted in pacemaker implantation in 24 (35%) affected individuals."
    explanation: >-
      Documents pacemaker implantation as the response to bradyarrhythmia and AV
      block in about a third of affected individuals.
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty patients (33%) had ventricular pre-excitation or had undergone accessory pathway ablation; 17 (19%) had pacemakers (median age at implantation 36 years; IQR: 27 to 46 years), and 16 (18%) had atrial fibrillation (median age 43 years; IQR: 31 to 54 years)."
    explanation: >-
      Quantifies pacemaker use and the strikingly young median age at
      implantation.
  - reference: PMID:33244021
    reference_title: "Phenotypic expression and clinical outcomes in a South Asian PRKAG2 cardiomyopathy cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "8 patients (36%) underwent permanent pacemaker implantation (atrio-ventricular blocks-5; sinus node disease-2)"
    explanation: >-
      Independent replication of the high pacing burden in a separate South Asian
      cohort, and shows the indication split between atrioventricular block and
      sinus node disease.

- name: Implantable cardioverter-defibrillator
  therapeutic_modality: DEVICE
  description: >-
    Considered for secondary prevention after sustained ventricular arrhythmia,
    and for primary prevention in individuals judged at high arrhythmic risk. The
    evidence base is observational: no PRKAG2-specific risk-stratification model
    exists, and a defibrillator does not protect against the bradyarrhythmic or
    heart-failure modes of death. In one contemporary cohort a patient died
    suddenly despite defibrillator implantation.
  treatment_term:
    preferred_term: Implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_phenotypes:
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:40149727
    reference_title: "PRKAG2 Syndrome: Clinical Features, Imaging Findings and Cardiac Events."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "After a median follow-up of 13.1 years, 6 carriers had LVH, 3 required admission for HF, and 1 had sustained ventricular tachycardia with subsequent cardioverter defibrillator implantation, and despite this, died suddenly; there were two de novo pacemaker implantations due to symptomatic bradycardia."
    explanation: >-
      Documents defibrillator use after sustained ventricular tachycardia while
      also showing it did not prevent sudden death in that patient, hence PARTIAL
      rather than SUPPORT.
  - reference: PMID:28431061
    reference_title: "High prevalence of arrhythmic and myocardial complications in patients with cardiac glycogenosis due to PRKAG2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two per cent of patients (N = 10) required a device implantation (5 pacemakers and 5 defibrillators) at a median age of 66 years, and two patients required heart transplant."
    explanation: >-
      Independent cohort documenting defibrillator implantation as part of the
      device burden of PRKAG2 syndrome.

- name: Catheter ablation of accessory atrioventricular pathways
  therapeutic_modality: SURGERY
  description: >-
    Catheter ablation is used for symptomatic accessory-pathway-mediated
    tachyarrhythmia, and a third of the largest cohort had either pre-excitation
    or prior accessory-pathway ablation. Its durability is limited by the
    underlying anatomy: because the substrate is diffuse microscopic muscle
    continuity across a breached annulus fibrosus rather than a single discrete
    bypass tract, multiple pathways are common and arrhythmia recurrence after
    ablation is a recognised problem. This is a direct clinical consequence of
    the mechanism curated in the pathophysiology graph.
  treatment_term:
    preferred_term: Cardiac ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  target_mechanisms:
  - target: Accessory Atrioventricular Connections and Ventricular Pre-excitation
    treatment_effect: INHIBITS
    description: >-
      Radiofrequency ablation destroys conducting tissue at the site of an
      accessory connection, interrupting the pre-excitation and the reentrant
      circuit. Because the anatomical substrate is diffuse rather than discrete,
      the interruption is often incomplete or non-durable.
    evidence:
    - reference: PMID:12782567
      reference_title: "Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "These anomalous microscopic atrioventricular connections, rather than morphologically distinct bypass tracts, appeared to provide the anatomic substrate for ventricular preexcitation."
      explanation: >-
        Explains why an ablation strategy designed for discrete bypass tracts is
        mechanistically mismatched to the PRKAG2 substrate. Marked PARTIAL
        because it characterises the substrate rather than reporting ablation
        outcomes.
  target_phenotypes:
  - preferred_term: Ventricular preexcitation
    term:
      id: HP:0004309
      label: Ventricular preexcitation
  - preferred_term: Supraventricular tachycardia
    term:
      id: HP:0004755
      label: Supraventricular tachycardia
  evidence:
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty patients (33%) had ventricular pre-excitation or had undergone accessory pathway ablation"
    explanation: >-
      Documents accessory-pathway ablation as part of standard management in the
      largest PRKAG2 cohort.
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiologic studies in ten affected individuals demonstrated one or more accessory atrioventricular pathways."
    explanation: >-
      Documents that carriers frequently have MULTIPLE accessory pathways, the
      anatomical reason single-target ablation may not be curative.

- name: Anticoagulation for atrial fibrillation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Stroke prevention in the atrial-arrhythmia arm of the disease. Atrial
    fibrillation and atrial flutter are curated here both as a phenotype and as a
    pathophysiology node, and they arrive early - a median age of 43 years in the
    largest cohort - so the cumulative thromboembolic exposure is long. The
    Brazilian kindred followed for 18 years recorded four strokes among nineteen
    carriers, and individual carriers in that series were managed with warfarin,
    rivaroxaban, apixaban, and dabigatran for intracardiac thrombus, inferior vena
    cava thrombosis, pulmonary embolism, and embolic stroke. Anticoagulation is
    named by the authors as one of the interventions that improved symptoms and
    survival. Important scope limit: there is no PRKAG2-specific anticoagulation
    trial and no PRKAG2-specific stroke-risk score; the practice is extrapolated
    from general AF stroke-prevention management, and the observational cohort
    evidence below reports it as part of a bundle of early interventions rather
    than as an isolated, separately evaluated therapy. No `target_mechanisms` link
    is declared to the "Supraventricular Tachyarrhythmia and Atrial Fibrillation"
    node on purpose: anticoagulation neither inhibits, activates, modulates,
    bypasses, nor restores that mechanism - it interrupts a thromboembolic
    consequence downstream of it - and none of the five permissible
    `treatment_effect` values would describe that honestly.
  treatment_term:
    preferred_term: Anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_phenotypes:
  - preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: PMID:39082507
    reference_title: "PRKAG2 syndrome, a rare hypertrophic cardiomyopathy: a Brazilian long-term follow-up with extracardiac disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis and intervention through antiarrhythmic drugs, anticoagulation, pacemaker implantation, radiofrequency catheter ablation, and cesarean section surgery improved the symptoms and survival rates."
    explanation: >-
      Names anticoagulation explicitly as part of the management bundle credited
      with improved symptoms and survival in an 18-year PRKAG2 cohort. Graded
      SUPPORT for the practice, but note the effect is attributed to the bundle,
      not to anticoagulation in isolation.
  - reference: PMID:39082507
    reference_title: "PRKAG2 syndrome, a rare hypertrophic cardiomyopathy: a Brazilian long-term follow-up with extracardiac disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This group experienced many malignant events, including eight pacemaker implants, three sudden cardiac deaths, five aborted cardiac arrests, four strokes"
    explanation: >-
      Quantifies the stroke burden in variant carriers that makes stroke
      prevention a first-order management concern in this disease.
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "16 (18%) had atrial fibrillation (median age 43 years; IQR: 31 to 54 years)"
    explanation: >-
      Establishes the prevalence and the early median onset of the atrial
      fibrillation that creates the anticoagulation indication.

- name: Septal myectomy
  therapeutic_modality: SURGERY
  description: >-
    Surgical septal reduction for left ventricular outflow tract obstruction, used
    in selected PRKAG2 patients whose hypertrophy is obstructive. It is documented
    in PRKAG2 disease only at case-report level, including in an infant with severe
    biventricular hypertrophy and pre-excitation carrying a novel p.Glu506Gln
    allele. It is listed here deliberately as a low-certainty, selected-case option
    rather than a mainstay: the hypertrophy in PRKAG2 disease is storage-driven
    mass accrual rather than sarcomeric myocyte hypertrophy with disarray (see
    `notes`, LUMP-VS-SPLIT), so the sarcomeric-HCM evidence base for septal
    reduction does not transfer, and no PRKAG2 series has evaluated outcomes. The
    dominant surgical intervention in this disease remains transplantation for
    end-stage disease.
  treatment_term:
    preferred_term: Septal myectomy
    term:
      id: NCIT:C51591
      label: Myectomy
  target_phenotypes:
  - preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  evidence:
  - reference: PMID:19787389
    reference_title: "Severe hypertrophic cardiomyopathy in an infant with a novel PRKAG2 gene mutation: potential differences between infantile and adult onset presentation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "An infant was assigned a diagnosis of ventricular preexcitation and severe biventricular HCM requiring septal myectomy."
    explanation: >-
      Documents septal myectomy actually being performed in genetically confirmed
      PRKAG2 disease. Graded PARTIAL because it is a single case report that
      records the procedure without reporting an outcome or comparing it with
      alternatives, so it supports availability of the option, not its efficacy.

- name: Heart transplantation
  therapeutic_modality: SURGERY
  description: >-
    Definitive therapy for end-stage disease. Because the lesion is confined to
    the heart, transplantation is curative of the cardiac phenotype. About 4
    percent of the largest cohort were transplanted over a median six years of
    follow-up, and transplantation is documented from the earliest human series.
  treatment_term:
    preferred_term: Heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Advanced Heart Failure and End-Stage Cardiomyopathy
    treatment_effect: RESTORES
    description: >-
      Replacement of the storage-affected heart with a genotypically normal
      allograft removes the entire diseased organ, restoring pump function and
      normal conduction.
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:32646569
    reference_title: "Clinical Features and Natural History of PRKAG2 Variant Cardiac Glycogenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "14% required admission for heart failure, 8% experienced sudden cardiac death or equivalent, 4% required heart transplantation, and 13% died."
    explanation: >-
      Quantifies the proportion of the cohort proceeding to transplantation.
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Left ventricular function markedly deteriorated in five affected adult individuals and necessitated cardiac transplantation in one; sudden death occurred in four."
    explanation: >-
      Documents transplantation for end-stage PRKAG2 cardiomyopathy in the
      original human series.

- name: Genetic counselling and cascade family screening
  therapeutic_modality: OTHER
  description: >-
    Because inheritance is autosomal dominant with age-dependent, incomplete
    penetrance, first-degree relatives of a proband should be offered genetic
    testing, and variant-positive relatives require LONGITUDINAL surveillance
    (serial ECG and echocardiography) rather than a single clearing assessment.
    The case for this is strong: pre-excitation can precede hypertrophy by years,
    and pacemaker requirement can be the first manifestation.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11407343
    reference_title: "Identification of a gene responsible for familial Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two families in which the Wolff-Parkinson-White syndrome segregated as an autosomal dominant disorder."
    explanation: >-
      Establishes the autosomal dominant transmission that makes cascade family
      screening appropriate.
  - reference: PMID:11748095
    reference_title: "Novel PRKAG2 mutation responsible for the genetic syndrome of ventricular preexcitation and conduction system disease with childhood onset and absence of cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now report a novel mutation in PRKAG2 causing Wolff-Parkinson-White syndrome and conduction system disease with onset in childhood and the absence of cardiac hypertrophy."
    explanation: >-
      Demonstrates that variant-positive relatives may manifest in childhood
      without hypertrophy, supporting longitudinal rather than one-time
      screening.

discussions:
- discussion_id: gap_prkag2_ampk_activity_direction
  prompt: >-
    Do disease-causing PRKAG2 CBS-domain variants raise or lower cardiac AMPK
    activity in the human heart, and is the answer variant-specific,
    developmental-stage-specific, or both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated AMPK Nucleotide Sensing
  rationale: >-
    This is the central unresolved mechanistic question of the disease, and the
    reason this entry declines to assert a direction. Yeast reconstitution of
    p.Thr400Asn and p.Asn488Ile indicates constitutive activation, and the N488I
    transgenic mouse shows ELEVATED cardiac AMPK activity with 30-fold glycogen
    accumulation. Against that, direct biochemical assay of reconstituted mutant
    complexes shows no constitutive activation but markedly reduced AMP
    dependence, and the R302Q transgenic mouse - which phenocopies the human
    disease including inducible AV reentrant tachycardia - has significantly
    REDUCED cardiac AMPK activity. Time-resolved work shows the direction flips
    within a single variant: acute p.Arg302Gln expression activates AMPK and
    upregulates glycogen synthase and AS160, whereas the chronically transgenic
    adult heart shows suppressed AMPK activity, apparently as feedback to stored
    glycogen. The question is not academic: it determines whether a rational
    therapy should activate or inhibit AMPK, and one of the founding papers
    explicitly proposed AMPK-lowering therapy on the basis of the activation
    model.
  proposed_experiments:
  - experiment_id: exp_prkag2_human_myocardial_ampk_activity
    name: Direct AMPK activity and phosphorylation profiling in human PRKAG2 myocardium
    description: >-
      Measure AMPK catalytic activity, alpha-subunit Thr172 phosphorylation, and
      downstream substrate phosphorylation (ACC, glycogen synthase, AS160) in
      genotyped human myocardial tissue obtained at transplantation or autopsy
      from carriers of the major alleles (p.Arg302Gln, p.Asn488Ile,
      p.Arg531Gly), against matched non-PRKAG2 hypertrophic and normal controls,
      stratified by disease stage and myocardial glycogen content. This is the
      missing human-tissue arm: every current activity measurement comes from
      yeast, reconstituted complexes, transgenic rodents, or zebrafish.
  - experiment_id: exp_prkag2_isogenic_ipsc_timecourse
    name: Allele-matched isogenic iPSC-cardiomyocyte AMPK activity time course
    description: >-
      In isogenic human iPSC-derived cardiomyocyte lines each carrying a single
      knock-in PRKAG2 allele, track AMPK activity, glycogen content, and
      electrophysiology across differentiation and prolonged culture, to test
      directly whether the direction of the AMPK change is allele-dependent, is
      stage-dependent, or reverses as glycogen accumulates.
  evidence:
  - reference: PMID:12397075
    reference_title: "Functional analysis of mutations in the gamma 2 subunit of AMP-activated protein kinase associated with cardiac hypertrophy and Wolff-Parkinson-White syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that mutations in gamma(2) have different effects on AMPK function, suggesting that they may lead to abnormal development of the heart through distinct mechanisms."
    explanation: >-
      Explicitly states that different PRKAG2 variants have different effects on
      AMPK function, framing the unresolved question.
  - reference: PMID:20031621
    reference_title: "Distinct early signaling events resulting from the expression of the PRKAG2 R302Q mutant of AMPK contribute to increased myocardial glycogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These findings are the first to highlight temporal differences in the effects of the PRKAG2 R302Q mutation on cardiac metabolic signaling events."
    explanation: >-
      Establishes the temporal dimension of the question: the measured direction
      depends on when in the disease course it is assayed. Evidence source is
      OTHER because this concluding statement spans the study's cultured-myocyte
      and transgenic-mouse arms rather than reporting a single experimental
      system.

- discussion_id: mismatch_prkag2_transgenic_overexpression_vs_human
  prompt: >-
    Do cardiac-restricted transgenic OVEREXPRESSION models of PRKAG2 variants
    faithfully represent the human disease, in which a single variant allele is
    expressed heterozygously at physiological level - and does the opposite
    direction of AMPK activity change between the N488I and R302Q mouse models
    reflect real allele biology or an artefact of transgene dosage?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated AMPK Nucleotide Sensing
  - pathophysiology#Excessive Cardiomyocyte Glycogen and Polyglucosan Accumulation
  rationale: >-
    Almost everything mechanistically known about this disease comes from
    alpha-myosin-heavy-chain-promoter transgenic mice OVEREXPRESSING a variant
    PRKAG2 cDNA on a normal endogenous background - a fundamentally different
    genetic architecture from the human heterozygote, where one endogenous allele
    is variant and total gamma-2 dosage is normal. The models are compelling in
    that they reproduce the human triad closely, including anatomically
    demonstrated annulus fibrosus disruption and inducible AV reentrant
    tachycardia. But they disagree with each other on the most basic
    biochemistry - the N488I model shows elevated cardiac AMPK activity while the
    R302Q model shows reduced activity - and overexpression is a plausible
    explanation for a discrepancy of that kind. The stakes are concrete: the
    inducible N488I model's demonstration that suppressing the transgene REVERSES
    established cardiomyopathy, conduction disease, and pre-excitation is the
    single strongest argument that the human disease is in principle
    pharmacologically reversible, and that argument is only as good as the
    model's fidelity. Evidence exists here in abundance; what is uncertain is its
    translational validity, which is why this is recorded as
    HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP.
  proposed_experiments:
  - experiment_id: exp_prkag2_knockin_heterozygous_mouse
    name: Heterozygous Prkag2 knock-in mice at endogenous expression level
    description: >-
      Generate heterozygous knock-in mice carrying the murine equivalents of
      p.Arg302Gln and p.Asn488Ile at the endogenous Prkag2 locus, so that
      expression level and allelic ratio match the human heterozygote. Compare
      cardiac AMPK activity, glycogen and polyglucosan content, annulus fibrosus
      integrity, and electrophysiology against the corresponding overexpression
      transgenics, to determine which findings survive removal of the transgene
      dosage confound and whether the N488I-versus-R302Q activity discrepancy
      persists.
  - experiment_id: exp_prkag2_reversibility_endogenous_expression
    name: Reversibility testing in an endogenous-expression model
    description: >-
      Repeat the transgene-suppression reversibility experiment in a system with
      physiological expression - for example allele-selective knockdown of the
      variant transcript in heterozygous knock-in mice, or in variant human
      iPSC-derived engineered heart tissue - to establish whether reversal of
      established storage cardiomyopathy is a property of the disease or an
      artefact of switching off a supraphysiological transgene.
  evidence:
  - reference: PMID:18158359
    reference_title: "Reversibility of PRKAG2 glycogen-storage cardiomyopathy and electrophysiological manifestations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using an externally modifiable transgenic system, cardiomyopathy, cardiac dysfunction, and electrophysiological disorders were demonstrated to be reversible processes in PRKAG2 disease."
    explanation: >-
      The reversibility claim whose translational validity is at stake, obtained
      in a tetracycline-repressible cardiac overexpression transgenic mouse, not
      in a physiological-expression heterozygote.
  - reference: PMID:18158359
    reference_title: "Reversibility of PRKAG2 glycogen-storage cardiomyopathy and electrophysiological manifestations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Transgene suppression during early postnatal development prevented the development of accessory electrical pathways but not cardiomyopathy or conduction system degeneration."
    explanation: >-
      Shows the three disease arms have different critical windows in the model,
      a dissociation whose relevance to human disease timing is untested. Marked
      PARTIAL because it complicates rather than straightforwardly supports the
      reversibility claim.

- discussion_id: mismatch_prkag2_glycogen_independent_arm
  prompt: >-
    Does the glycogen-independent AMPK-gamma2/myosin interaction reported in
    transgenic zebrafish contribute to the human PRKAG2 cardiac phenotype, and if
    so does it operate before, alongside, or instead of glycogen storage?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Enhanced AMPK-gamma2/Myosin Interaction
  - pathophysiology#Glycogen-Independent Early Electrophysiological Abnormality
  rationale: >-
    The entire causal architecture of this entry, and of the field, routes the
    cardiac phenotype through glycogen and polyglucosan accumulation. A 2026
    zebrafish study challenges that by showing hypertrophy plus slowed conduction
    and prolonged action-potential and calcium-transient duration at a
    developmental stage with NO glycogen accumulation, not rescued by AMPK
    activation, and attributable to variant-enhanced AMPK-gamma2 binding to
    myosin with myofilament relocalisation. If this generalises, part of the
    disease is a myofilament calcium-handling disorder rather than purely a
    storage disorder, and glycogen-lowering strategies would address only part of
    the phenotype. Zebrafish cardiac development, myosin isoform composition, and
    calcium handling differ substantially from human, and the finding is
    single-model and unreplicated - so this is a model-fidelity question rather
    than an absence of evidence. Notably it also cuts against BOTH established
    AMPK-direction hypotheses, since AMPK activation failed to rescue the
    phenotype.
  proposed_experiments:
  - experiment_id: exp_prkag2_myosin_interaction_human_tissue
    name: AMPK-gamma2/myosin interaction in human PRKAG2 myocardium and iPSC-cardiomyocytes
    description: >-
      Test for enhanced AMPK-gamma2/myosin association and myofilament
      relocalisation by proximity ligation and co-immunoprecipitation in
      genotyped human PRKAG2 myocardium and in isogenic variant human
      iPSC-derived cardiomyocytes, and determine whether calcium-transient and
      action-potential prolongation precede detectable glycogen accumulation
      during human cardiomyocyte differentiation.
  - experiment_id: exp_prkag2_myosin_inhibitor_rescue_mammalian
    name: Myosin-inhibitor rescue of the electrophysiological phenotype in a mammalian model
    description: >-
      Test whether a myosin inhibitor such as mavacamten reduces
      AMPK-gamma2/myosin association and rescues conduction slowing and
      calcium-transient prolongation in mammalian PRKAG2 models and in human
      variant engineered heart tissue, as it did in zebrafish. A positive result
      would both validate the mechanism across species and identify a
      repurposable pharmacological entry point.
  evidence:
  - reference: PMID:42422944
    reference_title: "AMPKγ2 Regulates Cardiac Hypertrophy and Arrhythmias via Interacting With Myosin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although prior studies associated PRKAG2-related hypertrophy with increased glycogen storage, many hypertrophic cardiomyopathy phenotypes remain unexplained."
    explanation: >-
      States the explanatory shortfall of the glycogen-centred model that
      motivates the alternative arm. Evidence source is OTHER because this is a
      background statement about what the prior literature leaves UNEXPLAINED -
      an assertion about absent evidence - rather than a result from the
      zebrafish experiments reported in this paper.
  - reference: PMID:42422944
    reference_title: "AMPKγ2 Regulates Cardiac Hypertrophy and Arrhythmias via Interacting With Myosin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed decreased AMPK (AMP-activated protein kinase) phosphorylation in the TgR299Q hearts. However, AMPK activation did not rescue the electrophysiological abnormalities in TgR299Q."
    explanation: >-
      Shows the electrophysiological phenotype is not corrected by restoring AMPK
      activity, arguing that this arm is not downstream of the AMPK activity
      change itself.

- discussion_id: gap_prkag2_accessory_pathway_origin
  prompt: >-
    Do the accessory atrioventricular connections in PRKAG2 disease arise from
    persistence of embryonic atrioventricular connections that normally regress,
    or from de novo activation of quiescent pathways by metabolic deposits in the
    postnatal heart?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disruption of the Annulus Fibrosus by Glycogen-Laden Myocytes
  - pathophysiology#Accessory Atrioventricular Connections and Ventricular Pre-excitation
  rationale: >-
    The annulus fibrosus mechanism is well established, but the developmental
    origin of the conducting strands is not. The two candidate explanations were
    posed as alternatives in the original human pathology paper and remain
    unresolved. The inducible mouse work is suggestive but not decisive:
    transgene suppression during early postnatal development PREVENTED
    accessory-pathway development while failing to prevent cardiomyopathy and
    conduction-system degeneration, implying a restricted developmental window
    for the pre-excitation arm specifically. Resolving this matters clinically
    because it determines whether accessory pathways in a variant-positive child
    can still be prevented, or only treated once formed.
  proposed_experiments:
  - experiment_id: exp_prkag2_av_canal_lineage_tracing
    name: Lineage tracing of atrioventricular canal myocardium in a PRKAG2 model
    description: >-
      Use inducible lineage tracing of embryonic atrioventricular canal
      myocardium in a PRKAG2 variant mouse to determine whether the myocytes
      forming the accessory connections descend from embryonic AV canal
      myocardium that failed to regress, or are working myocytes that breached
      the annulus postnatally. Pair with staged histology of annulus fibrosus
      integrity across development.
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "either embryonic atrioventricular connections that normally regress during heart development persist in individuals with PRKAG2 mutations, or metabolic deposits activate quiescent accessory pathways"
    explanation: >-
      States the two competing explanations as an explicitly open question.
      Evidence source is OTHER because this is the authors' framing of an
      unresolved problem in discussion, not a data-supported finding.
  - reference: PMID:18158359
    reference_title: "Reversibility of PRKAG2 glycogen-storage cardiomyopathy and electrophysiological manifestations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Transgene suppression during early postnatal development prevented the development of accessory electrical pathways but not cardiomyopathy or conduction system degeneration."
    explanation: >-
      Establishes a developmental window specific to the accessory-pathway arm,
      which bears on but does not settle the origin question. Marked PARTIAL for
      that reason.

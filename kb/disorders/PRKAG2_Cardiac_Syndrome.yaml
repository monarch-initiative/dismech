- name: Excessive Cardiomyocyte Glycogen and Polyglucosan Accumulation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Cardiomyocytes accumulate large amounts of glycogen and of poorly soluble,
    amylopectin-like polyglucosan within non-lysosomal cytosolic vacuoles. This
    is the biochemical event that makes PRKAG2 disease a cardiac glycogenosis
    rather than a cardiomyopathy of the contractile apparatus, and it is the hub
    from which the three clinical arms - hypertrophy, pre-excitation, and
    conduction disease - all descend. In the N488I transgenic mouse cardiac
    glycogen reaches roughly thirty times normal.

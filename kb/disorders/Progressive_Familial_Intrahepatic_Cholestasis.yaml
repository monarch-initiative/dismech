    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "poor growth due to fat malabsorption and fat-soluble vitamin deficiency"
    explanation: Explicitly attributes growth failure in PFIC to fat malabsorption and fat-soluble vitamin deficiency.
  downstream:

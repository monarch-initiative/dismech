- name: Reduced Intestinal Bile Acid Delivery and Fat Malabsorption
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Bile that never reaches the duodenum cannot form the mixed micelles needed to
    solubilize dietary long-chain triglyceride and the fat-soluble vitamins A, D, E and
    K. The result is steatorrhoea, energy deficit despite adequate intake, growth
    failure and short stature, and fat-soluble vitamin deficiency with rickets and
    coagulopathy. This is why nutritional management uses medium-chain triglyceride
    formulas, which are absorbed without micellar solubilization, alongside aggressive
    fat-soluble vitamin replacement.
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor \ngrowth may require medium-chain triglyceride-based formulas; fat-soluble vitamin \ndeficiencies are treated symptomatically."
    explanation: GeneReviews links poor growth and fat-soluble vitamin deficiency to the malabsorptive consequence of cholestasis and specifies MCT-based management.
  - reference: PMID:31183005

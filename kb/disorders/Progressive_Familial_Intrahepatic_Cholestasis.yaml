    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive familial intrahepatic cholestasis (PFIC) is a group of \nautosomal recessive disorders, the most prevalent being BSEP deficiency, \nresulting in disrupted bile formation, cholestasis, and pruritus."

      label: canalicular bile acid transport
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  subtypes:
  - PFIC2
  evidence:
  - reference: PMID:18395098
    reference_title: 'Severe bile salt export pump deficiency: 82 different ABCB11 mutations in 109 families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression varied most for E297G and D482G, with some BSEP detected in \n45% of patients (19/42) with these mutations."
    explanation: Documents the residual-protein gradient across ABCB11 genotypes that underlies the severity spectrum.
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This defect results in a severe hepatobiliary phenotype due to impairment of bile salt handling and subsequent damage to hepatocytes"
    explanation: Links BSEP loss to impaired bile salt handling and hepatocyte damage.
  downstream:
  - target: Hepatocellular Bile Salt Retention
    description: Blocked canalicular export traps bile salts inside the hepatocyte.
    causal_link_type: DIRECT
  - target: Hepatocarcinogenesis in BSEP and TJP2 Deficiency
    description: >-
      Sustained hepatocyte bile salt exposure and regenerative pressure confer an early
      hepatobiliary malignancy risk that is specific to severe BSEP deficiency.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Chronic bile-salt-induced hepatocyte DNA damage and compensatory regeneration

- name: MDR3-Mediated Biliary Phospholipid Secretion Failure
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    ABCB4 encodes MDR3, the canalicular floppase that translocates phosphatidylcholine
    into the outer leaflet of the canalicular membrane for extraction into bile.
    Biallelic loss makes bile phospholipid-poor. Because phosphatidylcholine is what
    sequesters bile salts into mixed micelles, its absence leaves free, monomeric bile
    salts at detergent concentrations in the biliary tree - the mechanistic reason PFIC3
    behaves as a cholangiopathy rather than a purely hepatocellular disease, and
    consequently the reason its serum GGT is high.
  genes:
  - preferred_term: ABCB4
    term:
      id: hgnc:45
      label: ABCB4
  molecular_functions:
  - preferred_term: phosphatidylcholine floppase activity
    term:
      id: GO:0090554
      label: phosphatidylcholine floppase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: phospholipid translocation
    term:
      id: GO:0045332
      label: phospholipid translocation
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  subtypes:
  - PFIC3
  evidence:
  - reference: PMID:20422496
    reference_title: 'The spectrum of liver diseases related to ABCB4 gene mutations: pathophysiology and clinical aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Class III multidrug resistance P-glycoproteins, Mdr2 in mice and MDR3 in human, \nare canalicular phospholipid translocators involved in biliary phospholipid \n(phosphatidylcholine) excretion."
    explanation: Establishes MDR3 as the canalicular phosphatidylcholine translocator whose loss causes PFIC3.

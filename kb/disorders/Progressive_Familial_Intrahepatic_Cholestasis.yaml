biochemical:
- name: Serum gamma-glutamyltransferase
  presence: Variable by subtype - low or normal in ATP8B1, ABCB11, TJP2, NR1H4, USP53 and MYO5B disease, elevated in ABCB4 disease and in KIF12- and ZFYVE19-related disease
  context: >-
    The central diagnostic axis of PFIC. GGT is a GPI-anchored ectoenzyme of the
    cholangiocyte apical membrane and of the hepatocyte canalicular membrane; its
    appearance in serum during cholestasis requires bile-salt-mediated solubilization of
    that membrane. In ABCB4/MDR3 deficiency, bile lacks the phosphatidylcholine needed to
    sequester bile salts into mixed micelles, so free detergent bile salts strip the
    biliary epithelium and GGT rises. In the canalicular transport, tight junction,
    nuclear receptor and trafficking defects the biliary epithelium is not the primary
    target and GGT stays low or normal despite profound cholestasis. A low or normal GGT
    in a cholestatic infant is therefore a strongly informative positive finding, not a
    reassuring one.
  specificity: >-
    High for subtype triage within genetic cholestasis, but not for PFIC versus other
    causes - biliary atresia and other obstructive cholangiopathies are also high-GGT,
    and bile acid synthesis defects are also low-GGT.
  biomarker_term:
    preferred_term: Gamma-Glutamyl Transpeptidase
    term:
      id: NCIT:C37959
      label: Gamma-Glutamyl Transpeptidase
  mappings_list:
  - preferred_term: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
    term:
      id: LOINC:2324-2
      label: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
  reference_ranges:
  - loinc_term:
      id: LOINC:2324-2
      label: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
    upper_bound: 50.0
    unit: U/L
    population: children beyond the neonatal period
    notes: >-
      Provenance: general clinical laboratory convention for paediatric serum GGT beyond
      the neonatal period, not a PFIC-specific published interval; no citable numeric
      interval was available in the sources used for this entry, so no evidence item is
      attached. Neonatal GGT is physiologically higher. The bands below encode the
      pragmatic cholestasis-clinic split rather than an assay reference interval.
    interpretation_bands:
    - name: Low/normal-GGT cholestasis pattern
      upper_bound: 100.0
      unit: U/L
      abnormal_flag: NORMAL
      interpretation: >-
        A GGT below roughly 100 U/L in a cholestatic child directs testing to ATP8B1,
        ABCB11, TJP2, NR1H4, USP53 and MYO5B (and to bile acid synthesis defects as the
        main non-PFIC alternative).
    - name: High-GGT cholestasis pattern
      lower_bound: 100.0
      unit: U/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Elevated gamma-glutamyltransferase level
        term:
          id: HP:0030948
          label: Elevated gamma-glutamyltransferase level
      interpretation: >-
        A GGT above roughly 100 U/L in a cholestatic child directs testing to ABCB4, and
        to the newer KIF12 and ZFYVE19 cholestases, after biliary obstruction and biliary
        atresia have been excluded.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum gamma-glutamyltransferase (GGT) activity is normal in PFIC1 and \nPFIC2 patients, but is elevated in PFIC3 patients."
    explanation: The definitive statement of the GGT split across the three classical subtypes.
  - reference: PMID:26888176
    reference_title: Mutations in the nuclear bile acid receptor FXR cause progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low-to-normal serum gamma-glutamyl \ntransferase activity"
    explanation: Places NR1H4/PFIC5 on the low-GGT side of the split.
  - reference: PMID:30976738
    reference_title: Recessive Mutations in KIF12 Cause High Gamma-Glutamyltransferase Cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cholestatic \nliver disease with high GGT in 3 previously undiagnosed children"
    explanation: Places KIF12-related disease on the high-GGT side of the split.
  readouts:
  - target: Unbuffered Bile Salt Injury to the Cholangiocyte
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    description: >-
      Serum GGT reports on whether the biliary epithelium is being attacked by
      unbuffered bile salts, which is exactly what separates ABCB4 disease from the
      hepatocyte-restricted subtypes.
- name: Serum conjugated (direct) bilirubin
  presence: Elevated
  context: >-
    The laboratory definition of cholestasis and the gateway test for the whole PFIC
    differential. Unlike the GGT reference range, this one has a genuinely citable
    consensus threshold: cholestasis in infancy is defined as a conjugated/direct
    bilirubin above 1 mg/dL and more than 20% of total bilirubin, a threshold recently
    lowered from the historical arbitrary 2 mg/dL. In the first days of life even lower
    values (>0.3-0.5 mg/dL, or >10% of total) are treated as abnormal.
  specificity: >-
    Sensitive for cholestasis but not specific for PFIC - it is shared with biliary
    atresia and the whole neonatal cholestasis differential. Its role here is to trigger
    the work-up, after which serum GGT performs the subtype triage.
  biomarker_term:
    preferred_term: Direct Bilirubin Measurement
    term:
      id: NCIT:C64481
      label: Direct Bilirubin Measurement
  mappings_list:
  - preferred_term: Bilirubin.direct [Mass/volume] in Serum or Plasma
    term:
      id: LOINC:1968-7
      label: Bilirubin.direct [Mass/volume] in Serum or Plasma
  reference_ranges:
  - loinc_term:
      id: LOINC:1968-7
      label: Bilirubin.direct [Mass/volume] in Serum or Plasma
    upper_bound: 1.0
    unit: mg/dL
    population: infants beyond the first days of life
    evidence:
    - reference: PMID:32861449
      reference_title: Recent developments in diagnostics and treatment of neonatal cholestasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cholestasis in infancy is defined as serum conjugated/direct bilirubin level >1 mg/dL and > 20% of the total bilirubin"
      explanation: Source of the 1 mg/dL consensus cholestasis threshold used as the upper bound of the normal interval.
    notes: >-
      The threshold is a consensus case definition of cholestasis rather than an assay
      reference interval, and it is paired with a percentage criterion (>20% of total
      bilirubin) that a single-analyte range cannot express - so the bands below should
      be read together with the total bilirubin.
    interpretation_bands:
    - name: Not cholestatic
      upper_bound: 1.0
      unit: mg/dL
      abnormal_flag: NORMAL
      interpretation: >-
        Below the consensus threshold; in a jaundiced infant this points to unconjugated
        (breast-milk or physiological) hyperbilirubinaemia rather than cholestasis.
    - name: Cholestatic range
      lower_bound: 1.0
      unit: mg/dL
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Conjugated hyperbilirubinemia
        term:
          id: HP:0002908
          label: Conjugated hyperbilirubinemia
      interpretation: >-
        At or above the consensus threshold and more than 20% of total bilirubin defines
        cholestasis, mandating immediate hepatobiliary evaluation including urgent
        exclusion of biliary atresia.
  evidence:
  - reference: PMID:32861449
    reference_title: Recent developments in diagnostics and treatment of neonatal cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal cholestasis is characterized by conjugated hyperbilirubinemia in the \nnewborn and young infant"
    explanation: Establishes conjugated hyperbilirubinaemia as the defining biochemical signature of neonatal cholestasis.
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals have hyperbilirubinemia, mildly elevated transaminases, and elevated serum bile acids."
    explanation: Documents hyperbilirubinaemia as part of the PFIC biochemical picture.
  readouts:
  - target: Hepatocellular Bile Salt Retention
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    description: >-
      Conjugated bilirubin retention is the routinely measured proxy for failure of
      canalicular secretion, and is the test that opens the PFIC differential.
- name: Total serum bile acids
  presence: Elevated
  context: >-
    Markedly raised in all PFIC subtypes and the principal quantitative marker of disease
    activity. It is the key secondary endpoint of both phase 3 IBAT inhibitor trials, and
    the post-diversion value is prognostic for native liver survival.
  biomarker_term:
    preferred_term: Bile Acid Measurement
    term:
      id: NCIT:C74800
      label: Bile Acid Measurement
  mappings_list:
  - preferred_term: Bile acid [Moles/volume] in Serum or Plasma
    term:
      id: LOINC:14628-2
      label: Bile acid [Moles/volume] in Serum or Plasma
  - preferred_term: bile salt
    term:
      id: CHEBI:22868
      label: bile salt
  reference_ranges:
  - loinc_term:
      id: LOINC:14628-2
      label: Bile acid [Moles/volume] in Serum or Plasma
    upper_bound: 10.0
    unit: umol/L
    population: children, fasting
    notes: >-
      Provenance: standard clinical laboratory convention for fasting total serum bile
      acids; not a PFIC-specific published interval, so no evidence item is attached to
      the interval itself. The band thresholds below are taken from the PFIC treatment
      literature and are cited on the parent record.
    interpretation_bands:
    - name: Normal
      upper_bound: 10.0
      unit: umol/L
      abnormal_flag: NORMAL
    - name: Elevated, at or below the odevixibat trial response threshold
      lower_bound: 10.0
      upper_bound: 70.0
      unit: umol/L
      abnormal_flag: HIGH
      severity: MILD
      phenotype_term:
        preferred_term: Increased serum bile acid concentration
        term:
          id: HP:0012202
          label: Increased serum bile acid concentration
      interpretation: >-
        A concentration at or below 70 micromol/L was one of the two definitions of
        serum bile acid response in the PEDFIC 1 odevixibat trial.
    - name: Markedly elevated
      lower_bound: 70.0
      unit: umol/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      phenotype_term:
        preferred_term: Increased serum bile acid concentration
        term:
          id: HP:0012202
          label: Increased serum bile acid concentration
      interpretation: >-
        Typical of untreated severe PFIC. In the NAPPED cohort a post-diversion
        concentration below 102 micromol/L predicted long native liver survival, so
        values well above that range mark a poor-prognosis group.
  evidence:
  - reference: PMID:35780807
    reference_title: 'Odevixibat treatment in progressive familial intrahepatic cholestasis: a randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "proportion of patients with serum bile acid response (ie, serum bile acids \nreduced by ≥70% from baseline or concentrations of ≤70 μmol/L) at week 24"
    explanation: Source of the 70 micromol/L response threshold used in the interpretation bands.
  - reference: PMID:34082807
    reference_title: 'Epidemiology and burden of progressive familial intrahepatic cholestasis: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an SBA concentration below 102 µmol/L or a decrease of at least 75% shortly after SBD reliably predicted NLS of ≥ 15 years following SBD (each p < 0.001)"
    explanation: Source of the 102 micromol/L post-diversion prognostic threshold cited in the severe band.
  readouts:
  - target: Hepatocellular Bile Salt Retention
    relationship: READOUT_OF
    endpoint_context: MONITORING
    description: >-
      Circulating total bile acids are the systemic spillover of the hepatocyte bile
      salt burden and serve as its quantitative readout.
  - target: Enterohepatic Bile Acid Recirculation
    relationship: PHARMACODYNAMIC_MARKER_OF
    endpoint_context: PHARMACODYNAMIC
    description: >-
      Serum bile acids are the pharmacodynamic readout of IBAT inhibition and biliary
      diversion, both of which act by interrupting this loop.

genetic:
- name: ATP8B1
  gene_term:
    preferred_term: ATP8B1
    term:
      id: hgnc:3706
      label: ATP8B1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: PFIC1
  presence: Biallelic loss-of-function
  features: >-
    Encodes FIC1, a P4-type ATPase aminophospholipid flippase of the canalicular
    membrane. Missense variants are relatively more common in the milder BRIC1 end of the
    spectrum and nonsense variants or large deletions in severe PFIC1, and the two
    classes differ functionally: PFIC1 missense mutants fail entirely to reach the
    canalicular membrane, whereas BRIC1 mutants retain residual canalicular expression.
  evidence:
  - reference: PMID:19731236
    reference_title: Differential effects of progressive familial intrahepatic cholestasis type 1 and benign recurrent intrahepatic cholestasis type 1 mutations on canalicular localization of ATP8B1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data indicate that \nPFIC1 mutations lead to the complete absence of canalicular expression, whereas \nin BRIC1/ICP residual protein is expressed in the canalicular membrane."
    explanation: Provides the molecular basis for the PFIC1-versus-BRIC1 severity distinction within the same gene.
- name: ABCB11
  gene_term:
    preferred_term: ABCB11
    term:
      id: hgnc:42
      label: ABCB11
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: PFIC2
  presence: Biallelic loss-of-function
  features: >-
    Encodes BSEP. Highly allelically heterogeneous - 82 different mutations across 109
    families in the largest series, spanning nonsense, frameshift, splice, whole-gene
    deletion and missense classes. Two recurrent missense alleles, p.Glu297Gly and
    p.Asp482Gly, together account for 58% of European families and are associated with
    detectable residual BSEP; biallelic protein-truncating genotypes have none and carry
    the worst native liver survival and the highest malignancy risk.
  evidence:
  - reference: PMID:18395098
    reference_title: 'Severe bile salt export pump deficiency: 82 different ABCB11 mutations in 109 families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two percent of mutations occurred in >1 family, with \nE297G and/or D482G present in 58% of European families (52/89)."
    explanation: Quantifies the recurrent-allele structure of ABCB11 disease in European families.
  case_fractions:
  - population: European families with severe BSEP deficiency
    case_fraction_percent: 58.0
    cohort_size: 89
    notes: >-
      Proportion of European families carrying at least one of the two recurrent
      residual-function missense alleles E297G or D482G, not the proportion of PFIC
      caused by ABCB11.
    evidence:
    - reference: PMID:18395098
      reference_title: 'Severe bile salt export pump deficiency: 82 different ABCB11 mutations in 109 families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "E297G and/or D482G present in 58% of European families (52/89)"
      explanation: Directly quantifies the 58% figure in an 89-family European denominator.
- name: ABCB4
  gene_term:
    preferred_term: ABCB4
    term:
      id: hgnc:45
      label: ABCB4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: PFIC3
  presence: Biallelic loss-of-function
  features: >-
    Encodes MDR3. Most reported defects are missense variants causing defective
    processing or intracellular transport; a minority abolish expression through early
    truncation. Monoallelic ABCB4 variants are not a cause of PFIC3 but predispose to a
    spectrum of adult and pregnancy-associated cholestatic phenotypes.
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the described defects in MDR3, the majority are missense mutations that result in defective processing or intracellular transport; while the minority have completely absent MDR3 expression secondary to early truncation or destruction of the protein"
    explanation: Characterizes the variant class distribution in ABCB4 disease.
- name: TJP2
  gene_term:
    preferred_term: TJP2
    term:
      id: hgnc:11828
      label: TJP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: PFIC4
  presence: Biallelic protein-truncating
  features: >-
    Encodes ZO-2. The PFIC4 mechanism specifically requires biallelic protein-truncating
    variants abolishing both isoforms; this is distinct from the single incompletely
    penetrant homozygous TJP2 missense allele previously reported in Amish familial
    hypercholanaemia, which impairs claudin binding but does not cause progressive liver
    disease.
  evidence:
  - reference: PMID:24614073
    reference_title: Mutations in TJP2 cause progressive cholestatic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, the mutations identified in the patients presented here are predicted to abolish translation of both isoforms ofTJP2."
    explanation: Establishes that PFIC4 requires complete loss of both TJP2 isoforms, distinguishing it from the milder Amish missense allele.
- name: NR1H4
  gene_term:
    preferred_term: NR1H4
    term:
      id: hgnc:7967
      label: NR1H4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: PFIC5
  presence: Biallelic loss-of-function
  features: >-
    Encodes the farnesoid X receptor. Extremely rare - four individuals from two families
    in the original report. Exon-level and intragenic copy-number variants occur, so
    panel and exome pipelines must include CNV calling.
  evidence:
  - reference: PMID:26888176
    reference_title: Mutations in the nuclear bile acid receptor FXR cause progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report four individuals from\ntwo unrelated families with neonatal cholestasis and mutations in NR1H4"
    explanation: The original report establishing NR1H4 as a PFIC gene and documenting its extreme rarity.
- name: MYO5B
  gene_term:
    preferred_term: MYO5B
    term:
      id: hgnc:7603
      label: MYO5B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: MYO5B-related cholestasis
  presence: Biallelic loss-of-function
  features: >-
    Encodes myosin Vb. Historically identified as the microvillus inclusion disease gene;
    biallelic variants can cause isolated low-GGT cholestasis with no intestinal disease
    at all, so MYO5B must be on any cholestasis panel regardless of gut phenotype.
  evidence:
  - reference: PMID:27532546
    reference_title: MYO5B mutations cause cholestasis with normal serum gamma-glutamyl transferase activity in children without microvillous inclusion disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a \nnew-generation sequencing approach, we identified MYO5B mutations in five \npatients with progressive familial intrahepatic cholestasis-like phenotype with \nnormal serum gamma-glutamyl transferase activity without intestinal disease."
    explanation: Establishes isolated hepatic MYO5B disease without intestinal involvement.
- name: USP53
  gene_term:
    preferred_term: USP53
    term:
      id: hgnc:29255
      label: USP53
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: USP53-related cholestasis
  presence: Biallelic loss-of-function
  features: >-
    Encodes an inactive ubiquitin-specific peptidase that co-localizes with TJP2 in the
    tight junction complex, placing USP53 disease mechanistically adjacent to PFIC4.
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in the USP53 protein, thought to colocalize with TJP2 and be part of the tight junction complex"
    explanation: Places USP53 within the TJP2 tight junction complex, explaining its low-GGT phenotype.
- name: KIF12
  gene_term:
    preferred_term: KIF12
    term:
      id: hgnc:21495
      label: KIF12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: KIF12-related cholestasis
  presence: Biallelic loss-of-function
  features: >-
    Encodes a kinesin motor protein. Homozygous damaging variants (p.Arg219* and
    p.Val204Met reported) cause high-GGT cholestasis, identified in offspring of
    consanguineous unions.
  evidence:
  - reference: PMID:30976738
    reference_title: Recessive Mutations in KIF12 Cause High Gamma-Glutamyltransferase Cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children had a rare homozygous damaging mutation \n(p.Arg219* and p.Val204Met) in kinesin family member 12 (KIF12)."
    explanation: Documents the specific homozygous KIF12 variants causing high-GGT cholestasis.
- name: ZFYVE19
  gene_term:
    preferred_term: ZFYVE19
    term:
      id: hgnc:20758
      label: ZFYVE19
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: ZFYVE19-related cholestasis
  presence: Biallelic loss-of-function
  features: >-
    Encodes a zinc-finger FYVE-domain protein with a probable role in ciliary and
    centriolar function. A homozygous nonsense variant (p.Arg223Ter) has been reported in
    high-GGT neonatal cholestasis with a demonstrable ciliary phenotype on patient
    fibroblasts.
  evidence:
  - reference: PMID:33853651
    reference_title: 'A ZFYVE19 gene mutation associated with neonatal cholestasis and cilia dysfunction: case report with a novel pathogenic variant.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further sequencing investigation revealed a homozygous non-sense mutation \n(p.Arg223Ter) in ZFYVE19 leading to a 222 aa truncated protein and present in \nboth heterozygous parents."
    explanation: Documents the specific homozygous ZFYVE19 variant with parental segregation.

diagnosis:
- name: Serum GGT-based subtype triage in cholestatic infants
  description: >-
    In an infant with confirmed cholestasis and no biliary obstruction, the serum GGT
    partitions the differential and directs genetic testing. A low or normal GGT despite
    marked cholestasis points to ATP8B1, ABCB11, TJP2, NR1H4, USP53 or MYO5B; a high GGT points
    to ABCB4 and to the newer KIF12 and ZFYVE19 cholestases, once biliary atresia,
    choledochal cyst and other obstructive cholangiopathies have been excluded by
    ultrasound and, where indicated, cholangiography.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum gamma-glutamyltransferase (GGT) activity is normal in PFIC1 and \nPFIC2 patients, but is elevated in PFIC3 patients."
    explanation: The biochemical basis of the triage rule.
- name: Molecular genetic confirmation
  description: >-
    Genetic testing is the etiologic gold standard. A comprehensive cholestasis NGS panel
    including deletion/duplication analysis is first-line, escalating to trio exome or
    genome sequencing with periodic reanalysis when negative. Expert consensus recommends
    initiating treatment for severe pruritus in parallel with, rather than after, genetic
    confirmation.
  evidence:
  - reference: PMID:38192535
    reference_title: Opinion paper on the diagnosis and treatment of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggests that genetic testing be used to confirm genotype whilst treatment \nis initiated in patients in whom PFIC is suspected"
    explanation: Expert consensus that genotyping should run in parallel with, not gate, treatment initiation.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATP8B1 deficiency is established in \na proband with suggestive clinical and laboratory findings and biallelic \npathogenic variants in ATP8B1 identified by molecular genetic testing."
    explanation: The GeneReviews Diagnosis/Testing statement, establishing biallelic molecular genetic testing as the confirmatory diagnostic step for the ATP8B1 subtype.
- name: Hepatic transporter immunostaining
  description: >-
    BSEP and MDR3 immunohistochemistry on liver biopsy supports but does not replace
    genetic diagnosis. Immunohistochemically detectable BSEP is typically absent or much
    reduced in severe ABCB11 disease; MDR3 staining is absent, decreased or - where the
    defect is functional rather than expressive - normal in ABCB4 disease; in MYO5B
    disease BSEP and MDR3 are present but abnormally localized, which is the diagnostic
    signature of a trafficking rather than a transporter lesion.
  evidence:
  - reference: PMID:18395098
    reference_title: 'Severe bile salt export pump deficiency: 82 different ABCB11 mutations in 109 families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemically detectable BSEP is typically absent, or much reduced, in \nsevere disease."
    explanation: Establishes the immunostaining pattern in severe BSEP deficiency and its diagnostic value.
- name: Hepatobiliary malignancy surveillance
  description: >-
    Because hepatocellular carcinoma and cholangiocarcinoma occur in early childhood in
    severe BSEP deficiency and in TJP2 deficiency, alpha-fetoprotein measurement and
    abdominal ultrasound every 6-12 months are recommended from the first year of life in
    these subtypes, and should continue in patients who retain their native liver.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monitoring of liver tumors, especially in PFIC2 \npatients, should be offered from the first year of life."
    explanation: States the surveillance recommendation and its subtype focus.
  - reference: PMID:18395098
    reference_title: 'Severe bile salt export pump deficiency: 82 different ABCB11 mutations in 109 families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Close \nsurveillance of BSEP-deficient patients retaining their native liver, \nparticularly those carrying 2 null mutations, is essential."
    explanation: Specifies that surveillance targets native-liver BSEP-deficient patients, especially null/null genotypes.

histopathology:
- name: Canalicular cholestasis with coarse granular Byler bile
  description: >-
    In ATP8B1 deficiency, canalicular cholestasis with biliary plugs, giant cell
    transformation, ductular paucity and lobular disarray; the canalicular bile has a
    characteristic coarse, granular appearance historically termed Byler bile. In ABCB11
    disease the pattern is canalicular cholestasis with hepatocellular disarray and
    lobular and portal fibrosis. TJP2 and NR1H4 disease show intracellular cholestasis
    with giant cell transformation.
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathology demonstrates canalicular cholestasis with biliary plugs, giant cell transformation, ductular paucity, and lobular disarray"
    explanation: Describes the histological pattern of FIC1 deficiency including the Byler bile appearance.
- name: Portal fibrosis with bile duct proliferation
  description: >-
    In ABCB4/MDR3 deficiency the histology is that of a cholangiopathy rather than a
    purely hepatocellular disease - portal fibrosis and bile duct proliferation with mild
    giant cell hepatitis at onset, and occasional intraductal cholelithiasis. This
    ductular pattern is the tissue counterpart of the high serum GGT.
  subtype: PFIC3
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology typically demonstrates portal fibrosis and bile duct proliferation with mild giant cell hepatitis at disease onset with occasional intraductal cholelithiasis"
    explanation: Documents the biliary/ductular histological pattern that distinguishes PFIC3 from the hepatocellular subtypes.

treatments:
- name: Odevixibat
  description: >-
    Once-daily oral inhibitor of the ileal bile acid transporter (IBAT/ASBT, SLC10A2)
    that blocks reabsorption of bile acids in the terminal ileum, diverting them into the
    faeces and lowering the bile acid load returned to the liver - a pharmacological
    equivalent of surgical biliary diversion. In the PEDFIC 1 phase 3 trial in PFIC1 and
    PFIC2, odevixibat significantly improved pruritus (55% vs 30% positive pruritus
    assessments) and serum bile acid response (33% vs 0%). Approved in 2021 in the EU for
    PFIC and in the US for PFIC-associated pruritus. Response is genotype-dependent -
    patients with complete loss of BSEP protein do not respond consistently, because
    reducing enterohepatic return cannot compensate for absent canalicular export.
    Diarrhoea and frequent bowel movements are the characteristic class effect, reported
    in 31% of odevixibat-treated versus 10% of placebo-treated patients in PEDFIC 1.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: odevixibat
      term:
        id: NCIT:C166598
        label: Odevixibat
  target_mechanisms:
  - target: Enterohepatic Bile Acid Recirculation
    treatment_effect: INHIBITS
    description: >-
      Blocks IBAT-mediated ileal reclamation of bile acids, interrupting the loop that
      re-delivers the bile acid load to the diseased liver.
    evidence:
    - reference: PMID:35780807
      reference_title: 'Odevixibat treatment in progressive familial intrahepatic cholestasis: a randomised, placebo-controlled, phase 3 trial.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Odevixibat, administered as once a day oral capsules, is a non-surgical, \npharmacological option to interrupt the enterohepatic circulation in patients \nwith PFIC."
      explanation: States the mechanism of action as interruption of the enterohepatic circulation.
  target_phenotypes:
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  - preferred_term: Increased serum bile acid concentration
    term:
      id: HP:0012202
      label: Increased serum bile acid concentration
  evidence:
  - reference: PMID:35780807
    reference_title: 'Odevixibat treatment in progressive familial intrahepatic cholestasis: a randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In children with PFIC, odevixibat effectively reduced pruritus \nand serum bile acids versus placebo and was generally well tolerated."
    explanation: Randomised placebo-controlled phase 3 evidence of efficacy on both co-primary endpoints.
  - reference: PMID:35780807
    reference_title: 'Odevixibat treatment in progressive familial intrahepatic cholestasis: a randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common treatment-emergent adverse events (TEAEs) \nwere diarrhoea or frequent bowel movements"
    explanation: Identifies the characteristic diarrhoeal class effect of IBAT inhibition; the trial reported it in 13 of 42 odevixibat-treated versus 2 of 20 placebo-treated patients.
  - reference: PMID:39768432
    reference_title: 'Practical Considerations for Odevixibat Treatment in Patients with Progressive Familial Intrahepatic Cholestasis: A Single-Center Case Series.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Two siblings with \ncomplete loss of bile salt export pump (BSEP) protein did not respond to \ntreatment; both underwent liver transplantation"
    explanation: Real-world evidence of the genotype limit on IBAT inhibitor efficacy - complete BSEP loss predicts non-response. PARTIAL because it qualifies rather than supports the efficacy claim.
- name: Maralixibat
  description: >-
    Second oral IBAT inhibitor, evaluated in MARCH-PFIC across all PFIC types.
    In the biallelic non-truncated BSEP cohort it significantly improved pruritus
    (least-squares mean between-group difference -1.1 on morning ItchRO(Obs)) and reduced
    total serum bile acids by 187 micromol/L relative to placebo. Diarrhoea was the most
    common adverse event, reported in 57% of maralixibat-treated versus 20% of
    placebo-treated participants and generally mild-to-moderate and transient. The
    trial design itself encodes the genotype dependency: the primary cohort deliberately
    excluded biallelic truncated BSEP deficiency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: maralixibat
      term:
        id: NCIT:C170148
        label: Maralixibat
  target_mechanisms:
  - target: Enterohepatic Bile Acid Recirculation
    treatment_effect: INHIBITS
    description: >-
      Inhibits the ileal bile acid transporter, interrupting enterohepatic recirculation.
    evidence:
    - reference: PMID:38723644
      reference_title: 'Maralixibat in progressive familial intrahepatic cholestasis (MARCH-PFIC): a multicentre, randomised, double-blind, placebo-controlled, phase 3 trial.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Maralixibat represents a non-surgical, \npharmacological option to interrupt the enterohepatic circulation and improve \nthe standard of care in patients with PFIC."
      explanation: States the mechanism of action as interruption of the enterohepatic circulation.
  target_phenotypes:
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  - preferred_term: Increased serum bile acid concentration
    term:

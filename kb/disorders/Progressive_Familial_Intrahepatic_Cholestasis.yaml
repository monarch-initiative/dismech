  - target: Sensorineural hearing impairment
    description: Loss of FIC1 in the cochlea produces sensorineural hearing loss.
    causal_link_type: DIRECT
  - target: Exocrine pancreatic insufficiency
    description: Loss of FIC1 in the pancreas impairs exocrine secretion.
    causal_link_type: DIRECT


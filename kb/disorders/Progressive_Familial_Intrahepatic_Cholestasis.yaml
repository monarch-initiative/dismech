- name: Hepatocarcinogenesis in BSEP and TJP2 Deficiency
  biological_scale: CELLULAR
  role: consequence
  description: >-
    Severe BSEP deficiency and TJP2 deficiency carry a subtype-specific risk of
    hepatobiliary malignancy - hepatocellular carcinoma and cholangiocarcinoma -
    presenting in early childhood, in some cases before age two. Risk is
    genotype-stratified in ABCB11 disease: biallelic protein-truncating genotypes carry
    roughly a fourfold higher malignancy risk than potentially less severe genotypes.
    This is a genuine mechanistic distinction from PFIC1, in which tumour development is
    not a recognised association, and it drives the recommendation for tumour
    surveillance from the first year of life.

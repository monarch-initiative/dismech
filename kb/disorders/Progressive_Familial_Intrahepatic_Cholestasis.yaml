has_subtypes:
- name: PFIC1
  display_name: PFIC1 / ATP8B1 (FIC1) deficiency
  subtype_term:
    preferred_term: progressive familial intrahepatic cholestasis type 1
    term:
      id: MONDO:0008892
      label: progressive familial intrahepatic cholestasis type 1
  description: >-
    Biallelic ATP8B1 variants abolish the canalicular FIC1 aminophospholipid flippase.
    Low/normal-GGT cholestasis presents in the first months of life. Because FIC1 is
    broadly expressed outside the liver, PFIC1 is distinguished by extrahepatic
    features - secretory diarrhoea, pancreatic insufficiency, elevated sweat chloride,
    short stature and sensorineural hearing loss - none of which is corrected by liver
    transplantation.
  genes:
  - preferred_term: ATP8B1
    term:
      id: hgnc:3706
      label: ATP8B1
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected children frequently exhibit profound diarrhea, poor growth, short stature, pancreatic insufficiency, elevated sweat chloride, and sensorineural deafness"
    explanation: Defines the extrahepatic feature set that distinguishes FIC1 (PFIC1) disease.
- name: PFIC2
  display_name: PFIC2 / ABCB11 (BSEP) deficiency
  subtype_term:
    preferred_term: progressive familial intrahepatic cholestasis type 2
    term:
      id: MONDO:0011156
      label: progressive familial intrahepatic cholestasis type 2
  description: >-
    Biallelic ABCB11 variants abolish or impair the canalicular bile salt export pump.
    Low/normal-GGT cholestasis with early, severe pruritus and rapid progression;
    generally the most severe of the classical forms. PFIC2 uniquely carries a
    substantial risk of hepatobiliary malignancy in early childhood, highest with
    biallelic protein-truncating genotypes, and can recur functionally after transplant
    through alloantibodies against the BSEP extracellular loop.
  genes:
  - preferred_term: ABCB11
    term:
      id: hgnc:42
      label: ABCB11
  evidence:
  - reference: PMID:18395098
    reference_title: 'Severe bile salt export pump deficiency: 82 different ABCB11 mutations in 109 families.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with severe bile salt export pump (BSEP) deficiency \npresent as infants with progressive cholestatic liver disease."
    explanation: Defines the PFIC2/BSEP-deficiency clinical entity and its ABCB11 genetic basis in the largest genotype series.
- name: PFIC3
  display_name: PFIC3 / ABCB4 (MDR3) deficiency
  subtype_term:
    preferred_term: progressive familial intrahepatic cholestasis type 3
    term:
      id: MONDO:0011214
      label: progressive familial intrahepatic cholestasis type 3
  description: >-
    Biallelic ABCB4 variants impair the MDR3 phosphatidylcholine floppase, so bile is
    phospholipid-poor. This is the one classical PFIC subtype with a HIGH serum GGT,
    because unbuffered bile salts injure the biliary epithelium. Onset is typically
    later than PFIC1/PFIC2 - late infancy through young adulthood - with portal
    fibrosis, bile duct proliferation and cholelithiasis, and it is the subtype most
    likely to respond to ursodeoxycholic acid.
  genes:
  - preferred_term: ABCB4
    term:
      id: hgnc:45
      label: ABCB4
  evidence:
  - reference: PMID:20422496
    reference_title: 'The spectrum of liver diseases related to ABCB4 gene mutations: pathophysiology and clinical aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several ABCB4 mutations have been identified in \nchildren with PFIC3 and are associated with low level of phospholipids in bile \nleading to a high biliary cholesterol saturation index."
    explanation: Links biallelic ABCB4 defects to PFIC3 and to the phospholipid-poor bile that defines the subtype.
- name: PFIC4
  display_name: PFIC4 / TJP2 (ZO-2) deficiency
  subtype_term:
    preferred_term: 'cholestasis, progressive familial intrahepatic, 4'
    term:
      id: MONDO:0014381
      label: 'cholestasis, progressive familial intrahepatic, 4'
  description: >-
    Biallelic protein-truncating TJP2 variants abolish the tight junction scaffold ZO-2,
    so claudin-1 fails to localize and the canalicular tight junction seal is lost,
    permitting paracellular reflux of detergent bile salts. Low/normal-GGT, often
    severe neonatal or early-infantile cholestasis with giant-cell transformation;
    hepatocellular carcinoma has been reported in infancy, so surveillance starts early.
  genes:
  - preferred_term: TJP2
    term:
      id: hgnc:11828
      label: TJP2
  evidence:
  - reference: PMID:24614073
    reference_title: Mutations in TJP2 cause progressive cholestatic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein-truncating mutations in the tight junction protein 2 gene (TJP2) are shown to cause failure of protein localisation, with disruption of tight-junction structure leading to severe cholestatic liver disease."
    explanation: Establishes biallelic TJP2 truncating variants as a cause of severe cholestatic liver disease through tight-junction failure.
- name: PFIC5
  display_name: PFIC5 / NR1H4 (FXR) deficiency
  subtype_term:
    preferred_term: 'cholestasis, progressive familial intrahepatic, 5'
    term:
      id: MONDO:0014884
      label: 'cholestasis, progressive familial intrahepatic, 5'
  description: >-
    Biallelic NR1H4 variants abolish the nuclear bile acid receptor FXR, removing the
    transcriptional programme that induces BSEP and represses de novo bile acid
    synthesis. Extremely rare, low-to-normal GGT, neonatal onset with rapid progression
    to end-stage liver disease, a characteristic vitamin K-independent coagulopathy,
    markedly elevated alpha-fetoprotein and undetectable hepatic BSEP.
  genes:
  - preferred_term: NR1H4
    term:
      id: hgnc:7967
      label: NR1H4
  evidence:
  - reference: PMID:26888176
    reference_title: Mutations in the nuclear bile acid receptor FXR cause progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features of severe, persistent NR1H4-related cholestasis include \nneonatal onset with rapid progression to end-stage liver disease, vitamin K-independent \ncoagulopathy, low-to-normal serum gamma-glutamyl \ntransferase activity, elevated serum alpha-fetoprotein and undetectable liver \nbile salt export pump (ABCB11) expression."
    explanation: Defines the PFIC5/FXR-deficiency phenotype including its low-to-normal GGT and vitamin K-independent coagulopathy.
- name: MYO5B-related cholestasis
  display_name: MYO5B-related cholestasis (PFIC10; called PFIC6 in some older sources)
  subtype_term:
    preferred_term: MYO5B-related progressive familial intrahepatic cholestasis
    term:
      id: MONDO:0018804
      label: MYO5B-related progressive familial intrahepatic cholestasis
  description: >-
    Biallelic MYO5B variants disrupt Rab11-dependent apical recycling, so BSEP and MDR3
    are synthesized but fail to reach the canalicular membrane. Low/normal-GGT
    cholestasis that may occur with microvillus inclusion disease (intractable
    diarrhoea) or in isolation without intestinal disease. Children transplanted for
    intestinal failure may develop worsening cholestasis, so combined liver-intestinal
    transplantation or intestinal transplantation with biliary diversion is preferred.
  genes:
  - preferred_term: MYO5B
    term:
      id: hgnc:7603
      label: MYO5B
  evidence:
  - reference: PMID:27532546
    reference_title: MYO5B mutations cause cholestasis with normal serum gamma-glutamyl transferase activity in children without microvillous inclusion disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data show that MYO5B deficiency may lead to isolated \ncholestasis and that MYO5B should be considered as an additional progressive \nfamilial intrahepatic cholestasis gene."
    explanation: Establishes MYO5B as a PFIC gene causing normal-GGT cholestasis even without intestinal disease.
- name: USP53-related cholestasis
  display_name: USP53-related low-GGT cholestasis (PFIC7)
  subtype_term:
    preferred_term: 'cholestasis, progressive familial intrahepatic, 7, with or without hearing loss'
    term:
      id: MONDO:0030503
      label: 'cholestasis, progressive familial intrahepatic, 7, with or without hearing loss'
  description: >-
    Biallelic USP53 variants cause low-GGT cholestasis; USP53 co-localizes with the
    TJP2-associated tight junction complex, placing it mechanistically alongside PFIC4.
    Cholestasis tends to be biochemically milder and intermittent and to respond to
    medication, but liver fibrosis and splenomegaly are common on follow-up, so this is
    not a benign entity. The OMIM/MONDO series numbers this PFIC7 and notes that a
    subset of patients develop childhood-onset hearing loss - a second route to
    sensorineural deafness in PFIC distinct from the ATP8B1 mechanism. Subtype numbering
    for the newer genes is not standardized across the clinical literature, so gene-first
    naming is used here deliberately with the series number carried in `display_name` and
    `subtype_term`.
  genes:
  - preferred_term: USP53
    term:
      id: hgnc:29255
      label: USP53
  evidence:
  - reference: PMID:33075013
    reference_title: Cholestasis Due to USP53 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have now identified biallelic mutation in USP53 in 7 \nfurther patients with cholestasis, from 5 families."
    explanation: Confirms biallelic USP53 mutation as a cause of childhood cholestasis in an independent multi-family series.
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3 members of a family (2 sisters and a cousin) presented with low-ggt cholestasis, liver enzyme elevations, and pruritus"
    explanation: Places USP53 disease explicitly on the low-GGT side of the diagnostic split, which is why USP53 is included in this entry's low-GGT gene lists and in the GGT triage rule. The USP53 primary report (PMID:33075013) does not itself state the GGT level.
- name: KIF12-related cholestasis
  display_name: KIF12-related high-GGT cholestasis (PFIC8)
  subtype_term:
    preferred_term: 'cholestasis, progressive familial intrahepatic, 8'
    term:

- name: Hepatocellular Bile Salt Retention
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The convergent node of the low-GGT PFIC subtypes. Whatever the upstream lesion,
    detergent bile salts accumulate inside the hepatocyte and spill into the systemic
    circulation. Intracellular bile salts are membrane-active and mitochondriotoxic,
    driving oxidative stress, hepatocyte apoptosis and necrosis and an inflammatory
    response; the circulating fraction produces pruritus and the raised serum bile acid
    concentration that is the field's principal pharmacodynamic and prognostic
    biomarker.
  cell_types:
  - preferred_term: hepatocyte

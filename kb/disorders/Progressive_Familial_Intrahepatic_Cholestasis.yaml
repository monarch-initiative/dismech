name: Progressive Familial Intrahepatic Cholestasis
creation_date: '2026-08-01T05:30:00Z'
description: >-
  Progressive familial intrahepatic cholestasis (PFIC) is a genetically heterogeneous
  group of autosomal recessive disorders of hepatocanalicular bile formation that
  present in infancy or childhood with intrahepatic cholestasis of hepatocellular
  origin, intractable pruritus, jaundice, fat and fat-soluble vitamin malabsorption,
  growth failure, and progression to biliary fibrosis, cirrhosis and end-stage liver
  disease. The central diagnostic axis is the serum gamma-glutamyltransferase (GGT)
  split: PFIC1 (ATP8B1, encoding the FIC1 P4-ATPase aminophospholipid flippase) and
  PFIC2 (ABCB11, encoding the bile salt export pump BSEP) are low/normal-GGT diseases
  in which injury is confined to the hepatocyte, whereas PFIC3 (ABCB4, encoding the
  MDR3 phosphatidylcholine floppase) is a high-GGT cholangiopathy because bile salts
  that are not buffered into mixed micelles by biliary phosphatidylcholine attack the
  cholangiocyte apical membrane and release GGT. Newer forms include TJP2 (PFIC4),
  NR1H4/FXR (PFIC5), MYO5B (PFIC10) and the emerging USP53 (PFIC7), KIF12 (PFIC8) and
  ZFYVE19 (PFIC9) cholestases. Management has been transformed by ileal bile acid transporter (IBAT)
  inhibitors - odevixibat and maralixibat - which interrupt enterohepatic bile acid
  recirculation pharmacologically, complementing surgical biliary diversion and liver
  transplantation.
category: Mendelian
parents:
- hereditary disease
- cholestatic liver disease
synonyms:
- PFIC
- familial intrahepatic cholestasis
- Byler disease
- FIC1 deficiency
- BSEP deficiency
- MDR3 deficiency
- low-GGT familial cholestasis

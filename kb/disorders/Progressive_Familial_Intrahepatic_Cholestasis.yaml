notes: >-
  Deep research provider: Edison/FutureHouse "falcon" (report at
  research/Progressive_Familial_Intrahepatic_Cholestasis-deep-research-falcon.md). The DR
  report was used as a lead-generation source only; every PMID was independently fetched
  and every snippet verified against the cached abstract. Several DR-supplied ontology
  identifiers were semantically wrong and were discarded after OAK resolution: HP:0031964
  (offered as "abnormal GGT", actually Elevated circulating alanine aminotransferase
  concentration), HP:0006744 (offered as HCC, actually Adrenocortical carcinoma),
  HP:0001882 (offered for fat-soluble vitamin deficiency, actually Decreased total
  leukocyte count), GO:0044294 (offered as bile canaliculus, actually dendritic growth
  cone - bile canaliculus is UBERON:0001283), and all four suggested NCIT intervention
  terms (C15469 Interferon Therapy, C15221 Dialysis, C15274 Lung Transplantation, C15236
  Gastrectomy, offered as Nutritional Support, Drug Therapy, Liver Transplantation and
  Genetic Counseling respectively). MAXO treatment terms are not reachable from the
  NCIT:C25218 root that the TreatmentActionTerm dynamic enum expands from, so NCIT
  intervention terms are used for the surgical treatments (NCIT:C15329 Surgical Procedure,
  NCIT:C15271 Liver Transplantation); note also that MAXO:0000070 liver transplantation is
  obsolete and MAXO:0001175 is its live replacement.

  Named Entity Confusion preflight: MONDO:0015762 was confirmed against Orphanet:172 and
  OMIMPS:211600 with the numbered subtype series (MONDO:0008892/0011156/0011214/0014381/
  0014884/0018804) resolved individually. The high-risk confusion here is with benign
  recurrent intrahepatic cholestasis (MONDO:0019008), which is ALLELIC to PFIC1/PFIC2
  rather than merely similar; it is curated as a structured differential rather than
  folded into this entry.

  Subtype numbering (a second, distinct confusion risk): the OMIM/MONDO gene series
  assigns PFIC6 to SLC51A/OSTa (MONDO:0030360), PFIC7 to USP53 (MONDO:0030503), PFIC8 to
  KIF12 (MONDO:0030505), PFIC9 to ZFYVE19 (MONDO:0030800) and PFIC10 to MYO5B
  (MONDO:0030810). Older clinical reviews frequently call the MYO5B form "PFIC6", which
  collides with the SLC51A entity that this entry deliberately excludes. All post-PFIC5
  subtypes therefore use gene-first names, with the series number carried only in
  display_name and subtype_term. MYO5B keeps MONDO:0018804 (MYO5B-related progressive
  familial intrahepatic cholestasis) as its subtype_term - the Orphanet-anchored term for
  the same entity that OMIM numbers PFIC10.

  Deliberate scope decisions: (1) "Low/normal GGT" is not curated as an HPO-coded
  phenotype because it denotes a normal laboratory value rather than an abnormality;
  HP:0034445 Reduced gamma-glutamyltransferase level would be a factual misstatement of
  the PFIC1/PFIC2 biochemistry. The split is carried in the biochemical section and in the
  "Unbuffered Bile Salt Injury to the Cholangiocyte" pathophysiology node. (2) SLC51A/OSTa
  and VPS33B/VIPAS39 (ARC syndrome) appear in some expanded PFIC classifications but are
  omitted here - ARC is a distinct multisystem syndrome better modelled separately, and
  SLC51A evidence remains thin. (3) Reference-range intervals carry provenance in notes
  rather than a citation because no citable numeric interval was found; the interpretation
  band thresholds (70 and 102 micromol/L) are cited on the parent biochemical record.

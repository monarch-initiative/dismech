inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All established PFIC subtypes are caused by biallelic germline loss-of-function
    variants and segregate as autosomal recessive traits, with a 25% recurrence risk
    per pregnancy for carrier couples. Consanguinity is over-represented in reported
    cohorts. Monoallelic (heterozygous) ABCB4, ABCB11 and ATP8B1 variants are not
    causes of PFIC but predispose to milder adult cholestatic phenotypes such as
    intrahepatic cholestasis of pregnancy, low-phospholipid-associated cholelithiasis
    and drug-induced cholestasis.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive familial intrahepatic cholestasis (PFIC) refers to a heterogeneous \ngroup of autosomal-recessive disorders of childhood that disrupt bile formation \nand present with cholestasis of hepatocellular origin."
    explanation: Establishes autosomal recessive inheritance for the PFIC group as a whole.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP8B1 deficiency is inherited in an autosomal recessive \nmanner."
    explanation: GeneReviews confirms autosomal recessive inheritance for the ATP8B1 (PFIC1) subtype.


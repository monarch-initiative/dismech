      label: KIF12
  - preferred_term: ZFYVE19
    term:
      id: hgnc:20758
      label: ZFYVE19
  biological_processes:
  - preferred_term: bile acid and bile salt transport
    term:
      id: GO:0015721
      label: bile acid and bile salt transport
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte

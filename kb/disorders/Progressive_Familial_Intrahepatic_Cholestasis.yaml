      label: Increased serum bile acid concentration
  evidence:
  - reference: PMID:38723644
    reference_title: 'Maralixibat in progressive familial intrahepatic cholestasis (MARCH-PFIC): a multicentre, randomised, double-blind, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maralixibat improved pruritus and predictors of native liver \nsurvival in PFIC (eg, serum bile acids)."
    explanation: Randomised phase 3 evidence of efficacy on pruritus and serum bile acids.
  - reference: PMID:38723644
    reference_title: 'Maralixibat in progressive familial intrahepatic cholestasis (MARCH-PFIC): a multicentre, randomised, double-blind, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common \nadverse event was diarrhoea"
    explanation: Identifies the diarrhoeal class effect of IBAT inhibition with maralixibat; the trial reported it in 27 of 47 maralixibat versus 9 of 46 placebo participants, all mild or moderate and mostly transient.
- name: Liver-directed gene therapy (AAV-ABCB11)
  description: >-
    AAV-mediated gene supplementation restoring hepatic BSEP (ABCB11 product)
    expression in PFIC2. VTX-802, an AAV8 vector carrying a codon-optimized human
    ABCB11 cDNA under a liver-specific constitutive promoter, showed sustained BSEP
    expression and partial disease correction in a PFIC2 mouse model. A single
    intravenous injection of VTX-802 (at doses of 6×10¹³ to 1.8×10¹⁴ vector genomes/kg)
    produced dose-dependent improvements in serum transaminase levels (ALT and AST
    approaching normal range at the highest dose), increased bile acid secretion into
    gallbladder bile (reaching >55% of wild-type levels at the highest dose), increased
    intestinal bile acid levels, and dose-dependent correction of hepatomegaly.
    Transgene expression was sustained for at least 4 months post-treatment. VTX-802
    represents the first gene therapy approach for PFIC2, potentially benefiting
    patients with BSEP-deficiency who have limited treatment options (particularly
    those with truncating mutations unresponsive to IBAT inhibitors) and offering the
    possibility of combination therapy with IBAT inhibition.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: BSEP-Mediated Bile Salt Export Failure
    treatment_effect: RESTORES
    description: >-
      AAV vector mediates sustained hepatic BSEP expression, restoring the
      canalicular bile salt export pump function that is absent in PFIC2 and
      permitting recovery of bile acid secretion into the canaliculus and bile.
    evidence:
    - reference: PMID:42579774
      reference_title: 'Liver-directed gene therapy results in amelioration of progressive familial intrahepatic cholestasis type 2 in mice.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The AAV vector containing the constitutive promoter, named VTX-802, showed higher BSEP expression, resulting in better restoration of BA secretion 3 and 7 weeks post-treatment."
      explanation: Demonstrates that VTX-802-mediated BSEP expression restores bile acid secretion in the mouse model.
  target_phenotypes:
  - preferred_term: Intrahepatic cholestasis
    term:
      id: HP:0001406
      label: Intrahepatic cholestasis
  - preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:42579774
    reference_title: 'Liver-directed gene therapy results in amelioration of progressive familial intrahepatic cholestasis type 2 in mice.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "VTX-802 restores hepatic BSEP expression and partially corrects disease phenotype in PFIC2 mice."
    explanation: Direct statement of VTX-802 efficacy on disease phenotype correction.
  - reference: PMID:42579774
    reference_title: 'Liver-directed gene therapy results in amelioration of progressive familial intrahepatic cholestasis type 2 in mice.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treated mice showed a sustained dose-dependent improvement in serum transaminase levels."
    explanation: Dose-dependent biomarker improvement demonstrating therapeutic efficacy.
  - reference: PMID:42579774
    reference_title: 'Liver-directed gene therapy results in amelioration of progressive familial intrahepatic cholestasis type 2 in mice.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To our knowledge, VTX-802 is the first gene therapy approach that could potentially benefit PFIC2 patients."
    explanation: Establishes VTX-802 as a novel therapeutic modality for PFIC2.
- name: Surgical biliary diversion
  description: >-
    Partial external biliary diversion (a cholecystojejunal cutaneous stoma), partial
    internal biliary diversion (a gallbladder-to-colon neo-conduit) or ileal exclusion,
    all of which interrupt the enterohepatic circulation surgically. The oldest
    disease-modifying therapy in PFIC: it reduces pruritus and serum bile acids and can
    slow or even reverse fibrosis, allowing many patients to keep their native liver.
    Response is genotype-dependent in the same way as IBAT inhibition - patients
    retaining residual transporter function do better - and complications include stoma
    problems, diarrhoea, malabsorption and recurrent pruritus. In PFIC1 patients coming to
    transplant, ileal diversion is sometimes performed at the same operation to protect
    the graft from steatosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Enterohepatic Bile Acid Recirculation
    treatment_effect: INHIBITS
    description: >-
      Physically diverts bile away from the terminal ileum, or bypasses the ileum, so
      bile acids are not reclaimed into the portal circulation.
    evidence:
    - reference: PMID:20301474
      reference_title: ATP8B1 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the primary \nsurgical therapy is interruption of the enterohepatic circulation which can \nreduce pruritus and slow or reverse the progression to hepatic fibrosis"
      explanation: States the mechanism and the disease-modifying (not merely symptomatic) effect.
  target_phenotypes:
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In \nsome PFIC1 and PFIC2 patients, biliary diversion may also relieve pruritus and \nslow disease progression."
    explanation: Establishes biliary diversion as a pruritus-relieving and disease-slowing intervention in PFIC1 and PFIC2.
  - reference: PMID:34082807
    reference_title: 'Epidemiology and burden of progressive familial intrahepatic cholestasis: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an SBA concentration below 102 µmol/L or a decrease of at least 75% shortly after SBD reliably predicted NLS of ≥ 15 years following SBD (each p < 0.001)"
    explanation: Quantifies the prognostic value of the biochemical response to surgical biliary diversion.
- name: Ursodeoxycholic acid
  description: >-
    A hydrophilic bile acid that displaces hydrophobic, cytotoxic bile salts from the
    circulating pool and may also induce BSEP and MDR3 expression. Conventionally started
    in all PFIC patients, but the benefit is strongly subtype-dependent: most patients
    with MDR3/ABCB4 deficiency have a favourable outcome on UDCA, whereas sustained
    benefit in severe PFIC1 and PFIC2 is limited and pharmacotherapy for cholestasis in
    severe ATP8B1 disease is explicitly described as ineffective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ursodeoxycholic acid
      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ursodeoxycholic acid \n(UDCA) therapy should be initiated in all patients to prevent liver damage."
    explanation: The conventional recommendation to initiate UDCA in all PFIC patients.
  - reference: PMID:20422496
    reference_title: 'The spectrum of liver diseases related to ABCB4 gene mutations: pathophysiology and clinical aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with MDR3 deficiency have a favorable \noutcome with ursodeoxycholic acid (UDCA) therapy"
    explanation: Documents the favourable UDCA response specific to ABCB4/MDR3 disease.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Cholestasis: pharmacotherapy is \nineffective regardless of disease severity."
    explanation: GeneReviews explicitly refutes a cholestasis benefit from pharmacotherapy in ATP8B1 deficiency, which is why UDCA benefit is curated here as subtype-dependent rather than general.
- name: Antipruritic pharmacotherapy
  description: >-
    Off-label symptomatic options for cholestatic itch - the bile acid sequestrant
    cholestyramine, the PXR agonist rifampicin, naltrexone and sertraline - used before
    or alongside IBAT inhibition. Efficacy is variable and generally poorer in FIC1
    deficiency than in other cholestatic disease, and rifampicin is notable for shortening
    cholestatic exacerbations in the allelic BRIC phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholestyramine
      term:
        id: NCIT:C28929
        label: Cholestyramine
    - preferred_term: rifampin
      term:
        id: NCIT:C811
        label: Rifampin
  target_phenotypes:
  - preferred_term: Pruritus
    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Other antipruritic agents (Table 1) such as rifampin and cholestyramine may also be utilized but are often less helpful in FIC1 deficiency"
    explanation: Documents these agents as antipruritic options while qualifying their limited efficacy in FIC1 deficiency - hence PARTIAL.
- name: Nutritional and fat-soluble vitamin support
  description: >-
    Hypercaloric feeding with medium-chain triglycerides, which do not require micellar
    solubilization, plus aggressive replacement of vitamins A, D, E and K with monitoring
    of INR, vitamin levels, bone health and growth. This is universal supportive care in
    all PFIC subtypes and becomes more important, not less, on IBAT inhibitor therapy,
    because reducing intraluminal bile acid delivery can further impair fat-soluble
    vitamin absorption.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_phenotypes:
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor \ngrowth may require medium-chain triglyceride-based formulas; fat-soluble vitamin \ndeficiencies are treated symptomatically."
    explanation: GeneReviews specifies MCT-based formula and fat-soluble vitamin replacement as standard management.
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients should be treated with caloric, fat, and vitamin supplementation, with the majority of fat being medium chain triglycerides"
    explanation: Specifies the composition of nutritional support in PFIC.
- name: Liver transplantation
  description: >-
    Definitive therapy for end-stage liver disease, unresectable hepatocellular
    carcinoma, severe portal hypertension, or pruritus and growth failure refractory to
    diversion and IBAT inhibition. Two subtype-specific caveats matter. In ATP8B1
    disease, transplantation replaces only the hepatic compartment: secretory diarrhoea
    persists or worsens and is associated with allograft steatosis and fibrosis that can
    require re-transplantation, and hearing loss is unaffected - so PFIC1 is the one
    subtype where transplantation can make an extrahepatic manifestation worse. In ABCB11
    disease, alloantibodies against the BSEP extracellular loop can produce an
    immune-mediated functional recurrence of BSEP deficiency in the graft. In MYO5B
    disease with microvillus inclusion disease, combined liver-intestinal transplantation
    or intestinal transplantation with biliary diversion is preferred.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, most PFIC patients are ultimately candidates \nfor liver transplantation."
    explanation: Establishes liver transplantation as the eventual endpoint for most patients with untreated progressive disease.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably for some, secretory diarrhea can continue or worsen following liver \ntransplantation."
    explanation: GeneReviews caveat that transplantation does not correct - and may worsen - the extrahepatic diarrhoea of ATP8B1 deficiency.
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients can develop allo-reactive antibodies specific to the extracellular loop of the BSEP protein resulting in an immune mediated recurrence of their BSEP disease in the allograft"
    explanation: Documents antibody-mediated post-transplant recurrence of BSEP deficiency, the PFIC2-specific transplant caveat.
  - reference: PMID:35070006
    reference_title: Newer variants of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These children are at risk of worsening cholestasis \npost intestinal transplant (IT) for MVID, hence combined intestinal and liver \ntransplant or IT with biliary diversion is preferred."
    explanation: Documents the MYO5B-specific transplant strategy.
- name: Avoidance of ototoxic agents and oestrogen-containing contraceptives
  description: >-
    A GeneReviews agents-and-circumstances-to-avoid recommendation specific to ATP8B1
    deficiency. Potentially ototoxic drugs must be avoided because sensorineural hearing
    loss is already common across the ATP8B1 spectrum and further insult is additive.
    Oral contraceptive agents can induce or exacerbate cholestatic episodes, which is
    mechanistically coherent given that oestradiol interferes with FXR-mediated BSEP
    regulation. Routine audiograms are recommended for all individuals with ATP8B1
    deficiency, symptomatic or not.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Potentially ototoxic agents; oral \ncontraceptive agent therapies can induce and/or exacerbate episodes of \ncholestasis."
    explanation: The GeneReviews agents-to-avoid recommendation verbatim.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "routine audiograms \nfor all individuals with ATP8B1 deficiency whether known to be symptomatic or \nnot."
    explanation: The accompanying GeneReviews surveillance recommendation.
- name: Genetic counselling and family testing
  description: >-
    Autosomal recessive counselling with a 25% recurrence risk for carrier couples. Once
    the familial variants are known, carrier testing, prenatal diagnosis and
    preimplantation genetic testing are available, and at-risk siblings should be tested
    presymptomatically so that treatment and surveillance can start early.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the ATP8B1 pathogenic variants \nhave been identified in an affected family member, carrier testing for at-risk \nrelatives and prenatal and preimplantation genetic testing are possible."
    explanation: GeneReviews statement of the available family testing options.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the \ngenetic status of apparently asymptomatic older and younger at-risk relatives of \nan affected individual in order to identify as early as possible those who would \nbenefit from prompt initiation of treatment, surveillance, and awareness of \nagents and circumstances to avoid."
    explanation: GeneReviews recommendation for presymptomatic testing of at-risk relatives.

differential_diagnoses:
- name: Alagille syndrome
  disease_term:
    preferred_term: Alagille syndrome
    term:
      id: MONDO:0007318
      label: Alagille syndrome
  description: >-
    The principal syndromic cholestatic differential. Alagille syndrome shares
    early-onset cholestasis, intractable pruritus and IBAT-inhibitor responsiveness with
    PFIC, and the dismech Alagille entry already lists PFIC as a differential in the
    reciprocal direction.
  distinguishing_features:
  - Autosomal dominant (JAG1, less often NOTCH2) versus autosomal recessive in PFIC.
  - A multisystem Notch developmental disorder in which cholestasis arises from paucity of interlobular bile ducts, accompanied by peripheral pulmonary artery stenosis or other congenital heart disease, posterior embryotoxon, butterfly vertebrae, characteristic facies and renal anomalies.
  - PFIC is a hepatocellular bile-formation disorder with a normal biliary tree and no developmental extrahepatic syndrome; the extrahepatic features of PFIC1 are functional consequences of FIC1 loss in other tissues, not malformations.
  - Serum GGT is characteristically elevated in Alagille syndrome, which separates it from the low-GGT PFIC subtypes though not from PFIC3.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on \nclinical manifestations, liver ultrasonography, cholangiography and liver \nhistology, as well as on specific tests to exclude other causes of childhood \ncholestasis."
    explanation: Establishes that PFIC diagnosis explicitly requires excluding other causes of childhood cholestasis, of which Alagille syndrome is the leading syndromic one.
- name: Biliary atresia
  disease_term:
    preferred_term: biliary atresia
    term:
      id: MONDO:0008867
      label: biliary atresia
  description: >-
    The most urgent differential in a cholestatic neonate, because the Kasai
    portoenterostomy is time-critical.
  distinguishing_features:
  - An acquired obliterative extrahepatic cholangiopathy with a high GGT, acholic stools, an absent or abnormal gallbladder on ultrasound and an abnormal intraoperative cholangiogram.
  - PFIC has a patent biliary tree with a normal cholangiogram, and the low-GGT PFIC subtypes are separated biochemically at the bedside.
  - A normal cholangiogram was precisely what excluded biliary atresia in the reported ZFYVE19 high-GGT case, showing that GGT alone cannot make this distinction.
  evidence:
  - reference: PMID:33853651
    reference_title: 'A ZFYVE19 gene mutation associated with neonatal cholestasis and cilia dysfunction: case report with a novel pathogenic variant.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite fibrosis/cirrhosis and biliary ducts proliferation \non liver biopsy suggested an extrahepatic biliary obstacle, normal \nintra-operatory cholangiography excluded biliary atresia."
    explanation: A worked example of how biliary atresia is excluded in a high-GGT PFIC-spectrum infant, and of why GGT alone is insufficient.
- name: Benign recurrent intrahepatic cholestasis
  disease_term:
    preferred_term: benign recurrent intrahepatic cholestasis
    term:
      id: MONDO:0019008
      label: benign recurrent intrahepatic cholestasis
  description: >-
    The allelic neighbour, not merely a look-alike. BRIC1 and BRIC2 are caused by
    variants in the SAME genes as PFIC1 and PFIC2 (ATP8B1 and ABCB11), so a genetic
    result alone does not distinguish them. They sit at opposite ends of one continuum,
    and the distinction is made phenotypically and mechanistically rather than by gene.
  distinguishing_features:
  - BRIC causes episodic, self-limiting attacks of cholestasis with complete symptomatic resolution between episodes, whereas PFIC is persistent and progresses to end-stage liver disease.
  - The molecular basis of the split is residual canalicular protein - PFIC1 missense mutants are entirely absent from the canalicular membrane, whereas BRIC1 and ICP mutants retain canalicular expression.
  - The boundary is permeable in both directions; some BRIC cases transition to persistent progressive disease, and individuals with ATP8B1 deficiency can shift over time from the episodic to the persistent end of the spectrum, so the label "benign" is not a guarantee.
  - Hepatic fibrosis can be present early even at the mild end of the ATP8B1 spectrum.
  evidence:
  - reference: PMID:19731236
    reference_title: Differential effects of progressive familial intrahepatic cholestasis type 1 and benign recurrent intrahepatic cholestasis type 1 mutations on canalicular localization of ATP8B1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in ATP8B1 cause progressive familial intrahepatic cholestasis type 1 \n(PFIC1) and benign recurrent intrahepatic cholestasis type 1 (BRIC1), forming a \nspectrum of cholestatic disease."
    explanation: Establishes the allelic relationship - the same gene causes both entities.
  - reference: PMID:19731236
    reference_title: Differential effects of progressive familial intrahepatic cholestasis type 1 and benign recurrent intrahepatic cholestasis type 1 mutations on canalicular localization of ATP8B1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas PFIC1 is a progressive, endstage liver \ndisease, BRIC1 patients suffer from episodic periods of cholestasis that resolve \nspontaneously."
    explanation: States the clinical distinction between the two allelic phenotypes.
  - reference: PMID:20301474
    reference_title: ATP8B1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in some persons with ATP8B1 deficiency the clinical \nfindings can span the phenotypic spectrum, shifting over time from the mild end \nof the spectrum (episodic cholestasis) to the severe end of the spectrum \n(persistent cholestasis)."
    explanation: GeneReviews evidence that the PFIC1/BRIC1 boundary is permeable within a single individual over time.
  notes: >-
    Because BRIC is allelic rather than merely phenotypically similar, a low-GGT
    cholestasis panel result naming ATP8B1 or ABCB11 must be interpreted together with the
    clinical course; the gene alone does not assign the PFIC versus BRIC label.
- name: Inborn errors of bile acid synthesis
  disease_term:
    preferred_term: inborn disorder of bile acid synthesis
    term:
      id: MONDO:0019218
      label: inborn disorder of bile acid synthesis
  description: >-
    The other major cause of LOW-GGT neonatal cholestasis, and therefore the differential
    that the GGT split cannot resolve.
  distinguishing_features:
  - Bile acid synthesis defects produce low-GGT cholestasis with characteristically low or normal serum bile acids, because the defect is in making bile acids rather than in exporting them - the opposite of the markedly elevated serum bile acids of PFIC.
  - Urinary bile acid mass spectrometry identifies the accumulating atypical intermediates and is the discriminating test.
  - The distinction is therapeutically decisive because bile acid synthesis defects respond to primary bile acid replacement.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MDR3 and BSEP liver immunostaining, and analysis of biliary lipid \ncomposition should help to select PFIC candidates for whom genotyping could be \nproposed to confirm the diagnosis."
    explanation: Supports the use of biliary lipid and transporter analysis to select true PFIC candidates from among other low-GGT cholestatic causes.
- name: Alpha-1-antitrypsin deficiency
  disease_term:
    preferred_term: alpha-1-antitrypsin deficiency
    term:
      id: MONDO:0013282
      label: alpha-1-antitrypsin deficiency
  description: >-
    A routine part of the neonatal cholestasis work-up and one of the commonest genetic
    causes of childhood liver disease.
  distinguishing_features:
  - SERPINA1 Pi*ZZ disease with a low serum alpha-1-antitrypsin level and a characteristic Pi phenotype on protease inhibitor typing.
  - PAS-positive diastase-resistant hepatocyte inclusions on liver biopsy.
  - An associated adult pulmonary emphysema risk that is absent from PFIC.
  - The liver injury mechanism is retained-polymer proteotoxicity in the hepatocyte endoplasmic reticulum rather than a bile transport defect, and pruritus is not the dominant symptom.
  evidence:
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as on specific tests to exclude other causes of childhood \ncholestasis"
    explanation: Supports the requirement to exclude other genetic causes of childhood cholestasis before diagnosing PFIC.
- name: Cystic fibrosis liver disease
  disease_term:
    preferred_term: cystic fibrosis
    term:
      id: MONDO:0009061
      label: cystic fibrosis
  description: >-
    A particularly instructive differential for PFIC1, because ATP8B1 deficiency itself
    causes an elevated sweat chloride - the classic cystic fibrosis diagnostic test - and
    can therefore be mistaken for it.
  distinguishing_features:
  - Caused by biallelic CFTR variants and dominated by sinopulmonary disease with chronic infection; the hepatobiliary manifestation is focal biliary cirrhosis with a high GGT.
  - PFIC1 has an elevated sweat chloride and pancreatic insufficiency but no bronchiectatic lung disease, and its cholestasis is low-GGT.
  - CFTR genotyping resolves the ambiguity.
  - Mechanistic overlap is real rather than coincidental - certain CFTR folding correctors improve defective FIC1 trafficking in cell culture.
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected children frequently exhibit profound diarrhea, poor growth, short stature, pancreatic insufficiency, elevated sweat chloride, and sensorineural deafness"
    explanation: Documents the elevated sweat chloride and pancreatic insufficiency of FIC1 deficiency that create the overlap with cystic fibrosis.
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: PARTIAL
    evidence_source: IN_VITRO

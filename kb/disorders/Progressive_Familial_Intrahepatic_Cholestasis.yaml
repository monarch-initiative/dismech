    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three types of PFIC have been identified and associated with \nmutations in hepatocellular transport-system genes involved in bile formation."
    explanation: Establishes defective hepatocellular bile-formation transport machinery as the shared upstream lesion.
  downstream:
  - target: FIC1 Flippase Loss and Canalicular Membrane Destabilization
    description: ATP8B1 loss removes the canalicular aminophospholipid flippase.
    causal_link_type: DIRECT
  - target: BSEP-Mediated Bile Salt Export Failure
    description: ABCB11 loss removes the canalicular bile salt export pump.
    causal_link_type: DIRECT
  - target: MDR3-Mediated Biliary Phospholipid Secretion Failure
    description: ABCB4 loss removes the canalicular phosphatidylcholine floppase.
    causal_link_type: DIRECT
  - target: Canalicular Tight Junction Failure and Paracellular Bile Reflux
    description: TJP2 loss destabilizes the tight junction seal around the canaliculus.
    causal_link_type: DIRECT
  - target: FXR Bile Acid Sensing and Transcriptional Failure
    description: NR1H4 loss removes the nuclear bile acid sensor governing BSEP expression.
    causal_link_type: DIRECT
  - target: Apical Trafficking Failure of Canalicular Transporters
    description: MYO5B loss prevents BSEP and MDR3 from reaching the canalicular membrane.
    causal_link_type: DIRECT

- name: FIC1 Flippase Loss and Canalicular Membrane Destabilization
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    ATP8B1 encodes FIC1, a P4-type ATPase that flips phosphatidylserine from the outer
    to the inner leaflet of the canalicular membrane. Loss of this inward translocation
    destroys membrane lipid asymmetry and leaves the canalicular membrane abnormally
    susceptible to the detergent action of luminal bile salts, impairing bile
    formation. Because FIC1 is also expressed in intestine, pancreas and cochlea, its
    loss produces extrahepatic disease that liver replacement cannot correct.
  genes:
  - preferred_term: ATP8B1
    term:
      id: hgnc:3706
      label: ATP8B1
  biological_processes:
  - preferred_term: aminophospholipid translocation
    term:
      id: GO:0140331
      label: aminophospholipid translocation
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  subtypes:
  - PFIC1
  evidence:
  - reference: PMID:19731236
    reference_title: Differential effects of progressive familial intrahepatic cholestasis type 1 and benign recurrent intrahepatic cholestasis type 1 mutations on canalicular localization of ATP8B1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATP8B1 localizes to the canalicular membrane of hepatocytes where it mediates the \ninward translocation of phosphatidylserine."
    explanation: Establishes the molecular function of FIC1 as an inward-directed canalicular phosphatidylserine flippase.
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both PFIC1 and PFIC2 are \ncaused by impaired bile salt secretion due to defects in ATP8B1 encoding the \nFIC1 protein and in ABCB11 encoding bile salt export pump (BSEP) protein, \nrespectively."
    explanation: Attributes impaired bile salt secretion in PFIC1 to ATP8B1/FIC1 loss.
  downstream:
  - target: Hepatocellular Bile Salt Retention
    description: >-
      Destabilized canalicular membrane and impaired bile formation lead to intracellular
      bile salt retention without primary cholangiocyte injury, preserving a low/normal GGT.
    causal_link_type: DIRECT
  - target: Extrahepatic FIC1 Deficiency
    description: >-
      The same flippase loss in intestine, pancreas and inner ear produces disease outside
      the liver.
    causal_link_type: DIRECT

- name: BSEP-Mediated Bile Salt Export Failure
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    ABCB11 encodes BSEP, the ATP-dependent canalicular pump that performs the
    rate-limiting step of bile salt secretion into the canaliculus. Biallelic loss
    blocks bile salt export at the apical hepatocyte membrane. Severity tracks residual
    protein: the recurrent p.Glu297Gly and p.Asp482Gly alleles retain detectable BSEP in
    a substantial minority of patients, while biallelic protein-truncating genotypes
    leave none and are the most severe. Because the cholangiocyte is not the primary
    target, serum GGT remains low or normal.
  genes:
  - preferred_term: ABCB11
    term:
      id: hgnc:42
      label: ABCB11
  molecular_functions:
  - preferred_term: canalicular bile acid transmembrane transporter activity
    term:

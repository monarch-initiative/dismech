- name: Unbuffered Bile Salt Injury to the Cholangiocyte
  biological_scale: CELLULAR
  role: effector
  description: >-
    This node is the mechanistic pivot of the GGT split. In health, biliary
    phosphatidylcholine sequesters bile salts into mixed micelles that are non-toxic to
    the biliary epithelium. When MDR3 is absent (and in the newer high-GGT forms KIF12
    and ZFYVE19), free bile salts strip the cholangiocyte apical membrane, on which
    gamma-glutamyltransferase is a GPI-anchored ectoenzyme; membrane damage releases
    GGT into bile and serum. In the low-GGT subtypes (ATP8B1, ABCB11, TJP2, NR1H4,
    USP53, MYO5B) the cholangiocyte is not the primary target, biliary GGT is not shed, and
    serum GGT stays low or normal despite profound cholestasis. Cholangiocyte injury
    also drives the ductular reaction, portal fibrosis and bile duct proliferation seen
    on PFIC3 biopsy.
  cell_types:
  - preferred_term: intrahepatic cholangiocyte
    term:
      id: CL:0002538
      label: intrahepatic cholangiocyte
  chemical_entities:
  - preferred_term: bile salt
    term:
      id: CHEBI:22868
      label: bile salt
    modifier: INCREASED
  subtypes:
  - PFIC3
  evidence:
  - reference: PMID:31183005
    reference_title: Expanding etiology of progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Without phosphatidylcholine to neutralize bile acids, the imbalance of free bile acids damages cholangiocytes, and cholesterol crystallizes into liver-damaging stones"
    explanation: States the mechanism by which loss of biliary phosphatidylcholine converts PFIC3 into a cholangiocyte-injuring cholangiopathy.
  - reference: PMID:23141890
    reference_title: Progressive familial intrahepatic cholestasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum gamma-glutamyltransferase (GGT) activity is normal in PFIC1 and \nPFIC2 patients, but is elevated in PFIC3 patients."
    explanation: The clinical read-out of this node - the GGT split that separates PFIC3 from PFIC1/PFIC2.
  downstream:
  - target: Elevated serum gamma-glutamyltransferase
    description: >-
      Cholangiocyte apical membrane damage releases the GPI-anchored ectoenzyme GGT,
      producing the high-GGT biochemical signature of ABCB4 disease.
    causal_link_type: DIRECT
  - target: Hepatic Stellate Cell Activation and Biliary Fibrosis
    description: >-
      Cholangiocyte injury drives a ductular reaction and periportal fibrogenesis.
    causal_link_type: DIRECT

- name: Canalicular Tight Junction Failure and Paracellular Bile Reflux
  biological_scale: CELLULAR
  role: trigger
  description: >-
    TJP2 (ZO-2) is a cytosolic scaffold that anchors claudins at the tight junctions
    sealing the bile canaliculus. Biallelic protein-truncating TJP2 variants abolish the
    protein; claudin-1 is expressed at normal levels but fails to localize to the
    junction, and tight junctions appear elongated and lose their densest zonula
    occludens material. The seal that normally confines detergent bile salts to the
    canalicular lumen is lost, permitting paracellular reflux of toxic bile constituents
    into the hepatocyte and the space of Disse.

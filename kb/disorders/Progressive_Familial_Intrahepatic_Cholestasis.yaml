pathophysiology:
- name: Canalicular Bile Formation Defect
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The shared upstream lesion in every PFIC subtype is biallelic loss of a protein
    required for hepatocanalicular bile formation - a canalicular transporter (BSEP,
    MDR3), a membrane lipid flippase (FIC1), a tight junction scaffold (ZO-2), the
    nuclear bile acid receptor (FXR), or an apical trafficking motor (myosin Vb). The
    result in every case is failure of the hepatocyte to form and export normal bile.
    USP53, KIF12 and ZFYVE19 are listed here as well: they are established causes of
    PFIC-spectrum cholestasis but their proximate mechanisms are not yet resolved well
    enough to warrant separate downstream mechanism nodes, so this umbrella node is the
    only place they are wired into the pathograph.
  genes:
  - preferred_term: ATP8B1
    term:
      id: hgnc:3706
      label: ATP8B1
  - preferred_term: ABCB11
    term:
      id: hgnc:42
      label: ABCB11
  - preferred_term: ABCB4
    term:
      id: hgnc:45
      label: ABCB4
  - preferred_term: TJP2
    term:
      id: hgnc:11828
      label: TJP2
  - preferred_term: NR1H4
    term:
      id: hgnc:7967
      label: NR1H4
  - preferred_term: MYO5B
    term:
      id: hgnc:7603
      label: MYO5B
  - preferred_term: USP53
    term:
      id: hgnc:29255
      label: USP53
  - preferred_term: KIF12
    term:

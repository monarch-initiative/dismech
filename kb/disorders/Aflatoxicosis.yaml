      id: HP:0001541
      label: Ascites
  frequency: FREQUENT
  evidence:
  - reference: PMID:48730
    reference_title: Hepatitis due to aflatoxicosis. An outbreak in Western India.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parts of Western India have experienced an outbreak of hepatitis affecting man and dogs and characterised by jaundice, rapidly developing ascites, portal hypertension, and a high mortality-rate.
    explanation: >-
      Describes the syndrome in an independent outbreak, including the
      cross-species occurrence.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other symptoms include fever (between 46 and 65 %), diarrhoea (between 31 and 50 %), ascites (50 %), scrotum swelling (8 %), rectal bleeding, easy bruisability, constipation, dyspnea, hypothermia, shock, fits (85 %) and coma (32 %).
    explanation: >-
      Frequency support. Ascites was reported in 50% of cases in the outbreak
      series the systematic review pooled, placing it in the FREQUENT band.
- category: Hematologic
  name: Coagulopathy
  description: >-
    Impaired clotting from loss of hepatic clotting-factor synthesis, presenting
    as bleeding and easy bruising. Asserted in the entry's own description and
    now modelled: it is the clinical arm of the failure node that supportive care
    is actually directed at, since fresh frozen plasma is given for it.
  phenotype_term:
    preferred_term: Coagulopathy
    term:
      id: HP:0003256
      label: Abnormality of the coagulation cascade
    temporality: ACUTE
  evidence:
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Disruption of protein synthesis and immune suppression further contribute to disease severity, and impaired production of clotting factors leads to coagulopathy and bleeding risks (Benkerroum, 2020).
    explanation: >-
      Names the mechanism and the manifestation. Graded OTHER because the
      sentence is the review's narrative summary citing a secondary source, not
      a result the review itself produced.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other symptoms include fever (between 46 and 65 %), diarrhoea (between 31 and 50 %), ascites (50 %), scrotum swelling (8 %), rectal bleeding, easy bruisability, constipation, dyspnea, hypothermia, shock, fits (85 %) and coma (32 %).
    explanation: >-
      The observed bleeding phenotype in pooled outbreak cases. INDIRECT because
      the review reports rectal bleeding and easy bruisability as symptoms
      without reporting a coagulation measurement, so the coagulopathy is
      inferred from the bleeding rather than measured.
  notes: >-
    No coagulation assay result is reported in any of the cited outbreak
    investigations, so no reference range is curated. The HPO label bound here is
    the canonical "Abnormality of the coagulation cascade"; "Coagulopathy" is a
    synonym of HP:0003256 and is kept as the preferred_term.

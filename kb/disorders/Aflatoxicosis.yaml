- category: Hematologic
  name: Pancytopenia
  description: >-
    Reported in a documented single case with elevated serum aflatoxin, alongside
    bleeding and easy bruising. Recorded because it is not predicted by a purely
    hepatic model of the disease, but the evidence is one case report.
  phenotype_term:
    preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  evidence:
  - reference: PMID:16175785
    reference_title: "Acute aflatoxicosis: case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigations showed abnormal liver function tests, pancytopenia and elevated serum levels of aflatoxins.
    explanation: >-
      A single case with biochemically confirmed exposure. Weak evidence by
      design — a case report is the whole basis for this phenotype.
  notes: >-
    Deliberately not linked into the pathograph. Whether the marrow suppression
    is a direct extrahepatic toxic effect or a consequence of hepatic failure
    with sepsis is exactly the open question recorded in the
    extrahepatic_acute_toxicity discussion, and drawing either edge would settle
    it by assertion. It is left unlinked with the discussion attached instead.

name: Aflatoxicosis
category: Toxicologic
creation_date: '2026-09-08T09:20:00Z'
synonyms:
- acute aflatoxicosis
- aflatoxin poisoning
- acute aflatoxin toxicosis
description: >-
  Aflatoxicosis is poisoning by aflatoxins, the difuranocoumarin mycotoxins of
  Aspergillus flavus and A. parasiticus, acquired by eating mould-contaminated
  staples — in the documented outbreaks, homegrown maize and groundnuts. In its
  acute form it presents as jaundice of unknown origin progressing to
  fulminant hepatic failure, with vomiting, abdominal pain, coagulopathy and
  a case-fatality approaching 40%.

  The 2004 eastern Kenya epidemic is the reference event: 317 cases and 125
  deaths, maize carrying aflatoxin B1 up to 4,400 ppb against a 20 ppb national
  limit, and a case-control study that for the first time quantified serum
  aflatoxin B1-lysine albumin adducts in acute human disease. The causal fungus
  was later identified as the S strain of A. flavus, whose incidence in a maize
  sample tracks that sample's aflatoxin content closely. Earlier epidemics in
  Kenya (1981) and western India (1974) established the same picture, the Indian
  outbreak notably affecting dogs alongside people.

  This is a dose-and-duration disease, and the entry is scoped to the acute and
  subacute end. Aflatoxin B1 is bioactivated in the liver by cytochrome P450 to
  the exo-8,9-epoxide, which binds DNA and protein. At low chronic doses that
  chemistry produces the TP53 R249S transversion and hepatocellular carcinoma
  over decades — which dismech curates separately as Aflatoxin_Related_HCC. At
  high acute doses the same bioactivation overwhelms glutathione conjugation and
  kills hepatocytes outright, and the patient dies of liver failure in weeks
  rather than of cancer in decades. The two entries share an exposure and the
  first two steps of its metabolism and nothing after that.
disease_term:
  preferred_term: aflatoxicosis
  term:
    id: MONDO:0700296
    label: aflatoxicosis
parents:
- Mycotoxicosis
- Toxic Liver Disease
notes: >-
  Scope boundary with Aflatoxin_Related_HCC, which already exists in the KB:
  that entry covers chronic low-dose exposure acting through TP53 R249S with
  hepatitis B as cofactor, over decades. This entry covers acute and subacute
  high-dose poisoning acting through hepatocyte necrosis, over days to weeks.
  They are not duplicates and the carcinogenesis chain is deliberately not
  restated here.

  Two features that a reader would expect in fulminant hepatic failure are
  deliberately absent. Hepatic encephalopathy is not modelled: no cited source
  names it, and the only neurological figures come from a series the systematic
  review partly attributes to boric-acid co-intoxication — see the
  neurological_features_attribution discussion. Pancytopenia is modelled but left
  unconnected in the pathograph, because whether it is direct extrahepatic
  toxicity or a consequence of liver failure with sepsis is itself the open
  question.

  Hepatitis B is a recorded risk factor in both, but for different reasons and
  with different strength of evidence, so the association is stated here without
  importing the HCC entry's interaction model.

  The report used for this entry described the acute and chronic arms as one
  continuous causal chain of nine steps. That framing was not adopted: it makes
  carcinogenesis a downstream consequence of acute hepatic necrosis, which is
  backwards — the two are alternative outcomes of the same exposure at different
  doses, not sequential steps.
environmental:
- name: Dietary aflatoxin exposure from mould-contaminated maize
  exposure_term:
    preferred_term: exposure to aflatoxin
    term:
      id: ECTO:0001108
      label: exposure to aflatoxin
  description: >-
    Ingestion of maize or groundnuts colonised by aflatoxigenic Aspergillus. In
    the Kenyan outbreaks the implicated maize was homegrown rather than
    commercial, and the storage practices that distinguished cases from controls
    were storing the maize wet and storing it inside the home rather than in a
    granary — conditions that favour fungal growth after harvest.
  influences_mechanisms:
  - target: Hepatic Aflatoxin B1 Bioactivation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingested aflatoxin B1 is absorbed and carried by the portal circulation to
      the liver, which is where bioactivation occurs. This exposure is the
      disease; there is no other route to the mechanism.
    evidence:
    - reference: PMID:16330363
      reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The human gastrointestinal tract rapidly absorbs aflatoxins after consumption of contaminated food, and the circulatory system transports the aflatoxins to the liver
      explanation: >-
        States the route from ingestion to the target organ where bioactivation
        happens.
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homegrown (not commercial) maize kernels from case households had higher concentrations of aflatoxins than did kernels from control households [geometric mean (GM) = 354.53 ppb vs. 44.14 ppb; p = 0.04].
    explanation: >-
      The case-control exposure contrast, which is what makes this an
      established cause rather than a suspected one.
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Case patients stored wet maize (OR = 3.5; 95% CI, 1.2-10.3) inside their homes (OR = 12.0; 95% CI, 1.5-95.7) rather than in granaries more often than did controls.
    explanation: >-
      Identifies the modifiable post-harvest practices, which is where
      prevention acts.
  - reference: PMID:48730
    reference_title: Hepatitis due to aflatoxicosis. An outbreak in Western India.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease was associated with the consumption of maize contaminated heavily with Aspergillus flavus. Analysis of contaminated samples showed that affected people could have consumed between 2 and 6 mg. of aflatoxin daily over a period of a month.
    explanation: >-
      An independent outbreak with an estimated ingested dose, which is the
      closest thing to a dose-response figure available for human disease.
infectious_agent:
- name: Aspergillus flavus S strain
  infectious_agent_term:
    preferred_term: Aspergillus flavus
    term:
      id: NCBITaxon:5059
      label: Aspergillus flavus
  description: >-
    The producing organism, not an infection of the patient — A. flavus
    contaminates the crop and the toxin is eaten. The S strain, distinguished by
    sclerotia under 400 micrometres, produces more aflatoxin than the L strain
    and its incidence in a maize sample tracks the sample's aflatoxin content.
  evidence:
  - reference: PMID:17308181
    reference_title: "Outbreak of an acute aflatoxicosis in Kenya in 2004: identification of the causal agent."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Here we associate the S strain of Aspergillus flavus with lethal aflatoxicoses that took more than 125 lives in 2004.
    explanation: Identifies the causal organism of the reference outbreak.
  - reference: PMID:17308181
    reference_title: "Outbreak of an acute aflatoxicosis in Kenya in 2004: identification of the causal agent."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Maize aflatoxin content and S-strain incidence were highly correlated.
    explanation: >-
      Links strain identity quantitatively to toxin burden, which is why the
      strain matters rather than the species alone.
pathophysiology:
- name: Hepatic Aflatoxin B1 Bioactivation
  biological_scale: MOLECULAR
  description: >-
    Aflatoxin B1 arriving at the liver is oxidised by cytochrome P450 to the
    reactive exo-8,9-epoxide. This step is shared with chronic aflatoxin
    carcinogenesis; everything downstream of it in this entry is not.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    modifier: INCREASED
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Macromolecular Adduct Formation
    causal_link_type: DIRECT
    description: >-
      The epoxide binds covalently to DNA bases and to proteins, notably serum
      albumin.
  triggers:
  - preferred_term: exposure to aflatoxin
    term:
      id: ECTO:0001108
      label: exposure to aflatoxin
- name: Macromolecular Adduct Formation
  biological_scale: MOLECULAR
  description: >-
    A small but fixed fraction of ingested aflatoxin binds irreversibly to
    protein and DNA. The albumin adduct is the measurable one and, because it is
    not repaired, it persists with the half-life of albumin itself — which is
    what makes it a usable exposure biomarker weeks after the meal.
  downstream:
  - target: Protein Synthesis Disruption and Oxidative Injury
    causal_link_type: DIRECT
    description: >-
      Disruption of hepatocyte proteins and DNA produces the cytotoxic injury.
      The intermediates that were previously left unnamed on this edge are now
      an explicit node, so the edge itself is direct.
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From 1 to 3% of ingested aflatoxins irreversibly bind to proteins and DNA bases to form adducts such as aflatoxin B1-lysine in albumin (Skipper and Tannenbaum 1990).
    explanation: >-
      Quantifies the fraction that forms adducts and names the specific albumin
      adduct used as the biomarker.
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disruption of proteins and DNA bases in hepatocytes causes liver toxicity (Tandon et al. 1978).
    explanation: >-
      States the link from adduct formation to hepatotoxicity. Note this
      sentence is itself a citation to earlier work within the cited paper, so it
      reports rather than demonstrates the step.
- name: Protein Synthesis Disruption and Oxidative Injury
  biological_scale: CELLULAR
  description: >-
    The cytotoxic arm that distinguishes acute aflatoxicosis from the chronic
    carcinogenic route. Adducted macromolecules disrupt protein synthesis, and
    DNA damage, oxidative stress and lipid peroxidation act alongside it. This
    node exists because it is the acute-specific mechanism: none of it is the
    TP53 mutagenesis that drives the chronic arm curated in
    Aflatoxin_Related_HCC.
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Hepatocyte Necrosis
    causal_link_type: DIRECT
    description: >-
      The combined injury kills hepatocytes outright at acute dose.
  evidence:
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Acute aflatoxicosis manifests as acute hepatic failure and jaundice, caused by toxic metabolites that lead to hepatic necrosis through mechanisms involving DNA damage, oxidative stress, and lipid peroxidation.
    explanation: >-
      Names the injury mechanisms that lead to necrosis, distinct from the
      mutagenic route.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Disruption of protein synthesis and immune suppression further contribute to disease severity, and impaired production of clotting factors leads to coagulopathy and bleeding risks (Benkerroum, 2020).
    explanation: >-
      Adds protein-synthesis disruption and gives the route to coagulopathy,
      which is curated as a phenotype of this node's consequence.
- name: Hepatocyte Necrosis
  biological_scale: CELLULAR
  description: >-
    Centrilobular hepatocyte death at acute dose. Split from acute hepatic
    failure, which is the organism-level consequence, because the two sit at
    different biological scales and the second follows from the first.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Acute Hepatic Failure
    causal_link_type: DIRECT
    description: >-
      Loss of hepatocyte mass beyond hepatic reserve produces organ failure.
  evidence:
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Acute exposure to high levels of aflatoxin B1, one of the most toxic mycotoxins, can result in severe poisoning, defined as acute aflatoxicosis, which manifests as acute hepatic failure followed by death in severe cases.
    explanation: >-
      States the acute exposure to hepatic failure route that this node and the
      next one decompose.
- name: Acute Hepatic Failure
  biological_scale: ORGANISM
  description: >-
    Organ-level failure: jaundice, coagulopathy, ascites and death. The clinical
    presentation is nonspecific enough that the 2004 outbreak was investigated as
    acute jaundice of unknown origin, with the seven patients who had serum
    tested negative for every hepatotropic virus known to circulate in the
    region.
  downstream:
  - target: Jaundice
    causal_link_type: DIRECT
    description: Loss of hepatocyte conjugating and excretory capacity.
  - target: Coagulopathy
    causal_link_type: DIRECT
    description: >-
      Failure of hepatic clotting-factor synthesis, the route the systematic
      review names explicitly.
  - target: Ascites and portal hypertension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Portal hypertension and the fall in plasma oncotic pressure that follows
      loss of hepatic albumin synthesis are the intermediates. Both are named in
      the western India outbreak report as part of the same syndrome, neither was
      measured there, so they are recorded on the edge rather than modelled as
      their own nodes.
  - target: Vomiting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The systematic review places vomiting downstream of the necrosis-to-failure
      chain, but does so narratively ("as a result") while citing a secondary
      source. Direct gastrointestinal toxicity of ingested aflatoxin is an
      untested alternative route and would not run through hepatic failure at
      all, so the intermediates are recorded as unknown rather than assumed.
  - target: Abdominal pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Same standing as vomiting: attributed to the hepatic chain by the review's
      narrative, with direct gastrointestinal toxicity unexcluded.
  - target: Diarrhoea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Same standing as vomiting and abdominal pain.
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During January-June 2004, an aflatoxicosis outbreak in eastern Kenya resulted in 317 cases and 125 deaths.
    explanation: The scale and lethality of the reference outbreak.
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aflatoxicosis can progress to potentially lethal acute hepatitis with vomiting, abdominal pain, hepatitis, and death (Etzel 2002).
    explanation: Describes the clinical progression of the acute syndrome.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      As a result, symptoms of acute aflatoxicosis include nausea, vomiting, abdominal pain, fever, diarrhoea, oedema, jaundice, convulsions, intestinal bleedings, and even death in severe cases (Kamala et al., 2018).
    explanation: >-
      The basis for the gastrointestinal edges out of this node. Graded INDIRECT
      and OTHER because the sentence is the review's narrative summary of a
      secondary source rather than a result of the review itself, and "as a
      result" is the only thing that places these symptoms downstream of hepatic
      failure.
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients had serum samples analyzed at the Kenya Medical Research Institute (KEMRI), and all were negative for viruses known to cause hepatic disease in Kenya (e.g., yellow fever; Rift Valley fever; dengue; acute hepatitis A, B, and C; West Nile virus; and Chikungunya and Bunyamwera) (American Public Health Association 2000).
    explanation: >-
      Supports the description's claim that hepatotropic viral causes were
      excluded, and is the diagnostic basis for treating this as a toxic rather
      than infectious hepatitis.
biochemical:
- name: Serum aflatoxin B1-lysine albumin adduct
  readouts:
  - target: Macromolecular Adduct Formation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The assay measures the adduct node directly: the analyte is the adduct.
      This is the join between the biomarker and the mechanism, and it is the
      reason exposure can be confirmed weeks after the contaminated meal.
  - target: Acute Hepatic Failure
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Higher adduct concentration tracks with shorter survival after the onset of
      jaundice. Prognostic rather than a readout of the failure itself: the
      adduct records the dose received, not the state of the liver.
    evidence:
    - reference: PMID:16330363
      reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Serum adduct concentrations were associated with time from jaundice to death [adjusted hazard ratio = 1.3; 95% confidence interval (CI), 1.04-1.6].
      explanation: >-
        Gives the effect estimate behind the prognostic link, in the acute human
        outbreak rather than in a model system.
  notes: >-
    The exposure biomarker for aflatoxicosis. Because the adduct is not repaired,
    its serum half-life approximates that of albumin itself — roughly 20-60 days
    — so it records exposure long after unbound aflatoxin has cleared, which
    happens within minutes to a couple of hours. In the Kenyan case-control study
    adduct concentration was associated with survival time from jaundice to
    death, making it prognostic as well as diagnostic.
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum adduct concentrations were associated with time from jaundice to death [adjusted hazard ratio = 1.3; 95% confidence interval (CI), 1.04-1.6].
    explanation: >-
      Establishes the adduct as prognostic, with an effect estimate, in acute
      human disease.
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because aflatoxin B1-lysine adducts are not repaired, their half-life in human serum is approximately 20-60 days
    explanation: >-
      Explains the measurement window, which is why the adduct rather than free
      aflatoxin is the assay of record.
phenotypes:
- category: Hepatic
  name: Jaundice
  description: >-
    The presenting sign and the basis of the outbreak case definition — acute
    jaundice of unknown origin, without a history of cirrhosis or obstructive
    liver disease.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
    temporality: ACUTE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our case definition was restricted to acute jaundice of unknown origin (i.e., no history of cirrhosis or obstructive liver disease) leading to hospitalization
    explanation: >-
      Gives the operational case definition used in the reference investigation.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common symptoms included vomiting (77-100 %), jaundice (88-100 %), and abdominal pain (8-87 %).
    explanation: >-
      Frequency support. Jaundice was reported in 88-100% of cases across the
      outbreaks pooled by the systematic review, which is why the band is
      VERY_FREQUENT rather than OBLIGATE.
- category: Hepatic
  name: Acute hepatic failure
  description: >-
    The lethal manifestation. The 2004 Kenyan outbreak was recognised as a
    cluster of acute hepatic failure before its cause was known.
  phenotype_term:
    preferred_term: Acute hepatic failure
    term:
      id: HP:0006554
      label: Acute hepatic failure
    temporality: ACUTE
  reports_on:

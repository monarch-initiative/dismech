histopathology:
- name: Bile duct proliferation and giant cells
  description: >-
    Necropsy liver from the western India outbreak showed bile duct proliferation
    and giant cells.
  evidence:
  - reference: PMID:48730
    reference_title: Hepatitis due to aflatoxicosis. An outbreak in Western India.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A specimen of liver obtained at necropsy showed bileduct proliferation and giant cells.
    explanation: >-
      The only histological description among the cited outbreak reports.
prevalence:
- population: Eastern Kenya, January-June 2004 outbreak
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Aflatoxicosis occurs in epidemics rather than at a background rate, so no
    population prevalence is meaningful. The 2004 Kenyan outbreak, at 317 cases
    and 125 deaths, is the largest documented by fatality count.
  evidence:
  - reference: PMID:17308181
    reference_title: "Outbreak of an acute aflatoxicosis in Kenya in 2004: identification of the causal agent."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 317 cases were reported by 20 July 2004, with a case fatality rate of 39% (1,26).
    explanation: >-
      Gives case count and case fatality rate for the reference outbreak. Graded
      HUMAN_CLINICAL rather than OTHER: this passage reports human case counts
      and a case-fatality rate, even though the same paper's fungal-strain claims
      are OTHER. evidence_source classifies the quoted passage, so the two grades
      coexist in one paper.
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although aflatoxicosis outbreaks have occurred periodically in Africa and Asia, this outbreak resulted in the largest number of fatalities ever documented
    explanation: Places the outbreak in historical context.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality ranged from 16.2 to 76.5 %, affecting children under 15 and adults over 40 most severely.
    explanation: >-
      Puts the Kenyan 39% case fatality inside the range observed across
      outbreaks, and identifies the two age groups that carry it.
- population: Outbreak-affected populations, 1990-2023
  measure_type: PERIOD_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 8.0
  rate_denominator: POPULATION
  notes: >-
    The only occurrence figure derivable from the whole 1990-2023 literature: an
    outbreak attack rate of 8 cases per 100,000, from the single investigation
    that reported a denominator. Recorded as PERIOD_PREVALENCE because an outbreak
    attack rate is a cumulative incidence proportion over the outbreak period, not
    an annual rate; ANNUAL_INCIDENCE would misstate the denominator's time base.
    It is not a background population rate and should not be compared with one.
  evidence:
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one outbreak provided sufficient data to estimate an attack rate of 8 cases per 100,000.
    explanation: >-
      States the attack rate and, in the same sentence, that only one of the nine
      included studies supported estimating one.
treatments:
- name: Supportive care
  description: >-
    There is no antidote. Management is supportive — transfusion of red cells and
    fresh frozen plasma for the coagulopathy, antimicrobials for intercurrent
    infection, and organ support. The single detailed case report describes
    recovery on this management, which is the most that can be claimed for it.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute Hepatic Failure
    description: >-
      Supports organ function while the liver regenerates; it does not act on
      aflatoxin metabolism or adduct formation.
  evidence:
  - reference: PMID:16175785
    reference_title: "Acute aflatoxicosis: case report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management consisted of supportive care including antibiotics and antifungal therapy, transfusion of red blood cells and fresh frozen plasma. His recovery was uneventful.
    explanation: >-
      A single uncontrolled case. Graded INDIRECT because recovery after
      supportive care in one patient does not establish that the care caused the
      recovery.
diagnosis:
- name: Serum aflatoxin B1-lysine albumin adduct assay
  description: >-
    The confirmatory test. Because the adduct is not repaired it records exposure
    for weeks, which is what makes retrospective confirmation possible in an
    outbreak investigated after the fact — unbound aflatoxin has cleared within
    hours.
  diagnosis_term:
    preferred_term: serum aflatoxin B1-lysine adduct measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: Serum aflatoxin B1-lysine albumin adduct
  results: >-
    Adduct detectable in serum; concentration tracks maize aflatoxin content and,
    among cases, survival time from jaundice onset.
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because aflatoxin B1-lysine adducts are not repaired, their half-life in human serum is approximately 20-60 days
    explanation: >-
      Establishes the measurement window that makes the assay usable after an
      outbreak rather than only during exposure.
- name: Exclusion of viral hepatitis
  description: >-
    Aflatoxicosis is diagnosed against a case definition of acute jaundice of
    unknown origin, so serological exclusion of the hepatotropic viruses
    circulating locally is the step that gets there. In the 2004 Kenyan outbreak
    this is what redirected the investigation from an infectious to a toxic
    aetiology.
  diagnosis_term:
    preferred_term: serological exclusion of hepatotropic viral infection
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Negative for yellow fever, Rift Valley fever, dengue, hepatitis A, B and C,
    West Nile virus, Chikungunya and Bunyamwera.
  evidence:
  - reference: PMID:16330363
    reference_title: "Case-control study of an acute aflatoxicosis outbreak, Kenya, 2004."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients had serum samples analyzed at the Kenya Medical Research Institute (KEMRI), and all were negative for viruses known to cause hepatic disease in Kenya (e.g., yellow fever; Rift Valley fever; dengue; acute hepatitis A, B, and C; West Nile virus; and Chikungunya and Bunyamwera) (American Public Health Association 2000).
    explanation: >-
      The exclusion actually performed, with the panel named. Note it was done in
      seven patients, not in the whole outbreak.
  notes: >-
    Hepatitis B surface antigen is the exception: it is not an exclusion here but
    a recorded risk factor, positive roughly ten times more often in cases than
    controls. Whether that reflects susceptibility or confounding is the open
    question in the hepatitis_b_role_in_acute_aflatoxicosis discussion.
animal_models:
- name: Naturally occurring canine aflatoxicosis, western India 1974
  species: Dog
  category: Natural disease
  description: >-
    Not an engineered model. Dogs sharing the contaminated maize supply developed
    the same hepatitis as the human cases in the 1974 western India outbreak,
    which is the strongest cross-species evidence in the cited corpus that the
    syndrome follows the exposure rather than something else about the affected
    human population.
  publication: PMID:48730
  modeled_mechanisms:
  - target: Acute Hepatic Failure
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      Concurrent canine and human hepatitis from one contaminated food source.
    limitations: >-
      The report gives no dog-specific clinical, biochemical or histological data
      at all — the species appears in a single clause of the abstract, no canine
      case count or mortality is given, and the necropsy specimen described is not
      attributed to a species. Fidelity is UNKNOWN rather than low or moderate
      because there is nothing to assess it against, and no aflatoxin measurement
      was made in the affected dogs.
    evidence:
    - reference: PMID:48730
      reference_title: Hepatitis due to aflatoxicosis. An outbreak in Western India.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Parts of Western India have experienced an outbreak of hepatitis affecting man and dogs and characterised by jaundice, rapidly developing ascites, portal hypertension, and a high mortality-rate.
      explanation: >-
        The whole basis for this entry. Graded HUMAN_CLINICAL, not
        MODEL_ORGANISM, even though it supports an animal-model link:
        evidence_source classifies the cited publication, and this is a human
        epidemiological outbreak report in which dogs appear in one clause. That
        the paper carries no animal study is the same fact that makes the link's
        fidelity UNKNOWN. INDIRECT because the sentence establishes co-occurrence
        in the two species without reporting that the canine disease was
        independently characterised or attributed.
  notes: >-
    Recorded because the cross-species occurrence is real and load-bearing for
    causal attribution, not because it is a usable experimental system. No
    controlled animal study of acute aflatoxicosis is cited in this entry.
discussions:
- discussion_id: neurological_features_attribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Acute Hepatic Failure
  prompt: >-
    Does acute aflatoxicosis produce hepatic encephalopathy, or are the reported
    neurological features attributable to a co-intoxicant?
  rationale: >-
    Encephalopathy is a standard feature of fulminant hepatic failure of any
    cause, and it would be easy to import it here on that basis. The cited corpus
    does not support it. Not one of the five references uses the phrase "hepatic
    encephalopathy". The only neurological figures in the literature — fits in
    85 percent and coma in 31 percent of cases — come from a single 1991 series,
    and the systematic review that pools it says explicitly that that outbreak
    involved co-intoxication with boric acid and that its severity should be
    interpreted with caution. A phenotype was therefore not created: doing so
    would assert on a general clinical expectation what the sources actually
    contest. Resolving this needs neurological findings from an outbreak without
    a co-intoxicant.
  evidence:
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality rates in the study of Tzee-Cheng et al. (1991) should be interpreted with caution, as co-intoxication with excessive levels of boric acid may have influenced the severity of the acute aflatoxicosis (Tzee‐Cheng et al., 1991).
    explanation: >-
      Refutes attributing the 1991 series' neurological severity to aflatoxin
      alone, which is the reason this entry carries no encephalopathy phenotype.
  - reference: PMID:40252547
    reference_title: "Incidence and mortality of acute aflatoxicosis: A systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other symptoms include fever (between 46 and 65 %), diarrhoea (between 31 and 50 %), ascites (50 %), scrotum swelling (8 %), rectal bleeding, easy bruisability, constipation, dyspnea, hypothermia, shock, fits (85 %) and coma (32 %).
    explanation: >-
      The neurological figures themselves. INDIRECT because the sentence reports
      fits and coma as observed symptoms without attributing them to a hepatic
      mechanism, which is precisely the gap.
- discussion_id: hepatitis_b_role_in_acute_aflatoxicosis
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Acute Hepatic Failure
  prompt: >-
    Does hepatitis B infection increase susceptibility to acute aflatoxicosis, or
    is the observed association confounded?
  rationale: >-
    In the Kenyan case-control study, case patients were positive for hepatitis B
    surface antigen roughly ten times more often than controls. In chronic
    aflatoxin exposure an HBV interaction is well established for hepatocellular
    carcinoma, so it is tempting to carry that model across. But the acute
    finding rests on one study with wide confidence intervals, HBV and aflatoxin
    exposure are geographically confounded, and the mechanism that would make an
    HBV-infected liver more vulnerable to a single toxic insult is not the same
    as the mechanism of the chronic interaction. Recorded as open rather than
    imported from the HCC entry.
- discussion_id: acute_dose_threshold_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - environmental#Dietary aflatoxin exposure from mould-contaminated maize
  prompt: >-
    What ingested dose of aflatoxin B1 produces acute hepatic failure in humans,
    and over what period?
  rationale: >-
    Prevention, food standards and outbreak response all turn on this number and
    it is not known. The best human estimate comes from the 1974 western India
    outbreak — 2 to 6 mg daily for about a month, reconstructed from contaminated
    food samples rather than measured intake. The Kenyan outbreak reported maize
    concentrations up to 4,400 ppb but not consumption, so no dose can be
    derived. Every regulatory limit for aflatoxin in food is therefore anchored
    to carcinogenic risk from chronic exposure, not to the acute lethal dose.
- discussion_id: extrahepatic_acute_toxicity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Pancytopenia
  prompt: >-
    Is the marrow suppression reported in acute aflatoxicosis a direct toxic
    effect, or secondary to liver failure and sepsis?
  rationale: >-
    Pancytopenia with bleeding is described in a case report with confirmed serum
    aflatoxin, and it is not predicted by a purely hepatocentric model. It could
    equally reflect the coagulopathy and marrow suppression of any fulminant
    hepatic failure with sepsis. Distinguishing them would need haematological
    data from an outbreak cohort, which no published investigation reports. Kept
    as a phenotype with explicitly weak evidence rather than dropped or
    over-claimed.

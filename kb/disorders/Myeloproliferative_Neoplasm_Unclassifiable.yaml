genetic:
- name: JAK2
  gene_term:
    preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  association: Somatic activating variants
  notes: >-
    Somatic activating JAK2 mutations (most commonly V617F) establish myeloid
    clonality and constitutive JAK-STAT signaling in a major subset of MPN-U
    cases, including early-phase presentations with low variant allele
    frequency.
  evidence:
  - reference: PMID:28808761
    reference_title: "The underappreciated risk of thrombosis and bleeding in patients with myelofibrosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenesis of MF is thought to involve hyper-activation of the
      JAK-STAT intracellular signaling pathway, via mutually exclusive mutations
      of the JAK2, CALR or MPL gene.
    explanation: >-
      Identifies JAK2 among the three canonical somatic MPN driver genes
      activating JAK-STAT signaling.
  - reference: PMID:36580136
    reference_title: "International Consensus Classification of myeloid and lymphoid neoplasms: myeloproliferative neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      high sensitive single target (RT-qPCR, ddPCR) or multi-target
      next-generation sequencing assays with a minimal sensitivity of VAF 1% are
      now important for a proper diagnostic identification of MPN cases with low
      allelic frequencies at initial presentation.
    explanation: >-
      Supports sensitive molecular detection of low-allele-fraction canonical
      MPN driver mutations at presentation.

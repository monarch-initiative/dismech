- name: Clonal Myeloid Proliferation
  biological_scale: CELLULAR
  description: >-
    Clonal expansion of myeloid progenitors and clustered, pleomorphic
    megakaryocytes in the bone marrow and extramedullary sites such as the
    spleen produces proliferative blood-count abnormalities, splenomegaly, and
    constitutional symptom burden without satisfying subtype-specific WHO or ICC
    criteria.

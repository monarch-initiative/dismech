name: Myeloproliferative Neoplasm, Unclassifiable
creation_date: "2026-05-11T14:55:10Z"
description: >-
  Myeloproliferative neoplasm, unclassifiable (MPN-U) is a clonal hematopoietic
  stem cell myeloid neoplasm diagnosed when a patient exhibits definite
  clinical, laboratory, molecular, and morphologic myeloproliferative features
  that fail to satisfy the diagnostic criteria for a specific myeloproliferative
  neoplasm subtype or show overlapping features across subtypes. The category is
  biologically and clinically heterogeneous, encompassing prodromal early-phase
  MPNs, advanced fibrotic MPNs, and cases obscured by coexisting inflammatory or
  neoplastic disorders, and carries substantial risks of arterial or venous
  thrombosis, hemorrhage, splenomegaly, and transformation to blast-phase acute
  myeloid leukemia.
categories:
- Hematologic Malignancy
- Myeloproliferative Neoplasm
parents:

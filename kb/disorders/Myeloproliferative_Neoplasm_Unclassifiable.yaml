pathophysiology:
- name: Somatic JAK2, CALR, or MPL Driver Mutation
  biological_scale: MOLECULAR
  description: >-
    Acquired somatic gain-of-function driver mutations affecting JAK2, CALR, or
    MPL arise in a hematopoietic stem cell in the bone marrow and establish
    clonal hematopoiesis, including early or unclassifiable presentations with
    low variant allele frequencies. Activating JAK2 and MPL variants directly
    increase non-receptor tyrosine kinase and thrombopoietin cytokine receptor
    activity, respectively, whereas mutant CALR lacks intrinsic kinase or
    receptor activity and acts by binding and constitutively activating the
    thrombopoietin receptor MPL.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Somatic activating driver variants in JAK2, CALR, or MPL arising in the
      hematopoietic stem cell compartment.

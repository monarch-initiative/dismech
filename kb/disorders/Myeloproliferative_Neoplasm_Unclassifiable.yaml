  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  - preferred_term: CALR
    term:
      id: hgnc:1455
      label: CALR
  - preferred_term: MPL
    term:
      id: hgnc:7217
      label: MPL

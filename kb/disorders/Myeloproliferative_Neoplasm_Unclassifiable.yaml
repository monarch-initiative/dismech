    modifier: INCREASED
    term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
  - preferred_term: cytokine receptor activity
    modifier: INCREASED
    term:
      id: GO:0004896
      label: cytokine receptor activity
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:34830822
    reference_title: "The Classification of Myeloproliferative Neoplasms: Rationale, Historical Background and Future Perspectives with Focus on Unclassifiable Cases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Myeloproliferative neoplasms (MPNs) are a heterogeneous group of clonal
      hematopoietic stem cell disorders, characterized by increased
      proliferation of one or more myeloid lineages in the bone marrow.
    explanation: >-
      Establishes the hematopoietic stem cell origin in bone marrow across
      myeloproliferative neoplasms, including unclassifiable cases.
  - reference: PMID:28808761
    reference_title: "The underappreciated risk of thrombosis and bleeding in patients with myelofibrosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenesis of MF is thought to involve hyper-activation of the
      JAK-STAT intracellular signaling pathway, via mutually exclusive mutations
      of the JAK2, CALR or MPL gene.
    explanation: >-
      Identifies mutually exclusive somatic driver mutations in JAK2, CALR, or
      MPL as canonical initiating lesions across MPN pathogenesis.
  - reference: PMID:36580136
    reference_title: "International Consensus Classification of myeloid and lymphoid neoplasms: myeloproliferative neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      high sensitive single target (RT-qPCR, ddPCR) or multi-target
      next-generation sequencing assays with a minimal sensitivity of VAF 1% are
      now important for a proper diagnostic identification of MPN cases with low
      allelic frequencies at initial presentation.
    explanation: >-
      Highlights low-allele-burden clonal driver mutations in early or
      unclassifiable MPN presentations.
  downstream:
  - target: JAK-STAT Signaling Hyperactivation
    causal_link_type: DIRECT
    description: >-
      Somatic activating variants in JAK2, MPL, or MPL-binding mutant CALR
      directly trigger constitutive intracellular JAK-STAT receptor signaling.
    evidence:
    - reference: PMID:28808761
      reference_title: "The underappreciated risk of thrombosis and bleeding in patients with myelofibrosis: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The pathogenesis of MF is thought to involve hyper-activation of the
        JAK-STAT intracellular signaling pathway, via mutually exclusive
        mutations of the JAK2, CALR or MPL gene.
      explanation: >-
        Directly links somatic JAK2, CALR, or MPL driver mutations to
        hyperactivation of the intracellular JAK-STAT signaling pathway.
  - target: Leukemic Blast-Phase Transformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Clonal genomic evolution of the mutant hematopoietic stem and progenitor
      compartment can progress to accelerated or blast-phase acute myeloid
      leukemia.
    evidence:
    - reference: DOI:10.1038/s41408-023-00878-8
      reference_title: "Blast phase myeloproliferative neoplasm: contemporary review and 2024 treatment algorithm"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Leukemic transformation in myeloproliferative neoplasms (MPN), also
        referred to as “blast-phase MPN”, is the most feared disease
        complication, with incidence estimates of 1–4% for essential
        thrombocythemia, 3–7% for polycythemia vera, and 9–13% for primary
        myelofibrosis.
      explanation: >-
        Demonstrates clonal progression of MPN stem/progenitor disease into
        blast-phase leukemic transformation.

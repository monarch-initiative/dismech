environmental:
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  effect: Risk factor
  notes: >-
    Daily tobacco smoking was associated with increased risk of developing
    myeloproliferative neoplasms in a Danish general-population cohort, with the
    highest subtype-specific hazard ratio reported for MPN-unclassified (HR 6.2,
    95% CI 1.5-25); this estimate has a wide confidence interval and warrants
    cautious interpretation given the rarity of MPN-U and potential
    diagnosis-code misclassification.
  evidence:
  - reference: PMID:30318865
    reference_title: "Smoking is associated with increased risk of myeloproliferative neoplasms: A general population-based cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For essential thrombocytosis, polycythemia vera, myelofibrosis, and
      MPN-unclassified, the HRs were 1.8 (95% CI: 0.5-5.8), 1.7 (95% CI:
      0.5-5.8), 4.3 (95% CI: 0.9-19), and 6.2 (95% CI: 1.5-25), respectively.
    explanation: >-
      Population-based cohort study demonstrating elevated hazard ratio for
      MPN-unclassified among smokers compared with never-smokers.
diagnosis:
- name: Bone Marrow Trephine Biopsy and Exclusionary Clinicopathologic Evaluation
  presence: PRESENT
  description: >-
    Diagnosis requires bone marrow trephine biopsy demonstrating MPN-type
    megakaryocytic and myeloid proliferation (or advanced myelofibrosis) paired
    with integrated clinical and laboratory exclusion of BCR::ABL1 chronic
    myeloid leukemia and all other defined classical or non-classical MPN
    subtypes.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  evidence:
  - reference: PMID:35217310
    reference_title: "Diagnostic and management strategies for Myeloproliferative Neoplasm-Unclassifiable (MPN-U): An international survey of contemporary practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myeloproliferative Neoplasm-Unclassifiable (MPN-U) is defined as an MPN
      that fails to meet the diagnostic criteria for any of the other defined
      classical or 'non-classical' MPNs.
    explanation: >-
      Establishes the operational exclusionary diagnostic definition of MPN-U.
  - reference: PMID:33751548
    reference_title: "Clinicopathological characterisation of myeloproliferative neoplasm-unclassifiable (MPN-U): a retrospective analysis from a large UK tertiary referral centre."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Albeit heterogeneous, common presentation features included raised lactate
      dehydrogenase, thrombocytosis and clustered/pleomorphic megakaryocytes on
      trephine biopsy.
    explanation: >-
      Demonstrates the diagnostic role of bone marrow trephine biopsy in
      identifying MPN-type megakaryocytic morphology.
- name: High-Sensitivity Myeloid Driver Sequencing Panel
  presence: PRESENT
  description: >-
    Single-target quantitative PCR or multi-gene myeloid next-generation
    sequencing with sensitivity down to 1% variant allele frequency detects
    canonical JAK2, CALR, or MPL driver variants and co-occurring clonal myeloid
    mutations in triple-negative or early-phase MPN-U cases.
  diagnosis_term:
    preferred_term: next generation sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:36580136
    reference_title: "International Consensus Classification of myeloid and lymphoid neoplasms: myeloproliferative neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this regard, high sensitive single target (RT-qPCR, ddPCR) or
      multi-target next-generation sequencing assays with a minimal sensitivity
      of VAF 1% are now important for a proper diagnostic identification of MPN
      cases with low allelic frequencies at initial presentation.
    explanation: >-
      Establishes high-sensitivity PCR and multi-target NGS assays (VAF >= 1%)
      for molecular confirmation of clonality in MPN diagnostic workup.
treatments:
- name: Phenotype-Directed Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Because no MPN-U-specific randomized trial evidence or licensed regimen
    exists, pharmacologic management is individualized according to the dominant
    clinical phenotype (thrombosis prophylaxis, cytoreduction for cytoses, or
    splenomegaly/symptom control) by extrapolation from classical MPNs.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Clonal Myeloid Proliferation
    treatment_effect: INHIBITS
    description: >-
      Phenotype-adapted cytoreductive and symptom-directed pharmacotherapy
      mitigates proliferative blood counts and splenomegaly.
  - target: Platelet-Leukocyte and Endothelial Prothrombotic Activation
    treatment_effect: INHIBITS
    description: >-
      Antithrombotic and cytoreductive strategies aim to attenuate thrombotic
      risk in MPN-U.
  evidence:
  - reference: PMID:35217310
    reference_title: "Diagnostic and management strategies for Myeloproliferative Neoplasm-Unclassifiable (MPN-U): An international survey of contemporary practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicians frequently manage these conditions according to the clinical
      concerns e.g. splenomegaly akin to the phenotype, but no evidence base
      exists.
    explanation: >-
      International practice survey confirming phenotype-directed clinical
      management extrapolated from classical MPNs.
- name: Hydroxyurea Cytoreduction
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Hydroxyurea (hydroxycarbamide) is used for cytoreduction in patients with
    hyperproliferative blood counts or elevated thrombosis risk, extrapolated
    from classical MPN management.
  notes: >-
    No MPN-U-specific licensed therapies or consensus treatment guidelines
    exist, and MPN-U patients are routinely excluded from prospective clinical
    trials, so hydroxyurea cytoreduction is extrapolated from classical MPN
    practice.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxyurea
      term:
        id: CHEBI:44423
        label: hydroxyurea
  target_mechanisms:
  - target: Clonal Myeloid Proliferation
    treatment_effect: INHIBITS
    description: >-
      Hydroxyurea suppresses clonal marrow myeloproliferation and lowers
      elevated platelet and leukocyte counts.
  evidence:
  - reference: PMID:28808761
    reference_title: "The underappreciated risk of thrombosis and bleeding in patients with myelofibrosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hydroxyurea should generally be used to normalize platelet counts as able
      [36].
    explanation: >-
      Supports cytoreductive use of hydroxyurea to control proliferative
      platelet counts and reduce thrombotic risk in MPN management.
- name: Ruxolitinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    JAK1/JAK2 inhibition with ruxolitinib may be considered off-label for
    selected patients with symptomatic bulky splenomegaly or severe
    MPN-associated constitutional symptoms by extrapolation from myelofibrosis
    and polycythemia vera.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: JAK-STAT Signaling Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Inhibits hyperactive JAK-STAT signaling driving splenomegaly and
      inflammatory symptom burden.
  evidence:
  - reference: PMID:35217310
    reference_title: "Diagnostic and management strategies for Myeloproliferative Neoplasm-Unclassifiable (MPN-U): An international survey of contemporary practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicians frequently manage these conditions according to the clinical
      concerns e.g. splenomegaly akin to the phenotype, but no evidence base
      exists.
    explanation: >-
      Supports phenotype-directed management of bulky splenomegaly and symptom
      burden extrapolated from related MPNs.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the only potentially
    curative modality and is reserved for selected fit patients with advanced
    fibrotic, accelerated-phase, or blast-phase MPN progression.
  notes: >-
    Identifying which chronic-phase MPN-U patients carry high transformation
    risk and warrant early aggressive disease-modifying therapy prior to
    progression remains clinically challenging.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Somatic JAK2, CALR, or MPL Driver Mutation
    treatment_effect: INHIBITS
    description: >-
      Replaces the malignant hematopoietic stem cell clone with donor
      hematopoiesis.
  - target: Leukemic Blast-Phase Transformation
    treatment_effect: INHIBITS
    description: >-
      Provides potentially curative eradication of accelerated or blast-phase
      leukemic clones in eligible patients.
  evidence:
  - reference: DOI:10.1038/s41408-023-00878-8
    reference_title: "Blast phase myeloproliferative neoplasm: contemporary review and 2024 treatment algorithm"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Allogeneic hematopoietic stem cell transplant (AHSCT) offers the
      possibility of a >30% 3-year survival rate and should be pursued, ideally,
      while the patient is still in chronic phase disease.
    explanation: >-
      Supports allogeneic hematopoietic stem cell transplantation for high-risk
      or transformed MPNs.
progression:
- phase: Heterogeneous chronic phase with transformation risk
  notes: >-
    Clinical course spans indolent early-phase presentations to aggressive
    fibrotic disease and blast-phase AML transformation; median event-free
    survival was 11.25 years in a large UK tertiary cohort and was shortened by
    presenting platelet count below 500 x 10^9/L and leukocytosis at or above
    12 x 10^9/L.
  evidence:
  - reference: PMID:33751548
    reference_title: "Clinicopathological characterisation of myeloproliferative neoplasm-unclassifiable (MPN-U): a retrospective analysis from a large UK tertiary referral centre."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median event-free survival was 11·25 years (95% confidence interval
      9·3-not reached), significantly shortened in cases with lower platelet
      counts (<500 × 109 /l) and a leucocytosis (≥12 × 109 /l) at presentation.
    explanation: >-
      Reports median event-free survival and adverse presenting blood-count
      predictors in MPN-U.
notes: >-
  Pruritus is reported in full-text clinical series of MPN-U (including the UK
  tertiary referral cohort) as part of the constitutional symptom spectrum, but
  is not modeled as a separate phenotype entry because cached PubMed abstracts
  lack a direct quotable pruritus statement.

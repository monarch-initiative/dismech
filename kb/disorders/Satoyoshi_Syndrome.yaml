description: >-
  A rare multisystem disorder characterized by progressive painful muscle spasms,
  alopecia (often progressing to alopecia universalis), chronic diarrhea with
  malabsorption, and skeletal abnormalities. Amenorrhea is common in affected
  females. An autoimmune basis is presumed based on the frequent presence of
  autoantibodies, inflammatory tissue infiltrates, and response to immunosuppressive
  therapy. Approximately 73% of reported cases are female, with median onset
  around age 11 and median age at diagnosis of 16 years. Most cases have been
  reported from Japan.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Systematic review evidence supports classifying Satoyoshi syndrome among
      autoimmune disorders based on autoantibody positivity, autoimmune
      comorbidities, and response to immunosuppression.
    evidence:
    - reference: PMID:36749015
      reference_title: "Is Satoyoshi syndrome an autoimmune disease? A systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Satoyoshi syndrome is associated with other autoimmune diseases and a
        variety of autoantibodies. Improvement after CS or other immunosuppressant
        treatment was observed in 90% of cases. These data support an autoimmune
        aetiology for Satoyoshi syndrome.
      explanation: >-
        Systematic review concludes that the immunologic and therapeutic profile of
        Satoyoshi syndrome aligns with autoimmune diseases.
  - classification_value: NEUROLOGIC
    notes: >-
      Universal painful involuntary muscle spasms are driven by hyperactivity or
      disinhibition at the alpha motor neuron level.
    evidence:
    - reference: PMID:16972238
      reference_title: "Involuntary painful muscle contractions in Satoyoshi syndrome: a surface electromyographic study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings point to hyperactivity or a disinhibition at the alpha motor
        neuron level, originating probably at that level, although a central origin
        cannot be excluded.
      explanation: >-
        Electrophysiological findings localize the core involuntary spasms to motor
        neuron circuit hyperexcitability.
  - classification_value: GASTROINTESTINAL
    notes: >-
      More than half of reported cases exhibit gastrointestinal manifestations,
      principally severe chronic diarrhea and malabsorption.
    evidence:
    - reference: PMID:32429959
      reference_title: "Gastrointestinal manifestations in Satoyoshi syndrome: a systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Chronic diarrhea was the main digestive symptom (92.3%). Other symptoms
        such as abdominal pain (15.4%), nausea (7.7%) and vomiting (7.7%), were
        less frequent.
      explanation: >-
        Systematic review documents major gastrointestinal involvement across
        published Satoyoshi syndrome cases.

environmental:
- name: Prenatal alcohol exposure
  description: >-
    Maternal alcohol consumption during pregnancy is the sole necessary cause.
    The mechanism curated here places the critical window at the onset of
    gastrulation, when retinoic acid signaling is first activated — early enough
    that exposure can precede recognition of the pregnancy.
  exposure_term:
    preferred_term: exposure to drinking alcohol via maternal exposure
    term:
      id: ECTO:0300001
      label: exposure to drinking alcohol via maternal
  influences_mechanisms:
  - target: Competition for Retinaldehyde Dehydrogenase Activity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ethanol reaching the embryo competes with retinol and retinaldehyde for
      the same dehydrogenase activities, which is the initiating step of the
      mechanism curated here.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The biochemical evidence that we present shows that, at the onset of RA signaling during early gastrulation, the ethanol effect centers on the competition for the available retinaldehyde dehydrogenase activity."
      explanation: States the biochemical step by which the exposure acts on this mechanism.
  evidence:
  - reference: PMID:41580353
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fetal Alcohol Spectrum Disorders (FASD) comprise a continuum of neurodevelopmental and physical disabilities resulting from the teratogenic effects of prenatal alcohol exposure."
    explanation: Establishes prenatal alcohol exposure as the cause of the whole spectrum.
pathophysiology:
- name: Competition for Retinaldehyde Dehydrogenase Activity
  biological_scale: MOLECULAR
  description: >-
    Retinoic acid is made from retinol in two oxidation steps, the second
    catalysed by retinaldehyde dehydrogenases, of which RALDH2 (ALDH1A2) is the
    one that switches retinoic acid signaling on at the start of gastrulation.
    Ethanol is a substrate for the same dehydrogenase activities, so an
    ethanol-exposed embryo diverts enzyme capacity away from retinoic acid
    synthesis. The competition model is one of several proposed accounts of
    ethanol teratogenicity, and is the one this entry curates.
  genes:
  - preferred_term: ALDH1A2
    term:
      id: hgnc:15472
      label: ALDH1A2
  biological_processes:
  - preferred_term: retinoic acid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0002138
      label: retinoic acid biosynthetic process
  chemical_entities:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  evidence:
  - reference: PMID:19380308
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Retinaldehyde dehydrogenase 2 (RALDH2) is required to activate RA signaling at the onset of gastrulation."
    explanation: Identifies the enzyme whose activity is competed for and the stage at which it matters.
  - reference: PMID:19380308
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "One of the models proposed to explain the teratogenic effects of EtOH in FASD is the competition between EtOH and ROL for the ADH and RALDH activities that are necessary for RA biosynthesis in the embryo"
    explanation: >-
      Records that this is one competing model of ethanol teratogenicity, which
      is why this node is curated as a route rather than as the mechanism.
  downstream:
  - target: Reduced Retinoic Acid Signaling During Gastrulation
    description: >-
      Diverting retinaldehyde dehydrogenase capacity lowers embryonic retinoic
      acid at exactly the stage when the pathway is first switched on.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In Xenopus embryos, ethanol reduces the levels of retinoic acid (RA) signaling during gastrulation."
      explanation: The measured consequence that this edge asserts.
- name: Reduced Retinoic Acid Signaling During Gastrulation
  biological_scale: ORGANISM
  description: >-
    With retinoic acid below its normal level from gastrulation onward,
    development does not stop — it continues, misdirected, in a signaling
    environment that patterns the head, eye, heart and nervous system. That
    continuation at abnormally low retinoic acid is what the model offers as the
    etiological explanation for a malformation pattern spread across several
    organ systems rather than confined to one.
  biological_processes:
  - preferred_term: retinoic acid receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048384
      label: retinoic acid receptor signaling pathway
  - preferred_term: gastrulation
    modifier: ABNORMAL
    term:
      id: GO:0007369
      label: gastrulation
  evidence:
  - reference: PMID:19380308
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In light of the multiple regulatory roles of RA, continued embryogenesis in the presence of abnormally low RA levels provides an etiological explanation for the malformations observed in individuals with FASD."
    explanation: States the node's central claim in the authors' own terms, including its status as an explanation offered.
  downstream:
  - target: Multisystem Developmental Malformation
    description: >-
      Retinoic acid patterns many structures, so a global reduction produces a
      distributed rather than an organ-specific malformation pattern.
    evidence:
    - reference: PMID:19380308
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "The strongest manifestation of FASD, also known as fetal alcohol syndrome (FAS), can include: craniofacial malformations, microcephaly, short stature, microphthalmia, heart defects and behavioral and psychological problems"
      explanation: >-
        Lists the malformation pattern at the severe end of the spectrum; the
        attribution of that pattern to reduced retinoic acid is the paper's
        proposal, not a demonstrated result in humans.
- name: Multisystem Developmental Malformation
  biological_scale: ORGANISM
  description: >-
    The severe end of the spectrum, fetal alcohol syndrome, combines craniofacial
    malformation, microcephaly, growth restriction, microphthalmia, heart defects
    and behavioural impairment. Milder positions on the continuum may carry the
    neurodevelopmental impairment without the recognizable physical features,
    which is a large part of why the diagnosis is missed.
  evidence:
  - reference: PMID:19380308
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The strongest manifestation of FASD, also known as fetal alcohol syndrome (FAS), can include: craniofacial malformations, microcephaly, short stature, microphthalmia, heart defects and behavioral and psychological problems"
    explanation: Enumerates the malformation pattern this node describes.
  downstream:
  - target: Microcephaly
    description: Reduced brain growth is among the cardinal features at the severe end of the spectrum.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The strongest manifestation of FASD, also known as fetal alcohol syndrome (FAS), can include: craniofacial malformations, microcephaly, short stature, microphthalmia, heart defects and behavioral and psychological problems"
      explanation: Lists microcephaly among the features.
  - target: Short stature
    description: Growth restriction is part of the recognized pattern.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The strongest manifestation of FASD, also known as fetal alcohol syndrome (FAS), can include: craniofacial malformations, microcephaly, short stature, microphthalmia, heart defects and behavioral and psychological problems"
      explanation: Lists short stature among the features.
  - target: Microphthalmia
    description: >-
      Ocular involvement is expected under a retinoic-acid mechanism, since eye
      development is retinoic acid dependent.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The strongest manifestation of FASD, also known as fetal alcohol syndrome (FAS), can include: craniofacial malformations, microcephaly, short stature, microphthalmia, heart defects and behavioral and psychological problems"
      explanation: Lists microphthalmia among the features.
  - target: Abnormal heart morphology
    description: Congenital heart defects are part of the recognized pattern.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The strongest manifestation of FASD, also known as fetal alcohol syndrome (FAS), can include: craniofacial malformations, microcephaly, short stature, microphthalmia, heart defects and behavioral and psychological problems"
      explanation: Lists heart defects among the features.
  - target: Neurodevelopmental impairment
    description: >-
      Neurodevelopmental disability is the feature present across the whole
      continuum, including where physical features are absent.
    evidence:
    - reference: PMID:41580353
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Fetal Alcohol Spectrum Disorders (FASD) comprise a continuum of neurodevelopmental and physical disabilities resulting from the teratogenic effects of prenatal alcohol exposure."
      explanation: Establishes neurodevelopmental disability as spanning the continuum rather than being confined to the severe end.

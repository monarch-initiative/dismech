name: Fetal Alcohol Spectrum Disorder
creation_date: '2026-08-27T15:10:00Z'
description: >-
  Fetal alcohol spectrum disorder is the continuum of neurodevelopmental and
  physical disability caused by prenatal alcohol exposure, with fetal alcohol
  syndrome at its severe end. It is common — school-based US surveys put it at
  1-5% of first-graders — and entirely preventable. Several mechanisms have been
  proposed for ethanol teratogenicity (apoptosis, oxidative stress, adhesion
  defects, growth-factor effects, retinoic acid antagonism); this entry curates
  the retinoic acid route, in which ethanol competes for the retinaldehyde
  dehydrogenase activity that generates retinoic acid at the onset of
  gastrulation, so embryogenesis continues at abnormally low retinoic acid
  levels. That route is the one for which a Xenopus model provides direct
  biochemical and rescue evidence; the others are not represented here.
category: Environmental
parents:
- Teratogenic disorder
- Neurodevelopmental disorder
synonyms:
- FASD
- prenatal alcohol exposure spectrum
- fetal alcohol syndrome

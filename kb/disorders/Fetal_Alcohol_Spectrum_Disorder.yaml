treatments:
- name: Abstinence from alcohol during pregnancy
  description: >-
    The only intervention that addresses the cause. Because the mechanism
    curated here operates at gastrulation, prevention has to precede the point
    at which many pregnancies are recognized, which is why the recommendation is
    framed as abstinence rather than as reduction after a positive test.
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:41580353
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "abstaining from alcohol consumption during pregnancy is the safest and most effective strategy to prevent FASD"
    explanation: The prevention recommendation stated by a current diagnostic review.
animal_models:
- name: Xenopus ethanol-exposed gastrula with RALDH manipulation
  species: Xenopus laevis
  genotype: >-
    Wild-type embryos treated with high or low ethanol, combined with partial
    RALDH inhibition, Raldh2 overexpression, or RALDH2 knockdown
  category: Teratogen exposure model with pathway epistasis
  publication: PMID:19380308
  description: >-
    A rare case of a teratogen's mechanism being pinned down by epistasis rather
    than by correlation. Three manipulations converge on the same conclusion: a
    low ethanol dose plus partial RALDH inhibition phenocopies a high ethanol
    dose; Raldh2 overexpression rescues the high-dose malformations; and RALDH2
    knockdown produces the same retinoic acid deficit whether or not ethanol is
    also present, meaning ethanol has nothing left to act on once the enzyme is
    gone. Together these place RALDH2 as the principal target of ethanol at the
    onset of gastrulation.
  genes:
  - preferred_term: ALDH1A2
    term:
      id: hgnc:15472
      label: ALDH1A2
  modeled_mechanisms:
  - target: Competition for Retinaldehyde Dehydrogenase Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes by rescue and epistasis, not by correlation, that ethanol's
      effect at gastrulation runs through retinaldehyde dehydrogenase capacity.
    limitations: >-
      Acute exposure of frog gastrulae to defined ethanol concentrations is not
      the chronic, variable, dose-uncertain exposure of a human pregnancy, and
      the model addresses only the gastrulation window — later effects of
      alcohol on neuronal survival and migration, which matter for the
      neurodevelopmental end of the spectrum, are outside it. Competition for
      RALDH is one of several proposed mechanisms of ethanol teratogenicity;
      this model makes a strong case for it in Xenopus without excluding the
      others in humans.
    readouts:
    - name: Malformation rate under low ethanol plus partial RALDH inhibition
      target: Competition for Retinaldehyde Dehydrogenase Activity
      direction: INCREASED
      interpretation: >-
        Phenocopy in one direction: removing enzyme capacity chemically
        substitutes for the extra ethanol, as the competition model predicts.
      evidence:
      - reference: PMID:19380308
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Developmental defects that were characteristic of high ethanol concentrations were phenocopied by a low ethanol concentration combined with partial RALDH inhibition, whereas Raldh2 overexpression rescued the developmental malformations induced by high ethanol."
        explanation: Reports both the phenocopy and the rescue arms in one measured comparison.
    - name: Malformation rate under high ethanol with Raldh2 overexpression
      target: Competition for Retinaldehyde Dehydrogenase Activity
      direction: RESTORED
      interpretation: >-
        Rescue in the other direction: adding enzyme capacity restores normal
        development despite the ethanol, which is the strongest single argument
        that competition for that capacity is the mechanism.
      evidence:
      - reference: PMID:19380308
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Developmental defects that were characteristic of high ethanol concentrations were phenocopied by a low ethanol concentration combined with partial RALDH inhibition, whereas Raldh2 overexpression rescued the developmental malformations induced by high ethanol."
        explanation: The same sentence reports the rescue arm that this readout scores.
    - name: Retinoic acid signaling level under RALDH2 knockdown with and without ethanol
      target: Competition for Retinaldehyde Dehydrogenase Activity
      direction: UNCHANGED
      interpretation: >-
        The epistasis test. Ethanol adds nothing once RALDH2 is absent, which
        identifies RALDH2 as the target ethanol acts on rather than one of
        several parallel routes.
      evidence:
      - reference: PMID:19380308
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "RALDH2 knockdown resulted in similar RA signaling levels when carried out alone or in combination with ethanol treatment, suggesting that RALDH2 is the main target of ethanol."
        explanation: Reports the non-additivity that grounds the epistatic conclusion.
    evidence:
    - reference: PMID:19380308
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The biochemical evidence that we present shows that, at the onset of RA signaling during early gastrulation, the ethanol effect centers on the competition for the available retinaldehyde dehydrogenase activity."
      explanation: The paper's summary of the mechanism this link asserts.
  - target: Reduced Retinoic Acid Signaling During Gastrulation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the direct measurement of embryonic retinoic acid signaling under
      ethanol that the human disease cannot supply.
    limitations: >-
      Signaling levels are measured in the frog gastrula; no equivalent
      measurement exists in an ethanol-exposed human embryo, so the human arm of
      this node rests on the inference from model to patient rather than on
      measurement.
    readouts:
    - name: Retinoic acid signaling level in ethanol-exposed gastrulae
      target: Reduced Retinoic Acid Signaling During Gastrulation
      direction: DECREASED
      interpretation: >-
        The primary observation the whole mechanism is built on, measured at the
        stage when the pathway is first activated.
      evidence:
      - reference: PMID:19380308
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In Xenopus embryos, ethanol reduces the levels of retinoic acid (RA) signaling during gastrulation."
        explanation: States the measured reduction and its developmental stage.
    evidence:
    - reference: PMID:19380308
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "In light of the multiple regulatory roles of RA, continued embryogenesis in the presence of abnormally low RA levels provides an etiological explanation for the malformations observed in individuals with FASD."
      explanation: >-
        The step from measured frog signaling to human malformation is offered
        as an explanation, which is the level this link supports.
discussions:
- discussion_id: fasd_mechanism_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Ethanol teratogenicity has several proposed mechanisms — apoptosis induction,
    oxidative stress, cell adhesion defects, growth-factor effects, and retinoic
    acid antagonism. Only the retinoic acid route is curated here. Should the
    others be added as parallel pathophysiology branches, and if so how should
    their relative contributions be represented?
  attaches_to:
  - pathophysiology#Competition for Retinaldehyde Dehydrogenase Activity
  rationale: >-
    This entry was created to host a Xenopus model that makes a strong epistatic
    case for the retinoic acid route, and the pathograph reflects that model's
    scope rather than the state of the field. Presenting one route without the
    others risks reading as a claim that the question is settled, which it is
    not. The competing mechanisms are named in the same paper's introduction and
    each has its own literature.
  evidence:
  - reference: PMID:19380308
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One of the models proposed to explain the teratogenic effects of EtOH in FASD is the competition between EtOH and ROL for the ADH and RALDH activities that are necessary for RA biosynthesis in the embryo"
    explanation: Records that the curated route is one model among several.
- discussion_id: fasd_dysmorphology_criteria
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    The three sentinel facial features used diagnostically — short palpebral
    fissures, smooth philtrum and thin upper vermilion border — are not curated
    as phenotypes here. Which source should they be taken from?
  attaches_to:
  - phenotypes#
  rationale: >-
    The 2016 updated diagnostic guidelines are the right authority, but their
    abstract describes the process of revising the criteria rather than stating
    the criteria themselves, and this entry's evidence policy requires an exact
    quote that substantively supports the claim. The features are therefore
    omitted rather than sourced to a paraphrase. A full-text guideline record or
    a review that states the triad explicitly would close this.
  evidence:
  - reference: PMID:41580353
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FASD remains frequently underrecognized or misdiagnosed"
    explanation: >-
      Underdiagnosis is what makes precise dysmorphology criteria worth curating
      rather than a bookkeeping detail.
notes: >-
  Entry created while curating the Xenopus retinaldehyde-dehydrogenase
  competition model from Disease Models & Mechanisms. Scope is deliberately
  narrow: the pathophysiology curates the retinoic acid route only, and the
  phenotype list covers the features for which a quotable source was available.
  The sentinel facial features and the alcohol-related neurodevelopmental
  disorder / partial fetal alcohol syndrome subdivisions of the spectrum are
  tracked as open curation items rather than left implied.

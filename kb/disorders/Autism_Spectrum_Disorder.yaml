discussions:
- discussion_id: gap_asd_validated_biological_stratification
  prompt: >-
    Which reproducible combinations of genotype, development, physiology, and
    phenotype define treatment-relevant ASD subgroups without collapsing
    heterogeneous people into a universal biomarker signature?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Polygenic neurodevelopmental liability
  - pathophysiology#Rare coding and copy-number variant liability
  - pathophysiology#Distributed developmental circuit differences
  rationale: >-
    Imaging, EEG, immune, metabolomic, microbiome, and molecular differences are
    generally group associations with limited replication or specificity. No
    validated biological test diagnoses broad ASD or selects a general
    core-symptom treatment. Large, diverse, longitudinal, externally replicated
    studies with prespecified individual-level performance are needed.
  evidence:
  - reference: PMID:40274203
    reference_title: "Autism diagnosis in children and adolescents: A systematic review and meta-analysis of test accuracy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, certainty of the evidence was low and very low except for ADOS-2 (moderate).
    explanation: Even established behavioral tools have important evidence limitations.
- discussion_id: gap_asd_lifespan_natural_history_and_supports
  prompt: >-
    Which supports improve self-defined quality of life, health, communication,
    autonomy, safety, participation, housing, and employment across diverse
    autistic adults and people with high communication or support needs?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Adulthood and later life
  rationale: >-
    Adult and later-life cohorts, people with intellectual disability or
    limited speech, and people outside high-income settings remain
    underrepresented. Outcomes should extend beyond symptom scores and be
    selected with autistic people and families.
  evidence:
  - reference: PMID:41926193
    reference_title: "Interventions for autistic adults: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-five studies were included (N = 1,631 total participants).
    explanation: >-
      The modest adult evidence base motivates broader, more representative
      lifespan research.
- discussion_id: gap_asd_causal_status_of_immune_and_microbiome_associations
  prompt: >-
    Do immune or microbiome changes causally modify defined symptoms or
    co-occurring conditions in reproducible ASD subgroups, or are they
    consequences of diet, medication, gastrointestinal disease, stress,
    sampling, and other confounding?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Immune and neuroinflammatory associations in studied groups
  - pathophysiology#Gut microbiome associations in studied groups
  rationale: >-
    Current reviews supply biological plausibility and group associations but
    not a general causal ASD pathway. Mechanistic trials require prespecified
    subgroups, appropriate non-autistic and gastrointestinal controls,
    longitudinal sampling, and clinically meaningful outcomes.
  evidence:
  - reference: PMID:41550027
    reference_title: "The gatekeepers breached: claudin dysregulation in psychiatric disorders."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In autism and ADHD, altered tight junction protein profiles imply more subtle or context-dependent barrier dysfunction.
    explanation: The context-dependent wording illustrates the unresolved causal status.
- discussion_id: gap_asd_ibs_hpa_gri_brain_gut_coupling
  prompt: >-
    Does hypothalamic-pituitary-adrenal (HPA) axis dysregulation with impaired
    glucocorticoid-responsive immune (GRI) signaling in peripheral immune cells
    (monocytes, natural killer cells, B cells; reported core genes LRFN1,
    NUAK2, TMEM154, GAPT) causally couple the immune and
    microbiome associations reported in autism spectrum disorder to those
    reported in the frequently co-occurring irritable bowel syndrome, or is the
    shared GRI signature a common downstream stress response in both conditions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Immune and neuroinflammatory associations in studied groups
  - pathophysiology#Gut microbiome associations in studied groups
  - Irritable_Bowel_Syndrome:pathophysiology#Gut-Brain Axis Dysfunction
  - Irritable_Bowel_Syndrome:pathophysiology#Immune Activation and Mast Cell Degranulation
  rationale: >-
    Functional gastrointestinal symptoms co-occur with ASD, and a shared
    glucocorticoid-responsive immune transcriptional signature in peripheral
    blood mononuclear cells has been proposed as a molecular link between ASD
    and IBS. The available evidence, however, is an integrative computational
    reanalysis of existing transcriptomes (ssGSEA, WGCNA, machine-learning
    feature selection, deconvolution, Connectivity Map inference). It identifies
    candidate regulators and a correlated signature but establishes neither
    causal ordering nor a mechanism coupling peripheral GRI dysregulation to
    the group-level immune and microbiome associations recorded in this entry.
    This gap is narrower than
    gap_asd_causal_status_of_immune_and_microbiome_associations, which asks
    whether those associations are causal at all: it asks specifically whether
    HPA/GRI signaling is the substrate of the ASD-IBS co-occurrence rather than
    a bystander stress response shared by both. It deliberately makes no claim
    about an enteric-nervous-system causal chain, which the 2026-08-05
    publication-readiness review removed from this entry as unsupported.
  proposed_experiments:
  - experiment_id: exp_asd_ibs_gri_stress_challenge_multiomics
    name: Stress-challenge PBMC GRI multi-omics cohort in ASD with and without IBS
    description: >-
      Enroll ASD participants stratified by presence or absence of IBS-type
      gastrointestinal symptoms plus matched non-autistic and IBS-only controls;
      apply a standardized HPA-axis challenge (for example dexamethasone
      suppression or an acute psychosocial stressor with serial cortisol); and
      measure, before and after challenge, single-cell PBMC transcriptomes
      (monocytes, NK cells, B cells) for the reported GRI core genes LRFN1,
      NUAK2, TMEM154, and GAPT, circulating
      cytokines, intestinal-permeability biomarkers, and stool microbiome
      composition, relating each to prespecified social-communication and
      gastrointestinal symptom measures.
    experiment_type:
      preferred_term: longitudinal stress-challenge multi-omics cohort
    model_systems:
    - name: Human ASD/IBS stress-challenge cohort
      description: >-
        Patient cohort designed to temporally order HPA activation, peripheral
        GRI gene dysregulation, systemic immune signaling, gut-barrier and
        microbiome change, and behavioral readouts across the ASD-IBS
        co-occurrence.
      experimental_model_type: OTHER
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    decision_criterion: >-
      HPA/GRI signaling is supported as an upstream driver of the ASD-IBS
      co-occurrence if post-challenge GRI dysregulation in monocytes, NK cells,
      and B cells precedes and quantitatively mediates gut-barrier, microbiome,
      and immune change and tracks with gastrointestinal symptom severity; a
      shared-bystander interpretation is favored if GRI changes neither precede
      nor mediate those organ-level readouts.
    would_support:
    - pathophysiology#Immune and neuroinflammatory associations in studied groups
    - pathophysiology#Gut microbiome associations in studied groups
  evidence:
  - reference: PMID:42424309
    reference_title: "Dysregulated glucocorticoid-responsive immune genes in peripheral blood mononuclear cells as a shared molecular signature of autism spectrum disorder and irritable bowel syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "While dysregulation of the hypothalamic-pituitary-adrenal (HPA) axis and impaired glucocorticoid-responsive immune (GRI) signaling are proposed links between these disorders, the precise molecular mechanisms remain poorly understood."
    explanation: >-
      The source study explicitly frames the HPA/GRI brain-gut link between ASD
      and IBS as proposed but mechanistically unresolved, defining the gap.
  - reference: PMID:42424309
    reference_title: "Dysregulated glucocorticoid-responsive immune genes in peripheral blood mononuclear cells as a shared molecular signature of autism spectrum disorder and irritable bowel syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "These findings define a shared GRI-associated molecular signature linking systemic stress adaptation to immune dysregulation along the brain-gut axis."
    explanation: >-
      A computational reanalysis of ASD and IBS PBMC transcriptomes reports a
      shared GRI signature along the brain-gut axis, motivating the causal
      question posed by this gap.
- discussion_id: gap_asd_heavy_metal_exposure_causal_status
  prompt: >-
    Are the reported associations between prenatal or early-childhood lead and
    mercury exposure and ASD causal, or do they reflect residual confounding,
    reverse causation, and heterogeneous exposure-assessment methods that also
    explain why arsenic and cadmium findings are inconsistent?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - environmental#Prenatal and early-childhood heavy metal exposure
  rationale: >-
    Existing studies differ in biomarker matrix (blood, hair, urine), exposure
    window, timing relative to diagnosis, ascertainment, and confounder
    adjustment, and most measure a single metal rather than the correlated
    mixtures children are actually exposed to. Lead and mercury show the most
    consistent signal and arsenic and cadmium the least, but the source review
    declines to conclude that heavy metals cause ASD and calls for large
    prospective cohorts. This item concerns whether the human association is
    real and causal at all; the separate question of whether animal-model
    mechanisms apply to human neurodevelopment is recorded in
    mismatch_asd_heavy_metal_model_mechanism.
  proposed_experiments:
  - experiment_id: exp_asd_prospective_metal_mixture_birth_cohort
    name: Prospective mother-child cohort with repeated metal biomarkers and mediation analysis
    description: >-
      Follow a large, diverse pregnancy cohort with repeated maternal and child
      metal biomarkers across defined prenatal and early postnatal windows,
      prespecified mixture models that separate correlated metals from each
      other and from co-exposures, blinded standardized ASD ascertainment, and
      genetic and socioeconomic confounder control. Sibling or
      negative-control-exposure comparisons and biomarker path analysis through
      oxidative-stress and inflammatory intermediates test whether any
      exposure-to-outcome association survives and is mediated.
    experiment_type:
      preferred_term: prospective pregnancy and birth cohort with mixture and mediation analysis
    model_systems:
    - name: Diverse prospective pregnancy and birth cohort
      description: >-
        Human mother-child cohort with repeated exposure biomarkers, blinded
        diagnostic ascertainment, and sibling comparisons for unmeasured
        familial confounding.
      experimental_model_type: OTHER
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    perturbations:
    - name: Measured prenatal and early-childhood metal exposure
      target: environmental#Prenatal and early-childhood heavy metal exposure
      exposure_term:
        preferred_term: exposure to heavy metal
        term:
          id: ECTO:9002163
          label: exposure to heavy metal
      effect: >-
        Observed rather than assigned exposure, measured repeatedly by window
        and modeled as a correlated mixture rather than one metal at a time.
    readouts:
    - name: Blinded ASD ascertainment and exposure-response gradient
      target: environmental#Prenatal and early-childhood heavy metal exposure
      interpretation: >-
        A window-specific exposure-response gradient that survives mixture,
        sibling, and negative-control analyses is the minimum needed to move
        this exposure beyond an observational association.
    decision_criterion: >-
      A causal contribution is supported if window-specific lead or mercury
      biomarkers predict ASD outcomes with exposure-response gradients that
      persist in mixture models, sibling comparisons, and negative-control
      analyses; a confounding interpretation is favored if associations
      attenuate to the null once familial and socioeconomic factors and
      correlated co-exposures are accounted for.
    would_support:
    - environmental#Prenatal and early-childhood heavy metal exposure
  evidence:
  - reference: PMID:42540380
    reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The findings are inconsistent across metals and studies, and should be interpreted with caution due to potential residual confounding and heterogeneity in exposure assessment methods. Large prospective cohort studies are needed to clarify causal relationships.
    explanation: >-
      The source review states the unresolved causal status and the study design
      needed to resolve it, defining this controversy.
- discussion_id: mismatch_asd_heavy_metal_model_mechanism
  prompt: >-
    Do the oxidative-stress, synaptic, and glial-activation mechanisms
    characterized for lead and mercury in rodent, zebrafish, and cell models
    operate at human-relevant developmental exposure levels, and do they mediate
    autistic traits in people, or are they model-system toxicology that does not
    transfer to human ASD?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - environmental#Prenatal and early-childhood heavy metal exposure
  - pathophysiology#Immune and neuroinflammatory associations in studied groups
  rationale: >-
    Metal neurotoxicity mechanisms are described in detail in experimental
    animals, including reactive oxygen species generation, impaired synaptic
    plasticity, microglial and astrocytic activation, and lipid and steroid
    metabolic disruption, and a zebrafish arm of one birth-cohort study
    nominates a PPAR-linked pathway. None of this has been demonstrated in human
    neurodevelopment, at the cord-blood concentrations measured in cohorts, or
    as a mediator of autistic traits, and reviews of developmental mercury
    toxicity state that no single process explains the observed effects. That is
    why this entry records the exposure as an environmental association and adds
    no heavy-metal pathophysiology node: promoting these model findings to a
    human ASD mechanism node would repeat the animal-only
    maternal-immune-activation claim that the 2026-08-05 publication-readiness
    review removed. The prior question of whether the human epidemiological
    association is causal at all is recorded in
    gap_asd_heavy_metal_exposure_causal_status.
  proposed_experiments:
  - experiment_id: exp_asd_human_cortical_organoid_metal_exposure
    name: Human cortical organoid and microglia-containing assembloid exposure at cohort-relevant metal concentrations
    description: >-
      Expose human iPSC-derived cortical organoids and microglia-containing
      assembloids, including lines carrying defined ASD-associated variants and
      isogenic controls, to lead and methylmercury across a dose range anchored
      to measured human cord-blood concentrations. Read out oxidative stress,
      microglial activation state, synaptic density and network activity, and
      transcriptomic and lipidomic changes including the PPAR pathway nominated
      by the zebrafish work, and test whether effects appear at human-relevant
      rather than only supraphysiological doses.
    experiment_type:
      preferred_term: dose-anchored human organoid exposure experiment
    model_systems:
    - name: Human iPSC-derived cortical organoid and microglia-containing assembloid panel
      description: >-
        Human cortical organoids with and without integrated microglia, spanning
        ASD-associated genotypes and isogenic controls, used to test whether
        animal-model metal neurotoxicity mechanisms are reproduced in human
        neural tissue at cohort-relevant exposure levels.
      experimental_model_type: ORGANOID
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens

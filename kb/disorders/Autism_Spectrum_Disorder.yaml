      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Autism spectrum disorder is a construct used to describe individuals with a specific combination of impairments in social communication and repetitive behaviours, highly restricted interests and/or sensory behaviours beginning early in life.
      explanation: >-
        The phenotype is definitional, but the proposed mediation by distributed
        circuit differences remains indirect.
  - target: Restricted and Repetitive Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Distributed developmental differences may contribute to repetitive and
      inflexible behavior, without implying one universal cognitive or circuit
      cause.
    evidence:
    - reference: PMID:31949163
      reference_title: Autism spectrum disorder.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Autism spectrum disorder is a construct used to describe individuals with a specific combination of impairments in social communication and repetitive behaviours, highly restricted interests and/or sensory behaviours beginning early in life.
      explanation: >-
        The source supports the outcome domain but not a single circuit-level

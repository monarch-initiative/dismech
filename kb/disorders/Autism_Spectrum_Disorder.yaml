environmental:
- name: Prenatal and perinatal epidemiologic associations
  description: >-
    Advanced parental age, maternal metabolic conditions, short interpregnancy
    interval, and some proxies of perinatal hypoxia have been associated with
    ASD in observational studies. Residual confounding, genetics, and correlated
    exposures limit causal inference; these are population risk associations,
    not explanations for an individual diagnosis. Vaccination is not associated
    with ASD.
  evidence:
  - reference: PMID:31949163
    reference_title: Autism spectrum disorder.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      considered causal, but could be reactive, independent or contributory
    explanation: >-
      The primer explicitly cautions against promoting observational risk
      associations to established causes.
  - reference: PMID:31949163
    reference_title: Autism spectrum disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      including clear evidence that ASD is not associated with vaccination
    explanation: Directly records the well-established negative association.
- name: Prenatal valproate exposure
  exposure_term:
    preferred_term: gestational maternal valproate exposure
    term:
      id: XCO:0001598
      label: gestational maternal exposure to valproate
  influences_mechanisms:
  - target: Heterogeneous neurodevelopmental molecular effects
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The best-evidenced environmental association in this entry: a population
      cohort reporting increased risk after adjustment for maternal epilepsy,
      which is the confounder that would otherwise explain it. Recorded as
      predisposing and never as triggering, because this entry is careful
      throughout that these are population-level risk associations and not
      explanations for an individual diagnosis, and because the exposure's own
      description warns against abrupt medication changes in pregnancy. No
      cited sentence follows valproate to any molecular step, so the
      intermediates are unknown despite the node being molecular.
    evidence:
    - reference: PMID:23613074
      reference_title: "Prenatal valproate exposure and risk of autism spectrum disorders and childhood autism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Maternal use of valproate during pregnancy was associated with a significantly increased risk of autism spectrum disorder and childhood autism in the offspring, even after adjusting for maternal epilepsy."
      explanation: >-
        Danish population cohort finding maternal valproate use in pregnancy
        associated with significantly increased offspring risk even after
        adjusting for maternal epilepsy. An adjusted population association.
  description: >-
    In a Danish population cohort, maternal valproate use during pregnancy was
    associated with increased offspring ASD risk after adjustment for maternal
    epilepsy. This is a population-level medication-exposure association, not a
    deterministic explanation for an individual diagnosis; pregnancy treatment
    decisions require individualized assessment of maternal seizure and fetal
    risks rather than abrupt medication changes.
  evidence:
  - reference: PMID:23613074
    reference_title: Prenatal valproate exposure and risk of autism spectrum disorders and childhood autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternal use of valproate during pregnancy was associated with a significantly increased risk of autism spectrum disorder and childhood autism in the offspring, even after adjusting for maternal epilepsy.
    explanation: >-
      The population cohort supports a specific adjusted association while the
      wording avoids treating exposure as sufficient or inevitable causation.
- name: Prenatal and early-childhood heavy metal exposure
  influences_mechanisms:
  - target: Heterogeneous neurodevelopmental molecular effects
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Graded below the valproate link and carrying its own contradiction on
      purpose. The same review that reports a comparatively consistent
      adjusted association for lead and mercury reports inconsistent
      associations for arsenic and cadmium, and bounds its own conclusion to
      certain populations and exposure conditions. All three sentences are
      carried here, so the reader of the pathograph meets the metal-by-metal
      disagreement rather than a uniform risk factor. The candidate mechanisms
      named in this exposure's notes are recorded there as candidates and are
      not asserted by any link.
    evidence:
    - reference: PMID:42540380
      reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "In contrast, elevated prenatal and early childhood Pb and Hg concentrations in blood and hair samples showed a significant consistent association with both increased ASD risk and symptom severity, even after adjustment for key demographic and environmental confounders."
      explanation: >-
        Reports a significant consistent adjusted association for lead and
        mercury with risk and symptom severity. A narrative synthesis rather
        than a pooled estimate.
    - reference: PMID:42540380
      reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "We revealed inconsistent associations between prenatal and childhood urinary, blood, and hair, As and Cd exposure, and ASD outcomes."
      explanation: >-
        The same review recording inconsistent associations for arsenic and
        cadmium. Carried so this exposure class is not read as uniform across
        metals.
    - reference: PMID:42540380
      reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Rather, lead and mercury may contribute to ASD risk in certain populations or under specific exposure conditions, but these findings require cautious interpretation due to methodological differences and potential biases."
      explanation: >-
        The authors' own bound: lead and mercury may contribute in certain
        populations or under specific exposure conditions, with cautious
        interpretation required.
  description: >-
    Prenatal and early-childhood exposure to lead, mercury, cadmium, and arsenic
    has been examined as a possible contributor to ASD risk. The reported
    associations are metal specific and inconsistent: reviews of human
    epidemiological studies report a more consistent association for lead and
    mercury than for arsenic and cadmium, while acknowledging residual
    confounding and heterogeneous exposure-assessment methods. This is a
    contested population-level exposure association, not an established cause of
    an individual diagnosis, and the reviewed evidence does not support a
    blanket claim that heavy metals cause ASD.
  notes: >-
    Candidate mechanisms, recorded as candidates only. Three routes are
    repeatedly proposed for lead and mercury developmental neurotoxicity:
    oxidative stress with mitochondrial dysfunction and lipid peroxidation;
    impaired synaptic plasticity, including altered NMDA receptor subunit
    composition and reduced synaptic protein expression; and microglial and
    astrocytic activation with neuroinflammatory signaling. A zebrafish arm of
    one birth-cohort study additionally nominates PPAR-linked lipid and steroid
    metabolic disruption. Every one of these is characterized in rodent,
    zebrafish, or cell models; none has been demonstrated in human
    neurodevelopment, at the cord-blood concentrations measured in human
    cohorts, or as a mediator of autistic traits. They are therefore documented
    here rather than curated as pathophysiology nodes, and the open
    translational question is tracked in the discussion
    mismatch_asd_heavy_metal_model_mechanism.
  chemicals:
  - lead
  - mercury
  - cadmium
  - arsenic
  exposure_term:
    preferred_term: exposure to heavy metal
    term:
      id: ECTO:9002163
      label: exposure to heavy metal
  evidence:
  - reference: PMID:42540380
    reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In contrast, elevated prenatal and early childhood Pb and Hg concentrations in blood and hair samples showed a significant consistent association with both increased ASD risk and symptom severity, even after adjustment for key demographic and environmental confounders.
    explanation: >-
      A critical review of 36 human epidemiological studies reports a
      comparatively consistent adjusted association for lead and mercury. It is
      a narrative synthesis rather than a pooled estimate, so it supports a
      population-level association only.
  - reference: PMID:42540380
    reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      We revealed inconsistent associations between prenatal and childhood urinary, blood, and hair, As and Cd exposure, and ASD outcomes.
    explanation: >-
      The same review records that arsenic and cadmium associations are
      inconsistent, so this exposure class must not be curated as a uniform risk
      factor across metals.
  - reference: PMID:42540380
    reference_title: "Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies, Research Gaps, and Future Priorities of Human Epidemiological Studies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Rather, lead and mercury may contribute to ASD risk in certain populations or under specific exposure conditions, but these findings require cautious interpretation due to methodological differences and potential biases.
    explanation: >-
      The authors' own summary bounds the claim to specific populations and
      exposure conditions and requires cautious interpretation.
  - reference: PMID:41110787
    reference_title: "Prenatal exposure to environmental metal mixtures and social development in early childhood: Evidence from a birth cohort and mechanistic study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal exposure to the mixture significantly impaired motor and social functions, with Pb contributing most to motor deficits and Cd to social dysfunction.
    explanation: >-
      A prospective birth cohort with cord-blood metal measurement reports a
      mixture association with early social and motor development. The outcome
      is a developmental measure rather than an ASD diagnosis, so it supports
      the exposure association and not an ASD-specific causal pathway.
  - reference: PMID:42541535
    reference_title: "Molecular and cellular mechanisms of lead-induced neurotoxicity: comparative insights from rodent and zebrafish models."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Once in the brain, lead induces oxidative stress through excessive reactive oxygen species generation, mitochondrial dysfunction, lipid peroxidation, DNA damage, and depletion of antioxidant defenses.
    explanation: >-
      Documents the oxidative-stress candidate mechanism. The finding is from
      rodent and zebrafish models and is recorded as a candidate route, not as a
      demonstrated human ASD mechanism.
  - reference: PMID:42541535
    reference_title: "Molecular and cellular mechanisms of lead-induced neurotoxicity: comparative insights from rodent and zebrafish models."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lead also impairs synaptic plasticity by altering NMDA receptor subunit composition, reducing synaptic protein expression, and dysregulating genes involved in neurodevelopment.
    explanation: >-
      Documents the synaptic candidate mechanism, again in animal models. It is
      deliberately not linked to this entry's excitation-inhibition node, which
      is curated from genotype-defined human subgroup work.
  - reference: PMID:42541535
    reference_title: "Molecular and cellular mechanisms of lead-induced neurotoxicity: comparative insights from rodent and zebrafish models."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In parallel, it activates both intrinsic and extrinsic apoptotic pathways and enhances neuroinflammatory signaling through microglial and astrocytic activation, further contributing to neuronal injury.
    explanation: >-
      Documents the glial-activation candidate mechanism. Demonstrating this in
      human tissue at cohort-relevant exposure levels is the condition for
      curating any heavy-metal neuroinflammation mechanism node.

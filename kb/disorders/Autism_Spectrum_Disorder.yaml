        term:
          id: ECTO:9000945
          label: exposure to lead
      effect: >-
        Applies lead across a dose range spanning measured human cord-blood
        concentrations, testing human-relevant rather than only high-dose effects.
    - name: Cohort-anchored mercury exposure
      target: environmental#Prenatal and early-childhood heavy metal exposure
      exposure_term:
        preferred_term: exposure to mercury
        term:
          id: ECTO:0001571
          label: exposure to mercury
      effect: >-
        Applies methylmercury across a comparably anchored dose range.
    readouts:
    - name: Oxidative stress and glial activation
      target: pathophysiology#Immune and neuroinflammatory associations in studied groups
      biological_processes:
      - preferred_term: response to oxidative stress
        term:
          id: GO:0006979
          label: response to oxidative stress
      - preferred_term: microglial cell activation
        term:
          id: GO:0001774
          label: microglial cell activation
      interpretation: >-
        Detects whether the oxidative and glial responses reported in animal
        models occur in human neural tissue at cohort-relevant doses.
    - name: Synaptic and network development
      target: pathophysiology#Excitation-inhibition and synaptic-signaling differences in studied subgroups
      biological_processes:
      - preferred_term: regulation of synaptic plasticity
        term:
          id: GO:0048167
          label: regulation of synaptic plasticity
      interpretation: >-
        Tests whether metal exposure reproduces the synaptic and network
        measures already curated for genotype-defined subgroups.
    decision_criterion: >-
      Translational relevance is supported if oxidative, glial, and synaptic
      effects appear at concentrations within the measured human cord-blood
      range and scale with dose; the model-system interpretation stands if
      effects require concentrations well above human exposure or fail to
      reproduce in human neural tissue.
    would_support:
    - pathophysiology#Immune and neuroinflammatory associations in studied groups
  evidence:
  - reference: PMID:42541535
    reference_title: "Molecular and cellular mechanisms of lead-induced neurotoxicity: comparative insights from rodent and zebrafish models."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Once in the brain, lead induces oxidative stress through excessive reactive oxygen species generation, mitochondrial dysfunction, lipid peroxidation, DNA damage, and depletion of antioxidant defenses.
    explanation: >-
      Establishes that a detailed mechanism exists in animal models, which is
      the model side of the mismatch. The review covers rodent and zebrafish
      data and makes no human ASD claim.
  - reference: PMID:42541535
    reference_title: "Molecular and cellular mechanisms of lead-induced neurotoxicity: comparative insights from rodent and zebrafish models."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In parallel, it activates both intrinsic and extrinsic apoptotic pathways and enhances neuroinflammatory signaling through microglial and astrocytic activation, further contributing to neuronal injury.
    explanation: >-
      Names the glial-activation route that would have to be demonstrated in
      human tissue before a heavy-metal neuroinflammation node could be curated.
  - reference: PMID:41110787
    reference_title: "Prenatal exposure to environmental metal mixtures and social development in early childhood: Evidence from a birth cohort and mechanistic study."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Integrated omics analyses identified substantial disruption of lipid and steroid metabolic pathways, particularly involving the peroxisome proliferator-activated receptor (PPAR) signaling cascade.
    explanation: >-
      The candidate PPAR mechanism comes from the zebrafish arm of the study,
      not from the human cohort arm, so it is a nominated hypothesis awaiting
      human confirmation.
  - reference: PMID:26987277
    reference_title: "Methylmercury and brain development: A review of recent literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism of toxicity, however, is not fully understood. No single process can explain the multitude of effects observed in MeHg-induced neurotoxicity.
    explanation: >-
      States directly that developmental methylmercury neurotoxicity has no
      single settled mechanism, so no specific mechanism can be curated as the
      route from exposure to ASD.
review_notes: |-
  Publication-readiness review (2026-08-05): the OpenScientist deep-research
  report and every publication cache cited by the prior entry were checked
  against the source text. The report is keyed to MONDO:0005260 rather than this
  entry's MONDO:0005258 and was used only as a lead list. Genetic pathway
  convergence and genotype-defined cellular findings were retained with scope
  limits. E/I, immune, blood-brain-barrier, and microbiome claims were downgraded
  to provisional or hypothetical subgroup findings. The asserted ENS causal
  chain, animal-only maternal-immune-activation environmental risk claim,
  Female Protective Effect pseudo-gene, unsupported universal phenotype
  frequencies, and preclinical CRISPRa "treatment" were removed.

  D2P audit dispositions (all 22 recommendations from the pre-edit audit):
  1. HP:0011024 gastrointestinal abnormality — REPLACE the overly broad source
     suggestion with HP:0012719 functional gastrointestinal abnormality, backed
     by a 2023 symptom meta-analysis (33%, 95% CI 13%-57%); intentionally leave
     unlinked because association does not prove a gut-to-core-ASD causal path.
  2. HP:0007018 ADHD — ADD with systematic-review evidence; intentionally leave
     unlinked as a separate co-occurring diagnosis.
  3. HP:0000733 motor stereotypy — RETAIN/ADD exact evidence as a variable
     restricted/repetitive manifestation; do not duplicate the parent-domain
     pathograph edge.
  4. HP:0001250 seizure — ADD with meta-analysis evidence and OCCASIONAL overall
     frequency (~1/10); do not adopt the OMIM "frequent" label across broad ASD
     and do not invent a universal ASD-to-epilepsy mechanism.
  5. HP:5200046 sensory behavioral abnormality — RETAIN with exact definitional
     evidence and remove the unsupported 70%-95% figure; leave unlinked because
     no general causal route is established.
  6. HP:0000758 abnormal nonverbal communicative behavior — ADD as a core
     diagnostic phenotype and link from the explicitly provisional distributed-
     circuit node with PARTIAL evidence.
  7. HP:0000717 Autism — DO NOT ADD; it restates the disease as its own
     phenotype and adds no atomic manifestation.
  8. HP:0000750 delayed speech/language — ADD as a variable associated feature,
     explicitly not required for diagnosis; leave unlinked rather than assert a
     universal language mechanism.
  9. HP:0002353 EEG abnormality — DO NOT ADD as a top-level ASD phenotype; EEG
     findings are heterogeneous group readouts or epilepsy-context findings,
     not a defining or universal manifestation.
  10. HP:0003144 increased serum serotonin — DO NOT ADD; hyperserotonemia is a
      nonspecific group association without validated individual diagnostic or
      mechanistic status.
  11. HP:0000732 inflexible adherence to routines — ADD with exact parent-domain
      evidence; do not duplicate the linked restricted/repetitive parent node.
  12. HP:0001249 intellectual disability — ADD as a co-occurring feature with a
      39.6% ADDM estimate among children with cognitive data; leave unlinked
      because it is neither required nor explained by one broad-ASD mechanism.
  13. HP:0000721 lack of spontaneous play — DO NOT ADD; this narrow historical
      presentation is not required and is not supported as a general phenotype
      by the reviewed contemporary sources.
  14. HP:0000723 restrictive behavior — ADD as the core restricted/repetitive
      domain and link from the provisional distributed-circuit node.
  15. HP:0011024 local-unlinked recommendation — REVIEWED; replace with the
      narrower HP:0012719 and retain unlinked for the causal reason in
      disposition 1.
  16. HP:0007018 local-unlinked recommendation — REVIEWED; retain unlinked for
      the co-occurring-diagnosis reason in disposition 2.
  17. HP:0000733 local-unlinked recommendation — REVIEWED; retain unlinked as a
      narrow child of the already linked restricted/repetitive domain.
  18. HP:0012760 reduced social responsiveness — REPLACE the overly broad local
      term with HP:0000758 plus source-exact HP:0000728, preserving atomic
      social-communication and relationship manifestations.
  19. HP:0001250 local-unlinked recommendation — REVIEWED; retain unlinked for
      the subgroup and causal-heterogeneity reason in disposition 4.
  20. HP:5200046 local-unlinked recommendation — REVIEWED; retain unlinked for
      the causal-evidence reason in disposition 5.
  21. HP:0002360 sleep disturbance — RETAIN with systematic-review evidence but

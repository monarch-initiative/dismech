- name: Gut microbiome associations in studied groups
  description: >-
    Microbiome composition and metabolite differences have been reported in
    some ASD cohorts, especially those selected for gastrointestinal symptoms.
    Diet, medication, geography, age, constipation, sequencing methods, and
    reverse causation are major confounders. A causal microbiome-to-core-autism
    pathway and a generalizable microbial biomarker remain unproven.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:39733842
    reference_title: "IUPHAR review: Targeted therapies of signaling pathways based on the gut microbiome in autism spectrum disorders: Mechanistic and therapeutic applications."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Gut microbiota significantly influences behavior and neurodevelopment by regulating the gut-brain axis.
    explanation: >-
      This narrative review supports biological plausibility, not an ASD-specific
      causal pathway or a finding present in every autistic person.
  downstream:
  - target: Immune and neuroinflammatory associations in studied groups
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - immune_microbiome_modifier_model
    description: >-
      Within the emerging modifier hypothesis, dysbiosis may affect immune and

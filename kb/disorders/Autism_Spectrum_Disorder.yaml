    evidence:
    - reference: PMID:41947852
      reference_title: The relationship between functional brain connectivity and neuroinflammatory processes-new insights into the pathomechanisms of ASD.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        These immune and metabolic alterations are associated with changes in synaptic plasticity, neurotransmission, and large-scale neuronal network organization, including altered functional connectivity within the default mode, salience, and executive control networks.
      explanation: >-

name: Autism Spectrum Disorder
creation_date: "2026-04-10T00:00:00Z"
description: >-
  Autism spectrum disorder (ASD) is a heterogeneous neurodevelopmental
  condition defined clinically by persistent differences or impairments in
  social communication and interaction together with restricted or repetitive
  behavior, interests, or activities, including sensory features, beginning in
  the early developmental period. Language, intellectual ability, adaptive
  function, support needs, co-occurring conditions, and developmental course
  vary substantially. Population liability includes many common variants of
  small effect and a minority of rare coding or copy-number variants of larger
  effect. No single molecular, cellular, imaging, electrophysiological, immune,
  or microbiome mechanism is present in or diagnostic of all autistic people.
category: Complex
disease_term:
  preferred_term: autism spectrum disorder
  term:
    id: MONDO:0005258
    label: autism spectrum disorder
parents:

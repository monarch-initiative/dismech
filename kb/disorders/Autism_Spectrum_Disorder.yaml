- name: Convergent transcriptional effects in human stem-cell models
  description: >-
    In iPSC-derived neural progenitor and cortical organoid models carrying
    selected ASD-associated mutations, mutation-specific early changes partly
    converge later on shared transcriptional networks. The result is a model
    system observation across selected genotypes, not proof of a universal
    cortical program in autistic brains.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neural progenitor cell
    term:

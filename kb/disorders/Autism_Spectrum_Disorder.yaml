definitions:
- name: Contemporary clinical ASD case definition
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    A clinical diagnosis requires persistent social-communication and
    social-interaction differences or impairments plus restricted or repetitive
    behavior, interests, or activities. Features begin in the early
    developmental period, may become fully apparent only when demands exceed
    capacities, cause clinically meaningful functional impact, and are not
    better explained by intellectual disability or global developmental delay
    alone. Sensory hyperreactivity, hyporeactivity, or unusual sensory interests
    are included within the restricted/repetitive domain. Support needs and
    language and intellectual-function specifiers do not define etiologic
    subtypes.
  evidence:
  - reference: PMID:31949163
    reference_title: Autism spectrum disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autism spectrum disorder is a construct used to describe individuals with a specific combination of impairments in social communication and repetitive behaviours, highly restricted interests and/or sensory behaviours beginning early in life.
    explanation: >-
      The primer states the defining domains and early developmental onset.
  - reference: PMID:31843864
    reference_title: Identification, Evaluation, and Management of Children With Autism Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Core deficits are identified in 2 domains: social communication/interaction and restrictive, repetitive patterns of behavior.
    explanation: The AAP clinical report independently confirms the two-domain definition.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 800.0
  notes: >-
    The 2026 frequentist pooled estimate was 0.8%, but between-study
    heterogeneity was extreme and the prediction interval was very wide.
    Diagnostic framework, setting, region, ascertainment, and access to
    evaluation materially affect estimates, so this is not a universal fixed
    rate.
  evidence:
  - reference: PMID:42078229
    reference_title: "Global Autism Spectrum Disorder Prevalence Estimates and Associated Covariates: A Systematic Review and Meta-Regression Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequentist pooled prevalence of ASD was 0.8% (95% CI: 0.4%-1.7%), with substantial heterogeneity (I² ≈ 100%) and a wide prediction interval (0.03%-17.3%).
    explanation: >-
      This supplies the normalized global estimate and, critically, its large
      uncertainty and heterogeneity.
- population: United States, children aged 8 years, 16 ADDM sites, 2022
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3220.0
  notes: >-
    Active surveillance estimate across 16 sites; it is not a nationally
    representative prevalence survey. Site rates ranged from 9.7 to 53.1 per
    1,000. Recorded prevalence was 3.4 times as high among boys as girls, which
    can reflect both liability and ascertainment.
  evidence:
  - reference: PMID:40232988
    reference_title: Prevalence and Early Identification of Autism Spectrum Disorder Among Children Aged 4 and 8 Years - Autism and Developmental Disabilities Monitoring Network, 16 Sites, United States, 2022.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among children aged 8 years in 2022, ASD prevalence was 32.2 per 1,000 children (one in 31) across the 16 sites, ranging from 9.7 in Texas (Laredo) to 53.1 in California.
    explanation: Current ADDM surveillance supplies the site-based 2022 estimate.
- population: Children in mainland China, studies published since 2017
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 700.0
  notes: >-
    Meta-analysis estimate; boys and girls had different recorded rates, and
    ascertainment and diagnostic access should be considered when interpreting
    the sex difference.
  evidence:
  - reference: PMID:38811881
    reference_title: "Prevalence of autism spectrum disorder in mainland china over the past 6 years: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ASD prevalence among children in mainland China has been 0.7% (95% confidence interval(CI): 0.006-0.008) since 2017.
    explanation: The meta-analysis directly supports the normalized estimate.
progression:
- phase: Early developmental emergence
  age_range: Infancy through early childhood
  notes: >-
    Features begin in early development, commonly become apparent during the
    second or third year, and may accumulate gradually. Some children show
    frank loss of previously acquired skills, whereas others plateau or show
    gradually widening social-communication and language differences. Neither
    a neonatal movement pattern nor an imaging, gaze, EEG, molecular, or blood
    measure is a validated presymptomatic diagnostic biomarker.
  evidence:
  - reference: PMID:31949163
    reference_title: Autism spectrum disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autism spectrum disorder is a construct used to describe individuals with a specific combination of impairments in social communication and repetitive behaviours, highly restricted interests and/or sensory behaviours beginning early in life.
    explanation: Supports early developmental onset without fixing one trajectory.
- phase: Childhood and adolescence
  age_range: Childhood through adolescence
  notes: >-
    Preschool diagnoses are often stable, but symptom severity, adaptive
    function, language, learning, and co-occurring sleep, attention, anxiety,
    gastrointestinal, or seizure problems can change. Diagnosis may occur only
    in later childhood or adolescence when social demands exceed capacity;
    late recognition does not imply late biological onset.
  evidence:
  - reference: PMID:31843864
    reference_title: Identification, Evaluation, and Management of Children With Autism Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary care providers should be familiar with the diagnostic criteria for ASD, appropriate etiologic evaluation, and co-occurring medical and behavioral conditions (such as disorders of sleep and feeding, gastrointestinal tract symptoms, obesity, seizures, attention-deficit/hyperactivity disorder, anxiety, and wandering) that affect the child's function and quality of life.
    explanation: >-
      The clinical report supports age-relevant monitoring of changing
      co-occurring conditions and functional impact.
- phase: Adulthood and later life
  age_range: Adulthood
  notes: >-
    Autism is generally lifelong, but adult independence, health, employment,
    relationships, and quality of life are highly heterogeneous and depend on
    communication, intellectual and adaptive function, co-occurring conditions,
    opportunity, accommodations, and support. Adult intervention evidence is
    much thinner than pediatric evidence. Population studies show excess
    mortality, but risks are not uniform and should not be interpreted as an
    individual prognosis.
  evidence:
  - reference: PMID:41926193
    reference_title: "Interventions for autistic adults: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analyses of behavioral, cognitive, adaptive, and employment outcomes were nonsignificant.
    explanation: >-
      The current adult meta-analysis documents important areas without
      demonstrated pooled benefit and prevents extrapolation from child studies.
  - reference: PMID:37042154
    reference_title: "Early death and causes of death of patients with autism spectrum disorders: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results showed that all-cause mortality was higher for the autistic patients (RR=2.32, 95%CI: 1.98-2.72, I2=87.1%, P < 0.001).
    explanation: >-
      The systematic review supports excess group-level mortality while its
      high heterogeneity argues against an individual deterministic prognosis.
pathophysiology:
- name: Polygenic neurodevelopmental liability
  description: >-
    Common inherited variants of individually small effect contribute
    substantially to ASD susceptibility. Their aggregate influence is
    heterogeneous across people and clinical presentations and is neither
    necessary nor sufficient for an individual diagnosis.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:30804558
    reference_title: Identification of common genetic risk variants for autism spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common genetic variants contribute substantially to ASD susceptibility, but to date no individual variants have been robustly associated with ASD.
    explanation: >-
      The GWAS establishes distributed common-variant susceptibility and argues
      against deterministic interpretation of any single common variant.
  - reference: PMID:26709141
    reference_title: "Heritability of autism spectrum disorders: a meta-analysis of twin studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The meta-analytic heritability estimates were substantial: 64-91%.
    explanation: >-
      Twin-study meta-analysis quantifies the strong genetic contribution while
      its range prevents presentation as one fixed population parameter.
  downstream:
  - target: Heterogeneous neurodevelopmental molecular effects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Polygenic liability influences neurodevelopment through many unresolved
      regulatory and cellular routes rather than one canonical cascade.
    evidence:
    - reference: PMID:30804558
      reference_title: Identification of common genetic risk variants for autism spectrum disorder.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dissecting the polygenic architecture, we found both quantitative and qualitative polygenic heterogeneity across ASD subtypes.
      explanation: >-
        The study supports heterogeneous polygenic architecture but does not
        identify one intervening molecular chain.
- name: Rare coding and copy-number variant liability
  description: >-
    A minority of autistic people carry rare protein-truncating, damaging
    missense, or copy-number variants with larger effects. These variants are
    enriched in clinically ascertained ASD but show variable penetrance and
    pleiotropy with developmental delay and other neurodevelopmental outcomes;
    they do not make ASD a collection of simple Mendelian subtypes.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:35982160
    reference_title: Rare coding variation provides insight into the genetic architecture and phenotypic context of autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some individuals with autism spectrum disorder (ASD) carry functional mutations rarely observed in the general population.
    explanation: The large sequencing study supports a rare-variant subgroup.
  - reference: PMID:35982160
    reference_title: Rare coding variation provides insight into the genetic architecture and phenotypic context of autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discovered 72 genes associated with ASD at false discovery rate (FDR) ≤ 0.001 (185 at FDR ≤ 0.05).
    explanation: >-
      Quantifies association while avoiding a claim that every listed gene is
      sufficient to cause the broad ASD phenotype.
  downstream:
  - target: Heterogeneous neurodevelopmental molecular effects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Different rare variants perturb distinct developmental pathways that may
      partly converge, but pleiotropy and mutation-specific effects remain.
    evidence:
    - reference: PMID:35982160
      reference_title: Rare coding variation provides insight into the genetic architecture and phenotypic context of autism.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Meta-analysis with cohorts ascertained for developmental delay (DD) (n = 91,605) yielded 373 genes associated with ASD/DD at FDR ≤ 0.001 (664 at FDR ≤ 0.05), some of which differed in relative frequency of mutation between ASD and DD cohorts.
      explanation: >-
        Shared and differing associations support convergence plus pleiotropy,
        not an ASD-specific linear pathway.
  - target: Convergent transcriptional effects in human stem-cell models
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Selected rare ASD-associated mutations produce mutation-specific and
      partly convergent transcriptional effects in human stem-cell-derived
      neural models; this is a model-system route, not a universal human-brain
      mechanism.
    evidence:
    - reference: PMID:41611887
      reference_title: Developmental convergence and divergence in human stem cell models of autism.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        These data illustrate how risk associated with genetically defined forms of ASD can propagate by means of transcriptional regulation to affect convergently dysregulated pathways, providing new insight into the convergent impact of ASD genetic risk on human neurodevelopment.
      explanation: >-
        The experiment directly links selected genetically defined ASD forms to
        convergent model-system transcriptional effects; PARTIAL preserves the
        limit to eight mutations and in-vitro development.
- name: Heterogeneous neurodevelopmental molecular effects
  description: >-
    Human genetic studies recurrently implicate synaptic formation,
    transcriptional regulation, chromatin remodeling, neuronal maturation, and
    corticogenesis. These are pathway-level convergences across subsets, not a
    molecular lesion demonstrated in every autistic person.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: synapse organization
    term:
      id: GO:0050808
      label: synapse organization
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:25363760
    reference_title: Synaptic, transcriptional and chromatin genes disrupted in autism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many of the genes implicated encode proteins for synaptic formation, transcriptional regulation and chromatin-remodelling pathways.
    explanation: >-
      Large-scale exome analysis supports pathway convergence but not universal
      disruption of each pathway in every individual.
  downstream:
  - target: Distributed developmental circuit differences
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Molecular perturbations can alter neuronal development and circuit
      function through mutation-, cell-type-, and developmental-stage-specific
      routes.
    evidence:
    - reference: PMID:31949163
      reference_title: Autism spectrum disorder.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        subtle anatomical and functional differences have been observed in post-mortem, neuroimaging and electrophysiological studies.
      explanation: >-
        The primer supports group-level neural differences but does not prove
        that the molecular pathways mediate them in all ASD.
  - target: Excitation-inhibition and synaptic-signaling differences in studied subgroups
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - subgroup_ei_synaptic_model
    description: >-
      Within the subgroup-specific E/I hypothesis, synaptic and transcriptional
      perturbations may alter excitation or inhibition through genotype-,
      region-, cell-type-, and developmental-stage-specific routes.
    evidence:
    - reference: PMID:41653294
      reference_title: "Unraveling mGluR5 dysfunction in autism spectrum disorder: a multi-level analysis of genetic, molecular, and neurobiological mechanisms."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Alterations in synaptic scaffolding complexes (SHANK3-Homer-mGluR5 interactions), receptor trafficking, and activity-dependent protein synthesis may contribute to excitatory/inhibitory imbalance and circuit dysfunction.
      explanation: >-
        The review supports a conditional route in biologically defined
        pathways; the hypothesis tag prevents universalization.
- name: Distributed developmental circuit differences
  description: >-
    Post-mortem, imaging, and electrophysiological studies identify subtle,
    distributed group-level differences rather than a characteristic gross
    lesion. Direction and location vary by cohort, age, task, method, and
    subgroup. These observations are not individual diagnostic biomarkers.
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:31949163
    reference_title: Autism spectrum disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although gross brain pathology is not characteristic of autism, subtle anatomical and functional differences have been observed in post-mortem, neuroimaging and electrophysiological studies.
    explanation: >-
      This directly supports a cautious distributed, group-level circuit node
      and rejects a characteristic structural lesion.
  downstream:
  - target: Abnormal Nonverbal Communicative Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Developmental circuit differences may contribute to social-communication

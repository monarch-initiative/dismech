datasets:
- accession: geo:GSE107878
  title: Disruption of Autism Spectrum Disorder-Susceptibility Genes Predominantly Reduces Functional Connectivity of Isogenic Human Neurons
  description: Autism Spectrum Disorder (ASD) is phenotypically and genetically heterogeneous, but genomic analyses have identified candidate susceptibility genes. We present a CRISPR gene editing strategy to insert a protein tag and premature termination sites creating an induced pluripotent stem cell (iPSC) knockout resource for functional studies of 10 ASD-relevant genes (AFF2/FMR2, ANOS1, ASTN2, ATRX, CACNA1C, CHD8, DLGAP2, KCNQ2, SCN2A, TENM1). Neurogenin 2 (NEUROG2)-directed differentiation of iPSCs allowed production of cortical excitatory neurons, and mutant proteins were not detectable.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 86
  publication: PMID:30392976
  notes: Identified by GEO DataSets index search for Autism Spectrum Disorder (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE328363
  title: Developmental dynamics of the cortical cellular and molecular landscapes in autism spectrum disorder models
  description: Recent research has identified over 100 causal genes in autism spectrum disorder (ASD), raising the question of how mutations in genes with diverse functions result in similar clinical presentations. Here, we profiled 251 samples from eleven monogenic ASD mouse models using single-nucleus multi-omic sequencing across three developmental stages, both sexes, and two brain regions. We discovered that, despite wide genetic heterogeneity, ASD-linked mutations converged on perturbations of the radial glial cell lineage. This converging alteration primarily reflects a transient developmental delay rather than a lasting lineage misspecification and resolves by postnatal stages.

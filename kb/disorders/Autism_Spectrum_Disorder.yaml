- name: Excitation-inhibition and synaptic-signaling differences in studied subgroups
  description: >-
    E/I imbalance is a useful research framework supported by particular
    genetic syndromes, cellular models, and group-level studies, but direction,
    cell type, region, and developmental timing differ. mGluR5, GABAergic, and
    glutamatergic findings must not be generalized from biologically defined
    subsets to all ASD.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: ABNORMAL
  evidence:
  - reference: PMID:41653294
    reference_title: "Unraveling mGluR5 dysfunction in autism spectrum disorder: a multi-level analysis of genetic, molecular, and neurobiological mechanisms."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Alterations in synaptic scaffolding complexes (SHANK3-Homer-mGluR5 interactions), receptor trafficking, and activity-dependent protein synthesis may contribute to excitatory/inhibitory imbalance and circuit dysfunction.
    explanation: >-
      The review uses conditional language and concerns biologically defined
      pathways, so it supports only a provisional subgroup mechanism.
  - reference: PMID:33076974
    reference_title: Pharmacological intervention to restore connectivity deficits of neuronal networks derived from ASD patient iPSC with a TSC2 mutation.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We find that ASD patient-derived neurons with a functional loss of TSC2, in addition to possessing neuronal hyperactivity, develop a dysfunctional neuronal network with reduced synchronisation of neuronal bursting and lower spatial connectivity.
    explanation: >-
      The finding is limited to patient-derived neurons with TSC2 loss and is
      not evidence of universal neuronal hyperactivity in ASD.
- name: Immune and neuroinflammatory associations in studied groups
  description: >-
    Studies report group-level cytokine, oxidative-stress, glial, and
    connectivity associations. Sampling, medication, co-occurring illness,
    tissue, age, and subgroup differences complicate interpretation. These
    associations do not establish that neuroinflammation causes core autism in
    all people, and blood-brain-barrier findings are subtle or context dependent.
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
  evidence:
  - reference: PMID:41947852
    reference_title: The relationship between functional brain connectivity and neuroinflammatory processes-new insights into the pathomechanisms of ASD.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      individuals with ASD show consistent evidence of microglial and astroglial activation, altered cytokine profiles (including IL-1β, IL-6, and TNF-α), and markers of oxidative stress such as glutathione imbalance and lipid peroxidation.
    explanation: >-
      This is review-level group evidence and does not establish individual
      universality, directionality, or mediation of diagnostic traits.
  - reference: PMID:41550027
    reference_title: "The gatekeepers breached: claudin dysregulation in psychiatric disorders."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      In autism and ADHD, altered tight junction protein profiles imply more subtle or context-dependent barrier dysfunction.
    explanation: >-
      The review explicitly requires a subtle, context-dependent interpretation.

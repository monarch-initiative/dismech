- reference: PMID:40274203
  title: "Autism diagnosis in children and adolescents: A systematic review and meta-analysis of test accuracy."
notes: >-
  Scope is the broad clinical spectrum MONDO:0005258, not the older/broader
  MONDO:0005260 concept used by the OpenScientist deep-research artifact and
  not any single gene-defined syndrome. DSM-5/ICD-11 support-level and
  language/intellectual-function specifiers describe current clinical needs;
  they are not assumed to be stable biological subtypes. Historical Asperger
  disorder and pervasive-developmental-disorder categories were subsumed into
  the unitary ASD diagnosis because their boundaries were not reliably applied.
  Identity-first and person-first language preferences vary; this entry uses
  both respectfully and does not frame autistic traits themselves as treatment
  targets independent of the person's goals, function, safety, or quality of
  life. The bounded top-level genetic list is illustrative rather than
  exhaustive: it records four directly evidenced pleiotropic risk loci as risk
  factors, never as sufficient Mendelian causes of broad ASD. Common and rare
  risk architecture and pathway convergence are curated as mechanism nodes;
  individual gene-defined syndromes belong in their own disease entries.

  action_category: THERAPEUTIC
  description: >-
    Goal-directed developmental and behavioral programs can improve selected
    communication, adaptive, cognitive, play, or social-engagement outcomes in
    some young children. Program model, intensity, acceptability, access,
    outcomes, and response vary. Evidence does not support a promise of
    normalization or one mandatory program for every child; goals should be
    selected collaboratively and monitored for benefit and burden.

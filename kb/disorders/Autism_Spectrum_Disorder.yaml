experimental_models:
- name: Genotype-defined patient iPSC-derived neuronal networks
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Patient-derived induced pluripotent stem cells
  description: >-
    Neuronal networks derived from autistic participants with defined variants
    can test cellular excitability, synchrony, connectivity, and rescue. They
    retain donor/genotype relevance but lack whole-brain development, behavior,
    immune and environmental context, and population representativeness. The
    TSC2 result is a genotype-specific mechanistic model, not a model of all ASD.
  evidence:
  - reference: PMID:33076974
    reference_title: Pharmacological intervention to restore connectivity deficits of neuronal networks derived from ASD patient iPSC with a TSC2 mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that ASD patient-derived neurons with a functional loss of TSC2, in addition to possessing neuronal hyperactivity, develop a dysfunctional neuronal network with reduced synchronisation of neuronal bursting and lower spatial connectivity.
    explanation: Defines the model finding and its genotype-limited scope.
- name: Multi-genotype human cortical organoid and neural-progenitor panel
  experimental_model_type: ORGANOID
  cell_source: Induced pluripotent stem cell-derived, including isogenic perturbations
  description: >-
    A panel spanning selected ASD-associated mutations and idiopathic donor
    lines can compare mutation-specific and convergent transcriptional effects
    across neural progenitors and cortical organoids. Immaturity, variable cell
    composition, absent long-range inputs and vasculature, and selected genotypes
    limit inference to the human brain or the entire spectrum.
  evidence:
  - reference: PMID:41611887
    reference_title: Developmental convergence and divergence in human stem cell models of autism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Early time points harboured the largest mutation-specific changes, but different mutations converged on shared transcriptional changes as development progressed.
    explanation: Supports the panel's central mutation-specific and convergent readout.

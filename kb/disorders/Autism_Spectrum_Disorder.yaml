  title: Autism spectrum disorder associated chromatin modifiers converge on transcription with sex-specific regulatory signatures
  description: We sought to understand the transcriptional disruptions and functional impacts of the loss of 9 autism spectrum disorder (ASD) risk genes that encode transcriptional regulators in neurons. In addition to understanding how these signature converge or diverge, we aimed to study how sex could modulate these consequences.

  downstream:
  - target: Impaired Rod Light Responses
    description: Loss of normal outer-segment channel abundance compromises rod phototransduction.
    causal_link_type: DIRECT
- name: Impaired Rod Light Responses
  description: Rod CNG-channel deficiency markedly reduces light responses before extensive cell loss in knockout mice and affected dogs. Residual isolated-rod responses occur, and human ERG responses range from attenuated to undetectable. Severe functional impairment is therefore distinct from physical disappearance of rods.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the vast majority of isolated rod photoreceptors in mice lacking CNGB1 (CNGB1-/-) failed to respond to light. In electroretinograms (ERGs), CNGB1-/- mice showed no rod-mediated responses.
    explanation: Most isolated knockout rods were unresponsive; the population ERG lacked rod-mediated responses. Neither observation proves that every rod is silent.
  - reference: PMID:33465333
    reference_title: Variable expressivity in patients with autosomal recessive retinitis pigmentosa associated with the gene CNGB1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Electrophysiological testing in five patients showed an absence of the rod response. Cone responses ranged from normal to severely reduced.
    explanation: Human ERGs establish rod-system impairment without directly measuring channel current.
  cell_types:
  - preferred_term: retinal rod cell
    term:

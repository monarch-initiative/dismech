    evidence:
    - reference: PMID:22802073
      reference_title: Gene therapy restores vision and delays degeneration in the CNGB1(-/-) mouse model of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that the treatment not only led to expression of full-length CNGB1a, but also restored normal levels of the previously degraded CNGA1 subunit of the rod CNG channel."
      explanation: >-
        Establishes that gene augmentation not only supplies CNGB1a but also
        rescues the secondary CNGA1 degradation, restoring channel assembly.
- name: CNGB1-mutant dog (naturally occurring, Papillon/Phalene breeds)
  species: Dog
  genotype: "CNGB1 frameshift/indel loss-of-function (breed-specific mutation, exon 25/26 region)"
  publication: PMID:24015210
  evidence:
  - reference: PMID:24015210
    reference_title: A CNGB1 frameshift mutation in Papillon and Phalène dogs with progressive retinal atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mutation causes a frameshift and premature stop codon leading to probable nonsense mediated decay (NMD) of the CNGB1 mRNA."
    explanation: >-
      Establishes this as a naturally occurring, large-eye CNGB1
      loss-of-function animal model of the disease.
  modeled_mechanisms:
  - target: Rod Photoreceptor Apoptosis and Progressive Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A naturally occurring CNGB1 frameshift mutation causes progressive
      retinal atrophy in Papillon and Phalene dogs with early rod dysfunction
      and slow, progressive rod photoreceptor loss with secondary cone decline,
      closely resembling human CNGB1-RP and providing a large-eye translational
      model.
    evidence:
    - reference: PMID:29202463
      reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CNGB1-deficient RP patients and mouse and dog models had a similar phenotype characterized by early loss of rod function and slow rod photoreceptor loss with a secondary decline in cone function."
      explanation: >-
        Confirms the canine model reproduces the early-rod-loss,
        slow-degeneration pattern that defines the human disease course.
  - target: Loss of Rod CNG Channel Function and cGMP Dysregulation
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Subretinal AAV5-mediated CNGB1 gene augmentation in CNGB1-mutant dogs
      restores CNGA1 trafficking to the outer segment, reverses the abnormal
      cGMP accumulation characteristic of the untreated channel-deficient
      state, and produces long-term (at least 23-month) rescue of rod-mediated
      ERG responses and scotopic vision.
    readouts:
    - name: Photoreceptor outer segment cGMP accumulation
      target: Loss of Rod CNG Channel Function and cGMP Dysregulation
      direction: RESTORED
      interpretation: >-
        Reversal of abnormal cGMP accumulation in treated retinal regions
        confirms restoration of functional CNG channel activity.
      evidence:
      - reference: PMID:37056049
        reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The treatment reverses abnormal accumulation of the second messenger, cyclic guanosine monophosphate, which occurs in rod photoreceptors of CNGB1 mutant dogs, confirming formation of a functional CNG channel."
        explanation: >-
          Direct immunohistochemical evidence that gene therapy reverses the
          cGMP-dysregulation consequence of channel loss.
    - name: Scotopic ERG b-wave and vision-guided behavior
      target: Loss of Rod CNG Channel Function and cGMP Dysregulation
      direction: RESTORED
      interpretation: >-
        Sustained improvement in rod-mediated ERG amplitude and scotopic
        vision-guided behavior over long-term follow-up confirms durable
        functional rescue.
      evidence:
      - reference: PMID:29202463
        reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "gene augmentation using adeno-associated virus vectors robustly sustained the rescue of rod function and preserved retinal structure in the dog model"
        explanation: >-
          Confirms sustained functional and structural rescue following gene
          augmentation in the canine model.
    evidence:
    - reference: PMID:37056049
      reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The therapeutic vector (AAV5-RHO-CNGB1) delivered to the subretinal space of CNGB1 mutant dogs restores rod-mediated retinal function (electroretinographic responses and vision)"
      explanation: >-
        Establishes the canine model as the pharmacodynamic efficacy platform
        for a clinically translatable AAV construct.

treatments:
- name: AAV-Mediated CNGB1 Gene Augmentation Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    Subretinal delivery of an adeno-associated viral vector expressing CNGB1
    cDNA under a short, rod-specific promoter (required because the large
    CNGB1 cDNA, ~3.76-4 kb, consumes most of the AAV packaging capacity).
    Preclinical proof-of-concept in the Cngb1-/- mouse and a subsequent
    translatable construct tested in CNGB1-mutant dogs and non-human primates
    both showed robust, durable (at least 12-23 month) restoration of
    rod-mediated function and preservation of retinal structure. As of
    curation, this program has not yet been reported in a human clinical
    trial, but the combination of a wide therapeutic window (early functional
    loss with late structural loss) and validated large-eye preclinical
    efficacy makes CNGB1-RP a leading translational candidate among
    inherited retinal degenerations.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Loss of Rod CNG Channel Function and cGMP Dysregulation
    treatment_effect: RESTORES
    description: >-
      Restores the missing CNGB1 subunit, allowing reassembly of a functional
      heterotetrameric CNG channel and reversal of the cGMP dysregulation
      that follows channel loss.
    evidence:
    - reference: PMID:37056049
      reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, this study establishes the long-term efficacy of subretinal delivery of AAV5-RHO-CNGB1 to rescue the disease phenotype in a canine model of CNGB1-RP, confirming its suitability for future clinical development."
      explanation: >-
        Directly supports gene augmentation as restoring the channel-loss
        mechanism this treatment targets.
  evidence:
  - reference: PMID:22802073
    reference_title: Gene therapy restores vision and delays degeneration in the CNGB1(-/-) mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this work provides a proof-of-concept for the treatment of rod channelopathy-associated RP by AAV-mediated gene replacement"
    explanation: >-
      Establishes preclinical proof-of-concept for AAV-mediated CNGB1 gene
      replacement in the mouse model.
  - reference: PMID:29202463
    reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "gene augmentation using adeno-associated virus vectors robustly sustained the rescue of rod function and preserved retinal structure in the dog model"
    explanation: >-
      Confirms robust, sustained functional and structural rescue in the
      large-eye canine model, supporting translational readiness.
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The promoter/capsid combination drives efficient expression of a reporter gene (AAV5-RHO-eGFP) exclusively in rod photoreceptors in primate, dog, and mouse following subretinal delivery."
    explanation: >-
      Demonstrates the vector's rod-specific expression across three species
      including non-human primate, supporting its translational readiness.
- name: Genetic counseling
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling is indicated given the autosomal recessive inheritance
    pattern and the availability of molecular testing to confirm biallelic
    CNGB1 variants.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11379879
    reference_title: Segregation of a mutation in CNGB1 encoding the beta-subunit of the rod cGMP-gated channel in a family with autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CNGB1 gene, which encodes the beta-subunit of the rod cGMP-gated channel, is mutated in the family presented in this study."
    explanation: >-
      Confirms the autosomal recessive inheritance pattern underlying genetic
      counseling recommendations.

classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: NEUROLOGIC

diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of CNGB1 identifies biallelic pathogenic variants and confirms
    the diagnosis; the allelic spectrum spans missense, nonsense, splice-site,
    and small indel variants across the gene with no known hotspot.
  results: >-
    Identification of biallelic pathogenic CNGB1 variants confirms the
    diagnosis of CNGB1-related retinopathy (RP45).
  evidence:
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10 patients from 9 families underwent full ophthalmologic examination. Molecular investigations included whole-exome analysis in 6 patients."
    explanation: >-
      Documents molecular genetic testing (whole-exome analysis) as the
      diagnostic approach used to confirm CNGB1-related retinopathy in this
      cohort.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Dark- and light-adapted full-field ERG characterizes the severity of rod
    and cone dysfunction and typically shows non-recordable or severely
    attenuated scotopic responses even when visual acuity remains good.
  results: >-
    Scotopic (rod) responses are absent or severely attenuated; photopic
    (cone) responses range from normal to severely reduced depending on
    patient age and disease stage.
  evidence:
  - reference: PMID:33465333
    reference_title: Variable expressivity in patients with autosomal recessive retinitis pigmentosa associated with the gene CNGB1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological testing in five patients showed an absence of the rod response. Cone responses ranged from normal to severely reduced."
    explanation: >-
      Directly quantifies the electrophysiological diagnostic pattern.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Spectral-domain OCT ellipsoid zone (EZ) length and fundus autofluorescence
    (FAF) hyperautofluorescent ring area are used both diagnostically and as
    candidate clinical-trial endpoints, since visual acuity is not a sensitive
    progression metric in this slowly progressive disease.
  results: >-
    Ellipsoid zone length constricts at a mean rate of approximately 178 +/-
    161 micrometers per year, and a hyperautofluorescent perifoveal ring is
    present in the large majority of patients with a measurable phenotype,
    both showing detectable change within a 2-year simulated trial window.
  evidence:
  - reference: PMID:35743231
    reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ellipsoid zone (EZ) length was measurable in at least one eye of 23 patients"
    explanation: >-
      Establishes ellipsoid zone length as a measured structural biomarker
      used as a candidate imaging endpoint.

epidemiology:
- name: Contribution to autosomal recessive retinitis pigmentosa
  description: >-
    CNGB1 pathogenic variants consistently account for approximately 4% of
    autosomal recessive retinitis pigmentosa cases across independent cohorts.
  evidence:
  - reference: PMID:35743231
    reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in CNGB1 are responsible for 4% of autosomal recessive retinitis pigmentosa (RP)."
    explanation: >-
      States the population-level contribution of CNGB1 to autosomal
      recessive RP.
  - reference: PMID:29202463
    reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(CNGB1) cause approximately 4% of autosomal recessive RP."
    explanation: >-
      Provides an independent confirmation of the approximately 4%
      contribution of CNGB1 to autosomal recessive RP.

progression:
- phase: Childhood-onset rod dysfunction
  age_range: Early childhood
  notes: >-
    Nyctalopia is the near-universal presenting symptom, with onset in
    childhood in the great majority of patients, reflecting early and severe
    loss of rod-mediated dim-light vision.
  evidence:
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first clinical presentation was with nyctalopia in childhood with visual field loss documented later at a mean (SD) age of 33.2 (8.0) years."
    explanation: >-
      Establishes the childhood-onset timing of the presenting symptom.
- phase: Prolonged preservation of visual acuity and macular structure
  age_range: Childhood through the third and fourth decades
  notes: >-
    Despite early and severe rod dysfunction, best-corrected visual acuity and
    foveal structure are typically well preserved into adulthood, producing an
    unusually wide interval between functional rod loss and clinically
    significant structural or visual-field loss.
  evidence:
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had preserved best-corrected visual acuity into adulthood, with a mean of 0.1 logMAR (Snellen equivalent, 20/25) in each eye"
    explanation: >-
      Directly quantifies preserved visual acuity into adulthood in a
      dedicated CNGB1-RP clinical series.
- phase: Slow progressive structural decline in adulthood
  age_range: Adulthood, over multi-year follow-up
  notes: >-
    Over a mean follow-up of approximately 4.5 years, ellipsoid zone length,
    hyperautofluorescent ring area, and best-corrected visual acuity all show
    measurable decline, confirming CNGB1-related retinopathy as slowly but
    detectably progressive even though central vision is maintained for an
    unusually long period.
  evidence:
  - reference: PMID:35743231
    reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results support previous findings of CNGB1-related RP being a slowly progressive disease with patients maintaining visual acuity."
    explanation: >-
      States the natural-history cohort's overall conclusion of slow,
      measurable progression with maintained visual acuity.

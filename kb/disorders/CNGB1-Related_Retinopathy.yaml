name: CNGB1-Related Retinopathy
creation_date: "2026-08-25T00:00:00Z"
category: Mendelian
description: >-
  CNGB1-related retinopathy is an autosomal recessive rod-cone dystrophy
  (historically retinitis pigmentosa type 45, RP45) caused by biallelic
  loss-of-function variants in CNGB1, which encodes the beta subunit of the rod
  photoreceptor cyclic nucleotide-gated (CNG) channel. The native rod channel is
  a heterotetramer of three CNGA1 (alpha) subunits and one CNGB1 (beta) subunit;
  CNGB1a is dispensable for channel formation in isolation but is required for
  trafficking the complex to the outer segment membrane and setting its normal
  gating properties. Loss of CNGB1 causes secondary degradation and mistrafficking
  of the partner CNGA1 subunit, so rods are left with essentially no functional
  CNG channel at the outer segment, abolishing rod-mediated phototransduction from
  early childhood. Photoreceptor apoptosis and retinal degeneration follow, but
  unlike many other phototransduction-cascade RP genes, the loss of rod function
  and the loss of rod photoreceptor structure are markedly dissociated in time:
  patients are night-blind from childhood yet typically retain good visual acuity
  and macular structure into the fourth decade or later, giving an unusually wide
  therapeutic window that has made this one of the more advanced translational
  gene-augmentation programs among inherited retinal degenerations. CNGB1 mutations
  account for approximately 4% of autosomal recessive RP. Because CNGB1 also has a
  splice isoform (CNGB1b) expressed in olfactory sensory neuron CNG channels,
  patients frequently also have olfactory dysfunction, distinguishing this entry
  clinically from most other single-gene rod-cone dystrophies.
disease_term:
  preferred_term: CNGB1-related retinopathy
  term:
    id: MONDO:0800403
    label: CNGB1-related retinopathy
synonyms:
- Retinitis pigmentosa 45
- RP45
- CNGB1-related autosomal recessive retinitis pigmentosa
- CNGB1-associated retinitis pigmentosa
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  Do not conflate CNGB1 with the paralogous CNG-channel genes that cause distinct
  diseases: CNGA1 (the rod channel's alpha subunit; RP49) and CNGA3/CNGB3 (the
  cone channel's alpha and beta subunits; achromatopsia) are separate loci with
  separate KB entries. Both a-subunit and b-subunit rod-channel lesions converge
  on the same channel-trafficking failure mechanism modelled here, but they are
  genetically distinct. This entry covers CNGB1 specifically. No dedicated
  GeneReviews chapter exists for CNGB1-related retinopathy as of curation (a
  PubMed title search for "CNGB1 GeneReviews" returned zero results); the general
  "Nonsyndromic Retinitis Pigmentosa Overview" GeneReviews chapter (PMID:20301590)
  covers RP as a disease class but is not gene-specific, so it is not used as the
  mandatory phenotype baseline here. Phenotypes below are restricted to findings
  with direct CNGB1-cohort support.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    CNGB1-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) loss-of-function variants in CNGB1.
  evidence:
  - reference: PMID:11379879
    reference_title: Segregation of a mutation in CNGB1 encoding the beta-subunit of the rod cGMP-gated channel in a family with autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By performing full genome linkage analysis in a consanguineous French family affected with severe autosomal recessive RP, we have excluded linkage to known loci involved in RP and mapped a novel locus to chromosome 16q13-q21"
    explanation: >-
      This original gene-discovery paper establishes autosomal recessive
      inheritance for CNGB1-related retinitis pigmentosa via linkage in a
      consanguineous family.
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IMPORTANCE: There are limited published data on the phenotype of retinitis pigmentosa (RP) related to CNGB1 variants."
    explanation: >-
      Confirms the disease is classified as autosomal recessive RP in a
      dedicated clinical characterization series.
pathophysiology:
- name: CNGB1 Loss-of-Function Variant
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic CNGB1 variants (nonsense, frameshift, splice-site, and
    missense changes distributed across the gene's 33 exons with no known
    mutational hotspot) abolish or truncate the beta subunit of the rod cyclic
    nucleotide-gated channel. CNGB1a is the accessory subunit of the native rod
    channel, which is a heterotetramer of three CNGA1 subunits and one CNGB1a
    subunit.
  gene:
    preferred_term: CNGB1
    modifier: DECREASED
    term:
      id: hgnc:2151
      label: CNGB1
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  evidence:
  - reference: PMID:35743231
    reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "(CNGB1) encodes a subunit of the rod cyclic nucleotide-gated channel."
    explanation: >-
      Establishes the CNGB1a protein product that pathogenic variants
      disrupt. Evidence source is OTHER because this is background from a
      clinical natural-history paper, not a primary finding.
  downstream:
  - target: CNGA1 Subunit Degradation and CNG Channel Assembly Failure
    causal_link_type: DIRECT

- name: CNGA1 Subunit Degradation and CNG Channel Assembly Failure
  biological_scale: MOLECULAR
  description: >-
    CNGB1a is required for trafficking the heteromeric rod CNG channel to the
    outer segment plasma membrane. In its absence, the partner CNGA1 subunit is
    not stably retained at the outer segment and only trace amounts remain,
    so the functional heterotetrameric channel fails to assemble. Structural
    work shows this is mediated by a specific intersubunit interaction between
    CNGA1 and CNGB1 that, when disrupted, exposes a trafficking-inhibitory
    region of CNGB1 and prevents membrane expression of the complex.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  cellular_components:
  - preferred_term: photoreceptor outer segment
    term:
      id: GO:0001750
      label: photoreceptor outer segment
  molecular_functions:
  - preferred_term: intracellularly cyclic nucleotide-activated cation channel activity
    modifier: DECREASED
    term:
      id: GO:0005221
      label: intracellularly cyclic nucleotide-activated monoatomic cation channel activity
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of CNGB1, only trace amounts of the CNGA1 subunit were found on the rod outer segment."
    explanation: >-
      Direct mouse-knockout evidence that CNGB1 loss causes near-complete loss
      of the partner CNGA1 subunit from the rod outer segment membrane.
  - reference: PMID:11970862
    reference_title: An intersubunit interaction regulates trafficking of rod cyclic nucleotide-gated channels and is disrupted in an inherited form of blindness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the mechanism underlying this defect involves an intersubunit interaction between CNGA1 and CNGB1 that was not formed between CNGA1-RP and CNGB1 subunits. In the absence of this interaction, a short N-terminal region in CNGB1 prevented membrane expression."
    explanation: >-
      Heterologous expression evidence establishing the specific molecular
      mechanism by which loss of the CNGA1-CNGB1 intersubunit interaction
      blocks channel trafficking to the membrane.
  downstream:
  - target: Loss of Rod CNG Channel Function and cGMP Dysregulation
    causal_link_type: DIRECT

- name: Loss of Rod CNG Channel Function and cGMP Dysregulation
  conforms_to: "phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point Control"
  biological_scale: CELLULAR
  description: >-
    With essentially no functional heterotetrameric CNG channel present at the
    outer segment, rods cannot generate a light response: the channel cannot
    open in response to cGMP regardless of light exposure. This produces both a
    functional silencing of rod phototransduction and an abnormal accumulation
    of cGMP within the rod outer segment, directly demonstrated by immunolabeling
    in CNGB1-deficient dog retina and shown to be reversible by restoring channel
    expression via gene therapy.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: Phototransduction
    term:
      id: GO:0007602
      label: phototransduction
    modifier: DECREASED
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the vast majority of isolated rod photoreceptors in mice lacking CNGB1 (CNGB1-/-) failed to respond to light. In electroretinograms (ERGs), CNGB1-/- mice showed no rod-mediated responses."
    explanation: >-
      Direct electrophysiological evidence that loss of the rod CNG channel
      abolishes the rod light response.
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The treatment reverses abnormal accumulation of the second messenger, cyclic guanosine monophosphate, which occurs in rod photoreceptors of CNGB1 mutant dogs, confirming formation of a functional CNG channel."
    explanation: >-
      Directly demonstrates abnormal cGMP accumulation in CNGB1-deficient rod
      outer segments and its reversal by restoring channel expression,
      establishing the cGMP-dysregulation consequence of channel loss in vivo.
  downstream:
  - target: Rod Photoreceptor Apoptosis and Progressive Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Rod Photoreceptor Apoptosis and Progressive Degeneration
  conforms_to: "phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor Degeneration"
  biological_scale: CELLULAR
  description: >-
    Unlike the stationary phenotype seen with some phototransduction-cascade
    lesions, chronic loss of CNG channel function in CNGB1-deficient rods hands
    off to a slowly progressive photoreceptor cell-death programme. Rods undergo
    apoptotic death accompanied by retinal gliosis; this is notably slower than
    in many other RP mouse models, producing the characteristic dissociation
    between early functional loss and late structural loss that defines the
    clinical course.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The rods also showed a slow-progressing degeneration caused by apoptotic death and concurred by retinal gliosis."
    explanation: >-
      Direct histological evidence of the apoptotic mechanism and slow tempo
      of rod degeneration in the CNGB1 knockout mouse retina.
  downstream:
  - target: Secondary Cone Dysfunction and Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Secondary Cone Dysfunction and Degeneration
  conforms_to: "photoreceptor_degeneration#Secondary Cone Degeneration and Outer Retinal Thinning"
  biological_scale: TISSUE
  description: >-
    Cones do not express CNGB1a and are not cell-autonomously affected by the
    channel-trafficking defect, but they decline secondarily and later than rods
    once the surrounding rod population is lost, following the conserved
    non-cell-autonomous cone degeneration pattern of retinitis pigmentosa. This
    secondary, delayed cone decline underlies the retained good central vision
    that characterizes the disease for years after rod function is already lost.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cones were primarily unaffected and showed normal ERG responses up to 6 months, but they started to degenerate in later stages."
    explanation: >-
      Direct evidence in the mouse model that cone dysfunction and degeneration
      are delayed relative to rod loss.
  - reference: PMID:29202463
    reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNGB1-deficient RP patients and mouse and dog models had a similar phenotype characterized by early loss of rod function and slow rod photoreceptor loss with a secondary decline in cone function."
    explanation: >-
      Establishes that the rod-first, cone-secondary degeneration pattern is
      consistent across human patients, mouse, and dog models of the disease.
  downstream:
  - target: Progressive Visual Field Loss and Blindness
    causal_link_type: DIRECT

- name: Progressive Visual Field Loss and Blindness
  conforms_to: "photoreceptor_degeneration#Progressive Visual Field Loss and Blindness"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of rod-then-cone loss: childhood-onset night
    blindness followed, often many decades later, by peripheral visual field
    constriction and eventual central vision loss. The unusually long interval
    between functional rod loss and structural/visual-field loss is the
    defining clinical feature of CNGB1-related retinopathy relative to other RP
    subtypes.
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first clinical presentation was with nyctalopia in childhood with visual field loss documented later at a mean (SD) age of 33.2 (8.0) years."
    explanation: >-
      Directly quantifies the long interval between childhood-onset night
      blindness and later-onset visual field loss.
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data from this study suggest that visual acuity and foveal structure in patients with RP are preserved into adult life such that a lengthy window of opportunity should exist for intervention with novel therapies."
    explanation: >-
      Establishes the clinically important therapeutic-window consequence of
      the slow rod-to-cone-to-field-loss progression.


genetic:
- name: CNGB1
  gene_term:
    preferred_term: CNGB1
    term:
      id: hgnc:2151
      label: CNGB1
  association: Causative
  features: >-
    The 2021 mutation review catalogued 84 reported CNGB1 variants, of which 59 were classified pathogenic or likely pathogenic and 25 as uncertain significance. These are dated literature counts, not a current inventory of 84 proven causal alleles. Variants span GARP and channel regions; the review noted concentrations of reported channel-domain missense variants. Individual alleles can affect abundance, splicing, trafficking or gating differently. No reliable genotype-based prediction of retinal severity or olfactory involvement was established in the reviewed clinical cohorts.
  case_fractions:
  - population: Autosomal recessive retinitis pigmentosa cohorts summarized in the 2021 mutation review
    case_fraction_low: 1.0
    case_fraction_high: 4.0
    notes: The review summarizes approximately 1–4% of autosomal recessive RP across earlier cohorts. This is not a population prevalence estimate or a measured constant across ancestries. Its separately reported 0.42–0.78% estimates use all inherited retinal disease index cases as denominator.
    evidence:
    - reference: PMID:33847019
      reference_title: 'CNGB1-related rod-cone dystrophy: A mutation review and update.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: accounting for approximately 1%–4% of autosomal recessive RP cases
      explanation: Literature synthesis of case fractions in arRP cohorts; not a new population-frequency measurement.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:11379879
      reference_title: Segregation of a mutation in CNGB1 encoding the beta-subunit of the rod cGMP-gated channel in a family with autosomal recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The CNGB1 gene, which encodes the beta-subunit of the rod cGMP-gated channel, is mutated in the family presented in this study."
      explanation: >-
        Confirms autosomal recessive inheritance for CNGB1-related RP in the
        original gene-discovery family.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:20126465
    reference_title: "The retinitis pigmentosa mutation c.3444+1G>A in CNGB1 results in skipping of exon 32."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we investigated the splicing of c.3444+1G>A by exon trapping experiments and could demonstrate that instead of the proposed truncation of the last 28 aa this mutation leads to replacement of the last 170 aa of CNGB1a by 68 unrelated amino acids."
    explanation: >-
      Exon trapping demonstrates exon-32 skipping for this splice-site allele; the result replaces the original last-28-residue truncation prediction. Tissue transcript fate and channel function were not directly measured.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:33847019
    reference_title: 'CNGB1-related rod-cone dystrophy: A mutation review and update.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: According to the ACMG criteria, 59 variants were considered pathogenic or likely pathogenic and 25 variants were classified of uncertain significance
    explanation: Variant reclassification in the 2021 review distinguishes reported alleles from confirmed pathogenic or likely pathogenic variants.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6136054/
    reference_title: Olfactory Dysfunction in Patients With CNGB1-Associated Retinitis Pigmentosa - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: evaluating the 3 missense variants as variants of uncertain significance
    explanation: The 2018 study classified p.Arg737His, p.Arg762Cys and p.Asn986Ile as VUS under its stated criteria; this is a dated study classification, not a current independent reinterpretation.
animal_models:
- name: Cngb1-X26 knockout mouse
  species: Mouse
  genotype: "Cngb1-/- (exon 26 deletion; Cngb1-X26)"
  publication: PMID:15634774
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To investigate the importance of the CNGB subunits in vivo, we deleted the CNGB1 gene in mice."
    explanation: >-
      Establishes this as the original targeted-knockout mouse model of
      CNGB1-related retinopathy.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  modeled_mechanisms:
  - target: Impaired Rod Light Responses
    description: The X26 knockout has absent rod-mediated ERGs and predominantly unresponsive isolated rods.
    evidence:
    - reference: PMID:15634774
      reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: the vast majority of isolated rod photoreceptors in mice lacking CNGB1 (CNGB1-/-) failed to respond to light. In electroretinograms (ERGs), CNGB1-/- mice showed no rod-mediated responses.
      explanation: Most isolated knockout rods were unresponsive; the population ERG lacked rod-mediated responses. Neither observation proves that every rod is silent.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Mice lack a macula; the knockout is not representative of every missense or GARP-region allele.
    fidelity: MODERATE
    readouts:
    - name: Rod-mediated ERG
      target: Impaired Rod Light Responses
      direction: DECREASED
      interpretation: Rod-system functional impairment, not a direct assay of apoptosis.
      evidence:
      - reference: PMID:15634774
        reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: the vast majority of isolated rod photoreceptors in mice lacking CNGB1 (CNGB1-/-) failed to respond to light. In electroretinograms (ERGs), CNGB1-/- mice showed no rod-mediated responses.
        explanation: Most isolated knockout rods were unresponsive; the population ERG lacked rod-mediated responses. Neither observation proves that every rod is silent.
  - target: Progressive Rod Photoreceptor Loss
    description: Progressive apoptotic rod loss occurs in the X26 mouse.
    evidence:
    - reference: PMID:15634774
      reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The rods also showed a slow-progressing degeneration caused by apoptotic death and concurred by retinal gliosis.
      explanation: The X26 knockout shows progressive apoptotic rod loss and associated gliosis. This does not establish the same death pathway in every human allele.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Mouse histology establishes apoptosis in this model; human structural imaging does not establish a shared death-effector pathway.
    fidelity: MODERATE
  - target: Impaired Rod Light Responses
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Subretinal AAV8-mediated delivery of CNGB1a to Cngb1-/- mice restores
      full-length CNGB1a expression, rescues degraded CNGA1 to normal levels,
      and reconstitutes functional CNG channel complexes in rod outer segments.
    readouts:
    - name: Scotopic ERG rod-driven light response
      target: Impaired Rod Light Responses
      direction: RESTORED
      interpretation: >-
        Restoration of rod-driven ERG light responses after gene therapy
        confirms reconstitution of a functional rod CNG channel.
      evidence:
      - reference: PMID:22802073
        reference_title: Gene therapy restores vision and delays degeneration in the CNGB1(-/-) mouse model of retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the electroretinographic analysis, we also observed restoration of rod-driven light responses."
        explanation: >-
          Directly reports restored rod-driven ERG responses following AAV
          gene therapy in the mouse model.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    evidence:
    - reference: PMID:22802073
      reference_title: Gene therapy restores vision and delays degeneration in the CNGB1(-/-) mouse model of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that the treatment not only led to expression of full-length CNGB1a, but also restored normal levels of the previously degraded CNGA1 subunit of the rod CNG channel."
      explanation: >-
        Establishes that gene augmentation not only supplies CNGB1a but also
        rescues the secondary CNGA1 degradation, restoring channel assembly.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    model_scale: CELLULAR
    limitations: AAV rescue in mice; treatment at two weeks and rodent retinal anatomy limit inference about older human patients.
  - target: Impaired Rod Light Responses
    description: AAV5-hRHO194-human CNGB1 given at four weeks improves rod ERGs and dim-light behavior most strongly at the intermediate dose. The highest dose had no clear ERG benefit, and structural thinning was slowed rather than stopped.
    evidence:
    - reference: PMID:34376057
      reference_title: In Vivo Potency Testing of Subretinal rAAV5.hCNGB1 Gene Therapy in the Cngb1 Knockout Mouse Model of Retinitis Pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: increasing doses of rAAV5.hCNGB1 were delivered through single subretinal injection in 4-week-old Cngb1
      explanation: The 2021 study tests a human CNGB1 AAV5 construct in young knockout mice, separately from the 2012 species-matched proof of concept.
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8819509/
      reference_title: In Vivo Potency Testing of Subretinal rAAV5.hCNGB1 Gene Therapy in the Cngb1 Knockout Mouse Model of Retinitis Pigmentosa - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: no differences in b-wave amplitudes were seen between the high-dose treatment and the control group
      explanation: The full-text dose-ranging results report no obvious functional improvement at the highest dose; this is not a monotonic dose-response.
    relationship: RESCUES
    model_scale: CELLULAR
    limitations: Human/mouse hybrid channels, ectopic human CNGB1 localization and a young knockout retina complicate dose translation. Doses are preclinical experimental values, not human recommendations.
    fidelity: MODERATE
  description: Exon-26 knockout abolishing the full-length channel subunit while preserving soluble GARP isoforms. It models channel deficiency, not all human alleles or GARP-null phenotypes.

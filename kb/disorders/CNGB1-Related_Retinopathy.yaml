    reference_title: A CNGB1 frameshift mutation in Papillon and Phalène dogs with progressive retinal atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mutation causes a frameshift and premature stop codon leading to probable nonsense mediated decay (NMD) of the CNGB1 mRNA."
    explanation: >-
      Establishes this as a naturally occurring, large-eye CNGB1
      loss-of-function animal model of the disease.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:29202463
    reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The truncated product partly escaped nonsense- mediated decay, leading to a relative expression level approximately 40% of that of WT tran- script levels in the controls
    explanation: Retinal RT-PCR and expression studies in the later paper revise the original NMD-only prediction; approximately 40% residual transcript and a truncated inner-segment protein were reported.
  modeled_mechanisms:
  - target: Progressive Rod Photoreceptor Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Progressive rod loss and later cone decline provide a large-eye model of the rod-first disease course; the cited dog histology does not itself establish apoptosis.
    evidence:
    - reference: PMID:29202463
      reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cngb1-/- dogs have slow photoreceptor loss and relative preservation of cones."
      explanation: >-
        Reports the canine result alone: photoreceptor loss is slow and cones
        are relatively spared, the rod-first pattern of the human disease.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    - reference: PMID:29202463
      reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cone function slowly declines with age in the Cngb1-/- dog."
      explanation: >-
        Reports the secondary, slow decline of cone function in the canine
        model, matching the cone-secondary course seen in patients.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    model_scale: CELLULAR
    limitations: Dogs have an area centralis but differ from humans in early central outer nuclear layer thinning and autofluorescence patterns. One breed-associated allele does not model all human variants.
  - target: Impaired Rod Light Responses
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      AAV5-hGRK1-canine CNGB1 in the 2018 proof-of-concept study yielded ERG rescue through 18 months in the longest ERG follow-up; 23 months referred to protein expression/structural follow-up. The distinct 2023 AAV5-RHO-human CNGB1 study treated ten three-month-old dogs and assessed functional rescue through 12 months in animals retained that long.
    readouts:
    - name: Scotopic ERG b-wave and vision-guided behavior
      target: Impaired Rod Light Responses
      direction: RESTORED
      interpretation: >-
        Sustained improvement in rod-mediated ERG amplitude and scotopic
        vision-guided behavior over long-term follow-up confirms durable
        functional rescue.
      evidence:
      - reference: PMID:29202463
        reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "gene augmentation using adeno-associated virus vectors robustly sustained the rescue of rod function and preserved retinal structure in the dog model"
        explanation: >-
          Confirms sustained functional and structural rescue following gene
          augmentation in the canine model.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    evidence:
    - reference: PMID:37056049
      reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The therapeutic vector (AAV5-RHO-CNGB1) delivered to the subretinal space of CNGB1 mutant dogs restores rod-mediated retinal function (electroretinographic responses and vision)"
      explanation: >-
        Establishes the canine model as the pharmacodynamic efficacy platform
        for a clinically translatable AAV construct.

      quote_role: PRIMARY_RESULT
      directness: DIRECT
    model_scale: CELLULAR
    limitations: Dogs have an area centralis but differ from humans in early central outer nuclear layer thinning and autofluorescence patterns. One breed-associated allele does not model all human variants.
  - target: Rod cGMP Accumulation
    description: Abnormal cGMP immunoreactivity is reduced within human-CNGB1-treated canine retina.
    evidence:
    - reference: PMID:37056049
      reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: A feature of lack of CNG channel function in rod outer segments is the abnormal accumulation of cGMP. IHC showed that this was reversed within the treated retinal regions
      explanation: In the cGMP-accumulation results section, immunohistochemistry showed reversal of abnormal cGMP staining in treated dog retina, with staining retained outside the treated regions. This is not a direct channel-current measurement.
    relationship: RESCUES
    model_scale: MOLECULAR
    limitations: Immunoreactivity is not a direct ionic-current or intracellular-calcium measurement.
    fidelity: MODERATE
    readouts:
    - name: Photoreceptor outer segment cGMP accumulation
      target: Rod cGMP Accumulation
      direction: RESTORED
      interpretation: >-
        Reduced abnormal cGMP staining in treated regions is an indirect pharmacodynamic marker of restored channel function.
      evidence:
      - reference: PMID:37056049
        reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: A feature of lack of CNG channel function in rod outer segments is the abnormal accumulation of cGMP. IHC showed that this was reversed within the treated retinal regions
        explanation: In the cGMP-accumulation results section, immunohistochemistry showed reversal of abnormal cGMP staining in treated dog retina, with staining retained outside the treated regions. This is not a direct channel-current measurement.
  description: Naturally occurring Papillon/Phalène channel-deficiency model. The 2013 discovery paper predicted NMD without affected retinal tissue. The 2018 follow-up demonstrated exon skipping, approximately 40% residual transcript and inner-segment truncated protein; it is not a complete transcript-null model.
- name: Conditional Cngb1 rescue mouse
  species: Mouse
  genotype: Cngb1neo/neo; UBC-cre/ERT2 (loxP-flanked neomycin cassette in intron 19)
  publication: PMID:38086857
  description: Tamoxifen-inducible restoration of endogenous Cngb1 used to isolate the effect of disease stage on rescue; distinct from X26 knockout and viral augmentation.
  evidence:
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: By delivering tamoxifen, activated cre removes the neomycin insert to enable endogenous CNGB1 expression across all rods
    explanation: Defines the conditional endogenous rescue system.
  modeled_mechanisms:
  - target: Impaired Retinal Ganglion Cell Signaling
    description: Tamoxifen activates Cre-mediated removal of the blocking cassette to restore endogenous Cngb1 at one, two or three months. Earlier rescue restores output closer to wild type; late rescue retains lower gain and greater variability.
    evidence:
    - reference: PMID:38086857
      reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Early and mid-treatment brought the response variability back toward that of WT
      explanation: Multielectrode recordings show stage-dependent recovery of retinal ganglion cell response fidelity after conditional Cngb1 rescue.
    relationship: RESCUES
    model_scale: CELLULAR
    limitations: Conditional endogenous restoration is an artificial best-case experiment, not AAV delivery. Approximate 25%, 50% and 70% rod-loss groups are model-specific and are not human eligibility thresholds.
    fidelity: MODERATE
    readouts:
    - name: Ganglion-cell spike-response variability and information rate
      target: Impaired Retinal Ganglion Cell Signaling
      interpretation: Late rescue improves signaling above untreated levels but fails to normalize fidelity.
      evidence:
      - reference: PMID:38086857
        reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: late treatment failed to reduce the signal-dependent noise
        explanation: Multielectrode recordings distinguish incomplete functional rescue from structural photoreceptor survival.
  - target: Reactive Retinal Gliosis
    description: GFAP labeling persists after late rescue.
    evidence:
    - reference: PMID:38086857
      reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: we found that GFAP was present in both untreated and late-treated retinas at 7 M
      explanation: Persistent GFAP labeling after late endogenous rescue supports a sustained glial stress response in this conditional mouse model; it does not establish a causal inflammatory mediator.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Qualitative GFAP staining; no quantitative causal test of inflammation.
    fidelity: MODERATE
  - target: Photoreceptor Synaptic Ribbon Loss
    description: Late rescue leaves fewer intact CtBP2-labeled ribbon structures.
    evidence:
    - reference: PMID:38086857
      reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Following late treatment, CtBP2 horseshoe structures were substantially reduced
      explanation: CtBP2 immunolabeling showed loss of normal photoreceptor synaptic ribbon structures after late conditional rescue.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Anatomical association with advanced degeneration; not a selective synapse-restoration experiment.
    fidelity: MODERATE
treatments:
- name: AAV-Mediated CNGB1 Gene Augmentation Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    AAV-mediated delivery of CNGB1 has restored rod function and preserved retinal structure in preclinical mouse and dog experiments. The 2023 translational study additionally tested a promoter/capsid reporter in primates; this was a rod-targeting experiment, not a demonstration of retinal rescue in diseased primates. Construct, species, treatment age and follow-up differ between studies. These experiments do not establish human efficacy or a universal treatment window. The 2021 AAV5 mouse dose-ranging study found the strongest benefit at the intermediate dose and no clear ERG benefit at the highest dose; retinal thinning was slowed rather than arrested. In the 2023 dog study, one treated eye developed inflammation and focal retinal/choroidal degeneration. Conditional endogenous rescue in a separate mouse line shows incomplete recovery after advanced rod loss, without defining a human treatment cutoff.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Impaired Rod Light Responses
    treatment_effect: RESTORES
    description: >-
      Restores rod light-response function in preclinical CNGB1-deficient animals; benefit depends on construct, dose and disease stage.
    evidence:
    - reference: PMID:37056049
      reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, this study establishes the long-term efficacy of subretinal delivery of AAV5-RHO-CNGB1 to rescue the disease phenotype in a canine model of CNGB1-RP, confirming its suitability for future clinical development."
      explanation: >-
        Directly supports gene augmentation as restoring the channel-loss
        mechanism this treatment targets.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - target: Rod cGMP Accumulation
    treatment_effect: INHIBITS
    description: Reduces abnormal cGMP accumulation within effectively treated model retina.
    evidence:
    - reference: PMID:37056049
      reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: A feature of lack of CNG channel function in rod outer segments is the abnormal accumulation of cGMP. IHC showed that this was reversed within the treated retinal regions
      explanation: In the cGMP-accumulation results section, immunohistochemistry showed reversal of abnormal cGMP staining in treated dog retina, with staining retained outside the treated regions. This is not a direct channel-current measurement.
  evidence:
  - reference: PMID:22802073
    reference_title: Gene therapy restores vision and delays degeneration in the CNGB1(-/-) mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this work provides a proof-of-concept for the treatment of rod channelopathy-associated RP by AAV-mediated gene replacement"
    explanation: >-
      Establishes preclinical proof-of-concept for AAV-mediated CNGB1 gene
      replacement in the mouse model.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:29202463
    reference_title: Patients and animal models of CNGβ1-deficient retinitis pigmentosa support gene augmentation approach.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "gene augmentation using adeno-associated virus vectors robustly sustained the rescue of rod function and preserved retinal structure in the dog model"
    explanation: >-
      Sustained preclinical canine functional and structural benefit; human efficacy is not established by this experiment.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The promoter/capsid combination drives efficient expression of a reporter gene (AAV5-RHO-eGFP) exclusively in rod photoreceptors in primate, dog, and mouse following subretinal delivery."
    explanation: >-
      Reporter expression demonstrates rod targeting across species, including healthy primates, not therapeutic efficacy or full therapeutic-vector safety in primates.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:34376057
    reference_title: In Vivo Potency Testing of Subretinal rAAV5.hCNGB1 Gene Therapy in the Cngb1 Knockout Mouse Model of Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: increasing doses of rAAV5.hCNGB1 were delivered through single subretinal injection in 4-week-old Cngb1
    explanation: The 2021 study tests a human CNGB1 AAV5 construct in young knockout mice, separately from the 2012 species-matched proof of concept.
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The subretinal injections were generally well tolerated, and no adverse events noted in injected eyes except for one group 3 eye (17-010 OD).
    explanation: The exception developed inflammation and focal retinal/choroidal thinning; the efficacy findings do not establish uniformly safe treatment.
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Late treatment retinas exhibit continued, albeit slowed, loss of sensitivity and signal fidelity among retinal ganglion cells, as well as persistent gliosis.
    explanation: A conditional endogenous rescue experiment demonstrates disease-stage limitations, not adverse effects or efficacy of an AAV vector.
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: However, circular patches of retinal and choroidal thinning developed at the lower region of the ventral bleb
    explanation: The adverse-event results paragraph explicitly includes choroidal as well as retinal thinning in the inflamed dog eye.
- name: Genetic counseling
  therapeutic_modality: OTHER
  description: >-
    Counseling should interpret the familial pathogenic/likely pathogenic alleles and their phase, discuss testing of relatives and reproductive options, and explain autosomal recessive recurrence. When both parents carry the causal alleles, each pregnancy has a 25% chance of an affected child. Reported VUS do not establish a molecular diagnosis.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: At conception, each sib has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: General autosomal recessive RP counseling, applicable when both parents carry the established familial causal alleles.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Carrier testing for at-risk relatives requires prior identification of the RP- related pathogenic variants in the family.
    explanation: Family testing depends on the established molecular cause, rather than treating an uncertain variant as diagnostic.
- name: Low-vision rehabilitation
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Low-vision rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: Low-vision aids and individualized mobility, vocational and independent-living support address visual disability. This is general RP supportive care and does not restore the CNGB1 channel.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Low vision aids such as magnifiers and closed circuit television may provide useful reading vision for individuals with reduced central acuity and constricted visual fields.
    explanation: General RP guidance supports functional aids for central-acuity and field limitations.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: services include vocational training, mobility training, and skills for independent living.
    explanation: General RP guidance supports rehabilitation services.
- name: Carbonic anhydrase inhibition for cystoid macular edema
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
    - preferred_term: dorzolamide
      term:
        id: CHEBI:4702
        label: dorzolamide
  description: Oral acetazolamide or topical dorzolamide may be considered by the treating ophthalmologist for RP-associated cystoid macular edema; response is variable and rebound can occur. This is complication-directed general RP care, not proven modification of CNGB1 retinal degeneration.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Some therapeutic success has been reported with both systemic and topical carbonic anhydrase inhibitors ... however, rebound edema can occur with continued use
    explanation: General RP treatment synthesis; it is not a CNGB1-specific randomized trial.
- name: Cataract surgery when visually significant
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cataract Surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  description: Assess whether cataract contributes materially to visual impairment before considering extraction. Macular disease can limit visual improvement; RP increases the risk of postoperative inflammation and cystoid macular edema. Surgery treats the lens opacity, not the underlying channelopathy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Individuals with retinitis pigmentosa are at a greater-than-average risk for postoperative inflammation and induced CME.
    explanation: General RP perioperative considerations, not a CNGB1-specific comparative surgical trial.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: In the presence of macular disease, extraction of lenses when cataracts are in the early stage may not always improve the quality of vision
    explanation: General RP guidance emphasizes identifying the cause of visual impairment before intervention.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE

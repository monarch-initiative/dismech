- category: Neurological
  name: Hyposmia
  description: >-
    In the 2018 nine-patient series, five of eight patients tested with Sniffin’ Sticks met the study’s absolute-norm definition of hyposmia; two had anosmia and one borderline-low normosmia. A ninth patient tested with a different method had anosmia. Age-adjusted rankings and these absolute categories are not interchangeable. Six of the nine patients were unaware of reduced smell. This selected series does not provide population penetrance.

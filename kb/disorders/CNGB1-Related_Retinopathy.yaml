diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    An inherited-retinal-disease panel or genomic test can identify candidate CNGB1 variants. A molecular diagnosis requires biallelic pathogenic or likely pathogenic variants, with phase, segregation and copy-number assessment where needed. VUS findings or in-silico predictions alone do not establish the diagnosis. Apparent homozygosity may require evaluation for a deletion on the other allele.
  results: >-
    Biallelic pathogenic or likely pathogenic CNGB1 variants consistent with recessive inheritance support molecular confirmation; uncertain variants require further assessment.
  evidence:
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10 patients from 9 families underwent full ophthalmologic examination. Molecular investigations included whole-exome analysis in 6 patients."
    explanation: >-
      The clinical series used exome analysis in six patients. This documents a testing method, not a claim that every reported variant had definitive pathogenic classification.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Methods used in a panel may include sequence analysis, deletion/duplication analysis, and/or other non- sequencing-based tests.
    explanation: General RP molecular evaluation includes methods beyond coding SNV detection; coverage and diagnostic sensitivity vary between laboratories.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Dark- and light-adapted full-field ERG characterizes the severity of rod
    and cone dysfunction and typically shows non-recordable or severely
    attenuated scotopic responses even when visual acuity remains good.
  results: >-
    Scotopic (rod) responses are absent or severely attenuated; photopic
    (cone) responses range from normal to severely reduced depending on
    patient age and disease stage.
  evidence:
  - reference: PMID:33465333
    reference_title: Variable expressivity in patients with autosomal recessive retinitis pigmentosa associated with the gene CNGB1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological testing in five patients showed an absence of the rod response. Cone responses ranged from normal to severely reduced."
    explanation: >-
      Directly quantifies the electrophysiological diagnostic pattern.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    SD-OCT and fundus autofluorescence characterize preserved and diseased retinal regions. Ellipsoid-zone length and hyperautofluorescent ring area are candidate progression metrics for patients in whom those features can be measured. Their sensitivity, reproducibility and relationship to treatment benefit require prospective validation; neither is an established surrogate endpoint.
  results: >-
    In the 33-patient retrospective cohort, EZ length was measurable in 23 patients and constricted by a mean 178 ± 161 micrometers per year. Eight of 14 patients in a two-year simulation changed by more than 250 micrometers, the cited approximate interobserver variability. Hyperautofluorescent ring area was measurable in 17 patients; some had no ring and others had rings beyond the image. These selection limits prevent transferring the rates or sensitivity to every patient or disease stage.
  evidence:
  - reference: PMID:35743231
    reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ellipsoid zone (EZ) length was measurable in at least one eye of 23 patients"
    explanation: >-
      Establishes ellipsoid zone length as a measured structural biomarker
      used as a candidate imaging endpoint.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Ophthalmic surveillance
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  description: General RP guidance recommends annual dilated examination and perimetry, with closer review for active complications such as cystoid macular edema. OCT/FAF and functional assessments can follow CNGB1 disease progression, with interpretation adapted to the measurable retinal area and macular comorbidity.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: and a full ophthalmoscopic examination with dilation are performed on an annual basis, with more frequent follow up for active complications such as cystoid macular edema.
    explanation: General RP surveillance guidance applied to CNGB1-related disease; frequency is individualized for active complications.
progression:
- phase: Variable onset of rod dysfunction
  age_range: Childhood to adulthood
  notes: >-
    Night blindness commonly begins in childhood, but reported onset varied from ages 4 to 49 in one series. Retrospective symptom recognition, age at diagnosis and first measured field loss are different observations.
  evidence:
  - reference: PMID:28056120
    reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

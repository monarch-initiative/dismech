      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: As photoreceptor deterioration progresses, there is increasing loss of pigment from the pigment epithelium with intraretinal clumping of melanin
      explanation: General RP pathology links progressive photoreceptor deterioration with pigment migration/clumping; molecular intermediates are not identified.
- name: Secondary Cone Dysfunction and Degeneration
  description: Cone function and structure decline after the primary rod defect. Normal early cone ERGs followed by later degeneration in X26 mice, and preservation of cone responses after rod-directed rescue in dogs, support a secondary process. The molecular intermediates are unresolved. Central vision can remain useful for years, but severity and timing vary and macular complications also affect acuity.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cones were primarily unaffected and showed normal ERG responses up to 6 months, but they started to degenerate in later stages."
    explanation: >-
      Direct evidence in the mouse model that cone dysfunction and degeneration
      are delayed relative to rod loss.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Taken together, this analysis of cone ERG responses provides evidence of the preservation of cone function when rod rescue is achieved by gene augmentation therapy.
    explanation: Cone ERG modeling supports secondary preservation following rod-directed rescue in dogs; it does not prove normal cone physiology or human benefit.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  conforms_to: photoreceptor_degeneration#Secondary Cone Degeneration and Outer Retinal Thinning
  downstream:
  - target: Color vision defect
    description: Cone-system dysfunction contributes to impaired color discrimination; the clinical test does not distinguish cone loss from all other causes of reduced color performance.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

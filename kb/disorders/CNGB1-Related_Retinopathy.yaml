genetic:
- name: CNGB1
  gene_term:
    preferred_term: CNGB1
    term:
      id: hgnc:2151
      label: CNGB1
  association: Causative
  features: >-
    84 known disease-causing CNGB1 variants have been reported, spanning the
    entire gene with no known mutational hotspot: 24 missense, 21 nonsense, 19
    splicing defects, 10 small deletions, 1 small insertion, 1 small
    insertion-deletion, 7 small duplications, and 1 gross deletion. Variants are
    distributed across both the GARP (glutamic acid-rich protein) and channel
    domains, and no genotype-phenotype correlation has been established to
    date despite the large number of reported alleles.
  case_fractions:
  - population: Autosomal recessive retinitis pigmentosa cohorts
    case_fraction_percent: 4.0
    notes: >-
      Consistently reported across independent cohorts as accounting for
      approximately 4% of autosomal recessive RP.
    evidence:
    - reference: PMID:35743231
      reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic variants in CNGB1 are responsible for 4% of autosomal recessive retinitis pigmentosa (RP)."
      explanation: >-
        States the CNGB1 contribution to autosomal recessive RP directly.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:11379879
      reference_title: Segregation of a mutation in CNGB1 encoding the beta-subunit of the rod cGMP-gated channel in a family with autosomal recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The CNGB1 gene, which encodes the beta-subunit of the rod cGMP-gated channel, is mutated in the family presented in this study."
      explanation: >-
        Confirms autosomal recessive inheritance for CNGB1-related RP in the
        original gene-discovery family.
  evidence:
  - reference: PMID:20126465
    reference_title: "The retinitis pigmentosa mutation c.3444+1G>A in CNGB1 results in skipping of exon 32."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we investigated the splicing of c.3444+1G>A by exon trapping experiments and could demonstrate that instead of the proposed truncation of the last 28 aa this mutation leads to replacement of the last 170 aa of CNGB1a by 68 unrelated amino acids."
    explanation: >-
      Provides molecular mechanistic detail for a specific recurrent splice-site
      variant, confirming loss-of-function via aberrant splicing rather than a
      simple truncation as originally proposed.

animal_models:

      snippet: Color vision was abnormal in at least one eye of 9/17 patients (52.94%)
      explanation: The denominator is those assessed, not all 34 participants.
- name: Reactive Retinal Gliosis
  description: Reactive Müller-cell gliosis accompanies CNGB1-deficient mouse retinal degeneration. GFAP labeling decreases after effective early AAV augmentation but persists after late conditional endogenous rescue. GFAP is a stress-response readout; these experiments do not establish that gliosis alone drives ongoing cell loss.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we found that GFAP was present in both untreated and late-treated retinas at 7 M
    explanation: Persistent GFAP labeling after late endogenous rescue supports a sustained glial stress response in this conditional mouse model; it does not establish a causal inflammatory mediator.
  cell_types:
  - preferred_term: Mueller cell
    term:
      id: CL:0000636
      label: Mueller cell
- name: Photoreceptor Synaptic Ribbon Loss
  description: In the conditional Cngb1 mouse, late rescue leaves substantially reduced CtBP2-labeled photoreceptor ribbon structures despite surviving rods and cones. This identifies an anatomical limitation to recovery, without proving which circuit changes explain every functional deficit.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Following late treatment, CtBP2 horseshoe structures were substantially reduced
    explanation: CtBP2 immunolabeling showed loss of normal photoreceptor synaptic ribbon structures after late conditional rescue.
  downstream:
  - target: Impaired Retinal Ganglion Cell Signaling
    description: Loss of ribbon structures is a proposed contributor to impaired retinal output; the study did not isolate synapse loss as the sole cause.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Retinal Ganglion Cell Signaling
  description: After late conditional Cngb1 rescue, retinal ganglion cell responses have lower contrast gain and greater signal-dependent variability than after earlier rescue. Information transmission improves above untreated levels but fails to normalize and can decline over follow-up. These ex vivo mouse measurements are distinct from human visual acuity or an AAV clinical endpoint.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Early and mid-treatment brought the response variability back toward that of WT
    explanation: Multielectrode recordings show stage-dependent recovery of retinal ganglion cell response fidelity after conditional Cngb1 rescue.
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Late treatment also improved the information rate of the rod-mediated RGC signaling above baseline
    explanation: Late rescue retains measurable benefit without normalizing retinal output.
- name: Impaired Olfactory Signal Transduction
  description: CNGB1 encodes a signal-transduction subunit expressed in olfactory sensory neurons as well as rods. Olfactory testing in affected patients supports variable impairment consistent with an olfactory channel defect. The clinical studies do not demonstrate progressive olfactory-neuron death, and the single non-targeted MRI with nonvisible bulbs does not establish bulb agenesis.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:29800053
    reference_title: Olfactory Dysfunction in Patients With CNGB1-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: a gene coding for a signal transduction channel subunit expressed in rod photoreceptors and olfactory sensory neurons.
    explanation: Background establishes the shared expression context; this clinical study does not directly measure olfactory channel currents.
  - reference: PMID:29800053
    reference_title: Olfactory Dysfunction in Patients With CNGB1-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Olfactory testing revealed reduced or absent olfactory function
    explanation: Patient testing establishes impaired smell; attribution to defective olfactory channel signaling is mechanistic interpretation.
  downstream:
  - target: Hyposmia
    description: A shared olfactory CNG-channel defect is a proposed explanation for psychophysically measured smell loss; direct human neuronal channel measurements are lacking.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29800053
      reference_title: Olfactory Dysfunction in Patients With CNGB1-Associated Retinitis Pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: Mutations in CNGB1 may cause an autosomal recessive RP-olfactory dysfunction syndrome characterized by a slow progression of retinal degeneration and variable anosmia or hyposmia.
      explanation: The clinical authors propose the connection; this does not prove olfactory-neuron loss.
  - target: Anosmia
    description: A shared olfactory CNG-channel defect is a proposed explanation for psychophysically measured smell loss; direct human neuronal channel measurements are lacking.

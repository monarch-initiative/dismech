notes: >-
  CNGB1 is distinct from CNGA1-associated rod-cone dystrophy and CNGA3/CNGB3-associated achromatopsia. Findings from those genes must not be treated as direct CNGB1 variant evidence. Primary CNGB1 cohorts supply the disease-specific phenotype baseline; the general Nonsyndromic Retinitis Pigmentosa Overview can support broader diagnostic and management guidance.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    CNGB1-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) loss-of-function variants in CNGB1.
  evidence:
  - reference: PMID:11379879
    reference_title: Segregation of a mutation in CNGB1 encoding the beta-subunit of the rod cGMP-gated channel in a family with autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By performing full genome linkage analysis in a consanguineous French family affected with severe autosomal recessive RP, we have excluded linkage to known loci involved in RP and mapped a novel locus to chromosome 16q13-q21"
    explanation: >-
      This original gene-discovery paper establishes autosomal recessive
      inheritance for CNGB1-related retinitis pigmentosa via linkage in a
      consanguineous family.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
pathophysiology:
- name: Biallelic CNGB1 Dysfunction
  description: Biallelic pathogenic CNGB1 variants impair the rod channel beta subunit. Alleles include truncating, splice-site and missense changes, with effects that can differ in protein abundance, localization or gating. CNGB1a belongs to the rod CNGA1/CNGB1 channel; CNGB1b is an olfactory isoform. Not every reported variant is pathogenic and not every pathogenic allele eliminates the protein.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:33847019
    reference_title: 'CNGB1-related rod-cone dystrophy: A mutation review and update.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: According to the ACMG criteria, 59 variants were considered pathogenic or likely pathogenic and 25 variants were classified of uncertain significance
    explanation: Variant reclassification in the 2021 review distinguishes reported alleles from confirmed pathogenic or likely pathogenic variants.
  - reference: PMID:20126465
    reference_title: "The retinitis pigmentosa mutation c.3444+1G>A in CNGB1 results in skipping of exon 32."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we investigated the splicing of c.3444+1G>A by exon trapping experiments and could demonstrate that instead of the proposed truncation of the last 28 aa this mutation leads to replacement of the last 170 aa of CNGB1a by 68 unrelated amino acids."
    explanation: >-
      Exon trapping in HEK293T cells demonstrates exon-32 skipping for c.3444+1G>A, replacing the last 170 residues with 68 unrelated residues. This is a variant-specific assay, not patient-rod transcript analysis.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
  role: trigger
  gene:
    preferred_term: CNGB1
    term:
      id: hgnc:2151
      label: CNGB1
    modifier: DECREASED
  conforms_to: phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect
  downstream:
  - target: Reduced Rod Outer-Segment CNG Channel Abundance
    description: Loss of CNGB1 in mouse and dog models depletes outer-segment partner CNGA1; rescue restores its localization. Allele-specific channel-gating defects need not share this abundance mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Olfactory Signal Transduction
    description: CNGB1 also encodes an olfactory channel subunit; impaired olfactory signaling is a plausible basis for the variable smell dysfunction observed in human cohorts.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Variant-Specific CNGB1 Protein Instability
    description: A specific splice-site allele produces an unstable mutant protein in a heterologous assay; the effect is not assigned to all CNGB1 alleles.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Variant-Specific CNGB1 Protein Instability
  description: For c.3444+1G>A, exon-32 skipping replaces the terminal 170 amino acids with 68 unrelated residues. The engineered full-length mutant showed reduced abundance in HEK293T cells, reversible with proteasome inhibitors. This allele-specific instability may contribute to channel deficiency; NMD and altered targeting in patient rods were proposed rather than measured.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:20126465
    reference_title: The retinitis pigmentosa mutation c.3444+1G>A in CNGB1 results in skipping of exon 32.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: When expressed in a heterologous expression system the corresponding mutant full-length CNGB1a subunit was more susceptible to proteosomal degradation compared to the wild-type counterpart.
    explanation: The exon-32-skipped mutant is less stable in a heterologous expression system; the full-text experiment used HEK293T cells coexpressing CNGA1. This does not establish NMD or channel trafficking in patient rods.
  - reference: PMID:20126465
    reference_title: The retinitis pigmentosa mutation c.3444+1G>A in CNGB1 results in skipping of exon 32.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Since this difference in expression could be reversed by the addition of proteasome inhibitors, we concluded that the mutant protein is partially degraded by the proteasome
    explanation: Proteasome inhibitor rescue supports a degradation contribution in the heterologous cell experiment.
  downstream:
  - target: Reduced Rod Outer-Segment CNG Channel Abundance
    description: Instability could reduce channel availability in rods; that tissue-level consequence was not directly measured in the HEK293T assay.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Rod Outer-Segment CNG Channel Abundance
  description: In CNGB1-deficient mouse rods, outer-segment CNGA1 is markedly depleted. CNGB1 augmentation restores CNGA1 abundance and outer-segment localization in mice and dogs. These findings support defective channel assembly/targeting or stability without assigning the same lesion to every human missense allele.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In the absence of CNGB1, only trace amounts of the CNGA1 subunit were found on the rod outer segment.
    explanation: CNGB1-deficient mouse rods have markedly depleted outer-segment CNGA1.
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In the treated region, but not the untreated, CNGA1 protein was detectable in rod outer segments
    explanation: Human CNGB1 augmentation restores canine partner-subunit localization within the treated region.
  cell_types:

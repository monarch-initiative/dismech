name: CNGB1-Related Retinopathy
creation_date: "2026-08-25T00:00:00Z"
category: Mendelian
description: >-
  CNGB1-related retinopathy is an autosomal recessive rod-cone dystrophy, historically retinitis pigmentosa 45. Biallelic pathogenic variants affect the beta subunit of the rod cyclic nucleotide-gated channel. Rod dysfunction commonly precedes extensive photoreceptor loss. Night blindness often begins in childhood, but reported symptom onset and disease severity vary, and one series reported onset between ages 4 and 49 years. Central visual acuity and foveal structure may remain useful into adulthood, while some patients develop severe visual loss. These observations suggest an opportunity for intervention but do not establish a universal treatment window or a human gene-therapy benefit.

  CNGB1 also encodes an olfactory-channel isoform. Formal testing has identified hyposmia or anosmia in selected patients, many of whom had not noticed impaired smell. Neither olfactory penetrance nor a reliable variant-specific retinal or olfactory prognosis has been established. Cystoid macular edema, epiretinal membranes and cataract can accompany the retinal disease and affect clinical measurements. Animal gene-augmentation studies provide preclinical evidence that restoring CNGB1 can improve rod function and preserve retinal structure.
disease_term:
  preferred_term: CNGB1-related retinopathy
  term:

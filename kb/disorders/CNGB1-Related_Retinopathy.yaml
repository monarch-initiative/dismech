discussions:
- discussion_id: cngb1_rescue_stage_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Which structural and functional features identify a rescuable human CNGB1 retina?
  attaches_to:
  - animal_models#Conditional Cngb1 rescue mouse
  - treatments#AAV-Mediated CNGB1 Gene Augmentation Therapy
  rationale: Conditional endogenous rescue bypasses vector transduction and expression variability. Late-treated mice retain some benefit but do not regain normal retinal output, and mice lack a macula. Human OCT preservation alone therefore does not establish an intervention window or justify transferring model-specific rod-loss thresholds into eligibility criteria.
  evidence:
  - reference: PMID:38086857
    reference_title: Late gene therapy limits the restoration of retinal function in a mouse model of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Mouse retina lacks a cone-dense region and is (at best) more analogous to human peripheral retina
    explanation: The study explicitly limits translation of its rescue-stage results to human central retina.
- discussion_id: cngb1_cgmp_death_intermediates
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which intermediates link channel deficiency and cGMP accumulation to progressive rod death in CNGB1 disease?
  attaches_to:
  - pathophysiology#Rod cGMP Accumulation
  - pathophysiology#Progressive Rod Photoreceptor Loss
  rationale: Channel-deficient model rods accumulate cGMP, and CNGB1 restoration reduces the staining while improving function. Those rescue experiments correct multiple consequences simultaneously and do not isolate cGMP as the death effector. Calcium overload and a specific downstream death pathway should not be inferred from cGMP immunoreactivity alone.
  evidence:
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: A feature of lack of CNG channel function in rod outer segments is the abnormal accumulation of cGMP. IHC showed that this was reversed within the treated retinal regions
    explanation: In the cGMP-accumulation results section, immunohistochemistry showed reversal of abnormal cGMP staining in treated dog retina, with staining retained outside the treated regions. This is not a direct channel-current measurement.

  conforms_to: phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery
  downstream:
  - target: Rod cGMP Accumulation
    description: Channel-deficient mouse and dog rods accumulate cGMP; restoring CNGB1 reduces staining. Reduced calcium-dependent feedback on guanylate cyclase is a mechanistic interpretation, not a calcium measurement in these rescue studies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Progressive Rod Photoreceptor Loss
    description: Rod dysfunction precedes progressive rod loss in CNGB1-deficient models; the critical intermediates connecting channel loss to death are incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nyctalopia
    description: Reduced rod-mediated sensitivity impairs vision under dim illumination.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
      reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: In RP , loss of rod function predominates early in the clinical course. The initial symptom of RP is usually defective dark adaptation
      explanation: General RP physiology connects early rod dysfunction with night blindness; disease-specific cohorts establish the CNGB1 manifestation.
- name: Rod cGMP Accumulation
  description: Abnormal cGMP immunoreactivity occurs in inner and outer segments of CNGB1-deficient mouse and dog photoreceptors and decreases in successfully treated retinal regions. Loss of calcium entry and its negative feedback on guanylate cyclase is proposed to explain accumulation. These observations do not establish calcium overload or directly identify the death-effector pathway.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:37056049
    reference_title: Development of a translatable gene augmentation therapy for CNGB1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: A feature of lack of CNG channel function in rod outer segments is the abnormal accumulation of cGMP. IHC showed that this was reversed within the treated retinal regions
    explanation: In the cGMP-accumulation results section, immunohistochemistry showed reversal of abnormal cGMP staining in treated dog retina, with staining retained outside the treated regions. This is not a direct channel-current measurement.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
- name: Progressive Rod Photoreceptor Loss
  description: Rod photoreceptors are progressively lost following early functional impairment. Apoptotic death was demonstrated in the X26 mouse; human imaging documents structural decline without identifying an identical death program for every allele. Disease tempo differs among models and patients.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:15634774
    reference_title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGB1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The rods also showed a slow-progressing degeneration caused by apoptotic death and concurred by retinal gliosis.
    explanation: The X26 knockout shows progressive apoptotic rod loss and associated gliosis. This does not establish the same death pathway in every human allele.
  - reference: PMID:35743231
    reference_title: "The Natural History of CNGB1-Related Retinopathy: A Longitudinal Phenotypic Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results support previous findings of CNGB1-related RP being a slowly progressive disease with patients maintaining visual acuity."
    explanation: >-
      States the natural-history cohort's overall conclusion of slow,
      measurable progression with maintained visual acuity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Secondary Cone Dysfunction and Degeneration
    description: Cone dysfunction and loss occur later than rod loss in mouse and dog models; the non-cell-autonomous intermediates remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reactive Retinal Gliosis
    description: Progressive retinal degeneration is accompanied by reactive glial labeling in mouse models.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Photoreceptor Synaptic Ribbon Loss
    description: Advanced degeneration in the conditional mouse is associated with loss of photoreceptor synaptic ribbon structures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Constriction of peripheral visual field
    description: Progressive peripheral photoreceptor degeneration contributes to field constriction; symptom recognition can lag objective field loss.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28056120
      reference_title: Clinical Characterization of CNGB1-Related Autosomal Recessive Retinitis Pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The first clinical presentation was with nyctalopia in childhood with visual field loss documented later at a mean (SD) age of 33.2 (8.0) years."
      explanation: >-
        The clinical course includes later recognized field constriction; attributing it to progressive peripheral photoreceptor loss is a mechanistic interpretation, not an experimental causal test.
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
  - target: Pigmentary retinopathy
    description: Photoreceptor degeneration is associated with progressive retinal pigment redistribution; this does not imply that rod apoptosis directly causes each pigment deposit.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1417/pdf/Bookshelf_NBK1417.pdf

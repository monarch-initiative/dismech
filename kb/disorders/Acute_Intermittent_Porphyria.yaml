- name: Porphyria-associated tubulointerstitial kidney injury
  description: >-
    Symptomatic AIP is associated with a chronic tubulointerstitial nephropathy
    and progressive loss of kidney function. Precursor toxicity to proximal
    tubular cells is experimentally supported, while vascular injury,
    hypertension, and other contributors prevent assignment of a single proven
    human mechanism.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  chemical_entities:
  - preferred_term: 5-aminolevulinic acid
    term:
      id: CHEBI:17549
      label: 5-aminolevulinic acid
    modifier: INCREASED
  - preferred_term: porphobilinogen
    term:
      id: CHEBI:17381
      label: porphobilinogen
    modifier: INCREASED
  evidence:
  - reference: PMID:25830761
    reference_title: "High prevalence of and potential mechanisms for chronic kidney disease in patients with acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The renal pathology was a chronic tubulointerstitial nephropathy,
      associated with a fibrous intimal hyperplasia and focal cortical atrophy.
    explanation: >-
      AIP patient pathology directly establishes the characteristic chronic
      tubulointerstitial and vascular injury pattern.
  - reference: PMID:34943561
    reference_title: "Kidney Involvement in Acute Hepatic Porphyrias: Pathophysiology and Diagnostic Implications."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Given the relevant role of the kidney in porphyrin metabolism, the
      mechanisms possibly intervening in causing renal damage in AHPs are
      different: among others, δ-aminolevulinic acid (ALA)-induced oxidative
      damage on mitochondria, intracellular toxic aggregation of porphyrins in
      proximal tubular cells, and derangements in the delicate microcirculatory
      balances of the kidney might be implicated.
    explanation: >-
      This review supports a multifactorial interpretation and cautions against
      reducing porphyria-associated kidney disease to one pathway.
  downstream:
  - target: Chronic kidney disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic tubulointerstitial nephropathy with progressive decline in glomerular filtration
    description: >-
      Persistent tubulointerstitial and vascular kidney injury can produce
      chronic loss of filtration in symptomatic AIP.
    evidence:
    - reference: PMID:25830761
      reference_title: "High prevalence of and potential mechanisms for chronic kidney disease in patients with acute intermittent porphyria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Chronic kidney disease occurred in up to 59% of the symptomatic AIP
        patients, with a decline in the glomerular filtration rate of ~1 ml/min
        per 1.73 m(2) annually.
      explanation: >-
        Longitudinal human data connect symptomatic AIP kidney injury with
        chronic decline in filtration.

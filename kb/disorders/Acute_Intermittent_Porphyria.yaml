datasets:
- accession: geo:GSE146212
  title: Severe hydroxymethylbilane synthase deficiency causes depression-like behavior and mitochondrial dysfunction in a mouse model of homozygous dominant acute intermittent porphyria
  description: Acute intermittent porphyria (AIP) is an autosomal dominant inborn error of heme biosynthesis due to a pathogenic mutation in the Hmbs gene, resulting in half-normal activity of hydroxymethylbilane synthase. Factors that induce hepatic heme biosynthesis induce episodic attacks in heterozygous patients. The clinical presentation of acute attacks involves the signature neurovisceral pain and may include psychiatric symptoms. Here we used a knock-in mouse line that is biallelic for the Hmbs c.500G>A (p.R167Q) mutation with ~5% of normal hydroxymethylbilane synthase activity to unravel the consequences of severe HMBS deficiency on affective behavior and brain physiology.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 12
  publication: PMID:32197664
  notes: Identified by GEO DataSets index search for Acute Intermittent Porphyria (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

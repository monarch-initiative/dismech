environmental:
- name: Porphyrogenic attack triggers
  effect: TRIGGERS
  notes: >-
    Drugs, alcohol, low caloric intake or fasting, and infections can precipitate
    acute attacks by increasing hepatic pathway demand and inducing the
    triggered hepatic ALAS1 event represented in the pathophysiology graph.
  evidence:
  - reference: PMID:9516674
    reference_title: "Acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These symptoms occur during acute attacks, which are often precipitated
      by drugs, alcohol, low caloric intake, or infections.
    explanation: >-
      This review directly names the common environmental and physiologic
      triggers that precipitate AIP attacks.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with AIP are advised to avoid excessive alcohol consumption,
      as alcohol upregulates the enzyme ALAS1, the first enzyme of hepatic heme
      biosynthesis, and thus could be a trigger for acute attacks.
    explanation: >-
      GeneReviews directly connects a preventable exposure to ALAS1 induction
      and acute-attack triggering.
treatments:
- name: Trigger avoidance and adequate nutrition
  description: >-
    Preventive care includes avoiding excessive alcohol and porphyrogenic drugs,
    maintaining adequate regular nutrition, and treating systemic illness or
    infection promptly. These measures reduce exposure to known inducers rather
    than correcting the inherited HMBS defect.
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Triggered hepatic ALAS1 induction
    treatment_effect: INHIBITS
    description: >-
      Avoiding excessive alcohol, fasting, and porphyrogenic drugs reduces
      exposure to factors supported to upregulate or dysregulate hepatic ALAS1.
      Adequate nutrition and timely illness treatment remain clinically
      supported prevention measures without assigning infection the same direct
      ALAS1 evidence.
    evidence:
    - reference: PMID:20301372
      reference_title: "Acute Intermittent Porphyria."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Individuals with AIP are advised to avoid excessive alcohol consumption,
        as alcohol upregulates the enzyme ALAS1, the first enzyme of hepatic heme
        biosynthesis, and thus could be a trigger for acute attacks.
      explanation: >-
        GeneReviews directly supports prevention of an exposure that induces
        the modeled ALAS1 trigger event.
    - reference: PMID:16122419
      reference_title: "Nutritional regulation of hepatic heme biosynthesis and porphyria through PGC-1alpha."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The induction of ALAS-1 by fasting is lost in liver-specific PGC-1alpha
        knockout animals, as is the ability of porphyrogenic drugs to
        dysregulate heme biosynthesis.
      explanation: >-
        Mouse data connect fasting and porphyrogenic drugs to ALAS1 regulation;
        PARTIAL preserves the boundary between this mechanism and preventive
        efficacy in human AIP.
  evidence:
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To reduce the frequency and/or severity of acute attacks, maintain
      adequate nutrition and seek timely treatment of systemic illness or
      infection.
    explanation: >-
      GeneReviews directly recommends nutrition and timely illness treatment
      as attack-prevention measures.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with AIP are advised to avoid excessive alcohol consumption,
      as alcohol upregulates the enzyme ALAS1, the first enzyme of hepatic heme
      biosynthesis, and thus could be a trigger for acute attacks.
    explanation: >-
      GeneReviews supports excessive-alcohol avoidance as a mechanism-linked
      preventive measure.
- name: Intravenous hemin
  description: >-
    Standard treatment for severe acute attacks; exogenous hemin represses
    hepatic ALAS1 and is more effective than glucose alone in serious attacks.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hemin
      term:
        id: CHEBI:50385
        label: hemin
  target_mechanisms:
  - target: Triggered hepatic ALAS1 induction
    treatment_effect: INHIBITS
    description: >-
      Hemin represses hepatic ALAS1 during acute attacks.
    evidence:
    - reference: PMID:29498764
      reference_title: "Recurrent attacks of acute hepatic porphyria: major role of the chronic inflammatory response in the liver."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        So far, the treatment of choice is hemin which represses ALAS1.
      explanation: >-
        This directly links hemin therapy to repression of the induced hepatic
        ALAS1 node.
  - target: Hepatic ALA and PBG accumulation
    treatment_effect: INHIBITS
    description: >-
      By repressing ALAS1, hemin lowers the precursor burden during more severe
      attacks.
    evidence:
    - reference: PMID:19327613
      reference_title: "Plasma porphobilinogen as a sensitive biomarker to monitor the clinical and therapeutic course of acute intermittent porphyria attacks."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glucose administration, in contrast to heme therapy, was not sufficient
        to achieve clinical and biochemical remission in the more serious
        attacks.
      explanation: >-
        This supports heme therapy as the more effective way to reverse the
        acute biochemical lesion in serious AIP attacks.
  evidence:
  - reference: PMID:19327613
    reference_title: "Plasma porphobilinogen as a sensitive biomarker to monitor the clinical and therapeutic course of acute intermittent porphyria attacks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is based on symptomatic relief together with carbohydrate
      loading and in more severe attacks heme therapy.
    explanation: >-
      This study describes heme therapy as the escalation treatment for more
      severe acute attacks.
  - reference: PMID:33786855
    reference_title: "Porphyric neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Timely treatment with intravenous heme, carbohydrate loading, and
      avoidance of porphyrinogenic medications can prevent further neurological
      morbidity and mortality.
    explanation: >-
      This review supports intravenous heme as clinically important for limiting
      neurologic morbidity during porphyric attacks.
- name: Givosiran
  description: >-
    Liver-directed siRNA prophylaxis that lowers ALAS1, reduces ALA and PBG,
    and markedly decreases recurrent attack burden.
  therapeutic_modality: SIRNA
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: givosiran
      term:
        id: NCIT:C146805
        label: Givosiran
  target_mechanisms:
  - target: Triggered hepatic ALAS1 induction
    treatment_effect: INHIBITS
    description: >-
      Givosiran suppresses hepatic ALAS1 expression as mechanism-directed
      prophylaxis.
    evidence:
    - reference: PMID:35067977
      reference_title: "RNAi therapy with givosiran significantly reduces attack rates in acute intermittent porphyria."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The results of clinical trials have shown that givosiran treatment
        leads to a rapid and sustained reduction of ALAS1 mRNA, decreased heme
        precursor levels, and a decreased rate of acute attacks compared with
        placebo.
      explanation: >-
        This directly supports ALAS1 silencing as the intended upstream
        mechanism of givosiran.
  - target: Hepatic ALA and PBG accumulation
    treatment_effect: INHIBITS
    description: >-
      Givosiran lowers urinary ALA and PBG toward normal by suppressing hepatic
      precursor production.
    evidence:
    - reference: PMID:31994716
      reference_title: "Pharmacokinetics and Pharmacodynamics of the Small Interfering Ribonucleic Acid, Givosiran, in Patients With Acute Hepatic Porphyria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Givosiran treatment resulted in a rapid and dose-dependent reduction in
        urinary aminolevulinic acid (ALA) and porphobilinogen (PBG) towards the
        upper limit of normal (ULN) in AHP patients.
      explanation: >-
        This phase I study provides direct biochemical evidence that givosiran
        suppresses the precursor burden.
  evidence:
  - reference: PMID:32521132
    reference_title: "Phase 3 Trial of RNAi Therapeutic Givosiran for Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 89 patients with acute intermittent porphyria, the mean
      annualized attack rate was 3.2 in the givosiran group and 12.5 in the
      placebo group, representing a 74% lower rate in the givosiran group
      (P<0.001); the results were similar among the 94 patients with acute
      hepatic porphyria.
    explanation: >-
      The pivotal randomized trial provides AIP-specific efficacy evidence.
  - reference: PMID:32521132
    reference_title: "Phase 3 Trial of RNAi Therapeutic Givosiran for Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The increased efficacy was accompanied by a higher frequency of hepatic
      and renal adverse events.
    explanation: >-
      The AIP-specific trial also establishes the clinically important hepatic
      and renal safety signal.
  - reference: PMID:37479139
    reference_title: "Efficacy and safety of givosiran for acute hepatic porphyria: Final results of the randomized phase III ENVISION trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These final 36-month results of ENVISION, a phase III study of givosiran
      in patients with AHP and recurrent attacks, show that long-term monthly
      treatment with givosiran leads to continuous and sustained reductions in
      annualized attack rate and use of hemin over time, as well as improved
      quality of life, with an acceptable safety profile.
    explanation: >-
      Long-term phase III and open-label-extension evidence supports givosiran
      as effective mechanism-directed long-term prophylaxis for recurrent
      attacks.
- name: Prophylactic hemin infusion
  description: >-
    Scheduled hemin infusion is an alternative prophylactic therapy to reduce
    frequency or severity of recurrent acute attacks when givosiran is not
    available. Long-term use is limited by iron overload, phlebitis, loss of
    venous access, and evidence that frequent infusions can promote chronic
    hepatic inflammation and recurrent ALAS1 elevation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hemin
      term:
        id: CHEBI:50385
        label: hemin
  target_mechanisms:
  - target: Triggered hepatic ALAS1 induction
    treatment_effect: INHIBITS
    description: >-
      Hemin can repress ALAS1, but frequent prophylactic exposure is not modeled
      as simple sustained inhibition because hepatic inflammation and HO1
      induction may maintain elevated ALAS1 between treatments.
    evidence:
    - reference: PMID:29498764
      reference_title: "Recurrent attacks of acute hepatic porphyria: major role of the chronic inflammatory response in the liver."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        So far, the treatment of choice is hemin which represses ALAS1.
      explanation: >-
        This supports the negative-feedback mechanism, with PARTIAL support
        because the same study reports a countervailing effect of frequent
        infusions.
  evidence:
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alternative medical therapies to reduce frequency and/or severity of acute
      attacks when givosiran is not available include suppression of ovulation
      and prophylactic hemin infusion.
    explanation: >-
      GeneReviews supports prophylactic hemin infusion as an alternative
      preventive therapy when givosiran is unavailable.
  - reference: PMID:26366103
    reference_title: "An update of clinical management of acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      management of patients with recurrent attacks: 1) evaluation of the
      lifestyle, 2) evaluation of hormonal therapy in women, 3) prophylactic heme
      therapy, and 4) liver transplantation in patients with severe recurrent
      attacks.
    explanation: >-
      A clinical management review independently lists prophylactic heme therapy
      for patients with recurrent attacks.
  - reference: PMID:29498764
    reference_title: "Recurrent attacks of acute hepatic porphyria: major role of the chronic inflammatory response in the liver."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      both in animal model and in human liver, frequent hemin infusions generate
      a chronic inflammatory hepatic disease which induces HO1 remotely to hemin
      treatment and maintains a high ALAS1 level responsible for recurrence.
    explanation: >-
      Mixed human-liver and animal evidence supplies the countervailing chronic
      inflammation and recurrent-ALAS1 caveat.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the criteria for recurrent attacks are met, Givlaari® (givosiran)
      should be considered, as long-term complications of hemin such as iron
      overload, phlebitis, and loss of venous access can be avoided.
    explanation: >-
      GeneReviews identifies the principal access and iron-related limitations
      of repeated hemin therapy.

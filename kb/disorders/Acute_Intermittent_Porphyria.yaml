discussions:
- discussion_id: unresolved_precursor_neurotoxicity_route
  prompt: >-
    Which precursor species and molecular pathway connect hepatic precursor
    overproduction to the autonomic, peripheral-neuropathic, and central
    manifestations of classic heterozygous AIP attacks?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic ALA and PBG accumulation
  - pathophysiology#Neurovisceral attack susceptibility
  rationale: >-
    Clinical interventions support precursor burden as causally important, but
    GABA-A interference, oxidative injury, mitochondrial dysfunction, and
    vascular effects remain candidate routes. Low adult blood-brain-barrier
    permeability also argues against treating severe homozygous CNS disease as
    a simple explanation for classic attacks.
  evidence:
  - reference: PMID:11478735
    reference_title: "5-Aminolevulinic acid inhibits [3H]muscimol binding to human and rat brain synaptic membranes."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "ALA (0.1-10 mM) significantly inhibited the binding"
    explanation: >-
      This supplies one plausible molecular interaction, qualified by the in
      vitro concentration range.
  - reference: PMID:12493610
    reference_title: "Transport of 5-aminolevulinic acid between blood and brain."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "uptake into the neonatal brain was 7-fold higher than in the adult"
    explanation: >-
      Rat transport data identify an age-dependent blood-brain-barrier boundary
      rather than resolving classic adult human neurotoxicity.
- discussion_id: classic_and_homozygous_aip_model_boundaries
  prompt: >-
    How should findings from phenobarbital-induced T1/T2 mice and severe
    homozygous R167Q mice be translated to low-penetrance heterozygous human AIP?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#HMBS deficiency in hepatocytes
  - pathophysiology#Neurovisceral attack susceptibility
  rationale: >-
    The classic mouse requires pharmacologic induction and develops progressive
    neuropathy under repeated challenge, whereas the homozygous model has about
    5% residual activity and early CNS-intrinsic disease. Each addresses a
    different mechanism boundary and neither reproduces the complete natural
    history of classic heterozygous AIP.
  evidence:
  - reference: PMID:20877347
    reference_title: "Sustained enzymatic correction by rAAV-mediated liver gene therapy protects against induced motor neuropathy in acute porphyria mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Phenobarbital injections in AIP mice induced porphyrin precursor
      accumulation, functional block of nerve conduction, and progressive loss
      of large-caliber axons in the sciatic nerve.
    explanation: >-
      The classic model is explicitly challenge-induced and therefore does not
      reproduce spontaneous human disease expression.
  - reference: PMID:30615115
    reference_title: "Homozygous hydroxymethylbilane synthase knock-in mice provide pathogenic insights into the severe neurological impairments present in human homozygous dominant acute intermittent porphyria."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Human AIP heterozygotes have episodic acute neurovisceral attacks that
      typically start after puberty, whereas patients with homozygous dominant
      AIP (HD-AIP) have early-onset chronic neurological impairment, including
      ataxia and psychomotor retardation.
    explanation: >-
      The paper itself states the human phenotype boundary that limits direct
      extrapolation from the severe homozygous model.

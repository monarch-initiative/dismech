    reference_title: "Hepatocellular Carcinoma in Acute Hepatic Porphyria: A Meta-Analysis of Observational Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCC cases were observed with HCC incidence per 100 person years of 0.3
      (0.2-0.5) in AHP, 0.4 (0.2-0.6) in AIP, 0.3 (0-0.4) in VP, and 0.2
      (0.1-0.6) in HCP.
    explanation: >-
      The meta-analysis directly reports the AIP-specific incidence estimate;

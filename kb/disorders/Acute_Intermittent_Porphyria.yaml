name: Acute Intermittent Porphyria
creation_date: '2026-04-21T04:42:02Z'
category: Mendelian
synonyms:
- AIP
description: >-
  Acute intermittent porphyria (AIP) is a low-penetrance autosomal dominant
  acute hepatic porphyria caused by partial deficiency of
  hydroxymethylbilane synthase (HMBS), the third enzyme in heme biosynthesis.
  Most heterozygous carriers remain asymptomatic. In susceptible carriers,
  porphyrogenic triggers such as drugs, fasting, alcohol, infection, and
  hormonal change induce hepatic ALAS1, driving excess production of
  5-aminolevulinic acid (ALA) and porphobilinogen (PBG) upstream of the HMBS
  block. Clinically manifest AIP produces episodic abdominal pain and other
  neurovisceral manifestations; a single severe attack can include
  motor-predominant neuropathy. Long-term risks include chronic kidney disease,
  hypertension, and primary liver cancer and are not restricted to people with
  frequent recurrent attacks. Intravenous hemin remains standard therapy for
  severe attacks, and givosiran provides mechanism-directed prophylaxis for
  recurrent attacks.
disease_term:
  preferred_term: acute intermittent porphyria
  term:
    id: MONDO:0008294
    label: acute intermittent porphyria
parents:
- Metabolic Disease

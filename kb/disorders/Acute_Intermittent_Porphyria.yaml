inheritance:
- name: Autosomal dominant
  description: >-
    AIP is inherited as an autosomal dominant disorder with low clinical
    penetrance. Clinical expression is strongly modified by genetic and
    environmental factors; an oligogenic model has been proposed but is not
    established as a replacement for autosomal dominant inheritance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:9516674
    reference_title: "Acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute intermittent porphyria (AIP) is transmitted as an autosomal
      dominant disorder with incomplete penetrance.
    explanation: >-
      This review directly states the inheritance pattern and incomplete
      penetrance of AIP.
  - reference: PMID:29360981
    reference_title: "From a dominant to an oligogenic model of inheritance with environmental modifiers in acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance was estimated at 22.9% in families with AIP, but at only 0.5-1%
      in the general population.
    explanation: >-
      Family and population estimates directly demonstrate incomplete and
      ascertainment-dependent penetrance; a single penetrance percentage would
      therefore be misleading.
  - reference: PMID:29360981
    reference_title: "From a dominant to an oligogenic model of inheritance with environmental modifiers in acute intermittent porphyria."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An oligogenic inheritance model with environmental modifiers might better
      explain AIP penetrance and heritability.
    explanation: >-
      The authors proposed, rather than established, an oligogenic explanation
      for the marked variability in clinical expression.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with an HMBS pathogenic variant has a 50%
      chance of inheriting the pathogenic variant.
    explanation: >-
      GeneReviews provides the autosomal-dominant transmission risk used in
      genetic counseling; inheritance of the variant does not predict clinical
      expression because penetrance is low.
prevalence:
- population: Asymptomatic heterozygous carriers in population studies
  measure_type: CARRIER_FREQUENCY
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 50.0
  notes: >-
    Molecular carrier prevalence is substantially higher than overt clinical
    disease prevalence because penetrance is low.
  evidence:
  - reference: PMID:9516674
    reference_title: "Acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent population studies suggest that the prevalence of asymptomatic
      heterozygotes for a mutant AIP gene may be in the range of 1 in 2,000.
    explanation: >-
      This review provides a population-level estimate for asymptomatic HMBS
      mutation carriers and highlights the disease's incomplete penetrance.
- population: Clinically symptomatic acute intermittent porphyria
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  notes: Estimated prevalence of patients with symptomatic AIP.
  evidence:
  - reference: PMID:36642627
    reference_title: "AGA Clinical Practice Update on Diagnosis and Management of Acute Hepatic Porphyrias: Expert Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acute intermittent porphyria is the most common type of AHP, with an estimated prevalence of patients with symptoms of approximately 1 in 100,000."
    explanation: The expert review distinguishes clinically symptomatic AIP prevalence from the much higher HMBS carrier frequency.
progression:
- phase: Latent or asymptomatic carrier state
  notes: >-
    Most people heterozygous for a pathogenic HMBS variant never develop an
    acute attack. This is a clinical category, not an obligatory first step in
    a linear progression sequence.
  evidence:
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Latent (inactive) AIP: Urine PBG-to-creatinine ratio <4 times ULN and no
      acute porphyria-related manifestations to date.
    explanation: GeneReviews defines latent AIP as an attack-free carrier state.
- phase: Episodic active acute intermittent porphyria
  age_range: Usually begins in the second or third decade
  duration: Individual attacks and recovery vary from days to months
  notes: >-
    Susceptible carriers can experience trigger-associated acute neurovisceral
    attacks separated by non-attack intervals; attack occurrence and recovery
    are highly variable.
  evidence:
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The course of acute porphyria attacks is highly variable in an individual
      and between individuals.
    explanation: GeneReviews supports the episodic and individually variable course.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Onset of acute attacks typically occurs in the second or third decade of
      life.
    explanation: GeneReviews directly supports the usual age range for attack onset.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recovery from acute porphyria attacks may occur within days; however,
      recovery from severe attacks that are not promptly recognized and treated
      may take weeks or months.
    explanation: >-
      GeneReviews directly supports the stated range from rapid recovery to a
      prolonged course after severe, delayed-treatment attacks.
- phase: Sporadic, recurrent, or chronically symptomatic AIP
  notes: >-
    Some clinically manifest patients have sporadic or recurrent attacks, and
    chronic symptoms may persist between attacks even when attack frequency is
    low. These states are not experienced by every carrier.
  evidence:
  - reference: PMID:33639982
    reference_title: "Health impact of acute intermittent porphyria in latent and non-recurrent attacks patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AIP remains a chronically symptomatic disease that adversely affects
      health and quality of life, even in patients with low rate of acute
      attacks.
    explanation: >-
      This AIP cohort documents clinically important chronic disease outside a
      simple recurrent-attack model.
- phase: Long-term complication risk
  notes: >-
    Clinically manifest AIP carries long-term risks that include chronic kidney
    disease, hypertension, and hepatocellular carcinoma; these are surveillance
    concerns rather than inevitable outcomes.
  evidence:
  - reference: PMID:36642627
    reference_title: "AGA Clinical Practice Update on Diagnosis and Management of Acute Hepatic Porphyrias: Expert Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients should be counseled on the chronic and long-term complications of
      AHP, including neuropathy, chronic kidney disease, hypertension, and
      hepatocellular carcinoma, and need for long-term monitoring.
    explanation: >-
      This expert review identifies the major long-term complications that
      require monitoring, while applying them across the acute hepatic
      porphyrias rather than asserting that every AIP carrier develops them.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_hepatic_precursor_overproduction_model
  hypothesis_label: Canonical Hepatic Precursor Overproduction Model
  status: CANONICAL
  description: >-
    Partial HMBS deficiency becomes clinically pathogenic when hepatic ALAS1 is
    induced, leading to excess upstream precursor synthesis and export.
  notes: >-
    HMBS deficiency and trigger-driven ALAS1 induction are parallel
    prerequisites for clinically important precursor accumulation: the HMBS
    defect does not itself induce ALAS1. Human intervention data support the
    hepatic precursor-overproduction model, but penetrance, mouse-only hepatic
    energetic effects, and liver-cancer associations are modeled separately.
  evidence:
  - reference: PMID:9516674
    reference_title: "Acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biochemical abnormalities are thought to result from primary defects of
      porphobilinogen deaminase (PBGD; also called hydroxymethyl bilane
      synthase), the third enzyme of the heme synthesis pathway, and
      consecutive hepatic overexpression of the first enzyme of the pathway,
      5-aminolevulinate synthase.
    explanation: >-
      This summarizes the joint HMBS bottleneck and hepatic ALAS1-overexpression
      model that drives AIP biochemistry without asserting that HMBS deficiency
      itself induces ALAS1.
  - reference: PMID:32521132
    reference_title: "Phase 3 Trial of RNAi Therapeutic Givosiran for Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 89 patients with acute intermittent porphyria, the mean
      annualized attack rate was 3.2 in the givosiran group and 12.5 in the
      placebo group, representing a 74% lower rate in the givosiran group
      (P<0.001); the results were similar among the 94 patients with acute
      hepatic porphyria.
    explanation: >-
      The AIP-specific randomized comparison provides intervention support for
      hepatic ALAS1 suppression reducing attack burden.
  - reference: PMID:26062020
    reference_title: "Liver Transplantation for Acute Intermittent Porphyria: Biochemical and Pathologic Studies of the Explanted Liver."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microsomal heme content was sufficient, and representative cytochrome P450 activities were essentially normal"
    explanation: >
      Detailed biochemical study of the AIP explanted liver shows preserved
      microsomal heme content and normal P450 activities despite massive
      ALA/PBG accumulation (ALAS1 ~5x activity, PBG ~1760x), directly
      supporting the hepatic-precursor-overproduction model over a
      generalized-heme-deficiency model.
  - reference: PMID:16122419
    reference_title: "Nutritional regulation of hepatic heme biosynthesis and porphyria through PGC-1alpha."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "5-aminolevulinate synthase (ALAS-1), is regulated by the peroxisome proliferator-activated receptor gamma coactivator 1alpha (PGC-1alpha)"
    explanation: >
      Identifies PGC-1α as the transcriptional link between fasting/drug
      triggers and ALAS1 induction, explaining the well-known "glucose
      effect" in AIP and providing the molecular mechanism connecting
      catabolic stressors to the canonical pathway.
- hypothesis_group_id: canonical_precursor_neurotoxicity_model
  hypothesis_label: Canonical Precursor Neurotoxicity Model
  status: CANONICAL
  description: >-
    Acute attacks are causally linked to excess hepatic precursor burden rather
    than to generalized hepatic heme deficiency alone, while the responsible
    toxic species and molecular route remain incompletely resolved.
  notes: >-
    Lowering or removing the hepatic precursor source reduces attacks, and
    liver-directed correction prevents induced neuropathy in mice. ALA is the
    leading candidate neurotoxin; PBG is a strong biochemical marker but is not
    independently established as the toxic species. Proposed GABA-A, oxidative,
    mitochondrial, and vascular mechanisms remain uncertain at physiologic
    concentrations. Severe homozygous pediatric disease with local CNS
    precursor production is a comparator, not a direct model of classic
    heterozygous AIP.
  evidence:
  - reference: PMID:35067977
    reference_title: "RNAi therapy with givosiran significantly reduces attack rates in acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical manifestations of AHP are attributed to the accumulation of
      the heme precursor 5-aminolevulinic acid (ALA) and porphobilinogen (PBG).
    explanation: >-
      This review directly links clinical manifestations in acute hepatic
      porphyrias to accumulation of ALA and PBG, matching the standard AIP
      neurotoxicity model.
  - reference: PMID:20877347
    reference_title: "Sustained enzymatic correction by rAAV-mediated liver gene therapy protects against induced motor neuropathy in acute porphyria mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "porphyrin precursors generated in the liver interfere with motor function"
    explanation: >
      Liver-specific AAV-PBGD gene therapy protects AIP mice against
      phenobarbital-induced precursor accumulation, axonal loss, and nerve
      conduction defects, providing direct causal evidence in the
      phenobarbital-induced mouse model that hepatic precursors drive motor
      neuropathy in that model.
  - reference: PMID:19815305
    reference_title: "Porphobilinogen deaminase over-expression in hepatocytes, but not in erythrocytes, prevents accumulation of toxic porphyrin precursors in a mouse model of acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PBGD over-expression in hepatocytes, albeit in a low proportion, reduced precursor accumulation"
    explanation: >
      Genetic dissection in mouse models shows that PBGD restoration in
      hepatocytes (not erythrocytes) corrects precursor accumulation and
      motor disturbance, directly identifying hepatic rather than erythroid
      PBGD deficiency as the relevant pathogenic locus in the induced mouse
      model.
  - reference: PMID:11478735
    reference_title: "5-Aminolevulinic acid inhibits [3H]muscimol binding to human and rat brain synaptic membranes."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "ALA (0.1-10 mM) significantly inhibited the binding"
    explanation: >
      In vitro evidence that ALA interferes with GABA-A receptor ligand binding
      (IC50 ~199-228 µM) provides a candidate molecular mechanism, but does not
      establish that the interaction produces human attack manifestations at
      physiologically relevant concentrations.
  - reference: PMID:12493610
    reference_title: "Transport of 5-aminolevulinic acid between blood and brain."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "uptake into the neonatal brain was 7-fold higher than in the adult"
    explanation: >
      Rat transport data show limited adult blood-brain-barrier permeability
      and greater neonatal uptake. This constrains direct-diffusion models but
      does not by itself establish the route of human classic-AIP neurotoxicity.
  - reference: PMID:30615115
    reference_title: "Homozygous hydroxymethylbilane synthase knock-in mice provide pathogenic insights into the severe neurological impairments present in human homozygous dominant acute intermittent porphyria."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "ALA and PBG do not readily cross the blood-brain barrier"
    explanation: >-
      The study distinguishes phenobarbital-induced classic-model precursor
      accumulation outside the CNS from severe homozygous disease with local
      CNS precursor production; it therefore informs a model boundary rather
      than directly supporting classic heterozygous AIP neurotoxicity.
pathophysiology:
- name: HMBS deficiency in hepatocytes
  conforms_to: "heme_biosynthesis_porphyria#Heme Biosynthesis Enzymatic Block"
  description: >-
    Pathogenic HMBS variants reduce hepatic hydroxymethylbilane synthase
    activity, creating a partial block at the third enzymatic step of heme
    biosynthesis.

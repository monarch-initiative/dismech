- name: Tachycardia
  description: >-
    Acute neurovisceral attacks often feature autonomic overactivity with sinus
    tachycardia and accompanying hypertension.
  phenotype_term:
    preferred_term: Tachycardia
    term:
      id: HP:0001649
      label: Tachycardia
  evidence:
  - reference: PMID:4723462
    reference_title: >-
      Acute intermittent porphyria: response of tachycardia and hypertension to
      propranolol.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In four young adult patients with acute attacks of acute intermittent
      porphyria tachycardia and hypertension were prominent features of the
      illness.
    explanation: >-
      Human case-series data directly support tachycardia as a prominent
      autonomic manifestation during AIP attacks.
- name: Nausea and vomiting
  description: >-
    Gastrointestinal symptoms during acute attacks commonly extend beyond pain
    to include nausea and vomiting.
  phenotype_term:
    preferred_term: Nausea and vomiting
    term:
      id: HP:0002017
      label: Nausea and vomiting
  evidence:
  - reference: PMID:33139977
    reference_title: >-
      Acute intermittent porphyria: focus on possible mechanisms of acute and
      chronic manifestations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute AIP episodes may present with abdominal pain, nausea, and vomiting,
      and repeated episodes may result in a series of chronic injuries.
    explanation: >-
      Review-level evidence supports nausea and vomiting as common acute
      neurovisceral symptoms in AIP.
- name: Hyponatremia
  description: >-
    Acute attacks can be complicated by hyponatremia, often in the setting of
    syndrome of inappropriate antidiuretic hormone secretion.
  phenotype_term:
    preferred_term: Hyponatremia
    term:
      id: HP:0002902
      label: Hyponatremia
  evidence:
  - reference: PMID:25796467
    reference_title: >-
      Abdominal pain and syndrome of inappropriate antidiuretic hormone
      secretion as clinical presentation of acute intermittent porphyria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute intermittent porphyria (AIP) is a rare condition characterized by
      abdominal pain and a wide range of nonspecific symptoms. We report the
      case of a woman with abdominal pain and syndrome of inappropriate
      antidiuretic hormone secretion (SIADH) as clinical presentation of AIP.
    explanation: >-
      Human clinical evidence supports SIADH-associated hyponatremia as an
      important electrolyte complication during acute AIP presentations.
- name: Hypertension
  description: >-
    Hypertension can occur during autonomically active attacks and is also more
    common as a chronic condition in manifest than latent AIP.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:4723462
    reference_title: >-
      Acute intermittent porphyria: response of tachycardia and hypertension to
      propranolol.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In four young adult patients with acute attacks of acute intermittent
      porphyria tachycardia and hypertension were prominent features of the
      illness.
    explanation: >-
      Human case-series data directly support hypertension during acute AIP
      attacks.
  - reference: PMID:8046316
    reference_title: "Hypertension and renal disease in patients with acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertension was found in 56% of patients with manifest AIP, 33% of their
      controls (P = 0.041) and 16% of patients with latent AIP (P = 0.004).
    explanation: >-
      The population-based case-control study supports hypertension as a
      chronic association of manifest AIP in addition to its acute autonomic
      presentation.
- name: Chronic kidney disease
  description: >-
    Chronic kidney disease, usually with a tubulointerstitial pattern and little
    proteinuria, is an important long-term complication of symptomatic AIP.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
  evidence:
  - reference: PMID:25830761
    reference_title: "High prevalence of and potential mechanisms for chronic kidney disease in patients with acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic kidney disease occurred in up to 59% of the symptomatic AIP
      patients, with a decline in the glomerular filtration rate of ~1 ml/min
      per 1.73 m(2) annually.
    explanation: >-
      The longitudinal AIP cohort directly supports chronic kidney disease and
      progressive filtration loss in symptomatic patients.
  - reference: PMID:33639982
    reference_title: "Health impact of acute intermittent porphyria in latent and non-recurrent attacks patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The earliest long-term clinical condition associated with SA-AIP was
      chronic kidney disease.
    explanation: >-
      This sporadic-attack AIP cohort shows that kidney disease is not confined
      to patients with frequent recurrent attacks.
- name: Hepatocellular carcinoma
  description: >-
    Hepatocellular carcinoma is an uncommon but clinically important long-term
    risk in AIP. Incidence estimates derive from observational cohorts and do
    not imply that cancer is inevitable or that a specific precursor-mediated
    carcinogenic mechanism is proven.
  phenotype_term:

- name: Carbohydrate loading
  description: >-
    High-carbohydrate intake is used as adjunctive therapy during milder attacks
    but is usually insufficient alone for serious episodes.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: glucose supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Triggered hepatic ALAS1 induction
    treatment_effect: MODULATES
    description: >-
      Glucose administration is placed upstream of triggered hepatic ALAS1
      induction as a nutritional intervention. PGC-1alpha links nutritional
      status to ALAS1 regulation, but the cited mechanistic study explicitly
      leaves the beneficial glucose mechanism unresolved, so this join is
      provisional.
    evidence:
    - reference: PMID:16122419
      reference_title: "Nutritional regulation of hepatic heme biosynthesis and porphyria through PGC-1alpha."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Acute attacks are treated by heme infusion and glucose administration,
        but the mechanisms underlying the precipitating effects of fasting and
        the beneficial effects of glucose are unknown.
      explanation: >-
        The study identifies glucose as an acute-attack intervention while
        explicitly limiting the certainty of its mechanistic connection.
    - reference: PMID:16122419
      reference_title: "Nutritional regulation of hepatic heme biosynthesis and porphyria through PGC-1alpha."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data show that PGC-1alpha links nutritional status to heme
        biosynthesis and acute hepatic porphyria.
      explanation: >-
        Mouse data support a nutritional-regulation join to the hepatic pathway
        without proving that glucose directly suppresses ALAS1 in human AIP.
  evidence:
  - reference: PMID:19327613
    reference_title: "Plasma porphobilinogen as a sensitive biomarker to monitor the clinical and therapeutic course of acute intermittent porphyria attacks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is based on symptomatic relief together with carbohydrate
      loading and in more severe attacks heme therapy.
    explanation: >-
      This directly supports carbohydrate loading as standard supportive
      management during acute attacks.
  - reference: PMID:19327613
    reference_title: "Plasma porphobilinogen as a sensitive biomarker to monitor the clinical and therapeutic course of acute intermittent porphyria attacks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucose administration, in contrast to heme therapy, was not sufficient
      to achieve clinical and biochemical remission in the more serious
      attacks.
    explanation: >-
      This directly establishes the clinically important limitation that
      carbohydrate therapy is insufficient in more severe attacks.
diagnosis:
- name: Urinary ALA and PBG measurement
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: >-
    Quantification of PBG and ALA, normalized to creatinine in a random urine
    sample collected during symptoms, establishes an active
    acute-hepatic-porphyria biochemical state and can track treatment response;
    the biochemical result alone does not distinguish AIP from the other acute
    hepatic porphyrias.
  results: Markedly elevated urinary PBG, usually with elevated ALA, supports an active acute hepatic porphyria attack and prompts porphyria-type confirmation.
  evidence:
  - reference: PMID:19327613
    reference_title: >-
      Plasma porphobilinogen as a sensitive biomarker to monitor the clinical
      and therapeutic course of acute intermittent porphyria attacks.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During an acute attack the heme precursors porphobilinogen (PBG) and
      5-aminolevulinic acid (ALA) are produced in high amounts by the liver and
      are found in high concentrations in plasma and urine.
    explanation: >-
      This directly supports urinary ALA and PBG measurement as the key
      biochemical diagnostic readout during attacks.
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When the diagnosis of an AIP attack is suspected based on clinical
      findings, establishing the diagnosis begins with biochemical testing.
    explanation: >-
      GeneReviews explicitly places biochemical testing first in the diagnostic
      sequence.
  - reference: PMID:36642627
    reference_title: "AGA Clinical Practice Update on Diagnosis and Management of Acute Hepatic Porphyrias: Expert Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Initial diagnosis of AHP should be made by biochemical testing measuring
      δ-aminolevulinic acid, porphobilinogen, and creatinine on a random urine
      sample.
    explanation: >-
      The AGA expert review specifies the random-urine collection and creatinine
      correction needed to control for urine dilution.
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: HMBS
        term:
          id: hgnc:4982
          label: HMBS
  description: >-
    HMBS molecular testing confirms AIP as the porphyria type after positive
    biochemistry and enables cascade screening. Because penetrance is very low,
    an HMBS variant alone does not establish that current symptoms constitute
    an acute attack.
  results: A pathogenic HMBS variant confirms inherited AIP susceptibility; increased urinary PBG is also required to attribute current symptoms to an AIP attack.
  evidence:
  - reference: PMID:20301372
    reference_title: "Acute Intermittent Porphyria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the urinary concentration of PBG is increased, molecular genetic
      testing is performed to confirm the diagnosis and/or to facilitate
      cascade screening of family members.
    explanation: >-
      GeneReviews supports confirmatory HMBS testing after positive biochemical
      testing and its separate role in family screening.
clinical_trials:
- name: NCT03338816
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ENVISION was the pivotal randomized phase III study of subcutaneous
    givosiran in patients with acute hepatic porphyrias, including acute
    intermittent porphyria, with recurrent attacks.
  evidence:
  - reference: clinicaltrials:NCT03338816
    reference_title: "ENVISION: A Phase 3 Randomized, Double-blind, Placebo-Controlled Multicenter Study With an Open-label Extension to Evaluate the Efficacy and Safety of Givosiran in Patients With Acute Hepatic Porphyrias"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to evaluate the effect of subcutaneous
      givosiran (ALN-AS1), compared to placebo, on the rate of porphyria
      attacks in patients with Acute Hepatic Porphyrias (AHP).
    explanation: >-
      ClinicalTrials.gov directly documents the pivotal phase III givosiran
      trial relevant to recurrent AIP attacks.
animal_models:
- species: Mus musculus
  genotype: Partially Hmbs/PBGD-deficient T1/T2 model with approximately 30% residual activity
  description: >-
    The classic heterozygous AIP model requires phenobarbital induction rather
    than developing spontaneous human-like attacks. Induction produces hepatic
    precursor accumulation, nerve-conduction block, axonal loss, and reversible
    hepatic energetic abnormalities; the energetic findings are preclinical and
    are not asserted as established chronic human AIP pathology.
  associated_phenotypes:
  - Peripheral neuropathy
  - Muscle weakness
  evidence:
  - reference: PMID:20877347
    reference_title: "Sustained enzymatic correction by rAAV-mediated liver gene therapy protects against induced motor neuropathy in acute porphyria mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Phenobarbital injections in AIP mice induced porphyrin precursor
      accumulation, functional block of nerve conduction, and progressive loss
      of large-caliber axons in the sciatic nerve.
    explanation: >-
      This defines the induced classic mouse phenotype and explicitly avoids
      implying that attacks arise spontaneously.
  - reference: PMID:24727425
    reference_title: "Acute intermittent porphyria causes hepatic mitochondrial energetic failure in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest a cataplerosis of the TCA cycle induced by
      phenobarbital, caused by the massive withdrawal of succinyl-CoA by ALAS
      induction, such that the TCA cycle is unable to supply the reduced
      cofactors to the RC.
    explanation: >-
      The induced mouse study supports a reversible hepatic energetic extension
      of the model, not an established human complication.
- species: Mus musculus
  genotype: Homozygous Hmbs R167Q knock-in with approximately 5% residual activity
  description: >-
    This severe homozygous model develops early ataxia, delayed myelination, and
    locally elevated CNS ALA/PBG. It models homozygous dominant AIP (HD-AIP), not
    the usual heterozygous, low-penetrance, episodic adult disease.
  associated_phenotypes:
  - Ataxia
  - Delayed myelination
  evidence:
  - reference: PMID:30615115
    reference_title: "Homozygous hydroxymethylbilane synthase knock-in mice provide pathogenic insights into the severe neurological impairments present in human homozygous dominant acute intermittent porphyria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous R173Q mice were embryonic lethal, while R167Q homozygous mice
      (R167Q+/+) had ~5% of normal HMBS activity, constitutively elevated plasma
      and urinary 5-aminolevulinic acid (ALA) and porphobilinogen (PBG), profound
      early-onset ataxia, delayed motor development and markedly impaired
      rotarod performance.
    explanation: >-
      This directly supports the explicitly scoped severe biallelic model; the
      description separately limits extrapolation to classic heterozygous AIP.

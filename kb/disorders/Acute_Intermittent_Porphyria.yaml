    reference_title: "Porphyric neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute hepatic porphyrias are inherited metabolic disorders that may
      present with polyneuropathy, which if not diagnosed early can lead to

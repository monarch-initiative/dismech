notes: >-
  Routing of the CMT1 series. MONDO:0019011, this entry's disease_term, has six
  children: MONDO:0007309 CMT1A, MONDO:0007307 CMT1B, MONDO:0010995 CMT1C,
  MONDO:0011890 CMT1D, MONDO:0007311 CMT1E and MONDO:0011902 CMT1F. Five of them
  are has_subtypes rows here with their MONDO terms and causal genes bound.
  CMT1E is deliberately not a row: it is curated as the standalone entry
  kb/disorders/Charcot-Marie-Tooth_Disease_Type_1E.yaml, which binds
  MONDO:0007311 as its own disease_term and models the PMP22 point-mutation
  lesion as a proteostatic and cholesterol-trafficking defect distinct from the
  CMT1A dosage lesion, with the therapeutic consequence that a CMT1A-directed
  treatment does not transfer to it.

  Two rows here bind MONDO classes that sit outside MONDO:0019011. MONDO:0030689
  (CMT1H, FBLN5) and MONDO:0859311 (CMT1J, ITPR3) are both filed by MONDO under
  MONDO:0015626 Charcot-Marie-Tooth disease rather than under MONDO:0019011,
  even though MONDO:0859311's own label is "Charcot-Marie-Tooth disease,
  demyelinating, type 1J" and CMT1H is one of MONDO:0030689's synonyms. The rows
  are kept because the entry groups by electrophysiological compartment and both
  are reported as demyelinating; the mismatch is a fact about where MONDO files
  them. The CMTX1 row binds no MONDO term at all, because the X-linked form is
  curated as kb/disorders/Charcot-Marie-Tooth_Disease_Type_X.yaml against
  MONDO:0018994, which is likewise a child of MONDO:0015626; CMTX1 is grouped
  here on mechanistic grounds, as a Schwann-cell gap-junction defect, and its row
  carries the gene without claiming the class. CMT1G is a third sibling under
  MONDO:0015626, curated as
  kb/disorders/Charcot-Marie-Tooth_Disease_Demyelinating_Type_1G.yaml.

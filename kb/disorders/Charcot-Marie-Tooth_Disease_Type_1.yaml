- name: LITAF Endolysosomal Homeostasis Failure
  biological_scale: CELLULAR
  description: >-
    LITAF, also called SIMPLE, is a small integral membrane protein of the late
    endosome and lysosome, and autosomal dominant mutations in it cause CMT1C.
    Primary fibroblasts from two CMT1C patients carrying different pathogenic
    LITAF variants show vacuolation and enlargement of late endosomes and
    lysosomes, and the same morphology follows knocking LITAF out of control
    fibroblasts, which is consistent with loss of function. The same phenotype
    occurs in CMT4J fibroblasts carrying FIG4 variants and is rescued in both by
    a small-molecule activator of the lysosomal channel TRPML1, so LITAF and
    FIG4 appear to act on one endolysosomal pathway. This lesion is unlike the
    other CMT1 subtypes modeled here. LITAF is widely expressed, and its
    transcript level in sciatic nerve is not altered during development or in
    response to nerve injury, which the founding report calls a stark contrast to
    the other known CMT1 genes.

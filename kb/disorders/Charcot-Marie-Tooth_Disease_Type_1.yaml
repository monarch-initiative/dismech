- name: EGR2 Schwann-Cell Myelination Program Failure
  biological_scale: MOLECULAR
  description: >-
    EGR2, also called Krox20, is a Cys2His2 zinc-finger protein that binds DNA in
    a sequence-specific manner and acts as a transcription factor, and stable
    expression of its mouse orthologue is specifically associated with the onset
    of peripheral myelination. Egr2-null mice arrest Schwann-cell
    differentiation at an early stage, and missense mutations in the conserved
    functional domains of human EGR2 were found in congenital hypomyelinating
    neuropathy and in a CMT1 family. The lesion is therefore a failure of the
    transcriptional programme that drives a Schwann cell into the myelinating
    state, rather than a defect in a myelin structural protein.

      label: Charcot-Marie-Tooth disease type 1C
  genes:
  - preferred_term: LITAF
    term:
      id: hgnc:16841
      label: LITAF
  description: >-
    Autosomal dominant demyelinating CMT caused by missense mutations in LITAF,
    also called SIMPLE, which encodes a small integral membrane protein of the
    late endosome. The founding report mapped CMT1C to chromosome 16p13.1-p12.3
    and found clustered missense mutations G112S, T115N and W116G in three
    pedigrees. LITAF is widely expressed and its transcript level in sciatic
    nerve does not change during development or in response to nerve injury,
    which the founding report calls a stark contrast to the other known CMT1
    genes, so the lesion is not a myelin structural protein defect; the
    endolysosomal phenotype it produces is modeled in this entry's
    pathophysiology. In a Korean cohort LITAF accounted for 0.59% of CMT1
    patients, with milder disease than CMT1A.

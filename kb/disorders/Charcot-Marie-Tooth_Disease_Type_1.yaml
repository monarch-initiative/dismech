  - reference: PMID:28501821
    reference_title: "Genetic and clinical characteristics of NEFL-related Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of large-myelinated fibres was a uniform feature in a total of 21 sural nerve biopsies and 'onion bulb' formations and/or thin myelin sheaths were observed in 14 (67%) of them."
    explanation: Sources the biopsy findings quoted in this description, including the two-thirds figure for onion bulbs or thin myelin sheaths.
  - reference: PMID:33993654
    reference_title: "A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In fact, different individuals with the same mutation can be classified as having axonal, demyelinating, or dominant intermediate forms of the disease."
    explanation: Sources the caveat that the CMT1F designation tracks the electrophysiological presentation rather than the variant.
  - reference: PMID:33993654
    reference_title: "A review and analysis of the clinical literature on Charcot-Marie-Tooth disease caused by mutations in neurofilament protein L."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This suggests that the classification of the disease as CMT2E, CMT1F or DI-CMTG has more to do with variable disease presentation than to differences in the underlying disease mechanism, which is most likely primarily axonal in all cases."
    explanation: Sources this description's statement that the review argues the underlying process is most likely primarily axonal in every case.
- name: CMT1H
  display_name: CMT1H (FBLN5-related, with skin and retinal involvement)

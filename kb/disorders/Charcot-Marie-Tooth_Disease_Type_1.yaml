      snippet: "The frequency of CMT1C among CMT1 patients was 0.59%, which is similar to reports from Western populations."
      explanation: Gives the share of CMT1 cases attributable to LITAF in this cohort.
  evidence:
  - reference: PMID:12525712
    reference_title: "Mutation of a putative protein degradation gene LITAF/SIMPLE in Charcot-Marie-Tooth disease 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors recently mapped an autosomal dominant demyelinating form of CMT type 1 (CMT1C) to chromosome 16p13.1-p12.3."
    explanation: Establishes CMT1C as a dominant demyelinating CMT1 locus, which the same report then resolves to LITAF.
  - reference: PMID:35608774
    reference_title: "Identification and clinical characterization of Charcot-Marie-Tooth disease type 1C patients with LITAF p.G112S mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 10 CMT1C patients from three unrelated families with p.G112S mutation in LITAF."
    explanation: Independent cohort confirmation of LITAF as the CMT1C gene.
- name: NEFL
  gene_term:
    preferred_term: NEFL
    term:
      id: hgnc:7739
      label: NEFL
  association: Causal
  relationship_type: CAUSATIVE
  subtype: CMT1F
  notes: >-
    NEFL encodes neurofilament light chain. Its variants are classified as
    CMT1F, CMT2E or DI-CMTG by electrodiagnostic findings rather than by
    genotype, and a review of the published cases found the same variant
    classified differently in different patients. The CMT2E presentation is
    curated on Charcot-Marie-Tooth Disease Type 2 and the intermediate
    presentation has its own entry, Charcot-Marie-Tooth Disease Dominant
    Intermediate G. ClinGen's Charcot-Marie-Tooth
    Disease Gene Curation Expert Panel has two NEFL rows in the committed cache,
    Definitive for Charcot-Marie-Tooth disease (MONDO:0015626, autosomal
    dominant) and Definitive for Charcot-Marie-Tooth disease type 2
    (MONDO:0018993, autosomal recessive); neither is scored against CMT1F, so
    the demyelinating designation is not separately graded.
  evidence:
  - reference: PMID:35044100
    reference_title: "Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the neurofilament light polypeptide (NEFL) gene produce diverse clinical phenotypes, including demyelinating (CMT1F), axonal (CMT2E), and intermediate (CMTDIG) neuropathies."
    explanation: Establishes NEFL as the CMT1F gene and names the three presentations its variants produce.
  - reference: CGGV:assertion_57ec533a-b1cb-4d1d-b12a-61ee6ac6ab07-2023-01-10T170000.000Z
    reference_title: "NEFL / Charcot-Marie-Tooth disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NEFL | HGNC:7739 | Charcot-Marie-Tooth disease | MONDO:0015626 | AD | Definitive"
    explanation: >-
      ClinGen classifies the NEFL relationship with autosomal dominant
      Charcot-Marie-Tooth disease as Definitive. The assertion is scored against
      the generic CMT class rather than against CMT1F, which is the limit these
      notes record.
- name: FBLN5
  gene_term:
    preferred_term: FBLN5
    term:
      id: hgnc:3602
      label: FBLN5
  association: Causal
  relationship_type: CAUSATIVE
  subtype: CMT1H
  notes: >-
    Heterozygous FBLN5 missense variants cause demyelinating CMT (CMT1H). The
    relationship was established by mapping a dominant CMT1 family to chromosome
    14q32 and resequencing the interval, then finding two further missense variants
    among 112 unclassified CMT probands. ClinGen's Charcot-Marie-Tooth Disease Gene
    Curation Expert Panel classifies FBLN5 as Moderate for demyelinating hereditary
    motor and sensory neuropathy, so this is a supported but not definitively
    established gene-disease relationship.
  evidence:
  - reference: PMID:21576112
    reference_title: "Fibulin-5 mutations link inherited neuropathies, age-related macular degeneration and hyperelastic skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identifies fibulin-5 as a gene involved in Charcot-Marie-Tooth neuropathies and reveals heterozygous fibulin-5 mutations in 2% of our patients with age-related macular degeneration."
    explanation: Establishes FBLN5 as a CMT gene.
  - reference: CGGV:assertion_a863341a-9dcf-4a4f-a82d-7edb5e63fe92-2023-11-28T170000.000Z
    reference_title: "FBLN5 / demyelinating hereditary motor and sensory neuropathy (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FBLN5 | HGNC:3602 | demyelinating hereditary motor and sensory neuropathy | MONDO:0018776 | AD | Moderate"
    explanation: >-
      ClinGen classifies the FBLN5 demyelinating-neuropathy relationship as Moderate
      with autosomal dominant inheritance, the strength recorded in these notes.
- name: ITPR3
  gene_term:
    preferred_term: ITPR3
    term:
      id: hgnc:6182
      label: ITPR3
  association: Causal
  relationship_type: CAUSATIVE
  subtype: CMT1J
  notes: >-
    Autosomal dominant ITPR3 variants cause CMT1J. The gene-disease relationship
    rests on a segregating p.Val615Met variant in a four-affected dominant family,
    a de novo p.Arg2524Cys variant in an isolated case, two previously identified
    variants, and a dominant-negative calcium-transient phenotype in patient
    fibroblasts. A search of the approved symbol ITPR3 in the ClinGen Gene-Disease
    Validity CSV (snapshot 2026-08-13) returns no row, so no expert panel has yet
    classified this relationship.
  evidence:
  - reference: PMID:32949214
    reference_title: "Dominant mutations in ITPR3 cause Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a heterozygous ITPR3 p.Val615Met variant segregating with the disease."
    explanation: The segregating variant in the dominant family behind this gene-disease relationship.
  - reference: PMID:32949214
    reference_title: "Dominant mutations in ITPR3 cause Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio exome sequencing identified a de novo ITPR3 variant p.Arg2524Cys."
    explanation: The independent de novo variant that supports the relationship beyond the single family.
  - reference: PMID:32949214
    reference_title: "Dominant mutations in ITPR3 cause Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individual who was the only affected in his family had disease onset at age 4 with demyelinating neuropathy."
    explanation: Sources the much earlier onset of the de novo case recorded in this subtype's description.
inheritance:
- name: Autosomal Dominant
  description: >-
    The majority of CMT1 subtypes — CMT1A (PMP22 duplication), CMT1B (MPZ),
    and CMT1D (EGR2) — are inherited in an autosomal dominant manner. A single
    pathogenic variant is sufficient to cause disease, and affected individuals
    have a 50% chance of passing the variant to offspring.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9537424
    reference_title: "Mutations in the early growth response 2 (EGR2) gene are associated with hereditary myelinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified one recessive and two dominant missense mutations in EGR2 (within regions encoding conserved functional domains) in patients with congenital hypomyelinating neuropathy (CHN) and a family with Charcot-Marie-Tooth type 1 (CMT1)."
    explanation: >-
      Establishes that dominant mutations in EGR2 cause CMT1D, documenting autosomal
      dominant inheritance as one of the primary modes of CMT1.
- name: X-linked
  description: >-
    The CMTX1 subtype is caused by mutations in GJB1 (connexin-32) on chromosome
    Xq13.1 and is inherited in an X-linked manner. Males are more severely affected
    than carrier females, and electrophysiology is intermediate between CMT1 and CMT2.
    CMTX1 is the second most common form of CMT overall, accounting for 7–12% of
    all CMT cases.
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  evidence:
  - reference: PMID:30881289
    reference_title: "Role of Connexin-Based Gap Junction Channels in Communication of Myelin Sheath in Schwann Cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CMTX1, the X-linked dominant form of CMT, is the second most common form of CMT and the first X-linked form of CMT, with 7% to 12%, and 50% of all CMT cases and X-linked cases, respectively"
    explanation: >-
      Establishes X-linked inheritance for CMTX1, documenting it as the second most
      common CMT genotype and accounting for 7–12% of all CMT cases.

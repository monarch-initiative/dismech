- name: CMT1F
  display_name: CMT1F (NEFL-related)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease type 1F
    term:
      id: MONDO:0011902
      label: Charcot-Marie-Tooth disease type 1F
  genes:
  - preferred_term: NEFL
    term:
      id: hgnc:7739
      label: NEFL
  description: >-
    The demyelinating presentation of NEFL-related CMT. NEFL encodes
    neurofilament light protein, one of five proteins that co-assemble to form
    neurofilaments, and its variants produce three electrophysiological
    presentations that the literature designates separately: demyelinating
    (CMT1F), axonal (CMT2E) and dominant intermediate (DI-CMTG). Sural nerve
    biopsies in NEFL-related CMT uniformly lose large myelinated fibres, and
    onion bulbs or thin myelin sheaths were seen in two-thirds of 21 reported
    biopsies, which is what places this presentation in the demyelinating
    compartment.

    The designation is a presentation rather than a mechanism, and the entry
    records it as such. A review of the published NEFL cases found that the same
    variant can be classified as CMT1F in one patient and CMT2E or DI-CMTG in
    another, and argued that the underlying process is most likely primarily
    axonal in every case. NEFL therefore crosses the compartment
    boundary in both directions: the axonal presentation is curated as CMT2E on
    Charcot-Marie-Tooth Disease Type 2, and the intermediate presentation has
    its own entry, Charcot-Marie-Tooth Disease Dominant Intermediate G.
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:35044100
    reference_title: "Phenotypic heterogeneity in patients with NEFL-related Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the neurofilament light polypeptide (NEFL) gene produce diverse clinical phenotypes, including demyelinating (CMT1F), axonal (CMT2E), and intermediate (CMTDIG) neuropathies."

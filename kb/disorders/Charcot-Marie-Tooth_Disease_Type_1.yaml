      label: "Charcot-Marie-Tooth disease, demyelinating, IIA 1H"
  description: >-
    Autosomal dominant demyelinating CMT caused by heterozygous FBLN5 missense
    variants. FBLN5 encodes fibulin-5, an extracellular matrix protein required for
    elastic fibre assembly; the same gene causes recessive cutis laxa and is
    associated with age-related macular degeneration. Reported CMT families combine
    neuropathy with hyperextensible skin, and a mild-to-severe peripheral neuropathy
    was found in most FBLN5-mutation carriers ascertained through macular
    degeneration, so the subtype is best understood as one face of an
    oculo-neuro-cutaneous phenotype.

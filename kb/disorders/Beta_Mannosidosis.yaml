pathophysiology:
- name: MANBA lysosomal beta-mannosidase deficiency
  description: >-
    Pathogenic MANBA alleles impair enzyme production, processing or catalytic function. Splice-disrupting,
    truncating and missense variants are reported; residual activity and clinical severity need not correlate.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:12890191
    reference_title: "Morphological and biochemical studies of human beta-mannosidosis: identification of a novel beta-mannosidase gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Assays of seven enzyme activities in plasma and cultured skin fibroblasts showed a marked decrease of
      beta-mannosidase activity.
    explanation: >-
      Patient biochemical confirmation of enzyme deficiency.
  - reference: PMID:18565776
    reference_title: "Identification of two novel beta-mannosidosis-associated sequence variants: biochemical analysis of beta-mannosidase (MANBA) missense mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Cells transfected with the wild-type construct showed a 33-fold increase in beta-mannosidase activity
      compared to mock-transfected cells, whereas cells transfected with the mutant constructs showed no detectable
      increase in activity.
    explanation: >-
      Ser505Pro, Arg182Trp and Gly392Glu failed to increase activity above mock in COS-7 cells; this is not
      an absolute zero-activity measurement.

  prevalence_class: UNKNOWN
  notes: >-
    The 2025 review reported 46 individuals from 37 families. This literature count is not a population prevalence
    estimate and includes a previously published transplant recipient followed longitudinally. Mild presentations
    may be underdiagnosed.

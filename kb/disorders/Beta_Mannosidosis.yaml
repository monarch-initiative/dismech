        splicing, and a missense mutation (c.1513T>C, p.Ser505Pro) in exon 12.
      explanation: >-
        Separates the DNA SNV from the abnormal transcript.
  - name: MANBA c.1513T>C (p.Ser505Pro)
    type: Functionally tested missense allele
    description: >-
      The mutant construct failed to increase beta-mannosidase activity above mock in COS-7 cells. Ser505Pro
      was reported in a more severe presentation than Arg182Trp or Gly392Glu; the common in vitro activity
      result does not predict individual clinical severity.
    evidence:
    - reference: PMID:18565776
      reference_title: "Identification of two novel beta-mannosidosis-associated sequence variants: biochemical analysis of beta-mannosidase (MANBA) missense mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        Cells transfected with the wild-type construct showed a 33-fold increase in beta-mannosidase activity
        compared to mock-transfected cells, whereas cells transfected with the mutant constructs showed no
        detectable increase in activity.
      explanation: >-
        Ser505Pro, Arg182Trp and Gly392Glu failed to increase activity above mock in COS-7 cells; this is not
        an absolute zero-activity measurement.
    variant_type: single nucleotide variant

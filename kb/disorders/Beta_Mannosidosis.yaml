- name: MANBA
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MANBA
    term:
      id: hgnc:6831
      label: MANBA
  variant_origin: GERMLINE
  notes: >-
    Biallelic pathogenic variants are causal. The 2025 review lists missense, nonsense, frameshift, splice-site
    and an intragenic inverted-duplication allele. Some observed variants remain uncertain; p.Arg500His and
    the co-occurring p.Gln145Pro should not be treated as definitively pathogenic merely because they were
    found in affected individuals. Clinical severity is not reliably predicted by residual activity or broad
    variant class.
  inheritance:
  - name: Autosomal recessive
    description: >-
      When both parents carry a pathogenic MANBA allele, each pregnancy has a 25% affected, 50% carrier and
      25% noncarrier probability. Severity can differ among affected relatives.
    evidence:
    - reference: PMID:42160655
      reference_title: Beta-Mannosidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        If both parents are known to be heterozygous for a MANBA pathogenic variant, each sib of an affected
        individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic
        carrier, and a 25% chance of being unaffected and not a carrier.
      explanation: >-
        Mendelian recurrence risks, conditional on both parents being carriers.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: CGGV:assertion_d70d38aa-f7e9-4c93-8160-58dec9cec010-2022-08-02T160000.000Z
    reference_title: "MANBA / beta-mannosidosis (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MANBA | HGNC:6831 | beta-mannosidosis | MONDO:0009562 | AR | Definitive"
    explanation: ClinGen classifies the MANBA-beta-mannosidosis gene-disease relationship as definitive with autosomal recessive inheritance.
  - reference: PMID:32847582
    reference_title: "Variant c.2158-2A>G in MANBA is an important and frequent cause of hereditary hearing loss and beta-mannosidosis among the Czech and Slovak Roma population- evidence for a new ethnic-specific variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      MANBA variant c.2158-2A>G screening among 345 anonymized normal hearing controls from Roma populations
      revealed a carrier/heterozygote frequency of 3.77%.
    explanation: >-
      Population and denominator of the carrier estimate.
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      the severity of the phenotype is not explained by the presence or absence of residual enzyme activity.
    explanation: >-
      Review interpretation of variable clinical severity.
    quote_role: REVIEW_SYNTHESIS
  features: >-
    The c.2158-2A>G allele was found in 13 heterozygotes among 345 sampled normal-hearing Czech and Slovak
    Roma controls (3.77% carrier frequency). This selected-cohort estimate is not a global population prevalence
    or penetrance estimate. Hearing-loss ascertainment and one dual GJB2/MANBA diagnosis limit phenotype attribution.

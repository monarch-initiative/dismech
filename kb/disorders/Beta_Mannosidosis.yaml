discussions:
- discussion_id: beta_mannosidosis_ctbs_modifier
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does variation in chitobiase-dependent glycan processing modify human disease severity?
  rationale: >-
    Additional urinary glycans in two severely affected patients and species differences motivate a CTBS hypothesis.
    No causal human modifier allele or functional epistasis experiment has established that link. Background-dependent
    mouse pathology indicates modifier effects without identifying the responsible gene.
  evidence:
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      additional studies should be developed to determine whether CTBS (Di-N-Acetyl-Chitobiase) acts as a modifier
      gene in severe cases.
    explanation: >-
      The authors pose a question; they do not demonstrate a CTBS modifier effect.
- discussion_id: beta_mannosidosis_myelin_species_gap
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do some patients have persistent hypomyelination while the Manba knockout mouse lacks this finding?
  rationale: >-
    Human MRI, severe ruminant myelin deficiency and mouse vacuolation are distinct observations. Storage substrate
    composition, cell susceptibility and developmental timing may differ. Neuronal degeneration in mice is
    spatially separate from major vacuolated populations; vacuolation does not automatically imply neuronal
    death.
  attaches_to:
  - pathophysiology#Impaired CNS myelination
  evidence:
  - reference: PMID:24142277
    reference_title: Distribution and Severity of Neuropathology in β-Mannosidase-Deficient Mice is Strain Dependent.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Neuropathology between 1 and 9 months of age included selective, variable neuronal vacuolation with no
      hypomyelination.
    explanation: >-
      Explicit lack of the human myelin phenotype in the reported mouse analysis.
  - reference: PMID:24142277
    reference_title: Distribution and Severity of Neuropathology in β-Mannosidase-Deficient Mice is Strain Dependent.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      Degeneration staining did not occur in areas of vacuolation or adjacent regions, suggesting that vacuolation
      does not lead to substantial cell body or axon loss.
    explanation: >-
      Experimental pathology limits a simple vacuolation-to-cell-death chain.

biochemical:
- name: Urinary free oligosaccharides
  presence: INCREASED
  context: Diagnostic biomarker
  notes: >-
    ManGlcNAc and NeuManGlcNAc are characteristic urinary findings. Reduced excretion after transplantation
    demonstrates a biochemical response, not necessarily neurological stabilization. Population-wide sensitivity
    is not inferred from pooled glycoproteinosis assay validation.
  readouts:
  - target: Glycoprotein-derived oligosaccharide storage
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Increased urinary free oligosaccharides report overflow of incompletely
      degraded glycoprotein-derived substrates from lysosomal storage.
    evidence:
    - reference: PMID:32847582
      reference_title: "Variant c.2158-2A>G in MANBA is an important and frequent cause of hereditary hearing loss and beta-mannosidosis among the Czech and Slovak Roma population- evidence for a new ethnic-specific variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Biochemical diagnostics confirmed the typical disaccharides (primarily Man (beta1 → 4) GlcNac) in the urine of affected patients"
      explanation: Patient urine testing directly supports urinary oligosaccharides as a diagnostic readout of glycoprotein-derived oligosaccharide storage.
  evidence:
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      ManGlcNAc and NeuManGlcNAc, known markers of the disease,1,12,48 are present in the urine of patients
      A, C, and D.
    explanation: >-
      Direct glycan profiling in the 2025 series.
- name: Beta-mannosidase activity
  presence: DECREASED
  context: Diagnostic enzymatic assay
  notes: >-
    Activity is markedly reduced or absent in leukocytes, serum or plasma; assay reference ranges depend on
    laboratory and sample type. Enzyme testing is the diagnostic gold standard, but residual activity does
    not reliably predict clinical severity.
  readouts:
  - target: MANBA lysosomal beta-mannosidase deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Decreased beta-mannosidase activity directly reports the primary MANBA
      lysosomal enzyme deficiency.
    evidence:
    - reference: PMID:32847582
      reference_title: "Variant c.2158-2A>G in MANBA is an important and frequent cause of hereditary hearing loss and beta-mannosidosis among the Czech and Slovak Roma population- evidence for a new ethnic-specific variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a decreased activity of the beta-mannosidase enzyme in different cells, particularly in leukocytes"
      explanation: Patient cell assays support reduced beta-mannosidase activity as a direct diagnostic readout of MANBA enzyme deficiency.
  evidence:
  - reference: PMID:42160655
    reference_title: Beta-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      markedly reduced or absent beta-mannosidase activity in leukocytes, serum, or plasma. Enzyme testing
      is the gold standard for diagnosis.
    explanation: >-
      Clinical diagnostic role and specimen types.
    quote_role: REVIEW_SYNTHESIS
- name: Urinary NeuMan2GlcNAc2 peak
  presence: INCREASED
  context: Exploratory glycan finding
  notes: >-
    A peak assigned to NeuMan2GlcNAc2 was observed in the two most severely affected patients in the 2025 series.
    It is not a validated severity marker, and incomplete chitobiase-dependent degradation remains a hypothesis.
  evidence:

    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    type: Splice acceptor variant
    clinical_significance: PATHOGENIC
    description: >-
      An intronic acceptor-site SNV associated with cryptic splice-site activation and exon skipping. Two abnormal
      RNA products were observed in differently affected siblings. Presence of abnormal RNA does not itself
      demonstrate residual catalytic activity.
    identifiers:
    - dbSNP:rs772852668
    evidence:
    - reference: PMID:9384606
      reference_title: Human beta-mannosidase cDNA characterization and first identification of a mutation associated with human beta-mannosidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The associated cryptic splice site activation and exon skipping caused by this mutation resulted in
        two abnormally spliced mutant mRNA species in both siblings.
      explanation: >-
        Primary patient RNA evidence.
    - reference: PMID:32847582
      reference_title: "Variant c.2158-2A>G in MANBA is an important and frequent cause of hereditary hearing loss and beta-mannosidosis among the Czech and Slovak Roma population- evidence for a new ethnic-specific variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The first, larger product, lacking 172 bp, results in a frameshift and stop codon that truncates the
        predicted protein by 155 residues. The second, shorter product, lacks 258 bp and is presumably an exon
        skipping event
      explanation: >-
        The 2020 report summarizes earlier RNA analysis; these are transcript deletions, not separate DNA deletions.
      quote_role: BACKGROUND
  - name: MANBA c.375A>G
    variant_type: single nucleotide variant
    genomic_contexts:
    - coding sequence
    type: Synonymous variant with splice disruption
    description: >-
      The reported DNA substitution is synonymous but alters splicing, removing four nucleotides from RNA and
      predicting premature termination. It was found in trans with p.Ser505Pro. The physical DNA alteration
      is a single-nucleotide substitution; the four-base deletion occurs in the transcript.
    evidence:
    - reference: PMID:18565776
      reference_title: "Identification of two novel beta-mannosidosis-associated sequence variants: biochemical analysis of beta-mannosidase (MANBA) missense mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-

animal_models:
- name: Manba knockout mice
  species: Mus musculus
  genotype: Manba homozygous targeted disruption
  background: 129X1/SvJ congenic and mixed C57BL/6J × 129X1/SvJ
  description: >-
    Knockout mice accumulate disaccharides and show CNS vacuolation with few overt early neurological abnormalities.
    At 15–20 months all five congenic mice in the 2014 study had severe regional vacuolation and degeneration,
    whereas mixed-background mice varied. The study did not identify a particular modifier gene. Myelination
    defects seen in some patients and ruminants were not reproduced.
  modeled_mechanisms:
  - target: Glycoprotein-derived oligosaccharide storage
    relationship: RECAPITULATES
    model_scale: TISSUE
    evidence:
    - reference: PMID:16377659
      reference_title: "Beta-mannosidosis mice: a model for the human lysosomal storage disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Thin-layer chromatography demonstrated an accumulation of disaccharide in epididymis and brain.
      explanation: >-
        Tissue substrate storage in the knockout mouse; human tissue composition is not inferred from this
        alone.
  - target: Lysosomal vacuolation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      Neuronal vacuolation in mice differs from the directly sampled human skin lesion; human CNS histopathology
      remains sparse.
    evidence:
    - reference: PMID:24142277
      reference_title: Distribution and Severity of Neuropathology in β-Mannosidase-Deficient Mice is Strain Dependent.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Morphological analysis indicated a severe consistent pattern of neuronal vacuolation and disintegrative
        degeneration in all five 129X1/SvJ mice.
      explanation: >-
        Background-dependent CNS pathology.
  - target: Impaired CNS myelination
    relationship: FAILS_TO_RECAPITULATE
    model_scale: TISSUE
    limitations: >-
      This mouse model did not reproduce the hypomyelination documented by MRI in a subset of humans.
    evidence:
    - reference: PMID:24142277
      reference_title: Distribution and Severity of Neuropathology in β-Mannosidase-Deficient Mice is Strain Dependent.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: >-
        Neuropathology between 1 and 9 months of age included selective, variable neuronal vacuolation with
        no hypomyelination.
      explanation: >-
        Explicit lack of the human myelin phenotype in the reported mouse analysis.
  evidence:
  - reference: PMID:16377659
    reference_title: "Beta-mannosidosis mice: a model for the human lysosomal storage disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      At >1 year of age, these mice exhibit no dysmorphology or overt neurological problems.
    explanation: >-
      Limits clinical fidelity despite the biochemical and pathological phenotype.
  - reference: PMID:24142277
    reference_title: Distribution and Severity of Neuropathology in β-Mannosidase-Deficient Mice is Strain Dependent.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: >-
      However, the mice with a mixed genetic background showed substantial variability in the severity of pathology.
    explanation: >-
      Genetic background affects expression; no specific modifier was mapped.
diagnosis:
- name: Enzyme testing with molecular confirmation
  description: >-
    Measure beta-mannosidase activity in appropriate clinical specimens and interpret against laboratory-specific
    controls. Markedly reduced or absent activity establishes the biochemical diagnosis; biallelic pathogenic
    MANBA variants clarify inheritance and enable family testing. Variants of uncertain significance alone
    are insufficient.
  evidence:
  - reference: PMID:42160655
    reference_title: Beta-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      markedly reduced or absent beta-mannosidase activity in leukocytes, serum, or plasma. Enzyme testing
      is the gold standard for diagnosis.
    explanation: >-
      Clinical diagnostic role and specimen types.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42160655
    reference_title: Beta-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Identification of biallelic pathogenic variants in MANBA by molecular genetic testing can aid in assessment
      of recurrence risk for sibs of the proband.
    explanation: >-
      Molecular testing complements the diagnostic enzyme assay.
    quote_role: REVIEW_SYNTHESIS
- name: Urinary oligosaccharide profiling
  description: >-
    Characteristic ManGlcNAc and sialylated glycan findings support the diagnosis. Interpret alongside enzyme
    and genetic results; performance estimates from mixed lysosomal-disorder validation cohorts should not
    be assigned to beta-mannosidosis alone.
  evidence:
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      ManGlcNAc and NeuManGlcNAc, known markers of the disease,1,12,48 are present in the urine of patients
      A, C, and D.
    explanation: >-
      Direct glycan profiling in the 2025 series.
- name: Audiological and neurological assessment
  description: >-
    Consider beta-mannosidosis in syndromic or apparently isolated hearing loss, otherwise unexplained hypomyelination,
    developmental or intellectual disability and behavioral abnormalities. MRI can be normal. Objective auditory
    methods can supplement behavioral audiometry when test cooperation is limited.
  evidence:
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      β-mannosidosis should be considered as a differential diagnosis in patients with syndromic or apparently
      nonsyndromic hearing loss, unexplained brain hypomyelination, behavioral disturbances, and intellectual
      disability.
    explanation: >-
      Clinical diagnostic consideration from the expanded series.
  - reference: PMID:32847582
    reference_title: "Variant c.2158-2A>G in MANBA is an important and frequent cause of hereditary hearing loss and beta-mannosidosis among the Czech and Slovak Roma population- evidence for a new ethnic-specific variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      both subjective and objective methods for audiometric examination should be used in MANBA related patients
      to properly evaluate the degree of hearing impairment.
    explanation: >-
      Addresses ascertainment and test-cooperation limitations.

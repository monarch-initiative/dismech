histopathology:
- name: Lysosomal vacuolation in skin
  description: >-
    Skin biopsy electron microscopy showed vacuolated lysosomes in vascular and lymphatic endothelium, fibroblasts,
    eccrine secretory cells, neural cells and basal keratinocytes in one patient. This is direct tissue evidence
    and does not establish the distribution of human brain pathology.
  context: Patient skin biopsy
  evidence:
  - reference: PMID:12890191
    reference_title: "Morphological and biochemical studies of human beta-mannosidosis: identification of a novel beta-mannosidase gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Electron microscopy of skin biopsy specimens from the patient showed cytoplasmic vacuolation of lysosomes
      in blood and lymph vessels, endothelial cells, fibroblasts, secretory portions of eccrine sweat glands,
      neural cells and basal keratinocytes in the epidermis.
    explanation: >-
      Direct human skin ultrastructure, not human brain neuropathology.

    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42160655
    reference_title: Beta-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      If both parents are known to be heterozygous for a MANBA pathogenic variant, each sib of an affected
      individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier,
      and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      Mendelian recurrence risks, conditional on both parents being carriers.
    quote_role: REVIEW_SYNTHESIS
- name: Hematopoietic cell transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    An HLA-matched cord-blood transplant in one boy at approximately 4.5 years normalized leukocyte enzyme
    activity and reduced urinary oligosaccharides. Early neurological worsening partly improved, but the developmental
    gap persisted and memory declined by two years. Follow-up of the same patient in 2025 documented renewed
    motor regression and worsening spasticity/ataxia. This does not establish durable neurological efficacy
    or routine use; biochemical correction is not a validated surrogate for clinical benefit.
  evidence:
  - reference: PMID:31115173
    reference_title: Biochemical and clinical response after umbilical cord blood transplant in a boy with early childhood-onset beta-mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Our findings suggest that hematopoietic cell transplant can correct the biochemical defect in β-mannosidosis,
      although preservation of the neurocognitive trajectory may be a challenge.
    explanation: >-
      Single treated patient, without an untreated comparator.
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At 10 years of age, he developed progressive regression in gross motor skills, urinary incontinence,
      low muscle bulk, axial hypotonia, end point dysmetria, and dysarthria
    explanation: >-
      Later follow-up of the same transplant recipient, not an independent treatment case.
  target_mechanisms:
  - target: MANBA lysosomal beta-mannosidase deficiency
    treatment_effect: RESTORES
    description: >-
      Restored leukocyte beta-mannosidase activity after donor-cell engraftment; correction in brain cells
      and durable clinical benefit were not established.
    evidence:
    - reference: PMID:31115173
      reference_title: Biochemical and clinical response after umbilical cord blood transplant in a boy with early childhood-onset beta-mannosidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        We show restoration of leukocyte β-mannosidase activity which remained normal at 2 years posttransplant
      explanation: >-
        Observed biochemical response in one patient.
notes: >-
  Clinical variability is substantial and genotype or residual enzyme activity alone does not predict severity.
  The recurrent Central European Roma allele has a documented regional carrier frequency, with limited transferability
  beyond the sampled populations. Alpha-mannosidosis therapies targeting MAN2B1 should not be assumed effective
  for MANBA deficiency.

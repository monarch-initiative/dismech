- name: Alpha-mannosidosis
  disease_term:
    preferred_term: alpha-mannosidosis
    term:
      id: MONDO:0009561
      label: alpha-mannosidosis
  description: >-
    Overlapping oligosacchariduria, intellectual disability, hearing loss, infections and facial changes can
    cause diagnostic confusion.
  distinguishing_features:
  - Skeletal dysplasia is more prominent in alpha-mannosidosis; beta-mannosidosis requires demonstration of the beta-mannosidase enzyme defect and appropriate MANBA interpretation.
  evidence:
  - reference: PMID:41235131
    reference_title: Expanding the Phenotype Spectrum of β-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Compared with α-mannosidosis in which skeletal dysplasia is a main feature,3 it was found in 7.4% of
      the patients with β-mannosidosis.
    explanation: >-
      Comparative clinical distinction; biochemical confirmation remains necessary.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42160655
    reference_title: Beta-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      markedly reduced or absent beta-mannosidase activity in leukocytes, serum, or plasma. Enzyme testing
      is the gold standard for diagnosis.
    explanation: >-
      Clinical diagnostic role and specimen types.
    quote_role: REVIEW_SYNTHESIS

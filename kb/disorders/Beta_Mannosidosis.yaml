    quote_role: REVIEW_SYNTHESIS
- name: Sensorineural hearing impairment
  description: >-
    Hearing impairment is common, often sensorineural and early onset, but can be recognized later or progress.
    The hearing-ascertained Roma cohort cannot estimate its population frequency; the wider 2025 review reported
    hearing loss in 74.4% of informative cases. One Roma patient also had biallelic GJB2 variants, limiting

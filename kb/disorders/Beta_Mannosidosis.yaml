- name: Lysosomal vacuolation
  description: >-
    Distended lysosomal compartments produce cytoplasmic vacuolation. Human skin biopsy and derived cell cultures
    demonstrate this lesion in several cell types. Neuronal vacuolation is established in mice; its precise
    distribution and consequences in human brain remain incompletely characterized.
  biological_scale: CELLULAR

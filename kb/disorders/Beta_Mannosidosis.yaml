- name: Genetic counseling and family evaluation
  description: >-
    Autosomal recessive counseling includes the 25% recurrence risk when both parents carry a pathogenic allele.
    Offer appropriate testing of at-risk relatives and discuss reproductive testing once familial variants
    are known.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:42160655
    reference_title: Beta-Mannosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

name: Beta Mannosidosis
synonyms:
- beta-Mannosidosis, MANBA-related
creation_date: '2025-12-19T01:18:09Z'
description: >-
  Beta-mannosidosis is an autosomal recessive lysosomal disorder caused by biallelic pathogenic MANBA variants
  and deficient beta-mannosidase activity. Incomplete N-linked glycoprotein degradation leads to oligosaccharide
  accumulation and excretion. Hearing impairment, developmental or intellectual disability and behavioral abnormalities
  are prominent, with variable skin, infectious, motor and white-matter findings. Severity varies markedly,
  including among relatives, and is not reliably predicted by genotype or residual enzyme activity. Care is
  mainly supportive; biochemical correction after transplantation in one reported patient did not establish
  durable neurological benefit.
category: Mendelian

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype was characterized by early onset of symptoms, pronounced cardiac hypertrophy, and cardiac arrhythmias."
    explanation: Hypertrophy is the defining phenotype of the founding family.
- category: Cardiac
  name: Hypertrophic Cardiomyopathy
  description: >-
    The clinical entity: a hypertrophied, non-dilated left ventricle not
    explained by another cardiac or systemic disease. Every reported MYOZ2
    proband was ascertained through this diagnosis; carriers of the p.Leu169Gly
    allele without an accompanying MYH7 variant were clinically normal.

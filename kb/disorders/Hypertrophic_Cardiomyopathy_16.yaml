genetic:
- name: MYOZ2
  gene_term:
    preferred_term: MYOZ2
    term:
      id: hgnc:1330
      label: MYOZ2
  relationship_type: DISPUTED
  notes: >-
    MYOZ2 encodes calsarcin-1 (myozenin-2), a Z-disc protein expressed in adult
    heart and slow-twitch skeletal muscle that binds calcineurin and
    alpha-actinin. Its attribution as a cause of hypertrophic cardiomyopathy is
    ClinGen Disputed (downgraded from Limited on 2022-10-27, against the generic
    hypertrophic cardiomyopathy term MONDO:0005045; see the entry notes for why
    that record is not copied into `gene_disease_validity`). The reported alleles
    are heterozygous missense; no loss-of-function or copy-number allele has been
    reported as causal.
  evidence:
  - reference: CGGV:assertion_d74395ba-66ee-43c6-8d3c-c353bd8e5e82-2022-10-27T160000.000Z
    reference_title: "MYOZ2 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The MYOZ2 gene has been related with HCM in 7 probands across 4 publications."
    explanation: >-
      ClinGen's count of the entire human genetic evidence base for the
      association.
  - reference: CGGV:assertion_d74395ba-66ee-43c6-8d3c-c353bd8e5e82-2022-10-27T160000.000Z
    reference_title: "MYOZ2 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One missense variant with experimental evidence to support its pathogenicity was identified in a patient and was shown to segregate with 5 additional family members"
    explanation: >-
      Identifies p.Ser48Pro as the single allele with both segregation and
      experimental support.
  - reference: PMID:17347475
    reference_title: "Myozenin 2 is a novel gene for human hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maximum logarithm of odds score was 2.03 (P=0.005). All affected members shared a common haplotype, implicating MYOZ2 as the causal gene."
    explanation: >-
      The linkage evidence for the founding family, with a maximum LOD of 2.03,
      below the conventional threshold of 3 for significant linkage.
  - reference: PMID:18591919
    reference_title: "Sequence analysis of myozenin 2 in 438 European patients with familial hypertrophic cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a large cohort of more than 400 patients with familial HCM was screened, a disease-associated mutation in MYOZ2 was not identified."
    explanation: Failed replication in a large familial HCM cohort.
  - reference: PMID:27532257
    reference_title: "Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and 60,706 reference samples."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, for several more recently reported HCM genes (TNNC1 21, MYOZ222, ACTN223, ANKRD124) there was no significant excess of rare genetic variation in these HCM cases."
    explanation: >-
      No significant case excess of rare MYOZ2 variation in 632 HCM cases
      against ExAC reference samples. The digits fused to the gene names are
      citation superscripts.
  - reference: PMID:28296734
    reference_title: "Genetic anticipation in a special form of hypertrophic cardiomyopathy with sudden cardiac death in a family with 74 members across 5 generations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of these subjects carried only this mutation, and their clinical manifestations and ECG findings were normal, supporting the notion that MYOZ2-L169G had few pathogenic effects in this family."
    explanation: >-
      Narrowly against p.Leu169Gly as a sufficient cause: ten carriers of the
      MYOZ2 allele alone were clinically normal. The authors suggest at most a
      modifying role alongside MYH7.
  - reference: PMID:39971408
    reference_title: "Genes Associated With Hypertrophic Cardiomyopathy: A Reappraisal by the ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "9 disputed (from limited; ANKRD1, CALR3, MYH6, MYLK2, MYOM1, MYOZ2, MYPN, TCAP, VCL)"
    explanation: >-
      The peer-reviewed reappraisal names MYOZ2 among the nine HCM genes

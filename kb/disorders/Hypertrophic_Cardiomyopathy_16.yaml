- name: Z-Disc Structural Disruption
  biological_scale: CELLULAR
  description: >-
    In mice expressing the I246M allele on a hemizygous endogenous background,
    about 14% of Z-discs are abnormal (poorly formed, interrupted, bulging or
    slipped, with myofibrillar disarray) compared with under 4% in wild-type
    transgenic controls. Phospho-ERK1/2 is higher than in wild-type transgenic
    mice, but the authors judge the data inadequate to name ERK activation as
    the driver of hypertrophy.

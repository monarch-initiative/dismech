inheritance:
- name: Autosomal dominant
  description: >-
    The founding allele segregated as an autosomal dominant trait with six
    affected heterozygotes in one family, and ClinGen records autosomal dominant
    as the mode of inheritance for the relationship it classified as Disputed.
    No other MYOZ2 allele has segregation evidence.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_d74395ba-66ee-43c6-8d3c-c353bd8e5e82-2022-10-27T160000.000Z
    reference_title: "MYOZ2 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYOZ2 | HGNC:1330 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Disputed"
    explanation: >-
      ClinGen records autosomal dominant inheritance for the MYOZ2-HCM
      relationship, in the same row that classifies it as Disputed.
  - reference: PMID:17347475
    reference_title: "Myozenin 2 is a novel gene for human hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a T-->C missense mutation corresponding to S48P substitution, which cosegregated with inheritance of HCM (N=6)"
    explanation: >-
      Heterozygous cosegregation across six affected members of one family is
      the basis for dominant transmission.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence exists for MYOZ2-attributed hypertrophic
    cardiomyopathy. The available anchors are proband yields in HCM referral
    series: one candidate missense allele in 516 North American probands and none
    in 438 European familial HCM patients. ClinGen counts seven probands across
    four publications in total.
  evidence:
  - reference: PMID:17347475
    reference_title: "Myozenin 2 is a novel gene for human hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we sequenced MYOZ2 in 516 HCM probands and detected another missense mutation (I246M)"
    explanation: >-
      One additional candidate allele in 516 probands is the founding study's
      estimate of how rarely MYOZ2 is implicated.
  - reference: PMID:18591919
    reference_title: "Sequence analysis of myozenin 2 in 438 European patients with familial hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no disease-causing mutations could be identified in this large cohort of HCM patients"
    explanation: >-
      A zero yield in 438 familial HCM patients places MYOZ2 among the rarest
      attributed causes of HCM, if it is a cause at all.
mechanistic_hypotheses:
- hypothesis_group_id: myoz2_z_disc_structural_hcm
  hypothesis_label: Calcineurin-independent Z-disc structural model of MYOZ2 hypertrophic cardiomyopathy
  status: EMERGING
  description: >-
    A heterozygous MYOZ2 missense allele produces a mutant calsarcin-1 that is
    still incorporated at the Z-disc but disrupts Z-disc structure, and the
    damaged Z-disc, a recognised signalling hub, is the stimulus for myocyte
    hypertrophy and interstitial fibrosis. The model rests on one transgenic mouse
    study of the two founding alleles; it has not been tested in human tissue or
    patient-derived cells, and ClinGen regards the human disease mechanism as
    unknown.
  evidence:
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Z disk abnormalities might provide the stimulus for the induction of cardiac hypertrophy caused by MYOZ2 mutations."
    explanation: >-
      INDIRECT (mouse): the authors' own conclusion from the transgenic allele
      models, stated as a possibility.
  - reference: CGGV:assertion_d74395ba-66ee-43c6-8d3c-c353bd8e5e82-2022-10-27T160000.000Z
    reference_title: "MYOZ2 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism for disease is unknown."
    explanation: >-
      The expert-panel judgement is why this is curated as an emerging
      hypothesis rather than an established mechanism.
- hypothesis_group_id: myoz2_calcineurin_disinhibition_hcm
  hypothesis_label: Calcineurin-NFAT disinhibition model of MYOZ2 hypertrophic cardiomyopathy
  status: ALTERNATIVE
  description: >-
    The originally proposed model: because calsarcin-1 inhibits calcineurin,
    loss of its function would release calcineurin-NFAT signalling and drive a
    hypertrophic programme. Loss-of-function mouse data support the premise, but
    the human HCM alleles lie outside the calcineurin- and alpha-actinin-binding
    regions and did not change calcineurin activity when expressed in mouse
    heart, so the model is retained as an alternative rather than the default.
  evidence:
  - reference: PMID:15543153
    reference_title: "Mice lacking calsarcin-1 are sensitized to calcineurin signaling and show accelerated cardiomyopathy in response to pathological biomechanical stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that calsarcin-1 negatively modulates the functions of calcineurin, such that calcineurin signaling was enhanced in striated muscles of mice that do not express calsarcin-1."
    explanation: >-
      INDIRECT (mouse null allele, not the human missense alleles): establishes
      the premise of the model, that loss of calsarcin-1 disinhibits
      calcineurin in vivo.
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We substantiated the null effects of MYOZ2 mutations on calcineurin activity, by multiple complementary methods. The results across methodological platforms were concordant, indicating no discernible effect."
    explanation: >-
      INDIRECT (mouse): cited against the model as applied to the human
      alleles, whose expression in mouse heart left calcineurin activity
      unchanged across several assay platforms.
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Thus, the cardiac phenotype in HCM caused by MYOZ2 mutations might be independent of calcineurin activity in the heart."
    explanation: >-
      INDIRECT (mouse): the authors' conclusion that the allele-driven
      phenotype does not depend on calcineurin, contradicting the disinhibition
      model for these alleles.

- name: Targeted Hypertrophic Cardiomyopathy Gene Panel
  description: >-
    Molecular diagnosis in HCM uses a multigene panel or exome. Because MYOZ2
    is ClinGen Disputed for HCM, a MYOZ2 variant should not be reported as
    causative or used for cascade testing, so no molecular test currently
    establishes CMH16 in a proband. The patient's hypertrophy is investigated
    and managed as HCM either way, and a negative core-gene result leaves the

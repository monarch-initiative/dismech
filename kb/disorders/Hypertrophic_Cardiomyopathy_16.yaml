phenotypes:
- category: Cardiac
  name: Left Ventricular Hypertrophy
  description: >-
    Unexplained left ventricular wall thickening is the defining feature of the
    HCM series. The founding family showed pronounced cardiac hypertrophy with
    early onset of symptoms. Beyond that family, wall-thickness data exist only
    for single panel-detected carriers, too few to describe a MYOZ2-specific
    severity pattern.
  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  frequency: VERY_FREQUENT

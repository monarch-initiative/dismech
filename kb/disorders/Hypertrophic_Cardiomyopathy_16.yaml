- name: Calcineurin-NFAT Disinhibition
  biological_scale: CELLULAR
  description: >-
    Loss of calsarcin-1 releases calcineurin from inhibition, activates a
    hypertrophic gene programme without overt hypertrophy, and enhances the
    hypertrophic response to pressure overload; conversely, calsarcin-1
    overexpression blunts angiotensin-II-induced hypertrophy. This is the
    gene's established physiological role. Whether it participates in human
    CMH16 is doubtful, because mice expressing the HCM alleles show no change in
    calcineurin activity. The node and its edges are kept, tagged with the
    alternative hypothesis group and carrying the contradicting evidence, to
    record that model; it is not wired directly to the clinical phenotypes.
  biological_processes:
  - preferred_term: calcineurin-NFAT signaling
    term:
      id: GO:0033173
      label: calcineurin-NFAT signaling cascade
    modifier: INCREASED
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0002131
      label: regular ventricular cardiac myocyte
  evidence:
  - reference: PMID:15543153
    reference_title: "Mice lacking calsarcin-1 are sensitized to calcineurin signaling and show accelerated cardiomyopathy in response to pathological biomechanical stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of calsarcin-1 also activated a hypertrophic gene program, despite the absence of hypertrophy, and enhanced the cardiac growth response to pressure overload."
    explanation: >-
      INDIRECT (mouse null allele): calcineurin disinhibition sensitises the
      heart to pressure-overload hypertrophy without causing spontaneous
      hypertrophy.
  - reference: PMID:18025526
    reference_title: "Calsarcin-1 protects against angiotensin-II induced cardiac hypertrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The sarcomeric protein CS1 prevents Ang-II-induced cardiomyocyte hypertrophy at least in part via inhibition of calcineurin signaling."
    explanation: >-
      INDIRECT (inverted, overexpression model): raising calsarcin-1 inhibits
      calcineurin-dependent hypertrophy, the converse of this node.
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "the induction of the cardiac phenotype in the mutant transgenic mice was independent of the calcineurin–NFATc pathway"
    explanation: >-
      INDIRECT (mouse): contradicts this node's relevance to the disease
      alleles specifically; the HCM alleles produced hypertrophy without
      calcineurin activation.
  downstream:
  - target: Cardiomyocyte Hypertrophy
    hypothesis_groups:
    - myoz2_calcineurin_disinhibition_hcm
    description: >-
      Calcineurin-NFAT signalling is a hypertrophic pathway, and its release by
      loss of calsarcin-1 augments stress-induced myocyte growth. Shown for the
      null allele under pressure overload, not for the human HCM alleles.
    evidence:
    - reference: PMID:15543153
      reference_title: "Mice lacking calsarcin-1 are sensitized to calcineurin signaling and show accelerated cardiomyopathy in response to pathological biomechanical stress."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The absence of calsarcin-1 also activated a hypertrophic gene program, despite the absence of hypertrophy, and enhanced the cardiac growth response to pressure overload."
      explanation: >-
        INDIRECT (mouse null allele): calcineurin disinhibition enhances the
        hypertrophic response to pressure overload but does not cause
        spontaneous hypertrophy.
    - reference: PMID:18025526
      reference_title: "Calsarcin-1 protects against angiotensin-II induced cardiac hypertrophy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The sarcomeric protein CS1 prevents Ang-II-induced cardiomyocyte hypertrophy at least in part via inhibition of calcineurin signaling."
      explanation: >-
        INDIRECT (inverted, overexpression model): blocking calcineurin via
        calsarcin-1 prevents myocyte hypertrophy, the converse of this edge.

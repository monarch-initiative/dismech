animal_models:
- name: MYOZ2 S48P and I246M transgenic mice on a Myoz2 hemizygous background
  species: Mouse
  genotype: Myh6-promoter human MYOZ2 S48P or I246M transgene; Myoz2+/- bigenic I246M line
  publication: PMID:22987565
  description: >-
    Cardiac-restricted transgenic mice expressing FLAG-tagged human wild-type or
    HCM-allele MYOZ2, including bigenic mice carrying the I246M transgene on a
    hemizygous endogenous Myoz2 background to approximate the human
    heterozygous genotype. The mutant lines develop mild myocyte and organ
    hypertrophy, interstitial fibrosis, Z-disc disruption and preserved
    systolic function, with calcineurin activity unchanged. Caveats: transgene
    protein was under half of total MYOZ2, residue 246 is valine rather than
    isoleucine in mouse, and only one S48P line expressed.
  evidence:
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our data show that the expression of mutant MYOZ2 proteins, responsible for HCM in humans, induces a mild cardiac phenotype that resembles human HCM"
    explanation: The authors' summary of the model's fidelity to human HCM.
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The expression level of the mutant MYOZ2 protein was <50% of the total MYOZ2 level in all five independent lines of mutant MYOZ2 mice, which is lower than the expected level in humans with heterozygous MYOZ2 mutations."
    explanation: Records the main limitation of the model as stated by its authors.
  modeled_mechanisms:
  - target: Z-Disc Structural Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is the only source of evidence for this node.
    limitations: >-
      Transgene overexpression on a mouse background with sub-heterozygous
      mutant protein levels; no human tissue comparison exists.
    evidence:
    - reference: PMID:22987565
      reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Electron microscopy showed disrupted and mal-aligned Z disks in the mutant mice."
      explanation: Z-disc disruption is directly observed in the model.
- name: Calsarcin-1 (Myoz2) knockout mouse
  species: Mouse
  genotype: Myoz2-/-
  publication: PMID:15543153
  description: >-
    Germline null mice lacking calsarcin-1. They have enhanced calcineurin
    signalling, an excess of slow skeletal muscle fibres, and a hypertrophic gene
    programme without baseline hypertrophy, and they show an exaggerated
    hypertrophic response to pressure overload. The model captures the gene's
    loss-of-function biology, not the human HCM alleles, which do not affect
    calcineurin activity when expressed in mouse heart.
  evidence:
  - reference: PMID:15543153
    reference_title: "Mice lacking calsarcin-1 are sensitized to calcineurin signaling and show accelerated cardiomyopathy in response to pathological biomechanical stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of calsarcin-1 also activated a hypertrophic gene program, despite the absence of hypertrophy, and enhanced the cardiac growth response to pressure overload."
    explanation: Summarises the knockout cardiac phenotype.
  modeled_mechanisms:
  - target: Calcineurin-NFAT Disinhibition
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Recapitulates calcineurin disinhibition, which is the gene's
      loss-of-function biology rather than a demonstrated feature of CMH16.
    limitations: >-
      Null allele with no spontaneous hypertrophy; the human HCM alleles are
      missense changes that did not alter calcineurin activity in mouse heart.
    evidence:
    - reference: PMID:15543153
      reference_title: "Mice lacking calsarcin-1 are sensitized to calcineurin signaling and show accelerated cardiomyopathy in response to pathological biomechanical stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that calsarcin-1 negatively modulates the functions of calcineurin, such that calcineurin signaling was enhanced in striated muscles of mice that do not express calsarcin-1."
      explanation: Calcineurin disinhibition is directly shown in the knockout.
discussions:
- discussion_id: myoz2_loss_of_function_vs_hcm_allele_mechanism
  kind: CONTROVERSY
  prompt: >-
    Do the MYOZ2 HCM alleles act through calcineurin disinhibition, the
    gene's well-established loss-of-function biology, or through a
    calcineurin-independent structural effect on the Z-disc?
  attaches_to:
  - pathophysiology#Calcineurin-NFAT Disinhibition
  - pathophysiology#Z-Disc Structural Disruption
  rationale: >-
    Knockout and overexpression studies establish calsarcin-1 as a calcineurin
    inhibitor whose loss sensitises the heart to pressure-overload hypertrophy,
    which is why the calcineurin model was proposed when the human alleles were
    found. The only study of the alleles themselves found no change in
    calcineurin activity and instead found Z-disc disruption. That study is
    limited by sub-heterozygous mutant protein levels and a human-mouse residue
    difference at position 246, and it did not test the alleles under pressure
    overload, so it does not exclude a stress-dependent calcineurin effect.
    Neither model has been tested in human cardiomyocytes.
  evidence:
  - reference: PMID:22987565
    reference_title: "Pathogenesis of hypertrophic cardiomyopathy caused by myozenin 2 mutations is independent of calcineurin activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "dissociation of the induction of cardiac hypertrophy from the calcineurin–NFATc activity does not exclude potential contribution of the calcineurin–NFATc hypertrophic pathway to the progression of cardiac hypertrophy or the response of cardiac hypertrophy to increased external load"
    explanation: >-
      The allele study's own statement of what it leaves open.
- discussion_id: myoz2_hcm_human_genetic_evidence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is MYOZ2 a Mendelian cause of HCM at all, or are the reported alleles rare
    benign variants or modifiers?
  attaches_to:
  - pathophysiology#MYOZ2 Missense Variant in Calsarcin-1
  rationale: >-
    The human evidence is one family with a sub-significant LOD score of 2.03,
    one sporadic proband allele, panel findings without segregation, and one
    allele that co-occurred with an MYH7 variant and was benign in isolation.
    Replication in 438 familial patients was negative and a case-control
    burden test in 632 cases showed no significant excess. Additional segregating families or a population burden signal
    would be needed to move the classification off Disputed.
  evidence:
  - reference: CGGV:assertion_d74395ba-66ee-43c6-8d3c-c353bd8e5e82-2022-10-27T160000.000Z
    reference_title: "MYOZ2 / hypertrophic cardiomyopathy (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More evidence is needed to either support or entirely refute the role MYOZ2 plays in this disease."
    explanation: The expert-panel statement that defines this gap.

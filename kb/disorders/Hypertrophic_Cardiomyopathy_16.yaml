name: Hypertrophic Cardiomyopathy 16
creation_date: "2026-10-13T00:00:00Z"
synonyms:
- CMH16
- MYOZ2 hypertrophic cardiomyopathy
- hypertrophic cardiomyopathy caused by mutation in MYOZ2
- hypertrophic cardiomyopathy type 16
- cardiomyopathy familial hypertrophic 16
- cardiomyopathy, familial hypertrophic, 16
- cardiomyopathy, familial hypertrophic, type 16
- cardiomyopathy, hypertrophic, 16
description: >-
  Hypertrophic cardiomyopathy 16 (CMH16) is the MYOZ2-attributed node of the
  hypertrophic cardiomyopathy gene series. MYOZ2 encodes myozenin-2, also called
  calsarcin-1, a small sarcomeric Z-disc protein of adult heart and slow-twitch
  skeletal muscle that tethers the phosphatase calcineurin to alpha-actinin and
  restrains calcineurin signalling.

  The entity rests on one linkage family and must be read with an explicit
  validity caveat. In 2007 a heterozygous p.Ser48Pro allele was found to
  cosegregate with HCM in a family with six affected members (early-onset
  symptoms, pronounced hypertrophy and arrhythmias), and a second missense allele (p.Ile246Met) was found in one
  of 516 further HCM probands. Replication failed: no disease-causing MYOZ2
  variant was found among 438 European familial HCM patients, and a burden
  analysis of 632 HCM cases sequenced for MYOZ2 against ExAC found no
  significant excess of rare MYOZ2 variation. ClinGen's Hereditary Cardiovascular Disease Gene Curation
  Expert Panel downgraded the MYOZ2-hypertrophic cardiomyopathy relationship from
  Limited to **Disputed** in October 2022, noting that the mechanism for disease
  is unknown, and its published reappraisal states that genes with disputed
  evidence are not appropriate for diagnostic reporting.

  The mechanistic picture is itself split. Loss of calsarcin-1 in mice
  disinhibits calcineurin and sensitises the heart to pressure-overload
  hypertrophy, which originally suggested a calcineurin model for the human
  alleles. But transgenic mice expressing the two human HCM alleles develop a
  mild HCM-like phenotype (myocyte hypertrophy, interstitial fibrosis, preserved
  systolic function, Z-disc disruption) with calcineurin activity unchanged,
  pointing instead to a structural Z-disc mechanism. Dismech curates CMH16 as a
  real MONDO entity whose pathophysiology is a disputed hypothesis; management is
  that of hypertrophic cardiomyopathy generally.
category: Genetic
notes: >-
  MONDO:0013455 is a child of familial hypertrophic cardiomyopathy
  (MONDO:0024573) and corresponds to OMIM 613838. The only gene attributed to it
  is MYOZ2 (hgnc:1330, chromosome 4q26), and that attribution is disputed.

  ClinGen gene-disease validity: the only ClinGen record for MYOZ2 in
  hypertrophic cardiomyopathy (CGGV assertion d74395ba, classified Disputed,
  autosomal dominant, 2022-10-27) is curated against the generic hypertrophic
  cardiomyopathy term MONDO:0005045, not against this entry's disease term, so it
  is cited as evidence throughout but is not copied into
  `genetic[].gene_disease_validity`, which is reserved for a classification of
  this entry's own MONDO disease. `relationship_type: DISPUTED` follows the same
  convention as the MYH6 (CMH14) and TCAP (CMH25) entries.

  Variant-level record. p.Ser48Pro (Osio 2007, the linkage family) is the only
  allele with segregation and experimental support. p.Ile246Met (Osio 2007) is a
  single proband allele. p.Lys12Asn and p.Leu163Ser were reported from an Italian
  NGS panel, the former in a patient who also carried an MYBPC3 variant.
  p.Leu169Gly (Guo 2017) co-occurred with MYH7 p.Ala719His in a five-generation
  Chinese pedigree; ten carriers of the MYOZ2 allele alone were clinically
  normal, and ClinGen excluded it as causative. A p.Pro109Arg variant of
  uncertain significance reported in a pediatric Vietnamese cardiomyopathy
  series is not cited because that cohort was predominantly dilated
  cardiomyopathy.

  Sudden cardiac death and genetic anticipation reported in the Guo pedigree are
  not recorded as phenotypes of this entity, because every severely affected
  member also carried the MYH7 allele.

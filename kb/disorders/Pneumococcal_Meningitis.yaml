name: Pneumococcal Meningitis
creation_date: "2026-09-25T19:58:47Z"
updated_date: "2026-09-25T19:58:47Z"
description: >-
  Pneumococcal meningitis is acute bacterial meningitis caused by Streptococcus
  pneumoniae. Disease usually begins with nasopharyngeal colonization and
  mucosal immune evasion, followed by invasive bacteremia, inflammatory
  blood-brain-barrier crossing, and bacterial replication in cerebrospinal fluid.
  The host C5-linked inflammatory response, pneumococcal pneumolysin, and direct
  neuronal and cochlear injury help drive neurologic sequelae, including altered
  mental status, seizures, and sensorineural hearing impairment.
category: Infectious Disease
synonyms:
- Streptococcus pneumoniae caused infectious meningitis
- Streptococcus pneumoniae infectious meningitis
disease_term:
  preferred_term: Pneumococcal Meningitis
  term:
    id: MONDO:0006913
    label: pneumococcal meningitis
parents:
- streptococcal meningitis
- pneumococcal infection
infectious_agent:
- name: Streptococcus pneumoniae
  description: >-
    Streptococcus pneumoniae is the pneumococcus that colonizes the nasopharynx
    and causes pneumococcal meningitis after invasive bloodstream spread into the
    central nervous system.
  infectious_agent_term:
    preferred_term: Streptococcus pneumoniae
    term:
      id: NCBITaxon:1313
      label: Streptococcus pneumoniae
  evidence:
  - reference: PMID:21734248
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common route of infection starts by nasopharyngeal colonization by
      Streptococcus pneumoniae, which must avoid mucosal entrapment and evade the
      host immune system after local activation.
    explanation: >-
      Identifies S. pneumoniae as the pathogen and nasopharyngeal colonization as
      the usual first step in pneumococcal meningitis pathogenesis. Evidence
      source is OTHER as this is a review article.
pathophysiology:
- name: Nasopharyngeal Colonization and Invasive Bacteremia
  role: trigger
  description: >-
    The encapsulated pneumococcus first colonizes the nasopharynx, adheres to
    mucosal epithelium, evades local host defenses, and enters the bloodstream.
    Bacteremia exposes the host to pneumococcal cell-wall components and starts
    complement and coagulation activation before central-nervous-system seeding.
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  evidence:
  - reference: PMID:21734248
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During invasive disease, pneumococcal epithelial adhesion is followed by
      bloodstream invasion and activation of the complement and coagulation
      systems.
    explanation: >-
      Connects epithelial adhesion by pneumococci to bloodstream invasion and
      early innate host activation. Evidence source is OTHER as this is a review
      article.
  downstream:
  - target: Blood-Brain Barrier Crossing and CSF Pneumococcal Replication
    description: >-
      Inflammatory mediator release facilitates pneumococcal crossing of the
      blood-brain barrier.

- name: Blood-Brain Barrier Crossing and CSF Pneumococcal Replication
  role: consequence
  description: >-
    Circulating pneumococci traverse the blood-brain barrier, enter the
    cerebrospinal fluid and meningeal compartment, and multiply in the
    subarachnoid space.
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: meninges
    term:
      id: UBERON:0002360
      label: meninx
  evidence:
  - reference: PMID:21734248
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The release of inflammatory mediators facilitates pneumococcal crossing of
      the blood-brain barrier into the brain, where the bacteria multiply freely
      and trigger activation of circulating antigen-presenting cells and resident
      microglial cells.
    explanation: >-
      Establishes blood-brain-barrier crossing, intracranial replication, and
      local innate-cell activation as the next pneumococcal meningitis step.
      Evidence source is OTHER as this is a review article.
  downstream:
  - target: C5-Linked Subarachnoid Inflammation
    description: >-
      Free replication in CSF activates microglia and recruited innate immune
      cells, producing massive subarachnoid inflammation.

- name: C5-Linked Subarachnoid Inflammation
  role: consequence
  description: >-
    Pneumococci in cerebrospinal fluid activate resident microglia and incoming
    antigen-presenting cells, amplifying complement and neutrophil recruitment in
    the subarachnoid space. Human CSF C5 fragments track with poor prognostic
    indicators, and C5a-receptor loss reduces CSF leukocytosis and brain damage
    in mouse pneumococcal meningitis, implicating terminal-complement signaling
    in inflammatory injury rather than as a human Mendelian cause of infection.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  evidence:
  - reference: PMID:21734248
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The resulting massive inflammation leads to further neutrophil recruitment
      and inflammation, resulting in the well-known features of bacterial
      meningitis, including cerebrospinal fluid pleocytosis, cochlear damage,
      cerebral edema, hydrocephalus, and cerebrovascular complications.
    explanation: >-
      Links pneumococcal replication in the CNS to neutrophil-rich inflammation
      and neurologic complications. Evidence source is OTHER as this is a review
      article.
  - reference: PMID:21926466
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      C5a receptor-deficient mice with pneumococcal meningitis had lower CSF wbc
      counts and decreased brain damage compared with WT mice.
    explanation: >-
      Mouse pneumococcal meningitis data show that C5a receptor signaling
      promotes CSF leukocytosis and brain damage, supporting complement
      activation as an inflammatory injury amplifier.
  downstream:
  - target: Pneumolysin-Associated Neural and Cochlear Injury
    description: >-
      Inflammatory tissue injury combines with pneumococcal toxin effects to
      damage neurons and the cochlea.

- name: Pneumolysin-Associated Neural and Cochlear Injury
  role: consequence
  description: >-
    Pneumococcal pneumolysin directly injures neurons by perturbing calcium,
    the actin cytoskeleton, and mitochondrial membranes, while pneumolysin also
    contributes to cochlear hair-cell loss. These cytotoxic effects add to
    subarachnoid inflammation as cellular explanations for neurologic sequelae
    and post-meningitic sensorineural hearing loss.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:33760879
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pneumococcal infection promotes neuronal death possibly due to increased
      intracellular Ca2+ levels depending on presence of Ply, as well as on actin
      cytoskeleton disassembly.
    explanation: >-
      Human-primary-neuron and mouse-model experiments implicate pneumolysin in
      calcium-linked and actin-linked neuronal death; the quoted mechanism itself
      comes from the in-vitro neuronal work.
  - reference: PMID:17562768
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pneumolysin colocalized with mitochondrial membranes, altered the
      mitochondrial membrane potential, and caused the release of
      apoptosis-inducing factor and cell death.
    explanation: >-
      Primary-neuron experiments show that pneumolysin can drive neuronal cell
      death through mitochondrial damage.
  - reference: PMID:28460251
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a wild type D39 strain and a mutant defective for the pneumolysin
      (PLY) gene, we also have shown that the toxin PLY is an important factor
      involved in ototoxic damages.
    explanation: >-
      Organ-of-Corti explant work implicates pneumolysin in pneumococcus-induced
      cochlear hair-cell damage, connecting the pathogen to hearing-loss
      sequelae.
  downstream: []
phenotypes:
- category: Constitutional
  name: Fever
  description: >-
    Fever is a common acute presentation at admission.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:16253143
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission, fever and an altered mental status were the most frequent
      findings (in 93% and 94% of cases, respectively), whereas back rigidity,
      headache and convulsion were found in 57%, 41% and 11% of cases,
      respectively.
    explanation: >-
      Nationwide Danish pneumococcal meningitis cohort finding fever in 93% of
      cases at admission, within the VERY_FREQUENT band.
- category: Neurological
  name: Altered Mental Status
  description: >-
    Reduced consciousness or confusion is part of the acute meningitis
    presentation and was the most common admission finding in a Danish
    pneumococcal meningitis cohort.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Altered Mental Status
    term:
      id: HP:0004372
      label: Reduced consciousness
  evidence:
  - reference: PMID:16253143
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission, fever and an altered mental status were the most frequent
      findings (in 93% and 94% of cases, respectively), whereas back rigidity,
      headache and convulsion were found in 57%, 41% and 11% of cases,
      respectively.
    explanation: >-
      Reports altered mental status in 94% of pneumococcal meningitis cases at
      admission, within the VERY_FREQUENT band.
- category: Neurological
  name: Neck Stiffness
  description: >-
    Meningeal irritation commonly presents as neck or back rigidity.
  frequency: FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Neck Stiffness
    term:
      id: HP:0025258
      label: Stiff neck
  evidence:
  - reference: PMID:16253143
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission, fever and an altered mental status were the most frequent
      findings (in 93% and 94% of cases, respectively), whereas back rigidity,
      headache and convulsion were found in 57%, 41% and 11% of cases,
      respectively.
    explanation: >-
      Reports back rigidity in 57% of pneumococcal meningitis cases at admission,
      within the FREQUENT band and compatible with a neck-stiffness HPO binding
      for meningeal rigidity.
- category: Neurological
  name: Headache
  description: >-
    Headache is a frequent presenting symptom of acute pneumococcal meningitis.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:16253143
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission, fever and an altered mental status were the most frequent
      findings (in 93% and 94% of cases, respectively), whereas back rigidity,
      headache and convulsion were found in 57%, 41% and 11% of cases,
      respectively.
    explanation: >-
      Reports headache in 41% of pneumococcal meningitis cases at admission,
      within the FREQUENT band.
- category: Neurological
  name: Seizure
  description: >-
    Convulsions occur in a minority of acute pneumococcal meningitis cases and
    are associated with fatal outcome in the Danish cohort.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:16253143
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent prognostic factor associated with fatal outcome in multivariate
      logistic regression analysis was convulsions (OR: 4.53, 95%CI:
      (1.74-11.8), p = 0.002), whereas presence of an otogenic focus was
      independently associated with a better survival (OR: 6.09, 95%CI:
      (1.75-21.2), P = 0.005).
    explanation: >-
      Identifies convulsions as a clinically important pneumococcal meningitis
      manifestation associated with fatal outcome in multivariate analysis.
- category: Neurological
  name: Sensorineural Hearing Impairment
  description: >-
    Post-meningitic cochlear injury can leave survivors with sensorineural
    hearing impairment.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Sensorineural Hearing Impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:16253143
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      41% of survivors had neurological sequelae (hearing loss: 24%, focal
      neurological deficits: 16%, and the combination of both: 1%).
    explanation: >-
      Reports hearing loss in 24% of pneumococcal meningitis survivors in the
      nationwide Danish cohort, within the OCCASIONAL band.
treatments:
- name: Empiric Antibiotic Therapy
  description: >-
    Suspected community-acquired bacterial meningitis, including suspected
    pneumococcal meningitis, requires empiric intravenous antibiotics started
    immediately and tailored by age, risk factors, and local pneumococcal
    resistance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:28478238
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ESCMID guideline advises to start empiric treatment within one hour of
      arrival in all suspected meningitis cases, and choice of antibiotics needs
      to be differentiated according to the patient's age, risk factors, and
      local resistance rates of pneumococci.
    explanation: >-
      Summarizes guideline advice to start empiric antibiotics urgently and
      account for pneumococcal resistance. Evidence source is OTHER as this is a
      review of guideline features.
  target_mechanisms:
  - target: Blood-Brain Barrier Crossing and CSF Pneumococcal Replication
    treatment_effect: INHIBITS
    description: >-
      Antibacterial therapy kills or inhibits pneumococci replicating in CSF.
- name: Adjunctive Dexamethasone
  description: >-
    Dexamethasone is given before or with the first antibiotic dose in
    community-acquired bacterial meningitis to dampen the inflammatory cascade
    triggered by bacterial lysis and subarachnoid infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  evidence:
  - reference: PMID:28478238
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dexamethasone is the only proven adjunctive treatment and should be started
      together with the antibiotics.
    explanation: >-
      States the timing and unique evidence status of dexamethasone as adjunctive
      therapy in acute bacterial meningitis. Evidence source is OTHER as this is
      a review of guideline features.
  target_mechanisms:
  - target: C5-Linked Subarachnoid Inflammation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroid treatment suppresses the injurious subarachnoid
      inflammatory cascade.
- name: Pneumococcal Vaccination
  description: >-
    Pneumococcal conjugate vaccination reduces pneumococcal meningitis incidence
    across age groups through prevention of vaccine-type invasive pneumococcal
    disease.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:39864526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pneumococcal meningitis declined in all age groups following PCV10/PCV13
      introduction.
    explanation: >-
      Global surveillance data from 42 sites in 30 countries show reduced
      pneumococcal meningitis after PCV10/PCV13 introduction.
  target_mechanisms:
  - target: Nasopharyngeal Colonization and Invasive Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Conjugate vaccination prevents vaccine-type invasive pneumococcal disease
      upstream of bloodstream and CNS invasion.
notes: >-
  Curated for the bacterial/archaeal infectious-disease expansion. The
  OpenScientist report named host complement genes among susceptibility or
  modifier genes; these were not modeled as disease etiology because MONDO does
  not assert a causal human gene and the human infection is acquired. C5 is
  represented only in the inflammatory pathophysiology node supported by human
  CSF correlation and mouse C5aR perturbation data.

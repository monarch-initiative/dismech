- name: Streptococcus pneumoniae
  description: >-
    Streptococcus pneumoniae is the pneumococcus that colonizes the nasopharynx
    and causes pneumococcal meningitis after invasive bloodstream or contiguous
    spread into the central nervous system.
  infectious_agent_term:
    preferred_term: Streptococcus pneumoniae
    term:
      id: NCBITaxon:1313
      label: Streptococcus pneumoniae
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The most common route of infection starts by nasopharyngeal colonization by
      Streptococcus pneumoniae, which must avoid mucosal entrapment and evade the
      host immune system after local activation.
    explanation: >-
      Identifies S. pneumoniae as the pathogen and nasopharyngeal colonization as
      the usual first step in pneumococcal meningitis pathogenesis.
prevalence:
- population: Global PCV10/PCV13 surveillance sites, all ages
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    The PSERENADE surveillance synthesis reported incidence-rate ratios rather
    than a single pooled absolute annual incidence; it showed lower annual
    incidence six years after national PCV10/PCV13 introduction in children,
    adolescents, and adults.
  evidence:
  - reference: PMID:39864526
    reference_title: "Global impact of 10- and 13-valent pneumococcal conjugate vaccines on pneumococcal meningitis in all ages: The PSERENADE project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study evaluated long-term direct and indirect effects of PCV10 or
      PCV13 used in national infant immunization programs on pneumococcal
      meningitis in all ages globally.
    explanation: >-
      PSERENADE is an incidence surveillance study of pneumococcal meningitis
      across all age groups after PCV10/PCV13 rollout.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Pneumococcal meningitis is life-threatening and globally remains a major
    contributor to pediatric deaths and disability-adjusted life years despite
    substantial declines after conjugate-vaccine introduction.
  evidence:
  - reference: PMID:42071803
    reference_title: "Disease burden of Streptococcus pneumoniae and Neisseria meningitidis meningitis in children and adolescents: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2021, SPM caused 20,718 deaths (95% UI 14,718-29,192) and 1,823,058
      disability-adjusted life years (DALYs; 95% UI 1,301,814-2,561,107), while
      NMM caused 17,389 deaths (95% UI 12,705-23,603) and 1,552,383 DALYs (95%
      UI 1,146,164-2,096,751) among those aged 0 to 19.
    explanation: >-
      GBD 2021 estimates quantify the global mortality and disability burden of
      Streptococcus pneumoniae meningitis in children and adolescents.
pathophysiology:
- name: Nasopharyngeal Colonization
  role: trigger
  description: >-
    Encapsulated pneumococci colonize the nasopharynx, adhere to mucosal
    epithelium, avoid mucosal entrapment, and evade local host defenses.
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The most common route of infection starts by nasopharyngeal colonization by
      Streptococcus pneumoniae, which must avoid mucosal entrapment and evade the
      host immune system after local activation.
    explanation: >-
      Places pneumococcal nasopharyngeal colonization and local immune evasion at
      the start of the canonical meningitis route.
  downstream:
  - target: Invasive Pneumococcal Bacteremia
    causal_link_type: DIRECT
    description: >-
      Adhesion and mucosal escape let pneumococci invade the bloodstream.

- name: Invasive Pneumococcal Bacteremia
  role: consequence
  description: >-
    Pneumococci enter the bloodstream, circulate with pneumococcal cell-wall
    components, and activate complement and coagulation pathways before central
    nervous system seeding.
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      During invasive disease, pneumococcal epithelial adhesion is followed by
      bloodstream invasion and activation of the complement and coagulation
      systems.
    explanation: >-
      Connects epithelial adhesion by pneumococci to bloodstream invasion and
      early innate host activation.
  downstream:
  - target: Blood-Brain Barrier Crossing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - inflammatory mediator release
    description: >-
      Bloodstream organisms and their inflammatory mediators promote traversal of
      the blood-brain barrier into the meningeal compartment.

- name: Blood-Brain Barrier Crossing
  role: consequence
  description: >-
    Circulating pneumococci traverse the blood-brain barrier and enter the
    cerebrospinal fluid and meningeal compartment.
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  - preferred_term: meninges
    term:
      id: UBERON:0002360
      label: meninx
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The release of inflammatory mediators facilitates pneumococcal crossing of
      the blood-brain barrier into the brain, where the bacteria multiply freely
      and trigger activation of circulating antigen-presenting cells and resident
      microglial cells.
    explanation: >-
      Establishes blood-brain-barrier crossing as the transition from invasive
      bloodstream disease to pneumococcal infection inside the CNS.
  downstream:
  - target: CSF Pneumococcal Replication
    causal_link_type: DIRECT
    description: >-
      Once pneumococci enter CSF they multiply freely in that poorly opsonic
      compartment.

- name: CSF Pneumococcal Replication
  role: consequence
  description: >-
    Pneumococci multiply in cerebrospinal fluid and the subarachnoid space,
    exposing resident microglia and recruited antigen-presenting cells to
    pneumococcal antigens and toxins.
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The release of inflammatory mediators facilitates pneumococcal crossing of
      the blood-brain barrier into the brain, where the bacteria multiply freely
      and trigger activation of circulating antigen-presenting cells and resident
      microglial cells.
    explanation: >-
      Supports free intracranial pneumococcal replication and the first innate
      immune-cell activation triggered by organisms in the CNS.
  downstream:
  - target: C5-Linked Subarachnoid Inflammation
    causal_link_type: DIRECT
    description: >-
      Replicating pneumococci activate local innate immune cells and complement,
      producing a neutrophilic subarachnoid inflammatory response.
  - target: Pneumolysin-Associated Neural and Cochlear Injury
    causal_link_type: DIRECT
    description: >-
      Pneumococci in the CSF and adjacent inner-ear spaces release pneumolysin,
      a direct toxin for neurons and cochlear sensory cells.

- name: C5-Linked Subarachnoid Inflammation
  role: consequence
  description: >-
    Pneumococci in cerebrospinal fluid activate resident microglia and incoming
    antigen-presenting cells, amplifying complement and neutrophil recruitment in
    the subarachnoid space. Human CSF C5 fragments track with poor prognostic
    indicators, and C5a-receptor loss reduces CSF leukocytosis and brain damage
    in mouse pneumococcal meningitis, implicating terminal-complement signaling
    in inflammatory injury rather than as a human Mendelian cause of infection.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  evidence:
  - reference: PMID:21734248
    reference_title: Pathogenesis and pathophysiology of pneumococcal meningitis.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The resulting massive inflammation leads to further neutrophil recruitment
      and inflammation, resulting in the well-known features of bacterial
      meningitis, including cerebrospinal fluid pleocytosis, cochlear damage,
      cerebral edema, hydrocephalus, and cerebrovascular complications.
    explanation: >-
      Links pneumococcal replication in the CNS to neutrophil-rich inflammation
      and neurologic complications.
  - reference: PMID:21926466
    reference_title: Complement component 5 contributes to poor disease outcome in humans and mice with pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      C5a receptor-deficient mice with pneumococcal meningitis had lower CSF wbc
      counts and decreased brain damage compared with WT mice.
    explanation: >-
      Mouse pneumococcal meningitis data show that C5a receptor signaling
      promotes CSF leukocytosis and brain damage, supporting complement
      activation as an inflammatory injury amplifier.
  downstream:
  - target: MMP- and ROS-Mediated Brain Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - inflammatory cytokine and chemokine release
    - leukocyte-derived reactive oxygen species
    description: >-
      Neutrophil-rich inflammation up-regulates matrix metalloproteinases and
      reactive oxygen species that injure barrier and neural tissue.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - endogenous pyrogen signaling
    description: >-
      Acute subarachnoid innate inflammation produces systemic febrile signaling.
  - target: Neck Stiffness
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - meningeal irritation
    description: >-
      Meningeal inflammation causes the stiffness and back rigidity observed in
      acute bacterial meningitis.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - meningeal irritation
    description: >-
      Inflamed meninges generate the pain phenotype that presents as headache.
  - target: Cerebral Edema
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - blood-brain barrier leakage
    - vascular permeability
    description: >-
      Subarachnoid inflammation disrupts barrier function and promotes brain
      swelling.
  - target: Hydrocephalus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - inflammatory obstruction of CSF flow and resorption
    description: >-
      Exudative meningeal inflammation can impair CSF circulation and resorption,
      producing hydrocephalus.

- name: MMP- and ROS-Mediated Brain Injury
  role: consequence
  description: >-
    Matrix metalloproteinase activity cleaves extracellular matrix, disrupts the
    blood-brain barrier, and amplifies cytokine signaling, while reactive oxygen
    species in infected brain tissue damage neuronal DNA and contribute to cell
    death.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:25890041
    reference_title: The matrix metalloproteinase inhibitor RS-130830 attenuates brain injury in experimental pneumococcal meningitis.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Matrix metalloproteinases (MMPs) play a critical role in the
      pathophysiology of PM.
    explanation: >-
      Identifies MMP activity as a recognized mediator of pneumococcal
      meningitis pathophysiology.
  - reference: PMID:29233148
    reference_title: DNA repair protein APE1 is involved in host response during pneumococcal meningitis and its expression can be modulated by vitamin B6.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CONCLUSIONS: Our data suggest that PM affects APE1 expression, which can
      be modulated by vitB6. Additionally, vitB6 contributes to the reduction of
      glutamate and ROS levels.
    explanation: >-
      Infant-rat pneumococcal meningitis experiments connect the infection to
      APE1-linked oxidative stress and reactive-oxygen injury in cortex and
      hippocampus.
  downstream:
  - target: Altered Mental Status
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cortical and hippocampal neuronal injury
    description: >-
      Inflammatory brain injury disrupts CNS function and contributes to reduced
      consciousness or confusion.
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cortical necrosis
    - edema-associated neuronal hyperexcitability
    description: >-
      Cortical injury and swelling create a substrate for convulsions during
      acute pneumococcal meningitis.

- name: Pneumolysin-Associated Neural and Cochlear Injury
  role: consequence
  description: >-
    Pneumococcal pneumolysin directly injures neurons by perturbing calcium, the
    actin cytoskeleton, and mitochondrial membranes, while pneumolysin also
    contributes to cochlear hair-cell loss. These cytotoxic effects add to
    subarachnoid inflammation as cellular explanations for neurologic sequelae
    and post-meningitic sensorineural hearing loss.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:33760879
    reference_title: Neuronal death in pneumococcal meningitis is triggered by pneumolysin and RrgA interactions with β-actin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pneumococcal infection promotes neuronal death possibly due to increased
      intracellular Ca2+ levels depending on presence of Ply, as well as on actin
      cytoskeleton disassembly.
    explanation: >-
      Human-primary-neuron and mouse-model experiments implicate pneumolysin in
      calcium-linked and actin-linked neuronal death; the quoted mechanism itself
      comes from the in-vitro neuronal work.
  - reference: PMID:17562768
    reference_title: Pneumolysin causes neuronal cell death through mitochondrial damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pneumolysin colocalized with mitochondrial membranes, altered the
      mitochondrial membrane potential, and caused the release of
      apoptosis-inducing factor and cell death.
    explanation: >-
      Primary-neuron experiments show that pneumolysin can drive neuronal cell
      death through mitochondrial damage.
  - reference: PMID:28460251
    reference_title: Streptococcus pneumoniae-induced ototoxicity in organ of Corti explant cultures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a wild type D39 strain and a mutant defective for the pneumolysin
      (PLY) gene, we also have shown that the toxin PLY is an important factor
      involved in ototoxic damages.
    explanation: >-
      Organ-of-Corti explant work implicates pneumolysin in pneumococcus-induced
      cochlear hair-cell damage, connecting the pathogen to hearing-loss
      sequelae.
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
    description: >-
      Pneumolysin-mediated cochlear hair-cell toxicity contributes directly to
      post-meningitic sensorineural hearing impairment.
phenotypes:
- category: Constitutional
  name: Fever
  description: >-

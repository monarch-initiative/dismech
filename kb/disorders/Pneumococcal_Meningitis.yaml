environmental:
- name: Primary otogenic, pneumonic, and sinusitic foci
  influences_mechanisms:
  - target: Invasive Pneumococcal Bacteremia
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Pulmonary foci can feed hematogenous spread, while ear and sinus foci mark
      the contiguous head-and-neck infections from which pneumococci can reach
      the meninges. The cohort recorded ear, lung, and sinus foci immediately
      upstream of pneumococcal meningitis rather than as isolated exposures.
  description: >-
    Pneumococcal infection in the ear, lung, or sinuses can act as a primary
    focus before meningeal invasion.
  effect: Predisposes to pneumococcal CNS invasion
  evidence:
  - reference: PMID:16253143
    reference_title: Clinical presentation and prognostic factors of Streptococcus pneumoniae meningitis according to the focus of infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      187 consecutive cases with S. pneumoniae meningitis were included in the
      study. The most common focus was ear (30%), followed by lung (18%), sinus
      (8%), and other (2%).
    explanation: >-
      Disease-specific cohort data identify ear, lung, and sinus infections as
      common primary foci in pneumococcal meningitis.
treatments:
- name: Empiric Antibiotic Therapy
  description: >-
    Suspected community-acquired bacterial meningitis, including suspected
    pneumococcal meningitis, requires empiric intravenous antibiotics started
    immediately and tailored by age, risk factors, and local pneumococcal
    resistance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:28478238
    reference_title: "Update on community-acquired bacterial meningitis: guidance and challenges."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The ESCMID guideline advises to start empiric treatment within one hour of
      arrival in all suspected meningitis cases, and choice of antibiotics needs
      to be differentiated according to the patient's age, risk factors, and
      local resistance rates of pneumococci.
    explanation: >-
      Summarizes guideline advice to start empiric antibiotics urgently and
      account for pneumococcal resistance.
  target_mechanisms:
  - target: CSF Pneumococcal Replication
    treatment_effect: INHIBITS
    description: >-
      Antibacterial therapy kills or inhibits pneumococci replicating in CSF.
- name: Adjunctive Dexamethasone
  description: >-
    Dexamethasone is given before or with the first antibiotic dose in
    community-acquired bacterial meningitis to dampen the inflammatory cascade
    triggered by bacterial lysis and subarachnoid infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  evidence:
  - reference: PMID:28478238
    reference_title: "Update on community-acquired bacterial meningitis: guidance and challenges."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Dexamethasone is the only proven adjunctive treatment and should be started
      together with the antibiotics.
    explanation: >-
      States the timing and unique evidence status of dexamethasone as
      adjunctive therapy in acute bacterial meningitis.
  target_mechanisms:
  - target: C5-Linked Subarachnoid Inflammation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroid treatment suppresses the injurious subarachnoid
      inflammatory cascade.
- name: Pneumococcal Vaccination
  description: >-
    Pneumococcal conjugate vaccination reduces pneumococcal meningitis incidence
    across age groups through prevention of vaccine-type invasive pneumococcal
    disease.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:39864526
    reference_title: "Global impact of 10- and 13-valent pneumococcal conjugate vaccines on pneumococcal meningitis in all ages: The PSERENADE project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pneumococcal meningitis declined in all age groups following PCV10/PCV13
      introduction.
    explanation: >-
      Global surveillance data from 42 sites in 30 countries show reduced
      pneumococcal meningitis after PCV10/PCV13 introduction.
  target_mechanisms:
  - target: Nasopharyngeal Colonization
    treatment_effect: INHIBITS
    description: >-
      Conjugate vaccination prevents vaccine-type invasive pneumococcal disease
      upstream of bloodstream and CNS invasion.
diagnosis:
- name: CSF culture or blood culture with CSF pleocytosis
  description: >-
    Pneumococcal meningitis is confirmed by culturing S. pneumoniae from CSF, or
    by S. pneumoniae bacteremia together with CSF pleocytosis.
  evidence:
  - reference: PMID:16253143
    reference_title: Clinical presentation and prognostic factors of Streptococcus pneumoniae meningitis according to the focus of infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pneumococcal meningitis was defined as a CSF culture with S. pneumoniae or
      CSF pleocytosis (≥ 10 leukocytes/mL) in conjunction with a blood culture of
      S. pneumoniae [18].
    explanation: >-
      Gives the microbiologic and CSF-pleocytosis case definition used in a
      nationwide pneumococcal meningitis cohort.
- name: CSF lactate measurement
  description: >-
    CSF lactate helps differentiate bacterial meningitis from aseptic meningitis,
    though antibiotic pretreatment lowers its sensitivity.
  results: >-
    Meta-analysis pooled sensitivity 0.93 and specificity 0.96 for
    differentiating bacterial from aseptic meningitis.
  evidence:
  - reference: PMID:21382412
    reference_title: "Diagnostic accuracy of cerebrospinal fluid lactate for differentiating bacterial meningitis from aseptic meningitis: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled test characteristics of CSF lactate were sensitivity 0.93 (95%
      CI: 0.89-0.96), specificity 0.96 (95% CI: 0.93-0.98), likelihood ratio
      positive 22.9 (95% CI: 12.6-41.9), likelihood ratio negative 0.07 (95% CI:
      0.05-0.12), and diagnostic odds ratio 313 (95% CI: 141-698).
    explanation: >-
      Quantifies CSF lactate performance as a bacterial-versus-aseptic
      meningitis discriminator relevant to the acute pneumococcal meningitis
      workup.
animal_models:
- name: Infant rat intracisternal pneumococcal meningitis model
  species: Rat
  genotype: Wild-type infant rats
  publication: PMID:25890041
  description: >-
    Infant rats infected by intracisternal live S. pneumoniae injection and
    treated with ceftriaxone recapitulate cortical necrosis, CSF leukocytosis,
    cytokine activation, and hippocampal apoptosis during experimental
    pneumococcal meningitis.
  modeled_mechanisms:
  - target: MMP- and ROS-Mediated Brain Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model develops cortical necrosis and hippocampal apoptosis, and
      pharmacologic MMP inhibition attenuates cortical brain injury.
    limitations: >-
      Intracisternal inoculation bypasses natural nasopharyngeal colonization,
      bloodstream invasion, and blood-brain-barrier traversal, so the model is
      most faithful for post-entry inflammatory injury.
  evidence:
  - reference: PMID:25890041
    reference_title: The matrix metalloproteinase inhibitor RS-130830 attenuates brain injury in experimental pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A well-established infant rat model of PM was used where live Streptococcus
      pneumoniae were injected intracisternally and antibiotic treatment with
      ceftriaxone was initiated 18 h post infection (hpi).
    explanation: >-
      Documents the pneumococcal meningitis infant-rat model and its
      intracisternal inoculation plus antibiotic-treatment design.
- name: C5aR-deficient mouse pneumococcal meningitis model
  species: Mouse
  genotype: C5ar1 knockout
  publication: PMID:21926466
  description: >-
    Pneumococcus-infected C5a-receptor-deficient mice test whether terminal
    complement signaling amplifies CSF inflammation and parenchymal brain damage.
  modeled_mechanisms:
  - target: C5-Linked Subarachnoid Inflammation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      C5aR deletion reduces CSF leukocytosis and brain damage after pneumococcal
      meningitis challenge, functionally testing the C5 arm of this node.
    limitations: >-
      The genotype is a pathway perturbation rather than a natural human
      susceptibility genotype for acquired pneumococcal meningitis.
  evidence:
  - reference: PMID:21926466
    reference_title: Complement component 5 contributes to poor disease outcome in humans and mice with pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      C5a receptor-deficient mice with pneumococcal meningitis had lower CSF wbc
      counts and decreased brain damage compared with WT mice.
    explanation: >-
      Shows that C5aR perturbation attenuates two inflammatory readouts in mouse
      pneumococcal meningitis.
notes: >-
  Curated for the bacterial/archaeal infectious-disease expansion. The
  OpenScientist report named host complement genes among susceptibility or
  modifier loci, but the first-pass entry keeps top-level genetic etiology empty
  because Pneumococcal Meningitis is agent-defined and acquired, and the reported
  C5, MBL2, CFH, and C2 findings were host-risk modifiers with heterogeneous
  replication rather than MONDO causal genes. Susceptibility loci are compatible
  with Genetic.relationship_type = SUSCEPTIBILITY and can be added in a future
  host-genetics pass; here, C5 is represented only in the inflammatory
  pathophysiology node supported by human CSF correlation and mouse C5aR
  perturbation data.

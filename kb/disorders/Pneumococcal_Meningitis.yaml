name: Pneumococcal Meningitis
creation_date: "2026-09-25T19:58:47Z"
updated_date: "2026-09-25T19:58:47Z"
description: >-
  Pneumococcal meningitis is acute bacterial meningitis caused by Streptococcus
  pneumoniae. Disease usually starts when encapsulated pneumococci colonize the
  nasopharynx and then either enter the bloodstream or spread from a contiguous
  ear or sinus focus into the meningeal compartment. Pneumococcal replication in
  cerebrospinal fluid drives C5-linked neutrophilic subarachnoid inflammation,
  matrix-metalloproteinase and reactive-oxygen injury, and pneumolysin-mediated
  neuronal and cochlear damage, producing acute fever, headache, meningismus,
  altered mental status, seizures, cerebral edema, hydrocephalus, and
  post-meningitic sensorineural hearing impairment.
category: Infectious Disease
synonyms:
- Streptococcus pneumoniae caused infectious meningitis
- Streptococcus pneumoniae infectious meningitis

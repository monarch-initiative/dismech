    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:16253143
    reference_title: Clinical presentation and prognostic factors of Streptococcus pneumoniae meningitis according to the focus of infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission, fever and an altered mental status were the most frequent
      findings (in 93% and 94% of cases, respectively), whereas back rigidity,
      headache and convulsion were found in 57%, 41% and 11% of cases,
      respectively.
    explanation: >-
      Nationwide Danish pneumococcal meningitis cohort finding fever in 93% of
      cases at admission, within the VERY_FREQUENT band.

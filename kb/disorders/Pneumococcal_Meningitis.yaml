  evidence:
  - reference: PMID:16253143
    reference_title: Clinical presentation and prognostic factors of Streptococcus pneumoniae meningitis according to the focus of infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent prognostic factor associated with fatal outcome in multivariate
      logistic regression analysis was convulsions (OR: 4.53, 95%CI:
      (1.74-11.8), p = 0.002), whereas presence of an otogenic focus was
      independently associated with a better survival (OR: 6.09, 95%CI:

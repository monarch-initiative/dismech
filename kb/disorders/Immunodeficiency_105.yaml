genetic:
- name: PTPRC
  gene_term:
    preferred_term: PTPRC
    term:
      id: hgnc:9666
      label: PTPRC
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants in PTPRC on chromosome 1q31.3. Reported
    mechanisms are a large deletion in trans with an intervening-sequence 13 donor
    splice-site change, a homozygous in-frame six-base-pair deletion removing
    Glu339 and Tyr340, and uniparental isodisomy of chromosome 1 making a single
    maternal allele homozygous. The last of these is worth remembering as a
    general lesson: the patient looked homozygous for a variant found in only one
    parent.
  evidence:
  - reference: PMID:11145714
    reference_title: "A deletion in the gene encoding the CD45 antigen in a patient with SCID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the second description of a clinically relevant CD45 mutation, provides direct evidence for the importance of CD45 in immune function in humans, and suggests that abnormalities in CD45 expression are a possible cause of SCID in humans."
    explanation: >-
      The second independent human case, which is what moved CD45 deficiency from
      a single observation to an established cause.
  - reference: PMID:22689986
    reference_title: "CD45-deficient severe combined immunodeficiency caused by uniparental disomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient SNP array analysis revealed no change in copy number but loss of heterozygosity for the entire length of chromosome 1 (Chr1), indicating that disease was caused by uniparental disomy (UPD) with isodisomy of the entire maternal Chr1 bearing the mutant CD45 allele."
    explanation: >-
      Documents the uniparental isodisomy route to biallelic loss, and with it the
      diagnostic trap of an apparently homozygous variant present in one parent only.
- name: PTPRC C77G
  gene_term:
    preferred_term: PTPRC
    term:
      id: hgnc:9666
      label: PTPRC
  association: Susceptibility variant, not a cause of this disease
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Recorded here specifically so it is not mistaken for a cause of this disease.
    C77G is a common isoform-altering polymorphism in PTPRC exon 4 that disrupts
    an exonic splicing silencer and causes aberrant retention of CD45RA on
    activated and memory T cells. It is enriched in autoimmune and infectious
    disease cohorts and alters CD45 isoform expression rather than abolishing the
    protein, so it belongs to a different mechanistic class from the biallelic
    null variants that cause immunodeficiency 105. A literature search on PTPRC
    returns the polymorphism far more often than the deficiency, which is why the
    distinction is worth making explicitly in the entry rather than leaving it to
    the reader.
  evidence:
  - reference: PMID:18312479
    reference_title: "PTPRC (CD45) variation and disease association studied using single nucleotide polymorphism tagging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two polymorphisms (C77G and A138G), which alter CD45 isoform expression, are associated with autoimmune and infectious diseases."
    explanation: >-
      Establishes that these are isoform-altering susceptibility alleles, which is
      a different claim from causing severe combined immunodeficiency.
animal_models:
- name: Ptprc (CD45) null mouse
  species: Mouse
  genotype: Ptprc targeted null, all isoforms absent, homozygous
  publication: PMID:8666928
  description: >-
    Gene-targeted mouse lacking every CD45 isoform. It reproduces the human
    immunophenotype in the direction that matters, T cells reduced and B cells
    preserved or increased, and it is the only source of staged developmental and
    selection data for this disease, since the human cases are too few for that
    kind of analysis.
  modeled_mechanisms:
  - target: Arrest of Thymocyte Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      A two-stage developmental block with impaired T-cell-receptor-dependent
      selection, in the same cell type and at the same checkpoints proposed for
      the human disease.
    limitations: >-
      The mouse is a complete null of every isoform; the human alleles abolish
      surface expression by different routes and have not been shown to be
      equivalent nulls. Mouse T lymphopenia is partial, roughly a fivefold
      reduction in splenic T cells, whereas the human phenotype is described as
      T-negative severe combined immunodeficiency, so the model is milder than
      the disease it stands in for.
    readouts:
    - name: Splenic T cell number
      target: Arrest of Thymocyte Development
      direction: DECREASED
      interpretation: >-
        The peripheral consequence of the thymic block, measured against
        littermate controls.
      evidence:
      - reference: PMID:8666928
        reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The spleens from CD45-null mice contain approximately twice the number of B cells and one fifth the number of T cells found in normal controls."
        explanation: "Quantifies the T-cell reduction, and simultaneously the preserved B-cell compartment."
    - name: Thymocyte apoptosis on T-cell receptor crosslinking
      target: Arrest of Thymocyte Development
      direction: DECREASED
      interpretation: >-
        Impaired negative selection. Paired with a preserved response to
        non-receptor signals, this is what places the lesion in receptor-proximal
        signalling rather than in the apoptotic machinery itself.
      evidence:
      - reference: PMID:8666928
        reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we demonstrate that CD45-null thymocytes are severely impaired in their apoptotic response to cross-linking signals via T cell receptor (TCR) in fetal thymic organ culture. In contrast, apoptosis can be induced normally in CD45-null thymocytes by non-TCR-mediated signals."
        explanation: "The paired positive and negative result that makes this readout interpretable."
    evidence:
    - reference: PMID:8666928
      reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have employed gene targeting to create a strain of transgenic mice that completely lacks expression of all isoforms of CD45."
      explanation: "Establishes the model as a complete null, which is what makes it informative for a loss-of-function disease."
  - target: B Cell Signalling Failure Despite Normal B Cell Numbers
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      B-cell numbers preserved or increased with selective failure of
      antigen-receptor signalling, matching the human picture of normal B-cell
      counts and declining immunoglobulins.
    limitations: >-
      The mouse readout is proliferation to surface IgM and IgD crosslinking in
      vitro; the human readout is serum immunoglobulin concentration falling over
      years. These are different measurements and the correspondence between them
      is an inference, not an observation.
    evidence:
    - reference: PMID:8666928
      reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that CD45 is not required at any stage during the generation of mature peripheral B cells, however its loss reveals a previously unrecognized role for CD45 in the regulation of certain subpopulations of B cells."
      explanation: "States the model's own conclusion: B-cell generation intact, B-cell regulation not."
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment for severe combined immunodeficiency, including
    CD45 deficiency: donor haematopoiesis supplies leukocytes carrying CD45 and
    reconstitutes antigen-receptor signalling. Outcome depends heavily on whether
    the diagnosis was made before infection had accumulated.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of CD45 Surface Expression
    description: >-
      Donor-derived haematopoietic cells express CD45, so the lesion is corrected
      at its origin rather than downstream.
  evidence:
  - reference: PMID:40374985
    reference_title: "Newborn Screening Followed By Early Treatment is Essential to Improve Survival in SCID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2-year overall survival (OS) of the late group was 29.2%, in contrast to the 2-year OS of the early diagnosis group of 71.4%"
    explanation: >-
      Quantifies how strongly outcome depends on the timing of diagnosis. This is a
      general severe combined immunodeficiency cohort, not a CD45-specific one.
  notes: >-
    No CD45-deficiency-specific transplant series exists. The survival figures
    here are for severe combined immunodeficiency as a whole and are carried over
    on the reasoning that the defect is haematopoietic and therefore correctable
    by replacement, not on direct evidence in this genotype.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Supportive replacement for the progressive hypogammaglobulinaemia, used
    before and around transplantation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  notes: >-
    Left without evidence deliberately. Immunoglobulin replacement in severe
    combined immunodeficiency is standard supportive care rather than a finding
    reported in the CD45 literature, and no source among the papers cited by this
    entry states it in a form that could be quoted for this genotype.
definitions:
- name: Newborn screening by T-cell receptor excision circle quantification
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    CD45 deficiency produces T lymphopenia from birth, so it falls within the
    population detectable by universal newborn severe combined immunodeficiency
    screening, which quantifies T-cell receptor excision circles in dried blood
    spots. Confirmation is by flow cytometry, where absent surface CD45 on all
    leukocytes is directly visible and effectively pathognomonic, followed by
    PTPRC sequencing.
  evidence:
  - reference: PMID:42079620
    reference_title: "SCID newborn screening: seven-year performance and outcomes including T-cell lymphopenia in Catalonia (Spain)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe combined immunodeficiency (SCID) can be detected at birth through T-cell receptor excision circles (TREC) analysis in dried blood spots."
    explanation: "Establishes the screening modality that would detect this disease presymptomatically."
  notes: >-
    This describes the screening pathway for severe combined immunodeficiency in
    general. No published case of immunodeficiency 105 has been reported as
    detected by newborn screening, so the applicability here is inferred from the
    T-lymphopenic immunophenotype rather than demonstrated.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only a handful of unrelated patients have been reported: the index case with
    a deletion and a splice-site variant, the homozygous six-base-pair deletion
    case, and the uniparental isodisomy case. No incidence or prevalence estimate
    exists for this genotype, and none is attempted here. For scale, universal
    newborn screening in Catalonia gives an incidence of roughly 1 in 46,753 live
    births for severe combined immunodeficiency of all causes, of which CD45
    deficiency is a very small fraction.
  evidence:
  - reference: PMID:42079620
    reference_title: "SCID newborn screening: seven-year performance and outcomes including T-cell lymphopenia in Catalonia (Spain)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corresponding to an overall incidence of 1:46,753 live births"
    explanation: >-
      Provides the all-cause severe combined immunodeficiency incidence used here
      only as an upper bound for context, not as an estimate for this disease.
discussions:
- discussion_id: human_thymocyte_staging_unobserved
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does human CD45 deficiency arrest thymocyte development at the same two
    checkpoints identified in the Ptprc-null mouse?
  attaches_to:
  - pathophysiology#Arrest of Thymocyte Development
  rationale: >-
    The staged block, a halved double-negative to double-positive transition
    followed by a four to fivefold failure of single-positive maturation, comes
    entirely from the mouse. The human patients are too few, and were studied by
    peripheral blood immunophenotyping rather than thymic analysis, for the
    staging to have been tested in people. The entry states the mechanism at the
    level the mouse supports and this gap records that the human staging is
    unobserved rather than confirmed.

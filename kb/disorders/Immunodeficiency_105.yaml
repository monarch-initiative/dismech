name: Immunodeficiency 105
creation_date: "2026-09-09T19:45:00Z"
category: Mendelian
synonyms:
- IMD105
- CD45 deficiency
- severe combined immunodeficiency, autosomal recessive, T cell-negative, B cell-positive, NK cell-positive
- PTPRC deficiency
description: >-
  Immunodeficiency 105 is a severe combined immunodeficiency caused by biallelic
  loss-of-function variants in PTPRC, which encodes CD45, the leukocyte common
  antigen. CD45 is an abundant receptor-type protein tyrosine phosphatase carried
  by every nucleated haematopoietic cell. Its central job is to dephosphorylate
  the inhibitory C-terminal tyrosine of the Src-family kinases Lck and Fyn, which
  is what licenses them to initiate antigen-receptor signalling. Without CD45,
  Lck stays locked in its autoinhibited conformation, proximal T-cell receptor
  signalling fails, and thymocyte development arrests. The result is a
  T-negative, B-positive severe combined immunodeficiency presenting in the first
  months of life with severe and opportunistic infection.

  Two features distinguish it from most severe combined immunodeficiencies. The
  block is in signalling rather than in receptor assembly or nucleotide
  metabolism, so B cells are produced in normal numbers and are not themselves
  absent; what fails is their function, and serum immunoglobulins therefore fall
  progressively rather than being absent from the outset. And because CD45 is
  carried by all leukocytes, its absence from the cell surface is directly
  visible on routine flow cytometry, which makes the diagnosis unusually
  accessible once it is suspected.

  The disease is defined by a very small number of patients. Curating it is
  therefore an exercise in being explicit about how thin the human evidence is,
  and about which claims come instead from the Ptprc-null mouse.

  No pathophysiology node declares conforms_to. kb/modules/ was searched for a
  T-cell-receptor signalling, Src-family kinase regulation, or thymopoiesis
  module and none exists; the closest entries are pathway modules scoped to
  oncogenic signalling, which is a different claim. The proximal-signalling
  chain here is a reasonable candidate for a future module, since it recurs
  across the T-negative combined immunodeficiencies (ZAP70, LCK, CD3 subunits),
  but factoring one out is not this entry's job.

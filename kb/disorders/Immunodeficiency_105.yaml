inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic loss of function, by homozygous variant, compound heterozygosity,
    or uniparental isodisomy unmasking a single inherited allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:11145714
    reference_title: "A deletion in the gene encoding the CD45 antigen in a patient with SCID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous 6-bp deletion in the gene encoding CD45 (PTPRC, gene map locus 1q31-32), which results in a loss of glutamic acid 339 and tyrosine 340 in the first fibronectin type III module of the extracellular domain of CD45, is associated with failure of surface expression of CD45 and SCID"
    explanation: >-
      A homozygous variant in a patient with severe combined immunodeficiency,
      establishing the recessive mode.
pathophysiology:
- name: Loss of CD45 Surface Expression
  biological_scale: MOLECULAR
  description: >-
    Biallelic PTPRC loss-of-function variants abolish CD45 at the leukocyte
    surface. The reported mechanisms differ but converge: a large deletion paired
    with an intervening-sequence 13 donor splice-site change; a homozygous
    in-frame six-base-pair deletion removing Glu339 and Tyr340 from the first
    fibronectin type III module, where modelling places Tyr340 as structurally
    load-bearing so the protein never reaches the membrane; and uniparental
    isodisomy of chromosome 1 making a single maternal allele homozygous.
  molecular_functions:
  - preferred_term: CD45 receptor tyrosine phosphatase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005001
      label: transmembrane receptor protein tyrosine phosphatase activity
  cell_types:
  - preferred_term: leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  evidence:
  - reference: PMID:10700239
    reference_title: "Mutations in the tyrosine phosphatase CD45 gene in a child with severe combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a male patient with a deficiency in CD45 due to a large deletion at one allele and a point mutation at the other. The point mutation resulted in the alteration of intervening sequence 13 donor splice site."
    explanation: "The first reported human CD45 deficiency and its two-allele mechanism."
  - reference: PMID:11145714
    reference_title: "A deletion in the gene encoding the CD45 antigen in a patient with SCID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular modeling suggests that tyrosine 340 is crucial for the structural integrity of CD45 protein."
    explanation: >-
      Explains why an in-frame two-residue deletion in the extracellular domain
      abolishes surface expression rather than merely altering it.
  downstream:
  - target: Failure of Lck Activation
    causal_link_type: DIRECT
    description: >-
      CD45 is the phosphatase that removes the inhibitory C-terminal phosphotyrosine
      from Lck, so its absence leaves Lck autoinhibited.
    evidence:
    - reference: PMID:10700239
      reference_title: "Mutations in the tyrosine phosphatase CD45 gene in a child with severe combined immunodeficiency disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hematopoietic-specific transmembrane protein tyrosine phosphatase CD45 functions to regulate Src kinases required for T- and B-cell antigen receptor signal transduction."
      explanation: "States the regulatory relationship this edge asserts."
- name: Failure of Lck Activation
  biological_scale: MOLECULAR
  description: >-
    Lck activity is set by the opposing action of CD45, which removes the
    inhibitory C-terminal phosphotyrosine, and Csk, which installs it. With CD45
    gone, that balance collapses towards the closed, autoinhibited conformation
    and Lck cannot phosphorylate the T-cell receptor ITAMs that begin proximal
    signalling.
  biological_processes:
  - preferred_term: protein dephosphorylation
    modifier: DECREASED
    term:
      id: GO:0006470
      label: protein dephosphorylation
  evidence:
  - reference: PMID:32794043
    reference_title: "The role of competing mechanisms on Lck regulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The balance of phosphorylation at the inhibitory and activating Tyr residues is maintained by a balance between CD45 and Csk and is dependent upon intact intracellular trafficking machinery."
    explanation: >-
      A review establishing that CD45 is one of the two opposing regulators setting
      Lck's phosphorylation state, which is why its loss is not compensated.
  downstream:
  - target: Arrest of Thymocyte Development
    causal_link_type: DIRECT
- name: Arrest of Thymocyte Development
  biological_scale: CELLULAR
  description: >-
    Thymocyte maturation depends on T-cell receptor signals at two checkpoints,
    and both are impaired. In the Ptprc-null mouse the double-negative to
    double-positive transition is roughly halved and the subsequent maturation of
    double-positive cells into single-positive thymocytes falls a further four to
    fivefold, so the deficit compounds. Negative selection is affected too:
    null thymocytes fail to undergo apoptosis in response to T-cell receptor
    crosslinking while responding normally to non-receptor signals, which is what
    localises the lesion to receptor-proximal signalling rather than to the
    apoptotic machinery.
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  - preferred_term: double-positive thymocyte
    term:
      id: CL:0000809
      label: double-positive, alpha-beta thymocyte
  biological_processes:
  - preferred_term: T cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030217
      label: T cell differentiation
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  evidence:
  - reference: PMID:8666928
    reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "T cell development is significantly inhibited in CD45-null animals at two distinct stages."
    explanation: >-
      The two-checkpoint block this node describes, demonstrated in the null mouse.
      No equivalent staged analysis exists in a human patient.
  - reference: PMID:8666928
    reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The efficiency of the development of CD4-CD8- thymocytes into CD4+ CD8+ thymocytes is reduced by twofold, subsequently the frequency of successful maturation of the double positive population into mature, single positive thymocytes is reduced by a further four- to fivefold."
    explanation: "Quantifies the deficit at each of the two checkpoints."
  downstream:
  - target: Decreased total T cell count
    causal_link_type: DIRECT
  - target: Decreased mitogen-induced T-cell proliferation
    causal_link_type: DIRECT
  - target: Severe combined immunodeficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: B Cell Signalling Failure Despite Normal B Cell Numbers
  biological_scale: CELLULAR
  description: >-
    B cells are generated in normal or increased numbers, so this is not a
    developmental block in the B lineage. What fails is B-cell receptor
    signalling: CD45 is required to transmit mitogenic signals through surface
    IgM and IgD, while CD40-mediated proliferation is preserved. Clinically this
    is why immunoglobulin concentrations fall progressively with age rather than
    being absent at presentation, and it is the feature that separates this
    disorder from the T-negative B-negative severe combined immunodeficiencies.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: B cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
  evidence:
  - reference: PMID:10700239
    reference_title: "Mutations in the tyrosine phosphatase CD45 gene in a child with severe combined immunodeficiency disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite normal B-lymphocyte numbers, serum immunoglobulin levels decreased with age."
    explanation: >-
      The human observation that grounds this node: numbers preserved, function
      and output not.
  - reference: PMID:8666928
    reference_title: "CD45-null transgenic mice reveal a positive regulatory role for CD45 in early thymocyte development, in the selection of CD4+CD8+ thymocytes, and B cell maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CD45 is absolutely required for the transmission of mitogenic signals via IgM and IgD. By contrast, CD45-null B cells proliferate as well as wild-type cells to CD40-mediated signals."
    explanation: >-
      Localises the B-cell defect to antigen-receptor signalling specifically,
      sparing the CD40 route.
  downstream:
  - target: Decreased circulating immunoglobulin concentration
    causal_link_type: DIRECT

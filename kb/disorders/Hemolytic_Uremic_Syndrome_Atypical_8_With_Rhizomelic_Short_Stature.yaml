name: Hemolytic Uremic Syndrome Atypical 8 With Rhizomelic Short Stature
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
description: >-
  X-linked congenital disorder of O-glycosylation caused by hemizygous
  C1GALT1C1 variants. C1GALT1C1 encodes Cosmc, the chaperone that core 1
  beta-1,3-galactosyltransferase (T-synthase) needs to fold. With reduced Cosmc,
  T-synthase activity falls and O-glycans are left truncated as the Tn antigen.
  Affected males have episodes of acute kidney injury with thrombotic
  microangiopathy that resemble atypical hemolytic uremic syndrome and respond
  to C5 inhibition, together with disproportionate short stature, facial
  dysmorphism, developmental delay, thrombocytopenia and immunodeficiency.
  Only a few families are reported.
synonyms:
- aHUS8
- COSMC-CDG
disease_term:
  preferred_term: hemolytic uremic syndrome, atypical, 8, with rhizomelic short stature
  term:
    id: MONDO:0957495
    label: hemolytic uremic syndrome, atypical, 8, with rhizomelic short stature
notes: >-
  Kept apart from Atypical_Hemolytic_Uremic_Syndrome, whose subtypes are
  complement regulator or effector variants. Here the primary lesion is in
  O-glycan synthesis and complement activation is downstream. Tn polyagglutination
  syndrome (MONDO:0010381) involves the same gene through acquired somatic
  variants in blood cells and is a separate concept. ClinGen rates this
  gene-disease pair Limited.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Hemizygous males are fully affected; heterozygous females in the reported
    family had an attenuated phenotype with skewed X-inactivation in blood.
  evidence:
  - reference: CGGV:assertion_5a5ca158-bc76-49f8-84a0-fc60e6b13fdb-2025-01-28T050000.000Z
    reference_title: "C1GALT1C1 / hemolytic uremic syndrome, atypical, 8, with rhizomelic short stature (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "C1GALT1C1 | HGNC:24338 | hemolytic uremic syndrome, atypical, 8, with rhizomelic short stature | MONDO:0957495 | XL | Limited"
    explanation: ClinGen records X-linked inheritance for this gene-disease pair.
  - reference: PMID:37216524
    reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their heterozygous mother and maternal grandmother show an attenuated phenotype with skewed X-inactivation in blood."
    explanation: Carrier females are mildly affected, consistent with X-linked transmission.
mechanistic_hypotheses:
- hypothesis_group_id: exposed_erythrocyte_glycan_lectin_pathway
  hypothesis_label: >-
    Exposed erythrocyte O-glycans activate complement through the lectin
    pathway, as proposed for pneumococcal HUS
  status: EMERGING
  description: >-
    Proposed by the authors of the p.Thr89Ile report. It rests on exposed T
    antigen on patient erythrocytes and an analogy with pneumococcal HUS, where
    bacterial neuraminidase exposes the same structure. Lectin-pathway activity
    was not measured. Edges that belong to it carry
    hypothesis_groups: [exposed_erythrocyte_glycan_lectin_pathway].
  evidence:
  - reference: PMID:36599939
    reference_title: "X-linked C1GALT1C1 mutation causes atypical hemolytic uremic syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that both aHUS caused by mutated C1GALT1C1 and pHUS are mediated by the lectin-complement-pathway"
    explanation: States the lectin-pathway proposal; it is a suggestion, not a measurement.
pathophysiology:
- name: Reduced Cosmc Chaperone Expression
  description: >-
    Hemizygous C1GALT1C1 variants (p.Ala20Asp in a transmembrane domain;
    p.Thr89Ile de novo) reduce the amount of functional Cosmc. The p.Ala20Asp
    protein remains functional but is expressed at much lower levels.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: C1GALT1C1
    term:
      id: hgnc:24338
      label: C1GALT1C1
  genetic_context:
    description: Germline hemizygous C1GALT1C1 missense variants in males.
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: protein folding chaperone
    term:
      id: GO:0044183
      label: protein folding chaperone
    modifier: DECREASED
  evidence:
  - reference: PMID:37216524
    reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This germline variant occurs within the transmembrane domain of Cosmc, resulting in dramatically reduced expression of the Cosmc protein."
    explanation: The p.Ala20Asp variant lowers Cosmc protein expression.
  downstream:
  - target: T-Synthase Deficiency
    evidence:
    - reference: PMID:37216524
      reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "causes a large reduction of T-synthase protein and activity"
      explanation: Low Cosmc expression leads to a large loss of T-synthase protein and activity.
- name: T-Synthase Deficiency
  description: >-
    T-synthase (C1GALT1) adds galactose to the Tn antigen to make the core 1
    O-glycan (T antigen), the precursor of all extended O-glycans. It depends
    on Cosmc for folding, so reduced Cosmc lowers T-synthase protein and
    activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: C1GALT1
    term:
      id: hgnc:24337
      label: C1GALT1
  molecular_functions:
  - preferred_term: N-acetylgalactosaminide beta-1,3-galactosyltransferase activity
    term:
      id: GO:0016263
      label: N-acetylgalactosaminide beta-1,3-galactosyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:12464682
    reference_title: "A unique molecular chaperone Cosmc required for activity of the mammalian core 1 beta 3-galactosyltransferase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "C1beta3Gal-T activity requires expression of a molecular chaperone designated Cosmc"
    explanation: Establishes that T-synthase activity depends on Cosmc.
  - reference: PMID:37216524
    reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients have a decreased activity of T-synthase (C1GALT1)"
    explanation: Patients have reduced T-synthase activity.
  downstream:
  - target: Truncated O-Glycan Tn Antigen Accumulation
- name: Truncated O-Glycan Tn Antigen Accumulation
  description: >-
    Without core 1 extension, mucin-type O-glycans stay as the truncated Tn
    antigen on many glycoproteins, including erythrocyte and lymphocyte surface
    proteins, and serum IgA1 becomes galactose-deficient.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein O-linked glycosylation via N-acetylgalactosamine
    term:
      id: GO:0016266
      label: protein O-linked glycosylation via N-acetylgalactosamine
    modifier: DECREASED
  evidence:
  - reference: PMID:37216524
    reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which accordingly leads to expression of varied amounts of pathological Tn-antigen"
    explanation: Reduced T-synthase leads to pathological Tn antigen expression.
  - reference: PMID:37216524
    reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, all four affected individuals have high levels of galactose-deficient IgA1 in sera."
    explanation: Serum IgA1 is galactose-deficient in all four affected family members.
  downstream:
  - target: Abnormal Erythrocyte O-Glycan Exposure
  - target: Thrombocytopenia
    evidence:
    - reference: PMID:35163200
      reference_title: "Global Loss of Core 1-Derived O-Glycans in Mice Leads to High Mortality Due to Acute Kidney Failure and Gastric Ulcers."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "They also exhibited leukocytopenia, thrombocytopenia, severe acute pancreatitis, and atrophy of white and brown adipose tissue, as well as spontaneous gastric ulcers and severe renal dysfunction"
      explanation: Adult mice lacking core 1 O-glycans develop cytopenias, linking the glycan defect to low blood cell counts.
  - target: Immunodeficiency
- name: Abnormal Erythrocyte O-Glycan Exposure
  description: >-
    In the child with the de novo p.Thr89Ile variant, erythrocytes display
    exposed T antigen, an unmasked O-glycan structure. This differs from the
    Tn-antigen finding in the p.Ala20Asp family, whose cells were studied as
    lymphoblasts and mononuclear cells, so the erythrocyte observation comes
    from one patient. The authors propose that this exposed glycan triggers
    complement through the lectin pathway, as suggested for Streptococcus
    pneumoniae-associated HUS.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:36599939
    reference_title: "X-linked C1GALT1C1 mutation causes atypical hemolytic uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate the presence of exposed T antigen on the surface of mutant erythrocytes"
    explanation: Exposed T antigen was shown on erythrocytes carrying the p.Thr89Ile variant.
  downstream:
  - target: Complement Activation
    hypothesis_groups:
    - exposed_erythrocyte_glycan_lectin_pathway
    evidence:
    - reference: PMID:36599939
      reference_title: "X-linked C1GALT1C1 mutation causes atypical hemolytic uremic syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings suggest that both aHUS caused by mutated C1GALT1C1 and pHUS are mediated by the lectin-complement-pathway"
      explanation: The authors propose lectin-pathway complement activation by the exposed glycan; the lectin pathway was not measured.
- name: Complement Activation
  description: >-
    During acute kidney injury episodes the alternative pathway shows
    consumption (low C3, raised sC5b-9). The first aHUS8 report proposes that
    exposed erythrocyte glycans activate the lectin pathway, as suggested for
    pneumococcal HUS; the lectin pathway was not measured, so it is recorded as
    a hypothesis and the node is bound to the alternative pathway that was
    measured. Anti-galactose-deficient-IgA1 immune complexes and
    glycan-defective endothelium are other untested possible triggers.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: complement activation, alternative pathway
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:37216524
    reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complement analysis showed dysregulation of the alternative complement pathway with reduced complement factor 3 and increased sC5b-9"
    explanation: Complement consumption was documented during the kidney injury episode.
  downstream:
  - target: Acute kidney injury
    evidence:

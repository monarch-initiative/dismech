animal_models:
- name: Inducible global Cosmc knockout mouse
  species: Mouse
  genotype: CAG-CreERT2 Cosmc conditional knockout, tamoxifen-induced in adults
  publication: PMID:35163200
  modeled_mechanisms:
  - target: Truncated O-Glycan Tn Antigen Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Complete adult loss of core 1 O-glycans reproduces the multisystem consequences, including thrombocytopenia and kidney dysfunction.
    limitations: >-
      The knockout removes Cosmc entirely, whereas patients have reduced but
      present Cosmc and residual T-synthase; the mice die within days with
      pancreatitis and gastric ulcers, which are not features of the patients.
    evidence:
    - reference: PMID:35163200
      reference_title: "Global Loss of Core 1-Derived O-Glycans in Mice Leads to High Mortality Due to Acute Kidney Failure and Gastric Ulcers."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "They also exhibited leukocytopenia, thrombocytopenia, severe acute pancreatitis, and atrophy of white and brown adipose tissue, as well as spontaneous gastric ulcers and severe renal dysfunction"
      explanation: Adult-onset global loss of core 1 O-glycans causes cytopenias and renal dysfunction.

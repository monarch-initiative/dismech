      explanation: ClinGen classifies this gene-disease pair as Limited.
  notes: >-
    relationship_type is left unset because CAUSATIVE is defined as
    Definitive or Strong validity and ClinGen's tier here is Limited. Two
    families are reported, with different missense variants (p.Ala20Asp,
    inherited, in two half-brothers; p.Thr89Ile, de novo, in one child). A
    third variant, p.Arg68*, is a postzygotic mosaic found in one girl, so
    variant_origin GERMLINE describes the two hemizygous male families, not
    that case. One mosaic case does not justify an HP:0001442 inheritance
    block.
  variants:
  - name: p.Ala20Asp
    description: >-
      Hemizygous missense variant (c.59C>A) in the Cosmc transmembrane domain
      in two maternal half-brothers; it lowers Cosmc expression.
    evidence:
    - reference: PMID:37216524
      reference_title: "Germline C1GALT1C1 mutation causes a multisystem chaperonopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients carry the hemizygous variant c.59C>A (p.Ala20Asp; A20D-Cosmc) in C1GALT1C1."
      explanation: Identifies the variant in both affected males.
  - name: p.Arg68*
    description: >-
      De novo mosaic nonsense variant (c.202C>T) in a girl, detected at a 27%
      allelic fraction in buccal cells, which the paper converts to about 54%
      of cells carrying it; the truncated Cosmc is nonfunctional. It arose very
      early after fertilization, so it is not a germline variant. She presented
      with nonimmune hydrops fetalis of unknown cause, has persistent
      proteinuria with normal renal function and normal C3 and C4, and also
      carries a paternally inherited likely pathogenic IRF2BPL variant, so her
      phenotype is not attributed to the disorder here.
    evidence:
    - reference: PMID:39949072
      reference_title: "C1GALT1C1-Associated Mosaic Disorder of Glycosylation in a Female."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with 54% of the cells containing the mutation"
      explanation: The paper's cell fraction for the mosaic p.Arg68* variant, derived from the 27% allelic fraction.
    - reference: PMID:39949072
      reference_title: "C1GALT1C1-Associated Mosaic Disorder of Glycosylation in a Female."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Extensive prenatal and postnatal evaluation did not yield an underlying etiology for the hydrops."
      explanation: The girl's hydrops had no identified cause, so it is not counted as a feature of the disorder.
  - name: p.Thr89Ile
    description: De novo missense variant (c.266C>T) in a child presenting with atypical hemolytic uremic syndrome.
    evidence:
    - reference: PMID:36599939
      reference_title: "X-linked C1GALT1C1 mutation causes atypical hemolytic uremic syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a de-novo missense mutation in C1GALT1C1:c.266 C > T,p.(T89I)"
      explanation: Identifies the de novo variant.

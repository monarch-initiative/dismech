genetic:
- name: C1R
  gene_term:
    preferred_term: C1R
    term:
      id: hgnc:1246
      label: C1R
  subtype: pEDS-1
  notes: Heterozygous missense or in-frame insertion/deletion variants involve subunit interfaces or inter-domain hinges of C1r, causing intracellular retention, mild endoplasmic reticulum enlargement, and uncontrolled auto-activation.
  evidence:
  - reference: PMID:27745832
    reference_title: "Periodontal Ehlers-Danlos Syndrome Is Caused by Mutations in C1R and C1S, which Encode Subcomponents C1r and C1s of Complement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants involve the subunit interfaces or inter-domain hinges of C1r and C1s and are associated with intracellular retention and mild endoplasmic reticulum enlargement."
    explanation: Describes the structural and cell-biological consequence of C1R/C1S pathogenic variants.
- name: C1S
  gene_term:
    preferred_term: C1S
    term:
      id: hgnc:1247
      label: C1S
  subtype: pEDS-2
  notes: Two characterized C1S missense variants (p.Val316del, p.Cys294Arg) in the CCP1 module cause aberrant secretion of a truncated, constitutively active Fg40 fragment that escapes normal physiological control.
  evidence:
  - reference: PMID:31921203
    reference_title: "Two Different Missense C1S Mutations, Associated to Periodontal Ehlers-Danlos Syndrome, Lead to Identical Molecular Outcomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HEK293-F cells stably transfected with the corresponding C1s variant plasmids, unexpectedly, do not secrete the full-length mutated C1s, but only a truncated Fg40 fragment of 40 kDa"
    explanation: Demonstrates the aberrant truncated-fragment secretion mechanism for two characterized C1S pEDS variants.
pathophysiology:
- name: C1R Gain-of-Function Variant
  biological_scale: MOLECULAR
  subtypes:
  - pEDS-1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION

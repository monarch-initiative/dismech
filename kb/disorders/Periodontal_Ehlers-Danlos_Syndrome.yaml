  - target: Bruising Susceptibility
  - target: Fragile Skin
  - target: Distal Joint Hypermobility
  - target: Arthralgia
  - target: Hoarse Voice
  - target: Leukoencephalopathy
  - target: Cerebral Arterial Aneurysm

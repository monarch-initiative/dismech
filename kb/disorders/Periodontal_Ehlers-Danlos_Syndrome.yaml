diagnosis:
- name: Molecular Genetic Testing
  description: Diagnosis is established in a proband with suggestive clinical findings and a heterozygous pathogenic gain-of-function variant in either C1R or C1S identified by molecular genetic testing.
  diagnosis_term:
    preferred_term: Molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34324282
    reference_title: "Periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of pEDS is established in a proband with suggestive clinical findings and a heterozygous pathogenic gain-of-function variant in either C1R or C1S identified by molecular genetic testing."
    explanation: States the molecular diagnostic criterion for pEDS.
- name: Oral and Periodontal Examination
  description: Oral examination assesses for generalized lack of attached gingiva (present from early childhood and considered pathognomonic for pEDS), gingival recession, and severe early-onset periodontitis.
  diagnosis_term:
    preferred_term: Oral examination
    term:
      id: NCIT:C163004
      label: Oral Examination
  evidence:
  - reference: PMID:37323685
    reference_title: "Non-oral manifestations in adults with a clinical and molecularly confirmed diagnosis of periodontal Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gingival recession provides a useful and easily assessable oral characteristic in the diagnosis of pEDS and may give initial examiners the opportunity to easily support the suspected diagnosis of pEDS."
    explanation: Clinical oral examination for gingival recession and lack of attached gingiva supports suspected pEDS diagnosis.
  - reference: PMID:37323685
    reference_title: "Non-oral manifestations in adults with a clinical and molecularly confirmed diagnosis of periodontal Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Lack of attached gingiva has been observed as early as 4 years of age and is pathognomonic for pEDS (Kapferer-Seebacher et al., 2020; Lepperdinger et al., 2022)."
    explanation: Generalized lack of attached gingiva is an early pathognomonic oral diagnostic sign.
treatments:
- name: Regular Periodontal Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: Due to high risk of progression of the periodontal disease, supportive periodontal care including reevaluation of periodontal parameters, oral hygiene instructions, and supra- and sub-gingival debridement is recommended every three to six months.
  treatment_term:
    preferred_term: Supportive periodontal care and dental prophylaxis
    term:
      id: NCIT:C62548
      label: Dental Prophylaxis
  target_mechanisms:
  - target: Periodontal Connective Tissue Destruction
    treatment_effect: INHIBITS
    description: Strict biofilm control and regular professional debridement limit plaque-triggered gingival hyperinflammation and periodontal tissue breakdown.
    evidence:
    - reference: PMID:37323685
      reference_title: "Non-oral manifestations in adults with a clinical and molecularly confirmed diagnosis of periodontal Ehlers-Danlos syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two individuals with excellent oral hygiene and receiving professional tooth cleaning on a regular basis had no or only mild periodontal destruction."
      explanation: Demonstrates that strict oral hygiene and regular professional cleaning mitigate periodontal tissue destruction in molecularly confirmed pEDS patients.
  evidence:
  - reference: PMID:34324282
    reference_title: "Periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "supportive periodontal care including reevaluation of periodontal parameters, oral hygiene instructions (e.g., use of interdental cleaning devices and electric toothbrushes), and supra- and sub-gingival debridement is recommended every three to six months"
    explanation: GeneReviews recommends regular supportive periodontal care as the primary management strategy.
- name: Physical Therapy for Joint Hypermobility
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: Physiotherapy, occupational therapy, pain management, and targeted exercise manage joint pain and musculoskeletal symptoms associated with joint hypermobility rather than reversing connective-tissue laxity itself.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Arthralgia
    treatment_effect: MODULATES
    description: Physiotherapy, occupational therapy, pain management, and targeted exercise manage musculoskeletal symptoms and joint pain associated with joint hypermobility rather than altering joint laxity itself.
    evidence:
    - reference: PMID:34324282
      reference_title: "Periodontal Ehlers-Danlos Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Joint hypermobility may benefit from physiotherapy, occupational therapy, pain management, and appropriate exercise."
      explanation: GeneReviews recommends physiotherapy, pain management, and exercise for symptomatic management of joint hypermobility complications.
  evidence:
  - reference: PMID:34324282
    reference_title: "Periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Joint hypermobility may benefit from physiotherapy, occupational therapy, pain management, and appropriate exercise."
    explanation: GeneReviews recommends physiotherapy for symptomatic management of joint hypermobility.
- name: Arterial Imaging Surveillance
  action_category: MONITORING
  description: Periodic vascular imaging surveillance (every 1.5 to 2 years in specialist services) is considered in adults with pEDS because of the risk of cerebral, carotid, and aortic aneurysms and arterial dissection.
  treatment_term:
    preferred_term: Arterial imaging surveillance
    term:
      id: NCIT:C190556
      label: Angiography
  evidence:
  - reference: PMID:37323685
    reference_title: "Non-oral manifestations in adults with a clinical and molecularly confirmed diagnosis of periodontal Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular surveillance of the arterial tree could be considered, given the reported frequency of arterial aneurysms in this cohort (2/6, 33%) and previously reported arterial events (10/150) (El Chehadeh et al., 2021; Kapferer-Seebacher et al., 2021)."
    explanation: Recommends consideration of regular arterial surveillance based on aneurysm prevalence in molecularly confirmed cohorts.
  - reference: PMID:37323685
    reference_title: "Non-oral manifestations in adults with a clinical and molecularly confirmed diagnosis of periodontal Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consideration of regular arterial surveillance is advised and has been reported to be conducted with a frequency of 1.5-2 years in some services (Kapferer-Seebacher et al., 2021)."
    explanation: Documents the 1.5-2 year arterial imaging surveillance interval used in specialist services without specifying a single imaging modality.

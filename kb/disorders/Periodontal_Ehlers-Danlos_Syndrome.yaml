name: Periodontal Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-09-16T17:29:22Z"
description: >
  Periodontal Ehlers-Danlos syndrome (pEDS, formerly EDS type VIII) is a rare
  autosomal dominant connective-tissue disorder caused by heterozygous
  missense or in-frame insertion/deletion variants in C1R (pEDS-1, the
  majority) or C1S (pEDS-2), which encode the C1r and C1s subunits of the
  first component of the classical complement pathway. Unlike most other EDS
  subtypes, pEDS is not caused by a primary defect in a collagen gene or a
  collagen-modifying enzyme. Pathogenic variants instead destabilize the C1r
  or C1s protein structure, causing uncontrolled intracellular
  auto-activation and extracellular release of activated C1s outside its
  normal physiological control by C1-inhibitor. Activated C1s directly
  degrades extracellular collagen I, shifting collagen turnover toward net
  resorption and producing thin, sparse, poorly organized collagen fibers.
  The clinical hallmark is early-onset, rapidly progressing periodontitis
  with premature tooth loss and a lack of attached gingiva, accompanied by
  variable connective-tissue findings including pretibial hyperpigmentation,
  easy bruising, distal joint hypermobility, hoarse voice, and, less
  commonly, vascular or visceral rupture.

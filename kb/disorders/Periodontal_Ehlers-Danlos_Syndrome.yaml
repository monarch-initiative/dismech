      label: C1R
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  description: >
    Heterozygous missense or in-frame insertion/deletion variants at subunit
    interfaces or inter-domain hinges of C1r destabilize its structure,
    causing intracellular auto-activation that escapes the normal
    physiological restraint imposed by C1-inhibitor and by C1q-dependent
    targeting within the C1 complex.
  evidence:
  - reference: PMID:27745832
    reference_title: "Periodontal Ehlers-Danlos Syndrome Is Caused by Mutations in C1R and C1S, which Encode Subcomponents C1r and C1s of Complement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants involve the subunit interfaces or inter-domain hinges of C1r and C1s and are associated with intracellular retention and mild endoplasmic reticulum enlargement."
    explanation: Establishes the structural mechanism of C1R pathogenic variants.
  downstream:
  - target: Uncontrolled Extracellular Activated C1s
    description: Intracellular auto-activation of variant C1r triggers downstream activation of C1s, which is then released extracellularly outside normal physiological control.
- name: C1S Gain-of-Function Variant
  biological_scale: MOLECULAR
  subtypes:
  - pEDS-2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: C1S
    term:
      id: hgnc:1247
      label: C1S
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  description: >
    Pathogenic C1S variants in the CCP1 module locally destabilize the
    protein and expose a novel cleavage site, generating a truncated,
    constitutively secreted Fg40 fragment. Fg40 retains native esterolytic
    serine-protease activity but lacks the N-terminal domain that normally
    mediates C1s interaction with C1r and C1q, so its activity escapes the
    physiological control exerted within the C1 complex.
  evidence:
  - reference: PMID:31921203
    reference_title: "Two Different Missense C1S Mutations, Associated to Periodontal Ehlers-Danlos Syndrome, Lead to Identical Molecular Outcomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, Fg40 enzymatic activity escapes the normal physiological control of C1s activity within C1, potentially providing a loss-of-control."
    explanation: Directly states the mechanistic consequence of the C1S variant Fg40 fragment.
  downstream:
  - target: Uncontrolled Extracellular Activated C1s
    description: The constitutively active, control-escaping Fg40 fragment is functionally equivalent to extracellular activated C1s.
- name: Uncontrolled Extracellular Activated C1s
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  biological_processes:
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: GAIN_OF_FUNCTION
  description: >
    Whether generated by variant C1r auto-activation or by the C1S-variant
    Fg40 fragment, extracellular activated C1s (aC1s) is the common
    pathological convergence point in pEDS fibroblasts, present at
    pathological levels outside the normal C1-complex-restrained context.
  evidence:
  - reference: PMID:36960056
    reference_title: "Degradation of collagen I by activated C1s in periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our previous studies identified extracellular presence of activated C1s (aC1s) as the common pathological feature in pEDS patient fibroblast cultures"
    explanation: Establishes extracellular activated C1s as the shared downstream molecular lesion across pEDS genotypes.
  downstream:
  - target: Aberrant Collagen I Degradation
    causal_link_type: DIRECT
    description: Activated C1s directly proteolyzes extracellular collagen I, an activity distinct from and additional to its canonical role in complement C4 activation.
    evidence:
    - reference: PMID:36960056
      reference_title: "Degradation of collagen I by activated C1s in periodontal Ehlers-Danlos Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we identified activated C1s (aC1s) as an enzyme which degrades collagen I in cell culture and in in vitro assays"
      explanation: Direct experimental demonstration that activated C1s degrades collagen I.
- name: Aberrant Collagen I Degradation
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  description: >
    In patient fibroblasts, a considerable portion of intracellular
    procollagen I is cleaved by activated C1s, and the effect is temperature
    sensitive (greater at higher, more inflamed-tissue-like temperatures).
    Matrix collagen turnover assessed with hybridizing peptides shows fast,
    comprehensive collagen remodeling, and immunofluorescence shows a
    strongly reduced, thin, short extracellular collagen I network compared
    to controls.
  evidence:
  - reference: PMID:36960056
    reference_title: "Degradation of collagen I by activated C1s in periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, patient fibroblasts showed thin and short signals of collagen I staining. Additionally, the fluorescence signals were significantly weaker in patient cells, indicating that collagen I deposition into the extracellular matrix is strongly reduced in pEDS patients."
    explanation: Directly demonstrates reduced, disorganized extracellular collagen I deposition in patient fibroblasts.
  downstream:
  - target: Periodontal Connective Tissue Destruction
    description: Increased collagen I turnover and reduced matrix deposition are most clinically evident in the periodontal region, plausibly due to overexpression of complement 1 proteins at this site of high microbial exposure.
  - target: Dermal and Vascular Connective Tissue Fragility
    description: The same collagen I turnover defect operating at lower, variable levels in skin, joint capsule, and vessel wall connective tissue produces systemic, non-oral manifestations.
- name: Periodontal Connective Tissue Destruction
  biological_scale: TISSUE
  locations:
  - preferred_term: gingiva
    term:
      id: UBERON:0001828
      label: gingiva
  cell_types:
  - preferred_term: fibroblast of gingiva
    term:
      id: CL:0002552
      label: fibroblast of gingiva
  description: >
    Gingival hyperinflammation in response to mild plaque accumulation
    begins in childhood; by the teens, rapidly progressing periodontitis
    destroys dental attachment, leading to premature tooth loss. A lack of
    attached gingiva is present even before periodontitis develops.
  evidence:
  - reference: PMID:34324282
    reference_title: "Periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periodontal tissue breakdown beginning in the teens results in premature loss of teeth. Lack of attached gingiva and thin and fragile gums lead to gingival recession."
    explanation: GeneReviews describes the periodontal tissue destruction process and its consequences.
  downstream:
  - target: Severe Early-Onset Periodontitis
  - target: Gingival Recession
  - target: Lack of Attached Gingiva
- name: Dermal and Vascular Connective Tissue Fragility
  biological_scale: TISSUE
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  description: >
    Reduced, disorganized dermal and vascular collagen produces skin
    fragility, easy bruising, and pretibial plaques as the most common
    non-oral findings, with joint hypermobility, hoarse voice, and, less
    commonly, arterial or bowel rupture reflecting variable systemic
    involvement.
  evidence:
  - reference: PMID:27745832
    reference_title: "Periodontal Ehlers-Danlos Syndrome Is Caused by Mutations in C1R and C1S, which Encode Subcomponents C1r and C1s of Complement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features of affected individuals in these families include rapidly progressing periodontitis with onset in the teens or childhood, a previously unrecognized lack of attached gingiva, pretibial hyperpigmentation, skin and vascular fragility, easy bruising, and variable musculoskeletal symptoms."
    explanation: Founding cohort paper summarizing the systemic connective-tissue phenotype.
  downstream:
  - target: Pretibial Hyperpigmentation
  - target: Bruising Susceptibility
  - target: Fragile Skin
  - target: Distal Joint Hypermobility
  - target: Hoarse Voice
  - target: Leukoencephalopathy
  - target: Arterial Aneurysm
  - target: Intestinal Perforation
  - target: Venous Insufficiency

treatments:
- name: Regular Periodontal Care
  description: Due to high risk of progression of the periodontal disease, supportive periodontal care including reevaluation of periodontal parameters, oral hygiene instructions, and supra- and sub-gingival debridement is recommended every three to six months.
  treatment_term:
    preferred_term: Periodontal treatment and preventive oral care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34324282
    reference_title: "Periodontal Ehlers-Danlos Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supportive periodontal care including reevaluation of periodontal parameters, oral hygiene instructions (e.g., use of interdental cleaning devices and electric toothbrushes), and supra- and sub-gingival debridement is recommended every three to six months"
    explanation: GeneReviews recommends regular supportive periodontal care as the primary management strategy.
- name: Physical Therapy for Joint Hypermobility
  description: Joint hypermobility may benefit from physiotherapy, occupational therapy, pain management, and appropriate exercise.
  treatment_term:

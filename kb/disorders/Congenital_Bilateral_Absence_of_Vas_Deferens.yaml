name: Congenital Bilateral Absence of Vas Deferens
creation_date: '2026-08-28T23:10:00Z'
category: Mendelian
description: 'Congenital bilateral absence of the vas deferens is obstructive azoospermia with intact spermatogenesis.
  The testis works; the conduit is missing. That separation is what makes the condition treatable - sperm can
  be recovered surgically from the epididymis or testis and used for ICSI - and it is also what makes it mechanistically
  interesting, because whatever destroys the vas deferens leaves the seminiferous epithelium alone.

  Most cases are a CFTR-related disorder. The genotypes involved are not the genotypes of cystic fibrosis:
  they retain enough residual CFTR function to spare lung and pancreas while still failing in the mesonephric
  duct derivatives, which appear to be the tissue with the least tolerance for reduced anion and fluid secretion.
  The commonest configuration is one severe and one mild allele in compound heterozygosity. A smaller group
  - about 2% of cases - is X-linked, caused by loss-of-function variants in ADGRG2, an adhesion GPCR specific
  to the epididymis and efferent ducts, and those men have no CFTR abnormality at all.

  The most useful distinction in this entry is not between those two genes but between two developmental timings.
  CAVD associated with a solitary kidney carries CFTR mutations at conspicuously low rates, and the coincidence
  of absent duct and absent kidney points to a failure of mesonephric duct organogenesis - an early, structural
  event. CFTR- and ADGRG2-related disease looks different: the duct forms and then involutes, progressively,
  later in fetal life and possibly beyond birth. This entry covers the second. The renal-anomaly group is a
  developmental field defect that happens to share a clinical endpoint.'
disease_term:
  preferred_term: congenital bilateral absence of vas deferens
  term:
    id: MONDO:0018801
    label: congenital bilateral absence of vas deferens
synonyms:
- CBAVD
- congenital bilateral aplasia of vas deferens
- congenital bilateral agenesis of vas deferens
- CFTR-related CBAVD
parents:
- Male Infertility
has_subtypes:
- name: CFTR-related
  display_name: CFTR-related CBAVD
  description: The large majority. Patients carry CFTR variants - usually one severe and one mild allele in
    compound heterozygosity - whose combined residual function is above the threshold for pulmonary and pancreatic
    disease but below what the mesonephric duct derivatives require. Reported CFTR-positive rates vary with
    ascertainment and testing depth, and are consistently lower in men who also have a solitary kidney.
  evidence:
  - reference: PMID:33000223
    reference_title: 'Mutations of the cystic fibrosis transmembrane conductance regulator gene in males with
      congenital bilateral absence of the vas deferens: Reproductive implications and genetic counseling (Review).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 60-70% of patients with CBAVD carry pathogenic CFTR mutations (Online Mendelian Inheritance in
      Man no. 602421), usually one severe and one mild, in compound heterozygosity
    explanation: Gives both the frequency and the characteristic compound-heterozygous allele configuration
      that defines this subtype.
- name: ADGRG2-related
  display_name: X-linked ADGRG2-related CBAVD
  description: About 2% of cases. Hemizygous truncating variants in ADGRG2, which encodes an adhesion G protein-coupled
    receptor expressed specifically in the epididymis and efferent ducts. These men are CFTR-negative, and
    because the inheritance is X-linked the recurrence risk and the counselling are entirely different from
    the CFTR case - which is the practical reason the subtype matters.
  evidence:
  - reference: PMID:27476656
    reference_title: Truncating Mutations in the Adhesion G Protein-Coupled Receptor G2 Gene ADGRG2 Cause an
      X-Linked Congenital Bilateral Absence of Vas Deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified three protein-truncating hemizygous mutations, c.1545dupT (p.Glu516Ter), c.2845delT
      (p.Cys949AlafsTer81), and c.2002_2006delinsAGA (p.Leu668ArgfsTer21), in ADGRG2, encoding the epididymal-
      and efferent-ducts-specific adhesion G protein-coupled receptor G2, in four subjects, including two related
      individuals with X-linked transmission of their infertility.
    explanation: The discovery report establishing ADGRG2 as an X-linked cause and naming the tissue specificity
      of the receptor.

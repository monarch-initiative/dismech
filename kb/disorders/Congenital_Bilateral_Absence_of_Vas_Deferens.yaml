    term:
      id: UBERON:0003074
      label: mesonephric duct
  downstream:
  - target: Progressive Involution of Mesonephric Duct Derivatives
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33000223
    reference_title: 'Mutations of the cystic fibrosis transmembrane conductance regulator gene in males with
      congenital bilateral absence of the vas deferens: Reproductive implications and genetic counseling (Review).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It has also been demonstrated that fluid secretion is necessary for the normal development of
      the mesonephric duct
    explanation: The link from secretion to duct development that this node turns on.
  - reference: PMID:33000223
    reference_title: 'Mutations of the cystic fibrosis transmembrane conductance regulator gene in males with
      congenital bilateral absence of the vas deferens: Reproductive implications and genetic counseling (Review).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: resulting in the production of highly viscous mucus by epithelial cells of the male genital tract
    explanation: Describes the luminal consequence of the secretory defect.
- name: Loss of ADGRG2 Signalling in Efferent Ducts
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: The alternative entry point. ADGRG2 is an adhesion GPCR expressed specifically in the epididymis
    and efferent ducts, where it is required for fluid reabsorption. Hemizygous truncating variants abolish
    it. That a receptor governing duct fluid handling and a channel governing duct fluid secretion both produce
    the same anatomical endpoint is the strongest argument that luminal fluid balance, rather than any one
    gene product, is what the mesonephric duct derivatives depend on.
  genetic_context:
    gene:

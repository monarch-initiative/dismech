pathophysiology:
- name: Residual-Function CFTR Genotype
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: 'A CFTR genotype that reduces chloride and bicarbonate conductance without abolishing it. This
    is the defining feature of the disease and the reason it is not cystic fibrosis: the same gene, a different
    point on the residual- function axis. The threshold that matters is tissue-specific, and the mesonephric
    duct derivatives sit at the sensitive end of it - so a genotype that leaves lung and pancreas essentially
    normal still fails here.'

    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: unlike CAVDs related to CFTR or ADGRG2 mutations, which might be the result of progressive degeneration
      that begins later in fetal life and probably continues after birth
    explanation: States the progressive-involution model and explicitly contrasts it with the early-organogenesis
      group, which is the distinction this node records.
  - reference: PMID:33000223
    reference_title: 'Mutations of the cystic fibrosis transmembrane conductance regulator gene in males with
      congenital bilateral absence of the vas deferens: Reproductive implications and genetic counseling (Review).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 12-18 week-old abortive fetuses with CFTR gene mutations, the vas deferens is obstructed and
      denatured by mucus, and the vas deferens may be further aggravated in embryonic development
    explanation: The fetal observation that dates the involution and shows it worsening across gestation.
- name: Obstructive Azoospermia with Preserved Spermatogenesis
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: The clinical endpoint. Spermatozoa are produced normally in the testis but have no route out,
    so the ejaculate is azoospermic, low in volume, acidic and depleted of the seminal vesicle contribution
    - fructose in particular. Testis size and FSH are normal or near-normal, which is what separates this biochemically
    from non-obstructive azoospermia and is why surgical retrieval works.
  locations:
  - preferred_term: vas deferens
    term:
      id: UBERON:0001000
      label: vas deferens
  evidence:
  - reference: PMID:29216686
    reference_title: 'Congenital bilateral absence of the vas deferens as an atypical form of cystic fibrosis:
      reproductive implications and genetic counseling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Diagnosis of CBAVD is generally based on these criteria: presence of normal to slightly small
      sized testicles, non-palpable vas deferens, normal plasma levels of FSH (Follicle-Stimulating Hormone),
      and reduced ejaculate volume'
    explanation: The clinical picture of preserved testicular function with an absent conduit.
  - reference: PMID:33000223
    reference_title: 'Mutations of the cystic fibrosis transmembrane conductance regulator gene in males with
      congenital bilateral absence of the vas deferens: Reproductive implications and genetic counseling (Review).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The hallmarks of CBAVD include azoospermia, reduced semen volume (<1 ml), pH value (≤7.0) and
      seminal fructose, as well as decreased production of spermatozoa in the testicles.
    explanation: The semen findings recorded at this node.

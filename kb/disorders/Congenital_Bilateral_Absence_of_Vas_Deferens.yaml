notes: 'Scope. This entry covers isolated congenital bilateral absence of the vas deferens - the CFTR-related
  and ADGRG2-related forms in which the genital tract is the only affected system. It is deliberately distinct
  from kb/disorders/Cystic_Fibrosis.yaml, which models Vas Deferens Agenesis as one phenotype node of multisystem
  CF. The content that has no home in the CF entry is what justifies a separate one: the residual-function
  CFTR genotype threshold, the X-linked ADGRG2 route which involves CFTR not at all, and the distinction from
  the renal-anomaly developmental group.

  Of MONDO:0018801''s three descendants, the two bilateral forms (MONDO:0010178 CFTR-related, MONDO:0010511
  X-linked) are modelled here as has_subtypes because they converge on one pathograph. Congenital unilateral
  aplasia (MONDO:0800311) is recorded as a differential diagnosis rather than a subtype - fertility is often
  preserved and the genetic architecture differs.

  Deep research. Curated with a single OpenScientist deep-research report (research/Congenital_Bilateral_Absence_of_Vas_Deferens-deep-research-openscientist.md).
  Its reference validation reported 25/25 citations verified. Its term validation reported needs_review with
  five mislabelled terms, including MONDO:0009299 offered under the bare label "MONDO" when the ontology calls
  it "46 XX gonadal dysgenesis". No CURIE in this entry was taken from the report; every binding here was resolved
  independently against the term caches and OLS.


  GeneReviews. PubMed surfaces no dedicated CBAVD or CFTR-Related Disorders chapter; the relevant chapter is
  Cystic Fibrosis (PMID:20301428), which covers vas deferens aplasia as a CF morbidity and carries the counselling
  and preimplantation-testing content. It is tagged and cited here. Searches run: "CFTR-Related Disorders GeneReviews",
  "CFTR-Related Disorders[Book]", "cystic fibrosis GeneReviews[TI]" and a books-database query, none of which
  returned a CBAVD-specific chapter.'
clinical_burden:
  burden_level: MODERATE
  rationale: 'The burden is confined to fertility - there is no organ damage, no shortened life, and no progression
    after the duct is lost. Against that, it is usually the reason a couple presents, and it is treatable:
    39 of 46 men in a consecutive series had their own children through retrieval and ICSI. Rated MODERATE
    rather than LOW because the diagnosis also identifies a CFTR carrier couple, and the child at risk has
    cystic fibrosis - a far more serious disease than the father''s.'
  evidence:
  - reference: PMID:35119551
    reference_title: Genetic analysis and intracytoplasmic sperm injection outcomes of Chinese patients with
      congenital bilateral absence of vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After proper counseling, all patients can undergo sperm retrieval from their epididymis or testis,
      and most of them can have their own children through ICSI.
    explanation: The outcome statement behind this rating.
  - reference: PMID:29216686
    reference_title: 'Congenital bilateral absence of the vas deferens as an atypical form of cystic fibrosis:
      reproductive implications and genetic counseling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: genetic counseling should be offered to couples undergoing ART to discuss the probability of having
      offspring that carry CFTR gene mutations
    explanation: The transmission risk that keeps this above a LOW rating.
progression:
- phase: Fetal and early postnatal
  notes: 'The window in which the disease happens. The duct forms, is obstructed and degraded by mucus by 12-18
    weeks, and the process worsens as gestation proceeds and probably continues after birth. After that it
    is static: there is no adult progression, and the clinical course is a fixed obstructive azoospermia. The
    therapeutic corollary is in the prenatal CFTR modulator entry - restoration during this window preserved
    the duct in one reported case, while postnatal modulators do not restore fertility.'
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: unlike CAVDs related to CFTR or ADGRG2 mutations, which might be the result of progressive degeneration
      that begins later in fetal life and probably continues after birth
    explanation: The timing of the process, which is what makes this a progression record with a closing window
      rather than an ongoing course.

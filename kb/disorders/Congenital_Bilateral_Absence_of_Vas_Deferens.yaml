- name: Loss of ADGRG2 Signalling in Efferent Ducts
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: The alternative entry point. ADGRG2 is an adhesion GPCR expressed specifically in the epididymis
    and efferent ducts, where it is required for fluid reabsorption. Hemizygous truncating variants abolish
    it. That a receptor governing duct fluid handling and a channel governing duct fluid secretion both produce
    the same anatomical endpoint is the strongest argument that luminal fluid balance, rather than any one
    gene product, is what the mesonephric duct derivatives depend on.

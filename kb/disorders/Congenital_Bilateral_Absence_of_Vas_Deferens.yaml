  description: The large majority. Patients carry CFTR variants - usually one severe and one mild allele in
    compound heterozygosity - whose combined residual function is above the threshold for pulmonary and pancreatic
    disease but below what the mesonephric duct derivatives require. Reported CFTR-positive rates vary with
    ascertainment and testing depth, and are consistently lower in men who also have a solitary kidney.

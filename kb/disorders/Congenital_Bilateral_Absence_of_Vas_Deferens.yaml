genetic:
- name: CFTR
  gene_term:
    preferred_term: CFTR
    term:
      id: hgnc:1884
      label: CFTR
  relationship_type: CAUSATIVE
  notes: 'The dominant cause. What distinguishes the CBAVD genotype from the cystic fibrosis genotype is residual
    function, not a different set of genes: one severe and one mild allele in compound heterozygosity is the
    usual configuration. This has a direct counselling consequence, because the partner of a man with CBAVD
    may be a carrier of a severe allele and the couple can conceive a child with classic cystic fibrosis.'
  evidence:
  - reference: PMID:29216686
    reference_title: 'Congenital bilateral absence of the vas deferens as an atypical form of cystic fibrosis:
      reproductive implications and genetic counseling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some mutations in the gene encoding cystic fibrosis transmembrane conductance regulator (CFTR)
      can lead to CBAVD as a monosymptomatic form of CF.
    explanation: States the relationship between the CBAVD genotype and cystic fibrosis.
- name: ADGRG2
  gene_term:
    preferred_term: ADGRG2
    term:
      id: hgnc:4516
      label: ADGRG2
  relationship_type: CAUSATIVE
  notes: 'X-linked, about 2% of cases, and confined to CFTR-negative men. Worth testing for precisely because
    the inheritance differs: an ADGRG2 diagnosis changes the counselling from partner CFTR screening to X-linked
    recurrence in the extended family.'
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Approximately 2% of the cases of CAVD are hemizygous for a loss-of-function mutation in the ADGRG2
      gene
    explanation: The share of cases attributable to ADGRG2.
- name: SLC9A3
  gene_term:
    preferred_term: SLC9A3
    term:
      id: hgnc:11073
      label: SLC9A3
  relationship_type: MODIFIER
  notes: A sodium/proton exchanger proposed as a further contributor, named alongside CFTR and ADGRG2 in the
    pathophysiological discussion of duct involution. Recorded as a modifier rather than a cause because the
    evidence reviewed here places it among candidate contributors rather than establishing it as a primary
    cause.
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: How the dysfunction of CFTR, ADGRG2, or other genes such as SLC29A3 leads to this involution is
      the subject of various pathophysiological hypotheses
    explanation: PARTIAL because the source names the gene among candidates whose mechanism is still hypothetical
      rather than establishing causation. Note the source prints "SLC29A3" here, which the surrounding CAVD
      literature and this entry treat as a typographical error for the sodium/proton exchanger SLC9A3.

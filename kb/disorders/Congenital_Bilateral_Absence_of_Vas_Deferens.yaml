      the vas deferens
    explanation: States the dose-sensitivity of the vas deferens that this node describes as a tissue-specific
      threshold.
- name: Impaired Luminal Fluid and Anion Secretion
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: CFTR in the apical membrane of genital tract epithelium drives anion and therefore water movement
    into the lumen. With reduced conductance the luminal secretion becomes scanty and viscous. Fluid secretion
    is required for normal mesonephric duct development, so this is the step at which an ion-transport defect
    becomes a developmental one.
  biological_processes:
  - preferred_term: chloride transmembrane transport
    modifier: DECREASED
    term:
      id: GO:1902476
      label: chloride transmembrane transport
  cell_types:

name: Congenital Bilateral Absence of Vas Deferens
creation_date: '2026-08-28T23:10:00Z'
category: Mendelian
description: 'Congenital bilateral absence of the vas deferens is obstructive azoospermia with intact spermatogenesis.
  The testis works; the conduit is missing. That separation is what makes the condition treatable - sperm can
  be recovered surgically from the epididymis or testis and used for ICSI - and it is also what makes it mechanistically
  interesting, because whatever destroys the vas deferens leaves the seminiferous epithelium alone.

  Most cases are a CFTR-related disorder. The genotypes involved are not the genotypes of cystic fibrosis:
  they retain enough residual CFTR function to spare lung and pancreas while still failing in the mesonephric
  duct derivatives, which appear to be the tissue with the least tolerance for reduced anion and fluid secretion.
  The commonest configuration is one severe and one mild allele in compound heterozygosity. A smaller group
  - about 2% of cases - is X-linked, caused by loss-of-function variants in ADGRG2, an adhesion GPCR specific
  to the epididymis and efferent ducts, and those men have no CFTR abnormality at all.

  The most useful distinction in this entry is not between those two genes but between two developmental timings.
  CAVD associated with a solitary kidney carries CFTR mutations at conspicuously low rates, and the coincidence
  of absent duct and absent kidney points to a failure of mesonephric duct organogenesis - an early, structural
  event. CFTR- and ADGRG2-related disease looks different: the duct forms and then involutes, progressively,
  later in fetal life and possibly beyond birth. This entry covers the second. The renal-anomaly group is a
  developmental field defect that happens to share a clinical endpoint.'

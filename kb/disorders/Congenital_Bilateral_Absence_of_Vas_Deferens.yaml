- name: Progressive Involution of Mesonephric Duct Derivatives
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: 'The duct is formed and then lost. Fetal studies report the vas deferens obstructed and degenerating
    by mucus at 12-18 weeks, with the process worsening as gestation continues - so this is involution of a
    structure that developed, not failure to develop one. The timing is the load-bearing point of this entry:
    it distinguishes CFTR- and ADGRG2-related disease from the CAVD that accompanies renal agenesis, where
    the duct appears never to have formed properly at all.'

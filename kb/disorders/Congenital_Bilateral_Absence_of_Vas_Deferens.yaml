    snippet: ADGRG2, encoding the epididymal- and efferent-ducts-specific adhesion G protein-coupled receptor
      G2
    explanation: Establishes the tissue-restricted expression that makes loss of this receptor produce an isolated
      genital phenotype.
  - reference: PMID:27476656
    reference_title: Truncating Mutations in the Adhesion G Protein-Coupled Receptor G2 Gene ADGRG2 Cause an
      X-Linked Congenital Bilateral Absence of Vas Deferens.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Previous studies have demonstrated that Adgrg2-knockout male mice develop obstructive infertility.
    explanation: The model-organism support for ADGRG2 causing obstructive infertility, cited as prior work
      in the human discovery report.
- name: Progressive Involution of Mesonephric Duct Derivatives
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: 'The duct is formed and then lost. Fetal studies report the vas deferens obstructed and degenerating
    by mucus at 12-18 weeks, with the process worsening as gestation continues - so this is involution of a
    structure that developed, not failure to develop one. The timing is the load-bearing point of this entry:
    it distinguishes CFTR- and ADGRG2-related disease from the CAVD that accompanies renal agenesis, where
    the duct appears never to have formed properly at all.'
  biological_processes:
  - preferred_term: chloride transmembrane transport
    modifier: DECREASED
    term:
      id: GO:1902476
      label: chloride transmembrane transport

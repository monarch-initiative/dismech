genetic:
- name: CFTR
  gene_term:
    preferred_term: CFTR
    term:
      id: hgnc:1884
      label: CFTR
  relationship_type: CAUSATIVE
  notes: 'The dominant cause, and the allele class that defines it is the intronic poly-T tract. The 5T variant
    - written IVS8-5T in the older numbering and IVS9-5T in the newer - reduces exon-skipping fidelity and
    so lowers the amount of full-length CFTR transcript without abolishing it. That is the unnamed "mild allele"
    in the compound-heterozygous configuration this entry describes, and in a Chinese CBAVD series it was the
    only recurrent variant: no other CFTR hotspot appeared, and no ADGRG2 variants were found at all.


    p.Arg117His is the other allele worth naming, and it carries a counselling problem rather than a mechanistic
    one. It is usually in cis with the benign T7 tract, its overall phenotype is mild, and sweat chloride does
    not track severity - so a man ascertained through CBAVD cannot be reassured or alarmed on the basis of
    a sweat test. What matters is his partner''s genotype: in the French series five couples at risk of a child
    with cystic fibrosis were identified this way.


    Practically, this allele spectrum is why panel testing under-serves this disease. Standard panels are built
    around cystic-fibrosis-causing variants, and the alleles that cause isolated CBAVD are disproportionately
    the mild, intronic and rearrangement ones those panels do not carry.'
  evidence:
  - reference: PMID:29216686
    reference_title: 'Congenital bilateral absence of the vas deferens as an atypical form of cystic fibrosis:
      reproductive implications and genetic counseling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some mutations in the gene encoding cystic fibrosis transmembrane conductance regulator (CFTR)
      can lead to CBAVD as a monosymptomatic form of CF.
    explanation: States the relationship between the CBAVD genotype and cystic fibrosis.
  - reference: PMID:35119551
    reference_title: Genetic analysis and intracytoplasmic sperm injection outcomes of Chinese patients with
      congenital bilateral absence of vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There are no obvious hotspot CFTR mutations in Chinese CBAVD patients besides the IVS9-5 T allele.
    explanation: Establishes the 5T tract as the one recurrent allele in that population, and the absence of
      other hotspots.
  - reference: PMID:35119551
    reference_title: Genetic analysis and intracytoplasmic sperm injection outcomes of Chinese patients with
      congenital bilateral absence of vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 35 of 46 (76.09%) patients carried at least one variation in CFTR, but no copy number
      variants or ADGRG2 variations were found.
    explanation: The CFTR-positive rate and the absence of ADGRG2 variants in this cohort.
  - reference: PMID:23378603
    reference_title: CFTR p.Arg117His associated with CBAVD and other CFTR-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 97% of the patients had the intronic T7 normal variant in cis with p.Arg117His.
    explanation: The cis configuration that makes p.Arg117His mild in most carriers.
  - reference: PMID:23378603
    reference_title: CFTR p.Arg117His associated with CBAVD and other CFTR-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No correlation was observed between sweat chloride concentrations and disease severity.
    explanation: Supports the statement that sweat chloride cannot be used to grade risk in these men.
  - reference: PMID:23378603
    reference_title: CFTR p.Arg117His associated with CBAVD and other CFTR-related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five couples at risk of CF offspring were identified and four benefited from prenatal or preimplantation
      genetic diagnoses (PND or PGD).
    explanation: Quantifies the counselling yield that follows from identifying the man's genotype.
- name: ADGRG2
  gene_term:
    preferred_term: ADGRG2
    term:
      id: hgnc:4516
      label: ADGRG2
  relationship_type: CAUSATIVE
  notes: 'X-linked, about 2% of cases, and confined to CFTR-negative men. Worth testing for precisely because
    the inheritance differs: an ADGRG2 diagnosis changes the counselling from partner CFTR screening to X-linked
    recurrence in the extended family. Penetrance is not complete. A nonsense variant, p.Ser303*, was found
    in an X-linked azoospermia pedigree and also in a male relative with normal reproductive capability, and
    genital phenotypes among carriers ranged from normal to dilated vas deferens, spermatic veins and epididymis.
    So an ADGRG2 diagnosis predicts recurrence risk in the family without predicting the phenotype of any given
    carrier.'
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Approximately 2% of the cases of CAVD are hemizygous for a loss-of-function mutation in the ADGRG2
      gene
    explanation: The share of cases attributable to ADGRG2.
  - reference: PMID:37273165
    reference_title: A novel ADGRG2 truncating variant associated with X-linked obstructive azoospermia in
      a large Chinese pedigree.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This mutation was also unexpectedly found in a male member with normal reproductive capability.
    explanation: The incomplete-penetrance observation that qualifies ADGRG2 counselling.
- name: SLC9A3
  gene_term:
    preferred_term: SLC9A3
    term:
      id: hgnc:11073
      label: SLC9A3
  relationship_type: SUSCEPTIBILITY
  notes: 'A sodium/proton exchanger. Single-copy SLC9A3 deletions are found in Taiwanese CBAVD patients who
    carry no major CFTR mutation, and the knockout mouse gives a mechanism: losing Slc9a3 dramatically reduces
    CFTR protein in the epididymis and vas deferens and produces obstructive azoospermia.


    Recorded as SUSCEPTIBILITY rather than CAUSATIVE, and the distinction matters. The human evidence is a
    heterozygous single-copy deletion in a small number of men, with no ClinGen assertion; the causal demonstration
    is in a homozygous-null mouse. That is variants conferring susceptibility in combination with other factors,
    not variants sufficient in a mendelian sense - which is what CAUSATIVE asserts in this schema.


    What the mouse does establish, and what makes SLC9A3 worth carrying at all, is that it acts by destabilising
    CFTR. So it is evidence for the entry''s central claim that the shared dependency is on ductal fluid handling
    rather than on any one gene product - reached through a modifier of CFTR abundance rather than through
    a third independent route.'
  evidence:
  - reference: PMID:28384194
    reference_title: Loss of SLC9A3 decreases CFTR protein and causes obstructed azoospermia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we found that CFTR expression was dramatically decreased in the epididymis and vas deferens of
      Slc9a3 knockout mice
    explanation: The mechanistic link from SLC9A3 loss to reduced CFTR in exactly the tissues this disease
      affects.
  - reference: PMID:28384194
    reference_title: Loss of SLC9A3 decreases CFTR protein and causes obstructed azoospermia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Slc9a3-/- mice developed obstructive azoospermia because of abnormal abundant secretions and calcification
      in the lumen of the reproductive tract
    explanation: The phenotype, which is this disease's endpoint reached through a third gene.
  - reference: PMID:28384194
    reference_title: Loss of SLC9A3 decreases CFTR protein and causes obstructed azoospermia in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Some patients have a single copy deletion of the solute carrier family 9 isoform 3 (SLC9A3) gene.
    explanation: The human genetic observation that motivated the mouse work.
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: How the dysfunction of CFTR, ADGRG2, or other genes such as SLC29A3 leads to this involution is
      the subject of various pathophysiological hypotheses
    explanation: Retained because it places SLC9A3 alongside the two main genes in the review literature. Note
      the source prints SLC29A3, which the CAVD literature treats as a typographical error for SLC9A3.
prevalence:
- population: Men, worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: Reported as approximately 0.1% of men for congenital absence of the vas deferens overall (bilateral
    and unilateral together), normalised here to 100 per 100,000. The source states this is probably an underestimate,
    since unilateral disease in fertile men is generally never diagnosed - so the figure is a floor, and it
    covers a broader concept than this entry's scope.
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of CAVDs in men is reported to be approximately 0.1%. However, this figure is probably
      underestimated, because unilateral forms of CAVD in asymptomatic fertile men are not usually diagnosed.
    explanation: PARTIAL because the quoted figure is for congenital absence of the vas deferens overall rather
      than for the bilateral form this entry covers, and the source itself flags it as an underestimate.
diagnosis:
- name: Clinical and Semen Assessment
  description: Bilaterally non-palpable vasa on scrotal examination, with a semen profile of azoospermia, low
    volume, acidic pH and low fructose, against normal FSH and normal or near-normal testicular size. That
    combination separates obstructive from non-obstructive azoospermia before any genetic test is sent.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:29216686
    reference_title: 'Congenital bilateral absence of the vas deferens as an atypical form of cystic fibrosis:
      reproductive implications and genetic counseling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Diagnosis of CBAVD is generally based on these criteria: presence of normal to slightly small
      sized testicles, non-palpable vas deferens, normal plasma levels of FSH (Follicle-Stimulating Hormone),
      and reduced ejaculate volume'
    explanation: The diagnostic criteria this entry describes.
- name: CFTR and ADGRG2 Testing with Renal Ultrasound
  description: 'CFTR testing is indicated in essentially every case, both to establish the diagnosis and because
    the result determines whether the partner needs carrier screening. ADGRG2 is the next test in CFTR-negative
    men. Renal ultrasound belongs in the same workup for a different reason: a solitary kidney marks the developmental-field
    group, in which CFTR mutations are conspicuously uncommon and a negative CFTR result is therefore expected
    rather than surprising.'
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The majority of subjects with CAVD carry at least one cystic fibrosis-causing mutation that warrants
      CFTR testing and in case of a positive result, genetic counseling prior to conception.
    explanation: Establishes CFTR testing and the counselling that follows a positive result.
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An important proportion of these unexplained CAVDs coexist with a solitary kidney suggesting an
      early organogenesis disorder (Wolffian duct)
    explanation: The reason renal imaging belongs in the workup - it identifies a group with a different developmental
      mechanism and a different expected genetic yield.
- name: Scrotal Ultrasound and Pelvic MRI
  description: Imaging confirms the absent vasa and characterises the seminal vesicles, which are abnormal
    in nearly every patient. MRI adds the intra-abdominal segment, which scrotal ultrasound cannot reach -
    and a dilated intra-abdominal vas deferens, seen in bilateral but not unilateral disease, is a positive
    imaging argument for acquired involution rather than primary agenesis. That makes imaging evidence for
    this entry's central mechanism and not only a diagnostic step.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:41255074
    reference_title: 'Evaluation of the congenital absence of the vas deferens with magnetic resonance imaging:
      preliminary findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The intra-abdominal part of the VD dilatation is a new finding in CAVD and was not found in patients
      with CUAVD.
    explanation: The imaging finding specific to bilateral disease.
  - reference: PMID:41255074
    reference_title: 'Evaluation of the congenital absence of the vas deferens with magnetic resonance imaging:
      preliminary findings.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Preliminary findings in this study are consistent with the theory of acquired vasal agenesis in
      CBAVD.
    explanation: An independent line of support for the progressive-involution model this entry is built on.
treatments:
- name: Surgical Sperm Retrieval with ICSI
  therapeutic_modality: SURGERY
  description: 'The definitive management, and it works because the lesion is obstructive. Sperm are recovered
    from the epididymis or testis and used for intracytoplasmic sperm injection. Outcomes in isolated CBAVD
    are notably better than in men with full cystic fibrosis: in a two-centre comparison the CF group had lower
    retrieved sperm concentration and motile count, needed rescue testicular extraction far more often, and
    had roughly half the fertilisation rate. That gradient is evidence that CFTR affects sperm function itself
    and not only the conduit - which qualifies the tidy "obstruction only" account this entry otherwise gives.'
  treatment_term:
    preferred_term: sperm retrieval
    term:
      id: NCIT:C94427
      label: Sperm Retrieval
  target_mechanisms:
  - target: Obstructive Azoospermia with Preserved Spermatogenesis
    treatment_effect: MODULATES
    description: Bypasses the missing conduit rather than restoring it. No postnatal treatment reaches the
      duct involution - but see the prenatal CFTR modulator entry, which reports the one setting in which something
      appears to.
  evidence:
  - reference: PMID:32930103
    reference_title: Sperm retrieval and intracytoplasmic sperm injection outcomes in men with cystic fibrosis
      disease versus congenital bilateral absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The CF group also demonstrated a significantly higher rate of rescue testicular sperm extraction
      (70.0% vs 27.6%, P < 0.03) and lower fertilization rate with ICSI (32.5% vs 68.9%, P < 0.01).
    explanation: The comparative outcome data distinguishing isolated CBAVD from full cystic fibrosis.
  - reference: PMID:32930103
    reference_title: Sperm retrieval and intracytoplasmic sperm injection outcomes in men with cystic fibrosis
      disease versus congenital bilateral absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: those with CF demonstrated lower sperm quality, greater difficulty with sperm retrieval, and worse
      ICSI outcomes compared with CBAVD-only patients
    explanation: The study's conclusion, which supports treating retrieval success in isolated CBAVD as the
      favourable case.
- name: Partner CFTR Screening and Genetic Counselling
  therapeutic_modality: OTHER
  description: Not optional. Because the man carries at least one cystic fibrosis-causing allele, a carrier
    partner puts the couple at risk of a child with classic cystic fibrosis - a far more serious disease than
    the father's. Partner screening and, where indicated, preimplantation genetic testing are what convert
    a treatable infertility into a safe one.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29216686
    reference_title: 'Congenital bilateral absence of the vas deferens as an atypical form of cystic fibrosis:
      reproductive implications and genetic counseling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: genetic counseling should be offered to couples undergoing ART to discuss the probability of having
      offspring that carry CFTR gene mutations
    explanation: The counselling recommendation this entry records.
  - reference: PMID:33000223
    reference_title: 'Mutations of the cystic fibrosis transmembrane conductance regulator gene in males with
      congenital bilateral absence of the vas deferens: Reproductive implications and genetic counseling (Review).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: With the use of pre-implantation genetic diagnosis, testicular or epididymal sperm aspiration,
      intracytoplasmic sperm injection and in vitro fertilization, patients affected by CBAVD are able to have
      children who do not carry CFTR gene mutations, thereby preventing disease.
    explanation: Establishes preimplantation genetic testing as the route to avoiding transmission.
  - reference: PMID:20301428
    reference_title: Cystic Fibrosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once the CFTR pathogenic variants have been identified in an affected family member, targeted
      heterozygote testing for at-risk relatives and prenatal/preimplantation genetic testing for CF are possible.
    explanation: The GeneReviews genetic-counselling position, which is the baseline this entry's counselling
      treatment follows.
- name: Intracytoplasmic Sperm Injection
  therapeutic_modality: OTHER
  description: 'Fertilisation of the partner''s oocytes with the retrieved spermatozoa. Recorded separately
    from retrieval because the two steps have different determinants: retrieval success depends on residual
    CFTR activity, while cumulative ICSI success in the same Lille cohort did not differ between cystic fibrosis
    and CFTR-related disorder groups. Once usable sperm are in hand, the CFTR genotype stops mattering as much.'
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Obstructive Azoospermia with Preserved Spermatogenesis
    treatment_effect: MODULATES
    description: Achieves fertilisation without the conduit.
  evidence:
  - reference: PMID:40850271
    reference_title: 'Cystic fibrosis: influence of CFTR variants on epididymal sperm recovery and ICSI results.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cumulative success rates of ICSI did not differ significantly across groups.
    explanation: The result that separates ICSI outcome from retrieval outcome in this population.
  - reference: PMID:35119551
    reference_title: Genetic analysis and intracytoplasmic sperm injection outcomes of Chinese patients with
      congenital bilateral absence of vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Spermatozoa were successfully retrachieved in 46 patients, and 39 of the patients had their own
      offspring through ICSI.
    explanation: The paternity rate achieved through retrieval plus ICSI in a consecutive CBAVD series. Quoted
      verbatim including the source's typo 'retrachieved' for 'retrieved'.
- name: Prenatal CFTR Modulator Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: 'The one intervention that appears to reach the mechanism rather than bypass it, and it is a
    single case. A male fetus with cystic fibrosis whose heterozygous carrier mother began elexacaftor/tezacaftor/ivacaftor
    at 27+4 weeks had bilateral vasa deferentia demonstrable on ultrasound at 8 weeks of age - a structure
    absent in nearly all males with cystic fibrosis at birth.


    The timing is what makes it mechanistically informative rather than merely encouraging. Men already born
    and taking modulators show no improvement in infertility. A structure that can be preserved at 27 weeks
    and not recovered afterwards is a structure that is being lost during gestation, which is independent evidence
    for the progressive-involution model this entry is built on and against fixed early agenesis.


    n=1, uncontrolled, and the ethical position for a heterozygous fetus - who would not develop the disease
    - is unresolved. Recorded because of what it establishes about the mechanism, not as a management recommendation.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Progressive Involution of Mesonephric Duct Derivatives
    treatment_effect: INHIBITS
    description: Restores CFTR function during the window in which the duct is still present, apparently arresting
      the involution.
  evidence:
  - reference: PMID:41654435
    reference_title: Prenatal initiation of elexacaftor/tezacaftor/ivacaftor via carrier mother prevents congenital
      bilateral absence of vas deferens in a male infant with cystic fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Remarkably, ultrasound at 8 weeks demonstrated bilateral vas deferens, a structure typically absent
      in nearly all male patients with CF at birth.
    explanation: The observation itself, and the reason it is remarkable.
  - reference: PMID:41654435
    reference_title: Prenatal initiation of elexacaftor/tezacaftor/ivacaftor via carrier mother prevents congenital
      bilateral absence of vas deferens in a male infant with cystic fibrosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: These findings suggest that prenatal CFTR modulation - even when initiated late in gestation -
      may alter the trajectory of CF-related organ manifestations, including male reproductive development.
    explanation: The authors' own hedged interpretation, which this entry does not strengthen.
  - reference: PMID:39288989
    reference_title: 'Use of CFTR modulators in pregnancy: new information for neonatal, paediatrics and midwifery
      teams.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At present male patients taking CFTR modulators have not shown improvement in infertility.
    explanation: 'The postnatal complement: modulators given after birth do not restore fertility, which is
      what makes the prenatal timing the load-bearing variable.'
differential_diagnoses:
- name: Congenital unilateral absence of the vas deferens
  description: A different clinical entity, not a milder form. Fertility is often preserved because one duct
    remains patent, it is frequently an incidental finding, and its genetic architecture differs - CFTR mutations
    account for a smaller share and 60-70% of cases have no genetic diagnosis at all, against 10-20% for the
    bilateral form. Explicitly out of scope for this entry.
  evidence:
  - reference: PMID:32025909
    reference_title: Genetics of the congenital absence of the vas deferens.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: despite this recent finding, 10-20% of CBAVDs and 60-70% of CUAVDs remain without a genetic diagnosis
    explanation: The differing genetic yield that supports treating unilateral disease as a separate entity.
  disease_term:
    preferred_term: vas deferens, congenital unilateral aplasia of
    term:
      id: MONDO:0800311
      label: vas deferens, congenital unilateral aplasia of
discussions:
- discussion_id: cbavd_two_developmental_timings
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Progressive Involution of Mesonephric Duct Derivatives
  - differential_diagnoses#Congenital unilateral absence of the vas deferens
  prompt: Is CAVD with a solitary kidney the same disease as CFTR-related CAVD, or a developmental field defect
    that shares an endpoint?
  rationale: 'Two lines of evidence say these are different processes. CAVD occurring with renal agenesis has
    a conspicuously low CFTR mutation rate - low enough that the reviewed literature describes CFTR mutations
    as absent in that group - and the co-occurrence of an absent duct with an absent kidney points at the mesonephric
    duct itself, from which both derive. Against that, CFTR- and ADGRG2-related disease shows a duct that formed
    and then degenerated, with fetal specimens at 12-18 weeks showing obstruction and denaturation by mucus
    that worsens as gestation proceeds.

    If that reading is right, then "CBAVD" as currently used names two mechanistically distinct conditions
    - an early organogenesis failure and a late progressive involution - that a clinician cannot separate without
    a renal ultrasound. It would explain the otherwise puzzling 10-20% of bilateral cases with no genetic diagnosis
    despite deep CFTR testing, and it would mean those men are not simply awaiting a better CFTR panel.

    What is missing is direct evidence. No study has compared duct histology across the two groups at matched
    gestational ages, and the renal-anomaly group has not been systematically exome-sequenced for developmental
    regulators of the mesonephric duct. Until it is, the distinction rests on an inference from mutation yield
    and a co-occurring anomaly.'
  proposed_experiments:
  - experiment_id: cbavd_renal_anomaly_group_exome
    name: Exome sequencing of CAVD stratified by renal ultrasound
    description: Sequence CFTR-negative CAVD cohorts stratified by the presence or absence of a solitary kidney,
      testing whether the renal-anomaly group is enriched for variants in mesonephric duct developmental regulators
      rather than in ion transport genes.
    would_support:
    - pathophysiology#Progressive Involution of Mesonephric Duct Derivatives
    supporting_outcome:
    - The renal-anomaly group is enriched for developmental regulators and depleted of ion-transport variants,
      establishing two distinct genetic architectures behind one clinical endpoint.
    refuting_outcome:
    - Both groups converge on ion-transport and duct-maintenance genes, meaning the renal anomaly reflects
      severity along one mechanism rather than a separate one.

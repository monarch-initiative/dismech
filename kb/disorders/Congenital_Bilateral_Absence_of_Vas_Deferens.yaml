notes: 'Scope. This entry covers isolated congenital bilateral absence of the vas deferens - the CFTR-related
  and ADGRG2-related forms in which the genital tract is the only affected system. It is deliberately distinct
  from kb/disorders/Cystic_Fibrosis.yaml, which models Vas Deferens Agenesis as one phenotype node of multisystem
  CF. The content that has no home in the CF entry is what justifies a separate one: the residual-function
  CFTR genotype threshold, the X-linked ADGRG2 route which involves CFTR not at all, and the distinction from
  the renal-anomaly developmental group.

  Of MONDO:0018801''s three descendants, the two bilateral forms (MONDO:0010178 CFTR-related, MONDO:0010511
  X-linked) are modelled here as has_subtypes because they converge on one pathograph. Congenital unilateral
  aplasia (MONDO:0800311) is recorded as a differential diagnosis rather than a subtype - fertility is often
  preserved and the genetic architecture differs.

  Deep research. Curated with a single OpenScientist deep-research report (research/Congenital_Bilateral_Absence_of_Vas_Deferens-deep-research-openscientist.md).
  Its reference validation reported 25/25 citations verified. Its term validation reported needs_review with
  five mislabelled terms, including MONDO:0009299 offered under the bare label "MONDO" when the ontology calls
  it "46 XX gonadal dysgenesis". No CURIE in this entry was taken from the report; every binding here was resolved
  independently against the term caches and OLS.'

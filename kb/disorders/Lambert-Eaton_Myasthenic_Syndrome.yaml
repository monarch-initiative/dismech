animal_models:
- name: LEMS IgG passive-transfer mouse
  species: Mouse
  publication: PMID:29125190
  description: >-
    Daily intraperitoneal injection of LEMS patient serum or IgG into mice for two to four
    weeks. The model matters because it settles the direction of causation: the disease
    transfers with the antibody alone, so the antibody is sufficient and the cellular
    immune response is not required.
  modeled_mechanisms:
  - target: Antigenic Modulation and Depletion of Active Zone Particles
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Passive transfer reproduces the channel loss and release-site disorganisation this
      node asserts, in an animal that never mounted the immune response itself.
    limitations: >-
      Passive transfer models the effector arm and nothing upstream of it. It cannot
      reproduce the paraneoplastic trigger, tolerance breakdown, or the natural history,
      and the antibody is supplied continuously rather than produced.
    readouts:
    - name: Presynaptic calcium channel number at the neuromuscular junction
      target: Antigenic Modulation and Depletion of Active Zone Particles
      direction: DECREASED
      interpretation: >-
        The channel depletion this node models, produced by transferred human IgG.
      evidence:
      - reference: PMID:29125190
        reference_title: "Lambert-Eaton myasthenic syndrome: mouse passive-transfer model illuminates disease pathology and facilitates testing therapeutic leads."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The LEMS-mediated attack reduces the number of presynaptic calcium
          channels, disorganizes transmitter release sites, and results in the homeostatic
          upregulation of other calcium channel types"
        explanation: The measured channel loss and release-site disorganisation.
    evidence:
    - reference: PMID:29125190
      reference_title: "Lambert-Eaton myasthenic syndrome: mouse passive-transfer model illuminates disease pathology and facilitates testing therapeutic leads."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a passive-transfer animal model has been developed in mice, which can be
        created by daily intraperitoneal injections of LEMS patient serum or IgG into mice
        for 2-4 weeks"
      explanation: Establishes the model and its construction, which is what makes it
        informative for an antibody-effector node.

treatments:
- name: Amifampridine (3,4-Diaminopyridine)
  description: >-
    Potassium channel blocker that prolongs the presynaptic action potential, widening the
    window for calcium entry and so increasing acetylcholine release. It works downstream
    of the lesion without correcting it - the antibody is untouched.

    The efficacy trial used a randomised withdrawal design rather than a conventional
    placebo start, because the drug had been in use for thirty years without conclusive
    evidence and withholding it de novo was not acceptable. Patients stable on 3,4-DAP
    were tapered to placebo or continued: none of the 14 continued on drug deteriorated by
    more than 30% on timed up-and-go, against 72% of the 18 tapered to placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amifampridine
      term:
        id: CHEBI:135948
        label: amifampridine
  target_mechanisms:
  - target: Reduced Calcium-Dependent Acetylcholine Release
    treatment_effect: ACTIVATES
    description: >-
      Increases release at the affected terminal by prolonging depolarisation. Curated as
      acting on the release node rather than on the antibody node, because it is
      symptomatic: it compensates for the deficit and does not reduce it.
  evidence:
  - reference: PMID:29280483
    reference_title: "3,4-diaminopyridine base effectively treats the weakness of Lambert-Eaton myasthenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 14 participants who received continuous 3,4-DAP had > 30%
      deterioration in 3TUG time versus 72% of the 18 who tapered to placebo (P <
      0.0001)"
    explanation: The primary efficacy result, with both arms and its denominators.
  - reference: PMID:29280483
    reference_title: "3,4-diaminopyridine base effectively treats the weakness of Lambert-Eaton myasthenia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "3,4-diaminopyridine has been used to treat Lambert-Eaton myasthenia (LEM)
      for 30 years despite the lack of conclusive evidence of efficacy"
    explanation: Marked PARTIAL because it is context rather than support - it records why
      a withdrawal design was needed, which is what makes the result interpretable.
- name: Tumour Treatment
  description: >-
    In paraneoplastic disease, treating the underlying small-cell lung carcinoma is part
    of treating the neurological disorder rather than a parallel concern. It is the only
    treatment in this entry that acts on the trigger rather than on the effector arm or
    the symptom, which is why it is curated separately from immunosuppression rather than
    bundled with it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: tumour-directed therapy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Small-Cell Lung Carcinoma Ectopic Antigen Expression and Anti-Tumour Immune Response
    treatment_effect: INHIBITS
    description: >-
      Removing or shrinking the tumour removes the source of the ectopically expressed
      antigen that drives the cross-reactive response. Applies only to the paraneoplastic
      form; in tumour-negative LEMS this treatment has no target.
    evidence:
    - reference: PMID:38494285
      reference_title: "Lambert-Eaton myasthenic syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment of the tumor as well as symptomatic treatment and
        immunosuppression can effectively control symptoms in the majority of patients"
      explanation: Names tumour treatment as one of the three arms that control the
        neurological symptoms, which is the claim this edge makes.
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid diagnosis is important because of the association with SCLC in 50%-60%
      of patients, which stresses the need for vigorous tumor screening after diagnosis"
    explanation: Why tumour screening, and therefore tumour treatment, is on the critical
      path in this disease rather than incidental to it.

- name: Immunosuppression
  description: >-
    Reduction of the pathogenic antibody, as opposed to compensating for its effect.
    Curated as acting on the antibody node rather than the release node, which is the
    distinction between it and amifampridine: one lowers the cause, the other works around
    it.

    The cached sources establish immunosuppression as an effective arm without specifying
    a regimen, so no specific agent is curated here. Corticosteroids, azathioprine, IVIG
    and plasma exchange are used in practice; adding them needs a reference in the cache
    that states the claim, which this entry does not yet have.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Immunosuppression
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Anti-P/Q-Type VGCC Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Acts on production of the pathogenic autoantibody, upstream of the channel depletion
      and the release deficit.
    evidence:
    - reference: PMID:38494285
      reference_title: "Lambert-Eaton myasthenic syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment of the tumor as well as symptomatic treatment and
        immunosuppression can effectively control symptoms in the majority of patients"
      explanation: Establishes immunosuppression as an effective arm, which is what this
        edge asserts; the agent-level detail is deliberately not curated.
  evidence:
  - reference: PMID:29125190
    reference_title: "Lambert-Eaton myasthenic syndrome: mouse passive-transfer model illuminates disease pathology and facilitates testing therapeutic leads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LEMS is an autoimmune disorder caused by antibodies directed against the
      voltage-gated calcium channels that provide the calcium ion flux that triggers
      acetylcholine release at the neuromuscular junction"
    explanation: >-
      The rationale for an antibody-directed treatment. The antibody is the cause, so
      lowering it is disease-modifying in a way symptomatic treatment is not.

definitions:
- definition_type: PHENOTYPE_ALGORITHM
  name: DELTA-P score for small-cell lung carcinoma prediction in LEMS
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    A clinical score that allocates one point for each of a set of features present at or
    within three months of onset, to estimate the probability that a patient with LEMS has
    an underlying small-cell lung carcinoma and so to set the intensity of tumour
    screening.

    Seven independent predictors of small-cell lung carcinoma were identified: age at
    onset, smoking behaviour, weight loss, Karnofsky performance status, bulbar
    involvement, male sexual impotence, and SOX1 antibodies. The score built from them
    contains only six items, and the seventh is the one deliberately left out. SOX1
    serology is excluded, so the maximum score is 6 and the instrument is purely clinical
    - which is what the source means by calling it "the simple clinical DELTA-P score",
    and what makes it usable at the bedside before any antibody result returns.

    The six scored items are age at onset at least 50 years, smoking at diagnosis, weight
    loss of at least 5%, bulbar involvement, erectile dysfunction, and Karnofsky
    performance status below 70, each present at or within three months of onset. Several
    are the disease's own phenotypes, which is what makes the score a mechanism-adjacent
    instrument rather than a generic risk calculator: the paraneoplastic form declares
    itself partly through a more aggressive neurological presentation.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Derived in a nationwide cohort of 107 Dutch patients and validated in a separate
      cohort of 112 British patients, with tumour status as the reference standard.
  evidence:
  - reference: PMID:21245427
    reference_title: "Clinical Dutch-English Lambert-Eaton Myasthenic syndrome (LEMS) tumor association prediction score accurately predicts small-cell lung cancer in the LEMS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We derived a prediction score for SCLC in LEMS in a nationwide cohort of 107
      Dutch patients, and validated it in a similar cohort of 112 British patients"
    explanation: The derivation and validation cohorts, which is what the
      VALIDATED_AGAINST_GOLD_STANDARD status rests on.
  - reference: PMID:21245427
    reference_title: "Clinical Dutch-English Lambert-Eaton Myasthenic syndrome (LEMS) tumor association prediction score accurately predicts small-cell lung cancer in the LEMS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at onset, smoking behavior, weight loss, Karnofsky performance status,
      bulbar involvement, male sexual impotence, and the presence of Sry-like high-mobility
      group box protein 1 serum antibodies were independent predictors for SCLC in LEMS"
    explanation: The seven independent predictors. Quoted because the distinction between
      these and the six scored items below is the thing most easily got wrong about this
      score - SOX1 appears here and not there.
  - reference: PMID:21245427
    reference_title: "Clinical Dutch-English Lambert-Eaton Myasthenic syndrome (LEMS) tumor association prediction score accurately predicts small-cell lung cancer in the LEMS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A DELTA-P score was derived allocating 1 point for the presence of each of
      the following items at or within 3 months from onset: age at onset ≥ 50 years,
      smoking at diagnosis, weight loss ≥ 5%, bulbar involvement, erectile dysfunction, and
      Karnofsky performance status lower than 70"
    explanation: The six items that are actually scored, with SOX1 absent. This is the
      operative definition of the instrument.
  - reference: PMID:21245427
    reference_title: "Clinical Dutch-English Lambert-Eaton Myasthenic syndrome (LEMS) tumor association prediction score accurately predicts small-cell lung cancer in the LEMS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A DELTA-P score of 0 or 1 corresponded to a 0% to 2.6% chance of SCLC,
      whereas scores of 4, 5, and 6 corresponded to chances of SCLC of 93.5%, 96.6%, and
      100%, respectively"
    explanation: The calibration, and independent confirmation that the maximum is 6 rather
      than 7.

differential_diagnoses:
- name: Myasthenia gravis
  description: >-
    The principal differential and the informative one. Both are autoimmune disorders of
    neuromuscular transmission, but the antigen sits on opposite sides of the synapse -
    postsynaptic acetylcholine receptor in myasthenia gravis, presynaptic calcium channel
    in LEMS. Separated by reflexes (lost in LEMS, preserved in myasthenia gravis), by the
    direction of the response to exertion, by autonomic involvement, and by the increment
    rather than decrement on high-frequency repetitive nerve stimulation.
- name: Inflammatory or metabolic proximal myopathy
  description: >-
    Shares the proximal, leg-predominant weakness that typically brings LEMS patients to
    attention. Distinguished by intact tendon reflexes, absent autonomic features, and
    normal repetitive nerve stimulation.

discussions:
- discussion_id: gap_antibody_negative_lems
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What accounts for the roughly one in ten patients with clinical and electrophysiological
    LEMS in whom P/Q-type VGCC antibodies are not detected?
  attaches_to:
  - pathophysiology#Anti-P/Q-Type VGCC Autoantibody Production
  rationale: >-
    The cited review reports antibody detection in about 90% of patients, which leaves a
    seronegative remainder that the entry's mechanism does not explain. The possibilities
    are not equivalent and they are not distinguished by the evidence curated here: assay
    insensitivity for low-titre or conformation-dependent antibodies; antibodies against a
    different presynaptic target not covered by the standard assay; or a genuinely distinct
    presynaptic disorder sharing the phenotype.

    The second possibility is not merely speculative. In a series of 20 patients, six had
    antibodies against synaptotagmin, a synaptic vesicle protein rather than a calcium
    channel, and three of those six showed no cross-reactivity with any VGCC subtype at
    all. So antibodies to non-channel presynaptic proteins do occur in LEMS, and can occur
    without accompanying channel antibodies - which is the seronegative case this gap is
    about. What is not established is how much of the seronegative remainder they account
    for, since that study predates current assays and was not designed to sample it.

    Note what this does not affect. Tumour screening is driven by the DELTA-P score, which
    is purely clinical and contains no serology at all, so a VGCC-seronegative patient
    enters that pathway with nothing missing. SOX1 antibodies are a separate marker of the
    paraneoplastic form and a different antigen entirely - a nuclear SCLC tumour antigen,
    not the presynaptic calcium channel - so seronegativity for VGCC says nothing about
    SOX1 status either.
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These antibodies can be detected in about 90% of patients"
    explanation: Establishes the seronegative remainder this gap is about.
  - reference: PMID:8583238
    reference_title: "Antibodies to recombinant synaptotagmin and calcium channel subtypes in Lambert-Eaton myasthenic syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Six patients' sera (1 with small cell lung carcinoma (SCLC)) contained
      antibodies specifically recognizing the recombinant synaptotagmin on immunoblots"
    explanation: Antibodies to a non-channel presynaptic protein in LEMS, which is the
      second possibility this gap lists.
  - reference: PMID:8583238
    reference_title: "Antibodies to recombinant synaptotagmin and calcium channel subtypes in Lambert-Eaton myasthenic syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Three of 6 synaptotagmin-positive sera had cross-reactivity with N and/or Q
      subtypes of VGCC; the remaining 3 showed no cross-reactivity with VGCCs"
    explanation: The half of those sera with no channel reactivity at all - the closest
      thing in the cited literature to the seronegative case. PARTIAL because the study
      predates current assays and was not designed to quantify that remainder.
  proposed_experiments:
  - experiment_id: seronegative_lems_target_discovery
    name: Antigen discovery in seronegative clinically defined LEMS
    description: >-
      Screen serum from patients meeting clinical and electrophysiological criteria for
      LEMS but negative on standard P/Q-type VGCC radioimmunoassay against presynaptic
      terminal proteins, with passive transfer to test whether any candidate reproduces the
      release deficit.

notes: >-
  No GeneReviews chapter exists for this disease. The search "Lambert-Eaton
  GeneReviews[All Fields]" returns zero results. Expected - LEMS is an acquired autoimmune
  disorder with no Mendelian form.

  MONDO has an obsolete term for this concept, MONDO:0000287 "obsolete Lambert-Eaton
  myasthenic syndrome", alongside the live MONDO:0018556 bound here. A synonym-aware
  search returns both; a label-only search or taking the first hit would risk the obsolete
  one. Recorded because the same class of error - a term that exists but should not be
  used - has bitten this knowledge base before.

  There is deliberately NO genetic: section, and the reason is worth stating because the
  temptation is real. CACNA1A encodes the alpha-1A subunit of the P/Q-type channel this
  disease's antibodies attack, so the gene is easy to reach for. But LEMS is not a
  channelopathy: the gene is not mutated, the channel is not intrinsically defective, and
  an autoantibody removes a normal channel from a normal terminal. Every value available
  in RelationshipTypeEnum - CAUSATIVE, RISK_FACTOR, SUSCEPTIBILITY, MODIFIER, BIOMARKER,
  DISPUTED, UNKNOWN - would assert some genetic relationship to the disease, and none
  holds. Germline CACNA1A variants cause familial hemiplegic migraine, episodic ataxia
  type 2 and spinocerebellar ataxia 6; none of them is LEMS. The channel's identity is
  curated where it is true, on the antibody-target pathophysiology node.

  A first draft did include a genetic entry with relationship_type OTHER. Schema
  validation rejected it, because OTHER is not in the enum - and that rejection was
  correct for a better reason than the one it gave: there was no honest value to choose.

  PMID:41945880 was found during the literature search and deliberately not used. It is a
  randomised trial of amifampridine in MYASTHENIA GRAVIS, not LEMS - the same drug in the
  neighbouring disease. Citing it here would have been a subtle and hard-to-detect
  substitution, since the drug name and trial design both look right.

  Immunosuppression is curated without a named agent, deliberately. Corticosteroids,
  azathioprine, IVIG and plasma exchange are all standard practice, and the temptation is
  to list them. The cached sources establish immunosuppression as an effective arm without
  stating a regimen, and a treatment entry naming an agent whose evidence is not in the
  cache would be an assertion the entry cannot support. Adding them needs a guideline or
  trial reference fetched into the cache first.

  Frequency bands are assigned to two phenotypes only, and the asymmetry is deliberate.
  Dry mouth and erectile dysfunction carry FREQUENT because PMID:9443463 measured them
  directly in a series of 30 patients - 77% and 45% of men - so each band has its own
  quantitative snippet rather than an inferred one. The remaining phenotypes are left
  unbanded because the cited review describes the triad qualitatively. The numbers that
  review does give - 90% antibody positivity, 50-60% SCLC association - are a test
  characteristic and a comorbidity rate respectively, not phenotype frequencies, and are
  curated in the sections where they belong.

  Deep-research provenance, corrected. An earlier version of this note claimed that a
  validation section had been retro-fitted onto the claude_code report with just
  validate-research-reference. It had not. The recipe fails in this environment on TLS
  certificate verification when it reaches api.crossref.org, and the report carries neither
  a reference_validation frontmatter block nor a Reference Validation section. The intent
  was recorded as the outcome, which is exactly the error the evidence policy here exists
  to catch, so it is corrected rather than quietly removed.

  What is true about the provenance: the first round of curation cited nothing from the
  report, having assembled its references by direct PubMed search. The review round drew
  five PMID leads from the report's citation list (2853605, 18032743, 27997683, 29125190,
  31831596). Each was fetched with just fetch-reference, its real abstract read, and every
  snippet verified against the cache - so the report functioned as a lead generator and no
  claim rests on its summary of any paper.


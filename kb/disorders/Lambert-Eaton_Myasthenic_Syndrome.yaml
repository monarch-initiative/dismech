name: Lambert-Eaton Myasthenic Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Autoimmune
disease_term:
  preferred_term: Lambert-Eaton myasthenic syndrome
  term:
    id: MONDO:0018556
    label: Lambert-Eaton myasthenic syndrome
description: >-
  Autoimmune disorder of neuromuscular transmission caused by antibodies against
  presynaptic P/Q-type voltage-gated calcium channels, producing proximal weakness, loss
  of tendon reflexes and autonomic dysfunction.

  It is the presynaptic mirror of myasthenia gravis, and the contrast is what makes it
  mechanistically legible. Myasthenia gravis attacks the postsynaptic acetylcholine
  receptor, so the muscle cannot hear a normal signal; LEMS attacks the presynaptic
  calcium channel, so the nerve cannot send one. That single difference in locus predicts
  the entire clinical inversion - reflexes lost rather than preserved, weakness that
  briefly improves with exertion rather than worsening, autonomic involvement rather than
  none, and a drug that works by prolonging the nerve terminal action potential rather
  than by inhibiting acetylcholinesterase.

  In roughly half to sixty percent of patients it is paraneoplastic to small-cell lung
  carcinoma, so the diagnosis is also a cancer-screening trigger. That makes prediction
  of tumour risk a curated part of the disease rather than an afterthought.

pathophysiology:
- name: Small-Cell Lung Carcinoma Ectopic Antigen Expression and Anti-Tumour Immune Response
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Half to two thirds of LEMS is paraneoplastic, and in those patients the tumour is not
    a comorbidity but the origin of the autoimmunity. Small-cell lung carcinoma is a
    neuroendocrine tumour that expresses neuronal antigens ectopically, and the immune
    response mounted against them cross-reacts with the same antigens at the presynaptic
    terminal. SOX1 is the clearest worked case: it was identified as a highly immunogenic
    SCLC tumour antigen, and antibodies against it are found in 64% of patients with LEMS
    and SCLC and in none with idiopathic LEMS.

    The clinical corollary is the one that makes this node worth curating separately. The
    anti-tumour response that produces the neurological disease also restrains the tumour:
    patients with SCLC-LEMS survive markedly longer than patients with SCLC alone. The
    autoimmunity is, on the tumour's terms, partly protective.

    Roughly 40-50% of LEMS has no tumour. This node is therefore a trigger for one form of
    the disease and absent in the other, and both converge on the antibody node below.
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid diagnosis is important because of the association with SCLC in 50%-60%
      of patients, which stresses the need for vigorous tumor screening after diagnosis"
    explanation: The frequency of the paraneoplastic form and the reason it drives the
      diagnostic pathway.
  - reference: PMID:18032743
    reference_title: "SOX1 antibodies are markers of paraneoplastic Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Probing of the fetal brain expression library with AGNA sera resulted in the
      isolation of SOX1, a highly immunogenic tumor antigen in SCLC"
    explanation: Identifies a specific SCLC tumour antigen driving an antibody response in
      LEMS, which is the mechanism this node asserts.
  - reference: PMID:18032743
    reference_title: "SOX1 antibodies are markers of paraneoplastic Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX1 antibodies were present in 64% of patients with LEMS and SCLC but in
      none of the 50 with idiopathic LEMS (p < 0.0001)"
    explanation: The all-or-none split between paraneoplastic and idiopathic LEMS, which is
      what licenses curating this as a trigger present in one form and absent in the other.
  - reference: PMID:31831596
    reference_title: "Long-term follow-up, quality of life, and survival of patients with Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumor survival was significantly longer in 81 patients with SCLC-LEMS
      compared to patients with non-LEMS SCLC (overall median survival 17 vs 7.0 months, p
      < 0.0001)"
    explanation: The anti-tumour arm of the same immune response, and the reason this node
      cannot be described purely as pathological.
  downstream:
  - target: Anti-P/Q-Type VGCC Autoantibody Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cross-reactivity between the anti-tumour response and the neuronal channel. Curated
      with unknown intermediates because the evidence cached here establishes the tumour
      antigen, the antibody response and the association, but not the steps by which
      tolerance to the presynaptic channel is broken.
- name: Anti-P/Q-Type VGCC Autoantibody Production
  biological_scale: MOLECULAR
  description: >-
    Autoantibodies directed against P/Q-type voltage-gated calcium channels localised in
    the presynaptic motor nerve terminal and in the autonomic nervous system. Detectable
    in about 90% of patients.

    The shared distribution of the target across motor and autonomic terminals is the
    reason autonomic symptoms belong to this disease rather than accompanying it: one
    antigen, two systems. Quantitative autonomic testing bears this out - 93% of patients
    have an abnormal composite autonomic score, so dysautonomia is near-universal rather
    than occasional.

    One caveat belongs on the shared-antigen account rather than beside it. In the same
    series no autoantibody correlated with the severity of autonomic dysfunction, and the
    N-type channel antibodies that would be the obvious mediator of autonomic transmission
    were found in only a minority. The antigen is shared; the quantitative link between
    antibody and autonomic severity is not established.
  molecular_functions:
  - preferred_term: calcium ion transmembrane transporter activity
    term:
      id: GO:0015085
      label: calcium ion transmembrane transporter activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: calcium transport via high voltage-gated calcium channel
    term:
      id: GO:0061577
      label: calcium ion transmembrane transport via high voltage-gated calcium channel
    modifier: DECREASED
  downstream:
  - target: Antigenic Modulation and Depletion of Active Zone Particles
    causal_link_type: DIRECT
    description: >-
      Bound antibody cross-links the channel, which is the step that removes it.
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/Q-type voltage-gated calcium channels (VGCCs) localized in the presynaptic
      motor nerve terminal and in the autonomic nervous system are targeted by antibodies
      in LEMS patients"
    explanation: Names the antigen and, in the same sentence, both tissues carrying it -
      which is what ties the autonomic arm to the motor one.
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These antibodies can be detected in about 90% of patients"
    explanation: The detection rate, which is what makes serology a practical diagnostic
      rather than a confirmatory afterthought.
  - reference: PMID:9443463
    reference_title: "Autonomic dysfunction in the Lambert-Eaton myasthenic syndrome: serologic and clinical correlates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Composite Autonomic Scoring Scale results were abnormal in 93% of patients,
      and autonomic failure was severe in 20%"
    explanation: Quantitative autonomic testing showing that dysautonomia is near-universal,
      which is what the shared-antigen claim predicts.
  - reference: PMID:9443463
    reference_title: "Autonomic dysfunction in the Lambert-Eaton myasthenic syndrome: serologic and clinical correlates."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No autoantibody correlated with autonomic dysfunction severity"
    explanation: The caveat on that account, quoted rather than paraphrased. The shared
      antigen explains why autonomic involvement occurs; it does not yet explain how severe
      it will be in a given patient.
  - reference: PMID:9443463
    reference_title: "Autonomic dysfunction in the Lambert-Eaton myasthenic syndrome: serologic and clinical correlates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, 93% of the patients were seropositive for P/Q-type Ca2+ channel
      antibodies"
    explanation: Independent corroboration of the roughly 90% seropositivity rate from a
      separate cohort two decades earlier.
- name: Antigenic Modulation and Depletion of Active Zone Particles
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The mechanism by which the antibody actually removes the channel, and the reason LEMS
    is a disease of channel number rather than of channel blockade. Bound divalent IgG
    cross-links the active zone particles - the freeze-fracture correlate of the
    presynaptic calcium channels - which aggregate into clusters and are then depleted from
    the membrane.

    The experiment that established this is a clean one. Divalent IgG and F(ab')2
    fragments aggregate and deplete the particles; monovalent Fab, which binds the same
    epitope but cannot cross-link two channels, does nothing. The pathogenic step is
    therefore cross-linking rather than binding, which is why an antibody that merely
    occupied the channel would not produce this disease.

    Removal is partly compensated: the terminal homeostatically upregulates other calcium
    channel types, which is a candidate reason the clinical severity is not simply
    proportional to antibody titre.
  molecular_functions:
  - preferred_term: calcium ion transmembrane transporter activity
    term:
      id: GO:0015085
      label: calcium ion transmembrane transporter activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: presynaptic active zone
    term:
      id: GO:0048786
      label: presynaptic active zone
  evidence:
  - reference: PMID:2853605
    reference_title: "Lambert-Eaton myasthenic syndrome IgG depletes presynaptic membrane active zone particles by antigenic modulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Divalent LEMS IgG and F(ab')2 aggregated and depleted the active zone
      particles, whereas monovalent Fab had no effect"
    explanation: The cross-linking requirement, with its own internal negative control. This
      is the specific claim the node makes.
  - reference: PMID:2853605
    reference_title: "Lambert-Eaton myasthenic syndrome IgG depletes presynaptic membrane active zone particles by antigenic modulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The active zone particles, normally arranged in double parallel rows, move
      closer together, form clusters, and are reduced in number"
    explanation: The morphological consequence, observed by quantitative freeze-fracture
      electron microscopy.
  - reference: PMID:29125190
    reference_title: "Lambert-Eaton myasthenic syndrome: mouse passive-transfer model illuminates disease pathology and facilitates testing therapeutic leads."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The LEMS-mediated attack reduces the number of presynaptic calcium channels,
      disorganizes transmitter release sites, and results in the homeostatic upregulation
      of other calcium channel types"
    explanation: Independent confirmation in the passive-transfer model, and the source of
      the compensation claim in this node's description.
  downstream:
  - target: Reduced Calcium-Dependent Acetylcholine Release
    causal_link_type: DIRECT
    description: >-
      Fewer functional calcium channels at the active zone means less calcium entry per
      action potential, and transmitter release is a steeply nonlinear function of that
      entry.
- name: Reduced Calcium-Dependent Acetylcholine Release
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  biological_scale: CELLULAR
  description: >-
    Loss of functional presynaptic calcium channels reduces calcium influx on
    depolarisation, and acetylcholine release is steeply calcium-dependent. The result is
    a quantal release deficit at an otherwise intact neuromuscular junction: the
    postsynaptic receptor, the acetylcholinesterase and the muscle are all normal.

    Two clinical signs follow directly from this and from nothing else. Sustained or
    repeated activity transiently accumulates presynaptic calcium, which partially
    overcomes the deficit - so strength and reflexes briefly improve after exertion, the
    reverse of myasthenia gravis. And on repetitive nerve stimulation the same physiology
    produces an increment at high frequency against a decrement at low frequency, which
    the cited review reports as a highly sensitive diagnostic pairing.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: acetylcholine secretion, neurotransmission
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
    modifier: DECREASED
  downstream:
  - target: Neuromuscular and Autonomic Transmission Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of decrement and increment upon repetitive nerve stimulation
      is also a highly sensitive diagnostic test"
    explanation: The electrophysiological signature of a presynaptic release deficit,
      quoted as the source states its diagnostic value.
- name: Neuromuscular and Autonomic Transmission Failure
  conforms_to: "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission"
  biological_scale: ORGANISM
  description: >-
    The clinical disorder: proximal weakness beginning in the upper legs, loss of tendon
    reflexes, and autonomic dysfunction. Progression can reach oculobulbar and, in severe
    cases, respiratory muscles.

    The ordering matters clinically. Weakness that starts in the thighs and spares the
    eyes early is the opposite of the ocular-onset pattern typical of myasthenia gravis,
    and it is a common reason LEMS is mistaken for a myopathy before serology is sent.
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lambert-Eaton myasthenic syndrome (LEMS) is a rare autoimmune disease
      characterized by proximal muscle weakness, loss of tendon reflexes, and autonomic
      dysfunction"
    explanation: The defining triad in the source's own words.
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness usually starts in the upper legs and can progress to
      oculobulbar and in severe cases respiratory muscles"
    explanation: Establishes the proximal-onset pattern and the severe end of the range.

phenotypes:
- category: Neurological
  name: Proximal Muscle Weakness
  description: >-
    Fluctuating proximal weakness, characteristically beginning in the upper legs.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness usually starts in the upper legs"
    explanation: The characteristic distribution.
- category: Neurological
  name: Loss of Tendon Reflexes
  description: >-
    Depressed or absent tendon reflexes, which may transiently return after sustained
    contraction - post-exercise facilitation. This is the sign that most reliably
    separates LEMS from myasthenia gravis at the bedside, because it follows from
    presynaptic physiology rather than from severity.
  phenotype_term:
    preferred_term: Hyporeflexia
    term:
      id: HP:0001265
      label: Hyporeflexia
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by proximal muscle weakness, loss of tendon reflexes, and
      autonomic dysfunction"
    explanation: Establishes areflexia as a defining rather than incidental feature.
- category: Neurological
  name: Autonomic Dysfunction
  description: >-
    Dysautonomia arising from the same P/Q-type channels in autonomic terminals. Dry
    mouth is the most commonly reported symptom; male sexual impotence is frequent enough
    to have earned a place in the tumour-prediction score.
  phenotype_term:
    preferred_term: Autonomic dysfunction
    term:
      id: HP:0002270
      label: Abnormality of the autonomic nervous system
  evidence:
  - reference: PMID:38494285
    reference_title: "Lambert-Eaton myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/Q-type voltage-gated calcium channels (VGCCs) localized in the presynaptic
      motor nerve terminal and in the autonomic nervous system are targeted by antibodies"
    explanation: Grounds the autonomic phenotype in the antigen's distribution rather than
      treating it as an unexplained association.

- category: Autonomic
  name: Dry Mouth
  description: >-
    Xerostomia, the commonest autonomic feature, and one of the direct consequences of the
    antigen being shared between motor and autonomic terminals.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Xerostomia
    term:
      id: HP:0000217
      label: Xerostomia
  evidence:
  - reference: PMID:9443463
    reference_title: "Autonomic dysfunction in the Lambert-Eaton myasthenic syndrome: serologic and clinical correlates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dry mouth (77%) and impotence (45% of men) were the most common symptoms"
    explanation: Direct quantitative support for the FREQUENT band (77%, within the 30-79%
      range), in a series of 30 patients with quantitative autonomic testing.
  - reference: PMID:29125190
    reference_title: "Lambert-Eaton myasthenic syndrome: mouse passive-transfer model illuminates disease pathology and facilitates testing therapeutic leads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Involvement of the autonomic nervous system is also likely and may cause a
      dry mouth; sometimes erectile dysfunction is also present in men"
    explanation: Names both autonomic phenotypes curated here in one sentence.


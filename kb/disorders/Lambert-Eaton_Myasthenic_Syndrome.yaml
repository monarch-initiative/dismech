name: Lambert-Eaton Myasthenic Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Complex
disease_term:
  preferred_term: Lambert-Eaton myasthenic syndrome
  term:
    id: MONDO:0018556
    label: Lambert-Eaton myasthenic syndrome
description: >-
  Autoimmune disorder of neuromuscular transmission caused by antibodies against
  presynaptic P/Q-type voltage-gated calcium channels, producing proximal weakness, loss
  of tendon reflexes and autonomic dysfunction.

  It is the presynaptic mirror of myasthenia gravis, and the contrast is what makes it
  mechanistically legible. Myasthenia gravis attacks the postsynaptic acetylcholine
  receptor, so the muscle cannot hear a normal signal; LEMS attacks the presynaptic
  calcium channel, so the nerve cannot send one. That single difference in locus predicts
  the entire clinical inversion - reflexes lost rather than preserved, weakness that
  briefly improves with exertion rather than worsening, autonomic involvement rather than
  none, and a drug that works by prolonging the nerve terminal action potential rather
  than by inhibiting acetylcholinesterase.

  In roughly half to sixty percent of patients it is paraneoplastic to small-cell lung
  carcinoma, so the diagnosis is also a cancer-screening trigger. That makes prediction
  of tumour risk a curated part of the disease rather than an afterthought.

pathophysiology:
- name: Anti-P/Q-Type VGCC Autoantibody Production
  biological_scale: MOLECULAR
  description: >-
    Autoantibodies directed against P/Q-type voltage-gated calcium channels localised in
    the presynaptic motor nerve terminal and in the autonomic nervous system. Detectable
    in about 90% of patients.

    The shared distribution of the target across motor and autonomic terminals is the
    reason autonomic symptoms belong to this disease rather than accompanying it: one
    antigen, two systems.
  molecular_functions:
  - preferred_term: calcium ion transmembrane transporter activity
    term:
      id: GO:0015085
      label: calcium ion transmembrane transporter activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: calcium transport via high voltage-gated calcium channel
    term:
      id: GO:0061577
      label: calcium ion transmembrane transport via high voltage-gated calcium channel
    modifier: DECREASED
  downstream:
  - target: Reduced Calcium-Dependent Acetylcholine Release
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/Q-type voltage-gated calcium channels (VGCCs) localized in the presynaptic
      motor nerve terminal and in the autonomic nervous system are targeted by antibodies
      in LEMS patients"
    explanation: Names the antigen and, in the same sentence, both tissues carrying it -
      which is what ties the autonomic arm to the motor one.
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These antibodies can be detected in about 90% of patients"
    explanation: The detection rate, which is what makes serology a practical diagnostic
      rather than a confirmatory afterthought.
- name: Reduced Calcium-Dependent Acetylcholine Release
  biological_scale: CELLULAR
  description: >-
    Loss of functional presynaptic calcium channels reduces calcium influx on
    depolarisation, and acetylcholine release is steeply calcium-dependent. The result is
    a quantal release deficit at an otherwise intact neuromuscular junction: the
    postsynaptic receptor, the acetylcholinesterase and the muscle are all normal.

    Two clinical signs follow directly from this and from nothing else. Sustained or
    repeated activity transiently accumulates presynaptic calcium, which partially
    overcomes the deficit - so strength and reflexes briefly improve after exertion, the
    reverse of myasthenia gravis. And on repetitive nerve stimulation the same physiology
    produces an increment at high frequency against a decrement at low frequency, which
    the cited review reports as a highly sensitive diagnostic pairing.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: acetylcholine secretion, neurotransmission
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
    modifier: DECREASED
  downstream:
  - target: Neuromuscular and Autonomic Transmission Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of decrement and increment upon repetitive nerve stimulation
      is also a highly sensitive diagnostic test"
    explanation: The electrophysiological signature of a presynaptic release deficit,
      quoted as the source states its diagnostic value.
- name: Neuromuscular and Autonomic Transmission Failure
  biological_scale: ORGANISM
  description: >-
    The clinical disorder: proximal weakness beginning in the upper legs, loss of tendon
    reflexes, and autonomic dysfunction. Progression can reach oculobulbar and, in severe
    cases, respiratory muscles.

    The ordering matters clinically. Weakness that starts in the thighs and spares the
    eyes early is the opposite of the ocular-onset pattern typical of myasthenia gravis,
    and it is a common reason LEMS is mistaken for a myopathy before serology is sent.
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lambert-Eaton myasthenic syndrome (LEMS) is a rare autoimmune disease
      characterized by proximal muscle weakness, loss of tendon reflexes, and autonomic
      dysfunction"
    explanation: The defining triad in the source's own words.
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness usually starts in the upper legs and can progress to
      oculobulbar and in severe cases respiratory muscles"
    explanation: Establishes the proximal-onset pattern and the severe end of the range.

phenotypes:
- category: Neurological
  name: Proximal Muscle Weakness
  description: >-
    Fluctuating proximal weakness, characteristically beginning in the upper legs.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness usually starts in the upper legs"
    explanation: The characteristic distribution.
- category: Neurological
  name: Loss of Tendon Reflexes
  description: >-
    Depressed or absent tendon reflexes, which may transiently return after sustained
    contraction - post-exercise facilitation. This is the sign that most reliably
    separates LEMS from myasthenia gravis at the bedside, because it follows from
    presynaptic physiology rather than from severity.
  phenotype_term:
    preferred_term: Hyporeflexia
    term:
      id: HP:0001265
      label: Hyporeflexia
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by proximal muscle weakness, loss of tendon reflexes, and
      autonomic dysfunction"
    explanation: Establishes areflexia as a defining rather than incidental feature.
- category: Neurological
  name: Autonomic Dysfunction
  description: >-
    Dysautonomia arising from the same P/Q-type channels in autonomic terminals. Dry
    mouth is the most commonly reported symptom; male sexual impotence is frequent enough
    to have earned a place in the tumour-prediction score.
  phenotype_term:
    preferred_term: Autonomic dysfunction
    term:
      id: HP:0002270
      label: Abnormality of the autonomic nervous system
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/Q-type voltage-gated calcium channels (VGCCs) localized in the presynaptic
      motor nerve terminal and in the autonomic nervous system are targeted by antibodies"
    explanation: Grounds the autonomic phenotype in the antigen's distribution rather than
      treating it as an unexplained association.

treatments:
- name: Amifampridine (3,4-Diaminopyridine)
  description: >-
    Potassium channel blocker that prolongs the presynaptic action potential, widening the
    window for calcium entry and so increasing acetylcholine release. It works downstream
    of the lesion without correcting it - the antibody is untouched.

    The efficacy trial used a randomised withdrawal design rather than a conventional
    placebo start, because the drug had been in use for thirty years without conclusive
    evidence and withholding it de novo was not acceptable. Patients stable on 3,4-DAP
    were tapered to placebo or continued: none of the 14 continued on drug deteriorated by
    more than 30% on timed up-and-go, against 72% of the 18 tapered to placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amifampridine
      term:
        id: CHEBI:135948
        label: amifampridine
  target_mechanisms:
  - target: Reduced Calcium-Dependent Acetylcholine Release
    treatment_effect: ACTIVATES
    description: >-
      Increases release at the affected terminal by prolonging depolarisation. Curated as
      acting on the release node rather than on the antibody node, because it is
      symptomatic: it compensates for the deficit and does not reduce it.
  evidence:
  - reference: PMID:29280483
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 14 participants who received continuous 3,4-DAP had > 30%
      deterioration in 3TUG time versus 72% of the 18 who tapered to placebo (P <
      0.0001)"
    explanation: The primary efficacy result, with both arms and its denominators.
  - reference: PMID:29280483
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "3,4-diaminopyridine has been used to treat Lambert-Eaton myasthenia (LEM)
      for 30 years despite the lack of conclusive evidence of efficacy"
    explanation: Marked PARTIAL because it is context rather than support - it records why
      a withdrawal design was needed, which is what makes the result interpretable.
- name: Tumour Treatment and Immunosuppression
  description: >-
    In paraneoplastic disease, treating the underlying small-cell lung carcinoma is part
    of treating the neurological disorder rather than a parallel concern. Symptomatic
    treatment and immunosuppression control symptoms in most patients.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:38494285
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of the tumor as well as symptomatic treatment and immunosuppression
      can effectively control symptoms in the majority of patients"
    explanation: Establishes the three treatment arms together, in the order the source
      gives them.

definitions:
- definition_type: PHENOTYPE_ALGORITHM
  name: DELTA-P score for small-cell lung carcinoma prediction in LEMS
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    A clinical score that allocates one point for each of a set of features present at or
    within three months of onset, to estimate the probability that a patient with LEMS has
    an underlying small-cell lung carcinoma and so to set the intensity of tumour
    screening.

    The independent predictors identified were age at onset, smoking behaviour, weight
    loss, Karnofsky performance status, bulbar involvement, male sexual impotence, and the
    presence of SOX1 antibodies. Several of these are the disease's own phenotypes, which
    is what makes the score a mechanism-adjacent instrument rather than a generic
    risk calculator: the paraneoplastic form declares itself partly through a more
    aggressive neurological presentation.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Derived in a nationwide cohort of 107 Dutch patients and validated in a separate
      cohort of 112 British patients, with tumour status as the reference standard.
  evidence:
  - reference: PMID:21245427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We derived a prediction score for SCLC in LEMS in a nationwide cohort of 107
      Dutch patients, and validated it in a similar cohort of 112 British patients"
    explanation: The derivation and validation cohorts, which is what the
      VALIDATED_AGAINST_GOLD_STANDARD status rests on.
  - reference: PMID:21245427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at onset, smoking behavior, weight loss, Karnofsky performance status,
      bulbar involvement, male sexual impotence, and the presence of Sry-like high-mobility
      group box protein 1 serum antibodies were independent predictors for SCLC in LEMS"
    explanation: The seven predictors, quoted in full so the score is reproducible from the
      entry.

differential_diagnoses:
- name: Myasthenia gravis
  description: >-
    The principal differential and the informative one. Both are autoimmune disorders of
    neuromuscular transmission, but the antigen sits on opposite sides of the synapse -
    postsynaptic acetylcholine receptor in myasthenia gravis, presynaptic calcium channel
    in LEMS. Separated by reflexes (lost in LEMS, preserved in myasthenia gravis), by the
    direction of the response to exertion, by autonomic involvement, and by the increment
    rather than decrement on high-frequency repetitive nerve stimulation.
- name: Inflammatory or metabolic proximal myopathy
  description: >-
    Shares the proximal, leg-predominant weakness that typically brings LEMS patients to
    attention. Distinguished by intact tendon reflexes, absent autonomic features, and
    normal repetitive nerve stimulation.

discussions:
- discussion_id: gap_antibody_negative_lems
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What accounts for the roughly one in ten patients with clinical and electrophysiological
    LEMS in whom P/Q-type VGCC antibodies are not detected?
  attaches_to:
  - pathophysiology#Anti-P/Q-Type VGCC Autoantibody Production
  rationale: >-
    The cited review reports antibody detection in about 90% of patients, which leaves a
    seronegative remainder that the entry's mechanism does not explain. The possibilities
    are not equivalent and they are not distinguished by the evidence curated here: assay
    insensitivity for low-titre or conformation-dependent antibodies; antibodies against a
    different presynaptic target not covered by the standard assay; or a genuinely distinct
    presynaptic disorder sharing the phenotype.

    This matters practically as well as mechanistically, because tumour screening in LEMS
    is driven by a score that includes SOX1 antibody status, and a seronegative patient
    enters that pathway with one predictor already missing.
  proposed_experiments:
  - experiment_id: seronegative_lems_target_discovery
    name: Antigen discovery in seronegative clinically defined LEMS
    description: >-
      Screen serum from patients meeting clinical and electrophysiological criteria for
      LEMS but negative on standard P/Q-type VGCC radioimmunoassay against presynaptic
      terminal proteins, with passive transfer to test whether any candidate reproduces the
      release deficit.

notes: >-
  No GeneReviews chapter exists for this disease. The search "Lambert-Eaton
  GeneReviews[All Fields]" returns zero results. Expected - LEMS is an acquired autoimmune
  disorder with no Mendelian form.

  MONDO has an obsolete term for this concept, MONDO:0000287 "obsolete Lambert-Eaton
  myasthenic syndrome", alongside the live MONDO:0018556 bound here. A synonym-aware
  search returns both; a label-only search or taking the first hit would risk the obsolete
  one. Recorded because the same class of error - a term that exists but should not be
  used - has bitten this knowledge base before.

  There is deliberately NO genetic: section, and the reason is worth stating because the
  temptation is real. CACNA1A encodes the alpha-1A subunit of the P/Q-type channel this
  disease's antibodies attack, so the gene is easy to reach for. But LEMS is not a
  channelopathy: the gene is not mutated, the channel is not intrinsically defective, and
  an autoantibody removes a normal channel from a normal terminal. Every value available
  in RelationshipTypeEnum - CAUSATIVE, RISK_FACTOR, SUSCEPTIBILITY, MODIFIER, BIOMARKER,
  DISPUTED, UNKNOWN - would assert some genetic relationship to the disease, and none
  holds. Germline CACNA1A variants cause familial hemiplegic migraine, episodic ataxia
  type 2 and spinocerebellar ataxia 6; none of them is LEMS. The channel's identity is
  curated where it is true, on the antibody-target pathophysiology node.

  A first draft did include a genetic entry with relationship_type OTHER. Schema
  validation rejected it, because OTHER is not in the enum - and that rejection was
  correct for a better reason than the one it gave: there was no honest value to choose.

  PMID:41945880 was found during the literature search and deliberately not used. It is a
  randomised trial of amifampridine in MYASTHENIA GRAVIS, not LEMS - the same drug in the
  neighbouring disease. Citing it here would have been a subtle and hard-to-detect
  substitution, since the drug name and trial design both look right.

  No frequency bands are assigned to phenotypes. The cited review describes the triad
  qualitatively; the numbers it gives - 90% antibody positivity, 50-60% SCLC association -
  are a test characteristic and a comorbidity rate respectively, not phenotype frequencies,
  and are curated in the sections where they belong.

  Deep-research provenance: the claude_code report for this disease was generated without
  a reference_validation frontmatter block, so a validation section was retro-fitted with
  just validate-research-reference. Nothing from the report is cited here in any case - the
  reference set was assembled independently by direct PubMed search and every cited paper
  was read.


treatments:
- name: Early antibiotic therapy
  description: >-
    Antimicrobial treatment must be started early because septicemic plague is a
    severe form of plague; aminoglycosides, tetracyclines, fluoroquinolones, and
    sulfonamides all have reported clinical activity in treated human plague.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to aminoglycosides, other classes of antimicrobials including
      tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
      treatment
    explanation: >-
      Systematic review of individual treated human plague cases identifying several
      active antibiotic classes.
  - reference: PMID:32435801
    reference_title: "Antimicrobial Treatment Patterns and Illness Outcome Among United States Patients With Plague, 1942-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality differed significantly among those receiving high-efficacy therapy
      (9%) and only limited-efficacy therapy (51%).
    explanation: >-
      Surveillance analysis links prompt high-efficacy antimicrobial therapy to
      improved survival in reported U.S. plague cases.
transmission:
- name: Flea-borne and direct animal exposure
  description: >-
    Y. pestis reaches people by flea bites and by non-vector contact with infected
    animal material; direct tissue handling is a recognized route for primary
    septicemic plague.
  evidence:
  - reference: PMID:25643450
    reference_title: "[Yersinia pestis and plague - an update]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Transmission of Y. pestis to humans occurs by the bite of rat fleas, other
      flea vectors or by non vectorial routes, e. g., handling infected animals or
      consumption of contaminated food.
    explanation: >-
      Supports both flea-borne transmission and direct infected-animal handling as
      acquisition routes that can seed bloodstream Y. pestis infection.
progression:
- phase: Treated clinical spectrum
  notes: >-
    In a systematic review of published individual treated plague cases, primary
    septicemic plague was less common than primary bubonic or pneumonic plague but
    had the highest case fatality among those three presentations.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had primary bubonic (63%), pneumonic (21%), or septicemic (5%)
      plague, with associated case fatality rates of 17%, 27%, and 38%,
      respectively.
    explanation: >-
      Documents the relative frequency and treated case-fatality estimate for primary
      septicemic plague among published individual treated plague cases.

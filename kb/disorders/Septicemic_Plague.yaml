name: Septicemic Plague
creation_date: "2026-09-25T15:30:29Z"
category: Infectious Disease
description: >-
  Septicemic plague is the bloodstream form of plague: Yersinia pestis enters the
  blood, produces systemic infection with dysregulated inflammation, and can cause
  disseminated intravascular coagulation, purpura, and rapidly fatal multi-organ
  dysfunction.
disease_term:
  preferred_term: septicemic plague
  term:
    id: MONDO:0005956
    label: septicemic plague
parents:
- Plague
infectious_agent:
- name: Yersinia pestis
  infectious_agent_term:
    preferred_term: Yersinia pestis
    term:
      id: NCBITaxon:632
      label: Yersinia pestis
  description: >-
    Gram-negative plague bacillus that can produce bloodstream infection in the
    septicemic form of plague.
  evidence:
  - reference: PMID:12951845
    reference_title: "Yersinia pestis and the plague."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yersinia pestis is the cause of plague, an illness that may manifest in bubonic,
      pneumonic, or septicemic form.
    explanation: >-
      Establishes Y. pestis as the causative agent of the septicemic clinical form of
      plague.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:12951845
      reference_title: "Yersinia pestis and the plague."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Yersinia pestis is the cause of plague, an illness that may manifest in
        bubonic, pneumonic, or septicemic form.
      explanation: >-
        Septicemic plague is a bacterial infectious form of plague.
pathophysiology:
- name: Yersinia pestis Innate Immune Evasion
  description: >-
    After flea-to-mammal transmission, Y. pestis uses lipid A remodeling and
    type III secretion system Yop effectors to blunt TLR4-mediated innate
    recognition and phagocytic-cell signaling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: innate immune response
    modifier: DECREASED
    term:
      id: GO:0045087
      label: innate immune response
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Systemic Yersinia pestis Bacteremia
    causal_link_type: DIRECT
    description: >-
      Early immune evasion lets Y. pestis proliferate and disseminate into blood.
  evidence:
  - reference: PMID:23745121
    reference_title: "Structural Modifications of Bacterial Lipopolysaccharide that Facilitate Gram-Negative Bacteria Evasion of Host Innate Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Such modifications are thought to facilitate bacterial evasion of host innate
      immunity, thereby enhancing pathogenicity.
    explanation: >-
      Review evidence supports lipid A remodeling as a Gram-negative immune-evasion
      mechanism, including the Y. pestis temperature-shifted LPS program described
      in the same abstract.
  - reference: PMID:15847602
    reference_title: "Yersinia outer proteins: role in modulation of host cell signaling responses and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Innate and adaptive immune responses are thwarted as a consequence of Yop
      activities.
    explanation: >-
      Establishes that type III secretion system-delivered Yop effectors block host
      immune signaling in pathogenic Yersinia, including Y. pestis.
- name: Systemic Yersinia pestis Bacteremia
  description: >-
    Y. pestis enters and proliferates within the bloodstream as primary septicemic
    plague or after dissemination from a regional lymph-node focus.
  biological_scale: TISSUE
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Dysregulated Systemic Inflammatory Response
    causal_link_type: DIRECT
    description: >-
      Bloodstream Y. pestis infection triggers systemic inflammatory injury and
      clinical sepsis.
  evidence:
  - reference: PMID:15207311
    reference_title: "Plague."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bubonic disease, pneumonic plague, and septicemic plague are seen in addition to
      a number of other less common manifestations.
    explanation: >-
      Supports septicemic plague as a distinct clinical form within the Y. pestis
      disease spectrum.
- name: Dysregulated Systemic Inflammatory Response
  description: >-
    Bloodstream plague produces systemic inflammation and sepsis physiology that can
    progress to organ dysfunction and death.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Septicemic plague can produce coagulation failure with disseminated
      intravascular coagulation.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Bloodstream Y. pestis infection manifests as sepsis in the septicemic form.
  evidence:
  - reference: PMID:25643450
    reference_title: "[Yersinia pestis and plague - an update]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Without antibacterial therapy, the disease is associated with a high case
      fatality rate, ranging from 40% (bubonic plague) to nearly 100% (septicemic
      and pneumonic plague).
    explanation: >-
      Supports the fulminant systemic severity of the septicemic form downstream of
      bloodstream Y. pestis infection.

name: Septicemic Plague
creation_date: "2026-09-25T15:30:29Z"
category: Infectious Disease
description: >-
  Septicemic plague is the bloodstream form of plague: Yersinia pestis enters the
  blood, produces systemic infection with dysregulated inflammation, and can cause
  disseminated intravascular coagulation, purpura, and rapidly fatal multi-organ
  dysfunction.
disease_term:
  preferred_term: septicemic plague
  term:
    id: MONDO:0005956
    label: septicemic plague
parents:
- Plague
notes: >-
  Lump/split decision: septicemic plague is kept as a standalone entry because
  MONDO assigns it a distinct term (MONDO:0005956) and this entry curates the
  Y. pestis immune-evasion -> bloodstream-infection -> dysregulated-inflammation
  -> DIC mechanism that the Septicemic has_subtypes row on Plague.yaml does not
  carry. The Plague entry's Septicemic subtype row cross-references this entry.
  Bubonic and Pneumonic remain has_subtypes rows on Plague for now.
infectious_agent:
- name: Yersinia pestis
  infectious_agent_term:
    preferred_term: Yersinia pestis
    term:
      id: NCBITaxon:632
      label: Yersinia pestis
  description: >-
    Gram-negative plague bacillus that can produce bloodstream infection in the
    septicemic form of plague.
  evidence:
  - reference: PMID:12951845
    reference_title: "Yersinia pestis and the plague."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Yersinia pestis is the cause of plague, an illness that may manifest in bubonic,
      pneumonic, or septicemic form.
    explanation: >-
      Establishes Y. pestis as the causative agent of the septicemic clinical form of
      plague.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:12951845
      reference_title: "Yersinia pestis and the plague."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Yersinia pestis is the cause of plague, an illness that may manifest in
        bubonic, pneumonic, or septicemic form.
      explanation: >-
        Septicemic plague is a bacterial infectious form of plague.
pathophysiology:
- name: Yersinia pestis Innate Immune Evasion
  description: >-
    After flea-to-mammal transmission, Y. pestis uses lipid A remodeling and
    type III secretion system Yop effectors to blunt TLR4-mediated innate
    recognition and phagocytic-cell signaling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: innate immune response
    modifier: DECREASED
    term:
      id: GO:0045087
      label: innate immune response
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Systemic Yersinia pestis Bacteremia
    causal_link_type: DIRECT
    description: >-
      Early immune evasion lets Y. pestis proliferate and disseminate into blood.
  evidence:
  - reference: PMID:23745121
    reference_title: "Structural Modifications of Bacterial Lipopolysaccharide that Facilitate Gram-Negative Bacteria Evasion of Host Innate Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This alteration of lipid A forms following transmission of Y. pestis from
      fleas to humans contributes predominantly to the virulence of this bacterium
      over other virulence factors.
    explanation: >-
      Identifies temperature-dependent Y. pestis lipid A remodeling as the
      predominant virulence contributor for host innate-immune evasion.
  - reference: PMID:15847602
    reference_title: "Yersinia outer proteins: role in modulation of host cell signaling responses and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Innate and adaptive immune responses are thwarted as a consequence of Yop
      activities.
    explanation: >-
      Establishes that type III secretion system-delivered Yop effectors block host
      immune signaling in pathogenic Yersinia, including Y. pestis.
- name: Systemic Yersinia pestis Bacteremia
  description: >-
    Y. pestis enters and proliferates within the bloodstream as primary septicemic
    plague or after dissemination from a regional lymph-node focus.
  biological_scale: ORGANISM
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  downstream:
  - target: Dysregulated Systemic Inflammatory Response
    causal_link_type: DIRECT
    description: >-
      Bloodstream Y. pestis infection triggers systemic inflammatory injury and
      clinical sepsis.
  evidence:
  - reference: PMID:16943764
    reference_title: "Human plague--four states, 2006."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five (38%) patients had primary septicemic plague, and the remaining eight
      (62%) had bubonic plague.
    explanation: >-
      A CDC human case series documents primary septicemic (bloodstream) plague as
      a distinct presentation, here 38% of reported U.S. cases.
  - reference: PMID:15207311
    reference_title: "Plague."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bubonic disease, pneumonic plague, and septicemic plague are seen in addition to
      a number of other less common manifestations.
    explanation: >-
      Supports septicemic plague as a distinct clinical form within the Y. pestis
      disease spectrum.
- name: Dysregulated Systemic Inflammatory Response
  description: >-
    Bloodstream plague produces systemic inflammation and sepsis physiology that can
    progress to organ dysfunction and death.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Septicemic plague can produce coagulation failure with disseminated
      intravascular coagulation.
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Bloodstream Y. pestis infection manifests as sepsis in the septicemic form.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      The systemic proinflammatory response produces fever.
  evidence:
  - reference: PMID:17429414
    reference_title: "Study of proinflammatory responses induced by Yersinia pestis in human monocytes using cDNA arrays."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      intracellular infection of human monocytes with Y. pestis results in a
      strong inflammatory response at early time periods
    explanation: >-
      Human-monocyte transcriptional profiling shows Y. pestis triggers a strong
      early proinflammatory response, grounding the monocyte and inflammatory-response
      bindings on this node.
  - reference: PMID:25643450
    reference_title: "[Yersinia pestis and plague - an update]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Without antibacterial therapy, the disease is associated with a high case
      fatality rate, ranging from 40% (bubonic plague) to nearly 100% (septicemic
      and pneumonic plague).
    explanation: >-
      Supports the fulminant systemic severity of the septicemic form downstream of
      bloodstream Y. pestis infection.
phenotypes:
- name: Sepsis
  category: Constitutional
  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  evidence:
  - reference: PMID:16943764
    reference_title: "Human plague--four states, 2006."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five (38%) patients had primary septicemic plague, and the remaining eight
      (62%) had bubonic plague.
    explanation: >-
      Primary septicemic (bloodstream/sepsis) plague occurred in 38% of this CDC
      human case series.
- name: Disseminated Intravascular Coagulation
  category: Hematologic
  phenotype_term:
    preferred_term: Disseminated intravascular coagulation
    term:
      id: HP:0005521
      label: Disseminated intravascular coagulation
  sequelae:
  - target: Purpura
    description: >-
      Consumptive coagulopathy produces purpura and cutaneous hemorrhage.
  evidence:
  - reference: PMID:17429414
    reference_title: "Study of proinflammatory responses induced by Yersinia pestis in human monocytes using cDNA arrays."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      downregulation of genes such as thromobomodulin, which may play a role in
      coagulation, resulting in disseminated intravascular coagulation, a primary
      cause of death in plague infected hosts.
    explanation: >-
      Human-monocyte data link Y. pestis-induced thrombomodulin downregulation to
      the disseminated intravascular coagulation that is a primary cause of death.
- name: Purpura
  category: Dermatologic
  phenotype_term:
    preferred_term: Purpura
    term:
      id: HP:0000979
      label: Purpura
- name: Fever
  category: Constitutional
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
treatments:
- name: Early antibiotic therapy
  description: >-
    Antimicrobial treatment must be started early because septicemic plague is a
    severe form of plague; aminoglycosides, tetracyclines, fluoroquinolones, and
    sulfonamides all have reported clinical activity in treated human plague.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to aminoglycosides, other classes of antimicrobials including
      tetracyclines, fluoroquinolones, and sulfonamides are effective for plague
      treatment
    explanation: >-
      Systematic review of individual treated human plague cases identifying several
      active antibiotic classes.
  - reference: PMID:32435801
    reference_title: "Antimicrobial Treatment Patterns and Illness Outcome Among United States Patients With Plague, 1942-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality differed significantly among those receiving high-efficacy therapy
      (9%) and only limited-efficacy therapy (51%).
    explanation: >-
      Surveillance analysis links prompt high-efficacy antimicrobial therapy to
      improved survival in reported U.S. plague cases.
transmission:
- name: Flea-borne and direct animal exposure
  description: >-
    Y. pestis reaches people by flea bites and by non-vector contact with infected
    animal material; direct tissue handling is a recognized route for primary
    septicemic plague.
  evidence:
  - reference: PMID:25643450
    reference_title: "[Yersinia pestis and plague - an update]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission of Y. pestis to humans occurs by the bite of rat fleas, other
      flea vectors or by non vectorial routes, e. g., handling infected animals or
      consumption of contaminated food.
    explanation: >-
      Supports both flea-borne transmission and direct infected-animal handling as
      acquisition routes that can seed bloodstream Y. pestis infection.
progression:
- phase: Treated clinical spectrum
  notes: >-
    In a systematic review of published individual treated plague cases, primary
    septicemic plague was less common than primary bubonic or pneumonic plague but
    had the highest case fatality among those three presentations.
  evidence:
  - reference: PMID:32435802
    reference_title: "Antimicrobial Treatment of Human Plague: A Systematic Review of the Literature on Individual Cases, 1937-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had primary bubonic (63%), pneumonic (21%), or septicemic (5%)
      plague, with associated case fatality rates of 17%, 27%, and 38%,
      respectively.
    explanation: >-
      Documents the relative frequency and treated case-fatality estimate for primary
      septicemic plague among published individual treated plague cases.

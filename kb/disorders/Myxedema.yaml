name: Myxedema
creation_date: "2026-05-07T23:30:13Z"
description: >-
  Myxedema refers to the severe end of the hypothyroid spectrum, in which
  profound thyroid hormone deficiency produces a hypometabolic state and the
  characteristic non-pitting dermal accumulation of glycosaminoglycans that
  gives the disorder its name. Decreased peripheral hormone action slows
  cardiovascular, respiratory, gastrointestinal, and neurological function,
  yielding bradycardia, hypothermia, dry skin, macroglossia, and delayed deep
  tendon reflexes. Myxedema coma (myxedema crisis) is the life-threatening
  decompensated form, marked by altered consciousness, hypoventilation, and
  cardiovascular collapse, and carries high inpatient mortality requiring urgent
  thyroid hormone replacement and supportive care.
category: Complex

environmental:
- name: Infection (Pneumonia and Sepsis)
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: Underlying bacterial infections, particularly pneumonia and sepsis, are very common precipitants of acute decompensation into myxedema coma and strongly correlate with inpatient mortality.
  influences_mechanisms:
  - target: Respiratory And Cardiovascular Decompensation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Superimposed infection and pneumonia accelerate respiratory depression, hypercarbia, and systemic decompensation in severely hypothyroid patients.
    evidence:
    - reference: PMID:31237256
      reference_title: Thyroid emergencies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the presence of pneumonia, the downhill process is accelerated and torpor with slowed respiration coupled with airway obstruction from peri-laryngeal edema and the large tongue lead to progressive depression of the central nervous system and coma."
      explanation: Demonstrates that pneumonia accelerates respiratory decompensation and central nervous system depression leading to myxedema coma.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is highly important to consider underlying infection, e.g., pneumonia, which is a very common precipitant of myxedema coma, because these patients may have the usual signs of infection masked by the bradycardia and hypothermia, thus not demonstrating the fever or tachycardia typical of infection."
    explanation: Identifies infection, especially pneumonia, as a very common precipitant of myxedema coma.
- name: Cold Exposure
  exposure_term:
    preferred_term: exposure to decreased temperature
    term:
      id: ECTO:0001057
      label: exposure to decreased temperature
  notes: Cold weather can precipitate decompensation from hypothyroidism to myxedema coma.
  influences_mechanisms:
  - target: Respiratory And Cardiovascular Decompensation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Severe environmental cold overwhelms impaired hypothyroid thermogenesis and precipitates systemic decompensation into myxedema coma.
    evidence:
    - reference: PMID:31237256
      reference_title: Thyroid emergencies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severely cold weather is only one of many possible precipitating factors that may convert the clinical status of the patient from hypothyroidism to myxedema coma."
      explanation: Connects severe cold exposure to clinical conversion from hypothyroidism to decompensated myxedema coma.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severely cold weather is only one of many possible precipitating factors that may convert the clinical status of the patient from hypothyroidism to myxedema coma."
    explanation: The review identifies severe cold weather as a precipitating factor for myxedema coma.
- name: Medication-Related Respiratory Suppression
  notes: Sedatives and related medications can precipitate myxedema coma by suppressing respiration.
  influences_mechanisms:
  - target: Respiratory And Cardiovascular Decompensation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Sedatives, analgesics, hypnotics, and anesthetics suppress ventilatory drive, precipitating respiratory decompensation and myxedema coma.
    evidence:
    - reference: PMID:31237256
      reference_title: Thyroid emergencies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Medications that can precipitate myxedema coma include sedatives, analgesics, antidepressants, hypnotics, antipsychotics, and anesthetic drugs via a shared mechanism of the tendency to suppress respiration."
      explanation: Directly links respiratory-depressant medications to respiratory suppression precipitating myxedema coma.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medications that can precipitate myxedema coma include sedatives, analgesics, antidepressants, hypnotics, antipsychotics, and anesthetic drugs via a shared mechanism of the tendency to suppress respiration."
    explanation: This supports medication-related respiratory suppression as a precipitating factor.
treatments:
- name: Intravenous Thyroid Hormone Replacement
  description: >
    ICU management centers on rapid thyroid hormone replacement, often with
    intravenous levothyroxine and selected use of liothyronine.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
    - preferred_term: liothyronine
      term:
        id: CHEBI:18258
        label: 3,3',5-triiodo-L-thyronine
  target_phenotypes:
  - preferred_term: Hypothermia
    term:
      id: HP:0002045
      label: Hypothermia
  - preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
  - preferred_term: Bradycardia
    term:
      id: HP:0001662
      label: Bradycardia
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently published guidelines for treatment of hypothyroidism and myxedema coma by the American Thyroid Association (13) emphasize individualizing dosage based upon age, weight, and cardiac status, suggesting the initial use of intravenous T4 in a dose of 200–400 μg with a lower dose given to older patients or those with cardiac disease."
    explanation: This supports guideline-based intravenous T4 replacement for myxedema coma, with dosing individualized by patient risk.
- name: Empiric Hydrocortisone
  description: >
    Empiric corticosteroid coverage is considered while adrenal insufficiency is
    evaluated, particularly before or during thyroid hormone replacement.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
  target_phenotypes:
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As recommended above, a baseline plasma cortisol having been drawn, the patient’s vascular stability may be enhanced by administration of empiric corticosteroid administration, e.g., 50–100 mg hydrocortisone intravenously."
    explanation: This supports empiric intravenous hydrocortisone during acute myxedema coma management.

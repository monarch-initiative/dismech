prevalence:
- population: Hospitalized tertiary-care cohorts
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Extremely rare life-threatening decompensation of severe hypothyroidism;
    single-center tertiary cohorts report 11 cases over 8 years in Krakow,
    Poland (PMID:38967885) and 41 cases over 21 years with 80.5% female
    predominance in Chandigarh, India (PMID:35945394), while Ono et al.'s
    149-patient Japanese inpatient series summarized in PMID:31237256 reported
    that two-thirds were women (mean age 77 years) with 30% mortality and
    higher frequency in winter.
  evidence:
  - reference: PMID:38967885
    reference_title: "Increased incidence of myxedema coma during the COVID-19 pandemic and in the post pandemic era: a single-center case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myxedema coma (MC) is an extremely rare but potentially fatal endocrine emergency. The aim of the study was to report an increased incidence of life-threatening myxedema coma that occurred in relation to the COVID-19 pandemic. In this paper, we report a cohort of 11 patients with MC who were treated at the University Hospital in Krakow, Poland, in the period from 2015 to 2023."
    explanation: Establishes the extreme rarity of myxedema coma in hospitalized cohorts (11 cases over 8 years in Krakow).
  - reference: PMID:35945394
    reference_title: Utility of myxedema score as a predictor of mortality in myxedema coma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of forty-one patients (new cohort; n = 18 and old cohort; n = 23) were enrolled into the study. There was a female predominance (80.5%)."
    explanation: Documents a 21-year tertiary cohort of 41 patients in Chandigarh with 80.5% female predominance.
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ono, et al, (2) analyzed 149 hospitalized subjects with myxedema coma and noted that two-thirds were women and the group had an average age of 77 years. Death was seen in 30% and with higher frequency in winter."
    explanation: Summarizes Ono et al.'s 149-patient inpatient series demonstrating ~67% female predominance, mean age 77 years, and higher winter mortality/frequency.
progression:
- phase: Pre-comatose Hypothyroid State
  age_range: 60-85 years
  notes: >-
    Longstanding or previously undiagnosed profound hypothyroidism typically in
    older women (average age ~77 years), characterized by progressive lethargy,
    slow speech, hypothermia, and generalized non-pitting edema prior to acute
    crisis.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the pre-comatose state, the typical clinical findings include hypothermia, decreased mentation, generalized edema and the usual hallmarks of profound hypothyroidism. A typical presentation is of a woman with the above findings in the age range of 60–85 presenting in the cold of winter after being found down."
    explanation: Characterizes the pre-comatose phase and typical age of presentation (60-85 years).
- phase: Acute Multisystem Decompensation and Coma
  notes: >-
    Triggered by cold exposure, infection (especially pneumonia/sepsis), or
    respiratory-depressant medications, evolving from somnolence to carbon
    dioxide narcosis, respiratory failure, hypotension, and coma with high
    in-hospital mortality (27.2% to 60.9%).
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As implied above, the most dramatic aspect of the presentation is the coma per se which typically evolves from initial lethargy, then progressing to a history of increased sleeping throughout the day, and then inability of family members to awaken the patient."
    explanation: Describes the clinical progression from lethargy and hypersomnolence to frank coma.
  - reference: PMID:35945394
    reference_title: Utility of myxedema score as a predictor of mortality in myxedema coma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall mortality was 60.9%. On comparative analysis among survivors and non-survivors, female gender (OR 20.4, p value 0.018), need for mechanical ventilation (OR16.4, p value 0.009), in-hospital hypotension (OR 9.1, p value 0.020), and high qSOFA score (OR 7.1, p value 0.023) predicted mortality."
    explanation: Documents the high inpatient mortality of acute decompensated myxedema crisis.

    explanation: This directly supports electrolyte correction as supportive management for myxedema coma.
diagnosis:
- name: Clinical Evaluation and Myxedema Diagnostic Scoring System
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Myxedema coma is primarily a clinical diagnosis based on history, physical
    examination findings of profound hypothyroidism (hypothermia, altered mental
    status, non-pitting edema, bradycardia), and quantitative clinical scoring
    systems such as the Popoveniuc diagnostic score (>=60 indicating myxedema
    coma) and Myxedema Score (>90 predicting high mortality).
  results: >-
    Popoveniuc diagnostic score >=60 indicates myxedema coma (45-59 indicates
    severe hypothyroidism at risk for coma); Myxedema Score >90 predicts
    markedly increased inpatient mortality.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because a definitive diagnosis of coma due to myxedema cannot be made on the basis of laboratory tests, several workers have attempted to develop scoring systems based on history, physical findings, and symptoms in order to objectify a diagnosis and differentiate between the presence of just overt or severe hypothyroidism and myxedema coma (5, 6)."
    explanation: Establishes that diagnosis relies on clinical evaluation and structured diagnostic scoring systems rather than laboratory tests alone.
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on the outcome of the patients studied, a diagnostic score of equal to or greater than 60 correlated with the presence of myxedema coma, whereas a score between 45 and 59 only overt hypothyroidism but a subject at increased risk for myxedema coma if not treated."
    explanation: Documents the Popoveniuc diagnostic score thresholds (>=60 for myxedema coma; 45-59 for overt hypothyroidism at risk of coma).
  - reference: PMID:35945394
    reference_title: Utility of myxedema score as a predictor of mortality in myxedema coma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MS of > 90 had significantly higher mortality (OR-11.8, p value - 0.026) while MS of > 110 had 100% mortality."
    explanation: Validates the prognostic utility of the Myxedema Score in myxedema crisis.
- name: Serum Free Thyroxine (FT4) and Thyroid-Stimulating Hormone (TSH) Testing
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  measurements:
  - preferred_term: Serum free thyroxine (FT4)
    term:
      id: LOINC:3024-7
      label: Thyroxine (T4) free [Mass/volume] in Serum or Plasma
  - preferred_term: Serum thyroid-stimulating hormone (TSH)
    term:
      id: LOINC:3016-3
      label: Thyrotropin [Units/volume] in Serum or Plasma
  description: >-
    Serum free T4 and TSH testing confirms underlying severe hypothyroidism and
    distinguishes primary thyroid failure from central (pituitary/hypothalamic)
    hypothyroidism, though empirical therapy must not be delayed while awaiting
    results.
  results: >-
    Markedly low or undetectable free T4; elevated TSH in primary hypothyroidism
    or low to inappropriately normal TSH in central hypothyroidism.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FT4 levels will be low and can be almost undetectable, while TSH levels have varied widely in reported cases of myxedema coma. Of course, in secondary or pituitary hypothyroidism the FT4 and TSH levels will be low or low ‘normal’ and the presence of biologically inactive TSH may account for the measured normal concentrations."
    explanation: Details the characteristic free T4 and TSH profiles in primary versus central myxedema coma.
- name: Electrocardiography
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    Electrocardiographic monitoring detects sinus bradycardia, conduction blocks,
    low-voltage QRS complexes associated with pericardial effusion, and
    ventricular arrhythmias.
  results: >-
    Sinus bradycardia, various degrees of heart block, low voltage, and rare
    torsades de pointes ventricular tachycardia.
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings on electrocardiography include bradycardia, various degrees of heart block, and low voltage. Although bradycardia is almost always present, occasional patients may present with torsades de pointe ventricular tachycardia (4)."
    explanation: Supports electrocardiography as a standard diagnostic modality in myxedema coma evaluation.
differential_diagnoses:
- name: Adrenal Insufficiency
  disease_term:
    preferred_term: adrenocortical insufficiency
    term:
      id: MONDO:0000004
      label: adrenocortical insufficiency
  description: >-
    Primary adrenal insufficiency (Schmidt syndrome) or secondary pituitary
    adrenal insufficiency shares overlapping electrolyte and hemodynamic features
    with myxedema coma and can coexist in autoimmune polyendocrinopathy or
    hypopituitarism.
  distinguishing_features:
  - Hypoglycemia, hyponatremia, hyperkalemia, and hypercalcemia overlap with myxedema coma
  - Distinguished by baseline plasma cortisol and ACTH testing alongside free T4 and TSH measurement
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concern for adrenal insufficiency is based upon findings of low blood sugar, low sodium, and high calcium and potassium which are equally compatible with adrenal insufficiency."
    explanation: Explains the biochemical overlap between adrenal insufficiency and myxedema coma and why adrenal insufficiency must be evaluated and empirically covered.
- name: Sepsis
  disease_term:
    preferred_term: infectious disease with sepsis
    term:
      id: MONDO:1040015
      label: infectious disease with sepsis
  description: >-
    Severe bacterial infection or sepsis both precipitates myxedema coma and
    mimics its systemic decompensation, encephalopathy, hypothermia, and
    hypotension.
  distinguishing_features:
  - Classic signs of sepsis such as fever and tachycardia are frequently masked by hypothyroid hypothermia and bradycardia
  - Identified by infectious workup and coupled with thyroid function and Popoveniuc clinical scoring
  evidence:
  - reference: PMID:31237256
    reference_title: Thyroid emergencies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is highly important to consider underlying infection, e.g., pneumonia, which is a very common precipitant of myxedema coma, because these patients may have the usual signs of infection masked by the bradycardia and hypothermia, thus not demonstrating the fever or tachycardia typical of infection."
    explanation: Highlights how infection and sepsis both precipitate and clinically overlap with myxedema coma while having their classic febrile and tachycardic signs masked.
review_notes: >
  Myxedema is curated here as severe hypothyroidism and its decompensated
  myxedema coma/crisis presentation. Pretibial myxedema is treated as a distinct
  Graves-associated dermopathy and was not folded into this page.

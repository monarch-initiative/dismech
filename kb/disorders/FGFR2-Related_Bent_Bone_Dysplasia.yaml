genetic:
- name: FGFR2 transmembrane-domain variants
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    De novo heterozygous missense variants placing a polar residue in the hydrophobic
    transmembrane domain. Reported alleles include p.Tyr381Asp (c.1141T>G) and
    p.Met391Arg. Substitutions at FGFR2 Tyr-381 have been reported to cause either
    Crouzon syndrome or bent bone dysplasia depending on the substituting residue, making
    this codon a clean demonstration that the disorder is set by the biophysical
    consequence of the substitution rather than by its position.
  evidence:
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four unrelated affected individuals were found to be heterozygous for missense mutations that introduce a polar amino acid into the hydrophobic transmembrane domain of FGFR2."
    explanation: The defining allele class.
  - reference: PMID:27240702
    reference_title: "Clinical and radiographic delineation of Bent Bone Dysplasia-FGFR2 type or Bent Bone Dysplasia with Distinctive Clavicles and Angel-shaped Phalanges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for mutations in the gene that encodes Fibroblast Growth Factor Receptor 2 (FGFR2) was identified in the nine individuals with available DNA."
    explanation: Molecular confirmation across the assembled series.

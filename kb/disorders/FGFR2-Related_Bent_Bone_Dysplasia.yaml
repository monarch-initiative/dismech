classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian, de novo dominant skeletal dysplasia (ISDS bent-bone group).
      Curated under the genetics/heritable-disease Part rather than an
      organ-system Part despite the perinatal respiratory failure, which is a
      consequence of the skeletal phenotype.
  isds_skeletal_category:
  - classification_value: bent_bone_dysplasia
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 20 "Bent bones dysplasia group",
      entry NOS 20-0050, listed there as "Bent bone dysplasia, FGFR2-related"
      (AD, FGFR2, MIM 614592). Note the committee places it with the bent-bone
      dysplasias rather than with the craniosynostosis syndromes, which is
      consistent with its distinct receptor mechanism — the BBDS alleles reduce
      canonical FGF signaling, where the FGFR2 craniosynostoses are
      gain-of-function.

      Group 20 is a radiographic grouping, and the committee says so in the
      table footnote: "Bent bones is an unspecific finding, particularly in a
      prenatal setting, that can be observed in numerous other conditions, such
      as those with bone fragility". The placement therefore records the
      radiographic sign, not a shared mechanism with the other five members.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant, arising de novo. All reported cases have been sporadic, occurring
    in a single affected individual of unaffected parents, which is expected given that
    the disorder is usually lethal before or shortly after birth.
  evidence:
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified de novo FGFR2 mutations in a sporadically occurring perinatal lethal skeletal dysplasia characterized by poor mineralization of the calvarium, craniosynostosis, dysmorphic facial features, prenatal teeth, hypoplastic pubis and clavicles, osteopenia, and bent long bones."
    explanation: >-
      The delineating paper establishes de novo occurrence and gives the full core
      phenotype in one sentence.
prevalence:
- population: Worldwide, published-case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists. Fourteen individuals had been reported as of 2025,
    following an 11-patient series in 2016 that included the original four. Most died
    prenatally or neonatally, so the reported series are weighted toward lethal
    presentations and the surviving phenotype is correspondingly under-described. This
    case count is the ceiling on every frequency claim in this entry, which is why no
    phenotype below carries a frequency band.
  evidence:
  - reference: PMID:41186107
    reference_title: "Clinical Presentation of the Longest Reported Living Individual With Bent Bone Dysplasia-FGFR2-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 14 individuals have been reported, of which the majority died prenatally or neonatally."
    explanation: The 2025 published-case count and the ascertainment skew toward lethal cases.
  - reference: PMID:27240702
    reference_title: "Clinical and radiographic delineation of Bent Bone Dysplasia-FGFR2 type or Bent Bone Dysplasia with Distinctive Clavicles and Angel-shaped Phalanges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report on 11 individuals, including the original four patients plus seven new individuals with three longer-term survivors."
    explanation: The largest assembled series, and the source of the surviving-phenotype description.
pathophysiology:
- name: FGFR2 Transmembrane Polar Substitution
  role: trigger
  biological_scale: MOLECULAR
  description: >
    A de novo heterozygous FGFR2 missense variant introducing a polar amino acid into the
    hydrophobic transmembrane domain — the reported alleles include p.Tyr381Asp and
    p.Met391Arg. This is the same domain in which achondroplasia (FGFR3 p.Gly380Arg) and
    Beare-Stevenson syndrome (FGFR2 p.Tyr375Cys) alleles sit, and FGFR2 Tyr-381
    substitutions have been reported to give either Crouzon syndrome or bent bone
    dysplasia depending on which residue is substituted in. Despite that adjacency, the
    consequence here is not constitutive activation, which is why this entry carries no
    conforms_to anchor against the FGFR gain-of-function module.
  gene:
    preferred_term: FGFR2
    description: >-
      Fibroblast growth factor receptor 2. In BBDS the variant alters receptor
      trafficking and subcellular distribution rather than conferring constitutive
      kinase activity.
    term:
      id: hgnc:3689
      label: FGFR2
  evidence:
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four unrelated affected individuals were found to be heterozygous for missense mutations that introduce a polar amino acid into the hydrophobic transmembrane domain of FGFR2."
    explanation: Defines the allele class and its position in the receptor.
  - reference: PMID:41186107
    reference_title: "Clinical Presentation of the Longest Reported Living Individual With Bent Bone Dysplasia-FGFR2-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the clinical trajectory of a 4-year-old male with BBD, FGFR2-related (FGFR2, c.1141T>G), who initially presented neonatally with respiratory insufficiency requiring intubation, facial dysmorphism, and skeletal differences."
    explanation: A specific reported allele in the longest-surviving individual.
  downstream:
  - target: Reduced Plasma-Membrane FGFR2 and Deficient Canonical FGF Signaling
    description: >
      The polar transmembrane residue impairs normal receptor trafficking to and
      retention at the plasma membrane.
    causal_link_type: DIRECT
  - target: Enhanced Nucleolar FGFR2 Occupancy at rDNA
    description: >
      The same substitutions amplify nucleolar targeting of the receptor, redistributing
      it rather than simply reducing it.
    causal_link_type: DIRECT

- name: Reduced Plasma-Membrane FGFR2 and Deficient Canonical FGF Signaling
  biological_scale: MOLECULAR
  description: >
    The arm that disqualifies BBDS from the FGFR gain-of-function grouping. Membrane
    FGFR2 levels are selectively reduced and the receptor's responsiveness to
    extracellular FGF is markedly diminished, demonstrated both in patient-derived
    chondrocytes and in a cell-based assay. This is loss of canonical signaling, not gain
    — the mechanistic inverse of the constitutive, ligand-independent activation that
    characterizes Apert, Crouzon, Pfeiffer, Jackson-Weiss and Beare-Stevenson syndrome.
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using diseased chondrocytes and a cell-based assay, we determined that these mutations selectively reduced plasma-membrane levels of FGFR2 and markedly diminished the receptor's responsiveness to extracellular FGF."
    explanation: >-
      The direct demonstration that canonical membrane signaling is reduced, which is why
      this entry is not a member of the FGFR gain-of-function grouping.
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All together, these clinical and molecular findings are separate from previously characterized FGFR2 disorders and represent a distinct skeletal dysplasia."
    explanation: >-
      The delineating authors' own conclusion that BBDS is mechanistically separate from
      the other FGFR2 disorders.

- name: Enhanced Nucleolar FGFR2 Occupancy at rDNA
  biological_scale: MOLECULAR
  description: >
    The gain in BBDS is of receptor location, not receptor activity. The mutations amplify
    nucleolar targeting of FGFR2, where it occupies the ribosomal DNA promoter and
    activates rDNA transcription through interactions with FGF2 and UBF1, de-repressing
    RUNX2. A second study showed the mutant receptor also augments recruitment of
    histone-remodeling factors that epigenetically activate rDNA that is normally
    transcriptionally silent — so the effect is not only more transcription at active
    loci but conversion of silent loci to euchromatin.
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  biological_processes:
  - preferred_term: rRNA transcription
    term:
      id: GO:0009303
      label: rRNA transcription
    modifier: INCREASED
  evidence:
  - reference: PMID:24908667
    reference_title: "Bent bone dysplasia syndrome reveals nucleolar activity for FGFR2 in ribosomal DNA transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we find that these mutations, despite reducing canonical signaling, enhance nucleolar occupancy of FGFR2 at the ribosomal DNA (rDNA) promoter."
    explanation: >-
      States the relocalization gain explicitly against the background of reduced
      canonical signaling — the single most important sentence for this entry.
  - reference: PMID:24908667
    reference_title: "Bent bone dysplasia syndrome reveals nucleolar activity for FGFR2 in ribosomal DNA transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nucleolar FGFR2 activates rDNA transcription via interactions with FGF2 and UBF1 by de-repressing RUNX2."
    explanation: The molecular route from nucleolar receptor to rDNA transcription.
  - reference: PMID:28595297
    reference_title: "FGFR2 mutations in bent bone dysplasia syndrome activate nucleolar stress and perturb cell fate determination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we find that the BBDS mutations augment the ability of FGFR2 to recruit histone-remodeling factors that epigenetically activate transcriptionally silent rDNA."
    explanation: Extends the mechanism to epigenetic activation of normally silent rDNA loci.
  downstream:
  - target: Osteoprogenitor Proliferation with Delayed Differentiation
    causal_link_type: DIRECT
  - target: Nucleolar Disorganization and Rpl11-MDM2-p53 Stress Response
    causal_link_type: DIRECT

- name: Nucleolar Disorganization and Rpl11-MDM2-p53 Stress Response
  biological_scale: CELLULAR
  description: >
    Nucleolar morphology is governed by chromatin structure, so the high levels of
    euchromatic rDNA produced by the BBDS mutations disorganize the nucleolus and alter
    ribosome biogenesis. That in turn activates the Rpl11-MDM2-p53 nucleolar stress
    pathway. This is the node with therapeutic relevance: inhibiting p53 in cells
    expressing the BBDS mutations rescues the delayed osteoblast differentiation, which
    identifies p53 activation as an essential pathogenic step rather than a bystander.
  biological_processes:
  - preferred_term: ribosome biogenesis
    term:
      id: GO:0042254
      label: ribosome biogenesis
    modifier: DYSREGULATED
  - preferred_term: DNA damage response, signal transduction by p53 class mediator
    term:
      id: GO:0030330
      label: DNA damage response, signal transduction by p53 class mediator
    modifier: INCREASED
  evidence:
  - reference: PMID:28595297
    reference_title: "FGFR2 mutations in bent bone dysplasia syndrome activate nucleolar stress and perturb cell fate determination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nucleolar morphology is controlled by chromatin structure, and the high levels of euchromatic rDNA induced by the BBDS mutations direct nucleolar disorganization, alter ribosome biogenesis, and activate the Rpl11-Mdm2-p53 nucleolar stress response pathway."
    explanation: The full route from euchromatic rDNA to the p53 nucleolar stress response.
  - reference: PMID:28595297
    reference_title: "FGFR2 mutations in bent bone dysplasia syndrome activate nucleolar stress and perturb cell fate determination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of p53 in cells expressing the FGFR2 mutations in BBDS rescues delayed osteoblast differentiation, suggesting that p53 activation is an essential pathogenic factor in, and potential therapeutic target for, BBDS."
    explanation: >-
      The rescue experiment establishing p53 as pathogenic rather than incidental, and
      the only therapeutic lead this disorder has.
  downstream:
  - target: Osteoprogenitor Proliferation with Delayed Differentiation
    causal_link_type: DIRECT

- name: Osteoprogenitor Proliferation with Delayed Differentiation
  biological_scale: CELLULAR
  description: >
    The convergent cellular lesion. Elevated ribosomal RNA in developing bone promotes
    osteoprogenitor proliferation while delaying differentiation into mature
    matrix-depositing osteoblasts. The histological correlate in patient long bones is a
    growth plate containing smaller hypertrophic chondrocytes together with a thickened,
    hypercellular periosteum — more cells, less differentiation.
  cell_types:
  - preferred_term: Preosteoblast
    term:
      id: CL:0007010
      label: preosteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:24908667
    reference_title: "Bent bone dysplasia syndrome reveals nucleolar activity for FGFR2 in ribosomal DNA transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An increase in the nucleolar activity of FGFR2 in BBDS elevates levels of ribosomal RNA in the developing bone, consequently promoting osteoprogenitor cell proliferation and decreasing differentiation."
    explanation: The proliferation-up, differentiation-down cellular phenotype in developing bone.
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological analysis of the long bones revealed that the growth plate contained smaller hypertrophic chondrocytes and a thickened hypercellular periosteum."
    explanation: The histological correlate in patient tissue.
  downstream:
  - target: Impaired Bone Mineralization and Structural Weakness
    causal_link_type: DIRECT

- name: Impaired Bone Mineralization and Structural Weakness
  biological_scale: TISSUE
  description: >
    Osteoprogenitors that proliferate without differentiating do not deposit and mineralize
    matrix normally. The clinical readout is poor calvarial mineralization, reduced bone
    mineral density and osteopenia, and long bones weak enough to bend in utero — the
    feature the disorder is named for. Note this is a mineralization failure secondary to
    a cell-fate defect: it is not the calciopenic, phosphopenic or
    mineralization-inhibitor-excess mechanism of the defective_skeletal_mineralization
    module, so no conformance is declared there either.
  biological_processes:
  - preferred_term: biomineral tissue development
    term:
      id: GO:0031214
      label: biomineral tissue development
    modifier: DECREASED
  evidence:
  - reference: PMID:41186107
    reference_title: "Clinical Presentation of the Longest Reported Living Individual With Bent Bone Dysplasia-FGFR2-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bent Bone Dysplasia (BBD), FGFR2-related (MIM# 614592), is a rare severe skeletal dysplasia characterized by craniofacial differences, reduced bone mineral density, and bowed long bones."
    explanation: Links reduced bone mineral density to the bowing that names the disorder.
  downstream:
  - target: Bowing of the long bones
  - target: Decreased calvarial ossification
  - target: Reduced bone mineral density
  - target: Osteopenia
  - target: Craniosynostosis

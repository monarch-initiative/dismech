  age_range: In utero through the neonatal period
  notes: >-
    The period in which most affected individuals die. The prenatal presentation includes
    femoral bending detectable on ultrasound, polyhydramnios, prematurity and stillbirth,
    and perinatal death occurred in three of eleven patients in the largest series. The
    disorder was originally described as perinatal lethal.

name: FGFR2-Related Bent Bone Dysplasia
synonyms:
- BBDS
- BBDS1
- Bent Bone Dysplasia Syndrome
- Bent Bone Dysplasia Syndrome 1
- bent bone dysplasia-FGFR2 type
- bent bone dysplasia with distinctive clavicles and angel-shaped phalanges
- FGFR2-related bent bone dysplasia
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  Bent bone dysplasia syndrome (BBDS) is an ultra-rare, usually perinatally lethal
  skeletal dysplasia caused by de novo heterozygous FGFR2 variants that place a polar
  residue in the hydrophobic transmembrane domain. It combines bent long bones with
  poor calvarial mineralization, craniosynostosis, prenatal teeth, hypoplastic pubis and
  clavicles, osteopenia, and a distinctive radiographic signature — moustache-shaped
  small clavicles and angel-shaped metacarpals and phalanges.

  BBDS is an FGFR2 disorder that is deliberately NOT curated as a member of the
  FGFR-Related Skeletal Dysplasias grouping, and the reason is the point of the entry.
  Every member of that group is defined by a constitutively active or ligand-hypersensitive
  receptor. The BBDS alleles do the opposite at the plasma membrane: they selectively
  reduce membrane FGFR2 and markedly diminish the receptor's responsiveness to
  extracellular FGF. The original delineation states this in its title — "deficient
  canonical FGF signaling" — and concludes the disorder is separate from previously
  characterized FGFR2 disorders.

  What is gained is not receptor activity but receptor *location*. The same mutations
  amplify nucleolar targeting of FGFR2, where it occupies the ribosomal DNA promoter and
  activates rDNA transcription through FGF2 and UBF1 by de-repressing RUNX2. The
  consequence is a ribosome-biogenesis disorder of the osteoprogenitor: elevated rRNA,
  increased proliferation, delayed differentiation, and — via epigenetic activation of
  normally silent rDNA — nucleolar disorganization that triggers the Rpl11-MDM2-p53
  nucleolar stress response. Inhibiting p53 rescues the differentiation delay in cells
  carrying the BBDS mutations, which makes p53 a candidate therapeutic target and is the
  strongest mechanistic claim available for this disorder.

  The contrast with the gain-of-function group is sharpest at the residue level. BBDS
  alleles sit in the transmembrane domain, the same domain as achondroplasia p.Gly380Arg
  and Beare-Stevenson p.Tyr375Cys, and FGFR2 Tyr-381 substitutions have been reported to
  cause either Crouzon syndrome or bent bone dysplasia depending on the substituting
  residue. Same gene, same domain, in one case the same codon — opposite consequence for
  the receptor.

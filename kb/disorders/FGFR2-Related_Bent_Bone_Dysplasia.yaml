- phase: Childhood in survivors
  age_range: Beyond the neonatal period
  notes: >-
    Survival past the neonatal period is possible and the disorder should not be counted
    as invariably lethal. The longest reported survivor is a 4-year-old who walks, is
    interactive, and continues to make developmental progress, supported by a tracheostomy
    for nocturnal ventilation and a gastrostomy tube. This matters for counselling: the
    published series are weighted toward lethal presentations by ascertainment, so the
    surviving phenotype is systematically under-described.

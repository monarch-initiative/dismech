differential_diagnoses:
- name: LAMA5-Related Bent Bone Dysplasia
  disease_term:
    preferred_term: bent bone dysplasia syndrome 2
    term:
      id: MONDO:0859573
      label: bent bone dysplasia syndrome 2
  description: >-
    The other disorder carrying the bent bone dysplasia syndrome name, and
    radiographically the closest mimic: both give bent long bones with a poorly
    mineralized calvarium in a perinatally lethal setting. BBDS2 is autosomal
    recessive rather than dominant de novo, and its mechanism is unrelated — a
    destabilized alpha-5 laminin disrupting a LAMA5-beta1 integrin-PYK2-FYN
    focal adhesion axis in chondrocytes, not an FGFR2 receptor-trafficking and
    ribosome-biogenesis defect. Clinically, BBDS2 adds severe distal limb
    contractures, coronal cleft vertebrae, hypoplastic acetabula and atrial
    septal defects, and lacks the craniosynostosis, prenatal teeth and
    moustache-shaped clavicles of BBDS1.
  distinguishing_features:
  - Causal gene LAMA5 rather than FGFR2
  - Autosomal recessive rather than dominant de novo
  - Arthrogryposis with severe distal limb contractures
  - Coronal cleft vertebrae and hypoplastic acetabula
  - No craniosynostosis and no prenatal teeth
  notes: >-
    Both are listed in ISDS 2023 group 20 (NOS 20-0050 FGFR2, NOS 20-0060
    LAMA5). PMID:33242826 delineates the LAMA5 disorder; it caches only as a
    differential here and contributes no evidence to BBDS1 claims.
discussions:
- discussion_id: gap_bbds_p53_inhibition_translation
  prompt: >-
    Does p53 inhibition, which rescues delayed osteoblast differentiation in cells
    carrying the BBDS FGFR2 mutations, represent a viable therapeutic direction for a
    disorder whose damage is largely done before birth?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Nucleolar Disorganization and Rpl11-MDM2-p53 Stress Response
  - pathophysiology#Osteoprogenitor Proliferation with Delayed Differentiation
  rationale: >-
    This is the only therapeutic lead BBDS has, and it is a genuine mechanistic result
    rather than a correlation: inhibiting p53 in cells expressing the BBDS mutations
    rescues the differentiation delay, which is what licenses calling p53 activation
    essential rather than incidental. Three problems stand between that and a treatment.
    First, the rescue is in cells; no animal model of BBDS has been reported to test
    whether systemic p53 inhibition rescues the skeletal phenotype, and the entry should
    not be read as claiming otherwise. Second, the timing is adverse in a way that
    distinguishes this from most therapeutic gaps: bent long bones, hypoplastic clavicles
    and poor calvarial mineralization are established in utero, so a postnatal
    intervention would be addressing a developmental lesion after it has formed, and the
    window in which p53 inhibition could matter may close before the diagnosis is made.
    Third, p53 is a tumour suppressor and inhibiting it systemically in a developing
    child carries an obvious and unquantified oncogenic hazard; no dose, route, duration
    or selectivity has been proposed. Nothing here should be curated as an emerging
    treatment.
  evidence:
  - reference: PMID:28595297
    reference_title: "FGFR2 mutations in bent bone dysplasia syndrome activate nucleolar stress and perturb cell fate determination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of p53 in cells expressing the FGFR2 mutations in BBDS rescues delayed osteoblast differentiation, suggesting that p53 activation is an essential pathogenic factor in, and potential therapeutic target for, BBDS."
    explanation: >-
      The rescue result and the authors' therapeutic framing, which is a cell-based
      finding offered as a prospect.
  - reference: PMID:27240702
    reference_title: "Clinical and radiographic delineation of Bent Bone Dysplasia-FGFR2 type or Bent Bone Dysplasia with Distinctive Clavicles and Angel-shaped Phalanges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prenatal phenotype included stillbirth, bending of the femora, and a high incidence of polyhydramnios, prematurity, and perinatal death in three of 11 patients in the series."
    explanation: >-
      Establishes that the defining skeletal lesions are present prenatally, which is the
      timing problem any therapy has to solve.
  proposed_experiments:
  - experiment_id: exp_bbds_mouse_model_p53_rescue
    name: p53 inhibition in an animal model of BBDS
    description: >-
      Generate a knock-in animal carrying a BBDS transmembrane allele and test whether
      genetic or pharmacological p53 reduction rescues bone mineralization and long-bone
      bowing in vivo, which is the step between the existing cell result and any claim
      about the skeleton.
  - experiment_id: exp_bbds_developmental_window
    name: Developmental window for differentiation rescue
    description: >-
      Establish the latest developmental stage at which reducing p53 still restores
      osteoblast differentiation, since a window closing in utero would make postnatal
      treatment futile regardless of efficacy.
- discussion_id: gap_bbds_same_residue_opposite_disease
  prompt: >-
    Why do different substitutions at the same FGFR2 transmembrane residue produce either
    Crouzon syndrome, a canonical gain-of-function craniosynostosis, or bent bone
    dysplasia, a disorder of reduced membrane signalling?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGFR2 Transmembrane Polar Substitution
  - pathophysiology#Reduced Plasma-Membrane FGFR2 and Deficient Canonical FGF Signaling
  rationale: >-
    This is the cleanest available natural experiment on how FGFR2 transmembrane
    substitutions are read out, and it is unresolved. Substitutions at FGFR2 Tyr-381 have
    been reported to cause either Crouzon syndrome or bent bone dysplasia depending on
    which residue is introduced, so position alone does not determine the disease. The
    plausible discriminator is the biophysical character of the substituting residue — a
    cysteine enabling intermolecular disulfide bonding and constitutive dimerization
    versus a polar residue disrupting membrane insertion and trafficking — but no study
    cited here compares the two classes side by side in one system, and the nucleolar
    relocalization arm has not been tested in the gain-of-function alleles at all. It
    matters for the knowledge base as well as for biology: the FGFR-Related Skeletal
    Dysplasias grouping admits members on constitutive receptor activation, so whether a
    given transmembrane allele belongs is a mechanistic question that cannot be settled
    from the domain it sits in.
  evidence:
  - reference: PMID:22387015
    reference_title: "Bent bone dysplasia-FGFR2 type, a distinct skeletal disorder, has deficient canonical FGF signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using diseased chondrocytes and a cell-based assay, we determined that these mutations selectively reduced plasma-membrane levels of FGFR2 and markedly diminished the receptor's responsiveness to extracellular FGF."
    explanation: The BBDS half of the contrast — reduced membrane receptor and FGF response.
  - reference: PMID:24908667
    reference_title: "Bent bone dysplasia syndrome reveals nucleolar activity for FGFR2 in ribosomal DNA transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we find that these mutations, despite reducing canonical signaling, enhance nucleolar occupancy of FGFR2 at the ribosomal DNA (rDNA) promoter."
    explanation: >-
      The relocalization arm, which has not been examined in the gain-of-function
      transmembrane alleles and so cannot currently be called BBDS-specific.
  proposed_experiments:
  - experiment_id: exp_fgfr2_tm_allele_series_side_by_side
    name: Side-by-side comparison of FGFR2 transmembrane allele classes
    description: >-
      Express Crouzon-type and BBDS-type substitutions at the same FGFR2 transmembrane
      residue in one cell system and measure membrane localization, ligand-dependent and
      ligand-independent kinase activity, and nucleolar occupancy together, so the
      discriminating property is measured rather than inferred across papers.
  - experiment_id: exp_nucleolar_fgfr2_in_gof_alleles
    name: Nucleolar FGFR2 occupancy in gain-of-function craniosynostosis alleles
    description: >-
      Test whether Apert, Crouzon and Beare-Stevenson FGFR2 alleles also alter nucleolar
      rDNA occupancy. A negative result would make the nucleolar arm genuinely specific
      to BBDS; a positive one would mean the two mechanisms are not mutually exclusive.
notes: >
  Curated de novo from primary literature under claim #9384, following the FGFR-Related
  Skeletal Dysplasias grouping review (#9257).

  This entry exists partly to correct that review. It listed bent bone dysplasia syndrome
  among the grouping's "known unfilled seats" — disorders said to belong to the group on
  mechanism but lacking a curated entry. Checking the mechanism before curating showed
  that is wrong. The BBDS transmembrane alleles reduce plasma-membrane FGFR2 and diminish
  FGF responsiveness (PMID:22387015, whose title is "…has deficient canonical FGF
  signaling" and which concludes the disorder is "separate from previously characterized
  FGFR2 disorders"); the gain is relocalization to the nucleolus, not receptor activation
  (PMID:24908667). The grouping's criterion is conformance to
  fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation, which BBDS does
  not satisfy. The grouping note has been corrected accordingly and this entry is
  deliberately NOT a member.

  Consequently this entry declares NO conforms_to anchors at all, which is unusual for an
  FGFR skeletal disorder and is the substantive claim rather than an omission. Two module
  non-conformances are stated explicitly in the node descriptions rather than left
  implicit: the FGFR gain-of-function module (receptor mechanism is inverted), and
  defective_skeletal_mineralization (the mineralization failure here is secondary to an
  osteoprogenitor cell-fate defect, not a calciopenic, phosphopenic or
  mineralization-inhibitor-excess arm).

  Stillbirth is reported in the prenatal phenotype and is curated in `progression` rather
  than `phenotypes`, because HP:0003826 sits outside the Phenotypic abnormality subtree
  that the PhenotypeTerm enum draws from — it is an outcome, not a phenotypic abnormality.

  Three on-topic papers were reviewed and not cited because they cache with
  content_type unavailable, so no snippet could be verified: PMID:23808569 (Crouzon and
  bent bone dysplasia at the same FGFR2 Tyr-381 residue), PMID:24300289 (postnatal
  features) and PMID:26573129 (new case and review). The Tyr-381 observation is used in
  prose in the description, genetic notes and gap_bbds_same_residue_opposite_disease
  rationale, where it is attributed as a report rather than quoted; if that paper is
  later cached with an abstract it should be added as evidence to those places.
  PMID:33242826 describes a biallelic LAMA5 bent bone dysplasia — a distinct disorder and
  a differential-diagnosis consideration, not BBDS1 evidence. It is now curated as
  kb/disorders/LAMA5-Related_Bent_Bone_Dysplasia.yaml and cited only from the
  differential_diagnoses entry here.

  RENAME: this entry was named "Bent Bone Dysplasia Syndrome" until the LAMA5 disorder
  was curated. The bare name then read like a parent concept covering both, so it was
  gene-anchored to "FGFR2-Related Bent Bone Dysplasia". The numbered OMIM/MONDO form
  (bent bone dysplasia syndrome 1) is retained as a synonym and remains the
  `disease_term` label; the entry name carries the gene because "bent bone dysplasia
  syndrome" alone is locus-ambiguous. The file was renamed to match, per the repo
  convention that a filename tracks its entry name; the two history records under the
  old slug were moved and carry `target.superseded_by`.

  No phenotype carries a frequency band: fourteen reported individuals, weighted toward
  lethal presentations by ascertainment, will not support one.

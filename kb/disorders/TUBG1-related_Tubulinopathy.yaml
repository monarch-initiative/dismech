genetic:
- name: TUBG1
  association: Causative
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: TUBG1 (gamma-tubulin 1)
    term:
      id: hgnc:12417
      label: TUBG1
  notes: >-
    TUBG1 encodes gamma-tubulin 1, a core component of the gamma-tubulin ring
    complex. It shares very high sequence identity with its paralog TUBG2 but the
    two are not functionally interchangeable, and TUBG1 is the more abundantly
    expressed of the pair in the developing brain.
  evidence:
  - reference: PMID:23603762
    reference_title: "Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the discovery of multiple pathogenic missense mutations in
      TUBG1, DYNC1H1 and KIF2A, as well as a single germline mosaic mutation in
      KIF5C, in subjects with MCD.
    explanation: >-
      Founding evidence that TUBG1 missense mutations cause malformations of
      cortical development.
  - reference: PMID:40298439
    reference_title: Two New Cases Expand the Phenotypic Spectrum of TUBG1 Missense Variants.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TUBG1 encodes a critical component of the γ-TuRC.
    explanation: >-
      States the gene product's role in the gamma-tubulin ring complex.
diagnosis:
- name: Brain magnetic resonance imaging
  description: >-
    MRI establishes the malformation pattern and, unusually for this grouping,
    recognition depends partly on absent findings. The expected pattern is
    posterior-predominant pachygyria with posteriorly accentuated
    ventriculomegaly and reduced white matter, together with normal basal ganglia,
    corpus callosum, brainstem and cerebellum. Because dysmorphic basal ganglia
    are treated as a near-signature of tubulinopathy on imaging, their absence
    can push a TUBG1 patient toward a LIS1/PAFAH1B1 working diagnosis instead.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The core imaging features included a pachygyric cortex with posterior to
      anterior gradient, enlarged lateral ventricles most pronounced over the
      posterior horns, and variable degrees of reduced white matter volume.
    explanation: >-
      Defines the three-part MRI pattern used to recognize TUBG1-related disease.
  - reference: PMID:41070651
    reference_title: "[Clinical phenotype and genetic analysis of a child with Cortical dysplasia, complex, with other brain malformations 4 and epilepsy due to a TUBG1 gene variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Head MRI revealed ventricular system dilatation and pachygyria.
    explanation: >-
      Provides direct MRI findings from a molecularly diagnosed child.
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The imaging phenotype associated with variants in TUBG1 is therefore more
      in line with the phenotype resulting from variants in LIS1 (a.k.a.
      PAFAH1B1).
    explanation: >-
      States the imaging differential explicitly: TUBG1 resembles LIS1 rather
      than the other tubulinopathies.
- name: Molecular genetic testing
  description: >-
    Diagnosis is confirmed by identifying a heterozygous pathogenic TUBG1
    variant using a cortical-malformation multigene panel or exome/genome
    sequencing. Trio-based exome sequencing can establish de novo origin when
    parental samples are available. Because the imaging phenotype can resemble
    LIS1/PAFAH1B1 disease, molecular testing resolves the gene-level diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here report eight additional patients with four novel heterozygous
      variants in TUBG1 identified by next-generation sequencing (NGS) analysis.
    explanation: >-
      Next-generation sequencing is the modality by which the reported patient
      series was ascertained.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: Tubulinopathies Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular genetic testing approaches can include a combination of
      gene-targeted testing (multigene panel) and comprehensive genomic testing
      (exome sequencing, genome sequencing).
    explanation: >-
      GeneReviews supports both panel-based and comprehensive genomic testing.
  - reference: PMID:41070651
    reference_title: "[Clinical phenotype and genetic analysis of a child with Cortical dysplasia, complex, with other brain malformations 4 and epilepsy due to a TUBG1 gene variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio-based whole-exome sequencing (WES) was performed, and candidate
      variants were validated by Sanger sequencing.
    explanation: >-
      Directly supports trio WES with confirmatory Sanger sequencing in a TUBG1
      case.
progression:
- phase: Prenatal origin and possible tubulinopathy detection
  age_range: Prenatal period
  notes: >-
    The cortical malformation arises during prenatal neuronal migration. General
    tubulinopathy literature indicates that prenatal neurosonography may raise
    suspicion during second- or early third-trimester anomaly scanning; the cited
    review does not establish a TUBG1-specific prenatal case.
  evidence:
  - reference: PMID:41901019
    reference_title: The Role of Prenatal Neurosonography in Identification of Tubulinopathy-Narrative Review.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While historically diagnosed postnatally, advances in prenatal
      neurosonography now allow for the suspicion of this pathology in utero
      during routine second and early third-trimester anomaly scans.
    explanation: >-
      Supports prenatal suspicion of tubulinopathy generally, not a direct
      TUBG1-specific prenatal observation.
- phase: Early-life seizure onset and severe developmental impairment
  age_range: Infancy to early childhood
  notes: >-
    Seizures begin in early life in nearly all reported individuals, and severe
    motor and cognitive impairment is apparent from infancy.
  evidence:
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All had severe motor and cognitive impairment and all except one developed
      seizures in early life.
    explanation: >-
      Documents the early-life onset of both the seizure and the developmental
      phenotype.
- phase: Milder alternative course
  age_range: Childhood to adulthood
  notes: >-
    A distinct milder trajectory exists and should not be treated as an outlier
    to be explained away: one reported individual has autism spectrum disorder,
    intellectual disability, later-onset well-controlled epilepsy, a
    normocephalic head size and no detectable structural abnormality on
    neuroimaging. A normal MRI therefore does not exclude a pathogenic TUBG1
    variant.
  evidence:
  - reference: PMID:40298439
    reference_title: Two New Cases Expand the Phenotypic Spectrum of TUBG1 Missense Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other individual has a likely pathogenic TUBG1 variant that explains
      the milder presentation of autism spectrum disorder, intellectual
      disability, later-onset well-controlled epilepsy, a normocephalic head
      size, and no detectable structural abnormalities on neuroimaging.
    explanation: >-
      Documents a mild end of the TUBG1 spectrum including a normal MRI, which
      materially changes the differential.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    High for the typical presentation: severe motor and cognitive impairment with
    early-life, often difficult-to-control seizures, in a non-progressive but
    lifelong and care-dependent condition. A mixed genetically confirmed
    lissencephaly cohort that included one TUBG1 participant reported low
    family-level quality of life and substantial supportive-care use; those
    cohort summaries provide context but are not TUBG1-specific estimates. The
    burden_level applies to the typical presentation; the reported mild end of
    the spectrum is materially less impaired.
  evidence:
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All had severe motor and cognitive impairment and all except one developed
      seizures in early life.
    explanation: >-
      Establishes the severity of the typical presentation.
  - reference: PMID:42177523
    reference_title: "Gene-specific long-term course, neurodevelopmental outcome and quality of life in patients with LIS1/PAFAH1B1-, DCX-, DYNC1H1-, TUBA1A- and TUBG1-related lissencephaly."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The scores obtained for health-related quality of life (HRQL) were low
      (parental HRQL mean 61.23; SD 16.79).
    explanation: >-
      Provides mixed-cohort context from a study containing only one TUBG1
      participant, so it does not support a gene-specific quality-of-life estimate.

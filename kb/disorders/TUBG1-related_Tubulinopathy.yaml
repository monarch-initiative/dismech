epidemiology:
- name: Rarity relative to other tubulinopathy genes
  description: >-
    TUBG1 is among the rarest members of the tubulinopathy grouping. Published
    case counts are in the tens rather than the hundreds: three patients in the
    initial reports and eight more in the first dedicated series. It contributes
    a single patient to a 47-patient genetically confirmed lissencephaly cohort
    and is among seven causal genes identified in a contemporary multicenter
    tubulinopathy cohort. No population prevalence estimate exists for this gene
    specifically.
  evidence:
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in TUBG1 have been described in three patients with posterior
      predominant pachygyria and microcephaly.
    explanation: >-
      Establishes how small the reported TUBG1 case base was before this series.
  - reference: PMID:42177523
    reference_title: "Gene-specific long-term course, neurodevelopmental outcome and quality of life in patients with LIS1/PAFAH1B1-, DCX-, DYNC1H1-, TUBA1A- and TUBG1-related lissencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      47 patients with genetically and radiologically confirmed lissencephaly
      were included with mutation in LIS1/PAFAH1B1 (n = 38), DCX (n = 5 males),
      DYNC1H1 (n = 2), TUBA1A (n = 1) and TUBG1 (n = 1) genes.
    explanation: >-
      Quantifies the TUBG1 share of a contemporary genetically confirmed
      lissencephaly cohort - one patient in 47.
  - reference: PMID:42472988
    reference_title: "Genotypic and phenotypic heterogeneity in tubulinopathies: insights from a Turkish multicenter cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis identified 12 distinct pathogenic variants across seven
      genes (TUBA1A, TUBB2A, TUBB2B, TUBB3, TUBB4A, TUBG1, TUBGCP2), including
      four novel variants.
    explanation: >-
      Places TUBG1 among the genes recovered in a contemporary multicenter
      tubulinopathy cohort, confirming it remains a recognized but uncommon
      cause.
pathophysiology:
- name: Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation
  role: TRIGGER
  biological_scale: MOLECULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  description: >-
    Heterozygous missense variants alter gamma-tubulin 1, the core component of
    the gamma-tubulin ring complex (gamma-TuRC) that templates microtubule
    nucleation at the centrosome. This is a categorically different lesion from
    the one carried by the alpha- and beta-tubulinopathies: gamma-tubulin is not
    a subunit of the microtubule lattice, so the defect is in how microtubules
    are started rather than in what they are built from. Expression of altered
    gamma-tubulin proteins in yeast disrupts normal microtubule behavior, and in
    subject-derived fibroblasts pathogenic variants reduce microtubule dynamics.
    The module's trigger node is nevertheless the correct conformance target:
    whichever way the microtubule apparatus is perturbed, the same downstream
    migration machinery fails.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      All reported alleles are heterozygous missense, with no nonsense,
      frameshift or deletion alleles, so haploinsufficiency is not the presumed
      mechanism. The mechanism class has not been resolved further, and the one
      experiment that would have discriminated it argues against the obvious
      candidate: if the variants acted by disabling the centrosome as a
      nucleating center, subject fibroblasts should show centrosome defects, and
      they do not. UNKNOWN records that the question was examined and remains
      open, rather than that it was never annotated.

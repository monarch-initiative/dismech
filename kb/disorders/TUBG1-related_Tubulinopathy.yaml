    comparative-efficacy estimate.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: Tubulinopathies Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive management, including an individualized therapy plan that
      includes physical therapy to manage the complications of spasticity,

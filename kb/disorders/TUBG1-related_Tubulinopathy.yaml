- name: Genetic Counseling
  description: >-
    Most tubulinopathy-causing variants, including TUBG1 variants, arise de novo.
    Parental testing is recommended to establish genetic status and inform
    recurrence counseling; negative parental testing does not eliminate germline
    mosaicism. Once the familial pathogenic variant is known, prenatal and
    preimplantation genetic testing are possible.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: Tubulinopathies Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 95% of individuals diagnosed with a tubulinopathy have a de novo
      pathogenic variant in TUBA1A, TUBB2A, TUBB2B, TUBB3, TUBB (TUBB5), or TUBG1.
    explanation: >-
      GeneReviews supports counseling that the great majority of cases arise de
      novo without making a TUBG1-only percentage claim.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: Tubulinopathies Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the proband appears to be the only affected family member (i.e., a
      simplex case), molecular genetic testing is recommended for the parents of
      the proband to confirm their genetic status and to allow reliable recurrence
      risk counseling.
    explanation: >-
      Directly supports parental testing and its recurrence-counseling purpose.
  - reference: PMID:38912084
    reference_title: "Gamma-Tubulin 1 (TUBG1) Mutation-Associated Lissencephaly and Microcephaly in an Indian Child: A Rare Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents' genetic tests are negative, germline mosaicism cannot be
      ruled out.
    explanation: >-
      Supports the residual recurrence concern after negative parental blood
      testing.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: Tubulinopathies Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once the tubulinopathy-related pathogenic variant has been identified in an
      affected family member, prenatal and preimplantation genetic testing are
      possible.
    explanation: >-
      Directly supports discussing prenatal and preimplantation testing after the
      familial variant is known.
animal_models:
- name: Tubg1 Y92C/+ knock-in mouse
  species: Mouse
  genotype: Tubg1 p.Y92C heterozygous knock-in
  publication: PMID:31086189
  description: >-
    A knock-in model of a patient variant, and the source of the entry's finest
    mechanistic claim - that mutant bipolar neurons position their centrosome
    correctly and still fail to initiate locomotion. The animals show
    neuroanatomical and behavioral defects and increased epileptic cortical
    activity, matching the human epilepsy phenotype.
  modeled_mechanisms:
  - target: Failure of Neuronal Locomotion Initiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Directly demonstrates the failure of locomotion initiation with correct
      centrosomal positioning, which is what distinguishes this node from a
      centrosome-repositioning defect.
    limitations: >-
      The authors state the model only partially mimics the human phenotype. The
      mouse brain is naturally lissencephalic, so the defining human readout -
      posterior-predominant pachygyria with a gyral gradient - has no murine
      equivalent.
    readouts:
    - name: Locomotion initiation in bipolar neurons
      target: Failure of Neuronal Locomotion Initiation
      direction: ABOLISHED
      interpretation: >-
        Neurons that are correctly polarized and correctly positioned
        nonetheless do not begin to move.
      biological_processes:
      - preferred_term: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        modifier: DECREASED
      evidence:
      - reference: PMID:31086189
        reference_title: "TUBG1 missense variants underlying cortical malformations disrupt neuronal locomotion and microtubule dynamics but not neurogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Although centrosomal positioning in bipolar neurons is correct, they
          fail to initiate locomotion.
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:31086189
      reference_title: "TUBG1 missense variants underlying cortical malformations disrupt neuronal locomotion and microtubule dynamics but not neurogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that Tubg1Y92C/+ mice partially mimic the human phenotype and
        therefore represent a relevant model for further investigations of the
        physiopathology of cortical malformations.
      explanation: >-
        The authors' own assessment of the model's fidelity - relevant but
        partial - which is recorded here rather than overstated.
  - target: Posterior-Predominant Pachygyria with Spared Deep Structures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces neuroanatomical and behavioral defects with increased epileptic
      cortical activity, matching the human epilepsy phenotype.
    limitations: >-
      Cannot reproduce the gyral phenotype in a lissencephalic species, so the
      posterior-to-anterior gradient that defines the human imaging signature is
      untestable in this model.
    readouts:
    - name: Cortical epileptic activity
      target: Posterior-Predominant Pachygyria with Spared Deep Structures
      direction: INCREASED
      interpretation: >-
        Electrophysiological correlate of the epileptogenic dysplastic cortex.
      evidence:
      - reference: PMID:31086189
        reference_title: "TUBG1 missense variants underlying cortical malformations disrupt neuronal locomotion and microtubule dynamics but not neurogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, Tubg1Y92C/+ animals show neuroanatomical and behavioral
          defects and increased epileptic cortical activity.
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:31086189
      reference_title: "TUBG1 missense variants underlying cortical malformations disrupt neuronal locomotion and microtubule dynamics but not neurogenesis."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, Tubg1Y92C/+ animals show neuroanatomical and behavioral
        defects and increased epileptic cortical activity.
      explanation: >-
        Supports the model as informative for the tissue-level and functional
        consequences, without the gyral phenotype.
- name: tubg1 somatic mutant zebrafish
  species: Zebrafish
  genotype: tubg1 somatic (F0 crispant) mutation
  publication: PMID:39215931
  description: >-
    A somatic zebrafish model reported to recapitulate features of TUBG1
    tubulinopathy seen in patients and mouse models. It contributes a
    microcephaly/neurogenesis phenotype and a proposed regulatory link between
    gamma-tubulin and canonical Wnt/beta-catenin signaling. Its neurogenesis
    finding sits in tension with the mouse result that progenitor proliferation
    is unaffected - see the gap_tubg1_neurogenesis_versus_locomotion discussion.
  modeled_mechanisms:
  - target: Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation

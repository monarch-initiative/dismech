discussions:
- discussion_id: gap_tubg1_neurogenesis_versus_locomotion
  prompt: >-
    Does pathogenic TUBG1 variation impair neurogenesis, or only the locomotion
    of neurons that were made normally?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Neuronal Locomotion Initiation
  - pathophysiology#Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation
  rationale: >-
    Two model systems give opposite answers, and the disagreement is not cosmetic
    - it decides which module this disease belongs to. In mouse, in utero
    electroporation of four patient variants and a Tubg1 Y92C/+ knock-in show
    disrupted locomotion of newborn neurons without affecting progenitor
    proliferation; the paper's title states the point as "not neurogenesis". In
    zebrafish, somatic tubg1 mutation is reported to disrupt neurogenesis and
    brain development, mirroring microcephaly. The most likely reconciliation is
    the difference in allele class: the mouse work models heterozygous patient
    missense variants, while the zebrafish work is a somatic loss-of-function
    crispant, and gamma-tubulin is essential for mitosis, so removing it should
    impair proliferation even if a missense allele does not. If that is right,
    the zebrafish neurogenesis phenotype models gamma-tubulin deficiency rather
    than human TUBG1 disease. But it is not settled, and the human phenotype does
    include microcephaly, which a pure locomotion defect does not obviously
    explain. Resolving it requires a zebrafish or human model carrying the
    heterozygous missense allele rather than a null, with progenitor
    proliferation measured directly.
  proposed_experiments:
  - experiment_id: exp_tubg1_missense_vs_null_progenitor_proliferation
    name: Allele-matched comparison of progenitor proliferation under TUBG1 missense versus null
    description: >-
      In a single model system, compare a heterozygous patient missense allele
      against a loss-of-function allele, measuring progenitor proliferation,
      neuronal output and migration side by side, to test whether the
      neurogenesis phenotype is allele-class-dependent.
    decision_criterion: >-
      If progenitor proliferation is impaired by the null but not by the
      heterozygous missense allele, the neurogenesis arm belongs to gamma-tubulin
      deficiency rather than to human TUBG1 disease, and the locomotion-only
      model stands. If the missense allele also impairs proliferation, this entry
      needs a progenitor branch and a second module conformance.
    would_support:
    - pathophysiology#Failure of Neuronal Locomotion Initiation
  evidence:
  - reference: PMID:31086189
    reference_title: "TUBG1 missense variants underlying cortical malformations disrupt neuronal locomotion and microtubule dynamics but not neurogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that TUBG1 mutants affect neuronal positioning, disrupting the
      locomotion of new-born neurons but without affecting progenitors'
      proliferation.
    explanation: >-
      The mouse position: locomotion fails, proliferation does not.
  - reference: PMID:39215931
    reference_title: "tubg1 Somatic Mutants Show Tubulinopathy-Associated Neurodevelopmental Phenotypes in a Zebrafish Model."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate that γ-tubulin deficiency disrupts neurogenesis and brain
      development, mirroring microcephaly phenotypes.
    explanation: >-
      The zebrafish position, which contradicts the mouse claim that neurogenesis
      is spared - recorded as REFUTE against that specific claim, with the
      allele-class caveat argued in the rationale.
- discussion_id: gap_tubg1_imaging_signature_divergence
  prompt: >-
    Why does a tubulin-gene lesion produce a LIS1-like imaging phenotype with
    spared basal ganglia, corpus callosum, brainstem and cerebellum, when the
    alpha- and beta-tubulinopathies malform exactly those structures?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Posterior-Predominant Pachygyria with Spared Deep Structures
  - pathophysiology#Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation
  rationale: >-
    This is the sharpest natural experiment available in the tubulinopathy
    grouping, and it is unresolved. Dysmorphic basal ganglia with a fused
    striatum are reported as pathognomonic in roughly three quarters of
    tubulinopathy cases and are one of the imaging features that raises the
    diagnosis at all - yet in TUBG1 disease those structures are often normal.
    The proposed explanation is that gamma-tubulin's job is microtubule
    nucleation rather than lattice assembly, so its failure does not perturb the
    same processes. That is plausible but currently an inference from function,
    not a demonstration: nobody has shown which developmental process in the
    basal ganglia and commissures requires lattice integrity but tolerates
    reduced nucleation fidelity. The practical consequence is diagnostic - a
    tubulin-gene disorder that looks like LIS1 on MRI will be missed by an
    imaging-led differential that treats dysmorphic basal ganglia as required.
  evidence:
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Basal ganglia, corpus callosum, brainstem, and cerebellum were often
      normal, in contrast to patients with variants in other tubulin genes where
      these structures are frequently malformed.
    explanation: >-
      Establishes the divergence in imaging phenotype that this gap is about.
  - reference: PMID:29706637
    reference_title: "Tubulinopathies continued: refining the phenotypic spectrum associated with variants in TUBG1."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      This difference may, at least in part, be explained by gamma-tubulin's
      physiological function in microtubule nucleation, which differs from that
      of alpha and beta-tubulin.
    explanation: >-
      The proposed explanation, stated by its authors as partial and hedged, is
      why this remains an open gap.
  - reference: PMID:41901019
    reference_title: The Role of Prenatal Neurosonography in Identification of Tubulinopathy-Narrative Review.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      basal ganglia dysmorphism with a fused striatum (pathognomonic in
      approximately 75% of cases)
    explanation: >-
      Quantifies how central basal ganglia dysmorphism is to tubulinopathy
      imaging generally, which is what makes its absence in TUBG1 notable and
      diagnostically hazardous.
notes: >-
  Created 2026-08-20 from recommendation 1 of
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md, which identified
  TUBG1 as the one clear membership gap in the Tubulinopathies grouping. The gene
  was already named as a tubulinopathy gene inside the KB - in the evidence
  quoted by the TUBA1A entry, in the notes of that same entry, and as a
  lissencephaly gene in Lissencephaly_Spectrum_Disorders - without having an
  entry of its own.

  Modeled as a distinct Disease rather than folded into
  Lissencephaly_Spectrum_Disorders or into a generic tubulinopathy lump, for two
  reasons that are mechanistic rather than administrative. First, the molecular
  lesion is in microtubule nucleation (gamma-TuRC) rather than in the heterodimer
  that forms the lattice, which is a different failure mode from every other
  member of the grouping. Second, the imaging phenotype diverges sharply from its
  own gene family - spared basal ganglia, corpus callosum, brainstem and
  cerebellum - and resembles LIS1/PAFAH1B1 instead.

  Deliberately NOT conformed to
  neural_progenitor_centrosome_spindle_dysfunction, despite gamma-tubulin being a
  centrosomal protein: the mouse work reports intact progenitor proliferation and
  no major centrosome structural or functional defect in patient fibroblasts. The
  conflicting zebrafish neurogenesis result is curated as an open discussion
  rather than as a second conformance, because the allele classes differ
  (heterozygous missense versus somatic null). If an allele-matched experiment
  shows the missense allele also impairs proliferation, that conformance should
  be added.

  functional_impact_category is UNKNOWN by deliberate choice, not omission - see
  the genetic_context description on the trigger node. All evidence snippets are
  quoted from cached reference text.

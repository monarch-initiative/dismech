  - reference: PMID:38912084
    reference_title: "Gamma-Tubulin 1 (TUBG1) Mutation-Associated Lissencephaly and Microcephaly in an Indian Child: A Rare Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The child is undergoing physiotherapy and occupational therapy.
    explanation: >-
      Documents physical and occupational therapy in a TUBG1 case without making
      an efficacy claim.
  - reference: PMID:42177523
    reference_title: "Gene-specific long-term course, neurodevelopmental outcome and quality of life in patients with LIS1/PAFAH1B1-, DCX-, DYNC1H1-, TUBA1A- and TUBG1-related lissencephaly."
    supports: PARTIAL

name: TUBG1-related Tubulinopathy
creation_date: "2026-08-20T09:00:00Z"
category: Mendelian
disease_term:
  preferred_term: complex cortical dysplasia with other brain malformations 4
  term:
    id: MONDO:0014171
    label: complex cortical dysplasia with other brain malformations 4
description: >-
  TUBG1-related tubulinopathy (CDCBM4) is a malformation of cortical development
  caused by heterozygous, typically de novo missense variants in TUBG1, which
  encodes gamma-tubulin 1. It is the gamma-tubulin member of the tubulinopathy
  grouping, and the distinction from its alpha- and beta-tubulin siblings is
  mechanistic rather than nominal. Alpha- and beta-tubulin form the heterodimer
  that polymerizes into the microtubule lattice, so a variant in either is
  incorporated into the polymer itself. Gamma-tubulin is not a lattice subunit at
  all: it is the core component of the gamma-tubulin ring complex (gamma-TuRC),
  the template that nucleates microtubules from the centrosome. The consequence
  of losing nucleation fidelity differs from the consequence of poisoning the
  polymer, and it shows in the imaging phenotype.

  The core radiological picture is a pachygyric cortex with a
  posterior-to-anterior gradient, lateral ventricles enlarged most over the
  posterior horns, and variably reduced white matter volume - with basal
  ganglia, corpus callosum, brainstem and cerebellum often normal. That last
  point is the diagnostic discriminator: dysmorphic basal ganglia and callosal
  dysgenesis are near-signature findings in the alpha- and
  beta-tubulinopathies, and their absence
  makes TUBG1 disease resemble LIS1/PAFAH1B1 lissencephaly more closely than it
  resembles its own gene family. Clinically, most reported individuals have
  severe motor and cognitive impairment with early-life seizures, though a mild
  end exists - one reported individual has autism, intellectual disability,
  later-onset well-controlled epilepsy, a normocephalic head and no detectable
  structural abnormality on neuroimaging.

  Functionally, the best-resolved lesion is a failure of post-mitotic neuronal
  locomotion rather than of progenitor proliferation: pathogenic variants reduce
  microtubule dynamics without producing major structural or functional
  centrosome defects, and mutant bipolar neurons position their centrosome
  correctly yet fail to initiate locomotion. A zebrafish somatic model
  additionally reports disrupted neurogenesis and a link to canonical
  Wnt/beta-catenin signaling; the tension between that and the mouse finding of
  intact proliferation is curated as an open discussion rather than smoothed
  over.

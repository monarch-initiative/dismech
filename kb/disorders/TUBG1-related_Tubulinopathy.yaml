  description: >-
    Seizure treatment is symptomatic and selected according to seizure type.
    Individual TUBG1 cases may require multiple anti-seizure medicines; the
    available literature does not establish comparative efficacy or a
    disease-modifying therapy.
  therapeutic_modality: SMALL_MOLECULE

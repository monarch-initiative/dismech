name: Microcornea-Myopic Chorioretinal Atrophy
creation_date: "2026-11-04T00:00:00Z"
category: Mendelian
synonyms:
- MMCAT syndrome
- MMCAT
- microcornea, myopic chorioretinal atrophy, and telecanthus
- microcornea-myopic chorioretinal atrophy-telecanthus syndrome
- ADAMTS18-related ocular pathology
- ADAMTS18-related anterior segment dysgenesis
description: >-
  Microcornea-myopic chorioretinal atrophy (MMCAT) is a rare autosomal recessive
  developmental eye disorder caused by biallelic variants in ADAMTS18, which
  encodes a secreted zinc-dependent metalloproteinase of the ADAMTS family. It
  was first described in consanguineous Saudi families as a combination of small
  corneas, myopia with chorioretinal atrophy, telecanthus and posteriorly rotated
  ears. Later reports widened the ocular phenotype to anterior segment
  dysgenesis (ectopic pupils, posterior embryotoxon, angle anomalies with
  developmental glaucoma), lens abnormalities (childhood cataract, ectopia
  lentis, a small spherical lens), rhegmatogenous retinal detachment and a
  generalised retinal dystrophy, most often of cone-rod type. Microcornea is the
  most consistently reported feature; refractive error ranges from high myopia
  to hyperopia, and the facial features have been reported mainly in families
  of Arab ancestry. The mechanism by which loss of ADAMTS18 disturbs eye
  development is not established: ADAMTS18 is expressed in the developing lens
  and retina, cleaves fibronectin and regulates fibronectin matrix assembly in
  vitro, and Adamts18-null mice have a posterior lens-capsule defect but a
  structurally and functionally normal retina.

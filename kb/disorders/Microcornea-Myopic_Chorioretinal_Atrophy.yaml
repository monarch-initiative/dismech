      snippet: >-
        In vivo gene knockdown performed in medaka fish confirmed both that the mutation has a pathogenic role and that the inactivation of this gene has a deleterious effect on photoreceptor cell function.
      explanation: >-
        Photoreceptor dysfunction after knockdown in medaka.
discussions:
- discussion_id: mouse_lacks_human_eye_phenotype
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Retinal and Choroidal Degeneration
  - pathophysiology#Anterior Segment and Lens Maldevelopment
  - animal_models#Adamts18 knockout mouse
  prompt: >-
    Why does loss of ADAMTS18 cause microcornea, anterior segment dysgenesis and
    retinal degeneration in humans when the Adamts18-null mouse shows only a
    posterior lens-capsule defect with a normal retina?
  rationale: >-
    Evidence exists in a model but does not reproduce the disease. The knockout
    establishes that ADAMTS18 is needed for lens-capsule integrity, yet its
    retina is structurally and electrically normal and it has no corneal or
    angle anomaly. Possible explanations include species differences in eye
    growth (mice have no macula and do not become myopic), domain-specific
    effects of the human missense alleles, or a requirement in human ocular
    tissues that the mouse does not share. Until this is resolved the
    connection from the lost protease activity to the retinal and anterior
    segment phenotypes is inferred, not demonstrated.
  evidence:
  - reference: PMID:27638769
    reference_title: Adamts18 deletion results in distinct developmental defects and provides a model for congenital disorders of lens, lung, and female reproductive tract development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intriguingly, while ADAMTS18 mutations are associated with complex eye phenotypes in humans, we discerned a very restricted abnormality in mice, namely fenestration of the lens capsule resulting in posterior extrusions of herniated lens fibers.
    explanation: >-
      The model authors state the mismatch between the mouse and human eye
      phenotypes.
datasets: []
notes: >-
  Lump/split decision: DISEASE. MONDO:0014195 is a leaf term with one causal
  gene, and the cone-rod dystrophy, early-onset retinal dystrophy, anterior
  segment dysgenesis and developmental glaucoma presentations reported with
  biallelic ADAMTS18 variants are treated here as one variable ADAMTS18
  ocular disorder, as in the 2025 systematic review, not as separate allelic
  diseases. No GeneReviews chapter exists for the disease or for ADAMTS18
  (PubMed genereviews[book] searches on the disease name and on ADAMTS18
  returned no chapters, November 2026). ClinGen classifies ADAMTS18 for this
  disease as Definitive (autosomal recessive, Retina GCEP).

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ADAMTS18 variants: homozygous in the consanguineous and endogamous
    families that make up most reports, and compound heterozygous in a
    Caucasian adult and in a Chinese twin pair. Apparent dominant transmission
    in one original family was attributed to pseudodominance.
  evidence:
  - reference: PMID:23818446
    reference_title: The syndrome of microcornea, myopic chorioretinal atrophy, and telecanthus (MMCAT) is caused by mutations in ADAMTS18.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with the presumed pseudodominant inheritance in one of the original families, we show that MMCAT maps to a single autozygous locus on chr16q23.1 in which exome sequencing revealed a homozygous missense change in ADAMTS18.
    explanation: >-
      Mapping to a single autozygous locus with a homozygous ADAMTS18 variant,
      with the apparent vertical transmission explained as pseudodominance.
  - reference: PMID:38199772
    reference_title: "[A family with developmental glaucoma and microcornea due to novel ADAMTS18 gene mutations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic sequencing identified two novel compound heterozygous mutations in the ADAMTS18 gene in the twins
    explanation: >-
      Compound heterozygous ADAMTS18 variants, each carried by an unaffected
      parent, in affected twins.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. A 2025 systematic review counted fifteen
    previously reported patients from ten families plus its own case; a few
    further patients have since been reported in single-family or panel
    studies.
  evidence:
  - reference: PMID:39902400
    reference_title: Expansion of genotypic and phenotypic findings in ADAMTS18-related ocular pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Across the fifteen patients and ten families previously reported, nine different homozygous variants in ADAMTS18 have been associated with ophthalmic abnormalities.
    explanation: >-
      Count of published patients, showing the disorder is ultra-rare.
pathophysiology:
- name: Biallelic ADAMTS18 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic ADAMTS18 variants, including nonsense alleles (p.Leu356*,
    p.Cys686*, p.Arg1047*) that are expected to remove the protein and missense
    alleles that cluster in the cysteine-rich and thrombospondin-repeat
    ancillary domains. Loss of function is inferred from the nonsense alleles
    and from the recessive inheritance; no patient allele has been tested for
    catalytic activity.
  genes:
  - preferred_term: ADAMTS18
    term:
      id: hgnc:17110
      label: ADAMTS18
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:23818446
    reference_title: The syndrome of microcornea, myopic chorioretinal atrophy, and telecanthus (MMCAT) is caused by mutations in ADAMTS18.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct sequencing of this gene in four additional probands with the same phenotype revealed three additional homozygous changes in ADAMTS18 including two nonsense mutations.
    explanation: >-
      Homozygous nonsense alleles in affected probands point to loss of
      function as the mechanism.
  - reference: PMID:38249507
    reference_title: ADAMTS18-related anterior segment dysgenesis mistaken as Axenfeld-Rieger syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only notable variant of interest was an apparently homozygous novel ADAMTS18 variant – NM_199355.3: c.2058C>A; p.(Cys686*).
    explanation: >-
      A further homozygous truncating allele in an independent patient.
  downstream:
  - target: Loss of ADAMTS18 Extracellular Metalloproteinase Activity
    causal_link_type: DIRECT
- name: Loss of ADAMTS18 Extracellular Metalloproteinase Activity
  biological_scale: MOLECULAR
  description: >-
    ADAMTS18 is a secreted zinc-dependent metalloproteinase that acts on
    extracellular matrix. Its one well-characterised substrate is fibronectin:
    it cleaves fibronectin in the linker between type I modules 5 and 6,
    removing the N-terminal fragment that fibronectin needs to assemble into
    fibrils, and its loss leads to fibronectin accumulation in knockout tissues.
    Whether fibronectin is the substrate that matters in the eye is not known.
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:41135673
    reference_title: A disintegrin and metalloproteinase with thrombospondin motifs 18 (ADAMTS18) cleaves fibronectin and negatively regulates its fibrillogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using mass spectrometry, we identified two sites in FN that are proteolytically cleaved by ADAMTS18, including a cleavage site in the linker FN-I5-6.
    explanation: >-
      Identifies fibronectin as a direct proteolytic substrate of ADAMTS18.
  - reference: PMID:41135673
    reference_title: A disintegrin and metalloproteinase with thrombospondin motifs 18 (ADAMTS18) cleaves fibronectin and negatively regulates its fibrillogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockout of ADAMTS18, either in mouse models or in vitro, was shown to lead to FN accumulation, mutation in epithelial branching, and reduction in endothelial sprouting.
    explanation: >-
      The authors' summary of earlier work showing that loss of ADAMTS18 leads
      to fibronectin accumulation.
    quote_role: BACKGROUND
  downstream:
  - target: Disordered Extracellular Matrix Remodeling in the Developing Eye
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disordered Extracellular Matrix Remodeling in the Developing Eye
  biological_scale: TISSUE
  description: >-
    ADAMTS18 is expressed in the developing lens, surface ectoderm, prospective
    cornea and optic cup, and later in the inner retina. Loss of its activity is
    thought to disturb extracellular matrix remodeling as these tissues grow. In
    Adamts18-null mice the only eye defect is a posterior lens-capsule failure
    that appears at embryonic day 13.5, when the lens grows rapidly, with
    herniation of lens fibre cells into the vitreous. How the same loss produces
    small corneas, angle anomalies and retinal degeneration in humans is
    unresolved (see discussions).
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: lens development in camera-type eye
    modifier: ABNORMAL
    term:
      id: GO:0002088
      label: lens development in camera-type eye
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:27638769
    reference_title: Adamts18 deletion results in distinct developmental defects and provides a model for congenital disorders of lens, lung, and female reproductive tract development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological examination revealed a 100% penetrant eye defect resulting from leakage of lens material through the lens capsule occurring at embryonic day (E)13.5, when the lens grows rapidly.
    explanation: >-
      Loss of Adamts18 in mice disrupts lens-capsule integrity during rapid
      embryonic lens growth.
  - reference: PMID:21862674
    reference_title: Identification of ADAMTS18 as a gene mutated in Knobloch syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It was also shown that Adamts18 is expressed in the lens and retina in the developing murine eye.
    explanation: >-
      Places ADAMTS18 expression in the developing lens and retina, the
      tissues affected in the disease.
  - reference: PMID:23818446
    reference_title: The syndrome of microcornea, myopic chorioretinal atrophy, and telecanthus (MMCAT) is caused by mutations in ADAMTS18.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADAMTS18 encodes a member of a family of metalloproteinases that are known for their role in extracellular matrix remodeling, and previous work has shown a strong expression of Adamts18 in the developing eye.
    explanation: >-
      The gene-discovery authors' rationale for an extracellular matrix
      remodeling defect in the developing eye; inferred from the protein family
      rather than shown for ADAMTS18.
  downstream:
  - target: Anterior Segment and Lens Maldevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal and Choroidal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Anterior Segment and Lens Maldevelopment
  biological_scale: TISSUE
  description: >-
    Developmental anomalies of the anterior eye: small corneas, displaced and
    small pupils, posterior embryotoxon, abnormal iridocorneal angle
    development, and lens anomalies including childhood cataract, ectopia
    lentis and a small spherical lens. Angle anomalies can cause developmental
    glaucoma. The pattern resembles Axenfeld-Rieger spectrum but is recessive
    and lacks the extraocular disease of FOXC1 and PITX2 disorders.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:38249507
    reference_title: ADAMTS18-related anterior segment dysgenesis mistaken as Axenfeld-Rieger syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcornea with myopic chorioretinal atrophy, a less common ASD, is distinct, recognizable, and secondary to biallelic pathogenic variants in the metalloproteinase gene ADAMTS18.
    explanation: >-
      Classifies the disorder as an anterior segment dysgenesis.
  - reference: PMID:24874986
    reference_title: Expansion of ocular phenotypic features associated with mutations in ADAMTS18.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in ADAMTS18 are associated with ocular developmental abnormalities including microcornea, ectopia lentis, and early onset of cone-rod dystrophy.
    explanation: >-
      Developmental anomalies of the cornea and lens in ADAMTS18 families.
  downstream:
  - target: Microcornea
  - target: Ectopia pupillae
  - target: Ectopia lentis
  - target: Juvenile cataract
  - target: Developmental glaucoma
- name: Retinal and Choroidal Degeneration
  biological_scale: TISSUE
  description: >-
    Chorioretinal atrophy, typically around the optic disc, and a generalised
    retinal dystrophy that is most often cone-rod in type, with severe rod and
    cone dysfunction on electroretinography in some patients. The degree of
    atrophy and dystrophy is not explained by myopia alone, which argues for a
    primary retinal defect rather than a consequence of axial elongation. In
    medaka, knockdown of the orthologue impairs photoreceptor function.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:39902400
    reference_title: Expansion of genotypic and phenotypic findings in ADAMTS18-related ocular pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the degree of chorioretinal atrophy and cone-rod dystrophy are not able to be explained by myopia alone, especially given a wide spectrum of refractive error.
    explanation: >-
      The retinal degeneration is not secondary to myopia alone.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:23356391
    reference_title: The ADAMTS18 gene is responsible for autosomal recessive early onset severe retinal dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In vivo gene knockdown performed in medaka fish confirmed both that the mutation has a pathogenic role and that the inactivation of this gene has a deleterious effect on photoreceptor cell function.
    explanation: >-
      Loss of the orthologue impairs photoreceptor function in a fish model.
  downstream:
  - target: Chorioretinal atrophy
  - target: Cone/cone-rod dystrophy
  - target: Rhegmatogenous retinal detachment
phenotypes:
- name: Microcornea
  category: Ophthalmologic
  diagnostic: true
  frequency: VERY_FREQUENT
  description: >-
    Small corneal diameter, the most consistently reported feature. Many
    reported corneas measure 10 to 10.5 mm, so a strict below-10 mm threshold
    would exclude over half of patients.
  phenotype_term:
    preferred_term: Microcornea
    term:
      id: HP:0000482
      label: Microcornea
  evidence:
  - reference: PMID:22686506
    reference_title: "Microcornea with myopic chorioretinal atrophy, telecanthus and posteriorly-rotated ears: a distinct clinical syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Horizontal corneal diameters ranged from 9.8 to 10.5 mm but anterior chambers were not shallow (2.66-3.01 mm).
    explanation: >-
      Small corneas in all five affected boys of the original series.
  - reference: PMID:39902400
    reference_title: Expansion of genotypic and phenotypic findings in ADAMTS18-related ocular pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microcornea appears to be the only feature universally reported across patients; however even this is debatable given differences in definitions of microcornea and effects of aging
    explanation: >-
      Microcornea is the one feature reported in every published patient.
    quote_role: REVIEW_SYNTHESIS
- name: High myopia
  category: Ophthalmologic
  description: >-
    Myopia, often high (at least -6 dioptres) with long axial length, although
    refractive error is variable and some patients are only mildly myopic or
    hyperopic.
  phenotype_term:
    preferred_term: High myopia
    term:
      id: HP:0011003
      label: High myopia
  evidence:
  - reference: PMID:22686506
    reference_title: "Microcornea with myopic chorioretinal atrophy, telecanthus and posteriorly-rotated ears: a distinct clinical syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the three unrelated probands, myopic chorioretinal atrophy was severe and associated with a cycloplegic spherical equivalent at least -6.00 diopters (-6.00 to -13.75) and an axial length of at least 25.63 mm (25.63-26.84).
    explanation: >-
      High myopia with long axial length in the unrelated probands.
  - reference: PMID:22686506
    reference_title: "Microcornea with myopic chorioretinal atrophy, telecanthus and posteriorly-rotated ears: a distinct clinical syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the two affected children who were siblings, myopic chorioretinal findings were milder and associated with less myopia (-0.50 to -2.50 diopters) and shorter axial lengths (22.42-23.69 mm).
    explanation: >-
      Myopia can be mild, so high myopia is not universal.
- name: Chorioretinal atrophy
  category: Ophthalmologic
  diagnostic: true
  description: >-
    Myopic-type chorioretinal atrophy, often peripapillary, which can occur with
    only mild myopia.
  phenotype_term:
    preferred_term: Chorioretinal atrophy
    term:
      id: HP:0000533
      label: Chorioretinal atrophy
  evidence:
  - reference: PMID:39902400
    reference_title: Expansion of genotypic and phenotypic findings in ADAMTS18-related ocular pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten patients had only myopic chorioretinal atrophy (defined by the authors as “at least fundus tessellation and chorioretinal atrophy”) or chorioretinal atrophy.
    explanation: >-
      Chorioretinal atrophy as the retinal finding in most reviewed patients.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38249507
    reference_title: ADAMTS18-related anterior segment dysgenesis mistaken as Axenfeld-Rieger syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fundus examination either eye was significant for chorioretinal atrophy surrounding the optic nerve head, which otherwise appeared normal.
    explanation: >-

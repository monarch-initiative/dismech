  evidence:
  - reference: PMID:24874986
    reference_title: Expansion of ocular phenotypic features associated with mutations in ADAMTS18.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A single affected individual in the first family had bilateral microcornea, ectopic pupils, and cone-rod dystrophy.
    explanation: >-
      Cone-rod dystrophy with microcornea in a homozygous ADAMTS18 patient.
  - reference: PMID:39902400
    reference_title: Expansion of genotypic and phenotypic findings in ADAMTS18-related ocular pathology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ERG was performed on nine patients with three showing mild depression and delay of photopic and scotopic responses, one showing extinguished photopic and scotopic responses, three showing cone-rod dystrophy, one showing unspecified retinal dystrophy, and one showing normal photopic and scotopic responses.
    explanation: >-
      Electroretinographic spectrum across reviewed patients.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:23356391
    reference_title: The ADAMTS18 gene is responsible for autosomal recessive early onset severe retinal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study identified, in the analyzed patient, a homozygous missense mutation in the ADAMTS18 gene
    explanation: >-

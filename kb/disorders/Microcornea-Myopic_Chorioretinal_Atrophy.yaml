animal_models:
- name: Adamts18 knockout mouse
  species: Mouse
  genotype: Adamts18-/- (C57Bl6/Ola background)
  publication: PMID:27638769
  description: >-
    Viable Adamts18-null mice with a fully penetrant posterior lens-capsule
    defect from embryonic day 13.5, with extrusion of lens fibre cells into the
    vitreous; retinal structure and electroretinogram are normal. The mice also
    have altered bronchiolar branching and female reproductive tract defects.
  modeled_mechanisms:
  - target: Disordered Extracellular Matrix Remodeling in the Developing Eye
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Shows that ADAMTS18 is required for lens-capsule integrity during rapid
      embryonic lens growth.
    limitations: >-
      The mouse eye phenotype is restricted to the posterior lens capsule. The
      mice do not reproduce microcornea, anterior segment dysgenesis or myopia,
      and their retina is structurally and functionally normal.
    evidence:
    - reference: PMID:27638769
      reference_title: Adamts18 deletion results in distinct developmental defects and provides a model for congenital disorders of lens, lung, and female reproductive tract development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histological examination revealed a 100% penetrant eye defect resulting from leakage of lens material through the lens capsule occurring at embryonic day (E)13.5, when the lens grows rapidly.
      explanation: >-
        Fully penetrant lens-capsule defect in the knockout.
  - target: Retinal and Choroidal Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knockout retina is structurally normal with a preserved
      electroretinogram.
    limitations: >-
      Mouse eyes are not myopic and lack a macula, so the human retinal and
      chorioretinal phenotype may depend on features the mouse eye does not
      have.
    evidence:
    - reference: PMID:27638769
      reference_title: Adamts18 deletion results in distinct developmental defects and provides a model for congenital disorders of lens, lung, and female reproductive tract development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The retina was structurally normal (Fig. 2C,D) and its functional integrity as assessed by electroretinogram (ERG) was preserved (Fig. 2E,F).
      explanation: >-
        Normal retinal structure and function in the knockout.
- name: Medaka adamts18 morphant
  species: Medaka
  genotype: adamts18 morpholino knockdown
  publication: PMID:23356391
  description: >-
    Morpholino knockdown of the medaka orthologue impairs photoreceptor
    function and supported the pathogenicity of a human missense allele.
  modeled_mechanisms:
  - target: Retinal and Choroidal Degeneration

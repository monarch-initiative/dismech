diagnosis:
- name: Exposure plus eosinophilic meningitis assessment
  description: >-
    Neuroangiostrongyliasis is classified using exposure history or other minor
    criteria together with headache, neurologic symptoms, and CSF eosinophilia;
    parasite visualization or Angiostrongylus DNA detection can confirm the
    diagnosis.
  evidence:
  - reference: PMID:37111510
    reference_title: "Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A presumptive diagnosis is established by: (i) characteristic symptoms and
      signs, (ii) exposure history, and (iii) CSF eosinophilia.
    explanation: >-
      Lists the clinical, exposure-history, and CSF-eosinophilia components of
      a presumptive neuroangiostrongyliasis diagnosis.
  - reference: PMID:37111510
    reference_title: "Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Finding parasitic structures in cerebrospinal fluid or brain tissues is
      extremely rare yet represents undisputed criteria for confirming a
      diagnosis.
    explanation: >-
      Supports direct visualization of Angiostrongylus structures in CNS
      specimens as a confirmatory criterion.
  - reference: PMID:37111510
    reference_title: "Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      confirmatory (parasite detection in tissues, ocular chambers, or CSF, or
      DNA detection by PCR and sequencing).
    explanation: >-
      Supports Angiostrongylus DNA detection by PCR and sequencing as a
      confirmatory neuroangiostrongyliasis criterion.

name: Angiostrongyliasis
creation_date: '2026-11-15T05:35:00Z'
category: Infectious Disease
description: >-
  Angiostrongyliasis is a foodborne zoonotic helminthiasis caused by Angiostrongylus cantonensis,
  the rat lungworm. After ingestion of infective third-stage larvae, humans act as accidental
  hosts in which larvae migrate to and are retained in the central nervous system, producing
  eosinophilic meningitis or meningoencephalitis with headache, paresthesia, blood and CSF
  eosinophilia, and elevated CSF protein.
synonyms:
- neuroangiostrongyliasis
- rat lungworm disease
disease_term:
  term:
    id: MONDO:0019143
    label: angiostrongyliasis
  preferred_term: angiostrongyliasis
parents:
- Helminth infection
- Foodborne zoonosis
treatments:
- name: Corticosteroid-centered neuroangiostrongyliasis management
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Systemic corticosteroids are the management cornerstone for A. cantonensis neuroangiostrongyliasis
    because they reduce inflammatory headache intensity and duration.
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_phenotypes:
  - preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:37111510
    reference_title: 'Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corticosteroids are a cornerstone of NA management since they can potentially reduce
      both the intensity and duration of headaches, the main cause of distress in patients
    explanation: >-
      Supports corticosteroid treatment for neuroangiostrongyliasis symptom control.
- name: Therapeutic CSF removal for severe headache
  therapeutic_modality: SURGERY
  description: >-
    Repeated therapeutic CSF removal can reduce intracranial pressure and alleviate severe
    headache in neuroangiostrongyliasis.
  treatment_term:
    preferred_term: Lumbar Puncture
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  target_phenotypes:
  - preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:37111510
    reference_title: 'Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Measures to reduce intracranial pressure, such as therapeutic repeated CSF removal,
      have been shown to be effective, and are a choice symptomatic treatment for alleviating
      severe headaches in patients affected by NA
    explanation: >-
      Supports repeated CSF removal as symptomatic treatment for severe neuroangiostrongyliasis
      headaches.
infectious_agent:
- name: Angiostrongylus cantonensis
  infectious_agent_term:
    preferred_term: Angiostrongylus cantonensis
    term:
      id: NCBITaxon:6313
      label: Angiostrongylus cantonensis
  description: >-
    Rat lungworm species whose larvae migrate to the central nervous system in
    accidental human hosts, causing neuroangiostrongyliasis and eosinophilic
    meningitis.
  evidence:
  - reference: PMID:42860813
    reference_title: "Human angiostrongyliasis: the past, present, and future."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A. cantonensis is the principal cause of neuroangiostrongyliasis and
      eosinophilic meningitis
    explanation: >-
      The review identifies A. cantonensis as the dominant human
      Angiostrongylus species causing the neurologic arm of angiostrongyliasis.
agent_life_cycle:
  description: >-
    A. cantonensis cycles between rodent definitive hosts and gastropod intermediate hosts.
    Mollusks develop the infective third-stage larvae; shrimp, frogs, lizards, and other paratenic
    hosts can carry larvae; and humans are accidental hosts reached by eating contaminated
    raw or undercooked foods.
  hosts:
  - preferred_term: rodents
    role: definitive host
    term:
      id: NCBITaxon:9989
      label: Rodentia
  - preferred_term: gastropods
    role: intermediate host
    term:
      id: NCBITaxon:6448
      label: Gastropoda
  - preferred_term: human
    role: accidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Paratenic hosts, including freshwater shrimp, frogs, and lizards
  life_cycle_stages:
  - name: Infective third-stage larvae
    description: >-
      Third-stage larvae develop in gastropod intermediate hosts and are the foodborne stage
      infective for humans.
    evidence:
    - reference: PMID:42860813
      reference_title: 'Human angiostrongyliasis: the past, present, and future.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Human infection occurs primarily through ingestion of raw or undercooked gastropod
        intermediate hosts, paratenic hosts such as freshwater prawns and crabs, or fresh
        produce contaminated with infective third-stage larvae (L3).
      explanation: >-
        Identifies infective L3 larvae in gastropods, paratenic hosts, and contaminated produce
        as the foodborne stage for human infection.
  evidence:
  - reference: PMID:37111510
    reference_title: 'Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A. cantonensis are parasites that live inside the pulmonary arteries of rodents, and
      mollusks serve as intermediate hosts. Several other invertebrates, such as shrimp, frogs,
      and lizards, can serve as paratenic hosts. Larvae of A. cantonensis develop in the fibromuscular
      tissues of mollusks, and subsequently infect humans when raw or undercooked food is
      ingested
    explanation: >-
      Documents rodents as definitive hosts, mollusks as intermediate hosts, paratenic hosts,
      and foodborne infection of accidental human hosts for A. cantonensis.
transmission:
- name: Ingestion of infective third-stage larvae
  description: >-
    Humans acquire Angiostrongylus infection by eating raw or undercooked
    gastropod intermediate hosts, paratenic hosts such as freshwater prawns and
    crabs, or produce contaminated with infective third-stage larvae.
  evidence:
  - reference: PMID:42860813
    reference_title: "Human angiostrongyliasis: the past, present, and future."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Human infection occurs primarily through ingestion of raw or undercooked
      gastropod intermediate hosts, paratenic hosts such as freshwater prawns
      and crabs, or fresh produce contaminated with infective third-stage larvae
      (L3).
    explanation: >-
      Defines the foodborne route and the infective L3 larval stage for human
      angiostrongyliasis.
progression:
- phase: Incubation
  duration: Usually 1 to 3 weeks after exposure
  notes: >-
    Neuroangiostrongyliasis symptoms usually begin after a 1- to 3-week incubation period.
  evidence:
  - reference: PMID:37111510
    reference_title: 'Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The precise date of exposure is important to consider since the incubation period (IP)
      for NA is usually between 1 and 3 weeks, although a 1-year IP has been reported
    explanation: >-
      Provides the usual incubation interval for neuroangiostrongyliasis after exposure.
- phase: Neurologic eosinophilic meningitis
  notes: >-
    After larval migration into the CNS, patients develop headache or other neurologic symptoms
    associated with CSF eosinophilia.
  evidence:
  - reference: PMID:37111510
    reference_title: 'Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Major criteria, headache, or other neurological signs or symptoms associated with CSF
      eosinophilia are proposed as defining criteria for eosinophilic meningitis or meningoencephalitis.
    explanation: >-
      Defines the neurologic eosinophilic meningitis or meningoencephalitis phase by headache
      or other neurologic manifestations with CSF eosinophilia.
pathophysiology:
- name: Foodborne A. cantonensis third-stage larval entry
  description: >-
    Infective L3 larvae are ingested in gastropod or paratenic hosts, or on
    contaminated produce, placing humans into an accidental-host position in the
    rodent-gastropod Angiostrongylus life cycle.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42860813
    reference_title: "Human angiostrongyliasis: the past, present, and future."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Human infection occurs primarily through ingestion of raw or undercooked
      gastropod intermediate hosts, paratenic hosts such as freshwater prawns
      and crabs, or fresh produce contaminated with infective third-stage larvae
      (L3).
    explanation: >-
      Supports ingestion of the L3 larval stage as the initiating event of
      human angiostrongyliasis.
  downstream:
  - target: Angiostrongylus cantonensis larval CNS retention
    causal_link_type: DIRECT
  - target: Blood eosinophilia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Angiostrongylus cantonensis larval CNS retention
  description: >-
    In accidental human hosts, A. cantonensis larvae migrate aberrantly into the
    central nervous system and are retained there instead of maturing into
    adult worms in pulmonary arteries.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:37111510
    reference_title: "Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In accidental hosts, including humans, larvae migrate and are retained in
      the CNS. This retention prevents complete maturation of adult worms inside
      the pulmonary arteries
    explanation: >-
      Explains the aberrant CNS retention that drives neuroangiostrongyliasis
      in humans.
  downstream:
  - target: Eosinophilic meningeal inflammation
    causal_link_type: DIRECT
- name: Eosinophilic meningeal inflammation
  description: >-
    Larval retention in the CNS produces eosinophilic meningitis or
    meningoencephalitis, with headache and other neurologic symptoms supported
    by cerebrospinal-fluid eosinophilia.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  evidence:
  - reference: PMID:37111510
    reference_title: "Neuroangiostrongyliasis: Updated Provisional Guidelines for Diagnosis
      and Case Definitions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Major criteria, headache, or other neurological signs or symptoms
      associated with CSF eosinophilia are proposed as defining criteria for
      eosinophilic meningitis or meningoencephalitis.
    explanation: >-
      Defines the syndrome as neurologic symptoms with eosinophilic CSF
      inflammation, which is the inflammatory tissue-level process this node
      records.
  downstream:
  - target: Eosinophilic meningitis
    causal_link_type: DIRECT
  - target: Headache
    causal_link_type: DIRECT
  - target: Paresthesia
    causal_link_type: DIRECT
  - target: CSF eosinophilia
    causal_link_type: DIRECT
  - target: Increased CSF protein concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

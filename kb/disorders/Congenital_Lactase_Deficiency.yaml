      label: Nephrocalcinosis
prevalence:
- population: Finland
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    CLD is historically enriched in Finland due to a founder nonsense
    mutation (Y1390X, "Fin(major)"); 42 patients were diagnosed in Finland
    between 1966 and the 1998 report, with the founder mutation traced to
    sparsely populated eastern and northern Finland.
  evidence:
  - reference: PMID:9758622
    reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since 1966, 42 patients have been diagnosed in Finland.
    explanation: Direct historical case count for the Finnish founder population.
- population: Worldwide (outside Finland)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    CLD has increasingly been reported outside Finland (Central Europe,
    Japan, Italy, Turkey), with LCT mutations distinct from or in addition to
    the Finnish founder variant, suggesting the disease is more common than
    previously appreciated but remains ultra-rare worldwide.
  evidence:
  - reference: PMID:19161632
    reference_title: "Four novel mutations in the lactase gene (LCT) underlying congenital lactase deficiency (CLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report of CLD mutations in patients living outside
      Finland. It seems that disease is more common than previously thought.
    explanation: Documents CLD cases and causative LCT mutations outside the Finnish founder population.

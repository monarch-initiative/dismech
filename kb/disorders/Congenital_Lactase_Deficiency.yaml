- name: Molecular LCT Genetic Testing
  description: >-
    Sequencing the coding region of LCT identifies biallelic loss-of-function
    variants (e.g., the Finnish founder Y1390X mutation or other nonsense,
    frameshift, or missense variants), enabling molecular diagnosis and
    genetic counseling.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Homozygous or compound heterozygous LCT coding-region loss-of-function variants.
  evidence:
  - reference: PMID:16400612
    reference_title: "Mutations in the translated region of the lactase gene (LCT) underlie congenital lactase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings facilitate genetic testing in clinical practice and
      enable genetic counseling for this severe disease.
    explanation: Directly supports molecular LCT testing as a clinical diagnostic and counseling tool.
treatments:
- name: Lifelong Lactose-Free Diet
  description: >-
    Strict elimination of lactose (lactose-free formula in infancy, and a
    lactose-free/lactose-restricted diet thereafter) is the definitive
    first-line management of CLD and rapidly resolves diarrhea and associated
    hypercalcemia.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:17345962
    reference_title: "Molecular differentiation of congenital lactase deficiency from adult-type hypolactasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      results in severe clinical consequences if not properly diagnosed and
      treated by lactose avoidance.
    explanation: Directly identifies lactose avoidance as the treatment that prevents severe clinical consequences of CLD.
  - reference: PMID:8523189
    reference_title: "Hypercalcemia and nephrocalcinosis in patients with congenital lactase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypercalcemia ceased within a week of the start of a lactose-free diet.
    explanation: Directly documents resolution of hypercalcemia after starting a lactose-free diet.
  target_mechanisms:
  - target: Osmotic Load and Unabsorbed Lactose in the Intestinal Lumen
    treatment_effect: MODULATES
    description: >-
      Removing dietary lactose eliminates the osmotically active substrate
      that produces malabsorptive watery diarrhea, since the enzymatic
      block itself cannot be corrected by diet.
    evidence:
    - reference: PMID:8523189
      reference_title: "Hypercalcemia and nephrocalcinosis in patients with congenital lactase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hypercalcemia ceased within a week of the start of a lactose-free
        diet.
      explanation: Rapid resolution of downstream hypercalcemia after lactose withdrawal supports that removing the substrate interrupts the osmotic-malabsorption mechanism.
  target_phenotypes:

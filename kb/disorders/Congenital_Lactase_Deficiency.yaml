biochemical:
- name: Absent to Near-Absent Intestinal Lactase Activity
  presence: DECREASED
  context: >-
    Jejunal/intestinal biopsy shows an almost total lack of lactase-phlorizin
    hydrolase activity in CLD, in contrast to the partial (5-10% of normal)
    residual activity typical of adult-type hypolactasia.
  readouts:
  - target: LCT Loss-of-Function and Absent Lactase-Phlorizin Hydrolase Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Near-total absence of jejunal lactase activity directly measures loss
      of LPH enzyme function caused by biallelic LCT coding mutations.
    evidence:
    - reference: PMID:9758622
      reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CLD is the most severe form of lactase deficiency, with an almost
        total lack of lactase-phlorizin hydrolase (LPH) activity on jejunal
        biopsy. In adult-type hypolactasia, the most common genetic enzyme
        deficiency in humans, this enzyme activity is reduced to 5%-10%.
      explanation: Directly contrasts the near-total loss of jejunal LPH activity in CLD against the partial reduction in adult-type hypolactasia, supporting the NEC disambiguation.
  evidence:
  - reference: PMID:9758622
    reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CLD is the most severe form of lactase deficiency, with an almost total
      lack of lactase-phlorizin hydrolase (LPH) activity on jejunal biopsy.
    explanation: Establishes near-total loss of jejunal lactase activity as the core biochemical finding in CLD.

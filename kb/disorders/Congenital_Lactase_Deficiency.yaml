name: Congenital Lactase Deficiency
creation_date: "2026-07-06T00:00:00Z"
category: Mendelian
synonyms:
- CLD
- lactase-phlorizin hydrolase deficiency, congenital
description: >-
  Congenital lactase deficiency (CLD) is an ultra-rare autosomal recessive
  neonatal disorder caused by biallelic loss-of-function variants in LCT, the
  gene encoding lactase-phlorizin hydrolase (LPH). Affected infants have
  essentially absent intestinal brush-border lactase activity from birth and
  develop severe watery diarrhea from the first lactose-containing feed
  (breast milk or standard formula). CLD is historically enriched in Finland
  because of a founder nonsense mutation. CLD is genetically and clinically
  distinct from the extremely common "adult-type hypolactasia" (primary
  lactase non-persistence/lactose intolerance, MONDO:0100345), which is a
  normal polymorphic trait caused by a regulatory (non-coding) variant near
  LCT/MCM6 that lowers, but does not abolish, lactase expression only after
  weaning; CLD instead results from coding-region mutations in LCT itself that
  eliminate LPH protein function from birth. CLD is also distinct from
  secondary/acquired lactase deficiency due to mucosal injury.
disease_term:
  preferred_term: congenital lactase deficiency
  term:
    id: MONDO:0009115
    label: congenital lactase deficiency
parents:
- Gastrointestinal Disease
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    CLD is inherited as an autosomal recessive disorder; most Finnish patients
    are homozygous for a single founder nonsense mutation, and other
    populations show homozygous or compound heterozygous LCT loss-of-function
    genotypes.
  evidence:
  - reference: PMID:9758622
    reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital lactase deficiency (CLD) is an autosomal recessive,
      gastrointestinal disorder characterized by watery diarrhea starting
      during the first 1-10 d of life, in infants fed lactose-containing milks.
    explanation: Directly states the autosomal recessive inheritance pattern of CLD.
  - reference: PMID:16400612
    reference_title: "Mutations in the translated region of the lactase gene (LCT) underlie congenital lactase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-seven patients out of 32 (84%) were homozygous for a nonsense
      mutation, c.4170T-->A (Y1390X), designated "Fin(major)."
    explanation: Documents the homozygous founder nonsense mutation genotype in most Finnish CLD patients.
genetic:
- name: LCT loss-of-function variants
  gene_term:
    preferred_term: LCT
    term:
      id: hgnc:6530
      label: LCT
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    CLD is caused by mutations in the coding (translated) region of LCT that
    inactivate the lactase-phlorizin hydrolase enzyme, in contrast to the
    common adult-type hypolactasia variant, which lies in a distal regulatory
    element and only reduces developmental transcription of an otherwise
    normal LCT gene. The Finnish founder mutation is a nonsense variant,
    c.4170T>A (Y1390X); other populations carry distinct nonsense, frameshift,
    or missense LCT variants.
  evidence:
  - reference: PMID:16400612
    reference_title: "Mutations in the translated region of the lactase gene (LCT) underlie congenital lactase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data demonstrate that, in contrast to common adult-type hypolactasia
      (lactose intolerance) caused by a variant of the regulatory element, the
      severe infancy form represents the outcome of mutations affecting the
      structure of the protein inactivating the enzyme.
    explanation: Directly contrasts the CLD coding-region loss-of-function mechanism with the adult-type hypolactasia regulatory-variant mechanism, supporting the NEC disambiguation.
  - reference: PMID:19161632
    reference_title: "Four novel mutations in the lactase gene (LCT) underlying congenital lactase deficiency (CLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both Finnish patients were heterozygous for the Finnish founder mutation
      Y1390X.
    explanation: Confirms the Y1390X founder mutation recurs even in non-Finnish patients of partial Finnish ancestry.
  - reference: PMID:9758622
    reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the CLD mutation was found to be enriched in sparsely populated eastern
      and northern Finland, because of a founder effect.
    explanation: Establishes the Finnish founder-effect basis for CLD enrichment.
pathophysiology:
- name: LCT Loss-of-Function and Absent Lactase-Phlorizin Hydrolase Activity
  conforms_to: "diet_induced_osmotic_diarrhea#Loss of a Substrate-Specific Brush-Border Digestive or Absorptive Step"
  description: >-
    Biallelic loss-of-function variants in the coding region of LCT prevent
    normal biosynthesis, folding, intracellular trafficking, or catalytic
    function of lactase-phlorizin hydrolase (LPH), the brush-border enzyme
    that hydrolyzes lactose. Several characterized CLD variants (e.g. p.Y1390*,
    p.E1612*, p.S1150Pfs*19, p.S1121L, p.R1587H, p.S688P) produce LPH proteins
    that are transport-incompetent and enzymatically inactive, so essentially
    no functional enzyme reaches the apical enterocyte membrane.
  genes:
  - preferred_term: LCT
    term:
      id: hgnc:6530
      label: LCT
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  molecular_functions:
  - preferred_term: lactase activity
    term:
      id: GO:0000016
      label: lactase activity
    modifier: ABSENT
  biological_processes:
  - preferred_term: protein transport
    term:
      id: GO:0015031
      label: protein transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35007711
    reference_title: "Hypomorphic variants of lactase-phlorizin hydrolase in congenital lactase deficiency are trafficking incompetent and functionally inactive."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data unequivocally demonstrate that these mutants are absolutely
      transport incompetent, some of which are readily degraded, and are
      enzymatically inactive.
    explanation: Cell biology study demonstrates that characterized CLD LCT mutants fail to traffic to the membrane and lack catalytic activity.
  - reference: PMID:30813293
    reference_title: "Congenital Lactase Deficiency: Mutations, Functional and Biochemical Implications, and Future Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CLD is associated with mutations in the translated region of the LPH
      gene that elicit loss-of-function of LPH.
    explanation: Review confirms translated-region LCT mutations cause loss of LPH function in CLD.
  downstream:
  - target: Failure to Hydrolyze Lactose into Glucose and Galactose
    causal_link_type: DIRECT
    description: >-
      Absent brush-border lactase activity prevents hydrolysis of dietary
      lactose into its absorbable monosaccharides, glucose and galactose.
    evidence:
    - reference: PMID:17345962
      reference_title: "Molecular differentiation of congenital lactase deficiency from adult-type hypolactasia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        some infants are born with an inability to digest lactase (congenital
        lactase deficiency or CLD) due to low levels of LPH activity, which
        results in severe clinical consequences if not properly diagnosed and
        treated by lactose avoidance.
      explanation: Review directly links low LPH activity in CLD to inability to digest lactose.
- name: Failure to Hydrolyze Lactose into Glucose and Galactose
  description: >-
    With little or no functional LPH at the brush border, ingested lactose is
    not cleaved into glucose and galactose and cannot be absorbed by the
    normal monosaccharide transport route; it instead remains intact within
    the intestinal lumen.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  chemical_entities:
  - preferred_term: lactose
    term:
      id: CHEBI:17716
      label: lactose
    modifier: INCREASED
  biological_processes:
  - preferred_term: carbohydrate metabolic process
    term:
      id: GO:0005975
      label: carbohydrate metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30813293
    reference_title: "Congenital Lactase Deficiency: Mutations, Functional and Biochemical Implications, and Future Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This disorder is diagnosed already during the first few days of the
      newborn's life due to the inability to digest lactose, the main
      carbohydrate in mammalian milk.
    explanation: Confirms the neonatal-onset inability to digest lactose that defines CLD.
  downstream:
  - target: Osmotic Load and Unabsorbed Lactose in the Intestinal Lumen
    causal_link_type: DIRECT
    description: >-
      Undigested lactose remaining in the intestinal lumen is an osmotically
      active solute that draws water into the bowel lumen.
    evidence:
    - reference: PMID:30813293
      reference_title: "Congenital Lactase Deficiency: Mutations, Functional and Biochemical Implications, and Future Perspectives."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The symptoms are similar to those in other carbohydrate malabsorption
        disorders, such as congenital sucrase-isomaltase deficiency, and
        include severe osmotic watery diarrhea.
      explanation: Review classifies CLD symptoms as severe osmotic watery diarrhea from unabsorbed carbohydrate, analogous to other disaccharidase deficiencies.
- name: Osmotic Load and Unabsorbed Lactose in the Intestinal Lumen
  conforms_to: "diet_induced_osmotic_diarrhea#Unabsorbed Dietary Solute Retention in the Intestinal Lumen"
  description: >-
    The osmotic load created by unabsorbed lactose in the small and large
    bowel drives water secretion into the lumen, producing severe watery
    diarrhea beginning with the first lactose-containing feed, with
    dehydration, metabolic acidosis, and, in a subset of infants, secondary
    hypercalcemia and nephrocalcinosis.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  evidence:
  - reference: PMID:9758622
    reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital lactase deficiency (CLD) is an autosomal recessive,
      gastrointestinal disorder characterized by watery diarrhea starting
      during the first 1-10 d of life, in infants fed lactose-containing milks.
    explanation: Establishes the neonatal-onset watery diarrhea phenotype triggered by lactose-containing feeds.
  downstream:
  - target: Severe Watery Diarrhea
    causal_link_type: DIRECT
    description: Osmotic water secretion produces severe watery diarrhea upon lactose exposure.
    evidence:
    - reference: PMID:9758622
      reference_title: "Assignment of the locus for congenital lactase deficiency to 2q21, in the vicinity of but separate from the lactase-phlorizin hydrolase gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Congenital lactase deficiency (CLD) is an autosomal recessive,
        gastrointestinal disorder characterized by watery diarrhea starting
        during the first 1-10 d of life, in infants fed lactose-containing milks.
      explanation: Directly supports watery diarrhea beginning in the first days of life on lactose-containing feeds.
  - target: Hypercalcemia and Nephrocalcinosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Unhydrolyzed lactose reaching the ileum may directly enhance ileal calcium absorption.
    - Chronic diarrhea causes metabolic acidosis, which may promote hypercalcemia and renal calcium deposition.
    description: >-
      A substantial fraction of infants with CLD develop hypercalcemia and
      medullary nephrocalcinosis, which resolve after starting a
      lactose-free diet.
    evidence:
    - reference: PMID:8523189
      reference_title: "Hypercalcemia and nephrocalcinosis in patients with congenital lactase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe 11 infants with congenital lactase deficiency, whose age
        at diagnosis varied from 6 to 88 days. At the time of admission, 7 of
        10 infants had hypercalcemia.
      explanation: Clinical case series directly documents hypercalcemia in a majority of CLD infants at diagnosis.
    - reference: PMID:8523189
      reference_title: "Hypercalcemia and nephrocalcinosis in patients with congenital lactase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mechanism of hypercalcemia is unclear but may be related to
        metabolic acidosis or may be promoted by the lactose effect (i.e., by
        nonhydrolyzed lactose that has a direct enhancing effect on calcium
        absorption in the ileum).
      explanation: Directly proposes the intermediate mechanisms (acidosis, direct luminal lactose effect on ileal calcium absorption) linking unabsorbed lactose to hypercalcemia.

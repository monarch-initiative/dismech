    explanation: Phase 2 SEQUOIA trial demonstrates that intrahepatic Z-AAT is pharmacodynamically modifiable, validating the biochemical biomarker.

environmental:
- name: Cigarette Smoking
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  influences_mechanisms:
  - target: Alveolar Tissue Destruction
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Emphysema is alveolar destruction, and the cited sentence names both the
      exposure and that outcome. Recorded as exacerbating rather than
      triggering because the destruction proceeds from the inherited
      antiprotease deficiency and smoking accelerates it, which is the word
      the source uses. The intervening step is the protease-antiprotease
      imbalance this entry models explicitly, so the intermediates are known
      rather than unknown.
    evidence:
    - reference: PMID:39980299
      reference_title: "Advancing the understanding and treatment of lung pathologies associated with alpha 1 antitrypsin deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The development of emphysema and decline in lung function varies by AATD genotype and is accelerated by risk factors, such as smoking."
      explanation: >-
        States that emphysema development and lung-function decline are
        accelerated by risk factors such as smoking, naming the exposure and
        the alveolar destruction at this node.
    - reference: PMID:40943425
      reference_title: "Next-Generation Regenerative Therapies for Alpha-1 Antitrypsin Deficiency: Molecular Pathogenesis to Clinical Translation."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "AATD and smoking represent major risk factors for COPD, the third leading cause of death worldwide at present."
      explanation: >-
        Places the deficiency and smoking together as major risk factors for
        chronic obstructive lung disease. It sets the two side by side without
        saying what smoking does to this node.
  description: >-

name: Alpha-1 Antitrypsin Deficiency
creation_date: '2026-01-09T07:11:54Z'
updated_date: '2026-05-09T20:48:03Z'
description: >-
  Alpha-1 antitrypsin deficiency is an autosomal codominant disorder caused by
  pathogenic variants in SERPINA1, which encodes the principal circulating
  inhibitor of neutrophil elastase. The common severe Z allele causes the mutant
  protein to misfold and polymerize within hepatocytes, producing both a loss of
  circulating antiprotease activity and a toxic gain-of-function from hepatic
  polymer accumulation. Inadequate antiprotease protection lets neutrophil
  elastase degrade alveolar elastin, causing early-onset panacinar emphysema
  (accelerated by smoking), while the retained hepatic polymers can cause
  cirrhosis and hepatocellular carcinoma.
category: Mendelian

notes: >-
  This entry distinguishes the loss-of-antiprotease pulmonary arm from the
  toxic-gain-of-function hepatic arm. Quantitative phenotype frequencies are
  omitted where the available evidence is genotype-, age-, or referral-cohort
  dependent. Emerging gene, cell, and regenerative therapies remain research
  leads unless represented by a verified trial or peer-reviewed human study.
  Differential diagnoses without cache-backed distinguishing criteria are not
  represented as structured entries; the focused differential instead records
  evidence-supported features that separate AATD from smoking-related COPD.

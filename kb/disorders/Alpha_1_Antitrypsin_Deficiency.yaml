    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exogenous administration of purified human serum-derived AAT is the only specific treatment approved for AATD in nonsmoking patients with severe deficiency (serum AAT concentration of < 57 mg/dL or < 11 µM), with evidence of functional loss above the physiological level."
    explanation: 2024 Brazilian Thoracic Society guideline directly states the severe-deficiency threshold (<57 mg/dL or <11 µM) used for augmentation therapy eligibility.
- name: Z-Alpha-1 Antitrypsin Polymer
  presence: Elevated in liver tissue
  context: >-
    Hepatic AAT polymer load correlates with fibrosis stage and clinical outcome,
    and liver Z-AAT concentration is reduced by hepatocyte-targeted Z-AAT mRNA
    silencing with fazirsiran.
  evidence:
  - reference: PMID:32726073
    reference_title: The Alpha-1 Antitrypsin Polymer Load Correlates With Hepatocyte Senescence, Fibrosis Stage and Liver-Related Mortality.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The AAT polymer load correlated closely with hepatic fibrosis stage and long-term clinical outcome, independent of homozygous or heterozygous status."
    explanation: Human liver-tissue analysis links polymer load to fibrosis stage and long-term outcome.
  - reference: PMID:32376409
    reference_title: Liver Phenotypes of European Adults Heterozygous or Homozygous for Pi∗Z Variant of AAT (Pi∗MZ vs Pi∗ZZ genotype) and Noncarriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AAT inclusions were detected in liver biopsies of 63% of subjects with the Pi∗MZ genotype, vs 97% of subjects with the Pi∗ZZ genotype, and increased with liver fibrosis stages."
    explanation: Biopsy-based quantification of Z-AAT inclusions confirms the polymer biomarker correlates with fibrosis stage in PiZZ adults and is detectable in many PiMZ heterozygotes.
  - reference: PMID:38964420
    reference_title: 'Fazirsiran for Adults With Alpha-1 Antitrypsin Deficiency Liver Disease: A Phase 2 Placebo Controlled Trial (SEQUOIA).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At postdose liver biopsy, fazirsiran reduced median liver Z-AAT concentration by 93% compared with an increase of 26% with placebo."
    explanation: Phase 2 SEQUOIA trial demonstrates that intrahepatic Z-AAT is pharmacodynamically modifiable, validating the biochemical biomarker.


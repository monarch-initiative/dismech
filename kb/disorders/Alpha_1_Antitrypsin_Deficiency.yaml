  - reference: PMID:32726073
    reference_title: The Alpha-1 Antitrypsin Polymer Load Correlates With Hepatocyte Senescence, Fibrosis Stage and Liver-Related Mortality.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The AAT polymer load correlated closely with hepatic fibrosis stage and long-term clinical outcome, independent of homozygous or heterozygous status."
    explanation: Human liver-tissue analysis links polymer load to fibrosis stage and long-term outcome.

    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Obesity and diabetes are recorded here as accelerants of the hepatic arm
      rather than the pulmonary one. Two limits are worth stating rather than
      leaving in the grade: the measurement is liver stiffness, a proxy for
      the fibrosis this node drives rather than a measure of stellate cell
      activation, and the finding is specific to heterozygous Pi*MZ adults

name: Alpha-1 Antitrypsin Deficiency
creation_date: '2026-01-09T07:11:54Z'
description: >-
  Alpha-1 antitrypsin deficiency is an autosomal codominant disorder caused by
  pathogenic variants in SERPINA1, which encodes the principal circulating
  inhibitor of neutrophil elastase. The common severe Z allele causes the mutant
  protein to misfold and polymerize within hepatocytes, producing both a loss of
  circulating antiprotease activity and a toxic gain-of-function from hepatic
  polymer accumulation. Inadequate antiprotease protection lets neutrophil
  elastase degrade alveolar elastin, causing early-onset panacinar emphysema
  (accelerated by smoking), while the retained hepatic polymers can cause
  cirrhosis and hepatocellular carcinoma.
category: Mendelian
disease_term:
  preferred_term: alpha 1-antitrypsin deficiency
  term:
    id: MONDO:0013282
    label: alpha 1-antitrypsin deficiency
parents:
- Genetic Lung Diseases
- Hereditary Metabolic Diseases
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
    notes: >-
      Early-onset panacinar emphysema is the presenting and dominant clinical
      problem, so the respiratory Part is the primary chapter home.
  - classification_value: GASTROINTESTINAL
    notes: >-
      The hepatic arm - Z-AAT polymer retention causing cirrhosis and
      hepatocellular carcinoma - is a mechanistically distinct disease covered
      separately, so a second Part is assigned rather than folding it into the
      respiratory one.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian SERPINA1 disorder with autosomal codominant expression, and the
      textbook gene-environment interaction: smoking sharply accelerates the
      emphysema arm.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      The hepatic arm is a toxic gain-of-function from misfolded Z-AAT
      polymerizing and being retained in the hepatocyte endoplasmic reticulum -
      the archetypal serpinopathy. This is deliberately a claim about the liver
      disease only: the emphysema arm is a loss-of-function antiprotease
      deficiency, not a proteotoxic one, and the two arms of this disease have
      opposite mechanistic characters.
    evidence:
    - reference: PMID:35868681
      reference_title: "Alpha-1 Antitrypsin Deficiency Liver Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Liver disease in homozygous ZZ alpha-1 antitrypsin (AAT) deficiency occurs due to the accumulation of large quantities of AAT mutant Z protein polymers in the liver."
      explanation: >-
        Attributes the liver disease to accumulation of mutant Z protein
        polymers, i.e. a proteotoxic rather than a loss-of-function mechanism.
inheritance:
- name: Autosomal codominant inheritance
  description: >-
    SERPINA1 alleles are expressed codominantly. When both parents carry one
    pathogenic allele, each sibling has a 25% chance of inheriting two
    pathogenic alleles, a 50% chance of being heterozygous, and a 25% chance of
    inheriting neither allele.
  inheritance_term:
    preferred_term: autosomal codominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  evidence:
  - reference: PMID:20301692
    reference_title: Alpha-1 Antitrypsin Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AATD is inherited in an autosomal codominant manner."
    explanation: GeneReviews directly states the autosomal codominant inheritance pattern.
  - reference: PMID:20301692
    reference_title: Alpha-1 Antitrypsin Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If both parents are heterozygous for one SERPINA1 pathogenic variant (e.g., PI*MZ), each sib of an affected individual has a 25% chance of being affected (PI*ZZ), a 50% chance of being heterozygous (PI*MZ), and a 25% chance of inheriting neither of the pathogenic variants (PI*MM)."
    explanation: GeneReviews gives the recurrence risks for two heterozygous parents.
prevalence:
- population: Western Europe and the United States
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 20.0
  rate_high: 40.0
  percentage: 1 in 2,500-5,000
  notes: >-
    Severe alpha-1 antitrypsin deficiency is most prevalent in populations of
    European ancestry. Genotype-based estimates in Western Europe and the United
    States are around 1 in 2,500 to 1 in 5,000 newborns, while diagnosed
    prevalence in a large German claims database was lower at 23.73 per 100,000
    overall, consistent with underrecognition.
  evidence:
  - reference: PMID:18565211
    reference_title: Hereditary alpha-1-antitrypsin deficiency and its clinical consequences.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prevalence in Western Europe and in the USA is estimated at approximately 1 in 2,500 and 1 : 5,000 newborns, and is highly dependent on the Scandinavian descent within the population."
    explanation: Review-level epidemiology gives the standard severe-disease prevalence range for alpha-1 antitrypsin deficiency in high-prevalence populations.
  - reference: PMID:27824593
    reference_title: 'The prevalence of diagnosed α1-antitrypsin deficiency and its comorbidities: results from a large population-based database.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corresponding to a prevalence of 23.73 per 100 000 in all age groups and 29.36 per 100 000 in those ≥30 years."
    explanation: Population-based claims data show that diagnosed prevalence is substantially lower than genotype-based estimates, supporting under-ascertainment in routine care.
- population: Worldwide diagnosed AATD population
  notes: >-
    AATD remains substantially underdiagnosed worldwide. A 2024 international
    guideline emphasizes that diagnosis is often delayed and that targeted/cascade
    testing in high-risk groups is the main case-finding strategy outside the few
    jurisdictions with newborn screening.
  evidence:
  - reference: PMID:39661838
    reference_title: Recommendations for the diagnosis and treatment of alpha-1 antitrypsin deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unfortunately, underdiagnosis is quite common; it is possible that only 10% of cases are diagnosed."
    explanation: 2024 Brazilian Thoracic Society guideline quantifies AATD underdiagnosis at ~90% (only ~10% diagnosed), supporting prevalence underestimation.
- population: AATD contribution to COPD/bronchiectasis
  notes: >-
    Among adults with COPD/emphysema or bronchiectasis, AATD genotypes (Pi*SZ
    and Pi*ZZ) are detected substantially more frequently than in asthma
    populations, supporting recommendations to test all adults with COPD or
    bronchiectasis.
  evidence:
  - reference: PMID:33192056
    reference_title: The Distribution of Alpha-1 Antitrypsin Genotypes Between Patients with COPD/Emphysema, Asthma and Bronchiectasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COPD/emphysema and bronchiectasis, but not asthma patients, exhibit higher frequency of AATD genotypes."
    explanation: Large German testing-laboratory cohort (29,465 kits) shows AATD genotype prevalence is enriched in both COPD and bronchiectasis populations, supporting case-finding policy.

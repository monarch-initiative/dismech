treatments:
- name: Alpha-1 Antitrypsin Augmentation Therapy
  description: >
    Intravenous purified human plasma-derived AAT slows emphysema progression as
    measured by CT-density change.
  evidence:
  - reference: PMID:22500781
    reference_title: "A review of augmentation therapy for alpha-1 antitrypsin deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Specific therapy for lung-affected individuals with AATD is augmentation therapy, which consists of intravenous infusion of purified human plasma-derived alpha-1 antitrypsin (AAT)."
    explanation: "This review describes augmentation therapy as the specific treatment for alpha-1 antitrypsin deficiency."
  - reference: PMID:28496314
    reference_title: "Treatment of lung disease in alpha-1 antitrypsin deficiency: a systematic review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Meta-analyses were only possible for RCTs of intravenous augmentation, which slowed progression of emphysema measured by CT density change, 0.79 g/L/year versus placebo (P=0.002)"
    explanation: The systematic review quantifies slower CT-density decline with intravenous augmentation.

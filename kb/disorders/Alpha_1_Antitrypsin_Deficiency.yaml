diagnosis:
- name: Serum alpha-1 antitrypsin measurement
  diagnosis_term:
    preferred_term: alpha-1 antitrypsin measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Demonstration of a low serum AAT concentration is the biochemical component
    of AATD diagnosis.
  evidence:
  - reference: PMID:20301692
    reference_title: Alpha-1 Antitrypsin Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of AATD relies on demonstration of low serum concentration of alpha-1 antitrypsin (AAT) and either identification of biallelic pathogenic variants in SERPINA1 or detection of a functionally deficient AAT protein variant by protease inhibitor (PI) typing."
    explanation: GeneReviews identifies low serum AAT as the biochemical component of diagnosis.
- name: Confirmatory PI typing or SERPINA1 genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    A low serum AAT result is confirmed by either biallelic pathogenic SERPINA1
    variants or a functionally deficient protein variant identified by
    protease-inhibitor typing.
  evidence:
  - reference: PMID:20301692
    reference_title: Alpha-1 Antitrypsin Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of AATD relies on demonstration of low serum concentration of alpha-1 antitrypsin (AAT) and either identification of biallelic pathogenic variants in SERPINA1 or detection of a functionally deficient AAT protein variant by protease inhibitor (PI) typing."
    explanation: GeneReviews directly states the biochemical-plus-genetic/protein diagnostic criteria.
- name: Longitudinal pulmonary and hepatic surveillance
  description: >-
    Surveillance includes pulmonary function testing and liver laboratory and

- reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12405365/
  title: Genetic diagnosis and clinical characteristics analysis of cardiospondylocarpofacial syndrome in a Chinese family - PMC
  findings:
  - statement: >-
      A CSCFS proband with a de novo MAP3K7 c.142G>A (p.Gly48Arg) variant expanded
      the phenotype with new complications including short lingual frenulum,
      asymmetric cerebral hemispheres, and intestinal obstruction with
      intussusception.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12405365/
      reference_title: Genetic diagnosis and clinical characteristics analysis of cardiospondylocarpofacial syndrome in a Chinese family - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        our patient presented with new complications of short tongue tie, brain
        abnormalities including asymmetrical cerebral hemispheres with widening of
        the right frontotemporal exoptic hiatus, intestinal obstruction and
        intussusception
      explanation: >-
        Reports several previously unreported complications that expand the CSCFS
        phenotype.
  - statement: >-
      TAK1 (MAP3K7) is expressed in embryonic cranial neural crest, enteric
      mesenchyme, and dorsal root ganglia, providing a developmental basis for the
      craniofacial, gastrointestinal, and neural features of CSCFS.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12405365/
      reference_title: Genetic diagnosis and clinical characteristics analysis of cardiospondylocarpofacial syndrome in a Chinese family - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TAK1 (encoded by MAP3K7) is widely expressed in various tissues, including
        the embryonic cranial neural crest, enteric mesenchyme, and dorsal root
        ganglia
      explanation: >-
        Links TAK1 tissue expression to the multisystem developmental features of
        CSCFS.
- reference: GEO:GSE279246
  title: TAK1 operates at the primary cilium in non-canonical TGFB/BMP signaling to control heart development
  findings:
  - statement: >-
      Exome sequencing of large congenital heart disease cohorts found an increased
      burden of rare TAB2 and TAK1 variants in syndromic CHD but not in
      nonsyndromic CHD, supporting a role for the TAK1 axis in syndromic
      developmental heart disease relevant to CSCFS.
    evidence:

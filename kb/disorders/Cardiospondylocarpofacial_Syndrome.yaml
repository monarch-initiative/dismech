    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 7 "Filamin group and
      related disorders"; listed as "Cardiospondylocarpofacial syndrome".

treatments:
- name: JAK Inhibitor Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Janus kinase inhibition (ruxolitinib) blocks interferon-receptor signaling
    downstream of the TLR7-driven type I interferon excess and controlled both
    the hematologic and metabolic features in a patient with the p.F507S variant.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Type I Interferon Overproduction
    description: >-
      JAK inhibition interrupts type I interferon receptor signaling downstream
      of the TLR7-driven interferon excess.
    evidence:
    - reference: PMID:42170322
      reference_title: "TLR7 F507S gain-of-function mutation presenting with early-onset SLE and hypertriglyceridemia: Response to JAK inhibition."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both hematological and metabolic features responded to ruxolitinib
      explanation: >-
        Documents the clinical response to JAK inhibition, acting on the
        interferon arm of the disease.
  evidence:
  - reference: PMID:42170322
    reference_title: "TLR7 F507S gain-of-function mutation presenting with early-onset SLE and hypertriglyceridemia: Response to JAK inhibition."

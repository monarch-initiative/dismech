- name: Type I Interferon Overproduction
  biological_scale: CELLULAR
  description: >-
    Hyperactive TLR7 sensing increases type I interferon production, a hallmark
    of the interferon-driven arm of lupus and the basis for the clinical response
    to JAK inhibition seen with the p.F507S variant.
  biological_processes:
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: INCREASED
  evidence:
  - reference: PMID:42170322
    reference_title: "TLR7 F507S gain-of-function mutation presenting with early-onset SLE and hypertriglyceridemia: Response to JAK inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TLR7 GOF mutations induce hyperactive signaling that escapes normal
      regulation, leading to increased type I interferon production and
      autoimmunity
    explanation: >-
      States that TLR7 GOF raises type I interferon production, driving
      autoimmunity.
  downstream:
  - target: Loss of B Cell Tolerance and Autoantibody Production
    causal_link_type: DIRECT
  - target: Hypertriglyceridemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

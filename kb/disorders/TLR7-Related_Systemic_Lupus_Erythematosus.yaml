name: TLR7-Related Systemic Lupus Erythematosus
creation_date: "2026-11-01T00:00:00Z"
category: Mendelian
description: >-
  TLR7-related systemic lupus erythematosus is a monogenic form of SLE caused by
  germline gain-of-function variants in the X-linked endosomal RNA sensor TLR7.
  The founding variant, p.Y264H, selectively increases TLR7 sensing of guanosine
  and the self-ligand 2',3'-cGMP; it was sufficient to cause lupus when introduced
  into mice. Enhanced TLR7 signaling, transmitted through MyD88, drives type I
  interferon production and the aberrant survival of B-cell-receptor-activated B
  cells, with cell-intrinsic accumulation of CD11c+ age-associated B cells and
  germinal-centre B cells, producing autoantibodies and severe, typically
  early-onset lupus. MyD88 deficiency rescues the autoimmunity in the mouse model,
  establishing the TLR7-MyD88 axis as the driver and as a therapeutic target; JAK
  inhibition has controlled disease in a patient with the p.F507S variant. It is
  distinct from the complement-deficiency monogenic lupus curated separately, and
  from polygenic SLE.
synonyms:
- systemic lupus erythematosus 17
- SLE17
- TLR7 gain-of-function disease
- TLR7 gain-of-function lupus
parents:
- hereditary disease
- systemic lupus erythematosus
inheritance:
- name: X-linked dominant inheritance
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    TLR7 is on the X chromosome; pathogenic gain-of-function variants act
    dominantly, with disease reported in both hemizygous males and heterozygous
    females. The founding p.Y264H variant arose de novo.
  evidence:
  - reference: PMID:35477763
    reference_title: "TLR7 gain-of-function genetic variation causes human lupus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo, previously undescribed missense TLR7Y264H variant
      in a child with severe lupus and additional variants in other patients with
      lupus.
    explanation: >-
      Establishes a de novo X-linked TLR7 variant causing lupus, with further
      variants in other patients.
pathophysiology:
- name: TLR7 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Germline missense variants in TLR7 (p.Y264H, and others such as p.F507S)
    confer a gain of function. TLR7 is an endosomal sensor of viral single-
    stranded RNA that binds guanosine; the variants selectively increase its
    sensing of guanosine and the self-ligand 2',3'-cGMP.

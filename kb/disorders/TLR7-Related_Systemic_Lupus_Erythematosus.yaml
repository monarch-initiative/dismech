name: TLR7-Related Systemic Lupus Erythematosus
creation_date: "2026-11-01T00:00:00Z"
category: Mendelian
description: >-
  TLR7-related systemic lupus erythematosus is a monogenic form of SLE caused by
  germline gain-of-function variants in the X-linked endosomal RNA sensor TLR7.
  The founding variant, p.Y264H, selectively increases TLR7 sensing of guanosine
  and the self-ligand 2',3'-cGMP; it was sufficient to cause lupus when introduced
  into mice. Enhanced TLR7 signaling, transmitted through MyD88, drives type I
  interferon production and the aberrant survival of B-cell-receptor-activated B
  cells, with cell-intrinsic accumulation of CD11c+ age-associated B cells and
  germinal-centre B cells, producing autoantibodies and severe, typically
  early-onset lupus. MyD88 deficiency rescues the autoimmunity in the mouse model,
  establishing the TLR7-MyD88 axis as the driver and as a therapeutic target; JAK
  inhibition has controlled disease in a patient with the p.F507S variant. It is
  distinct from the complement-deficiency monogenic lupus curated separately, and
  from polygenic SLE.
synonyms:
- systemic lupus erythematosus 17
- SLE17
- TLR7 gain-of-function disease
- TLR7 gain-of-function lupus
disease_term:
  preferred_term: systemic lupus erythematosus 17
  term:

inheritance:
- name: X-linked dominant inheritance
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    TLR7 is on the X chromosome and pathogenic gain-of-function variants act in
    an X-linked dominant pattern. Across the reported cohort there is a marked
    female predominance (10/11 patients), thought to reflect the severity of the
    phenotype in hemizygous males rather than the inheritance mode alone; the
    single reported male had severe early-onset disease. The founding p.Y264H
    variant arose de novo, whereas the p.F507S variant has been transmitted
    maternally. A somatic F506S case has also been reported, but mosaicism is not
    a general feature and HP:0001442 is not bound here.
  evidence:
  - reference: PMID:35477763
    reference_title: "TLR7 gain-of-function genetic variation causes human lupus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo, previously undescribed missense TLR7Y264H variant
      in a child with severe lupus and additional variants in other patients with
      lupus.
    explanation: >-
      Establishes a de novo X-linked TLR7 variant causing lupus, with further
      variants in other patients.
  - reference: PMID:42170322
    reference_title: "TLR7 F507S gain-of-function mutation presenting with early-onset SLE and hypertriglyceridemia: Response to JAK inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with marked female predominance (10/11 patients, 91%), likely reflecting
      the severity of the phenotype in hemizygous males rather than solely the
      X-linked dominant inheritance pattern
    explanation: >-
      Documents the marked female predominance and its interpretation across the
      reported cohort.

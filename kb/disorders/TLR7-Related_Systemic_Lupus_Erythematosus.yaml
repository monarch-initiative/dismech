notes: >-
  Named for the causal gene per the entry-naming convention; "systemic lupus
  erythematosus 17" (SLE17) and "TLR7 gain-of-function" are retained as synonyms.
  No module conformance is asserted: although a cGAS-STING type I interferon
  module exists, TLR7 signals through MyD88/IRF7 rather than cGAS-STING, so its
  interferon output reaches a shared effector by a different sensor pathway and
  conforming to that module would misattribute the upstream mechanism. No
  TLR/MyD88 or general type-I-interferon module currently exists as a clean
  conformance target, consistent with the complement- and sensor-specific
  monogenic lupus entries, which are likewise unconformed.

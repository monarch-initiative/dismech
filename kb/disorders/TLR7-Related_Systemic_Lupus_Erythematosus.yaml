  evidence:
  - reference: PMID:35477763
    reference_title: "TLR7 gain-of-function genetic variation causes human lupus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TLR7Y264H variant selectively increased sensing of guanosine and
      2',3'-cGMP
    explanation: >-
      Defines the molecular gain of function: increased sensing of guanosine and
      the 2',3'-cGMP self-ligand.
  downstream:
  - target: Enhanced TLR7 Signaling
    causal_link_type: DIRECT
- name: Enhanced TLR7 Signaling
  biological_scale: MOLECULAR
  description: >-
    The variants raise TLR7 signaling output through the adaptor MyD88. The
    centrality of this axis is shown by the rescue of autoimmunity on MyD88
    deficiency in the mouse model.
  genes:
  - preferred_term: TLR7
    term:
      id: hgnc:15631
      label: TLR7
  biological_processes:
  - preferred_term: toll-like receptor 7 signaling pathway
    term:
      id: GO:0034154
      label: toll-like receptor 7 signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:35477763
    reference_title: "TLR7 gain-of-function genetic variation causes human lupus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deficiency of MyD88 (an adaptor protein downstream of TLR7) rescued
      autoimmunity, aberrant B cell survival, and all cellular and serological

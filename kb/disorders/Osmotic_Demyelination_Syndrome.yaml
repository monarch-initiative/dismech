name: Osmotic Demyelination Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Complex
disease_term:
  preferred_term: osmotic demyelination syndrome
  term:
    id: MONDO:0006692
    label: central pontine myelinolysis
description: >-
  Non-inflammatory demyelination of the pons and extrapontine sites, most often following
  correction of chronic hyponatremia. The umbrella term covers central pontine
  myelinolysis and extrapontine myelinosis together.

  The mechanism turns on a single asymmetry. The brain survives chronic hyponatremia by
  exporting organic osmolytes from its cells, which is what prevents fatal oedema. But
  those osmolytes come back in more slowly than they left. Correct the sodium faster than
  the cells can re-accumulate them and the same adaptation that saved the brain now
  leaves it osmotically stressed - and the regions still most depleted are the ones that
  demyelinate.

  So the disease is produced by the treatment of another disorder, acting on a defence
  the patient had already mounted. That is what makes it iatrogenic in a specific sense:
  not a drug toxicity, but a rate error.

  This entry is careful about how strongly to state that, because the best modern evidence
  is more equivocal than the classical teaching. Rapid correction roughly triples the
  odds, and the absolute risk stays below one percent either way - and some patients
  develop the syndrome with no rapid correction at all.

pathophysiology:
- name: Osmolyte Depletion in Adaptation to Chronic Hyponatremia
  biological_scale: CELLULAR
  description: >-
    Given time, the brain adapts to hyponatremia by losing organic osmolytes from its
    cells, and this adaptation is what permits survival at extraordinarily low serum
    sodium. It is protective, not pathological: without it, acute hyponatremia causes
    severe and sometimes fatal cerebral oedema.

    Curating the protective step as its own node is deliberate. The vulnerability that
    follows is not a separate disease process bolted on - it is this adaptation, seen from
    the other side.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: cellular response to osmotic stress
    term:
      id: GO:0071470
      label: cellular response to osmotic stress
  downstream:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16843080
    reference_title: "Brain volume regulation in response to hypo-osmolality and its correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adaptation to severe hyponatremia is critically dependent on the loss of
      organic osmolytes from brain cells"
    explanation: Establishes osmolyte export as the mechanism of adaptation.
  - reference: PMID:16843080
    reference_title: "Brain volume regulation in response to hypo-osmolality and its correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An acute onset (usually in <24 hours) of hyponatremia causes severe, and
      sometimes fatal, cerebral edema. Given time, the brain adapts to hyponatremia,
      permitting survival despite extraordinarily low serum sodium concentrations"
    explanation: Records what the adaptation is protecting against, which is why it cannot
      simply be called harmful.
- name: Osmotic Stress from Asymmetric Osmolyte Reuptake
  biological_scale: CELLULAR
  description: >-
    The rate-limiting asymmetry, and the mechanistic core of this disease: reuptake of
    organic osmolytes after correction is slower than their loss during adaptation. A
    correction faster than the reuptake leaves cells hypertonic relative to the restored
    extracellular compartment, and the brain areas that remain most depleted are the ones
    that go on to be injured.

    Note what this predicts and what it does not. It predicts that the danger scales with
    the rate of correction rather than the depth of the hyponatremia, and that chronicity
    is required, since an unadapted brain has nothing to re-accumulate. It does not
    predict that rapid correction is necessary for the syndrome.
  biological_processes:
  - preferred_term: cellular response to osmotic stress
    term:
      id: GO:0071470
      label: cellular response to osmotic stress
    modifier: INCREASED
  downstream:
  - target: Astrocyte Death and Loss of Trophic Support for Oligodendrocytes
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16843080
    reference_title: "Brain volume regulation in response to hypo-osmolality and its correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reuptake of organic osmolytes after correction of hyponatremia is slower
      than the loss of organic osmolytes during the adaptation to hyponatremia"
    explanation: The asymmetry itself, which is the single sentence this entry's mechanism
      rests on.
  - reference: PMID:16843080
    reference_title: "Brain volume regulation in response to hypo-osmolality and its correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The adaptation that permits survival in patients with severe, chronic (>48
      hours' duration) hyponatremia also makes the brain vulnerable to injury (osmotic
      demyelination) if the electrolyte disturbance is corrected too rapidly"
    explanation: States the protection-becomes-vulnerability relationship directly, and
      gives the chronicity threshold that gates it.
- name: Astrocyte Death and Loss of Trophic Support for Oligodendrocytes
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The step that makes the rest of the chain make sense. Osmotic stress is not specific
    to oligodendrocytes, so an account that runs straight from osmotic stress to myelin
    loss leaves the cellular selectivity unexplained. In the rat model the astrocyte dies
    first: massive astrocyte death follows rapid correction and marks out the regions that
    will later demyelinate, before any myelin is lost. Oligodendrocyte injury follows from
    the loss of trophic communication across the disrupted astrocyte-oligodendrocyte
    network, together with the inflammation and microglial activation that astrocyte death
    triggers.

    The proximate cause of the astrocyte death has itself been characterised as a
    proteostasis failure - osmotic stress drives diffuse protein aggregation and
    ubiquitination, the unfolded protein response and ER stress, and apoptosis, occurring
    predominantly in astrocytes in exactly the regions that later demyelinate.

    Evidence tier matters here. The osmolyte asymmetry upstream and the epidemiology
    downstream are human; this cellular sequence is rat, and is curated as MODEL_ORGANISM
    throughout rather than presented as established human pathology.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: cellular response to osmotic stress
    term:
      id: GO:0071470
      label: cellular response to osmotic stress
    modifier: INCREASED
  locations:
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  evidence:
  - reference: PMID:21885671
    reference_title: "Astrocytes are an early target in osmotic demyelination syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found that massive astrocyte death occurred after rapid correction of
      hyponatremia, delineating the regions of future myelin loss
    explanation: >-
      The temporal and spatial priority of astrocyte death over myelin loss, which is the
      whole claim of this node.
  - reference: PMID:21885671
    reference_title: "Astrocytes are an early target in osmotic demyelination syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      rapid correction of hyponatremia triggers apoptosis in astrocytes followed by a loss
      of trophic communication between astrocytes and oligodendrocytes, secondary
      inflammation, microglial activation, and finally demyelination
    explanation: >-
      The full proposed sequence, which is the edge from this node to the one below it.
  - reference: PMID:28122966
    reference_title: "Osmotic Stress-Induced Defective Glial Proteostasis Contributes to Brain Demyelination after Hyponatremia Treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunofluorescence revealed that most of these processes occurred in astrocytes
      within regions previously shown to be demyelinated in later stages of this syndrome
    explanation: >-
      Independent confirmation of astrocyte-predominant injury in the regions that later
      demyelinate, by a different mechanism-level assay.
  - reference: PMID:28122966
    reference_title: "Osmotic Stress-Induced Defective Glial Proteostasis Contributes to Brain Demyelination after Hyponatremia Treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Abrupt correction of hyponatremia resulted in vigorous activation of both the
      unfolded protein response and ER stress accompanied by increased autophagic activity
      and apoptosis
    explanation: >-
      The proteostasis-failure account of why the astrocyte dies, which is the mechanism
      named in this node's description.
  downstream:
  - target: Oligodendrocyte Death and Demyelination
    causal_link_type: DIRECT
    description: >-
      Loss of the astrocyte removes trophic support for the oligodendrocyte and initiates
      the inflammatory and microglial response, and myelin loss follows.
- name: Oligodendrocyte Death and Demyelination
  biological_scale: TISSUE
  description: >-
    Apoptosis and loss of myelin under osmotic stress, distributed by cell content rather
    than by vascular territory: the regions richest in oligodendrocytes and myelin are the
    ones most frequently affected. That distribution is why the central pons is the
    signature site and why extrapontine involvement accompanies it rather than competing
    with it - the two are the same lesion in different places, which is why the umbrella
    term exists.

    The demyelination is non-inflammatory. Neurons and axons are relatively spared, which
    is the histological basis for the observation that survivors can recover substantially
    despite dramatic acute imaging.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  downstream:
  - target: Biphasic Neurological Deterioration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiology of ODS consists of cerebral apoptosis and loss of myelin
      due to osmotic stress. Accordingly, brain areas that are rich in oligodendrocytes and
      myelin tend to be the most frequently affected"
    explanation: Gives both the cellular mechanism and the rule that determines its
      anatomical distribution.
- name: Biphasic Neurological Deterioration
  biological_scale: ORGANISM
  description: >-
    The clinical course has two phases, and the shape of it is diagnostically important:
    the first reflects the underlying predisposing illness, the second the demyelination
    itself, with pontine dysfunction, impaired vigilance and movement disorders among
    other neurological abnormalities. The source is explicit that the list is not
    exhaustive, which matters because the phenotypes curated below are the recurrent ones
    rather than the full range.

    The gap between them is why the diagnosis is missed. A patient improves as their
    sodium is corrected, then deteriorates days later - and the deterioration is easily
    attributed to the original illness rather than to its treatment. The cited review
    reports ODS as often underdiagnosed for exactly this reason.
  evidence:
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ODS often have a biphasic course, the first phase reflecting
      the underlying predisposing illness and the second phase reflecting ODS itself, with
      pontine dysfunction, impaired vigilance, and movement disorders, among other
      neurological abnormalities"
    explanation: >-
      The biphasic pattern and what each phase represents, quoted to the end of the
      source's sentence including its "among other neurological abnormalities" qualifier.
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osmotic demyelination syndrome (ODS), which embraces central pontine
      myelinolysis (CPM) and extrapontine myelinosis (EPM), is often underdiagnosed in
      clinical practice, but can be fatal"
    explanation: Establishes the umbrella scope of the term and the underdiagnosis this
      entry attributes to the biphasic course.


name: Osmotic Demyelination Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Complex
disease_term:
  preferred_term: osmotic demyelination syndrome
  term:
    id: MONDO:0006692
    label: central pontine myelinolysis
description: >-
  Non-inflammatory demyelination of the pons and extrapontine sites, most often following
  correction of chronic hyponatremia. The umbrella term covers central pontine
  myelinolysis and extrapontine myelinosis together.

  The mechanism turns on a single asymmetry. The brain survives chronic hyponatremia by
  exporting organic osmolytes from its cells, which is what prevents fatal oedema. But
  those osmolytes come back in more slowly than they left. Correct the sodium faster than
  the cells can re-accumulate them and the same adaptation that saved the brain now
  leaves it osmotically stressed - and the regions still most depleted are the ones that
  demyelinate.

  So the disease is produced by the treatment of another disorder, acting on a defence
  the patient had already mounted. That is what makes it iatrogenic in a specific sense:
  not a drug toxicity, but a rate error.

  This entry is careful about how strongly to state that, because the best modern evidence
  is more equivocal than the classical teaching. Rapid correction roughly triples the
  odds, and the absolute risk stays below one percent either way - and some patients
  develop the syndrome with no rapid correction at all.

pathophysiology:
- name: Osmolyte Depletion in Adaptation to Chronic Hyponatremia
  biological_scale: CELLULAR
  description: >-
    Given time, the brain adapts to hyponatremia by losing organic osmolytes from its
    cells, and this adaptation is what permits survival at extraordinarily low serum
    sodium. It is protective, not pathological: without it, acute hyponatremia causes
    severe and sometimes fatal cerebral oedema.

    Curating the protective step as its own node is deliberate. The vulnerability that
    follows is not a separate disease process bolted on - it is this adaptation, seen from
    the other side.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: cellular response to osmotic stress
    term:
      id: GO:0071470
      label: cellular response to osmotic stress
  downstream:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16843080
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adaptation to severe hyponatremia is critically dependent on the loss of
      organic osmolytes from brain cells"
    explanation: Establishes osmolyte export as the mechanism of adaptation.
  - reference: PMID:16843080
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An acute onset (usually in <24 hours) of hyponatremia causes severe, and
      sometimes fatal, cerebral edema. Given time, the brain adapts to hyponatremia,
      permitting survival despite extraordinarily low serum sodium concentrations"
    explanation: Records what the adaptation is protecting against, which is why it cannot
      simply be called harmful.
- name: Osmotic Stress from Asymmetric Osmolyte Reuptake
  biological_scale: CELLULAR
  description: >-
    The rate-limiting asymmetry, and the mechanistic core of this disease: reuptake of
    organic osmolytes after correction is slower than their loss during adaptation. A
    correction faster than the reuptake leaves cells hypertonic relative to the restored
    extracellular compartment, and the brain areas that remain most depleted are the ones
    that go on to be injured.

    Note what this predicts and what it does not. It predicts that the danger scales with
    the rate of correction rather than the depth of the hyponatremia, and that chronicity
    is required, since an unadapted brain has nothing to re-accumulate. It does not
    predict that rapid correction is necessary for the syndrome.
  biological_processes:
  - preferred_term: cellular response to osmotic stress
    term:
      id: GO:0071470
      label: cellular response to osmotic stress
    modifier: INCREASED
  downstream:
  - target: Oligodendrocyte Death and Demyelination
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16843080
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reuptake of organic osmolytes after correction of hyponatremia is slower
      than the loss of organic osmolytes during the adaptation to hyponatremia"
    explanation: The asymmetry itself, which is the single sentence this entry's mechanism
      rests on.
  - reference: PMID:16843080
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The adaptation that permits survival in patients with severe, chronic (>48
      hours' duration) hyponatremia also makes the brain vulnerable to injury (osmotic
      demyelination) if the electrolyte disturbance is corrected too rapidly"
    explanation: States the protection-becomes-vulnerability relationship directly, and
      gives the chronicity threshold that gates it.
- name: Oligodendrocyte Death and Demyelination
  biological_scale: TISSUE
  description: >-
    Apoptosis and loss of myelin under osmotic stress, distributed by cell content rather
    than by vascular territory: the regions richest in oligodendrocytes and myelin are the
    ones most frequently affected. That distribution is why the central pons is the
    signature site and why extrapontine involvement accompanies it rather than competing
    with it - the two are the same lesion in different places, which is why the umbrella
    term exists.

    The demyelination is non-inflammatory. Neurons and axons are relatively spared, which
    is the histological basis for the observation that survivors can recover substantially
    despite dramatic acute imaging.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  downstream:
  - target: Biphasic Neurological Deterioration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31587708
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathophysiology of ODS consists of cerebral apoptosis and loss of myelin
      due to osmotic stress. Accordingly, brain areas that are rich in oligodendrocytes and
      myelin tend to be the most frequently affected"
    explanation: Gives both the cellular mechanism and the rule that determines its
      anatomical distribution.
- name: Biphasic Neurological Deterioration
  biological_scale: ORGANISM
  description: >-
    The clinical course has two phases, and the shape of it is diagnostically important:
    the first reflects the underlying predisposing illness, the second the demyelination
    itself, with pontine dysfunction, impaired vigilance and movement disorder.

    The gap between them is why the diagnosis is missed. A patient improves as their
    sodium is corrected, then deteriorates days later - and the deterioration is easily
    attributed to the original illness rather than to its treatment. The cited review
    reports ODS as often underdiagnosed for exactly this reason.
  evidence:
  - reference: PMID:31587708
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ODS often have a biphasic course, the first phase reflecting
      the underlying predisposing illness and the second phase reflecting ODS itself, with
      pontine dysfunction, impaired vigilance, and movement d"
    explanation: The biphasic pattern and what each phase represents. The quote stops where
      the cached abstract is truncated mid-word.
  - reference: PMID:31587708
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osmotic demyelination syndrome (ODS), which embraces central pontine
      myelinolysis (CPM) and extrapontine myelinosis (EPM), is often underdiagnosed in
      clinical practice, but can be fatal"
    explanation: Establishes the umbrella scope of the term and the underdiagnosis this
      entry attributes to the biphasic course.

phenotypes:
- category: Neurological
  name: Spastic Quadriparesis
  description: >-
    Spastic quadriparesis from destruction of descending corticospinal fibres crossing the
    central pons.
  phenotype_term:
    preferred_term: Spastic tetraplegia
    term:
      id: HP:0002510
      label: Spastic tetraplegia
  evidence:
  - reference: PMID:31587708
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the second phase reflecting ODS itself, with pontine dysfunction, impaired
      vigilance, and movement d"
    explanation: Supports pontine dysfunction as the second-phase syndrome; the specific
      motor pattern follows from the anatomy rather than from a counted series.
- category: Neurological
  name: Pseudobulbar Paralysis
  description: >-
    Dysarthria and dysphagia with preserved reflexive movements, from interruption of
    corticobulbar fibres at the same level.
  phenotype_term:
    preferred_term: Pseudobulbar paralysis
    term:
      id: HP:0007024
      label: Pseudobulbar paralysis
  evidence:
  - reference: PMID:31587708
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the second phase reflecting ODS itself, with pontine dysfunction, impaired
      vigilance, and movement d"
    explanation: Marked PARTIAL because the source names pontine dysfunction generically
      rather than pseudobulbar palsy specifically; the phenotype is retained because it is
      in the MONDO definition of this concept.
- category: Neurological
  name: Impaired Consciousness
  description: >-
    Impaired vigilance, ranging to coma, as part of the second phase.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  evidence:
  - reference: PMID:31587708
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with pontine dysfunction, impaired vigilance, and movement d"
    explanation: Names impaired vigilance as a second-phase feature.

prevalence:
- population: Adults hospitalised with hyponatremia
  measure_type: PERIOD_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 230.0
  notes: >-
    Overall incidence of 0.23% among 26,710 hospitalised hyponatremia patients pooled
    across 11 cohort studies - stratifying to 0.73% after rapid correction and 0.10%
    without it.

    This is the rate in an exposed hospital population, not a population prevalence, which
    is why the denominator is stated in the population field. The three figures are kept
    together because the absolute risk is the part most easily lost: even after rapid
    correction, fewer than one patient in a hundred develops the syndrome.
  evidence:
  - reference: PMID:39967825
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall incidence of ODS was 0.23%. The incidence of ODS in rapid and
      nonrapid sodium correction was 0.73% and 0.10%, respectively"
    explanation: All three rates in one sentence, which is how they should be read.
  - reference: PMID:39967825
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven cohort studies were included with 26,710 hospitalized hyponatremia
      patients"
    explanation: The denominator behind the pooled estimate.

environmental:
- name: Rapid correction of chronic hyponatremia
  description: >-
    Iatrogenic exposure: raising serum sodium faster than the brain can re-accumulate
    organic osmolytes. Across the pooled studies, overly rapid correction was defined
    variously as more than 8 to 12 mmol/L within 24 hours.

    The association is real and it is the reason correction-rate limits exist, but the
    entry states it at the strength the evidence supports and no higher. Rapid correction
    roughly triples the odds; it is neither necessary nor sufficient.
  influences_mechanisms:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure acts precisely on the asymmetry: it is the rate term the mechanism is
      sensitive to.
    evidence:
    - reference: PMID:39967825
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Meta-analysis demonstrated that a rapid rate of sodium correction was
        associated with a higher incidence of ODS (odds ratio 3.16, 95% CI, 1.54-6.49,
        I2 = 27%)"
      explanation: The effect estimate linking the exposure to the mechanism node, with its
        confidence interval and heterogeneity.
  evidence:
  - reference: PMID:39967825
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas some patients with hyponatremia developed ODS without rapid sodium
      level correction"
    explanation: Marked PARTIAL because this is the qualification, not the claim - the same
      meta-analysis that establishes the association also records that the exposure is not
      necessary.

treatments:
- name: Rate-Limited Sodium Correction
  description: >-
    Prevention rather than treatment, and the only intervention the mechanism actually
    predicts: correct chronic hyponatremia slowly enough that osmolyte reuptake keeps pace.
    The thresholds used to define overly rapid correction across the pooled studies ranged
    from 8 to 12 mmol/L in 24 hours, which is itself a signal that the limit is a
    convention fitted to a continuous risk rather than a biological cliff.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    treatment_effect: INHIBITS
    description: >-
      Holds the correction rate below the reuptake rate, so the asymmetry never becomes a
      gradient. It does not act on the demyelination once established.
  evidence:
  - reference: PMID:39967825
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overly rapid sodium correction was defined as >8 to 12 mmol/L within 24
      hours"
    explanation: The range of thresholds in use, quoted rather than a single limit, because
      the studies did not agree on one.
- name: Relowering of Serum Sodium After Overcorrection
  description: >-
    Rescue rather than prevention: if sodium has already been raised too fast, deliberately
    lowering it again - with desmopressin and hypotonic fluid - to bring the correction
    back inside the intended range.

    The evidence curated here is a single case report, and the entry says so rather than
    letting the mechanism's plausibility stand in for data. A 79-year-old woman became
    comatose during overcorrection, recovered consciousness dramatically after relowering,
    and did not develop ODS. The authors relate it to rat models. One patient who did not
    develop a syndrome with a background rate under one percent cannot establish that the
    intervention prevented it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    treatment_effect: INHIBITS
    description: >-
      Reverses the osmotic gradient before demyelination is established. Curated as acting
      on this node rather than on the demyelination node, because the proposed window
      closes once oligodendrocytes have died.
  evidence:
  - reference: PMID:30111674
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the serum sodium concentration was immediately relowered by the
      administration of desmopressin and 5% glucose solution, the patient's level of
      consciousness improved dramatically without osmotic demyelination syndrome (ODS)
      developing"
    explanation: Marked PARTIAL deliberately. This is a single case, and the outcome is the
      absence of a rare event - which one patient cannot demonstrate.

discussions:
- discussion_id: gap_ods_without_rapid_correction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes osmotic demyelination in patients whose sodium was never corrected rapidly?
  attaches_to:
  - pathophysiology#Osmotic Stress from Asymmetric Osmolyte Reuptake
  - environmental#Rapid correction of chronic hyponatremia
  rationale: >-
    The meta-analysis that establishes the correction-rate association also reports that
    some patients develop ODS without rapid correction, and the absolute incidence without
    rapid correction is not zero but 0.10%. The entry's central mechanism does not account
    for those cases.

    Several possibilities are consistent with what is curated here and are not
    distinguished by it. The osmolyte asymmetry may be steeper in some patients, so that a
    correction rate deemed safe by convention is fast for them - the review notes liver
    transplant recipients as a distinct risk group, and malnutrition and hypokalaemia are
    long-standing clinical associations. Alternatively the driver may not be sodium at all
    in those cases, since any osmotic shift acts on the same depleted cells. Or the
    thresholds themselves may be miscalibrated, which the 8-to-12 mmol/L spread across
    studies would be consistent with.

    This matters beyond mechanism. Rate limits are the entire preventive strategy, and a
    patient who develops ODS inside the limit is currently unexplained by the model that
    sets it.
  proposed_experiments:
  - experiment_id: osmolyte_kinetics_risk_stratification
    name: Direct measurement of brain osmolyte reuptake kinetics against correction rate
    description: >-
      Use magnetic resonance spectroscopy to track myo-inositol and other organic
      osmolytes during and after correction of chronic hyponatremia, in patients with and
      without the recognised risk factors, to test whether reuptake rate varies enough
      between individuals to explain cases arising inside the conventional limit.

differential_diagnoses:
- name: Hypoxic-ischaemic brainstem injury
  description: >-
    Shares the pontine localisation and the depressed consciousness. Distinguished by
    history, by vascular rather than myelin-content distribution, and by the absence of the
    biphasic course.
- name: Progression of the underlying predisposing illness
  description: >-
    The differential that actually causes the misdiagnosis. Because the second phase
    follows apparent improvement, deterioration is readily attributed to hepatic
    encephalopathy, sepsis or the original electrolyte disturbance rather than to its
    correction. This is the reason the entry curates the biphasic course as a node rather
    than as a clinical footnote.

notes: >-
  No GeneReviews chapter exists for this disease. A search for "myelinolysis
  GeneReviews[All Fields]" returns one hit, PMID:20301384 - which is "Charcot-Marie-Tooth
  Neuropathy Type 1", a different disease that merely mentions myelin, and which is
  additionally marked RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY. It is not a baseline
  for this entry and is not cited. Read rather than assumed, because an All Fields search
  returning a hit is not the same as a chapter existing.

  MONDO's label for this concept is "central pontine myelinolysis", the narrower and older
  name. The entry is named "Osmotic Demyelination Syndrome" because that is the umbrella
  the cited review uses, explicitly embracing both central pontine myelinolysis and
  extrapontine myelinosis - and the extrapontine form is the same lesion, not a different
  disease. The MONDO label is preserved verbatim in term.label as required, with the
  umbrella name in preferred_term.

  The snippets quoting the review's second-phase description end mid-word at "movement d".
  This is where the cached abstract itself is truncated, not a transcription error; the
  quote stops where the source stops.

  No frequency bands are assigned to phenotypes. The incidence figures in this entry are
  rates of the syndrome in an exposed hospital population, not frequencies of a phenotype
  among affected patients, and the two must not be conflated.

  Deep-research provenance: the claude_code report resolved 4/4 references with
  confabulation_rate 0.0 - but only four references, and the relevance pass assessed all
  four and scored none of them on topic. That is not an off-topic flag; the scores fell in
  the undecided band. A four-reference report is thin, and nothing from it is cited here:
  the reference set was assembled independently by direct PubMed search and every cited
  paper was read.


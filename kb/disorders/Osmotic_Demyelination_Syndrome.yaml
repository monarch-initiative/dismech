prevalence:
- population: Adults hospitalised with hyponatremia
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 230.0
  notes: >-
    Overall incidence of 0.23% among 26,710 hospitalised hyponatremia patients pooled
    across 11 cohort studies - stratifying to 0.73% after rapid correction and 0.10%
    without it.

    This is the rate in an exposed hospital population, not a population prevalence, which
    is why the denominator is stated in the population field. The three figures are kept
    together because the absolute risk is the part most easily lost: even after rapid
    correction, fewer than one patient in a hundred develops the syndrome.
  evidence:
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall incidence of ODS was 0.23%. The incidence of ODS in rapid and
      nonrapid sodium correction was 0.73% and 0.10%, respectively"
    explanation: All three rates in one sentence, which is how they should be read.
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven cohort studies were included with 26,710 hospitalized hyponatremia
      patients"
    explanation: The denominator behind the pooled estimate.

environmental:
- name: Rapid correction of chronic hyponatremia
  description: >-
    Iatrogenic exposure: raising serum sodium faster than the brain can re-accumulate
    organic osmolytes. Across the pooled studies, overly rapid correction was defined
    variously as more than 8 to 12 mmol/L within 24 hours.

    The association is real and it is the reason correction-rate limits exist, but the
    entry states it at the strength the evidence supports and no higher. Rapid correction
    roughly triples the odds; it is neither necessary nor sufficient.
  influences_mechanisms:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure acts precisely on the asymmetry: it is the rate term the mechanism is
      sensitive to.
    evidence:
    - reference: PMID:39967825
      reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Meta-analysis demonstrated that a rapid rate of sodium correction was
        associated with a higher incidence of ODS (odds ratio 3.16, 95% CI, 1.54-6.49,
        I2 = 27%)"
      explanation: The effect estimate linking the exposure to the mechanism node, with its
        confidence interval and heterogeneity.
  evidence:
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas some patients with hyponatremia developed ODS without rapid sodium
      level correction"
    explanation: Marked PARTIAL because this is the qualification, not the claim - the same
      meta-analysis that establishes the association also records that the exposure is not
      necessary.

treatments:
- name: Rate-Limited Sodium Correction
  description: >-
    Prevention rather than treatment, and the only intervention the mechanism actually
    predicts: correct chronic hyponatremia slowly enough that osmolyte reuptake keeps pace.
    The thresholds used to define overly rapid correction across the pooled studies ranged
    from 8 to 12 mmol/L in 24 hours, which is itself a signal that the limit is a
    convention fitted to a continuous risk rather than a biological cliff.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    treatment_effect: INHIBITS
    description: >-
      Holds the correction rate below the reuptake rate, so the asymmetry never becomes a
      gradient. It does not act on the demyelination once established.
  evidence:
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overly rapid sodium correction was defined as >8 to 12 mmol/L within 24
      hours"
    explanation: The range of thresholds in use, quoted rather than a single limit, because
      the studies did not agree on one.
- name: Relowering of Serum Sodium After Overcorrection
  description: >-
    Rescue rather than prevention: if sodium has already been raised too fast, deliberately
    lowering it again - with desmopressin and hypotonic fluid - to bring the correction
    back inside the intended range.

    The evidence curated here is a single case report, and the entry says so rather than
    letting the mechanism's plausibility stand in for data. A 79-year-old woman became
    comatose during overcorrection, recovered consciousness dramatically after relowering,
    and did not develop ODS. The authors relate it to rat models. One patient who did not
    develop a syndrome with a background rate under one percent cannot establish that the
    intervention prevented it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Osmotic Stress from Asymmetric Osmolyte Reuptake
    treatment_effect: INHIBITS
    description: >-
      Reverses the osmotic gradient before demyelination is established. Curated as acting
      on this node rather than on the demyelination node, because the proposed window
      closes once oligodendrocytes have died.
  evidence:
  - reference: PMID:30111674
    reference_title: "Early Relowering of Serum Sodium Concentration Overcomes Disturbances in Consciousness during Hyponatremia Overcorrection and Prevents Osmotic Demyelination Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the serum sodium concentration was immediately relowered by the
      administration of desmopressin and 5% glucose solution, the patient's level of
      consciousness improved dramatically without osmotic demyelination syndrome (ODS)
      developing"
    explanation: Marked PARTIAL deliberately. This is a single case, and the outcome is the
      absence of a rare event - which one patient cannot demonstrate.

diagnosis:
- name: Brain magnetic resonance imaging
  description: >-
    The diagnostic modality of choice, and the reason the prognosis of this syndrome has
    improved. MRI both establishes the diagnosis and detects oligosymptomatic cases that
    would otherwise be missed - which matters because the second phase of the biphasic
    course is so readily attributed to the predisposing illness instead.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic modality of choice is magnetic resonance imaging (MRI) of the brain,
      which can also be used to detect oligosymptomatic ODS
    explanation: >-
      Names the modality and its second use, detecting cases that do not declare
      themselves clinically.
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis has improved as a result of MRI-based diagnosis, but ODS can still be
      fatal (33% to 55% of patients either die or remain permanently dependent on nursing
      care)
    explanation: >-
      Ties the diagnostic modality to the outcome, and supplies the mortality figure
      curated in progression below.

progression:
- phase: Outcome after established osmotic demyelination
  notes: >-
    Between a third and a half of patients with established ODS either die or remain
    permanently dependent on nursing care. That figure is what makes the prevention
    framing of this entry substantive rather than stylistic. There is no established
    treatment for manifest ODS, the mainstay of management is prevention, and what
    prevention means in practice is the sodium correction-rate limit whose residual
    failure rate the knowledge gap below is about.
  evidence:
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prognosis has improved as a result of MRI-based diagnosis, but ODS can still be
      fatal (33% to 55% of patients either die or remain permanently dependent on nursing
      care)
    explanation: >-
      The mortality and permanent-dependency figure quoted here.
  - reference: PMID:31587708
    reference_title: "Central Pontine Myelinosis and Osmotic Demyelination Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current mainstay of management is prevention; treatment strategies for manifest
      ODS are still experimental
    explanation: >-
      Why the outcome figure above is not offset by treatment, which is what makes it the
      operative number for this disease.

discussions:
- discussion_id: gap_ods_without_rapid_correction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes osmotic demyelination in patients whose sodium was never corrected rapidly?
  attaches_to:
  - pathophysiology#Osmotic Stress from Asymmetric Osmolyte Reuptake
  - environmental#Rapid correction of chronic hyponatremia
  rationale: >-
    The meta-analysis that establishes the correction-rate association also reports that
    some patients develop ODS without rapid correction, and the absolute incidence without
    rapid correction is not zero but 0.10%. The entry's central mechanism does not account
    for those cases.

    Several possibilities are consistent with what is curated here and are not
    distinguished by it. The osmolyte asymmetry may be steeper in some patients, so that a
    correction rate deemed safe by convention is fast for them - the review notes liver
    transplant recipients as a distinct risk group, and malnutrition and hypokalaemia are
    long-standing clinical associations. Alternatively the driver may not be sodium at all
    in those cases, since any osmotic shift acts on the same depleted cells. Or the
    thresholds themselves may be miscalibrated, which the 8-to-12 mmol/L spread across
    studies would be consistent with.

    A fourth possibility is named in the same meta-analysis and is the most concrete of
    them: the correction rate that is monitored may not be the correction rate that
    matters. Chloride is corrected faster than sodium in practice, because intravenous
    crystalloids carry a chloride concentration high relative to normal serum chloride, so
    a patient whose sodium rise stayed inside the limit may still have sustained a rapid
    chloride rise. The source is explicit that this is a hypothesis rather than a
    finding - the relationship between chloride correction and ODS risk has not been
    tested - but it is testable with data hospitals already hold, which the other three
    possibilities are not.

    Host risk factors are the other thing the rate-limit model does not accommodate.
    Liver disease, alcohol use, malnutrition, hypokalemia and hypovolemia are each
    overrepresented among ODS cases, and the first possibility above - that osmolyte
    asymmetry is steeper in some patients than others - is the natural way to read them,
    though nothing curated here establishes that.

    This matters beyond mechanism. Rate limits are the entire preventive strategy, and a
    patient who develops ODS inside the limit is currently unexplained by the model that
    sets it - while a third to a half of those who do develop it die or become permanently
    dependent.
  evidence:
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In hyponatremia, chloride correction rate is often faster than sodium because of
      relatively higher chloride concentration in intravenous crystalloids than normal
      blood chloride and sodium concentration
    explanation: >-
      The mechanism behind the fourth possibility - the monitored analyte and the rapidly
      corrected one may differ.
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, the relationship between chloride correction and the risk of ODS remains
      a hypothesis and would be the subject of research in future studies
    explanation: >-
      The source's own statement of its epistemic status, quoted so the entry cannot be
      read as asserting the chloride association. PARTIAL for that reason.
  - reference: PMID:39967825
    reference_title: "Hyponatremia Correction and Osmotic Demyelination Syndrome Risk: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although treatment of hyponatremia is crucial to prevent brain osmotic stress,
      identifying potential risk factors (such as alcoholism, malnutrition, hypokalemia,
      and liver disease) and monitoring the consequences of treatment is important
    explanation: >-
      The host risk factors that sit outside the correction-rate model, and the source's
      view that they need identifying alongside it.
  proposed_experiments:
  - experiment_id: chloride_correction_rate_ods_association
    name: Retrospective association of chloride correction rate with ODS incidence
    description: >-
      Re-analyse existing hyponatremia cohorts using chloride correction rate alongside
      sodium correction rate as the exposure, to test whether cases arising inside the
      sodium limit are explained by a chloride rise outside it. The data required are
      already collected in routine care, which makes this the cheapest of the experiments
      proposed here and the one that would discriminate fastest.
  - experiment_id: osmolyte_kinetics_risk_stratification
    name: Direct measurement of brain osmolyte reuptake kinetics against correction rate
    description: >-
      Use magnetic resonance spectroscopy to track myo-inositol and other organic
      osmolytes during and after correction of chronic hyponatremia, in patients with and
      without the recognised risk factors, to test whether reuptake rate varies enough
      between individuals to explain cases arising inside the conventional limit.

differential_diagnoses:
- name: Hypoxic-ischaemic brainstem injury
  description: >-
    Shares the pontine localisation and the depressed consciousness. Distinguished by
    history, by vascular rather than myelin-content distribution, and by the absence of the
    biphasic course.
- name: Progression of the underlying predisposing illness
  description: >-
    The differential that actually causes the misdiagnosis. Because the second phase
    follows apparent improvement, deterioration is readily attributed to hepatic
    encephalopathy, sepsis or the original electrolyte disturbance rather than to its
    correction. This is the reason the entry curates the biphasic course as a node rather
    than as a clinical footnote.

notes: >-
  No GeneReviews chapter exists for this disease. A search for "myelinolysis
  GeneReviews[All Fields]" returns one hit, PMID:20301384 - which is "Charcot-Marie-Tooth
  Neuropathy Type 1", a different disease that merely mentions myelin, and which is
  additionally marked RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY. It is not a baseline
  for this entry and is not cited. Read rather than assumed, because an All Fields search
  returning a hit is not the same as a chapter existing.

  MONDO's label for this concept is "central pontine myelinolysis", the narrower and older
  name. The entry is named "Osmotic Demyelination Syndrome" because that is the umbrella
  the cited review uses, explicitly embracing both central pontine myelinolysis and
  extrapontine myelinosis - and the extrapontine form is the same lesion, not a different
  disease. The MONDO label is preserved verbatim in term.label as required, with the
  umbrella name in preferred_term.

  A correction. An earlier version of the notes claimed that the snippets quoting the
  review's second-phase description ended mid-word at "movement d" because the cached
  abstract itself was truncated there. That was false, and the cache file added by this
  same change disproves it - the sentence continues "...and movement disorders, among
  other neurological abnormalities." The four snippets validated only because a mid-word
  fragment is still a substring. They are extended and the notes paragraph is deleted.

  The astrocyte arm is rat, and is labelled as such. The osmolyte asymmetry upstream of it
  and the epidemiology downstream are human; the sequence in which astrocyte death precedes
  and spatially predicts myelin loss comes from a rat model of osmotic demyelination and
  is curated MODEL_ORGANISM throughout. It is included because without it the entry runs
  from a non-cell-type-specific osmotic stress straight to a cell-type-specific myelin
  loss, which leaves the selectivity of the lesion unexplained.

  No frequency bands are assigned to phenotypes. The incidence figures in this entry are
  rates of the syndrome in an exposed hospital population, not frequencies of a phenotype
  among affected patients, and the two must not be conflated.

  Deep-research provenance: the claude_code report resolved 4/4 references with
  confabulation_rate 0.0 - but only four references, and the relevance pass assessed all
  four and scored none of them on topic. That is not an off-topic flag; the scores fell in
  the undecided band. A four-reference report is thin, and nothing from it is cited here:
  the reference set was assembled independently by direct PubMed search and every cited
  paper was read.


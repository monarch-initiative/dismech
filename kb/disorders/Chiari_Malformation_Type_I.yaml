progression:
- phase: Onset
  notes: >-
    Symptom onset averages the mid-twenties, with a marked female preponderance
    and a substantial minority attributing onset to trauma. The trauma
    association is reported, not explained.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 275 female and 89 male patients. The age of onset was 24.9+/-15.8 years (mean +/- standard deviation), and 89 patients (24%) cited trauma as the precipitating event.
    explanation: >-
      Gives sex distribution, onset age, and the frequency of a reported
      precipitating trauma.
treatments:
- name: Posterior fossa decompression
  description: >-
    Suboccipital craniectomy with upper cervical laminectomy to enlarge the
    posterior fossa outlet and restore CSF flow across the foramen magnum. It
    treats the mechanical obstruction; it does not address the underlying bone
    hypoplasia. Whether to open and graft the dura is a separate decision with
    its own evidence, modelled as the duraplasty treatment below rather than
    folded in here.
  treatment_term:
    preferred_term: suboccipital craniectomy with upper cervical laminectomy
    term:
      id: NCIT:C51791
      label: Craniectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Systolic Tonsillar Piston Effect
    description: >-
      Decompression abolishes the pulsatile downward thrust of the tonsils, and
      the syrinx resolves over the following months.
    evidence:
    - reference: PMID:8271018
      reference_title: Pathophysiology of syringomyelia associated with Chiari I malformation of the cerebellar tonsils. Implications for diagnosis and treatment.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immediately after surgery, the pulsatile downward thrust of the tonsils and constriction of the spinal cord and syrinx disappeared. Syringomyelia resolved within 1 to 6 months after surgery in all patients.
      explanation: >-
        Shows the operation removes the specific mechanism it targets, and that
        the syrinx follows.
  evidence:
  - reference: PMID:16823310
    reference_title: Relationship of cine phase-contrast magnetic resonance imaging with outcome after decompression for Chiari I malformations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal preoperative hindbrain CSF flow was an independent risk factor for treatment failure after decompression for Chiari I malformation regardless of the degree of tonsillar ectopia.
    explanation: >-
      Defines who the operation does not help, which is as much a part of the
      treatment claim as who it does.
- name: Posterior fossa decompression with duraplasty
  description: >-
    Opening the dura and expanding it with a graft, in addition to the bony
    decompression. This is the live clinical question in CM-I surgery rather than
    a refinement: adding duraplasty buys better clinical improvement and fewer
    recurrences in patients with a syrinx, and costs CSF leak, aseptic meningitis
    and pseudomeningocele. In patients without a syrinx the meta-analysis finds
    no clinical gain, so the bone-only operation is preferred there.
  treatment_term:
    preferred_term: posterior fossa decompression with duraplasty
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Craniospinal CSF Flow Obstruction
    description: >-
      Enlarging the dural envelope restores the subarachnoid space at the
      foramen magnum that the bony decompression alone may leave constricted.
  evidence:
  - reference: PMID:29138073
    reference_title: "Comparison of Results Between Posterior Fossa Decompression with and without Duraplasty for the Surgical Treatment of Chiari Malformation Type I: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with PFD, PFDD led to a mean greater increase in operative time than did PFD [standardized mean difference, -2.35; 95% confidence interval [CI], (-2.70 to -1.99)], a higher likelihood of clinical improvement in patients with syringomyelia (relative risk [RR], 0.70; 95% CI, 0.49-0.98), no increased RR of clinical improvement in patients without syringomyelia, no increased RR of imaging improvement, but an increased RR of cerebrospinal fluid-related complications (RR, 0.29; 95% CI, 0.15-0.58), cerebrospinal fluid leak, aseptic meningitis, pseudomeningocele, and a decreased likelihood of recurrence rate.
    explanation: >-
      The pooled comparison across 13 studies and 3,481 patients, giving both
      sides of the trade-off in one sentence.
  - reference: PMID:29138073
    reference_title: "Comparison of Results Between Posterior Fossa Decompression with and without Duraplasty for the Surgical Treatment of Chiari Malformation Type I: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PFDD can be an optimal surgical strategy because of its higher clinical improvement and lower recurrence rate in the patients with syringomyelia.
    explanation: >-
      States the indication the meta-analysis draws, which is syrinx-dependent
      rather than universal.
  notes: >-
    Curated as a separate treatment rather than as a qualifier on the bony
    decompression because the two have different indications and different
    complication profiles, and the choice between them is unsettled. The
    meta-analysis is pooled retrospective and prospective observational data, not
    randomised; its own conclusion calls for randomised studies.
diagnosis:
- name: MRI of the craniocervical junction
  description: >-
    The diagnostic test. Note which finding carries the diagnosis: retrocerebellar
    CSF obliteration was present in all 364 patients of the defining cohort while
    tonsillar herniation of at least 5 mm was present in only 332, so the
    millimetre threshold is the weaker criterion of the two.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the craniocervical junction
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Obliteration of the retrocerebellar CSF spaces; tonsillar herniation, by
    convention at least 3-5 mm below the foramen magnum; varying degrees of
    cranial base dysplasia.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most consistent magnetic resonance imaging findings were obliteration of the retrocerebellar cerebrospinal fluid spaces (364 patients), tonsillar herniation of at least 5 mm (332 patients), and varying degrees of cranial base dysplasia.
    explanation: >-
      Gives the three consistent findings with their patient counts, which is
      what establishes the CSF-space criterion as more sensitive than the
      herniation threshold.
- name: Cine phase-contrast MRI of hindbrain CSF flow
  description: >-
    Not a diagnostic test for CM-I but a selection test for surgery. Abnormal
    hindbrain flow was present in 81% of operated patients; the 19% with normal
    flow were the ones who did worse after decompression, so the study is cited
    here for who should not be operated on rather than for who has the disease.
  diagnosis_term:
    preferred_term: cine phase-contrast magnetic resonance imaging of CSF flow
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Biphasic CSF flow absent or decreased at the aqueduct, fourth ventricle and
    its outlets, the foramen magnum, or around the cervical cord.
  evidence:
  - reference: PMID:16823310
    reference_title: Relationship of cine phase-contrast magnetic resonance imaging with outcome after decompression for Chiari I malformations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cine phase-contrast magnetic resonance imaging may be a valuable tool in identifying patients who are less likely to respond to surgical decompression for Chiari I malformation.
    explanation: >-
      The authors' own statement of what the test is for, which is patient
      selection rather than diagnosis.
animal_models:
- name: Cavalier King Charles Spaniel Chiari-like malformation
  species: Dog
  category: Naturally occurring breed-associated disease
  description: >-
    A naturally occurring, highly prevalent breed disease in which a shallow
    caudal cranial fossa — the homologue of the human posterior cranial fossa —
    produces cerebellar herniation at the foramen magnum and syringomyelia. It is
    the only spontaneous animal counterpart of CM-I, and the volumetric work in
    it is the closest thing to a controlled test of the overcrowding hypothesis
    that exists.
  publication: PMID:20536691
  modeled_mechanisms:
  - target: Posterior Fossa Overcrowding
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the volume mismatch between the caudal fossa and its contents,
      and links the degree of mismatch to syrinx formation.
    limitations: >-
      The mismatch arises differently. This entry's central claim for human CM-I
      is a small fossa containing a normally sized hindbrain; in the CKCS the
      fossa volume does not differ between affected and unaffected dogs, and what
      differs is the parenchyma inside it, with the breed carrying a relatively
      larger cerebellum than other small breeds. So the dog models the
      consequence of overcrowding while inverting which side of the mismatch
      causes it, and canine skull morphology is a selectively bred brachycephalic
      trait with no human counterpart.
    evidence:
    - reference: PMID:20536691
      reference_title: Relationship of brain parenchyma within the caudal cranial fossa and ventricle size to syringomyelia in cavalier King Charles spaniels.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A more marked overcrowding of the CCF is associated with SM, which may explain the high incidence of SM in CKCS with CM.
      explanation: >-
        States the overcrowding-to-syrinx association that makes this model
        informative for the node.
    - reference: PMID:20536691
      reference_title: Relationship of brain parenchyma within the caudal cranial fossa and ventricle size to syringomyelia in cavalier King Charles spaniels.
      supports: REFUTE
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CKCS with SM had significantly higher CCFP (P=0.0001) and V (P=0.0002) to those without but no significant difference in CCF (P=0.925).
      explanation: >-
        Refutes carrying the human claim across unchanged: caudal fossa volume
        itself did not differ (P=0.925), so in the dog the small container is not
        what separates affected from unaffected animals.
    - reference: PMID:22506005
      reference_title: Increase in cerebellar volume in Cavalier King Charles Spaniels with Chiari-like malformation and its role in the development of syringomyelia.
      supports: REFUTE
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results show that the CKCS has a relatively larger cerebellum than small breed dogs and Labradors and provide evidence that increased cerebellar volume in CKCS is associated with crowding of cerebellum in the caudal part of the CCF.
      explanation: >-
        Identifies the other side of the mismatch in the dog — a relatively
        larger cerebellum — which is the opposite of the normal hindbrain volume
        this entry records for human CM-I.
  - target: Syringomyelia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Syringomyelia develops spontaneously and its transverse width correlates
      with the degree of caudal fossa overcrowding and with ventricle size.
    limitations: >-
      Correlational rather than interventional: no decompression arm is reported
      in these studies, so the dog data support the association between
      overcrowding and syrinx without testing reversibility the way the human
      intraoperative ultrasound series does.
    evidence:
    - reference: PMID:20536691
      reference_title: Relationship of brain parenchyma within the caudal cranial fossa and ventricle size to syringomyelia in cavalier King Charles spaniels.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A more marked overcrowding of the CCF is associated with SM, which may explain the high incidence of SM in CKCS with CM.
      explanation: >-
        States the association between overcrowding and syringomyelia in the
        breed, which is the claim this link makes.
  notes: >-
    The veterinary literature calls this Chiari-LIKE malformation, and the
    hedging is deliberate on their part; it is kept here. Recorded as an animal
    model rather than as a separate disease entry.
discussions:
- discussion_id: normal_flow_symptomatic_patients
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Craniospinal CSF Flow Obstruction
  prompt: >-
    What drives symptoms in the ~19% of symptomatic CM-I patients who have normal
    hindbrain CSF flow before surgery?
  rationale: >-
    CSF flow obstruction is the load-bearing mechanism in every account of this
    disorder, yet one patient in five who is symptomatic enough to be operated on
    does not have it — and those patients are 4.8-fold more likely to have their
    symptoms return afterwards, regardless of how far the tonsils descend or
    whether a syrinx is present. That combination says the obstruction model is
    incomplete rather than merely imprecise, and it has an immediate clinical
    consequence: it identifies a group for whom decompression is the wrong
    operation. No alternative mechanism has been established for them.
- discussion_id: acquired_chiari_causal_direction
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Occipital Somite Underdevelopment
  prompt: >-
    In acquired tonsillar descent — after CSF shunting, in intracranial
    hypotension, or with a posterior fossa mass — does the same downstream
    mechanism operate, and is the entity the same disease?
  rationale: >-
    This entry's initiating node is a developmental bone defect, which by
    construction cannot apply to acquired tonsillar descent. The downstream
    obstruction and piston mechanisms plausibly do apply, since they depend only
    on tonsils occupying the foramen magnum. But the sources cited here studied
    the primary form, so extending them is an inference; and if acquired descent
    behaves the same way downstream, the question of whether it is a separate
    disease entry or an alternative upstream branch of this one is unresolved.
    Recorded rather than decided.
- discussion_id: trauma_as_precipitant
  kind: KNOWLEDGE_GAP
  attaches_to:
  - progression#Onset
  prompt: >-
    Does trauma precipitate symptom onset in CM-I, or is it recall bias in a
    disorder whose onset is otherwise unmarked?
  rationale: >-
    Nearly a quarter of patients in the defining cohort named a traumatic event
    as the precipitant. That is a large fraction and it is entirely
    self-reported, in a condition where a structural abnormality has usually been
    present since development and symptom onset has no other obvious trigger to
    attach to. No mechanism has been proposed that would make a single injury
    convert an asymptomatic small posterior fossa into a symptomatic one, and no
    controlled comparison has tested the association. It matters medicolegally as
    well as mechanistically.

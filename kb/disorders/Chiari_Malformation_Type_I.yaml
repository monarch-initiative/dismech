    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical syndrome of CMI was found to consist of the following: 1) headaches, 2) pseudotumor-like episodes, 3) a Meniere's disease-like syndrome, 4) lower cranial nerve signs, and 5) spinal cord disturbances in the absence of syringomyelia.
    explanation: >-
      Enumerates the clinical syndrome, with headache first and with spinal cord
      disturbance explicitly noted to occur without a syrinx.

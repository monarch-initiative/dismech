name: Chiari Malformation Type I
category: Congenital
creation_date: '2026-09-08T09:00:00Z'
synonyms:
- CM-I
- CMI
- Chiari I malformation
- Chiari type I malformation
- tonsillar ectopia
description: >-
  Chiari malformation type I is caudal descent of the cerebellar tonsils through
  the foramen magnum, conventionally at least 3-5 mm. Despite the name it is not
  primarily a hindbrain malformation: volumetric studies show a posterior cranial
  fossa of reduced total volume containing a hindbrain of entirely normal volume,
  so the defect is in the container rather than its contents. The occipital
  enchondral parts — exocciput and supraocciput — are specifically small, which
  places the lesion in the occipital somite and hence in the paraxial mesoderm.

  The consequences follow mechanically rather than biochemically. Tonsils
  impacted at the foramen magnum obliterate the retrocerebellar CSF spaces and
  obstruct the pulsatile movement of CSF across the craniocervical junction. The
  brain expands with each systolic filling and normally vents that pressure wave
  into the upper spinal canal; when that route is blocked the tonsils themselves
  move downward with each systole, acting as a piston on the partially isolated
  spinal CSF. That piston action, demonstrated by intraoperative ultrasound and
  abolished immediately by decompression, is the best-evidenced mechanism for
  syringomyelia in this setting — and it works without any communication between
  the fourth ventricle and the syrinx, which is what distinguishes it from
  Gardner's older hydrodynamic theory.

  Curated as a disease rather than as a phenotype because it is the convergence
  point for a real mechanism. Roughly thirty existing dismech entries — the
  craniosynostoses, skeletal dysplasias, and connective tissue disorders — carry
  Chiari malformation as a phenotype, and they converge here: a posterior fossa
  too small for a normal hindbrain, however it came to be small. Syringomyelia
  (65%) and scoliosis (42%) are the associations that dominate morbidity.
disease_term:
  preferred_term: Chiari malformation type I
  term:
    id: MONDO:0007316
    label: Chiari malformation type I
parents:
- Congenital Malformation of the Nervous System
- Craniocervical Junction Disorder
notes: >-
  Scope: this entry covers the classical, developmental (primary) form. Acquired
  or secondary tonsillar descent — from CSF shunting, intracranial hypotension,
  or a posterior fossa mass — reaches the same downstream mechanism from a
  different upstream cause, and is recorded as a knowledge gap rather than
  asserted, because the causal direction there is genuinely contested.

  Deliberately not bound to CL terms for the developmental cell types. The
  deep-research report proposed osteoblast as CL:0000142 (osteoblast is
  CL:0000062) and gave CL:0000138 for both chondrocyte and ependymal cell, which
  cannot both be right; the entry names the tissue and somite instead of
  guessing a cell type the sources do not identify.

  No `genetic:` section, deliberately. The research surfaced linkage to 1q43-44
  and 12q23-24.11 with OLFML2A, SLC4A9 and COL4A1 named as candidates, but no
  gene is established as causal and the report's own HGNC identifiers are wrong
  (it gives COL4A1 as HGNC:2218; the correct identifier is hgnc:2202). A
  susceptibility locus without a validated gene is not something the Genetic
  class can carry honestly — it has no locus slot — so the familial aggregation
  is recorded in `inheritance:` and the gene claims are left out rather than
  curated at a confidence the sources do not support.

  No GeneReviews chapter exists for Chiari malformation type I. Confirmed
  against PubMed: `"GeneReviews"[Book] AND Chiari[Title]` returns nothing, which
  is consistent with CM-I being a polygenic trait with no established causal
  gene.
inheritance:
- name: Familial aggregation consistent with Mendelian transmission
  description: >-
    A minority of cases aggregate in families. Pedigrees in the largest
    prospective cohort were compatible with both dominant and recessive
    patterns, so no single mode of inheritance is asserted here; most cases are
    sporadic.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Forty-three patients (12%) reported positive family histories of CMI or syringomyelia. Pedigrees for 21 families showed patterns consistent with autosomal dominant or recessive inheritance.
    explanation: >-
      Establishes familial aggregation and that the pedigree patterns do not
      settle on one mode, which is why no inheritance_term is bound.
pathophysiology:
- name: Occipital Somite Underdevelopment
  biological_scale: TISSUE
  description: >-
    Underdevelopment of the occipital enchondral bone — specifically the
    exocciput and supraocciput — arising from the occipital somite of the
    paraxial mesoderm. This is the initiating lesion in the primary form, and it
    is a bone defect, not a brain defect.
  biological_processes:
  - preferred_term: endochondral ossification of the occipital bone
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  downstream:
  - target: Posterior Fossa Overcrowding
    causal_link_type: DIRECT
    description: >-
      A smaller bony compartment holding a normally sized hindbrain raises the
      ratio of neural volume to cranial volume.
    evidence:
    - reference: PMID:8988080
      reference_title: "Pathogenesis of Chiari malformation: a morphometric study of the posterior cranial fossa."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Compared to the control group, in the Chiari group there was a significantly larger volume ratio, the two occipital enchondral parts (the exocciput and supraocciput) were significantly smaller, and the tentorium was pronouncedly steeper.
      explanation: >-
        Directly measures both the small occipital enchondral parts and the
        raised neural-to-cranial volume ratio in the same patients.
  evidence:
  - reference: PMID:8988080
    reference_title: "Pathogenesis of Chiari malformation: a morphometric study of the posterior cranial fossa."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results suggest that in adult-type Chiari malformation an underdeveloped occipital bone, possibly due to underdevelopment of the occipital somite originating from the paraxial mesoderm, induces overcrowding in the posterior cranial fossa, which contains the normally developed hindbrain.
    explanation: >-
      States the somite-origin hypothesis. Graded INDIRECT because the somite
      step is the authors' inference from adult morphometry — the word
      "possibly" is theirs — and no developmental observation supports it
      directly.
- name: Posterior Fossa Overcrowding
  biological_scale: TISSUE
  description: >-
    A posterior cranial fossa of reduced total volume, with a 40% reduction in
    its CSF volume but a normal brain volume. The overcrowding is therefore
    relative, and the important measurement is not tonsillar position but the
    volume the CSF has lost.
  locations:
  - preferred_term: posterior cranial fossa
    term:
      id: UBERON:0008788
      label: posterior cranial fossa
  downstream:
  - target: Tonsillar Herniation and Foramen Magnum Impaction
    causal_link_type: DIRECT
    description: >-
      With no room in the fossa, the cerebellar tonsils are displaced caudally
      through the foramen magnum.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Volumetric calculations for the posterior cranial fossa revealed a significant reduction of total volume (mean, 13.4 ml) and a 40% reduction of cerebrospinal fluid volume (mean, 10.8 ml), with normal brain volume.
    explanation: >-
      The measurement that establishes this as a container problem: fossa and
      CSF volumes are reduced while brain volume is normal.
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support accumulating evidence that CMI is a disorder of the para-axial mesoderm that is characterized by underdevelopment of the posterior cranial fossa and overcrowding of the normally developed hindbrain.
    explanation: >-
      The cohort's own summary of the mechanism, from the largest prospective
      series.
- name: Tonsillar Herniation and Foramen Magnum Impaction
  biological_scale: TISSUE
  description: >-
    The cerebellar tonsils descend through the foramen magnum and plug the
    subarachnoid space posteriorly. Obliteration of the retrocerebellar CSF
    spaces was the single most consistent imaging finding — present in all 364
    patients of the defining cohort, more consistent than 5 mm of tonsillar
    descent itself, which is why a herniation of less than 5 mm does not exclude
    the diagnosis.
  locations:
  - preferred_term: subarachnoid space at the foramen magnum
    term:
      id: UBERON:0000315
      label: subarachnoid space
  downstream:
  - target: Craniospinal CSF Flow Obstruction
    causal_link_type: DIRECT
    description: >-
      The impacted tonsils occlude the subarachnoid space, blocking the route by
      which CSF normally moves between cranial and spinal compartments.
    evidence:
    - reference: PMID:8271018
      reference_title: Pathophysiology of syringomyelia associated with Chiari I malformation of the cerebellar tonsils. Implications for diagnosis and treatment.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In all patients the cerebellar tonsils occluded the subarachnoid space at the level of the foramen magnum.
      explanation: >-
        Direct observation of the occlusion in every patient studied with
        dynamic MRI and intraoperative ultrasound.
  - target: Direct Neural Compression at the Cervicomedullary Junction
    causal_link_type: DIRECT
    description: >-
      Tissue impacted in the osseous foramen compresses the cervicomedullary
      junction and lower cranial nerve rootlets.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most consistent magnetic resonance imaging findings were obliteration of the retrocerebellar cerebrospinal fluid spaces (364 patients), tonsillar herniation of at least 5 mm (332 patients), and varying degrees of cranial base dysplasia.
    explanation: >-
      Ranks the imaging findings by consistency, showing CSF-space obliteration
      is more reliable than the 5 mm threshold.
- name: Craniospinal CSF Flow Obstruction
  biological_scale: ORGANISM
  description: >-
    Loss of the pulsatile movement of CSF across the foramen magnum. Cine
    phase-contrast MRI finds abnormal hindbrain CSF flow in 81% of surgical
    patients — 43% complete obstruction, 38% reduced flow. This is the node that
    most of the clinical syndrome hangs from.
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    modifier: DECREASED
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
  downstream:
  - target: Systolic Tonsillar Piston Effect
    causal_link_type: DIRECT
    description: >-
      With the venting route blocked, each systolic pressure wave drives the
      tonsils downward instead of moving CSF into the spinal canal.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Craniospinal pressure gradients that cannot equalise across the foramen
      magnum produce the characteristic Valsalva-provoked occipital headache.
  evidence:
  - reference: PMID:16823310
    reference_title: Relationship of cine phase-contrast magnetic resonance imaging with outcome after decompression for Chiari I malformations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal hindbrain CSF flow was observed in 81% of patients (43% complete obstruction, 38% reduced flow). Normal CSF flow was observed in 19% of patients.
    explanation: >-
      Quantifies how often flow obstruction is actually present in a
      radiologically defined surgical cohort.
  - reference: PMID:16823310
    reference_title: Relationship of cine phase-contrast magnetic resonance imaging with outcome after decompression for Chiari I malformations.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariate analysis, patients with normal preoperative hindbrain CSF flow were 4.8-fold more likely to experience symptom recurrence after surgery (relative risk, 4.85; 95% confidence interval, 1.88-12.5; P < 0.001) regardless of degree of tonsillar ectopia or presence of syringomyelia.
    explanation: >-
      Refutes flow obstruction as a sufficient account of the whole syndrome.
      One patient in five has normal flow, and those patients do worse after an
      operation aimed at restoring it — so something else drives their symptoms.
- name: Systolic Tonsillar Piston Effect
  biological_scale: ORGANISM
  description: >-
    Each systolic filling of the brain imparts a pressure wave to intracranial
    CSF that is normally accommodated by sudden movement into the upper spinal
    canal. Obstructed, the tonsils instead thrust downward with every systole,
    acting as a piston on the partially isolated spinal CSF. The effect was seen
    directly on intraoperative ultrasound and disappeared immediately on
    decompression — which is the strongest causal evidence in this entry, since
    the mechanism and its reversal were observed in the same patients.
  downstream:
  - target: Syringomyelia
    causal_link_type: DIRECT
    description: >-
      The systolic pressure wave acting on the cord surface drives syrinx
      formation and progression, with no ventricle-to-syrinx communication
      required.
    evidence:
    - reference: PMID:8271018
      reference_title: Pathophysiology of syringomyelia associated with Chiari I malformation of the cerebellar tonsils. Implications for diagnosis and treatment.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No patient had evidence of a patent communication between the fourth ventricle and the syrinx on anatomical MR images, dynamic MR images, or intraoperative ultrasound studies.
      explanation: >-
        The negative finding that excludes Gardner's communicating hydrodynamic
        theory as the mechanism in these patients.
  evidence:
  - reference: PMID:8271018
    reference_title: Pathophysiology of syringomyelia associated with Chiari I malformation of the cerebellar tonsils. Implications for diagnosis and treatment.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intraoperative ultrasound studies demonstrated abrupt downward movement of the cerebellar tonsils during systole that was synchronous with sudden constriction of the spinal cord and syrinx.
    explanation: >-
      Direct intraoperative observation of the piston action and its synchronous
      effect on the cord.
  - reference: PMID:8271018
    reference_title: Pathophysiology of syringomyelia associated with Chiari I malformation of the cerebellar tonsils. Implications for diagnosis and treatment.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immediately after surgery, the pulsatile downward thrust of the tonsils and constriction of the spinal cord and syrinx disappeared. Syringomyelia resolved within 1 to 6 months after surgery in all patients.
    explanation: >-
      Reversal of the mechanism and of the syrinx by decompression, in the same
      patients in whom it was demonstrated. This is a rescue experiment in
      humans.
- name: Syringomyelia
  biological_scale: TISSUE
  description: >-
    A fluid cavity within the spinal cord, present in 65% of symptomatic
    patients and extending in the studied series from cervical to lower thoracic
    segments. It is the principal source of spinal cord morbidity and the main
    link to scoliosis.
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  downstream:
  - target: Scoliosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Syrinx-related injury to anterior horn cells and long tracts produces
      asymmetric paraspinal weakness and secondary scoliosis.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common associated problems included syringomyelia (65%), scoliosis (42%), and basilar invagination (12%).
    explanation: Gives the frequency of the three principal associations.
  - reference: PMID:8271018
    reference_title: Pathophysiology of syringomyelia associated with Chiari I malformation of the cerebellar tonsils. Implications for diagnosis and treatment.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Syringomyelia extended from the cervical to the lower thoracic segment of the spinal cord.
    explanation: Describes the anatomical extent of the cavity.
- name: Direct Neural Compression at the Cervicomedullary Junction
  biological_scale: TISSUE
  description: >-
    Mechanical compression of the cervicomedullary junction, long tracts and
    lower cranial nerve rootlets. The defining cohort separates this from the
    CSF-disturbance mechanisms explicitly, and it is what produces the lower
    cranial nerve signs and the spinal cord disturbances that occur even without
    a syrinx.
  evidence:
  - reference: PMID:10232534
    reference_title: "Chiari I malformation redefined: clinical and radiographic findings for 364 symptomatic patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations of CMI seem to be related to cerebrospinal fluid disturbances (which are responsible for headaches, pseudotumor-like episodes, endolymphatic hydrops, syringomyelia, and hydrocephalus) and direct compression of nervous tissue.
    explanation: >-
      The source itself divides the syndrome into a CSF-disturbance arm and a
      direct-compression arm, which is how this entry's pathograph branches.
- name: Craniocervical Hypermobility and Cranial Settling
  biological_scale: TISSUE
  description: >-
    A second, non-developmental route to the same craniocervical mechanics, seen
    in the 12.7% of CM-I patients who meet criteria for Ehlers-Danlos syndrome or
    a related heritable connective tissue disorder. Here the fossa is not the
    problem: occipitoatlantal and atlantoaxial hypermobility permits cranial
    settling in the upright position, which is reducible by traction or by lying
    down. It adds lower brainstem symptoms and retro-odontoid pannus to the
    picture, and it changes what surgery should address, which is why it is
    modelled as its own upstream node rather than as a comorbidity.
  downstream:
  - target: Direct Neural Compression at the Cervicomedullary Junction
    causal_link_type: DIRECT
    description: >-
      Cranial settling and posterior gliding of the occipital condyles narrow the
      craniocervical junction dynamically, compressing the lower brainstem.
    evidence:
    - reference: PMID:18074684
      reference_title: "Syndrome of occipitoatlantoaxial hypermobility, cranial settling, and chiari malformation type I in patients with hereditary disorders of connective tissue."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Morphometric evidence in this cohort-cranial settling, posterior gliding of the occipital condyles, and reduction of the clivus-axis angle, clivus-atlas angle, and atlas-axis angle in the upright position-suggests that hypermobility of the occipitoatlantal and atlantoaxial joints contributes to retroodontoid pannus formation and symptoms referable to basilar impression.
      explanation: >-
        States the proposed mechanism and the morphometric basis for it.
  evidence:
  - reference: PMID:18074684
    reference_title: "Syndrome of occipitoatlantoaxial hypermobility, cranial settling, and chiari malformation type I in patients with hereditary disorders of connective tissue."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic criteria for Ehlers-Danlos syndrome and related HDCT were met in 357 (12.7%) of the 2813 cases.
    explanation: >-
      Quantifies how common this alternative route is, in the largest CM-I cohort
      reported.
  - reference: PMID:18074684
    reference_title: "Syndrome of occipitoatlantoaxial hypermobility, cranial settling, and chiari malformation type I in patients with hereditary disorders of connective tissue."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic features of HDCT/CM-I were distinguished from those of CM-I by clinical stigmata of connective tissue disease, a greater female preponderance (8:1 compared with 3:1, p < 0.001), and a greater incidence of lower brainstem symptoms (0.41 compared with 0.11, p < 0.001), retroodontoid pannus formation (0.71 compared with 0.11, p < 0.001), and hypoplasia of the oropharynx (0.44 compared with 0.02, p < 0.001).
    explanation: >-
      Distinguishes this group clinically, which is what makes it a separate
      management question rather than an incidental association.
phenotypes:
- category: Neurologic
  name: Headache
  description: >-
    Occipital headache, classically provoked by cough or Valsalva. Headaches
    head the list of the five clinical syndromes described in the defining
    cohort.
  phenotype_term:
    preferred_term: Cough-provoked occipital headache
    term:
      id: HP:0002315
      label: Headache
  reports_on:

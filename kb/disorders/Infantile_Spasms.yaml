- name: Epileptic spasms
  category: Clinical
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >
    Epileptic spasms are the defining seizure semiology of IESS: sudden, brief,
    symmetric flexor, extensor, or mixed flexor-extensor contractions of the
    neck, trunk, and extremities, characteristically occurring in clusters. In
    the 2022 ILAE nosology, epileptic spasms are the mandatory seizure type,
    whereas hypsarrhythmia is supportive but not required.
  phenotype_term:
    preferred_term: Epileptic spasm
    term:
      id: HP:0011097
      label: Epileptic spasm
  evidence:
  - reference: PMID:38540325
    reference_title: "Genetic Advancements in Infantile Epileptic Spasms Syndrome and Opportunities for Precision Medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Infantile epileptic spasms syndrome (IESS) is a devastating developmental epileptic encephalopathy (DEE) consisting of epileptic spasms, as well as one or both of developmental regression or stagnation and hypsarrhythmia on EEG.
    explanation: Defines epileptic spasms as the mandatory seizure type of IESS, with developmental regression/stagnation and hypsarrhythmia as the associated (not both-required) features.
- name: Hypsarrhythmia
  category: Diagnostic
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >
    Hypsarrhythmia or a modified/similar epileptiform EEG pattern is the
    characteristic interictal EEG abnormality supporting IESS diagnosis.
  phenotype_term:
    preferred_term: Hypsarrhythmia
    term:

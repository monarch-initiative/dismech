  evidence:
  - reference: PMID:37736852
    reference_title: "Treatment modalities for infantile spasms: current considerations and evolving strategies in clinical practice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Infantile spasms, newly classified as infantile epileptic spasm syndrome (IESS), occur in children under 2 years of age and present as an occur as brief, symmetrical, contractions of the musculature of the neck, trunk, and extremities.
    explanation: Review describes the age-dependent epileptic spasm phenotype produced by the abnormal infantile network state.
  - reference: PMID:27838190
    reference_title: "Safety and effectiveness of hormonal treatment versus hormonal treatment with vigabatrin for infantile spasms (ICISS): a randomised, multicentre, open-label trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      enrolled infants who had a clinical diagnosis of infantile spasms and a hypsarrhythmic (or similar) EEG no more than 7 days before enrolment.
    explanation: Trial inclusion criteria show that infantile spasms and hypsarrhythmic or similar EEG activity form the electroclinical syndrome.
  - reference: PMID:23312951
    reference_title: "Basic mechanisms of catastrophic epilepsy--overview from animal models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      two genetic mouse models of interneuronopathies with infantile spasms due to loss of function of the aristaless X-linked homeobox-related gene (ARX).
    explanation: ARX loss-of-function mouse interneuronopathy models link GABAergic interneuron dysfunction to the generation of infantile spasms, supporting the excitation-inhibition imbalance arm.
  downstream:
  - target: Infantile spasms
    causal_link_type: DIRECT
    description: Epileptic network discharges produce clusters of infantile spasms.
  - target: Hypsarrhythmia
    causal_link_type: DIRECT
    description: The same epileptic encephalopathy produces the hypsarrhythmic EEG pattern.
  - target: Developmental and epileptic encephalopathy burden
    causal_link_type: DIRECT
    description: Epileptic encephalopathy contributes to developmental impairment alongside the underlying etiology.
- name: Developmental and epileptic encephalopathy burden
  description: >
    IESS is part of the developmental and epileptic encephalopathy spectrum:
    developmental impairment reflects both the underlying etiology and the
    epileptic encephalopathy.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35503712
    reference_title: "ILAE classification and definition of epilepsy syndromes with onset in neonates and infants: Position statement by the ILAE Task Force on Nosology and Definitions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      developmental and epileptic encephalopathies, diseases where there is developmental impairment related to both the underlying etiology independent of epileptiform activity and the epileptic encephalopathy.
    explanation: ILAE statement defines developmental and epileptic encephalopathies as disorders where etiology and epileptiform activity both contribute to developmental impairment.
  - reference: PMID:39029407
    reference_title: "Epidemiology and outcome of infantile spasms in Denmark in 1996-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At latest follow-up severe neurodevelopmental outcome was seen in 44.2 % and 76.4 % still had epilepsy.
    explanation: Danish cohort quantifies long-term neurodevelopmental and epilepsy burden after IESS.
  - reference: PMID:30236380
    reference_title: "Safety and effectiveness of hormonal therapies for infantile spasms with vigabatrin (ICISS): 18-month developmental and epilepsy outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Increasing lead-time to treatment was associated with lower VABS scores
    explanation: ICISS 18-month follow-up shows that longer lead-time to effective treatment predicts worse developmental (Vineland Adaptive Behaviour Scales) outcome, consistent with the developmental-and-epileptic-encephalopathy model in which the epileptic activity itself drives developmental harm.
  - reference: PMID:30236380
    reference_title: "Safety and effectiveness of hormonal therapies for infantile spasms with vigabatrin (ICISS): 18-month developmental and epilepsy outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Initial control of spasms between days 14 and 42 of treatment was associated with higher mean VABS scores at 18 months
    explanation: Early cessation of spasms is associated with better developmental outcome, supporting the prognostic value of rapid, effective treatment.
  downstream:
  - target: Developmental regression

  evidence:
  - reference: PMID:33892851
    reference_title: "Tuberous Sclerosis Complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      the identification of the responsible genes and gene products forming the mechanistic target of rapamycin complex, previously termed the mammalian target of rapamycin, not only has expanded our understanding of tuberous sclerosis pathophysiology, but has also inspired the search for targeted interventions.
    explanation: Establishes the mTORC1 pathway as the molecular basis of TSC pathophysiology and the rationale for targeted (mTOR-inhibitor) intervention.
  - reference: PMID:33892851
    reference_title: "Tuberous Sclerosis Complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      the pediatric neurologist is often responsible for making the initial diagnosis when the affected individual presents with infantile spasms or another early-onset epilepsy syndrome.
    explanation: Links TSC (the prototypical mTORopathy) directly to infantile-spasms presentation.
  - reference: PMID:38540325
    reference_title: "Genetic Advancements in Infantile Epileptic Spasms Syndrome and Opportunities for Precision Medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      some of the most commonly reported genetic aetiologies include trisomy 21 and pathogenic variants in genes such as TSC1, TSC2, CDKL5, ARX, KCNQ2, STXBP1 and SCN2A.
    explanation: Confirms TSC1/TSC2 (and ARX) among the most commonly reported genetic etiologies of IESS.
  downstream:
  - target: Developing brain epileptic network hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - mTORC1 hyperactivation produces cortical tubers, focal cortical dysplasia, and dysmorphic neurons that form the epileptogenic substrate.
    description: mTORC1 hyperactivation and the resulting dysplastic cortex generate the hyperexcitable epileptic network.
- name: Developing brain epileptic network hyperexcitability
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >
    The IESS phenotype reflects abnormal synchronized activity in immature
    cortical-subcortical networks, producing epileptic spasms and the
    hypsarrhythmic EEG pattern. A recurrent mechanistic theme is a shift toward
    net excitation in the developing cortex through impaired GABAergic
    interneuron development/function (interneuronopathy, exemplified by ARX
    loss of function), consistent with the conserved epilepsy
    excitation-inhibition imbalance pattern and with the efficacy of the
    GABA-augmenting drug vigabatrin.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: cortical GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron

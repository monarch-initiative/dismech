- name: mTOR pathway hyperactivation
  description: >
    In tuberous sclerosis complex and related mTORopathies, loss of function of
    TSC1/TSC2 (or activating variants in the wider PI3K-AKT-mTOR pathway, and
    brain-restricted somatic mTOR-pathway variants) disinhibits mTORC1 signaling.
    This drives abnormal cortical cytoarchitecture (cortical tubers, focal
    cortical dysplasia, dysmorphic neurons) that seeds the epileptogenic network,
    and provides the mechanistic rationale for mTOR-inhibitor precision therapy.
  genes:
  - preferred_term: TSC1
    term:
      id: hgnc:12362
      label: TSC1
  - preferred_term: TSC2
    term:
      id: hgnc:12363
      label: TSC2
  biological_processes:
  - preferred_term: positive regulation of TOR signaling
    term:

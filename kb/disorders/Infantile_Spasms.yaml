treatments:
- name: Hormonal therapy with ACTH or high-dose prednisolone
  description: >
    ACTH, tetracosactide, or high-dose prednisolone are first-line hormonal
    therapies for IESS, aiming for rapid cessation of spasms and EEG
    improvement. A leading mechanistic hypothesis for hormonal efficacy is the
    stress/corticotropin-releasing-hormone (CRH) model, in which CRH acts as an
    endogenous convulsant in the immature brain and ACTH suppresses CRH through
    negative feedback; this remains a hypothesis supported chiefly by animal
    models.

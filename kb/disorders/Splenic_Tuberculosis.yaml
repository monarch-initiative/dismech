histopathology:
- name: Caseating epithelioid granulomas of the splenic pulp
  description: >-
    Confluent miliary tubercles and epithelioid granulomas with Langhans giant
    cells, variable central caseous necrosis and a lymphocyte cuff in the red
    and white pulp; hilar lymph nodes can show the same granulomas.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The hallmark of TB caused by MTB is epitheloid granulomas composed of
      macrophages aggregates, epitheloid cells and langhans giant cells with
      variable degree of central caseous necrosis involving both the red and
      white pulps.
    explanation: >-
      The systematic review's description of splenectomy histology.
- name: Coagulative necrosis and few detectable bacilli
  description: >-
    Splenic specimens show coagulative necrosis more often than pulmonary
    ones, and acid-fast stains and molecular tests are less often positive,
    partly because splenectomy usually follows prolonged treatment.
  evidence:
  - reference: PMID:40858649
    reference_title: "Higher proportion of coagulative necrosis and PD-L1(+) immune cells in splenic tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the STB group, both molecular detection methods showed a positive
      rate of 28.6% versus 14.3% for acid-fast staining.
    explanation: >-
      Low yield of molecular tests and acid-fast staining in seven splenic
      specimens.
  - reference: PMID:40858649
    reference_title: "Higher proportion of coagulative necrosis and PD-L1(+) immune cells in splenic tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This significant difference may be attributed to splenectomies in STB
      are usually performed after prolonged anti-TB treatment when MTB load in
      the spleen has been either eradicated or diminished below detection
      thresholds.
    explanation: >-
      The authors' explanation for the low microbiological yield.
progression:
- phase: Seeding of the spleen
  notes: >-
    Bacilli reach the spleen through the bloodstream or by contiguous spread
    from abdominal foci; the primary focus may not be apparent at
    presentation.
  evidence:
  - reference: PMID:20479918
    reference_title: "Tuberculosis of the spleen as a cause of Fever of unknown origin and splenomegaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Extrasplenic involvement is usually seen in splenic tuberculosis,
      although it may not be apparent at presentation.
    explanation: >-
      Extrasplenic foci may not be evident when the patient presents.
- phase: Active granulomatous and suppurative disease
  notes: >-
    Weeks of fever, abdominal pain and constitutional symptoms with focal
    splenic lesions or abscesses; diagnosis is often delayed and complications
    such as rupture, hypersplenism and fistula follow delayed or missed
    diagnosis.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These complications include splenic rupture, hypersplenism, portal
      hypertension with or without gastrointestinal bleed, splenic pseudocyst,
      splenic vein infarction, perforation of abscess cavity into peritoneum
      or rupture into adjacent organs with resulting fistula formation into
      gastrointestinal tract, pleural space, and lung parenchyma.
    explanation: >-
      The systematic review's list of complications of delayed diagnosis.
- phase: Treatment response and resolution
  notes: >-
    Fever and neutropenia can settle within a week of treatment, and lesions
    regress on ultrasound follow-up; a paradoxical worsening can occur weeks
    into treatment.
  evidence:
  - reference: PMID:22361772
    reference_title: "Isolated tubercular splenic abscess: can we defer splenectomy? Our single experience with anti-tuberculous therapy alone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      With anti-tuberculous therapy, the lesions regressed significantly in
      size.
    explanation: >-
      Lesion regression with treatment.
  - reference: PMID:17642503
    reference_title: "Radiological manifestations of splenic tuberculosis: a 23-patient case series from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ultrasonography of the spleen is an affordable, non-invasive imaging
      modality, which can be helpful in diagnosis of splenic TB and assessment
      of therapeutic response.
    explanation: >-
      Ultrasound is used to follow the response.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Splenic tuberculosis is rare and generally responds to treatment, and the
    prognosis in HIV-infected patients was good in a case-control study.
    Mortality is reported only from a splenic abscess series (25% of eight
    tuberculous cases), and rupture with hemoperitoneum is a life-threatening
    complication.
  evidence:
  - reference: PMID:19712861
    reference_title: "Splenic abscess: a review of 22 cases in a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The overall mortality rate was 18.2% and it was 25% in patients with
      tuberculosis and 14.28% in patients with other causes of splenic
      abscesses (p=0.6).
    explanation: >-
      Mortality of tuberculous splenic abscess in a 22-patient series.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In a study by Llenas-Garcia et al., the mortality was 25% in patients
      with splenic TB, and no other study has reported mortality.
    explanation: >-
      The systematic review found no other mortality figure.
  - reference: PMID:9195093
    reference_title: "Clinical significance of splenic tuberculosis in patients infected with human immunodeficiency virus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Splenic tuberculosis occurs in more-severely immunocompromised
      HIV-infected patients, the prognosis is generally good, the clinical
      response to therapy is usually favorable, and splenectomy is rarely
      necessary.
    explanation: >-
      Good prognosis in HIV-infected patients on treatment.
diagnosis:
- name: Abdominal Ultrasound
  description: >-
    Ultrasound shows single or multiple hypoechoic lesions, abscesses,
    calcifications or splenomegaly alone, guides aspiration and drainage, and
    is used to follow the response. In people with HIV, splenic lesions were
    seen in 21% and ultrasound-detected microabscesses were due to
    tuberculosis in 88%.
  diagnosis_term:
    preferred_term: abdominal ultrasonography
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:17642503
    reference_title: "Radiological manifestations of splenic tuberculosis: a 23-patient case series from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The ultrasound and CT findings included, in order of most common: single
      or multiple hypoechoic focal lesions, splenic abscess, calcifications (on
      CT), and isolated splenomegaly.
    explanation: >-
      Imaging findings in 23 patients.
  - reference: PMID:31456550
    reference_title: "Detection of splenic microabscesses with ultrasound as a marker for extrapulmonary tuberculosis in patients with HIV: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      TB diagnosed by culture, biopsy, smear, or molecular methods was found
      to be the cause of 88.3% (95% CI 72.3 - 97.9) of splenic microabscesses
      seen on ultrasound in patients with HIV.
    explanation: >-
      Pooled proportion of splenic microabscesses due to tuberculosis in five
      studies of 774 HIV-infected patients.
  - reference: PMID:31456550
    reference_title: "Detection of splenic microabscesses with ultrasound as a marker for extrapulmonary tuberculosis in patients with HIV: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Splenic lesions were seen with ultrasound in 21.0% of patients with HIV
      (95% confidence interval (CI) 10.6 - 33.8).
    explanation: >-
      Pooled frequency of splenic lesions on ultrasound in HIV.
- name: Contrast-Enhanced CT of the Abdomen
  description: >-
    CT is the imaging study of choice and also shows other abdominal foci. It
    shows solitary or multiple hypodense lesions; it found lesions in five of
    six patients whose ultrasound showed only splenomegaly. No CT feature is
    pathognomonic, and the differential of hypodense splenic lesions includes
    pyogenic and fungal abscess, lymphoma, metastases, sarcoidosis,
    infarction and vascular tumours.
  diagnosis_term:
    preferred_term: contrast-enhanced computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      contrast-enhanced CT (CECT) is the imaging study of choice to diagnose
      splenic TB.
    explanation: >-
      The systematic review's recommendation.
  - reference: PMID:17642503
    reference_title: "Radiological manifestations of splenic tuberculosis: a 23-patient case series from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Five of the six patients with findings of isolated splenomegaly on
      ultrasound were found to have lesions on CT.
    explanation: >-
      CT found lesions missed by ultrasound.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The important differential diagnosis of such hypodense lesions on CECT
      includes pyogenic abscess; fungal infections; neoplastic, parasitic,
      congenital cystic lesions; infarction, hamartoma, hemangioma, vascular
      tumors; sickle cell disease; metstatic deposits, most commonly from
      gastric, colonic and ovarian malignancies; sarcoidosis; lymphomas; and
      splenic trauma.
    explanation: >-
      The sourced differential diagnosis of hypodense splenic lesions.
  - reference: PMID:1775839
    reference_title: "Splenic tuberculosis in patients with AIDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In all of the patients, abdominal sonography and abdominal computed
      tomography revealed multiple hypoechoic and hypodense lesions,
      respectively.
    explanation: >-
      Hypoechoic and hypodense lesions in three patients with AIDS.
- name: Contrast-Enhanced Ultrasound
  description: >-
    On contrast-enhanced ultrasound, tuberculous lesions show rim-like or
    septation-like enhancement, heterogeneous enhancement or none, reflecting
    poor blood supply. Lymphoma lesions usually enhance homogeneously, which
    helps tell the two apart.
  diagnosis_term:
    preferred_term: contrast-enhanced ultrasound
    term:
      id: NCIT:C148281
      label: Contrast-Enhanced Ultrasound
  evidence:
  - reference: PMID:34526476
    reference_title: "Contrast-Enhanced Ultrasound Imaging Features of Focal Splenic Tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The rim- or septation-like enhancement may be helpful for diagnosing
      splenic TB.
    explanation: >-
      Conclusion from 22 histologically confirmed cases.
  - reference: PMID:35785214
    reference_title: "The Role of Contrast-Enhanced Ultrasound in Differentiating Splenic Tuberculosis From Splenic Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Splenic tuberculosis is characterized by a lack of blood supply, mostly
      heterogeneous enhancement, and non-enhancement noted in CEUS.
    explanation: >-
      Enhancement pattern in 30 cases of splenic tuberculosis.
  - reference: PMID:35785214
    reference_title: "The Role of Contrast-Enhanced Ultrasound in Differentiating Splenic Tuberculosis From Splenic Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Splenic lymphoma lesions are often characterized by a rich blood supply
      and homogeneous enhancement on CEUS.
    explanation: >-
      The contrasting pattern in 19 cases of splenic lymphoma.
- name: Image-Guided Fine-Needle Aspiration of the Spleen
  description: >-
    Ultrasound-, CT- or endoscopic ultrasound-guided aspiration of a nodule or
    abscess yields granulomas, acid-fast bacilli or a positive nucleic acid
    test. Reported sensitivity is up to 88%, but the yield varies. It is
    contraindicated when there is a risk of splenic rupture.
  diagnosis_term:
    preferred_term: image-guided splenic fine-needle aspiration
    term:
      id: NCIT:C15361
      label: Fine-Needle Aspiration
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The sensitivity and specificity of FNAC is up to 88% and 100%,
      respectively.
    explanation: >-
      Reported accuracy of fine-needle aspiration cytology.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      FNAC is contraindicated when there is a risk of splenic rupture.
    explanation: >-
      The contraindication to aspiration.
  - reference: PMID:28410696
    reference_title: "Isolated splenic tuberculosis diagnosed by endoscopic ultrasound-guided fine needle aspiration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Endoscopic ultrasound-guided fine needle aspiration of splenic lesion
      revealed granulomatous inflammation.
    explanation: >-
      Endoscopic ultrasound-guided aspiration gave the diagnosis.
  - reference: PMID:8762940
    reference_title: "[Splenic tuberculosis. Apropos of 12 cases]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The CT-guided splenic puncture is now performed routinely and remains
      the ideal diagnostic approach.
    explanation: >-
      CT-guided puncture as the authors' diagnostic approach in a ten-patient
      series.
- name: Image-Guided Core Needle Biopsy of the Spleen
  description: >-
    Core biopsy has a higher diagnostic yield than aspiration and separates
    granulomas from lymphoma, but it carries higher risks of bleeding and
    rupture.
  diagnosis_term:
    preferred_term: splenic core needle biopsy
    term:
      id: NCIT:C15680
      label: Core Biopsy
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CNB is associated with high rates of complications such as bleeding and
      a high risk of splenic rupture.
    explanation: >-
      The caveat on core biopsy.
  - reference: PMID:28438221
    reference_title: "Isolated splenic tuberculosis with subsequent paradoxical deterioration: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Diagnosis of isolated splenic tuberculosis was made on core biopsy of
      the spleen.
    explanation: >-
      Core biopsy gave the diagnosis after negative smear and GeneXpert tests.
- name: Acid-Fast Staining of Splenic Material
  description: >-
    Ziehl-Neelsen staining of aspirate or tissue can show acid-fast bacilli,
    but it is often negative, particularly in specimens taken after
    treatment.
  diagnosis_term:
    preferred_term: Ziehl-Neelsen acid-fast staining
    term:
      id: NCIT:C85831
      label: Ziehl Neelsen Acid Fast Staining Method
  evidence:
  - reference: PMID:22361772
    reference_title: "Isolated tubercular splenic abscess: can we defer splenectomy? Our single experience with anti-tuberculous therapy alone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fine needle aspiration of splenic lesion revealed acid-fast bacilli on
      Ziehl-Neelsen stain.
    explanation: >-
      A positive stain on splenic aspirate.
  - reference: PMID:40858649
    reference_title: "Higher proportion of coagulative necrosis and PD-L1(+) immune cells in splenic tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the STB group, both molecular detection methods showed a positive
      rate of 28.6% versus 14.3% for acid-fast staining.
    explanation: >-
      Low staining yield in splenectomy specimens.
- name: Nucleic Acid Amplification Testing of Splenic Material
  description: >-
    Xpert MTB/RIF or PCR on aspirate, pus or tissue confirms M. tuberculosis
    complex and rifampicin susceptibility.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay or PCR
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:32072799
    reference_title: "Tuberculous splenic abscess in the immunocompetent host: a report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ultrasound guided splenic aspirate revealed pus that was positive for
      Mycobacterium tuberculosis in XpertMTB/Rif assay confirming the
      diagnosis of tuberculosis.
    explanation: >-
      Xpert MTB/RIF on splenic pus gave the diagnosis.
  - reference: PMID:42205655
    reference_title: "Splenic Tuberculosis in a Patient With Crohn's Disease Receiving Anti-tumor Necrosis Factor-α (TNF-α) Therapy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Image-guided splenic biopsy confirmed Mycobacterium tuberculosis with
      rifampicin susceptibility and caseating granulomas.
    explanation: >-
      Molecular testing of a splenic biopsy confirmed the organism and its
      rifampicin susceptibility.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some studies have suggested that the sensitivity of PCR is enhanced on
      formalin fixed, paraffin embedded tissues as compared to acid-fast
      staining for MTB.
    explanation: >-
      PCR on fixed tissue is more sensitive than staining.
- name: Mycobacterial Culture of Splenic Material
  description: >-
    Culture of pus or aspirate can isolate the organism and identify M. bovis;
    blood cultures are usually negative in tuberculous, unlike pyogenic,
    splenic abscess.
  diagnosis_term:
    preferred_term: mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Analysis of pus culture may help in diagnosing TB.
    explanation: >-
      The review's statement on pus culture.
  - reference: PMID:9927792
    reference_title: "[Incidence and clinical features of splenic abscesses, with special reference to tuberculous etiology in a general hospital]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Blood cultures were positive in 80% of non tuberculous splenic abscess.
    explanation: >-
      Blood cultures separate pyogenic from tuberculous abscess.
- name: Splenectomy or Laparoscopic Splenic Biopsy Histopathology
  description: >-
    When imaging and needle sampling fail, or lymphoma or a vascular tumour
    cannot be excluded, laparoscopic biopsy or splenectomy gives the
    histological diagnosis. In much of the case literature the diagnosis was
    made only on the splenectomy specimen.
  diagnosis_term:
    preferred_term: histopathology of splenectomy or splenic biopsy specimen
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:30426945
    reference_title: "Splenic tuberculosis: a comprehensive review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The definitive diagnosis of this is essentially formulated on the
      post-splenectomy specimen.
    explanation: >-
      A literature review's statement on how the diagnosis is usually made.
  - reference: PMID:20479918
    reference_title: "Tuberculosis of the spleen as a cause of Fever of unknown origin and splenomegaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Out of 339 splenectomies performed between January 1989 and December
      2008 for indications other than trauma, histopathologic analysis of the
      spleen revealed tuberculosis in 8 patients.
    explanation: >-
      Splenectomy histology diagnosed tuberculosis in 8 of 339 non-trauma
      splenectomies.
  - reference: PMID:27250119
    reference_title: "Solitary splenic tuberculosis: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      If biopsy fails, laparoscopic splenectomy has been used in the diagnosis
      of splenic tuberculosis and has proved to be a minimally invasive
      approach.
    explanation: >-
      A case report's discussion of diagnostic laparoscopic splenectomy.
- name: Criteria for Isolated Splenic Tuberculosis
  description: >-
    A systematic review defines isolated (solitary) splenic tuberculosis as
    nonspecific constitutional symptoms with no history of pulmonary or other
    extrapulmonary tuberculosis, no clinical or imaging evidence of tuberculosis
    in another organ, and splenomegaly with a splenic lesion on imaging, or a
    large solitary splenic abscess with splenomegaly and persistent severe
    neutropenia in a patient from a high-prevalence region.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      No evidence of TB in any other organ on imaging studies
    explanation: >-
      One of the review's criteria for isolated splenic tuberculosis.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Splenomegaly associated with splenic lesion on imaging study
    explanation: >-
      The imaging criterion for isolated splenic tuberculosis.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Large solitary splenic abscess in a patient with splenomegaly and
      persistent severe neutropenia, and from a region with high prevalence of
      TB
    explanation: >-
      The abscess criterion for isolated splenic tuberculosis.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard antituberculous chemotherapy is the first-line treatment and can
    cure the disease without surgery: isoniazid, rifampicin, pyrazinamide and
    ethambutol for two months, then isoniazid and rifampicin. Six months is
    recommended for isolated splenic tuberculosis and 12 months for
    widespread disease. Because the liver is often involved, liver enzymes and
    bilirubin should be monitored weekly. Glucocorticoids have been added for
    slow responders. Failures despite therapy are reported and led to
    splenectomy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Splenic Caseating Granulomatous Inflammation
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli in the splenic lesions, which
      then regress.
    evidence:
    - reference: PMID:22361772
      reference_title: "Isolated tubercular splenic abscess: can we defer splenectomy? Our single experience with anti-tuberculous therapy alone."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        With anti-tuberculous therapy, the lesions regressed significantly in
        size.
      explanation: >-
        Splenic lesions shrank on treatment.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The standard short course antitubercular therapy for 6 months is
      recommended for isolated splenic TB, and for widespread disease,
      12-month therapy is recommended.
    explanation: >-
      The systematic review's recommended durations.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Till 1990, splenectomy was the treatment of choice for splenic TB.
      However, with evidence supporting therapeutic chemotherapy, ATT has
      become the first-line treatment for splenic TB.
    explanation: >-
      Chemotherapy replaced splenectomy as first-line treatment.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ATT should be initiated cautiously, and weekly monitoring of liver
      enzymes and serum bilirubin is strongly recommended.
    explanation: >-
      The caveat on hepatotoxicity monitoring.
  - reference: PMID:9927792
    reference_title: "[Incidence and clinical features of splenic abscesses, with special reference to tuberculous etiology in a general hospital]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Specific treatment for tuberculosis improved all patients with
      tuberculous splenic abscess, without needing surgery or corticosteroids.
    explanation: >-
      All seven tuberculous abscesses responded to medical treatment.
  - reference: PMID:17265622
    reference_title: "Splenic tuberculosis in patients with fever of unknown origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Despite vigorous antituberculous therapy with isoniazid, rifampin, and
      ethambutol, the clinical condition of 2 of these patients worsened and
      splenectomy was done.
    explanation: >-
      Two of five patients worsened on therapy and needed splenectomy.
- name: Percutaneous Abscess Drainage
  description: >-
    Abscess cavities over 5 cm are drained, preferably by image-guided
    percutaneous tube drainage rather than simple aspiration, with
    antituberculous therapy given before and after the procedure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: image-guided percutaneous drainage
    term:
      id: NCIT:C50434
      label: Drainage
  target_mechanisms:
  - target: Tuberculous Splenic Abscess Formation
    treatment_effect: INHIBITS
    description: >-
      Drainage evacuates the abscess cavity.
    evidence:
    - reference: PMID:41958487
      reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Image-guided percutaneous tube drainage is an effective procedure and
        is preferred over simple aspiration.
      explanation: >-
        The review's recommendation on draining tuberculous splenic abscesses.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Abscess cavities larger than 5 cm needs to be drained.
    explanation: >-
      The size threshold for drainage.
- name: Splenectomy
  description: >-
    Laparoscopic or open splenectomy, once the treatment of choice, is now
    kept for diagnostic failure, suspected malignancy, refractory disease,
    abscess, rupture or impending rupture, hypersplenism, splenic vein
    thrombosis and portal hypertension. Antituberculous therapy must be given
    before and after surgery; in one case, splenectomy for a splenic abscess
    followed by antibiotics alone was followed by spread to the brain and
    lungs.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Splenic Capsular Disruption and Rupture
    treatment_effect: INHIBITS
    description: >-
      Removing the ruptured spleen controls the bleeding.
    evidence:
    - reference: PMID:38919240
      reference_title: "A Case of Isolated Splenic Tuberculosis Presenting as a Splenic Abscess Complicated by Rupture Leading to Splenectomy in an Immunocompetent Male."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        An emergency exploratory laparotomy was performed, and a splenectomy
        was done due to the splenic abscess rupture.
      explanation: >-
        Emergency splenectomy for a ruptured tuberculous abscess.
  - target: Tuberculous Splenic Abscess Formation

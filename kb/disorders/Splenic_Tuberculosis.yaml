name: Splenic Tuberculosis
creation_date: "2026-11-27T00:27:11Z"
description: >-
  Splenic tuberculosis is tuberculosis of the spleen. This entry covers
  isolated (solitary) splenic tuberculosis and disease in which the spleen is
  the predominant site. Mycobacterium tuberculosis reaches the spleen by
  blood-borne spread, which is the usual route in HIV infection, or by
  contiguous spread from abdominal lymph nodes, bowel or pancreas. M. bovis
  acquired from unpasteurized dairy products also causes splenic abscesses.
  Caseating epithelioid granulomas form in the red and white pulp and appear
  as micronodular lesions (under 10 mm), macronodular lesions or
  tuberculomas, calcified foci, or caseous necrosis that coalesces into
  single or multiple tuberculous abscesses. Fever, often a prolonged fever of
  unknown origin, splenomegaly, left upper quadrant or diffuse abdominal pain,
  weight loss and anorexia are the usual features, and laboratory findings
  include anemia, neutropenia and pancytopenia. Ultrasound and CT show single
  or multiple hypoechoic, hypodense lesions or abscesses. Because no imaging
  appearance is specific and lymphoma is the main mimic, diagnosis rests on
  fine-needle aspiration, core biopsy or splenectomy specimens with
  histopathology, acid-fast staining, nucleic acid testing and culture.
  Splenic rupture with hemoperitoneum, hypersplenism and severe neutropenia
  are reported complications. Standard antituberculous chemotherapy is the
  first-line treatment; large abscesses are drained, and splenectomy is kept
  for diagnostic failure, refractory disease, abscess or rupture.
category: Infectious Disease
disease_term:
  preferred_term: splenic tuberculosis
  term:
    id: MONDO:0005967
    label: splenic tuberculosis
parents:
- Tuberculosis

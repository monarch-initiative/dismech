synonyms:
- tuberculosis of spleen
- splenic TB
- isolated splenic tuberculosis
- solitary splenic tuberculosis
- tuberculous splenic abscess
notes: >-
  Scope. This entry covers isolated splenic tuberculosis and disease in which
  the spleen is the predominant site. Splenic involvement as one part of
  miliary or disseminated tuberculosis belongs to Miliary_Tuberculosis, which
  records it as hepatosplenic miliary involvement. Hepatosplenic tuberculosis
  with liver involvement belongs to Hepatic_Tuberculosis, which records
  splenomegaly as a phenotype and leaves isolated splenic disease out of its
  scope. Some cited series (Dixit and colleagues; Llenas-Garcia and
  colleagues) enrolled any patient with splenic lesions or abscesses, so
  their figures include patients with concurrent pulmonary, abdominal or
  disseminated disease. Ascites, pleural effusion and lymphadenopathy are
  recorded for that reason and have no causal edge here. Persistent fever,
  anorexia, weight loss, fatigue, night sweats, abdominal distension,
  hepatomegaly and a raised ESR also have no causal edge, because no cited
  source says which step produces them. Evidence base. The
  literature is almost entirely case reports and small retrospective series
  of 5 to 30 patients. The largest synthesis is a 2026 systematic review of
  52 publications plus six of its authors' own cases, whose figures largely
  restate earlier series, so the same few series appear behind many
  statements. No controlled study compares treatments, and no population
  incidence or prevalence of splenic tuberculosis was found, so no prevalence
  record is asserted. Frequencies are set only where a cited series quotes a
  figure; where two series disagree the lower band is used. The pathway from
  granuloma to hypersplenism and the mechanism of neutropenia are stated in
  review tables, not demonstrated. Terms. No ECTO term for ingestion of raw
  cow milk or unpasteurized dairy products was found (an OLS search of ECTO
  for "raw milk" returned only ECTO:0070224 exposure to human milk (raw) via
  ingestion), so that exposure is recorded without an exposure_term. Seeded
  from PubMed searches and
  `research/Splenic_Tuberculosis-deep-research-claude_code.md`.
review_notes: >-
  Deliberately lumped. Isolated or predominantly splenic tuberculosis due to
  Mycobacterium tuberculosis and to M. bovis is kept in one entry. PubMed was
  searched for splenic tuberculosis titles and for splenic disease with
  Mycobacterium bovis. One retrospective series of people with HIV found more
  splenic abscesses, more surgery and a dairy-borne route with M. bovis, but
  it compared tuberculosis overall rather than splenic tuberculosis, and no
  source describes a splenic M. bovis stratum with its own presentation,
  diagnosis or first-line therapy, so M. bovis is recorded as a second
  infectious agent with its own transmission route instead of a subtype. The
  micronodular, macronodular and abscess forms are recorded as subtypes
  because CT classifies them and the abscess form changes management
  (drainage of cavities over 5 cm).
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes nearly all splenic
    tuberculosis, usually reaching the spleen through the bloodstream.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium tuberculosis (MTB) is the causative pathogen.
    explanation: >-
      A systematic review of splenic tuberculosis names M. tuberculosis as the
      cause.
  - reference: PMID:22361772
    reference_title: "Isolated tubercular splenic abscess: can we defer splenectomy? Our single experience with anti-tuberculous therapy alone."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fine needle aspiration of splenic lesion revealed acid-fast bacilli on
      Ziehl-Neelsen stain.
    explanation: >-
      Acid-fast bacilli shown directly in a splenic lesion in isolated
      splenic tuberculosis.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    A member of the M. tuberculosis complex acquired from cattle, mainly
    through unpasteurized dairy products. In a series of people with HIV it
    produced splenic abscesses and splenomegaly more often than M.
    tuberculosis did, and those patients more often needed drainage or
    splenectomy.
  evidence:
  - reference: PMID:40700328
    reference_title: "Mycobacterium bovis Infection Frequently Requires Surgical Intervention in Individuals with HIV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CT imaging in M. bovis infection more frequently demonstrated
      retroperitoneal lymphadenopathy, hepatosplenomegaly, and splenic
      abscesses compared to M. tuberculosis infection.
    explanation: >-
      In 12 people with HIV and M. bovis infection compared with 14 with M.
      tuberculosis, splenic abscesses were seen only with M. bovis (6 of 12).
  - reference: PMID:40700328
    reference_title: "Mycobacterium bovis Infection Frequently Requires Surgical Intervention in Individuals with HIV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Surgical interventions, including abscess drainage or splenectomy, were
      significantly more common among M. bovis patients.
    explanation: >-
      Five of the 12 M. bovis patients underwent splenectomy.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans by inhaled droplet nuclei and
    reaches the spleen from a pulmonary or abdominal focus, usually by the
    bloodstream. M. bovis has a cattle reservoir and reaches humans mainly
    through unpasteurized milk and cheese.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host of M. tuberculosis
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: reservoir of M. bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:40700328
    reference_title: "Mycobacterium bovis Infection Frequently Requires Surgical Intervention in Individuals with HIV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A history of unpasteurized dairy consumption was strongly associated
      with M. bovis TB in our patients, consistent with the classical route of
      transmission from cattle.
    explanation: >-
      Links M. bovis disease to dairy consumption and to its cattle
      reservoir.
classifications:
  harrisons_chapter:

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Splenic TB involvement usually follows hematogenous dissemination or
        contiguous spread of infection from mesenteric lymph nodes, intestine,
        pancreatic, subphrenic, and perinephric area.
      explanation: >-

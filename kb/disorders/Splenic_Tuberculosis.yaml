transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    M. tuberculosis is acquired by inhalation and reaches the spleen later
    from a pulmonary or abdominal focus; in one series 62% of patients with
    splenic involvement had pulmonary tuberculosis. Isolated splenic
    tuberculosis is defined by finding no such focus.
  evidence:
  - reference: PMID:20420041
    reference_title: "Clinical profile of patients having splenic involvement in tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      62% patients had associated pulmonary tuberculosis.
    explanation: >-
      Most patients with splenic involvement had pulmonary tuberculosis,
      the usual source of the bacilli.
- name: Foodborne Mycobacterium bovis acquisition
  description: >-
    M. bovis is acquired by eating unpasteurized dairy products from infected
    cattle.
  evidence:
  - reference: PMID:40700328
    reference_title: "Mycobacterium bovis Infection Frequently Requires Surgical Intervention in Individuals with HIV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Consumption of unpasteurized dairy products was significantly associated
      with M. bovis.
    explanation: >-
      Dairy consumption was associated with M. bovis infection in people with
      HIV.
has_subtypes:
- name: Micronodular
  display_name: Micronodular splenic tuberculosis
  classification: morphological_form
  description: >-
    Multiple small lesions under 10 mm across, as hypoechoic nodules on
    ultrasound or hypodense foci on CT, sometimes coalescing into
    microabscesses. In people with HIV, ultrasound-detected splenic
    microabscesses are caused by tuberculosis often enough to justify
    starting treatment before culture results.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      On the basis of CT scan findings, splenic TB has been classified into
      two types, micronodular (smaller than 10 mm) and macronodular (larger
      than 10 mm).
    explanation: >-
      The CT classification that defines the micronodular form.
  - reference: PMID:9010801
    reference_title: "Abdominal ultrasound findings of disseminated tuberculosis in AIDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      multiple, splenic, hypoechoic nodules between 0.5 cm and 1 cm (n = 11)
    explanation: >-
      Small splenic nodules in 11 of 76 patients with tuberculosis and HIV.
  - reference: PMID:31456550
    reference_title: "Detection of splenic microabscesses with ultrasound as a marker for extrapulmonary tuberculosis in patients with HIV: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ultrasound detection of splenic microabscesses in HIV patients is
      probably sufficient indication to initiate TB treatment prior to
      obtaining culture data.
    explanation: >-
      A pooled diagnostic review's conclusion that changes the diagnostic
      pathway for the micronodular form in HIV.
- name: Macronodular
  display_name: Macronodular splenic tuberculosis (tuberculoma)
  classification: morphological_form
  description: >-
    One or a few lesions over 10 mm, solid tuberculomas with central irregular
    necrosis that can look like a tumour, so biopsy or splenectomy is often
    needed to exclude lymphoma or a vascular tumour.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Large nodular tuberculous lesions appear as large hypodense lesion with
      central irregular necrosis and heterogenous enhancement.
    explanation: >-
      CT appearance of the macronodular form.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mitra et al. reported that hypoechoic lesions, well-demarcated which may
      be solitary or multiple, represent tuberculomas and may be associated
      with necrotic or hemorrhagic areas.
    explanation: >-
      Ultrasound appearance of tuberculomas.
  - reference: PMID:27250119
    reference_title: "Solitary splenic tuberculosis: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here we report a case of surgically confirmed mass-forming solitary
      splenic tuberculosis in a 64-year-old woman who presented with abdominal
      discomfort for two months, but with no other symptoms.
    explanation: >-
      A mass-forming solitary lesion diagnosed only at splenectomy.
- name: Tuberculous Splenic Abscess
  display_name: Tuberculous splenic abscess
  classification: morphological_form
  description: >-
    Caseous necrosis coalescing into single or multiple abscess cavities. It
    is the most common reported form, presents with high fever and left upper
    quadrant pain, and carries the risk of rupture; cavities over 5 cm are
    drained.
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The splenic abscess has been reported to be the most common
      manifestation of splenic TB and presents with high-grade fever with or
      without chills and left upper quadrant pain.
    explanation: >-
      The systematic review's account of the abscess form and its
      presentation.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Abscess cavities larger than 5 cm needs to be drained.
    explanation: >-
      The management difference for the abscess form.
  - reference: PMID:9927792
    reference_title: "[Incidence and clinical features of splenic abscesses, with special reference to tuberculous etiology in a general hospital]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      From the total of splenic abscess, 41.1% were tuberculous, six with AIDS
      and one with Sjögren syndrome.
    explanation: >-
      Seven of 17 splenic abscesses in a general hospital were tuberculous.
environmental:
- name: HIV infection
  description: >-
    HIV infection is the main recorded risk factor. Splenic tuberculosis
    occurs in more severely immunosuppressed people with HIV, half of the
    patients in one series had HIV, and blood-borne spread to the spleen is
    frequent in HIV.
  influences_mechanisms:
  - target: Hematogenous Seeding of the Spleen
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV-related immunosuppression favours blood-borne dissemination of the
      bacilli to the spleen.
    evidence:
    - reference: PMID:41958487
      reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Hematogenous dissemination frequently occurs in the HIV infected
        individuals.
      explanation: >-
        The systematic review ties HIV to blood-borne spread to the spleen.
    - reference: PMID:9195093
      reference_title: "Clinical significance of splenic tuberculosis in patients infected with human immunodeficiency virus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Statistically significant differences (P < .05) were detected between
        patients with splenic involvement (median CD4+ cell count, 54/mm3) and
        those without splenic involvement (median CD4+ cell count, 92/mm3).
      explanation: >-
        In 20 HIV-infected patients with splenic tuberculosis compared with 20
        without splenic involvement, CD4 counts were lower with splenic
        disease.
  evidence:
  - reference: PMID:9195093
    reference_title: "Clinical significance of splenic tuberculosis in patients infected with human immunodeficiency virus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Splenic tuberculosis occurs in more-severely immunocompromised
      HIV-infected patients, the prognosis is generally good, the clinical
      response to therapy is usually favorable, and splenectomy is rarely
      necessary.
    explanation: >-
      The case-control study's conclusion on HIV and splenic tuberculosis.
  - reference: PMID:20420041
    reference_title: "Clinical profile of patients having splenic involvement in tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Half of these patients also had HIV infection.
    explanation: >-
      HIV in half of a series of patients with splenic involvement.
- name: Immunosuppression other than HIV
  description: >-
    Immunosuppression is the predisposing condition in most splenic abscess
    series, and splenic tuberculosis is reported during anti-TNF therapy
    (adalimumab, infliximab) for inflammatory bowel disease, psoriasis and
    spondyloarthritis. Diabetes is also reported as more common in splenic
    tuberculosis.
  influences_mechanisms:
  - target: Hematogenous Seeding of the Spleen
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired host immunity predisposes to splenic tuberculosis; the cited
      sources do not tie it to a specific step.
    evidence:
    - reference: PMID:41958487
      reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Patients infected with HIV or who are immunocompromised are more likely
        to develop splenic TB.
      explanation: >-
        The systematic review names immunocompromise as a predisposing factor.
  evidence:
  - reference: PMID:19712861
    reference_title: "Splenic abscess: a review of 22 cases in a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mycobacterium tuberculosis was the most frequent causative
      microorganism, accounting for 8 cases, and immunosuppression the main
      predisposing factor (in 63.6% of the patients).
    explanation: >-
      In 22 splenic abscesses, M. tuberculosis was the commonest cause and
      immunosuppression the commonest predisposing state.
  - reference: PMID:42205655
    reference_title: "Splenic Tuberculosis in a Patient With Crohn's Disease Receiving Anti-tumor Necrosis Factor-α (TNF-α) Therapy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This study reports a 36-year-old man with Crohn's disease on adalimumab
      who presented with constitutional symptoms and multiple splenic nodules
      on imaging.
    explanation: >-
      A case of splenic tuberculosis during anti-TNF therapy.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A study done by Alavi et al. showed a high prevalence of splenic TB in
      diabetics compared to nondiabetics.
    explanation: >-
      The review restates a report of more splenic tuberculosis in diabetics.
- name: Consumption of unpasteurized dairy products
  description: >-
    Eating unpasteurized milk or artisanal cheese is the route of M. bovis
    infection, which in people with HIV produced splenic abscesses.
  influences_mechanisms:
  - target: Hematogenous Seeding of the Spleen
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dairy-borne M. bovis infection is followed by abdominal and disseminated
      disease that involves the spleen.
    evidence:
    - reference: PMID:40700328
      reference_title: "Mycobacterium bovis Infection Frequently Requires Surgical Intervention in Individuals with HIV."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        CT imaging in M. bovis infection more frequently demonstrated
        retroperitoneal lymphadenopathy, hepatosplenomegaly, and splenic
        abscesses compared to M. tuberculosis infection.
      explanation: >-
        Splenic abscesses followed dairy-associated M. bovis infection in
        people with HIV.
  evidence:
  - reference: PMID:40700328
    reference_title: "Mycobacterium bovis Infection Frequently Requires Surgical Intervention in Individuals with HIV."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Consumption of unpasteurized dairy products was significantly associated
      with M. bovis.
    explanation: >-
      Associates dairy consumption with M. bovis infection.
pathophysiology:
- name: Hematogenous Seeding of the Spleen
  role: trigger
  description: >-
    Bacilli from a pulmonary or other focus reach the spleen through the
    bloodstream. This is the predominant route, especially in HIV infection.
    In isolated splenic tuberculosis the source focus is not found.
  biological_scale: ORGANISM
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  evidence:
  - reference: PMID:40858649
    reference_title: "Higher proportion of coagulative necrosis and PD-L1(+) immune cells in splenic tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The STB is predominantly caused by the hematogenous dissemination of MTB
      from other parts, and in some cases, it may be primary
    explanation: >-
      A pathology series' introduction restating the blood-borne route.
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Splenic TB involvement usually follows hematogenous dissemination or
      contiguous spread of infection from mesenteric lymph nodes, intestine,
      pancreatic, subphrenic, and perinephric area.
    explanation: >-
      The systematic review's account of the routes of splenic infection.
  downstream:
  - target: Splenic Caseating Granulomatous Inflammation
    causal_link_type: DIRECT
    description: >-
      Bacilli lodged in the splenic pulp provoke epithelioid granulomas.
    evidence:
    - reference: PMID:41958487
      reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The hallmark of TB caused by MTB is epitheloid granulomas composed of
        macrophages aggregates, epitheloid cells and langhans giant cells with
        variable degree of central caseous necrosis involving both the red and
        white pulps.
      explanation: >-
        The bacilli produce granulomas in both red and white pulp.
- name: Contiguous Spread from Abdominal Tuberculous Foci
  role: trigger
  description: >-
    Infection spreads directly to the spleen from mesenteric or splenic hilar
    lymph nodes, bowel, pancreas or the subphrenic and perinephric spaces. The
    review describes this as the usual route in immunocompetent patients.
  biological_scale: TISSUE
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  evidence:
  - reference: PMID:41958487
    reference_title: "Epidemiological Features, Etiopathogenesis, Diagnostic Evaluation, and Management Protocol of Splenic Tuberculosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In immunocompetent cases, spleen involvement is usually by contiguous
      spread, or it may occur as a part of severe disseminated disease.
    explanation: >-
      The systematic review's statement of the contiguous route.
  downstream:

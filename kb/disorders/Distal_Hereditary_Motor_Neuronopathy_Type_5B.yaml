- name: Reep1 knockout mouse
  species: Mouse
  genotype: Reep1 null
  publication: PMID:41268727
  description: >-
    The loss-of-function model. Included deliberately as a negative: it is the
    model a curator would reach for first when looking for "a REEP1 mouse", and
    it models the wrong REEP1 disease.
  modeled_mechanisms:
  - target: Spinal Motor Neuron Axonal Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knockout progressively loses cortical motor neurons while spinal motor
      neurons remain intact. It therefore models SPG31, not dHMN5B, and gives the
      opposite cell-type answer to the disease this entry describes.
    limitations: >-
      The mismatch is not a matter of degree but of direction: the knockout
      removes the protein, whereas the disease accumulates it. Any inference
      about dHMN5B drawn from this model would be reversed. It remains the
      correct model for REEP1 loss-of-function disease.
    readouts:
    - name: Spinal motor neuron integrity in the knockout
      target: Spinal Motor Neuron Axonal Degeneration
      direction: UNCHANGED
      interpretation: >-
        The cells that degenerate in dHMN5B are unaffected by REEP1 deletion,
        which is why the knockout cannot model this disease.
      evidence:
      - reference: PMID:41268727
        reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Here, we show that these neurons are progressively lost while spinal
          motoneurons remain intact.
        explanation: >-
          Reports cortical loss with spinal sparing in the knockout, the inverse
          of the disease pattern.
    evidence:
    - reference: PMID:41268727
      reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        It is known that REEP1 knockout mice exhibit simplified ER structures in
        cortical motoneurons. Here, we show that these neurons are progressively
        lost while spinal motoneurons remain intact.
      explanation: >-
        Substantiates the negative claim that the knockout does not reproduce the
        dHMN5B lesion.
diagnosis:
- name: Nerve conduction studies and needle EMG
  description: >-
    The study that assigns the case to dHMN rather than to CMT2 or to a
    myopathy. Motor conduction velocities are normal or only mildly slowed with
    reduced CMAP amplitudes, sensory conduction is normal, and needle EMG shows
    chronic denervation distally.
  evidence:
  - reference: PMID:38702287
    reference_title: "Distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiology, with normal motor and sensory conduction velocities, can
      suggest the diagnosis of dHMN and guide the genetic study.
    explanation: >-
      States the role of electrophysiology in reaching the diagnosis and directing
      genetic testing.
- name: Gene panel or exome sequencing
  description: >-
    Necessary because the phenotype does not distinguish the more than thirty
    dHMN genes from each other, and because the majority of cases still have no
    genetic diagnosis. A REEP1 variant found in a pure motor presentation should
    be assessed for whether it preserves the reading frame and the shaping
    domains, since that is what separates a dHMN allele from an SPG31 allele.
  evidence:
  - reference: PMID:38702287
    reference_title: "Distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than thirty genes are currently associated with HMNs, but around 60 to
      70% of cases of dHMN remain uncharacterized genetically.
    explanation: >-
      Gives the genetic heterogeneity and the diagnostic yield that make broad
      sequencing necessary.

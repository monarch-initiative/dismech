inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Dominant transmission through three generations in the founding family. The
    mechanism is a toxic gain of function rather than haploinsufficiency, which
    is consistent with dominance and is also why a heterozygous null would not be
    expected to produce this phenotype — it produces the spastic paraplegia
    phenotype instead.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22703882
    reference_title: "Exome sequencing identifies a REEP1 mutation involved in distal hereditary motor neuropathy type V."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a family with both autosomal-dominant dHMN and dHMN type V
      (dHMN/dHMN-V) present in three generations, we excluded mutations in all
      genes known to be associated with a dHMN phenotype through Sanger
      sequencing and defined three potential loci through linkage analysis.
    explanation: >-
      Establishes autosomal dominant transmission across three generations.
mechanistic_hypotheses:
- hypothesis_group_id: toxic_gain_of_shaping_competent_reep1
  hypothesis_label: >-
    dHMN5B is a toxic gain of REEP1 function in lower motor neurons, not a loss
    of function
  status: CANONICAL
  description: >-
    The dHMN-associated REEP1 variants retain membrane-curvature activity and
    escape ubiquitin-dependent degradation, so the protein accumulates rather
    than being lost. Two independent lines support this: the exon-5 knock-in
    mouse degenerates spinal motor neurons while the knockout degenerates
    cortical ones, and a separate nonstop REEP1 variant that unmasks a
    3'UTR-encoded aggregation motif also produces a lower motor neuron
    phenotype. The model predicts that reducing mutant REEP1 abundance, rather
    than supplementing REEP1, is the rational therapeutic direction — untested.
  evidence:
  - reference: PMID:41268727
    reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, it is proposed that accumulation of shaping-competent REEP1
      variants in the ER drives ER fragmentation and spinal motoneuron
      degeneration in dHMN.
    explanation: >-
      States the accumulation model in the authors' own terms.
  - reference: PMID:29124833
    reference_title: "A nonstop variant in REEP1 causes peripheral neuropathy by unmasking a 3'UTR-encoded, aggregation-inducing motif."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      they also suggest that toxic gain of REEP1 function, rather than
      loss-of-function as relevant for HSP, specifically affects lower motor
      neurons
    explanation: >-
      Independent support for the gain-of-function direction from a different
      REEP1 allele class. Recorded as indirect because that family's phenotype
      was CMT2 rather than dHMN5B.
  - reference: PMID:22703882
    reference_title: "Exome sequencing identifies a REEP1 mutation involved in distal hereditary motor neuropathy type V."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data corroborate the loss-of-function nature of REEP1 mutations in
      HSP and suggest that a different mechanism applies in REEP1-associated
      dHMN.
    explanation: >-
      The earliest statement of the two-mechanism model, from the founding paper
      and an independent group, more than a decade before the accumulation
      mechanism was worked out. It matters disproportionately here because the
      rest of the mechanism rests on one recent study.
pathophysiology:
- name: REEP1 Exon 5 Skipping Variant
  biological_scale: MOLECULAR
  description: >-
    The founding allele is c.304-2A>G, which destroys the exon 5 splice acceptor.
    Skipping is complete and in frame, so the transcript escapes nonsense-mediated
    decay and is expressed at normal levels, encoding p.102_139del — a protein
    missing 38 internal residues that include part of the C-terminal amphipathic
    helix. This is the crucial feature: the product is a stable, internally
    shortened protein rather than an absent one.
  genes:
  - preferred_term: REEP1
    term:
      id: hgnc:25786
      label: REEP1
  genetic_context:
    allele_type: SPLICE_SITE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: NEOMORPHIC
    gene:
      preferred_term: REEP1
      term:
        id: hgnc:25786
        label: REEP1
    notes: >-
      Recorded as neomorphic rather than loss of function because the product
      retains its normal membrane-shaping activity and acquires resistance to
      degradation; the loss-of-function alleles of the same gene cause a
      different disease, SPG31.
  evidence:
  - reference: PMID:22703882
    reference_title: "Exome sequencing identifies a REEP1 mutation involved in distal hereditary motor neuropathy type V."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A minigene assay confirmed complete loss of splice-acceptor functionality
      and skipping of the in-frame exon 5. The resulting mRNA is predicted to be
      expressed at normal levels and to encode an internally shortened protein
      (p.102_139del).
    explanation: >-
      Establishes the splicing consequence and that a stable shortened protein,
      not a null, is produced.
  - reference: PMID:41268727
    reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with deletion of REEP1 exon5 (Δexon5), which deletes part of its
      amphipathic helix, however, develop muscle atrophy due to degeneration of
      spinal motoneuron axons (distal hereditary motor neuropathy/dHMN).
    explanation: >-
      Names the deleted protein region and links the allele to the lower motor
      neuron phenotype.
  downstream:
  - target: Impaired HUWE1-Dependent REEP1 Degradation
    description: >-
      The shortened protein is a poor ubiquitination substrate, so its normal
      proteasomal turnover fails.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41268727
      reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mechanistically, REEP1 undergoes ubiquitination and proteasomal
        degradation, a process compromised in the Δexon5 variant due to impaired
        ubiquitination, which thus accumulates in peripheral nerves.
      explanation: >-
        Links the variant directly to failed ubiquitination and consequent
        accumulation.
- name: Impaired HUWE1-Dependent REEP1 Degradation
  biological_scale: MOLECULAR
  description: >-
    Wild-type REEP1 is a short-lived protein cleared through the
    ubiquitin-proteasome system, with HUWE1 identified by proteomics as the E3
    ligase responsible. The dHMN alleles are poorly ubiquitinated and therefore
    escape that clearance. This is a regulatory escape rather than a change in
    the protein's own catalytic or structural activity, which is why the node is
    tagged as a gain of function rather than as an increase in a normally
    regulated process.
  biological_processes:
  - preferred_term: HUWE1-dependent REEP1 ubiquitination
    modifier: DECREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  - preferred_term: proteasomal turnover of REEP1
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:

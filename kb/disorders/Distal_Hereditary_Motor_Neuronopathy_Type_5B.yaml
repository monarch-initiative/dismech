name: Distal Hereditary Motor Neuronopathy Type 5B
creation_date: "2026-08-31T16:45:00Z"
category: Mendelian
synonyms:
- dHMN5B
- HMN5B
- neuronopathy, distal hereditary motor, type 5B
- neuronopathy, distal hereditary motor, type VB
- REEP1 neuronopathy, distal hereditary motor
- distal spinal muscular atrophy type 5B
description: >-
  Distal hereditary motor neuronopathy type 5B is an autosomal dominant, pure
  motor axonal neuropathy caused by specific REEP1 variants. It presents as a
  slowly progressive distal amyotrophy that predominates in the upper limbs,
  with wasting of the small hand muscles, later peroneal involvement, pes cavus
  and depressed distal reflexes, and with sensory nerve conduction preserved.

  What makes the entry worth curating separately from the other REEP1 disease is
  that the two are mechanistic opposites in the same gene. REEP1 is a
  neuron-specific ER protein that shapes the tubular endoplasmic reticulum
  through transmembrane hairpins and a C-terminal amphipathic helix and tethers
  that network to microtubules. Losing REEP1 function causes hereditary spastic
  paraplegia (SPG31) by degenerating cortical motor neuron axons. dHMN5B instead
  arises from variants — the founding one an in-frame skip of exon 5 removing
  part of the amphipathic helix — that leave the protein fully capable of
  bending membrane but no longer able to be cleared. REEP1 is normally turned
  over by HUWE1-dependent ubiquitination and proteasomal degradation; the dHMN
  variants escape that control and accumulate in peripheral nerve, and it is the
  accumulation of shaping-competent protein, not its absence, that fragments the
  ER and kills spinal motor neurons.

  The genotype-to-cell-type mapping is unusually clean and has been demonstrated
  in matched mouse lines: knockout mice lose cortical motor neurons while spinal
  motor neurons stay intact, and exon-5 knock-in mice do exactly the reverse.
  That symmetry is the strongest available argument that the upper- versus
  lower-motor-neuron split in REEP1 disease is driven by the direction of the
  molecular lesion rather than by modifier genes or chance. The disorder is
  ultra-rare — described in a small number of families since the founding report
  — against the much commoner REEP1-HSP presentation.

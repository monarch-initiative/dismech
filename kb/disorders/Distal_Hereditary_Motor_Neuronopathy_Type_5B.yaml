- name: Spinal Motor Neuron Axonal Degeneration
  biological_scale: CELLULAR
  description: >-
    Length-dependent degeneration of lower motor neuron axons, producing
    denervation of the distal muscles they supply. REEP1 is strongly expressed in
    lower motor neurons, which supplies the tissue-level reason a REEP1 lesion
    can produce a lower motor neuron rather than a purely central phenotype. This
    is the node at which dHMN5B and SPG31 diverge: the same gene degenerates
    cortical motor neuron axons when its function is lost.
  cell_types:
  - preferred_term: lower motor neuron
    term:
      id: CL:0008039
      label: lower motor neuron
  evidence:

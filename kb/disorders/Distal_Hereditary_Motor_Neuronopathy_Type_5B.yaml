genetic:
- name: REEP1
  notes: >-
    Receptor expression-enhancing protein 1, at 2p11.2. A neuron-specific ER
    protein that induces membrane curvature through transmembrane hairpins and a
    C-terminal amphipathic helix, forms complexes with atlastin-1 and spastin,
    and binds microtubules to align the tubular ER along the cytoskeleton. The
    dominant allelic series splits by mechanism: loss-of-function alleles cause
    SPG31, while alleles that preserve shaping activity and escape degradation
    cause dHMN5B. The split is not exhaustive — a homozygous splice-donor variant
    produces a third, recessive phenotype, a SMARD1-like congenital axonal
    neuropathy with diaphragmatic palsy, distal arthrogryposis and pronounced
    hyperreflexia, which fits neither dominant category.
  gene_term:
    preferred_term: REEP1
    term:
      id: hgnc:25786
      label: REEP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:22703882
    reference_title: "Exome sequencing identifies a REEP1 mutation involved in distal hereditary motor neuropathy type V."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of two affected individuals revealed a single
      candidate variant within the linking regions, i.e., a splice-site
      alteration in REEP1 (c.304-2A>G).
    explanation: >-
      Establishes the gene-disease relationship in the founding family.
  - reference: PMID:20200447
    reference_title: "Hereditary spastic paraplegia proteins REEP1, spastin, and atlastin-1 coordinate microtubule interactions with the tubular ER network."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      REEP proteins were required for ER network formation in vitro, and REEP1
      also bound microtubules and promoted ER alignment along the microtubule
      cytoskeleton in COS7 cells.
    explanation: >-
      Establishes the normal cell-biological function of the gene product,
      against which both disease mechanisms are read.
  - reference: PMID:27066569
    reference_title: "Recessive REEP1 mutation is associated with congenital axonal neuropathy and diaphragmatic palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected a homozygous splice donor mutation in REEP1
      (c.303+1-7GTAATAT>AC, p.F62Kfs23*; NM_022912) that cosegregated with the
      phenotype in the family, leading to complete skipping of exon 4 and a
      premature stop codon.
    explanation: >-
      Documents the recessive REEP1 allele producing a third phenotype, which is
      why the dominant two-way split is not the whole allelic series.
animal_models:
- name: REEP1 Δexon5 knock-in mouse
  species: Mouse
  genotype: Reep1 Δexon5 knock-in, genotype-matched to the human founding allele
  publication: PMID:41268727
  description: >-
    The most faithful available model, and one built to carry the patients'
    actual allele rather than a null. It reproduces the cell-type selectivity of
    the human disease and orders the events within it.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Fragmentation in Spinal Motor Neurons
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Spinal motor neurons are lost with ER fragmentation preceding the loss,
      while cortical motor neurons are spared — the human dHMN pattern, and the
      inverse of what the knockout does.
    limitations: >-
      Mouse motor units differ in length and metabolic demand from human ones, so
      the model cannot speak to the upper-limb predominance or the slow decades-long
      progression seen in patients. The reported readouts are histological rather
      than functional, so the relationship between ER fragmentation and motor
      performance in the model is inferred rather than measured here.
    readouts:
    - name: Spinal motor neuron number
      target: Endoplasmic Reticulum Fragmentation in Spinal Motor Neurons
      direction: DECREASED
      interpretation: >-
        Loss of the cell population that degenerates in patients.
      evidence:
      - reference: PMID:41268727
        reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Conversely, Δexon5 knockin (KI) mice lose spinal motoneurons preceded by
          ER fragmentation, whereas cortical motoneurons remain intact.
        explanation: >-
          Reports spinal motor neuron loss in the knock-in.
    - name: Cortical motor neuron integrity
      target: Endoplasmic Reticulum Fragmentation in Spinal Motor Neurons
      direction: UNCHANGED
      interpretation: >-
        A real negative result, and the one that makes the model informative — the
        upper motor neuron compartment that degenerates in SPG31 is spared here.
      evidence:
      - reference: PMID:41268727
        reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Conversely, Δexon5 knockin (KI) mice lose spinal motoneurons preceded by
          ER fragmentation, whereas cortical motoneurons remain intact.
        explanation: >-
          Reports that cortical motor neurons are unaffected in the knock-in.
  evidence:
  - reference: PMID:41268727
    reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conversely, Δexon5 knockin (KI) mice lose spinal motoneurons preceded by ER

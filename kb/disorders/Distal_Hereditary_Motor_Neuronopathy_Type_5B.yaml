- name: Distal Motor Amyotrophy with Upper-Limb Predominance
  biological_scale: ORGANISM
  description: >-
    Slowly progressive distal wasting and weakness that begins in the small hand
    muscles and later involves the peroneal group, with depressed distal
    reflexes, pes cavus, and — the feature that keeps it in the pure motor
    category — preserved sensory nerve conduction. Upper motor neuron signs are
    described as blurring the boundary with Silver syndrome and with the spastic
    paraplegia end of the REEP1 spectrum, but this entry found no citable
    observation of pyramidal signs in a genotyped dHMN5B patient; what is
    documented is pronounced hyperreflexia in the separate recessive REEP1
    phenotype.

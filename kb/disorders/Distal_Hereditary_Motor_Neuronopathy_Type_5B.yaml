    directness: INDIRECT
    snippet: >-
      addressed by a rehabilitation management, which included, as a main
      intervention, ankle stabilization by drop-foot boots instead of ankle-foot
      orthoses. Improved balance and independent ambulation resulted from
      rehabilitation.
    explanation: >-
      Documents a concrete orthotic intervention for foot drop in an inherited
      neuropathy and the functional gain from it. Indirect for the same reason:
      a CMT case report, not a dHMN5B series.
differential_diagnoses:
- name: REEP1-associated hereditary spastic paraplegia (SPG31)
  description: >-
    The same gene, the opposite mechanism, and the main diagnostic trap. SPG31
    arises from loss-of-function REEP1 alleles and degenerates cortical motor
    neuron axons, giving spasticity and upper motor neuron signs; dHMN5B arises
    from alleles that preserve shaping and escape degradation, and gives distal
    wasting. Distal wasting is described in SPG31, and upper motor neuron
    involvement is documented for REEP1 in the recessive congenital phenotype, so
    the ends of the REEP1 spectrum are not cleanly separable on examination; the
    discriminator is the nature of the allele rather than the clinical picture
    alone.
  evidence:
  - reference: PMID:41268727
    reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      REEP1 loss-of-function causes hereditary spastic paraplegia due to
      degeneration of cortical motoneuron axons.
    explanation: >-
      States the contrasting mechanism and cell type for the other REEP1 disease.
- name: BSCL2- and GARS1-associated distal hereditary motor neuropathy
  description: >-
    The other two genes producing upper-limb-predominant dHMN, and clinically
    indistinguishable from REEP1 disease at the bedside. Separation is by
    sequencing.
  evidence:
  - reference: PMID:38702287
    reference_title: "Distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal hereditary motor neuropathy that predominates in the upper limbs is
      linked mainly to three genes: GARS, BSCL2 and REEP1
    explanation: >-
      Names the three genes that share this clinical presentation.
- name: Charcot-Marie-Tooth disease type 2
  description: >-
    Overlaps genotypically with dHMN — several genes cause both — and is
    separated by sensory involvement, which dHMN by definition lacks. A REEP1
    nonstop variant has in fact been reported in a CMT2 family, so the
    gene-phenotype boundary is not absolute.
  evidence:
  - reference: PMID:29124833
    reference_title: "A nonstop variant in REEP1 causes peripheral neuropathy by unmasking a 3'UTR-encoded, aggregation-inducing motif."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a family with autosomal dominant Charcot-Marie-Tooth disease type 2,
      that is, an axonopathy affecting sensory neurons as well as lower motor
      neurons, we identified a heterozygous nonstop variant in REEP1.
    explanation: >-
      Documents a REEP1 allele presenting as CMT2 rather than pure motor dHMN,
      showing the boundary is permeable.
- name: Brown-Vialetto-Van Laere syndrome (riboflavin transporter deficiency)
  description: >-
    The one dHMN mimic that is treatable, which is why it has to be excluded
    before settling on a genetic diagnosis that has no therapy. Riboflavin
    transporter deficiency responds to high-dose riboflavin, so the cost of
    missing it is a treatment not given rather than a label not applied.
  evidence:
  - reference: PMID:38702287
    reference_title: "Distal hereditary motor neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A differential diagnosis of dHMN related to Brown Vialetto Van Laere
      syndrome due to riboflavin transporter deficiency is important to consider
      because of the therapeutic possibility.
    explanation: >-
      Names the treatable mimic and the reason it must be considered.
- name: Recessive REEP1 congenital axonal neuropathy with diaphragmatic palsy
  description: >-
    A third REEP1 phenotype, and the one that stops the allelic series being a
    clean two-way split. A homozygous splice-donor variant produces a SMARD1-like
    congenital axonal neuropathy with distal arthrogryposis and, notably, upper
    motor neuron signs. It is separated from dHMN5B by recessive inheritance and
    congenital onset.
  evidence:
  - reference: PMID:27066569
    reference_title: "Recessive REEP1 mutation is associated with congenital axonal neuropathy and diaphragmatic palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype of the patient is similar to spinal muscular atrophy with
      respiratory distress type 1 (SMARD1) with additional distal arthrogryposis
      and involvement of the upper motor neuron manifested by pronounced
      hyperreflexia.
    explanation: >-
      Documents a third, recessive REEP1 phenotype with upper motor neuron
      involvement, which is why the dominant series cannot be described as a
      clean two-way split.
discussions:
- discussion_id: why_lower_motor_neuron_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does accumulation of shaping-competent REEP1 damage spinal motor neurons
    specifically, when loss of the same protein damages cortical ones?
  attaches_to:
  - pathophysiology#Endoplasmic Reticulum Fragmentation in Spinal Motor Neurons
  rationale: >-
    The matched mouse lines establish the double dissociation cleanly, but not
    its basis. Candidate explanations include differing baseline REEP1
    expression, differing dependence on tubular versus sheet ER, differing
    proteostatic capacity, and differing axon length and calibre between the two
    motor neuron populations. Distinguishing them matters therapeutically,
    because a proteostasis-directed treatment would need to reach the compartment
    that is actually vulnerable.
- discussion_id: huwe1_as_target
  kind: OPEN_QUESTION
  prompt: >-
    Would enhancing clearance of the mutant REEP1 protein, or reducing its
    expression, prevent spinal motor neuron degeneration?
  attaches_to:
  - pathophysiology#Impaired HUWE1-Dependent REEP1 Degradation
  - treatments#Supportive and rehabilitative management
  rationale: >-
    The accumulation model makes an unusually specific prediction: lowering the
    mutant protein should help, and supplementing REEP1 should not, which is the
    reverse of what a loss-of-function reading would suggest. HUWE1 is named as
    the responsible E3 ligase, and allele-selective knockdown is technically
    plausible for a dominant in-frame deletion. Neither has been tested in the
    knock-in mouse, and the entry records no therapy because none exists.
notes: >-
  Three things in the deep-research report are deliberately not curated, recorded
  here so a later curator does not read the gaps as oversights and "fix" them.

  ER stress and oxidative stress are named in the report as downstream effectors,
  citing PMID:36834939 and PMID:32878877. Both are REEP1-null mouse and
  REEP1-knockdown zebrafish work, framed around SPG31 — that is, the
  loss-of-function direction, which is the opposite of the mechanism this entry
  argues and the same reason the knockout mouse is graded FAILS_TO_RECAPITULATE.
  Importing them would contradict the entry's thesis, so they are excluded on
  purpose rather than missed.

  HP:0003431 (Decreased motor nerve conduction velocity) appears in the report's
  HPO table but is not modelled as a phenotype. The backing quote describes motor
  and sensory conduction velocities as normal, which is what an axonal rather
  than demyelinating neuropathy predicts; the abnormality is in CMAP amplitude,
  not velocity. The axonal pattern is captured by HP:0007002 instead. If a
  genotyped dHMN5B series later reports slowed motor conduction, this is the term
  to add.

  Pyramidal signs are described in the report and in review prose as occurring in
  dHMN5B, but no citable observation in a genotyped patient was found. The entry
  states what is documented — hyperreflexia in the separate recessive REEP1
  phenotype — rather than repeating the uncited assertion.

  The mechanism in this entry rests heavily on one recent study (PMID:41268727)
  that supplies the ubiquitination defect, the HUWE1 identification, the liposome
  shaping result and both mouse lines. That concentration is worth noting: the
  causal chain from failed degradation through accumulation to ER fragmentation
  is coherent and internally well controlled, but it has not yet been reproduced
  by an independent group. The corroboration from PMID:29124833 is directional
  only — it supports toxic gain of function for a different REEP1 allele in a
  CMT2 family.

  Several phenotype items carry directness INDIRECT on purpose. The HPO
  annotation set for MONDO:0013884 lists thenar and peroneal atrophy, pes cavus
  and the reflex findings, but the primary literature for this ultra-rare
  disorder does not state each of them in a quotable sentence. Rather than
  attach a quote from a BSCL2 dHMN-V series — which the deep-research report
  offered and which would have been a different gene's patients — the evidence
  here is the closest true statement about REEP1 disease, graded indirect, with
  the gap named in each explanation.

  `Accumulation of Shaping-Competent REEP1` uses modifier GAIN_OF_FUNCTION
  rather than INCREASED deliberately. The claim is qualitative: the protein has
  escaped its normal regulatory control by the ubiquitin-proteasome system, not
  merely risen above its usual level. Per the guidance in CLAUDE.md that trades
  ontology grounding for expressivity, this is the intended use of the
  unbound value.

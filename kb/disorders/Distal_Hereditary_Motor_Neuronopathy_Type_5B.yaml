- name: Aberrant Subcellular Localization and Atlastin-1 Mis-recruitment
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The dHMN allele does not simply accumulate; it accumulates in the wrong
    place. On overexpression it shows a subcellular localization defect distinct
    from that of the HSP-associated missense allele, and — uniquely among the two
    — it recruits atlastin-1, one of REEP1's binding partners, to those altered
    sites. Atlastin-1 is the GTPase that fuses ER tubules, so pulling it away
    from where it belongs is a plausible route from mislocalised REEP1 to a
    fragmented network.

    This node is marked PROVISIONAL and sits in parallel with, not in place of,
    the direct accumulation-to-fragmentation link. The localization work is from
    an independent group and predates the accumulation model by more than a
    decade, which is why it is worth carrying: it is the only pre-2026,
    allele-specific mechanistic data available and it points the same way. But it
    was done by overexpression in non-neuronal cell lines, and nobody has shown
    that atlastin-1 mis-recruitment is what fragments the ER in the knock-in
    mouse.
  evidence:
  - reference: PMID:22703882
    reference_title: "Exome sequencing identifies a REEP1 mutation involved in distal hereditary motor neuropathy type V."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we show that p.102_139del, but not p.Ala20Glu, recruits
      atlastin-1, i.e., one of the REEP1 binding partners, to the altered sites
      of localization.
    explanation: >-
      Establishes atlastin-1 mis-recruitment as specific to the dHMN allele and
      absent from the HSP allele.
  downstream:
  - target: Endoplasmic Reticulum Fragmentation in Spinal Motor Neurons
    description: >-
      Sequestering the ER-fusion GTPase away from its normal sites is a candidate
      route to a fragmented tubular network.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22703882
      reference_title: "Exome sequencing identifies a REEP1 mutation involved in distal hereditary motor neuropathy type V."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        These data corroborate the loss-of-function nature of REEP1 mutations in
        HSP and suggest that a different mechanism applies in REEP1-associated
        dHMN.
      explanation: >-
        The authors' own reading: the dHMN allele acts by a different mechanism
        from loss of function. The step to ER fragmentation specifically is
        inferred from atlastin-1's role rather than measured here, hence indirect
        and with unknown intermediates.
- name: Endoplasmic Reticulum Fragmentation in Spinal Motor Neurons
  biological_scale: CELLULAR
  description: >-
    The tubular ER network breaks up in spinal motor neurons, and does so before
    the neurons are lost, which is what establishes it as a step in the causal
    chain rather than a consequence of degeneration. Cortical motor neurons are
    spared. Neurons are particularly exposed to this lesion because the ER has to
    extend into axons and dendrites over very large distances, so a shaping
    defect that is tolerable elsewhere is not tolerable here.
  biological_processes:

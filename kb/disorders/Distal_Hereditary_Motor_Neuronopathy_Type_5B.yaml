    snippet: >-
      Proteomic analysis identifies HUWE1 as the E3 ligase responsible for REEP1
      turnover.
    explanation: >-
      Identifies the ligase whose action the disease alleles escape.
  - reference: PMID:41268727
    reference_title: "REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration in Distal Hereditary Motor Neuropathy."
    supports: SUPPORT

diagnosis:
- name: Histopathology and Microbial Culture
  description: >-
    Biopsy, histopathology, and culture establish the diagnosis by showing
    non-filamentous bacterial granules with Splendore-Hoeppli material and then
    identifying the aerobic or anaerobic causative bacterium for susceptibility
    testing.
  diagnosis_term:
    preferred_term: biopsy with microbial culture
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:41128794
    reference_title: "Cutaneous botryomycosis: a comprehensive review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The current gold standard for diagnosing botryomycosis involves a
      combination of histopathological examination and microbial culture.
    explanation: >-
      Identifies paired histopathology and culture as the diagnostic standard.
  - reference: PMID:42220824
    reference_title: "Botryomycosis: A Case Series and Literature Review in Mexico."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Definitive diagnosis is established through culture, prior to exclusion of
      fungal and actinomycete infections.
    explanation: >-
      Supports culture as the step that identifies the bacteria after
      histologic separation from fungal and actinomycete mimics.
treatments:

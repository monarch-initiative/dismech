transmission:
- name: Local Bacterial Inoculation or Persistence
  description: >-
    Botryomycosis begins when common pyogenic bacteria persist in damaged or
    surgically manipulated tissue, or less often mucosal or visceral tissue, in
    a host context that fails to clear the organisms.
  evidence:
  - reference: PMID:42220824
    reference_title: "Botryomycosis: A Case Series and Literature Review in Mexico."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Its development is usually associated with multiple factors, generally
      following a lesion or surgical intervention.
    explanation: >-
      Supports local injury or surgical manipulation as a common initiating
      setting for botryomycosis.
environmental:
- name: HIV infection with poor immunological control
  description: >-
    HIV infection, especially with poor immunological control, is a recurrent
    predisposing context for botryomycosis through defective cellular immunity.
  exposure_term:
    preferred_term: exposure to Human immunodeficiency virus
    term:
      id: ECTO:3000289
      label: exposure to Human immunodeficiency virus
  influences_mechanisms:
  - target: Impaired Host Bacterial Clearance
    environmental_effect: PREDISPOSES
    description: >-
      HIV-associated defects in cellular immunity leave the host less able to
      clear ordinary pyogenic bacteria.
    evidence:
    - reference: PMID:28562771
      reference_title: "Facial botryomycosis-like pyoderma in an HIV-infected patient: remission after initiation of darunavir and raltegravir."

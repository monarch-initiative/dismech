- name: Antiretroviral Therapy in HIV-Associated Disease
  description: >-
    In people with HIV and poor immunological control, effective antiretroviral
    therapy restores the host context; in a reported facial case, repeated
    antibiotic courses gave only partial and temporary remission, and complete
    remission followed a darunavir and raltegravir regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antiretroviral Therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
    therapeutic_agent:
    - preferred_term: darunavir
      term:
        id: CHEBI:367163
        label: darunavir
    - preferred_term: raltegravir
      term:
        id: CHEBI:82960
        label: raltegravir
  target_mechanisms:
  - target: Impaired Host Bacterial Clearance
    treatment_effect: RESTORES
    description: >-
      Immune restoration with antiretroviral therapy removes the permissive
      host context that antibiotics alone did not correct.
  evidence:
  - reference: PMID:28562771
    reference_title: "Facial botryomycosis-like pyoderma in an HIV-infected patient: remission after initiation of darunavir and raltegravir."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several courses of antimicrobial therapy provided only partial and
      temporary remission. Complete clinical remission was only achieved 5 years
      later when a novel antiretroviral regimen composed of darunavir and
      raltegravir was initiated.
    explanation: >-
      A single case report in which remission followed the start of an
      antiretroviral regimen after antibiotics alone had failed.

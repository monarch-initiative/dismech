      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Predisposing factors were HIV infection with poor immunological
        control, alcoholism, and a previous trauma to the right cheek.
      explanation: >-
        Names poorly controlled HIV infection as a predisposing factor in a
        botryomycosis case.

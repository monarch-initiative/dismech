has_subtypes:
- name: Cutaneous
  display_name: Cutaneous botryomycosis
  description: >-
    The common skin-predominant form, presenting with chronic nodules,
    sinuses, abscesses, fistulae, ulcers, or verrucous draining lesions that
    can extend into subcutaneous tissue, muscle, or bone.
  subtype_term:
    preferred_term: cutaneous botryomycosis
    term:
      id: MONDO:0800117
      label: cutaneous botryomycosis
  evidence:
  - reference: PMID:32173890
    reference_title: Case of cutaneous botryomycosis in an 8-year-old immunocompetent boy with a review of the published work.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Botryomycosis is divided into cutaneous and visceral disease, with the
      cutaneous form being more common.
    explanation: >-
      Establishes cutaneous botryomycosis as the more common anatomic form.
- name: Visceral
  display_name: Visceral botryomycosis
  description: >-
    The rarer internal-organ form, most often represented by pulmonary or other
    mass-like lesions that can mimic carcinoma, tuberculosis, actinomycosis, or
    invasive fungal disease.
  subtype_term:
    preferred_term: visceral botryomycosis
    term:
      id: MONDO:0800118
      label: visceral botryomycosis
  evidence:
  - reference: PMID:23743320
    reference_title: "Primary pulmonary botryomycosis: a bacterial lung infection mimicking lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary botryomycosis can resemble actinomycosis, tuberculosis or
      invasive carcinoma.
    explanation: >-
      Documents pulmonary visceral botryomycosis and its mass-like clinical
      mimicry.
pathophysiology:
- name: Common Bacterial Persistence in Tissue
  description: >-
    Ordinary non-filamentous pyogenic bacteria enter or persist in damaged
    tissue rather than being cleared as an acute abscess.
  biological_scale: TISSUE
  downstream:
  - target: Bacterial Grain Formation
    causal_link_type: DIRECT
    description: >-
      Persistent bacteria aggregate into the non-filamentous grains that define
      botryomycosis.
  evidence:
  - reference: PMID:42220824
    reference_title: "Botryomycosis: A Case Series and Literature Review in Mexico."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Botryomycosis is a chronic, suppurative, and granulomatous bacterial
      infection caused by non-filamentous Gram-positive or Gram-negative
      bacteria that are aerobic or microaerophilic and form grains (biofilm
      composed of masses of bacteria agglomerated by interstitial cement).
    explanation: >-
      Defines botryomycosis as grain formation by non-filamentous bacteria.
- name: Impaired Host Bacterial Clearance
  description: >-
    The same bacteria that cause ordinary pyogenic infections instead persist
    as grains when host clearance and microbial infectivity are imbalanced; HIV
    and other defects in cellular immunity are recurrent risk contexts.
  biological_scale: CELLULAR
  downstream:
  - target: Bacterial Grain Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inadequate clearance permits bacteria to persist long enough to organize
      as compact grains.
  evidence:
  - reference: PMID:18177488
    reference_title: Botryomycosis caused by Staphylococcus aureus and Pneumocystis carinii in a patient with acquired immunodeficiency disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, both the host's immune status and microbial infectivity have
      been implicated in the pathogenesis of this unusual clinical condition.
    explanation: >-
      Links botryomycosis pathogenesis to a host-clearance and microbial
      infectivity balance.
  - reference: PMID:28562771
    reference_title: "Facial botryomycosis-like pyoderma in an HIV-infected patient: remission after initiation of darunavir and raltegravir."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has long been associated with defects of cellular immunity.
    explanation: >-
      Supports impaired cellular immunity as a recurrent permissive context for
      botryomycosis.
- name: Bacterial Grain Formation
  description: >-
    Cocci or bacilli cluster into lobulated, non-filamentous granules at the
    center of lesions and are frequently coated by eosinophilic
    Splendore-Hoeppli material.
  biological_scale: TISSUE
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Chronic Pyogranulomatous Inflammation
    causal_link_type: DIRECT
    description: >-
      Persistent grains sit at the center of a chronic suppurative and
      granulomatous host reaction.
  evidence:
  - reference: PMID:42220824
    reference_title: "Botryomycosis: A Case Series and Literature Review in Mexico."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The grains, approximately 1 mm in size, are amphophilic, lobulated, and
      non-filamentous, consisting of coccoid or bacillary elements arranged in
      clusters, and are located at the center of the inflammatory reaction.
    explanation: >-
      Describes the bacterial grains at the center of botryomycosis lesions.
  - reference: PMID:32173890
    reference_title: Case of cutaneous botryomycosis in an 8-year-old immunocompetent boy with a review of the published work.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathology showed sulfur granules surrounded by an eosinophilic
      matrix, indicating the Splendore-Hoeppli phenomenon.
    explanation: >-
      A cutaneous case directly demonstrates Splendore-Hoeppli material around
      bacterial grains.
- name: Chronic Pyogranulomatous Inflammation
  description: >-
    Neutrophils, macrophage-lineage histiocytes, eosinophils, lymphocytes,
    plasma cells, fibroblasts, and occasional giant cells accumulate around the
    grains, generating chronic abscessing and granulomatous dermal or visceral
    lesions.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: ABNORMAL
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Skin Nodules
    causal_link_type: DIRECT
    description: Chronic dermal inflammation forms nodular cutaneous lesions.
  - target: Abscess
    causal_link_type: DIRECT
    description: Suppurative inflammation forms abscesses and draining sinuses.
  - target: Skin Ulcer
    causal_link_type: DIRECT
    description: Chronic destructive inflammation can ulcerate the skin surface.
  - target: Draining Sinus Tracts and Fistulae
    causal_link_type: DIRECT
    description: Suppurative inflammation drains to the surface through sinus tracts and fistulae.
  - target: Pulmonary Mass
    causal_link_type: DIRECT
    description: In the lung, the pyogranulomatous reaction forms a mass-like lesion.
  evidence:
  - reference: PMID:42220824
    reference_title: "Botryomycosis: A Case Series and Literature Review in Mexico."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Granulomas composed of neutrophils, lymphocytes, eosinophils, plasma
      cells, fibroblasts, histiocytes, and occasionally foreign body-type giant
      cells are identified in the dermis.
    explanation: >-
      Identifies the mixed inflammatory cell population around cutaneous
      botryomycosis grains.
progression:
- phase: Chronic local infection
  notes: >-
    Lesions usually evolve over weeks to months, may relapse if bacteria and
    permissive host factors persist, and in rare visceral or uncontrolled
    immunodeficiency settings may extend deeply or disseminate.
  evidence:
  - reference: PMID:41128794
    reference_title: "Cutaneous botryomycosis: a comprehensive review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients with botryomycosis typically present multiple nodules, sinuses,
      abscesses, fistulae, and ulcers, which develop during weeks or months.
    explanation: >-
      Defines the weeks-to-months tempo of common cutaneous botryomycosis
      lesions.

name: Botryomycosis
creation_date: "2026-09-29T20:30:52Z"
description: >-
  Botryomycosis is a rare chronic suppurative granulomatous bacterial infection
  in which ordinary non-filamentous bacteria, most often Staphylococcus aureus
  and then Pseudomonas aeruginosa, persist in tissue as compact grains
  surrounded by Splendore-Hoeppli material and chronic pyogranulomatous
  inflammation, producing nodules, abscesses, draining sinuses, ulcers, or
  mass-like visceral lesions that can mimic mycetoma, actinomycosis, and
  neoplasia.
category: Infectious Disease
disease_term:
  preferred_term: botryomycosis
  term:
    id: MONDO:0400006
    label: botryomycosis
parents:
- primary bacterial infectious disease
synonyms:
- Granular bacteriosis
- Bacterial pseudomycosis
notes: >-
  Historical pediatric AIDS (PMID:11001122), fatal disseminated visceral
  (PMID:13845294), and tongue (PMID:5235476) botryomycosis case reports have no
  quotable abstract or full text, so no evidence item quotes them.
review_notes: >-
  Deliberately lumped. MONDO records cutaneous and visceral Botryomycosis
  descendants, and the literature also names several bacterial causes including
  Staphylococcus aureus, Pseudomonas aeruginosa, Aggregatibacter
  actinomycetemcomitans, Escherichia coli, Proteus vulgaris, coagulase-negative
  staphylococci, streptococci, and other rare Gram-positive or Gram-negative
  organisms. This entry keeps the anatomic and taxon strata together because the
  named clinical entity shares non-filamentous bacterial grains,
  Splendore-Hoeppli material, pyogranulomatous inflammation,
  histology-plus-culture diagnosis, and susceptibility-directed antibiotics with surgical
  drainage or debridement; the reviewed literature explicitly leaves the
  organism-specific pathobiology unresolved rather than documenting separate
  bacterial causal chains.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the principal reported cause of botryomycosis and
    forms non-filamentous coccoid bacterial grains in cutaneous and soft-tissue
    lesions.
  evidence:
  - reference: PMID:42220824
    reference_title: "Botryomycosis: A Case Series and Literature Review in Mexico."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      S. aureus is the principal causative agent (40%), followed by Pseudomonas
      aeruginosa (20%).
    explanation: >-
      Identifies S. aureus as the most common bacterial cause of botryomycosis
      in the literature review.
- name: Pseudomonas aeruginosa
  infectious_agent_term:
    preferred_term: Pseudomonas aeruginosa
    term:
      id: NCBITaxon:287
      label: Pseudomonas aeruginosa
  description: >-
    Pseudomonas aeruginosa is the next most commonly reported cause and has
    produced localized mucosal botryomycosis with Gram-negative bacillary grains.
  evidence:
  - reference: PMID:41128794
    reference_title: "Cutaneous botryomycosis: a comprehensive review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most frequent isolated etiological agents are Staphylococcus aureus
      followed by Pseudomonas aeruginosa.
    explanation: >-
      Supports P. aeruginosa as the second most frequently isolated agent in
      reviewed cutaneous botryomycosis cases.
  - reference: PMID:15456177
    reference_title: "Botryomycosis ('bacterial ball') of the sinonasal tract caused by Pseudomonas aeruginosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cultures of samples taken from both patients intraoperatively confirmed
      the organisms as P. aeruginosa.
    explanation: >-
      Two sinonasal botryomycosis cases had intraoperative cultures confirming
      P. aeruginosa in the lesions.
- name: Aggregatibacter actinomycetemcomitans
  infectious_agent_term:
    preferred_term: Aggregatibacter actinomycetemcomitans
    term:
      id: NCBITaxon:714
      label: Aggregatibacter actinomycetemcomitans
  description: >-
    Aggregatibacter actinomycetemcomitans, reported under the former
    Actinobacillus name, is a rare Gram-negative cause documented in traumatic
    cutaneous botryomycosis.
  evidence:
  - reference: PMID:17500377
    reference_title: Actinobacillus actinomycetemcomitans isolated from a case of cutaneous botryomycosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Routine bacterial cultures grew S aureus and Actinobacillus
      actinomycetemcomitans, a fastidious gram-negative bacillus known to cause
      periodontal disease, endocarditis, and actinomycosislike soft tissue
      infections.
    explanation: >-
      Documents A. actinomycetemcomitans, now Aggregatibacter
      actinomycetemcomitans in NCBI Taxonomy, in a traumatic cutaneous
      botryomycosis case.

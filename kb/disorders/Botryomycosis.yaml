    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment consists of antibiotic administration for several weeks,
      according to the causative agent and its susceptibility profile.
    explanation: >-
      Defines antibiotic treatment as susceptibility-directed therapy over

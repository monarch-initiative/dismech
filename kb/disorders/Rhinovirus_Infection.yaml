name: Rhinovirus Infection
creation_date: "2026-06-25T12:00:00Z"
description: >
  Rhinovirus infection is an acute respiratory infection caused by human
  rhinoviruses (HRV; genus Enterovirus, family Picornaviridae; groups A, B, and
  C). HRV is the most common cause of the common cold, responsible for more than
  half of cold-like illnesses, and infects the respiratory epithelium after
  binding host receptors (major-group HRV uses ICAM-1; minor-group uses LDL-receptor
  family members; HRV-C uses CDHR3). Although traditionally regarded as
  an upper respiratory tract pathogen, HRV is now recognized as an important
  lower respiratory tract pathogen, particularly in people with asthma, infants,
  the elderly, and immunocompromised hosts. Wheezing rhinovirus illnesses in
  early life are among the strongest predictors of subsequent childhood asthma,
  and HRV is the most frequent viral trigger of asthma and COPD exacerbations.
category: Infectious Disease
parents:
- Viral Respiratory Infection
synonyms:
- Human rhinovirus infection
- HRV infection
- Common cold (rhinoviral)
disease_term:
  preferred_term: rhinovirus infection
  term:
    id: MONDO:0005709
    label: common cold
has_subtypes:
- name: RV-C
  display_name: Rhinovirus C infection
  classification: etiologic_species
  description: >-
    Infection with rhinovirus C, the species that earns a row of its own on two
    documented axes. On diagnosis, RV-C does not grow in the cell lines that
    recovered RV-A and RV-B, which is why it was not recognised until molecular
    methods arrived and why its classification rests on sequence rather than on
    culture; propagating it in vitro takes a cell line made to express CDHR3.
    On presentation, several independent paediatric
    series report a higher frequency of wheezing and of asthma exacerbation with
    RV-C than with the other two species, and the receptor it uses, CDHR3, is
    itself a childhood asthma susceptibility gene product. That presentation
    difference is not settled: it is recorded here with the contrary evidence
    beside it, because one surveillance cohort found species did not affect most
    clinical outcomes and a review of the earlier reports found well-designed
    studies in which RV-A and RV-C lower-respiratory illness looked alike.
    Neither axis changes management, which is supportive for every species.
  review_notes: >-
    subtype_term is omitted under rule R12 because MONDO carries no rhinovirus
    species class. Re-runnable check:
    `uv run runoak -i ols:mondo search "l~rhinovirus"` returns only
    MONDO:1014857 equine rhinovirus infection, and an OLS query for the
    descendants of this entry's disease_term MONDO:0005709 common cold returns
    none. Binding the parent term is what R12 forbids.
  evidence:
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HRV-C strains do not grow in standard cell culture, likely postponing
      their discovery
    explanation: >-
      The diagnosis-axis difference that distinguishes this species from RV-A
      and RV-B, under rule R7. Evidence source is OTHER as this is a review.
  - reference: PMID:25848009
    reference_title: >-
      Cadherin-related family member 3, a childhood asthma susceptibility gene
      product, mediates rhinovirus C binding and replication.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report here that expression of human cadherin-related family member 3
      (CDHR3) enables the cells normally unsusceptible to RV-C infection to
      support both virus binding and replication.
    explanation: >-
      Identifies the distinct receptor this species uses, which is both the
      reason it is unculturable in ordinary lines and the mechanistic link to
      the asthma association. The experiment is receptor transfection into cell
      lines, so evidence_source is IN_VITRO.
  - reference: PMID:20693244
    reference_title: >-
      Association between human rhinovirus C and severity of acute asthma in
      children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with HRVC (n = 76) had higher asthma severity scores than
      children whose HRV infection was HRVA or HRVB only
    explanation: >-
      A direct within-cohort comparison of this species against the other two on
      asthma exacerbation severity, which is the presentation axis of rule R7.
  - reference: PMID:31876616
    reference_title: >-
      Rhinovirus C Is Associated With Severe Wheezing and Febrile Respiratory
      Illness in Young Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rhinovirus C is the most prevalent species in our study, and it was
      associated with severe wheezing and febrile illness.
    explanation: >-
      An independent paediatric cohort reporting the same presentation
      difference, which is what lifts it above a single-study finding.
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      More recently, however, well-designed studies found that the clinical
      manifestations and prevalences of lower respiratory tract infection among
      children with HRV-A and HRV-C infections appear to be similar
    explanation: >-
      Recorded against the presentation claim rather than omitted: the review
      reports studies in which RV-A and RV-C lower-respiratory illness did not
      differ, so the severity axis is contested even though the diagnosis axis
      is not. The quoted sentence describes human clinical studies the review
      did not itself perform.
  - reference: PMID:35918790
    reference_title: >-
      Clinical characteristics, outcomes, and seasonality of acute respiratory
      infection associated with single and codetected rhinovirus species among
      hospitalized children in Amman, Jordan.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: neither codetection nor species affected most clinical outcomes
    explanation: >-
      The same cohort that found more wheezing with RV-C concluded that species
      did not change most clinical outcomes, which is the limit on how far this
      row's presentation difference can be taken.
infectious_agent:
- name: Rhinovirus A
  infectious_agent_term:
    preferred_term: Rhinovirus A
    term:
      id: NCBITaxon:147711
      label: Rhinovirus A
  description: >
    Human rhinovirus group A, a positive-sense single-stranded RNA picornavirus;
    most group A and B serotypes are major-group viruses using ICAM-1 for entry.
    The most frequently detected species in paediatric acute respiratory
    infection.
  evidence:
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Three groups of HRVs are now genetically distinguished: group A, group B,
      and the more recently discovered group C
    explanation: >-
      Establishes the three-species division this entry's agent list follows.
      Evidence source is OTHER as this is a review.
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the cell surface receptor intercellular adhesion molecule 1 (ICAM-1),
      while the "minor group" attaches to and enters cells via the low-density
      lipoprotein receptor (LDLR)
    explanation: >-
      Supports the major-group and minor-group receptor split that the
      description attributes to groups A and B. Evidence source is OTHER as
      this is a review.
  - reference: PMID:35918790
    reference_title: >-
      Clinical characteristics, outcomes, and seasonality of acute respiratory
      infection associated with single and codetected rhinovirus species among
      hospitalized children in Amman, Jordan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RV-A accounted for about half of RV-positive cases (54.7%), while children
      with RV-C had a higher frequency of wheezing and reactive airway disease
    explanation: >-
      Quantifies this species' share of rhinovirus detections in hospitalised
      young children, against which the other two species are read.
- name: Rhinovirus B
  infectious_agent_term:
    preferred_term: Rhinovirus B
    term:
      id: NCBITaxon:147712
      label: Rhinovirus B
  description: >
    Human rhinovirus group B; like group A, most B-group serotypes are
    major-group viruses that use ICAM-1 for cell entry. Reported less often than
    group C in severe respiratory illness; nothing cited here places it below
    group A, and the reports that separate the species on severity at all are
    the contested set recorded on the RV-C subtype row, so no separate subtype
    row is curated for this species.
  evidence:
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Several early reports suggested that HRV-C causes more severe respiratory
      illness in adults and children as well as more asthma hospitalizations
      than HRV-A or -B
    explanation: >-
      The sentence on which the description's comparative claim rests, quoted
      with the review's own hedge intact. The quoted text describes human
      clinical reports that the citing review did not perform.
- name: Rhinovirus C
  infectious_agent_term:
    preferred_term: Rhinovirus C
    term:
      id: NCBITaxon:463676
      label: Rhinovirus C
  description: >
    Human rhinovirus group C, which uses cadherin-related family member 3
    (CDHR3) for cell entry and is reported to carry a higher frequency of
    wheezing and asthma exacerbation in children than the other two species.
    Curated as a disease-level stratum in has_subtypes, where the supporting
    and contrary evidence for that presentation difference is set out.
  evidence:
  - reference: PMID:25848009
    reference_title: >-
      Cadherin-related family member 3, a childhood asthma susceptibility gene
      product, mediates rhinovirus C binding and replication.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report here that expression of human cadherin-related family member 3
      (CDHR3) enables the cells normally unsusceptible to RV-C infection to
      support both virus binding and replication.
    explanation: >-
      Identifies CDHR3 as the entry receptor for this species. The experiment
      transfects the receptor into otherwise unsusceptible cell lines, so
      evidence_source is IN_VITRO.
transmission:
- name: Direct and fomite-mediated contact with self-inoculation
  description: >-
    Virus deposited on the hands of an infected person transfers to another
    person's hands directly or by way of a contaminated object, and infection
    follows when those hands are carried to the nose or the eye. Experimentally
    this is the most efficient of the routes tested.
  evidence:
  - reference: PMID:205151
    reference_title: Hand-to-hand transmission of rhinovirus colds.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support the concept that hand contact/self-inoculation may
      be an important natural route of rhinovirus transmission.
    explanation: >-
      The authors' conclusion from a volunteer transmission experiment in which
      hand contact initiated infection far more often than either aerosol route.
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HRV infection is efficiently initiated by intranasal and conjunctival
      inoculation but not by the oral route.
    explanation: >-
      Names the portals of entry that make hand-to-face self-inoculation the
      effective step, and excludes the oral route. Evidence source is OTHER as
      this is a review.
- name: Aerosol transmission
  description: >-
    Rhinovirus also passes between people in small- and large-particle aerosol.
    In the volunteer experiment that compared the routes head to head, aerosol
    exposure initiated infection far less often than hand contact, so it is a
    real but secondary route.
  evidence:
  - reference: PMID:23297263
    reference_title: Human rhinoviruses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HRVs are transmitted from person to person via contact (either direct or
      through a fomite) or aerosol (small or large particle)
    explanation: >-
      Enumerates aerosol alongside contact as a person-to-person route.
      Evidence source is OTHER as this is a review.
  - reference: PMID:205151
    reference_title: Hand-to-hand transmission of rhinovirus colds.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission of infection was very efficient by the hand route
    explanation: >-
      Quoted for the comparison it opens: the same experiment that found hand
      contact efficient found large- and small-particle aerosol exposure much
      less so, which is why aerosol is recorded here as the secondary route.
pathophysiology:
- name: Airway Epithelial Infection and Innate Immune Response
  conforms_to: "innate_antiviral_interferon_response#Interferon-Stimulated Gene Antiviral State"
  description: >
    Rhinovirus binds receptors on respiratory epithelial cells and replicates in
    the airway epithelium. Although cytopathic effect is modest, infection
    triggers a vigorous innate immune and inflammatory response — release of
    chemokines and cytokines that recruit inflammatory cells — which produces
    much of the symptomatic illness (rhinorrhea, congestion, cough). In people
    with asthma, impaired epithelial antiviral (interferon) responses and a
    type 2-skewed airway predispose to lower-airway involvement and
    exacerbations.
  cell_types:
  - preferred_term: respiratory epithelial cell
    term:
      id: CL:0002632
      label: epithelial cell of lower respiratory tract
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: nasal cavity
    term:
      id: UBERON:0001707
      label: nasal cavity
  - preferred_term: respiratory system
    term:
      id: UBERON:0001004
      label: respiratory system
  evidence:
  - reference: PMID:23297263
    reference_title: "Human rhinoviruses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human rhinoviruses (HRVs), first discovered in the 1950s, are responsible for more than one-half of cold-like illnesses and cost billions of dollars annually in medical visits and missed days of work."
    explanation: Establishes HRV as the predominant cause of common-cold illnesses with major economic burden.
  - reference: PMID:23297263
    reference_title: "Human rhinoviruses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the increasing implementation of PCR assays for respiratory virus detection in clinical laboratories has facilitated the recognition of HRV as a lower respiratory tract pathogen, particularly in patients with asthma, infants, elderly patients, and immunocompromised hosts."
    explanation: Supports HRV as a lower respiratory tract pathogen with particular impact in asthma, infants, the elderly, and immunocompromised hosts.

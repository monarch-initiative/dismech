treatments:
- name: Supportive Care
  description: >
    No approved antiviral therapy exists for HRV; management is supportive
    (symptomatic relief, hydration), with attention to treating asthma/COPD
    exacerbations that HRV can trigger.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23297263
    reference_title: "Human rhinoviruses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are currently no approved antiviral therapies for HRVs, and treatment remains primarily supportive."
    explanation: Confirms that no approved HRV antiviral exists and care is primarily supportive.
notes: >
  Created as an endpoint entry to support directional comorbidity/trajectory
  modeling of early-life rhinovirus wheezing illness as a predictor of
  childhood asthma inception (see Asthma.yaml and the corresponding
  comorbidity entry). MONDO lacks a rhinovirus-specific disease term, so the
  closest term (common cold, MONDO:0005709) is used with a more specific
  preferred_term.
review_notes: >-
  Deliberately lumped. Rhinovirus A and rhinovirus B are kept together under one
  entry after a rung-3 review against the six axes of design decisions section
  3e rule R7, and nothing separated them. Management is identical and
  supportive for every species, with no approved antiviral; clinical detection
  is a pan-rhinovirus molecular assay, so species typing is a sequencing step
  done in research and surveillance rather than in care; transmission is contact
  and aerosol for all three; and the review literature reports similar
  seasonality for groups A and B. Three PubMed searches were run and are
  re-runnable: "rhinovirus species B less frequently detected symptomatic
  illness prevalence molecular epidemiology", "rhinovirus species severity
  systematic review meta-analysis RV-C versus RV-A clinical outcome" and
  "rhinovirus species clinical outcomes hospitalized children comparison
  species A C" all returned no hits, while "rhinovirus species associated with
  hospitalizations young children" returned the two paediatric cohorts cited on
  the RV-C subtype row and nothing separating A from B on presentation,
  diagnosis, therapy, prognosis, transmission or geography. The one comparative
  figure found is viremia in 3 percent of RV-A against 0 percent of RV-B
  infections among children with severe respiratory illness, reported in the
  review cached as PMID:23297263 from a single study; it is a laboratory
  finding rather than a clinical distinction, so it is not curated as a
  differentiating axis. Rhinovirus C is split out
  instead, on the diagnosis axis, which is uncontested, and on a contested
  presentation axis whose supporting and refuting evidence both sit on that row.
  Rule R10 makes this additive: if a series separates A from B on one of the six
  axes, the rows are added then.

datasets:
- accession: geo:GSE206680
  title: RHINOVIRUS INFECTION OF THE AIRWAY EPITHELIUM ENHANCES MAST CELL IMMUNE RESPONSES VIA EPITHELIAL-DERIVED INTERFERONS
  description: 'Rationale: Mast cells (MCs) within the airway epithelium in asthma are closely related to airway dysfunction, but crosstalk between airway epithelial cells (AECs) and MCs in asthma remains incompletely understood. Human rhinovirus (HRV) infections are key triggers for asthma progression and AECs from individuals with asthma may have dysregulated anti-viral responses. Objectives: We utilize primary phenotyped AECs in an ex vivo coculture model system to examine crosstalk between AECs and MCs following epithelial HRV infection.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 123
  publication: PMID:36708815
  notes: Identified by GEO DataSets index search for Rhinovirus Infection (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE118875
  title: Acute rhinovirus infection induces extensive antiviral and B cell receptor gene expression in B cells from asthmatics
  description: B cells of asthmatic patients have dysregulated expression of inflammatory cytokine, B cell receptor and antiviral genes at a steady-state. During experimental in vivo infection of human subjects with rhinovirus, interferon-induced antiviral response is exaggerated in B cells in asthmatic patients.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 61
  publication: PMID:34169553
  notes: Identified by GEO DataSets index search for Rhinovirus Infection (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE138167
  title: RNA sequencing of primary bronchial airway epithelial cells from young children with and without CF, including those with and without rhinovirus infection in vitro
  description: Early life viral infections are responsible for pulmonary exacerbations that can contribute to disease progression in young children with CF. The most common respiratory viruses detected in the CF airway are human rhinoviruses (RV) and susceptibility to infection has been attributed to dysregulated airway epithelial responses, although evidence has been conflicting. Here, we exposed airway epithelial cells from children with and without CF to RV in vitro. Using RNA-Seq, we profiled the transcriptomic differences of CF and non-CF airway epithelial cells at baseline and in response to RV. There were only modest differences between CF and non-CF cells at baseline.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 24

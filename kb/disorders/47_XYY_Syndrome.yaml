name: 47,XYY Syndrome
creation_date: '2026-08-22T00:00:00Z'
description: >-
  47,XYY syndrome is a sex-chromosome aneuploidy with an additional Y chromosome, usually arising sporadically
  from paternal meiotic nondisjunction; 46,XY/47,XYY mosaicism can arise postzygotically. It occurs in
  approximately 1 in 1,000 male live births and is often unrecognized clinically. Expression varies from
  few apparent difficulties to language, learning, attention and social-communication impairments. Average
  height is increased, with variably present macrocephaly, macroorchidism, hypotonia, hypertelorism, clinodactyly
  and tremor. Asthma and seizures occur in clinical cohorts; genotype-first adult cohorts also associate
  XYY with venous disease, glaucoma and metabolic morbidity. Most measured childhood testosterone values
  are normal, and neither behavioral difficulties nor infertility is universal. Better average cognitive
  outcomes in prenatally ascertained cohorts are subject to referral and age differences and do not demonstrate
  a causal benefit of prenatal diagnosis.
category: Genetic
synonyms:
- XYY syndrome
- Jacobs syndrome
- 47,XYY karyotype
- double Y syndrome
parents:
- chromosomal disorder
disease_term:
  preferred_term: 47,XYY syndrome
  term:
    id: MONDO:0019339
    label: 47,XYY syndrome
prevalence:
- population: Male live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: >-
    Approximate male-live-birth prevalence of 1 in 1,000, reported as background in a prenatal follow-up
    study. Clinical underrecognition does not imply uniformly normal development. A separate genotype-first
    adult study found no recorded XYY diagnosis in 98.6% of its 1,108 XYY participants; that cohort-specific
    documentation fraction is not a birth-prevalence estimate.
  evidence:
  - reference: PMID:23034220
    reference_title: >-
      Early manifestations in a cohort of children prenatally diagnosed with 47,XYY. Role of multidisciplinary
      counseling for parental guidance and prevention of aggressive behavior.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 47, XYY karyotype occurs in about one out of 1,000 newborn males
    explanation: Provides the ~1 in 1,000 male birth prevalence.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:40840450
    reference_title: >-
      Phenome-wide association study of male and female sex chromosome trisomies in 1.5 million participants
      of MVP, FinnGen, and UK Biobank.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We identified 2,769 individuals with SCTs (47,XXY: 1,319; 47,XYY: 1,108; and 47,XXX: 342), most
      of whom had no documented clinical diagnosis (47,XXY: 73.8%; 47,XYY: 98.6%; and 47,XXX: 93.6%).
    explanation: Records underrecognition among genotyped adult participants, separately from male birth prevalence.
pathophysiology:
- name: Additional Y Chromosome
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A whole additional Y chromosome creates the 47,XYY complement and increases genomic copy number of
    Y-linked and shared pseudoautosomal loci.
  evidence:
  - &id009
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557699/
    reference_title: Jacobs Syndrome - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Jacobs syndrome is not an inherited condition and most commonly arises during meiosis II in the
      father, at which time an extra Y chromosome is attributed to the resultant sperm.
    explanation: Describes the usual sporadic paternal meiotic origin of the extra Y chromosome.
  downstream:
  - target: Increased Pseudoautosomal Gene Copy Number
    causal_link_type: DIRECT
    description: The extra Y adds a third copy of loci shared by the X and Y pseudoautosomal regions.
    evidence:
    - &id001
      reference: PMID:40494628
      reference_title: >-
        An iPSC-based model of 47,XYY Jacobs syndrome reveals a DNA methylation-independent transcriptional
        dysregulation shared with male X aneuploid cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        Biallelic expressed SNPs mapping to the PAR1 region in JS samples were distributed around the
        values 30% and 60%, suggesting that the X and the two identical Y Chromosomes contribute similarly
        to the total expression level of the PAR1 transcripts.
      explanation: >-
        Allele-specific RNA measurements support biallelic PAR1 expression consistent with additional
        Y-derived dosage. The two identical Y copies are not individually resolved, and SHOX expression
        in growth plates was not measured.
  - target: Y-Linked Gene Overexpression
    causal_link_type: DIRECT
    description: >-
      An extra Y is associated with predominantly increased expression of Y-linked genes in the studied
      patient-derived cells; dosage compensation is gene- and cell-specific.
    evidence:
    - &id003
      reference: PMID:40494628
      reference_title: >-
        An iPSC-based model of 47,XYY Jacobs syndrome reveals a DNA methylation-independent transcriptional
        dysregulation shared with male X aneuploid cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        Importantly, all NPY DEGs were upregulated in the three cell types except for MXRA5Y, a pseudogene
        of the X-linked gene MXRA5, which was downregulated in fibroblasts
      explanation: >-
        RNA sequencing of patient-derived fibroblasts, iPSCs and neural stem cells identifies predominantly
        increased non-pseudoautosomal Y-linked expression. The claim concerns differentially expressed
        genes, not uniform doubling of every Y gene.
  - target: Cell-Type-Specific Transcriptional Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The XYY complement is associated with broad transcriptional changes beyond the sex chromosomes;
      the responsible trans-regulatory intermediates are incompletely resolved.
    evidence:
    - &id005
      reference: PMID:40494628
      reference_title: >-
        An iPSC-based model of 47,XYY Jacobs syndrome reveals a DNA methylation-independent transcriptional
        dysregulation shared with male X aneuploid cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: >-
        The differential expression analysis (DEA) performed on 47,XYY and 46,XY karyotypes identified
        1838, 1789, and 4413 differentially expressed genes (DEGs) in fibroblasts, iPSCs and NSCs, respectively
      explanation: >-
        Establishes broad, cell-context-dependent transcriptional differences, without proving that UTY
        alone causes the entire signature or that a specific clinical manifestation follows.
- name: Increased Pseudoautosomal Gene Copy Number
  biological_scale: MOLECULAR
  description: >-
    Nonmosaic XYY cells carry three copies of shared pseudoautosomal genes, including SHOX. Allelic expression
    analyses in cultured cells show biallelic expression ratios consistent with additional Y-derived dosage
    and gene-specific expression differences. Identical Y copies are not individually resolved.
  genes:
  - preferred_term: SHOX
    term:
      id: hgnc:10853
      label: SHOX
  evidence:
  - *id001
  downstream:
  - target: SHOX Dosage Contribution to Linear Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Additional SHOX dosage is a proposed mediator of increased stature, supported by established SHOX
      biology and human chromosome-dosage associations rather than an XYY growth-plate perturbation experiment.
    evidence:
    - &id002
      reference: PMID:23810129
      reference_title: '47,XYY syndrome: clinical phenotype and timing of ascertainment.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: >-
        For example, tall stature is related to the extra copy of the short stature homeobox gene40 in
        the pseudoautosomal region of the extra Y chromosome.
      explanation: >-
        The authors attribute increased stature to extra SHOX dosage using prior biological evidence;
        this cohort did not experimentally manipulate SHOX.
- name: SHOX Dosage Contribution to Linear Growth
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The third SHOX copy is a plausible contributor to increased linear growth. Human height associations
    support a dosage effect, but do not establish SHOX as the only mediator or quantify its expression
    in XYY growth plates.
  genes:
  - preferred_term: SHOX
    term:
      id: hgnc:10853
      label: SHOX
  evidence:
  - *id002
  - &id006
    reference: PMID:40388606
    reference_title: 'X and Y gene dosage effects are primary contributors to human sexual dimorphism: The case of height.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      By examining 1,225 individuals with SCAs identified among 928,605 biobank participants, we found
      that increased Y chromosome dosage conferred a larger effect on height than increased X chromosome
      dosage
    explanation: >-
      Adult genotype-first analysis supports a sex-chromosome dosage contribution to height. It does not
      isolate SHOX as the sole mediator; male sex hormone status was modeled with a proxy rather than
      measured hormone concentrations.
  notes: >-
    The 2025 study estimates a 3.1-cm contrast between modeled Y and inactive-X contributions, not a 3.1-cm
    XYY-versus-XY effect. Its binary male-hormone proxy does not provide complete endocrine adjustment.
  downstream:
  - target: Tall Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SHOX dosage may contribute to increased linear growth; downstream growth-plate effects were not
      directly measured in these XYY cohorts.
    evidence:
    - *id002
- name: Y-Linked Gene Overexpression
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Most differentially expressed non-pseudoautosomal Y genes are increased in XYY fibroblasts, iPSCs
    and neural stem cells. X-homolog responses differ by gene pair; a universal compensatory or twofold-expression
    rule is unsupported.
  genes:
  - preferred_term: UTY
    term:
      id: hgnc:12638
      label: UTY
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: INCREASED
  evidence:
  - *id003
  downstream:
  - target: UTY-Dependent KDM6A Upregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      UTY perturbation changes KDM6A expression in the studied male pluripotent cells, but a direct versus
      indirect regulatory route is unresolved.
    evidence:
    - &id004
      reference: PMID:40494628
      reference_title: >-
        An iPSC-based model of 47,XYY Jacobs syndrome reveals a DNA methylation-independent transcriptional
        dysregulation shared with male X aneuploid cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: KDM6A mRNAs and protein levels were significantly decreased in multiple 47,XYY UTY−/− iPSC clones
      explanation: >-
        CRISPR disruption of UTY reduced KDM6A RNA and protein in XYY iPSCs. Male-cell UTY overexpression
        also increased KDM6A; these perturbations support an expression dependency without identifying
        a direct promoter mechanism.
- name: UTY-Dependent KDM6A Upregulation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In XYY iPSCs, increased KDM6A expression depends in part on UTY. UTY knockout reduces KDM6A RNA and
    protein, whereas UTY overexpression increases KDM6A in male embryonic stem cells. Equivalent induction
    was not observed in the tested female cell line.
  genes:
  - preferred_term: UTY
    term:
      id: hgnc:12638
      label: UTY
  - preferred_term: KDM6A
    term:
      id: hgnc:12637
      label: KDM6A
  evidence:
  - &id010
    reference: PMID:40494628
    reference_title: >-
      An iPSC-based model of 47,XYY Jacobs syndrome reveals a DNA methylation-independent transcriptional
      dysregulation shared with male X aneuploid cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      The histone demethylase KDM6A and USP9X follow the same expression trend of their Y homologs (UTY
      and USP9Y) and are upregulated in iPSCs and NSCs.
    explanation: Documents the higher KDM6A expression state in patient-derived pluripotent and neural stem cells.
  - *id004
  notes: >-
    The molecular dependency is experimentally supported in cultured cells. The study does not establish
    changed histone-demethylase activity, a direct promoter interaction, clinical causation, or therapeutic
    rescue. UTY siRNA cross-reacted with KDM6A, so the CRISPR and overexpression experiments are the stronger
    support.
- name: Cell-Type-Specific Transcriptional Dysregulation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Patient-derived XYY fibroblasts, iPSCs and neural stem cells show distinct widespread transcriptional
    changes, including autosomal loci. Some signatures overlap XXY cells. Expression and enrichment results
    nominate mechanisms for investigation without demonstrating a specific neuronal functional deficit.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  evidence:
  - *id005
  notes: >-
    The study derives XYY cultures from three patient donors; clone counts are not independent patient
    counts. GO enrichment does not prove altered axon guidance or neuronal migration. Only 63 differential
    methylation regions were detected in iPSCs versus 4,197 in fibroblasts, so limited methylation changes
    in iPSCs do not establish methylation independence in every tissue. No causal edge to autism or language
    impairment is asserted from these experiments.

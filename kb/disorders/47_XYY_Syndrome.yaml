name: 47,XYY Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  47,XYY syndrome is a sex-chromosome aneuploidy in which males carry an additional
  Y chromosome, usually arising from paternal meiotic nondisjunction or a
  postzygotic event. It occurs in about 1 in 1,000 newborn males but is frequently
  undiagnosed because most affected males have largely normal development. The
  phenotype commonly includes tall stature, macrocephaly, macroorchidism,
  hypotonia, hypertelorism, and tremor, with increased rates of speech and language
  delay, learning difficulties, and neurodevelopmental/behavioral conditions
  (attention problems, autism spectrum disorder), and modest increases in asthma
  and seizures. Cognitive outcomes are better in prenatally diagnosed boys.
category: Genetic
synonyms:
- XYY syndrome
- Jacobs syndrome
- 47,XYY karyotype
- double Y syndrome
parents:
- hereditary disease
- chromosomal disorder

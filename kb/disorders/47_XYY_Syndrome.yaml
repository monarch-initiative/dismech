updated_date: '2026-09-21T03:40:00Z'
notes: >-
  Clinical-series proportions below describe their stated referral populations rather than population
  penetrance. The principal pediatric study included 90 nonmosaic males aged 0.5–36.5 years at two specialty
  centers (35 prenatal and 55 postnatal diagnoses). Adult biobank associations describe coded comorbidities
  in selected populations, not inevitable manifestations or established causal pathways. The molecular
  links from Y dosage to most clinical findings remain unresolved; disconnected phenotypes are retained
  without invented causal intermediates.
inheritance:
- name: Usually sporadic chromosome nondisjunction
  expressivity: VARIABLE
  description: >-
    Usually a de novo paternal meiotic event; postzygotic nondisjunction can produce 46,XY/47,XYY mosaicism.
    This is not Mendelian Y-linked inheritance. Clinical expression varies substantially.
  evidence:
  - *id009
  - *id011
has_subtypes:
- name: Nonmosaic 47,XYY
  description: >-
    The additional Y chromosome is present in the tested cell population without a detected 46,XY cell
    line; detection remains dependent on the tissue and assay examined.
  evidence:
  - *id009
- name: Mosaic 46,XY/47,XYY
  description: >-
    Coexisting XY and XYY cell populations following a postzygotic event. A measured mosaic fraction in
    one tissue does not establish a precise clinical prognosis.
  evidence:
  - *id011
differential_diagnoses:
- name: Klinefelter Syndrome
  description: Another sex-chromosome trisomy that may present with tall stature and learning or reproductive difficulties.
  distinguishing_features:
  - >-
    47,XXY rather than 47,XYY on chromosome analysis; small testes and hypogonadism are more characteristic
    of XXY.
  evidence:
  - reference: PMID:40840450
    reference_title: >-
      Phenome-wide association study of male and female sex chromosome trisomies in 1.5 million participants
      of MVP, FinnGen, and UK Biobank.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Notable exceptions to this include infertility, gynecomastia, and osteoporosis, which were associated
      with 47,XXY (both diagnosed and undiagnosed) but not 47,XYY.
    explanation: >-
      Distinguishes adult comorbidity profiles in the same genotype-first study without implying these
      findings are impossible in XYY.
- name: Sotos Syndrome
  description: Overgrowth, macrocephaly, learning difficulties and hypotonia may overlap.
  distinguishing_features:
  - >-
    An NSD1-related disorder rather than an extra Y chromosome; molecular and cytogenetic testing distinguish
    the diagnoses.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557699/
    reference_title: Jacobs Syndrome - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Hallmark features include excessive growth during childhood, macrocephaly, learning disabilities,
      hypotonia, and seizure disorders.
    explanation: The Sotos differential paragraph identifies the overlapping overgrowth and developmental features.
- name: Marfan Syndrome
  description: Tall stature can overlap, with connective-tissue manifestations directing the differential assessment.
  distinguishing_features:
  - >-
    Aortic-root disease and other connective-tissue findings favor Marfan syndrome; targeted evaluation
    and genetic testing are used when indicated. A normal echocardiogram alone does not exclude it.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557699/
    reference_title: Jacobs Syndrome - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      Marfan syndrome is a connective tissue disorder that, in contrast to Jacobs syndrome, often presents
      with cardiac abnormalities such as aortic root dilatation and mitral valve prolapse.
    explanation: Identifies aortic and valvular findings relevant to the differential.
clinical_trials:
- name: NCT07718997
  description: >-
    TRICXY-SMT is a single-group, multiple-baseline feasibility study of ten sessions of online Social
    Management Training in people with sex-chromosome aneuploidies, including XYY. Mental health is the
    primary outcome, with executive and social/autism measures as secondary outcomes.
  phase: PHASE_I
  status: RECRUITING
  evidence:
  - reference: clinicaltrials:NCT07718997
    reference_title: >-
      A Multiple Baseline Feasibility Trial of Social Management Training for People With Sex Chromosome
      Aneuploidies
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We will examine is Social Management Training, a 10-session group-based psychosocial intervention
      will improve the primary outcome mental health, and secondary outcomes executive functions and autism
      symptoms, in a multiple baseline design with 3 pre-measurement points and 3 post-measurement points
      spanning 30 weeks, including the 10 weeks of intervention.
    explanation: Registry description of the planned intervention and outcomes, not evidence of clinical efficacy.
  - reference: url:https://clinicaltrials.gov/api/v2/studies/NCT07718997
    reference_title: https://clinicaltrials.gov/api/v2/studies/NCT07718997
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Genetically confirmed SCA. Participants provide medical confirmation of diagnosis, unless participants
      are recruited via Frambu (where medical confirmation is available in the user registry for KS 47,XXY
      karyotype; Jacobs 47,XYY karyotype; Triple X, 47,XXX karyotype; and Turner 45,X karyotype).
    explanation: The full protocol explicitly includes XYY alongside other sex-chromosome aneuploidies.
  notes: >-
    Recruiting status and registry phase designation verified on 2026-09-21 against the July 2026 posted
    record. Estimated enrollment is 30 across eligible aneuploidies, not 30 XYY participants; no results
    are posted. PHASE_I reproduces the registry designation for this behavioral feasibility study. The
    structured and narrative upper age limits differ, so no fixed eligibility age is inferred here.
review_notes: >-
  Reviewed the full Bardsley and Lalatta clinical articles, the Astro cellular study, adult height and
  PheWAS analyses, genotype-first ASD study, ART pilot, prenatal-screening study, StatPearls clinical
  chapter and current trial protocol. Referral/volunteer selection, age differences, assay context and
  table denominators constrain each conclusion. Excluded unsupported universal frequency bands, candidate-gene
  assertions of proven autism causation, NIPT-as-diagnosis wording, deterministic criminality/testosterone
  explanations, PGT-equivalence claims and routine VTE prophylaxis. The original study records language
  problems and care needs but does not prove counseling prevents aggression. StatPearls is used for supported
  counseling and clinical evaluation statements; its claim that NIPT replaces diagnostic cytogenetics
  and its suggestion that normal cardiac tests exclude Marfan syndrome are not adopted.
experimental_models:
- name: Patient-derived XYY pluripotent and neural stem-cell cultures
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Fibroblasts from three nonmosaic XYY donors were reprogrammed to iPSCs and differentiated to neural
    stem cells, with XY comparisons. Transcriptomic analyses span fibroblasts, pluripotent cells and neural
    stem cells; UTY perturbation experiments use pluripotent cultures.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:40494628
  modeled_mechanisms:
  - target: Y-Linked Gene Overexpression
    relationship: MEASURES
    model_scale: CELLULAR
    fidelity: LOW
    description: RNA sequencing compares non-pseudoautosomal Y-linked expression in XYY and XY cultures.
    limitations: >-
      Only three XYY donor backgrounds were studied. Clones are not independent patients; pluripotent
      and neural stem cells do not establish mature-neuron or behavioral phenotypes. UTY knockout is an
      experimental perturbation, not a clinical rescue.
    evidence:
    - *id003
    readouts:
    - name: Y-linked differential transcript abundance
      target: Y-Linked Gene Overexpression
      direction: INCREASED
      interpretation: >-
        Direction is relative to the matched comparison used in the experiment; the knockout readout is
        relative to UTY-intact XYY iPSCs.
      evidence:
      - *id003
  - target: Cell-Type-Specific Transcriptional Dysregulation
    relationship: MEASURES
    model_scale: CELLULAR
    fidelity: LOW
    description: >-
      RNA sequencing identifies distinct expression signatures in fibroblast, pluripotent and neural stem-cell
      contexts.
    limitations: >-
      Only three XYY donor backgrounds were studied. Clones are not independent patients; pluripotent
      and neural stem cells do not establish mature-neuron or behavioral phenotypes. UTY knockout is an
      experimental perturbation, not a clinical rescue.
    evidence:
    - *id005
    readouts:
    - name: Cell-type-specific differential expression
      target: Cell-Type-Specific Transcriptional Dysregulation
      direction: ALTERED
      interpretation: >-
        Direction is relative to the matched comparison used in the experiment; the knockout readout is
        relative to UTY-intact XYY iPSCs.
      evidence:
      - *id005
  - target: UTY-Dependent KDM6A Upregulation
    relationship: PERTURBS
    model_scale: CELLULAR
    fidelity: LOW
    description: CRISPR disruption of UTY in XYY iPSCs tests its contribution to KDM6A RNA and protein abundance.
    limitations: >-
      Only three XYY donor backgrounds were studied. Clones are not independent patients; pluripotent
      and neural stem cells do not establish mature-neuron or behavioral phenotypes. UTY knockout is an
      experimental perturbation, not a clinical rescue.
    evidence:
    - *id004
    readouts:
    - name: KDM6A RNA and protein after UTY knockout
      target: UTY-Dependent KDM6A Upregulation
      direction: DECREASED
      interpretation: >-
        Direction is relative to the matched comparison used in the experiment; the knockout readout is
        relative to UTY-intact XYY iPSCs.
      evidence:
      - *id004
  notes: >-
    Companion embryonic stem-cell overexpression experiments show context-dependent UTY–KDM6A regulation.
    No clinical treatment effect, mature-neuron functional assay or proof of a gene-specific autism mechanism
    follows from this model.

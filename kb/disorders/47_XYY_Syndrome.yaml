    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Most of the boys had testicular volume that was greater than average for age (>0 SDS) in 64/82 (78%),
      and significantly above average (>2 SD) in 41/82 (50%).
    explanation: Quantifies age-adjusted testicular enlargement.
  - reference: PMID:23810129
    reference_title: '47,XYY syndrome: clinical phenotype and timing of ascertainment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Thirty-nine of 42 boys with XYY (93%) had testosterone levels in the normal range for age and pubic
      hair Tanner staging.
    explanation: Shows that testicular enlargement does not imply routine androgen excess.
  notes: >-
    Testicular volume exceeded 2 SD in 41/82; most measured testosterone values were age-appropriate.
    Macroorchidism does not establish precocious puberty or preserved/impaired fertility in an individual.

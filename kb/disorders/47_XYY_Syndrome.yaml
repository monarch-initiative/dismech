    label: 47,XYY syndrome
prevalence:
- population: Male live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: >-
    About 1 in 1,000 newborn males; one of the most common sex-chromosome
    aneuploidies. Frequently undiagnosed unless detected on prenatal testing,
    because postnatal development is largely normal.
  evidence:
  - reference: PMID:23034220
    reference_title: "Early manifestations in a cohort of children prenatally diagnosed with 47,XYY. Role of multidisciplinary counseling for parental guidance and prevention of aggressive behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "47, XYY karyotype occurs in about one out of 1,000 newborn males"
    explanation: Provides the ~1 in 1,000 male birth prevalence.
pathophysiology:
- name: Additional Y Chromosome (47,XYY)
  biological_scale: MOLECULAR
  description: >-
    Presence of an extra Y chromosome, usually from paternal meiotic-II
    nondisjunction or a postzygotic mitotic event, raising the dosage of Y-linked
    and pseudoautosomal genes.
  evidence:
  - reference: PMID:23810129
    reference_title: "47,XYY syndrome: clinical phenotype and timing of ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The XYY phenotype commonly includes tall stature, macrocephaly, macroorchidism, hypotonia, hypertelorism, and tremor."
    explanation: Summarizes the recurrent 47,XYY physical phenotype resulting from the extra Y chromosome.
  downstream:
  - target: Increased Sex-Chromosome Gene Dosage
    causal_link_type: DIRECT
    description: The extra Y raises the dosage of pseudoautosomal (e.g., SHOX) and Y-linked genes.
- name: Increased Sex-Chromosome Gene Dosage
  biological_scale: MOLECULAR
  description: >-
    Increased dosage of pseudoautosomal genes (notably SHOX, in the region shared
    by X and Y) contributes to the overgrowth/tall stature, while broader
    sex-chromosome dosage effects contribute to neurodevelopmental vulnerability.
  biological_processes:
  - preferred_term: multicellular organism growth
    term:
      id: GO:0035264
      label: multicellular organism growth
    modifier: INCREASED
  evidence:
  - reference: PMID:23810129
    reference_title: "47,XYY syndrome: clinical phenotype and timing of ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Macrocephaly (head circumference >2 SD) was noted in 28/84 (33%), hypotonia in 57/90 (63%), clinodactyly in 47/90 (52%), and hypertelorism in 53/90 (59%)."
    explanation: Quantifies the physical features attributed to the extra sex-chromosome dosage.
  downstream:
  - target: Tall Stature
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - pseudoautosomal SHOX dosage
  - target: Neurodevelopmental Vulnerability
    causal_link_type: DIRECT
- name: Neurodevelopmental Vulnerability
  biological_scale: ORGANISM
  description: >-
    Increased rates of speech/language delay, learning difficulties, and
    neurodevelopmental/behavioral conditions (attention problems, autism spectrum
    disorder), with generally normal-range intelligence.
  evidence:
  - reference: PMID:23034220
    reference_title: "Early manifestations in a cohort of children prenatally diagnosed with 47,XYY. Role of multidisciplinary counseling for parental guidance and prevention of aggressive behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Language delay was detected in 8 out of 11 children older than 20 months."
    explanation: Documents frequent language delay in prenatally diagnosed 47,XYY boys.
  downstream:
  - target: Delayed Speech and Language Development
    causal_link_type: DIRECT
  - target: Autistic Behavior
    causal_link_type: DIRECT

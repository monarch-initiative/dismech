genetic:
- name: 47,XYY karyotype (extra Y chromosome)
  association: Causal
  notes: >-
    An additional Y chromosome (copy-number gain), usually from paternal meiotic-II
    nondisjunction or a postzygotic mitotic event; mosaic 46,XY/47,XYY also occurs.
    No coordinate slot exists in the schema; the whole-chromosome gain is recorded
    here in prose.
  evidence:
  - reference: PMID:23034220
    reference_title: "Early manifestations in a cohort of children prenatally diagnosed with 47,XYY. Role of multidisciplinary counseling for parental guidance and prevention of aggressive behavior."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "47, XYY karyotype occurs in about one out of 1,000 newborn males"
    explanation: Identifies the causal 47,XYY karyotype and its birth frequency.
- name: SHOX
  association: Pseudoautosomal region gene
  notes: >-
    Short-stature homeobox gene in the pseudoautosomal region shared by X and Y; an
    extra copy increases SHOX dosage and is the candidate driver of the tall
    stature seen in 47,XYY (as an inverse of SHOX haploinsufficiency causing short
    stature).
diagnosis:
- name: Karyotype Analysis
  presence: 47,XYY
  notes: Confirmed by karyotype; increasingly ascertained prenatally, where cognitive outcomes are better.
  evidence:
  - reference: PMID:23810129
    reference_title: "47,XYY syndrome: clinical phenotype and timing of ascertainment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatally diagnosed boys scored significantly better on cognitive testing and were less likely to be diagnosed with ASD (P < .01)."
    explanation: Documents the effect of timing of ascertainment (prenatal vs postnatal) on outcomes.

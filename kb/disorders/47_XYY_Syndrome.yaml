genetic:
- name: 47,XYY chromosome complement
  association: Causal whole-chromosome gain
  relationship_type: CAUSATIVE
  notes: >-
    An additional Y chromosome, generally sporadic; mosaic 46,XY/47,XYY is also recognized. The karyotype
    does not determine an individual cognitive, behavioral or reproductive outcome.
  evidence:
  - *id009
  - &id011
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK557699/
    reference_title: Jacobs Syndrome - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      An alternate and less common form of this condition is 46,XY/47,XYY mosaicism, which arises during
      early embryonic development.
    explanation: Distinguishes postzygotic mosaicism from the usual nonmosaic complement.
- name: SHOX
  gene_term:
    preferred_term: SHOX
    term:
      id: hgnc:10853
      label: SHOX
  association: Candidate dosage contribution to increased stature
  notes: >-
    The extra Y adds a third SHOX copy. Human chromosome-height associations support a dosage hypothesis
    without isolating SHOX as the sole clinical mediator.
  evidence:
  - *id002
  - *id006
- name: UTY
  gene_term:
    preferred_term: UTY
    term:
      id: hgnc:12638
      label: UTY
  association: Experimental expression regulator
  notes: >-
    Patient-derived pluripotent-cell experiments support a UTY-dependent KDM6A expression relationship,
    not a monogenic explanation of all XYY manifestations.
  evidence:
  - *id004
- name: KDM6A
  gene_term:
    preferred_term: KDM6A
    term:
      id: hgnc:12637
      label: KDM6A
  association: Dosage-responsive X homolog in cultured XYY cells
  notes: >-
    Upregulated in XYY iPSCs and neural stem cells, with reduced RNA/protein after UTY knockout. This
    is an expression effect, not an additional KDM6A copy or a germline KDM6A sequence disorder.
  evidence:
  - *id010
  - *id004

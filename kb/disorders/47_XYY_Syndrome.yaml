      label: Autistic behavior
  evidence:
  - reference: PMID:23810129
    reference_title: '47,XYY syndrome: clinical phenotype and timing of ascertainment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Other diagnoses included ASDs (26/90 [29%] combined, 11% prenatal vs 40% postnatal, P < .004), anxiety
      (23/90 [26%]), depression (13%), bipolar disorder (8%), and oppositional defiant disorder (6%).
    explanation: Records the observed ASD diagnostic history in a selected clinical cohort.
  - reference: PMID:39406744
    reference_title: >-
      A genome-first study of sex chromosome aneuploidies provides evidence of Y chromosome dosage effects
      on autism risk.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      We observed that both 47, XYY (OR, 3.2; 95% CI, 2.3–4.4) and 47, XXY (OR, 1.8; 95% CI, 1.3–2.4)
      were associated with increased ASD risk
    explanation: >-
      The pooled case-control analysis associates XYY with ASD diagnosis relative to XY. This odds ratio
      is not an ASD prevalence or a gene-specific molecular mechanism.
  notes: >-
    ASD history occurred in 26/90 in the pediatric referral cohort. A genotype-first case-control study
    found XYY-versus-XY OR 2.4 (95% CI 1.6–3.5), and pooling with iPSYCH gave OR 3.2 (2.3–4.4). Pediatric
    case versus adult volunteer control ascertainment and age/ancestry differences limit inference. Prenatal/postnatal
    diagnostic-history differences do not prove that prenatal diagnosis prevents ASD; questionnaire/interview
    cutoff proportions were not significantly different in the clinical study.

      A Meta-analysis and Systematic Review.
    found_in:
      - Autoimmune_Retinopathy-deep-research-falcon.md
    findings:
      - statement: >-
          Systemic therapy slows VA loss (RR = 0.04), VF loss (RR = 0.01), and CME
          (RR = 0.02).
        supporting_text: >-
          Systemic therapy slows VA loss (risk ratio [RR] = 0.04, 95% confidence
          interval [0.00, 0.91], P = 0.04), VF loss (RR = 0.01, 95% confidence
          interval [0.00, 0.14], P = 0.0007), and CME (RR = 0.02, 95% confidence
          interval [0.00, 0.34], P = 0.007).
      - statement: >-
          Biologics slow VA loss (RR = 0.28), VF loss (RR = 0.25), and CRT loss
          (RR = 0.19).
        supporting_text: >-
          Biologics slow VA loss (RR = 0.28, 95% confidence interval [0.12, 0.65],
          P = 0.003), VF loss (RR = 0.25, 95% confidence interval [0.15, 0.42],
          P < 0.00001), and CRT loss (RR = 0.19, 95% confidence interval [0.04, 0.79],
          P = 0.02).

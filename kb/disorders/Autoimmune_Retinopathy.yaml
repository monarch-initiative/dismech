    found_in:
      - Autoimmune_Retinopathy-deep-research-falcon.md
    findings:
      - statement: >-
          The variety of local and systemic treatment options makes interpretation of
          clinical effectiveness difficult in paraneoplastic retinopathies.
        supporting_text: >-

      and outcomes (2010-2023).
    found_in:
      - Autoimmune_Retinopathy-deep-research-falcon.md
    findings:
      - statement: >-
          Visual impairment was bilateral in over 90% of cases across the six
          paraneoplastic ocular syndromes reviewed; the most frequent malignancies
          were lung, gynecological, and melanoma.
        supporting_text: >-
          Visual impairment was bilateral in over 90% of cases. The most frequently
          associated malignancies were lung cancers (notably small-cell lung
          carcinoma), gynecological cancers, and melanoma.
      - statement: >-
          Visual prognosis was especially poor in CAR, with 49.1% of patients
          experiencing worsening vision.
        supporting_text: >-
          Visual prognosis varied but was especially poor in CAR, for which 49.1% of
          patients experienced worsening vision.

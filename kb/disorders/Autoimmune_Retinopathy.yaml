          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: >-
            AIR comprises a group of rare autoimmune disorders causing retinal degeneration,
            characterized by rapid vision deterioration linked to circulating anti-retinal
            autoantibodies (ARAs).
          explanation: >-
            The review characterises AIR as a group of autoimmune disorders driven
            by circulating autoantibodies, placing it in Harrison's Immune-Mediated,
            Inflammatory, and Rheumatologic Part. Note that the Harrison's Part
            vocabulary has no ophthalmology Part, so the immune Part is also the
            most specific organ-system home available for this entity.

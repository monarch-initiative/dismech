  - reference: PMID:34562437
    title: >-
      Broad locations of antigenic regions for anti-TRPM1 autoantibodies in
      paraneoplastic retinopathy with retinal ON bipolar cell dysfunction.
    found_in:
      - Autoimmune_Retinopathy-deep-research-falcon.md
    findings:
      - statement: >-
          CARBD, including MAR, is caused by autoantibodies against molecules expressed
          in ON bipolar cells, including TRPM1.
        supporting_text: >-
          Cancer-associated retinal ON bipolar cell dysfunction (CARBD), which includes
          melanoma-associated retinopathy (MAR), has been reported to be caused by
          autoantibodies against the molecules expressed in ON bipolar cells, including
          TRPM1.
      - statement: >-
          Antigenic regions for anti-TRPM1 autoantibodies are spread across the
          N-terminal intracellular, transmembrane-containing, and C-terminal
          intracellular domains of TRPM1.
        supporting_text: >-
          The antigen regions were spread over the entire TRPM1 protein: five sera in
          the N-terminal intracellular domain, six sera in the transmembrane-containing
          region, and six sera in the C-terminal intracellular domain.
  - reference: PMID:16444517

  - reference: PMID:36608670
    reference_title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: The TFE3 and MITF master transcription factors maintain metabolic homeostasis by regulating lysosomal, melanocytic, and autophagy genes.
    explanation: States the normal target gene classes of TFE3.
  - reference: PMID:32409512
    reference_title: De novo mutations in the X-linked TFE3 gene cause intellectual disability with pigmentary mosaicism and storage disorder-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It confirms the identification of a novel X-linked human condition associated with mosaicism and dysregulation within the mechanistic target of rapamycin (mTOR) pathway, as well as a link between lysosomal signalling and human development.
    explanation: The authors attribute the phenotype to dysregulated lysosomal signalling within the mTOR pathway.
- name: Repression of Developmental Programs Required for Exit from Pluripotency
  description: >-
    In a genome-wide CRISPR screen in mouse embryonic stem cells, the lysosomal
    amino-acid-sensing pathway was required for differentiation because it
    inactivates Tfe3. Ectopic nuclear Tfe3 represses developmental and
    metabolic programmes associated with peri-implantation development. This is
    the proposed link between the variants and the neurodevelopmental
    phenotype; it has not been tested in human neural tissue or in an animal
    model carrying a patient variant.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

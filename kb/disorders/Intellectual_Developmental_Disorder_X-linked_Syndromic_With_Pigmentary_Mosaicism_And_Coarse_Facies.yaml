pathophysiology:
- name: De Novo TFE3 Missense Variants at the RagA Interface
  description: >-
    Disease variants are de novo and almost all missense; one canonical splice
    variant is reported. Eleven of thirteen distinct variants lie in exon 4 and
    two in exon 3, in an evolutionarily conserved alpha helix (helix 2) that,
    with the previously known Rag-binding helix 1, is necessary and sufficient
    for TFE3 to bind the Rag GTPases. Structure prediction places the
    patient-mutated residues at the TFE3-RagA interface, and the missense
    variants abolish Rag GTPase binding.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: TFE3
    term:
      id: hgnc:11752
      label: TFE3
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:

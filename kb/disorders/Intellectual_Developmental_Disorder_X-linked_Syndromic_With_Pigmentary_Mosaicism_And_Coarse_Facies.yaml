  presence: De novo heterozygous (females) or hemizygous or mosaic (males) gain-of-function variants
  notes: >-
    Variants are missense, clustered in exons 3 and 4, with three recurrent
    variants and one canonical splice-site variant reported. A neonatal male
    carried hemizygous c.560C>T (p.Thr187Met). ClinGen classifies TFE3 as
    Definitive for the broader X-linked syndromic complex neurodevelopmental
    disorder (MONDO:1040018), not for this MONDO term, so no validity tier is
    recorded here. This germline disorder is distinct from the somatic TFE3
    fusions of translocation renal cell carcinoma, alveolar soft part sarcoma
    and PEComa.
  evidence:
  - reference: PMID:32409512
    reference_title: De novo mutations in the X-linked TFE3 gene cause intellectual disability with pigmentary mosaicism and storage disorder-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This series further delineates the specific storage disorder-like phenotype with PM ascribed to de novo TFE3 mutation in exons 3 and 4.
    explanation: Establishes de novo TFE3 variants in exons 3 and 4 as the cause.
  - reference: PMID:39584589
    reference_title: A Rare Case of an Infant With TFE3 Mutation Presenting With Direct Hyperbilirubinemia and Hepatomegaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whole genome sequencing was performed and a rare de novo hemizygous mutation was identified in the TFE3 gene (c.560C > T; p.Thr187Met) which was thought to be likely pathogenic.
    explanation: A non-mosaic hemizygous de novo variant in an affected male.
diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis is by trio exome or genome sequencing. Pigmentary mosaicism along
    Blaschko's lines in a child with severe intellectual disability is a clue.
    Because some males are mosaic, sequencing skin as well as blood can help
    when the blood result is negative. Lysosomal enzyme screening is negative
    despite the storage disorder-like facies.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:35503477
    reference_title: Monogenic causes of pigmentary mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing, using patients' blood and skin samples is highly recommended as the first choice for detecting causative genetic variants of pigmentary mosaicism.
    explanation: Recommends blood and skin exome sequencing for pigmentary mosaicism, the cohort in which a de novo TFE3 variant was found.
  - reference: PMID:31833172
    reference_title: "TFE3-associated neurodevelopmental disorder: A distinct recognizable syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both were found to have de novo heterozygous variants in TFE3 on whole exome sequencing
    explanation: Diagnosis made by whole exome sequencing.
discussions:
- discussion_id: tfe3_treatment_gap
  prompt: >-
    Is there any management beyond symptomatic care, given that the variants
    are gain-of-function and escape Rag GTPase control?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  - pathophysiology#Constitutive Nuclear TFE3 Transcriptional Activity
  rationale: >-
    No publication describes treatment or management of this disorder; seizure
    and developmental care are presumably symptomatic. No TFE3-directed
    therapy, and no animal model carrying a patient variant in which one could
    be tested, has been reported.
- discussion_id: tfe3_neural_mechanism_gap
  prompt: >-
    Does the Tfe3-dependent block in exit from pluripotency seen in mouse
    embryonic stem cells explain a human disorder whose patients have severe
    intellectual disability and epilepsy with normal brain imaging, and which
    human neural cell types and stages are affected?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Repression of Developmental Programs Required for Exit from Pluripotency
  - phenotypes#Severe intellectual disability
  rationale: >-
    The mechanistic link from nuclear TFE3 to the neurodevelopmental phenotype
    rests on mouse embryonic stem cell differentiation, a peri-implantation
    stage, whereas patients survive with a structurally normal brain and a
    functional neurodevelopmental phenotype. No human neural, organoid or
    animal model expressing a patient variant has been reported, so whether
    the mouse stem-cell finding is the relevant mechanism in human neural
    development is untested.

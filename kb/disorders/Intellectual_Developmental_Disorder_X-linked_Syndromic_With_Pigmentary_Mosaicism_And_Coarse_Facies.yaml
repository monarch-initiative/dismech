    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed: impaired developmental licensing of embryonic cells by
      lysosomal signalling underlies the neurodevelopmental phenotype. The
      neural cell types and stages involved are not known.
  - target: Epilepsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by the same developmental mechanism as the intellectual
      disability; brain MRI was normal in the patients in whom it is reported.
  - target: Growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth retardation is part of the syndrome; its mechanism has not been
      studied.
  evidence:
  - reference: PMID:30595499
    reference_title: Lysosomal Signaling Licenses Embryonic Stem Cell Differentiation via Inactivation of Tfe3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, ectopic nuclear Tfe3 represses specific developmental and metabolic transcriptional programs that are associated with peri-implantation development.
    explanation: Nuclear Tfe3 represses developmental programmes in mouse embryonic stem cells.
  - reference: PMID:30595499
    reference_title: Lysosomal Signaling Licenses Embryonic Stem Cell Differentiation via Inactivation of Tfe3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In an unbiased genome-wide CRISPR/Cas9 screen, we identified components of a conserved amino-acid-sensing pathway as critical drivers of ESC differentiation.
    explanation: The pathway that inactivates Tfe3 is required for embryonic stem cell differentiation.

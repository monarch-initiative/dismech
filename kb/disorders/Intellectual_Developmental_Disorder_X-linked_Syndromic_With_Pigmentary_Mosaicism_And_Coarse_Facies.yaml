inheritance:
- name: X-linked dominant, typically de novo
  description: >-
    All reported variants arose de novo. Both females (heterozygous) and males
    are affected, with 12 females and 5 males in the largest series. The
    Blaschko-line pigmentary pattern in heterozygous females is a functional
    mosaic of cells expressing the normal or the variant allele and is not
    DNA-level somatic mosaicism; the sources do not report X-inactivation
    studies.
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  evidence:
  - reference: PMID:32409512
    reference_title: De novo mutations in the X-linked TFE3 gene cause intellectual disability with pigmentary mosaicism and storage disorder-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe the detailed clinical and molecular data of 17 individuals harbouring a de novo TFE3 variant, including the patients that initially allowed reporting TFE3 as a new disease-causing gene.
    explanation: Every individual in the 17-patient series carries a de novo variant in the X-linked TFE3 gene.
  - reference: PMID:32409512
    reference_title: De novo mutations in the X-linked TFE3 gene cause intellectual disability with pigmentary mosaicism and storage disorder-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 12 females and 5 males presented with pigmentation anomalies on Blaschko's lines, severe ID, epilepsy, storage disorder-like features, growth retardation and recognisable facial dysmorphism.
    explanation: Both heterozygous females and males are affected, consistent with X-linked dominant expression.
  - reference: PMID:31833172
    reference_title: "TFE3-associated neurodevelopmental disorder: A distinct recognizable syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both were found to have de novo heterozygous variants in TFE3 on whole exome sequencing, one nonsynonymous missense, and one canonical splice site variant
    explanation: Two further affected females carry de novo heterozygous TFE3 variants.

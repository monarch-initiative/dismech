name: Intellectual Developmental Disorder, X-Linked, Syndromic, With Pigmentary Mosaicism And Coarse Facies
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
synonyms:
- TFE3-associated neurodevelopmental disorder
- TFE3-related intellectual disability with pigmentary mosaicism
description: >-
  An X-linked syndromic intellectual developmental disorder caused by de novo
  variants in TFE3, which encodes a bHLH-leucine zipper transcription factor of
  the MiT/TFE family that regulates lysosomal, melanocytic and autophagy genes.
  Affected females and males have severe intellectual disability, epilepsy,
  pigmentation anomalies along Blaschko's lines, coarse facial features that
  suggest a storage disorder, and growth retardation; affected individuals are
  reported to be non-verbal. Brain MRI was normal in the first five reported
  patients, and enzyme screening for lysosomal storage disease was negative in
  two patients whose coarse facies first prompted it. Almost all variants are
  missense changes clustered in exons 3 and 4, in a conserved helix that docks
  onto the RagA GTPase. Normally, amino-acid-activated Rag GTPases recruit TFE3
  to the lysosomal surface, where it is held in the cytoplasm and degraded; the
  disease variants abolish Rag binding, so TFE3 is constitutively stable and
  ectopically nuclear, a gain of function. In mouse embryonic stem cells,
  nuclear Tfe3 represses developmental and metabolic programmes needed for exit
  from pluripotency. A single neonatal male with a hemizygous de novo variant had
  giant cell hepatitis with severe cholestasis. No disease-specific treatment
  has been reported.

    causal_link_type: DIRECT
    description: >-
      Loss of Rag binding prevents recruitment of TFE3 to the lysosomal surface,
      where it would otherwise be retained in the cytoplasm and degraded.
  evidence:
  - reference: PMID:32409512
    reference_title: De novo mutations in the X-linked TFE3 gene cause intellectual disability with pigmentary mosaicism and storage disorder-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All variants were missense except one splice variant. Eleven of the 13 variants were localised in exon 4, 2 in exon 3, and 3 were recurrent variants.
    explanation: Defines the allelic spectrum and its clustering in exons 3 and 4.
  - reference: PMID:30595499
    reference_title: Lysosomal Signaling Licenses Embryonic Stem Cell Differentiation via Inactivation of Tfe3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: identify point mutations in a Tfe3 domain required for cytoplasmic inactivation as potentially causal for a human developmental disorder
    explanation: The patient variants map to the domain needed for cytoplasmic inactivation of TFE3.
  - reference: PMID:36608670
    reference_title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "a few mutations were identified within helix 1, but the majority were located within or immediately adjacent to helix 2"
    explanation: Maps the published patient missense variants onto the two Rag-binding helices of TFE3.
  - reference: PMID:36608670
    reference_title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show that the disease-associated missense mutations abolish the ability to interact with Rag GTPases and constitutively stabilize TFE3.
    explanation: Direct biochemical demonstration that the patient missense variants abolish Rag GTPase binding.
  - reference: PMID:36608670
    reference_title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Most importantly, the patient-derived mutations occur at this RagA-TFE3 interface
    explanation: ColabFold structure prediction places the patient-mutated residues at the RagA-TFE3 interface.
  - reference: PMID:36608670
    reference_title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: mutagenesis of the interacting RagA residues phenocopy the patient-derived mutations with respect to binding and stabilization of TFE3
    explanation: Reciprocal mutagenesis of the predicted RagA contact residues in cells reproduces the loss of binding and the stabilization caused by the patient variants.
- name: Escape from Rag GTPase-Mediated Cytoplasmic Retention and Degradation
  description: >-
    When nutrients are present, active Rag GTPases bind TFE3 at the lysosomal
    surface. Rag binding secludes TFE3 in the cytoplasm and activates a
    conserved phospho-degron that leads to CUL1-beta-TrCP ubiquitination and
    proteasomal degradation. Variants that cannot bind the Rag GTPases escape
    both controls, leaving TFE3 constitutively stable.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: lysosomal membrane
    term:
      id: GO:0005765
      label: lysosomal membrane
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  downstream:
  - target: Constitutive Nuclear TFE3 Transcriptional Activity
    causal_link_type: DIRECT
    description: >-
      Stabilized TFE3 that is not retained in the cytoplasm accumulates in the
      nucleus and activates its targets.
  evidence:
  - reference: PMID:36608670
    reference_title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Amino acids promote the recruitment of TFE3 and MITF to the lysosomal surface via the Rag GTPases, activating an evolutionarily conserved phospho-degron and leading to ubiquitination by CUL1β-TrCP and degradation.
    explanation: Defines the normal Rag-dependent degradation that the disease variants escape.
  - reference: PMID:30595499
    reference_title: Lysosomal Signaling Licenses Embryonic Stem Cell Differentiation via Inactivation of Tfe3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Functional analysis revealed that lysosome activity, the Ragulator protein complex, and the tumor-suppressor protein Folliculin enable the Rag GTPases C and D to bind and seclude the bHLH transcription factor Tfe3 in the cytoplasm.
    explanation: Defines the normal Rag-dependent cytoplasmic seclusion of Tfe3 in embryonic stem cells.
- name: Constitutive Nuclear TFE3 Transcriptional Activity
  description: >-
    The disease variants are proposed to act as ectopic nuclear gains of
    function. Stabilized TFE3 drives expression of its transcriptional targets,
    which include lysosomal, melanocytic and autophagy genes.

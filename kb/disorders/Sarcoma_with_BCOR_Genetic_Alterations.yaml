name: Sarcoma with BCOR Genetic Alterations
creation_date: '2026-10-30T15:30:00Z'
description: >-
  Sarcoma with BCOR genetic alterations is one of the four entities of the
  undifferentiated small round cell sarcoma category introduced in the 2020
  fifth edition of the World Health Organization classification of bone and
  soft tissue tumours, alongside Ewing sarcoma, CIC-rearranged sarcoma and
  sarcoma with EWSR1-non-ETS fusion genes. What the alterations have in
  common is not a single fusion but a shared consequence: BCOR, the BCL6
  corepressor, ends up overexpressed.

  Two alterations account for most cases and define the clinical poles of the
  entity. BCOR::CCNB3 arises from a paracentric inversion on the X chromosome
  that joins BCOR to the testis-specific cyclin CCNB3 about 10 Mb away; it
  occurs mainly in male adolescents, slightly more often in bone than soft
  tissue. A BCOR internal tandem duplication in the last exon instead occurs
  in infants, preferentially in the somatic soft tissue of trunk, abdomen and
  head and neck. BCOR::MAML3 and ZC3H7B::BCOR fusions are rarer members. By
  unsupervised clustering of RNA sequencing data the BCOR-altered tumours form
  one tight genomic group, distinct from both Ewing sarcoma and CIC-rearranged
  sarcoma, which is the evidence for treating them as a single entity.

  The practical point of separating them from Ewing sarcoma is the opposite of
  the point for CIC-rearranged sarcoma. BCOR-altered sarcomas do about as well
  as Ewing sarcoma and much better than CIC-rearranged sarcoma: in one cohort
  five-year overall survival was 72 per cent against 79 per cent for Ewing
  sarcoma and 43 per cent for CIC-DUX4 sarcoma, and in a 148-patient
  multicentre series three-year overall survival was 92.2 per cent for
  BCOR::CCNB3 against 39.6 per cent for CIC-rearranged cases. Most patients
  are treated on Ewing sarcoma protocols, and histological response to them is
  usually good.
categories:
- Sarcoma
- Pediatric Cancer
- Bone Cancer
parents:
- undifferentiated small round cell sarcoma
synonyms:
- BCOR-rearranged sarcoma
- BCOR-altered sarcoma
- BCOR::CCNB3 sarcoma
notes: >-
  Scope. This entry covers the bone and soft tissue sarcoma entity of the 2020
  World Health Organization classification. BCOR alterations, and BCOR
  internal tandem duplication in particular, also occur in tumours that are
  not this entity and are not covered here: clear cell sarcoma of the kidney,
  which has its own entry as Clear_Cell_Sarcoma_of_Kidney; high-grade
  endometrial stromal sarcoma; and the central nervous system tumour now
  called CNS BCOR-ITD. The separation from the CNS tumour is not merely
  anatomical. A study of 33 BCOR-ITD tumours (PMID:35174661) found marked
  histopathological differences between the CNS and sarcoma groups, and the
  two separated consistently under unsupervised clustering of both expression
  and DNA methylation data.

  No cell of origin is marked. As with the sibling CIC-rearranged sarcoma
  entry, the somatic lesion is recorded in the genetic section rather than as
  a genetic_context on a pathophysiology node, because the cell of origin is
  not established. The same study that separated the CNS and sarcoma groups
  (PMID:35174661) suggests their distinction may itself result from different
  cells of origin, which is a hypothesis about the difference rather than an
  identification of either cell.

  Primitive myxoid mesenchymal tumour of infancy carries BCOR internal tandem
  duplications at a high rate and overlaps this entity histologically. It is
  not given a subtype row here, because the series that found the shared
  lesion treats it as a separate named tumour under investigation rather than
  as a stratum of this entity.
disease_term:
  preferred_term: sarcoma with BCOR genetic alterations
  term:
    id: MONDO:0958159
    label: sarcoma with BCOR genetic alterations
has_subtypes:
- name: BCOR-CCNB3
  display_name: BCOR::CCNB3 fusion sarcoma
  description: >-
    The commonest alteration, from a paracentric inversion on the X chromosome
    joining BCOR to CCNB3. It presents in male adolescents and young people,
    slightly more often in bone than in soft tissue, and has the better
    documented outcome of the two main strata. CCNB3 immunohistochemistry
    separates it from the internal tandem duplication stratum, which does not
    involve CCNB3.
  evidence:
  - reference: PMID:40652565
    reference_title: "Update on the management of BCOR::CCNB3 sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "It predominantly affects males under 20, with a slight predominance of bone origin. Initially grouped as 'Ewing-like,' it is now a distinct entity, a major part of 'sarcoma with BCOR genetic alterations.'"
    explanation: >-
      A management review stating the demographic and site profile of the
      BCOR::CCNB3 stratum and its position as a major part of this entity.
      It is a synthesis of the literature rather than a study of its own.
- name: BCOR-ITD
  display_name: BCOR internal tandem duplication sarcoma
  description: >-
    An internal tandem duplication in the last exon of BCOR, in the sequence
    encoding the domain that binds the polycomb repressive complex. In soft
    tissue it is a tumour of infants rather than adolescents, arising in the
    trunk, abdomen and head and neck and sparing the extremities. The same
    lesion defines clear cell sarcoma of the kidney and the central nervous
    system BCOR-ITD tumour, which are separate entities with their own
    behaviour.
  evidence:
  - reference: PMID:26945340
    reference_title: "Recurrent BCOR Internal Tandem Duplication and YWHAE-NUTM2B Fusions in Soft Tissue Undifferentiated Round Cell Sarcoma of Infancy: Overlapping Genetic Features With Clear Cell Sarcoma of Kidney."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCOR ITD-positive tumors occurred preferentially in the somatic soft tissue of the trunk, abdomen, and head and neck, sparing the extremities."
    explanation: >-
      Gives the anatomic distribution of the internal tandem duplication
      stratum in infantile soft tissue tumours, which is what distinguishes it
      from the bone-predominant BCOR::CCNB3 stratum.
pathophysiology:
- name: BCOR Genetic Alteration
  description: >-
    A somatic alteration of BCOR, which encodes the BCL6 corepressor. The two
    common forms are the BCOR::CCNB3 fusion, from a paracentric inversion
    joining two genes about 10 Mb apart on the X chromosome, and an internal
    tandem duplication in the last exon of BCOR. Rarer forms include
    BCOR::MAML3 and ZC3H7B::BCOR. The alterations differ in mechanism but
    converge on raised BCOR expression, which is the next node.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BCOR
    term:
      id: hgnc:20893
      label: BCOR
  - preferred_term: CCNB3
    term:
      id: hgnc:18709
      label: CCNB3
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: ABNORMAL
    term:
      id: GO:0003714
      label: transcription corepressor activity
  notes: >-
    The molecular function is marked ABNORMAL rather than GAIN_OF_FUNCTION or
    LOSS_OF_FUNCTION because the node covers several alterations whose effect
    on corepressor activity is not the same. The duplication lies in the
    domain that binds the polycomb repressive complex and derepresses polycomb
    targets, while the fusion appends a cyclin and drives S phase entry in
    cultured cells. Picking one directional value would assert of both what is
    shown for one.
  evidence:
  - reference: PMID:22387997
    reference_title: "A new subtype of bone sarcoma defined by BCOR-CCNB3 gene fusion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A new fusion was observed between BCOR (encoding the BCL6 co-repressor) and CCNB3 (encoding the testis-specific cyclin B3) on the X chromosome."
    explanation: >-
      The RNA sequencing study that identified the fusion in small round cell
      tumours of bone lacking the canonical EWSR1-ETS translocation. It names
      both partner genes and their products.
  - reference: PMID:22387997
    reference_title: "A new subtype of bone sarcoma defined by BCOR-CCNB3 gene fusion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 24 BCOR-CCNB3-positive tumors were identified among a series of 594 sarcoma cases."
    explanation: >-
      Puts the fusion at 24 of 594 sarcomas in the discovery series. The
      denominator is a sarcoma series enriched for unclassified round cell
      tumours, so this is not a population frequency.
  - reference: PMID:26945340
    reference_title: "Recurrent BCOR Internal Tandem Duplication and YWHAE-NUTM2B Fusions in Soft Tissue Undifferentiated Round Cell Sarcoma of Infancy: Overlapping Genetic Features With Clear Cell Sarcoma of Kidney."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "consistent BCOR ITDs, similar to CCSK, were found in 15/29 (52%) infantile sarcoma cases (9/22 infantile URCS and 6/7 PMMTI)."
    explanation: >-
      Establishes the internal tandem duplication as the second recurrent
      alteration, in about half of a selected group of infantile soft tissue
      round cell sarcomas and most primitive myxoid mesenchymal tumours of
      infancy. The cases were selected for being undifferentiated, so 52 per
      cent is a share of that selected group.
  downstream:
  - target: BCOR Overexpression
    causal_link_type: DIRECT
    description: >-
      Every one of the recurrent alterations raises BCOR expression, which is
      why they group together.
- name: BCOR Overexpression
  description: >-
    Strong, diffuse nuclear BCOR protein, present whichever alteration is
    present. This convergence is both the biological argument for treating the
    alterations as one entity and the basis of the diagnostic stain: a BCOR
    immunohistochemical stain is positive across the fusions and the
    duplication alike. At the transcriptome level the alterations cluster
    together and apart from Ewing sarcoma and CIC-rearranged sarcoma.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: INCREASED
    term:
      id: GO:0003714
      label: transcription corepressor activity
  evidence:
  - reference: PMID:27428733
    reference_title: "BCOR Overexpression Is a Highly Sensitive Marker in Round Cell Sarcomas With BCOR Genetic Abnormalities."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All SBRCTs with BCOR-MAML3 and BCOR-CCNB3 fusions, as well as most with BCOR ITD (93%), and all CCSKs showed strong and diffuse nuclear BCOR immunoreactivity."
    explanation: >-
      Shows the protein-level convergence directly: strong diffuse nuclear
      BCOR across the fusion and duplication subsets alike. Clear cell sarcoma
      of the kidney is positive too, which is why the stain identifies a BCOR
      alteration rather than this entity.
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unsupervised clustering by RNAseq data revealed that tumors with BCOR genetic alterations, including BCOR-CCNB3, BCOR-MAML3, and BCOR ITD, formed a tight genomic group distinct from ES and CIC-rearranged sarcomas."
    explanation: >-
      The transcriptome-level evidence that the alterations belong together
      and apart from the other two round cell entities. Based on four
      sequenced cases in this cohort plus comparison groups, so it is a
      grouping result rather than a large-scale classification study.
  downstream:
  - target: Derepression of Polycomb Target Genes
    causal_link_type: DIRECT
    description: >-
      The duplication lies in the domain through which BCOR engages the
      polycomb repressive complex, and relieves repression of its targets.
- name: Derepression of Polycomb Target Genes
  description: >-
    BCOR acts genome-wide through polycomb repressive complex 1.1. The
    internal tandem duplication falls in the exon encoding the domain that
    binds the complex, and in human neural stem cells it derepressed
    PRC2-target genes relative to wild-type BCOR. This node carries the
    mechanism for the duplication specifically; the fusion's own route to
    transformation runs through the appended cyclin.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: PRC1 complex
    modifier: ABNORMAL
    term:
      id: GO:0035102
      label: PRC1 complex
  evidence:
  - reference: PMID:33920124
    reference_title: "BCOR Internal Tandem Duplication Expression in Neural Stem Cells Promotes Growth, Invasion, and Expression of PRC2 Targets."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "BCOR was originally identified as an interacting corepressor of B-cell lymphoma 6 protein (BCL6), and recent studies have revealed a genome-wide transcriptional impact via interactions with polycomb repressive complex 1.1 (PRC 1.1)"
    explanation: >-
      States the established molecular role of BCOR through polycomb
      repressive complex 1.1. The sentence is in the paper's introduction and
      restates work the authors cite rather than their own result, so it is
      graded BACKGROUND, and it describes biochemistry rather than a study of
      this disease, so OTHER and INDIRECT.
  - reference: PMID:33920124
    reference_title: "BCOR Internal Tandem Duplication Expression in Neural Stem Cells Promotes Growth, Invasion, and Expression of PRC2 Targets."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "In human cells, BCOR-ITD promoted derepression of PRC2-target genes compared to wildtype BCOR."
    explanation: >-
      The experimental demonstration that the duplication derepresses polycomb
      targets. It was done in human neural stem cells, which are the model for
      the central nervous system BCOR-ITD tumour rather than for this sarcoma,
      so it supports the molecular consequence of the lesion and not its
      behaviour in this entity. The same paper reports no growth advantage in
      the human cells.
  downstream:
  - target: Round to Spindle Cell Sarcomatous Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The transcriptional consequences of the alteration produce the tumour;
      the steps between are not established.
- name: Round to Spindle Cell Sarcomatous Proliferation
  description: >-
    A cellular tumour spanning round to spindle morphology, with monomorphic
    nuclei, fine chromatin, a delicate capillary network and variable myxoid
    or collagenous stroma. The range of morphology is wider than in Ewing
    sarcoma and is part of why molecular confirmation is needed. In cultured
    cells, overexpressing the fusion or a truncated CCNB3 activates S phase,
    which is the one direct link from the fusion to proliferation.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, BCS showed a spectrum of round to spindle cells with variable cellularity, monomorphic nuclei and fine chromatin pattern, delicate capillary network, and varying amounts of myxoid or collagenous stroma."
    explanation: >-
      The morphological description from the largest cohort of molecularly
      confirmed cases, and the basis for the range this node describes.
  - reference: PMID:22387997
    reference_title: "A new subtype of bone sarcoma defined by BCOR-CCNB3 gene fusion."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "overexpression of BCOR-CCNB3 or of truncated CCNB3 activates S phase in NIH3T3 cells"
    explanation: >-
      A cell-based result linking the fusion, and the cyclin portion alone, to
      cell cycle entry. It is in NIH3T3 fibroblasts rather than in the tumour's
      own lineage, so it supports a proliferative effect of the fusion rather
      than the proliferation seen in patients.
phenotypes:
- category: Neoplastic
  name: Bone or Soft Tissue Sarcoma of Children and Young People
  description: >-
    A sarcoma of bone or deep soft tissue, presenting over a wide age range
    but centred on adolescence for the fusion stratum and on infancy for the
    duplication stratum. In the 36-case cohort of fusion-positive tumours,
    ages ran from 2 to 44 with a mean and median of 15, there was a striking
    male predominance, and locations were slightly more often bone than soft
    tissue with two renal cases.
  phenotype_term:
    preferred_term: Sarcoma
    term:
      id: HP:0100242
      label: Sarcoma
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients ranged in age from 2 to 44 years old (mean and median, 15), with striking male predominance (M:F=31:5)."
    explanation: >-
      The age range and sex ratio of the largest fusion-positive cohort. The
      male predominance is marked and consistent with the X-chromosome origin
      of the inversion, though the cohort is a referral series.
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tumor locations were slightly more common in bone (n=20) than soft tissue (n=14), with rare visceral (kidney, n=2) involvement."
    explanation: >-
      The anatomic distribution in the same cohort, which is what supports
      describing the fusion stratum as slightly bone-predominant rather than
      as a bone tumour.
histopathology:
- name: Round to Spindle Cell Morphology with a Delicate Capillary Network
  finding_term:
    preferred_term: round to spindle tumour cells with monomorphic nuclei and a delicate capillary network
    term:
      id: NCIT:C53643
      label: Spindle Cell Pattern
  description: >-
    Variable cellularity, monomorphic nuclei with fine chromatin, a delicate
    capillary network, and myxoid or collagenous stroma in varying amount. The
    spindle component is what most distinguishes the appearance from Ewing
    sarcoma, and it broadens the differential to include synovial sarcoma and
    malignant peripheral nerve sheath tumour as well as the round cell
    entities.
  notes: >-
    Only the spindle cell component is bound. NCIT:C53643 Spindle Cell Pattern
    is the one morphology finding among the features here with an NCIT term; a
    label search of NCIT through the OLS4 API on 30 Oct 2026 for Small Round
    Cell, Round Cell Pattern and Myxoid returned disease concepts rather than
    morphology findings, so no term was available for the round cell pattern
    or the myxoid stroma.
  evidence:
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, BCS showed a spectrum of round to spindle cells with variable cellularity, monomorphic nuclei and fine chromatin pattern, delicate capillary network, and varying amounts of myxoid or collagenous stroma."
    explanation: >-
      The morphological description this item records, from the largest
      molecularly confirmed cohort.
- name: BCOR and CCNB3 Immunoprofile
  finding_term:
    preferred_term: strong diffuse nuclear BCOR staining, with CCNB3 staining in the fusion stratum
  description: >-
    Strong diffuse nuclear BCOR staining is present across the alterations.
    CCNB3 staining is present in the fusion stratum and is what separates it
    from the duplication stratum. CD99, cyclin D1 and SATB2 are also commonly
    positive, so CD99 does not exclude the entity in favour of Ewing sarcoma.
  notes: >-
    No finding term is bound. The profile is a combination of several marker
    results, and NCIT codes immunohistochemistry results one marker at a time,
    with no term for these markers.
  evidence:
  - reference: PMID:27428733
    reference_title: "BCOR Overexpression Is a Highly Sensitive Marker in Round Cell Sarcomas With BCOR Genetic Abnormalities."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All SBRCTs with BCOR-MAML3 and BCOR-CCNB3 fusions, as well as most with BCOR ITD (93%), and all CCSKs showed strong and diffuse nuclear BCOR immunoreactivity."
    explanation: >-
      The sensitivity of the BCOR stain across the molecular subsets. The
      93 per cent figure for the duplication subset bounds it: the stain is
      highly sensitive but not invariably positive.
  - reference: PMID:40652565
    reference_title: "Update on the management of BCOR::CCNB3 sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Histology varies from small round cells to spindle cells, showing CD99, BCOR, Cyclin D1, and SATB2 positivity, with CCNB3 differentiating it from BCOR-ITD."
    explanation: >-
      A management review's summary of the immunoprofile, including the point
      that CCNB3 is what separates the fusion stratum from the duplication
      stratum, and that CD99 is commonly positive.
genetic:
- name: BCOR
  association: BCOR rearrangement or internal tandem duplication
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  gene_term:
    preferred_term: BCOR
    term:
      id: hgnc:20893
      label: BCOR
  notes: >-
    The defining somatic lesion, in either of two main forms. BCOR::CCNB3
    results from a paracentric inversion on the X chromosome joining BCOR to
    CCNB3, about 10 Mb away. The alternative is an internal tandem duplication
    in the last exon of BCOR. BCOR::MAML3 and ZC3H7B::BCOR are rarer. No
    gene-disease validity assertion is recorded, because ClinGen has not
    curated BCOR against this disease; ClinGen's BCOR curations concern
    germline disease, and these lesions are somatic.
  evidence:
  - reference: PMID:22387997
    reference_title: "A new subtype of bone sarcoma defined by BCOR-CCNB3 gene fusion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the intrachromosomal X-chromosome fusion described here represents a new subtype of bone sarcoma caused by a newly identified gene fusion mechanism."
    explanation: >-
      The discovery paper's conclusion that the X-chromosome fusion defines a
      new subtype of bone sarcoma, which is the basis for recording BCOR as
      the causative gene.
- name: CCNB3
  association: BCOR::CCNB3 fusion partner
  relationship_type: CAUSATIVE
  subtype: BCOR-CCNB3
  variant_origin: SOMATIC
  gene_term:
    preferred_term: CCNB3
    term:
      id: hgnc:18709
      label: CCNB3
  notes: >-
    The fusion partner in the BCOR::CCNB3 stratum only, which is why this
    record is scoped to that subtype. CCNB3 encodes a testis-specific cyclin,
    and the fusion brings it under BCOR control; overexpressing either the
    fusion or a truncated CCNB3 activates S phase in cultured fibroblasts.
    Nuclear CCNB3 staining is the practical marker of this stratum.
  evidence:
  - reference: PMID:22387997
    reference_title: "A new subtype of bone sarcoma defined by BCOR-CCNB3 gene fusion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that CCNB3 immunohistochemistry is a powerful diagnostic marker for this subgroup of sarcoma"
    explanation: >-
      The diagnostic stain in patient tumours, which is what makes CCNB3 the
      practical marker of this stratum. The same sentence continues into a
      cell-line result about S phase entry; that half is quoted separately on
      the proliferation node, because it is in vitro evidence and this is not.
diagnosis:
- name: BCOR Immunohistochemistry
  description: >-
    Strong diffuse nuclear BCOR staining identifies a BCOR alteration whatever
    its molecular form, and was present in all fusion-positive tumours and 93
    per cent of duplication-positive tumours in the study that introduced it.
    It is a marker of the alteration rather than of this entity: clear cell
    sarcoma of the kidney, which has a BCOR duplication and its own entry, is
    also positive, so site and age still matter.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:27428733
    reference_title: "BCOR Overexpression Is a Highly Sensitive Marker in Round Cell Sarcomas With BCOR Genetic Abnormalities."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, BCOR immunohistochemical stain is a highly sensitive marker for SBRCTs and CCSKs with BCOR abnormalities and YWHAE-rearrangements and can be used as a useful diagnostic marker in these various molecular subsets."
    explanation: >-
      The study's own conclusion about the stain. Note that it covers clear
      cell sarcoma of the kidney and YWHAE-rearranged tumours as well, which
      is why the stain supports a BCOR alteration rather than this entity on
      its own.
differential_diagnoses:
- name: Ewing Sarcoma
  disease_term:
    preferred_term: Ewing sarcoma
    term:
      id: MONDO:0012817
      label: Ewing sarcoma
  description: >-
    The tumour these cases were classified as before 2012, and still the main
    differential. CD99 is commonly positive here too, so it does not separate
    them. The distinction matters less for prognosis than the one from
    CIC-rearranged sarcoma does, since outcomes are similar, but it matters
    for classification and for understanding response.
  distinguishing_features:
  - A BCOR alteration rather than an EWSR1-ETS fusion
  - Strong diffuse nuclear BCOR staining, and nuclear CCNB3 staining in the fusion stratum
  - A spectrum from round to spindle cells, rather than the more uniformly round morphology of Ewing sarcoma
  - Five-year overall survival 72 per cent against 79 per cent for Ewing sarcoma in one cohort, a difference that was not significant
  evidence:
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up available in 22 patients showed a 5-year overall survival of 72%, which was relatively similar to ES (79%, P=0.738) and significantly better than CIC-DUX4 sarcomas (43%, P=0.005) control groups."
    explanation: >-
      The survival comparison against both sibling entities in one cohort:
      similar to Ewing sarcoma, significantly better than CIC-DUX4 sarcoma.
      Follow-up was available for 22 of the 36 patients, so the estimate rests
      on under two thirds of the cohort.
- name: CIC-Rearranged Sarcoma
  disease_term:
    preferred_term: CIC-rearranged sarcoma
    term:
      id: MONDO:0956989
      label: CIC-rearranged sarcoma
  description: >-
    The other molecularly defined sibling in the same 2020 category, and the
    one the distinction matters most for: outcomes are far worse there. The
    two also differ in who gets them and where. BCOR::CCNB3 cases are male,
    younger, more often bone primaries, and less often metastatic at
    diagnosis.
  distinguishing_features:
  - A BCOR alteration rather than a CIC rearrangement
  - Nuclear BCOR and, in the fusion stratum, CCNB3 staining, against nuclear WT1 and ETV4 in CIC-rearranged sarcoma
  - Three-year overall survival 92.2 per cent against 39.6 per cent in the same multicentre cohort
  - Median age 17 years against 32 years in that cohort, with bone primaries and fewer synchronous metastases
  evidence:
  - reference: PMID:36791667
    reference_title: "A global collaboRAtive study of CIC-rearranged, BCOR::CCNB3-rearranged and other ultra-rare unclassified undifferentiated small round cell sarcomas (GRACefUl)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "At a 42.7-month median follow-up, the 3-year overall survival (OS) was 92.2% (95% CI 71.5-98.0) in BCOR::CCNB3 patients, 39.6% (95% CI 27.7-51.3) in CIC-rearranged sarcomas, and 78.7% in unclassified URCSs (95% CI 56.1-90.6; p < 0.0001)."
    explanation: >-
      The survival contrast between the subtypes in a retrospective cohort
      from 21 reference centres spanning 1983 to 2019. Treatment was not
      uniform over that period, so the difference is between subtypes as
      managed rather than under a fixed protocol.
  - reference: PMID:36791667
    reference_title: "A global collaboRAtive study of CIC-rearranged, BCOR::CCNB3-rearranged and other ultra-rare unclassified undifferentiated small round cell sarcomas (GRACefUl)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Male prevalence, younger age, bone primary site, and a low rate of synchronous metastases were observed in BCOR::CCNB3-rearranged cases."
    explanation: >-
      The clinical profile separating the BCOR::CCNB3 cases from the
      CIC-rearranged ones in the same cohort.
- name: Clear Cell Sarcoma of Kidney
  disease_term:
    preferred_term: clear cell sarcoma of kidney
    term:
      id: MONDO:0005006
      label: clear cell sarcoma of kidney
  description: >-
    Shares the BCOR internal tandem duplication and the BCOR stain, and is
    curated separately as Clear_Cell_Sarcoma_of_Kidney. The separation is by
    site and presentation rather than by lesion: it is a renal tumour of early
    childhood. The shared genetics were the finding that raised the question
    of whether infantile soft tissue round cell sarcoma is its soft tissue
    counterpart.
  distinguishing_features:
  - Renal primary in early childhood, against bone and soft tissue primaries here
  - BCOR internal tandem duplication and BCOR staining are shared, so neither separates the two
  evidence:
  - reference: PMID:26945340
    reference_title: "Recurrent BCOR Internal Tandem Duplication and YWHAE-NUTM2B Fusions in Soft Tissue Undifferentiated Round Cell Sarcoma of Infancy: Overlapping Genetic Features With Clear Cell Sarcoma of Kidney."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest a significant overlap between infantile URCS and CCSK, such as age at presentation, histologic features, and genetic signature, thus raising the possibility of a soft tissue counterpart to CCSK."
    explanation: >-
      States the overlap and frames it as an open possibility rather than a
      settled identity, which is why the two remain separate entries.
treatments:
- name: Wide Surgical Resection
  description: >-
    Wide resection is the local treatment. Local recurrence after surgery is
    relatively common for this entity, which a management review attributes to
    infiltrative growth.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:40652565
    reference_title: "Update on the management of BCOR::CCNB3 sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Treatment involves wide resection and chemotherapy, with the Ewing sarcoma protocol often chosen."
    explanation: >-
      A management review's statement of standard practice. It is a synthesis
      of reported practice, not a trial result, and no randomised comparison
      exists in this entity.
  - reference: PMID:40652565
    reference_title: "Update on the management of BCOR::CCNB3 sarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The relatively high local recurrence rate is probably because of the infiltrative growth."
    explanation: >-
      The review's explanation for the local recurrence rate after surgery. It
      is the authors' interpretation rather than a measured association, which
      is why it is graded INDIRECT.
- name: Ewing Sarcoma-Type Multiagent Chemotherapy
  description: >-
    Most patients are treated on Ewing sarcoma regimens, and unlike in
    CIC-rearranged sarcoma the histological response is usually good: seven of
    nine evaluable cases in one cohort showed more than 60 per cent necrosis
    in post-therapy resections. No regimen has been developed specifically for
    this entity and no randomised comparison exists.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:29300189
    reference_title: "BCOR-CCNB3 Fusion Positive Sarcomas: A Clinicopathologic and Molecular Analysis of 36 Cases With Comparison to Morphologic Spectrum and Clinical Behavior of Other Round Cell Sarcomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven of 9 cases treated with an ES chemotherapy regimen with evaluable histologic response showed >60% necrosis in posttherapy resections."
    explanation: >-
      The histological response to Ewing sarcoma chemotherapy in the cases
      where it could be assessed. Nine evaluable cases out of 36, and
      necrosis in a resection specimen is a surrogate for response rather than
      a survival outcome.

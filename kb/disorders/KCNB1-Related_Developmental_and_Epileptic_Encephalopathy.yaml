name: KCNB1-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-25T00:00:00Z"
description: >-
  A developmental and epileptic encephalopathy caused by de novo heterozygous
  variants in KCNB1, which encodes the alpha subunit of the Kv2.1 delayed-rectifier
  voltage-gated potassium channel, the major delayed-rectifier K+ conductance of
  cortical and hippocampal pyramidal neurons. Most pathogenic variants cluster in
  the pore/selectivity-filter and voltage-sensor regions and act through more than
  one mechanism: dominant-negative suppression of the delayed-rectifier K+ current
  (mutant subunits co-assemble with wild-type subunits into dysfunctional
  heterotetramers), loss of K+ selectivity that converts the channel into an
  aberrant depolarizing cation conductance, and disruption of Kv2.1's
  non-conducting structural role in surface clustering and endoplasmic
  reticulum-plasma-membrane junction organization. The net effect is disturbed
  neuronal excitability and cortical network function. Affected individuals present
  in infancy or early childhood along a spectrum from severe developmental and
  epileptic encephalopathy (DEE) with infantile-onset seizures to developmental
  encephalopathy with later-onset or no epilepsy, and virtually all have
  developmental delay with frequently severe-to-profound intellectual disability,
  autistic features, and behavioral problems.
synonyms:
- Developmental and epileptic encephalopathy 26
- DEE26
- Early infantile epileptic encephalopathy 26
- EIEE26
- KCNB1 encephalopathy

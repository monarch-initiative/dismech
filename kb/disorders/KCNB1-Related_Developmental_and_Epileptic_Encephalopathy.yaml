    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26477325
    reference_title: "De novo KCNB1 mutations in infantile epilepsy inhibit repetitive neuronal firing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the mutation in the channel pore domain (p.G401R) selectively abolished
      endogenous Kv2 currents in transfected pyramidal neurons, indicating a
      dominant-negative effect.
    explanation: >-
      Demonstrates the dominant-negative suppression of the Kv2 delayed-rectifier
      current by a pore-domain variant.
  - reference: PMID:25164438
    reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All three mutants exhibited loss of K+ selectivity
    explanation: >-
      Shows loss of potassium selectivity for selectivity-filter/pore variants, the
      basis for an aberrant depolarizing cation conductance.
  - reference: PMID:25164438
    reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These gain-of-function and dominant-negative functional defects are predicted
      to result in depolarized resting membrane potential and impaired membrane
      repolarization, with increased cellular excitability as a net consequence.
    explanation: >-
      Links the dominant-negative and gain-of-function defects to impaired
      repolarization and increased excitability.
  - reference: PMID:26503721
    reference_title: "A novel epileptic encephalopathy mutation in KCNB1 disrupts Kv2.1 ion selectivity, expression, and localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These voltage-activated Kv2.1 V378A currents were nonselective among
      monovalent cations.
    explanation: >-
      Independent confirmation that a disease variant abolishes K+ selectivity,
      producing a nonselective cation current.
  downstream:
  - target: Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
- name: Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
  description: >-
    Beyond conducting current, Kv2.1 localizes to dense surface clusters of
    largely non-conducting channels that play a direct structural role in forming
    stable endoplasmic reticulum-plasma-membrane junctions, which serve as
    membrane-trafficking and Ca2+-signaling hubs. Disease variants perturb Kv2.1
    expression and subcellular localization and reciprocally alter the trafficking
    of co-assembled wild-type subunits, so this non-conducting scaffolding role is
    an independent, conductance-separable arm of the pathophysiology.
  role: effector
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: organelle localization by membrane tethering

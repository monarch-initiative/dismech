    reference_title: "De novo KCNB1 mutations in infantile epilepsy inhibit repetitive neuronal firing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      insufficient firing of pyramidal neurons would disturb both development and
      stability of neuronal circuits, leading to the disease phenotypes.
    explanation: >-
      Links the neuronal firing defect to disturbed circuit development, the basis
      of the neurodevelopmental phenotype.
  - reference: PMID:32954514

    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Usually normal or nonspecific; used mainly to exclude structural causes.
differential_diagnoses:
- name: Other potassium- and sodium-channel developmental and epileptic encephalopathies
  description: >-
    DEEs caused by other neuronal ion-channel genes (e.g. KCNQ2, KCNA2, SCN2A,
    SCN8A, HCN1) overlap through early-onset epilepsy and developmental impairment
    and are distinguished by molecular testing.
  distinguishing_features:
  - A de novo heterozygous KCNB1 variant favors this disorder.
  - A pathogenic variant in another channel gene favors the corresponding channelopathy.
- name: Other early-onset developmental and epileptic encephalopathies
  description: >-
    Non-channel DEE genes (e.g. STXBP1, CDKL5, SYNGAP1, CHD2) can present with
    early-onset epilepsy and severe developmental impairment and are distinguished
    by genetic testing.
  distinguishing_features:
  - A pathogenic KCNB1 variant favors this disorder.
  - A causal variant in another DEE gene favors that diagnosis.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Kcnb1 deletion (loss of function)
  description: >-
    Kcnb1-deletion mice, which lose the delayed-rectifier K+ current carried by
    Kv2.1, show reduced thresholds to induced seizures but not spontaneous
    seizures. This pure loss-of-function model recapitulates only a modest
    hyperexcitability/seizure-susceptibility phenotype and does not reproduce the
    severe spontaneous epileptic encephalopathy of humans, providing the explicit
    loss-of-function counterweight to the gain-of-function and dominant-negative
    effects of the human pore/selectivity-filter variants.
  evidence:
  - reference: PMID:25164438
    reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reduction of delayed rectifier potassium current by Kcnb1 deletion in mice
      results in reduced thresholds to induced seizures, but not spontaneous
      seizures.
    explanation: >-
      Mouse Kcnb1 deletion lowers induced-seizure threshold without spontaneous
      seizures, showing that pure loss of Kv2.1 function is only modestly
      proconvulsant and distinguishing it from the human gain-of-function disease.
progression:
- phase: Infancy to Early Childhood
  notes: >-
    In the DEE presentation, seizures begin in infancy (often with epileptic
    spasms) alongside emerging developmental delay; the developmental encephalopathy
    presentation may have later-onset or no epilepsy.
  evidence:
  - reference: PMID:32954514
    reference_title: "Developmental and epilepsy spectrum of KCNB1 encephalopathy with long-term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty patients (56%) had DEE with infantile onset seizures
    explanation: >-
      Documents the infantile-onset seizure course in the DEE subgroup.
- phase: Childhood to Adulthood
  notes: >-
    Epilepsy course is variable, but long-term cognitive, psychiatric, and
    behavioral outcome is poor for most individuals.
  evidence:
  - reference: PMID:32954514
    reference_title: "Developmental and epilepsy spectrum of KCNB1 encephalopathy with long-term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term outcome in 22 individuals older than 12 years (14 in our series and
      eight published individuals) showed poor cognitive, psychiatric, and
      behavioral outcome.
    explanation: >-
      Documents the poor long-term neurodevelopmental outcome.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with antiseizure medications, but epilepsy is frequently
    treatment-resistant and no agent corrects the underlying Kv2.1 channel defect.
    Agents such as levetiracetam are used, with variable and often incomplete
    response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  evidence:
  - reference: PMID:25164438
    reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare GTCS are controlled with levetiracetam and clonazepam, but other seizure
      types have been poorly controlled with multiple therapies that were
      ineffective or limited by side effects
    explanation: >-
      Documents levetiracetam use with partial seizure control and frequent
      treatment resistance in a KCNB1 patient.
  target_mechanisms:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    treatment_effect: INHIBITS
    description: >-
      Antiseizure medications such as levetiracetam act symptomatically to dampen
      the hyperexcitable, hypersynchronous network discharges rather than correcting
      the upstream Kv2.1 channel defect, giving variable and often incomplete
      seizure control.
    evidence:
    - reference: PMID:25164438
      reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rare GTCS are controlled with levetiracetam and clonazepam, but other seizure
        types have been poorly controlled with multiple therapies that were
        ineffective or limited by side effects
      explanation: >-
        Levetiracetam partially controls some seizure types, consistent with
        symptomatic suppression of the hyperexcitable network state, but does not
        address the underlying channel defect.
- name: Supportive and Developmental Care
  description: >-
    Multidisciplinary developmental therapies and supportive care are the mainstay
    given the severe neurodevelopmental impairment; targeted disease-modifying
    therapies are not yet available and are much needed.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32954514
    reference_title: "Developmental and epilepsy spectrum of KCNB1 encephalopathy with long-term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further understanding of disease mechanisms should facilitate the development
      of targeted therapies, much needed to improve the neurodevelopmental
      prognosis.
    explanation: >-
      Highlights the current absence of targeted therapy and reliance on supportive
      management.
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the de novo dominant mechanism and the generally
    low recurrence risk, with attention to the rare possibility of parental
    mosaicism.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
discussions:
- discussion_id: gap_kcnb1_hyperexcitability_vs_reduced_firing
  prompt: >-
    Does KCNB1-related encephalopathy produce seizures through net neuronal
    hyperexcitability (dominant-negative and gain-of-function loss of the
    repolarizing delayed-rectifier current with an aberrant depolarizing cation
    conductance) or through reduced repetitive pyramidal-neuron firing that
    destabilizes cortical circuits, and is the dominant route determined by variant
    class (selectivity-filter versus voltage-sensor variants)?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Dominant-Negative Loss of Delayed-Rectifier K+ Current
  - pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
  rationale: >-
    Heterologous expression of pore/selectivity-filter variants shows loss of K+
    selectivity plus dominant-negative and gain-of-function defects predicted to
    depolarize neurons and increase excitability. In contrast, neuronal studies of
    other variants report that mutants inhibit repetitive firing of pyramidal
    neurons, so that insufficient firing disturbs circuit development and stability.
    These are mechanistically opposite accounts of how the same channel defect
    produces epilepsy and encephalopathy, and reconciling them, potentially by
    variant class or by excitatory-versus-inhibitory cell-type effects, is
    prerequisite to rational, mechanism-matched therapy.
  evidence:
  - reference: PMID:25164438
    reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These gain-of-function and dominant-negative functional defects are predicted
      to result in depolarized resting membrane potential and impaired membrane
      repolarization, with increased cellular excitability as a net consequence.
    explanation: >-
      Supports the net-hyperexcitability account arising from selectivity-filter/pore
      variants.
  - reference: PMID:26477325
    reference_title: "De novo KCNB1 mutations in infantile epilepsy inhibit repetitive neuronal firing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both mutants inhibited repetitive neuronal firing through preventing
      production of deep interspike voltages.
    explanation: >-
      Supports the competing reduced-firing account, in which impaired repetitive
      firing destabilizes circuits.
  - reference: PMID:25164438
    reference_title: "De novo KCNB1 mutations in epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reduction of delayed rectifier potassium current by Kcnb1 deletion in mice
      results in reduced thresholds to induced seizures, but not spontaneous
      seizures.
    explanation: >-
      The Kcnb1-deletion mouse is the explicit loss-of-function counterweight to the
      human gain-of-function/dominant-negative result: pure loss of Kv2.1 current
      lowers induced-seizure threshold but does not reproduce spontaneous epileptic
      encephalopathy, sharpening the open question of which mechanism drives the human
      disease.
  proposed_experiments:
  - experiment_id: exp_kcnb1_variant_class_excitability
    name: KCNB1 variant-class neuronal excitability comparison
    description: >-
      Express an allelic series of KCNB1 variants (selectivity-filter, other pore,
      and voltage-sensor classes) in patient-derived or isogenic human iPSC neurons
      and in pyramidal versus interneuron backgrounds, and measure resting membrane
      potential, repetitive firing, and network activity to determine whether the
      net effect is hyperexcitability or reduced firing and whether it tracks with
      variant class or cell type.
    experiment_type:
      preferred_term: neuronal electrophysiology allelic-series experiment
    perturbations:
    - name: KCNB1 variant-class expression
      target: pathophysiology#Dominant-Negative Loss of Delayed-Rectifier K+ Current
      genes:
      - preferred_term: KCNB1
        term:
          id: hgnc:6231
          label: KCNB1
      description: >-
        Introduce selectivity-filter, pore, and voltage-sensor KCNB1 variants in a
        shared neuronal background, in excitatory and inhibitory neuron types.
    readouts:
    - name: Neuronal excitability and network activity
      target: pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
      biological_processes:
      - preferred_term: regulation of membrane potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: ABNORMAL
      assays:
      - preferred_term: patch-clamp recording
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Wild-type KCNB1
      description: Wild-type Kv2.1 expressed in the same neuronal backgrounds.
    - name: Variant-class comparison groups
      description: Selectivity-filter, pore, and voltage-sensor groups compared with one another.
    decision_criterion: >-
      Net hyperexcitability is supported if variants depolarize neurons and increase
      network firing; the reduced-firing account is supported if variants suppress
      repetitive firing, and a variant-class or cell-type dependence would reconcile
      the two.
    would_support:
    - pathophysiology#Dominant-Negative Loss of Delayed-Rectifier K+ Current
    - pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
- discussion_id: gap_kcnb1_nonconducting_role_contribution
  prompt: >-
    How much of KCNB1-related encephalopathy is driven by loss of Kv2.1's
    non-conducting structural role in surface clustering and endoplasmic
    reticulum-plasma-membrane junction organization, as opposed to the conduction
    defect, and does disrupting this scaffolding function alone produce
    disease-relevant neuronal dysfunction?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
  rationale: >-
    Kv2.1 has a well-established conductance-independent role in forming
    ER-plasma-membrane junctions that serve as membrane-trafficking and
    Ca2+-signaling hubs, and disease variants alter Kv2.1 expression and subcellular
    localization. It is not yet resolved whether the encephalopathy phenotype
    depends on this scaffolding defect in addition to the conduction defect, which
    matters for whether therapies must restore channel gating, channel
    localization/clustering, or both.
  evidence:
  - reference: PMID:25908859
    reference_title: "Induction of stable ER-plasma-membrane junctions by Kv2.1 potassium channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Kv2.1 localizes to dense, cell-surface clusters that contain non-conducting
      channels, indicating that they have a function that is unrelated to
      membrane-potential regulation.
    explanation: >-
      Establishes the conductance-independent structural role whose disease
      contribution is the open question.
  - reference: PMID:26503721
    reference_title: "A novel epileptic encephalopathy mutation in KCNB1 disrupts Kv2.1 ion selectivity, expression, and localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Striking cell background-dependent differences in expression and subcellular
      localization of the V378A mutation were observed in heterologous cells.
    explanation: >-
      Shows a disease variant disrupts Kv2.1 localization, the scaffolding arm whose
      phenotypic weight is unresolved.
  proposed_experiments:
  - experiment_id: exp_kcnb1_clustering_separation_of_function
    name: KCNB1 conduction-versus-clustering separation-of-function test
    description: >-
      Using engineered Kv2.1 alleles that separate conduction from clustering (a
      conduction-dead but clustering-competent channel and a conducting but
      clustering-deficient channel), test in human iPSC neurons whether disrupting
      the clustering/ER-plasma-membrane-junction role alone impairs neuronal
      Ca2+ signaling, trafficking, and network maturation independent of the current
      defect.
    experiment_type:
      preferred_term: separation-of-function structure-function experiment
    perturbations:
    - name: Conduction versus clustering separation-of-function alleles
      target: pathophysiology#Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
      genes:
      - preferred_term: KCNB1
        term:
          id: hgnc:6231
          label: KCNB1
      description: >-
        Express clustering-deficient and conduction-dead Kv2.1 variants to isolate
        the scaffolding role from the conduction role.
    readouts:
    - name: ER-plasma-membrane junction integrity and network maturation
      target: pathophysiology#Impaired Neurodevelopment and Cortical Network Maturation
      biological_processes:
      - preferred_term: organelle localization by membrane tethering
        term:
          id: GO:0140056
          label: organelle localization by membrane tethering
        modifier: ABNORMAL
      assays:
      - preferred_term: total internal reflection fluorescence microscopy
      - preferred_term: multielectrode array recording
      direction: NEGATIVE
    controls:
    - name: Wild-type KCNB1
      description: Wild-type Kv2.1 expressed in the same neuronal background.
    - name: Conduction-only defect allele
      description: A clustering-competent, conduction-impaired allele as comparator.
    decision_criterion: >-
      An independent contribution of the scaffolding role is supported if a
      clustering-deficient but conducting allele impairs junction integrity and
      network maturation, and is refuted if only conduction-impairing alleles
      produce neuronal dysfunction.
    would_support:
    - pathophysiology#Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization

    reference_title: "Induction of stable ER-plasma-membrane junctions by Kv2.1 potassium channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Kv2.1 localizes to dense, cell-surface clusters that contain non-conducting
      channels, indicating that they have a function that is unrelated to
      membrane-potential regulation.
    explanation: >-
      Establishes the non-conducting clustered pool of Kv2.1 with a function
      independent of current conduction.
  - reference: PMID:25908859
    reference_title: "Induction of stable ER-plasma-membrane junctions by Kv2.1 potassium channels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the clustered Kv2.1 plays a direct structural role in the induction of stable
      ER-plasma-membrane junctions in both transfected HEK 293 cells and cultured
      hippocampal neurons.
    explanation: >-
      Demonstrates the direct structural role of clustered Kv2.1 in organizing
      ER-plasma-membrane junctions.
  - reference: PMID:26503721
    reference_title: "A novel epileptic encephalopathy mutation in KCNB1 disrupts Kv2.1 ion selectivity, expression, and localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we suggest that defects in expression and subcellular localization of Kv2.1
      V378A channels could contribute to the pathophysiology of this KCNB1 variant.
    explanation: >-
      Links disease-variant defects in Kv2.1 expression and localization directly to
      the pathophysiology.

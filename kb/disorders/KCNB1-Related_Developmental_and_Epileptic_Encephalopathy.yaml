- name: Impaired Neurodevelopment and Cortical Network Maturation
  description: >-
    Abnormal excitability and disturbed activity-dependent signaling during a
    critical developmental window impair maturation and stability of cortical
    neuronal circuits. Insufficient or dysregulated pyramidal-neuron firing is
    predicted to disturb both the development and the stability of neuronal
    networks, producing developmental delay in essentially all patients, with
    frequently severe-to-profound intellectual disability, autistic features, and
    behavioral problems that are partly independent of seizure burden.
  role: effector

- name: Neuronal Hyperexcitability and Hypersynchrony
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    The net excitatory bias produces a hyperexcitable, hypersynchronous cortical
    and hippocampal network state that converts the altered excitability into
    paroxysmal discharges, manifesting clinically as infantile-onset seizures with
    high-amplitude spike-and-wave electroencephalographic discharges.

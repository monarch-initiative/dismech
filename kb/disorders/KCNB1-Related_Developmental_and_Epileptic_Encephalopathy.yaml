pathophysiology:
- name: KCNB1 Variant and Altered Kv2.1 Channel Function
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    De novo heterozygous KCNB1 variants, most located in the pore/selectivity-filter
    and voltage-sensor regions of the channel, alter the function of Kv2.1, the
    alpha subunit of the delayed-rectifier voltage-gated potassium channel that is
    the major delayed-rectifier K+ current of cortical and hippocampal pyramidal
    neurons and an important regulator of neuronal excitability. This is the
    upstream molecular trigger of the disorder.

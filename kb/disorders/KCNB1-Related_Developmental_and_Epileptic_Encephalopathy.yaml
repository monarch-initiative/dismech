- name: Dominant-Negative Loss of Delayed-Rectifier K+ Current
  description: >-
    Mutant Kv2.1 subunits co-assemble with wild-type subunits into
    heterotetrameric channels, so a single variant allele suppresses the
    delayed-rectifier K+ current in a dominant-negative fashion. Pore-domain
    variants can selectively abolish the endogenous Kv2 current, while
    selectivity-filter variants additionally cause loss of K+ selectivity, rendering
    the channel a nonselective, depolarizing cation conductance. Loss of the
    repolarizing delayed-rectifier current, together with an aberrant inward cation
    current, is predicted to depolarize the resting membrane potential and impair
    membrane repolarization.
  role: central_effector
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  molecular_functions:

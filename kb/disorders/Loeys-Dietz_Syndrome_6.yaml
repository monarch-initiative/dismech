name: Loeys-Dietz Syndrome 6
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
description: >
  Loeys-Dietz syndrome 6 (LDS6) is an autosomal dominant connective tissue
  disorder caused by heterozygous pathogenic variants in SMAD2, the gene
  encoding the receptor-regulated SMAD transcription factor that transduces
  TGF-beta signalling. It is characterised by thoracic aortic aneurysm and
  dissection, arterial tortuosity and aneurysms of other arteries, together
  with variable craniofacial and skeletal features overlapping the other
  Loeys-Dietz subtypes.
disease_term:
  preferred_term: Loeys-Dietz syndrome 6
  term:
    id: MONDO:0030500
    label: Loeys-Dietz syndrome 6
synonyms:
- LDS6
- SMAD2-related Loeys-Dietz syndrome
pathophysiology:
- name: SMAD2 Haploinsufficiency
  description: >
    Heterozygous loss-of-function or missense SMAD2 variants impair
    TGF-beta-dependent SMAD2 signal transduction in the aortic wall.
phenotypes:
- name: Thoracic aortic aneurysm
  description: >
    Dilatation of the thoracic aorta, predisposing to dissection.
  phenotype_term:
    preferred_term: Thoracic aortic aneurysm
    term:
      id: HP:0012727
      label: Thoracic aortic aneurysm

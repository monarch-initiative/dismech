genetic:
- name: SMAD2
  gene_term:
    preferred_term: SMAD2
    term:
      id: hgnc:6768
      label: SMAD2
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    SMAD2 (HGNC:6768, chromosome 18q) encodes a receptor-regulated SMAD with an
    N-terminal MH1 and a C-terminal MH2 domain. Heterozygous SMAD2 variants
    define Loeys-Dietz syndrome 6. The reported alleles fall into two groups.
    The aneurysm literature is dominated by missense variants, all of which so
    far lie in the MH2 domain that mediates oligomerisation with SMAD4 and
    downstream transcriptional activation, plus one nonsense allele
    (c.612dup; p.Asn205*). The congenital-heart-disease literature reports
    truncating and splice alleles in addition to missense variants. Whether that
    difference in allele spectrum explains the two clinical presentations is
    open (see discussion `smad2_two_phenotype_split`). Gene identity for this
    entry was established from the MONDO:0030500 RO:0004003 causal-gene
    assertion verified with OAK, together with the OMIM:619656 cross-reference,
    rather than from any narrative source.
  evidence:
  - reference: PMID:26247899
    reference_title: "SMAD2 Mutations Are Associated with Arterial Aneurysms and Dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMAD2 is a strong candidate gene for arterial aneurysms and dissections
      given its role in the TGF-β signaling pathway.
    explanation: >-
      The founding gene-disease assertion, grounded in SMAD2's position in the
      TGF-beta pathway shared by the other Loeys-Dietz genes.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to the three previously reported SMAD2 mutations, we
      identified four new missense mutations, bringing the total to seven
      missense mutations identified so far
    explanation: >-
      Quantifies the reported SMAD2 allele set at the time of the mutation
      update and shows it is dominated by missense variants.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More recently, TGF-β ligands, TGFB2 and TGFB3, as well as intracellular
      downstream effectors of the TGF-β pathway, SMAD2 and SMAD3, were shown to
      be involved in LDS.
    explanation: >-
      Places SMAD2 within the Loeys-Dietz gene set as an intracellular
      downstream effector of the TGF-beta pathway.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous mutations in 6 genes (TGFBR1/2, TGFB2/3, SMAD2/3), encoding
      components of the TGF-β pathway, cause LDS.
    explanation: >-
      Confirms SMAD2 among the six Loeys-Dietz genes; this is also the source
      that assigns the SMAD2 subtype the designation LDS6.
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome (Orphanet)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SMAD2 | SMAD family member 2 | hgnc:6768 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet independently curates SMAD2 as a disease-causing gene for
      Loeys-Dietz syndrome, and supplies the HGNC identifier used here.
differential_diagnoses:
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    Several SMAD2-variant patients were clinically diagnosed as, or worked up
    for, Marfan syndrome before molecular testing - they share aortic root
    aneurysm and a marfanoid habitus. Marfan syndrome is the single most likely
    misassignment for the vascular presentation of LDS6.
  distinguishing_features:
  - >-
    Marfan syndrome is caused by FBN1 variants; LDS6 by SMAD2 variants, so
    molecular testing is definitive.
  - >-
    Ectopia lentis is a Marfan feature and is not part of the reported SMAD2
    phenotype.
  - >-
    Hypertelorism and marked arterial tortuosity point away from Marfan syndrome
    and towards the Loeys-Dietz spectrum.
  - >-
    Aortic dissection in Loeys-Dietz syndrome can occur at smaller diameters and
    younger ages than in Marfan syndrome, so the distinction changes the
    surveillance and surgical thresholds applied.
  evidence:
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A p.(Asn318Lys) missense variant was found in a Marfan syndrome
      (MFS)-like case who presented with aortic root aneurysm and in her
      affected daughter with marfanoid features and mild aortic dilatation.
    explanation: >-
      Documents a SMAD2-variant patient presenting as Marfan-syndrome-like,
      establishing the differential.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger
      ages than observed in Marfan syndrome
    explanation: >-
      The management consequence of resolving this differential correctly.
- name: Loeys-Dietz syndrome (other genetic subtypes)
  disease_term:
    preferred_term: Loeys-Dietz syndrome
    term:
      id: MONDO:0018954
      label: Loeys-Dietz syndrome
  description: >-
    The TGFBR1-, TGFBR2-, SMAD3-, TGFB2-, TGFB3- and IPO8-related subtypes share
    the aortic aneurysm, arterial tortuosity, hypertelorism and skeletal
    findings of LDS6, and are separable only by identifying the causal gene.
  distinguishing_features:
  - >-
    Discrimination requires molecular testing; SMAD2 defines subtype 6.
  - >-
    LDS6 has not been placed in the LDS severity ranking because too few
    patients have been reported, so subtype-specific management cannot yet be
    inferred from the label (see discussion `lds6_severity_placement`).
  - >-
    The congenital-heart-disease-with-laterality-defect presentation reported for
    SMAD2 has no close counterpart in the other autosomal dominant subtypes.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2
    explanation: >-
      Establishes that the subtypes are separated by the causal gene rather than
      by clinical criteria.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there are not enough data on LDS caused by heterozygous mutations in
      SMAD2 to place this form (LDS6) in this spectrum
    explanation: >-
      Explains why identifying the subtype as LDS6 does not yet carry the
      prognostic weight that identifying LDS1 or LDS2 does.
treatments:
- name: Whole-Arterial-Tree Imaging Surveillance
  description: >-
    Serial echocardiography of the aortic root and ascending aorta together with
    magnetic resonance or computed tomography angiography of the entire arterial
    tree. Root-only surveillance is inadequate in SMAD2-related disease, where
    tortuosity and aneurysm involve the whole arterial tree and coronary artery
    dissection has been a presenting event.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography to monitor the status of the aortic root and ascending
      aorta (at least annually) and magnetic resonance angiography or
      computerized tomography angiography to assess the entire arterial tree
    explanation: >-
      GeneReviews specifies the whole-arterial-tree surveillance regimen for
      Loeys-Dietz syndrome, of which SMAD2-related disease is subtype 6.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 9 (likely) pathogenic variants in SMAD2 have now been described
      in 15 subjects displaying a broad range of features, including aneurysms,
      tortuosity of the entire arterial tree, and coronary artery dissections
    explanation: >-
      The subtype-specific reason whole-tree imaging matters here: SMAD2
      patients have whole-tree tortuosity and coronary dissection.
  notes: >-
    Imaging intervals are extrapolated from Loeys-Dietz syndrome generally. No
    SMAD2-specific surveillance interval has been validated; see discussion
    `lds6_severity_placement`.
- name: Beta-Adrenergic Blocker Therapy
  description: >-
    Beta-adrenergic receptor blockade to reduce heart rate, blood pressure and
    pulsatile wall stress, with the aim of slowing aneurysm progression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents beta-adrenergic blockade for haemodynamic stress
      reduction in Loeys-Dietz syndrome.
  notes: >-
    No randomised trial has demonstrated reduced aortic growth or dissection
    specifically in SMAD2-related disease; this is a syndrome-level
    recommendation.
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    Angiotensin receptor blockers such as losartan reduce haemodynamic stress
    and are proposed to act additionally on maladaptive TGF-beta signalling.
    Their mechanistic rationale in SMAD2-related disease is weaker than in other
    subtypes, because whether the aortic TGF-beta paradox holds when the mutated
    gene is the SMAD effector itself has never been tested.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents angiotensin receptor blockade in Loeys-Dietz
      syndrome.
  notes: >-
    Angiotensin receptor blockers are contraindicated in pregnancy. See
    discussion `smad2_aortic_tgfb_paradox_untested` for why the pathway-directed
    rationale is less secure in this subtype than in the others.
- name: Prophylactic Aortic Surgery
  description: >-
    Elective repair of the aortic root or other aneurysmal segment before
    dissection. Loeys-Dietz aneurysms are amenable to early and aggressive
    surgical intervention, and because dissection can occur at smaller diameters
    than in Marfan syndrome the Marfan thresholds are not transferable.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aneurysms are amenable to early and aggressive surgical intervention
    explanation: >-
      GeneReviews establishes early aggressive surgical repair as the definitive
      preventive intervention in Loeys-Dietz syndrome.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger
      ages than observed in Marfan syndrome
    explanation: >-
      Directly substantiates the comparative claim in the description: the
      Marfan operative diameter thresholds are not transferable because
      Loeys-Dietz dissection happens at smaller diameters.
  - reference: PMID:34807423
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Natural history is significant for aortic dissection at smaller aortic
      diameter and arterial aneurysms throughout the arterial tree
    explanation: >-
      Independent statement of the same natural-history point in a review
      co-authored by Dietz and Loeys, and the reason surveillance and repair
      must cover the whole arterial tree rather than the root alone.
  notes: >-
    No SMAD2-specific operative diameter threshold has been published; decisions
    are individualised on absolute diameter, growth rate, body size, family
    history and pregnancy plans.
- name: Activity Restriction and Avoidance of Cardiovascular Stimulants
  description: >-
    Avoidance of contact and competitive sports, isometric exercise, and agents
    that stimulate the cardiovascular system, all of which acutely raise aortic
    wall stress.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Contact sports, competitive sports, and
      isometric exercise; agents that stimulate the cardiovascular system
      including routine use of decongestants or triptan medications for the
      management of migraine headache
    explanation: >-
      The GeneReviews "Agents/circumstances to avoid" guidance, applicable to
      SMAD2-related Loeys-Dietz syndrome.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Autosomal dominant transmission carries a 50% recurrence risk for each
    child. Once the familial SMAD2 variant is known, at-risk relatives can be
    clarified by targeted testing so that carriers enter cardiovascular
    surveillance before an aneurysm is symptomatic.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with LDS has a 50% chance of inheriting the
      pathogenic variant and the disorder.
    explanation: >-
      States the recurrence risk that genetic counselling communicates.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clarify the genetic status of at-risk relatives of any age either by
      molecular genetic testing
    explanation: >-
      Establishes cascade testing of at-risk relatives as standard Loeys-Dietz
      management.
- name: Pregnancy Surveillance and Counseling
  description: >-
    Pregnancy and the puerperium carry an increased risk of aortic dissection or
    rupture and of uterine rupture, and require intensified aortic imaging
    during pregnancy and in the weeks after delivery.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy and the postpartum period can be dangerous for women with LDS
      because of increased risk of aortic dissection/rupture and uterine
      rupture.
    explanation: >-
      Establishes the pregnancy-associated risk that drives intensified
      surveillance and pre-pregnancy counselling.
progression:
- phase: Prenatal and neonatal
  age_range: Prenatal to neonatal
  notes: >-
    In the congenital-anomaly presentation the disorder is manifest before or at
    birth, with complex structural heart disease that may be accompanied by a
    laterality defect and detected in the fetus.
  evidence:
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 3 was a fetus with complex CHD and heterotaxy.
    explanation: >-
      Documents fetal detection of the congenital presentation.
- phase: Infancy and childhood
  age_range: Infancy to childhood
  notes: >-
    Children with the congenital-anomaly presentation come to attention through
    complex congenital heart disease together with developmental delay,
    seizures, dysmorphism and growth failure. Whether these children also need
    lifelong aortic surveillance is unresolved.
  evidence:
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients 1 and 2 presented with complex CHD, developmental delay,
      seizures, dysmorphic features, short stature, and poor weight gain.
    explanation: >-
      Characterises the childhood presentation of the congenital-anomaly arm.
- phase: Adulthood
  age_range: Adulthood
  notes: >-
    The vascular presentation is typically recognised in adulthood, when aortic
    root dilatation, arterial aneurysm, whole-tree tortuosity or a dissection
    event brings the patient to attention. Coronary artery dissection has been a
    presenting event.
  evidence:
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a late-onset vascular phenotype characterized by arterial aneurysms with
      connective tissue abnormalities
    explanation: >-
      Establishes the vascular arm as late-onset relative to the congenital arm.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third missense variant, p.(Asn361Thr), was discovered in a man
      presenting with coronary artery dissection.
    explanation: >-
      An adult presenting event in the vascular arm.
experimental_models:
- name: Isogenic SMAD2 variant iPSC and iPSC-derived cardiomyocyte panel
  description: >-
    CRISPR-edited isogenic induced pluripotent stem cell lines carrying
    heterozygous or homozygous SMAD2 loss-of-function alleles and the
    congenital-heart-disease-derived missense alleles p.Arg114Cys and
    p.Trp274Cys, profiled by bulk RNA sequencing and ATAC chromatin
    accessibility against published SMAD2/3 ChIP data, with cardiomyocyte
    differentiation and contractility assessed. This is the only human-relevant
    functional system reported for SMAD2 variants, and it exists because the
    Smad2-null mouse dies before the cardiovascular phenotype can be examined
    (see discussion `smad2_no_viable_animal_model`).
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: CRISPR/Cas9-edited isogenic induced pluripotent stem cell lines
  culture_system: Pluripotent stem cell culture with directed cardiomyocyte differentiation
  conditions:
  - SMAD2 heterozygous loss of function
  - SMAD2 p.Arg114Cys missense
  - SMAD2 p.Trp274Cys missense
  - isogenic wild-type control
  publication: PMID:40028843
  modeled_mechanisms:
  - target: Disrupted SMAD2-Dependent Transcriptional Programme
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly measures the chromatin-accessibility and transcriptional
      consequences of SMAD2 dosage loss in a human isogenic background.
    limitations: >-
      Pluripotent stem cells and stem-cell-derived cardiomyocytes, not aortic
      wall tissue; the transcriptional programme measured is the developmental
      one, so the model speaks to the congenital arm of the disease and not to
      the adult aortopathy.
    readouts:
    - name: Dysregulated SMAD-regulated gene expression
      target: Disrupted SMAD2-Dependent Transcriptional Programme
      direction: ALTERED
      interpretation: >-
        385 SMAD-regulated genes, including 10 congenital-heart-disease genes,
        change expression under SMAD2 haploinsufficiency.
      evidence:
      - reference: PMID:40028843
        reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          SMAD2 haploinsufficiency altered chromatin accessibility at promoters
          and dysregulated expression of 385 SMAD regulated genes, including 10
          CHD-associated genes.
        explanation: >-
          The quantified transcriptional and chromatin readout of this model.
    evidence:
    - reference: PMID:40028843
      reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SMAD2 haploinsufficiency disrupts transcription factor binding and
        chromatin interactions critical for cardiovascular development.
      explanation: >-
        Supports treating this isogenic system as informative for the
        transcriptional-programme node.
  - target: Impaired Cardiac Morphogenesis and Laterality Specification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the cell-autonomous cardiac consequences - impaired
      cardiomyocyte contractility and reduced activin/nodal pathway gene
      expression - but not the structural malformation or the laterality defect
      itself, which require an intact embryo.
    limitations: >-
      A dish of cardiomyocytes cannot form a malformed heart or a body axis, so
      the structural and laterality phenotypes are inferred from gene expression
      rather than observed. The p.Arg114Cys and p.Trp274Cys alleles were
      variants of uncertain significance at the time of modelling.
    readouts:
    - name: Cardiomyocyte contractility
      target: Impaired Cardiac Morphogenesis and Laterality Specification
      direction: DECREASED
      interpretation: >-
        Contractility of SMAD2-haploinsufficient iPSC-derived cardiomyocytes is
        impaired relative to isogenic wild type.
      evidence:
      - reference: PMID:40028843
        reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          SMAD2 haploinsufficiency in induced pluripotent stem cells impairs
          cardiac contractility
        explanation: >-
          The functional cardiomyocyte readout of this model.
    evidence:
    - reference: PMID:40028843
      reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        can contribute to left–right asymmetry disorders such as heterotaxy, a
        prominent CHD phenotype in patients with SMAD2 variants.
      explanation: >-
        The authors link the model's transcriptional findings to the heterotaxy
        phenotype. PARTIAL because the model reports gene expression, not an
        observed laterality defect.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Loeys-Dietz syndrome 6 is ultra-rare and no population prevalence has been
    established; broader Loeys-Dietz prevalence figures must not be reassigned
    to the SMAD2 subtype. The published denominator for the vascular
    presentation is small: three families in the discovery report, five further
    families in the 2019 series, and a literature total of nine likely
    pathogenic variants in fifteen subjects at the time of the 2019 genotypic
    review. Separately, thirty participants carrying heterozygous SMAD2
    loss-of-function or missense variants were identified in exome sequencing of
    11,336 congenital-heart-disease participants, but that ascertainment is by
    congenital heart disease rather than by the LDS6 phenotype and the two
    counts should not be added together. The deep-research report additionally
    offered a figure of roughly 1-5% of all Loeys-Dietz syndrome being
    SMAD2-related; it was seen and deliberately not curated, because the figure
    is review-sourced rather than traceable to a denominator-bearing cohort, and
    a fraction-of-LDS share cannot be converted into an LDS6 population
    prevalence without an LDS prevalence that is itself unestablished.
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 9 (likely) pathogenic variants in SMAD2 have now been described
      in 15 subjects
    explanation: >-
      The literature case count for the vascular presentation; no population
      prevalence is derivable from it.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare SMAD2 variants (minor allele frequency ≤10-5) were identified in

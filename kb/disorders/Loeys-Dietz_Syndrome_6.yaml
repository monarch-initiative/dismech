mappings:
  mondo_mappings:
  - term:
      id: MONDO:0030500
      label: Loeys-Dietz syndrome 6
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0030500 is an is_a child of Loeys-Dietz syndrome (MONDO:0018954),
      carries the exact synonym "LDS6" attributed to OMIM:619656, cross-refers
      to OMIM:619656, and asserts SMAD2 (HGNC:6768) as the causal gene via
      RO:0004003. Because the MONDO term carries no definition text, disease
      identity for this entry was anchored on the OMIM:619656 cross-reference
      and the OAK-verified RO:0004003 causal-gene assertion rather than on any
      narrative source - a deliberate precaution given that the Loeys-Dietz
      numbered series is a high Named-Entity-Confusion-risk disease class.
definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis of Loeys-Dietz syndrome is established either clinically, in a
    proband with characteristic findings, or by identification of a heterozygous
    pathogenic variant in one of the six autosomal dominant LDS genes; SMAD2 is
    the gene defining subtype 6. In the absence of formal LDS diagnostic
    criteria, a pathogenic variant in an LDS gene together with arterial
    aneurysm or dissection is generally considered sufficient.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 or
      biallelic pathogenic variants in IPO8 in a proband with aortic root
      enlargement, type A dissection, other characteristic clinical features of
      LDS, or a family history of an established diagnosis of LDS.
    explanation: >-
      GeneReviews names SMAD2 among the genes whose heterozygous pathogenic
      variants establish a molecular diagnosis of Loeys-Dietz syndrome. Quoted
      in full through the clinical qualifier, because the molecular finding is
      required to occur in a proband with aortic root enlargement, dissection,
      other characteristic features, or a positive family history - it is not
      sufficient on its own.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is thus suggested that a mutation in any of these six genes in
      combination with the presence of arterial aneurysm or dissection should be
      sufficient for the diagnosis of LDS
    explanation: >-
      States the working sufficiency criterion used in the absence of formal LDS
      diagnostic criteria, which the description paraphrases.
references:
- reference: PMID:20301312

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SMAD2-related Loeys-Dietz syndrome is inherited in an autosomal dominant
    manner. Both familial transmission over three generations and de novo
    occurrence in probands with unaffected parents have been documented.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the autosomal dominant inheritance of SMAD2-related
      Loeys-Dietz syndrome explicitly.
  - reference: PMID:26247899
    reference_title: "SMAD2 Mutations Are Associated with Arterial Aneurysms and Dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, one variant occurred de novo in a proband with unaffected
      parents.
    explanation: >-
      Documents de novo occurrence of a SMAD2 variant, consistent with dominant
      inheritance and with a proportion of sporadic presentations.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was also found in his affected daughter with hypertelorism
      and arterial tortuosity, as well as his affected mother.
    explanation: >-
      Three-generation segregation of a SMAD2 missense variant with the
      phenotype, supporting autosomal dominant transmission.
pathophysiology:
- name: Heterozygous SMAD2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a heterozygous loss-of-function variant in SMAD2.
    Reported alleles include nonsense, frameshift and splice variants that
    remove one functional copy outright, and missense variants. The missense
    alleles reported in the aneurysm literature cluster in the MH2 domain - the
    conserved surface responsible for oligomerisation of SMAD2 with SMAD4 and
    for subsequent SMAD-dependent transcriptional activation - so an MH2
    missense allele attacks the same step as haploinsufficiency, by disabling
    complex assembly rather than by removing protein. That clustering is not a
    property of SMAD2 missense variants in general: in a large
    congenital-heart-disease cohort the missense variants were instead
    concentrated in exon 4, and the modelled p.Arg114Cys allele lies in the MH1
    domain.
  genes:
  - preferred_term: SMAD2
    term:
      id: hgnc:6768
      label: SMAD2
  evidence:
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using gene panel sequencing, we identified a SMAD2 nonsense variant and
      four SMAD2 missense variants, all affecting highly conserved amino acids
      in the MH2 domain.
    explanation: >-
      Establishes the variant classes and the MH2-domain localisation of the
      reported missense alleles.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutational hotspot is observed for SMAD2 and SMAD3 mutations, but the
      majority (100% and 63%) reside in the MH2 domain, a well conserved region
      responsible for the oligomerization of SMAD2 or SMAD3 with SMAD4 and
      subsequent Smad‐dependent activation of downstream transcription
    explanation: >-
      Gives the functional rationale for the MH2 clustering: this domain
      mediates SMAD2-SMAD4 oligomerisation and downstream transcriptional
      activation, so MH2 missense alleles are predicted to be loss-of-function.
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES identified pathogenic truncating variants, a splice variant, and a
      predicted deleterious missense variant in SMAD2.
    explanation: >-
      Documents truncating and splice alleles in addition to missense variants,
      supporting a loss-of-function mechanism.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three loss‐of‐function (underlined) and 11 missense variants have been
      reported in earlier studies; 10 of these missense variants are located at
      the MH2 domain of the SMAD2 gene (P=0.01).
    explanation: >-
      Quantifies the MH2 clustering of the previously reported (aneurysm-era)
      missense alleles - 10 of 11 - and by counting them separately from the
      congenital-heart-disease cohort it also shows the clustering is not a
      property of SMAD2 missense variants in general. PARTIAL because it
      qualifies rather than simply supports the claim.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMAD2 variants identified in participants with CHD were prevalent in exon
      4 (binomial P=0.05).
    explanation: >-
      The congenital-heart-disease allele distribution differs from the
      aneurysm-literature MH2 clustering, which is why the MH2 statement is
      scoped rather than stated of SMAD2 missense alleles generally.
  downstream:
  - target: Impaired Canonical TGF-beta SMAD2 Signal Transduction
    description: >-
      Loss of one functional SMAD2 allele, or of MH2-mediated complex assembly,
      reduces the capacity of the canonical TGF-beta pathway to transduce signal
      from the activated receptor to the nucleus.
    evidence:
    - reference: PMID:29967133
      reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Taken together, our data suggest that heterozygous loss-of-function
        SMAD2 variants can cause a wide spectrum of autosomal dominant aortic
        and arterial aneurysmal disease
      explanation: >-
        Frames the reported SMAD2 alleles as loss-of-function with respect to
        the canonical pathway they serve.
- name: Impaired Canonical TGF-beta SMAD2 Signal Transduction
  biological_scale: MOLECULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >-
    SMAD2 is the receptor-regulated SMAD phosphorylated by the activated type I
    TGF-beta receptor; with SMAD3 it carries the signal to the nucleus in
    complex with SMAD4. Halving functional SMAD2, or disabling its MH2
    oligomerisation surface, degrades this canonical arm. As in every other
    Loeys-Dietz subtype the net tissue-level consequence is not a simple
    reduction: heterozygous loss-of-function alleles in the upstream LDS genes
    are associated with paradoxically increased TGF-beta pathway output in the
    aortic wall, evidenced by raised SMAD phosphorylation and TGF-beta-driven
    gene expression. The node is therefore curated as dysregulation of the
    pathway rather than as loss of pathway activity, matching the module it
    conforms to.
  biological_processes:
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: ABNORMAL
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: ABNORMAL
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the canonical pathway, TGFβRI then phosphorylates SMAD2 and SMAD3
      proteins that transmit the TGFβ signal to the nucleus upon association
      with SMAD4.
    explanation: >-
      Establishes the normal position of SMAD2 in canonical TGF-beta signal
      transduction, the step disrupted by pathogenic SMAD2 variants.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      heterozygous loss-of-function mutations associate with paradoxical
      activation of TGF‐β signaling, which was demonstrated by increased
      phosphorylation of Smad proteins and increased output of TGF‐β‐driven
      genes.
    explanation: >-
      Documents the TGF-beta paradox across the Loeys-Dietz genes, justifying
      curating this node as dysregulation rather than loss of signalling.
      PARTIAL because the cited demonstration is in TGFBR1/2 and ligand-gene
      patients, not in SMAD2-variant aortic tissue, which has not been reported.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in SMAD2, encoding a key transcriptional regulator of
      transforming growth factor beta signalling, were recently reported to
      cause arterial aneurysmal disease.
    explanation: >-
      Identifies SMAD2 as a transcriptional regulator of TGF-beta signalling
      whose disruption causes arterial aneurysmal disease.
  downstream:
  - target: Disrupted SMAD2-Dependent Transcriptional Programme
    description: >-
      A degraded canonical signal reaches the nucleus as an altered
      SMAD2-dependent transcriptional output.
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Dysregulated TGF-beta signalling in the aortic wall drives medial
      degeneration, the substrate for aneurysm formation.
- name: Disrupted SMAD2-Dependent Transcriptional Programme
  biological_scale: MOLECULAR
  description: >-
    SMAD2 acts in the nucleus as a co-regulator that binds many different
    transcription factors. Isogenic induced pluripotent stem cell models show
    that SMAD2 haploinsufficiency changes chromatin accessibility at promoters,
    dysregulates hundreds of SMAD-regulated genes including known
    congenital-heart-disease genes, and disrupts predicted interactions with
    NANOG, ETS, TEAD3/4, CREB1 and AP1. Loss-of-function and missense alleles
    produce partly distinct accessibility and transcription-factor-binding
    signatures, which is the leading explanation offered for why SMAD2 variants
    give rise to more than one cardiovascular phenotype.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SMAD2 haploinsufficiency altered chromatin accessibility at promoters and
      dysregulated expression of 385 SMAD regulated genes, including 10
      CHD-associated genes.
    explanation: >-
      Direct measurement of the epigenetic and transcriptional consequence of
      SMAD2 haploinsufficiency in an isogenic human cell model.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SMAD2 haploinsufficiency disrupts transcription factor binding and
      chromatin interactions critical for cardiovascular development.
    explanation: >-
      States the mechanistic conclusion linking SMAD2 dosage to a disrupted
      transcriptional programme required for cardiovascular development.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Differences between the molecular consequences of loss-of-function and
      missense variants likely contribute to phenotypic heterogeneity.
    explanation: >-
      Offers allele-class-specific transcriptional consequences as an
      explanation for the two SMAD2 phenotypes. PARTIAL because the authors
      frame it as a likely contribution rather than a demonstrated cause, and
      the model is pluripotent stem cells rather than patient aortic tissue.
  downstream:
  - target: Impaired Cardiac Morphogenesis and Laterality Specification
    description: >-
      Among the genes whose expression falls with SMAD2 dosage are NODAL, LEFTY1
      and LEFTY2 - components of the activin/nodal pathway that establishes the
      left-right axis - so the dysregulated transcriptional programme reaches
      cardiac morphogenesis and left-right patterning.
    evidence:
    - reference: PMID:40028843
      reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        RNA levels of NODAL, LEFTY1, and LEFTY2, components of the activin/nodal
        signaling pathway,
      explanation: >-
        Identifies the nodal-pathway genes whose RNA levels the paper reports as
        significantly reduced in SMAD2-haploinsufficient and SMAD2 p.Arg114Cys
        iPSCs, which is the measured link from the transcriptional node to
        left-right patterning. Quoted as the sentence fragment the cached record
        preserves contiguously; the reduction it reports is stated in the
        adjacent clause of the same sentence.
- name: Impaired Cardiac Morphogenesis and Laterality Specification
  biological_scale: TISSUE
  description: >-
    SMAD2 haploinsufficiency lowers expression of NODAL, LEFTY1 and LEFTY2 -
    activin/nodal pathway components that establish the left-right axis - and
    the authors of that work propose the resulting epigenetic and
    transcriptional changes as the mechanism by which SMAD2 haploinsufficiency
    causes congenital heart disease and vascular anomalies. Clinically,
    heterozygous SMAD2 variants are recovered in large congenital-heart-disease
    cohorts and the presentation is complex structural heart disease with or
    without heterotaxy - a developmentally much earlier consequence than the
    aortopathy, and the arm of LDS6 that is least like the other Loeys-Dietz
    subtypes.
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in SMAD2 have been reported in association with
      arterial aneurysms and dissections and in large cohorts of subjects with
      complex congenital heart disease (CHD).
    explanation: >-
      Establishes the congenital-heart-disease arm of the SMAD2 phenotype
      alongside the vascular arm.
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 3 was a fetus with complex CHD and heterotaxy.
    explanation: >-
      Documents the laterality defect that implicates SMAD2 in left-right axis
      specification as well as in cardiac morphogenesis.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SMAD2 haploinsufficiency in induced pluripotent stem cells impairs cardiac
      contractility and alters epigenetic and transcriptional processes that
      cause dysregulation of genes required for normal heart development
    explanation: >-
      Provides the cellular counterpart of the clinical congenital heart
      disease: SMAD2 dosage loss dysregulates genes required for normal heart
      development and impairs cardiomyocyte contractility.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      can contribute to left–right asymmetry disorders such as heterotaxy, a
      prominent CHD phenotype in patients with SMAD2 variants. We suggest that
      these epigenetic and transcriptional changes provide a mechanism by which
      haploinsufficiency of SMAD2 cause CHD and vascular anomalies.
    explanation: >-
      The authors' own statement of the mechanism connecting SMAD2
      haploinsufficiency to left-right asymmetry disorders and heterotaxy. This
      is the evidence behind the GO:0007368 left/right determination annotation
      on this node - previously the node asserted a NODAL-SMAD2 link with no
      citation at all.
  downstream:
  - target: Complex Congenital Heart Disease
    description: >-
      Disrupted cardiac morphogenesis presents as complex structural congenital
      heart disease.
  - target: Heterotaxy
    description: >-
      Failure of left-right axis specification presents as a laterality defect.
- name: Aortic Medial Degeneration and Wall Weakening
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  description: >-
    Dysregulated TGF-beta signalling in the aortic media alters the smooth
    muscle cell phenotype and extracellular matrix homeostasis, weakening the
    wall. This is the shared, conserved step of every Loeys-Dietz subtype and of
    heritable thoracic aortic disease generally; it is curated here by
    conformance to the `aortopathy_tgfbeta_dysregulation` module rather than
    re-derived, because no SMAD2-specific aortic histopathology series has been
    published.
  cell_types:
  - preferred_term: aortic smooth muscle cell
    term:
      id: CL:0002539
      label: aortic smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS is caused by pathogenic variants in transforming growth factor β
      (TGF-β) signaling pathway-related genes, i.e., TGFBR1, TGFBR2, SMAD2,
      SMAD3, TGFB2, and TGFB3, which alter the physiological development and
      function of the extracellular matrix, leading to cardiovascular and
      multisystem abnormalities
    explanation: >-
      States the shared route from TGF-beta pathway gene disruption - SMAD2
      included - through altered extracellular matrix development and function
      to cardiovascular disease.
  downstream:
  - target: Progressive Aortic and Arterial Dilation
    description: >-
      A weakened media dilates progressively under haemodynamic load.
  - target: Arterial Tortuosity
    description: >-
      Loss of medial structural integrity along the arterial tree manifests as
      the elongation and tortuosity characteristic of Loeys-Dietz syndrome.
- name: Progressive Aortic and Arterial Dilation
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  description: >-
    Progressive dilation is not confined to the aortic root in SMAD2-related
    disease: reported patients show aortic root aneurysm together with
    tortuosity and aneurysm throughout the arterial tree, including the neck
    vessels and the coronary arteries. The arterial-tree-wide distribution is
    what makes root-only surveillance inadequate.
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 9 (likely) pathogenic variants in SMAD2 have now been described
      in 15 subjects displaying a broad range of features, including aneurysms,
      tortuosity of the entire arterial tree, and coronary artery dissections,
      even in the absence of prominent connective tissue characteristics
    explanation: >-
      Summarises the reported SMAD2 vascular phenotype across all published
      subjects: aneurysm, whole-arterial-tree tortuosity and coronary
      dissection.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a man clinically diagnosed with Loeys-Dietz syndrome (LDS) that
      presents with aortic root dilatation and marked tortuosity of the neck
      vessels, another missense variant, p.(Ser397Tyr), was identified.
    explanation: >-
      A worked case pairing aortic root dilatation with extra-aortic arterial
      tortuosity in a SMAD2-variant patient given a clinical LDS diagnosis.
  downstream:
  - target: Arterial Dissection and Rupture
    description: >-
      A progressively dilated, structurally weakened artery is at risk of
      dissection and rupture.
  - target: Arterial Aneurysm
    description: >-
      Progressive dilation presents clinically as arterial aneurysm.
  - target: Aortic Root Aneurysm
    description: >-
      Dilation at the aortic root is the segment most often imaged and the usual
      trigger for referral.
- name: Arterial Dissection and Rupture
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  description: >-
    Dissection is the principal life-threatening endpoint. In SMAD2-related
    disease it has been documented in the aorta and, distinctively, in the
    coronary arteries. As for Loeys-Dietz syndrome generally, dissection can
    occur at smaller aortic diameters and at younger ages than in Marfan
    syndrome, which is why the intervention thresholds used for Marfan syndrome
    are not transferable.
  evidence:

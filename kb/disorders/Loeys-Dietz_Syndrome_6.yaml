    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0030500 is an is_a child of Loeys-Dietz syndrome (MONDO:0018954),
      carries the exact synonym "LDS6" attributed to OMIM:619656, cross-refers
      to OMIM:619656, and asserts SMAD2 (HGNC:6768) as the causal gene via
      RO:0004003. Because the MONDO term carries no definition text, disease
      identity for this entry was anchored on the OMIM:619656 cross-reference
      and the OAK-verified RO:0004003 causal-gene assertion rather than on any
      narrative source - a deliberate precaution given that the Loeys-Dietz
      numbered series is a high Named-Entity-Confusion-risk disease class.
definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis of Loeys-Dietz syndrome is established either clinically, in a
    proband with characteristic findings, or by identification of a heterozygous
    pathogenic variant in one of the six autosomal dominant LDS genes; SMAD2 is
    the gene defining subtype 6. In the absence of formal LDS diagnostic
    criteria, a pathogenic variant in an LDS gene together with arterial
    aneurysm or dissection is generally considered sufficient.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2
    explanation: >-
      GeneReviews names SMAD2 among the genes whose heterozygous pathogenic
      variants establish a molecular diagnosis of Loeys-Dietz syndrome.
references:
- reference: PMID:20301312
  title: "Loeys-Dietz Syndrome."
  tags:
  - GeneReviews
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SMAD2-related Loeys-Dietz syndrome is inherited in an autosomal dominant
    manner. Both familial transmission over three generations and de novo
    occurrence in probands with unaffected parents have been documented.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the autosomal dominant inheritance of SMAD2-related
      Loeys-Dietz syndrome explicitly.
  - reference: PMID:26247899
    reference_title: "SMAD2 Mutations Are Associated with Arterial Aneurysms and Dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, one variant occurred de novo in a proband with unaffected
      parents.
    explanation: >-
      Documents de novo occurrence of a SMAD2 variant, consistent with dominant
      inheritance and with a proportion of sporadic presentations.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was also found in his affected daughter with hypertelorism
      and arterial tortuosity, as well as his affected mother.
    explanation: >-
      Three-generation segregation of a SMAD2 missense variant with the
      phenotype, supporting autosomal dominant transmission.
pathophysiology:
- name: Heterozygous SMAD2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a heterozygous loss-of-function variant in SMAD2.
    Reported alleles include nonsense, frameshift and splice variants that
    remove one functional copy outright, and missense variants that so far
    cluster entirely in the MH2 domain - the conserved surface responsible for
    oligomerisation of SMAD2 with SMAD4 and for subsequent SMAD-dependent
    transcriptional activation. A MH2-domain missense allele therefore attacks
    the same step as haploinsufficiency, by disabling complex assembly rather
    than by removing protein.
  genes:
  - preferred_term: SMAD2
    term:
      id: hgnc:6768
      label: SMAD2
  evidence:
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using gene panel sequencing, we identified a SMAD2 nonsense variant and
      four SMAD2 missense variants, all affecting highly conserved amino acids
      in the MH2 domain.
    explanation: >-
      Establishes the variant classes and the MH2-domain localisation of the
      reported missense alleles.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutational hotspot is observed for SMAD2 and SMAD3 mutations, but the
      majority (100% and 63%) reside in the MH2 domain, a well conserved region
      responsible for the oligomerization of SMAD2 or SMAD3 with SMAD4 and
      subsequent Smad‐dependent activation of downstream transcription
    explanation: >-
      Gives the functional rationale for the MH2 clustering: this domain
      mediates SMAD2-SMAD4 oligomerisation and downstream transcriptional
      activation, so MH2 missense alleles are predicted to be loss-of-function.
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES identified pathogenic truncating variants, a splice variant, and a
      predicted deleterious missense variant in SMAD2.
    explanation: >-
      Documents truncating and splice alleles in addition to missense variants,
      supporting a loss-of-function mechanism.
  downstream:
  - target: Impaired Canonical TGF-beta SMAD2 Signal Transduction
    description: >-
      Loss of one functional SMAD2 allele, or of MH2-mediated complex assembly,
      reduces the capacity of the canonical TGF-beta pathway to transduce signal
      from the activated receptor to the nucleus.
    evidence:
    - reference: PMID:29967133
      reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Taken together, our data suggest that heterozygous loss-of-function
        SMAD2 variants can cause a wide spectrum of autosomal dominant aortic
        and arterial aneurysmal disease
      explanation: >-
        Frames the reported SMAD2 alleles as loss-of-function with respect to
        the canonical pathway they serve.
- name: Impaired Canonical TGF-beta SMAD2 Signal Transduction
  biological_scale: MOLECULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >-
    SMAD2 is the receptor-regulated SMAD phosphorylated by the activated type I
    TGF-beta receptor; with SMAD3 it carries the signal to the nucleus in
    complex with SMAD4. Halving functional SMAD2, or disabling its MH2
    oligomerisation surface, degrades this canonical arm. As in every other
    Loeys-Dietz subtype the net tissue-level consequence is not a simple
    reduction: heterozygous loss-of-function alleles in the upstream LDS genes
    are associated with paradoxically increased TGF-beta pathway output in the
    aortic wall, evidenced by raised SMAD phosphorylation and TGF-beta-driven
    gene expression. The node is therefore curated as dysregulation of the
    pathway rather than as loss of pathway activity, matching the module it
    conforms to.
  biological_processes:
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: ABNORMAL
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: ABNORMAL
  cell_types:
  - preferred_term: aortic medial smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the canonical pathway, TGFβRI then phosphorylates SMAD2 and SMAD3
      proteins that transmit the TGFβ signal to the nucleus upon association
      with SMAD4.
    explanation: >-
      Establishes the normal position of SMAD2 in canonical TGF-beta signal
      transduction, the step disrupted by pathogenic SMAD2 variants.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      heterozygous loss-of-function mutations associate with paradoxical
      activation of TGF‐β signaling, which was demonstrated by increased
      phosphorylation of Smad proteins and increased output of TGF‐β‐driven
      genes.
    explanation: >-
      Documents the TGF-beta paradox across the Loeys-Dietz genes, justifying
      curating this node as dysregulation rather than loss of signalling.
      PARTIAL because the cited demonstration is in TGFBR1/2 and ligand-gene
      patients, not in SMAD2-variant aortic tissue, which has not been reported.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense variants in SMAD2, encoding a key transcriptional regulator of
      transforming growth factor beta signalling, were recently reported to
      cause arterial aneurysmal disease.
    explanation: >-
      Identifies SMAD2 as a transcriptional regulator of TGF-beta signalling
      whose disruption causes arterial aneurysmal disease.
  downstream:
  - target: Disrupted SMAD2-Dependent Transcriptional Programme
    description: >-
      A degraded canonical signal reaches the nucleus as an altered
      SMAD2-dependent transcriptional output.
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Dysregulated TGF-beta signalling in the aortic wall drives medial
      degeneration, the substrate for aneurysm formation.
- name: Disrupted SMAD2-Dependent Transcriptional Programme
  biological_scale: MOLECULAR
  description: >-
    SMAD2 acts in the nucleus as a co-regulator that binds many different
    transcription factors. Isogenic induced pluripotent stem cell models show
    that SMAD2 haploinsufficiency changes chromatin accessibility at promoters,
    dysregulates hundreds of SMAD-regulated genes including known
    congenital-heart-disease genes, and disrupts predicted interactions with
    NANOG, ETS, TEAD3/4, CREB1 and AP1. Loss-of-function and missense alleles
    produce partly distinct accessibility and transcription-factor-binding
    signatures, which is the leading explanation offered for why SMAD2 variants
    give rise to more than one cardiovascular phenotype.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SMAD2 haploinsufficiency altered chromatin accessibility at promoters and
      dysregulated expression of 385 SMAD regulated genes, including 10
      CHD-associated genes.
    explanation: >-
      Direct measurement of the epigenetic and transcriptional consequence of
      SMAD2 haploinsufficiency in an isogenic human cell model.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SMAD2 haploinsufficiency disrupts transcription factor binding and
      chromatin interactions critical for cardiovascular development.
    explanation: >-
      States the mechanistic conclusion linking SMAD2 dosage to a disrupted
      transcriptional programme required for cardiovascular development.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Differences between the molecular consequences of loss-of-function and
      missense variants likely contribute to phenotypic heterogeneity.
    explanation: >-
      Offers allele-class-specific transcriptional consequences as an
      explanation for the two SMAD2 phenotypes. PARTIAL because the authors
      frame it as a likely contribution rather than a demonstrated cause, and
      the model is pluripotent stem cells rather than patient aortic tissue.
  downstream:
  - target: Impaired Cardiac Morphogenesis and Laterality Specification
    description: >-
      Dysregulation of the SMAD2-dependent developmental transcriptional
      programme, which SMAD2 also serves as the intracellular effector of NODAL
      signalling, perturbs cardiac morphogenesis and left-right patterning.
- name: Impaired Cardiac Morphogenesis and Laterality Specification
  biological_scale: TISSUE
  description: >-
    SMAD2 is the intracellular effector shared by the TGF-beta and NODAL
    branches of the TGF-beta superfamily, and NODAL-SMAD2 signalling specifies
    the left-right axis and patterns the developing heart. Heterozygous SMAD2
    variants are recovered in large congenital-heart-disease cohorts, and the
    resulting presentation is complex structural heart disease with or without
    heterotaxy - a developmentally much earlier consequence than the aortopathy,
    and the arm of LDS6 that is least like the other Loeys-Dietz subtypes.
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in SMAD2 have been reported in association with
      arterial aneurysms and dissections and in large cohorts of subjects with
      complex congenital heart disease (CHD).
    explanation: >-
      Establishes the congenital-heart-disease arm of the SMAD2 phenotype
      alongside the vascular arm.
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 3 was a fetus with complex CHD and heterotaxy.
    explanation: >-
      Documents the laterality defect that implicates SMAD2 in left-right axis
      specification as well as in cardiac morphogenesis.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SMAD2 haploinsufficiency in induced pluripotent stem cells impairs cardiac
      contractility and alters epigenetic and transcriptional processes that
      cause dysregulation of genes required for normal heart development
    explanation: >-
      Provides the cellular counterpart of the clinical congenital heart
      disease: SMAD2 dosage loss dysregulates genes required for normal heart
      development and impairs cardiomyocyte contractility.
- name: Aortic Medial Degeneration and Wall Weakening
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  description: >-
    Dysregulated TGF-beta signalling in the aortic media alters the smooth
    muscle cell phenotype and extracellular matrix homeostasis, weakening the
    wall. This is the shared, conserved step of every Loeys-Dietz subtype and of
    heritable thoracic aortic disease generally; it is curated here by
    conformance to the `aortopathy_tgfbeta_dysregulation` module rather than
    re-derived, because no SMAD2-specific aortic histopathology series has been
    published.
  cell_types:
  - preferred_term: aortic medial smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS is caused by pathogenic variants in transforming growth factor β
      (TGF-β) signaling pathway-related genes, i.e., TGFBR1, TGFBR2, SMAD2,
      SMAD3, TGFB2, and TGFB3, which alter the physiological development and
      function of the extracellular matrix, leading to cardiovascular and
      multisystem abnormalities
    explanation: >-
      States the shared route from TGF-beta pathway gene disruption - SMAD2
      included - through altered extracellular matrix development and function
      to cardiovascular disease.
  downstream:
  - target: Progressive Aortic and Arterial Dilation
    description: >-
      A weakened media dilates progressively under haemodynamic load.
- name: Progressive Aortic and Arterial Dilation
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  description: >-
    Progressive dilation is not confined to the aortic root in SMAD2-related
    disease: reported patients show aortic root aneurysm together with
    tortuosity and aneurysm throughout the arterial tree, including the neck
    vessels and the coronary arteries. The arterial-tree-wide distribution is
    what makes root-only surveillance inadequate.
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 9 (likely) pathogenic variants in SMAD2 have now been described
      in 15 subjects displaying a broad range of features, including aneurysms,
      tortuosity of the entire arterial tree, and coronary artery dissections,
      even in the absence of prominent connective tissue characteristics
    explanation: >-
      Summarises the reported SMAD2 vascular phenotype across all published
      subjects: aneurysm, whole-arterial-tree tortuosity and coronary
      dissection.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a man clinically diagnosed with Loeys-Dietz syndrome (LDS) that
      presents with aortic root dilatation and marked tortuosity of the neck
      vessels, another missense variant, p.(Ser397Tyr), was identified.
    explanation: >-
      A worked case pairing aortic root dilatation with extra-aortic arterial
      tortuosity in a SMAD2-variant patient given a clinical LDS diagnosis.
  downstream:
  - target: Arterial Dissection and Rupture
    description: >-
      A progressively dilated, structurally weakened artery is at risk of
      dissection and rupture.
- name: Arterial Dissection and Rupture
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  description: >-
    Dissection is the principal life-threatening endpoint. In SMAD2-related
    disease it has been documented in the aorta and, distinctively, in the
    coronary arteries. As for Loeys-Dietz syndrome generally, dissection can
    occur at smaller aortic diameters and at younger ages than in Marfan
    syndrome, which is why the intervention thresholds used for Marfan syndrome
    are not transferable.
  evidence:
  - reference: PMID:26247899
    reference_title: "SMAD2 Mutations Are Associated with Arterial Aneurysms and Dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that SMAD2 mutations are associated with arterial
      aneurysms and dissections
    explanation: >-
      The founding report establishing dissection as part of the SMAD2
      phenotype.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third missense variant, p.(Asn361Thr), was discovered in a man
      presenting with coronary artery dissection.
    explanation: >-
      Documents coronary artery dissection as a presenting event in a
      SMAD2-variant patient.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger
      ages than observed in Marfan syndrome
    explanation: >-
      The management-critical property of Loeys-Dietz dissection risk that
      governs surveillance and surgical thresholds in this subtype too.
discussions:
- discussion_id: lds6_severity_placement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Where does SMAD2-related Loeys-Dietz syndrome sit in the LDS severity
    ranking, and can a SMAD2-specific surveillance and surgical-threshold
    protocol be justified?
  attaches_to:
  - pathophysiology#Progressive Aortic and Arterial Dilation
  - pathophysiology#Arterial Dissection and Rupture
  rationale: >-
    The Loeys-Dietz subtypes are informally ordered by severity, and that
    ordering drives imaging intervals and the diameter at which prophylactic
    repair is offered. LDS6 is the one subtype left unplaced: the published
    denominator is a few families and a handful of reported variants, so no
    genotype-specific growth rate, dissection diameter or age-at-event
    distribution exists. Management is therefore extrapolated wholesale from
    Loeys-Dietz syndrome generally. Because the gap is one of cohort size rather
    than of mechanism, it is closable by systematic registry accrual of
    SMAD2-positive probands rather than by new experimental work.
  evidence:
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there are not enough data on LDS caused by heterozygous mutations in
      SMAD2 to place this form (LDS6) in this spectrum
    explanation: >-
      States the gap explicitly, and is also the source that names the SMAD2
      subtype LDS6.
  proposed_experiments:
  - experiment_id: smad2_registry_stratification
    name: SMAD2-stratified HTAD registry analysis
    description: >-
      Pool SMAD2-positive probands across heritable-thoracic-aortic-disease
      registries and report age at first aneurysm, aortic growth rate, diameter
      at dissection and extra-aortic arterial involvement, so that LDS6 can be
      placed against the other subtypes on the measures that actually govern
      management.
- discussion_id: smad2_two_phenotype_split
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do heterozygous SMAD2 variants produce two developmentally distinct
    presentations - complex congenital heart disease with laterality defects on
    the one hand, and late-onset arterial aneurysm with connective-tissue
    findings on the other - and does allele class predict which a carrier gets?
  attaches_to:
  - pathophysiology#Disrupted SMAD2-Dependent Transcriptional Programme
  - pathophysiology#Impaired Cardiac Morphogenesis and Laterality Specification
  rationale: >-
    Two phenotypes have been delineated for the same gene at very different
    developmental stages, and the difference is not yet explained. The leading
    hypothesis is allele-class-specific molecular consequence: isogenic
    stem-cell models show that haploinsufficiency and missense alleles produce
    partly distinct chromatin-accessibility and transcription-factor-binding
    signatures. That is a plausible mechanism but not a demonstrated one, and it
    has not been tested against the clinical split - the aneurysm literature is
    dominated by MH2 missense alleles while truncating and splice alleles are
    prominent in the congenital-heart-disease series, but nobody has shown that
    the correlation holds prospectively or that it is causal rather than an
    artefact of how the two literatures ascertained their patients. The question
    is directly actionable: a truncating SMAD2 variant found on a
    congenital-heart-disease panel raises the question of whether that child
    needs lifelong aortic surveillance, and the answer is currently unknown.
  evidence:
  - reference: PMID:30157302
    reference_title: "Variable cardiovascular phenotypes associated with SMAD2 pathogenic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest two distinct phenotypes associated with pathogenic
      variants in SMAD2: complex CHD with or without laterality defects and
      other congenital anomalies, and a late-onset vascular phenotype
      characterized by arterial aneurysms with connective tissue abnormalities.
    explanation: >-
      The primary statement of the two-phenotype split that this gap is about.
  - reference: PMID:40028843
    reference_title: "Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into Cardiovascular Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Heterozygous SMAD2 loss-of-function and missense variants are identified
      in patients with congenital heart disease (CHD) or arterial aneurysms.
      Mechanisms that cause distinct cardiovascular phenotypes remain unknown.
    explanation: >-
      Confirms that the mechanism separating the two presentations was still
      unknown as of the most recent functional study.
  proposed_experiments:
  - experiment_id: smad2_allele_class_phenotype
    name: Allele-class-stratified phenotype comparison
    description: >-
      Assemble all reported SMAD2 carriers, classify each allele as truncating,
      splice or MH2 missense, and test whether allele class predicts congenital
      heart disease versus late-onset aortopathy - including systematic aortic
      imaging of SMAD2-positive congenital-heart-disease probands, who have
      generally not been imaged for aneurysm.
- discussion_id: smad2_aortic_tgfb_paradox_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the paradoxical increase in aortic TGF-beta signalling seen in other
    Loeys-Dietz subtypes also occur in SMAD2-variant aortic tissue, or does
    losing the effector itself break the paradox?
  attaches_to:
  - pathophysiology#Impaired Canonical TGF-beta SMAD2 Signal Transduction
  rationale: >-
    The defining paradox of Loeys-Dietz syndrome is that loss-of-function
    variants in positive components of the TGF-beta pathway are accompanied by
    increased SMAD phosphorylation and increased TGF-beta-driven gene expression
    in the aortic media. That observation has been made for TGFBR1/2, SMAD3,
    TGFB2 and TGFB3 - but not for SMAD2, because no SMAD2-variant aortic tissue
    series has been published. The case matters mechanistically rather than
    merely completing a set: SMAD2 is itself the phosphorylated effector, so a
    readout of increased pSMAD2 cannot mean the same thing when the SMAD2 allele
    is the lesion. Curating this entry's central signalling node as
    dysregulation rather than as loss of signalling is an inference from the
    other subtypes, and is flagged here rather than asserted.
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aortic wall tissue of TGFBR1 or 2 mutant patients showed increased nuclear
      accumulation of phosphorylated SMAD2 (pSMAD2) and enhanced expression of
      TGF‐β driven gene products such as connective tissue growth factor (CTGF),
      illustrating enhanced TGF‐β signaling.
    explanation: >-
      Establishes the paradox in the subtypes where aortic tissue was available,
      which is the comparison SMAD2 is missing from.
  proposed_experiments:
  - experiment_id: smad2_aortic_media_signalling
    name: SMAD2-variant aortic media signalling readout
    description: >-
      Obtain aortic wall tissue at elective repair from SMAD2-variant patients
      and quantify pSMAD2, pSMAD3, pERK1/2 and CTGF against non-syndromic and
      other-LDS-subtype controls, to establish whether the TGF-beta paradox
      holds when the mutated gene is the effector itself.
- discussion_id: smad2_no_viable_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can any existing animal model of SMAD2 loss address the LDS6 aortopathy,
    given that Smad2-null mouse embryos die before the aorta can be assessed?
  attaches_to:
  - pathophysiology#Aortic Medial Degeneration and Wall Weakening
  rationale: >-
    Every other Loeys-Dietz gene has a mouse model whose aorta was examinable
    and which reproduced aspects of the human aortopathy - Smad3 knockouts die
    of ruptured aneurysm, Tgfb2 heterozygotes dilate the aortic root. Smad2 is
    the exception: knockout embryos die before E8.5 from defective egg-cylinder
    elongation and germ-layer formation, so aortic size cannot be measured at
    all. This is a genuine model-fidelity gap rather than an absence of
    evidence - the null model exists and has been characterised, but the
    developmental stage at which it fails is upstream of the tissue in question,
    which is exactly why a SMAD2-specific aortic mechanism has never been
    tested in vivo. The available human-relevant functional models are instead
    iPSC-based and report on cardiac development rather than on the aortic wall.
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mouse models for SMAD2 have also been developed but Smad2 knockout mice
      embryos die before E8,5, due to defective egg cylinder elongation and germ
      layer formation, which entangles aortic size examination
    explanation: >-
      States the mismatch precisely: the Smad2-null mouse exists but dies before
      the aorta can be assessed, so it cannot serve as an LDS6 aortopathy model.
  proposed_experiments:
  - experiment_id: smad2_conditional_aortic_model
    name: Conditional and knock-in Smad2 aortic models
    description: >-
      Build smooth-muscle-lineage conditional Smad2 knockouts and knock-in mice
      carrying a human MH2 missense allele, bypassing the peri-implantation
      lethality, and phenotype the aorta for dilation, elastic fibre
      fragmentation and SMAD/ERK signalling.

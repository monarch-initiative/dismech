name: Loeys-Dietz Syndrome 6
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
description: >
  Loeys-Dietz syndrome 6 (LDS6) is the SMAD2-related subtype of Loeys-Dietz
  syndrome, an autosomal dominant heritable connective tissue disorder of the
  TGF-beta signalling pathway. SMAD2 encodes a receptor-regulated SMAD that is
  phosphorylated by the type I TGF-beta receptor and, in complex with SMAD4,
  carries the canonical TGF-beta signal into the nucleus. Heterozygous
  loss-of-function SMAD2 variants - nonsense, frameshift, splice and missense
  alleles, the reported missense variants clustering in the MH2 oligomerization
  domain - cause a wide spectrum of aortic and arterial aneurysmal disease with
  connective-tissue findings reminiscent of Marfan and Loeys-Dietz syndromes:
  aortic root dilatation, thoracic and more distal arterial aneurysm and
  dissection, tortuosity of the entire arterial tree, coronary artery
  dissection, hypertelorism and a marfanoid habitus. A second, developmentally
  earlier presentation has been delineated in which SMAD2 variants cause complex
  congenital heart disease with or without laterality defects, together with
  developmental delay, seizures, dysmorphic features and growth failure. Whether
  these are two ends of one spectrum or genotype-separable entities is
  unresolved, and LDS6 has explicitly not been placed in the LDS severity
  ranking because too few patients have been reported. This entry curates the
  SMAD2 subtype specifically; the shared Loeys-Dietz clinical picture and its
  cross-subtype management are curated in the umbrella entry Loeys-Dietz
  Syndrome, and the conserved aortopathy mechanism in the
  `aortopathy_tgfbeta_dysregulation` module.

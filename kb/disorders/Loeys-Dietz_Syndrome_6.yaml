mappings:
  mondo_mappings:
  - term:
      id: MONDO:0030500
      label: Loeys-Dietz syndrome 6
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0030500 is an is_a child of Loeys-Dietz syndrome (MONDO:0018954),
      carries the exact synonym "LDS6" attributed to OMIM:619656, cross-refers
      to OMIM:619656, and asserts SMAD2 (HGNC:6768) as the causal gene via
      RO:0004003. Because the MONDO term carries no definition text, disease
      identity for this entry was anchored on the OMIM:619656 cross-reference
      and the OAK-verified RO:0004003 causal-gene assertion rather than on any
      narrative source - a deliberate precaution given that the Loeys-Dietz
      numbered series is a high Named-Entity-Confusion-risk disease class.
definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis of Loeys-Dietz syndrome is established either clinically, in a
    proband with characteristic findings, or by identification of a heterozygous
    pathogenic variant in one of the six autosomal dominant LDS genes; SMAD2 is
    the gene defining subtype 6. In the absence of formal LDS diagnostic
    criteria, a pathogenic variant in an LDS gene together with arterial
    aneurysm or dissection is generally considered sufficient.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2
    explanation: >-
      GeneReviews names SMAD2 among the genes whose heterozygous pathogenic
      variants establish a molecular diagnosis of Loeys-Dietz syndrome.
references:
- reference: PMID:20301312
  title: "Loeys-Dietz Syndrome."
  tags:
  - GeneReviews
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SMAD2-related Loeys-Dietz syndrome is inherited in an autosomal dominant
    manner. Both familial transmission over three generations and de novo
    occurrence in probands with unaffected parents have been documented.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the autosomal dominant inheritance of SMAD2-related
      Loeys-Dietz syndrome explicitly.
  - reference: PMID:26247899
    reference_title: "SMAD2 Mutations Are Associated with Arterial Aneurysms and Dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, one variant occurred de novo in a proband with unaffected
      parents.
    explanation: >-
      Documents de novo occurrence of a SMAD2 variant, consistent with dominant
      inheritance and with a proportion of sporadic presentations.
  - reference: PMID:29967133
    reference_title: "Novel pathogenic SMAD2 variants in five families with arterial aneurysm and dissection: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was also found in his affected daughter with hypertelorism
      and arterial tortuosity, as well as his affected mother.
    explanation: >-
      Three-generation segregation of a SMAD2 missense variant with the
      phenotype, supporting autosomal dominant transmission.

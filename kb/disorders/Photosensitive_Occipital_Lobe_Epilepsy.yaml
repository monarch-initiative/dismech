name: Photosensitive Occipital Lobe Epilepsy
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A childhood epilepsy in which the seizures do not simply happen, they are
  triggered. Flickering light or a strong geometric pattern, classically a
  television screen or a video game, reliably produces a seizure that begins with
  coloured shapes in the visual field and may go on to vomiting, headache, and a
  convulsion. Between exposures the child is normal, and so is the brain scan.
  This is one of the very few epilepsies where the trigger is part of the
  diagnosis rather than an aggravating factor, and it sits awkwardly across two
  old categories: photosensitivity has traditionally belonged to the generalized
  epilepsies, but here the discharge starts in the occipital cortex and the first
  symptom is visual, which is focal. The mechanistic interest is that the whole
  chain from stimulus to seizure can be watched happening in the laboratory. The
  visual cortex of these children responds to light with an abnormally large
  evoked potential, that response can run on into a self-sustaining
  after-discharge, and how large that after-discharge grows tracks whether the
  electrical event stays on the recording or becomes a seizure the child
  experiences.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - POLE
  - idiopathic photosensitive occipital lobe epilepsy
  - IPOE
  - reflex occipital lobe epilepsy
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        One of the four ILAE-recognized self-limited focal epilepsies of
        childhood, and one of the small set of designated reflex epilepsy
        syndromes.

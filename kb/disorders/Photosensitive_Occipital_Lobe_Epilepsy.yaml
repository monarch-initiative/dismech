        snippet: >-
          In this study, we describe 13 neurologically normal patients in whom
          daytime seizures were always induced by television and began with
          elementary visual hallucinations, followed frequently by vomiting,
          headache and then secondary generalization.
        explanation: >-
          Every patient's seizure began with elementary visual hallucination,

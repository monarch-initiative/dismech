prevalence:
  - population: Children with epilepsy
    measure_type: UNKNOWN
    prevalence_class: RARE
    notes: >-
      No population-based prevalence estimate is available for this syndrome
      specifically. The published clinical experience consists of small series,
      and the syndrome is described as a rare presentation even within
      photosensitive epilepsy, where partial seizures with visual symptoms are
      themselves uncommon. The prevalence_class is set to the qualitative RARE
      tier rather than a numeric band because no numeric estimate exists to
      support one.
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Partial seizures featuring visual symptoms are rarely reported in
          photosensitive epilepsy.
        explanation: >-
          Supports the qualitative rarity of this presentation within
          photosensitive epilepsy without providing a rate.
progression:
  - phase: Trigger-governed active phase
    age_range: Childhood into adolescence
    notes: >-
      Seizures occur in relation to exposure rather than on an internal schedule,
      so frequency is generally low and is modifiable by avoiding the stimulus.
      Most patients are treated and most respond to a single medication.
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Only one patient continued to have rare seizures after treatment; in
          the others seizure control was achieved with monotherapy.
        explanation: >-
          Establishes that monotherapy achieved control in all but one patient of
          the treated cohort.
  - phase: Nocturnal seizures in a minority
    age_range: Childhood into adolescence
    notes: >-
      A minority also have seizures out of sleep, which is mechanistically
      awkward because sleep removes the visual trigger. This observation is one
      of the reasons the syndrome is not fully reducible to its reflex component.
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Three patients additionally reported nocturnal seizures, which have not
          been described in previous studies.
        explanation: >-
          Documents nocturnal seizures in a minority of the cohort, occurring
          without the visual trigger that defines the syndrome.
treatments:
  - name: Antiseizure Monotherapy
    description: >-
      Most patients achieve control on a single medication. Valproate and
      levetiracetam are the drugs conventionally used in reflex epilepsy, chosen
      for their efficacy against both focal seizures and the generalized
      photoparoxysmal tendency that often accompanies them.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: valproic acid
          term:
            id: CHEBI:39867
            label: valproic acid
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Self-Sustaining Cortical After-Discharge
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Treatment includes antiseizure medication, commonly valproate or
          levetiracetam, along with lifestyle modifications, and when amenable,
          surgical intervention.
        explanation: >-
          Names the two conventional agents for reflex epilepsy and places
          lifestyle modification alongside them.
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Only one patient continued to have rare seizures after treatment; in
          the others seizure control was achieved with monotherapy.
        explanation: >-
          Quantifies the monotherapy response in a real cohort.
  - name: Trigger Avoidance and Environmental Modification
    description: >-
      Because the seizures are elicited rather than spontaneous, reducing
      exposure is genuinely therapeutic rather than merely prudent. This is an
      unusual position for a lifestyle measure in epilepsy, where advice is
      usually about safety rather than about seizure control.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Lifestyle Therapy
      term:
        id: NCIT:C15900
        label: Lifestyle Therapy
    target_mechanisms:
      - target: Abnormal Visual Cortical Response to Photic and Pattern Stimulation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Treatment includes antiseizure medication, commonly valproate or
          levetiracetam, along with lifestyle modifications, and when amenable,
          surgical intervention.
        explanation: >-
          Lifestyle modification is named as part of the treatment of reflex
          epilepsy alongside medication.
diagnosis:
  - name: Electroencephalography with Intermittent Photic and Pattern Stimulation
    description: >-
      The diagnostic investigation, and unusually a provocative one: the
      recording deliberately delivers the trigger under controlled conditions to
      elicit the photoparoxysmal response. A recording made without photic and
      pattern stimulation can miss the diagnosis entirely.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Eight patients also showed generalized epileptiform activity during
          intermittent photic stimulation.
        explanation: >-
          Documents the use of intermittent photic stimulation during recording
          to elicit the abnormality.
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          After written informed consent, all subjects underwent a standard
          procedure of visual stimulation with intermittent light and pattern
          stimulation, under digital video-EEG recording.
        explanation: >-
          Describes the standard provocative protocol combining intermittent
          light and pattern stimulation under video-EEG.
  - name: Brain Magnetic Resonance Imaging
    description: >-
      Imaging is performed to exclude a structural occipital lesion, and is
      normal in this syndrome.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In this study, we describe 13 neurologically normal patients in whom
          daytime seizures were always induced by television and began with
          elementary visual hallucinations, followed frequently by vomiting,
          headache and then secondary generalization.
        explanation: >-
          The cohort is described as neurologically normal, which is the clinical
          counterpart of the imaging-negative requirement, though the abstract
          does not report imaging directly.
differential_diagnoses:
  - name: Childhood Occipital Visual Epilepsy
    disease_term:
      preferred_term: childhood occipital visual epilepsy
      term:
        id: MONDO:0020308
        label: childhood occipital visual epilepsy
    description: >-
      The closest relative. Seizure content is nearly identical, since both are
      occipital-onset visual seizures in an otherwise normal child, and both may
      show occipital spikes. The separation is by trigger and by the
      electrographic gating phenomenon.
    distinguishing_features:
      - Seizures occur spontaneously rather than being elicited by a specific visual stimulus.
      - Fixation-off sensitivity rather than a photoparoxysmal response is the characteristic electrographic gating.
      - Seizures are frequent and diurnal rather than governed by exposure.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into three
          categories: (1) self-limited focal epilepsies, comprising four
          syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Lists both as separate syndromes in the current nosology despite their
          clinical closeness.
  - name: Photosensitive Idiopathic Generalized Epilepsy
    description: >-
      Photosensitivity occurring as a trait within a generalized epilepsy,
      classically juvenile myoclonic epilepsy. Here the photoparoxysmal response
      accompanies a different syndrome rather than defining one, and the seizures
      it provokes are myoclonic or generalized tonic-clonic rather than visual.
      No MONDO disease_term is bound because this names a trait-plus-syndrome
      combination rather than a single entity.
    distinguishing_features:
      - Provoked seizures are myoclonic or generalized tonic-clonic without a visual opening symptom.
      - Photoparoxysmal response is generalized rather than occipitally confined.
      - Spontaneous generalized seizures and generalized spike-wave dominate the clinical picture.
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Photosensitivity is a typical feature of photosensitive epilepsy which
          is usually considered a form of idiopathic generalized epilepsy.
        explanation: >-
          States the conventional home of photosensitivity in the generalized
          epilepsies, which is what makes this differential necessary.
  - name: Structural Occipital Lobe Epilepsy
    description: >-
      Occipital epilepsy from a visible lesion. Photosensitivity is not a
      feature, and the electroencephalogram differs. No MONDO disease_term is
      bound because this is a lesional category rather than a single named
      entity.
    distinguishing_features:
      - Abnormal brain magnetic resonance imaging showing an occipital lesion.
      - Unilateral posterior slowing is more common than occipital spikes.
      - Seizures are not elicited by photic or pattern stimulation.
    evidence:
      - reference: PMID:23027097
        reference_title: Occipital lobe seizures and epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In cryptogenic/symptomatic OLE, unilateral posterior EEG slowing is
          more common than occipital spikes.
        explanation: >-
          Gives the electrographic feature that separates lesional from
          idiopathic occipital epilepsy.
discussions:
  - discussion_id: pole_provoked_seizure_module_boundary
    kind: OPEN_QUESTION
    status: OPEN
    prompt: >-
      Should a syndrome whose seizures are by definition provoked conform to a
      mechanism module whose terminal node is recurrent unprovoked seizures, and
      if not, what does the module need in order to accommodate reflex epilepsy?
    attaches_to:
      - "pathophysiology#Recurrent Visually Provoked Reflex Seizures"
    rationale: >-
      This entry declares conformance to
      epilepsy_excitation_inhibition_imbalance at the hyperexcitability node and
      deliberately stops there. The module's terminal node is Recurrent
      Unprovoked Seizures, and the seizures of this syndrome are elicited
      consistently by a specific afferent stimulus, which is the definition of
      provoked. Declaring conformance would assert the negation of the syndrome's
      defining property, and silently omitting the node without explanation would
      leave a future curator to read the omission as an oversight. The underlying
      question is whether the unprovoked qualifier in the module is doing
      mechanistic work or clinical-definitional work. If it is mechanistic, then
      reflex epilepsy really does diverge from the module at that point and needs
      its own terminal node. If it is definitional, inherited from the clinical
      definition of epilepsy rather than from the excitation-inhibition
      mechanism, then the module node is misnamed and reflex epilepsies conform
      perfectly well. This is a schema question as much as a biological one, and
      it is recorded here because this syndrome is where it surfaces.
    proposed_experiments:
      - experiment_id: pole_module_node_audit
        name: Audit of reflex epilepsy entries against the module terminal node
        description: >-
          A curation audit across all reflex epilepsy syndromes in the knowledge
          base, recording for each whether the terminal module node was declared,
          omitted, or declared with a caveat, to establish whether the boundary
          is being handled consistently and how often it arises.
        decision_criterion: >-
          If several reflex entries independently stop short of the terminal
          node, the module needs either a provoked-seizure terminal node or a
          rename of the existing one. If this entry is the only case, a local
          note suffices.
      - experiment_id: pole_spontaneous_seizure_prevalence
        name: Prevalence of genuinely spontaneous seizures within the syndrome
        description: >-
          Prospective ascertainment, with seizure diaries and ambulatory
          recording, of what fraction of seizures in this syndrome occur without
          any identifiable visual trigger, including the nocturnal events already
          reported.
        decision_criterion: >-
          A substantial fraction of genuinely unprovoked seizures would mean the
          syndrome does reach the module's terminal node and the conformance
          should be declared. A near-total dependence on trigger exposure would
          confirm the divergence.
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Reflex seizures (RS) are epileptic events that are objectively and
          consistently elicited in response to a specific afferent stimulus or by
          an activity of the patient.
        explanation: >-
          Establishes that reflex seizures are provoked by definition, which is
          what creates the conflict with the module's unprovoked terminal node.
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Most patients experience spontaneous seizures along with their provoked
          events.
        explanation: >-
          Complicates the clean provoked-versus-unprovoked split and is the
          reason the second proposed experiment measures the spontaneous fraction
          rather than assuming it is zero. This statement is made about reflex
          epilepsies in general, not about this syndrome specifically.
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Three patients additionally reported nocturnal seizures, which have not
          been described in previous studies.
        explanation: >-
          Nocturnal seizures occur without the visual trigger, which is direct
          within-syndrome evidence that the seizures are not exclusively
          provoked.
  - discussion_id: pole_focal_generalized_boundary
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Is photosensitive occipital lobe epilepsy a focal epilepsy that happens to
      be photosensitive, or the focal end of a continuum with photosensitive
      generalized epilepsy, in which the occipital onset is the visible beginning
      of an event that is generalized from the start?
    attaches_to:
      - "pathophysiology#Photoparoxysmal Response"
    rationale: >-
      Photosensitivity has traditionally belonged to the idiopathic generalized
      epilepsies, and partial seizures with visual symptoms are rarely reported
      within photosensitive epilepsy at all. Yet in this syndrome the first
      symptom is visual and the discharge is occipital, which is focal by any
      standard reading. The complication is that a majority of patients in the
      defining cohort also showed generalized epileptiform activity on photic
      stimulation, so the same child produces both focal and generalized
      electrographic responses to the same stimulus. Two readings follow. On the
      first, this is a genuinely focal epilepsy whose occipital focus can
      secondarily engage generalized networks, which is the reading the current
      nosology takes by placing it among the self-limited focal epilepsies. On
      the second, reflex seizures in general are better understood as focal
      events with rapid secondary generalization through cortico-cortical and
      cortico-reticular pathways, which would make the focal-generalized
      distinction less fundamental here than the classification implies. The
      original description explicitly proposed that these benign partial
      epilepsies may overlap with one another rather than being cleanly
      separable.
    proposed_experiments:
      - experiment_id: pole_source_localization_of_generalized_response
        name: Source localization of the generalized photoparoxysmal response
        description: >-
          High-density electroencephalography with source modelling during
          intermittent photic stimulation in patients who show both occipital and
          generalized responses, testing whether the generalized discharge has an
          occipital origin that spreads or arises without a demonstrable focal
          onset.
        decision_criterion: >-
          A consistent occipital onset preceding the generalized field would
          support the focal reading with secondary generalization. Generalized
          onset without demonstrable occipital lead would support the continuum
          reading.
      - experiment_id: pole_stimulus_parameter_dissociation
        name: Dissociation of focal and generalized responses by stimulus parameter
        description: >-
          Systematic variation of stimulus parameters, including flash frequency,
          pattern spatial frequency and field size, testing whether the occipital
          and generalized responses are elicited by different parameter ranges
          within the same patient.
        decision_criterion: >-
          Dissociable parameter ranges would indicate two mechanistically
          separable responses rather than one event seen at two scales. Identical
          thresholds would support a single graded phenomenon.
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Photosensitivity is a typical feature of photosensitive epilepsy which
          is usually considered a form of idiopathic generalized epilepsy.
          Partial seizures featuring visual symptoms are rarely reported in
          photosensitive epilepsy.
        explanation: >-
          States the classificatory tension precisely: photosensitivity belongs
          to the generalized epilepsies by convention, and focal visual seizures
          within it are rare.
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Eight patients also showed generalized epileptiform activity during
          intermittent photic stimulation.
        explanation: >-
          The empirical basis of the controversy: a majority of the defining
          cohort produced generalized as well as occipital responses to the same
          stimulus.
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We conclude that reflex occipital lobe epilepsy is an idiopathic form
          of the benign partial epilepsies, which may overlap with one another.
        explanation: >-
          The original authors' own conclusion, which asserts the focal reading
          while explicitly allowing overlap between the syndromes.
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Generalized RS typically occur within the setting of IGEs and should be
          considered as focal seizures with quick secondary generalization via
          cortico-cortical or cortico-reticular pathways.
        explanation: >-
          Supports the second reading directly, by proposing that even
          generalized reflex seizures are fundamentally focal events with rapid
          spread.
  - discussion_id: pole_after_discharge_threshold_mechanism
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      What determines whether a photoparoxysmal response remains an
      electrographic event or crosses into a clinically experienced seizure, and
      is after-discharge amplitude the mechanism of that transition or only its
      correlate?
    attaches_to:
      - "pathophysiology#Self-Sustaining Cortical After-Discharge"
    rationale: >-
      This syndrome offers something rare in epilepsy: a threshold that can be
      approached repeatedly under controlled conditions in the same patient. The
      evoked response amplitude is elevated in photosensitive patients, the
      after-discharge is larger in those who have reflex seizures, and the
      after-discharge is larger still when the paroxysmal response actually
      becomes a seizure. That is a clean graded relationship. What it does not
      establish is direction. A larger after-discharge may be what recruits
      enough cortex to produce a symptom, in which case it is the mechanism of
      the transition and anything that suppresses it should raise the seizure
      threshold. Or the after-discharge may be a readout of some other state
      variable, such as the momentary level of inhibitory tone or the extent of
      cortex already engaged, in which case suppressing it would change the
      number without changing the risk. The distinction is directly actionable,
      because after-discharge amplitude is a candidate surrogate endpoint for
      trials in reflex epilepsy and would only be a valid one under the first
      reading.
    proposed_experiments:
      - experiment_id: pole_ad_suppression_intervention
        name: Interventional suppression of after-discharge amplitude
        description: >-
          Within-patient crossover in which after-discharge amplitude is reduced
          pharmacologically at doses chosen for their effect on that measure,
          with seizure occurrence under standardized provocative stimulation as
          the outcome, testing whether the amplitude change carries the change in
          clinical risk.
        decision_criterion: >-
          If reduction in after-discharge amplitude tracks reduction in provoked
          seizure occurrence within patients, the amplitude is on the causal
          path. If seizures fall without amplitude change, or amplitude falls
          without a fall in seizures, it is a correlate.
      - experiment_id: pole_trial_level_threshold_modelling
        name: Trial-level modelling of the electrographic-to-clinical transition
        description: >-
          Trial-by-trial analysis across repeated stimulation in individual
          patients, modelling whether after-discharge amplitude predicts clinical
          expression once prior trial history, time since last event, and
          stimulus parameters are accounted for.
        decision_criterion: >-
          Retained predictive power after adjustment supports amplitude as an
          independent determinant. Loss of predictive power would indicate it
          indexes a state variable such as refractoriness rather than driving the
          transition.
    evidence:
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Moreover, the AD amplitude appears to be related to electro-clinical
          expression, being greater when PPR evolves into clinically evident
          seizures.
        explanation: >-
          The graded relationship the gap is about, stated by the authors in
          associational language that does not commit to direction.
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Thirty-seven of these patients had one or more RS during the procedure
          of stimulation for a total of 66 episodes.
        explanation: >-
          Establishes that many events per patient are available under controlled
          stimulation, which is what makes the proposed trial-level modelling
          feasible in this syndrome specifically.
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In aggregate, activation of a critical neuronal mass, supported and
          sustained by cortico-subcortical and thalamocortical pathways
          eventually result in a seizure.
        explanation: >-
          The critical-mass framing is the general mechanistic hypothesis the
          after-discharge measure would be operationalizing, and it is stated at
          the level of reflex epilepsy generally rather than demonstrated for
          this syndrome.

notes: >-
  Scope. This entry models the idiopathic, imaging-negative, photically triggered
  occipital epilepsy recognized by the 2022 ILAE nosology as one of the four
  self-limited focal epilepsies of childhood. It does not model photosensitivity
  as a trait occurring inside a generalized epilepsy such as juvenile myoclonic
  epilepsy, where the photoparoxysmal response is an aggravating feature of a
  different syndrome rather than the syndrome itself, and it does not model
  structural occipital lobe epilepsy.

  Module conformance note, and a deliberate partial conformance. One node
  conforms to epilepsy_excitation_inhibition_imbalance at the generic
  hyperexcitability node. The recurrent-seizure node of that module is
  specifically Recurrent Unprovoked Seizures, and this entry does NOT declare
  conformance there, because the seizures of this syndrome are by definition
  provoked. Declaring conformance would assert the opposite of the syndrome's
  defining property, and silently omitting it would read as an oversight. The
  mismatch is not a gap in this entry; it is a real boundary of the module, and
  it is written up as a discussion rather than papered over.

  Sourcing note. Drafted from the primary literature, then cross-checked against
  a deep-research report generated with the falcon provider (Edison Scientific),
  committed as
  research/Photosensitive_Occipital_Lobe_Epilepsy-deep-research-falcon.md. It
  contributed no snippets; every quotation here is verified against its own
  fetched cache. Three things in it are worth recording for the next curator.
  First, it independently reached the same conclusion about genetics, warning
  that the variant spectrum reported in mixed photosensitivity cohorts (SCN1A,
  CHD2 and others) is not occipital-lobe-specific and must not be transferred to
  this syndrome, which is why no genetic section is present here. Second, it
  surfaced a body of quantitative trigger and treatment data that is real but
  belongs to photosensitive epilepsy in general rather than to this syndrome,
  including flicker-frequency sensitivity ranges, the provocative effect of
  red-light and red-blue alternation, and colour-filtering lenses; none of it is
  asserted in this entry, because the report itself labels these as
  extrapolations and no within-syndrome source was verified for them. Third, one
  claim in the report is simply a retrieval gap and should not be believed: it
  states that no dedicated MONDO identifier could be established for this
  syndrome. MONDO:0100021 exists and was verified directly against the ontology
  before this entry was written.

  What is deliberately absent. There is no genetic section. Photosensitivity as a
  trait is heritable and has been studied genetically, but no gene is established
  for this syndrome specifically, and importing loci studied in generalized
  photosensitive epilepsy would assert a shared architecture that this entry
  elsewhere treats as an open question.
inheritance:
  - name: Presumed genetic, no established locus
    description: >-
      The syndrome is grouped with the self-limited focal epilepsies of
      childhood, whose inheritance is generally regarded as complex rather than
      Mendelian. Photosensitivity as a laboratory trait is separately known to
      run in families, but no locus has been established for this syndrome, and
      no inheritance_term is bound because the mode of inheritance is not known.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into three
          categories: (1) self-limited focal epilepsies, comprising four
          syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Places the syndrome among the self-limited focal epilepsies, the family
          whose inheritance is treated as complex, which is the basis for the
          presumption without a locus.
pathophysiology:
  - name: Abnormal Visual Cortical Response to Photic and Pattern Stimulation
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      The root of the syndrome is a visual cortex that overreacts to its normal
      input. This is not inferred from the seizures alone; it is measurable
      directly. When light or a structured pattern is delivered under recording,
      the early visual evoked response is abnormally large in these patients,
      while its timing is normal. That combination, normal latency with excessive
      amplitude, is the signature of a cortex whose conduction is intact but
      whose gain is set too high. Photosensitivity and pattern sensitivity are
      treated here as two faces of the same abnormal responsiveness, since both
      stimuli provoke the same electrographic and clinical events.
    locations:
      - preferred_term: primary visual cortex
        term:
          id: UBERON:0002436
          label: primary visual cortex
    cell_types:
      - preferred_term: cortical pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    biological_processes:
      - preferred_term: detection of light stimulus involved in visual perception
        term:
          id: GO:0050908
          label: detection of light stimulus involved in visual perception
        modifier: ABNORMAL
    downstream:
      - target: Photoparoxysmal Response
      - target: Self-Sustaining Cortical After-Discharge
    evidence:
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Comparisons among groups showed no significant differences for P100
          latency. Higher P100 amplitude as well as higher after-discharge (AD)
          were found in photosensitive patients with RS.
        explanation: >-
          The direct measurement behind this node: timing of the visual response
          is normal, its amplitude is not, which is what licenses describing the
          abnormality as excessive cortical gain rather than altered conduction.
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The high amplitude of early VEP components confirms the abnormal
          hyperexcitability in the cortex of photosensitive patients with
          occipital lobe epilepsy.
        explanation: >-
          The authors' own reading of the amplitude finding as cortical
          hyperexcitability, which is the claim this node makes.
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Seizures provoked by visual stimuli may be induced by abnormal
          responses to light (photosensitivity) and structured patterns
          (patternsensitivity).
        explanation: >-
          Supports treating photosensitivity and pattern sensitivity as two
          expressions of one abnormal responsiveness at this node.
  - name: Photoparoxysmal Response
    biological_scale: TISSUE
    description: >-
      The electrographic event evoked by the stimulus: spikes, polyspikes or
      spike-wave appearing during intermittent photic stimulation, confined to
      the occipital regions in this syndrome or, in a substantial minority,
      spreading to a generalized field. The photoparoxysmal response is the
      laboratory correlate of the trigger and is what makes the diagnosis
      reproducible on demand. Importantly it is not itself a seizure: most
      photoparoxysmal responses are electrical events the patient does not
      experience.
    locations:
      - preferred_term: occipital lobe
        term:
          id: UBERON:0002021
          label: occipital lobe
    downstream:
      - target: Self-Sustaining Cortical After-Discharge
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          EEG features included normal background activity and occipital spikes
          or spike-waves in all but two patients. Eight patients also showed
          generalized epileptiform activity during intermittent photic
          stimulation.
        explanation: >-
          Documents the occipital electrographic abnormality against a normal
          background, and records that a majority also showed generalized
          activity on stimulation, which is the observation the
          focal-versus-generalized discussion is about.
      - reference: PMID:23027097
        reference_title: Occipital lobe seizures and epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Occipital spikes and/or occipital paroxysms either spontaneous or
          photically induced are the main interictal EEG abnormalities in
          idiopathic OLE.
        explanation: >-
          Establishes photically induced occipital paroxysms as a main
          electrographic abnormality of idiopathic occipital lobe epilepsy.
  - name: Self-Sustaining Cortical After-Discharge
    biological_scale: TISSUE
    description: >-
      The node that decides whether anything clinical happens. After the evoked
      response, cortical activity may run on by itself as an after-discharge, and
      the size of that after-discharge is what separates an electrical event from
      an experienced seizure: it is larger in photosensitive patients with reflex
      seizures than in those without, larger when a photoparoxysmal response
      occurs, and larger still when that response goes on to produce a clinical
      seizure. This is an unusually direct look at the threshold problem in
      epilepsy, because the same stimulus is delivered repeatedly and the graded
      variable can be measured on each trial.
    locations:
      - preferred_term: occipital lobe
        term:
          id: UBERON:0002021
          label: occipital lobe
    cell_types:
      - preferred_term: cortical neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: neuronal action potential
        term:
          id: GO:0019228
          label: neuronal action potential
        modifier: INCREASED
    downstream:
      - target: Occipital Seizure Onset with Elementary Visual Hallucinations
    evidence:
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The increase in amplitude of the AD was higher when PPR was associated
          with seizures.
        explanation: >-
          The core graded finding: after-discharge amplitude scales with whether
          the electrographic response becomes a clinical seizure, which is what
          makes this a threshold node rather than a descriptive one.
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Moreover, the AD amplitude appears to be related to electro-clinical
          expression, being greater when PPR evolves into clinically evident
          seizures.
        explanation: >-
          States the relationship between after-discharge amplitude and clinical
          expression explicitly, in the authors' own summary.
      - reference: PMID:32388124
        reference_title: >-
          Characteristics of visual evoked potentials related to the
          electro-clinical expression of reflex seizures in photosensitive
          patients with idiopathic occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Significant increases of P100 amplitude and higher values of AD
          amplitude were found in relation to the occurrence of photoparoxysmal
          response (PPR) and/or seizures during full-field pattern stimulation.
        explanation: >-
          Ties both the evoked-response amplitude and the after-discharge
          amplitude to the occurrence of the paroxysmal response and of
          seizures.
  - name: Occipital Seizure Onset with Elementary Visual Hallucinations
    biological_scale: ORGANISM
    description: >-
      The seizure begins where the stimulus was processed. The first symptom is
      visual and elementary, coloured shapes rather than formed imagery, which
      places onset in early visual cortex rather than in association areas. This
      is the feature that makes the syndrome focal despite the generalized
      company photosensitivity usually keeps.
    locations:
      - preferred_term: primary visual cortex
        term:
          id: UBERON:0002436
          label: primary visual cortex
    downstream:
      - target: Propagation to Vomiting, Headache and Secondary Generalization
      - target: Recurrent Visually Provoked Reflex Seizures
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In this study, we describe 13 neurologically normal patients in whom
          daytime seizures were always induced by television and began with
          elementary visual hallucinations, followed frequently by vomiting,
          headache and then secondary generalization.
        explanation: >-
          Establishes the whole ordered sequence in a single cohort: a
          reproducible visual trigger, an elementary visual opening symptom, and
          the propagation that follows it.
      - reference: PMID:23027097
        reference_title: Occipital lobe seizures and epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ictal clinical symptoms are mainly visual and oculomotor. Elementary
          visual hallucinations are common and characteristic.
        explanation: >-
          Confirms that elementary visual hallucination is the characteristic
          ictal symptom of occipital-onset seizures generally.
  - name: Propagation to Vomiting, Headache and Secondary Generalization
    biological_scale: ORGANISM
    description: >-
      What follows the visual opening. Vomiting and headache are frequent enough
      to be part of the recognized sequence rather than incidental, and the
      seizure may go on to become bilateral and convulsive. The autonomic and
      convulsive elements are a propagation phenomenon; the syndrome is still
      defined by where it starts.
    downstream:
      - target: Recurrent Visually Provoked Reflex Seizures
    evidence:
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In this study, we describe 13 neurologically normal patients in whom
          daytime seizures were always induced by television and began with
          elementary visual hallucinations, followed frequently by vomiting,
          headache and then secondary generalization.
        explanation: >-
          Names the propagation sequence directly: vomiting, then headache, then
          secondary generalization, following the visual onset.
      - reference: PMID:23027097
        reference_title: Occipital lobe seizures and epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Postictal headache occurs in more than half of patients
        explanation: >-
          Quantifies the headache component of the propagation sequence across
          occipital lobe epilepsies.
  - name: Recurrent Visually Provoked Reflex Seizures
    biological_scale: ORGANISM
    description: >-
      The clinical epilepsy: repeated seizures reliably elicited by a specific
      visual stimulus. Frequency is generally low, because it is governed by
      exposure rather than by an internal rhythm, and this is one of the few
      epilepsies where avoiding the trigger is itself a treatment. This node
      deliberately does not conform to the module's Recurrent Unprovoked Seizures
      node; see the discussion on the provoked-seizure boundary.
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Reflex seizures (RS) are epileptic events that are objectively and
          consistently elicited in response to a specific afferent stimulus or by
          an activity of the patient.
        explanation: >-
          Defines the reflex seizure by its consistent elicitation, which is the
          property that makes these seizures provoked by definition.
      - reference: PMID:10986003
        reference_title: Reflex occipital lobe epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Seizure frequency was low in all.
        explanation: >-
          Supports the low seizure frequency described here, consistent with
          frequency being governed by exposure rather than by an internal
          process.

datasets:
- accession: geo:GSE263666
  title: scRNAseq of CD8+ T cells from autoimmune encephalitis
  description: Single-cell RNA sequencing in seven anti-Ri autoimmune encephalitis (AIE) patients and three controls showed that neuron-reactive CD8+ T cells are cytotoxic KIR+ CD8+ regulatory T cells. In Ri-AIE, these cells had reduced KIR and IKZF2 (Helios) expression, alongside activated TCR signaling and elevated TNF and IFNG. They also overexpressed TOX, linked to brain-infiltrating cytotoxicity. These findings suggest a loss of regulatory function in KIR+ CD8+ T cells contributes to Ri-AIE pathogenesis.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 11
  publication: PMID:41022795
  notes: Identified by GEO DataSets index search for Autoimmune Encephalitis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
notes: >-
  Publication-readiness review through 2026-08-05: evidence remains dominated by
  retrospective cohorts, case series, consensus guidance, and subtype-specific
  mechanistic experiments; umbrella-level frequencies must not be generalized
  across antibodies. D2P audit dispositions (49/49): ACCEPTED as modeled clinical
  features—HP:0000708 atypical behavior, HP:0001289 confusion (represented by
  HP:0004372), HP:0002902 hyponatremia (LGI1 context), HP:0010532 paroxysmal
  vertigo was REJECTED (not a defining AE feature), HP:0001254 lethargy REJECTED,
  HP:0002315 headache REJECTED, HP:0002017 nausea/vomiting REJECTED,
  HP:0003470 paralysis REJECTED, HP:0010843 EEG focal slowing and HP:6001115 EEG
  temporal slowing ACCEPTED under the broader EEG-abnormality record,
  HP:0012229 CSF pleocytosis ACCEPTED as a biochemical/supportive finding,
  HP:6000397 CSF oligoclonal IgG bands and HP:0002922 increased CSF protein
  ACCEPTED as supportive CSF findings (protein retained in narrative scope, not a
  separate poorly specific record), HP:0012658 abnormal brain FDG-PET ACCEPTED
  as an imaging finding, HP:0002500 abnormal cerebral white-matter morphology
  REJECTED as nonspecific at umbrella level, HP:0006846 acute encephalopathy
  ACCEPTED through the case definition, HP:0000739 anxiety, HP:0000716
  depression, HP:0000737 irritability, and HP:0000853 goiter REJECTED as
  insufficiently specific standalone umbrella phenotypes, HP:0009102 anterior
  open-bite malocclusion, HP:0000872 Hashimoto thyroiditis, HP:0000821
  hypothyroidism, HP:0002721 immunodeficiency, HP:0001974 increased leukocytes,
  HP:0001873 thrombocytopenia, and HP:0005991 limited neck flexion REJECTED as
  contamination/nonspecific comorbidity; HP:0002181 cerebral edema,
  HP:0005318 cerebral vasculitis, HP:0100836 CNS malignant neoplasm, and
  HP:0001268 mental deterioration REJECTED as alternative pathology or overly
  nonspecific; HP:0002383 infectious encephalitis ACCEPTED only as a differential,
  never a phenotype. Antibody terms HP:5000005 anti-CASPR2, HP:5000010
  anti-GABABR, HP:5000016 anti-Hu, and HP:5000020 anti-LGI1 were ACCEPTED as
  subtype/biomarker associations, not phenotypes or proof of pathogenicity. The
  six unlinked local terms were dispositioned as follows: autonomic dysfunction
  REJECTED from the heterogeneous umbrella phenotype list for lack of a valid
  frequency source; dyskinesia ACCEPTED as movement disorder; memory impairment
  ACCEPTED as cognitive impairment; psychosis ACCEPTED only within the grouped
  psychiatric/behavioral phenotype; recurrent fever REJECTED because the source
  term/polarity was wrong and prodromal fever is nonspecific; seizure ACCEPTED.
  Broader matches HP:0012332 abnormal autonomic physiology was REJECTED at
  umbrella level but remains subtype-relevant; HP:0007359 focal seizure,
  HP:0002197 generalized seizure, and HP:0002133 status epilepticus were
  CONSOLIDATED under seizure because the umbrella cohort did not justify separate
  frequencies; HP:0033687 short-term memory impairment was CONSOLIDATED under
  cognitive impairment. No unsupported edges were added to increase connectivity.

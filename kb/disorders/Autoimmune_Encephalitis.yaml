    A nationwide centralized-testing cohort estimated a crude incidence of 2.8
    cases per million person-years for antibody-positive AE in Denmark during
    2019-2023; this excludes some seronegative disease and depends on ascertainment.
  unit: cases per million person-years
  evidence:
  - reference: PMID:42493607
    reference_title: "Fifteen years of autoimmune encephalitis in Denmark: incidence, epidemiology, and trends in treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The national average crude incidence rate (IR) in 2019-2023 was 2.8 cases per million person-years."
    explanation: This is a primary nationwide cohort estimate with a defined antibody-positive case frame.
- name: Broad AE incidence range
  description: >-
    Guideline synthesis estimates incidence at approximately 0.2-0.8 per

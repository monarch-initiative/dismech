  unit: cases per 100000 person-years
  evidence:
  - reference: DOI:10.1017/cjn.2024.16
    reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "with an incidence of 0.2 – 0.8 per 100,000-person years."
    explanation: This is a guideline-level synthesis, not a new primary estimate.
pathophysiology:
- name: Neural Antigen-Directed Autoimmunity
  description: >-
    AE comprises immune responses to extracellular neuronal surface/synaptic
    targets, intracellular/onconeural targets, and sometimes unidentified
    antigens. Antibody detection establishes association only; pathogenicity
    requires functional or transfer evidence.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: INCREASED
    term:
      id: GO:0002250
      label: adaptive immune response
  downstream:
  - target: Anti-GluN1 IgG-Mediated NMDAR Cluster Loss
    causal_link_type: DIRECT
    description: GluN1-directed autoimmunity can produce pathogenic receptor-cluster loss.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "adding patients’ IgG to rat hippocampal neuronal cultures produced a concentration-dependent decrease of the cell-surface fraction of NMDA receptors"
      explanation: Primary functional experiments support this subtype-specific route.
  - target: AMPAR Antibody-Mediated Synaptic Cluster Loss
    causal_link_type: DIRECT
    description: GluA1/GluA2-directed autoimmunity can reduce synaptic AMPAR clusters.
    evidence:
    - reference: PMID:19338055
      reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patients' antibodies alter the synaptic localization and number of AMPARs."
      explanation: Primary culture evidence supports this subtype-specific route.
  - target: LGI1-ADAM22/23 Synaptic Signaling Disruption
    causal_link_type: DIRECT
    description: LGI1-directed autoimmunity can neutralize LGI1-ADAM22/23 signaling.
    evidence:
    - reference: PMID:24227725
      reference_title: "Autoantibodies to epilepsy-related LGI1 in limbic encephalitis neutralize LGI1-ADAM22 interaction and reduce synaptic AMPA receptors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "LGI1 antibodies associated with LE specifically inhibited the ligand-receptor interaction between LGI1 and ADAM22/23"
      explanation: Primary mechanistic work supports the route.
  - target: Intracellular-Antigen Cytotoxic T-Cell Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Tumor or self-antigen presentation to cytotoxic T cells
    description: Intracellular/onconeural antigen autoimmunity is linked to cytotoxic lymphocyte injury rather than antibody access to the target.
    evidence:
    - reference: PMID:22539258
      reference_title: "Immunopathology of autoantibody-associated encephalitides: clues for pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our findings strongly support a central role for T cell-mediated neuronal cytotoxicity in encephalitides with antibodies against intracellular antigens."
      explanation: Comparative immunopathology in 17 cases supports the intracellular-antigen route.
  evidence:
  - reference: PMID:26906964
    reference_title: "A clinical approach to diagnosis of autoimmune encephalitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "aims of developing a practical, syndrome-based diagnostic approach to autoimmune encephalitis"
    explanation: Consensus evidence supports the heterogeneous syndrome framing; it does not imply a single causal pathway.
- name: Anti-GluN1 IgG-Mediated NMDAR Cluster Loss
  description: >-
    In anti-NMDAR encephalitis, patient IgG binds extracellular GluN1 epitopes
    and selectively, concentration-dependently, and reversibly reduces
    postsynaptic NMDAR clusters without causing neuronal apoptosis in culture.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: glutamate receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
  downstream:
  - target: Reversible Synaptic Network Dysfunction
    causal_link_type: DIRECT
    description: Reduced synaptic NMDAR density alters glutamatergic transmission.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Together, these findings show that patients’ antibodies produce a selective and reversible decrease of NMDA-receptor clusters in postsynaptic dendrites."
      explanation: Primary neuronal-culture experiments directly support this edge.
  evidence:
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "adding patients’ IgG to rat hippocampal neuronal cultures produced a concentration-dependent decrease of the cell-surface fraction of NMDA receptors"
    explanation: This primary experiment supports pathogenic antibody action rather than association alone.
- name: AMPAR Antibody-Mediated Synaptic Cluster Loss
  description: >-
    AMPAR patient antibodies reduce GluA2-containing synaptic AMPAR clusters in
    cultured neurons, with reversal after antibody removal.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: glutamate receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
  downstream:
  - target: Reversible Synaptic Network Dysfunction
    causal_link_type: DIRECT
    description: Loss of synaptic AMPAR localization impairs excitatory transmission.
    evidence:
    - reference: PMID:19338055
      reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Application of antibodies to cultures of neurons significantly decreased the number of GluR2-containing AMPAR clusters at synapses with a smaller decrease in overall AMPAR cluster density; these effects were reversed after antibody removal."
      explanation: Primary culture data directly support the causal edge.
  evidence:
  - reference: PMID:19338055
    reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patients' antibodies alter the synaptic localization and number of AMPARs."
    explanation: Functional evidence distinguishes pathogenicity from clinical association.
- name: LGI1-ADAM22/23 Synaptic Signaling Disruption
  description: >-
    LGI1 antibodies can disrupt LGI1 interactions with ADAM22/ADAM23 and alter
    synaptic organization or excitability. Epitope and IgG-subclass differences
    mean effects are not uniform across all patient antibodies.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    modifier: ABNORMAL
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  downstream:
  - target: Reversible Synaptic Network Dysfunction
    causal_link_type: DIRECT
    description: Disrupted LGI1 trans-synaptic signaling changes neuronal excitability.
    evidence:
    - reference: PMID:24227725
      reference_title: "Autoantibodies to epilepsy-related LGI1 in limbic encephalitis neutralize LGI1-ADAM22 interaction and reduce synaptic AMPA receptors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "LGI1 antibodies associated with LE specifically inhibited the ligand-receptor interaction between LGI1 and ADAM22/23"
      explanation: Primary experiments support the interaction effect.
  evidence:
  - reference: PMID:24227725
    reference_title: "Autoantibodies to epilepsy-related LGI1 in limbic encephalitis neutralize LGI1-ADAM22 interaction and reduce synaptic AMPA receptors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LGI1 antibodies associated with LE specifically inhibited the ligand-receptor interaction between LGI1 and ADAM22/23 by targeting the EPTP repeat domain of LGI1 and reversibly reduced synaptic AMPA receptor clusters in rat hippocampal neurons."
    explanation: Primary functional evidence verifies both interaction neutralization and a downstream synaptic effect.
- name: Intracellular-Antigen Cytotoxic T-Cell Injury
  description: >-
    In onconeural/intracellular-antigen syndromes, the antibody usually marks a
    tumor-associated cellular immune response; cytotoxic T cells, rather than
    antibody binding to an inaccessible intracellular antigen, are considered
    the dominant neuronal-injury mechanism.
  cell_types:
  - preferred_term: cytotoxic T cell
    term:
      id: CL:0000910
      label: cytotoxic T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    modifier: INCREASED
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
  downstream:
  - target: Irreversible Inflammatory Neuronal Injury
    causal_link_type: DIRECT
    description: Antigen-directed cytotoxic lymphocytes injure neurons.
    evidence:
    - reference: PMID:19338055
      reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "the autopsy confirmed prominent cytotoxic T-cell infiltrates in the limbic system."
      explanation: A CRMP5-overlap autopsy supports cytotoxic infiltration, but a single case cannot establish a universal mechanism.
  evidence:
  - reference: PMID:22539258
    reference_title: "Immunopathology of autoantibody-associated encephalitides: clues for pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a higher CD8/CD3 ratio and more frequent appositions of granzyme-B(+) cytotoxic T cells to neurons, with associated neuronal loss, in the intracellular antigen-onconeural group (anti-Hu and anti-Ma2 cases)"
    explanation: Comparative tissue immunopathology provides purpose-built support beyond a single overlap case.
  - reference: PMID:19338055
    reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the autopsy confirmed prominent cytotoxic T-cell infiltrates in the limbic system."
    explanation: Primary pathology supports T-cell-predominant injury in an intracellular-antigen overlap case.
- name: Reversible Synaptic Network Dysfunction
  description: >-
    Surface-antibody-mediated receptor or synaptic-protein effects converge on
    dysfunctional neuronal networks and can improve when antibody exposure ends.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: chemical synaptic transmission
    modifier: ABNORMAL
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered excitatory and inhibitory network balance
    description: Synaptic receptor disruption can create seizure-prone networks.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "During the first 3 weeks of symptom presentation, 76 patients had seizures."
      explanation: Clinical co-occurrence plus direct receptor-loss experiments support, but do not isolate, this path.
  - target: Cognitive Impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Impaired synaptic plasticity in memory networks
    description: Receptor and synaptic-protein effects impair learning and memory networks.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "This feature is compatible with disruption of the mechanisms of synaptic plasticity, thought to underlie learning and memory, in which the NMDA receptors play a key part."
      explanation: The authors connect NMDAR synaptic plasticity disruption to amnesia; umbrella generalization remains partial.
  - target: Psychiatric or Behavioral Disorder
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Neurotransmitter and circuit dysregulation
    description: Synaptic receptor dysfunction can generate psychiatric and behavioral manifestations.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "several NMDA-receptor antagonists such as MK801, ketamine, and phencyclidine cause symptoms similar to anti-NMDA-receptor encephalitis, including psychotic behaviour"
      explanation: Pharmacologic phenocopy supports a mechanistic connection in anti-NMDAR disease.
  - target: Movement Disorder
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Dopaminergic circuit dysregulation
    description: NMDAR disruption can perturb motor circuits and produce dyskinesia.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "signs of involvement of dopaminergic pathways (rigidity, dystonia, orofacial movements, tremor)"
      explanation: Pharmacologic and clinical patterns support an indirect anti-NMDAR-specific route.
  evidence:
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patients’ antibodies did not change the concentrations of the postsynaptic protein PSD-95"
    explanation: Selective receptor loss without generalized postsynaptic destruction supports reversible dysfunction.
- name: Irreversible Inflammatory Neuronal Injury
  description: >-
    T-cell-predominant intracellular-antigen encephalitis can cause destructive
    neuronal injury and generally responds less well than surface-antibody disease.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:19338055
    reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the accompanying immune responses, particularly if associated with cytotoxic T-cell mechanisms, are more difficult to treat, or that the neuronal dysfunction is less reversible"
    explanation: The authors cautiously infer lower reversibility from overlapping cytotoxic T-cell disease.

discussions:
- discussion_id: antibody_association_vs_pathogenicity
  prompt: Which AE antibodies are pathogenic effectors versus biomarkers of another immune mechanism?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Neural Antigen-Directed Autoimmunity
  rationale: >-
    NMDAR and AMPAR antibodies have direct culture and transfer evidence;
    LGI1/CASPR2 effects vary by epitope/subclass; intracellular antibodies such
    as Hu are chiefly biomarkers of cytotoxic T-cell disease. A positive test
    must not be converted into a uniform antibody-causal edge.
- discussion_id: comparative_treatment_evidence_gap
  prompt: Which acute, escalation, and maintenance regimens improve patient-centered outcomes by AE subtype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Acute First-Line Immunotherapy
  - treatments#Maintenance Immunosuppression
  rationale: >-
    Most recommendations derive from retrospective evidence and expert
    consensus. CIELO, ExTINGUISH, and RADIA may address selected subtypes, but
    their protocols do not yet establish efficacy.

      Supports a frequent prodromal viral-like illness, of which low-grade fever
      is the usual component. Tagged PARTIAL because the source says
      "viral-like symptoms" rather than naming fever specifically, and because
      the case series found no evidence of actual viral infection.
treatments:
- name: First-Line Immunotherapy
  description: >-
    Combination of corticosteroids, intravenous immunoglobulin, and/or
    plasma exchange. Approximately 53% of patients improve within 4 weeks
    of first-line treatment or tumor removal.
  evidence:
  - reference: PMID:23290630
    reference_title: "Treatment and prognostic factors for long-term outcome in patients with anti-NMDA receptor encephalitis: an observational cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      472 (94%) underwent first-line immunotherapy or tumour removal,
      resulting in improvement within 4 weeks in 251 (53%).
    explanation: >-
      Large observational cohort showing majority of patients receive
      first-line immunotherapy with about half responding within 4 weeks.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Intrathecal Antibody Production
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids, IVIG, and plasma exchange suppress or remove pathogenic
      autoantibodies (anti-NMDAR, anti-LGI1, anti-CASPR2) that drive receptor
      internalization and synaptic dysfunction.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the inability of most commonly used treatments (corticosteroids, plasma
        exchange, intravenous immunoglobulin) to result in a rapid and sustained
        control of the immune response within the CNS
      explanation: >-
        Names corticosteroids, plasma exchange and IVIG as acting on the immune
        response, while noting that they control the intrathecal compartment
        only slowly - which is exactly why recovery is protracted and why
        B-cell-depleting second-line therapy is needed.
  - target: Antibody-Mediated NMDA Receptor Internalization
    treatment_effect: INHIBITS
    description: >-
      By reducing circulating autoantibody levels, first-line immunotherapy
      limits ongoing antibody-mediated NMDA receptor internalization and
      restores synaptic transmission.
    evidence:
    - reference: PMID:18851928
      reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients who improved had a parallel decrease of serum titres, whereas
        those who did not improve maintained high titres in CSF and serum
      explanation: >-
        Clinical improvement tracks falling antibody titres, and the in vitro
        receptor loss is reversible on antibody removal - together supporting
        that lowering autoantibody levels reverses receptor internalization.
- name: Rituximab
  description: >-
    Second-line immunotherapy for patients who fail first-line treatment.
    Depletes CD20+ B cells to reduce antibody production. Patients who
    receive second-line immunotherapy have significantly better outcomes
    than those who do not.
  evidence:
  - reference: PMID:23290630
    reference_title: "Treatment and prognostic factors for long-term outcome in patients with anti-NMDA receptor encephalitis: an observational cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 221 patients who did not improve with first-line treatment, 125
      (57%) received second-line immunotherapy that resulted in a better
      outcome (mRS 0-2) than those who did not
    explanation: >-
      Second-line immunotherapy (rituximab/cyclophosphamide) significantly
      improves outcomes in treatment-refractory patients.
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 80% of patients improve with immunotherapy and, if needed,
      tumour removal, but the recovery is slow.
    explanation: >-

differential_diagnoses:
- name: Infectious Encephalitis
  description: >-
    HSV and other infections can closely mimic AE and require urgent CSF PCR,
    cultures, and empiric antimicrobial management when indicated before or
    alongside immunotherapy.
  evidence:
  - reference: DOI:10.1055/s-0044-1788586
    reference_title: Brazilian consensus recommendations on the diagnosis and treatment of autoimmune encephalitis in the adult and pediatric populations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Herpesvirus encephalitis should be ruled out with CSF polymerase chain reactions (PCRs)."
    explanation: Consensus includes herpesvirus exclusion in CSF workup.
- name: Primary Psychiatric Disorder
  description: >-
    Isolated psychiatric illness is a common mimic; seizures, dyskinesia,
    autonomic instability, catatonia, focal findings, CSF inflammation, or
    characteristic EEG/MRI increase concern for AE.
  evidence:
  - reference: PMID:37582614
    reference_title: "Mimics of Autoimmune Encephalitis: Validation of the 2016 Clinical Autoimmune Encephalitis Criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common AE mimics and misdiagnoses were neuroinflammatory CNS disorders (26%), psychiatric disorders (19%), epilepsy with a noninflammatory cause (13%), CNS infections (7%), neurodegenerative diseases (7%), and CNS neoplasms (6%)."
    explanation: A primary referral cohort identifies psychiatric disorders as a common mimic.
- name: Noninflammatory Epilepsy or Status Epilepticus
  description: Seizures and postictal encephalopathy can mimic AE without autoimmune inflammation.
  evidence:
  - reference: PMID:37582614
    reference_title: "Mimics of Autoimmune Encephalitis: Validation of the 2016 Clinical Autoimmune Encephalitis Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "epilepsy with a noninflammatory cause (13%)"
    explanation: A primary referral-cohort validation identifies noninflammatory epilepsy as a common mimic.
- name: Neurodegenerative or Rapidly Progressive Dementia
  description: Prion and other neurodegenerative diseases can produce rapid cognitive, psychiatric, movement, EEG, or MRI abnormalities.
  evidence:
  - reference: PMID:37582614
    reference_title: "Mimics of Autoimmune Encephalitis: Validation of the 2016 Clinical Autoimmune Encephalitis Criteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common AE mimics and misdiagnoses were neuroinflammatory CNS disorders (26%), psychiatric disorders (19%), epilepsy with a noninflammatory cause (13%), CNS infections (7%), neurodegenerative diseases (7%), and CNS neoplasms (6%)."
    explanation: A primary referral cohort quantifies this mimic category.
- name: Toxic-Metabolic Encephalopathy
  description: Medication, substance, endocrine, electrolyte, hepatic, renal, and nutritional causes require targeted exclusion.
- name: CNS Neoplasm, Stroke, or Other Neuroinflammatory Disease
  description: >-
    Tumor, lymphoma, vascular lesions, demyelinating disease, CNS vasculitis,
    and GFAP/MOG-associated disorders may overlap clinically or radiographically.
  evidence:
  - reference: PMID:37582614
    reference_title: "Mimics of Autoimmune Encephalitis: Validation of the 2016 Clinical Autoimmune Encephalitis Criteria."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common AE mimics and misdiagnoses were neuroinflammatory CNS disorders (26%), psychiatric disorders (19%), epilepsy with a noninflammatory cause (13%), CNS infections (7%), neurodegenerative diseases (7%), and CNS neoplasms (6%)."
    explanation: The cohort supports both broad neuroinflammatory and CNS-neoplasm mimic categories; individual diagnoses require separate workup.
experimental_models:
- name: Patient-CSF Hippocampal Neuron Culture Model
  description: >-
    Rat hippocampal neurons exposed to anti-NMDAR patient CSF/IgG model
    concentration-dependent, selective, reversible loss of surface and
    postsynaptic NMDAR clusters without apoptosis.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Norway rat
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  modeled_mechanisms:
  - target: Anti-GluN1 IgG-Mediated NMDAR Cluster Loss
    description: Direct patient-antibody exposure tests receptor-cluster effects.
  findings:
  - statement: Patient IgG selectively and reversibly reduces postsynaptic NMDAR clusters.
    supporting_text: "Together, these findings show that patients’ antibodies produce a selective and reversible decrease of NMDA-receptor clusters in postsynaptic dendrites."
  evidence:
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "adding patients’ IgG to rat hippocampal neuronal cultures produced a concentration-dependent decrease of the cell-surface fraction of NMDA receptors"
    explanation: Primary culture experiment provides direct mechanistic evidence but does not reproduce the full syndrome.
- name: Chronic Patient-CSF Passive-Transfer Mouse Model
  description: >-
    Continuous intraventricular infusion of anti-NMDAR patient CSF produces
    memory impairment and brain-bound human antibody in mice. It models one
    antibody-mediated domain, not the full human psychiatric, autonomic, tumor,
    or T-cell spectrum of AE.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Anti-GluN1 IgG-Mediated NMDAR Cluster Loss
    description: Passive transfer tests whether patient CSF is sufficient for memory dysfunction.
  findings:
  - statement: Chronic patient-CSF exposure induced memory deficits in mice.
    supporting_text: "chronic exposure to CSF from patients with anti-NMDAR encephalitis induces memory deficits in mice"
  evidence:
  - reference: PMID:26616272
    reference_title: "Induction of Memory Deficit in Mice with Chronic Exposure to Cerebrospinal Fluid from Patients with Anti-N-Methyl-D-Aspartate Receptor Encephalitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice exposed to NMDAR-CSF showed impaired spatial memory, as detected with the Morris water maze test."
    explanation: Passive transfer supports pathogenic sufficiency for a restricted phenotype.

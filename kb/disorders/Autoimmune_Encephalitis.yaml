name: Autoimmune Encephalitis
creation_date: "2026-03-06T00:00:00Z"
updated_date: "2026-05-08T16:21:17Z"
category: Autoimmune
disease_term:
  preferred_term: autoimmune encephalitis
  term:
    id: MONDO:0020640
    label: autoimmune encephalitis
parents:
- Neurological Disease
- Autoimmune Disease
description: >-
  A group of rare autoimmune neurological disorders characterized by
  antibodies targeting neuronal surface or synaptic proteins, leading to
  subacute onset of neuropsychiatric symptoms including seizures, memory
  impairment, psychosis, movement disorders, and autonomic dysfunction.
  Anti-NMDA receptor encephalitis is the most common and best-characterized
  subtype. Early immunotherapy is associated with improved outcomes.
has_subtypes:
- name: Anti-NMDA Receptor Encephalitis
  description: >-
    The most common form, predominantly affecting young women and children.
    Caused by antibodies against the GluN1 subunit of the NMDA receptor.
    Progresses through phases: prodromal, psychiatric, movement disorder,
    autonomic instability, and recovery. Associated with ovarian teratomas
    in a significant proportion of adult women.
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is more prevalent in women (with a female to male ratio of
      around 8:2) and about 37% of patients are younger than 18 years at
      presentation of the disease. Tumours, usually ovarian teratoma, and
      herpes simplex encephalitis are known triggers of NMDAR autoimmunity.
    explanation: >-
      Confirms female predominance and ovarian teratoma association in
      anti-NMDAR encephalitis.
- name: Anti-LGI1 Encephalitis
  description: >-
    Limbic encephalitis caused by antibodies against leucine-rich
    glioma-inactivated 1 (LGI1). Predominantly affects older men. Presents
    with faciobrachial dystonic seizures, memory impairment, and
    hyponatremia.
  evidence:
  - reference: PMID:27485013
    reference_title: "From VGKC to LGI1 and Caspr2 encephalitis: The evolution of a disease entity over time."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with LGI1-antibodies have a limbic encephalitis, often with
      hyponatremia, and about half of the patients have typical faciobrachial
      dystonic seizures.
    explanation: >-
      Directly supports all three defining features recorded for this subtype:
      limbic encephalitis, hyponatremia, and faciobrachial dystonic seizures
      (in about half of patients).
- name: Anti-CASPR2 Encephalitis
  description: >-
    Caused by antibodies against contactin-associated protein-like 2
    (CASPR2). Presents with limbic encephalitis, neuromyotonia, or
    Morvan syndrome. Associated with thymoma.
  evidence:
  - reference: PMID:27371488
    reference_title: "The clinical spectrum of Caspr2 antibody-associated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent syndromes included limbic encephalitis (42%) and Morvan
      syndrome (29%).
    explanation: >-
      A 38-patient two-centre cohort confirms limbic encephalitis and Morvan
      syndrome as the two most frequent CASPR2 presentations.
  - reference: PMID:27371488
    reference_title: "The clinical spectrum of Caspr2 antibody-associated disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A tumor, mostly thymoma, occurred in 19% of the patients.
    explanation: >-
      Quantifies the thymoma association recorded in the subtype description
      (19% of patients had a tumour, mostly thymoma).
pathophysiology:
- name: Antibody-Mediated NMDA Receptor Internalization
  description: >-
    In anti-NMDA receptor encephalitis, IgG antibodies crosslink and
    internalize NMDA receptors, reducing receptor density at synapses and
    disrupting glutamatergic neurotransmission. This leads to disinhibition
    of excitatory pathways and the characteristic neuropsychiatric
    manifestations. The antibodies serve as both a diagnostic marker and
    a pathogenic mediator that alters NMDAR-related synaptic transmission.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: Glutamate receptor signaling pathway
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
  - preferred_term: Immune response
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      autoantibodies serve as a diagnostic marker and alter NMDAR-related
      synaptic transmission
    explanation: >-
      Confirms antibodies both diagnose and directly cause disease by
      altering NMDAR synaptic transmission.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      adding patients' IgG to rat hippocampal neuronal cultures produced a
      concentration-dependent decrease of the cell-surface fraction of NMDA
      receptors
    explanation: >-
      Direct experimental demonstration of the mechanism named in this node -
      patient IgG reduces the cell-surface pool of NMDA receptors in a
      dose-dependent manner.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      these findings show that patients' antibodies produce a selective and
      reversible decrease of NMDA-receptor clusters in postsynaptic dendrites
    explanation: >-
      Establishes that the receptor loss is selective for NMDA receptors (PSD-95
      unchanged) and reversible on antibody removal, which is the mechanistic
      basis for the potential reversibility of the clinical syndrome.
- name: Intrathecal Antibody Production
  description: >-
    B cells and plasma cells within the central nervous system produce
    pathogenic antibodies intrathecally. Germinal center-like structures
    may form in the meninges, sustaining local antibody production.
    This explains why serum antibody titers do not always correlate
    with disease severity.
  cell_types:
  - preferred_term: Plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  evidence:
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all 53 patients had higher concentrations of antibodies in CSF than in
      sera, indicating intrathecal synthesis of antibodies
    explanation: >-
      In 53 patients with an intact blood-brain barrier, normalized IgG
      concentrations were higher in CSF than in serum, which is the direct
      evidence for intrathecal antibody production modelled by this node.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the decrease of CSF antibody titres was substantially slower than that of
      serum titres
    explanation: >-
      Supports the claim that serum titres do not track disease activity:
      intrathecally produced antibody persists in CSF after serum titres fall,
      which is also why recovery is slow.
- name: IL-6 Production by Activated Immune Cells
  description: >-
    Activated CD4+ T cells, macrophages, and B cells in autoimmune
    encephalitis secrete interleukin-6 (IL-6). Multi-omics profiling of AIE
    cerebrospinal fluid identifies the IL6-STAT3 axis as a candidate
    therapeutic target, implicating elevated IL-6 production as an upstream
    contributor to immune-inflammatory pathology.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: Interleukin-6 production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:42162799
    reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune-inflammatory response and lipid metabolism are pivotal in AIE
      progression and the IL6-STAT3 axis holds promise as a potential
      therapeutic target.
    explanation: >-
      CSF multi-omics in AIE patients versus controls nominates the IL6-STAT3
      axis, of which IL-6 production by activated immune cells is the upstream
      arm modelled by this node.
  downstream:
  - target: STAT3 Activation via JAK-STAT Cascade
    description: >-
      IL-6 binding to the IL-6 receptor complex triggers JAK-mediated
      phosphorylation and activation of STAT3 in responding cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42162799
      reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        identified several potential therapeutic targets for AIE, including the
        IL6-STAT3 axis
      explanation: >-
        The multi-omics study nominates IL6-STAT3 as a single axis in AIE; the
        IL-6-to-STAT3 coupling step itself is canonical cytokine biology rather
        than a finding of this study, hence PARTIAL.
- name: STAT3 Activation via JAK-STAT Cascade
  description: >-
    IL-6 receptor engagement activates the JAK-STAT cascade, driving STAT3
    phosphorylation and nuclear translocation. CSF multi-omics analysis
    nominates the IL6-STAT3 axis as a potential therapeutic target in AIE,
    consistent with STAT3 acting as a hub that converts upstream IL-6 signal
    into a pro-inflammatory transcriptional programme.
  biological_processes:
  - preferred_term: JAK-STAT cascade
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:42162799
    reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Integrated multi-omics analysis validated these findings and identified
      several potential therapeutic targets for AIE, including the IL6-STAT3
      axis.
    explanation: >-
      CSF multi-omics in 65 AIE patients vs controls identified the IL6-STAT3
      axis among the candidate therapeutic targets, supporting its inferred
      role in AIE immune-inflammatory pathology.
  downstream:
  - target: Pro-inflammatory Cytokine Amplification
    description: >-
      Activated STAT3 drives transcription of additional pro-inflammatory
      cytokines, amplifying the inflammatory response.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42162799
      reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Proteomic analysis identified 163 DEPs, with enrichment of 87 canonical
        pathways primarily associated with immune-inflammatory responses
      explanation: >-
        CSF proteomics shows broad enrichment of immune-inflammatory pathways in
        AIE, consistent with amplification downstream of STAT3. PARTIAL because
        the study does not demonstrate STAT3-dependence of that amplification.
- name: Pro-inflammatory Cytokine Amplification
  description: >-
    STAT3-driven transcription amplifies the production of pro-inflammatory
    cytokines, broadening immune activation beyond the initial IL-6 signal.
  biological_processes:
  - preferred_term: Cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: INCREASED
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:42162799
    reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      enrichment of 87 canonical pathways primarily associated with
      immune-inflammatory responses, neuronal-synaptic dysfunction, and cell
      signaling and metabolic pathways
    explanation: >-
      CSF proteomics in AIE patients shows that immune-inflammatory response
      pathways dominate the differentially expressed protein signature,
      supporting broad inflammatory amplification in the CSF compartment.
  downstream:
  - target: CNS Immune Cell Infiltration
    description: >-
      Cytokine-rich milieu promotes leukocyte chemotaxis across the
      blood-brain barrier into the central nervous system.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Cytokine-induced adhesion molecule upregulation on cerebral
      endothelium
    - Chemokine gradients across the blood-brain barrier
    evidence:
    - reference: PMID:42162799
      reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CSF leukocyte, erythrocyte, lymphocyte, and mononuclear cell counts were
        also elevated in AIE patients.
      explanation: >-
        Elevated CSF leukocyte, lymphocyte and mononuclear cell counts show that
        immune cells do reach the CNS compartment alongside the inflammatory
        protein signature. PARTIAL because the cross-sectional design cannot
        establish that cytokine amplification causes the infiltration.
- name: CNS Immune Cell Infiltration
  description: >-
    Pro-inflammatory cytokines and chemokines recruit leukocytes (T cells,
    macrophages, B cells) across the blood-brain barrier into the central
    nervous system parenchyma and meninges.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell

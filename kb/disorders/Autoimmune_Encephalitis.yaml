environmental:
- name: Underlying Neoplasm
  influences_mechanisms:
  - target: Neural Antigen-Directed Autoimmunity
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Tumour risk in this entry varies so widely by antibody that no single
      route can be claimed across the syndrome. Graded below the checkpoint
      inhibitor link into this same node because that one has a sentence
      naming autoimmunity, while this one has a screening recommendation and a
      timing statistic.
    evidence:
    - reference: DOI:10.1017/cjn.2024.16
      reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "All adult patients presenting with AIE should undergo screening for malignancy at the time of diagnosis."
      explanation: >-
        Consensus recommendation that every adult presenting with the syndrome
        be screened for malignancy. It records what clinicians should do, not
        how a tumour reaches this node.
    - reference: DOI:10.1017/cjn.2024.16
      reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "While paraneoplastic neurological disorders may precede a neoplasm diagnosis, a tumor is found within 1 year of presentation in >90% of cases with solid tumors"
      explanation: >-
        Quantifies how tightly the tumour tracks the neurological presentation
        in paraneoplastic cases. Still a temporal association, which is why
        this stays partial.
  description: >-
    Tumor risk varies greatly by antibody; adult initial presentations require
    malignancy screening, and tumor treatment is part of disease management.
  effect: Triggers or sustains paraneoplastic autoimmunity
  evidence:
  - reference: DOI:10.1017/cjn.2024.16
    reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All adult patients presenting with AIE should undergo screening for malignancy at the time of diagnosis."
    explanation: This is a consensus recommendation across heterogeneous tumor risks.
- name: Herpes Simplex Encephalitis
  exposure_term:
    preferred_term: herpes simplex virus type 1
    term:
      id: XCO:0000451
      label: Herpes simplex virus type 1
  influences_mechanisms:
  - target: Anti-GluN1 IgG-Mediated NMDAR Cluster Loss
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Viral destruction of neurons releases synaptic antigen into a
      compartment the immune system can reach, and a GluN1-directed IgG
      response follows in a minority of survivors. Pointed at the NMDAR node
      rather than the general autoimmunity node because the association is
      specific to that antibody, which the entry's own evidence explanation
      already says.
    evidence:
    - reference: PMID:31326280
      reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Tumours, usually ovarian teratoma, and herpes simplex encephalitis are known triggers of NMDAR autoimmunity."
      explanation: >-
        Names herpes simplex encephalitis as a known trigger of NMDAR
        autoimmunity specifically, which is the antibody this node carries.
  description: Prior HSV encephalitis is an established trigger of secondary anti-NMDAR autoimmunity.
  effect: Post-infectious trigger
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tumours, usually ovarian teratoma, and herpes simplex encephalitis are known triggers of NMDAR autoimmunity."
    explanation: The association is specific to post-HSE NMDAR autoimmunity, not every AE subtype.
- name: Immune Checkpoint Inhibitor Exposure
  exposure_term:
    preferred_term: immune checkpoint inhibitor exposure
    term:
      id: ECTO:9001737
      label: exposure to antineoplastic agent
  influences_mechanisms:
  - target: Neural Antigen-Directed Autoimmunity
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Releasing the checkpoint brakes on T cells lifts them against self
      antigens as well as tumour ones, which is the same adaptive-resistance
      machinery the immune_checkpoint_blockade module models from the tumour's
      side. Loss of peripheral tolerance is the intervening step. Recorded as
      predisposing rather than triggering because most treated patients never
      develop it.
    evidence:
    - reference: DOI:10.1017/cjn.2024.16
      reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Immune checkpoint inhibitors (ICIs), used in the treatment of a growing number of malignancies, have also been identified as conferring increased risk for diverse neurological autoimmune complications, including AIE."
      explanation: >-
        Guideline synthesis identifying checkpoint inhibitors as conferring
        increased risk of diverse neurological autoimmune complications,
        naming the autoimmunity this node holds rather than the syndrome
        alone.
  description: Immune checkpoint inhibition can precipitate immune-mediated encephalitis as an adverse event.
  effect: Iatrogenic immune trigger
  evidence:
  - reference: DOI:10.1017/cjn.2024.16
    reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Immune checkpoint inhibitors (ICIs), used in the treatment of a growing number of malignancies, have also been identified as conferring increased risk for diverse neurological autoimmune complications, including AIE."
    explanation: Guideline synthesis directly identifies immune checkpoint inhibition as an iatrogenic risk.
progression:
- phase: Subacute onset
  notes: Core cognitive, mental-status, psychiatric, seizure, or focal features progress over less than three months.
  evidence:
  - reference: DOI:10.1055/s-0044-1788586
    reference_title: Brazilian consensus recommendations on the diagnosis and treatment of autoimmune encephalitis in the adult and pediatric populations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Subacute onset (rapid progression in fewer than than three months)"
    explanation: Consensus criteria define the onset window.
- phase: Acute treatment and early recovery
  notes: >-
    Treatment should begin promptly after reasonable infectious exclusion when
    clinical suspicion is high; recovery rate and tempo vary by subtype and severity.
  evidence:
  - reference: DOI:10.1055/s-0044-1788586
    reference_title: Brazilian consensus recommendations on the diagnosis and treatment of autoimmune encephalitis in the adult and pediatric populations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment should be started within the first 4 weeks of symptoms."
    explanation: This is a consensus timing recommendation, not randomized evidence.
- phase: Relapse or persistent sequelae
  notes: >-
    Relapse rates differ by antibody and cohort; objective new worsening after
    improvement or plateau should be distinguished from fluctuating sequelae,
    psychiatric disease, epilepsy, infection, and treatment complications.
  evidence:
  - reference: DOI:10.1017/cjn.2024.16
    reference_title: "Canadian Consensus Guidelines for the Diagnosis and Treatment of Autoimmune Encephalitis in Adults"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CASPR2 antibody encephalitis indicate relapse rates ranging from 10 to 41% and symptoms may be identical to the index episode"
    explanation: Guideline synthesis supports a wide subtype-dependent range.

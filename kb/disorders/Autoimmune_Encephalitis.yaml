name: Autoimmune Encephalitis
creation_date: "2026-03-06T00:00:00Z"
category: Autoimmune
disease_term:
  preferred_term: autoimmune encephalitis
  term:
    id: MONDO:0020640
    label: autoimmune encephalitis
parents:
- Neurological Disease
- Autoimmune Disease
synonyms:
- Autoimmune inflammatory encephalitis
- AE
description: >-
  Autoimmune encephalitis (AE) is a heterogeneous group of inflammatory brain
  disorders with subacute cognitive, psychiatric, seizure, movement, sleep,
  autonomic, or consciousness syndromes. Some subtypes are mediated by
  antibodies to neuronal surface or synaptic antigens; others are associated
  with intracellular/onconeural antibodies and predominantly T-cell-mediated
  injury, and clinically probable seronegative AE also occurs. Antibody results
  therefore require syndrome, specimen, assay, and tumor-context interpretation.
  Early immunotherapy and treatment of an identified tumor are associated with
  better outcomes, but comparative treatment evidence remains limited.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:26906964
      reference_title: "A clinical approach to diagnosis of autoimmune encephalitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Encephalitis is a severe inflammatory disorder of the brain with many possible causes and a complex differential diagnosis."
      explanation: The defining organ-system presentation is an inflammatory brain disorder.
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:26906964
      reference_title: "A clinical approach to diagnosis of autoimmune encephalitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Advances in autoimmune encephalitis research in the past 10 years have led to the identification of new syndromes and biomarkers that have transformed the diagnostic approach to these disorders."
      explanation: The consensus paper explicitly frames the disorder and its biomarkers as autoimmune.
has_subtypes:
- name: Anti-NMDA Receptor Encephalitis
  subtype_term:
    preferred_term: anti-NMDA receptor encephalitis
    term:
      id: MONDO:0021081
      label: anti-NMDA receptor encephalitis
  description: >-
    GluN1-IgG-mediated encephalitis, often affecting children and young adults,
    with psychiatric/cognitive symptoms, seizures, dyskinesia, reduced
    consciousness, dysautonomia, or hypoventilation; ovarian teratoma and prior
    herpes simplex encephalitis are recognized triggers.
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tumours, usually ovarian teratoma, and herpes simplex encephalitis are known triggers of NMDAR autoimmunity."
    explanation: Review evidence identifies the two established trigger contexts.
- name: LGI1-Antibody Encephalitis
  subtype_term:
    preferred_term: limbic encephalitis with LGI1 antibodies
    term:
      id: MONDO:0015592
      label: limbic encephalitis with LGI1 antibodies
  description: >-
    Usually an older-adult limbic encephalitis with seizures, faciobrachial
    dystonic seizures, cognitive impairment, and frequent hyponatremia.
  evidence:
  - reference: DOI:10.3389/fneur.2021.674368
    reference_title: "Clinical Characteristics and Long-Term Prognosis of Anti-LGI1 Encephalitis: A Single-Center Cohort Study in Beijing, China"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with seizures at the initial consultation. Other common manifestations included cognitive dysfunction (82.2%), psychiatric disturbance (66.7%), sleep disorder (54.5%), and hyponatremia (66.7%)."
    explanation: A primary cohort defines the principal LGI1 clinical associations.
- name: CASPR2-Antibody Encephalitis
  subtype_term:
    preferred_term: limbic encephalitis with caspr2 antibodies
    term:
      id: MONDO:0017179
      label: limbic encephalitis with caspr2 antibodies
  description: >-
    Encephalitis that can overlap with neuromyotonia or Morvan syndrome and can
    be tumor-associated, particularly with thymoma.
  evidence:
  - reference: PMID:20663977
    reference_title: "Antibodies to Kv1 potassium channel-complex proteins leucine-rich, glioma inactivated 1 protein and contactin-associated protein-2 in limbic encephalitis, Morvan's syndrome and acquired neuromyotonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "detection of contactin-associated protein-2 antibodies should help identify the risk of an underlying tumour and a poor prognosis in future patients."
    explanation: The primary antibody-characterization cohort supports the tumor association.
- name: GABAB-Receptor Encephalitis
  description: >-
    Seizure-prominent limbic encephalitis associated with GABAB-receptor
    antibodies and, in a substantial subset, small-cell lung cancer.
  evidence:
  - reference: PMID:19962348
    reference_title: "Antibodies to the GABA(B) receptor in limbic encephalitis with seizures: case series and characterisation of the antigen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GABA(B) receptor autoimmune encephalitis is a potentially treatable disorder characterised by seizures and, in some patients, associated with small-cell lung cancer and with other autoantibodies."
    explanation: This primary case series defined the association; it did not alone prove pathogenicity.
- name: AMPA-Receptor Encephalitis
  description: >-
    GluA1/GluA2-antibody limbic encephalitis that is often paraneoplastic,
    treatment responsive, and relapse prone.
  evidence:
  - reference: PMID:19338055
    reference_title: "AMPA receptor antibodies in limbic encephalitis alter synaptic receptor location."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibodies to GluR1/2 associate with LE that is often paraneoplastic, treatment responsive, and has a tendency to relapse."
    explanation: The primary cohort supports association, clinical response, and relapse tendency.
- name: Intracellular-Antigen/Paraneoplastic Encephalitis
  description: >-
    Encephalitis associated with Hu, Ma2, CRMP5, amphiphysin, or related
    intracellular antigens; the antibodies are usually biomarkers of a
    tumor-driven cytotoxic T-cell response rather than demonstrated pathogenic
    effectors.
  evidence:
  - reference: PMID:23250843
    reference_title: "Limbic encephalitis and related cortical syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with antibodies to intracellular neuronal antigens (onconeuronal antibodies: Hu, Ma2, amphiphysin, CV2/CRMP5) almost invariably have an underlying neoplasm (lung, testis, breast, etc.)"
    explanation: Review evidence supports the classification and cancer association, not antibody pathogenicity.
- name: Probable Seronegative Autoimmune Encephalitis
  description: >-
    A clinically defined subgroup meeting high-specificity probable criteria
    despite absence of a well-characterized neural antibody; diagnosis requires
    objective inflammatory evidence and rigorous exclusion of alternatives.
  evidence:
  - reference: PMID:26906964
    reference_title: "A clinical approach to diagnosis of autoimmune encephalitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Through logical differential diagnosis, levels of evidence for autoimmune encephalitis (possible, probable, or definite) are achieved, which can lead to prompt immunotherapy."
    explanation: The consensus framework explicitly permits probability-based diagnosis before or without antibody confirmation.
definitions:
- name: Possible Autoimmune Encephalitis (Graus 2016)
  definition_type: CASE_DEFINITION
  description: >-
    Adult possible AE requires subacute progression in less than three months of
    working-memory deficit, altered mental status, or psychiatric symptoms;
    at least one new focal CNS finding, unexplained seizure, CSF pleocytosis, or
    MRI feature suggestive of encephalitis; and reasonable exclusion of other causes.
  criteria_sets:
  - name: Entry clinical syndrome
    core_clinical_characteristics:
    - preferred_term: Memory impairment
      term:
        id: HP:0002354
        label: Memory impairment
    - preferred_term: Altered mental status
      term:
        id: HP:0011446
        label: Abnormal mental status
    - preferred_term: Psychosis
      term:
        id: HP:0000709
        label: Psychosis
    evidence:
    - reference: DOI:10.1055/s-0044-1788586
      reference_title: Brazilian consensus recommendations on the diagnosis and treatment of autoimmune encephalitis in the adult and pediatric populations
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Subacute onset (rapid progression in fewer than than three months) of working memory de ﬁcits (short-term memory loss), altered mental status (decreased level of consciousness, lethargy or personality changes), or psychiatric symptoms"
      explanation: The 2024 consensus reproduces the Graus entry criterion and timing.
  evidence:
  - reference: PMID:26906964
    reference_title: "A clinical approach to diagnosis of autoimmune encephalitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Because autoantibody test results and response to therapy are not available at disease onset, we based the initial diagnostic approach on neurological assessment and conventional tests that are accessible to most clinicians."
    explanation: Consensus guidance supports syndrome-based early assessment rather than waiting for antibodies.

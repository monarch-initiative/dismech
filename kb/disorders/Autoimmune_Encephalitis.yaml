    modifier: INCREASED
  evidence:
  - reference: PMID:42162799
    reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF leukocyte, erythrocyte, lymphocyte, and mononuclear cell counts were
      also elevated in AIE patients.
    explanation: >-
      Directly evidences the presence of leukocytes, lymphocytes and mononuclear
      cells in the CSF of AIE patients relative to controls, the readout of the
      CNS immune cell infiltration modelled by this node.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the immune response eventually predominates in the nervous system as
      suggested by the high frequency of pleocytosis, oligoclonal bands, and
      intrathecal synthesis of NR1 antibodies
    explanation: >-
      CSF pleocytosis (excess white cells) in the large anti-NMDAR case series
      is independent evidence of leukocyte entry into the CNS compartment.
  downstream:
  - target: Neuroinflammation and Neuronal Dysfunction
    description: >-
      Infiltrating immune cells release cytokines and effector molecules
      within the CNS, producing sustained neuroinflammation and impairing
      neuronal function.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42162799
      reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        immune-inflammatory responses, neuronal-synaptic dysfunction, and cell
        signaling and metabolic pathways
      explanation: >-
        The same CSF proteomic signature couples immune-inflammatory response
        pathways with neuronal-synaptic dysfunction pathways, the pairing this
        edge asserts. PARTIAL because pathway co-enrichment is correlative.
- name: Neuroinflammation and Neuronal Dysfunction
  description: >-
    Sustained CNS inflammation driven by infiltrating leukocytes and
    intrathecal cytokine signaling contributes to neuronal dysfunction
    underlying the neuropsychiatric manifestations of AIE. This node
    integrates the downstream consequence of the IL6-STAT3 axis with
    antibody-mediated synaptic dysfunction already modelled above.
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:42162799
    reference_title: "Multi-omics profiling of cerebrospinal fluid in autoimmune encephalitis: insights into pathogenesis and therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Integrated multi-omics analysis systematically delineates cellular and
      molecular alterations underlying AIE.
    explanation: >-
      The integrated CSF multi-omics signature - immune-inflammatory response
      pathways together with neuronal-synaptic dysfunction pathways - is the
      composite readout this node integrates.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This feature is compatible with disruption of the mechanisms of synaptic
      plasticity, thought to underlie learning and memory, in which the NMDA
      receptors play a key part.
    explanation: >-
      Links the neuronal dysfunction modelled here to the clinical
      neuropsychiatric picture - the persisting amnesia of the illness that
      characterises recovered patients.
phenotypes:
- category: Neurological
  name: Seizures
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    Seizures occur in the majority of patients and may be the presenting
    symptom. Can be focal or generalized.
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients with rapidly progressive psychiatric symptoms or
      cognitive impairment, seizures, abnormal movements, or coma of unknown
      cause, had an autoimmune disease
    explanation: >-
      Seizures identified as a key presenting feature of anti-NMDAR
      encephalitis.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
- category: Psychiatric
  name: Psychosis
  frequency: VERY_FREQUENT
  notes: >-
    Acute psychiatric symptoms including hallucinations, delusions,
    agitation, and catatonia. Often leads to initial psychiatric
    hospitalization before the autoimmune diagnosis is recognized.
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients with rapidly progressive psychiatric symptoms or
      cognitive impairment, seizures, abnormal movements, or coma of unknown
      cause, had an autoimmune disease
    explanation: >-
      Rapidly progressive psychiatric symptoms are a hallmark presentation
      of autoimmune encephalitis.
  phenotype_term:
    preferred_term: Psychosis
    term:
      id: HP:0000709
      label: Psychosis
- category: Neurological
  name: Memory Impairment
  frequency: VERY_FREQUENT
  notes: >-
    Short-term memory loss is a hallmark, particularly prominent in
    anti-LGI1 encephalitis where it may be the predominant feature.
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients with rapidly progressive psychiatric symptoms or
      cognitive impairment, seizures, abnormal movements, or coma of unknown
      cause, had an autoimmune disease
    explanation: >-
      Cognitive impairment (including memory) is a key presenting feature.
  phenotype_term:
    preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
- category: Neurological
  name: Dyskinesia
  frequency: FREQUENT
  notes: >-
    Orofacial dyskinesias and choreoathetoid movements are characteristic
    of anti-NMDA receptor encephalitis.
  evidence:
  - reference: PMID:31326280
    reference_title: "An update on anti-NMDA receptor encephalitis for neurologists and psychiatrists: mechanisms and models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients with rapidly progressive psychiatric symptoms or
      cognitive impairment, seizures, abnormal movements, or coma of unknown
      cause, had an autoimmune disease
    explanation: >-
      Abnormal movements (dyskinesias) are part of the diagnostic spectrum.
  phenotype_term:
    preferred_term: Dyskinesia
    term:
      id: HP:0100660
      label: Dyskinesia
- category: Neurological
  name: Abnormality of the Autonomic Nervous System
  frequency: FREQUENT
  notes: >-
    Autonomic instability including cardiac dysrhythmias, blood pressure
    fluctuations, central hypoventilation, and hyperthermia. Can be
    life-threatening.
  phenotype_term:
    preferred_term: Abnormality of the autonomic nervous system
    term:
      id: HP:0002270
      label: Abnormality of the autonomic nervous system
  evidence:
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While poorly responsive or in a catatonic-like state, 93 patients
      developed hypoventilation, autonomic imbalance, or abnormal movements,
      all overlapping in 52 patients.
    explanation: >-
      In the 100-patient anti-NMDAR series, 93 developed hypoventilation and/or
      autonomic imbalance, directly supporting autonomic instability (including
      central hypoventilation) as a frequent, severe-phase manifestation.
  - reference: PMID:18851928
    reference_title: "Anti-NMDA-receptor encephalitis: case series and analysis of the effects of antibodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      autonomic dysfunction (cardiac dysrhythmia, hypertension,
      hypersalivation)
    explanation: >-
      NMDA-receptor antagonists reproduce the same autonomic features (cardiac
      dysrhythmia, hypertension), mechanistically linking the recorded
      dysautonomia to NMDA receptor loss rather than a nonspecific illness
      effect.

- name: Skeletal Muscle Mitochondrial Myopathy
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    One patient presented with an early myopathy: generalized weakness and
    hypotonia from age 2 years, mildly reduced muscle complex I activity, normal
    light microscopy without ragged-red fibres, and increased, enlarged and
    abnormally oriented mitochondria on electron microscopy. Mice lacking Ndufs3 in
    skeletal muscle develop a progressive myopathy, which supports muscle as a
    target tissue, but the human evidence is a single case.
  evidence:
  - reference: PMID:36531773
    reference_title: "Mitochondrial Ultrastructural Defects in NDUFS3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the electron-microscopic examination of the skeletal muscle showed an
      increase in the number of mitochondria inside the myofibers
    explanation: >-
      Mitochondrial proliferation in patient muscle.
  - reference: PMID:31916679
    reference_title: "Myopathy reversion in mice after restauration of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NDUFS3 protein levels were undetectable in muscle of 15-day-old smKO mice,
      and myopathy symptoms could be detected by 2 months of age, worsening over
      time.
    explanation: >-
      Muscle-specific loss of Ndufs3 causes a progressive myopathy.

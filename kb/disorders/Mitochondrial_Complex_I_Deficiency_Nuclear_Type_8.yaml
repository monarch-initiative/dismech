    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While mutations in the NDUFS3 gene thus result in Leigh syndrome, a
      dissimilar clinical phenotype is observed in mutations in the NDUFV2 and
      NDUFS2 genes, resulting in encephalomyopathy and cardiomyopathy.
    explanation: >-
      Leigh syndrome is the characteristic NDUFS3 presentation.

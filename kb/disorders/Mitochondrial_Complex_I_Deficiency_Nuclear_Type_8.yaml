    reference_title: "Metformin delays neurological symptom onset in a mouse model of neuronal complex I deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      deletion of Ndufs3 in forebrain neurons reduced complex I activity, altered
      brain energy metabolism, and increased locomotor activity with impaired motor
      coordination, balance, and stereotyped behavior.
    explanation: >-

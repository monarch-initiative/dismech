        brain energy metabolism, and increased locomotor activity with impaired
        motor coordination, balance, and stereotyped behavior.
      explanation: >-
        A neurological phenotype from neuronal Ndufs3 loss.
discussions:
- discussion_id: mc1dn8_allele_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some NDUFS3 genotypes cause fatal childhood Leigh syndrome while others
    allow an adult with near-normal fibroblast complex I activity, or a myopathy
    without brain lesions?
  attaches_to:
  - "pathophysiology#Biallelic NDUFS3 Variants"
  - "pathophysiology#Impaired Q-Module and Complex I Assembly"
  rationale: >-
    The two fatal cases carried missense alleles, at least one of which (the
    T145I/R199W pair) destabilizes the protein, while the mild adult's alleles
    alter splicing and leave some normal transcript. Knockout cells also show
    that a small amount of functional complex I can be assembled with no NDUFS3 at
    all. Residual NDUFS3, residual assembly without it, or both may set severity,
    but with six patients no genotype-phenotype rule can be drawn.
  proposed_experiments:
  - experiment_id: exp_mc1dn8_allele_panel
    name: Compare NDUFS3 patient alleles in an isogenic knockout background
    description: >-
      Express each reported NDUFS3 allele in NDUFS3 knockout human cells and
      measure NDUFS3 abundance, assembled complex I and complex I activity, to
      test whether residual NDUFS3 level predicts the clinical severity of the
      corresponding patients.
notes: >-
  No gene-specific GeneReviews chapter exists. The Nuclear Gene-Encoded Leigh
  Syndrome Spectrum Overview (PMID:26425749) is tagged because its scope covers
  the Leigh presentation of this disorder, but its cached record is a statement of
  purpose with no clinical content, so the phenotypes come from the primary
  reports (PMID:14729820, PMID:22499348, PMID:30140060, PMID:33097395,
  PMID:36531773) and the summary table of the 2020 report. Several early-patient
  phenotypes are quoted from the 2020 and 2021 papers' summaries of earlier
  reports because the earlier papers are cached as abstracts only.

  The synonym NDUFS3-related disorder is the term used in the title of the 2021
  report (PMID:36531773).

  The protein's historical name, NADH dehydrogenase iron-sulphur protein 3, does
  not mean it binds an iron-sulphur cluster: it was named for the fraction in
  which it purifies, and it has no cofactor.

pathophysiology:
- name: Biallelic NDUFS3 Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is biallelic NDUFS3 variation: missense alleles in most
    patients (T145I with R199W, R140W with R199W, homozygous R199W, R142C with
    N180K) and, in one mildly affected adult, a missense change that creates a
    cryptic splice site together with an intronic splice-region variant. The
    variants studied reduce the amount of NDUFS3 protein, and a recombinant
    T145I/R199W double mutant is structurally unstable and aggregation-prone.
    NDUFS3 has no catalytic role of its own; what is lost is its structural
    contribution as an early core of the Q module, so the modelled activity is
    structural.
  genes:
  - preferred_term: NDUFS3
    term:
      id: hgnc:7710
      label: NDUFS3
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function in the sense of reduced NDUFS3 protein; no patient with two
      null alleles has been reported, and the mildest case retains some normally
      spliced transcript.
  molecular_functions:
  - preferred_term: NDUFS3 structural role as an early core of the complex I Q module
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  evidence:
  - reference: PMID:14729820
    reference_title: "Mutant NDUFS3 subunit of mitochondrial complex I causes Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations found in this gene (NADH dehydrogenase iron-sulphur protein 3),
      coding for the seventh and last subunit of complex I core, were shown to
      cause late onset Leigh syndrome, optic atrophy, and complex I deficiency.
    explanation: >-
      The first report establishing NDUFS3 variants as a cause of complex I
      deficiency.
  - reference: PMID:30140060
    reference_title: "A Novel NDUFS3 mutation in a Chinese patient with severe Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functionally, the patient derived lymphoblastoid cells showed decreased
      amount of NDUFS3 and complex I assembly when compared with two control
      cells.
    explanation: >-
      Patient cells carrying R140W and R199W have less NDUFS3 protein.
  - reference: PMID:33097395
    reference_title: "Biallelic variants in two complex I genes cause abnormal splicing defects in probands with mild Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Proband-derived fibroblasts showed decreased expression of NDUFS3 mRNA and
      protein relative to two unaffected, healthy control samples
    explanation: >-
      The splice-altering genotype also lowers NDUFS3 mRNA and protein.
  - reference: PMID:24028823
    reference_title: "Human mitochondrial NDUFS3 protein bearing Leigh syndrome mutation is more prone to aggregation than its wild-type."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant also exhibited a higher tendency than the w-t protein for
      aggregation
    explanation: >-
      The recombinant T145I/R199W protein is less stable than wild type, a
      plausible reason the missense alleles reduce NDUFS3 levels.
  - reference: PMID:33882309
    reference_title: "NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Hence, although it lacks a direct catalytic role, NDUFS3 is highly conserved
      and essential for CI assembly
    explanation: >-
      NDUFS3 contributes structure rather than catalysis, which is why the bound
      molecular function is structural molecule activity.
  - reference: PMID:33882309
    reference_title: "NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we analyze the structural and functional consequences of the ablation of
      NDUFS3, a non-catalytic core subunit
    explanation: >-
      Describes NDUFS3 as a non-catalytic core subunit.
  downstream:
  - target: Impaired Q-Module and Complex I Assembly
    causal_link_type: DIRECT
- name: Impaired Q-Module and Complex I Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFS3 joins NDUFS2 and NDUFA5 in an early subcomplex from which the Q module
    is built, and tagged NDUFS3 has been used to trace the stepwise assembly of the
    whole enzyme. When NDUFS3 is depleted, Q-module subunits are lost first and the
    N module follows, while membrane-arm modules remain; patient cells show reduced
    complex I assembly. Assembly is not strictly dependent on NDUFS3: knockout cell
    lines still make a small amount of functional complex I, which may bear on why
    hypomorphic patient alleles are compatible with long survival.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  evidence:
  - reference: PMID:33882309
    reference_title: "NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      During CI assembly, the core subunit NDUFS3 is part of a subcomplex of about
      89 kDa, containing NDUFS2 and NDUFA5, and appears in the early stages as the
      primary core for the generation of the Q-module
    explanation: >-
      Places NDUFS3 at the start of Q-module assembly.
  - reference: PMID:33882309
    reference_title: "NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Q-module subunits were the first to be downregulated after NDUFS3 depletion,
      being already significantly reduced after 2 days of Dox treatment
    explanation: >-
      Repressible NDUFS3 cells lose Q-module subunits first.
  - reference: PMID:33882309
    reference_title: "NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that, in diverse mammalian cell types, a small amount of functional
      CI can still be detected in the complete absence of NDUFS3.
    explanation: >-
      Qualifies the dependence: a residual assembly route exists without NDUFS3.
  - reference: PMID:17209039
    reference_title: "Identification of mitochondrial complex I assembly intermediates by tracing tagged NDUFS3 demonstrates the entry point of mitochondrial subunits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using an inducible NDUFS3-green fluorescent protein (GFP) expression system
      in HEK293 cells, we here provide direct evidence for the stepwise assembly of
      CI.
    explanation: >-
      NDUFS3 is incorporated into successive assembly intermediates of complex I.
  - reference: PMID:30140060
    reference_title: "A Novel NDUFS3 mutation in a Chinese patient with severe Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

genetic:
- name: NDUFS3
  gene_term:
    preferred_term: NDUFS3
    term:
      id: hgnc:7710
      label: NDUFS3
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  presence: PRESENT
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFS3 at 11p11.2 is the sole gene of this disorder in MONDO and OMIM, but
    relationship_type is left UNKNOWN rather than CAUSATIVE because ClinGen rates
    NDUFS3 as Moderate both for Leigh syndrome (autosomal recessive, 2019) and for
    mitochondrial disease (autosomal recessive, 2024), and the schema reserves
    CAUSATIVE for Definitive or Strong. Neither ClinGen record is for this
    entry's MONDO term, so neither is copied into gene_disease_validity.

    Reported genotypes: T145I with R199W (first family, with an affected fetus
    diagnosed prenatally), homozygous R199W, R140W with R199W, R140Q (which
    creates a cryptic splice acceptor) with c.381+6T>C, and R142C with N180K.
    R199W recurs in three families. Two reports are not curated here as disease
    evidence: a single heterozygous P223L in a patient with an unspecified
    encephalomyopathy (PMID:19167255, not cached), and a 2026 report of a
    homozygous A241T variant of uncertain significance in a child with
    Stargardt-like maculopathy and hearing loss who also carried heterozygous
    ABCA4 variants, whose authors themselves decline to define a monogenic entity
    from it (PMID:42232357).
  evidence:
  - reference: PMID:14729820
    reference_title: "Mutant NDUFS3 subunit of mitochondrial complex I causes Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations found in this gene (NADH dehydrogenase iron-sulphur protein 3),
      coding for the seventh and last subunit of complex I core, were shown to
      cause late onset Leigh syndrome, optic atrophy, and complex I deficiency.
    explanation: >-
      The defining report.
  - reference: PMID:30140060
    reference_title: "A Novel NDUFS3 mutation in a Chinese patient with severe Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two missense mutations of NDUFS3 (c.418 C > T/p.R140W and c.595 C >
      T/p.R199W) were identified, of which c.418 C > T was novel
    explanation: >-
      A second, unrelated family with early-onset Leigh syndrome.
  - reference: PMID:33097395
    reference_title: "Biallelic variants in two complex I genes cause abnormal splicing defects in probands with mild Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband with NDUFS3-related Leigh syndrome was mildly affected and lived
      into adulthood with novel biallelic variants causing aberrant mRNA splicing
    explanation: >-
      A mild adult presentation with splice-altering alleles.
  - reference: PMID:36531773
    reference_title: "Mitochondrial Ultrastructural Defects in NDUFS3-Related Disorder."

name: Mitochondrial Complex I Deficiency, Nuclear Type 8
creation_date: "2026-11-27T13:42:34Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 8 (MC1DN8) is the autosomal
  recessive complex I deficiency caused by biallelic variants in NDUFS3, which
  encodes a conserved core subunit of the complex I peripheral arm. NDUFS3 carries
  no redox cofactor of its own; it is an early, structural component of the
  ubiquinone-binding (Q) module around which the rest of the enzyme is assembled,
  so its loss lowers the amount of assembled complex I and with it NADH:ubiquinone
  oxidoreductase activity. Fewer than ten patients have been reported. Most had
  Leigh syndrome, with lesions of the basal ganglia, thalamus and brainstem,
  dystonia and torticollis, optic atrophy and lactic acidosis; onset ranged from
  infancy to late childhood, and two of the early-reported children died at 2 and
  13 years. An adult with splice-altering alleles and a mild, largely monophasic
  course, and a girl with infantile non-epileptic myoclonus and an early
  mitochondrial myopathy, widened the spectrum. Conditional Ndufs3 knockout mice
  reproduce a progressive myopathy and an encephalopathy, and in both, AAV
  delivery of Ndufs3 prevented or reversed disease.
category: Mendelian
parents:
- Mitochondrial Complex I Deficiency
synonyms:
- MC1DN8
- NDUFS3-related disorder

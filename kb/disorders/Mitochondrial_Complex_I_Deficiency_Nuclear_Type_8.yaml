    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was noted to be compound heterozygous for two variants in the
      NDUSF3 gene
    explanation: >-
      Compound heterozygosity found on trio testing, the configuration expected
      of a recessive disorder. The misspelt gene symbol is the source's own.
  - reference: PMID:22499348
    reference_title: "Molecular diagnosis in mitochondrial complex I deficiency using exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This revealed homozygous mutations in NDUFS3 and ACAD9 in two individuals.
    explanation: >-
      A homozygous NDUFS3 genotype in a patient with complex I deficiency.
  - reference: PMID:33097395
    reference_title: "Biallelic variants in two complex I genes cause abnormal splicing defects in probands with mild Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

name: DPAGT1-congenital disorder of glycosylation
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  DPAGT1-CDG (formerly CDG-Ij) is a rare autosomal recessive congenital disorder
  of N-linked glycosylation caused by biallelic hypomorphic variants in DPAGT1,
  which encodes UDP-GlcNAc:dolichol phosphate N-acetylglucosamine-1-phosphate
  transferase (GPT). GPT is an endoplasmic-reticulum-resident enzyme that
  catalyses the first committed step of the lipid-linked oligosaccharide (LLO)
  pathway on the cytoplasmic face of the ER membrane: the transfer of
  GlcNAc-1-phosphate from UDP-GlcNAc onto dolichol phosphate to give
  dolichol-PP-GlcNAc. Because nothing downstream in LLO assembly can proceed
  without that first sugar, reduced GPT activity limits the supply of mature
  dolichol-linked oligosaccharide available to the oligosaccharyltransferase and
  leaves glycoproteins across every tissue incompletely N-glycosylated. The
  laboratory signature is a type I serum transferrin isoform pattern, and the
  clinical picture is a severe multisystem encephalopathy.

  The disease requires residual enzyme activity. In the index patient GPT
  activity was about 10 percent of normal, and complete loss of the orthologous
  mouse enzyme is lethal shortly after implantation, so no human null genotype
  is expected to be viable. This is why every reported genotype is missense,
  splice-leaky, or a compound of the two, and it is the most plausible
  explanation for the disease's wide severity range: patients with the least
  residual activity die in the first years of life with intractable epilepsy,
  while a minority carrying milder allele combinations reach adulthood with
  moderate intellectual disability, epilepsy and hypotonia.

  Cardinal features are pronounced muscular hypotonia, medically intractable
  seizures, global developmental delay and intellectual disability,
  microcephaly, and exotropia; cataracts, joint contractures, fetal akinesia
  with reduced fetal movement, hypertrichosis and feeding difficulties recur
  across the reported cohorts. There is no disease-modifying therapy.
  Management is supportive, with anticonvulsants for the epilepsy and
  cholinesterase inhibition for the myasthenic component of the muscle
  weakness.

  Scope. This entry covers MONDO:0011964 only, the systemic encephalopathic
  disease. The much milder allelic DPAGT1-related limb-girdle congenital
  myasthenic syndrome with tubular aggregates (CMS-13) is a separate MONDO term
  (MONDO:0013883, OMIM:614750) and is curated in the KB's
  Congenital Myasthenic Syndrome entry; it is deliberately not modelled here as
  a subtype. See `notes` for the reasoning.

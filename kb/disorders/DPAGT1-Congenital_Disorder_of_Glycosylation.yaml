biochemical:
- name: Serum Transferrin Isoform Profile
  notes: >-
    Isoelectric focusing, capillary electrophoresis or mass spectrometry of
    serum transferrin shows the type I CDG pattern, with increased asialo- and
    disialotransferrin from whole unoccupied N-glycosylation sites. It is the
    standard first-line screen for a disorder of lipid-linked oligosaccharide
    assembly. It does not distinguish DPAGT1-CDG from the other CDG-I subtypes;
    that requires sequencing.
  evidence:
  - reference: PMID:22786653
    reference_title: "DPAGT1-CDG: report of a patient with fetal hypokinesia phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isoelectrofocusing of serum transferrin showed a type 1 pattern with
      increased asialo- and disialotransferrin."
    explanation: Reports the type I pattern and the specific isoform shift that
      defines it.
  - reference: PMID:26033833
    reference_title: Fetal akinesia deformation sequence due to a congenital disorder
      of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transferrin isoelectric focusing was suggestive of a type I congenital
      disorder of glycosylation."
    explanation: Independent confirmation of the type I pattern in a second patient.
diagnosis:
- name: Serum transferrin glycoform analysis
  description: >-
    First-line screen. A type I transferrin pattern places the defect in
    lipid-linked oligosaccharide assembly or transfer and prompts sequencing;
    it does not name the gene.
  evidence:
  - reference: PMID:23249953
    reference_title: A compound heterozygous mutation in DPAGT1 results in a congenital
      disorder of glycosylation with a relatively mild phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isoelectric focusing and high-resolution mass spectrometry analyses
      of serum transferrin revealed glycosylation profiles that are consistent with
      a CDG-I defect."
    explanation: Shows the screen classifying a patient into the CDG-I group, which
      is what it is for.
- name: Exome or genome sequencing of DPAGT1
  description: >-
    Definitive diagnosis rests on identifying biallelic DPAGT1 variants. Broad
    sequencing has been the usual route since the phenotype is a nonspecific
    infantile epileptic encephalopathy, and homozygosity mapping served the
    same purpose in consanguineous families before exome sequencing was
    routine.
  evidence:
  - reference: PMID:23249953
    reference_title: A compound heterozygous mutation in DPAGT1 results in a congenital
      disorder of glycosylation with a relatively mild phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed a compound heterozygous missense mutation,
      c.85A>T (p.I29F) and c.503T>C (p.L168P), in the DPAGT1 gene."
    explanation: Illustrates exome sequencing as the route to a molecular diagnosis
      in a patient whose phenotype was too mild to suggest the gene.
  - reference: PMID:23430862
    reference_title: "Further Delineation of the Phenotype of Congenital Disorder
      of Glycosylation DPAGT1-CDG (CDG-Ij) Identified by Homozygosity Mapping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping identified a large block of homozygosity on chromosome
      11p15.5-q25 where two known CDG-I causing genes, ALG9 and DPAGT1, are located."
    explanation: Illustrates the mapping route used in a large consanguineous family.
treatments:
- name: Anticonvulsant agent therapy
  description: >-
    Antiepileptic drugs are the mainstay of managing the seizures, which are
    typically early-onset and often refractory. This is symptomatic
    management: no anticonvulsant addresses the glycosylation defect, and
    seizure control is frequently incomplete.
  therapeutic_modality: SMALL_MOLECULE

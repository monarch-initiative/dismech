inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic DPAGT1 variants, homozygous or compound
    heterozygous, with unaffected heterozygous carrier parents. In the index
    family the paternal allele carried a missense change and the maternal
    allele a splicing defect; homozygous missense genotypes have since been
    reported in consanguineous families. No complete biallelic null has been
    described, consistent with the enzyme's essential role.
  evidence:
  - reference: PMID:12872255
    reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
      Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
      Type Ij."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In vitro enzymatic analysis of microsomal fractions from the cultured
      cells indicated that oligosaccharyltransferase activity is normal, but the GPT
      activity is reduced to approximately 10% of normal levels while parents have
      heterozygous levels."
    explanation: Documents biallelic involvement in the proband with intermediate
      enzyme levels in both unaffected parents, the biochemical signature of recessive
      inheritance.
  - reference: PMID:37766827
    reference_title: "DPAGT1-CDG: Report of Two New Pediatric Patients and Brief Review
      of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a rare autosomal recessive disease or a milder version with congenital
      myasthenic syndrome known as DPAGT1-CMS."
    explanation: States the mode of inheritance directly.
genetic:
- name: DPAGT1
  gene_term:
    preferred_term: DPAGT1
    term:
      id: hgnc:2995
      label: DPAGT1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    DPAGT1 encodes UDP-GlcNAc:dolichol phosphate N-acetylglucosamine-1-phosphate
    transferase (GPT), a polytopic endoplasmic reticulum membrane protein that
    catalyses the first committed step of dolichol-linked oligosaccharide
    assembly. GPT works at the same point of the pathway as the ALG13-ALG14
    heterodimer, with which it forms a multiglycosyltransferase complex that
    carries out the first two committed steps of asparagine-linked
    glycosylation; ALG14 and ALG2 are themselves disease genes, and the KB's
    Congenital Myasthenic Syndrome 15 entry curates the ALG14 side of the same
    complex. Reported DPAGT1 alleles act by disrupting splicing, destabilising
    the protein, or preventing its correct localisation in the ER membrane
    rather than by abolishing the coding sequence.
  variants:
  - name: "DPAGT1 c.660A>G (p.Tyr170Cys)"
    description: >-
      The paternal allele of the index patient. Over-expression of the mutant
      cDNA yields a full-length protein with essentially no transferase
      activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:12872255
      reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
        Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
        Type Ij."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The paternal allele cDNA produces a full-length protein with almost
        no activity when over-expressed in CHO cells."
      explanation: Establishes the functional consequence of the paternal missense
        allele in a heterologous expression assay.
  - name: "DPAGT1 index maternal splicing allele"
    description: >-
      The maternal allele of the index patient, which produces only a small
      fraction of normal mature transcript, the remainder being aberrantly
      spliced and frameshifted. It is the residual normal transcript from this
      allele that supplies the surviving enzyme activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:12872255
      reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
        Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
        Type Ij."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The maternal allele makes only about 12% normal mature mRNA, while
        the remainder shows a complex exon skipping pattern that shifts the reading
        frame encoding a truncated non-functional GPT protein."
      explanation: Quantifies the leaky splicing that leaves residual wild-type
        transcript on the maternal allele.
  - name: "DPAGT1 c.341C>G (p.Ala114Gly)"
    description: >-
      A homozygous allele in two patients with a severe phenotype of
      hyperexcitability, intractable seizures, bilateral cataracts, progressive
      microcephaly and hypotonia; both died in the first year of life.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22304930
      reference_title: "Congenital disorder of glycosylation type Ij (CDG-Ij, DPAGT1-CDG):
        extending the clinical and molecular spectrum of a rare disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report two new patients with the novel homozygous mutation, c.341C>G
        (A114 G), causing a severe clinical phenotype, characterized by hyperexcitability,
        intractable seizures, bilateral cataracts, progressive microcephaly and muscular
        hypotonia."
      explanation: Names the allele and the phenotype it produced in the homozygous
        state.
  - name: "DPAGT1 c.902G>A (p.Arg301His)"
    description: >-
      A homozygous allele identified by homozygosity mapping in a large
      consanguineous family with 18 affected infants, in which the disorder was
      uniformly fatal.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23430862
      reference_title: "Further Delineation of the Phenotype of Congenital Disorder
        of Glycosylation DPAGT1-CDG (CDG-Ij) Identified by Homozygosity Mapping."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing ALG9 did not reveal any mutations while analysis of DPAGT1
        identified a novel homozygous mutation c.902G>A (p.R301H) in two affected
        infants."
      explanation: Names the allele and the mapping route by which it was found.
  evidence:
  - reference: PMID:12872255
    reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
      Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
      Type Ij."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a novel CDG type, CDG-Ij, resulting from deficiency
      in UDP-GlcNAc: dolichol phosphate N-acetyl-glucosamine-1 phosphate transferase
      (GPT) activity encoded by DPAGT1."
    explanation: Establishes DPAGT1 as the causative gene, the finding that defines
      this disease entity.
  - reference: PMID:28662078
    reference_title: "DPAGT1-CDG: Functional analysis of disease-causing pathogenic
      mutations and role of endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results obtained, together with those of bioinformatic studies,
      revealed these mutations to affect the splicing process, the stability of GTP,
      or the ability of this protein to correctly localise in the ER membrane."
    explanation: Characterises the three routes by which reported DPAGT1 alleles
      reduce enzyme function, which is the basis for calling them hypomorphic rather
      than null.
pathophysiology:
- name: Biallelic Hypomorphic DPAGT1 Variants
  biological_scale: MOLECULAR
  description: >-
    Germline variants on both DPAGT1 alleles reduce, but do not abolish, the
    amount of functional GPT the cell can make. Functional analysis of patient
    alleles shows three mechanisms: disruption of splicing, destabilisation of
    the protein, and failure to localise correctly to the ER membrane. Residual
    activity is a requirement rather than an incidental finding, because
    complete loss of the enzyme is not compatible with post-implantation
    development.
  genetic_context:
    genes:
    - preferred_term: DPAGT1
      term:
        id: hgnc:2995
        label: DPAGT1
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline variants, predominantly
      missense or leaky splice alleles. The index genotype paired a missense
      allele with almost no activity against a splice allele retaining about
      12 percent normal mature transcript.
  evidence:
  - reference: PMID:28662078
    reference_title: "DPAGT1-CDG: Functional analysis of disease-causing pathogenic
      mutations and role of endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results obtained, together with those of bioinformatic studies,
      revealed these mutations to affect the splicing process, the stability of GTP,
      or the ability of this protein to correctly localise in the ER membrane."
    explanation: Reports the molecular consequences of six patient DPAGT1 alleles,
      none of which is a coding null.
  - reference: PMID:10536042
    reference_title: "A recessive deletion in the GlcNAc-1-phosphotransferase gene
      results in peri-implantation embryonic lethality."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We find that embryos homozygous for a deletion in the GPT gene complete
      preimplantation development and also implant in the uterine epithelium, but
      die shortly thereafter between days 4-5 postfertilization with cell degeneration
      apparent among both embryonic and extraembryonic cell types."
    explanation: Complete loss of the orthologous mouse enzyme is lethal shortly
      after implantation, so viable human disease must retain residual activity.
      The inference from mouse null to the human allelic requirement is the indirect
      step.
  downstream:
  - target: Reduced GlcNAc-1-Phosphotransferase Activity
    causal_link_type: DIRECT
    description: >-
      Fewer functional GPT molecules reach the ER membrane, so measured
      transferase activity in patient microsomes falls well below carrier
      levels.
    evidence:
    - reference: PMID:12872255
      reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
        Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
        Type Ij."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In vitro enzymatic analysis of microsomal fractions from the cultured
        cells indicated that oligosaccharyltransferase activity is normal, but the
        GPT activity is reduced to approximately 10% of normal levels while parents
        have heterozygous levels."
      explanation: Directly measures the fall in transferase activity produced by
        the patient's genotype, with a gene-dosage relationship across the family.

- name: Reduced GlcNAc-1-Phosphotransferase Activity
  biological_scale: MOLECULAR
  description: >-
    GPT catalyses the transfer of GlcNAc-1-phosphate from UDP-GlcNAc onto
    dolichol phosphate on the cytoplasmic face of the endoplasmic reticulum
    membrane, the first and committed step of lipid-linked oligosaccharide
    assembly. The step is not bypassable: without it none of the subsequent
    glycosyltransferase reactions that build the oligosaccharide precursor can
    take place. Oligosaccharyltransferase activity itself is normal in patient
    cells, which localises the lesion to the biosynthetic arm rather than to
    glycan transfer.
  molecular_functions:
  - preferred_term: UDP-GlcNAc:dolichol phosphate N-acetylglucosamine-1-phosphate
      transferase activity
    term:
      id: GO:0003975
      label: UDP-N-acetylglucosamine-dolichyl-phosphate N-acetylglucosaminephosphotransferase
        activity
    modifier: DECREASED
  locations:
  - preferred_term: Endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  evidence:
  - reference: PMID:28662078
    reference_title: "DPAGT1-CDG: Functional analysis of disease-causing pathogenic
      mutations and role of endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UDP-N-acetylglucosamine-dolichyl-phosphate N-acetylglucosamine phosphotransferase
      (GPT), the protein encoded by DPAGT1, is an endoplasmic reticulum (ER)-resident
      protein involved in an initial step in the N-glycosylation pathway."
    explanation: Identifies the enzyme, its subcellular location and its position
      in the pathway.
  - reference: PMID:10536042
    reference_title: "A recessive deletion in the GlcNAc-1-phosphotransferase gene
      results in peri-implantation embryonic lethality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Without GPT activity, subsequent steps necessary in constructing the
      oligosaccharide precursor cannot occur."
    explanation: States the non-bypassable position of this reaction in the pathway,
      which is why a partial deficit propagates to the whole of N-glycosylation.
  downstream:
  - target: Impaired Lipid-Linked Oligosaccharide Assembly
    causal_link_type: DIRECT

- name: Impaired Lipid-Linked Oligosaccharide Assembly
  biological_scale: MOLECULAR
  description: >-
    With less dolichol-PP-GlcNAc being made, the cell assembles less of the
    full-length dolichol-linked oligosaccharide that the
    oligosaccharyltransferase uses as its donor substrate. Metabolic labelling
    of patient fibroblasts shows the deficit directly: radiolabelled mannose is
    incorporated into full-length LLO at reduced rates.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  locations:
  - preferred_term: Endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  evidence:
  - reference: PMID:12872255
    reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
      Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
      Type Ij."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealed lowered incorporation of radiolabel into full-length dolichol-linked
      oligosaccharides and glycoproteins"
    explanation: Measures reduced flux into full-length lipid-linked oligosaccharide
      in patient-derived fibroblasts, which is the claim of this node.
  - reference: PMID:22304930
    reference_title: "Congenital disorder of glycosylation type Ij (CDG-Ij, DPAGT1-CDG):
      extending the clinical and molecular spectrum of a rare disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CDG-Ij (DPAGT1-CDG) is caused by a defect of the human DPAGT1 (UDP-GlcNAc:
      Dolichol Phosphate N-Acetylglucosamine-1-Phosphotransferase), catalyzing the
      first step of N-linked glycosylation."
    explanation: Places the enzymatic defect at the first step of the pathway whose
      output this node describes. Graded OTHER because the statement is the authors'
      framing of the disease rather than a primary measurement.
  downstream:
  - target: Global Protein N-Hypoglycosylation
    causal_link_type: DIRECT
    description: >-
      A reduced supply of donor oligosaccharide leaves a fraction of
      N-glycosylation sequons unoccupied on glycoproteins throughout the cell.
    evidence:
    - reference: PMID:12872255
      reference_title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1
        Phosphate Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation
        Type Ij."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "revealed lowered incorporation of radiolabel into full-length dolichol-linked
        oligosaccharides and glycoproteins"
      explanation: The same labelling experiment measures the deficit at both ends
        of this edge, in lipid-linked oligosaccharide and in the glycoproteins
        downstream of it.

- name: Global Protein N-Hypoglycosylation
  biological_scale: CELLULAR
  description: >-
    Because N-glycosylation is a housekeeping modification applied to a large
    fraction of the secreted and membrane proteome, a partial deficit at a
    single early enzyme is felt as the simultaneous, partial malfunction of
    very many unrelated proteins. This is the point at which a single-enzyme
    biochemical lesion becomes a multisystem disease, and it is why the
    downstream branches below are organ-level consequences of one shared
    upstream defect rather than independent mechanisms.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  evidence:
  - reference: PMID:22304930
    reference_title: "Congenital disorder of glycosylation type Ij (CDG-Ij, DPAGT1-CDG):
      extending the clinical and molecular spectrum of a rare disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the majority of proteins is glycosylated, a defect in a singular
      CDG enzyme leads to a multisytemic disease with secondary malfunction of thousands
      of proteins."
    explanation: States the one-enzyme-to-many-proteins amplification that this node
      asserts. Graded OTHER because it is the authors' framing of the disease class
      rather than a result of their own experiment.
  - reference: PMID:23249953
    reference_title: A compound heterozygous mutation in DPAGT1 results in a congenital
      disorder of glycosylation with a relatively mild phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isoelectric focusing and high-resolution mass spectrometry analyses
      of serum transferrin revealed glycosylation profiles that are consistent with
      a CDG-I defect."
    explanation: Demonstrates the hypoglycosylation in a patient's circulating
      glycoprotein, the accessible readout of this cellular node.
  downstream:
  - target: Hypoglycosylation of Neural Glycoproteins
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediate steps between reduced glycan supply and the
      neurodevelopmental phenotype have not been resolved; no specific neural
      glycoprotein has been shown to mediate them.
  - target: Neuromuscular Transmission Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Fetal Akinesia Sequence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Hypoglycosylation of Neural Glycoproteins
  biological_scale: TISSUE
  description: >-
    The central nervous system is the organ most conspicuously affected. Every
    reported cohort describes intractable epilepsy, global developmental delay
    or intellectual disability, and hypotonia, and imaging in individual
    patients has shown delayed myelination and cerebellar vermis
    abnormalities. Which hypoglycosylated neural glycoproteins mediate this is
    not known: no intermediate between the biosynthetic deficit and the
    encephalopathy has been established, so this node records a consistently
    observed tissue-level association rather than a resolved mechanism.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:30117111
    reference_title: "DPAGT1 Deficiency with Encephalopathy (DPAGT1-CDG): Clinical
      and Genetic Description of 11 New Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients have a very severe disease course, where common findings
      are pronounced muscular hypotonia, intractable epilepsy, global developmental
      delay/intellectual disability, and early death."
    explanation: Establishes the consistency of the neurological picture across the
      largest assembled DPAGT1-CDG cohort.
  - reference: PMID:23430862
    reference_title: "Further Delineation of the Phenotype of Congenital Disorder
      of Glycosylation DPAGT1-CDG (CDG-Ij) Identified by Homozygosity Mapping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the index case, the brain MRI revealed delayed myelination, and there
      was fiber type disproportion on muscle biopsy."
    explanation: Structural correlate in the brain of the second reported family.
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Delayed CNS myelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Neuromuscular Transmission Impairment
  biological_scale: TISSUE
  description: >-
    Alongside the encephalopathy, DPAGT1-CDG patients have a myasthenic
    component to their weakness. The evidence for treating this as a
    transmission defect rather than as central hypotonia is therapeutic:
    cholinesterase inhibition improves the muscle weakness of DPAGT1-CDG
    patients, as it does in the allelic myasthenic syndrome. This is the same
    endplate vulnerability that makes milder DPAGT1 alleles present as a pure
    congenital myasthenic syndrome, and the same one that the KB's Congenital
    Myasthenic Syndrome 15 entry curates for the neighbouring ALG14 subunit.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:37766827
    reference_title: "DPAGT1-CDG: Report of Two New Pediatric Patients and Brief Review
      of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Cholinesterase inhibitor therapy was found to be effective in patients
      against muscle weakness, supporting DPAGT1 deficiency as the underlying etiology."
    explanation: The response to cholinesterase inhibition is cited as validation
      of a neuromuscular-junction mechanism; the inference from drug response back
      to the mechanism it targets is the indirect step.
  - reference: PMID:28662078
    reference_title: "DPAGT1-CDG: Functional analysis of disease-causing pathogenic
      mutations and role of endoplasmic reticulum stress."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic mutations in DPAGT1 are manifested as two possible phenotypes:
      congenital disorder of glycosylation DPAGT1-CDG (also known as CDG-Ij), and
      limb-girdle congenital myasthenic syndrome (CMS) with tubular aggregates."
    explanation: Establishes that DPAGT1 deficiency can produce a neuromuscular
      junction disease, which is the endplate vulnerability this node invokes.
  downstream:
  - target: Severe muscular hypotonia
    causal_link_type: DIRECT

- name: Fetal Akinesia Sequence
  biological_scale: ORGANISM
  description: >-
    A subset of patients present prenatally with markedly reduced fetal
    movement, and the mechanical consequences of that immobility, namely joint
    contractures up to frank arthrogryposis multiplex congenita and
    polyhydramnios from impaired swallowing, dominate the neonatal picture.
    This is the severe end of the same weakness that appears postnatally as
    hypotonia, expressed early enough to deform the developing skeleton.
  evidence:
  - reference: PMID:22786653
    reference_title: "DPAGT1-CDG: report of a patient with fetal hypokinesia phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He showed severe fetal hypokinesia phenotype with decreased fetal movements
      and polyhydramnios."
    explanation: Reports the prenatal akinesia and its obstetric consequence in a
      genetically confirmed patient.
  - reference: PMID:26033833
    reference_title: Fetal akinesia deformation sequence due to a congenital disorder
      of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a newborn female with arthrogryposis multiplex due to fetal
      akinesia secondary to CDG-DPAGT1."
    explanation: States the causal sequence from fetal akinesia to arthrogryposis
      in DPAGT1-CDG, which is the claim of this node.
  downstream:
  - target: Decreased fetal movement
    causal_link_type: DIRECT
  - target: Arthrogryposis multiplex congenita
    causal_link_type: DIRECT
    description: >-
      Contractures form because the fetus does not move the developing joints
      through their range.
    evidence:
    - reference: PMID:26033833
      reference_title: Fetal akinesia deformation sequence due to a congenital disorder
        of glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a newborn female with arthrogryposis multiplex due to
        fetal akinesia secondary to CDG-DPAGT1."
      explanation: Attributes the arthrogryposis specifically to the fetal akinesia
        rather than to an independent skeletal lesion.
phenotypes:
- category: Neurological
  name: Seizure
  description: >-
    Medically intractable seizures, usually of early onset, are among the most
    consistent and most disabling features. They were present in the index
    patient and recur across every subsequent cohort, and they remain difficult
    to control even in the patients who survive into adult life.
  phenotype_term:

    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:37766827
    reference_title: "DPAGT1-CDG: Report of Two New Pediatric Patients and Brief Review
      of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A severe disease course with hypotonia, cataracts, skeletal deformities,
      resistant epilepsy, intellectual disability, global developmental delay, premature
      death has been described in most patients with DPAGT1-CDG."
    explanation: Establishes that the epilepsy requiring this treatment is typically
      resistant, which is the constraint on what anticonvulsants achieve here.
- name: Pyridostigmine
  description: >-
    An acetylcholinesterase inhibitor. It targets the myasthenic component of
    the weakness by prolonging acetylcholine dwell time at the endplate, and
    has produced measurable benefit in DPAGT1-CDG patients whose muscle
    weakness is prominent. It does nothing for the encephalopathy or the
    underlying glycosylation defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  target_mechanisms:
  - target: Neuromuscular Transmission Impairment
    treatment_effect: MODULATES
    description: >-
      Inhibiting acetylcholinesterase increases the time acetylcholine remains
      in the synaptic cleft, compensating for reduced endplate signalling
      without restoring glycosylation.
    evidence:
    - reference: PMID:37766827
      reference_title: "DPAGT1-CDG: Report of Two New Pediatric Patients and Brief
        Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We started pyridostigmine treatment in our patient with more pronounced
        muscle weakness, and we saw its benefit."
      explanation: Reports a clinical benefit of pyridostigmine directed at the
        weakness this mechanism node describes.
  evidence:
  - reference: PMID:37766827
    reference_title: "DPAGT1-CDG: Report of Two New Pediatric Patients and Brief Review
      of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cholinesterase inhibitor therapy was found to be effective in patients
      against muscle weakness, supporting DPAGT1 deficiency as the underlying etiology."
    explanation: States that cholinesterase inhibition is effective against the muscle
      weakness in these patients.
- name: Supportive and multidisciplinary care
  description: >-
    There is no disease-modifying therapy for DPAGT1-CDG. Care is supportive:
    feeding support, respiratory management, seizure control, ophthalmological
    review for cataract, and orthopaedic management of contractures, with
    genetic counselling for the family given the recessive recurrence risk.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39466823
    reference_title: A drug repurposing screen reveals dopamine signaling as a critical
      pathway underlying potential therapeutics for the rare disease DPAGT1-CDG.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DPAGT1-CDG is a Congenital Disorder of Glycosylation (CDG) that lacks
      effective therapies."
    explanation: States the absence of disease-modifying treatment that makes
      supportive care the standard of care.
animal_models:
- name: Gpt (Dpagt1) null mouse
  species: Mus musculus
  genotype: Homozygous germline deletion of the mouse GPT (Dpagt1) gene
  publication: PMID:10536042
  description: >-
    A germline deletion of the mouse GlcNAc-1-phosphotransferase gene.
    Nullizygous embryos implant but die within a day or two, before any organ
    that DPAGT1-CDG affects has formed. The model is therefore not a model of
    the human disease; its value is the negative constraint it places on human
    genotypes.
  genes:
  - preferred_term: DPAGT1
    term:
      id: hgnc:2995
      label: DPAGT1
  modeled_mechanisms:
  - target: Biallelic Hypomorphic DPAGT1 Variants
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete enzyme loss produces peri-implantation lethality rather than the
      human phenotype, which is why every viable human genotype retains partial
      activity.
    limitations: >-
      A homozygous null, not a hypomorph, so it models the wrong end of the
      allelic series: the embryos die at days 4-5 post-fertilisation, long
      before the nervous system, lens or neuromuscular junction exist, and no
      DPAGT1-CDG phenotype can be assessed in them. A hypomorphic mouse allele
      matching a patient genotype has not been reported.
    evidence:
    - reference: PMID:10536042
      reference_title: "A recessive deletion in the GlcNAc-1-phosphotransferase gene
        results in peri-implantation embryonic lethality."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We find that embryos homozygous for a deletion in the GPT gene complete
        preimplantation development and also implant in the uterine epithelium, but
        die shortly thereafter between days 4-5 postfertilization with cell degeneration
        apparent among both embryonic and extraembryonic cell types."
      explanation: Documents the lethal stage, which is what prevents this model from
        recapitulating the human disease.
  evidence:
  - reference: PMID:10536042
    reference_title: "A recessive deletion in the GlcNAc-1-phosphotransferase gene
      results in peri-implantation embryonic lethality."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicate that GPT function is essential in early embryogenesis
      and suggest that N-glycosylation is needed for the viability of cells comprising
      the peri-implantation stage embryo."
    explanation: The authors' own conclusion that the enzyme is essential, which is
      the constraint this model contributes.
- name: Drosophila DPAGT1 RNAi rough-eye model
  species: Drosophila melanogaster
  genotype: Eye-directed RNA interference knockdown of the Drosophila DPAGT1 orthologue
  publication: PMID:39466823
  description: >-
    An eye-based knockdown model in which reduced DPAGT1 expression produces a
    small, improperly developed eye that can be scored quantitatively. It was
    used for a 1,520-compound repurposing screen, which identified 42
    suppressors and implicated dopamine D2 receptor signalling as a modifier of
    DPAGT1 deficiency. The readout is a developmental eye phenotype, not any
    clinical feature of DPAGT1-CDG.
  genes:
  - preferred_term: DPAGT1
    term:
      id: hgnc:2995
      label: DPAGT1
  modeled_mechanisms:
  - target: Reduced GlcNAc-1-Phosphotransferase Activity
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      RNAi knockdown reproduces the partial enzyme deficiency of the human
      disease in a tractable invertebrate system, giving a scorable phenotype
      for chemical and genetic modifier screening.
    limitations: >-
      An invertebrate developmental eye phenotype with no relationship to the
      encephalopathy, epilepsy, hypotonia or cataract of the human disease, and
      no measurement of glycosylation in the model itself. Hits from it are
      leads for mechanism, not evidence of therapeutic effect in patients.
    readouts:
    - name: Drosophila eye size
      target: Reduced GlcNAc-1-Phosphotransferase Activity
      direction: RESTORED
      interpretation: >-
        Partial rescue of the small-eye phenotype by dopamine D2 receptor
        inhibition, the screen's principal hit.
      evidence:
      - reference: PMID:39466823
        reference_title: A drug repurposing screen reveals dopamine signaling as a
          critical pathway underlying potential therapeutics for the rare disease
          DPAGT1-CDG.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Notably from this screen, we found that pharmacological and genetic
          inhibition of the dopamine D2 receptor partially rescued the DPAGT1-CDG
          model."
        explanation: Reports the direction of the eye-size readout on which the
          screen's conclusion rests.
  evidence:
  - reference: PMID:39466823
    reference_title: A drug repurposing screen reveals dopamine signaling as a critical
      pathway underlying potential therapeutics for the rare disease DPAGT1-CDG.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We used a Drosophila rough eye model of DPAGT1-CDG with an improperly
      developed, small eye phenotype."
    explanation: Describes the model system and its readout.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than fifty patients have been reported since the disease was defined
    in 2003. A 2019 series counted 28 previously published patients from 10
    families and added 11 more from 8 families; 18 of the earlier patients came
    from a single consanguineous family, so the number of independent
    ascertainments is smaller than the patient count suggests. No population
    prevalence estimate has been published.
  evidence:
  - reference: PMID:30117111
    reference_title: "DPAGT1 Deficiency with Encephalopathy (DPAGT1-CDG): Clinical
      and Genetic Description of 11 New Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen disease-causing mutations in 28 patients from 10 families have
      previously been reported to cause the systemic form, DPAGT1-CDG. We here report
      on another 11 patients from 8 families and add 10 new mutations."
    explanation: Gives the published patient and family counts on which this
      ultra-rare classification rests.
progression:
- phase: Severe infantile course
  age_range: birth to 5 years
  notes: >-
    The usual course. Onset is at or before birth with hypotonia, often reduced
    fetal movement and contractures, followed by early-onset intractable
    epilepsy and global developmental delay, with death in infancy or early
    childhood.
  evidence:
  - reference: PMID:23430862
    reference_title: "Further Delineation of the Phenotype of Congenital Disorder
      of Glycosylation DPAGT1-CDG (CDG-Ij) Identified by Homozygosity Mapping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder was fatal in all affected cases and mostly in early infancy."
    explanation: Documents the fatal early-infantile course in the largest single
      family.
  - reference: PMID:22304930
    reference_title: "Congenital disorder of glycosylation type Ij (CDG-Ij, DPAGT1-CDG):
      extending the clinical and molecular spectrum of a rare disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both our patients died within their first year of life."
    explanation: Independent report of death within the first year in a second
      family.
- phase: Attenuated course surviving to adulthood
  age_range: adulthood
  notes: >-
    A minority of patients carrying milder allele combinations survive into
    adult life with moderate intellectual disability, epilepsy, hypotonia and
    behavioural problems, and a stable rather than progressive course. Two such
    adults were the first to show that the DPAGT1-CDG spectrum extends well
    beyond lethal infantile disease.
  evidence:
  - reference: PMID:23249953
    reference_title: A compound heterozygous mutation in DPAGT1 results in a congenital
      disorder of glycosylation with a relatively mild phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we report a non-consanguineous family with two affected
      adults presenting with a relatively mild phenotype consisting of moderate ID,
      epilepsy, hypotonia, aggressive behavior and balance problems."
    explanation: Documents the attenuated adult phenotype that defines this course.
  - reference: PMID:30117111
    reference_title: "DPAGT1 Deficiency with Encephalopathy (DPAGT1-CDG): Clinical
      and Genetic Description of 11 New Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also present data on three affected females that are young adults
      and have a somewhat milder, stable disease."
    explanation: Independent confirmation that a milder, stable adult course occurs.
discussions:
- discussion_id: dpagt1_cdg_cms_boundary
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the boundary between DPAGT1-CDG and DPAGT1-CMS a difference of kind or
    only of degree, and does the myasthenic weakness of DPAGT1-CDG patients
    belong to this entry or to the myasthenic one?
  attaches_to:
  - pathophysiology#Neuromuscular Transmission Impairment
  rationale: >-
    DPAGT1 has two named allelic diseases with separate MONDO terms and
    separate OMIM entries: the systemic encephalopathy curated here
    (MONDO:0011964, OMIM:608093) and limb-girdle congenital myasthenic syndrome
    13 with tubular aggregates (MONDO:0013883, OMIM:614750), which the KB
    curates in its Congenital Myasthenic Syndrome entry. This entry follows
    that split. But the split is not clean in the clinic: DPAGT1-CDG patients
    have a myasthenic component to their weakness that responds to
    cholinesterase inhibition, which is the DPAGT1-CMS mechanism appearing
    inside the CDG phenotype, and the reported severity range within
    DPAGT1-CDG alone spans lethal infantile encephalopathy to stable adult
    disease. The likeliest organising variable is residual enzyme activity
    rather than a categorical difference, in which case the two MONDO terms
    name two regions of one continuum. If the KB later adopts a convention for
    allelic series graded by residual activity, this pair is a candidate for
    a grouping that spans both terms.
- discussion_id: dpagt1_neural_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which hypoglycosylated neural glycoproteins mediate the epilepsy,
    developmental delay and microcephaly of DPAGT1-CDG?
  attaches_to:
  - pathophysiology#Hypoglycosylation of Neural Glycoproteins
  rationale: >-
    The neuromuscular arm of this disease has a candidate target, endplate
    receptor hypoglycosylation, shown for the neighbouring ALG14 subunit and
    supported here by the response to cholinesterase inhibition. The central
    nervous system arm has none. Intractable epilepsy, developmental delay and
    microcephaly are documented in every cohort, but no specific neural
    glycoprotein has been shown to be hypoglycosylated in patients and no
    intermediate step between the biosynthetic defect and the encephalopathy
    has been established. Brain imaging is not even consistent across patients.
    The corresponding pathophysiology node therefore asserts a tissue-scale
    association and is tagged with hypothetical mechanism confidence; it should
    not be read as a mechanism.
- discussion_id: dpagt1_er_stress_not_the_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    If the unfolded protein response is not activated in DPAGT1-CDG
    fibroblasts, what does the increased sensitivity to tunicamycin in those
    cells represent?
  attaches_to:
  - pathophysiology#Global Protein N-Hypoglycosylation
  rationale: >-
    ER stress is an attractive candidate mediator for a disease of ER-resident
    glycan assembly, and it is active in other CDG subtypes. It was tested
    directly in DPAGT1-CDG patient fibroblasts and was not found: the unfolded
    protein response was inactive, unlike in PMM2-CDG or DPM1-CDG cells. The
    same cells were nonetheless more sensitive than controls to the GPT
    inhibitor tunicamycin. Whether that reflects a reduced reserve of the same
    enzyme rather than a stress-response phenotype is unresolved, and the
    negative result is worth recording so that ER stress is not assumed into
    this entry's mechanism by analogy with other CDGs.
  evidence:
  - reference: PMID:28662078
    reference_title: "DPAGT1-CDG: Functional analysis of disease-causing pathogenic
      mutations and role of endoplasmic reticulum stress."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "The unfolded protein response (UPR; the response to ER stress) was found
      not to be active in patient-derived fibroblasts, unlike that seen in cells from
      patients with PMM2-CDG or DPM1-CDG."
    explanation: Refutes an activated unfolded protein response as a mechanism in
      DPAGT1-CDG patient cells.
references:
- reference: PMID:12872255
  title: "Deficiency of UDP-GlcNAc:Dolichol Phosphate N-Acetylglucosamine-1 Phosphate
    Transferase (DPAGT1) causes a novel congenital disorder of Glycosylation Type
    Ij."
- reference: PMID:30117111
  title: "DPAGT1 Deficiency with Encephalopathy (DPAGT1-CDG): Clinical and Genetic
    Description of 11 New Patients."
notes: >-
  Entity identity. MONDO:0011964 is DPAGT1-CDG, formerly CDG-Ij, cross-referenced
  to OMIM:608093 and Orphanet:86309. MONDO's definition names hypotonia,
  intractable seizures, developmental delay, microcephaly and severe fetal
  hypokinesia, which matches the curated phenotype set here.

  Scope decision: DPAGT1-CDG versus DPAGT1-CMS. DPAGT1 causes two allelic
  diseases, and this entry curates only the first. The severe multisystem
  encephalopathy is MONDO:0011964 / OMIM:608093. The much milder limb-girdle
  congenital myasthenic syndrome with tubular aggregates, CMS-13, is a distinct
  MONDO term (MONDO:0013883, exact synonyms CMS13 and CMSTA2) with its own OMIM
  entry (614750), and the KB already curates it inside
  `kb/disorders/Congenital_Myasthenic_Syndrome.yaml`, where DPAGT1 is listed as
  a causative CMS gene accounting for around 10 percent of cases in one cohort.
  It is therefore NOT modelled here as a `has_subtypes` entry: doing so would
  put one MONDO disease inside another and would duplicate content that already
  exists elsewhere in the KB. This is deliberate, not an omission.

  What this entry does carry from the myasthenic side is the myasthenic
  component of DPAGT1-CDG itself, namely the pathophysiology node
  `Neuromuscular Transmission Impairment` and the pyridostigmine treatment,
  because cholinesterase inhibition demonstrably helps the muscle weakness of
  DPAGT1-CDG patients and not only of DPAGT1-CMS patients. The question of
  whether the two named diseases are really one graded continuum is recorded
  under `discussions` rather than settled here.

  Named entity confusion warning for future curators. The DPAGT1 literature is
  dominated by the myasthenic phenotype: a PubMed search for the gene returns
  many limb-girdle CMS papers, and several of the most cited DPAGT1 clinical
  papers (for example the Iranian limb-girdle CMS family, PMID:23591138) are
  about CMS-13 and not about this disease. Every reference cited in this entry
  was checked to be reporting DPAGT1-CDG rather than DPAGT1-CMS, with the
  deliberate exception of two papers that discuss both explicitly and are
  quoted only where they speak about DPAGT1-CDG or about the gene's two
  phenotypes as a pair (PMID:28662078, PMID:37766827).

  Early death is deliberately not curated as a phenotype. It is the usual
  outcome of the severe form and is recorded in `progression` and in the
  variant descriptions, but the HPO term for it (HP:0001522, Death in infancy)
  sits in the mortality/aging branch and is not a member of the schema's
  PhenotypeTerm enum, so there is no valid binding for it in `phenotypes`.

  GeneReviews. There is no current GeneReviews chapter for DPAGT1-CDG. The
  general N-linked glycosylation overview, PMID:20301507, is marked
  "RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY" and was not used as a
  phenotype baseline. The 11-patient series (PMID:30117111) was used in its
  place as the broadest clinical baseline available.

  Relationship to the ALG14 entry. GPT works in a multiglycosyltransferase
  complex with ALG13 and ALG14 at the first committed steps of N-linked
  glycosylation. The KB's `Congenital_Myasthenic_Syndrome_15` entry curates the
  ALG14 subunit of that same complex, and this entry's account of the complex
  is consistent with it. The two diseases illustrate the same principle from
  opposite ends: ALG14 deficiency is usually a myasthenia that can extend to a
  neurodegenerative CDG, DPAGT1 deficiency is usually a CDG that carries a
  myasthenic component.

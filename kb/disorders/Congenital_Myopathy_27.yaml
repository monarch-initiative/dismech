  diagnosis_term:
    preferred_term: Muscle Biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: Under physical exercise, failure to invaginate caveolae using the membrane-shaping protein syndapin III coincided with a widened caliber spectrum, detached nuclei and signs of inflammation and necrosis.
    explanation: Describes the exercise-dependent histopathology of syndapin III knockout mouse muscle, which is what a patient biopsy would be examined for. It is a mouse result, not a patient finding.

pathophysiology:
- name: Loss of Syndapin III Membrane-Shaping Activity
  biological_scale: MOLECULAR
  description: Biallelic truncating PACSIN3 variants are expected to remove syndapin III, whose F-BAR domain binds lipid membranes and bends them into tubules about 80 nm in diameter, matching the curvature of caveolae. A truncated N-terminal fragment retaining only the first 70 residues has none of these F-BAR functions.

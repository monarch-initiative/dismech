  - preferred_term: PACSIN3
    term:
      id: hgnc:8572
      label: PACSIN3
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: phospholipid membrane binding by the syndapin III F-BAR domain
    modifier: DECREASED
    term:
      id: GO:0005543
      label: phospholipid binding
  evidence:
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both tagged and untagged full-length syndapin III formed tubules with an average diameter of about 80 nm (Figure 5a–e).
    explanation: Liposome reconstitution shows that full-length syndapin III binds and tubulates lipid membranes.
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: Additional control examinations conducted clearly showed that the putative syndapin III1-70 peptide anyhow did not show any F-BAR domain functionalities, such as induction of membrane tubules (Figure 1c–e; Figure 1—figure supplement 1) and membrane binding (Figure 1f–h).
    explanation: A truncated N-terminal product lacks membrane binding and tubulation. This is the knockout allele's residual peptide, not a patient allele, so it supports the loss-of-function reading of truncation only by analogy.
  downstream:
  - target: Failure of Caveolar Invagination in Muscle
    causal_link_type: DIRECT
    description: Without syndapin III, caveolin-3 and cavin-1 remain at the sarcolemma but do not form deep caveolae.
    evidence:
    - reference: PMID:29202928
      reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The membrane-shaping protein syndapin III is crucial for caveolar invagination and KO rendered the cells sensitive to membrane tensions.
      explanation: Knockout establishes syndapin III as required for caveolar invagination.
- name: Failure of Caveolar Invagination in Muscle
  biological_scale: CELLULAR
  description: Skeletal and cardiac muscle cells lacking syndapin III have severely reduced deep caveolae although caveolin-3 and cavin-1 levels at the plasma membrane are not reduced, so the coat proteins alone cannot form caveolae. Syndapin III sits at the caveolar neck, where membrane curvature changes.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: caveola assembly
    modifier: DECREASED
    term:
      id: GO:0070836
      label: caveola assembly
  evidence:
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We show that muscle cells of syndapin III KO mice show severe reductions of caveolae reminiscent of human caveolinopathies.
    explanation: Loss of caveolae in knockout muscle.
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Yet, different from other mouse models, the levels of the plasma membrane-associated caveolar coat proteins caveolin3 and cavin1 were both not reduced upon syndapin III KO.
    explanation: The defect is in invagination, not in coat protein abundance.
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Fifth, syndapin III localized specifically to necks of cav3-coated caveolar invaginations – sites, which can be expected to represent zones of curvature modulation during invagination.
    explanation: Places syndapin III at the caveolar neck in muscle.
  downstream:
  - target: Loss of Sarcolemmal Tension Buffering
    causal_link_type: DIRECT
    description: Caveolae flatten under membrane tension and so act as a membrane reservoir; without them the sarcolemma cannot buffer stretch.
    evidence:
    - reference: PMID:29202928
      reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Thus, syndapin III is crucial for caveolar invagination and thereby highlights that the physiological function of cav3-coated caveolae is to preserve muscle cell integrity upon acute membrane tensions, as they occur during physical exercise.
      explanation: Links absent caveolae to loss of protection against membrane tension.
- name: Loss of Sarcolemmal Tension Buffering
  biological_scale: CELLULAR
  description: Syndapin III knockout muscle cells are more easily damaged when membrane tension rises, shown by increased trypan blue uptake after hypo-osmotic swelling.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: plasma membrane organization
    modifier: DYSREGULATED
    term:
      id: GO:0007009
      label: plasma membrane organization
  evidence:
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: (i–o) Trypan Blue assays with WT (i–k) and syndapin III KO cardiomyocytes (l–n) subjected to membrane tensions mimicked by mild hypoosmotic stress (5 min hypo30; j,m) and stronger hypoosmotic stress (5 min hypo15; k,n) unveiling a higher vulnerability of syndapin III KO cells under conditions increasing membrane tensions.
    explanation: Membrane-tension vulnerability was measured in cultured knockout cardiomyocytes; extending it to skeletal muscle fibers is an inference supported by the exercise phenotype below.
  downstream:
  - target: Exercise-Induced Myofiber Damage
    causal_link_type: DIRECT
    description: Mechanical load during exercise injures fibers that cannot buffer membrane tension.
    evidence:
    - reference: PMID:29202928
      reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Consistent with this physiological role of caveolae in counterpoising membrane tensions, syndapin III KO skeletal muscles showed pathological parameters upon physical exercise that are also found in CAVEOLIN3 mutation-associated muscle diseases.
      explanation: Exercise unmasks muscle pathology in the knockout.
- name: Exercise-Induced Myofiber Damage
  biological_scale: TISSUE
  description: After physical exercise, syndapin III knockout skeletal muscle shows a widened fiber caliber spectrum, detached nuclei, necrotic fibers invaded by immune cells and secondary inflammation. Untrained knockout muscle shows only a mildly extended caliber spectrum.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Under physical exercise, failure to invaginate caveolae using the membrane-shaping protein syndapin III coincided with a widened caliber spectrum, detached nuclei and signs of inflammation and necrosis.
    explanation: Exercise-induced histopathology in knockout muscle.
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: H&E stainings of musculus gastrocnemius cryosections from syndapin III KO mice subjected to physical exercise showed necrotic fibers invaded by immune cells as well as inflammation secondary to degeneration (Figure 11c–f; asterisk in Figure 11c).
    explanation: Necrosis with immune cell invasion after exercise.
  - reference: PMID:29202928
    reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The muscle fibers of untrained syndapin III KO mice displayed an extended caliber spectrum being a sign of impaired muscle integrity.
    explanation: A milder baseline defect is present without exercise.
  downstream:
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Repeated load-induced fiber damage is the proposed basis of the human myopathy. This rests on the mouse model; patient muscle pathology has not been compared with it in a citable source.
    evidence:
    - reference: PMID:34990060
      reference_title: 'PACSIN proteins in vivo: Roles in development and physiology.'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: In skeletal muscle, however, the absence of PACSIN3 in trained mice resulted in the presence of hypertrophic and necrotic muscle fibres, a phenotype reminiscent of human myodystrophies resulting from mutations in the caveolin-3 gene.
      explanation: Review synthesis tying the knockout muscle phenotype to human caveolin-3 myopathies.
  - target: Elevated circulating creatine kinase activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Sarcolemmal damage and fiber necrosis would release creatine kinase into the circulation. Inferred from the mechanism; the cited mouse study did not report serum creatine kinase.
    evidence:
    - reference: PMID:29202928
      reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: H&E stainings of musculus gastrocnemius cryosections from syndapin III KO mice subjected to physical exercise showed necrotic fibers invaded by immune cells as well as inflammation secondary to degeneration (Figure 11c–f; asterisk in Figure 11c).
      explanation: Myofiber necrosis upon mechanical stress in syndapin III knockout muscle provides the mechanistic basis for sarcolemmal leakage of creatine kinase.
  - target: Exercise intolerance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Fibers injured by mechanical load would limit sustained exertion. Inferred from the exercise dependence of the mouse pathology.
    evidence:
    - reference: PMID:29202928
      reference_title: Deciphering caveolar functions by syndapin III KO-mediated impairment of caveolar invagination.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Consistent with this physiological role of caveolae in counterpoising membrane tensions, syndapin III KO skeletal muscles showed pathological parameters upon physical exercise that are also found in CAVEOLIN3 mutation-associated muscle diseases.
      explanation: Exercise-triggered myofiber damage in syndapin III knockout mice parallels caveolin-3 myopathies and accounts for exercise-induced muscle dysfunction.

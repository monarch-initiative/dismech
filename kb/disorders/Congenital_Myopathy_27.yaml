references:
- reference: PMID:38637313
  title: Biallelic truncating variants in PACSIN3 cause childhood-onset myopathy with hyperCKaemia.
notes: The disease was defined by Distelmaier et al. (PMID:38637313, Brain 2024), a letter with no PubMed abstract, no PubMed Central copy and a subscription-only full text, so `just fetch-reference` caches its metadata only and none of its findings can be quoted as a validated snippet. The phenotype section (childhood-onset myopathy, hyperCKemia, exercise intolerance with early fatigue) is therefore drawn from that paper's title and from the Disease Ontology definition (DOID:0061258) and carries no evidence items. A Europe PMC full-text search for PACSIN3 with myopathy, hyperCKemia or hyperCKaemia (October 2026, 11 hits) returned no further human case report. The pathophysiology is supported by the syndapin III knockout mouse (PMID:29202928) and should be read as the proposed mechanism, not as one confirmed in patient muscle.

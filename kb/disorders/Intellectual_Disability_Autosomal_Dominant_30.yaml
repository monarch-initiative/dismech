- name: Loss of brain-specific RBFOX2-dependent splicing
  biological_scale: MOLECULAR
  description: >-
    ZMYND11 couples the chromatin mark it reads to pre-mRNA processing. It
    associates with U5 snRNP spliceosome components and promotes intron
    retention by antagonising EFTUD2, and that regulation itself depends on its
    binding to H3K36me3-decorated chromatin - so the splicing arm is downstream
    of the reader function rather than parallel to it. In the developing cortex
    the disease-relevant output is a brain-specific isoform switch through the
    splicing regulator RBFOX2. Splicing dysregulation accompanies the
    transcriptional phenotype and is partially rescuable through ZMYND11's own
    regulatory functions.
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
    modifier: DECREASED
  evidence:
  - reference: PMID:25263594
    reference_title: "BS69/ZMYND11 reads and connects histone H3.3 lysine 36 trimethylation-decorated chromatin to regulated pre-mRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical and genetic experiments demonstrate that BS69 promotes IR by
      antagonizing EFTUD2 through physical interactions.
    explanation: >-
      Identifies the molecular route from ZMYND11 to splicing: physical
      antagonism of the U5 snRNP component EFTUD2, regulating intron retention.
  - reference: PMID:25263594
    reference_title: "BS69/ZMYND11 reads and connects histone H3.3 lysine 36 trimethylation-decorated chromatin to regulated pre-mRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further show that regulation of IR by BS69 also depends on its binding
      to H3K36me3-decorated chromatin.
    explanation: >-
      Establishes that the splicing function is dependent on the chromatin-reader
      function, which is why this node is placed downstream of reader loss.
  - reference: PMID:39464123
    reference_title: "ZMYND11 Functions in Bimodal Regulation of Latent Genes and Brain-like Splicing to Safeguard Corticogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition to its role on histones, ZMYND11 controls a brain-specific
      isoform switch involving the splicing regulator RBFOX2.
    explanation: >-
      Establishes the RBFOX2-dependent brain splicing programme as a ZMYND11
      output.
  downstream:
  - target: Impaired cortical progenitor and neuron production
    description: >-
      Splicing dysregulation contributes, alongside transcriptional
      de-repression, to defective corticogenesis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39464123
      reference_title: "ZMYND11 Functions in Bimodal Regulation of Latent Genes and Brain-like Splicing to Safeguard Corticogenesis."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        similar developmental pathway activation and splicing dysregulation,
        partially rescuable through ZMYND11's regulatory functions
      explanation: >-
        Supports splicing dysregulation as part of the corticogenesis phenotype.
        Graded PARTIAL because the source establishes co-occurrence and partial
        rescue rather than isolating the splicing arm's independent contribution
        to progenitor loss.

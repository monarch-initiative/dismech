inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous ZMYND11 variants are causative and are mostly de novo. Both
    intragenic loss-of-function variants and whole-gene deletion within a
    10p15.3 microdeletion produce the phenotype, which is the dosage argument
    for haploinsufficiency as the usual mechanism.
  evidence:
  - reference: PMID:38397245
    reference_title: "Further Delineation of Clinical Phenotype of ZMYND11 Variants in Patients with Neurodevelopmental Dysmorphic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous pathogenic variants in the ZMYND11 gene have been
      subsequently identified as the causes of autosomal dominant intellectual
      developmental disorder-30 with speech delay and behavioural abnormalities
    explanation: >-
      Names the entity and establishes heterozygous ZMYND11 variants as its
      cause.
  - reference: PMID:34216016
    reference_title: "ZMYND11 variants are a novel cause of centrotemporal and generalised epilepsies with neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants were distributed across the gene and mostly de novo with no
      precise genotype-phenotype correlation.
    explanation: >-
      Establishes the predominantly de novo origin and the absence of a
      positional genotype-phenotype correlation.
  - reference: PMID:34818214
    reference_title: "Intragenic Deletion of the ZMYND11 Gene in 10p15.3 is Associated with Developmental Delay Phenotype: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our report contributes to expand the clinical and mutational spectrum of
      ZMYND11 and confirms haploinsufficiency as the underlying disease
      mechanism
    explanation: >-
      An intragenic deletion removing only the 5'UTR and first two exons produces
      the phenotype, which is the cleanest dosage argument for haploinsufficiency
      - it removes ZMYND11 alone without the neighbouring genes a larger 10p15.3
      deletion would take.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The disorder is known from
    aggregated case reports and small cohorts - the largest published series
    describes 20 individuals with ZMYND11-associated epilepsy, assembled through
    GeneMatcher, ClinVar and a rare-epilepsy network. The class is recorded as
    ULTRA_RARE on that basis, and this record exists to say "no estimate exists"
    structurally rather than to leave the section absent.
  evidence:
  - reference: PMID:34216016
    reference_title: "ZMYND11 variants are a novel cause of centrotemporal and generalised epilepsies with neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We obtained clinical descriptions of 16 new and nine published
      individuals, plus detailed case history of two children.
    explanation: >-
      Shows the scale the field is working at - a landmark series assembled from
      16 new and nine previously published individuals - which is what supports
      an ultra-rare classification in the absence of any population estimate.
progression:
- phase: Onset and course
  notes: >-
    Onset is congenital to early childhood and the course is static rather than
    neurodegenerative: neurodevelopmental deficits are invariable and do not
    remit, while the epilepsy is the variable element, ranging from spontaneous
    remission to drug resistance.
  evidence:
  - reference: PMID:34216016
    reference_title: "ZMYND11 variants are a novel cause of centrotemporal and generalised epilepsies with neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizure prognosis ranged from spontaneous remission to drug resistant.
    explanation: >-
      Establishes that the seizure course, unlike the neurodevelopmental one, is
      not fixed at onset.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is molecular. Intragenic ZMYND11 variants are found by exome or
    genome sequencing or by intellectual-disability and epilepsy gene panels;
    whole-gene deletions within a 10p15.3 microdeletion are found by chromosomal
    microarray, which a sequencing-only strategy can miss. Variants are
    classified against ACMG criteria. There is no biochemical marker and no
    functional assay in clinical use.
  evidence:
  - reference: PMID:34216016
    reference_title: "ZMYND11 variants are a novel cause of centrotemporal and generalised epilepsies with neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic evaluation was performed using gene panels or exome sequencing;
      variants were classified using American College of Medical Genetics
      (ACMG) criteria.
    explanation: >-
      States the testing modalities and the classification framework used in the
      largest published series.
  - reference: PMID:39696561
    reference_title: "Prenatal diagnosis and molecular cytogenetic analysis of pure chromosome 10p15.3 microdeletion using chromosomal microarray analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Karyotyping and chromosomal microarray analysis (CMA) was conducted to
      assess chromosomal abnormalities and detect copy number variations (CNVs)
      within the families, respectively.
    explanation: >-
      Supports chromosomal microarray as the modality that detects the deletion
      form, which sequencing panels may not call.
pathophysiology:
- name: Loss of ZMYND11 H3.3K36me3 reader function
  biological_scale: MOLECULAR
  description: >-
    ZMYND11 binds H3.3K36me3 over the bodies of actively transcribed genes and
    acts as an unconventional co-repressor, damping the elongation phase of RNA
    polymerase II. A heterozygous loss-of-function allele halves that reader
    dosage. The proposed normal role is suppression of cryptic transcription
    initiating from within gene bodies of highly expressed genes, so this is
    loss of a brake on transcriptional noise rather than loss of a dedicated
    activator or repressor of specific target genes.
  genes:
  - preferred_term: ZMYND11
    term:
      id: hgnc:16966
      label: ZMYND11
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:38397245
    reference_title: "Further Delineation of Clinical Phenotype of ZMYND11 Variants in Patients with Neurodevelopmental Dysmorphic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZMYND11 encodes a zinc finger MYND domain-containing protein that acts as
      a transcriptional co-repressor to inhibit the elongation phase of RNA
      polymerase II via the recognition of histone modification of the
      transcribed regions.
    explanation: >-
      Directly states the reader and co-repressor function acting on
      transcriptional elongation.
  - reference: PMID:28933030
    reference_title: "Phenotype comparison confirms ZMYND11 as a critical gene for 10p15.3 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the ZMYND11 gene has important functions in epigenetic regulation as an
      unconventional transcription co-repressor of highly expressed genes,
      possibly acting in the repression of cryptic transcription from gene
      bodies
    explanation: >-
      Supports the cryptic-transcription suppression model. The source itself
      hedges with "possibly", which is why this node is described as a proposed
      normal role rather than an established one.
  - reference: PMID:41068108
    reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ZMYND11, known for its tumor suppressor function, encodes a
      histone-reader that recognizes sites of transcriptional elongation and
      acts as a co-repressor.
    explanation: >-
      Independent confirmation of the reader and co-repressor function in a
      human stem cell system.
  - reference: PMID:25263594
    reference_title: "BS69/ZMYND11 reads and connects histone H3.3 lysine 36 trimethylation-decorated chromatin to regulated pre-mRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that BS69 selectively recognizes histone variant H3.3 lysine 36
      trimethylation
    explanation: >-
      The founding biochemical study identifying the specific mark ZMYND11 reads.
      It establishes selectivity for the H3.3 variant, which is what makes this a
      variant-specific reader rather than a generic H3K36me3 binder.
  downstream:
  - target: De-repression of latent developmental transcriptional programmes
    description: >-
      Losing the elongation brake allows normally silent developmental pathways
      to be expressed in cortical progenitors.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41068108
      reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ZMYND11-deficient cortical neural stem cells upregulate inappropriate
        developmental pathways, leading to disrupted neurogenesis.
      explanation: >-
        Direct experimental link from ZMYND11 deficiency to de-repression of
        latent programmes.
  - target: Loss of brain-specific RBFOX2-dependent splicing
    description: >-
      ZMYND11 loss also disrupts a brain-specific RNA isoform switch through the
      splicing regulator RBFOX2. The published study is explicit that this is
      not a direct chromatin-to-spliceosome effect in cortical cells: few
      differentially spliced events overlapped ZMYND11 chromatin binding, and
      the authors attribute the splicing phenotype to increased RBFOX2
      expression in the mutant. The edge is therefore indirect with RBFOX2 as
      the named intermediate.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41068108
      reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In addition to its role on chromatin, ZMYND11 regulates a brain-specific
        RNA isoform switch involving the splicing regulator RBFOX2.
      explanation: >-
        Establishes the RBFOX2 isoform switch as an output of ZMYND11 loss.
        Note the published wording is "in addition to its role on chromatin",
        not "on histones" - the preprint said the latter, and the difference
        matters for how separable this arm is taken to be.
    - reference: PMID:41068108
      reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we found that ZMYND11 did not largely regulate splicing, as few DAS
        events overlapped with chromatin binding.
      explanation: >-
        The authors' own negative result, and the reason this edge is graded
        INDIRECT_KNOWN_INTERMEDIATES rather than DIRECT.
- name: De-repression of latent developmental transcriptional programmes
  biological_scale: CELLULAR
  description: >-
    Cortical neural stem cells lacking ZMYND11 upregulate latent developmental
    pathways. The same pattern appears when other chromatin-related autism risk
    factors are perturbed, which positions this as a shared convergent
    consequence of chromatin-regulator loss rather than a ZMYND11-private effect.
  cell_types:
  - preferred_term: neural stem cell
    term:

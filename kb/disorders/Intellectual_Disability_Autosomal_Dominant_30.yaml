      label: neural stem cell
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:41068108
    reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similar defects are observed in other chromatin-related ASD risk genes,
      some of which are partially rescued by enhancing ZMYND11 function.
    explanation: >-
      Supports convergence of chromatin-regulator loss on the same
      transcriptional and splicing consequences.
  downstream:
  - target: Impaired cortical progenitor and neuron production
    description: >-
      De-repressed developmental programmes impair the production of cortical

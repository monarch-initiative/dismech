      id: hgnc:16966
      label: ZMYND11
  evidence:
  - reference: PMID:25217958
    reference_title: "Refining analyses of copy number variation identifies specific genes associated with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      truncations of ZMYND11 in individuals with autism, aggression and complex
      neuropsychiatric features
    explanation: >-
      The integrated CNV and sequencing study that first pinpointed ZMYND11
      truncations as causal.
  - reference: PMID:28933030
    reference_title: "Phenotype comparison confirms ZMYND11 as a critical gene for 10p15.3 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of our study further confirm that the ZMYND11 gene is the
      critical gene for the clinical phenotype of 10p15.3 microdeletion
    explanation: >-
      Establishes ZMYND11 as the driver gene of the contiguous-gene syndrome,
      which is the argument for MRD30 as a monogenic entity.
  - reference: PMID:34818214
    reference_title: "Intragenic Deletion of the ZMYND11 Gene in 10p15.3 is Associated with Developmental Delay Phenotype: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients harboring 10p15.3 microdeletions or pathogenic ZMYND11 truncating
      variants share similar clinical features including hypotonia, intellectual
      disability, facial dysmorphisms, speech and motor delays, seizures, and
      significant behavioral problems
    explanation: >-
      Direct statement of the phenotypic equivalence between the deletion
      syndrome and intragenic ZMYND11 variants, which is what justifies curating
      MRD30 as one disease.
  notes: >-
    Variant classes and what separates them. Most reported pathogenic variants
    are truncating or whole-gene deletions and are consistent with
    haploinsufficiency. Missense variants are rarer and may not be a weaker
    version of the same thing: aggregate comparison of 13 reported missense
    variants found higher frequencies of strabismus, hypotonia and severe
    intellectual disability than in loss-of-function carriers, and the recurrent
    c.1798C>T p.Arg600Trp variant is associated with microcephaly, broad nasal
    alae, short stature, cryptorchidism and nipple anomalies that are not
    emphasised in loss-of-function cases. Variants are distributed across the
    gene with no reproducible positional genotype-phenotype correlation, so
    variant position should not be used prognostically.

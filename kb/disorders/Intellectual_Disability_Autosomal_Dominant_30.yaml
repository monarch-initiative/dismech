      snippet: >-
        ZMYND11-deficient cortical neural stem cells showed upregulation of
        latent developmental pathways
      explanation: >-
        Direct experimental link from ZMYND11 deficiency to de-repression of
        latent programmes.
  - target: Loss of brain-specific RBFOX2-dependent splicing
    description: >-
      ZMYND11 additionally controls a brain-specific isoform switch through the
      splicing regulator RBFOX2, a function the source presents as separable
      from its action on histones.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39464123
      reference_title: "ZMYND11 Functions in Bimodal Regulation of Latent Genes and Brain-like Splicing to Safeguard Corticogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In addition to its role on histones, ZMYND11 controls a brain-specific
        isoform switch involving the splicing regulator RBFOX2.
      explanation: >-
        Establishes the splicing arm as a second, histone-independent output of
        ZMYND11.
- name: De-repression of latent developmental transcriptional programmes
  biological_scale: CELLULAR
  description: >-
    Cortical neural stem cells lacking ZMYND11 upregulate latent developmental
    pathways. The same pattern appears when other chromatin-related autism risk
    factors are perturbed, which positions this as a shared convergent
    consequence of chromatin-regulator loss rather than a ZMYND11-private effect.

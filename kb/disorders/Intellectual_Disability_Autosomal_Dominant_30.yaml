name: Intellectual Disability, Autosomal Dominant 30
creation_date: "2026-08-28T12:30:00Z"
category: Mendelian
description: >-
  Intellectual developmental disorder, autosomal dominant 30 (MRD30) is the
  monogenic ZMYND11-related neurodevelopmental disorder. ZMYND11 sits at the
  terminal end of chromosome 10p and is the critical gene of the 10p15.3
  microdeletion syndrome; heterozygous intragenic variants reproduce that
  contiguous-gene phenotype on their own, which is what established the gene as
  the driver and defined MRD30 as a distinct entity.

  ZMYND11 encodes a histone reader. It recognises H3.3K36me3 - the mark
  deposited over the bodies of actively transcribed genes - and acts as an
  unconventional transcriptional co-repressor, restraining the elongation phase
  of RNA polymerase II. The proposed function is to
  suppress cryptic transcription from within gene bodies of highly expressed
  genes, so the protein is a brake on transcriptional noise rather than a switch
  on any single target.

  In a human pluripotent stem cell model, removing that brake has two separable
  consequences. ZMYND11-deficient cortical neural stem cells de-repress latent
  developmental pathways and produce fewer progenitors and neurons; and,
  independently of histone binding, ZMYND11 turns out to control a brain-specific
  isoform switch through the splicing regulator RBFOX2. So the disorder is a
  chromatin reader defect with a downstream splicing arm, not a pure
  transcriptional one.

  Clinically the core is intellectual disability with disproportionate expressive
  speech delay, behavioural abnormalities including autistic features and
  aggression, hypotonia, seizures, feeding difficulties and craniofacial
  dysmorphism. Two things about the evidence are worth flagging up front.
  Epilepsy is heterogeneous rather than a single syndrome, ranging from atypical
  benign partial epilepsy that remits spontaneously to drug-resistant generalised
  epilepsy, with no reproducible genotype-phenotype correlation across the gene.
  And the missense variants are not simply weaker loss of function: aggregate
  comparison suggests they carry higher rates of strabismus, hypotonia and severe
  intellectual disability than truncating variants, which the reporting authors
  read as a mechanism other than simple haploinsufficiency. That is an open
  question, curated here as one.

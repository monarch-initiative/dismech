      explanation: >-
        Direct causal statement linking the transcriptional de-repression to
        reduced progenitor and neuron output.
- name: Loss of brain-specific RBFOX2-dependent splicing
  biological_scale: MOLECULAR
  description: >-
    Two literatures meet at this node and they do not say the same thing, so
    the entry states both rather than picking the tidier one.

    In non-neural cells, ZMYND11 couples the chromatin mark it reads directly to
    pre-mRNA processing: it associates with U5 snRNP spliceosome components and
    promotes intron retention by physically antagonising EFTUD2, and that
    regulation depends on its binding to H3K36me3-decorated chromatin. That is a
    direct, chromatin-dependent splicing role.

    In human cortical cells it appears not to work that way. The corticogenesis
    study found that ZMYND11 did not largely regulate splicing directly - few
    differentially spliced events overlapped its chromatin binding - and
    attributes the splicing phenotype instead to increased RBFOX2 expression in
    the mutant, making the effect indirect. The disease-relevant output is a
    brain-specific RNA isoform switch, and it is partially rescuable by
    enhancing ZMYND11 function.

    The incoming edge is graded INDIRECT_KNOWN_INTERMEDIATES to follow the
    cortical evidence, since that is the tissue this disease is about.
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:25263594
    reference_title: "BS69/ZMYND11 reads and connects histone H3.3 lysine 36 trimethylation-decorated chromatin to regulated pre-mRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical and genetic experiments demonstrate that BS69 promotes IR by
      antagonizing EFTUD2 through physical interactions.
    explanation: >-
      Identifies the molecular route from ZMYND11 to splicing: physical
      antagonism of the U5 snRNP component EFTUD2, regulating intron retention.
  - reference: PMID:25263594
    reference_title: "BS69/ZMYND11 reads and connects histone H3.3 lysine 36 trimethylation-decorated chromatin to regulated pre-mRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further show that regulation of IR by BS69 also depends on its binding
      to H3K36me3-decorated chromatin.
    explanation: >-
      Establishes that the splicing function is dependent on the chromatin-reader
      function, which is why this node is placed downstream of reader loss.
  - reference: PMID:41068108
    reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition to its role on chromatin, ZMYND11 regulates a brain-specific
      RNA isoform switch involving the splicing regulator RBFOX2.
    explanation: >-
      Establishes the RBFOX2-dependent brain splicing programme as a ZMYND11
      output.
  downstream:
  - target: Impaired cortical progenitor and neuron production
    description: >-
      Splicing dysregulation contributes, alongside transcriptional
      de-repression, to defective corticogenesis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41068108
      reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Similar defects are observed in other chromatin-related ASD risk genes,
        some of which are partially rescued by enhancing ZMYND11 function.
      explanation: >-
        Supports splicing dysregulation as part of the corticogenesis phenotype.
        Graded PARTIAL because the source establishes co-occurrence and partial
        rescue rather than isolating the splicing arm's independent contribution
        to progenitor loss.

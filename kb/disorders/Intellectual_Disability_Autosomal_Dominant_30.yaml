discussions:
- discussion_id: zmynd11_missense_not_haploinsufficiency
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#ZMYND11
  - pathophysiology#Loss of ZMYND11 H3.3K36me3 reader function
  prompt: >-
    Do ZMYND11 missense variants such as p.Arg600Trp act through simple
    haploinsufficiency, or through a distinct mechanism such as a
    dominant-negative effect on the reader complex?
  rationale: >-
    The pathophysiology node here is written as loss of reader dosage, which is
    well supported for truncating variants and whole-gene deletions. It may be
    the wrong model for missense variants. Aggregate comparison of 13 reported
    missense variants found higher rates of strabismus, hypotonia and severe
    intellectual disability than in loss-of-function carriers, and p.Arg600Trp
    carriers share microcephaly, broad nasal alae, short stature and
    cryptorchidism that are not emphasised in loss-of-function cases. A
    phenotype that is more severe and partly different in a missense carrier is
    the classic signature of a mechanism other than reduced dosage. Resolving
    this would change how a missense result is counselled and would determine
    whether the entry needs two pathophysiology branches rather than one.
- discussion_id: zmynd11_corticogenesis_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired cortical progenitor and neuron production
  prompt: >-
    Does the reduced cortical progenitor and neuron production seen in
    ZMYND11-deficient human pluripotent stem cell cultures correspond to a
    measurable cortical deficit in patients?
  rationale: >-
    The entire cellular arm of this pathograph rests on one human pluripotent
    stem cell model. That model is human, which removes the usual species
    objection, but it is still an in vitro system: patients do not consistently
    show microcephaly, and structural brain imaging in ZMYND11 cases is
    described as non-specific rather than showing a reproducible cortical
    malformation. So the evidence that ZMYND11 loss impairs neuron production is
    strong in the dish and essentially unmeasured in people. Until the
    correspondence is established, the impaired-progenitor node should be read
    as a model-derived mechanism rather than a demonstrated patient finding.
  proposed_experiments:
  - experiment_id: zmynd11_cortical_morphometry
    name: Quantitative cortical morphometry in a ZMYND11 patient cohort
    description: >-
      Systematic quantitative MRI morphometry - cortical thickness, surface area
      and regional volumes - across a genotype-confirmed ZMYND11 cohort compared
      with matched controls, stratified by variant class.
    would_support:
    - pathophysiology#Impaired cortical progenitor and neuron production
    supporting_outcome:
    - >-
      Reduced cortical surface area or thickness in ZMYND11 carriers relative to
      matched controls, with a greater deficit in missense than
      loss-of-function carriers.
    would_refute:
    - pathophysiology#Impaired cortical progenitor and neuron production
    refuting_outcome:
    - >-
      Cortical morphometry indistinguishable from controls, which would place
      the disorder's mechanism in neuronal function rather than neuron
      production.
notes: >-
  Naming. The entry is filed under the MONDO label for MONDO:0014486. The
  literature increasingly calls this "ZMYND11-related neurodevelopmental
  disorder", which is carried as a synonym; the OMIM name MRD30 and ORPHA 178469
  refer to the same entity.

  Relationship to 10p15.3 microdeletion syndrome. These are not two diseases.
  ZMYND11 is the critical gene of the terminal 10p deletion, and intragenic
  ZMYND11 variants reproduce that phenotype, which is why the monogenic disorder
  was carved out. A deletion patient may have additional features from the other
  deleted genes, so the deletion syndrome is the broader phenotype and MRD30 is
  its ZMYND11-attributable core.

  Frequency grading. FrequencyEnum values here are graded from cohort
  descriptions rather than counted proportions, because the two largest series
  report features narratively. Where a proportion is given it is stated in the
  phenotype description; where it is not, the enum value is a reading of
  narrative language and should be treated accordingly.

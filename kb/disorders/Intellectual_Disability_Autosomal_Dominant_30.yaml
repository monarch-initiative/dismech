      label: Autosomal dominant inheritance
  description: >-
    Heterozygous ZMYND11 variants are causative and are mostly de novo. Both
    intragenic loss-of-function variants and whole-gene deletion within a
    10p15.3 microdeletion produce the phenotype, which is the dosage argument
    for haploinsufficiency as the usual mechanism.
  evidence:
  - reference: PMID:38397245
    reference_title: "Further Delineation of Clinical Phenotype of ZMYND11 Variants in Patients with Neurodevelopmental Dysmorphic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous pathogenic variants in the ZMYND11 gene have been
      subsequently identified as the causes of autosomal dominant intellectual
      developmental disorder-30 with speech delay and behavioural abnormalities
    explanation: >-
      Names the entity and establishes heterozygous ZMYND11 variants as its
      cause.
  - reference: PMID:34216016
    reference_title: "ZMYND11 variants are a novel cause of centrotemporal and generalised epilepsies with neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants were distributed across the gene and mostly de novo with no
      precise genotype-phenotype correlation.
    explanation: >-
      Establishes the predominantly de novo origin and the absence of a
      positional genotype-phenotype correlation.
  - reference: PMID:34818214
    reference_title: "Intragenic Deletion of the ZMYND11 Gene in 10p15.3 is Associated with Developmental Delay Phenotype: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our report contributes to expand the clinical and mutational spectrum of
      ZMYND11 and confirms haploinsufficiency as the underlying disease
      mechanism
    explanation: >-
      An intragenic deletion removing only the 5'UTR and first two exons produces
      the phenotype, which is the cleanest dosage argument for haploinsufficiency
      - it removes ZMYND11 alone without the neighbouring genes a larger 10p15.3
      deletion would take.
pathophysiology:
- name: Loss of ZMYND11 H3.3K36me3 reader function
  biological_scale: MOLECULAR
  description: >-
    ZMYND11 binds H3.3K36me3 over the bodies of actively transcribed genes and
    acts as an unconventional co-repressor, damping the elongation phase of RNA
    polymerase II. A heterozygous loss-of-function allele halves that reader
    dosage. The proposed normal role is suppression of cryptic transcription
    initiating from within gene bodies of highly expressed genes, so this is
    loss of a brake on transcriptional noise rather than loss of a dedicated
    activator or repressor of specific target genes.
  genes:
  - preferred_term: ZMYND11
    term:
      id: hgnc:16966
      label: ZMYND11
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:38397245
    reference_title: "Further Delineation of Clinical Phenotype of ZMYND11 Variants in Patients with Neurodevelopmental Dysmorphic Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZMYND11 encodes a zinc finger MYND domain-containing protein that acts as
      a transcriptional co-repressor to inhibit the elongation phase of RNA
      polymerase II via the recognition of histone modification of the
      transcribed regions.
    explanation: >-
      Directly states the reader and co-repressor function acting on
      transcriptional elongation.
  - reference: PMID:28933030
    reference_title: "Phenotype comparison confirms ZMYND11 as a critical gene for 10p15.3 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the ZMYND11 gene has important functions in epigenetic regulation as an
      unconventional transcription co-repressor of highly expressed genes,
      possibly acting in the repression of cryptic transcription from gene
      bodies
    explanation: >-
      Supports the cryptic-transcription suppression model. The source itself
      hedges with "possibly", which is why this node is described as a proposed
      normal role rather than an established one.
  - reference: PMID:39464123
    reference_title: "ZMYND11 Functions in Bimodal Regulation of Latent Genes and Brain-like Splicing to Safeguard Corticogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      encodes a histone-reader that recognizes sites of transcriptional
      elongation and acts as a co-repressor
    explanation: >-
      Independent confirmation of the reader and co-repressor function in a
      human stem cell system.
  - reference: PMID:25263594
    reference_title: "BS69/ZMYND11 reads and connects histone H3.3 lysine 36 trimethylation-decorated chromatin to regulated pre-mRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that BS69 selectively recognizes histone variant H3.3 lysine 36
      trimethylation
    explanation: >-
      The founding biochemical study identifying the specific mark ZMYND11 reads.
      It establishes selectivity for the H3.3 variant, which is what makes this a
      variant-specific reader rather than a generic H3K36me3 binder.
  downstream:
  - target: De-repression of latent developmental transcriptional programmes
    description: >-
      Losing the elongation brake allows normally silent developmental pathways
      to be expressed in cortical progenitors.
    causal_link_type: DIRECT
    evidence:

    evidence:
    - reference: PMID:41068108
      reference_title: "ZMYND11 functions in bimodal regulation of latent genes and brain-like splicing to safeguard corticogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we show that mutations in ZMYND11, a newly implicated risk gene,

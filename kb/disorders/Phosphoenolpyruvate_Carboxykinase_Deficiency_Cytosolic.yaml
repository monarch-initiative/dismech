    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypoglycemic episodes manifested predominantly in the morning.
    explanation: >-
      Describes the fasting (overnight) timing of the hypoglycemic episodes.
  downstream:
  - target: Recurrent hypoglycemia
    causal_link_type: DIRECT
  - target: Neonatal hypoglycemia
    causal_link_type: DIRECT
  - target: Neuroglycopenic Brain Injury
    causal_link_type: DIRECT
    description: >-
      Severe or prolonged hypoglycemia deprives the brain of its principal fuel.
- name: Neuroglycopenic Brain Injury
  biological_scale: TISSUE
  description: >-
    Insufficient cerebral glucose, compounded by inadequate ketone body
    production, produces acute neuronal energy failure. In severe cases this
    manifests as hypoglycemic seizures, acute encephalopathy, cerebral edema,
    neuroregression, and death.
  evidence:
  - reference: PMID:33445193
    reference_title: "Cytosolic Phosphoenolpyruvate Carboxykinase Deficiency: Cause of Hypoglycemia-Induced Seizure and Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a complicated course with difficult to treat symptomatic seizures,
      the child died on the 5th day of admission due to progressive cerebral
      edema.
    explanation: >-
      Documents fatal hypoglycemia-driven cerebral edema and seizures, the severe
      end of the neuroglycopenic injury.
  downstream:
  - target: Hypoglycemic seizures
    causal_link_type: DIRECT
  - target: Acute encephalopathy
    causal_link_type: DIRECT
  - target: Cerebral edema
    causal_link_type: DIRECT
  - target: Global developmental delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated encephalopathic crises cause neuroregression, leaving lasting global developmental delay.
- name: Impaired Cataplerosis of Oxaloacetate
  biological_scale: MOLECULAR
  description: >-
    PEPCK-C is the principal cataplerotic exit removing oxaloacetate from the
    tricarboxylic acid cycle. When the enzyme is absent, carbon cannot leave the
    cycle for gluconeogenesis and tricarboxylic acid cycle intermediates back up.
  biological_processes:
  - preferred_term: oxaloacetate metabolic process
    term:
      id: GO:0006107
      label: oxaloacetate metabolic process
    modifier: ABNORMAL
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28216384
    reference_title: >-
      Novel homozygous PCK1 mutation causing cytosolic phosphoenolpyruvate
      carboxykinase deficiency presenting as childhood hypoglycemia, an abnormal
      pattern of urine metabolites and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transient elevation of alanine transaminase, lactate and tricarboxylic acid
      cycle intermediates, especially fumarate, were noticed in urine organic acid
      analysis.
    explanation: >-
      Accumulation and urinary spill of tricarboxylic acid cycle intermediates is
      the direct biochemical signature of failed cataplerosis.
  downstream:
  - target: TCA Cycle Intermediate Accumulation
    causal_link_type: DIRECT
- name: TCA Cycle Intermediate Accumulation
  biological_scale: CELLULAR
  description: >-
    Tricarboxylic acid cycle intermediates accumulate behind the cataplerotic
    block and spill into urine (notably fumarate and alpha-ketoglutarate). The
    accompanying nitrogen load is buffered as glutamine, producing
    hyperglutaminemia, which has been proposed as a newborn-screening marker.
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35868242
    reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical biochemical pattern was hypoglycemia triggered by catabolic
      situations, elevated urinary concentrations of tricarboxylic acid cycle
      metabolites, mildly elevated alanine and aspartate aminotransferase and
      elevated lactate concentrations in serum.
    explanation: >-
      Confirms elevated urinary tricarboxylic acid cycle metabolites as the
      characteristic pattern.
  downstream:
  - target: Elevated urine fumaric acid
    causal_link_type: DIRECT
  - target: Hyperglutaminemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Nitrogen that cannot be disposed of through gluconeogenic amino acid utilization is buffered as glutamine.
    evidence:
    - reference: PMID:35868242
      reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Plasma glutamine concentrations were elevated in some patients and may be
        a suitable marker for newborn screening.
      explanation: >-
        Reports hyperglutaminemia as a consequence of the metabolic block,
        supporting the edge.

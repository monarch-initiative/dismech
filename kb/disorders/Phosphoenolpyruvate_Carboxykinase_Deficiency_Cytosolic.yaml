pathophysiology:
- name: PCK1 Cytosolic PEPCK Deficiency
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic loss-of-function PCK1 variants deplete cytosolic phosphoenolpyruvate
    carboxykinase (PEPCK-C) activity. The enzyme catalyzes the GTP-dependent
    decarboxylation and phosphorylation of oxaloacetate to phosphoenolpyruvate,
    the first committed and rate-limiting cytosolic step of gluconeogenesis.
    Expression of a mutant allele in COS-1 cells produced an enzyme incapable of
    normal function, confirming the variants as loss-of-function.
  genes:
  - preferred_term: PCK1
    term:
      id: hgnc:8724
      label: PCK1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: phosphoenolpyruvate carboxykinase (GTP) activity
    term:
      id: GO:0004613
      label: phosphoenolpyruvate carboxykinase (GTP) activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:28216384
    reference_title: >-
      Novel homozygous PCK1 mutation causing cytosolic phosphoenolpyruvate
      carboxykinase deficiency presenting as childhood hypoglycemia, an abnormal
      pattern of urine metabolites and liver dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The COS-1 transfected cells showed the mutant gene to be incapable of
      producing a normally functioning cytosolic phosphoenolpyruvate carboxykinase
      (PEPCK) enzyme.
    explanation: >-
      Functional expression establishes that the PCK1 variant abolishes enzyme
      function, supporting the DECREASED modifier on PEPCK activity.
  downstream:
  - target: Failure of Hepatic Gluconeogenesis
    causal_link_type: DIRECT
    description: >-
      Loss of the oxaloacetate-to-phosphoenolpyruvate step directly interrupts
      flux through gluconeogenesis.
    evidence:
    - reference: PMID:35868242
      reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        cause PEPCK-C deficiency, a rare disorder of gluconeogenesis presenting
        with hypoglycemia, lactic acidosis, and hepatopathy
      explanation: >-
        Identifies the disorder as a defect of gluconeogenesis caused by the
        enzyme deficiency.
  - target: Impaired Cataplerosis of Oxaloacetate
    causal_link_type: DIRECT
    description: >-
      Because PEPCK-C is the route by which oxaloacetate exits the
      tricarboxylic acid cycle for glucose synthesis, its loss blocks this
      cataplerotic drain.
- name: Failure of Hepatic Gluconeogenesis
  biological_scale: CELLULAR
  description: >-
    With PEPCK-C absent, the hepatocyte cannot convert lactate, glycerol, and
    gluconeogenic amino acids into glucose. Glycogenolysis is preserved, so
    glucose homeostasis is maintained in the fed and early-fasted state; the
    defect becomes clinically apparent only once glycogen is exhausted and the
    liver must rely on de novo glucose production.
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:27785616
    reference_title: >-
      PEPCK-C reexpression in the liver counters neonatal hypoglycemia in Pck1
      (del/del) mice, unmasking role in non-gluconeogenic tissues.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This maneuver was sufficient to partially rescue hypoglycemia and allow the
      pups to survive and identifies the liver as a critical organ, and
      hypoglycemia as the critical pathomechanism, leading to early postnatal
      death in the whole-body PEPCK-C knockout mice.
    explanation: >-
      Liver-specific reexpression rescuing hypoglycemia identifies hepatic
      gluconeogenesis as the critical function lost.
  downstream:
  - target: Fasting Hypoglycemia
    causal_link_type: DIRECT
    description: >-
      Once glycogen is depleted, the blocked gluconeogenic pathway cannot sustain
      blood glucose during fasting.
    evidence:
    - reference: PMID:35868242
      reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The typical biochemical pattern was hypoglycemia triggered by catabolic
        situations
      explanation: >-
        Hypoglycemia precipitated by catabolic (fasting) states is the direct
        clinical consequence of the gluconeogenic block.
  - target: Lactate Accumulation
    causal_link_type: DIRECT
  - target: Impaired Fasting Ketogenesis
    causal_link_type: DIRECT
  - target: Hepatocellular Metabolic Stress
    causal_link_type: DIRECT
  - target: Chronic Energy Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced endogenous glucose output lowers fasting tolerance, so adequate growth depends on frequent exogenous caloric intake.
- name: Fasting Hypoglycemia
  biological_scale: ORGANISM
  description: >-
    Hypoglycemia develops when gluconeogenic demand exceeds glycogenolytic
    supply, typically overnight or during intercurrent illness. Episodes most
    often present in the morning and are precipitated by catabolic stress;
    neonatal onset also occurs.
  biological_processes:

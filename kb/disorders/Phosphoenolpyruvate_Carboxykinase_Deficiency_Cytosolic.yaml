genetic:
- name: PCK1
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PCK1
    term:
      id: hgnc:8724
      label: PCK1
  notes: >-
    Cytosolic PEPCK deficiency is caused by biallelic pathogenic variants in
    PCK1. The recurrent missense variant c.925G>A (p.Gly309Arg) is a Finnish
    founder allele and the predominant reported genotype; missense, frameshift,
    splice-site, and nonsense variants are all described. In silico modeling of
    missense variants suggests altered manganese- and substrate-binding.
  variants:
  - name: c.925G>A (p.Gly309Arg)
    description: >-
      Recurrent missense founder variant, endemic in the Finnish population and
      the predominant reported genotype; also seen in the compound-heterozygous
      state.
    evidence:
    - reference: PMID:35868242
      reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        alleles with the recurrent variant c.925G > A; p.(Gly309Arg) are
        predominant and appear to be endemic in the Finnish population
      explanation: >-
        Identifies the recurrent Finnish founder variant as the predominant
        allele.
  - name: c.978delC
    description: >-
      Novel homozygous single-base (C) frameshift deletion, the first frameshift
      variant reported in PCK1; presented as neonatal transient hypoglycemia and
      acute liver failure.
    evidence:
    - reference: PMID:40092582
      reference_title: Cytosolic PEPCK deficiency caused by a novel homozygous frame-shift variant presenting as resolved hypoglycemia and acute liver failure at birth.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The deletion of C at position 978 (chr20:56139240, hg19) results in
        frameshift of the open reading frame culminating in termination 15
        amino-acids downstream.
      explanation: >-
        Describes the homozygous c.978 single-base deletion and its frameshift
        consequence.
  evidence:
  - reference: PMID:32908218
    reference_title: Novel missense variants in PCK1 gene cause cytosolic PEPCK deficiency with growth failure from inadequate caloric intake.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is caused by biallelic pathogenic variants in the PCK1 gene.
    explanation: >-
      Directly states biallelic PCK1 variants as the cause.
  - reference: PMID:28216384
    reference_title: >-
      Novel homozygous PCK1 mutation causing cytosolic phosphoenolpyruvate
      carboxykinase deficiency presenting as childhood hypoglycemia, an abnormal
      pattern of urine metabolites and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel homozygous PCK1 c.925G>A (p.G309R) mutation was detected in all
      affected individuals.
    explanation: >-
      Original molecular identification of the recurrent homozygous PCK1 variant.

environmental:
- name: Fasting and catabolic stress
  description: >-
    Catabolic states precipitate the metabolic crises of PEPCK-C deficiency by
    raising demand for endogenous glucose output. Identified triggers include
    infections, fasting or poor intake, heavy exercise, alcohol, and
    breastfeeding.
  evidence:
  - reference: PMID:34622459
    reference_title: "Cytosolic phosphoenolpyruvate carboxykinase deficiency: Expanding the clinical phenotype and novel laboratory findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infections, fasting or poor food intake, heavy exercise, alcohol
      consumption, and breastfeeding were identified as triggering factors.
    explanation: >-
      Establishes that catabolic/fasting exposures are the documented triggers of
      metabolic crises in cytosolic PEPCK deficiency.
  influences_mechanisms:
  - target: Fasting Hypoglycemia
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Increased gluconeogenic demand during catabolic stress converts the
      compensated state into symptomatic hypoglycemia.
    evidence:
    - reference: PMID:34622459
      reference_title: "Cytosolic phosphoenolpyruvate carboxykinase deficiency: Expanding the clinical phenotype and novel laboratory findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Infections, fasting or poor food intake, heavy exercise, alcohol
        consumption, and breastfeeding were identified as triggering factors.
      explanation: >-
        Lists the catabolic exposures that trigger hypoglycemic episodes.

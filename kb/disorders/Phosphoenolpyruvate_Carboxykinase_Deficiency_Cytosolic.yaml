mechanistic_hypotheses:
- hypothesis_group_id: pepckc_genotype_phenotype_environment
  hypothesis_label: Environment rather than genotype determines PEPCK-C deficiency severity
  status: EMERGING
  description: >-
    The clinical spectrum of PEPCK-C deficiency ranges from asymptomatic to fatal,
    and systematic review found no clear genotype-phenotype correlation. The
    leading interpretation is that environmental (catabolic) exposure, rather than
    the specific PCK1 genotype, is the main determinant of phenotype.
  evidence:
  - reference: PMID:35868242
    reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Environmental factors appear to be the main determinant for the phenotype in
      patients with biallelic variants in PCK1.
    explanation: >-
      States the environment-over-genotype interpretation directly.
discussions:
- discussion_id: pepckc_mouse_lethality_vs_human_viability
  prompt: >-
    Does the neonatal-lethal whole-body Pck1 knockout mouse model the viable,
    episodic, catabolism-triggered human disease, or only its most severe
    extreme?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Hepatic Gluconeogenesis
  rationale: >-
    Whole-body PEPCK-C knockout mice die shortly after birth from profound
    hypoglycemia, whereas most humans with biallelic PCK1 variants survive and may
    be asymptomatic between catabolic stressors. The mouse establishes that
    hepatic gluconeogenesis and hypoglycemia are the critical pathomechanism, but
    its lethality does not reproduce the human disease's variable, often mild,
    stress-dependent course, so the translational validity of the model for the
    human phenotypic spectrum is the open question.
  proposed_experiments:
  - experiment_id: pepckc_hypomorphic_mouse
    name: Hypomorphic or liver-conditional Pck1 mouse recapitulating partial deficiency
    description: >-
      Generate mice with partial (hypomorphic) or liver-conditional PEPCK-C loss
      to model the residual activity seen in human missense genotypes, and test
      whether fasting and intercurrent catabolic challenge reproduce the episodic
      human phenotype.
    decision_criterion: >-
      A viable model that decompensates only on catabolic challenge would support
      using the mouse for the human disease; persistent lethality or absence of a
      stress-dependent phenotype would bound its translational use.

differential_diagnoses:
- name: Mitochondrial PEPCK (PCK2) deficiency
  description: >-
    PCK2 encodes the mitochondrial isoform of phosphoenolpyruvate carboxykinase
    (PEPCK-M), a separate entity from the cytosolic (PCK1) form curated here; the
    two share the Orphanet umbrella concept (ORPHA:2880) but are genetically and
    biochemically distinct.
  evidence:
  - reference: PMID:35868242
    reference_title: Genotypic and phenotypic spectrum of cytosolic phosphoenolpyruvate carboxykinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic biallelic variants in PCK1 coding for the cytosolic
      phosphoenolpyruvate carboxykinase (PEPCK-C) cause PEPCK-C deficiency
    explanation: >-
      Establishes that the cytosolic form is specifically a PCK1 disorder,
      distinguishing it from the mitochondrial PCK2 form.
- name: Other gluconeogenesis and fasting disorders
  description: >-
    Because hypoglycemia with lactic acidosis and hepatopathy is shared with
    other gluconeogenesis defects (fructose-1,6-bisphosphatase deficiency),
    glycogen storage diseases, and mitochondrial disorders, these are routinely
    considered first.
  evidence:
  - reference: PMID:28216384
    reference_title: >-
      Novel homozygous PCK1 mutation causing cytosolic phosphoenolpyruvate
      carboxykinase deficiency presenting as childhood hypoglycemia, an abnormal
      pattern of urine metabolites and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytosolic PEPCK deficiency should be considered in the differential
      diagnosis of children presenting with hypoglycemia, hepatic dysfunction and
      elevated tricarboxylic acid intermediates in urinary organic acid analysis.
    explanation: >-
      Situates the disorder within the differential diagnosis of childhood
      hypoglycemia with hepatic dysfunction.
animal_models:
- name: Pck1 del/del mouse (whole-body PEPCK-C knockout)
  species: Mouse
  genotype: Pck1 del/del (whole-body cytosolic PEPCK knockout)
  publication: PMID:27785616
  description: >-
    Whole-body cytosolic PEPCK knockout mice die early after birth with profound
    hypoglycemia. Early postnatal hepatic reexpression partially rescues
    hypoglycemia and allows survival, identifying the liver as the critical organ
    and hypoglycemia as the critical pathomechanism.
  modeled_mechanisms:
  - target: Failure of Hepatic Gluconeogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Hepatic PEPCK-C loss produces the hypoglycemia of gluconeogenic failure,
      and liver-specific reexpression rescues it.
    limitations: >-
      The whole-body knockout is neonatally lethal with profound hypoglycemia,
      unlike the viable, episodic, catabolism-triggered human disease, so the
      model reproduces the severe hepatic-gluconeogenesis phenotype but not the
      human clinical spectrum.
    evidence:
    - reference: PMID:27785616
      reference_title: >-
        PEPCK-C reexpression in the liver counters neonatal hypoglycemia in Pck1
        (del/del) mice, unmasking role in non-gluconeogenic tissues.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This maneuver was sufficient to partially rescue hypoglycemia and allow
        the pups to survive and identifies the liver as a critical organ, and
        hypoglycemia as the critical pathomechanism, leading to early postnatal
        death in the whole-body PEPCK-C knockout mice.
      explanation: >-
        Liver reexpression rescuing hypoglycemia supports the model as informative
        for hepatic gluconeogenic failure.
  evidence:
  - reference: PMID:27785616
    reference_title: >-
      PEPCK-C reexpression in the liver counters neonatal hypoglycemia in Pck1
      (del/del) mice, unmasking role in non-gluconeogenic tissues.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whole body cytosolic phosphoenolpyruvate carboxykinase knockout (PEPCK-C KO)
      mice die early after birth with profound hypoglycemia therefore masking the
      role of PEPCK-C in adult, non-gluconeogenic tissues where it is expressed.
    explanation: >-
      Establishes the whole-body knockout phenotype of neonatal lethal
      hypoglycemia.
notes: >-
  Lump/split: this entry is the cytosolic (PCK1) form only, matching MONDO:0009866
  and OMIM:261680. The mitochondrial form (PCK2, encoding mitochondrial PEPCK-M;
  OMIM:261650) is a distinct disease and is not covered here; Orphanet lumps both
  under ORPHA:2880, which cross-references OMIM:261680 as broader, and the
  cytosolic-specific ORPHA:79316 was obsoleted and redirected to ORPHA:2880.
  Molecular confirmation of isolated cytosolic PEPCK deficiency is recent — first
  reported with biallelic PCK1 variants in 2014 and functionally established in
  2017 — and roughly 32 individuals were in the literature at the 2022 systematic
  review; the earlier pre-molecular history of "PEPCK deficiency" is not relied on
  here. The entry conforms conceptually to a hepatic gluconeogenesis failure
  mechanism (a module being created in parallel); no conforms_to edge is added
  because that module file is not present on this branch, and wiring it is left to
  a follow-up.

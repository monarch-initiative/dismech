name: Phosphoenolpyruvate Carboxykinase Deficiency, Cytosolic
creation_date: "2026-10-16T00:00:00Z"
category: Metabolic Disorder
synonyms:
- PCKDC
- PEPCK-C deficiency
- cytosolic PEPCK deficiency
- PEPCK 1 deficiency
- phosphoenolpyruvate carboxykinase-1 (PCK1) deficiency
- PEP carboxykinase deficiency
description: >-
  Cytosolic phosphoenolpyruvate carboxykinase (PEPCK-C) deficiency is a rare
  autosomal recessive inborn error of gluconeogenesis caused by biallelic
  pathogenic variants in PCK1. PEPCK-C is the rate-limiting cytosolic enzyme that
  converts oxaloacetate to phosphoenolpyruvate, the step that commits
  tricarboxylic-acid-cycle carbon to glucose synthesis, so its loss impairs
  hepatic (and renal) gluconeogenesis. Affected individuals are typically well
  between episodes but decompensate during catabolic stress, presenting with
  hypoglycemia, hyperlactataemia, and hepatopathy, together with a recognizable
  urine organic acid pattern of elevated tricarboxylic acid cycle intermediates
  (especially fumarate) and, during hypoglycemia, inadequate ketone production.
  The clinical spectrum is broad, ranging from asymptomatic individuals to
  recurrent hypoglycemic seizures, encephalopathy, liver failure, and death.
  Molecular confirmation of isolated cytosolic PEPCK deficiency is recent; a
  Finnish founder allele (c.925G>A, p.Gly309Arg) accounts for most reported
  cases, and the disorder is treatable by avoidance of fasting and prompt
  glucose during illness.
parents:
- hereditary disease
- metabolic disorder
- Inborn Error of Carbohydrate Metabolism

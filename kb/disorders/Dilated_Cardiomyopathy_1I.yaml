- name: Intermediate Filament Network Disorganization and Desmin Aggregation
  biological_scale: CELLULAR
  role: effector
  description: >-
    The desmin network normally interconnects Z-discs and links them to the
    sarcolemma, mitochondria and nucleus. When desmin is absent or misassembled the
    network is lost and, for the aggregating allele class, desmin-positive deposits
    accumulate in the sarcoplasm - the histological hallmark of desminopathy.
    Ultrastructurally this manifests as subsarcolemmal granular material, expanded
    Z-band aggregation, distortion of myofilaments and focal Z-band streaming: the
    contractile apparatus loses its mechanical registration. This is the point at
    which CMD1I and myofibrillar myopathy share a lesion; they differ in which
    tissue bears the burden.

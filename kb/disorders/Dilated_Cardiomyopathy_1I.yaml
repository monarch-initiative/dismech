notes: >-
  CMD1I is the DES member of the numbered dilated cardiomyopathy series and carries
  ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  Scope relative to the existing Myofibrillar Myopathy entry, which also covers DES.
  Desminopathy is a spectrum running from cardiac-predominant to
  skeletal-predominant disease, and the two entries take different poles of it:
  CMD1I is the familial isolated dilated cardiomyopathy entity (MONDO:0011482),
  curated around loss of the cardiomyocyte intermediate filament network, while
  Myofibrillar Myopathy is the morphologically defined protein-aggregation myopathy
  in which DES is one of many Z-disc and quality-control genes. They meet at the
  aggregation/Z-disc-disorganization node, which is curated here as the shared
  lesion rather than duplicated as a separate mechanism.

  Two allele classes are curated as separate inheritance blocks because they act
  differently: dominant missense variants incorporate into the filament and disrupt
  assembly, while recessive truncating variants abolish desmin entirely (evidenced
  here by a homozygous p.Arg150Ter case with complete absence of desmin protein and
  unaffected heterozygous parents).

  Evidence-scope caveat: the mechanism and phenotype nodes rest substantially on a
  single well-characterized desmin-null case report plus the general desminopathy
  framing from the same source. Broader cohort evidence for the dominant missense
  arm, and direct evidence for the conduction-disease association, are the natural
  augmentations; the conduction phenotype is accordingly marked as indirect support.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary DES cohort and pedigree literature
  cited throughout, principally PMID:34106405.

- name: Autosomal recessive (biallelic loss of function)
  description: >-
    A recessive form results from biallelic truncating DES alleles that abolish
    desmin entirely. In the reported consanguineous case a homozygous nonsense
    variant (p.Arg150Ter) produced complete absence of desmin protein, with dilated
    cardiomyopathy alongside respiratory insufficiency and distal weakness; the
    heterozygous parents were carriers.
  inheritance_term:

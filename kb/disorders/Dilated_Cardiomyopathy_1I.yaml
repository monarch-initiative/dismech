pathophysiology:
- name: DES Variant in the Desmin Intermediate Filament
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMD1I is a variant in DES, encoding desmin - the
    muscle-specific intermediate filament protein that regulates various cellular
    functions in muscle cells and forms the cytoskeletal network of the myocyte.
    Two allele classes operate: dominant missense variants that are incorporated
    into the filament and disrupt its assembly, and recessive truncating variants
    that abolish the protein outright, as in the reported homozygous p.Arg150Ter
    case where immunostaining showed complete lack of desmin expression. Unlike the
    sarcomeric members of this series, the affected protein is not part of the
    contractile machinery but of the scaffold that holds it in register.

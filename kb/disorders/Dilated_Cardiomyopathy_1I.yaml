name: Dilated Cardiomyopathy 1I
creation_date: "2026-08-23T00:00:00Z"
synonyms:
- CMD1I
- DES familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1I
- cardiomyopathy, dilated, 1I
- desmin-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1I (CMD1I) is the DES-related form of familial isolated
  dilated cardiomyopathy. DES encodes desmin, the muscle-specific type III
  intermediate filament protein that forms the cytoskeletal network linking
  successive Z-discs to each other, to the sarcolemma and costameres, to
  mitochondria and to the nuclear envelope - the scaffold that keeps the
  contractile apparatus mechanically registered and transmits force laterally
  across the myocyte. CMD1I is therefore a cytoskeletal rather than a sarcomeric
  disease: the lesion is loss or disorganization of the filament network that holds
  the sarcomeres in place, not a defect of the motor or its regulation. Desmin
  disease is a spectrum - desminopathies are clinically heterogeneous, manifesting
  with myopathy and/or cardiomyopathy and with intra-sarcoplasmic desmin-positive
  deposits - and CMD1I is the cardiac-predominant pole of that spectrum, with the
  skeletal-muscle-predominant, aggregate-centred pole curated separately in this
  knowledge base as myofibrillar myopathy. Both dominant (typically missense,
  acting on filament assembly) and recessive (truncating, abolishing desmin)
  genotypes occur. ClinGen classifies the DES-dilated cardiomyopathy relationship
  as Definitive with autosomal dominant inheritance.
category: Genetic
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: Familial dilated cardiomyopathy presenting with ventricular dilation, systolic dysfunction, and heart failure.
    evidence:
    - reference: PMID:34106405
      reference_title: "A Novel L1 Linker Mutation in DES Resulted in Total Absence of Protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report a 13-year-old girl, born of second-degree consanguineous parents, with normal developmental milestones, who presented with dilated cardiomyopathy, respiratory insufficiency and predominant distal upper limb weakness.
      explanation: Documents dilated cardiomyopathy as the core cardiovascular presentation of DES-related disease.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Mendelian dilated cardiomyopathy caused by dominant or recessive pathogenic variants in DES.
    evidence:
    - reference: PMID:34106405
      reference_title: "A Novel L1 Linker Mutation in DES Resulted in Total Absence of Protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Next-generation sequencing revealed a novel homozygous nonsense mutation c.448C>T, p.R150X in the patient, while the parents were heterozygous carriers.
      explanation: Establishes the genetic etiology of DES-related dilated cardiomyopathy.
  mechanistic_category:
  - classification_value: intermediate filament disease
    notes: Caused by loss or misassembly of desmin, the muscle-specific type III intermediate filament protein.
    evidence:
    - reference: PMID:34106405
      reference_title: "A Novel L1 Linker Mutation in DES Resulted in Total Absence of Protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Desmin is a crucial intermediate filament protein regulating various cellular functions in muscle cells.
      explanation: Directly identifies desmin as the muscle intermediate filament protein disrupted in this disorder.

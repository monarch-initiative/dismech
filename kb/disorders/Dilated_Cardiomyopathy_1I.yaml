    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They have either an autosomal dominant (AD) or recessive (AR) pattern of
      inheritance.
    explanation: >-
      Documents that desminopathies segregate in both dominant and recessive
      patterns, the basis for curating two inheritance modes on this entity.
- name: Autosomal recessive (biallelic loss of function)
  description: >-
    A recessive form results from biallelic truncating DES alleles that abolish
    desmin entirely. In the reported consanguineous case a homozygous nonsense
    variant (p.Arg150Ter) produced complete absence of desmin protein, with dilated
    cardiomyopathy alongside respiratory insufficiency and distal weakness; the
    heterozygous parents were carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34106405
    reference_title: "A Novel L1 Linker Mutation in DES Resulted in Total Absence of Protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing revealed a novel homozygous nonsense mutation
      c.448C>T, p.R150X in the patient, while the parents were heterozygous
      carriers.
    explanation: >-
      Documents the biallelic (recessive) genotype with unaffected heterozygous
      parents in a consanguineous kindred.

animal_models:
- name: Tmem67 knockout mouse (Tmem67 tm1Dgen/H1)
  species: Mouse
  genotype: Tmem67(tm1Dgen/H1) knockout
  publication: PMID:26035863
  description: >
    A Tmem67-null mouse whose multi-organ developmental abnormalities closely resemble those
    of Wnt5a and Ror2 knockouts, which is the observation that identified meckelin as a
    Wnt5a-ROR2 axis component. It is the source of essentially the whole molecular account in
    this entry, and it models severe TMEM67 ciliopathy rather than RHYNS.
  modeled_mechanisms:
  - target: Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes the Wnt5a-TMEM67-ROR2 axis: meckelin binds Wnt5a, is required for ROR2
      phosphorylation, and colocalises with ROR2 at the transition zone.
    limitations: >-
      A null allele, whereas the RHYNS genotype is a truncating plus mis-splicing combination
      inferred to be hypomorphic. The signalling claim is about the gene rather than about these
      alleles.
    evidence:
    - reference: PMID:26035863
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study we describe multi-organ developmental abnormalities in the Tmem67(tm1Dgen/H1) knockout mouse that closely resemble those seen in Wnt5a and Ror2 knockout mice."
      explanation: >-
        The phenotypic convergence with Wnt5a and Ror2 nulls is what makes this model informative
        for the signalling node.
  - target: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces basal body and kinocilium positioning defects and failed Wnt5a-stimulated
      epithelial branching.
    limitations: >-
      The organs affected are lung, heart, axial skeleton, limb and cochlea. The mouse has no
      retinitis pigmentosa, no hypopituitarism and no nephronophthisis, so it does not model the
      RHYNS phenotype.
    readouts:
    - name: Basal body and kinocilium coupling to the hair bundle
      target: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
      direction: ALTERED
      interpretation: Structural correlate of the basal body migration defect on this node.
      evidence:
      - reference: PMID:26035863
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The basal body/kinocilium complex was often uncoupled from the hair bundle, suggesting aberrant basal body migration, although planar cell polarity and apical planar asymmetry in the organ of Corti were normal."
        explanation: >-
          Reports the measurement and, by the polarity control, what it is not.
    - name: Wnt5a-stimulated epithelial branching in cultured lung
      target: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
      direction: ABOLISHED
      interpretation: Functional readout of the morphogenetic failure downstream of the signalling defect.
      evidence:
      - reference: PMID:26035863
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cultured lungs of Tmem67 mutant mice failed to respond to stimulation of epithelial branching morphogenesis by Wnt5a."
        explanation: >-
          Reports the abolished branching response that grounds this readout.
  - target: Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Activating RhoA, downstream of the Wnt5a-TMEM67-ROR2 axis, rescued the pulmonary
      hypoplasia phenotypes including loss of epithelial branching and cell polarity. This is
      the causal test of the signalling model and the only intervention reported to reverse any
      TMEM67 phenotype.
    limitations: >-
      Rescue is of the pulmonary phenotype in a mouse null, not of any RHYNS feature, and there
      is no evidence bearing on whether a RhoA-directed intervention would affect retina,
      pituitary or kidney.
    evidence:
    - reference: PMID:26035863
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pulmonary hypoplasia phenotypes, including loss of correct epithelial branching morphogenesis and cell polarity, were rescued by stimulating the non-canonical Wnt pathway downstream of the Wnt5a-TMEM67-ROR2 axis by activating RhoA."
      explanation: >-
        Documents the rescue, which is what makes this a RESCUES link rather than a descriptive one.
  evidence:
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in TMEM67 (MKS3) cause a range of human ciliopathies, including Meckel-Gruber and Joubert syndromes."
    explanation: >-
      Establishes that the modelled gene is the human disease gene, which is the basis for
      treating this model as informative at all.
discussions:
- discussion_id: no_rhyns_model_exists
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Tmem67-null mouse bear on RHYNS syndrome, given that it has none of the four
    defining features and carries a null rather than a hypomorphic genotype?
  attaches_to:
  - pathophysiology#Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
  - pathophysiology#Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
  - animal_models#Mouse
  rationale: >
    Every mechanistic node in this entry above the genotype is sourced from the Tmem67-null
    mouse or from in vitro work with it. That mouse has pulmonary hypoplasia, ventricular
    septal defects, axial shortening, limb abnormalities and cochlear defects. RHYNS is
    retinitis pigmentosa, hypopituitarism, nephronophthisis and skeletal dysplasia. The only
    shared element is a skeletal phenotype, and the mouse's is axial and limb while the
    patients' is mild or acromelic. So the model supplies the gene's molecular function and
    supplies nothing about how that function produces this phenotype. Compounding it, the
    mouse is a null and the RHYNS genotype is inferred hypomorphic, which in an allelic series
    where the null equivalent is lethal is precisely the difference that matters. Recorded as
    HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the model evidence is strong on its
    own terms; what is open is its translation.
  proposed_experiments:
  - experiment_id: rhyns_allele_knockin_mouse
    name: Knock-in mouse carrying the RHYNS compound heterozygous genotype
    description: >
      Generate mice carrying the index family's alleles in trans - a Tmem67 nonsense allele
      equivalent to p.Arg208* over a knock-in of the exon 13 mis-splicing allele - and
      phenotype the retina, anterior pituitary and kidney specifically, against Tmem67-null and
      wild-type littermates.
    would_support:
    - pathophysiology#Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
    supporting_outcome:
    - >-
      Compound heterozygous mice are viable and develop retinal degeneration, reduced growth
      hormone secretion and tubulointerstitial renal disease, while nulls die early, showing the
      RHYNS phenotype is the hypomorphic expression of the same signalling lesion.
    would_refute:
    - pathophysiology#Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
    refuting_outcome:
    - >-
      Compound heterozygous mice show the mouse null organ phenotypes at reduced severity with
      no retinal, pituitary or renal involvement, which would mean the RHYNS organ selectivity is
      not explained by dose along this axis and requires a species or modifier account.
- discussion_id: shh_direction_inconsistent
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is Shh signalling increased or decreased when meckelin is lost?
  attaches_to:
  - pathophysiology#Loss of Shh Repression
  rationale: >
    The two mouse datasets point opposite ways. Wnt5a inhibits Shh in wild-type embryonic lung,
    so loss of the meckelin-dependent axis should de-repress Shh, and the authors state
    meckelin normally represses Shh. But in TMEM67-mutant mice on an MKS-like congenic
    background the neurological phenotype is associated with diminished Shh signalling
    alongside de-regulated canonical Wnt. Both are the same gene in the same species, differing
    in genetic background and in the organ examined, and neither study addresses the other. The
    node carries the de-repression direction with a REFUTE item for the contrary result rather
    than choosing, because for RHYNS specifically - where there is no tissue and no model -
    there is no basis to choose.
- discussion_id: pituitary_mechanism_absent
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of meckelin produce anterior pituitary hormone deficiency?
  attaches_to:
  - pathophysiology#Anterior Pituitary Hormone Deficiency
  rationale: >
    Hypopituitarism is the feature that distinguishes RHYNS within the TMEM67 allelic series,
    and it is the feature with no mechanistic account. No TMEM67 model reports a pituitary
    phenotype, and the Wnt5a-ROR2 and Shh work does not extend to pituitary development. Growth
    hormone deficiency does recur in ciliopathies with Joubert-related genes, which suggests a
    shared ciliary requirement in the anterior pituitary, but nothing in the sources curated
    here demonstrates one. The node deliberately asserts no mechanism.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four patients in the literature: the 1997 index case, an earlier Italian patient the index
    report treated as the same entity, and the two brothers reported in 2001. The 2018 report
    that identified TMEM67 studied the original family and describes RHYNS as a rare syndrome
    with a single reported familial case, so no larger series exists.
  evidence:
  - reference: PMID:29891882
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A rare syndrome was first described in 1997 in a 17-year-old male patient presenting with Retinitis pigmentosa, HYpopituitarism, Nephronophthisis and Skeletal dysplasia (RHYNS). In the single reported familial case, two brothers were affected, arguing for X-linked or recessive mode of inheritance."
    explanation: >-
      Establishes the reported case count and that only one familial case exists.
  - reference: PMID:11391657
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of RHYNS in two siblings supports an autosomal recessive mode of inheritance; however, since all four known cases were male, an X-linked mode of inheritance cannot be excluded."
    explanation: >-
      States that four cases were known as of 2001, the basis for this count.

name: RHYNS Syndrome
creation_date: "2026-09-03T16:10:00Z"
category: Mendelian
synonyms:
- retinitis pigmentosa, hypopituitarism, nephronophthisis, and mild skeletal dysplasia
- retinitis pigmentosa-hypopituitarism-nephronophthisis-skeletal dysplasia syndrome
description: >
  RHYNS syndrome is a TMEM67 ciliopathy, and it is worth being explicit that this was not
  known when the syndrome was named. The acronym was coined in 1997 from a single
  17-year-old boy with retinitis pigmentosa, hypopituitarism, nephronophthisis and mild
  skeletal dysplasia; two affected brothers were reported in 2001; the genetic basis stayed
  unknown for twenty-one years, until exome sequencing of the original family found
  compound heterozygous TMEM67 variants in 2018. Everything mechanistic in this entry is
  therefore inference from TMEM67 biology onto a four-patient clinical description, and the
  entry is built to make that visible rather than to smooth it over.

  TMEM67 encodes meckelin, a transmembrane protein of the ciliary transition zone. Its
  allelic series is one of the widest in the ciliopathies - the report identifying RHYNS
  describes it as extending to eight distinguishable clinical conditions, from early
  lethality in Meckel-Gruber syndrome to adults with isolated liver fibrosis - so RHYNS is
  the mild end of a spectrum rather than a separate lesion. That is the strongest argument
  for keeping it as its own entry: the four reported patients share a phenotype combination
  that is unique within the series, and it is the combination, not any single feature, that
  the diagnosis rests on.

  The molecular account comes from mouse work rather than from patients. Meckelin is a
  receptor for Wnt5a, required for phosphorylation of the non-canonical Wnt receptor ROR2,
  with which it colocalises at the transition zone, and it normally represses Shh
  signalling. Every element of that is Tmem67-knockout mouse or in vitro data. The mouse
  reproduces the developmental abnormalities of severe TMEM67 ciliopathies rather than the
  RHYNS phenotype, so a HUMAN_MODEL_MISMATCH discussion records the gap: no model carries
  RHYNS-type hypomorphic alleles, and none has retinitis pigmentosa or hypopituitarism.

  Two curation notes. Inheritance is autosomal recessive on the molecular evidence, but the
  2001 report could not exclude X-linkage because all four known patients were male, and
  that history is preserved because it explains why the syndrome sat in an ambiguous
  nosological position for so long. And the skeletal phenotype is described as "mild" in
  the index case and "acromelic" in the brothers, which are not the same claim; both are
  curated as reported.
disease_term:
  preferred_term: RHYNS syndrome
  term:
    id: MONDO:0011202
    label: RHYNS syndrome
parents:
- Ciliopathy
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Autosomal recessive, established molecularly by compound heterozygosity in the original
    family: a paternally inherited nonsense allele and a maternally inherited missense allele.
    Before the gene was known, recessive inheritance was inferred from two affected brothers,
    with the caveat that X-linkage could not be excluded because all four reported patients
    were male. The molecular finding resolves that in favour of autosomal recessive.
  evidence:
  - reference: PMID:29891882
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed a paternally inherited nonsense c.622A > T, p.(Arg208*) and a maternally inherited missense variant c.1289A > G, p.(Asp430Gly), which perturbs the correct splicing of exon 13."
    explanation: >-
      Biparental inheritance of two different TMEM67 alleles establishes autosomal recessive
      inheritance directly.
  - reference: PMID:11391657
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of RHYNS in two siblings supports an autosomal recessive mode of inheritance; however, since all four known cases were male, an X-linked mode of inheritance cannot be excluded."
    explanation: >-
      The pre-molecular segregation argument, with its own stated limitation. Graded INDIRECT
      because it infers the mode from sibship structure rather than from genotypes, and is
      curated to preserve why the mode was uncertain for seventeen years.
genetic:
- name: TMEM67
  gene_term:
    preferred_term: TMEM67
    term:
      id: hgnc:28396
      label: TMEM67
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    Biallelic TMEM67 variants, identified by whole-exome sequencing of the originally
    described family. TMEM67 encodes meckelin, a ciliary transition zone protein, and carries
    one of the widest allelic series in the ciliopathies; RHYNS was the eighth distinguishable
    clinical condition attributed to it. The RHYNS genotype in the index family pairs a
    truncating allele with a missense allele that acts through mis-splicing rather than
    through amino acid substitution alone, which is consistent with a hypomorphic combination
    at the mild end of the series.
  variants:
  - name: c.622A>T (p.Arg208*)
    description: >-
      Paternally inherited nonsense allele.
    clinical_significance: PATHOGENIC
  - name: c.1289A>G (p.Asp430Gly)
    description: >-
      Maternally inherited missense allele that perturbs correct splicing of exon 13, so its
      consequence is a splicing defect rather than the substitution itself.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:29891882
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we applied whole-exome sequencing in the originally described family with RHYNS to identify compound heterozygous variants in the ciliary gene TMEM67."
    explanation: >-
      Establishes TMEM67 as the causative gene, in the family the syndrome was defined from.
  - reference: PMID:29891882
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, TMEM67 showed one of the widest clinical continuum observed in ciliopathies ranging from early lethality to adults with liver fibrosis. Our findings extend the spectrum of phenotypes/syndromes resulting from biallelic TMEM67 variants to now eight distinguishable clinical conditions including RHYNS syndrome."
    explanation: >-
      Places RHYNS within the TMEM67 allelic series and states its breadth, which is the basis
      for treating RHYNS as the mild end of a spectrum.
  - reference: PMID:28719906
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing of a known mutation (NM_153704.5: c.725A>G; p.Asn242Ser) in TMEM67 identified from studying another Iranian family using whole-exome sequencing confirmed the presence of the homozygous mutation in 22 affected members of 12 nuclear families"
    explanation: >-
      Demonstrates that a single TMEM67 allele can recur across many families as a founder
      mutation. Graded INDIRECT because those families have Joubert syndrome rather than RHYNS,
      and the relevance is to the allelic series rather than to this phenotype.
pathophysiology:
- name: Biallelic Loss of Meckelin Function
  biological_scale: MOLECULAR
  description: >
    Compound heterozygosity for a truncating and a mis-splicing TMEM67 allele reduces
    functional meckelin. The residual function matters for this entry: the same gene null
    gives early lethality, so the RHYNS phenotype implies a hypomorphic combination rather
    than complete loss, which is an inference from the allelic series rather than a measured
    property of these alleles.
  genetic_context:
    gene:
      preferred_term: TMEM67
      term:
        id: hgnc:28396
        label: TMEM67
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      One nonsense and one mis-splicing missense allele. Scored as partial loss of function on
      the reasoning that complete loss produces a lethal phenotype in the same allelic series;
      this has not been measured for these alleles.
  cellular_components:
  - preferred_term: ciliary transition zone
    term:
      id: GO:0035869
      label: ciliary transition zone
  downstream:
  - target: Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26035863
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TMEM67 (meckelin) is essential for phosphorylation of the non-canonical Wnt receptor ROR2 (receptor-tyrosine-kinase-like orphan receptor 2) upon stimulation with Wnt5a-conditioned medium."
      explanation: >-
        Establishes that loss of meckelin function directly abolishes ROR2 phosphorylation, which
        is the causal step this edge asserts.
  - target: Loss of Shh Repression
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29891882
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we applied whole-exome sequencing in the originally described family with RHYNS to identify compound heterozygous variants in the ciliary gene TMEM67."
    explanation: >-
      Establishes the biallelic TMEM67 genotype that this node describes.
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ROR2 also colocalises and interacts with TMEM67 at the ciliary transition zone."
    explanation: >-
      Locates meckelin at the ciliary transition zone with its signalling partner, the cellular
      component annotated on this node.
- name: Failure of Wnt5a-ROR2 Non-canonical Wnt Signaling
  biological_scale: MOLECULAR
  description: >
    Meckelin is a receptor for Wnt5a, binding it through its extracellular N-terminal domain,
    and is required for ROR2 phosphorylation on Wnt5a stimulation. Loss of meckelin therefore
    breaks the Wnt5a-TMEM67-ROR2 axis. The evidence is entirely mouse and in vitro; there is
    no patient-derived demonstration of this step in RHYNS or in any other TMEM67 phenotype.
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: DECREASED
  downstream:
  - target: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26035863
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cultured lungs of Tmem67 mutant mice failed to respond to stimulation of epithelial branching morphogenesis by Wnt5a."
      explanation: >-
        Shows the signalling failure produces the morphogenetic defect in the same system, which
        is the causal step this edge asserts.
  evidence:
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, the extracellular N-terminal domain of TMEM67 preferentially binds to Wnt5a in an in vitro binding assay."
    explanation: >-
      Establishes direct Wnt5a binding by meckelin, the receptor role this node describes.
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that TMEM67 is a receptor that has a main role in non-canonical Wnt signalling, mediated by Wnt5a and ROR2, and normally represses Shh signalling."
    explanation: >-
      The authors' summary of meckelin's role, stated as a proposal, which is the epistemic status
      this node carries.
- name: Loss of Shh Repression
  biological_scale: MOLECULAR
  description: >
    Meckelin normally represses Shh signalling, so its loss de-represses that pathway. In the
    severe end of the TMEM67 series the neurological phenotype is instead associated with
    diminished Shh signalling alongside de-regulated canonical Wnt, so the direction of the
    Shh disturbance is not uniform across the allelic series. This node records the
    de-repression claim and the discussion below records the inconsistency rather than
    picking one.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  downstream:
  - target: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wnt5a also inhibited both the Shh and canonical Wnt/β-catenin signalling pathways in wild-type embryonic lung."
    explanation: >-
      Establishes that the intact Wnt5a-meckelin axis inhibits Shh, so its loss de-represses Shh.
  - reference: PMID:23283079
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "An MKS-like incipient congenic group (F6 to F10) manifested very variable neurological features (including exencephaly, and frontal/occipital encephalocele) that were associated with the loss of primary cilia, diminished Shh signalling and dorsalization of the caudal neural tube"
    explanation: >-
      Graded REFUTE against the de-repression direction: in TMEM67-mutant mice on a different
      background the neurological phenotype is associated with *diminished* Shh signalling. Both
      are curated so the node does not assert a single direction the literature does not support.
- name: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
  biological_scale: TISSUE
  description: >
    Tmem67-knockout mice show basal body and kinocilium positioning defects with the basal
    body complex uncoupled from the hair bundle, together with failed epithelial branching
    morphogenesis, pulmonary hypoplasia, axial shortening and limb abnormalities. Notably,
    planar cell polarity and apical planar asymmetry in the organ of Corti were normal, so the
    defect is basal body migration rather than polarity establishment. None of this
    corresponds to the RHYNS phenotype, which is the point of the model mismatch recorded
    below; it is the developmental mechanism the gene is known to serve.
  biological_processes:
  - preferred_term: branching morphogenesis of an epithelial tube
    term:
      id: GO:0048754
      label: branching morphogenesis of an epithelial tube
    modifier: DECREASED
  downstream:
  - target: Nephronophthisis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Skeletal dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The basal body/kinocilium complex was often uncoupled from the hair bundle, suggesting aberrant basal body migration, although planar cell polarity and apical planar asymmetry in the organ of Corti were normal."
    explanation: >-
      Reports the basal body positioning defect and, importantly, that planar cell polarity is
      spared, which is what localises the lesion to basal body migration.
  - reference: PMID:26035863
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These include pulmonary hypoplasia, ventricular septal defects, shortening of the body longitudinal axis, limb abnormalities, and cochlear hair cell stereociliary bundle orientation and basal body/kinocilium positioning defects."
    explanation: >-
      Lists the developmental abnormalities recorded on this node.
- name: Progressive Renal Tubulointerstitial Disease
  biological_scale: TISSUE
  description: >
    Nephronophthisis, the ciliopathy renal lesion: a tubulointerstitial disease presenting
    insidiously with polyuria, polydipsia, anaemia and growth failure, and progressing to
    end-stage renal disease during childhood. It is the feature that dominates prognosis in
    the reported patients. The clinical course quoted here is from the nephronophthisis
    literature in Joubert-related syndromes rather than from RHYNS patients, of whom there
    are too few to describe a course.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Nephronophthisis
    causal_link_type: DIRECT
  - target: Stage 5 chronic kidney disease
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15384098
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases showed insidious development of end-stage renal disease during childhood, preceded by polyuria/polydipsia, anemia, and growth failure"
    explanation: >-
      Gives the clinical course of nephronophthisis in Joubert-related cerebello-oculo-renal
      syndromes. Graded INDIRECT because the cohort is not RHYNS; it is cited for the natural
      history of the shared renal lesion.
- name: Anterior Pituitary Hormone Deficiency
  biological_scale: ORGANISM
  description: >
    Hypopituitarism, with growth hormone deficiency in all reported patients and additional
    TSH deficiency in the index case. This is the feature that distinguishes RHYNS within the
    TMEM67 series, and it is also the one with no mechanistic account at all: no TMEM67 model
    has a pituitary phenotype, and the entry does not offer a mechanism it cannot source.
  downstream:
  - target: Hypopituitarism
    causal_link_type: DIRECT
  - target: Secondary growth hormone deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9375913
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a 17 6/12-year-old boy with nephronophthisis, retinitis pigmentosa, left upper eyelid ptosis, enopthalmos, transmissive deafness, GH and TSH deficiency, and mild skeletal dysplasia."
    explanation: >-
      Reports combined growth hormone and TSH deficiency in the index patient, the pituitary
      involvement this node records.
  - reference: PMID:11391657
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report two brothers with retinitis pigmentosa, growth hormone deficiency, and acromelic skeletal dysplasia."
    explanation: >-
      Confirms growth hormone deficiency in the two familial cases.

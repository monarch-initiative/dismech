    causal_link_type: DIRECT
    description: Obstruction of the cerebral aqueduct impedes CSF flow, producing non-communicating hydrocephalus.
  - target: Ventriculomegaly
    causal_link_type: DIRECT
    description: CSF outflow obstruction enlarges the cerebral ventricles.
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all six patients with SMARCC1 mutations with available brain imaging data had aqueductal stenosis and corpus callosum abnormalities, along with cardiac (n = 3) and skeletal abnormalities (n = 2)"
    explanation: All imaged SMARCC1 probands had aqueductal stenosis, the obstructive basis of the hydrocephalus.

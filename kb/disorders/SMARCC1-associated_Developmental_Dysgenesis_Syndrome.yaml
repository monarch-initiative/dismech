      explanation: Establishes SMARCC1-associated developmental dysgenesis syndrome as a congenital structural brain and neurodevelopmental disorder.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:38128548
      reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results suggest de novo variants in SMARCC1 cause a novel human BAFopathy we term 'SMARCC1-associated developmental dysgenesis syndrome', characterized by variable presence of cerebral ventriculomegaly, aqueductal stenosis, developmental delay and a variety of structural brain or cardiac defects."
      explanation: Establishes the condition as a Mendelian genetic BAFopathy spanning neurological, cardiac, and skeletal development.
notes: >-
  The VERY_FREQUENT neurological phenotype frequencies are derived from cohorts
  ascertained on ventriculomegaly or neurosurgically-treated congenital
  hydrocephalus, so they are likely inflated relative to the full SMARCC1
  mutational spectrum; the defining study (Singh et al., 2024; PMID:38128548)
  describes "variable presence" of these features, and clinical-exome cohorts
  ascertained on broader neurodevelopmental phenotypes report non-unifying
  systemic features (PMID:34906496). No GeneReviews or StatPearls chapter exists
  for SMARCC1 or SMARCC1-associated developmental dysgenesis syndrome as of
  2026-11-12.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Autosomal dominant disorder caused by heterozygous SMARCC1 variants. Causal
    variants arise de novo in many probands with sporadic congenital
    hydrocephalus or developmental delay, but loss-of-function and damaging
    missense alleles are also transmitted from apparently unaffected parents,
    establishing incomplete penetrance alongside marked variable expressivity.
  evidence:
  - reference: PMID:37285932
    reference_title: "First reports of fetal SMARCC1 related hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both identified variants are inherited from a healthy parent, which supports the reported incomplete penetrance of this gene"
    explanation: Documents transmitted SMARCC1 loss-of-function variants from unaffected parents in antenatal cases, establishing incomplete penetrance of the dominant allele.
  - reference: PMID:37639281
    reference_title: "SMARCC1 is a susceptibility gene for congenital hydrocephalus with an autosomal dominant inheritance mode and incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio exome sequencing revealed a loss-of-function heterozygous variant in the SMARCC1 gene inherited from an unaffected mother."
    explanation: Independent prenatal diagnosis case confirms maternal transmission of a heterozygous SMARCC1 loss-of-function allele from an unaffected carrier.
  - reference: PMID:29983323
    reference_title: "De Novo Mutation in Genes Regulating Neural Stem Cell Fate in Human Congenital Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four first-degree relatives of probands with the same mutation in SMARCC1 and one relative of a PTCH1 mutation proband had no evidence of hydrocephalus."
    explanation: Demonstrates unaffected mutation-carrying first-degree relatives across multiplex/transmitted SMARCC1 kindreds, supporting incomplete penetrance and variable expressivity.
pathophysiology:
- name: SMARCC1 Loss-of-Function
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  biological_scale: MOLECULAR
  description: >-
    Heterozygous, frequently de novo or incompletely penetrant transmitted,
    loss-of-function or conserved-domain missense variants in SMARCC1 reduce the
    functional dosage of BAF155, a core scaffold subunit of the chromatin-remodeler
    class of the epigenetic machinery (mammalian SWI/SNF / BAF complex, including
    neural progenitor npBAF complexes). Haploinsufficiency is the primary disease
    mechanism, supported by extreme population loss-of-function constraint and by
    wild-type rescue in vivo.

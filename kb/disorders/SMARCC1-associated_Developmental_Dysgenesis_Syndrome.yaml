    snippet: "Patients exhibited hydrocephalus with aqueductal stenosis; corpus callosum abnormalities, developmental delay, and cardiac defects were also common"
    explanation: Hydrocephalus is the cardinal feature of the syndrome.
- name: Aqueductal stenosis
  category: Neurologic

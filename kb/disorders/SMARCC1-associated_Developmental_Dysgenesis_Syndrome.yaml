- name: Impaired Neurogenesis and Neuronal Differentiation
  biological_scale: CELLULAR
  description: >-
    Dysregulated transcription impairs neuronal differentiation and neurogenic
    output of ventricular-zone neural stem and radial glial progenitors in the
    developing telencephalon, the neural-stem-cell basis of SMARCC1-associated
    congenital hydrocephalus. Mouse alleles diverge on progenitor proliferation
    direction: the Baf155/Baf170 forebrain conditional knockout keeps progenitors
    proliferating symmetrically while blocking differentiation (PMID:29779894),
    whereas the homozygous Baf155msp/msp missense mouse shows defective neural
    stem cell proliferation and increased apoptosis (PMID:33077954). Only the
    shared impaired-differentiation and disrupted fetal neuro-gliogenesis outcome
    is bound here.

name: SMARCC1-associated Developmental Dysgenesis Syndrome
creation_date: "2026-11-04T00:00:00Z"
updated_date: "2026-11-12T19:00:00Z"
description: >-
  SMARCC1-associated developmental dysgenesis syndrome is an autosomal dominant
  Mendelian BAFopathy with incomplete penetrance and variable expressivity caused
  by heterozygous loss-of-function or conserved-domain missense variants in
  SMARCC1, which encodes the BAF155 core scaffold subunit of the mammalian
  SWI/SNF (BAF) ATP-dependent chromatin-remodeling complex. Reduced functional
  BAF155 destabilizes neural progenitor BAF complexes, perturbs developmental
  histone methylation and canonical Wnt signaling, and dysregulates
  midgestational neurogenic transcriptional programs (including NEUROD2 and
  MAB21L2) in telencephalic neural stem and radial glial progenitors. Rather than
  arising from a primary cerebrospinal fluid circulation defect, impaired fetal
  neuro-gliogenesis and brain morphogenesis produce congenital ventriculomegaly
  and obstructive hydrocephalus with aqueductal stenosis, corpus callosum,
  septal, and cortical malformations, global developmental delay, and seizures,
  alongside variable structural cardiac and skeletal anomalies.
category: Mendelian
synonyms:
- SMARCC1-related BAFopathy
- SMARCC1 BAFopathy
- SMARCC1-related neurodevelopmental disorder
- BAF155-associated developmental dysgenesis
- SMARCC1-related congenital hydrocephalus

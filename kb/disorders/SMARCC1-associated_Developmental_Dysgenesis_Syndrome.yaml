      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
      explanation: Smarcc1 knockdown reproduces cardiac defects and is rescued only by wild-type SMARCC1, supporting BAF dysfunction as their cause.
  - target: Abnormality of the skeletal system
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

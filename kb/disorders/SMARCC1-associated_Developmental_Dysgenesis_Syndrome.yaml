- name: Aberrant H3K27me3 Accumulation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  biological_scale: MOLECULAR
  description: >-
    Loss of BAF-complex remodeling impairs interaction with and potentiation of
    the H3K27 demethylases UTX/KDM6A and JMJD3/KDM6B (as well as LSD1/KDM1A at
    proliferation loci), shifting the permissive-repressive chromatin balance so
    repressive H3K27me3 marks accumulate across neuronal-differentiation genes.
    Established in Baf155/Baf170 conditional-knockout mouse forebrain rather than
    in the human heterozygous state.

  description: >-
    Pre- and post-test genetic counseling with parental cascade testing is
    indicated because pathogenic SMARCC1 variants frequently exhibit incomplete
    penetrance and variable expressivity when inherited from an apparently
    unaffected parent, complicating prenatal prognosis and recurrence-risk
    assessment.

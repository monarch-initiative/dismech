diagnosis:
- name: Molecular genetic testing
  description: >-
    Definitive diagnosis requires trio whole-exome or whole-genome sequencing
    (including prenatal sequencing for fetal ventriculomegaly) to detect
    heterozygous de novo or parentally transmitted loss-of-function, damaging
    missense, or intragenic copy-number variants in SMARCC1.
  diagnosis_term:
    preferred_term: trio whole-exome/whole-genome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38128548
    reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results highlight utility of trio-based whole-exome sequencing for identifying pathogenic variants in sporadic congenital structural brain disorders and suggest whole-exome sequencing may be a valuable adjunct in clinical management of congenital hydrocephalus patients"
    explanation: Establishes trio whole-exome sequencing as the diagnostic modality for identifying causal SMARCC1 variants.
  - reference: PMID:37285932
    reference_title: "First reports of fetal SMARCC1 related hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the two first antenatal cases of SMARCC1 LoF variants detected by Whole Genome Sequencing (WGS)."
    explanation: Demonstrates antenatal molecular diagnosis of SMARCC1-related hydrocephalus via whole-genome sequencing.
- name: Brain magnetic resonance imaging
  description: >-
    Fetal or postnatal brain MRI defines the characteristic structural
    malformation pattern—cerebral ventriculomegaly, obstructive aqueductal
    stenosis, corpus callosum and septal anomalies, and schizencephalic clefts—and
    helps distinguish obstructive from non-obstructive ventriculomegaly prior to
    neurosurgical decision-making.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all six patients with SMARCC1 mutations with available brain imaging data had aqueductal stenosis and corpus callosum abnormalities, along with cardiac (n = 3) and skeletal abnormalities (n = 2)"
    explanation: Brain neuroimaging delineates aqueductal stenosis and corpus callosum anomalies across imaged SMARCC1 probands.
genetic:
- name: SMARCC1
  gene_term:
    preferred_term: SMARCC1
    term:
      id: hgnc:11104
      label: SMARCC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Autosomal dominant; variants are frequently de novo (nonsense, frameshift,
    canonical splice-site, intragenic exonic deletions, and conserved SWIRM/SANT
    or N-terminal domain missense substitutions) but are also transmitted from
    unaffected parents with incomplete penetrance. Loss of function /
    haploinsufficiency is the established mechanism.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_bb13d681-db77-4219-93ce-a9eefbd2839c-2023-04-11T160000.000Z
    evidence:
    - reference: CGGV:assertion_bb13d681-db77-4219-93ce-a9eefbd2839c-2023-04-11T160000.000Z
      reference_title: "SMARCC1 / SMARCC1-associated developmental dysgenesis syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SMARCC1 | HGNC:11104 | SMARCC1-associated developmental dysgenesis syndrome | MONDO:0700123 | AD | Definitive | SOP9 | Brain Malformations Gene Curation Expert Panel | 2023-04-11T16:00:00.000Z"
      explanation: ClinGen Brain Malformations GCEP classifies the SMARCC1-disease relationship as Definitive (autosomal dominant).
  evidence:
  - reference: PMID:37285932
    reference_title: "First reports of fetal SMARCC1 related hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the reported variants are loss of function (LoF) and are often inherited from unaffected parents"
    explanation: Characterizes the SMARCC1 variant spectrum as predominantly loss-of-function with frequent transmission from unaffected parents.
  - reference: PMID:38128548
    reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest de novo variants in SMARCC1 cause a novel human BAFopathy we term 'SMARCC1-associated developmental dysgenesis syndrome', characterized by variable presence of cerebral ventriculomegaly, aqueductal stenosis, developmental delay and a variety of structural brain or cardiac defects."
    explanation: Cohort-wide exome study establishes rare de novo SMARCC1 variants as the cause of SMARCC1-associated developmental dysgenesis syndrome.
animal_models:
- name: Xenopus tropicalis Smarcc1 knockdown
  species: Xenopus tropicalis
  genotype: Smarcc1 morpholino knockdown
  publication: PMID:38128548
  description: >-
    Smarcc1 depletion in Xenopus tropicalis recapitulates aqueductal stenosis
    and cardiac defects; the phenotype is rescued by wild-type but not
    patient-specific variant SMARCC1, demonstrating variant pathogenicity.
  modeled_mechanisms:
  - target: Structural Brain Dysgenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockdown reproduces the aqueductal stenosis of the human structural brain
      malformation, with wild-type (but not variant) SMARCC1 rescue.
    limitations: >-
      Amphibian morpholino knockdown models acute gene depletion rather than a
      heterozygous human germline variant, and cannot reproduce the full human
      neurodevelopmental phenotype.
    readouts:
    - name: Cerebral aqueduct patency (optical coherence tomography)
      target: Structural Brain Dysgenesis
      direction: ALTERED
      interpretation: Smarcc1-depleted tadpoles develop aqueductal stenosis, the structural correlate of the human lesion.
      evidence:
      - reference: PMID:38128548
        reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
        explanation: Reports the aqueductal stenosis and cardiac readouts and the wild-type-specific rescue.
    evidence:
    - reference: PMID:38128548
      reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
      explanation: Establishes the Xenopus knockdown as informative for the human structural malformation mechanism.
- name: Baf155msp/msp mouse
  species: Mouse
  genotype: Smarcc1 (Baf155) msp/msp homozygous missense
  publication: PMID:33077954
  description: >-
    Mice homozygous for the Smarcc1 missense allele Baf155msp exhibit
    exencephaly due to defective neural stem cell proliferation and increased
    apoptosis, supporting the neural-progenitor basis of the human disease.
  modeled_mechanisms:
  - target: Impaired Neurogenesis and Neuronal Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The homozygous missense mouse reproduces the neural stem cell
      proliferation defect and apoptosis that underlie the human mechanism. Note
      this model's reduced proliferation is the opposite direction to the
      Baf155/Baf170 forebrain conditional knockout, which retains proliferation
      while blocking differentiation.
    limitations: >-
      The mouse carries a homozygous missense allele rather than the human
      heterozygous loss-of-function state, and its neural-tube phenotype is
      exencephaly rather than the hydrocephalus/aqueductal stenosis seen in
      patients, so the structural outcome is not directly reproduced.
    evidence:
    - reference: PMID:33077954
      reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "exhibit exencephaly similar to Trim71 mutant mice as a result of defective NSC proliferation and increased apoptosis"
      explanation: Reports the neural stem cell proliferation defect and apoptosis in the Smarcc1 missense mouse.
treatments:
- name: Ventriculoperitoneal Shunt Placement
  description: >-
    Catheter-based neurosurgical CSF diversion to decompress obstructive
    hydrocephalus and elevated intracranial pressure. While shunting can acutely
    decrease intracranial pressure and ventricular size, pediatric shunts carry
    substantial early failure rates (13.8% pooled 30-day failure across pediatric
    hydrocephalus) and, because the underlying lesion is prenatal parenchymal
    neuro-gliogenesis dysgenesis, CSF diversion may fail to normalize
    ventriculomegaly or improve neurodevelopmental and epileptic outcomes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Ventriculoperitoneal Shunt Placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Hydrocephalus
    treatment_effect: BYPASSES
    description: CSF shunting diverts cerebrospinal fluid to relieve obstructive hydrocephalus without correcting the underlying BAF-dependent neurodevelopmental defect.
    evidence:
    - reference: PMID:33077954
      reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "neurosurgical CSF diversion (via ventricular shunting or brain endoscopy) can acutely decrease ICP and ventricular size"
      explanation: Supports ventricular shunting as an intervention decompressing hydrocephalus and elevated intracranial pressure.
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands had undergone surgery for therapeutic CSF diversion (shunt placement and/or endoscopic third ventriculostomy)."
    explanation: Confirms that all congenital hydrocephalus cohort probands (including SMARCC1 probands) underwent shunt placement and/or endoscopic third ventriculostomy.
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurosurgical CSF diversion when undertaken in this context can fail to reduce ventriculomegaly or improve neurodevelopmental outcomes"
    explanation: Documents the limited efficacy of CSF diversion on parenchymal neurodevelopmental outcomes in developmental congenital hydrocephalus.
  - reference: PMID:42829386
    reference_title: "Predictors and causes of 30-day failure after shunt placement in pediatric hydrocephalus: a systematic review and meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The pooled prevalence of 30-day shunt failure was 13.8% (95% CI 11.2-16.8)"
    explanation: Pooled meta-analytic result across 11,596 pediatric hydrocephalus patients quantifying early ventriculoperitoneal shunt failure.
- name: Endoscopic Third Ventriculostomy
  description: >-
    Endoscopic fenestration of the third-ventricle floor to bypass cerebral
    aqueduct obstruction in SMARCC1-associated obstructive hydrocephalus without
    implanted shunt hardware, subject to the same limitation that parenchymal
    brain dysgenesis and neurodevelopmental deficits are not reversed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Third Ventriculostomy
    term:
      id: NCIT:C182204
      label: Third Ventriculostomy
  target_mechanisms:
  - target: Aqueductal stenosis
    treatment_effect: BYPASSES
    description: Third ventriculostomy creates an internal CSF outflow bypass around the stenotic cerebral aqueduct.
    evidence:
    - reference: PMID:33077954
      reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "neurosurgical CSF diversion (via ventricular shunting or brain endoscopy) can acutely decrease ICP and ventricular size"
      explanation: Supports brain endoscopy (endoscopic third ventriculostomy) as a CSF-diversion modality decompressing obstructive ventricular enlargement.
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands had undergone surgery for therapeutic CSF diversion (shunt placement and/or endoscopic third ventriculostomy)."
    explanation: Documents clinical use of endoscopic third ventriculostomy alongside shunt placement in the congenital hydrocephalus cohort including SMARCC1 probands.

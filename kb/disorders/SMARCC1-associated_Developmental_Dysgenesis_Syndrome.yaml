name: SMARCC1-associated Developmental Dysgenesis Syndrome
creation_date: "2026-11-04T00:00:00Z"
category: Mendelian
synonyms:
- SMARCC1-related neurodevelopmental disorder
- BAF155-associated developmental dysgenesis
- SMARCC1-related congenital hydrocephalus
disease_term:
  preferred_term: SMARCC1-associated developmental dysgenesis syndrome
  term:
    id: MONDO:0700123
    label: SMARCC1-associated developmental dysgenesis syndrome
parents:
- BAFopathy
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Dominant disorder caused by heterozygous SMARCC1 variants. Causal variants
    arise de novo in many probands but can also be transmitted from an
    apparently unaffected parent, consistent with incomplete penetrance.
  evidence:
  - reference: PMID:37285932
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both identified variants are inherited from a healthy parent, which supports the reported incomplete penetrance of this gene"
    explanation: Documents transmitted variants from unaffected parents, establishing incomplete penetrance of the dominant allele.
pathophysiology:
- name: SMARCC1 Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous, frequently de novo, loss-of-function or damaging missense
    variants in SMARCC1 reduce the dose of functional BAF155, a core scaffold
    subunit of the SWI/SNF (BAF) ATP-dependent chromatin-remodeling complex.
    Haploinsufficiency is the proposed disease mechanism.
  genes:
  - preferred_term: SMARCC1
    term:
      id: hgnc:11104
      label: SMARCC1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:38128548
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "six rare, protein-altering de novo variants localized to highly conserved residues in key functional domains"
    explanation: Establishes rare de novo protein-altering SMARCC1 variants in conserved functional domains as the genetic basis.
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that SMARCC1 haploinsufficiency increases CH risk"
    explanation: States haploinsufficiency as the mechanism by which SMARCC1 loss causes disease.
  - reference: PMID:34906496
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified de novo or predicted loss-of-function variants in 4 candidate BAFopathy genes, including ACTL6A, BICRA (implicated in Coffin-Siris syndrome during this study), PBRM1, and SMARCC1"
    explanation: Independent clinical-exome cohort identifies de novo/loss-of-function SMARCC1 variants and places the gene among the BAFopathies.
  downstream:
  - target: BAF Complex Chromatin-Remodeling Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38128548
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SMARCC1, a component of the BRG1-associated factor (BAF) chromatin remodelling complex"
      explanation: Links SMARCC1 loss directly to impaired function of the BAF chromatin-remodeling complex.
- name: BAF Complex Chromatin-Remodeling Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Reduced BAF155 impairs the nucleosome-remodeling activity of the mSWI/SNF
    (BAF) complex, disrupting the chromatin-accessibility changes that normally
    program gene expression during brain development.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:37285932
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "SMARCC1 encodes a subunit of the mSWI/SNF complex and affects the chromatin structure and expression of several genes"
    explanation: States that SMARCC1 loss alters chromatin structure and downstream gene expression.
  downstream:
  - target: Aberrant H3K27 Methylation and De-repressed Wnt Signaling
    causal_link_type: DIRECT
  - target: Abnormal heart morphology
    causal_link_type: DIRECT
    description: >-
      BAF-complex remodeling is also required for cardiac development; loss of
      SMARCC1 produces structural cardiac defects as an extra-neural arm of the
      syndrome.
    evidence:
    - reference: PMID:38128548
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
      explanation: Smarcc1 knockdown reproduces cardiac defects, supporting BAF dysfunction as their cause.
- name: Aberrant H3K27 Methylation and De-repressed Wnt Signaling
  biological_scale: MOLECULAR
  description: >-
    Loss of BAF-complex remodeling raises repressive H3K27me3 marks (by impairing
    the H3K27 demethylases UTX/KDM6A and JMJD3/KDM6B) and de-represses Wnt
    signaling, silencing neuronal-differentiation genes while activating
    proliferation programs. Established in Baf155/Baf170 conditional-knockout
    mouse forebrain rather than in the human heterozygous state.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:26986003
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the loss of BAF complexes in the above-described model up-regulates H3K27me3 and impairs forebrain development and embryogenesis"
    explanation: BAF-complex loss up-regulates H3K27me3 and impairs forebrain development in the mouse model.
  - reference: PMID:29779894
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of BAF complexes leads to H3K27me3-linked silencing of neuronal differentiation-related genes, with concurrent H3K4me2-mediated activation of proliferation-associated genes via de-repression of Wnt signaling"
    explanation: Links BAF loss to H3K27me3-mediated silencing of differentiation genes and Wnt de-repression.
  downstream:
  - target: Dysregulated Neurodevelopmental Transcription
    causal_link_type: DIRECT
- name: Dysregulated Neurodevelopmental Transcription
  biological_scale: MOLECULAR
  description: >-
    Loss of BAF-dependent chromatin remodeling dysregulates the transcriptional
    programs controlling mid-gestational neurogenesis, including the
    neurogenic transcription factors NEUROD2 and MAB21L2.
  biological_processes:
  - preferred_term: regulation of neurogenesis
    modifier: DECREASED
    term:
      id: GO:0050767
      label: regulation of neurogenesis
  evidence:
  - reference: PMID:38128548
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "altered expression of key genes linked to midgestational neurogenesis, including the transcription factors NEUROD2 and MAB21L2"
    explanation: Human fetal brain transcriptomics show SMARCC1 variants dysregulate mid-gestational neurogenic gene expression.
  downstream:
  - target: Impaired Neural Progenitor Proliferation and Neurogenesis
    causal_link_type: DIRECT
- name: Impaired Neural Progenitor Proliferation and Neurogenesis
  biological_scale: CELLULAR
  description: >-
    Dysregulated transcription impairs proliferation, differentiation and
    survival of neural progenitors in the developing telencephalon, the
    proposed neural-stem-cell basis of SMARCC1-associated congenital
    hydrocephalus.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: cell proliferation in forebrain
    modifier: DECREASED
    term:
      id: GO:0021846
      label: cell proliferation in forebrain
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCC1 is an ATP-dependent chromatin remodeler that regulates gene expression required for NSC proliferation, differentiation and survival during telencephalon development"
    explanation: States SMARCC1's role in regulating neural stem cell proliferation, differentiation and survival during telencephalic development.
  downstream:
  - target: Structural Brain Dysgenesis
    causal_link_type: DIRECT
- name: Structural Brain Dysgenesis
  biological_scale: TISSUE
  description: >-
    Impaired corticogenesis produces structural brain malformations -
    ventriculomegaly/hydrocephalus with aqueductal stenosis and corpus callosum
    abnormalities - and contributes to extra-neural (cardiac) malformations.
  evidence:
  - reference: PMID:38128548
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by variable presence of cerebral ventriculomegaly, aqueductal stenosis, developmental delay and a variety of structural brain or cardiac defects"
    explanation: Defines the structural malformation spectrum resulting from the SMARCC1 mechanism.
  downstream:
  - target: Aqueductal stenosis
  - target: Abnormal corpus callosum morphology
  - target: Global developmental delay
  - target: Seizure
phenotypes:
- name: Hydrocephalus
  category: Neurologic
  phenotype_term:
    preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38128548
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients exhibited hydrocephalus with aqueductal stenosis; corpus callosum abnormalities, developmental delay, and cardiac defects were also common"
    explanation: Hydrocephalus is the cardinal feature of the syndrome.
- name: Aqueductal stenosis
  category: Neurologic
  phenotype_term:
    preferred_term: Aqueductal stenosis
    term:
      id: HP:0002410
      label: Aqueductal stenosis
  frequency: VERY_FREQUENT
  sequelae:
  - target: Hydrocephalus
    causal_link_type: DIRECT
    description: Obstruction of the cerebral aqueduct impedes CSF flow, producing non-communicating hydrocephalus.
  - target: Ventriculomegaly
    causal_link_type: DIRECT
    description: CSF outflow obstruction enlarges the cerebral ventricles.
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all six patients with SMARCC1 mutations with available brain imaging data had aqueductal stenosis and corpus callosum abnormalities, along with cardiac (n = 3) and skeletal abnormalities (n = 2)"
    explanation: All imaged SMARCC1 probands had aqueductal stenosis, the obstructive basis of the hydrocephalus.
- name: Ventriculomegaly
  category: Neurologic
  phenotype_term:
    preferred_term: Ventriculomegaly
    term:
      id: HP:0002119
      label: Ventriculomegaly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:37285932
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ventriculomegaly is the common feature in those fetuses"
    explanation: Ventriculomegaly is the common presenting feature, including antenatally.
- name: Abnormal corpus callosum morphology
  category: Neurologic
  phenotype_term:
    preferred_term: Corpus callosum abnormalities
    term:
      id: HP:0001273
      label: Abnormal corpus callosum morphology
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all six patients with SMARCC1 mutations with available brain imaging data had aqueductal stenosis and corpus callosum abnormalities, along with cardiac (n = 3) and skeletal abnormalities (n = 2)"
    explanation: Corpus callosum abnormalities were present in all imaged SMARCC1 probands.
- name: Abnormal heart morphology
  category: Cardiovascular
  phenotype_term:
    preferred_term: Cardiac defects
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  frequency: FREQUENT
  evidence:
  - reference: PMID:38128548
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients exhibited hydrocephalus with aqueductal stenosis; corpus callosum abnormalities, developmental delay, and cardiac defects were also common"
    explanation: Cardiac defects are a common extra-neural feature of the syndrome.
- name: Global developmental delay
  category: Neurologic
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: FREQUENT
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developmental delay and epilepsy were additional common features in both TRIM71 and SMARCC1 mutant probands"
    explanation: Developmental delay is a common feature in SMARCC1 probands.
- name: Seizure
  category: Neurologic
  phenotype_term:
    preferred_term: Epilepsy
    term:
      id: HP:0001250
      label: Seizure
  frequency: FREQUENT
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "developmental delay and epilepsy were additional common features in both TRIM71 and SMARCC1 mutant probands"
    explanation: Epilepsy is reported as an additional common feature in SMARCC1 probands.
- name: Abnormality of the skeletal system
  category: Skeletal
  phenotype_term:
    preferred_term: Skeletal abnormalities
    term:
      id: HP:0000924
      label: Abnormality of the skeletal system
    coarse_binding_basis: SOURCE_UNSPECIFIED
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all six patients with SMARCC1 mutations with available brain imaging data had aqueductal stenosis and corpus callosum abnormalities, along with cardiac (n = 3) and skeletal abnormalities (n = 2)"
    explanation: Skeletal abnormalities were reported in 2 of 6 imaged SMARCC1 probands; the source names only "skeletal abnormalities" with no more specific finding, so the binding is left at the system level.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is molecular: trio whole-exome or whole-genome sequencing
    identifying a damaging (usually de novo) SMARCC1 variant, supported by brain
    MRI (ventriculomegaly, aqueductal stenosis, callosal anomalies) and
    echocardiography for cardiac defects.
  diagnosis_term:
    preferred_term: trio whole-exome/whole-genome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38128548
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results highlight utility of trio-based whole-exome sequencing for identifying pathogenic variants in sporadic congenital structural brain disorders and suggest whole-exome sequencing may be a valuable adjunct in clinical management of congenital hydrocephalus patients"
    explanation: Establishes trio whole-exome sequencing as the diagnostic modality for identifying the causal SMARCC1 variant.
genetic:
- name: SMARCC1
  gene_term:
    preferred_term: SMARCC1
    term:
      id: hgnc:11104
      label: SMARCC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Dominant; variants are frequently de novo but also transmitted from
    unaffected parents with incomplete penetrance. Most reported variants are
    loss of function, consistent with a haploinsufficiency mechanism.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_bb13d681-db77-4219-93ce-a9eefbd2839c-2023-04-11T160000.000Z
    evidence:
    - reference: CGGV:assertion_bb13d681-db77-4219-93ce-a9eefbd2839c-2023-04-11T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SMARCC1 | HGNC:11104 | SMARCC1-associated developmental dysgenesis syndrome | MONDO:0700123 | AD | Definitive | SOP9 | Brain Malformations Gene Curation Expert Panel | 2023-04-11T16:00:00.000Z"
      explanation: ClinGen Brain Malformations GCEP classifies the SMARCC1-disease relationship as Definitive (autosomal dominant).
  evidence:
  - reference: PMID:37285932
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the reported variants are loss of function (LoF) and are often inherited from unaffected parents"
    explanation: Characterizes the SMARCC1 variant spectrum as predominantly loss-of-function with frequent transmission from unaffected parents.
animal_models:
- name: Xenopus tropicalis Smarcc1 knockdown
  species: Xenopus tropicalis
  genotype: Smarcc1 morpholino knockdown
  publication: PMID:38128548
  description: >-
    Smarcc1 depletion in Xenopus tropicalis recapitulates aqueductal stenosis
    and cardiac defects; the phenotype is rescued by wild-type but not
    patient-specific variant SMARCC1, demonstrating variant pathogenicity.
  modeled_mechanisms:
  - target: Structural Brain Dysgenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockdown reproduces the aqueductal stenosis of the human structural brain
      malformation, with wild-type (but not variant) SMARCC1 rescue.
    limitations: >-
      Amphibian morpholino knockdown models acute gene depletion rather than a
      heterozygous human germline variant, and cannot reproduce the full human
      neurodevelopmental phenotype.
    readouts:
    - name: Cerebral aqueduct patency (optical coherence tomography)
      target: Structural Brain Dysgenesis
      direction: ALTERED
      interpretation: Smarcc1-depleted tadpoles develop aqueductal stenosis, the structural correlate of the human lesion.
      evidence:
      - reference: PMID:38128548
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
        explanation: Reports the aqueductal stenosis and cardiac readouts and the wild-type-specific rescue.
    evidence:
    - reference: PMID:38128548
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
      explanation: Establishes the Xenopus knockdown as informative for the human structural malformation mechanism.
- name: Baf155msp/msp mouse
  species: Mouse
  genotype: Smarcc1 (Baf155) msp/msp homozygous missense
  publication: PMID:33077954
  description: >-
    Mice homozygous for the Smarcc1 missense allele Baf155msp exhibit
    exencephaly due to defective neural stem cell proliferation and increased
    apoptosis, supporting the neural-progenitor basis of the human disease.
  modeled_mechanisms:
  - target: Impaired Neural Progenitor Proliferation and Neurogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The homozygous missense mouse reproduces the neural stem cell
      proliferation defect and apoptosis that underlie the human mechanism.
    limitations: >-
      The mouse carries a homozygous missense allele rather than the human
      heterozygous loss-of-function state, and its neural-tube phenotype is
      exencephaly rather than the hydrocephalus/aqueductal stenosis seen in
      patients, so the structural outcome is not directly reproduced.
    evidence:
    - reference: PMID:33077954
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "exhibit exencephaly similar to Trim71 mutant mice as a result of defective NSC proliferation and increased apoptosis"
      explanation: Reports the neural stem cell proliferation defect and apoptosis in the Smarcc1 missense mouse.
treatments:
- name: Neurosurgical CSF diversion
  description: >-
    Ventricular shunting or endoscopic cerebrospinal-fluid diversion to
    decompress ventriculomegaly/hydrocephalus. It can acutely reduce ventricular
    size, but carries high morbidity and failure rates and, in developmental
    (primary) congenital hydrocephalus, may fail to reduce ventriculomegaly or
    improve neurodevelopmental outcomes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cerebrospinal fluid diversion (ventricular shunting)
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Hydrocephalus
    description: CSF diversion addresses the hydrocephalus/ventriculomegaly without correcting the underlying neurodevelopmental mechanism.
    evidence:
    - reference: PMID:33077954
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "neurosurgical CSF diversion (via ventricular shunting or brain endoscopy) can acutely decrease ICP and ventricular size"
      explanation: Supports CSF diversion as the intervention targeting the ventricular enlargement.
  evidence:
  - reference: PMID:33077954
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurosurgical CSF diversion when undertaken in this context can fail to reduce ventriculomegaly or improve neurodevelopmental outcomes"
    explanation: Documents the limited efficacy of CSF diversion in developmental congenital hydrocephalus.
references:
- reference: PMID:38128548
  title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."

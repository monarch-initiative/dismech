name: SMARCC1-associated Developmental Dysgenesis Syndrome
creation_date: "2026-11-04T00:00:00Z"
category: Mendelian
synonyms:
- SMARCC1-related neurodevelopmental disorder
- BAF155-associated developmental dysgenesis
- SMARCC1-related congenital hydrocephalus
disease_term:
  preferred_term: SMARCC1-associated developmental dysgenesis syndrome
  term:
    id: MONDO:0700123
    label: SMARCC1-associated developmental dysgenesis syndrome
parents:
- BAFopathy
notes: >-
  The VERY_FREQUENT neurological phenotype frequencies are derived from cohorts
  ascertained on ventriculomegaly or neurosurgically-treated congenital
  hydrocephalus, so they are likely inflated relative to the full SMARCC1
  mutational spectrum; the defining study (Singh et al., 2024) describes
  "variable presence" of these features.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Dominant disorder caused by heterozygous SMARCC1 variants. Causal variants
    arise de novo in many probands but can also be transmitted from an
    apparently unaffected parent, consistent with incomplete penetrance.
  evidence:
  - reference: PMID:37285932
    reference_title: "First reports of fetal SMARCC1 related hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both identified variants are inherited from a healthy parent, which supports the reported incomplete penetrance of this gene"
    explanation: Documents transmitted variants from unaffected parents, establishing incomplete penetrance of the dominant allele.
pathophysiology:
- name: SMARCC1 Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous, frequently de novo, loss-of-function or damaging missense
    variants in SMARCC1 reduce the dose of functional BAF155, a core scaffold
    subunit of the SWI/SNF (BAF) ATP-dependent chromatin-remodeling complex.
    Haploinsufficiency is the proposed disease mechanism.
  genes:
  - preferred_term: SMARCC1
    term:
      id: hgnc:11104
      label: SMARCC1
  molecular_functions:
  - preferred_term: chromatin binding
    modifier: DECREASED
    term:
      id: GO:0003682
      label: chromatin binding
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:38128548
    reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "six rare, protein-altering de novo variants localized to highly conserved residues in key functional domains"
    explanation: Establishes rare de novo protein-altering SMARCC1 variants in conserved functional domains as the genetic basis.
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that SMARCC1 haploinsufficiency increases CH risk"
    explanation: States haploinsufficiency as the mechanism by which SMARCC1 loss causes disease.
  - reference: PMID:34906496
    reference_title: "Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified de novo or predicted loss-of-function variants in 4 candidate BAFopathy genes, including ACTL6A, BICRA (implicated in Coffin-Siris syndrome during this study), PBRM1, and SMARCC1"
    explanation: Independent clinical-exome cohort identifies de novo/loss-of-function SMARCC1 variants and places the gene among the BAFopathies.
  downstream:
  - target: BAF Complex Chromatin-Remodeling Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31020615
      reference_title: "RBM15 Modulates the Function of Chromatin Remodeling Factor BAF155 Through RNA Methylation in Developing Cortex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "As a core and scaffold subunit of the BAF (SWI/SNF-like) complex, BAF155 is capable of regulating the stability and function of the BAF complex"
      explanation: BAF155 is the scaffold subunit that maintains BAF-complex stability and function, so its loss impairs the complex.
- name: BAF Complex Chromatin-Remodeling Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Reduced BAF155 impairs the nucleosome-remodeling activity of the mSWI/SNF
    (BAF) complex, disrupting the chromatin-accessibility changes that normally
    program gene expression during brain development.
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    modifier: DECREASED
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:37285932
    reference_title: "First reports of fetal SMARCC1 related hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "SMARCC1 encodes a subunit of the mSWI/SNF complex and affects the chromatin structure and expression of several genes"
    explanation: States that SMARCC1 loss alters chromatin structure and downstream gene expression.
  downstream:
  - target: Aberrant H3K27me3 Accumulation
    causal_link_type: DIRECT
  - target: Abnormal heart morphology
    causal_link_type: DIRECT
    description: >-
      BAF-complex remodeling is also required for cardiac development; loss of
      SMARCC1 produces structural cardiac defects as an extra-neural arm of the
      syndrome.
    evidence:
    - reference: PMID:38128548
      reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Xenopus knockdowns recapitulated both aqueductal stenosis and cardiac defects and were rescued by wild-type but not patient-specific variant SMARCC1"
      explanation: Smarcc1 knockdown reproduces cardiac defects, supporting BAF dysfunction as their cause.
- name: Aberrant H3K27me3 Accumulation
  biological_scale: MOLECULAR
  description: >-
    Loss of BAF-complex remodeling impairs the H3K27 demethylases UTX/KDM6A and
    JMJD3/KDM6B, so repressive H3K27me3 marks accumulate at developmental genes.
    Established in Baf155/Baf170 conditional-knockout mouse forebrain rather than
    in the human heterozygous state.
  molecular_functions:
  - preferred_term: histone H3K27me2/H3K27me3 demethylase activity
    modifier: DECREASED
    term:
      id: GO:0071558
      label: histone H3K27me2/H3K27me3 demethylase activity
  evidence:
  - reference: PMID:26986003
    reference_title: "Epigenetic regulation by BAF (mSWI/SNF) chromatin remodeling complexes is indispensable for embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BAF complexes globally control the key heterochromatin marks, H3K27me2 and -3, by directly modulating the enzymatic activity of the H3K27 demethylases, Utx and Jmjd3"
    explanation: BAF complexes raise H3K27me2/3 by modulating the UTX/JMJD3 demethylases, so their loss lets the marks accumulate.
  downstream:
  - target: De-repressed Wnt Signaling
    causal_link_type: DIRECT
- name: De-repressed Wnt Signaling
  biological_scale: MOLECULAR
  description: >-
    Loss of BAF complexes de-represses Wnt signaling and silences
    neuronal-differentiation genes while activating proliferation-associated
    genes. Established in Baf155/Baf170 conditional-knockout mouse forebrain
    rather than in the human heterozygous state.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:29779894
    reference_title: "Epigenetic Regulation by BAF Complexes Limits Neural Stem Cell Proliferation by Suppressing Wnt Signaling in Late Embryonic Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inactivation of BAF complexes leads to H3K27me3-linked silencing of neuronal differentiation-related genes, with concurrent H3K4me2-mediated activation of proliferation-associated genes via de-repression of Wnt signaling"
    explanation: Links BAF loss to H3K27me3-mediated silencing of differentiation genes and Wnt de-repression.
  downstream:
  - target: Dysregulated Neurodevelopmental Transcription
    causal_link_type: DIRECT
- name: Dysregulated Neurodevelopmental Transcription
  biological_scale: MOLECULAR
  description: >-
    Loss of BAF-dependent chromatin remodeling dysregulates the transcriptional
    programs controlling mid-gestational neurogenesis, including the
    neurogenic transcription factors NEUROD2 and MAB21L2.
  biological_processes:
  - preferred_term: regulation of neurogenesis
    modifier: DECREASED
    term:
      id: GO:0050767
      label: regulation of neurogenesis
  evidence:
  - reference: PMID:38128548
    reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "altered expression of key genes linked to midgestational neurogenesis, including the transcription factors NEUROD2 and MAB21L2"
    explanation: Human fetal brain transcriptomics show SMARCC1 variants dysregulate mid-gestational neurogenic gene expression.
  downstream:
  - target: Impaired Neurogenesis and Neuronal Differentiation
    causal_link_type: DIRECT
- name: Impaired Neurogenesis and Neuronal Differentiation
  biological_scale: CELLULAR
  description: >-
    Dysregulated transcription impairs neuronal differentiation and neurogenic
    output of neural progenitors in the developing telencephalon, the proposed
    neural-stem-cell basis of SMARCC1-associated congenital hydrocephalus. The
    two mouse models disagree on the direction of the proliferation change: the
    Baf155/Baf170 forebrain conditional knockout keeps progenitors proliferating
    while blocking differentiation (PMID:29779894), whereas the Baf155msp/msp
    missense mouse shows reduced progenitor proliferation (PMID:33077954). Only
    the shared impaired-differentiation/neurogenesis outcome is asserted here;
    the proliferation direction is left unbound.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: neuron differentiation
    modifier: DECREASED
    term:
      id: GO:0030182
      label: neuron differentiation
  evidence:
  - reference: PMID:33077954
    reference_title: "Exome sequencing implicates genetic disruption of prenatal neuro-gliogenesis in sporadic congenital hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCC1 is an ATP-dependent chromatin remodeler that regulates gene expression required for NSC proliferation, differentiation and survival during telencephalon development"
    explanation: States SMARCC1's role in regulating neural stem cell differentiation and survival during telencephalic development.
  downstream:
  - target: Structural Brain Dysgenesis
    causal_link_type: DIRECT
- name: Structural Brain Dysgenesis
  biological_scale: TISSUE
  description: >-
    Impaired corticogenesis produces structural brain malformations -
    ventriculomegaly/hydrocephalus with aqueductal stenosis and corpus callosum
    abnormalities.
  evidence:
  - reference: PMID:38128548
    reference_title: "A novel SMARCC1 BAFopathy implicates neural progenitor epigenetic dysregulation in human hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by variable presence of cerebral ventriculomegaly, aqueductal stenosis, developmental delay and a variety of structural brain or cardiac defects"
    explanation: Defines the structural malformation spectrum resulting from the SMARCC1 mechanism.
  downstream:
  - target: Aqueductal stenosis
  - target: Abnormal corpus callosum morphology
  - target: Global developmental delay
  - target: Seizure

  - target: Abnormal heart morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      BAF-complex chromatin remodeling is required for embryonic cardiogenesis;
      SMARCC1 depletion produces structural cardiac defects rescued by wild-type
      but not patient-variant SMARCC1, establishing an extra-neural developmental
      branch whose cardiac progenitor intermediates remain incompletely mapped.
    evidence:
    - reference: PMID:38128548

animal_models:
- name: Lrp5 p.G171V and p.A214V high-bone-mass knock-in mice
  species: Mouse
  genotype: Homozygous Lrp5 p.G171V or p.A214V knock-in alleles, with SOST or Dkk1 overexpression transgenes
  publication: PMID:25808845
  description: The 2015 study tested inhibitor resistance in homozygous knock-in mice. Endogenous-locus expression preserves regulatory context but differs from the usual heterozygous human genotype.
  modeled_mechanisms:
  - target: Variant-Dependent LRP5 Antagonist Resistance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Overexpressed sclerostin lowers bone mass in wild-type mice but not in the HBM-allele mice, and DKK1 overexpression affects p.A214V more than p.G171V.
    limitations: Two mutant alleles differ from human heterozygosity. Cranial-nerve morbidity was not evaluated, so absence of that phenotype cannot be inferred. Background differences and different transgene promoters/expression levels limit cross-inhibitor comparisons.
    readouts:
    - name: Bone mineral density under SOST overexpression
      target: Variant-Dependent LRP5 Antagonist Resistance
      direction: UNCHANGED
      interpretation: The main whole-body and selected bone endpoints did not show significant SOST-induced reductions in HBM mice, unlike controls. This is resistance in specified readouts, not proof of zero response in every microarchitectural parameter.
      evidence:
      - reference: PMID:25808845
        reference_title: High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We observed that the (8kb) Dmp1-SOST transgene significantly lowered whole-body bone mineral density (BMD), bone mineral content (BMC), femoral and vertebral trabecular bone volume fraction (BV/TV), and periosteal bone-formation rate (BFR) in wild-type mice but not in mice with Lrp5 p.G171V and p.A214V alleles.
        explanation: The contrast between wild-type and knock-in animals is the measurement.
    evidence:
    - reference: PMID:25808845
      reference_title: High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These in vivo data support in vitro studies regarding the mechanism of HBM-causing mutations, and imply that HBM LRP5 receptors differ in their relative sensitivity to inhibition
      explanation: The authors state both what the model confirms and the qualification that the alleles differ, which is what makes it informative for this node.
- name: Conditional Lrp5 HBM with Wls deletion in late osteoblasts and osteocytes
  species: Mouse
  genotype: Dmp1-Cre activation of conditional G171V or A214V Lrp5 alleles with conditional Wls deletion
  publication: PMID:42113468
  description: Tests whether intracellular retention of G171V permits bone accrual when Wnt secretion is impaired. Severe Wls-associated osteopenia persisted with either HBM allele; some male bone-mineral-content endpoints showed partial effects.
  modeled_mechanisms:
  - target: Enhanced Canonical Wnt Signaling in Bone
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Perturbation tests the dependence of HBM behavior on the ligand-secretion environment.
    limitations: Wls deletion can change resorption and intracellular ligand positioning; these confound a simple inference about receptor localization. This is an engineered compound genotype, not isolated human LRP5 disease.
    evidence:
    - reference: PMID:42113468
      reference_title: Different Lrp5-HBM mutations induce magnitude- and surface-selective effects that are not explained by receptor trafficking.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was present or not.
      explanation: Conditional Dmp1-Cre experiments constrain a ligand-independent or intracellular-retention explanation; altered resorption and intracellular ligand localization remain potential confounders.
  evidence:
  - reference: PMID:42113468
    reference_title: Different Lrp5-HBM mutations induce magnitude- and surface-selective effects that are not explained by receptor trafficking.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was present or not.
    explanation: Conditional Dmp1-Cre experiments constrain a ligand-independent or intracellular-retention explanation; altered resorption and intracellular ligand localization remain potential confounders.
discussions:
- discussion_id: worth_lrp5_naming
  kind: KNOWLEDGE_GAP
  prompt: How should clinically defined Worth cases be compared with molecularly established LRP5 high bone mass?
  attaches_to:
  - disease#Autosomal Dominant Osteosclerosis Worth Type
  - genetic#LRP5
  rationale: Historical names overlap substantially, but some dental case reports remained presumptive diagnoses without genetic or family confirmation. The 155-case review includes only 64 genetically tested patients and variable feature denominators. Molecular stratification is needed to estimate carrier risks without assuming that every historical mandibular case has the same cause.
  status: OPEN
  evidence:
  - reference: PMID:12579474
    reference_title: Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results indicate that, despite the different diagnoses that can be made, conditions with an increased bone density affecting mainly the cortices of the long bones and the skull are often caused by mutations in the LRP5 gene.
    explanation: The authors state that the clinical diagnoses do not correspond to distinct genetic entities, which is the substance of this gap.
- discussion_id: worth_pharmacologic_disease_modification
  kind: KNOWLEDGE_GAP
  prompt: Can Wnt-directed or other pharmacologic interventions safely reduce symptomatic LRP5 skeletal overgrowth?
  attaches_to:
  - pathophysiology#Enhanced Canonical Wnt Signaling in Bone
  rationale: The 2025 case report discusses porcupine inhibitors, DKK1 and DMPA as possibilities, but provides no efficacy experiment or treated LRP5 outcome. DMPA was not considered clinically useful for its asymptomatic patient, and long-term steroids were not recommended. These suggestions remain untested concepts rather than established treatments; inhibitor resistance and systemic Wnt functions complicate extrapolation.
  evidence:
  - reference: PMID:40585686
    reference_title: A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: There is no reported treatment directed against this specific mutation or LRP5 HBM in general.
    explanation: The discussion offers hypotheses without disease-specific treatment results.
    quote_role: REVIEW_SYNTHESIS

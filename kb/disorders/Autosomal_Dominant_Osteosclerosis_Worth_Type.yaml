      label: mandible
  evidence:
  - reference: PMID:198847
    reference_title: "Autosomal dominant osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical manifestation of autosomal dominant osteosclerosis is a
      widened and deepened mandible with increased gonial angle.
    explanation: >-
      The mandibular component of the hyperostosis is the clinically visible
      sign.
  downstream:
  - target: phenotypes#Mandibular hyperostosis
    causal_link_type: DIRECT
    description: >-
      The mandibular component of the added bone is the clinically visible sign.
  - target: phenotypes#Increased bone mineral density
    causal_link_type: DIRECT
  - target: phenotypes#Thickened calvaria
    causal_link_type: DIRECT
  - target: phenotypes#Diaphyseal sclerosis
    causal_link_type: DIRECT
  - target: Cranial Foramina and Posterior Fossa Encroachment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - narrowing of skull-base foramina and reduced posterior fossa volume
    description: >-
      Where the added bone encroaches on nerve foramina or the posterior fossa,
      it produces the neurological complications. This happens in a minority.
    evidence:
    - reference: PMID:37659026
      reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neurological involvement and increased serum alkaline phosphatase (ALP)
        were present in 19.4% and 3.7% of cases, respectively.
      explanation: >-
        The review quantifies how often the hyperostosis produces neurological
        consequences, which is what makes this a minority pathway rather than the
        main one.
- name: Cranial Foramina and Posterior Fossa Encroachment
  biological_scale: ORGANISM
  description: >-
    Cranial nerve compression giving hearing loss, facial palsy and anosmia, and
    in reported families posterior fossa crowding with Chiari I malformation and
    chronic headache requiring decompression.

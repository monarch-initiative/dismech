notes: This entry retains MONDO:0007764 and Worth-specific clinical history while acknowledging substantial overlap with LRP5 high bone mass and historical ADO1. It does not merge ontology records or equate every presumptive mandibular case with a confirmed LRP5 genotype. Published case counts and feature frequencies are subject to ascertainment, missing-data and diagnostic-era effects. Facial morphology remains described without assigning an unsupported direction of forehead change. No disease-specific GeneReviews chapter was identified.

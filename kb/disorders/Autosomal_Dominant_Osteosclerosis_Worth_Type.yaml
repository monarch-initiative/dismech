genetic:
- name: LRP5
  gene_term:
    preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: LRP5 encodes a Wnt co-receptor. Established high-bone-mass alleles include D111Y, G171R, G171V, A214T, A214V, A242T and T253I, concentrated in the first extracellular beta-propeller. The variant spectrum also includes a two-amino-acid insertion. A 2023 report associated cytoplasmic R1414S with radiographic cortical thickening in a father and son whose DXA measurements were normal; that study used segregation and computational predictions without a functional assay. R1414S should not be assumed to share the experimentally demonstrated inhibitor-resistance mechanism of canonical extracellular alleles. Effects on sclerostin, DKK1 and trafficking differ by allele. Recessive loss-of-function disease has the opposite skeletal phenotype. The M282V case report describes a de novo variant returned as a VUS; parental testing details and a functional assay are not provided. Its occurrence supports a reported association without independently establishing pathogenicity.
  variants:
  - name: p.Met282Val
    description: Reported de novo M282V in an 18-year-old with marked high bone mass. The diagnostic panel classified it as uncertain significance; neither the reported de novo status nor domain position substitutes for a functional demonstration in this paper.
    gene:
      preferred_term: LRP5
      term:
        id: hgnc:6697
        label: LRP5
    evidence:
    - reference: PMID:40585686
      reference_title: A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Our case represents a de novo heterozygous variant of the LRP5 gene.
      explanation: The author reports de novo occurrence; parental testing details are not given, so this entry does not independently verify the segregation assessment.
    - reference: PMID:40585686
      reference_title: A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A salivary Skeletal Dysplasias Core Panel testing for 358 genes revealed the patient has a de novo variant in the heterozygous state LRP5 (c.844A>G, p.Met282Val-uncertain significance).
      explanation: The report gives the allele and panel VUS classification. It does not present a functional assay establishing gain of function.
  - name: p.Gly171Val
    description: The founding kindred's variant, in the conserved propeller motif.
    evidence:
    - reference: PMID:12015390
      reference_title: High bone density due to a mutation in LDL-receptor-related protein 5.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This mutation segregated with the trait in the family and was absent in control subjects.
      explanation: Segregation plus absence in controls is the evidence that this variant causes the phenotype.
  evidence:
  - reference: PMID:12579474
    reference_title: Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thirteen of these were confirmed as polymorphisms, but six novel missense mutations (D111Y, G171R, A214T, A214V, A242T, and T253I) are most likely disease causing.
    explanation: The allelic series is enumerated, including the A242T allele carried by the patient in the 2023 review.
  - reference: PMID:12015390
    reference_title: High bone density due to a mutation in LDL-receptor-related protein 5.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Loss-of-function mutations in the gene for low-density lipoprotein receptor-related protein 5 (LRP5), which acts in the Wnt signaling pathway, have been shown to cause osteoporosis-pseudoglioma.
    explanation: 'Supports the allelic contrast recorded in the notes: the same gene''s loss of function gives the opposite bone phenotype.'
    quote_role: BACKGROUND
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both individuals, we detected a novel heterozygous duplication of six basepairs in the LRP5 gene, resulting in an insertion of two amino acids, very likely associated with a gain-of-function.
    explanation: Affected mother and daughter had a heterozygous in-frame duplication; the report proposes gain of function rather than measuring receptor activity.
  - reference: PMID:36971833
    reference_title: 'Novel mutation in LRP5 gene cause rare osteosclerosis: cases studies and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation (c.4240C > A, p.R1414S) of patients 2 and 3 in this study locates in exon 20 of LRP5
    explanation: Clinical report of a cytoplasmic variant in a father and son. Functional Wnt activation was proposed from sequence location rather than measured.

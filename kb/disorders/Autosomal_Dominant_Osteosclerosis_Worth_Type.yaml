diagnosis:
- name: Dual-energy X-ray absorptiometry with LRP5 sequencing
  description: >-
    DXA establishes the high bone mass; targeted sequencing of the LRP5 first
    beta-propeller establishes the cause. Because the skeleton looks normal in
    childhood and the mandibular sign is often incidental, many patients reach
    diagnosis through dentistry rather than through skeletal medicine.
  evidence:
  - reference: PMID:36971833
    reference_title: "Novel mutation in LRP5 gene cause rare osteosclerosis: cases studies and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The targeted next-generation sequencing (NGS) technology was used to detect
      pathogenic gene mutations, which were further verified by Sanger
      sequencing.
    explanation: >-
      The diagnostic route used in a contemporary case series.
differential_diagnoses:
- name: Van Buchem disease
  description: >-
    The classic confusion, and the reason the two are often quoted as synonyms.
    Van Buchem disease is recessive and caused by loss of the SOST enhancer, so
    it removes the inhibitor rather than making the receptor deaf to it. The
    Wnt output is raised in both, from opposite ends of the same axis.
  evidence:
  - reference: PMID:22065804
    reference_title: "Worth syndrome as a diagnosis for mandibular osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report aims to clarify the difference in terminology and presentation
      of two conditions known to produce mandibular osteosclerosis: Worth
      syndrome and Van Buchem disease, both of which are often quoted
      synonymously in the literature.
    explanation: >-
      The source exists specifically to separate these two diagnoses, which is
      why it is the right citation for this differential.
- name: Sclerosteosis
  description: >-
    Also SOST loss of function, but complete rather than regulatory, giving a
    more severe phenotype with gigantism and syndactyly. Same axis, ligand side,
    larger effect.
  evidence:
  - reference: PMID:198847
    reference_title: "Autosomal dominant osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Autosomal dominant osteosclerosis, an entity previously labelled by various
      names, is clearly separate from Van Buchem disease
    explanation: >-
      The quote establishes that Worth type is a distinct entity from the
      recessive sclerosing dysplasias it was historically merged with. It does
      not name sclerosteosis, so the extension to that sibling disorder is an
      inference, which is what directness INDIRECT records.
- name: Osteopetrosis
  description: >-
    Distinguished by mechanism and by consequence: osteopetrosis is failed
    osteoclastic resorption and produces brittle, fracture-prone bone with marrow
    failure. Worth type adds bone through raised formation with normal
    resorption, and the bone is not fragile.
  evidence:
  - reference: PMID:12015390
    reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Markers of bone resorption were normal in the affected subjects, whereas
      markers of bone formation such as osteocalcin were markedly elevated.
    explanation: >-
      The normal resorption markers are what rule out an osteoclast defect.
  - reference: PMID:40585686
    reference_title: "A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, these skeletal changes do not seem to lead to an increased risk of
      fracture
    explanation: >-
      States the consequence directly rather than leaving it inferred from the
      marker pattern: the bone is dense and not fragile, which is what separates
      this from osteopetrosis clinically as well as mechanistically.
- name: Osteoporosis-pseudoglioma syndrome
  description: >-
    The allelic opposite. Loss-of-function LRP5 variants give low bone mass with
    fractures and congenital blindness, so LRP5 on a gene panel does not by
    itself point to either diagnosis; the variant's functional direction does.
  evidence:
  - reference: PMID:12015390
    reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function mutations in the gene for low-density lipoprotein
      receptor-related protein 5 (LRP5), which acts in the Wnt signaling pathway,
      have been shown to cause osteoporosis-pseudoglioma.
    explanation: >-
      The allelic relationship is stated directly.

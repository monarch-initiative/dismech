      explanation: Cellular DKK1-inhibition defect for G171V, not proof of identical behavior for every reported allele.
- name: Variant-Dependent LRP5 Antagonist Resistance
  biological_scale: MOLECULAR
  description: Tested LRP5 HBM variants exhibit reduced binding or sensitivity to sclerostin and DKK1, with allele- and endpoint-specific effects. Homozygous G171V and A214V knock-in mice resist many effects of SOST overexpression, but residual architectural responses occur. DKK1 lowers A214V whole-body aBMD by approximately 11–14%, while G171V responses differ by sex. Resistance does not imply complete inability to respond to either inhibitor.

- name: Increased Osteoblastic Bone Formation
  biological_scale: TISSUE
  description: Increased bone-forming activity contributes to high bone mass, with genotype-, surface- and age-dependent effects. Prior T253I histomorphometry reported increased mineralizing surface, while the later T3 study found normal baseline formation markers and a normal stimulated formation response. Dynamic labeling in HBM knock-in mice demonstrates increased formation on selected surfaces. A normal T3 response alone is not evidence of elevated formation, and mature patient bone does not necessarily continue accumulating rapidly throughout adulthood. Increased mineralizing surface and formation rate describe the amount and activity of bone-forming surfaces; they do not imply abnormally high mineral concentration within each unit of bone matrix.

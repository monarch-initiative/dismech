diagnosis:
- name: Dual-energy X-ray absorptiometry with LRP5 sequencing
  description: Radiographic distribution, DXA, family history and molecular assessment are interpreted together. LRP5 evaluation should accommodate sequence changes beyond a first-propeller missense assumption. Normal DXA was reported in R1414S-associated cortical overgrowth, while variant function remained untested. A VUS or isolated mandibular radiographic finding does not by itself establish molecularly confirmed LRP5 high bone mass.
  evidence:
  - reference: PMID:36971833
    reference_title: 'Novel mutation in LRP5 gene cause rare osteosclerosis: cases studies and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The targeted next-generation sequencing (NGS) technology was used to detect pathogenic gene mutations, which were further verified by Sanger sequencing.
    explanation: The diagnostic route used in a contemporary case series.
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both individuals, we detected a novel heterozygous duplication of six basepairs in the LRP5 gene, resulting in an insertion of two amino acids, very likely associated with a gain-of-function.
    explanation: Affected mother and daughter had a heterozygous in-frame duplication; the report proposes gain of function rather than measuring receptor activity.
- name: Bone turnover and circulating Wnt-inhibitor measurements
  description: Normal turnover markers do not exclude high bone mass. In 16 G171V/N198S carriers, 13 unaffected relatives and 24 unrelated controls, mean affected Z-score was 6.4 but CTX and P1NP did not differ significantly across groups. Sclerostin and DKK1 did not distinguish carriers from relatives. SFRP-4 was higher in both affected and unaffected relatives than unrelated controls, so it did not discriminate mutation status within those kindreds. These measurements are not validated confirmatory tests. A prior T253I study had different biomarker findings, limiting generalization across alleles.
  evidence:
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were no differences in CTX or P1NP values among the three groups.
    explanation: Normal-group comparisons despite marked high bone mass; lack of significance is not universal equivalence.
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was no group effect for sclerostin when analyzed by one-way ANOVA
    explanation: Direct measurement in the G171V/N198S kindred comparison.
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there was an overall group effect by one-way ANOVA. When an ANCOVA analysis was conducted for Dkk-1, controlling for age did not affect the results in any pair-wise comparisons among the three groups, all of which remained nonsignificant.
    explanation: DKK1 did not show significant pairwise differences despite a borderline overall group effect.
  - reference: PMID:24927689
    reference_title: "Serum levels of sclerostin, Dickkopf-1, and secreted frizzled-related protein-4 are not changed in individuals with high bone mass causing mutations in LRP5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When age was controlled for, the serum SFRP-4 values in both the affected and unaffected kindreds members remained significantly higher than the mean value in controls (p=0.01 for both comparisons).
    explanation: The full text reports elevated SFRP-4 versus unrelated controls in both family groups; the abstract should not be read as universally unchanged serum concentrations.
differential_diagnoses:
- name: Van Buchem disease
  description: Van Buchem disease is a recessive sclerostin-deficiency disorder associated with SOST regulatory defects, sharing bone overgrowth but differing in inheritance and molecular cause.
  evidence:
  - reference: PMID:22065804
    reference_title: Worth syndrome as a diagnosis for mandibular osteosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'This report aims to clarify the difference in terminology and presentation of two conditions known to produce mandibular osteosclerosis: Worth syndrome and Van Buchem disease, both of which are often quoted synonymously in the literature.'
    explanation: The source exists specifically to separate these two diagnoses, which is why it is the right citation for this differential.
    quote_role: BACKGROUND
- name: Sclerosteosis
  description: SOST-related sclerosteosis causes excessive bone growth through loss of sclerostin activity, often with more severe cranial involvement and syndactyly. It is distinct from dominant LRP5 disease.
  evidence:
  - reference: PMID:17052975
    reference_title: LRP5 mutations linked to high bone mass diseases cause reduced LRP5 binding and inhibition by SOST.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: As loss-of-function mutations in the SOST gene are associated with Sclerosteosis, another disorder of excessive bone growth
    explanation: Background comparison in the receptor study directly names the distinct SOST disorder.
    quote_role: BACKGROUND
- name: Osteopetrosis
  description: Classical resorption-defect osteopetroses, including CLCN7-related type II, often show fracture susceptibility and characteristic radiographic patterns. Normal serum resorption markers alone do not exclude an osteoclast contribution. Historical ADO1 overlaps the LRP5 high-bone-mass literature and is not used here as a mechanistically separate comparator.
  evidence:
  - reference: PMID:12015390
    reference_title: High bone density due to a mutation in LDL-receptor-related protein 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Markers of bone resorption were normal in the affected subjects, whereas markers of bone formation such as osteocalcin were markedly elevated.
    explanation: Marker pattern in the G171V kindred, not a test excluding all osteoclast defects.
  - reference: PMID:40585686
    reference_title: A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: however, these skeletal changes do not seem to lead to an increased risk of fracture
    explanation: Background clinical synthesis concerns excess susceptibility, not immunity to fractures.
    quote_role: BACKGROUND
- name: Osteoporosis-pseudoglioma syndrome
  description: The allelic opposite. Loss-of-function LRP5 variants give low bone mass with fractures and congenital blindness, so LRP5 on a gene panel does not by itself point to either diagnosis; the variant's functional direction does.
  evidence:
  - reference: PMID:12015390
    reference_title: High bone density due to a mutation in LDL-receptor-related protein 5.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Loss-of-function mutations in the gene for low-density lipoprotein receptor-related protein 5 (LRP5), which acts in the Wnt signaling pathway, have been shown to cause osteoporosis-pseudoglioma.
    explanation: The allelic relationship is stated directly.
    quote_role: BACKGROUND
- name: LRP6 high bone mass
  description: LRP6-related high bone mass can resemble LRP5 disease clinically. A negative LRP5 result prompts consideration of LRP6 and other sclerosing dysplasias; it does not establish an LRP6 diagnosis.
  evidence:
  - reference: PMID:37659026
    reference_title: 'LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the detection of pathogenic mutations in the low-density lipoprotein receptor-related protein 6 (LRP6) gene in some patients with autosomal dominant HBM phenotype led to the description of a clinically identical disorder in 2019, called LRP6 HBM
    explanation: Establishes LRP6 HBM as a separate gene producing a clinically identical high-bone-mass disorder.
    quote_role: REVIEW_SYNTHESIS

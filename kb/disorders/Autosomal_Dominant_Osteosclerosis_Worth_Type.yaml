progression:
- phase: Variable onset
  notes: Facial remodeling is often recognized in adolescence, but a normal childhood skeleton is not universal across the broader LRP5 spectrum. Congenital hearing impairment was reported in an insertion-allele carrier and childhood symptoms occur in other families.
  evidence:
  - reference: PMID:40585686
    reference_title: A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The skeleton is normal in childhood, but facial metamorphoses occur in adolescence, as the mandible becomes elongated and the forehead flattens.
    explanation: General background statement in an adolescent case report, not longitudinal proof of a universal normal-childhood phase.
    quote_role: BACKGROUND
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the daughter suffered from congenital hearing impairment resulting in cochlear implantation, recurrent facial palsy, and migraine
    explanation: Molecularly characterized family with early sensory involvement.
- phase: Variable adult course
  notes: Some patients remain stable while others develop progressive complications. Six-year radiographic stability was documented in a woman with a presumptive Worth diagnosis; genetic testing and family analysis were not performed, and alternative diagnoses remained. This observation does not establish universal stability in LRP5 disease.
  evidence:
  - reference: PMID:22065804
    reference_title: Worth syndrome as a diagnosis for mandibular osteosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient subsequently showed no change in radiographic appearance over a 6 year period.
    explanation: Stable mandibular radiographs in a clinically unconfirmed case, whose authors retained alternative diagnoses.
  - reference: PMID:22065804
    reference_title: Worth syndrome as a diagnosis for mandibular osteosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As both conditions are known to show mandibular bony involvement, this case may either be Worth syndrome, a variant of Van Buchem disease, or simply extensive mandibular tori.
    explanation: Full text explicitly limits diagnostic certainty.
pathophysiology:
- name: LRP5 Activating Variation
  biological_scale: MOLECULAR
  description: Heterozygous LRP5 activating variants cause inherited high bone mass. Many established missense variants cluster in the first extracellular beta-propeller; in-frame insertion alleles also occur. Tested HBM receptor variants have reduced binding or sensitivity to extracellular antagonists. This region participates in a receptor whose ligand binding, trafficking and inhibition are interdependent; it is not simply an isolated non-Wnt-binding brake. The reported cytoplasmic R1414S association has not been functionally shown to use the same mechanism.
  genes:
  - preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  genetic_context:
    gene:
      preferred_term: LRP5
      term:
        id: hgnc:6697
        label: LRP5
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: Heterozygous germline variants with activating effects include experimentally characterized extracellular substitutions and an associated in-frame insertion. Functional interpretation remains uncertain for some reported alleles.
  evidence:
  - reference: PMID:12579474
    reference_title: Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Like the previously reported mutation (G171V) that causes the high-bone-mass phenotype, all mutations are located in the aminoterminal part of the gene, before the first epidermal growth factor-like domain.
    explanation: Domain clustering in the variants studied in 2003, not a universal claim about subsequent reports.
  - reference: PMID:12015390
    reference_title: High bone density due to a mutation in LDL-receptor-related protein 5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Affected members of the kindred had a mutation in this gene, with valine substituted for glycine at codon 171 (LRP5V171).
    explanation: The founding kindred's variant is identified and shown to segregate with the trait.
  - reference: PMID:29208525
    reference_title: 'Novel familial mutation of LRP5 causing high bone mass: Genetic analysis, clinical presentation, and characterization of bone matrix mineralization.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both individuals, we detected a novel heterozygous duplication of six basepairs in the LRP5 gene, resulting in an insertion of two amino acids, very likely associated with a gain-of-function.
    explanation: Affected mother and daughter had a heterozygous in-frame duplication; the report proposes gain of function rather than measuring receptor activity.

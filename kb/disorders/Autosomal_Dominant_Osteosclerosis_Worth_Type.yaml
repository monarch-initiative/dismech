    snippet: The (2.3kb) Col1a1-Dkk1 transgene significantly lowered whole-body BMD, BMC, and vertebral BV/TV in wild-type mice and affected p.A214V mice more than p.G171V mice.
    explanation: DKK1 resistance is allele-dependent, so the two inhibitors are not equivalently escaped. This is why the node names both inhibitors but the description says the alleles differ.
  - reference: PMID:17052975
    reference_title: LRP5 mutations linked to high bone mass diseases cause reduced LRP5 binding and inhibition by SOST.

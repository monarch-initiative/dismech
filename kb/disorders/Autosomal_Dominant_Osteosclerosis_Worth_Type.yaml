inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant transmission was established radiographically in 1977, before the
    gene was known, and it is what separated this entity from the recessive Van
    Buchem disease.
  evidence:
  - reference: PMID:198847
    reference_title: "Autosomal dominant osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant osteosclerosis, an entity previously labelled by various
      names, is clearly separate from Van Buchem disease; Van Buchem disease
      exhibits autosomal recessive inheritance.
    explanation: >-
      The original delineation is built on the contrast in inheritance pattern
      with Van Buchem disease.
prevalence:
- population: Reported LRP5 high bone mass literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2023 historical review counted 155 patients reported since the first
    descriptions, pooling pre-2002 Worth-type cases with genetically confirmed
    LRP5 cases since.
  evidence:
  - reference: PMID:37659026
    reference_title: "LRP5 high bone mass (Worth-type autosomal dominant endosteal hyperostosis): case report and historical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Including the present case, 155 patients have been reported to date.
    explanation: >-
      The review gives the cumulative published case count directly.
progression:
- phase: Childhood
  notes: >-
    The skeleton is described as normal in childhood; the disorder is not
    congenital in its visible form.
  evidence:
  - reference: PMID:40585686
    reference_title: "A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The skeleton is normal in childhood, but facial metamorphoses occur in
      adolescence, as the mandible becomes elongated and the forehead flattens.
    explanation: >-
      The source states the childhood-normal, adolescence-onset course directly.
- phase: Adolescence onward
  notes: >-
    Facial change begins in adolescence with mandibular elongation and forehead
    flattening. Many patients are found incidentally in adulthood on a dental
    panoramic radiograph, and one reported patient showed no radiographic change
    over six years of follow-up.
  evidence:
  - reference: PMID:22065804
    reference_title: "Worth syndrome as a diagnosis for mandibular osteosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient subsequently showed no change in radiographic appearance over a
      6 year period.
    explanation: >-
      Radiographic stability over six years supports a non-progressive adult
      course, which is what makes the condition benign.
pathophysiology:
- name: LRP5 First-Propeller Missense Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants clustered in the amino-terminal first
    beta-propeller of LRP5, before the first EGF-like domain. The same small
    region accounts for high bone density across several diagnoses that were
    historically kept apart.
  genes:
  - preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  genetic_context:
    gene:
      preferred_term: LRP5
      term:
        id: hgnc:6697
        label: LRP5
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous first-propeller missense alleles that block sclerostin and
      DKK1 inhibition of the receptor. The gain of function is in the receptor's
      escape from regulation, not in raised ligand or raised receptor abundance.
  evidence:
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like the previously reported mutation (G171V) that causes the
      high-bone-mass phenotype, all mutations are located in the aminoterminal
      part of the gene, before the first epidermal growth factor-like domain.
    explanation: >-
      The clustering of the causal variants in one domain is stated directly.
  - reference: PMID:12015390
    reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected members of the kindred had a mutation in this gene, with valine
      substituted for glycine at codon 171 (LRP5V171).
    explanation: >-
      The founding kindred's variant is identified and shown to segregate with
      the trait.
  downstream:
  - target: LRP5 Resistance to Sclerostin and DKK1
    causal_link_type: DIRECT
    description: >-
      The variants sit in the surface where the secreted inhibitors bind, so the
      receptor stops responding to them.
    evidence:
    - reference: PMID:12015390
      reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro studies showed that the normal inhibition of Wnt signaling by
        another protein, Dickkopf-1 (Dkk-1), was defective in the presence of
        LRP5V171
      explanation: >-
        The causal step from the variant to lost inhibitor responsiveness is
        measured directly for the founding allele.
- name: LRP5 Resistance to Sclerostin and DKK1
  biological_scale: MOLECULAR
  description: >-
    The mutant receptor no longer responds to the two secreted Wnt inhibitors
    that normally restrain bone formation. Knock-in mice carrying the human
    p.G171V and p.A214V alleles are protected from osteopenia induced by
    overexpressing either inhibitor, which is the in vivo demonstration of the
    same mechanism.
  genes:
  - preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  - preferred_term: SOST
    term:
      id: hgnc:13771
      label: SOST
  biological_processes:
  - preferred_term: negative regulation of canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0090090
      label: negative regulation of canonical Wnt signaling pathway
  evidence:
  - reference: PMID:25808845
    reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed that the (8kb) Dmp1-SOST transgene significantly lowered
      whole-body bone mineral density (BMD), bone mineral content (BMC), femoral
      and vertebral trabecular bone volume fraction (BV/TV), and periosteal
      bone-formation rate (BFR) in wild-type mice but not in mice with Lrp5
      p.G171V and p.A214V alleles.
    explanation: >-
      Overexpressed sclerostin lowers bone mass in wild-type but not in
      HBM-allele mice, which is the inhibitor-resistance claim tested in vivo
      rather than in a reporter assay.
  - reference: PMID:25808845
    reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The (2.3kb) Col1a1-Dkk1 transgene significantly lowered whole-body BMD,
      BMC, and vertebral BV/TV in wild-type mice and affected p.A214V mice more
      than p.G171V mice.
    explanation: >-
      DKK1 resistance is allele-dependent, so the two inhibitors are not
      equivalently escaped. This is why the node names both inhibitors but the
      description says the alleles differ.
  downstream:
  - target: Unrestrained Canonical Wnt Signalling in Bone
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12015390
      reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the normal inhibition of Wnt signaling by another protein, Dickkopf-1
        (Dkk-1), was defective in the presence of LRP5V171 and that this resulted
        in increased signaling
      explanation: >-
        Loss of inhibition is shown to result in increased signalling in the same
        experiment.
- name: Unrestrained Canonical Wnt Signalling in Bone
  biological_scale: CELLULAR
  description: >-
    Canonical Wnt/beta-catenin output in the osteoblast lineage is raised because
    the receptor is deaf to its inhibitors, not because ligand is more abundant.
    The modifier here is GAIN_OF_FUNCTION rather than INCREASED for that reason:
    the pathway is running outside its normal regulatory constraints, which is a
    qualitative change, not a quantitative one.
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  evidence:
  - reference: PMID:12015390
    reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levels of fibronectin, a known target of signaling by Wnt, a developmental
      protein, were also elevated.
    explanation: >-
      A downstream Wnt target is raised in the patients themselves, so the
      pathway claim is not resting on the in vitro reporter alone.
  downstream:
  - target: Increased Osteoblastic Bone Formation with Normal Resorption
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12015390
      reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Markers of bone resorption were normal in the affected subjects, whereas
        markers of bone formation such as osteocalcin were markedly elevated.
      explanation: >-
        The formation/resorption dissociation is measured in patients and is what
        distinguishes this mechanism from an osteopetrosis.
- name: Increased Osteoblastic Bone Formation with Normal Resorption
  biological_scale: TISSUE
  description: >-
    Bone formation markers are raised while resorption markers stay normal. This
    is the point that separates the disorder from osteopetrosis, where the defect
    is failed resorption and the bone is brittle. Here the bone is added, not
    retained, and it is mechanically sound.
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  - preferred_term: bone mineralization
    modifier: INCREASED
    term:
      id: GO:0030282
      label: bone mineralization
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  evidence:
  - reference: PMID:12015390
    reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Markers of bone resorption were normal in the affected subjects, whereas
      markers of bone formation such as osteocalcin were markedly elevated.
    explanation: >-
      Directly measured in the founding kindred.
  downstream:
  - target: Endosteal Hyperostosis and Cortical Thickening
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:198847
      reference_title: "Autosomal dominant osteosclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Radiographic manifestations include endosteal sclerosis of the
        neurocranium with loss of the diploë, osteosclerosis and hyperostosis of
        the mandible with absence of the normal antegonial notches, endosteal
        sclerosis of the diaphyses of long bones (including metacarpals and
        metatarsals), and osteosclerosis of the pelvis.
      explanation: >-
        The anatomical distribution of the added bone is described in full in the
        original radiographic delineation.
- name: Endosteal Hyperostosis and Cortical Thickening
  biological_scale: TISSUE
  description: >-
    Bone is added from the endosteal surface inward: the cranial diploe is lost,
    long-bone diaphyses and the pelvis sclerose, and the mandible thickens and
    loses its antegonial notches. Because the deposition is endosteal, the
    marrow cavity narrows while the external contour is largely preserved.
  locations:
  - preferred_term: endosteum
    term:
      id: UBERON:0009859
      label: endosteum
  - preferred_term: skull
    term:
      id: UBERON:0003129
      label: skull
  - preferred_term: mandible

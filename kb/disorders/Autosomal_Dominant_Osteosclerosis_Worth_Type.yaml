inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Dominant transmission was established radiographically in 1977, before the gene was known, and it is what separated this entity from the recessive Van Buchem disease.
  evidence:
  - reference: PMID:198847
    reference_title: Autosomal dominant osteosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal dominant osteosclerosis, an entity previously labelled by various names, is clearly separate from Van Buchem disease; Van Buchem disease exhibits autosomal recessive inheritance.
    explanation: The original delineation is built on the contrast in inheritance pattern with Van Buchem disease.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  notes: A 2023 historical review assembled 155 clinically described cases, of whom 64 had genetic testing. This is a literature count across changing terminology and ascertainment, not a population prevalence estimate or a genetically confirmed carrier cohort.
  evidence:

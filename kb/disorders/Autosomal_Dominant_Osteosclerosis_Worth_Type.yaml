- category: Craniofacial
  name: Progressive coarse facial change
  description: >-
    Coarsening of the face from adolescence, driven by mandibular elongation and
    enlarged, protruding gonial angles. Deliberately left unbound: HPO has no
    term for the composite, and the frontal component is reported inconsistently
    across sources -- the case report cited here describes the forehead
    flattening, while other summaries of the disorder describe a prominent
    forehead. Binding either HPO forehead term would assert a direction the
    citable evidence here does not settle, and binding the wrong one would put
    the term in flat contradiction with the entry's own progression quote.
  frequency: FREQUENT

genetic:
- name: LRP5
  gene_term:
    preferred_term: LRP5
    term:
      id: hgnc:6697
      label: LRP5
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported alleles include G171V in the founding kindred, D111Y, G171R, A214T,
    A214V, A242T and T253I from the 2003 survey, and the more recently reported
    p.Met282Val, all in the first beta-propeller. Transmission is not always
    familial: p.Met282Val arose de novo in its index patient, so an absent family
    history does not argue against the diagnosis. Note also the allelic contrast:
    loss-of-function LRP5 variants cause osteoporosis-pseudoglioma syndrome, the
    opposite bone phenotype, so the variant's functional direction, not the gene
    identity, determines the disease.
  variants:
  - name: p.Met282Val
    description: >-
      A more recently reported first-propeller allele, notable for arising de
      novo. Its clinical significance was returned as uncertain on the diagnostic
      panel, which is worth carrying rather than smoothing over.
    gene:
      preferred_term: LRP5
      term:
        id: hgnc:6697
        label: LRP5
    evidence:
    - reference: PMID:40585686
      reference_title: "A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our case represents a de novo heterozygous variant of the LRP5 gene.
      explanation: >-
        Establishes the de novo occurrence, which is the point that changes how
        a negative family history should be read.
    - reference: PMID:40585686
      reference_title: "A Case of Endosteal Hyperostosis Caused by a Mutation of the Low-Density Lipoprotein Receptor-Related Protein 5 (LRP5) Gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A salivary Skeletal Dysplasias Core Panel testing for 358 genes revealed
        the patient has a de novo variant in the heterozygous state LRP5 (c.844A>G,
        p.Met282Val-uncertain significance).
      explanation: >-
        Gives the allele, its de novo status, and that the panel returned it as
        of uncertain significance. The last part is recorded because the entry
        should not present the variant as more firmly established than its
        source does.
  - name: p.Gly171Val
    description: >-
      The founding kindred's variant, in the conserved propeller motif.
    evidence:
    - reference: PMID:12015390
      reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This mutation segregated with the trait in the family and was absent in
        control subjects.
      explanation: >-
        Segregation plus absence in controls is the evidence that this variant
        causes the phenotype.
  evidence:
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of these were confirmed as polymorphisms, but six novel missense
      mutations (D111Y, G171R, A214T, A214V, A242T, and T253I) are most likely
      disease causing.
    explanation: >-
      The allelic series is enumerated, including the A242T allele carried by the
      patient in the 2023 review.
  - reference: PMID:12015390
    reference_title: "High bone density due to a mutation in LDL-receptor-related protein 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function mutations in the gene for low-density lipoprotein
      receptor-related protein 5 (LRP5), which acts in the Wnt signaling pathway,
      have been shown to cause osteoporosis-pseudoglioma.
    explanation: >-
      Supports the allelic contrast recorded in the notes: the same gene's loss
      of function gives the opposite bone phenotype.

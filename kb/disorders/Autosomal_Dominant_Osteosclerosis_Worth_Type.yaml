name: Autosomal Dominant Osteosclerosis Worth Type
creation_date: "2026-08-31T15:10:00Z"
description: >-
  Worth-type autosomal dominant osteosclerosis, now more often called LRP5 high
  bone mass, is a benign sclerosing bone dysplasia caused by heterozygous
  missense variants in the first beta-propeller of LRP5. Those variants make the
  Wnt co-receptor resistant to its physiological inhibitors sclerostin and
  DKK1, so canonical Wnt signalling in bone runs without its normal brake.
  Osteoblastic bone formation rises while resorption stays normal, producing
  lifelong endosteal hyperostosis with a widened, deepened mandible, torus
  palatinus, and dense but not brittle bone. It is the receptor-side mirror of
  sclerosteosis and Van Buchem disease, which lose the SOST ligand instead, and
  the allelic opposite of osteoporosis-pseudoglioma syndrome, which loses LRP5
  function altogether.
category: Mendelian
disease_term:
  preferred_term: autosomal dominant osteosclerosis, Worth type
  term:

notes: >-
  The frontal component of the facial change is reported inconsistently: the
  case report cited here describes forehead flattening, while other summaries
  of the disorder describe a prominent forehead. The phenotype is therefore left
  with no HPO binding rather than asserting a direction. Citing the Orphanet
  record to settle it is not currently possible -- `just refresh-orphadata`
  fails its pinned checksum gate (issue #9687 and duplicates), so no new ORPHA
  record can be cached.

  Two further framings are worth keeping straight. Mechanistically this disorder belongs
  with sclerosteosis and Van Buchem disease: all three raise canonical Wnt output
  in bone, the other two by removing the SOST inhibitor and this one by making
  the receptor deaf to it. Clinically it is much milder than either, and most
  patients are found incidentally on dental imaging. The percentages quoted from
  the 2023 review pool pre-2002 clinically diagnosed cases with post-2002
  genetically confirmed ones, and should be read as orders of magnitude rather
  than as cohort statistics -- see the open discussion on naming.

animal_models:
- name: Lrp5 p.G171V and p.A214V high-bone-mass knock-in mice
  species: Mouse
  genotype: Human p.G171V or p.A214V knocked into the endogenous Lrp5 locus
  publication: PMID:25808845
  description: >-
    Knock-in mice carrying the human HBM alleles, crossed with transgenics
    overexpressing SOST in osteocytes or DKK1 in osteoblasts and osteocytes.
    The design tests inhibitor resistance in a living skeleton rather than in a
    reporter assay.
  modeled_mechanisms:
  - target: LRP5 Resistance to Sclerostin and DKK1
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Overexpressed sclerostin lowers bone mass in wild-type mice but not in the
      HBM-allele mice, and DKK1 overexpression affects p.A214V more than
      p.G171V.
    limitations: >-
      Resistance is allele-specific and differs between the two inhibitors, so
      the model does not support a blanket statement that HBM receptors escape
      inhibition. It also tests transgenic overexpression of the inhibitors,
      which is a larger perturbation than physiological inhibitor levels.
    readouts:
    - name: Bone mineral density under SOST overexpression
      target: LRP5 Resistance to Sclerostin and DKK1
      direction: UNCHANGED
      interpretation: >-
        The HBM alleles do not lose bone mass when sclerostin is overexpressed,
        whereas wild-type mice do. UNCHANGED is the informative result here.
      evidence:
      - reference: PMID:25808845
        reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We observed that the (8kb) Dmp1-SOST transgene significantly lowered
          whole-body bone mineral density (BMD), bone mineral content (BMC),
          femoral and vertebral trabecular bone volume fraction (BV/TV), and
          periosteal bone-formation rate (BFR) in wild-type mice but not in mice
          with Lrp5 p.G171V and p.A214V alleles.
        explanation: >-
          The contrast between wild-type and knock-in animals is the measurement.
    evidence:
    - reference: PMID:25808845
      reference_title: "High Bone Mass-Causing Mutant LRP5 Receptors Are Resistant to Endogenous Inhibitors In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These in vivo data support in vitro studies regarding the mechanism of
        HBM-causing mutations, and imply that HBM LRP5 receptors differ in their
        relative sensitivity to inhibition
      explanation: >-
        The authors state both what the model confirms and the qualification that
        the alleles differ, which is what makes it informative for this node.
discussions:
- discussion_id: worth_lrp5_naming
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are Worth-type autosomal dominant osteosclerosis, autosomal dominant endosteal
    hyperostosis and "the LRP5 high bone mass phenotype" one entity or several?
  attaches_to:
  - disease#Autosomal Dominant Osteosclerosis Worth Type
  - genetic#LRP5
  rationale: >-
    The 2003 mutation survey found LRP5 first-propeller variants across four
    separately named diagnoses -- endosteal hyperostosis, Van Buchem disease,
    autosomal dominant osteosclerosis and osteopetrosis type I -- and concluded
    that the diagnostic labels do not track the genetics. The 2023 review had to
    pool pre-2002 clinical cases with post-2002 genetic ones to reach a case
    count at all. This matters for curation: the 155-patient figure and the
    percentages derived from it rest on a case definition that changed halfway
    through the series, so the frequencies in this entry are less precise than
    their decimal places suggest.
  status: OPEN
  evidence:
  - reference: PMID:12579474
    reference_title: "Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene in different conditions with an increased bone density."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that, despite the different diagnoses that can be
      made, conditions with an increased bone density affecting mainly the
      cortices of the long bones and the skull are often caused by mutations in
      the LRP5 gene.
    explanation: >-
      The authors state that the clinical diagnoses do not correspond to distinct
      genetic entities, which is the substance of this gap.

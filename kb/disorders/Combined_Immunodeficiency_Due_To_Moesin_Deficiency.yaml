- name: Profound Lymphopenia and Leukopenia
  biological_scale: ORGANISM
  description: >-
    Severe leukopenia affecting T and B cells and neutrophils, with fluctuating
    monocytopenia; NK-cell counts vary across reported patients, summarized as
    T-B-NK- lymphopenia in ClinGen's disease curation whereas newborn-screened
    infants with SCID-like disease have presented with a T-B-NK+ phenotype. The
    breadth across lineages is what makes this a combined immunodeficiency
    rather than a T-cell-selective one.

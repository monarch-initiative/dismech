- name: Hemizygous MSN Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Hemizygous missense or nonsense loss-of-function variants in MSN on the X
    chromosome reduce or abolish moesin mRNA and protein expression in
    lymphocytes and eliminate moesin-mediated actin filament binding at the
    cell cortex.

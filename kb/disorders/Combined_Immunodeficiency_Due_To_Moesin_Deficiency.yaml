    snippet: "The ezrin-radixin-moesin (ERM) proteins are a family of membrane-associated proteins that link membrane proteins with actin filaments in the cell cortex and regulate many cellular processes, including cell shape determination, membrane transport, and signal transduction."
    explanation: >-
      Grounds moesin's molecular function in binding cortical actin filaments to
      plasma-membrane proteins, the activity lost in MSN-deficient lymphocytes.
- name: Loss of Cortical Actin-Membrane Cross-Linking
  biological_scale: CELLULAR
  description: >-
    Moesin is an ERM protein that anchors filamentous actin at the cell cortex
    to plasma-membrane proteins. Loss of moesin degrades the lymphocyte's
    ability to remodel its cortical cytoskeleton, impairing the shared
    mechanical scaffold required for migration, adhesion, chemokine receptor
    display, and proliferative expansion.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  biological_processes:
  - preferred_term: cortical actin cytoskeleton organization
    modifier: DECREASED
    term:
      id: GO:0030866
      label: cortical actin cytoskeleton organization
  downstream:
  - target: Impaired Lymphocyte Migration and Adhesion
    description: >-
      Chemotaxis and adhesion both require regulated cortical actin remodelling.
  - target: Impaired Lymphocyte Proliferation
    description: >-
      Proliferation is impaired in patient cells and is restored by wild-type
      MSN, establishing the dependency rather than merely the association.

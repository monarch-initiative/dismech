discussions:
- discussion_id: xmaid_evidence_base_is_one_series
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines clinical severity across carriers of identical MSN variants,
    and what is the prevalence, systemic spectrum, and cellular mechanism (such
    as CD8+ regulatory T-cell loss) of autoimmunity in human X-MAID?
  attaches_to:
  - disease#Combined Immunodeficiency Due To Moesin Deficiency
  - treatments#Allogeneic hematopoietic stem cell transplantation
  rationale: >-
    Published human cohorts remain small (11 unrelated probands in ClinGen's
    2023 review and three transplanted patients in PMID:31139601), yet patients
    carrying the identical hemizygous p.Arg171Trp variant span a wide clinical
    spectrum from infantile T-B-NK+ SCID requiring allogeneic transplantation to
    milder combined immunodeficiency managed into adulthood with immunoglobulin
    replacement, antibiotic prophylaxis, and G-CSF. Autoimmune cytopenias
    (thrombotic thrombocytopenic purpura in founding-cohort patient P3 and
    IVIg-responsive immune thrombocytopenia in the adult proband of
    PMID:29556235) occur in a subset of affected males.

    Key unresolved questions include what genetic or environmental modifiers
    determine whether p.Arg171Trp presents as neonatal SCID versus chronic
    combined immunodeficiency, which patients warrant early myeloablative
    transplantation versus conservative supportive care, what the true
    prevalence and broader systemic spectrum of autoimmunity are across aging
    untransplanted cohorts, and whether human autoimmunity in X-MAID is driven
    by loss of an analogous IL-15-dependent CD8+ regulatory T-cell subset as
    demonstrated in moesin-deficient mice.
  evidence:
  - reference: PMID:31139601
    reference_title: "Hematopoietic Stem Cell Transplant for the Treatment of X-MAID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-MAID patients appear to have a spectrum of clinical severity despite the presence of identical variants."
    explanation: >-
      Directly highlights unexplained phenotypic heterogeneity among patients
      sharing the recurrent MSN variant.
  - reference: PMID:29556235
    reference_title: "Exome Sequencing Diagnoses X-Linked Moesin-Associated Immunodeficiency in a Primary Immunodeficiency Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We compared the Lagresle-Peyrou et al. cases’ (P1-P7) and proband phenotypes in more detail and we surmise the P3 case would be the most similar to the proband in terms of clinical outcomes due to both individuals presenting with no eczema, no Molluscum contagiosum, and presentation of an autoimmune reaction in the form of TTP (P3) and ITP (proband)."
    explanation: >-
      Documents autoimmune cytopenias (TTP and ITP) in two unrelated patients,
      leaving the broader prevalence and cellular mechanism of human
      autoimmunity in X-MAID to be defined.
  - reference: PMID:28978692
    reference_title: "The ERM Protein Moesin Regulates CD8(+) Regulatory T Cell Homeostasis and Self-Tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings underscore the importance of moesin in IL-15-dependent CD8+ Treg cell homeostasis and, thus, the control of self-tolerance."
    explanation: >-
      Establishes the mouse CD8+ Treg self-tolerance defect whose human
      mechanistic counterpart in X-MAID autoimmunity remains unresolved.

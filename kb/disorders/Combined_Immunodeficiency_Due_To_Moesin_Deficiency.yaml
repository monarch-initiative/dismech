genetic:
- name: MSN
  gene_term:
    preferred_term: MSN
    term:
      id: hgnc:7373
      label: MSN
  relationship_type: CAUSATIVE
  notes: >-
    MSN encodes moesin, one of the three ERM (ezrin-radixin-moesin) proteins that
    cross-link cortical actin to the plasma membrane. The gene is on the X
    chromosome, which is why the disorder is X-linked and all reported patients
    are male.

    The binding here is hgnc:7373. Note that a substring search for "MSN" in HGNC
    also returns SAMSN1 (hgnc:10528) and MSNP1 (hgnc:7374), the moesin pseudogene;
    the CURIE bound here was resolved with an exact-label lookup for that reason.
  evidence:
  - reference: PMID:27405666
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hemizygous mutations in the moesin (MSN) gene (located on the X chromosome and coding for MSN) in all 7 patients"
    explanation: >-
      Establishes the gene, its chromosomal location and the hemizygous state.
animal_models:
- name: Moesin-deficient mouse
  species: Mouse
  genotype: Msn-deficient
  publication: PMID:28978692
  description: >-
    Unlike several other models curated in this knowledge base, this one
    reproduces the defining human abnormality: moesin-deficient mice are
    lymphopenic in a way similar to patients. It also goes beyond the human data,
    identifying an IL-15-dependent CD8+ regulatory T cell population whose loss
    permits accumulation of germinal centre B cells and follicular helper T cells.
  modeled_mechanisms:
  - target: Profound Lymphopenia and Leukopenia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the lymphopenia that defines the human disorder, at the
      whole-organism scale.
    limitations: >-
      The paper's own comparison is that the mouse phenotype is "similar", not
      identical, and the curated record does not establish that the mouse
      reproduces the neutropenia, monocytopenia or varicella susceptibility seen
      in patients.
    readouts:
    - name: Lymphocyte count
      target: Profound Lymphopenia and Leukopenia
      direction: DECREASED
      interpretation: >-
        The haematological correlate of the human lymphopenia in the model.
      evidence:
      - reference: PMID:28978692
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "moesin-deficient mice exhibit a similar lymphopenia phenotype"
        explanation: >-
          Reports the direction and the comparison to the human phenotype.
    evidence:
    - reference: PMID:28978692
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutations in the moesin gene in humans are associated with primary immunodeficiency with profound lymphopenia, and moesin-deficient mice exhibit a similar lymphopenia phenotype."
      explanation: >-
        States the human-model correspondence explicitly, which is what justifies
        RECAPITULATES rather than a weaker relationship.
  - target: Loss of Cortical Actin-Membrane Cross-Linking
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model additionally identifies a specific cellular consequence not
      established in patients: loss of an IL-15-dependent CD8+ regulatory T cell
      population, with a resulting breakdown of self-tolerance.
    limitations: >-
      This is a mouse-only finding. The CD8+CD44+CD122+Ly49+ regulatory T cell
      population it depends on has not been shown to be the relevant one in
      patients, and the human series curated here reports infection
      susceptibility rather than the autoimmunity this arm predicts. Treat it as
      a mechanistic hypothesis for the human disease, not as a curated human
      finding.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        CD8+ regulatory T cell subsets defined by CD44, CD122 and Ly49 are a mouse
        characterisation. The equivalent human population and its dependence on
        moesin are not established by anything curated here.
    evidence:
    - reference: PMID:28978692
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings underscore the importance of moesin in IL-15-dependent CD8+ Treg cell homeostasis and, thus, the control of self-tolerance."
      explanation: >-
        States the mouse-derived mechanism this link records.
    - reference: PMID:28978692
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Germinal center B cells and follicular helper T cells spontaneously accumulated in unimmunized mice, and CD8+CD44+CD122+Ly49+ regulatory T (CD8+ Tregs) cells, which inhibit the expansion of follicular helper T cells, were severely reduced in these mice."
      explanation: >-
        Gives the cellular detail, including the marker definition that makes this
        a mouse-specific characterisation.
  evidence:
  - reference: PMID:28978692
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "moesin-deficient mice exhibit a similar lymphopenia phenotype"
    explanation: >-
      Attests that this model is informative for the human disorder.
treatments:
- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    Replacement of the affected haematopoietic compartment. Moesin acts in
    lymphocytes and other leukocytes, all haematopoietic, so transplantation
    addresses the lesion in the lineages where it matters.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Hemizygous MSN Loss-of-Function Variants
    description: >-
      Replaces MSN-deficient haematopoietic cells with donor cells carrying
      functional MSN, removing the lesion from the affected lineages.
  notes: >-
    The curated evidence is a single case report. That is recorded as the
    strength of the evidence rather than presented as established practice, and
    the transplant literature quoted alongside it concerns other
    immunodeficiencies (Wiskott-Aldrich syndrome, SCID) and is cited only for the
    principles it establishes about engraftment and timing.
  evidence:
  - reference: PMID:31139601
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked moesin-associated immunodeficiency (X-MAID) is a recently described form of primary immunodeficiency, characterized by severe leukopenia affecting T and B cells as well as neutrophils (1)."
    explanation: >-
      Establishes that this case report concerns the disease in question. The
      report's title states its subject is transplantation for X-MAID.
  - reference: PMID:31139601
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several studies have highlighted better outcomes for SCID patients diagnosed and transplanted early in life, a key element of justifying implementation of newborn SCID screening in the US and other countries (6, 7)."
    explanation: >-
      Marked INDIRECT deliberately, and worth reading as such. This sentence is
      about SCID, not X-MAID. It is cited for the timing principle the case report
      invokes, and the explanation says so rather than letting a quote about a
      different disease read as evidence about this one.
discussions:
- discussion_id: xmaid_evidence_base_is_one_series
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history and treatment outcome of X-MAID beyond the
    founding series and a single transplant case?
  attaches_to:
  - disease#Combined Immunodeficiency Due To Moesin Deficiency
  - treatments#Allogeneic hematopoietic stem cell transplantation
  rationale: >-
    Nearly all the clinical content of this entry comes from one 2016 series of
    seven males from five families, with an independent exome diagnosis
    confirming the gene in one further patient. The only curated treatment
    evidence is a single transplant case report.

    That is enough to establish the disease and its mechanism, and not enough to
    say how it behaves over time or how well transplantation works. Specifically
    unaddressed: whether the fluctuating cytopenias fluctuate predictably or
    progress, whether the varicella susceptibility persists after immune
    reconstitution, what proportion of patients need transplantation rather than
    immunoglobulin replacement and prophylaxis, and whether the autoimmune arm
    predicted by the mouse CD8+ Treg finding appears in patients followed long
    enough.

    The last of these is the sharpest, because the mouse and the human series
    currently point in different directions: the mouse loses self-tolerance, the
    patients present with infection.
  evidence:
  - reference: PMID:27405666
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated 7 male patients (from 5 different families)"
    explanation: >-
      Establishes the size of the founding series, which is the basis for the
      claim that the evidence base is narrow.
  - reference: PMID:28978692
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings underscore the importance of moesin in IL-15-dependent CD8+ Treg cell homeostasis and, thus, the control of self-tolerance."
    explanation: >-
      The mouse self-tolerance finding that the human series does not report,
      which is the specific discrepancy named in this gap.

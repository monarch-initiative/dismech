animal_models:
- name: Moesin-deficient mouse
  species: Mouse
  genotype: Msn-deficient
  publication: PMID:28978692
  description: >-
    Moesin-deficient mice reproduce the defining human hematological
    abnormality, exhibiting peripheral lymphopenia comparable to X-MAID
    patients, and additionally reveal loss of an IL-15-dependent CD8+ regulatory
    T-cell population with spontaneous accumulation of germinal center B cells
    and follicular helper T cells.
  modeled_mechanisms:
  - target: Profound Lymphopenia and Leukopenia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the lymphopenia that defines the human disorder, at the
      whole-organism scale.
    limitations: >-
      The paper's own comparison is that the mouse phenotype is "similar", not
      identical, and the curated record does not establish that the mouse
      reproduces the neutropenia, monocytopenia or varicella susceptibility seen
      in patients.
    readouts:
    - name: Lymphocyte count
      target: Profound Lymphopenia and Leukopenia
      direction: DECREASED
      interpretation: >-
        The haematological correlate of the human lymphopenia in the model.
      evidence:
      - reference: PMID:28978692
        reference_title: "The ERM Protein Moesin Regulates CD8(+) Regulatory T Cell Homeostasis and Self-Tolerance."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "moesin-deficient mice exhibit a similar lymphopenia phenotype"
        explanation: >-
          Reports the direction and the comparison to the human phenotype.
    evidence:
    - reference: PMID:28978692
      reference_title: "The ERM Protein Moesin Regulates CD8(+) Regulatory T Cell Homeostasis and Self-Tolerance."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutations in the moesin gene in humans are associated with primary immunodeficiency with profound lymphopenia, and moesin-deficient mice exhibit a similar lymphopenia phenotype."
      explanation: >-
        States the human-model correspondence explicitly, which is what justifies
        RECAPITULATES rather than a weaker relationship.
  - target: Loss of Cortical Actin-Membrane Cross-Linking
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model additionally identifies a specific cellular consequence whose
      human counterpart has not been established: loss of an IL-15-dependent
      CD8+ regulatory T cell population, with a resulting breakdown of
      self-tolerance.
    limitations: >-
      Although autoimmune cytopenias (thrombotic thrombocytopenic purpura and
      immune thrombocytopenia) occur in a subset of human X-MAID patients
      (PMID:29556235), the CD8+CD44+CD122+Ly49+ regulatory T cell population
      identified in moesin-deficient mice has not been shown to mediate human
      autoimmunity, and systemic lupus-like autoimmunity with spontaneous
      germinal center accumulation has not been established in patients. Treat
      this CD8+ Treg pathway as a mechanistic hypothesis for human autoimmunity
      rather than a demonstrated human cellular mechanism.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        CD8+ regulatory T cell subsets defined by CD44, CD122 and Ly49 are a mouse
        characterisation. The equivalent human population and its dependence on
        moesin are not established by anything curated here.
    evidence:
    - reference: PMID:28978692
      reference_title: "The ERM Protein Moesin Regulates CD8(+) Regulatory T Cell Homeostasis and Self-Tolerance."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings underscore the importance of moesin in IL-15-dependent CD8+ Treg cell homeostasis and, thus, the control of self-tolerance."
      explanation: >-
        States the mouse-derived mechanism this link records.
    - reference: PMID:28978692
      reference_title: "The ERM Protein Moesin Regulates CD8(+) Regulatory T Cell Homeostasis and Self-Tolerance."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Germinal center B cells and follicular helper T cells spontaneously accumulated in unimmunized mice, and CD8+CD44+CD122+Ly49+ regulatory T (CD8+ Tregs) cells, which inhibit the expansion of follicular helper T cells, were severely reduced in these mice."
      explanation: >-
        Gives the cellular detail, including the marker definition that makes this
        a mouse-specific characterisation.
  evidence:
  - reference: PMID:28978692
    reference_title: "The ERM Protein Moesin Regulates CD8(+) Regulatory T Cell Homeostasis and Self-Tolerance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "moesin-deficient mice exhibit a similar lymphopenia phenotype"
    explanation: >-
      Attests that this model is informative for the human disorder.
treatments:
- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    Allogeneic hematopoietic cell transplantation replaces the MSN-deficient
    hematopoietic compartment with donor-derived progenitors and achieves full
    multilineage immune reconstitution when performed with matched cord blood or
    related bone marrow and myeloablative conditioning.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Loss of Cortical Actin-Membrane Cross-Linking
    treatment_effect: RESTORES
    description: >-
      Replaces MSN-deficient hematopoietic cells with donor cells carrying
      functional MSN, restoring cortical actin-membrane cross-linking across
      lymphoid and myeloid lineages.
    evidence:
    - reference: PMID:31139601
      reference_title: "Hematopoietic Stem Cell Transplant for the Treatment of X-MAID."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These cases represent a novel manifestation of non-radiosensitive X-linked form of T-B-NK+ SCID that is able to be detected by TREC based newborn screening and effectively treated with HCT."
      explanation: >-
        Demonstrates effective hematopoietic reconstitution of X-MAID by
        allogeneic hematopoietic cell transplantation.
  notes: >-
    Published transplant experience comprises three male patients in
    PMID:31139601: two achieved 100% donor chimerism and full hematologic and
    immunologic reconstitution after matched umbilical cord blood or matched
    sibling bone marrow transplantation with myeloablative conditioning, whereas
    one infant who initially received reduced-intensity haploidentical
    transplantation had incomplete myeloid engraftment and died of pulmonary
    complications after a second transplant.

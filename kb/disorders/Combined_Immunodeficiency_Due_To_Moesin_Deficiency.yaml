pathophysiology:
- name: Hemizygous MSN Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Hemizygous variants in MSN on the X chromosome, identified in all seven males
    of the founding series drawn from five different families.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HEMIZYGOUS
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  downstream:
  - target: Loss of Cortical Actin-Membrane Cross-Linking
    description: >-
      Loss of moesin removes one of the ERM cross-linkers that tether cortical
      actin to the plasma membrane in lymphocytes.
  evidence:
  - reference: PMID:27405666
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RESULTS: We observed hemizygous mutations in the moesin (MSN) gene (located on the X chromosome and coding for MSN) in all 7 patients."
    explanation: >-
      Establishes MSN as the causative locus across the founding series.
  - reference: PMID:29556235
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "METHOD: Whole genome microarray copy number variant (CNV) analysis was performed on the proband followed by whole exome sequencing (WES) and trio analysis of the proband and family members."
    explanation: >-
      An independent diagnosis of the same entity by exome sequencing, confirming
      the gene outside the founding cohort.
- name: Loss of Cortical Actin-Membrane Cross-Linking
  biological_scale: CELLULAR
  description: >-
    Moesin is an ERM protein whose job is to link filamentous actin at the cell
    cortex to membrane proteins. Losing it degrades the lymphocyte's ability to
    remodel its cortex, which is the shared requirement behind migration,
    adhesion, receptor surface display and the cytoskeletal reorganisation that
    proliferation depends on.
  biological_processes:
  - preferred_term: cortical actin cytoskeleton organization
    modifier: DECREASED
    term:
      id: GO:0030866
      label: cortical actin cytoskeleton organization
  downstream:
  - target: Impaired Lymphocyte Migration and Adhesion
    description: >-
      Chemotaxis and adhesion both require regulated cortical actin remodelling.
  - target: Impaired Lymphocyte Proliferation
    description: >-
      Proliferation is impaired in patient cells and is restored by wild-type
      MSN, establishing the dependency rather than merely the association.
- name: Impaired Lymphocyte Migration and Adhesion
  biological_scale: CELLULAR
  description: >-
    Patient T cells show poor chemokine receptor expression, increased adhesion
    molecule expression, and altered migration and adhesion. The combination is
    characteristic: the cells are not simply less adhesive or less mobile but
    dysregulated in both directions, which is what a scaffolding defect rather
    than a receptor defect predicts.
  biological_processes:
  - preferred_term: leukocyte migration
    modifier: ABNORMAL
    term:
      id: GO:0050900
      label: leukocyte migration
  - preferred_term: cell adhesion
    modifier: ABNORMAL
    term:
      id: GO:0007155
      label: cell adhesion
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Profound Lymphopenia and Leukopenia
    description: >-
      Defective migration and adhesion contribute to the failure to maintain
      normal circulating lymphocyte numbers and distribution.
  evidence:
  - reference: PMID:27405666
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSN-deficient T cells also displayed poor chemokine receptor expression, increased adhesion molecule expression, and altered migration and adhesion capacities."
    explanation: >-
      Measures all four of the defects this node asserts, in patient-derived
      T cells.
- name: Impaired Lymphocyte Proliferation
  biological_scale: CELLULAR
  description: >-
    Reduced T-cell proliferative capacity. This is the node with the strongest
    causal evidence in the entry, because re-expressing wild-type MSN in patient
    cells restores it.
  biological_processes:
  - preferred_term: T cell proliferation
    modifier: DECREASED
    term:
      id: GO:0042098
      label: T cell proliferation
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Profound Lymphopenia and Leukopenia
    description: >-
      Failure to expand contributes directly to the depleted lymphocyte
      compartment.
  evidence:
  - reference: PMID:27405666
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This phenotype was associated with impaired T-cell proliferation, which was rescued by expression of wild-type MSN."
    explanation: >-
      Both the defect and its rescue by wild-type MSN. The rescue is what makes
      this a demonstrated dependency rather than an association, and it is why
      this node carries more weight than the others.
- name: Profound Lymphopenia and Leukopenia
  biological_scale: ORGANISM
  description: >-
    Severe leukopenia affecting T and B cells and neutrophils, with fluctuating
    monocytopenia. The breadth across lineages is what makes this a combined
    immunodeficiency rather than a T-cell-selective one.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Decreased total lymphocyte count
  - target: Decreased total neutrophil count
  - target: Decreased total monocyte count
  - target: Decreased circulating IgG concentration
  - target: Recurrent bacterial infections
  - target: Recurrent viral infections
  evidence:
  - reference: PMID:27405666
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BACKGROUND: We investigated 7 male patients (from 5 different families) presenting with profound lymphopenia, hypogammaglobulinemia, fluctuating monocytopenia and neutropenia, a poor immune response to vaccine antigens, and increased susceptibility to bacterial and varicella zoster virus infections."
    explanation: >-
      The full clinical and haematological picture across the founding series,
      and the source for the phenotype records below.
  - reference: PMID:31139601
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked moesin-associated immunodeficiency (X-MAID) is a recently described form of primary immunodeficiency, characterized by severe leukopenia affecting T and B cells as well as neutrophils (1)."
    explanation: >-
      An independent statement of the multi-lineage leukopenia that defines this
      node.

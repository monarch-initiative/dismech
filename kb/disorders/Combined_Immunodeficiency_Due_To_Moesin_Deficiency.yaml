name: Combined Immunodeficiency Due To Moesin Deficiency
creation_date: "2026-09-12T14:05:00Z"
category: Mendelian
synonyms:
- X-MAID
- X-linked moesin-associated immunodeficiency
- moesin deficiency
- MSN deficiency
- X-linked primary immunodeficiency with moesin mutations
description: >-
  Combined immunodeficiency due to moesin deficiency (X-linked
  moesin-associated immunodeficiency, X-MAID) is an X-linked recessive inborn
  error of immunity caused by hemizygous loss-of-function variants in MSN,
  which encodes moesin. Affected males present with profound T- and B-cell
  lymphopenia, hypogammaglobulinemia, fluctuating neutropenia and
  monocytopenia, impaired vaccine-antigen antibody responses, increased
  susceptibility to bacterial, varicella zoster virus, and severe molluscum
  contagiosum infections, eczema, and autoimmune cytopenias (such as immune
  thrombocytopenia and thrombotic thrombocytopenic purpura); NK-cell counts
  vary across presentations, summarized as T-B-NK- lymphopenia in ClinGen's
  disease curation whereas severe infantile cases detected on TREC newborn
  screening can present with a T-B-NK+ severe combined immunodeficiency (SCID)
  immunophenotype.

  Moesin is a member of the ezrin-radixin-moesin (ERM) family of structural
  proteins that tether cortical filamentous actin to plasma-membrane proteins.
  Loss of moesin disrupts lymphocyte cortical actin organization, leading to
  impaired chemokine receptor display, dysregulated cell adhesion and
  migration, defective thymic and bone-marrow lymphocyte egress, and reduced
  mitogen-driven T-cell proliferation that is rescued in vitro by wild-type MSN
  re-expression. Moesin-deficient mice recapitulate peripheral lymphopenia and
  additionally exhibit loss of IL-15-dependent CD8+ regulatory T cells with
  systemic autoimmunity. Clinical management ranges from immunoglobulin
  replacement, antimicrobial prophylaxis, and granulocyte colony-stimulating
  factor (G-CSF) for cytopenias and infection prevention to curative allogeneic
  hematopoietic stem cell transplantation in severe or SCID-like disease.

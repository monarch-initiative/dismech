        ClinGen SCID-CID Gene Curation Expert Panel classifies the X-linked
        MSN-disease relationship as Definitive.
  notes: >-
    MSN on chromosome Xq12 encodes moesin, one of three ERM
    (ezrin-radixin-moesin) proteins that cross-link cortical actin to the plasma
    membrane. Most reported probands carry the recurrent FERM-domain missense
    hotspot variant c.511C>T (p.Arg171Trp), which destabilizes MSN mRNA and
    depletes moesin protein in lymphocytes, alongside rarer truncating nonsense
    variants such as p.Arg533Ter; heterozygous carrier mothers are clinically
    unaffected and show skewed X-chromosome inactivation across hematopoietic
    lineages.
  evidence:
  - reference: PMID:27405666
    reference_title: "X-linked primary immunodeficiency associated with hemizygous mutations in the moesin (MSN) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hemizygous mutations in the moesin (MSN) gene (located on the X chromosome and coding for MSN) in all 7 patients"
    explanation: >-
      Establishes the gene, its chromosomal location and the hemizygous state.
  - reference: PMID:29556235
    reference_title: "Exome Sequencing Diagnoses X-Linked Moesin-Associated Immunodeficiency in a Primary Immunodeficiency Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES trio analysis, data filtering and in silico prediction identified a novel, damaging (SIFT: 0; Polyphen 1; Grantham score: 101) and disease-causing (MutationTaster) single base mutation in the X chromosome (c.511C > T p.Arg171Trp) MSN gene not identified in the UCSC Genome Browser database."
    explanation: >-
      Confirms the recurrent hemizygous c.511C>T (p.Arg171Trp) MSN variant in an
      independent adult proband.

name: Combined Immunodeficiency Due To Moesin Deficiency
creation_date: "2026-09-12T14:05:00Z"
category: Mendelian
synonyms:
- X-MAID
- X-linked moesin-associated immunodeficiency
- moesin deficiency
- MSN deficiency
- X-linked primary immunodeficiency with moesin mutations
description: >-
  An X-linked combined immunodeficiency caused by hemizygous variants in MSN,
  which encodes moesin. Affected males have profound lymphopenia with
  hypogammaglobulinemia, fluctuating monocytopenia and neutropenia, poor vaccine
  responses, and susceptibility to bacterial and varicella zoster virus
  infection.

  The mechanism is cytoskeletal rather than signalling, and that is the reason to
  curate it. Moesin is an ERM (ezrin-radixin-moesin) protein that cross-links the
  cortical actin cytoskeleton to the plasma membrane. Most inborn errors of
  immunity in this clinical space are defects of a receptor or a kinase; here the
  lesion is in the mechanical scaffold that lymphocytes need in order to
  reorganise their cortex. What follows is a set of defects that are all
  recognisably cytoskeletal: poor chemokine receptor expression, altered adhesion
  and migration, and impaired proliferation.

  Two features are worth reading carefully.

  First, the proliferation defect is rescued by wild-type MSN. That is a
  complementation result in patient cells, and it is what raises the mechanism
  from an association between a genotype and a set of assays to a demonstrated
  dependency.

  Second, and in contrast to several other entries in this knowledge base, the
  mouse works. Moesin-deficient mice show a lymphopenia phenotype similar to the
  human one, so the model is curated as RECAPITULATES rather than as a mismatch.
  The mouse also does something the human data do not: it identifies a specific
  IL-15-dependent CD8+ regulatory T cell population whose loss breaks
  self-tolerance. That is recorded as a separate link at the cellular scale,
  marked as an upward extrapolation is not needed, but with its own limitations
  because the CD8+ Treg population has not been shown to be the relevant one in
  patients.

  Treatment is haematopoietic stem cell transplantation, which is
  mechanistically appropriate since moesin acts in haematopoietic lineages. The
  curated evidence for it is a single case report, and the treatment record says
  so rather than presenting it as established practice.

  No pathophysiology node declares conforms_to. kb/modules/ was searched; no
  module covers ERM-protein or cortical-actin failure in lymphocytes.

- name: Impaired autophagic flux and lysosomal permeabilization
  description: >
    Lysosomal GM2 storage arrests autophagic clearance and destabilises the
    lysosomal membrane. Skin fibroblasts from patients with Tay-Sachs and
    Sandhoff disease accumulate pathological autophagosomes, release mature
    cathepsins and hexosaminidase A into the cytosol, and have reduced basal
    mTOR activity; supplying a positive nutrient signal with L-arginine
    partially restores mTOR activity and the cytopathology, which argues that
    the defect is a consequence of storage rather than an incidental finding.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Patient-derived skin fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:

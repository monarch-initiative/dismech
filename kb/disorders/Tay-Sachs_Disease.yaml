- name: Impaired autophagic flux and lysosomal integrity
  description: >-
    Tay-Sachs/Sandhoff skin fibroblasts show abnormal autophagosomes, reduced basal mTOR signaling and lysosomal leakage. This is an experimental cellular branch; a direct arrow to neuronal death is not established.

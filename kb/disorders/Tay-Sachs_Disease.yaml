- name: GM2-associated ER calcium depletion and PERK signaling
  description: >-
    In GM2-loaded neuronal cultures, ER calcium depletion activates PERK, with early adaptive calcineurin and later CHOP-associated responses. This node represents experimental signaling; the upstream lysosomal-to-ER route in patients remains unresolved.
  evidence:
  - reference: PMID:30389374
    reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that ER GM2 accumulation in cultured neurons induces luminal Ca2+ depletion, which in turn activates PERK (protein kinase RNA [PKR]-like ER kinase), one of three UPR sensors.
    explanation: >-
      Cultured-neuron GM2 loading supports an ER calcium/PERK mechanism; lysosomal-to-ER trafficking and necessity in human Tay-Sachs are unresolved.
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  downstream:
  - target: CHOP-associated neuronal injury

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    When both parents carry a pathogenic HEXA variant, each conception has a 25% affected, 50% carrier and 25% unaffected noncarrier probability. Heterozygous carriers are asymptomatic.
  evidence:
  - reference: ORPHA:845
    reference_title: "Tay-Sachs disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive"
    explanation: Orphanet directly lists autosomal recessive inheritance for ORPHA:845.
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      Mendelian recurrence applies when both parents are confirmed carriers.
progression:
- phase: Age of onset
  age_range: All ages
  notes: Orphanet records onset across all ages, consistent with infantile, juvenile, and late-onset clinical subtypes.
  evidence:
  - reference: ORPHA:845
    reference_title: "Tay-Sachs disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: All ages"
    explanation: Orphanet's natural-history section records Tay-Sachs disease onset as occurring across all ages.
- phase: Infantile progression
  notes: >-
    Weakness and visual inattentiveness emerge at 3–6 months, followed by developmental plateau and regression. Seizures become common by 12 months; feeding and respiratory complications influence survival.
  evidence:
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Seizures are common by 12 months with further deterioration in the second year of life and death occurring between ages two and three years with some survival to five to seven years.
    explanation: >-
      Infantile progression and survival vary with stage and supportive care; a fixed death-by-four rule is inaccurate.
- phase: Juvenile and late-onset progression
  notes: >-
    Later-onset forms vary even within families. Juvenile disease includes cognitive decline, spasticity and bulbar dysfunction; late-onset disease can begin with weakness, cerebellar signs or psychiatric symptoms.
  evidence:
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Spasticity, dysphagia, and seizures are present by the end of the first decade of life, with death within the second decade of life, usually by aspiration.
    explanation: >-
      GeneReviews supports juvenile motor/bulbar progression and aspiration complications.
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Late-onset TSD presents in older teens or young adults with a slowly progressive spectrum of neurologic symptoms including lower-extremity weakness with muscle atrophy, dysarthria, incoordination, tremor, mild spasticity and/or dystonia, and psychiatric manifestations including acute psychosis.
    explanation: >-
      The late-onset spectrum spans cerebellar, motor, and neuropsychiatric dysfunction.

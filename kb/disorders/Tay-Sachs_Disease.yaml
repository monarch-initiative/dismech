mechanistic_hypotheses:
- hypothesis_group_id: canonical_hexa_gm2_ganglioside_neuronal_storage_model
  hypothesis_label: Canonical HEXA Deficiency / GM2 Ganglioside Neuronal Storage Model
  status: CANONICAL
  description: >-
    Biallelic pathogenic HEXA variants impair the alpha subunit of lysosomal HexA, an alpha/beta heterodimer requiring the GM2 activator protein for membrane GM2 hydrolysis. Deficient catabolism causes neuronal GM2 storage, followed by neuronal dysfunction and loss, glial inflammation and variable myelin abnormalities. Residual activity shapes a continuum from infantile to juvenile and late-onset disease. The downstream contributions of ER stress, autophagy and neurodevelopmental perturbation require context-specific interpretation. Mouse neuraminidase bypass metabolism limits translation from Hexa-null animals.
  notes: >-
    The core mechanism remains canonical. OpenScientist correctly identified the Hexa/Neu3 mouse-model correction and several experimental downstream mechanisms, but overstated HSCT causal inference and missed published human AAV results and fetal-brain transcriptomics. Human biochemical target engagement does not ensure clinical benefit; the report is assessed separately against primary studies.
  evidence:
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: HEXA disorders are best considered as a disease continuum based on the amount of residual beta-hexosaminidase A (HEX A) enzyme activity.
    explanation: >-
      GeneReviews supports a residual-activity continuum rather than fixed activity thresholds or survival cutoffs.
  - reference: PMID:16698036
    reference_title: 'Crystallographic structure of human beta-hexosaminidase A: interpretation of Tay-Sachs mutations and loss of GM2 ganglioside hydrolysis.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Only the alpha-subunit active site can hydrolyze GM2 gangliosides due to a flexible loop structure that is removed post-translationally from beta, and to the presence of alphaAsn423 and alphaArg424.
    explanation: >-
      Crystallography identifies alpha-subunit-specific substrate and activator interactions.
- hypothesis_group_id: gm2_er_stress
  hypothesis_label: GM2-associated ER stress and neuronal injury
  status: EMERGING
  description: >-
    GM2 loading in neuronal cultures activates a biphasic PERK response, progressing from adaptation to CHOP-associated injury. Trafficking from lysosomal storage to ER membranes and the contribution in human disease remain unresolved.
  evidence:
  - reference: PMID:30389374
    reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that ER GM2 accumulation in cultured neurons induces luminal Ca2+ depletion, which in turn activates PERK (protein kinase RNA [PKR]-like ER kinase), one of three UPR sensors.
    explanation: >-
      Cultured-neuron GM2 loading supports an ER calcium/PERK mechanism; lysosomal-to-ER trafficking and necessity in human Tay-Sachs are unresolved.
  - reference: PMID:30389374
    reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both processes were effectively modulated by treatment with the selective PERK inhibitor GSK2606414, by CN knockdown, and by CHOP knockdown.
    explanation: >-
      PERK inhibition and calcineurin/CHOP knockdown provide direct cellular perturbation evidence for neurite atrophy/apoptosis.
- hypothesis_group_id: autophagy_lysosomal_integrity
  hypothesis_label: Autophagic flux and lysosomal integrity impairment
  status: EMERGING
  description: >-
    GM2 patient fibroblasts show reduced basal mTOR signaling, impaired flux and lysosomal permeability; L-arginine partly rescues these cellular abnormalities. This is not a demonstrated neuronal or clinical treatment mechanism.
  evidence:
  - reference: PMID:34831346
    reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: GM2 fibroblasts showed diminished mTOR signalling with reduced basal mTOR activity.
    explanation: >-
      Patient-derived Tay-Sachs and Sandhoff fibroblasts reveal an autophagy/lysosomal phenotype; neuronal in vivo generalization is unproven.
  - reference: PMID:34831346
    reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pathological autophagosomes with impaired autophagic flux, an abnormality confirmed by electron microscopy and biochemical studies revealing the accelerated release of mature cathepsins and HexA into the cytosol, indicating increased lysosomal permeability.
    explanation: >-
      Patient fibroblast assays document impaired flux and lysosomal leakage, not the full human neurodegenerative sequence.
- hypothesis_group_id: prenatal_developmental_perturbation
  hypothesis_label: Prenatal developmental perturbation
  status: EMERGING
  description: >-
    Fetal Tay-Sachs brain RNA-seq and Sandhoff organoids suggest a developmental component preceding end-stage neurodegeneration. Genotype, family, brain region and model differences limit generalization.
  evidence:
  - reference: PMID:36700853
    reference_title: Gene expression changes in Tay-Sachs disease begin early in fetal brain development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We find that the transcriptomes are perturbed by 17 week’s gestation, suggesting abnormal neurodevelopment, which has implications for therapeutic intervention for TSD.
    explanation: >-
      Two affected sibling fetuses with a juvenile-associated genotype and two controls were sampled across brain regions; 19 GEO libraries are not 19 independent fetuses.

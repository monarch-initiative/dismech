name: Tay-Sachs Disease
creation_date: '2026-01-06T04:44:07Z'
description: >-
  Tay-Sachs disease is an autosomal recessive GM2 gangliosidosis caused by
  biallelic pathogenic variants in HEXA, which encodes the alpha subunit of the
  lysosomal enzyme beta-hexosaminidase A. Deficient hexosaminidase A activity
  blocks degradation of GM2 ganglioside, which accumulates progressively within
  neurons and triggers neuroinflammation and neuronal death. The classic
  infantile form presents with developmental regression, hypotonia, an exaggerated
  startle response, a macular cherry-red spot, seizures, and blindness, while
  juvenile and late-onset forms with residual enzyme activity follow a more
  protracted course dominated by ataxia and motor neuron involvement.

datasets:
- accession: geo:GSE224860
  title: Bulk RNA-seq of brain samples from fetuses with Tay-Sachs Disease
  description: Treatment of monogenic disorders has historically relied on symptomatic management with limited ability to target primary molecular deficits. However, recent advances in gene therapy and related technologies aim to correct these underlying deficiencies, raising the possibility of disease management or even prevention for diseases that can be treated pre-symptomatically. Tay–Sachs disease (TSD) would be one such candidate, however very little is known about the presymptomatic stage of TSD. To better understand the effects of TSD on brain development, we evaluated the transcriptomes of human fetal brain samples with biallelic pathogenic variants in HEXA.

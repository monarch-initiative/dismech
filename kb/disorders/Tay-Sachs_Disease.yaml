discussions:
- discussion_id: tsd_lots_selective_neuronal_vulnerability
  prompt: >-
    Why do anterior horn cells and cerebellar Purkinje cells degenerate
    preferentially in late-onset Tay-Sachs disease, when the canonical model
    predicts that a uniform reduction in hexosaminidase A activity produces
    generalised neuronal GM2 storage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Residual Hexosaminidase A activity in late-onset disease
  - pathophysiology#Late-onset cerebellar and anterior motor neuron involvement
  rationale: >-
    Late-onset patients with 1.8 to 4.1 percent residual activity present with
    a strikingly narrow phenotype: proximal weakness from anterior horn cell
    neuronopathy, cerebellar signs and psychiatric disease, with cognition
    preserved at the stages reported and cerebellar atrophy the dominant
    imaging finding. Nothing in the canonical chain predicts that regional
    selectivity, and neither cell-type-resolved GM2 measurement nor a
    regional-vulnerability mechanism has been published for this disease.
    Because the same allele series drives the whole severity spectrum, the
    answer bears directly on whether raising residual activity would protect
    the vulnerable populations specifically.
  proposed_experiments:
  - experiment_id: tsd_lots_cell_type_resolved_gm2
    name: Cell-type-resolved GM2 quantification in vulnerable versus spared regions
    description: >-
      Single-nucleus transcriptomics with spatial lipidomics on post-mortem
      late-onset Tay-Sachs brain, comparing cerebellum and spinal cord with
      cortex, to test whether vulnerable populations differ in baseline
      ganglioside load, alternative catabolic capacity, or local inflammatory
      signature.
    would_support:
    - pathophysiology#Late-onset cerebellar and anterior motor neuron involvement
    supporting_outcome: >-
      Vulnerable cell types carry higher GM2 per cell, or lower alternative
      ganglioside-degradation capacity, than spared cortical neurons in the
      same brain.
    refuting_outcome: >-
      GM2 load and catabolic capacity are equivalent across vulnerable and
      spared regions, which would place the selectivity downstream of storage
      in cell-autonomous tolerance rather than in substrate handling.
  evidence:
  - reference: PMID:9073025
    reference_title: "Progressive cerebellar ataxia, proximal neurogenic weakness and ocular motor disturbances: hexosaminidase A deficiency with late clinical onset in four siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypical expression was remarkably homogeneous, consisting in a combination of slowly progressive motor neuron disease, ataxia and ocular motor disturbances. None of the patients were demented at this stage of their illness."
    explanation: >-
      Four adult siblings sharing one genotype show the same narrow
      motor-neuron and cerebellar phenotype without dementia, which is the
      regional selectivity the canonical storage model does not account for.
  - reference: PMID:31076878
    reference_title: "Amyotrophy, cerebellar impairment and psychiatric disease are the main symptoms in a cohort of 14 Czech patients with the late-onset form of Tay-Sachs disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Residual enzyme activity was 1.8-4.1% of controls."
    explanation: >-
      Quantifies the residual-activity band over which the selective
      anterior-horn and cerebellar phenotype appears in a 14-patient cohort.
  notes: >-
    Raised by the 2026 openscientist hypothesis-search report, whose search for
    a cell-type-specific explanation returned nothing. Wording deliberately
    says cognition is preserved at the stages reported rather than that
    cortical neurons are spared, because the cited studies measured clinical
    and imaging phenotype, not cortical GM2 load.
- discussion_id: tsd_downstream_cascade_ordering
  prompt: >-
    Are neuroinflammation, PERK-mediated unfolded protein response activation,
    and impaired autophagic flux parallel consequences of GM2 storage, or is
    there a causal hierarchy among them that identifies one as the tractable
    upstream target?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#GM2 ganglioside accumulation in neurons
  - pathophysiology#Neuroinflammation and Astrogliosis
  - pathophysiology#PERK-mediated unfolded protein response activation
  - pathophysiology#Impaired autophagic flux and lysosomal permeabilization
  rationale: >-
    The only ordering constraint that has been demonstrated is that slowing
    substrate accumulation delays the inflammatory process, placing glial
    activation downstream of storage. The unfolded protein response and
    autophagy arms rest on patient fibroblasts and primary neuron cultures with
    no temporal resolution and no in vivo Tay-Sachs validation, so their
    position relative to each other and to inflammation is unconstrained. This
    matters for therapy selection: anti-inflammatory, chaperone, and
    mTOR-directed strategies are each being pursued against these three arms
    without evidence about which is upstream.
  proposed_experiments:
  - experiment_id: tsd_downstream_cascade_time_course
    name: Time-resolved multi-omics across the Hexa/Neu3 double knockout disease course
    description: >-
      Transcriptomics, proteomics and lipidomics at pre-symptomatic, early
      symptomatic, mid-disease and end-stage time points in Hexa/Neu3 double
      knockout mice against littermate controls, reading out inflammatory,
      unfolded protein response, and autophagy signatures on the same samples.
    would_support:
    - pathophysiology#Neuroinflammation and Astrogliosis
    - pathophysiology#PERK-mediated unfolded protein response activation
    - pathophysiology#Impaired autophagic flux and lysosomal permeabilization
    supporting_outcome: >-
      One signature rises measurably before the others at a pre-symptomatic
      time point, establishing a sequence rather than a coincidence.
    refuting_outcome: >-
      All three signatures appear together at the same time point, which would
      argue they are parallel consequences of storage and that none is the
      privileged upstream target.
  evidence:
  - reference: PMID:12615653
    reference_title: "Central nervous system inflammation is a hallmark of pathogenesis in mouse models of GM1 and GM2 gangliosidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Progressive CNS inflammation coincided with the onset of clinical signs in these mouse models."
    explanation: >-
      Inflammation and clinical onset are coincident rather than separated in
      time, so the timing data available constrain inflammation against storage
      but not against the other downstream arms.
  notes: >-
    Recorded from the 2026 openscientist hypothesis-search report. The report
    treated this ordering as unresolved and did not attempt to settle it; the
    two cellular arms it surfaced are curated here as pathophysiology nodes
    with their in vitro provenance stated.
- discussion_id: tsd_g269s_knockin_model_mismatch
  prompt: >-
    Which model system can represent the human residual-activity phenotype,
    given that a mouse carrying the common late-onset Gly269Ser allele behaves
    like a complete-null animal?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Residual Hexosaminidase A activity in late-onset disease
  - animal_models#Hexa Gly269Ser knock-in / Neu3 knockout mouse
  rationale: >-
    In people, the Gly269Ser allele preserves a few percent of hexosaminidase A
    activity and delays onset into adulthood, sometimes as late as the fourth
    decade. Knocked into the mouse on a Neu3-null background, the same
    substitution gave brain-wide GM2 accumulation, progressive loss of
    reflexes, gait abnormality and death by 24 weeks, indistinguishable from
    the null allele. The mismatch is not that evidence is absent but that the
    available in vivo evidence does not transfer, so preclinical work on
    delaying late-onset disease has no validated model, and any therapeutic
    inference from this genotype about raising residual activity should be
    treated as untested in a system that reproduces the human course.
  evidence:
  - reference: PMID:40916664
    reference_title: "Generation of mice with combined Hexa Gly269Ser KI or KO and Neu3 KO alleles to create new models of GM2 gangliosidoses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although survival and behavioural phenotypes did not differ between KO and KI models, the KI model had substantial Hexa mRNA and evidence of GM2 turnover."
    explanation: >-
      The knock-in built to model chronic adult-onset disease was
      indistinguishable from the complete-deficiency model on survival and
      behaviour, which is the mismatch itself.
  - reference: PMID:15714079
    reference_title: "Late-onset Tay-Sachs disease: phenotypic characterization and genotypic correlations in 21 affected patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset (age 36 years) was delayed and progression relatively slower in the homozygous G269S patient."
    explanation: >-
      Establishes the human behaviour of the same allele, onset at 36 with
      slower progression, against which the mouse result is discrepant.
  notes: >-
    Surfaced while assessing the 2026 openscientist report, which offered this
    genotype as a late-onset research model without reporting that the
    knock-in and knockout arms did not separate.

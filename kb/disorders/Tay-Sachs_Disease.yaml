- name: Prenatal neurodevelopmental perturbation
  description: >-
    In two affected sibling fetuses at 17 weeks, GM2 storage and bulk transcriptomic changes suggest altered differentiation/proliferation before end-stage neuroinflammatory signatures. The findings are hypothesis-generating across a small number of biological donors.

diagnosis:
- name: Combined enzyme and molecular diagnosis
  description: >-
    Confirm deficient HexA with preserved or elevated HexB and biallelic pathogenic or likely pathogenic HEXA variants. Sequence HEXA, then consider deletion/duplication testing if zero or one allele is identified; broader genomic testing can resolve atypical presentations. VUS findings alone do not establish diagnosis.
  evidence:
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of a HEXA disorder is established in a proband with abnormally low HEX A activity on enzyme testing and biallelic pathogenic variants in HEXA identified by molecular genetic testing.
    explanation: >-
      GeneReviews establishes combined biochemical and molecular diagnosis.
- name: Distinguish pseudodeficiency and substrate-specific B1 alleles
  description: >-
    Pseudodeficiency impairs hydrolysis of artificial substrates while preserving natural GM2 catabolism, producing false-positive biochemical results. B1 alleles can retain artificial-substrate activity but fail to hydrolyze natural GM2, producing false-negative results in some assays. Molecular testing resolves discordant biochemical and clinical findings.
  evidence:
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pseudodeficiency refers to an in vitro phenomenon caused by specific HEXA variants that renders the enzyme unable to process the synthetic (but not the natural) GM2 substrates, and leads to false positive enzyme testing results.
    explanation: >-
      Synthetic-substrate pseudodeficiency is not disease-causing GM2 storage.
  - reference: PMID:10571007
    reference_title: Biochemical consequences of mutations causing the GM2 gangliosidoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The few exceptions to this generalization are missense mutations at two codons in HEXA, causing the unique biochemical phenotype known as the B1-variant, and one codon in both the HEXB and GM2A genes.
    explanation: >-
      B1 alleles alter substrate-specific function; detailed assay interpretation was checked in GeneReviews.
animal_models:
- name: Hexa knockout mouse
  species: Mouse
  genotype: Hexa-null
  publication: PMID:7610760
  description: Models biochemical storage with limited clinical fidelity.
  modeled_mechanisms:
  - target: GM2 ganglioside accumulation in neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: Murine sialidase bypass restricts storage and disease severity.
    evidence:
    - reference: PMID:7610760
      reference_title: Neuropathology of mice with targeted disruption of Hexa gene, a model of Tay-Sachs disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Storage neurons were absent in the olfactory bulb, cerebellar cortex and spinal anterior horns.
      explanation: >-
        Hexa-null mice reproduce substrate storage but have markedly different regional vulnerability from severe human disease.
- name: Hexa/Neu3 double-knockout mouse
  species: Mouse
  genotype: Hexa-null; Neu3-null
  publication: PMID:32951593
  description: Severe storage, Purkinje loss and inflammatory mouse model. A separate study documented reduced trabecular bone measures; this does not establish human osteoporosis penetrance.
  modeled_mechanisms:
  - target: Neuroinflammation and Astrogliosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: Additional Neu3 loss alters physiology; it does not fully reproduce every human phenotype.
    evidence:
    - reference: PMID:32951593
      reference_title: GM2 ganglioside accumulation causes neuroinflammation and behavioral alterations in a mouse model of early onset Tay-Sachs disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We found elevated levels of pro-inflammatory cytokine and chemokine transcripts, such as Ccl2, Ccl3, Ccl4, and Cxcl10 and also extensive microglial and astrocyte activation and proliferation, accompanied by peripheral blood mononuclear cell infiltration in the vicinity of neurons and oligodendrocytes.
      explanation: >-
        Hexa/Neu3 double-knockout mice demonstrate the inflammatory branch; this is not direct human causal evidence.
    - reference: PMID:28442549
      reference_title: Neuraminidases 3 and 4 regulate neuronal function by catabolizing brain gangliosides.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: neuraminidase 3 deficiency drastically increased storage of GM2 in the brain tissues of an asymptomatic mouse model of Tay-Sachs disease
      explanation: >-
        Deleting Neu3 exposes severe storage otherwise bypassed through murine GM2 catabolism.
  evidence:
  - reference: PMID:39514043
    reference_title: Abnormally accumulated GM2 ganglioside contributes to skeletal deformity in Tay-Sachs mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Micro-computed tomography and analysis show reduced trabecular bone volume, mineral density, number, and thickness in Hexa-/-Neu3-/- mice.
    explanation: >-
      Five-month double-knockout mouse bone phenotype; direct GM2 effects are not separated from genotype, mobility, growth or systemic factors.
- name: Gly269Ser knock-in/Neu3-null mouse
  species: Mouse
  genotype: Hexa Gly269Ser knock-in; Neu3-null
  publication: PMID:40916664
  description: Allele-specific model with GM2 turnover but unexpectedly severe survival phenotype.
  modeled_mechanisms:
  - target: Residual but insufficient HexA activity in late-onset disease
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: Both knock-in and knockout combinations died by 24 weeks; not a faithful chronic LOTS clinical model.
    evidence:
    - reference: PMID:40916664
      reference_title: Generation of mice with combined Hexa Gly269Ser KI or KO and Neu3 KO alleles to create new models of GM2 gangliosidoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Although survival and behavioural phenotypes did not differ between KO and KI models, the KI model had substantial Hexa mRNA and evidence of GM2 turnover.
      explanation: >-
        G269S/Neu3-null mice retain a biochemical partial-deficiency feature but do not reproduce a chronic human late-onset survival course.
- name: Naturally occurring Jacob sheep Tay-Sachs disease
  species: Sheep
  genotype: HEXA exon-11 splice-disrupting variant
  publication: PMID:20817517
  description: Large-brain storage model with glial/myelin pathology and gene-delivery studies.
  modeled_mechanisms:
  - target: GM2 ganglioside accumulation in neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: Species and route/dose differences constrain human translation; up to five years is the maximum reported follow-up.
    evidence:
    - reference: PMID:20817517
      reference_title: Tay-Sachs disease in Jacob sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: A missense mutation was found in the hexa cDNA of the affected sheep caused by a single nucleotide change at the end of exon 11 resulting in skipping of exon 11.
      explanation: >-
        Naturally occurring Jacob sheep disease has a splice-disrupting HEXA variant and deficient HexA.
    - reference: PMID:41026525
      reference_title: Five-year analysis of efficacy and safety of a bidirectional AAV gene therapy in Tay-Sachs sheep.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The longest survival and best distribution were achieved by multipoint CSF delivery (combined CM, ICV, and LIT) with treated animals that survived up to 5 years of age (untreated animals with TSD die after ~9 months).
      explanation: >-
        Selected treated sheep reached five years; this is neither a median survival estimate nor a human efficacy result.
experimental_models:
- name: GM2-loaded neuronal cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: GM2 loading with PERK inhibition and calcineurin/CHOP knockdown.
  modeled_mechanisms:
  - target: GM2-associated ER calcium depletion and PERK signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Experimental GM2 delivery does not reproduce the complete HEXA-genotype-to-ER trafficking route.
    evidence:
    - reference: PMID:30389374
      reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We found that ER GM2 accumulation in cultured neurons induces luminal Ca2+ depletion, which in turn activates PERK (protein kinase RNA [PKR]-like ER kinase), one of three UPR sensors.
      explanation: >-
        Cultured-neuron GM2 loading supports an ER calcium/PERK mechanism; lysosomal-to-ER trafficking and necessity in human Tay-Sachs are unresolved.
    - reference: PMID:30389374
      reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Both processes were effectively modulated by treatment with the selective PERK inhibitor GSK2606414, by CN knockdown, and by CHOP knockdown.
      explanation: >-
        PERK inhibition and calcineurin/CHOP knockdown provide direct cellular perturbation evidence for neurite atrophy/apoptosis.
- name: Patient-derived GM2 skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Tay-Sachs and Sandhoff fibroblast lysosomal, mTOR and autophagic-flux assays.
  modeled_mechanisms:
  - target: Impaired autophagic flux and lysosomal integrity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Mixed genetic diagnoses and non-neuronal cells; no demonstrated clinical benefit of L-arginine.
    evidence:
    - reference: PMID:34831346
      reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: GM2 fibroblasts showed diminished mTOR signalling with reduced basal mTOR activity.
      explanation: >-
        Patient-derived Tay-Sachs and Sandhoff fibroblasts reveal an autophagy/lysosomal phenotype; neuronal in vivo generalization is unproven.
    - reference: PMID:34831346
      reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Pathological autophagosomes with impaired autophagic flux, an abnormality confirmed by electron microscopy and biochemical studies revealing the accelerated release of mature cathepsins and HexA into the cytosol, indicating increased lysosomal permeability.
      explanation: >-
        Patient fibroblast assays document impaired flux and lysosomal leakage, not the full human neurodegenerative sequence.
- name: Sandhoff cerebral organoids with isogenic correction
  experimental_model_type: ORGANOID
  description: HEXB-corrected isogenic organoids compared with patient-derived Sandhoff organoids.
  modeled_mechanisms:
  - target: Prenatal neurodevelopmental perturbation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: Sandhoff genotype, not a Tay-Sachs organoid model; developmental effects do not prove irreversible prenatal damage in all patients.
    evidence:
    - reference: PMID:29358305
      reference_title: Cerebral organoids derived from Sandhoff disease-induced pluripotent stem cells exhibit impaired neurodifferentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The Sandhoff disease organoids, but not the HEXB-corrected organoids, accumulated GM2 ganglioside and exhibited increased size and cellular proliferation compared with the HEXB-corrected organoids.
      explanation: >-
        Isogenic rescue supports a developmental effect in a related GM2 disorder.
discussions:
- discussion_id: experimental_routes
  kind: KNOWLEDGE_GAP
  prompt: How do lysosomal storage, ER stress, autophagy and inflammation interact in human neurons?
  attaches_to:
  - pathophysiology#GM2-associated ER calcium depletion and PERK signaling
  - pathophysiology#Impaired autophagic flux and lysosomal integrity
  - pathophysiology#Neuroinflammation and Astrogliosis
  rationale: >-
    ER stress and autophagy nodes have primary experimental support but are not joined to the neuronal-storage node by invented transport or death edges. GM2 loading does not establish lysosomal-to-ER trafficking, fibroblast abnormalities do not establish neuronal injury, and reduced inflammatory markers do not identify a dominant pathway. PERK/CHOP perturbation is causal in its cellular model, contrary to the report’s blanket statement that downstream links have only temporal evidence.
  evidence:
  - reference: PMID:30389374
    reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that ER GM2 accumulation in cultured neurons induces luminal Ca2+ depletion, which in turn activates PERK (protein kinase RNA [PKR]-like ER kinase), one of three UPR sensors.
    explanation: >-
      Cultured-neuron GM2 loading supports an ER calcium/PERK mechanism; lysosomal-to-ER trafficking and necessity in human Tay-Sachs are unresolved.
  - reference: PMID:30389374
    reference_title: Neurite atrophy and apoptosis mediated by PERK signaling after accumulation of GM2-ganglioside.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both processes were effectively modulated by treatment with the selective PERK inhibitor GSK2606414, by CN knockdown, and by CHOP knockdown.
    explanation: >-
      PERK inhibition and calcineurin/CHOP knockdown provide direct cellular perturbation evidence for neurite atrophy/apoptosis.
  - reference: PMID:34831346
    reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pathological autophagosomes with impaired autophagic flux, an abnormality confirmed by electron microscopy and biochemical studies revealing the accelerated release of mature cathepsins and HexA into the cytosol, indicating increased lysosomal permeability.
    explanation: >-
      Patient fibroblast assays document impaired flux and lysosomal leakage, not the full human neurodegenerative sequence.
  - reference: PMID:40019557
    reference_title: Combined treatment of Ketogenic diet and propagermanium reduces neuroinflammation in Tay-Sachs disease mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: This study aimed to display the effect of combining the ketogenic diet and propagermanium treatment on chronic neuroinflammation in the Tay-Sachs disease mouse model.
    explanation: >-
      Mouse combination treatment tests inflammatory modulation; it does not establish a human treatment effect or that inflammation is the sole driver.
- discussion_id: selective_vulnerability
  kind: KNOWLEDGE_GAP
  prompt: What determines subtype, circuit and neuronal population vulnerability?
  attaches_to:
  - pathophysiology#Late-onset multifocal neuronal dysfunction
  - phenotypes#Depression
  - phenotypes#Sleep disturbance
  - phenotypes#Axonal polyneuropathy
  rationale: >-
    Clinical cohorts identify different cerebellar, motor, peripheral nerve and psychiatric manifestations without resolving all substrate-to-circuit mechanisms. The Czech 1.8–4.1% enzyme range is assay/cohort-specific, not a universal threshold. Peripheral axon loss, sleep and mood findings are retained without speculative circuit arrows.
  evidence:
  - reference: PMID:31076878
    reference_title: Amyotrophy, cerebellar impairment and psychiatric disease are the main symptoms in a cohort of 14 Czech patients with the late-onset form of Tay-Sachs disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Residual enzyme activity was 1.8-4.1% of controls.
    explanation: >-
      Fourteen Czech LOTS cases define a study-specific assay range, not a universal disease threshold.
- discussion_id: developmental_window
  kind: KNOWLEDGE_GAP
  prompt: Do prenatal abnormalities constrain the window for treatment?
  attaches_to:
  - pathophysiology#Prenatal neurodevelopmental perturbation
  rationale: >-
    Human fetal transcriptomics existed before the OpenScientist report: two affected sibling fetuses and two controls, with multiple regional samples. These observations complement Sandhoff organoids but do not prove irreversible prenatal clinical damage or that prenatal treatment is necessary.
  evidence:
  - reference: PMID:36700853
    reference_title: Gene expression changes in Tay-Sachs disease begin early in fetal brain development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We find that the transcriptomes are perturbed by 17 week’s gestation, suggesting abnormal neurodevelopment, which has implications for therapeutic intervention for TSD.
    explanation: >-
      Two affected sibling fetuses with a juvenile-associated genotype and two controls were sampled across brain regions; 19 GEO libraries are not 19 independent fetuses.
- discussion_id: biomarker_clinical_dissociation
  kind: KNOWLEDGE_GAP
  prompt: Which biomarkers predict meaningful clinical benefit?
  attaches_to:
  - biochemical#CSF GM2 concentration
  - biochemical#Plasma GM2 34:1 and GM2/GM3 ratio
  rationale: >-
    AMETHIST reduced CSF GM2 without clinical improvement or biomarker-outcome correlation. Plasma diagnostic discrimination in a selected cohort is not a therapeutic surrogate. Randomized treatment, timing, tissue exposure and clinical outcome studies are needed.
  evidence:
  - reference: PMID:41108138
    reference_title: 'Venglustat in GM2 gangliosidoses and related disorders: Results of the AMETHIST randomized controlled and basket trials.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Decreased CSF GM2 concentrations did not correlate with clinical endpoints.
    explanation: >-
      Direct trial evidence prevents equating substrate reduction with clinical efficacy.
- discussion_id: cross_disorder_lipid_cascades
  kind: KNOWLEDGE_GAP
  prompt: Which secondary lipid changes contribute specifically to Tay-Sachs pathology?
  attaches_to:
  - pathophysiology#GM2 ganglioside accumulation in neurons
  rationale: >-
    The report’s secondary-lipid cascade discussion relies mainly on Niemann-Pick and mucopolysaccharidosis biochemistry. Secondary GM2 storage in those disorders supports convergence but does not prove that GM2 drives the same cholesterol/glucosylceramide cascade in Tay-Sachs.
  evidence:
  - reference: PMID:32272755
    reference_title: Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: they trigger a secondary accumulation of ganglioside GM2, glucosylceramide and cholesterol in Niemann-Pick disease type A and B, and of GM2 and glucosylceramide in Niemann-Pick disease type C.
    explanation: >-
      Review/reconstitution evidence describes different primary lysosomal disorders.
- discussion_id: visual-loss-localization
  kind: KNOWLEDGE_GAP
  prompt: How much visual impairment arises from retinal versus central visual pathway dysfunction?
  attaches_to:
  - pathophysiology#Retinal ganglion cell lipid storage
  - phenotypes#Blindness
  - phenotypes#Visual Impairment
  rationale: >-
    The retinal-storage source directly explains the cherry-red macula but does not establish the causal partition of visual loss. Clinical visual impairment is retained without forcing a retinal-storage-to-blindness edge from a phenotype-frequency annotation.
  evidence:
  - reference: PMID:19820796
    reference_title: "'Cherry red spot' in a patient with Tay-Sachs disease: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The accumulation of lipid in retinal ganglion cells that leads to a chalk-white appearance of the fundus called 'cherry red spot' is the hallmark of Tay-Sachs disease.
    explanation: >-
      This supports the visible macular sign, not attribution of all blindness to retinal storage.
differential_diagnoses:
- name: Sandhoff disease
  description: Related GM2 storage disorder with overlapping infantile, juvenile and adult neurological phenotypes.
  distinguishing_features:
  - Biallelic HEXB variants reduce both HexA and HexB; Tay-Sachs primarily reduces HexA with preserved or increased HexB.
  - Visceral involvement may be more prominent in Sandhoff disease, but enzyme and molecular testing determine the diagnosis.
  evidence:
  - reference: PMID:10571007
    reference_title: Biochemical consequences of mutations causing the GM2 gangliosidoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A deficiency of any one of these proteins leads to storage of the ganglioside, primarily in the lysosomes of neuronal cells, and one of the three forms of GM2-gangliosidosis, Tay-Sachs disease, Sandhoff disease or the AB-variant form.
    explanation: >-
      The review establishes three distinct genetic etiologies converging on GM2 storage.
- name: GM2 activator deficiency
  description: The GM2A-related AB variant can resemble Tay-Sachs despite normal measured HexA and HexB activity.
  distinguishing_features:
  - GM2 activator deficiency impairs presentation of membrane GM2 to HexA; biallelic GM2A variants establish the molecular cause.
  evidence:
  - reference: PMID:8900233
    reference_title: Molecular analysis of a GM2-activator deficiency in two patients with GM2-gangliosidosis AB variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lysosomal degradation of ganglioside GM2 by beta-hexosaminidase A (hex A) requires the presence of the GM2 activator protein (GM2AP) as an essential cofactor.
    explanation: >-
      Normal artificial-substrate enzyme measurements do not exclude GM2A-related disease.
- name: Other disorders with a cherry-red macula
  description: GM1 gangliosidosis, other sphingolipidoses and central retinal artery occlusion can also produce a cherry-red appearance.
  distinguishing_features:
  - A cherry-red spot is not diagnostic in isolation; clinical course, visceral findings, enzyme assays and molecular testing distinguish etiologies.
  evidence:
  - reference: PMID:19820796
    reference_title: "'Cherry red spot' in a patient with Tay-Sachs disease: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is also seen in others neurometabolic diseases as well as in central retinal artery occlusion.
    explanation: >-
      The Tay-Sachs case report explicitly states that the retinal finding is not specific.
- name: Adult motor neuron and cerebellar disorders
  description: Late-onset Tay-Sachs can resemble spinal muscular atrophy, amyotrophic lateral sclerosis or inherited ataxia.
  distinguishing_features:
  - A mixed pattern of proximal neurogenic weakness, cerebellar signs and psychiatric or cognitive features should prompt HexA and HEXA testing.
  - Marked cerebellar atrophy can occur even when the presenting complaint is weakness or psychiatric illness.
  evidence:
  - reference: PMID:31995250
    reference_title: Natural History of Adult Patients with GM2 Gangliosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The main brain magnetic resonance imaging feature was cerebellar atrophy, even in patients without cerebellar symptoms.
    explanation: >-
      Adult GM2 case series plus literature review supports the heterogeneous pattern; GeneReviews differential diagnosis was also checked.

    reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: GM2 fibroblasts showed diminished mTOR signalling with reduced basal mTOR activity.
    explanation: >-
      Patient-derived Tay-Sachs and Sandhoff fibroblasts reveal an autophagy/lysosomal phenotype; neuronal in vivo generalization is unproven.
  - reference: PMID:34831346
    reference_title: L-Arginine Ameliorates Defective Autophagy in GM2 Gangliosidoses by mTOR Modulation.

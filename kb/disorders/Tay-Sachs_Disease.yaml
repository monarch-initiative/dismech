animal_models:
- name: Hexa knockout mouse
  species: Mouse
  genotype: Hexa-/- (targeted disruption of the Hexa alpha-subunit gene)
  publication: PMID:7610760
  genes:
  - preferred_term: HEXA
    term:
      id: hgnc:4878
      label: HEXA
  description: >-
    The original targeted Hexa disruption abolishes beta-hexosaminidase A
    activity and produces age-dependent neuronal GM2 storage with membranous
    cytoplasmic bodies indistinguishable from human Tay-Sachs disease, but the
    storage is confined to cerebral cortex, hippocampus, amygdala, hypothalamus
    and mammillary nucleus. Olfactory bulb, cerebellar cortex and spinal
    anterior horn are spared, and the animals stay largely asymptomatic. The
    difference is a species difference in ganglioside catabolism: the mouse
    sialidase Neu3 provides a bypass around the hexosaminidase A block, so the
    single knockout understates the human disease.
  evidence:
  - reference: PMID:7610760
    reference_title: "Neuropathology of mice with targeted disruption of Hexa gene, a model of Tay-Sachs disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mice were completely devoid of beta-hexosaminidase A activity and accumulated GM2 ganglioside in the CNS in an age-dependent manner."
    explanation: Establishes the Hexa knockout as a model of the enzymatic block and of neuronal GM2 storage.
  modeled_mechanisms:
  - target: GM2 ganglioside accumulation in neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete loss of hexosaminidase A activity with age-dependent neuronal
      GM2 storage and membranous cytoplasmic bodies matching human Tay-Sachs
      histopathology, but only in a subset of brain regions.
    limitations: >-
      Storage is restricted to certain forebrain regions rather than
      generalised, and the cerebellar cortex and spinal anterior horns, which
      carry the human late-onset phenotype, are spared. The mouse sialidase
      Neu3 degrades stored GM2 through a bypass that humans do not have, so the
      single knockout is asymptomatic and neither disease course nor
      therapeutic response should be transferred from it without a model that
      removes the bypass.
    readouts:
    - name: Regional distribution of GM2 storage neurons
      target: GM2 ganglioside accumulation in neurons
      direction: ALTERED
      interpretation: >-
        The regional pattern, not the presence of storage, is what diverges
        from human disease in this model.
      evidence:
      - reference: PMID:7610760
        reference_title: "Neuropathology of mice with targeted disruption of Hexa gene, a model of Tay-Sachs disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, unlike Tay-Sachs disease in which neurons throughout the brain are affected, the localization of storage neurons in these mice appeared to be limited to certain regions"
        explanation: Directly reports the regional restriction that distinguishes the mouse from human Tay-Sachs neuropathology.
  notes: >-
    The bypass responsible for the mild phenotype was later identified: Neu3
    deficiency drastically increases brain GM2 storage in this model, which is
    why the double knockout below is the infantile-phenotype model
    (PMID:28442549).
- name: Hexa/Neu3 double knockout mouse
  species: Mouse
  genotype: Hexa-/-Neu3-/-
  publication: PMID:41819452
  genes:
  - preferred_term: HEXA
    term:
      id: hgnc:4878
      label: HEXA
  description: >-
    Deleting the mouse sialidase Neu3 alongside Hexa removes the murine bypass
    of the hexosaminidase A block. The resulting animals accumulate GM2
    throughout the brain and develop astrogliosis, Purkinje cell loss,
    progressive neurodegeneration, slowed movement, ataxia and tremors, dying
    at roughly 20 weeks. This, not the Hexa/Hexb double knockout, is the mouse
    genotype that reproduces the infantile human phenotype.
  evidence:
  - reference: PMID:41819452
    reference_title: "Human Neuraminidase 3 reduces the severity of Tay-Sachs disease symptoms in a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, Hexa-/- mice show a relatively mild phenotype, suggesting degradation of stored GM2 ganglioside through a 'bypass' involving a sialidase."
    explanation: States the rationale for combining Hexa and Neu3 disruption, namely that a murine sialidase bypass masks the single knockout phenotype.
  modeled_mechanisms:
  - target: GM2 ganglioside accumulation in neurons
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Brain-wide GM2 accumulation with cytoplasmic vacuolisation of nerve
      cells, Purkinje cell deterioration, neuronal death, and the movement
      phenotype of infantile disease.
    limitations: >-
      The genotype requires deletion of a second gene, Neu3, that is not
      mutated in human Tay-Sachs disease, so the model is a compensating
      construct rather than a genocopy. Studies of Neu3-directed therapy in
      this background test a pathway that human patients do not depend on in
      the same way.
    evidence:
    - reference: PMID:41819452
      reference_title: "Human Neuraminidase 3 reduces the severity of Tay-Sachs disease symptoms in a mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, Hexa-/-Neu3-/- mice, which mimic the neuropathological and clinical abnormalities observed in patients, were considered the early-onset TSD model."
      explanation: The authors' own conclusion that this genotype reproduces the neuropathology and clinical course of infantile Tay-Sachs disease.
    readouts:
    - name: Brain GM2 ganglioside content
      target: GM2 ganglioside accumulation in neurons
      direction: INCREASED
      interpretation: Thin-layer chromatography and mass spectrometry of brain confirm accumulation of the stored substrate.
      evidence:
      - reference: PMID:41819452
        reference_title: "Human Neuraminidase 3 reduces the severity of Tay-Sachs disease symptoms in a mouse model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Abnormal GM2 accumulation was revealed in the brains of Hexa-/-Neu3-/- mice using thin-layer chromatography and mass spectrometric analyses."
        explanation: Direct biochemical measurement of the accumulated substrate in this model.
- name: Hexa Gly269Ser knock-in / Neu3 knockout mouse
  species: Mouse
  genotype: Hexa Gly269Ser knock-in with Neu3 knockout, compared with Hexa knockout with Neu3 knockout
  publication: PMID:40916664
  genes:
  - preferred_term: HEXA
    term:
      id: hgnc:4878
      label: HEXA
  description: >-
    CRISPR/Cas9 knock-in of the common adult-onset Hexa Gly269Ser variant on a
    Neu3-null background was built to be the chronic counterpart of the acute
    Hexa knockout model. It was not: both genotypes accumulated GM2 throughout
    the brain, lost reflexes, developed gait abnormalities and died by 24
    weeks, and survival and behaviour did not separate the two. The knock-in
    does retain substantial Hexa mRNA and evidence of GM2 turnover, so its
    value is as a substrate for gene-editing correction and for testing
    therapies aimed at partial enzyme deficiency, not as a phenocopy of the
    human late-onset course.
  evidence:
  - reference: PMID:40916664
    reference_title: "Generation of mice with combined Hexa Gly269Ser KI or KO and Neu3 KO alleles to create new models of GM2 gangliosidoses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although survival and behavioural phenotypes did not differ between KO and KI models, the KI model had substantial Hexa mRNA and evidence of GM2 turnover."
    explanation: Reports that the intended acute-versus-chronic separation between the knockout and knock-in genotypes did not appear.
  modeled_mechanisms:
  - target: Residual Hexosaminidase A activity in late-onset disease
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knock-in carries the human late-onset allele but does not produce the
      delayed, slowly progressive phenotype that allele produces in people.
    limitations: >-
      Both the Gly269Ser knock-in and the null allele gave brain-wide GM2
      accumulation, progressive loss of reflexes, gait abnormality and death by
      24 weeks, with no difference in survival or behaviour between them. The
      human dose-response, in which roughly 2 to 4 percent residual activity
      delays onset into adulthood, is therefore not reproduced, and this model
      cannot be used to study late-onset disease progression or to test whether
      raising residual activity delays onset.
    evidence:
    - reference: PMID:40916664
      reference_title: "Generation of mice with combined Hexa Gly269Ser KI or KO and Neu3 KO alleles to create new models of GM2 gangliosidoses."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, both models accumulated GM2 ganglioside throughout the brain when compared to controls (CON), and exhibited progressive loss of reflexes, gait abnormalities, and premature death by 24 weeks of age."
      explanation: The knock-in intended to model chronic adult-onset disease behaved like the complete-deficiency model instead.
- name: Jacob sheep Tay-Sachs disease
  species: Sheep
  genotype: Naturally occurring homozygous HEXA missense variant at the end of exon 11 causing exon 11 skipping
  background: Jacob sheep
  publication: PMID:20817517
  description: >-
    Jacob sheep carrying a naturally occurring HEXA splice-disrupting missense
    variant die of progressive neurodegeneration at 6 to 8 months with absent
    hexosaminidase A activity and raised brain GM2 and asialo-GM2. The ovine
    HEXA coding sequence is 86 percent identical to human, and carrier
    frequency reached 14 percent across three flocks. Being a large,
    spontaneously affected, gyrencephalic model, it is the platform on which
    CSF-delivered AAV gene therapy extended survival from about 9 months to as
    long as 5 years.
  evidence:
  - reference: PMID:20817517
    reference_title: "Tay-Sachs disease in Jacob sheep."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Brain lipid analyses demonstrated the presence of increased concentrations of G(M2)-ganglioside and asialo-G(M2)-ganglioside."
    explanation: Confirms the storage phenotype in a naturally occurring large-animal HEXA model.
  modeled_mechanisms:
  - target: GM2 ganglioside accumulation in neurons
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A spontaneous HEXA lesion producing absent hexosaminidase A activity and
      brain GM2 storage, with a fatal neurodegenerative course, in a large
      gyrencephalic brain.
    limitations: >-
      Sheep hexosaminidase alpha subunits do not dimerise with human beta
      subunits, so cross-species enzyme reconstitution experiments do not
      transfer; and the causal variant is a splice-disrupting ovine allele
      rather than a human pathogenic variant.
    readouts:
    - name: Survival under CSF-delivered AAV9 HexA/HexB gene therapy
      target: GM2 ganglioside accumulation in neurons
      direction: RESTORED
      interpretation: >-
        Restoring the enzyme reverses the disease course, which is therapeutic
        evidence for the direction of the causal chain rather than only for its
        existence.
      evidence:
      - reference: PMID:41026525
        reference_title: "Five-year analysis of efficacy and safety of a bidirectional AAV gene therapy in Tay-Sachs sheep."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The longest survival and best distribution were achieved by multipoint CSF delivery (combined CM, ICV, and LIT) with treated animals that survived up to 5 years of age (untreated animals with TSD die after ~9 months)."
        explanation: >-
          Enzyme restoration by gene transfer extends survival roughly
          five-fold in the natural large-animal model, with postmortem GM2
          clearance, supporting hexosaminidase A deficiency as the proximate
          cause rather than an accompaniment.
  notes: >-
    The 5-year figure is the longest-surviving treated animal; the four-site
    CSF cohort averaged 45 months against 9.4 months untreated.

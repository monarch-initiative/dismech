- name: PERK-mediated unfolded protein response activation
  description: >
    GM2 accumulation engages the PERK arm of the unfolded protein response in
    cellular models of GM2 gangliosidosis, with up-regulation of the
    pro-apoptotic effector CHOP and atrophy of neurites. The chemical chaperone
    ursodeoxycholic acid binds the PERK cytosolic domain and reduces both
    readouts, which is pharmacological evidence that this arm contributes to
    neuronal injury rather than merely accompanying it.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  downstream:
  - target: Neuron death
    description: PERK signalling raises pro-apoptotic CHOP in GM2-loaded neurons, and blocking it with a chaperone reduces neurite atrophy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - PERK activation
    - CHOP up-regulation
  evidence:
  - reference: PMID:37108372
    reference_title: "Ursodeoxycholic Acid Binds PERK and Ameliorates Neurite Atrophy in a Cellular Model of GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Previously, we demonstrated in a cellular model of GM2 gangliosidosis that PERK, a UPR sensor, contributes to neuronal death."
    explanation: States the causal role of the PERK branch of the unfolded protein response in neuronal death under GM2 accumulation.
  - reference: PMID:37108372
    reference_title: "Ursodeoxycholic Acid Binds PERK and Ameliorates Neurite Atrophy in a Cellular Model of GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we found that UDCA significantly diminished the neurite atrophy induced by GM2 accumulation in primary neuron cultures. It also decreased the up-regulation of pro-apoptotic CHOP, a downstream PERK-signaling component."
    explanation: Pharmacological rescue of GM2-induced neurite atrophy with reduced CHOP induction links the PERK arm to the neuronal injury it accompanies.
  notes: >-
    Emerging. Primary neuron culture and biochemical data only; no in vivo
    Tay-Sachs validation, and no human tissue evidence. Whether this arm is
    upstream of, downstream of, or parallel to the neuroinflammatory response
    is an open question recorded under discussions.

      Biochemical review distinguishes variant effects on folding/transport from the rarer substrate-specific functional changes.
  notes: >-
    Biallelic loss-of-function HEXA alleles impair synthesis, splicing, folding, transport, stability or catalytic function of the HexA alpha subunit. Variant severity and residual activity contribute to the clinical continuum, with incomplete individual genotype-phenotype prediction. Founder alleles enrich some populations, but disease occurs across ancestries.
treatments:
- name: Hematopoietic stem cell transplantation (HSCT)
  description: >-
    An uncontrolled late-onset case had normalized leukocyte HexA and nonprogressive tremor eight years after HSCT. Most features were already static before transplantation, so this does not establish that HSCT arrests neurodegeneration or normalizes CNS enzyme activity. Infantile natural-history data found no associated survival advantage; HSCT is not established standard care.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:29214523
    reference_title: "Haematopoietic Stem Cell Transplantation Arrests the Progression of Neurodegenerative Disease in Late-Onset Tay-Sachs Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT is a potential treatment option which might arrest neurodegeneration in patients with LOTS."
    explanation: >-
      One case provides a biochemical and longitudinal clinical signal; pretreatment stability and lack of controls limit causal efficacy inference.
  - reference: PMID:29214523
    reference_title: Haematopoietic Stem Cell Transplantation Arrests the Progression of Neurodegenerative Disease in Late-Onset Tay-Sachs Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His condition had had a static course apart from his tremor that had been gradually deteriorating.
    explanation: >-
      The pretreatment course limits claims that transplantation halted otherwise progressive global disease.
  - reference: PMID:22025593
    reference_title: Natural history of infantile G(M2) gangliosidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hematopoietic stem cell transplantation was not associated with prolonged survival.
    explanation: >-
      Five transplant recipients were evaluated separately in this infantile GM2 natural-history study; this is observational evidence, not randomized efficacy testing.
- name: Supportive Care
  description: >-
    Individualized seizure management, nutritional and swallowing assessment, airway clearance and aspiration prevention, and physical, occupational and speech therapy support function and comfort. Monitor constipation, mobility, skin/contracture risk, and psychiatric needs. Neurology follow-up is guided by clinical concerns; avoid excessive sedation, aspiration-promoting positioning and high fall risk.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:27491214
    reference_title: "The GM1 and GM2 Gangliosidoses: Natural History and Progress toward Therapy."
    supports: SUPPORT
    snippet: "Both are devastating diseases without cure or specific treatment however, with the use of supportive aggressive medical management, the lifespan and quality of life has been extended for both diseases."
    explanation: Review confirms supportive care extends lifespan and quality of life in GM2 gangliosidoses including Tay-Sachs disease.
    evidence_source: OTHER
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Treatment is mostly supportive and directed to providing adequate nutrition and hydration, managing infectious disease, protecting the airway, and controlling seizures.
    explanation: >-
      GeneReviews sets the clinical management priorities across systems.
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: psychiatric medications that have been associated with disease worsening, including haloperidol, risperidone, and chlorpromazine.
    explanation: >-
      Psychiatric care requires disease-aware individualized drug selection.
- name: Genetic Counseling
  description: >-
    Offer counseling, family/partner carrier testing and reproductive options across ancestries. Founder variants inform testing but do not exclude disease outside founder populations. Once familial variants are known, prenatal and preimplantation genetic testing are possible. Full-gene testing addresses limitations of founder-only panels.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:12108829
    reference_title: "Tay-Sachs disease screening and counseling families at risk for metabolic disease."
    supports: SUPPORT
    snippet: "Carrier testing for Tay-Sachs disease should be offered to couples when at least one individual is of Ashkenazi Jewish (carrier frequency 1/30), Pennsylvania Dutch, Southern Louisiana Cajun, or Eastern Quebec French Canadian descent."
    explanation: Review establishes carrier screening recommendations for high-risk populations including Ashkenazi Jews.
    evidence_source: OTHER
  - reference: PMID:20301397
    reference_title: HEXA Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Once both HEXA pathogenic variants have been identified in an affected family member, targeted analysis for the specific familial variants can be used for carrier testing in at-risk relatives.
    explanation: >-
      Family-specific molecular testing supports reproductive counseling.
- name: Miglustat substrate reduction investigation
  description: >-
    Miglustat reduces glycosphingolipid synthesis upstream of GM2. In a 30-patient late-onset Tay-Sachs randomized open-label study, no efficacy difference was observed; two infantile cases also continued neurologic deterioration despite CSF drug exposure. It is not an established disease-modifying treatment for Tay-Sachs.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: miglustat
  evidence:
  - reference: PMID:19346952
    reference_title: 'Miglustat in late-onset Tay-Sachs disease: a 12-month, randomized, controlled clinical study with 24 months of extended treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No differences were observed between the two groups in any efficacy measure, either during the 12-month randomized phase or the full 36 months.
    explanation: >-
      Thirty LOTS patients were randomized 20:10 to miglustat versus no miglustat for 12 months, followed by an open extension; measurable benefit was not established.
  - reference: PMID:16434676
    reference_title: Substrate reduction therapy in the infantile form of Tay-Sachs disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SRT could not arrest the patients' neurologic deterioration.
    explanation: >-
      Two infantile cases illustrate that CSF drug exposure is not sufficient evidence of clinical benefit.
  therapeutic_modality: SMALL_MOLECULE
- name: Pharmacological Chaperone Therapy
  description: >-
    Pyrimethamine can stabilize selected residual-activity HexA variants, but the response is allele- and dose-dependent. A four-patient extended pilot showed transient lymphocyte enzyme increases without discernible neurologic or psychiatric benefit. Peripheral enzyme activity does not establish CNS correction.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyrimethamine
      term:
        id: CHEBI:8673
        label: pyrimethamine
  evidence:
  - reference: PMID:35865957
    reference_title: "Therapeutic Strategies For Tay-Sachs Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This review summarizes multiple drug development strategies for TSD, including enzyme replacement therapy, pharmaceutical chaperone therapy, substrate reduction therapy, gene therapy, and hematopoietic stem cell replacement therapy."
    explanation: Review of Tay-Sachs therapeutics establishes pharmaceutical chaperone therapy as one of the active drug-development strategies for the disease.
  - reference: PMID:25896637
    reference_title: 'Effect of cyclic, low dose pyrimethamine treatment in patients with Late Onset Tay Sachs: an open label, extended pilot study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, the observed increase is repeatedly transient and not associated with discernible beneficial neurological or psychiatric effects.
    explanation: >-
      Four-patient extended pilot found transient lymphocyte HexA increases without discernible clinical benefit.
  therapeutic_modality: SMALL_MOLECULE
- name: Gene Therapy
  description: >-
    Investigational CNS-directed AAV delivery of HEXA and HEXB aims to restore HexA. Expanded access treated two infants in 2022; a subsequent nonrandomized dose-escalation trial treated seven Tay-Sachs and two Sandhoff patients. CSF enzyme activity increased, peaking near 12 weeks before declining, with partial or temporary infantile clinical stabilization. Two of three juvenile participants developed new or worsening dystonia and juvenile enrollment stopped. Vector-associated immune/transaminase responses required corticosteroids. Clinical efficacy remains incomplete and uncontrolled; serum Hex activity is not a CNS surrogate. TSHA-101 uses a different bicistronic AAV9 product from the dual AAVrh8 vectors in these publications.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:35145305
    reference_title: AAV gene therapy for Tay-Sachs disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study provides early safety and proof-of-concept data in humans for treatment of patients with TSD by AAV gene therapy.
    explanation: >-
      Two-infant expanded-access study provides early feasibility information, not proof of long-term safety or efficacy.
  - reference: PMID:40817303
    reference_title: 'Dual-vector rAAVrh8 gene therapy for GM2 gangliosidosis: a phase 1/2 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, HexA activity levels peaked in most participants at 12 weeks and declined somewhat thereafter, but remained above pretreatment levels throughout the duration of the study
    explanation: >-
      Nine-patient nonrandomized phase 1/2 trial (seven Tay-Sachs, two Sandhoff; six infantile, three juvenile) showed biochemical activity, with incomplete clinical efficacy.
  - reference: PMID:40817303
    reference_title: 'Dual-vector rAAVrh8 gene therapy for GM2 gangliosidosis: a phase 1/2 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Interestingly, two of three juvenile patients noted new or worsening dystonia, and the third experienced unexpected progression of the neurologic manifestations of their GM2 gangliosidosis.
    explanation: >-
      Juvenile toxicity led to exclusion from further recruitment and outcome analysis; risk cannot be generalized across products or all delivery routes.
  - reference: PMID:40817303
    reference_title: 'Dual-vector rAAVrh8 gene therapy for GM2 gangliosidosis: a phase 1/2 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite partial or temporary stabilization in disease course, there was no clear effect on the development of seizures.
    explanation: >-
      The discussion tempers the abstract’s seizure-benefit wording; historical comparisons and nine patients do not establish controlled efficacy.
  therapeutic_modality: GENE_THERAPY
  target_mechanisms:
  - target: Hexosaminidase A deficiency
    treatment_effect: RESTORES
    description: Gene delivery supplies HexA subunits and increases residual CNS enzyme activity; it does not correct the germline HEXA sequence.
    evidence:
    - reference: PMID:40817303

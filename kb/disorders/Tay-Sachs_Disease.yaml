- name: Failure of lysosomal GM2 hydrolysis
  description: >-
    Deficient HexA cannot remove terminal N-acetylgalactosamine from GM2 presented by GM2 activator protein, interrupting GM2-to-GM3 catabolism.
  evidence:
  - reference: PMID:12662933
    reference_title: 'Crystal structure of human beta-hexosaminidase B: understanding the molecular basis of Sandhoff and Tay-Sachs disease.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Hex A degrades G(M2) by removing a terminal N-acetyl-D-galactosamine (beta-GalNAc) residue, and this activity requires the G(M2)-activator, a protein which solubilizes the ganglioside for presentation to Hex A.
    explanation: >-
      Structural and biochemical analysis specifies the hydrolytic step.
  downstream:
  - target: GM2 ganglioside accumulation in neurons
    description: >-
      Failure of lysosomal GM2 degradation permits progressive substrate accumulation.
    causal_link_type: DIRECT
    evidence:

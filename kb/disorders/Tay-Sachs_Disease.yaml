    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - lysosomal storage stress
    - microglial activation
    - oligodendrocyte injury
  - target: Impaired autophagic flux and lysosomal permeabilization
    description: Undegraded lysosomal GM2 blocks autophagic clearance and destabilises the lysosomal membrane in patient-derived cells.
    causal_link_type: DIRECT
  - target: PERK-mediated unfolded protein response activation
    description: GM2 accumulation engages the PERK arm of the unfolded protein response in cellular models of GM2 gangliosidosis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neuron death

- accession: geo:GSE329156
  title: Modeling Tay-Sachs Disease in Astrocyte-Like Cells Reveals Significant Changes in the Transcriptomic Profile
  description: Tay-Sachs disease is a rare genetic disorder characterized by the accumulation of GM2 ganglioside in neuronal lysosomes due to deficient β-hexosaminidase A (HexA) activity. Progressive GM2storage leads to severe neurodegeneration, including developmental delay, motor weakness, seizures, ataxia, and early death, typically by five years of age. Although previous studies have elucidated several neuronal mechanisms, including apoptosis, endoplasmic reticulum stress, neuroinflammation, and demyelination, these investigations have focused almost exclusively on neurons.
  organism:

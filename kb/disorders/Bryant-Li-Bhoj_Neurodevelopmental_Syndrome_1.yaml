mechanistic_hypotheses:
- hypothesis_group_id: gain_of_function_dominant_negative_branch
  hypothesis_label: Gain-of-Function versus Dominant-Negative Mutant H3.3
  status: CANONICAL
  description: >-
    BLBS1 is not a haploinsufficiency syndrome. The causative alleles are private
    missense substitutions distributed across the whole protein, and the
    consensus reading of the model-organism and patient-cell literature is that
    they act through gain-of-function or dominant-negative effects on H3.3. Which
    of the two applies is allele specific and, for most variants, remains
    unresolved; a single unifying mechanism has not been demonstrated.
  evidence:
  - reference: PMID:36867246
    reference_title: "Histone 3.3-related chromatinopathy: missense variants throughout H3-3A and H3-3B cause a range of functional consequences across species."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most of the causative variants are private and scattered throughout the
      protein, but all seem to have either a gain-of-function or dominant negative
      effect on protein function. This is highly unusual and not well understood.
    explanation: >-
      This review states the mechanism branch explicitly and flags that it remains
      poorly understood, which is why it is modeled as a hypothesis group rather
      than a settled mechanism.
- hypothesis_group_id: g34_dnmt3a_methylome_branch
  hypothesis_label: G34-Specific H3K36me2/DNMT3A Methylome Branch
  status: ALTERNATIVE
  description: >-
    For the specific subgroup of germline H3.3 G34 substitutions, knock-in mice
    show a distinct route to progressive neurodegeneration: loss of H3K36me2 on
    the mutant tail impairs DNMT3A recruitment, redistributing DNA methylation,
    de-silencing complement and other innate-immune genes, and producing
    microglial accumulation with neuronal depletion. This branch is
    mechanistically compelling for G34 alleles but is explicitly not
    generalizable to the other, structurally dispersed BLBS1 variants, and the
    key data are murine rather than human.
  evidence:
  - reference: PMID:36931244
    reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      G34R severely decreased H3K36me2 on the mutant H3.3 tail, impairing
      recruitment of DNA methyltransferase DNMT3A and its redistribution on
      chromatin.
    explanation: >-
      The knock-in mouse defines a specific, mechanistically detailed route for
      G34 substitutions that is distinct from the general nucleosomal perturbation
      model.
  - reference: PMID:36931244
    reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our study reveals that H3.3G34-substitutions have differential impact on the
      epigenome, which underlie the diverse phenotypes observed
    explanation: >-
      The authors' own conclusion that different G34 substitutions have
      differential epigenomic impact constrains generalization of this branch to
      the wider BLBS1 allele spectrum.

pathophysiology:
- name: Heterozygous De Novo H3-3A Missense Variation
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a heterozygous, typically de novo germline missense
    variant in H3-3A. H3-3A and H3-3B encode an identical 135-amino-acid H3.3
    protein, so a heterozygous variant in one gene alters only a fraction of the
    cell's total H3.3 pool. The alleles are private and distributed across the
    disordered N-terminal tail and the histone-fold core rather than clustered at
    a hotspot, and both genes are strongly constrained against missense variation
    in the general population.
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have identified a cohort of 46 unrelated patients bearing de novo
      heterozygous germline missense mutations in H3F3A or H3F3B with a core
      phenotype of progressive neurologic dysfunction and congenital anomalies
    explanation: >-
      The discovery cohort establishes de novo heterozygous germline missense
      variation in H3F3A (H3-3A) as the initiating lesion.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In the general population, both genes have a very low rate of missense
      variants; the gnomAD missense Z score is 3.21 for H3F3A and 2.95 for H3F3B
      (>2 is significant)
    explanation: >-
      Population constraint metrics support that missense variation in H3-3A is
      strongly selected against, consistent with a pathogenic role.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      H3F3A and H3F3B code for an identical protein product, H3.3, a 135–amino
      acid protein (after cleavage of the first methionine) with a histone tail,
      four α helices, and two loop domains.
    explanation: >-
      Identical protein products from the two genes explain why BLBS1 and BLBS2
      are clinically overlapping and are reported as one cohort.
  downstream:
  - target: Mutant H3.3 Incorporation and Nucleosomal Perturbation
    causal_link_type: DIRECT
    hypothesis_groups:
    - gain_of_function_dominant_negative_branch
    evidence:
    - reference: PMID:33268356
      reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Together, these data suggest that the mutant histones can be incorporated
        into the nucleosome, cause marked local deregulation of chromatin state,
        and modestly alter the global control of histone modifications.
      explanation: >-
        Patient-cell mass spectrometry directly links the variant to incorporation
        of mutant H3.3 and to nucleosomal/chromatin perturbation.

- name: Mutant H3.3 Incorporation and Nucleosomal Perturbation
  biological_scale: MOLECULAR
  description: >-
    Mutant H3.3 is not degraded but is deposited into chromatin, where the
    substituted residue perturbs the nucleosome in one of three structurally
    modeled ways: disruption of H3.3-DNA contacts (e.g. p.R83C, whose arginine
    penetrates the DNA minor groove), destabilization of the histone octamer
    through altered intramonomer or inter-histone contacts (e.g. p.Q125R,
    p.L48R), or disruption of binding to histone chaperones and epigenetic
    reader/writer proteins (e.g. p.G90R disrupting chaperone binding; residues
    p.R8, p.S31, p.K36, and p.H39 making numerous contacts with regulators such
    as SETD2 and ZMYND11). The common consequence is impaired formation,
    deposition, or stability of H3.3-containing nucleosomes.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: nucleosome assembly
    term:
      id: GO:0006334
      label: nucleosome assembly
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In summary, through different mechanisms, the variants in this section are
      likely to affect the formation, the deposition, or the stability of the
      nucleosomes containing H3.3 or of the nucleosome pairing.
    explanation: >-
      Structural modeling of all 37 discovery-cohort variants converges on
      perturbed nucleosome formation, deposition, or stability.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We find that residues p.R8, p.S31, p.K36, and p.H39 are involved in more
      than 10 contacts across epigenetic regulators, suggesting that their
      mutation may disrupt one or more biologically relevant interactions.
    explanation: >-
      Contact analysis identifies the subset of tail residues whose substitution
      is most likely to disrupt binding by epigenetic regulators.
  - reference: PMID:34876591
    reference_title: "De novo variants in H3-3A and H3-3B are associated with neurodevelopmental delay, dysmorphic features, and structural brain abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      One H3.3 variant construct (p.R129H) was found to have stronger interaction
      with the chaperone death domain-associated protein 6.
    explanation: >-
      Direct experimental support that a BLBS variant alters H3.3 interaction with
      the DAXX chaperone, one of the modeled perturbation routes.
  - reference: PMID:34876591
    reference_title: "De novo variants in H3-3A and H3-3B are associated with neurodevelopmental delay, dysmorphic features, and structural brain abnormalities."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Three variant constructs (p.R129H, p.M121I, and p.I52N) showed significant
      decrease in protein expression, while one variant (p.R41C) accumulated at
      greater levels than wild-type control.
    explanation: >-
      Variant-specific opposite effects on H3.3 protein level demonstrate that the
      molecular consequence is allele dependent rather than uniform, so this
      evidence supports the node only partially.
  downstream:
  - target: Local Deregulation of Histone Post-Translational Modifications
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33268356
      reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These data show notable local deregulation of PTMs on the mutant protein,
        while the WT protein from the affected patient shows fewer differences
        from the control.
      explanation: >-
        The allele-resolved p.A29P analysis shows the deregulation is in cis on the
        mutant histone, directly downstream of its incorporation.
  - target: G34-Specific Loss of H3K36me2 and DNMT3A Mislocalization
    causal_link_type: DIRECT
    hypothesis_groups:
    - g34_dnmt3a_methylome_branch
    evidence:
    - reference: PMID:36931244
      reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        G34R severely decreased H3K36me2 on the mutant H3.3 tail, impairing
        recruitment of DNA methyltransferase DNMT3A and its redistribution on
        chromatin.
      explanation: >-
        Knock-in mice link the incorporated G34R histone directly to loss of a
        specific tail mark and to mislocalized DNMT3A.

- name: Local Deregulation of Histone Post-Translational Modifications
  biological_scale: MOLECULAR
  description: >-
    Quantitative mass spectrometry of patient lymphoblasts and fibroblasts shows
    that the dominant epigenetic consequence is a marked local (cis) deregulation
    of post-translational modifications on the mutant histone itself, with only
    modest change to the global histone modification landscape. This is
    qualitatively different from the somatic oncohistone K27M and K36M mutations,
    which cause near-complete trans loss of the corresponding di- and trimethyl
    marks; the more restricted effect in BLBS1 is consistent with the absence of
    malignancy in the germline cohort.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although these data show modest changes compared to cells that express
      p.K27M- or p.K36M-mutant H3.3, which display a near complete loss of di- and
      trimethylation at K27 or K36, a dominant negative effect cannot be ruled
      out.
    explanation: >-
      Direct comparison with oncohistone-expressing cells establishes that the
      germline BLBS effect on global marks is modest, while leaving a dominant
      negative contribution open.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Of greatest interest are the local chromatin changes induced by mutant
      histone deposition: H3.3 is known to have roles in diverse functions,
      including gene expression and repression, chromatin stability, DNA damage
      repair, and differentiation.
    explanation: >-
      The authors identify local chromatin change as the principal molecular
      consequence and enumerate the H3.3 functions placed at risk.
  downstream:
  - target: Dysregulated Neurodevelopmental Gene Expression and Chromatin Accessibility
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41689096
      reference_title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        In the 2D systems, we found dysregulated gene expression and chromatin
        accessibility affecting neuronal fate, adhesion, neurotransmission, and
        excitatory/inhibitory balance.
      explanation: >-
        A human iPSC neurodevelopmental model links altered H3.3 chromatin biology
        to transcriptional and accessibility change; the modeled allele is H3-3B
        p.L48R (BLBS2), so it supports the shared H3.3 mechanism only partially for
        the H3-3A entity.

- name: G34-Specific Loss of H3K36me2 and DNMT3A Mislocalization
  biological_scale: MOLECULAR
  description: >-
    In the germline H3.3 G34 substitution subgroup, the mutant tail loses
    H3K36me2, which is the recruitment signal for the de novo DNA
    methyltransferase DNMT3A. DNMT3A is consequently mislocalized, producing loss
    of neuronal non-CG (CH) methylation, aberrant CG methylation at neuronal gene
    promoters, and sustained expression of complement and other innate-immune
    genes. This is an allele-restricted branch demonstrated in knock-in mice, not
    a general BLBS1 mechanism.
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: peptidyl-lysine methylation
    term:
      id: GO:0018022
      label: peptidyl-lysine methylation
    modifier: DECREASED
  evidence:
  - reference: PMID:36931244
    reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These changes were concurrent with sustained expression of complement and
      other innate immune genes possibly through loss of non-CG (CH) methylation
      and silencing of neuronal gene promoters through aberrant CG methylation.
    explanation: >-
      The mouse model connects DNMT3A mislocalization to the specific methylation
      and innate-immune transcriptional consequences of this branch.
  downstream:
  - target: Progressive Neurologic Decline
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:

    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of BRYLIB is established in a proband with suggestive findings
      and a heterozygous pathogenic variant in either H3-3A (H3F3A) or H3-3B
      (H3F3B) identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the molecular diagnostic criterion; for BLBS1 specifically
      the relevant gene is H3-3A.
- name: Brain MRI for Supportive Phenotyping
  description: >-
    Brain MRI does not establish the diagnosis but supports it and characterizes
    the structural phenotype. The recurrent pattern — small posterior fossa,
    callosal dysgenesis, cortical developmental abnormalities, and the caudate
    and frontal-horn deformity — was defined specifically for germline H3F3
    variants and distinguishes this presentation from the somatic H3F3 tumour
    setting.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  results: >-
    A combination of small posterior fossa, callosal dysgenesis, and cortical
    developmental abnormality is supportive but not diagnostic.
  evidence:
  - reference: PMID:35772801
    reference_title: "Brain Abnormalities in Patients with Germline Variants in H3F3: Novel Imaging Findings and Neurologic Symptoms Beyond Somatic Variants and Brain Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imaging phenotypes in germline H3F3-affected individuals are related to brain
      features, including a small posterior fossa as well as dysgenesis of the
      corpus callosum, cortical developmental abnormalities, and deformity of
      lateral ventricles.
    explanation: >-
      The authors' own conclusion defines the supportive imaging phenotype for
      germline H3F3 disease.
- name: Electroencephalography for Seizure Characterization
  description: >-
    EEG characterizes seizure type in the roughly half of individuals with
    epilepsy. Prolonged video-EEG is specifically useful in neonates, where
    myoclonic movements may lack an ictal correlate and therefore may not be
    epileptic.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: MAXO:0000932
      label: electroencephalography
  results: >-
    EEG defines seizure type; a normal ictal EEG during myoclonus indicates a
    non-epileptic movement disorder.
  evidence:
  - reference: PMID:39627236
    reference_title: "Neonatal myoclonus in Bryant-Li-Bhoj syndrome associated with a novel H3F3A variant."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      displaying previously unrecognized symptoms of neonatal myoclonus
    explanation: >-
      The H3-3A case report that introduced neonatal myoclonus to the phenotype
      motivates EEG evaluation; the abstract does not itself report the EEG result,
      so the support is partial.

treatments:
- name: Antiseizure Medication
  description: >-
    Epilepsy affects about half of individuals and is managed with standard
    antiseizure medication selected by seizure type. No agent has demonstrated
    disease-specific superiority, and no comparative efficacy data exist in BLBS1.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: MAXO:0000167
      label: anticonvulsant agent therapy
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard treatment for developmental delay / intellectual disability,
      attention-deficit/hyperactivity disorder, autism spectrum disorder, anxiety,
      epilepsy, spasticity, constipation, craniosynostosis, vision issues, hearing
      loss, congenital heart defects, undescended testes, and hypothyroidism.
    explanation: >-
      GeneReviews specifies that epilepsy in BLBS receives standard, not
      disease-specific, treatment.
- name: Feeding Therapy and Gastrostomy
  description: >-
    Feeding difficulties and poor weight gain are managed with feeding therapy;

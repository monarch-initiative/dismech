  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once an H3-3A (H3F3A) or H3-3B (H3F3B) pathogenic variant has been identified

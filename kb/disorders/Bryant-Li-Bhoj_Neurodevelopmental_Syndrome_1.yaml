    explanation: >-
      GeneReviews defines the annual surveillance schedule.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that genitourinary surveillance may be important for
      individuals with BLBS going forward.
    explanation: >-
      The expanded cohort proposes an additional surveillance domain beyond the
      GeneReviews schedule.
- name: Genetic Counseling
  description: >-
    Genetic counseling covers the autosomal dominant mechanism, the presumed low
    recurrence risk after a de novo variant (with the caveat that parental
    germline mosaicism cannot be excluded), and reproductive options. Once the
    familial variant is known, prenatal and preimplantation genetic testing are
    possible.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:

      are available, though inheritance was undetermined for three individuals
    explanation: >-
      The 96-person cohort establishes that, specifically for the H3-3A (BLBS1)
      arm, all informative variants were de novo heterozygous missense alleles.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individual has a maternally inherited H3-3B heterozygous
    explanation: >-
      The only reported inherited allele in the syndrome is in H3-3B, so it
      documents that inheritance is possible for BLBS but does not establish

- name: Impaired Neuronal Differentiation and Maturation
  biological_scale: CELLULAR
  description: >-
    Downstream of the transcriptional and chromatin-accessibility changes, the
    balance of neural progenitors and mature neurons is disturbed and the neurons
    that are produced are functionally immature: whole-cell patch clamp of
    neurons from patient-variant dorsal forebrain organoids shows reduced
    electrical activity relative to control organoids. A parallel neural-crest
    and glial arm is supported by a dominant zebrafish h3f3a model, in which
    foxd3-positive neural-crest-derived glia are reduced, offering a candidate
    cellular explanation for the hypomyelination seen on patient MRI.
  mechanism_confidence: PROVISIONAL

- name: Zebrafish h3f3a model
  species: Danio rerio
  genotype: h3f3a p.D123N dominant allele; h3f3a db1092 homozygous null
  publication: PMID:33268356
  description: >-
    A zebrafish model of the orthologous gene. A dominant p.D123N allele
    recovered from a forward genetic screen sits two residues from a patient
    variant (p.Q125R) and reproduces both the dominant inheritance and the
    craniofacial anomalies of the human disease. Homozygous db1092 null larvae
    lose neural-crest-derived jaw cartilage completely and show reduced
    foxd3-positive cranial glia, melanocytes and xanthophores. Because the model
    targets the h3f3a paralog, it is the direct ortholog for BLBS1 rather than
    for BLBS2.
  modeled_mechanisms:
  - target: Neural Crest and Craniofacial Developmental Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the craniofacial and neural-crest-derived glial
      components of the human phenotype.
    limitations: >-
      The dominant allele is p.D123N, not a patient allele, and the strongest
      cartilage and pigment-cell phenotypes come from the homozygous null rather
      than from a heterozygous missense genotype - so the model is closer to
      loss of h3f3a function than to the gain-of-function or dominant-negative
      mechanism inferred in patients. Zebrafish craniofacial cartilage is not a
      direct counterpart of human facial dysmorphism, and the model says nothing
      about the neurodevelopmental or degenerative phenotypes that dominate the
      human disease.
    readouts:
    - name: Neural-crest-derived jaw cartilage
      target: Neural Crest and Craniofacial Developmental Defect
      direction: DECREASED
      interpretation: >-
        Complete loss of jaw cartilage in homozygous null larvae, the structural
        readout of the craniofacial node.
      evidence:
      - reference: PMID:33268356
        reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous h3f3adb1092 mutants display complete loss of neural crest–derived jaw cartilages (n = 10/10)."
        explanation: >-
          Reports the cartilage measurement behind this readout.
    - name: foxd3-positive cranial glia
      target: Neural Crest and Craniofacial Developmental Defect
      direction: DECREASED
      interpretation: >-
        Reduced cranial glia, the readout that connects the model to the human
        hypomyelination finding.
      evidence:
      - reference: PMID:33268356
        reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous h3f3adb1092 mutants injected at the one-cell stage with a control mCherry RNA show partial reductions in cranial glia (n = 5), melanocytes (n = 4), and xanthophores (n = 3), while those injected with dominant-negative H3f3a RNA to further reduced H3.3A function show complete loss of melanocytes (n = 5) and severe reductions of glia (n = 6) and xanthophores (n = 4) throughout cranial and trunk regions."
        explanation: >-
          Reports the in situ hybridization measurements of glia, melanocytes
          and xanthophores in this model.
    evidence:
    - reference: PMID:33268356
      reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This heterozygous missense variant replicates the dominant inheritance observed in humans and is only two amino acids away from a mutation identified in an affected patient (p.Q125R)."
      explanation: >-
        Supports treating this model as informative for the human craniofacial
        node, on the strength of the shared dominant inheritance and the
        proximity of the allele to a patient variant.
  associated_phenotypes:
  - Craniofacial anomalies
  - Loss of neural-crest-derived jaw cartilage
  - Reduced foxd3-positive neural-crest-derived glia
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A zebrafish model showed craniofacial anomalies and a defect in Foxd3-derived glia."
    explanation: >-
      Summarises the model phenotype recapitulating the craniofacial and glial
      components of the disease.
discussions:
- discussion_id: blbs1_genotype_phenotype_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What accounts for the phenotypic variability that gene, protein domain and
    sex together fail to explain - including variability between individuals
    carrying the same H3-3A allele?
  attaches_to:
  - pathophysiology#De Novo H3-3A Variant Altering Histone H3.3
  - phenotypes#
  rationale: >-
    The 2024 cohort tested three candidate explanatory variables against the
    phenotype and found that variant location and affected gene contribute more
    than sex, but that none of them accounts for the observed variation. Four
    individuals sharing H3-3A p.Thr45Ile have substantially different
    presentations. The founding report had gone further, concluding that neither
    variant location nor which gene was involved affected the phenotype at all;
    the larger cohort softened that to statistical trends. Either way there is a
    determinant that has not been found, and the authors raise gene-environment
    interaction as a possibility precisely because histones sit at the
    genetics-epigenetics interface.
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since these variables do not account for all BLBS phenotypic variability, these findings suggest that additional factors may play a role in modifying the phenotypes of affected individuals."
    explanation: >-
      States the residual, unexplained variability directly.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, phenotypic heterogeneity was present even amongst individuals harboring the same variant."
    explanation: >-
      Shows that the unexplained variability persists at fixed genotype, which
      rules out variant identity as the missing determinant.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations are spread throughout the coding sequence, and neither the location of the mutation nor whether the mutation is in H3F3A or H3F3B appears to affect the phenotype."
    explanation: >-
      The earlier and stronger negative claim, since qualified by the larger
      cohort. It is marked INDIRECT because it overstates the absence of any
      correlation, so the knowledge gap follows from it only once that
      overstatement is discounted.
- discussion_id: blbs1_cancer_predisposition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do germline H3.3 variants confer cancer predisposition, given that the same
    residues are oncogenic when altered somatically?
  attaches_to:
  - pathophysiology#Deregulated Cell Proliferation
  rationale: >-
    Patient cells show up-regulated mitosis and division programs and increased
    proliferative capacity, and germline substitutions occur at residues whose
    somatic counterparts drive paediatric glioma - yet no malignancy occurred in
    the founding cohort. A 2025 survey of 192 individuals with germline
    histonopathies identified the second known individual with both a germline
    histonopathy and a cancer diagnosis, putting community-wide incidence at 1%,
    below the 5% threshold at which routine tumour surveillance is recommended.
    So the current answer is "no surveillance", reached on a denominator small
    enough that the question stays open, and the authors name it as outstanding.
  evidence:
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the community-wide cancer incidence is currently 1%, which falls below the recommended 5% cut off for routine surveillance."
    explanation: >-
      Argues against clinically actionable cancer predisposition at present,
      which is why no surveillance treatment is curated in this entry.
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the value of ongoing translational work to address the outstanding question of cancer predisposition for individuals living with germline histonopathies"
    explanation: >-
      The authors name cancer predisposition as an outstanding question, which
      is the gap recorded here.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, although all known H3.3 mutations in humans cause cancer, none of the patients in our cohort have cancer."
    explanation: >-
      States the paradox that makes the question worth keeping open.
- discussion_id: blbs1_no_neurodevelopmental_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the available in vivo models capture a disease caused by heterozygous
    gain-of-function or dominant-negative alleles, when one is a homozygous null
    and the other is scored on behavioural endpoints with no
    neuropathological correlate?
  attaches_to:
  - animal_models#Zebrafish h3f3a model
  - animal_models#H3.3 T45I knock-in mouse
  - pathophysiology#Progressive Postnatal Neuronal H3.3 Dependence
  rationale: >-
    The two models fail in opposite directions. The zebrafish h3f3a mutant has a
    dominant allele that reproduces the mode of inheritance, but its strong
    cartilage and pigment-cell phenotypes come from the homozygous null - a
    loss-of-function genotype, where the human disease is read as gain of
    function or dominant negative on a background of three wild-type H3.3
    alleles - and it speaks only to craniofacial and glial development. The
    T45I knock-in mouse fixes the genotype problem exactly, carrying the most
    recurrent human allele in heterozygous form, and reproduces the two-phase
    natural history; but its endpoints are developmental milestones, gait and
    behaviour, with no reported structural brain phenotype and no
    neuropathology. So the entry's central claim - that the degenerative phase
    follows from the postnatal shift of the neuronal H3 pool to H3.3 - is
    consistent with the mouse but not tested by it, and the structural findings
    that define the human neuroimaging phenotype have no in vivo counterpart in
    either model. The mouse is also so far a preprint.
  evidence:
  - reference: PMID:36867246
    reference_title: "Histone 3.3-related chromatinopathy: missense variants throughout H3-3A and H3-3B cause a range of functional consequences across species."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most of the causative variants are private and scattered throughout the protein, but all seem to have either a gain-of-function or dominant negative effect on protein function. This is highly unusual and not well understood."
    explanation: >-
      States the human mechanism that a null model does not reproduce, and
      concedes it is not well understood.
  - reference: DOI:10.64898/2026.06.16.732665
    reference_title: "A novel preclinical mouse model recapitulates progressive phenotypes of Bryant-Li-Bhoj Syndrome"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult mice additionally display craniofacial differences, impaired nest building, hyperactivity in a social context, and male-specific elevated aggression."
    explanation: >-
      The mouse endpoints are behavioural and morphometric throughout; no
      structural brain or neuropathological readout is reported, which is the
      half of the human phenotype that stays unmodelled.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous h3f3adb1092 mutants display complete loss of neural crest–derived jaw cartilages (n = 10/10)."
    explanation: >-
      The informative cartilage phenotype comes from a homozygous null, which is
      the genotype mismatch this discussion records.
references:
- reference: PMID:37782742
  title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome"
  tags:
  - GeneReviews
notes: >-
  Entity scope: this entry covers BLBS1 (H3-3A, OMIM 619720) only. The H3-3B
  counterpart, BLBS2, already exists as its own entry and is recorded here as a
  differential diagnosis, mirroring how that entry treats BLBS1.

  Cohort figures are reported for the combined BLBS cohort far more often than
  they are stratified by gene, because the two genes encode an identical protein
  and were ascertained together. Where a gene-stratified number exists it is
  used and labelled; where only a combined-cohort figure exists it is quoted as
  such. The one firmly H3-3A-specific statement available is that every H3-3A
  variant with parental data has been a de novo missense change, which is not
  true of H3-3B.

  `just preflight-dr` returned WARN on the research report: H3-3B is mentioned
  27 times against 34 for H3-3A, because the report discusses both entities. The
  report's H3-3B-specific content - the p.Leu48Arg iPSC hyper-deposition model,
  the inherited p.Asn108Ser allele, the synonymous stop-gain and stop-loss
  alleles - was excluded from this entry rather than folded in.

  No `conforms_to` declaration is made against
  `epigenetic_machinery_neurodevelopmental_dysregulation`. That module's entry
  node is haploinsufficiency of an epigenetic machinery component, and this
  disease is explicitly not haploinsufficiency: three of four H3.3 alleles are
  wild type and the mechanism is read as gain of function or dominant negative.
  The sibling BLBS2 entry makes the same choice.

  Two animal models are curated. The h3-3a p.T45I knock-in mouse
  (DOI:10.64898/2026.06.16.732665) is genotype-matched to the recurrent human
  allele this entry records under `variants`, and is so far a preprint; it is
  curated because it is the only in vivo model of an actual patient allele, and
  its preprint status and its purely behavioural endpoints are stated in the
  link `limitations` and in the HUMAN_MODEL_MISMATCH discussion. The `DOI:`
  prefix is in the reference validator's `skip_prefixes`, so its seven snippets
  are not machine-verified; each was checked by hand against
  `references_cache/DOI_10.64898_2026.06.16.732665.md`.

  Two ontology CURIEs suggested by the research report were wrong and were
  replaced after checking the ontologies directly: HP:0031808 is "Decreased
  total basophil count", not Camptocormia (HP:0100595), and CL:0002608 is
  "hippocampal neuron", not radial glial cell (CL:0000681). HP:0007256 was also
  offered for spasticity but is "Abnormal pyramidal sign"; HP:0001257 is used
  instead.

  A ClinGen Definitive gene-disease validity classification for H3-3A to BLBS1
  was dropped rather than left as uncited prose: `just clingen-refresh`
  currently fails on a checksum mismatch against the pinned
  `gene_validity.csv`, so no `CGGV:` record could be generated to quote, and
  fixing that pin is a repository-maintenance change rather than part of this
  entry.

  Six of the reference-cache files added alongside this entry are not cited.
  They were screened and set aside: they come from the deep-research run's own
  citation-validation pass and are committed because the report that cites them
  is committed, not because they support anything in the entry.

  Phenotype frequencies come from Table 1 of the 2024 cohort paper, which
  reports the combined BLBS cohort rather than an H3-3A-only stratification;
  each is quoted with its own denominator so the reader can see what population
  it describes. Where a phenotype is named only in GeneReviews management or
  surveillance guidance - hearing impairment, autism spectrum disorder - no
  frequency is recorded, because none is published.

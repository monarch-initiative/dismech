    snippet: >-
      Further investigation of this model also reveals a defect in foxd3-positive
      neural crest–derived glia, as well as melanocytes and xanthophores
    explanation: >-
      The zebrafish h3f3a model supports a neural-crest and glial differentiation
      arm alongside the neuronal arm.
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33268356
      reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The loss of glial cells may relate to the hypomyelination phenotype that is
        noted on the brain MRIs of over one-third of the H3.3 cohort as glial cells
        are the cell type responsible for myelination.
      explanation: >-
        The authors propose, but do not prove, that the glial differentiation
        defect underlies the human hypomyelination imaging phenotype, so the edge

      label: Autosomal dominant inheritance
  description: >-
    BLBS1 is autosomal dominant and is essentially always caused by a de novo
    heterozygous H3-3A variant. In the 96-person combined BLBS cohort, every
    H3-3A variant with available parental testing was de novo. Recurrence risk
    for parents of a proband is presumed low, though parental germline mosaicism
    cannot be excluded. A single maternally inherited allele has been reported in
    the syndrome, but that individual carried an H3-3B (BLBS2) variant, not an
    H3-3A variant.
  penetrance: UNKNOWN
  expressivity: VARIABLE

pathophysiology:
- name: De Novo H3-3A Variant Altering Histone H3.3
  biological_scale: MOLECULAR
  description: >-
    Heterozygous pathogenic H3-3A missense substitutions alter a core nucleosomal protein. Most are rare and
    distributed across the tail and core, but recurrent alleles occur. Dominant-negative or gain-of-function
    mechanisms have been proposed; variant-specific biochemical effects include both increases and decreases
    in measured abundance or interactions. Haploinsufficiency is not established as the general explanation.
  genes:
  - preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  molecular_functions:
  - preferred_term: structural constituent of chromatin
    modifier: ABNORMAL
    term:
      id: GO:0030527
      label: structural constituent of chromatin
  genetic_context:
    gene:
      preferred_term: H3-3A
      term:
        id: hgnc:4764
        label: H3-3A
    allele_type: MISSENSE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      De novo heterozygous missense variants with heterogeneous biochemical effects; a uniform functional category
      is not assigned.

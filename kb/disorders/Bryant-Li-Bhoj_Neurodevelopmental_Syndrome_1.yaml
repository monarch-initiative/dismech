    snippet: "At each visit: measure growth parameters; assess nutrition safety and oral intake; monitor for constipation; assess for new manifestations, such as seizures and changes in tone and/or gait; monitor developmental progress and educational needs; and assess for behavioral issues, such as mobility and self-help skills."
    explanation: >-
      The GeneReviews surveillance schedule recorded in this entry.

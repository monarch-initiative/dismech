- name: Abnormal Brain Development
  biological_scale: TISSUE
  description: >-
    Disturbed neuronal and glial differentiation manifests structurally. Brain
    MRI is abnormal in 58% of imaged individuals, with delayed myelination or
    hypomyelination, corpus callosum dysgenesis, dilated ventricles, and
    hemispheric asymmetry. A dedicated neuroradiological re-review of 18 BLBS
    MRIs identified a more specific pattern dominated by a small posterior fossa
    (72%), cortical developmental abnormalities including dysgyria and
    hypoplastic temporal poles (44%), an internally rotated small-caudate and
    squared-frontal-horn configuration (33%), and splenial dysgenesis (28%).
  mechanism_confidence: ESTABLISHED
  biological_processes:

    snippet: All reported adults have had a new subacute onset of motor issues in the third decade of life that generally remains stable after onset.
    explanation: This statement refers to a very small adult series, not all future adults with BLBS1.
  - reference: PMID:34876591
    reference_title: "De novo variants in H3-3A and H3-3B are associated with neurodevelopmental delay, dysmorphic features, and structural brain abnormalities."

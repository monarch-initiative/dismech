- discussion_id: blbs1_no_neurodevelopmental_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which variant-specific mechanisms explain the human brain phenotype, and which model findings generalize
    to H3-3A disease?
  attaches_to:
  - animal_models#H3.3 T45I knock-in mouse
  - animal_models#Zebrafish h3f3a D123N db1092 model
  - animal_models#Mouse H3f3a G34R/V/W mechanistic comparison
  - pathophysiology#Progressive Postnatal Neuronal H3.3 Dependence
  rationale: >-
    The db1092 fish has a dominant-negative missense allele and peripheral neural-crest endpoints. The T45I
    mouse matches a recurrent H3-3A allele but has preserved performance on several cognitive/social assays
    and no genotype difference in the reported adult brain cell counts. G34R H3f3a mice demonstrate DNA-methylation
    and neuroinflammatory changes, but the human cases motivating that model have H3-3B variants. The 2026
    L48R neural-organoid study likewise concerns H3-3B. None establishes a uniform human H3-3A mechanism or
    tests age-dependent H3.3 replacement as the general cause of progression.
  evidence:
  - *id010
  - *id015
  - reference: PMID:41689096
    reference_title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Here, we investigate how one BLBS-causative variant, H3-3B p.Leu48Arg (L48R), affects neurodevelopment
    explanation: The neural progenitor, neuron and organoid study concerns the sibling genetic entity; it is not assigned as a BLBS1 patient model.

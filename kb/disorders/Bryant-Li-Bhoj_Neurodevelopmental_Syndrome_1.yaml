- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint of the developmental arm is developmental delay /
    intellectual disability, typically severe, with delayed or unattained
    independent sitting, walking, and speech; abnormal muscle tone (most often
    hypotonia, but also hypertonia or axial hypotonia with peripheral
    hypertonia); epilepsy in about half; and nonspecific craniofacial
    dysmorphism. Growth is frequently abnormal, most often undergrowth.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ninety-nine percent of individuals with BLBS have DD/ID
    explanation: >-
      The 96-person cohort establishes near-universal developmental delay /
      intellectual disability as the organism-level endpoint.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental delay was seen in varying degrees in the majority of patients;
      hypotonia, poor growth, oculomotor abnormalities, seizures, abnormal skull
      shape, and microcephaly were also commonly seen in the patients.
    explanation: >-
      The discovery cohort enumerates the accompanying organism-level features of
      the neurodevelopmental endpoint.

- name: Progressive Neurologic Decline
  biological_scale: ORGANISM
  description: >-
    A subset of affected individuals develops clinical neurologic degeneration on
    top of the static developmental impairment — spasticity, loss of acquired
    milestones, worsening gait, and camptocormia — and cortical atrophy is seen
    on MRI in about a quarter of the discovery cohort even without intractable
    epilepsy. This progressive arm motivated the original framing of BLBS as a
    neurodegenerative disorder; the expanded cohort reframes the syndrome as
    spanning a neurodevelopmental-to-neurodegenerative continuum rather than
    being uniformly progressive, and longitudinal natural-history data remain
    sparse.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, 9 of the 46 patients (21%) have demonstrated clinical neurologic
      degeneration, which suggests that this may be a progressive disorder.
    explanation: >-
      The discovery cohort quantifies the affected subset and states the
      progressive interpretation as a suggestion rather than an established fact.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple patients (26% of the cohort) have cortical atrophy on brain
      magnetic resonance imaging (MRI), even without intractable epilepsy.
    explanation: >-
      Cortical atrophy independent of seizure burden supports a genuine
      degenerative process rather than seizure-related secondary change.
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      other neurologic findings (spasticity, loss of developmental milestones,
      worsening gait, and/or camptocormia
    explanation: >-
      GeneReviews enumerates the clinical manifestations of the progressive
      neurologic arm.

progression:
- phase: Congenital and infantile presentation
  age_range: Birth through infancy
  notes: >-
    Presentation is typically congenital or infantile and insidious, recognized
    as milestones are missed. Hypotonia, feeding difficulty, craniofacial
    dysmorphism, and in some cases neonatal seizures or myoclonus are the
    earliest manifestations.
  evidence:
  - reference: PMID:39627236
    reference_title: "Neonatal myoclonus in Bryant-Li-Bhoj syndrome associated with a novel H3F3A variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present a Japanese patient with a novel heterozygous p.A48G variant
      in H3F3A, displaying previously unrecognized symptoms of neonatal myoclonus.
    explanation: >-
      An H3-3A-specific case report documents a neonatal-onset movement phenotype
      at the earliest end of the presentation window.
- phase: Childhood neurodevelopmental course
  age_range: Infancy through childhood
  notes: >-
    Motor and language milestones are delayed or unattained, and many affected
    individuals never achieve independent sitting, walking, or speaking, although
    the range of outcomes is wide.
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many affected individuals do not achieve independent sitting, walking, or
      speaking, although there is a range of developmental outcomes.
    explanation: >-
      GeneReviews describes the childhood milestone trajectory and its
      variability.
- phase: Variable later neurologic course with survival into adulthood
  age_range: Adolescence through adulthood
  notes: >-
    A minority develop progressive neurologic dysfunction; the oldest individual
    in the discovery cohort was 32 years and developed seizures at 14 and
    progressive spastic paraparesis at 29. The expanded cohort ranged up to 39
    years, establishing survival into adulthood, but no life-expectancy estimate
    exists. Phenotypes change across the lifespan, so longitudinal re-evaluation
    is required.
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For example, the oldest patient in this cohort (32 years) developed seizures
      at the age of 14 years and a progressive spastic paraparesis starting at the
      age of 29 years.
    explanation: >-
      A single detailed trajectory illustrates late-onset progressive neurologic
      decline in an adult with the syndrome.
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this work highlights the ways in which histonopathy-associated phenotypes
      change throughout the lifespan, necessitating longitudinal re-evaluation
    explanation: >-
      The pan-histonopathy analysis establishes that the phenotype is not static
      across the lifespan.


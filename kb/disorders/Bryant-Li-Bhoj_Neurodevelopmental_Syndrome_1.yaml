- name: Variant-Dependent Histone H3.3 Abundance
  biological_scale: MOLECULAR
  description: In transient HEK293T assays, H3-3A R129H and M121I reduce protein abundance whereas R41C increases it. The experiment measures steady-state expression and does not by itself distinguish altered synthesis from degradation or establish patient-neuronal dosage.
  evidence:
  - *id002
- name: Altered H3.3 Chaperone Interaction
  biological_scale: MOLECULAR
  description: H3-3A R129H increases DAXX co-immunoprecipitation despite reduced histone abundance. Nuclear localization is preserved. Increased binding does not prove greater chromatin deposition. A newer preprint finds loss of DAXX association for mature-histone G90R, underscoring assay- and allele-dependent effects.
  evidence:
  - *id003
  - reference: url:https://www.biorxiv.org/content/10.1101/2025.09.09.674984v1.full
    reference_title: "H3.3 De Novo Mutations Alter Lysine 36 Methylation via Distinct Mechanisms | bioRxiv"
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: there was a complete loss of associations between H3.3 G90R and DAXX
    explanation: Preprint BioID and immunoprecipitation identify loss of interaction for G90R; mature-histone G90R equals HGVS G91R.
- name: Aberrant Local Histone Post-Translational Modification
  biological_scale: MOLECULAR
  description: >-
    Patient-derived lymphoblast and fibroblast assays identify prominent local modification changes on mutant
    histones, with more modest global changes. H3-3A A15G affects nearby K9/K14 modification; the reported
    A29P/K27/K36 example belongs to H3-3B. These observations support cis effects without proving that all
    downstream consequences are local or that all BLBS variants differ uniformly from somatic oncohistones.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation."
    explanation: >-
      The abstract emphasizes local effects; full-text results also report modest global changes.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, these data suggest that the mutant histones can be incorporated into the nucleosome, cause marked local deregulation of chromatin state, and modestly alter the global control of histone modifications."
    explanation: >-
      This conclusion explicitly includes modest global effects.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Variant-Dependent H3K36 Methylation
  biological_scale: MOLECULAR
  description: A 2025 preprint identifies increased H3K36 methylation in cis for H3.3 T45I and stimulation of SETD2/NSD1 activity on recombinant mutant nucleosomes. Other substitutions have opposite effects. Structural modeling implicates contacts with the methyltransferase AWS domain; that structural explanation remains a model.
  evidence:
  - *id004
  - &id005
    reference: url:https://www.biorxiv.org/content/10.1101/2025.09.09.674984v1.full
    reference_title: "H3.3 De Novo Mutations Alter Lysine 36 Methylation via Distinct Mechanisms | bioRxiv"
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: increased H3.3K36me3 levels with S31F and T45I, and a complete to near complete loss of signal with G34V, K36E, and L48R
    explanation: Preprint cell assays show opposite allele-specific effects. The H3-3A T45I finding is relevant here; the other substitutions are protein-level comparators, not all BLBS1 alleles.
  biological_processes:
  - preferred_term: protein methylation
    term:
      id: GO:0006479
      label: protein methylation
    modifier: ABNORMAL
  downstream:

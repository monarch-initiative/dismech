- name: Neural Crest and Craniofacial Developmental Defect
  biological_scale: TISSUE
  description: >-
    The zebrafish db1092 allele encodes dominant-negative D123N H3.3, rather than a null. It disrupts early
    cranial neural-crest specification and ectomesenchymal development, with loss of craniofacial cartilage.
    The 2020 study reports partial cranial-glial reductions in homozygotes and stronger deficits after added
    dominant-negative RNA. These peripheral neural-crest glia are not CNS radial glia or oligodendrocytes,
    so their loss does not establish the cause of human brain hypomyelination.
  biological_processes:

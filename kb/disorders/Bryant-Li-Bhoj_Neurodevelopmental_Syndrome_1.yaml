- name: Altered Recruitment of PWWP-Domain Effectors
  biological_scale: MOLECULAR
  description: Variant-dependent H3K36 modification alters association with PWWP-domain proteins, including DNMT3A/B. T45I increases selected reader associations in the preprint; this must not be replaced by a universal loss-of-DNMT3A claim derived from G34R. Consequences for DNA methylation and neuronal function require direct testing for individual H3-3A alleles.
  evidence:

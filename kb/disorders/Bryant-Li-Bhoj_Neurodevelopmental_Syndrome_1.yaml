animal_models:
- species: Mouse (Mus musculus)
  genotype: H3.3 G34R knock-in
  category: Knock-in
  genes:
  - preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  associated_phenotypes:
  - Progressive microcephaly
  - Neurodegeneration
  - Disease-associated microglial accumulation
  - Neuronal depletion
  description: >-
    Knock-in mice carrying the germline H3.3 G34R substitution develop
    progressive microcephaly and neurodegeneration with disease-associated
    microglial accumulation and neuronal depletion, recapitulating the
    progressive-decline arm of the human phenotype. The model's principal
    limitation is that G34R is one allele among a widely dispersed BLBS1 variant
    spectrum, and the paired G34V and G34W knock-ins showed strikingly distinct
    developmental defects, so the mechanism is explicitly not generalizable.
  evidence:
  - reference: PMID:36931244
    reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      H3.3G34R-mutants exhibited progressive microcephaly and neurodegeneration,
      with abnormal accumulation of disease-associated microglia and concurrent
      neuronal depletion.
    explanation: >-
      The knock-in mouse recapitulates progressive microcephaly and
      neurodegeneration seen in a subset of affected humans.
  - reference: PMID:36931244
    reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated H3.3G34R/V/W knock-in mice and identified strikingly distinct
      developmental defects for each mutation
    explanation: >-
      Allele-specific divergence among three substitutions at the same residue
      bounds how far this model can be generalized across the BLBS1 spectrum.
- species: Zebrafish (Danio rerio)
  genotype: h3f3a dominant missense p.D123N and h3f3a-db1092 homozygous mutant
  category: Missense mutant
  genes:
  - preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  associated_phenotypes:
  - Craniofacial abnormalities
  - Loss of neural-crest-derived jaw cartilage
  - Reduced foxd3-positive cranial glia
  - Reduced melanocytes and xanthophores
  description: >-
    A previously reported dominant zebrafish h3f3a missense model (p.D123N, only
    two residues from the human recurrent p.Q125R allele) reproduces the dominant
    inheritance and craniofacial abnormalities of the human syndrome. Further
    analysis shows reduced foxd3-positive neural-crest-derived glia, melanocytes,
    and xanthophores, offering a candidate cellular basis for the human
    hypomyelination phenotype. The main limitation is that the strongest effects
    require homozygous mutants or dominant-negative RNA injection, conditions more
    severe than the human heterozygous state.
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A dominant zebrafish model (p.D123N) derived from a forward genetic screen
      has been previously reported with craniofacial abnormalities, which were
      replicated in our patient cohort
    explanation: >-
      The zebrafish model reproduces both the dominant mode of inheritance and the
      craniofacial phenotype of BLBS.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous h3f3adb1092 mutants display complete loss of neural crest–derived
      jaw cartilages (n = 10/10).
    explanation: >-
      Documents the severity of the craniofacial defect and the homozygous
      condition required to produce it, which bounds translation to the human
      heterozygous disorder.
- species: Human induced pluripotent stem cell
  genotype: H3-3B p.L48R iPSC-derived neural progenitors, forebrain neurons, and dorsal forebrain organoids
  category: Cellular model
  genes:
  - preferred_term: H3-3B
    term:
      id: hgnc:4765
      label: H3-3B
  associated_phenotypes:
  - Dysregulated chromatin accessibility
  - Altered radial glia and mature neuron proportions
  - Decreased neuronal electrical activity
  description: >-
    A human iPSC model of the BLBS variant p.L48R differentiated to 2D neural
    progenitors, forebrain neurons, and 3D dorsal forebrain organoids provides the
    first mechanistic insight into BLBS pathogenesis from a human-derived
    neurodevelopmental system: hyper-deposition of H3.3 into the nucleosome,
    changes in gene expression and chromatin accessibility affecting neuronal
    fate, adhesion and neurotransmission, altered progenitor and neuron
    proportions, and reduced neuronal electrical activity. Its limitation for
    BLBS1 is that the modeled variant is in H3-3B, so it addresses the shared H3.3
    protein rather than the H3-3A gene specifically.
  evidence:
  - reference: PMID:41689096
    reference_title: "A novel iPSC model of Bryant-Li-Bhoj neurodevelopmental/neurodegenerative syndrome demonstrates the role of histone H3.3 in chromatin dynamics, neuronal differentiation, and maturation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These data provide the first mechanistic insights into the pathogenesis of
      BLBS from a human-derived model of neurodevelopment, which suggest that H3.3
      L48R increases H3-3B expression, resulting in the hyper-deposition of H3.3
      into the nucleosome, which underlies changes in gene expression and chromatin
      accessibility.
    explanation: >-
      The first human neurodevelopmental model of BLBS defines a hyper-deposition
      mechanism, but for an H3-3B allele, so it supports BLBS1 only by
      shared-protein inference.

discussions:
- discussion_id: blbs1_gof_vs_dominant_negative
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which BLBS1 alleles act by gain of function and which by dominant
    interference, and is there a shared downstream convergence point?
  attaches_to:
  - pathophysiology#Mutant H3.3 Incorporation and Nucleosomal Perturbation
  - pathophysiology#Local Deregulation of Histone Post-Translational Modifications
  rationale: >-
    The causative variants are private and scattered across the whole H3.3
    protein, and the literature consensus is only that they are collectively
    gain-of-function or dominant-negative rather than loss-of-function. Patient
    cell work has shown opposite effects on H3.3 protein level for different
    alleles, and structural modeling assigns different variants to three different
    perturbation classes. Without allele-level mechanism assignment,
    genotype-phenotype prediction and any mechanism-targeted therapy remain out of
    reach.
  proposed_experiments:
  - experiment_id: blbs1_isogenic_allele_panel
    name: Isogenic H3-3A allele panel in human iPSC-derived neurons
    description: >-
      Knock in a panel of representative tail and core H3-3A alleles into an
      isogenic iPSC background, differentiate to cortical neurons, and profile each
      with matched ChIP-seq, ATAC-seq, and histone-PTM mass spectrometry to test
      whether structurally distinct variant classes converge on a common chromatin
      signature.
    decision_criterion: >-
      Convergence would be supported if tail and core alleles share a common
      differential chromatin signature; divergence would support allele-class
      specific mechanisms.
  - experiment_id: blbs1_allele_resolved_occupancy
    name: Allele-resolved nucleosomal occupancy mapping
    description: >-
      Quantify mutant versus wild-type H3.3 nucleosomal occupancy genome-wide in
      patient-derived cells to distinguish hyper-deposition from impaired
      deposition on a per-variant basis.
    decision_criterion: >-
      Increased mutant-allele occupancy would support a gain-of-function
      deposition mechanism; decreased occupancy would support impaired deposition.
  evidence:
  - reference: PMID:36867246
    reference_title: "Histone 3.3-related chromatinopathy: missense variants throughout H3-3A and H3-3B cause a range of functional consequences across species."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most of the causative variants are private and scattered throughout the
      protein, but all seem to have either a gain-of-function or dominant negative
      effect on protein function. This is highly unusual and not well understood.
    explanation: >-
      The review states the gap explicitly: the mechanism class is known only in
      the aggregate and is acknowledged to be poorly understood.
- discussion_id: blbs1_unexplained_phenotypic_heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What explains the marked phenotypic heterogeneity among individuals carrying
    the identical H3-3A variant?
  attaches_to:
  - pathophysiology#Neurodevelopmental Impairment
  - phenotype#Global Developmental Delay
  rationale: >-
    Four unrelated individuals with the same H3-3A p.T45I allele span the full
    range of severity, differing in age at sitting and walking, presence of
    regression, presence of seizures, and even the direction of the tone
    abnormality. Neither variant location nor affected gene nor sex accounts for
    this, which implicates unidentified modifier alleles, epigenetic state,
    stochastic developmental variation, or environmental factors. This directly
    limits prognostic counselling for newly diagnosed families.
  proposed_experiments:
  - experiment_id: blbs1_modifier_screen
    name: Modifier screening across recurrent-allele subcohorts
    description: >-
      Perform genome-wide modifier screening across individuals sharing a recurrent
      H3-3A allele (p.T45I, p.R17G, p.Q125R) combined with deep phenotyping using
      the standardized histonopathy clinical survey.
    decision_criterion: >-
      Identification of variants segregating with severity within a same-allele
      subcohort would support a modifier-gene explanation.
  - experiment_id: blbs1_allele_stratified_natural_history
    name: Allele-stratified prospective natural-history study
    description: >-
      Follow an international BLBS1 cohort prospectively with allele stratification
      to determine whether developmental trajectory, rather than cross-sectional
      severity, is more genotype-predictable.
    decision_criterion: >-
      Lower within-allele variance in trajectory than in cross-sectional severity
      would indicate that timing rather than endpoint is genotype-determined.
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This strongly suggests that the variation in phenotype is not due to the
      location of the mutation but rather due to either modifying alleles or
      environmental factors.
    explanation: >-
      The authors state the gap and name the two candidate explanation classes for
      the unexplained heterogeneity.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since these variables do not account for all BLBS phenotypic variability
    explanation: >-
      The expanded cohort confirms that sex, gene, and variant location together
      leave the heterogeneity largely unexplained.
- discussion_id: blbs1_cancer_predisposition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do individuals with germline H3-3A variants have an elevated cancer risk that
    would justify tumour surveillance?
  attaches_to:
  - pathophysiology#Heterozygous De Novo H3-3A Missense Variation
  rationale: >-
    The same gene harbours the K27M and G34R/V somatic oncohistone mutations that
    drive paediatric glioma and bone tumours, which makes cancer predisposition a
    natural concern for germline carriers. No malignancy was present in the
    46-person discovery cohort, and the community-wide germline histonopathy
    cancer incidence is currently 1%, below the conventional 5% threshold for
    instituting routine surveillance. However, this is based on a small, young,
    and incompletely followed population, and a second individual with a germline
    histonopathy and a cancer diagnosis was identified only when an updated
    standardized survey was deployed.
  proposed_experiments:
  - experiment_id: blbs1_cancer_registry
    name: Registry-based cancer-incidence tracking
    description: >-
      Track cancer incidence prospectively in germline histonopathy registry
      cohorts with age-standardized comparison to population rates.
    decision_criterion: >-
      An age-standardized incidence ratio exceeding the 5% lifetime threshold would
      justify instituting routine tumour surveillance.
  - experiment_id: blbs1_residue_class_neoplastic_risk
    name: Residue-class stratified neoplastic risk assessment
    description: >-
      Assess systematically whether germline alleles at residues that also host
      somatic oncohistone mutations carry differential neoplastic risk relative to
      other BLBS1 alleles.
    decision_criterion: >-
      Enrichment of malignancy among carriers of germline alleles at oncohistone
      residues would support allele-stratified rather than syndrome-wide
      surveillance.
  evidence:
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the community-wide cancer incidence is currently 1%, which falls
      below the recommended 5% cut off for routine surveillance.
    explanation: >-
      Quantifies the current evidence against routine tumour surveillance while
      implying the estimate is provisional.
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which allowed us to identify the second known individual with a germline
      histonopathy and a cancer diagnosis
    explanation: >-
      Demonstrates that cases were being missed by prior ascertainment, so the 1%
      estimate is a lower bound rather than a settled figure.
- discussion_id: blbs1_g34_mouse_mechanism_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the G34R mouse mechanism — H3K36me2 loss, DNMT3A mislocalization, and
    complement-driven neuroinflammation — actually operate in human BLBS1 brain,
    and does it extend beyond G34 alleles?
  attaches_to:
  - pathophysiology#G34-Specific Loss of H3K36me2 and DNMT3A Mislocalization
  - pathophysiology#Progressive Neurologic Decline
  rationale: >-
    This is the most mechanistically detailed account of progressive
    neurodegeneration in the H3.3 disorders, but every step is murine. The authors
    themselves report that G34R, G34V, and G34W knock-ins produce strikingly
    distinct developmental defects, and the complement-to-degeneration link is
    stated as a possibility rather than a demonstration. Meanwhile the human
    evidence for progression is clinical (21% with neurologic degeneration, 26%
    with cortical atrophy) with no human methylome or neuroinflammation data.
    Treating the mouse mechanism as the human mechanism would risk targeting
    neuroinflammation in a population whose degeneration may have a different
    basis.
  proposed_experiments:
  - experiment_id: blbs1_human_brain_methylome
    name: Human brain methylome and H3K36me2 profiling
    description: >-
      Profile the DNA methylome and H3K36me2 landscape in post-mortem or biopsy
      human brain tissue from individuals with germline G34 versus non-G34 H3-3A
      alleles.
    decision_criterion: >-
      Recapitulation of the murine CH-methylation loss and promoter
      hypermethylation in human G34 brain would support translation; its absence
      would refute it.
  - experiment_id: blbs1_microglial_organoid_profiling
    name: Microglia-containing organoid complement profiling
    description: >-
      Profile microglial and complement transcriptional programs in patient
      iPSC-derived microglia-containing organoids carrying G34 and non-G34 H3-3A
      variants.
    decision_criterion: >-
      Complement upregulation restricted to G34 organoids would confine the branch
      to that allele class.
  - experiment_id: blbs1_longitudinal_neuroinflammation_imaging
    name: Longitudinal neuroinflammation imaging
    description: >-
      Follow affected individuals with longitudinal neuroimaging including
      quantitative neuroinflammation markers to test whether clinical progression
      correlates with an inflammatory signature.
    decision_criterion: >-
      Correlation of progression with an inflammatory imaging signature would
      support the neuroinflammatory model in humans.
  evidence:
  - reference: PMID:36931244
    reference_title: "Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Complement expression in G34R brains may lead to neuroinflammation possibly
      accounting for progressive neurodegeneration.
    explanation: >-
      The doubly hedged phrasing of the key mechanistic link, in a mouse system,
      defines the translational uncertainty.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, 9 of the 46 patients (21%) have demonstrated clinical neurologic
      degeneration, which suggests that this may be a progressive disorder.
    explanation: >-
      The human side of the mismatch is purely clinical observation, with no
      molecular characterization of the degenerative process in human tissue.
- discussion_id: blbs1_prevalence_and_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the prevalence of BLBS1, and what is the natural history and life
    expectancy?
  attaches_to:
  - pathophysiology#Neurodevelopmental Impairment
  - pathophysiology#Progressive Neurologic Decline
  rationale: >-
    No prevalence or incidence estimate exists; the syndrome is known only from
    aggregated international case collections, the largest of which contains 96
    combined BLBS1 and BLBS2 individuals. The oldest reported individuals were 32
    and 39 years, establishing survival into adulthood but not life expectancy.
    Because the last exon of H3-3A is poorly covered by some exome capture kits,
    ascertainment is very likely incomplete, so any prevalence figure derived from
    published cases would be biased downward. This is why no prevalence record is
    curated on this entry.
  proposed_experiments:
  - experiment_id: blbs1_exome_reanalysis_coverage
    name: Coverage-aware reanalysis of large sequencing cohorts
    description: >-
      Reanalyse large exome and genome cohorts with explicit assessment of
      coverage over the H3-3A last exon, to estimate the true diagnostic yield and
      the magnitude of exome-based underascertainment.
    decision_criterion: >-
      A materially higher H3-3A diagnostic yield in genome versus exome cohorts
      would quantify the ascertainment bias.
  - experiment_id: blbs1_international_registry
    name: International BLBS registry with standardized follow-up
    description: >-
      Establish a prospective international registry with standardized
      longitudinal follow-up to generate natural-history, morbidity, and survival
      data.
    decision_criterion: >-

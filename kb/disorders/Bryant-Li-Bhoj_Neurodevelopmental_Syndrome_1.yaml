name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1
creation_date: "2026-07-31T00:35:00Z"
synonyms:
- BRYLIB1
- BLBS1
- Bryant-Li-Bhoj syndrome type 1
- H3-3A-related neurodevelopmental syndrome
- H3F3A-related chromatinopathy
description: >-
  Bryant-Li-Bhoj neurodevelopmental syndrome 1 (BLBS1) is an autosomal dominant
  chromatinopathy caused by heterozygous, almost always de novo, germline
  missense variants in H3-3A (H3F3A). H3-3A and its paralog H3-3B encode an
  identical protein, the replication-independent histone variant H3.3, so
  variants in either gene produce a clinically overlapping syndrome (BLBS1 and
  BLBS2 respectively) that the literature reports as a single cohort. The
  pathogenic alleles are private and scattered across the histone tail and
  histone-fold core rather than clustered at a hotspot, and they act through
  gain-of-function or dominant-negative effects rather than haploinsufficiency.
  Structural modeling and patient-cell mass spectrometry indicate that mutant
  H3.3 is still incorporated into nucleosomes, where it perturbs histone-DNA
  contacts, the histone octamer, or binding by chaperones and epigenetic
  readers, and produces marked local (cis) deregulation of histone
  post-translational modifications with only modest global change. The clinical
  core is developmental delay / intellectual disability (99% of the reported
  cohort), craniofacial dysmorphism, hypotonia or mixed tone abnormality,
  epilepsy, growth abnormality (most often undergrowth), and structural or
  maturational brain MRI abnormalities, with variable musculoskeletal, ocular,
  dermal, cardiac, and genitourinary involvement. Although BLBS was initially
  described as a progressive neurodegenerative disorder on the basis of clinical
  decline in a subset, the expanded cohort reframes it as spanning a
  neurodevelopmental-to-neurodegenerative continuum. Phenotypic heterogeneity is
  marked even among individuals carrying the identical variant, and no
  disease-modifying therapy exists; management is supportive.

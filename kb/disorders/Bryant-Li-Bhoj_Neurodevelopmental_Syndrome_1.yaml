      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Complement expression in G34R brains may lead to neuroinflammation
        possibly accounting for progressive neurodegeneration.
      explanation: >-
        The authors propose complement-driven neuroinflammation as the intermediate
        linking the methylome defect to progressive degeneration, and hedge it
        explicitly, which is why the edge is modeled as indirect and
        hypothesis-scoped.

- name: Dysregulated Neurodevelopmental Gene Expression and Chromatin Accessibility
  biological_scale: CELLULAR
  description: >-
    Altered H3.3 chromatin biology translates into changed transcriptional
    output. RNA sequencing of patient fibroblasts identified 323 differentially
    expressed genes, with the upregulated set significantly enriched for mitotic
    and cell-division processes and no significant signal among the downregulated
    genes; patient fibroblasts showed correspondingly increased proliferation. In
    a human iPSC neurodevelopmental model, the dysregulated programs specifically
    affect neuronal fate, cell adhesion, neurotransmission, and
    excitatory/inhibitory balance.
  mechanism_confidence: ESTABLISHED
  biological_processes:

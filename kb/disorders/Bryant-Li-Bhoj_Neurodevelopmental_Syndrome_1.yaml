    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRYLIB is expressed in an autosomal dominant manner and typically caused by
      a de novo H3-3A (H3F3A) or H3-3B (H3F3B) pathogenic variant. Therefore, the
      risk to other family members is presumed to be low.
    explanation: >-
      GeneReviews establishes dominant inheritance, the predominance of de novo
      variants, and the resulting low familial recurrence risk.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

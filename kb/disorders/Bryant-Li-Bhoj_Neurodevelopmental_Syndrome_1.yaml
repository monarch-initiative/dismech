prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been published. The published denominator is the
    global cohort assembled in 2024: of 96 individuals with BLBS, 65 carried an
    H3-3A variant. Ascertainment is by exome or genome sequencing for
    undiagnosed neurodevelopmental disease, so this is a discovery count rather
    than an epidemiologic estimate.
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 65 individuals harbor variants in H3-3A and 31 individuals harbor variants in H3-3B."
    explanation: >-
      Gives the H3-3A-specific reported count within the combined BLBS cohort.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
progression:
- phase: Neurodevelopmental phase
  age_range: infancy to childhood
  notes: >-
    Developmental delay is evident from infancy. Many affected individuals never
    achieve independent sitting, walking or speech, though outcomes range. Tone
    abnormality may resolve or evolve with age rather than remaining fixed.
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many affected individuals do not achieve independent sitting, walking, or speaking, although there is a range of developmental outcomes."
    explanation: >-
      Establishes both the severity and the variability of the developmental
      outcome.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
- phase: Variable regression and later motor change
  age_range: childhood to adulthood
  notes: Regression is reported in a minority and can be intermittent, severe or unrelated to seizures. The founding pooled cohort reported 9/46 with neurologic degeneration; this is about 20%, despite a 21% figure in its prose. GeneReviews describes subacute third-decade motor change followed by relative stability in three reported adults. A separate ten-person series, including an adult with H3-3A disease, reported no progressive neurologic disease. These observations do not establish an inevitable two-phase course.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK595206/?report=reader
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Developmental regression can occur in a minority of affected individuals. Regression is not continuous and is not always associated with seizures.
    explanation: The clinical synthesis distinguishes intermittent regression from continuous decline.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK595206/?report=reader
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome - GeneReviews&reg; - NCBI Bookshelf"

      practically made.
differential_diagnoses:
- name: Bryant-Li-Bhoj neurodevelopmental syndrome 2
  description: >-
    The H3-3B counterpart. The two genes encode an identical protein, so the
    entities are separated by gene rather than by protein product and are
    clinically overlapping. Only molecular testing distinguishes them.
    Cohort-level trends exist but are not diagnostic discriminators, and the
    H3-3A cohort differs in that every variant with parental data has been de
    novo and missense, whereas H3-3B has yielded synonymous, stop-loss and one
    inherited allele.
  disease_term:
    preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
    term:
      id: MONDO:0030607
      label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
  distinguishing_features:
  - "Determined solely by molecular testing: a pathogenic variant in H3-3A rather than H3-3B"
  - Greater variant-type and inheritance diversity is reported for H3-3B, including a synonymous stop-gain, a stop-loss and one inherited allele
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, while most variants in H3-3B are heterozygous de novo missense variants, more variability in variant type and modes of inheritance was observed."
    explanation: >-
      States the variant-type difference between the two genes that this
      differential rests on.
- name: Somatic H3.3 oncohistone disease
  description: >-
    Substitutions at the same H3.3 residues - K27M, G34R/V, K36M - occur
    somatically and drive paediatric diffuse midline glioma and giant cell
    tumour of bone. This is a molecular contrast rather than a clinical
    differential, but it matters when a germline result at one of those residues
    is reported: the germline and somatic diseases have different mechanisms,
    and germline carriers of G34R/V substitutions have not developed the
    corresponding tumours.
  distinguishing_features:
  - Germline variants are private and scattered across the protein; oncohistone substitutions are recurrent hotspots
  - Germline variants deregulate histone modification locally and in cis; somatic lysine substitutions dysregulate it globally in trans
  - No malignancy occurred in the founding BLBS cohort
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation."
    explanation: >-
      Gives the molecular basis on which the germline and somatic diseases are
      separated.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that the mechanism of germline mutations are distinct from cancer-associated somatic histone mutations but may converge on control of cell proliferation."
    explanation: >-
      The authors' own framing of the relationship between the two diseases.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of BRYLIB is established in a proband with suggestive findings and a heterozygous pathogenic variant in either H3-3A (H3F3A) or H3-3B (H3F3B) identified by molecular genetic testing."
    explanation: >-
      GeneReviews statement of the diagnostic criterion.
  - reference: PMID:33268356

genetic:
- name: H3-3A
  gene_term:
    preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    H3-3A (formerly H3F3A) encodes the replication-independent histone variant
    H3.3, which is identical in sequence to the product of its paralog H3-3B.
    Pathogenic BLBS1 alleles are heterozygous de novo missense substitutions
    distributed across the histone tail and the histone-fold core; 65 of the 96
    individuals in the largest combined BLBS cohort carried H3-3A variants (70
    unique causative alleles across both genes). Recurrent H3-3A alleles seen in
    two or more unrelated individuals include p.R17G, p.T45I, p.A114G, and
    p.Q125R. Because the last exon of H3-3A is not covered by some exome capture
    kits, some alleles are detectable only by genome sequencing, so BLBS1 may be
    underdiagnosed in exome-based studies. This germline disorder is
    mechanistically distinct from the somatic H3F3A oncohistone mutations (K27M,
    G34R/V) that drive paediatric glioma and bone tumours; no malignancy was
    present in the discovery cohort.
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 65 individuals harbor variants in H3-3A and 31 individuals harbor
      variants in H3-3B.
    explanation: >-
      Establishes that H3-3A accounts for about two-thirds of reported BLBS
      individuals, making BLBS1 the more commonly reported of the two entities.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.Q125R was found in H3F3A in three individuals and in a different individual
      in H3F3B, while p.P121R was found in H3F3A in one individual and in H3F3B in
      two other individuals.
    explanation: >-
      Documents recurrence of individual H3-3A alleles across unrelated
      individuals, the closest thing to hotspots in an otherwise private variant
      spectrum.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mutations (H3F3A p.Q125R and p.V117L) were identified only by trio genome
      sequencing after negative exome sequencing, as the last exon of H3F3A is
      currently not covered by some exome capture kits. We speculate that similar
      mutations in H3F3A may be underdiagnosed in current exome studies.
    explanation: >-
      Documents a specific, actionable ascertainment gap for H3-3A that argues for
      genome rather than exome sequencing in suspected cases.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, although all known H3.3 mutations in humans cause cancer, none of
      the patients in our cohort have cancer.
    explanation: >-
      Distinguishes the germline BLBS1 allele spectrum from the somatic oncohistone
      mutations in the same gene.

diagnosis:
- name: H3-3A Molecular Genetic Confirmation
  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic H3-3A
    variant in an individual with a compatible phenotype. There is no biochemical
    biomarker and no validated methylation episignature, so the diagnosis is
    molecular. Trio exome or genome sequencing in the workup of unexplained
    developmental delay is the usual route; genome sequencing is preferable when
    H3-3A is specifically suspected, because the last exon of H3-3A is poorly
    covered by some exome capture kits.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: H3-3A
        term:
          id: hgnc:4764
          label: H3-3A
  results: >-
    A heterozygous pathogenic H3-3A variant in a proband with suggestive findings
    establishes the diagnosis of BLBS1.
  evidence:

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard treatment for developmental delay / intellectual disability,
      attention-deficit/hyperactivity disorder, autism spectrum disorder, anxiety,
      epilepsy, spasticity, constipation, craniosynostosis, vision issues, hearing

- name: H3-3A p.Thr46Ile (mature-histone T45I)
  description: >-
    The c.137C>T substitution is p.Thr46Ile in HGVS protein numbering and T45I when the cleaved initiator methionine
    is omitted. Four individuals carried this recurrent H3-3A allele in the 2024 cohort, with variable phenotypes.
    It is modeled in the 2026 mouse preprint and in variant-specific biochemical studies.

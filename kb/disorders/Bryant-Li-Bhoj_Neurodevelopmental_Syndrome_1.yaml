inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Autosomal dominant inheritance. In the 2024 cohort, H3-3A variants were heterozygous de novo missense variants
    whenever parental results were available; inheritance was unknown for three individuals. A negative parental
    blood test does not exclude germline mosaicism. Allele counts across H3-3A and H3-3B do not establish equal
    protein dosage or a uniform functional mechanism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

animal_models:
- name: H3.3 T45I knock-in mouse
  species: Mus musculus
  genotype: Heterozygous H3f3a c.137C>T, p.Thr46Ile (mature-histone T45I)
  publication: DOI:10.64898/2026.06.16.732665
  description: The 2026 preprint characterizes a C57BL/6J knock-in carrying a recurrent human H3-3A allele. Pups have delayed milestones and postnatal growth restriction; adult gait effects are more pronounced in males, while aged 60-week animals of both sexes have marked rotarod impairment. Nest-building and male aggression differ, but tested learning, memory and social preference are preserved. Brain histology was examined, with no genotype differences in the reported neuronal, astrocyte, Purkinje-cell or microglial counts. Gross brain endocast measures were also unchanged. This is partial phenotypic correspondence, not proof of a universal two-stage human course.
  modeled_mechanisms:
  - target: Abnormal Brain Development
    description: Developmental and motor phenotypes overlap with part of the human syndrome.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - &id009
      reference: DOI:10.64898/2026.06.16.732665
      reference_title: A novel preclinical mouse model recapitulates progressive phenotypes of Bryant-Li-Bhoj Syndrome
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: 'mice recapitulate the BLBS natural history: perinatal growth restriction, delayed developmental milestones, and progressive motor and gait impairments.'
      explanation: Preprint abstract summary; detailed results differ by age, sex and assay and only partially reproduce the human syndrome.
    - &id010
      reference: url:https://www.biorxiv.org/content/10.64898/2026.06.16.732665v1.full
      reference_title: "A novel preclinical mouse model recapitulates progressive phenotypes of Bryant-Li-Bhoj Syndrome | bioRxiv"
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Immunohistochemical analyses of adult brain tissue revealed no significant differences between genotypes in neuronal density (NeuN), astrocyte burden (GFAP), or Purkinje cell number (Calbindin)
      explanation: The full preprint reports actual negative histological comparisons, not absence of histological investigation.
    - &id011
      reference: url:https://www.biorxiv.org/content/10.64898/2026.06.16.732665v1.full
      reference_title: "A novel preclinical mouse model recapitulates progressive phenotypes of Bryant-Li-Bhoj Syndrome | bioRxiv"
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: all mice demonstrated appropriate social preference and social memory in the three-chamber task
      explanation: The reported assays do not establish autism-like social preference deficits.
    limitations: Preprint, one allele and mouse strain. Motor impairment does not itself establish intellectual disability, cortical malformation or the proposed age-dependent H3.3-replacement mechanism. The negative adult cell-count assays are not proof of normal brain function at every age.
  - target: Neural Crest and Craniofacial Developmental Defect
    description: Adult craniofacial appearance and an enlarged spheno-occipital growth center provide a morphological comparison.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    evidence:
    - reference: DOI:10.64898/2026.06.16.732665
      reference_title: A novel preclinical mouse model recapitulates progressive phenotypes of Bryant-Li-Bhoj Syndrome
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Adult mice additionally display craniofacial differences, impaired nest building, hyperactivity in a social context, and male-specific elevated aggression.
      explanation: The model reports appearance changes; a neural-crest mechanism was not tested.
    limitations: No lineage-specific demonstration that the mouse craniofacial changes arise through the zebrafish neural-crest mechanism.
  evidence:
  - *id009
  - *id010
  - *id011
- name: Zebrafish h3f3a D123N db1092 model
  species: Danio rerio
  genotype: h3f3a db1092 dominant-negative missense allele, mature-histone D123N; heterozygous and homozygous animals, with additional RNA perturbation in selected experiments
  publication: PMID:33268356
  description: The db1092 allele is D123N, not a homozygous null. Heterozygotes have variable craniofacial defects and homozygotes more severe losses. The 2020 glial experiment includes additional dominant-negative H3f3a RNA, producing a stronger perturbation. The original 2012 report found peripheral glia unaffected in its protocol. The allele is not a reported human patient allele and fish have five H3.3 genes.
  modeled_mechanisms:
  - target: Neural Crest and Craniofacial Developmental Defect
    description: Disrupted cranial neural-crest specification and ectomesenchyme formation cause craniofacial loss.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    evidence:
    - &id012
      reference: PMID:33268356
      reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Homozygous h3f3adb1092 mutants display complete loss of neural crest–derived jaw cartilages (n = 10/10).
      explanation: Homozygotes carry two copies of the D123N missense allele.
    - &id013
      reference: PMID:33268356
      reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Homozygous h3f3adb1092 mutants injected at the one-cell stage with a control mCherry RNA show partial reductions in cranial glia
      explanation: The 2020 protocol reports partial reduction; added dominant-negative RNA increases the severity.
    - &id014
      reference: PMID:23028350
      reference_title: An essential role of variant histone H3.3 for ectomesenchyme potential of the cranial neural crest.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: foxd3-positive peripheral glia (Figure 1l), neurons of the cranial ganglia (Figure S1), and the dorsal root ganglia and sympathetic neurons derived from trunk NC (data not shown) were unaffected.
      explanation: The original 2012 experiment did not detect this glial deficit. Protocol and perturbation strength differ from the 2020 experiment.
    limitations: A non-patient dominant-negative allele, dosage-dependent perturbation and peripheral neural-crest readouts. These experiments do not establish a CNS myelination defect or model human intellectual disability.

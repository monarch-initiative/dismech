    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A recent study showed that H3.3 begins to replace H3.1 and H3.2 in postnatal mouse and human brains in a time-dependent manner and displaces these canonical H3 variants almost completely in adulthood."

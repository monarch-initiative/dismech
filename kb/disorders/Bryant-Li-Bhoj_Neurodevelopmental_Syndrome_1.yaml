animal_models:
- name: H3.3 T45I knock-in mouse
  species: Mus musculus
  genotype: h3-3a p.T45I knock-in
  publication: DOI:10.64898/2026.06.16.732665
  description: >-
    A knock-in mouse carrying h3-3a p.T45I, the most recurrent BLBS1 allele and
    the one this entry curates under variants. It is genotype-matched to human
    disease rather than a null, which is what distinguishes it from the
    zebrafish model, and it reproduces the two-phase natural history: perinatal
    growth restriction and delayed developmental milestones early, progressive
    motor and gait impairment later. Adult animals additionally show
    craniofacial differences and behavioural changes. Reported so far only as a
    preprint.
  modeled_mechanisms:
  - target: Progressive Postnatal Neuronal H3.3 Dependence
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces progressive motor and gait impairment on a congenital
      genotype, which is the phenomenon this node exists to explain.
    limitations: >-
      Progressive motor impairment in a mouse is not camptocormia, and the
      preprint reports no cortical atrophy or other neuropathological correlate,
      so the node's proposed mechanism - the postnatal shift of the neuronal H3
      pool to H3.3 - is not itself tested by these endpoints. Peer review is
      pending.
    readouts:
    - name: Motor and gait performance
      target: Progressive Postnatal Neuronal H3.3 Dependence
      direction: DECREASED
      interpretation: >-

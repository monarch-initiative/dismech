- name: Progressive Postnatal Neuronal H3.3 Dependence
  biological_scale: ORGANISM
  description: >-
    Age-dependent accumulation of H3.3 in postmitotic neurons is a proposed susceptibility context, not a demonstrated
    universal cause of BLBS1 progression. Regression is variable. The T45I mouse has motor impairment but lacks
    a genotype difference in the reported adult brain cell counts. G34R mice demonstrate a different, experimentally
    studied epigenetic route, whose generality to H3-3A patient alleles remains uncertain.
  cell_types:
  - preferred_term: neuron
    term:

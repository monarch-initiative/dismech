genetic:
- name: H3-3A
  gene_term:
    preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    H3-3A (formerly H3F3A) encodes the replication-independent histone variant
    H3.3, identical in protein sequence to the product of H3-3B. The two genes
    differ in regulatory and coding sequence, giving different expression
    patterns and levels, and it is that paralog-level difference - not a
    difference in protein - that separates BLBS1 from BLBS2. Variants are
    private and distributed across the protein; the most recurrent reported
    allele is p.Thr45Ile.
  case_fractions:
  - population: Global BLBS cohort reported through 2024
    case_fraction_percent: 67.7
    cohort_size: 96
    notes: >-
      65 of 96 reported individuals with BLBS carried an H3-3A variant, the
      remainder H3-3B. This is a discovery-cohort split rather than a
      population estimate.
    evidence:
    - reference: PMID:38678163
      reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In total, 65 individuals harbor variants in H3-3A and 31 individuals harbor variants in H3-3B."
      explanation: >-
        Gives the gene split within the reported BLBS cohort.
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this work, we have identified a cohort of 46 unrelated patients bearing de novo heterozygous germline missense mutations in H3F3A or H3F3B with a core phenotype of progressive neurologic dysfunction and congenital anomalies."
    explanation: >-
      Establishes the gene-disease relationship in the founding cohort.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the general population, both genes have a very low rate of missense variants; the gnomAD missense Z score is 3.21 for H3F3A and 2.95 for H3F3B (>2 is significant)"
    explanation: >-
      Documents the strong missense constraint on H3-3A that supports
      pathogenicity of de novo missense alleles.
variants:
- name: H3-3A p.Thr45Ile
  description: >-
    The most recurrently reported BLBS1 allele, carried by four individuals in
    the 2024 cohort. Those four show substantial phenotypic variability, which is
    the clearest single demonstration that genotype does not determine phenotype
    in this disease.
  gene:
    preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Length of lollipop corresponds to number of individuals who harbor a variant at that residue (e.g. H3-3A p.T45I represents four individuals with BLBS and H3-3A p.V46M represents one individual with BLBS)."
    explanation: >-
      Identifies p.Thr45Ile as the most recurrent H3-3A allele in the reported
      cohort.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, phenotypic heterogeneity was present even amongst individuals harboring the same variant."
    explanation: >-
      Supports the statement that recurrence of an allele does not bring
      phenotypic concordance.
diagnosis:
- name: Molecular genetic testing of H3-3A
  description: >-
    The diagnosis is molecular. There is no biochemical marker and no
    recognisable facial gestalt, so it is established by finding a heterozygous
    pathogenic H3-3A variant in a proband with suggestive features - almost
    always through exome or genome sequencing performed for undiagnosed
    developmental delay.
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

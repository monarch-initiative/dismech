  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Feeding issues and poor weight gain may benefit from feeding therapy; in
      individuals with persistent feeding issues, gastrostomy tube may be
      considered.
    explanation: >-
      GeneReviews states the escalation pathway from feeding therapy to
      gastrostomy.
- name: Developmental and Rehabilitative Therapy
  description: >-
    Physical and occupational therapy address the motor and functional
    consequences of the near-universal developmental delay, alongside standard
    educational intervention.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy

- name: Deregulated Cell Proliferation
  biological_scale: CELLULAR
  description: >-
    RNA sequencing of three H3-3A patient fibroblast lines identified altered expression enriched for mitosis
    and cell division. Proliferation assays across five patient lines from both H3.3 genes found increased
    proliferative capacity. This is a non-neural cellular phenotype; neither a direct cause of neuronal dysfunction
    nor malignant transformation was demonstrated.

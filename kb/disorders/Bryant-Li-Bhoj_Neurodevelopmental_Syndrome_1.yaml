- name: Variant-Specific Transcription-Coupled Chromatin Defects
  biological_scale: CELLULAR
  description: 'Yeast H3 mutants show separable defects: T45I and R83C permit cryptic intragenic transcription, while N108S traps FACT at gene 3-prime ends. Eight of nine newly tested mutants lack the FACT-trapping defect. Yeast native H3 expressed as the sole histone H3 source is a mechanistic surrogate, not a heterozygous human neuronal model. A114G is excluded from clinical variant inference because the study notes possible sequencing artifact.'
  evidence:
  - reference: PMID:39525290
    reference_title: "Trapping of yFACT at 3' ends of genes is not a universal characteristic of yeast versions of Bryant-Li-Bhoj syndrome histone H3 mutants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: only H3-N108S shows significant trapping of the Spt16 subunit of yFACT at the 3’ end
    explanation: Yeast native-H3 experiments identify a variant-specific defect. N108S is not assigned as a human H3-3A allele here.
  - reference: PMID:39525290
    reference_title: "Trapping of yFACT at 3' ends of genes is not a universal characteristic of yeast versions of Bryant-Li-Bhoj syndrome histone H3 mutants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: H3-T45I also confers sensitivity to the DNA-damaging agent methyl methanesulfonate (MMS)
    explanation: Yeast growth assays identify an additional T45I-associated stress phenotype; direct human relevance is uncertain.

- H3-3A-related neurodevelopmental syndrome
- H3F3A-related neurodevelopmental disorder
description: >-
  Bryant-Li-Bhoj neurodevelopmental syndrome 1 is an autosomal dominant disorder caused by heterozygous pathogenic
  H3-3A (H3F3A) variants, usually de novo missense substitutions. H3-3A and H3-3B encode the same replication-independent
  histone H3.3 protein, but define separate genetic diagnoses. Developmental delay or intellectual disability,
  often severe, accompanies variable abnormalities of muscle tone, seizures, craniofacial appearance, growth
  and brain structure. Regression and later motor decline occur in some individuals, but an obligatory adult
  degenerative phase is not established. Functional effects differ between alleles and include altered histone
  abundance, chaperone interaction, local histone modification and transcription; a single gain-of-function
  mechanism has not been demonstrated for all variants.

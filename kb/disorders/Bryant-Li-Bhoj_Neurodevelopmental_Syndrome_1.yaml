notes: >-
  This entry is restricted to H3-3A-related BLBS1; H3-3B-related BLBS2 is a separate entry. Most clinical studies
  combine the two genes. Pooled proportions below retain their cohort, denominator and ascertainment limitations
  and are not H3-3A-specific population frequencies. Historical histone residue numbering omits the initiator
  methionine; where used, it is distinguished from HGVS numbering. Evidence from engineered protein variants
  and the mouse H3f3a locus does not automatically establish that the corresponding allele occurs in human
  H3-3A. The reviewed literature does not establish a disease-modifying therapy or a BLBS1-specific cancer-risk
  estimate.

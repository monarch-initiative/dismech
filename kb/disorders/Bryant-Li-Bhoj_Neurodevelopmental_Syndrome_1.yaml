diagnosis:
- name: Molecular genetic testing of H3-3A
  description: >-
    Establish BLBS1 by a heterozygous pathogenic or likely pathogenic H3-3A variant in a compatible clinical
    context. A VUS does not establish the diagnosis. Broad neurodevelopmental panels, exome or genome sequencing
    are appropriate because the clinical features overlap many disorders. Review coverage when testing is negative:
    the founding study identified two terminal-exon H3-3A variants by genome sequencing after missed exome
    capture.
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of BRYLIB is established in a proband with suggestive findings and a heterozygous pathogenic variant in either H3-3A (H3F3A) or H3-3B (H3F3B) identified by molecular genetic testing."
    explanation: >-
      GeneReviews statement of the diagnostic criterion.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients were identified through exome or genome sequencing performed for the indication of neurodevelopmental delays and/or congenital anomalies"
    explanation: >-
      Documents the ascertainment route through which the diagnosis is
      practically made.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK595206/?report=reader
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: variant of uncertain significance does not establish or rule out the diagnosis.
    explanation: GeneReviews explicitly cautions that a variant of uncertain significance is not diagnostic.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: as the last exon of H3F3A is currently not covered by some exome capture kits.
    explanation: In the 2020 study two variants were found by genome sequencing after missed exome capture; this is a historical kit-specific limitation.
- name: Baseline clinical assessment
  description: Assess development, behavior, growth, nutrition and swallowing; obtain neurologic examination and brain MRI, with EEG for suspected seizures. Evaluate vision, hearing, thyroid function, cardiac anatomy and the testes as indicated by the initial assessment. Abnormal head shape warrants craniofacial review and imaging when craniosynostosis is suspected. These evaluations characterize complications rather than replace molecular diagnosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK595206/?report=reader
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: To incl brain MRI ... Consider EEG if seizures are a concern.
    explanation: Table 3 specifies baseline brain imaging and clinically indicated EEG.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK595206/?report=reader
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: To assess for unrecognized congenital heart disease, specifically atrial septal defects
    explanation: The baseline table recommends echocardiography to assess cardiac disease.
differential_diagnoses:
- name: Bryant-Li-Bhoj neurodevelopmental syndrome 2
  description: >-
    The H3-3B counterpart. The two genes encode an identical protein, so the
    entities are separated by gene rather than by protein product and are
    clinically overlapping. Only molecular testing distinguishes them.
    Cohort-level trends exist but are not diagnostic discriminators, and the
    H3-3A cohort differs in that every variant with parental data has been de
    novo and missense, whereas H3-3B has yielded synonymous, stop-loss and one
    inherited allele.
  disease_term:
    preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
    term:
      id: MONDO:0030607
      label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
  distinguishing_features:
  - "Determined solely by molecular testing: a pathogenic variant in H3-3A rather than H3-3B"
  - Greater variant-type and inheritance diversity is reported for H3-3B, including a synonymous stop-gain, a stop-loss and one inherited allele
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, while most variants in H3-3B are heterozygous de novo missense variants, more variability in variant type and modes of inheritance was observed."
    explanation: >-
      States the variant-type difference between the two genes that this
      differential rests on.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: Somatic H3.3 oncohistone disease
  description: >-
    Somatic H3.3 hotspot variants occur in several tumors. A tumor-acquired variant and a constitutional variant
    define different clinical contexts, which require attention to tissue tested, variant interpretation and
    phenotype. Some molecular effects overlap, including cis effects of G34 substitutions. Absence of cancer
    in early BLBS cohorts does not establish absence of lifetime risk.
  distinguishing_features:
  - Tumor-restricted versus constitutional variant distribution
  - Neoplasm-focused presentation versus a developmental syndrome
  - Variant- and tissue-dependent molecular effects; no uniform cis-versus-trans distinction
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation."
    explanation: >-
      Gives the molecular basis on which the germline and somatic diseases are
      separated.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that the mechanism of germline mutations are distinct from cancer-associated somatic histone mutations but may converge on control of cell proliferation."
    explanation: >-
      The authors' own framing of the relationship between the two diseases.
    directness: DIRECT
    quote_role: PRIMARY_RESULT

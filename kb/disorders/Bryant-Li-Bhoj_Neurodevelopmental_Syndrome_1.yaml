inheritance:
- name: Autosomal dominant inheritance
  description: >-
    BLBS1 is autosomal dominant and, for H3-3A specifically, every variant with
    available parental testing has been de novo, so recurrence risk to siblings
    is low. This is a point of difference from H3-3B, where a maternally
    inherited allele and more variant-type diversity have been described. A
    single altered allele of one of the two H3.3 genes is sufficient: 75% of
    H3.3 alleles remain wild type, which is why the phenotype is read as gain of
    function or dominant negative rather than as loss of dosage.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BRYLIB is expressed in an autosomal dominant manner and typically caused by a de novo H3-3A (H3F3A) or H3-3B (H3F3B) pathogenic variant."
    explanation: >-
      GeneReviews statement of the inheritance mode and the de novo origin.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the time of this report, all H3-3A variants are heterozygous de novo missense variants when parents are available, though inheritance was undetermined for three individuals"
    explanation: >-
      The H3-3A-specific observation that distinguishes BLBS1 from BLBS2 on
      inheritance and variant type.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since there are two genes that produce H3.3, a heterozygous mutation in one of them means that 75% of the alleles are WT."
    explanation: >-
      Establishes the allelic arithmetic behind the gain-of-function reading of
      a heterozygous variant.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been published. The published denominator is the
    global cohort assembled in 2024: of 96 individuals with BLBS, 65 carried an
    H3-3A variant. Ascertainment is by exome or genome sequencing for
    undiagnosed neurodevelopmental disease, so this is a discovery count rather
    than an epidemiologic estimate.
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 65 individuals harbor variants in H3-3A and 31 individuals harbor variants in H3-3B."
    explanation: >-
      Gives the H3-3A-specific reported count within the combined BLBS cohort.
progression:
- phase: Neurodevelopmental phase
  age_range: infancy to childhood
  notes: >-
    Developmental delay is evident from infancy. Many affected individuals never
    achieve independent sitting, walking or speech, though outcomes range. Tone
    abnormality may resolve or evolve with age rather than remaining fixed.
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many affected individuals do not achieve independent sitting, walking, or speaking, although there is a range of developmental outcomes."
    explanation: >-
      Establishes both the severity and the variability of the developmental
      outcome.
- phase: Neurodegenerative phase
  age_range: adulthood
  notes: >-
    A distinct later component: about a fifth of the founding cohort showed
    clinical neurologic degeneration, and cortical atrophy is seen on imaging in
    roughly a quarter even without intractable epilepsy. Camptocormia, worsening
    gait, spasticity and loss of previously acquired milestones are the reported
    manifestations. This is the feature that put "neurodegenerative" in the name
    of the founding report.
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, 9 of the 46 patients (21%) have demonstrated clinical neurologic degeneration, which suggests that this may be a progressive disorder."
    explanation: >-
      Quantifies the degenerative component in the founding cohort.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple patients (26% of the cohort) have cortical atrophy on brain magnetic resonance imaging (MRI), even without intractable epilepsy."
    explanation: >-
      Provides the imaging correlate of the degenerative phase and rules out
      seizure burden as its sole explanation.
  - reference: PMID:40241305
    reference_title: "Coupling deep phenotypic quantification with next-generation phenotyping for 192 individuals with germline histonopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultimately, this work highlights the ways in which histonopathy-associated phenotypes change throughout the lifespan, necessitating longitudinal re-evaluation"
    explanation: >-
      Supports treating the phenotype as age-dependent rather than fixed, which
      is why the two phases are curated separately.
pathophysiology:
- name: De Novo H3-3A Variant Altering Histone H3.3
  biological_scale: MOLECULAR
  description: >-
    The disease begins with a de novo heterozygous variant in H3-3A. Unlike the
    tightly clustered oncohistone substitutions of paediatric glioma, BLBS
    alleles are largely private and spread across the whole 135-residue protein,
    tail and core alike. They are read as gain of function or dominant negative
    rather than haploinsufficiency, which is what makes a single altered allele
    of one of two redundant H3.3 genes sufficient to cause severe disease.
  genes:
  - preferred_term: H3-3A
    term:
      id: hgnc:4764
      label: H3-3A
  molecular_functions:
  - preferred_term: structural constituent of chromatin
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0030527
      label: structural constituent of chromatin
  genetic_context:
    gene:
      preferred_term: H3-3A
      term:
        id: hgnc:4764
        label: H3-3A
    allele_type: MISSENSE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous de novo missense alleles distributed across the protein.
      Recorded as gain of function following the authors' own reading; a
      dominant-negative effect is the stated alternative for some alleles.
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this work, we have identified a cohort of 46 unrelated patients bearing de novo heterozygous germline missense mutations in H3F3A or H3F3B with a core phenotype of progressive neurologic dysfunction and congenital anomalies."
    explanation: >-
      The founding cohort establishing de novo heterozygous missense variants as
      the cause.
  - reference: PMID:36867246
    reference_title: "Histone 3.3-related chromatinopathy: missense variants throughout H3-3A and H3-3B cause a range of functional consequences across species."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most of the causative variants are private and scattered throughout the protein, but all seem to have either a gain-of-function or dominant negative effect on protein function."
    explanation: >-
      Supports both the private, scattered distribution and the
      gain-of-function or dominant-negative reading annotated on this node.
  downstream:
  - target: Disrupted Nucleosome Assembly and Chaperone Interaction
    description: >-
      The altered residues sit at DNA contacts, inter-histone interfaces and
      chaperone-binding surfaces.
- name: Disrupted Nucleosome Assembly and Chaperone Interaction
  biological_scale: MOLECULAR
  description: >-
    Molecular modelling of the founding cohort's variants showed disrupted
    interactions with DNA, with the other core histones, and with the histone
    chaperones that deposit H3.3. The two structural classes fall out by domain:
    core-domain variants are modelled as destabilising the nucleosome itself,
    while tail-domain variants disrupt protein-protein interactions with
    chromatin readers and chaperones. The mutant histone is still incorporated
    into nucleosomes - this is not a failure to assemble chromatin but a failure
    to assemble it correctly.
  molecular_functions:
  - preferred_term: nucleosomal DNA binding
    term:
      id: GO:0031492
      label: nucleosomal DNA binding
  biological_processes:
  - preferred_term: nucleosome assembly
    modifier: ABNORMAL
    term:
      id: GO:0006334
      label: nucleosome assembly
  cellular_components:
  - preferred_term: nucleosome
    term:
      id: GO:0000786
      label: nucleosome
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular modeling of all 37 variants demonstrated clear disruptions in interactions with DNA, other histones, and histone chaperone proteins."
    explanation: >-
      The structural modelling result this node records; evidence source is
      COMPUTATIONAL because the claim comes from in silico modelling.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular modeling revealed that mutations in the histone core likely affect nucleosome stability, while the mutations in the tail affect various protein-protein interactions."
    explanation: >-
      Gives the domain split between nucleosome destabilisation and disrupted
      protein-protein interaction.
  downstream:
  - target: Aberrant Local Histone Post-Translational Modification
    description: >-
      Incorporated mutant histone carries and induces an abnormal local
      modification state.
- name: Aberrant Local Histone Post-Translational Modification
  biological_scale: MOLECULAR
  description: >-
    Post-translational modification profiling of patient material showed
    abnormal modification patterns that are local to the mutant histone rather
    than global. This is the sharpest mechanistic difference from the somatic
    oncohistones, whose lysine substitutions dysregulate modification across the
    whole genome in trans. Here the changes are in cis on the mutant H3.3, which
    is why the severity of the phenotype cannot be explained by global
    dysregulation of the histone code.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation."
    explanation: >-
      Establishes the local rather than global character of the modification
      abnormality.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, these data suggest that the mutant histones can be incorporated into the nucleosome, cause marked local deregulation of chromatin state, and modestly alter the global control of histone modifications."
    explanation: >-
      Confirms incorporation of the mutant histone and locates the deregulation
      at the local chromatin level.
  downstream:
  - target: Deregulated Cell Proliferation
    description: >-
      Local chromatin deregulation is followed by transcriptional changes in
      mitosis and cell-division programs.
  - target: Neural Crest and Craniofacial Developmental Defect
    description: >-
      Chromatin dysregulation in neural crest derivatives disturbs craniofacial
      and glial development.
  - target: Abnormal Brain Development
    description: >-
      Chromatin dysregulation in neural lineages disturbs brain development.
- name: Deregulated Cell Proliferation
  biological_scale: CELLULAR
  description: >-
    RNA sequencing of patient cells showed up-regulation of mitosis and
    cell-division genes, and cellular assays confirmed increased proliferative
    capacity. This is the point at which the germline and somatic H3.3 diseases
    converge without becoming the same thing: the germline variants push
    proliferation, but no BLBS patient in the founding cohort had a malignancy,
    including individuals carrying germline substitutions at the same residues
    that act as oncogenic hotspots somatically.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA sequencing on patient cells demonstrated up-regulated gene expression related to mitosis and cell division, and cellular assays confirmed an increased proliferative capacity."
    explanation: >-
      Provides both the transcriptional and the functional evidence for
      increased proliferation.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, although all known H3.3 mutations in humans cause cancer, none of the patients in our cohort have cancer."
    explanation: >-
      The absence of malignancy despite the proliferative signal, which is why
      this node stops short of a transformation claim.
- name: Neural Crest and Craniofacial Developmental Defect
  biological_scale: TISSUE
  description: >-
    Craniofacial dysmorphism is present in the large majority of patients and is
    the phenotype with the clearest developmental mechanism. In the zebrafish
    h3f3a model, homozygous null larvae lose neural-crest-derived jaw cartilage
    entirely and show reduced foxd3-positive neural-crest-derived glia,
    melanocytes and xanthophores. The glial component is the one that connects to
    the human imaging phenotype: over a third of the patient cohort has
    hypomyelination on brain MRI, and glia are the myelinating cell type.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A zebrafish model showed craniofacial anomalies and a defect in Foxd3-derived glia."
    explanation: >-
      The model-organism result underlying this node.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss of glial cells may relate to the hypomyelination phenotype that is noted on the brain MRIs of over one-third of the H3.3 cohort as glial cells are the cell type responsible for myelination."
    explanation: >-
      Reports the human cohort imaging finding, from which the link to the
      zebrafish glial defect follows only by inference - the authors hedge the
      connection themselves - so the item is marked INDIRECT.
  downstream:
  - target: phenotypes#Craniofacial Dysmorphism
    description: >-
      Disturbed neural-crest-derived craniofacial development produces the
      dysmorphic facial features.
- name: Abnormal Brain Development
  biological_scale: ORGANISM
  description: >-
    The congenital arm of the phenotype: severe developmental delay, epilepsy,
    tone abnormality and structural brain findings, present from infancy. Just
    over half of individuals with an MRI have at least one abnormal finding, and
    corpus callosum dysgenesis is the commonest named one.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: corpus callosum
    term:
      id: UBERON:0002336
      label: corpus callosum
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome is characterized by developmental delay/intellectual disability, craniofacial anomalies, hyper/hypotonia, and abnormal neuroimaging"
    explanation: >-
      States the congenital phenotype cluster this node terminates in.
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within this subgroup, 72% of individuals presented with small posterior fossa, 28% presented with dysgenesis of the corpus collosum, and 44% presented with cortical developmental abnormalities"
    explanation: >-
      Gives the structural findings from the detailed imaging subgroup that
      anchor the structural component of this node.
  downstream:
  - target: phenotypes#Global Developmental Delay and Intellectual Disability
    description: >-
      The dominant clinical consequence of disrupted neural chromatin
      regulation.
  - target: phenotypes#Abnormal Corpus Callosum Morphology
    description: >-
      The commonest specific structural finding on neuroimaging.
  - target: Progressive Postnatal Neuronal H3.3 Dependence
    description: >-
      The same lesion becomes progressively more consequential as neurons mature
      and their H3 pool shifts to H3.3.
- name: Progressive Postnatal Neuronal H3.3 Dependence
  biological_scale: ORGANISM
  description: >-
    The degenerative arm, and the reason the disease has one at all. H3.3
    progressively replaces the replication-dependent H3 variants in postnatal
    brain and comes to dominate the H3 pool in adulthood, so a defective H3.3
    matters more to a neuron the older that neuron gets. The clinical
    correlates are cortical atrophy on imaging and, in adulthood, camptocormia
    and motor decline. The mechanism is an inference from the timing of the
    substrate rather than a demonstrated cause of the human degeneration, which
    is why it is provisional.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A recent study showed that H3.3 begins to replace H3.1 and H3.2 in postnatal mouse and human brains in a time-dependent manner and displaces these canonical H3 variants almost completely in adulthood."
    explanation: >-
      Supports the developmental-timing explanation for why a congenital histone
      lesion produces an adult-onset degenerative phase.
  - reference: PMID:33268356
    reference_title: "Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause a previously unidentified neurodegenerative disorder in 46 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, 9 of the 46 patients (21%) have demonstrated clinical neurologic degeneration, which suggests that this may be a progressive disorder."
    explanation: >-
      Establishes that a degenerative phase actually occurs, which is the
      phenomenon this node explains.
  downstream:
  - target: phenotypes#Camptocormia
    description: >-
      The characteristic adult-onset motor manifestation of the degenerative
      phase.
  - target: phenotypes#Cerebral Cortical Atrophy
    description: >-
      The imaging correlate of progressive neuronal dysfunction.

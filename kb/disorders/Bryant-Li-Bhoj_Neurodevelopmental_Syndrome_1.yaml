    degenerative phase, since new motor decline in adulthood is expected rather
    than incidental.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

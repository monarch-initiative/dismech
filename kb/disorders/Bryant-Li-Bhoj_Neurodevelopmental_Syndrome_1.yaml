name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1
creation_date: "2026-08-29T16:30:00Z"
category: Mendelian
categories:
- Chromatinopathy
- Germline Histonopathy
- Neurodevelopmental Disorder
synonyms:
- BLBS1
- BRYLIB1
- Bryant-Li-Bhoj syndrome 1
- H3-3A-related neurodevelopmental syndrome
- H3F3A-related neurodevelopmental disorder
description: >-
  Bryant-Li-Bhoj neurodevelopmental syndrome 1 (BLBS1, BRYLIB1) is an autosomal
  dominant neurodevelopmental and, in adults, neurodegenerative disorder caused
  by de novo heterozygous variants in H3-3A (H3F3A), one of the two genes
  encoding the replication-independent histone variant H3.3. It is one of the
  very few Mendelian diseases in which the mutated protein is a histone itself
  rather than a histone-modifying enzyme or chaperone. Developmental delay or
  intellectual disability, typically severe, is essentially universal, and most
  affected individuals also have nonspecific craniofacial dysmorphism, abnormal
  tone and abnormal neuroimaging; many never achieve independent sitting,
  walking or speech. The disease alleles are private, scattered across the whole
  protein rather than clustered at hotspots, and act by gain of function or
  dominant negative effect rather than haploinsufficiency - which is what
  separates them mechanistically from the recurrent oncohistone substitutions
  (K27M, G34R/V, K36M) that drive paediatric glioma at the same residues.
  H3-3A and its paralog H3-3B encode an identical protein, so the split into
  BLBS1 and BLBS2 is a split by gene, not by protein product.

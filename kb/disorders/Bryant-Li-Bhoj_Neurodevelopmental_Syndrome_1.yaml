- name: Multidisciplinary Surveillance
  description: >-
    Recommended surveillance at each visit includes growth parameters, nutrition
    and oral-intake safety, constipation, new manifestations such as seizures and
    tone or gait change, developmental and educational progress, and behavioral
    issues. Annually or as clinically indicated, ophthalmology evaluation,
    audiology evaluation, and thyroid function tests are recommended.
    Genitourinary surveillance has additionally been proposed on the basis of ad
    hoc renal findings in the expanded cohort.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:37782742
    reference_title: "Bryant-Li-Bhoj Neurodevelopmental Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annually or as clinically indicated: ophthalmology evaluation, audiology

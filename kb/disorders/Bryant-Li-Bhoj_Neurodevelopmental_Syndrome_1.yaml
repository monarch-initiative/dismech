- name: Mouse H3f3a G34R/V/W mechanistic comparison
  species: Mus musculus
  genotype: Heterozygous endogenous H3f3a G34R, G34V or G34W; additional Cre-dependent H3f3a G34R models
  publication: PMID:36931244
  description: Engineered H3f3a G34R causes progressive microcephaly, cortical-layer thinning, neuronal depletion and reactive glial accumulation. G34V has milder neurologic effects and G34W predominantly mesenchymal/urinary phenotypes. G34R reduces H3K36me2, redistributes DNMT3A, depletes non-CG methylation and sustains complement-gene expression. Forebrain conditional G34R also produces cortical atrophy. Complement-mediated causality was proposed and was not established by rescue. The human G34R/V cases motivating this study have H3-3B variants; these mice are a protein-level mechanistic comparison, not evidence that those patients had BLBS1.
  modeled_mechanisms:
  - target: Altered Recruitment of PWWP-Domain Effectors
    description: Perturbs H3K36-dependent DNMT3A recruitment with downstream DNA methylation and transcriptional changes.
    relationship: PERTURBS
    fidelity: LOW
    evidence:
    - &id015
      reference: PMID:36931244
      reference_title: Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: the G34R mutation diminishes H3K36me2 and consequently redistributes DNMT3A from intergenic regions to CpG islands.
      explanation: Mouse H3f3a provides mechanistic comparison for the shared protein. The human G34R/V patients in this paper had H3-3B variants, so this is indirect evidence for BLBS1.
    limitations: Opposite effects of other alleles, including T45I, prevent generalizing G34R-associated loss of DNMT3A binding to all H3-3A disease. Human cases in this study are H3-3B-related.
  evidence:
  - *id015
  - reference: PMID:36931244
    reference_title: Single substitution in H3.3G34 alters DNMT3A recruitment to cause progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: whether the disease phenotype is directly caused by persistence of immune gene activation (C3 and C1q) in neurons as we hypothesize
    explanation: The authors explicitly identify the complement-to-neurodegeneration step as requiring further tests.
discussions:
- discussion_id: blbs1_genotype_phenotype_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What accounts for the phenotypic variability that gene, protein domain and
    sex together fail to explain - including variability between individuals
    carrying the same H3-3A allele?
  attaches_to:
  - pathophysiology#De Novo H3-3A Variant Altering Histone H3.3
  - phenotypes#
  rationale: >-
    Phenotypes vary even among individuals with the same H3-3A allele. The expanded cohort describes trends
    by gene, domain and sex but does not establish predictive genotype–phenotype rules. Variant-specific biochemistry,
    gene expression, developmental timing and other modifiers remain candidate contributors.
  evidence:
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since these variables do not account for all BLBS phenotypic variability, these findings suggest that additional factors may play a role in modifying the phenotypes of affected individuals."
    explanation: >-
      States the residual, unexplained variability directly.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:38678163
    reference_title: "Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder Bryant-Li-Bhoj syndrome with 38 additional individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, phenotypic heterogeneity was present even amongst individuals harboring the same variant."
    explanation: >-
      Shows that the unexplained variability persists at fixed genotype, which
      rules out variant identity as the missing determinant.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- discussion_id: blbs1_cancer_predisposition
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do germline H3.3 variants confer cancer predisposition, given that the same
    residues are oncogenic when altered somatically?
  attaches_to:
  - pathophysiology#Deregulated Cell Proliferation
  rationale: >-
    Increased proliferation in cultured patient cells does not establish cancer predisposition. The 2025 pan-histonopathy
    survey reported two cancers across 192 individuals, including a pulmonary carcinoid in an H3-3B case and
    leukemia in an H4-related disorder. This heterogeneous, incompletely screened cross-sectional denominator
    cannot estimate BLBS1 incidence or lifetime risk. Tumor and constitutional sequencing and longer follow-up
    are needed; standardized BLBS1 surveillance is not established by these observations.

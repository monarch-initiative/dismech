notes: >-
  This entry models the general diagnostic entity of mast cell activation
  syndrome (MCAS) as defined by the 2019/2020 consensus criteria (episodic
  multi-organ symptoms consistent with mast cell mediator release, an
  objective mediator-release biomarker rise during an episode, and response
  to anti-mediator therapy), and its idiopathic and secondary subtypes.
  Monoclonal (clonal) MCAS -- driven by a somatic KIT D816V-type variant and
  mechanistically and therapeutically distinct -- is curated separately as
  Monoclonal_Mast_Cell_Activation_Syndrome.yaml, consistent with the
  granularity-ladder convention of promoting a mechanistically and
  therapeutically distinct stratum to its own entry.

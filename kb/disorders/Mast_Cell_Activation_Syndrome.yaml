biochemical:
- name: Serum tryptase, event-related rise
  notes: >-
    An acute event-related rise over the patient's own baseline is the
    preferred and most specific validated mediator marker. Elevated baseline
    values alone are not diagnostic of MCAS (they may instead reflect
    hereditary alpha-tryptasemia), and normal baseline values do not exclude
    the diagnosis.
  biomarker_term:
    preferred_term: Elevated total serum tryptase
    term:
      id: HP:0031901
      label: Elevated total serum tryptase
  presence: INCREASED
  readouts:
  - target: Mast Cell Degranulation and Mediator Release
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      An acute-phase tryptase level meeting or exceeding baseline tryptase x
      1.2 + 2 ng/mL, drawn within four hours of a symptomatic episode, is the
      diagnostic biomarker rise required by the consensus criteria.
  evidence:
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly,elevated baseline values in serum tryptase or urinary metabolites are not diagnostic of MCAS, nor do normal values exclude the diagnosis."
    explanation: >-
      States why an event-related rise, not a single baseline value, is the
      diagnostic marker this node records.

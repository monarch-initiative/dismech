diagnosis:
- name: Consensus diagnostic criteria (Akin, Valent, Metcalfe 2010; refined 2019-2020)
  description: >-
    All three criteria are required: episodic symptoms consistent with mast
    cell mediator release affecting two or more organ systems; an
    event-related increase in a validated serum or urinary mediator marker
    (preferably tryptase meeting or exceeding baseline x 1.2 + 2 ng/mL,
    drawn within four hours of an episode); and a decrease in frequency or
    severity, or resolution, of symptoms with anti-mediator therapy. A
    clonal mast cell disorder and well-defined secondary causes must be
    excluded before the idiopathic label is assigned.
  markers: >-
    Event-related serum tryptase rise; urinary N-methylhistamine; urinary
    11-beta-prostaglandin F2alpha
  evidence:
  - reference: PMID:21035176
    reference_title: "Mast cell activation syndrome: Proposed diagnostic criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "patients with a presumptive diagnosis of “MCAS” must have two or more of the organ manifestations of mast cell activation such as flushing, urticaria, diarrhea, wheezing. The diagnosis requires that a patient has evidence of an elevation in mediators such as serum tryptase, 24-hour N-methylhistamine, or 11βPGF2 during at least two episodes with a negative workup for systemic mastocytosis or clonal mast cell disease in bone marrow biopsies"
    explanation: Source of the original 2010 mediator-marker and multi-organ criterion this diagnosis record captures.
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant elevation if level is at least 120% + 2 compared to baseline"
    explanation: States the refined quantitative event-related tryptase-rise threshold.
- name: Exclusion of clonal and secondary causes
  description: >-
    Before an idiopathic-MCAS diagnosis can be assigned, a well-defined
    secondary cause of mast cell activation (food allergy,
    cofactor-dependent allergy, NSAID hypersensitivity, chronic infection or
    inflammatory disease) must be excluded, and a clonal mast cell disorder
    must be investigated (baseline tryptase, peripheral-blood KIT p.D816V
    testing, mast cell clonality prediction score, and bone marrow biopsy
    when clonality risk is high).
  markers: >-
    Baseline serum tryptase; peripheral-blood KIT p.D816V mutation testing;
    mast cell clonality prediction score
  evidence:
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with idiopathic anaphylaxis, evaluation for a clonal mast cell disorder is recommended. This includes measuring baseline serum tryptase, testing for the KIT p.D816V mutation in peripheral blood (using high-sensitivity assays, if available), and calculating a mast cell clonality prediction score."
    explanation: States the clonal-disorder workup this diagnosis record captures.
  - reference: PMID:41272881

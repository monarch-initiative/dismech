name: Mast Cell Activation Syndrome
creation_date: "2026-09-18T03:03:47Z"
category: Complex
synonyms:
- MCAS
- mast cell activation disease
- disorder of mast cell activation
disease_term:
  preferred_term: mast cell activation syndrome
  term:
    id: MONDO:0100004
    label: mast cell activation syndrome
notes: >-
  This entry models the general diagnostic entity of mast cell activation
  syndrome (MCAS) as defined by the 2010/2019-2020 consensus criteria
  (episodic multi-organ symptoms consistent with mast cell mediator release,
  an objective mediator-release biomarker rise during an episode, and
  response to anti-mediator therapy), together with its idiopathic and
  secondary subtypes. Monoclonal (clonal) MCAS -- driven by a somatic KIT
  D816V-type variant and mechanistically and therapeutically distinct -- is
  curated separately as Monoclonal_Mast_Cell_Activation_Syndrome.yaml,
  consistent with the granularity-ladder convention of promoting a
  mechanistically and therapeutically distinct stratum to its own entry.
  Hereditary alpha-tryptasemia (HaT) is modeled here as a genetic modifier
  (elevating basal tryptase and mediator-release severity), not as a causal
  lesion, per its own ICD-10-CM identity (D89.44) and modifier role in the
  literature. The literature is explicit that MCAS is both overdiagnosed
  (broad symptom complexes labeled MCAS without meeting consensus criteria)
  and underdiagnosed (long diagnostic delay); this entry follows the
  consensus-criteria-confirmed definition throughout.
description: >-
  Mast cell activation syndrome (MCAS) is a clinical entity in which mast
  cells release excessive and/or aberrant quantities of mediators (histamine,
  tryptase, prostaglandin D2, cysteinyl leukotrienes, heparin, and cytokines)
  in response to physical, chemical, immunologic, or psychological triggers,
  producing recurrent, episodic, multisystem symptoms without the mast-cell
  proliferation seen in mastocytosis. It is subclassified as idiopathic (no
  identifiable trigger or clonal marker), secondary (a well-defined
  IgE-mediated or non-IgE trigger such as allergy or chronic
  infection/inflammation is identified), or combined (both a clonal marker
  and a secondary trigger); hereditary alpha-tryptasemia can co-occur with
  any of these as a severity modifier. Diagnosis requires meeting all three
  consensus criteria (episodic multi-organ mediator-release symptoms, an
  event-related rise in a validated mediator marker, and response to
  anti-mediator therapy) and excluding both a clonal mast cell disorder and a
  well-defined secondary cause.
has_subtypes:
- name: Idiopathic MCAS
  display_name: Idiopathic Mast Cell Activation Syndrome
  subtype_term:
    preferred_term: idiopathic mast cell activation syndrome
    term:
      id: MONDO:0100051
      label: idiopathic mast cell activation syndrome
  description: >-
    MCAS meeting consensus criteria with no identifiable IgE-mediated or
    non-IgE trigger and no evidence of a clonal mast cell disorder. This is
    the subtype this entry's pathophysiology chain principally models.
- name: Secondary MCAS
  display_name: Secondary Mast Cell Activation Syndrome
  subtype_term:
    preferred_term: secondary mast cell activation syndrome
    term:
      id: MONDO:0100006
      label: secondary mast cell activation syndrome
  description: >-
    MCAS in which mast cell activation is attributable to a well-defined
    IgE-mediated (allergy) or non-IgE (chronic infection, autoimmune or
    inflammatory disease) trigger, in the absence of a clonal mast cell
    disorder. Excluding secondary causes is itself a required diagnostic
    step before an idiopathic-MCAS label can be assigned.
genetic:
- name: TPSAB1
  gene_term:
    preferred_term: TPSAB1
    term:
      id: hgnc:12019
      label: TPSAB1
  association: >-
    Genetic modifier: germline TPSAB1 (alpha-tryptase) copy-number gain
    (hereditary alpha-tryptasemia) is not itself a cause of MCAS but raises
    basal serum tryptase and heightens mediator-symptom severity and
    anaphylaxis risk when co-occurring with clonal or secondary mast cell
    disease.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  frequency: 4-6% of the general Caucasian population
  features: >-
    Autosomal-dominant germline duplication (most commonly) or triplication
    of the TPSAB1-encoded alpha-tryptase sequence at chromosome 16p13.3,
    highly penetrant for elevated basal serum tryptase but with variable and
    incomplete penetrance for symptomatic multisystem disease.
  evidence:
  - reference: PMID:27749843
    reference_title: "Elevated basal serum tryptase identifies a multisystem disorder associated with increased TPSAB1 copy number."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the identification of germline duplications and triplications in the TPSAB1 gene encoding α-tryptase that segregate with inherited increases in basal serum tryptase levels in 35 families presenting with associated multisystem complaints"
    explanation: >-
      Establishes the germline TPSAB1 copy-number gain as the genetic basis
      of hereditary alpha-tryptasemia and its multisystem symptom
      association.
  - reference: PMID:27749843
    reference_title: "Elevated basal serum tryptase identifies a multisystem disorder associated with increased TPSAB1 copy number."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals harboring alleles encoding three copies of α-tryptase had higher basal serum levels of tryptase and were more symptomatic than those with alleles encoding two copies, suggesting a gene-dose effect."
    explanation: >-
      Demonstrates the gene-dose relationship between TPSAB1 copy number and
      symptom severity that underlies the modifier (not causal) role modeled
      here.
pathophysiology:
- name: Mast Cell Surface Receptor Engagement
  biological_scale: MOLECULAR
  description: >-
    Mast cell activation is triggered either through classical IgE-dependent
    FcεRI cross-linking by allergen-bound IgE (secondary/allergic MCAS), or
    through IgE-independent routes -- MRGPRX2 engagement by basic
    secretagogues/drugs, complement anaphylatoxins C3a/C5a, physical stimuli,
    or endotoxin -- in idiopathic MCAS where no IgE trigger is identified.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  downstream:
  - target: Downstream Signaling Cascade Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The next step is to exclude secondary causes of mast cell activation, particularly cofactor-dependent food allergy and nonsteroidal anti-inflammatory drug hypersensitivity."
    explanation: >-
      Establishes secondary (identifiable-trigger) mast cell activation as a
      real diagnostic category distinct from idiopathic disease, supporting
      the IgE-dependent branch of this node.
- name: Downstream Signaling Cascade Activation
  biological_scale: CELLULAR
  description: >-
    Receptor engagement activates PI3K/Akt/mTOR, RAS/MAPK, and JAK/STAT
    signaling cascades, driving cytoskeletal reorganization and trafficking
    of secretory granules toward the plasma membrane.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  molecular_functions:
  - preferred_term: protein tyrosine kinase activity
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  downstream:
  - target: Mast Cell Degranulation and Mediator Release
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review aims provide a practical, stepwise approach to the diagnosis and management of MCAS, based on the consensus criteria established by the European Competence Network on Mastocytosis-American Initiative on Mast Cell Diseases"
    explanation: >-
      Establishes the consensus-criteria framing this pathophysiology chain
      is built against. Graded INDIRECT because the review states scope
      rather than the specific signaling detail of this node.
- name: Mast Cell Degranulation and Mediator Release
  biological_scale: CELLULAR
  description: >-
    Regulated exocytosis releases preformed granule contents (histamine,
    tryptase, heparin) together with newly synthesized lipid mediators
    (prostaglandin D2, cysteinyl leukotrienes) and cytokines (TNF-alpha,
    IL-6, IL-13).
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
    modifier: INCREASED
  downstream:
  - target: Multisystem Mediator-Driven Symptom Generation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23179866
    reference_title: "Mast cell activation syndrome: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mast cell activation syndrome (MCAS) is a condition with signs and symptoms involving the skin, gastrointestinal, cardiovascular, respiratory, and neurologic systems."
    explanation: >-
      Establishes the multisystem symptom profile that follows from mediator
      release, the claim this node's downstream edge carries.
- name: Multisystem Mediator-Driven Symptom Generation
  biological_scale: ORGANISM
  description: >-
    Released mediators act at end-organ sites: histamine and PGD2 drive
    vasodilation, flushing, and hypotension; histamine and leukotrienes
    contract smooth muscle (bronchoconstriction, GI cramping); increased
    vascular permeability produces urticaria and angioedema; autonomic
    engagement produces tachycardia and presyncope -- together the episodic,
    multisystem clinical picture required by the consensus diagnostic
    criteria.
  biological_processes:
  - preferred_term: acute inflammatory response to antigenic stimulus
    term:
      id: GO:0002438
      label: acute inflammatory response to antigenic stimulus
    modifier: INCREASED
  downstream:
  - target: Flushing
    causal_link_type: DIRECT
  - target: Urticaria
    causal_link_type: DIRECT
  - target: Angioedema
    causal_link_type: DIRECT
  - target: Abdominal pain
    causal_link_type: DIRECT
  - target: Diarrhea
    causal_link_type: DIRECT
  - target: Hypotension
    causal_link_type: DIRECT
  - target: Tachycardia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical clinical manifestations: sudden onset episodes with symptoms typical of MCA (see list below), affecting at least two organ systems, and resolving within several hours (often meeting anaphylaxis criteria)"
    explanation: >-
      States the episodic, multi-organ, self-resolving symptom pattern this
      node produces.

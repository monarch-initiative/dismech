    explanation: States the primary/secondary/idiopathic classification this diagnosis step operationalizes.
definitions:
- name: Primary/secondary/idiopathic classification of mast cell activation syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  attaches_to:
  - disease#Mast Cell Activation Syndrome
  - has_subtypes#Idiopathic MCAS
  - has_subtypes#Secondary MCAS
  description: >-
    Akin et al. (2010) proposed classifying mast cell activation disorders
    as primary (a clonal mast cell disorder is identified), secondary (a
    well-defined condition is identified as the cause of mast cell
    activation), or idiopathic (neither is found). The classification was
    later extended with combined (both clonal and secondary) and hereditary
    alpha-tryptasemia-associated categories, and is now referred to as the
    ECNM-AIM consortium classification.
  validation_status:
    status: UNVALIDATED
    rationale: >-
      The classification is consensus- and cohort-derived and in wide
      clinical use, but the literature explicitly frames MCAS diagnostic
      criteria as still evolving, with no formal diagnostic-accuracy study
      establishing operating characteristics for the idiopathic/secondary
      distinction itself.
  evidence:
  - reference: PMID:41272881
    reference_title: "Diagnosis and management of mast cell activation syndrome (MCAS) in Canada: a practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They also proposed a classification of mast cell activation disorders: primary (if a clonal mast cell disorder is identified), secondary (if a well-defined condition is identified as the cause of mast cell activation), and idiopathic"
    explanation: States the classification this definition records.
prevalence:
- population: 703 consecutive adult patients referred to a single tertiary center for suspected mast cell disorders
  measure_type: POINT_PREVALENCE
  prevalence_class: NOT_YET_DOCUMENTED
  rate_per_100000: 4.4
  notes: >-
    31 of 703 patients referred for suspected mast cell disorders were
    confirmed as idiopathic MCAS after full consensus-criteria workup (4.4%
    of the referred cohort). This is a proportion within a highly selected
    referred population, not a general-population prevalence, and
    prevalence_class is left as NOT_YET_DOCUMENTED because no figure exists
    for the general population.
  evidence:
  - reference: PMID:38056692
    reference_title: "Low Prevalence of Idiopathic Mast Cell Activation Syndrome Among 703 Patients With Suspected Mast Cell Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall prevalence of iMCAS was 4.4% in the entire cohort, which indicates that iMCAS is an uncommon condition."
    explanation: Source of the referred-cohort prevalence figure recorded here.
discussions:
- discussion_id: mcas_overdiagnosis_underdiagnosis
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the clinical/patient-facing "MCAS" label reflects
    consensus-criteria-confirmed disease versus a broader, unvalidated
    symptom complex, and what does that mean for prevalence estimates?
  attaches_to:
  - disease#Mast Cell Activation Syndrome
  - prevalence#
  rationale: >-
    A 2024 review frames MCAS explicitly as both overdiagnosed (broad
    multisystem symptom complexes labeled MCAS without meeting the three
    consensus criteria) and underdiagnosed (long diagnostic delay before
    confirmation). A large single-center cohort found only 4.4% of patients
    referred for suspected mast cell disorders met strict criteria for
    idiopathic MCAS, far below popular/patient-facing prevalence claims.
    Because no general-population prevalence study exists, any figure cited
    for this entry should be read as bounded to a referred, already-selected
    population, and the underlying question -- how common
    consensus-criteria-confirmed MCAS actually is in an unselected
    population -- remains open.
  evidence:
  - reference: PMID:38851398
    reference_title: "Mast cell activation syndrome: Current understanding and research needs."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Whether MCAS is a primary syndrome or exists as a constellation of symptoms in the context of known inflammatory, allergic, or clonal disorders associated with systemic mast cell activation is not well understood"
    explanation: >-
      A 2024 JACI review states the open epistemic status of MCAS as a
      distinct clinical entity, motivating this knowledge gap.

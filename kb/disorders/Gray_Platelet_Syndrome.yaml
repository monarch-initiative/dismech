animal_models:
- name: Nbeal2-null mouse
  species: Mouse
  genotype: Nbeal2 knockout (homozygous null)
  publication: PMID:23861251
  description: >-
    A faithful model of the platelet and marrow phenotype, and the source of the
    disorder's clearest mechanistic placement: P-selectin, an alpha-granule
    membrane protein, is still expressed at 48% of wild-type and is still
    externalized on activation, and VPS33B/VPS16B levels are normal - which
    places NBEAL2 at a later stage of alpha-granule biogenesis than the
    VPS33B/VPS16B machinery defective in ARC syndrome. The model also shows the
    granule defect damaging megakaryocyte survival and platelet production, not
    just granule content.
  modeled_mechanisms:
  - target: Failure of Megakaryocyte Alpha-Granule Biogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces alpha-granule deficiency with the specific cargo losses seen in
      patients, plus splenomegaly and macrothrombocytopenia.
    limitations: >-
      A constitutional null; human disease includes missense and splice alleles
      with residual protein. The mouse has not been used to test the
      constitutive-growth-factor-release hypothesis for myelofibrosis, which
      remains the unresolved part of the human disease.
    readouts:

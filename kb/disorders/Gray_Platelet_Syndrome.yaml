- name: Leukocyte Granule Deficiency
  biological_scale: CELLULAR
  description: >-
    The same biogenesis defect expressed outside the megakaryocyte lineage.
    In patients, neutrophils show reduced specific and gelatinase granule
    content with elevated surface and circulating granule proteins — the
    signature of inappropriate release rather than failed synthesis, since
    neutrophils differentiated in vitro from the same patients' progenitors have
    normal granule abundance — together with impaired extracellular trap
    formation, while azurophilic granules are preserved. The NK-cell defect is
    a separate claim with a separate evidence base: reduced numbers and impaired
    degranulation are established in Nbeal2-deficient mice, and whether the NK
    compartment is also altered in human GPS is explicitly an open question.
    Clinically the human picture is low leukocyte counts and a modest excess of
    mild infections rather than severe immunodeficiency.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil

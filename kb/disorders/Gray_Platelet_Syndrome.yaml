differential_diagnoses:
- name: Chediak-Higashi Syndrome
  description: >-
    Caused by loss of LYST, another BEACH-domain vesicle-trafficking protein, and
    likewise a disorder of granule formation - but the affected organelles are
    lysosome-related (dense granules, cytotoxic granules, melanosomes), giving
    immunodeficiency, haemophagocytic lymphohistiocytosis and partial albinism
    with enlarged rather than absent granules. The domain kinship is real; the
    disease is not the same.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another such protein is CHS1, which is defective in Chediak-Higashi disease (CHD, OMIM #214500), a disorder of immunodeficiency, platelet dense granule defects, partial albinism, and enlarged lysosomes or lysosome-related organelles in hematopoietic cells and melanocytes4,15."
    explanation: >-
      States the shared protein family and the phenotypic differences that
      separate the two disorders.
- name: Dense-Granule Storage Pool Disease and Combined Alpha-Delta SPD
  description: >-
    The storage pool diseases divide by which granule is lost. Isolated
    dense-granule deficiency (including the Hermansky-Pudlak and Chediak-Higashi
    syndromes) and combined alpha-delta deficiency are distinguished from this
    disorder by electron microscopy, not by the bleeding pattern.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding disorders arising from defective platelet granules constitute the platelet storage pool diseases (SPD) and include isolated δ -granule deficiency (delta-SPD), combined α and δ -SPD and isolated α -granule deficiency (GPS; OMIM #139090)3,4,6."
    explanation: >-
      Sets out the storage pool disease classification that positions this
      disorder against its siblings.
- name: ARC Syndrome (VPS33B/VIPAS39)
  description: >-
    Also produces defective alpha-granule biogenesis, but through the
    VPS33B/VPS16B machinery that acts earlier in the pathway, and with
    arthrogryposis, renal dysfunction and cholestasis dominating the phenotype.
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects of α-granule biosynthesis also involve germline VPS33B mutations in the ARC (arthrogryposis, renal dysfunction and cholestasis) syndrome."
    explanation: >-
      Establishes the other genetic route to alpha-granule deficiency and the
      syndromic features that separate it.
discussions:
- discussion_id: gap_myelofibrosis_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes the progressive marrow fibrosis in gray platelet syndrome, and
    is it driven by constitutive megakaryocyte release of alpha-granule cargo?
  attaches_to:
  - pathophysiology#Constitutive Marrow Release of Megakaryocyte Growth Factors
  - pathophysiology#Progressive Myelofibrosis and Splenomegaly
  rationale: >-
    The myelofibrosis, not the bleeding, is what makes this disorder
    progressive and occasionally fatal, and its mechanism is explicitly unknown.
    The leading hypothesis - that cargo which cannot be stored is instead
    released constitutively into the marrow - is plausible and is what the
    gene-discovery paper proposes, but it has not been tested, in part because
    the fibrotic marrow itself prevented the authors from harvesting enough
    megakaryocytes to culture. A second, non-exclusive candidate emerged from
    the same work: microarray data in patient fibroblasts showed fibronectin
    overexpression, and fibronectin is essential for proplatelet formation and
    megakaryocyte-matrix interaction. Distinguishing these matters clinically,
    because a cargo-release mechanism would predict that suppressing
    megakaryocyte output slows the fibrosis whereas a matrix mechanism would not.
  proposed_experiments:
  - experiment_id: exp_nbeal2_null_marrow_growth_factor_timecourse
    name: Marrow growth-factor timecourse in the Nbeal2-null mouse
    description: >-
      Measure marrow interstitial platelet-derived growth factor, TGF-beta and
      fibronectin longitudinally in Nbeal2-null mice alongside reticulin
      staining, and test whether megakaryocyte-restricted rescue or
      thrombopoietin-receptor blockade alters the fibrosis trajectory. The model
      already reproduces the splenomegaly and granule defect, so it is the
      natural system in which to test a hypothesis the human tissue cannot.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fibrotic nature of the GPS bone marrow prevented us from obtaining sufficient bone marrow for ex-vivo expansion of GPS megakaryocytes, the only cell type that expresses the GPS phenotype of defective α-granule biogenesis."
    explanation: >-
      Documents the specific methodological obstacle that has kept this gap
      open, which is why the proposed experiment is set in the mouse.
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our previous microarray data in GPS fibroblasts showed overexpression of fibronectin11, essential for proplatelet formation in cultured megakaryocytes12 and critical for megakaryocyte-matrix interactions13."
    explanation: >-
      Supports the second candidate mechanism named in this gap.
- discussion_id: gap_nbeal2_molecular_function
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of NBEAL2 function mechanistically cause defective
    alpha-granule biogenesis?
  attaches_to:
  - pathophysiology#Failure of Megakaryocyte Alpha-Granule Biogenesis
  rationale: >-
    The causal gene has been known since 2011, and the step it acts at has been
    bracketed (late in biogenesis, downstream of VPS33B/VPS16B), but the
    molecular function itself remains unstated. Its predicted interactors -
    WDFY3, and through it LYST - rest entirely on computational prediction, a
    limitation the source states explicitly. This is a gap in molecular
    mechanism rather than in disease-gene assignment, and it is the reason this
    entry's central effector node is described phenomenologically.
  proposed_experiments:
  - experiment_id: exp_nbeal2_interactome
    name: Proximity-labelling interactome of NBEAL2 in human megakaryocytes
    description: >-
      Use proximity-dependent biotinylation of tagged NBEAL2 in iPSC-derived
      human megakaryocytes to identify physical interactors at the dense tubular
      system, and test the predicted WDFY3 interaction directly. Replacing
      computationally predicted partners with measured ones is the prerequisite
      for any mechanistic model of the packaging step.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "How absence of NBEAL2 function in megakaryocytes results in defective α-granule biogenesis remains unknown."
    explanation: >-
      The source's own statement of the gap.
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These protein-protein interactions are entirely based on computational predictions; future experiments will determine their accuracy."
    explanation: >-
      Supports the caveat that the proposed interactome is unmeasured, which is
      what the proposed experiment addresses.
notes: >-
  Conformance: this entry conforms to `primary_hemostatic_plug_failure` through
  the SECRETION arm - `#Impaired Platelet Activation, Granule Secretion, and
  Integrin Inside-Out Signalling` - which is the arm the module assigns to the
  storage pool diseases. It does not conform to the adhesion or aggregation
  arms; GPIb-IX-V and alphaIIbbeta3 are intact here.

  Two arms, one gene. The disorder has a haemostatic arm (granule-deficient
  platelets, mucocutaneous bleeding) that the module covers, and a marrow arm
  (progressive myelofibrosis, splenomegaly, deepening thrombocytopenia) that it
  deliberately does not - the module models qualitative platelet function, and
  says so. The marrow arm carries the long-term prognosis and is curated here on
  its own nodes, with the mechanism flagged as unknown rather than asserted.

  Evidence discipline note. The `Constitutive Marrow Release of Megakaryocyte
  Growth Factors` node is curated at PARTIAL support and its downstream edge as
  INDIRECT_UNKNOWN_INTERMEDIATES, because the source that proposes it also
  states in the same sentence that the basis of the myelofibrosis remains
  unknown. It is included as a named hypothesis rather than omitted, so that the
  open question is visible in the pathograph rather than only in prose, but it
  should not be read as an established pathway.

  The immune arm (`NBEAL2-Dependent Granule Defects in Leukocytes`) is recent
  and rests on a single deep-phenotyping cohort (PMID:32693407). It is curated
  because it is a mechanistically coherent extension of the same granule defect
  and because it changes what a clinician should look for, but it has not been
  independently replicated at the time of writing.

  No `treatments:` block, deliberately. Management of this disorder is real and
  documented - antifibrinolytics, desmopressin, platelet transfusion, and
  splenectomy or haematopoietic transplantation at the severe end - but none of
  it is quotable at disorder level from anything in this repository's reference
  cache: the cached sources are a gene-discovery paper, a natural-history
  cohort, a deep-phenotyping cohort and a single perioperative case report whose
  abstract names no agent. Writing a treatments block from the general
  inherited-platelet-disorder literature would mean either citing a source that
  is not about this disease or manufacturing a snippet, and both are worse than
  an honest gap. The one management-relevant fact that IS quotable is curated,
  as a `diagnosis:` entry: bleeding severity does not track the platelet count
  or the functional tests, so laboratory values cannot triage perioperative
  risk.

  Note also that this entry does NOT inherit the
  `primary_hemostatic_plug_failure` module's recombinant activated factor VIIa
  treatment pattern. That is the module's own stated rule, not an oversight -
  the agent's evidence base is Glanzmann thrombasthenia and its use elsewhere in
  the series is extrapolation, so the module explicitly says conformers do not
  inherit it.

  Curation provenance. This entry was curated by direct review of the cached
  full text and abstracts of the references listed in `references:`, not from a
  deep-research provider artifact, so there is no corresponding file under
  `research/`. Candidate PMIDs were located by PubMed search and each was
  fetched with `just fetch-reference` before use; several initially plausible
  identifiers turned out to be unrelated papers and were discarded rather than
  cited on their titles. Every snippet in this entry is an exact substring of
  the cached reference text.

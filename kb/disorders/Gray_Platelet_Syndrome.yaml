prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. The scale is best conveyed by pedigree counts rather than a
    population rate: 86 NBEAL2 variants across 69 pedigrees had been described
    by the time of the 2021 review, and the largest single cohort comprised 47
    patients. No incidence estimate exists.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-six different NBEAL2 variants have been detected in 69 GPS pedigrees
      described to date, harbouring homozygous (65%) or compound heterozygous
      (35%) mutations.
    explanation: >-
      The pedigree count that stands in for a prevalence estimate in a disorder
      too rare for one.
progression:
- phase: Bleeding-disorder phase
  notes: >-
    Macrothrombocytopenia and bleeding tendency are present from early life and
    are relatively stable; presentation is usually in infancy or childhood.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical clinical features include macrothrombocytopenia, bleeding and
      elevated vitamin B12 levels, while bone marrow fibrosis and splenomegaly
      may develop during disease progression.
    explanation: >-
      Separates the early stable features from the later progressive ones, which
      is the distinction these two phases record.
- phase: Fibrotic phase
  notes: >-
    Marrow fibrosis and splenomegaly develop later and progress, with
    pancytopenia possible in advanced disease. This biphasic course is why
    lifelong surveillance is warranted even in patients whose bleeding is mild.
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term follow-up data demonstrated the progressive nature of the
      thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in
      some patients.
    explanation: >-
      Establishes the progressive character of this phase and its potential
      lethality.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Most patients have mild to moderate bleeding needing no specific treatment,
    which argues for a moderate rather than high assessment. Against that: the
    fibrotic phase is progressive and can end in marrow failure, fatal
    haemorrhage was documented on long-term follow-up, and the immune arm adds
    autoimmune disease in a quarter of patients. The burden is therefore
    moderate on average and materially higher in the subset that progresses.
  evidence:
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these abnormalities cause mostly moderate but in rare cases severe bleeding
    explanation: >-
      The bleeding-severity distribution underpinning the moderate assessment.
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term follow-up data demonstrated the progressive nature of the
      thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in
      some patients.
    explanation: >-
      The counterweight that keeps this from being scored as a low-burden
      disorder.
diagnosis:
- name: Peripheral blood smear and electron microscopy
  description: >-
    Large, pale gray platelets on a stained smear are the diagnostic clue that
    names the disease; transmission electron microscopy showing absent or
    markedly reduced alpha-granules with preserved dense granules is the
    structural confirmation, and it is that contrast — alpha absent, dense
    preserved — that distinguishes GPS from the combined storage pool defects.
  evidence:
  - reference: PMID:21765412
    reference_title: NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPS platelets are large and appear gray on light microscopy (Fig. 1a-b)5-7;
      the diagnosis is confirmed by electron microscopy (EM) showing absent or
      markedly reduced α-granules in platelets8(Fig. 1c-d) and in megakaryocytes9,
      although both platelets and megakaryocytes have rudimentary α-granule
      precursors10.
    explanation: >-
      States the diagnostic sequence and the ultrastructural finding that confirms
      it.
- name: NBEAL2 sequencing
  description: >-
    Molecular confirmation, by targeted NBEAL2 sequencing when the phenotype is
    characteristic or by an inherited-platelet-disorder gene panel or exome when
    it is not. Because most variants are private and scattered across 54 exons,
    full-gene rather than hotspot analysis is required, and a normal panel does
    not exclude the diagnosis if the smear and electron microscopy are typical.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic diagnosis may be approached by Sanger sequencing of the NBEAL2 gene,
      when the diagnosis of GPS is suspected based on the phenotypic features, or
      by high-throughput sequencing, including gene panels for inherited platelet
      disorders19 or whole-exome sequencing.
    explanation: >-
      Describes the testing strategy recorded in this entry.
treatments:
- name: Platelet transfusion
  description: >-
    The mainstay for active haemorrhage and for procedural cover. Because the
    need is lifelong, HLA-matched donor platelets are preferred where available
    to limit alloimmunization. It replaces the missing functional platelets
    rather than correcting anything upstream.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Macrothrombocytopenia and Impaired Platelet Function
    treatment_effect: BYPASSES
    description: >-
      Transfused normal platelets supply the granule cargo and function the
      patient's own platelets lack, without altering the underlying defect —
      which is why the effect lasts only as long as the transfused platelets do.
    evidence:
    - reference: PMID:21765411
      reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Since the α-granule protein cargo is essential to the development of a
        robust platelet plug, GPS cases are symptomatic at platelet count levels
        that are typically not associated with bleeding.
      explanation: >-
        Establishes that the deficit being bypassed is functional cargo, not
        merely platelet number.
  notes: >-
    Curated without treatment-level evidence because no controlled trial or
    case-series outcome data specific to transfusion in GPS was established
    during curation; the practice is standard supportive care for inherited
    platelet disorders generally.
- name: Genetic counselling
  description: >-
    Recurrence risk is 25% for future pregnancies of carrier parents, and once
    a family's variants are known, carrier and prenatal testing become
    available. Counselling must also address the genetically distinct
    dominant (GFI1B) and X-linked (GATA1) disorders that produce a similar
    smear, since the recurrence risk differs entirely.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of inheritance was autosomal recessive (AR) in 11 and
      indeterminate in 3 families.
    explanation: >-
      The inheritance mode that determines the recurrence risk counselling rests
      on.
animal_models:
- name: Nbeal2 knockout mouse
  species: Mouse
  genotype: Nbeal2-/-
  publication: PMID:23863626
  description: >-
    The principal model, independently generated by more than one group with
    concordant results. It reproduces the human syndrome closely —
    splenomegaly, macrothrombocytopenia, absent platelet alpha-granules and
    their cargo — and adds the functional measurements that cannot be made in
    patients: impaired adhesion, aggregation and coagulant activity translating
    into defective arterial thrombus formation, and abnormal megakaryocyte
    maturation, survival and ploidy.
  evidence:
  - reference: PMID:23863626
    reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that Nbeal2-knockout mice display the characteristics of human
      GPS, with defective α-granule biogenesis in MKs and their absence from
      platelets.
    explanation: >-
      The authors' statement of phenotypic correspondence to the human disease,
      which is what licenses using this model for the entry's nodes.
  modeled_mechanisms:
  - target: Failure of Alpha-Granule Cargo Packaging
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the core lesion — defective alpha-granule biogenesis in
      megakaryocytes with absence from platelets and loss of the specific cargo
      proteins depleted in patients.
    limitations: >-
      One documented species difference matters for interpretation: azurophilic
      neutrophil granules are preserved in human GPS but reduced in the mouse,
      so the model overstates the neutrophil granule phenotype. Attributed to the
      review rather than curated as evidence here, since no citable primary
      comparison was established during curation.
    readouts:
    - name: Platelet alpha-granule cargo content (VWF, thrombospondin-1, platelet factor 4)
      target: Failure of Alpha-Granule Cargo Packaging
      direction: DECREASED
      interpretation: >-
        Loss of the same cargo proteins depleted in patient platelets is the
        model's most direct correspondence to the human lesion.
      evidence:
      - reference: PMID:23861251
        reference_title: Abnormal megakaryocyte development and platelet function in Nbeal2(-/-) mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As in GPS, Nbeal2(-/-) mice exhibit splenomegaly, macrothrombocytopenia,
          and a deficiency of platelet α-granules and their cargo, including von
          Willebrand factor (VWF), thrombospondin-1, and platelet factor 4.
        explanation: >-
          Reports the measurement and direction, with the human comparison stated.
  - target: Macrothrombocytopenia and Impaired Platelet Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces both the count/size phenotype and the functional deficit, and
      supplies the in vivo thrombosis readout that establishes the deficit is
      haemostatically consequential rather than only detectable ex vivo.
    limitations: >-
      Murine bleeding assays and laser-induced arterial injury do not map onto
      the clinical bleeding phenotype (epistaxis, menorrhagia, post-procedural
      bleeding) in any quantitative way, so the model cannot be used to predict
      an individual patient's bleeding severity — which is also unpredictable
      from genotype in patients.
    readouts:
    - name: Arterial thrombus formation on intravital imaging
      target: Macrothrombocytopenia and Impaired Platelet Function
      direction: DECREASED
      interpretation: >-
        Defective thrombus formation in vivo confirms the ex vivo platelet
        function deficit has haemostatic consequence.
      evidence:
      - reference: PMID:23863626
        reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nbeal2-deficient platelets displayed impaired adhesion, aggregation, and
          coagulant activity ex vivo that translated into defective arterial
          thrombus formation and protection from thrombo-inflammatory brain
          infarction following focal cerebral ischemia.
        explanation: >-
          Reports the in vivo thrombosis readout and its ex vivo correlates.
differential_diagnoses:
- name: GFI1B-related thrombocytopenia
  description: >-
    A dominantly inherited disorder producing enlarged, granule-poor platelets
    that can look like GPS on a smear, but arising through a megakaryocyte
    transcription-factor defect rather than a granule-trafficking one.
  distinguishing_features:
  - >-
    Autosomal dominant rather than recessive, so the family history and the
    recurrence risk differ completely — the practical reason the distinction
    matters at the point of counselling.
  - >-
    The molecular lesion is in a transcription factor, so the mechanism is not
    the cargo-packaging failure this entry curates.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gray platelet syndrome (GPS) (OMIM #139090) is a rare autosomal
      recessive disorder characterized by moderate macrothrombocytopenia, marked
      decrease or absence of platelet alpha (α)-granules, which gives platelets a
      grayish appearance on the blood smear, and mild to moderate bleeding.1
    explanation: >-
      Establishes the recessive inheritance of GPS proper, which is the axis on
      which the dominant GFI1B disorder is separated from it.
- name: GATA1-related X-linked macrothrombocytopenia
  description: >-
    The GATA1 p.Arg216Gln disorder produces gray, agranular platelets in males
    and was historically called X-linked gray platelet syndrome, but affected
    individuals also have dyserythropoiesis and thalassemia-like red-cell
    changes, and several authors prefer to classify it as X-linked
    thrombocytopenia with thalassemia.
  distinguishing_features:
  - >-
    X-linked inheritance with male predominance, unlike the sex-independent
    recessive inheritance of NBEAL2-related GPS.
  - >-
    Accompanying red-cell abnormalities — dyserythropoiesis and a thalassemia-like
    picture — which have no counterpart in NBEAL2-related GPS.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gray platelet syndrome (GPS) (OMIM #139090) is a rare autosomal
      recessive disorder characterized by moderate macrothrombocytopenia, marked
      decrease or absence of platelet alpha (α)-granules, which gives platelets a
      grayish appearance on the blood smear, and mild to moderate bleeding.1
    explanation: >-
      Establishes the autosomal recessive inheritance of GPS proper, the axis that
      separates it from the X-linked GATA1 disorder.
discussions:
- discussion_id: gps_myelofibrosis_mechanism_unproven
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is marrow fibrosis in GPS actually caused by constitutive megakaryocyte
    release of fibrogenic cargo, or is that inference from the packaging defect?
  attaches_to:
  - pathophysiology#Progressive Myelofibrosis
  rationale: >-
    The leakage model is the consensus account and it is mechanistically
    natural, but the primary literature states plainly that the basis of the
    myelofibrosis remains unknown, and the fibrogenic-growth-factor step has not
    been demonstrated by direct marrow measurement in patients. The causal edge
    into this node is therefore recorded as having unknown intermediates. What
    would settle it is quantification of PDGF and TGF-beta in GPS marrow
    alongside fibrosis grade, or a fibrosis rescue in the knockout by blocking
    those factors.
- discussion_id: gps_ctla4_therapeutic_hypothesis
  kind: EMERGING_HYPOTHESIS
  prompt: >-
    Should CTLA-4-Ig be trialled for autoimmune complications of GPS, and in
    which patients?
  attaches_to:
  - pathophysiology#Reduced Effector T Cell CTLA-4 Expression
  rationale: >-
    The mechanistic case is unusually clean for an ultra-rare disease: NBEAL2
    binds CTLA-4, its loss lowers CTLA-4 on effector but not regulatory T cells,
    knockdown reproduces this in healthy T cells, and the closely related LRBA
    deficiency responds to CTLA-4-Ig. But no GPS patient has been reported
    treated this way, autoimmunity affects only a subset, and it is unknown
    whether CTLA-4 expression predicts who develops it. This is recorded as an
    emerging hypothesis with a licensed drug attached, not as a treatment.
- discussion_id: gps_mouse_neutrophil_granule_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Nbeal2 knockout mouse model the human neutrophil phenotype, given
    that azurophilic granules are preserved in patients but reduced in the
    mouse?
  attaches_to:
  - animal_models#Mouse
  rationale: >-
    The mouse reproduces the platelet lesion with high fidelity, which is why it
    carries the entry's model links. Its neutrophil phenotype is a different
    matter: azurophilic granules are described as preserved in human GPS but
    reduced in the knockout. Evidence therefore exists on both sides and
    disagrees, which makes this a translational-validity question rather than a
    gap — and it matters, because the innate-immune arm of GPS is exactly the
    part that the mouse is currently being used to study.
notes: >-
  Scope. This entry curates NBEAL2-related autosomal recessive gray platelet
  syndrome. The dominantly inherited GFI1B disorder and the X-linked GATA1
  p.Arg216Gln disorder produce a similar blood smear and are sometimes named as
  GPS variants; both are curated here as differential diagnoses rather than as
  subtypes, since their mechanisms and recurrence risks differ entirely. The
  deep-research preflight flagged GATA1 and GFI1B as rival genes in the report
  for this reason; those sections were excluded from the mechanism curation.

  Deliberate omissions. Several quantitative claims from the deep-research
  report are not curated because their sources resolved only to journal or PMC
  URLs, or because the report's own reference validation flagged the quote as
  unsupported: the 26% autoimmune-disease and 59% autoantibody-positivity
  figures, the 58% myelofibrosis rate and median age of 28.5 years, the median
  platelet count, the bleeding-severity distribution across the 1970s-2010s
  cohort, the zebrafish nbeal2 morpholino tail-bleeding percentage, the
  proinflammatory-megakaryocyte and metastasis-resistance mouse work, and the
  desmopressin and splenectomy management points. The qualitative claims each
  supports are curated where a verified quote from another source states them.

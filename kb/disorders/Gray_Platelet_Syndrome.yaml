name: Gray Platelet Syndrome
creation_date: '2026-08-25T00:00:00Z'
category: Mendelian
synonyms:
- GPS
- grey platelet syndrome
- platelet alpha-granule deficiency
- alpha-storage pool deficiency
description: >-
  Gray platelet syndrome is an autosomal recessive inherited platelet disorder
  caused by biallelic loss-of-function variants in NBEAL2. Megakaryocytes
  synthesize alpha-granule cargo normally but cannot pack or retain it, so
  platelets emerge large, vacuolated, and — because the purple-staining granule
  content is gone — gray on a stained smear. The consequences are a bleeding
  tendency out of proportion to the platelet count, since the platelets that are
  present are also functionally impaired.

  The disorder is unusual in that its most serious complications are not
  haemostatic. Cargo that cannot be packaged is instead released
  constitutively from megakaryocytes into the marrow, and chronic exposure of
  marrow stroma to fibrogenic and pro-inflammatory factors is the leading
  explanation for the progressive myelofibrosis and consequent splenomegaly
  that develop over decades. Long-term follow-up of the original cohort
  documented that progression, including fatal haemorrhage in some patients,
  and identified a high serum vitamin B12 as a consistent biochemical marker.

  A second surprise arrived with the international cohort: NBEAL2 is expressed
  across haematopoietic lineages, and its loss is not confined to the
  megakaryocyte-platelet axis. Neutrophils show reduced granule content and
  impaired extracellular trap formation, NK cells are reduced and degranulate
  poorly, and a substantial minority of patients carry autoimmune disease or
  autoantibodies. The mechanism for that last observation is now partly
  understood: NBEAL2 interacts with CTLA-4, and its loss lowers CTLA-4
  expression selectively in effector T cells while sparing regulatory T cells —
  which is what makes CTLA-4-Ig a rational, though untried, therapeutic
  hypothesis. GPS is therefore better described as a granule-biogenesis
  disorder of blood cells than as a platelet disease.

name: Gray Platelet Syndrome
creation_date: "2026-08-24T00:00:00Z"
category: Mendelian
parents:
- Inherited Platelet Disorder
- Bleeding Disorder
disease_term:
  preferred_term: gray platelet syndrome
  term:
    id: MONDO:0007686
    label: gray platelet syndrome
synonyms:
- GPS
- BDPLT4
- bleeding disorder, platelet-type, 4
- platelet alpha-granule deficiency
- alpha storage pool deficiency
description: >-
  Gray platelet syndrome is an autosomal recessive disorder in which biallelic
  loss of NBEAL2 leaves the megakaryocyte unable to pack its endogenously
  synthesized secretory proteins into developing alpha-granules. The platelets
  it releases are large and, lacking the granules that give a normal platelet
  its azurophilic speckling, appear grey on a peripheral smear - a disease named
  for an artefact of Romanowsky staining, and one that can be diagnosed by
  looking down a microscope at the right moment.

  The interesting thing about it is that the bleeding is not the whole disease
  and arguably not the worst of it. Alpha-granules are also the megakaryocyte's
  way of keeping growth factors out of the marrow, and when their cargo is
  released constitutively instead of being stored, the result is progressive
  marrow fibrosis and splenomegaly - a slowly worsening myelo-proliferative
  complication superimposed on a mostly mild-to-moderate bleeding tendency, with
  the thrombocytopenia deepening over decades and fatal haemorrhage reported at
  the end of long follow-up. Deep phenotyping of a 47-patient cohort then
  extended the disease further still: NBEAL2 turns out to matter for granules in
  neutrophils, monocytes and lymphocytes too, so patients carry an immune
  phenotype - reduced leukocyte counts, autoantibodies and autoimmune disease -
  that a platelet-centred account of the disorder entirely misses.
pathophysiology:
- name: Biallelic Loss of Function in NBEAL2
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Biallelic variants in NBEAL2, encoding a BEACH/ARM/WD40-domain protein of
    the family that includes LYST (defective in Chediak-Higashi syndrome), cause
    the disease. The mutational spectrum is broad - missense, nonsense,
    frameshift and splice - and severity does not track the type or location of
    the variant, so genotype is not prognostic. NBEAL2 localizes to the platelet
    dense tubular system (endoplasmic reticulum). Its BEACH-domain kinship with
    LYST is a mechanistic hint rather than a shared pathway: both are large
    vesicle-trafficking proteins whose precise cell-biological function remains
    unresolved.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that mutations in NBEAL2 (neurobeachin-like 2), which encodes a BEACH/ARM/WD40 domain protein, cause GPS and that megakaryocytes and platelets from individuals with GPS express a unique combination of NBEAL2 transcripts."
    explanation: >-
      The gene-discovery statement establishing NBEAL2 as causal and its domain
      architecture.
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the severity of coagulopathy, myelofibrosis and splenomegaly did not correlate with the type or location of the NBEAL2 mutation"
    explanation: >-
      Supports the statement that genotype does not predict severity, which is
      why this entry offers no variant-based prognostic guidance.
  downstream:
  - target: Failure of Megakaryocyte Alpha-Granule Biogenesis
    causal_link_type: DIRECT
    description: >-
      NBEAL2 acts at a late stage of alpha-granule biogenesis; without it the
      organelle is not built.
- name: Failure of Megakaryocyte Alpha-Granule Biogenesis
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The rate-limiting lesion, and a specific one: the megakaryocyte fails to
    pack the secretory proteins it makes itself into developing alpha-granules,
    while cargo taken up from plasma by endocytosis is much less affected. That
    asymmetry - endogenously synthesized platelet factor 4 and
    beta-thromboglobulin markedly reduced, endocytosed immunoglobulin and
    albumin relatively spared - is what localizes the defect to packaging rather
    than to synthesis or uptake. Rudimentary alpha-granule precursors are still
    present in both platelets and megakaryocytes, so this is a failure of
    granule maturation, not of granule initiation.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: platelet alpha granule organization
    term:
      id: GO:0070889
      label: platelet alpha granule organization
    modifier: DECREASED
  cellular_components:
  - preferred_term: platelet alpha granule
    term:
      id: GO:0031091
      label: platelet alpha granule
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In GPS, proteins synthesized in megakaryocytes are markedly reduced, while endocytosed α-granule constituents are less affected3. This suggests that GPS megakaryocytes fail to pack their endogeneously synthesized secretory proteins into developing α-granules."
    explanation: >-
      The observation and inference that localize the defect to packaging of
      endogenously synthesized cargo, which is the content of this node.
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although both platelets and megakaryocytes have rudimentary α-granule precursors10"
    explanation: >-
      Supports the maturation-not-initiation distinction drawn in this node.
  downstream:
  - target: Alpha-Granule-Deficient Platelets with Impaired Secretion
    causal_link_type: DIRECT
    description: >-
      Platelets released from these megakaryocytes carry no functional
      alpha-granule cargo.
  - target: Constitutive Marrow Release of Megakaryocyte Growth Factors
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cargo that cannot be packaged for regulated release is instead
      discharged into the marrow environment. The intermediate steps are
      proposed rather than demonstrated.
- name: Alpha-Granule-Deficient Platelets with Impaired Secretion
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    The circulating platelet is large and empty. Alpha-granule cargo that
    normally amplifies haemostasis on release - von Willebrand factor,
    thrombospondin-1, platelet factor 4, fibrinogen and adhesive and
    procoagulant proteins - is absent or grossly depleted, so an activated
    platelet cannot recruit and reinforce its neighbours. Adhesion and the
    integrin itself are intact; what is lost is the amplification step.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  cellular_components:
  - preferred_term: platelet alpha granule
    term:
      id: GO:0031091
      label: platelet alpha granule
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelet α-granules, the most abundant platelet organelles, store large proteins that, when released, promote platelet adhesiveness, haemostasis and wound healing1,2"
    explanation: >-
      Establishes what the missing organelle contributes to haemostasis, which
      is the basis of this node's causal claim.
  - reference: PMID:23861251
    reference_title: Abnormal megakaryocyte development and platelet function in Nbeal2(-/-) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a deficiency of platelet α-granules and their cargo, including von Willebrand factor (VWF), thrombospondin-1, and platelet factor 4"
    explanation: >-
      Names the specific depleted cargo listed in this node. MODEL_ORGANISM -
      the cargo inventory comes from the mouse; the human cohort data support
      the granule deficiency itself.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Loss of the secretory amplification step weakens the growing plug.
- name: Constitutive Marrow Release of Megakaryocyte Growth Factors
  role: amplifier
  biological_scale: TISSUE
  description: >-
    The mechanistic hypothesis for the marrow arm of the disease, and it is
    explicitly a hypothesis rather than a demonstrated pathway: cargo that
    cannot be stored is released constitutively from megakaryocytes into the
    bone marrow, where platelet-derived growth factor and other pro-fibrotic
    substances drive fibrosis. The gene-discovery paper states plainly that the
    basis of the myelofibrosis remains unknown, and that is the honest position
    for this node.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The basis of myelofibrosis remains unknown, but constitutive release of platelet-derived growth factor and other pro-fibrotic substances from megakaryocytes into the bone marrow may be involved5."
    explanation: >-
      PARTIAL because the source offers this as a hypothesis ("may be involved")
      while stating the mechanism is unknown; the node is curated at that
      strength deliberately.
  downstream:
  - target: Progressive Myelofibrosis and Splenomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The pathway from released growth factors to established marrow fibrosis
      is not established; at least one required intermediate is unknown.
- name: Progressive Myelofibrosis and Splenomegaly
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The arm that carries the long-term morbidity. Marrow fibrosis and
    splenomegaly are progressive over decades, deepening the thrombocytopenia,
    and long-term follow-up records fatal haemorrhage in some patients. This is
    why the disease should not be managed as a static mild bleeding tendency: it
    gets worse, and the mechanism that makes it worse is not the one that causes
    the bleeding.
  evidence:
  - reference: PMID:20709904
    reference_title: "Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term follow-up data demonstrated the progressive nature of the thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in some patients."
    explanation: >-
      The natural-history observation on which this node's progressive framing
      and its clinical implication rest.
- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    Both a qualitative and a quantitative deficit converge here: platelets that
    cannot amplify through secretion, and progressively fewer of them.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic defects of platelet function give rise to mucocutaneous bleeding of varying severity because platelets fail to fulfil their haemostatic role after vessel injury."
    explanation: >-
      Supports the convergence of a platelet-function defect onto failure of
      the haemostatic role and thence to mucocutaneous bleeding.
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: Failure of platelet-dependent primary hemostasis.
- name: Mucocutaneous Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >-
    Usually mild to moderate and infrequently severe - milder than Glanzmann
    thrombasthenia or Bernard-Soulier syndrome - which is part of why the
    disorder's marrow arm rather than its bleeding arm dominates long-term
    prognosis.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations of GPS are usually mild to moderate and infrequently severe6."
    explanation: >-
      Supports the severity characterization stated in this node.
- name: NBEAL2-Dependent Granule Defects in Leukocytes
  role: consequence
  biological_scale: CELLULAR
  description: >-
    The arm that a platelet-centred account of the disease misses entirely.
    Deep phenotyping of 47 patients found proteins depleted across platelets,
    neutrophils, monocytes and CD4 lymphocytes, enriched for granule
    constituents - so NBEAL2 serves granules across a wide range of blood cells,
    not only the megakaryocyte. Clinically this shows as reduced leukocyte
    counts and an excess of autoantibodies and autoimmune disease. Whether the
    immune abnormality is a consequence of the leukocyte granule defect or a
    parallel effect of NBEAL2 loss is not resolved; the cohort authors propose
    the former.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proteins less abundant in these cells were enriched for constituents of granules, supporting a role for Nbeal2 in the function of these organelles across a wide range of blood cells."
    explanation: >-
      The proteomic finding that extends the granule defect beyond the platelet
      lineage, which is the content of this node.
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel clinical phenotypes were also observed, including reduced leukocyte counts and increased presence of autoimmune disease and positive autoantibodies."
    explanation: >-
      Supports the clinical immune phenotype named here.

diagnosis:
- name: Blood Film Screening and Electron-Microscopic Confirmation
  description: >-
    A two-step route, and the first step is unusually cheap: platelets appear
    grey on a routine light-microscopic peripheral smear because they lack the
    granules that normally give them their azurophilic speckling. Confirmation
    is by electron microscopy showing absent or markedly reduced alpha-granules
    in both platelets and megakaryocytes. Elevated serum vitamin B12 is a
    useful adjunct because it is unexpected in a bleeding disorder.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis is confirmed by electron microscopy (EM) showing absent or markedly reduced α-granules in platelets8(Fig. 1c-d) and in megakaryocytes9"
    explanation: >-
      States the confirmatory modality and the cell types examined.
- name: Bleeding Severity Does Not Track Platelet Count or Function Tests
  description: >-
    A negative rule with direct management consequence: neither the platelet
    count nor functional test results predict how much a given patient will
    bleed, so laboratory values cannot be used to triage perioperative risk and
    a haemostatic plan has to be built for the individual.
  evidence:
  - reference: PMID:31710726
    reference_title: "Gray platelet syndrome: Management of perioperative bleeding in redo cardiac surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding intensity does not correlate with platelet count nor with functional test results."
    explanation: >-
      States the discordance directly.
biochemical:
- name: Elevated serum vitamin B12
  presence: Present
  frequency: FREQUENT
  notes: >-
    A consistent and diagnostically useful finding - first reported as novel in
    the 25-patient natural-history cohort and confirmed in the later 47-patient
    series - and useful precisely because it is unexpected in a bleeding
    disorder, so it discriminates this diagnosis from its storage pool
    siblings. Recorded here as a laboratory marker rather than as a phenotype
    because that is what it is; the HPO offers no term for an elevated
    circulating B12 concentration (only a directionally neutral parent and a
    "decreased" child), which is a noted ontology gap.
  evidence:
  - reference: PMID:20709904
    reference_title: "Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified high serum vitamin B(12) as a consistent, novel finding in GPS."
    explanation: >-
      Supports both the finding and its consistency across the cohort.
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated serum vitamin B12 levels"
    explanation: >-
      Independent confirmation of the marker in a second, larger cohort.
genetic:
- name: NBEAL2
  gene_term:
    preferred_term: NBEAL2
    term:
      id: hgnc:31928
      label: NBEAL2
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants cause the disorder. Patients with
    identity by descent are homozygous; those without are compound heterozygous.
    Severity does not track variant type or location, and interfamilial
    variability is documented for one and the same splice variant.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 14 affected individuals with identity by descent had homozygous mutations (Table 1) whereas those without identity by descent exhibited compound heterozygous mutations."
    explanation: >-
      Supports the zygosity pattern described in this gene block.

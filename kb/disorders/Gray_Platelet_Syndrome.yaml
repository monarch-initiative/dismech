  - reference: PMID:28783043
    reference_title: NBEAL2 is required for neutrophil and NK cell function and pathogen defense.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Phenotyping of Nbeal2-deficient neutrophils showed a severe reduction in

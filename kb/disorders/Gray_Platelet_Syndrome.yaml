- name: Constitutive Megakaryocyte Cargo Release into Marrow
  biological_scale: TISSUE
  description: >-
    Proteins that should be released only on platelet activation are instead
    released spontaneously from megakaryocytes into the marrow. The marrow
    stroma is therefore chronically exposed to factors it would normally see
    only transiently and locally at sites of vascular injury — among them
    platelet-derived growth factor and other pro-fibrotic substances.

inheritance:
- name: Autosomal recessive
  description: >-
    Classic GPS is autosomal recessive, with biallelic NBEAL2 variants —
    homozygous in about two thirds of pedigrees and compound heterozygous in
    the remainder. Heterozygous carriers may show a mild reduction in
    alpha-granule content without thrombocytopenia. Autosomal dominant
    (GFI1B) and X-linked (GATA1) disorders producing gray, agranular platelets
    exist but are distinct entities and are curated as differentials rather
    than as subtypes here.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of inheritance was autosomal recessive (AR) in 11 and
      indeterminate in 3 families.
    explanation: >-
      Establishes the recessive mode across the pedigree series that mapped the
      locus.
mechanistic_hypotheses:
- hypothesis_group_id: cargo_packaging_failure_model
  hypothesis_label: NBEAL2 loss as a failure of cargo packaging and retention, not of granule cargo synthesis
  status: CANONICAL
  description: >-
    The defect is downstream of synthesis. Megakaryocytes make alpha-granule
    proteins; what they cannot do is get them into, or keep them in, the
    developing granule. Two observations pin this down. Endogenously
    synthesized cargo (platelet factor 4, beta-thromboglobulin) is markedly
    reduced while endocytosed constituents are much less affected — exactly the
    asymmetry a packaging defect predicts and a synthesis defect does not. And
    in the mouse model, P-selectin is still present and externalized on
    activation and VPS33B/VPS16B levels are normal, placing NBEAL2 downstream of
    and independent from that trafficking axis, at a later stage of granule
    biogenesis.
  evidence:
  - reference: PMID:21765412
    reference_title: NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In GPS, proteins synthesized in megakaryocytes are markedly reduced, while
      endocytosed α-granule constituents are less affected3. This suggests that
      GPS megakaryocytes fail to pack their endogeneously synthesized secretory
      proteins into developing α-granules.
    explanation: >-
      The cargo-origin asymmetry that distinguishes a packaging failure from a
      synthesis failure.
  - reference: PMID:23861251
    reference_title: Abnormal megakaryocyte development and platelet function in Nbeal2(-/-) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The presence of P-selectin and normal levels of VPS33B and VPS16B in
      Nbeal2(-/-) platelets suggests that NBEAL2 acts independently of
      VPS33B/VPS16B at a later stage of α-granule biogenesis.
    explanation: >-
      Places NBEAL2's step in the pathway relative to a known trafficking axis,
      which is what makes this hypothesis specific.
- hypothesis_group_id: megakaryocyte_leakage_myelofibrosis_model
  hypothesis_label: Constitutive megakaryocyte cargo release into marrow stroma as the driver of myelofibrosis
  status: CANONICAL
  description: >-
    The best available explanation for the disorder's most consequential
    complication. Because cargo cannot be retained, proteins that should only
    be released on platelet activation are instead released constitutively from
    megakaryocytes into the marrow. Chronic exposure of stroma to fibrogenic
    growth factors — platelet-derived growth factor prominently — is the
    proposed route to progressive fibrosis, with splenomegaly following as
    compensatory extramedullary haematopoiesis. Curated as CANONICAL because it
    is the consensus account across the primary literature and the review, while
    noting that the basis of the myelofibrosis has been explicitly described as
    unknown and the growth-factor step is inference from the packaging defect
    rather than a demonstrated marrow measurement in patients.
  evidence:
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteins normally only released upon platelet activation are spontaneously
      released from MKs; most likely because of the lack of α-granules3.
    explanation: >-
      States the constitutive megakaryocyte release that this hypothesis makes
      the driver of marrow fibrosis.
  - reference: PMID:21765412
    reference_title: NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The basis of myelofibrosis remains unknown, but constitutive release of
      platelet-derived growth factor and other pro-fibrotic substances from
      megakaryocytes into the bone marrow may be involved5.
    explanation: >-
      Gives the hypothesis in the authors' own hedged form, which is the
      epistemic status this entry preserves rather than overstating.
- hypothesis_group_id: pan_leukocyte_granule_defect_model
  hypothesis_label: NBEAL2 as a general granule-biogenesis factor across blood lineages, with CTLA-4 mislocalization causing autoimmunity
  status: CANONICAL
  description: >-
    GPS is not confined to platelets. Proteomic comparison across GPS
    platelets, neutrophils, monocytes, and CD4 lymphocytes found that the
    proteins depleted in each are enriched for granule constituents — one
    molecular defect expressed in four lineages. The autoimmune arm has its own
    mechanism: NBEAL2 co-immunoprecipitates with CTLA-4, and NBEAL2 deficiency
    lowers CTLA-4 expression in patient effector T cells while sparing
    regulatory T cells, with knockdown in healthy T cells reproducing the
    finding. The parallel with LRBA — the same BEACH-domain family, autoimmunity
    through defective CTLA-4 trafficking — is what makes this more than a
    correlation.
  evidence:
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteins less abundant in these cells were enriched for constituents of
      granules, supporting a role for Nbeal2 in the function of these organelles
      across a wide range of blood cells.
    explanation: >-
      The proteomic result that generalizes the granule defect beyond the
      megakaryocyte-platelet axis.
  - reference: PMID:37349339
    reference_title: NBEAL2 deficiency in humans leads to low CTLA-4 expression in activated conventional T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, NBEAL2 deficiency leads to low CTLA-4 expression in
      patient-derived effector T cells, while their regulatory T cells appear
      unaffected.
    explanation: >-
      The selective checkpoint defect that supplies a mechanism for the
      autoimmune phenotype.
  - reference: PMID:37349339
    reference_title: NBEAL2 deficiency in humans leads to low CTLA-4 expression in activated conventional T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knocking-down NBEAL2 in healthy primary T cells recapitulates the low CTLA-4
      expression observed in the T cells of GPS patients.
    explanation: >-
      The manipulation that rules out the low CTLA-4 being a consequence of
      chronic disease rather than of NBEAL2 loss.
pathophysiology:
- name: NBEAL2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in NBEAL2, a 54-exon gene on 3p21
    encoding a 2754-amino-acid BEACH-domain scaffolding protein. The variant
    spectrum is broad — 86 different variants across 69 pedigrees, mostly
    private, comprising frameshift, nonsense, missense, splicing and small
    indels scattered along the gene — and no genotype-phenotype correlation has
    been demonstrated, either by mutation type or by position. That absence is
    itself informative: it argues the phenotype reflects loss of a single
    function rather than graded residual activity.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21765413
    reference_title: Mutations in NBEAL2, encoding a BEACH protein, cause gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic DNA sequencing confirmed mutations in NBEAL2 as the genetic cause of
      GPS.
    explanation: >-
      Establishes NBEAL2 as causal, from one of the three independent 2011
      discovery papers.
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-six different NBEAL2 variants have been detected in 69 GPS pedigrees
      described to date, harbouring homozygous (65%) or compound heterozygous
      (35%) mutations.
    explanation: >-
      Quantifies the allelic heterogeneity and zygosity distribution recorded in
      this node.
  downstream:
  - target: Failure of Alpha-Granule Cargo Packaging
    causal_link_type: DIRECT
    hypothesis_groups:
    - cargo_packaging_failure_model
    description: >-
      NBEAL2 acts within megakaryocytes at a late stage of alpha-granule
      biogenesis; its loss is the direct cause of the packaging failure.
  - target: Leukocyte Granule Deficiency
    causal_link_type: DIRECT
    hypothesis_groups:
    - pan_leukocyte_granule_defect_model
    description: >-
      NBEAL2 is expressed in neutrophils, monocytes and NK cells as well as
      megakaryocytes, so the same lesion produces granule deficits in those
      lineages directly rather than as a consequence of the platelet defect.
  - target: Reduced Effector T Cell CTLA-4 Expression
    causal_link_type: DIRECT
    hypothesis_groups:
    - pan_leukocyte_granule_defect_model
    description: >-
      NBEAL2 interacts with CTLA-4 directly by co-immunoprecipitation, and
      knockdown in healthy T cells reproduces the low expression.
- name: Failure of Alpha-Granule Cargo Packaging
  biological_scale: CELLULAR
  description: >-
    Megakaryocytes and platelets retain only rudimentary alpha-granule
    precursors. Endogenously synthesized cargo — platelet factor 4, von
    Willebrand factor, thrombospondin-1 — is markedly depleted, while
    endocytosed constituents are less affected, and dense granules, lysosomes,
    mitochondria and peroxisomes are preserved. That selectivity is what makes
    GPS an isolated alpha-storage pool disease rather than a general organelle
    defect.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  cellular_components:
  - preferred_term: platelet alpha granule
    term:
      id: GO:0031091
      label: platelet alpha granule
  biological_processes:
  - preferred_term: platelet alpha granule organization
    term:
      id: GO:0070889
      label: platelet alpha granule organization
    modifier: DECREASED
  evidence:
  - reference: PMID:21765413
    reference_title: Mutations in NBEAL2, encoding a BEACH protein, cause gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPS is characterized by variable thrombocytopenia and large platelets that
      lack α-granules but have normal dense (δ) granules, lysosomes, mitochondria
      and peroxisomes1.
    explanation: >-
      Establishes the selectivity of the defect for alpha-granules, which is the
      defining feature of this node.
  - reference: PMID:23861251
    reference_title: Abnormal megakaryocyte development and platelet function in Nbeal2(-/-) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As in GPS, Nbeal2(-/-) mice exhibit splenomegaly, macrothrombocytopenia, and
      a deficiency of platelet α-granules and their cargo, including von
      Willebrand factor (VWF), thrombospondin-1, and platelet factor 4.
    explanation: >-
      Names the specific depleted cargo proteins, reproduced in the knockout.
  downstream:
  - target: Macrothrombocytopenia and Impaired Platelet Function
    causal_link_type: DIRECT
    hypothesis_groups:
    - cargo_packaging_failure_model
    description: >-
      Absent granule cargo impairs adhesion, aggregation and coagulant activity,
      and abnormal granule formation disrupts megakaryocyte development and
      platelet production.
  - target: Constitutive Megakaryocyte Cargo Release into Marrow
    causal_link_type: DIRECT
    hypothesis_groups:
    - megakaryocyte_leakage_myelofibrosis_model
    description: >-
      Cargo that cannot be retained in the granule is released instead, which is
      the same lesion viewed from the marrow's side.
- name: Constitutive Megakaryocyte Cargo Release into Marrow
  biological_scale: TISSUE
  description: >-
    Proteins that should be released only on platelet activation are instead
    released spontaneously from megakaryocytes into the marrow. The marrow
    stroma is therefore chronically exposed to factors it would normally see
    only transiently and locally at sites of vascular injury — among them
    platelet-derived growth factor and other pro-fibrotic substances.
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteins normally only released upon platelet activation are spontaneously
      released from MKs; most likely because of the lack of α-granules3.
    explanation: >-
      Directly states the constitutive release this node describes.
  downstream:
  - target: Progressive Myelofibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - megakaryocyte_leakage_myelofibrosis_model
    description: >-
      The step from chronic stromal exposure to established fibrosis is the
      proposed but unproven part of the model; the primary literature states
      explicitly that the basis of myelofibrosis remains unknown, so the edge is
      recorded with its intermediates unknown.
- name: Macrothrombocytopenia and Impaired Platelet Function
  biological_scale: ORGANISM
  description: >-
    Platelets are reduced in number and enlarged, and — because the granule
    cargo needed for a robust platelet plug is missing — they function poorly
    at counts that would not normally cause bleeding. Median platelet count in
    the 47-patient international cohort era is moderate rather than profound
    thrombocytopenia, which is precisely why the functional deficit matters:
    the bleeding is disproportionate to the count. Impaired adhesion,
    aggregation and coagulant activity were demonstrated directly in the mouse
    model, together with defective arterial thrombus formation.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  evidence:
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the α-granule protein cargo is essential to the development of a
      robust platelet plug, GPS cases are symptomatic at platelet count levels
      that are typically not associated with bleeding.
    explanation: >-
      States the disproportion between count and bleeding that defines this node.
  - reference: PMID:23863626
    reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nbeal2-deficient platelets displayed impaired adhesion, aggregation, and
      coagulant activity ex vivo that translated into defective arterial thrombus
      formation and protection from thrombo-inflammatory brain infarction
      following focal cerebral ischemia.
    explanation: >-
      Direct functional measurement of the platelet deficit and its in vivo
      consequence.
- name: Progressive Myelofibrosis
  biological_scale: TISSUE
  description: >-
    Reticulin and collagen fibrosis of the marrow, developing over years to
    decades rather than being present from birth. It is the principal
    determinant of long-term morbidity, driving splenomegaly through
    compensatory extramedullary haematopoiesis and, in advanced disease,
    pancytopenia. Long-term follow-up established that the thrombocytopenia and
    the fibrosis are both progressive, and that the disorder can be fatal.
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term follow-up data demonstrated the progressive nature of the
      thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in
      some patients.
    explanation: >-
      Establishes both the progressive character of the fibrosis and that the
      disorder is not uniformly benign.
  downstream:
  - target: Splenomegaly and Extramedullary Haematopoiesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - megakaryocyte_leakage_myelofibrosis_model
    description: >-
      As fibrosis displaces marrow haematopoiesis, the spleen takes it up and
      enlarges.
- name: Splenomegaly and Extramedullary Haematopoiesis
  biological_scale: ORGANISM
  description: >-
    Splenic enlargement, understood as compensatory extramedullary
    haematopoiesis in a marrow progressively replaced by fibrosis. It is a
    consistent feature of the human syndrome and is reproduced in the mouse
    knockout. Splenectomy improves but does not correct the platelet count, so
    it is not a routine recommendation.
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPS is associated with a bleeding tendency, myelofibrosis, and splenomegaly.
    explanation: >-
      Establishes splenomegaly as a defining component of the syndrome alongside
      the fibrosis that drives it.
- name: Leukocyte Granule Deficiency
  biological_scale: CELLULAR
  description: >-
    The same biogenesis defect expressed outside the megakaryocyte lineage.
    Neutrophils show reduced specific and gelatinase granule content with
    elevated circulating granule proteins — the signature of inappropriate
    release rather than failed synthesis — and impaired extracellular trap
    formation; NK cells are reduced in number and degranulate poorly. Clinically
    this manifests as low leukocyte counts and a modest excess of mild
    infections rather than severe immunodeficiency.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
    modifier: DECREASED
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low leukocyte counts, decreased neutrophil granulation and impaired
      neutrophil extracellular trap formation represent prominent findings in GPS
      patients, reflecting deranged innate immunity and associated with an
      increased susceptibility to infection.
    explanation: >-
      Reports the neutrophil granule and NET deficits and their clinical
      correlate.
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were widespread differences in the transcriptome and proteome of GPS
      platelets, neutrophils, monocytes, and CD4 lymphocytes.
    explanation: >-
      Establishes that the molecular disturbance spans four blood lineages rather
      than being platelet-restricted.
- name: Reduced Effector T Cell CTLA-4 Expression
  biological_scale: MOLECULAR
  description: >-
    NBEAL2 associates with CTLA-4 in primary T cells, and its loss lowers CTLA-4
    expression in patient effector T cells while leaving regulatory T cells
    apparently unaffected — a selectivity that matters, since it removes a brake
    from the effector compartment specifically. The mechanism has a close
    precedent in LRBA, a BEACH-domain relative whose recessive loss causes
    autoimmunity through defective CTLA-4 trafficking.
  cell_types:
  - preferred_term: effector T cell
    term:
      id: CL:0000911
      label: effector T cell
  evidence:
  - reference: PMID:37349339
    reference_title: NBEAL2 deficiency in humans leads to low CTLA-4 expression in activated conventional T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigating the potential association between NBEAL2 and CTLA-4 signalling
      suggested by the mass spectrometry results, we confirm by
      co-immunoprecipitation that CTLA-4 and NBEAL2 interact with each other.
    explanation: >-
      The physical interaction underpinning this node.
  downstream:
  - target: Autoimmunity and Autoantibody Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pan_leukocyte_granule_defect_model
    description: >-
      Loss of an inhibitory checkpoint on effector T cells is the proposed route
      to the clinical autoimmunity, by analogy with LRBA deficiency; the step
      has not been demonstrated end to end in GPS patients.
- name: Autoimmunity and Autoantibody Production
  biological_scale: ORGANISM
  description: >-
    A quarter of patients in the international cohort carried a diagnosed
    autoimmune disease and a majority tested positive for autoantibodies, with
    a plasma proteome shifted toward inflammation and immune response. This is
    the newest face of GPS and the reason the disorder is now framed as an
    immune as well as a haemostatic disease.
  evidence:
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel clinical phenotypes were also observed, including reduced leukocyte
      counts and increased presence of autoimmune disease and positive
      autoantibodies.
    explanation: >-
      Establishes the autoimmune phenotype as a cohort-level finding rather than
      a case-report curiosity.
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, our data show that, in addition to the well-described platelet
      defects in GPS, there are immune defects. The abnormal immune cells may be
      the drivers of systemic abnormalities such as autoimmune disease.
    explanation: >-
      The authors' framing of immune dysfunction as a second axis of the disease,
      which this entry adopts.

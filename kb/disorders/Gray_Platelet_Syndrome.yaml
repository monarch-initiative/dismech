    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low leukocyte counts, decreased neutrophil granulation and impaired
      neutrophil extracellular trap formation represent prominent findings in GPS
      patients, reflecting deranged innate immunity and associated with an
      increased susceptibility to infection.
    explanation: >-

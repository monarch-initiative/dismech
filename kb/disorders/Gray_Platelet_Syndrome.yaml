      displayed normal abundance of specific granules, suggesting intact granule
      biosynthesis during granulopoiesis but lack of retention or premature
      exocytosis of specific granules during egress from the bone marrow or in
      the bloodstream.
    explanation: >-
      Distinguishes failed retention from failed synthesis in patient
      neutrophils — the same distinction the megakaryocyte arm of this entry
      rests on, reached independently in a different lineage.
  downstream:
  - target: phenotypes#Increased susceptibility to infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pan_leukocyte_granule_defect_model
    description: >-
      Reduced granule content and blunted NET formation are the proposed route to
      the modest excess of mild infection seen in patients; the mouse shows a
      much stronger version of the same link, with increased susceptibility to
      Staphylococcus aureus and murine CMV.
- name: Reduced Effector T Cell CTLA-4 Expression
  biological_scale: MOLECULAR
  description: >-
    NBEAL2 associates with CTLA-4 in primary T cells, and its loss lowers CTLA-4
    expression in patient effector T cells while leaving regulatory T cells
    apparently unaffected — a selectivity that matters, since it removes a brake
    from the effector compartment specifically. The mechanism has a close
    precedent in LRBA, a BEACH-domain relative whose recessive loss causes
    autoimmunity through defective CTLA-4 trafficking.
  cell_types:
  - preferred_term: effector T cell
    term:
      id: CL:0000911
      label: effector T cell
  evidence:
  - reference: PMID:37349339
    reference_title: NBEAL2 deficiency in humans leads to low CTLA-4 expression in activated conventional T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigating the potential association between NBEAL2 and CTLA-4 signalling
      suggested by the mass spectrometry results, we confirm by
      co-immunoprecipitation that CTLA-4 and NBEAL2 interact with each other.
    explanation: >-
      The physical interaction underpinning this node.
  downstream:
  - target: Autoimmunity and Autoantibody Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pan_leukocyte_granule_defect_model
    description: >-
      Loss of an inhibitory checkpoint on effector T cells is the proposed route
      to the clinical autoimmunity, by analogy with LRBA deficiency; the step
      has not been demonstrated end to end in GPS patients.
- name: Autoimmunity and Autoantibody Production
  biological_scale: ORGANISM
  description: >-
    A quarter of patients in the international cohort carried a diagnosed
    autoimmune disease and a majority tested positive for autoantibodies, with
    a plasma proteome shifted toward inflammation and immune response. This is
    the newest face of GPS and the reason the disorder is now framed as an
    immune as well as a haemostatic disease.
  evidence:
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel clinical phenotypes were also observed, including reduced leukocyte
      counts and increased presence of autoimmune disease and positive
      autoantibodies.
    explanation: >-
      Establishes the autoimmune phenotype as a cohort-level finding rather than
      a case-report curiosity.
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, our data show that, in addition to the well-described platelet
      defects in GPS, there are immune defects. The abnormal immune cells may be
      the drivers of systemic abnormalities such as autoimmune disease.
    explanation: >-
      The authors' framing of immune dysfunction as a second axis of the disease,
      which this entry adopts.
phenotypes:
- category: Hematologic
  name: Absence of platelet alpha-granules
  description: >-
    The defining diagnostic finding, and the one the disorder is named for:
    platelets lack alpha-granules, which is why they appear grey on a routine
    May-Grunwald-Giemsa smear and why electron microscopy is confirmatory.
  phenotype_term:
    preferred_term: Absence of alpha granules
    term:
      id: HP:0012526
      label: Absence of alpha granules
  frequency: OBLIGATE
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis is confirmed by electron microscopy (EM) showing absent or markedly reduced α-granules in platelets8(Fig. 1c-d) and in megakaryocytes9"
    explanation: >-
      Supports the phenotype and its OBLIGATE frequency - it is the confirmatory
      diagnostic criterion, so no diagnosed patient lacks it.
- category: Hematologic
  name: Macrothrombocytopenia
  description: >-
    Reduced platelet count with enlarged platelets — moderate rather than
    profound thrombocytopenia, but accompanied by a functional defect, so
    bleeding occurs at counts that would otherwise be safe.
  phenotype_term:
    preferred_term: Macrothrombocytopenia
    term:
      id: HP:0040185
      label: Macrothrombocytopenia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GPS patient cohort exhibited known phenotypes, including
      macrothrombocytopenia, BM fibrosis, megakaryocyte emperipolesis of
      neutrophils, splenomegaly, and elevated serum vitamin B12 levels.
    explanation: >-
      Ascertains macrothrombocytopenia as a known phenotype present in the
      47-patient cohort, supporting the VERY_FREQUENT band for a defining
      feature of the syndrome.
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombocytopenia is a universal feature of GPS, being of moderate degree in
      most patients. In a recent study performed by Sims et al, which included
      the largest GPS cohort gathered to date, comprising 47 patients belonging
      to 38 pedigrees recruited worldwide, median platelet count was 57 (28–105)
      x 109/L.
    explanation: >-
      Supports the VERY_FREQUENT band directly ("universal") and quantifies the
      degree, which is what makes the disproportion between count and bleeding a
      meaningful claim.
- category: Hematologic
  name: Bleeding tendency
  description: >-
    Easy bruising, epistaxis, prolonged post-surgical and post-dental bleeding,
    and menorrhagia; intracranial haemorrhage is uncommon but occurs, and
    fatal haemorrhage was documented on long-term follow-up. Severity is
    variable and unpredictable from genotype.
  phenotype_term:
    preferred_term: Bruising susceptibility
    term:
      id: HP:0000978
      label: Bruising susceptibility
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most GPS patients are treated symptomatically, according to the severity of
      bleeding manifestations. Patients may bleed spontaneously or secondary to
      surgical intervention, childbirth or trauma.
    explanation: >-
      Supports treating the bleeding tendency as a near-universal feature that
      varies in severity rather than in presence, which is the VERY_FREQUENT
      band.
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPS is associated with a bleeding tendency, myelofibrosis, and splenomegaly.
    explanation: >-
      Establishes the bleeding tendency as a defining feature of the syndrome.
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gray platelet syndrome (GPS) is a predominantly recessive platelet disorder
      that is characterized by mild thrombocytopenia with large platelets and a
      paucity of α-granules; these abnormalities cause mostly moderate but in rare
      cases severe bleeding.
    explanation: >-
      Gives the severity distribution — mostly moderate, rarely severe — recorded
      in this phenotype's description.
- category: Hematologic
  name: Bone marrow fibrosis
  description: >-
    Reticulin and collagen marrow fibrosis, absent early and accumulating over
    years to decades. It is the phenotype that converts GPS from a manageable
    bleeding disorder into a progressive haematological disease.
  phenotype_term:
    preferred_term: Myelofibrosis
    term:
      id: HP:0011974
      label: Myelofibrosis
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a recent study, myelofibrosis was found in 58% of patients at a median
      age of 28.5 years (range, 10–52 years).
    explanation: >-
      Supports the FREQUENT band (30-79%) and gives the age distribution that
      makes this a delayed rather than a congenital feature.
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term follow-up data demonstrated the progressive nature of the
      thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in
      some patients.
    explanation: >-
      Supports both the phenotype and the PROGRESSIVE clinical course assigned to
      it.
- category: Hematologic
  name: Splenomegaly
  description: >-
    Splenic enlargement secondary to marrow fibrosis and compensatory
    extramedullary haematopoiesis, occasionally severe enough to raise the
    question of splenectomy.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
  evidence:
  - reference: PMID:32693407
    reference_title: Novel manifestations of immune dysregulation and granule defects in gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GPS patient cohort exhibited known phenotypes, including
      macrothrombocytopenia, BM fibrosis, megakaryocyte emperipolesis of
      neutrophils, splenomegaly, and elevated serum vitamin B12 levels.
    explanation: >-
      Ascertains splenomegaly in the international cohort.
- category: Hematologic
  name: Autoimmunity
  description: >-
    Diagnosed autoimmune disease in a substantial minority — thyroiditis,
    rheumatoid arthritis, discoid lupus, vitiligo, alopecia among them — with
    autoantibody positivity in a majority. Its mechanism is the CTLA-4 node,
    which makes this a phenotype with a candidate targeted therapy rather than
    an incidental association.
  phenotype_term:
    preferred_term: Autoimmunity
    term:
      id: HP:0002960
      label: Autoimmunity
  frequency: FREQUENT
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune manifestations and/or autoantibodies (AutoAb) are present in
      around half of GPS patients, coupled to upregulation of immune response
      markers in CD4+ cells.
    explanation: >-
      Supports the FREQUENT band (30-79%) for the combined
      autoimmunity/autoantibody phenotype.
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune diseases involving different organs and a spectrum of
      autoantibodies are present in a substantial proportion of GPS patients,
      expanding the syndromic spectrum of this disorder and pointing to
      dysregulation of the adaptive immune response.
    explanation: >-
      Establishes the autoimmune phenotype and its interpretation as adaptive
      immune dysregulation.
- category: Hematologic
  name: Elevated serum vitamin B12
  description: >-
    A near-universal and otherwise unexplained biochemical finding, identified
    as a novel and consistent marker on long-term follow-up of the original
    cohort. It is diagnostically useful precisely because it is not something
    one would predict from a platelet granule defect.
  phenotype_term:
    preferred_term: Elevated circulating vitamin B12 concentration
    term:
      id: HP:6000016
      label: Elevated circulating vitamin B12 concentration
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified high serum vitamin B(12) as a consistent, novel finding in
      GPS.
    explanation: >-
      The primary report of this marker as a consistent feature.
- category: Immunologic
  name: Increased susceptibility to infection
  description: >-
    A modest excess of mild infection — upper respiratory infections, otitis
    media — attributable to reduced neutrophil granule content, impaired NET
    formation, and NK-cell dysfunction. Severe infection is not characteristic,
    which is why this is curated as susceptibility rather than as an
    immunodeficiency.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recently reported to affect 17% of GPS patients in the large international
      cohort
    explanation: >-
      Supports the OCCASIONAL band (5-29%) for infection susceptibility in
      patients.
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low leukocyte counts, decreased neutrophil granulation and impaired
      neutrophil extracellular trap formation represent prominent findings in GPS
      patients, reflecting deranged innate immunity and associated with an
      increased susceptibility to infection.
    explanation: >-
      Links the innate-immune granule defects to the infection susceptibility
      recorded here.
genetic:
- name: NBEAL2
  gene_term:
    preferred_term: NBEAL2
    term:
      id: hgnc:31928
      label: NBEAL2
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21765412
    reference_title: NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that mutations in NBEAL2 (neurobeachin-like 2), which encodes a
      BEACH/ARM/WD40 domain protein, cause GPS and that megakaryocytes and
      platelets from individuals with GPS express a unique combination of NBEAL2
      transcripts.
    explanation: >-
      Direct statement of causation from one of the three independent 2011
      discovery papers.
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No genotype-phenotype correlation has been demonstrated, either regarding
      the type of mutation or its location.
    explanation: >-
      Records the absence of genotype-phenotype correlation, which constrains what
      genetic testing can predict clinically.
  notes: >-
    Heterozygous carriers may show a mild reduction in alpha-granule content
    without thrombocytopenia, so carrier status is not silent at the cellular
    level even though it is clinically silent.
biochemical:
- name: Serum vitamin B12
  notes: >-
    Characteristically elevated, in most patients well above the local upper
    reference limit. The mechanism is not established; increased transcobalamin
    release or turnover has been proposed. Useful as an ancillary diagnostic
    clue rather than as a disease-activity measure.
  biomarker_term:
    preferred_term: Serum vitamin B12 measurement
    term:
      id: NCIT:C64817
      label: Vitamin B12 Measurement
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified high serum vitamin B(12) as a consistent, novel finding in
      GPS.
    explanation: >-
      The primary evidence for this marker's consistency in GPS.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. The scale is best conveyed by pedigree counts rather than a
    population rate: 86 NBEAL2 variants across 69 pedigrees had been described
    by the time of the 2021 review, and the largest single cohort comprised 47
    patients. No incidence estimate exists.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-six different NBEAL2 variants have been detected in 69 GPS pedigrees
      described to date, harbouring homozygous (65%) or compound heterozygous
      (35%) mutations.
    explanation: >-
      The pedigree count that stands in for a prevalence estimate in a disorder
      too rare for one.
progression:
- phase: Bleeding-disorder phase
  notes: >-
    Macrothrombocytopenia and bleeding tendency are present from early life and
    are relatively stable; presentation is usually in infancy or childhood.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical clinical features include macrothrombocytopenia, bleeding and
      elevated vitamin B12 levels, while bone marrow fibrosis and splenomegaly
      may develop during disease progression.
    explanation: >-
      Separates the early stable features from the later progressive ones, which
      is the distinction these two phases record.
- phase: Fibrotic phase
  notes: >-
    Marrow fibrosis and splenomegaly develop later and progress, with
    pancytopenia possible in advanced disease. This biphasic course is why
    lifelong surveillance is warranted even in patients whose bleeding is mild.
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term follow-up data demonstrated the progressive nature of the
      thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in
      some patients.
    explanation: >-
      Establishes the progressive character of this phase and its potential
      lethality.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Most patients have mild to moderate bleeding needing no specific treatment,
    which argues for a moderate rather than high assessment. Against that: the
    fibrotic phase is progressive and can end in marrow failure, fatal
    haemorrhage was documented on long-term follow-up, and the immune arm adds
    autoimmune disease in a quarter of patients. The burden is therefore
    moderate on average and materially higher in the subset that progresses.
  evidence:
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these abnormalities cause mostly moderate but in rare cases severe bleeding
    explanation: >-
      The bleeding-severity distribution underpinning the moderate assessment.
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term follow-up data demonstrated the progressive nature of the
      thrombocytopenia and myelofibrosis of GPS resulting in fatal hemorrhages in
      some patients.
    explanation: >-
      The counterweight that keeps this from being scored as a low-burden
      disorder.
diagnosis:
- name: Peripheral blood smear and electron microscopy
  description: >-
    Large, pale gray platelets on a stained smear are the diagnostic clue that
    names the disease; transmission electron microscopy showing absent or
    markedly reduced alpha-granules with preserved dense granules is the
    structural confirmation, and it is that contrast — alpha absent, dense
    preserved — that distinguishes GPS from the combined storage pool defects.
  evidence:
  - reference: PMID:21765412
    reference_title: NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPS platelets are large and appear gray on light microscopy (Fig. 1a-b)5-7;
      the diagnosis is confirmed by electron microscopy (EM) showing absent or
      markedly reduced α-granules in platelets8(Fig. 1c-d) and in megakaryocytes9,
      although both platelets and megakaryocytes have rudimentary α-granule
      precursors10.
    explanation: >-
      States the diagnostic sequence and the ultrastructural finding that confirms
      it.
- name: NBEAL2 sequencing
  description: >-
    Molecular confirmation, by targeted NBEAL2 sequencing when the phenotype is
    characteristic or by an inherited-platelet-disorder gene panel or exome when
    it is not. Because most variants are private and scattered across 54 exons,
    full-gene rather than hotspot analysis is required, and a normal panel does
    not exclude the diagnosis if the smear and electron microscopy are typical.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic diagnosis may be approached by Sanger sequencing of the NBEAL2 gene,
      when the diagnosis of GPS is suspected based on the phenotypic features, or
      by high-throughput sequencing, including gene panels for inherited platelet
      disorders19 or whole-exome sequencing.
    explanation: >-
      Describes the testing strategy recorded in this entry.
- name: Bleeding severity does not track platelet count or function tests
  description: >-
    A negative rule with direct management consequence: neither the platelet
    count nor functional test results predict how much a given patient will
    bleed, so laboratory values cannot be used to triage perioperative risk and
    a haemostatic plan has to be built for the individual.
  evidence:
  - reference: PMID:31710726
    reference_title: "Gray platelet syndrome: Management of perioperative bleeding in redo cardiac surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding intensity does not correlate with platelet count nor with functional test results."
    explanation: >-
      States the discordance directly, in a perioperative-management report.
treatments:
- name: Platelet transfusion
  description: >-
    The mainstay for active haemorrhage and for procedural cover. Because the
    need is lifelong, HLA-matched donor platelets are preferred where available
    to limit alloimmunization. It replaces the missing functional platelets
    rather than correcting anything upstream.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Macrothrombocytopenia and Impaired Platelet Function
    treatment_effect: BYPASSES
    description: >-
      Transfused normal platelets supply the granule cargo and function the
      patient's own platelets lack, without altering the underlying defect —
      which is why the effect lasts only as long as the transfused platelets do.
    evidence:
    - reference: PMID:21765411
      reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Since the α-granule protein cargo is essential to the development of a
        robust platelet plug, GPS cases are symptomatic at platelet count levels
        that are typically not associated with bleeding.
      explanation: >-
        Establishes that the deficit being bypassed is functional cargo, not
        merely platelet number.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-specific hemostatic measures, such as anti-fibrinolytics, local
      hemostatic measures, avoidance of non-steroidal anti-inflammatory drugs
      and/or platelet transfusions are usually adopted to prevent or reduce
      excessive bleeding.
    explanation: >-
      Names platelet transfusion among the standard haemostatic measures in GPS.
  notes: >-
    No controlled trial or GPS-specific outcome data exists for transfusion; the
    evidence attached is a review statement of standard practice, not an
    efficacy result.
- name: Haematopoietic stem cell transplantation
  description: >-
    The only reported curative option, and the only treatment in this entry that
    acts on the disease rather than on its consequences: transplantation
    replaces the NBEAL2-deficient haematopoietic compartment. It has been
    achieved in a GPS patient with severe myelofibrosis and pancytopenia, with
    full haematopoietic recovery and resolution of the marrow fibrosis — which
    is also the strongest available evidence that the fibrosis is driven by the
    haematopoietic cells rather than by an intrinsic stromal defect. It is
    curated as an option for selected patients with a severe course, not as
    standard care: the evidence is a single reported patient.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Progressive Myelofibrosis
    treatment_effect: RESTORES
    description: >-
      Replacing the NBEAL2-deficient megakaryocyte compartment removes the
      source of the constitutive cargo release proposed to drive fibrosis; the
      reported resolution of marrow fibrosis after transplant is the closest
      thing to a test of that mechanism in a patient.
    evidence:
    - reference: PMID:34408521
      reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Successful hematopoietic stem cell transplantation has been achieved in a
        GPS patient with severe myelofibrosis and pancytopenia, with full
        hematopoietic recovery and resolution of bone marrow fibrosis.
      explanation: >-
        Reports both the clinical outcome and the resolution of the fibrosis that
        this mechanism link asserts.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On this basis, stem cell transplantation may represent a curative treatment
      option for selected patients who experience a severe clinical course.
    explanation: >-
      The review's own hedged recommendation, which is the strength this entry
      curates it at — a single patient, not a series.
- name: Antifibrinolytic therapy
  description: >-
    Antifibrinolytics such as tranexamic acid are used to prevent or reduce
    bleeding, including around surgery and dental procedures. They stabilize
    the clot that the patient's granule-deficient platelets form poorly, rather
    than correcting the platelet defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-specific hemostatic measures, such as anti-fibrinolytics, local
      hemostatic measures, avoidance of non-steroidal anti-inflammatory drugs
      and/or platelet transfusions are usually adopted to prevent or reduce
      excessive bleeding.
    explanation: >-
      Names antifibrinolytics among the standard haemostatic measures in GPS.
      The specific agent is not named by the source; tranexamic acid is bound
      here as the representative of the class.
- name: Local haemostatic measures and avoidance of NSAIDs
  description: >-
    Local haemostatic measures for bleeding episodes, and avoidance of
    non-steroidal anti-inflammatory drugs, which add an acquired platelet
    function defect to the inherited one the patient already has. Curated
    separately from antifibrinolytic therapy because it is procedural and
    avoidance advice rather than a drug — the NSAID half is a genuine
    agents-to-avoid item, which the schema has no dedicated slot for.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-specific hemostatic measures, such as anti-fibrinolytics, local
      hemostatic measures, avoidance of non-steroidal anti-inflammatory drugs
      and/or platelet transfusions are usually adopted to prevent or reduce
      excessive bleeding.
    explanation: >-
      Names local haemostatic measures and NSAID avoidance among the standard
      measures adopted in GPS.
- name: Thrombopoietin receptor agonists (cautioned, not recommended)
  description: >-
    Curated as a caution rather than as a therapy. Eltrombopag raises platelet
    counts in several other inherited platelet disorders, which makes it an
    obvious thing to try here; its efficacy and safety in GPS are unknown, and
    because these agents may promote marrow fibrosis they collide directly with
    the complication that already defines this disease's long-term course. The
    entry records it so the reasoning is visible rather than leaving the
    apparent gap unexplained.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The efficacy and safety of thrombopoietin receptor agonists in GPS remains
      unknown.
    explanation: >-
      States the absence of evidence, which is the reason this is curated as a
      caution rather than as a treatment.
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering that these agents may promote bone marrow fibrosis, their use
      in GPS should be viewed with caution, especially if long-term treatment is
      considered.
    explanation: >-
      The disease-specific mechanistic reason for the caution: the drug class's
      known effect coincides with this disease's defining complication.
- name: Splenectomy
  description: >-
    Performed in some patients for symptomatic splenomegaly. It produces at most
    a mild rise in platelet count and does not restore it, which is consistent
    with the entry's model of the thrombocytopenia: the falling count tracks
    marrow fibrosis rather than splenic sequestration, and removing the spleen
    therefore does not fix it.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with this notion, splenectomy may lead to mild increase but not
      complete restoration of platelet counts.
    explanation: >-
      The limited effect, and the reasoning that makes it informative about where
      the thrombocytopenia comes from.
- name: Genetic counselling
  description: >-
    Recurrence risk is 25% for future pregnancies of carrier parents, and once
    a family's variants are known, carrier and prenatal testing become
    available. Counselling must also address the genetically distinct
    dominant (GFI1B) and X-linked (GATA1) disorders that produce a similar
    smear, since the recurrence risk differs entirely.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20709904
    reference_title: 'Gray platelet syndrome: natural history of a large patient cohort and locus assignment to chromosome 3p.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of inheritance was autosomal recessive (AR) in 11 and
      indeterminate in 3 families.
    explanation: >-
      The inheritance mode that determines the recurrence risk counselling rests
      on.
animal_models:
- name: Nbeal2 knockout mouse
  species: Mouse
  genotype: Nbeal2-/-
  publication: PMID:23863626
  description: >-
    The principal model, independently generated by more than one group with
    concordant results — including a spontaneous 8 bp Nbeal2 deletion found
    incidentally in an unrelated mutagenesis screen, which reproduces the same
    phenotype and so was not shaped by anyone's expectation of it. It
    reproduces the human syndrome closely —
    splenomegaly, macrothrombocytopenia, absent platelet alpha-granules and
    their cargo — and adds the functional measurements that cannot be made in
    patients: impaired adhesion, aggregation and coagulant activity translating
    into defective arterial thrombus formation, and abnormal megakaryocyte
    maturation, survival and ploidy.
  evidence:
  - reference: PMID:23863626
    reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that Nbeal2-knockout mice display the characteristics of human
      GPS, with defective α-granule biogenesis in MKs and their absence from
      platelets.
    explanation: >-
      The authors' statement of phenotypic correspondence to the human disease,
      which is what licenses using this model for the entry's nodes.
  - reference: PMID:26950939
    reference_title: Spontaneous 8bp Deletion in Nbeal2 Recapitulates the Gray Platelet Syndrome in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice homozygous for the Nbeal2 8 bp deletion (Nbeal2gps/gps) exhibit a
      phenotype similar to human GPS, with significantly reduced platelet counts
      compared to littermate controls (p = 1.63 x 10-7).
    explanation: >-
      An independently arising allele reproducing the phenotype, which is what
      supports the "more than one group, concordant results" claim in the
      description.
  modeled_mechanisms:
  - target: Failure of Alpha-Granule Cargo Packaging
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the core lesion — defective alpha-granule biogenesis in
      megakaryocytes with absence from platelets and loss of the specific cargo
      proteins depleted in patients.
    limitations: >-
      One documented species difference matters for interpretation: azurophilic
      neutrophil granules are preserved in human GPS but reduced in the mouse,
      so the model overstates the neutrophil granule phenotype. Attributed to the
      review rather than curated as evidence here, since no citable primary
      comparison was established during curation.
    readouts:
    - name: Platelet alpha-granule cargo content (VWF, thrombospondin-1, platelet factor 4)
      target: Failure of Alpha-Granule Cargo Packaging
      direction: DECREASED
      interpretation: >-
        Loss of the same cargo proteins depleted in patient platelets is the
        model's most direct correspondence to the human lesion.
      evidence:
      - reference: PMID:23861251
        reference_title: Abnormal megakaryocyte development and platelet function in Nbeal2(-/-) mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As in GPS, Nbeal2(-/-) mice exhibit splenomegaly, macrothrombocytopenia,
          and a deficiency of platelet α-granules and their cargo, including von
          Willebrand factor (VWF), thrombospondin-1, and platelet factor 4.
        explanation: >-
          Reports the measurement and direction, with the human comparison stated.
  - target: Leukocyte Granule Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the leukocyte arm — severe reduction in neutrophil granule
      content and dysfunctional NK cells with reduced degranulation — and
      supplies the infection-challenge data that cannot be obtained in patients.
    limitations: >-
      The reduction spans all neutrophil granule subsets in the mouse, whereas
      azurophilic granules are preserved in patients, so the model overstates the
      human neutrophil phenotype. The infection phenotype is also more severe:
      Nbeal2-deficient mice are susceptible to Staphylococcus aureus and murine
      CMV, while patients report mild respiratory infections rather than severe
      ones. NK involvement in human GPS is unestablished, so that half of the
      link is model-only.
    readouts:
    - name: Neutrophil granule content across subsets
      target: Leukocyte Granule Deficiency
      direction: DECREASED
      interpretation: >-
        Granule depletion in a second lineage supports NBEAL2 acting as a general
        granule-biogenesis factor rather than a megakaryocyte-specific one.
      evidence:
      - reference: PMID:28783043
        reference_title: NBEAL2 is required for neutrophil and NK cell function and pathogen defense.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Phenotyping of Nbeal2-deficient neutrophils showed a severe reduction in
          granule contents across all granule subsets.
        explanation: >-
          Reports the measurement and its direction, including the "all subsets"
          scope that diverges from the human phenotype.
    - name: NK cell degranulation
      target: Leukocyte Granule Deficiency
      direction: DECREASED
      interpretation: >-
        Impaired NK degranulation is the second lymphoid readout, and the one
        with no established human counterpart.
      evidence:
      - reference: PMID:28783043
        reference_title: NBEAL2 is required for neutrophil and NK cell function and pathogen defense.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nbeal2-deficient NK cells were also dysfunctional and showed reduced
          degranulation.
        explanation: >-
          Reports the NK functional deficit measured in the model.
  - target: Macrothrombocytopenia and Impaired Platelet Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces both the count/size phenotype and the functional deficit, and
      supplies the in vivo thrombosis readout that establishes the deficit is
      haemostatically consequential rather than only detectable ex vivo.
    limitations: >-
      Murine bleeding assays and laser-induced arterial injury do not map onto
      the clinical bleeding phenotype (epistaxis, menorrhagia, post-procedural
      bleeding) in any quantitative way, so the model cannot be used to predict
      an individual patient's bleeding severity — which is also unpredictable
      from genotype in patients.
    readouts:
    - name: Arterial thrombus formation on intravital imaging
      target: Macrothrombocytopenia and Impaired Platelet Function
      direction: DECREASED
      interpretation: >-
        Defective thrombus formation in vivo confirms the ex vivo platelet
        function deficit has haemostatic consequence.
      evidence:
      - reference: PMID:23863626
        reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nbeal2-deficient platelets displayed impaired adhesion, aggregation, and
          coagulant activity ex vivo that translated into defective arterial
          thrombus formation and protection from thrombo-inflammatory brain
          infarction following focal cerebral ischemia.
        explanation: >-
          Reports the in vivo thrombosis readout and its ex vivo correlates.
differential_diagnoses:
- name: Chediak-Higashi Syndrome
  description: >-
    Caused by loss of LYST, another BEACH-domain vesicle-trafficking protein,
    and likewise a disorder of granule formation - but the affected organelles
    are lysosome-related (dense granules, cytotoxic granules, melanosomes),
    giving immunodeficiency, haemophagocytic lymphohistiocytosis and partial
    albinism with enlarged rather than absent granules. The domain kinship is
    real and is the reason the two are discussed together; the disease is not
    the same.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another such protein is CHS1, which is defective in Chediak-Higashi disease (CHD, OMIM #214500), a disorder of immunodeficiency, platelet dense granule defects, partial albinism, and enlarged lysosomes or lysosome-related organelles in hematopoietic cells and melanocytes4,15."
    explanation: >-
      States the shared protein family and the phenotypic differences that
      separate the two disorders.
- name: Dense-Granule Storage Pool Disease and Combined Alpha-Delta SPD
  description: >-
    The storage pool diseases divide by which granule is lost. Isolated
    dense-granule deficiency (including the Hermansky-Pudlak and
    Chediak-Higashi syndromes) and combined alpha-delta deficiency are
    distinguished from this disorder by electron microscopy, not by the
    bleeding pattern.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bleeding disorders arising from defective platelet granules constitute the platelet storage pool diseases (SPD) and include isolated δ -granule deficiency (delta-SPD), combined α and δ -SPD and isolated α -granule deficiency (GPS; OMIM #139090)3,4,6."
    explanation: >-
      Sets out the storage pool disease classification that positions this
      disorder against its siblings.
- name: ARC Syndrome (VPS33B/VIPAS39)
  description: >-
    Also produces defective alpha-granule biogenesis, but through the
    VPS33B/VPS16B machinery acting earlier in the pathway, and with
    arthrogryposis, renal dysfunction and cholestasis dominating the phenotype.
    The distinction matters mechanistically as well as clinically: it is what
    places NBEAL2's step late in biogenesis.
  evidence:
  - reference: PMID:21781244
    reference_title: Advances in our understanding of the molecular basis of disorders of platelet function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects of α-granule biosynthesis also involve germline VPS33B mutations in the ARC (arthrogryposis, renal dysfunction and cholestasis) syndrome."
    explanation: >-
      Establishes the other genetic route to alpha-granule deficiency and the
      syndromic features that separate it.
- name: GFI1B-related thrombocytopenia
  disease_term:
    preferred_term: platelet-type bleeding disorder 17
    term:
      id: MONDO:0008553
      label: platelet-type bleeding disorder 17
  description: >-
    A dominantly inherited disorder producing enlarged, granule-poor platelets
    that can look like GPS on a smear, but arising through a megakaryocyte
    transcription-factor defect rather than a granule-trafficking one. Curated
    in this repository as MONDO:0008553.
  distinguishing_features:
  - >-
    Autosomal dominant rather than recessive, so the family history and the
    recurrence risk differ completely — the practical reason the distinction
    matters at the point of counselling.
  - >-
    The molecular lesion is in a transcription factor, so the mechanism is not
    the cargo-packaging failure this entry curates.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gray platelet syndrome (GPS) (OMIM #139090) is a rare autosomal
      recessive disorder characterized by moderate macrothrombocytopenia, marked
      decrease or absence of platelet alpha (α)-granules, which gives platelets a
      grayish appearance on the blood smear, and mild to moderate bleeding.1
    explanation: >-
      Supports the GPS side of the contrast — autosomal recessive inheritance —
      against which the dominant GFI1B disorder is distinguished. The
      distinguishing features of the GFI1B disorder itself are stated from the
      differential's own MONDO identity rather than from this quote.
- name: GATA1-related X-linked macrothrombocytopenia
  disease_term:
    preferred_term: beta-thalassemia-X-linked thrombocytopenia syndrome
    term:
      id: MONDO:0010745
      label: beta-thalassemia-X-linked thrombocytopenia syndrome
  description: >-
    The GATA1 p.Arg216Gln disorder produces gray, agranular platelets in males
    and was historically called X-linked gray platelet syndrome, but affected
    individuals also have dyserythropoiesis and thalassemia-like red-cell
    changes, and several authors prefer to classify it as X-linked
    thrombocytopenia with thalassemia.
  distinguishing_features:
  - >-
    X-linked inheritance with male predominance, unlike the sex-independent
    recessive inheritance of NBEAL2-related GPS.
  - >-
    Accompanying red-cell abnormalities — dyserythropoiesis and a thalassemia-like
    picture — which have no counterpart in NBEAL2-related GPS.
  evidence:
  - reference: PMID:34408521
    reference_title: 'A Deep Dive into the Pathology of Gray Platelet Syndrome: New Insights on Immune Dysregulation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gray platelet syndrome (GPS) (OMIM #139090) is a rare autosomal
      recessive disorder characterized by moderate macrothrombocytopenia, marked
      decrease or absence of platelet alpha (α)-granules, which gives platelets a
      grayish appearance on the blood smear, and mild to moderate bleeding.1
    explanation: >-
      Supports the GPS side of the contrast — autosomal recessive inheritance —
      against which the X-linked GATA1 disorder is distinguished. The
      dyserythropoietic features of that disorder are stated from its own MONDO
      identity (beta-thalassemia-X-linked thrombocytopenia syndrome) rather than
      from this quote.
discussions:
- discussion_id: gps_nbeal2_molecular_function_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of NBEAL2 function mechanistically cause defective
    alpha-granule biogenesis?
  attaches_to:
  - pathophysiology#Failure of Alpha-Granule Cargo Packaging
  rationale: >-
    The causal gene has been known since 2011 and the step it acts at has been
    bracketed - late in biogenesis, downstream of VPS33B/VPS16B - but the
    molecular function itself remains unstated. Its predicted interactors,
    WDFY3 and through it LYST, rest entirely on computational prediction, a
    limitation the gene-discovery paper states explicitly. This is a gap in
    molecular mechanism rather than in disease-gene assignment, and it is why
    the cargo-packaging node is necessarily described phenomenologically rather
    than as a pathway.
  proposed_experiments:
  - experiment_id: exp_nbeal2_interactome
    name: Proximity-labelling interactome of NBEAL2 in human megakaryocytes
    description: >-
      Use proximity-dependent biotinylation of tagged NBEAL2 in iPSC-derived
      human megakaryocytes to identify physical interactors at the dense tubular
      system, and test the predicted WDFY3 interaction directly. Replacing
      computationally predicted partners with measured ones is the prerequisite
      for any mechanistic model of the packaging step.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "How absence of NBEAL2 function in megakaryocytes results in defective α-granule biogenesis remains unknown."
    explanation: >-
      The source's own statement of the gap.
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "These protein-protein interactions are entirely based on computational predictions; future experiments will determine their accuracy."
    explanation: >-
      Supports the caveat that the proposed interactome is unmeasured, which is
      what the proposed experiment addresses. COMPUTATIONAL because the
      interactome being described is network inference without wet-lab
      confirmation - which is the entire point of the item, so any other
      evidence_source would contradict the claim it exists to make.
- discussion_id: gps_myelofibrosis_mechanism_unproven
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is marrow fibrosis in GPS actually caused by constitutive megakaryocyte
    release of fibrogenic cargo, or is that inference from the packaging defect?
  attaches_to:
  - pathophysiology#Progressive Myelofibrosis
  rationale: >-
    The leakage model is the consensus account and it is mechanistically
    natural, but the primary literature states plainly that the basis of the
    myelofibrosis remains unknown, and the fibrogenic-growth-factor step has not
    been demonstrated by direct marrow measurement in patients. The causal edge
    into this node is therefore recorded as having unknown intermediates. What
    would settle it is quantification of PDGF and TGF-beta in GPS marrow
    alongside fibrosis grade, or a fibrosis rescue in the knockout by blocking
    those factors.

    Two further points bear on why this has stayed open. First, a second,
    non-exclusive candidate exists and is rarely stated alongside the leakage
    model: microarray data in GPS fibroblasts showed overexpression of
    fibronectin, which is essential for proplatelet formation and critical for
    megakaryocyte-matrix interaction - a matrix mechanism rather than a
    cargo-release one. The two predict different things about whether
    suppressing megakaryocyte output would slow the fibrosis. Second, the
    obstacle is concrete rather than merely one of priority: the fibrotic marrow
    itself prevented the gene-discovery authors from harvesting enough
    megakaryocytes to culture, and megakaryocytes are the only cell type that
    expresses the packaging defect. That is why the mouse, which reproduces the
    splenomegaly and granule phenotype, is the natural system in which to test a
    hypothesis human tissue has resisted.
  evidence:
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our previous microarray data in GPS fibroblasts showed overexpression of fibronectin11, essential for proplatelet formation in cultured megakaryocytes12 and critical for megakaryocyte-matrix interactions13."
    explanation: >-
      Supports the second, matrix-based candidate mechanism named in this gap,
      which the consensus leakage model does not subsume. IN_VITRO because the
      measurement is a microarray on cultured patient fibroblasts, not an
      observation in patients.
  - reference: PMID:21765412
    reference_title: "NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet α-granules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fibrotic nature of the GPS bone marrow prevented us from obtaining sufficient bone marrow for ex-vivo expansion of GPS megakaryocytes, the only cell type that expresses the GPS phenotype of defective α-granule biogenesis."
    explanation: >-
      Documents the specific methodological obstacle that has kept this gap
      open, and why a model system rather than patient tissue is the tractable
      route.
- discussion_id: gps_ctla4_therapeutic_hypothesis
  kind: EMERGING_HYPOTHESIS
  prompt: >-
    Should CTLA-4-Ig be trialled for autoimmune complications of GPS, and in
    which patients?
  attaches_to:
  - pathophysiology#Reduced Effector T Cell CTLA-4 Expression
  rationale: >-
    The mechanistic case is unusually clean for an ultra-rare disease: NBEAL2
    binds CTLA-4, its loss lowers CTLA-4 on effector but not regulatory T cells,
    knockdown reproduces this in healthy T cells, and the closely related LRBA
    deficiency responds to CTLA-4-Ig. But no GPS patient has been reported
    treated this way, autoimmunity affects only a subset, and it is unknown
    whether CTLA-4 expression predicts who develops it. This is recorded as an
    emerging hypothesis with a licensed drug attached, not as a treatment.
- discussion_id: gps_mouse_neutrophil_granule_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Nbeal2 knockout mouse model the human neutrophil phenotype, given
    that azurophilic granules are preserved in patients but reduced in the
    mouse?
  attaches_to:
  - animal_models#Nbeal2 knockout mouse
  rationale: >-
    The mouse reproduces the platelet lesion with high fidelity, which is why it
    carries the entry's model links. Its neutrophil phenotype is a different
    matter: azurophilic granules are described as preserved in human GPS but
    reduced in the knockout. Evidence therefore exists on both sides and
    disagrees, which makes this a translational-validity question rather than a
    gap — and it matters, because the innate-immune arm of GPS is exactly the
    part that the mouse is currently being used to study.
notes: >-
  Scope. This entry curates NBEAL2-related autosomal recessive gray platelet
  syndrome. The dominantly inherited GFI1B disorder and the X-linked GATA1
  p.Arg216Gln disorder produce a similar blood smear and are sometimes named as
  GPS variants; both are curated here as differential diagnoses rather than as
  subtypes, since their mechanisms and recurrence risks differ entirely. The
  deep-research preflight flagged GATA1 and GFI1B as rival genes in the report
  for this reason; those sections were excluded from the mechanism curation.

  Deliberate omissions, corrected. An earlier revision listed several
  quantitative claims as uncurated for want of a citable source. That was partly
  a misreading of this PR's own cache: `references_cache/PMID_34408521.md` is
  stored as full text, not as an abstract, and its Management section and body
  contain quotable statements of most of those claims. Now curated from it: the
  58% myelofibrosis rate at a median age of 28.5 years, the "around half" figure
  for autoimmunity/autoantibodies, the 17% infection-susceptibility figure, the
  median platelet count of 57 x 10^9/L, the splenectomy result, haematopoietic
  stem cell transplantation, the antifibrinolytic/NSAID-avoidance measures, and
  the thrombopoietin-receptor-agonist caution. Read a cached reference's
  `content_type` before deciding what it can support.

  What remains uncurated: the report's own reference validation flagged four
  quotes as unsupported, and none of those quoted strings is used anywhere in
  this entry. The zebrafish morpholino tail-bleeding percentage and the
  proinflammatory-megakaryocyte/metastasis-resistance mouse work still have no
  citable cached source and are not curated; the desmopressin management point
  likewise rests only on non-citable sources, so it is absent while the
  haemostatic measures that the review does state are curated.

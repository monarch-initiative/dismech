- name: Macrothrombocytopenia and Impaired Platelet Function
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    Platelets are reduced in number and enlarged, and — because the granule
    cargo needed for a robust platelet plug is missing — they function poorly
    at counts that would not normally cause bleeding. Median platelet count in
    the 47-patient international cohort era is moderate rather than profound
    thrombocytopenia, which is precisely why the functional deficit matters:
    the bleeding is disproportionate to the count. Impaired adhesion,
    aggregation and coagulant activity were demonstrated directly in the mouse
    model, together with defective arterial thrombus formation.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  evidence:
  - reference: PMID:21765411
    reference_title: Exome sequencing identifies NBEAL2 as the causative gene for gray platelet syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the α-granule protein cargo is essential to the development of a
      robust platelet plug, GPS cases are symptomatic at platelet count levels
      that are typically not associated with bleeding.
    explanation: >-
      States the disproportion between count and bleeding that defines this node.
  - reference: PMID:23863626
    reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nbeal2-deficient platelets displayed impaired adhesion, aggregation, and
      coagulant activity ex vivo that translated into defective arterial thrombus
      formation and protection from thrombo-inflammatory brain infarction
      following focal cerebral ischemia.
    explanation: >-
      Direct functional measurement of the platelet deficit and its in vivo
      consequence.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Too few platelets, and those that circulate cannot amplify haemostasis by
      secretion, so the plug fails to form or consolidate at the site of injury.

  - reference: PMID:34980182
    reference_title: "The immunosenescence-related factor DOCK11 is involved in secondary immune responses of B cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The lack of DOCK11 in B cells resulted in the impaired induction of antibody-producing cells upon secondary immunization with protein antigen."
    explanation: The functional humoral consequence of DOCK11 loss in B cells.
  downstream:

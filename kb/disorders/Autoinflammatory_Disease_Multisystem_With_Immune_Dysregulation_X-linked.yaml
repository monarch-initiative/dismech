    manifestation, reported in every published patient series. The individual
    lineages affected - Coombs-positive haemolytic anaemia, immune
    thrombocytopenia and autoimmune neutropenia - are recorded in the OMIM
    clinical synopsis for this disease but are not named in any abstract that
    can be quoted here, so this entry binds the finding at the level its

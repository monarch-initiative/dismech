pathophysiology:
- name: Hemizygous DOCK11 Loss-of-Function Allele
  biological_scale: MOLECULAR
  description: >-
    A single DOCK11 allele on the male X chromosome, either truncating or
    missense. There is no second copy to compensate, so the allele's effect on
    protein is the cell's whole DOCK11 complement.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: DOCK11
    term:
      id: hgnc:23483
      label: DOCK11
  evidence:
  - reference: PMID:37342957
    reference_title: "Systemic Inflammation and Normocytic Anemia in DOCK11 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Germline hemizygous loss-of-function mutations affecting the actin regulator DOCK11 were shown to cause a previously unknown inborn error of hematopoiesis and immunity characterized by severe immune dysregulation and systemic inflammation, recurrent infections, and anemia."
    explanation: Establishes the germline hemizygous loss-of-function lesion as the cause.
  downstream:
  - target: Reduced or Absent DOCK11 Protein
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37342957
      reference_title: "Systemic Inflammation and Normocytic Anemia in DOCK11 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We identified rare, X-linked germline mutations in DOCK11 in the patients, leading to a loss of protein expression in two patients and impaired CDC42 activation in all four patients."
      explanation: The allele is shown to reduce protein expression in patient cells, which is the step this edge asserts.
- name: Reduced or Absent DOCK11 Protein
  biological_scale: MOLECULAR
  description: >-
    Truncating alleles abolish the protein; missense alleles lower its
    steady-state level. Both converge on the same functional deficit, which is
    why the two allele classes differ in which clinical arm dominates rather
    than in mechanism.
  evidence:
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We studied 8 male patients, from 7 unrelated families, with hemizygous DOCK11 missense variants leading to reduced DOCK11 expression."
    explanation: Reduced steady-state DOCK11 protein measured in the missense cohort.
  downstream:
  - target: Failure of CDC42 Nucleotide Exchange
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37342957
      reference_title: "Systemic Inflammation and Normocytic Anemia in DOCK11 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "We identified rare, X-linked germline mutations in DOCK11 in the patients, leading to a loss of protein expression in two patients and impaired CDC42 activation in all four patients."
      explanation: Loss of protein and impaired CDC42 activation are measured in the same patients, which is the step from protein level to exchange failure.
- name: Failure of CDC42 Nucleotide Exchange
  biological_scale: MOLECULAR
  description: >-
    DOCK11's catalytic DOCKER (DHR-2) domain loads GTP onto CDC42, and it does
    so for CDC42 specifically rather than for the related GTPases TC10 and TCL.
    Patient cells show impaired CDC42 activation whichever allele class they
    carry.
  molecular_functions:
  - preferred_term: CDC42 guanyl-nucleotide exchange factor activity
    modifier: DECREASED
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  evidence:
  - reference: PMID:15710388
    reference_title: "Zizimin2: a novel, DOCK180-related Cdc42 guanine nucleotide exchange factor expressed predominantly in lymphocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Zizimin2 and zizimin1 have similar primary structures and both proteins bound and activated Cdc42 but not the Cdc42-related proteins TC10 or TCL."
    explanation: Establishes that DOCK11 (zizimin2) is a CDC42-specific exchange factor, which is what makes CDC42 the relevant target of the lesion.
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients' platelets exhibited abnormal ultrastructural morphology and spreading as well as impaired CDC42 activity."
    explanation: Impaired CDC42 activity measured directly in patient cells.
  downstream:
  - target: Collapse of the CDC42-GTP Positive Feedback Loop
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42837459
      reference_title: "Structural basis for membrane-dependent positive feedback regulation of DOCK11 by activated Cdc42."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "binding of activated Cdc42 is critical for enhancing the membrane-dependent nucleotide exchange activity of DOCK11, promoting its localization to the plasma membrane, and facilitating intracellular activation of Cdc42"
      explanation: >-
        The feedback loop is demonstrated for wild-type DOCK11, so that failed
        exchange prevents its ignition follows by inference rather than by direct
        measurement in patient alleles.
  - target: Failure of Filopodium Assembly and Confined Migration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22494997
      reference_title: "Age-related guanine nucleotide exchange factor, mouse Zizimin2, induces filopodia in bone marrow-derived dendritic cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Zizimin2 is an immune-related and age-regulated guanine nucleotide exchange factor, which facilitates filopodial formation through activation of Cdc42, which results in activation of cell migration"
      explanation: Establishes the exchange-to-filopodium-to-migration step for DOCK11 acting through CDC42.
- name: Collapse of the CDC42-GTP Positive Feedback Loop
  biological_scale: MOLECULAR
  description: >-
    Four cryo-EM structures of full-length human DOCK11 show that activated
    CDC42 engages a distal armadillo-repeat site separate from the catalytic
    domain, driving DOCK11 to the plasma membrane and raising its exchange rate.
    DOCK11 is therefore a switch with gain, and below a threshold the loop does
    not ignite at all. This is the structural reason a missense allele that only
    reduces protein can cause disease as severe as a null allele.
  molecular_functions:
  - preferred_term: CDC42 binding at the distal armadillo-repeat site
    modifier: DECREASED
    term:
      id: GO:0031267
      label: small GTPase binding
  evidence:
  - reference: PMID:42837459
    reference_title: "Structural basis for membrane-dependent positive feedback regulation of DOCK11 by activated Cdc42."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DOCK11 predominantly adopts a U-shaped dimer that binds to nucleotide-free Cdc42 via the catalytic domain, whereas activated Cdc42 engages a distal site within the armadillo-repeat domain."
    explanation: The two-site architecture that makes the feedback loop possible.
  downstream:
  - target: Failure of Filopodium Assembly and Confined Migration
    causal_link_type: DIRECT

    quote_role: PRIMARY_RESULT
    snippet: "we also observed abnormal regulatory T-cell (Treg) phenotype with profoundly reduced FOXP3 and IKZF2 expression"
    explanation: The Treg identity defect measured in patient cells.
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."

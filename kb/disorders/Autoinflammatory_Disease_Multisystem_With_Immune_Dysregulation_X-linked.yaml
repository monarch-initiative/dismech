    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The results revealed that Ziz2 KO mice had a higher percentage of early bone marrow B cells (Fraction A), but a reduced fraction of marginal zone (MZ) B cells."

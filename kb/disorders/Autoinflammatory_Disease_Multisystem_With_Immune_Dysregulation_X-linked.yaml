    causal_link_type: DIRECT
- name: Erythroid Morphogenesis Defect
  biological_scale: CELLULAR
  description: >-
    A dock11-knockout zebrafish reproduces both the anaemia and the abnormal red
    cell morphology seen in patients, and the anaemia is rescued by ectopic
    expression of constitutively active CDC42, which places the defect
    downstream of failed CDC42 activation. The cell-intrinsic mechanism in human
    erythroblasts has not been established.

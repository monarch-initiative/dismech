name: Autoinflammatory Disease Multisystem With Immune Dysregulation X-linked
creation_date: "2026-11-19T03:30:00Z"
category: Mendelian
synonyms:
- ADMIDX
- DOCK11 deficiency
- X-linked actinopathy with autoimmunity
- autoinflammatory disease, multisystem, with immune dysregulation, X-linked
description: >-
  An X-linked recessive inborn error of immunity caused by hemizygous
  loss-of-function variants in DOCK11, which encodes an atypical guanine
  nucleotide exchange factor that loads GTP onto the Rho GTPase CDC42. It
  belongs to the actinopathies, the group of inborn errors in which a defect in
  an actin-cytoskeleton regulator produces immunodeficiency, autoinflammation
  and autoimmunity together rather than any one of them alone.

  The lesion is a failure of nucleotide exchange. Patient cells show impaired
  CDC42 activation whether the allele abolishes DOCK11 protein or merely reduces
  it, and the cellular consequence is cytoskeletal: patient T cells do not form
  filopodia and migrate abnormally through confined channels. Four cryo-EM
  structures of full-length human DOCK11 show why reduced protein is as damaging
  as none, in that activated CDC42 binds a distal armadillo-repeat site and
  thereby raises the exchange activity of the catalytic domain, so DOCK11 is a
  feedback switch rather than a linear enzyme.

  From that single cytoskeletal failure the disease fans out along lineage
  branches that are separately demonstrated. Patient and Dock11-knockout mouse T
  cells are overtly activated and produce proinflammatory cytokines with
  increased NFATc1 nuclear translocation, which is the autoinflammatory arm.
  Regulatory T cells lose FOXP3 and IKZF2 expression and IL-2-driven STAT5B
  phosphorylation is impaired, which is the autoantibody arm. Mouse Dock11
  knockouts fail to form splenic marginal zone B cells and mount impaired
  secondary humoral responses, which is the antibody-deficiency arm. A
  dock11-knockout zebrafish reproduces the anaemia and the abnormal red cell
  morphology, and the anaemia is rescued by constitutively active CDC42.

  Allele class, not gene identity, predicts which arm dominates. On
  re-evaluation of every published patient, alleles that abolish DOCK11
  expression track with autoinflammation and recurrent pneumonia while missense
  alleles that only reduce protein track with autoantibody-driven autoimmunity.
  That correlation is the basis of the two subtypes recorded here and of the two
  disease concepts MONDO files beneath this term; it rests on thirteen patients
  and should be read as a prognostic hypothesis rather than a settled rule.

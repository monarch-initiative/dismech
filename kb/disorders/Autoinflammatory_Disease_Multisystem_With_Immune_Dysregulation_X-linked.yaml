    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patient-derived T cells did not form filopodia and showed abnormal migration."
    explanation: The defining cellular phenotype, measured in patient cells.
  - reference: PMID:36952639

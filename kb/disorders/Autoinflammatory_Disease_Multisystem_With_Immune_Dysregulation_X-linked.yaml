classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A paediatric inborn error of immunity combining autoimmune cytopenia,
      systemic autoinflammation and a variable antibody deficiency.

- name: Systemic Autoinflammation
  biological_scale: ORGANISM
  description: >-
    Sustained proinflammatory cytokine output produces recurrent fever,
    serositis including pericarditis, panniculitis and hepatosplenomegaly. The
    autoinflammatory arm is episodic, superimposed on the chronic cytopenia and
    gut disease.
  evidence:
  - reference: PMID:40274249
    reference_title: "A novel hemizygous nonsense variant in DOCK11 causes systemic inflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Features of immune dysregulation have been reported in all so far identified male patients with damaging variants in DOCK11, commonly manifesting with autoimmune cytopenias, inflammatory bowel disease, benign lymphoproliferation and systemic inflammation."
    explanation: Systemic inflammation across every reported patient.
  downstream:
  - target: Colitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Lymphoproliferative disorder
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Chronic Inflammatory Burden on Development
    causal_link_type: DIRECT
- name: Autoantibody-Mediated Autoimmunity
  biological_scale: ORGANISM
  description: >-
    Loss of regulatory T cell identity removes the restraint on autoreactive B
    cell help, and the result is a broad autoantibody profile with
    Coombs-positive haemolytic anaemia, autoimmune thrombocytopenia, lupus and a
    positive rheumatoid factor.
  evidence:
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patients were presenting with early-onset autoimmunity, including cytopenia, systemic lupus erythematosus, skin, and digestive manifestations."
    explanation: The autoantibody-driven arm as it presents clinically.
  downstream:
  - target: Autoimmune cytopenia
    causal_link_type: DIRECT
  - target: Systemic lupus erythematosus
    causal_link_type: DIRECT
- name: Impaired Humoral Response and Antibody Deficiency
  biological_scale: ORGANISM
  description: >-
    Loss of the marginal zone compartment and of secondary humoral responses
    produces a variable antibody deficiency, with low IgA the reported
    laboratory finding, and recurrent sinopulmonary infection that accumulates
    into bronchiectasis in patients with expression-null alleles.
  evidence:
  - reference: PMID:40274249
    reference_title: "A novel hemizygous nonsense variant in DOCK11 causes systemic inflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Hemizygous germline loss-of-function variants in DOCK11, the gene encoding the dedicator of cytokinesis 11 (DOCK11) have been recently identified to cause variable immunodeficiency and immune dysregulation."
    explanation: The variable immunodeficiency arm of the disease.
  downstream:
  - target: Recurrent pneumonia
    causal_link_type: DIRECT
- name: Chronic Inflammatory Burden on Development
  biological_scale: ORGANISM
  description: >-
    Chronic inflammation, transfusion- or immunosuppression-dependent anaemia
    and chronic colitis together carry a developmental and growth burden.
    Developmental delay is the part of that burden a quotable source names;
    failure to thrive and postnatal growth retardation are recorded in the OMIM
    clinical synopsis only and are described in this entry's notes instead.
  evidence:
  - reference: PMID:37342957
    reference_title: "Systemic Inflammation and Normocytic Anemia in DOCK11 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "four patients from four unrelated families who presented with infections, early-onset severe immune dysregulation, normocytic anemia of variable severity associated with anisopoikilocytosis, and developmental delay"
    explanation: >-
      The series reports the growth and developmental burden alongside the
      inflammation; that the inflammation causes it is an inference.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT

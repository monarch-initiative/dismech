notes: >-
  No IUIS category is recorded. The IUIS 2022 phenotypic classification
  (PMID:35748970) is the edition this knowledge base uses, and it predates the
  2023 first description of DOCK11 deficiency, so DOCK11 appears in none of its
  tables. Assigning a category here would be a guess at where a future edition
  will file the disease; the candidate rows are "immune dysregulation" and
  "combined immunodeficiency", and the ClinGen curation was performed by the
  Primary Immune Regulatory Disorders expert panel.

  No GeneReviews chapter covers this disease or DOCK11, checked offline against
  the committed Bookshelf index and with a live PubMed title and gene search
  (`just check-genereviews --online`), so the phenotype baseline here is taken
  from the three index case series (PMID:36952639, PMID:37342957,
  PMID:40274249) rather than from a chapter.

  Several features of this disease are recorded only in the OMIM clinical
  synopsis and the HPO annotation of OMIM:301109, and are not named in any
  abstract that can be quoted: pericarditis (2/2 patients), panniculitis
  (2/12), discoid lupus (1/12), nephrotic syndrome (1/12), polyarticular
  arthritis (2/8), rheumatoid factor positivity (3/8), anti-U1 RNP antibody
  (2/8), decreased circulating IgA (2/5), BCGitis after live BCG vaccination
  (1/4), recurrent gastroenteritis (3/4), splenomegaly and hepatomegaly (2/4
  each), failure to thrive (3/4) and postnatal growth retardation (2/8). None
  of the three index series has open full text, and `just fetch-reference
  --force` on all three returns the abstract only, so there is nothing to
  quote. They are listed here rather than bound as phenotypes carrying a quote
  that names something else. Anyone with access to the full texts can promote
  them with a real snippet. The two findings with the most clinical weight are
  the BCGitis, which is why live vaccines are contraindicated once the
  diagnosis is known, and the growth failure.

  No treatment other than transplantation and immunoglobulin replacement is
  curated. Corticosteroids and steroid-sparing immunosuppression are what the
  published patients were actually treated with, but none of the three index
  series' abstracts mentions any drug, and the actinopathy review names only
  transplantation, so a corticosteroid treatment entry would assert practice
  this entry cannot cite. The same applies to the calcineurin and JAK
  inhibitors the deep-research report proposed from the NFATc1 and STAT5B
  findings; those are untested inference and are left out.

  Phenotype frequencies are deliberately absent. The deep-research report
  retrieved the 50 HPO annotations of OMIM:301109 with per-term denominators of
  2 to 12 patients, which are too small and too heterogeneously ascertained to
  map onto FrequencyEnum bands; the aggregated HPO annotation is also not a
  citable reference in this knowledge base. Each phenotype here is instead
  cited to the series that reported it.

  Three analyses in the deep-research report are the provider's own computation
  rather than published findings, and none is carried into this entry as
  evidence: a positional comparison of gnomAD v4 hemizygous pLoF alleles against
  reported disease alleles, a GTEx/Human Protein Atlas expression argument, and
  a Fisher test of allele class against phenotype axis. The allele-class
  correlation itself is curated, because PMID:40274249 states it in its own
  abstract.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    All reported patients are hemizygous males; carrier females in the published
    families are described as unaffected. No manifesting carrier has been
    reported, although skewed X-inactivation could in principle produce one.
  evidence:
  - reference: PMID:37342957
    reference_title: "Systemic Inflammation and Normocytic Anemia in DOCK11 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified rare, X-linked germline mutations in DOCK11 in the patients, leading to a loss of protein expression in two patients and impaired CDC42 activation in all four patients."
    explanation: Establishes the X-linked germline mode of inheritance in the four-patient series.
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We studied 8 male patients, from 7 unrelated families, with hemizygous DOCK11 missense variants leading to reduced DOCK11 expression."
    explanation: Eight hemizygous males from seven unrelated families, consistent with X-linked recessive transmission.
has_subtypes:
- name: Complete Deficiency
  display_name: Complete DOCK11 deficiency (expression-null alleles)
  description: >-
    Truncating, nonsense and canonical splice alleles that abolish DOCK11
    protein. On re-evaluation of the published patients this class tracks with
    autoinflammation and recurrent pneumonia, and so with the bronchiectasis
    that repeated pneumonia produces. This is a difference in which arm of the
    disease dominates, not in mechanism: CDC42 activation is impaired in both
    classes.
  subtype_term:
    preferred_term: early-onset immune dysregulation due to DOCK11 complete deficiency
    term:
      id: MONDO:0958138
      label: early-onset immune dysregulation due to DOCK11 complete deficiency
  genes:
  - preferred_term: DOCK11
    term:
      id: hgnc:23483
      label: DOCK11
  evidence:
  - reference: PMID:40274249
    reference_title: "A novel hemizygous nonsense variant in DOCK11 causes systemic inflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "variants leading to the complete loss of DOCK11 expression and consequently function rather associate with autoinflammation and recurrent pneumonias, while missense variants, primarily associate with autoantibody-related autoimmune features"
    explanation: The re-evaluation of all published patients that defines this stratum against the missense one.
- name: Partial Deficiency
  display_name: Partial DOCK11 deficiency (hypomorphic missense alleles)
  description: >-
    Missense alleles that reduce steady-state DOCK11 protein without abolishing
    it. This class tracks with autoantibody-driven autoimmunity: lupus,
    Coombs-positive haemolytic anaemia and autoimmune cytopenia. The cryo-EM
    finding that activated CDC42 feeds back onto DOCK11 to raise its own
    exchange activity explains why a merely reduced protein level still causes
    disease, because output is thresholded rather than proportional.
  subtype_term:
    preferred_term: early-onset autoimmune disorder due to DOCK11 partial deficiency
    term:
      id: MONDO:0958137
      label: early-onset autoimmune disorder due to DOCK11 partial deficiency
  genes:
  - preferred_term: DOCK11
    term:
      id: hgnc:23483
      label: DOCK11
  evidence:
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We studied 8 male patients, from 7 unrelated families, with hemizygous DOCK11 missense variants leading to reduced DOCK11 expression."
    explanation: Defines the hypomorphic missense stratum and its reduced-protein mechanism.
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patients were presenting with early-onset autoimmunity, including cytopenia, systemic lupus erythematosus, skin, and digestive manifestations."
    explanation: The autoimmune-dominant presentation that distinguishes this stratum.
genetic:
- name: DOCK11
  variant_origin: GERMLINE
  gene_term:
    preferred_term: DOCK11
    term:
      id: hgnc:23483
      label: DOCK11
  relationship_type: CAUSATIVE
  notes: >-
    Reported disease alleles are nonsense, frameshift and canonical splice
    variants that remove or disable the catalytic DOCKER (DHR-2) domain, and
    missense variants that reduce steady-state protein. No gain-of-function
    allele has been reported in a patient. The missense alleles from the
    eight-patient series are not deposited with pathogenic or likely-pathogenic
    status, so a clinical laboratory encountering a DOCK11 missense variant will
    usually return a variant of uncertain significance; functional confirmation
    by CDC42-GTP loading or a filopodium assay is therefore part of the
    diagnostic path rather than an optional extra.

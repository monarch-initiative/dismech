    Patient T cells form no filopodia and migrate abnormally, and activated
    patient T cells and B-lymphoblastoid lines show aberrant protrusions and
    abnormal speed in confined channels with altered actin polymerisation.
    Knocking DOCK11 down in healthy donor cells reproduces both.
  biological_processes:

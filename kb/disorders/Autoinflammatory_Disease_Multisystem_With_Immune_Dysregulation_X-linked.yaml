- name: Marginal Zone B Cell Development Failure
  biological_scale: CELLULAR
  description: >-
    Dock11-knockout mice have a reduced marginal zone B cell fraction, and a
    B-cell-conditional knockout shows the requirement is B-cell intrinsic and
    specific to the marginal zone compartment rather than to follicular B cells.
    Secondary humoral responses to protein antigen are impaired in the same
    model.
  biological_processes:
  - preferred_term: marginal zone B cell differentiation
    modifier: DECREASED
    term:

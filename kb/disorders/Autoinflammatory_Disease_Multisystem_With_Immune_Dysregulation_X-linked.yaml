    quote_role: PRIMARY_RESULT
    snippet: "In vitro activated T cells and B-lymphoblastoid cell lines from patients exhibited aberrant protrusions and abnormal migration speed in confined channels concomitant with altered actin polymerization during migration."
    explanation: Independently reproduces the migration and actin defect in a second cohort and a second cell type.

diagnosis:
- name: DOCK11 protein and CDC42 activation testing
  description: >-
    Because most DOCK11 missense variants return as variants of uncertain
    significance, functional confirmation is part of the diagnostic path.
    Immunoblot for DOCK11 protein in patient mononuclear cells separates
    expression-null from hypomorphic alleles and therefore carries the
    prognostic meaning of the allele classes recorded above; a CDC42-GTP
    loading assay demonstrates the biochemical lesion itself.
  evidence:
  - reference: PMID:37342957
    reference_title: "Systemic Inflammation and Normocytic Anemia in DOCK11 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "impaired CDC42 activation in all four patients"
    explanation: The CDC42 activation assay performed on patient cells in the index series.
- name: Clinical suspicion of an autoinflammatory actinopathy
  description: >-
    The actinopathy review gives the trigger for considering this group of
    diseases, which applies to DOCK11 deficiency.
  evidence:
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diagnosis should be considered primarily when encountering an early-onset autoinflammatory skin and digestive disorder, along with a primary immunodeficiency and either thrombocytopenia or a bleeding tendency"
    explanation: The published clinical trigger for suspecting a monogenic autoinflammatory actinopathy.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Replacement of the haematopoietic compartment is the only reported curative
    option for the severe end of this disease group. No transplant outcome
    series exists for DOCK11 deficiency specifically, so the indication is taken
    from practice across the autoinflammatory actinopathies rather than from
    DOCK11 data.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In most cases, the severity of the conditions necessitates allogeneic marrow transplantation as a treatment option"
    explanation: >-
      The review states transplantation as the treatment the severity of these
      conditions necessitates.
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "with a special focus on the newly described actinopathies DOCK11 and ARPC5 deficiency"
    explanation: >-
      Establishes that this review's scope includes DOCK11 deficiency
      specifically, which is what lets its class-level statements be cited here.
- name: Immunoglobulin Replacement and Antimicrobial Prophylaxis
  description: >-
    Immunoglobulin replacement for the antibody deficiency, with antibiotic
    prophylaxis, aimed at preventing the recurrent pneumonia that accumulates
    into irreversible bronchiectasis. Live attenuated vaccines, BCG above all,
    are contraindicated once the diagnosis is known, because vaccine-strain
    disease is a reported complication.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  evidence:
  - reference: PMID:40274249
    reference_title: "A novel hemizygous nonsense variant in DOCK11 causes systemic inflammation and immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "a patient with a history of recurrent pneumonia, bronchiectasis, infection-triggered hyperinflammation and persistent systemic inflammation"
    explanation: >-
      Establishes the recurrent-pneumonia-to-bronchiectasis course this therapy
      is intended to interrupt. No trial of immunoglobulin replacement in DOCK11
      deficiency has been reported.
  target_mechanisms:
  - target: Impaired Humoral Response and Antibody Deficiency
    description: Substitutes for the antibody the patient cannot make.

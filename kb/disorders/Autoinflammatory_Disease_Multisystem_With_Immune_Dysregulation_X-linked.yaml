differential_diagnoses:
- name: DOCK8 deficiency
  description: >-
    The other DOCK-family CDC42 exchange factor whose loss causes an
    actinopathy. It is autosomal recessive and dominated by severe atopy, very
    high IgE and cutaneous viral infection, none of which is characteristic of
    DOCK11 deficiency.
  evidence:
  - reference: PMID:36952639
    reference_title: "DOCK11 deficiency in patients with X-linked actinopathy and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This is highlighted by the DOCK2 and DOCK8 deficiencies leading to actinopathies and immune deficiencies."
    explanation: Places DOCK8 and DOCK2 deficiency as the established actinopathies against which this disease was defined.
- name: Wiskott-Aldrich syndrome
  description: >-
    The other X-linked actinopathy with thrombocytopenia. It is distinguished by
    microthrombocytopenia with small platelets and eczema; normocytic anaemia
    with anisopoikilocytosis is not a feature.
  evidence:
  - reference: PMID:39644982
    reference_title: "Current landscape of monogenic autoinflammatory actinopathies: A literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "variably combine a primary immunodeficiency of varying severity, cytopenia (particularly thrombocytopenia), autoinflammatory manifestations"
    explanation: The shared actinopathy signature that makes these diseases differential diagnoses of one another.
references:
- reference: PMID:36952639

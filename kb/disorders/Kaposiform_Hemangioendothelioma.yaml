        A less marked response without the phenomenon over the first 12 months.
    - reference: PMID:28486787
      reference_title: >-
        Sirolimus for the treatment of progressive kaposiform hemangioendothelioma: A multicenter
        retrospective study.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirty-seven (71%) patients exhibited Kasabach-Merritt phenomenon (KMP) and were
        significantly younger than the patients without KMP [95% confidence interval (CI),
        14.39-41.61; p < 0.001].
      explanation: >-
        The patients with the phenomenon were younger, so age differs between the strata.
    - reference: PMID:28486787
      reference_title: >-
        Sirolimus for the treatment of progressive kaposiform hemangioendothelioma: A multicenter
        retrospective study.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients without KMP were all treated with sirolimus alone, whereas 21 KMP patients with
        severe symptoms received short-term combination therapy with prednisolone.
      explanation: >-
        21 of the 37 with the phenomenon also received prednisolone, so treatment also differs
        between the strata.
  - effect_modifier_type: SEX
    stratum: boys
    comparator_stratum: girls
    modified_outcome: complications above grade II
    effect_in_stratum: LARGER_EFFECT
    modification_analysis: CROSS_STRATUM_COMPARISON
    description: >-
      In the trough-level series of 21, boys seemed to be at higher risk of complications above
      grade II, which is a larger effect on a harm, not on the tumour. The comparison is between
      treated boys and girls, with no untreated comparator, so it shows that severe complications
      were more frequent in treated boys, not that sirolimus itself caused more harm in boys.
    evidence:
    - reference: PMID:33932303
      reference_title: >-
        Sirolimus for the treatment of kaposiform hemangioendothelioma: In a trough level-dependent
        way.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No significant differences were observed in complication occurrence among different
        concentrations, although boys seemed to be at higher risk of more severe complications
        (>grade II, χ2 -test, p = 0.009, odds ratio = 4.52, range = 1.20-17.24).
      explanation: >-
        Complications did not differ by trough level, but boys seemed to be at higher risk of severe
        ones.
  - effect_modifier_type: OTHER
    stratum: tumours at a central location
    comparator_stratum: tumours not at a central location
    modified_outcome: speed of tumour shrinkage
    effect_in_stratum: LARGER_EFFECT
    modification_analysis: CROSS_STRATUM_COMPARISON
    description: >-
      In the same series, tumours at a central location responded better to sirolimus, efficacy
      there being the speed of shrinkage; the abstract does not define the comparison group.
    evidence:
    - reference: PMID:33932303
      reference_title: >-
        Sirolimus for the treatment of kaposiform hemangioendothelioma: In a trough level-dependent
        way.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, tumors at a central location reacted better to sirolimus (t-test, p = 0.022).
      explanation: >-
        Centrally placed tumours responded better.
    - reference: PMID:33932303
      reference_title: >-
        Sirolimus for the treatment of kaposiform hemangioendothelioma: In a trough level-dependent
        way.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Efficacy represented by tumor shrinkage speed and safety manifested by complication grades
        were compared between different trough level groups (5-10 vs. 10-15 vs. >15 ng/mL).
      explanation: >-
        The series measured efficacy as the speed of shrinkage, which makes the outcome of this
        modifier the speed of shrinkage.
  target_mechanisms:
  - target: Lymphatic-Type Endothelial Proliferation
    treatment_effect: INHIBITS
    description: >-
      Aimed at the growth of the tumour's endothelium.
      How sirolimus acts in KHE is not settled. A 2025 review lists possible effects on platelet
      activation, inflammation, angiogenesis, lymphangiogenesis and fibrosis, of which the
      antiangiogenic and antilymphangiogenic effects bear on this node, and the 2020 review places
      it beside antilymphatic strategies. Serum angiopoietin-2 fell after 12 months of treatment in
      kaposiform lymphangiomatosis and in KHE with the Kasabach-Merritt phenomenon, reported
      together in the abstract, with most patients responding, which may track the phenomenon rather
      than the endothelium; and sirolimus downregulated ATG9B in endothelial cells cultured from
      patients' tumours, a preliminary transcriptome finding.
    evidence:
    - reference: PMID:38903724
      reference_title: >-
        Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: >-
        Rapamycin works by inhibiting the expression of various cytokines, including VEGF, and by
        blocking mammalian target of rapamycin (mTOR) signal pathways, which induces anti-vascular
        proliferation and promotes apoptosis
      explanation: >-
        How sirolimus acts, as the cohort's discussion states it: mTOR blockade against vascular
        proliferation. INDIRECT: not shown in this tumour.
    - reference: PMID:39369447
      reference_title: >-
        Sirolimus for kaposiform hemangioendothelioma: Potential mechanisms of action and
        resistance.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        The prevention of platelet activation and inflammation, along with antiangiogenic effects,
        the inhibition of lymphangiogenesis, the attenuation of fibrosis, or a combination of all
        these effects, may be responsible for the therapeutic effects of sirolimus.
      explanation: >-
        A 2025 review's list of possible mechanisms, among them antiangiogenic effects and the
        inhibition of lymphangiogenesis. INDIRECT: possible mechanisms, not shown in this
        tumour. OTHER: a list of possible mechanisms with no data named.
    - reference: PMID:32014025
      reference_title: >-
        Kaposiform hemangioendothelioma: current knowledge and future perspectives.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Sirolimus (rapamycin), which is an inhibitor of mTOR, complements current antilymphatic
        strategies in the treatment of vascular anomalies, such as KHE
      explanation: >-
        The 2020 review's figure legend places sirolimus beside antilymphatic strategies. INDIRECT:
        a general statement about vascular anomalies. OTHER: a general statement with no data named.
    - reference: PMID:27990590
      reference_title: >-
        Angiopoietins as serum biomarkers for lymphatic anomalies.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After 12 months of sirolimus treatment, Ang-2 levels were lower in KLA and KHE with KMP
        patients compared to baseline levels and with most patients showing a clinical response.
      explanation: >-
        Serum angiopoietin-2 fell after 12 months of sirolimus in kaposiform lymphangiomatosis and
        in KHE with the Kasabach-Merritt phenomenon, reported together in the abstract, with most
        patients responding. If angiopoietin-2 signals to the tumour's endothelium, as the 2020
        review raises as a possibility, its fall fits inhibition of this node; the review itself
        reads the fall as pointing to a possible role in the phenomenon. INDIRECT: a serum marker
        that may instead track the phenomenon.
    - reference: PMID:41122025
      reference_title: >-
        An Examination of Sirolimus's Role in Endothelial Cells of Kaposiform Haemangioendothelioma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        Transcriptome sequencing revealed downregulation of ATG9B after sirolimus treatment in CD31+
        KHE cells.
      explanation: >-
        Sirolimus acts on endothelial cells cultured from patients' tumours, the node's own cells,
        downregulating ATG9B, a finding the abstract says suggests a potential mechanism of
        sirolimus action. INDIRECT: cultured cells; that this inhibits their proliferation is not
        shown, since the abstract reports no proliferation readout after sirolimus, and the abstract
        does not link ATG9B to mTOR.
- name: Corticosteroids
  description: >-
    Recommended as a first-line treatment of the Kasabach-Merritt phenomenon because they raise the
    platelet count quickly; given alone, many cases do not improve, with response rates of 10 to
    27%. Prednisolone is also the add-on in the randomised trial of sirolimus.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

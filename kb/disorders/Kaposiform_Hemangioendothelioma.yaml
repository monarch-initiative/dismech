      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Systemic corticosteroid treatment is recommended as another first-line therapy for KMP
        because of its success in rapidly normalizing platelet counts
      explanation: >-

        these results could be interpreted so that platelets are preactivated,48 probably because of
        their contact with the tumor and consumption by it, and this resulted in decreased platelet
        counts and platelet age.
      explanation: >-
        The platelet study's reading of its measurements in patients: platelets are preactivated,
        probably by contact with the tumour and consumption in it, which lowers their count.
    - reference: PMID:32014025
      reference_title: >-
        Kaposiform hemangioendothelioma: current knowledge and future perspectives.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The thrombocytopenia is usually severe, with a median platelet count of 21 × 109/L at the
        initial presentation of KMP
      explanation: >-
        How deep the thrombocytopenia is. INDIRECT: a severity, not the step.
  - target: Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Anaemia accompanies the falling platelet count of the phenomenon. The cited sources name the
      anaemia of the phenomenon as microangiopathic haemolytic anaemia, and intralesional
      haemorrhage among its consequences, without tracing the steps from trapping to anaemia.
    evidence:
    - reference: PMID:38903724
      reference_title: >-

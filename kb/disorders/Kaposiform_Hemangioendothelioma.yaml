diagnosis:
- name: Magnetic resonance imaging
  description: >-
    Generally the first-line assessment, because the tumour's deep infiltration may not be apparent
    on examination or ultrasound. The lesion has ill-defined margins and crosses tissue planes,
    enhances diffusely, and is hypo- or iso-intense to muscle on T1 and hyperintense on T2.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:32014025
    reference_title: >-
      Kaposiform hemangioendothelioma: current knowledge and future perspectives.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Magnetic resonance imaging (MRI) is generally first-line assessment because the deep
      infiltrating nature of KHE may not be apparent on physical exam or on ultrasound.
    explanation: >-
      MRI is the first-line assessment.
  - reference: PMID:32014025
    reference_title: >-
      Kaposiform hemangioendothelioma: current knowledge and future perspectives.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On MRI scans, KHEs usually exhibit ill-defined margins and are characterized by multiplanar
      involvement, diffuse enhancement, and adjacent fat stranding in unusual locations,
      iso-intensity relative to adjacent muscle on T1-weighted imaging, hyperintensity on
      T2-weighted imaging
    explanation: >-
      The appearance on MRI.
  - reference: PMID:33657997
    reference_title: >-
      Kaposiform haemangioendothelioma: magnetic resonance imaging features in 64 cases.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all patients, the lesions in all of the 64 patients were hypointense or isointense compared
      with muscle on T1-weighted sequences, and hyperintense on T2-weighted or inversion-recovery
      sequences, nine patients (14.1 %) showed vascularity.
    explanation: >-
      The MRI signal in all 64 patients of a pathology-confirmed series.
- name: Biopsy with immunohistochemistry
  description: >-
    Biopsy is the reference standard and shows the lymphatic-type endothelium, but it is often not
    possible or not advised in severe Kasabach-Merritt phenomenon. The diagnosis integrates the
    clinical, imaging, haematological and histological features, and even with all of them it can be
    unclear.
  diagnosis_term:
    preferred_term: biopsy with immunohistochemistry
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:32014025
    reference_title: >-
      Kaposiform hemangioendothelioma: current knowledge and future perspectives.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biopsy is gold standard for diagnosis and should be performed if possible and safe. Biopsy is
      frequently not possible or recommended in KHE with severe KMP, and can potentially worsen the
      coagulopathy.
    explanation: >-
      Biopsy is the reference standard, often not possible in severe Kasabach-Merritt phenomenon.
  - reference: DOI:10.1002/ijc.35344
    reference_title: >-
      Consensus statement for the diagnosis, treatment, and prognosis of kaposiform
      hemangioendothelioma
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      A diagnosis of KHE necessitates the integration of clinical, imaging, and histologic features.
    explanation: >-
      A 2025 consensus statement: the diagnosis integrates clinical, imaging and histological
      features.
  - reference: PMID:38903724
    reference_title: >-
      Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KHE tissue is positive for CD31, CD34, D2-40, LYVE1, and KI67 on endothelial cells, and GLUT-1
      is positive for red blood cells but negative for endothelial cells
    explanation: >-
      What immunohistochemistry of KHE tissue shows: lymphatic markers present, GLUT-1 absent from
      the endothelium.
  - reference: PMID:32014025
    reference_title: >-
      Kaposiform hemangioendothelioma: current knowledge and future perspectives.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The diagnosis of KHE often requires an analysis of clinical, imaging, hematological and/or
      histological characteristics, but even with all of these data, the diagnosis might not be
      readily apparent in certain cases
    explanation: >-
      The diagnosis combines clinical, imaging, blood and histological findings, and can still be
      unclear.
treatments:
- name: Sirolimus
  description: >-
    An mTOR inhibitor. In a randomised trial in KHE with the Kasabach-Merritt phenomenon, in which
    sirolimus was given for at least 12 months, adding a short course of prednisolone raised the
    week-4 platelet response from 24 of 36 to 35 of 37; in a randomised trial in KHE without the
    phenomenon, low-dose sirolimus was non-inferior to high-dose at one year (about 90% response in
    both); in a cohort of 167 patients, 92.2% had a durable response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  evidence:
  - reference: DOI:10.1182/blood.2021014027
    reference_title: >-
      Sirolimus plus prednisolone vs sirolimus monotherapy for kaposiform hemangioendothelioma: a
      randomized clinical trial
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At week 4, a durable platelet response was achieved by 35 of 37 patients given sirolimus and
      prednisolone compared with 24 of 36 patients given sirolimus monotherapy (difference 27.9%;
      95% confidence interval, 10.0-44.7).
    explanation: >-
      The randomised trial of sirolimus with and without prednisolone in KHE with the
      Kasabach-Merritt phenomenon: platelet response at week 4.
  - reference: PMID:40107509
    reference_title: >-
      Efficacy and safety of high-vs low-dose sirolimus in patients with kaposiform
      hemangioendothelioma: A randomized clinical trial.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 1 year of treatment, 90.0% in the high-dose group and 89.7% in the low-dose group achieved
      an objective response (difference, 0.3%; 95% confidence interval -13.1 to 13.6).
    explanation: >-
      A randomised non-inferiority trial of low- against high-dose sirolimus in KHE without the
      phenomenon: similar response at one year.
  - reference: DOI:10.1002/ijc.34509
    reference_title: >-
      Long‐term outcomes of sirolimus treatment for kaposiform hemangioendothelioma: Continuing
      successes and ongoing challenges
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 154 (92.2%) patients had a durable response to sirolimus treatment.
    explanation: >-
      Durable response in 154 of 167 on long-term sirolimus.
  - reference: PMID:32014025
    reference_title: >-
      Kaposiform hemangioendothelioma: current knowledge and future perspectives.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Sirolimus plus steroids is now considered as a first-line therapy for the treatment of KHE
      with KMP (versus vincristine plus steroids).
    explanation: >-

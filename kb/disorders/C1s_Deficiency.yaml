- name: Complement Component 2 Deficiency
  disease_term:
    preferred_term: complement component 2 deficiency
    term:
      id: MONDO:0009006
      label: complement component 2 deficiency
  description: >-
    The commonest early classical pathway deficiency, with recurrent
    pneumococcal infection and a lower lupus risk.

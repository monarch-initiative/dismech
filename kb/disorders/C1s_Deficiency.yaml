mappings:
  mondo_mappings:
  - term:
      id: MONDO:1060176
      label: systemic lupus erythematosus related to C1S
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      MONDO places this class under systemic lupus erythematosus, not under
      complement component C1s deficiency, and defines it as SLE caused by
      variation in C1S. It covers the lupus manifestation of the deficiency
      curated here, but C1s deficiency also includes patients with infections
      only, other autoimmune disease or no symptoms, so neither class subsumes
      the other with certainty.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency presenting with lupus-like autoimmunity and
      bacterial infection, placing it in Harrison's immune/rheumatologic Part.
      Assigned to match the sibling C1Q_Deficiency and
      Complement_Component_2_Deficiency entries.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      A defect of C1s, the protease subunit of the classical pathway C1
      complex, which is a row of the IUIS complement deficiencies table.
inheritance:
- name: Autosomal Recessive
  description: >-
    Disease requires biallelic C1S variants, homozygous in consanguineous
    families and compound heterozygous otherwise. Heterozygous parents and
    relatives have about half-normal serum C1s and are clinically unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:9973493
    reference_title: Molecular basis of human complement C1s deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of serum C1s seem to be correlated to the genotypes of the C1s gene in which no C1s was detected in the patient, and one-half of the normal level in the family members who are heterozygous for either mutation. The present study demonstrates that the disease is inherited in an autosomal recessive mode."
    explanation: >-
      A compound heterozygous proband with half-normal C1s in heterozygous
      relatives, and the authors' conclusion of autosomal recessive
      inheritance.
  - reference: PMID:11390518
    reference_title: Molecular basis of a selective C1s deficiency associated with early onset multiple autoimmune diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both parents were heterozygous for this mutation."
    explanation: >-
      A homozygous proband born to heterozygous, unaffected parents.
prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2023 case report counted nine previously reported cases of selective
    complete C1s deficiency, and a 2016 review counted eight cases from five
    families. These are literature counts, not population prevalence
    estimates.
  evidence:
  - reference: PMID:38469558
    reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Among these, complete C1s deficiency has been reported in nine cases so far."
    explanation: >-
      Literature count of reported patients before this report.
  - reference: PMID:26913032
    reference_title: Early Components of the Complement Classical Activation Pathway in Human Systemic Autoimmune Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A total of 20 cases of C1r and/or C1s deficiencies have been reported, which include 12 cases of C1r deficiency from eight families and eight cases of C1s deficiency from five families."
    explanation: >-
      An independent literature count, separating C1s from C1r deficiency.
pathophysiology:
- name: Absent C1s Protease
  biological_scale: MOLECULAR
  description: >-
    Biallelic nonsense, frameshift or missense variants in C1S abolish
    circulating C1s or leave a functionally inactive protein at very low
    level. Reported alleles include homozygous p.Arg534*, homozygous
    p.Tyr204* (c.938 in exon 6), homozygous exon 10 TTTG deletion, homozygous
    p.Phe110Leufs*23, and compound heterozygous combinations of the exon 10
    deletion, p.Glu597*, p.Gly630Glu, p.Gly172* and p.Tyr250*.
  genes:
  - preferred_term: C1S
    term:
      id: hgnc:1247
      label: C1S
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: C1s serine protease activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11390518
    reference_title: Molecular basis of a selective C1s deficiency associated with early onset multiple autoimmune diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exon-specific amplification of genomic DNA by PCR followed by direct sequence analysis revealed a homozygous nonsense mutation in the C1s gene exon XII at codon 534, caused by a nucleotide substitution from C (CGA for arginine) to T (TGA for stop codon)."
    explanation: >-
      A homozygous C1S nonsense variant in a patient with undetectable C1s.
  - reference: PMID:18062908
    reference_title: Genetic analysis of complement C1s deficiency associated with systemic lupus erythematosus highlights alternative splicing of normal C1s gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that all four siblings are homozygous for a mutation at position 938 in exon 6 of the C1s cDNA that creates a premature stop codon."
    explanation: >-
      A second homozygous truncating variant, in a family whose children all
      lacked C1s.
  - reference: PMID:38469558
    reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations create a premature stop codon and have not previously been reported in the literature. These genetic findings, combined with the absence of C1s in the circulation, strongly suggest a compound heterozygote C1s deficiency in our patient, without additional defect within the complement cascade."
    explanation: >-
      Compound heterozygous truncating variants with absent circulating C1s
      and no other complement gene defect.
  - reference: PMID:19155518
    reference_title: Unique phenotypes of C1s deficiency and abnormality caused by two compound heterozygosities in a Japanese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical properties of C1s in the patient's serum and the recombinant form were closely related to the undetectable or very low activity of complement activation."
    explanation: >-
      A missense allele (Gly630Glu) in trans with a nonsense allele leaves a
      C1s protein with little or no activity, so loss of function is not
      limited to truncating alleles.
  downstream:
  - target: Classical Complement Pathway Activation Failure
    description: >-
      C1s is the C1 subunit that cleaves C4 and C2; without it the classical
      pathway cannot proceed past C1.
    evidence:
    - reference: PMID:38469558
      reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In an ELISA-based functional assay determining C4d deposition, the patient's absent complement activity was fully restored by adding C1s."
      explanation: >-
        Adding purified C1s to the patient's serum restores classical pathway
        activation, showing that missing C1s is what stops the pathway.
  - target: Loss of C1s Cleavage of Apoptotic-Cell Autoantigens
    description: >-
      Besides C4 and C2, C1s cleaves intracellular proteins exposed on dying
      cells; that activity is also lost.
  - target: Decreased Circulating C1s
    description: >-
      Absent or truncated C1s is measured as undetectable serum C1s antigen.
- name: Classical Complement Pathway Activation Failure
  biological_scale: MOLECULAR
  description: >-
    Without C1s, C1 cannot cleave C4 and C2, so no classical pathway C3
    convertase is formed. Classical pathway haemolytic activity is absent,
    the alternative pathway is normal, and C4, C2 and C1-inhibitor are normal
    or raised because they are not consumed.
  biological_processes:
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:38469558
    reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of C1s, the CP cannot be activated and the consumption of the subsequent complement proteins is reduced."
    explanation: >-
      States the pathway consequence and why downstream components are not
      consumed.
  - reference: PMID:26913032
    reference_title: Early Components of the Complement Classical Activation Pathway in Human Systemic Autoimmune Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A deficiency of C1r or C1s prevents the formation of the C1 complex and diminishes the need for engagement of C1-inhibitor and other regulators of complement activation."
    explanation: >-
      Review synthesis of the biochemical consequence across reported C1r and
      C1s deficient patients.
  - reference: PMID:18062908
    reference_title: Genetic analysis of complement C1s deficiency associated with systemic lupus erythematosus highlights alternative splicing of normal C1s gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemolytic activity mediated by the alternative and the lectin pathways were normal, but classical pathway activation was absent in all children's sera."
    explanation: >-
      The defect is confined to the classical pathway.
  downstream:
  - target: Impaired Complement-Dependent Defence Against Bacteria
    description: >-
      Classical pathway activation contributes to opsonisation of bacteria;
      its loss leaves patients open to pyogenic infection.
    evidence:
    - reference: PMID:38469558
      reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "This patient's history of recurrent severe infections is based on the crucial role of C1s in activating the CP (23, 24)."
      explanation: >-
        The authors attribute the patient's infections to the loss of C1s
        activation of the classical pathway; this is their interpretation, not
        a measurement.
  - target: Defective Clearance of Apoptotic Cells and Immune Complexes
    description: >-
      Complement deposition on apoptotic cells and immune complexes promotes
      their uptake and solubilisation; the classical pathway block reduces it.
    evidence:
    - reference: PMID:35648651
      reference_title: The yin and the yang of early classical pathway complement disorders.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "This reflects a gradient of effects with C1 (C1q, C1r, and C1s) deficiencies compromising uptake of apoptotic cells, generated daily as part of our tissue homeostasis."
      explanation: >-
        Review synthesis placing C1s deficiency among the C1 defects that
        impair apoptotic cell uptake. It is a model drawn from the early
        classical pathway deficiencies as a group, not a measurement in C1s
        deficient patients.
  - target: Reduced Circulating CH50 Activity
    description: >-
      The classical pathway block is measured as absent CH50.
- name: Impaired Complement-Dependent Defence Against Bacteria
  biological_scale: CELLULAR
  description: >-
    Without classical pathway activation, antibody-coated bacteria are poorly
    opsonised. Patients have had pneumococcal and meningococcal meningitis,
    sepsis, erysipelas and recurrent upper airway infection; deaths from
    infection in childhood are reported across C1r and C1s deficiency.
  biological_processes:
  - preferred_term: opsonization
    term:
      id: GO:0008228
      label: opsonization
    modifier: DECREASED
  evidence:
  - reference: PMID:6433145
    reference_title: "Complement deficiency states and infection: epidemiology, pathogenesis and consequences of neisserial and other infections in an immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pneumococcal infections are characteristic of deficiencies of the early classical pathway, as well."
    explanation: >-
      Review of complement deficiency states placing pneumococcal infection
      with the early classical pathway defects, of which C1s is one.
  - reference: PMID:41421099
    reference_title: Complement deficiencies and infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Deficiencies in complement proteins, whether inherited or acquired, predispose to severe infections, particularly with encapsulated bacteria such as Neisseria meningitidis and Streptococcus pneumoniae."
    explanation: >-
      Recent review naming the encapsulated organisms seen in the C1s
      deficient patients (pneumococcus and meningococcus).
  - reference: PMID:26913032
    reference_title: Early Components of the Complement Classical Activation Pathway in Human Systemic Autoimmune Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the C1r/C1s deficient subjects, all but three had recurrent bacterial, viral, or fungal infections (85%), and many patients died at young age because of a severe infection."
    explanation: >-
      Pooled C1r and C1s deficient patients; the figure is not specific to
      C1s.
  downstream:
  - target: Recurrent Bacterial Infections
  - target: Recurrent Bacterial Meningitis
  - target: Sepsis
  - target: Erysipelas
  - target: Recurrent Upper Respiratory Tract Infections
- name: Defective Clearance of Apoptotic Cells and Immune Complexes
  biological_scale: CELLULAR
  description: >-
    The proposed link between early classical pathway deficiency and lupus:
    complement normally tags apoptotic cells and immune complexes for removal
    by phagocytes, and when this fails, nuclear antigens exposed on apoptotic
    blebs persist and are presented to the adaptive immune system. The model
    rests mainly on C1q deficiency and has not been measured directly in C1s
    deficient patients.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:12496511
    reference_title: Rheumatic syndromes associated with complement deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "An intriguing hypothesis that builds on this idea relates to a defect in clearance of one's own cellular debris, namely apoptotic cells."
    explanation: >-
      The apoptotic cell clearance hypothesis for early classical pathway
      deficiency, stated as a hypothesis in a review.
  - reference: PMID:20476965
    reference_title: "Complement deficiency and systemic lupus erythematosus: consensus and dilemma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The complement system acts as a 'friend' through the clearance of immune complexes and apoptotic cells, which explains the close association between complement deficiency and lupus."
    explanation: >-
      Review synthesis covering C1q, C1r, C1s, C4 and C2 deficiency together.
  - reference: PMID:19302245
    reference_title: Complement classical pathway components are all important in clearance of apoptotic and secondary necrotic cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "In conclusion, we have found that complement-mediated opsonization and phagocytosis of apoptotic cells, particularly those undergoing secondary necrosis, are dependent mainly upon an intact classical pathway."
    explanation: >-
      Macrophage uptake of apoptotic cells in sera from C1q, C4, C2 and C3
      deficient individuals depends on an intact classical pathway. C1s
      deficient serum was not tested, so applying this to C1s deficiency is
      an inference from the shared pathway block.
  downstream:
  - target: Loss of Tolerance to Nuclear Autoantigens
    description: >-
      Persisting apoptotic material supplies the nuclear autoantigens targeted
      by lupus autoantibodies.
    evidence:
    - reference: PMID:12496511
      reference_title: Rheumatic syndromes associated with complement deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "An attractive feature of this emerging concept is that blebs on apoptotic cells are decorated with antigens to which much of the autoantibody specificity is directed in systemic lupus erythematosus."
      explanation: >-
        Connects uncleared apoptotic material to the antigens lupus
        autoantibodies recognise; a hypothesis, not a measured step.
- name: Loss of C1s Cleavage of Apoptotic-Cell Autoantigens
  biological_scale: MOLECULAR
  description: >-
    In vitro, C1s (alone or within C1) cleaves intracellular proteins exposed
    during apoptosis, including the alarmin HMGB1, and the cleaved HMGB1 is
    less able to amplify cytokine production by monocytes, macrophages and
    dendritic cells. Loss of this activity is a C1s-specific candidate
    mechanism for the lupus association that does not depend on C4 and C2
    cleavage. It has not been tested in C1s deficient patients.
  molecular_functions:
  - preferred_term: C1s cleavage of HMGB1 and other apoptotic-cell proteins
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27648302
    reference_title: Proteolytic inactivation of nuclear alarmin high-mobility group box 1 by complement protease C1s during apoptosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This is verified experimentally with C1s, both in its purified and physiological form as C1 complex, cleaving HMGB1 into defined fragments of 19 and 12 kDa. This cleavage diminishes HMGB1 ability to enhance lipopolysaccharide mediated pro-inflammatory cytokines production from monocytes, macrophages and dendritic cells."
    explanation: >-
      Shows the protease activity that is missing in C1s deficiency and its
      effect on an autoimmunity-promoting alarmin.
  downstream:
  - target: Loss of Tolerance to Nuclear Autoantigens
    description: >-
      Uncleaved alarmins and autoantigens from dying cells remain
      immunogenic.
    evidence:
    - reference: PMID:27648302
      reference_title: Proteolytic inactivation of nuclear alarmin high-mobility group box 1 by complement protease C1s during apoptosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Further mass spectrometric analysis of the C1 complex treated apoptotic cellular proteins demonstrated additional C1s substrates and revealed the complementary role of C1s in apoptotic cells clearance through the proteolytic cleavage of intracellular alarmins and autoantigens."
      explanation: >-
        In vitro substrate data from which the authors infer a protective,
        tolerance-preserving role of C1s; the step to autoimmunity in patients
        is an inference.
- name: Loss of Tolerance to Nuclear Autoantigens
  biological_scale: ORGANISM
  description: >-
    Patients produce antinuclear and anti-Ro/SSA antibodies, sometimes
    anti-Sm and rheumatoid factor, but anti-dsDNA is absent or low in most.
    Autoimmunity extends beyond lupus to Hashimoto thyroiditis and autoimmune
    hepatitis. B cells are a main effector: B cell depletion with rituximab
    has controlled lupus nephritis in two patients.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:1575792
    reference_title: Selective deficiency of C1s associated with a systemic lupus erythematosus-like syndrome. Report of a case.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient who developed a systemic lupus erythematosus-like syndrome characterized by bilateral malar erythema, antinuclear antibody, and anti-double-stranded DNA antibody."
    explanation: >-
      Autoantibody production in a selective C1s deficient patient.
  - reference: PMID:11390518
    reference_title: Molecular basis of a selective C1s deficiency associated with early onset multiple autoimmune diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have investigated the molecular basis of selective and complete C1s deficiency in 2-year-old girl with complex autoimmune diseases including lupus-like syndrome, Hashimoto's thyroiditis, and autoimmune hepatitis."
    explanation: >-
      Multi-organ autoimmunity from age 2 in a homozygous patient.
  - reference: PMID:38469558
    reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, these patients have a low incidence of anti-dsDNA (4), which was also the case in our patient, whose anti-dsDNA was only one time weakly positive in the context of a severe flare."
    explanation: >-
      The autoantibody profile typical of early classical pathway deficiency,
      seen in this C1s deficient patient.
  downstream:

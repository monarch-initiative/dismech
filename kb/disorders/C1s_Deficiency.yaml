    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel homozygous single base deletion in C1S (c.330del; p. Phe110LeufsTer23) resulting in a defect in the classical complement pathway."
    explanation: >-

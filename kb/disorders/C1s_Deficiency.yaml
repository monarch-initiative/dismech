clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Outcome ranges from no symptoms in some homozygous relatives to death in
    childhood. Across reported C1r and C1s deficient patients, recurrent
    infection was nearly universal and many died young of infection; lupus
    nephritis and severe infection on immunosuppression dominate adult
    disease.
  evidence:
  - reference: PMID:26913032
    reference_title: Early Components of the Complement Classical Activation Pathway in Human Systemic Autoimmune Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the C1r/C1s deficient subjects, all but three had recurrent bacterial, viral, or fungal infections (85%), and many patients died at young age because of a severe infection."
    explanation: >-
      Pooled C1r and C1s deficiency outcome; not specific to C1s.
  - reference: PMID:18062908
    reference_title: Genetic analysis of complement C1s deficiency associated with systemic lupus erythematosus highlights alternative splicing of normal C1s gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a family in which all four children are deficient in C1s but only two of them developed SLE."
    explanation: >-
      Two of four homozygous siblings had no lupus, which is why burden is
      recorded as variable.
animal_models:
- name: ICGN-derived C1r/C1s-deficient congenic mouse
  species: Mouse
  genotype: >-
    C57BL/6 congenic for the ICGN deletion removing C1s1 and part of C1ra and
    C1rb
  publication: PMID:29550838
  description: >-
    Mice congenic for the ICGN-strain deletion of C1s1 lack circulating C1r
    and C1s and have low C1q, but develop no autoimmunity on the C57BL/6
    background.
  modeled_mechanisms:
  - target: Absent C1s Protease
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Complete deletion of the mouse C1s homologue abolishes circulating C1s.
    limitations: >-
      The deletion also removes part of C1ra and C1rb, so the mice lack C1r
      as well as C1s and model combined C1r/C1s deficiency rather than the
      selective C1s deficiency of most patients.
    evidence:
    - reference: PMID:29550838
      reference_title: C1r/C1s deficiency is insufficient to induce murine systemic lupus erythematosus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This deletion led to the absence of C1r/C1s and a low level of C1q in the circulation."
      explanation: >-
        The model lacks circulating C1s.
  - target: Loss of Tolerance to Nuclear Autoantigens
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Congenic mice lacking C1r and C1s show no autoimmune defects.
    limitations: >-
      Lupus in the parental ICGN strain depends on other predisposing loci;
      C1r/C1s loss alone on the C57BL/6 background does not produce
      autoimmunity, whereas about half of human patients develop lupus.
    evidence:
    - reference: PMID:29550838
      reference_title: C1r/C1s deficiency is insufficient to induce murine systemic lupus erythematosus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Congenic mice exhibited no C1r/C1s and a low level of C1q in the circulation, but did not have any autoimmune defects. These results suggest that C1r/C1s deficiency is not sufficient to drive murine SLE and also that other predisposing genes exist in ICGN mice."
      explanation: >-
        The model does not reproduce the loss of tolerance seen in patients.

  - target: Chilblain Lupus
  - target: Cutaneous Photosensitivity
  - target: Arthritis
  - target: Pericarditis
  - target: Hashimoto Thyroiditis
  - target: Autoimmune Hepatitis
  - target: Immune Complex Glomerulonephritis
- name: Immune Complex Glomerulonephritis
  biological_scale: TISSUE
  description: >-
    Proliferative lupus nephritis with immune deposits. In the one biopsy
    described in detail, deposits contained C1q and C5b-9 strongly but C3,
    C4, IgG and IgM weakly, and the patient had no anti-C1q antibodies. Renal
    failure requiring haemodialysis occurred in an earlier patient.
  evidence:
  - reference: PMID:38469558
    reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal biopsy showed class IV-G (A) LN with complement C1q positivity along the glomerular basement membranes (GBMs) and weak deposition of IgG, IgM, and complement C3 and C4 in the mesangium and GBM."
    explanation: >-
      Biopsy-proven proliferative lupus nephritis with immune deposits in a
      compound heterozygous patient.
  downstream:
  - target: Lupus Nephritis
  - target: Renal Insufficiency

differential_diagnoses:
- name: C1Q Deficiency
  disease_term:
    preferred_term: C1Q deficiency
    term:
      id: MONDO:0013343
      label: C1Q deficiency
  description: >-
    The most penetrant early classical pathway deficiency for lupus, with the
    same absent CH50 and normal C3 and C4.
  distinguishing_features:
  - Undetectable C1q with normal or detectable C1s
  - Lupus in most patients, more often than in C1r/C1s deficiency
  evidence:
  - reference: PMID:26941740
    reference_title: Systemic Lupus Erythematosus and Deficiencies of Early Components of the Complement Classical Pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Deficiency of early complement components frequently leads to the development of autoimmunity or autoimmune-like manifestations (93% of individuals with C1q deficiency, 60–66% of individuals with C1s–C1r deficiency, 75% of individuals with C4 deficiency, and 10% of individuals with C2 deficiency) (71)."
    explanation: >-
      Pooled autoimmunity rates by deficient component.
- name: Complement Component 4A Deficiency
  disease_term:

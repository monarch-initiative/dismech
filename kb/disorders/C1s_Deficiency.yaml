- name: C1r Deficiency
  description: >-
    Primary C1r deficiency produces the same lupus and infection phenotype
    and also lowers C1s, so combined C1r/C1s deficiency is usually reported
    together. dismech has no entry for it.
  distinguishing_features:
  - C1r undetectable with C1s only partly reduced
  - Biallelic variants in C1R rather than C1S
  - Serum CH50 corrected by purified C1r rather than C1s
  evidence:
  - reference: PMID:26941740
    reference_title: Systemic Lupus Erythematosus and Deficiencies of Early Components of the Complement Classical Pathway.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Combined deficiencies of C1s/C1r are commonly inherited together."
    explanation: >-
      C1r and C1s deficiency are often reported together.
  - reference: PMID:26913032
    reference_title: Early Components of the Complement Classical Activation Pathway in Human Systemic Autoimmune Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the C1r-deficient patients, there was a consistent reduction in the serum protein levels of C1s to 30% of its normal level, but highly elevated serum protein levels of C4, C2, and C1-inhibitor (200–400% of their corresponding normal ranges)."
    explanation: >-
      Primary C1r deficiency lowers C1s secondarily.
- name: Systemic Lupus Erythematosus
  disease_term:
    preferred_term: systemic lupus erythematosus
    term:
      id: MONDO:0007915
      label: systemic lupus erythematosus
  description: >-
    Sporadic SLE shares the clinical features but consumes complement.
  distinguishing_features:
  - Low C3, C4 and C2 from consumption, which are normal or raised in C1s deficiency
  - Detectable C1s
  evidence:
  - reference: PMID:38469558
    reference_title: "Complement C1s deficiency in a male Caucasian patient with systemic lupus erythematosus: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although classical SLE patients often exhibit reduced levels of C4, C2, and C3, our patient’s increased levels of these complement proteins, in conjunction with C1 inhibitor, mirror the findings as described in other C1r/C1s-deficient individuals (10, 11)."
    explanation: >-
      The complement pattern that separates C1s deficiency from sporadic SLE.
- name: Periodontal Ehlers-Danlos Syndrome
  disease_term:
    preferred_term: Ehlers-Danlos syndrome, periodontitis type
    term:
      id: MONDO:0007527
      label: Ehlers-Danlos syndrome, periodontitis type
  description: >-
    Allelic disorder caused by heterozygous gain-of-function C1S (or C1R)
    variants, with a connective tissue rather than immunodeficiency
    phenotype.
  distinguishing_features:
  - Autosomal dominant heterozygous C1S or C1R variants
  - Early-onset periodontitis, lack of attached gingiva, pretibial hyperpigmentation and easy bruising
  - No classical pathway deficiency
  evidence:
  - reference: PMID:27745832
    reference_title: "Periodontal Ehlers-Danlos Syndrome Is Caused by Mutations in C1R and C1S, which Encode Subcomponents C1r and C1s of Complement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 17 of these families, we identified heterozygous missense or in-frame insertion/deletion mutations in C1R (15 families) or C1S (2 families), contiguous genes in the mapped locus that encode subunits C1r and C1s of the first component of the classical complement pathway."
    explanation: >-
      Heterozygous C1S variants cause pEDS.
  - reference: PMID:35648651
    reference_title: The yin and the yang of early classical pathway complement disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The gain-of-function variants recently described for C1r and C1s lead to periodontal Ehlers Danlos syndrome, a surprisingly structural phenotype."
    explanation: >-
      Contrasts the gain-of-function phenotype with loss-of-function C1s
      deficiency.
discussions:
- discussion_id: c1sd_incomplete_penetrance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Systemic Lupus Erythematosus
  - pathophysiology#Loss of Tolerance to Nuclear Autoantigens
  prompt: >-
    Why do some homozygous C1s deficient individuals stay free of lupus when
    classical pathway activity is absent in all of them?
  rationale: >-
    In one family only two of four homozygous siblings developed SLE, and
    three asymptomatic patients are reported overall. Mice lacking C1r and
    C1s develop no autoimmunity on the C57BL/6 background, which points to
    modifier loci, but none has been looked for in human C1s deficiency, and
    the relative weight of defective apoptotic cell clearance and lost C1s
    cleavage of autoantigens has not been measured in patients.
notes: >-
  No GeneReviews chapter covers C1s deficiency. Most patient-level detail
  comes from single case and family reports; frequencies are given only where
  a literature count supports them.

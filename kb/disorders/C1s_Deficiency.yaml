    snippet: "Deficiency of early complement components frequently leads to the development of autoimmunity or autoimmune-like manifestations (93% of individuals with C1q deficiency, 60–66% of individuals with C1s–C1r deficiency, 75% of individuals with C4 deficiency, and 10% of individuals with C2 deficiency) (71)."
    explanation: >-

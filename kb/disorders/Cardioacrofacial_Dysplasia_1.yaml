inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous gain-of-function PRKACA variants cause CAFD1 by a dominant
    mechanism. Most arise de novo; some are transmitted, and germline/parental
    mosaicism (including an asymptomatic mosaic parent) is documented, so
    recurrence risk persists even when parental blood testing is negative.
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In most cases, the mutations arose de novo, and two individuals had offspring with the same condition."
    explanation: Establishes the dominant inheritance pattern with mostly de novo and some transmitted variants.
pathophysiology:
- name: PRKACA Gain-of-Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous PRKACA variants (the recurrent missense p.Gly137Arg and an
    in-frame deletion p.Asn290_Ile292del) alter the PKA catalytic subunit alpha
    at surfaces that tether the regulatory subunits, weakening that interaction
    so the holoenzyme is more easily activated by cAMP and PKA activity is
    inappropriately raised.
  genes:
  - preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we found that they lead to PKA holoenzymes which are more sensitive to activation by cAMP than are the wild-type proteins."
    explanation: Functional assays show the variants increase PKA sensitivity to cAMP, the gain-of-function lesion.
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "it shows reduced interaction with the regulatory subunits of PKA (particularly type II), resulting in overactivation of the PKA pathway and/or an inability to initiate Hedgehog signaling."
    explanation: The in-frame deletion reduces regulatory-subunit binding and overactivates PKA, confirming the gain-of-function mechanism for a second allele class.
  downstream:
  - target: Inhibition of Hedgehog Signaling
    causal_link_type: DIRECT
    description: Overactive PKA phosphorylates GLI transcription factors, driving their repressor processing and switching off Hedgehog target genes.
- name: Inhibition of Hedgehog Signaling
  biological_scale: CELLULAR
  description: >-
    PKA is a negative regulator of Hedgehog signaling: it phosphorylates GLI
    transcription factors (GLI3) to promote repressor processing. The CAFD1
    variants keep PKA inappropriately active, so Hedgehog target-gene
    transcription is attenuated. Mutant PRKACA inhibited Hedgehog signaling in
    NIH 3T3 fibroblasts.
  biological_processes:
  - preferred_term: Hedgehog (smoothened) signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "expression of PRKACA or PRKACB variants detected in the affected individuals inhibited hedgehog signaling in NIH 3T3 fibroblasts, thereby providing an underlying mechanism for the developmental defects observed in these cases."
    explanation: Directly demonstrates that the disease variants inhibit Hedgehog signaling, the proposed disease mechanism.
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "When GLI3 is phosphorylated, it undergoes C-terminal processing and becomes a strong repressor of Hedgehog (Hh) signaling."
    explanation: States the PKA-GLI3 step by which raised PKA activity represses Hedgehog signaling.
  downstream:
  - target: Reduced Primary Ciliation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Defective PKA/Hedgehog signaling is accompanied by reduced primary ciliation in patient cells.
  - target: Disrupted Hedgehog-Dependent Developmental Patterning
    causal_link_type: DIRECT
    description: Loss of Hedgehog target-gene activation disrupts morphogen-dependent patterning in multiple developing tissues.
- name: Reduced Primary Ciliation
  biological_scale: CELLULAR
  description: >-
    The primary cilium is the organelle on which Hedgehog signaling is
    transduced; patient-derived induced pluripotent stem cells carrying the
    PRKACA in-frame deletion show reduced ciliation, placing CAFD1 among the
    ciliopathy-associated skeletal dysplasias.
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  evidence:
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Patient-derived induced pluripotent stem cells (iPSCs) have reduced ciliation compared to controls."
    explanation: Measures reduced ciliation in patient cells, the cellular correlate of the ciliopathy phenotype.
  downstream:
  - target: Disrupted Hedgehog-Dependent Developmental Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired ciliary Hedgehog signal transduction contributes to the developmental patterning defect.
- name: Disrupted Hedgehog-Dependent Developmental Patterning
  biological_scale: TISSUE
  description: >-
    Attenuated Hedgehog signaling disrupts patterning and proliferation in
    Hedgehog-dependent progenitors — cardiac cushion cells, growth-plate
    chondrocytes, and craniofacial/ectodermal progenitors — producing the
    cardiac, limb/skeletal, craniofacial and ectodermal features of CAFD1, a
    phenotype resembling Ellis-van Creveld syndrome.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  evidence:
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "consistent with an Ellis-van Creveld syndrome type ciliopathy (atrioventricular septal defects, post-axial polydactyly, short limbs, and ectodermal abnormalities involving nails and teeth)."
    explanation: Summarizes the recognised CAFD1 phenotype that the patterning defect produces.
  downstream:
  - target: Common atrium
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Disrupted Hedgehog-dependent cardiac cushion/atrial septation.
  - target: Atrioventricular septal defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Failure of endocardial cushion fusion during cardiac development.
  - target: Postaxial polydactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Hedgehog patterning controls anteroposterior limb/digit identity.
  - target: Short limbs
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired Hedgehog-dependent growth-plate chondrocyte proliferation and differentiation.
  - target: Brachydactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Digital skeletal patterning defect.
  - target: Dental anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Ectodermal/epithelial-mesenchymal patterning defect in tooth development.
  - target: Nail hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Ectodermal patterning defect in nail matrix.

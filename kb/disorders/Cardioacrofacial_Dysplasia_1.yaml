- name: Inhibition of Hedgehog Signaling
  biological_scale: CELLULAR
  conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
  description: >-
    PKA is a negative regulator of Hedgehog signaling: it phosphorylates GLI
    transcription factors (GLI3) to promote repressor processing. The CAFD1
    variants keep PKA inappropriately active, so Hedgehog target-gene
    transcription is attenuated. Mutant PRKACA inhibited Hedgehog signaling in
    NIH 3T3 fibroblasts.
  biological_processes:
  - preferred_term: Hedgehog (smoothened) signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "expression of PRKACA or PRKACB variants detected in the affected individuals inhibited hedgehog signaling in NIH 3T3 fibroblasts, thereby providing an underlying mechanism for the developmental defects observed in these cases."
    explanation: Directly demonstrates that the disease variants inhibit Hedgehog signaling, the proposed disease mechanism.
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "When GLI3 is phosphorylated, it undergoes C-terminal processing and becomes a strong repressor of Hedgehog (Hh) signaling."
    explanation: States the PKA-GLI3 step by which raised PKA activity represses Hedgehog signaling.
  downstream:
  - target: Disrupted Endocardial Cushion and Atrial Septation
    causal_link_type: DIRECT
    description: Loss of Hedgehog target-gene activation impairs endocardial cushion development and atrial septation during cardiogenesis.
  - target: Impaired Hedgehog-Dependent Skeletal and Limb Patterning
    causal_link_type: DIRECT
    description: Attenuated Hedgehog morphogen output disrupts anteroposterior limb bud patterning and growth-plate chondrocyte differentiation.
  - target: Disrupted Craniofacial and Ectodermal Appendage Patterning
    causal_link_type: DIRECT
    description: Attenuated Hedgehog signaling perturbs midfacial, dental, and nail-matrix ectodermal differentiation.
- name: Reduced Primary Ciliation
  biological_scale: CELLULAR
  description: >-
    Patient-derived induced pluripotent stem cells carrying the PRKACA in-frame
    deletion show reduced ciliation, placing CAFD1 among the
    ciliopathy-associated skeletal dysplasias. The deficit was seen in undifferentiated
    iPSCs but not in iPSC-derived neural crest cells, so it may be cell-type
    dependent.
  biological_processes:

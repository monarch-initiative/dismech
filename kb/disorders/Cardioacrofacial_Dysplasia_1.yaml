prevalence:
- population: Global, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six individuals carrying the recurrent p.Gly137Arg missense variant (summarized across four studies in Liang et al.
    2026) and one individual carrying the de novo p.Asn290_Ile292del in-frame deletion (Weaver et al. 2026) have been
    reported in the peer-reviewed literature; no population prevalence has been estimated.
  evidence:
  - reference: PMID:41810204
    reference_title: "Cardioacrofacial dysplasia 1: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Three studies reporting five cases of cardioacrocervical dysplasia 1 were identified ( 2- 4 ). Table 1 summarizes the core phenotypic and genetic characteristics of all six cases (including the present case)."
    explanation: Literature review summarizing six published cases carrying the recurrent p.Gly137Arg PRKACA variant.
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report an individual with a previously unreported, de novo 3-amino-acid deletion in PRKACA, identified on trio genome sequencing, and phenotypic features including severe neonatal hypotonia, appendicular skeletal abnormalities, osteopenia, aortic dilation, coronary dilation, and vascular tortuosity."
    explanation: Additional single-patient report of an in-frame intragenic PRKACA deletion.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous gain-of-function PRKACA variants cause CAFD1 by a dominant
    mechanism. Most arise de novo; some are transmitted, and germline/parental
    mosaicism (including an asymptomatic mosaic parent) is documented, so
    recurrence risk persists even when parental blood testing is negative.
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In most cases, the mutations arose de novo, and two individuals had offspring with the same condition."
    explanation: Establishes the dominant inheritance pattern with mostly de novo and some transmitted variants (pooled PRKACA/PRKACB cohort).
pathophysiology:
- name: PRKACA Gain-of-Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous PRKACA variants (the recurrent missense p.Gly137Arg and an
    in-frame deletion p.Asn290_Ile292del) alter the PKA catalytic subunit alpha
    at surfaces that tether the regulatory subunits, weakening that interaction
    so the holoenzyme is more easily activated by cAMP. The net effect is raised
    PKA pathway activity; the gain comes from loss of regulatory-subunit
    restraint (ClinGen describes the mechanism as partial loss-of-function at the
    protein level, and the in-frame-deletion protein has lower intrinsic
    catalytic activity) rather than from higher intrinsic catalysis.
  genes:
  - preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we found that they lead to PKA holoenzymes which are more sensitive to activation by cAMP than are the wild-type proteins."
    explanation: Functional assays show the variants increase PKA sensitivity to cAMP, the gain-of-function lesion.
  - reference: PMID:42157491
    reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "it shows reduced interaction with the regulatory subunits of PKA (particularly type II), resulting in overactivation of the PKA pathway and/or an inability to initiate Hedgehog signaling."
    explanation: The in-frame deletion reduces regulatory-subunit binding and overactivates PKA, confirming the gain comes from loss of regulatory restraint.
  downstream:
  - target: Inhibition of Hedgehog Signaling
    causal_link_type: DIRECT
    description: Overactive PKA phosphorylates GLI transcription factors, driving their repressor processing and switching off Hedgehog target genes.
  - target: Reduced Primary Ciliation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient cells carrying a PRKACA variant show reduced primary ciliation; the
      primary cilium is the organelle on which Hedgehog signaling is transduced,
      so this is placed as a parallel consequence of the lesion rather than
      downstream of Hedgehog inhibition.
  - target: Aortic root dilation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed consequence of PRKACA p.Asn290_Ile292del-driven PKA overactivation in the expanded-spectrum case;
      the endothelial or vascular wall intermediates remain unresolved.
    evidence:
    - reference: PMID:42157491
      reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Collectively, this supports that the PRKACA variant is pathogenic, and we propose that it is causal for our patient's unique skeletal dysplasia and vasculopathy phenotypes."
      explanation: Authors attribute the aortic and vascular phenotype of the index deletion case to the PRKACA variant while noting further confirmation is needed.
    - reference: PMID:42157491
      reference_title: "Combined skeletal dysplasia and vasculopathy phenotypes associated with in-frame intragenic deletion in PRKACA."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: "Collectively this, plus lack of any other identified vasculopathy/aortopathy variants in her genome, provides circumstantial evidence that the proband’s vasculopathy phenotype may also be secondary to her PRKACA deletion, although further studies are needed to confirm this association."
      explanation: Provides circumstantial genomic exclusion evidence linking the proband's aortic and vascular phenotype to the PRKACA deletion while noting further confirmation is needed.

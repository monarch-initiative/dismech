name: PRKACA-Related Cardioacrofacial Dysplasia
creation_date: "2026-11-06T19:30:00Z"
description: >-
  Autosomal dominant multiple congenital malformation and skeletal ciliopathy syndrome caused by heterozygous
  gain-of-function variants in PRKACA, encoding the catalytic subunit alpha of cAMP-dependent protein kinase (PKA).
  Causal variants weaken binding between the catalytic and regulatory PKA subunits, raising PKA pathway activity,
  impairing primary ciliation in susceptible cell types, and promoting GLI repressor processing that inhibits ciliary
  Hedgehog signaling during development. Cardinal features resemble Ellis-van Creveld syndrome and include congenital
  heart defects (common atrium or atrioventricular septal defect), postaxial polydactyly, short limbs, brachydactyly,
  short stature, genu valgum, narrow chest, craniofacial dysmorphism, and nail and dental hypoplasia; an expanded
  phenotype with aortic and coronary dilation, arterial tortuosity, osteopenia, and neonatal hypotonia has been
  reported with an in-frame intragenic deletion.
category: Mendelian
synonyms:
- CAFD1
- cardioacrofacial dysplasia 1
- PRKACA-related cardioacrofacial dysplasia

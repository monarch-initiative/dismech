genetic:
- name: PRKACA
  gene_term:
    preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    PRKACA (chromosome 19p13.12) encodes the catalytic subunit alpha of
    cAMP-dependent protein kinase (PKA). Heterozygous gain-of-function variants
    cause autosomal-dominant cardioacrofacial dysplasia 1 (CAFD1, OMIM 619142):
    the recurrent missense c.409G>A (p.Gly137Arg) and an in-frame deletion
    c.870_878del (p.Asn290_Ile292del), both of which weaken PKA binding to its
    regulatory subunits and raise PKA activity. Truncating/loss-of-function variants
    do not cause CAFD1. The paralogous gene PRKACB causes the closely related
    CAFD2 (OMIM 619143) by the same mechanism. Distinct somatic PRKACA
    alterations (the DNAJB1-PRKACA fusion) cause fibrolamellar hepatocellular
    carcinoma, an unrelated entity.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_a4864f8e-3019-440b-b279-e708a77bbeb1-2026-09-02T160000.000Z
    evidence:
    - reference: CGGV:assertion_a4864f8e-3019-440b-b279-e708a77bbeb1-2026-09-02T160000.000Z
      reference_title: "PRKACA / cardioacrofacial dysplasia (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PRKACA | HGNC:9380 | cardioacrofacial dysplasia | MONDO:0031386 | AD | Moderate | SOP12 | Skeletal Disorders Gene Curation Expert Panel | 2026-09-02T16:00:00.000Z"
      explanation: >-
        ClinGen Skeletal Disorders GCEP classifies PRKACA-cardioacrofacial
        dysplasia as Moderate (AD). The assertion is anchored on the broader
        MONDO:0031386 (cardioacrofacial dysplasia); its summary describes the
        CAFD1/OMIM 619142 p.Gly137Arg entity, so it is recorded here.
  variants:
  - name: p.Gly137Arg
    description: >-
      Recurrent missense variant (c.409G>A), the archetypal CAFD1 allele, at a
      conserved regulatory-subunit tethering surface; gain-of-function. All
      classically reported CAFD1 patients to date carry this variant.
  - name: p.Asn290_Ile292del
    description: >-
      In-frame three-amino-acid deletion (c.870_878del) in the alpha-I helix
      substrate-tethering region; reduces type-II regulatory-subunit binding and
      overactivates PKA, with reduced patient-cell ciliation. Its phenotype
      differs from the recurrent missense allele — the single reported patient
      had PDA/PFO rather than AVSD or polydactyly, with skeletal dysplasia plus
      vasculopathy — so it is an expanded-spectrum allele.
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "we identified heterozygous germline or mosaic missense variants in PRKACA or PRKACB."
    explanation: Establishes heterozygous PRKACA variants as the cause of the syndrome.
  notes: >-
    Most reported patients carry constitutional germline (typically de novo) PRKACA variants, so variant_origin is
    recorded as GERMLINE; however, somatic mosaicism in an affected proband and inheritance from mosaic parents have
    also been documented (PMID:33058759; PMID:41810204).
notes: >-
  Cardioacrofacial dysplasia 1 (CAFD1, OMIM 619142; MONDO:0030876) is an
  autosomal-dominant multiple congenital malformation syndrome caused by
  heterozygous gain-of-function variants in PRKACA, the catalytic subunit alpha
  of PKA. The cardinal features are a shared congenital cardiac defect (common
  atrium or atrioventricular septal defect) with postaxial polydactyly, plus
  short limbs, brachydactyly, short stature, genu valgum, a long/narrow thorax,
  craniofacial dysmorphism (midface hypoplasia, micrognathia) and ectodermal
  defects of nails and teeth — an Ellis-van Creveld-like ciliopathy.
  Mechanistically the variants weaken PKA catalytic-regulatory subunit binding,
  raise PKA pathway activity (the gain is from loss of regulatory restraint; the
  in-frame-deletion protein even has lower intrinsic catalysis), and so keep GLI
  transcription factors in their repressor state, inhibiting Hedgehog signaling
  during development; patient iPSCs show reduced ciliation, placing CAFD1 among
  the ciliopathy-associated skeletal dysplasias.

  The founding cohort is Palencia-Campos et al. 2020 (PMID:33058759, Am J Hum
  Genet), seven individuals with germline or mosaic PRKACA/PRKACB variants (three
  carried PRKACA) and functional (BRET/NIH 3T3) evidence for increased cAMP
  sensitivity and Hedgehog inhibition — so the cohort frequency figures cited
  above pool the two genes. Weaver et al. (PMID:42157491) expand the allelic and
  phenotypic spectrum with the in-frame deletion, patient-iPSC reduced ciliation,
  and a single-case skeletal-dysplasia-plus-vasculopathy presentation (aortic and
  coronary dilation, vascular tortuosity, osteopenia, neonatal hypotonia) with a
  surveillance recommendation; those vascular/bone features are recorded as
  expanded-spectrum and are not given a frequency. Liang et al. 2026
  (PMID:41810204) is a pediatric p.Gly137Arg case with short stature, genu
  valgum, polydactyly and dental/nail hypoplasia, plus cardiac and orthopedic
  surgical management. ClinGen classifies PRKACA-cardioacrofacial dysplasia as
  Moderate. Inheritance is dominant with frequent de novo constitutional variants
  alongside occasional mosaic probands and parental mosaicism; because CAFD1 is a
  predominantly germline autosomal-dominant disorder rather than a disorder with
  an obligate or recurrent somatic-mosaic arm, HP:0001442 is not bound on
  inheritance. The paralogous PRKACB disorder CAFD2 (OMIM 619143) shares the
  mechanism. No GeneReviews chapter covers cardioacrofacial dysplasia.

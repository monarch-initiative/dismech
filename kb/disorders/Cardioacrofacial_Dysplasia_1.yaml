genetic:
- name: PRKACA
  gene_term:
    preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    PRKACA (chromosome 19p13.12) encodes the catalytic subunit alpha of
    cAMP-dependent protein kinase (PKA). Heterozygous gain-of-function variants
    cause autosomal-dominant cardioacrofacial dysplasia 1 (CAFD1, OMIM 619142):
    the recurrent missense c.409G>A (p.Gly137Arg) and an in-frame deletion
    c.870_878del (p.Asn290_Ile292del), both of which weaken PKA regulatory-
    subunit binding and raise PKA activity. Truncating/loss-of-function variants
    do not cause CAFD1. The paralogous gene PRKACB causes the closely related
    CAFD2 (OMIM 619143) by the same mechanism. Distinct somatic PRKACA
    alterations (the DNAJB1-PRKACA fusion) cause fibrolamellar hepatocellular
    carcinoma, an unrelated entity.
  variants:
  - name: p.Gly137Arg
    description: >-
      Recurrent missense variant (c.409G>A), the archetypal CAFD1 allele, at a
      conserved regulatory-subunit tethering surface; gain-of-function.
  - name: p.Asn290_Ile292del
    description: >-
      In-frame three-amino-acid deletion (c.870_878del) in the alpha-I helix
      substrate-tethering region; reduces type-II regulatory-subunit binding and
      overactivates PKA, with reduced patient-cell ciliation.
  evidence:
  - reference: PMID:33058759
    reference_title: "Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "we identified heterozygous germline or mosaic missense variants in PRKACA or PRKACB."
    explanation: Establishes heterozygous PRKACA variants as the cause of the syndrome.
notes: >-
  Cardioacrofacial dysplasia 1 (CAFD1, OMIM 619142; MONDO:0030876) is an
  autosomal-dominant multiple congenital malformation syndrome caused by
  heterozygous gain-of-function variants in PRKACA, the catalytic subunit alpha
  of PKA. The cardinal features are a shared congenital cardiac defect (common
  atrium or atrioventricular septal defect) with postaxial polydactyly, plus
  short limbs, brachydactyly and ectodermal defects of nails and teeth, a
  picture resembling Ellis-van Creveld syndrome. Mechanistically the variants
  weaken PKA catalytic-regulatory subunit binding, raise PKA activity/cAMP
  sensitivity, and so keep GLI transcription factors in their repressor state,
  inhibiting Hedgehog signaling during development; patient iPSCs show reduced
  ciliation, placing CAFD1 among the ciliopathy-associated skeletal dysplasias.

  The founding cohort is Palencia-Campos et al. 2020 (PMID:33058759, Am J Hum
  Genet), seven individuals with germline or mosaic PRKACA/PRKACB variants and
  functional (BRET/NIH 3T3) evidence for increased cAMP sensitivity and Hedgehog
  inhibition. Weaver et al. (PMID:42157491) expand the allelic and phenotypic
  spectrum with an in-frame deletion, patient-iPSC reduced ciliation, and a
  skeletal-dysplasia-plus-vasculopathy presentation. Inheritance is dominant
  with frequent de novo variants and documented parental/germline mosaicism; by
  the somatic-mosaicism convention parental mosaicism is not bound to HP:0001442.
  The paralogous PRKACB disorder CAFD2 (OMIM 619143) shares the mechanism. No
  GeneReviews chapter covers cardioacrofacial dysplasia.

genetic:
- name: TGFBR1 Mutations (LDS Type 1)
  association: Causative
  subtype: Loeys-Dietz Syndrome Type 1
  notes: >
    Heterozygous mutations in TGFBR1 encoding TGF-beta receptor type I.
    Most mutations cluster in the serine/threonine kinase domain. Accounts
    for 20-25% of LDS cases. Pathogenic variants act through a mixture of
    haploinsufficiency and, for a subset of kinase-domain missense
    variants, dominant-negative interference with the wild-type receptor.
  variants:
  - name: Missense mutations in kinase domain (TGFBR1)
    description: >
      Missense mutations in the intracellular kinase domain of TGFBR1
      that impair receptor signaling.
  - name: Dominant-negative kinase-domain missense variants (e.g., K232R, R487P)
    description: >
      A subset of TGFBR1 missense variants, including K232R and R487P, do
      not simply inactivate the receptor but also interfere with the
      function of the co-expressed wild-type receptor, i.e. a
      dominant-negative effect layered on top of haploinsufficiency.
    evidence:
    - reference: PMID:40612107
      reference_title: "Decoding clinical diversity in monogenic TGFBR1 and TGFBR2 mutations: insights into the interplay of molecular mechanisms and hypomorphicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        some mutations in TGFBR1, such as K232R and R487P, are not merely
        inactivating but also exert a dominant-negative impact on the
        function of the receptor in LDS
      explanation: >-
        This review reports that specific TGFBR1 kinase-domain missense
        variants (K232R, R487P) exert a dominant-negative effect on the
        wild-type receptor, distinct from simple haploinsufficiency. The
        underlying finding (Cardoso et al. 2012, cited directly below) is
        a cell-transfection functional assay, not a clinical observation,
        so this is graded IN_VITRO rather than HUMAN_CLINICAL.
    - reference: PMID:22414221
      reference_title: "TGFBR1 mutations associated with Loeys-Dietz syndrome are inactivating."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In co-transfection experiments with equal amounts wild-type
        receptor, the LDS mutations were found to confer a modest
        dominant negative effect.
      explanation: >-
        Cardoso et al. 2012 is the primary study underlying the review's
        K232R/R487P claim above: seven LDS-associated TGFBR1 missense
        substitutions were tested by co-transfection with wild-type
        receptor in HEK293 cells, and a modest dominant-negative effect
        was measured. The cached abstract does not itself name the
        individual substitutions tested, so this item is cited to
        directly support the general dominant-negative finding rather
        than to independently confirm the K232R/R487P attribution.
  evidence:
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a mutation in TGFBR1 or TGFBR2 in all probands with typical
      Loeys-Dietz syndrome (type I) and in 12 probands presenting with
      vascular Ehlers-Danlos syndrome (Loeys-Dietz syndrome type II)
    explanation: >-
      100% of typical LDS probands had TGFBR1 or TGFBR2 mutations.
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFBR1 | transforming growth factor beta receptor 1 | hgnc:11772 | Disease-causing germline mutation(s) in"
    explanation: Orphanet curates TGFBR1 as a disease-causing gene for Loeys-Dietz syndrome.
- name: TGFBR2 Mutations (LDS Type 2)
  association: Causative
  subtype: Loeys-Dietz Syndrome Type 2
  notes: >
    Heterozygous mutations in TGFBR2 encoding TGF-beta receptor type II.
    Mutations primarily affect the kinase domain. Most common genetic cause,
    accounting for 55-60% of LDS cases.
  variants:
  - name: Missense mutations in kinase domain (TGFBR2)
    description: >
      Missense mutations affecting the kinase domain of TGFBR2.
  evidence:
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in either TGFBR1 or TGFBR2 predispose patients to
      aggressive and widespread vascular disease
    explanation: >-
      Loeys et al. establish TGFBR2 mutations as causative for LDS.
  - reference: PMID:29270370
    reference_title: "Differences in manifestations of Marfan syndrome, Ehlers-Danlos syndrome, and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDS type 2 TGFBR2 55–60%"
    explanation: >-
      Sources the 55-60% share of LDS cases stated in these notes, from the
      review's LDS subtype table, which gives TGFBR1/LDS1 20-25% over the same
      series.
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFBR2 | transforming growth factor beta receptor 2 | hgnc:11773 | Disease-causing germline mutation(s) in"
    explanation: Orphanet curates TGFBR2 as a disease-causing gene for Loeys-Dietz syndrome.
- name: SMAD3 Mutations (LDS Type 3)
  association: Causative
  notes: >
    Heterozygous mutations in SMAD3, an intracellular mediator of
    TGF-beta signaling. Associated with aneurysms-osteoarthritis syndrome.
  evidence:
  - reference: PMID:21217753
    reference_title: "Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with early-onset osteoarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the disease is caused by mutations in SMAD3. This gene encodes
      a member of the TGF-beta pathway that is essential for TGF-beta
      signal transmission
    explanation: >-
      van de Laar et al. identified SMAD3 as the causal gene for
      the aneurysms-osteoarthritis syndrome (LDS type 3).
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome (Orphanet structured-database record)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SMAD3 | SMAD family member 3 | hgnc:6769 | Disease-causing germline mutation(s) in"
    explanation: Orphanet curates SMAD3 as a disease-causing gene for Loeys-Dietz syndrome.
- name: TGFB2 Mutations (LDS Type 4)
  association: Causative
  notes: >
    Heterozygous mutations in TGFB2 encoding TGF-beta 2 ligand.
    Chromosome deletions encompassing TGFB2 causing haploinsufficiency
    are sufficient to cause LDS features.
  evidence:
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosome deletions encompassing the TGFB2 gene (and hypothetically
      the SMAD3 gene) causing haploinsufficiency are sufficient to cause
      features of LDS
    explanation: >-
      MacCarrick et al. describe TGFB2 haploinsufficiency as sufficient

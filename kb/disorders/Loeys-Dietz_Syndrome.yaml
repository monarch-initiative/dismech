has_subtypes:
- name: Loeys-Dietz Syndrome Type 1
  display_name: Loeys-Dietz Syndrome Type 1 (TGFBR1)
  subtype_term:
    preferred_term: Loeys-Dietz syndrome 1
    term:
      id: MONDO:0012212
      label: Loeys-Dietz syndrome 1
  genes:
  - preferred_term: TGFBR1
    term:
      id: hgnc:11772
      label: TGFBR1
  subtype_frequency: "20-25%"
  description: >
    Caused by heterozygous mutations in TGFBR1, encoding the TGF-beta
    receptor type I kinase; most mutations cluster in the intracellular
    serine/threonine kinase domain and act through a mixture of
    haploinsufficiency and dominant-negative interference with the
    wild-type receptor rather than a single uniform mechanism. Often
    presents with more severe craniofacial features including
    craniosynostosis. Earlier cardiovascular surgery (mean age 16.9 years)
    and death (22.6 years) compared to type 2. Despite this, aortic
    specimens from TGFBR1-mutated individuals show a milder grade of
    cystic medial necrosis at histopathology than TGFBR2-mutated
    specimens, and a gene-based severity ranking places LDS1 among the
    more severe subtypes together with LDS2 (LDS1 = LDS2 > LDS3 > LDS4 >
    LDS5).
  evidence:
  - reference: PMID:40612107
    reference_title: "Decoding clinical diversity in monogenic TGFBR1 and TGFBR2 mutations: insights into the interplay of molecular mechanisms and hypomorphicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a splice donor site variation in intron 5 (c.973 + 1 G>A) in a
      familial case of LDS was defined
    explanation: >-
      This review reports the clinical/genetic identification of a
      TGFBR1 splice-donor variant (c.973+1G>A) in a familial LDS case.
      This snippet establishes only that identification; the same source
      explicitly contrasts this specific variant against
      haploinsufficiency and instead anticipates a dominant-negative
      mechanism for it (see the COMPUTATIONAL evidence item immediately
      below).
  - reference: PMID:40612107
    reference_title: "Decoding clinical diversity in monogenic TGFBR1 and TGFBR2 mutations: insights into the interplay of molecular mechanisms and hypomorphicity."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      It is anticipated that this mutation will have a dominant-negative
      effect by causing the in-frame deletion of exon five within the
      STK domain
    explanation: >-
      The dominant-negative consequence of this splice-donor variant is
      described as "anticipated" -- a predicted structural effect of the
      in-frame exon-5 deletion on the kinase domain, not a directly
      measured receptor-interference result, so this is graded as an
      inferred/predicted claim rather than direct clinical or
      experimental evidence.
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with TGFBR2 mutations revealed grade III cystic medial
      necrosis (CMN), whereas 67% of patients with TGFBR1 mutations
      showed CMN (p = 0.033) and only one patient had grade III (p
      <0.001).
    explanation: >-
      Comparative histopathology of surgical aortic specimens shows that
      TGFBR1-mutated (LDS1) aortas have a milder grade of cystic medial
      necrosis than TGFBR2-mutated (LDS2) aortas, a histological
      distinction between the two most common LDS subtypes.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This advised the subdivision of LDS into multiple classes based on
      the causative gene (LDS1-5) providing a general indication of the
      spectrum of disease severity, from most to least severe form:
      LDS1=LDS2>LDS3>LDS4>LDS5
    explanation: >-
      Establishes the gene-based severity ranking that places TGFBR1-related
      LDS1 among the two most severe LDS subtypes.
- name: Loeys-Dietz Syndrome Type 2
  display_name: Loeys-Dietz Syndrome Type 2 (TGFBR2)
  subtype_term:
    preferred_term: Loeys-Dietz syndrome 2
    term:
      id: MONDO:0012427
      label: Loeys-Dietz syndrome 2
  genes:
  - preferred_term: TGFBR2
    term:
      id: hgnc:11773
      label: TGFBR2
  subtype_frequency: "55-60%"
  description: >
    Caused by heterozygous mutations in TGFBR2, encoding the TGF-beta receptor
    type II. Characterized kinase-domain variants impair canonical SMAD2/3
    signaling and act through dominant-negative interference with the receptor
    complex rather than simple haploinsufficiency, which a Tgfbr2 knockin mouse
    corroborates in vivo. Aortic disease is severe: aortic specimens from
    TGFBR2-mutated individuals show uniformly higher-grade cystic medial
    necrosis than TGFBR1-mutated specimens, a paediatric TGFBR2 cohort showed
    larger aortic z-scores and stiffer, less distensible aortas at the annulus,
    sinotubular junction and ascending aorta than its TGFBR1 comparator, and the
    gene-based severity ranking places LDS2 alongside LDS1 as the most severe
    classes (LDS1 = LDS2 > LDS3 > LDS4 > LDS5). Female TGFBR2 carriers were a
    higher-risk group for aortic dissection after initial surgery in one
    surgical series. An allele-specific ocular association has been reported for
    TGFBR2 Arg528 missense variants, which in two cases produced a familial
    exudative vitreoretinopathy-like retinal phenotype; this is not established
    as a general LDS2 feature. Two older descriptive claims are retained from
    the original entry but must be read with their provenance: "more prominent
    cutaneous features and phenotypic overlap with vascular Ehlers-Danlos
    syndrome", and later cardiovascular surgery (mean age 26.9 years) and death
    (31.8 years) than type 1, both derive from Loeys et al. 2006's
    *clinically* defined type II cohort - selected for a vascular-Ehlers-Danlos-like,
    craniofacially spared presentation - and not from a TGFBR2-genotyped cohort.
    They should not be read as showing that TGFBR2 disease is milder or
    craniofacially spared: the paediatric genotyped comparison above found
    craniofacial features similar in the TGFBR1 and TGFBR2 groups. Nosology
    note: "type 2" has a modern gene-based sense (the TGFBR2 class of the LDS1-6
    gene series, used here and by MONDO:0012427 / OMIM:610168) and an older
    gene-agnostic clinical sense from Loeys et al. 2006; see review_notes for
    why MONDO's free-text definition still names both receptor genes.
  review_notes: >-
    Gene-binding rationale, recorded so the MONDO free-text definition is not
    re-inherited by a later curator. MONDO:0012427's definition, imported from
    NCIT:C114768, states the disorder is "caused by mutations in either the
    TGFBR1 or TGFBR2 gene", which conflicts with OMIM:610168 being the TGFBR2
    entry. The conflict is a stale-import artifact, not a real disagreement.
    MONDO's logical definition is unambiguous - intersection_of MONDO:0018954
    and RO:0004003 some HGNC:11773 - and it carries the
    MONDO:patterns/disease_series_by_gene synonyms "TGFBR2 Loeys-Dietz syndrome"
    and "Loeys-Dietz syndrome caused by mutation in TGFBR2", plus xref
    OMIM:610168. The free-text prose instead preserves the older clinical sense
    of "Loeys-Dietz syndrome type II" from Loeys et al. 2006 (PMID:16928994),
    which denoted a craniofacially spared, vascular-Ehlers-Danlos-like
    presentation and was explicitly gene-agnostic - probands of both clinical
    types carried TGFBR1 or TGFBR2 mutations. That is why the definition names
    both genes. dismech binds this subtype to TGFBR2, following the logical
    definition, the OMIM xref and the gene series.
  evidence:
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a mutation in TGFBR1 or TGFBR2 in all probands with typical
      Loeys-Dietz syndrome (type I) and in 12 probands presenting with
      vascular Ehlers-Danlos syndrome (Loeys-Dietz syndrome type II)
    explanation: >-
      Sources the historical, purely clinical sense of "Loeys-Dietz syndrome
      type II" - a vascular-Ehlers-Danlos-like presentation - and shows it was
      gene-agnostic, with probands of both types carrying TGFBR1 or TGFBR2
      mutations. This is the origin of the "either TGFBR1 or TGFBR2" wording in
      MONDO:0012427's imported free-text definition, recorded here so the
      historical clinical sense is not mistaken for the modern gene-based one
      this subtype is bound to.
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with Loeys-Dietz syndrome type I, as compared with those with
      type II, underwent cardiovascular surgery earlier (mean age, 16.9 years
      vs. 26.9 years) and died earlier (22.6 years vs. 31.8 years)
    explanation: >-
      Sources the mean age at cardiovascular surgery (26.9 years) and at death
      (31.8 years) quoted in this subtype description. These figures come from
      the clinically defined type II cohort quoted in the item above, not from a
      TGFBR2-genotyped cohort, which is why the description flags their
      provenance rather than presenting them as a TGFBR2 genotype effect.
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with TGFBR2 mutations revealed grade III cystic medial
      necrosis (CMN), whereas 67% of patients with TGFBR1 mutations showed CMN
    explanation: >-
      Comparative histopathology of surgical aortic specimens shows uniformly
      grade III cystic medial necrosis in TGFBR2-mutated (LDS2) aortas against
      a lower grade in TGFBR1-mutated specimens, supporting the more severe
      medial degeneration attributed to LDS2 here.
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The freedom from aortic dissection (AD) after the initial surgery was also
      lower in female patients with TGFBR2 mutation than in other patients (p =
      0.025)
    explanation: >-
      Supports the sex-specific dissection risk stated in the description, and
      is quoted from the RESULTS rather than the abstract conclusion on purpose.
      Graded PARTIAL because this is a subanalysis of six female TGFBR2 patients
      in a single-centre series of 22. The paper's conclusion also asserts that
      reoperation was more frequent in this group, but its own results report
      that comparison as a non-significant trend (p = 0.08, log-rank) with no
      difference between the TGFBR1 and TGFBR2 groups overall (p = 0.19), so the
      reoperation half of that conclusion is deliberately not curated here.
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paediatric LDS patients with TGFBR2 present with more severe
      cardiovascular phenotypes than patients with TGFBR1 with larger aortic
      dimensions and increased aortic stiffness
    explanation: >-
      A paediatric echocardiographic cohort (TGFBR1 n = 17 vs TGFBR2 n = 15)
      supports the larger aortic dimensions and increased aortic stiffness
      attributed to LDS2 relative to LDS1. Single-centre and retrospective, so
      the description attributes it to one cohort rather than generalizing.
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with TGFBR2 also had significantly lower aortic distensibility
      and strain coupled with higher stiffness index at the level of the
      annulus, sinotubular junction, and ascending aorta
    explanation: >-
      Sources the reduced-distensibility half of the aortic-mechanics claim,
      which the summary conclusion quote above does not itself quantify. The
      quote is carried to its anatomical qualifier because the effect was found
      at the annulus, sinotubular junction and ascending aorta, not throughout
      the aorta.
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of arterial tortuosity, craniofacial features, pectus
      deformities, dural ectasia, and scoliosis was similar between the groups
    explanation: >-
      Supports the caveat that TGFBR2 disease should not be treated as
      craniofacially spared. In this genotyped paediatric comparison
      craniofacial features were similar in the TGFBR1 and TGFBR2 groups, which
      is the counterweight to inheriting the craniofacially spared framing of
      Loeys 2006's clinically defined type II into a gene-defined TGFBR2 block.
  - reference: PMID:29270370
    reference_title: "Differences in manifestations of Marfan syndrome, Ehlers-Danlos syndrome, and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDS type 2 TGFBR2 55–60%"
    explanation: >-
      Sources the subtype_frequency recorded on this subtype. The review's LDS
      subtype table gives TGFBR2/LDS2 the largest share of the gene-defined
      series at 55-60%, against 20-25% for TGFBR1/LDS1 - the same figures the
      sibling LDS1 subtype and the TGFBR2 genetic block carry, so the three are
      now consistent and traceable to a cached primary source.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of variants affected the TGFBR1 (9/24) and TGFBR2 (10/24) genes"
    explanation: >-
      Independent single-cohort corroboration that TGFBR2 is the most frequently
      affected LDS gene: 10 of 24 novel families, about 42%, the largest
      single-gene share in that series. Recorded as consistent with, not as the
      source of, the 55-60% subtype_frequency, which comes from the
      PMID:29270370 subtype table.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "from most to least severe form: LDS1=LDS2>LDS3>LDS4>LDS5"
    explanation: >-
      Sources the gene-based severity ranking that places LDS2 alongside LDS1 as
      the most severe of the gene-defined LDS classes, the counterweight to the
      later-event figures from the clinically defined type II cohort. Graded
      PARTIAL because this paper is restating a ranking it attributes to an
      earlier reference rather than deriving it, and it also concludes that a
      phenotypic continuum with significant TGFBR1/TGFBR2 overlap emerges as
      more patients are described.
  - reference: PMID:28679693
    reference_title: "Functional validation reveals the novel missense V419L variant in TGFBR2 associated with Loeys-Dietz syndrome (LDS) impairs canonical TGF-beta signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      V419L significantly delayed SMAD2 phosphorylation by western blot and
      significantly decreased TGF-β-induced gene transcription by reporter
      assays consistent with known pathogenic variants in this gene
    explanation: >-
      Cell-based functional validation of a TGFBR2 kinase-domain variant
      (c.1255G>T, p.Val419Leu) supports the impaired canonical SMAD2/3 signaling
      attributed to characterized kinase-domain TGFBR2 mutations here.
  - reference: PMID:21098638
    reference_title: "Quantitative analysis of TGFBR2 mutations in Marfan-syndrome-related disorders suggests a correlation between phenotypic severity and Smad signaling activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A dominant-negative effect was demonstrated for mutations associated
      with LDS and MFS2
    explanation: >-
      Quantitative signaling assays across nine TGFBR2 mutations support the
      dominant-negative mechanism attributed to LDS2 here, in preference to
      simple haploinsufficiency.
  - reference: PMID:24355923
    reference_title: "Angiotensin II-dependent TGF-beta signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated 2 knockin mouse strains with LDS mutations in either Tgfbr1
      or Tgfbr2 and a transgenic mouse overexpressing mutant Tgfbr2. Knockin and
      transgenic mice, but not haploinsufficient animals, recapitulated the LDS
      phenotype
    explanation: >-
      Knockin and transgenic animals reproduce the LDS phenotype while
      haploinsufficient animals do not, corroborating in vivo that LDS is not a
      simple loss-of-one-copy mechanism. The quote is carried back to the
      sentence naming the strains so it is visible that a Tgfbr1 knockin was
      generated alongside the Tgfbr2 knockin and transgenic, and that this
      sentence does not by itself isolate TGFBR2. Model-organism evidence,
      offered only as mechanistic corroboration of the dominant-negative claim,
      not as support for any human phenotype.
  - reference: PMID:41024485
    reference_title: "A genotype to phenotype relationship of exudative vitreoretinopathy in Loeys-Dietz syndrome due to a pathogenic variant in TGFBR2."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the second reported case of a missense variant at the amino acid
      residue 528 (Arg528) of TGFBR2 that results in a FEVR-like phenotype in
      a LDS patient
    explanation: >-
      Sources the allele-specific ocular association stated in the description -
      TGFBR2 Arg528 missense variants and a familial-exudative-vitreoretinopathy-like
      retinal phenotype. Graded PARTIAL because the association rests on only
      two reported cases at this residue and is not established as a general
      LDS2 feature; it is curated as an allele-specific observation, not a
      subtype-level phenotype.
- name: Loeys-Dietz Syndrome Type 3
  display_name: Loeys-Dietz Syndrome Type 3 (SMAD3)
  subtype_term:
    preferred_term: aneurysm-osteoarthritis syndrome
    term:
      id: MONDO:0013426
      label: aneurysm-osteoarthritis syndrome
  genes:
  - preferred_term: SMAD3
    term:
      id: hgnc:6769
      label: SMAD3
  description: >
    Caused by mutations in SMAD3. Associated with early-onset osteoarthritis
    (aneurysms-osteoarthritis syndrome) and increased prevalence of mitral
    valve prolapse.
  review_notes: >-
    Full curation for this subtype (phenotypes, pathophysiology, evidence)
    lives in the standalone entry `kb/disorders/Aneurysm-Osteoarthritis_Syndrome.yaml`
    (MONDO:0013426), which predates and is richer than this row. This stub is
    kept as a term-bound cross-reference rather than duplicated content while
    the umbrella-vs-standalone authoritative locus for per-type LDS detail
    remains an open curation decision.
- name: Loeys-Dietz Syndrome Type 4
  display_name: Loeys-Dietz Syndrome Type 4 (TGFB2)
  subtype_term:
    preferred_term: Loeys-Dietz syndrome 4
    term:
      id: MONDO:0013897
      label: Loeys-Dietz syndrome 4
  genes:
  - preferred_term: TGFB2
    term:
      id: hgnc:11768
      label: TGFB2
  description: >
    Caused by heterozygous mutations in TGFB2. The vascular course is
    generally milder and later-onset than TGFBR1/TGFBR2-related disease
    (aneurysms typically apparent in the fourth decade), but articular and
    skeletal involvement is prevalent and can dominate the presentation even
    in the absence of any vascular event.
  evidence:
  - reference: PMID:25163805
    reference_title: "Further delineation of Loeys-Dietz syndrome type 4 in a family with mild vascular involvement and a TGFB2 splicing mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      loss-of-function mutations in TGFB2 gene do not always lead to
      aggressive vascular phenotypes and that articular and skeletal signs
      are prevalent
    explanation: >-
      Corrects a prior version of this stub, which stated LDS4 has "lower
      prevalence of musculoskeletal involvement" - the transposed opposite of
      this paper's conclusion: articular/skeletal signs are prevalent and can
      be the only presenting feature, while it is the vascular phenotype that
      is comparatively mild.
  review_notes: >-
    Full curation for this subtype lives in the standalone entry
    `kb/disorders/Loeys-Dietz_Syndrome_4.yaml` (MONDO:0013897). This stub is
    kept as a term-bound cross-reference while the umbrella-vs-standalone
    authoritative locus for per-type LDS detail remains an open curation
    decision.

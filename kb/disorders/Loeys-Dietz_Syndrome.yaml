differential_diagnoses:
- name: Marfan Syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    Autosomal dominant connective tissue disorder caused by FBN1 mutations
    encoding fibrillin-1. It shares aortic root aneurysm, scoliosis, pectus
    deformity, arachnodactyly and increased aortic-wall TGF-beta signaling with
    Loeys-Dietz syndrome, and both conform to the
    aortopathy_tgfbeta_dysregulation module, making it the principal alternative
    diagnosis when an aortopathy with marfanoid habitus is evaluated.
  distinguishing_features:
  - Ectopia lentis is a cardinal diagnostic feature of Marfan syndrome under the revised Ghent nosology and was absent in every proband of the original Loeys-Dietz cohort (0/16), so lens dislocation argues for Marfan syndrome.
  - Hypertelorism, bifid uvula or cleft palate, and generalized arterial tortuosity are characteristic of Loeys-Dietz syndrome and are not associated with Marfan syndrome.
  - Aneurysm and dissection in Loeys-Dietz syndrome occur at younger ages, at smaller aortic diameters, and throughout the arterial tree rather than being centered on the aortic root, warranting earlier surgical intervention than in Marfan syndrome.
  - Molecular testing is definitive - FBN1 in Marfan syndrome versus a TGF-beta pathway gene in Loeys-Dietz syndrome (TGFBR1, TGFBR2, SMAD3, TGFB2, TGFB3, SMAD2, IPO8).
  evidence:
  - reference: PMID:20591885
    reference_title: "The revised Ghent nosology for the Marfan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "aortic root aneurysm and ectopia lentis are the cardinal clinical features"
    explanation: The revised Ghent nosology makes ectopia lentis a cardinal Marfan criterion, providing the positive finding that redirects the differential away from Loeys-Dietz syndrome.
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ectopia lentis 0/16 (0%) Typical 1/15"
    explanation: The original cohort's comparison table records ectopia lentis in 0 of 16 Loeys-Dietz probands while listing it as typical for Marfan syndrome.
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is characterized by the triad of arterial tortuosity and aneurysms, hypertelorism, and bifid uvula or cleft palate and is caused by heterozygous mutations in the genes encoding transforming growth factor beta receptors 1 and 2"
    explanation: Establishes the craniofacial and vascular triad plus the TGFBR1/TGFBR2 etiology that separate Loeys-Dietz syndrome from FBN1-related Marfan syndrome.
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "show more widespread and/or aggressive vascular disease when compared with Marfan syndrome"
    explanation: The management primer states directly that the Loeys-Dietz genes produce more widespread and aggressive vascular disease than Marfan syndrome, which is why the distinction changes surveillance and surgical thresholds.
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the increased risk of aortic dissection at or above the 5.0-cm aortic root dimension in Marfan syndrome, dissections have occurred in individuals with LDS 1, 2, or 3 at aortic dimensions of 3.9–4.0 cm"
    explanation: Sources the smaller-diameter and earlier-surgery half of this distinguishing feature, which the more general aggressive-vascular-disease quote above does not establish. The primer contrasts the 5.0-cm Marfan threshold against Loeys-Dietz dissections at 3.9-4.0 cm.
  notes: >-
    Historical nosology note. TGFBR2-related aortopathy was originally labelled
    "Marfan syndrome type 2" (MFS2) after the second Marfan-overlapping locus was
    mapped to 3p24.2-p25, and reviews as recent as 2020 still present
    TGFBR1/TGFBR2 disease as a Marfan subtype. MONDO obsoleted that entity -
    MONDO:0017308 "obsolete Marfan syndrome type 2", subset speculative,
    definition "OBSOLETE. Hypothesized form of Marfan; dubious" - with no
    replacement term, and MONDO retired it as a dubious entity rather than
    asserting equivalence to Loeys-Dietz syndrome. The obsolete CURIE must not be
    cited as a term anywhere in the knowledge base. dismech models Loeys-Dietz
    syndrome as its own Disease entry and a sibling member of the
    Heritable_Thoracic_Aortic_Disease grouping, never as a Marfan subtype.
treatments:
- name: Prophylactic Aortic Root Replacement
  description: >
    Valve-sparing aortic root replacement at lower thresholds than Marfan
    syndrome. For adults with LDS 1/2, surgical repair is recommended at
    4.0 cm maximal aortic root dimension. For children, aggressive medication
    may delay surgery until aortic annulus reaches 2.0-2.2 cm.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    located_in:
      preferred_term: aorta
      term:
        id: UBERON:0000947
        label: aorta
  evidence:
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For adults with LDS 1 or 2, this includes surgical repair of the
      aortic root once the maximal dimension of the aortic root reaches
      4.0 cm
    explanation: >-
      MacCarrick et al. recommend surgical threshold of 4.0 cm for
      adult LDS patients, lower than the 5.0 cm for Marfan syndrome.
  - reference: PMID:16928994
    reference_title: "Aneurysm syndromes caused by mutations in the TGF-beta receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 59 vascular surgeries in the cohort, with one death during
      the procedure. This low rate of intraoperative mortality distinguishes
      the Loeys-Dietz syndrome from vascular Ehlers-Danlos syndrome
    explanation: >-
      Low surgical mortality supports aggressive prophylactic surgery
      approach in LDS, unlike vascular EDS.
- name: Losartan/ARB Therapy
  description: >
    Angiotensin receptor blockers (particularly losartan) are used to
    reduce TGF-beta signaling. Losartan was shown to prevent aortic aneurysm
    in a mouse model by antagonizing TGF-beta through AT1 receptor blockade.
    Optimal dosing: 2.0 mg/kg/day for children, 100 mg/day for adults.
  evidence:
  - reference: PMID:16601194
    reference_title: "Losartan, an AT1 antagonist, prevents aortic aneurysm in a mouse model of Marfan syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      aortic aneurysm in a mouse model of MFS is associated with increased
      TGF-beta signaling and can be prevented by TGF-beta antagonists such
      as TGF-beta-neutralizing antibody or the angiotensin II type 1
      receptor (AT1) blocker, losartan
    explanation: >-
      Habashi et al. provide the mechanistic rationale for losartan therapy
      in TGF-beta pathway disorders.
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Angiotensin receptor blockers may be particularly beneficial due to
      their effects on the TGF-beta signaling cascade
    explanation: >-
      Clinical guidelines support ARB use for their pathway-specific effects
      beyond blood pressure reduction.
- name: Beta-Blocker Therapy
  description: >
    Beta-blockers to reduce hemodynamic stress on the aorta. Standard-of-care
    for syndromic aneurysm conditions, often used in combination with ARBs.
  evidence:
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Beta-Blockade to reduce hemodynamic stress on the vasculature has been
      the standard-of-care treatment for individuals with syndromic aneurysm
      conditions
    explanation: >-
      Beta-blockers are established standard of care for LDS vascular management.
- name: Comprehensive Vascular Surveillance
  description: >
    Regular MRA or CTA imaging of the entire arterial tree from head to pelvis,
    as aneurysms can occur throughout the vascular system. Full vascular imaging
    at initial evaluation and at 2-year intervals if no aneurysms identified.
  evidence:
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic or baseline vascular imaging through magnetic resonance
      angiography or computerized tomography angiography with
      three-dimensional reconstruction of the head, neck, chest, abdomen,
      and pelvis should be performed
    explanation: >-
      MacCarrick et al. recommend comprehensive head-to-pelvis imaging
      for all LDS patients.
  - reference: PMID:36334952
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      provides recommendations to guide clinicians in the diagnosis, genetic
      evaluation and family screening, medical therapy, endovascular and
      surgical treatment, and long-term surveillance of patients with aortic
      disease across its multiple clinical presentation subsets
    explanation: >-
      The 2022 ACC/AHA aortic disease guideline is the current society standard
      for long-term aortic surveillance and family screening governing the
      heritable thoracic aortopathy of Loeys-Dietz syndrome.
animal_models:
- name: Tgfbr1 M318R/+ knock-in mouse (LDS Type 1)
  species: Mouse
  genotype: Tgfbr1 M318R/+ knock-in (heterozygous kinase-domain missense)
  publication: PMID:24355923
  modeled_mechanisms:
  - target: Paradoxical TGF-beta Signaling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A TGFBR1-specific (LDS type 1) knock-in mouse carrying the human
      M318R kinase-domain missense mutation recapitulates the LDS vascular
      phenotype, unlike simple Tgfbr1 haploinsufficiency, and reproduces
      the paradoxical in vivo increase in aortic-wall TGF-beta/SMAD2
      signaling despite diminished receptor response to exogenous ligand
      in vitro.
    limitations: >-
      The knock-in strain models a single TGFBR1 kinase-domain missense
      allele (M318R); the same study also generated a parallel Tgfbr2
      knock-in strain and a Tgfbr2-overexpressing transgenic line, so some
      reported findings (e.g. losartan responsiveness) reflect the shared
      LDS mechanism across both receptor genotypes rather than a
      TGFBR1-exclusive result.
    readouts:
    - name: Aortic-wall Smad2 phosphorylation and TGF-beta target-gene output
      target: Paradoxical TGF-beta Signaling
      direction: INCREASED
      interpretation: >-
        Progressive upregulation of Smad2 phosphorylation and TGF-beta
        target-gene output in the aortic wall paralleled worsening
        aneurysm pathology in vivo, supporting a paradoxical signaling
        increase rather than the diminished signaling predicted from the
        receptor mutation alone.
      evidence:
      - reference: PMID:24355923
        reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Analysis of TGF-β signaling in the aortic wall in vivo revealed
          progressive upregulation of Smad2 phosphorylation and TGF-β
          target gene output, which paralleled worsening of aneurysm
          pathology
        explanation: >-
          Directly measures the paradoxical in vivo TGF-beta/SMAD2
          signaling increase this node asserts, in a TGFBR1 (LDS1)
          knock-in strain.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockin and transgenic mice, but not haploinsufficient animals,
        recapitulated the LDS phenotype.
      explanation: >-
        Establishes that the Tgfbr1 M318R/+ knock-in mouse, unlike a
        simple haploinsufficient allele, is an informative model of LDS
        vascular pathogenesis, consistent with the mixed
        haploinsufficiency/dominant-negative mechanism described for
        TGFBR1 kinase-domain variants.
experimental_models:
- name: hiPSC-derived bioengineered vascular graft, TGFBR1 A230T (LDS Type 1)
  description: >-
    Bioengineered vascular grafts (BVGs) generated from isogenic control and
    CRISPR-edited or patient-derived hiPSC vascular smooth muscle cells
    carrying the TGFBR1 A230T (LDS type 1) pathogenic variant, implanted
    into the carotid arteries of nude rats to model aortic root aneurysm
    formation in an animal host.
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: >-
    hiPSC-derived cardiovascular-progenitor-lineage vascular smooth muscle
    cells, both CRISPR-Cas9 gene-edited (isogenic TGFBR1 A230T/+) and
    patient-derived (with an isogenic gene-corrected control)
  culture_system: Bioengineered vascular graft implanted into nude rat carotid arteries
  publication: PMID:38718134
  modeled_mechanisms:
  - target: Extracellular Matrix Degradation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      TGFBR1 A230T bioengineered vascular grafts show defective
      extracellular-matrix gene expression, decreased collagen
      hydroxylation, and impaired smooth-muscle-cell organization. This
      overlaps this node's elastic-fiber-assembly arm (GO:0048251
      DECREASED) and its net aortic-wall-weakening consequence, but the
      graft's dominant mechanism is defective ECM SYNTHESIS/maturation
      (reduced collagen-modifying enzyme activity) rather than the
      MMP-driven ECM DISASSEMBLY (GO:0022617 INCREASED) this node
      principally asserts, so the model is graded a partial
      recapitulation rather than a full one.
    limitations: >-
      Direction conflict: this node describes increased TGF-beta
      signaling driving MMP-mediated extracellular-matrix disassembly
      (GO:0022617 INCREASED), but PMID:38718134 evidences the opposite
      arm -- defective ECM synthesis, with reduced collagen-modifying
      enzyme activity (e.g. P4HA2, P3H1, PLOD1, LOX) and ECM-formation
      gene sets enriched in the corrected (not mutant) grafts, and lower
      TGF-beta signaling in mutant grafts than in corrected ones. Both
      readouts recorded below are DECREASED, not INCREASED, so they
      support this node's elastic-fiber-assembly (GO:0048251 DECREASED)
      arm and the general aortic-wall-weakening/medial-degeneration
      anchor (aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration
      and Wall Weakening) rather than the MMP-driven degradation arm the
      node otherwise centers on. The graft is also a bioengineered
      tissue-construct implant rather than a native aorta, and models a
      single TGFBR1 missense allele (A230T); generalization to other
      TGFBR1 kinase-domain variants is not established.
    readouts:
    - name: Graft mechanical strength (burst pressure, suture retention)
      target: Extracellular Matrix Degradation
      direction: DECREASED
      interpretation: >-
        TGFBR1 A230T grafts had lower burst pressure and suture retention
        strength than isogenic controls, a functional consequence of the
        underlying ECM defect.
      evidence:
      - reference: PMID:38718134
        reference_title: "Bioengineered vascular grafts with a pathogenic TGFBR1 variant model aneurysm formation in vivo and reveal underlying collagen defects."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The TGFBR1A230T variant led to impaired mechanical properties of
          BVGs, resulting in lower burst pressure and suture retention
          strength.
        explanation: >-
          Directly measures the weakened mechanical performance that
          results from the ECM defect this node models.
    - name: Collagen hydroxylation and ECM gene expression
      target: Extracellular Matrix Degradation
      direction: DECREASED
      interpretation: >-
        Spatial transcriptomics and histology showed defective ECM-forming
        gene expression and decreased collagen hydroxylation in
        TGFBR1-A230T-mutant grafts and patient tissue.
      evidence:
      - reference: PMID:38718134
        reference_title: "Bioengineered vascular grafts with a pathogenic TGFBR1 variant model aneurysm formation in vivo and reveal underlying collagen defects."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Histological analysis and protein assays validated quantitative
          and qualitative ECM defects in PatientA230T/+ BVGs and patient
          tissue, including decreased collagen hydroxylation.
        explanation: >-
          Documents the specific ECM/collagen molecular defect underlying
          the mechanical weakening in this TGFBR1-genotype human model.
    evidence:
    - reference: PMID:38718134
      reference_title: "Bioengineered vascular grafts with a pathogenic TGFBR1 variant model aneurysm formation in vivo and reveal underlying collagen defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        highlighted the role of reduced collagen modifying enzyme activity
        in human TAA formation
      explanation: >-
        States the study's overall conclusion that reduced collagen-modifying
        enzyme activity, downstream of the TGFBR1 A230T variant, drives
        human thoracic aortic aneurysm formation, supporting this hiPSC
        graft model as informative for the ECM-degradation node.

discussions:
- discussion_id: sct_hydrops_predicts_or_not
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does fetal hydrops predict survival in sacrococcygeal teratoma?
  attaches_to:
  - phenotypes#Hydrops fetalis
  - pathophysiology#High-Output Cardiac State from Tumour Vascular Steal
  rationale: >-
    Two cited sources answer this in opposite directions and neither is obviously wrong. One reports
    hydrops as a potential risk factor for poor outcome at an odds ratio of 21, from 68 analysed fetuses
    of an 84-fetus cohort with eleven poor outcomes, and a meta-analysis lists it among the factors predictive of poor outcome. The other, a
    review of 157 fetuses split across open surgery, percutaneous intervention and no intervention,
    reports that hydrops and cardiac failure had no significant impact on survival. The disagreement
    may be about what is being predicted - outcome in the first, survival in the second - or about
    selection: the fetuses who develop hydrops are the ones offered intervention. No cited source
    reconciles them, and the entry carries both rather than choosing.
  evidence:
  - reference: PMID:37964422
    reference_title: >-
      Prognostic accuracy of factors associated with poor outcome in prenatally diagnosed
      sacrococcygeal teratoma: A systematic review and meta-analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors associated with poor outcome in fetuses with prenatally diagnosed SCT were
      cardiomegaly, hypervascular tumor, solid tumor morphology, fetal hydrops, and placentomegaly.
    explanation: >-
      One side, from a meta-analysis of eleven studies and 447 patients.
  - reference: PMID:38731178
    reference_title: >-
      Perinatal Outcomes of Intrauterine Interventions for Fetal Sacrococcygeal Teratoma Based on
      Different Surgical Techniques-A Systematic Review.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our evaluation, we determined that the presence of fetal hydrops and cardiac failure had no
      significant impact on survival in SCT cases.
    explanation: >-
      The other side. REFUTE against the claim above, and recorded here rather than averaged into
      it.
  - reference: PMID:23845611
    reference_title: >-
      Tumor metrics and morphology predict poor prognosis in prenatally diagnosed sacrococcygeal
      teratoma: a 25-year experience at a single institution.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some fetuses with sacrococcygeal teratoma (SCT) develop hydrops, but there is no consensus on
      an appropriate prognostic marker for poor prognosis.
    explanation: >-
      The absence of consensus, stated in those terms by a third study. It predates both sources
      above and the disagreement outlived it.
- discussion_id: sct_no_disease_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every cited animal model of teratoma is gonadal. Does the mouse germ cell teratoma mechanism
    apply to a tumour whose defining feature is that the germ cell never reached a gonad?
  attaches_to:
  - pathophysiology#Epigenetic Reprogramming to a Pluripotent State
  - animal_models#Mouse
  rationale: >-
    The reprogramming step in this entry's chain is supported entirely by mouse work, and every
    mouse in the cited literature has a testicular or ovarian teratoma. No sacrococcygeal model
    exists in any species in this corpus; the only non-rodent animal report is an oropharyngeal
    teratoma in a goat. That matters more here than in most entries, because the thing being
    modelled is a cell that failed to reach the gonad, and the model contains one. The mouse work
    also fails in a way that is informative: mutating Dnd1 alone gives germ cell loss rather than
    teratoma, and the strains built to make testicular teratomas made ovarian ones instead.
  evidence:
  - reference: PMID:33568756
    reference_title: >-
      MC4R mutant mice develop ovarian teratomas.
    supports: NO_EVIDENCE
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This suggests that other genes are involved in teratoma formation.
    explanation: >-
      The authors' own reading of the first failure. NO_EVIDENCE: it records that the mechanism is
      incomplete rather than bearing on whether it transfers to this disease.
  - reference: PMID:29378702
    reference_title: >-
      Dnd1-mediated epigenetic control of teratoma formation in mouse.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spontaneous testicular teratoma develops from primordial germ cells (PGCs) in embryos;
      however, the molecular mechanisms underlying teratoma formation are not fully understood.
    explanation: >-
      The state of the mechanism, and the organ it was worked out in. BACKGROUND: it is the paper's
      framing of the problem.
- discussion_id: sct_prenatal_threshold_unsettled
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which prenatal measurement, at which threshold, should decide whether a fetus with
    sacrococcygeal teratoma is offered intervention?
  attaches_to:
  - diagnosis#Prenatal ultrasound with tumour volume to fetal weight ratio
  rationale: >-
    At least six thresholds compete in the cited literature and none has displaced the others: tumour
    volume to fetal weight ratio at 0.12 before 24 weeks and 0.11 before 32 weeks; the same ratio at
    0.095 for fetal outcome against 0.12 for maternal operative risk; total tumour volume over
    estimated fetal weight at 0.16; a solid tumour volume index at 0.09; a morphology score of 3;
    tumour volume over head circumference plus polyhydramnios at 3.0; and growth velocity at 7 mm
    per week. The
    validation study of the first reports that none of the factors associated with poor prognosis was
    an independent predictor on multivariate analysis; the growth velocity study reports that its
    measure was the only one that survived stepwise regression. Each was derived and validated in
    tens of fetuses. The entry records all of them, with their denominators, because a reader
    choosing between them needs to see that the choice has not been made.
  evidence:
  - reference: PMID:23845611
    reference_title: >-
      Tumor metrics and morphology predict poor prognosis in prenatally diagnosed sacrococcygeal
      teratoma: a 25-year experience at a single institution.
    supports: NO_EVIDENCE
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some fetuses with sacrococcygeal teratoma (SCT) develop hydrops, but there is no consensus on
      an appropriate prognostic marker for poor prognosis.
    explanation: >-
      The gap stated as a gap. NO_EVIDENCE: it records the absence rather than bearing on which
      marker is right.
  - reference: PMID:25783370
    reference_title: >-
      Predictors of poor prognosis in prenatally diagnosed sacrococcygeal teratoma: A
      multiinstitutional review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Attempts at defining predictors of poor outcome in fetal sacrococcygeal teratoma (SCT) have
      been hampered by small patient numbers.
    explanation: >-
      Why the gap persists, from the study that assembled the largest prenatal cohort in this entry
      and still had 79 fetuses.
- discussion_id: sct_altman_unsourceable
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    The Altman types are how this tumour is described everywhere, and the entry does not define them.
    Where should the definition come from?
  attaches_to:
  - pathophysiology#Tridermal Teratomatous Mass at the Sacrococcyx
  rationale: >-
    Types II and III carry an odds ratio of 1.6 for recurrence in the largest cohort, and the
    classification predicts no long-term sequela in a national questionnaire study. What the four
    types actually are is nowhere in the cited corpus. The entry
    records that result and does not define the types, because the primary source, the 1974 American Academy of Pediatrics Surgical Section survey, caches with an
    empty body under both its PMID and its DOI - both files are committed with this entry so the gap
    is checkable from the repository - and no other cited source defines any type. A classification cannot be transcribed from a covariate column. It is not unobtainable, though:
    HPO's own text definition of HP:0030736, the term this entry binds for the mass, states all four
    types, and HPO carries separate terms for types I, II and III with their own definitions and one
    for the presacral type IV. An ontology definition is not a literature source and cannot be an
    evidence snippet, which is why the entry does not quote it; a review that restates the
    definitions would let the types be curated with evidence behind them.
  evidence:
  - reference: PMID:39248311
    reference_title: >-
      Malignant transformation and tumour recurrence in sacrococcygeal teratoma: a global,
      retrospective cohort study.
    supports: NO_EVIDENCE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altman type II or type III, and immature or malignant histology were associated with
      recurrence.
    explanation: >-
      What the entry can say about the classification: its association with recurrence, from 3407
      children. NO_EVIDENCE for the question above, which is about the definitions.
  - reference: PMID:17560233
    reference_title: >-
      Long-term functional sequelae of sacrococcygeal teratoma: a national study in The Netherlands.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age at completion of the questionnaire, Altman classification, sex, and histopathology were
      not risk factors for any long-term sequelae.
    explanation: >-
      A negative result for the same classification on a different outcome, which is the other thing
      the entry can say about it without defining it.
notes: >-
  Most cited sources are a case report, a case series, a retrospective cohort, a registry study or a
  meta-analysis of those, and six are mouse work. A few are none of those: a laboratory
  reference-interval study of 524 healthy infants, a case-parent triad study, a case-control
  association study, a hypothesis review and a prospective phase II therapeutic trial. No randomised
  trial of this disease is cited, and every cached source is an abstract: nothing here rests on a
  full text. Denominators are named
  wherever a number appears, because they differ by two orders of magnitude - a global cohort of
  3407 children, a national register of 124 cases, prenatal series of tens of fetuses, and a first
  report of radiofrequency ablation in four.

  Two numbers in this entry disagree and both are kept. The Finnish birth prevalence of 1 in 10,700
  is two to four times the previously reported range and twice the Hawaii figure of 0.43 per 10,000
  live births; the Finnish authors say this may be a true population difference or may be more
  complete ascertainment. And fetal hydrops is reported as a strong predictor of poor outcome by two
  sources and as having no significant impact on survival by a third, which is recorded as a
  controversy rather than averaged.

  The mechanism is modelled on mouse gonadal teratoma. The reprogramming step has a named chromatin
  mechanism in mouse testis and no counterpart in any human sacrococcygeal tumour in this corpus, and
  no animal model of a sacrococcygeal teratoma is cited at all. That is recorded on the model links
  and again as a discussion, because the thing being modelled is a germ cell that never reached a
  gonad and every model contains one.
review_notes: >-
  Written from cached sources only, by hand. Where a claim rests on a handful of patients, the
  explanation says so rather than leaving it to the reader to look up the denominator.

  Several things are deliberately absent. The Altman classification is not defined: its primary
  source is cached with an empty body under both its identifiers and no other cited source states
  the definitions, which is recorded as a discussion rather than filled in from memory. The coccyx
  appears in the resection row's name and not in its evidence, because no cited source mentions
  coccygectomy, and the row says so. No gene in the genetic section is claimed for this tumour
  specifically: all four susceptibility loci come from studies that pool germ cell tumours across
  sites, and the strongest reported effect for one of them is in testis. The two mouse models carry no bound gene, because a model organism's own gene takes its
  model-organism database identifier and none could be resolved from any source available here; the
  human identifier would have been wrong rather than approximate. The strain qualifiers matter and
  are kept: Dnd1 mutation enhances teratoma formation on the 129 background and gives germ cell loss
  on the LT one, so the two cited mouse papers do not contradict each other.

    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cutoff value of THC plus polyhydramnios higher than 3.0 was associated with postnatal

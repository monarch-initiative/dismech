animal_models:
- name: Dnd1 mutant 129/Sv mouse (Ter)
  species: Mouse
  genotype: Dnd1 Ter (R178*) premature stop codon on the 129 background
  publication: PMID:29378702
  description: >-
    The classical teratoma mouse. Loss of DND1 drastically raises teratoma incidence, and the
    mechanism is worked out: DND1 suppresses a microRNA that inhibits EZH2, so its loss lowers
    H3K27me3 at a cell-cycle gene and the germ cells reprogramme.
  notes: >-
    The targeted gene is named in the genotype and not bound. A model organism's own gene takes its
    model-organism database identifier, not the human HGNC one, and no MGI identifier for mouse Dnd1
    could be resolved from any source available here: there is no local MGI build and the Alliance
    search endpoint returned nothing. Binding the human gene instead would put a mouse knockout on
    the human gene's page, which is the thing that rule exists to prevent.
  modeled_mechanisms:
  - target: Epigenetic Reprogramming to a Pluripotent State
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The only cited source that shows the reprogramming step happening, with a named chromatin
      mechanism and both a loss-of-function and a rescue arm.
    limitations: >-
      The tumours are testicular, not sacrococcygeal, and they arise in one inbred strain. No cited
      source reports a sacrococcygeal teratoma model in any species, so the step this link supplies is
      transferred across both organ and genetic background.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The model contains the gonad; this disease's defining feature is a germ cell that never
        reached one. Nothing in the model represents the caudal midline.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        No DND1 variant is reported in human sacrococcygeal teratoma by any cited source, and the Ter
        allele's effect is confined to the 129 strain background.
    evidence:
    - reference: PMID:29378702
      reference_title: >-
        Dnd1-mediated epigenetic control of teratoma formation in mouse.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutation of the dead-end 1 (Dnd1) gene, which encodes an RNA-binding protein, drastically
        enhances teratoma formation in the 129/Sv mouse strain.
      explanation: >-
        What the model does, and the strain dependence that is one of its two recorded
        divergences.
    - reference: PMID:29378702
      reference_title: >-
        Dnd1-mediated epigenetic control of teratoma formation in mouse.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results revealed an epigenetic molecular linkage between Dnd1 and the suppression of
        testicular teratoma formation.
      explanation: >-
        The authors' own statement of what they showed, with the organ in it: testicular.
- name: MC4R G25S congenital mouse strains
  species: Mouse
  genotype: LT-MC4R G25S point mutation, alone and with the Dnd1 Ter allele
  publication: PMID:33568756
  description: >-
    A second teratoma locus, mapped and then edited. It is recorded here for its negative results
    rather than its positive one.
  notes: >-
    As with the Dnd1 row, the targeted gene is named in the genotype and not bound, for the same
    reason.
  modeled_mechanisms:
  - target: Epigenetic Reprogramming to a Pluripotent State
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Two failures in one paper. On the LT background, mutating Dnd1 alone gave germ cell loss rather than
      teratoma - it enhances teratoma on the 129 background, which the other cited mouse paper
      reports - and the authors read that as evidence that other genes are needed. And the MC4R
      strains produced ovarian teratomas where testicular ones were expected.
    limitations: >-
      Neither result is in the caudal midline and neither is in a human. The ovarian outcome means the
      strain does not model even the organ it was built for, so it cannot be read as a model of this
      disease at all - only as evidence that teratoma formation in mouse needs more than one locus.
    evidence:
    - reference: PMID:33568756
      reference_title: >-
        MC4R mutant mice develop ovarian teratomas.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the phenotype of mice with a mutated Dnd1 gene was germ cell loss.
      explanation: >-
        The first failure, stated by the authors, and the reason this link is graded
        FAILS_TO_RECAPITULATE rather than left out.
    - reference: PMID:33568756
      reference_title: >-
        MC4R mutant mice develop ovarian teratomas.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surprisingly, highly developed ovarian teratomas (OTs), instead of testicular teratomas,
        appeared not only in the LT-Ter-MC4RG25S and LT-MC4RG25S strains but also in the LT-ett1
        and LT-Ter-ett1 strains.
      explanation: >-
        The second failure, with the authors' own word for it. Four strains, all giving the wrong
        organ.
diagnosis:
- name: Prenatal ultrasound with tumour volume to fetal weight ratio
  diagnosis_term:
    preferred_term: obstetric ultrasonography
    term:
      id: NCIT:C217447
      label: Diagnostic Obstetric Ultrasound
  description: >-
    The test that finds the tumour and the one the risk stratification is built on. Tumour volume
    divided by estimated fetal weight above 0.12 before 24 weeks is the threshold the field uses; it
    was derived in ten fetuses and validated in 79.
  notes: >-
    The threshold is not settled. The validation study reports 0.12 before 24 weeks with an area under the curve of 0.913. A second
    study reports both 0.12 before 24 weeks and 0.11 before 32 weeks, so those two are one measure
    at two gestational windows rather than rival values. A third finds that 0.095 predicts poor
    fetal outcome while 0.12 predicts increased maternal operative risk - the same number used for
    two different questions. Beside them sit a total tumour volume over estimated fetal weight of
    0.16, a solid tumour volume index of 0.09, a morphology score of 3, a composite of tumour volume
    over head circumference plus polyhydramnios at 3.0, and growth velocity at 7 mm per week. The entry records all of them because no cited source
    adjudicates between them, and one of them states that none of the factors associated with poor
    prognosis was an independent predictor on multivariate analysis.
  evidence:
  - reference: PMID:21683219
    reference_title: >-
      Tumor volume to fetal weight ratio as an early prognostic classification for fetal
      sacrococcygeal teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A TFR greater than 0.12 predicted poor outcome with 100% sensitivity and 83% specificity.
    explanation: >-
      The original derivation, and its denominator: ten fetuses, five on each side of the threshold.
      100% sensitivity in five cases is a property of the sample.
  - reference: PMID:25783370
    reference_title: >-
      Predictors of poor prognosis in prenatally diagnosed sacrococcygeal teratoma: A
      multiinstitutional review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ROC analysis revealed that TFR >0.12 prior to 24 weeks gestation was predictive of poor
      prognosis (AUC=0.913; Sensitivity=91.7%, Specificity=76.2%, PPV=86.8%; NPV=84.2%).
    explanation: >-
      The multi-institutional validation in 79 fetuses, with the full accuracy figures. Sensitivity
      falls from 100% to 91.7% and specificity from 83% to 76.2% once the sample is eight times
      larger, which is what validation usually does.
  - reference: PMID:29495013
    reference_title: >-
      High Tumor Volume to Fetal Weight Ratio Is Associated with Worse Fetal Outcomes and Increased
      Maternal Risk in Fetuses with Sacrococcygeal Teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ROC analysis revealed that at <=24 weeks, TFR > 0.095 was predictive of poor fetal outcome and
      TFR > 0.12 was predictive of increased maternal operative risk.
    explanation: >-
      The same ratio splitting into two thresholds for two different outcomes, which is the clearest
      statement in the cited literature that the number is not one number.
  - reference: PMID:39482803
    reference_title: >-
      Growth velocity of fetal sacrococcygeal teratoma as predictor of perinatal morbidity and
      mortality: multicenter study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best predictive cut-off of tumor growth velocity for poor perinatal outcome was 7 mm/week
      (OR, 25.7 (95% CI, 5.6-191.3), P < 0.001), yielding a sensitivity of 88% and a specificity of
      77%.
    explanation: >-
      The competing measure, and the only one that remained an independent factor in its own study's
      stepwise regression. The confidence interval runs from 5.6 to 191.3.
  - reference: PMID:39482803
    reference_title: >-
      Growth velocity of fetal sacrococcygeal teratoma as predictor of perinatal morbidity and
      mortality: multicenter study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On stepwise logistic regression analysis, tumor growth velocity was the only remaining
      independent factor associated with poor perinatal outcome
    explanation: >-
      The independence claim itself, which is what makes this measure different in kind from the
      others in this row: every other prenatal factor dropped out of the same regression.
  - reference: PMID:25783370
    reference_title: >-
      Predictors of poor prognosis in prenatally diagnosed sacrococcygeal teratoma: A
      multiinstitutional review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the factors associated with poor prognosis were independent predictors on multivariate
      analysis.
    explanation: >-
      The result that qualifies every prenatal predictor in this entry, from the study that
      validated the main one.
- name: Serum alpha-fetoprotein surveillance after resection
  diagnosis_term:
    preferred_term: serum alpha-fetoprotein measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  description: >-
    Serial measurement after resection, to catch a malignant recurrence. Its reported sensitivity is
    good and probably overstated, and reading a single value in an infant is the hard part because the normal level falls steeply through the first weeks and then plateaus well above the adult range.
  notes: >-
    No LOINC code is bound. The measurement's identity belongs on a LOINC code rather than on the NCIT
    action term, and the repository's LOINC prefix is not yet routed for validation, so a code typed
    here could not be checked; the NCIT measurement term carries the action instead.
  evidence:
  - reference: PMID:32376010
    reference_title: >-
      Diagnostic accuracy of serum alpha-fetoprotein levels in diagnosing recurrent sacrococcygeal
      teratoma: A systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A subgroup analysis of articles that measured serum AFP levels in all patients (n = 6, 136
      patients, 14 recurrences) showed a sensitivity and specificity of 79% and 95%, respectively.
    explanation: >-
      The figures from the subgroup in which everyone was measured, which is the only subgroup that
      can give an unbiased sensitivity. Fourteen recurrences.
  - reference: PMID:32376010
    reference_title: >-
      Diagnostic accuracy of serum alpha-fetoprotein levels in diagnosing recurrent sacrococcygeal
      teratoma: A systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic accuracy of serum AFP levels to detect recurrent SCT seems promising, though
      sensitivity could be overestimated since serum AFP levels are mainly described in patients
      with elevated AFP levels or at recurrent SCT.
    explanation: >-
      The authors' own caveat, which is the reason the row does not quote the headline 96% figure
      without it.
  - reference: PMID:9592840
    reference_title: >-
      Alpha 1-fetoprotein (AFP) reference values in infants up to 2 years of age.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first 4 weeks of life, AFP levels decreased by 50% in 5.1 days in term babies.
    explanation: >-
      The steepness of the normal decline, which is what makes a single infant value hard to read.
      From 524 samples from healthy infants, not from this disease.
- name: Histopathological examination of the resected specimen
  diagnosis_term:
    preferred_term: histopathological examination of the whole specimen
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  description: >-
    Mature, immature or malignant, and whether the margins are clear. What makes the histology worth
    reporting in that detail is that microscopic yolk sac foci inside an otherwise mature teratoma
    raise the recurrence rate more than tenfold. No cited source says how the specimen should be
    sampled.
  evidence:
  - reference: PMID:39016163
    reference_title: >-
      Impact of microscopic deposits of yolk sac tumor on recurrence of mature sacrococcygeal
      teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In particular, prior studies have not investigated whether microscopic deposits of yolk sac
      tumor (YST) in otherwise mature teratomas lead to higher recurrence rates.
    explanation: >-
      The question this row exists to answer, stated as unanswered by the study that answered it.
  - reference: PMID:33906346
    reference_title: >-
      Sacrococcygeal Teratoma : A Tumor at the Center of Embryogenesis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete resection and malignant histology are risk factors for recurrence.
    explanation: >-
      The two things this examination establishes, and why both matter.
treatments:
- name: Complete resection with the coccyx
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tumour resection
    term:
      id: NCIT:C164212
      label: Tumor Resection
  description: >-
    The definitive treatment, done after birth in most patients. Completeness is what matters:
    positive margins raise the recurrence rate about tenfold in one series, and incomplete resection
    is named as a risk factor for recurrence by a review.
  notes: >-
    No cited source mentions coccygectomy; the word coccyx appears only inside the compound site name
    sacrococcyx. The removal of the coccyx is standard practice and is in the row's name because it
    is what the operation is, but nothing cited here establishes it, and no cited source compares
    resection with and without it.
  target_mechanisms:
  - target: Tridermal Teratomatous Mass at the Sacrococcyx
    treatment_effect: BYPASSES
    description: >-
      Resection removes the mass. It acts on nothing above it - the misplaced germ cell and whatever
      reprogrammed it are not addressed - which is the reason a complete resection is followed for
      years rather than discharged.
    evidence:
    - reference: PMID:39016163
      reference_title: >-
        Impact of microscopic deposits of yolk sac tumor on recurrence of mature sacrococcygeal
        teratoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Recurrence was more likely in patients with microscopic YST [5/9 (56%) vs. 2/47 (4%), p =
        0.021] and positive margins [6/24 (35%) vs. 1/32 (3.1%), p = 0.030].
      explanation: >-
        The margin result: 35% recurrence against 3.1%. INDIRECT for this link because recurrence
        is a disease outcome rather than a measurement on the mass, and the arms were not
        randomised.
  evidence:
  - reference: PMID:25746708
    reference_title: >-
      Malignant transformation in sacrococcygeal teratoma and in presacral teratoma associated with
      Currarino syndrome: a comparative study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCT, malignancy and recurrence risk are high.
    explanation: >-
      The authors' stated reason for the next sentence, which is this row's recommendation.
  - reference: PMID:25746708
    reference_title: >-
      Malignant transformation in sacrococcygeal teratoma and in presacral teratoma associated with
      Currarino syndrome: a comparative study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, early and complete resection is mandatory.
    explanation: >-
      The recommendation, from a national comparative analysis of 205 sacrococcygeal and 16
      Currarino patients. It is a recommendation, not a comparison against delayed or partial
      resection.
- name: Fetal radiofrequency ablation of the feeding vessels
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: radiofrequency ablation
    term:
      id: NCIT:C15666
      label: Radiofrequency Ablation
  description: >-
    Interrupting the tumour's blood supply before birth, to reverse the high-output state rather than
    to remove the tumour. The first report of it is also the clearest statement of its limit:
    ablating most of the tumour mass was unnecessary and killed two of four fetuses.
  target_mechanisms:
  - target: High-Output Cardiac State from Tumour Vascular Steal
    treatment_effect: INHIBITS
    description: >-
      The target is the shunt, not the tumour. Reducing flow through the feeding vessels is enough to
      reverse the failure; the tumour is resected after birth.
    evidence:
    - reference: PMID:11228510
      reference_title: >-
        Radiofrequency ablation of human fetal sacrococcygeal teratoma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Targeted ablation of the feeding tumor vessels diminishes blood flow sufficiently to
        reverse high-output fetal heart failure.
      explanation: >-
        The mechanism of the treatment stated exactly as this link claims it. Four fetuses, so it
        is the authors' conclusion from a first report rather than a measured effect size.
  evidence:
  - reference: PMID:11228510
    reference_title: >-
      Radiofrequency ablation of human fetal sacrococcygeal teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ablation of a majority of the tumor tissue in sacrococcygeal teratoma is not necessary and
      proved fatal in two instances.
    explanation: >-
      The limit of the technique, in the words of the report that introduced it: two of four fetuses
      died when most of the tumour was ablated.
  - reference: PMID:24488859
    reference_title: >-
      Minimally invasive therapy for fetal sacrococcygeal teratoma: case series and systematic
      review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Including our cases, six of 20 hydropic fetuses survived after minimally invasive therapy
      (30%).
    explanation: >-
      The pooled survival for minimally invasive treatment of hydropic fetuses across a case series
      and a systematic review: 30%.
- name: Open fetal resection
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: open fetal surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Resection of the tumour in utero for a fetus in progressive high-output failure. The field has
    moved away from it towards the minimally invasive techniques above, and the cited survival
    figures do not separate the two by much.
  target_mechanisms:
  - target: High-Output Cardiac State from Tumour Vascular Steal
    treatment_effect: BYPASSES
    description: >-
      Removing the tumour before birth removes the shunt. The cost is maternal morbidity and preterm
      delivery, which is why the alternative above exists.
    evidence:
    - reference: PMID:19540178
      reference_title: >-
        Open fetal surgery for life-threatening fetal anomalies.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fetal sacrococcygeal teratoma complicated with progressive high output cardiac failure may
        benefit from in-utero resection of the tumor.
      explanation: >-
        The indication, stated with the authors' hedge: may benefit. INDIRECT for the link because
        the sentence does not measure the effect on the node.
  evidence:
  - reference: PMID:24488859
    reference_title: >-
      Minimally invasive therapy for fetal sacrococcygeal teratoma: case series and systematic
      review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival after open fetal surgery in hydropic fetuses was 6/11 (55%), with a mean gestational
      age at delivery of 29.8 +/- 2.9 weeks.
    explanation: >-
      The comparator figure for the minimally invasive 30% above: 55% in eleven fetuses, at a mean
      delivery of under 30 weeks. Neither series was randomised and the groups were not matched.
  - reference: PMID:14533891
    reference_title: >-
      Fetal surgery for sacrococcygeal teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to resection, RFA requires less time and significantly less maternal morbidity
      than open resection.
    explanation: >-
      The trade-off the field made, stated by a review of fetal surgery for this tumour.
- name: JEB chemotherapy for malignant disease
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
  description: >-
    Carboplatin, etoposide and bleomycin, for malignant germ cell tumour. The regimen was developed

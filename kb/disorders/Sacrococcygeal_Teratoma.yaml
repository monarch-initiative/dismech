  - reference: PMID:23432104
    reference_title: >-
      High prevalence of sacrococcygeal teratoma in Finland - a nationwide population-based study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The total prevalence of SCT was 1:10 700.
    explanation: >-
      The authors' own figure, which is what the rate here converts.
  - reference: PMID:23432104
    reference_title: >-
      High prevalence of sacrococcygeal teratoma in Finland - a nationwide population-based study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The birth prevalence of sacrococcygeal teratoma (SCT) has been reported to range from 1:27 000

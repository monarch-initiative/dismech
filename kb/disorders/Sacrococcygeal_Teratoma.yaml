    explanation: >-
      The previously reported range, which this study's figure is two to four times higher than.
      BACKGROUND: it is the paper's opening statement of what was known.
- population: Hawaii, deliveries 1986-2001
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.3
  rate_denominator: LIVE_BIRTHS
  notes: >-
    0.43 per 10,000 live births, from 13 sacrococcygeal cases in a population-based birth defects

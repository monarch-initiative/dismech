  evidence:
  - reference: PMID:1696831
    reference_title: >-
      'JEB'--a carboplatin based regimen for malignant germ cell tumours in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary sites were: testis (6), ovary (8), sacrococcyx (4), pineal gland (2) and vagina (1).
    explanation: >-
      The site breakdown, which is why this row says the regimen was used in this disease rather
      than tested in it: four of 21 patients.
  - reference: PMID:1696831
    reference_title: >-
      'JEB'--a carboplatin based regimen for malignant germ cell tumours in children.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It appears to have comparable efficacy to cisplatin-based regimens but with much less
      nephrotoxicity and ototoxicity and avoids the use of alkylating agents and anthracyclines.
    explanation: >-
      Why this regimen rather than a cisplatin one, in the authors' words and with their hedge:
      appears to have comparable efficacy. No randomised comparison is cited.
progression:
- phase: Prenatal
  notes: >-
    Detected on ultrasound in just over half of pregnancies, at a median that differs widely by series:
    22 weeks in 55 fetuses, 23 in seven, and 30.9 in eleven. The fetuses that do badly do so through the high-output state; the rest
    are delivered and operated on. Mortality including terminations is about a third in referral
    series and is driven by the terminations.
  evidence:
  - reference: PMID:34327722
    reference_title: >-
      Factors associated with poor outcome in fetuses prenatally diagnosed with sacrococcygeal
      teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall mortality was 32.1%, with a mortality excluding TOPs of 13.1%.
    explanation: >-
      Both figures, because either alone misleads: a third including terminations of pregnancy and
      an eighth without them. Eighty-four fetuses.
  - reference: PMID:39482803
    reference_title: >-
      Growth velocity of fetal sacrococcygeal teratoma as predictor of perinatal morbidity and
      mortality: multicenter study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall survival rate after prenatal diagnosis of isolated SCT was 75% (n = 41 of 55).
    explanation: >-
      A second series' figure for non-syndromic tumours, 55 fetuses across five centres.
- phase: Neonatal resection
  notes: >-
    Most patients are operated on after birth. The operation decides what follows: completeness of
    resection and the histology of the specimen are the two factors the recurrence literature keeps
    returning to.
  evidence:
  - reference: PMID:33906346
    reference_title: >-
      Sacrococcygeal Teratoma : A Tumor at the Center of Embryogenesis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with SCT are operated on after birth.
    explanation: >-
      Where the default sits, from a review of this disease.
  - reference: PMID:33906346
    reference_title: >-
      Sacrococcygeal Teratoma : A Tumor at the Center of Embryogenesis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete surgical resection is the key for tumor control, and the anatomical location of the
      tumor determines the surgical approaches.
    explanation: >-
      What the operation is for and what shapes it.
- phase: Recurrence
  duration: many recurrences within 1 to 6 years, some at 20 years
  notes: >-
    About one in ten children recur and about a third of those recurrences are malignant. The interval is the part that sets the follow-up: many recurrences fall within one to six years, in
    the pooled review's own word, and some are twenty years out. The risk of malignancy at initial resection rises with age and plateaus at six
    years, which is why delay matters.
  evidence:
  - reference: PMID:39248311
    reference_title: >-
      Malignant transformation and tumour recurrence in sacrococcygeal teratoma: a global,
      retrospective cohort study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of malignant transformation of the initial tumour was 3.3, 5.1, 10.1, and 32.9% at
      age 3 months, 6 months, 1 year, and 2 years, respectively.
    explanation: >-
      The age gradient, in 3407 children from 145 institutes in 62 countries. A tenfold rise between
      three months and two years is the argument for operating early.
  - reference: PMID:33142194
    reference_title: >-
      Malignant recurrence after mature Sacrococcygeal teratoma: A meta-analysis and review of the
      literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many recurrences occurred within 1-6 years, however some occurred as long as 20 years after
      initial diagnosis.
    explanation: >-
      The interval, pooled from 22 articles. The twenty-year tail is why the next sentence asks for
      at least six years of follow-up rather than two.
  - reference: PMID:33142194
    reference_title: >-
      Malignant recurrence after mature Sacrococcygeal teratoma: A meta-analysis and review of the
      literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of mature SCTs with resection alone requires thorough follow-up of at least 6 years.
    explanation: >-
      The recommendation that follows, and the one the alpha-fetoprotein surveillance row
      implements.
- phase: Long-term survivorship
  notes: >-
    Survival is high. What survivors carry is functional: bowel and bladder problems and the scar, in
    nearly half of one national cohort at a median age of about ten, correlated with reduced quality
    of life and not predicted by any clinical variable the study tested.
  evidence:
  - reference: PMID:42250912
    reference_title: >-
      Malignant transformation of sacrococcygeal teratoma versus presacral teratoma in Currarino
      syndrome: Results of 'The SCT-study'.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival in both groups was equivalent at 94.9 % in SCT patients versus 96.9 % in CS patients
    explanation: >-
      The survival figure, from 3183 sacrococcygeal and 205 Currarino patients in a global cohort.
  - reference: PMID:33906346
    reference_title: >-
      Sacrococcygeal Teratoma : A Tumor at the Center of Embryogenesis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survivors of SCT may suffer anorectal, urological, and sexual sequelae later in their life,
      and comprehensive evaluation and care are required.
    explanation: >-
      What survivorship involves, including an axis - sexual function - that the questionnaire study
      cited elsewhere in this entry did not measure.

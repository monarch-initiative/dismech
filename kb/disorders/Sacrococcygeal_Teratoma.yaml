    explanation: >-
      The study's own framing of this group of phenotypes; the breakdown is quoted on the
      pathophysiology node that produces them.
- category: Genitourinary
  name: Urinary incontinence
  phenotype_term:
    preferred_term: urinary incontinence
    term:
      id: HP:0000020
      label: Urinary incontinence
  description: >-
    Reported by just under a third of long-term survivors in the national questionnaire study.
  evidence:
  - reference: PMID:17560233
    reference_title: >-
      Long-term functional sequelae of sacrococcygeal teratoma: a national study in The Netherlands.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term sequelae were correlated with diminished QoL.
    explanation: >-

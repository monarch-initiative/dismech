- name: Chordoma
  description: >-
    In children, sacrococcygeal chordoma is rare and may be confused with the teratoma, which the
    report calls more common and indolent. The report describes one adolescent. A fetal MRI series
    lists sacral chordoma among the differential diagnoses of the cystic forms of this tumour.
  disease_term:
    preferred_term: sacrococcygeal chordoma
    term:
      id: MONDO:0002894
      label: spinal chordoma
  distinguishing_features:
  - >-
    Neither the case report's abstract nor the fetal MRI series gives an imaging, histological or
    marker feature that separates the two: the abstract contrasts chordoma's rarity in children with
    the teratoma, which it calls the more common and the indolent one, and the series only lists
    sacral chordoma among the differentials.
  notes: >-
    The row binds spinal chordoma rather than the narrower sacrum chordoma (MONDO:0000518),
    because the case report says sacrococcygeal; the fetal MRI series says sacral chordoma, which
    the broader term also covers. The case report's abstract also calls sacrococcygeal teratoma a
    familial paediatric neoplasm and gives no basis for it, and the fetal MRI series says in its
    introduction that the vast majority of cases are sporadic; the row does not repeat the
    familial claim, and the familial presacral teratoma in the anterior sacral meningocele row may
    be the Currarino lesion rather than this tumour. Indolent is the report's own word: the
    comparative studies in the Currarino row report malignant transformation of sacrococcygeal
    teratoma, and the global cohort a risk of it that rises with age.

- category: Gastrointestinal
  name: Constipation
  phenotype_term:
    preferred_term: constipation
    term:
      id: HP:0002019
      label: Constipation
  description: >-
    The commonest single bowel complaint at long-term follow-up, at 17%.
  evidence:
  - reference: PMID:17560233
    reference_title: >-
      Long-term functional sequelae of sacrococcygeal teratoma: a national study in The Netherlands.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A large proportion of the patients with SCT have problems with defecation, urinary

name: Sacrococcygeal Teratoma
creation_date: '2026-11-13T20:13:09Z'
disease_term:
  preferred_term: sacrococcygeal teratoma
  term:
    id: MONDO:0042727
    label: sacrococcygeal teratoma
categories:
- Congenital neoplasm
- Germ cell tumor
parents:
- extragonadal germ cell tumor
synonyms:
- SCT
- teratoma of the sacrococcygeal region
description: >-
  The commonest tumour of the newborn, and a germ cell tumour in a place with no gonad. It is thought
  to arise when a primordial germ cell migrating from the yolk sac to the gonadal ridge is left behind
  in the caudal midline and is reprogrammed to a pluripotent state, after which it differentiates into
  all three germ layers at once. Most are mature, and complete resection with clear margins is the treatment; about one child in ten
  recurs.
  Two things make it dangerous. Before birth, a large solid tumour steals so much cardiac output that
  the fetus goes into high-output failure and hydrops, which is what the prenatal predictors are for.
  After birth, a mature-looking tumour can recur as a yolk sac tumour years later, which is what the
  alpha-fetoprotein surveillance is for.
pathophysiology:
- name: Primordial Germ Cell Left in the Caudal Midline
  role: trigger
  biological_scale: CELLULAR
  description: >-
    A germ cell that does not complete the migration from the yolk sac to the gonadal ridge. The
    midline distribution of extragonadal germ cell tumours is the main evidence for this: the tumours
    appear where the migration route runs.
  cell_types:
  - preferred_term: primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: germ cell migration
    term:
      id: GO:0008354
      label: germ cell migration
  evidence:
  - reference: DOI:10.1111/j.1365-2605.2007.00793.x
    reference_title: >-
      Why human extragonadal germ cell tumours occur in the midline of the body: old concepts, new
      perspectives
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their distribution along the midline of the body is still best explained by the migration of
      primitive germ cells during development.
    explanation: >-
      The argument for this node, and the authors' own measure of how settled it is: still best
      explained, which is a statement about competing hypotheses rather than a demonstration.
      INDIRECT because an anatomical distribution is an inference step from a cell's history.
  - reference: PMID:33906346
    reference_title: >-
      Sacrococcygeal Teratoma : A Tumor at the Center of Embryogenesis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCT is the most common type I GCT and is believed to originate through epigenetic
      reprogramming of early primordial germ cells migrating from the yolk sac to the gonadal
      ridges.
    explanation: >-
      Names the cell and the route this node binds, and keeps the hedge: believed to originate. The
      second half of the sentence is the next node.
  notes: >-
    No cited source mentions Hensen's node, the primitive streak, the caudal cell mass or a totipotent
    cell, which are the other accounts of this tumour's origin in the wider literature. This entry
    records the germ cell account because it is the one its sources make, not because the
    alternatives were weighed and rejected. HPO takes the other view: its text definition of
    HP:0030736, the term this entry binds for the mass, says these tumours arise from totipotent
    cells from the node of Hensen. Nothing cited here bears on that, and the entry does not
    adjudicate it. The label on GO:0008354 is the committed cache's, germ cell migration. The
    current ontology makes that an exact synonym and gives the canonical label as primordial germ
    cell migration. Two other entries in kb/ carry the same stale string, so this is corpus-wide
    cache drift rather than a binding error here; refreshing it belongs in its own pass.
  downstream:
  - target: Epigenetic Reprogramming to a Pluripotent State
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A germ cell in the wrong place does not become a tumour by being there. What converts it is a
      return to pluripotency; no cited source shows the conversion happening in a human sacrococcygeal
      tumour, and the mouse work that does show it is testicular.
    evidence:
    - reference: PMID:33906346
      reference_title: >-
        Sacrococcygeal Teratoma : A Tumor at the Center of Embryogenesis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SCT is the most common type I GCT and is believed to originate through epigenetic
        reprogramming of early primordial germ cells migrating from the yolk sac to the gonadal
        ridges.
      explanation: >-
        The step stated as the field's belief rather than as a demonstrated transition, which is
        why this edge is drawn through unknown intermediates.
- name: Epigenetic Reprogramming to a Pluripotent State
  role: effector
  biological_scale: CELLULAR
  description: >-
    The misplaced germ cell reacquires the capacity to make all three germ layers. The bound process is
    stem cell population maintenance, which is the nearest GO has: searching GO for reprogramming
    and for pluripotency returns nothing, and this term's own definition ends by allowing that stem
    cells may arise de novo from other cell types. In mouse testicular
    teratoma this step has a named mechanism - loss of DND1 lowers EZH2 and H3K27me3 at a cell-cycle
    gene, and the germ cells reprogramme to pluripotent stem cells - and that is a different organ and
    a different strain background from this disease.
  cell_types:
  - preferred_term: pluripotent stem cell
    term:
      id: CL:0002248
      label: pluripotent stem cell
  biological_processes:
  - preferred_term: stem cell population maintenance
    modifier: INCREASED
    term:
      id: GO:0019827
      label: stem cell population maintenance
  evidence:
  - reference: PMID:29378702
    reference_title: >-
      Dnd1-mediated epigenetic control of teratoma formation in mouse.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, Ezh2 expression or Ccnd1 deficiency repressed the reprogramming of PGCs into
      pluripotent stem cells, which mimicked the conversion of embryonic germ cells into
      teratoma-forming cells.
    explanation: >-
      The reprogramming step and a necessity test for it, in mouse embryos: restoring EZH2 or removing
      cyclin D1 represses the conversion. The authors' own word for what it models is mimicked.
  - reference: PMID:32999426
    reference_title: >-
      Comprehensive genetic analysis of pediatric germ cell tumors identifies potential drug
      targets.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Teratomas had higher expression of ectodermal genes, suggesting a tridermal nature.
    explanation: >-
      The human end of this node, from a 51-sample paediatric germ cell tumour cohort: the
      expression profile of teratomas is consistent with three germ layers. The cohort includes
      extragonadal samples but never names the sacrococcygeal site, so this is a property of
      teratoma as a class.
  downstream:
  - target: Tridermal Teratomatous Mass at the Sacrococcyx
    causal_link_type: DIRECT
    description: >-
      A pluripotent cell differentiating in all three directions is what the mass is made of.
    evidence:
    - reference: PMID:41612690
      reference_title: >-
        Congenital oropharyngeal teratoma in a neonatal goat and brief review of extragonadal
        teratomas in animals.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Teratomas originate from pluripotent germ cells and differentiate into the 3 germ cell
        layers: endoderm, mesoderm, and ectoderm.
      explanation: >-
        The definition of the tumour, which is this edge. BACKGROUND and INDIRECT: the sentence
        frames a veterinary case report of an oropharyngeal teratoma, so it is a general statement
        about teratomas and not an observation in this disease.
- name: Tridermal Teratomatous Mass at the Sacrococcyx
  role: effector
  biological_scale: TISSUE
  description: >-
    The tumour. Mature in most neonates, with immature or frankly malignant components in a minority,
    and arising attached to the coccyx. Its size, its solidity and how fast it grows are what decide
    the fetal course; its histology and the completeness of its removal are what decide the rest.
  evidence:
  - reference: PMID:33142194
    reference_title: >-
      Malignant recurrence after mature Sacrococcygeal teratoma: A meta-analysis and review of the
      literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal SCTs are mostly mature, but can also contain immature and/or malignant components.
    explanation: >-
      The histological composition of the mass, from a meta-analysis of 22 articles and 1516
      patients.
  - reference: PMID:23773720
    reference_title: >-
      Prenatal solid tumor volume index: novel prenatal predictor of adverse outcome in
      sacrococcygeal teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sacrococcygeal teratoma is the most common neonatal tumor.
    explanation: >-
      Where this tumour sits among neonatal neoplasms, stated by one of the prenatal-imaging series.
      BACKGROUND: it is the paper's opening sentence rather than its result.
  downstream:
  - target: Sacrococcygeal mass
    causal_link_type: DIRECT
    description: >-
      The mass as the finding: detected on prenatal ultrasound in just over half of affected
      pregnancies in a national register, and at birth in the rest.
    evidence:
    - reference: PMID:23432104
      reference_title: >-
        High prevalence of sacrococcygeal teratoma in Finland - a nationwide population-based
        study.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tumours were detected in utero in 55% of the pregnancies with SCT.
      explanation: >-
        How often the mass is found before birth, in a nationwide Finnish register covering 22
        years. The other 45% present at delivery.
  - target: High-Output Cardiac State from Tumour Vascular Steal
    causal_link_type: DIRECT
    description: >-
      A large, solid, highly vascular tumour is a low-resistance circuit in parallel with the fetus.
      The fetal heart compensates by raising output, and past a point it fails. This is the arm every
      prenatal predictor in this entry is trying to anticipate.
    evidence:
    - reference: PMID:11228510
      reference_title: >-
        Radiofrequency ablation of human fetal sacrococcygeal teratoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fetuses with solid, highly vascularized sacrococcygeal teratomas can die as a result of
        the vascular steal syndrome.
      explanation: >-
        The mechanism named, and the three properties of the mass that drive it: solid, highly
        vascularised, large. BACKGROUND because the sentence is the paper's statement of the
        problem it set out to treat.
    - reference: PMID:23773720
      reference_title: >-
        Prenatal solid tumor volume index: novel prenatal predictor of adverse outcome in
        sacrococcygeal teratoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fetuses with large tumors may develop hydrops from a high cardiac output state (HCOS) and
        progress rapidly to fetal demise.
      explanation: >-
        The same arm with its end point, from the series that defined the solid tumour volume
        index.
  - target: Malignant Yolk Sac Component
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Yolk sac tumour either present from the start and missed, or arising later within a mature
      teratoma. No cited source settles which, and the meta-analysis that raises the question names
      both possibilities without choosing.
    evidence:
    - reference: PMID:33142194
      reference_title: >-
        Malignant recurrence after mature Sacrococcygeal teratoma: A meta-analysis and review of
        the literature.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overlooking malignant components on initial pathological evaluation and the progression of
        mature SCT cells to malignant cells may play a role.
      explanation: >-
        The two candidate routes, stated as candidates. This is why the edge is drawn through
        unknown intermediates and why the entry does not assert a transformation.
  - target: Pelvic and Perineal Mass Effect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The tumour and its removal both act on the same small anatomical space, which carries the nerves
      and sphincters of bowel and bladder. No cited source separates the damage the tumour does from
      the damage the operation does, and the series that looked for predictors found none.
    evidence:
    - reference: PMID:17560233
      reference_title: >-
        Long-term functional sequelae of sacrococcygeal teratoma: a national study in The
        Netherlands.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Long-term functional sequelae after resection of sacrococcygeal teratoma (SCT) are
        relatively common.
      explanation: >-
        The existence of this arm, from a national Dutch questionnaire study of 79 patients. The
        title of that arm is resection, not tumour, and the entry keeps the ambiguity because the
        source does.
- name: High-Output Cardiac State from Tumour Vascular Steal
  role: effector
  biological_scale: ORGANISM
  description: >-
    Combined ventricular output above 625 mL/min/kg with abnormal Doppler or echocardiographic
    findings is the definition one series used. Cardiomegaly, abnormal venous preload indices and
    umbilical venous pulsation are the signs; hydrops is the end of it.
  evidence:
  - reference: PMID:23773720
    reference_title: >-
      Prenatal solid tumor volume index: novel prenatal predictor of adverse outcome in
      sacrococcygeal teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Outcomes measured were survival, hydrops or high cardiac output state, defined as a combined
      ventricular output of >625 mL/min/kg with abnormal Doppler or echocardiogram findings.
    explanation: >-
      The only numerical definition of this node in any cited source, and it is one series'
      operating definition rather than a validated threshold.
  - reference: PMID:15192290
    reference_title: >-
      Sonographic prognostic factors in prenatal diagnosis of SCT.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most important prognostic criteria were cardiomegaly, fetal hydrops, and increased preload
      indexes of the fetal venous system as sign of fetal heart failure.
    explanation: >-
      The signs of this node, from a sonographic series.
  downstream:
  - target: Hydrops fetalis
    causal_link_type: DIRECT
    description: >-
      The decompensated end of the high-output state, and the point at which fetal intervention is
      considered.
    evidence:
    - reference: PMID:15192290
      reference_title: >-
        Sonographic prognostic factors in prenatal diagnosis of SCT.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A subset of fetuses with sacrococcygeal teratomas (SCT) develops hydrops caused by
        high-output heart failure.
      explanation: >-
        The edge stated in one sentence, with the causal direction the node asserts.
  - target: Cardiomegaly
    causal_link_type: DIRECT
    description: The heart's response to the sustained output demand, and a predictor of poor outcome in its own right.
    evidence:
    - reference: PMID:34327722
      reference_title: >-
        Factors associated with poor outcome in fetuses prenatally diagnosed with sacrococcygeal
        teratoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Potential risk factors for poor outcome were the presence of fetal hydrops (OR: 21.0, CI:
        2.6-275.1, p = 0.012) and cardiomegaly (OR: 10.3, CI: 1.9-55.8, p = 0.011).
      explanation: >-
        Both this phenotype and hydrops with their odds ratios. Eighty-four fetuses were included and
        sixteen terminations were excluded from the analysis, so the odds ratios rest on 68 fetuses
        with eleven poor outcomes, which is what makes the hydrops interval run from 2.6 to 275.1. The confidence intervals are very wide - 2.6 to 275.1 for hydrops - which is the
        measure of how much a cohort of this size can settle.
  - target: Polyhydramnios
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excess amniotic fluid accompanies the severe form. No cited source states the mechanism; one
      series found it much commoner among non-survivors managed without intervention.
    evidence:
    - reference: PMID:38731178
      reference_title: >-
        Perinatal Outcomes of Intrauterine Interventions for Fetal Sacrococcygeal Teratoma Based
        on Different Surgical Techniques-A Systematic Review.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In NI patients, polyhydramnios was much higher in fetuses who did not survive compared to
        their surviving cohorts (p < 0.001).
      explanation: >-
        The association with death in the non-intervention group of a 157-fetus review. INDIRECT:
        it is an association in one arm, not a mechanism.
  - target: Premature birth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Delivery is earlier when the fetus is compromised, and earlier delivery is itself what several
      series find associated with death. The direction is not separable from the cached abstracts.
    evidence:
    - reference: PMID:38731178
      reference_title: >-
        Perinatal Outcomes of Intrauterine Interventions for Fetal Sacrococcygeal Teratoma Based
        on Different Surgical Techniques-A Systematic Review.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The gestational age at delivery was earlier in cases where there was no survival compared
        to cases where the fetuses did survive across all evaluated cohorts (OS: p = 0.033, PI: p
        < 0.001, NI: p < 0.001).
      explanation: >-
        The association in all three management groups. Whether early delivery causes the deaths
        or marks the fetuses already failing is exactly what this design cannot say.
- name: Malignant Yolk Sac Component
  role: effector
  biological_scale: CELLULAR
  description: >-
    Yolk sac tumour, the malignant histology this tumour recurs as. Microscopic foci of it inside an
    otherwise mature teratoma raise the recurrence rate sharply, which is the practical reason the
    whole specimen is examined rather than sampled.
  evidence:
  - reference: PMID:39016163
    reference_title: >-
      Impact of microscopic deposits of yolk sac tumor on recurrence of mature sacrococcygeal
      teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 56 patients with mature SCT, of which 9 (16%) demonstrated microscopic YST.
    explanation: >-
      How often the microscopic component is present in tumours called mature, in a
      single-institution series.
  - reference: PMID:39016163
    reference_title: >-
      Impact of microscopic deposits of yolk sac tumor on recurrence of mature sacrococcygeal
      teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrence was more likely in patients with microscopic YST [5/9 (56%) vs. 2/47 (4%), p =
      0.021] and positive margins [6/24 (35%) vs. 1/32 (3.1%), p = 0.030].
    explanation: >-
      What it does to the recurrence rate, with the margin status beside it. Nine patients in the
      exposed arm, so read it as a signal rather than a rate.
  downstream:
  - target: Elevated serum alpha-fetoprotein
    causal_link_type: DIRECT
    description: >-
      The marker the malignant component secretes, and the thing surveillance measures.
    evidence:
    - reference: PMID:39016163
      reference_title: >-
        Impact of microscopic deposits of yolk sac tumor on recurrence of mature sacrococcygeal
        teratoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Five patients demonstrated malignant recurrence and were all detected by a rising
        alpha-fetoprotein (AFP), while two patients demonstrated recurrence of mature teratoma and
        were detected on surveillance magnetic resonance imaging (MRI).
      explanation: >-
        The division of labour between the two surveillance tests, and the edge: every malignant
        recurrence was found by the marker, and neither mature recurrence was.
  - target: Malignant recurrence
    causal_link_type: DIRECT
    description: >-
      Recurrence with malignant histology, which is what makes recurrence matter. It can be very late:
      many occur within one to six years and some as long as twenty years after diagnosis; no cited source
      gives the fraction in that window.
    evidence:
    - reference: PMID:33142194
      reference_title: >-
        Malignant recurrence after mature Sacrococcygeal teratoma: A meta-analysis and review of
        the literature.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fifty-seven (56 %) of a total of 102 recurrences after resection of an initially mature
        SCT were malignant, mostly yolk sac tumour (YST).
      explanation: >-
        Over half of recurrences after an initially mature tumour are malignant, and the histology
        is this node's. Pooled over 22 articles and 1516 patients.
- name: Pelvic and Perineal Mass Effect
  role: effector
  biological_scale: ORGANISM
  description: >-
    The consequences that outlast the tumour: impaired bowel function, urinary incontinence and an
    unacceptable scar, reported by nearly half of long-term survivors in a national study. No clinical
    variable predicted them.
  evidence:
  - reference: PMID:17560233
    reference_title: >-
      Long-term functional sequelae of sacrococcygeal teratoma: a national study in The Netherlands.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 46% who reported impaired bowel function and/or urinary incontinence (9%
      involuntary bowel movements, 13% soiling, 17% constipation), and 31% urinary incontinence.
    explanation: >-
      The breakdown, from 79 of 99 posted questionnaires at a median age of 9.7 years. A
      questionnaire study with an 80% response, so read it as the experience of those who answered.
  - reference: PMID:17560233
    reference_title: >-
      Long-term functional sequelae of sacrococcygeal teratoma: a national study in The Netherlands.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who are at higher risk for the development of long-term sequelae cannot be clearly
      assessed using clinical variables.
    explanation: >-
      The authors' negative result, and the reason this node has no predictors attached to it.
  downstream:
  - target: Bowel incontinence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Soiling or involuntary bowel movements after resection, in about a fifth of long-term survivors.
    evidence:
    - reference: PMID:17560233
      reference_title: >-
        Long-term functional sequelae of sacrococcygeal teratoma: a national study in The
        Netherlands.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There were 46% who reported impaired bowel function and/or urinary incontinence (9%
        involuntary bowel movements, 13% soiling, 17% constipation), and 31% urinary incontinence.
      explanation: >-
        The two bowel figures this phenotype covers, 9% and 13%, inside the combined 46%.
  - target: Urinary incontinence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reported by just under a third of long-term survivors.
    evidence:
    - reference: PMID:17560233
      reference_title: >-
        Long-term functional sequelae of sacrococcygeal teratoma: a national study in The
        Netherlands.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There were 46% who reported impaired bowel function and/or urinary incontinence (9%
        involuntary bowel movements, 13% soiling, 17% constipation), and 31% urinary incontinence.
      explanation: >-
        The 31% figure, which is this phenotype.
  - target: Constipation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The commonest single bowel complaint in the long-term study, at 17%.
    evidence:
    - reference: PMID:17560233
      reference_title: >-
        Long-term functional sequelae of sacrococcygeal teratoma: a national study in The
        Netherlands.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There were 46% who reported impaired bowel function and/or urinary incontinence (9%
        involuntary bowel movements, 13% soiling, 17% constipation), and 31% urinary incontinence.
      explanation: >-
        The 17% figure.
phenotypes:
- category: Neoplasm
  name: Sacrococcygeal mass
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: congenital mass at the sacrococcyx
    term:
      id: HP:0030736
      label: Sacrococcygeal teratoma
  description: >-
    The defining finding, present at birth and found before it in just over half of cases. The
    sacrococcygeal region is where most infant teratomas arise.
  evidence:
  - reference: PMID:16420341
    reference_title: >-
      Descriptive epidemiology of teratoma in infants, Hawaii, 1986-2001.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 22 cases were identified among deliveries in 1986-2001, of which 13 (59.1%) were
      located in the sacrococcygeal region.
    explanation: >-
      Nearly three fifths of all infant teratomas in a population-based Hawaii registry were at this
      site, which is the fact that makes this the default teratoma of the newborn.
- category: Prenatal
  name: Hydrops fetalis
  phenotype_term:
    preferred_term: fetal hydrops
    term:
      id: HP:0001789
      label: Hydrops fetalis
  description: >-
    The decompensated end of the high-output state, and a strong reported predictor of poor outcome at
    an odds ratio of 21 in one cohort - though a cited growth-velocity study reports a higher odds
    ratio for a different measure, and one cited review finds no survival effect for hydrops at all,
    which the entry records as an open disagreement rather than resolving.
  evidence:
  - reference: PMID:34327722
    reference_title: >-
      Factors associated with poor outcome in fetuses prenatally diagnosed with sacrococcygeal
      teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potential risk factors for poor outcome were the presence of fetal hydrops (OR: 21.0, CI:
      2.6-275.1, p = 0.012) and cardiomegaly (OR: 10.3, CI: 1.9-55.8, p = 0.011).
    explanation: >-
      The odds ratio and its confidence interval, which spans two orders of magnitude.
  - reference: PMID:38731178
    reference_title: >-
      Perinatal Outcomes of Intrauterine Interventions for Fetal Sacrococcygeal Teratoma Based on
      Different Surgical Techniques-A Systematic Review.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our evaluation, we determined that the presence of fetal hydrops and cardiac failure had no
      significant impact on survival in SCT cases.
    explanation: >-
      The opposite finding, from a review of 157 fetuses across three management groups - 16, 48 and 93, a sum the abstract does not
      itself state. REFUTE
      against the claim that hydrops predicts survival, and the reason this entry carries a
      controversy discussion rather than a single prognostic statement.
- category: Prenatal
  name: Cardiomegaly
  phenotype_term:
    preferred_term: fetal cardiomegaly
    term:
      id: HP:0001640
      label: Cardiomegaly
  description: >-
    The heart enlarging under a sustained output demand, and one of the two potential risk factors for
    poor outcome that the largest single prenatal cohort identifies. That cohort ran no multivariate
    analysis; the one study in this entry that did found no factor independent.
  evidence:
  - reference: PMID:34327722
    reference_title: >-
      Factors associated with poor outcome in fetuses prenatally diagnosed with sacrococcygeal
      teratoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potential risk factors for poor outcome were fetal hydrops and cardiomegaly.
    explanation: >-
      The authors' own summary of their analysis, which ran on the 68 fetuses left after sixteen
      terminations were excluded.
- category: Prenatal
  name: Polyhydramnios
  phenotype_term:
    preferred_term: polyhydramnios
    term:
      id: HP:0001561
      label: Polyhydramnios
  description: >-
    Excess amniotic fluid, much commoner among the fetuses who did not survive in the non-intervention arm of one review, and a component of one proposed composite index.
  evidence:
  - reference: PMID:39753205
    reference_title: >-

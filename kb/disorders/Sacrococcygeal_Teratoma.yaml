- population: Finland, all pregnancies 1987-2008, including live births, stillbirths and terminations
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 9.3
  notes: >-
    1 in 10,700, from 124 cases among 1,331,699 pregnancies in a national malformation register. The
    authors note this is markedly higher than the 1:27,000 to 1:40,000 previously reported and say it
    may reflect a true population difference or may reflect more complete registration. No rate_denominator is recorded, because none of the enum's values is right: the denominator is
    pregnancies, since the register counts stillbirths and terminations as well as live births. The
    slot is optional and falls back to live births for a birth prevalence, which is the nearest
    reading. The rate of 9.3 sits just under the top of the 1-9 per 100,000 band; 1 in 10,700 is
    9.35, which rounds into it.
  evidence:
  - reference: PMID:23432104
    reference_title: >-

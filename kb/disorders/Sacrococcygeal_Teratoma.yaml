    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other three cases resulted in preterm labor within 10 days of surgery.
    explanation: >-
      Preterm labour as a consequence of the intervention rather than of the disease, in three of
      five treated fetuses.
- category: Biochemical
  name: Elevated serum alpha-fetoprotein
  phenotype_term:
    preferred_term: elevated serum alpha-fetoprotein
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  description: >-
    The marker of the malignant component, and the basis of surveillance. Interpreting it in an infant is the hard part: alpha-fetoprotein is enormous at birth and halves every five days through the first four weeks, then
    settles: between day 180 and day 720 the cited reference study reports no further decline, and
    adult levels are still not reached by two years.
  evidence:
  - reference: PMID:32376010
    reference_title: >-
      Diagnostic accuracy of serum alpha-fetoprotein levels in diagnosing recurrent sacrococcygeal
      teratoma: A systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifteen studies (613 patients, 121 recurrences) were included and these mainly described serum
      AFP levels in patients with recurrent SCT (n = 111); 83 (75%) patients with recurrent SCT had
      elevated serum AFP levels.
    explanation: >-
      Three quarters of recurrences have an elevated marker. The authors' own caveat, quoted on the
      diagnosis row, is that the studies mostly describe patients already known to have elevated
      levels, so the sensitivity is probably overestimated.
  - reference: PMID:9592840
    reference_title: >-
      Alpha 1-fetoprotein (AFP) reference values in infants up to 2 years of age.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At birth mean serum AFP levels were 41,687 ng/ml in 256 term babies and 158,125 ng/ml in 90
      premature babies born before the 37th gestational week, excluding samples from children with
      factors known to be associated with AFP elevation.
    explanation: >-
      Why a single value means little in a neonate: the normal mean at birth is tens of thousands of
      nanograms per millilitre, and four times that in a premature baby. The reference study is of
      healthy infants, not of this disease.
- category: Neoplasm
  name: Malignant recurrence
  phenotype_term:
    preferred_term: malignant recurrence, usually yolk sac tumour
    term:
      id: HP:0100728
      label: Germ cell neoplasia
  description: >-
    Recurrence with malignant histology. HPO has no yolk sac tumour term, so the binding is at germ cell
    neoplasia and the preferred term carries it. No frequency band is recorded: the figure quoted
    below, 126 malignant recurrences, is 36% of recurrences and 3.7% of the 3407 children, and the
    two are different quantities.
  evidence:
  - reference: PMID:39248311
    reference_title: >-
      Malignant transformation and tumour recurrence in sacrococcygeal teratoma: a global,
      retrospective cohort study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent SCT was diagnosed in 349 (10.2%) children with 126 (36.1%) malignant recurrences.
    explanation: >-
      The rate in the largest cohort cited here: 3407 children analysed from 145 institutes in 62
      countries, against previous studies the same authors call small.
  - reference: PMID:33142194
    reference_title: >-
      Malignant recurrence after mature Sacrococcygeal teratoma: A meta-analysis and review of the
      literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled proportions of mature and malignant recurrences after mature SCT were 3 % (95 % CI
      1-4 %) and 5% (95 % CI 3-6 %), respectively.
    explanation: >-
      The same quantity restricted to tumours that were mature at resection, which is the scoping
      the row above does not have: 5% of those recur with malignant histology, pooled over 22
      articles and 1516 patients.
- category: Gastrointestinal
  name: Bowel incontinence
  phenotype_term:
    preferred_term: soiling or involuntary bowel movements
    term:
      id: HP:0002607
      label: Bowel incontinence
  description: >-
    A late consequence, reported at a median age of nearly ten years.
  evidence:
  - reference: PMID:17560233

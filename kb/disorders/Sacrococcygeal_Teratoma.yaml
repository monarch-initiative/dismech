    explanation: >-
      The authors' summary of the three long-term phenotypes this entry records.
genetic:
- name: BAK1 rs210138
  gene_term:
    preferred_term: BAK1
    term:
      id: hgnc:949
      label: BAK1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    A susceptibility allele first found for adult testicular germ cell tumour and then associated with
    paediatric germ cell tumours in two independent designs. Neither study is of sacrococcygeal
    teratoma specifically: both pool germ cell tumours across sites, and this entry records the allele
    at that level rather than claiming it for this tumour.
  evidence:
  - reference: PMID:22072546
    reference_title: >-
      Associations between variants in KITLG, SPRY4, BAK1, and DMRT1 and pediatric germ cell tumors.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a significant association for rs210138 (BAK1) and pediatric GCT overall (odds
      ratio (OR) = 1.80, 95% confidence interval (CI) 1.10-2.95, P = 0.02) with non-significant
      associations similar in magnitude in both the pediatric (P = 0.09) and adolescent (P = 0.06)
      age groups.
    explanation: >-
      The association in 52 paediatric germ cell tumours against 141 newborn blood-spot controls.
      Small, and significant overall while neither age stratum reaches significance on its own.
  - reference: PMID:28295819
    reference_title: >-
      Variants in BAK1, SPRY4, and GAB2 are associated with pediatric germ cell tumors: A report
      from the children's oncology group.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A variant in BAK1 (rs210138) was positively associated with GCT (OR [95% CI]: 1.70 [1.32,
      2.18])
    explanation: >-
      The same variant in a case-parent triad design with 366 complete trios, which does not share
      the control group of the study above. The same sentence continues with a stronger estimated
      effect for testis tumours, which is where this locus was first found.

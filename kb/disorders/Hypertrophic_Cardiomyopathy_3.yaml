- name: Loss of Crossbridge Inhibition and Increased Myofilament Calcium Sensitivity
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Mutant alpha-tropomyosin is more flexible and sits less stably in the
    inhibitory (blocked/closed) position on actin, so the thin filament fails to
    keep myosin switched off. The measurable consequences are a left-shift in the
    calcium dependence of filament sliding, residual actomyosin activity at low
    calcium, and loss of the normal inhibition of sliding in relaxing conditions.
    Different alleles reach this end state by different routes - S215L and D219V
    principally by destabilizing the blocked state, E192K by permitting residual
    crossbridge activity even while overall calcium sensitivity falls - which is
    why calcium sensitivity alone is an incomplete description of the lesion.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:

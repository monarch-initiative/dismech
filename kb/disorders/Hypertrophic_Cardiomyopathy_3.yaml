name: Hypertrophic Cardiomyopathy 3
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMH3
- TPM1 hypertrophic cardiomyopathy
- hypertrophic cardiomyopathy caused by mutation in TPM1
- hypertrophic cardiomyopathy type 3
- cardiomyopathy, hypertrophic, 3
- cardiomyopathy, familial hypertrophic, 3
description: >-
  Hypertrophic cardiomyopathy 3 (CMH3) is the TPM1-related form of familial
  hypertrophic cardiomyopathy. TPM1 encodes alpha-tropomyosin, the elongated
  coiled-coil dimer that lies in the groove of the actin thin filament and,
  together with the troponin complex, gates myosin access to actin across the
  blocked, closed, and open regulatory states of the cardiac sarcomere. CMH3 was
  one of the two founding observations that established hypertrophic
  cardiomyopathy as a disease of the sarcomere: missense variants at the
  chromosome 15q locus (Asp175Asn, Glu180Gly) were shown in 1994 to cosegregate
  with familial hypertrophic cardiomyopathy. Because tropomyosin's job is
  inhibitory, the recurring molecular consequence of HCM-associated TPM1 variants
  is a failure to keep crossbridges switched off: molecular-dynamics,
  in vitro motility, and engineered-heart-tissue studies of S215L, E192K, D219V,
  and E62Q converge on destabilization of the inhibited regulatory state, higher
  myofilament calcium sensitivity or residual actomyosin activity at low calcium,
  hypercontractility, and impaired relaxation, with induction of a hypertrophic
  gene program downstream. The clinical picture is that of hypertrophic
  cardiomyopathy generally - unexplained left ventricular hypertrophy, myocyte
  hypertrophy with disarray and replacement fibrosis on histology, diastolic
  dysfunction, arrhythmia, and a risk of sudden cardiac death - but TPM1 is a
  minority cause, historically about 3% of familial cases, and outcome is
  strongly variant-dependent: the founder variant p.Arg21Leu shows late-onset,
  incomplete penetrance and generally favourable prognosis, while other alleles
  have been reported in families ascertained through sudden cardiac death. TPM1
  is also an allelic cause of dilated, restrictive, and noncompaction
  cardiomyopathy, and disentangling which molecular consequence steers a carrier
  toward the hypertrophic rather than the dilated phenotype is an active research
  question.

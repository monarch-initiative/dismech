- name: Autosomal Recessive (Rare Homozygous)
  description: >-
    Homozygous TPM1 genotypes are rare but reported, including a homozygous exon
    1 missense variant in a non-consanguineous family with paediatric HCM, and 6%
    of carriers in the p.Arg21Leu founder series were homozygous. Homozygosity is
    a dose effect on the same dominant allele rather than a mechanistically
    distinct recessive disease.

      Quantifies the TPM1 share of familial HCM cases in the founding
      referral-centre cohort. PARTIAL because a case fraction within an
      ascertained HCM series is not a population prevalence.
inheritance:
- name: Autosomal Dominant
  description: >-
    CMH3 is transmitted as an autosomal dominant trait, and the TPM1-HCM
    gene-disease relationship has been classified by ClinGen's Hereditary
    Cardiovascular Disease Gene Curation Expert Panel as Definitive with
    autosomal dominant inheritance. Penetrance is incomplete and age-dependent,
    and both severity and age at diagnosis are variant- and sex-dependent.
  inheritance_term:

- name: Diastolic Dysfunction and Left Ventricular Outflow Tract Obstruction
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  biological_scale: ORGANISM
  role: effector
  description: >-
    The stiffened, hypertrophied, fibrotic ventricle fills poorly, and when
    hypertrophy is asymmetric and septal it can also obstruct the left
    ventricular outflow tract dynamically. The clinical result is exertional
    dyspnoea, chest pain, and reduced exercise capacity with preserved or
    supranormal ejection fraction. Thin-filament HCM as a class tends to produce
    relatively less hypertrophy and less outflow obstruction than thick-filament
    HCM while carrying more heart-failure morbidity, so the obstructive
    presentation should not be assumed in a TPM1 carrier.
  biological_processes:

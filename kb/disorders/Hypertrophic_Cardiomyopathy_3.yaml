      A TPM1 HCM pedigree ascertained through sudden cardiac death.
  - reference: PMID:38223010
    reference_title: "A Novel TPM1 Mutation Causes Familial Hypertrophic Cardiomyopathy in an Indian Family: Genetic and Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, some high-risk mutations causing sudden cardiac death are also
      known in this gene.
    explanation: >-
      States that high-risk sudden-death alleles exist within TPM1, the basis for
      allele-specific risk stratification.
  - reference: PMID:12651045
    reference_title: Variable clinical manifestation of a novel missense mutation in the alpha-tropomyosin (TPM1) gene in familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical data suggest a malignant phenotype at young age with a
      variable clinical manifestation and penetrance at older age.
    explanation: >-
      Documents a malignant young-onset TPM1 sudden-death phenotype coexisting
      with mild disease in older relatives of the same family.
- name: Congestive Heart Failure
  category: Cardiovascular
  description: >-
    Symptomatic heart failure, a less common but important endpoint; thin-filament
    HCM carries higher heart-failure morbidity than thick-filament HCM.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38874371
    reference_title: Identification of a novel likely pathogenic TPM1 variant linked to hypertrophic cardiomyopathy in a family with sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can cause a wide spectrum of clinical manifestations, ranging from
      asymptomatic to heart failure and sudden cardiac death (SCD).
    explanation: >-
      Places heart failure on the CMH3 clinical spectrum. The OCCASIONAL band
      reflects that most carriers in the largest series remained free of
      cardiovascular death or transplant at 50 years.
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      increased morbidity associated with heart failure, increased arrhythmia
      burden and potentially higher mortality
    explanation: >-
      Supports elevated heart-failure morbidity as a thin-filament class feature.
      PARTIAL because the claim is class-level rather than TPM1-specific.
- name: Restrictive Cardiomyopathy
  category: Cardiovascular
  description: >-
    A restrictive filling phenotype occurs in part of the TPM1 spectrum,
    particularly with compound-heterozygous genotypes, and thin-filament
    cardiomyopathy as a class shows more restrictive physiology than
    thick-filament disease.
  phenotype_term:
    preferred_term: Restrictive cardiomyopathy
    term:
      id: HP:0001723
      label: Restrictive cardiomyopathy
  frequency: VERY_RARE
  evidence:
  - reference: PMID:32882290
    reference_title: The effect of tropomyosin variants on cardiomyocyte function and structure that underlie different clinical cardiomyopathy phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a child with RCM with compound heterozygote TPM1 variants (E62Q and M281T)
    explanation: >-
      Documents restrictive cardiomyopathy in a TPM1 compound heterozygote whose
      singly heterozygous relatives had HCM, i.e. an allele-dose-dependent
      restrictive expression within a CMH3 family.
- name: Exercise Intolerance
  category: Cardiovascular
  description: >-
    Reduced exercise capacity from impaired diastolic filling with or without
    outflow obstruction, the symptom domain that responds to myosin-inhibitor
    therapy in obstructive disease.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with mavacamten improved exercise capacity, LVOT obstruction,
      NYHA functional class, and health status in patients with obstructive
      hypertrophic cardiomyopathy.
    explanation: >-
      Establishes reduced exercise capacity as a treatable clinical feature of
      obstructive HCM. PARTIAL because the trial enrolled obstructive HCM
      generally rather than genotyped TPM1 carriers.
- category: Cardiovascular
  name: Non-Sustained Ventricular Tachycardia
  description: >-
    Non-sustained ventricular arrhythmia is one of the features that marks
    elevated sudden-death risk in thin-filament hypertrophic cardiomyopathy, the
    class to which TPM1 disease belongs, and it is a component of the
    conventional risk-stratification tools. Its status in this genotype is
    genuinely unsettled rather than simply unmeasured - see the arrhythmic-risk
    knowledge gap - because the one prospective thin-filament cohort with
    follow-up recorded no malignant arrhythmic events at all.
  phenotype_term:
    preferred_term: Non-sustained ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  notes: >-
    Frequency deliberately omitted. Cohort percentages for NSVT in thin-filament
    HCM circulate in the literature but are not present in any abstract cached
    for this entry, and the direction of the effect is disputed between cohorts.
    HPO has no non-sustained-VT term, so the general term carries a narrower
    preferred_term.
  evidence:
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      high risk of SCD with positive family history, non-sustained ventricular
      arrythmias and abnormal
    explanation: >-
      Places non-sustained ventricular arrhythmia among the risk markers in
      thin-filament HCM. The snippet is a mid-sentence span because the cached
      PDF renders "affected by thin filament" with typographic ligatures that
      break exact substring matching. PARTIAL because this is a narrative review of the
      thin-filament class rather than a TPM1-specific measurement, and because
      the same class's prospective cohort data conflict with it.
- category: Cardiovascular
  name: Syncope
  description: >-
    Syncope of presumed arrhythmic origin is one of the established indications
    for defibrillator implantation in hypertrophic cardiomyopathy, which is what
    gives it weight in this entry beyond symptom burden - it feeds directly into
    the risk stratification the ICD treatment depends on.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  notes: >-
    Frequency deliberately omitted - no cached source reports a syncope rate in
    TPM1 or thin-filament HCM.
  evidence:
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      a history of syncope due to
      arrhythmia, LV apical aneurysm or LV systolic dysfunction
    explanation: >-
      Places arrhythmic syncope among the ICD indications. PARTIAL because it is
      a general HCM recommendation restated in a thin-filament review, not a
      TPM1-specific observation.
- category: Cardiovascular
  name: Abnormal Electrocardiogram
  description: >-
    The earliest detectable abnormality, and the reason cascade surveillance of
    genotype-positive relatives is worth doing at all. In a prospective cohort of
    sarcomere-variant carriers followed to diagnosis, 72.3% had an abnormal ECG
    at the time of HCM diagnosis and 54.2% had one BEFORE they met diagnostic
    criteria - a median 4.4 years before. An abnormal ECG in a genotype-positive
    relative is therefore not an incidental finding but the strongest available
    predictor of subsequent conversion to overt disease.
  phenotype_term:
    preferred_term: Abnormal EKG
    term:
      id: HP:0003115
      label: Abnormal EKG
  evidence:
  - reference: PMID:32731933
    reference_title: "Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these, 45 (54.2%) of 83 had an abnormal ECG before fulfilling the
      diagnostic criteria and this was first documented a median 4.4 years
    explanation: >-
      Establishes ECG abnormality as an antecedent of overt HCM rather than a
      concomitant of it, which is the empirical justification for the serial ECG
      surveillance this entry curates as cascade testing.
  notes: >-
    The cohort is sarcomere-variant carriers across genes, of whom TPM1 carriers
    were 3.2% (9 individuals), so this is class-level rather than
    TPM1-specific evidence. It is curated at SUPPORT rather than PARTIAL because
    the claim being made - that ECG change precedes diagnosis in sarcomeric HCM -
    is exactly what the cohort measured.
genetic:
- name: TPM1
  gene_term:
    preferred_term: TPM1
    term:
      id: hgnc:12010
      label: TPM1
  relationship_type: CAUSATIVE
  frequency: >-
    Minority cause of hypertrophic cardiomyopathy - about 3% of familial cases in
    the founding referral-centre survey, under 1% in more recent series.
  case_fractions:
  - population: Familial HCM referral-centre cohort (Watkins et al.)
    case_fraction_percent: 3.0
    notes: >-
      Historical estimate from the first systematic screen of alpha-tropomyosin
      in HCM probands.
    evidence:
    - reference: PMID:7898523
      reference_title: Mutations in the genes for cardiac troponin T and alpha-tropomyosin in hypertrophic cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in alpha-tropomyosin are a rare cause of familial hypertrophic
        cardiomyopathy, accounting for approximately 3 percent of cases.
      explanation: >-
        Direct quantitative statement of the TPM1 case fraction in familial HCM.
  - population: Iberian inherited-cardiac-disease cohort, p.Arg21Leu variant only
    case_fraction_percent: 0.61
    cohort_size: 4099
    notes: >-
      Single-variant fraction (p.Arg21Leu) among HCM cases in a 10,561-proband
      inherited-heart-disease series; reflects a regional founder effect in
      Galicia, Extremadura, and northern Portugal rather than a general TPM1
      rate.
    evidence:
    - reference: PMID:33642254
      reference_title: "Genotype-phenotype correlations in hypertrophic cardiomyopathy: a multicenter study in Portugal and Spain of the TPM1 p.Arg21Leu variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The TPM1 p.Arg21Leu variant was identified in 25/4099 (0.61%) HCM-cases,
        and was absent in 6462 control individuals with other inherited cardiac
        phenotypes (P<.0001).
      explanation: >-
        Gives the case fraction and cohort size for the founder variant, with
        case-control contrast.
  evidence:
  - reference: PMID:32731933
    reference_title: "Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 15 years follow-up, estimated HCM penetrance by causal gene was as
      follows: MYBPC3 43% (95% CI: 32% to 57%), MYH7 66% (95% CI: 47% to 83%),
      TNNI3 17% (95% CI: 7% to 39%), TNNT2 50% (95% CI: 30% to 74%), TPM1 42%
      (95% CI: 11% to 92%)
    explanation: >-
      The only gene-specific penetrance estimate available for TPM1: 42% at 15
      years. It is quoted with its full confidence interval and alongside the
      other genes deliberately, because the interval - 11% to 92% - overlaps
      every other gene in the table and the estimate rests on 9 carriers across
      3 families. PARTIAL for that reason: the point estimate is not
      distinguishable from the other sarcomere genes and must not be counselled
      as though it were a TPM1-specific figure. Quoting the bare 42% without the
      interval would be worse than omitting it.
  - reference: PMID:32731933
    reference_title: "Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers."
    supports: PARTIAL

- name: Divergent Non-Hypertrophic Remodeling Phenotypes
  biological_scale: TISSUE
  role: modifier
  description: >-
    Not every TPM1 variant produces hypertrophy. The same gene causes dilated,
    restrictive, and left ventricular noncompaction cardiomyopathy, and
    compound-heterozygous TPM1 genotypes have produced restrictive disease in a
    child whose singly heterozygous relatives had diastolic dysfunction and HCM.
    Paired mechanistic study of E62Q (hypertrophic) and E54K (dilated) attributes
    the divergence to which physical property of tropomyosin the substitution
    perturbs. This node is included because it constrains how a TPM1 finding may
    be interpreted clinically, not because it is part of the CMH3 causal chain.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:39436707
    reference_title: Distinct mechanisms drive divergent phenotypes in hypertrophic and dilated cardiomyopathy-associated TPM1 variants.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In E62Q, increased calcium sensitivity and hypercontractility was explained
      most accurately by a reduction in effective molecular stiffness of
      tropomyosin and alterations in its interactions with the actin thin
      filament that favor the "closed" regulatory state.
    explanation: >-
      Gives the proposed molecular basis of the hypertrophic branch, against
      which the dilated branch is contrasted in the same study.
  - reference: PMID:39436707
    reference_title: Distinct mechanisms drive divergent phenotypes in hypertrophic and dilated cardiomyopathy-associated TPM1 variants.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      By contrast, the E54K mutation appeared to act via long-range allosteric
      interactions to increase the association rate of the C-terminal troponin I
      mobile domain to tropomyosin/actin.
    explanation: >-
      The contrasting dilated-phenotype mechanism, establishing that the
      divergence has a molecular explanation rather than being purely stochastic.
  - reference: PMID:32882290
    reference_title: The effect of tropomyosin variants on cardiomyocyte function and structure that underlie different clinical cardiomyopathy phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a large family with DCM carrying a recently identified TPM1
      gene variant (T201M) and a child with RCM with compound heterozygote TPM1
      variants (E62Q and M281T) whose family members carrying single variants
      show diastolic dysfunction and HCM.
    explanation: >-
      Shows the hypertrophic, restrictive, and dilated expressions of TPM1
      variation coexisting within families, including allele-dose dependence.

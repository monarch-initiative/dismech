- name: Increased Myofilament Calcium Buffering and Calcium-Dependent Signaling
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Because the mutant thin filament binds calcium more tightly, more of the
    cytosolic calcium transient is sequestered on the myofilaments. Diastolic
    calcium rises and reuptake slows; compensatory changes in sodium/calcium
    exchange, SERCA2 activity, and ryanodine-receptor leak follow, driven by
    CaMKII phosphorylation. The altered calcium environment chronically engages
    the calcineurin/NFAT and ERK pathways that transcriptionally program
    cardiomyocyte hypertrophy, and also creates a substrate for triggered
    arrhythmia.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  - preferred_term: Calcineurin-NFAT signaling cascade
    term:
      id: GO:0033173
      label: calcineurin-NFAT signaling cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:29760186
    reference_title: Hypertrophic cardiomyopathy mutations increase myofilament Ca(2+) buffering, alter intracellular Ca(2+) handling, and stimulate Ca(2+)-dependent signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HCM mutations significantly lowered the Kd of Ca2+ binding, resulting in
      higher Ca2+ buffering of mutant cardiomyocytes.
    explanation: >-
      Quantifies the buffering change in cardiomyocytes expressing HCM
      thin-filament variants including the TPM1 allele D175N.
  - reference: PMID:29760186
    reference_title: Hypertrophic cardiomyopathy mutations increase myofilament Ca(2+) buffering, alter intracellular Ca(2+) handling, and stimulate Ca(2+)-dependent signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      coupled with a significant decrease in basal sarcomere length and slowed
      relaxation
    explanation: >-
      Links the buffering change to the diastolic phenotype: in the same
      sentence the authors report increased diastolic calcium and slowed calcium
      reuptake, and the quoted clause gives the mechanical consequence - shorter
      resting sarcomere length and slower relaxation. The quote starts
      mid-sentence because the preceding clause writes the calcium concentration
      in square brackets, which the reference validator normalizes away.
  - reference: PMID:29760186
    reference_title: Hypertrophic cardiomyopathy mutations increase myofilament Ca(2+) buffering, alter intracellular Ca(2+) handling, and stimulate Ca(2+)-dependent signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altered Ca2+ homeostasis also increased signaling via both
      calcineurin/NFAT and extracellular signal-regulated kinase pathways.
    explanation: >-
      Provides the transcriptional link from the calcium abnormality to the
      hypertrophic program.
  - reference: PMID:32882290
    reference_title: The effect of tropomyosin variants on cardiomyocyte function and structure that underlie different clinical cardiomyopathy phenotypes.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      All TPM1 variants result in reduced cardiomyocyte CaT amplitudes and loss
      of sarcomeric structures.
    explanation: >-
      Independent evidence that TPM1 variants disturb the cardiomyocyte calcium
      transient. PARTIAL because the variant panel spans HCM, DCM, and RCM
      alleles and the direction of the amplitude change differs from the
      buffering study, so it corroborates that calcium handling is perturbed
      without confirming the specific buffering mechanism.
  downstream:
  - target: Cardiomyocyte Hypertrophy with Myofiber Disarray and Interstitial Fibrosis
    causal_link_type: DIRECT
    hypothesis_groups:
    - tpm1_calcium_buffering_signaling
  - target: Arrhythmogenic Substrate and Sudden Cardiac Death

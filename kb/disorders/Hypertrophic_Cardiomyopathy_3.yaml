      Six percent of carriers were homozygous and 18% had an additional variant.
    explanation: >-
      Documents that homozygosity for a TPM1 HCM allele occurs at appreciable
      frequency in a founder population, alongside frequent additional
      sarcomere-gene variants.
mechanistic_hypotheses:
- hypothesis_group_id: tpm1_loss_of_crossbridge_inhibition
  hypothesis_label: Loss of tropomyosin-mediated crossbridge inhibition
  status: CANONICAL
  description: >-
    The canonical model of CMH3 is that HCM-associated TPM1 variants degrade
    tropomyosin's inhibitory function on the thin filament. Molecular-dynamics
    simulations show mutant tropomyosin is more flexible and its blocked/closed
    positioning on actin is destabilized; in vitro motility assays show higher
    calcium sensitivity of filament sliding and failure to inhibit sliding at low
    calcium; engineered heart tissues built from the same variants are
    hypercontractile with impaired relaxation and induce hypertrophic gene
    markers. Under this model the proximate lesion is excess residual actomyosin
    interaction rather than a loss of force-generating capacity.
  evidence:
  - reference: PMID:36896133
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TPM1 variant S215L.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These simulations and experiments support the classification of S215L as a
      pathogenic mutation and support the hypothesis that an inability to
      adequately inhibit actomyosin interactions is the mechanism whereby
      thin-filament mutations cause HCM.
    explanation: >-
      States the loss-of-inhibition hypothesis explicitly as the conclusion of a
      combined simulation, motility-assay, and engineered-heart-tissue study of a
      TPM1 HCM variant.
  - reference: PMID:34319370
    reference_title: Loss of crossbridge inhibition drives pathological cardiac hypertrophy in patients harboring the TPM1 E192K mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that the TPM1 E192K mutation triggers cardiomyocyte
      hypertrophy by permitting excess residual crossbridge activity.
    explanation: >-
      Independent confirmation of the same mechanism in a second TPM1 variant,
      using patient-derived engineered heart tissue.
- hypothesis_group_id: tpm1_calcium_buffering_signaling
  hypothesis_label: Myofilament calcium buffering as the initiator of hypertrophic signaling
  status: ALTERNATIVE
  description: >-
    A complementary account places the primary lesion one step downstream of the
    regulatory defect: because mutant thin filaments bind calcium more avidly,
    myofilament calcium buffering rises, diastolic calcium increases, reuptake
    slows, and calcium-dependent signaling through CaMKII, calcineurin/NFAT, and
    ERK is chronically engaged - providing the transcriptional drive for
    hypertrophy independent of the mechanical effect. The two accounts are not
    exclusive; they differ in what they nominate as the rate-limiting step and
    therefore in what a therapy should target.
  evidence:
  - reference: PMID:29760186
    reference_title: Hypertrophic cardiomyopathy mutations increase myofilament Ca(2+) buffering, alter intracellular Ca(2+) handling, and stimulate Ca(2+)-dependent signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altered myofilament Ca2+ buffering is the primary initiator of signaling
      cascades, indicating that directly targeting myofilament Ca2+ sensitivity
      provides an attractive therapeutic approach in HCM.
    explanation: >-
      States the alternative primacy claim. The study expressed the TPM1 HCM
      variant D175N (alongside troponin variants) in isolated cardiomyocytes, so
      it speaks directly to the CMH3 thin-filament lesion.
- hypothesis_group_id: tpm1_variant_specific_phenotype_divergence
  hypothesis_label: Variant-specific molecular divergence between hypertrophic and dilated TPM1 phenotypes
  status: EMERGING
  description: >-
    TPM1 variants cause hypertrophic, dilated, restrictive, and noncompaction
    cardiomyopathy, and an emerging body of work proposes that the divergence is
    set by which physical property of tropomyosin the substitution perturbs.
    Paired analysis of E62Q (HCM) and E54K (DCM) attributes the hypertrophic
    phenotype to reduced molecular stiffness with a shift toward the closed
    regulatory state, and the dilated phenotype to a long-range allosteric change
    in troponin I mobile-domain binding. Whether this generalizes across the TPM1
    allelic series, and how it interacts with modifier genotype and sex, is not
    settled.
  evidence:
  - reference: PMID:39436707
    reference_title: Distinct mechanisms drive divergent phenotypes in hypertrophic and dilated cardiomyopathy-associated TPM1 variants.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Our objective was to develop a mechanistic explanation of diverging
      phenotypes in two TPM1 mutations, E62Q (HCM) and E54K (DCM).
    explanation: >-
      Frames the hypothesis. Evidence source is COMPUTATIONAL because the
      mechanistic explanation is delivered by simulation constrained by
      stem-cell-derived cardiomyocyte data.
  - reference: PMID:31643006
    reference_title: Cardiomyopathy-associated mutations in tropomyosin differently affect actin-myosin interaction at single-molecule and ensemble levels.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Here, we found that the studied Tpm mutations differently affected the
      duration: the D175N mutation reduced it compared to WT Tpm, while the E180G
      mutation increased it.
    explanation: >-
      Shows that even two hypertrophic TPM1 alleles diverge at the
      single-molecule level, supporting variant specificity. PARTIAL because it
      does not itself connect the molecular divergence to a clinical phenotype.
pathophysiology:
- name: Alpha-Tropomyosin Thin Filament Regulatory Defect
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    TPM1 encodes alpha-tropomyosin, a rod-shaped coiled-coil dimer that polymerises
    head-to-tail along the actin thin filament and, in concert with the troponin
    complex, occupies the blocked, closed, or open azimuthal position that
    determines whether myosin can engage actin. Disease-associated missense
    substitutions are scattered along the molecule - in the N-terminal
    overlap/troponin T binding region (Arg21Leu, Gly3Arg, Glu62Gln, Gln68Arg), in
    the central period 4/5 region that contacts actin (Asp175Asn, Glu180Gly,
    Glu192Lys), and in the C-terminal region (Ser215Leu, Asp219Val, Asp254Gly) -
    and act by altering tropomyosin flexibility, its azimuthal positioning on
    actin, or its interactions with troponin, rather than by abolishing the
    protein. This is the primary cardiomyocyte insult of CMH3.

treatments:
- name: Cardiac Myosin Inhibition (Mavacamten)
  description: >-
    Mavacamten is a first-in-class allosteric cardiac myosin inhibitor that
    reduces the number of force-generating crossbridges. It is mechanistically
    well matched to CMH3, whose lesion is failure to keep crossbridges inhibited:
    in patient-derived engineered heart tissue carrying TPM1 E192K, chronic
    mavacamten abolished the contractile difference from control and reversed
    cardiomyocyte hypertrophy. In symptomatic obstructive HCM generally, the
    phase 3 EXPLORER-HCM trial showed improvement in exercise capacity, outflow
    gradient, NYHA class, and health status. The gene-specific evidence is
    preclinical; the clinical trial evidence is genotype-agnostic.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
  target_mechanisms:
  - target: "Cardiomyocyte Hypercontractility and Impaired Relaxation"
    treatment_effect: INHIBITS
    description: >-
      Myosin inhibition reduces the number of force-generating crossbridges,
      directly opposing the hypercontractile node that the TPM1 regulatory defect
      produces.
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:34319370
    reference_title: Loss of crossbridge inhibition drives pathological cardiac hypertrophy in patients harboring the TPM1 E192K mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Chronic mavacamten treatment abolished contractile differences between
      control and TPM1 E192K engineered heart tissues and reversed hypertrophy in
      cardiomyocytes.
    explanation: >-
      The gene-specific rationale: myosin inhibition corrects the contractile and
      hypertrophic phenotype of a TPM1 HCM variant in patient-derived tissue.
  - reference: PMID:34319370
    reference_title: Loss of crossbridge inhibition drives pathological cardiac hypertrophy in patients harboring the TPM1 E192K mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These studies also provide direct evidence that myosin inhibition by
      mavacamten can counteract the hypertrophic effects of mutant tropomyosin.
    explanation: >-
      Explicitly generalizes the result to mutant tropomyosin, i.e. to CMH3 as a
      class rather than to one allele.
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with mavacamten improved exercise capacity, LVOT obstruction,
      NYHA functional class, and health status in patients with obstructive
      hypertrophic cardiomyopathy.
    explanation: >-
      Pivotal clinical efficacy evidence. PARTIAL for CMH3 because EXPLORER-HCM
      enrolled symptomatic obstructive HCM without genotype stratification, and
      thin-filament HCM is less often obstructive.
  - reference: PMID:39436707
    reference_title: Distinct mechanisms drive divergent phenotypes in hypertrophic and dilated cardiomyopathy-associated TPM1 variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Modulators of myosin activity confirmed our proposed mechanisms by rescuing
      normal contractile behavior in accordance with predictions.
    explanation: >-
      Independent demonstration that myosin modulation rescues the contractile
      abnormality of TPM1 variants, and a caution that the required direction of
      modulation is variant-dependent.
  notes: >-
    The `therapeutic_agent` term binding is intentionally omitted: NCIT does have
    a Mavacamten concept (NCIT:C174901) but it is classified under
    NCIT:C168966 Inotropic Support rather than under NCIT:C1909 Pharmacologic
    Substance, so it is not reachable from the ChemicalEntityTerm roots and fails
    term validation; CHEBI has no mavacamten term. Per the CLAUDE.md convention,
    the agent is carried as free text rather than bound to an unreachable or
    incorrect identifier. This is an upstream NCIT classification gap.

    Direction of therapy is variant-dependent. Myosin inhibition is the correct
    direction for the hypercontractile hypertrophic alleles; the dilated TPM1
    alleles studied alongside them required the opposite modulation, so
    mavacamten should not be extrapolated to a TPM1 carrier with a dilated
    phenotype.

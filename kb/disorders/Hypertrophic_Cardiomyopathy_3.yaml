prevalence:
- population: Familial hypertrophic cardiomyopathy referral cohorts
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the TPM1-specific form of
    hypertrophic cardiomyopathy. What is documented is the share of HCM cases
    attributable to TPM1, which is small: roughly 3% of familial cases in the
    original referral-centre survey and under 1% in more recent series. The
    population occurrence of hypertrophic cardiomyopathy as a whole (about 1 in
    500) is curated on the umbrella Hypertrophic Cardiomyopathy entry and is not
    duplicated here.

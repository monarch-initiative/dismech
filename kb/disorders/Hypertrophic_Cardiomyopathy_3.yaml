      relationship as Definitive.
  - reference: PMID:8205619
    reference_title: "Alpha-tropomyosin and cardiac troponin T mutations cause familial hypertrophic cardiomyopathy: a disease of the sarcomere."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that missense mutations (Asp175Asn; Glu180Gly) in the
      alpha-tropomyosin gene cause familial hypertrophic cardiomyopathy (FHC)
      linked to chromosome 15q2.
    explanation: >-
      The original gene-disease assertion establishing TPM1 as causative for
      CMH3.
  - reference: PMID:38223010
    reference_title: "A Novel TPM1 Mutation Causes Familial Hypertrophic Cardiomyopathy in an Indian Family: Genetic and Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in TPM1 causing hypertrophic cardiomyopathy are < 1%.
    explanation: >-
      Contemporary estimate of the TPM1 contribution to HCM, lower than the
      historical 3% figure from referral-centre ascertainment.
  - reference: PMID:12651045
    reference_title: Variable clinical manifestation of a novel missense mutation in the alpha-tropomyosin (TPM1) gene in familial hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Glu62Gln mutation is the sixth TPM1 mutation identified as the cause of
      FHC, indicating that mutations in this gene are very rare.
    explanation: >-
      Independent statement of TPM1 rarity as an HCM cause, and a count of the
      known allelic series at the time of report.
  notes: >-
    The Glu62Gln allele is a useful anchor because it has both a human clinical
    pedigree (PMID:12651045, twelve affected members, five young deaths) and a
    full engineered-heart-tissue mechanistic characterization (PMID:39436707) -
    a rare combination in this gene.

    Reported CMH3 alleles are missense and distributed across the molecule rather
    than confined to a single hotspot, although codon 175/180 (period 4/5) and
    codon 21 (N-terminal) recur. Alleles cited in this entry with human
    genotype-phenotype data: Asp175Asn, Glu180Gly, Arg21Leu, Ser215Leu, Gln68Arg,
    Asp254Gly, Gly3Arg (homozygous), and Glu62Gln; alleles characterized
    principally in vitro or in silico: Glu192Lys, Asp219Val.
- name: MYH7 (digenic modifier)
  gene_term:
    preferred_term: MYH7
    term:
      id: hgnc:7577
      label: MYH7
  relationship_type: COOPERATING
  notes: >-
    Coexistence of a thin-filament TPM1 variant with thick-filament MYH7 variants
    has been reported to produce more severe hypertrophy than the TPM1 variant
    alone, and 18% of carriers in the p.Arg21Leu founder series carried an
    additional sarcomere-gene variant. Multi-variant genotype is therefore a
    relevant modifier when interpreting a TPM1 finding.

    This entry deliberately does NOT bind a digenic inheritance term
    (HP:0010984) and is not a member of the Digenic and Oligogenic Disorders
    grouping. A TPM1 variant alone causes CMH3; the MYH7 second hit changes
    severity, not whether disease occurs. Digenic inheritance in the sense the
    grouping uses requires both loci for the phenotype, which is not what the
    cited South Indian family shows. Recorded here so the call is not
    re-litigated from the paper's title, which does say "digenic".
  evidence:
  - reference: PMID:25607779
    reference_title: "Coexistence of Digenic Mutations in Both Thin (TPM1) and Thick (MYH7) Filaments of Sarcomeric Genes Leads to Severe Hypertrophic Cardiomyopathy in a South Indian FHCM."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we strongly suggest that the coexistence of these digenic mutations
      is rare, but leads to severe hypertrophy in a South Indian familial
      hypertrophic cardiomyopathy (FHCM).
    explanation: >-
      Reports the digenic TPM1-plus-MYH7 genotype and its association with more
      severe hypertrophy.
  - reference: PMID:25607779
    reference_title: "Coexistence of Digenic Mutations in Both Thin (TPM1) and Thick (MYH7) Filaments of Sarcomeric Genes Leads to Severe Hypertrophic Cardiomyopathy in a South Indian FHCM."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient #1 showed a more severe disease phenotype, with poor prognosis and
      a family history of sudden cardiac death, than patient #2.
    explanation: >-
      Within-study contrast between the digenic and the single-TPM1-variant
      proband, supporting the modifier claim.
  - reference: PMID:33642254
    reference_title: "Genotype-phenotype correlations in hypertrophic cardiomyopathy: a multicenter study in Portugal and Spain of the TPM1 p.Arg21Leu variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six percent of carriers were homozygous and 18% had an additional variant.
    explanation: >-
      Quantifies how often a TPM1 HCM carrier also carries a second variant, the
      population-level basis for treating multi-variant genotype as a modifier.
diagnosis:
- name: Echocardiographic Demonstration of Unexplained Left Ventricular Hypertrophy
  description: >-
    CMH3 is diagnosed, like all HCM, by imaging demonstration of increased left
    ventricular wall thickness that is not explained by abnormal loading
    conditions. Echocardiography defines the distribution of hypertrophy, the
    presence and gradient of dynamic outflow obstruction, and diastolic function;
    hypertrophic pattern differs by causal gene, so echocardiographic morphology
    can inform which gene to prioritise.
  evidence:
  - reference: PMID:38223010
    reference_title: "A Novel TPM1 Mutation Causes Familial Hypertrophic Cardiomyopathy in an Indian Family: Genetic and Clinical Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertrophic cardiomyopathy (HCM) is a common inherited cardiac disorder
      characterised by unexplained left ventricular hypertrophy in the absence of
      abnormal loading conditions.
    explanation: >-
      States the diagnostic criterion applied in a TPM1-variant family report.
  - reference: PMID:37561025
    reference_title: "Gene-echocardiography: refining genotype-phenotype correlations in hypertrophic cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings underscore a strong link between hypertrophic patterns and
      genetic variants in HCM, providing a foundation for more accurate genetic
      testing and personalized management of HCM patients.
    explanation: >-
      Supports using echocardiographic hypertrophy pattern to guide genetic
      testing. PARTIAL because the reported gene-pattern associations concern
      MYBPC3, MYH7, ALPK3, TTN and OBSCN rather than TPM1 specifically.
- name: Sarcomere Gene Panel or Exome Sequencing
  description: >-
    Molecular confirmation requires sequencing of the sarcomere genes; TPM1 is a
    standard panel component. Because TPM1 accounts for only a small share of
    cases, the diagnosis is usually made as part of a multi-gene panel or exome,
    with segregation analysis in relatives to establish causality. Multi-variant
    genotypes are common enough that a TPM1 finding should not stop the search.
  evidence:
  - reference: PMID:38874371
    reference_title: Identification of a novel likely pathogenic TPM1 variant linked to hypertrophic cardiomyopathy in a family with sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES) was performed in all available family members
      to identify the causal variant, which was validated, and segregation
      analysis was conducted via Sanger sequencing.
    explanation: >-
      Describes the exome-plus-segregation workflow by which a novel TPM1 CMH3
      allele was established.
  - reference: PMID:33642254
    reference_title: "Genotype-phenotype correlations in hypertrophic cardiomyopathy: a multicenter study in Portugal and Spain of the TPM1 p.Arg21Leu variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TPM1 was evaluated by next-generation sequencing in 10 561 unrelated
      probands with inherited heart diseases.
    explanation: >-
      Documents next-generation sequencing of TPM1 as routine practice in
      inherited-heart-disease diagnostics.
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      We report 29 genes with definitive, strong or moderate evidence of
      causation for HCM or isolated LVH, including sarcomere, sarcomere-associated
      and syndromic conditions.
    explanation: >-
      Defines the evidence-backed gene set that an HCM panel should cover, of
      which TPM1 is one. PARTIAL because the quoted conclusion is panel-wide;
      the TPM1-specific Definitive classification is carried by the ClinGen
      CGGV assertion row cited elsewhere in this entry.
- name: Cascade Genetic Testing of At-Risk Relatives
  description: >-
    Once a pathogenic TPM1 variant is identified in a proband, predictive testing
    of first-degree relatives identifies carriers who need longitudinal cardiac
    surveillance and releases non-carriers from it. Because penetrance is
    incomplete and age-dependent - only half of male and a quarter of female
    p.Arg21Leu carriers are diagnosed by age 50 - a normal echocardiogram in a
    young carrier does not exclude later disease.
  evidence:
  - reference: PMID:38874371
    reference_title: Identification of a novel likely pathogenic TPM1 variant linked to hypertrophic cardiomyopathy in a family with sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early detection of pathogenic variants can facilitate timely intervention
      and management, potentially reducing the risk of SCD in individuals with
      HCM.
    explanation: >-
      States the rationale for cascade testing in a TPM1 HCM family with sudden
      cardiac death.
  - reference: PMID:33642254
    reference_title: "Genotype-phenotype correlations in hypertrophic cardiomyopathy: a multicenter study in Portugal and Spain of the TPM1 p.Arg21Leu variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of 70 years, 17% of males and 46% of female carriers were
      unaffected.
    explanation: >-
      Quantifies lifelong non-penetrance, the reason cascade-identified carriers
      need continuing rather than one-off surveillance.
  - reference: PMID:32731933
    reference_title: Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following a first negative screening, approximately 50% of SP mutation
      carriers develop HCM over 15 years of follow-up.
    explanation: >-
      Quantifies conversion after an initially negative screen, the central
      argument for repeat rather than one-off surveillance. PARTIAL because the
      cohort pooled sarcomere-protein genes, of which TPM1 carriers were a small
      minority.
  - reference: PMID:32731933
    reference_title: Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Male sex and an abnormal ECG are associated with a higher risk of
      developing HCM. Regular CMR should be considered in long-term screening.
    explanation: >-
      Identifies the surveillance modifiers (male sex, abnormal ECG) and the
      role of cardiac MRI. The male-sex effect is concordant with the sex
      difference seen in the TPM1 p.Arg21Leu series. PARTIAL for the same
      pooled-gene reason.
- name: Cardiac Magnetic Resonance with Late Gadolinium Enhancement
  diagnosis_term:
    preferred_term: Cardiac magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    CMR does two things in this genotype that echocardiography does not. It
    measures wall thickness more reliably in the segments where thin-filament
    disease is mildest - the one prospective thin-filament cohort found the
    difference from thick-filament disease significant by both echo and CMR,
    with the CMR comparison the stronger of the two - and late gadolinium
    enhancement quantifies the fibrotic substrate that this entry curates as a
    phenotype and as an arrhythmic mechanism. The second matters
    disproportionately here because the hypertrophy in thin-filament disease is
    milder than in thick-filament disease, so wall thickness alone understates
    disease burden in exactly this population.
  results: >-
    Maximum wall thickness, typically lower than in thick-filament HCM, and late
    gadolinium enhancement marking replacement fibrosis.
  evidence:
  - reference: DOI:10.3390/jcm14030866
    reference_title: "Clinical Features and Prospective Outcomes of Thin-Filament Hypertrophic Cardiomyopathy: Intrinsic Data and Comparative Insights from Other Cohorts"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individuals with thin-filament mutations exhibited significantly lower
      maximum left ventricular wall thickness, as measured by both
      echocardiography (p = 0.024) and cardiac magnetic resonance (p = 0.006)
    explanation: >-
      Establishes CMR as a measuring modality in this population and the
      thinner-phenotype finding that makes imaging interpretation
      genotype-dependent.
  notes: >-
    The late-gadolinium-enhancement prevalence figure that circulates for
    thin-filament HCM is not quotable from any abstract cached for this entry -
    it comes from the full text of the cohort study. The role of LGE is stated
    here on the strength of the fibrosis phenotype this entry already curates
    rather than on an unverified percentage.
differential_diagnoses:
- name: Thick-Filament Sarcomeric HCM (MYH7, MYBPC3)
  description: >-
    The other, far commoner sarcomeric causes of hypertrophic cardiomyopathy.
    Clinically and histologically overlapping with CMH3 - the histopathology is
    explicitly indistinguishable - so the distinction is molecular. Thick-filament
    disease tends to produce more hypertrophy and more outflow obstruction and
    less restrictive physiology than thin-filament disease.
  distinguishing_features:
  - Distinguished by the causal gene on sequencing, not by histology
  - Greater degrees of LV hypertrophy and outflow obstruction than thin-filament HCM
  - Distinct hypertrophy distributions on echocardiography (mid-septal for MYBPC3, higher septum-to-posterior-wall ratio for MYH7)
  evidence:
  - reference: PMID:9060904
    reference_title: Clinical features of hypertrophic cardiomyopathy caused by mutation of a "hot spot" in the alpha-tropomyosin gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On cardiac histopathologic study, defects in this sarcomere thin filament
      component are indistinguishable from other genetic etiologies of
      hypertrophic cardiomyopathy.
    explanation: >-

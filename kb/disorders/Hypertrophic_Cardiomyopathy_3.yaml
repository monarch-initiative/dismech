notes: >-
  Scope. This entry models MONDO:0007267 (hypertrophic cardiomyopathy 3), the
  TPM1 node of the CMH numbered series, and conforms to the
  cardiomyopathy_maladaptive_remodeling module at its trigger, ventricular
  remodeling, contractile dysfunction, and heart failure nodes. It is
  deliberately kept as a gene-specific entity under the umbrella
  `Hypertrophic_Cardiomyopathy` (MONDO:0005045) entry rather than folded into it:
  the umbrella carries the population epidemiology, the physiological
  obstructive/non-obstructive subtypes, and the full generic HCM treatment set
  (beta blockers, calcium channel blockers, septal myectomy, alcohol septal
  ablation), none of which is duplicated here. ICD is the one exception and is
  curated here rather than delegated, because risk stratification in
  thin-filament disease is genotype-dependent in a way the generic set is not -
  see the arrhythmic-risk knowledge gap, which records that the two available
  bodies of evidence disagree about whether this class carries elevated or
  reduced arrhythmic risk. What this entry adds is the
  TPM1-specific causal chain, the thin-filament-versus-thick-filament phenotype
  contrast, the allele-resolved genotype-phenotype and prognosis data, and the
  gene-specific mavacamten rationale.

  Named Entity Confusion preflight (per CLAUDE.md). The CMH numbered series is a
  documented high-NEC-risk class, so MONDO:0007267 was verified with OAK before
  any curation: the definition names TPM1 as the causal gene, the record carries
  `relationship: RO:0004003 HGNC:12010 ! TPM1`, the OMIM xref is OMIM:115196, and
  synonyms include CMH3 and "cardiomyopathy, familial hypertrophic, 3". Every
  gene-level claim in this entry concerns TPM1. The MONDO parent is
  MONDO:0024573 (familial hypertrophic cardiomyopathy).

  Deep-research provenance. The requested provider was Edison/FutureHouse
  (falcon), but no EDISON_API_KEY or FUTUREHOUSE_API_KEY was available in the
  curation environment and the provider registry reported only `claude_code` as
  available, so the `claude_code` provider was used instead. Regardless of
  provider, the report was NEC-preflighted before use (TPM1 named 125 times
  versus 19 for the next-most-frequent gene MYBPC3, and OMIM 115196 asserted
  throughout, both matching the MONDO record) and then treated as leads only: every PMID cited
  here was fetched with `just fetch-reference`, every snippet was verified as an
  exact substring of the cached abstract by `just validate-references`, and every
  ontology term was checked by `just validate-terms`.

  Evidence balance and its limits. The human literature on CMH3 is
  genotype-phenotype correlation, not mechanism; the mechanism comes almost
  entirely from reconstituted filaments, molecular dynamics, hiPSC-cardiomyocytes,
  engineered heart tissue, and one transgenic mouse line (the Glu180Gly
  alpha-TM180 model, PMID:11603924, which supplies the only whole-organism
  evidence in this entry). Evidence items are typed accordingly
  (COMPUTATIONAL for simulation-derived claims, IN_VITRO for filament assays and
  engineered tissue, HUMAN_CLINICAL for pedigree and cohort data), and the
  resulting translational-validity question is recorded explicitly as a
  HUMAN_MODEL_MISMATCH discussion rather than glossed. Several mechanistic
  studies characterize alleles (E192K, D219V, S215L) whose independent clinical
  pathogenicity rests on small numbers of families; the explanations name the
  allele in each case so the reader can see which variant a given claim rests on.

  GeneReviews scope. There is no TPM1-specific GeneReviews chapter. The
  applicable resource is the disease-level "Nonsyndromic Hypertrophic
  Cardiomyopathy Overview" (PMID:20301725), tagged accordingly in `references`.
  Its indexed PubMed record contains only the chapter's six-clause purpose
  statement, not the Clinical Characteristics or Management sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this entry
  is therefore built from the primary TPM1 cohort and pedigree literature
  (PMID:9060904, PMID:33642254, PMID:38874371, PMID:38223010) plus the
  thin-filament cardiomyopathy review (PMID:36158814).

  Frequency discipline. Frequency bands are given only where a source supports
  them. Left ventricular hypertrophy is VERY_FREQUENT and hypertrophic
  cardiomyopathy itself OBLIGATE (it is the defining feature of the entity);
  outflow obstruction and heart failure are OCCASIONAL as a qualitative mapping
  of the thin-filament class comparison, and those items are marked PARTIAL
  because no TPM1-specific rate is published. Most other phenotypes carry no
  frequency band rather than a guessed one.

  Content deliberately not curated, recorded so it is not repeatedly re-raised.
  Several figures that circulate for thin-filament and TPM1 hypertrophic
  cardiomyopathy are not quotable from any source cached for this entry, and are
  omitted rather than attached to a citation that does not contain them: the
  cohort percentages for non-sustained ventricular tachycardia, symptomatic
  dyspnea and late gadolinium enhancement all come from the full text and tables
  of the thin-filament outcome study rather than its abstract, which is what is
  cached; the case-control odds ratio showing no HCM excess for truncating TPM1
  variants comes from a web-hosted variant atlas rather than from a paper with a
  quotable abstract; and the Finnish p.Asp175Asn founder-population detail is
  likewise not present in any cached record. The underlying claims are
  plausible and in several cases important - the truncating-variant negative in
  particular is the observation that grounds a gain-of-function rather than
  haploinsufficiency mechanism - but this entry states them only where a cached
  source supports them. The truncating-variant point is instead made
  qualitatively where the evidence does support it: every curated TPM1 allele in
  this entry is missense.

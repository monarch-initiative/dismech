    remodel the myocardium into the classic hypertrophic pattern: myocyte
    hypertrophy, loss of the normal parallel myofibre architecture (disarray),
    and replacement/interstitial fibrosis, producing wall thickening with a small
    cavity. Histology in TPM1-mutation hearts is indistinguishable from that of
    other sarcomeric causes, so the node is a faithful specialization of the
    generic ventricular-remodeling node rather than a TPM1-specific pathology.
    Human cardiac biopsies carrying TPM1 variants show loss of sarcomeric

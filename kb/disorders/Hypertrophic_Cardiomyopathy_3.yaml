    reference_title: "Mutation-specific pathology and treatment of hypertrophic cardiomyopathy in patients, mouse models and human engineered heart tissue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypertrophic cardiomyopathy (HCM) is the most common inherited
      cardiomyopathy and is characterized by asymmetric left ventricular
      hypertrophy and diastolic dysfunction, and a frequent cause of sudden
      cardiac death at young age.
    explanation: >-
      States the asymmetric-hypertrophy-plus-diastolic-dysfunction phenotype that
      this node represents. Evidence source is OTHER because this is a review.
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A number of distinct clinical findings appear to be correlated with
      thin-filament mutations: greater degrees of restrictive cardiomyopathy and
      relatively less left ventricular (LV) hypertrophy and LV outflow tract
      obstruction than that seen with thick filament mutations, increased
      morbidity associated with heart failure, increased arrhythmia burden and
      potentially higher mortality.
    explanation: >-
      The key CMH3-specific qualifier on this node: thin-filament HCM skews away
      from obstruction and toward restrictive physiology, heart failure, and
      arrhythmia.
  downstream:

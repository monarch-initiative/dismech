discussions:
- discussion_id: tpm1_which_molecular_step_is_rate_limiting
  prompt: >-
    Is the rate-limiting step in CMH3 the mechanical loss of crossbridge
    inhibition, or the increase in myofilament calcium buffering that drives
    calcium-dependent hypertrophic signaling - and does the answer differ by
    allele?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Crossbridge Inhibition and Increased Myofilament Calcium Sensitivity
  - pathophysiology#Increased Myofilament Calcium Buffering and Calcium-Dependent Signaling
  rationale: >-
    The two hypothesis groups curated here nominate different rate-limiting steps
    and imply different therapeutic targets: myosin inhibition if the mechanical
    arm dominates, calcium-desensitisation if the signaling arm does. The
    supporting studies use different alleles in different systems (S215L, E192K,
    and E62Q in engineered heart tissue; D175N in isolated cardiomyocytes), so no
    single system has tested both arms against each other for the same variant.
    Until that is done the pathograph must carry both arms rather than assert a
    single canonical chain.
  evidence:
  - reference: PMID:29760186
    reference_title: Hypertrophic cardiomyopathy mutations increase myofilament Ca(2+) buffering, alter intracellular Ca(2+) handling, and stimulate Ca(2+)-dependent signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altered myofilament Ca2+ buffering is the primary initiator of signaling
      cascades, indicating that directly targeting myofilament Ca2+ sensitivity
      provides an attractive therapeutic approach in HCM.
    explanation: >-
      One side of the open question, asserting calcium buffering as primary.
  - reference: PMID:36896133
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TPM1 variant S215L.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data form a mechanistic description of TPM1 S215L pathogenicity that
      starts with disruption of the mechanical and regulatory properties of
      tropomyosin, leading thereafter to hypercontractility and finally induction
      of a hypertrophic phenotype.
    explanation: >-
      The other side, placing the mechanical/regulatory disruption first in the
      causal order.
- discussion_id: tpm1_allele_to_phenotype_map
  prompt: >-
    What determines whether a given TPM1 substitution produces hypertrophic,
    dilated, restrictive, or noncompaction cardiomyopathy, and can that mapping be
    predicted from the residue's structural role well enough to guide variant
    interpretation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Divergent Non-Hypertrophic Remodeling Phenotypes
  rationale: >-
    TPM1 is a single small gene with at least four distinct cardiomyopathy
    outputs, and within a single family the same variant can produce diastolic
    dysfunction in one relative and overt HCM in another, while compound
    heterozygosity produced restrictive disease in a child. One paired study
    offers a molecular explanation for the hypertrophic-versus-dilated split, but
    it covers two variants. Without a systematic allele-to-mechanism-to-phenotype
    map, a novel TPM1 missense finding cannot be assigned to CMH3 rather than to
    its allelic siblings on mechanistic grounds, and the therapeutic direction
    (myosin inhibition versus activation) is not determinable from the genotype.
  evidence:
  - reference: PMID:32882290
    reference_title: The effect of tropomyosin variants on cardiomyocyte function and structure that underlie different clinical cardiomyopathy phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a large family with DCM carrying a recently identified TPM1
      gene variant (T201M) and a child with RCM with compound heterozygote TPM1
      variants (E62Q and M281T) whose family members carrying single variants
      show diastolic dysfunction and HCM.
    explanation: >-
      Illustrates the within-gene and within-family phenotypic divergence that
      the gap concerns.
  - reference: PMID:32217077
    reference_title: "Mutation-specific pathology and treatment of hypertrophic cardiomyopathy in patients, mouse models and human engineered heart tissue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several mutation-mediated disease mechanisms have been identified, with
      proof for gene- and mutation-specific cellular perturbations.
    explanation: >-
      Confirms that mutation-specific mechanism is an established phenomenon in
      HCM, making an allele-resolved map a realistic rather than speculative goal.
- discussion_id: tpm1_hcm_human_model_fidelity
  prompt: >-
    Do engineered heart tissues and hiPSC-cardiomyocytes carrying TPM1 variants
    faithfully model adult human CMH3, given that they are immature, lack the
    fibrotic and neurohormonal context, and in several studies overexpress the
    variant rather than carry it at endogenous dose?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte Hypercontractility and Impaired Relaxation
  rationale: >-
    Almost all of the mechanistic evidence for CMH3 curated here comes from
    engineered tissue, hiPSC-cardiomyocytes, reconstituted filaments, or
    simulation - the human clinical literature supplies genotype-phenotype
    correlation but essentially no mechanism. These systems reproduce
    hypercontractility and diastolic dysfunction convincingly, but they cannot
    reproduce the fibrosis, disarray, and neurohormonal remodeling that dominate
    the clinical disease, and overexpression studies replaced a substantial
    fraction of endogenous protein. The direction of a reported effect can even
    invert between systems: one variant panel reported reduced calcium-transient
    amplitude in overexpressing cardiomyocytes, whereas the buffering study
    reported increased diastolic calcium. This is an open question of
    translational validity rather than an absence of evidence.
  evidence:
  - reference: PMID:32882290
    reference_title: The effect of tropomyosin variants on cardiomyocyte function and structure that underlie different clinical cardiomyopathy phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To define toxic threshold levels, we performed dose-dependent transfection
      of TPM1 variants.
    explanation: >-
      Documents that the model relies on transfected overexpression at
      experimenter-set dose, the specific fidelity concern raised here.
  - reference: PMID:32217077
    reference_title: "Mutation-specific pathology and treatment of hypertrophic cardiomyopathy in patients, mouse models and human engineered heart tissue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pros and cons of these experimental models for studying
      mutation-specific HCM pathology and therapies will be outlined.
    explanation: >-
      A dedicated review of exactly this model-fidelity question for HCM,
      confirming it is a recognized open issue rather than a curation artefact.
  - reference: PMID:10900175
    reference_title: Effect of hypertrophic cardiomyopathy mutations in human cardiac muscle alpha-tropomyosin (Asp175Asn and Glu180Gly) on the regulatory properties of human cardiac troponin determined by in vitro motility assay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results using human cardiac regulatory proteins reveal different
      effects of the HCM mutations in tropomyosin compared to studies using
      heterologous systems.
    explanation: >-
      The sharpest statement of the fidelity problem for this specific gene:
      for TPM1, non-human or heterologous systems give qualitatively different
      answers, so a mechanistic result is only as trustworthy as its protein
      isoform context.
  - reference: PMID:10900175
    reference_title: Effect of hypertrophic cardiomyopathy mutations in human cardiac muscle alpha-tropomyosin (Asp175Asn and Glu180Gly) on the regulatory properties of human cardiac troponin determined by in vitro motility assay.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      There is growing evidence that the precise isoforms of both the mutated
      protein and its interacting partners can qualitatively influence the
      effects of the mutation.
    explanation: >-
      States the general principle underlying the mismatch: for thin-filament
      mutations the interacting-partner isoform set can invert the direction of
      a measured effect.
  - reference: PMID:11603924
    reference_title: A familial hypertrophic cardiomyopathy alpha-tropomyosin mutation causes severe cardiac hypertrophy and death in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of exogenous mutant tropomyosin leads to a concomitant decrease
      in endogenous alpha-tropomyosin without altering the expression of other
      contractile proteins.
    explanation: >-
      The transgenic model works by displacing endogenous tropomyosin rather
      than reproducing the human 1:1 mutant-to-wild-type allelic stoichiometry -
      the same overexpression caveat raised for the cellular models, and
      pointed at the very stoichiometry hypothesis proposed in the founding
      CMH3 paper.
- discussion_id: tpm1_arrhythmic_risk_and_risk_scd_calibration
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true arrhythmic risk in TPM1 hypertrophic cardiomyopathy, and do
    the established HCM sudden-death risk models calibrate correctly in
    thin-filament disease?
  attaches_to:
  - phenotypes#Sudden Cardiac Death
  - phenotypes#Non-Sustained Ventricular Tachycardia
  rationale: >-
    The literature points in two directions at once, and the disagreement is not
    resolvable from the published evidence. Narrative reviews of thin-filament
    cardiomyopathy describe a high sudden-death risk marked by family history,
    non-sustained ventricular arrhythmia and abnormal exercise blood-pressure
    response. The one prospective thin-filament cohort with nearly five years of
    follow-up reports the opposite: no malignant arrhythmic event occurred in any
    thin-filament patient, and its authors state directly that the higher-risk
    claim is controversial between studies and depends on age of onset and
    genotype within individual families. Both readings cannot be right for the
    same population.
    The practical consequence is a calibration question rather than an academic
    one. The conventional sudden-death risk models were derived on cohorts
    dominated by thick-filament genotypes, and the same cohort study found
    thin-filament patients had milder hypertrophy - the dominant input to those
    models - while progressing to advanced heart failure roughly five times
    faster. A model driven by wall thickness may therefore systematically
    under-call risk in a genotype whose danger is weighted toward heart failure
    rather than toward hypertrophy, or may correctly identify a genuinely lower
    arrhythmic risk. Nothing in the current evidence distinguishes those.
    TPM1 specifically cannot settle it: it accounted for 9 of 285 carriers in the
    largest penetrance cohort and a minority of the 15 thin-filament patients in
    the outcome cohort.
  evidence:
  - reference: DOI:10.3390/jcm14030866
    reference_title: "Clinical Features and Prospective Outcomes of Thin-Filament Hypertrophic Cardiomyopathy: Intrinsic Data and Comparative Insights from Other Cohorts"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the thin-filament HCM patients experienced malignant arrhythmic
      events.
    explanation: >-
      The prospective observation that contradicts the high-arrhythmic-risk
      framing, in the only thin-filament cohort with follow-up.
  - reference: DOI:10.3390/jcm14030866
    reference_title: "Clinical Features and Prospective Outcomes of Thin-Filament Hypertrophic Cardiomyopathy: Intrinsic Data and Comparative Insights from Other Cohorts"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data on a higher risk of malignant arrhythmias in thin-filament HCM remain
      controversial between studies and rather depend on the age of onset and
      genotype in each particular family.
    explanation: >-
      The authors state the controversy explicitly, which is what makes this a
      knowledge gap rather than a settled contradiction to be resolved in favour
      of one side.
  - reference: DOI:10.3390/jcm14030866
    reference_title: "Clinical Features and Prospective Outcomes of Thin-Filament Hypertrophic Cardiomyopathy: Intrinsic Data and Comparative Insights from Other Cohorts"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed more rapid progression to advanced heart failure (HR = 5.6, p =
      0.018)
    explanation: >-
      The quantified heart-failure hazard that makes the risk profile in this
      class weighted toward heart failure rather than arrhythmia, which is the
      substance of the calibration concern.
  proposed_experiments:
  - experiment_id: tpm1_thin_filament_risk_scd_calibration
    name: External validation of HCM sudden-death risk models in thin-filament genotypes
    description: >-
      Pool thin-filament HCM patients across the existing genotyped registries
      and assess calibration of the established risk models - observed versus
      predicted event rates, stratified by thin-filament versus thick-filament
      genotype. The cohorts required already exist and are genotyped; what is
      missing is the stratified calibration analysis. A systematic
      under-prediction in thin-filament carriers would justify a genotype term in
      risk assessment, and a correct calibration would settle the controversy in
      the other direction.

    evidence_source: COMPUTATIONAL
    snippet: >-
      Molecular dynamic simulations of tropomyosin on actin suggest that the
      S215L significantly destabilizes the blocked regulatory state while
      increasing flexibility of the tropomyosin chain.
    explanation: >-
      Direct structural statement of the regulatory-state destabilization that
      defines this node. Evidence source is COMPUTATIONAL because the claim comes
      from molecular-dynamics simulation.
  - reference: PMID:36896133
    reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TPM1 variant S215L.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro motility experiments with thin filaments containing TPM1 S215L
      revealed higher Ca2+ sensitivity compared with wild type.
    explanation: >-
      Experimental confirmation in reconstituted thin filaments that the
      simulated destabilization translates into increased myofilament calcium
      sensitivity.
  - reference: PMID:36613463
    reference_title: De Novo Asp219Val Mutation in Cardiac Tropomyosin Associated with Hypertrophic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The D219V mutation significantly increased the Ca2+ sensitivity of the
      sliding velocity of thin filaments over cardiac myosin in an in vitro
      motility assay and impaired the inhibition of the filament sliding at low
      Ca2+ concentration.
    explanation: >-
      Independent replication in a second TPM1 HCM allele, and the clearest
      single statement of the two components of the lesion - increased calcium
      sensitivity plus failure of inhibition at low calcium.
  - reference: PMID:34319370
    reference_title: Loss of crossbridge inhibition drives pathological cardiac hypertrophy in patients harboring the TPM1 E192K mutation.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Molecular dynamics revealed that E192K results in a more flexible TPM1
      molecule, which could affect its ability to regulate crossbridges.
    explanation: >-
      Shows increased tropomyosin flexibility as the shared physical
      consequence across variants, here for E192K.
  - reference: PMID:36158814
    reference_title: "Thin filament cardiomyopathies: A review of genetics, disease mechanisms, and emerging therapeutics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is significant evidence that thin filament mutations contribute to

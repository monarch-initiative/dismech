- name: Arrhythmogenic Substrate and Sudden Cardiac Death
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Myofibre disarray, interstitial and replacement fibrosis, and abnormal
    calcium handling together create a substrate for reentrant and triggered
    ventricular arrhythmia. Sudden cardiac death is the outcome that dominates
    risk stratification in CMH3, and several TPM1 pedigrees have been ascertained
    through a sudden death. Risk is markedly allele-dependent: sudden-death risk
    was low in most p.Arg21Leu carriers, whereas other alleles - and digenic
    thin-plus-thick-filament genotypes - have been associated with severe disease
    and sudden death.

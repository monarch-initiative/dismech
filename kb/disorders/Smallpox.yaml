- name: Smallpox vaccination
  description: >-
    Vaccinia-based vaccination prevents smallpox and was used with case
    isolation and contact tracing in ring-vaccination strategies; a prompt
    post-exposure dose can attenuate or prevent disease.
  therapeutic_modality: VACCINE

name: Smallpox
creation_date: '2026-10-31T06:36:43Z'
category: Infectious Disease
description: >-
  Smallpox is the eradicated systemic orthopoxvirus disease caused by Variola
  virus, a large double-stranded DNA virus restricted to humans. After
  respiratory-mucosal seeding, variola infected macrophages and regional lymph
  nodes, disseminated in a cell-associated viremia to lymphoreticular tissues,
  dermis, mucosa, liver, and other organs, and produced a synchronous
  centrifugal vesiculopustular exanthem whose ordinary, flat, and hemorrhagic
  clinical forms differed sharply in fatality.
disease_term:
  preferred_term: smallpox
  term:
    id: MONDO:0004651
    label: smallpox
parents:
- Orthopoxvirus Infection
- Viral Exanthem
synonyms:
- Variola
- Variola vera
has_subtypes:
- name: Variola major
  subtype_term:
    preferred_term: variola major infectious disease
    term:
      id: MONDO:0000338
      label: variola major infectious disease
  description: >-
    The historically predominant and more virulent smallpox form; typical
    variola major outbreaks had case-fatality rates of 20% or higher, and
    ordinary, flat, and hemorrhagic clinical presentations are recorded below as
    phenotypic and prognostic strata rather than separate disease entries.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The case-fatality rates for typical variola major outbreaks were 20% or higher.
    explanation: >-
      Documents the high fatality that distinguishes variola major from the
      milder variola minor/alastrim stratum.
- name: Variola minor
  subtype_term:
    preferred_term: variola minor infection
    term:
      id: MONDO:0004720
      label: variola minor infection
  description: >-
    A milder smallpox form, also called alastrim, that spread from early
    twentieth-century foci and was rarely associated with case-fatality rates
    above 1%.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variola minor was rarely associated with case fatality rates of more than 1%, and rates were often lower.
    explanation: >-
      Establishes the low-fatality variola minor/alastrim stratum under the
      same Variola virus disease.
infectious_agent:
- name: Variola virus
  description: >-
    Human-restricted orthopoxvirus with a double-stranded DNA genome encoding
    about 200 proteins, including a large terminal-gene complement devoted to
    immune evasion.
  infectious_agent_term:
    preferred_term: Variola virus
    term:
      id: NCBITaxon:10255
      label: Variola virus
  evidence:
  - reference: PMID:12941397
    reference_title: Variola virus immune evasion proteins.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Variola virus, the causative agent of smallpox, encodes approximately 200 proteins.
    explanation: >-
      Identifies Variola virus as the smallpox agent and summarizes its large
      coding capacity.
  - reference: PMID:12941397
    reference_title: Variola virus immune evasion proteins.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Over 80 of these proteins are located in the terminal regions of the genome, where proteins associated with host immune evasion are encoded.
    explanation: >-
      Supports the description of a large variola immune-evasion gene
      complement.
agent_life_cycle:
  description: >-
    Variola virus was maintained by human-to-human spread and had no known
    non-human reservoir or arthropod vector, a biological constraint that helped
    make eradication feasible.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: sole natural host and transmission reservoir
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there is no known animal or insect reservoir for smallpox
    explanation: >-
      Establishes the absence of a non-human reservoir or insect vector for
      natural variola maintenance.
transmission:
- name: Respiratory droplet and aerosol transmission
  description: >-
    Transmission usually occurred by infectious droplet nuclei or aerosols
    expelled from the oropharynx of a person with smallpox, with patients most
    infectious from rash onset through the first week of the rash.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smallpox was typically transmitted from person to person via droplet nuclei or aerosols expelled from the oropharynx of infected persons.
    explanation: >-
      Identifies the dominant human-to-human respiratory transmission route.
  - reference: PMID:21431786
    reference_title: "Countermeasures and vaccination against terrorism using smallpox: pre-event and post-event smallpox vaccination and its contraindications."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since smallpox patients are most infectious from onset of the rash through the first 7-10 days of the rash, vaccination should be administered promptly within a limited time frame.
    explanation: >-
      Places maximal infectiousness at rash onset and the first 7 to 10 rash
      days, the window that drives contact tracing and post-exposure
      vaccination.
- name: Direct lesion and fomite contact transmission
  description: >-
    Variola could also be transmitted by direct contact and contaminated
    clothing or bed linens, but the route was less central than respiratory
    spread from oropharyngeal lesions.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission through direct person-to-person contact has also been described. In addition, contaminated clothing or bed linens have been implicated in the spread of the disease.
    explanation: >-
      Documents direct contact and fomite routes in addition to respiratory
      droplets and aerosols.
progression:
- phase: Incubation and silent mucosal infection
  incubation_days: 12-14
  notes: >-
    Respiratory or oropharyngeal acquisition seeded mucosa, macrophages,
    regional lymph nodes, spleen, bone marrow, and distant lymph nodes before
    symptoms became apparent.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This initial infection in the oropharynx and upper respiratory tract was essentially silent, and patients were asymptomatic.
    explanation: >-
      Supports an asymptomatic incubation phase before the febrile prodrome.
- phase: Abrupt febrile prodrome
  duration: 2 to 4 days
  notes: >-
    Secondary viremia preceded sudden high fever, malaise, prostration, and
    headache near the end of the incubation period.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of this 12- to 14-day incubation period, the patient typically presented with high fever, malaise, and prostration with headache.
    explanation: >-
      Establishes the timing and core manifestations of the pre-eruptive
      febrile prodrome.
- phase: Centrifugal vesiculopustular rash
  duration: 1 to 2 days
  notes: >-
    Oral/pharyngeal and cutaneous lesions appeared around day 14 and spread from
    the face and forearms to the trunk and legs, with most lesions at any body
    site evolving synchronously.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic smallpox rash had a centrifugal appearance and was most prominent on the face and the extremities, including the palms and soles.
    explanation: >-
      Describes the classic centrifugal distribution of the smallpox exanthem.
- phase: Scabbing, recovery, or death
  notes: >-
    Vesicular lesions became pustular, dried into scabs, and healed with pitted
    scars in survivors; fatal ordinary, flat, or hemorrhagic disease generally
    ended during the second disease week.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the scabs had separated, patients were no longer infectious
    explanation: >-
      Defines the endpoint of infectious clinical disease in survivors.
pathophysiology:
- name: Respiratory-Mucosal Entry and Lymphoreticular Amplification
  description: >-
    Inhaled variola seeded the oropharyngeal or respiratory mucosa, infected
    macrophages, drained along local lymphatics, and replicated in regional
    lymph nodes, spleen, bone marrow, and distant lymph nodes before symptoms.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: respiratory tract
    term:
      id: UBERON:0000065
      label: respiratory tract
  - preferred_term: mucosa
    term:
      id: UBERON:0000344
      label: mucosa
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  biological_processes:
  - preferred_term: viral entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  downstream:
  - target: Monocytic Cell-Associated Viremia and Systemic Dissemination
    description: >-
      Local lymphoreticular amplification seeds the blood with leukocyte-associated
      virus.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macrophages were among the early sites/cells of infection, and the virus migrated along the local lymphatic channels and multiplied in regional lymph nodes.
    explanation: >-
      Establishes macrophage infection and lymphatic spread into regional nodes
      as early events in variola pathogenesis.
- name: Monocytic Cell-Associated Viremia and Systemic Dissemination
  description: >-
    Variola spread in monocytes and macrophages to lymphoid tissues and target
    epithelia, giving a cell-associated viremia that localized virions to dermal
    capillaries and mucosal surfaces.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  downstream:
  - target: Cytopathic Epidermal Vesicle-To-Pustule Formation
    description: >-
      Virus delivered to dermal vessels infects adjacent basal-layer epidermal
      cells and starts the vesiculopustular rash.
  - target: Hemorrhagic Coagulopathy and Multisystem Failure
    description: >-
      High viral burdens in target tissues can couple systemic replication to
      organ dysfunction and coagulation activation.
  - target: Fever
    description: >-
      Secondary viremia precedes the abrupt febrile prodrome.
  - target: Headache
    description: >-
      Secondary viremia precedes the abrupt prodrome with headache.
  evidence:
  - reference: PMID:15477589
    reference_title: Exploring the potential of variola virus infection of cynomolgus macaques as a model for human smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After inoculation, variola was disseminated by means of a monocytic cell-associated viremia.
    explanation: >-
      Directly supports cell-associated blood dissemination of variola in the
      authenticated variola macaque model.
  - reference: PMID:15477589
    reference_title: Exploring the potential of variola virus infection of cynomolgus macaques as a model for human smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Distribution of viral antigens by immunohistochemistry correlated with the presence of replicating viral particles demonstrated by electron microscopy and pathology in the lymphoid tissues, skin, oral mucosa, gastrointestinal tract, reproductive system, and liver.
    explanation: >-
      Defines the disseminated tissues reached by replicating variola in the
      model.
- name: Variola Immune-Evasion Protein Expression
  description: >-
    Variola encodes numerous terminal-region immunomodulatory proteins,
    including SPICE and a high-affinity CC-chemokine-binding protein, that blunt
    complement and chemokine-mediated antiviral immunity.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: innate immune response
    modifier: DECREASED
    term:
      id: GO:0045087
      label: innate immune response
  - preferred_term: complement activation
    modifier: DECREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Monocytic Cell-Associated Viremia and Systemic Dissemination
    description: >-
      Immune evasion increases the probability that local infection proceeds to
      disseminated infection.
  evidence:
  - reference: PMID:12941397
    reference_title: Variola virus immune evasion proteins.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Both SPICE and VCP are similar in structure and function to the family of mammalian complement regulatory proteins, which function to prevent inadvertent injury to adjacent cells and tissues during complement activation.
    explanation: >-
      Supports SPICE as a variola-encoded complement regulatory mimic.
  - reference: PMID:12941397
    reference_title: Variola virus immune evasion proteins.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The second variola protein is the variola virus high-affinity secreted chemokine-binding protein type II (CKBP-II, CBP-II, vCCI), which binds CC-chemokine receptors.
    explanation: >-
      Supports the variola CC-chemokine-binding protein claim in the
      immune-evasion node description.
- name: Cytopathic Epidermal Vesicle-To-Pustule Formation
  description: >-
    Virions localized in dermal small vessels infected basal-layer epidermal
    cells; cytopathic swelling, vacuolization, cell-membrane rupture, and a
    neutrophilic vesicle lumen converted lesions from vesicles into pustules and
    ultimately destructive pock scars.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Skin vesicles
    description: >-
      Epidermal cytopathic injury and edema produce smallpox vesicles.
  - target: Centrifugal pustular rash
    description: >-
      Viral replication and neutrophil-rich vesicle filling generate the
      synchronous pustular exanthem.
  - target: Pitted scarring
    description: >-
      Destructive pustular lesions heal with the pockmarks seen in survivors.
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As this process continued to progress, polymorphonuclear leukocytes entered the vesicle from the dermis and produced a pustule with disappearance of the septa.
    explanation: >-
      Describes the inflammatory transition from vesicle to pustule in human
      smallpox skin lesions.
- name: Hemorrhagic Coagulopathy and Multisystem Failure
  description: >-
    In lethal disseminated variola, high tissue viral burdens were associated
    with organ dysfunction, D-dimer evidence of coagulation activation,
    thrombocytopenia, leukocytosis, and cytokines such as IL-6 and IFN-gamma,
    matching the hemorrhagic diathesis of severe smallpox.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Hemorrhagic diathesis
    description: >-
      Coagulation activation and hemorrhagic tissue injury produce the bleeding
      phenotype of hemorrhagic smallpox.
  evidence:
  - reference: PMID:15477589
    reference_title: Exploring the potential of variola virus infection of cynomolgus macaques as a model for human smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      High viral burdens in target tissues were associated with organ dysfunction and multisystem failure.
    explanation: >-
      Links disseminated variola replication in target tissues to terminal
      multisystem failure in the authenticated animal model.
  - reference: PMID:15477589
    reference_title: Exploring the potential of variola virus infection of cynomolgus macaques as a model for human smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Evidence of coagulation cascade activation (D dimers) corroborated histologic evidence of hemorrhagic diathesis.
    explanation: >-
      Supports the coagulation-activation mechanism behind the hemorrhagic
      branch of severe smallpox.

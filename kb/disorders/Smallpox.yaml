  description: High fever was the abrupt prodromal manifestation after secondary viremia.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of this 12- to 14-day incubation period, the patient typically presented with high fever, malaise, and prostration with headache.
    explanation: >-
      Identifies high fever as a core prodromal smallpox manifestation.
- name: Headache
  category: Clinical
  frequency: COMMON
  description: Headache accompanied the high-fever prodrome.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of this 12- to 14-day incubation period, the patient typically presented with high fever, malaise, and prostration with headache.
    explanation: >-
      Identifies headache as part of the smallpox prodrome.
- name: Centrifugal pustular rash
  category: Clinical
  frequency: COMMON
  description: >-
    Deep, synchronous pustules were densest on the face and extremities,
    including palms and soles.
  phenotype_term:
    preferred_term: Pustular rash
    term:
      id: HP:0033605
      label: Pustular rash
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic smallpox rash had a centrifugal appearance and was most prominent on the face and the extremities, including the palms and soles.
    explanation: >-
      Supports the centrifugal distribution and acral involvement of the rash.
- name: Skin vesicles
  category: Clinical
  frequency: COMMON
  description: >-
    Epidermal cell swelling, vacuolization, edema, and membrane rupture produced
    vesicles before the lesions filled with neutrophils and became pustules.
  phenotype_term:
    preferred_term: Skin vesicle
    term:
      id: HP:0200037
      label: Skin vesicle
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The process spread to the neighboring cells in the middle layer and was accompanied by profound edema, eventually leading to rupture of cell membranes and formation of a vesicle.
    explanation: >-
      Describes vesicle formation during smallpox skin-lesion morphogenesis.
- name: Pitted scarring
  category: Clinical
  frequency: COMMON
  description: >-
    Destructive pustular lesions healed with pockmarks, especially on the face.
  phenotype_term:
    preferred_term: Scarring
    term:
      id: HP:0100699
      label: Scarring
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pockmarks were caused by the destruction of sebaceous glands and formation of granulation tissue; they occurred all over the body but were most prominent on the face because of the large number of sebaceous glands located there.
    explanation: >-
      Establishes the mechanism and distribution of permanent pitted scarring in
      survivors.
- name: Hemorrhagic diathesis

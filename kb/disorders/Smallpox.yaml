      Establishes ring or mass vaccination as a core smallpox countermeasure
      paired with case and contact management.
review_notes: >-
  Deliberately lumped. This entry keeps variola major, variola minor/alastrim,
  ordinary, modified, flat, and hemorrhagic smallpox in one Variola virus disease
  entry because they are virulence or clinical-severity strata of the same
  historical pathogen-syndrome pair, not separate agent-syndrome entities.
  Duplicate preflight searched MONDO:0004651, smallpox, variola, variola major,
  and variola minor across current origin/main, all pull requests, and all issues
  before issue 16149 claimed the term.

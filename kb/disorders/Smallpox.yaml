    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rare hemorrhagic-type smallpox was associated with petechiae in the skin and bleeding from the conjunctiva and mucous membranes.
    explanation: >-
      Establishes abnormal bleeding as the defining human manifestation of
      hemorrhagic smallpox.
  - reference: PMID:15477589
    reference_title: Exploring the potential of variola virus infection of cynomolgus macaques as a model for human smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Evidence of coagulation cascade activation (D dimers) corroborated histologic evidence of hemorrhagic diathesis.
    explanation: >-
      Links variola-driven coagulation activation to hemorrhagic manifestations.
treatments:
- name: Supportive Care
  description: >-
    Historical smallpox management relied on isolation and supportive care;
    antibiotics and eye care were added for secondary bacterial or ocular
    complications when indicated.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:16200143
    reference_title: "Smallpox and biological warfare: a disease revisited."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      home care seems to be a reasonable approach, since little can be done for the patient other than to offer supportive care.
    explanation: >-
      Documents supportive care as the baseline historical management for
      patients with smallpox.
- name: Tecovirimat
  description: >-
    Oral orthopoxvirus antiviral approved for smallpox under the FDA Animal Rule;
    it inhibits the conserved p37/VP37 envelope protein and prevents formation
    and egress of enveloped virions.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral agent therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: tecovirimat
      term:
        id: CHEBI:749735
        label: tecovirimat
  target_mechanisms:
  - target: Monocytic Cell-Associated Viremia and Systemic Dissemination
    treatment_effect: INHIBITS
    description: >-
      p37 inhibition blocks extracellular enveloped virion formation, limiting
      orthopoxvirus egress and tissue-to-tissue spread.
  evidence:
  - reference: PMID:29972742
    reference_title: Oral Tecovirimat for the Treatment of Smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tecovirimat inhibits p37, a protein that is present and highly conserved (approximately 98% amino acid identity) in all orthopoxviruses; the inhibition of p37 prevents the formation and egress of enveloped virions, which are essential for virulence.
    explanation: >-
      Establishes tecovirimat's target and its effect on orthopoxvirus enveloped
      virion egress.
  - reference: PMID:29972742
    reference_title: Oral Tecovirimat for the Treatment of Smallpox.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In pilot studies, tecovirimat was shown to provide protective efficacy in multiple small-animal and nonhuman primate models of orthopoxvirus disease.
    explanation: >-
      Records the Animal Rule efficacy basis for tecovirimat rather than an
      absent human smallpox efficacy trial.
- name: Brincidofovir
  description: >-
    Oral lipid-conjugated cidofovir prodrug approved for smallpox under the FDA
    Animal Rule; it acts as a nucleotide analogue DNA polymerase inhibitor with
    surrogate efficacy in mousepox and rabbitpox models.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral agent therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: brincidofovir

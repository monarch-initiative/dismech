genetic:
- name: PRNP T183A
  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Causal variant is a heterozygous germline nonconservative missense substitution
    at codon 183 of PRNP (threonine to alanine, T183A), first reported in a Brazilian
    kindred (Nitrini 1997) and independently confirmed as disease-causing in a second
    (German) patient (Grasbon-Frodl 2004). It is a gain-of-toxic-function lesion
    rather than a loss-of-function: it does not abolish PrP but renders the protein
    misfolding-prone. The substitution simultaneously removes one of PrP's two
    N-glycosylation sequons and abolishes the Y162-T183 gatekeeper hydrogen bond.
  evidence:
  - reference: PMID:9266722
    reference_title: "Familial spongiform encephalopathy associated with a novel prion protein gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel prion protein gene mutation causing a nonconservative substitution at codon 183 was identified in 2 neuropathologically confirmed affected individuals (mother and son)."
    explanation: Identifies the codon-183 PRNP substitution as the causal variant in the index kindred.
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the second report of a disease-causing T183A mutation of PrP, and the clinical, histological and genetic observations strongly suggest that T183A is a disease-causing mutation."
    explanation: Independent second report confirming T183A as disease-causing.

pathophysiology:
- name: PRNP T183A Germline Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous threonine-to-alanine substitution at codon 183 is present from
    conception in every cell. It does not break the gene; it encodes a full-length
    but conformationally unfaithful PrP, and it does so through two distinct
    consequences - loss of an N-glycosylation sequon and loss of a fold-stabilizing
    hydrogen bond.
  genes:
  - preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  downstream:
  - target: Destabilization of the PrP-C Native Fold
    causal_link_type: DIRECT
  - target: Loss of an N-Linked Glycosylation Site on PrP
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9266722
    reference_title: "Familial spongiform encephalopathy associated with a novel prion protein gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel prion protein gene mutation causing a nonconservative substitution at codon 183 was identified in 2 neuropathologically confirmed affected individuals (mother and son)."
    explanation: Establishes the codon-183 substitution as the initiating molecular lesion.
- name: Destabilization of the PrP-C Native Fold
  biological_scale: MOLECULAR
  description: >-
    T183A abolishes a hydrogen bond between Y162 (beta-strand S2) and T183
    (alpha-helix H3) that, in the wild-type protein, is a gatekeeper interaction
    stabilizing the packing between the S1-H1-S2 and H2-H3 subdomains. Its loss
    produces the strongest native-state destabilization of any TSE-associated PrP
    variant - a melting-temperature drop of roughly 26-28 degrees C - and populates
    a misfolding-prone intermediate.
  biological_processes:
  - preferred_term: protein destabilization
    term:
      id: GO:0031648
      label: protein destabilization
    modifier: INCREASED
  downstream:
  - target: Enhanced PrP Misfolding and Aggregation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33731477
    reference_title: "Mechanism of misfolding of the human prion protein revealed by a pathological mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "abolishes a crucial hydrogen bond between Y162 from the"
    explanation: Identifies the gatekeeper Y162-T183 hydrogen bond abolished by the variant.
  - reference: PMID:33731477
    reference_title: "Mechanism of misfolding of the human prion protein revealed by a pathological mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "its depletion by T183A induces the strongest destabilization of the PrPC structure among the TSE-associated PrP variants"
    explanation: Quantifies T183A as the most destabilizing TSE-associated PrP variant.
  - reference: PMID:33731477
    reference_title: "Mechanism of misfolding of the human prion protein revealed by a pathological mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "T183A strongly destabilizes this huPrPC domain, resulting in a reduction of 28"
    explanation: Reports the melting-temperature drop that measures the destabilization.
- name: Loss of an N-Linked Glycosylation Site on PrP
  biological_scale: MOLECULAR
  description: >-
    Codon 183 forms part of one of PrP's two N-glycosylation sequons, so T183A
    removes a consensus glycosylation site. The resulting mutant PrP is
    under-glycosylated, and the disease-associated protease-resistant PrP recovered
    from patient brain is predominantly the monoglycosylated form.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  downstream:
  - target: Intracellular Retention of Mutant PrP
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation results in the removal of one of the two consensus sites for glycosylation of PrP."
    explanation: Establishes loss of an N-glycosylation sequon as a direct consequence of T183A.
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analysis of the patient's brain tissue showed protease K-resistant PrP with a definite preponderance of the monoglycosylated form."
    explanation: Confirms the under-glycosylated form of disease-associated PrP in patient brain.
- name: Intracellular Retention of Mutant PrP
  biological_scale: CELLULAR
  description: >-
    In cell culture the under-glycosylated T183A protein is retained intracellularly
    rather than trafficked normally to the cell surface, consistent with disrupted
    maturation of the mutant prion protein.
  downstream:
  - target: Striatal and Neocortical Spongiform Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cell culture experiments confirmed previous reports on intracellular retention of the mutant protein in vitro."
    explanation: Documents intracellular retention of the mutant protein in vitro.
- name: Enhanced PrP Misfolding and Aggregation
  biological_scale: MOLECULAR
  description: >-
    The destabilized T183A PrP has a strongly enhanced propensity to misfold and
    aggregate, forming amyloid under physiological conditions. Disease-associated
    protease resistance extends to non-mutated wild-type PrP recovered from patient
    brain, indicating recruitment of normal PrP into the self-propagating conformer.
  biological_processes:
  - preferred_term: amyloid fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  downstream:
  - target: Striatal and Neocortical Spongiform Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33731477
    reference_title: "Mechanism of misfolding of the human prion protein revealed by a pathological mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutation significantly enhances the aggregation propensity of huPrP, such as to uniquely induce amyloid formation under physiological conditions by the sole C-terminal domain of the protein"
    explanation: Reports the enhanced aggregation and amyloid formation this node represents.
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The additional appearance of a band representing diglycosylated PrPSc strongly suggests that non-mutated PrP also acquires protease resistance in the present setting."
    explanation: Indicates recruitment of wild-type PrP into the protease-resistant conformer.
- name: Striatal and Neocortical Spongiform Degeneration
  biological_scale: TISSUE
  description: >-
    The disease hallmark is severe spongiform change and neuronal loss concentrated
    in the deep neocortical layers, putamen and claustrum, with conspicuously minimal
    gliosis in the most severely affected areas and PrP immunoreactivity in the
    putamen and cerebellum. The striatal involvement is the anatomical correlate of
    the parkinsonism, and global cerebral atrophy is seen on imaging.
  downstream:
  - target: Frontotemporal dementia
    causal_link_type: DIRECT
  - target: Parkinsonism
    causal_link_type: DIRECT
  - target: Personality changes
    causal_link_type: DIRECT
  - target: Dementia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9266722
    reference_title: "Familial spongiform encephalopathy associated with a novel prion protein gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe spongiform change and neuronal loss in the deep cortical layers and in the putamen, but minimal gliosis in the most severely affected areas"
    explanation: Reports the signature neuropathology - deep-cortical and putaminal spongiform degeneration with minimal gliosis.
  - reference: PMID:9266722
    reference_title: "Familial spongiform encephalopathy associated with a novel prion protein gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The putamen and cerebellum, but not other areas of the affected brain, displayed prion protein immunoreactivity."
    explanation: Documents the regional PrP deposition underlying the degeneration.

phenotypes:
- name: Frontotemporal dementia
  category: Neurological
  description: >-
    The dementia is frontotemporal in type, with behavioural and personality change
    predominating; the overall clinical picture closely resembles frontotemporal
    dementia with parkinsonism (FTDP-17).
  phenotype_term:
    preferred_term: Frontotemporal dementia
    term:
      id: HP:0002145
      label: Frontotemporal dementia
  evidence:
  - reference: PMID:9266722
    reference_title: "Familial spongiform encephalopathy associated with a novel prion protein gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine members of the family were affected by a dementia with frontotemporal clinical features, with a mean age at onset of 44.8 +/- 3.8 years and a mean duration of symptoms of 4.2 +/- 2.4 years."
    explanation: Documents frontotemporal-type dementia with early onset in the index kindred.
  - reference: PMID:11400017
    reference_title: "Prion disease resembling frontotemporal dementia and parkinsonism linked to chromosome 17."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These clinical features bear a considerable resemblance to those described in FTDP-17."
    explanation: Confirms the frontotemporal-dementia-like clinical picture in a 12-patient series.
- name: Personality changes
  category: Neurological
  description: >-
    Behavioural disturbance and personality change are the predominant presenting
    symptoms, so often that most affected individuals are first assessed by
    psychiatrists.
  phenotype_term:
    preferred_term: Personality changes
    term:
      id: HP:0000751
      label: Personality changes
  evidence:
  - reference: PMID:11400017
    reference_title: "Prion disease resembling frontotemporal dementia and parkinsonism linked to chromosome 17."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behavioral disturbances were the predominant presenting symptoms. Nine patients were first seen by psychiatrists. Eight patients manifested parkinsonian signs."
    explanation: Documents behavioural/personality disturbance as the predominant presenting feature.
- name: Parkinsonism
  category: Neurological
  description: >-
    Parkinsonian signs occur in most affected individuals (eight of twelve in the
    clinical series), reflecting the striatal (putaminal) involvement of the disease.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:11400017
    reference_title: "Prion disease resembling frontotemporal dementia and parkinsonism linked to chromosome 17."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behavioral disturbances were the predominant presenting symptoms. Nine patients were first seen by psychiatrists. Eight patients manifested parkinsonian signs."
    explanation: Documents parkinsonian signs in most of the 12-patient series.
- name: Dementia
  category: Neurological
  description: >-
    Early-onset (presenile) dementia is the predominant clinical sign, accompanied by
    global cerebral atrophy and hypometabolism on imaging.
  phenotype_term:
    preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
  evidence:
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this form of prion disease was characterized by early-onset dementia as the predominant sign, along with global cerebral atrophy and hypometabolism"
    explanation: Documents early-onset dementia as the predominant sign in the second reported case.
- name: Cerebral atrophy
  category: Neurological
  description: >-
    Global cerebral atrophy with hypometabolism is seen on neuroimaging, consistent
    with the widespread neuronal loss.
  phenotype_term:
    preferred_term: Cerebral atrophy
    term:
      id: HP:0002059
      label: Cerebral atrophy
  evidence:
  - reference: PMID:15558291
    reference_title: "Loss of glycosylation associated with the T183A mutation in human prion disease."
    supports: SUPPORT

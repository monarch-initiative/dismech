treatments:
- name: Supportive and multidisciplinary care
  description: No disease-modifying therapy exists for genetic prion disease. Management is supportive
    and symptomatic, delivered by a multidisciplinary team, with close periodic monitoring because of
    progression. Early behavioural and psychiatric features frequently require symptomatic psychiatric
    management.
  treatment_term:

- name: Intracellular Retention of Mutant PrP
  biological_scale: CELLULAR
  description: In cell culture the under-glycosylated T183A protein is retained intracellularly rather
    than trafficked normally to the cell surface, consistent with disrupted maturation of the mutant prion
    protein.
  downstream:
  - target: Striatal and Neocortical Spongiform Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15558291
      reference_title: Loss of glycosylation associated with the T183A mutation in human prion disease.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Neuropathological examination revealed severe spongiform degeneration and neuronal loss
        in the neocortex, putamen and claustrum, small plaque-like PrP-immunoreactive deposits in the
        molecular layer of the cerebellum, and faint intracellular cytoplasmic PrP immunoreactivity.
      explanation: Reports intracellular cytoplasmic PrP immunoreactivity in the same patient brain that

genetic:
- name: PRNP T183A
  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: 'Causal variant is a heterozygous germline nonconservative missense substitution at codon 183
    of PRNP (threonine to alanine, T183A), first reported in a Brazilian kindred (Nitrini 1997) and independently
    confirmed as disease-causing in a second (German) patient (Grasbon-Frodl 2004). It is a gain-of-toxic-function
    lesion rather than a loss-of-function: it does not abolish PrP but renders the protein misfolding-prone.
    The substitution simultaneously removes one of PrP''s two N-glycosylation sequons and abolishes the
    Y162-T183 gatekeeper hydrogen bond.'
  evidence:
  - reference: PMID:9266722
    reference_title: Familial spongiform encephalopathy associated with a novel prion protein gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A novel prion protein gene mutation causing a nonconservative substitution at codon 183 was
      identified in 2 neuropathologically confirmed affected individuals (mother and son).
    explanation: Identifies the codon-183 PRNP substitution as the causal variant in the index kindred.
  - reference: PMID:15558291
    reference_title: Loss of glycosylation associated with the T183A mutation in human prion disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is the second report of a disease-causing T183A mutation of PrP, and the clinical, histological
      and genetic observations strongly suggest that T183A is a disease-causing mutation.
    explanation: Independent second report confirming T183A as disease-causing.
pathophysiology:
- name: PRNP T183A Germline Missense Variant
  biological_scale: MOLECULAR
  description: A heterozygous threonine-to-alanine substitution at codon 183 is present from conception
    in every cell. It does not break the gene; it encodes a full-length but conformationally unfaithful
    PrP, and it does so through two distinct consequences - loss of an N-glycosylation sequon and loss
    of a fold-stabilizing hydrogen bond.
  downstream:
  - target: Destabilization of the PrP-C Native Fold
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33731477
      reference_title: Mechanism of misfolding of the human prion protein revealed by a pathological mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Among these PrP variants, a mutation associated with very early-onset dementia and spongiform
        encephalopathy in patients, namely T183A (16), abolishes a crucial hydrogen bond between Y162
        from the β-strand S2 and T183 from the α-helix H3.
      explanation: Demonstrates that the T183A substitution directly abolishes the fold-stabilizing Y162-T183
        hydrogen bond.
  - target: Loss of an N-Linked Glycosylation Site on PrP
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15558291
      reference_title: Loss of glycosylation associated with the T183A mutation in human prion disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This mutation results in the removal of one of the two consensus sites for glycosylation
        of PrP.
      explanation: Demonstrates that the T183A mutation directly removes one of PrP's two consensus N-glycosylation
        sites.
  evidence:
  - reference: PMID:9266722
    reference_title: Familial spongiform encephalopathy associated with a novel prion protein gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A novel prion protein gene mutation causing a nonconservative substitution at codon 183 was
      identified in 2 neuropathologically confirmed affected individuals (mother and son).
    explanation: Establishes the codon-183 substitution as the initiating molecular lesion.
- name: Destabilization of the PrP-C Native Fold
  biological_scale: MOLECULAR
  description: T183A abolishes a hydrogen bond between Y162 (beta-strand S2) and T183 (alpha-helix H3)
    that, in the wild-type protein, is a gatekeeper interaction stabilizing the packing between the S1-H1-S2
    and H2-H3 subdomains. Its loss produces the strongest native-state destabilization of any TSE-associated
    PrP variant - a melting-temperature drop of roughly 26-28 degrees C - and populates a misfolding-prone
    intermediate.
  biological_processes:
  - preferred_term: protein destabilization
    term:
      id: GO:0031648
      label: protein destabilization
    modifier: INCREASED
  downstream:
  - target: Enhanced PrP Misfolding and Aggregation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33731477
      reference_title: Mechanism of misfolding of the human prion protein revealed by a pathological mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We found that by lowering of the energetic barrier to access the conformation of huPrP*125–230,
        the T183A mutation of huPrP promotes fast aggregation of the C-terminal domain without an apparent
        lag phase.
      explanation: Links native-state destabilization and accumulation of the misfolded intermediate directly
        to rapid amyloid aggregation.
  evidence:
  - reference: PMID:33731477
    reference_title: Mechanism of misfolding of the human prion protein revealed by a pathological mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Among these PrP variants, a mutation associated with very early-onset dementia and spongiform
      encephalopathy in patients, namely T183A (16), abolishes a crucial hydrogen bond between Y162 from
      the β-strand S2 and T183 from the α-helix H3.
    explanation: Identifies the gatekeeper Y162-T183 hydrogen bond abolished by the variant.
  - reference: PMID:33731477
    reference_title: Mechanism of misfolding of the human prion protein revealed by a pathological mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Under physiological conditions, this H-bond stabilizes the packing at the interface between
      the subdomains S1–H1–S2 and H2–H3 (SI Appendix, Fig. S1) (17), and its depletion by T183A induces
      the strongest destabilization of the PrPC structure among the TSE-associated PrP variants (18).
    explanation: Quantifies T183A as the most destabilizing TSE-associated PrP variant.
  - reference: PMID:33731477
    reference_title: Mechanism of misfolding of the human prion protein revealed by a pathological mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Differential scanning fluorimetry (DSF) revealed that T183A strongly destabilizes this huPrPC
      domain, resulting in a reduction of 28 °C in the melting temperature (Tm, Fig. 1A and SI Appendix,
      Table S1).
    explanation: Reports the melting-temperature drop that measures the destabilization.
- name: Loss of an N-Linked Glycosylation Site on PrP
  biological_scale: MOLECULAR
  description: Codon 183 forms part of one of PrP's two N-glycosylation sequons, so T183A removes a consensus
    glycosylation site. The resulting mutant PrP is under-glycosylated, and the disease-associated protease-resistant
    PrP recovered from patient brain is predominantly the monoglycosylated form.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  downstream:
  - target: Intracellular Retention of Mutant PrP
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15558291
      reference_title: Loss of glycosylation associated with the T183A mutation in human prion disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Cell culture experiments confirmed previous reports on intracellular retention of the mutant
        protein in vitro.
      explanation: Links the under-glycosylated T183A mutant PrP to intracellular retention in vitro.
  evidence:
  - reference: PMID:15558291
    reference_title: Loss of glycosylation associated with the T183A mutation in human prion disease.

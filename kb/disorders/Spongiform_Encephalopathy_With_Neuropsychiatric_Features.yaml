- name: Enhanced PrP Misfolding and Aggregation
  biological_scale: MOLECULAR
  description: The destabilized T183A PrP has a strongly enhanced propensity to misfold and aggregate,
    forming amyloid under physiological conditions. Disease-associated protease resistance extends to
    non-mutated wild-type PrP recovered from patient brain, indicating recruitment of normal PrP into
    the self-propagating conformer.

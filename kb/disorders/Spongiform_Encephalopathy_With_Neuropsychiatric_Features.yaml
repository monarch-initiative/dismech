    snippet: "this form of prion disease was characterized by early-onset dementia as the predominant sign, along with global cerebral atrophy and hypometabolism"
    explanation: Documents global cerebral atrophy on imaging.

treatments:
- name: Supportive and multidisciplinary care
  description: >-
    No disease-modifying therapy exists for genetic prion disease. Management is
    supportive and symptomatic, delivered by a multidisciplinary team, with close
    periodic monitoring because of progression. Early behavioural and psychiatric
    features frequently require symptomatic psychiatric management.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No treatment of the underlying cause of genetic prion disease is available. Supportive care by a multidisciplinary team of specialists"
    quote_role: REVIEW_SYNTHESIS
    explanation: Establishes that only supportive, multidisciplinary care is available for genetic prion disease.

name: Spongiform Encephalopathy With Neuropsychiatric Features
creation_date: "2026-10-22T03:46:16Z"
category: Mendelian
disease_term:
  preferred_term: spongiform encephalopathy with neuropsychiatric features
  term:
    id: MONDO:0011703
    label: spongiform encephalopathy with neuropsychiatric features
synonyms:
- familial spongiform encephalopathy (PRNP T183A)
- PRNP T183A prion disease
- Creutzfeldt-Jakob disease, codon 183 mutation
references:
- reference: PMID:20301407
  title: "Genetic Prion Disease"
  tags:
  - GeneReviews
description: >-
  Spongiform encephalopathy with neuropsychiatric features (OMIM 606688) is a
  very rare, autosomal dominant genetic prion disease caused by the PRNP
  threonine-to-alanine missense variant at codon 183 (T183A). It was first
  described in a large Brazilian kindred (Nitrini et al., 1997) and is set apart
  from the classic inherited prion phenotypes by its presentation: an early-onset
  (mean mid-40s) dementia with prominent frontotemporal-type behavioural and
  personality change and parkinsonism, so that most affected individuals are first
  seen by psychiatrists and the clinical picture closely resembles frontotemporal
  dementia with parkinsonism (FTDP-17) rather than rapidly progressive
  Creutzfeldt-Jakob disease. Neuropathology shows severe spongiform change and
  neuronal loss concentrated in the deep neocortical layers and the putamen with
  conspicuously minimal gliosis, and PrP immunoreactivity in the putamen and
  cerebellum. Mechanistically T183A is a double lesion on the prion protein: the
  substitution removes one of the two N-linked glycosylation sequons of PrP and
  abolishes a gatekeeper hydrogen bond (Y162-T183) that stabilizes the native
  globular fold, producing the strongest native-state destabilization of any
  TSE-associated PrP variant and a strong propensity to misfold and aggregate.
  Like all prion diseases it is progressive and fatal, and no disease-modifying
  therapy exists.


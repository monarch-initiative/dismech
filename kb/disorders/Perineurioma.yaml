progression:
- phase: Course of the intraneural form
  subtype: Intraneural
  description: >-
    Static or slowly progressive over years. In the longitudinal series, 12 patients followed for
    3.5 years showed very mild, slow progression of motor and sensory deficits, and in none did the
    tumour spread to nerves not involved at first. A 2021 systematic review found that, of the 31
    conservatively managed patients with follow-up (median 11 months), most reported no neurological
    change and 29% worsened. A 2024 review of childhood cases records motor decline in 13 of the 16
    unoperated children with follow-up, 11 of the 16 being children of the longitudinal series. In a
    series of 18 patients with the plexal form, six of the seven managed without surgery who had
    follow-up progressed.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore prospective clinical follow-up examination in 12 patients over 3.5 years
      demonstrated very mild slow progression of motor and sensory deficits.
    explanation: >-
      Prospective follow-up of 12 patients.
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also none of these patients had the tumour spread to nerves not initially involved.
    explanation: >-
      No spread to other nerves.
  - reference: PMID:34284162
    reference_title: >-
      Clinical Features, Natural History, and Outcomes of Intraneural Perineuriomas: A Systematic
      Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those managed conservatively with available follow-up (n = 31), median follow-up was 11
      months, and most (67.7%, n = 21) reported no change in neurologic status, although worsening
      was noted in 29.0% (9/31).
    explanation: >-
      The course without surgery across the review's cases.
  - reference: PMID:36596935
    reference_title: >-
      Plexal intraneural perineurioma: an analysis of the clinicoradiologic presentation of this
      rare variant.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of patients managed nonoperatively, 87% of patients (6/7) with follow-up information
      demonstrated disease progression with worsening motor function or sensory loss, and 2 patients
      demonstrated progression on imaging at most recent follow-up.
    explanation: >-
      Progression in the plexal form, from a series of 18.
  - reference: PMID:38434310
    reference_title: >-
      Treatment of childhood intraneural perineurioma: A case report and literature review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen out of 28 patients without surgery were followed up for 50.56 ± 51.51 months (ranged
      from 8 months to 14 years). Motor function in three out of these patients was stable and
      declined in 13 patients.
    explanation: >-
      Decline without surgery in 13 of 16 children, across the review's cases. By a count of the
      review's patient table, 11 of the 16 are children of the longitudinal series.
- phase: Outcome
  description: >-
    Benign. The longitudinal series found no transformation of the intraneural form to a malignant
    tumour, and a 2007 systematic review states that it does not recur or metastasize. Soft tissue
    tumours rarely recur: in one series 2 of the 43 patients with follow-up had a recurrence, 5 to
    10 years after excision.
  evidence:
  - reference: PMID:17824794
    reference_title: >-
      Intraneural perineurioma: a systematic review with illustrative cases.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intraneural perineurioma is a benign peripheral nerve sheath tumor that does not recur or
      metastasize.
    explanation: >-
      The 2007 systematic review's statement on the intraneural form.
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have found no cases where there was transformation to a malignant tumour.
    explanation: >-
      No malignant transformation in 32 patients.
  - reference: PMID:15958848
    reference_title: >-
      Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with atypical
      histologic features.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical follow-up was available for 43 patients (mean, 41 months; range, 6-146 months). Among
      tumors for which the status of surgical margins was known, 52% were widely excised, 31% were
      marginally excised, and 18% had positive margins. Only two tumors recurred locally (one of
      which was atypical): one recurred 10 years following primary excision; and one recurred twice,
      5 and 9 years following excision.
    explanation: >-
      Two recurrences among the 43 patients with follow-up.
  - reference: PMID:15958848
    reference_title: >-
      Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with atypical
      histologic features.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Soft tissue perineuriomas behave in a benign fashion and rarely recur.
    explanation: >-
      The series' conclusion.
pathophysiology:
- name: Somatic TRAF7 WD40-Domain Mutation
  description: >-
    A recurrent lesion of the intraneural form: heterozygous missense mutations in the WD40 domain
    of TRAF7 (p.L519P, p.H521R or p.S561R), found in 10 of 16 tumours of an exome series, the same
    domain that is mutated in meningiomas. A hotspot assay in a later series found p.His521Arg in 2
    of 9. In the exome series the variants were checked against blood or saliva DNA from 7 of the 16
    patients.
  subtypes:
  - Intraneural
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: TRAF7
      term:
        id: hgnc:20456
        label: TRAF7
    variant_origin: SOMATIC
    zygosity: HETEROZYGOUS
    allelic_events:
    - MISSENSE_VARIANT
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  cell_types:
  - preferred_term: perineurial cell
    term:
      id: CL:0002576
      label: perineurial cell
  locations:
  - preferred_term: peripheral nerve
    term:
      id: UBERON:0001021
      label: nerve
  notes: >-
    The perineurial cell is bound as the cell of origin because the tumour is defined as a tumour of
    perineurial cells; no source traces it to a precursor. No functional effect is recorded for the
    variants: the exome series predicts from structure that they disrupt the WD40 domain, without an
    assay.
  downstream:
  - target: Intraneural Perineurial Cell Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The exome series reads TRAF7 as the driver of the intraneural form; how the mutations produce
      the tumour is not shown. They are predicted to disrupt the WD40 domain's interactions, and
      dysregulated NF-kappaB signalling is a proposed mechanism, also implicated in meningiomas with
      homologous variants, that has not been shown in perineurioma.
    evidence:
    - reference: PMID:28019650
      reference_title: >-
        Genomic analysis reveals frequent TRAF7 mutations in intraneural perineuriomas.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our comprehensive and high-resolution genomic analysis of intraneural perineuriomas
        identifies 3 recurrent TRAF7 somatic mutations, providing strong evidence for a specific
        tumor gene driver in intraneural perineurioma.
      explanation: >-
        The series' conclusion that TRAF7 drives the tumour. INDIRECT: recurrence of the mutation,
        not the step to growth.
    - reference: PMID:28019650
      reference_title: >-
        Genomic analysis reveals frequent TRAF7 mutations in intraneural perineuriomas.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: COMPUTATIONAL
      snippet: >-
        These mutations are predicted to inactivate the interaction of TRAF7 with other proteins or
        destabilize the WD40 domain.
      explanation: >-
        A prediction from protein structure, not an assay.
    - reference: PMID:41657107
      reference_title: >-
        The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic
        Findings in Intraneural Perineurioma.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        These variants are thought to promote tumorigenesis through dysregulation of the nuclear
        factor kappa B (NF‐κB) signalling pathway, a mechanism also implicated in meningiomas
        harbouring homologous variants
      explanation: >-
        The NF-kappaB mechanism the later series reports, citing earlier work, also implicated in
        meningiomas with homologous variants. INDIRECT: not shown in perineurioma.
    - reference: PMID:28019650
      reference_title: >-
        Genomic analysis reveals frequent TRAF7 mutations in intraneural perineuriomas.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        TRAF7 specifically interacts with MEKK3 and regulates the TNF-α/NF-κB signal transduction
        pathway.
      explanation: >-
        TRAF7's known role in NF-kappaB signalling, from the exome series' discussion. INDIRECT: a
        known function, not a finding in these tumours.
  evidence:
  - reference: PMID:28019650
    reference_title: >-
      Genomic analysis reveals frequent TRAF7 mutations in intraneural perineuriomas.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of 16 (60%) tumor cases had mutations in the WD40 domain of TRAF7, the same location for
      causal mutations of meningiomas.
    explanation: >-
      TRAF7 mutations in 10 of the 16 tumours (62.5%; the abstract prints 60%).
  - reference: PMID:28019650
    reference_title: >-
      Genomic analysis reveals frequent TRAF7 mutations in intraneural perineuriomas.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, 10 of 16 cases share 3 novel, heterozygous, damaging mutations in TRAF7: p.L519P
      (n = 3), p.H521R (n = 3), and p.S561R (n = 4), and all 3 mutations of TRAF7 are within its
      WD40 domain, with p.L519P and p.H521R within exon 17 and p.S561R within exon 18 (see Fig 1D).
    explanation: >-
      The three recurrent mutations and where they sit.
  - reference: PMID:28019650
    reference_title: >-
      Genomic analysis reveals frequent TRAF7 mutations in intraneural perineuriomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also obtained 4 blood and 3 saliva samples from 7 of these 16 patients, and extracted their
      genomic DNA as germline controls.
    explanation: >-
      Germline controls were available for 7 of the 16 patients only.
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A pathogenic TRAF7 p.His521Arg variant was identified in 2/9 evaluable tumours (22.2%).
    explanation: >-
      A hotspot assay's lower yield in another series.

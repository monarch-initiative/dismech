- name: Nerve enlargement, usually fusiform
  modality: MRI
  imaging_finding_term:
    preferred_term: enlargement of the affected nerve, usually fusiform
    term:
      id: HP:0012645
      label: Enlarged peripheral nerve
  description: >-
    For the intraneural form. MRI shows the affected nerve enlarged, usually with a gradual swelling
    and taper. In the longitudinal series the nerve was enlarged in 29 of 32 patients, fusiformly in
    27, over a median of 8 cm (2.5 to 32 cm). In a 2026 series of ten, fusiform enlargement was seen
    in all; the lesion was longer than 10 cm in four and took in the whole cross-section of the
    nerve in seven of nine. A 2018 series of 19 reports an aspecific enlargement in 16 and, in five,
    a fusiform tumour, hypo- to isointense on T1 and hyperintense on T2, which its results call
    typical and its abstract atypical; the series' tumour sizes ranged from 1 to 10 cm; the counts
    add up to more than its 19 patients, and its authors call most of its enlargements non-specific,
    without giving their shape. Other conditions can show some of these features: the 2018 series
    notes fusiform enlargement also in lipomatosis, which differs in its other MRI characteristics,
    and in schwannoma and neurofibroma, with a more rounded appearance, and the 2026 PET series
    notes that peripheral nerve amyloidosis may show fascicular enlargement, T2 hyperintensity and
    variable enhancement. A 2025 case report likewise sets perineurioma's fusiform dilation against
    the globular enlargement of schwannoma.
  subtype: Intraneural
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    Bound to HP:0012645 Enlarged peripheral nerve, which does not name the fusiform shape. OLS
    searches of HPO, with all results read: "fusiform nerve" returned one unrelated term; "fusiform"
    returned 17 terms, among them aneurysms, tapered digits and bones and a pituitary spindle cell
    oncocytoma, none about nerve enlargement; "nerve enlargement" returned HP:0012645, HP:6001498
    Enlarged median nerve, HP:6001147 Increased peripheral nerve cross sectional area and nine other
    terms; "nerve thickening" returned HP:6000291 Third cranial nerve thickening, HP:0034347 Greater
    auricular nerve thickening, HP:6001498, HP:0012645, HP:0009732 Plexiform neurofibroma and
    HP:0030175 Myelin tomacula; "hypertrophic nerve" returned HP:0003382 Hypertrophic nerve changes,
    which has no definition, and four other terms. An NCIT label search for "fusiform" returned five
    cell types, a small cell carcinoma subtype and the fusiform gyrus. Banded very frequent on 29 of
    32 and 10 of 10. Sentences naming other conditions with these features are graded REFUTE against
    the diagnostic flag of each row whose feature they name. Marked diagnostic because the feature
    is one of the eight Perineurioma Diagnostic Criteria, whose specificity of 1.0 applies only when
    all eight are met; the sources give diagnostic value to the combination of features, set out on
    the MRI row of the diagnosis section, not to any single one, though single features are cited
    against particular alternatives (enhancement against CIDP, shape against schwannoma). The
    neurofibroma row of the differential diagnoses records that a localised neurofibroma typically
    enlarges a nerve fusiformly.

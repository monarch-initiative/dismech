- name: Malignant
  display_name: Malignant perineurioma
  subtype_term:
    preferred_term: malignant perineurioma
    term:
      id: MONDO:0016751
      label: malignant perineurioma
  classification: histological
  description: >-
    A malignant peripheral nerve sheath tumour with perineurial differentiation. A 1998 series found
    it in 4% of such tumours. In a 2026 DNA methylation study most tumours diagnosed as malignant
    perineurioma did not cluster with benign perineuriomas or with malignant peripheral nerve sheath
    tumours, and were closer to undifferentiated sarcoma; the study suggests they may be
    heterogeneous high-grade sarcomas rather than a distinct perineurial tumour.
  evidence:
  - reference: PMID:9808129
    reference_title: >-
      Perineurial malignant peripheral nerve sheath tumor (MPNST): a clinicopathologic,
      immunohistochemical, and ultrastructural study of seven cases.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, 4% of MPNST show perineurial cell differentiation.
    explanation: >-
      How often perineurial differentiation was found among malignant peripheral nerve sheath
      tumours.
  - reference: PMID:43020433
    reference_title: >-
      Deciphering Benign and Malignant Perineuriomas: A Comparative Epigenomic and Genomic Study
      With Hybrid and Malignant Peripheral Nerve Tumors.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most malignant perineuriomas (10/18) did not cluster with benign perineuriomas or MPNST but
      instead showed closer epigenetic similarity to undifferentiated sarcoma.
    explanation: >-
      The methylation finding in 18 malignant tumours.
  - reference: PMID:43020433
    reference_title: >-
      Deciphering Benign and Malignant Perineuriomas: A Comparative Epigenomic and Genomic Study
      With Hybrid and Malignant Peripheral Nerve Tumors.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically diagnosed malignant perineuriomas may represent biologically heterogeneous
      high-grade sarcomas rather than a distinct perineurial neoplasm.
    explanation: >-
      The study's reading: the diagnosis may not name one distinct tumour.

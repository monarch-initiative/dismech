- name: Low-grade fibromyxoid sarcoma
  disease_term:
    preferred_term: low-grade fibromyxoid sarcoma
    term:
      id: MONDO:0006272
      label: low grade fibromyxoid sarcoma
  description: >-
    For the soft tissue form. A sarcoma that overlaps histologically with conventional and
    sclerosing perineurioma; a review calls it the most important differential diagnosis of soft
    tissue perineurioma.
  distinguishing_features:
  - Unlike perineurioma, low-grade fibromyxoid sarcoma shows prominent stromal collagen deposition,
    an abrupt transition into myxoid nodules and a curvilinear vascular pattern; collagen may not
    separate it from sclerosing perineurioma, which also has extensive collagen deposition.
  - EMA is expressed in up to 40% of low-grade fibromyxoid sarcomas, so EMA staining alone does not
    separate them.
  - MUC4 expression and FUS rearrangement are present in low-grade fibromyxoid sarcoma and absent in
    perineurioma.
  notes: >-
    The 2026 methylation study also names dermatofibrosarcoma protuberans and sclerosing epithelioid
    fibrosarcoma as overlapping histologically; the cited sources give no distinguishing features
    for them, so they are not recorded as rows.

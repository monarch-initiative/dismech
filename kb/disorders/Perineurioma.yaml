  description: >-
    Grows within a peripheral nerve and stays inside its boundaries, as whorls of perineurial cells
    around the nerve fibres. It presents insidiously in children and young adults as a
    motor-predominant neuropathy, most often of the sciatic nerve or its branches.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intraneural (IN) perineurioma is a benign neoplasm composed exclusively of whorls of
      perineurial cells surrounding nerve fibres and restricted to the boundaries of a peripheral
      nerve
    explanation: >-
      The definition of the intraneural form, from the longitudinal series' introduction.
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude intraneural perineurioma is a benign hypertrophic (non onion bulb) peripheral
      nerve tumour that presents insidiously in young people and is motor predominant with mild
      sensory involvement.
    explanation: >-
      The longitudinal series' conclusion from 32 patients.
  - reference: PMID:34284162
    reference_title: >-
      Clinical Features, Natural History, and Outcomes of Intraneural Perineuriomas: A Systematic
      Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common sites were the sciatic nerve or its branches (41.9%), median nerve (13.5%),
      radial nerve (12.2%), and brachial plexus (12.2%).
    explanation: >-
      The nerves involved, across the cases of a 2021 systematic review.

    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the subgroup analysis, which included 50 cases where three markers (EMA, GLUT-1, and
      claudin-1) were used in all samples, the results showed that EMA was positive in 84%, GLUT-1
      in 94%, and claudin-1 in 88% of GI perineuriomas. Collagen IV was not included in the analysis
      because such staining was not performed in one of the studies. A chi-square test was used to
      compare the detection rates of the three markers. The chi-square statistic was 2.52, with a p
      value of 0.284. These findings indicate that there is no statistically significant difference
      in the expression of EMA, GLUT-1, or claudin-1 in GI perineuriomas.
    explanation: >-

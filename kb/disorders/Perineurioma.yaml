  frequency: VERY_FREQUENT
  diagnostic: true
  notes: >-
    Banded very frequent on the patients with a T2 reading, leaving out the three earlier studies
    that were reported normal but were not available for review: 25 of 27 in the longitudinal
    series' table, whose text gives 25 of 32 counting every patient, including three earlier studies
    reported normal and two without a T2 reading (25 of 30, 83%, if the three normal studies count
    as negative), and 9 of 10 in the 2026 series. NCIT:C182328 Hyperintensity does not name the
    sequence; the T2 weighting and the T1 isointensity are carried in the description. An OLS search

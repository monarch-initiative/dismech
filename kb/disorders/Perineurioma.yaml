    diagnostic because the feature is one of the eight Perineurioma Diagnostic Criteria, whose
    specificity of 1.0 applies only when all eight are met; the sources give diagnostic value to the
    combination of features, set out on the MRI row of the diagnosis section, not to any single one,
    though single features are cited against particular alternatives (enhancement against CIDP,
    shape against schwannoma). The criterion requires moderate to severe T2 hyperintensity, so the
    mildly hyperintense lesions recorded here would not meet it. An NCIT label search for
    "Hyperintens" returned only NCIT:C182328 and NCIT:C191061 MVAI - Hyperintensity T2-weighted

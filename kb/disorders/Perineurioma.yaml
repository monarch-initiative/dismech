      Ten of 16 (60%) tumor cases had mutations in the WD40 domain of TRAF7, the same location for
      causal mutations of meningiomas.
    explanation: >-
      TRAF7 mutations in 10 of 16 intraneural tumours.
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our hotspot-limited assay detected TRAF7 mutations in only 22.2%, underscoring methodological
      limitations and probable genetic heterogeneity.
    explanation: >-
      The later series reads its low yield as methodological limitations and probable genetic
      heterogeneity.
- name: NF2
  gene_term:
    preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Mutated in half of a small molecular series of soft tissue tumours (conventional, sclerosing,
    and one the study calls retiform), and reported in one malignant and one intraneural tumour in
    the other studies cited here. Two of the three studies cited here say they tested tumour tissue,
    and none states the mutations' origin (two are read as abstracts, the malignant-tumour case
    report in full), so the somatic origin is an inference that a germline test would be needed to
    confirm. The intraneural study reports no signs of neurofibromatosis type 2 in its patients, and
    the case report no family history suspected of hereditary tumours; the 2001 abstract does not
    say whether its patients had neurofibromatosis type 2. The ClinGen export cached in this
    repository (cache/clingen/gene_validity.csv) classifies NF2 only for a different disease
    (MONDO:0007039), so no gene-disease validity assertion is recorded here.
  evidence:
  - reference: PMID:11290539
    reference_title: >-
      The neurofibromatosis type 2 gene is mutated in perineurial cell tumors: a molecular genetic
      study of eight cases.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five NF2 point mutations, two in the 5'-untranslated region (UTR) and three in exons 3, 6, and
      8, were identified in four of eight cases (50%) studied.
    explanation: >-
      NF2 mutations in four of eight benign tumours.
  - reference: PMID:38739347
    reference_title: >-
      Malignant perineurioma derived from the retroperitoneum with an aggressive clinical course: a
      case report.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cancer gene panel testing of the retroperitoneal tumor sample showed a base substitution in
      ARID1A (splice site 2251+2T>G), duplication of exons 5–31 in NOTCH2, frameshift mutation in
      MSH6 (D387fs*4), and deletion of exons 5–9 in NF2, none of which were treatable target in the
      present case.
    explanation: >-
      A deletion within NF2 in a malignant perineurioma, among other changes.
  - reference: PMID:18807521
    reference_title: >-
      [Intraneural perineurioma: clinical and morphological characteristics and a molecular genetic
      study of the neurofibromatosis type 2 gene].
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One case was studied for mutation of the NF2 gene and heterozygous splice-site mutation at the
      acceptor splice site between exons 12 and 13 (agGG --> aaGG) was revealed.
    explanation: >-
      An NF2 splice-site mutation in one intraneural tumour.
diagnosis:
- name: Targeted fascicular nerve biopsy
  diagnosis_term:
    preferred_term: targeted fascicular nerve biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  description: >-
    For the intraneural form, a biopsy of an enlarged fascicle found on imaging gives the diagnosis.
    The longitudinal series calls it the only definitive method for telling these focal neuropathies
    apart, and a later series did it in nine patients without neurological worsening; another
    derived clinical and MRI criteria that, when all are met, make the biopsy unnecessary.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At this time, fascicular nerve biopsy is the only definitive method for differentiating these
      focal mononeuropathies.
    explanation: >-
      The longitudinal series' view.
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic targeted fascicular biopsy was performed in nine patients without postoperative
      neurological worsening, supporting the safety of the procedure when histological confirmation
      is required.
    explanation: >-
      Safety of the biopsy in nine patients.
  - reference: PMID:29192862
    reference_title: >-
      Clinicoradiological features of intraneural perineuriomas obviate the need for tissue
      diagnosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Use of the Perineurioma Diagnostic Criteria obviates the need for tissue diagnosis when all of
      the criteria are satisfied.
    explanation: >-
      Criteria that make the biopsy unnecessary when all are met.
- name: Magnetic resonance imaging of the nerve
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the affected nerve
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Shows a fusiform enlargement of the affected nerve, hyperintense on T2-weighted images and
    enhancing with gadolinium. With age 40 or under, no cancer history and a single lesion, these
    features make up a set of diagnostic criteria for the intraneural form.
  evidence:
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI demonstrated fusiform nerve enlargement and homogeneous gadolinium enhancement in all
      cases, with T2 hyperintensity in 9/10.
    explanation: >-
      The findings in ten patients.
  - reference: PMID:29192862
    reference_title: >-
      Clinicoradiological features of intraneural perineuriomas obviate the need for tissue
      diagnosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Perineurioma Diagnostic Criteria were determined to be the following: 1) no cancer
      history, 2) unifocal disease, 3) moderate to severe hyperintensity on T2-weighted MR images,
      4) moderate to severe contrast enhancement, 5) homogeneous contrast enhancement, 6) fusiform
      shape, 7) enlargement of the involved nerves, and 8) age ≤ 40 years.
    explanation: >-
      The eight criteria, from a cohort of 195 patients who had a fascicular biopsy.
- name: Nerve conduction studies and electromyography
  diagnosis_term:
    preferred_term: nerve conduction studies and electromyography
    term:
      id: NCIT:C215111
      label: Neuroelectrophysiology Test
  description: >-
    Generally confirm a focal neuropathy, with loss of axons as the main finding.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCS/EMG were performed in 30 patients and the focal nature of the neuropathy was generally
      confirmed.
    explanation: >-
      The focal neuropathy generally confirmed in the 30 patients tested.
- name: Immunohistochemistry
  diagnosis_term:
    preferred_term: immunohistochemistry for epithelial membrane antigen and S-100 protein
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  description: >-
    The tumour cells stain for epithelial membrane antigen and not, or only in a few tumours, for
    S-100 protein. A 2026 study notes that staining for EMA and GLUT1 lacks specificity.
  evidence:
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EMA staining was strongly positive in all samples.
    explanation: >-
      Epithelial membrane antigen in all ten intraneural tumours.
  - reference: PMID:15958848
    reference_title: >-
      Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with atypical
      histologic features.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All tumors were reactive for epithelial membrane antigen; 50 of 78 (64%) expressed CD34, 22 of
      76 (29%) claudin-1, 16 of 77 (21%) smooth muscle actin, and 4 of 81 (5%) S-100 protein.
    explanation: >-
      The panel in 81 soft tissue tumours.
  - reference: PMID:43020433
    reference_title: >-
      Deciphering Benign and Malignant Perineuriomas: A Comparative Epigenomic and Genomic Study
      With Hybrid and Malignant Peripheral Nerve Tumors.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EMA and GLUT1 immunohistochemistry lack specificity, and recurrent genetic alterations have
      not been consistently identified.
    explanation: >-
      The caveat the description states: neither EMA nor GLUT1 is specific for perineurioma.
treatments:
- name: Observation
  treatment_term:
    preferred_term: observation
    term:
      id: NCIT:C25598
      label: Observation Activity
  description: >-
    For the intraneural form. The longitudinal series advises against routine resection, since the
    tumour is static or slowly progressive and stays in its first distribution, and in a 2021
    systematic review most patients were managed conservatively. A later series questions whether
    observation alone is enough.
  notes: >-
    NCIT:C15722 Patient Observation fits the action more closely, but its parents, Surveillance
    (NCIT:C15719) and Healthcare Activity (NCIT:C16205), are not under Clinical Intervention or
    Procedure (NCIT:C25218), so the treatment-action enum rejects it; Observation Activity is used
    instead, as in other entries.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As these tumours are static or slowly progressive, remain confined to their original
      distribution and have low morbidity, they probably should not be resected routinely.
    explanation: >-
      The longitudinal series' advice.
  - reference: PMID:34284162
    reference_title: >-
      Clinical Features, Natural History, and Outcomes of Intraneural Perineuriomas: A Systematic
      Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients were managed conservatively (52.9%; 72/136).
    explanation: >-
      Conservative management in most of the review's patients.
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings question the adequacy of observation alone and underscore the need for early
      recognition and risk stratification to prevent irreversible motor loss.
    explanation: >-
      The later series' doubt, which cuts against observation alone.
- name: Tendon transfer
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tendon transfer
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  description: >-
    Used to restore movement lost in the affected nerve's territory, with mixed results; in the
    plexal form, two of the four patients with a known outcome had a failed transfer as the
    neuropathy spread to the donor muscles.
  notes: >-
    NCIT has no tendon-transfer term. NCIT:C158009 Therapeutic Tendon Procedure is defined as
    treating a condition of the tendons, so Reconstructive Surgery, the surgical restoration of
    function, is used; the later series calls the transfer a reconstructive strategy.
  evidence:
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tendon transfer was performed in 7/10 patients as a reconstructive strategy to improve motor
      function, resulting in heterogeneous functional outcomes.
    explanation: >-
      Mixed results in seven patients.
  - reference: PMID:36596935
    reference_title: >-
      Plexal intraneural perineurioma: an analysis of the clinicoradiologic presentation of this
      rare variant.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients underwent tendon transfer, of which two had failure of tendon transfer at most
      recent follow-up (50%, 2/4) due to progression of neurologic loss affecting the donors.
    explanation: >-
      Failure in two of four patients of the plexal form, which cuts against the transfer there.
- name: Surgical excision
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15232
      label: Excision
  description: >-
    The treatment of the soft tissue form and its variants; in the 81-case series, of the tumours
    whose margins were known about half were widely excised, and 2 of the 43 patients with follow-up
    had a recurrence. None of the seven sclerosing tumours followed up recurred.
  target_mechanisms:
  - target: Soft Tissue Perineurial Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Excision removes the tumour.
    evidence:
    - reference: PMID:15958848
      reference_title: >-
        Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with
        atypical histologic features.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical follow-up was available for 43 patients (mean, 41 months; range, 6-146 months).
        Among tumors for which the status of surgical margins was known, 52% were widely excised,
        31% were marginally excised, and 18% had positive margins. Only two tumors recurred locally
        (one of which was atypical): one recurred 10 years following primary excision; and one
        recurred twice, 5 and 9 years following excision.
      explanation: >-
        Two recurrences among the 43 patients with follow-up. INDIRECT: an outcome of the treatment,
        cited for the tissue it removes.
  evidence:
  - reference: PMID:15958848
    reference_title: >-
      Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with atypical
      histologic features.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among tumors for which the status of surgical margins was known, 52% were widely excised, 31%
      were marginally excised, and 18% had positive margins.
    explanation: >-
      The extent of excision in the 81-case series.
  - reference: PMID:9414186
    reference_title: >-
      Sclerosing perineurioma: a clinicopathologic study of 19 cases of a distinctive soft tissue
      lesion with a predilection for the fingers and palms of young adults.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the lesions were locally excised. Follow-up was obtained for seven patients, with mean
      and median follow-up intervals of 12 years 7 months and 10 years 6 months, respectively. None
      of the lesions have recurred.
    explanation: >-
      Local excision of all 19 sclerosing tumours; none of the seven followed up recurred.
notes: >-
  The two main forms are recorded as two chains, each starting from its own somatic lesion in the
  perineurial cell: TRAF7 in the intraneural form, NF2 in some soft tissue tumours (recorded as
  somatic by inference). Pain is not linked to a mechanism node, because no cited source establishes
  how the tumour produces it; the later intraneural series names possible mechanisms without showing
  them. MONDO places the reticular and sclerosing variants under extraneural perineurioma.

- name: Reticular
  display_name: Reticular perineurioma
  subtype_term:
    preferred_term: reticular perineurioma
    term:
      id: MONDO:0015029
      label: reticular perineurioma
  classification: histological
  description: >-
    A variant of soft tissue perineurioma with a reticular growth pattern; a 2012 review attributes
    the pattern to abundant myxoid change, which it says is present in a subset of soft tissue
    perineuriomas; the six-case series defines it by its reticular growth pattern and describes the
    stroma as variably collagenous to myxoid. In a series of six, four women and two men aged 34 to
    61, four arose in the subcutis of the upper limb, one in the gingiva and one in the subcutis of
    the groin. The five with clinical information had no symptoms, the tumours having been present
    for 4 months to 10 years, and the six measured 1.5 to 10 cm. Neither of the two patients
    followed up had a recurrence.
  evidence:
  - reference: PMID:11257623
    reference_title: >-
      Reticular perineurioma: a distinctive variant of soft tissue perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the clinicopathologic, immunohistochemical, and ultrastructural features of six
      cases of a poorly recognized morphologic variant of soft tissue perineurioma, characterized by
      a highly distinctive reticular growth pattern.
    explanation: >-
      The variant and its defining pattern, in a series of six.

- category: Gastrointestinal
  name: Colonic mucosal polyp
  subtype: Soft tissue
  phenotype_term:
    preferred_term: colonic mucosal polyp
    term:
      id: HP:0005266
      label: Intestinal polyp
  description: >-
    The colonic form, which includes polyps reported as benign fibroblastic polyps that stain for
    perineurial markers: a small polyp, mostly of the distal colon. In a systematic review of 148
    published gut cases, 93% were colonic (colon or rectum) and 87.5% of the colonic ones with a
    recorded side were in the distal colon; the sigmoid and rectosigmoid were the commonest site
    (56% of all gut cases). Colonic polyps averaged 4 mm, and 87% of them were found at routine
    screening. Across the gut cases with data, 86% of polyps involved the mucosa and 14% invaded the
    submucosa, and 59% of patients were women, with a mean age of 51.
  notes: >-
    HPO has no term for a single colonic or rectal polyp of unspecified type: OLS4 searches of HPO
    on 25 Nov 2026 for 'colon polyp', 'colonic polyp', 'rectal polyp' and 'intestinal polyp', and
    the first 25 results for 'polyp', found none. Besides HP:0005266 Intestinal polyp itself, they
    returned terms for polyposis (multiple polyps), particular kinds of polyp such as HP:0025198
    Inflammatory cap polyp, polyps of other sites, and unrelated terms. HP:0100273 Neoplasm of the
    colon and HP:0100834 Neoplasm of the large intestine name the site but not the polyp. The row
    binds HP:0005266 Intestinal polyp, which covers a single polyp of the intestine, because a polyp
    is how these tumours present at colonoscopy; preferred_term names the colon. The Gastric polyp
    row binds the site instead, since no single-polyp term covers the stomach. The review pooled
    published case reports and series, and its percentages use the cases with data: the 87.5% is of
    the 128 colonic cases with a recorded side, the depth figures are of 137 cases, and the mean age
    rests on the 84 that reported age. For the colonic cases alone, its Table 4 gives a mean age of
    52.5 and 58.7% women. Its text also gives a second depth split, 90.6% mucosal, without saying
    which cases it covers. The review itself notes that routine colonoscopy may make colonic polyps
    more likely to be found incidentally. Its inclusion criteria admitted cases, whether reported as
    perineurioma or as benign fibroblastic polyp, that stained for at least one of four perineurial
    markers, although it recommends classifying with at least two. 'Colonic' follows the review's
    own grouping, which includes 22 rectal cases, so the node's location is the mucosa of the large
    intestine rather than of the colon alone. The row is placed under the Soft tissue subtype
    through the reclassification of these polyps as extraneural perineurioma cited on that subtype's
    row.
  evidence:
  - reference: PMID:40225020
    reference_title: >-
      Gastrointestinal Tract Perineuriomas and Benign Fibroblastic Polyps: Case Report and
      Comprehensive Systematic Review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, a new classification suggests reclassifying benign fibroblastic polyps as
      perineurioma when they show positive markers of perineurial differentiation.
    explanation: >-
      Why benign fibroblastic polyps are counted here: a newer classification proposes placing those
      with perineurial markers under perineurioma.
  - reference: PMID:40225020
    reference_title: >-
      Gastrointestinal Tract Perineuriomas and Benign Fibroblastic Polyps: Case Report and
      Comprehensive Systematic Review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 93.24% of the polyps were colonic, and 6.76% were noncolonic.
    explanation: >-
      Most of the 148 gut cases were in the colon.
  - reference: PMID:40225020
    reference_title: >-
      Gastrointestinal Tract Perineuriomas and Benign Fibroblastic Polyps: Case Report and
      Comprehensive Systematic Review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL

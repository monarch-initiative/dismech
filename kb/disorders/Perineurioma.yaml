- name: Hybrid schwannoma-perineurioma
  description: >-
    For the intraneural and soft tissue forms. A benign hybrid nerve sheath tumour; a review
    describes hybrids with the architecture of soft tissue perineurioma but increased S-100
    expression, and in a published series it summarises, the tumours had predominantly Schwann cell
    cytology and a predilection for superficial sites. A 2026 series, citing earlier work, notes
    that hybrid lesions may still need tissue sampling in atypical cases to be told from the
    intraneural form.
  distinguishing_features:
  - Biphasic, non-overlapping S-100-positive and EMA-positive cell components, in tumours that are
    usually unencapsulated and have a predilection for superficial (dermal or subcutaneous) sites.
  - By DNA methylation, hybrid schwannoma-perineuriomas are related to neurofibromas, and
    perineuriomas are epigenetically distinct.

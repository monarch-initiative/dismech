    for "l~hybrid nerve sheath" or "l~hybrid", and "l~perineurioma" returned eight terms (six
    current, two obsolete), none of them hybrid; these are label searches. The row carries no
    disease_term. The review's summary adds that scant neurofilament-positive axons favoured a
    schwannoma over a neurofibroma component, whereas the 2026 methylation study relates the hybrids
    to neurofibroma.

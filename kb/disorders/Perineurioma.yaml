- name: Nerve resection, with or without grafting
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: resection of the involved nerve segment, with or without grafting
    term:
      id: NCIT:C51785
      label: Neurectomy
  description: >-
    For the intraneural form. Resection aims to remove the tumour, with or without a nerve graft.
    In a 2021 systematic review, in which 40 of 64 surgically managed cases were resected with or
    without repair, no lesion recurred after resection (the abstract gives no follow-up after
    resection). The other sources restrict it. A 30-patient series, in which four patients were
    completely resected and grafted, advises against complete resection to preserve the nerve's
    residual function and judges the results of grafting poor, suggesting residual tumour cells as
    one reason. The longitudinal series warns of further iatrogenic deficit with grafting, as in
    one of its own patients; it says resection with grafting may be considered for focal, more
    distal lesions without long-term muscle atrophy when the intra-operative nerve action
    potential is absent or low, but most of its own cases would not qualify, so it advises that
    resection should usually not be performed. It found no tumour spreading to initially
    uninvolved nerves on surveillance MRI, though it recognises that longer follow-up is needed. A
    2024 review of childhood cases notes that resection is widely held, though without consensus,
    to be restricted to shorter lesions; it suggests that complete removal may prevent proximal
    progression where a terminal branch of a single major nerve is involved over a short length,
    but advises caution for tumours involving major nerves, and it restates an earlier finding
    that the tumours only rarely grew in length and did not grow to involve new nerves; a 2026
    series, in which the one patient resected and grafted (who had an early severe deficit and
    also a tendon transfer) illustrates the high morbidity, reserves surgery for select cases,
    particularly short-segment involvement and rapid progression. Outcomes after resection are
    mixed. In the 2024 review, of ten patients followed up after grafting, five improved mildly
    (involved segments of 1.5 to 5 cm) and five, recorded as stable, did not (2.5 to 18 cm, one
    unknown). Of its nine patients excised without a graft, two were followed up: one without
    motor improvement and one, asymptomatic before surgery, free of recurrence at 6 years. In the
    longitudinal series, five patients had resection with grafting: the two who were interviewed,
    both of whom also had tendon transfers, felt the surgery had improved them (one of them is
    also one of the review's improved patients), while another's wrist and finger extension
    worsened after a radial nerve resection and grafting, improving gradually but not to baseline
    when follow-up ended at 6 months.
  notes: >-
    The row binds NCIT:C51785 Neurectomy, the surgical removal of all or part of one or more
    nerves: it names the removal, and the repair, when there is one, is outside it. NCIT:C51785
    names the nerve, which NCIT:C15232 Excision, used by the Surgical excision row, does not;
    NCIT:C94428 Nerve Grafting names only the reconstruction, and the row also covers resection
    without repair (the systematic review pools both). Searches run with runoak -i sqlite:obo:ncit
    search: "l~neurectomy" returned only Neurectomy; "l~resection" returned no label containing
    "nerve"; "l~nerve" returned no nerve excision or resection term, its procedure terms being
    Nerve Grafting, Somatic-to-Autonomic Nerve Grafting and Nerve-Sparing Prostatectomy.
  target_mechanisms:
  - target: Intraneural Perineurial Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Resection removes the nerve segment the tumour occupies; the 30-patient series suggests that
      tumour cells may remain along the nerve, as one reason for poor results after grafting.
    evidence:
    - reference: PMID:34284162
      reference_title: >-
        Clinical Features, Natural History, and Outcomes of Intraneural Perineuriomas: A
        Systematic Review of the Literature.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No lesion recurred after surgical resection.
      explanation: >-
        No lesion recurred after resection in the systematic review. INDIRECT: an outcome of the
        treatment, cited for the tissue it removes; the abstract does not give the follow-up after
        resection.
    - reference: PMID:34030186
      reference_title: >-
        Perineurioma: A Rare Entity of Peripheral Nerve Sheath Tumors.
      supports: REFUTE
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Results after grafting are poor. One reason for this might be residual tumor cells along
        the nerve that cannot be visualized.
      explanation: >-
        The 30-patient series suggests that tumour cells may remain along the nerve after
        resection. INDIRECT: offered as one possible reason for poor results after grafting, not
        as an observed finding.

- name: Sclerosing
  display_name: Sclerosing perineurioma
  subtype_term:
    preferred_term: sclerosing perineurioma
    term:
      id: MONDO:0015030
      label: sclerosing perineurioma
  classification: histological
  description: >-
    A variant of soft tissue perineurioma that arose in the fingers or palm in both series cited
    here. In the first series, of 19, it typically presented as a painless mass, present for 6
    months to 40 years before removal; in a later series of 7 the main reason for consultation was a
    slowly enlarging mass, present for 2 to 7 years in the 4 with a recorded duration. The tumours
    of the first series were generally well marginated but unencapsulated. They measured 0.7 to 3.3
    cm in the first series and 4 to 12 mm in the second. The two series differ in sex: 14 of 19
    patients were male in the first and 6 of 7 female in the second. Median age was 24.5 (range 9 to
    55) in the first and 42 (range 15 to 58) in the second. A 2012 review, written before the second
    series, describes the variant as most often seen in the hand of young men, citing one study.
    None of the 7 patients followed up in the first series, for a mean of 12 years 7 months, had a
    recurrence.
  evidence:
  - reference: PMID:9414186
    reference_title: >-
      Sclerosing perineurioma: a clinicopathologic study of 19 cases of a distinctive soft tissue
      lesion with a predilection for the fingers and palms of young adults.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

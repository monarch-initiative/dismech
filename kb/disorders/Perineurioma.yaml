- category: Gastrointestinal
  name: Gastric polyp
  subtype: Soft tissue
  phenotype_term:
    preferred_term: gastric polyp
    term:
      id: HP:0006753
      label: Neoplasm of the stomach
  description: >-
    Rarer than the colonic form: a 2025 review of gastric cases counts 12 published cases besides
    its own, and its authors speculate that the lesion is under-recognised in routine biopsy
    practice. Patients were mostly women (3 men to 10 women), with a mean age of 49.5 (range 25 to
    77). Epigastric or abdominal pain or discomfort was the commonest complaint, in 6 of the 13 by
    the review's summary table, though its text says most; some had reflux symptoms or bleeding, and
    about a third had no symptoms; the review's text says these were found at routine screening (see
    notes). The review gives a sessile polyp as the most common endoscopic appearance, but its
    per-case table describes the lesions more variously (see notes). They measured 0.5 to 5 cm (mean
    1.56 cm) and lay mostly in the body or fundus. In the gut-wide review the stomach was the
    commonest site outside the colon (7 of 10 cases), and tumours outside the colon were larger and
    more often symptomatic than colonic ones.
  notes: >-
    HPO has no term for a single gastric polyp: OLS4 searches of HPO on 25 Nov 2026 for 'gastric
    polyp' and 'stomach polyp', and the first 25 results for 'polyp', found none. The stomach terms
    they returned are HP:0004394 Multiple gastric polyps, HP:0033769 Fundic gland polyposis and
    HP:0004795 Hamartomatous stomach polyps; the other results were gut-wide polyposis terms, polyps
    of other sites, and unrelated terms. The row therefore binds HP:0006753 Neoplasm of the stomach,
    and preferred_term names the polyp, the appearance the review's summary table gives for 12 of
    its 13 cases; the edge to this row also cites two cases that the per-case table describes as
    subepithelial lesions. The gastric review gives size for 11 of its 13 cases. It marks two of its
    earlier reports as likely the same patient, and it shares at least seven published reports with
    the gut-wide review, so the two reviews are not independent. The gut-wide review itself notes
    that routine colonoscopy may make colonic polyps more likely to be found incidentally. The
    gut-wide review compares all tumours outside the colon, including those of the small intestine
    and oesophagus, with colonic ones, not gastric ones alone. On screening, the gastric review's
    text says the third of its cases with no symptoms were found at routine screening, but its
    per-case table names screening for two reports and a routine work-up for Crohn's disease for
    one; the gut-wide review puts screening at 11% of all tumours outside the colon. The review's
    summary table counts 12 of 13 cases as sessile polyps, but its per-case table names a sessile
    polyp for only two reports, a polypoid lesion for one and multiple small polyps for one. It
    describes the others as submucosal, flat, elevated, subepithelial or umbilicated lesions,
    nodules or masses, one of them a bleeding ulcerated mass and one a flat elevated lesion
    suspicious for carcinoma; it records no appearance for one report (which, with the
    polypoid-lesion report, it marks as likely the same patient) and leaves the authors' own case
    blank, for symptoms as well as appearance; the case text reports reflux-type symptoms and
    epigastric discomfort, and a proliferation involving the lamina propria and submucosa, and it
    calls that case a polypoid lesion and its figure legend a sessile polyp. Several published cases
    in the per-case table were submucosal or subepithelial. The row is placed under the Soft tissue
    subtype through the reclassification cited on that subtype's row.
  evidence:
  - reference: PMID:41954346
    reference_title: >-
      Gastric perineurioma detected in routine endoscopy biopsy practice: case report and review of
      clinico-pathological findings in the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, we speculate that these lesions are likely underrecognized in busy routine
      gastrointestinal biopsy service, as most are probably dismissed as benign mesenchymal
      polyps/submucosal proliferations after exclusion of GIST or are misdiagnosed as inflammatory
      fibroid polyp in the case of CD34 positivity.
    explanation: >-
      The authors' speculation: gastric perineurioma is likely under-recognised, so the published
      count may understate it.
  - reference: PMID:41954346
    reference_title: >-
      Gastric perineurioma detected in routine endoscopy biopsy practice: case report and review of
      clinico-pathological findings in the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No more than 12 cases of gastric perineurioma have been reported to date, and the diagnosis in
      a routine endoscopy biopsy service can be challenging given the broad differentials of a
      bland-looking spindle cell proliferation in gastric mucosa.
    explanation: >-
      How rare the gastric form is.
  - reference: PMID:41954346
    reference_title: >-
      Gastric perineurioma detected in routine endoscopy biopsy practice: case report and review of
      clinico-pathological findings in the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering our patient and the clinicopathological characteristics within the context of the

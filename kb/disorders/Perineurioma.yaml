- name: Soft tissue
  display_name: Soft tissue (extraneural) perineurioma
  subtype_term:
    preferred_term: extraneural perineurioma
    term:
      id: MONDO:0015031
      label: extraneural perineurioma
  classification: histological
  description: >-
    Arises outside nerves, in the soft tissue or skin and, less often, the gut, mostly in adults;
    outside the gut, most often in the limbs and trunk. In an 81-case series 42 tumours lay mainly
    in the subcutis, 25 in deep soft tissue and 9 in the dermis alone, and a 1998 report describes
    two cutaneous tumours of acral skin. In the gut it is mostly a small mucosal polyp of the distal
    colon; gut lesions earlier called benign fibroblastic polyps have been proposed for
    reclassification as extraneural perineurioma when they stain for perineurial markers (see the
    Colonic mucosal polyp row). The reticular and sclerosing variants are forms of it. A 2018 exome
    series of 14 soft tissue tumours found no TRAF7 mutation, a recurrent lesion of the intraneural
    form.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extraneural (EN) perineurioma is also composed of perineurial cells but is found mainly in
      soft tissues and skin
    explanation: >-
      The definition of the soft tissue form, from the longitudinal series' introduction.

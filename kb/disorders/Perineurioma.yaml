- name: Soft Tissue Perineurial Cell Proliferation
  description: >-
    Outside the gut, the soft tissue tumour is a mass of perineurial cells, all positive for
    epithelial membrane antigen in an 81-case series, from 0.3 to 20 cm across (mean 4.1 cm); a 2012
    review says it almost always has no associated nerve. A 1997 report of two cases with a review
    of the literature describes these tumours as generally small, well circumscribed and not
    encapsulated; the 2012 review says they are usually well circumscribed and may have a capsule.
    In the 81-case series nearly all were grossly circumscribed, and 12 had focal infiltrative
    margins under the microscope. In the gut, where most published cases are colonic, the tumour
    lies mostly within the mucosa (14% reached the submucosa in the gut-wide review, whose text
    gives a second split; see the Colonic mucosal polyp row's notes) and usually forms a polyp,
    though the gastric review's per-case table describes two gastric cases as subepithelial.
    Epithelial membrane antigen does not stain every gut tumour: among 50 published gut cases
    stained for it, GLUT-1 and claudin-1, it was positive in 84%, and a review of gastric cases,
    which shares several published cases with the gut-wide review, found most but not all positive.

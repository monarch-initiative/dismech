      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intraneural (IN) perineurioma is a benign neoplasm composed exclusively of whorls of
      perineurial cells surrounding nerve fibres and restricted to the boundaries of a peripheral
      nerve
    explanation: >-
      The definition of the intraneural form, from the longitudinal series' introduction.
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

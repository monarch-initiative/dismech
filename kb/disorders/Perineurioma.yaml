name: Perineurioma
creation_date: '2026-11-20T20:20:00Z'
category: Neoplastic
categories:
- Benign Neoplasm
- Peripheral Nerve Sheath Tumor
synonyms:
- perineurial cell tumor
description: >-
  Perineurioma is a rare, benign tumour of the peripheral nerve sheath made of perineurial cells,
  the specialised lining cells of the nerve sheath; the tumour cells stain for epithelial membrane
  antigen and not, or only in a few tumours, for S-100 protein, though epithelial membrane antigen
  does not stain every tumour, the negative tumours in the sources cited here being in the gut. It
  has two main forms, which differ in site, in course and in the genetic lesions reported in each.
  Intraneural perineurioma grows within a peripheral nerve, most often the sciatic nerve or its
  branches, and causes a slowly progressive, motor-predominant mononeuropathy in children and young
  adults; a TRAF7 mutation was found in 10 of 16 tumours in one series and 2 of 9 in another. Soft
  tissue (extraneural) perineurioma is a usually painless mass in the soft tissue or skin of adults,
  or a small polyp in the gut, mostly the colon. It has reticular and sclerosing variants, the
  sclerosing one mostly in the fingers and palm, and NF2 is mutated in some of its tumours. Both
  forms behave benignly: a 2007 systematic review states that the intraneural form does not recur,
  and an 81-case series reports that soft tissue tumours rarely recur. Malignant perineurioma is
  rare, and whether it is a distinct tumour is disputed.
parents:
- nerve sheath neoplasm
- tumor of cranial and spinal nerves

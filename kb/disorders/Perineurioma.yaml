- name: Conventional malignant peripheral nerve sheath tumour
  disease_term:
    preferred_term: conventional malignant peripheral nerve sheath tumour
    term:
      id: MONDO:0017827
      label: malignant peripheral nerve sheath tumor
  description: >-
    For the malignant form. Most malignant peripheral nerve sheath tumours (MPNST) are schwannian; a
    minority show perineurial differentiation, which this entry records as malignant perineurioma.
    Malignant perineuriomas remain poorly defined relative to MPNST. In one series of seven, the
    prognosis of perineurial MPNST appeared more favourable than that of conventional MPNST; four
    recurred and two metastasised, with no deaths of disease at 28 to 98 months.
  distinguishing_features:
  - In one series, perineurial MPNST were picked out by perineurioma-like whorled or storiform
    architecture together with EMA positivity and S-100 negativity, an immunophenotype that the
    authors conclude frequently indicates perineurial differentiation under the electron microscope
    (in their own tumours, perineurial-like cells in three and intermediate cells in one). A review
    lists whorls among the frequent, not entirely specific findings of MPNST. Its table marks MPNST
    as S-100-positive (+ to ++) and EMA-negative except those with perineurial differentiation, but
    the same review notes partial or complete loss of S-100 in MPNST and, in its discussion of
    synovial sarcoma, that MPNST may express EMA, so neither marker alone may separate them.
  - In that series of seven, none was associated with NF-1 and no neurofibroma component was seen,
    whereas the review names neurofibroma, especially plexiform neurofibroma in NF1, as the "main
    recognizable benign precursor" of MPNST.
  - By DNA methylation, most malignant perineuriomas (10 of 18) clustered neither with benign
    perineuriomas nor with MPNST and were epigenetically closer to undifferentiated sarcoma; a 2026
    study concludes that histologically diagnosed malignant perineuriomas may be biologically
    heterogeneous high-grade sarcomas rather than a distinct perineurial neoplasm.
  notes: >-
    MONDO has no label for conventional (schwannian) MPNST (label searches). runoak -i
    sqlite:obo:mondo search "l~malignant peripheral nerve sheath" returned the general class, its
    epithelioid and melanotic psammomatous variants (MONDO:0004540 and MONDO:0003862, both with
    MONDO:0017827 as an is_a ancestor) and an obsolete duplicate (MONDO:0003711), and "l~malignant
    schwann" returned only the age-split terms childhood and adult malignant schwannoma
    (MONDO:0004345, MONDO:0004545). The row binds the general class MONDO:0017827, which is
    broader than the row: the sources class perineurial MPNST within MPNST, though MONDO does not
    place malignant perineurioma (MONDO:0016751) under it. The 2026 study also notes that
    malignant perineuriomas may mimic YAP1::KMT2A-rearranged and TRAF7-mutant sarcomas; the cited
    sources give no distinguishing features for them, so they are not recorded as rows.
  evidence:

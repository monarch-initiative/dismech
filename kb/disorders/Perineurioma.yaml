- name: Somatic NF2 Inactivation
  description: >-
    The lesion found in some soft tissue tumours. In a molecular study of eight (two conventional,
    five sclerosing and one that the study calls a retiform variant), NF2 point mutations were found
    in four, and loss of the other allele was documented in two of these (loss of heterozygosity in
    one; a deletion of one allele found earlier by FISH in another), which the authors read as
    two-hit inactivation of the tumour suppressor gene. The abstract does not say which forms
    carried the mutations.

- name: Low-level FDG uptake
  modality: PET
  imaging_finding_term:
    preferred_term: low-level FDG uptake of the affected nerve
    term:
      id: NCIT:C116094
      label: FDG-PET Scanning Finding
  description: >-
    For the intraneural form. In a 2026 series of eight patients, every lesion showed what the
    authors call mildly increased uptake relative to the same nerve on the other side (maximum
    standardised uptake value mean 1.5, median 1.2, range 1.1 to 3.5, against a mean of 0.9 for the
    contralateral nerve). The highest value was in a slightly larger lesion. Five of the eight were
    diagnosed from characteristic clinical and MRI findings, and the three biopsies were done after
    PET. The scans happened to be on file, and none had been obtained to evaluate a tumour with
    pathognomonic MRI features. The authors note that reported uptake is generally higher in
    malignant peripheral nerve sheath tumours and neurolymphomatosis, that neurolymphomatosis and
    perineural tumour spread are often more FDG avid and usually occur in a different clinical
    context, although overlap is possible, and that peripheral nerve amyloidosis can also show
    low-level uptake, for which amyloid-specific tracers may give greater specificity in selected
    patients; they say their values should not be treated as diagnostic thresholds, though the
    difference in typical uptake may help prioritise the differential diagnosis alongside clinical
    and MRI findings; that MRI correlation is essential because most of the lesions are small and
    elongated; and that PET should not replace MRI as the primary examination, and should not be
    part of routine evaluation when the MRI features are pathognomonic, but should be considered
    when they are equivocal (minimal or mild uptake concordant with characteristic MRI findings may
    then provide supportive information), when multifocal disease is suspected or when malignancy is
    part of the differential diagnosis; unexpectedly high uptake should prompt reconsideration of
    the diagnosis or further evaluation. The authors list the study's limits as its retrospective
    design, small size, selection by tertiary referral and limited follow-up, add that measuring
    uptake in small nerves is subject to partial-volume effects and to differences between scanners
    and protocols, and say the findings need validation in further series.

progression:
- phase: Course of the intraneural form
  subtype: Intraneural
  description: >-
    Static or slowly progressive over years. In the longitudinal series, 12 patients followed for
    3.5 years showed very mild, slow progression of motor and sensory deficits, and in none did
    the tumour spread to nerves not involved at first; the median Neuropathy Impairment Score rose
    from 12.6 to 15.4 points, not a significant change, and follow-up MRI was unchanged in 11
    patients. On a symptom questionnaire (15 responses, five of them given at the first visit
    against an earlier date) patients judged their symptoms, weakness and sensation mildly worse,
    and at telephone follow-up of 23 patients, seven of whom had had further surgery (tendon
    transfers, with resection and grafting in two), ten judged their symptoms unchanged, nine
    slightly worse and four slightly better. A 2021 systematic review found that, of the 31
    conservatively managed patients with follow-up (median 11 months), most reported no
    neurological change and 29% worsened. A 2024 review of childhood cases records motor decline,
    by its own classification of their follow-up, in 13 of the 16 unoperated children with
    follow-up, 11 of the 16 being children of the longitudinal series. In a series of 18 patients
    with the plexal form, six of the seven managed without surgery who had follow-up progressed.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore prospective clinical follow-up examination in 12 patients over 3.5 years
      demonstrated very mild slow progression of motor and sensory deficits.
    explanation: >-
      Prospective follow-up of 12 patients.

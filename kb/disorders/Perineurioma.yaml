diagnosis:
- name: Targeted fascicular nerve biopsy
  diagnosis_term:
    preferred_term: targeted fascicular nerve biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  description: >-
    For the intraneural form, a biopsy of an enlarged fascicle found on imaging gives the diagnosis.
    The longitudinal series calls it the only definitive method for telling these focal neuropathies
    apart, and a later series did it in nine patients without neurological worsening; another
    derived clinical and MRI criteria that, when all are met, make the biopsy unnecessary.
    In the longitudinal series 30 of 32 patients had a targeted fascicular biopsy and two a
    whole-nerve biopsy; the biopsy was aimed at the MRI abnormality except in the three patients
    with normal imaging, where EMG localisation guided it. The series describes the technique as a
    focused biopsy that can minimise scarring and reduce surgical deficit, reports relatively little
    surgical morbidity and a high diagnostic yield without figures for either (on our reading it
    attributes no worsening to a biopsy, one patient reporting worsening weakness after a subtotal
    nerve resection, and it included only patients whose biopsy was diagnostic, so its counts cannot
    measure yield), and in 2009 advised a targeted biopsy for most patients at a centre with
    expertise in peripheral nerve care, with clinical and imaging follow-up as an option where the
    lesion is hard to reach. The 2026 FDG PET series notes that a classic clinical and MRI picture
    often allows the diagnosis without biopsy, which may then be reserved for uncertain cases.
  notes: >-
    The 2026 PET series shares an author with the longitudinal series, and the diagnostic-criteria
    study two, so they are not independent of it.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At this time, fascicular nerve biopsy is the only definitive method for differentiating these
      focal mononeuropathies.
    explanation: >-
      The longitudinal series' view.
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic targeted fascicular biopsy was performed in nine patients without postoperative
      neurological worsening, supporting the safety of the procedure when histological confirmation
      is required.
    explanation: >-
      Safety of the biopsy in nine patients.

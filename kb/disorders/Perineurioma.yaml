differential_diagnoses:
- name: Focal demyelinating and onion-bulb neuropathies
  description: >-
    For the intraneural form. Before epithelial membrane antigen (EMA) staining, focal onion bulbs
    of Schwann cell origin and the intraneural tumour were often lumped together as localized
    hypertrophic neuropathy, and the tumour may be confused with reactive or demyelinating processes
    and with inherited polyneuropathies (Charcot-Marie-Tooth disease, Dejerine-Sottas disease). The
    longitudinal series names the distinction from chronic demyelinating mononeuropathy or focal
    chronic inflammatory demyelinating polyneuropathy (CIDP) as often the most important.
  distinguishing_features:
  - The tumour's whorls (pseudo-onion bulbs) stain for EMA; the onion bulbs of demyelinating
    neuropathies stain for the Schwann cell marker S-100.
  - Perineurial and Schwann cells can be told apart only by electron microscopy and
    immunohistochemistry, as a systematic review states in its background.
  - Cerebrospinal fluid protein is almost always normal (borderline raised in 2 of 11 patients
    examined); in CIDP it is usually raised.
  - The enlarged nerve segment enhances avidly with gadolinium (20 of 20 patients given contrast),
    which CIDP does not usually show.
  - In 2009 the longitudinal series called fascicular nerve biopsy the only definitive way to tell
    these focal mononeuropathies apart; a 2026 series of histologically confirmed cases supports an
    imaging-first pathway in typical presentations, with biopsy reserved for atypical ones, but it
    did not test that pathway against demyelinating neuropathies.
  notes: >-
    The row groups several neuropathies, so it carries no disease_term. The sources also name,
    without contrasting features, hereditary neuropathy with liability to pressure palsies,
    leprosy, multifocal motor neuropathy and entrapment syndromes (the 2026 series), and, as other
    differentials of the intraneural form, angiomyofibroma, injury neuroma, sarcoidosis, leukaemia
    and lymphoma (the longitudinal series, whose laboratory tests in 22 patients, including PMP22
    deletion analysis for hereditary neuropathy with liability to pressure palsies, were
    unremarkable); they are not recorded as rows. The entry's diagnosis section records clinical
    and MRI criteria that, when all are met, make biopsy unnecessary.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early on patients with focal onion bulbs (of Schwann cell origin) and IN perineurioma (of
      perineurial origin) were often lumped together and their diagnosis called localized
      hypertrophic neuropathy, leading to confusion as to what constituted IN perineurioma.
    explanation: >-
      The longitudinal series' account of how the two were once lumped together.
  - reference: PMID:17824794
    reference_title: >-
      Intraneural perineurioma: a systematic review with illustrative cases.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intraneural perineurioma may be confused with other "onion bulb" Schwann cell entities
      (localized hypertrophic neuropathy, reactive/demyelinating processes, or inherited
      polyneuropathies of Charcot-Marie-Tooth/Dejerine Sottas) due to similar clinical, radiologic,
      and histologic features.
    explanation: >-
      A systematic review names the onion-bulb Schwann cell entities the tumour may be confused
      with.
  - reference: PMID:17824794
    reference_title: >-
      Intraneural perineurioma: a systematic review with illustrative cases.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perineurial and Schwann cells can only be differentiated by ultrastructure and
      immunohistochemsitry.
    explanation: >-
      The review's point that only electron microscopy and immunohistochemistry tell the two cell
      types apart (the misspelling is the source's).
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT

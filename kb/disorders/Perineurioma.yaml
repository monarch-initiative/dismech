- name: T2 hyperintensity
  modality: MRI
  imaging_finding_term:
    preferred_term: hyperintensity of the enlarged nerve on T2-weighted images
    term:
      id: NCIT:C182328
      label: Hyperintensity
  description: >-
    For the intraneural form. The enlarged segment is hyperintense on T2-weighted images, in some
    patients only mildly, and usually isointense on T1-weighted images. In the longitudinal series
    it was hyperintense on T2 in 25 of 32 patients (25 of the 27 with a T2 reading in its table) and
    isointense on T1 in 27; in the 2026 series it was hyperintense on T2 in nine of ten and
    isointense on T1 in all. The 2018 series describes its five fusiform tumours as hypo- to
    isointense on T1 and hyperintense on T2, and in its text gives no signal for the other 16,
    though a figure it cites for the non-specific enlargements, captioned as the typical aspect,
    shows T2 hyperintensity in a brachial plexus lesion. Peripheral nerve amyloidosis may also show
    T2 hyperintensity, according to the 2026 PET series.

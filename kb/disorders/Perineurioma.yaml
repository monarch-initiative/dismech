progression:
- phase: Course of the intraneural form
  subtype: Intraneural
  description: >-
    Static or slowly progressive over years. In the longitudinal series, 12 patients followed for
    3.5 years showed very mild, slow progression of motor and sensory deficits, and in none did
    the tumour spread to nerves not involved at first; the median Neuropathy Impairment Score rose
    from 12.6 to 15.4 points, not a significant change, and follow-up MRI was unchanged in 11
    patients. On a symptom questionnaire (15 responses, five of them given at the first visit
    against an earlier date) patients judged their symptoms, weakness and sensation mildly worse,
    and at telephone follow-up of 23 patients, seven of whom had had further surgery (tendon
    transfers, with resection and grafting in two), ten judged their symptoms unchanged, nine
    slightly worse and four slightly better. A 2021 systematic review found that, of the 31
    conservatively managed patients with follow-up (median 11 months), most reported no
    neurological change and 29% worsened. A 2024 review of childhood cases records motor decline,
    by its own classification of their follow-up, in 13 of the 16 unoperated children with
    follow-up, 11 of the 16 being children of the longitudinal series. In a series of 18 patients
    with the plexal form, six of the seven managed without surgery who had follow-up progressed.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore prospective clinical follow-up examination in 12 patients over 3.5 years
      demonstrated very mild slow progression of motor and sensory deficits.
    explanation: >-
      Prospective follow-up of 12 patients.
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also none of these patients had the tumour spread to nerves not initially involved.
    explanation: >-
      No spread to other nerves.
  - reference: PMID:34284162
    reference_title: >-
      Clinical Features, Natural History, and Outcomes of Intraneural Perineuriomas: A Systematic
      Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those managed conservatively with available follow-up (n = 31), median follow-up was 11
      months, and most (67.7%, n = 21) reported no change in neurologic status, although worsening
      was noted in 29.0% (9/31).
    explanation: >-
      The course without surgery across the review's cases.
  - reference: PMID:36596935
    reference_title: >-
      Plexal intraneural perineurioma: an analysis of the clinicoradiologic presentation of this
      rare variant.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of patients managed nonoperatively, 87% of patients (6/7) with follow-up information
      demonstrated disease progression with worsening motor function or sensory loss, and 2 patients
      demonstrated progression on imaging at most recent follow-up.
    explanation: >-
      Progression in the plexal form, from a series of 18.
  - reference: PMID:38434310
    reference_title: >-
      Treatment of childhood intraneural perineurioma: A case report and literature review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen out of 28 patients without surgery were followed up for 50.56 ± 51.51 months (ranged
      from 8 months to 14 years). Motor function in three out of these patients was stable and
      declined in 13 patients.
    explanation: >-
      Decline without surgery in 13 of 16 children, by the review's own classification of their
      follow-up, across its cases. By a count of the review's patient table, 11 of the 16 are
      children of the longitudinal series.
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median Neuropathy Impairment Score had changed from 12.6 to 15.4 points (P = 0.19).

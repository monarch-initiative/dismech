- name: Magnetic resonance imaging of the nerve
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the affected nerve
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Shows an enlargement of the affected nerve, usually fusiform, hyperintense on T2-weighted images
    and enhancing with gadolinium; the imaging findings give the frequencies. With age 40 or under,
    no cancer history and a single lesion, these features make up a set of diagnostic criteria for
    the intraneural form, which require a fusiform shape, moderate to severe T2 hyperintensity and
    moderate to severe, homogeneous enhancement. The longitudinal series suggests the MRI picture is
    very stereotypical, and the 2026 series, from ten histologically confirmed cases, says the triad
    of fusiform enlargement, T2 hyperintensity and homogeneous enhancement strongly supports the
    diagnosis and may obviate biopsy in typical cases. In the study that derived the criteria, of
    195 patients with a diagnostic targeted fascicular biopsy, 51 of them with intraneural
    perineurioma, the criteria had a specificity and positive predictive value of 1.0, apparently in
    the cohort from which they were derived, the abstract describing no separate validation; only
    biopsies that gave a diagnosis were included, and the abstract gives no sensitivity for the
    criteria. Field strength and coverage matter. In the longitudinal series 3 of 32 MRIs were
    reported normal, all of them older studies no longer available for review, which the authors
    suspect modern MRI would have shown to be abnormal; many patients with reportedly normal outside
    imaging had abnormalities on the series' own examination, and one patient's subtle lesion was
    missed at 1.5 T but seen at 3.0 T by a peripheral nerve radiologist. The series calls for 3.0 T
    MRI with dedicated coils and a skilled peripheral nerve radiologist, and a 2015 review from
    experience recommends high-resolution 3-T MRI with gadolinium, adding that unfamiliarity with
    the tumour and conventional MRI, typically done as a screening test over a large field of view
    and without contrast, contribute to its going undiagnosed, and that when the lesion is not found
    despite high suspicion the electrophysiological localisation, area imaged, resolution and slice
    thickness should be checked. The 2026 series imaged its ten patients at 1.5 T or 3.0 T, without
    saying how many at each, and found a fusiform, enhancing enlargement in all. A 2018 series of
    19, diagnosed by MRI and/or biopsy, says that, on our reading, diagnosis from a typical clinical
    presentation with MRI and nerve conduction studies was of little help in its patients, because
    most showed a non-specific enlargement (it reports no nerve conduction results), though its
    conclusion still advises suspecting the tumour in a slowly progressive motor deficit with a
    focal T2-hyperintense lesion.
  notes: >-
    The 2015 review and the diagnostic-criteria study share authors with the longitudinal series, so
    they are not independent of it.

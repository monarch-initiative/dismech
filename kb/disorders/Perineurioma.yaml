treatments:
- name: Observation
  treatment_term:
    preferred_term: observation
    term:
      id: NCIT:C25598
      label: Observation Activity
  description: >-
    For the intraneural form. The longitudinal series advises against routine resection, since the
    tumour is static or slowly progressive and stays in its first distribution, and in a 2021
    systematic review most patients were managed conservatively. A later series questions whether
    observation alone is enough.
  notes: >-
    NCIT:C15722 Patient Observation fits the action more closely, but its parents, Surveillance
    (NCIT:C15719) and Healthcare Activity (NCIT:C16205), are not under Clinical Intervention or
    Procedure (NCIT:C25218), so the treatment-action enum rejects it; Observation Activity is used
    instead, as in other entries.
  evidence:
  - reference: PMID:19567701
    reference_title: >-
      Longitudinal study of intraneural perineurioma--a benign, focal hypertrophic neuropathy of
      youth.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As these tumours are static or slowly progressive, remain confined to their original
      distribution and have low morbidity, they probably should not be resected routinely.
    explanation: >-
      The longitudinal series' advice.
  - reference: PMID:34284162
    reference_title: >-
      Clinical Features, Natural History, and Outcomes of Intraneural Perineuriomas: A Systematic
      Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients were managed conservatively (52.9%; 72/136).
    explanation: >-
      Conservative management in most of the review's patients.
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings question the adequacy of observation alone and underscore the need for early
      recognition and risk stratification to prevent irreversible motor loss.
    explanation: >-
      The later series' doubt, which cuts against observation alone.
- name: Tendon transfer
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tendon transfer
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  description: >-
    Used to restore movement lost in the affected nerve's territory, with mixed results; in the
    plexal form, two of the four patients with a known outcome had a failed transfer as the
    neuropathy spread to the donor muscles.
  notes: >-
    NCIT has no tendon-transfer term. NCIT:C158009 Therapeutic Tendon Procedure is defined as
    treating a condition of the tendons, so Reconstructive Surgery, the surgical restoration of
    function, is used; the later series calls the transfer a reconstructive strategy.
  evidence:
  - reference: PMID:41657107
    reference_title: >-
      The PERISCOPE Cohort: A Retrospective Study of Clinicopathological and TRAF7 Genetic Findings
      in Intraneural Perineurioma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tendon transfer was performed in 7/10 patients as a reconstructive strategy to improve motor
      function, resulting in heterogeneous functional outcomes.
    explanation: >-
      Mixed results in seven patients.
  - reference: PMID:36596935
    reference_title: >-
      Plexal intraneural perineurioma: an analysis of the clinicoradiologic presentation of this
      rare variant.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients underwent tendon transfer, of which two had failure of tendon transfer at most
      recent follow-up (50%, 2/4) due to progression of neurologic loss affecting the donors.
    explanation: >-
      Failure in two of four patients of the plexal form, which cuts against the transfer there.
- name: Surgical excision
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15232
      label: Excision
  description: >-
    The treatment of the soft tissue form and its variants; in the 81-case series, of the tumours
    whose margins were known about half were widely excised, and 2 of the 43 patients with follow-up
    had a recurrence. None of the seven sclerosing tumours followed up recurred.
  target_mechanisms:
  - target: Soft Tissue Perineurial Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Excision removes the tumour.
    evidence:
    - reference: PMID:15958848
      reference_title: >-
        Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with
        atypical histologic features.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical follow-up was available for 43 patients (mean, 41 months; range, 6-146 months).
        Among tumors for which the status of surgical margins was known, 52% were widely excised,
        31% were marginally excised, and 18% had positive margins. Only two tumors recurred locally
        (one of which was atypical): one recurred 10 years following primary excision; and one
        recurred twice, 5 and 9 years following excision.
      explanation: >-
        Two recurrences among the 43 patients with follow-up. INDIRECT: an outcome of the treatment,
        cited for the tissue it removes.
  evidence:
  - reference: PMID:15958848
    reference_title: >-
      Soft tissue perineurioma: clinicopathologic analysis of 81 cases including those with atypical
      histologic features.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among tumors for which the status of surgical margins was known, 52% were widely excised, 31%
      were marginally excised, and 18% had positive margins.
    explanation: >-
      The extent of excision in the 81-case series.
  - reference: PMID:9414186
    reference_title: >-
      Sclerosing perineurioma: a clinicopathologic study of 19 cases of a distinctive soft tissue
      lesion with a predilection for the fingers and palms of young adults.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the lesions were locally excised. Follow-up was obtained for seven patients, with mean
      and median follow-up intervals of 12 years 7 months and 10 years 6 months, respectively. None
      of the lesions have recurred.
    explanation: >-
      Local excision of all 19 sclerosing tumours; none of the seven followed up recurred.
notes: >-
  The two main forms are recorded as two chains, each starting from its own somatic lesion in the
  perineurial cell: TRAF7 in the intraneural form, NF2 in some soft tissue tumours (recorded as
  somatic by inference). Pain is not linked to a mechanism node, because no cited source establishes
  how the tumour produces it; the later intraneural series names possible mechanisms without showing
  them. MONDO places the reticular and sclerosing variants under extraneural perineurioma.

  description: >-
    Grows within a peripheral nerve and stays inside its boundaries, as whorls of perineurial cells
    around the nerve fibres. It presents insidiously in children and young adults as a
    motor-predominant neuropathy, most often of the sciatic nerve or its branches.
  evidence:

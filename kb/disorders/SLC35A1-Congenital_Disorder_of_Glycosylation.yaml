biochemical:
- name: Serum transferrin glycoform analysis
  presence: PRESENT
  notes: >-
    Isoelectric focusing, capillary zone electrophoresis or high-resolution intact-transferrin
    mass spectrometry. A type II pattern indicates a Golgi processing defect and directs the
    workup to the CDG-II subtypes; mass spectrometry can distinguish SLC35A1-CDG among them.
  readouts:
  - target: Global Hyposialylation of Glycoconjugates
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    interpretation: >-
      Transferrin is a serum glycoprotein whose sialylation state is directly readable, so
      its glycoform profile is a systemic readout of the hyposialylation node.
    evidence:
    - reference: PMID:26307094
      reference_title: High-resolution mass spectrometry glycoprofiling of intact transferrin for diagnosis and subtype identification in the congenital disorders of glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Moreover, in the group of Golgi trafficking defects and unsolved CDG-II patients, distinct profiles were observed, which facilitate identification of the specific CDG subtype."
      explanation: >-
        Establishes that the transferrin glycoform profile resolves Golgi glycosylation
        defects into subtype-specific patterns, which is what makes it a readout of the
        hyposialylation node rather than only a screen.
- name: Sialyl-Lewis-x on polymorphonuclear cells
  presence: ABSENT
  notes: >-
    Complete absence of the sialyl-Lewis-x antigen on polymorphonuclear cells is the
    distinctive biochemical finding in the index patient, and was what led to identification
    of the disorder. The three-patient comparison table in PMID:28856833 carries no row for
    it, so nothing is known about whether it is present in the two later patients.
  readouts:
  - target: Loss of Leukocyte Sialyl-Lewis-x
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    interpretation: >-
      Flow-cytometric detection of the antigen on polymorphonuclear cells is the direct
      measurement of the node it points at.
    evidence:
    - reference: PMID:27387429
      reference_title: "A functional splice variant of the human Golgi CMP-sialic acid transporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "complete lack of the sialyl-Lex antigen (NeuAcalpha2-3Galbeta1-4(Fucalpha1-3)GlcNAc-R) on polymorphonuclear cells"
      explanation: >-
        The measurement in the index patient, on the cell type the node names. Cited to the
        2016 paper's introduction, which restates the authors' own 2005 finding as a clinical
        observation. The 2005 abstract mentions the patient's sialyl-Lewis-x deficiency only
        inside the sentence describing the Lec2 complementation experiment, so quoting it
        there would grade a human observation as the in vitro assay it was a premise of.
animal_models:
- name: Platelet and megakaryocyte-specific Slc35a1 conditional knockout mouse
  species: Mouse
  genotype: Plt Slc35a1 conditional knockout (Slc35a1 floxed, megakaryocyte/platelet-restricted deletion)
  publication: PMID:32303557
  description: >-
    A conditional knockout with sialylation reduced specifically in megakaryocytes and
    platelets. Its major phenotype is thrombocytopenia, produced by both reduced and
    immature bone marrow megakaryocytes and increased hepatic clearance of desialylated
    platelets.
  modeled_mechanisms:
  - target: Impaired Megakaryocytopoiesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the production arm of the thrombocytopenia directly, in the cell type the
      node names.
    limitations: >-
      The deletion is restricted to the megakaryocyte and platelet lineage, so the model
      tests the consequence of hyposialylation in those cells rather than the systemic
      transporter deficiency the human disease has.
    readouts:
    - name: Bone marrow megakaryocyte number and maturation
      target: Impaired Megakaryocytopoiesis
      direction: DECREASED
      interpretation: Direct histological measurement of the production defect.
      evidence:
      - reference: PMID:32303557
        reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "megakaryocyte maturation was also impaired"
        explanation: Reports the maturation defect this readout measures.
    evidence:
    - reference: PMID:32303557
      reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The major phenotype of Plt Slc35a1–/– mice was thrombocytopenia."
      explanation: >-
        Names the model's principal phenotype, establishing it as informative for the
        thrombocytopenia mechanism this link points at.
  - target: Platelet Desialylation and Hepatic Clearance
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Reproduces the clearance arm, identifying hepatic Kupffer cells as the clearing population.
    limitations: >-
      The clearing cell identified here is the Kupffer cell. The hepatocyte Ashwell-Morell
      route invoked for desialylated platelets generally is not tested by this model, so the
      two routes are not distinguished for this disease.
    evidence:
    - reference: PMID:32303557
      reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "an increased number of desialylated platelets was cleared by Küpffer cells in the liver"
      explanation: >-
        Reports the hepatic clearance this link claims the model recapitulates, with the
        clearing cell type named.
  - target: Deficient Brain Sialoglycan Synthesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The model cannot address the neurological branch at all, because the deletion is
      restricted to the megakaryocyte and platelet lineage.
    limitations: >-
      Deletion is confined to megakaryocytes and platelets, so neurons retain normal
      sialylation and no brain sialoglycan deficiency is produced. No animal or cellular
      model reproducing the encephalopathy of SLC35A1-CDG has been reported, which is the
      main gap in the mechanistic evidence for the neurological branch.
    evidence:
    - reference: PMID:32303557
      reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "using a mouse line with significantly reduced sialylation in megakaryocytes and platelets"
      explanation: >-
        States the tissue restriction that makes this model structurally unable to address
        the neurological branch. The negative claim rests on the model's design, not on a
        negative neurological result, which was never sought.
treatments:
- name: Supportive Management
  description: >-
    No targeted or curative therapy exists. Management is symptomatic: transfusion and
    bleeding precautions for thrombocytopenia, infection prophylaxis and treatment,
    anti-seizure medication, and developmental therapies.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded without an evidence item quoting a treatment study, because none exists. The
    supportive-care approach is what the reports describe rather than what any trial has
    tested, and no snippet in the cited literature asserts it as a finding.
- name: Sialidase Inhibition
  description: >-
    A candidate strategy, not a treatment. Because the thrombocytopenia is driven in part by
    clearance of desialylated platelets, inhibiting the sialidase that strips the sialic acid
    is mechanistically rational. Sialidase inhibitors improved antibody-mediated
    thrombocytopenia in mice, but that was in immune thrombocytopenia, where the desialylation
    is enzymatic and reversible. In SLC35A1-CDG the platelets were never sialylated in the
    first place, so it is not obvious that blocking a sialidase would help. It has never been
    tested in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:26185093
    reference_title: Desialylation is a mechanism of Fc-independent platelet clearance and a therapeutic target in immune thrombocytopenia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "sialidase inhibitors ameliorate anti-GPIbα-mediated thrombocytopenia in mice"
    explanation: >-
      The only evidence for this strategy, and it is in a different disease. Marked INDIRECT:
      transferring it to SLC35A1-CDG requires assuming a sialidase-inhibition benefit in a
      disorder where the sialylation never happened, which is a substantial inferential step
      and the reason this is curated as a candidate rather than a treatment.
diagnosis:
- name: Transferrin glycoform screen followed by molecular confirmation
  description: >-
    Type II transferrin pattern on isoelectric focusing, capillary zone electrophoresis or
    intact-transferrin mass spectrometry, then biallelic SLC35A1 variants on exome, genome or
    a CDG panel. Complementation assay in CMP-sialic-acid-transport-deficient Lec2 cells can
    functionally confirm a novel variant, which is how the index alleles were established.
  evidence:
  - reference: PMID:15576474
    reference_title: "Genetic complementation reveals a novel human congenital disorder of glycosylation of type II, due to inactivation of the Golgi CMP-sialic acid transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These cells were used in complementation studies to test the activity of the 2 CMP-sialic acid transporter cDNA alleles of a patient devoid of sialyl-Le(x) expression on polymorphonuclear cells."
    explanation: Describes the functional confirmation assay available for novel variants.

name: SLC35A1-Congenital Disorder of Glycosylation
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- SLC35A1-CDG
- CDG-IIf
- CDG type IIf
- congenital disorder of glycosylation type 2F
- CMP-sialic acid transporter deficiency
description: >-
  SLC35A1-CDG is an autosomal recessive type II congenital disorder of glycosylation caused
  by biallelic loss of function of SLC35A1, the only known Golgi CMP-sialic acid transporter.
  The transporter imports the activated sialic acid donor CMP-Neu5Ac from the cytosol into
  the Golgi lumen, where sialyltransferases use it to cap N-glycans, O-glycans and
  glycolipids. When it fails, the cell makes globally hyposialylated glycoconjugates even
  though cytosolic sialic acid synthesis is intact.

  **The lesion is in delivery, not in supply, and that has a therapeutic consequence.**
  Several CDG subtypes respond to oral monosaccharide supplementation, because the missing
  sugar can be pushed in from the diet. Sialic acid supplementation cannot bypass an
  SLC35A1 defect: the cell already has sialic acid, and what has failed is the step that
  moves the activated donor across the Golgi membrane. This is why an otherwise analogous
  disorder has no dietary treatment.

  **One upstream lesion, two mechanistic branches, and they are not mutually exclusive.** The
  hyposialylation node branches into a hematologic arm (platelet desialylation and clearance,
  impaired megakaryocytopoiesis, loss of the leukocyte sialyl-Lewis-x ligand) and a
  neurological arm (deficient brain sialoglycans). The branch structure is mechanistic. It is
  *not* a claim that patients fall into two camps, and this entry previously made that
  mistake.

  Only three patients with proven SLC35A1-CDG are on record, and the published comparison of
  all three settles the point. Patient 1 (2005) is reported with macrothrombocytopenia and
  coagulopathy, with every neurological feature listed as *not reported* rather than absent.
  Patient 2 (2013) has both arms: intellectual disability, seizures, ataxia, microcephaly and
  hypotonia alongside macrothrombocytopenia and coagulopathy. Patient 3 (2017) has the
  neurological arm with explicitly no hematological abnormality. So one of three patients has
  both, one has one arm with the other unassessed, and one has a single arm.

  **No genotype-to-branch correlation survives those three patients.** Patient 2, who has
  both arms, is homozygous for a missense allele (p.Gln101His) with 50% residual transport -
  the mildest reported genotype and the broadest reported phenotype. An earlier version of
  this entry proposed that truncating alleles track with the hematologic picture and
  hypomorphic missense with the neurological one; Patient 2 refutes it, and no such
  correlation is asserted here.

  One missense allele has a second mechanism beyond reduced transport: p.Glu196Lys, but not
  p.Thr156Arg, disrupts the physical association between SLC35A1 and the sialyltransferase
  ST3Gal4. So the same gene produces sialylation failure by two routes, and one allele uses
  both.

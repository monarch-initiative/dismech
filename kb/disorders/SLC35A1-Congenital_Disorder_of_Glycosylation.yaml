name: SLC35A1-Congenital Disorder of Glycosylation
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- SLC35A1-CDG
- CDG-IIf
- CDG type IIf
- congenital disorder of glycosylation type 2F
- CMP-sialic acid transporter deficiency
description: >-
  SLC35A1-CDG is an autosomal recessive type II congenital disorder of glycosylation caused
  by biallelic loss of function of SLC35A1, the only known Golgi CMP-sialic acid transporter.
  The transporter imports the activated sialic acid donor CMP-Neu5Ac from the cytosol into
  the Golgi lumen, where sialyltransferases use it to cap N-glycans, O-glycans and
  glycolipids. When it fails, the cell makes globally hyposialylated glycoconjugates even
  though cytosolic sialic acid synthesis is intact.

  **The lesion is in delivery, not in supply, and that has a therapeutic consequence.**
  Several CDG subtypes respond to oral monosaccharide supplementation, because the missing
  sugar can be pushed in from the diet. Sialic acid supplementation cannot bypass an
  SLC35A1 defect: the cell already has sialic acid, and what has failed is the step that
  moves the activated donor across the Golgi membrane. This is why an otherwise analogous
  disorder has no dietary treatment.

  **One upstream lesion, two clinically distinct presentations.** The 2005 index patient had
  a hematologic picture, with macrothrombocytopenia, neutropenia and complete absence of the
  sialyl-Lewis-x leukocyte ligand. The third reported patient, in 2017, had a severe
  neurological presentation with *no* hematological abnormality at all. The two arms are
  curated here as separate downstream branches of the same hyposialylation node rather than
  as one blended phenotype, because no reported patient has had both.

  Genotype appears to track with which branch dominates: truncating biallelic alleles with
  the hematologic picture, hypomorphic missense alleles (p.Thr156Arg and p.Glu196Lys) with
  the neurological one. With fewer than ten reported patients worldwide that is a pattern
  across a handful of cases, not an established correlation, and it is recorded as such.

  One missense allele has a second mechanism beyond reduced transport: p.Glu196Lys, but not
  p.Thr156Arg, disrupts the physical association between SLC35A1 and the sialyltransferase
  ST3Gal4. So the same gene produces sialylation failure by two routes, and one allele uses
  both.

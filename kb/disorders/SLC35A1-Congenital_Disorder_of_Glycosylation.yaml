inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic SLC35A1 variants. The index patient was compound heterozygous for two
    truncating alleles; the third reported patient was compound heterozygous for two missense
    alleles. Heterozygous carriers are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:15576474
    reference_title: "Genetic complementation reveals a novel human congenital disorder of glycosylation of type II, due to inactivation of the Golgi CMP-sialic acid transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The inactivation of one patient allele by a double microdeletion inducing a premature stop codon at position 327 and a splice mutation of the other allele inducing a 130-base pair (bp) deletion and a premature stop codon at position 684 are proposed to be the causal defects of this disease."
    explanation: >-
      Documents the biallelic architecture in the index patient, with a distinct
      loss-of-function change on each allele.
genetic:
- name: SLC35A1
  gene_term:
    preferred_term: SLC35A1
    term:
      id: hgnc:11021
      label: SLC35A1
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the only known Golgi CMP-sialic acid transporter, a multipass nucleotide-sugar
    transporter of the SLC35 family. Reported disease alleles are either truncating
    (index patient) or hypomorphic missense (p.Thr156Arg, p.Glu196Lys). Structure-guided
    mutagenesis has mapped three substrate pockets in the central cavity, which is the
    framework in which missense alleles' effects on transport are interpreted.
  evidence:
  - reference: PMID:15576474
    reference_title: "Genetic complementation reveals a novel human congenital disorder of glycosylation of type II, due to inactivation of the Golgi CMP-sialic acid transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "No complementation was obtained with either of the 2 patient alleles, whereas full restoration of the sialylated phenotype was obtained in the Lec2 cells transfected with the corresponding human wild-type transcript."
    explanation: >-
      The complementation result that establishes causality: neither patient allele restores
      sialylation and the wild-type transcript does.
  - reference: PMID:34384782
    reference_title: A three-pocket model for substrate coordination and selectivity by the nucleotide sugar transporters SLC35A1 and SLC35A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that three pockets in the central cavity of each transporter provide substrate specificity."
    explanation: >-
      Gives the structural framework used to interpret where missense alleles sit and why
      they reduce rather than abolish transport.
pathophysiology:
- name: SLC35A1 Transporter Loss of Function
  description: >-
    Biallelic SLC35A1 variants leave the cell without a working Golgi CMP-sialic acid
    transporter. Truncating alleles abolish the protein; the reported missense alleles
    reduce transport rather than abolishing it, which is the likely reason their carriers
    present differently.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:

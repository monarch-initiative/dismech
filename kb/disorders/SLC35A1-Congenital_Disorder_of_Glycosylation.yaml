discussions:
- discussion_id: slc35a1_branch_expression_across_patients
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether an SLC35A1-CDG patient expresses the hematologic arm, the
    neurological arm, or both?
  attaches_to:
  - pathophysiology#Global Hyposialylation of Glycoconjugates
  rationale: >-
    Across the three proven patients the arms combine differently: the second has both, the
    third has the neurological arm with explicitly no hematological abnormality, and the
    index patient has the hematologic arm with every neurological feature recorded as *not
    reported* rather than absent. So one of the three data points is an ascertainment gap
    rather than a negative finding, which is a distinction the published comparison table
    makes explicitly and which matters for any attempt to read a pattern off three patients.
    Genotype does not explain the variation: the patient with both arms is homozygous for a
    missense allele retaining 50% of transport activity, which is the mildest reported
    genotype and the broadest reported phenotype.
  notes: >-
    Resolving this needs systematic assessment of both systems in every patient, not only the
    system that prompted referral. The index patient was found through a leukocyte adhesion
    workup and the third through exome sequencing for encephalopathy, and the published table
    shows how much of the resulting picture is "not reported".
- discussion_id: slc35a1_no_neurological_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the proposed ganglioside and polysialic-acid mechanism actually what produces the
    encephalopathy in SLC35A1-CDG, given that no model of the neurological branch exists?
  attaches_to:
  - pathophysiology#Deficient Brain Sialoglycan Synthesis
  - pathophysiology#Impaired Neuronal Connectivity and Excitability
  rationale: >-
    The hematologic branch has a conditional mouse that reproduces it. The neurological
    branch has no model at all: the existing mouse deletes Slc35a1 only in megakaryocytes and
    platelets, so it cannot develop a brain phenotype. Everything downstream of the
    hyposialylation node on the neurological side rests on what gangliosides and polysialic
    acid are known to do in other settings, plus the observation that a patient with reduced
    Golgi sialic acid transport had an encephalopathy. That is a plausible chain, but no step
    of it has been measured in an SLC35A1-deficient nervous system. Recorded as a
    human-model mismatch rather than a plain knowledge gap because the model-system evidence
    that does exist covers the other branch, and its success there could be mistaken for
    support of the entry as a whole.
  notes: >-
    A neuron-specific or whole-body conditional knockout, or patient-derived neurons, would
    test whether brain sialoglycan deficiency is sufficient for the phenotype.
notes: >-
  Curated from the primary SLC35A1 literature together with an OpenScientist deep-research
  report. Five notes on how the evidence here is graded, since most of it is weaker than a
  reader might assume from how confidently the mechanism reads.

  **The first version of this entry got its central framing wrong, and the correction is
  worth stating.** It claimed the hematologic and neurological presentations were mutually
  exclusive, and built the description, a discussion and two phenotype descriptions on that.
  The claim is refuted by the three-patient comparison table in PMID:28856833, a full text
  this entry already cited: the second patient has both arms, and the index patient's
  neurological features are recorded as *not reported* rather than absent. The branched
  pathograph is kept, because the branches are mechanistic and real, but nothing here now
  claims patients sort into two camps, and the genotype-to-branch correlation the first
  version proposed is contradicted by the patient with the mildest genotype and the broadest
  phenotype.

  **The neurological branch is inference throughout.** Both of its pathophysiology nodes
  carry `directness: INDIRECT` and `quote_role: REVIEW_SYNTHESIS` on their evidence, because
  the only sources are a review of brain sialoglycan biology. Nothing has been measured in an
  SLC35A1-deficient nervous system, and no model exists. See the `HUMAN_MODEL_MISMATCH`
  discussion.

  **The hepatocyte clearance step is borrowed from a different disease.** PMID:26185093
  establishes Ashwell-Morell-mediated clearance of desialylated platelets in immune
  thrombocytopenia, where a sialidase strips sialic acid from platelets that had it. In
  SLC35A1-CDG the platelets were never sialylated. The mechanism is likely the same and the
  item is graded `SUPPORT` with `directness: INDIRECT` to say that explicitly.

  **Three items are `quote_role: BACKGROUND`.** PMID:27387429 is a 2016 paper on a splice
  variant of the transporter, but the sentence quoted for the index patient's clinical
  picture is its introduction restating the authors' own 2005 report. `evidence_source`
  stays `HUMAN_CLINICAL` because the evidence the sentence describes is a human clinical
  observation; `quote_role` records that this is not the paper that produced it.

  **Every snippet is the source's own characters.** Several of these abstracts carry
  non-ASCII characters inside the sentences that matter - an umlaut in "Küpffer", Greek
  letters in the sialyltransferase linkage and the platelet glycoprotein names, en dashes in
  the mouse genotype - and the reference validator normalises all of them, so the quotes are
  verbatim rather than truncated or transliterated. This was checked against the cache
  rather than assumed.

  No GeneReviews chapter exists for SLC35A1-CDG. The CDG overview chapter that PubMed
  returns (PMID:20301507) is marked RETIRED, FOR HISTORICAL REFERENCE ONLY, so it is not
  used as a phenotype baseline.

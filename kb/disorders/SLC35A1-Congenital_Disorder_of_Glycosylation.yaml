      explanation: >-
        Measures the transport step itself in patient material, which is the edge from the
        genetic lesion to donor depletion rather than either node alone.
  evidence:
  - reference: PMID:15576474
    reference_title: "Genetic complementation reveals a novel human congenital disorder of glycosylation of type II, due to inactivation of the Golgi CMP-sialic acid transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that this defect is a new type of congenital disorder of glycosylation (CDG) of type IIf affecting the transport of CMP-sialic acid into the Golgi apparatus."
    explanation: The original identification of the transporter defect as the disease lesion.
- name: Golgi CMP-Sialic Acid Donor Depletion
  description: >-
    The Golgi lumen is deprived of CMP-Neu5Ac, the activated donor every sialyltransferase
    requires. Cytosolic sialic acid synthesis is unaffected, so the cell is not short of
    sialic acid; it is short of sialic acid in the compartment where it is used. That
    distinction is what makes dietary sialic acid an ineffective strategy here.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  downstream:
  - target: Global Hyposialylation of Glycoconjugates
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32303557
    reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Slc35a1 encodes the cytidine-5'-monophosphate (CMP)-sialic acid transporter that transports CMP-sialic acid from the cytoplasm into the Golgi apparatus for sialylation."
    explanation: >-
      States the transported species and its destination compartment, which is what this node
      claims is depleted. Marked BACKGROUND because the sentence is the mouse study's framing
      of established biochemistry rather than one of its own results.
- name: Global Hyposialylation of Glycoconjugates
  description: >-
    Without the donor, sialyltransferases cannot cap glycans, and N-glycans, O-glycans and
    glycolipids across the cell are left without their terminal sialic acid. The p.Glu196Lys
    allele adds a second route to the same endpoint by decoupling the transporter from the
    sialyltransferase ST3Gal4.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: sialylation
    term:
      id: GO:0097503
      label: sialylation
    modifier: DECREASED
  downstream:
  - target: Platelet Desialylation and Hepatic Clearance
    causal_link_type: DIRECT
  - target: Impaired Megakaryocytopoiesis
    causal_link_type: DIRECT
  - target: Loss of Leukocyte Sialyl-Lewis-x
    causal_link_type: DIRECT
  - target: Deficient Brain Sialoglycan Synthesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28856833
    reference_title: "Encephalopathy caused by novel mutations in the CMP-sialic acid transporter, SLC35A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient primary fibroblasts and serum showed a considerable decrease in the amount of N- and O-glycans terminating in sialic acid."
    explanation: Direct measurement of the hyposialylation in patient material, across both glycan classes.
  - reference: PMID:36257191
    reference_title: An interaction between SLC35A1 and ST3Gal4 is differentially affected by CDG-causing mutations in the SLC35A1 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed that SLC35A1 associates with ST3Gal4, the main α2,3-sialyltransferase acting on N-glycans. This phenomenon is compromised by the E196K (but not T156R) mutation in the SLC35A1 gene."
    explanation: >-
      Establishes the second, allele-specific route to hyposialylation, and the contrast with
      the other missense allele that makes it allele-specific rather than general.
- name: Platelet Desialylation and Hepatic Clearance
  description: >-
    Loss of terminal sialic acid on platelet surface glycoproteins exposes the subterminal
    galactose that hepatic clearance receptors recognise, so circulating platelets are
    removed by the liver. In the conditional mouse the clearing cells are hepatic Kupffer
    cells. The hepatocyte Ashwell-Morell receptor route is established for desialylated
    platelets in immune thrombocytopenia and is the mechanism generally invoked here; it has
    not been shown directly in SLC35A1-CDG, so the evidence for that step is marked indirect.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: Kupffer cell
    term:
      id: CL:0000091
      label: Kupffer cell
  evidence:
  - reference: PMID:32303557
    reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, an increased number of desialylated platelets was cleared by Küpffer cells in the liver of Plt Slc35a1–/– mice."
    explanation: >-
      Demonstrates hepatic clearance of desialylated platelets in the Slc35a1 conditional
      knockout, and names Kupffer cells as the clearing population. This is the animal
      evidence for the clearance arm of this node.
  - reference: PMID:26185093
    reference_title: Desialylation is a mechanism of Fc-independent platelet clearance and a therapeutic target in immune thrombocytopenia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "This leads to platelet clearance in the liver via hepatocyte Ashwell-Morell receptors, which is fundamentally different from the classical Fc-FcγR-dependent macrophage phagocytosis."
    explanation: >-
      Establishes the desialylation-to-hepatic-clearance mechanism, but in immune
      thrombocytopenia rather than in SLC35A1-CDG. Marked INDIRECT because applying it here
      requires the inference that platelets desialylated by a transporter defect are cleared
      the same way as platelets desialylated by antibody-triggered sialidase translocation.
- name: Impaired Megakaryocytopoiesis
  description: >-
    Hyposialylation also acts upstream of the circulating platelet, on its production. The
    conditional mouse shows both fewer bone marrow megakaryocytes and impaired maturation of
    the ones present, so the thrombocytopenia is a production defect as well as a clearance
    defect.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:32303557
    reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis and excessive platelet clearance in the liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "megakaryocyte maturation was also impaired"
    explanation: >-
      The production arm of the thrombocytopenia mechanism, distinct from the clearance arm
      recorded on the neighbouring node.
- name: Loss of Leukocyte Sialyl-Lewis-x
  description: >-
    Sialyl-Lewis-x is the selectin ligand that lets leukocytes roll on and adhere to
    activated endothelium, and its terminal sialic acid is not optional: without
    sialylation the ligand is not made. Its complete absence on polymorphonuclear cells was
    the finding that identified the index patient, and it makes the infection susceptibility
    an adhesion defect on top of the neutropenia rather than a consequence of low counts
    alone.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:27387429
    reference_title: A functional splice variant of the human Golgi CMP-sialic acid transporter.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "characterized by macrothrombocytopenia, neutropenia and complete lack of the sialyl-Lex antigen"
    explanation: >-
      Records the complete absence of the sialyl-Lewis-x antigen on polymorphonuclear cells.
      Marked BACKGROUND because the sentence is this 2016 paper's recapitulation of the
      authors' own 2005 clinical report, not a result of the splice-variant work it reports.
- name: Deficient Brain Sialoglycan Synthesis
  description: >-
    The brain's two major sialoglycan families, gangliosides and polysialic acid on NCAM,
    both require the same Golgi donor. Their deficiency is the proposed basis of the
    neurological branch. This step is an inference from what these glycans are known to
    require and to do, not a measurement made in an SLC35A1-CDG brain, and no model
    reproducing the encephalopathy has been reported.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ganglioside biosynthetic process
    term:
      id: GO:0001574
      label: ganglioside biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Impaired Neuronal Connectivity and Excitability
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24692354
    reference_title: "Sialic acids in the brain: gangliosides and polysialic acid in nervous system development, stability, disease, and regeneration."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the brain, two families of sialoglycans are of particular interest: gangliosides and polysialic acid."
    explanation: >-
      Identifies the two brain sialoglycan families whose synthesis this node claims is
      deficient. Marked INDIRECT and REVIEW_SYNTHESIS: it is a review establishing what these
      glycans are, from which the deficiency in a sialylation-donor defect follows by
      inference rather than by measurement in this disease.
- name: Impaired Neuronal Connectivity and Excitability
  description: >-
    Ganglioside deficiency is linked to disturbed axon-myelin interactions, axon stability
    and nerve cell excitability; polysialic acid deficiency to disturbed neurite outgrowth
    and synaptic connectivity. Together these are the proposed substrate of the
    developmental delay, hypotonia, seizures and encephalopathy seen in the neurological
    presentation.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:24692354
    reference_title: "Sialic acids in the brain: gangliosides and polysialic acid in nervous system development, stability, disease, and regeneration."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mouse genetic studies and human disorders of ganglioside metabolism implicate gangliosides in axon-myelin interactions, axon stability, axon regeneration, and the modulation of nerve cell excitability."
    explanation: >-
      States what ganglioside deficiency does to neurons, from mouse genetics and other human
      ganglioside disorders. Marked INDIRECT because the inference to this disease's
      encephalopathy is a step the source does not take.

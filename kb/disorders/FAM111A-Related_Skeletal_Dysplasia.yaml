discussions:
- discussion_id: fam111a_protease_to_pth
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Parathyroid Hormone Production and Calcium Homeostasis
  prompt: >-
    How does an over-active FAM111A protease impair parathyroid hormone
    production and bone modelling? What are the physiological substrates?
  rationale: >-
    The gain-of-function is now quantified and the phenotype is well described,
    but the two ends are not connected. FAM111A's native function is stated as
    unknown in the discovery paper, the disease residues sit away from the
    catalytic site, and no published work identifies a substrate whose excess
    cleavage would produce hypoparathyroidism or cortical thickening. Everything
    between the variant and the clinical picture is currently a gap.

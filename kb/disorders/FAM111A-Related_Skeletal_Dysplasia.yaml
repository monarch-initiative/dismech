animal_models:
- name: Fam111a knockout mouse (Fam111a-/- C57BL/6N)
  species: Mouse
  genotype: Fam111a-/- (constitutive knockout), C57BL/6N
  publication: PMID:35715480
  description: >-
    The first and so far only in vivo characterization of FAM111A, and a
    comprehensively negative one: knockout mice have normal weight, normal
    serum PTH, normal serum and 24-hour urinary magnesium, calcium and
    phosphate, normal expression of the calciotropic, magnesiotropic and
    phosphotropic transport genes in kidney, duodenum and colon, normal femoral
    bone morphology and density, and normal kidney and parathyroid histology.


    This is a model of the wrong lesion, and its negative result is the point.
    Human disease alleles are hypermorphic missense variants that make FAM111A
    more active, so deleting the gene is not a milder version of the disease -
    it is the opposite manipulation. The absence of any phenotype in the null
    is therefore consistent with, rather than contrary to, a gain-of-function
    mechanism, and it means that no animal model of KCS2 or OCS currently
    exists.
  modeled_mechanisms:
  - target: Impaired Parathyroid Hormone Production and Calcium Homeostasis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The defining endocrine phenotype of the human disease is entirely absent:
      serum PTH, calcium, phosphate and magnesium are all unaltered, and
      parathyroid histology is normal.
    limitations: >-
      A constitutive null models loss of function, whereas human KCS2 and OCS
      are caused by hypermorphic missense alleles - so the model tests the
      wrong direction of effect and cannot bear on whether excess FAM111A
      protease activity damages the parathyroid. The authors additionally note
      the animals were on a standard diet, leaving open whether a challenge
      would unmask a phenotype.
    readouts:
    - name: Serum PTH, calcium, phosphate and magnesium
      target: Impaired Parathyroid Hormone Production and Calcium Homeostasis
      direction: UNCHANGED
      interpretation: >-
        A genuine negative result - the electrolyte and PTH abnormalities that
        define the human disease do not occur when Fam111a is deleted.
      evidence:
      - reference: PMID:35715480
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "Fam111a-/- mice displayed normal weight and serum parathyroid hormone (PTH) concentration and exhibited unaltered magnesium, calcium and phosphate levels in serum and 24-hour urine."
        explanation: >-
          The measurement itself, reported as unchanged.
    evidence:
    - reference: PMID:35715480
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, our study is the first to characterise the function of FAM111A in vivo and we report that mice lacking FAM111A exhibit normal electrolyte homeostasis on a standard diet."
      explanation: >-
        The authors' own summary: loss of Fam111a does not disturb electrolyte
        homeostasis, so this model is not informative for the human
        hypoparathyroidism node.
  - target: Impaired Skeletal Development and Cortical Modelling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Femoral morphology and bone density are unaffected, so the cortical
      thickening and medullary stenosis that define the skeletal phenotype have
      no counterpart in the null mouse.
    limitations: >-
      Same direction-of-effect problem as above: a null cannot model a
      hypermorphic allele. Femoral morphometry and density were assessed, but
      the specific human findings - cortical thickening with medullary stenosis
      - are geometry rather than density measures, so a subtle change is not
      formally excluded by the reported analysis.
    readouts:
    - name: Femoral bone morphology and density
      target: Impaired Skeletal Development and Cortical Modelling
      direction: UNCHANGED
      interpretation: >-
        No skeletal phenotype on deletion of the gene.
      evidence:
      - reference: PMID:35715480
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "Analysis of femurs showed unaffected bone morphology and density in Fam111a-/- mice."
        explanation: >-
          The skeletal measurement, reported as unchanged.
    evidence:
    - reference: PMID:35715480
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Kidney and parathyroid histology were also normal in Fam111a-/- mice."
      explanation: >-
        Extends the negative result to tissue architecture in the two organs
        most relevant to the human phenotype.
discussions:
- discussion_id: fam111a_protease_to_pth
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Parathyroid Hormone Production and Calcium Homeostasis
  prompt: >-
    How does an over-active FAM111A protease impair parathyroid hormone
    production and bone modelling? What are the physiological substrates?
  rationale: >-
    Part of the chain is now closed: the patient mutants kill cells through
    peptidase activity, and FAM111A's normal role in replication origin
    activation is established. What remains open is the part that would explain
    the disease. No FAM111A substrate has been identified, so nothing accounts
    for why parathyroid progenitors and skeletal cortical modelling are what
    fail while most proliferating tissue does not - and the authors of the
    origin-activation study say as much, that it is unclear how gain-of-function
    mutations contribute to the etiology. The disease residues also sit away
    from the catalytic site, so even the route from variant to hyperactivity is
    inferred rather than shown.

  description: >-
    Supplemental calcium and activated forms of vitamin D, managed by an
    endocrinologist. GeneReviews sets an explicit monitoring cadence - serum
    calcium, phosphate and vitamin D every three months until calcium is
    normalized and every six months thereafter, with annual abdominal ultrasound
    for nephrocalcinosis and nephrolithiasis while on treatment.

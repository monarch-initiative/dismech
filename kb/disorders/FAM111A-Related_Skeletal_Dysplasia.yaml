name: FAM111A-Related Skeletal Dysplasia
creation_date: "2026-08-27T04:30:00Z"
category: Mendelian
synonyms:
- Kenny-Caffey syndrome type 2
- KCS2
- autosomal dominant Kenny-Caffey syndrome
- osteocraniostenosis
- OCS
- gracile bone dysplasia
- GCLEB
- osteocraniosplenic syndrome
description: >-
  FAM111A-related skeletal dysplasia is a single allelic spectrum spanning two
  named disorders: Kenny-Caffey syndrome type 2 (KCS2), a survivable dysplasia
  of proportionate short stature with cortical thickening and medullary stenosis
  of the tubular bones, and osteocraniostenosis (OCS), a usually lethal
  perinatal form adding intrauterine growth deficiency, microcephaly, poorly
  ossified cloverleaf-shaped skull, thin ribs with pulmonary hypoplasia and
  splenic hypo/aplasia. Both are caused by missense variants in a restricted
  region of FAM111A, a putative trypsin-like serine protease, and both are
  usually de novo. The mechanism is gain of function, not loss: the variants
  cluster on an outer surface of the protein away from the catalytic site, and
  quantitative work shows a graded series of hypermorphic alleles whose degree
  of activation determines whether the disorder is dominant KCS2, recessive
  KCS2, or OCS. Primary hypoparathyroidism with hypocalcemia and
  hyperphosphatemia occurs across the spectrum, and FAM111A's native function
  remains unknown, so the route from an over-active protease to a parathyroid
  and skeletal phenotype is still unexplained.

  Two naming traps are worth knowing. "Kenny-Caffey syndrome type 1" (OMIM
  244460) is a different gene entirely, TBCE, and is better called
  Sanjad-Sakati syndrome - the OMIM numbering inverts the historical usage,
  since the original Kenny-Caffey descriptions were of a dominant trait. And
  OCS has repeatedly been confused with Hallermann-Streiff syndrome, which
  shares skull and long-bone anomalies but is not lethal and lacks the OCS
  facies and splenic hypoplasia.

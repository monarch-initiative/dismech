inheritance:
- name: Autosomal dominant, typically de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous FAM111A missense variants, usually de novo. Rarely an
    individual with KCS has an affected parent, in which case sib and offspring
    risks are 50%.
  evidence:
  - reference: PMID:23684011
    reference_title: "FAM111A mutations result in hypoparathyroidism and impaired skeletal development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One mutation was identified in four unrelated individuals with KCS, and another one was identified in two unrelated individuals with OCS; all occurred de novo."
    explanation: >-
      Establishes the recurrent de novo heterozygous pattern across both
      subtypes.
- name: Autosomal recessive (rare)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A minority route to the same phenotypes. Two children with KCS and OCS were
    homozygous for variants replacing the same residue, Tyr414, with
    asymptomatic heterozygous relatives - the weakly activating alleles need two
    copies to cause disease.
  evidence:
  - reference: PMID:39932783
    reference_title: "Quantitative hypermorphic FAM111A alleles cause autosomal recessive Kenny-Caffey syndrome type 2 and osteocraniostenosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe 2 unrelated children with KCS and OCS who were homozygous for different FAM111A variant alleles that result in replacement of the same residue, Tyr414"
    explanation: >-
      Documents the recessive route, with the asymptomatic heterozygous
      relatives that make it recessive rather than dominant.
genetic:
- name: FAM111A
  gene_term:
    preferred_term: FAM111A
    term:
      id: hgnc:24725
      label: FAM111A
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    FAM111A (11q12.1) encodes a 611-amino-acid putative trypsin-like serine
    protease that protects replication forks from stalling at PARP1-DNA
    complexes and topoisomerase-1 cleavage complexes. Disease variants are
    missense and confined to a few residues within the trypsin-like peptidase
    domain. Molecular modelling places the KCS and OCS residues away from the
    active site and clustered on or near the outer surface, which is why the
    proposed pathogenesis involves altered partner interaction rather than
    impaired catalysis.


    Three features of the allelic spectrum are worth stating explicitly.
    First, there is a single dominant hotspot: c.1706G>A p.(Arg569His).
    Seven of eight patients in the largest Chinese series carried it, it recurs
    in unrelated patients across independent reports, and a systematic review
    of 46 genetically confirmed KCS2 patients concluded it is *the* hotspot
    variant. Notably R569H lies outside the peptidase domain, in the
    C-terminal region - so the "confined to the peptidase domain" summary above
    is true of most disease alleles but not of the commonest one.


    Second, de novo occurrence is the rule but not the law. The discovery
    cohort was entirely de novo, yet a three-generation Chinese family
    established father-to-daughter transmission, so the recurrence counselling
    cannot assume a de novo event without testing the parents.


    Third, the alleles are quantitatively rather than qualitatively different.
    Recombinant FAM111A carrying the recessive Y414C substitution dimerizes
    normally and is more active than wild type but less active than the
    dominant KCS2 mutants. That graded activation is what reconciles dominant
    and recessive inheritance in one gene: a strongly activating allele
    suffices in one copy, a weakly activating one needs two.
  variants:
  - name: c.1706G>A p.(Arg569His)
    description: >-
      The dominant hotspot allele. Heterozygous, usually de novo, and recurrent
      in unrelated KCS2 patients across independent reports. It lies outside
      the trypsin-like peptidase domain, in the C-terminal region, and enhances
      rather than compromises FAM111A autocleavage activity.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: Hypermorphic - increases FAM111A activity
      description: >-
        Grouped with the other KCS2 and OCS alleles that enhance autocleavage;
        the disease mechanism is excess rather than absent protease function.
    evidence:
    - reference: PMID:23996431
      reference_title: "A recurrent de novo FAM111A mutation causes Kenny-Caffey syndrome type 2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An identical missense mutation, R569H, was heterozygously detected in all three patients but not in the unaffected family members."
      explanation: >-
        The recurrence of the identical de novo allele in unrelated patients.
  - name: c.1241A>G p.(Tyr414Cys)
    description: >-
      A recessive, weakly activating allele. Homozygotes have KCS2; the
      heterozygous relatives are asymptomatic. The paired allele
      c.1240T>A p.(Tyr414Asn) at the same residue causes the lethal OCS
      phenotype when homozygous.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: Hypermorphic - mildly increases FAM111A activity
      description: >-
        More active than wild type but less active than the dominant KCS2
        mutants, which is why two copies are required.
    evidence:
    - reference: PMID:39932783
      reference_title: "Quantitative hypermorphic FAM111A alleles cause autosomal recessive Kenny-Caffey syndrome type 2 and osteocraniostenosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies of recombinant FAM111AY414C demonstrated normal dimerization and a mild gain-of-function effect."
      explanation: >-
        The functional characterization that grades this allele below the
        dominant ones.
  evidence:
  - reference: PMID:23684011
    reference_title: "FAM111A mutations result in hypoparathyroidism and impaired skeletal development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied five individuals with KCS and five with OCS and found that all of them had heterozygous mutations in FAM111A."
    explanation: >-
      The gene-discovery study covering both subtypes.
  - reference: PMID:23684011
    reference_title: "FAM111A mutations result in hypoparathyroidism and impaired skeletal development."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "residues affected by KCS and OCS mutations do not map close to the active site but are clustered on a segment of the protein and are at, or close to, its outer surface"
    explanation: >-
      The structural modelling behind the partner-interaction rather than
      catalysis hypothesis. Classified COMPUTATIONAL because the claim rests on
      molecular modelling.
  - reference: PMID:38591167
    reference_title: "Further delineation of phenotype and genotype of Kenny-Caffey syndrome type 2 (phenotype and genotype of KCS type 2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases harboured missense variants of FAM111A, and nucleotides c.1706 arose as a mutational hotspot, with seven individuals harbouring a c.1706G>A (p.Arg569His) variant, and one child harbouring a c.1531T>C (p.Tyr511His) variant."
    explanation: >-
      Identifies the recurrent nucleotide and gives the hotspot's share of a
      single cohort.
  - reference: PMID:38591167
    reference_title: "Further delineation of phenotype and genotype of Kenny-Caffey syndrome type 2 (phenotype and genotype of KCS type 2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms that Arg569His is the hot spot variant and summarizes the typical phenotypes of KCS2"
    explanation: >-
      The conclusion of a review of 46 genetically confirmed patients across 20
      papers, which is the basis for calling this a hotspot rather than a
      cohort-specific founder effect.
  - reference: PMID:37793778
    reference_title: "FAM111A regulates replication origin activation and cell fitness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the R569H point mutation is located outside of the enzyme domain, in the C-terminal region of the FAM111A gene and is found in seven unrelated KCS2 patients"
    explanation: >-
      Places the hotspot outside the peptidase domain and independently counts
      seven unrelated patients carrying it.
  - reference: PMID:38591167
    reference_title: "Further delineation of phenotype and genotype of Kenny-Caffey syndrome type 2 (phenotype and genotype of KCS type 2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide detailed characteristics of the largest KCS2 group in China and present the first genetically confirmed instance of father-to-daughter transmission of KCS2."
    explanation: >-
      Documents vertical transmission, which is what makes de novo occurrence a
      tendency rather than a rule.
  - reference: PMID:39932783
    reference_title: "Quantitative hypermorphic FAM111A alleles cause autosomal recessive Kenny-Caffey syndrome type 2 and osteocraniostenosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Comprehensive analyses of the Y414C recombinant FAM111A protein in mammalian cell lines demonstrate that this protein is more active than the FAM111AWT but is less active than mutant proteins that cause autosomal dominant KCS2."
    explanation: >-
      The functional measurement behind the graded-activation account, and the
      reason the same gene supports both dominant and recessive disease.
pathophysiology:
- name: Hypermorphic FAM111A Protease Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A missense variant in a restricted region of the FAM111A trypsin-like
    peptidase domain increases the protein's activity. The evidence that this is
    a graded rather than binary effect is what ties the whole spectrum together:
    a recombinant Y414C protein is more active than wild type but less active
    than the dominant KCS2 mutants, and it causes disease only when homozygous.
  genes:
  - preferred_term: FAM111A
    term:
      id: hgnc:24725
      label: FAM111A
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    functional_impact_category: HYPERMORPHIC
    allele_type: missense
    variant_origin: DE_NOVO
    description: >-
      Missense variants confined to a few residues of the peptidase domain,
      producing variable degrees of activation. The degree of activation, rather
      than the identity of the gene, is what sets dominant KCS2 against
      recessive KCS2 against OCS.
  downstream:
  - target: Peptidase-Dependent DNA Damage and Cell Death
  evidence:
  - reference: PMID:39932783
    reference_title: "Quantitative hypermorphic FAM111A alleles cause autosomal recessive Kenny-Caffey syndrome type 2 and osteocraniostenosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies of recombinant FAM111AY414C demonstrated normal dimerization and a mild gain-of-function effect."
    explanation: >-
      Measures the gain of function directly and shows it is mild for this
      allele, which is what makes the allele recessive.
  - reference: PMID:39932783
    reference_title: "Quantitative hypermorphic FAM111A alleles cause autosomal recessive Kenny-Caffey syndrome type 2 and osteocraniostenosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study provides evidence that both biallelic and monoallelic variants of FAM111A with varying degrees of activation can lead to dominant or recessive KCS2 and OCS."
    explanation: >-
      States the dose-of-activation model that unifies the dominant, recessive
      and lethal forms.
- name: Peptidase-Dependent DNA Damage and Cell Death
  biological_scale: CELLULAR
  description: >-
    The first cellular step downstream of the hypermorphic protease to be
    characterized. FAM111A is a replisome-associated protein that supports
    efficient activation of DNA replication origins. When FAM111A - wild type or
    patient mutant - is expressed unrestrained, cells accumulate DNA damage and
    die, and this happens only when the peptidase domain is intact. So the
    disease alleles kill cells through protease activity rather than through
    loss of a structural role, and the excess single-stranded DNA that
    accompanies it requires S-phase entry, tying the toxicity to replication.
    What is still missing is the substrate: the repertoire of FAM111A substrates
    has not been identified, so nothing yet explains why parathyroid and
    skeletal progenitors are the tissues that fail.
  biological_processes:
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Impaired Parathyroid Hormone Production and Calcium Homeostasis
  - target: Impaired Skeletal Development and Cortical Modelling
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excess cell death in proliferating progenitors is the plausible route to
      reduced brain growth in OCS; not demonstrated for neural tissue
      specifically.
  - target: Splenic hypoplasia or aplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped as a developmental failure of a proliferation-dependent organ;
      the OCS-defining splenic defect has no established mechanism.
  - target: Hypermetropia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped as a developmental consequence; no ocular mechanism is
      established for FAM111A.
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Grouped with the other ophthalmologic manifestations; no ocular mechanism
      is established for FAM111A.
  evidence:
  - reference: PMID:37793778
    reference_title: "FAM111A regulates replication origin activation and cell fitness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unrestrained expression of FAM111A WT and patient mutants causes accumulation of DNA damage and cell death, only when the peptidase domain remains intact."
    explanation: >-
      Establishes that the cellular toxicity of the patient mutants depends on
      protease activity, which is what makes this a gain-of-function mechanism
      rather than a structural one.
  - reference: PMID:37793778
    reference_title: "FAM111A regulates replication origin activation and cell fitness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that FAM111A facilitates efficient activation of DNA replication origins"
    explanation: >-
      The normal function whose dysregulation this node describes.
  - reference: PMID:37793778
    reference_title: "FAM111A regulates replication origin activation and cell fitness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, the repertoire of FAM111A substrates has yet to be identified."
    explanation: >-
      States the limit of the mechanism - no substrate is known - which is why
      this node stops short of explaining the tissue selectivity.
- name: Impaired Parathyroid Hormone Production and Calcium Homeostasis
  biological_scale: ORGANISM
  description: >-
    Primary hypoparathyroidism with hypocalcemia and hyperphosphatemia occurs in
    both KCS and OCS. The connection to the protease is asserted rather than
    explained: FAM111A's native function is unknown, and the discovery paper
    reaches only as far as saying the gene "appears to be crucial to a pathway"
    governing PTH production.
  biological_processes:
  - preferred_term: parathyroid hormone secretion
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
    modifier: DECREASED
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  downstream:
  - target: Primary hypoparathyroidism
    description: >-
      The endocrine endpoint.
  - target: Hypocalcemia
    description: >-
      Direct biochemical consequence of PTH deficiency.
  - target: Hyperphosphatemia
    description: >-
      The reciprocal biochemical consequence of PTH deficiency.
  - target: Seizures
    description: >-
      Hypocalcemic seizures and spasms - the neuromuscular expression of the
      low ionized calcium, not an independent cerebral lesion.
  - target: Cerebral calcification
    description: >-
      Chronic hypocalcemia with hyperphosphatemia raises the calcium-phosphate
      product and drives intracranial deposition; the route is standard for
      hypoparathyroidism but has not been shown specifically in FAM111A
      disease.
  - target: Nephrocalcinosis
    description: >-
      A consequence of treating the hypoparathyroidism rather than of the
      disease itself: calcium and activated vitamin D raise urinary calcium
      excretion.
  - target: Growth hormone deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attached to the endocrine node as a second, separately reported
      endocrinopathy in the same patient rather than as a consequence of the
      hypoparathyroidism; no mechanism links FAM111A to somatotroph function.
  evidence:
  - reference: PMID:37023242
    reference_title: "FAM111A-Related Skeletal Dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary hypoparathyroidism with hypocalcemia and hyperphosphatemia can occur in individuals with KCS and OCS."
    explanation: >-
      GeneReviews records the endocrine component across both subtypes.
  - reference: PMID:23684011
    reference_title: "FAM111A mutations result in hypoparathyroidism and impaired skeletal development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "FAM111A appears to be crucial to a pathway that governs parathyroid hormone production, calcium homeostasis, and skeletal development and growth."
    explanation: >-
      The strongest statement the source makes is that the gene appears crucial
      to such a pathway - a hypothesis, not a demonstrated mechanism, hence
      PARTIAL.
- name: Impaired Skeletal Development and Cortical Modelling
  biological_scale: TISSUE
  description: >-
    Small, dense, gracile bones with thickened cortices and stenosis of the
    medullary cavity - a modelling defect rather than a mineralization defect,
    and the finding that unifies the radiographic picture across the spectrum.
    In OCS this extends to failure of skull ossification and thin ribs.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: ABNORMAL
  downstream:
  - target: Cortical thickening of the long bones
    description: >-
      The defining radiographic expression of the modelling defect.
  - target: Medullary stenosis of the long bones
    description: >-
      The reciprocal half of the same modelling defect - cortex encroaches on
      the medullary cavity.
  - target: Proportionate short stature
    description: >-
      Growth endpoint of impaired skeletal development, in the survivable KCS2
      subtype.
  - target: Intrauterine growth deficiency
    description: >-
      Prenatal growth endpoint, in the severe OCS subtype.
  - target: Decreased skull ossification
    description: >-
      Failure of cranial bone formation, giving the cloverleaf skull shape in
      OCS.
  - target: Large anterior fontanel with delayed closure
    description: >-
      The milder KCS2 counterpart of the OCS skull-ossification failure.
  - target: Relative macrocephaly
    description: >-
      Cranial vault growth is relatively spared against the body-size deficit
      in KCS2.
  - target: Thin ribs with thoracic hypoplasia
    description: >-
      Chest-wall expression of the skeletal defect in OCS.
  - target: Perinatal fractures
    description: >-
      Consequence of the abnormal bone produced by the modelling defect.
  - target: Dental manifestations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dental hard tissue shares the mineralized-tissue defect; the specific
      route is not established.
  - target: Carious teeth
    description: >-
      Grouped with the other dental manifestations of impaired
      mineralized-tissue development; no specific route is established.
  evidence:
  - reference: PMID:23684011
    reference_title: "FAM111A mutations result in hypoparathyroidism and impaired skeletal development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genetic conditions characterized by impaired skeletal development with small and dense bones, short stature, and primary hypoparathyroidism with hypocalcemia"
    explanation: >-
      Defines the shared skeletal phenotype of the two subtypes.

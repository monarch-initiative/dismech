- name: Reduced XL-alpha-s function in shared-exon variants
  description: Shared-exon GNAS variants can affect XL-alpha-s as well as Gs-alpha. Lower birth weight in a mixed PPHP/POH cohort supports a fetal-growth modifier, but isoform-specific effects have not been isolated from mutation class or broader locus effects in patients.
  evidence:
  - reference: PMID:23884777
    reference_title: Paternal GNAS mutations lead to severe intrauterine growth retardation (IUGR) and provide evidence for a role of XLαs in fetal development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: birth weights were lower with paternal GNAS mutations affecting exons 2-13 than with exon 1/intron 1 mutations.
    explanation: Birth parameters from 26 PPHP/POH and 29 PHP-Ia patients support an exon-class association, not isolated proof that XL-alpha-s determines fetal growth.
  - reference: PMID:22215617
    reference_title: New mutations at the imprinted Gnas cluster show gene dosage effects of Gsα in postnatal growth and implicate XLαs in bone and fat metabolism but not in suckling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: paternal inheritance of Ex1A-T results in an increased metabolic rate and reductions in fat mass, leptin, and bone mineral density attributable to loss of XLαs
    explanation: The engineered mouse allele supports isoform-dependent effects but also changes locus dosage; human effects are variant-dependent.
  downstream:
  - target: Intrauterine growth retardation
    description: Reduced XL-alpha-s function is a plausible contributor to prenatal growth restriction; paternal exon-1 variants also lower birth weight.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

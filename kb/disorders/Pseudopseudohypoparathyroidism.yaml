clinical_trials:
- name: NCT00209235
  phase: NOT_APPLICABLE
  status: ACTIVE_NOT_RECRUITING
  description: AHO natural-history and cognitive/behavioral follow-up explicitly includes mutation-confirmed PPHP. The growth-hormone substudy is restricted to PHP1A and must not be interpreted as PPHP efficacy evidence.
  notes: ClinicalTrials.gov API checked 2026-09-04. Previously enrolled participants only; PPHP natural-history ages 0.2–89 years and cognitive ages 4–65 years. Registration does not establish a large independent PPHP cohort.
  evidence:
  - reference: clinicaltrials:NCT00209235
    reference_title: 'Natural History Study of Albright Hereditary Osteodystrophy: Includes Substudies on Effects of Growth Hormone in Patients With Pseudohypoparathyroidism Type 1A and Cognitive & Behavioral Studies in Albright Hereditary Osteodystrophy'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We, the researchers, are following the natural history of Albright hereditary osteodystrophy.
    explanation: The registry establishes ongoing natural-history research; API eligibility separates PPHP follow-up from the PHP1A GH arm.
- name: NCT03761290
  phase: NOT_APPLICABLE
  status: TERMINATED
  description: Observational glucose-homeostasis study enrolling PHP1A/PPHP participants and matched controls. The record reports 14 participants and termination because COVID precautions prevented healthy-control enrollment and funding ended.
  notes: API checked 2026-09-04. The registered design and incomplete enrollment do not establish PPHP diabetes risk or a therapeutic effect.
  evidence:
  - reference: clinicaltrials:NCT03761290
    reference_title: Glucose Homeostasis and Beta Cell Function in Pseudohypoparathyroidism
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this pilot study we will assess β-cell function in patients with PHP1A and pseudopseudohypoparathyroidism PPHP.
    explanation: The protocol explicitly includes PPHP.
- name: NCT00001242
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: Historical NIH study of vitamin D/PTH resistance and related disorders; eligibility explicitly includes PPHP or suspected PPHP. Its diagnostic evaluation and inclusion in other protocols are not a PPHP-specific intervention result.
  notes: API eligibility and completed status checked 2026-09-04.
  evidence:
  - reference: clinicaltrials:NCT00001242
    reference_title: Studies of States With Resistance to Vitamin D and Parathyroid Hormone
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients will be tested with multiple indices of mineral metabolism to establish the diagnosis and examine the spectrum of the underlying disorder.
    explanation: The registry describes diagnostic characterization of related mineral-metabolism conditions.
- name: NCT04551170
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: Related PHP/AHO trial of the PDE inhibitor theophylline in children aged 2–12 years, with obesity required. The protocol targets cAMP signaling, BMI and epiphyseal closure. Broad clinical criteria do not establish a molecular PPHP subgroup or PPHP skeletal efficacy.
  notes: API checked 2026-09-04. This record contradicts a blanket absence of pathway-directed AHO trials; theophylline remains investigational and is not presented as established PPHP treatment.
  evidence:
  - reference: clinicaltrials:NCT04551170
    reference_title: Phase 2 Study of Theophylline Treatment for Pseudohypoparathyroidism
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This phase 2 clinical trial and open-label extension study will test the efficacy of theophylline, a phosphodiesterase inhibitor, in pseudohypoparathyroidism.
    explanation: A registered cAMP-pathway trial exists in the related PHP/AHO population.
references:
- reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
  title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf
  tags:
  - GeneReviews
  findings:
  - statement: Clinical, molecular, differential-diagnosis and counselling framework for GNAS inactivation disorders; PHP1A frequencies and treatment evidence must not be assigned to PPHP. The 2018 consensus supplies a more specific PPHP exception to routine mineral biochemistry.
- reference: PMID:40256763
  title: Alpha-smooth muscle actin-expressing dermal sheath cells are a major cellular contributor to heterotopic subcutaneous ossifications in a mouse model of Albright hereditary osteodystrophy.
  findings:
  - statement: Mouse alpha-SMA lineage tracing supports a dermal-sheath contribution, and Sfrp2 deletion worsens male AHO ossification. Human mixed-subtype fibroblast microarrays provide limited omics evidence; neither the human cell of origin nor efficacy of SFRP2 treatment is established.

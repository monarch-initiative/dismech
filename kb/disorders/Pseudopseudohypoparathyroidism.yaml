  notes: Exon-1 variants primarily affect Gs-alpha, whereas shared-exon variants can affect additional transcripts including paternal XL-alpha-s. Receptor-specific mixed gain/loss-of-function variants can cause distinct SIADH/osteolysis phenotypes and require functional interpretation rather than automatic PPHP classification.
diagnosis:
- name: Clinical and biochemical recognition of AHO without PTH resistance
  description: >-
    Recognize the evolving AHO pattern using growth history, examination for superficial ossification,
    and hand/foot radiographs when useful. Obtain baseline calcium, phosphate, PTH, vitamin D
    and thyroid function to establish the endocrine phenotype and identify mimics. Routine PTH
    infusion testing is rarely required.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: AHO features with no classical PTH resistance.
  evidence:
  - reference: ORPHA:79445
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pseudopseudohypoparathyroidism (pseudo-PHP) is a disease characterized by a constellation of clinical features collectively termed Albright hereditary osteodystrophy (AHO) but no evidence of resistance to parathyroid hormone (PTH), which is seen in other forms of pseudohypoparathyroidism (PHP).
    explanation: Orphanet defines the diagnostic distinction between PPHP and other PHP forms.
    reference_title: Pseudopseudohypoparathyroidism
  - reference: PMID:15711092
    supports: SUPPORT
    evidence_source: OTHER
    snippet: These features are also present in pseudopseudohypoparathyroidism (PPHP), but patients affected by this disorder do not show hormone resistance.
    explanation: This review supports assessing AHO features together with absent hormone resistance.
    reference_title: GNAS locus and pseudohypoparathyroidism.
  - reference: PMID:29959430
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At diagnosis or before initiation of treatment, we recommend the monitoring of serum levels of PTH, calcium, phosphorus and calcifediol.
    explanation: Baseline endocrine biochemistry establishes whether the classical PPHP pattern is present.
- name: GNAS molecular genetic testing
  description: >-
    Sequence GNAS coding exons and splice junctions and assess deletion/duplication when sequencing
    is unrevealing. Determine parental phase by family testing or informative molecular markers;
    a de novo variant may still be paternal. Methylation and imprinting-control testing are particularly
    relevant when the phenotype suggests PHP1B or coding testing is negative; an STX16 defect
    is not the usual cause of PPHP.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Heterozygous GNAS loss-of-function variant, classically on the paternal allele.
  evidence:
  - reference: PMID:29959430
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The clinical and laboratory diagnosis should be confirmed by a molecular genetic analysis.
    explanation: Consensus guidance supports molecular genetic analysis to confirm PHP-related disorder diagnosis.
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
  - reference: ORPHA:79445
    supports: SUPPORT

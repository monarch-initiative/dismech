    explanation: Complete conditional knockout establishes pathway necessity, whereas heterozygotes in this separate model had no overt phenotype.
- name: AHO alpha-SMA lineage tracing and Sfrp2 modifier mouse
  species: Mouse
  genotype: GnasE1+/-; alphaSMACreERT2; Ai9, with or without Sfrp2 deletion
  description: Alpha-SMA-labelled cells contribute to ossifications after long-term tracing; initial labels include dermal sheath, arrector pili and vessels. Sfrp2 deletion accelerates lesions in male AHO mice, with no corresponding significant female effect. Fate mapping does not prove selective lineage necessity or human cell identity.
  modeled_mechanisms:
  - target: Dermal and subcutaneous ectopic bone formation
    relationship: PARTIALLY_RECAPITULATES
    description: Lineage tracing identifies contributing cells and modifier perturbation changes lesion burden.
    limitations: Species, zygosity and tissue context limit direct extrapolation to human heterozygous PPHP.
    evidence:
    - reference: PMID:40256763
      reference_title: Alpha-smooth muscle actin-expressing dermal sheath cells are a major cellular contributor to heterotopic subcutaneous ossifications in a mouse model of Albright hereditary osteodystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Here we show that SCO formation occurs due to inappropriate expansion and osteogenic differentiation of cells that express alpha-smooth muscle actin and that are located within the dermal sheath.
      explanation: Mouse alpha-SMA fate mapping supports a dermal-sheath contribution; initial labeling includes additional alpha-SMA populations and does not establish human cell identity.
    - reference: PMID:40256763
      reference_title: Alpha-smooth muscle actin-expressing dermal sheath cells are a major cellular contributor to heterotopic subcutaneous ossifications in a mouse model of Albright hereditary osteodystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: elimination of Sfrp2 in male AHO mice leads to earlier development, greater severity, and acceleration of formation of SCOs.
      explanation: Sfrp2 deletion worsens lesions in male AHO mice, supporting a protective modifier rather than an obligatory pathogenic SFRP2 increase.

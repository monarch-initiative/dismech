      label: osteoblast differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:24076664
    reference_title: Activation of Hedgehog signaling by loss of GNAS causes heterotopic ossification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In progressive osseous heteroplasia, a human disease caused by null mutations in GNAS, which encodes Gαs, Hedgehog signaling is upregulated in ectopic osteoblasts and progenitor cells."
    explanation: >
      Human lesion tissue from the severe end of the paternal GNAS spectrum
      shows the pathway activated in the cells that make the ectopic bone,
      which is the human anchor for this node.
  - reference: PMID:24076664
    reference_title: Activation of Hedgehog signaling by loss of GNAS causes heterotopic ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In animal models, we show that genetically-mediated ectopic Hedgehog signaling is sufficient to induce heterotopic ossification, whereas inhibition of this signaling pathway by genetic or pharmacological means strongly reduces the severity of this condition."
    explanation: >
      Supplies the causal direction the human observation cannot: Hedgehog
      activation is sufficient for heterotopic ossification and blocking it
      reduces the lesion, so the pathway is a mechanism rather than a
      correlate.
  - reference: PMID:34162750
    reference_title: A self-amplifying loop of YAP and SHH drives formation and expansion of heterotopic ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mouse models of progressive osseous heteroplasia (POH), a disease caused by null mutations in GNAS, we found that Gnas-/- mesenchymal cells secreted SHH, which induced osteoblast differentiation of the surrounding wild-type cells."
    explanation: >
      Explains lesion expansion rather than initiation: secreted SHH turns
      genotypically normal neighbours into osteoblasts, so ectopic bone can
      grow past the cells that carry the GNAS defect.
  - reference: PMID:33574833
    reference_title: Gnas Inactivation Alters Subcutaneous Tissues in Progression to Heterotopic Ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that mutant cells in a Gnas-null tissue environment induced a robust HO response while little/no HO was detected in control hosts."
    explanation: >
      Adds a tissue-level requirement to the cell-autonomous account: the
      same mutant progenitors ossify only in a Gnas-null host environment,
      so the surrounding subcutaneous tissue is part of the mechanism.
  downstream:
  - target: Ectopic ossification
    description: >-
      Derepressed Hedgehog signaling drives intramembranous osteoblast
      differentiation in dermal and subcutaneous soft tissue.
    hypothesis_groups:
    - aho_developmental_model
    causal_link_type: DIRECT

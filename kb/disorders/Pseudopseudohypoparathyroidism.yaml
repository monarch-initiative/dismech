differential_diagnoses:
- name: Acrodysostosis
  disease_term:
    preferred_term: acrodysostosis
    term:
      id: MONDO:0019797
      label: acrodysostosis
  description: >-
    The closest mechanistic phenocopy. Acrodysostosis arises further down the
    same PTHrP-Gs-alpha-cAMP-PKA cascade, from PRKAR1A variants that resist
    cAMP-driven PKA activation or from PDE4D variants, and produces severe
    brachydactyly and facial dysostosis that overlap AHO. Older AHO case
    series are known to contain acrodysostosis patients and vice versa, so a
    GNAS-negative AHO-like skeletal phenotype should be tested for these
    genes before the mechanism is attributed to Gs-alpha dosage.
  distinguishing_features:
  - Nasal hypoplasia and midface dysostosis are more prominent than in PPHP.
  - Brachydactyly affects all digits rather than showing the 4th/5th-ray pattern.
  - Subcutaneous ossification is not a feature.
  - PRKAR1A-related disease (ADOHR) carries GPCR hormone resistance, which classical PPHP does not.
  evidence:
  - reference: PMID:24363928
    reference_title: Acrodysostosis syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two different genetic and phenotypic syndromes are now identified, both with a similar bone dysplasia: ADOHR, due to PRKAR1A defects, and ADOP4 (our denomination), due to PDE4D defects. The existence of GPCR-hormone resistance is typical of the ADOHR syndrome."
    explanation: >
      Separates the two acrodysostosis genes and states the hormone-resistance
      feature that distinguishes them from each other and from PPHP.
  - reference: PMID:27589370
    reference_title: "Knock-In of the Recurrent R368X Mutation of PRKAR1A that Represses cAMP-Dependent Protein Kinase A Activation: A Model of Type 1 Acrodysostosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This model, the first describing the germline expression of a PRKAR1A mutation causing dominant repression of cAMP-dependent PKA, reproduced the main features of ACRDYS1 in humans."
    explanation: >
      Establishes that repressing PKA downstream of Gs-alpha reproduces the
      skeletal phenotype, which is why this differential is pathway evidence
      for the cAMP model and not a GNAS-specific confirmation.
- name: PTHLH- and TRPS1-related syndromic brachydactyly
  description: >-
    Brachydactyly type E with short stature (PTHLH) and trichorhinophalangeal
    syndrome (TRPS1) both produce AHO-like hand and stature phenotypes without
    a GNAS lesion. PTHLH sits upstream of Gs-alpha as the ligand arm of the
    same pathway; TRPS1 is a transcription factor acting on growth-plate
    development and is not simply another node of one linear cascade.
  distinguishing_features:
  - No subcutaneous or ectopic ossification.
  - No PTH or TSH resistance, and normal calcium and phosphate.
  - TRPS1 disease adds sparse hair and a pear-shaped nose with cone-shaped epiphyses.
  - Molecular testing is the only reliable discriminator in the reported series.
  evidence:
  - reference: PMID:34897794
    reference_title: Novel Pathogenetic Variants in PTHLH and TRPS1 Genes Causing Syndromic Brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unfortunately, we could not find distinctive phenotypic features that might have led to an earlier clinical diagnosis, further highlighting the high degree of overlap among skeletal syndromes associated with brachydactyly and AHO-like features"
    explanation: >
      Five patients carrying an AHO-like skeletal phenotype turned out to have
      PTHLH or TRPS1 variants, and the authors could find no clinical feature
      that would have separated them beforehand. This is the reason the AHO
      developmental model is recorded as pathway-correct but not
      GNAS-exclusive.

  - target: Hedgehog derepression in mesenchymal progenitors
    description: >-
      Reduced Gs-alpha signaling in soft-tissue mesenchymal progenitors lifts
      the PKA-dependent brake on Hedgehog signaling, which is the proximate
      pathway step between the pathway lesion and ectopic bone.
    hypothesis_groups:
    - aho_developmental_model
    causal_link_type: DIRECT
- name: Hedgehog derepression in mesenchymal progenitors
  description: >-
    Gs-alpha normally restrains Hedgehog signaling in soft-tissue mesenchymal
    progenitors through PKA-dependent processing of GLI transcription factors.
    Loss of Gs-alpha derepresses that pathway and biases the progenitors toward
    intramembranous osteoblast differentiation, and a YAP-SHH feedback loop
    recruits neighbouring wild-type cells so that a lesion expands beyond the
    mutant clone. The pathway itself is established in conditional-null and
    homozygous progressive osseous heteroplasia mouse models rather than in
    heterozygous PPHP tissue, so its dosage relevance to the milder,
    later-onset ossifications of PPHP is not settled; that is recorded as a
    HUMAN_MODEL_MISMATCH discussion below.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  - preferred_term: osteoblast differentiation
    term:

- name: Conditional Gnas-null POH models
  species: Mouse
  genotype: Conditional Gnas-null mesenchymal cells and host tissues
  description: Related POH models support Hedgehog activation, YAP-SHH paracrine recruitment and effects of the mutant host environment on wild-type cells. Null dosage and deep progressive disease limit transfer to heterozygous superficial PPHP.

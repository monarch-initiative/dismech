    snippet: Gnas(E1-/+) mice develop SCO features that are similar to those observed in AHO patients
    explanation: Heterozygous Gnas exon-1 mice reproduce superficial ectopic bone.
- name: Heterozygous chondrocyte chimera
  species: Mouse
  genotype: Chimeric wild-type and Gnas+/E2- growth plates
  description: Approximately half-normal Gs-alpha RNA after either parental disruption is accompanied by modest premature hypertrophy. The design does not reproduce human digit-selective brachydactyly.
  modeled_mechanisms:
  - target: Premature chondrocyte hypertrophy
    relationship: PARTIALLY_RECAPITULATES
    description: A dosage-relevant cellular phenotype supports the growth-plate mechanism.
    limitations: Species, zygosity and tissue context limit direct extrapolation to human heterozygous PPHP.
    evidence:
    - reference: PMID:15459318
      reference_title: Stimulatory G protein directly regulates hypertrophic differentiation of growth plate cartilage in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Hypertrophy of Gnas(+/E2-) chondrocytes was modestly but significantly premature in chimeric growth plates of mice containing wild-type and Gnas(+/E2-) cells.
      explanation: The heterozygous chimera shows modest premature hypertrophy; it does not establish human digit selectivity.

- name: Complete and partial chondrocyte-specific Gnas deletion
  species: Mouse
  genotype: Col2a1-Cre; Gnas floxed null or heterozygous
  description: Complete deletion causes severe growth-plate defects and perinatal death; heterozygotes in the same study have no overt phenotype. These are pathway-necessity and negative dosage observations, respectively.
  modeled_mechanisms:
  - target: Reduced PTHrP-dependent chondrocyte signaling
    relationship: PERTURBS
    description: Complete deletion perturbs the PTHrP/Gs-alpha pathway.
    limitations: Species, zygosity and tissue context limit direct extrapolation to human heterozygous PPHP.
    evidence:
    - reference: PMID:15765186
      reference_title: Chondrocyte-specific knockout of the G protein G(s)alpha leads to epiphyseal and growth plate abnormalities and ectopic chondrocyte formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mice with complete chondrocyte-specific G(s)alpha deficiency (homozygotes) died within minutes after birth and had severe epiphyseal and growth plate defects with shortening of the proliferative zone and accelerated hypertrophic differentiation of growth plate chondrocytes, a phenotype similar to that of PTH/PTH-related peptide (PTHrP) receptor knockout mice.
      explanation: Complete conditional knockout establishes pathway necessity, whereas heterozygotes in this separate model had no overt phenotype.
  - target: Premature chondrocyte hypertrophy
    relationship: FAILS_TO_RECAPITULATE
    description: Partial deletion in this model does not reproduce the overt skeletal phenotype.
    limitations: Species, zygosity and tissue context limit direct extrapolation to human heterozygous PPHP.
    evidence:
    - reference: PMID:15765186
      reference_title: Chondrocyte-specific knockout of the G protein G(s)alpha leads to epiphyseal and growth plate abnormalities and ectopic chondrocyte formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mice with partial G(s)alpha deficiency (heterozygotes) exhibited no phenotype.
      explanation: Complete conditional knockout establishes pathway necessity, whereas heterozygotes in this separate model had no overt phenotype.

name: Pseudopseudohypoparathyroidism
creation_date: '2026-05-10T18:13:23Z'
description: >-
  Pseudopseudohypoparathyroidism (PPHP) is a GNAS-related disorder in which
  patients have Albright hereditary osteodystrophy features, such as
  brachydactyly, short stature, rounded face, and ectopic ossification, but
  classically lack parathyroid hormone resistance.
category: Genetic
parents:
- Pseudohypoparathyroidism
- Disorder of GNAS Inactivation
- Acromelic Dysplasia
synonyms:
- PPHP
- Pseudo-pseudohypoparathyroidism
- AHO-PPHP syndrome
- Albright hereditary osteodystrophy-PPHP syndrome
disease_term:
  preferred_term: pseudopseudohypoparathyroidism
  term:
    id: MONDO:0012912
    label: pseudopseudohypoparathyroidism
prevalence:
- population: Europe point prevalence
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  percentage: Unknown
  evidence:
  - reference: ORPHA:79445
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Unknown | Europe | Point prevalence | ORPHANET
    explanation: Orphanet reports unknown point prevalence for PPHP in Europe.
    reference_title: Pseudopseudohypoparathyroidism
mechanistic_hypotheses:
- hypothesis_group_id: pphp_parent_of_origin_model
  hypothesis_label: Paternal GNAS Loss-of-Function Model
  status: CANONICAL
  description: >-
    A paternal GNAS coding loss-of-function variant reduces Gs-alpha dosage in biallelic tissues,
    producing AHO skeletal and soft-tissue features while usually sparing classic renal PTH resistance
    because of pre-existing tissue-specific imprinting.
  notes: >-
    Canonical after review of the OpenScientist synthesis. Renal imprinting context is distinct
    from the PPHP mutation-driven causal path; STX16 imprinting-establishment experiments concern
    PHP1B. Human thyroid imprinting is incomplete and fetal bulk renal cortex can show biallelic
    expression, so mouse tissue results cannot be made universal across human cells and ages.
    Rare paternal-variant hormone-resistance cases exist. Severe early obesity is typically maternal-variant
    associated, but universal PPHP leanness is not established. Shared-exon XL-alpha-s effects
    are variant-dependent modifiers, and PPHP, POH and osteoma cutis remain distinguishable phenotypes.
  evidence:
  - reference: PMID:9671744
    reference_title: Variable and tissue-specific hormone resistance in heterotrimeric Gs protein alpha-subunit (Gsalpha) knockout mice is due to tissue-specific imprinting of the gsalpha gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Gsalpha expression in the renal cortex (the site of PTH action) is markedly reduced in m-/+ but not in +/p- mice
    explanation: Maternal versus paternal disruption demonstrates the renal parent-of-origin effect in mice.
  - reference: PMID:16099856
    reference_title: A mouse model of albright hereditary osteodystrophy generated by targeted disruption of exon 1 of the Gnas gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mice that inherited the disruption maternally (-m/+) exhibited PTH and TSH resistance, whereas those with paternal inheritance (+/-p) had normal hormone responsiveness
    explanation: Exon-1-specific disruption separates Gs-alpha from effects on other GNAS transcripts.
  - &id001
    reference: PMID:15459318
    reference_title: Stimulatory G protein directly regulates hypertrophic differentiation of growth plate cartilage in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Gsalpha mRNA expression detected by real-time RT-PCR analysis was reduced to approximately half that of the wild-type in both paternal and maternal Gnas(+/E2-) growth plate chondrocytes, indicating biallelic expression of Gsalpha in these cells.
    explanation: Approximately half-normal RNA after either parental disruption supports biallelic growth-plate dosage.
  - reference: PMID:23884777
    reference_title: Paternal GNAS mutations lead to severe intrauterine growth retardation (IUGR) and provide evidence for a role of XLαs in fetal development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: birth weights were lower with paternal GNAS mutations affecting exons 2-13 than with exon 1/intron 1 mutations.
    explanation: Birth parameters from 26 PPHP/POH and 29 PHP-Ia patients support an exon-class association, not isolated proof that XL-alpha-s determines fetal growth.
  - reference: PMID:22215617
    reference_title: New mutations at the imprinted Gnas cluster show gene dosage effects of Gsα in postnatal growth and implicate XLαs in bone and fat metabolism but not in suckling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: paternal inheritance of Ex1A-T results in an increased metabolic rate and reductions in fat mass, leptin, and bone mineral density attributable to loss of XLαs
    explanation: The engineered mouse allele supports isoform-dependent effects but also changes locus dosage; human effects are variant-dependent.
  - reference: PMID:12147228
    reference_title: Paternal imprinting of Galpha(s) in the human thyroid as the basis of TSH resistance in pseudohypoparathyroidism type 1a.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with paternal Galpha(s) transcripts accounting for only 25.9-40.4%.
    explanation: Eight normal human thyroid samples showed incomplete paternal suppression, contradicting the report claim that human tissue imprinting has only been studied in pituitary.
  - reference: PMID:11600515
    reference_title: 'Galphas transcripts are biallelically expressed in the human kidney cortex: implications for pseudohypoparathyroidism type 1b.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Galphas transcripts are biallelically expressed in human kidney cortex.
    explanation: Fetal human renal-cortex bulk RNA does not directly test mature proximal-tubule-specific imprinting.
- hypothesis_group_id: aho_developmental_model
  hypothesis_label: AHO Developmental Tissue Model
  status: CANONICAL
  description: >-
    Reduced Gs-alpha signaling disrupts growth-plate maturation and mesenchymal osteogenic programs.
    Separate growth and ectopic-ossification pathways explain core AHO skeletal features, while
    selective digit involvement and human lesion-cell mechanisms remain incompletely resolved.
  notes: >-
    Canonical core with qualified experimental branches after OpenScientist assessment. Heterozygous
    chimera evidence is distinguished from complete conditional knockouts. Mouse dermal-sheath
    lineage tracing is not human lineage proof. Hedgehog, YAP-SHH and microenvironment studies
    in POH models add mechanisms beyond a simple adipogenic-to-osteogenic switch. The 2025 study
    includes a small mixed PPHP/PHP1A/POH fibroblast microarray, contrary to the report omics-absence
    claim. SFRP2 deletion worsens ossification in male AHO mice, indicating a protective modifier;
    recombinant SFRP2 did not rescue explants. Somatic second hits remain hypothetical. No established
    PPHP skeletal disease-modifying therapy follows from these studies.
  evidence:
  - *id001
  - reference: PMID:15459318
    reference_title: Stimulatory G protein directly regulates hypertrophic differentiation of growth plate cartilage in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Hypertrophy of Gnas(+/E2-) chondrocytes was modestly but significantly premature in chimeric growth plates of mice containing wild-type and Gnas(+/E2-) cells.
    explanation: The heterozygous chimera shows modest premature hypertrophy; it does not establish human digit selectivity.
  - reference: PMID:15765186
    reference_title: Chondrocyte-specific knockout of the G protein G(s)alpha leads to epiphyseal and growth plate abnormalities and ectopic chondrocyte formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice with complete chondrocyte-specific G(s)alpha deficiency (homozygotes) died within minutes after birth and had severe epiphyseal and growth plate defects with shortening of the proliferative zone and accelerated hypertrophic differentiation of growth plate chondrocytes, a phenotype similar to that of PTH/PTH-related peptide (PTHrP) receptor knockout mice.
    explanation: Complete conditional knockout establishes pathway necessity, whereas heterozygotes in this separate model had no overt phenotype.
  - reference: PMID:22511293
    reference_title: Paternally inherited gsα mutation impairs adipogenesis and potentiates a lean phenotype in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Impaired adipocyte differentiation was rescued by an adenylyl cyclase activator, forskolin, and provided evidence that Gsα-cAMP signals are necessary in early stages of this process.
    explanation: cAMP stimulation rescues impaired adipogenesis in paternal-mutant mouse stromal cells; the human lesion mechanism is not a proven binary fate switch.
  - reference: PMID:40256763
    reference_title: Alpha-smooth muscle actin-expressing dermal sheath cells are a major cellular contributor to heterotopic subcutaneous ossifications in a mouse model of Albright hereditary osteodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here we show that SCO formation occurs due to inappropriate expansion and osteogenic differentiation of cells that express alpha-smooth muscle actin and that are located within the dermal sheath.
    explanation: Mouse alpha-SMA fate mapping supports a dermal-sheath contribution; initial labeling includes additional alpha-SMA populations and does not establish human cell identity.
  - reference: PMID:24076664
    reference_title: Activation of Hedgehog signaling by loss of GNAS causes heterotopic ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here we demonstrate that Gαs restricts bone formation to the skeleton by inhibiting Hedgehog signaling in mesenchymal progenitor cells.
    explanation: Perturbation studies support a Hedgehog-dependent mechanism in Gnas-null POH models; direct transfer to heterozygous human PPHP remains provisional.
  - reference: PMID:24076664
    reference_title: Activation of Hedgehog signaling by loss of GNAS causes heterotopic ossification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In progressive osseous heteroplasia, a human disease caused by null mutations in GNAS, which encodes Gαs, Hedgehog signaling is upregulated in ectopic osteoblasts and progenitor cells.
    explanation: Human lesion evidence is from POH, a related but distinct GNAS ossification disorder.
  - reference: PMID:34162750
    reference_title: A self-amplifying loop of YAP and SHH drives formation and expansion of heterotopic ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We further showed that loss of Gnas led to activation of YAP transcription activity, which directly drove Shh expression.
    explanation: Gnas-null mesenchymal cells support YAP-SHH-mediated propagation; the model is not equivalent to heterozygous PPHP.
pathophysiology:
- name: Paternal GNAS coding loss of function
  description: A heterozygous inactivating GNAS coding variant on the paternal chromosome causes the classical PPHP phenotype. It can be inherited or de novo. Pre-existing tissue-specific imprinting usually preserves sufficient maternal renal Gs-alpha signaling; the variant does not itself create normal imprinting or an STX16 deletion.
  evidence:
  - reference: PMID:15711092
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PHP-Ia and PPHP are caused by heterozygous inactivating mutations in those exons of GNAS encoding the alpha subunit of the stimulatory guanine nucleotide-binding protein (Gsalpha)
    explanation: This supports heterozygous inactivating GNAS coding variants as causal for PPHP.
    reference_title: GNAS locus and pseudohypoparathyroidism.

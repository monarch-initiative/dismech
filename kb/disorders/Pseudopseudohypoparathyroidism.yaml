- name: Dermal and subcutaneous ectopic bone formation
  description: True intramembranous bone forms in skin and subcutaneous tissue, independently of the serum calcium-phosphate abnormality of PTH resistance. Alpha-SMA lineage tracing supports a dermal-sheath contribution in AHO mice. Progressive invasion of deep fascia and muscle suggests POH or an overlap phenotype rather than classical superficial PPHP.
  evidence:
  - reference: PMID:21747923
    reference_title: Heterotopic ossifications in a mouse model of albright hereditary osteodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Gnas(E1-/+) mice develop SCO features that are similar to those observed in AHO patients
    explanation: Heterozygous Gnas exon-1 mice reproduce superficial ectopic bone.
  - reference: PMID:29059381
    reference_title: 'Ossifications in Albright Hereditary Osteodystrophy: Role of Genotype, Inheritance, Sex, Age, Hormonal Status, and BMI.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'RESULTS: Forty-seven of 67 participants (70.1%) had SCOs. Patients with PHP1A and PPHP had similar prevalences and degrees of ossification formation. Patients with frameshift and nonsense mutations had much more extensive SCOs than those with missense mutations. Males were affected more than females. There was no correlation with hormonal status or BMI.'
    explanation: The 67-person AHO cohort included 18 PPHP cases; ossification burden was similar between PPHP and PHP1A and did not correlate with BMI or hormone status.

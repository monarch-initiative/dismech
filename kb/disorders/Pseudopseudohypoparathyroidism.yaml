    snippet: Sequence analysis of exons 1 through 13 of
    explanation: The testing sequence includes copy-number analysis rather than coding sequencing alone.
treatments:
- name: Individualized clinical surveillance with baseline endocrine assessment
  description: >-
    Assess growth, weight, puberty, thyroid function, new or enlarging ossifications, mobility,
    oral health and educational needs according to the phenotype. Establish calcium, phosphate,
    PTH and vitamin D status at diagnosis. Confirmed paternal GNAS cases do not require the routine
    serial PTH/calcium/phosphate testing schedule used for PHP1A; reassess when symptoms, abnormal
    results or uncertainty about parental phase warrant it. Treat documented hormone deficiencies,
    not the PPHP label alone.
  treatment_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  target_phenotypes:
  - preferred_term: Ectopic ossification
    term:
      id: HP:0011986
      label: Ectopic ossification
  - preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
  - preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:29959430
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At diagnosis or before initiation of treatment, we recommend the monitoring of serum levels of PTH, calcium, phosphorus and calcifediol.
    explanation: Baseline endocrine biochemistry establishes whether the classical PPHP pattern is present.
  - reference: PMID:29959430
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: exception of patients carrying either a GNAS muta- tion on the paternal allele or a PDE4D mutation in whom, apart from at diagnosis, routine assessment is not necessary.
    explanation: Recommendation 3.2 exempts paternal GNAS cases from routine repeated PTH/calcium/phosphate measurement after baseline. PDF line-break hyphenation is preserved in this exact excerpt.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
    reference_title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf

    snippet: "but no evidence of resistance to parathyroid hormone (PTH)"
    explanation: Orphanet defines PPHP by AHO clinical features without evidence of PTH resistance.
    reference_title: Pseudopseudohypoparathyroidism
  - reference: PMID:25464124
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that PTH and other hormone resistance may not be an exclusive feature of PHP-Ia and could also be observed in patients with PPHP."
    explanation: This case report supports noting that hormone resistance can occasionally complicate the classical PPHP distinction.
    reference_title: Evidence of hormone resistance in a pseudo-pseudohypoparathyroidism patient with a novel paternal mutation in GNAS
  - reference: PMID:34254228
    reference_title: Mild progressive osseous heteroplasia overlap syndrome with PTH and TSH resistance appearing during adolescence and not early childhood.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he met the diagnostic criteria for POH, and mild PTH and TSH resistance was detected"
    explanation: >
      Adds a timing caveat to the classical distinction. In this case from the
      severe end of the GNAS-inactivation spectrum, resistance was absent on
      pituitary testing at 3 years and detectable at 13 years, so a normal
      biochemical panel in childhood does not settle the question for life.
      The variant arose de novo and its parental allele was not determined,
      so the case does not itself demonstrate resistance with a proven
      paternal-allele variant.

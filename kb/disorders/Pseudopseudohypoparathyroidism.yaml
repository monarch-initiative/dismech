    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We further showed that loss of Gnas led to activation of YAP transcription activity, which directly drove Shh expression.
    explanation: Gnas-null mesenchymal cells support YAP-SHH-mediated propagation; the model is not equivalent to heterozygous PPHP.
  - reference: PMID:33574833
    reference_title: Gnas Inactivation Alters Subcutaneous Tissues in Progression to Heterotopic Ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that mutant cells in a Gnas-null tissue environment induced a robust HO response while little/no HO was detected in control hosts.
    explanation: Mutant-host transplantation experiments support a permissive non-cell-autonomous environment in a POH model.
experimental_models:
- name: Patient-derived dermal fibroblast microarrays
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Dermal fibroblast cultures from three PPHP, one PHP1A and one POH participant
  description: Affymetrix U133 Plus 2.0 comparisons across five participants identified 23 shared differentially expressed genes, including SFRP2. P2 contributes to two contrasts and is the mother of P3; age, sex, subtype, relatedness and lesion burden can confound expression. This is patient-cell omics, but not fresh-lesion single-cell lineage proof. No raw accession was identified in the inspected paper.
  modeled_mechanisms:
  - target: Dermal and subcutaneous ectopic bone formation
    relationship: MEASURES
    description: Expression correlates with lesion burden but does not isolate causal human progenitors.
    limitations: Cultured dermal fibroblasts may differ from fresh lesion progenitors. The five-person comparisons mix PPHP, PHP1A and POH and are confounded by age, sex, relatedness, lesion burden and repeated use of one participant.
    evidence:
    - reference: PMID:40256763
      reference_title: Alpha-smooth muscle actin-expressing dermal sheath cells are a major cellular contributor to heterotopic subcutaneous ossifications in a mouse model of Albright hereditary osteodystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In all 3 comparisons (P1 × P2, P3 × P2, and P4 × P5), a participant with the greater number (and size as well) of SCOs was compared to a participant with fewer or no ossifications.
      explanation: Cultured fibroblast microarrays include three PPHP participants, one PHP1A participant and one POH participant. Comparisons are small, heterogeneous and partly related, not independent patient-level replication.

    explanation: Clinical follow-up includes lesion progression.
- name: Coordinated multidisciplinary supportive management
  description: >-
    Management is coordinated across pediatric/adult endocrinology, genetics,
    orthopedics, dentistry, nutrition, and neurodevelopmental services according
    to the patient's manifestations.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Brachydactyly
    term:
      id: HP:0001156
      label: Brachydactyly
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  - preferred_term: Ectopic ossification
    term:
      id: HP:0011986
      label: Ectopic ossification
  evidence:
  - reference: PMID:29959430
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Overall, a coordinated and multidisciplinary approach from infancy through adulthood, including a transition programme, should help us to improve the care of patients affected by these disorders.
    explanation: Consensus guidance supports multidisciplinary supportive management for PHP-related disorders including PPHP.
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
- name: Physical and occupational therapy with skin care
  description: Assess fine motor function and mobility, provide appropriate footwear or orthoses when needed, and maintain skin integrity over superficial ossifications. Tailor therapy to pain or functional limitation. Routine serial imaging of asymptomatic lesions is unnecessary; image painful, function-threatening or surgically considered lesions.
  evidence:
  - reference: PMID:29959430
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Physical therapy and meticulous skin care remain the most important conservative approaches to preserve movement and to prevent cutaneous breakdown, respectively251,252.'
    explanation: Consensus recommends physical therapy and skin care for ectopic ossification; the strength of evidence is limited.
  - reference: PMID:29959430
    reference_title: 'Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Regular imaging of ectopic ossifications is not indicated
    explanation: The consensus favors symptom-directed imaging.
  treatment_term:
    preferred_term: Physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Selective excision of symptomatic superficial ossifications
  description: An experienced surgeon may remove localized superficial lesions causing irritation, pain or impaired movement. Recurrence can occur. Deep progressive ossification needs specialist reassessment for POH overlap; surgery does not correct the underlying GNAS defect.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
    reference_title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Subcutaneous ossifications that are superficial and well circumscribed may be surgically removed when they are large or cause local irritation, although they may recur.
    explanation: Surgery is selective and recurrence is possible.
  treatment_term:
    preferred_term: Excision of superficial ossifications
    term:
      id: NCIT:C15232
      label: Excision
- name: Genetic counselling and family testing
  description: 'Each child of a heterozygous carrier has a 50% chance of inheriting the variant. The sex of the transmitting parent changes the expected phenotype in the child: paternal transmission usually causes PPHP/POH/osteoma cutis, whereas maternal transmission usually causes PHP1A. Establish phase and test relatives as appropriate; discuss variable expression, de novo or mosaic variants, and reproductive testing options.'
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
    reference_title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: inactivation has a 50% chance of inheriting the parent's genetic alteration
    explanation: GeneReviews supplies transmission risk; phenotype prediction also requires imprinting and parental origin.
  treatment_term:
    preferred_term: Genetic counselling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: >-
  PPHP is a variable paternal GNAS phenotype, distinct from maternal-variant PHP1A and from deep
  progressive POH. AHO traits can emerge with age, and endocrine and neurocognitive findings require
  individual assessment. The international consensus exempts confirmed paternal GNAS cases from
  routine repeated PTH/calcium/phosphate measurement after baseline; repeat testing is appropriate
  for symptoms, abnormal baseline findings or uncertain molecular classification. Trial registration
  does not establish PPHP treatment efficacy.
differential_diagnoses:
- name: Pseudohypoparathyroidism type 1A
  description: Maternal coding GNAS variants can produce the same AHO skeletal findings.
  distinguishing_features:
  - PTH and other hormone resistance and severe early-onset obesity favor PHP1A; parental phase is decisive when findings overlap.
  evidence:
  - reference: PMID:16099856
    reference_title: A mouse model of albright hereditary osteodystrophy generated by targeted disruption of exon 1 of the Gnas gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mice that inherited the disruption maternally (-m/+) exhibited PTH and TSH resistance, whereas those with paternal inheritance (+/-p) had normal hormone responsiveness
    explanation: The exon-1 model supports the biological basis of the clinical distinction.
- name: Progressive osseous heteroplasia
  description: POH can result from paternal GNAS inactivation and share superficial ossifications with PPHP.
  distinguishing_features:
  - Progressive extension into deep fascia and skeletal muscle, often without the full AHO pattern, distinguishes POH. Overlap phenotypes occur, so it is not a predictable PPHP stage.
  evidence:
  - reference: PMID:33574833
    reference_title: Gnas Inactivation Alters Subcutaneous Tissues in Progression to Heterotopic Ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: HO typically initiates within subcutaneous soft tissues before progressing to deeper connective tissues.
    explanation: The primary POH study defines the progressive lesion phenotype; it is not evidence that all PPHP progresses deeply.
- name: Acrodysostosis due to PRKAR1A or PDE4D
  description: Other cAMP/PKA-pathway disorders cause overlapping short stature and brachydactyly.
  distinguishing_features:
  - Diffuse early brachydactyly, nasal hypoplasia and advanced bone age suggest acrodysostosis; hormone resistance varies by genotype. PRKAR1A is iPPSD4 and PDE4D is iPPSD5.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
    reference_title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: is characterized by short stature, early-onset diffuse brachydactyly, round face, nasal hypoplasia, advanced bone age, and obesity.
    explanation: GeneReviews describes the distinguishing skeletal pattern.
- name: 2q37 deletion or HDAC4-related brachydactyly-intellectual disability syndrome
  description: AHO-like dysmorphism and developmental impairment can occur without GNAS disease.
  distinguishing_features:
  - Chromosomal or HDAC4 testing identifies a separate cause; the presence of developmental impairment and brachydactyly alone is insufficient for PPHP.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
    reference_title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: which is characterized by mild-moderate developmental delay/intellectual disability, brachydactyly of digits 3-5 (often digit 4 alone), short stature, obesity, hypotonia, round facies, behavioral abnormalities, joint hypermobility/dislocation, and scoliosis.
    explanation: The GeneReviews differential includes 2q37 deletion and HDAC4-related AHO-like disease.
- name: Isolated brachydactyly type E
  description: HOXD13 or PTHLH variants can produce shortened metacarpals and metatarsals.
  distinguishing_features:
  - Ectopic ossification and intellectual disability are generally absent in the isolated phenotype; molecular testing distinguishes these pathway-related conditions.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK459117/
    reference_title: Disorders of GNAS Inactivation - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Some individuals have moderate short stature and round facies but do not have ectopic ossification or intellectual disability.
    explanation: The isolated brachydactyly differential lacks key extraskeletal features.
progression:
- phase: Prenatal and childhood growth abnormalities
  notes: Intrauterine growth restriction can precede recognizable AHO. Brachydactyly and short stature evolve with skeletal maturation rather than necessarily being complete at birth.
  evidence:
  - reference: PMID:23884777
    reference_title: Paternal GNAS mutations lead to severe intrauterine growth retardation (IUGR) and provide evidence for a role of XLαs in fetal development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous GNAS mutations on either parental allele were associated with IUGR.
    explanation: The birth-parameter cohort documents prenatal involvement.
- phase: Variable lifelong superficial ossification burden
  notes: Superficial ossification burden can increase with age, with substantial variability within and between families. Deep progressive extension indicates a POH or overlap phenotype and is not an obligatory PPHP trajectory.
  evidence:
  - reference: PMID:29059381
    reference_title: 'Ossifications in Albright Hereditary Osteodystrophy: Role of Genotype, Inheritance, Sex, Age, Hormonal Status, and BMI.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Males are affected more extensively than females, and the SCOs tend to worsen with age.
    explanation: Longitudinal clinical assessment supports age-related lesion burden.
animal_models:
- name: Parent-specific heterozygous Gnas exon-1 mouse
  species: Mouse
  genotype: GnasE1+/- with maternal or paternal inheritance
  description: Exon-1 disruption separates Gs-alpha from other locus transcripts. Both parental forms develop superficial ossifications, while endocrine and metabolic phenotypes depend on parental origin. Later bone-remodeling differences were predominantly female and should not be converted into an established human PPHP osteoporosis phenotype.
  modeled_mechanisms:
  - target: Reduced Gs-alpha dosage in biallelic tissues
    relationship: PARTIALLY_RECAPITULATES
    description: Exon-1 heterozygosity models partial Gs-alpha loss; expression studies identify biallelic tissues.
    limitations: Species, zygosity and tissue context limit direct extrapolation to human heterozygous PPHP.
    evidence:
    - reference: PMID:16099856
      reference_title: A mouse model of albright hereditary osteodystrophy generated by targeted disruption of exon 1 of the Gnas gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Galphas protein and mRNA expression was consistent with paternal imprinting in the renal cortex and thyroid, but there was no imprinting in renal medulla, heart, or adipose.
      explanation: The exon-1 study directly evaluates tissue-specific Gs-alpha expression in the described model; the separate exon-2 chimera is not used as its experimental provenance.
  - target: Dermal and subcutaneous ectopic bone formation
    relationship: PARTIALLY_RECAPITULATES
    description: Both parental forms develop AHO-like ectopic bone.
    limitations: Species, zygosity and tissue context limit direct extrapolation to human heterozygous PPHP.
    evidence:
    - reference: PMID:21747923
      reference_title: Heterotopic ossifications in a mouse model of albright hereditary osteodystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Gnas(E1-/+) mice develop SCO features that are similar to those observed in AHO patients
      explanation: Heterozygous Gnas exon-1 mice reproduce superficial ectopic bone.
  evidence:
  - reference: PMID:35079678
    reference_title: Parental Origin of Gsα Inactivation Differentially Affects Bone Remodeling in a Mouse Model of Albright Hereditary Osteodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: GnasE1+/-p mice exhibited reduced bone parameters due to impaired bone formation and enhanced bone resorption.
    explanation: Predominantly female mouse effects show that a universal complete-knockout bone model is inadequate.
  - reference: PMID:21747923

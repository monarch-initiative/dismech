discussions:
- discussion_id: pphp_digit_selectivity_gap
  prompt: >-
    Why does Gs-alpha haploinsufficiency shorten the 4th and 5th metacarpals
    and metatarsals preferentially, when the Gs-alpha reduction is uniform
    across the growth plates of every ray?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#AHO skeletal and soft-tissue developmental effects
  - phenotypes#Brachydactyly
  rationale: >-
    The chondrocyte evidence behind this entry is ray-agnostic. Biallelic
    Gs-alpha expression was measured across growth-plate chondrocytes
    generally (PMID:15459318), and chondrocyte-specific ablation produced
    generalised epiphyseal and growth-plate defects (PMID:15765186). Neither
    experiment says anything about why the AHO hand phenotype is selective
    for particular rays, yet that selectivity is what makes brachydactyly
    diagnostically useful and is curated here as five separate ray-specific
    phenotypes. No digit-resolved PTHrP or Gs-alpha expression data exist for
    human or mouse autopod, so the step from pathway dosage to the observed
    pattern is currently unexplained rather than merely unmeasured.
  proposed_experiments:
  - experiment_id: exp_pphp_digit_resolved_growth_plate_profiling
    name: Ray-resolved growth-plate profiling in an AHO mouse model
    description: >-
      Microdissect metacarpal and phalangeal growth plates ray by ray from
      Gnas exon 1 heterozygous mice and littermate controls, and compare
      Gs-alpha protein, cAMP, and PTHrP-target-gene expression across rays at
      the stage when digit length divergence begins.
    decision_criterion: >-
      A ray-graded difference in Gs-alpha dosage or PTHrP pathway output that
      matches the human 4th/5th-ray pattern would locate the selectivity in
      the pathway itself; a uniform profile would place it in a downstream or
      ray-identity mechanism instead.
  - experiment_id: exp_pphp_human_tissue_gsalpha_quantification
    name: Gs-alpha quantification in human AHO skeletal tissue
    description: >-
      Measure Gs-alpha protein and transcript levels in cartilage and bone
      obtained at orthopaedic procedures from genotyped PPHP and PHP1A
      patients, against age-matched controls.
    decision_criterion: >-
      Confirming roughly 50% Gs-alpha in human AHO cartilage would carry the
      mouse dosage result into human tissue for the first time; a different
      value would mean the human lesion is not a straightforward one-allele
      reduction.
- discussion_id: pphp_ossification_model_dosage_mismatch
  prompt: >-
    Does the Hedgehog-driven mechanism established in homozygous and
    conditional-null POH mouse models actually operate in heterozygous PPHP
    soft tissue, or does PPHP ossification arise by a different route?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hedgehog derepression in mesenchymal progenitors
  rationale: >-
    Every causal step in the Hedgehog account comes from complete loss of
    Gs-alpha. Sufficiency and pharmacological rescue were shown after
    limb-mesenchyme or adult subcutaneous Gnas deletion, the secreted-SHH
    expansion loop was demonstrated in Gnas-null cells, and lesion formation
    required a Gnas-null host environment. The authors of the first of these
    studies note that heterozygous Gnas mice develop only osteoma cutis late
    in life, which is why they went to a homozygous model in the first place
    — and heterozygous, late, cutaneous disease is precisely the PPHP
    phenotype. Two readings follow, with different consequences. Either the
    same pathway runs at lower gain in PPHP, in which case Hedgehog
    inhibitors already in clinical use for other indications are a rational
    candidate for AHO ossification; or PPHP ossification is driven by
    something else, and the POH mechanism describes only the severe end of
    the spectrum. Human evidence sits between the two: Hedgehog signaling is
    upregulated in POH lesion tissue, but no equivalent measurement exists
    for a PPHP subcutaneous ossification.
  proposed_experiments:
  - experiment_id: exp_pphp_hedgehog_activity_in_human_lesions
    name: Hedgehog pathway activity in PPHP versus POH lesion tissue
    description: >-
      Assay GLI target-gene expression and Hedgehog pathway protein readouts
      in surgically excised subcutaneous ossifications from genotyped PPHP
      patients alongside POH lesions and non-lesional skin.
    would_support:
    - pathophysiology#Hedgehog derepression in mesenchymal progenitors
    supporting_outcome:
    - >-
        Hedgehog pathway activation in PPHP lesions comparable in kind, if not
        degree, to POH lesions.
    refuting_outcome:
    - >-
        Absent Hedgehog activation in PPHP lesions despite unambiguous ectopic
        bone would confine this node to the homozygous POH end of the spectrum.
  - experiment_id: exp_pphp_heterozygous_hedgehog_inhibition
    name: Hedgehog inhibition in a heterozygous AHO mouse model
    description: >-
      Treat Gnas exon 1 heterozygous mice, which develop subcutaneous
      ossifications with age, with a smoothened inhibitor and quantify
      ossification burden against vehicle controls.
    decision_criterion: >-
      Reduced ossification at heterozygous gene dosage would show the pathway
      is rate-limiting at the dosage PPHP patients actually have, which the
      published homozygous rescue experiments cannot establish.
- discussion_id: gnas_mixed_function_variant_scope
  prompt: >-
    Should GNAS missense variants with mixed receptor-specific gain- and
    loss-of-function behaviour be curated inside the PPHP parent-of-origin
    model, or as a separate entity?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#pphp_parent_of_origin_model
  - genetic#GNAS
  rationale: >-
    A small number of germline GNAS missense variants act as constitutive,
    ligand-independent activators at one receptor while blunting
    ligand-dependent signaling at another. Carriers present with nephrogenic
    syndrome of inappropriate antidiuresis, precocious puberty, or osteolytic
    metaphyseal bone disease rather than with AHO, and at least two reported
    variants sat on the paternal allele. These are not counterexamples to the
    parent-of-origin model, which is stated for coding loss-of-function
    variants, but they do mean a paternal GNAS missense variant cannot be
    assumed to be loss-of-function on position alone. The practical question
    for this entry is whether a scope sentence on the hypothesis is enough or
    whether the mixed-function phenotypes need their own entry; the frequency
    of such variants among GNAS missense findings has never been measured,
    which is what makes the question hard to settle.
  evidence:
  - reference: PMID:30312418
    reference_title: A New Multisystem Disorder Caused by the Gαs Mutation p.F376V.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies demonstrated that Gαs-F376V enhanced ligand-independent signaling at the PTH1R, LHCGR, and V2R and, at the same time, blunted ligand-dependent responses."
    explanation: >
      The original demonstration that one GNAS missense variant can be
      activating and inactivating at once, depending on receptor and on
      whether ligand is present. This variant was maternal, so it establishes
      the phenomenon rather than the paternal-allele case.
  - reference: PMID:40172207
    reference_title: Germline-derived GNAS-Gsα variants associated with both gain-of-function and loss-of-function phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the mothers, with the variant in her paternal allele, presented NSIAD."
    explanation: >
      Places a mixed-function variant on the paternal allele in a carrier who
      presented with inappropriate antidiuresis rather than with AHO, which is
      the observation that makes this a scope question for the PPHP model.
  - reference: PMID:41530545
    reference_title: De novo GNAS-Gsα variant (p.Thr55Ala) with constitutive gain-of-function effects on AVPR2 and PTH1R signalings.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Luciferase assays for p.Thr55Ala showed ligand-independent GOF effects on AVPR2 and PTH1R signalings, and a ligand-dependent loss-of-function (LOF) effect on PTH1R signaling."
    explanation: >
      A second paternal-allele variant with the same dual behaviour, assayed
      receptor by receptor, in a patient with osteolytic metaphyseal bone
      disease rather than AHO.
notes: >-
  Classical PPHP is distinguished from PHP1A by absent PTH resistance despite
  overlapping Albright hereditary osteodystrophy features. Rare case-level
  evidence indicates that PTH or other hormone resistance can occur in patients
  with paternally inherited GNAS variants, so biochemical follow-up remains
  appropriate.

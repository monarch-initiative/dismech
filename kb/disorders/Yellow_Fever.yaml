- name: Supportive Care
  description: >-
    No licensed specific antiviral drug is available for yellow fever; clinical
    management of the toxic phase relies on intensive supportive care for
    hemorrhage, hepatic failure, and renal failure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

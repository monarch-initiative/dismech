diagnosis:
- name: Laboratory Confirmation of Yellow Fever Virus Infection
  description: >-
    Laboratory confirmation of yellow fever virus infection by molecular testing,
    serology, antigen detection, or viral culture, typically performed at
    specialized reference laboratories.
  diagnosis_term:
    preferred_term: laboratory examination
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:30021822
    reference_title: "Yellow Fever Virus: Diagnostics for a Persistent Arboviral Threat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A number of diagnostic methods and assays have been described for the detection of YFV infection, including viral culture, molecular testing, serology, and antigen detection. Commercial diagnostics are not widely available, and testing is generally performed at a small number of reference laboratories."
    explanation: Documents the specific laboratory diagnostic modalities used to confirm yellow fever virus infection (molecular testing, serology, antigen detection, and viral culture).
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

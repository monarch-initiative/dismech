name: Yellow Fever
creation_date: '2026-10-25T20:05:00Z'
category: Infectious Disease
description: >-
  Yellow fever is a mosquito-borne viral hemorrhagic fever caused by yellow
  fever virus, an orthoflavivirus endemic to tropical and subtropical regions of
  Africa and South America and transmitted by Aedes, Haemogogus, and Sabethes
  mosquitoes. Following dermal inoculation, the virus infects dendritic cells,
  amplifies in draining lymph nodes, and disseminates via the bloodstream to the
  liver, where viral cytopathic replication and an unbalanced pro- and
  anti-inflammatory cytokine response (TNF-alpha, TGF-beta) drive hepatocyte
  apoptosis, lytic necrosis, steatosis, consumptive and synthetic coagulopathy,
  endothelial dysfunction, and in 20% to 60% of symptomatic patients a toxic
  phase marked by jaundice, hemorrhage, thrombocytopenia, and hepatic and renal
  failure.
disease_term:
  preferred_term: yellow fever
  term:
    id: MONDO:0020502
    label: yellow fever
parents:
- Arbovirus Infection
- Viral Hemorrhagic Fever
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
synonyms:
- Sylvan yellow fever
- Urban yellow fever
- Yellow jack
infectious_agent:
- name: Yellow fever virus
  description: >-
    Enveloped, single-stranded positive-sense RNA virus (~11 kb genome encoding
    three structural proteins Core, PrM, and E and seven nonstructural proteins
    NS1 through NS5) in the family Flaviviridae.
  infectious_agent_term:
    preferred_term: Yellow fever virus
    term:
      id: NCBITaxon:3046277
      label: Orthoflavivirus flavi
  evidence:
  - reference: PMID:25453327
    reference_title: "Yellow fever."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Yellow fever, a mosquito-borne flavivirus disease occurs in tropical areas of South America and Africa."
    explanation: Identifies yellow fever as a mosquito-borne flavivirus disease in tropical South America and Africa.
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "YFV is an enveloped virus that contains a single-stranded, positive-sense RNA genome of about 11,000 nucleotides"
    explanation: Describes the genome and virion structure of yellow fever virus.
agent_life_cycle:
  description: >-
    Yellow fever virus circulates primarily in sylvatic (jungle) cycles between
    non-human primates and forest canopy mosquitoes (Haemagogus and Sabethes in
    South America, sylvatic Aedes species in Africa), in intermediate (savannah)
    cycles in Africa, and in urban cycles between viremic humans (who serve as
    amplifying rather than dead-end hosts) and anthropophilic Aedes aegypti
    mosquitoes.
  hosts:
  - preferred_term: non-human primates
    term:
      id: NCBITaxon:9443
      label: Primates
    role: sylvatic reservoir host
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: amplifying host in urban cycle
  - preferred_term: Aedes aegypti
    term:
      id: NCBITaxon:7159
      label: Aedes aegypti
    role: urban mosquito vector
  - preferred_term: Haemagogus
    term:
      id: NCBITaxon:7180
      label: Haemagogus <genus>
    role: sylvatic mosquito vector
  - preferred_term: Sabethes
    term:
      id: NCBITaxon:53551
      label: Sabethes
    role: sylvatic mosquito vector
  - preferred_term: sylvatic Aedes species
    term:
      id: NCBITaxon:7158
      label: Aedes <genus>
    role: sylvatic mosquito vector in Africa
  vectors:
  - Aedes aegypti
  - Haemagogus mosquitoes
  - Sabethes mosquitoes
  - sylvatic Aedes mosquitoes
  notes: >-
    NCBITaxon:9443 (Primates) is bound for the non-human primate sylvatic reservoir
    because NCBI Taxonomy is strictly monophyletic and defines no non-human-primate
    clade excluding Homo (OLS NCBITaxon searches for "non-human primate" and
    "nonhuman primate" return only viral taxa); human urban-cycle amplification is
    modeled separately under NCBITaxon:9606.
  evidence:
  - reference: PMID:31668201
    reference_title: "Viral Hemorrhagic Fevers Other than Ebola and Lassa."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Zoonotic cycle involving sylvatic mosquitoes (Haemogogus and Sabethes in South America, Aedes in Africa) and nonhuman primates occurs in tropical forests, where humans can be accidentally bitten by sylvatic mosquitoes that previously fed on a viremic monkey (jungle yellow fever)."
    explanation: Documents the geographic split of sylvatic yellow fever vectors between Haemogogus and Sabethes in South America and sylvatic Aedes in Africa alongside non-human primate reservoir hosts.
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "YFV mostly circulates in a sylvatic (or jungle) cycle between mosquitoes and non-human primates (NHPs). However, human encroachment into more rural areas can introduce YFV into urbanized areas (urban cycle), resulting in human-to-human viral circulation via anthropophilic mosquitoes"
    explanation: Documents both the sylvatic mosquito-non-human-primate reservoir cycle and urban human-mosquito-human circulation.
  - reference: PMID:29262028
    reference_title: "Yellow Fever."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Unlike many other mosquito-transmitted viruses, infected humans are not dead-end hosts and may infect mosquitoes during periods of viremia and spread the virus."
    explanation: Establishes that viremic humans act as amplifying hosts capable of infecting feeding mosquitoes.
transmission:
- name: Mosquito vector transmission (Haemogogus, Sabethes, and Aedes genera)
  description: >-
    Transmitted to humans through the bite of infected mosquitoes of the
    Haemogogus, Sabethes, and Aedes genera across sylvatic, intermediate, and
    urban transmission cycles.
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Endemic to tropical and sub-tropical regions of South America and Africa, YFV is transmitted to humans via mosquitoes of the Haemogogus, Sabethes and Aedes genera."
    explanation: Identifies the three mosquito genera responsible for transmitting yellow fever virus to humans.
prevalence:
- population: Global endemic regions (tropical Africa and South America)
  measure_type: ANNUAL_INCIDENCE
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Estimated 80,000 to 200,000 yellow fever cases and 30,000 to 60,000
    fatalities annually worldwide, with a case fatality rate of 20% to 60% in
    the toxic phase.
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Annually, there are approximately 80,000–200,000 YFV cases worldwide. The number of fatalities annually is commonly estimated as 30,000–60,000, with a case fatality rate (CFR) ranging from 20–60%"
    explanation: Provides global annual case and fatality estimates and the 20% to 60% case fatality rate.
progression:
- phase: Incubation and Acute Febrile Phase (Period of Infection)
  duration: 3 to 6 days incubation followed by acute flu-like febrile phase
  notes: >-
    Following an infected mosquito bite and a 3- to 6-day incubation period,
    patients develop acute onset of fever and flu-like symptoms driven by
    primary and secondary viremia.
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following the bite of an infected mosquito, individuals typically experience an incubation period of 3 to 6 days, subsequently displaying flu-like symptoms prior to a remission period of 1 to 2 days."
    explanation: Documents the 3- to 6-day incubation period and subsequent acute febrile flu-like phase.
- phase: Period of Remission
  duration: 1 to 2 days
  notes: >-
    Transient defervescence and clinical improvement lasting 1 to 2 days, after
    which most patients recover while 20% to 60% progress to the toxic phase.
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following the bite of an infected mosquito, individuals typically experience an incubation period of 3 to 6 days, subsequently displaying flu-like symptoms prior to a remission period of 1 to 2 days."
    explanation: Documents the 1- to 2-day remission period between the acute febrile phase and the toxic phase.
- phase: Toxic Hepatorenal and Hemorrhagic Phase (Period of Intoxication)
  notes: >-
    Approximately 20% to 60% of symptomatic patients relapse into a severe
    toxic phase characterized by recurrence of fever, jaundice,
    thrombocytopenia, hemorrhagic manifestations, and hepatic and renal failure
    (case fatality rate 20% to 60%).
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following remission, some patients (20–60%) progress to a more toxic phase of disease, characterized by hemorrhagic fever, jaundice, thrombocytopenia, liver and renal failure"
    explanation: Characterizes the toxic phase of yellow fever that follows the remission period in 20% to 60% of patients.
pathophysiology:
- name: Dermal Dendritic Cell Infection, Lymphatic Amplification, and Systemic Viremia
  description: >-
    Following inoculation of yellow fever virus from mosquito salivary glands
    into the dermis, virions attach via heparan sulfate glycosaminoglycans,
    enter cutaneous dendritic cells by clathrin-mediated endocytosis, and
    traffic to draining lymph nodes where viral replication amplifies and seeds
    systemic viremia reaching the liver, spleen, heart, and kidneys.
  role: trigger
  biological_scale: CELLULAR
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: viral entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Current models suggest that after YFV transmission from the mosquito salivary glands to the host’s dermal environment, the virus infects DCs and circulates to the lymph nodes"
    explanation: Establishes dermal dendritic cell infection and lymphatic dissemination to regional lymph nodes.
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this tissue, YFV amplifies and primes the cellular immune response before spreading through the peripheral blood, ultimately reaching the liver for active replication."
    explanation: Documents viral amplification in lymph nodes followed by hematogenous spread to the liver.
  downstream:
  - target: Hepatocyte Apoptosis, Lytic Necrosis, and Cytokine-Driven Hepatotoxicity
    description: Hematogenous dissemination delivers high-titer virus to the liver, where hepatocytes and Kupffer cells are infected.
    causal_link_type: DIRECT
  - target: Endothelial Activation and Increased Vascular Permeability
    description: High-titer viremia and pro-inflammatory mediator release act on vascular endothelial cells to induce vasculopathy and capillary leakage.
    causal_link_type: DIRECT
  - target: Fever
    description: Acute systemic viremia and innate cytokine release trigger the initial febrile flu-like phase.
- name: Hepatocyte Apoptosis, Lytic Necrosis, and Cytokine-Driven Hepatotoxicity
  description: >-
    In the liver, yellow fever virus replicates extensively in hepatocytes and
    Kupffer cells, inducing direct cytopathic hepatocyte apoptosis (Councilman
    bodies), lytic necrosis, and microvesicular steatosis, compounded by an
    unbalanced intrahepatic cytokine storm driven by TNF-alpha, IFN-gamma, and
    pro-apoptotic TGF-beta from infiltrating CD4+ T cells and activated
    macrophages.
  role: amplifier
  biological_scale: TISSUE
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this main target organ, YFV induces hepatocyte apoptosis and lytic necrosis, which, combined with steatosis, results in most of the liver damage observed during infection"
    explanation: Establishes hepatocyte apoptosis, lytic necrosis, and steatosis as the primary drivers of liver injury in yellow fever.
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition to the virus-induced cytopathic effect, several studies suggest that the immune response itself, via a systemic and unbalanced cytokine response (or cytokine storm), is a major driver of hepatotoxicity and YF disease"
    explanation: Documents the systemic and intrahepatic cytokine storm as a major driver of hepatotoxicity in severe yellow fever.
  downstream:
  - target: Hepatic failure
    description: Extensive hepatocyte apoptosis, necrosis, and steatosis cause acute hepatic failure and loss of coagulation factor synthesis.
  - target: Jaundice
    description: Hepatocellular necrosis and cholestasis produce severe hyperbilirubinemia and clinical jaundice, from which the disease takes its name.
  - target: Coagulopathy
    description: Acute hepatocellular destruction impairs hepatic synthesis of vitamin K-dependent and labile clotting factors, contributing to toxic-phase coagulopathy.
    evidence:
    - reference: PMID:31668201
      reference_title: "Viral Hemorrhagic Fevers Other than Ebola and Lassa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "This final stage is characterized by thrombocytopenia, coagulation abnormalities, deficiency of liver clotting factors and elevated levels of fibrin split products, which indicate disseminated intravascular coagulation (DIC)."
      explanation: Directly documents deficiency of liver clotting factors and coagulation abnormalities during the final toxic stage of yellow fever.
- name: Endothelial Activation and Increased Vascular Permeability
  conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability
  description: >-
    Wild-type yellow fever virus infects vascular endothelial cells and induces
    a prolonged pro-inflammatory cytokine response that, together with systemic
    cytokine storm and hepatic synthesis failure of clotting factors, disrupts
    endothelial barrier integrity, increases vascular permeability, and leads to
    vasculopathy, capillary leak, thrombocytopenia, hemorrhagic manifestations,
    acute kidney injury, and shock during the toxic phase.
  role: central_effector
  biological_scale: TISSUE
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: ABNORMAL
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  - preferred_term: endothelial cell activation
    modifier: INCREASED
    term:
      id: GO:0042118
      label: endothelial cell activation
  evidence:
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In primary human vascular endothelial cells, Kupffer cells, MDMs and monocyte-derived dendritic cells (MoDCs), YFV-Asibi causes a greater, more prolonged pro-inflammatory response than YFV-17D"
    explanation: Demonstrates that virulent wild-type YFV-Asibi directly elicits a prolonged pro-inflammatory response in primary human vascular endothelial cells.
  - reference: PMID:29933925
    reference_title: "Yellow Fever Virus: Knowledge Gaps Impeding the Fight Against an Old Foe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following remission, some patients (20–60%) progress to a more toxic phase of disease, characterized by hemorrhagic fever, jaundice, thrombocytopenia, liver and renal failure"
    explanation: Links toxic-phase progression to hemorrhagic fever, thrombocytopenia, vasculopathy, and multi-organ dysfunction.
  - reference: PMID:41734218
    reference_title: "[Viral hemorrhagic fevers: Pathogenesis, epidemiology and clinical manifestations]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Their pathogenesis is characterized by early failure of antiviral immunity, high viremia, endothelial dysfunction, capillary leak, and coagulopathy."
    explanation: Places yellow fever within the shared viral hemorrhagic fever pathway of endothelial dysfunction, capillary leak, and coagulopathy.
  downstream:
  - target: Coagulopathy
    description: Endothelial activation and systemic pro-inflammatory signaling trigger consumptive coagulation cascade abnormalities alongside hepatic factor depletion.
    evidence:
    - reference: PMID:31668201
      reference_title: "Viral Hemorrhagic Fevers Other than Ebola and Lassa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "This final stage is characterized by thrombocytopenia, coagulation abnormalities, deficiency of liver clotting factors and elevated levels of fibrin split products, which indicate disseminated intravascular coagulation (DIC)."
      explanation: Documents consumptive disseminated intravascular coagulation with elevated fibrin split products alongside hepatic clotting factor deficiency in toxic-phase yellow fever.
  - target: Abnormal bleeding
    description: Endothelial barrier dysfunction, thrombocytopenia, and hepatic coagulation-factor depletion produce mucosal and gastrointestinal hemorrhage.
  - target: Thrombocytopenia
    description: Platelet consumption and bone marrow suppression during the toxic phase cause severe thrombocytopenia.
  - target: Acute kidney injury
    description: Intravascular volume depletion, vasculopathy, and direct tubular injury lead to acute renal failure in the toxic phase.

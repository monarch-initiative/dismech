    explanation: Documents laboratory confirmation as the diagnostic standard for identifying imported yellow fever cases.
treatments:
- name: Live-Attenuated Yellow Fever 17D Vaccine (YF-VAX / Stamaril)
  description: >-
    Single subcutaneous dose of live-attenuated yellow fever 17D vaccine (or a
    one-fifth fractional dose during emergency mass-vaccination campaigns)
    induces serum neutralizing antibodies within 2 weeks in most vaccinees and
    provides decades-long protective immunity via persistent memory B cells and
    polyfunctional CD8+ T cells. Rare serious adverse events include yellow
    fever vaccine-associated viscerotropic disease (YEL-AVD; 0.4 per 100,000
    doses, CFR 63%) and vaccine-associated neurotropic disease (YEL-AND; 0.8 per
    100,000 doses), which are linked to host genetic defects in innate antiviral
    immunity (such as type I/III IFN pathway defects).
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: Yellow Fever Vaccine
      term:
        id: NCIT:C96396
        label: Yellow Fever Vaccine
  target_mechanisms:
  - target: Dermal Dendritic Cell Infection, Lymphatic Amplification, and Systemic Viremia
    treatment_effect: INHIBITS
    description: >-
      Vaccine-elicited neutralizing IgG antibodies and memory CD8+ T cells
      neutralize incoming wild-type yellow fever virus and prevent systemic
      viremia and hepatic dissemination.

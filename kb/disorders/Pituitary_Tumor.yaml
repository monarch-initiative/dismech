discussions:
- discussion_id: pitnet_benign_malignant_boundary
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Clonal Expansion of an Adenohypophyseal Cell Lineage"
  prompt: >-
    How should a tumor that is histologically benign, frequently locally invasive, and
    only rarely metastatic be represented — and what predicts which one a given tumor
    is?
  rationale: >-
    Pituitary adenomas are overwhelmingly benign yet a substantial minority invade the
    cavernous sinus or recur after resection, while true carcinoma is defined only
    retrospectively by metastasis. The 2017 WHO revision eliminated the "atypical
    adenoma" category, which had been the attempt to predict aggressive behaviour from
    proliferative markers, on the explicit grounds that the evidence did not support it
    — so the field currently has no validated prospective predictor. The renaming to
    PitNET is itself an argument about this boundary rather than a cosmetic change. For
    dismech this determines whether aggressive-but-non-metastatic disease is a subtype,
    a severity qualifier, or a separate entity; none of the three is asserted here.
  evidence:
  - reference: PMID:29687298
    reference_title: "The 2017 WHO classification of pituitary adenoma: overview and comments."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "One is that the term \"atypical adenoma,\" which was characterized based on highly proliferative properties to predict adenomas that carry a poor prognosis, was completely eliminated due to the lack of definitive evidence."
    explanation: >-
      Records the elimination of the atypical adenoma category and the stated reason —
      lack of definitive evidence — which is the gap itself.

notes: >
  Scope. A root entry over a subtree populated mainly by germline-predisposition entries.
  It binds MONDO:0017611 and carries the lineage classification axis and the
  secretion-versus-mass-effect split once. Per-gene mechanism stays in the existing
  entries, several of which currently have an unbound `disease_term`.

  Subtype axis. `has_subtypes` follows the adenohypophyseal cell lineage where MONDO has
  a matching term for the secretory phenotype, plus the non-functioning group, the
  posterior pituitary lineage, and carcinoma. Note the axis is stated in lineage terms
  (PIT1/TPIT/SF-1) while the bound MONDO terms are hormone-defined — these correspond
  closely but not exactly, since one lineage can give rise to several hormone
  phenotypes, and PIT1 covers the somatotroph, lactotroph and thyrotroph subtypes at
  once. Gonadotroph tumors are represented through the non-functioning category rather
  than separately, because that is how they nearly always present.

  Terminology. "Pituitary neuroendocrine tumor" (PitNET) is recorded as a synonym rather
  than as the entry name, since MONDO:0017611 is labelled "pituitary tumor" and the
  adenoma terminology remains in wide clinical use. The renaming is an unsettled
  argument about the benign/malignant boundary, not a settled fact; see the
  `pitnet_benign_malignant_boundary` discussion.

  Treatment scoping. Because management is strongly subtype-dependent — dopamine
  agonists first-line for lactotroph tumors, transsphenoidal surgery first-line for
  somatotroph, corticotroph, and symptomatic mass-effect tumors, somatostatin receptor
  ligands for somatotroph hypersecretion, and postoperative/salvage radiotherapy for
  residual or recurrent disease — each treatment carries an explicit `context`
  restricting its indication to the relevant lineage or clinical presentation.


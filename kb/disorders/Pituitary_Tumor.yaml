- name: Somatostatin Receptor Ligand Therapy (Octreotide / Lanreotide)
  description: >-
    Injectable or oral somatostatin receptor ligands (octreotide, lanreotide) suppress
    autonomous growth hormone secretion and normalize IGF-I in somatotroph pituitary
    tumors (acromegaly), used postoperatively for persistent disease or as primary
    medical therapy in selected patients.
  context: Somatotroph (GH-secreting) pituitary tumors
  therapeutic_modality: PEPTIDE

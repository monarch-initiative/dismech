pathophysiology:
- name: Clonal Expansion of an Adenohypophyseal Cell Lineage
  biological_scale: CELLULAR
  role: trigger
  description: >-
    A pituitary tumor begins as a monoclonal expansion of one adenohypophyseal cell
    type, and which type it is determines nearly everything downstream. Lineage is
    specified by transcription factors — PIT1 for the somatotroph, lactotroph and
    thyrotroph lineages, TPIT for corticotroph, SF-1 for gonadotroph — and the tumor
    retains the identity of its cell of origin, including its secretory programme.
    Drivers differ by lineage: somatic GNAS activating variants and germline AIP or
    GPR101 lesions in somatotroph tumors, somatic USP8 variants in corticotroph tumors.
    Posterior pituitary tumors arise from pituicytes instead and fall outside this
    scheme.
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  genes:
  - preferred_term: POU1F1
    term:
      id: hgnc:9210
      label: POU1F1
  - preferred_term: NR5A1
    term:
      id: hgnc:7983
      label: NR5A1
  - preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  - preferred_term: USP8
    term:
      id: hgnc:12631
      label: USP8
  evidence:
  - reference: PMID:29687298
    reference_title: "The 2017 WHO classification of pituitary adenoma: overview and comments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other change is the introduction of more precise cell lineage-based classification of pituitary adenoma that is defined based on lineage-specific transcription factors and hormones produced."
    explanation: >-
      States that the classification is cell-lineage-based and defined by
      lineage-specific transcription factors together with the hormones produced.
  - reference: PMID:37074863
    reference_title: >-
      Transcription Factor Immunohistochemistry in the Classification of Pituitary
      Neuroendocrine Tumor/Adenomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 356 tumors were classified as per expression of pituitary hormones and transcription factors T-box family member TBX19 (TPIT), pituitary-specific POU-class homeodomain (PIT1), and steroidogenic factor-1 (SF-1)."
    explanation: >-
      Names the three lineage-determining transcription factors used to assign lineage
      in practice, in a series of 356 classified tumors.
  downstream:
  - target: Autonomous Pituitary Hormone Secretion
    causal_link_type: DIRECT
    description: >-
      A tumor of a secretory lineage continues to make the hormone of its cell of
      origin, so hormone output follows lineage. This is the functioning arm, and it is
      why a tumor of only a few millimetres can cause severe systemic disease. The
      further step — that the secretion escapes normal hypothalamic and feedback
      restraint — is standard endocrine teaching but is not carried by the citation
      here, so it is not asserted as an evidenced claim.
    evidence:
    - reference: PMID:29687298
      reference_title: "The 2017 WHO classification of pituitary adenoma: overview and comments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The other change is the introduction of more precise cell lineage-based classification of pituitary adenoma that is defined based on lineage-specific transcription factors and hormones produced."
      explanation: >-
        Ties the classification to the hormones produced, establishing that hormone
        output follows the lineage of the expanded cell.
  - target: Sellar Mass Effect
    causal_link_type: DIRECT
    description: >-
      Growth within the bony confines of the sella compresses adjacent structures
      regardless of secretory status. In non-functioning tumors this is the only route
      to symptoms, so they present later and larger.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Headache was present in 67 (59.8%) patients, followed by visual field defects (40; 35.7%), galactorrhea (26; 23.2%), and fatigue (19; 17.0%)."
      explanation: >-
        Headache and visual field defects are the two commonest presenting features in
        the cohort, which is the clinical signature of mass effect.

- name: Autonomous Pituitary Hormone Secretion
  biological_scale: ORGANISM
  role: central_effector
  description: >-
    Unregulated secretion of the lineage's hormone produces a defined endocrine
    syndrome: prolactin gives galactorrhoea, amenorrhoea and infertility; growth hormone
    gives acromegaly or gigantism; ACTH gives Cushing disease; TSH gives central
    hyperthyroidism. The syndrome, not the tumor size, is usually what brings the
    patient to attention, and prolactinomas are the commonest.
  biological_processes:
  - preferred_term: hormone secretion
    term:
      id: GO:0046879
      label: hormone secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
      Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly half (51; 45.5%) of adenomas were prolactinomas while 46 (41.1%) were non-functioning adenomas, and seven (6.3%) were growth hormone-secreting adenomas while six (5.4%) were adrenocorticotropic hormone secreting adenomas."
    explanation: >-
      Gives the subtype distribution in a consecutive cohort — prolactinomas commonest,
      then non-functioning, then GH- and ACTH-secreting tumors.

- name: Sellar Mass Effect
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Expansion within the sella compresses the optic chiasm above and the normal
    pituitary around it. Chiasmal compression produces a characteristic bitemporal
    visual field defect; compression of residual normal gland produces hypopituitarism.
    Headache is the commonest single symptom.
  locations:
  - preferred_term: pituitary gland
    term:
      id: UBERON:0000007
      label: pituitary gland
  evidence:
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
      Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Headache was present in 67 (59.8%) patients, followed by visual field defects (40; 35.7%), galactorrhea (26; 23.2%), and fatigue (19; 17.0%)."
    explanation: >-
      Quantifies headache and visual field defects as the leading presenting features.


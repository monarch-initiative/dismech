has_subtypes:
- name: Lactotroph
  display_name: Lactotroph Tumor (Prolactinoma, PIT1 lineage)
  classification: histologic
  description: >-
    The commonest functioning pituitary tumor. PIT1-lineage, prolactin-secreting;
    presents with galactorrhoea, amenorrhoea and infertility in women and with
    hypogonadism or mass effect in men. Distinctive in being the one pituitary tumor
    for which medical therapy — dopamine agonists — is first-line rather than surgery.
  subtype_term:
    preferred_term: prolactin producing pituitary tumor
    term:
      id: MONDO:0003430
      label: prolactin producing pituitary tumor
- name: Somatotroph
  display_name: Somatotroph Tumor (GH-secreting, PIT1 lineage)
  classification: histologic
  description: >-
    PIT1-lineage, growth-hormone-secreting, causing acromegaly in adults and gigantism
    before epiphyseal fusion. The cAMP-PKA axis is the recurrent driver route — somatic
    GNAS activating variants, germline AIP and GPR101 lesions — which is curated in
    `Somatotroph_cAMP_PKA_Pituitary_Tumor_Syndromes.yaml`.
  subtype_term:
    preferred_term: growth hormone-producing pituitary gland adenoma
    term:
      id: MONDO:0006238
      label: growth hormone-producing pituitary gland adenoma
  genes:
  - preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  - preferred_term: AIP
    term:
      id: hgnc:358
      label: AIP
  - preferred_term: GPR101
    term:
      id: hgnc:14963
      label: GPR101
- name: Corticotroph
  display_name: Corticotroph Tumor (ACTH-secreting, TPIT lineage)
  classification: histologic
  description: >-
    TPIT-lineage, ACTH-secreting, causing Cushing disease. Often a microadenoma that is
    hard to localise despite florid biochemical disease. Somatic USP8 variants are a
    recurrent driver; see `USP8-related_pituitary_adenoma_4.yaml`.
  subtype_term:
    preferred_term: ACTH-producing pituitary gland adenoma
    term:
      id: MONDO:0006068
      label: ACTH-producing pituitary gland adenoma
  genes:
  - preferred_term: USP8
    term:
      id: hgnc:12631
      label: USP8
- name: Thyrotroph
  display_name: Thyrotroph Tumor (TSH-secreting, PIT1 lineage)
  classification: histologic
  description: >-
    PIT1-lineage, TSH-secreting, and the rarest of the functioning tumors. Causes
    central hyperthyroidism with an inappropriately normal or raised TSH, which
    distinguishes it biochemically from primary thyroid disease.
  subtype_term:
    preferred_term: TSH producing pituitary tumor
    term:
      id: MONDO:0003837
      label: TSH producing pituitary tumor
- name: Non-Functioning
  display_name: Non-Functioning Pituitary Tumor
  classification: clinical
  description: >-
    Tumors without a clinical hormone-excess syndrome, most commonly SF-1-lineage
    gonadotroph tumors, plus the genuinely null cell tumors negative for both hormones
    and lineage transcription factors. Because there is no secretory syndrome to prompt
    early investigation, they present by mass effect or as incidental findings and are
    typically macroadenomas.
  subtype_term:
    preferred_term: non-functioning pituitary gland neoplasm
    term:
      id: MONDO:0003603
      label: non-functioning pituitary gland neoplasm
- name: Posterior Pituitary
  display_name: Posterior Pituitary and Stalk Tumors
  classification: anatomic
  description: >-
    Neoplasms of the neurohypophysis and infundibulum — pituicytoma, granular cell tumor
    of the neurohypophysis, spindle cell oncocytoma. A distinct lineage derived from
    pituicytes rather than adenohypophyseal endocrine cells, so the lineage transcription
    factor scheme does not apply; they present by mass effect.
  subtype_term:
    preferred_term: posterior pituitary gland neoplasm
    term:
      id: MONDO:0003257
      label: posterior pituitary gland neoplasm
- name: Pituitary Carcinoma
  display_name: Pituitary Carcinoma
  classification: histologic
  description: >-
    Rare malignant pituitary neoplasm, defined by craniospinal or systemic metastasis
    rather than by histological atypia. The 2017 WHO revision eliminated the
    "atypical adenoma" category that had been used to predict this, on the grounds that
    the evidence did not support it.
  subtype_term:
    preferred_term: pituitary cancer
    term:
      id: MONDO:0002109
      label: pituitary cancer


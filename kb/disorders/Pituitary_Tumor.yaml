    reference_title: A Pituitary Society update to acromegaly management guidelines.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "As octreotide and lanreotide have similar efficacy, patients who have responded to these injectable agents are candidates for OOC therapy, and results of the OPTIMAL study demonstrate that biochemically controlled patients (IGF-I ≤ 1.0 × ULN) on stable doses of injectable octreotide or lanreotide maintain response to OOC"
    explanation: >-

    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0006373 (pituitary gland adenoma) is a direct child of this entry's
      anchor MONDO:0017611 (pituitary tumor), and the adenoma concept is covered
      by this entry's lineage subtypes and its clonal-expansion mechanism graph.
      The mapping is narrowMatch rather than exactMatch because this entry is
      genuinely broader: its subtypes include pituitary carcinoma
      (MONDO:0002109) and posterior pituitary tumors (MONDO:0003257), neither of
      which is an adenoma.
synonyms:
- pituitary neoplasm
- pituitary neuroendocrine tumor
- PitNET
categories:

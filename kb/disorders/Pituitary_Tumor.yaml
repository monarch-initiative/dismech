pathophysiology:
- name: Clonal Expansion of an Adenohypophyseal Cell Lineage
  biological_scale: CELLULAR
  role: trigger
  description: >-
    A pituitary tumor begins as a monoclonal expansion of one adenohypophyseal cell
    type, and which type it is determines nearly everything downstream. Lineage is
    specified by transcription factors — PIT1 for the somatotroph, lactotroph and
    thyrotroph lineages, TPIT for corticotroph, SF-1 for gonadotroph — and the tumor
    retains the identity of its cell of origin, including its secretory programme.
    Lineage-specific somatic and germline driver genes differ across subtypes and are
    indexed on `has_subtypes` and dedicated child entries rather than asserted at this
    root node. Posterior pituitary tumors arise from pituicytes instead and fall
    outside this scheme.
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  cell_types:
  - preferred_term: endocrine cell
    term:
      id: CL:0000163
      label: endocrine cell
  - preferred_term: mammotroph
    term:
      id: CL:0002311
      label: mammotroph
  - preferred_term: somatotroph
    term:
      id: CL:0002312
      label: somatotroph
  - preferred_term: corticotroph
    term:
      id: CL:0002309
      label: corticotroph
  - preferred_term: thyrotroph
    term:
      id: CL:0000476
      label: thyrotroph
  - preferred_term: gonadotroph
    term:
      id: CL:0000437
      label: gonadtroph
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  genes:
  - preferred_term: POU1F1
    term:
      id: hgnc:9210
      label: POU1F1
  - preferred_term: TBX19
    term:
      id: hgnc:11596
      label: TBX19
  - preferred_term: NR5A1
    term:
      id: hgnc:7983
      label: NR5A1
  evidence:
  - reference: PMID:29687298
    reference_title: "The 2017 WHO classification of pituitary adenoma: overview and comments."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The other change is the introduction of more precise cell lineage-based classification of pituitary adenoma that is defined based on lineage-specific transcription factors and hormones produced."
    explanation: >-
      States that the classification is cell-lineage-based and defined by
      lineage-specific transcription factors together with the hormones produced.
  - reference: PMID:37074863
    reference_title: "Transcription Factor Immunohistochemistry in the Classification of Pituitary Neuroendocrine Tumor/Adenoma: Proposal in a Limited-Resource Setting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 356 tumors were classified as per expression of pituitary hormones and transcription factors T-box family member TBX19 (TPIT), pituitary-specific POU-class homeodomain (PIT1), and steroidogenic factor-1 (SF-1)."
    explanation: >-
      Names the three lineage-determining transcription factors used to assign lineage
      in practice, in a series of 356 classified tumors.
  downstream:
  - target: Pituitary Adenoma
    causal_link_type: DIRECT
    description: >-
      Monoclonal expansion of an adenohypophyseal endocrine cell forms a discrete
      microadenoma or macroadenoma in the sella turcica.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Microadenomas constituted 57 (50.9%) of cases, and macroadenomas comprised the rest (55; 49.1%)."
      explanation: >-
        Documents the formation of pituitary microadenomas and macroadenomas across
        the consecutive adult cohort.
  - target: Autonomous Pituitary Hormone Secretion
    causal_link_type: DIRECT
    description: >-
      A tumor of a secretory lineage continues to make the hormone of its cell of
      origin, so hormone output follows lineage. This is the functioning arm, and it is
      why a tumor of only a few millimetres can cause severe systemic disease. The
      further step — that the secretion escapes normal hypothalamic and feedback
      restraint — is standard endocrine teaching but is not carried by the citation
      here, so it is not asserted as an evidenced claim.
    evidence:
    - reference: PMID:29687298
      reference_title: "The 2017 WHO classification of pituitary adenoma: overview and comments."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The other change is the introduction of more precise cell lineage-based classification of pituitary adenoma that is defined based on lineage-specific transcription factors and hormones produced."
      explanation: >-
        Ties the classification to the hormones produced, establishing that hormone
        output follows the lineage of the expanded cell.
  - target: Sellar Mass Effect
    causal_link_type: DIRECT
    description: >-
      Growth within the bony confines of the sella compresses adjacent structures
      regardless of secretory status. In non-functioning tumors this is the only route
      to symptoms, so they present later and larger.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Headache was present in 67 (59.8%) patients, followed by visual field defects (40; 35.7%), galactorrhea (26; 23.2%), and fatigue (19; 17.0%)."
      explanation: >-
        Headache and visual field defects are the two commonest presenting features in
        the cohort, which is the clinical signature of mass effect.

- name: Autonomous Pituitary Hormone Secretion
  biological_scale: ORGANISM
  role: central_effector
  description: >-
    Unregulated secretion of the lineage's hormone produces a defined endocrine
    syndrome: prolactin gives galactorrhoea, amenorrhoea and infertility; growth hormone
    gives acromegaly or gigantism; ACTH gives Cushing disease; TSH gives central
    hyperthyroidism. The syndrome, not the tumor size, is usually what brings the
    patient to attention, and prolactinomas are the commonest.
  biological_processes:
  - preferred_term: hormone secretion
    term:
      id: GO:0046879
      label: hormone secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
      Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly half (51; 45.5%) of adenomas were prolactinomas while 46 (41.1%) were non-functioning adenomas, and seven (6.3%) were growth hormone-secreting adenomas while six (5.4%) were adrenocorticotropic hormone secreting adenomas."
    explanation: >-
      Gives the subtype distribution in a consecutive cohort — prolactinomas commonest,
      then non-functioning, then GH- and ACTH-secreting tumors.
  downstream:
  - target: Galactorrhea
    causal_link_type: DIRECT
    description: >-
      Autonomous prolactin secretion from lactotroph tumors directly stimulates mammary
      lactation.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They were mainly associated with menstrual irregularities (52.9%) such as amenorrhea, oligomenorrhea, and galactorrhea (41.2%), which concurs well with previously reported studies in which the most prevalent symptoms were amenorrhea-galactorrhea (84.7%) for patients with prolactinomas"
      explanation: >-
        Links prolactin-secreting adenomas directly to galactorrhea in female patients.
  - target: Amenorrhea
    causal_link_type: DIRECT
    description: >-
      Prolactin excess suppresses hypothalamic-pituitary gonadotropin signaling, causing
      secondary amenorrhea.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They were mainly associated with menstrual irregularities (52.9%) such as amenorrhea, oligomenorrhea, and galactorrhea (41.2%), which concurs well with previously reported studies in which the most prevalent symptoms were amenorrhea-galactorrhea (84.7%) for patients with prolactinomas"
      explanation: >-
        Documents amenorrhea as a primary manifestation of autonomous prolactin secretion.
  - target: Menstrual Cycle Irregularities
    causal_link_type: DIRECT
    description: >-
      Hormone excess — especially hyperprolactinemia — disrupts normal ovulatory cycling
      and causes oligomenorrhea or irregular menses in the majority of female patients.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The majority of women (45/79; 57.0%) presented with menstrual cycle abnormalities."
      explanation: >-
        Quantifies menstrual cycle abnormalities across women in the consecutive pituitary
        adenoma cohort.

- name: Sellar Mass Effect
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Expansion within the sella compresses the optic chiasm above and the normal
    pituitary around it. Chiasmal compression produces a characteristic bitemporal
    visual field defect; compression of residual normal gland produces hypopituitarism.
    Headache is the commonest single symptom.
  locations:
  - preferred_term: pituitary gland
    term:
      id: UBERON:0000007
      label: pituitary gland
  evidence:
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
      Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Headache was present in 67 (59.8%) patients, followed by visual field defects (40; 35.7%), galactorrhea (26; 23.2%), and fatigue (19; 17.0%)."
    explanation: >-
      Quantifies headache and visual field defects as the leading presenting features.
  downstream:
  - target: Headache
    causal_link_type: DIRECT
    description: >-
      Intrasellar and dural stretching from tumor expansion causes headache, the most
      frequent presenting symptom.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Headache was present in 67 (59.8%) patients, followed by visual field defects (40; 35.7%), galactorrhea (26; 23.2%), and fatigue (19; 17.0%)."
      explanation: >-
        Documents headache as the leading symptom (59.8%) in the consecutive pituitary
        adenoma cohort.
  - target: Visual Field Defect
    causal_link_type: DIRECT
    description: >-
      Suprasellar tumor extension compresses the optic chiasm and causes visual field
      defects.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgery was indicated for macroadenomas with visual disturbance and symptomatic non-functional adenomas with symptoms due to compression effects."
      explanation: >-
        Links macroadenoma compression effects directly to visual disturbance.
  - target: Hypopituitarism
    causal_link_type: DIRECT
    description: >-
      Compression of the surrounding normal adenohypophysis impairs residual anterior
      pituitary hormone secretion, especially in non-functioning macroadenomas.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypopituitary symptoms were more associated with those with non-functioning adenomas (17.4%) than those with prolactinomas (7.8%)."
      explanation: >-
        Shows hypopituitarism enriched in non-functioning adenomas (which present via
        sellar compression rather than hormone hypersecretion).
  - target: Amenorrhea
    causal_link_type: DIRECT
    description: >-
      Mass-effect compromise of normal gonadotrophs can also cause hypogonadotropic
      amenorrhea.
    evidence:
    - reference: PMID:38567166
      reference_title: >-
        Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
        Center Experience.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Menstrual irregularities were more associated with women with prolactinomas (27/40; 67.5%) and non-functioning adenomas (16; 57.1%) than those with GH-secreting PA or ACTH-secreting PA."
      explanation: >-
        Documents menstrual irregularities (including amenorrhea) in 57.1% of women with
        non-functioning adenomas, supporting mass-effect gonadotroph compromise alongside
        prolactin-mediated suppression.


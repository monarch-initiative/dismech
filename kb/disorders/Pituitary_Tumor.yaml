    snippet: "Most cases (58/112; 52.0%) of PA were treated medically by cabergoline, octreotide, and replacement therapies such as hydrocortisone and thyroxin, 38 (33.9%) were treated surgically (mainly by trans-sphenoidal pituitary resection), and the remaining 10 (8.9%) cases were subjected to radiotherapy."

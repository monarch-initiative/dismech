name: Pituitary Tumor
creation_date: '2026-08-19T12:00:00Z'
category: Neoplastic
description: >
  Pituitary tumor covers the neoplasms of the pituitary gland. The great majority arise
  from the hormone-producing cells of the anterior lobe and are benign; these are the
  pituitary adenomas, increasingly designated pituitary neuroendocrine tumors (PitNETs)
  to reflect their neuroendocrine nature and their capacity for locally aggressive
  behaviour. True pituitary carcinoma, defined by craniospinal or systemic metastasis,
  is rare. Tumors of the posterior lobe and stalk — pituicytoma, granular cell tumor —
  are a separate lineage.

  Two things make this family unusual among neoplasms. First, most of the morbidity is
  endocrine rather than oncologic: a small benign tumor causes disease by secreting a
  pituitary hormone autonomously, producing a defined syndrome (prolactinoma with
  galactorrhoea and amenorrhoea, somatotroph tumor with acromegaly, corticotroph tumor
  with Cushing disease). Second, tumors that secrete nothing detectable present instead
  by mass effect — headache, and chiasmal compression causing visual field loss — and so
  are typically larger at diagnosis.

  Classification has shifted from a purely hormone-immunostaining basis to one built on
  adenohypophyseal cell lineage, identified by the lineage-determining transcription
  factors PIT1, TPIT and SF-1. This matters clinically because lineage predicts
  behaviour and treatment response better than hormone staining alone, and it allowed
  null cell tumors to be redefined as those negative for both hormones and lineage
  transcription factors — a much smaller and more meaningful category than before.

  This root entry carries the family-level material: the lineage classification axis,
  the functioning/non-functioning distinction and its consequences, and the shared route
  from clonal adenohypophyseal expansion to endocrine or mass-effect disease. The
  germline predisposition syndromes and individual driver genes are not re-derived here;
  see `AIP-related_pituitary_adenoma_predisposition.yaml`,
  `GNAS-related_pituitary_adenoma_3.yaml`, `GPR101-related_pituitary_adenoma_2.yaml`,
  `USP8-related_pituitary_adenoma_4.yaml`, `CDH23-associated_pituitary_adenoma_5.yaml`
  and `Somatotroph_cAMP_PKA_Pituitary_Tumor_Syndromes.yaml`.

    explanation: >-
      Confirms medical therapy (cabergoline) as the predominant first-line modality
      in prolactinoma.
- name: Transsphenoidal Pituitary Resection
  description: >-
    Transsphenoidal surgical resection is the primary treatment for GH-secreting
    (somatotroph) and ACTH-secreting (corticotroph) functioning tumors as well as
    symptomatic non-functioning macroadenomas causing visual disturbance or mass
    effect.
  context: First-line therapy for somatotroph, corticotroph, and symptomatic mass-effect pituitary tumors
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: transsphenoidal pituitary surgery
    term:
      id: NCIT:C15329

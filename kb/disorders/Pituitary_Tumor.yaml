      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In a prospective international study, 88.7% of patients well controlled on octreotide LAR 10 and 20 mg every 4 weeks who switched to lanreotide 120 mg every 6 weeks achieved normal IGF-I levels after 24 weeks"

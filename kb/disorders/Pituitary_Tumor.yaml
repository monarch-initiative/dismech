diagnosis:
- name: Pituitary Magnetic Resonance Imaging
  description: >-
    Contrast-enhanced magnetic resonance imaging of the pituitary fossa localizes
    sellar lesions, distinguishes microadenomas (<10 mm) from macroadenomas (>=10 mm),
    and assesses suprasellar or cavernous sinus extension.
  diagnosis_term:
    preferred_term: pituitary magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
      Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data analyzed included demographic information (age, sex, area of residence), comprehensive clinical evaluation, hormonal levels, treatment plan, and radiological indications of the pituitary mass lesion using magnetic resonance imaging scans conducted at SQUH or other health facilities."
    explanation: >-
      Documents pituitary MRI alongside hormonal evaluation as core components of
      diagnostic evaluation.
- name: Pituitary Hormone Biochemical Evaluation
  description: >-
    Measurement of anterior pituitary hormones and target-gland axes (prolactin,
    IGF-I and GH suppression during OGTT, ACTH/cortisol, TSH/free thyroxine, and
    gonadotropins) differentiates functioning syndromes from non-functioning tumors
    and detects hypopituitarism.
  diagnosis_term:
    preferred_term: pituitary hormone measurement
    term:
      id: NCIT:C74742
      label: Hormone Measurement
  evidence:
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single
      Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data analyzed included demographic information (age, sex, area of residence), comprehensive clinical evaluation, hormonal levels, treatment plan, and radiological indications of the pituitary mass lesion using magnetic resonance imaging scans conducted at SQUH or other health facilities."
    explanation: >-
      Documents hormonal level measurement in the diagnostic workup of pituitary
      adenomas.
  - reference: PMID:33079318
    reference_title: A Pituitary Society update to acromegaly management guidelines.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "As GH and IGF-I assessments remain the standard for measuring acromegaly disease activity at diagnosis and follow-up, strategies are being developed to improve current assays."
    explanation: >-
      Consensus guideline confirming growth hormone (GH) and IGF-I measurement as the
      diagnostic and follow-up standard for somatotroph pituitary tumors.
- name: Pituitary Transcription Factor Immunohistochemistry
  description: >-
    Immunostaining of resected tissue for the lineage-determining transcription factors
    PIT1, TPIT and SF-1, alongside the anterior pituitary hormones. This is what assigns
    a tumor to its lineage, identifies variants that hormone staining alone misses, and
    defines a null cell tumor as one negative for both hormones and transcription
    factors.
  diagnosis_term:
    preferred_term: pituitary transcription factor immunohistochemistry
    term:
      id: NCIT:C51944
      label: Immunohistochemical Test
  evidence:
  - reference: PMID:37074863
    reference_title: "Transcription Factor Immunohistochemistry in the Classification of Pituitary Neuroendocrine Tumor/Adenoma: Proposal in a Limited-Resource Setting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Pituitary neuroendocrine tumors/adenomas are common intracranial tumors that require accurate subtyping because each tumor differs in its biologic behavior and response to treatment."
    explanation: >-
      States why accurate subtyping matters: each tumor differs in its biologic
      behaviour and response to treatment.
  - reference: PMID:37074863
    reference_title: "Transcription Factor Immunohistochemistry in the Classification of Pituitary Neuroendocrine Tumor/Adenoma: Proposal in a Limited-Resource Setting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reclassification of 34.8% (124 of 356) of pituitary neuroendocrine tumors/adenoma was done after application of transcription factors."
    explanation: >-
      Demonstrates in 356 resected tumors that transcription-factor immunostaining
      reclassified more than a third of cases compared with hormone staining alone.
  - reference: PMID:29687298
    reference_title: "The 2017 WHO classification of pituitary adenoma: overview and comments."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Accordingly, null cell adenomas have been re-defined as those that show completely negative immunostaining either for hormones or for adenohypophyseal transcription factors."
    explanation: >-
      Records the redefinition of null cell tumors as negative for both hormones and
      adenohypophyseal transcription factors, which is only decidable with this assay.

treatments:
- name: Dopamine Agonist Therapy (Cabergoline / Bromocriptine)
  description: >-
    First-line medical therapy for lactotroph tumors (prolactinomas). Dopamine D2
    receptor agonists (cabergoline preferred over bromocriptine for higher efficacy
    and tolerability) suppress autonomous prolactin secretion, restore gonadal
    function, and shrink lactotroph tumors.
  context: First-line therapy for lactotroph tumors (prolactinomas)
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: dopamine agonist pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cabergoline
      term:
        id: CHEBI:3286
        label: cabergoline
    - preferred_term: bromocriptine
      term:
        id: CHEBI:3181
        label: bromocriptine
  target_mechanisms:
  - target: Autonomous Pituitary Hormone Secretion
    treatment_effect: INHIBITS
    description: >-
      Cabergoline and bromocriptine activate lactotroph D2 receptors to suppress
      autonomous prolactin secretion and normalize serum prolactin.
    evidence:
    - reference: PMID:7915824
      reference_title: A comparison of cabergoline and bromocriptine in the treatment of hyperprolactinemic amenorrhea. Cabergoline Comparative Study Group.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stable normoprolactinemia was achieved in 186 of the 223 women treated with cabergoline (83 percent) and 138 of the 236 women treated with bromocriptine (59 percent, P < 0.001)."
      explanation: >-
        Randomized double-blind trial demonstrating normalization of autonomous
        prolactin secretion with cabergoline (83%) and bromocriptine (59%).
  evidence:
  - reference: PMID:7915824
    reference_title: A comparison of cabergoline and bromocriptine in the treatment of hyperprolactinemic amenorrhea. Cabergoline Comparative Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cabergoline is more effective and better tolerated than bromocriptine in women with hyperprolactinemic amenorrhea."
    explanation: >-
      Establishes cabergoline superiority over bromocriptine in randomized comparative
      trial of hyperprolactinemic women (predominantly microprolactinomas).
  - reference: PMID:38567166
    reference_title: >-
      Pituitary Adenoma Prevalence and Characteristics of Omani Patients: A Single

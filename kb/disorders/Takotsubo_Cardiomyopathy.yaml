differential_diagnoses:
- name: Acute myocardial infarction
  description: >
    The condition takotsubo mimics and the reason angiography is mandatory. Distinguishing
    features are a wall-motion abnormality that crosses coronary territories, unobstructed
    epicardial arteries, a troponin too small for the territory involved, a natriuretic
    peptide too large for the troponin, and complete recovery of function.
  evidence:
  - reference: PMID:33602474
    reference_title: "Pathophysiology of Takotsubo Syndrome: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TTS is now routinely diagnosed in patients who present with acute chest pain, electrocardiographic changes, troponin elevation, unobstructed coronary arteries, and a typical pattern of circumferential left ventricular wall motion abnormalities"
    explanation: States the discriminating combination of unobstructed arteries with a circumferential abnormality.
- name: Acute myocarditis
  description: >
    Also presents with chest pain, troponin release, and unobstructed coronaries. Cardiac
    magnetic resonance separates them: myocarditis shows subepicardial or midmyocardial late
    gadolinium enhancement, whereas takotsubo shows oedema without that ischaemic or
    inflammatory scar pattern.
  evidence:
  - reference: PMID:30586731
    reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with takotsubo cardiomyopathy underwent multiparametric cardiac magnetic resonance imaging"
    explanation: Establishes multiparametric cardiac magnetic resonance as the tissue-characterisation tool used to separate the two; PARTIAL because the study is not a diagnostic-accuracy comparison against myocarditis.
- name: Pheochromocytoma crisis
  description: >
    Produces an essentially identical catecholamine cardiomyopathy, with the same
    contraction-band histology, from an endogenous tumour source rather than a stress
    response. It matters because it is treatable and recurrent if missed, and because it is
    strong independent evidence that the catecholamine mechanism is causal.
  evidence:
  - reference: PMID:22732314
    reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "It is precipitated by extreme stress and can be triggered by intravenous catecholamine administration, particularly epinephrine."
    explanation: Establishes that a pure catecholamine exposure reproduces the syndrome, which is the shared mechanism with pheochromocytoma; PARTIAL because the source addresses exogenous rather than tumour-derived catecholamine.
clinical_burden:
  burden_level: HIGH
  rationale: >
    In-hospital mortality is around 6.5 percent and is not falling, which is comparable to
    acute myocardial infarction and refutes the historical description of the syndrome as
    benign. More than a third of admitted patients develop congestive heart failure, one in
    five atrial fibrillation, and one in fifteen cardiogenic shock. Men are a small minority
    of cases but die at more than twice the rate of women, for reasons that are unexplained.
  notes: >
    The burden is not confined to the admission. Survivors commonly remain fatigued,
    breathless, and exercise-limited after ejection fraction has normalised, and their
    long-term major adverse cardiovascular event rate approaches that of acute coronary
    syndrome survivors. Recurrence affects roughly four to ten percent. No therapy has been
    shown in a randomised trial to alter any of this.
  evidence:
  - reference: PMID:40365782
    reference_title: "High Mortality and Complications in Patients Admitted With Takotsubo Cardiomyopathy With More Than Double Mortality in Men Without Improvement in Outcome Over the Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality was high at 6.5% with no significant improvement over the years studied."
    explanation: National inpatient mortality with an explicit statement that it is not falling.
  - reference: PMID:40365782
    reference_title: "High Mortality and Complications in Patients Admitted With Takotsubo Cardiomyopathy With More Than Double Mortality in Men Without Improvement in Outcome Over the Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality was more than double in men in comparison to women (11.2% versus 5.5%)."
    explanation: Quantifies the unexplained sex disparity in a national cohort.
  - reference: PMID:35344411
    reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "many continue to have limiting symptoms despite restoration of left ventricular ejection fraction"
    explanation: Documents the residual symptomatic burden that the recovered ejection fraction conceals.
discussions:
- discussion_id: beta_blockade_mechanism_outcome_gap
  prompt: >
    Why does beta-adrenergic blockade, which targets the mechanism that causes takotsubo
    syndrome, fail to improve survival or prevent recurrence?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Sympathoadrenal activation and catecholamine surge
  - pathophysiology#Beta2-adrenergic receptor switch from Gs to Gi coupling
  - pathophysiology#Coronary microvascular dysfunction
  rationale: >
    Every element of the accepted mechanism predicts that beta-blockade should work: the
    trigger is a catecholamine surge, the molecular lesion is a beta2-adrenergic receptor
    switch, and in animals combined adrenoceptor blockade abolishes the ballooning. Registry
    data nonetheless show no survival benefit, and a third of patients recur while taking a
    beta-blocker. Several explanations are live and mutually compatible. Alpha-adrenergic
    receptors dominate the coronary microcirculation and are untouched by beta-blockade,
    which would matter if the microvascular arm carries more causal weight than assumed. The
    animal evidence required combined alpha and beta blockade, not beta alone, so the
    preclinical result may never have supported beta-monotherapy. Blockade started after
    presentation cannot prevent a surge that has already happened, so an acute-phase trial
    may be testing the wrong window. And if the receptor switch is partly cardioprotective
    rather than purely injurious, blocking it could offset its own benefit. Distinguishing
    these matters because they imply different drugs and different timing.
  proposed_experiments:
  - experiment_id: exp_tts_combined_alpha_beta_blockade_trial
    name: Randomised trial of combined alpha- and beta-adrenoceptor blockade versus beta-blockade alone for recurrence prevention
    description: >-
      Randomise takotsubo survivors at hospital discharge to a combined alpha- and
      beta-blocking agent, a selective beta-blocker, or renin-angiotensin blockade alone,
      and follow recurrence, major adverse cardiovascular events, and global longitudinal
      strain for three years.
    decision_criterion: >-
      A reduction in recurrence with combined blockade but not with beta-blockade alone
      would support the alpha-receptor and microvascular explanation and would reconcile the
      animal and clinical evidence; equivalence across all three arms would argue that
      adrenergic blockade after the index event is simply too late.
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, there was no evidence of any survival benefit for the use of beta-blockers.2 Moreover, one-third of patients experienced a TTS recurrence during beta-blockade2 suggesting that other receptors such as alpha-receptors, that are more prevalent in the coronary microcirculation, might be involved."
    explanation: States both the negative outcome and the consensus document's own proposed explanation for it.
- discussion_id: brain_heart_axis_causal_direction
  prompt: >
    Is the limbic and autonomic network hypoconnectivity seen in takotsubo patients a
    pre-existing vulnerability that permits the syndrome, or a consequence of having had it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Central limbic and autonomic network hypoconnectivity
  rationale: >
    The imaging is unambiguous that connectivity in sympathetic- and
    parasympathetic-associated subnetworks is reduced, involving exactly the regions that
    generate autonomic outflow. The direction of causation is not established, because every
    published cohort was scanned after the cardiac event. The distinction is not academic: a
    pre-existing central lesion would make takotsubo a disorder of autonomic regulation that
    happens to present cardiologically, would explain why some patients recur and others
    never do, and would make central rather than cardiac intervention the rational target.
    A reactive change would instead make the brain findings a marker of illness severity.
  proposed_experiments:
  - experiment_id: exp_tts_prospective_neuroimaging_cohort
    name: Prospective neuroimaging in a population at elevated takotsubo risk
    description: >-
      Acquire resting-state functional magnetic resonance imaging in a large cohort scanned
      for unrelated indications or as part of a population imaging study, then ascertain
      incident takotsubo syndrome over subsequent years and compare baseline limbic and
      autonomic connectivity in those who develop the syndrome against matched controls who
      do not.
    decision_criterion: >-
      Reduced baseline connectivity preceding the event would establish it as a predisposing
      lesion; connectivity indistinguishable from controls before the event, with the
      abnormality appearing only afterwards, would establish it as reactive.
  evidence:
  - reference: PMID:30831580
    reference_title: "Altered limbic and autonomic processing supports brain-heart axis in Takotsubo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found parasympathetic- and sympathetic-associated subnetworks both showing reduced resting state functional connectivity in TTS patients compared with controls."
    explanation: The observation whose temporal direction is the open question; the study design is cross-sectional and post-event.
- discussion_id: animal_models_and_the_sex_bias
  prompt: >
    Do rodent immobilisation and catecholamine-infusion models reproduce the biology
    responsible for the overwhelming postmenopausal female predominance of takotsubo
    syndrome in humans?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Beta2-adrenergic receptor switch from Gs to Gi coupling
  - pathophysiology#Central limbic and autonomic network hypoconnectivity
  rationale: >
    The animal models are genuinely strong on the core mechanism: immobilisation stress and
    epinephrine boluses reproduce the ST changes, the apical ballooning, and the reversibility,
    and pharmacologic blockade abolishes them. What they reproduce far less well is the single
    most striking epidemiologic fact about the human syndrome, that roughly nine in ten
    patients are postmenopausal women. Rat work shows that raising serum estrogen partially
    attenuates the cardiac changes, which is a real signal in the right direction but a much
    weaker effect than a nine-to-one sex ratio implies, and the models do not address the
    human limbic and insular findings at all. Two readings follow. Either the sex bias arises
    from a mechanism the models do not capture, in which case negative model results for
    hormone-directed interventions are uninformative about patients; or estrogen modulation of
    beta-adrenergic coupling is the right mechanism and the models simply underpower it. This
    matters directly for whether hormone-related susceptibility is worth pursuing
    therapeutically.
  proposed_experiments:
  - experiment_id: exp_tts_ovariectomised_aged_model
    name: Aged ovariectomised rodent model with graded estrogen replacement
    description: >-
      Compare takotsubo induction rate and severity across intact young, intact aged,
      ovariectomised aged, and ovariectomised aged animals receiving graded estrogen
      replacement, using a standardised epinephrine bolus, with beta2-adrenergic receptor
      density and Gs-to-Gi coupling measured in apical and basal cardiomyocytes from each
      group.
    decision_criterion: >-
      A susceptibility gradient tracking estrogen exposure, with a matching shift in apical
      beta2-adrenergic receptor coupling, would establish the hormonal mechanism as
      sufficient to explain the human sex bias; a comparable induction rate across hormone
      states would show the models lack the relevant biology and would redirect attention to
      the central autonomic arm.
  evidence:
  - reference: PMID:15240400
    reference_title: "Emotional stress-induced Tako-tsubo cardiomyopathy: animal model and molecular mechanism."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "An increase of serum estrogen partially attenuated these cardiac changes."
    explanation: The estrogen signal in the rat model is real but explicitly partial, which is the mismatch against a nine-to-one human sex ratio.
  - reference: PMID:26332547
    reference_title: "Clinical Features and Outcomes of Takotsubo (Stress) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 1750 patients with takotsubo cardiomyopathy, 89.8% were women (mean age, 66.8 years)."
    explanation: The human sex and age distribution that the models are being asked to reproduce.
- discussion_id: polygenic_susceptibility_absent_locus
  prompt: >
    Is there a genuine heritable component to takotsubo susceptibility, and if so why has no
    locus replicated despite two decades of candidate-gene work?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Beta2-adrenergic receptor switch from Gs to Gi coupling
  rationale: >
    Familial clustering has been reported repeatedly, and the adrenergic pathway supplies
    unusually well-motivated candidate genes, ADRB2 above all, since it encodes the receptor
    through which the leading mechanism operates. Yet no variant has been conclusively
    associated, and the field has moved to a polygenic and gene-environment framing largely
    by elimination. Three explanations remain open. The effect may be genuinely polygenic
    with per-variant effects far below what candidate-gene sample sizes can detect. The
    heritable component may not be cardiac at all but reside in central stress-response and
    autonomic regulation, in which case adrenergic candidate genes were the wrong place to
    look. Or the familial reports may reflect shared environment and ascertainment rather
    than genetics. Resolving this determines whether a susceptibility panel is a realistic
    goal or a category error.
  proposed_experiments:
  - experiment_id: exp_tts_gwas_consortium
    name: Adequately powered multinational genome-wide association study of takotsubo syndrome
    description: >-
      Pool takotsubo cases across the international registries with matched controls to reach
      a sample size capable of detecting common variants of modest effect, test for enrichment
      in adrenergic, stress-response, and neuropsychiatric pathways, and evaluate whether a
      polygenic score derived in one cohort predicts case status in an independent one.
    decision_criterion: >-
      Replicated genome-wide significant loci, or a polygenic score that transfers between
      cohorts, would establish a heritable component and localise it; a well-powered null
      would make a shared-environment explanation the leading account of familial clustering.
  evidence:
  - reference: PMID:40723798
    reference_title: "The Genetic Puzzle of the Stress-Induced Cardiomyopathy (Takotsubo Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite a large number of investigations, no definitive genetic markers associated with TS risk have been conclusively identified. The lack of a clear Mendelian inheritance pattern suggests a multifactorial etiology and pathogenesis, likely involving complex gene-environment interactions and a polygenic background."
    explanation: States the negative result and the polygenic reframing that the proposed study would test directly.
notes: >
  No GeneReviews chapter exists for takotsubo cardiomyopathy, and none would be expected:
  the syndrome has no established causal gene, no Mendelian inheritance pattern, and no
  clinical genetic test. The three genes recorded in the genetic section are all curated with
  relationship_type UNKNOWN. They are there to document what has been investigated and found
  wanting, which is itself informative given that ADRB2 encodes the receptor central to the
  accepted mechanism.

  Two ontology notes. First, several phenotypes here have no takotsubo-specific HPO term and
  are bound to the closest general cardiac term, with the specific meaning carried in
  preferred_term and description. Second, the troponin phenotype is bound to
  HP:0410173 (Increased circulating troponin I concentration), matching the assay the cited
  evidence actually used. HPO has no assay-agnostic troponin term, so where an assay-specific
  term must be chosen the right one is the one the evidence reports; preferred_term carries the
  general clinical claim.

  Deep-research provenance: this entry was curated from a claude_code deep-research report
  (research/Takotsubo_Cardiomyopathy-deep-research-claude_code.md) treated as leads only. The
  NEC preflight returned SKIP because MONDO records no causal gene for MONDO:0019018; manual
  synonym and identifier checks against the MONDO record confirmed the correct entity. Four
  ontology identifiers suggested by the provider were verified against OAK and found to point
  at unrelated concepts (HP:0001681 is Angina pectoris, not a ventricular morphology term;
  HP:0033539 is Bilateral apical pulmonary fibrosis, not ST-segment elevation; CL:0002350 is
  endocardial cell, not cardiac microvascular endothelial cell; CHEBI:33569 is noradrenaline,
  not epinephrine), and one suggested PMID for the beta2-adrenergic receptor switch paper was
  a neuroscience article on Eph and ephrin signalling. All were corrected before curation.

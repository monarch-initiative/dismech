    explanation: Documents thrombus forming specifically within the dysfunctional apex, which ties the thrombus to the regional akinesis rather than to a general prothrombotic state.
- name: Persistent subclinical myocardial dysfunction
  description: >
    The finding that most changed how the syndrome is regarded. Global longitudinal strain
    and cardiac energetic reserve remain abnormal after ejection fraction has normalised,
    survivors continue to report fatigue, dyspnoea, and exercise intolerance, and long-term
    major adverse cardiovascular event rates approach those after acute coronary syndrome.
    Takotsubo is therefore better described as an acute event on a background of enduring
    vulnerability than as a self-limited illness, which is also consistent with the four to
    ten percent recurrence rate.
  biological_scale: ORGANISM
  role: consequence
  evidence:
  - reference: PMID:35344411
    reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, these patients have a substantial burden of morbidity and mortality, as well, with high rates of subsequent major adverse cardiovascular events that approach those of patients with acute coronary syndrome."
    explanation: Quantifies the long-term consequence that contradicts the historical benign framing.

biochemical:
- name: Plasma epinephrine
  notes: >
    Markedly elevated at presentation, and specifically higher than in patients with
    comparably severe myocardial infarction, which is what makes the elevation mechanistic
    rather than merely a marker of illness severity.
  presence: INCREASED
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma catecholamine levels at presentation were markedly higher among patients with stress-induced cardiomyopathy than among those with Killip class III myocardial infarction"
    explanation: The comparison against a haemodynamically matched control condition.
- name: Plasma norepinephrine
  notes: >
    Elevated alongside epinephrine. Notably, norepinephrine alone does not reproduce the
    apical pattern in the rat model, which is part of the argument that the phenotype is
    determined by the epinephrine-preferring beta2 receptor rather than by total sympathetic
    tone.
  presence: INCREASED
  evidence:
  - reference: PMID:22732314
    reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a high intravenous epinephrine, but not norepinephrine, bolus produces the characteristic reversible apical depression of myocardial contraction"
    explanation: Distinguishes the two catecholamines mechanistically, which is why they are curated separately.
- name: Interleukin-6
  notes: >
    Raised roughly threefold against matched controls in the acute phase, and still elevated
    at five months. The persistence is the point: it is the best current biochemical
    correlate of the chronic subclinical phase.
  presence: INCREASED
  evidence:
  - reference: PMID:30586731
    reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum interleukin-6 (23.1±4.5 pg/mL versus 6.5±5.8 pg/mL; P<0.001)"
    explanation: Quantifies the acute elevation against matched controls.
- name: Brain natriuretic peptide
  notes: >
    Elevated out of proportion to troponin. The disproportion, not the absolute value, is
    what carries diagnostic information.
  presence: INCREASED
  biomarker_term:
    preferred_term: brain natriuretic peptide
    term:
      id: NCIT:C88523
      label: Brain Natriuretic Peptide 32
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Takotsubo syndrome is frequently associated with a substantial increase in the plasma levels of B-type natriuretic peptide (BNP) and N-terminal prohormone of brain natriuretic peptide (NT-proBNP) reaching its peak approximately 24–48 h after symptom onset"
    explanation: States the substantial rise in plasma B-type natriuretic peptide that this marker records.
prevalence:
- population: Hospitalised adults, United States
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >
    199 890 admissions carrying a takotsubo diagnosis were identified in the Nationwide
    Inpatient Sample over 2016 to 2020, with a strong female predominance. The syndrome
    accounts for roughly one to three percent of presentations that initially look like
    acute coronary syndrome.
  evidence:
  - reference: PMID:40365782
    reference_title: "High Mortality and Complications in Patients Admitted With Takotsubo Cardiomyopathy With More Than Double Mortality in Men Without Improvement in Outcome Over the Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 199 890 patients with Takotsubo were found in our database with 83% being female and higher prevalence with age, White race, and highest income."
    explanation: National inpatient denominator and the demographic distribution.
- population: International Takotsubo Registry
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >
    Nearly 90 percent of registry patients are women, with a mean age in the late sixties,
    the demographic signature that any mechanistic account has to explain.
  evidence:
  - reference: PMID:26332547
    reference_title: "Clinical Features and Outcomes of Takotsubo (Stress) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 1750 patients with takotsubo cardiomyopathy, 89.8% were women (mean age, 66.8 years)."

progression:
- phase: Acute phase
  notes: >
    The first 24 to 72 hours, when the wall-motion abnormality is maximal and the risk of
    cardiogenic shock, outflow obstruction, and malignant arrhythmia is concentrated. This
    is also the window in which the diagnosis is usually made, by angiography excluding
    obstructive disease in a patient whose ventriculogram shows circumferential akinesis.
  evidence:
  - reference: PMID:26332547
    reference_title: "Clinical Features and Outcomes of Takotsubo (Stress) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rates of severe in-hospital complications including shock and death were similar in the two groups"
    explanation: Establishes that acute-phase risk matches that of acute coronary syndrome rather than being benign.
- phase: Recovery phase
  notes: >
    Over the following two to four weeks ejection fraction normalises in the great majority.
    Recovery is spontaneous; no therapy has been shown to accelerate it.
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rapidly resolved in all patients"
    explanation: Documents complete recovery of systolic function in every patient in the defining series.
- phase: Chronic subclinical phase
  notes: >
    After ejection fraction normalises, a substantial fraction of survivors retain abnormal
    strain and impaired myocardial energetics, remain symptomatic, and carry a long-term
    event rate approaching that of acute coronary syndrome survivors. Recurrence affects
    roughly four to ten percent, often in a different ballooning pattern.
  evidence:
  - reference: PMID:35344411
    reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with takotsubo syndrome have persistent subtle ongoing cardiac dysfunction, and many continue to have limiting symptoms despite restoration of left ventricular ejection fraction"
    explanation: Defines the chronic subclinical phase and its symptomatic burden.
diagnosis:
- name: Coronary angiography and left ventriculography
  description: >
    Performed in essentially every case, because the presentation is indistinguishable from
    acute coronary syndrome and the diagnosis is partly one of exclusion. Ventriculography
    at the same sitting demonstrates the circumferential wall-motion abnormality and permits
    direct measurement of an outflow tract gradient on pigtail pullback.
  diagnosis_term:
    preferred_term: coronary angiography
    term:
      id: NCIT:C100085
      label: Coronary Angiography
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients underwent coronary angiography and serial echocardiography"
    explanation: Angiography is the mandatory step that excludes the condition being mimicked.
- name: Transthoracic echocardiography
  description: >
    First-line and serial imaging: it identifies the regional wall-motion abnormality,
    detects and quantifies a dynamic outflow gradient and systolic anterior motion of the
    mitral valve, and documents recovery. Speckle-tracking strain may stay abnormal after
    ejection fraction has normalised.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a pressure gradient can be detected and quantified using Doppler echocardiography using continuous wave Doppler"
    explanation: Consensus statement of echocardiography's specific role in detecting the outflow obstruction that alters management.
- name: Electrocardiography
  description: >
    Shows diffuse ST elevation early, then deep diffuse T-wave inversion and QTc
    prolongation. The ECG cannot distinguish takotsubo from anterior infarction at
    presentation, which is precisely why angiography is mandatory, but serial tracings are
    informative and QTc guides arrhythmic risk and drug choice.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse T-wave inversion and a prolonged QT interval occurred in most patients."
    explanation: The electrocardiographic findings the test is performed to detect.
- name: Cardiac magnetic resonance imaging
  description: >
    The decisive adjunct when the diagnosis is uncertain. Takotsubo shows regional oedema
    without the ischaemic late gadolinium enhancement pattern of infarction and without the
    subepicardial pattern of myocarditis. Imaging is most informative within the first week.
    Iron-oxide-enhanced protocols additionally reveal the macrophage infiltrate, though that
    remains a research technique.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:30586731
    reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with takotsubo cardiomyopathy underwent multiparametric cardiac magnetic resonance imaging, including ultrasmall superparamagnetic particles of iron oxide (USPIO) enhancement for detection of inflammatory macrophages in the myocardium"
    explanation: Documents the multiparametric cardiac magnetic resonance protocol and its tissue-characterisation capability.
- name: Cardiac troponin measurement
  description: >
    Troponin is measured to establish myocardial injury and, more usefully, to quantify how
    small it is relative to the extent of dysfunction. A troponin proportionate to a large
    akinetic territory argues for infarction instead.
  diagnosis_term:
    preferred_term: troponin measurement
    term:
      id: NCIT:C111327
      label: Troponin Measurement
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen patients had mildly elevated serum troponin I levels, but only 1 of 19 had angiographic evidence of clinically significant coronary disease."
    explanation: Shows the troponin-to-coronary-anatomy mismatch that the measurement is used to detect.
- name: Natriuretic peptide measurement
  description: >
    B-type natriuretic peptide or its N-terminal prohormone is markedly elevated, out of
    proportion to the troponin, and the ratio between them is a core discriminator built
    into the InterTAK diagnostic score.
  diagnosis_term:
    preferred_term: brain natriuretic peptide measurement
    term:
      id: NCIT:C74735
      label: Brain Natriuretic Peptide Measurement
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Takotsubo syndrome is frequently associated with a substantial increase in the plasma levels of B-type natriuretic peptide (BNP) and N-terminal prohormone of brain natriuretic peptide (NT-proBNP) reaching its peak approximately 24–48 h after symptom onset"
    explanation: States the substantial elevation the measurement is performed to detect, and its time course.
treatments:
- name: Angiotensin-converting enzyme inhibitor or angiotensin receptor blocker therapy
  description: >
    The only pharmacologic class with registry evidence of a survival signal in this
    syndrome, and the one associated with lower recurrence. The evidence is observational
    and propensity-matched rather than randomised, so it supports a preference rather than a
    proven benefit, but the asymmetry against beta-blockade in the same dataset is the
    reason these agents are usually the first long-term choice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  target_mechanisms:
  - target: Acute left ventricular systolic dysfunction
    treatment_effect: MODULATES
    description: >
      Afterload reduction and neurohormonal blockade support recovery of left ventricular
      function and are associated with improved survival.
    evidence:
    - reference: PMID:29850820
      reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The use of ACEi or ARB was associated with improved survival at 1-year follow-up even after propensity matching."
      explanation: The strongest available treatment-outcome association in the syndrome, reported by the consensus document from registry data.
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beta-blocker therapy after hospital discharge does not appear to prevent recurrence,2,144 whereas ACEi or ARB are associated with a lower prevalence of recurrence."
    explanation: Directly contrasts the two long-term options on recurrence, which is the basis for preferring renin-angiotensin blockade.
- name: Beta-adrenergic blockade
  description: >
    Mechanistically the most attractive drug in the syndrome and the one that has repeatedly
    failed to show benefit. Blocking the receptor through which the catecholamine surge acts
    ought to work, and in animal models combined alpha- and beta-blockade does attenuate the
    ballooning. In patients, registry data show no survival benefit and no reduction in
    recurrence, and acute use is constrained by bradycardia, hypotension, low ejection
    fraction, and the torsade risk of a prolonged QT. Beta-blockade does have a specific
    acute role in relieving dynamic outflow obstruction. The gap between the mechanism and
    the outcome is curated as an open controversy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Dynamic left ventricular outflow tract obstruction
    treatment_effect: INHIBITS
    description: >
      Slowing and reducing basal hypercontractility widens the outflow tract and lowers the
      gradient.
    evidence:
    - reference: PMID:29850820
      reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "beta-blockers may improve LVOTO, but are contraindicated in acute and severe heart failure with low LVEF, hypotension, and in those with bradycardia"
      explanation: States both the specific indication and the constraints that limit it.
  - target: Sympathoadrenal activation and catecholamine surge
    treatment_effect: INHIBITS
    description: >
      Receptor-level blockade of the catecholamine signal, the mechanistic rationale that
      clinical outcome data have not borne out.
    evidence:
    - reference: PMID:15240400
      reference_title: "Emotional stress-induced Tako-tsubo cardiomyopathy: animal model and molecular mechanism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immobilization stress (IMO) of rats can reproduce these ECG and LVG changes, both of which are normalized by combined blockade of alpha- and beta-adrenoceptors."
      explanation: The animal evidence that adrenoceptor blockade prevents the syndrome, which is the rationale; note it required combined alpha and beta blockade, not beta alone.
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, there was no evidence of any survival benefit for the use of beta-blockers.2 Moreover, one-third of patients experienced a TTS recurrence during beta-blockade2"
    explanation: Refutes the survival and recurrence-prevention rationale for beta-blockade despite its mechanistic appeal.
- name: Anticoagulation for left ventricular thrombus
  description: >
    Indicated for demonstrated apical thrombus, and considered for extensive apical akinesis
    with severely depressed function. The unusual feature is that the indication is
    self-limiting: as the apex recovers, the substrate disappears, so this is one of the few
    settings in which anticoagulation is started with a planned stop date.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_mechanisms:
  - target: Left ventricular mural thrombus
    treatment_effect: INHIBITS
    description: >
      Anticoagulation prevents propagation and embolisation of apical thrombus while the
      akinetic segment recovers.
    evidence:
    - reference: PMID:40365782
      reference_title: "High Mortality and Complications in Patients Admitted With Takotsubo Cardiomyopathy With More Than Double Mortality in Men Without Improvement in Outcome Over the Years."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Cardiogenic shock occurred in 6.6%, atrial fibrillation in 20.7%, cardiac arrest in 3.4%, congestive heart failure in 35.9%, and stroke in 5.3%."
      explanation: Quantifies the embolic burden that anticoagulation targets; PARTIAL because the cohort study reports the complication rate and not the effect of anticoagulation on it.
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although evidence is lacking, anticoagulation with intravenous/subcutaneous heparin would appear to be appropriate in such patients and post-discharge oral anticoagulation or antiplatelet therapy may be considered on an individual, per-patient basis."
    explanation: The consensus recommendation, stated with its own caveat that the evidence base for it is lacking, which is why this treatment is curated as rationally targeted rather than trial-proven.
- name: Diuretic therapy for pulmonary congestion
  description: >
    Standard management of the acute pulmonary oedema. Nitrates, which would otherwise be a
    natural companion, must be withheld if there is outflow tract obstruction, because
    reducing preload worsens the gradient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Acute left ventricular systolic dysfunction
    treatment_effect: MODULATES
    description: >
      Decongestion relieves the pulmonary oedema produced by the acute fall in systolic
      function.
    evidence:
    - reference: PMID:29850820
      reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diuretics are indicated in patients with pulmonary oedema."
      explanation: The consensus indication.
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nitroglycerin is useful to reduce LV and RV filling pressures and afterload in the case of acute heart failure; however, the administration of nitroglycerin in the presence of LVOTO has been found to worsen the pressure gradient"
    explanation: Documents the conditional nature of vasodilator use alongside diuresis in this syndrome.
- name: Mechanical circulatory support for refractory shock
  description: >
    For shock that does not respond, or that cannot be treated with inotropes because of
    outflow obstruction, temporary mechanical support bridges the patient through the days
    to weeks until the myocardium recovers. Device choice is dictated by the same
    physiology: a device that unloads the left ventricle is preferable, whereas
    veno-arterial extracorporeal support without unloading raises afterload and can worsen
    an outflow gradient.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: percutaneous ventricular assist device placement
    term:
      id: NCIT:C172592
      label: Percutaneous Ventricular Assist Device Placement
  target_mechanisms:
  - target: Cardiogenic shock
    treatment_effect: BYPASSES
    description: >
      Temporary circulatory support maintains systemic perfusion until spontaneous recovery
      of ventricular function, which in this syndrome takes days rather than months.
    evidence:
    - reference: PMID:32473281
      reference_title: "Mechanical circulatory support for Takotsubo syndrome: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Temporary mechanical circulatory support (MCS) appears attractive as bridge-to-recovery, but prospective studies are lacking."
      explanation: States the bridge-to-recovery rationale that this edge represents, together with the absence of prospective evidence for it.
    - reference: PMID:32473281
      reference_title: "Mechanical circulatory support for Takotsubo syndrome: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Median time on MCS was 3 (IQR: 2-7) days, with an overall survival of 94.6%."
      explanation: Quantifies both the short bridging interval the reversible physiology allows and the survival in supported patients, which is the outcome the bypass edge claims.
  evidence:
  - reference: PMID:32473281
    reference_title: "Mechanical circulatory support for Takotsubo syndrome: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall number of publications on MCS for TS increased over time, as did those using veno-arterial extracorporeal membrane oxygenation (V-A ECMO) and Impella, while those using intra-aortic balloon pump declined."
    explanation: Documents the shift in device selection toward ventricular unloading and away from the intra-aortic balloon pump, which is the device-choice claim in this treatment's description.
  - reference: PMID:32473281
    reference_title: "Mechanical circulatory support for Takotsubo syndrome: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently available clinical data support this approach. Prospective studies are needed to evaluate safety and efficacy of different devices as well as timing of MCS in this special patient population."
    explanation: The authors' own verdict, supportive but explicitly not prospective; PARTIAL because 93 pooled individual cases with no comparator cannot establish efficacy.
  - reference: PMID:32473281
    reference_title: "Mechanical circulatory support for Takotsubo syndrome: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For several reasons catecholamines, and especially inotropes, should be avoided in TS."
    explanation: States the reason mechanical rather than pharmacologic support is reached for in this syndrome, from a source about mechanical support rather than about drugs.
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In TTS patients treated with catecholamine drugs a 20% mortality has been reported81; although this may represent a selection bias due to the initial presentation of the patients."
    explanation: The catecholamine mortality signal that motivates seeking a non-pharmacologic alternative; PARTIAL because it is about drug therapy rather than about mechanical support, and the consensus flags its own confounding.
- name: Avoidance of catecholamine inotropes
  description: >
    A treatment defined by what is withheld. Giving catecholamines to a patient whose disease
    is caused by a catecholamine surge is mechanistically perverse, and in those with outflow
    obstruction it is haemodynamically harmful as well. Reported mortality among patients
    treated with catecholamines is high, though confounded by their being the sickest.
    Recognising this is arguably the single highest-yield management decision in the syndrome.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Sympathoadrenal activation and catecholamine surge
    treatment_effect: INHIBITS
    description: >
      Withholding exogenous catecholamines avoids compounding the causal exposure.
    evidence:
    - reference: PMID:29850820
      reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In TTS patients treated with catecholamine drugs a 20% mortality has been reported81"
      explanation: The outcome signal underlying the avoidance recommendation, reported with its own caveat about selection bias.
  evidence:
  - reference: PMID:22732314
    reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It is precipitated by extreme stress and can be triggered by intravenous catecholamine administration, particularly epinephrine."
    explanation: Establishes that exogenous catecholamine administration can itself cause the syndrome, which is the mechanistic basis for avoiding it as therapy.
- name: Cardiac rehabilitation
  description: >
    Structured exercise-based rehabilitation addresses the part of the illness that ejection
    fraction recovery does not: the persistent exercise intolerance, fatigue, and autonomic
    dysfunction of the chronic subclinical phase. It is one of the few interventions aimed
    at the enduring vulnerability rather than the acute event.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cardiac rehabilitation
    term:
      id: NCIT:C101234
      label: Cardiac Rehabilitation
  target_mechanisms:
  - target: Persistent subclinical myocardial dysfunction
    treatment_effect: MODULATES
    description: >
      Exercise training targets the residual functional impairment and autonomic
      dysregulation that outlast recovery of ejection fraction.
    evidence:
    - reference: PMID:35344411
      reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "many continue to have limiting symptoms despite restoration of left ventricular ejection fraction"
      explanation: Establishes the residual symptomatic target of rehabilitation; PARTIAL because the review documents the unmet need rather than the efficacy of rehabilitation against it.
  evidence:
  - reference: PMID:35344411
    reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "there is a lack of evidence-based interventions to treat the acute episode, to avoid recurrences, and to prevent major adverse cardiovascular events"
    explanation: Places rehabilitation in a field with no proven disease-modifying therapy; PARTIAL because it characterises the evidence vacuum rather than supporting this intervention.
- name: Psychological therapy and stress management
  description: >
    Given the trigger structure and the high burden of comorbid anxiety and mood disorder,
    psychological intervention is a rational secondary-prevention strategy and is under
    active investigation. It is not supported by outcome trials, and is curated here as a
    rationally targeted rather than an evidence-proven treatment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: psychotherapy
    term:
      id: NCIT:C15308
      label: Psychotherapy
  target_mechanisms:
  - target: Acute emotional or physical stressor
    treatment_effect: MODULATES
    description: >
      Reducing stress reactivity is intended to lower the probability that a future stressor
      precipitates a recurrence.
    evidence:
    - reference: PMID:26332547
      reference_title: "Clinical Features and Outcomes of Takotsubo (Stress) Cardiomyopathy."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "rates of neurologic or psychiatric disorders were higher (55.8% vs. 25.7%)"
      explanation: Establishes the psychiatric comorbidity that the intervention targets; PARTIAL because the registry documents the association and not the effect of treating it.
  evidence:
  - reference: PMID:30831580
    reference_title: "Altered limbic and autonomic processing supports brain-heart axis in Takotsubo syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe activation of the sympathetic nervous system with catecholamine release caused by a dysfunctional limbic system has been proposed as a potential mechanism."
    explanation: Supplies the brain-level rationale for a psychological intervention; PARTIAL because it is a proposed mechanism, not evidence for the therapy.
genetic:
- name: ADRB1
  gene_term:
    preferred_term: ADRB1
    term:
      id: hgnc:285
      label: ADRB1
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >
    Beta1-adrenergic receptor, examined in candidate-gene association studies as a plausible
    modifier of individual susceptibility to a catecholamine surge. Associations have not
    replicated. Curated here as an investigated candidate with an unresolved relationship to
    disease rather than as a susceptibility locus: no variant in this gene has reached
    replicated genome-wide significance for takotsubo susceptibility, and no clinical gene
    panel exists. Recorded to document what has been investigated, not to assert an
    association.
- name: ADRB2
  gene_term:
    preferred_term: ADRB2
    term:
      id: hgnc:286
      label: ADRB2
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >
    Beta2-adrenergic receptor, the receptor through which the leading molecular mechanism
    operates. That makes it the strongest a priori candidate gene in the syndrome, which is
    exactly why the absence of a replicated genetic association is informative rather than
    merely null. Candidate-gene studies have not produced a replicated association.
- name: GRK5
  gene_term:
    preferred_term: GRK5

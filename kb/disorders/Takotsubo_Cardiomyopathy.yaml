  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >
    G-protein-coupled receptor kinase 5, which phosphorylates and desensitises adrenergic
    receptors and could in principle set the threshold at which the receptor switch occurs.
    Candidate-gene status only, motivated by the receptor-desensitisation step of the

name: Takotsubo Cardiomyopathy
creation_date: '2026-08-09T00:00:00Z'
category: Complex
description: >
  Takotsubo cardiomyopathy is an acute, largely reversible heart failure syndrome in which
  an emotional or physical stressor precipitates severe regional left ventricular
  dysfunction in the absence of obstructive coronary disease sufficient to explain it. The
  wall-motion abnormality is circumferential and crosses coronary territories, most often
  ballooning the apex while the base contracts vigorously, which is the feature that
  separates it from infarction and gives the syndrome its name. Presentation is
  indistinguishable from acute coronary syndrome at the bedside: chest pain, ST-segment
  elevation, and troponin release. The mechanism is catecholamine-driven, and the leading
  molecular account is a concentration-dependent switch of beta2-adrenergic receptor
  coupling from stimulatory Gs to inhibitory Gi, which converts a positive inotropic
  signal into a negative one precisely where beta2-receptor density is highest. Direct
  catecholamine cardiotoxicity, coronary microvascular dysfunction, a macrophage
  inflammatory infiltrate, and altered central limbic-autonomic processing all contribute,
  and no single one explains the whole picture. Ejection fraction usually normalises within
  weeks, but the syndrome is not benign: in-hospital mortality is comparable to myocardial
  infarction, subclinical dysfunction persists in many survivors, and no treatment has been
  shown in randomised trials to alter the course.
disease_term:
  preferred_term: Takotsubo cardiomyopathy
  term:
    id: MONDO:0019018
    label: Tako-tsubo cardiomyopathy
parents:
- Cardiomyopathy
synonyms:
- Takotsubo syndrome
- Stress cardiomyopathy
- Stress-induced cardiomyopathy
- Apical ballooning syndrome
- Broken heart syndrome
- Ampulla cardiomyopathy
- Transient left ventricular apical ballooning syndrome
pathophysiology:
- name: Acute emotional or physical stressor
  description: >
    The initiating event is an acute stressor: bereavement, fear, anger, or interpersonal
    conflict on the emotional side; surgery, sepsis, respiratory failure, seizure,
    intracranial haemorrhage, or trauma on the physical side. Contemporary registry data
    overturned the original "broken heart" framing by showing that physical triggers are
    at least as common as emotional ones, and that patients with physical or neurologic
    triggers do worse. A minority of cases have no identifiable trigger at all, which is
    itself an argument against a purely reactive model.
  biological_scale: ORGANISM
  role: trigger
  downstream:
  - target: Sympathoadrenal activation and catecholamine surge
    causal_link_type: DIRECT
    description: >
      The stressor activates the sympathetic nervous system and adrenal medulla, releasing
      catecholamines into the circulation and from cardiac sympathetic nerve terminals.
    evidence:
    - reference: PMID:15703419
      reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Emotional stress can precipitate severe, reversible left ventricular dysfunction in patients without coronary disease. Exaggerated sympathetic stimulation is probably central to the cause of this syndrome."
      explanation: Establishes the stressor-to-sympathetic-surge link as the causal chain's first step, in the study that defined it.
  evidence:
  - reference: PMID:26332547
    reference_title: "Clinical Features and Outcomes of Takotsubo (Stress) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Emotional triggers were not as common as physical triggers"
    explanation: International Takotsubo Registry finding in 1750 patients that reversed the prior assumption that emotional stress dominates.
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We evaluated 19 patients who presented with left ventricular dysfunction after sudden emotional stress."
    explanation: The defining case series, in which the emotional stressor is the enrolment criterion.
- name: Sympathoadrenal activation and catecholamine surge
  description: >
    Plasma epinephrine, norepinephrine, and dopamine rise steeply, to levels several-fold
    above those measured in patients with severe myocardial infarction and pulmonary
    oedema. The comparison matters: it is not simply that catecholamines are elevated in a
    sick patient, but that they are elevated far beyond what comparable haemodynamic
    stress produces. Endogenous catecholamine excess from pheochromocytoma, and iatrogenic
    epinephrine administration, reproduce the syndrome, which is the strongest available
    argument that the surge is causal rather than reactive.
  biological_scale: ORGANISM
  role: mechanism
  biological_processes:
  - preferred_term: cellular response to catecholamine stimulus
    term:
      id: GO:0071870
      label: cellular response to catecholamine stimulus
    modifier: INCREASED
  cell_types:
  - preferred_term: Adrenal medullary chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  downstream:
  - target: Beta2-adrenergic receptor switch from Gs to Gi coupling
    causal_link_type: DIRECT
    description: >
      Supraphysiologic epinephrine concentrations drive the beta2-adrenergic receptor into
      inhibitory G-protein coupling.
    evidence:
    - reference: PMID:22732314
      reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We describe an in vivo rat model in which a high intravenous epinephrine, but not norepinephrine, bolus produces the characteristic reversible apical depression of myocardial contraction coupled with basal hypercontractility."
      explanation: Shows a high epinephrine bolus is sufficient to produce the takotsubo contraction pattern, and that norepinephrine is not, implicating the epinephrine-preferring beta2 receptor.
  - target: Cardiomyocyte calcium overload and oxidative stress
    causal_link_type: DIRECT
    description: >
      Sustained adrenergic overstimulation of cardiomyocytes drives intracellular calcium
      loading and reactive oxygen species generation.
    evidence:
    - reference: PMID:33602474
      reference_title: "Pathophysiology of Takotsubo Syndrome: JACC State-of-the-Art Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "including review of the evidence for microvascular dysfunction, myocardial beta-adrenergic signaling, inflammation, and electrophysiology"
      explanation: Names beta-adrenergic signalling on the myocardium as one of the established mechanistic arms; PARTIAL because the review abstract enumerates the arms rather than demonstrating the calcium step.
  - target: Coronary microvascular dysfunction
    causal_link_type: DIRECT
    description: >
      Catecholamine excess constricts and impairs the coronary microcirculation.
    evidence:
    - reference: PMID:33602474
      reference_title: "Pathophysiology of Takotsubo Syndrome: JACC State-of-the-Art Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "including review of the evidence for microvascular dysfunction, myocardial beta-adrenergic signaling, inflammation, and electrophysiology"
      explanation: Lists microvascular dysfunction as an evidenced mechanistic arm alongside adrenergic signalling; PARTIAL because the abstract asserts the arm exists rather than the specific catecholamine-to-microvessel edge.
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma catecholamine levels at presentation were markedly higher among patients with stress-induced cardiomyopathy than among those with Killip class III myocardial infarction"
    explanation: The comparison that makes the surge specific to the syndrome rather than to critical illness generally.
- name: Beta2-adrenergic receptor switch from Gs to Gi coupling
  description: >
    The leading molecular explanation for why the apex fails while the base becomes
    hypercontractile. At physiologic epinephrine levels the beta2-adrenergic receptor
    couples to stimulatory Gs and is inotropic. At the supraphysiologic levels reached in
    a catecholamine surge the receptor switches to inhibitory Gi, converting the same
    ligand into a negative inotropic and cardioprotective signal. Because beta2-receptor
    density and responsiveness are highest in apical cardiomyocytes, the switch is
    expressed as regional apical cardiodepression. Blocking Gi with pertussis toxin
    abolishes the apical depression, which is the causal test.
  biological_scale: MOLECULAR
  role: mechanism
  molecular_functions:
  - preferred_term: beta2-adrenergic receptor activity
    term:
      id: GO:0004941
      label: beta2-adrenergic receptor activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    term:
      id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    modifier: INCREASED
  cell_types:
  - preferred_term: Apical cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: Left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  downstream:
  - target: Reversible regional wall motion abnormality
    causal_link_type: DIRECT
    description: >
      Negative inotropy confined to the beta2-receptor-rich apex produces apical akinesis
      with preserved or exaggerated basal contraction.
    evidence:
    - reference: PMID:22732314
      reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "β(2)AR number and functional responses were greater in isolated apical cardiomyocytes than in basal cardiomyocytes, which confirmed the higher apical sensitivity and response to circulating epinephrine."
      explanation: Supplies the regional gradient that converts a systemic hormonal signal into a regional contractile defect.
  evidence:
  - reference: PMID:22732314
    reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The effect is prevented via G(i) inactivation by pertussis toxin pretreatment."
    explanation: The interventional test, in which removing Gi signalling removes the apical depression, establishing the switch as causal rather than correlated.
  - reference: PMID:22732314
    reference_title: "High levels of circulating epinephrine trigger apical cardiodepression in a beta2-adrenergic receptor/Gi-dependent manner: a new model of Takotsubo cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies demonstrated high-dose epinephrine can induce direct cardiomyocyte cardiodepression and cardioprotection in a β(2)AR-Gi-dependent manner."
    explanation: Shows the switch operates at the level of the isolated cardiomyocyte, independent of vascular or neural intermediaries.
- name: Cardiomyocyte calcium overload and oxidative stress
  description: >
    Beta-adrenergic overstimulation loads the cardiomyocyte with calcium, generates
    reactive oxygen species, and impairs mitochondrial energetics. This is the classical
    catecholamine cardiotoxicity mechanism, shared with pheochromocytoma crisis and
    subarachnoid haemorrhage, and it is what produces the histologic lesion below. It is a
    parallel arm to the receptor switch rather than a consequence of it: the switch
    explains the regional distribution, this explains the tissue injury.
  biological_scale: CELLULAR
  role: mechanism
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  downstream:
  - target: Contraction band necrosis and focal myocytolysis
    causal_link_type: DIRECT
    description: >
      Calcium overload drives hypercontraction of sarcomeres, producing the contraction
      band lesion.
    evidence:
    - reference: PMID:15703419
      reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Endomyocardial biopsy showed mononuclear infiltrates and contraction-band necrosis."
      explanation: Human tissue confirmation that the injury is the calcium-overload contraction band lesion, not ischaemic coagulative necrosis.
  evidence:
  - reference: PMID:35344411
    reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Catecholamine-induced myocardial injury is the most established and well-known theory, but this does not explain all the clinical features and presentations of the condition, and numerous other pathways and abnormalities are emerging."
    explanation: States catecholamine cardiotoxicity as the best-established mechanism while explicitly flagging it as incomplete, which is why this node sits parallel to the others rather than upstream of them.
- name: Contraction band necrosis and focal myocytolysis
  description: >
    The histologic signature, seen on endomyocardial biopsy: hypercontracted sarcomeres
    with dense eosinophilic transverse bands, focal myocyte dropout, and a mononuclear
    rather than neutrophilic infiltrate. It is qualitatively different from the coagulative
    necrosis of infarction, and it is reversible, which is the tissue-level reason the
    ventricle recovers. The same lesion appears in pheochromocytoma and in neurogenic
    stunned myocardium, tying the three catecholamine-excess states together.
  biological_scale: TISSUE
  role: consequence
  locations:
  - preferred_term: Left ventricular myocardium
    term:
      id: UBERON:0006566
      label: left ventricle myocardium
  downstream:
  - target: Myocardial macrophage inflammatory infiltrate
    causal_link_type: DIRECT
    description: >
      Injured and dying myocytes recruit macrophages into the myocardium.
    evidence:
    - reference: PMID:30586731
      reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We demonstrate for the first time that takotsubo cardiomyopathy is characterized by a myocardial macrophage inflammatory infiltrate, changes in the distribution of monocyte subsets, and an increase in systemic proinflammatory cytokines."
      explanation: Establishes the macrophage infiltrate in vivo by iron-oxide-enhanced cardiac magnetic resonance, in a matched-control study.
  evidence:
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endomyocardial biopsy showed mononuclear infiltrates and contraction-band necrosis."
    explanation: Direct human histology from the defining case series.
- name: Coronary microvascular dysfunction
  description: >
    Coronary flow reserve is impaired and microcirculatory resistance is elevated in the
    acute phase despite angiographically unobstructed epicardial arteries. Whether this is
    a primary driver of the stunning or a consequence of the same catecholamine surge acting
    on the microvasculature is unresolved, and the alpha-adrenergic receptors that dominate
    the coronary microcirculation are one proposed reason beta-blockade alone fails to
    prevent recurrence.
  biological_scale: TISSUE
  role: mechanism
  cell_types:
  - preferred_term: Cardiac endothelial cell
    term:
      id: CL:0010008
      label: cardiac endothelial cell
  downstream:
  - target: Reversible regional wall motion abnormality
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Regional hypoperfusion from microvascular constriction contributes to the regional
      contractile failure, additively with the receptor switch.
    evidence:
    - reference: PMID:33602474
      reference_title: "Pathophysiology of Takotsubo Syndrome: JACC State-of-the-Art Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "including review of the evidence for microvascular dysfunction, myocardial beta-adrenergic signaling, inflammation, and electrophysiology"
      explanation: The state-of-the-art review treats microvascular dysfunction as an evidenced contributor to the wall-motion abnormality; PARTIAL because its relative causal weight is explicitly unsettled.
  evidence:
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that other receptors such as alpha-receptors, that are more prevalent in the coronary microcirculation, might be involved"
    explanation: The consensus statement's own inference from beta-blocker failure, pointing at alpha-adrenergic control of the coronary microcirculation; PARTIAL because it is an inference offered as hypothesis.
- name: Myocardial macrophage inflammatory infiltrate
  description: >
    Iron-oxide-enhanced cardiac magnetic resonance shows macrophage accumulation in both
    ballooning and non-ballooning left ventricular segments, accompanied by a shift in
    circulating monocyte subsets and raised interleukin-6 and CXCL1. Two findings make this
    more than an epiphenomenon of injury. First, the infiltrate is present in segments that
    are contracting normally, so it is not simply a reaction to regional akinesis. Second,
    the systemic inflammatory changes persist for months after the myocardial signal has
    resolved, which is the best current mechanistic candidate for the persistent subclinical
    dysfunction seen in survivors.
  biological_scale: TISSUE
  role: mechanism
  cell_types:
  - preferred_term: Cardiac macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Classical monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Persistent subclinical myocardial dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      A low-grade chronic inflammatory state outlasting the acute event is the proposed
      substrate for continuing symptoms after ejection fraction recovers.
    evidence:
    - reference: PMID:30586731
      reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Many of these changes persisted for at least 5 months, suggesting a low-grade chronic inflammatory state."
      explanation: Documents persistence of the systemic inflammatory changes well beyond the acute episode.
  evidence:
  - reference: PMID:30586731
    reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with takotsubo cardiomyopathy had greater USPIO enhancement (expressed as the difference between pre-USPIO and post-USPIO T2*) in both ballooning"
    explanation: Shows the macrophage signal is present in ballooning segments; the same sentence continues to report it in non-ballooning segments too.
  - reference: PMID:30586731
    reference_title: "Myocardial and Systemic Inflammation in Acute Stress-Induced (Takotsubo) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum interleukin-6 (23.1±4.5 pg/mL versus 6.5±5.8 pg/mL; P<0.001) and chemokine (C-X-C motif) ligand 1 (1903±168 pg/mL versus 1272±177 pg/mL; P=0.01) concentrations and classic CD14++CD16- monocytes (90±0.5% versus 87±0.9%; P=0.01) were also increased"
    explanation: Quantifies the systemic inflammatory arm against matched controls.
- name: Central limbic and autonomic network hypoconnectivity
  description: >
    Resting-state functional magnetic resonance imaging in takotsubo survivors shows
    reduced connectivity in both sympathetic- and parasympathetic-associated subnetworks,
    involving amygdala, hippocampus, insula, and cingulate cortex. The direction of
    causation is the open question and is curated as such: these are the regions that
    generate and regulate the autonomic outflow, so reduced integration is a plausible
    predisposing lesion, but the imaging is done after the cardiac event, so it is equally
    compatible with the event having altered the brain.
  biological_scale: ORGANISM
  role: mechanism
  downstream:
  - target: Sympathoadrenal activation and catecholamine surge
    causal_link_type: DIRECT
    description: >
      Impaired central autonomic integration is proposed to permit an unrestrained
      sympathetic discharge in response to a stressor.
    evidence:
    - reference: PMID:30831580
      reference_title: "Altered limbic and autonomic processing supports brain-heart axis in Takotsubo syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe activation of the sympathetic nervous system with catecholamine release caused by a dysfunctional limbic system has been proposed as a potential mechanism."
      explanation: States the proposed brain-to-heart edge; PARTIAL because the study demonstrates the connectivity abnormality and not the temporal direction.
  evidence:
  - reference: PMID:30831580
    reference_title: "Altered limbic and autonomic processing supports brain-heart axis in Takotsubo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found parasympathetic- and sympathetic-associated subnetworks both showing reduced resting state functional connectivity in TTS patients compared with controls."
    explanation: The primary finding, in 15 takotsubo patients against 39 healthy controls.
  - reference: PMID:30831580
    reference_title: "Altered limbic and autonomic processing supports brain-heart axis in Takotsubo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Important brain regions constituting parasympathetic- and sympathetic-associated subnetworks included the amygdala, hippocampus, and insula as well as cingulate, parietal, temporal, and cerebellar regions."
    explanation: Localises the abnormality to the limbic-autonomic regions that generate sympathetic outflow.
- name: Reversible regional wall motion abnormality
  description: >
    The defining lesion: a circumferential regional wall-motion abnormality that extends
    beyond the territory of any single epicardial coronary artery. The apical-ballooning
    variant, with akinetic apex and hypercontractile base, is the commonest, but
    mid-ventricular, basal ("reverse"), and focal variants exist and a patient who recurs
    often does so in a different pattern. The circumferential distribution is what makes
    the diagnosis at ventriculography, because no coronary occlusion produces it.
  biological_scale: TISSUE
  role: consequence
  locations:
  - preferred_term: Left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  downstream:
  - target: Acute left ventricular systolic dysfunction
    causal_link_type: DIRECT
    description: >
      Loss of contraction over a large contiguous territory drops global ejection fraction.
    evidence:
    - reference: PMID:15703419
      reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe left ventricular dysfunction was present on admission"
      explanation: Documents that the regional abnormality translates into severe global systolic impairment at presentation.
  - target: Dynamic left ventricular outflow tract obstruction
    causal_link_type: DIRECT
    description: >
      Basal hypercontractility with an akinetic apex accelerates flow through a narrowed
      outflow tract and draws the mitral leaflet forward.
    evidence:
    - reference: PMID:29850820
      reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Takotsubo syndrome patients with cardiogenic shock, in particular those with apical ballooning should be promptly evaluated for the presence of LVOTO, which occurs in about 20% of cases."
      explanation: Ties outflow obstruction specifically to the apical-ballooning geometry and quantifies its frequency.
  - target: Left ventricular mural thrombus
    causal_link_type: DIRECT
    description: >
      Blood stagnating in the akinetic apical cavity forms thrombus.
    evidence:
    - reference: PMID:40365782
      reference_title: "High Mortality and Complications in Patients Admitted With Takotsubo Cardiomyopathy With More Than Double Mortality in Men Without Improvement in Outcome Over the Years."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Cardiogenic shock occurred in 6.6%, atrial fibrillation in 20.7%, cardiac arrest in 3.4%, congestive heart failure in 35.9%, and stroke in 5.3%."
      explanation: Quantifies the stroke rate that apical thrombus embolisation contributes to; PARTIAL because the database report does not separately attribute strokes to mural thrombus.
  evidence:
  - reference: PMID:33602474
    reference_title: "Pathophysiology of Takotsubo Syndrome: JACC State-of-the-Art Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a typical pattern of circumferential left ventricular wall motion abnormalities that usually involve the apical and midventricular myocardium"
    explanation: Defines the circumferential, apical-predominant distribution that separates the lesion from infarction.
- name: Acute left ventricular systolic dysfunction
  description: >
    Ejection fraction at presentation is severely reduced, typically well below that of
    matched acute coronary syndrome patients, and drives the clinical syndrome of acute
    heart failure, pulmonary oedema, and in a minority cardiogenic shock. Recovery is the
    rule and is fast, usually complete within two to four weeks.
  biological_scale: ORGANISM
  role: consequence
  downstream:
  - target: Persistent subclinical myocardial dysfunction
    causal_link_type: DIRECT
    description: >
      Recovery of ejection fraction is not recovery of myocardial function; strain and
      energetic abnormalities outlast it.
    evidence:
    - reference: PMID:35344411
      reference_title: "Takotsubo Syndrome: Pathophysiology, Emerging Concepts, and Clinical Implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recent studies have confirmed that patients with takotsubo syndrome have persistent subtle ongoing cardiac dysfunction, and many continue to have limiting symptoms despite restoration of left ventricular ejection fraction"
      explanation: States the dissociation between recovered ejection fraction and recovered function explicitly.
  evidence:
  - reference: PMID:26332547
    reference_title: "Clinical Features and Outcomes of Takotsubo (Stress) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mean left ventricular ejection fraction was markedly lower (40.7±11.2% vs. 51.5±12.3%)"
    explanation: Registry comparison against age- and sex-matched acute coronary syndrome patients, showing the systolic impairment is more severe than in the condition it mimics.
  - reference: PMID:15703419
    reference_title: "Neurohumoral features of myocardial stunning due to sudden emotional stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rapidly resolved in all patients"
    explanation: Establishes reversibility as the defining course.
- name: Dynamic left ventricular outflow tract obstruction
  description: >
    Present in roughly one in five patients and the single most important reason takotsubo
    is not managed like other acute heart failure. The obstruction is dynamic and
    preload-dependent, so inotropes and nitrates worsen it, and it is the mechanism by
    which standard heart-failure reflexes make a shocked takotsubo patient worse rather
    than better. It must be looked for before catecholamines are given, not after.
  biological_scale: ORGANISM
  role: consequence
  downstream:
  - target: Cardiogenic shock
    causal_link_type: DIRECT
    description: >
      Obstruction to ejection compounds the systolic failure and precipitates shock.
    evidence:
    - reference: PMID:29850820
      reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Takotsubo syndrome patients with cardiogenic shock, in particular those with apical ballooning should be promptly evaluated for the presence of LVOTO"
      explanation: The consensus recommendation exists because outflow obstruction is a treatable contributor to shock in this population.
  evidence:
  - reference: PMID:32473281
    reference_title: "Mechanical circulatory support for Takotsubo syndrome: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiogenic shock occurs in 10%-15% of patients with Takotsubo syndrome (TS)."
    explanation: Independent estimate of shock incidence, higher than the national inpatient figure elsewhere in this entry, and worth recording as a range rather than a single number.
  - reference: PMID:29850820
    reference_title: "International Expert Consensus Document on Takotsubo Syndrome (Part II): Diagnostic Workup, Outcome, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the administration of nitroglycerin in the presence of LVOTO has been found to worsen the pressure gradient and therefore should be avoided in this scenario"
    explanation: Documents the therapeutic trap that makes recognising the obstruction consequential.
- name: Left ventricular mural thrombus
  description: >
    Thrombus forms in the akinetic apex during the acute phase and is the principal
    cardioembolic source in a syndrome that is otherwise not thrombotic. Because the
    akinesis is temporary, so is the indication for anticoagulation, which is an unusual
    situation and a recognised source of both under- and over-treatment.

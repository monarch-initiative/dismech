- name: Paranodal Axoglial Junction Disruption
  description: >-
    Without NF155 the septate-like junction that anchors the myelin loops to
    the axon on either side of the node does not assemble; CASPR1 and
    contactin-1 are lost from the paranode. The junction is needed to segregate
    nodal sodium channels from juxtaparanodal potassium channels and to support
    myelin attachment and the migration of myelinating processes along the
    axon.
  biological_scale: CELLULAR

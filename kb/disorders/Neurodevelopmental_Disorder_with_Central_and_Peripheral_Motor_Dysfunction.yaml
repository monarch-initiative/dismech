name: Neurodevelopmental Disorder with Central and Peripheral Motor Dysfunction
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
synonyms:
- NEDCPMD
- NFASC-related neurodevelopmental disorder
- neurofascin deficiency
description: >-
  Neurodevelopmental disorder with central and peripheral motor dysfunction
  (NEDCPMD; OMIM:618356) is an ultra-rare autosomal recessive nodopathy caused
  by bi-allelic variants in NFASC, which encodes neurofascin, an L1-family
  immunoglobulin-superfamily cell adhesion molecule. Alternative splicing of
  NFASC gives a glial isoform (NF155), the myelin-side partner of the axonal
  contactin-1/CASPR1 complex at the paranodal axoglial junction, and neuronal
  isoforms (NF186 and NF140) that cluster voltage-gated sodium channels at the
  node of Ranvier and stabilise the axon initial segment. Most reported
  variants impair NF155, which disrupts the paranodal junction. Affected
  children present with neonatal or early-infantile hypotonia, severe global
  developmental delay, intellectual disability, absent or minimal speech,
  weakness with areflexia, and in many cases an early-onset demyelinating
  peripheral neuropathy with slow nerve conduction and loss of large myelinated
  fibres. Brain MRI shows cerebral white matter loss with corpus callosum and
  brainstem atrophy in the more severe cases, or cerebellar atrophy. A small
  number of families carry variants that spare NF155 but abolish full-length
  NF186 or reduce total neurofascin; their disease is dominated by a
  progressive cerebellar ataxia with milder cognitive involvement. Fewer than
  twenty affected individuals have been reported, and no disease-modifying
  treatment exists.
disease_term:
  preferred_term: neurodevelopmental disorder with central and peripheral motor dysfunction
  term:
    id: MONDO:0032698
    label: neurodevelopmental disorder with central and peripheral motor dysfunction
parents:
- Neurodevelopmental Disorder
- Peripheral Neuropathy
notes: >-
  No GeneReviews chapter exists for this disorder; a PubMed search for NFASC or
  neurofascin restricted to genereviews[book] returned no records (2026-10-15).

  HPO has no term for auditory neuropathy spectrum disorder; an OLS search of
  HP for "auditory neuropathy" returned no results (2026-10-15), so that
  phenotype is bound to Hearing impairment with the specific finding carried in
  preferred_term.

  The two isoform-selective genotypes are recorded as has_subtypes rows rather
  than separate entries: MONDO and OMIM treat the NFASC disease as one entity,
  and the number of reported families (one or two per isoform class) is too
  small to establish distinct first-line management.
has_subtypes:
- name: NF155-predominant
  display_name: NF155 (glial isoform)-predominant NFASC disease
  description: >-
    Variants that abolish or destabilise the glial NF155 isoform, including the
    NF155-specific nonsense variant p.Arg831Ter in the third fibronectin type
    III repeat, the frameshift p.Pro939Ter, and missense variants in the
    fibronectin type III repeats. Neuronal NF186 is preserved at the node. This
    is the common presentation: neonatal hypotonia, severe developmental delay,
    areflexia and demyelinating neuropathy with loss of the paranodal junction.
  evidence:
  - reference: PMID:30124836
    reference_title: "Homozygous mutation in the Neurofascin gene affecting the glial isoform of Neurofascin causes severe neurodevelopment disorder with hypotonia, amimia and areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant creates a premature stop codon in 3 out of four NFASC human
      transcripts and is predicted to specifically eliminate Nfasc155 leaving
      neuronal Neurofascin intact.
    explanation: >-
      Defines the isoform-selective genotype: a variant that removes the glial
      isoform and spares the neuronal one.
- name: NF186-predominant
  display_name: NF186 (neuronal isoform)-predominant NFASC disease
  description: >-
    Variants that abolish full-length neuronal NF186 (the exon 26 splice
    acceptor variant c.3020-1G>A) or reduce total neurofascin through a
    transmembrane-domain missense variant (p.Val1122Glu). The presentation is a
    childhood-onset, progressive cerebellar ataxia with dysarthria, nystagmus
    and weakness, normal or near-normal cognition in some individuals, and
    normal or only mildly slowed nerve conduction.
  evidence:
  - reference: PMID:31608123
    reference_title: "Ataxia in Patients With Bi-Allelic NFASC Mutations and Absence of Full-Length NF186."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified a novel homozygous splice mutation (c.3020-1G > A) in
      neurofascin (NFASC). In RNA extracted from fibroblasts, we showed that the
      mutation resulted in inframe skipping of exon 26, with a deprived
      expression of the full-length transcript that corresponds to NFASC
      isoform NF186.
    explanation: >-
      Defines the neuronal-isoform genotype: selective loss of full-length
      NF186.
inheritance:
- name: Autosomal recessive
  description: >-
    All reported individuals carry homozygous NFASC variants, mostly from
    consanguineous or founder families; heterozygous parents are unaffected.
    Expressivity varies with which isoform the variant affects, from a severe
    infantile neurodevelopmental disorder with demyelinating neuropathy to a
    childhood-onset ataxia with mild cognitive involvement.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:31501903
    reference_title: "Biallelic mutations in neurofascin cause neurodevelopmental impairment and peripheral demyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who were found by exome or genome sequencing to carry one frameshift and
      four different homozygous non-synonymous variants in NFASC
    explanation: >-
      The largest case series reports homozygous NFASC variants in all ten
      affected individuals from six families.
  - reference: PMID:30124836
    reference_title: "Homozygous mutation in the Neurofascin gene affecting the glial isoform of Neurofascin causes severe neurodevelopment disorder with hypotonia, amimia and areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A family study using amplicon deep sequencing (ADS) and Sanger
      sequencing confirmed the homozygosity for rs755160624 in the proband and
      showed the heterozygous carrier status of her healthy parents
    explanation: >-
      Homozygous proband with healthy heterozygous parents, consistent with
      autosomal recessive inheritance.
pathophysiology:
- name: Bi-allelic NFASC Loss of Function
  description: >-
    Homozygous NFASC variants (nonsense, frameshift, splice and missense)
    remove or reduce one or more neurofascin isoforms. Which isoform is lost
    depends on where the variant lies relative to the alternatively spliced
    exons, and that determines which of the two downstream branches dominates.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NFASC
    term:
      id: hgnc:29866
      label: NFASC
  molecular_functions:
  - preferred_term: cell adhesion molecule binding
    term:
      id: GO:0050839
      label: cell adhesion molecule binding
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30850329
    reference_title: "Neurofascin (NFASC) gene mutation causes autosomal recessive ataxia with demyelinating neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation, affecting a highly conserved hydrophobic transmembrane
      domain residue, led to significant loss of Neurofascin protein in the
      iPSC-derived neurons of affected siblings.
    explanation: >-
      A homozygous missense variant reduces neurofascin protein in
      patient-derived neurons, a loss-of-function mechanism.
  - reference: PMID:31501903
    reference_title: "Biallelic mutations in neurofascin cause neurodevelopmental impairment and peripheral demyelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cell aggregation studies revealed a severely impaired
      Nfasc155-CNTN1/CASPR1 complex interaction as a result of the identified
      variants.
    explanation: >-
      Patient variants impair neurofascin binding to its adhesion partners
      contactin-1 and CASPR1, which grounds the cell adhesion molecule binding
      activity recorded as decreased on this node.
